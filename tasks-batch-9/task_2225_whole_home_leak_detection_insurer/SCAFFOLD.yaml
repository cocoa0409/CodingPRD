scenario: "2225. Whole-Home Leak Detection & Insurer IoT Discount Program (Flo by Moen): device install verification & baseline pressure/flow learning, anomaly classification (drip, running fixture, catastrophic burst) and auto-shutoff policy, homeowner override and vacation-mode rules, insurer premium credit eligibility tied to device health uptime, alert escalation to homeowner then emergency contact, false-positive tuning and irrigation schedule exclusion, warranty and water-damage reimbursement claim coordination, device transfer at property sale and account deactivation"
domain_name: "whole-home-leak-detection-insurer-iot-discount"
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  # flat: peer entities linked by explicit FK fields; no entity is nested more
  # than one segment deep in a URL, and every cross-entity link is a declared
  # `FK -> Parent.id` field resolved through filtered-list or sub-resource GETs.
  state_machine_shape: parallel
  # Device carries three independent state dimensions (lifecycle_state x
  # valve_state x monitor_mode) that evolve independently on the same row;
  # BaselineProfile and ReimbursementClaim are cyclic; AnomalyEvent branches.
  relationship_patterns:
    - one_to_many        # Homeowner -> Property -> Device -> TelemetryReading
    - cross_aggregate    # CreditAttestation reads Device/TelemetryReading state across the policy aggregate
    - polymorphic        # ReimbursementClaim covers WARRANTY_DEVICE and WATER_DAMAGE with different payout algebra
  role_model: segregation_of_duties
  # The InstallerTech X-User-ID that verified a device's install may not be the
  # ClaimsAdjuster X-User-ID that approves a warranty claim on that device.
  consistency_model: immediate

entities:
  - name: Homeowner
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login/contact email; unique across Homeowners", constraints: "lowercase, unique" }
      - { name: full_name, type: string, source: input, description: "Account holder name", constraints: "1..120 chars" }
      - { name: phone_e164, type: string, source: input, description: "Primary mobile number for stage-1 leak alerts", constraints: "E.164, e.g. +14155550100" }
      - { name: notification_channel, type: enum, source: input, default: SMS, description: "Channel used for stage-1 homeowner alerts", constraints: "SMS|EMAIL|PUSH" }
      - { name: account_state, type: enum, source: system, default: ACTIVE, description: "ACTIVE on create; DEACTIVATED by POST /homeowners/{id}/deactivate", constraints: "ACTIVE|DEACTIVATED" }
      - { name: deactivated_at, type: datetime, source: system, description: "Logical-clock instant the account was deactivated; null while ACTIVE", default: null }
      - { name: owned_property_count, type: integer, source: computed, description: "Count of Property rows with homeowner_id == this id and property_state IN {ACTIVE, TRANSFER_PENDING}", default: 0 }

  - name: EmergencyContact
    parent: Homeowner
    common_fields: true
    fields:
      - { name: homeowner_id, type: string, source: input, description: "FK -> Homeowner.id; the account this contact escalates for" }
      - { name: full_name, type: string, source: input, description: "Contact display name", constraints: "1..120 chars" }
      - { name: phone_e164, type: string, source: input, description: "Number dialled at escalation stage 2", constraints: "E.164" }
      - { name: priority_rank, type: integer, source: input, description: "Escalation order; 1 is called first", constraints: "1..5; unique per homeowner among status == ACTIVE rows" }
      - { name: verification_state, type: enum, source: system, default: PENDING, description: "VERIFIED when created with verify_immediately == true (SMS opt-in confirmed); only VERIFIED contacts are selectable at stage 2", constraints: "PENDING|VERIFIED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE on create; REMOVED by the homeowner-deactivation cascade", constraints: "ACTIVE|REMOVED" }
      - { name: last_notified_at, type: datetime, source: system, description: "Logical-clock instant this contact was last dialled by an escalation sweep; null when never", default: null }

  - name: Property
    parent: Homeowner
    common_fields: true
    fields:
      - { name: homeowner_id, type: string, source: input, description: "FK -> Homeowner.id; current owner of record; rewritten by DeviceTransfer acceptance" }
      - { name: address_line1, type: string, source: input, description: "Street address", constraints: "1..160 chars" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "US state code", constraints: "2 uppercase letters" }
      - { name: postal_code, type: string, source: input, description: "Postal code", constraints: "5 digits" }
      - { name: year_built, type: integer, source: input, description: "Construction year; used by insurer underwriting notes", constraints: "1850..2026" }
      - { name: irrigation_present, type: boolean, source: input, default: false, description: "True when the property has an irrigation system; gates IrrigationWindow creation" }
      - { name: property_state, type: enum, source: system, default: ACTIVE, description: "TRANSFER_PENDING while a DeviceTransfer is INITIATED; ARCHIVED by the homeowner-deactivation cascade; back to ACTIVE on transfer acceptance", constraints: "ACTIVE|TRANSFER_PENDING|ARCHIVED" }
      - { name: archived_at, type: datetime, source: system, description: "Logical-clock instant the property was archived; null otherwise", default: null }

  - name: Device
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the property whose main line this shutoff valve sits on" }
      - { name: serial_number, type: string, source: input, description: "Manufacturer serial; unique across all Devices", constraints: "unique, 6..32 chars" }
      - { name: model_code, type: enum, source: input, description: "Hardware model", constraints: "FLO_SMART_3_4|FLO_SMART_1_0" }
      - { name: firmware_version, type: string, source: input, default: "1.0.0", description: "Firmware semver; changed by POST /devices/{id}/firmware-updates" }
      - { name: lifecycle_state, type: enum, source: system, default: REGISTERED, description: "Install/learning posture dimension; gates classification and insurer credit", constraints: "REGISTERED|INSTALL_VERIFIED|LEARNING|ARMED|TRANSFER_PENDING|DECOMMISSIONED" }
      - { name: valve_state, type: enum, source: system, default: OPEN, description: "Independent valve dimension; CLOSED by auto-shutoff or a manual CLOSE command", constraints: "OPEN|CLOSED" }
      - { name: monitor_mode, type: enum, source: system, default: NORMAL, description: "Independent sensitivity dimension; VACATION halves flow/gallon thresholds, SNOOZE disables auto-shutoff", constraints: "NORMAL|VACATION|SNOOZE" }
      - { name: install_verified_by_user_id, type: string, source: system, description: "X-User-ID of the InstallerTech that passed the install pressure test; null before verification; drives the warranty segregation-of-duties check", default: null }
      - { name: install_verified_at, type: datetime, source: system, description: "Logical-clock instant of install verification; null before", default: null }
      - { name: installed_static_pressure_psi, type: number, source: input, description: "Static pressure measured at install verification; null before", default: null, constraints: "20.0..120.0, 1 decimal" }
      - { name: close_count, type: integer, source: system, default: 0, description: "Total valve CLOSE executions (auto + manual) over the device's life" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Total valve OPEN executions over the device's life; parity invariant close_count - reopen_count == (1 if valve_state == CLOSED else 0)" }
      - { name: last_shutoff_at, type: datetime, source: system, description: "Logical-clock instant of the most recent CLOSE; null when never closed", default: null }
      - { name: last_reading_at, type: datetime, source: system, description: "reading_at of the most recently accepted TelemetryReading; null before first ingest; enforces monotone ingest order", default: null }
      - { name: vacation_started_at, type: datetime, source: system, description: "Start of the current VACATION span; null unless monitor_mode == VACATION", default: null }
      - { name: vacation_ends_at, type: datetime, source: system, description: "End of the current VACATION span; ops sweep reverts monitor_mode to NORMAL once the clock reaches it", default: null }
      - { name: snooze_window_start_at, type: datetime, source: system, description: "Start of the most recent SNOOZE occupation window; retained after expiry to enforce the cooldown buffer", default: null }
      - { name: snooze_window_end_at, type: datetime, source: system, description: "End of the most recent SNOOZE occupation window; retained after expiry to enforce the cooldown buffer", default: null }
      - { name: monitor_mode_updated_at, type: datetime, source: system, description: "Logical-clock instant monitor_mode last changed; equals created_at when never changed" }
      - { name: baseline_ready, type: boolean, source: computed, default: false, description: "True when the device's BaselineProfile row has learning_state == COMPLETE; cross-entity derived gate for arming" }
      - { name: decommissioned_at, type: datetime, source: system, description: "Logical-clock instant the device was decommissioned; null otherwise", default: null }

  - name: BaselineProfile
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; exactly one profile row per device, created by install verification" }
      - { name: learning_state, type: enum, source: system, default: COLLECTING, description: "COLLECTING while samples accrue, COMPLETE once MIN_LEARNING_SAMPLES reached, INVALIDATED then back to COLLECTING on relearn", constraints: "COLLECTING|COMPLETE|INVALIDATED" }
      - { name: learning_started_at, type: datetime, source: system, description: "Logical-clock instant the current learning cycle started" }
      - { name: learning_cycle_no, type: integer, source: system, default: 1, description: "Increments by 1 each time an INVALIDATED profile re-enters COLLECTING" }
      - { name: sample_count, type: integer, source: computed, default: 0, description: "Count of TelemetryReading rows with device_id == this device_id, baseline_eligible == true and reading_at >= learning_started_at" }
      - { name: baseline_static_pressure_psi, type: number, source: computed, description: "Mean static pressure over the eligible sample set; null until COMPLETE", default: null, constraints: "1 decimal, round_half_up" }
      - { name: baseline_peak_flow_gpm, type: number, source: computed, description: "Max flow_gpm over the eligible sample set; null until COMPLETE", default: null, constraints: "2 decimals" }
      - { name: drip_threshold_gpm, type: number, source: computed, description: "Published drip ceiling; null until COMPLETE; widened by false-positive tuning", default: null, constraints: "2 decimals, round_half_up" }
      - { name: baseline_version, type: integer, source: system, default: 0, description: "Increments by 1 every time thresholds are published (COMPLETE) or retuned; snapshotted onto each AnomalyEvent" }
      - { name: false_positive_count, type: integer, source: system, default: 0, description: "Count of FALSE_POSITIVE feedback submissions inside the current FALSE_POSITIVE_WINDOW_DAYS window" }
      - { name: last_false_positive_at, type: datetime, source: system, description: "Logical-clock instant of the most recent FALSE_POSITIVE feedback; null when none", default: null }
      - { name: invalidated_reason, type: enum, source: system, description: "Why the profile was invalidated; null unless learning_state has been INVALIDATED at least once", default: null, constraints: "FIRMWARE_UPDATE|OWNERSHIP_TRANSFER|FALSE_POSITIVE_THRESHOLD" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant the current cycle reached COMPLETE; null while COLLECTING/INVALIDATED", default: null }

  - name: TelemetryReading
    parent: Device
    common_fields: false
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; emitter of this sample" }
      - { name: reading_at, type: datetime, source: input, description: "Sample instant; must be > Device.last_reading_at, <= logical clock, and within MAX_READING_BACKDATE_HOURS of it" }
      - { name: static_pressure_psi, type: number, source: input, description: "Static line pressure at sample time", constraints: "0.0..200.0, 1 decimal" }
      - { name: flow_gpm, type: number, source: input, description: "Observed flow in gallons per minute", constraints: ">= 0.0, 2 decimals" }
      - { name: duration_minutes, type: number, source: input, description: "Continuous flow duration ending at reading_at", constraints: ">= 0, 1 decimal" }
      - { name: total_gallons, type: number, source: input, description: "Gallons consumed over duration_minutes", constraints: ">= 0, 2 decimals" }
      - { name: reading_source, type: enum, source: input, default: DEVICE, description: "DEVICE for autonomous samples, MANUAL_TEST for installer bench tests (never baseline-eligible)", constraints: "DEVICE|MANUAL_TEST" }
      - { name: classification_at_ingest, type: enum, source: system, description: "Immutable classification decided at ingest by the anomaly_classification rule", constraints: "NONE|DRIP|RUNNING_FIXTURE|CATASTROPHIC_BURST" }
      - { name: suppressed_by_irrigation, type: boolean, source: system, default: false, description: "True when an ACTIVE IrrigationWindow covered reading_at and flow_gpm was within its expected_max_flow_gpm" }
      - { name: baseline_eligible, type: boolean, source: system, default: false, description: "True when classification_at_ingest == NONE, reading_source == DEVICE and suppressed_by_irrigation == false" }
      - { name: coverage_minutes, type: number, source: system, default: 120, description: "Uptime coverage credited by this sample; equals COVERAGE_MINUTES_PER_READING; the interval [reading_at, reading_at + coverage_minutes) is what uptime_coverage_pct merges" }
      - { name: anomaly_event_created, type: boolean, source: system, default: false, description: "True when this ingest minted an AnomalyEvent row" }

  - name: AnomalyEvent
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; device whose ingest minted this event" }
      - { name: telemetry_reading_id, type: string, source: system, description: "FK -> TelemetryReading.id; the sample that triggered classification" }
      - { name: classification, type: enum, source: system, description: "Anomaly class decided by the anomaly_classification rule", constraints: "DRIP|RUNNING_FIXTURE|CATASTROPHIC_BURST" }
      - { name: severity_score, type: number, source: computed, description: "Weighted 3-factor severity in [0.000, 1.000]", constraints: "3 decimals, round_half_up" }
      - { name: event_state, type: enum, source: system, default: DETECTED, description: "DETECTED at mint, then SUPPRESSED or ALERTED in the same request; ESCALATED by sweep; RESOLVED or FALSE_POSITIVE terminal", constraints: "DETECTED|SUPPRESSED|ALERTED|ESCALATED|RESOLVED|FALSE_POSITIVE" }
      - { name: detected_at, type: datetime, source: system, description: "Logical-clock instant of the ingest that minted the event" }
      - { name: suppression_reason, type: enum, source: system, description: "Why the event never alerted; null unless event_state == SUPPRESSED", default: null, constraints: "DEVICE_NOT_ARMED|SNOOZE_ACTIVE|DUPLICATE_WITHIN_COOLDOWN" }
      - { name: auto_shutoff_executed, type: boolean, source: system, default: false, description: "True when the auto_shutoff_decision rule closed the valve for this event" }
      - { name: shutoff_latency_minutes, type: number, source: computed, description: "Minutes between detected_at and the CLOSE that answered this event; null when no shutoff occurred", default: null, constraints: "1 decimal" }
      - { name: override_reopen_at, type: datetime, source: system, description: "Logical-clock instant a homeowner override reopened the valve while this event was unresolved; null when never overridden", default: null }
      - { name: mitigation_credited, type: boolean, source: computed, default: false, description: "True when auto_shutoff_executed == true AND shutoff_latency_minutes <= MITIGATION_WINDOW_MINUTES AND override_reopen_at IS NULL; selects the claim payout variant" }
      - { name: observed_flow_gpm, type: number, source: system, description: "flow_gpm snapshot from the triggering reading" }
      - { name: observed_duration_minutes, type: number, source: system, description: "duration_minutes snapshot from the triggering reading" }
      - { name: observed_gallons, type: number, source: system, description: "total_gallons snapshot from the triggering reading" }
      - { name: baseline_version_used, type: integer, source: system, description: "BaselineProfile.baseline_version in force at ingest; pins which published thresholds decided this classification" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical-clock instant the event reached RESOLVED; null otherwise", default: null }
      - { name: resolution_note, type: string, source: input, description: "Free-text closure note supplied on resolve; null before", default: null, constraints: "1..280 chars when supplied" }
      - { name: feedback_label, type: enum, source: system, description: "Homeowner tuning verdict; null until feedback is submitted", default: null, constraints: "TRUE_POSITIVE|FALSE_POSITIVE" }

  - name: EscalationTicket
    parent: AnomalyEvent
    common_fields: true
    fields:
      - { name: anomaly_event_id, type: string, source: system, description: "FK -> AnomalyEvent.id; exactly one ticket per ALERTED event" }
      - { name: notified_contact_id, type: string, source: system, description: "FK -> EmergencyContact.id; contact dialled at stage 2; null while stage == PENDING_HOMEOWNER", default: null }
      - { name: stage, type: enum, source: system, default: PENDING_HOMEOWNER, description: "Escalation ladder position", constraints: "PENDING_HOMEOWNER|PENDING_EMERGENCY_CONTACT|ACKNOWLEDGED|EXPIRED" }
      - { name: homeowner_deadline_at, type: datetime, source: system, description: "created_at + HOMEOWNER_SLA_MINUTES; sweep escalates once the clock reaches it" }
      - { name: contact_deadline_at, type: datetime, source: system, description: "escalated_at + CONTACT_SLA_MINUTES; null while stage == PENDING_HOMEOWNER", default: null }
      - { name: escalated_at, type: datetime, source: system, description: "Logical-clock instant stage became PENDING_EMERGENCY_CONTACT; null otherwise", default: null }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical-clock instant stage became ACKNOWLEDGED; null otherwise", default: null }
      - { name: acknowledged_by_user_id, type: string, source: system, description: "X-User-ID that acknowledged the ticket; null otherwise", default: null }
      - { name: expiry_reason, type: enum, source: system, description: "Why the ticket expired; null unless stage == EXPIRED", default: null, constraints: "CONTACT_SLA_BREACH|NO_ELIGIBLE_CONTACT|ACCOUNT_DEACTIVATED|EVENT_CLOSED" }
      - { name: notification_attempt_count, type: integer, source: system, default: 1, description: "1 after the stage-1 homeowner notification; 2 after the stage-2 contact notification" }

  - name: IrrigationWindow
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property whose sprinkler schedule this window describes" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Front zone Saturday'", constraints: "1..60 chars" }
      - { name: start_at, type: datetime, source: input, description: "Window start, inclusive" }
      - { name: end_at, type: datetime, source: input, description: "Window end, exclusive; window occupies the half-open span [start_at, end_at)", constraints: "> start_at" }
      - { name: expected_max_flow_gpm, type: number, source: input, description: "Flow ceiling treated as normal irrigation inside the window; readings at or below it are suppressed", constraints: "> 0.0, 2 decimals" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "SUSPENDED_BY_SHUTOFF while the device valve is CLOSED; CANCELLED by the homeowner-deactivation cascade", constraints: "ACTIVE|SUSPENDED_BY_SHUTOFF|CANCELLED" }
      - { name: suspended_at, type: datetime, source: system, description: "Logical-clock instant the window was suspended by a valve closure; null otherwise", default: null }

  - name: InsurancePolicy
    parent: Property
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; insured property" }
      - { name: insurer_code, type: string, source: input, description: "Carrier short code", constraints: "2..12 uppercase chars" }
      - { name: policy_number, type: string, source: input, description: "Carrier policy number; unique across all InsurancePolicy rows", constraints: "unique, 4..32 chars" }
      - { name: annual_premium_cents, type: integer, source: input, description: "Annual premium in cents; base for the IoT credit", constraints: ">= 10000" }
      - { name: deductible_cents, type: integer, source: input, default: 100000, description: "Water-damage deductible in cents; waived on mitigated claims", constraints: ">= 0" }
      - { name: policy_year_start_at, type: datetime, source: input, description: "First attestation period must start exactly here" }
      - { name: credit_state, type: enum, source: system, default: PENDING_ENROLLMENT, description: "Credit posture; CREDIT_ACTIVE after the first awarded attestation, CREDIT_SUSPENDED on device demotion or a denied period, TERMINATED when superseded or on account deactivation", constraints: "PENDING_ENROLLMENT|CREDIT_ACTIVE|CREDIT_SUSPENDED|TERMINATED" }
      - { name: current_credit_tier_pct, type: number, source: system, default: 0, description: "Tier fraction from the most recently finalized attestation (0.12|0.08|0.05|0)", constraints: "2 decimals" }
      - { name: credited_cents_total, type: integer, source: system, default: 0, description: "Net credit ledger: SUM(FINALIZED_AWARDED credit_cents_awarded) + SUM(true_up_cents of policy-year-close attestations) - clawback_cents_total" }
      - { name: clawback_cents_total, type: integer, source: system, default: 0, description: "Cumulative credit reversed by CREDIT_ACTIVE -> CREDIT_SUSPENDED compensations" }
      - { name: true_up_cents, type: integer, source: system, default: 0, description: "Signed policy-year true-up applied at the closing attestation; mirrors CreditAttestation.true_up_cents" }
      - { name: paid_payout_cents_total, type: integer, source: system, default: 0, description: "Cumulative claim payouts moved to PAID against this policy; checked against POLICY_ANNUAL_PAYOUT_CAP_CENTS" }
      - { name: finalized_period_count, type: integer, source: computed, default: 0, description: "Count of CreditAttestation rows for this policy with status IN {FINALIZED_AWARDED, FINALIZED_DENIED}" }
      - { name: avg_uptime_pct, type: number, source: computed, description: "Mean uptime_pct over CreditAttestation rows with status IN {FINALIZED_AWARDED, FINALIZED_DENIED}; null when none", default: null, constraints: "2 decimals, round_half_up" }
      - { name: last_attestation_end_at, type: datetime, source: system, description: "period_end_at of the newest attestation row; null when none; anchors period contiguity", default: null }
      - { name: suspended_reason, type: enum, source: system, description: "Why credit is suspended; null unless credit_state == CREDIT_SUSPENDED", default: null, constraints: "DEVICE_NOT_ARMED|UPTIME_BELOW_FLOOR|OWNERSHIP_TRANSFER" }

  - name: CreditAttestation
    parent: InsurancePolicy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> InsurancePolicy.id; policy this attestation period belongs to" }
      - { name: period_start_at, type: datetime, source: input, description: "Period start, inclusive; must equal policy.last_attestation_end_at, or policy.policy_year_start_at for the first period" }
      - { name: period_end_at, type: datetime, source: input, description: "Period end, exclusive; occupies the half-open span [period_start_at, period_end_at)", constraints: "> period_start_at" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN at creation; FINALIZED_AWARDED or FINALIZED_DENIED after finalize", constraints: "OPEN|FINALIZED_AWARDED|FINALIZED_DENIED" }
      - { name: period_minutes, type: number, source: computed, description: "Whole minutes in [period_start_at, period_end_at)" }
      - { name: covered_minutes, type: number, source: computed, description: "Merged telemetry coverage minutes inside the period; null until finalized", default: null }
      - { name: uptime_pct, type: number, source: computed, description: "covered_minutes / period_minutes * 100; null until finalized", default: null, constraints: "2 decimals, round_half_up" }
      - { name: offline_gap_count, type: integer, source: computed, description: "Number of maximal uncovered spans inside the period; null until finalized", default: null }
      - { name: tier_pct, type: number, source: computed, description: "Credit tier fraction selected by uptime_pct; null until finalized", default: null, constraints: "2 decimals" }
      - { name: credit_cents_awarded, type: integer, source: computed, default: 0, description: "Provisional per-period credit in cents; 0 when FINALIZED_DENIED" }
      - { name: true_up_cents, type: integer, source: computed, default: 0, description: "Signed annual true-up, non-zero only on the policy-year-closing attestation" }
      - { name: is_policy_year_close, type: boolean, source: computed, default: false, description: "True when this finalize brings policy.finalized_period_count to PERIODS_PER_POLICY_YEAR" }
      - { name: device_snapshot_lifecycle_state, type: enum, source: system, description: "Device.lifecycle_state read at finalize time; null until finalized", default: null, constraints: "REGISTERED|INSTALL_VERIFIED|LEARNING|ARMED|TRANSFER_PENDING|DECOMMISSIONED" }
      - { name: denial_reason, type: enum, source: system, description: "Why credit was denied; null unless status == FINALIZED_DENIED", default: null, constraints: "UPTIME_BELOW_FLOOR|DEVICE_NOT_ARMED|NO_ENROLLED_DEVICE" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock instant of finalize; null while OPEN", default: null }

  - name: ReimbursementClaim
    parent: InsurancePolicy
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> InsurancePolicy.id; policy the claim is filed against" }
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device whose warranty or mitigation performance is at issue" }
      - { name: anomaly_event_id, type: string, source: input, description: "FK -> AnomalyEvent.id; qualifying burst event; required for WATER_DAMAGE, optional for WARRANTY_DEVICE", default: null }
      - { name: claim_type, type: enum, source: input, description: "WARRANTY_DEVICE for hardware failure, WATER_DAMAGE for loss reimbursement", constraints: "WARRANTY_DEVICE|WATER_DAMAGE" }
      - { name: documented_loss_cents, type: integer, source: input, description: "Documented loss or repair cost in cents", constraints: ">= 1" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitting Homeowner" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Adjudication position; INFO_REQUESTED can return to UNDER_REVIEW any number of times", constraints: "SUBMITTED|UNDER_REVIEW|INFO_REQUESTED|APPROVED|DENIED|PAID" }
      - { name: payout_variant, type: enum, source: computed, description: "Payout algebra selected at APPROVE; null before", default: null, constraints: "MITIGATED|UNMITIGATED|WARRANTY_FLAT" }
      - { name: approved_payout_cents, type: integer, source: computed, default: 0, description: "Payout in cents computed at APPROVE" }
      - { name: deductible_applied_cents, type: integer, source: computed, default: 0, description: "Deductible actually subtracted; 0 on MITIGATED and WARRANTY_FLAT" }
      - { name: info_request_count, type: integer, source: system, default: 0, description: "Number of REQUEST_INFO round trips" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ClaimsAdjuster that approved or denied; null before", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of APPROVE or DENY; null before", default: null }
      - { name: denial_reason, type: enum, source: system, description: "Adjuster denial code; null unless status == DENIED", default: null, constraints: "NO_QUALIFYING_EVENT|OVERRIDE_DEFEATED_MITIGATION|INSUFFICIENT_DOCUMENTATION|ACCOUNT_CLOSED" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock instant of PAY; null before", default: null }

  - name: DeviceTransfer
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; device changing hands with the property" }
      - { name: from_homeowner_id, type: string, source: system, description: "FK -> Homeowner.id; owner of record on the device's property at initiation" }
      - { name: to_homeowner_id, type: string, source: input, description: "FK -> Homeowner.id; buyer account that must accept" }
      - { name: status, type: enum, source: system, default: INITIATED, description: "INITIATED until accepted, superseded, or expired", constraints: "INITIATED|ACCEPTED|CANCELLED|EXPIRED" }
      - { name: initiated_at, type: datetime, source: system, description: "Logical-clock instant of creation" }
      - { name: expires_at, type: datetime, source: system, description: "initiated_at + TRANSFER_ACCEPT_WINDOW_HOURS; sweep expires the row once the clock passes it" }
      - { name: accepted_at, type: datetime, source: system, description: "Logical-clock instant of acceptance; null otherwise", default: null }
      - { name: accepted_by_user_id, type: string, source: system, description: "X-User-ID of the accepting buyer; null otherwise", default: null }
      - { name: cancel_reason, type: enum, source: system, description: "Why the transfer was cancelled; null unless status == CANCELLED", default: null, constraints: "SUPERSEDED|ACCOUNT_DEACTIVATED" }
      - { name: transfer_note, type: string, source: input, description: "Optional closing note from the seller", default: null, constraints: "1..280 chars when supplied" }

state_machines:
  # ---------------------------------------------------------------- Device: 3 independent dimensions
  - entity: Device
    state_field: lifecycle_state
    initial_state: REGISTERED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: REGISTERED
        to: INSTALL_VERIFIED
        trigger: "POST /devices/{id}/verify-install"
        actor: InstallerTech
        preconditions:
          - "Device.lifecycle_state == REGISTERED"
          - "installed_static_pressure_psi within [INSTALL_MIN_STATIC_PSI, INSTALL_MAX_STATIC_PSI] and pressure_drop_psi <= INSTALL_MAX_DROP_PSI"
          - "Property.property_state == ACTIVE"
        side_effects:
          - "sets Device.install_verified_by_user_id = X-User-ID, install_verified_at = clock, installed_static_pressure_psi = input"
          - "creates exactly one BaselineProfile row for this device with learning_state = COLLECTING, learning_cycle_no = 1, learning_started_at = clock, baseline_version = 0"
          - "increments Device.version by 1"
      - from: INSTALL_VERIFIED
        to: LEARNING
        trigger: "system: first TelemetryReading accepted by POST /devices/{id}/telemetry"
        actor: system
        preconditions: ["Device.lifecycle_state == INSTALL_VERIFIED", "BaselineProfile.learning_state == COLLECTING"]
        side_effects:
          - "sets Device.last_reading_at = reading_at"
          - "recomputes BaselineProfile.sample_count via the baseline_learning_profile rule"
      - from: LEARNING
        to: ARMED
        trigger: "system: BaselineProfile reaches learning_state == COMPLETE inside POST /devices/{id}/telemetry"
        actor: system
        preconditions: ["BaselineProfile.sample_count >= MIN_LEARNING_SAMPLES", "Device.lifecycle_state == LEARNING"]
        side_effects:
          - "sets Device.baseline_ready = true"
          - "arming publishes BaselineProfile.drip_threshold_gpm / baseline_peak_flow_gpm so subsequent ingests classify"
        note: "Bubble-up: parent Device arms only because its child BaselineProfile completed."
      - from: ARMED
        to: TRANSFER_PENDING
        trigger: "POST /device-transfers"
        actor: Homeowner
        preconditions:
          - "Device.lifecycle_state == ARMED"
          - "no ReimbursementClaim for this device with status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED}"
        side_effects:
          - "sets Property.property_state = TRANSFER_PENDING and increments Property.version by 1"
          - "cancels any other DeviceTransfer for this device with status == INITIATED (status = CANCELLED, cancel_reason = SUPERSEDED)"
          - "increments Device.version by 1"
      - from: TRANSFER_PENDING
        to: LEARNING
        trigger: "POST /device-transfers/{id}/accept"
        actor: Homeowner
        preconditions: ["DeviceTransfer.status == INITIATED", "Device.valve_state == OPEN", "no AnomalyEvent for this device with event_state IN {ALERTED, ESCALATED}"]
        side_effects:
          - "cascade hop 3: BaselineProfile COMPLETE -> INVALIDATED (invalidated_reason = OWNERSHIP_TRANSFER) demotes this device out of ARMED"
          - "sets Device.baseline_ready = false, monitor_mode = NORMAL, monitor_mode_updated_at = clock, vacation_started_at = null, vacation_ends_at = null"
          - "cascade hop 5: leaving ARMED suspends the property's InsurancePolicy credit (see InsurancePolicy CREDIT_ACTIVE -> CREDIT_SUSPENDED)"
          - "increments Device.version by 1"
      - from: ARMED
        to: LEARNING
        trigger: "POST /devices/{id}/firmware-updates"
        actor: InstallerTech
        preconditions: ["Device.lifecycle_state == ARMED", "new firmware_version != Device.firmware_version"]
        side_effects:
          - "cascade hop 1: BaselineProfile COMPLETE -> INVALIDATED (invalidated_reason = FIRMWARE_UPDATE)"
          - "cascade hop 2: the invalidation demotes Device.lifecycle_state to LEARNING and sets baseline_ready = false"
          - "cascade hop 3: leaving ARMED suspends the property's InsurancePolicy credit with suspended_reason = DEVICE_NOT_ARMED and applies the credit clawback"
          - "increments Device.version by 1"
        note: "Cyclic: the device returns to ARMED once MIN_LEARNING_SAMPLES samples of the new cycle land."
      - from: ARMED
        to: LEARNING
        trigger: "system: BaselineProfile invalidated by the false_positive_tuning rule inside POST /anomaly-events/{id}/feedback"
        actor: system
        preconditions: ["BaselineProfile.false_positive_count >= MAX_FALSE_POSITIVES_BEFORE_RELEARN", "Device.lifecycle_state == ARMED"]
        side_effects:
          - "sets Device.baseline_ready = false"
          - "suspends the property's InsurancePolicy credit with suspended_reason = DEVICE_NOT_ARMED and applies the credit clawback"
          - "increments Device.version by 1"
      - from: ARMED
        to: DECOMMISSIONED
        trigger: "POST /homeowners/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["Homeowner.account_state == ACTIVE", "no ReimbursementClaim on the account with status == APPROVED"]
        side_effects:
          - "sets Device.decommissioned_at = clock, valve_state unchanged, monitor_mode = NORMAL"
          - "increments Device.version by 1"
      - from: LEARNING
        to: DECOMMISSIONED
        trigger: "POST /homeowners/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["Homeowner.account_state == ACTIVE"]
        side_effects: ["sets Device.decommissioned_at = clock", "increments Device.version by 1"]
      - from: TRANSFER_PENDING
        to: DECOMMISSIONED
        trigger: "POST /homeowners/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["Homeowner.account_state == ACTIVE"]
        side_effects:
          - "cancels the INITIATED DeviceTransfer (cancel_reason = ACCOUNT_DEACTIVATED)"
          - "sets Device.decommissioned_at = clock"
          - "increments Device.version by 1"

  - entity: Device
    state_field: valve_state
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "system: auto_shutoff_decision returns true inside POST /devices/{id}/telemetry"
        actor: system
        preconditions:
          - "AnomalyEvent.event_state == ALERTED"
          - "Device.monitor_mode != SNOOZE"
          - "Device.lifecycle_state == ARMED"
        side_effects:
          - "cascade hop 3: increments Device.close_count by 1, sets last_shutoff_at = clock; sets AnomalyEvent.auto_shutoff_executed = true and shutoff_latency_minutes = 0.0"
          - "cascade hop 4: every IrrigationWindow of this device's property with status == ACTIVE becomes SUSPENDED_BY_SHUTOFF with suspended_at = clock"
          - "increments Device.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /devices/{id}/valve-commands with command == CLOSE"
        actor: Homeowner
        preconditions: ["Device.valve_state == OPEN", "Device.lifecycle_state IN {LEARNING, ARMED}", "expected_device_version == Device.version"]
        side_effects:
          - "increments Device.close_count by 1, sets last_shutoff_at = clock"
          - "every IrrigationWindow of the property with status == ACTIVE becomes SUSPENDED_BY_SHUTOFF"
          - "increments Device.version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /devices/{id}/valve-commands with command == OPEN"
        actor: Homeowner
        preconditions:
          - "Device.valve_state == CLOSED"
          - "Device.lifecycle_state != TRANSFER_PENDING"
          - "expected_device_version == Device.version"
          - "when any AnomalyEvent of this device has classification == CATASTROPHIC_BURST and event_state IN {ALERTED, ESCALATED}: acknowledge_water_damage_risk == true AND override_reason is a non-empty string"
        side_effects:
          - "compensation: increments Device.reopen_count by 1, restoring the parity invariant close_count - reopen_count == 0"
          - "compensation: every IrrigationWindow of the property with status == SUSPENDED_BY_SHUTOFF returns to ACTIVE with suspended_at = null"
          - "when the reopen overrode an unresolved CATASTROPHIC_BURST event: sets that event's override_reopen_at = clock, which flips its mitigation_credited to false"
          - "increments Device.version by 1"

  - entity: Device
    state_field: monitor_mode
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: VACATION
        trigger: "POST /devices/{id}/monitor-mode with mode == VACATION"
        actor: Homeowner
        preconditions: ["Device.monitor_mode == NORMAL", "Device.lifecycle_state IN {LEARNING, ARMED}", "vacation_ends_at > clock and vacation_ends_at <= clock + MAX_VACATION_DAYS"]
        side_effects: ["sets vacation_started_at = clock, vacation_ends_at = input, monitor_mode_updated_at = clock", "halves the effective burst flow/gallon thresholds via the anomaly_classification mode multiplier", "increments Device.version by 1"]
      - from: VACATION
        to: NORMAL
        trigger: "POST /devices/{id}/monitor-mode with mode == NORMAL"
        actor: Homeowner
        preconditions: ["Device.monitor_mode == VACATION"]
        side_effects: ["clears vacation_started_at and vacation_ends_at, sets monitor_mode_updated_at = clock", "increments Device.version by 1"]
      - from: VACATION
        to: NORMAL
        trigger: "system: POST /ops-sweeps observes clock >= Device.vacation_ends_at"
        actor: system
        preconditions: ["Device.monitor_mode == VACATION", "clock >= Device.vacation_ends_at"]
        side_effects: ["clears vacation_started_at and vacation_ends_at, sets monitor_mode_updated_at = clock", "increments Device.version by 1"]
      - from: NORMAL
        to: SNOOZE
        trigger: "POST /devices/{id}/monitor-mode with mode == SNOOZE"
        actor: Homeowner
        preconditions:
          - "Device.monitor_mode == NORMAL"
          - "Device.lifecycle_state IN {LEARNING, ARMED}"
          - "snooze_minutes within [MIN_SNOOZE_MINUTES, MAX_SNOOZE_MINUTES]"
          - "clock >= Device.snooze_window_end_at + SNOOZE_COOLDOWN_MINUTES when snooze_window_end_at is not null"
        side_effects: ["sets snooze_window_start_at = clock, snooze_window_end_at = clock + snooze_minutes, monitor_mode_updated_at = clock", "disables auto_shutoff_decision for the span", "increments Device.version by 1"]
      - from: SNOOZE
        to: NORMAL
        trigger: "POST /devices/{id}/monitor-mode with mode == NORMAL"
        actor: Homeowner
        preconditions: ["Device.monitor_mode == SNOOZE"]
        side_effects: ["sets monitor_mode_updated_at = clock; snooze_window_start_at / snooze_window_end_at are retained so the cooldown buffer still applies", "increments Device.version by 1"]
      - from: SNOOZE
        to: NORMAL
        trigger: "system: POST /ops-sweeps observes clock >= Device.snooze_window_end_at"
        actor: system
        preconditions: ["Device.monitor_mode == SNOOZE", "clock >= Device.snooze_window_end_at"]
        side_effects: ["sets monitor_mode_updated_at = clock; window bounds retained for the cooldown buffer", "increments Device.version by 1"]

  # ---------------------------------------------------------------- BaselineProfile: cyclic relearn
  - entity: BaselineProfile
    state_field: learning_state
    initial_state: COLLECTING
    terminal_states: []
    transitions:
      - from: COLLECTING
        to: COMPLETE
        trigger: "system: POST /devices/{id}/telemetry brings sample_count to MIN_LEARNING_SAMPLES"
        actor: system
        preconditions: ["BaselineProfile.learning_state == COLLECTING", "sample_count >= MIN_LEARNING_SAMPLES"]
        side_effects:
          - "publishes baseline_static_pressure_psi, baseline_peak_flow_gpm and drip_threshold_gpm per the baseline_learning_profile rule"
          - "increments baseline_version by 1 and sets completed_at = clock"
          - "bubble-up: promotes Device.lifecycle_state LEARNING -> ARMED"
      - from: COMPLETE
        to: INVALIDATED
        trigger: "POST /devices/{id}/firmware-updates"
        actor: InstallerTech
        preconditions: ["BaselineProfile.learning_state == COMPLETE"]
        side_effects:
          - "sets invalidated_reason = FIRMWARE_UPDATE, completed_at = null, false_positive_count = 0"
          - "cascade: demotes Device.lifecycle_state ARMED -> LEARNING"
      - from: COMPLETE
        to: INVALIDATED
        trigger: "POST /device-transfers/{id}/accept"
        actor: Homeowner
        preconditions: ["BaselineProfile.learning_state == COMPLETE", "Property.homeowner_id was rewritten by this acceptance"]
        side_effects:
          - "sets invalidated_reason = OWNERSHIP_TRANSFER, completed_at = null, false_positive_count = 0"
          - "cascade: demotes Device.lifecycle_state TRANSFER_PENDING -> LEARNING"
      - from: COMPLETE
        to: INVALIDATED
        trigger: "system: false_positive_tuning inside POST /anomaly-events/{id}/feedback reaches MAX_FALSE_POSITIVES_BEFORE_RELEARN"
        actor: system
        preconditions: ["BaselineProfile.learning_state == COMPLETE", "false_positive_count >= MAX_FALSE_POSITIVES_BEFORE_RELEARN"]
        side_effects:
          - "sets invalidated_reason = FALSE_POSITIVE_THRESHOLD, completed_at = null"
          - "cascade: demotes Device.lifecycle_state ARMED -> LEARNING"
      - from: INVALIDATED
        to: COLLECTING
        trigger: "system: next TelemetryReading accepted by POST /devices/{id}/telemetry"
        actor: system
        preconditions: ["BaselineProfile.learning_state == INVALIDATED"]
        side_effects:
          - "increments learning_cycle_no by 1, sets learning_started_at = clock, clears baseline_static_pressure_psi / baseline_peak_flow_gpm / drip_threshold_gpm, resets false_positive_count to 0"
          - "sample_count restarts from the readings whose reading_at >= the new learning_started_at"
        note: "Cycle closes when COLLECTING -> COMPLETE fires again with a higher baseline_version."

  # ---------------------------------------------------------------- AnomalyEvent: branching fork
  - entity: AnomalyEvent
    state_field: event_state
    initial_state: DETECTED
    terminal_states: [RESOLVED, FALSE_POSITIVE]
    transitions:
      - from: DETECTED
        to: ALERTED
        trigger: "system: POST /devices/{id}/telemetry classified a non-NONE anomaly on an ARMED device"
        actor: system
        preconditions: ["Device.lifecycle_state == ARMED", "Device.monitor_mode != SNOOZE", "no other AnomalyEvent on this device with the same classification and detected_at > clock - DUPLICATE_COOLDOWN_MINUTES"]
        side_effects:
          - "cascade hop 2: creates one EscalationTicket with stage = PENDING_HOMEOWNER, homeowner_deadline_at = clock + HOMEOWNER_SLA_MINUTES, notification_attempt_count = 1"
          - "cascade hop 3 (CATASTROPHIC_BURST, or RUNNING_FIXTURE in VACATION mode above VACATION_RUNNING_GALLON_CAP): auto_shutoff_decision closes the valve"
      - from: DETECTED
        to: SUPPRESSED
        trigger: "system: POST /devices/{id}/telemetry classified a non-NONE anomaly but a suppression rule applied"
        actor: system
        preconditions: ["Device.lifecycle_state == TRANSFER_PENDING (DEVICE_NOT_ARMED) OR Device.monitor_mode == SNOOZE (SNOOZE_ACTIVE) OR an earlier event of the same classification is inside DUPLICATE_COOLDOWN_MINUTES (DUPLICATE_WITHIN_COOLDOWN)"]
        side_effects:
          - "sets suppression_reason accordingly; NO EscalationTicket is created and the valve is untouched"
        note: "Branch divergence: ALERTED and SUPPRESSED share the same trigger but have disjoint side-effect sets."
      - from: ALERTED
        to: ESCALATED
        trigger: "system: POST /ops-sweeps advances the event's ticket to PENDING_EMERGENCY_CONTACT"
        actor: system
        preconditions: ["EscalationTicket.stage == PENDING_HOMEOWNER", "clock >= EscalationTicket.homeowner_deadline_at"]
        side_effects: ["mirrors the ticket escalation onto the event", "increments AnomalyEvent.version by 1"]
      - from: ALERTED
        to: RESOLVED
        trigger: "POST /anomaly-events/{id}/resolve"
        actor: Homeowner
        preconditions: ["AnomalyEvent.event_state == ALERTED", "the event's EscalationTicket.stage IN {ACKNOWLEDGED, EXPIRED}"]
        side_effects: ["sets resolved_at = clock and resolution_note = input", "increments AnomalyEvent.version by 1"]
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /anomaly-events/{id}/resolve"
        actor: Homeowner
        preconditions: ["AnomalyEvent.event_state == ESCALATED", "the event's EscalationTicket.stage IN {ACKNOWLEDGED, EXPIRED}"]
        side_effects: ["sets resolved_at = clock and resolution_note = input", "increments AnomalyEvent.version by 1"]
      - from: ALERTED
        to: FALSE_POSITIVE
        trigger: "POST /anomaly-events/{id}/feedback with label == FALSE_POSITIVE"
        actor: Homeowner
        preconditions: ["AnomalyEvent.event_state IN {ALERTED, ESCALATED, SUPPRESSED}", "BaselineProfile.learning_state == COMPLETE"]
        side_effects:
          - "sets feedback_label = FALSE_POSITIVE"
          - "cascade hop 1: false_positive_tuning widens BaselineProfile.drip_threshold_gpm and increments false_positive_count and baseline_version"
          - "cascade hop 2 (only at the MAX_FALSE_POSITIVES_BEFORE_RELEARN boundary): BaselineProfile COMPLETE -> INVALIDATED"
          - "the event's EscalationTicket, when stage IN {PENDING_HOMEOWNER, PENDING_EMERGENCY_CONTACT}, becomes ACKNOWLEDGED"
      - from: ESCALATED
        to: FALSE_POSITIVE
        trigger: "POST /anomaly-events/{id}/feedback with label == FALSE_POSITIVE"
        actor: Homeowner
        preconditions: ["AnomalyEvent.event_state == ESCALATED", "BaselineProfile.learning_state == COMPLETE"]
        side_effects: ["same tuning cascade as the ALERTED -> FALSE_POSITIVE transition"]
      - from: SUPPRESSED
        to: FALSE_POSITIVE
        trigger: "POST /anomaly-events/{id}/feedback with label == FALSE_POSITIVE"
        actor: Homeowner
        preconditions: ["AnomalyEvent.event_state == SUPPRESSED", "BaselineProfile.learning_state == COMPLETE"]
        side_effects: ["same tuning cascade; no ticket exists to acknowledge"]

  # ---------------------------------------------------------------- EscalationTicket: SLA ladder
  - entity: EscalationTicket
    state_field: stage
    initial_state: PENDING_HOMEOWNER
    terminal_states: [ACKNOWLEDGED, EXPIRED]
    transitions:
      - from: PENDING_HOMEOWNER
        to: PENDING_EMERGENCY_CONTACT
        trigger: "system: POST /ops-sweeps"
        actor: system
        preconditions:
          - "clock >= homeowner_deadline_at"
          - "at least one EmergencyContact of the property's owning Homeowner has status == ACTIVE and verification_state == VERIFIED"
        side_effects:
          - "selects the contact with the lowest priority_rank among status == ACTIVE and verification_state == VERIFIED rows, tie-broken by created_at ASC; sets notified_contact_id"
          - "sets escalated_at = clock, contact_deadline_at = clock + CONTACT_SLA_MINUTES, notification_attempt_count = 2, contact.last_notified_at = clock"
          - "mirrors AnomalyEvent ALERTED -> ESCALATED"
      - from: PENDING_HOMEOWNER
        to: EXPIRED
        trigger: "system: POST /ops-sweeps"
        actor: system
        preconditions: ["clock >= homeowner_deadline_at", "no EmergencyContact with status == ACTIVE and verification_state == VERIFIED exists for the owning Homeowner"]
        side_effects: ["sets expiry_reason = NO_ELIGIBLE_CONTACT; the AnomalyEvent stays ALERTED"]
      - from: PENDING_EMERGENCY_CONTACT
        to: EXPIRED
        trigger: "system: POST /ops-sweeps"
        actor: system
        preconditions: ["clock >= contact_deadline_at"]
        side_effects: ["sets expiry_reason = CONTACT_SLA_BREACH; the AnomalyEvent stays ESCALATED and becomes resolvable"]
      - from: PENDING_HOMEOWNER
        to: ACKNOWLEDGED
        trigger: "POST /escalation-tickets/{id}/acknowledge"
        actor: Homeowner
        preconditions: ["stage == PENDING_HOMEOWNER", "acting Homeowner owns the event's property"]
        side_effects: ["sets acknowledged_at = clock and acknowledged_by_user_id = X-User-ID; unblocks AnomalyEvent resolve"]
      - from: PENDING_EMERGENCY_CONTACT
        to: ACKNOWLEDGED
        trigger: "POST /escalation-tickets/{id}/acknowledge"
        actor: Homeowner
        preconditions: ["stage == PENDING_EMERGENCY_CONTACT"]
        side_effects: ["sets acknowledged_at = clock and acknowledged_by_user_id = X-User-ID"]
      - from: PENDING_HOMEOWNER
        to: EXPIRED
        trigger: "POST /anomaly-events/{id}/resolve or POST /anomaly-events/{id}/feedback"
        actor: Homeowner
        preconditions: ["the ticket's AnomalyEvent reaches RESOLVED or FALSE_POSITIVE in this request"]
        side_effects: ["sets expiry_reason = EVENT_CLOSED; the ladder stops because the underlying leak is closed out"]
      - from: PENDING_EMERGENCY_CONTACT
        to: EXPIRED
        trigger: "POST /anomaly-events/{id}/resolve or POST /anomaly-events/{id}/feedback"
        actor: Homeowner
        preconditions: ["the ticket's AnomalyEvent reaches RESOLVED or FALSE_POSITIVE in this request"]
        side_effects: ["sets expiry_reason = EVENT_CLOSED"]
      - from: PENDING_HOMEOWNER
        to: EXPIRED
        trigger: "POST /homeowners/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["Homeowner.account_state == ACTIVE"]
        side_effects: ["sets expiry_reason = ACCOUNT_DEACTIVATED"]
      - from: PENDING_EMERGENCY_CONTACT
        to: EXPIRED
        trigger: "POST /homeowners/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["Homeowner.account_state == ACTIVE"]
        side_effects: ["sets expiry_reason = ACCOUNT_DEACTIVATED"]

  # ---------------------------------------------------------------- InsurancePolicy: cyclic credit posture
  - entity: InsurancePolicy
    state_field: credit_state
    initial_state: PENDING_ENROLLMENT
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_ENROLLMENT
        to: CREDIT_ACTIVE
        trigger: "system: POST /credit-attestations/{id}/finalize awards credit"
        actor: system
        preconditions: ["CreditAttestation.status transitions to FINALIZED_AWARDED", "InsurancePolicy.credit_state == PENDING_ENROLLMENT"]
        side_effects:
          - "sets current_credit_tier_pct = attestation.tier_pct and credited_cents_total += attestation.credit_cents_awarded"
          - "sets last_attestation_end_at = attestation.period_end_at"
          - "increments InsurancePolicy.version by 1"
      - from: CREDIT_SUSPENDED
        to: CREDIT_ACTIVE
        trigger: "system: POST /credit-attestations/{id}/finalize awards credit for a later period"
        actor: system
        preconditions: ["CreditAttestation.status transitions to FINALIZED_AWARDED", "InsurancePolicy.credit_state == CREDIT_SUSPENDED"]
        side_effects:
          - "clears suspended_reason, sets current_credit_tier_pct = attestation.tier_pct, credited_cents_total += attestation.credit_cents_awarded"
          - "increments InsurancePolicy.version by 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE across attestation periods."
      - from: CREDIT_ACTIVE
        to: CREDIT_SUSPENDED
        trigger: "system: Device leaves lifecycle_state ARMED (firmware update, false-positive relearn, or transfer acceptance)"
        actor: system
        preconditions: ["InsurancePolicy.credit_state == CREDIT_ACTIVE", "the policy's property owns a Device whose lifecycle_state left ARMED in this request"]
        side_effects:
          - "sets suspended_reason = DEVICE_NOT_ARMED for firmware/false-positive demotions, OWNERSHIP_TRANSFER for transfer acceptance"
          - "compensation: clawback_cents_total += clawback_amount and credited_cents_total -= clawback_amount, where clawback_amount is the credit_cents_awarded of the CreditAttestation with status == FINALIZED_AWARDED and period_end_at <= clock ordered by period_end_at DESC then created_at ASC (first row; 0 when none)"
          - "sets current_credit_tier_pct = 0"
          - "increments InsurancePolicy.version by 1"
      - from: CREDIT_ACTIVE
        to: CREDIT_SUSPENDED
        trigger: "system: POST /credit-attestations/{id}/finalize denies credit with UPTIME_BELOW_FLOOR"
        actor: system
        preconditions: ["InsurancePolicy.credit_state == CREDIT_ACTIVE", "CreditAttestation.status transitions to FINALIZED_DENIED with denial_reason == UPTIME_BELOW_FLOOR"]
        side_effects:
          - "sets suspended_reason = UPTIME_BELOW_FLOOR, current_credit_tier_pct = 0"
          - "no clawback: a denied period simply awards nothing"
          - "sets last_attestation_end_at = attestation.period_end_at and increments InsurancePolicy.version by 1"
      - from: PENDING_ENROLLMENT
        to: TERMINATED
        trigger: "POST /policies (a newer policy on the same property supersedes this one) or POST /homeowners/{id}/deactivate"
        actor: system
        preconditions: ["InsurancePolicy.credit_state != TERMINATED"]
        side_effects: ["increments InsurancePolicy.version by 1"]
      - from: CREDIT_ACTIVE
        to: TERMINATED
        trigger: "POST /policies (supersede) or POST /homeowners/{id}/deactivate"
        actor: system
        preconditions: ["InsurancePolicy.credit_state == CREDIT_ACTIVE"]
        side_effects: ["sets current_credit_tier_pct = 0; credited_cents_total is frozen as-is (no clawback on termination)", "increments InsurancePolicy.version by 1"]
      - from: CREDIT_SUSPENDED
        to: TERMINATED
        trigger: "POST /policies (supersede) or POST /homeowners/{id}/deactivate"
        actor: system
        preconditions: ["InsurancePolicy.credit_state == CREDIT_SUSPENDED"]
        side_effects: ["increments InsurancePolicy.version by 1"]

  # ---------------------------------------------------------------- CreditAttestation: branching finalize
  - entity: CreditAttestation
    state_field: status
    initial_state: OPEN
    terminal_states: [FINALIZED_AWARDED, FINALIZED_DENIED]
    transitions:
      - from: OPEN
        to: FINALIZED_AWARDED
        trigger: "POST /credit-attestations/{id}/finalize"
        actor: InsurerAnalyst
        preconditions:
          - "CreditAttestation.status == OPEN"
          - "clock >= period_end_at"
          - "the resolved Device.lifecycle_state == ARMED"
          - "uptime_pct >= UPTIME_CREDIT_FLOOR_PCT"
        side_effects:
          - "runs uptime_coverage_pct then premium_credit_award; writes covered_minutes, uptime_pct, offline_gap_count, tier_pct, credit_cents_awarded, device_snapshot_lifecycle_state, finalized_at"
          - "when this finalize brings policy.finalized_period_count to PERIODS_PER_POLICY_YEAR: sets is_policy_year_close = true and writes the final_annual_true_up variant into true_up_cents (mirrored onto policy.true_up_cents)"
          - "drives InsurancePolicy PENDING_ENROLLMENT|CREDIT_SUSPENDED -> CREDIT_ACTIVE"
      - from: OPEN
        to: FINALIZED_DENIED
        trigger: "POST /credit-attestations/{id}/finalize"
        actor: InsurerAnalyst
        preconditions:
          - "CreditAttestation.status == OPEN"
          - "clock >= period_end_at"
          - "uptime_pct < UPTIME_CREDIT_FLOOR_PCT (denial_reason = UPTIME_BELOW_FLOOR) OR resolved Device.lifecycle_state != ARMED (DEVICE_NOT_ARMED) OR no Device resolves for the policy's property (NO_ENROLLED_DEVICE)"
        side_effects:
          - "writes covered_minutes, uptime_pct, offline_gap_count, denial_reason, finalized_at; credit_cents_awarded stays 0 and tier_pct = 0"
          - "sets policy.last_attestation_end_at = period_end_at and, when the policy was CREDIT_ACTIVE and denial_reason == UPTIME_BELOW_FLOOR, drives CREDIT_ACTIVE -> CREDIT_SUSPENDED"

  # ---------------------------------------------------------------- ReimbursementClaim: cyclic review
  - entity: ReimbursementClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/decision with decision == BEGIN_REVIEW"
        actor: ClaimsAdjuster
        preconditions: ["ReimbursementClaim.status == SUBMITTED", "the claim's InsurancePolicy.credit_state != TERMINATED"]
        side_effects: ["increments ReimbursementClaim.version by 1"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /claims/{id}/decision with decision == REQUEST_INFO"
        actor: ClaimsAdjuster
        preconditions: ["ReimbursementClaim.status == UNDER_REVIEW"]
        side_effects: ["increments info_request_count by 1", "increments ReimbursementClaim.version by 1"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/decision with decision == SUPPLY_INFO"
        actor: Homeowner
        preconditions: ["ReimbursementClaim.status == INFO_REQUESTED", "acting Homeowner.id == submitted_by_user_id"]
        side_effects: ["increments ReimbursementClaim.version by 1"]
        note: "Cycle: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW may repeat; info_request_count records the loop count."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/decision with decision == APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "ReimbursementClaim.status == UNDER_REVIEW"
          - "the claim's InsurancePolicy.credit_state != TERMINATED"
          - "for claim_type == WARRANTY_DEVICE: X-User-ID != Device.install_verified_by_user_id"
          - "policy.paid_payout_cents_total + computed payout <= POLICY_ANNUAL_PAYOUT_CAP_CENTS"
        side_effects:
          - "runs claim_payout_award; writes payout_variant, approved_payout_cents, deductible_applied_cents, decided_by_user_id, decided_at"
          - "increments ReimbursementClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/decision with decision == DENY"
        actor: ClaimsAdjuster
        preconditions: ["ReimbursementClaim.status == UNDER_REVIEW", "denial_reason supplied"]
        side_effects: ["writes denial_reason, decided_by_user_id, decided_at; approved_payout_cents stays 0", "increments ReimbursementClaim.version by 1"]
      - from: APPROVED
        to: PAID
        trigger: "POST /claims/{id}/decision with decision == PAY"
        actor: InsurerAnalyst
        preconditions: ["ReimbursementClaim.status == APPROVED", "policy.paid_payout_cents_total + approved_payout_cents <= POLICY_ANNUAL_PAYOUT_CAP_CENTS"]
        side_effects: ["sets paid_at = clock", "increments policy.paid_payout_cents_total by approved_payout_cents and policy.version by 1", "increments ReimbursementClaim.version by 1"]
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /homeowners/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["Homeowner.account_state == ACTIVE", "no claim on the account has status == APPROVED"]
        side_effects: ["sets denial_reason = ACCOUNT_CLOSED, decided_at = clock"]
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /homeowners/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["Homeowner.account_state == ACTIVE"]
        side_effects: ["sets denial_reason = ACCOUNT_CLOSED, decided_at = clock"]
      - from: INFO_REQUESTED
        to: DENIED
        trigger: "POST /homeowners/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["Homeowner.account_state == ACTIVE"]
        side_effects: ["sets denial_reason = ACCOUNT_CLOSED, decided_at = clock"]

  # ---------------------------------------------------------------- DeviceTransfer
  - entity: DeviceTransfer
    state_field: status
    initial_state: INITIATED
    terminal_states: [ACCEPTED, CANCELLED, EXPIRED]
    transitions:
      - from: INITIATED
        to: ACCEPTED
        trigger: "POST /device-transfers/{id}/accept"
        actor: Homeowner
        preconditions:
          - "DeviceTransfer.status == INITIATED"
          - "clock <= expires_at"
          - "acting Homeowner.id == to_homeowner_id and that Homeowner.account_state == ACTIVE"
          - "Device.valve_state == OPEN"
          - "no AnomalyEvent for the device with event_state IN {ALERTED, ESCALATED}"
        side_effects:
          - "cascade hop 1: sets accepted_at = clock, accepted_by_user_id = X-User-ID"
          - "cascade hop 2: Property.homeowner_id = to_homeowner_id, property_state TRANSFER_PENDING -> ACTIVE, Property.version += 1"
          - "cascade hop 3: the ownership rewrite invalidates BaselineProfile (COMPLETE -> INVALIDATED, OWNERSHIP_TRANSFER)"
          - "cascade hop 4: the invalidation demotes Device TRANSFER_PENDING -> LEARNING and clears monitor_mode to NORMAL"
          - "cascade hop 5: the demotion suspends the property's InsurancePolicy (CREDIT_ACTIVE -> CREDIT_SUSPENDED, OWNERSHIP_TRANSFER) and claws back the newest awarded period"
          - "every IrrigationWindow of the property with status == ACTIVE is retained as-is (irrigation schedules travel with the property)"
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /device-transfers (a newer transfer for the same device supersedes this one)"
        actor: system
        preconditions: ["DeviceTransfer.status == INITIATED"]
        side_effects: ["sets cancel_reason = SUPERSEDED; the device stays TRANSFER_PENDING under the newer transfer"]
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /homeowners/{id}/deactivate"
        actor: ProgramAdmin
        preconditions: ["DeviceTransfer.status == INITIATED"]
        side_effects: ["sets cancel_reason = ACCOUNT_DEACTIVATED; the device is decommissioned by the same cascade"]
      - from: INITIATED
        to: EXPIRED
        trigger: "system: POST /ops-sweeps observes clock > expires_at"
        actor: system
        preconditions: ["DeviceTransfer.status == INITIATED", "clock > expires_at"]
        side_effects:
          - "restores Device.lifecycle_state TRANSFER_PENDING -> ARMED when BaselineProfile.learning_state == COMPLETE, else -> LEARNING"
          - "restores Property.property_state TRANSFER_PENDING -> ACTIVE and increments Property.version by 1"

concurrency_rules:
  - rule_id: transfer-create-stale-device
    parent_entity: Device
    write_endpoint: "POST /device-transfers"
    occ_field: "expected_device_version"
    description: |
      Creating a DeviceTransfer against a Device whose version has advanced
      since the client last observed it is rejected. A newer transfer
      legitimately supersedes the prior INITIATED one, so the write itself is
      valid product behaviour; what the check catches is a seller acting on a
      stale view of the device (an auto-shutoff, a mode change, or another
      transfer has landed in between).
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412
  - rule_id: valve-reopen-stale-device
    parent_entity: Device
    write_endpoint: "POST /devices/{id}/valve-commands"
    occ_field: "expected_device_version"
    description: |
      A valve command carrying a device version older than Device.version is
      rejected. Reopening a closed valve is legitimate product behaviour on its
      own, so this is not covered by any state precondition: the homeowner must
      prove the command was formed against the newest device snapshot before the
      server will move water.
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412
  - rule_id: policy-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /policies"
    occ_field: "expected_property_version"
    description: |
      Creating an InsurancePolicy supersedes any prior non-TERMINATED policy on
      the property, so a second create is legitimate on its own; it is rejected
      only when the submitted expected_property_version is behind
      Property.version, meaning the analyst never saw the policy that already
      superseded theirs.
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412

calculations:
  - rule_id: baseline_learning_profile
    name: "Baseline pressure/flow learning profile"
    trigger: "POST /devices/{id}/telemetry (recomputed on every accepted reading while BaselineProfile.learning_state == COLLECTING)"
    algorithm_type: aggregation
    inputs:
      - "TelemetryReading rows for the device with baseline_eligible == true and reading_at >= BaselineProfile.learning_started_at"
      - "BaselineProfile.learning_cycle_no"
      - "constant MIN_LEARNING_SAMPLES, DRIP_FRACTION, MIN_DRIP_GPM"
    formula: |
      sample_count = count(input readings)
      baseline_static_pressure_psi = round(sum(r.static_pressure_psi for r in readings) / sample_count, 1)   # ROUND_HALF_UP, 1dp
      baseline_peak_flow_gpm = round(max(r.flow_gpm for r in readings), 2)                                        # 2dp
      drip_threshold_gpm = round(max(MIN_DRIP_GPM, baseline_peak_flow_gpm * DRIP_FRACTION), 2)                         # 2dp
      learning_state = COMPLETE when sample_count >= MIN_LEARNING_SAMPLES else COLLECTING
      every publication of these three values increments BaselineProfile.baseline_version by 1,
      and reaching COMPLETE sets completed_at = clock and promotes Device LEARNING -> ARMED
    constants:
      MIN_LEARNING_SAMPLES: 3
      DRIP_FRACTION: 0.02
      MIN_DRIP_GPM: 0.05
    precision: "baseline_static_pressure_psi 1 decimal place; baseline_peak_flow_gpm and drip_threshold_gpm 2 decimal places; ROUND_HALF_UP"
    edge_cases:
      - "sample_count == 0: baseline_static_pressure_psi and baseline_peak_flow_gpm stay null, drip_threshold_gpm stays null, learning_state stays COLLECTING"
      - "all readings have flow_gpm == 0: baseline_peak_flow_gpm == 0.00 and drip_threshold_gpm == max(0.05, 0.00) == 0.05 (the MIN_DRIP_GPM floor binds)"
      - "readings rejected by validation (out-of-order, backdated, future) never enter the input set, so they never move sample_count"
      - "readings from an earlier learning_cycle_no are excluded: a relearn starts the aggregate from zero"
    evaluation_order: |
      MANDATORY ORDERING (breaks the apparent circularity between baseline and classification):
      Within one POST /devices/{id}/telemetry the server executes exactly:
        step 1  persist the TelemetryReading (readings are immutable; a rejected reading is never persisted)
        step 2  run anomaly_classification USING THE BASELINE SNAPSHOT AS IT EXISTS BEFORE step 3
                (i.e. the profile published by earlier readings; baseline_version_used is recorded on
                the AnomalyEvent). When learning_state == COLLECTING the classification is skipped and
                classification_at_ingest = NONE and baseline_eligible = true.
        step 3  recompute baseline_learning_profile over the readings including this one, and publish
                the new snapshot (baseline_version += 1)
      Consequence: the reading that completes learning is itself never classified, and the classification
      written on a reading is permanently frozen in TelemetryReading.classification_at_ingest -- later
      baseline recomputation NEVER reclassifies historical readings.

  - rule_id: anomaly_classification
    name: "Anomaly classification (drip / running fixture / catastrophic burst)"
    trigger: "POST /devices/{id}/telemetry step 2, only when BaselineProfile.learning_state == COMPLETE and Device.lifecycle_state == ARMED"
    algorithm_type: threshold
    inputs:
      - "TelemetryReading.flow_gpm, duration_minutes, total_gallons"
      - "BaselineProfile.baseline_peak_flow_gpm and drip_threshold_gpm (the pre-step-3 snapshot)"
      - "Device.monitor_mode and the resolved sensitivity multiplier"
      - "constant BURST_FLOW_FACTOR, BURST_MIN_DURATION_MINUTES, BURST_MIN_GALLONS, RUNNING_FLOW_FACTOR, RUNNING_MIN_DURATION_MINUTES, DRIP_MIN_DURATION_MINUTES, VACATION_SENSITIVITY_MULTIPLIER, VACATION_RUNNING_GALLON_CAP"
    formula: |
      # sensitivity multiplier: VACATION tightens every flow and gallon threshold, SNOOZE and NORMAL do not
      m = VACATION_SENSITIVITY_MULTIPLIER if Device.monitor_mode == VACATION else 1.00

      burst_flow_gate    = round(baseline_peak_flow_gpm * BURST_FLOW_FACTOR   * m, 2)
      running_flow_gate  = round(baseline_peak_flow_gpm * RUNNING_FLOW_FACTOR * m, 2)
      burst_gallon_gate  = round(BURST_MIN_GALLONS * m, 2)
      drip_gate          = drip_threshold_gpm      # drip gate is NOT scaled by m; the drip floor is absolute

      # ordered, first-match-wins ladder (evaluate top to bottom; CATASTROPHIC_BURST outranks RUNNING_FIXTURE outranks DRIP)
      if flow_gpm >= burst_flow_gate
         and duration_minutes >= BURST_MIN_DURATION_MINUTES
         and total_gallons >= burst_gallon_gate:                      classification = CATASTROPHIC_BURST
      elif flow_gpm >= running_flow_gate
         and duration_minutes >= RUNNING_MIN_DURATION_MINUTES:        classification = RUNNING_FIXTURE
      elif Device.monitor_mode == VACATION
         and flow_gpm > 0
         and total_gallons >= VACATION_RUNNING_GALLON_CAP:            classification = RUNNING_FIXTURE
      elif flow_gpm >= drip_gate
         and duration_minutes >= DRIP_MIN_DURATION_MINUTES:           classification = DRIP
      else:                                                               classification = NONE
    constants:
      BURST_FLOW_FACTOR: 1.50
      BURST_MIN_DURATION_MINUTES: 3
      BURST_MIN_GALLONS: 30
      RUNNING_FLOW_FACTOR: 0.40
      RUNNING_MIN_DURATION_MINUTES: 20
      DRIP_MIN_DURATION_MINUTES: 60
      VACATION_SENSITIVITY_MULTIPLIER: 0.50
      VACATION_RUNNING_GALLON_CAP: 15
    precision: "all gates rounded to 2 decimal places ROUND_HALF_UP before comparison; comparisons are inclusive (>=) on every gate except the VACATION flow_gpm > 0 liveness test"
    edge_cases:
      - "the reading falls inside an ACTIVE IrrigationWindow for the property: classification is forced to NONE and TelemetryReading.suppressed_by_irrigation = true, no AnomalyEvent is written (see false_positive_tuning and the irrigation validations)"
      - "flow_gpm exactly equal to burst_flow_gate with duration_minutes exactly BURST_MIN_DURATION_MINUTES and gallons exactly burst_gallon_gate: CATASTROPHIC_BURST (all gates inclusive)"
      - "a reading that satisfies both the CATASTROPHIC_BURST flow gate and the RUNNING_FIXTURE gates classifies as CATASTROPHIC_BURST only; the ladder never emits two classifications"
      - "monitor_mode == SNOOZE: classification runs unchanged (m == 1.00) but the resulting AnomalyEvent is created in SUPPRESSED, not ALERTED"
      - "classification == NONE writes no AnomalyEvent at all"

  - rule_id: severity_score
    name: "Anomaly severity score"
    trigger: "system, on AnomalyEvent creation (classification != NONE)"
    algorithm_type: weighted_scoring
    inputs:
      - "TelemetryReading.flow_gpm, duration_minutes, total_gallons"
      - "the same burst gates used by anomaly_classification"
      - "constant SEVERITY_FLOW_WEIGHT, SEVERITY_DURATION_WEIGHT, SEVERITY_GALLON_WEIGHT, SEVERITY_REFERENCE_FACTOR"
    formula: |
      flow_ref     = round(burst_flow_gate                         * SEVERITY_REFERENCE_FACTOR, 4)
      duration_ref = round(BURST_MIN_DURATION_MINUTES              * SEVERITY_REFERENCE_FACTOR, 4)
      gallon_ref   = round(burst_gallon_gate                       * SEVERITY_REFERENCE_FACTOR, 4)

      flow_component     = min(1.0, flow_gpm          / flow_ref)
      duration_component = min(1.0, duration_minutes  / duration_ref)
      gallon_component   = min(1.0, total_gallons     / gallon_ref)

      severity_score = round(  flow_component     * SEVERITY_FLOW_WEIGHT
                             + duration_component * SEVERITY_DURATION_WEIGHT
                             + gallon_component   * SEVERITY_GALLON_WEIGHT, 3)
    constants:
      SEVERITY_FLOW_WEIGHT: 0.50
      SEVERITY_DURATION_WEIGHT: 0.30
      SEVERITY_GALLON_WEIGHT: 0.20
      SEVERITY_REFERENCE_FACTOR: 2.00
    precision: "reference denominators rounded to 4 decimal places; components not rounded individually; severity_score rounded once to 3 decimal places ROUND_HALF_UP"
    edge_cases:
      - "weights sum to exactly 1.00, so every component saturating at 1.0 yields severity_score == 1.000 and never exceeds it"
      - "components are clamped individually before weighting: a single enormous flow cannot push the score past 0.500 on its own"
      - "rounding is applied once at the end, so summing three separately-rounded components is wrong"
      - "a DRIP with flow 0.12, duration 60, gallons 0.5 against gates burst_flow_gate 9.00 / duration 3 / gallons 30 yields flow_component 0.006666..., duration_component 1.0, gallon_component 0.008333... -> severity_score 0.305"

  - rule_id: auto_shutoff_decision
    name: "Auto-shutoff policy"
    trigger: "system, immediately after an AnomalyEvent is created"
    algorithm_type: threshold
    inputs:
      - "AnomalyEvent.classification and event_state"
      - "Device.monitor_mode, Device.valve_state, Device.close_count"
      - "AnomalyEvent.override_reopen_at of the device's still-open events"
      - "constant OVERRIDE_GRACE_MINUTES"
    formula: |
      shutoff_required =
            true   if AnomalyEvent.classification == CATASTROPHIC_BURST
            true   if AnomalyEvent.classification == RUNNING_FIXTURE and Device.monitor_mode == VACATION
            false  otherwise

      # gating, applied in this order once shutoff_required is true
      if AnomalyEvent.event_state == SUPPRESSED:                                  skip, reason = MODE_SNOOZED
      elif Device.valve_state == CLOSED:                                          skip, reason = VALVE_ALREADY_CLOSED
      elif the device has an AnomalyEvent with event_state IN {ALERTED, ESCALATED} whose
           override_reopen_at is not null and clock < override_reopen_at
                                              + OVERRIDE_GRACE_MINUTES minutes:   skip (homeowner override grace)
      else:                                                                      execute:
            Device.valve_state = CLOSED, close_count += 1, last_shutoff_at = clock
            Device.version += 1
            AnomalyEvent.auto_shutoff_executed = true
            AnomalyEvent.shutoff_latency_minutes = round((clock - AnomalyEvent.detected_at) in minutes, 1)
            every IrrigationWindow of the property with status == ACTIVE -> SUSPENDED_BY_SHUTOFF
    constants:
      OVERRIDE_GRACE_MINUTES: 120
    precision: "no arithmetic; the override comparison is strict (clock < override_until_at means still immune, clock == override_until_at means the grace has lapsed)"
    edge_cases:
      - "DRIP never triggers auto-shutoff in any mode; it only alerts"
      - "RUNNING_FIXTURE in NORMAL mode alerts without closing the valve; the same reading in VACATION mode closes it"
      - "a CATASTROPHIC_BURST arriving while monitor_mode == SNOOZE creates a SUPPRESSED event (suppression_reason SNOOZE_ACTIVE) and leaves the valve OPEN with auto_shutoff_executed == false"
      - "auto_shutoff_executed stays false and shutoff_latency_minutes stays null on every skipped path, which is exactly what AnomalyEvent.mitigation_credited reads to select MITIGATED vs UNMITIGATED"

  - rule_id: uptime_coverage_pct
    name: "Device health uptime coverage for an attestation period"
    trigger: "POST /credit-attestations/{id}/finalize, and read-only on GET /devices/{id}/health-summary"
    algorithm_type: interval_merge
    inputs:
      - "TelemetryReading rows for the resolved Device with period_start_at <= reading_at < period_end_at (rejected readings were never persisted, so every stored row counts)"
      - "CreditAttestation.period_start_at and period_end_at"
      - "constant COVERAGE_MINUTES_PER_READING, MIN_OFFLINE_GAP_MINUTES"
    formula: |
      # every accepted reading vouches for the COVERAGE_MINUTES_PER_READING that follow it
      intervals = [ (r.reading_at, min(r.reading_at + COVERAGE_MINUTES_PER_READING minutes, period_end_at))
                    for r in input readings ]
      merge intervals sorted by start ASC: two intervals merge when next.start <= current.end
                                           (adjacency with gap == 0 merges)
      covered_minutes = sum of merged interval lengths in whole minutes
      period_minutes  = (period_end_at - period_start_at) in whole minutes
      uptime_pct      = round(covered_minutes * 100 / period_minutes, 2)
      offline_gap_count = number of maximal uncovered sub-intervals of [period_start_at, period_end_at)
                          whose length >= MIN_OFFLINE_GAP_MINUTES
    constants:
      COVERAGE_MINUTES_PER_READING: 120
      MIN_OFFLINE_GAP_MINUTES: 60
    precision: "uptime_pct 2 decimal places ROUND_HALF_UP; covered_minutes and period_minutes are whole minutes"
    edge_cases:
      - "coverage never carries across a period boundary: a reading recorded before period_start_at contributes nothing to this period even though its 120-minute window would overlap it"
      - "the tail of the last reading is clamped at period_end_at, so covered_minutes can never exceed period_minutes and uptime_pct can never exceed 100.00"
      - "adjacent readings exactly COVERAGE_MINUTES_PER_READING apart merge into one interval with no lost minute (readings at 06:40 and 08:40 cover a single 240-minute block)"
      - "worked example: period [2026-08-02T00:00Z, 2026-08-02T06:40Z) is 400 minutes; readings at 00:00, 02:00, 04:00 and 06:20 merge to [00:00,06:00) plus the clamped [06:20,06:40) = 360 + 20 = 380 covered minutes -> uptime_pct == 95.00 exactly, and the single 20-minute hole is below MIN_OFFLINE_GAP_MINUTES so offline_gap_count == 0"
      - "readings rejected by any telemetry validation are absent from the input set and therefore lower uptime"
      - "zero accepted readings: covered_minutes == 0, uptime_pct == 0.00, offline_gap_count == 1 when period_minutes >= MIN_OFFLINE_GAP_MINUTES"

  - rule_id: premium_credit_award
    name: "Insurer premium credit award (dual variant)"
    trigger: "POST /credit-attestations/{id}/finalize"
    algorithm_type: tiered_pricing
    inputs:
      - "CreditAttestation.uptime_pct (from uptime_coverage_pct)"
      - "InsurancePolicy.annual_premium_cents, finalized_period_count, credited_cents_total"
      - "the tier_pct of every prior CreditAttestation on the policy with status == FINALIZED_AWARDED or FINALIZED_DENIED"
      - "constant UPTIME_CREDIT_FLOOR_PCT, TIER_ELITE_PCT/CUT, TIER_STRONG_PCT/CUT, TIER_BASE_PCT/CUT, PERIODS_PER_POLICY_YEAR"
    formula: |
      # tier selection: first matching band wins, all cuts inclusive
      tier_pct = TIER_ELITE_PCT  if uptime_pct >= TIER_ELITE_CUT
                 TIER_STRONG_PCT if uptime_pct >= TIER_STRONG_CUT
                 TIER_BASE_PCT   if uptime_pct >= TIER_BASE_CUT
                 0.00            otherwise   (-> FINALIZED_DENIED, denial_reason UPTIME_BELOW_FLOOR)

      VARIANT provisional_period_accrual   (every finalize)
        credit_cents_awarded = round(annual_premium_cents * tier_pct / PERIODS_PER_POLICY_YEAR, 0)

      VARIANT final_annual_true_up   (only on the finalize where finalized_period_count reaches
                                     PERIODS_PER_POLICY_YEAR; is_policy_year_close = true)
        annual_tier_sum   = sum(tier_pct of all PERIODS_PER_POLICY_YEAR finalized periods, this one included)
        annual_credit_cents = round(annual_premium_cents * annual_tier_sum / PERIODS_PER_POLICY_YEAR, 0)
        true_up_cents       = annual_credit_cents - sum(credit_cents_awarded of those same periods)
    variants:
      provisional_period_accrual: "Rounds to whole cents ONCE PER PERIOD and books that amount immediately; this is the amount the homeowner sees credited during the year."
      final_annual_true_up: "Recomputes the year from the annual premium with a SINGLE rounding at the end, then books only the difference. Because rounding is applied once instead of PERIODS_PER_POLICY_YEAR times, the two variants disagree by a few cents and true_up_cents may be negative."
    constants:
      UPTIME_CREDIT_FLOOR_PCT: 95.00
      TIER_ELITE_CUT: 99.00
      TIER_ELITE_PCT: 0.12
      TIER_STRONG_CUT: 97.00
      TIER_STRONG_PCT: 0.08
      TIER_BASE_CUT: 95.00
      TIER_BASE_PCT: 0.05
      PERIODS_PER_POLICY_YEAR: 2
    precision: "cent amounts are integers produced with ROUND_HALF_UP at 0 decimal places; tier_pct carries 2 decimal places; uptime_pct comparisons use the 2-decimal value produced by uptime_coverage_pct with no re-rounding"
    edge_cases:
      - "uptime_pct exactly 95.00 awards TIER_BASE_PCT (the floor is inclusive); 94.99 denies with UPTIME_BELOW_FLOOR"
      - "uptime_pct exactly 97.00 awards 0.08 and exactly 99.00 awards 0.12; the bands are not interpolated"
      - "worked divergence: annual_premium_cents 149900 with both periods at tier 0.05 gives provisional 149900*0.05/2 = 3747.5 -> 3748 per period (7496 booked) while the annual close computes 149900*0.10/2 = 7495.0 -> 7495, so true_up_cents == -1"
      - "a denied period contributes tier_pct 0.00 to annual_tier_sum and 0 to the provisional sum, so it drags the annual number down without producing a clawback"
      - "a clawback triggered by a device leaving ARMED subtracts the most recent awarded period from credited_cents_total but never rewrites the CreditAttestation rows"

  - rule_id: claim_payout_award
    name: "Water-damage / warranty reimbursement payout (dual variant)"
    trigger: "POST /claims/{id}/decision with decision == APPROVE"
    algorithm_type: waterfall_allocation
    inputs:
      - "ReimbursementClaim.documented_loss_cents, claim_type, anomaly_event_id"
      - "AnomalyEvent.detected_at, auto_shutoff_executed, shutoff_latency_minutes, override_reopen_at and mitigation_credited"
      - "InsurancePolicy.deductible_cents, paid_payout_cents_total"
      - "constant MITIGATION_WINDOW_MINUTES, WATER_DAMAGE_CAP_CENTS, WARRANTY_CAP_CENTS, UNMITIGATED_FACTOR, POLICY_ANNUAL_PAYOUT_CAP_CENTS"
    formula: |
      # ---- variant selection -------------------------------------------------
      # AnomalyEvent.mitigation_credited is true only when auto_shutoff_executed == true
      # AND shutoff_latency_minutes <= MITIGATION_WINDOW_MINUTES AND override_reopen_at IS NULL
      if claim_type == WARRANTY_DEVICE:                                   variant = WARRANTY_FLAT
      elif AnomalyEvent.mitigation_credited == true:                      variant = MITIGATED
      else:                                                              variant = UNMITIGATED

      # ---- waterfall ---------------------------------------------------------
      if variant == WARRANTY_FLAT:
          deductible_applied_cents = 0
          approved_payout_cents    = min(documented_loss_cents, WARRANTY_CAP_CENTS)
      elif variant == MITIGATED:
          deductible_applied_cents = 0                     # deductible is WAIVED as the mitigation reward
          approved_payout_cents    = min(documented_loss_cents, WATER_DAMAGE_CAP_CENTS)
      else:
          deductible_applied_cents = min(documented_loss_cents, InsurancePolicy.deductible_cents)
          net_cents                = documented_loss_cents - deductible_applied_cents
          approved_payout_cents    = min(round(net_cents * UNMITIGATED_FACTOR, 0),
                                        round(WATER_DAMAGE_CAP_CENTS * UNMITIGATED_FACTOR, 0))

      # ---- annual policy cap (checked, never silently truncated) -------------
      if InsurancePolicy.paid_payout_cents_total + approved_payout_cents > POLICY_ANNUAL_PAYOUT_CAP_CENTS:
          reject with ERR_ANNUAL_PAYOUT_CAP_EXCEEDED
    variants:
      MITIGATED: "The device closed the valve within MITIGATION_WINDOW_MINUTES of detection and the homeowner never overrode it, so the deductible is waived and the insurer pays the documented loss up to WATER_DAMAGE_CAP_CENTS."
      UNMITIGATED: "No shutoff, a shutoff later than MITIGATION_WINDOW_MINUTES, or a homeowner override that reopened the valve (override_reopen_at set) -- the deductible bites AND both the net loss and the cap are scaled by UNMITIGATED_FACTOR."
    constants:
      MITIGATION_WINDOW_MINUTES: 5
      WATER_DAMAGE_CAP_CENTS: 500000
      WARRANTY_CAP_CENTS: 150000
      UNMITIGATED_FACTOR: 0.50
      POLICY_ANNUAL_PAYOUT_CAP_CENTS: 600000
    precision: "all money is integer cents; the UNMITIGATED scaling uses ROUND_HALF_UP at 0 decimal places, and the scaled cap is rounded independently before the min() is taken"
    edge_cases:
      - "shutoff_latency_minutes exactly MITIGATION_WINDOW_MINUTES keeps mitigation_credited true and selects MITIGATED (inclusive); 5.1 minutes selects UNMITIGATED"
      - "worked divergence on the same loss: documented_loss_cents 620000 with deductible_cents 100000 pays MITIGATED min(620000,500000) = 500000 with deductible_applied_cents 0, and UNMITIGATED min(round(520000*0.50)=260000, 250000) = 250000 with deductible_applied_cents 100000 -- the delta is 250000"
      - "a homeowner override flips an otherwise-mitigated event: override_reopen_at clears mitigation_credited, so the same event pays 250000 instead of 500000 and the adjuster may instead DENY with OVERRIDE_DEFEATED_MITIGATION"
      - "UNMITIGATED deductible larger than the loss: deductible_applied_cents == documented_loss_cents and net_cents == 0, so approved_payout_cents == 0 and the claim is still APPROVED (a zero-dollar approval, not a denial)"
      - "WARRANTY_FLAT ignores the deductible entirely and ignores mitigation, so a warranty claim on a SNOOZE-suppressed burst still pays up to WARRANTY_CAP_CENTS"
      - "the annual cap is evaluated against paid_payout_cents_total, which only moves on PAY -- two APPROVED-but-unpaid claims can each pass the cap check and the second one fails at PAY time"
      - "WATER_DAMAGE requires anomaly_event_id; WARRANTY_DEVICE may omit it, and when omitted the variant is WARRANTY_FLAT regardless of any mitigation history"

  - rule_id: false_positive_tuning
    name: "False-positive tuning and relearn escalation"
    trigger: "POST /anomaly-events/{id}/feedback with label == FALSE_POSITIVE"
    algorithm_type: constraint_propagation
    inputs:
      - "AnomalyEvent.classification and the device's BaselineProfile with learning_state == COMPLETE"
      - "AnomalyEvent rows for the device with feedback_label == FALSE_POSITIVE and updated_at >= clock - FALSE_POSITIVE_WINDOW_DAYS"
      - "constant TUNING_STEP, DRIP_CEILING_GPM, MAX_FALSE_POSITIVES_BEFORE_RELEARN, FALSE_POSITIVE_WINDOW_DAYS"
    formula: |
      step 1  AnomalyEvent.event_state -> FALSE_POSITIVE, feedback_label = FALSE_POSITIVE, updated_at = clock
      step 2  BaselineProfile.false_positive_count = count(rows in the input window, this event included)
      step 3  propagate the tuning into the live baseline (only when learning_state == COMPLETE):
                drip_threshold_gpm = round(min(DRIP_CEILING_GPM,
                                               drip_threshold_gpm * (1 + TUNING_STEP)), 2)
                last_false_positive_at = clock
                baseline_version += 1
      step 4  when BaselineProfile.false_positive_count >= MAX_FALSE_POSITIVES_BEFORE_RELEARN:
                BaselineProfile COMPLETE -> INVALIDATED (invalidated_reason FALSE_POSITIVE_THRESHOLD), completed_at = null
                Device ARMED -> LEARNING, Device.version += 1
                the next accepted reading reopens the same row as COLLECTING with learning_cycle_no += 1
                any InsurancePolicy on the property in CREDIT_ACTIVE -> CREDIT_SUSPENDED with clawback
    constants:
      TUNING_STEP: 0.20
      DRIP_CEILING_GPM: 0.50
      MAX_FALSE_POSITIVES_BEFORE_RELEARN: 3
      FALSE_POSITIVE_WINDOW_DAYS: 30
    precision: "drip_threshold_gpm 2 decimal places ROUND_HALF_UP after each propagation step"
    edge_cases:
      - "the tuning chain reaches a fixed point: 0.12 -> 0.14 -> 0.17 -> 0.20 -> 0.24 -> 0.29 -> 0.35 -> 0.42 -> 0.50 -> 0.50, and once DRIP_CEILING_GPM is reached further feedback leaves the threshold unchanged (no unbounded growth)"
      - "raising drip_threshold_gpm changes future classification: a reading at flow 0.13 that classified as DRIP before the first feedback classifies as NONE afterwards (gate moved to 0.14)"
      - "the relearn in step 4 discards the tuning: the next COMPLETE profile recomputes drip_threshold_gpm = round(max(MIN_DRIP_GPM, baseline_peak_flow_gpm * DRIP_FRACTION), 2) from scratch, discarding every tuning step"
      - "feedback with label == TRUE_POSITIVE moves the event to RESOLVED, does not touch any threshold, and does not increment false_positive_count"
      - "a feedback older than FALSE_POSITIVE_WINDOW_DAYS drops out of the count, so three false positives spread over 40 days never force a relearn"
      - "an event whose event_state was SUPPRESSED can still receive FALSE_POSITIVE feedback and still tunes the threshold"

  - rule_id: escalation_sla_evaluation
    name: "Alert escalation ladder (homeowner then emergency contact)"
    trigger: "POST /ops-sweeps"
    algorithm_type: chronological
    inputs:
      - "EscalationTicket rows with stage IN {PENDING_HOMEOWNER, PENDING_EMERGENCY_CONTACT} whose AnomalyEvent is still ALERTED or ESCALATED, ordered by created_at ASC"
      - "EmergencyContact rows for the homeowner with status == ACTIVE and verification_state == VERIFIED"
      - "constant HOMEOWNER_SLA_MINUTES, CONTACT_SLA_MINUTES"
    formula: |
      for each ticket in chronological order:
        if stage == PENDING_HOMEOWNER and clock >= homeowner_deadline_at:
            selected = the eligible EmergencyContact with the lowest priority_rank,
                       tie-broken by created_at ASC
            if selected exists:
                stage -> PENDING_EMERGENCY_CONTACT, notified_contact_id = selected.id,
                escalated_at = clock, contact_deadline_at = clock + CONTACT_SLA_MINUTES minutes,
                notification_attempt_count = 2, selected.last_notified_at = clock
                AnomalyEvent ALERTED -> ESCALATED
            else:
                stage -> EXPIRED, expiry_reason = NO_ELIGIBLE_CONTACT
        elif stage == PENDING_EMERGENCY_CONTACT and clock >= contact_deadline_at:
            stage -> EXPIRED, expiry_reason = CONTACT_SLA_BREACH
      # the same sweep also reverts lapsed SNOOZE and VACATION modes and expires lapsed DeviceTransfers,
      # in the order: monitor-mode reverts, then escalations, then transfer expiries
    constants:
      HOMEOWNER_SLA_MINUTES: 15
      CONTACT_SLA_MINUTES: 30
    precision: "SLA comparisons are inclusive (clock exactly at the deadline escalates); no arithmetic beyond whole-minute offsets"
    edge_cases:
      - "clock exactly equal to homeowner_deadline_at (created_at + HOMEOWNER_SLA_MINUTES) escalates; one minute earlier does nothing and the ticket stays PENDING_HOMEOWNER"
      - "a single sweep can move a ticket at most one hop: a ticket that escalates to PENDING_EMERGENCY_CONTACT in this sweep cannot also expire in the same sweep because contact_deadline_at was just set to clock + CONTACT_SLA_MINUTES"
      - "an acknowledged ticket is skipped entirely; acknowledgement is the only non-sweep exit from the ladder"
      - "contacts with verification_state == PENDING are ineligible, so a homeowner with one unverified contact expires with NO_ELIGIBLE_CONTACT"
      - "priority_rank ties are impossible for ACTIVE contacts (uniqueness is enforced per homeowner) but a REMOVED row may share a rank, which is why the selector filters on status before ordering"

  - rule_id: operational_window_bounds
    name: "Admissibility windows and derived deadlines"
    trigger: "evaluated on POST /devices/{id}/verify-install, POST /devices/{id}/telemetry, POST /devices/{id}/monitor-mode, POST /claims, POST /device-transfers"
    algorithm_type: threshold
    inputs:
      - "the logical clock"
      - "Device.last_reading_at, Device.snooze_window_end_at, Device.vacation_ends_at"
      - "AnomalyEvent.detected_at, DeviceTransfer.initiated_at"
      - "the constants below"
    formula: |
      install pass          : INSTALL_MIN_STATIC_PSI <= installed_static_pressure_psi <= INSTALL_MAX_STATIC_PSI
                              AND pressure_drop_psi <= INSTALL_MAX_DROP_PSI          (all bounds inclusive)
      reading admissible    : Device.last_reading_at < reading_at <= clock
                              AND reading_at >= clock - MAX_READING_BACKDATE_HOURS hours
      duplicate suppression : an earlier AnomalyEvent of the same classification with
                              detected_at > clock - DUPLICATE_COOLDOWN_MINUTES minutes forces SUPPRESSED
      snooze admissible     : MIN_SNOOZE_MINUTES <= snooze_minutes <= MAX_SNOOZE_MINUTES
                              AND clock >= Device.snooze_window_end_at + SNOOZE_COOLDOWN_MINUTES minutes
      vacation admissible   : clock < vacation_ends_at <= clock + MAX_VACATION_DAYS days
      transfer expires_at   : initiated_at + TRANSFER_ACCEPT_WINDOW_HOURS hours
      claim admissible      : clock <= AnomalyEvent.detected_at + CLAIM_SUBMISSION_WINDOW_DAYS days
    constants:
      INSTALL_MIN_STATIC_PSI: 40.0
      INSTALL_MAX_STATIC_PSI: 80.0
      INSTALL_MAX_DROP_PSI: 2.0
      MAX_READING_BACKDATE_HOURS: 24
      DUPLICATE_COOLDOWN_MINUTES: 60
      MIN_SNOOZE_MINUTES: 30
      MAX_SNOOZE_MINUTES: 240
      SNOOZE_COOLDOWN_MINUTES: 60
      MAX_VACATION_DAYS: 90
      TRANSFER_ACCEPT_WINDOW_HOURS: 168
      CLAIM_SUBMISSION_WINDOW_DAYS: 30
      OVERRIDE_GRACE_MINUTES: 120
    precision: "every bound is inclusive at its stated end; durations are whole minutes, hours or days added to the logical clock with no timezone conversion"
    edge_cases:
      - "installed_static_pressure_psi exactly 40.0 or exactly 80.0 passes; 39.9 and 80.1 fail with ERR_INSTALL_PRESSURE_TEST_FAILED"
      - "pressure_drop_psi exactly 2.0 passes; 2.1 fails"
      - "reading_at exactly equal to the clock is accepted; one minute later fails with ERR_READING_IN_FUTURE"
      - "reading_at exactly clock - 24h is accepted; one minute earlier fails with ERR_READING_TOO_OLD"
      - "reading_at exactly equal to Device.last_reading_at fails with ERR_READING_OUT_OF_ORDER (strictly increasing stream)"
      - "a SNOOZE requested exactly at Device.snooze_window_end_at + 60 minutes is admitted; one minute earlier fails with ERR_SNOOZE_COOLDOWN_ACTIVE"
      - "accept exactly at DeviceTransfer.expires_at succeeds; the sweep expires the row only once the clock is strictly past it"

validations:
  # ---------------- 1. authentication ----------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and X-User-Role is one of Homeowner, InstallerTech, DeviceGateway, InsurerAnalyst, ClaimsAdjuster, ProgramAdmin"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  # ---------------- 2. authorization ----------------
  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the endpoint's allowed roles per the §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  # ---------------- 3. path existence, left to right ----------------
  - priority: 3
    category: existence
    check: "the {id} in /homeowners/{id} resolves to a Homeowner"
    error_id: ERR_HOMEOWNER_NOT_FOUND
    http_status: 404
    applies_to: "GET /homeowners/{id}, GET /homeowners/{id}/emergency-contacts, GET /homeowners/{id}/properties, POST /homeowners/{id}/emergency-contacts, POST /homeowners/{id}/deactivate"
  - priority: 3
    category: existence
    check: "the {id} in /properties/{id} resolves to a Property"
    error_id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    applies_to: "GET /properties/{id}, GET /properties/{id}/devices, GET /properties/{id}/irrigation-windows, GET /properties/{id}/policies, POST /properties/{id}/irrigation-windows"
  - priority: 3
    category: existence
    check: "the {id} in /devices/{id} resolves to a Device"
    error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    applies_to: "GET /devices/{id}, GET /devices/{id}/baseline-profiles, GET /devices/{id}/telemetry, GET /devices/{id}/health-summary, POST /devices/{id}/verify-install, POST /devices/{id}/telemetry, POST /devices/{id}/valve-commands, POST /devices/{id}/monitor-mode, POST /devices/{id}/firmware-updates"
  - priority: 3
    category: existence
    check: "the {id} in /anomaly-events/{id} resolves to an AnomalyEvent"
    error_id: ERR_ANOMALY_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /anomaly-events/{id}, POST /anomaly-events/{id}/feedback, POST /anomaly-events/{id}/resolve"
  - priority: 3
    category: existence
    check: "the {id} in /escalation-tickets/{id} resolves to an EscalationTicket"
    error_id: ERR_ESCALATION_TICKET_NOT_FOUND
    http_status: 404
    applies_to: "GET /escalation-tickets/{id}, POST /escalation-tickets/{id}/acknowledge"
  - priority: 3
    category: existence
    check: "the {id} in /policies/{id} resolves to an InsurancePolicy"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "GET /policies/{id}, GET /policies/{id}/credit-attestations, POST /policies/{id}/credit-attestations"
  - priority: 3
    category: existence
    check: "the {id} in /credit-attestations/{id} resolves to a CreditAttestation"
    error_id: ERR_ATTESTATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /credit-attestations/{id}/finalize"
  - priority: 3
    category: existence
    check: "the {id} in /claims/{id} resolves to a ReimbursementClaim"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /claims/{id}, POST /claims/{id}/decision"
  - priority: 3
    category: existence
    check: "the {id} in /device-transfers/{id} resolves to a DeviceTransfer"
    error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /device-transfers/{id}, POST /device-transfers/{id}/accept"
  # ---------------- 4. request shape ----------------
  - priority: 4
    category: existence
    check: "every required body field is present, every enum value is in range, every numeric field is non-negative and within its declared bound, every timestamp parses as ISO-8601 UTC, and interval bodies satisfy start_at < end_at (equal or inverted bounds are rejected)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  # ---------------- 5. body foreign keys ----------------
  - priority: 5
    category: existence
    check: "homeowner_id in a POST /properties body resolves to a Homeowner"
    error_id: ERR_HOMEOWNER_NOT_FOUND
    http_status: 404
    applies_to: "POST /properties, POST /device-transfers (to_homeowner_id)"
  - priority: 5
    category: existence
    check: "property_id in a POST /devices or POST /policies body resolves to a Property"
    error_id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    applies_to: "POST /devices, POST /policies"
  - priority: 5
    category: existence
    check: "device_id in a POST /device-transfers or POST /claims body resolves to a Device"
    error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    applies_to: "POST /device-transfers, POST /claims"
  - priority: 5
    category: existence
    check: "anomaly_event_id in a POST /claims body resolves to an AnomalyEvent"
    error_id: ERR_ANOMALY_EVENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /claims"
  - priority: 5
    category: existence
    check: "policy_id in a POST /claims body resolves to an InsurancePolicy"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "POST /claims"
  # ---------------- 6. ownership scoping ----------------
  - priority: 6
    category: auth
    check: "when X-User-Role == Homeowner, the resolved Homeowner behind the target resource (property owner, device property owner, event device owner, claim submitter, policy property owner) equals X-User-ID; a Homeowner acting on another account's resource is refused"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Homeowner-accessible endpoints"
  - priority: 7
    category: state
    check: "the Homeowner behind the request has account_state == ACTIVE; a DEACTIVATED account can neither act nor be the target of a write"
    error_id: ERR_HOMEOWNER_DEACTIVATED
    http_status: 409
    applies_to: "all write endpoints that resolve a Homeowner"
  # ---------------- 8-9. optimistic concurrency ----------------
  - priority: 8
    category: state
    check: "expected_device_version equals the current Device.version"
    error_id: ERR_STALE_DEVICE_VERSION
    http_status: 412
    applies_to: "POST /devices/{id}/valve-commands, POST /device-transfers"
  - priority: 9
    category: state
    check: "expected_property_version equals the current Property.version"
    error_id: ERR_STALE_PROPERTY_VERSION
    http_status: 412
    applies_to: "POST /policies"
  # ---------------- 10-12. uniqueness ----------------
  - priority: 10
    category: business_constraint
    check: "serial_number is unique across all Device rows"
    error_id: ERR_DEVICE_SERIAL_TAKEN
    http_status: 409
    applies_to: "POST /devices"
  - priority: 11
    category: business_constraint
    check: "policy_number is unique across all InsurancePolicy rows"
    error_id: ERR_POLICY_NUMBER_TAKEN
    http_status: 409
    applies_to: "POST /policies"
  - priority: 12
    category: business_constraint
    check: "priority_rank is unique among the homeowner's EmergencyContact rows with status == ACTIVE"
    error_id: ERR_CONTACT_RANK_TAKEN
    http_status: 409
    applies_to: "POST /homeowners/{id}/emergency-contacts"
  # ---------------- 13-20. state preconditions ----------------
  - priority: 13
    category: state
    check: "Device.lifecycle_state == REGISTERED (install verification is once-only)"
    error_id: ERR_INSTALL_ALREADY_VERIFIED
    http_status: 409
    applies_to: "POST /devices/{id}/verify-install"
  - priority: 14
    category: state
    check: "Device.lifecycle_state IN {LEARNING, ARMED, TRANSFER_PENDING}; a REGISTERED or DECOMMISSIONED device rejects telemetry"
    error_id: ERR_DEVICE_NOT_ACCEPTING_TELEMETRY
    http_status: 409
    applies_to: "POST /devices/{id}/telemetry"
  - priority: 15
    category: state
    check: "the requested valve command changes Device.valve_state (CLOSE on a CLOSED valve and OPEN on an OPEN valve are refused)"
    error_id: ERR_VALVE_ALREADY_IN_STATE
    http_status: 409
    applies_to: "POST /devices/{id}/valve-commands"
  - priority: 16
    category: state
    check: "AnomalyEvent.event_state IN {DETECTED, ALERTED, ESCALATED, SUPPRESSED}; a RESOLVED or FALSE_POSITIVE event accepts no further feedback or resolution"
    error_id: ERR_EVENT_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /anomaly-events/{id}/feedback, POST /anomaly-events/{id}/resolve"
  - priority: 17
    category: state
    check: "EscalationTicket.stage IN {PENDING_HOMEOWNER, PENDING_EMERGENCY_CONTACT}"
    error_id: ERR_TICKET_NOT_PENDING
    http_status: 409
    applies_to: "POST /escalation-tickets/{id}/acknowledge"
  - priority: 18
    category: state
    check: "CreditAttestation.status == OPEN"
    error_id: ERR_ATTESTATION_NOT_OPEN
    http_status: 409
    applies_to: "POST /credit-attestations/{id}/finalize"
  - priority: 19
    category: state
    check: "the submitted decision is legal for the claim's current status per the ReimbursementClaim state machine (BEGIN_REVIEW needs SUBMITTED, REQUEST_INFO needs UNDER_REVIEW, SUPPLY_INFO needs INFO_REQUESTED, APPROVE and DENY need UNDER_REVIEW, PAY needs APPROVED)"
    error_id: ERR_CLAIM_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /claims/{id}/decision"
  - priority: 20
    category: state
    check: "DeviceTransfer.status == INITIATED"
    error_id: ERR_TRANSFER_NOT_PENDING
    http_status: 409
    applies_to: "POST /device-transfers/{id}/accept"
  - priority: 21
    category: state
    check: "Device.lifecycle_state == ARMED for operations that presuppose an armed device (any monitor-mode change other than a revert to NORMAL)"
    error_id: ERR_DEVICE_NOT_ARMED
    http_status: 409
    applies_to: "POST /devices/{id}/monitor-mode (mode IN {VACATION, SNOOZE})"
  # ---------------- 22-24. safety before referential ----------------
  - priority: 22
    category: business_safety
    check: "a valve OPEN command is refused while the device still has an AnomalyEvent with classification == CATASTROPHIC_BURST and event_state IN {ALERTED, ESCALATED} UNLESS the command carries acknowledge_water_damage_risk == true together with a non-empty override_reason: the burst must be resolved, marked FALSE_POSITIVE, or explicitly overridden with a written acknowledgement before water is restored"
    error_id: ERR_UNRESOLVED_BURST_BLOCKS_REOPEN
    http_status: 409
    applies_to: "POST /devices/{id}/valve-commands (command == OPEN)"
  - priority: 23
    category: business_referential
    check: "a valve command is refused while Device.lifecycle_state == TRANSFER_PENDING: control is frozen for the duration of a pending sale"
    error_id: ERR_DEVICE_TRANSFER_LOCKED
    http_status: 409
    applies_to: "POST /devices/{id}/valve-commands, POST /devices/{id}/monitor-mode, POST /devices/{id}/firmware-updates"
  - priority: 24
    category: business_constraint
    check: "the requested monitor_mode transition exists in the Device.monitor_mode machine (VACATION -> SNOOZE and SNOOZE -> VACATION are not transitions; the device must return to NORMAL first)"
    error_id: ERR_MODE_TRANSITION_FORBIDDEN
    http_status: 409
    applies_to: "POST /devices/{id}/monitor-mode"
  - priority: 25
    category: business_temporal
    check: "a new SNOOZE is refused while clock < Device.snooze_window_end_at + SNOOZE_COOLDOWN_MINUTES; the buffered boundary itself is available (clock exactly at snooze_window_end_at + SNOOZE_COOLDOWN_MINUTES passes)"
    error_id: ERR_SNOOZE_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /devices/{id}/monitor-mode (mode == SNOOZE)"
  - priority: 26
    category: business_safety
    check: "install verification requires INSTALL_MIN_STATIC_PSI <= installed_static_pressure_psi <= INSTALL_MAX_STATIC_PSI and pressure_drop_psi <= INSTALL_MAX_DROP_PSI; all three bounds are inclusive"
    error_id: ERR_INSTALL_PRESSURE_TEST_FAILED
    http_status: 422
    applies_to: "POST /devices/{id}/verify-install"
  - priority: 27
    category: business_constraint
    check: "opening a CreditAttestation requires the property's Device to have a BaselineProfile with learning_state == COMPLETE (this is the sole armed-device gate on attestation opening: a LEARNING or INVALIDATED device fails here, not at priority 21)"
    error_id: ERR_BASELINE_NOT_COMPLETE
    http_status: 409
    applies_to: "POST /policies/{id}/credit-attestations"
  # ---------------- 28-31. telemetry temporal integrity ----------------
  - priority: 28
    category: business_temporal
    check: "reading_at <= clock; a reading stamped in the future is refused"
    error_id: ERR_READING_IN_FUTURE
    http_status: 422
    applies_to: "POST /devices/{id}/telemetry"
  - priority: 29
    category: business_temporal
    check: "reading_at >= clock - MAX_READING_BACKDATE_HOURS; the boundary itself is accepted"
    error_id: ERR_READING_TOO_OLD
    http_status: 422
    applies_to: "POST /devices/{id}/telemetry"
  - priority: 30
    category: business_temporal
    check: "reading_at > the device's newest accepted TelemetryReading.reading_at; equal timestamps are refused (the stream is strictly increasing)"
    error_id: ERR_READING_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /devices/{id}/telemetry"
  # ---------------- 31-32. irrigation windows ----------------
  - priority: 31
    category: business_temporal
    check: "the submitted [start_at, end_at) must not overlap any IrrigationWindow of the property with status == ACTIVE under half-open semantics: a new window starting exactly at an existing window's end_at is accepted, one starting one minute earlier is refused"
    error_id: ERR_IRRIGATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /properties/{id}/irrigation-windows"
  - priority: 32
    category: business_constraint
    check: "the property has irrigation_present == true"
    error_id: ERR_IRRIGATION_NOT_ENABLED
    http_status: 409
    applies_to: "POST /properties/{id}/irrigation-windows"
  # ---------------- 33-36. attestation periods ----------------
  - priority: 33
    category: business_temporal
    check: "the submitted [period_start_at, period_end_at) must not overlap any CreditAttestation of the policy under half-open semantics (a period starting exactly at a prior period's end is not an overlap)"
    error_id: ERR_ATTESTATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /policies/{id}/credit-attestations"
  - priority: 34
    category: business_constraint
    check: "period_start_at equals InsurancePolicy.last_attestation_end_at when the policy has a finalized period, otherwise equals InsurancePolicy.policy_year_start_at; gaps in the attestation chain are refused"
    error_id: ERR_ATTESTATION_PERIOD_NOT_CONTIGUOUS
    http_status: 409
    applies_to: "POST /policies/{id}/credit-attestations"
  - priority: 35
    category: business_temporal
    check: "clock >= CreditAttestation.period_end_at at finalize time; the boundary itself is finalizable"
    error_id: ERR_ATTESTATION_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /credit-attestations/{id}/finalize"
  - priority: 36
    category: state
    check: "InsurancePolicy.credit_state != TERMINATED for any write that depends on the policy (opening or finalizing an attestation, submitting a claim, beginning review, approving, paying)"
    error_id: ERR_POLICY_TERMINATED
    http_status: 409
    applies_to: "POST /policies/{id}/credit-attestations, POST /credit-attestations/{id}/finalize, POST /claims, POST /claims/{id}/decision"
  # ---------------- 37-40. claim intake ----------------
  - priority: 37
    category: business_referential
    check: "anomaly_event_id is present for claim_type == WATER_DAMAGE, the referenced AnomalyEvent belongs to the referenced Device, and the device belongs to the policy's property"
    error_id: ERR_NO_QUALIFYING_EVENT
    http_status: 409
    applies_to: "POST /claims"
  - priority: 38
    category: business_temporal
    check: "clock <= AnomalyEvent.detected_at + CLAIM_SUBMISSION_WINDOW_DAYS; the last instant of the window is still accepted"
    error_id: ERR_CLAIM_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /claims"
  - priority: 39
    category: business_constraint
    check: "no other ReimbursementClaim exists for the same (anomaly_event_id, claim_type) pair with status not in {DENIED}"
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /claims"
  - priority: 40
    category: business_safety
    check: "segregation of duties: the X-User-ID approving a WARRANTY_DEVICE claim must differ from Device.install_verified_by_user_id, and the X-User-ID paying a claim must differ from ReimbursementClaim.decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /claims/{id}/decision (decision IN {APPROVE, PAY})"
  # ---------------- 41-44. transfers ----------------
  - priority: 41
    category: business_safety
    check: "initiating a transfer requires the device to have no AnomalyEvent with event_state IN {DETECTED, ALERTED, ESCALATED} and Device.valve_state == OPEN"
    error_id: ERR_UNRESOLVED_EVENTS_BLOCK_TRANSFER
    http_status: 409
    applies_to: "POST /device-transfers, POST /device-transfers/{id}/accept"
  - priority: 42
    category: business_temporal
    check: "clock <= DeviceTransfer.expires_at at accept time; the boundary instant is still acceptable"
    error_id: ERR_TRANSFER_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /device-transfers/{id}/accept"
  - priority: 43
    category: business_referential
    check: "to_homeowner_id differs from the property's current homeowner_id, and at accept time the acting X-User-ID equals to_homeowner_id"
    error_id: ERR_TRANSFER_TARGET_INVALID
    http_status: 409
    applies_to: "POST /device-transfers, POST /device-transfers/{id}/accept"
  - priority: 44
    category: business_constraint
    check: "a device may be transferred only from an ARMED or LEARNING lifecycle_state; REGISTERED (never installed) and DECOMMISSIONED devices cannot be transferred"
    error_id: ERR_DEVICE_NOT_TRANSFERABLE
    http_status: 409
    applies_to: "POST /device-transfers"
  # ---------------- 45-46. fiscal, last ----------------
  - priority: 45
    category: business_fiscal
    check: "InsurancePolicy.paid_payout_cents_total + the computed approved_payout_cents <= POLICY_ANNUAL_PAYOUT_CAP_CENTS"
    error_id: ERR_ANNUAL_PAYOUT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /claims/{id}/decision (decision IN {APPROVE, PAY})"
  - priority: 46
    category: business_fiscal
    check: "account deactivation is refused while any ReimbursementClaim on the account has status == APPROVED (an approved-but-unpaid payout must be settled before the account closes)"
    error_id: ERR_OPEN_PAYOUT_BLOCKS_DEACTIVATION
    http_status: 409
    applies_to: "POST /homeowners/{id}/deactivate"

endpoints:
  # ============================== reads ==============================
  - method: GET
    path: "/homeowners/{id}"
    description: "Fetch one homeowner account."
    roles: [Homeowner, ProgramAdmin, InsurerAnalyst, ClaimsAdjuster]
    code: 200
    input: []
    output: Homeowner
    side_effects: []
  - method: GET
    path: "/homeowners/{id}/emergency-contacts"
    description: "List the homeowner's emergency contacts ordered by priority_rank ASC then created_at ASC."
    roles: [Homeowner, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EmergencyContact[]
    side_effects: []
  - method: GET
    path: "/homeowners/{id}/properties"
    description: "List the properties currently owned by the homeowner."
    roles: [Homeowner, ProgramAdmin, InsurerAnalyst]
    code: 200
    input: ["property_state?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: GET
    path: "/properties/{id}"
    description: "Fetch one property including property_state and version."
    roles: [Homeowner, InstallerTech, ProgramAdmin, InsurerAnalyst]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties/{id}/devices"
    description: "List the devices installed at the property."
    roles: [Homeowner, InstallerTech, ProgramAdmin, InsurerAnalyst]
    code: 200
    input: ["lifecycle_state?", "limit?", "offset?"]
    output: Device[]
    side_effects: []
  - method: GET
    path: "/properties/{id}/irrigation-windows"
    description: "List the property's irrigation exclusion windows ordered by start_at ASC."
    roles: [Homeowner, ProgramAdmin, InsurerAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: IrrigationWindow[]
    side_effects: []
  - method: GET
    path: "/properties/{id}/policies"
    description: "List the insurance policies written against the property, newest first."
    roles: [Homeowner, InsurerAnalyst, ClaimsAdjuster, ProgramAdmin]
    code: 200
    input: ["credit_state?", "limit?", "offset?"]
    output: InsurancePolicy[]
    side_effects: []
  - method: GET
    path: "/devices/{id}"
    description: "Fetch one device including lifecycle_state, valve_state, monitor_mode and version."
    roles: [Homeowner, InstallerTech, DeviceGateway, InsurerAnalyst, ClaimsAdjuster, ProgramAdmin]
    code: 200
    input: []
    output: Device
    side_effects: []
  - method: GET
    path: "/devices/{id}/baseline-profiles"
    description: "List the device's baseline profiles ordered by learning_cycle_no ASC; the live profile is the last row."
    roles: [Homeowner, InstallerTech, InsurerAnalyst, ProgramAdmin]
    code: 200
    input: ["learning_state?", "limit?", "offset?"]
    output: BaselineProfile[]
    side_effects: []
  - method: GET
    path: "/devices/{id}/telemetry"
    description: "List the device's telemetry readings ordered by reading_at ASC, including baseline_eligible and the frozen classification_at_ingest."
    roles: [Homeowner, DeviceGateway, InsurerAnalyst, ClaimsAdjuster, ProgramAdmin]
    code: 200
    input: ["classification_at_ingest?", "baseline_eligible?", "limit?", "offset?"]
    output: TelemetryReading[]
    side_effects: []
  - method: GET
    path: "/devices/{id}/health-summary"
    description: "Computed read: returns { device_id, lifecycle_state, uptime_pct, covered_minutes, period_minutes, offline_gap_count, false_positive_count, drip_threshold_gpm } for the window [window_start_at, window_end_at) using the uptime_coverage_pct rule; defaults to the newest OPEN CreditAttestation period when the window is omitted."
    roles: [Homeowner, InsurerAnalyst, ProgramAdmin]
    code: 200
    input: ["window_start_at?", "window_end_at?"]
    output: dict
    side_effects: []
  - method: GET
    path: "/anomaly-events/{id}"
    description: "Fetch one anomaly event including classification, severity_score, auto_shutoff_executed, shutoff_latency_minutes and mitigation_credited."
    roles: [Homeowner, InsurerAnalyst, ClaimsAdjuster, ProgramAdmin]
    code: 200
    input: []
    output: AnomalyEvent
    side_effects: []
  - method: GET
    path: "/anomaly-events"
    description: "Filtered list of anomaly events ordered by detected_at ASC then created_at ASC."
    roles: [Homeowner, InsurerAnalyst, ClaimsAdjuster, ProgramAdmin]
    code: 200
    input: ["device_id?", "telemetry_reading_id?", "classification?", "event_state?", "limit?", "offset?"]
    output: AnomalyEvent[]
    side_effects: []
  - method: GET
    path: "/escalation-tickets/{id}"
    description: "Fetch one escalation ticket including stage, notified_contact_id and the SLA timestamps."
    roles: [Homeowner, ProgramAdmin]
    code: 200
    input: []
    output: EscalationTicket
    side_effects: []
  - method: GET
    path: "/escalation-tickets"
    description: "Filtered list of escalation tickets ordered by created_at ASC."
    roles: [Homeowner, ProgramAdmin]
    code: 200
    input: ["anomaly_event_id?", "notified_contact_id?", "stage?", "limit?", "offset?"]
    output: EscalationTicket[]
    side_effects: []
  - method: GET
    path: "/policies/{id}"
    description: "Fetch one policy including credit_state, current_credit_tier_pct, credited_cents_total, clawback_cents_total and version."
    roles: [Homeowner, InsurerAnalyst, ClaimsAdjuster, ProgramAdmin]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []
  - method: GET
    path: "/policies/{id}/credit-attestations"
    description: "List the policy's credit attestations ordered by period_start_at ASC."
    roles: [Homeowner, InsurerAnalyst, ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CreditAttestation[]
    side_effects: []
  - method: GET
    path: "/claims/{id}"
    description: "Fetch one reimbursement claim including payout_variant, approved_payout_cents and deductible_applied_cents."
    roles: [Homeowner, ClaimsAdjuster, InsurerAnalyst, ProgramAdmin]
    code: 200
    input: []
    output: ReimbursementClaim
    side_effects: []
  - method: GET
    path: "/claims"
    description: "Filtered list of reimbursement claims ordered by created_at ASC."
    roles: [Homeowner, ClaimsAdjuster, InsurerAnalyst, ProgramAdmin]
    code: 200
    input: ["policy_id?", "device_id?", "anomaly_event_id?", "status?", "limit?", "offset?"]
    output: ReimbursementClaim[]
    side_effects: []
  - method: GET
    path: "/device-transfers/{id}"
    description: "Fetch one device transfer including status, expires_at and cancel_reason."
    roles: [Homeowner, ProgramAdmin, InsurerAnalyst]
    code: 200
    input: []
    output: DeviceTransfer
    side_effects: []
  - method: GET
    path: "/device-transfers"
    description: "Filtered list of device transfers ordered by created_at ASC."
    roles: [Homeowner, ProgramAdmin, InsurerAnalyst]
    code: 200
    input: ["device_id?", "from_homeowner_id?", "to_homeowner_id?", "status?", "limit?", "offset?"]
    output: DeviceTransfer[]
    side_effects: []
  # ============================== writes: accounts and property ==============================
  - method: POST
    path: "/homeowners"
    description: "Register a homeowner account in account_state ACTIVE."
    roles: [ProgramAdmin]
    code: 201
    input: [full_name, email, phone_e164, "notification_channel?"]
    output: Homeowner
    side_effects: ["creates Homeowner with account_state ACTIVE and version 1"]
  - method: POST
    path: "/homeowners/{id}/emergency-contacts"
    description: "Add an emergency contact. verify_immediately true creates it VERIFIED, otherwise PENDING (and PENDING contacts are ineligible for escalation)."
    roles: [Homeowner, ProgramAdmin]
    code: 201
    input: [full_name, phone_e164, priority_rank, "verify_immediately?"]
    output: EmergencyContact
    side_effects: ["creates EmergencyContact with status ACTIVE and verification_state VERIFIED when verify_immediately is true, else PENDING"]
  - method: POST
    path: "/homeowners/{id}/deactivate"
    description: "Close the account at property sale or churn. Cascades across every dependent aggregate."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Homeowner
    side_effects:
      - "Homeowner.account_state ACTIVE -> DEACTIVATED, version += 1"
      - "every EmergencyContact of the account: status ACTIVE -> REMOVED"
      - "every Property of the account: property_state -> ARCHIVED, archived_at = clock, version += 1"
      - "every Device of those properties: lifecycle_state -> DECOMMISSIONED, decommissioned_at = clock, valve_state -> CLOSED, monitor_mode -> NORMAL, version += 1"
      - "every BaselineProfile of those devices: COMPLETE -> INVALIDATED"
      - "every AnomalyEvent in DETECTED/ALERTED/ESCALATED/SUPPRESSED -> RESOLVED (resolution_note ACCOUNT_CLOSED)"
      - "every EscalationTicket still pending -> EXPIRED (expiry_reason ACCOUNT_DEACTIVATED)"
      - "every InsurancePolicy not TERMINATED -> TERMINATED, version += 1"
      - "every OPEN CreditAttestation -> FINALIZED_DENIED (denial_reason ACCOUNT_CLOSED)"
      - "every ReimbursementClaim in SUBMITTED/UNDER_REVIEW/INFO_REQUESTED -> DENIED (denial_reason ACCOUNT_CLOSED)"
      - "every INITIATED DeviceTransfer -> CANCELLED (ACCOUNT_DEACTIVATED)"
      - "every IrrigationWindow in ACTIVE or SUSPENDED_BY_SHUTOFF -> CANCELLED"
  - method: POST
    path: "/properties"
    description: "Create a property owned by a homeowner."
    roles: [Homeowner, ProgramAdmin]
    code: 201
    input: [homeowner_id, address_line1, city, state_code, postal_code, year_built, "irrigation_present?"]
    output: Property
    side_effects: ["creates Property with property_state ACTIVE, irrigation_present defaulting to false, owned_property_count recomputed on the owner, version 1"]
  - method: POST
    path: "/properties/{id}/irrigation-windows"
    description: "Declare a recurring-instance irrigation exclusion window [start_at, end_at) during which flow never classifies."
    roles: [Homeowner, ProgramAdmin]
    code: 201
    input: [label, start_at, end_at, expected_max_flow_gpm]
    output: IrrigationWindow
    side_effects: ["creates IrrigationWindow with status ACTIVE occupying the half-open span [start_at, end_at)"]
  # ============================== writes: device lifecycle ==============================
  - method: POST
    path: "/devices"
    description: "Register a leak-detection device against a property in lifecycle_state REGISTERED with valve_state OPEN."
    roles: [InstallerTech, ProgramAdmin]
    code: 201
    input: [property_id, serial_number, model_code, "firmware_version?"]
    output: Device
    side_effects: ["creates Device with lifecycle_state REGISTERED, valve_state OPEN, monitor_mode NORMAL, firmware_version defaulting to 1.0.0, close_count 0, reopen_count 0, version 1"]
  - method: POST
    path: "/devices/{id}/verify-install"
    description: "Installer records the static-pressure hold test. Passing moves the device to INSTALL_VERIFIED then immediately LEARNING and opens learning cycle 1."
    roles: [InstallerTech]
    code: 200
    input: [installed_static_pressure_psi, pressure_drop_psi]
    output: Device
    side_effects:
      - "Device.lifecycle_state REGISTERED -> INSTALL_VERIFIED -> LEARNING in one request; install_verified_by_user_id = X-User-ID, install_verified_at = clock, version += 1"
      - "creates BaselineProfile with learning_state COLLECTING, learning_cycle_no 1, sample_count 0"
  - method: POST
    path: "/devices/{id}/telemetry"
    description: "Gateway ingests one immutable pressure/flow sample. Runs classification against the pre-existing baseline snapshot, then recomputes the baseline (see baseline_learning_profile.evaluation_order)."
    roles: [DeviceGateway]
    code: 201
    input: [reading_at, static_pressure_psi, flow_gpm, duration_minutes, total_gallons, "reading_source?"]
    output: TelemetryReading
    side_effects:
      - "creates the immutable TelemetryReading, setting suppressed_by_irrigation from the property's ACTIVE IrrigationWindow rows and baseline_eligible from the frozen classification"
      - "runs anomaly_classification and freezes the verdict in classification_at_ingest and baseline_version_used"
      - "when classification != NONE: creates AnomalyEvent (event_state ALERTED, or SUPPRESSED when monitor_mode == SNOOZE), runs severity_score, then auto_shutoff_decision"
      - "when an AnomalyEvent is created in ALERTED: creates EscalationTicket in PENDING_HOMEOWNER with homeowner_notified_at = clock"
      - "runs baseline_learning_profile: BaselineProfile.sample_count += 1, recomputes the profile while COLLECTING, and may move COLLECTING -> COMPLETE which promotes Device LEARNING -> ARMED"
  - method: POST
    path: "/devices/{id}/valve-commands"
    description: "Homeowner override of the shutoff valve. Reopening after a burst requires acknowledge_water_damage_risk and grants OVERRIDE_GRACE_MINUTES of auto-shutoff immunity."
    roles: [Homeowner, ProgramAdmin]
    code: 200
    input: [command, expected_device_version, "override_reason?", "acknowledge_water_damage_risk?"]
    output: Device
    side_effects:
      - "Device.valve_state flips OPEN <-> CLOSED, version += 1; CLOSE increments close_count and sets last_shutoff_at, OPEN increments reopen_count"
      - "on OPEN: every AnomalyEvent of the device with event_state IN {ALERTED, ESCALATED} gets override_reopen_at = clock, which clears mitigation_credited and grants OVERRIDE_GRACE_MINUTES of auto-shutoff immunity"
      - "on OPEN: every IrrigationWindow of the property with status == SUSPENDED_BY_SHUTOFF returns to ACTIVE and its suspended_at is cleared to null"
  - method: POST
    path: "/devices/{id}/monitor-mode"
    description: "Set NORMAL, VACATION (tightened thresholds until vacation_ends_at) or SNOOZE (suppression for snooze_minutes, then a cooldown)."
    roles: [Homeowner, ProgramAdmin]
    code: 200
    input: [mode, "vacation_ends_at?", "snooze_minutes?"]
    output: Device
    side_effects:
      - "Device.monitor_mode changes, monitor_mode_updated_at = clock, version += 1"
      - "VACATION: sets vacation_ends_at (bounded by MAX_VACATION_DAYS)"
      - "SNOOZE: sets snooze_window_start_at = clock and snooze_window_end_at = clock + snooze_minutes; the cooldown buffer runs to snooze_window_end_at + SNOOZE_COOLDOWN_MINUTES"
      - "NORMAL: clears vacation_started_at and vacation_ends_at but RETAINS snooze_window_start_at and snooze_window_end_at so the cooldown buffer survives an early revert"
  - method: POST
    path: "/devices/{id}/firmware-updates"
    description: "Push firmware. An ARMED device is demoted to LEARNING because the pressure baseline no longer applies."
    roles: [InstallerTech, ProgramAdmin]
    code: 200
    input: [target_firmware_version]
    output: Device
    side_effects:
      - "Device.firmware_version = target_firmware_version, version += 1"
      - "when lifecycle_state == ARMED: BaselineProfile COMPLETE -> INVALIDATED (FIRMWARE_UPDATE) and Device ARMED -> LEARNING; the next accepted reading reopens the same profile row as COLLECTING with learning_cycle_no += 1"
      - "when the property's InsurancePolicy is CREDIT_ACTIVE: CREDIT_ACTIVE -> CREDIT_SUSPENDED (DEVICE_NOT_ARMED) with clawback of the newest awarded period"
  # ============================== writes: alerts and escalation ==============================
  - method: POST
    path: "/anomaly-events/{id}/feedback"
    description: "Homeowner labels an alert TRUE_POSITIVE or FALSE_POSITIVE. FALSE_POSITIVE runs false_positive_tuning and may force a relearn."
    roles: [Homeowner, ProgramAdmin]
    code: 200
    input: [label]
    output: AnomalyEvent
    side_effects:
      - "label TRUE_POSITIVE: event_state -> RESOLVED, resolved_at = clock, no threshold change"
      - "label FALSE_POSITIVE: event_state -> FALSE_POSITIVE, runs false_positive_tuning (raises BaselineProfile.drip_threshold_gpm toward DRIP_CEILING_GPM, bumps BaselineProfile.false_positive_count)"
      - "either label expires the event's pending EscalationTicket with expiry_reason = EVENT_CLOSED"
      - "at MAX_FALSE_POSITIVES_BEFORE_RELEARN: baseline COMPLETE -> INVALIDATED, Device ARMED -> LEARNING, policy CREDIT_ACTIVE -> CREDIT_SUSPENDED with clawback; the next accepted reading reopens the profile as COLLECTING with learning_cycle_no += 1"
  - method: POST
    path: "/anomaly-events/{id}/resolve"
    description: "Close out an anomaly after the leak is fixed, unblocking a valve reopen."
    roles: [Homeowner, ProgramAdmin]
    code: 200
    input: [resolution_note]
    output: AnomalyEvent
    side_effects: ["event_state -> RESOLVED, resolved_at = clock", "expires the event's pending EscalationTicket with expiry_reason = EVENT_CLOSED"]
  - method: POST
    path: "/escalation-tickets/{id}/acknowledge"
    description: "Homeowner acknowledges the alert ladder, stopping further escalation."
    roles: [Homeowner, ProgramAdmin]
    code: 200
    input: []
    output: EscalationTicket
    side_effects: ["stage -> ACKNOWLEDGED, acknowledged_at = clock, acknowledged_by_user_id = X-User-ID"]
  - method: POST
    path: "/ops-sweeps"
    description: "Operator sweep. Applies, in this fixed order: lapsed monitor-mode reverts, escalation SLA hops per escalation_sla_evaluation, then DeviceTransfer expiries. Returns { swept_at, modes_reverted, tickets_escalated, tickets_expired, transfers_expired }."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: dict
    side_effects:
      - "Device.monitor_mode VACATION -> NORMAL when clock >= vacation_ends_at, SNOOZE -> NORMAL when clock >= snooze_window_end_at; version += 1 per device changed"
      - "EscalationTicket PENDING_HOMEOWNER -> PENDING_EMERGENCY_CONTACT or EXPIRED, PENDING_EMERGENCY_CONTACT -> EXPIRED; AnomalyEvent ALERTED -> ESCALATED on a hop"
      - "DeviceTransfer INITIATED -> EXPIRED, restoring Device and Property out of TRANSFER_PENDING"
  # ============================== writes: insurer credit program ==============================
  - method: POST
    path: "/policies"
    description: "Write an insurer policy against a property, superseding any prior non-TERMINATED policy on that property."
    roles: [InsurerAnalyst]
    code: 201
    input: [property_id, insurer_code, policy_number, annual_premium_cents, policy_year_start_at, expected_property_version, "deductible_cents?"]
    output: InsurancePolicy
    side_effects:
      - "creates InsurancePolicy with credit_state PENDING_ENROLLMENT, credited_cents_total 0, clawback_cents_total 0, paid_payout_cents_total 0, version 1"
      - "every prior InsurancePolicy on the property not already TERMINATED -> TERMINATED, version += 1"
      - "Property.version += 1"
  - method: POST
    path: "/policies/{id}/credit-attestations"
    description: "Open an attestation period for the device-health uptime measurement. The period must be contiguous with the prior one."
    roles: [InsurerAnalyst]
    code: 201
    input: [period_start_at, period_end_at]
    output: CreditAttestation
    side_effects: ["creates CreditAttestation with status OPEN, period_minutes computed, uptime_pct null, tier_pct null, credit_cents_awarded 0; the scored device is resolved at finalize time as the property's single non-DECOMMISSIONED Device"]
  - method: POST
    path: "/credit-attestations/{id}/finalize"
    description: "Score the period: runs uptime_coverage_pct then premium_credit_award, awarding or denying the premium credit and, on the year-closing period, computing the annual true-up."
    roles: [InsurerAnalyst]
    code: 200
    input: []
    output: CreditAttestation
    side_effects:
      - "writes covered_minutes, uptime_pct, offline_gap_count, tier_pct, credit_cents_awarded, finalized_at, device_snapshot_lifecycle_state"
      - "status OPEN -> FINALIZED_AWARDED or FINALIZED_DENIED"
      - "InsurancePolicy: credited_cents_total, current_credit_tier_pct, last_attestation_end_at and version += 1; finalized_period_count and avg_uptime_pct are recomputed; credit_state moves per the InsurancePolicy machine"
      - "on the PERIODS_PER_POLICY_YEAR-th finalize: is_policy_year_close = true and true_up_cents written from the final_annual_true_up variant"
  # ============================== writes: claims ==============================
  - method: POST
    path: "/claims"
    description: "Homeowner files a water-damage or device-warranty reimbursement claim against a qualifying anomaly event."
    roles: [Homeowner, ProgramAdmin]
    code: 201
    input: [policy_id, device_id, claim_type, documented_loss_cents, "anomaly_event_id?"]
    output: ReimbursementClaim
    side_effects: ["creates ReimbursementClaim with status SUBMITTED, approved_payout_cents 0, deductible_applied_cents 0, info_request_count 0, payout_variant null, submitted_by_user_id = the resolved Homeowner.id, version 1"]
  - method: POST
    path: "/claims/{id}/decision"
    description: "Advance the claim: BEGIN_REVIEW, REQUEST_INFO, SUPPLY_INFO, APPROVE, DENY or PAY. APPROVE runs claim_payout_award."
    roles: [ClaimsAdjuster, Homeowner, InsurerAnalyst]
    code: 200
    input: [decision, "denial_reason?"]
    output: ReimbursementClaim
    side_effects:
      - "status moves per the ReimbursementClaim machine; version += 1 on every accepted decision"
      - "APPROVE: runs claim_payout_award writing payout_variant, approved_payout_cents, deductible_applied_cents, decided_by_user_id, decided_at"
      - "PAY: sets paid_at and increments InsurancePolicy.paid_payout_cents_total and version"
      - "REQUEST_INFO: info_request_count += 1"
  # ============================== writes: transfer at property sale ==============================
  - method: POST
    path: "/device-transfers"
    description: "Seller initiates transfer of the device (and its property) to a buyer at closing; freezes the device for TRANSFER_ACCEPT_WINDOW_HOURS."
    roles: [Homeowner, ProgramAdmin]
    code: 201
    input: [device_id, to_homeowner_id, expected_device_version, "transfer_note?"]
    output: DeviceTransfer
    side_effects:
      - "creates DeviceTransfer with status INITIATED, from_homeowner_id = the property's current owner, expires_at = clock + TRANSFER_ACCEPT_WINDOW_HOURS hours"
      - "Device.lifecycle_state ARMED|LEARNING -> TRANSFER_PENDING, version += 1 (an expiry restores ARMED when the BaselineProfile is COMPLETE, else LEARNING)"
      - "Property.property_state ACTIVE -> TRANSFER_PENDING, version += 1"
      - "any other INITIATED DeviceTransfer for the same device -> CANCELLED (SUPERSEDED)"
  - method: POST
    path: "/device-transfers/{id}/accept"
    description: "Buyer accepts the transfer, rewriting ownership and forcing a fresh baseline learning cycle on the new household's usage."
    roles: [Homeowner]
    code: 200
    input: []
    output: DeviceTransfer
    side_effects:
      - "DeviceTransfer status INITIATED -> ACCEPTED, accepted_at = clock, accepted_by_user_id = X-User-ID"
      - "Property.homeowner_id = to_homeowner_id, property_state TRANSFER_PENDING -> ACTIVE, version += 1"
      - "BaselineProfile COMPLETE -> INVALIDATED (OWNERSHIP_TRANSFER); the next accepted reading reopens the same profile row as COLLECTING with learning_cycle_no += 1"
      - "Device TRANSFER_PENDING -> LEARNING, monitor_mode -> NORMAL, version += 1"
      - "InsurancePolicy CREDIT_ACTIVE -> CREDIT_SUSPENDED (OWNERSHIP_TRANSFER) with clawback of the newest awarded period"
  # ============================== test-driving endpoint ==============================
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call the clock reads exactly the startup default 2026-08-01T00:00:00Z and never falls back to wall-clock time. Every deadline, SLA, window and expiry rule in this scaffold reads this clock. Returns { current_utc }."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: dict
    side_effects: ["sets the logical clock; performs no state transitions of its own"]

errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role missing, or the role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not permitted for the endpoint per the RBAC matrix"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Homeowner acts on a resource whose resolved owner is a different Homeowner"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the same X-User-ID that verified the install approves the warranty claim, or the approver of a claim also pays it"
  # ---- existence ----
  - id: ERR_HOMEOWNER_NOT_FOUND
    http: 404
    condition: "no Homeowner matches the path id or the body homeowner_id / to_homeowner_id"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "no Property matches the path id or the body property_id"
  - id: ERR_DEVICE_NOT_FOUND
    http: 404
    condition: "no Device matches the path id or the body device_id"
  - id: ERR_ANOMALY_EVENT_NOT_FOUND
    http: 404
    condition: "no AnomalyEvent matches the path id or the body anomaly_event_id"
  - id: ERR_ESCALATION_TICKET_NOT_FOUND
    http: 404
    condition: "no EscalationTicket matches the path id"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "no InsurancePolicy matches the path id or the body policy_id"
  - id: ERR_ATTESTATION_NOT_FOUND
    http: 404
    condition: "no CreditAttestation matches the path id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no ReimbursementClaim matches the path id"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "no DeviceTransfer matches the path id"
  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, out-of-range enum, negative quantity, unparseable timestamp, or an interval whose start_at is not strictly before its end_at"
  # ---- concurrency ----
  - id: ERR_STALE_DEVICE_VERSION
    http: 412
    condition: "expected_device_version does not match the current Device.version"
  - id: ERR_STALE_PROPERTY_VERSION
    http: 412
    condition: "expected_property_version does not match the current Property.version"
  # ---- uniqueness ----
  - id: ERR_DEVICE_SERIAL_TAKEN
    http: 409
    condition: "serial_number already exists on another Device"
  - id: ERR_POLICY_NUMBER_TAKEN
    http: 409
    condition: "policy_number already exists on another InsurancePolicy"
  - id: ERR_CONTACT_RANK_TAKEN
    http: 409
    condition: "the homeowner already has an ACTIVE EmergencyContact at that priority_rank"
  # ---- account and state preconditions ----
  - id: ERR_HOMEOWNER_DEACTIVATED
    http: 409
    condition: "the resolved Homeowner.account_state is DEACTIVATED"
  - id: ERR_INSTALL_ALREADY_VERIFIED
    http: 409
    condition: "verify-install called on a Device whose lifecycle_state is not REGISTERED"
  - id: ERR_DEVICE_NOT_ACCEPTING_TELEMETRY
    http: 409
    condition: "telemetry posted to a Device in REGISTERED or DECOMMISSIONED"
  - id: ERR_VALVE_ALREADY_IN_STATE
    http: 409
    condition: "OPEN commanded on an OPEN valve, or CLOSE commanded on a CLOSED valve"
  - id: ERR_EVENT_NOT_ACTIONABLE
    http: 409
    condition: "feedback or resolution attempted on an AnomalyEvent already RESOLVED or FALSE_POSITIVE"
  - id: ERR_TICKET_NOT_PENDING
    http: 409
    condition: "acknowledge attempted on an EscalationTicket already ACKNOWLEDGED or EXPIRED"
  - id: ERR_ATTESTATION_NOT_OPEN
    http: 409
    condition: "finalize attempted on a CreditAttestation that is already FINALIZED_AWARDED or FINALIZED_DENIED"
  - id: ERR_CLAIM_NOT_REVIEWABLE
    http: 409
    condition: "the submitted decision is not a legal transition from the claim's current status"
  - id: ERR_TRANSFER_NOT_PENDING
    http: 409
    condition: "accept attempted on a DeviceTransfer that is ACCEPTED, CANCELLED or EXPIRED"
  - id: ERR_DEVICE_NOT_ARMED
    http: 409
    condition: "VACATION or SNOOZE requested, or an attestation opened, while the Device is not ARMED"
  # ---- safety, constraint, temporal ----
  - id: ERR_UNRESOLVED_BURST_BLOCKS_REOPEN
    http: 409
    condition: "valve OPEN commanded while a CATASTROPHIC_BURST AnomalyEvent for the device is still ALERTED or ESCALATED"
  - id: ERR_DEVICE_TRANSFER_LOCKED
    http: 409
    condition: "a valve, mode or firmware write targets a Device in TRANSFER_PENDING"
  - id: ERR_MODE_TRANSITION_FORBIDDEN
    http: 409
    condition: "VACATION requested directly from SNOOZE, or SNOOZE requested directly from VACATION"
  - id: ERR_SNOOZE_COOLDOWN_ACTIVE
    http: 409
    condition: "SNOOZE requested while clock is strictly before Device.snooze_window_end_at + SNOOZE_COOLDOWN_MINUTES"
  - id: ERR_INSTALL_PRESSURE_TEST_FAILED
    http: 422
    condition: "installed_static_pressure_psi outside [INSTALL_MIN_STATIC_PSI, INSTALL_MAX_STATIC_PSI] or pressure_drop_psi above INSTALL_MAX_DROP_PSI"
  - id: ERR_BASELINE_NOT_COMPLETE
    http: 409
    condition: "an attestation is opened while the device has no BaselineProfile in learning_state COMPLETE"
  - id: ERR_READING_IN_FUTURE
    http: 422
    condition: "reading_at is after the logical clock"
  - id: ERR_READING_TOO_OLD
    http: 422
    condition: "reading_at is more than MAX_READING_BACKDATE_HOURS before the logical clock"
  - id: ERR_READING_OUT_OF_ORDER
    http: 409
    condition: "reading_at is not strictly after the device's newest accepted reading"
  - id: ERR_IRRIGATION_WINDOW_OVERLAP
    http: 409
    condition: "the submitted [start_at, end_at) half-open interval overlaps an ACTIVE IrrigationWindow of the property"
  - id: ERR_IRRIGATION_NOT_ENABLED
    http: 409
    condition: "an irrigation window is declared on a property with irrigation_present false"
  - id: ERR_ATTESTATION_PERIOD_OVERLAP
    http: 409
    condition: "the submitted attestation period half-open interval overlaps an existing period on the policy"
  - id: ERR_ATTESTATION_PERIOD_NOT_CONTIGUOUS
    http: 409
    condition: "period_start_at does not equal last_attestation_end_at (or policy_year_start_at for the first period)"
  - id: ERR_ATTESTATION_PERIOD_NOT_ENDED
    http: 409
    condition: "finalize attempted while the logical clock is before period_end_at"
  - id: ERR_POLICY_TERMINATED
    http: 409
    condition: "an attestation, claim or claim decision targets an InsurancePolicy in credit_state TERMINATED"
  - id: ERR_NO_QUALIFYING_EVENT
    http: 409
    condition: "a WATER_DAMAGE claim omits anomaly_event_id, the referenced AnomalyEvent does not belong to the referenced Device, or the device does not belong to the policy's property"
  - id: ERR_CLAIM_WINDOW_EXPIRED
    http: 409
    condition: "the claim is filed more than CLAIM_SUBMISSION_WINDOW_DAYS after AnomalyEvent.detected_at"
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "a non-DENIED ReimbursementClaim already exists for the same anomaly_event_id and claim_type"
  - id: ERR_UNRESOLVED_EVENTS_BLOCK_TRANSFER
    http: 409
    condition: "a transfer is initiated or accepted while the device has an open anomaly (DETECTED, ALERTED or ESCALATED) or a CLOSED valve"
  - id: ERR_TRANSFER_WINDOW_EXPIRED
    http: 409
    condition: "accept attempted after DeviceTransfer.expires_at"
  - id: ERR_TRANSFER_TARGET_INVALID
    http: 409
    condition: "to_homeowner_id equals the property's current owner, or the acting user is not to_homeowner_id at accept time"
  - id: ERR_DEVICE_NOT_TRANSFERABLE
    http: 409
    condition: "a transfer is initiated for a Device in REGISTERED, INSTALL_VERIFIED or DECOMMISSIONED"
  # ---- fiscal ----
  - id: ERR_ANNUAL_PAYOUT_CAP_EXCEEDED
    http: 422
    condition: "paid_payout_cents_total plus the computed payout would exceed POLICY_ANNUAL_PAYOUT_CAP_CENTS"
  - id: ERR_OPEN_PAYOUT_BLOCKS_DEACTIVATION
    http: 409
    condition: "deactivation attempted while a ReimbursementClaim on the account is APPROVED but not yet PAID"

roles:
  - name: Homeowner
    description: "The account holder who owns properties and devices, overrides the valve, sets vacation and snooze modes, labels false positives, acknowledges escalations, files reimbursement claims, and initiates or accepts device transfers at a property sale."
    identity: "entity_backed:Homeowner"
    exclusive_operations:
      - "POST /device-transfers/{id}/accept (only the buyer named in to_homeowner_id)"
      - "POST /claims/{id}/decision with decision == SUPPLY_INFO"
    shared_operations:
      - "POST /properties, POST /homeowners/{id}/emergency-contacts, POST /properties/{id}/irrigation-windows (shared with ProgramAdmin)"
      - "POST /devices/{id}/valve-commands, POST /devices/{id}/monitor-mode (shared with ProgramAdmin)"
      - "POST /anomaly-events/{id}/feedback, POST /anomaly-events/{id}/resolve, POST /escalation-tickets/{id}/acknowledge (shared with ProgramAdmin)"
      - "POST /claims, POST /device-transfers (shared with ProgramAdmin)"
      - "every GET scoped to their own account"
  - name: InstallerTech
    description: "Field technician who registers hardware, performs the static-pressure hold test that verifies installation, and pushes firmware."
    identity: "opaque"
    exclusive_operations:
      - "POST /devices/{id}/verify-install"
    shared_operations:
      - "POST /devices, POST /devices/{id}/firmware-updates (shared with ProgramAdmin)"
      - "GET /properties/{id}, GET /properties/{id}/devices, GET /devices/{id}, GET /devices/{id}/baseline-profiles"
  - name: DeviceGateway
    description: "The device-side ingest identity. It is the only principal allowed to write telemetry, so no human can fabricate uptime coverage or an anomaly."
    identity: "opaque"
    exclusive_operations:
      - "POST /devices/{id}/telemetry"
    shared_operations:
      - "GET /devices/{id}, GET /devices/{id}/telemetry"
  - name: InsurerAnalyst
    description: "Carrier-side analyst who writes policies, opens and finalizes credit attestations, and settles payment on approved claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /policies"
      - "POST /policies/{id}/credit-attestations"
      - "POST /credit-attestations/{id}/finalize"
      - "POST /claims/{id}/decision with decision == PAY"
    shared_operations:
      - "GET /policies/{id}, GET /policies/{id}/credit-attestations, GET /devices/{id}/health-summary, GET /claims, GET /anomaly-events"
  - name: ClaimsAdjuster
    description: "Carrier-side adjuster who reviews water-damage and warranty claims: begins review, requests information, approves and denies. Cannot pay what they approved."
    identity: "opaque"
    exclusive_operations:
      - "POST /claims/{id}/decision with decision IN {BEGIN_REVIEW, REQUEST_INFO, APPROVE, DENY}"
    shared_operations:
      - "GET /claims/{id}, GET /claims, GET /anomaly-events/{id}, GET /devices/{id}, GET /devices/{id}/telemetry, GET /policies/{id}"
  - name: ProgramAdmin
    description: "Program operator who provisions accounts, closes accounts, runs the operational sweep, and sets the logical clock. Acts on behalf of homeowners for support operations but cannot write telemetry, verify an install, or touch the carrier's policy and claim decisions."
    identity: "opaque"
    exclusive_operations:
      - "POST /homeowners"
      - "POST /homeowners/{id}/deactivate"
      - "POST /ops-sweeps"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /properties, POST /devices, POST /devices/{id}/firmware-updates, POST /devices/{id}/valve-commands, POST /devices/{id}/monitor-mode"
      - "POST /homeowners/{id}/emergency-contacts, POST /properties/{id}/irrigation-windows"
      - "POST /anomaly-events/{id}/feedback, POST /anomaly-events/{id}/resolve, POST /escalation-tickets/{id}/acknowledge"
      - "POST /claims, POST /device-transfers, and every GET"
