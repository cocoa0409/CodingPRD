              payload: { cpt_code: "90001", description: "Proc One", list_price_cents: 1200000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "90002", description: "Proc Two", list_price_cents: 1200000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "MULTIPLE_PROCEDURE_REDUCTION", reduction_pct: 50 }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "90001", rate_cents: 1000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "90002", rate_cents: 1000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-CA-1", full_name: "Pat Bundle", date_of_birth: "1992-01-01" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-CA1", deductible_total_cents: 0, deductible_met_cents: 0, oop_max_cents: 5000000, oop_met_cents: 0, coinsurance_pct: 0 }
              as: Registrar
