              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_HOLD_WINDOW_PASSED (clock == delivery date, window is right-open)"
            - "WeeklyBox.${box_w1_id}.status == SCHEDULED (hold rejected)"

      - name: waitlist_offer_window_inclusive_deadline
        grounds:
          - validations[priority=10]
          - state_machines.WaitlistEntry.OFFERED_to_CONVERTED
          - entities.WaitlistEntry.fields.offer_expires_at
        distinguishing_aspect: |
          Closed/inclusive deadline interval on WaitlistEntry (different resource, different semantics): an OFFERED
          entry accepts while clock <= offer_expires_at (the deadline instant itself is INCLUSIVE — clock == expiry succeeds),
          contrasting the box hold's strict right-open window.
        test_recipe:
          setup:
            - "Season capacity 5, site cap 5; a WAITING entry promoted to OFFERED at clock 2026-06-01 (offer_expires_at = 2026-06-03T00:00:00Z); clock advanced to exactly the expiry instant"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S16", week_count: 12, first_delivery_date: "2026-07-01T00:00:00Z", signup_close_date: "2026-12-30T00:00:00Z", total_share_capacity: 5 }
              as: FarmManager
