            - "L2 (caused by L1's haircut change) — asset A1: discount_factor_bps == 6300 and lendable_value_cents == 12600000; asset A2: discount_factor_bps == 3200 (5500 - 500 LTV - 300 stale appraisal - 1500 haircut) and lendable_value_cents == 15360000; asset A3: status == \"SUSPENDED\", discount_factor_bps == 0, lendable_value_cents == 0, ineligibility_reason == \"UNRESOLVED_REVIEW_FINDING\""
