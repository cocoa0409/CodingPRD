            - "err == ERR_MINOR_GUARDIAN_REQUIRED (dob 2008-08-02 is 17 years 364 days: minor without guardian fields)"
            - "m_minor == true and m_sup == ${sup}"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: event_create_requires_agreement_active
        grounds:
          - state_machines.CleanupEvent
          - validations[priority=6]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair CleanupEvent -> AdoptionAgreement: event creation is
          rejected while the agreement is PENDING_REVIEW and succeeds after the
          coordinator approves it to ACTIVE.
        test_recipe:
          setup:
            - "Agreement exists in PENDING_REVIEW (never approved)"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
          trigger:
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { ev_status: $.data.status } }
          assert:
            - "err == ERR_AGREEMENT_NOT_ACTIVE (PENDING_REVIEW blocks event creation)"
            - "ev_status == SCHEDULED after the agreement flips to ACTIVE"

      - name: sign_install_requires_completed_cleanup
        grounds:
          - state_machines.SignRecognition.REQUESTED_to_INSTALLED
          - validations[priority=9]
          - errors[ERR_NO_COMPLETED_CLEANUP]
        distinguishing_aspect: |
          Entity pair SignRecognition -> CleanupEvent (different pair from the
          other instance): installing the recognition sign is rejected while the
          agreement has zero COMPLETED events and succeeds once one cleanup has
          completed.
        test_recipe:
          setup:
            - "Approved agreement with a REQUESTED sign and no completed cleanups yet"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/waivers", payload: { agreement_id: "${ag}", volunteer_full_name: "Ada Adult", dob: "1990-05-01" }, as: GroupLeader, as_user_id: "${g}", captures: { w1: $.data.id } }
            - { call: "POST /program/agreements/${ag}/signs", payload: { sign_text: "Riverkeepers of Maple County" }, as: GroupLeader, as_user_id: "${g}", captures: { sg: $.data.id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/briefing", payload: { attendee_waiver_ids: ["${w1}"] }, as: GroupLeader, as_user_id: "${g}" }
          trigger:
            - { call: "POST /program/signs/${sg}/install", payload: {}, as: ProgramCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T10:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /program/events/${e}/debris-report", payload: { weight_method: "ESTIMATED", material_lines: [ { material_type: "GENERAL_TRASH", bag_count: 2 } ] }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/signs/${sg}/install", payload: {}, as: ProgramCoordinator, captures: { sg_status: $.data.status, sg_date: $.data.installed_date } }
          assert:
            - "err == ERR_NO_COMPLETED_CLEANUP (install blocked while zero COMPLETED events exist)"
            - "sg_status == INSTALLED and sg_date == 2026-09-10 after the first completion"

  - rule_id: resource_temporal_overlap
    instances:
      - name: segment_day_slot_half_open_adjacency
        grounds:
          - validations[priority=9]
          - errors[ERR_EVENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = RoadSegment with exclusive half-open day-slot semantics: a
          second live event on the SAME calendar date is rejected
          (ERR_EVENT_WINDOW_OVERLAP) while the adjacent next day is accepted;
          cancelling the incumbent frees its slot.
        test_recipe:
          setup:
            - "Approved agreement; event e_a SCHEDULED for 2026-09-10"
          setup_api_calls:
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 2 }, as: GroupLeader, as_user_id: "${g}", captures: { ea: $.data.id } }
          trigger:
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-11", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { adj_status: $.data.status } }
            - { call: "POST /program/events/${ea}/cancel", payload: { reason: "merged groups" }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { reb_status: $.data.status } }
          assert:
            - "err == ERR_EVENT_WINDOW_OVERLAP (same segment, same calendar date)"
            - "adj_status == SCHEDULED (adjacent day 2026-09-11 allowed: half-open day slots)"
            - "reb_status == SCHEDULED (cancelled events release the day-slot)"

      - name: depot_pool_aggregate_capacity_overlap
        grounds:
          - validations[priority=10]
          - calculations.supply_allocation
          - calculations.returnables_conservation
          - errors[ERR_SUPPLY_STOCK_EXCEEDED]
        distinguishing_aspect: |
          Different interval semantics on a different resource: the SupplyDepot
          returnable pool is aggregate capacity shared by all concurrently
          outstanding distributions — a second issue is rejected when cumulative
          outstanding grabbers (4) plus the new allocation (2) exceed the pool
          (5), and capacity frees only on an explicit return, not by adjacency
          of event dates as in the segment day-slot rule.
        test_recipe:
          setup:
            - "Depot with grabbers_on_hand 5; approved agreement on water-adjacent 2.0-mile segment; e_a (2026-09-10, V=8) issued 4 grabbers; e_b (2026-09-12, V=4) needs 2 grabbers"
          setup_api_calls:
            - { call: "POST /program/depots", payload: { name: "North Depot", bags_on_hand: 200, vests_on_hand: 50, grabbers_on_hand: 5 }, as: ProgramCoordinator, captures: { d: $.data.id } }
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 8 }, as: GroupLeader, as_user_id: "${g}", captures: { ea: $.data.id } }
            - { call: "POST /program/events/${ea}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g}", captures: { da: $.data.id, da_grab: $.data.grabbers_issued } }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-12", expected_volunteers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { eb: $.data.id } }
          trigger:
            - { call: "POST /program/events/${eb}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g}", captures: { err: $.data.error_id } }
            - { call: "POST /program/supplies/${da}/return", payload: { returned_vests: 8, returned_grabbers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { da_status: $.data.status } }
            - { call: "POST /program/events/${eb}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g}", captures: { eb_grab: $.data.grabbers_issued, eb_bags: $.data.bags_issued } }
            - { call: "GET /program/depots/${d}", payload: {}, as: ProgramCoordinator, captures: { dep_grab: $.data.grabbers_on_hand, dep_vests: $.data.vests_on_hand, dep_bags: $.data.bags_on_hand } }
          assert:
            - "err == ERR_SUPPLY_STOCK_EXCEEDED (4 outstanding + 2 new > pool of 5 grabbers)"
            - "da_status == RECONCILED after the full return"
            - "eb_grab == 2 and eb_bags == 20 once capacity frees"
            - "dep_grab == 3 and dep_vests == 46 and dep_bags == 140"

  - rule_id: compensating_invariant
    instances:
      - name: depot_returnables_conserved_on_full_return
        grounds:
          - calculations.returnables_conservation
          - state_machines.SupplyDistribution.ISSUED_to_RECONCILED
        distinguishing_aspect: |
          Conserved quantity = returnable equipment units: an issue of 7 vests
          and 4 grabbers followed by a full return leaves depot.vests_on_hand ==
          40 and depot.grabbers_on_hand == 20 exactly as before the issue
          (on_hand + outstanding + lost == pool_total), while consumable bags
          are NOT restocked (stay at 65).
        test_recipe:
          setup:
            - "Depot 100 bags/40 vests/20 grabbers; approved agreement on water-adjacent 2.0-mile segment; event V=7 issued supplies (vests 7, grabbers 4, bags 35)"
          setup_api_calls:
            - { call: "POST /program/depots", payload: { name: "South Depot", bags_on_hand: 100, vests_on_hand: 40, grabbers_on_hand: 20 }, as: ProgramCoordinator, captures: { d: $.data.id } }
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
            - { call: "POST /program/events", payload: { agreement_id: "${ag}", scheduled_date: "2026-09-10", expected_volunteers: 7 }, as: GroupLeader, as_user_id: "${g}", captures: { e: $.data.id } }
            - { call: "POST /program/events/${e}/supplies", payload: { depot_id: "${d}" }, as: GroupLeader, as_user_id: "${g}", captures: { dist: $.data.id } }
            - { call: "GET /program/depots/${d}", payload: {}, as: ProgramCoordinator, captures: { pre_vests: $.data.vests_on_hand, pre_grabbers: $.data.grabbers_on_hand, pre_bags: $.data.bags_on_hand } }
          trigger:
            - { call: "POST /program/supplies/${dist}/return", payload: { returned_vests: 7, returned_grabbers: 4 }, as: GroupLeader, as_user_id: "${g}", captures: { st: $.data.status } }
            - { call: "GET /program/depots/${d}", payload: {}, as: ProgramCoordinator, captures: { post_vests: $.data.vests_on_hand, post_grabbers: $.data.grabbers_on_hand, post_bags: $.data.bags_on_hand, post_lost_v: $.data.lost_vests_total, post_lost_g: $.data.lost_grabbers_total } }
          assert:
            - "pre_vests == 33 and pre_grabbers == 16 and pre_bags == 65 (issue debited the pool)"
            - "st == RECONCILED"
            - "post_vests == 40 and post_grabbers == 20 (full compensating return restores the conserved pool exactly)"
            - "post_bags == 65 (consumable bags are never restocked)"
            - "post_lost_v == 0 and post_lost_g == 0 (on_hand + outstanding + lost == pool_total: 40 + 0 + 0 == 40 and 20 + 0 + 0 == 20)"

      - name: mile_pool_conserved_across_adopt_terminate
        grounds:
          - calculations.mile_pool_conservation
          - state_machines.RoadSegment
          - state_machines.AdoptionAgreement.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Conserved quantity = program miles (a different quantity type from
          supply units): approving an agreement moves 2.0 miles from available
          to adopted, and the compensating termination moves exactly the same
          2.0 miles back, leaving available_miles == 3.5 and adopted_miles ==
          0.0 identical to the pre-approval baseline.
        test_recipe:
          setup:
            - "Two segments exist: s1 2.0 miles (RIVERBANK), s2 1.5 miles (ROADWAY); no agreements yet"
          setup_api_calls:
            - { call: "POST /program/segments", payload: { route_name: "River Rd", mile_marker_start: 4.0, mile_marker_end: 6.0, segment_type: "RIVERBANK", water_adjacent: true }, as: ProgramCoordinator, captures: { s1: $.data.id } }
            - { call: "POST /program/segments", payload: { route_name: "Hill Rd", mile_marker_start: 10.0, mile_marker_end: 11.5, segment_type: "ROADWAY" }, as: ProgramCoordinator, captures: { s2: $.data.id } }
            - { call: "GET /program/metrics", payload: {}, as: ProgramCoordinator, captures: { m0_avail: $.data.available_miles, m0_adopted: $.data.adopted_miles } }
            - { call: "POST /program/groups", payload: { name: "Riverkeepers", org_type: "CIVIC", contact_name: "Gina Lead", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, captures: { g: $.data.id } }
            - { call: "POST /program/agreements", payload: { group_id: "${g}", segment_id: "${s1}", contact_email: "gina@riverkeepers.org" }, as: GroupLeader, as_user_id: "${g}", captures: { ag: $.data.id } }
            - { call: "POST /program/agreements/${ag}/review-decision", payload: { decision: "APPROVE" }, as: ProgramCoordinator }
          trigger:
            - { call: "GET /program/metrics", payload: {}, as: ProgramCoordinator, captures: { m1_avail: $.data.available_miles, m1_adopted: $.data.adopted_miles } }
            - { call: "POST /program/agreements/${ag}/terminate", payload: { reason: "group dissolved" }, as: GroupLeader, as_user_id: "${g}" }
            - { call: "GET /program/metrics", payload: {}, as: ProgramCoordinator, captures: { m2_avail: $.data.available_miles, m2_adopted: $.data.adopted_miles } }
            - { call: "GET /program/segments/${s1}", payload: {}, as: ProgramCoordinator, captures: { s1_status: $.data.status } }
          assert:
            - "m0_avail == 3.5 and m0_adopted == 0.0 (baseline)"
            - "m1_avail == 1.5 and m1_adopted == 2.0 (adoption moves miles; available + adopted == 3.5 at every step)"
            - "m2_avail == 3.5 and m2_adopted == 0.0 (termination is the exact compensating action; no drift)"
            - "s1_status == AVAILABLE"
