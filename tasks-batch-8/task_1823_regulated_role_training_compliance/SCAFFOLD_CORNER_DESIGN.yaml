            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://l3-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-L3M", name: "L3 Mgr" }, as: ComplianceAdmin, captures: { role_mgr: "$.data.id" } }
            - { call: "POST /compliance/roles", payload: { code: "R-L3", name: "L3 Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 2, criticality: "HARD" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "M-L3-1", full_name: "L3 Mgr", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_mgr}" }, as: HRAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-L3-1", full_name: "L3 Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}", manager_id: "${mgr}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
