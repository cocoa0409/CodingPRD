            - { call: "POST /fleet/buses", payload: { fleet_number: "Y18", vin: "VINY18", model_year: 2021, in_service_date: "2026-01-01", initial_odometer_miles: 10000, replacement_cost_cents: 30000000, base_warranty_expiry_miles: 5000, base_warranty_expiry_date: "2024-01-01", overhaul_interval_miles: 250000 }, as: FleetManager, captures: { b: $.data.id, bv: $.data.version } }
