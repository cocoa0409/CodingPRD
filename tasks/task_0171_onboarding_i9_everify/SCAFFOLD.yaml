# =============================================================================
# PRD Benchmark Seed Tables — Onboarding I-9 & E-Verify
# =============================================================================

scenario: |
  Onboarding I-9 & E-Verify: identity document review (List A/B/C), 3-day deadline,
  Reverification, E-Verify TNC handling, Section 3 update, F-1 OPT STEM extension.

domain_name: "onboarding-i9-everify"
api_prefix: "/employees"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - "Scheduled / deferred actions"
    - "Cascading side effects"
    - "Rate / threshold triggers"
    - "Idempotency"

  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - one_to_many        # Employee has many I9Section2Documents, EVerifyCases, ReverificationEvents
    - cross_aggregate    # EVerifyCase references I9Form; AuditEvent references any entity
    - self_referential   # I9Form supersedes prior I9Form (Section 3 reverification creates new form linked to old)
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Full legal name as on identity document."
        constraints: "1..200 chars, non-empty after trim"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO-8601 date (YYYY-MM-DD); used to derive minor flag."
      - name: ssn
        type: string
        source: input
        description: "9-digit Social Security Number (digits only)."
        constraints: "Exactly 9 digits; unique across active employees."
      - name: citizenship_status
        type: enum
        source: input
        description: "Section 1 attestation."
        constraints: "One of {US_CITIZEN, NON_CITIZEN_NATIONAL, LAWFUL_PERMANENT_RESIDENT, ALIEN_AUTHORIZED}"
      - name: work_authorization_expiry
        type: string
        source: input
        description: "Required only when citizenship_status is ALIEN_AUTHORIZED or LPR with expiring card; ISO-8601 date or null."
        default: null
      - name: visa_class
        type: enum
        source: input
        description: "Visa category when ALIEN_AUTHORIZED."
        default: null
        constraints: "One of {F1_OPT, F1_OPT_STEM, H1B, L1, TN, OTHER} or null"
      - name: start_date
        type: string
        source: input
        description: "First day of paid employment; anchors the 3-day Section 2 deadline."
      - name: section2_deadline
        type: string
        source: computed
        description: "Computed timestamp by which Section 2 MUST be completed. See calculation §1.3 compute_section2_deadline."
      - name: onboarding_status
        type: enum
        source: computed
        description: "Aggregate onboarding state derived from latest I9Form + EVerifyCase."
        default: "PENDING_SECTION_1"
        constraints: "One of {PENDING_SECTION_1, PENDING_SECTION_2, EVERIFY_PENDING, TNC_OPEN, AUTHORIZED, NOT_AUTHORIZED, TERMINATED}"
      - name: is_terminated
        type: boolean
        source: system
        description: "True after employer marks employee terminated."
        default: false

  - name: I9Form
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "Foreign key to Employee.id."
      - name: form_kind
        type: enum
        source: input
        description: "Initial new-hire form, a reverification form, or a Section 3 rehire."
        constraints: "One of {INITIAL, REVERIFICATION, REHIRE}"
      - name: supersedes_form_id
        type: string
        source: input
        description: "FK to a prior I9Form when this is REVERIFICATION or REHIRE (self-referential); null for INITIAL."
        default: null
      - name: section1_completed_at
        type: datetime
        source: system
        description: "When Section 1 was attested by the employee."
        default: null
      - name: section1_attested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Employee who attested Section 1."
        default: null
      - name: section2_completed_at
        type: datetime
        source: system
        description: "When Section 2 was signed by Employer Rep."
        default: null
      - name: section2_completed_by_user_id
        type: string
        source: system
        description: "EmployerRep X-User-ID who signed Section 2."
        default: null
      - name: list_a_document_id
        type: string
        source: input
        description: "FK to I9Document of category LIST_A; mutually exclusive with list_b/c."
        default: null
      - name: list_b_document_id
        type: string
        source: input
        description: "FK to I9Document of category LIST_B."
        default: null
      - name: list_c_document_id
        type: string
        source: input
        description: "FK to I9Document of category LIST_C."
        default: null
      - name: form_status
        type: enum
        source: computed
        description: "Lifecycle of this form."
        default: "DRAFT"
        constraints: "One of {DRAFT, SECTION_1_DONE, SECTION_2_DONE, SUPERSEDED, VOIDED}"
      - name: reverification_due
        type: string
        source: computed
        description: "Date the form's work authorization expires (drives reverification timer)."
        default: null

  - name: I9Document
    parent: Employee
    common_fields: false
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK to Employee.id."
      - name: category
        type: enum
        source: input
        description: "Which I-9 list this document satisfies."
        constraints: "One of {LIST_A, LIST_B, LIST_C}"
      - name: document_title
        type: string
        source: input
        description: "Canonical title (e.g. 'U.S. Passport', 'Permanent Resident Card', 'EAD I-766', 'Driver's License')."
      - name: document_number
        type: string
        source: input
        description: "Government-issued identifier on the document."
      - name: issuing_authority
        type: string
        source: input
        description: "Issuing agency / state / country."
      - name: expiration_date
        type: string
        source: input
        description: "ISO-8601 date; null only if the document is intrinsically non-expiring."
        default: null
      - name: receipt
        type: boolean
        source: input
        description: "True if this is a temporary 'receipt' (90-day replacement rule)."
        default: false
      - name: receipt_resolution_due
        type: string
        source: computed
        description: "If receipt=true, the deadline (start_date + 90 days) by which the real document must be presented."
        default: null

  - name: EVerifyCase
    parent: Employee
    common_fields: true
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK to Employee.id."
      - name: i9_form_id
        type: string
        source: input
        description: "FK to the I9Form this case was opened against."
      - name: submitted_at
        type: datetime
        source: system
        description: "When the case was submitted to E-Verify."
        default: null
      - name: idempotency_key
        type: string
        source: input
        description: "Caller-supplied key to dedupe submissions; unique per Employee."
      - name: case_status
        type: enum
        source: computed
        description: "Branching status."
        default: "DRAFT"
        constraints: "One of {DRAFT, PENDING, EMPLOYMENT_AUTHORIZED, TNC, FNC, CLOSED_AUTHORIZED, CLOSED_NOT_AUTHORIZED}"
      - name: tnc_kind
        type: enum
        source: system
        description: "Which agency raised the TNC."
        default: null
        constraints: "One of {SSA, DHS} or null"
      - name: tnc_opened_at
        type: datetime
        source: system
        description: "When the TNC was raised."
        default: null
      - name: tnc_contest_deadline
        type: datetime
        source: computed
        description: "Deadline by which the employee must contest the TNC (tnc_opened_at + 10 federal-government working days)."
        default: null
      - name: tnc_employee_decision
        type: enum
        source: system
        description: "Employee's response to TNC."
        default: null
        constraints: "One of {CONTEST, NO_CONTEST} or null"
      - name: final_disposition
        type: enum
        source: system
        description: "Terminal outcome recorded at case close."
        default: null
        constraints: "One of {AUTHORIZED, NOT_AUTHORIZED} or null"

  - name: ReverificationEvent
    parent: Employee
    common_fields: false
    fields:
      - name: employee_id
        type: string
        source: input
        description: "FK to Employee.id."
      - name: triggering_form_id
        type: string
        source: input
        description: "FK to the prior I9Form whose authorization expired or was extended."
      - name: reason
        type: enum
        source: input
        description: "Why reverification is required."
        constraints: "One of {WORK_AUTH_EXPIRY, OPT_TO_OPT_STEM_EXTENSION, REHIRE_WITHIN_3_YEARS}"
      - name: new_form_id
        type: string
        source: system
        description: "FK to the I9Form created to resolve this reverification."
        default: null
      - name: resolution_deadline
        type: string
        source: computed
        description: "Date by which reverification must be completed. See calculation §1.3 compute_reverification_deadline."
      - name: resolved_at
        type: datetime
        source: system
        description: "When the new I9Form Section 2 was signed; null until resolved."
        default: null

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: subject_employee_id
        type: string
        source: system
        description: "Employee this audit row pertains to (denormalized for query)."
      - name: subject_entity
        type: enum
        source: system
        description: "Entity type the event acted upon."
        constraints: "One of {EMPLOYEE, I9_FORM, I9_DOCUMENT, EVERIFY_CASE, REVERIFICATION_EVENT}"
      - name: subject_entity_id
        type: string
        source: system
        description: "ID of the subject row."
      - name: action
        type: string
        source: system
        description: "Verb code (e.g. 'SECTION_1_ATTEST', 'SECTION_2_SIGN', 'EVERIFY_SUBMIT', 'TNC_OPENED', 'TNC_CONTESTED', 'CASE_CLOSED', 'REVERIFY_OPENED', 'REVERIFY_RESOLVED', 'TERMINATE')."
      - name: actor_role
        type: enum
        source: system
        description: "Role that initiated."
        constraints: "One of {Employee, HRStaff, EmployerRep, System}"
      - name: actor_user_id
        type: string
        source: system
        description: "X-User-ID at the time of the action (null for System)."
        default: null
      - name: occurred_at
        type: datetime
        source: system
        description: "Server clock at action."

  - name: SystemClock
    parent: null
    common_fields: false
    fields:
      - name: current_time
        type: datetime
        source: system
        description: "Logical wall-clock used by all deadlines; advanced only via /_clock/advance."
      - name: federal_workdays_index
        type: array
        source: system
        description: "Cached list of federal-working-day boundaries used for tnc_contest_deadline arithmetic."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: I9Form
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: SECTION_1_DONE
        trigger: "POST /employees/{employee_id}/i9-forms/{form_id}/section1"
        actor: Employee
        preconditions:
          - "X-User-ID equals Employee.id (segregation of duties: only the employee attests Section 1)."
          - "form_kind in {INITIAL, REHIRE} OR (form_kind=REVERIFICATION and supersedes_form_id resolves to a SECTION_2_DONE form on same Employee)."
          - "Employee.is_terminated == false."
        side_effects:
          - "section1_completed_at = SystemClock.current_time."
          - "section1_attested_by_user_id = X-User-ID."
          - "Employee.section2_deadline recomputed via §1.3 compute_section2_deadline."
          - "AuditEvent {action='SECTION_1_ATTEST'} appended."
          - "Employee.onboarding_status -> PENDING_SECTION_2."
      - from: SECTION_1_DONE
        to: SECTION_2_DONE
        trigger: "POST /employees/{employee_id}/i9-forms/{form_id}/section2"
        actor: EmployerRep
        preconditions:
          - "X-User-ID != section1_attested_by_user_id (segregation of duties: signer differs from attester)."
          - "Documents satisfy List rule: EITHER (list_a_document_id set AND list_b/c null) OR (list_a null AND list_b AND list_c both set)."
          - "Every referenced I9Document belongs to the same employee_id and is not expired at SystemClock.current_time (unless receipt=true and receipt_resolution_due > now)."
          - "SystemClock.current_time <= Employee.section2_deadline (else ERR_SECTION2_DEADLINE_MISSED, but transition still allowed to record late completion with concurrent audit flag)."
        side_effects:
          - "section2_completed_at = SystemClock.current_time."
          - "section2_completed_by_user_id = X-User-ID."
          - "I9Form.reverification_due computed via §1.3 compute_reverification_due."
          - "AuditEvent {action='SECTION_2_SIGN'} appended."
          - "Cascade: if form has any LIST_A I9Document whose document_title in {'EAD I-766','I-94','Foreign Passport with I-94'} OR Employee.citizenship_status=ALIEN_AUTHORIZED with non-null work_authorization_expiry, then an automatic ReverificationEvent {reason=WORK_AUTH_EXPIRY, resolution_deadline=I9Form.reverification_due} is created."
          - "Employee.onboarding_status -> EVERIFY_PENDING."
      - from: SECTION_2_DONE
        to: SUPERSEDED
        trigger: "System: a successor I9Form transitions to SECTION_2_DONE with supersedes_form_id pointing here"
        actor: system
        preconditions:
          - "Successor I9Form.section2_completed_at not null."
        side_effects:
          - "AuditEvent {action='FORM_SUPERSEDED'} appended."
          - "Linked ReverificationEvent (if any) resolved_at = successor.section2_completed_at; ReverificationEvent.new_form_id = successor.id."
      - from: DRAFT
        to: VOIDED
        trigger: "POST /i9-forms/{form_id}/void"
        actor: HRStaff
        preconditions:
          - "form_status == DRAFT."
        side_effects:
          - "AuditEvent {action='FORM_VOIDED'} appended."
      - from: SECTION_1_DONE
        to: VOIDED
        trigger: "POST /i9-forms/{form_id}/void"
        actor: HRStaff
        preconditions:
          - "form_status == SECTION_1_DONE."
          - "No EVerifyCase opened against this form."
        side_effects:
          - "AuditEvent {action='FORM_VOIDED'} appended."

  - entity: EVerifyCase
    initial_state: DRAFT
    terminal_states: [CLOSED_AUTHORIZED, CLOSED_NOT_AUTHORIZED]
    transitions:
      - from: DRAFT
        to: PENDING
        trigger: "POST /employees/{employee_id}/everify-cases (Idempotency-Key header)"
        actor: EmployerRep
        preconditions:
          - "Linked I9Form.form_status == SECTION_2_DONE."
          - "SystemClock.current_time <= I9Form.section2_completed_at + 3 federal working days (else ERR_EVERIFY_SUBMISSION_LATE; case is still recorded with system audit flag)."
          - "No prior non-CLOSED case exists for this Employee."
          - "idempotency_key unique across this Employee's cases (retry with same key returns the existing case)."
        side_effects:
          - "submitted_at = SystemClock.current_time."
          - "AuditEvent {action='EVERIFY_SUBMIT'} appended."
          - "Employee.onboarding_status -> EVERIFY_PENDING."
      - from: PENDING
        to: EMPLOYMENT_AUTHORIZED
        trigger: "POST /everify-cases/{case_id}/result {result=EMPLOYMENT_AUTHORIZED}"
        actor: system
        preconditions:
          - "case_status == PENDING."
        side_effects:
          - "AuditEvent {action='CASE_AUTHORIZED'} appended."
      - from: PENDING
        to: TNC
        trigger: "POST /everify-cases/{case_id}/result {result=TNC, tnc_kind}"
        actor: system
        preconditions:
          - "case_status == PENDING."
        side_effects:
          - "tnc_opened_at = SystemClock.current_time."
          - "tnc_kind set from payload."
          - "tnc_contest_deadline = compute_tnc_contest_deadline (§1.3) — 10 federal working days after tnc_opened_at."
          - "AuditEvent {action='TNC_OPENED'} appended."
          - "Employee.onboarding_status -> TNC_OPEN."
      - from: PENDING
        to: FNC
        trigger: "POST /everify-cases/{case_id}/result {result=FNC}"
        actor: system
        preconditions:
          - "case_status == PENDING."
        side_effects:
          - "AuditEvent {action='FNC_RECEIVED'} appended."
      - from: TNC
        to: PENDING
        trigger: "POST /everify-cases/{case_id}/tnc-decision {decision=CONTEST}"
        actor: Employee
        preconditions:
          - "case_status == TNC."
          - "SystemClock.current_time <= tnc_contest_deadline."
          - "X-User-ID equals Employee.id."
        side_effects:
          - "tnc_employee_decision = CONTEST."
          - "AuditEvent {action='TNC_CONTESTED'} appended."
          - "Employee.onboarding_status -> EVERIFY_PENDING."
      - from: TNC
        to: CLOSED_NOT_AUTHORIZED
        trigger: "POST /everify-cases/{case_id}/tnc-decision {decision=NO_CONTEST}"
        actor: Employee
        preconditions:
          - "case_status == TNC."
          - "X-User-ID equals Employee.id."
        side_effects:
          - "tnc_employee_decision = NO_CONTEST."
          - "final_disposition = NOT_AUTHORIZED."
          - "AuditEvent {action='CASE_CLOSED', disposition='NOT_AUTHORIZED'} appended."
          - "Employee.onboarding_status -> NOT_AUTHORIZED."
          - "Cascade: terminate_employee subroutine — Employee.is_terminated = true, AuditEvent {action='TERMINATE'} appended."
      - from: TNC
        to: CLOSED_NOT_AUTHORIZED
        trigger: "System sweep at SystemClock.current_time > tnc_contest_deadline (POST /_sweep/run)"
        actor: system
        preconditions:
          - "case_status == TNC."
          - "tnc_employee_decision IS NULL."
        side_effects:
          - "final_disposition = NOT_AUTHORIZED."
          - "AuditEvent {action='TNC_DEADLINE_LAPSED'} appended."
          - "AuditEvent {action='CASE_CLOSED', disposition='NOT_AUTHORIZED'} appended."
          - "Employee.onboarding_status -> NOT_AUTHORIZED."
          - "Cascade: terminate_employee subroutine — Employee.is_terminated = true, AuditEvent {action='TERMINATE'} appended."
      - from: EMPLOYMENT_AUTHORIZED
        to: CLOSED_AUTHORIZED
        trigger: "POST /everify-cases/{case_id}/close"
        actor: EmployerRep
        preconditions:
          - "case_status == EMPLOYMENT_AUTHORIZED."
        side_effects:
          - "final_disposition = AUTHORIZED."
          - "AuditEvent {action='CASE_CLOSED', disposition='AUTHORIZED'} appended."
          - "Employee.onboarding_status -> AUTHORIZED."
      - from: FNC
        to: CLOSED_NOT_AUTHORIZED
        trigger: "POST /everify-cases/{case_id}/close"
        actor: EmployerRep
        preconditions:
          - "case_status == FNC."
        side_effects:
          - "final_disposition = NOT_AUTHORIZED."
          - "AuditEvent {action='CASE_CLOSED', disposition='NOT_AUTHORIZED'} appended."
          - "Employee.onboarding_status -> NOT_AUTHORIZED."
          - "Cascade: terminate_employee subroutine — Employee.is_terminated = true, AuditEvent {action='TERMINATE'} appended."

  - entity: ReverificationEvent
    initial_state: OPEN
    terminal_states: [RESOLVED, EXPIRED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "System: a new I9Form supersedes the triggering_form via Section 2 sign"
        actor: system
        preconditions:
          - "Successor I9Form.form_status transitions to SECTION_2_DONE."
          - "Successor I9Form.supersedes_form_id == triggering_form_id."
          - "SystemClock.current_time <= ReverificationEvent.resolution_deadline."
        side_effects:
          - "resolved_at = successor.section2_completed_at."
          - "new_form_id = successor.id."
          - "AuditEvent {action='REVERIFY_RESOLVED'} appended."
          - "Triggering I9Form transitions to SUPERSEDED."
      - from: OPEN
        to: EXPIRED
        trigger: "System sweep at SystemClock.current_time > resolution_deadline (POST /_sweep/run)"
        actor: system
        preconditions:
          - "resolved_at IS NULL."
          - "SystemClock.current_time > resolution_deadline."
        side_effects:
          - "AuditEvent {action='REVERIFY_EXPIRED'} appended."
          - "Cascade: terminate_employee subroutine — Employee.is_terminated = true, AuditEvent {action='TERMINATE'} appended."
          - "Employee.onboarding_status -> NOT_AUTHORIZED."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two parallel POSTs to /everify-cases for the same employee_id with the SAME Idempotency-Key"
    guarantee: "Exactly one EVerifyCase is created; the second request returns the existing case row (200 OK with same id), not a duplicate."
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 200
    serialization: "First-writer-wins on (employee_id, idempotency_key)."

  - scenario: "Two parallel POSTs to /everify-cases for the same employee_id with DIFFERENT Idempotency-Keys while no case is open"
    guarantee: "At most one EVerifyCase exists per Employee at any time; the loser is rejected."
    error_id: ERR_CASE_ALREADY_OPEN
    http_status: 409
    serialization: "First-writer-wins on EVerifyCase creation per employee_id."

  - scenario: "Employee submits tnc-decision=CONTEST while the system sweep at the same instant attempts to close the case for deadline lapse"
    guarantee: "Exactly one operation succeeds; if the employee's POST is serialized first, the case transitions TNC->PENDING and the sweep is a no-op; otherwise the case is CLOSED_NOT_AUTHORIZED and the contest is rejected."
    error_id: ERR_TNC_DEADLINE_PASSED
    http_status: 409
    serialization: "First-writer-wins on EVerifyCase.case_status."

  - scenario: "Two EmployerReps simultaneously sign Section 2 on the same I9Form"
    guarantee: "Only one transition DRAFT/SECTION_1_DONE -> SECTION_2_DONE succeeds; the second receives a state error."
    error_id: ERR_FORM_ALREADY_SIGNED
    http_status: 409
    serialization: "First-writer-wins on I9Form.form_status."

  - scenario: "Two HRStaff create initial I9Forms for the same Employee at the same time"
    guarantee: "At most one INITIAL I9Form per Employee; loser rejected."
    error_id: ERR_DUPLICATE_INITIAL_FORM
    http_status: 409
    serialization: "First-writer-wins on (employee_id, form_kind=INITIAL)."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: compute_section2_deadline
    trigger: "On Employee.start_date set; on I9Form Section 1 attestation; recomputed when start_date is corrected via PATCH /employees/{id}."
    algorithm: threshold
    formula: |
      # Section 2 must be completed by end of the 3rd federal working day after start_date.
      # Federal working days = Mon-Fri, excluding US federal holidays in SystemClock.federal_workdays_index.
      d0 = parse_date(Employee.start_date)
      count = 0
      cursor = d0
      while count < 3:
        cursor = cursor + 1 calendar day
        if is_federal_working_day(cursor):
          count += 1
      # Deadline is 23:59:59.999 UTC at the end of that 3rd working day.
      Employee.section2_deadline = datetime(cursor, 23:59:59.999, UTC)
    input_set: "Employee.start_date plus SystemClock.federal_workdays_index. Exclusion: start_date itself does NOT count toward the 3 days even if it is a working day."
    constants:
      WORKING_DAY_WINDOW: 3
    precision: "Date arithmetic at day granularity; deadline timestamp truncated to millisecond."
    variants:
      - name: standard_new_hire
        when: "form_kind == INITIAL"
        difference: "Counts forward from start_date as above; result drives ERR_SECTION2_DEADLINE_MISSED."
      - name: rehire_within_3_years
        when: "form_kind == REHIRE and predecessor Section 2 within 3 years"
        difference: "Deadline = max(predecessor section2_completed_at, rehire start_date + 3 working days as above) — the employer may reuse prior I-9 OR start a new clock; the LATER of the two is used."

  - name: compute_reverification_due
    trigger: "On I9Form transition SECTION_1_DONE -> SECTION_2_DONE."
    algorithm: aggregation
    formula: |
      # Determine which expiry pins reverification_due.
      candidates = []
      if Employee.citizenship_status == ALIEN_AUTHORIZED and Employee.work_authorization_expiry not null:
        candidates.append(parse_date(Employee.work_authorization_expiry))
      for doc in [list_a, list_b, list_c documents on this form]:
        if doc is not None and doc.category in {LIST_A, LIST_C} and doc.expiration_date not null and doc.category-required-for-reverification:
          # LIST_B (identity-only) expiries do NOT trigger reverification per scenario.
          candidates.append(parse_date(doc.expiration_date))
      if Employee.visa_class == F1_OPT and doc.document_title == 'EAD I-766':
        # OPT EAD expiry — eligible for STEM extension cadenced auto-extension.
        candidates.append(parse_date(doc.expiration_date))
      I9Form.reverification_due = min(candidates) if candidates else null
    input_set: "Section 2 documents on the form whose category is LIST_A or LIST_C with non-null expiration_date; Employee.work_authorization_expiry. LIST_B identity documents are excluded from the min, even if expired."
    constants:
      LIST_B_EXCLUDED: true
    precision: "Day granularity (date, not datetime)."
    variants:
      - name: opt_stem_extension_auto_180
        when: "Employee.visa_class transitions from F1_OPT to F1_OPT_STEM via PATCH /employees/{id} BEFORE the EAD expires"
        difference: "reverification_due is automatically extended by 180 calendar days from the original EAD expiration_date (cap-gap-like auto extension); no new I9Form is required UNTIL that extended date."

  - name: compute_reverification_deadline
    trigger: "On ReverificationEvent creation; on PATCH /employees/{id} if visa_class changes to F1_OPT_STEM."
    algorithm: threshold
    formula: |
      base = parse_date(triggering_I9Form.reverification_due)
      if reason == WORK_AUTH_EXPIRY:
        deadline_date = base  # must reverify ON or BEFORE the expiry
      elif reason == OPT_TO_OPT_STEM_EXTENSION:
        deadline_date = base + 180 calendar days
      elif reason == REHIRE_WITHIN_3_YEARS:
        deadline_date = compute_section2_deadline.standard_new_hire(rehire_start_date)
      ReverificationEvent.resolution_deadline = datetime(deadline_date, 23:59:59.999, UTC)
    input_set: "ReverificationEvent.reason + triggering_form.reverification_due + (for REHIRE) the rehire start_date."
    constants:
      OPT_STEM_EXTENSION_DAYS: 180
    precision: "Day granularity."

  - name: compute_tnc_contest_deadline
    trigger: "On EVerifyCase transition PENDING -> TNC."
    algorithm: threshold
    formula: |
      # 10 FEDERAL WORKING DAYS from the date of TNC issuance.
      d0 = date(tnc_opened_at)
      count = 0
      cursor = d0
      while count < 10:
        cursor = cursor + 1 calendar day
        if is_federal_working_day(cursor):
          count += 1
      EVerifyCase.tnc_contest_deadline = datetime(cursor, 23:59:59.999, UTC)
    input_set: "tnc_opened_at and SystemClock.federal_workdays_index. The day of TNC issuance is NOT counted (start clock the next working day)."
    constants:
      TNC_WORKING_DAYS: 10
    precision: "Millisecond."

  - name: derive_onboarding_status
    trigger: "On every mutation that changes I9Form.form_status, EVerifyCase.case_status, ReverificationEvent.resolved_at, or Employee.is_terminated."
    algorithm: projection
    formula: |
      if Employee.is_terminated: return TERMINATED
      latest_form = max(I9Form by created_at where employee_id = e.id and form_status not in {SUPERSEDED, VOIDED})
      latest_case = max(EVerifyCase by created_at where employee_id = e.id and case_status not in {CLOSED_AUTHORIZED, CLOSED_NOT_AUTHORIZED})
      if latest_form is None or latest_form.form_status == DRAFT: return PENDING_SECTION_1
      if latest_form.form_status == SECTION_1_DONE: return PENDING_SECTION_2
      if latest_case is None: return EVERIFY_PENDING  # Section 2 done but case not opened yet
      if latest_case.case_status == TNC: return TNC_OPEN
      if latest_case.case_status in {PENDING, EMPLOYMENT_AUTHORIZED, FNC, DRAFT}: return EVERIFY_PENDING
      # otherwise look at most recent CLOSED case
      most_recent_closed = max(EVerifyCase by created_at where employee_id = e.id and case_status starts with CLOSED_)
      if most_recent_closed.final_disposition == AUTHORIZED: return AUTHORIZED
      return NOT_AUTHORIZED
    input_set: "Latest non-superseded/non-voided I9Form and latest non-closed EVerifyCase per Employee, broken by created_at descending; ties broken by id ascending (deterministic)."
    constants: {}
    precision: "Enum."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is authorized for this endpoint per §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id resolves (Employee/I9Form/EVerifyCase/...), validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Body references (employee_id, i9_form_id, list_*_document_id, supersedes_form_id) resolve to existing rows."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH endpoints with FK fields"
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is permitted (per §1.2 transitions)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: the X-User-ID signing Section 2 MUST differ from the X-User-ID that attested Section 1 (form.section1_attested_by_user_id)."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /employees/{employee_id}/i9-forms/{form_id}/section2"
  - priority: 7
    category: business_referential
    check: "Document list rule: EXACTLY ONE of (LIST_A present, both LIST_B and LIST_C present). Any other combination (e.g., A+B, A+C, B alone, C alone, A+B+C) is rejected."
    error_id: ERR_DOCUMENT_LIST_RULE
    http_status: 422
    applies_to: "POST /employees/{employee_id}/i9-forms/{form_id}/section2"
  - priority: 8
    category: business_referential
    check: "Every supplied list_*_document_id has I9Document.employee_id == path employee_id, and the category matches the field (e.g., list_a_document_id.category == LIST_A)."
    error_id: ERR_DOCUMENT_CATEGORY_MISMATCH
    http_status: 422
    applies_to: "POST /employees/{employee_id}/i9-forms/{form_id}/section2"
  - priority: 9
    category: business_safety
    check: "No referenced I9Document is expired at SystemClock.current_time (expiration_date < today, where expiration_date is non-null). Exception: receipt=true documents are accepted if receipt_resolution_due > today."
    error_id: ERR_DOCUMENT_EXPIRED
    http_status: 422
    applies_to: "POST /employees/{employee_id}/i9-forms/{form_id}/section2"
  - priority: 10
    category: business_temporal
    check: "tnc-decision endpoint: SystemClock.current_time <= EVerifyCase.tnc_contest_deadline."
    error_id: ERR_TNC_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /everify-cases/{case_id}/tnc-decision"
  - priority: 11
    category: business_temporal
    check: "Section 2 endpoint: SystemClock.current_time MAY exceed Employee.section2_deadline; transition still executes but server returns 201 with an audit flag and emits AuditEvent with action='SECTION_2_LATE'. (Boundary precision: deadline timestamp is inclusive — current_time == section2_deadline is on-time.)"
    error_id: ERR_SECTION2_DEADLINE_MISSED
    http_status: 409
    applies_to: "POST /employees/{employee_id}/i9-forms/{form_id}/section2 — emitted ONLY if request body includes flag enforce_deadline=true; otherwise late completion is permitted."
  - priority: 12
    category: business_constraint
    check: "E-Verify case submission requires linked I9Form.form_status == SECTION_2_DONE AND no prior non-CLOSED EVerifyCase on the same Employee."
    error_id: ERR_CASE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /employees/{employee_id}/everify-cases"
  - priority: 13
    category: business_referential
    check: "Idempotency-Key (employee_id, idempotency_key) uniqueness: replay with same key returns the existing case (200) instead of creating a new one."
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 200
    applies_to: "POST /employees/{employee_id}/everify-cases"
  - priority: 14
    category: business_constraint
    check: "I9Form.form_kind=REVERIFICATION requires supersedes_form_id pointing to a SECTION_2_DONE form on the same Employee; REHIRE requires the predecessor's section2_completed_at within 3 years of new start_date."
    error_id: ERR_INVALID_FORM_LINEAGE
    http_status: 422
    applies_to: "POST /employees/{employee_id}/i9-forms"
  - priority: 15
    category: business_constraint
    check: "visa_class transition F1_OPT -> F1_OPT_STEM via PATCH /employees/{id} requires that today <= the underlying EAD I-766 expiration_date (cannot extend a lapsed authorization)."
    error_id: ERR_STEM_EXTENSION_LATE
    http_status: 422
    applies_to: "PATCH /employees/{id}"
  - priority: 16
    category: business_fiscal
    check: "Pagination params within bounds (limit 1..100, offset >= 0)."
    error_id: ERR_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/employees"
    description: "Create a new Employee record (Section 1 NOT yet attested)."
    roles: [HRStaff]
    code: 201
    input: ["legal_name", "date_of_birth", "ssn", "citizenship_status", "start_date", "work_authorization_expiry?", "visa_class?"]
    output: Employee
    side_effects:
      - "compute_section2_deadline"
      - "AuditEvent action=EMPLOYEE_CREATED"
      - "onboarding_status -> PENDING_SECTION_1"

  - method: GET
    path: "/employees/{employee_id}"
    description: "Read Employee with derived onboarding_status."
    roles: [HRStaff, EmployerRep, Employee]
    code: 200
    input: []
    output: Employee
    side_effects:
      - "derive_onboarding_status"

  - method: PATCH
    path: "/employees/{employee_id}"
    description: "Update Employee — used for visa_class change (F1_OPT -> F1_OPT_STEM), start_date correction, work_authorization_expiry update. Body must include version for OCC."
    roles: [HRStaff]
    code: 200
    input: ["version", "start_date?", "visa_class?", "work_authorization_expiry?"]
    output: Employee
    side_effects:
      - "if start_date changed -> compute_section2_deadline"
      - "if visa_class transitions F1_OPT -> F1_OPT_STEM -> open ReverificationEvent reason=OPT_TO_OPT_STEM_EXTENSION; then compute_reverification_deadline"

  - method: GET
    path: "/employees"
    description: "List Employees with filters."
    roles: [HRStaff, EmployerRep]
    code: 200
    input: ["limit?", "offset?", "onboarding_status?", "is_terminated?"]
    output: Employee[]
    side_effects: []

  - method: POST
    path: "/employees/{employee_id}/i9-documents"
    description: "Register an identity document for an employee."
    roles: [HRStaff, EmployerRep]
    code: 201
    input: ["category", "document_title", "document_number", "issuing_authority", "expiration_date?", "receipt?"]
    output: I9Document
    side_effects:
      - "if receipt == true -> compute receipt_resolution_due = start_date + 90 calendar days"
      - "AuditEvent action=DOC_REGISTERED"

  - method: GET
    path: "/employees/{employee_id}/i9-documents"
    description: "List documents for an employee."
    roles: [HRStaff, EmployerRep, Employee]
    code: 200
    input: ["limit?", "offset?", "category?"]
    output: I9Document[]
    side_effects: []

  - method: POST
    path: "/employees/{employee_id}/i9-forms"
    description: "Create a new I9Form (form_kind = INITIAL | REVERIFICATION | REHIRE). Returns DRAFT form."
    roles: [HRStaff]
    code: 201
    input: ["form_kind", "supersedes_form_id?"]
    output: I9Form
    side_effects:
      - "AuditEvent action=FORM_CREATED"

  - method: GET
    path: "/employees/{employee_id}/i9-forms"
    description: "List forms for an employee."
    roles: [HRStaff, EmployerRep, Employee]
    code: 200
    input: ["limit?", "offset?", "form_status?", "form_kind?"]
    output: I9Form[]
    side_effects: []

  - method: POST
    path: "/employees/{employee_id}/i9-forms/{form_id}/section1"
    description: "Employee attests Section 1 (citizenship status, signature)."
    roles: [Employee]
    code: 200
    input: [version]
    output: I9Form
    side_effects:
      - "I9Form DRAFT -> SECTION_1_DONE"
      - "compute_section2_deadline"
      - "derive_onboarding_status"

  - method: POST
    path: "/employees/{employee_id}/i9-forms/{form_id}/section2"
    description: "Employer Rep signs Section 2 attaching List A or List B+C documents."
    roles: [EmployerRep]
    code: 200
    input: ["version", "list_a_document_id?", "list_b_document_id?", "list_c_document_id?", "enforce_deadline?"]
    output: I9Form
    side_effects:
      - "I9Form SECTION_1_DONE -> SECTION_2_DONE"
      - "compute_reverification_due"
      - "optionally open ReverificationEvent (reason=WORK_AUTH_EXPIRY)"
      - "derive_onboarding_status"
      - "possibly supersede prior form (predecessor I9Form -> SUPERSEDED)"

  - method: POST
    path: "/i9-forms/{form_id}/void"
    description: "Void a DRAFT or SECTION_1_DONE form (cannot void after Section 2 is signed)."
    roles: [HRStaff]
    code: 200
    input: [version]
    output: I9Form
    side_effects:
      - "I9Form -> VOIDED"
      - "AuditEvent action=FORM_VOIDED"

  - method: POST
    path: "/employees/{employee_id}/everify-cases"
    description: "Submit an E-Verify case for the latest SECTION_2_DONE form. Idempotency-Key header required."
    roles: [EmployerRep]
    code: 201
    input: [i9_form_id, idempotency_key]
    output: EVerifyCase
    side_effects:
      - "EVerifyCase DRAFT -> PENDING"
      - "derive_onboarding_status -> EVERIFY_PENDING"

  - method: GET
    path: "/everify-cases/{case_id}"
    description: "Read an E-Verify case."
    roles: [EmployerRep, HRStaff, Employee]
    code: 200
    input: []
    output: EVerifyCase
    side_effects: []

  - method: POST
    path: "/everify-cases/{case_id}/result"
    description: "Test/system hook: deliver an E-Verify outcome (EMPLOYMENT_AUTHORIZED | TNC | FNC). Used by tests to simulate the upstream agency response."
    roles: [System]
    code: 200
    input: ["result", "tnc_kind?"]
    output: EVerifyCase
    side_effects:
      - "EVerifyCase PENDING -> EMPLOYMENT_AUTHORIZED OR TNC OR FNC (per payload)"
      - "if result == TNC -> compute_tnc_contest_deadline AND derive_onboarding_status -> TNC_OPEN"

  - method: POST
    path: "/everify-cases/{case_id}/tnc-decision"
    description: "Employee responds to TNC with CONTEST or NO_CONTEST."
    roles: [Employee]
    code: 200
    input: [decision]
    output: EVerifyCase
    side_effects:
      - "EVerifyCase TNC -> PENDING (decision=CONTEST) OR TNC -> CLOSED_NOT_AUTHORIZED (decision=NO_CONTEST)"
      - "AuditEvent appended (TNC_CONTESTED or CASE_CLOSED)"
      - "if NO_CONTEST -> cascade terminate_employee"

  - method: POST
    path: "/everify-cases/{case_id}/close"
    description: "Employer closes an EMPLOYMENT_AUTHORIZED or FNC case."
    roles: [EmployerRep]
    code: 200
    input: []
    output: EVerifyCase
    side_effects:
      - "EVerifyCase EMPLOYMENT_AUTHORIZED -> CLOSED_AUTHORIZED OR FNC -> CLOSED_NOT_AUTHORIZED"
      - "derive_onboarding_status"
      - "if final_disposition == NOT_AUTHORIZED -> cascade terminate_employee"

  - method: GET
    path: "/employees/{employee_id}/reverification-events"
    description: "List reverification events for an employee."
    roles: [HRStaff, EmployerRep, Employee]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ReverificationEvent[]
    side_effects: []

  - method: GET
    path: "/employees/{employee_id}/audit-events"
    description: "Append-only audit trail for the employee, ordered by occurred_at ASC."
    roles: [HRStaff, EmployerRep, Employee]
    code: 200
    input: ["limit?", "offset?"]
    output: AuditEvent[]
    side_effects: []

  - method: POST
    path: "/_clock/advance"
    description: "Test-only endpoint: advance SystemClock.current_time to the supplied ISO-8601 timestamp."
    roles: [System]
    code: 200
    input: ["to"]
    output: SystemClock
    side_effects:
      - "SystemClock.current_time = to"

  - method: POST
    path: "/_sweep/run"
    description: "Test-only endpoint: run the deadline sweep. Closes lapsed TNCs (->CLOSED_NOT_AUTHORIZED) and expires overdue ReverificationEvents (->EXPIRED), cascading employee termination."
    roles: [System]
    code: 200
    input: []
    output: null
    side_effects:
      - "EVerifyCase TNC -> CLOSED_NOT_AUTHORIZED on tnc_contest_deadline lapse"
      - "ReverificationEvent OPEN -> EXPIRED on resolution_deadline lapse"
      - "Employee.is_terminated = true (cascade)"
      - "derive_onboarding_status"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role header missing/malformed."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per §1.7."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Section 2 signer's X-User-ID equals Section 1 attester's X-User-ID on the same form."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id does not resolve."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body FK reference does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state from which the requested transition is permitted."
  - id: ERR_FORM_ALREADY_SIGNED
    http: 409
    condition: "Section 2 sign attempted on a form whose form_status is already SECTION_2_DONE / SUPERSEDED / VOIDED (concurrent or duplicate)."
  - id: ERR_DUPLICATE_INITIAL_FORM
    http: 409
    condition: "Attempt to create a second I9Form with form_kind=INITIAL for an Employee that already has one."
  - id: ERR_INVALID_FORM_LINEAGE
    http: 422
    condition: "REVERIFICATION form lacks valid supersedes_form_id, or REHIRE predecessor outside 3-year window."
  - id: ERR_DOCUMENT_LIST_RULE
    http: 422
    condition: "Section 2 documents do not satisfy 'List A alone' XOR 'List B and List C together' exactly."
  - id: ERR_DOCUMENT_CATEGORY_MISMATCH
    http: 422
    condition: "A list_*_document_id references a document whose category does not match the field, or whose employee_id does not match the form's employee."
  - id: ERR_DOCUMENT_EXPIRED
    http: 422
    condition: "A referenced I9Document is expired at SystemClock.current_time (and not a still-valid receipt)."
  - id: ERR_SECTION2_DEADLINE_MISSED
    http: 409
    condition: "Section 2 sign request with enforce_deadline=true after Employee.section2_deadline."
  - id: ERR_CASE_ALREADY_OPEN
    http: 409
    condition: "A non-CLOSED EVerifyCase already exists for this Employee (different Idempotency-Key)."
  - id: ERR_IDEMPOTENT_REPLAY
    http: 200
    condition: "Re-submit of EVerifyCase with same (employee_id, idempotency_key) — server returns the existing case (200) instead of creating a duplicate. Treated as a success in the catalog for symmetric handling; the body carries the existing case."
  - id: ERR_TNC_DEADLINE_PASSED
    http: 409
    condition: "tnc-decision attempted after tnc_contest_deadline, or sweep closed case before the decision was serialized."
  - id: ERR_EVERIFY_SUBMISSION_LATE
    http: 409
    condition: "EVerify submission > 3 federal working days after Section 2 sign (only emitted when enforce_deadline=true)."
  - id: ERR_STEM_EXTENSION_LATE
    http: 422
    condition: "F1_OPT->F1_OPT_STEM attempted after EAD expiration_date — cannot retroactively extend a lapsed authorization."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Mutation with version in body that does not match server-side version (OCC)."
  - id: ERR_PAGINATION
    http: 400
    condition: "limit out of [1,100] or offset < 0."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic body shape / type / required-field validation failure not covered by a specific code."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Employee
    description: "The hire themselves. Attests Section 1; responds to TNC."
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /employees/{employee_id}/i9-forms/{form_id}/section1"
      - "POST /everify-cases/{case_id}/tnc-decision"
    shared_operations:
      - "GET /employees/{employee_id}"
      - "GET /employees/{employee_id}/i9-documents"
      - "GET /employees/{employee_id}/i9-forms"
      - "GET /employees/{employee_id}/audit-events"
      - "GET /employees/{employee_id}/reverification-events"
      - "GET /everify-cases/{case_id}"
    notes: "Ownership check: X-User-ID == path employee_id."

  - name: HRStaff
    description: "Human Resources staff. Creates Employees, opens forms, voids drafts, corrects employee profile, registers documents."
    identity: "opaque"
    exclusive_operations:
      - "POST /employees"
      - "PATCH /employees/{employee_id}"
      - "POST /employees/{employee_id}/i9-forms"
      - "POST /i9-forms/{form_id}/void"
    shared_operations:
      - "POST /employees/{employee_id}/i9-documents"
      - "GET /employees"
      - "GET /employees/{employee_id}"
      - "GET /employees/{employee_id}/i9-documents"
      - "GET /employees/{employee_id}/i9-forms"
      - "GET /employees/{employee_id}/audit-events"
      - "GET /employees/{employee_id}/reverification-events"
      - "GET /everify-cases/{case_id}"
    notes: "Cannot attest Section 1 (that is the Employee). Cannot sign Section 2 (that is EmployerRep). Cannot submit E-Verify cases. Strict segregation of duties."

  - name: EmployerRep
    description: "Employer representative authorized to physically examine documents and sign Section 2 / Section 3, and to submit E-Verify cases. May NOT also be the Employee whose Section 1 they would sign."
    identity: "opaque"
    exclusive_operations:
      - "POST /employees/{employee_id}/i9-forms/{form_id}/section2"
      - "POST /employees/{employee_id}/everify-cases"
      - "POST /everify-cases/{case_id}/close"
    shared_operations:
      - "POST /employees/{employee_id}/i9-documents"
      - "GET /employees"
      - "GET /employees/{employee_id}"
      - "GET /employees/{employee_id}/i9-documents"
      - "GET /employees/{employee_id}/i9-forms"
      - "GET /employees/{employee_id}/audit-events"
      - "GET /employees/{employee_id}/reverification-events"
      - "GET /everify-cases/{case_id}"
    notes: "Segregation of duties: section2_completed_by_user_id MUST differ from section1_attested_by_user_id (per validation priority 6)."

  - name: System
    description: "Test/system actor used to deliver E-Verify outcomes, advance the clock, and run the sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /everify-cases/{case_id}/result"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
    shared_operations: []
    notes: "Header X-User-Role=System; X-User-ID is an arbitrary operator id."
