              captures: { prov_id: $.data.id }
            - call: "POST /adjudication/members"
              payload: { member_number: "M-VAL-8", plan_id: "${plan_id}" }
              as: PlanAdmin
              captures: { mem_id: $.data.id }
          trigger:
            - call: "POST /adjudication/claims"
              payload: { claim_number: "CLM-VAL-8", member_id: "${mem_id}", provider_id: "${prov_id}", lines: [{ line_number: 1, procedure_code: "73721", units: 1, billed_amount_cents: 60000, service_date: "2026-02-10" }] }
              as: ClaimsIntake
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_MEMBER_NO_COVERAGE"
            - "HTTP status is 422"
            - "GET /adjudication/claims?member_id=${mem_id} returns total_count == 0"

      - name: other_payer_over_billed_alone_returns_the_fiscal_error_when_filing_window_passes
        claim_type: priority_ordering
        grounds: ["validations[priority=70]", "errors[ERR_OTHER_PAYER_EXCEEDS_BILLED]"]
        distinguishing_aspect: "With the claim comfortably inside the 90-day window, the only failing rule is the priority-70 fiscal check, so the response is ERR_OTHER_PAYER_EXCEEDS_BILLED (422) — the mirror image of the §1.8 conflict where the temporal error wins."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z, only 19 whole days after the 2026-02-10 service date."
            - "Plan VAL-9, IN_NETWORK provider, fee schedule rate 73721 = 40000, member M-VAL-9 with an open-ended PRIMARY coverage from 2026-01-01."
          setup_api_calls:
            - call: "POST /adjudication/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /adjudication/benefit-plans"
              payload: { plan_code: "VAL-9", name: "Validation Plan Nine", deductible_individual_cents: 0, oop_max_individual_cents: 1000000, coinsurance_member_pct: 0 }
