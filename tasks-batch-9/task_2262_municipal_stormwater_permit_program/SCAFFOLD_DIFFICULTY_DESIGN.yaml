              as: StormwaterProgramManager
              as_user_id: "mgr-01"
          assert:
            - "OF-A assessment: the single sample is 0.63 * 36000 * 0.00220462 = 50.0008 lb at 4 decimals, gross_load_lb == 50.00, sweeping_credit_lb == 0.00, net_load_lb == 50.00"
            - "Outfall.${ofa_id}.tmdl_status == ATTAINING: net_load_lb == tmdl_wla_lb_per_year is NOT an exceedance under strict greater-than"
            - "OF-B assessment: samples are 1.1023 and 5.0927 lb, so taken_total == 6.1950 and gross_load_lb == 6.20"
            - "carrying the products at full precision gives 6.194993... and a wrong gross_load_lb of 6.19; rounding each sample to 2 decimals first gives 1.10 + 5.09 = 6.19, also wrong"
            - "Outfall.${ofb_id}.net_load_lb equals last_assessed_net_load_lb == 6.20 and tmdl_status == ATTAINING"
            - "PermitTerm.${term_id}.exceeding_outfall_count == 0 and compliance_posture is unchanged by two ATTAINING assessments"

