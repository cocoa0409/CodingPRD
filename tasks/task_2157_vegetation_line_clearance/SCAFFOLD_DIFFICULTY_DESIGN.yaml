          trigger:
            - call: "POST /vm/hazard-trees/${ht_bad}/decision"
              payload: { outcome: "APPROVE_REMOVAL" }
              as: UtilityForester
              captures: { err: $.data.error_id }
            - call: "POST /vm/hazard-trees/${ht_ok}/decision"
              payload: { outcome: "APPROVE_REMOVAL" }
              as: UtilityForester
          assert:
