          trigger:
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "13:00", close_time: "16:00", picking_capacity_slots: 25 }, as: FarmManager, captures: { w_b: $.data.id } }
            - { call: "POST /farm/field-day-windows", payload: { field_id: "${f_id}", date: "2026-08-04", open_time: "16:00", close_time: "18:00", picking_capacity_slots: 1 }, as: FarmManager, captures: { err: $.data.error_id } }
          assert:
            - "Window B (total 50, ceil(50/25)=2 <= 2) is created"
            - "Window C (total 51, ceil(51/25)=3 > 2) rejected: error_id == ERR_INSUFFICIENT_STAFFING, HTTP 422"

