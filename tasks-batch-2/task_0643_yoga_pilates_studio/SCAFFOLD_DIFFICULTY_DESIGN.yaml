  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_requires_entitlement_active_unfrozen
        grounds:
          - state_machines.Reservation.BOOKED_to_WAITLISTED
          - validations[priority=8]
          - entities.Entitlement.fields.freeze_status
        distinguishing_aspect: |
          Reservation->Entitlement pair: a booking's validity depends on the Entitlement being
          lifecycle ACTIVE and freeze_status UNFROZEN. A FROZEN entitlement blocks the booking with
          ERR_ENTITLEMENT_NOT_USABLE even though the session has open seats.
        test_recipe:
          setup:
            - "Clock 2026-02-01. Member M (established) with an ACTIVE membership that is FROZEN."
            - "Published OPEN session S with open seats."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Mat A", room_type: "MAT", station_capacity: 10 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "cf@x.com", full_name: "Cy", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "MEMBERSHIP", price_cents: 10000, credits_total: -1, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { ent_id: $.data.id }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /entitlements/${ent_id}/freeze"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "VINYASA", start_utc: "2026-02-12T10:00:00Z", end_utc: "2026-02-12T11:00:00Z", published_capacity: 10 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${s_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ENTITLEMENT_NOT_USABLE"
            - "HTTP status == 409"

      - name: session_publish_requires_room_open_and_teacher_active
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_OPEN
          - entities.Room.fields.status
          - entities.Teacher.fields.status
        distinguishing_aspect: |
          A different entity pair (ClassSession->Room): publishing a session requires the Room
          status == OPEN. Publishing into a CLOSED room is rejected with ERR_ROOM_CLOSED, a
          cross-entity precondition independent of the Reservation->Entitlement dependency.
        test_recipe:
          setup:
            - "Clock 2026-02-01. REFORMER Room created then CLOSED via PATCH. Teacher REFORMER ACTIVE."
            - "A SCHEDULED session S in that room."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Reformer A", room_type: "REFORMER", station_capacity: 4 }
              as: StudioManager
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /teachers"
              payload: { full_name: "Tara", certifications: ["REFORMER"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-20T10:00:00Z", end_utc: "2026-02-20T11:00:00Z", published_capacity: 4 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "PATCH /rooms/${room_id}"
              payload: { status: "CLOSED", expected_room_version: "${room_v}" }
              as: StudioManager
          trigger:
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROOM_CLOSED"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_session_overlap_half_open
        grounds:
          - state_machines.ClassSession.SCHEDULED_to_OPEN
          - validations[priority=11]
        distinguishing_aspect: |
          ClassSession-on-Room overlap uses HALF-OPEN [start, end) semantics: a new session whose
          start_utc == an existing session's end_utc does NOT overlap (adjacency allowed), but any
          interior overlap is rejected ERR_ROOM_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Clock 2026-02-01. REFORMER Room cap 4, Teacher REFORMER. Session A published 10:00-11:00."
            - "Session B (same room) 10:30-11:30 created (interior overlap with A)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Reformer A", room_type: "REFORMER", station_capacity: 4 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tara", certifications: ["REFORMER"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Toby", certifications: ["REFORMER"] }
              as: StudioManager
              captures: { teacher2_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "REFORMER", start_utc: "2026-02-14T10:00:00Z", end_utc: "2026-02-14T11:00:00Z", published_capacity: 4 }
              as: StudioManager
              captures: { a_id: $.data.id }
            - call: "POST /class-sessions/${a_id}/publish"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher2_id}", discipline: "REFORMER", start_utc: "2026-02-14T10:30:00Z", end_utc: "2026-02-14T11:30:00Z", published_capacity: 4 }
              as: StudioManager
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /class-sessions/${b_id}/publish"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROOM_DOUBLE_BOOKED (interior overlap on half-open interval)"
            - "HTTP status == 409"

      - name: room_workshop_overlap_buffer_inclusive
        grounds:
          - state_machines.Workshop.DRAFT_to_OPEN
          - validations[priority=11]
        distinguishing_aspect: |
          Workshop-on-Room overlap uses BUFFER-INCLUSIVE semantics (distinct interval arithmetic
          from the session half-open rule): a workshop starting within WORKSHOP_BUFFER_MINUTES after
          an existing session's end is rejected even though the raw intervals are adjacent/disjoint.
        test_recipe:
          setup:
            - "Clock 2026-02-01. MAT Room cap 10, Teacher VINYASA. Session A published 10:00-11:00."
            - "Workshop W (same room) starting 11:15 (within the 30-min buffer of A's 11:00 end)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Mat A", room_type: "MAT", station_capacity: 10 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Theo", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher2_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "VINYASA", start_utc: "2026-02-16T10:00:00Z", end_utc: "2026-02-16T11:00:00Z", published_capacity: 10 }
              as: StudioManager
              captures: { a_id: $.data.id }
            - call: "POST /class-sessions/${a_id}/publish"
              payload: {}
              as: StudioManager
            - call: "POST /workshops"
              payload: { room_id: "${room_id}", lead_teacher_id: "${teacher2_id}", title: "Inversions", kind: "WORKSHOP", start_utc: "2026-02-16T11:15:00Z", end_utc: "2026-02-16T13:00:00Z", seat_capacity: 8, deposit_cents: 2000, price_cents: 8000 }
              as: StudioManager
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /workshops/${w_id}/publish"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ROOM_DOUBLE_BOOKED (buffer-inclusive overlap rejects adjacency within WORKSHOP_BUFFER_MINUTES)"
            - "HTTP status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: credit_conservation_book_then_early_cancel
        grounds:
          - state_machines.Reservation.BOOKED_to_WAITLISTED
          - state_machines.Reservation.BOOKED_to_CANCELLED_EARLY
          - entities.Entitlement.fields.credits_used
        distinguishing_aspect: |
          Conserved quantity = entitlement credit pool: a finite pack's
          (credits_used + credits_remaining) MUST equal credits_total before and after a
          book-then-early-cancel pair. Booking debits 1 credit; early-cancel refunds exactly 1;
          net drift == 0.
        test_recipe:
          setup:
            - "Clock 2026-02-01. Member M with ACTIVE 5-credit CLASS_PACK (credits_used=0). Published OPEN session S."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: StudioManager
            - call: "POST /rooms"
              payload: { name: "Mat A", room_type: "MAT", station_capacity: 10 }
              as: StudioManager
              captures: { room_id: $.data.id }
            - call: "POST /teachers"
              payload: { full_name: "Tia", certifications: ["VINYASA"] }
              as: StudioManager
              captures: { teacher_id: $.data.id }
            - call: "POST /members"
              payload: { email: "ic@x.com", full_name: "Ivy", home_studio_state: "CA" }
              as: StudioManager
              captures: { m_id: $.data.id }
            - call: "POST /entitlements"
              payload: { member_id: "${m_id}", kind: "CLASS_PACK", price_cents: 5000, credits_total: 5, cycle_start_utc: "2026-02-01T00:00:00Z" }
              as: StudioManager
              captures: { ent_id: $.data.id }
            - call: "POST /entitlements/${ent_id}/activate"
              payload: {}
              as: StudioManager
            - call: "POST /class-sessions"
              payload: { room_id: "${room_id}", teacher_id: "${teacher_id}", discipline: "VINYASA", start_utc: "2026-02-22T10:00:00Z", end_utc: "2026-02-22T11:00:00Z", published_capacity: 10 }
              as: StudioManager
              captures: { s_id: $.data.id }
            - call: "POST /class-sessions/${s_id}/publish"
              payload: {}
              as: StudioManager
              captures: { s_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { member_id: "${m_id}", class_session_id: "${s_id}", entitlement_id: "${ent_id}", expected_class_session_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "After booking: Entitlement.${ent_id}.credits_used == 1 and credits_remaining == 4"
            - "After early-cancel: Entitlement.${ent_id}.credits_used == 0 and credits_remaining == 5"
            - "Invariant: credits_used + credits_remaining == 5 (credits_total) at both points; net drift == 0"

      - name: seat_conservation_confirm_then_withdraw_promotes
        grounds:
          - state_machines.Enrollment.APPLIED_to_CONFIRMED
          - state_machines.Enrollment.CONFIRMED_to_WITHDRAWN
          - state_machines.Enrollment.WAITLISTED_to_CONFIRMED
          - entities.Workshop.fields.confirmed_seat_count
        distinguishing_aspect: |
          A different conserved quantity = workshop seat occupancy: confirmed_seat_count never
          exceeds seat_capacity. Confirming fills a seat (+1); a member withdraw frees it (-1) and
          auto-promotes a waitlisted enrollment (+1), so confirmed_seat_count returns to capacity
          with net drift == 0 across the compensating pair.
        test_recipe:
          setup:
            - "Clock 2026-02-01. MAT Room cap 10, Teacher VINYASA. Workshop W seat_capacity 1, deposit 2000, price 8000, published OPEN."
            - "M1 CONFIRMED (seat filled -> FULL). M2 WAITLISTED."
          setup_api_calls:
