              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 10000, platform_fee_bps: 500, occurred_at: "2026-08-05T01:00:00Z" }
              as: PlatformAdmin
              captures: { ev_clear: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/ops/run"
              as: PlatformAdmin
            - call: "POST /api/revenue-events/${ev_clear}/reverse"
              payload: { reason: "cb" }
              as: PlatformAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /api/channels/${ch_id}/revenue-events"
              payload: { kind: "TIP", gross_cents: 5000, platform_fee_bps: 500, occurred_at: "2026-09-01T01:00:00Z" }
              as: PlatformAdmin
              captures: { ev_pend: $.data.id }
          trigger:
            - call: "POST /api/revenue-events/${ev_pend}/reverse"
              payload: { reason: "too early" }
              as: PlatformAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /api/revenue-events/${cb_id}/reverse"
              payload: { reason: "reverse the reversal" }
              as: PlatformAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_CHARGEABILITY_VIOLATION (PENDING cannot be reversed)"
            - "err2 == ERR_CHARGEABILITY_VIOLATION (CHARGEBACK kind cannot be reversed)"

      - name: payout_retry_limit_reached
