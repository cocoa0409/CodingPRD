            - { call: "POST /tools/${tool_id}/complete-prototype", as: ToolingEngineer }
            - { call: "POST /tools/${tool_id}/submit-qualification", as: ToolingEngineer }
            - { call: "POST /cleanliness-certificates", payload: { subject_type: TOOL, subject_id: "${tool_id}", grade: INDUSTRIAL, issued_at: "2026-04-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", cert_body: "LabA" }, as: QualityInspector }
            - { call: "POST /tools/${tool_id}/approve-production", payload: { production_cost: 10000.00, rated_lifetime_shots: 100000 }, as: ToolingEngineer }
            - { call: "POST /packaging-specs", payload: { spec_code: "S-C", spec_type: STOCK, cleanliness_grade: INDUSTRIAL, per_pack_cost: 0.50 }, as: PackagingEngineer, captures: { spec_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "ST-C", resource_type: FORMING_STATION, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 60.00 }, as: ProductionScheduler, captures: { station_id: $.data.id } }
            - { call: "POST /machine-resources", payload: { resource_code: "B-C", resource_type: INSPECTION_BOOTH, cleanliness_grade: INDUSTRIAL, machine_rate_per_hour: 25.00 }, as: ProductionScheduler, captures: { booth_id: $.data.id } }
            - { call: "POST /production-orders", payload: { order_code: "OC", part_number: "P-C4", resin_type: PETG, ordered_qty: 100, required_gauge_mm: 1.500, cleanliness_grade: INDUSTRIAL, spec_nominal_wall_mm: 1.300, spec_min_wall_mm: 1.230, nominal_part_weight_kg: 0.050, std_cycle_time_s: 30, std_machine_rate_per_hour: 60.00, tool_id: "${tool_id}", packaging_spec_id: "${spec_id}", is_prototype_order: false }, as: ProductionScheduler, captures: { order_id: $.data.id } }
            - { call: "POST /material-allocations", payload: { production_order_id: "${order_id}", source_type: VIRGIN_LOT, lot_id: "${lot_id}", qty_kg: 5.900 }, as: ProductionScheduler, captures: { alloc_id: $.data.id } }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { o_ver: $.data.version } }
            - { call: "POST /production-orders/${order_id}/stage", payload: { expected_production_order_version: "${o_ver}" }, as: ProductionScheduler }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z", oven_temp_c: 180.0, cycle_time_s: 28, shots_planned: 10 }, as: ProductionScheduler, captures: { run1: $.data.id } }
            - { call: "POST /forming-runs/${run1}/complete", payload: { shots_completed: 10, scrap_weight_kg: 0.000, actual_end: "2026-05-02T11:00:00Z" }, as: ProductionScheduler }
            - { call: "POST /quality-inspections", payload: { production_order_id: "${order_id}", forming_run_id: "${run1}", booth_id: "${booth_id}", inspection_type: FIRST_ARTICLE, scheduled_start: "2026-05-02T11:30:00Z", scheduled_end: "2026-05-02T12:00:00Z", wall_measurements_mm: [1.240, 1.250] }, as: QualityInspector, as_user_id: qi-1, captures: { insp1: $.data.id } }
            - { call: "POST /quality-inspections/${insp1}/disposition", payload: { disposition: PASS }, as: QualityInspector, as_user_id: qi-2 }
            - { call: "POST /forming-runs", payload: { production_order_id: "${order_id}", station_id: "${station_id}", planned_start: "2026-05-02T11:00:00Z", planned_end: "2026-05-02T12:00:00Z", oven_temp_c: 180.0, cycle_time_s: 28, shots_planned: 90 }, as: ProductionScheduler, captures: { run2: $.data.id } }
          trigger:
            - { call: "POST /forming-runs/${run2}/complete", payload: { shots_completed: 90, scrap_weight_kg: 0.000, actual_end: "2026-05-02T12:00:00Z" }, as: ProductionScheduler }
            - { call: "GET /production-orders/${order_id}", as: Any, captures: { sched: $.data.schedule_status, fin: $.data.final_cost } }
