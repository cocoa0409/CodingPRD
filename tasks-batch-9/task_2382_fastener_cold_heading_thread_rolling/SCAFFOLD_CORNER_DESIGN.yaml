              as: QualityInspector
              as_user_id: "insp-1"
              captures: { cert_id: $.data.id }
          assert:
            - "The draft while the lot is on hold returns 412 ERR_STALE_PRODUCTION_LOT_VERSION — priority 7 decides before the priority 9 hold rule"
            - "After release-hold the same stale version still returns 412: the release bumped the version again"
            - "lot_v_fresh equals lot_v_read + 2 (one hold, one release-hold) and neither 412 incremented it"
            - "The draft with lot_v_fresh returns 201 with status DRAFT, revision 1, pinned_part_spec_version 1 and certified_strength_class CLASS_10_9"
            - "ProductionLot.${lot_id}.disposition is IN_PROCESS with hold_source NONE at draft time"

      - name: every_write_bumps_the_version_and_no_read_does
        claim_type: optimistic_concurrency
        grounds:
          - entities[*].common_fields
          - endpoints[POST /wire-lots].side_effects
          - endpoints[POST /production-lots].side_effects
        distinguishing_aspect: >
          The wire lot's version is a strict write counter: 1 at creation, 2 after release, 3 after a lot
          reserves mass, 4 after heading settles it — while three interleaved GETs and one refused release
          leave it exactly where it was.
        test_recipe:
          setup:
            - "Verified heat H-77410 and part NP-M8-088 (blank 20.0 g); die DIE-4S-001 mounted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
