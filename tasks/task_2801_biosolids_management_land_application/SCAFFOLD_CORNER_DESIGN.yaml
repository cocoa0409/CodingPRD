          difficulty_instance: transitive_cascade / completion_cascade_restricts_site_then_defers_sibling_event
          rationale: "The four hops of the close-out cascade (event COMPLETED -> ledger rows -> site RESTRICTED at 0.90 of CPLR -> sibling event DEFERRED) are asserted end-to-end by the named §1.8 instance, including the facility storage debit."

