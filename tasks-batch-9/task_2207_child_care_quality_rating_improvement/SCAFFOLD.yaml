scenario: "2207. Child Care Quality Rating & Improvement System (state quality rating and improvement system): rating standards by domain with points or block-level advancement rules, provider enrollment, self-assessment and documentation submission, on-site observation using standardized environment rating tools with observer reliability, rating award, validity period and re-rating or appeal, tiered subsidy reimbursement linked to rating level, quality improvement grants, coaching allocation and spending compliance, professional development registry linkage for staff credentials, publication of ratings to families and provider dispute of published data"
domain_name: "child-care-quality-rating-improvement"
api_prefix: "/"
api_prefix_note: "Peer resource collections live directly at the API root (/providers, /rating-cycles, /observation-visits, /improvement-grants, ...); there is no single owning top-level segment because the rating spine, the funding spine and the remedy spine are peers linked by foreign keys."

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    RatingCycle is the spine: a cycle accumulates a verified SelfAssessment, one or
    more ObservationVisits scored by reliability-certified Observers, and then an
    award whose tier is capped by block-level advancement gates. The award's tier and
    validity window drive money in two directions (tiered subsidy reimbursement out,
    improvement-grant and coaching spend ceilings in), and drive publication to
    families, which the provider may dispute. Appeals and disputes are cyclic
    (INFO_REQUESTED loops) and re-enter the rating spine through remand.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: StandardDomain
    parent: null
    common_fields: true
    fields:
      - name: domain_code
        type: enum
        source: input
        description: quality standard domain identifier
        constraints: "one of {LEARNING_ENVIRONMENT, STAFF_QUALIFICATIONS, FAMILY_PARTNERSHIP, ADMINISTRATION, CHILD_ASSESSMENT}; globally unique"
      - name: block_level
        type: integer
        source: input
        description: advancement block this domain belongs to; blocks clear sequentially 1 then 2 then 3
        constraints: "1..3"
      - name: max_points
        type: integer
        source: input
        description: maximum raw points obtainable in this domain
        constraints: ">= 1, <= 100"
      - name: block_min_points
        type: integer
        source: input
        description: raw points required in this domain for its block to be CLEARED
        constraints: "1 <= block_min_points <= max_points"
      - name: weight
        type: number
        source: input
        description: share of the weighted total score contributed by this domain
        constraints: "0 < weight <= 1; sum of weight over all 5 domains must equal exactly 1.00"
      - name: observation_linked
        type: boolean
        source: input
        description: when true, this domain's awarded points are derived from the finalized observation composite instead of verified self-assessment points
        default: false
      - name: min_composite_for_block
        type: number
        source: input
        description: minimum observation composite (1.00-7.00) required for this domain's block to clear; null when observation_linked is false
        constraints: "null, or 1.00 <= value <= 7.00, two decimals"

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: provider legal name
      - name: license_number
        type: string
        source: input
        description: state child care license number
        constraints: "unique across all Providers regardless of status"
      - name: county_code
        type: string
        source: input
        description: county of the licensed site
      - name: region_code
        type: enum
        source: input
        description: reimbursement region factor band
        constraints: "one of {URBAN, RURAL, FRONTIER}"
      - name: licensed_capacity
        type: integer
        source: input
        description: licensed child capacity
        constraints: ">= 1"
      - name: active_staff_fte
        type: number
        source: input
        description: total FTE of currently employed classroom and administrative staff, denominator of credential compliance
        constraints: "> 0, two decimals"
      - name: weekly_onsite_cap_hours
        type: number
        source: input
        description: maximum on-site coaching hours the site may host in any ISO calendar week
        default: 12
        constraints: "> 0, one decimal"
      - name: status
        type: enum
        source: system
        description: enrollment lifecycle state
        default: APPLIED
        constraints: "one of {APPLIED, ENROLLED, ACTIVE, SUSPENDED, WITHDRAWN}"
      - name: enrolled_on
        type: datetime
        source: system
        description: logical-clock date at which enrollment was approved; null while APPLIED
      - name: current_rating_cycle_id
        type: string
        source: computed
        description: "FK -> RatingCycle.id; the single cycle whose status is ACTIVE for this provider, null when none"
      - name: current_tier
        type: integer
        source: computed
        description: awarded tier of current_rating_cycle_id, null when the provider has no ACTIVE cycle
        constraints: "null or 1..5"
      - name: credential_compliance_pct
        type: number
        source: computed
        description: output of calculations.credential_compliance_pct, recomputed on every StaffCredential mutation and on every expiry run
        default: 0
        constraints: "0.00..100.00, two decimals"
      - name: reimbursement_adjustment_cents
        type: integer
        source: computed
        description: signed cumulative retroactive subsidy correction owed to (positive) or recoverable from (negative) the provider
        default: 0
      - name: public_listing_visible
        type: boolean
        source: computed
        description: true iff current_rating_cycle_id is non-null and that cycle's publication_status == PUBLISHED
        default: false

  - name: RatingCycle
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id"
      - name: cycle_type
        type: enum
        source: input
        description: why this cycle was opened
        constraints: "one of {INITIAL, RERATING, REMAND}"
      - name: opened_on
        type: datetime
        source: system
        description: logical-clock date the cycle was created
      - name: status
        type: enum
        source: system
        description: rating cycle state
        default: DRAFT
        constraints: "one of {DRAFT, SELF_ASSESSMENT_SUBMITTED, DOCS_VERIFIED, OBSERVATION_SCHEDULED, OBSERVATION_FINALIZED, AWARDED, ACTIVE, UNDER_APPEAL, EXPIRED, SUPERSEDED, WITHDRAWN}"
      - name: publication_status
        type: enum
        source: system
        description: family-facing publication state of this cycle's award
        default: UNPUBLISHED
        constraints: "one of {UNPUBLISHED, PUBLISHED, SUPPRESSED, WITHDRAWN}"
      - name: observation_composite
        type: number
        source: computed
        description: output of calculations.observation_composite_score for the FINALIZED ObservationVisit of this cycle, null before finalization
        constraints: "null or 1.00..7.00, two decimals"
      - name: reliability_pct
        type: number
        source: computed
        description: output of calculations.inter_rater_reliability_pct for the FINALIZED ObservationVisit, null when no secondary observer participated
        constraints: "null or 0.00..100.00, two decimals"
      - name: domain_points
        type: object
        source: computed
        description: output of calculations.domain_points_award, map domain_code -> awarded integer points
      - name: block_clearance
        type: object
        source: computed
        description: map block_level("1","2","3") -> CLEARED | NOT_CLEARED, produced by calculations.rating_tier_determination
      - name: highest_block_cleared
        type: integer
        source: computed
        description: largest K such that blocks 1..K are all CLEARED; 0 when block 1 is NOT_CLEARED
        constraints: "0..3"
      - name: weighted_total
        type: number
        source: computed
        description: output of calculations.rating_tier_determination weighted score on a 0.00-100.00 scale
        constraints: "0.00..100.00, two decimals"
      - name: points_tier
        type: integer
        source: computed
        description: tier implied by weighted_total alone, before block capping
        constraints: "1..5"
      - name: awarded_tier
        type: integer
        source: computed
        description: final tier, min(points_tier, block cap implied by highest_block_cleared)
        constraints: "null before award, else 1..5"
      - name: score_variant
        type: enum
        source: input
        description: which calculation variant produced awarded_tier
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: awarded_on
        type: datetime
        source: system
        description: logical-clock date the award was issued
      - name: awarded_by_user_id
        type: string
        source: system
        description: X-User-ID of the StateAdministrator who issued the award; compared against appeal reviewers for segregation of duties
      - name: effective_date
        type: datetime
        source: computed
        description: output of calculations.validity_period; first day of the month following awarded_on, or inherited from the remanded cycle
      - name: expires_on
        type: datetime
        source: computed
        description: output of calculations.validity_period; inclusive last day of the validity window
      - name: validity_months
        type: integer
        source: computed
        description: 24 base, 36 when awarded_tier >= 4
        constraints: "null, 24 or 36"
      - name: rerating_window_opens_on
        type: datetime
        source: computed
        description: expires_on minus 90 calendar days, the earliest date a RERATING cycle may be opened
      - name: published_at
        type: datetime
        source: system
        description: logical-clock timestamp of the most recent publication of this cycle
      - name: published_snapshot
        type: object
        source: computed
        description: frozen family-facing payload {tier, weighted_total, domain_points, licensed_capacity, county_code} captured at publication
      - name: appeal_adjusted
        type: boolean
        source: system
        description: true when this cycle's tier was set by a SUSTAINED appeal remand
        default: false
      - name: supersedes_cycle_id
        type: string
        source: system
        description: "FK -> RatingCycle.id; the prior cycle this one replaced, null for the provider's first cycle"
      - name: superseded_by_cycle_id
        type: string
        source: system
        description: "FK -> RatingCycle.id; set on the older cycle when a newer cycle reaches ACTIVE"

  - name: SelfAssessment
    parent: RatingCycle
    common_fields: true
    fields:
      - name: rating_cycle_id
        type: string
        source: input
        description: "FK -> RatingCycle.id"
      - name: claimed_points
        type: object
        source: input
        description: map domain_code -> claimed integer points, one key per StandardDomain
        constraints: "every value 0 <= v <= that domain's max_points; all 5 domain_codes required"
      - name: documentation
        type: array
        source: input
        description: evidence records, each {domain_code, evidence_type, reference_label, page_count}
        constraints: "evidence_type in {POLICY, ROSTER, LESSON_PLAN, FAMILY_SURVEY, TRAINING_LOG}; array MUST be non-empty"
      - name: verified_points
        type: object
        source: system
        description: map domain_code -> integer points confirmed by the StateAdministrator during verification, null before verification
      - name: documented_domains
        type: array
        source: computed
        description: distinct domain_codes appearing at least once in documentation
      - name: status
        type: enum
        source: system
        description: verification state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, RETURNED, VERIFIED}"
      - name: return_count
        type: integer
        source: system
        description: number of times this self-assessment has been RETURNED for correction
        default: 0
      - name: verified_on
        type: datetime
        source: system
        description: logical-clock date of the APPROVE verification decision

  - name: StaffCredential
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id"
      - name: staff_registry_id
        type: string
        source: input
        description: professional development registry member identifier
        constraints: "unique per provider_id"
      - name: role_type
        type: enum
        source: input
        description: staff role governing the minimum credential level
        constraints: "one of {DIRECTOR, LEAD_TEACHER, ASSISTANT}"
      - name: credential_level
        type: integer
        source: input
        description: registry credential level
        constraints: "1..6"
      - name: fte
        type: number
        source: input
        description: full-time-equivalent share of this staff member
        constraints: "0 < fte <= 1, two decimals"
      - name: employment_status
        type: enum
        source: input
        description: employment state at this provider
        default: ACTIVE
        constraints: "one of {ACTIVE, SEPARATED}"
      - name: registry_status
        type: enum
        source: system
        description: linkage state against the professional development registry
        default: UNLINKED
        constraints: "one of {UNLINKED, PENDING, VERIFIED, EXPIRED}"
      - name: verified_on
        type: datetime
        source: system
        description: logical-clock date the registry linkage was confirmed
      - name: expires_on
        type: datetime
        source: system
        description: inclusive last date the verified credential remains valid

  - name: Observer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: observer name
      - name: tool_code
        type: enum
        source: input
        description: standardized environment rating tool the observer is certified on
        constraints: "one of {ERS_INFANT_TODDLER, ERS_EARLY_CHILDHOOD}"
      - name: anchor_agreement_pct
        type: number
        source: system
        description: agreement against the state anchor observer at the most recent certification
        constraints: "null or 0.00..100.00, two decimals"
      - name: reliability_certified_until
        type: datetime
        source: system
        description: inclusive last date on which this observer's scores are admissible
      - name: status
        type: enum
        source: system
        description: reliability standing
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, RELIABLE, LAPSED, RETIRED}"

  - name: ObservationVisit
    parent: RatingCycle
    common_fields: true
    fields:
      - name: rating_cycle_id
        type: string
        source: input
        description: "FK -> RatingCycle.id"
      - name: lead_observer_id
        type: string
        source: input
        description: "FK -> Observer.id; scores of this observer produce the composite"
      - name: secondary_observer_id
        type: string
        source: input
        description: "FK -> Observer.id; optional reliability-check observer, MUST differ from lead_observer_id"
      - name: window_start
        type: datetime
        source: input
        description: start of the on-site occupation interval, inclusive
      - name: window_end
        type: datetime
        source: input
        description: end of the on-site occupation interval, exclusive
      - name: status
        type: enum
        source: system
        description: visit state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, SCORES_ENTERED, RELIABILITY_CHECK, FINALIZED, CANCELLED}"
      - name: composite
        type: number
        source: computed
        description: output of calculations.observation_composite_score over the lead observer's current-attempt scores
        constraints: "null or 1.00..7.00, two decimals"
      - name: reliability_pct
        type: number
        source: computed
        description: output of calculations.inter_rater_reliability_pct, null when secondary_observer_id is null
        constraints: "null or 0.00..100.00, two decimals"
      - name: rescore_count
        type: integer
        source: system
        description: number of times the visit returned from RELIABILITY_CHECK to SCORES_ENTERED
        default: 0
      - name: finalized_on
        type: datetime
        source: system
        description: logical-clock date of finalization

  - name: ObservationScore
    parent: ObservationVisit
    common_fields: false
    fields:
      - name: observation_visit_id
        type: string
        source: input
        description: "FK -> ObservationVisit.id"
      - name: observer_id
        type: string
        source: input
        description: "FK -> Observer.id; MUST equal the visit's lead_observer_id or secondary_observer_id"
      - name: subscale_code
        type: enum
        source: input
        description: environment rating tool subscale
        constraints: "one of {SPACE_FURNISHINGS, PERSONAL_CARE, LANGUAGE_REASONING, ACTIVITIES, INTERACTION, PROGRAM_STRUCTURE}"
      - name: raw_score
        type: number
        source: input
        description: subscale score on the 1.0-7.0 tool scale
        constraints: "1.0 <= raw_score <= 7.0 in increments of 0.5"
      - name: attempt_no
        type: integer
        source: computed
        description: 1 for the first score row of this (visit, observer, subscale), incremented per re-score; only the highest attempt_no row is current
        constraints: ">= 1"
      - name: is_current
        type: boolean
        source: computed
        description: true iff this row has the highest attempt_no for its (observation_visit_id, observer_id, subscale_code) triple
        default: true

  - name: Appeal
    parent: RatingCycle
    common_fields: true
    fields:
      - name: rating_cycle_id
        type: string
        source: input
        description: "FK -> RatingCycle.id"
      - name: grounds
        type: enum
        source: input
        description: statutory ground for appeal
        constraints: "one of {SCORING_ERROR, OBSERVER_RELIABILITY, DOCUMENTATION_OMITTED, PROCEDURAL}"
      - name: narrative
        type: string
        source: input
        description: provider statement
      - name: filed_on
        type: datetime
        source: system
        description: logical-clock date of filing
      - name: status
        type: enum
        source: system
        description: appeal state
        default: FILED
        constraints: "one of {FILED, UNDER_REVIEW, INFO_REQUESTED, SUSTAINED, DENIED, WITHDRAWN}"
      - name: info_request_count
        type: integer
        source: system
        description: number of INFO_REQUESTED rounds used
        default: 0
        constraints: "<= 2"
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the AppealReviewer who took the first review action; MUST differ from the cycle's awarded_by_user_id
      - name: adjusted_tier
        type: integer
        source: input
        description: tier ordered by the reviewer on SUSTAIN, null otherwise
        constraints: "null or 1..5"
      - name: decided_on
        type: datetime
        source: system
        description: logical-clock date of the terminal decision

  - name: DataDispute
    parent: RatingCycle
    common_fields: true
    fields:
      - name: rating_cycle_id
        type: string
        source: input
        description: "FK -> RatingCycle.id"
      - name: disputed_field
        type: enum
        source: input
        description: which published_snapshot field the provider disputes
        constraints: "one of {PUBLISHED_TIER, PUBLISHED_SCORE, DOMAIN_POINTS, LICENSED_CAPACITY, COUNTY_CODE}"
      - name: claimed_value
        type: string
        source: input
        description: value the provider asserts is correct
      - name: linked_appeal_id
        type: string
        source: system
        description: "FK -> Appeal.id; the SUSTAINED appeal authorising a PUBLISHED_TIER or PUBLISHED_SCORE correction, null otherwise"
      - name: status
        type: enum
        source: system
        description: dispute state
        default: FILED
        constraints: "one of {FILED, TRIAGE, INFO_REQUESTED, ESCALATED, CORRECTION_APPLIED, REJECTED, WITHDRAWN}"
      - name: triage_round
        type: integer
        source: system
        description: number of completed TRIAGE entries, incremented on each escalation return
        default: 0
        constraints: "<= 3"
      - name: filed_on
        type: datetime
        source: system
        description: logical-clock date of filing
      - name: resolved_on
        type: datetime
        source: system
        description: logical-clock date the dispute reached CORRECTION_APPLIED, REJECTED or WITHDRAWN

  - name: ImprovementGrant
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id"
      - name: rating_cycle_id
        type: string
        source: input
        description: "FK -> RatingCycle.id; the cycle whose award justified the grant"
      - name: awarded_amount_cents
        type: integer
        source: input
        description: total grant ceiling in cents
        constraints: "> 0"
      - name: spend_deadline
        type: datetime
        source: input
        description: inclusive last invoice_date eligible for reimbursement
      - name: committed_cents
        type: integer
        source: computed
        description: sum of amount_cents of GrantExpenditure rows with status IN {SUBMITTED, APPROVED}
        default: 0
      - name: reimbursed_cents
        type: integer
        source: computed
        description: sum of reimbursable_cents of GrantExpenditure rows with status == REIMBURSED
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: awarded_amount_cents - committed_cents - reimbursed_cents
        default: 0
      - name: category_spend_cents
        type: object
        source: computed
        description: map category -> cents already committed or reimbursed in that category
      - name: status
        type: enum
        source: system
        description: disbursement dimension of the grant
        default: OFFERED
        constraints: "one of {OFFERED, ACCEPTED, OPEN, FROZEN, CLOSED, DECLINED}"
      - name: compliance_status
        type: enum
        source: system
        description: independent compliance dimension, evolves separately from status
        default: COMPLIANT
        constraints: "one of {COMPLIANT, UNDER_REVIEW, FINDING_ISSUED, REMEDIATED, RECOVERY}"
      - name: recovery_amount_cents
        type: integer
        source: computed
        description: output of calculations.grant_compliance_recovery, cents the state reclaims at close
        default: 0

  - name: GrantExpenditure
    parent: ImprovementGrant
    common_fields: true
    fields:
      - name: improvement_grant_id
        type: string
        source: input
        description: "FK -> ImprovementGrant.id"
      - name: category
        type: enum
        source: input
        description: allowable cost category
        constraints: "one of {EQUIPMENT, PROF_DEV, FACILITY, ADMIN}"
      - name: amount_cents
        type: integer
        source: input
        description: invoiced amount in cents
        constraints: "> 0"
      - name: invoice_date
        type: datetime
        source: input
        description: vendor invoice date, primary sort key of the reimbursement waterfall
      - name: status
        type: enum
        source: system
        description: expenditure state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, REIMBURSED, REJECTED, VOIDED}"
      - name: reimbursable_cents
        type: integer
        source: computed
        description: per-line output of calculations.grant_reimbursement_waterfall
        default: 0
      - name: disallowed_cents
        type: integer
        source: computed
        description: amount_cents - reimbursable_cents after the waterfall
        default: 0

  - name: CoachingAllocation
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id"
      - name: funding_grant_id
        type: string
        source: input
        description: "FK -> ImprovementGrant.id; null when funding_source is STATE_BASE"
      - name: coach_user_id
        type: string
        source: input
        description: X-User-ID of the Coach who delivers the allocation; opaque operator id, not an entity id
      - name: funding_source
        type: enum
        source: input
        description: where allocation dollars come from
        constraints: "one of {GRANT, STATE_BASE}"
      - name: period_start
        type: datetime
        source: input
        description: inclusive first date sessions may be scheduled
      - name: period_end
        type: datetime
        source: input
        description: inclusive last date sessions may be scheduled
      - name: allocated_hours
        type: number
        source: input
        description: coaching hours granted for the period
        constraints: "> 0, one decimal"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: coach billing rate per hour in cents
        constraints: "> 0"
      - name: base_hours_cost_cents
        type: integer
        source: computed
        description: allocated_hours * hourly_rate_cents, the tier key of the administrative fee
      - name: admin_fee_cents
        type: integer
        source: computed
        description: output of calculations.coaching_allocation_cost administrative fee component
      - name: total_cost_cents
        type: integer
        source: computed
        description: base_hours_cost_cents + admin_fee_cents
      - name: spend_cap_cents
        type: integer
        source: computed
        description: binding ceiling on total_cost_cents, min of the tier cap and the funding source's available balance
      - name: scheduled_hours
        type: number
        source: computed
        description: sum of scheduled duration hours of CoachingSession rows with status == SCHEDULED
        default: 0
      - name: delivered_hours
        type: number
        source: computed
        description: sum of delivered_hours of CoachingSession rows with status == DELIVERED
        default: 0
      - name: remaining_hours
        type: number
        source: computed
        description: allocated_hours - scheduled_hours - delivered_hours
      - name: status
        type: enum
        source: system
        description: allocation state
        default: PROPOSED
        constraints: "one of {PROPOSED, ACTIVE, SUSPENDED, CLOSED, VOID}"

  - name: CoachingSession
    parent: CoachingAllocation
    common_fields: true
    fields:
      - name: coaching_allocation_id
        type: string
        source: input
        description: "FK -> CoachingAllocation.id"
      - name: scheduled_start
        type: datetime
        source: input
        description: start of the on-site coaching interval, inclusive
      - name: scheduled_end
        type: datetime
        source: input
        description: end of the on-site coaching interval, inclusive
      - name: scheduled_hours
        type: number
        source: computed
        description: (scheduled_end - scheduled_start) in hours, one decimal
      - name: delivered_hours
        type: number
        source: input
        description: hours actually delivered, supplied at completion
        constraints: "null before completion, else > 0 and <= scheduled_hours + 0.5"
      - name: iso_week_key
        type: string
        source: computed
        description: ISO year-week of scheduled_start, e.g. 2026-W38, the bucket of the weekly on-site cap
      - name: status
        type: enum
        source: system
        description: session state
        default: SCHEDULED
        constraints: "one of {SCHEDULED, DELIVERED, CANCELLED}"

  - name: SubsidyClaim
    parent: Provider
    common_fields: true
    fields:
      - name: provider_id
        type: string
        source: input
        description: "FK -> Provider.id"
      - name: rating_cycle_id
        type: string
        source: system
        description: "FK -> RatingCycle.id; the cycle whose validity window contains the first day of service_month"
      - name: service_month
        type: string
        source: input
        description: service month in YYYY-MM form
        constraints: "unique per (provider_id, service_month) among claims with status != REJECTED"
      - name: child_days
        type: object
        source: input
        description: map age band -> subsidised child-days, keys INFANT, TODDLER, PRESCHOOL
        constraints: "each value integer >= 0"
      - name: base_amount_cents
        type: integer
        source: computed
        description: unmultiplied reimbursement, sum over age bands of child_days * base daily rate
      - name: tier_multiplier_applied
        type: number
        source: computed
        description: effective multiplier used, single value for INTERIM, day-weighted for RECONCILED
        constraints: "1.00..1.50, four decimals"
      - name: reimbursement_cents
        type: integer
        source: computed
        description: output of calculations.subsidy_reimbursement for the applied variant
      - name: variant_applied
        type: enum
        source: system
        description: which calculation variant produced reimbursement_cents
        constraints: "null, INTERIM or RECONCILED"
      - name: status
        type: enum
        source: system
        description: claim state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, PAID, REJECTED, RECONCILE_REQUIRED}"
      - name: paid_on
        type: datetime
        source: system
        description: logical-clock date of payment

state_machines:
  - entity: Provider
    initial_state: APPLIED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: APPLIED
        to: ENROLLED
        trigger: "POST /providers/{provider_id}/enrollment-decisions with decision=APPROVE"
        actor: StateAdministrator
        preconditions:
          - "provider.status == APPLIED"
          - "provider.license_number is not held by any other Provider"
        side_effects:
          - "sets provider.enrolled_on to the logical clock date"
          - "recomputes provider.credential_compliance_pct via calculations.credential_compliance_pct"
      - from: APPLIED
        to: WITHDRAWN
        trigger: "POST /providers/{provider_id}/enrollment-decisions with decision=DENY"
        actor: StateAdministrator
        preconditions: ["provider.status == APPLIED"]
        side_effects: ["provider.current_tier stays null; provider.public_listing_visible stays false"]
      - from: ENROLLED
        to: ACTIVE
        trigger: "system: first RatingCycle for this provider reaches status ACTIVE"
        actor: system
        preconditions: ["provider.status == ENROLLED", "the cycle's awarded_tier is not null"]
        side_effects:
          - "sets provider.current_rating_cycle_id to that cycle id"
          - "sets provider.current_tier to that cycle's awarded_tier"
        note: "auto-transition; a provider is ACTIVE exactly when it holds an ACTIVE rating cycle"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /providers/{provider_id}/status-changes with action=SUSPEND"
        actor: StateAdministrator
        preconditions: ["provider.status == ACTIVE"]
        side_effects:
          - "sets the provider's ACTIVE cycle publication_status to SUPPRESSED and provider.public_listing_visible to false"
          - "cascade hop 2: every CoachingAllocation of this provider with status == ACTIVE becomes SUSPENDED"
          - "cascade hop 3: caused by each allocation becoming SUSPENDED, its CoachingSession rows with status == SCHEDULED become CANCELLED and their scheduled_hours return to allocation.remaining_hours"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /providers/{provider_id}/status-changes with action=REINSTATE"
        actor: StateAdministrator
        preconditions:
          - "provider.status == SUSPENDED"
          - "provider.current_rating_cycle_id is non-null and that cycle's status == ACTIVE"
        side_effects:
          - "restores that cycle publication_status to PUBLISHED when it had been PUBLISHED before suspension, else leaves UNPUBLISHED"
          - "SUSPENDED CoachingAllocation rows of this provider return to ACTIVE; previously CANCELLED sessions are NOT recreated"
        note: "cycle ACTIVE <-> SUSPENDED makes this machine cyclic"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /providers/{provider_id}/status-changes with action=WITHDRAW"
        actor: StateAdministrator
        preconditions: ["provider.status IN {ACTIVE, SUSPENDED}", "no SubsidyClaim of this provider has status IN {SUBMITTED, APPROVED, RECONCILE_REQUIRED}"]
        side_effects:
          - "all non-terminal RatingCycle rows of the provider become WITHDRAWN and publication_status WITHDRAWN"
          - "provider.current_rating_cycle_id and provider.current_tier become null"
      - from: SUSPENDED
        to: WITHDRAWN
        trigger: "POST /providers/{provider_id}/status-changes with action=WITHDRAW"
        actor: StateAdministrator
        preconditions: ["provider.status == SUSPENDED", "no SubsidyClaim of this provider has status IN {SUBMITTED, APPROVED, RECONCILE_REQUIRED}"]
        side_effects: ["same as the ACTIVE -> WITHDRAWN transition"]

  - entity: RatingCycle
    initial_state: DRAFT
    terminal_states: [EXPIRED, SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SELF_ASSESSMENT_SUBMITTED
        trigger: "POST /rating-cycles/{rating_cycle_id}/self-assessments"
        actor: Provider
        preconditions:
          - "cycle.status == DRAFT"
          - "no SelfAssessment already exists for this cycle"
          - "all 5 StandardDomain rows exist and their weight values sum to exactly 1.00"
        side_effects: ["creates SelfAssessment with status SUBMITTED and documented_domains derived from documentation"]
      - from: SELF_ASSESSMENT_SUBMITTED
        to: DOCS_VERIFIED
        trigger: "POST /self-assessments/{self_assessment_id}/verification-decisions with decision=APPROVE"
        actor: StateAdministrator
        preconditions:
          - "cycle.status == SELF_ASSESSMENT_SUBMITTED"
          - "self_assessment.status IN {SUBMITTED, RETURNED}"
          - "verified_points supplies every StandardDomain.domain_code and no value exceeds that domain's max_points"
          - "every domain_code whose verified value is > 0 appears in self_assessment.documented_domains"
        side_effects:
          - "self_assessment.status becomes VERIFIED and verified_on is stamped"
          - "cycle.domain_points is provisionally recomputed via calculations.domain_points_award variant PROVISIONAL"
      - from: DOCS_VERIFIED
        to: SELF_ASSESSMENT_SUBMITTED
        trigger: "POST /self-assessments/{self_assessment_id}/verification-decisions with decision=RETURN"
        actor: StateAdministrator
        preconditions: ["cycle.status IN {SELF_ASSESSMENT_SUBMITTED, DOCS_VERIFIED}", "self_assessment.return_count < 2"]
        side_effects:
          - "self_assessment.status becomes RETURNED, return_count increments by 1, verified_points is cleared to null"
          - "cycle.domain_points is cleared to an empty object"
        note: "revision loop; the third RETURN attempt is rejected with ERR_SELF_ASSESSMENT_RETURN_LIMIT"
      - from: DOCS_VERIFIED
        to: OBSERVATION_SCHEDULED
        trigger: "POST /rating-cycles/{rating_cycle_id}/observation-visits"
        actor: StateAdministrator
        preconditions:
          - "cycle.status == DOCS_VERIFIED"
          - "lead observer status == RELIABLE and reliability_certified_until >= window_start date"
          - "the requested window does not collide with the lead observer's other visits per validations priority 41"
        side_effects: ["creates ObservationVisit in SCHEDULED"]
      - from: OBSERVATION_SCHEDULED
        to: OBSERVATION_FINALIZED
        trigger: "POST /observation-visits/{observation_visit_id}/finalize"
        actor: StateAdministrator
        preconditions:
          - "cycle.status == OBSERVATION_SCHEDULED"
          - "the visit reaches FINALIZED in the same request"
        side_effects:
          - "cycle.observation_composite is set from visit.composite and cycle.reliability_pct from visit.reliability_pct"
          - "cycle.domain_points recomputed via calculations.domain_points_award variant FINAL"
      - from: OBSERVATION_SCHEDULED
        to: DOCS_VERIFIED
        trigger: "POST /observation-visits/{observation_visit_id}/cancel"
        actor: StateAdministrator
        preconditions: ["cycle.status == OBSERVATION_SCHEDULED", "the visit status IN {SCHEDULED, IN_PROGRESS}"]
        side_effects: ["visit becomes CANCELLED and releases its observer interval; cycle returns to DOCS_VERIFIED so a replacement visit can be scheduled"]
        note: "second revision loop, independent of the self-assessment loop"
      - from: OBSERVATION_FINALIZED
        to: AWARDED
        trigger: "POST /rating-cycles/{rating_cycle_id}/award"
        actor: StateAdministrator
        preconditions:
          - "cycle.status == OBSERVATION_FINALIZED"
          - "self_assessment.status == VERIFIED"
          - "provider.credential_compliance_pct satisfies the minimum for the tier implied by calculations.rating_tier_determination"
          - "every StaffCredential of the provider with employment_status == ACTIVE has registry_status IN {VERIFIED, EXPIRED} (none UNLINKED or PENDING)"
          - "no Appeal of this cycle has status IN {FILED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "runs calculations.rating_tier_determination writing weighted_total, block_clearance, highest_block_cleared, points_tier, awarded_tier and score_variant"
          - "runs calculations.validity_period writing effective_date, expires_on, validity_months and rerating_window_opens_on"
          - "stamps awarded_on and awarded_by_user_id from the X-User-ID header"
      - from: AWARDED
        to: ACTIVE
        trigger: "system: award transaction completes when effective_date <= logical clock date, otherwise the next POST /qris/expiry-runs at or after effective_date"
        actor: system
        preconditions: ["cycle.status == AWARDED", "logical clock date >= cycle.effective_date"]
        side_effects:
          - "any other RatingCycle of the provider with status == ACTIVE becomes SUPERSEDED, gets superseded_by_cycle_id set to this cycle, and publication_status WITHDRAWN"
          - "provider.current_rating_cycle_id and provider.current_tier are repointed at this cycle"
          - "caused by the provider tier change, every CoachingAllocation of the provider with status == ACTIVE has spend_cap_cents recomputed via calculations.coaching_allocation_cost"
      - from: ACTIVE
        to: UNDER_APPEAL
        trigger: "POST /rating-cycles/{rating_cycle_id}/appeals"
        actor: Provider
        preconditions:
          - "cycle.status IN {AWARDED, ACTIVE}"
          - "logical clock date <= cycle.awarded_on + 30 calendar days"
          - "no Appeal of this cycle has status IN {FILED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "cycle.publication_status becomes SUPPRESSED and provider.public_listing_visible becomes false"
          - "caused by the suppression, every SubsidyClaim of the provider with status == SUBMITTED whose service_month falls inside this cycle's validity window is held: adjudication is rejected with ERR_OPEN_APPEAL_BLOCKS_ACTION until the appeal terminates"
      - from: AWARDED
        to: UNDER_APPEAL
        trigger: "POST /rating-cycles/{rating_cycle_id}/appeals"
        actor: Provider
        preconditions: ["same as the ACTIVE -> UNDER_APPEAL transition"]
        side_effects: ["same as the ACTIVE -> UNDER_APPEAL transition"]
      - from: UNDER_APPEAL
        to: AWARDED
        trigger: "POST /appeals/{appeal_id}/review-actions with action=SUSTAIN"
        actor: AppealReviewer
        preconditions:
          - "cycle.status == UNDER_APPEAL"
          - "appeal.status == UNDER_REVIEW"
          - "the acting X-User-ID differs from cycle.awarded_by_user_id"
        side_effects:
          - "cascade hop 1: cycle.awarded_tier becomes appeal.adjusted_tier, appeal_adjusted becomes true, and calculations.validity_period reruns keeping the ORIGINAL effective_date"
          - "cascade hop 2: caused by the tier change, every SubsidyClaim of the provider with status == PAID whose service_month starts inside this cycle's validity window becomes RECONCILE_REQUIRED"
          - "cascade hop 3: caused by each claim becoming RECONCILE_REQUIRED, provider.reimbursement_adjustment_cents increases by the RECONCILED-minus-paid delta from calculations.subsidy_reimbursement"
          - "cycle.publication_status becomes UNPUBLISHED so a corrected snapshot must be republished"
        note: "cyclic: AWARDED -> UNDER_APPEAL -> AWARDED"
      - from: UNDER_APPEAL
        to: ACTIVE
        trigger: "POST /appeals/{appeal_id}/review-actions with action=DENY"
        actor: AppealReviewer
        preconditions: ["cycle.status == UNDER_APPEAL", "appeal.status == UNDER_REVIEW", "the acting X-User-ID differs from cycle.awarded_by_user_id"]
        side_effects:
          - "cycle.publication_status returns to PUBLISHED when published_at is non-null, else stays UNPUBLISHED"
          - "held SubsidyClaim rows of the provider become adjudicable again"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /qris/expiry-runs"
        actor: StateAdministrator
        preconditions: ["cycle.status == ACTIVE", "logical clock date > cycle.expires_on"]
        side_effects:
          - "cascade hop 1: cycle.publication_status becomes WITHDRAWN"
          - "cascade hop 2: caused by the cycle leaving ACTIVE, provider.current_rating_cycle_id and provider.current_tier become null and public_listing_visible becomes false"
          - "cascade hop 3: caused by the provider losing its tier, every CoachingAllocation of the provider with status == ACTIVE becomes SUSPENDED and every ImprovementGrant with status == OPEN becomes FROZEN"
          - "cascade hop 4: caused by each allocation becoming SUSPENDED, its CoachingSession rows with status == SCHEDULED become CANCELLED and their scheduled_hours return to remaining_hours; caused by each grant becoming FROZEN, its GrantExpenditure rows with status == SUBMITTED become VOIDED and their amount_cents return to available_cents"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a newer RatingCycle of the same provider reaches ACTIVE"
        actor: system
        preconditions: ["cycle.status == ACTIVE", "the newer cycle's supersedes_cycle_id == this cycle id"]
        side_effects: ["publication_status becomes WITHDRAWN; superseded_by_cycle_id is set to the newer cycle"]

  - entity: ObservationVisit
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system: first POST /observation-visits/{observation_visit_id}/scores accepted for this visit"
        actor: system
        preconditions: ["visit.status == SCHEDULED", "logical clock timestamp >= visit.window_start"]
        side_effects: ["records the first ObservationScore with attempt_no 1"]
      - from: IN_PROGRESS
        to: SCORES_ENTERED
        trigger: "system: the lead observer has a current ObservationScore for all 6 subscale codes"
        actor: system
        preconditions: ["visit.status == IN_PROGRESS"]
        side_effects: ["visit.composite recomputed via calculations.observation_composite_score"]
      - from: SCORES_ENTERED
        to: RELIABILITY_CHECK
        trigger: "system: the secondary observer has a current ObservationScore for all 6 subscale codes"
        actor: system
        preconditions: ["visit.status == SCORES_ENTERED", "visit.secondary_observer_id is non-null"]
        side_effects: ["visit.reliability_pct recomputed via calculations.inter_rater_reliability_pct"]
      - from: RELIABILITY_CHECK
        to: SCORES_ENTERED
        trigger: "POST /observation-visits/{observation_visit_id}/scores by either observer, replacing a subscale score"
        actor: Observer
        preconditions: ["visit.status == RELIABILITY_CHECK", "visit.rescore_count < 2"]
        side_effects:
          - "a new ObservationScore row is appended with attempt_no incremented and is_current true; the prior row's is_current becomes false"
          - "visit.rescore_count increments by 1; composite and reliability_pct are recomputed"
        note: "reliability rescore loop; the third rescore is rejected with ERR_RESCORE_LIMIT_EXCEEDED"
      - from: RELIABILITY_CHECK
        to: FINALIZED
        trigger: "POST /observation-visits/{observation_visit_id}/finalize"
        actor: StateAdministrator
        preconditions:
          - "visit.status == RELIABILITY_CHECK"
          - "visit.reliability_pct >= 83.33"
          - "both observers' status == RELIABLE and reliability_certified_until >= visit.window_start date"
        side_effects:
          - "stamps finalized_on; propagates composite and reliability_pct onto the parent RatingCycle and advances the cycle to OBSERVATION_FINALIZED"
        note: "branch A of the fork: reliability-checked path"
      - from: SCORES_ENTERED
        to: FINALIZED
        trigger: "POST /observation-visits/{observation_visit_id}/finalize"
        actor: StateAdministrator
        preconditions:
          - "visit.status == SCORES_ENTERED"
          - "visit.secondary_observer_id is null"
          - "the tier implied by the PROVISIONAL run of calculations.rating_tier_determination is <= 3"
          - "the lead observer's status == RELIABLE and reliability_certified_until >= visit.window_start date"
        side_effects:
          - "stamps finalized_on; sets visit.reliability_pct to null; advances the cycle to OBSERVATION_FINALIZED"
        note: "branch B of the fork: single-observer path, only legal below tier 4; the two branches carry different side-effect sets (reliability_pct set vs nulled)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /observation-visits/{observation_visit_id}/cancel"
        actor: StateAdministrator
        preconditions: ["visit.status IN {SCHEDULED, IN_PROGRESS}"]
        side_effects: ["releases the observer interval; parent cycle returns to DOCS_VERIFIED; existing ObservationScore rows all get is_current false"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /observation-visits/{observation_visit_id}/cancel"
        actor: StateAdministrator
        preconditions: ["visit.status == IN_PROGRESS"]
        side_effects: ["same as the SCHEDULED -> CANCELLED transition"]

  - entity: Appeal
    initial_state: FILED
    terminal_states: [SUSTAINED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{appeal_id}/review-actions with action=START"
        actor: AppealReviewer
        preconditions: ["appeal.status == FILED", "the acting X-User-ID differs from the cycle's awarded_by_user_id"]
        side_effects: ["stamps appeal.reviewer_user_id with the acting X-User-ID"]
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /appeals/{appeal_id}/review-actions with action=REQUEST_INFO"
        actor: AppealReviewer
        preconditions: ["appeal.status == UNDER_REVIEW", "appeal.info_request_count < 2", "the acting X-User-ID == appeal.reviewer_user_id"]
        side_effects: ["info_request_count increments by 1"]
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /appeals/{appeal_id}/provider-actions with action=RESPOND"
        actor: Provider
        preconditions: ["appeal.status == INFO_REQUESTED", "the acting X-User-ID == cycle.provider_id"]
        side_effects: ["appends the response narrative; no counter changes"]
        note: "negotiation loop UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW, at most 2 rounds"
      - from: UNDER_REVIEW
        to: SUSTAINED
        trigger: "POST /appeals/{appeal_id}/review-actions with action=SUSTAIN"
        actor: AppealReviewer
        preconditions:
          - "appeal.status == UNDER_REVIEW"
          - "adjusted_tier is supplied and differs from cycle.awarded_tier"
          - "adjusted_tier <= the block cap implied by cycle.highest_block_cleared, unless grounds == OBSERVER_RELIABILITY"
        side_effects:
          - "stamps decided_on; drives the RatingCycle UNDER_APPEAL -> AWARDED cascade (3 hops) declared on the RatingCycle machine"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /appeals/{appeal_id}/review-actions with action=DENY"
        actor: AppealReviewer
        preconditions: ["appeal.status == UNDER_REVIEW"]
        side_effects: ["stamps decided_on; drives the RatingCycle UNDER_APPEAL -> ACTIVE transition"]
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /appeals/{appeal_id}/provider-actions with action=WITHDRAW"
        actor: Provider
        preconditions: ["appeal.status IN {FILED, UNDER_REVIEW, INFO_REQUESTED}", "the acting X-User-ID == cycle.provider_id"]
        side_effects: ["stamps decided_on; the cycle returns from UNDER_APPEAL to ACTIVE with publication_status restored exactly as on DENY"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /appeals/{appeal_id}/provider-actions with action=WITHDRAW"
        actor: Provider
        preconditions: ["appeal.status == FILED", "the acting X-User-ID == cycle.provider_id"]
        side_effects: ["same as the INFO_REQUESTED -> WITHDRAWN transition"]

  - entity: DataDispute
    initial_state: FILED
    terminal_states: [CORRECTION_APPLIED, REJECTED, WITHDRAWN]
    transitions:
      - from: FILED
        to: TRIAGE
        trigger: "POST /data-disputes/{data_dispute_id}/triage-actions with action=OPEN_TRIAGE"
        actor: StateAdministrator
        preconditions: ["dispute.status == FILED", "cycle.publication_status == PUBLISHED"]
        side_effects: ["triage_round increments by 1"]
      - from: TRIAGE
        to: INFO_REQUESTED
        trigger: "POST /data-disputes/{data_dispute_id}/triage-actions with action=REQUEST_INFO"
        actor: StateAdministrator
        preconditions: ["dispute.status == TRIAGE"]
        side_effects: ["no counter changes"]
      - from: INFO_REQUESTED
        to: TRIAGE
        trigger: "POST /data-disputes/{data_dispute_id}/triage-actions with action=OPEN_TRIAGE"
        actor: StateAdministrator
        preconditions: ["dispute.status == INFO_REQUESTED", "dispute.triage_round < 3"]
        side_effects: ["triage_round increments by 1"]
      - from: TRIAGE
        to: ESCALATED
        trigger: "POST /data-disputes/{data_dispute_id}/triage-actions with action=ESCALATE"
        actor: StateAdministrator
        preconditions: ["dispute.status == TRIAGE", "dispute.disputed_field IN {PUBLISHED_TIER, PUBLISHED_SCORE, DOMAIN_POINTS}"]
        side_effects: ["no counter changes"]
      - from: ESCALATED
        to: TRIAGE
        trigger: "POST /data-disputes/{data_dispute_id}/triage-actions with action=OPEN_TRIAGE"
        actor: StateAdministrator
        preconditions: ["dispute.status == ESCALATED", "dispute.triage_round < 3"]
        side_effects: ["triage_round increments by 1"]
        note: "cyclic TRIAGE -> ESCALATED -> TRIAGE, capped at 3 triage rounds"
      - from: TRIAGE
        to: CORRECTION_APPLIED
        trigger: "POST /data-disputes/{data_dispute_id}/triage-actions with action=APPLY_CORRECTION"
        actor: StateAdministrator
        preconditions:
          - "dispute.status IN {TRIAGE, ESCALATED}"
          - "when disputed_field IN {PUBLISHED_TIER, PUBLISHED_SCORE}: an Appeal of the same cycle has status == SUSTAINED and its decided_on <= the logical clock date"
        side_effects:
          - "sets linked_appeal_id to that SUSTAINED appeal when the disputed field is PUBLISHED_TIER or PUBLISHED_SCORE"
          - "for LICENSED_CAPACITY and COUNTY_CODE writes claimed_value onto the Provider field and refreshes cycle.published_snapshot in place"
          - "stamps resolved_on"
      - from: ESCALATED
        to: CORRECTION_APPLIED
        trigger: "POST /data-disputes/{data_dispute_id}/triage-actions with action=APPLY_CORRECTION"
        actor: StateAdministrator
        preconditions: ["same as the TRIAGE -> CORRECTION_APPLIED transition"]
        side_effects: ["same as the TRIAGE -> CORRECTION_APPLIED transition"]
      - from: TRIAGE
        to: REJECTED
        trigger: "POST /data-disputes/{data_dispute_id}/triage-actions with action=REJECT"
        actor: StateAdministrator
        preconditions: ["dispute.status IN {TRIAGE, ESCALATED}"]
        side_effects: ["stamps resolved_on; published_snapshot unchanged"]
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /data-disputes/{data_dispute_id}/triage-actions with action=WITHDRAW"
        actor: Provider
        preconditions: ["dispute.status IN {FILED, TRIAGE, INFO_REQUESTED, ESCALATED}", "the acting X-User-ID == cycle.provider_id"]
        side_effects: ["stamps resolved_on"]

  - entity: ImprovementGrant
    initial_state: OFFERED
    terminal_states: [CLOSED, DECLINED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /improvement-grants/{improvement_grant_id}/accept with decision=ACCEPT"
        actor: Provider
        preconditions:
          - "grant.status == OFFERED"
          - "the acting X-User-ID == grant.provider_id"
          - "the funding cycle status == ACTIVE and its publication_status != WITHDRAWN"
        side_effects: ["available_cents is initialised to awarded_amount_cents; category_spend_cents initialised to zero for all four categories"]
      - from: ACCEPTED
        to: OPEN
        trigger: "system: acceptance completes when the logical clock date <= grant.spend_deadline"
        actor: system
        preconditions: ["grant.status == ACCEPTED", "logical clock date <= grant.spend_deadline"]
        side_effects: ["expenditure submission becomes permitted"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /improvement-grants/{improvement_grant_id}/accept with decision=DECLINE"
        actor: Provider
        preconditions: ["grant.status == OFFERED", "the acting X-User-ID == grant.provider_id"]
        side_effects: ["available_cents stays 0; any CoachingAllocation with funding_grant_id == this grant and status == PROPOSED becomes VOID"]
      - from: OPEN
        to: FROZEN
        trigger: "POST /qris/expiry-runs, or the RatingCycle ACTIVE -> EXPIRED cascade, or the logical clock date passing grant.spend_deadline"
        actor: system
        preconditions: ["grant.status == OPEN", "either the funding cycle is no longer ACTIVE or the logical clock date > grant.spend_deadline"]
        side_effects:
          - "GrantExpenditure rows with status == SUBMITTED become VOIDED and their amount_cents return to available_cents (committed_cents decreases by the same total)"
          - "CoachingAllocation rows funded by this grant with status == ACTIVE become SUSPENDED"
      - from: FROZEN
        to: OPEN
        trigger: "POST /improvement-grants/{improvement_grant_id}/accept with decision=REOPEN"
        actor: StateAdministrator
        preconditions: ["grant.status == FROZEN", "the funding cycle status == ACTIVE", "logical clock date <= grant.spend_deadline"]
        side_effects: ["expenditure submission is permitted again; VOIDED expenditures are not restored"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /improvement-grants/{improvement_grant_id}/close"
        actor: StateAdministrator
        preconditions: ["grant.status IN {OPEN, FROZEN}", "no GrantExpenditure of this grant has status == SUBMITTED"]
        side_effects:
          - "runs calculations.grant_compliance_recovery writing recovery_amount_cents"
          - "when recovery_amount_cents > 0 the compliance dimension moves COMPLIANT|UNDER_REVIEW -> FINDING_ISSUED -> RECOVERY and provider.reimbursement_adjustment_cents decreases by recovery_amount_cents"
          - "every CoachingAllocation funded by this grant with status IN {PROPOSED, ACTIVE, SUSPENDED} becomes CLOSED"
      - from: FROZEN
        to: CLOSED
        trigger: "POST /improvement-grants/{improvement_grant_id}/close"
        actor: StateAdministrator
        preconditions: ["same as the OPEN -> CLOSED transition"]
        side_effects: ["same as the OPEN -> CLOSED transition"]
    parallel_dimension:
      field: compliance_status
      initial_state: COMPLIANT
      terminal_states: [RECOVERY]
      note: "compliance_status evolves independently of status: a grant may be OPEN and FINDING_ISSUED, or CLOSED and COMPLIANT"
      transitions:
        - from: COMPLIANT
          to: UNDER_REVIEW
          trigger: "POST /grant-expenditures/{grant_expenditure_id}/adjudicate with decision=REJECT"
          actor: StateAdministrator
          preconditions: ["grant.compliance_status == COMPLIANT"]
          side_effects: ["no change to grant.status; the rejected expenditure's amount_cents returns to available_cents"]
        - from: UNDER_REVIEW
          to: FINDING_ISSUED
          trigger: "system: a second GrantExpenditure of this grant is REJECTED, or close finds recovery_amount_cents > 0"
          actor: system
          preconditions: ["grant.compliance_status == UNDER_REVIEW"]
          side_effects: ["expenditure submission is blocked with ERR_GRANT_COMPLIANCE_HOLD while FINDING_ISSUED"]
        - from: FINDING_ISSUED
          to: REMEDIATED
          trigger: "POST /improvement-grants/{improvement_grant_id}/accept with decision=REMEDIATE"
          actor: Provider
          preconditions: ["grant.compliance_status == FINDING_ISSUED", "the acting X-User-ID == grant.provider_id"]
          side_effects: ["expenditure submission is permitted again when grant.status == OPEN"]
        - from: REMEDIATED
          to: UNDER_REVIEW
          trigger: "POST /grant-expenditures/{grant_expenditure_id}/adjudicate with decision=REJECT"
          actor: StateAdministrator
          preconditions: ["grant.compliance_status == REMEDIATED"]
          side_effects: ["compliance dimension re-enters review; cyclic within the compliance axis"]
        - from: FINDING_ISSUED
          to: RECOVERY
          trigger: "POST /improvement-grants/{improvement_grant_id}/close with recovery_amount_cents > 0"
          actor: StateAdministrator
          preconditions: ["grant.compliance_status IN {FINDING_ISSUED, UNDER_REVIEW}", "grant.status transitions to CLOSED in the same request"]
          side_effects: ["provider.reimbursement_adjustment_cents decreases by recovery_amount_cents"]

  - entity: SubsidyClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /subsidy-claims/{subsidy_claim_id}/adjudicate with decision=APPROVE"
        actor: StateAdministrator
        preconditions:
          - "claim.status == SUBMITTED"
          - "claim.rating_cycle_id is non-null and that cycle's status == ACTIVE"
          - "that cycle's publication_status == PUBLISHED"
          - "no Appeal of that cycle has status IN {FILED, UNDER_REVIEW, INFO_REQUESTED}"
          - "the sum of claim.child_days values is > 0"
        side_effects: ["runs calculations.subsidy_reimbursement with the requested variant writing base_amount_cents, tier_multiplier_applied, reimbursement_cents and variant_applied"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /subsidy-claims/{subsidy_claim_id}/adjudicate with decision=REJECT"
        actor: StateAdministrator
        preconditions: ["claim.status IN {SUBMITTED, RECONCILE_REQUIRED}"]
        side_effects: ["reimbursement_cents becomes 0; the (provider_id, service_month) uniqueness slot is released"]
      - from: APPROVED
        to: PAID
        trigger: "POST /subsidy-claims/{subsidy_claim_id}/pay"
        actor: StateAdministrator
        preconditions: ["claim.status == APPROVED", "reimbursement_cents > 0", "provider.status == ACTIVE"]
        side_effects: ["stamps paid_on"]
      - from: PAID
        to: RECONCILE_REQUIRED
        trigger: "system: the RatingCycle UNDER_APPEAL -> AWARDED cascade hop 2"
        actor: system
        preconditions: ["claim.status == PAID", "the first day of claim.service_month lies inside the cycle's validity window"]
        side_effects: ["provider.reimbursement_adjustment_cents changes by the RECONCILED-minus-paid delta (cascade hop 3)"]
      - from: RECONCILE_REQUIRED
        to: PAID
        trigger: "POST /subsidy-claims/{subsidy_claim_id}/pay"
        actor: StateAdministrator
        preconditions:
          - "claim.status == RECONCILE_REQUIRED"
          - "provider.current_tier is not null"
          - "no Appeal of claim.rating_cycle_id has status IN {FILED, UNDER_REVIEW, INFO_REQUESTED}"
        side_effects:
          - "reimbursement_cents is rewritten by calculations.subsidy_reimbursement variant RECONCILED"
          - "provider.reimbursement_adjustment_cents returns to its pre-cascade value, so the paired cascade-plus-payment leaves the conserved quantity unchanged"

concurrency_rules:
  - rule_id: rating-cycle-create-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /providers/{provider_id}/rating-cycles"
    occ_field: "expected_provider_version"
    description: |
      Opening a RatingCycle against a Provider whose version has advanced since the
      client last read it is rejected. A newly opened cycle legitimately supersedes
      the provider's prior ACTIVE cycle once it reaches ACTIVE, so a second create
      carrying a stale expected_provider_version would otherwise silently discard a
      cycle another writer already attached to the same provider.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: expenditure-create-stale-grant
    parent_entity: ImprovementGrant
    write_endpoint: "POST /improvement-grants/{improvement_grant_id}/expenditures"
    occ_field: "expected_grant_version"
    description: |
      Submitting a GrantExpenditure against an ImprovementGrant whose version has
      advanced since the client last read it is rejected. Submission legitimately
      commits funds against available_cents and each category ceiling, so a stale
      expected_grant_version means the client's view of committed_cents and
      category_spend_cents no longer describes the balances the commit would consume.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: credential_compliance_pct
    trigger: "on every StaffCredential create or registry-link, on POST /providers/{provider_id}/enrollment-decisions, on POST /qris/expiry-runs, and immediately before calculations.domain_points_award"
    algorithm: aggregation
    formula: |
      MIN_LEVEL_BY_ROLE = { DIRECTOR: 4, LEAD_TEACHER: 3, ASSISTANT: 1 }
      qualifying_fte =
        sum of StaffCredential.fte over rows where
            provider_id == provider.id
        AND employment_status == ACTIVE
        AND registry_status == VERIFIED
        AND expires_on >= clock_date                       # inclusive
        AND credential_level >= MIN_LEVEL_BY_ROLE[role_type]
      raw_pct = 100 * qualifying_fte / provider.active_staff_fte
      credential_compliance_pct = min(100.00, round_half_up(raw_pct, 2))
    input_set: |
      Source entity StaffCredential filtered to registry_status == VERIFIED (UNLINKED,
      PENDING and EXPIRED rows contribute 0) and employment_status == ACTIVE
      (SEPARATED rows are excluded from the numerator but never from the denominator,
      which is always provider.active_staff_fte). Window: expires_on >= the logical
      clock date, inclusive boundary. Not order sensitive: a sum has no tie-break.
    constants:
      MIN_LEVEL_DIRECTOR: 4
      MIN_LEVEL_LEAD_TEACHER: 3
      MIN_LEVEL_ASSISTANT: 1
    precision: "2 decimal places, round_half_up, capped at 100.00"

  - name: observation_composite_score
    trigger: "on each accepted POST /observation-visits/{observation_visit_id}/scores once the lead observer holds 6 current subscale rows, and again on POST /observation-visits/{observation_visit_id}/finalize"
    algorithm: aggregation
    formula: |
      SUBSCALES = [SPACE_FURNISHINGS, PERSONAL_CARE, LANGUAGE_REASONING,
                   ACTIVITIES, INTERACTION, PROGRAM_STRUCTURE]
      current(observer, subscale) =
        the ObservationScore row for (visit.id, observer, subscale) with the highest
        attempt_no; when two rows share the highest attempt_no take the one with the
        later created_at
      lead_scores = [ current(visit.lead_observer_id, s).raw_score for s in SUBSCALES ]
      require len(lead_scores) == 6 else ERR_OBSERVATION_SCORES_INCOMPLETE
      composite = round_half_up(sum(lead_scores) / 6, 2)
    input_set: |
      Source entity ObservationScore filtered to observation_visit_id == visit.id,
      observer_id == visit.lead_observer_id, is_current == true. Secondary observer
      rows NEVER enter the composite. Selection window: highest attempt_no per
      subscale; tie-break created_at DESC.
    constants:
      SUBSCALE_COUNT: 6
    precision: "single rounding: the six raw_score values are summed unrounded and only the quotient is rounded to 2 decimals, round_half_up; per-subscale intermediate rounding is forbidden"

  - name: inter_rater_reliability_pct
    trigger: "on the ObservationVisit SCORES_ENTERED -> RELIABILITY_CHECK auto-transition and on every subsequent rescore"
    algorithm: threshold
    formula: |
      TOLERANCE = 1.0
      matched = count of s in SUBSCALES where
        abs(current(lead_observer_id, s).raw_score
            - current(secondary_observer_id, s).raw_score) <= TOLERANCE
      reliability_pct = round_half_up(100 * matched / 6, 2)
      admissible = reliability_pct >= IRR_MIN_PCT            # 83.33, inclusive
    input_set: |
      Requires 6 current rows for the lead observer AND 6 current rows for the
      secondary observer; fewer than 6 on either side is ERR_OBSERVATION_SCORES_INCOMPLETE.
      Reachable values are exactly {0.00, 16.67, 33.33, 50.00, 66.67, 83.33, 100.00}:
      5 matched subscales gives exactly 83.33 which PASSES the inclusive threshold,
      4 matched gives 66.67 which fails.
    constants:
      TOLERANCE: 1.0
      IRR_MIN_PCT: 83.33
    precision: "2 decimal places, round_half_up; comparison against IRR_MIN_PCT is >= (inclusive)"

  - name: domain_points_award
    trigger: "on POST /self-assessments/{self_assessment_id}/verification-decisions decision=APPROVE (PROVISIONAL), on the ObservationVisit -> FINALIZED transition (FINAL), on GET /rating-cycles/{rating_cycle_id}/score-preview, and inside POST /rating-cycles/{rating_cycle_id}/award"
    algorithm: weighted_scoring
    formula: |
      COMPOSITE_FRACTION(composite) =
        composite >= 6.00 -> 1.00 ; >= 5.00 -> 0.80 ; >= 4.00 -> 0.60 ;
        >= 3.00 -> 0.40 ; else 0.20
      CREDENTIAL_FRACTION(pct) =
        pct >= 95.00 -> 1.00 ; >= 85.00 -> 0.80 ; >= 70.00 -> 0.60 ;
        >= 55.00 -> 0.40 ; else 0.20
      for each StandardDomain d (all 5 required):
        submitted = (variant == FINAL) ? self_assessment.verified_points[d.domain_code]
                                      : self_assessment.claimed_points[d.domain_code]
        if d.observation_linked == true:
            if cycle.observation_composite is null:      # PROVISIONAL before finalization
                points[d] = submitted
            else:
                points[d] = round_half_up(COMPOSITE_FRACTION(cycle.observation_composite)
                                          * d.max_points, 0)
        else if d.domain_code == STAFF_QUALIFICATIONS:
            cap = round_half_up(CREDENTIAL_FRACTION(provider.credential_compliance_pct)
                                * d.max_points, 0)
            points[d] = min(submitted, cap)
        else:
            points[d] = submitted
      domain_points = points          # map domain_code -> integer
    input_set: |
      Source entities: the single SelfAssessment of the cycle (status VERIFIED for the
      FINAL variant, status IN {SUBMITTED, RETURNED, VERIFIED} for PROVISIONAL), all 5
      StandardDomain rows, and the parent Provider's credential_compliance_pct
      recomputed in the same request.
    constants:
      OBSERVATION_LINKED_DOMAIN: LEARNING_ENVIRONMENT
      CREDENTIAL_DERIVED_DOMAIN: STAFF_QUALIFICATIONS
    precision: "each domain's points are rounded to a whole integer with round_half_up before entering the weighted total"
    variants:
      - name: PROVISIONAL
        when: "GET /rating-cycles/{rating_cycle_id}/score-preview, and any award request whose score_variant input is PROVISIONAL"
        difference: "uses self_assessment.claimed_points and, when observation_composite is null, keeps the claimed points for the observation-linked domain instead of deriving them from the composite"
      - name: FINAL
        when: "POST /rating-cycles/{rating_cycle_id}/award with score_variant FINAL (the only variant permitted once the cycle is OBSERVATION_FINALIZED)"
        difference: "uses self_assessment.verified_points and always derives the observation-linked domain's points from cycle.observation_composite"

  - name: rating_tier_determination
    trigger: "POST /rating-cycles/{rating_cycle_id}/award and GET /rating-cycles/{rating_cycle_id}/score-preview"
    algorithm: threshold
    formula: |
      # step 1 - weighted total, ONE rounding at the very end
      weighted_total = round_half_up(
          sum over the 5 StandardDomain rows of
            (domain_points[d.domain_code] / d.max_points) * d.weight * 100
        , 2)
      # step 2 - points tier from the weighted total alone
      points_tier = weighted_total >= 85.00 -> 5 ; >= 70.00 -> 4 ; >= 55.00 -> 3 ;
                    >= 40.00 -> 2 ; else 1
      # step 3 - block gates, evaluated per block then folded sequentially
      for K in 1..3:
        block_clearance[K] = CLEARED iff for EVERY domain d with d.block_level == K:
              domain_points[d.domain_code] >= d.block_min_points
          AND ( d.observation_linked == false
                OR ( cycle.observation_composite is not null
                     AND cycle.observation_composite >= d.min_composite_for_block ) )
        else NOT_CLEARED
      highest_block_cleared = 0 if block_clearance[1] == NOT_CLEARED
                              else the largest K in 1..3 such that
                                   block_clearance[1..K] are all CLEARED
      # step 4 - the block cap, then the binding minimum
      awarded_tier = min(points_tier, BLOCK_CAP_TIER[highest_block_cleared])
    input_set: |
      Source: cycle.domain_points produced by calculations.domain_points_award in the
      same request (never a stale stored value), all 5 StandardDomain rows, and
      cycle.observation_composite. Block folding is sequential: block 3 CLEARED while
      block 2 is NOT_CLEARED still yields highest_block_cleared == 1.
    constants:
      BLOCK_CAP_TIER: { 0: 1, 1: 2, 2: 4, 3: 5 }
      TIER_5_MIN_WEIGHTED: 85.00
      TIER_4_MIN_WEIGHTED: 70.00
      TIER_3_MIN_WEIGHTED: 55.00
      TIER_2_MIN_WEIGHTED: 40.00
      MIN_COMPLIANCE_BY_TIER: { 1: 0.00, 2: 60.00, 3: 80.00, 4: 90.00, 5: 95.00 }
    precision: "weighted_total to 2 decimals round_half_up, rounded exactly once after the 5 per-domain terms are summed unrounded; tier comparisons are all >= (inclusive), so weighted_total 70.00 is tier 4 and 69.99 is tier 3"
    variants:
      - name: PROVISIONAL
        when: "GET /rating-cycles/{rating_cycle_id}/score-preview, or an award request with score_variant PROVISIONAL while the cycle is in DOCS_VERIFIED"
        difference: "consumes the PROVISIONAL domain_points_award output (claimed, not verified, points) and treats a null observation_composite as satisfying every min_composite_for_block gate, so the same stored data can produce a strictly higher awarded_tier than the FINAL run"
      - name: FINAL
        when: "POST /rating-cycles/{rating_cycle_id}/award with score_variant FINAL from OBSERVATION_FINALIZED"
        difference: "consumes the FINAL domain_points_award output and requires a non-null observation_composite to clear any observation-linked block, so an observation-linked block with composite below min_composite_for_block is NOT_CLEARED even when its points meet block_min_points"

  - name: validity_period
    trigger: "POST /rating-cycles/{rating_cycle_id}/award, and again on the Appeal UNDER_REVIEW -> SUSTAINED cascade hop 1"
    algorithm: interval_merge
    formula: |
      award_date = the logical clock date of the awarding request (UTC calendar date)
      # base case - a fresh award
      effective_date = first day of the month AFTER award_date, at 00:00:00.000Z
      # remand case - the appeal-adjusted rerun
      if cycle.appeal_adjusted == true:
          effective_date = the effective_date stored on this cycle by its ORIGINAL
                           award (unchanged by the appeal decision date)
      validity_months = (awarded_tier >= 4) ? 36 : 24
      expires_on = (effective_date plus validity_months calendar months)
                   minus 1 day, at 23:59:59.999Z
      rerating_window_opens_on = (expires_on date minus 90 calendar days) at 00:00:00.000Z
    input_set: |
      Uses only the awarding cycle's own fields plus the logical clock. effective_date
      is always the first day of a month, so month addition never needs day clamping.
      A RERATING cycle may only be opened when clock_date >= the currently ACTIVE
      cycle's rerating_window_opens_on.
    constants:
      BASE_VALIDITY_MONTHS: 24
      EXTENDED_VALIDITY_MONTHS: 36
      EXTENDED_MIN_TIER: 4
      RERATING_WINDOW_DAYS: 90
    precision: "whole calendar days; expires_on is INCLUSIVE (a cycle expires on the first expiry run whose clock date is strictly greater than expires_on)"

  - name: subsidy_reimbursement
    trigger: "POST /subsidy-claims/{subsidy_claim_id}/adjudicate decision=APPROVE, POST /subsidy-claims/{subsidy_claim_id}/pay from RECONCILE_REQUIRED, and the Appeal SUSTAINED cascade hop 3"
    algorithm: tiered_pricing
    formula: |
      BASE_DAILY_RATE_CENTS = { INFANT: 4500, TODDLER: 3800, PRESCHOOL: 3200 }
      TIER_MULTIPLIER       = { 1: 1.00, 2: 1.05, 3: 1.15, 4: 1.30, 5: 1.50 }
      REGION_FACTOR         = { URBAN: 1.00, RURAL: 1.08, FRONTIER: 1.15 }
      base_amount_cents = sum over band in [INFANT, TODDLER, PRESCHOOL] of
                          child_days[band] * BASE_DAILY_RATE_CENTS[band]
      # covering cycle for a calendar day d: the RatingCycle of this provider with
      # status IN {ACTIVE, SUPERSEDED, EXPIRED}, awarded_tier not null, and
      # effective_date <= d <= expires_on. When several match, take the one with the
      # greatest effective_date; if those tie, the one with the later created_at.
      # When none matches, tier_for_day(d) = 1 (base multiplier, unrated).
      if variant == INTERIM:
          m = TIER_MULTIPLIER[ tier_for_day(first calendar day of service_month) ]
          tier_multiplier_applied = round_half_up(m, 4)
      if variant == RECONCILED:
          D = number of calendar days in service_month
          tier_multiplier_applied = round_half_up(
              (sum over each day d in service_month of TIER_MULTIPLIER[tier_for_day(d)]) / D
            , 4)
      # per age band, rounded to whole cents BEFORE summing; the sum is NOT re-rounded
      for band in [INFANT, TODDLER, PRESCHOOL]:
          band_cents[band] = round_half_up( child_days[band]
                                            * BASE_DAILY_RATE_CENTS[band]
                                            * tier_multiplier_applied
                                            * REGION_FACTOR[provider.region_code] , 0)
      reimbursement_cents = sum of band_cents over the three bands
    input_set: |
      Source entity SubsidyClaim (one row) plus every RatingCycle of the same provider
      whose status IN {ACTIVE, SUPERSEDED, EXPIRED} and awarded_tier is not null;
      DRAFT..AWARDED, UNDER_APPEAL and WITHDRAWN cycles are excluded from
      tier_for_day. Window: the calendar days of service_month, both endpoints
      inclusive. RECONCILED weights strictly by calendar days, never by how
      child_days are distributed inside the month.
    constants:
      BASE_DAILY_RATE_INFANT_CENTS: 4500
      BASE_DAILY_RATE_TODDLER_CENTS: 3800
      BASE_DAILY_RATE_PRESCHOOL_CENTS: 3200
      TIER_MULTIPLIER: { 1: 1.00, 2: 1.05, 3: 1.15, 4: 1.30, 5: 1.50 }
      REGION_FACTOR: { URBAN: 1.00, RURAL: 1.08, FRONTIER: 1.15 }
    precision: "tier_multiplier_applied to 4 decimals round_half_up; each age-band amount rounded to whole cents round_half_up before summation; the final sum is never re-rounded"
    variants:
      - name: INTERIM
        when: "POST /subsidy-claims/{subsidy_claim_id}/adjudicate with variant INTERIM (the default at first approval)"
        difference: "one multiplier for the whole month, taken from the tier in effect on the first calendar day of service_month; a mid-month tier change is ignored"
      - name: RECONCILED
        when: "POST /subsidy-claims/{subsidy_claim_id}/adjudicate with variant RECONCILED, and mandatorily on any pay from RECONCILE_REQUIRED"
        difference: "day-weighted average multiplier across the month, so a tier change effective mid-month produces a different reimbursement_cents for identical child_days"

  - name: grant_reimbursement_waterfall
    trigger: "POST /improvement-grants/{improvement_grant_id}/reimburse"
    algorithm: waterfall_allocation
    formula: |
      MATCH_RATE           = { EQUIPMENT: 0.90, PROF_DEV: 1.00, FACILITY: 0.75, ADMIN: 0.50 }
      CATEGORY_CEILING_PCT = { EQUIPMENT: 0.40, PROF_DEV: 0.30, FACILITY: 0.25, ADMIN: 0.10 }
      ceiling_cents[c] = floor(grant.awarded_amount_cents * CATEGORY_CEILING_PCT[c])
      lines = GrantExpenditure rows of this grant with status == APPROVED,
              ordered by invoice_date ASC, then created_at ASC
      running_total = grant.reimbursed_cents
      running_cat[c] = grant.category_spend_cents[c] already reimbursed in category c
      for line in lines (in that order):
          gross = round_half_up(line.amount_cents * MATCH_RATE[line.category], 0)
          category_room = ceiling_cents[line.category] - running_cat[line.category]
          grant_room    = grant.awarded_amount_cents - running_total
          line.reimbursable_cents = max(0, min(gross, category_room, grant_room))
          line.disallowed_cents   = line.amount_cents - line.reimbursable_cents
          line.status = REIMBURSED
          running_total += line.reimbursable_cents
          running_cat[line.category] += line.reimbursable_cents
      grant.reimbursed_cents = running_total
      grant.committed_cents -= sum of amount_cents over the processed lines
      grant.available_cents = grant.awarded_amount_cents
                              - grant.committed_cents - grant.reimbursed_cents
    input_set: |
      Source entity GrantExpenditure filtered to status == APPROVED only; SUBMITTED,
      REJECTED and VOIDED lines are skipped and remain untouched. Order key
      invoice_date ASC with created_at ASC as the tie-break (identifiers are never
      consulted). Ceilings are cumulative across reimburse runs because running_cat
      starts from grant.category_spend_cents.
    constants:
      MATCH_RATE: { EQUIPMENT: 0.90, PROF_DEV: 1.00, FACILITY: 0.75, ADMIN: 0.50 }
      CATEGORY_CEILING_PCT: { EQUIPMENT: 0.40, PROF_DEV: 0.30, FACILITY: 0.25, ADMIN: 0.10 }
    precision: "PINNED ROUNDING ORDER: each line's gross is rounded to whole cents round_half_up BEFORE the three-way min(), and the per-line reimbursable values are then summed without any further rounding. Summing unrounded gross amounts first and rounding the total afterwards is forbidden and yields a different total."

  - name: coaching_allocation_cost
    trigger: "POST /providers/{provider_id}/coaching-allocations, and again on the RatingCycle AWARDED -> ACTIVE side effect that recomputes spend_cap_cents"
    algorithm: constraint_propagation
    formula: |
      ADMIN_FEE_RATE(base) = base < 50000 -> 0.12 ; base < 200000 -> 0.09 ; else 0.06
      TIER_SPEND_CAP_CENTS = { 1: 900000, 2: 750000, 3: 600000, 4: 400000, 5: 250000 }
      COACHING_HOURS_CAP   = { 1: 40.0, 2: 32.0, 3: 24.0, 4: 16.0, 5: 8.0 }
      effective_tier = provider.current_tier is null ? 1 : provider.current_tier
      # EVALUATION ORDER IS PINNED (step 1 then 2 then 3); the fee tier is keyed on
      # base_hours_cost_cents, NEVER on total_cost_cents, which does not exist yet.
      1) base_hours_cost_cents = round_half_up(allocated_hours * hourly_rate_cents, 0)
      2) admin_fee_cents = round_half_up(base_hours_cost_cents
                                        * ADMIN_FEE_RATE(base_hours_cost_cents), 0)
      3) total_cost_cents = base_hours_cost_cents + admin_fee_cents
      funding_balance = (funding_source == GRANT)
                        ? ImprovementGrant[funding_grant_id].available_cents
                        : STATE_BASE_CAP_CENTS
      spend_cap_cents = min(TIER_SPEND_CAP_CENTS[effective_tier], funding_balance)
      require allocated_hours <= COACHING_HOURS_CAP[effective_tier]
              else ERR_COACHING_HOURS_CAP_EXCEEDED
      require total_cost_cents <= spend_cap_cents
              else ERR_COACHING_SPEND_CAP_EXCEEDED
    input_set: |
      Source: the CoachingAllocation request body, the parent Provider's current_tier
      (null is treated as tier 1), and, when funding_source == GRANT, the linked
      ImprovementGrant's available_cents at request time. Lower tiers receive both a
      larger hours cap and a larger spend cap, so a tier increase can shrink
      spend_cap_cents below an existing allocation's total_cost_cents without
      changing that allocation's cost.
    constants:
      ADMIN_FEE_TIER_1_MAX_CENTS: 50000
      ADMIN_FEE_TIER_2_MAX_CENTS: 200000
      ADMIN_FEE_RATES: { SMALL: 0.12, MEDIUM: 0.09, LARGE: 0.06 }
      STATE_BASE_CAP_CENTS: 500000
      TIER_SPEND_CAP_CENTS: { 1: 900000, 2: 750000, 3: 600000, 4: 400000, 5: 250000 }
      COACHING_HOURS_CAP: { 1: 40.0, 2: 32.0, 3: 24.0, 4: 16.0, 5: 8.0 }
    precision: "whole cents, round_half_up at step 1 and step 2 independently; the ADMIN_FEE_RATE breakpoints are strict < on the upper bound (base 50000 falls in the 0.09 band, base 49999 in the 0.12 band)"

  - name: grant_compliance_recovery
    trigger: "POST /improvement-grants/{improvement_grant_id}/close"
    algorithm: aggregation
    formula: |
      PROF_DEV_MIN_SHARE = 0.25
      PENALTY_RATE = 0.50
      ineligible_date_cents =
        sum of reimbursable_cents over GrantExpenditure rows of this grant with
        status == REIMBURSED and invoice_date > grant.spend_deadline
      prof_dev_reimbursed_cents =
        sum of reimbursable_cents over GrantExpenditure rows of this grant with
        status == REIMBURSED and category == PROF_DEV
      required_prof_dev_cents = floor(grant.awarded_amount_cents * PROF_DEV_MIN_SHARE)
      shortfall = max(0, required_prof_dev_cents - prof_dev_reimbursed_cents)
      prof_dev_penalty_cents = round_half_up(shortfall * PENALTY_RATE, 0)
      recovery_amount_cents = ineligible_date_cents + prof_dev_penalty_cents
      # unspent available_cents is NEVER recovered: it was never disbursed, so the
      # invariant awarded_amount_cents == committed_cents + reimbursed_cents
      # + available_cents still holds after close.
    input_set: |
      Source entity GrantExpenditure filtered to status == REIMBURSED only (REJECTED
      and VOIDED lines contribute nothing, SUBMITTED lines block close entirely).
      Window: invoice_date strictly greater than grant.spend_deadline counts as
      ineligible; an invoice dated exactly on spend_deadline is eligible. Not order
      sensitive.
    constants:
      PROF_DEV_MIN_SHARE: 0.25
      PENALTY_RATE: 0.50
    precision: "whole cents; required_prof_dev_cents uses floor, the penalty uses round_half_up"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role is one of the six declared roles (FamilyViewer is the only role accepted without X-User-ID)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path-templated resource exists, validated left to right; provider_id first, then the nested resource"
    error_id: "ERR_PROVIDER_NOT_FOUND | ERR_RATING_ARTIFACT_NOT_FOUND | ERR_OBSERVER_NOT_FOUND | ERR_REMEDY_NOT_FOUND | ERR_FUNDING_NOT_FOUND | ERR_CREDENTIAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"
  - priority: 4
    category: auth
    check: "for entity_backed roles the acting X-User-ID equals the owning entity id: Provider acts only on resources whose provider_id (directly, or via rating_cycle_id -> RatingCycle.provider_id, self_assessment -> cycle -> provider, grant/allocation -> provider) equals X-User-ID; Observer submits scores only for a visit where X-User-ID equals lead_observer_id or secondary_observer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Provider-actor and Observer-actor endpoints"
  - priority: 5
    category: auth
    check: "segregation of duties: the AppealReviewer X-User-ID differs from the awarding cycle's awarded_by_user_id, and on any review action after START it equals appeal.reviewer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{appeal_id}/review-actions"
  - priority: 6
    category: business_constraint
    check: "request body schema: required fields present, enums in range, integers >= their declared minimum, raw_score in 1.0..7.0 in 0.5 steps, weights and fractions within bounds, service_month matches YYYY-MM, secondary_observer_id differs from lead_observer_id, child_days keys limited to INFANT/TODDLER/PRESCHOOL, claimed_points supplying all 5 domain_codes with no value above max_points"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST endpoints"
  - priority: 7
    category: existence
    check: "body foreign keys resolve: lead_observer_id and secondary_observer_id to Observer, rating_cycle_id to RatingCycle, funding_grant_id to ImprovementGrant"
    error_id: "ERR_OBSERVER_NOT_FOUND | ERR_RATING_ARTIFACT_NOT_FOUND | ERR_FUNDING_NOT_FOUND"
    http_status: 404
    applies_to: "POST /rating-cycles/{rating_cycle_id}/observation-visits, POST /providers/{provider_id}/improvement-grants, POST /providers/{provider_id}/coaching-allocations"
  - priority: 8
    category: state
    check: "OCC: expected_provider_version equals Provider.version, expected_grant_version equals ImprovementGrant.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /providers/{provider_id}/rating-cycles, POST /improvement-grants/{improvement_grant_id}/expenditures"
  - priority: 9
    category: business_constraint
    check: "uniqueness: Provider.license_number is globally unique; StandardDomain.domain_code is globally unique; StaffCredential.staff_registry_id is unique per provider_id; at most one SelfAssessment per rating_cycle_id"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /providers, POST /standard-domains, POST /providers/{provider_id}/staff-credentials, POST /rating-cycles/{rating_cycle_id}/self-assessments"
  - priority: 10
    category: state
    check: "the target resource is in a state from which this transition is declared in §1.2; each entity family raises its own error"
    error_id: "ERR_PROVIDER_STATE_INVALID | ERR_CYCLE_STATE_INVALID | ERR_VISIT_STATE_INVALID | ERR_APPEAL_STATE_INVALID | ERR_DISPUTE_STATE_INVALID | ERR_GRANT_NOT_OPEN | ERR_EXPENDITURE_STATE_INVALID | ERR_ALLOCATION_STATE_INVALID | ERR_SESSION_STATE_INVALID | ERR_CLAIM_STATE_INVALID"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 11
    category: state
    check: "the Provider owning the target resource has status == ACTIVE (or ENROLLED for a first rating cycle); SUSPENDED and WITHDRAWN providers may not open cycles, accept grants, schedule sessions, or submit claims"
    error_id: ERR_PROVIDER_STATE_INVALID
    http_status: 409
    applies_to: "POST /providers/{provider_id}/rating-cycles, POST /providers/{provider_id}/subsidy-claims, POST /improvement-grants/{improvement_grant_id}/accept, POST /coaching-allocations/{coaching_allocation_id}/sessions"
  - priority: 20
    category: business_safety
    check: "every observer named on a visit has status == RELIABLE and reliability_certified_until >= the window_start calendar date (inclusive); a LAPSED, RETIRED or PROVISIONAL observer, or one whose certification ends before the visit, is rejected both at scheduling and at finalization"
    error_id: ERR_OBSERVER_NOT_RELIABLE
    http_status: 422
    applies_to: "POST /rating-cycles/{rating_cycle_id}/observation-visits, POST /observation-visits/{observation_visit_id}/scores, POST /observation-visits/{observation_visit_id}/finalize"
  - priority: 21
    category: business_safety
    check: "a visit whose PROVISIONAL rating_tier_determination run implies points_tier >= 4 may not be finalized without a secondary_observer_id, because tier 4 and 5 awards require a reliability-checked observation"
    error_id: ERR_SECONDARY_OBSERVER_REQUIRED
    http_status: 422
    applies_to: "POST /observation-visits/{observation_visit_id}/finalize, POST /rating-cycles/{rating_cycle_id}/award"
  - priority: 22
    category: business_safety
    check: "visit.reliability_pct >= 83.33 (inclusive) when a secondary observer participated"
    error_id: ERR_RELIABILITY_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /observation-visits/{observation_visit_id}/finalize"
  - priority: 23
    category: business_safety
    check: "the lead observer has a current ObservationScore for all 6 subscale codes, and when secondary_observer_id is non-null the secondary observer has all 6 as well; an empty or partial score set blocks finalization"
    error_id: ERR_OBSERVATION_SCORES_INCOMPLETE
    http_status: 422
    applies_to: "POST /observation-visits/{observation_visit_id}/finalize"
  - priority: 24
    category: business_safety
    check: "visit.rescore_count < 2 when replacing a subscale score from RELIABILITY_CHECK"
    error_id: ERR_RESCORE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /observation-visits/{observation_visit_id}/scores"
  - priority: 25
    category: business_safety
    check: "the grant's compliance_status is not FINDING_ISSUED when submitting or adjudicating an expenditure; a finding must be REMEDIATED first"
    error_id: ERR_GRANT_COMPLIANCE_HOLD
    http_status: 409
    applies_to: "POST /improvement-grants/{improvement_grant_id}/expenditures, POST /grant-expenditures/{grant_expenditure_id}/adjudicate"
  - priority: 26
    category: business_referential
    check: "no StaffCredential of the provider with employment_status == ACTIVE has registry_status IN {UNLINKED, PENDING}; every active staff record must be resolved against the professional development registry before an award"
    error_id: ERR_CREDENTIAL_REGISTRY_UNLINKED
    http_status: 422
    applies_to: "POST /rating-cycles/{rating_cycle_id}/award"
  - priority: 27
    category: business_referential
    check: "provider.credential_compliance_pct >= MIN_COMPLIANCE_BY_TIER[awarded_tier] where awarded_tier is the value calculations.rating_tier_determination just produced (not points_tier)"
    error_id: ERR_CREDENTIAL_COMPLIANCE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /rating-cycles/{rating_cycle_id}/award"
  - priority: 28
    category: business_referential
    check: "the cycle's SelfAssessment exists and its status == VERIFIED"
    error_id: ERR_SELF_ASSESSMENT_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /rating-cycles/{rating_cycle_id}/award"
  - priority: 29
    category: business_referential
    check: "a dispute whose disputed_field IN {PUBLISHED_TIER, PUBLISHED_SCORE} may only reach CORRECTION_APPLIED when an Appeal of the same rating_cycle_id has status == SUSTAINED with decided_on <= the logical clock date"
    error_id: ERR_DISPUTE_REQUIRES_SUSTAINED_APPEAL
    http_status: 422
    applies_to: "POST /data-disputes/{data_dispute_id}/triage-actions"
  - priority: 30
    category: business_referential
    check: "every domain_code receiving verified_points > 0 appears in self_assessment.documented_domains"
    error_id: ERR_DOCUMENTATION_COVERAGE_GAP
    http_status: 422
    applies_to: "POST /self-assessments/{self_assessment_id}/verification-decisions"
  - priority: 40
    category: business_temporal
    check: "an appeal is filed within 30 calendar days of cycle.awarded_on, inclusive of day 30"
    error_id: ERR_APPEAL_FILING_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /rating-cycles/{rating_cycle_id}/appeals"
  - priority: 41
    category: business_temporal
    check: |
      Observer interval occupation, checked independently for lead_observer_id and
      secondary_observer_id. Intervals are HALF-OPEN [window_start, window_end):
      an existing visit ending exactly at the new window_start does NOT conflict.
      Candidate set: ObservationVisit rows with status IN {SCHEDULED, IN_PROGRESS,
      SCORES_ENTERED, RELIABILITY_CHECK, FINALIZED} naming that observer as lead or
      secondary (CANCELLED rows never conflict). On top of the geometric overlap, a
      48-hour cool-down buffer applies ONLY when the existing visit belongs to the
      same provider: reject when new window_start < existing window_end + 48 hours.
    error_id: ERR_OBSERVER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /rating-cycles/{rating_cycle_id}/observation-visits"
  - priority: 42
    category: business_temporal
    check: |
      Provider site occupation for coaching. Intervals are CLOSED
      [scheduled_start, scheduled_end]: two sessions that merely touch at an endpoint
      DO conflict. Candidate set: CoachingSession rows with status == SCHEDULED under
      any CoachingAllocation of the same provider_id that carries the same
      coach_user_id (DELIVERED and CANCELLED rows never conflict). Independently, an
      aggregate weekly capacity check: the sum of scheduled_hours over SCHEDULED plus
      delivered_hours over DELIVERED sessions of ALL the provider's allocations
      sharing the new session's iso_week_key, plus the new session's scheduled_hours,
      must not be strictly greater than provider.weekly_onsite_cap_hours.
    error_id: ERR_ONSITE_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /coaching-allocations/{coaching_allocation_id}/sessions"
  - priority: 43
    category: business_temporal
    check: "a RERATING cycle may only be opened when the logical clock date >= the provider's ACTIVE cycle rerating_window_opens_on; a REMAND cycle is exempt"
    error_id: ERR_RERATING_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /providers/{provider_id}/rating-cycles"
  - priority: 44
    category: business_temporal
    check: "publication requires the logical clock date >= cycle.awarded_on + 10 calendar days (the family-notice quiet period), inclusive of day 10"
    error_id: ERR_PUBLICATION_QUIET_PERIOD
    http_status: 422
    applies_to: "POST /rating-cycles/{rating_cycle_id}/publish"
  - priority: 45
    category: business_temporal
    check: "expenditure invoice_date <= grant.spend_deadline (inclusive) and the logical clock date <= grant.spend_deadline at submission time"
    error_id: ERR_GRANT_SPEND_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /improvement-grants/{improvement_grant_id}/expenditures"
  - priority: 46
    category: business_temporal
    check: "scheduled_start and scheduled_end both fall within [allocation.period_start, allocation.period_end] inclusive, and scheduled_end > scheduled_start"
    error_id: ERR_SESSION_OUTSIDE_ALLOCATION_PERIOD
    http_status: 422
    applies_to: "POST /coaching-allocations/{coaching_allocation_id}/sessions"
  - priority: 47
    category: business_temporal
    check: "at submission the claim resolves a rating_cycle_id whose validity window contains the first calendar day of service_month; when no cycle of the provider covers that day the claim is still accepted with rating_cycle_id null and tier 1 pricing, but approval is refused"
    error_id: ERR_CLAIM_MONTH_NOT_COVERED
    http_status: 422
    applies_to: "POST /subsidy-claims/{subsidy_claim_id}/adjudicate"
  - priority: 50
    category: business_constraint
    check: "the provider has no RatingCycle with status IN {DRAFT, SELF_ASSESSMENT_SUBMITTED, DOCS_VERIFIED, OBSERVATION_SCHEDULED, OBSERVATION_FINALIZED, AWARDED, UNDER_APPEAL} when opening a new cycle"
    error_id: ERR_ACTIVE_CYCLE_EXISTS
    http_status: 409
    applies_to: "POST /providers/{provider_id}/rating-cycles"
  - priority: 51
    category: business_constraint
    check: "no Appeal of the relevant cycle has status IN {FILED, UNDER_REVIEW, INFO_REQUESTED} when publishing the cycle, awarding it, or adjudicating a SubsidyClaim whose rating_cycle_id is that cycle"
    error_id: ERR_OPEN_APPEAL_BLOCKS_ACTION
    http_status: 409
    applies_to: "POST /rating-cycles/{rating_cycle_id}/publish, POST /rating-cycles/{rating_cycle_id}/award, POST /subsidy-claims/{subsidy_claim_id}/adjudicate"
  - priority: 52
    category: business_constraint
    check: "an award requires highest_block_cleared >= 1; when block 1 is NOT_CLEARED no rating may be issued at all, regardless of weighted_total"
    error_id: ERR_BLOCK_GATE_NOT_MET
    http_status: 422
    applies_to: "POST /rating-cycles/{rating_cycle_id}/award"
  - priority: 53
    category: business_constraint
    check: "no other SubsidyClaim exists for the same (provider_id, service_month) with status != REJECTED"
    error_id: ERR_DUPLICATE_CLAIM_PERIOD
    http_status: 409
    applies_to: "POST /providers/{provider_id}/subsidy-claims"
  - priority: 54
    category: business_constraint
    check: "self_assessment.return_count < 2 when the verification decision is RETURN"
    error_id: ERR_SELF_ASSESSMENT_RETURN_LIMIT
    http_status: 409
    applies_to: "POST /self-assessments/{self_assessment_id}/verification-decisions"
  - priority: 55
    category: business_constraint
    check: "appeal.info_request_count < 2 when the review action is REQUEST_INFO"
    error_id: ERR_APPEAL_INFO_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /appeals/{appeal_id}/review-actions"
  - priority: 56
    category: business_constraint
    check: "dispute.triage_round < 3 when re-entering TRIAGE from INFO_REQUESTED or ESCALATED"
    error_id: ERR_DISPUTE_TRIAGE_LIMIT
    http_status: 409
    applies_to: "POST /data-disputes/{data_dispute_id}/triage-actions"
  - priority: 57
    category: business_constraint
    check: "allocated_hours <= COACHING_HOURS_CAP[effective_tier] where effective_tier is provider.current_tier or 1 when null; and for a session, allocation.remaining_hours >= the new session's scheduled_hours"
    error_id: ERR_COACHING_HOURS_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /providers/{provider_id}/coaching-allocations, POST /coaching-allocations/{coaching_allocation_id}/sessions"
  - priority: 58
    category: business_constraint
    check: "the sum of the claim's child_days values is > 0 at approval; a claim whose three age bands are all zero cannot be approved"
    error_id: ERR_ZERO_SERVICE_UNITS
    http_status: 422
    applies_to: "POST /subsidy-claims/{subsidy_claim_id}/adjudicate"
  - priority: 60
    category: business_fiscal
    check: "for the submitted expenditure, category_spend_cents[category] + amount_cents <= floor(awarded_amount_cents * CATEGORY_CEILING_PCT[category]); the ceiling comparison is <= (a submission landing exactly on the ceiling is accepted)"
    error_id: ERR_GRANT_CATEGORY_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /improvement-grants/{improvement_grant_id}/expenditures"
  - priority: 61
    category: business_fiscal
    check: "amount_cents <= grant.available_cents; a submission consuming exactly the remaining available_cents is accepted and leaves available_cents at 0"
    error_id: ERR_GRANT_FUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /improvement-grants/{improvement_grant_id}/expenditures"
  - priority: 62
    category: business_fiscal
    check: "total_cost_cents <= spend_cap_cents from calculations.coaching_allocation_cost"
    error_id: ERR_COACHING_SPEND_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /providers/{provider_id}/coaching-allocations"
  - priority: 63
    category: business_fiscal
    check: "payment requires provider.current_tier to be non-null at payment time; an APPROVED claim whose provider lost its rating (expiry run, supersession or withdrawal) between approval and payment is refused rather than paid at the stale multiplier"
    error_id: ERR_PROVIDER_UNRATED
    http_status: 422
    applies_to: "POST /subsidy-claims/{subsidy_claim_id}/pay"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every date and window rule in this scaffold reads. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads that instant and MUST NOT fall back to real wall-clock time."
    roles: [StateAdministrator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "advances or rewinds the logical clock; performs no state transition and fires no cascade"
  - method: POST
    path: "/qris/expiry-runs"
    description: "Ops-run checkpoint: expire every ACTIVE RatingCycle past its expires_on, promote AWARDED cycles whose effective_date has arrived, freeze grants past spend_deadline, and refresh credential compliance."
    roles: [StateAdministrator]
    code: 200
    input: []
    output: null
    side_effects:
      - "AWARDED cycles with effective_date <= clock date advance to ACTIVE (superseding the prior ACTIVE cycle of the same provider)"
      - "ACTIVE cycles with clock date > expires_on advance to EXPIRED, running the 4-hop cascade declared on the RatingCycle machine"
      - "OPEN grants whose spend_deadline < clock date advance to FROZEN, voiding SUBMITTED expenditures"
      - "recomputes Provider.credential_compliance_pct for every provider via calculations.credential_compliance_pct"
  - method: POST
    path: "/standard-domains"
    description: "Declare one quality standard domain with its block level, point ceiling, block minimum and weight."
    roles: [StateAdministrator]
    code: 201
    input: [domain_code, block_level, max_points, block_min_points, weight, observation_linked, "min_composite_for_block?"]
    output: StandardDomain
    side_effects: ["none until a self-assessment is submitted; the 5 domain rows must exist with weights summing to 1.00 before any cycle accepts a self-assessment"]
  - method: GET
    path: "/standard-domains"
    description: "List declared standard domains."
    roles: [StateAdministrator, Provider, FamilyViewer]
    code: 200
    input: ["block_level?", "observation_linked?", "limit?", "offset?"]
    output: StandardDomain[]
    side_effects: []
  - method: POST
    path: "/providers"
    description: "Register a provider application."
    roles: [StateAdministrator]
    code: 201
    input: [legal_name, license_number, county_code, region_code, licensed_capacity, active_staff_fte, "weekly_onsite_cap_hours?"]
    output: Provider
    side_effects: ["creates the Provider in APPLIED with credential_compliance_pct 0, reimbursement_adjustment_cents 0, public_listing_visible false, version 1"]
  - method: GET
    path: "/providers"
    description: "List providers with filters."
    roles: [StateAdministrator, FamilyViewer]
    code: 200
    input: ["status?", "county_code?", "current_rating_cycle_id?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []
  - method: GET
    path: "/providers/{provider_id}"
    description: "Read one provider including computed compliance, tier and version."
    roles: [StateAdministrator, Provider, Coach, FamilyViewer]
    code: 200
    input: []
    output: Provider
    side_effects: []
  - method: POST
    path: "/providers/{provider_id}/enrollment-decisions"
    description: "Approve or deny a provider application."
    roles: [StateAdministrator]
    code: 200
    input: [decision]
    output: Provider
    side_effects:
      - "APPROVE: APPLIED -> ENROLLED, stamps enrolled_on, recomputes credential_compliance_pct"
      - "DENY: APPLIED -> WITHDRAWN"
      - "increments Provider.version by 1"
  - method: POST
    path: "/providers/{provider_id}/status-changes"
    description: "Suspend, reinstate or withdraw an enrolled provider."
    roles: [StateAdministrator]
    code: 200
    input: [action, "reason?"]
    output: Provider
    side_effects:
      - "SUSPEND: ACTIVE -> SUSPENDED with the 3-hop coaching cascade"
      - "REINSTATE: SUSPENDED -> ACTIVE restoring publication and un-suspending allocations"
      - "WITHDRAW: -> WITHDRAWN, withdrawing all non-terminal cycles"
      - "increments Provider.version by 1"
  - method: POST
    path: "/providers/{provider_id}/staff-credentials"
    description: "Register a staff member's professional development registry record; starts UNLINKED."
    roles: [Provider, StateAdministrator]
    code: 201
    input: [staff_registry_id, role_type, credential_level, fte, "employment_status?"]
    output: StaffCredential
    side_effects:
      - "creates StaffCredential with registry_status UNLINKED"
      - "recomputes Provider.credential_compliance_pct (an UNLINKED row adds nothing to the numerator) and increments Provider.version by 1"
  - method: GET
    path: "/staff-credentials"
    description: "List staff credential records, filterable by provider and registry linkage state."
    roles: [StateAdministrator, Provider]
    code: 200
    input: ["provider_id?", "registry_status?", "role_type?", "limit?", "offset?"]
    output: StaffCredential[]
    side_effects: []
  - method: POST
    path: "/staff-credentials/{credential_id}/registry-link"
    description: "Record the professional development registry's response for one staff credential."
    roles: [StateAdministrator]
    code: 200
    input: [registry_status, "verified_on?", "expires_on?", "credential_level?"]
    output: StaffCredential
    side_effects:
      - "writes registry_status, verified_on and expires_on (VERIFIED requires both dates)"
      - "recomputes Provider.credential_compliance_pct via calculations.credential_compliance_pct and increments Provider.version by 1"
  - method: GET
    path: "/providers/{provider_id}/credential-compliance"
    description: "Computed read of the provider's credential compliance breakdown."
    roles: [StateAdministrator, Provider]
    code: 200
    input: []
    output: Provider
    side_effects: ["recomputes and persists credential_compliance_pct before responding; increments Provider.version by 1 only when the value changed"]
  - method: POST
    path: "/providers/{provider_id}/rating-cycles"
    description: "Open a rating cycle (INITIAL, RERATING or REMAND) for the provider."
    roles: [Provider]
    code: 201
    input: [cycle_type, expected_provider_version]
    output: RatingCycle
    side_effects:
      - "creates RatingCycle in DRAFT with opened_on stamped from the logical clock"
      - "sets supersedes_cycle_id to the provider's current ACTIVE cycle id when one exists"
      - "increments Provider.version by 1"
  - method: GET
    path: "/rating-cycles"
    description: "List rating cycles with filters."
    roles: [StateAdministrator, Provider, AppealReviewer]
    code: 200
    input: ["provider_id?", "status?", "publication_status?", "superseded_by_cycle_id?", "supersedes_cycle_id?", "limit?", "offset?"]
    output: RatingCycle[]
    side_effects: []
  - method: GET
    path: "/rating-cycles/{rating_cycle_id}"
    description: "Read one rating cycle including domain_points, block_clearance, tier and validity fields."
    roles: [StateAdministrator, Provider, AppealReviewer, Observer]
    code: 200
    input: []
    output: RatingCycle
    side_effects: []
  - method: GET
    path: "/rating-cycles/{rating_cycle_id}/score-preview"
    description: "Computed read: run calculations.domain_points_award and calculations.rating_tier_determination in the requested variant without persisting an award."
    roles: [StateAdministrator, Provider]
    code: 200
    input: ["variant?"]
    output: RatingCycle
    side_effects: ["persists nothing; the returned RatingCycle representation carries the variant's weighted_total, block_clearance, highest_block_cleared, points_tier and awarded_tier as a projection"]
  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/self-assessments"
    description: "Submit the provider self-assessment with per-domain claimed points and documentation evidence."
    roles: [Provider]
    code: 201
    input: [claimed_points, documentation]
    output: SelfAssessment
    side_effects:
      - "creates SelfAssessment in SUBMITTED with documented_domains derived from documentation"
      - "advances the cycle DRAFT -> SELF_ASSESSMENT_SUBMITTED"
  - method: GET
    path: "/self-assessments"
    description: "List self-assessments, filterable by cycle."
    roles: [StateAdministrator, Provider, AppealReviewer]
    code: 200
    input: ["rating_cycle_id?", "status?", "limit?", "offset?"]
    output: SelfAssessment[]
    side_effects: []
  - method: POST
    path: "/self-assessments/{self_assessment_id}/verification-decisions"
    description: "State verification of submitted documentation: approve with verified per-domain points, or return for correction."
    roles: [StateAdministrator]
    code: 200
    input: [decision, "verified_points?", "note?"]
    output: SelfAssessment
    side_effects:
      - "APPROVE: status -> VERIFIED, stamps verified_on, cycle -> DOCS_VERIFIED, runs calculations.domain_points_award variant PROVISIONAL writing cycle.domain_points"
      - "RETURN: status -> RETURNED, return_count += 1, verified_points cleared, cycle -> SELF_ASSESSMENT_SUBMITTED, cycle.domain_points cleared"
  - method: POST
    path: "/observers"
    description: "Register a state observer certified on one environment rating tool; starts PROVISIONAL."
    roles: [StateAdministrator]
    code: 201
    input: [full_name, tool_code]
    output: Observer
    side_effects: ["creates Observer in PROVISIONAL with null anchor_agreement_pct and null reliability_certified_until"]
  - method: GET
    path: "/observers"
    description: "List observers and their reliability standing."
    roles: [StateAdministrator, Observer]
    code: 200
    input: ["status?", "tool_code?", "limit?", "offset?"]
    output: Observer[]
    side_effects: []
  - method: POST
    path: "/observers/{observer_id}/reliability-certifications"
    description: "Record an anchor reliability check outcome, lapse a certification, or retire an observer."
    roles: [StateAdministrator]
    code: 200
    input: [decision, "anchor_agreement_pct?", "certified_until?"]
    output: Observer
    side_effects:
      - "CERTIFY with anchor_agreement_pct >= 85.00: status -> RELIABLE, writes anchor_agreement_pct and reliability_certified_until"
      - "CERTIFY with anchor_agreement_pct < 85.00: status -> LAPSED, reliability_certified_until cleared to null"
      - "LAPSE: status -> LAPSED; RETIRE: status -> RETIRED (terminal, the observer may not be named on new visits)"
  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/observation-visits"
    description: "Schedule an on-site observation window with a lead observer and an optional reliability-check secondary observer."
    roles: [StateAdministrator]
    code: 201
    input: [lead_observer_id, "secondary_observer_id?", window_start, window_end]
    output: ObservationVisit
    side_effects:
      - "creates ObservationVisit in SCHEDULED after the priority-41 observer interval check (half-open interval plus 48-hour same-provider buffer)"
      - "advances the cycle DOCS_VERIFIED -> OBSERVATION_SCHEDULED"
  - method: GET
    path: "/observation-visits"
    description: "List observation visits, filterable by cycle or by either observer role."
    roles: [StateAdministrator, Observer, Provider, AppealReviewer]
    code: 200
    input: ["rating_cycle_id?", "lead_observer_id?", "secondary_observer_id?", "status?", "limit?", "offset?"]
    output: ObservationVisit[]
    side_effects: []
  - method: POST
    path: "/observation-visits/{observation_visit_id}/scores"
    description: "Submit or replace one subscale score for the acting observer; appends a new attempt row."
    roles: [Observer]
    code: 201
    input: [subscale_code, raw_score]
    output: ObservationScore
    side_effects:
      - "appends ObservationScore with attempt_no = prior max + 1 and is_current true; the prior row's is_current becomes false"
      - "first accepted score advances the visit SCHEDULED -> IN_PROGRESS"
      - "the sixth current lead-observer subscale advances IN_PROGRESS -> SCORES_ENTERED and recomputes visit.composite"
      - "the sixth current secondary-observer subscale advances SCORES_ENTERED -> RELIABILITY_CHECK and recomputes visit.reliability_pct"
      - "a submission from RELIABILITY_CHECK returns the visit to SCORES_ENTERED and increments rescore_count"
  - method: GET
    path: "/observation-scores"
    description: "List observation score attempts, filterable by visit, observer and currency."
    roles: [StateAdministrator, Observer, AppealReviewer]
    code: 200
    input: ["observation_visit_id?", "observer_id?", "subscale_code?", "is_current?", "limit?", "offset?"]
    output: ObservationScore[]
    side_effects: []
  - method: POST
    path: "/observation-visits/{observation_visit_id}/finalize"
    description: "Finalize an observation, admitting the composite (and the reliability percentage when a secondary observer participated) to the rating cycle."
    roles: [StateAdministrator]
    code: 200
    input: []
    output: ObservationVisit
    side_effects:
      - "runs calculations.observation_composite_score and, on the RELIABILITY_CHECK branch, calculations.inter_rater_reliability_pct"
      - "visit -> FINALIZED, stamps finalized_on; on the single-observer branch reliability_pct is set to null"
      - "cycle -> OBSERVATION_FINALIZED with observation_composite and reliability_pct propagated, then reruns calculations.domain_points_award variant FINAL"
  - method: POST
    path: "/observation-visits/{observation_visit_id}/cancel"
    description: "Cancel a scheduled or in-progress visit, releasing the observer interval."
    roles: [StateAdministrator]
    code: 200
    input: ["reason?"]
    output: ObservationVisit
    side_effects:
      - "visit -> CANCELLED, all its ObservationScore rows get is_current false"
      - "cycle returns OBSERVATION_SCHEDULED -> DOCS_VERIFIED so a replacement visit can be scheduled"
  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/award"
    description: "Issue the rating award: run point aggregation, block gates, tier capping and validity arithmetic."
    roles: [StateAdministrator]
    code: 200
    input: [score_variant]
    output: RatingCycle
    side_effects:
      - "runs calculations.credential_compliance_pct, calculations.domain_points_award, calculations.rating_tier_determination and calculations.validity_period"
      - "writes weighted_total, points_tier, block_clearance, highest_block_cleared, awarded_tier, score_variant, awarded_on, awarded_by_user_id, effective_date, expires_on, validity_months, rerating_window_opens_on"
      - "cycle OBSERVATION_FINALIZED -> AWARDED; when effective_date <= the logical clock date the cycle immediately continues to ACTIVE, superseding the prior ACTIVE cycle and repointing Provider.current_tier"
  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/publish"
    description: "Publish the award to the family-facing directory, freezing a published_snapshot."
    roles: [StateAdministrator]
    code: 200
    input: []
    output: RatingCycle
    side_effects:
      - "publication_status -> PUBLISHED, stamps published_at, writes published_snapshot {tier, weighted_total, domain_points, licensed_capacity, county_code}"
      - "sets Provider.public_listing_visible true and increments Provider.version by 1"
  - method: GET
    path: "/public/ratings"
    description: "Family-facing directory of published ratings."
    roles: [FamilyViewer, Provider, StateAdministrator]
    code: 200
    input: ["county_code?", "tier?", "limit?", "offset?"]
    output: RatingCycle[]
    side_effects: ["returns only cycles with publication_status == PUBLISHED, each carrying its published_snapshot"]
  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/appeals"
    description: "File a provider appeal against an issued award."
    roles: [Provider]
    code: 201
    input: [grounds, narrative]
    output: Appeal
    side_effects:
      - "creates Appeal in FILED, stamps filed_on"
      - "cycle -> UNDER_APPEAL, publication_status -> SUPPRESSED, Provider.public_listing_visible false, Provider.version += 1"
  - method: GET
    path: "/appeals"
    description: "List appeals with filters."
    roles: [StateAdministrator, AppealReviewer, Provider]
    code: 200
    input: ["rating_cycle_id?", "status?", "grounds?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
  - method: POST
    path: "/appeals/{appeal_id}/review-actions"
    description: "Reviewer action on an appeal: START, REQUEST_INFO, SUSTAIN or DENY."
    roles: [AppealReviewer]
    code: 200
    input: [action, "adjusted_tier?", "note?"]
    output: Appeal
    side_effects:
      - "START: FILED -> UNDER_REVIEW, stamps reviewer_user_id"
      - "REQUEST_INFO: -> INFO_REQUESTED, info_request_count += 1"
      - "SUSTAIN: -> SUSTAINED and drives the 3-hop cycle/claim/provider cascade, rerunning calculations.validity_period on the original effective_date"
      - "DENY: -> DENIED and returns the cycle to ACTIVE with publication restored"
  - method: POST
    path: "/appeals/{appeal_id}/provider-actions"
    description: "Provider action on its own appeal: RESPOND to an information request or WITHDRAW."
    roles: [Provider]
    code: 200
    input: [action, "narrative?"]
    output: Appeal
    side_effects:
      - "RESPOND: INFO_REQUESTED -> UNDER_REVIEW"
      - "WITHDRAW: -> WITHDRAWN, cycle returns to ACTIVE with publication restored exactly as on DENY"
  - method: POST
    path: "/rating-cycles/{rating_cycle_id}/data-disputes"
    description: "Provider dispute of a published data field."
    roles: [Provider]
    code: 201
    input: [disputed_field, claimed_value]
    output: DataDispute
    side_effects: ["creates DataDispute in FILED, stamps filed_on; publication is NOT suspended by a dispute"]
  - method: GET
    path: "/data-disputes"
    description: "List published-data disputes with filters."
    roles: [StateAdministrator, Provider]
    code: 200
    input: ["rating_cycle_id?", "linked_appeal_id?", "status?", "disputed_field?", "limit?", "offset?"]
    output: DataDispute[]
    side_effects: []
  - method: POST
    path: "/data-disputes/{data_dispute_id}/triage-actions"
    description: "Advance a dispute: OPEN_TRIAGE, REQUEST_INFO, ESCALATE, APPLY_CORRECTION, REJECT (state) or WITHDRAW (provider)."
    roles: [StateAdministrator, Provider]
    code: 200
    input: [action, "resolution_note?"]
    output: DataDispute
    side_effects:
      - "OPEN_TRIAGE: -> TRIAGE, triage_round += 1"
      - "APPLY_CORRECTION: -> CORRECTION_APPLIED, sets linked_appeal_id for tier/score corrections, rewrites Provider.licensed_capacity or county_code and refreshes cycle.published_snapshot for the other fields, stamps resolved_on"
      - "REJECT / WITHDRAW: terminal, stamps resolved_on, published_snapshot untouched"
  - method: POST
    path: "/providers/{provider_id}/improvement-grants"
    description: "Offer a quality improvement grant tied to an awarded rating cycle."
    roles: [StateAdministrator]
    code: 201
    input: [rating_cycle_id, awarded_amount_cents, spend_deadline]
    output: ImprovementGrant
    side_effects: ["creates ImprovementGrant in OFFERED with compliance_status COMPLIANT and all money counters 0"]
  - method: GET
    path: "/improvement-grants"
    description: "List improvement grants with filters."
    roles: [StateAdministrator, Provider, Coach]
    code: 200
    input: ["provider_id?", "rating_cycle_id?", "status?", "compliance_status?", "limit?", "offset?"]
    output: ImprovementGrant[]
    side_effects: []
  - method: POST
    path: "/improvement-grants/{improvement_grant_id}/accept"
    description: "Grant lifecycle decisions: ACCEPT or DECLINE an offer (Provider), REMEDIATE a compliance finding (Provider), or REOPEN a frozen grant (StateAdministrator)."
    roles: [Provider, StateAdministrator]
    code: 200
    input: [decision]
    output: ImprovementGrant
    side_effects:
      - "ACCEPT: OFFERED -> ACCEPTED then immediately -> OPEN when the clock date <= spend_deadline; available_cents := awarded_amount_cents"
      - "DECLINE: OFFERED -> DECLINED and VOIDs PROPOSED allocations funded by this grant"
      - "REMEDIATE: compliance_status FINDING_ISSUED -> REMEDIATED"
      - "REOPEN: FROZEN -> OPEN; increments ImprovementGrant.version by 1"
  - method: POST
    path: "/improvement-grants/{improvement_grant_id}/expenditures"
    description: "Submit an invoiced expenditure against the grant, committing funds under the category ceiling."
    roles: [Provider]
    code: 201
    input: [category, amount_cents, invoice_date, expected_grant_version]
    output: GrantExpenditure
    side_effects:
      - "creates GrantExpenditure in SUBMITTED"
      - "committed_cents += amount_cents, available_cents -= amount_cents, category_spend_cents[category] += amount_cents"
      - "increments ImprovementGrant.version by 1"
  - method: GET
    path: "/grant-expenditures"
    description: "List grant expenditure lines with filters."
    roles: [StateAdministrator, Provider]
    code: 200
    input: ["improvement_grant_id?", "status?", "category?", "limit?", "offset?"]
    output: GrantExpenditure[]
    side_effects: []
  - method: POST
    path: "/grant-expenditures/{grant_expenditure_id}/adjudicate"
    description: "Approve or reject a submitted expenditure line."
    roles: [StateAdministrator]
    code: 200
    input: [decision, "note?"]
    output: GrantExpenditure
    side_effects:
      - "APPROVE: SUBMITTED -> APPROVED; money counters unchanged (funds stay committed)"
      - "REJECT: SUBMITTED -> REJECTED; committed_cents -= amount_cents, available_cents += amount_cents, category_spend_cents[category] -= amount_cents, so the pair submit+reject leaves awarded_amount_cents == committed + reimbursed + available with zero drift"
      - "REJECT also advances the compliance dimension COMPLIANT -> UNDER_REVIEW (and UNDER_REVIEW -> FINDING_ISSUED on a second rejection)"
      - "increments ImprovementGrant.version by 1"
  - method: POST
    path: "/improvement-grants/{improvement_grant_id}/reimburse"
    description: "Run the reimbursement waterfall over all APPROVED expenditure lines."
    roles: [StateAdministrator]
    code: 200
    input: []
    output: ImprovementGrant
    side_effects:
      - "runs calculations.grant_reimbursement_waterfall writing each line's reimbursable_cents and disallowed_cents and setting them REIMBURSED"
      - "updates committed_cents, reimbursed_cents, available_cents and category_spend_cents; increments ImprovementGrant.version by 1"
  - method: POST
    path: "/improvement-grants/{improvement_grant_id}/close"
    description: "Close the grant and run the compliance recovery calculation."
    roles: [StateAdministrator]
    code: 200
    input: []
    output: ImprovementGrant
    side_effects:
      - "runs calculations.grant_compliance_recovery writing recovery_amount_cents"
      - "status -> CLOSED; when recovery_amount_cents > 0 compliance_status -> FINDING_ISSUED -> RECOVERY and Provider.reimbursement_adjustment_cents -= recovery_amount_cents"
      - "CoachingAllocation rows funded by this grant become CLOSED; increments ImprovementGrant.version and Provider.version by 1"
  - method: POST
    path: "/providers/{provider_id}/coaching-allocations"
    description: "Allocate coaching hours to a provider for a period, computing the administrative fee and the binding spend cap."
    roles: [StateAdministrator]
    code: 201
    input: [coach_user_id, funding_source, "funding_grant_id?", period_start, period_end, allocated_hours, hourly_rate_cents]
    output: CoachingAllocation
    side_effects:
      - "runs calculations.coaching_allocation_cost writing base_hours_cost_cents, admin_fee_cents, total_cost_cents and spend_cap_cents"
      - "creates CoachingAllocation in PROPOSED with scheduled_hours 0, delivered_hours 0, remaining_hours == allocated_hours"
  - method: GET
    path: "/coaching-allocations"
    description: "List coaching allocations with filters."
    roles: [StateAdministrator, Provider, Coach]
    code: 200
    input: ["provider_id?", "funding_grant_id?", "coach_user_id?", "status?", "limit?", "offset?"]
    output: CoachingAllocation[]
    side_effects: []
  - method: POST
    path: "/coaching-allocations/{coaching_allocation_id}/accept"
    description: "Provider accepts a proposed coaching allocation, making it schedulable."
    roles: [Provider]
    code: 200
    input: []
    output: CoachingAllocation
    side_effects: ["PROPOSED -> ACTIVE; when funding_source == GRANT the funding grant must be OPEN"]
  - method: POST
    path: "/coaching-allocations/{coaching_allocation_id}/sessions"
    description: "Schedule an on-site coaching session inside the allocation period."
    roles: [Coach]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: CoachingSession
    side_effects:
      - "creates CoachingSession in SCHEDULED after the priority-42 closed-interval and weekly aggregate capacity checks; computes scheduled_hours and iso_week_key"
      - "allocation.scheduled_hours += scheduled_hours and remaining_hours -= scheduled_hours"
  - method: GET
    path: "/coaching-sessions"
    description: "List coaching sessions with filters."
    roles: [StateAdministrator, Provider, Coach]
    code: 200
    input: ["coaching_allocation_id?", "status?", "iso_week_key?", "limit?", "offset?"]
    output: CoachingSession[]
    side_effects: []
  - method: POST
    path: "/coaching-sessions/{coaching_session_id}/complete"
    description: "Log delivered hours for a scheduled session."
    roles: [Coach]
    code: 200
    input: [delivered_hours]
    output: CoachingSession
    side_effects:
      - "SCHEDULED -> DELIVERED; allocation.scheduled_hours -= scheduled_hours, delivered_hours += delivered_hours, remaining_hours recomputed as allocated_hours - scheduled_hours - delivered_hours"
  - method: POST
    path: "/coaching-sessions/{coaching_session_id}/cancel"
    description: "Cancel a scheduled session, releasing its hours and its site interval."
    roles: [Coach, StateAdministrator]
    code: 200
    input: ["reason?"]
    output: CoachingSession
    side_effects:
      - "SCHEDULED -> CANCELLED; allocation.scheduled_hours -= scheduled_hours and remaining_hours += scheduled_hours, so schedule+cancel leaves allocated_hours == scheduled_hours + delivered_hours + remaining_hours with zero drift"
      - "frees the closed interval and the iso_week_key capacity consumed by the session"
  - method: POST
    path: "/providers/{provider_id}/subsidy-claims"
    description: "Submit a monthly subsidy reimbursement claim with child-days by age band."
    roles: [Provider]
    code: 201
    input: [service_month, child_days]
    output: SubsidyClaim
    side_effects:
      - "creates SubsidyClaim in SUBMITTED, computes base_amount_cents, and resolves rating_cycle_id to the cycle covering the first day of service_month (null when none covers it)"
  - method: GET
    path: "/subsidy-claims"
    description: "List subsidy claims with filters."
    roles: [StateAdministrator, Provider]
    code: 200
    input: ["provider_id?", "rating_cycle_id?", "status?", "service_month?", "limit?", "offset?"]
    output: SubsidyClaim[]
    side_effects: []
  - method: POST
    path: "/subsidy-claims/{subsidy_claim_id}/adjudicate"
    description: "Approve a claim under the INTERIM or RECONCILED variant, or reject it."
    roles: [StateAdministrator]
    code: 200
    input: [decision, "variant?"]
    output: SubsidyClaim
    side_effects:
      - "APPROVE: SUBMITTED -> APPROVED and runs calculations.subsidy_reimbursement writing tier_multiplier_applied, reimbursement_cents and variant_applied"
      - "REJECT: -> REJECTED, reimbursement_cents 0, releasing the (provider_id, service_month) uniqueness slot"
  - method: POST
    path: "/subsidy-claims/{subsidy_claim_id}/pay"
    description: "Pay an approved claim, or re-pay a claim held in RECONCILE_REQUIRED under the RECONCILED variant."
    roles: [StateAdministrator]
    code: 200
    input: []
    output: SubsidyClaim
    side_effects:
      - "APPROVED -> PAID, stamps paid_on"
      - "RECONCILE_REQUIRED -> PAID: reruns calculations.subsidy_reimbursement variant RECONCILED and returns Provider.reimbursement_adjustment_cents to its pre-cascade value"
  - method: GET
    path: "/self-assessments/{self_assessment_id}"
    description: "Read one self-assessment including claimed_points, verified_points and documented_domains."
    roles: [StateAdministrator, Provider, AppealReviewer]
    code: 200
    input: []
    output: SelfAssessment
    side_effects: []
  - method: GET
    path: "/staff-credentials/{credential_id}"
    description: "Read one staff credential registry record."
    roles: [StateAdministrator, Provider]
    code: 200
    input: []
    output: StaffCredential
    side_effects: []
  - method: GET
    path: "/observation-visits/{observation_visit_id}"
    description: "Read one observation visit including composite, reliability_pct and rescore_count."
    roles: [StateAdministrator, Observer, Provider, AppealReviewer]
    code: 200
    input: []
    output: ObservationVisit
    side_effects: []
  - method: GET
    path: "/observation-scores/{observation_score_id}"
    description: "Read one observation score attempt."
    roles: [StateAdministrator, Observer, AppealReviewer]
    code: 200
    input: []
    output: ObservationScore
    side_effects: []
  - method: GET
    path: "/appeals/{appeal_id}"
    description: "Read one appeal including info_request_count, reviewer_user_id and adjusted_tier."
    roles: [StateAdministrator, AppealReviewer, Provider]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/data-disputes/{data_dispute_id}"
    description: "Read one published-data dispute including triage_round and linked_appeal_id."
    roles: [StateAdministrator, Provider]
    code: 200
    input: []
    output: DataDispute
    side_effects: []
  - method: GET
    path: "/improvement-grants/{improvement_grant_id}"
    description: "Read one improvement grant including all money counters, both status dimensions and version."
    roles: [StateAdministrator, Provider, Coach]
    code: 200
    input: []
    output: ImprovementGrant
    side_effects: []
  - method: GET
    path: "/grant-expenditures/{grant_expenditure_id}"
    description: "Read one expenditure line including reimbursable_cents and disallowed_cents."
    roles: [StateAdministrator, Provider]
    code: 200
    input: []
    output: GrantExpenditure
    side_effects: []
  - method: GET
    path: "/coaching-allocations/{coaching_allocation_id}"
    description: "Read one coaching allocation including the cost breakdown and the hours ledger."
    roles: [StateAdministrator, Provider, Coach]
    code: 200
    input: []
    output: CoachingAllocation
    side_effects: []
  - method: GET
    path: "/coaching-sessions/{coaching_session_id}"
    description: "Read one coaching session including scheduled_hours, delivered_hours and iso_week_key."
    roles: [StateAdministrator, Provider, Coach]
    code: 200
    input: []
    output: CoachingSession
    side_effects: []
  - method: GET
    path: "/subsidy-claims/{subsidy_claim_id}"
    description: "Read one subsidy claim including base_amount_cents, tier_multiplier_applied, reimbursement_cents and variant_applied."
    roles: [StateAdministrator, Provider]
    code: 200
    input: []
    output: SubsidyClaim
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing or unrecognised, or X-User-ID missing for any role other than FamilyViewer"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource it does not own (Provider on another provider's cycle, grant, allocation or claim; Observer scoring a visit it is not named on)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the AppealReviewer X-User-ID equals the cycle's awarded_by_user_id, or a later review action is taken by a different reviewer than appeal.reviewer_user_id"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "provider_id in the path does not resolve"
  - id: ERR_RATING_ARTIFACT_NOT_FOUND
    http: 404
    condition: "rating_cycle_id, self_assessment_id or observation_visit_id does not resolve, in path or body"
  - id: ERR_OBSERVER_NOT_FOUND
    http: 404
    condition: "observer_id in the path or in lead_observer_id / secondary_observer_id does not resolve"
  - id: ERR_REMEDY_NOT_FOUND
    http: 404
    condition: "appeal_id or data_dispute_id does not resolve"
  - id: ERR_FUNDING_NOT_FOUND
    http: 404
    condition: "improvement_grant_id, grant_expenditure_id, coaching_allocation_id, coaching_session_id or subsidy_claim_id does not resolve"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "credential_id does not resolve"
  - id: ERR_VALIDATION
    http: 422
    condition: "request body fails schema, enum, range or shape checks (raw_score off the 0.5 grid, secondary_observer_id equal to lead_observer_id, claimed_points missing a domain_code or exceeding max_points, malformed service_month, unknown child_days key)"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "license_number, domain_code, (provider_id, staff_registry_id) or a second SelfAssessment on one cycle collides with an existing row"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_provider_version or expected_grant_version does not equal the parent's current version"
  - id: ERR_PROVIDER_STATE_INVALID
    http: 409
    condition: "the provider is not in a state permitting the requested operation (enrollment decision on a non-APPLIED provider, cycle or claim creation while SUSPENDED or WITHDRAWN, withdrawal while claims are outstanding)"
  - id: ERR_CYCLE_STATE_INVALID
    http: 409
    condition: "the rating cycle is not in a from-state declared for the requested transition (self-assessment on a non-DRAFT cycle, award before OBSERVATION_FINALIZED, publish on a non-AWARDED/ACTIVE cycle, appeal on an EXPIRED or SUPERSEDED cycle)"
  - id: ERR_VISIT_STATE_INVALID
    http: 409
    condition: "scoring a FINALIZED or CANCELLED visit, finalizing from SCHEDULED or IN_PROGRESS, or cancelling a terminal visit"
  - id: ERR_APPEAL_STATE_INVALID
    http: 409
    condition: "a review or provider action is not legal from the appeal's current status (RESPOND while UNDER_REVIEW, SUSTAIN from FILED, any action on a terminal appeal)"
  - id: ERR_DISPUTE_STATE_INVALID
    http: 409
    condition: "a triage action is not legal from the dispute's current status (APPLY_CORRECTION from FILED, ESCALATE from INFO_REQUESTED, any action on a resolved dispute)"
  - id: ERR_GRANT_NOT_OPEN
    http: 409
    condition: "an expenditure is submitted, reimbursed or reopened while the grant's status is not the required one (OFFERED, ACCEPTED, FROZEN, CLOSED or DECLINED instead of OPEN)"
  - id: ERR_EXPENDITURE_STATE_INVALID
    http: 409
    condition: "adjudicating an expenditure that is not SUBMITTED"
  - id: ERR_ALLOCATION_STATE_INVALID
    http: 409
    condition: "accepting a non-PROPOSED allocation, or scheduling a session on an allocation that is not ACTIVE"
  - id: ERR_SESSION_STATE_INVALID
    http: 409
    condition: "completing or cancelling a session that is not SCHEDULED"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "adjudicating a claim that is not SUBMITTED (or RECONCILE_REQUIRED for REJECT), or paying a claim that is neither APPROVED nor RECONCILE_REQUIRED"
  - id: ERR_OBSERVER_NOT_RELIABLE
    http: 422
    condition: "a named observer's status is not RELIABLE, or reliability_certified_until is earlier than the visit's window_start date"
  - id: ERR_SECONDARY_OBSERVER_REQUIRED
    http: 422
    condition: "a visit implying points_tier >= 4 is finalized or awarded without a secondary reliability-check observer"
  - id: ERR_RELIABILITY_BELOW_THRESHOLD
    http: 422
    condition: "visit.reliability_pct is below 83.33 at finalization"
  - id: ERR_OBSERVATION_SCORES_INCOMPLETE
    http: 422
    condition: "fewer than 6 current subscale scores exist for the lead observer, or for the secondary observer when one is named (includes the zero-score empty-set case)"
  - id: ERR_RESCORE_LIMIT_EXCEEDED
    http: 409
    condition: "a third rescore is submitted from RELIABILITY_CHECK (rescore_count already 2)"
  - id: ERR_GRANT_COMPLIANCE_HOLD
    http: 409
    condition: "an expenditure is submitted or adjudicated while the grant's compliance_status is FINDING_ISSUED"
  - id: ERR_CREDENTIAL_REGISTRY_UNLINKED
    http: 422
    condition: "an award is attempted while some ACTIVE staff credential is still UNLINKED or PENDING in the professional development registry"
  - id: ERR_CREDENTIAL_COMPLIANCE_BELOW_MINIMUM
    http: 422
    condition: "provider.credential_compliance_pct is below MIN_COMPLIANCE_BY_TIER for the tier the award would issue"
  - id: ERR_SELF_ASSESSMENT_NOT_VERIFIED
    http: 422
    condition: "an award is attempted while the cycle's self-assessment is missing, SUBMITTED or RETURNED"
  - id: ERR_DISPUTE_REQUIRES_SUSTAINED_APPEAL
    http: 422
    condition: "APPLY_CORRECTION on a PUBLISHED_TIER or PUBLISHED_SCORE dispute with no SUSTAINED appeal on the same cycle"
  - id: ERR_DOCUMENTATION_COVERAGE_GAP
    http: 422
    condition: "verification assigns points > 0 to a domain absent from the self-assessment's documented_domains"
  - id: ERR_APPEAL_FILING_WINDOW_CLOSED
    http: 422
    condition: "an appeal is filed more than 30 calendar days after awarded_on"
  - id: ERR_OBSERVER_SCHEDULE_CONFLICT
    http: 409
    condition: "the requested half-open window overlaps an existing non-CANCELLED visit of the same observer, or falls inside the 48-hour same-provider cool-down buffer"
  - id: ERR_ONSITE_CAPACITY_CONFLICT
    http: 409
    condition: "the requested closed coaching interval touches or overlaps another SCHEDULED session of the same coach at the same provider, or the ISO-week on-site hours would exceed provider.weekly_onsite_cap_hours"
  - id: ERR_RERATING_WINDOW_NOT_OPEN
    http: 422
    condition: "a RERATING cycle is opened before the ACTIVE cycle's rerating_window_opens_on"
  - id: ERR_PUBLICATION_QUIET_PERIOD
    http: 422
    condition: "publication is attempted fewer than 10 calendar days after awarded_on"
  - id: ERR_GRANT_SPEND_DEADLINE_PASSED
    http: 422
    condition: "invoice_date is after grant.spend_deadline, or the logical clock date has passed spend_deadline at submission"
  - id: ERR_SESSION_OUTSIDE_ALLOCATION_PERIOD
    http: 422
    condition: "a session interval falls outside [period_start, period_end] or has non-positive duration"
  - id: ERR_CLAIM_MONTH_NOT_COVERED
    http: 422
    condition: "approval is attempted for a claim whose rating_cycle_id is null because no cycle's validity window covers the first day of service_month"
  - id: ERR_ACTIVE_CYCLE_EXISTS
    http: 409
    condition: "a new cycle is opened while the provider already holds a cycle in a non-terminal, non-ACTIVE state"
  - id: ERR_OPEN_APPEAL_BLOCKS_ACTION
    http: 409
    condition: "publication, award or claim adjudication is attempted while an appeal on the relevant cycle is FILED, UNDER_REVIEW or INFO_REQUESTED"
  - id: ERR_BLOCK_GATE_NOT_MET
    http: 422
    condition: "an award is attempted with highest_block_cleared == 0"
  - id: ERR_DUPLICATE_CLAIM_PERIOD
    http: 409
    condition: "another non-REJECTED claim already exists for the same (provider_id, service_month)"
  - id: ERR_SELF_ASSESSMENT_RETURN_LIMIT
    http: 409
    condition: "a third RETURN decision is issued on the same self-assessment"
  - id: ERR_APPEAL_INFO_ROUND_LIMIT
    http: 409
    condition: "a third REQUEST_INFO action is taken on the same appeal"
  - id: ERR_DISPUTE_TRIAGE_LIMIT
    http: 409
    condition: "a fourth TRIAGE round is opened on the same dispute"
  - id: ERR_COACHING_HOURS_CAP_EXCEEDED
    http: 422
    condition: "allocated_hours exceeds COACHING_HOURS_CAP for the provider's effective tier, or a session's scheduled_hours exceeds allocation.remaining_hours"
  - id: ERR_ZERO_SERVICE_UNITS
    http: 422
    condition: "a claim whose child_days sum to exactly 0 is approved"
  - id: ERR_GRANT_CATEGORY_CEILING_EXCEEDED
    http: 422
    condition: "a submitted expenditure would push category_spend_cents above floor(awarded_amount_cents * CATEGORY_CEILING_PCT[category])"
  - id: ERR_GRANT_FUNDS_EXHAUSTED
    http: 422
    condition: "a submitted expenditure's amount_cents exceeds grant.available_cents"
  - id: ERR_COACHING_SPEND_CAP_EXCEEDED
    http: 422
    condition: "total_cost_cents exceeds spend_cap_cents at allocation time"
  - id: ERR_PROVIDER_UNRATED
    http: 422
    condition: "payment is attempted while provider.current_tier is null"

roles:
  - name: StateAdministrator
    description: "State QRIS agency staff: configure standards, run enrollment, verify documentation, schedule and finalize observations, issue and publish awards, administer grants, allocate coaching, adjudicate claims, and drive the logical clock and expiry runs."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /qris/expiry-runs"
      - "POST /standard-domains"
      - "POST /providers"
      - "POST /providers/{provider_id}/enrollment-decisions"
      - "POST /providers/{provider_id}/status-changes"
      - "POST /staff-credentials/{credential_id}/registry-link"
      - "POST /self-assessments/{self_assessment_id}/verification-decisions"
      - "POST /observers"
      - "POST /observers/{observer_id}/reliability-certifications"
      - "POST /rating-cycles/{rating_cycle_id}/observation-visits"
      - "POST /observation-visits/{observation_visit_id}/finalize"
      - "POST /observation-visits/{observation_visit_id}/cancel"
      - "POST /rating-cycles/{rating_cycle_id}/award"
      - "POST /rating-cycles/{rating_cycle_id}/publish"
      - "POST /providers/{provider_id}/improvement-grants"
      - "POST /grant-expenditures/{grant_expenditure_id}/adjudicate"
      - "POST /improvement-grants/{improvement_grant_id}/reimburse"
      - "POST /improvement-grants/{improvement_grant_id}/close"
      - "POST /providers/{provider_id}/coaching-allocations"
      - "POST /subsidy-claims/{subsidy_claim_id}/adjudicate"
      - "POST /subsidy-claims/{subsidy_claim_id}/pay"
    shared_operations:
      - "POST /providers/{provider_id}/staff-credentials (with Provider)"
      - "POST /improvement-grants/{improvement_grant_id}/accept (REOPEN only; Provider owns ACCEPT, DECLINE, REMEDIATE)"
      - "POST /data-disputes/{data_dispute_id}/triage-actions (all actions except WITHDRAW, which is the Provider's)"
      - "POST /coaching-sessions/{coaching_session_id}/cancel (with Coach)"
      - "all GET endpoints except that GET /providers/{provider_id}/credential-compliance is shared only with Provider"
    note: "May NOT take appeal review actions: awarding and appeal adjudication are segregated duties (validations priority 5)."
  - name: Provider
    description: "Licensed child care provider: submits self-assessments and documentation, registers staff credentials, opens rating cycles, files appeals and published-data disputes, accepts grants and allocations, submits expenditures and subsidy claims."
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /providers/{provider_id}/rating-cycles"
      - "POST /rating-cycles/{rating_cycle_id}/self-assessments"
      - "POST /rating-cycles/{rating_cycle_id}/appeals"
      - "POST /appeals/{appeal_id}/provider-actions"
      - "POST /rating-cycles/{rating_cycle_id}/data-disputes"
      - "POST /improvement-grants/{improvement_grant_id}/expenditures"
      - "POST /coaching-allocations/{coaching_allocation_id}/accept"
      - "POST /providers/{provider_id}/subsidy-claims"
    shared_operations:
      - "POST /providers/{provider_id}/staff-credentials (with StateAdministrator)"
      - "POST /improvement-grants/{improvement_grant_id}/accept (ACCEPT, DECLINE, REMEDIATE)"
      - "POST /data-disputes/{data_dispute_id}/triage-actions (WITHDRAW only)"
      - "GET /providers/{provider_id}, GET /providers/{provider_id}/credential-compliance, GET /standard-domains, GET /rating-cycles, GET /rating-cycles/{rating_cycle_id}, GET /rating-cycles/{rating_cycle_id}/score-preview, GET /self-assessments, GET /staff-credentials, GET /observation-visits, GET /appeals, GET /data-disputes, GET /improvement-grants, GET /grant-expenditures, GET /coaching-allocations, GET /coaching-sessions, GET /subsidy-claims, GET /public/ratings"
    note: "X-User-ID is the Provider.id; every write is checked against the resource's provider_id (directly or through rating_cycle_id) by validations priority 4."
  - name: Observer
    description: "State-certified environment rating tool observer who conducts on-site observations and enters subscale scores."
    identity: "entity_backed:Observer"
    exclusive_operations:
      - "POST /observation-visits/{observation_visit_id}/scores"
    shared_operations:
      - "GET /observers, GET /observation-visits, GET /observation-scores, GET /rating-cycles/{rating_cycle_id}"
    note: "X-User-ID is the Observer.id and must equal the visit's lead_observer_id or secondary_observer_id; observers can never finalize their own visit, which only StateAdministrator may do."
  - name: Coach
    description: "Quality improvement coach who schedules and delivers on-site coaching sessions against an allocation."
    identity: "opaque"
    exclusive_operations:
      - "POST /coaching-allocations/{coaching_allocation_id}/sessions"
      - "POST /coaching-sessions/{coaching_session_id}/complete"
    shared_operations:
      - "POST /coaching-sessions/{coaching_session_id}/cancel (with StateAdministrator)"
      - "GET /coaching-allocations, GET /coaching-sessions, GET /improvement-grants, GET /providers/{provider_id}"
    note: "X-User-ID is an operator id stored on CoachingAllocation.coach_user_id; it is never an entity id, and session writes require it to equal the allocation's coach_user_id."
  - name: AppealReviewer
    description: "Independent hearing officer who reviews and decides provider appeals of issued awards."
    identity: "opaque"
    exclusive_operations:
      - "POST /appeals/{appeal_id}/review-actions"
    shared_operations:
      - "GET /appeals, GET /rating-cycles, GET /rating-cycles/{rating_cycle_id}, GET /self-assessments, GET /observation-visits, GET /observation-scores"
    note: "Segregation of duties: the acting X-User-ID must differ from the cycle's awarded_by_user_id, and after START must equal appeal.reviewer_user_id."
  - name: FamilyViewer
    description: "Public family-facing consumer of published ratings; the only role accepted without an X-User-ID header."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /public/ratings, GET /providers, GET /providers/{provider_id}, GET /standard-domains"
    note: "Reads only cycles whose publication_status == PUBLISHED through GET /public/ratings; never sees SUPPRESSED, UNPUBLISHED or WITHDRAWN snapshots."

