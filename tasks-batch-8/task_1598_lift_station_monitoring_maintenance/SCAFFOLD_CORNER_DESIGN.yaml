              as: UtilityAdmin
              captures: { op_a: $.data.id }
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-0602B", full_name: "OpB", certifications: ["CSE_1", "COLLECTIONS_2"], home_zone: "Z9" }
              as: UtilityAdmin
              captures: { op_b: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "MINOR", alarm_code: "HI_LEVEL", raised_at: "2026-08-01T00:00:00Z", is_sso_related: false }
              as: ScadaWebhook
              captures: { tk_id: $.data.id, tk_v: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/ack"
              payload: {}
              as: OnCallOperator
            - call: "GET /lift-station-ops/alarm-tickets/${tk_id}"
              payload: {}
              as: OnCallOperator
              captures: { tk_v2: $.data.version }
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/dispatch"
              payload: { expected_ticket_version: "${tk_v2}" }
              as: OnCallOperator
          trigger:
            - call: "POST /lift-station-ops/alarm-tickets/${tk_id}/arrive"
              payload: {}
              as: Operator
              as_user_id: "${op_b}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHORIZED OR err == ERR_INVALID_STATE (ownership check)"


  # ==========================================================================
  # Section: cross_cutting_layers — OCC, cascading, dual-variant, scheduled actions, rate thresholds
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_sso_create_stale_station_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[sso-event-create-stale-station]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Create SsoEvent with stale expected_station_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Station created at version 1; another mutation advances it to 2"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0700", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /lift-station-ops/stations/${st_id}/alarm-tickets"
              payload: { alarm_class: "INFO", alarm_code: "TEST", raised_at: "2026-08-01T00:00:00Z", is_sso_related: false }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/stations/${st_id}/sso-events"
              payload: { started_at: "2026-08-01T00:00:00Z", cause_code: "GREASE_BLOCKAGE", reached_surface_water: false, expected_station_version: "${st_v}" }
              as: UtilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

      - name: occ_capital_plan_approve_stale
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[capital-plan-approve-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Approve plan with stale expected_plan_version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Plan ranked; version captured before rank; approve attempts with stale version"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0701", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: true, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/capital-plans"
              payload: { plan_year: 2036, budget_total_usd: 100000 }
              as: CapitalProgramManager
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /lift-station-ops/capital-projects"
              payload: { plan_id: "${plan_id}", station_id: "${st_id}", project_name: "A", estimated_cost_usd: 5000, consequence_of_failure: 5, likelihood_of_failure: 5 }
              as: CapitalProgramManager
            - call: "POST /lift-station-ops/capital-plans/${plan_id}/rank"
              payload: {}
              as: CapitalProgramManager
          trigger:
            - call: "POST /lift-station-ops/capital-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v}" }
              as: UtilityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (plan version advanced by rank; literal capture from before rank is now stale)"

      - name: sso_create_cascades_abort_generator_test
        claim_type: cascading_side_effects
        grounds: ["state_machines.LiftStation.NORMAL_to_EMERGENCY", "state_machines.GeneratorTest"]
        distinguishing_aspect: "SsoEvent create cascades: station posture -> EMERGENCY, SCHEDULED generator tests -> ABORTED."
        test_recipe:
          setup: ["Station with SCHEDULED generator test"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0702", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: true, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id, st_v: $.data.version }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations/${st_id}/generator-tests"
              payload: { scheduled_for: "2026-08-05T00:00:00Z", test_kind: "NO_LOAD", load_percent: 0 }
              as: MaintenancePlanner
              captures: { gt_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/stations/${st_id}/sso-events"
              payload: { started_at: "2026-08-01T00:00:00Z", cause_code: "PUMP_FAILURE", reached_surface_water: false, expected_station_version: "${st_v}" }
              as: UtilityAdmin
            - call: "GET /lift-station-ops/generator-tests/${gt_id}"
              payload: {}
              as: UtilityAdmin
              captures: { gt_status: $.data.status }
          assert:
            - "gt_status == ABORTED"

      - name: freeze_station_cascades_cancel_cleanings
        claim_type: cascading_side_effects
        grounds: ["state_machines.LiftStation.NORMAL_to_FROZEN", "state_machines.WetWellCleaning"]
        distinguishing_aspect: "Station freeze cascades: SCHEDULED cleanings -> CANCELLED."
        test_recipe:
          setup: ["Station with SCHEDULED cleaning"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0703", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 150, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/operators"
              payload: { employee_code: "OP-0703", full_name: "Lead", certifications: ["CSE_1"], home_zone: "Z1" }
              as: UtilityAdmin
              captures: { op_id: $.data.id }
            - call: "POST /lift-station-ops/stations/${st_id}/wet-well-cleanings"
              payload: { scheduled_for: "2026-08-10T00:00:00Z", grease_depth_inches_pre: 4.0, crew_lead_operator_id: "${op_id}", requires_confined_space_entry: false }
              as: MaintenancePlanner
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /lift-station-ops/stations/${st_id}/freeze"
              payload: {}
              as: UtilityAdmin
            - call: "GET /lift-station-ops/wet-well-cleanings/${cl_id}"
              payload: {}
              as: UtilityAdmin
              captures: { cl_status: $.data.status }
          assert:
            - "cl_status == CANCELLED"

      - name: clock_default_2026_08_01
        claim_type: scheduled_actions
        grounds: ["endpoints"]
        distinguishing_aspect: "Server logical clock defaults to 2026-08-01T00:00:00Z before any set_current_utc call."
        test_recipe:
          setup: ["Empty DB; no clock set"]
          setup_api_calls: []
          trigger:
            - call: "POST /lift-station-ops/_clock/tick"
              payload: {}
              as: UtilityAdmin
          assert:
            - "tick executes without error against default clock 2026-08-01T00:00:00Z"

  # ==========================================================================
  # Section: consistency_model — immediate consistency
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: response_reflects_writes_immediately
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "After a POST that mutates state, the very next GET returns the updated values without lag."
        test_recipe:
          setup: ["Pump created IN_SERVICE"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0800", service_zone: "Z1", design_capacity_gpm: 300, pump_count: 2, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 100, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 100, status: "IN_SERVICE" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/pumps/${p_id}/standby"
              payload: {}
              as: OperationsSupervisor
            - call: "GET /lift-station-ops/pumps/${p_id}"
              payload: {}
              as: UtilityAdmin
              captures: { after: $.data.status }
          assert:
            - "after == STANDBY (immediate visibility)"

      - name: station_posture_reflects_pump_change_immediately
        claim_type: immediate_consistency
        grounds: ["calculations.station_posture", "calculations.firm_capacity_n_minus_1"]
        distinguishing_aspect: "Station operational_posture is updated atomically in the same request that mutates a pump."
        test_recipe:
          setup: ["Station NORMAL with three IN_SERVICE pumps rated 200"]
          setup_api_calls:
            - call: "POST /lift-station-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/stations"
              payload: { station_code: "LS-0801", service_zone: "Z1", design_capacity_gpm: 400, pump_count: 3, has_backup_generator: false, wet_well_volume_gal: 2000 }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 1, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
              captures: { p1: $.data.id }
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 2, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
            - call: "POST /lift-station-ops/pumps"
              payload: { station_id: "${st_id}", position_index: 3, rated_gpm: 200, status: "IN_SERVICE" }
              as: UtilityAdmin
          trigger:
            - call: "POST /lift-station-ops/pumps/${p1}/mark-out-of-service"
              payload: {}
              as: OperationsSupervisor
            - call: "GET /lift-station-ops/stations/${st_id}"
              payload: {}
              as: UtilityAdmin
              captures: { post: $.data.operational_posture, firm: $.data.firm_capacity_available_gpm }
          assert:
            - "firm == 200"
            - "post == DEGRADED"

