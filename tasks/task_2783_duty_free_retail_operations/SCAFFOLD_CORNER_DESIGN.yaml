  # =====================================================================
  # SECTION 8 - From Cross-Cutting Complexity Layers
  # complexity_layers: optimistic_concurrency, cascading_side_effects,
  # dual_variant_calculation, rate_threshold_triggers
  # =====================================================================
  - section: complexity_layers
    instances:
      - name: stale_stock_item_version_on_pre_order_create_is_a_precondition_failure
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[preorder-create-stale-stock-item]
          - errors.ERR_STALE_STOCK_ITEM_VERSION
          - endpoints["POST /pre-orders"]
        distinguishing_aspect: |
          The reservation surface has NO state precondition that catches a client working from a
          stale snapshot - capacity may well still remain - so only the OCC guard protects it. A
          version captured BEFORE a second receipt MUST be rejected with 412
          ERR_STALE_STOCK_ITEM_VERSION and MUST NOT reserve anything; re-reading the current version
          MUST then succeed. Note that the successful reservation itself advances
          BondedStockItem.version, so a client that reuses the version it just read is stale on its
          second create.
        test_recipe:
          setup:
            - "Terminal SIN in SG, one LISTED LIQUOR product, stock item with a 10-unit receipt"
            - "A scanned itinerary SIN to AU departing 2026-08-20, whose id is the Passenger's X-User-ID"
