      - call: POST /api/provider-accounts/${prov_id}/settle-recoupment
        payload: {}
        as: PlanAdmin
        captures:
          err_2: $.data.error_id
      assert:
      - 'After the 400-rate reprice: claim B was repriced in place to 848; provider status RECOUPMENT_HOLD (balance 212 from claim A''s -212 delta)'
      - 'Pay during HOLD: error_id == ERR_PROVIDER_RECOUPMENT_HOLD (409)'
      - 'settle-recoupment: status ACTIVE, recoupment_balance_cents == 0'
      - 'Pay after settle: claim B PAID; cumulative_paid_cents == 848 + 848 == 1696'
      - 'Second settle on ACTIVE: error_id == ERR_PROVIDER_NOT_ON_HOLD (409)'
