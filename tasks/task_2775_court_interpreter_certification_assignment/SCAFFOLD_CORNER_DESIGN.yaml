      - name: an_appeal_filed_on_day_thirty_one_is_rejected_and_leaves_the_sanction_standing
        claim_type: Violation → Error
        grounds: ["errors[ERR_APPEAL_WINDOW_EXPIRED]", "validations[priority=33]", "endpoints[POST /complaints/{id}/appeal]", entities.Complaint, entities.DisciplinaryAction]
        distinguishing_aspect: "The appeal deadline is measured from Complaint.adjudicated_at on the logical clock, not from the filing or review instant, and it is the only refusal on that endpoint that a well-formed request by the correct owner in the correct state can still hit — so the 30-day window has to be enforced after ownership, state and shape all pass."
        test_recipe:
          setup:
            - "Logical clock starts at its default 2026-08-01T00:00:00Z."
            - "Language spa (DESIGNATED, oral_exam_available true); Interpreter Ana Reyes, ACTIVE with a CERTIFIED spa credential and ethics COMPLETED. X-User-ID for the Interpreter role is Ana's Interpreter id."
            - "A roster-level Complaint against Ana with no assignment_id: category ACCURACY, severity MINOR, filed by QualityReviewer X-User-ID qr-001."
            - "Reviewed by a different QualityReviewer X-User-ID qr-002 with recommendation SUBSTANTIATE, then adjudicated by ProgramAdmin X-User-ID pa-001 with disposition SUBSTANTIATED and sanction_type LETTER (the only sanction a MINOR severity permits)."
            - "adjudicated_at is therefore 2026-08-01T00:00:00Z and the appeal window closes at the end of 2026-08-31 (day 30 inclusive)."
          setup_api_calls:
