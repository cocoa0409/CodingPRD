      - name: qa_inspection_minimum_gap_window_is_half_open
        grounds:
          - validations[priority=44]
          - errors.ERR_INSPECTION_TOO_SOON
          - entities.LicenseAgreement.fields.last_inspection_at
          - calculations.qa_inspection_score
        distinguishing_aspect: |
          A different resource and different interval semantics: the LicenseAgreement's inspection
          cadence, a HALF-OPEN forward window of MIN_INSPECTION_GAP_DAYS from last_inspection_at.
          Unlike the closed territory interval, here the boundary instant is ALLOWED and only the
          instant before it is refused: 2027-05-01T23:59:59.999Z is a 409 while
          2027-05-02T00:00:00Z, exactly 90 days after the 2027-02-01 inspection, succeeds.
        test_recipe:
          setup:
