          - calculations.annual_incentive_payout
          - entities.PayoutAward.fields.certified_factor_pct
        distinguishing_aspect: |
          The blocking condition is not a single related row's state but a UNIVERSAL quantifier over a sibling
          collection: every IncentiveMetric sharing the award's (pay_program_id, vehicle) pair must be CERTIFIED
          or RESTATED. One certified metric out of two is not enough, and the award carries no field naming the
          offending metric — the guard is expressed as certified_factor_pct IS NOT NULL, which is exactly the
          value the partial certification refuses to populate. The dependency is many-to-one and negative,
          unlike the chain dependencies of the two previous instances.
