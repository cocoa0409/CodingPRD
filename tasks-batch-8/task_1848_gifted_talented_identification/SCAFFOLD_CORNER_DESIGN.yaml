            - { call: "POST /gifted/cases", payload: { student_id: "${stu_c}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_c: $.data.id } }
            - { call: "POST /gifted/cases/${case_a}/placements", payload: { site_id: "${site_id}", service_model: "PULL_OUT", start_on: "2026-09-01" }, as: GiftedCoordinator, captures: { pa: $.data.id } }
