          - state_machines.TitleException.CURE_PROPOSED_to_CURED
          - state_machines.TitleException.CURED_to_SUPERSEDED
          - entities.TitleReview.fields.exception_count
        distinguishing_aspect: |
          Conserved quantity #1 — TitleReview.exception_count (count of
          non-RESOLVED exceptions): the forward action (raise exception)
          increments by 1 and the compensating action (confirm-cure or waive)
          decrements by 1, restoring the invariant. The supersede cycle
          (create revised exception with cured_by_exception_id) increments
          and flips the old CURED exception to SUPERSEDED — net count change
          is +1 for the new OPEN exception while the superseded one was
          already resolved, so the invariant 'exception_count ==
          (# OPEN + # CURE_PROPOSED)' holds before and after each pair.
        test_recipe:
          setup:
            - "Deal -> PSA_EXECUTED; title review UNDER_REVIEW; exception_count == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
