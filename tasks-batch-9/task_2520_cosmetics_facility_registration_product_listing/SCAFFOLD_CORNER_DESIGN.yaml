      - name: overdue_sweep_then_catch_up_filing_lowers_points_and_de_escalates_posture
        claim_type: side_effect_execution
        grounds:
          - state_machines.AdverseEvent.REPORT_DUE_to_REPORT_OVERDUE
          - state_machines.AdverseEvent.REPORT_OVERDUE_to_REPORTED_LATE
          - calculations.facility_compliance_posture
        distinguishing_aspect: |
          The same event is scored twice with two different bases and the posture moves in BOTH
          directions. At lateness_days 2 the sweep applies the OVERDUE base: 9 x 1.2 = 10.80 >= 10.00, so
          the facility escalates to RESTRICTED while open_serious_event_count stays 1 (still unreported).
          The catch-up filing re-scores the SAME event with the LATE base: 5 x 1.2 = 6.00 < 10.00, so the
          posture de-escalates back to OPEN and the counter finally clears.
