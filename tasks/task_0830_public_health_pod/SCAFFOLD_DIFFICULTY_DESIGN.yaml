              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v1: $.data.version }
            - call: "POST /countermeasures"
              payload: { name: "Zero Boundary Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 600, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /inventory-lots"
              payload: { countermeasure_id: "${cm_id}", lot_number: "LOT-G1", on_hand_quantity: 100, expiration_date: "2027-01-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 100, expected_pod_version: "${pod_v1}" }
              as: LogisticsCoordinator
              captures: { ar1_id: $.data.id }
            - call: "POST /allocation-requests/${ar1_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v1}" }
              as: LogisticsCoordinator
            - call: "GET /inventory-lots/${lot_id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { available_after_ar1: $.data.available_quantity, lot_v2_confirmed: $.data.version }
            - call: "GET /pods/${pod_id}"
              payload: {}
              as: PublicHealthAdmin
              captures: { pod_v2: $.data.version }
            - call: "POST /allocation-requests"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", source_type: SNS_CACHE, requested_quantity: 1, expected_pod_version: "${pod_v2}" }
              as: LogisticsCoordinator
              captures: { ar2_id: $.data.id }
          trigger:
            - call: "POST /allocation-requests/${ar2_id}/reserve"
              payload: { expected_inventory_lot_version: "${lot_v2_confirmed}" }
              as: LogisticsCoordinator
              captures: { reserve2_error: $.data.error_id }
          assert:
            - "available_after_ar1 == 0  (on_hand_quantity 100 - reserved_quantity 100 = 0, the exact boundary)"
            - "reserve2_error == 'ERR_INSUFFICIENT_INVENTORY'  (available_quantity 0 is not >= requested_quantity 1)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (>=2, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shift_confirm_blocked_by_unverified_credential
        grounds:
          - state_machines.ShiftAssignment.PENDING_to_CONFIRMED
          - state_machines.StaffMember
        distinguishing_aspect: |
          Entity pair (ShiftAssignment, StaffMember): ShiftAssignment.confirm's
          valid outcome depends on the referenced StaffMember's credential_status,
          a field on a different entity.
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD OPERATIONAL; StaffMember created but NOT verified (credential_status=PENDING)"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Cross Entity A Plan", jurisdiction_code: "CTY13", target_population: 4000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Cross Entity A POD", site_type: FIXED_POD, address: "13 Cross St", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /staff-members"
              payload: { full_name: "Unverified Staff", email: "unverified@example.org", primary_role: VACCINATOR, mrc_unit: "UnitI", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { pod_id: "${pod_id}", staff_member_id: "${staff_id}", assigned_role: VACCINATOR, start_time: "2026-03-05T08:00:00Z", end_time: "2026-03-05T16:00:00Z" }
              as: PublicHealthAdmin
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /shift-assignments/${sa_id}/confirm"
              payload: {}
              as: ClinicalLead
              captures: { first_confirm_error: $.data.error_id }
            - call: "POST /staff-members/${staff_id}/verify-credential"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /shift-assignments/${sa_id}/confirm"
              payload: {}
              as: ClinicalLead
              captures: { second_confirm_status: $.data.status }
          assert:
            - "first_confirm_error == 'ERR_CREDENTIAL_NOT_VERIFIED'  (StaffMember.credential_status was PENDING, a different entity's field, blocking ShiftAssignment.confirm)"
            - "second_confirm_status == 'CONFIRMED'  (after StaffMember.credential_status becomes VERIFIED, the same confirm call now succeeds)"

      - name: dispensing_screen_blocked_by_pod_not_operational
        grounds:
          - state_machines.DispensingEvent.REGISTERED_to_SCREENED
          - state_machines.POD
        distinguishing_aspect: |
          Entity pair (DispensingEvent, POD) — distinct from the (ShiftAssignment,
          StaffMember) pair above: DispensingEvent.screen's valid outcome depends
          on POD.operational_status, a field on a different entity.
        test_recipe:
          setup:
            - "HazardPlan ACTIVATED; POD created but left STAGING (not opened); DispensingEvent REGISTERED"
          setup_api_calls:
            - call: "POST /hazard-plans"
              payload: { hazard_type: OUTBREAK_OTHER, title: "Cross Entity B Plan", jurisdiction_code: "CTY14", target_population: 3000 }
              as: PublicHealthAdmin
              captures: { hp_id: $.data.id }
            - call: "POST /hazard-plans/${hp_id}/activate"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /pods"
              payload: { hazard_plan_id: "${hp_id}", site_name: "Cross Entity B POD", site_type: FIXED_POD, address: "14 Cross St", staffing_capacity_lanes: 3, lane_throughput_rate_per_hour: 15 }
              as: PublicHealthAdmin
              captures: { pod_id: $.data.id }
            - call: "POST /countermeasures"
              payload: { name: "Cross Entity Vaccine", countermeasure_type: VACCINE, doses_required: 1, unit_cost_cents: 400, reorder_point_quantity: 5 }
              as: PublicHealthAdmin
              captures: { cm_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Screener B", email: "screenerb@example.org", primary_role: SCREENER, mrc_unit: "UnitJ", credential_type: EMT_CERT, credential_expires_at: "2027-01-01T00:00:00Z" }
              as: PublicHealthAdmin
              captures: { staff_id: $.data.id }
            - call: "POST /dispensing-events"
              payload: { pod_id: "${pod_id}", countermeasure_id: "${cm_id}", registrant_full_name: "Registrant Staging", registrant_risk_group: GENERAL_PUBLIC, dose_count: 1 }
              as: Volunteer
              as_user_id: "${staff_id}"
              captures: { de_id: $.data.id }
          trigger:
            - call: "POST /dispensing-events/${de_id}/screen"
              payload: { screened_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
              captures: { first_screen_error: $.data.error_id }
            - call: "POST /pods/${pod_id}/open"
              payload: {}
              as: PublicHealthAdmin
            - call: "POST /dispensing-events/${de_id}/screen"
              payload: { screened_by_staff_member_id: "${staff_id}" }
              as: ClinicalLead
              captures: { second_screen_status: $.data.status }
          assert:
            - "first_screen_error == 'ERR_POD_NOT_OPERATIONAL'  (POD.operational_status was STAGING, a different entity's field, blocking DispensingEvent.screen)"
            - "second_screen_status == 'SCREENED'  (after POD.operational_status becomes OPERATIONAL, the same screen call now succeeds)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (>=2, different interval semantics, different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: shift_overlap_rejected_same_staff_member
        grounds:
          - validations[priority=9]
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Pairwise half-open [start,end) overlap semantics on the StaffMember
          resource: a single staff member cannot hold two CONFIRMED/CHECKED_IN
          ShiftAssignment rows whose intervals overlap.
        test_recipe:
          setup:
            - "StaffMember verified; ShiftAssignment 1 [2026-03-05T08:00:00Z, 2026-03-05T16:00:00Z) CONFIRMED"
            - "ShiftAssignment 2 for the SAME staff member, [2026-03-05T12:00:00Z, 2026-03-05T20:00:00Z) — overlaps assignment 1"
