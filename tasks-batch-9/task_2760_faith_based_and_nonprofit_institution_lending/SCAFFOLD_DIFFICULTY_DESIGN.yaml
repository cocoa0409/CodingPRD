          - endpoints["POST /pledges/{pledge_id}/lapse"]
        distinguishing_aspect: |
          A single servicer lapse walks Pledge -> PledgeCampaign -> LoanApplication:
          MAJOR pledge ACTIVE -> LAPSED drops attrition_adjusted_value_cents from
          109560000 to 86200000, which is below the 96000000 underperform floor while
          total_pledged_cents 125000000 still clears the 108000000 maturity gate, so the
          campaign goes OPEN -> UNDERPERFORMING and only the PLEDGE_ADVANCE application
          backed by THAT campaign is pushed to REVISION_REQUESTED. The sibling
