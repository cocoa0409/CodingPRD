            - "SitingApplication.${app}.record_status == RECORD_CLOSED"
            - "Certificate count == 0"
            - "Project.${proj}.stage == APPLICATION_FILED"

      - name: landowner_answering_another_landowners_offer_unauthorized
        claim_type: peer_roles
        grounds:
