# =============================================================================
# §1.9 Scaffold Corner Design — Task 1811 UI Claims Response
# Breadth probe: every testable claim in §1.1–§1.7 not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: employer_creation_defaults_applied
        claim_type: creation_defaults
        grounds: [entities.EmployerAccount.fields.compliance_posture, entities.EmployerAccount.fields.late_response_strikes]
        distinguishing_aspect: "Omitting reserve_balance_cents yields default 0 and computed defaults compliance_posture CLEAR, late_response_strikes 0, current_tax_rate_bps 270."
        test_recipe:
          setup: ["Empty DB; clock default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /ui/employers"
              payload: { legal_name: "DefCo", fein: "223456700", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 500000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          assert:
            - "EmployerAccount.${emp_id}.reserve_balance_cents == 0"
            - "EmployerAccount.${emp_id}.compliance_posture == 'CLEAR'"
            - "EmployerAccount.${emp_id}.late_response_strikes == 0"
            - "EmployerAccount.${emp_id}.version == 1"

      - name: employer_duplicate_fein_rejected
        claim_type: constraint_violation
        grounds: [entities.EmployerAccount.fields.fein, "errors[ERR_DUPLICATE_ACTIVE_RECORD]"]
        distinguishing_aspect: "Second employer with the same FEIN is rejected; uniqueness is global, not per-state."
        test_recipe:
          setup: ["One employer with fein 223456701"]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "First", fein: "223456701", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 500000000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /ui/employers"
              payload: { legal_name: "Second", fein: "223456701", merit_rating_method: "BENEFIT_RATIO", taxable_payroll_cents: 600000000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_DUPLICATE_ACTIVE_RECORD'"

      - name: claim_notice_intake_computes_due_at
        claim_type: computed_field
        grounds: [entities.UiClaim.fields.response_due_at, calculations.response_deadline_computation]
        excluded_because:
          difficulty_instance: deadline_calendar_vs_business_basis
          rationale: "Computed-field correctness of response_due_at asserted with literal values in that §1.8 instance."

      - name: claim_system_fields_ignore_client_input
        claim_type: system_fields
        grounds: [entities.UiClaim.fields.status, entities.UiClaim.fields.charged_amount_cents]
        distinguishing_aspect: "Client-supplied status/charged_amount_cents in the intake payload are ignored; status initializes NOTICE_RECEIVED and charged_amount_cents 0."
        test_recipe:
          setup: ["State XX; employer; separation"]
          setup_api_calls:
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "SysCo", fein: "223456702", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Cat", ssn_last4: "1001", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
          trigger:
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-1001", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_id: $.data.id, st: $.data.status }
          assert:
            - "UiClaim.${claim_id}.status == 'NOTICE_RECEIVED'"
            - "UiClaim.${claim_id}.charged_amount_cents == 0"
            - "UiClaim.${claim_id}.adjudication_posture == 'STANDARD'"

      - name: get_claim_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ui/claims/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ClaimsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_NOT_FOUND'"
            - "http status == 404"

      - name: claims_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "GET /ui/claims returns envelope with meta, response_type 'array', and pagination fields total_count/has_more honoring default limit 10."
        test_recipe:
          setup: ["State XX; employer; separation; one claim created"]
          setup_api_calls:
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "PageCo", fein: "223456703", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Dan", ssn_last4: "1002", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-1002", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
          trigger:
            - call: "GET /ui/claims"
              payload: {}
              as: ClaimsAnalyst
          assert:
            - "envelope.meta.api_request_id present"
            - "envelope.response_type == 'array'"
            - "envelope.data length == 1"
            - "envelope pagination total_count == 1 and has_more == false"

      - name: state_rule_invalid_enum_rejected
        claim_type: type_constraint
        grounds: [entities.StateRule.fields.window_basis, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "window_basis outside {CALENDAR, BUSINESS} fails with ERR_INVALID_REQUEST at creation."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /ui/state-rules"
              payload: { state_code: "YY", response_window_days: 10, window_basis: "LUNAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_REQUEST'"

      - name: separation_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.ClaimantSeparation.fields.separation_reason, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required separation_reason in POST /ui/separations fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Employer exists"]
          setup_api_calls:
            - call: "POST /ui/employers"
              payload: { legal_name: "ReqCo", fein: "223456704", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
          trigger:
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Eli", ssn_last4: "1003", last_day_worked: "2026-07-01T00:00:00Z" }
              as: ClaimsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_INVALID_REQUEST'"

      - name: claim_reference_to_other_employers_separation_rejected
        claim_type: parent_relationship
        grounds: [entities.UiClaim.fields.separation_id, "validations[priority=4]", "errors[ERR_CROSS_PARENT_REFERENCE]"]
        distinguishing_aspect: "Intake with a separation_id owned by a different employer fails referential scoping."
        test_recipe:
          setup: ["Employers E1, E2; separation under E2"]
          setup_api_calls:
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "Own1", fein: "223456705", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp1: $.data.id }
            - call: "POST /ui/employers"
              payload: { legal_name: "Own2", fein: "223456706", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp2: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp2}", claimant_name: "Fay", ssn_last4: "1004", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
          trigger:
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp1}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-1004", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_CROSS_PARENT_REFERENCE'"

      - name: reverse_reachability_employer_claims
        claim_type: listing
        grounds: [entities.UiClaim.fields.employer_id]
        distinguishing_aspect: "GET /ui/employers/{id}/claims returns exactly the claims of that employer (FK reverse reachability, sub-resource form)."
        test_recipe:
          setup: ["Two employers each with one claim"]
          setup_api_calls:
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "RevA", fein: "223456707", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { empA: $.data.id }
            - call: "POST /ui/employers"
              payload: { legal_name: "RevB", fein: "223456708", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { empB: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${empA}", claimant_name: "Gus", ssn_last4: "1005", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sepA: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${empB}", claimant_name: "Hank", ssn_last4: "1006", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sepB: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${empA}", separation_id: "${sepA}", state_code: "XX", state_claim_number: "XX-1005", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
            - call: "POST /ui/claims"
              payload: { employer_id: "${empB}", separation_id: "${sepB}", state_code: "XX", state_claim_number: "XX-1006", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
          trigger:
            - call: "GET /ui/employers/${empA}/claims"
              payload: {}
              as: ClaimsAnalyst
          assert:
            - "response data length == 1"
            - "data[0].employer_id == '${empA}'"
            - "data[0].state_claim_number == 'XX-1005'"

  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: claim_close_from_notice_received_rejected
        claim_type: invalid_transition
        grounds: [state_machines.UiClaim.DETERMINED_to_CLOSED, "errors[ERR_CLAIM_NOT_CLOSABLE]"]
        distinguishing_aspect: "Close from initial NOTICE_RECEIVED fails with ERR_CLAIM_NOT_CLOSABLE; no side effects."
        test_recipe:
          setup: ["Claim freshly created"]
          setup_api_calls:
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "InvT", fein: "223456709", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Ida", ssn_last4: "1007", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-1007", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /ui/claims/${claim_id}/close"
              payload: {}
              as: ClaimsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_CLAIM_NOT_CLOSABLE'"
            - "UiClaim.${claim_id}.status == 'NOTICE_RECEIVED'"

      - name: claim_withdraw_after_determination_rejected
        claim_type: invalid_transition
        grounds: [state_machines.UiClaim.NOTICE_RECEIVED_to_WITHDRAWN, "errors[ERR_CLAIM_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "Withdraw is only legal from NOTICE_RECEIVED/RESPONSE_IN_PROGRESS; a DETERMINED claim rejects it."
        test_recipe:
          setup: ["Claim fully determined, determination ISSUED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "WdrCo", fein: "223456710", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Jay", ssn_last4: "1008", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-1008", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/responses"
              payload: { response_type: "NO_PROTEST", separation_reason_code: "LAYOFF", narrative: "n" }
              as: ClaimsAnalyst
              captures: { resp_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-01T00:00:00Z", authenticated: true, response_id: "${resp_id}" }
              as: ClaimsAnalyst
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: ClaimsAnalyst
              captures: { claim_v: $.data.version }
            - call: "POST /ui/claims/${claim_id}/responses/${resp_id}/submit"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAnalyst
            - call: "POST /_events/claim_adjudication_ack"
              payload: { claim_id: "${claim_id}" }
              as: PlatformAdmin
            - call: "POST /ui/claims/${claim_id}/determinations"
              payload: { outcome: "ALLOWED", mailed_at: "2026-08-05T09:00:00Z" }
              as: AgencyLiaison
          trigger:
            - call: "POST /ui/claims/${claim_id}/withdraw"
              payload: {}
              as: AgencyLiaison
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_CLAIM_NOT_WITHDRAWABLE'"
            - "UiClaim.${claim_id}.status == 'DETERMINED'"

      - name: double_submit_rejected_idempotency
        claim_type: idempotency
        grounds: [state_machines.ClaimResponse.DRAFT_to_SUBMITTED, "errors[ERR_RESPONSE_NOT_DRAFT]"]
        distinguishing_aspect: "Second submit of an already-SUBMITTED response fails with ERR_RESPONSE_NOT_DRAFT; filed_at does not change."
        test_recipe:
          setup: ["Response submitted ON_TIME at 2026-08-04T09:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "IdemCo", fein: "223456711", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Kim", ssn_last4: "1009", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-1009", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/responses"
              payload: { response_type: "NO_PROTEST", separation_reason_code: "LAYOFF", narrative: "n" }
              as: ClaimsAnalyst
              captures: { resp_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-01T00:00:00Z", authenticated: true, response_id: "${resp_id}" }
              as: ClaimsAnalyst
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: ClaimsAnalyst
              captures: { claim_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/claims/${claim_id}/responses/${resp_id}/submit"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAnalyst
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: ClaimsAnalyst
              captures: { claim_v2: $.data.version }
          trigger:
            - call: "POST /ui/claims/${claim_id}/responses/${resp_id}/submit"
              payload: { expected_claim_version: "${claim_v2}" }
              as: ClaimsAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_RESPONSE_NOT_DRAFT'"
            - "ClaimResponse.${resp_id}.filed_at == '2026-08-04T09:00:00Z'"
            - "ClaimResponse.${resp_id}.timeliness == 'ON_TIME'"

      - name: appeal_decide_before_hearing_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Appeal.HEARD_to_DECIDED_AFFIRMED, "errors[ERR_APPEAL_NOT_HEARD]"]
        distinguishing_aspect: "Deciding a FILED (never heard) appeal fails with ERR_APPEAL_NOT_HEARD."
        test_recipe:
          setup: ["Determination appealed; appeal FILED, no hearing held"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ui/state-rules"
              payload: { state_code: "XX", response_window_days: 10, window_basis: "CALENDAR", appeal_window_days: 30, protest_window_days: 30, weekend_shift: "NONE" }
              as: PlatformAdmin
            - call: "POST /ui/employers"
              payload: { legal_name: "DecCo", fein: "223456712", merit_rating_method: "RESERVE_RATIO", taxable_payroll_cents: 1000000000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /ui/separations"
              payload: { employer_id: "${emp_id}", claimant_name: "Liz", ssn_last4: "1010", last_day_worked: "2026-07-01T00:00:00Z", separation_reason: "LAYOFF" }
              as: ClaimsAnalyst
              captures: { sep_id: $.data.id }
            - call: "POST /ui/claims"
              payload: { employer_id: "${emp_id}", separation_id: "${sep_id}", state_code: "XX", state_claim_number: "XX-1010", notice_received_at: "2026-08-03T09:00:00Z", benefit_year_begin: "2026-08-02T00:00:00Z", weekly_benefit_amount_cents: 40000, max_benefit_cents: 1000000 }
              as: ClaimsAnalyst
              captures: { claim_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/responses"
              payload: { response_type: "PROTEST", separation_reason_code: "LAYOFF", narrative: "n" }
              as: ClaimsAnalyst
              captures: { resp_id: $.data.id }
            - call: "POST /ui/claims/${claim_id}/evidence"
              payload: { doc_category: "FINAL_INCIDENT_REPORT", doc_date: "2026-07-01T00:00:00Z", authenticated: true, response_id: "${resp_id}" }
              as: ClaimsAnalyst
            - call: "GET /ui/claims/${claim_id}"
              payload: {}
              as: ClaimsAnalyst
              captures: { claim_v: $.data.version }
            - call: "POST /ui/claims/${claim_id}/responses/${resp_id}/submit"
              payload: { expected_claim_version: "${claim_v}" }
              as: ClaimsAnalyst
            - call: "POST /_events/claim_adjudication_ack"
              payload: { claim_id: "${claim_id}" }
              as: PlatformAdmin
