scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_donation_create_returns_201_with_initial_axes_and_defaults
        claim_type: creation
        grounds:
          - entities.Donation.fields.status
          - entities.Donation.fields.payout_status
          - entities.Donation.fields.pickup_required
          - endpoints
        distinguishing_aspect: "POST /api/donations returns 201 with status PENDING_REVIEW, payout_status PENDING, pickup_attempts 0, exception_type NONE, version 1 and pickup_required defaulting to true when omitted."
        test_recipe:
          setup:
            - "one ACTIVE charity and one ACTIVE donor exist"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000001", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "c1@example.com", full_name: "Cor Ner", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
          trigger:
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD" }
              as: IntakeAgent
              captures: { d1: $.data.id }
          assert:
            - "HTTP 201"
            - "Donation.${d1}.status == PENDING_REVIEW"
            - "Donation.${d1}.payout_status == PENDING"
            - "Donation.${d1}.pickup_required == true"
            - "Donation.${d1}.pickup_attempts == 0 and Donation.${d1}.exception_type == NONE"
            - "Donation.${d1}.version == 1 and Donation.${d1}.gross_proceeds_cents == 0"
            - "Donation.${d1}.fmv_estimate_cents is null and Donation.${d1}.deduction_amount_cents is null"
            - "Donor.${dn1}.donation_count == 1"
            - "response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: corner_donation_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Donation.fields.status
        distinguishing_aspect: "GET /api/donations/{id} returns the same id, donor_id and charity_id that POST /api/donations stored."
        test_recipe:
          setup:
            - "a donation exists in PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000002", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "c2@example.com", full_name: "Cor Ner", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "PHONE", declared_condition: "FAIR", pickup_required: false }
              as: IntakeAgent
              captures: { d1: $.data.id }
          trigger:
            - call: "GET /api/donations/${d1}"
              as: IntakeAgent
              captures: { got: $.data.id }
          assert:
            - "HTTP 200"
            - "Donation.${d1}.donor_id == ${dn1} and Donation.${d1}.charity_id == ${c1}"
            - "Donation.${d1}.intake_channel == PHONE and Donation.${d1}.declared_condition == FAIR"
            - "Donation.${d1}.pickup_required == false"

      - name: corner_donations_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.Donation.fields.status
        distinguishing_aspect: "GET /api/donations with limit 2 and offset 0 over 3 donations returns 2 rows, total_count 3 and has_more true; offset 2 returns 1 row and has_more false."
        test_recipe:
          setup:
            - "three donations exist for the same donor and charity"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000003", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "c3@example.com", full_name: "Cor Ner", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD" }
              as: IntakeAgent
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD" }
              as: IntakeAgent
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD" }
              as: IntakeAgent
          trigger:
            - call: "GET /api/donations"
              payload: { donor_id: "${dn1}", limit: 2, offset: 0 }
              as: IntakeAgent
            - call: "GET /api/donations"
              payload: { donor_id: "${dn1}", limit: 2, offset: 2 }
              as: IntakeAgent
          assert:
            - "the first read returns 2 rows with total_count == 3 and has_more == true"
            - "the second read returns 1 row with total_count == 3 and has_more == false"
            - "response_type == array on both reads"

      - name: corner_donation_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_DONATION_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET /api/donations/{id} with a syntactically valid but unstored UUID returns HTTP 404 with error_id ERR_DONATION_NOT_FOUND."
        test_recipe:
          setup:
            - "the database contains no donation with id 11111111-1111-4111-8111-111111111111"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000004", state_code: "CA" }
              as: ProgramAdmin
          trigger:
            - call: "GET /api/donations/11111111-1111-4111-8111-111111111111"
              as: IntakeAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_DONATION_NOT_FOUND"
            - "response_type == error"

      - name: corner_donation_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /api/donations without charity_id returns HTTP 400 ERR_INVALID_REQUEST and stores nothing."
        test_recipe:
          setup:
            - "one donor exists"
          setup_api_calls:
            - call: "POST /api/donors"
              payload: { email: "c5@example.com", full_name: "Cor Ner", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
          trigger:
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", intake_channel: "WEB", declared_condition: "GOOD" }
              as: IntakeAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "Donor.${dn1}.donation_count == 0"

      - name: corner_donation_rejects_unknown_intake_channel_enum
        claim_type: type_constraints
        grounds:
          - entities.Donation.fields.intake_channel
          - validations[priority=5]
        distinguishing_aspect: "intake_channel outside {WEB, PHONE, PARTNER} returns HTTP 400 ERR_INVALID_REQUEST rather than being stored verbatim."
        test_recipe:
          setup:
            - "one ACTIVE charity and one ACTIVE donor exist"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000006", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "c6@example.com", full_name: "Cor Ner", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
          trigger:
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "FAX", declared_condition: "GOOD" }
              as: IntakeAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST"
            - "GET /api/donations with donor_id == ${dn1} returns an empty array with total_count == 0"

      - name: corner_vehicle_fmv_estimate_is_computed_and_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Vehicle.fields.fmv_estimate_cents
          - calculations.vehicle_fmv_estimate
        distinguishing_aspect: "Vehicle.fmv_estimate_cents is derived from base_book_value_cents x condition x odometer (600000 x 0.65 x 1.00 = 390000) and is not settable through POST /api/vehicles, whose input list omits it."
        test_recipe:
          setup:
            - "donation dfc is PENDING_REVIEW with declared_condition FAIR"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000007", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "c7@example.com", full_name: "Cor Ner", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "FAIR", pickup_required: false }
              as: IntakeAgent
              captures: { dfc: $.data.id }
          trigger:
            - call: "POST /api/vehicles"
              payload: { donation_id: "${dfc}", vin: "VINCOMPUTED000001", year: 2019, make: "Subaru", model: "Outback", base_book_value_cents: 600000 }
              as: IntakeAgent
              captures: { vfc: $.data.id }
          assert:
            - "HTTP 201"
            - "Vehicle.${vfc}.fmv_estimate_cents == 390000"
            - "Vehicle.${vfc}.fmv_variant == BASE_CONDITION and Vehicle.${vfc}.inspected == false"
            - "Vehicle.${vfc}.odometer_miles is null and Vehicle.${vfc}.condition_grade is null"
            - "Vehicle.${vfc}.salvage_flag == false and Vehicle.${vfc}.keys_present == true"
            - "Donation.${dfc}.fmv_estimate_cents == 390000"

      - name: corner_system_fields_are_server_minted_on_donation
        claim_type: system_fields
        grounds:
          - entities.Donation.fields.status
        distinguishing_aspect: "id is a bare UUID with no type prefix, created_at and updated_at are ISO 8601 UTC with three fractional digits, and version starts at 1 and increments to 2 on the accept mutation."
        test_recipe:
          setup:
            - "a donation exists in PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000008", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "c8@example.com", full_name: "Cor Ner", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: false }
              as: IntakeAgent
              captures: { d8: $.data.id, d8_v: $.data.version }
          trigger:
            - call: "POST /api/donations/${d8}/accept"
              payload: {}
              as: IntakeAgent
              captures: { d8_v2: $.data.version }
          assert:
            - "Donation.${d8}.id matches the bare UUID form with no prefix"
            - "Donation.${d8}.version == 1 immediately after creation"
            - "Donation.${d8}.version == 2 after accept"
            - "Donation.${d8}.updated_at is strictly greater than or equal to Donation.${d8}.created_at"

      - name: corner_ledger_entry_is_append_only_without_version
        claim_type: immutability
        grounds:
          - entities.ProceedsLedgerEntry.fields.entry_type
          - entities.ProceedsLedgerEntry.fields.direction
        distinguishing_aspect: "ProceedsLedgerEntry declares common_fields false, so entries expose id and created_at only, carry no version or updated_at, and §1.5 exposes no update or delete endpoint for them."
        test_recipe:
          setup:
            - "donation dled is SOLD for 60000 with a CLEARED title, producing three ledger entries"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000009", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "c9@example.com", full_name: "Cor Ner", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Bay Auto Auction", venue_type: "AUCTION", state_code: "CA" }
              as: ProgramAdmin
              captures: { ve1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: false }
              as: IntakeAgent
              captures: { dled: $.data.id }
            - call: "POST /api/donations/${dled}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${dled}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/title-records"
              payload: { donation_id: "${dled}", title_number: "CA-TTL-LED", owner_name: "Cor Ner" }
              as: TitleClerk
              captures: { tled: $.data.id }
            - call: "POST /api/title-records/${tled}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${tled}/dmv-decision"
              payload: { outcome: "CLEARED" }
              as: TitleClerk
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${dled}", venue_id: "${ve1}", lot_number: "L-LED", reserve_price_cents: 10000 }
              as: AuctionManager
              captures: { lled: $.data.id }
            - call: "GET /api/donations/${dled}"
              as: AuctionManager
              captures: { dled_v: $.data.version }
            - call: "POST /api/auction-lots/${lled}/record-sale"
              payload: { sale_price_cents: 60000, expected_donation_version: "${dled_v}" }
              as: AuctionManager
          trigger:
            - call: "GET /api/donations/${dled}/ledger-entries"
              as: FinanceOfficer
          assert:
            - "the read returns exactly 3 entries ordered oldest first"
            - "entry 0 has entry_type PROCEEDS_CREDIT, direction CREDIT, amount_cents 60000"
            - "entry 1 has entry_type PROGRAM_FEE_DEBIT, direction DEBIT, amount_cents 9000"
            - "entry 2 has entry_type ADMIN_FEE_DEBIT, direction DEBIT, amount_cents 2500"
            - "every entry exposes id and created_at and exposes no version or updated_at field"
            - "Donation.${dled}.net_to_charity_cents == 48500"

      - name: corner_vehicle_create_with_unknown_donation_returns_donation_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_DONATION_NOT_FOUND]
        distinguishing_aspect: "A body foreign key that does not resolve returns HTTP 404 ERR_DONATION_NOT_FOUND, proving flat-topology FK integrity is enforced on create."
        test_recipe:
          setup:
            - "no donation with id 22222222-2222-4222-8222-222222222222 exists"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000010", state_code: "CA" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/vehicles"
              payload: { donation_id: "22222222-2222-4222-8222-222222222222", vin: "VINORPHAN00000001", year: 2015, make: "Kia", model: "Soul", base_book_value_cents: 300000 }
              as: IntakeAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id ERR_DONATION_NOT_FOUND"
            - "GET /api/vehicles with donation_id == 22222222-2222-4222-8222-222222222222 returns an empty array"

  - section: state_machines
    instances:
      - name: corner_accept_moves_donation_from_pending_review_to_accepted
        claim_type: valid_transition
        grounds:
          - state_machines.Donation.PENDING_REVIEW_to_ACCEPTED
        distinguishing_aspect: "POST /api/donations/{id}/accept moves status PENDING_REVIEW -> ACCEPTED, bumps version to 2 and leaves payout_status at PENDING."
        test_recipe:
          setup:
            - "donation dacc is PENDING_REVIEW with an ACTIVE donor and ACTIVE charity"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000011", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "sm1@example.com", full_name: "Sta Te", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: false }
              as: IntakeAgent
              captures: { dacc: $.data.id }
          trigger:
            - call: "POST /api/donations/${dacc}/accept"
              payload: {}
              as: IntakeAgent
          assert:
            - "HTTP 200 and Donation.${dacc}.status == ACCEPTED"
            - "Donation.${dacc}.payout_status == PENDING"
            - "Donation.${dacc}.version == 2"

      - name: corner_accept_on_declined_donation_returns_invalid_donation_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Donation.PENDING_REVIEW_to_DECLINED
          - validations[priority=9]
          - errors[ERR_INVALID_DONATION_STATE]
        distinguishing_aspect: "From DECLINED, which is terminal, the accept trigger is not declared, so it returns HTTP 409 ERR_INVALID_DONATION_STATE and no field changes."
        test_recipe:
          setup:
            - "donation ddec is DECLINED with payout_status WITHHELD"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000012", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "sm2@example.com", full_name: "Sta Te", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "POOR", pickup_required: false }
              as: IntakeAgent
              captures: { ddec: $.data.id }
            - call: "POST /api/donations/${ddec}/decline"
              payload: { reason: "vehicle beyond salvage value" }
              as: IntakeAgent
          trigger:
            - call: "POST /api/donations/${ddec}/accept"
              payload: {}
              as: IntakeAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_DONATION_STATE"
            - "Donation.${ddec}.status == DECLINED and Donation.${ddec}.payout_status == WITHHELD"

      - name: corner_second_accept_on_accepted_donation_is_not_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.Donation.PENDING_REVIEW_to_ACCEPTED
          - errors[ERR_INVALID_DONATION_STATE]
        distinguishing_aspect: "Repeating accept on an ACCEPTED donation returns HTTP 409 ERR_INVALID_DONATION_STATE and does not bump version a second time."
        test_recipe:
          setup:
            - "donation dtwice is ACCEPTED with version 2"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000013", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "sm3@example.com", full_name: "Sta Te", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: false }
              as: IntakeAgent
              captures: { dtwice: $.data.id }
            - call: "POST /api/donations/${dtwice}/accept"
              payload: {}
              as: IntakeAgent
          trigger:
            - call: "POST /api/donations/${dtwice}/accept"
              payload: {}
              as: IntakeAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_DONATION_STATE"
            - "Donation.${dtwice}.version == 2"

      - name: corner_cancel_on_cancelled_donation_is_locked_out
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Donation.ACCEPTED_to_CANCELLED
          - errors[ERR_INVALID_DONATION_STATE]
        distinguishing_aspect: "CANCELLED is terminal, so a second cancel returns HTTP 409 ERR_INVALID_DONATION_STATE and Donor.donation_count is not decremented twice."
        test_recipe:
          setup:
            - "donation dcan is CANCELLED after the donor withdrew it"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000014", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "sm4@example.com", full_name: "Sta Te", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: false }
              as: IntakeAgent
              captures: { dcan: $.data.id }
            - call: "POST /api/donations/${dcan}/cancel"
              payload: { reason: "sold privately" }
              as: Donor
              as_user_id: "${dn1}"
          trigger:
            - call: "POST /api/donations/${dcan}/cancel"
              payload: { reason: "sold privately again" }
              as: Donor
              as_user_id: "${dn1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_INVALID_DONATION_STATE"
            - "Donation.${dcan}.status == CANCELLED"
            - "Donor.${dn1}.donation_count == 0"

      - name: corner_decline_side_effect_sets_payout_status_withheld
        claim_type: side_effect_execution
        grounds:
          - state_machines.Donation.PENDING_REVIEW_to_DECLINED
          - state_machines.Donation.PENDING_to_WITHHELD
        distinguishing_aspect: "The decline transition writes both axes in one call: status DECLINED and payout_status WITHHELD, with no ledger entry because net_to_charity_cents is still 0."
        test_recipe:
          setup:
            - "donation dsd is PENDING_REVIEW"
          setup_api_calls:
            - call: "POST /api/charities"
              payload: { name: "Corner Trust", ein: "80-0000015", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "sm5@example.com", full_name: "Sta Te", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "PARTNER", declared_condition: "SALVAGE", pickup_required: false }
              as: IntakeAgent
              captures: { dsd: $.data.id }
          trigger:
            - call: "POST /api/donations/${dsd}/decline"
              payload: { reason: "no title available" }
              as: IntakeAgent
          assert:
            - "Donation.${dsd}.status == DECLINED and Donation.${dsd}.payout_status == WITHHELD"
            - "GET /api/donations/${dsd}/ledger-entries returns an empty array with total_count == 0"
            - "CharityAffiliate.${c1}.pledged_balance_cents == 0"

      - name: corner_donation_cancel_cascades_down_to_scheduled_pickup_orders
        claim_type: cascade_down
        grounds:
