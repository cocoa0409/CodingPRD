            - { call: "POST /api/valuations", payload: { asset_id: "${a1}", effective_date: "2026-07-15", method: "EXTERNAL_APPRAISAL", appraised_value_cents: 520000000 }, as: Analyst, captures: { v2: $.data.id } }
          trigger:
            - { call: "POST /api/valuations/${v1}/confirm", payload: { expected_asset_version: "${a1_v}" }, as: PortfolioDirector, captures: { ok_st: $.data.status } }
            - { call: "POST /api/valuations/${v2}/confirm", payload: { expected_asset_version: "${a1_v}" }, as: PortfolioDirector, captures: { err: $.data.error_id } }
            - { call: "GET /api/assets/${a1}", payload: {}, as: Analyst, captures: { a_v3: $.data.version } }
            - { call: "POST /api/valuations/${v2}/confirm", payload: { expected_asset_version: "${a_v3}" }, as: PortfolioDirector, captures: { ok2: $.data.status } }
          assert:
            - "ok_st == CONFIRMED"
            - "err == ERR_STALE_ASSET_VERSION (412) for the stale second confirm"
            - "ok2 == CONFIRMED with the fresh version — and V1 is now SUPERSEDED"

