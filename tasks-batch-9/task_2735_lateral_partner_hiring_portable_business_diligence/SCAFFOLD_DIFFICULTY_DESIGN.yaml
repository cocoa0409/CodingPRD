# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2735 — Lateral Partner Hiring & Portable Business Diligence
# =============================================================================
# Every numeric literal in every `assert:` below was computed with Python/Decimal
# against the §1.3 formulas and their declared constants (ROUND_HALF_UP, and
# ROUND_DOWN for the declination waterfall). No assert contains an unevaluated
# expression.
#
# Two client-book fixtures recur. Both use baseline_date 2026-07-01T00:00:00.000Z
# (lookback_start_date 2023-07-01T00:00:00.000Z) and governing_basis VALIDATED.
#
#   FULL BOOK (3 ACTIVE entries)
#     A "Northwind Holdings"    BILLING_ATTORNEY     CONSENT_CONFIRMED  realization 1.0000
#       3 x 1410000.00 -> avg 1410000.00 -> hard cap binds -> baseline 1269000.00
#     B "Calder Manufacturing"  RELATIONSHIP_PARTNER CONSENT_PENDING    realization 0.8800
#       740000.00 + 740000.00 + 740001.00 -> avg 740000.33 -> baseline  332112.15
#     C "Ridgeline Foods"       SERVICE_PARTNER      CONSENT_CONFIRMED  realization 0.9900
#       3 x  420000.00 -> avg  420000.00 -> baseline  219450.00
#     gross_baseline_total_usd 1820562.15 · self_reported_total_usd 2320000.00
#     variance_pct 0.2153 · top_client_share 0.6970 · HIGH · haircut 0.15
#     adjusted_portable_total_usd 1547477.83   (SELF_REPORTED basis: 1972000.00)
#
#   SLIM BOOK (entry A only)
#     gross_baseline_total_usd 1269000.00 · self_reported_total_usd 1280000.00
#     variance_pct 0.0086 · top_client_share 1.0000 · HIGH · haircut 0.15
#     adjusted_portable_total_usd 1078650.00
#
# Offer economics (PracticeGroup leverage_ratio 3.20 -> uplift 0.05; Candidate
# notice_period_days 45 -> RAMP_SHORT 0.85; effective_multiplier 0.90;
# target 950.00 / current 875.00 -> rate_alignment_factor 1.0857):
#   FULL BOOK offer 850000.00 + 100000.00 -> expected_contribution 1512087.01,
#     total_first_year_comp 950000.00, search_fee 237500.00,
#     integration_cost 360500.00, net 201587.01, true_up 42500.00
#   SLIM BOOK offer 500000.00 +  50000.00 -> expected_contribution 1053981.27,
#     total_first_year_comp 550000.00, search_fee 137500.00,
#     integration_cost 244500.00, net 259481.27, true_up 25000.00
#
# Default logical clock is 2026-08-01T00:00:00Z (§1.5 _clock endpoint).
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: book_valuation_self_reported_versus_validated_basis_diverge
        grounds:
          - calculations.portable_book_valuation
          - calculations.client_concentration_analysis
          - entities.PortabilityAssessment.fields.governing_basis
          - entities.PortabilityAssessment.fields.adjusted_portable_total_usd
          - entities.ClientBookEntry.fields.claimed_portability_pct
          - concurrency_rules.assessment-create-stale-questionnaire
        distinguishing_aspect: |
          Entity domain = the candidate's CLIENT BOOK. Two assessments over the
          byte-identical set of three ClientBookEntry rows produce different
          governing totals: SELF_REPORTED reads claimed_annual_billings_usd *
          claimed_portability_pct and ignores every CollectionRecord, role_factor,
          consent_factor and both caps (2320000.00), while VALIDATED runs the
          verified-collections pipeline (1820562.15) — a 499437.85 delta that
          survives the identical 0.15 concentration haircut as 1972000.00 vs
          1547477.83.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup and one ACTIVE SearchFirmEngagement exist."
            - "One Candidate in pipeline_status DILIGENCE with the FULL BOOK (three ACTIVE ClientBookEntry rows) and nine VERIFIED HISTORICAL CollectionRecord rows."
            - "The LateralQuestionnaire is UNDER_REVIEW so assessments may be created."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /lateral-hiring/candidates"
              payload: { full_name: "Dana Whitfield", prior_firm_name: "Ashworth & Pine LLP", target_practice_group_id: "${pg_id}", sourcing_engagement_id: "${eng_id}", sponsor_user_id: "user-sponsor-1", current_standard_rate_usd: 875.00, notice_period_days: 45, non_solicit_days: 30, approach_confidential: true }
              as: RecruitingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /lateral-hiring/candidates/${cand_id}/approach"
              payload: {}
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/questionnaires"
              payload: { declared_prior_year_billings_usd: 3000000.00, declared_prior_year_collections_usd: 2600000.00, declared_realization_rate: 0.8700, primary_matter_types: ["M_AND_A", "LITIGATION", "TAX"] }
              as: RecruitingCoordinator
              captures: { lpq_id: $.data.id }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/client-book-entries"
              payload: { client_name: "Northwind Holdings", relationship_role: "BILLING_ATTORNEY", client_consent_status: "CONSENT_CONFIRMED", claimed_annual_billings_usd: 1600000.00, claimed_portability_pct: 0.8000, claimed_realization_rate: 1.0000, matter_types: ["M_AND_A", "SECURITIES"] }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { entry_a_id: $.data.id }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/client-book-entries"
              payload: { client_name: "Calder Manufacturing", relationship_role: "RELATIONSHIP_PARTNER", client_consent_status: "CONSENT_PENDING", claimed_annual_billings_usd: 900000.00, claimed_portability_pct: 0.7000, claimed_realization_rate: 0.8800, matter_types: ["LITIGATION", "EMPLOYMENT"] }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { entry_b_id: $.data.id }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/client-book-entries"
              payload: { client_name: "Ridgeline Foods", relationship_role: "SERVICE_PARTNER", client_consent_status: "CONSENT_CONFIRMED", claimed_annual_billings_usd: 500000.00, claimed_portability_pct: 0.8200, claimed_realization_rate: 0.9900, matter_types: ["TAX"] }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { entry_c_id: $.data.id }
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_a_id}", record_type: "HISTORICAL", period_end_date: "2023-12-31T00:00:00.000Z", amount_usd: 1410000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_a_id}", record_type: "HISTORICAL", period_end_date: "2024-12-31T00:00:00.000Z", amount_usd: 1410000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_a_id}", record_type: "HISTORICAL", period_end_date: "2025-12-31T00:00:00.000Z", amount_usd: 1410000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_b_id}", record_type: "HISTORICAL", period_end_date: "2023-12-31T00:00:00.000Z", amount_usd: 740000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_b_id}", record_type: "HISTORICAL", period_end_date: "2024-12-31T00:00:00.000Z", amount_usd: 740000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_b_id}", record_type: "HISTORICAL", period_end_date: "2025-12-31T00:00:00.000Z", amount_usd: 740001.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_c_id}", record_type: "HISTORICAL", period_end_date: "2023-12-31T00:00:00.000Z", amount_usd: 420000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_c_id}", record_type: "HISTORICAL", period_end_date: "2024-12-31T00:00:00.000Z", amount_usd: 420000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_c_id}", record_type: "HISTORICAL", period_end_date: "2025-12-31T00:00:00.000Z", amount_usd: 420000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/start-review"
              payload: {}
              as: RecruitingCoordinator
              captures: { lpq_v1: $.data.version }
          trigger:
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/portability-assessments"
              payload: { baseline_date: "2026-07-01T00:00:00.000Z", governing_basis: "VALIDATED", expected_questionnaire_version: "${lpq_v1}" }
              as: RecruitingCoordinator
              captures: { assess_validated_id: $.data.id, lpq_v2: $.data.version }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/portability-assessments"
              payload: { baseline_date: "2026-07-01T00:00:00.000Z", governing_basis: "SELF_REPORTED", expected_questionnaire_version: "${lpq_v2}" }
              as: RecruitingCoordinator
              captures: { assess_self_id: $.data.id }
          assert:
            - "PortabilityAssessment.${assess_validated_id}.governing_basis == VALIDATED"
            - "PortabilityAssessment.${assess_validated_id}.gross_baseline_total_usd == 1820562.15"
            - "PortabilityAssessment.${assess_validated_id}.validated_portable_total_usd == 1820562.15"
            - "PortabilityAssessment.${assess_validated_id}.self_reported_total_usd == 2320000.00"
            - "PortabilityAssessment.${assess_validated_id}.variance_pct == 0.2153"
            - "PortabilityAssessment.${assess_validated_id}.concentration_grade == HIGH"
            - "PortabilityAssessment.${assess_validated_id}.concentration_haircut_pct == 0.15"
            - "PortabilityAssessment.${assess_validated_id}.adjusted_portable_total_usd == 1547477.83"
            - "PortabilityAssessment.${assess_self_id}.governing_basis == SELF_REPORTED"
            - "PortabilityAssessment.${assess_self_id}.self_reported_total_usd == 2320000.00"
            - "PortabilityAssessment.${assess_self_id}.adjusted_portable_total_usd == 1972000.00"
            - "PortabilityAssessment.${assess_self_id}.adjusted_portable_total_usd - PortabilityAssessment.${assess_validated_id}.adjusted_portable_total_usd == 424522.17"
            - "PortabilityAssessment.${assess_validated_id}.status == SUPERSEDED"
            - "PortabilityAssessment.${assess_self_id}.status == CURRENT"
            - "LateralQuestionnaire.${lpq_id}.latest_assessment_id == ${assess_self_id}"

      - name: search_fee_direct_placement_versus_tail_off_claim_diverge
        grounds:
          - calculations.search_fee_liability
          - calculations.net_first_year_economics
          - entities.SearchFirmEngagement.fields.fee_basis
          - entities.SearchFirmEngagement.fields.fee_amount_usd
          - entities.SearchFirmEngagement.fields.tail_off_days
          - state_machines.Candidate.OFFER_OUT_to_HIRED
        distinguishing_aspect: |
          Entity domain = VENDOR FEE LIABILITY on SearchFirmEngagement, not the
          client book. From one unchanged offer (500000.00 guaranteed + 50000.00
          signing) the DIRECT_PLACEMENT variant bills 25% of the FULL 550000.00
          package (137500.00) while the TAIL_OFF_CLAIM variant bills 25% of the
          guarantee ONLY, halved by TAIL_OFF_DISCOUNT (62500.00) — a 75000.00
          delta driven purely by where the hire instant falls relative to
          exclusivity_end_date.
        test_recipe:
          setup:
            - "SLIM BOOK: one OPEN PracticeGroup, one ACTIVE SearchFirmEngagement with exclusivity [2026-08-01, 2026-12-01) and tail_off_days 90, one Candidate with a single ACTIVE ClientBookEntry backed by three VERIFIED HISTORICAL records."
            - "Conflicts are CLEAR so Candidate.clearance_status == CLEARED."
            - "A CompensationOffer created at clock 2026-08-01 is APPROVED by the committee (eligible_voter_count 3, two APPROVE votes)."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
              captures: { eng_id: $.data.id }
            - call: "POST /lateral-hiring/candidates"
              payload: { full_name: "Dana Whitfield", prior_firm_name: "Ashworth & Pine LLP", target_practice_group_id: "${pg_id}", sourcing_engagement_id: "${eng_id}", sponsor_user_id: "user-sponsor-1", current_standard_rate_usd: 875.00, notice_period_days: 45, non_solicit_days: 30, approach_confidential: true }
              as: RecruitingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /lateral-hiring/candidates/${cand_id}/approach"
              payload: {}
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/questionnaires"
              payload: { declared_prior_year_billings_usd: 1600000.00, declared_prior_year_collections_usd: 1410000.00, declared_realization_rate: 0.9500, primary_matter_types: ["M_AND_A"] }
              as: RecruitingCoordinator
              captures: { lpq_id: $.data.id }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/client-book-entries"
              payload: { client_name: "Northwind Holdings", relationship_role: "BILLING_ATTORNEY", client_consent_status: "CONSENT_CONFIRMED", claimed_annual_billings_usd: 1600000.00, claimed_portability_pct: 0.8000, claimed_realization_rate: 1.0000, matter_types: ["M_AND_A", "SECURITIES"] }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { entry_a_id: $.data.id }
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_a_id}", record_type: "HISTORICAL", period_end_date: "2023-12-31T00:00:00.000Z", amount_usd: 1410000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_a_id}", record_type: "HISTORICAL", period_end_date: "2024-12-31T00:00:00.000Z", amount_usd: 1410000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/candidates/${cand_id}/collection-records"
              payload: { client_book_entry_id: "${entry_a_id}", record_type: "HISTORICAL", period_end_date: "2025-12-31T00:00:00.000Z", amount_usd: 1410000.00, status: "VERIFIED", source: "PRIOR_FIRM_STATEMENT" }
              as: RecruitingCoordinator
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/start-review"
              payload: {}
              as: RecruitingCoordinator
              captures: { lpq_v1: $.data.version }
            - call: "POST /lateral-hiring/questionnaires/${lpq_id}/portability-assessments"
              payload: { baseline_date: "2026-07-01T00:00:00.000Z", governing_basis: "VALIDATED", expected_questionnaire_version: "${lpq_v1}" }
              as: RecruitingCoordinator
              captures: { assess_id: $.data.id }
            - call: "POST /lateral-hiring/client-book-entries/${entry_a_id}/conflict-checks"
              payload: { adverse_party_name: "Vertex Capital", affected_matter_types: ["SECURITIES"], severity: "POSITIONAL" }
              as: ConflictsCounsel
              captures: { chk_id: $.data.id }
            - call: "POST /lateral-hiring/conflict-checks/${chk_id}/clear"
              payload: { resolution_note: "Positional only; no substantive adversity." }
              as: ConflictsCounsel
            - call: "GET /lateral-hiring/candidates/${cand_id}"
              payload: {}
              as: CommitteeChair
              captures: { cand_v1: $.data.version }
            - call: "POST /lateral-hiring/candidates/${cand_id}/offers"
              payload: { portability_assessment_id: "${assess_id}", guaranteed_comp_usd: 500000.00, signing_bonus_usd: 50000.00, expected_candidate_version: "${cand_v1}" }
              as: CommitteeChair
              as_user_id: "user-chair-1"
              captures: { offer_id: $.data.id }
            - call: "POST /lateral-hiring/offers/${offer_id}/submit"
              payload: { eligible_voter_count: 3 }
              as: CommitteeChair
              as_user_id: "user-chair-1"
            - call: "POST /lateral-hiring/offers/${offer_id}/votes"
              payload: { decision: "APPROVE", round_number: 1, rationale: "Strong portable book." }
              as: CommitteeMember
              as_user_id: "user-member-1"
            - call: "POST /lateral-hiring/offers/${offer_id}/votes"
              payload: { decision: "APPROVE", round_number: 1 }
              as: CommitteeMember
              as_user_id: "user-member-2"
            - call: "POST /lateral-hiring/offers/${offer_id}/finalize"
              payload: {}
              as: CommitteeChair
              as_user_id: "user-chair-2"
          trigger:
            - call: "POST /lateral-hiring/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /lateral-hiring/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
          assert:
            - "CompensationOffer.${offer_id}.search_fee_amount_usd == 137500.00"
            - "CompensationOffer.${offer_id}.total_first_year_comp_usd == 550000.00"
            - "CompensationOffer.${offer_id}.integration_cost_total_usd == 244500.00"
            - "CompensationOffer.${offer_id}.status == ACCEPTED"
            - "Candidate.${cand_id}.pipeline_status == HIRED"
            - "Candidate.${cand_id}.hire_date == 2027-01-15T00:00:00.000Z"
            - "Candidate.${cand_id}.earliest_start_date == 2027-03-01T00:00:00.000Z"
            - "SearchFirmEngagement.${eng_id}.fee_basis == TAIL_OFF_CLAIM"
            - "SearchFirmEngagement.${eng_id}.fee_amount_usd == 62500.00"
            - "SearchFirmEngagement.${eng_id}.fee_status == FEE_DUE"
            - "SearchFirmEngagement.${eng_id}.status == ACTIVE"
            - "CompensationOffer.${offer_id}.search_fee_amount_usd - SearchFirmEngagement.${eng_id}.fee_amount_usd == 75000.00"

      - name: performance_variance_plan_basis_versus_rate_adjusted_basis_diverge
        grounds:
          - calculations.performance_variance
          - entities.PerformanceReview.fields.variance_basis
          - entities.PerformanceReview.fields.plan_target_usd
          - entities.PerformanceReview.fields.plan_target_adjusted_usd
          - entities.PerformanceReview.fields.variance_usd
          - entities.IntegrationPlan.fields.planned_standard_rate_usd
        distinguishing_aspect: |
          Entity domain = POST-HIRE PERFORMANCE on PerformanceReview, a third
          subject distinct from the client book and from vendor fees. Identical
          collections (250000.00) over an identical 91-day period yield
          variance_usd -12773.41 on PLAN_BASIS against plan_target_usd 262773.41
          but +1056.77 on RATE_ADJUSTED_BASIS against plan_target_adjusted_usd
          248943.23, while attainment_pct stays 0.9514 on BOTH because it is
          always keyed to the unadjusted target.
        test_recipe:
          setup:
            - "SLIM BOOK chain carried through to a HIRED candidate at clock 2026-08-01, expected_contribution_usd 1053981.27."
            - "An ACTIVE IntegrationPlan with planned_standard_rate_usd 950.00 and onboarding window 2026-10-01 .. 2027-06-30."
            - "Two VERIFIED POST_HIRE CollectionRecord rows totalling 250000.00 inside the closed review period 2027-01-04 .. 2027-04-04, plus one UNVERIFIED row that must be ignored."
            - "The logical clock is advanced to 2027-04-10 before the reviews are written."
          setup_api_calls:
            - call: "POST /lateral-hiring/practice-groups"
              payload: { name: "Corporate & Securities", guarantee_budget_total_usd: 5000000.00, onboarding_capacity: 2, leverage_ratio: 3.20, target_standard_rate_usd: 950.00 }
              as: SystemAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /lateral-hiring/search-firms"
              payload: { name: "Meridian Legal Search", max_fee_pct: 0.3000, max_concurrent_engagements: 2 }
              as: SystemAdmin
              captures: { sf_id: $.data.id }
            - call: "POST /lateral-hiring/search-firm-engagements"
              payload: { search_firm_id: "${sf_id}", practice_group_id: "${pg_id}", fee_pct: 0.2500, fee_cap_usd: 400000.00, exclusivity_start_date: "2026-08-01T00:00:00.000Z", exclusivity_end_date: "2026-12-01T00:00:00.000Z", tail_off_days: 90 }
              as: RecruitingCoordinator
