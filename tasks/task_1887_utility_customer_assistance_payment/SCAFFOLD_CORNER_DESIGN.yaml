# =============================================================================
# Task 1887 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty
# Tests). Breadth walk over SCAFFOLD.yaml §1.1–§1.7 using the claim-extraction
# guide taxonomy. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: account_create_defaults_applied
        claim_type: defaults
        grounds: [entities.CustomerAccount]
        distinguishing_aspect: "Creating an account with only service_address applies every declared default and system initial value."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /assistance/accounts"
              payload: { service_address: "1 Default Dr" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", svc_class: "$.data.service_class", fuel: "$.data.heating_fuel_type", dep: "$.data.deposit_held_cents", arr: "$.data.arrearage_balance_cents", cur: "$.data.current_charges_balance_cents", cred: "$.data.credit_balance_cents", fee: "$.data.reconnection_fee_due_cents", svc: "$.data.service_status", prot: "$.data.protection_status", ver: "$.data.version" }
          assert:
            - "service_class == RESIDENTIAL, heating_fuel_type == ELECTRIC, deposit_held_cents == 0 (input defaults)"
            - "arrearage_balance_cents == 0, current_charges_balance_cents == 0, credit_balance_cents == 0, reconnection_fee_due_cents == 0"
            - "service_status == CONNECTED, protection_status == UNPROTECTED, version == 1"

      - name: account_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.CustomerAccount, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown account id returns the 404 error envelope."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /assistance/accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: application_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.AssistanceApplication.fields.household_size, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required household_size is rejected before any existence/OCC processing."
        test_recipe:
          setup: ["account exists (version captured)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "2 Req Rd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
          trigger:
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", gross_annual_income_cents: 1000000, current_month_income_cents: 90000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (household_size missing)"

      - name: payment_immutable_event_no_version
        claim_type: immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment is common_fields:false — its read representation carries id and created_at but no version/updated_at, and no update endpoint exists in §1.5."
        test_recipe:
          setup: ["account with arrearage 3000"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "3 Event Way" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 3000, effective_on: "2026-08-01" }
              as: ProgramAdmin
          trigger:
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 3000, tender_type: "CASH" }
              as: CustomerServiceRep
              captures: { pay_id: "$.data.id" }
            - call: "GET /assistance/payments/${pay_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { paid_at: "$.data.paid_at" }
          assert:
            - "Payment.${pay_id} response contains id and created_at and paid_at == 2026-08-01T00:00:00Z (logical clock)"
            - "response contains no `version` and no `updated_at` key (immutable event entity)"

      - name: enrollment_computed_discount_pct_tier2
        claim_type: computed_fields
        grounds: [entities.AssistanceEnrollment.fields.discount_pct, calculations.income_tier_determination]
        distinguishing_aspect: "Enrollment tier/discount are system-computed from the verified application: TIER_2 maps to discount_pct 30."
        test_recipe:
          setup: ["account; TIER_2 application (household 2, annual 3500000) verified"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "4 Computed Ct" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
          trigger:
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_tier: "$.data[0].tier", enr_disc: "$.data[0].discount_pct", enr_status: "$.data[0].status", enr_app: "$.data[0].application_id" }
          assert:
            - "enrollment tier == TIER_2, discount_pct == 30, status == PENDING, application_id == ${app_id}"

      - name: account_create_computed_field_input_rejected
        claim_type: system_fields
        grounds: [entities.CustomerAccount.fields.arrearage_balance_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Client-supplied system field arrearage_balance_cents in a create payload is rejected, not silently ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /assistance/accounts"
              payload: { service_address: "5 System St", arrearage_balance_cents: 99999 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST, HTTP 400 (payload keys limited to declared input)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: application_initial_state_submitted
        claim_type: initial_state
        grounds: [state_machines.AssistanceApplication]
        distinguishing_aspect: "A newly created application starts in SUBMITTED with submitted_by_user_id taken from X-User-ID."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "6 Init Ave" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
          trigger:
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_9
              captures: { app_status: "$.data.status", app_submitter: "$.data.submitted_by_user_id" }
          assert:
            - "status == SUBMITTED; submitted_by_user_id == csr_9; reviewed_by_user_id is null"

      - name: application_withdraw_from_verified_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AssistanceApplication, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VERIFIED is terminal: withdraw is rejected with ERR_INVALID_STATE and the decision stands."
        test_recipe:
          setup: ["application VERIFIED (household 1, annual 500000 -> TIER_1)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "7 Terminal Ter" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
          trigger:
            - call: "POST /assistance/applications/${app_id}/withdraw"
              payload: {}
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409; application remains VERIFIED"

      - name: dpa_cancel_from_completed_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DeferredPaymentAgreement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "COMPLETED is terminal: cancel is rejected; no credit reversal side effects fire."
        test_recipe:
          setup: ["account arrearage 120000; DPA n=4 (down 12000, installment 27000, pool 0) activated 2026-08-01 and fully settled by a 108000 payment (all four installments on time)"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "8 Complete Ct" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/dpas"
              payload: { account_id: "${acct_id}", installment_count: 4, expected_account_version: "${acct_v} + 1" }
              as: CustomerServiceRep
              captures: { dpa_id: "$.data.id" }
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 12000, tender_type: "CASH" }
              as: CustomerServiceRep
            - call: "POST /assistance/payments"
              payload: { account_id: "${acct_id}", amount_cents: 108000, tender_type: "CHECK" }
              as: CustomerServiceRep
              captures: { settled: "$.data.installments_settled_count" }
          trigger:
            - call: "GET /assistance/dpas/${dpa_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { st: "$.data.status", rem: "$.data.remaining_balance_cents" }
            - call: "POST /assistance/dpas/${dpa_id}/cancel"
              payload: {}
              as: CustomerServiceRep
              captures: { err: "$.data.error_id" }
          assert:
            - "before cancel: status == COMPLETED (remaining_balance_cents == 0 after 12000 + 108000 paid), installments_settled_count == 4"
            - "cancel error_id == ERR_INVALID_STATE, HTTP 409; DPA stays COMPLETED"

      - name: order_block_unblock_cycle_via_sweep
        claim_type: valid_transition
        grounds: [state_machines.ShutoffOrder.SCHEDULED_to_BLOCKED, state_machines.ShutoffOrder.BLOCKED_to_SCHEDULED, calculations.protection_gate]
        distinguishing_aspect: "SCHEDULED -> BLOCKED -> SCHEDULED cycle is driven by sweep weather inputs; blocked_reason is set and cleared with the cycle."
        test_recipe:
          setup: ["account arrearage 120000 (2026-08-01); clock 2026-09-15; manual order SCHEDULED for 2026-09-30"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "9 Block Blvd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}", scheduled_date: "2026-09-30" }
              as: ProgramAdmin
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /assistance/ops/daily-sweep"
              payload: { observed_low_f: 30 }
              as: ProgramAdmin
              captures: { blocked_n: "$.data.orders_blocked" }
            - call: "GET /assistance/shutoff-orders/${order_id}"
              payload: {}
              as: ProgramAdmin
              captures: { st1: "$.data.status", br1: "$.data.blocked_reason" }
            - call: "POST /assistance/ops/daily-sweep"
              payload: { observed_low_f: 40 }
              as: ProgramAdmin
              captures: { unblocked_n: "$.data.orders_unblocked" }
            - call: "GET /assistance/shutoff-orders/${order_id}"
              payload: {}
              as: ProgramAdmin
              captures: { st2: "$.data.status", br2: "$.data.blocked_reason" }
          assert:
            - "sweep with low 30F: orders_blocked == 1; order status BLOCKED, blocked_reason == WEATHER"
            - "sweep with low 40F: orders_unblocked == 1; order status SCHEDULED, blocked_reason == null"

      - name: fund_close_releases_pledged_allocations
        claim_type: side_effect_execution
        grounds: [state_machines.FundingSource.OPEN_to_CLOSED, state_machines.FundAllocation.PLEDGED_to_RELEASED]
        distinguishing_aspect: "Closing a fund cascades: its PLEDGED allocations flip to RELEASED and available_cents is restored."
        test_recipe:
          setup: ["account with ACTIVE TIER_2 enrollment; fund FY2026 appropriated 80000; one PLEDGED allocation of 50000"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "10 Close Ct" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app_id: "$.data.id" }
            - call: "POST /assistance/applications/${app_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: {}
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/funding-sources"
              payload: { name: "Trust 2026", funder_type: "UTILITY_TRUST", fiscal_year: 2026, appropriated_cents: 80000, priority_rank: 1, eligible_tiers: ["TIER_2"] }
              as: ProgramAdmin
              captures: { fund_id: "$.data.id" }
            - call: "POST /assistance/fund-allocations"
              payload: { account_id: "${acct_id}", amount_cents: 50000 }
              as: ProgramAdmin
              captures: { alloc_id: "$.data[0].id" }
          trigger:
            - call: "POST /assistance/funding-sources/${fund_id}/close"
              payload: {}
              as: ProgramAdmin
              captures: { fund_status: "$.data.status" }
            - call: "GET /assistance/fund-allocations/${alloc_id}"
              payload: {}
              as: ProgramAdmin
              captures: { alloc_status: "$.data.status" }
            - call: "GET /assistance/funding-sources/${fund_id}/report"
              payload: {}
              as: ProgramAdmin
              captures: { pledged: "$.data.pledged_cents", released: "$.data.released_cents", avail: "$.data.available_cents" }
          assert:
            - "FundingSource.${fund_id}.status == CLOSED; FundAllocation.${alloc_id}.status == RELEASED (cascade)"
            - "report: pledged_cents == 0, released_cents == 50000, available_cents == 80000"

      - name: referral_expires_after_60_days_boundary
        claim_type: valid_transition
        grounds: [state_machines.AssistanceReferral.INITIATED_to_EXPIRED]
        distinguishing_aspect: "Referral EXPIRED only when clock date is strictly greater than initiated_on + 60 days: alive on 2026-09-30, expired on 2026-10-01."
        test_recipe:
          setup: ["account; referral created at clock default 2026-08-01"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "11 Referral Rd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/referrals"
              payload: { account_id: "${acct_id}", agency_code: "COMM_ACTION" }
              as: CustomerServiceRep
              captures: { ref_id: "$.data.id" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { exp1: "$.data.referrals_expired" }
          trigger:
            - call: "GET /assistance/referrals/${ref_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { st1: "$.data.status" }
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { exp2: "$.data.referrals_expired" }
            - call: "GET /assistance/referrals/${ref_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { st2: "$.data.status" }
          assert:
            - "at 2026-09-30 (== initiated_on + 60): referrals_expired == 0, status stays INITIATED (strictly-greater rule)"
            - "at 2026-10-01: referrals_expired == 1, status == EXPIRED"

      - name: enrollment_lapse_then_recertify_cycle
        claim_type: valid_transition
        grounds: [state_machines.AssistanceEnrollment.ACTIVE_to_LAPSED, state_machines.AssistanceEnrollment.LAPSED_to_ACTIVE]
        distinguishing_aspect: "ACTIVE -> LAPSED at recert date via sweep, then LAPSED -> ACTIVE via recertify against a newer VERIFIED application, adopting the new tier."
        test_recipe:
          setup: ["account; TIER_1 enrollment ACTIVATED 2026-08-01 (recert_due_on 2027-08-01); clock advanced to 2027-08-01 and swept (LAPSED); second application (TIER_2 income) verified"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "12 Recert Rd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id", acct_v: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 1, gross_annual_income_cents: 500000, current_month_income_cents: 40000, expected_account_version: "${acct_v}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app1_id: "$.data.id" }
            - call: "POST /assistance/applications/${app1_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app1_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "GET /assistance/enrollments"
              payload: { application_id: "${app1_id}" }
              as: EligibilitySpecialist
              captures: { enr_id: "$.data[0].id" }
            - call: "POST /assistance/enrollments/${enr_id}/activate"
              payload: {}
              as: CustomerServiceRep
              as_user_id: csr_1
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/ops/daily-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { lapsed_n: "$.data.enrollments_lapsed" }
            - call: "GET /assistance/accounts/${acct_id}"
              payload: {}
              as: CustomerServiceRep
              captures: { acct_v2: "$.data.version" }
            - call: "POST /assistance/applications"
              payload: { account_id: "${acct_id}", household_size: 2, gross_annual_income_cents: 3500000, current_month_income_cents: 300000, expected_account_version: "${acct_v2}" }
              as: CustomerServiceRep
              as_user_id: csr_1
              captures: { app2_id: "$.data.id" }
            - call: "POST /assistance/applications/${app2_id}/begin-review"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
            - call: "POST /assistance/applications/${app2_id}/verify"
              payload: {}
              as: EligibilitySpecialist
              as_user_id: es_1
          trigger:
            - call: "GET /assistance/enrollments/${enr_id}"
              payload: {}
              as: EligibilitySpecialist
              captures: { mid_status: "$.data.status", mid_lapsed: "$.data.lapsed_on" }
            - call: "POST /assistance/enrollments/${enr_id}/recertify"
              payload: { new_application_id: "${app2_id}" }
              as: EligibilitySpecialist
              as_user_id: es_1
              captures: { end_status: "$.data.status", end_tier: "$.data.tier", end_recert: "$.data.recert_due_on" }
          assert:
            - "after sweep at recert date: enrollments_lapsed == 1, status == LAPSED, lapsed_on == 2027-08-01"
            - "after recertify: status == ACTIVE, tier == TIER_2 (adopted from new application), recert_due_on == 2028-08-01"

      - name: certificate_revoke_unblocks_order
        claim_type: side_effect_execution
        grounds: [state_machines.MedicalCertificate.ACTIVE_to_REVOKED, state_machines.ShutoffOrder.BLOCKED_to_SCHEDULED, calculations.protection_gate]
        distinguishing_aspect: "Certificate create immediately BLOCKs an open SCHEDULED order (blocked_reason=MEDICAL); revoke immediately recomputes protection and returns the order to SCHEDULED."
        test_recipe:
          setup: ["account arrearage 120000 (2026-08-01); clock 2026-09-15; manual order SCHEDULED for 2026-09-30; then certificate window [2026-09-10, 2026-10-10) registered"]
          setup_api_calls:
            - call: "POST /assistance/accounts"
              payload: { service_address: "13 Revoke Rd" }
              as: ProgramAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /assistance/accounts/${acct_id}/charges"
              payload: { charge_type: "ARREARAGE", amount_cents: 120000, effective_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /assistance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /assistance/shutoff-orders"
              payload: { account_id: "${acct_id}", scheduled_date: "2026-09-30" }
              as: ProgramAdmin
              captures: { order_id: "$.data.id" }
            - call: "POST /assistance/medical-certificates"
              payload: { account_id: "${acct_id}", physician_name: "Dr. R", physician_license_number: "L-9", condition_class: "SERIOUS", effective_from: "2026-09-10" }
              as: CustomerServiceRep
              captures: { cert_id: "$.data.id" }
            - call: "GET /assistance/shutoff-orders/${order_id}"
              payload: {}
              as: ProgramAdmin
              captures: { st1: "$.data.status", br1: "$.data.blocked_reason" }
          trigger:
            - call: "POST /assistance/medical-certificates/${cert_id}/revoke"
              payload: {}
              as: ProgramAdmin
