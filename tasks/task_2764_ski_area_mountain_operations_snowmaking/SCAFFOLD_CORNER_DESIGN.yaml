      - name: mission_clear_enforces_segregation_of_duties_before_the_cert_requirement
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=19]
          - validations[priority=23]
          - errors[ERR_SOD_VIOLATION]
          - errors[ERR_PATROLLER_CERT_INSUFFICIENT]
          - state_machines.AvalancheMitigationMission.EXECUTED_to_CLEARED
        distinguishing_aspect: |
          EXECUTED -> CLEARED carries two independent preconditions on the acting Patroller: a different
          X-User-ID than the executor (priority 19) and cert level EMT or PARAMEDIC (priority 23). The
          three triggers hit them in isolation and then satisfy both: the executor is rejected for
          identity even though his cert is sufficient, a BASIC patroller with a different identity is
          rejected for cert, and only the third caller succeeds. Ordering matters because a single
          caller could violate both and the higher-priority identity error must win.
        test_recipe:
          setup:
            - "An avalanche area in PREP with mission AV-1 (SKI_CUT) EXECUTED by P1 (EMT)."
            - "P2 is PARAMEDIC and on duty; P3 is BASIC and on duty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
