scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: downtime_credit_provisional_forward_looking_vs_final_chronological_reconciliation
        grounds:
          - calculations.downtime_production_loss_credit
          - state_machines.ReroofProject.AUTHORIZED_to_DEENERGIZED
          - state_machines.ReroofProject.COMMISSIONED_to_CLOSED
          - entities.ReroofProject.fields.provisional_credit_cents
          - entities.ReroofProject.fields.final_credit_cents
          - entities.ReroofProject.fields.credit_released_cents
        distinguishing_aspect: |
          On the money domain of ReroofProject the same downtime produces two different totals: the
          provisional variant reads only downtime_days_estimated (9 planned days, one terminal rounding,
          WorkWindow rows ignored) and yields 5261 cents, while the final variant replays the 7 actual
          calendar dates between deenergized_at and reenergized_at, halves the single date covered by a
          WEATHER_ABORTED WorkWindow, and rounds per day before summing, yielding 3802 cents - a
          1459-cent divergence that settlement books as credit_released_cents.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "A LEASE project (OWNERSHIP_FACTOR 1.00) with baseline_daily_kwh 41.75 and downtime_days_estimated 9, fully consented by roofer, solar owner and third-party system owner, so phase == AUTHORIZED."
            - "Manufacturer notice is on file (warranty_notice_status == FILED) so the single panel may later be reinstalled on a LEASE system."
            - "One circuit S1 carrying one PANEL; the circuit is de-energized on 2026-08-03 (deenergized_at == 2026-08-03T09:00:00Z) which reserves the provisional credit."
            - "The panel is removed, stored in a climate-controlled bin, graded SERVICEABLE."
            - "Exactly one roofing WorkWindow scoped to the single calendar date 2026-08-05 is WEATHER_ABORTED, so weather_abort_count == 1 (below the RESTRICTED threshold of 2) and posture stays OPEN."
            - "One LOW FASTENER_PULLOUT deck finding is WAIVED, advancing phase DECK_WORK -> REINSTALL."
            - "The panel is reinstalled and the circuit re-energized on 2026-08-09 (reenergized_at == 2026-08-09T15:00:00Z), so phase == COMMISSIONED and downtime_days_actual == 7."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example", mobilization_buffer_minutes: 120, license_number: "ROC-118204" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Nguyen Household", party_type: "SOLAR_OWNER", contact_email: "owner@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Helio Lease Holdings", party_type: "SYSTEM_OWNER", contact_email: "asset@helio.example" }
              as: ProjectCoordinator
              captures: { sysowner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "418 Mesquite Way, Tempe AZ", ownership_model: "LEASE", system_dc_kw: 8.4, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", system_owner_party_id: "${sysowner_id}", baseline_daily_kwh: 41.75, downtime_days_estimated: 9, upgrade_budget_cents: 5000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id, proj_v1: $.data.version }
            - call: "POST /reroof/projects/${proj_id}/warranty-notice"
              payload: { manufacturer: "Meridian Solar", notice_reference: "MN-2026-0417", expected_project_version: "${proj_v1}" }
              as: ProjectCoordinator
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${sysowner_id}" }
              as: ProjectCoordinator
              captures: { ap_sys: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "APPROVE" }
              as: SolarOwner
              as_user_id: "${owner_id}"
            - call: "POST /reroof/party-approvals/${ap_sys}/decision"
              payload: { decision: "APPROVE" }
              as: SystemOwner
              as_user_id: "${sysowner_id}"
            - call: "POST /reroof/projects/${proj_id}/array-circuits"
              payload: { circuit_label: "S1", module_count: 1, dc_kw: 0.41 }
              as: ProjectCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/hardware-units"
              payload: { array_circuit_id: "${c1}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0001", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { u1: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/storage-bins"
              payload: { bin_label: "BIN-A", capacity_slots: 4, climate_controlled: true }
              as: ProjectCoordinator
              captures: { bin_a: $.data.id }
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/array-circuits/${c1}/energization"
              payload: { action: "DE_ENERGIZE", interlock_verified: true, isolation_note: "AC disconnect open, DC taped and tagged" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/removal"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/storage"
              payload: { storage_bin_id: "${bin_a}" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/condition-grade"
              payload: { condition_grade: "SERVICEABLE", disposition: "RETAIN" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/work-windows"
              payload: { project_id: "${proj_id}", party_id: "${roofer_id}", trade: "ROOFING", start_utc: "2026-08-05T13:00:00Z", end_utc: "2026-08-05T21:00:00Z", weather_risk_score: 60 }
              as: ProjectCoordinator
              captures: { w1: $.data.id }
            - call: "POST /reroof/work-windows/${w1}/status"
              payload: { action: "WEATHER_ABORT", abort_reason: "Monsoon cell over site, tear-off unsafe" }
              as: ProjectCoordinator
            - call: "POST /reroof/projects/${proj_id}/deck-findings"
              payload: { finding_type: "FASTENER_PULLOUT", severity: "LOW", affected_area_sqft: 20, attachment_count_affected: 2 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f1: $.data.id }
            - call: "POST /reroof/deck-findings/${f1}/upgrade"
              payload: { action: "WAIVE", waiver_reason: "Two fasteners re-seated during tear-off, no upgrade scope required" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T15:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/hardware-units/${u1}/reinstall"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/array-circuits/${c1}/energization"
              payload: { action: "RE_ENERGIZE", interlock_verified: true }
              as: SolarContractor
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /reroof/projects/${proj_id}/credit-settlement"
              payload: { settlement_note: "Lease downtime credit trued up against actual outage dates" }
              as: ProjectCoordinator
          assert:
            - "ReroofProject.${proj_id}.provisional_credit_cents == 5261"
            - "ReroofProject.${proj_id}.final_credit_cents == 3802"
            - "ReroofProject.${proj_id}.final_credit_cents != ReroofProject.${proj_id}.provisional_credit_cents"
            - "ReroofProject.${proj_id}.downtime_days_actual == 7"
            - "ReroofProject.${proj_id}.credit_authorized_cents == 5261"
            - "ReroofProject.${proj_id}.credit_settled_cents == 3802"
            - "ReroofProject.${proj_id}.credit_reserved_cents == 0"
            - "ReroofProject.${proj_id}.credit_released_cents == 1459"
            - "ReroofProject.${proj_id}.phase == CLOSED"

      - name: unit_warranty_manufacturer_strict_vs_installer_lenient_opposite_verdicts
        grounds:
          - calculations.unit_warranty_preservation
          - state_machines.HardwareUnit.ON_ROOF_to_REMOVED
          - state_machines.HardwareUnit.STORED_to_REINSTALLED
          - entities.HardwareUnit.fields.warranty_variant
          - entities.HardwareUnit.fields.warranty_preserved
          - entities.HardwareUnit.fields.warranty_risk_points
          - entities.ReroofProject.fields.warranty_preserved
        distinguishing_aspect: |
          On the HardwareUnit warranty domain - a different entity and a different subject from the
          project-level credit calculation - two panels with identical off_roof_days (20), identical
          condition_grade (SERVICEABLE) and the same climate-controlled bin reach opposite verdicts
          purely because warranty_variant was pinned at removal time: the INSTALLER_LENIENT panel
          removed before the manufacturer notice was filed fails its hard 14-day ceiling
          (warranty_preserved false, warranty_risk_points 25) while the MANUFACTURER_STRICT panel
          removed two hours later passes on the 30-day/climate-controlled path (true, 0 points).
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z."
            - "A LEASE project consented by all three parties, so phase == AUTHORIZED and warranty_notice_status == PENDING."
            - "One circuit S1 carrying two identical 410 W PANELs and one climate-controlled bin BIN-A with 4 slots."
            - "The circuit is de-energized on 2026-08-03T09:00:00Z."
            - "Panel u1 is removed while warranty_notice_status is still PENDING, so its warranty_variant is pinned INSTALLER_LENIENT."
            - "The manufacturer notice is then filed, and panel u2 is removed at 2026-08-03T11:00:00Z on the same calendar date, so its warranty_variant is pinned MANUFACTURER_STRICT."
            - "Both panels are stored in BIN-A and graded SERVICEABLE; a LOW FASTENER_PULLOUT finding is WAIVED so phase becomes REINSTALL."
            - "The clock is advanced to 2026-08-23T10:00:00Z, exactly 20 whole UTC days after removal for both panels."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Nguyen Household", party_type: "SOLAR_OWNER", contact_email: "owner@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Helio Lease Holdings", party_type: "SYSTEM_OWNER", contact_email: "asset@helio.example" }
              as: ProjectCoordinator
              captures: { sysowner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "418 Mesquite Way, Tempe AZ", ownership_model: "LEASE", system_dc_kw: 8.4, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", system_owner_party_id: "${sysowner_id}", baseline_daily_kwh: 41.75, downtime_days_estimated: 9, upgrade_budget_cents: 5000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${sysowner_id}" }
              as: ProjectCoordinator
              captures: { ap_sys: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "APPROVE" }
              as: SolarOwner
              as_user_id: "${owner_id}"
            - call: "POST /reroof/party-approvals/${ap_sys}/decision"
              payload: { decision: "APPROVE" }
              as: SystemOwner
              as_user_id: "${sysowner_id}"
            - call: "POST /reroof/projects/${proj_id}/array-circuits"
              payload: { circuit_label: "S1", module_count: 2, dc_kw: 0.82 }
              as: ProjectCoordinator
              captures: { c1: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/storage-bins"
              payload: { bin_label: "BIN-A", capacity_slots: 4, climate_controlled: true }
              as: ProjectCoordinator
              captures: { bin_a: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/hardware-units"
              payload: { array_circuit_id: "${c1}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0001", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { u1: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/hardware-units"
              payload: { array_circuit_id: "${c1}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0002", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { u2: $.data.id }
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/array-circuits/${c1}/energization"
              payload: { action: "DE_ENERGIZE", interlock_verified: true }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/removal"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "GET /reroof/projects/${proj_id}"
              as: ProjectCoordinator
              captures: { proj_v_mid: $.data.version }
            - call: "POST /reroof/projects/${proj_id}/warranty-notice"
              payload: { manufacturer: "Meridian Solar", notice_reference: "MN-2026-0417", expected_project_version: "${proj_v_mid}" }
              as: ProjectCoordinator
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T11:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/hardware-units/${u2}/removal"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/storage"
              payload: { storage_bin_id: "${bin_a}" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u2}/storage"
              payload: { storage_bin_id: "${bin_a}" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u1}/condition-grade"
              payload: { condition_grade: "SERVICEABLE", disposition: "RETAIN" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u2}/condition-grade"
              payload: { condition_grade: "SERVICEABLE", disposition: "RETAIN" }
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/projects/${proj_id}/deck-findings"
              payload: { finding_type: "FASTENER_PULLOUT", severity: "LOW", affected_area_sqft: 20, attachment_count_affected: 2 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f1: $.data.id }
            - call: "POST /reroof/deck-findings/${f1}/upgrade"
              payload: { action: "WAIVE", waiver_reason: "Fasteners re-seated, no upgrade scope required" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-23T10:00:00Z" }
              as: ProjectCoordinator
          trigger:
            - call: "POST /reroof/hardware-units/${u1}/reinstall"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
            - call: "POST /reroof/hardware-units/${u2}/reinstall"
              payload: {}
              as: SolarContractor
              as_user_id: "${crew_id}"
          assert:
            - "HardwareUnit.${u1}.warranty_variant == INSTALLER_LENIENT"
            - "HardwareUnit.${u2}.warranty_variant == MANUFACTURER_STRICT"
            - "HardwareUnit.${u1}.off_roof_days == 20"
            - "HardwareUnit.${u2}.off_roof_days == 20"
            - "HardwareUnit.${u1}.condition_grade == SERVICEABLE"
            - "HardwareUnit.${u2}.condition_grade == SERVICEABLE"
            - "HardwareUnit.${u1}.warranty_preserved == false"
            - "HardwareUnit.${u1}.warranty_risk_points == 25"
            - "HardwareUnit.${u2}.warranty_preserved == true"
            - "HardwareUnit.${u2}.warranty_risk_points == 0"
            - "ReroofProject.${proj_id}.warranty_preserved == false"
            - "ReroofProject.${proj_id}.reinstalled_unit_count == 2"

  - rule_id: combinatorial_formula
    instances:
      - name: deck_upgrade_cost_mode_a_tier_straddle_flashing_surcharge_and_floor_beating_cap
        grounds:
          - calculations.deck_upgrade_cost
          - state_machines.DeckFinding.OPEN_to_UPGRADE_SCOPED
          - entities.DeckFinding.fields.upgrade_cost_cents
          - entities.ReroofProject.fields.scoped_upgrade_cost_cents
          - validations[priority=30]
        distinguishing_aspect: |
          Mode (a) - non-linear interaction of four inputs with no rounding-order or evaluation-order
          content: a 420 sqft finding straddles all three area tiers (100 x 950 + 200 x 780 + 120 x 640
          = 327800), the FLASHING_FAILURE branch multiplies the attachment leg by 1.25, the HIGH severity
          multiplier scales the sum to 723520; a second finding proves the cap/floor nest is not a plain
          clamp, because its 3150000-cent attachment leg makes the inner max out-rank the 2500000-cent
          cap so the published result legally exceeds CAP_CENTS.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A HOST_OWNED project with upgrade_budget_cents 9000000, so neither scoping trips the priority-30 budget gate."
            - "Finding A is OPEN: FLASHING_FAILURE, HIGH severity, 420 affected_area_sqft (straddles all three area tiers), 36 attachments."
            - "Finding B is OPEN: FLASHING_FAILURE, LOW severity, 10 affected_area_sqft, 600 attachments (attachment leg alone exceeds CAP_CENTS)."
            - "Because finding A is OPEN with HIGH severity the project posture is RESTRICTED, not FROZEN, so both scopings use the standard_scope variant."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 9000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/deck-findings"
              payload: { finding_type: "FLASHING_FAILURE", severity: "HIGH", affected_area_sqft: 420, attachment_count_affected: 36 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f_a: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/deck-findings"
              payload: { finding_type: "FLASHING_FAILURE", severity: "LOW", affected_area_sqft: 10, attachment_count_affected: 600 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f_b: $.data.id }
          trigger:
            - call: "POST /reroof/deck-findings/${f_a}/upgrade"
              payload: { action: "SCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/deck-findings/${f_b}/upgrade"
              payload: { action: "SCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
          assert:
            - "DeckFinding.${f_a}.upgrade_cost_cents == 723520"
            - "DeckFinding.${f_a}.status == UPGRADE_SCOPED"
            - "DeckFinding.${f_a}.scoped_by_party_id == ${roofer_id}"
            - "DeckFinding.${f_b}.upgrade_cost_cents == 3150000"
            - "DeckFinding.${f_b}.upgrade_cost_cents > 2500000"
            - "ReroofProject.${proj_id}.scoped_upgrade_cost_cents == 3873520"
            - "ReroofProject.${proj_id}.posture == RESTRICTED"

      - name: final_credit_mode_b_rounds_per_calendar_day_before_summing
        grounds:
          - calculations.downtime_production_loss_credit
          - state_machines.ReroofProject.COMMISSIONED_to_CLOSED
          - state_machines.WorkWindow.SCHEDULED_to_WEATHER_ABORTED
          - entities.ReroofProject.fields.final_credit_cents
        distinguishing_aspect: |
          Mode (b) - the scaffold pins "round per calendar day, then sum" and the pinned order is
          observable: seven outage dates of which three are covered by WEATHER_ABORTED windows give
          4 x round_half_up(584.5) + 3 x round_half_up(292.25) = 4 x 585 + 3 x 292 = 3216 cents,
          whereas summing first (4 x 584.5 + 3 x 292.25 = 3214.75) and rounding once yields 3215 - so
