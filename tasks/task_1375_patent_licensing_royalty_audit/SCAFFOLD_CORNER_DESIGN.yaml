        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_RESOURCE_OWNER]", "roles[Licensee]"]
        distinguishing_aspect: "Entity-backed identity: a Licensee whose X-User-ID is licensee B cannot submit a report naming licensee A — ERR_NOT_RESOURCE_OWNER (403) fires before any business rule."
        test_recipe:
          setup: ["licensees A and B exist; A's agreement ACTIVE"]
          setup_api_calls:
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Own A", tax_id: "TAX-OA-1", contact_email: "oa@x.test" }
              as: LicensingAnalyst
