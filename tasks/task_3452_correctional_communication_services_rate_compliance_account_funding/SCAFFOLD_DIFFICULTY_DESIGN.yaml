              as: FacilityStaff
          trigger:
            - call: "POST /comm-services/accounts/${acct_sa}/close"
              payload: {}
              as: FacilityStaff
              captures: { refund_sa: $.data.refundable_computed_cents }
            - call: "POST /comm-services/accounts/${acct_lb}/close"
              payload: {}
              as: FacilityStaff
              captures: { refund_lb: $.data.refundable_computed_cents }
          assert:
            - "both accounts had balance_at_closure_cents == 500 with identical ledger shapes"
            - "SA account: refundable_computed_cents == 400 (500 - 100, SIMPLE_BALANCE)"
            - "LB account: refundable_computed_cents == 700 (500 - 100 + 300 intact-deposit fee refund, LIFO_NET)"
            - "both close responses carry a non-null latest_refund_request_id"
            - "refund_sa != refund_lb although the two ledgers are identical"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: call_charge_ceil_min_cap_and_affordability_cutoff
        grounds:
          - calculations.call_charge
          - calculations.effective_rate_snapshot
          - entities.CallRecord.fields.billable_minutes
        distinguishing_aspect: |
          Mode (a) combinatorial: the charge formula nests ceil minute rounding, a
          charge-time min(schedule rate, current cap), and a floor affordability cutoff
          over 4 inputs (duration, pinned vs current rate, connection fee, balance) —
          a 61-second call bills 2 full minutes at 25/min (250 with the 200 connection
          fee), while after a cap amendment to 21 the same 260-cent balance affords only
          floor(60/21) = 2 minutes of a 600-second call (charge 242, cutoff CREDIT/BALANCE
          truncation) — neither output is a linear function of any single input.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Base facility (state ST, cap per-minute 25 -> later amended to 21), ACTIVE contract (deposit fee 25), ACTIVE schedule (interstate 25, connection 200)."
            - "Two PREPAID accounts A1 and A2 for the same inmate, each with one deposit of 285 (fee 25 -> balance 260) and one verified recipient."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /comm-services/regulatory-caps"
              payload: { state_code: "ST", max_per_minute_cents: 25, max_connection_fee_cents: 300, max_ancillary_fee_cents: 500, max_deposit_fee_cents: 500, max_commission_pct: 0.6, refund_method: "SIMPLE_BALANCE", dormancy_days: 30, claim_window_days: 45 }
              as: StateRegulator
              captures: { cap_id: $.data.id, cap_v: $.data.version }
            - call: "POST /comm-services/facilities"
              payload: { name: "Charge Lab", state_code: "ST", video_booth_count: 2, video_turnover_minutes: 10, max_session_minutes: 30, visiting_open_minutes: 480, visiting_close_minutes: 1200, daily_session_limit_per_inmate: 2 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /comm-services/contracts"
              payload: { facility_id: "${fac_id}", commission_pct: 0.5, commission_basis: "GROSS", deposit_fee_cents: 25, closure_fee_cents: 100, effective_from: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /comm-services/contracts/${c_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/contracts/${c_id}/rate-schedules"
              payload: { local_per_minute_cents: 18, intrastate_per_minute_cents: 21, interstate_per_minute_cents: 25, international_per_minute_cents: 25, connection_fee_cents: 200, message_price_cents: 15, video_session_fee_cents: 500 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /comm-services/rate-schedules/${s_id}/activate"
              payload: { expected_contract_version: "${c_v}" }
              as: PlatformAdmin
            - call: "POST /comm-services/facilities/${fac_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /comm-services/inmates"
              payload: { facility_id: "${fac_id}", booking_number: "B-3001", full_name: "Inmate Charge" }
              as: FacilityStaff
              captures: { inm_id: $.data.id }
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam A1", owner_contact: "a1@x.com" }
              as: FacilityStaff
              captures: { a1_id: $.data.id }
            - call: "POST /comm-services/recipient-numbers"
              payload: { account_id: "${a1_id}", e164_number: "+15550004444", label: "R1", relationship_type: "FAMILY" }
              as: AccountHolder
              as_user_id: "${a1_id}"
              captures: { r1_id: $.data.id, r1_code: $.data.verification_code }
            - call: "POST /comm-services/recipient-numbers/${r1_id}/verify"
              payload: { verification_code: "${r1_code}", consent_to_recording: true }
              as: RecipientParty
              as_user_id: "${r1_id}"
            - call: "POST /comm-services/accounts/${a1_id}/deposits"
              payload: { amount_cents: 285 }
              as: AccountHolder
              as_user_id: "${a1_id}"
            - call: "POST /comm-services/accounts"
              payload: { facility_id: "${fac_id}", inmate_id: "${inm_id}", funding_model: "PREPAID", owner_name: "Fam A2", owner_contact: "a2@x.com" }
              as: FacilityStaff
              captures: { a2_id: $.data.id }
            - call: "POST /comm-services/recipient-numbers"
              payload: { account_id: "${a2_id}", e164_number: "+15550005555", label: "R2", relationship_type: "FAMILY" }
              as: AccountHolder
              as_user_id: "${a2_id}"
              captures: { r2_id: $.data.id, r2_code: $.data.verification_code }
            - call: "POST /comm-services/recipient-numbers/${r2_id}/verify"
              payload: { verification_code: "${r2_code}", consent_to_recording: true }
              as: RecipientParty
              as_user_id: "${r2_id}"
            - call: "POST /comm-services/accounts/${a2_id}/deposits"
              payload: { amount_cents: 285 }
              as: AccountHolder
              as_user_id: "${a2_id}"
          trigger:
            - call: "POST /comm-services/calls"
              payload: { account_id: "${a1_id}", inmate_id: "${inm_id}", recipient_number_id: "${r1_id}", call_type: "INTERSTATE" }
              as: FacilityStaff
              captures: { call1_id: $.data.id, call1_rate: $.data.applied_per_minute_cents }
            - call: "POST /comm-services/calls/${call1_id}/end"
              payload: { duration_seconds: 61 }
              as: FacilityStaff
              captures: { call1_bill: $.data.billable_minutes, call1_charge: $.data.total_charge_cents, call1_cutoff: $.data.cutoff_reason }
            - call: "PUT /comm-services/regulatory-caps/${cap_id}"
              payload: { expected_regulatory_cap_version: "${cap_v}", max_per_minute_cents: 21 }
              as: StateRegulator
            - call: "POST /comm-services/calls"
              payload: { account_id: "${a2_id}", inmate_id: "${inm_id}", recipient_number_id: "${r2_id}", call_type: "INTERSTATE" }
              as: FacilityStaff
              captures: { call2_id: $.data.id, call2_rate: $.data.applied_per_minute_cents }
            - call: "POST /comm-services/calls/${call2_id}/end"
              payload: { duration_seconds: 600 }
              as: FacilityStaff
              captures: { call2_bill: $.data.billable_minutes, call2_charge: $.data.total_charge_cents, call2_cutoff: $.data.cutoff_reason }
          assert:
            - "call1 (before amendment): applied_per_minute_cents == 25, billable_minutes == 2 for a 61-second call (ceil), total_charge_cents == 250, cutoff_reason == NONE"
            - "Account.${a1_id}.balance_cents == 10 after call1"
            - "call2 (after cap amendment to 21): applied_per_minute_cents == 21 via the charge-time min(), billable_minutes == 2 of a 600-second call (floor affordability), total_charge_cents == 242, cutoff_reason == BALANCE_EXHAUSTED"
            - "Account.${a2_id}.balance_cents == 18 after call2"

      - name: commission_aggregate_rounding_beats_per_line_sum
        grounds:
          - calculations.site_commission_accrual
          - calculations.regulatory_summary_aggregation
        distinguishing_aspect: |
          Mode (b) combinatorial (nested-rounding order), distinct from the sibling's
          mode (a): commission_pct 0.5 applied once to the aggregate 306-cent base rounds
          to 153, while rounding each call's commission first (51 + 51 + 52) sums to 154 —
          the scaffold pins aggregate-then-round, so 153 is correct and 154 is the
          non-conformant reading of the same prose.
        test_recipe:
          setup:
