        test_recipe:
          setup:
            - "two applicants are registered and neither has been decided yet"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Ava Reyes", email: "ava.reyes@example.com", date_of_birth: "2005-04-12", education_status: "HS_DIPLOMA", household_income_cents: 4500000 }
              as: Anonymous
