            - call: "POST /copyright/works"
              payload: { title: "W", work_type: "LITERARY", year_of_creation: 2024, author_name: "A", owner_shares: [{ name: "A", share_bps: 10000 }] }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { w_id: $.data.id }
            - call: "POST /copyright/applications"
              payload: { work_id: "${w_id}", filing_basis: "STANDARD" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { app_id: $.data.id }
            - call: "POST /copyright/applications/${app_id}/submit"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/applications/${app_id}/pay-fee"
              payload: { amount_cents: 6500 }
              as: RightsHolder
              as_user_id: "rh_1"
            - call: "POST /copyright/deposits"
              payload: { application_id: "${app_id}", deposit_type: "ELECTRONIC", copy_count: 1 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { dep_id: $.data.id }
            - call: "POST /copyright/deposits/${dep_id}/accept"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/begin-examination"
              payload: {}
              as: Examiner
            - call: "POST /copyright/applications/${app_id}/register"
              payload: {}
              as: Examiner
            - call: "POST /copyright/licenses"
              payload: { work_id: "${w_id}", licensee_name: "L", license_type: "NON_EXCLUSIVE", right_type: "REPRODUCTION", territory: "US", start_date: "2026-01-01T00:00:00Z", end_date: "2027-01-01T00:00:00Z", grant_date: "2026-01-01T00:00:00Z", royalty_rate_bps: 1500, royalty_basis: "GROSS" }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { lic_id: $.data.id }
            - call: "POST /copyright/royalty-statements"
              payload: { license_id: "${lic_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", gross_revenue_cents: 22220 }
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { rs_id: $.data.id }
            - call: "POST /copyright/royalty-statements/${rs_id}/post"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
          trigger:
            - call: "POST /copyright/royalty-statements/${rs_id}/reverse"
              payload: {}
              as: RightsHolder
              as_user_id: "rh_1"
              captures: { st: $.data.status }
          assert:
            - "License.${lic_id}.escrow_balance_cents == 0"
            - "RoyaltyStatement.${rs_id}.status == REVERSED"
