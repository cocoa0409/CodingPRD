            - "Pasture.${pa}.stocked_head_count == 97"
            - "Pasture.${pb}.stocked_head_count == 97"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: base_charge_adg_tier_selection_and_gain_cap_mode_a
        grounds:
          - calculations.settlement_base_charge
          - calculations.settlement_gain
          - entities.GrazingContract.fields.billing_mode
          - entities.Settlement.fields.average_daily_gain
        distinguishing_aspect: |
          MODE (a): a five-input non-linear formula — the branch on billing_mode, a
          tier lookup over average_daily_gain, a min() cap at head_count_committed x 250 lb
          and the rate multiplication interact, so an ADG of exactly 1.5000 selects the
          1.10 multiplier and produces 1485000 cents where 1.4999 would produce 1349910.
        test_recipe:
          setup:
            - "Pasture Sage Flat (700 acres, DRY_MATTER 1700 lb/acre at 25% utilization) is AVAILABLE at 11442 rated head-days."
            - "Contract K5 is ACTIVE: PER_POUND_OF_GAIN at 90 cents/lb, zero shrink both ends, 100 head committed, window 2026-08-10 to 2026-11-18 (100 days)."
            - "Lot L5 received 100 head at 50000 lb and weighed out 100 head at 65000 lb on 2026-11-18, giving exactly 15000 lb of gain over 100 days."
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /grazing/cattle-owners"
              payload: { legal_name: "Sixteen Mile Cattle Co", state_code: "MT", brand_registration: "MT-4471", credit_limit_cents: 5000000 }
