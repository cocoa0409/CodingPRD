  - section: Consistency Model
    instances:
      - name: every_ledger_and_roster_field_touched_by_a_confirmation_is_already_correct_on_the_next_read
        claim_type: immediate
        grounds: ["endpoints[POST /assignments/{id}/confirm]", "calculations[courthouse_encumbrance_ledger]", entities.Courthouse.available_pay_cents, entities.Interpreter.pending_pay_cents, "complexity_profile.consistency_model"]
        distinguishing_aspect: "The consistency model is immediate, so the four rows a single confirmation touches — the assignment, the hearing, the new pay claim and the courthouse ledger — plus the interpreter's denormalised pending_pay_cents must all read correctly on the very next request, and the list endpoints must already filter on the new states. Nothing is allowed to lag behind a recomputation pass or a later sweep."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Language spa; Courthouse Central Justice Center with pay_budget_cents 5000000; one open-ended RateSchedule from 2026-01-01 (certified_hourly_cents 8750, minimum_call_hours 2.0)."
