            - "the same read returns data.cycle_ordinal == 0 and data.credit_balance_cents == 0 (the failed cycle advanced nothing)"
            - "GET /device-orders/${ord_c2} still returns data.fulfillment_status == \"DELIVERED\" (the failure is scoped to the subscription)"
