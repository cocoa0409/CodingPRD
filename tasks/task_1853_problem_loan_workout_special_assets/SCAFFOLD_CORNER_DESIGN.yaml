          assert:
            - "HTTP 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: nonaccrual_threshold_90_days
        claim_type: satisfaction_vs_violation
        grounds: [entities.Loan, calculations_constants]
        distinguishing_aspect: "aging-refresh to 89 leaves nonaccrual false; refresh to exactly 90 flips nonaccrual true (>= boundary inclusive)."
        test_recipe:
          setup: ["PERFORMING loan with days_past_due 0"]
          setup_api_calls:
            - call: "POST /borrowers"
              payload: { legal_name: "Aging Co", tax_id: "55-0000018", naics_code: "541690", internal_risk_rating: 4 }
              as: WorkoutOfficer
              captures: { bor_id: $.data.id }
            - call: "POST /loans"
              payload: { borrower_id: "${bor_id}", loan_number: "LN-V01", original_principal_cents: 8000000, contractual_rate_bps: 700, days_past_due: 0 }
              as: WorkoutOfficer
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/aging-refresh"
              payload: { days_past_due: 89 }
              as: LoanAccounting
              as_user_id: "acct-v1"
              captures: { na89: $.data.nonaccrual }
            - call: "POST /loans/${loan_id}/aging-refresh"
              payload: { days_past_due: 90 }
              as: LoanAccounting
              as_user_id: "acct-v1"
              captures: { na90: $.data.nonaccrual }
          assert:
            - "At 89 days: nonaccrual == false"
            - "At exactly 90 days: nonaccrual == true (>= 90 inclusive)"

