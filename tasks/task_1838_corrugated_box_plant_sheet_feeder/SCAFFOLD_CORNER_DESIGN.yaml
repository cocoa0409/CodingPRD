# =============================================================================
# §1.9 Scaffold Corner Design — Corrugated Box Plant & Sheet Feeder
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Negative triggers capture $.data.error_id. All literals pre-computed.
# =============================================================================

scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # From Table 1 (Entities)
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_account_creation_defaults_and_system_fields
        claim_type: creation
        grounds:
          - entities.CustomerAccount
        distinguishing_aspect: "Create returns 201 with system fields server-minted: id present, version == 1, credit_exposure_dollars defaulted to 0, created_at == updated_at."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id, cust_v: $.data.version, cust_exp: $.data.credit_exposure_dollars } }
          assert:
            - "HTTP 201; ${cust_id} is a server-minted UUID; version == 1"
            - "credit_exposure_dollars == 0 (computed default, not client-set)"
            - "created_at == updated_at (ISO 8601 UTC, three fractional digits)"

      - name: board_grade_duplicate_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.BoardGrade.fields.grade_code
          - errors[ERR_DUPLICATE_CODE]
          - validations[priority=6]
        distinguishing_aspect: "grade_code uniqueness: the second POST with code 32C fails 409 ERR_DUPLICATE_CODE while a different code succeeds."
        test_recipe:
          setup: ["Grade 32C already registered"]
          setup_api_calls:
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin }
          trigger:
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "42/26/42", flute: "B", ect_rating_lbs_per_in: 40, burst_rating_psi: 250, basis_weight_lbs_per_msf: 110.0 }, as: PlantAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DUPLICATE_CODE, HTTP 409"

      - name: box_order_computed_fields_and_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.BoxOrder.fields.area_sqft_per_box
          - entities.BoxOrder.fields.color_count
          - entities.BoxOrder.fields.corrugator_run_id
        distinguishing_aspect: "Computed fields are server-derived: a client-sent area_sqft_per_box of 999.0 is ignored and the response carries the computed 7.25, color_count 2, corrugator_run_id null, status DRAFT."
        test_recipe:
          setup: ["Customer Acme and grade 32C exist"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"], area_sqft_per_box: 999.0 }, as: SalesRep, captures: { ord_id: $.data.id, ord_area: $.data.area_sqft_per_box, ord_colors: $.data.color_count } }
          assert:
            - "HTTP 201; area_sqft_per_box == 7.25 (client-sent 999.0 ignored)"
            - "color_count == 2; corrugator_run_id == null; status == DRAFT"

      - name: box_order_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.BoxOrder.fields.quantity
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required field quantity fails 400 ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup: ["Customer Acme and grade 32C exist"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST, HTTP 400"

      - name: box_order_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.BoxOrder.fields.routing_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "routing_type 'SPIRAL' is not in {DIE_CUT, SLOTTED} and fails 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Customer Acme and grade 32C exist"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SPIRAL", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST, HTTP 400"

      - name: box_order_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID fails 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/box-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND, HTTP 404"

      - name: box_order_fk_reference_not_found
        claim_type: parent_relationships
        grounds:
          - entities.BoxOrder.fields.board_grade_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "A body FK (board_grade_id) that does not resolve fails 404 ERR_NOT_FOUND at existence priority 3, before ECT or supplier business rules."
        test_recipe:
          setup: ["Customer Acme exists; no grades"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 99 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND, HTTP 404 (not ERR_ECT_SPEC_NOT_MET — existence outranks business rules)"

      - name: box_order_list_pagination
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "List endpoint honors limit/offset with total_count and has_more: 3 orders, limit 2 -> 2 items, has_more true; offset 2 -> 1 item, has_more false."
        test_recipe:
          setup: ["Customer Acme, grade 32C, and three SLOTTED orders exist"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 200, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 300, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep }
          trigger:
            - { call: "GET /api/box-orders", payload: { limit: 2 }, as: SalesRep, captures: { first_id: "$.data[0].id" } }
            - { call: "GET /api/box-orders", payload: { limit: 2, offset: 2 }, as: SalesRep, captures: { last_id: "$.data[0].id" } }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2 (offset 2): 1 item, total_count == 3, has_more == false"
            - "${first_id} != ${last_id}"

      - name: box_order_ink_colors_default_empty
        claim_type: defaults
        grounds:
          - entities.BoxOrder.fields.ink_colors
          - entities.BoxOrder.fields.color_count
        distinguishing_aspect: "Omitting optional ink_colors defaults to [] with color_count 0, and the quote then carries no color surcharge (rate == unit price)."
        test_recipe:
          setup: ["Customer Acme, grade 32C exist"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 1000, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep, captures: { ord_id: $.data.id, ord_cc: $.data.color_count, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_merch: $.data.merchandise_total_dollars } }
          assert:
            - "color_count == 0 and ink_colors == []"
            - "merchandise_total_dollars == 166.67 (= round2(3.3333 x (50.00 + 1.50 x 0) x 1.00)) — no color surcharge"

  # ---------------------------------------------------------------------------
  # From Table 2 (State Machines)
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds:
          - state_machines.BoxOrder
          - state_machines.PriceQuote
          - state_machines.InventoryProgram
        distinguishing_aspect: "New entities start in their declared initial states: BoxOrder DRAFT, PriceQuote OPEN, InventoryProgram ACTIVE."
        test_recipe:
          setup: ["Customer Acme, grade 32C exist"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep, captures: { ord_id: $.data.id, ord_st: $.data.status, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_st: $.data.status } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 10, replenishment_qty: 500 }, as: SalesRep, captures: { prog_st: $.data.status } }
          assert:
            - "BoxOrder initial status == DRAFT (then QUOTED after the quote call)"
            - "PriceQuote initial status == OPEN"
            - "InventoryProgram initial status == ACTIVE, on_hand_qty == 0, committed_qty == 0, available_qty == 0"

      - name: cancel_invoiced_order_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.BoxOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "INVOICED is terminal for BoxOrder: cancel from INVOICED fails 409 ERR_INVALID_STATE and the order remains INVOICED."
        test_recipe:
          setup: ["ORD-1 fully produced and invoiced (produced_qty 2100)"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_id: $.data.id } }
            - { call: "POST /api/converting-bookings/${bk_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/converting-bookings/${bk_id}/complete", payload: { produced_qty: 2100 }, as: ProductionPlanner }
            - { call: "POST /api/box-orders/${ord_id}/invoice", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/cancel", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE, HTTP 409"
            - "BoxOrder.${ord_id}.status remains INVOICED"

      - name: resolved_claim_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.QualityClaim
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "RESOLVED_CREDIT is terminal: a further start-review fails ERR_INVALID_STATE, and final_credit_dollars stays 51.16."
        test_recipe:
          setup: ["ORD-1 invoiced (produced 2100, merchandise 1074.28); claim filed by cs-100 (TRANSIT_DAMAGE, claimed 500), reviewed, resolved CREDIT verified 100 with no freight"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_id: $.data.id } }
            - { call: "POST /api/converting-bookings/${bk_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/converting-bookings/${bk_id}/complete", payload: { produced_qty: 2100 }, as: ProductionPlanner }
            - { call: "POST /api/box-orders/${ord_id}/invoice", payload: {}, as: SalesRep }
            - { call: "POST /api/quality-claims", payload: { box_order_id: "${ord_id}", claim_type: "TRANSIT_DAMAGE", defective_qty_claimed: 500 }, as: CustomerService, as_user_id: "cs-100", captures: { clm_id: $.data.id } }
            - { call: "POST /api/quality-claims/${clm_id}/start-review", payload: {}, as: ClaimsAdjuster, as_user_id: "adj-200" }
            - { call: "POST /api/quality-claims/${clm_id}/resolve", payload: { outcome: "CREDIT", defective_qty_verified: 100 }, as: ClaimsAdjuster, as_user_id: "adj-200", captures: { clm_final: $.data.final_credit_dollars } }
          trigger:
            - { call: "POST /api/quality-claims/${clm_id}/start-review", payload: {}, as: ClaimsAdjuster, as_user_id: "adj-200", captures: { err: $.data.error_id } }
          assert:
            - "Resolved credit was 51.16 (= round2(100 x 0.5116) + 0 freight)"
            - "err == ERR_INVALID_STATE, HTTP 409; claim stays RESOLVED_CREDIT with final_credit_dollars 51.16"

      - name: accept_already_accepted_quote_returns_quote_not_open
        claim_type: idempotency
        grounds:
          - state_machines.PriceQuote.OPEN_to_ACCEPTED
          - errors[ERR_QUOTE_NOT_OPEN]
        distinguishing_aspect: "Accepting the same quote twice: the second attempt finds the quote ACCEPTED, not OPEN, and fails 409 ERR_QUOTE_NOT_OPEN; no double acceptance side effects."
        test_recipe:
          setup: ["ORD-1 with quote accepted (order ACCEPTED, committed_value 1284.12)"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_QUOTE_NOT_OPEN, HTTP 409"
            - "CustomerAccount.${cust_id}.credit_exposure_dollars remains 1284.12 (not double-counted)"

      - name: requote_supersedes_prior_open_quote
        claim_type: side_effect_execution
        grounds:
          - state_machines.PriceQuote.OPEN_to_SUPERSEDED
          - state_machines.BoxOrder.QUOTED_to_QUOTED
        distinguishing_aspect: "The QUOTED->QUOTED re-quote loop marks the prior OPEN quote SUPERSEDED; the order stays QUOTED and its version increments by exactly 1 per quote."
        test_recipe:
          setup: ["ORD-1 with quote Q1 created (order version 2)"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_1: $.data.id } }
            - { call: "GET /api/box-orders/${ord_id}", as: SalesRep, captures: { ord_v2: $.data.version } }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 65.00, expires_on: "2026-12-31", expected_order_version: "${ord_v2}" }, as: SalesRep, captures: { quo_2: $.data.id } }
            - { call: "GET /api/box-orders/${ord_id}/quotes", as: SalesRep }
          assert:
            - "Quote ${quo_1}.status == SUPERSEDED; quote ${quo_2}.status == OPEN with unit_price_per_msf 65.00"
            - "BoxOrder.${ord_id}.status == QUOTED and version == 3"
            - "Exactly one OPEN quote remains on the order"

      - name: order_cancel_from_die_cut_queued_cancels_booking_and_frees_minutes
        claim_type: side_effect_execution
        grounds:
          - state_machines.BoxOrder.DIE_CUT_QUEUED_to_CANCELLED
          - state_machines.ConvertingBooking.QUEUED_to_CANCELLED
          - calculations.shift_capacity_rollup
        distinguishing_aspect: "Compensation pattern: cancelling a DIE_CUT_QUEUED order cancels its QUEUED booking and returns the booking's 120 minutes to the shift (scheduled 120 -> 0)."
        test_recipe:
          setup: ["ORD-1 die-cut order booked on a DIE_CUTTER shift at [480,600) (DIE_CUT_QUEUED); shift scheduled_minutes == 120"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/cancel", payload: {}, as: SalesRep, captures: { ord_st: $.data.status } }
            - { call: "GET /api/work-shifts/${sh_die}", as: ProductionPlanner, captures: { sh_sched: $.data.scheduled_minutes, sh_avail: $.data.available_minutes } }
          assert:
            - "BoxOrder.${ord_id}.status == CANCELLED"
            - "ConvertingBooking.${bk_id}.status == CANCELLED (via GET /api/converting-bookings/${bk_id})"
            - "Shift scheduled_minutes == 0 and available_minutes == 480 (minutes fully restored)"

      - name: run_cancel_reverts_orders_direct
        claim_type: side_effect_execution
        grounds:
          - state_machines.CorrugatorRun.SCHEDULED_to_CANCELLED
        excluded_because:
          difficulty_instance: work_shift_cancel_two_hop_cascade_to_orders
          rationale: "The same CorrugatorRun.SCHEDULED_to_CANCELLED transition and its order-revert side effects are asserted there via the shift-cancel trigger; the direct run-cancel endpoint fires the identical transition."

      - name: sheet_feeder_order_bypasses_corrugator
        claim_type: valid_transition
        grounds:
          - state_machines.BoxOrder.ACCEPTED_to_AWAITING_CONVERTING
        distinguishing_aspect: "A SHEET_FEEDER order goes ACCEPTED -> AWAITING_CONVERTING via mark-sheets-received without any CorrugatorRun (corrugator_run_id stays null) — the sheet-feeder supply path."
        test_recipe:
          setup: ["ORD-S: SLOTTED SHEET_FEEDER order (supplier SheetCo) accepted"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "SHEET_FEEDER", sheet_supplier_name: "SheetCo", quantity: 4000, blank_width_in: 30.0, blank_length_in: 40.0, min_ect_required: 30, ink_colors: ["BLACK"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 90.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id, quo_merch: $.data.merchandise_total_dollars, quo_freight: $.data.freight_charge_dollars, quo_total: $.data.quote_total_dollars } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/mark-sheets-received", payload: {}, as: ProductionPlanner, captures: { ord_st: $.data.status } }
          assert:
            - "BoxOrder.${ord_id}.status == AWAITING_CONVERTING and corrugator_run_id == null"
            - "Sheet-fed quote (1 ink, LOCAL at 120.0 mi): billable_msf 33.3332, merchandise_total_dollars == 3049.99 (= round2(33.3332 x 91.50)), freight_charge_dollars == 600.00, quote_total_dollars == 3649.99"

  # ---------------------------------------------------------------------------
  # From Table 3 (Calculations)
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: trim_waste_pct_correct_result_two_order_run
        claim_type: correct_result
        grounds:
          - calculations.trim_optimization
        distinguishing_aspect: "Two attached orders (29 in x 2 outs + 24 in x 1 out = 82 in on an 87 in web) yield consumed_width_in 82, trim_waste_in 5.0, trim_waste_pct 5.75."
        test_recipe:
          setup:
            - "Customer Acme, grade 32C; ORD-A (29x36, qty 2000) and ORD-B (24x20, qty 1000) both ACCEPTED"
            - "CORRUGATOR shift [480,960); RUN [480,720) web 87"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: [] }, as: SalesRep, captures: { ord_a: $.data.id, ord_a_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_a}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_a_v}" }, as: SalesRep, captures: { quo_a: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_a}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 1000, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_b: $.data.id, ord_b_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_b}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_b_v}" }, as: SalesRep, captures: { quo_b: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_b}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_a}", outs: 2 }, as: ProductionPlanner, captures: { consumed_1: $.data.consumed_width_in, waste_1: $.data.trim_waste_in } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_b}", outs: 1 }, as: ProductionPlanner, captures: { consumed_2: $.data.consumed_width_in, waste_2: $.data.trim_waste_in, pct_2: $.data.trim_waste_pct } }
          assert:
            - "After ORD-A attach: consumed_width_in == 58, trim_waste_in == 29 (waste gate not judged at attach)"
            - "After ORD-B attach: consumed_width_in == 82, trim_waste_in == 5, trim_waste_pct == 5.75 (= round2(100 x 5 / 87))"
            - "Both orders SCHEDULED with corrugator_run_id == ${run_id}"

      - name: billable_msf_four_decimal_rounding_precision
        claim_type: precision
        grounds:
          - calculations.freight_tiered_pricing
        distinguishing_aspect: "area rounds to 8.3333 and billable_msf to 33.3332 at 4dp half-up (not 33.3333); the 4dp pin changes merchandise by cents versus naive rounding."
        test_recipe:
          setup: ["Customer Delta (200.0 mi REGIONAL), grade 32C; order SLOTTED 30x40 qty 4000 no inks"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Delta Regional", ship_to_city: "Stockton", distance_miles_from_plant: 200.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 4000, blank_width_in: 30.0, blank_length_in: 40.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 90.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { bill: $.data.billable_msf, merch: $.data.merchandise_total_dollars, fr: $.data.freight_charge_dollars, tot: $.data.quote_total_dollars } }
          assert:
            - "billable_msf == 33.3332 (= round4(4000 x 8.3333 / 1000))"
            - "merchandise_total_dollars == 2999.99 (= round2(33.3332 x 90.00)); freight_charge_dollars == 1066.66 (REGIONAL 32.00/MSF); quote_total_dollars == 4066.65"

      - name: reorder_threshold_equality_flips_into_need
        claim_type: boundary_edge
        grounds:
          - calculations.reorder_threshold_check
          - state_machines.InventoryProgram.ACTIVE_to_REPLENISHMENT_NEEDED
        distinguishing_aspect: "The <= comparison is inclusive: a ship that lands on_hand exactly AT the reorder point (100 == 100) flips the program to REPLENISHMENT_NEEDED."
        test_recipe:
          setup: ["Program reorder_point 100 stocked to 400; release of 300 approved"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 100, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 400 }, as: ProductionPlanner }
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 300, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_id: $.data.id } }
            - { call: "POST /api/release-orders/${rel_id}/approve", payload: {}, as: PlantAdmin }
          trigger:
            - { call: "POST /api/release-orders/${rel_id}/ship", payload: {}, as: ProductionPlanner }
          assert:
            - "InventoryProgram.${prog_id}.on_hand_qty == 100 and status == REPLENISHMENT_NEEDED (100 <= 100 triggers)"

      - name: receipt_to_exactly_reorder_point_stays_in_need
        claim_type: boundary_edge
        grounds:
          - calculations.reorder_threshold_check
          - state_machines.InventoryProgram.REPLENISHMENT_NEEDED_to_ACTIVE
        distinguishing_aspect: "The recovery comparison is strictly greater: a receipt landing on_hand exactly at the reorder point (50 + 50 == 100 == 100) does NOT flip back to ACTIVE."
        test_recipe:
          setup: ["Program reorder_point 100 in REPLENISHMENT_NEEDED with on_hand 50 (after shipping 350 of 400)"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 100, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 400 }, as: ProductionPlanner }
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 350, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { rel_id: $.data.id } }
            - { call: "POST /api/release-orders/${rel_id}/approve", payload: {}, as: PlantAdmin }
            - { call: "POST /api/release-orders/${rel_id}/ship", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 50 }, as: ProductionPlanner, captures: { prog_st: $.data.status, prog_on: $.data.on_hand_qty } }
          assert:
            - "on_hand_qty == 100 and status remains REPLENISHMENT_NEEDED (strict > required to recover)"

      - name: overrun_tolerance_inclusive_band
        claim_type: boundary_edge
        grounds:
          - validations[priority=6]
          - errors[ERR_OVERRUN_TOLERANCE_EXCEEDED]
          - state_machines.ConvertingBooking.RUNNING_to_COMPLETED
        distinguishing_aspect: "The +/-10% band is inclusive: produced_qty 2201 (> ceil(1.10 x 2000) = 2200) fails and the booking stays RUNNING; the retry at exactly 2200 succeeds."
        test_recipe:
          setup: ["ORD-1 (qty 2000) booked and RUNNING on a DIE_CUTTER shift"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_id: $.data.id } }
            - { call: "POST /api/converting-bookings/${bk_id}/start", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/converting-bookings/${bk_id}/complete", payload: { produced_qty: 2201 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
            - { call: "POST /api/converting-bookings/${bk_id}/complete", payload: { produced_qty: 2200 }, as: ProductionPlanner, captures: { bk_st: $.data.status } }
          assert:
            - "2201 fails: err == ERR_OVERRUN_TOLERANCE_EXCEEDED, HTTP 422; booking stays RUNNING"
            - "2200 (== ceil(1.10 x 2000), inclusive bound) succeeds: booking COMPLETED, order PRODUCED with produced_qty 2200"

      - name: credit_exposure_rollup_accept_then_invoice
        claim_type: correct_result
        grounds:
          - calculations.credit_exposure_rollup
        distinguishing_aspect: "Derived-field reconciliation: exposure jumps to 1284.12 at accept (ACCEPTED orders count) and falls to 0.00 at invoice (INVOICED orders leave the input set)."
        test_recipe:
          setup: ["ORD-1 accepted (committed 1284.12), produced 2100, ready to invoice"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "GET /api/customer-accounts/${cust_id}", as: SalesRep, captures: { exp_after_accept: $.data.credit_exposure_dollars } }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_id: $.data.id } }
            - { call: "POST /api/converting-bookings/${bk_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/converting-bookings/${bk_id}/complete", payload: { produced_qty: 2100 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/box-orders/${ord_id}/invoice", payload: {}, as: SalesRep }
            - { call: "GET /api/customer-accounts/${cust_id}", as: SalesRep, captures: { exp_after_invoice: $.data.credit_exposure_dollars } }
          assert:
            - "After accept: credit_exposure_dollars == 1284.12"
            - "After invoice: credit_exposure_dollars == 0 (INVOICED excluded from the input set)"

  # ---------------------------------------------------------------------------
  # From Table 4 (Validations)
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID fails 401 ERR_UNAUTHENTICATED at priority 1, before role or existence checks."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED, HTTP 401"

      - name: booking_machine_mismatch_beats_outside_window
        claim_type: priority_ordering
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_MACHINE_TYPE_MISMATCH]
          - errors[ERR_OUTSIDE_SHIFT_WINDOW]
        distinguishing_aspect: "One booking violates machine compatibility (SLOTTED order onto a CORRUGATOR shift, priority 6) and window containment ([0,10) outside [480,960), priority 8); the constraint error wins."
        test_recipe:
          setup: ["ORD-S (SLOTTED SHEET_FEEDER) accepted and marked sheets-received -> AWAITING_CONVERTING; a CORRUGATOR shift [480,960) exists"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "SHEET_FEEDER", sheet_supplier_name: "SheetCo", quantity: 4000, blank_width_in: 30.0, blank_length_in: 40.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 90.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/box-orders/${ord_id}/mark-sheets-received", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
          trigger:
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_corr}", start_minute: 0, end_minute: 10 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MACHINE_TYPE_MISMATCH (priority 6 constraint) — NOT ERR_OUTSIDE_SHIFT_WINDOW (priority 8 temporal)"
            - "HTTP 422; order remains AWAITING_CONVERTING"

      - name: attach_draft_order_state_beats_grade_constraint
        claim_type: priority_ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ORDER_GRADE_MISMATCH]
        distinguishing_aspect: "Attaching a DRAFT order whose grade also differs from the run's: the state error ERR_INVALID_STATE (priority 4) wins over ERR_ORDER_GRADE_MISMATCH (priority 6)."
        test_recipe:
          setup: ["Grade 32C and grade 44BC; ORD in DRAFT on 32C; run on a CORRUGATOR shift built on 44BC"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_32: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "44BC", liner_combo: "42/26/42/26/42", flute: "BC", ect_rating_lbs_per_in: 44, burst_rating_psi: 275, basis_weight_lbs_per_msf: 120.0 }, as: PlantAdmin, captures: { grade_44: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_32}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep, captures: { ord_id: $.data.id } }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_44}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
          trigger:
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 1 }, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (priority 4) — NOT ERR_ORDER_GRADE_MISMATCH (priority 6)"
            - "HTTP 409; run consumed_width_in remains 0"

      - name: ect_equality_satisfies_spec
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=5]
          - errors[ERR_ECT_SPEC_NOT_MET]
        distinguishing_aspect: "min_ect_required exactly equal to the grade's ect_rating (32 == 32) passes; 33 on the same grade fails with ERR_ECT_SPEC_NOT_MET."
        test_recipe:
          setup: ["Customer Acme, grade 32C (ect 32)"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 32 }, as: SalesRep, captures: { ord_ok: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 33 }, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "min_ect 32 on ect-32 grade succeeds (HTTP 201)"
            - "min_ect 33 fails: err == ERR_ECT_SPEC_NOT_MET, HTTP 422"

      - name: warp_threshold_boundary
        claim_type: boundary_edge
        grounds:
          - validations[priority=5]
          - errors[ERR_WARP_BELOW_THRESHOLD]
        distinguishing_aspect: "BOARD_WARP claims need measured_warp_pct >= 2.0: 1.99 fails with ERR_WARP_BELOW_THRESHOLD while exactly 2.0 files successfully; TRANSIT_DAMAGE needs no warp measurement."
        test_recipe:
          setup: ["ORD-1 invoiced (produced 2100)"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_id: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_id}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_v}" }, as: SalesRep, captures: { quo_id: $.data.id } }
            - { call: "POST /api/price-quotes/${quo_id}/accept", payload: {}, as: SalesRep }
            - { call: "POST /api/work-shifts", payload: { machine_code: "CORRUGATOR", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_corr: $.data.id } }
            - { call: "POST /api/corrugator-runs", payload: { work_shift_id: "${sh_corr}", board_grade_id: "${grade_id}", start_minute: 480, end_minute: 720, web_width_in: 87.0 }, as: ProductionPlanner, captures: { run_id: $.data.id } }
            - { call: "POST /api/corrugator-runs/${run_id}/orders", payload: { box_order_id: "${ord_id}", outs: 3 }, as: ProductionPlanner }
            - { call: "POST /api/corrugator-runs/${run_id}/complete", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/work-shifts", payload: { machine_code: "DIE_CUTTER", shift_date: "2026-08-10", start_minute: 480, end_minute: 960 }, as: ProductionPlanner, captures: { sh_die: $.data.id } }
            - { call: "POST /api/converting-bookings", payload: { box_order_id: "${ord_id}", work_shift_id: "${sh_die}", start_minute: 480, end_minute: 600 }, as: ProductionPlanner, captures: { bk_id: $.data.id } }
            - { call: "POST /api/converting-bookings/${bk_id}/start", payload: {}, as: ProductionPlanner }
            - { call: "POST /api/converting-bookings/${bk_id}/complete", payload: { produced_qty: 2100 }, as: ProductionPlanner }
            - { call: "POST /api/box-orders/${ord_id}/invoice", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /api/quality-claims", payload: { box_order_id: "${ord_id}", claim_type: "BOARD_WARP", defective_qty_claimed: 100, measured_warp_pct: 1.99 }, as: CustomerService, as_user_id: "cs-100", captures: { err: $.data.error_id } }
            - { call: "POST /api/quality-claims", payload: { box_order_id: "${ord_id}", claim_type: "BOARD_WARP", defective_qty_claimed: 100, measured_warp_pct: 2.0 }, as: CustomerService, as_user_id: "cs-100", captures: { clm_ok: $.data.id, clm_st: $.data.status } }
          assert:
            - "1.99 pct fails: err == ERR_WARP_BELOW_THRESHOLD, HTTP 422"
            - "Exactly 2.0 pct succeeds: claim OPEN (inclusive >= threshold)"

      - name: supplier_required_conditional_field
        claim_type: conditional_validation
        grounds:
          - validations[priority=6]
          - errors[ERR_SUPPLIER_REQUIRED]
        distinguishing_aspect: "The sheet_supplier_name requirement is conditional on board_source: SHEET_FEEDER without it fails ERR_SUPPLIER_REQUIRED; INTERNAL with it also fails; INTERNAL without it passes."
        test_recipe:
          setup: ["Customer Acme, grade 32C"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
          trigger:
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "SHEET_FEEDER", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep, captures: { err: $.data.error_id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", sheet_supplier_name: "SheetCo", quantity: 100, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30 }, as: SalesRep, captures: { err2: $.data.error_id } }
          assert:
            - "SHEET_FEEDER without supplier: err == ERR_SUPPLIER_REQUIRED, HTTP 422"
            - "INTERNAL with supplier: err2 == ERR_SUPPLIER_REQUIRED, HTTP 422"

      - name: release_qty_zero_invalid
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_QUANTITY]
        distinguishing_aspect: "qty 0 fails ERR_INVALID_QUANTITY (400) before the available-balance fiscal check would even apply."
        test_recipe:
          setup: ["Program stocked to 400"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", program_name: "Acme RSC program", routing_type: "SLOTTED", blank_width_in: 24.0, blank_length_in: 20.0, reorder_point: 10, replenishment_qty: 500 }, as: SalesRep, captures: { prog_id: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog_id}/receipts", payload: { qty: 400 }, as: ProductionPlanner }
          trigger:
            - { call: "POST /api/inventory-programs/${prog_id}/release-orders", payload: { qty: 0, requested_ship_date: "2026-08-12" }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_QUANTITY, HTTP 400; committed_qty remains 0"

      - name: credit_limit_exact_equality_then_exceeded
        claim_type: boundary_edge
        grounds:
          - validations[priority=9]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
          - calculations.credit_exposure_rollup
        distinguishing_aspect: "The <= comparison is inclusive: a customer with limit exactly 1284.12 accepts the 1284.12 quote; a second accept (226.67 more) exceeds the limit and fails ERR_CREDIT_LIMIT_EXCEEDED."
        test_recipe:
          setup: ["Customer Edge with credit_limit_dollars exactly 1284.12; ORD-1 quoted at total 1284.12; ORD-2 (24x20 qty 1000 unit 50) quoted at 226.67"]
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Edge Credit", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 1284.12 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "DIE_CUT", board_source: "INTERNAL", quantity: 2000, blank_width_in: 29.0, blank_length_in: 36.0, min_ect_required: 32, ink_colors: ["BLACK", "RED"] }, as: SalesRep, captures: { ord_1: $.data.id, ord_1_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_1}/quotes", payload: { unit_price_per_msf: 60.00, expires_on: "2026-12-31", expected_order_version: "${ord_1_v}" }, as: SalesRep, captures: { quo_1: $.data.id, quo_1_total: $.data.quote_total_dollars } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 1000, blank_width_in: 24.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_2: $.data.id, ord_2_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_2}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_2_v}" }, as: SalesRep, captures: { quo_2: $.data.id, quo_2_total: $.data.quote_total_dollars } }
          trigger:
            - { call: "POST /api/price-quotes/${quo_1}/accept", payload: {}, as: SalesRep, captures: { q1_st: $.data.status } }
            - { call: "POST /api/price-quotes/${quo_2}/accept", payload: {}, as: SalesRep, captures: { err: $.data.error_id } }
          assert:
            - "Quote 1 total == 1284.12; accept succeeds (exposure 0 + 1284.12 <= limit 1284.12, equality passes)"
            - "Quote 2 total == 226.67; accept fails: err == ERR_CREDIT_LIMIT_EXCEEDED (1284.12 + 226.67 > 1284.12), HTTP 422"
            - "Quote 2 remains OPEN and order 2 remains QUOTED"

      - name: trim_gates_excessive_at_complete_and_exceeds_web_at_attach
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_TRIM_WASTE_EXCESSIVE]
          - errors[ERR_TRIM_WIDTH_EXCEEDS_WEB]
        distinguishing_aspect: "Two distinct trim gates on distinct transitions: a run whose orders consume 60 of 87 in completes with waste 27 > 8.0 (ERR_TRIM_WASTE_EXCESSIVE at complete, run stays SCHEDULED), and an attach that would push a second run to 88 of 87 in fails immediately (ERR_TRIM_WIDTH_EXCEEDS_WEB at attach)."
        test_recipe:
          setup:
            - "Customer Acme, grade 32C; ORD-C (30x20 qty 500) and ORD-A (29x36 qty 2000), ORD-B (24x20 qty 1000), ORD-D (6x10 qty 100) all ACCEPTED"
            - "CORRUGATOR shift [480,960); RUN-1 [480,600) web 87 with ORD-C attached outs 2 (consumed 60); RUN-2 [600,900) web 87 with ORD-A outs 2 + ORD-B outs 1 (consumed 82)"
          setup_api_calls:
            - { call: "POST /api/customer-accounts", payload: { account_name: "Acme Foods", ship_to_city: "Fresno", distance_miles_from_plant: 120.0, credit_limit_dollars: 50000.00 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /api/board-grades", payload: { grade_code: "32C", liner_combo: "35/23/35", flute: "C", ect_rating_lbs_per_in: 32, burst_rating_psi: 200, basis_weight_lbs_per_msf: 90.0 }, as: PlantAdmin, captures: { grade_id: $.data.id } }
            - { call: "POST /api/box-orders", payload: { customer_id: "${cust_id}", board_grade_id: "${grade_id}", routing_type: "SLOTTED", board_source: "INTERNAL", quantity: 500, blank_width_in: 30.0, blank_length_in: 20.0, min_ect_required: 30, ink_colors: [] }, as: SalesRep, captures: { ord_c: $.data.id, ord_c_v: $.data.version } }
            - { call: "POST /api/box-orders/${ord_c}/quotes", payload: { unit_price_per_msf: 50.00, expires_on: "2026-12-31", expected_order_version: "${ord_c_v}" }, as: SalesRep, captures: { quo_c: $.data.id } }
