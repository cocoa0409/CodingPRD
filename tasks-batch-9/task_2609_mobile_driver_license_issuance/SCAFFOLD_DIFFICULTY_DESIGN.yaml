      - name: reissuance_waiver_tier_pinned_to_pre_waiver_total_not_settlement
        grounds: "calculations.credential_reissuance_settlement_cents, steps 1-5 with the pinned evaluation order; endpoint POST /mdl/credentials with supersedes_credential_id"
        distinguishing_aspect: "MODE (c) - circular-looking dependency with a pinned evaluation order, on a different formula and a different entity from the invoice instance. pre_waiver_total is exactly 5300, sitting ON the WAIVER_TIER_1_MIN_CENTS boundary, so tier_pct is 0.20; the DEVICE_LOST predecessor adds 0.05; waiver is 1325 and the settlement is 3975. Reading the tier back off the settlement - the fixed-point temptation the formula explicitly forbids - puts 3975 in tier 2 (0.10 + 0.05), yielding a waiver of 795 and a settlement of 4505. Nothing about the rounding order matters here; only the pinned order of step 2 relative to step 5 does."
        test_recipe:
          setup: "A holder whose first credential is SUSPENDED with suspend_reason DEVICE_LOST after the handset was reported lost, plus a second attested handset and a second VERIFIED proofing session, so the replacement is an expedited rebinding onto a different device: 3000 base + 1500 expedite + 800 rebinding."
          setup_api_calls:
