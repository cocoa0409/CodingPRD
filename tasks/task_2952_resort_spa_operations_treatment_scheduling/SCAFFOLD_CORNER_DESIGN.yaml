- section: errors
  instances:
  - name: error_envelope_shape_and_http_status_fidelity_across_families
    claim_type: Error catalog coverage
    grounds:
    - response_envelope.error
    - errors.ERR_UNAUTHENTICATED.http
    - errors.ERR_ROLE_NOT_PERMITTED.http
    - errors.ERR_GUEST_NOT_FOUND.http
    - errors.ERR_INVALID_REQUEST.http
    - errors.ERR_STALE_GUEST_VERSION.http
    - errors.ERR_INVALID_INTAKE_STATE.http
    - errors.ERR_INVALID_LICENSE_STATE.http
    distinguishing_aspect: "Six different error families are provoked in one run and each must arrive with its own declared HTTP status (401, 403, 404, 422, 412, 409) inside the same envelope whose data object holds exactly error_id and message — an implementation that returns a uniform 400 or 500, that leaks entity fields into an error body, or that omits the meta block is distinguishable from one call to the next."
    test_recipe:
      setup: One guest whose intake form has already been screened to SCREENED_CLEAR, and one therapist whose licence has already been reviewed to VERIFIED, so both idempotency-rejection probes have a real target.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-01T09:00:00.000Z" }
        as: SpaDirector
      - call: POST /guests
        payload: { full_name: "Envelope Guest", resort_room_number: "2501", folio_limit_cents: 500000 }
        as: SpaCoordinator
        captures: { g1: $.data.id, g1_v: $.data.version }
      - call: POST /guests/${g1}/intake-forms
        payload: { expected_guest_version: "${g1_v}", condition_codes: [], medications: [] }
        as: Guest
        as_user_id: "${g1}"
        captures: { in1: $.data.id }
      - call: POST /intake-forms/${in1}/consent
        payload: { consent_version: "2026.1" }
        as: Guest
        as_user_id: "${g1}"
      - call: POST /intake-forms/${in1}/submit
        payload: {}
        as: Guest
        as_user_id: "${g1}"
      - call: POST /intake-forms/${in1}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: "co-3"
      - call: POST /therapists
        payload: { full_name: "Envelope Therapist", employment_type: "EMPLOYEE", commission_tier: "SENIOR", base_hourly_cost_cents: 5200, practice_state_code: "CA" }
        as: SpaDirector
        captures: { th: $.data.id }
      - call: POST /therapists/${th}/licenses
        payload: { license_number: "LMT-9001", license_type: "LMT", state_code: "CA", issued_on: "2024-01-01", expires_on: "2027-06-30", current_period_start_on: "2024-01-01", ce_hours_required: 0 }
        as: ComplianceOfficer
        as_user_id: "co-1"
        captures: { lic: $.data.id }
      - call: POST /therapist-licenses/${lic}/review
        payload: { decision: "VERIFIED" }
        as: ComplianceOfficer
        as_user_id: "co-2"
      trigger:
      - call: POST /guests
        payload: { full_name: "No Auth Guest", resort_room_number: "2502", folio_limit_cents: 100000 }
        as: ""
        as_user_id: ""
        captures: { err_401: $.data.error_id, msg_401: $.data.message }
      - call: POST /treatment-types
        payload: { code: "DRY60", name: "Signature Dry Massage", duration_minutes: 60, room_class_required: "DRY", required_skill_code: "SWEDISH", required_scope_level: "BASIC", base_price_cents: 18000, retail_product_line: "BODY", required_consent_version: "2026.1" }
        as: SpaCoordinator
        captures: { err_403: $.data.error_id }
      - call: GET /guests/00000000-0000-4000-8000-0000000000aa
        as: SpaCoordinator
        captures: { err_404: $.data.error_id }
      - call: POST /guests
        payload: { full_name: "Shapeless Guest", resort_room_number: "2503" }
        as: SpaCoordinator
        captures: { err_422: $.data.error_id }
      - call: POST /guests/${g1}/intake-forms
        payload: { expected_guest_version: "${g1_v}", condition_codes: [], medications: [] }
        as: SpaCoordinator
        captures: { err_412: $.data.error_id }
      - call: POST /intake-forms/${in1}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: "co-4"
        captures: { err_409_intake: $.data.error_id }
      - call: POST /therapist-licenses/${lic}/review
        payload: { decision: "VERIFIED" }
        as: ComplianceOfficer
        as_user_id: "co-2"
        captures: { err_409_license: $.data.error_id }
      - call: GET /guests/${g1}
        as: SpaCoordinator
      - call: GET /guests/${g1}/intake-forms
        as: SpaCoordinator
      assert:
      - "the header-less create returns 401 with data == { error_id: ERR_UNAUTHENTICATED, message: <non-empty string> } and nothing else in data"
      - "the SpaCoordinator attempt at a SpaDirector-exclusive create returns 403 ERR_ROLE_NOT_PERMITTED"
      - "the unknown guest read returns 404 ERR_GUEST_NOT_FOUND"
      - "the guest create missing folio_limit_cents returns 422 ERR_INVALID_REQUEST"
      - "the intake-form create carrying ${g1_v}, the version read back at guest creation and now two writes stale (the first form create and the screening each bumped the guest), returns 412 ERR_STALE_GUEST_VERSION — the only 412 family in the catalog — and creates no IntakeForm row"
      - "re-screening the already SCREENED_CLEAR form returns 409 ERR_INVALID_INTAKE_STATE, and re-reviewing the already VERIFIED licence returns 409 ERR_INVALID_LICENSE_STATE: the two state families are distinct error_ids on the same status"
      - "every one of the seven error responses carries meta.api_request_id and meta.api_request_timestamp and response_type == \"error\", and no two responses share an api_request_id"
      - "meta.api_request_timestamp on each error response equals the current logical clock 2026-08-01T09:00:00.000Z, so error paths read the same clock as success paths"
      - "GET /guests/${g1} still reports the version captured in setup and GET /guests/${g1}/intake-forms still returns exactly one row: none of the seven rejected calls mutated state"

  - name: fiscal_and_clearance_error_families
    claim_type: Error catalog coverage
    grounds:
    - errors.ERR_FOLIO_LIMIT_EXCEEDED.http
    - errors.ERR_APPOINTMENT_NOT_CLEARED.http
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / clearance_state_p10_beats_folio_fiscal_p30
      rationale: That instance drives a guest to the folio ceiling and a blocked appointment to check-in in the same world, so it triggers both ERR_FOLIO_LIMIT_EXCEEDED (402) and ERR_APPOINTMENT_NOT_CLEARED (409) and additionally pins their relative priority; a separate coverage test would only re-observe the same two responses.
  - name: room_turnover_and_intake_priority_error_families
    claim_type: Error catalog coverage
    grounds:
    - errors.ERR_ROOM_TURNOVER_CONFLICT.http
    - errors.ERR_INTAKE_NOT_CLEARED.http
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / intake_safety_p12_beats_room_turnover_p25
      rationale: That instance books into an occupied room with an uncleared guest and then repairs the intake to expose ERR_ROOM_TURNOVER_CONFLICT underneath ERR_INTAKE_NOT_CLEARED, so both error families are already observed on the same request shape.
  - name: guest_booking_restriction_error_family
    claim_type: Error catalog coverage
    grounds:
    - errors.ERR_GUEST_BOOKING_RESTRICTED.http
    excluded_because:
      difficulty_instance: transitive_cascade / no_show_guest_restriction_five_hop_cascade
      rationale: That instance reaches ERR_GUEST_BOOKING_RESTRICTED as the last hop of the no-show cascade, after no_show_strikes crosses NO_SHOW_RESTRICTION_THRESHOLD and booking_privilege flips to RESTRICTED, which is strictly more discriminating than provoking the error directly.

