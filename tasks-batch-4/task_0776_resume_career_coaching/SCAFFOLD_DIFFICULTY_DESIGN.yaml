              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the booking response error_id == ERR_COACH_INACTIVE"
            - "the booking response error_id != ERR_STALE_VERSION"

  # ==========================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: revision_overage_credit_boundary
        grounds:
          - calculations.revision_billing
          - entities.RevisionRequest.fields.billable
          - entities.Order.fields.revision_credits_used
        distinguishing_aspect: |
          Credit-count boundary on POST /deliverables/{id}/revisions with included_revision_rounds=1:
          round 1 (used 0 < pool 1) is free, round 2 (used 1 >= pool 1) is billable — the >= crossing
          on the revision-credit count.
        test_recipe:
          setup:
            - "Plan included_revision_rounds 1; confirmed order, one drafted RESUME deliverable."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 0, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Kim Client", email: "kim@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Ken Coach", email: "ken@x.com", specialty: "GENERAL" }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}/deliverables"
              payload: {}
              as: CareerAdmin
              captures: { deliv_id: "$.data[0].id" }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v1" }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /deliverables/${deliv_id}/revisions"
              payload: { reason: "round 1 free" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev1_id: $.data.id, rev1_billable: $.data.billable }
            - call: "POST /deliverables/${deliv_id}/drafts"
              payload: { notes: "v2" }
              as: Coach
              as_user_id: "${coach_id}"
          trigger:
            - call: "POST /deliverables/${deliv_id}/revisions"
              payload: { reason: "round 2 overage" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev2_id: $.data.id, rev2_billable: $.data.billable }
          assert:
            - "RevisionRequest.${rev1_id}.billable == false"
            - "RevisionRequest.${rev2_id}.billable == true"
            - "an AddOn on Order.${order_id} exists with type == EXTRA_REVISION and source_ref == ${rev2_id}"
            - "Order.${order_id}.revision_credits_used == 2"

      - name: coach_buffer_exact_gap_boundary
        grounds:
          - validations[priority=8]
          - entities.Coach.fields.buffer_minutes
          - errors[ERR_COACH_SLOT_CONFLICT]
        distinguishing_aspect: |
          Time-gap boundary on POST /orders/{id}/sessions: a session starting exactly
          buffer_minutes (15) after the prior session's end (11:00 -> 11:15) is accepted (>=),
          whereas 11:14 would be rejected — a different metric and endpoint from the revision-count boundary.
        test_recipe:
          setup:
            - "Plan with 2 included coaching sessions; confirmed order; coach buffer_minutes 15; one included session already booked 10:00-11:00 on that coach."
          setup_api_calls:
            - call: "POST /package-plans"
              payload: { tier: "PRO", base_price_cents: 20000, included_deliverables: ["RESUME"], included_revision_rounds: 1, included_coaching_sessions: 2, guarantee_type: "NONE" }
              as: CareerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /clients"
              payload: { name: "Lee Client", email: "lee@x.com" }
              as: CareerAdmin
              captures: { client_id: $.data.id }
            - call: "POST /coaches"
              payload: { name: "Lou Coach", email: "lou@x.com", specialty: "GENERAL", buffer_minutes: 15 }
              as: CareerAdmin
              captures: { coach_id: $.data.id }
            - call: "POST /orders"
              payload: { plan_id: "${plan_id}", target_role: "PM", target_industry: "Tech", requested_delivery_days: 7 }
              as: Client
              as_user_id: "${client_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v0: $.data.version }
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z", expected_order_version: "${v0}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_a: $.data.id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: CareerAdmin
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T11:15:00Z", scheduled_end: "2026-04-01T12:00:00Z", expected_order_version: "${v1}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_b: $.data.id, sess_b_status: $.data.status }
          assert:
            - "CoachingSession.${sess_b}.status == SCHEDULED"
            - "CoachingSession.${sess_b}.scheduled_start == 2026-04-01T11:15:00Z"

  # ==========================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # ==========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: deliverable_draft_requires_order_in_production
        grounds:
          - state_machines.Deliverable.PENDING_to_DRAFTED
          - entities.Order.fields.status
          - errors[ERR_ORDER_NOT_IN_PRODUCTION]
        distinguishing_aspect: |
          Deliverable PENDING->DRAFTED is gated by parent Order.status==IN_PRODUCTION: the
          same coach draft fails ERR_ORDER_NOT_IN_PRODUCTION on an INTAKE order and succeeds
          after confirm. Entity pair Deliverable<->Order.
