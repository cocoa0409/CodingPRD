            - call: "POST /funding-sources"
              payload: { department_id: "${dept_id}", source_code: "NSF-A", source_type: "GRANT", authorized_amount_cents: 5000000, budget_period_start: "2026-07-01", budget_period_end: "2027-06-30", allows_tuition_remission: true }
