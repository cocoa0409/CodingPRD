              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "GET /store-ops/stores/${store_id}"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { store_v2: $.data.version }
          trigger:
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with ${err_id} == 'ERR_INVALID_ZONE_VERSION_STATE'"
            - "ZoneVersion.${zv1_id}.status is still 'ACTIVE' and activated_at is still '2026-08-05T09:00:00Z'"
            - "Store.${store_id}.version == ${store_v2}, so the rejected call bumped nothing"

      - name: superseded_zone_version_cannot_be_reactivated
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ZoneVersion.terminal_states
          - validations.priority_12
          - errors.ERR_INVALID_ZONE_VERSION_STATE
        distinguishing_aspect: "SUPERSEDED is terminal, so re-activating the July window after the August window took over fails with ERR_INVALID_ZONE_VERSION_STATE and does not restore it as the store's in-force polygon."
        test_recipe:
