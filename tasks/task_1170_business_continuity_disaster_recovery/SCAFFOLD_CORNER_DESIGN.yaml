              as: CrisisOfficer
              as_user_id: "${c1_id}"
            - call: "POST /resilience/comm-nodes"
              payload: { tree_label: "TREE_FanoutProc", contact_name: "N2", role_title: "Tech", parent_node_id: "${root_id}", order_index: 2, channel: "SMS", ack_deadline_minutes: 15 }
