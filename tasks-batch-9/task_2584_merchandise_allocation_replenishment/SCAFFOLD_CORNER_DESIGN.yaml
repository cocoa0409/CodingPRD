      - name: junction_uniqueness_and_self_referential_supersede_edges
        claim_type: graph
        grounds:
          - entities.StorePosition.fields.store_id
          - entities.AllocationRun.fields.supersedes_run_id
          - entities.TransferRecommendation.fields.supersedes_recommendation_id
          - validations[priority:15]
          - validations[priority:21]
          - errors.ERR_DUPLICATE_POSITION
          - errors.ERR_SAME_STORE_TRANSFER
          - endpoints.GET /allocation/allocation-runs
          - endpoints.GET /allocation/transfer-recommendations
        distinguishing_aspect: |
          The entity topology is a graph, and its three graph-specific corners are probed together.
          StorePosition is the many-to-many junction of Store and Item: (store_id, item_id) is unique, so a
          second position for the same pair is a 409 while a second position for the same store and a
          DIFFERENT item is fine, and the same junction is reachable from either leg by filter. AllocationRun
          and TransferRecommendation carry self-referential edges: creating a sibling supersedes the open one,
          sets the child's supersedes_* pointer at it and CANCELS the parent, and the reverse filter on that
          pointer finds exactly the successor. A transfer whose two legs are the same store is the degenerate
          self-loop and is refused outright.
