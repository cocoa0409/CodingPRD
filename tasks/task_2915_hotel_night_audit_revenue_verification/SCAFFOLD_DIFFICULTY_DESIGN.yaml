      - name: segregation_of_duties_outranks_approved_amount_ceiling_on_allowance_approve
        grounds: "§1.4 priority 50 business_safety ERR_SELF_APPROVAL_FORBIDDEN (403) versus priority 94 business_fiscal ERR_APPROVED_AMOUNT_EXCEEDS_REQUEST (422), both applying to POST /night-audit/allowances/{id}/approve."
        distinguishing_aspect: >-
