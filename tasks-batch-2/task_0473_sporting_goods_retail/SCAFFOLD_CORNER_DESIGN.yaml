# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index (breadth probe)
# Enumerates testable claims from §1.1–§1.7 not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_sku_returns_201_with_computed_is_footwear
        claim_type: Creation
        grounds: [entities.Sku.fields.is_footwear, entities.Sku.fields.sport]
        distinguishing_aspect: "POST /skus with sport=FOOTWEAR returns 201 and is_footwear==true computed server-side; lifecycle==STANDARD, active_markdown_id==null."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /skus"
              payload: { sport: "FOOTWEAR", name: "Trail Shoe", base_price_cents: 9500, size_label: "10D" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Sku.${sku_id}.is_footwear == true"
            - "Sku.${sku_id}.lifecycle == STANDARD"
            - "Sku.${sku_id}.active_markdown_id == null"

      - name: get_sku_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", entities.Sku]
        distinguishing_aspect: "GET /skus/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /skus/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_sku_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Sku.fields.base_price_cents]
        distinguishing_aspect: "POST /skus missing base_price_cents returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /skus"
              payload: { sport: "HOCKEY", name: "No Price" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_sku_bad_enum_sport_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.Sku.fields.sport]
        distinguishing_aspect: "POST /skus with sport not in the enum returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /skus"
              payload: { sport: "CHESS", name: "Bad", base_price_cents: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_customer_default_loyalty_fields
        claim_type: Defaults
        grounds: [entities.Customer.fields.loyalty_points, entities.Customer.fields.loyalty_tier]
        distinguishing_aspect: "POST /customers yields loyalty_points==0 and loyalty_tier==BRONZE by default."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "def@x.com", full_name: "Def Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.loyalty_points == 0"
            - "Customer.${cust_id}.loyalty_tier == BRONZE"

      - name: create_customer_duplicate_email_returns_conflict
        claim_type: Type Constraints
        grounds: ["errors[ERR_DUPLICATE_EMAIL]", entities.Customer.fields.email]
        distinguishing_aspect: "POST /customers with an email matching an existing customer (case-insensitive) returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["A customer dup@x.com already exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dup@x.com", full_name: "First", home_state_code: "CA" }
              as: PlatformAdmin
          trigger:
            - call: "POST /customers"
              payload: { email: "DUP@x.com", full_name: "Second", home_state_code: "NV" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DUPLICATE_EMAIL"
            - "HTTP status == 409"

      - name: duplicate_store_inventory_row_returns_conflict
        claim_type: Type Constraints
        grounds: ["errors[ERR_DUPLICATE_INVENTORY_ROW]", entities.StoreInventory.fields.store_id, entities.StoreInventory.fields.sku_id]
        distinguishing_aspect: "POST /store-inventory for a (store_id, sku_id) pair that already has a row returns ERR_DUPLICATE_INVENTORY_ROW (409)."
        test_recipe:
          setup: ["A store, a SKU, and an existing inventory row for the pair."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "HOCKEY", name: "Skate", base_price_cents: 12000, size_label: "9D" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
          trigger:
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DUPLICATE_INVENTORY_ROW"
            - "HTTP status == 409"

      - name: fishing_license_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.FishingLicense]
        distinguishing_aspect: "FishingLicense has common_fields:false — it exposes id and created_at but NO version field and no update endpoint; only POST and GET exist."
        test_recipe:
          setup: ["A customer and a store; a license issued."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "imm@x.com", full_name: "Imm Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /fishing-licenses"
              payload: { customer_id: "${cust_id}", issuing_store_id: "${store_id}" }
              as: StoreAssociate
              captures: { lic_id: $.data.id }
          trigger:
            - call: "GET /fishing-licenses/${lic_id}"
              payload: {}
              as: StoreAssociate
              captures: { status: $.data.status }
          assert:
            - "FishingLicense.${lic_id}.status == ACTIVE"
            - "FishingLicense response has no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_fulfill_from_reserved_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.READY_to_FULFILLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /orders/{id}/fulfill on a RESERVED (not READY) order returns ERR_INVALID_STATE; no commit occurs."
        test_recipe:
          setup: ["SKU stocked; order placed (RESERVED) but not readied."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "BASEBALL", name: "Mitt", base_price_cents: 3000, size_label: "M" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "inv@x.com", full_name: "Inv Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/fulfill"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: order_initial_state_draft_unpaid
        claim_type: Initial State
        grounds: [state_machines.Order, entities.Order.fields.fulfillment_status, entities.Order.fields.payment_status]
        distinguishing_aspect: "A freshly created Order starts fulfillment_status==DRAFT and payment_status==UNPAID."
        test_recipe:
          setup: ["A store and a customer exist."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "init@x.com", full_name: "Init Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "SFS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.fulfillment_status == DRAFT"
            - "Order.${order_id}.payment_status == UNPAID"
            - "Order.${order_id}.version == 1"

      - name: service_ticket_resume_from_inprogress_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceTicket.NEEDS_PARTS_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /service-tickets/{id}/resume on an IN_PROGRESS (not NEEDS_PARTS) ticket returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A SKATE_SHARPEN ticket started (IN_PROGRESS, no part)."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "res@x.com", full_name: "Res Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /service-tickets"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", service_type: "SKATE_SHARPEN" }
              as: ServiceTech
              captures: { tkt_id: $.data.id }
            - call: "POST /service-tickets/${tkt_id}/start"
              payload: {}
              as: ServiceTech
          trigger:
            - call: "POST /service-tickets/${tkt_id}/resume"
              payload: {}
              as: ServiceTech
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: order_terminal_fulfilled_lockdown_cancel_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /orders/{id}/cancel on a FULFILLED order returns ERR_INVALID_STATE — terminal state admits no transitions."
        test_recipe:
          setup: ["An order placed, readied, and FULFILLED."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "BASEBALL", name: "Cap", base_price_cents: 2500, size_label: "M" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "term@x.com", full_name: "Term Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/ready"
              payload: {}
              as: StoreAssociate
            - call: "GET /orders/${order_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /orders/${order_id}/fulfill"
              payload: { expected_order_version: "${ord_v}" }
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: team_order_reject_terminal_no_spawn
        claim_type: Valid Transition
        grounds: [state_machines.TeamOrder.SUBMITTED_to_REJECTED, entities.TeamOrder.fields.spawned_order_id]
        distinguishing_aspect: "POST /team-orders/{id}/reject moves SUBMITTED->REJECTED and leaves spawned_order_id null (no Order created)."
        test_recipe:
          setup: ["A submitted team order with one embroiderable line."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "TEAMWEAR", name: "Shorts", base_price_cents: 2000, size_label: "L", embroiderable: true }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "rej@x.com", full_name: "Rej Coach", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /team-orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", team_name: "Tigers" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { to_id: $.data.id }
            - call: "POST /team-orders/${to_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 5 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /team-orders/${to_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /team-orders/${to_id}/reject"
              payload: {}
              as: StoreAssociate
              captures: { st: $.data.status }
          assert:
            - "TeamOrder.${to_id}.status == REJECTED"
            - "TeamOrder.${to_id}.spawned_order_id == null"

      - name: pricematch_reject_keeps_line_price
        claim_type: Valid Transition
        grounds: [state_machines.PriceMatchClaim.SUBMITTED_to_REJECTED, entities.PriceMatchClaim.fields.approved_unit_price_cents]
        distinguishing_aspect: "POST /price-match-claims/{id}/reject moves SUBMITTED->REJECTED and leaves approved_unit_price_cents null."
        test_recipe:
          setup: ["An order with one line; a SUBMITTED price-match claim on the line."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "BASEBALL", name: "Bat2", base_price_cents: 7000, size_label: "32in" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "pmr@x.com", full_name: "PMR Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /price-match-claims"
              payload: { order_id: "${order_id}", order_line_id: "${line_id}", competitor_price_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /price-match-claims/${claim_id}/reject"
              payload: {}
              as: PriceAdmin
              captures: { st: $.data.status }
          assert:
            - "PriceMatchClaim.${claim_id}.status == REJECTED"
            - "PriceMatchClaim.${claim_id}.approved_unit_price_cents == null"

  # ===========================================================================
  - section: calculations
    instances:
      - name: effective_unit_price_active_markdown_applied_on_read
        claim_type: Correct Result
        grounds: [calculations.effective_unit_price, entities.Sku.fields.active_markdown_id, entities.Markdown.fields.status]
        distinguishing_aspect: "After clock is set inside a markdown window, GET /skus/{id} reports active_markdown_id set and lifecycle SEASONAL; the 25%-off markdown gives effective unit 4500 over base 6000 (verified via a placed order line unit_price_cents)."
        test_recipe:
          setup: ["SKU base 6000; SEASONAL 25% markdown [2026-03-01,2026-04-01); clock set to 2026-03-10; SKU stocked."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "APPAREL", name: "Tee", base_price_cents: 6000, size_label: "M" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "md@x.com", full_name: "MD Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /markdowns"
              payload: { sku_id: "${sku_id}", markdown_kind: "SEASONAL", percent_off: 25, effective_from: "2026-03-01T00:00:00Z", effective_until: "2026-04-01T00:00:00Z" }
              as: PriceAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prov: $.data.provisional_total_cents }
          assert:
            - "Sku.${sku_id}.lifecycle == SEASONAL"
            - "Order.${order_id}.provisional_total_cents == 4500 (6000 * 0.75)"

      - name: order_final_markdown_drift_between_place_and_fulfill
        claim_type: Variant Selection
        grounds: [calculations.order_total_final, calculations.order_total_provisional, entities.Markdown.fields.status]
        distinguishing_aspect: "Order placed with no active markdown (provisional 10000); a CLEARANCE 40% markdown becomes ACTIVE before fulfillment (clock advanced into its window); final re-snapshots the markdown to 6000, distinct from the price-match path."
        test_recipe:
          setup: ["SKU base 10000 stocked; order line qty 1 placed at clock default (no markdown active), readied; CLEARANCE 40% markdown [2026-02-01,2026-05-01); clock then set to 2026-02-15 before fulfill."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "CA Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /skus"
              payload: { sport: "APPAREL", name: "Jacket", base_price_cents: 10000, size_label: "L" }
              as: PlatformAdmin
              captures: { sku_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "drift@x.com", full_name: "Drift Cust", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /store-inventory"
              payload: { store_id: "${store_id}", sku_id: "${sku_id}" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 5, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", fulfillment_type: "BOPIS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { sku_id: "${sku_id}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/place"
              payload: {}
