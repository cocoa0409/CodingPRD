            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: SHOULDER, injury_type: SPRAIN, severity: MODERATE, mechanism: "check", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { inj: $.data.id } }
            - { call: "POST /referrals", payload: { injury_id: "${inj}", physician_staff_id: "${md1}", reason: "shoulder eval", urgency: ROUTINE }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { ref: $.data.id } }
            - { call: "POST /referrals/${ref}/schedule", payload: { appointment_at: "2026-08-02T10:00:00Z" }, as: AthleticTrainer, as_user_id: "${tr1}" }
          trigger:
            - { call: "POST /referrals/${ref}/complete", payload: { report_diagnosis: "wrong physician", report_clearance: CLEARED_FULL }, as: Physician, as_user_id: "${md2}", captures: { err: $.data.error_id } }
            - { call: "POST /referrals/${ref}/complete", payload: { report_diagnosis: "strain", report_clearance: CLEARED_FULL }, as: Physician, as_user_id: "${md1}", captures: { ref_s: $.data.status } }
          assert:
            - "err == ERR_OWNERSHIP_MISMATCH (MD2 is not the referral's physician)"
            - "ref_s == COMPLETED for MD1"

      - name: guardian_ack_ownership_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_OWNERSHIP_MISMATCH]
          - roles.ParentGuardian
        distinguishing_aspect: "Notification acknowledge is guardian-scoped: a guardian of a different athlete gets ERR_OWNERSHIP_MISMATCH, a TeamCoach is outside the role entirely (ERR_FORBIDDEN_ROLE), and the correct guardian succeeds."
        test_recipe:
          setup: ["Trainer T1; coach C1; athletes A (guardian_user_id g-9701) and B (guardian_user_id g-9702); injury for A creates a notification; notification SENT (email channel)"]
          setup_api_calls:
            - { call: "POST /staff", payload: { full_name: "Trainer One", role_type: ATHLETIC_TRAINER }, as: SystemAdmin, captures: { tr1: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Coach Cal", role_type: TEAM_COACH }, as: SystemAdmin, captures: { co1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete A", date_of_birth: "2009-05-01", grade: 10, sex: F, primary_sport: SOCCER, team_level: JV, guardian_name: "Guard A", guardian_user_id: "g-9701", guardian_email: "ga@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { a1: $.data.id } }
            - { call: "POST /athletes", payload: { full_name: "Athlete B", date_of_birth: "2009-06-01", grade: 11, sex: M, primary_sport: SOCCER, team_level: VARSITY, guardian_name: "Guard B", guardian_user_id: "g-9702", guardian_email: "gb@x.com" }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "POST /injuries", payload: { athlete_id: "${a1}", body_region: ANKLE_FOOT, injury_type: SPRAIN, severity: MINOR, mechanism: "landing", evaluated_at: "2026-07-31T10:00:00Z", restricted_activities: [PRACTICE] }, as: AthleticTrainer, as_user_id: "${tr1}" }
            - { call: "GET /guardian-notifications", payload: { athlete_id: "${a1}" }, as: AthleticTrainer, as_user_id: "${tr1}", captures: { n1: "$.data[0].id" } }
            - { call: "POST /guardian-notifications/${n1}/send", payload: {}, as: AthleticTrainer, as_user_id: "${tr1}", captures: { n_s: $.data.status } }
          trigger:
            - { call: "POST /guardian-notifications/${n1}/acknowledge", payload: {}, as: ParentGuardian, as_user_id: "g-9702", captures: { err1: $.data.error_id } }
            - { call: "POST /guardian-notifications/${n1}/acknowledge", payload: {}, as: TeamCoach, as_user_id: "${co1}", captures: { err2: $.data.error_id } }
            - { call: "POST /guardian-notifications/${n1}/acknowledge", payload: {}, as: ParentGuardian, as_user_id: "g-9701", captures: { n_final: $.data.status } }
          assert:
            - "n_s == SENT"
            - "err1 == ERR_OWNERSHIP_MISMATCH (g-9702 is not athlete A's guardian_user_id)"
            - "err2 == ERR_FORBIDDEN_ROLE (TeamCoach lacks the acknowledge operation entirely)"
            - "n_final == ACKNOWLEDGED for g-9701"

      - name: physician_cannot_document_injuries
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - roles.Physician
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Peer-role boundary: the Physician holds clearance authority and referral reporting but cannot create injury evaluations (AthleticTrainer-exclusive) — ERR_FORBIDDEN_ROLE."
