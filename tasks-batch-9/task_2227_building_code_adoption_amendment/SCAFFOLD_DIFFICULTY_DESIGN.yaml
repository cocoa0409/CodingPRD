            - *c_cycle
            - *c_cte
            - *c_m_chair
            - *c_m_fire
            - *c_m_loc
            - *c_m_des
            - *c_m_ind2
            - *c_m_pub
            - *c_cte2
            - *c_m2_chair
            - *c_intake_open
            - *c_propA
            - *c_intake_closed
            - *c_screenA
            - *c_cbA
            - *c_cbA_accept
            - *c_readA
            - *c_eiA
            - *c_eiA_accept
            - *c_delib
            - *c_windowA_open
            - *c_clock0815
            - *c_cmt_s1
            - *c_cmt_s2
            - *c_cmt_s3
            - *c_cmt_o1
            - *c_clock0909
            - *c_windowA_close
            - *c_hearA
            - *c_agendaA
            - *c_clock1005
            - *c_conveneA
          trigger:
            - call: "POST /hearings/${hear_id}/votes"
              payload: { proposal_id: "${prop_id}", ballots: [{ member_id: "${m_chair_id}", ballot: "YES" }, { member_id: "${m_ind2_id}", ballot: "YES" }, { member_id: "${m_loc_id}", ballot: "YES" }, { member_id: "${m_des_id}", ballot: "YES" }, { member_id: "${m_fire_id}", ballot: "NO" }, { member_id: "${n_chair_id}", ballot: "NO" }, { member_id: "${n_chair_id}", ballot: "NO" }] }
              as: CouncilChair
              as_user_id: "${m_chair_id}"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BALLOT_MEMBER_NOT_ON_COMMITTEE"
            - "response.data.error_id != ERR_DUPLICATE_BALLOT"
            - "AmendmentProposal.${prop_id}.review_status == COMMENT_CLOSED"
            - "GET /hearings/${hear_id}/votes returns total_count == 0"
            - "Hearing.${hear_id}.status == CONVENED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: benefit_cost_ratio_rounds_up_to_exactly_floor_and_passes
        grounds:
          - calculations.amendment_benefit_cost_ratio
          - validations[priority=18]
          - errors.ERR_BENEFIT_COST_BELOW_FLOOR
          - entities.VoteRecord.fields.final_benefit_cost_ratio_at_vote
        distinguishing_aspect: |
          Metric = the 2-decimal FINAL benefit-cost ratio at the BCR_FLOOR boundary,
          probed through POST /hearings/{hearing_id}/votes: the raw quotient
          0.995032... rounds half-up to exactly 1.00 and the vote is APPROVED, proving the
          gate compares the ROUNDED value and that the boundary is inclusive.
        test_recipe:
          setup:
            - "The golden chain through convene, except the COST_BENEFIT analysis carries annual_cost_savings_cents 14295000 with measure_life_years 12."
            - "statewide_incremental_cost_cents == 143002800, preliminary_benefit_cost_ratio == 1.50, base_docket_score == 74.45."
            - "Logical clock at 2026-10-05T14:00:00Z with the hearing CONVENED and 6 active voting seats."
          setup_api_calls:
            - *c_clock0801
            - *c_cycle
            - *c_cte
            - *c_m_chair
            - *c_m_fire
            - *c_m_loc
            - *c_m_des
            - *c_m_ind2
            - *c_m_pub
            - *c_intake_open
            - *c_propA
            - *c_intake_closed
            - *c_screenA
            - &c_cbA_boundary
              call: "POST /amendment-proposals/${prop_id}/impact-analyses"
              payload: { expected_proposal_version: "${prop_v_screened}", analysis_type: "COST_BENEFIT", incremental_cost_by_occupancy: { R3: 42375, R2: 61250, B: 118900, A2: 97150 }, affected_permit_count: 2410, annual_cost_savings_cents: 14295000, measure_life_years: 12 }
              as: TechnicalStaff
              as_user_id: "staff-analyst-1"
              captures: { cb_id: $.data.id }
            - *c_cbA_accept
            - *c_readA
            - *c_eiA
            - *c_eiA_accept
            - *c_delib
            - *c_windowA_open
            - *c_clock0815
            - *c_cmt_s1
            - *c_cmt_s2
            - *c_cmt_s3
            - *c_cmt_o1
            - *c_clock0909
            - *c_windowA_close
            - *c_hearA
            - *c_agendaA
            - *c_clock1005
            - *c_conveneA
          trigger:
            - *c_voteA
          assert:
            - "response.status == 201"
            - "AmendmentProposal.${prop_id}.preliminary_benefit_cost_ratio == 1.50"
            - "AmendmentProposal.${prop_id}.final_benefit_cost_ratio == 1.00"
            - "VoteRecord.${vote_id}.final_benefit_cost_ratio_at_vote == 1.00"
            - "VoteRecord.${vote_id}.outcome == APPROVED"
            - "AmendmentProposal.${prop_id}.review_status == APPROVED"
            - "CodeCycle.${cycle_id}.approved_proposal_count == 1"

      - name: agenda_auto_fill_on_empty_eligible_pool_is_rejected
        grounds:
          - calculations.agenda_selection
          - validations[priority=17]
          - errors.ERR_NO_ELIGIBLE_PROPOSALS
          - entities.Hearing.fields.agenda_proposal_ids
        distinguishing_aspect: |
          Metric = cardinality of the eligible pool at its zero boundary, probed through a
          different endpoint (POST /hearings/{hearing_id}/agenda): with zero proposals in
          the cycle the AUTO_FILL selection has an empty pool and must reject rather than
          write an empty agenda.
        test_recipe:
          setup:
            - "CodeCycle 2027 in DRAFT with one SEATED ENERGY committee of 6 voting seats and zero AmendmentProposal rows."
            - "One SCHEDULED Hearing for that committee at 2026-10-05T14:00:00Z."
            - "Logical clock at 2026-08-01T00:00:00Z (14-day notice satisfied)."
          setup_api_calls:
            - *c_clock0801
            - *c_cycle
            - *c_cte
            - *c_m_chair
            - *c_m_fire
            - *c_m_loc
            - *c_m_des
            - *c_m_ind2
            - *c_m_pub
            - *c_hearA
          trigger:
            - *c_agendaA
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_ELIGIBLE_PROPOSALS"
            - "Hearing.${hear_id}.status == SCHEDULED"
            - "Hearing.${hear_id}.agenda_proposal_ids == []"

      - name: comment_window_of_exactly_thirty_days_is_accepted
        grounds:
          - validations[priority=16]
          - errors.ERR_COMMENT_PERIOD_TOO_SHORT
          - state_machines.AmendmentProposal.SCREENED_to_COMMENT_OPEN
          - entities.AmendmentProposal.fields.comment_window_status
        distinguishing_aspect: |
          Metric = window duration in days at the COMMENT_MIN_DAYS boundary, probed through
          a third endpoint (POST /amendment-proposals/{proposal_id}/comment-window):
          2026-08-10T00:00:00Z to 2026-09-09T00:00:00Z is exactly 30 days and is accepted,
          so the minimum is inclusive.
        test_recipe:
          setup:
            - "CodeCycle 2027 in DELIBERATION with a SEATED ENERGY committee."
            - "One AmendmentProposal with review_status SCREENED and analysis_status COMPLETE (both analyses ACCEPTED)."
            - "Logical clock at 2026-08-01T00:00:00Z; the proposal has never had a comment window."
          setup_api_calls:
            - *c_clock0801
            - *c_cycle
            - *c_cte
            - *c_m_chair
            - *c_m_fire
            - *c_m_loc
            - *c_m_des
            - *c_m_ind2
            - *c_m_pub
            - *c_intake_open
            - *c_propA
            - *c_intake_closed
            - *c_screenA
            - *c_cbA
            - *c_cbA_accept
            - *c_readA
            - *c_eiA
            - *c_eiA_accept
            - *c_delib
          trigger:
            - *c_windowA_open
          assert:
            - "response.status == 200"
            - "AmendmentProposal.${prop_id}.review_status == COMMENT_OPEN"
            - "AmendmentProposal.${prop_id}.comment_window_status == OPEN"
            - "AmendmentProposal.${prop_id}.comment_opens_at == 2026-08-10T00:00:00Z"
            - "AmendmentProposal.${prop_id}.comment_closes_at == 2026-09-09T00:00:00Z"
            - "AmendmentProposal.${prop_id}.comment_round == 1"
            - "AmendmentProposal.${prop_id}.comment_extension_count == 0"
            - "AmendmentProposal.${prop_id}.total_comment_count == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: hearing_creation_blocked_while_committee_is_forming
        grounds:
          - validations[priority=12]
          - errors.ERR_COMMITTEE_NOT_SEATED
          - state_machines.DisciplineCommittee.FORMING_to_SEATED
          - entities.DisciplineCommittee.fields.active_voting_member_count
          - entities.Hearing.fields.committee_id
        distinguishing_aspect: |
          Entity pair Hearing -> DisciplineCommittee: creating a Hearing is legal on its own
          terms (notice satisfied, interval valid) yet is refused because the referenced
          committee is still FORMING with 3 of the required 4 active voting members.
        test_recipe:
          setup:
