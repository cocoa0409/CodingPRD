        distinguishing_aspect: "adding lines to a DRAFT order recomputes gross_budget_cents per the pinned formula sum over non-cancelled lines of (gross_rate_cents * spots_per_week * weeks_requested)."
        test_recipe:
          setup: ["advertiser, program, DRAFT order exist"]
          setup_api_calls:
            - call: "POST /traffic/advertisers"
              payload: { name: "GB", product_category: "RETAIL", credit_limit_cents: 100000000 }
