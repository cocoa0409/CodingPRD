            - "after the first DISPUTE, PayrollAudit.${aud_id}.status == IN_FIELDWORK and round_count == 2 and findings == [] and underpayment_principal_cents == 0"
            - "after the second findings call, PayrollAudit.${aud_id}.status == FINDINGS_ISSUED and underpayment_principal_cents == 66040"
            - "after the second DISPUTE, PayrollAudit.${aud_id}.status == IN_FIELDWORK and round_count == 3"
            - "after the third findings call, PayrollAudit.${aud_id}.status == FINDINGS_ISSUED and underpayment_principal_cents == 49530"
            - "${round_limit_err} == 'ERR_AUDIT_ROUND_LIMIT_REACHED' with HTTP 409"
