            - "an OUTBOUND Payment of amount_cents == 783800 exists (FLEXIBLE/CONFIRMED retention 0.00, full refund; link 2)"
            - "Booking.${booking_id}.amount_paid_cents == 0 and payment_status == REFUNDED (link 3: net inbound zero)"
            - "every non-terminal PaymentMilestone of ${booking_id} has milestone_status == WAIVED"

      - name: force_majeure_approval_cascade_holds_then_vendor_revalidation
        grounds:
          - state_machines.RescheduleRequest.PROPOSED_to_APPROVED
          - state_machines.SpaceHold.COMMITTED_to_RELEASED
