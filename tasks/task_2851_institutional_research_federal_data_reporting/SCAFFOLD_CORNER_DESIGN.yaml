            - call: "POST /ir/element-mappings"
              payload: { cycle_id: "${cyc}", definition_id: "${def1}", local_system_code: "SIS", local_field_path: "sis.student.level", transform_expression: "upper(level_code)", value_map: { "UG": "UNDERGRAD" } }
