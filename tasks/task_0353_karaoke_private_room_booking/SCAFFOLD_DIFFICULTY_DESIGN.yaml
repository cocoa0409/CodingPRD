              payload: { full_name: "Ivy", email: "ivy@x.com", phone: "999" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /venues/${v_id}/_clock/set"
              payload: { now_utc: "2026-07-14T19:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { venue_id: "${v_id}", room_id: "${room_id}", customer_id: "${cust_id}", party_size: 6, slot_start_utc: "2026-07-14T20:00:00.000Z", slot_end_utc: "2026-07-14T22:00:00.000Z", expected_room_version: "${room_v}" }
