  # ==================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ==================================================================
  - rule_id: compensating_invariant
    instances:
      - name: project_cancel_releases_conflict_exclusion
        grounds:
          - state_machines.Project.transitions
          - calculations.talent_active_conflict_categories
        distinguishing_aspect: |
          Conserved quantity: count of ACTIVE ConflictExclusion rows covering
          (talent, category). Forward action = select_talent with
          exclusivity_required=true creates the row. Compensating action =
          cancel project releases it. Invariant: after forward+compensate,
          Talent.active_conflict_categories == pre-forward value.
        test_recipe:
          setup:
            - "Talent with empty active_conflict_categories initially"
            - "Project with exclusivity_required=true cast to talent (forward)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { talent_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "AUTOMOTIVE", usage_type: "TERM", term_months: 12, spots_count: 1, exclusivity_required: true, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${talent_id}", audio_file_url: "https://x/a.mp3" }
              as: Talent
              as_user_id: "${talent_id}"
              captures: { aud_id: $.data.id }
            - call: "POST /api/projects/${project_id}/select_talent"
              payload: { self_audition_id: "${aud_id}" }
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /api/projects/${project_id}"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { p_ver: $.data.version }
          trigger:
            - call: "POST /api/projects/${project_id}/cancel"
              payload: { expected_project_version: "${p_ver}" }
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Project.status == CANCELLED"
            - "Talent.active_conflict_categories is empty (equal to pre-forward value)"

      - name: session_cancel_releases_invoice_free_state
        grounds:
          - state_machines.Session
          - state_machines.Invoice
        distinguishing_aspect: |
          Conserved quantity: count of PENDING Invoices on the project.
          Forward action: PICKUP session completion creates a PICKUP_FEE
          invoice. Compensating action: project cancellation voids all PENDING
          invoices. Invariant: PENDING-invoice count returns to its pre-forward
          baseline. Different conserved quantity than conflict-exclusion count.
        test_recipe:
          setup:
            - "Project with one COMPLETED PRIMARY session, one COMPLETED PICKUP session (PICKUP_FEE invoice PENDING)"
            - "PENDING invoice count == 1"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
