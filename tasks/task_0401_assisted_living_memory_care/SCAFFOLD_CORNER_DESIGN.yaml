            - call: "POST /facilities"
              payload: { name: "FB", state_code: "CA", license_number: "CA-403", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { facB_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${facA_id}", full_name: "Res A", date_of_birth: "1940-01-01" }
              as: Registrar
            - call: "POST /residents"
              payload: { facility_id: "${facB_id}", full_name: "Res B", date_of_birth: "1941-01-01" }
              as: Registrar
          trigger:
            - call: "GET /residents?facility_id=${facA_id}"
              payload: {}
              as: Staff
          assert:
            - "HTTP status == 200 AND total_count == 1"

  # ===========================================================================
  - section: rbac
    instances:
      - name: nurse_cannot_create_assessment
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Assessment creation is exclusive to ClinicalDirector; a Nurse attempting POST /assessments returns ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["A facility and resident exist."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "RbacF", state_code: "CA", license_number: "CA-500", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Rbac Rita", date_of_birth: "1940-01-01" }
              as: Registrar
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /assessments"
              payload: { resident_id: "${res_id}", adl_bathing: 1, adl_dressing: 1, adl_toileting: 1, adl_transferring: 1, adl_eating: 1, cognition_score: 0, behavior_flags: 0 }
              as: Nurse
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403 AND response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: registrar_cannot_issue_statement
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Billing issue is exclusive to BillingClerk; a Registrar attempting POST /billing-statements/{id}/issue returns ERR_INSUFFICIENT_PERMISSIONS (403)."
        test_recipe:
          setup: ["A DRAFT statement exists for a resident."]
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "RbacF2", state_code: "CA", license_number: "CA-501", care_point_rate_cents: 2000 }
              as: Registrar
              captures: { fac_id: $.data.id }
            - call: "POST /residents"
              payload: { facility_id: "${fac_id}", full_name: "Rbac Ron", date_of_birth: "1940-01-01" }
              as: Registrar
              captures: { res_id: $.data.id }
            - call: "POST /billing-statements"
              payload: { resident_id: "${res_id}", period_year: 2026, period_month: 5, is_first_statement: false }
              as: BillingClerk
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /billing-statements/${stmt_id}/issue"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
