            - call: "POST /loyalty-accounts"
              payload: { full_name: "App Amy", home_stand_id: "${stand_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /stands/${stand_id}/throttle"
              payload: {}
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { err_throttle: $.data.error_id }
            - call: "POST /recipes"
              payload: { name: "Hacker Cola", channel: "CORE", base_price_cents: 100, base_build_seconds: 10, temperature_class: "ICED" }
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { err_recipe: $.data.error_id }
            - call: "POST /loyalty-accounts/${acct_id}/points-adjustments"
              payload: { delta_points: 10000, reason: "self-service" }
              as: LoyaltyCustomer
              as_user_id: "${acct_id}"
              captures: { err_points: $.data.error_id }
          assert:
            - "throttle -> 403 ERR_UNAUTHORIZED_ROLE"
            - "recipe create -> 403 ERR_UNAUTHORIZED_ROLE"
            - "points adjustment -> 403 ERR_UNAUTHORIZED_ROLE; account points still 0"

      - name: stand_operator_cannot_nominate_or_terminate_agreements
        claim_type: Violation → Error
        grounds:
          - roles.StandOperator
          - roles.RegionalManager
        distinguishing_aspect: "Agreement lifecycle is split across roles: nomination/termination are RegionalManager-exclusive — a StandOperator (even the agreement's own crew member) gets 403 on both."
        test_recipe:
          setup: ["Stand APPROVED; veteran crew member; one NOMINATED agreement."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_agr
          trigger:
            - call: "POST /operator-agreements"
              payload: { stand_id: "${stand_id}", crew_member_id: "${op_id}", revenue_share_pct: 0.30 }
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { err_nom: $.data.error_id }
            - call: "POST /operator-agreements/${agr_id}/terminate"
              payload: {}
              as: StandOperator
              as_user_id: "${op_id}"
              captures: { err_term: $.data.error_id }
          assert:
            - "nominate as StandOperator -> 403 ERR_UNAUTHORIZED_ROLE"
            - "terminate as StandOperator -> 403 ERR_UNAUTHORIZED_ROLE"

      - name: agreement_approval_enforces_segregation_of_duties
        claim_type: Segregation of duties
        grounds:
          - state_machines.OperatorAgreement.NOMINATED_to_APPROVED
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
        distinguishing_aspect: "The same X-User-ID may not nominate and approve: approval by 'rm-1' (the nominator) fails ERR_SEGREGATION_OF_DUTIES even though PlatformAdmin is the correct role class — the identity, not the role, is what is checked."
        test_recipe:
          setup: ["Stand APPROVED; agreement NOMINATED by rm-1."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_agr
          trigger:
            - call: "POST /operator-agreements/${agr_id}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "rm-1"
              captures: { err: $.data.error_id }
            - call: "POST /operator-agreements/${agr_id}/approve"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { approved: $.data.status, approver: $.data.approved_by }
          assert:
            - "approve with X-User-ID rm-1 (== nominated_by) -> 403 ERR_SEGREGATION_OF_DUTIES"
            - "approve with X-User-ID pa-1 succeeds; approved_by == \"pa-1\", status APPROVED"

      - name: refund_decision_enforces_segregation_of_duties
        claim_type: Segregation of duties
        grounds:
          - state_machines.Payment.REFUND_PENDING_to_REFUNDED
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Refund initiation and approval are split: the ShiftLead who opened a >2000-cent pending refund cannot... the decider must be a StandOperator whose identity differs from the initiator; REJECT returns the payment to CAPTURED with refunded_cents unchanged."
        test_recipe:
          setup: ["Stand OPEN; 5000-cent payment CAPTURED; ShiftLead (lead_id) opened a 5000-cent refund (REFUND_PENDING)."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
            - *k_op
            - *k_taker
            - *k_lead
            - *k_agr
            - *k_agr_ok
            - *k_agr_act
            - *k_open
