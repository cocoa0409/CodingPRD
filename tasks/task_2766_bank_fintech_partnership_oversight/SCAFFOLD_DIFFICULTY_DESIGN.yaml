  - rule_id: non_linear_state_machine
    instances:

      - name: diligence_info_requested_cycle_revisits_submitted_with_a_different_composite
        grounds:
          - state_machines.DiligenceReview.SUBMITTED_to_INFO_REQUESTED
          - state_machines.DiligenceReview.INFO_REQUESTED_to_SUBMITTED
          - state_machines.DiligenceReview.SUBMITTED_to_PASSED
          - calculations.diligence_composite_score
          - calculations.complaint_rate_bps
          - entities.DiligenceReview.fields.revision_round
        distinguishing_aspect: |
          The DiligenceReview machine is cyclic: one row visits SUBMITTED twice
          via SUBMITTED -> INFO_REQUESTED -> SUBMITTED, and because the RENEWAL
          variant re-reads partner.complaint_rate_bps at each submit the SAME row
          leaves the SAME state with composite_score 78.4 / TIER_2 on round 1 and
          65.8 / TIER_3 on round 2, while Partner.status stays IN_DILIGENCE across
          the entire loop.
        test_recipe:
          setup:
            - "One OversightCycle OPEN over [2026-08-01, 2026-09-01); clock at 2026-08-01T00:00:00Z."
            - "Partner 'Coriolis Wallet' (DEPOSIT_WALLET, end_user_account_count = 160) passed an INITIAL review scored 82/80/84/88 (composite 83.4, TIER_2) and sits in DILIGENCE_PASSED."
            - "Three EMAIL complaints already received, so complaint_rate_bps = 188 when the renewal is first submitted."
            - "A RENEWAL DiligenceReview scored 82/80/84/88 is in DRAFT."
          setup_api_calls:
            - call: "POST /oversight/cycles"
              payload: { cycle_label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
