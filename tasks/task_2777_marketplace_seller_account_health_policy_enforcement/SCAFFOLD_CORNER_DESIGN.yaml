      - name: error_absent_credentials_are_unauthenticated_before_any_unauthorized_check
        claim_type: every_error_triggerable
        grounds:
          - "validations[priority 10]"
          - "validations[priority 20]"
          - "errors[ERR_UNAUTHENTICATED]"
          - "errors[ERR_UNAUTHORIZED]"
          - "roles.Anonymous.exclusive_operations"
        distinguishing_aspect: |
          Three different header defects all collapse to 401 — no X-User-Role, a role string that is
          not a §1.7 name, and a recognised non-Anonymous role with no X-User-ID — while a
          well-formed identity in the wrong role is 403. Priority 10 runs before 20 and before the
          404 family, so a bad header on a dead path still returns 401, and POST /sellers is the one
          endpoint that must accept the Anonymous role.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "MISSING = 00000000-0000-0000-0000-000000000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "GET /sellers"
              payload: {}
              as: <no X-User-Role header sent>
              captures: { e_norole: $.data.error_id }
            - call: "GET /sellers"
              payload: {}
              as: <X-User-Role sent as "Auditor", not a §1.7 role name>
              captures: { e_badrole: $.data.error_id }
            - call: "GET /sellers"
              payload: {}
              as: <X-User-Role PolicyInvestigator with no X-User-ID header>
              captures: { e_noid: $.data.error_id }
            - call: "GET /sellers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: <no X-User-Role header sent>
              captures: { e_norole_deadpath: $.data.error_id }
            - call: "POST /policy-rules"
              payload: { code: "LA-AUTH-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT" }
              as: Anonymous
              captures: { e_anon_write: $.data.error_id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
          assert:
            - "${e_norole} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${e_badrole} == ERR_UNAUTHENTICATED with HTTP 401   # unknown role name, not 403"
            - "${e_noid} == ERR_UNAUTHENTICATED with HTTP 401   # X-User-ID is required for every role but Anonymous"
            - "${e_norole_deadpath} == ERR_UNAUTHENTICATED with HTTP 401   # priority 10 beats the priority 30 path check"
            - "${e_anon_write} == ERR_UNAUTHORIZED with HTTP 403 — Anonymous carries no X-User-ID yet is authenticated"
            - "the final call: HTTP 201 and ${s_id} is a fresh Seller — Anonymous is sufficient for POST /sellers"
            - "no PolicyRule with code LA-AUTH-1 exists"

      - name: error_full_hold_row_cannot_be_released_by_hand
        claim_type: every_error_triggerable
        grounds:
          - "errors[ERR_HOLD_NOT_MANUALLY_RELEASABLE]"
          - "errors[ERR_INVALID_REQUEST]"
          - "endpoints[POST /disbursement-holds/{id}/release].side_effects"
        distinguishing_aspect: |
          The auto FULL_HOLD minted by the suspension cascade is the only hold a compliance officer
          may not release; it may leave ACTIVE only through the appeal cascade or a forfeit. The same
          endpoint also owns a caller-facing enum restriction: release_reason accepts only MANUAL and
          INVESTIGATION_CLOSED, so the cascade's own SUPERSEDED_BY_FULL_HOLD value is a priority-70
          ERR_INVALID_REQUEST and therefore outranks the priority-85 releasability check on the very
          same row — the two probes differ only in the reason string.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-SUSP-1 (LISTING_ACCURACY, base_severity_weight 12.00, ACCOUNT, requires_poa false)."
            - "Seller credited 100000 cents, then one SUBSTANTIATED violation is enforced: first offence, repeat_factor 1.00, metric_tier null, so severity_points_applied = 12.00 and post_balance = 12.00 >= LADDER_SUSPEND_POINTS -> ACCOUNT_SUSPENSION -> SUSPENDED -> FULL_HOLD."
            - "The cascade mints one auto FULL_HOLD sweeping the whole 100000 available balance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-SUSP-1", category: "LISTING_ACCURACY", base_severity_weight: 12.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_susp: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_susp}", reporter_type: "BUYER", evidence_reference: "EV-SUSP-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1: $.data.id, a1_type: $.data.action_type, a1_points: $.data.severity_points_applied }
            - call: "GET /disbursement-holds"
              payload: { seller_id: "${s_id}", state: "ACTIVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { auto_hold: "$.data[0].id", auto_type: "$.data[0].hold_type", auto_amount: "$.data[0].held_amount_cents" }
          trigger:
            - call: "POST /disbursement-holds/${auto_hold}/release"
              payload: { release_reason: "SUPERSEDED_BY_FULL_HOLD" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_reason: $.data.error_id }
            - call: "POST /disbursement-holds/${auto_hold}/release"
              payload: { release_reason: "MANUAL" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_full: $.data.error_id }
          assert:
            - "${a1_points} == 12.00 and ${a1_type} == ACCOUNT_SUSPENSION"
            - "${auto_type} == FULL_HOLD, ${auto_amount} == 100000, auto_created == true, reserve_basis == NONE"
            - "first trigger: HTTP 400 and ${e_reason} == ERR_INVALID_REQUEST   # priority 70 beats the releasability check"
            - "second trigger: HTTP 409 and ${e_full} == ERR_HOLD_NOT_MANUALLY_RELEASABLE"
            - "DisbursementHold.${auto_hold}.state is still ACTIVE and released_at is null after both refusals"
            - "Seller.${s_id}.available_balance_cents == 0 and held_balance_cents == 100000"
            - "Seller.${s_id}.disbursement_state == FULL_HOLD and enforcement_state == SUSPENDED"

      - name: error_forfeit_is_refused_while_the_seller_is_only_suspended
        claim_type: every_error_triggerable
        grounds:
          - "errors[ERR_SELLER_NOT_BANNED]"
          - "endpoints[POST /disbursement-holds/{id}/forfeit].side_effects"
        distinguishing_aspect: |
          Forfeiture is the one irreversible money movement in the domain, so it is gated on the
          terminal enforcement state rather than on the hold's own state: an ACTIVE FULL_HOLD on a
          SUSPENDED seller is exactly the case an implementation is most likely to allow, and it must
          be refused with a state-group 409. The refusal must also leave the ledger untouched, which
          separates a real guard from one that debits first and validates second.
        test_recipe:
          setup:
            - "Reuse the LA-SUSP-1 setup: seller SUSPENDED / FULL_HOLD with one auto hold of 100000 and available 0."
            - "The seller has never been banned — no ban_reason and no confirmed related-account link."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-FRF-1", category: "LISTING_ACCURACY", base_severity_weight: 12.00, removal_scope: "ACCOUNT", requires_poa: false }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_frf: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /sellers/${s_id}/proceeds-credits"
              payload: { amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_frf}", reporter_type: "BUYER", evidence_reference: "EV-FRF-0001" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { v1: $.data.id }
            - call: "POST /violations/${v1}/open-investigation"
              payload: {}
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /violations/${v1}/adjudicate"
              payload: { outcome: "SUBSTANTIATED" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
            - call: "POST /enforcement-actions"
              payload: { violation_id: "${v1}" }
              as: PolicyInvestigator
              as_user_id: "inv-1"
              captures: { a1_state: $.data.state }
            - call: "GET /disbursement-holds"
              payload: { seller_id: "${s_id}", state: "ACTIVE" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { auto_hold: "$.data[0].id" }
            - call: "GET /sellers/${s_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { enf: $.data.enforcement_state, ban: $.data.ban_reason }
          trigger:
            - call: "POST /disbursement-holds/${auto_hold}/forfeit"
              payload: { forfeited_amount_cents: 100000 }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { e_notbanned: $.data.error_id }
          assert:
            - "${enf} == SUSPENDED and ${ban} == null"
            - "trigger: HTTP 409 and ${e_notbanned} == ERR_SELLER_NOT_BANNED   # not ERR_INVALID_STATE, not ERR_FORFEIT_EXCEEDS_HOLD"
            - "DisbursementHold.${auto_hold}.state is still ACTIVE, forfeited_amount_cents == null"
            - "Seller.${s_id}.held_balance_cents == 100000 and available_balance_cents == 0 — no money left the account"
            - "Seller.${s_id}.version is unchanged by the refused forfeit"

  # =========================================================================
  # SECTION 7 — RBAC (§1.7)
  # =========================================================================
  - section: rbac
    instances:

      - name: rbac_seller_only_writes_cannot_be_performed_by_any_operator
        claim_type: exclusive_operations
        grounds:
          - "roles.Seller.exclusive_operations"
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: |
          Six write endpoints belong to the seller alone — listing creation, relisting, acknowledgement,
          plan submission, appeal filing and escalation — and an operator must not be able to act on
          the seller's behalf even with the most powerful role. Each probe is aimed at a row that
          exists and is in the right state, so the only reason for the 403 is the role: the priority-20
          role check runs before any state, ownership or body check, which is why bodies that would
          otherwise be malformed still yield ERR_UNAUTHORIZED and not ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-RB1-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa true)."
            - "One seller with one ACTIVE listing; one violation substantiated and enforced as a1 (WARNING, requires_poa true)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /policy-rules"
              payload: { code: "LA-RB1-1", category: "LISTING_ACCURACY", base_severity_weight: 2.00, removal_scope: "ACCOUNT", requires_poa: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { rule_rb1: $.data.id, rule_rb1_poa: $.data.requires_poa }
