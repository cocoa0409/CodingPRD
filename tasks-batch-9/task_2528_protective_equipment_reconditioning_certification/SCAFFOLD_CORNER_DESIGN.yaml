          - errors.ERR_PART_MODEL_MISMATCH
        distinguishing_aspect: |
          Validity depends on a third entity: the ApprovedPart is genuine and in
          stock, but its model_spec_id is the ABS shell AB-2026 while the unit was
          identified as SF-2026, so the line must be refused with
          ERR_PART_MODEL_MISMATCH / 422 and the order must keep zero lines and a
          zero parts subtotal.
        test_recipe:
          setup:
            - "one unit in REPAIR_PENDING with an open DRAFT RepairOrder"
            - "one ApprovedPart belonging to a different ModelSpec (AB-2026)"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
