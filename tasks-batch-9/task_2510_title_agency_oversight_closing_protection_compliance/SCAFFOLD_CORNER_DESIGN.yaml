# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# §1.1-§1.7 surface. Sections and claim_type values are taken from that guide.
# Corners already asserted by a §1.8 instance carry an excluded_because stub.
# Every chain replays from an empty DB; the logical clock default is
# 2026-08-01T00:00:00Z unless a chain moves it.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: creation_state_program_persists_every_declared_input
        claim_type: creation
        grounds:
          - entities.StateProgram
          - endpoints.POST_/state-programs
        distinguishing_aspect: "A single POST with all eight required inputs returns 201 and echoes every one of them unchanged, plus a server-minted id, created_at and version 1."
        test_recipe:
          setup:
            - "Empty database; no state program exists yet."
          setup_api_calls: []
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_id: "$.data.id", sp_version: "$.data.version" }
          assert:
            - "HTTP 201 and response_type == \"object\" with meta.api_request_id and meta.api_request_timestamp present"
            - "data.state_code == \"CA\", data.cpl_permitted == true, data.cpl_coverage_cap_cents == 100000000"
            - "data.premium_split_agency_pct == 0.80, data.policy_issuance_deadline_days == 30, data.three_way_tolerance_cents == 100000, data.counsel_referral_threshold_cents == 60000000"
            - "data.cpl_scope_allowed == [\"FULL_SETTLEMENT\", \"LENDER_ONLY\", \"SELLER_PROCEEDS\"]"
            - "${sp_version} == 1 and ${sp_id} is a bare UUID with no type prefix"

      - name: retrieval_agency_returns_stored_row_with_system_defaults
        claim_type: retrieval
        grounds:
          - entities.Agency
          - endpoints.GET_/agencies/{id}
        distinguishing_aspect: "GET /agencies/{id} returns the row exactly as created: client inputs unchanged and every system or computed field at its declared default, including oversight_posture RESTRICTED for a brand-new agency."
        test_recipe:
          setup:
            - "One agency created and never mutated."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-2001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
          trigger:
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: LicensingAnalyst
          assert:
            - "HTTP 200 with data.id == ${ag_id}, data.legal_name == \"Harbor Title Agency\", data.tax_id == \"TAX-2001\""
            - "data.appointment_status == \"PENDING_REVIEW\" and data.financial_review_status == \"NOT_SUBMITTED\""
            - "data.oversight_posture == \"RESTRICTED\" and data.escrow_standing == \"COMPLIANT\" and data.defalcation_score == 0"
            - "data.open_critical_finding_count == 0, data.unreported_policy_count == 0, data.cpl_outstanding_exposure_cents == 0, data.unremitted_premium_cents == 0, data.pending_transfer_count == 0"
            - "data.version == 1 and data.termination_reason is null and data.transferee_agency_id is null"

      - name: listing_agencies_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/agencies
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three agencies stored, limit=2&offset=0 returns two rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "Three agencies with distinct tax ids and no other state."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { legal_name: "Agency One", tax_id: "TAX-3001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
            - call: "POST /agencies"
              payload: { legal_name: "Agency Two", tax_id: "TAX-3002", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
            - call: "POST /agencies"
              payload: { legal_name: "Agency Three", tax_id: "TAX-3003", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
          trigger:
            - call: "GET /agencies"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /agencies"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "trigger[0]: HTTP 200, response_type == \"array\", total_count == 3, has_more == true, limit == 2, offset == 0 and data has length 2"
            - "trigger[1]: total_count == 3, has_more == false, offset == 2 and data has length 1"
            - "${page1_first} != ${page2_first} — the pages do not overlap"

      - name: not_found_get_escrow_audit_with_unknown_uuid_returns_404
        claim_type: not_found
        grounds:
          - validations.priority_40.ERR_ESCROW_AUDIT_NOT_FOUND
          - errors.ERR_ESCROW_AUDIT_NOT_FOUND
        distinguishing_aspect: "A well-formed but unknown UUID in the escrow_audit_id path segment returns 404 ERR_ESCROW_AUDIT_NOT_FOUND rather than 400 or an empty object."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /escrow-audits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: EscrowAuditor
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_ESCROW_AUDIT_NOT_FOUND\""
            - "data.message is a non-empty string and meta.api_request_id is present"

      - name: required_fields_create_agency_without_tax_id_returns_400
        claim_type: required_fields
        grounds:
          - validations.priority_30.ERR_INVALID_REQUEST
          - entities.Agency.fields.tax_id
        distinguishing_aspect: "tax_id is source: input with no default, so omitting it is rejected at priority 30 with ERR_INVALID_REQUEST before any uniqueness or business check runs."
        test_recipe:
          setup:
            - "Empty database, so no uniqueness conflict could be reported instead."
          setup_api_calls: []
          trigger:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /agencies returns total_count == 0 — no partial row was written"

      - name: defaults_new_escrow_account_opens_with_zeroed_balances
        claim_type: defaults
        grounds:
          - entities.EscrowAccount.fields.status
          - entities.EscrowAccount.fields.snapshot_as_of
          - entities.EscrowAccount.fields.adjusted_bank_balance_cents
        distinguishing_aspect: "Creating an escrow account supplies only agency_id, bank_name and account_ref, so status defaults to OPEN, every balance field to 0 and snapshot_as_of to null."
        test_recipe:
          setup:
            - "One agency; no snapshot has ever been posted."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-4001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
          trigger:
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea_id: "$.data.id" }
          assert:
            - "HTTP 201 with data.status == \"OPEN\" and data.snapshot_as_of is null"
            - "data.book_balance_cents == 0, data.bank_balance_cents == 0, data.outstanding_items_cents == 0, data.trial_balance_cents == 0"
            - "data.unidentified_funds_cents == 0, data.aged_unidentified_over_90_cents == 0, data.adjusted_bank_balance_cents == 0"
            - "data.version == 1 and data.agency_id == ${ag_id}"

      - name: computed_fields_adjusted_bank_balance_derived_from_snapshot
        claim_type: computed_fields
        grounds:
          - entities.EscrowAccount.fields.adjusted_bank_balance_cents
          - calculations.escrow_three_way_variance
          - endpoints.POST_/escrow-accounts/{id}/balance-snapshot
        distinguishing_aspect: "adjusted_bank_balance_cents is source: computed — posting a snapshot of bank 10120000 with outstanding items 100000 stores 10020000, a value the client never sent."
        test_recipe:
          setup:
            - "One agency with one OPEN escrow account and no snapshot yet."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-4002", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea_id: "$.data.id" }
          trigger:
            - call: "POST /escrow-accounts/${ea_id}/balance-snapshot"
              payload: { book_balance_cents: 10000000, bank_balance_cents: 10120000, outstanding_items_cents: 100000, trial_balance_cents: 10015000, unidentified_funds_cents: 25000, aged_unidentified_over_90_cents: 0, snapshot_as_of: "2026-07-31" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { adjusted: "$.data.adjusted_bank_balance_cents" }
          assert:
            - "HTTP 200 with ${adjusted} == 10020000 (bank_balance_cents 10120000 minus outstanding_items_cents 100000)"
            - "data.snapshot_as_of == \"2026-07-31\" and data.trial_balance_cents == 10015000 and data.unidentified_funds_cents == 25000"
            - "data.status == \"OPEN\" — recording a snapshot does not change the account status"

      - name: system_fields_agency_version_starts_at_one_and_increments_on_mutation
        claim_type: system_fields
        grounds:
          - entities.Agency.fields.version
          - concurrency_rules.remittance-statement-create-stale-agency
        distinguishing_aspect: "version is a system field starting at 1 that increments by exactly one per mutation: creating a remittance statement against the agency takes it from 1 to 2 without the client ever writing it."
        test_recipe:
          setup:
            - "One freshly created agency at version 1."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-4003", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id", ag_v_created: "$.data.version" }
          trigger:
            - call: "POST /remittance-statements"
              payload: { agency_id: "${ag_id}", period_start: "2026-07-01", period_end: "2026-07-31", expected_agency_version: "${ag_v_created}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { st_id: "$.data.id" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: LicensingAnalyst
              captures: { ag_v_after: "$.data.version" }
          assert:
            - "${ag_v_created} == 1 and ${ag_v_after} == 2"
            - "RemittanceStatement.${st_id}.version == 1 and its created_at is ISO 8601 UTC with three fractional digits"
            - "Agency.${ag_id}.updated_at is later than its created_at"

      - name: type_constraints_state_program_split_pct_above_one_returns_400
        claim_type: type_constraints
        grounds:
          - validations.priority_30.ERR_INVALID_REQUEST
          - entities.StateProgram.fields.premium_split_agency_pct
        distinguishing_aspect: "premium_split_agency_pct is constrained to [0, 1]; 1.5 is rejected with ERR_INVALID_REQUEST even though its JSON type is correct."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT"], premium_split_agency_pct: 1.5, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /state-programs/{any id} is impossible because no row was created"

      - name: parent_relationships_line_under_unknown_statement_returns_404
        claim_type: parent_relationships
        grounds:
          - validations.priority_40.ERR_REMITTANCE_STATEMENT_NOT_FOUND
          - entities.RemittanceLine.parent
        distinguishing_aspect: "RemittanceLine is reachable only under its parent statement: an unknown remittance_statement_id in the path is rejected at priority 40 with ERR_REMITTANCE_STATEMENT_NOT_FOUND, before the body's policy_file_id is even resolved."
        test_recipe:
          setup:
            - "Empty database, so the body's policy_file_id is also unknown and would fail at priority 45 if the path check did not fire first."
          setup_api_calls: []
          trigger:
            - call: "POST /remittance-statements/00000000-0000-4000-8000-000000000000/lines"
              payload: { policy_file_id: "11111111-1111-4111-8111-111111111111", reported_gross_premium_cents: 1000000 }
              as: AgencyPrincipal
              as_user_id: "22222222-2222-4222-8222-222222222222"
          assert:
            - "HTTP 404 with data.error_id == \"ERR_REMITTANCE_STATEMENT_NOT_FOUND\""
            - "the response is not \"ERR_POLICY_FILE_NOT_FOUND\" — path existence at priority 40 outranks body FK resolution at priority 45"

      - name: flat_body_fk_resolution_reports_agency_before_state_program_returns_404
        claim_type: flat
        grounds:
          - validations.priority_45.ERR_AGENCY_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so cross-references are body FKs resolved left to right in declaration order: with both agency_id and state_program_id unknown, the answer is ERR_AGENCY_NOT_FOUND, never ERR_STATE_PROGRAM_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database, so both foreign keys in the body are unresolvable."
          setup_api_calls: []
          trigger:
            - call: "POST /agency-appointments"
              payload: { agency_id: "00000000-0000-4000-8000-000000000000", state_program_id: "11111111-1111-4111-8111-111111111111", license_number: "CA-9999", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
          assert:
            - "HTTP 404 with data.error_id == \"ERR_AGENCY_NOT_FOUND\""
            - "GET /agency-appointments returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_state_new_escrow_audit_starts_in_draft
        claim_type: initial_state
        grounds:
          - state_machines.EscrowAudit.initial_state
          - entities.EscrowAudit.fields.status
          - entities.EscrowAudit.fields.conducted_by_user_id
        distinguishing_aspect: "A newly created audit is DRAFT with conducted_by_user_id set from the caller's X-User-ID, no variance computed yet and risk_tier at its LOW default."
        test_recipe:
          setup:
            - "One agency with one OPEN escrow account and no prior audit."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-5001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea_id: "$.data.id" }
          trigger:
            - call: "POST /escrow-audits"
              payload: { agency_id: "${ag_id}", escrow_account_id: "${ea_id}", audit_type: "SURPRISE", as_of_date: "2026-07-31" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { au_id: "$.data.id", au_status: "$.data.status" }
          assert:
            - "HTTP 201 with ${au_status} == \"DRAFT\""
            - "data.conducted_by_user_id == \"auditor-1\" and data.closed_by_user_id is null"
            - "data.variance_method is null, data.reconciliation_variance_cents == 0, data.risk_tier == \"LOW\""
            - "data.open_finding_count == 0, data.critical_finding_count == 0, data.submitted_at is null"

      - name: invalid_transition_escrow_audit_draft_to_under_review_returns_409
        claim_type: invalid_transition
        grounds:
          - state_machines.EscrowAudit
          - validations.priority_80.ERR_INVALID_STATE
        distinguishing_aspect: "DRAFT -> UNDER_REVIEW is absent from the EscrowAudit transition table (review is reachable only from SUBMITTED), so the request is rejected with ERR_INVALID_STATE and the audit stays DRAFT."
        test_recipe:
          setup:
            - "One DRAFT audit on an OPEN escrow account that has never been submitted."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-5002", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /escrow-accounts"
              payload: { agency_id: "${ag_id}", bank_name: "First Trust Bank", account_ref: "ESCROW-1" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { ea_id: "$.data.id" }
            - call: "POST /escrow-audits"
              payload: { agency_id: "${ag_id}", escrow_account_id: "${ea_id}", audit_type: "SCHEDULED", as_of_date: "2026-07-31" }
              as: EscrowAuditor
              as_user_id: "auditor-1"
              captures: { au_id: "$.data.id" }
          trigger:
            - call: "POST /escrow-audits/${au_id}/state"
              payload: { to_state: "UNDER_REVIEW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "HTTP 409 with data.error_id == \"ERR_INVALID_STATE\""
            - "EscrowAudit.${au_id}.status is still \"DRAFT\" and submitted_at is still null"

      - name: precondition_enforcement_submit_statement_without_lines_returns_409
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RemittanceStatement.DRAFT_to_SUBMITTED
          - validations.priority_80.ERR_STATEMENT_HAS_NO_LINES
        distinguishing_aspect: "DRAFT -> SUBMITTED exists in the table, so only the transition's own precondition can block it: a statement with zero lines is refused with ERR_STATEMENT_HAS_NO_LINES and submitted_at stays null."
        test_recipe:
          setup:
            - "One agency with one DRAFT remittance statement for 2026-07-01..2026-07-31 and no lines."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-5003", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id", ag_v1: "$.data.version" }
            - call: "POST /remittance-statements"
              payload: { agency_id: "${ag_id}", period_start: "2026-07-01", period_end: "2026-07-31", expected_agency_version: "${ag_v1}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { st_id: "$.data.id", st_status: "$.data.status" }
          trigger:
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
          assert:
            - "${st_status} == \"DRAFT\" (the declared initial state)"
            - "HTTP 409 with data.error_id == \"ERR_STATEMENT_HAS_NO_LINES\""
            - "RemittanceStatement.${st_id}.status is still \"DRAFT\" and submitted_at is still null"
            - "GET /remittance-statements/${st_id}/lines returns total_count == 0"

      - name: idempotency_second_appoint_decision_returns_409
        claim_type: idempotency
        grounds:
          - state_machines.Agency.appointment_status.PENDING_REVIEW_to_APPOINTED
          - validations.priority_80.ERR_INVALID_STATE
        distinguishing_aspect: "APPOINT is not idempotent by design: replaying it against an already APPOINTED agency finds no APPOINTED -> APPOINTED transition and returns ERR_INVALID_STATE without touching the agency's version."
        test_recipe:
          setup:
            - "One APPOINTED agency in CA with an ACCEPTED financial review and an ACTIVE appointment."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-5004", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
              captures: { status_first: "$.data.appointment_status", v_after_first: "$.data.version" }
          trigger:
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
          assert:
            - "${status_first} == \"APPOINTED\""
            - "HTTP 409 with data.error_id == \"ERR_INVALID_STATE\""
            - "Agency.${ag_id}.appointment_status is still \"APPOINTED\" and its version is still ${v_after_first}"

      - name: terminal_state_lockdown_voided_letter_cannot_be_reissued_returns_409
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ClosingProtectionLetter.terminal_states
          - validations.priority_80.ERR_ALREADY_TERMINAL
        distinguishing_aspect: "VOIDED is terminal for ClosingProtectionLetter, so re-issuing a voided letter is refused with ERR_ALREADY_TERMINAL and the exposure ledger stays at 0 rather than being re-credited."
        test_recipe:
          setup:
            - "APPOINTED agency in CA with one letter that was ISSUED for 30000000 and then VOIDED, leaving cpl_outstanding_exposure_cents at 0."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-5005", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
