        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[preorder-allocate-stale-release]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After one allocation bumps ReleaseProduct.version, a second allocate carrying the pre-bump version (${rpv0}) → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A release whose version advanced once (one allocation done); a second REQUESTED pre-order awaits allocation, but the client still holds the pre-allocation version."]
          setup_api_calls:
