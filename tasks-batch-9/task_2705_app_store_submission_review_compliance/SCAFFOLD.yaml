  # --- RolloutPlan -------------------------------------------------------------
  - method: POST
    path: /rollout-plans
    description: "Schedule a phased or immediate release of an approved build."
    roles: [ReleaseManager]
    input: [expected_app_record_version, app_record_id, submission_id, mode, scheduled_start_at]
    output: RolloutPlan
    success_code: 201
    side_effects:
      - "OCC on AppRecord.version (§1.2.1 rollout-plan-create-stale-app-record); 412 ERR_STALE_APP_RECORD_VERSION on mismatch"
      - "state = SCHEDULED, phase_index = 0, released_share_pct = 0.00, held_back_share_pct = 100.00"
      - "projected_end_at derived per calculations.rollout_window_exclusivity; enforces closed-interval exclusivity and the ROLLBACK_COOLDOWN_HOURS buffer"
      - "Increments AppRecord.version by 1"

  - method: GET
    path: /rollout-plans
    description: "List rollout plans."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformPolicyAdmin, Auditor]
    input: ["app_record_id?", "submission_id?", "state?", "mode?", "limit?", "offset?"]
    output: RolloutPlan[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /rollout-plans/{id}
    description: "Read one rollout plan with its conserved audience share pair."
    roles: [PublisherAdmin, ReleaseManager, ComplianceOfficer, PlatformPolicyAdmin, Auditor]
    input: []
    output: RolloutPlan
    success_code: 200
    side_effects: []

  - method: POST
    path: /rollout-plans/{id}/start
    description: "Start the release; PHASED enters phase 0, IMMEDIATE completes at once (divergent branches)."
    roles: [ReleaseManager]
    input: []
    output: RolloutPlan
    success_code: 200
    side_effects:
      - "PHASED: SCHEDULED -> PHASE_ACTIVE, phase_index = 0, released 1.00 / held_back 99.00, phase_entered_at = clock_now, AppRecord.distribution_state -> PHASED_ROLLOUT"
      - "IMMEDIATE: SCHEDULED -> COMPLETED in one step, released 100.00 / held_back 0.00, AppRecord.distribution_state -> FULLY_RELEASED without ever exposing a partial audience"
      - "Sets AppRecord.live_submission_id = submission_id; increments AppRecord.version by 1"

  - method: POST
    path: /rollout-plans/{id}/advance
    description: "Advance to the next audience phase (self-loop, exits to COMPLETED at the last phase)."
    roles: [ReleaseManager]
    input: [to_phase_index]
    output: RolloutPlan
    success_code: 200
    side_effects:
      - "Requires to_phase_index == phase_index + 1 and the MIN_PHASE_DWELL_HOURS dwell (inclusive)"
      - "released_share_pct = PHASE_PCTS[to_phase_index], held_back_share_pct = 100.00 - released_share_pct, mirrored onto the AppRecord"
      - "Reaching PHASE_COUNT - 1 exits the loop: state -> COMPLETED, completed_at set, AppRecord.distribution_state -> FULLY_RELEASED"

  - method: POST
    path: /rollout-plans/{id}/hold
    description: "Pause or resume an active rollout."
    roles: [ReleaseManager, PlatformPolicyAdmin]
    input: [action, "pause_reason_code?"]
    output: RolloutPlan
    success_code: 200
    side_effects:
      - "action PAUSE: PHASE_ACTIVE -> PAUSED, share fields frozen, AppRecord.distribution_state -> PAUSED"
      - "action RESUME: PAUSED -> PHASE_ACTIVE, requires compliance_posture == OPEN, pause_reason_code cleared and phase_entered_at = clock_now (the dwell clock restarts)"

  - method: POST
    path: /rollout-plans/{id}/rollback
    description: "Emergency rollback of an in-flight, paused or completed release."
    roles: [ReleaseManager, PlatformPolicyAdmin]
    input: [rollback_reason_code, halt_distribution]
    output: RolloutPlan
    success_code: 200
    side_effects:
      - "state -> ROLLED_BACK, terminated_at = clock_now, released_share_pct = 0.00, held_back_share_pct = 100.00"
      - "halt_distribution == true: AppRecord.distribution_state -> ROLLED_BACK, EXTERNAL_PAYMENT_LINK CommerceItems -> REMOVED, and the next plan must respect ROLLBACK_COOLDOWN_HOURS"
      - "halt_distribution == false: AppRecord.distribution_state -> NOT_DISTRIBUTED with no cooldown buffer at all"
      - "AppRecord.rollback_count += 1, live_submission_id = null, both standing variants recomputed; exempt from the posture gate"

