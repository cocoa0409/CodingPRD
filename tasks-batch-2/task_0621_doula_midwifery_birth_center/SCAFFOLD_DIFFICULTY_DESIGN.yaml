  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- Instance 1: Room booking — half-open + turnover buffer
      - name: rto_room_halfopen_turnover_buffer
        grounds:
          - validations[priority=12]
          - entities.Room.fields.turnover_minutes
          - entities.Booking.fields.starts_at
        distinguishing_aspect: |
          Room interval semantics: HALF-OPEN [starts_at, ends_at) with a turnover buffer applied
          AFTER each booking. With turnover_minutes=30, a second booking starting exactly at the
          first booking's ends_at collides (must wait for ends_at + 30 min), so it is rejected
          with ERR_ROOM_DOUBLE_BOOKED; a booking starting at ends_at + 30 min succeeds.
        test_recipe:
          setup:
            - "Room R1 with turnover_minutes=30; two episodes (e1, e2) so each booking serves a distinct episode."
            - "First booking on R1 [2026-01-02T00:00Z, 2026-01-02T06:00Z) held."
          setup_api_calls:
            - call: "POST /birth-center/supply-kits"
              payload: { sku: "BK1", name: "Birth Kit", on_hand_count: 5 }
              as: CenterAdmin
            - call: "POST /birth-center/care-packages"
              payload: { code: "PKG_BIRTH", package_type: "BIRTH", global_fee_cents: 800000, prenatal_visits_included: 3, postpartum_visits_included: 2, kit_sku: "BK1" }
              as: CenterAdmin
            - call: "POST /birth-center/clients"
              payload: { full_name: "Ada A", date_of_birth: "1994-03-02", parity: 0 }
              as: IntakeCoordinator
              captures: { c1_id: $.data.id }
