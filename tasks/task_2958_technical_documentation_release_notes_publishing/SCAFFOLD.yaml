# =============================================================================
# PRD Benchmark Scaffold — Technical Documentation & Release Notes Publishing
# Sections §1.0 – §1.7. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2958. Technical Documentation & Release Notes Publishing (product documentation team):
  documentation planning tied to feature releases with writer assignment and information
  architecture decisions, source content authoring with docs-as-code workflows, review by
  engineering and product with technical accuracy sign-off, versioned documentation for
  supported product releases with archive and end-of-life notices, release note compilation
  from change records with customer-facing language and severity categorization, localization
  pipeline with translation memory and simultaneous or delayed publication decisions, feedback
  collection with page-level ratings and support ticket deflection measurement, deprecation and
  migration guide publication with timeline communication, style guide governance and
  terminology management

domain_name: "docs-release-publishing"
api_prefix: "/"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
    - optimistic_concurrency

  entity_topology: graph
  # Topic is self-referential (parent_topic_id builds the information-architecture
  # tree and must stay acyclic); LocalizationJob is a junction of Topic x LocaleProfile;
  # SignOff is a junction of Topic x Reviewer; DeprecationNotice points at both a
  # ReleaseTrain and a migration-guide Topic. Containment exists but the interesting
  # edges cut across it, so the model is a graph, not a tree.

  state_machine_shape: parallel
  # Topic carries two independent state dimensions (review_state x publication_state):
  # a PUBLISHED topic whose author lands a new revision returns to review_state
  # NOT_SUBMITTED while the published page stays live. LocalizationJob adds a
  # fork-join (SIMULTANEOUS vs DELAYED publication branches) plus a rework cycle,
  # and ChangeRecord adds an editorial rework cycle. ReleaseTrain.doc_readiness_posture
  # is a compound derived field over its DocPlanItem children.

  relationship_patterns:
    - one_to_many          # ReleaseTrain -> DocPlanItem -> Topic -> SourceRevision
    - many_to_many         # LocalizationJob (Topic x LocaleProfile), SignOff (Topic x Reviewer)
    - self_referential     # Topic.parent_topic_id (IA tree, cycle-checked)
    - cross_aggregate      # DeprecationNotice -> migration-guide Topic; ChangeRecord <-> DeprecationNotice by feature_key

  role_model: segregation_of_duties
  # A Reviewer may not sign off on a Topic whose latest revision was authored by a
  # Writer sharing the reviewer's person_key, and the DocsLead operator who submitted
  # a ChangeRecord may not be the operator who performs its editorial pass.

  consistency_model: immediate

difficulty_level: expert_plus
# 15 entities / 63 endpoints / 74 error codes / 12 calculations (3 of them dual-variant)
# / 11 state machines (2 non-linear on different entities) / 61 validation rules
# / 2 OCC rules on different parents.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: ReleaseTrain
    parent: null
    common_fields: true
    fields:
      - name: product_key
        type: string
        source: input
        description: "Product line key the release train belongs to"
        constraints: "2-12 chars, uppercase A-Z and digits only"
      - name: version_label
        type: string
        source: input
        description: "Marketing version label of the release, e.g. 14.2"
        constraints: "1-20 chars; unique per product_key"
      - name: doc_freeze_date
        type: string
        source: input
        description: "Calendar date documentation content freezes for this release"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: ga_date
        type: string
        source: input
        description: "Calendar date the release goes generally available"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be >= doc_freeze_date"
      - name: support_end_date
        type: string
        source: input
        description: "Calendar date support ends (end-of-life date for the doc set)"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be > ga_date"
      - name: localization_budget_cap_cents
        type: integer
        source: input
        description: "Hard cap in cents on the projected localization budget of any doc set published for this train"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the release train"
        default: PLANNED
        constraints: "one of {PLANNED, DOC_FREEZE, GA, MAINTENANCE, END_OF_LIFE}; advanced one step at a time"
      - name: plan_item_count
        type: integer
        source: computed
        description: "Count of DocPlanItem children with status != CANCELLED"
        default: 0
      - name: approved_plan_item_count
        type: integer
        source: computed
        description: "Count of DocPlanItem children with status IN {APPROVED_CONTENT, PUBLISHED}"
        default: 0
      - name: approved_topic_ratio
        type: number
        source: computed
        description: "approved_plan_item_count / plan_item_count per calculations.release_train_doc_readiness; 1.00 when plan_item_count == 0"
        default: 1.00
        constraints: "2 decimal places, round_half_up"
      - name: doc_readiness_posture
        type: enum
        source: computed
        description: "Derived gate over all child content operations per calculations.release_train_doc_readiness"
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, FROZEN}"
      - name: localization_committed_cents
        type: integer
        source: computed
        description: "Sum of estimated_cost_cents over LocalizationJob rows whose topic belongs to this train and whose state IN {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED}"
        default: 0
      - name: eol_notice_posted
        type: boolean
        source: system
        description: "True once any DocSetVersion of this train has been archived with an end-of-life notice"
        default: false

  - name: Writer
    parent: null
    common_fields: true
    fields:
      - name: person_key
        type: string
        source: input
        description: "Stable person identifier shared with the Reviewer table for segregation-of-duties checks"
        constraints: "3-40 chars; unique across Writer rows"
      - name: full_name
        type: string
        source: input
        description: "Display name of the technical writer"
        constraints: "1-120 chars"
      - name: seniority_tier
        type: enum
        source: input
        description: "Seniority band, divides the raw load points of an assignment"
        constraints: "one of {ASSOCIATE, SENIOR, PRINCIPAL}"
      - name: capacity_points
        type: number
        source: input
        description: "Load points this writer may hold concurrently"
        constraints: "> 0; 1 decimal place"
      - name: status
        type: enum
        source: input
        description: "Availability of the writer; ON_LEAVE writers cannot receive assignments"
        default: ACTIVE
        constraints: "one of {ACTIVE, ON_LEAVE}"
      - name: committed_load_points
        type: number
        source: computed
        description: "Conserved quantity per calculations.writer_committed_load_points — sum of load_points over the writer's DocPlanItem rows with status IN {ASSIGNED, IN_AUTHORING, IN_REVIEW, IN_REVISION, APPROVED_CONTENT}"
        default: 0.0
      - name: assignment_count
        type: integer
        source: computed
        description: "Count of DocPlanItem rows counted by committed_load_points"
        default: 0

  - name: Reviewer
    parent: null
    common_fields: true
    fields:
      - name: person_key
        type: string
        source: input
        description: "Stable person identifier; compared against Writer.person_key for the self-review prohibition"
        constraints: "3-40 chars; unique across Reviewer rows"
      - name: full_name
        type: string
        source: input
        description: "Display name of the reviewer"
        constraints: "1-120 chars"
      - name: discipline
        type: enum
        source: input
        description: "Which sign-off this reviewer is empowered to give"
        constraints: "one of {ENGINEERING, PRODUCT}"
      - name: open_signoff_count
        type: integer
        source: computed
        description: "Count of SignOff rows for this reviewer with state == PENDING"
        default: 0

  - name: DocPlanItem
    parent: ReleaseTrain
    common_fields: true
    fields:
      - name: release_train_id
        type: string
        source: input
        description: "FK -> ReleaseTrain.id; the release this planned deliverable documents"
      - name: feature_key
        type: string
        source: input
        description: "Feature or change the deliverable documents"
        constraints: "1-60 chars; unique per release_train_id"
      - name: ia_placement
        type: enum
        source: input
        description: "Information-architecture decision for the deliverable; adds fixed points to the assignment load"
        constraints: "one of {NEW_TOPIC, EXISTING_TOPIC_UPDATE, CONCEPT_HUB}"
      - name: audience_tier
        type: enum
        source: input
        description: "Audience criticality; multiplies raw load points and decides whether work survives a RESTRICTED posture"
        constraints: "one of {CRITICAL, STANDARD, INTERNAL}"
      - name: planned_page_count
        type: integer
        source: input
        description: "Planned page count for the deliverable"
        constraints: ">= 1 and <= 500"
      - name: complexity_points
        type: integer
        source: input
        description: "Estimator's complexity score, capped at COMPLEXITY_CAP inside the load formula"
        constraints: ">= 0 and <= 100"
      - name: assigned_writer_id
        type: string
        source: system
        description: "FK -> Writer.id; null until POST /plan-items/{id}/assign succeeds, rewritten on reassignment, cleared on cancel"
      - name: window_start_date
        type: string
        source: system
        description: "First day of the authoring window occupied on the assigned writer; null until assigned"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: window_end_date
        type: string
        source: system
        description: "Exclusive end day of the authoring window (half-open [start, end)); null until assigned"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be > window_start_date"
      - name: load_points
        type: number
        source: computed
        description: "Assignment load per calculations.writer_capacity_load_points, plus REWORK_POINTS per rework_count; null until assigned"
        constraints: "1 decimal place, round_half_up"
      - name: rework_count
        type: integer
        source: system
        description: "Number of times a sign-off sent this item's topic back for changes"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Planning lifecycle of the deliverable"
        default: DRAFTED
        constraints: "one of {DRAFTED, ASSIGNED, IN_AUTHORING, IN_REVIEW, IN_REVISION, APPROVED_CONTENT, PUBLISHED, CANCELLED}"
      - name: cancel_reason
        type: string
        source: input
        description: "Reason recorded when the deliverable is cancelled; null otherwise"

  - name: Topic
    parent: DocPlanItem
    common_fields: true
    fields:
      - name: plan_item_id
        type: string
        source: input
        description: "FK -> DocPlanItem.id; the deliverable this topic realises"
      - name: parent_topic_id
        type: string
        source: input
        description: "FK -> Topic.id; information-architecture parent, null for a root node; must not close a cycle"
      - name: slug
        type: string
        source: input
        description: "URL slug of the page"
        constraints: "3-60 chars, lowercase a-z, digits and hyphen; unique per release train"
      - name: title
        type: string
        source: input
        description: "Human-readable page title"
        constraints: "1-160 chars"
      - name: ia_depth
        type: integer
        source: computed
        description: "Depth in the IA tree; 0 for a root topic, parent.ia_depth + 1 otherwise"
        default: 0
      - name: current_revision_number
        type: integer
        source: system
        description: "Revision counter, incremented by every POST /topics/{id}/revisions"
        default: 0
      - name: last_submitted_revision_number
        type: integer
        source: system
        description: "Revision number that was current the last time the topic entered review"
        default: 0
      - name: latest_body_word_count
        type: integer
        source: computed
        description: "body_word_count of the newest SourceRevision of this topic"
        default: 0
      - name: open_blocker_violations
        type: integer
        source: computed
        description: "Count of BLOCKER terminology violations on the newest SourceRevision, recomputed when a cited term is retired"
        default: 0
      - name: open_warning_violations
        type: integer
        source: computed
        description: "Count of WARNING terminology violations on the newest SourceRevision, recomputed when a cited term is retired"
        default: 0
      - name: review_state
        type: enum
        source: system
        description: "Review dimension of the topic; evolves independently of publication_state"
        default: NOT_SUBMITTED
        constraints: "one of {NOT_SUBMITTED, PENDING_SIGNOFF, CHANGES_REQUESTED, FULLY_APPROVED}"
      - name: publication_state
        type: enum
        source: system
        description: "Publication dimension of the topic; evolves independently of review_state"
        default: UNPUBLISHED
        constraints: "one of {UNPUBLISHED, PUBLISHED, ARCHIVED}"
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent review submission; null before the first submission"
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant the topic last reached FULLY_APPROVED; null otherwise"
      - name: signoff_latency_days
        type: integer
        source: computed
        description: "Whole days between submitted_at and approved_at (floor); null until FULLY_APPROVED"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant the topic entered publication_state PUBLISHED; null otherwise"
      - name: published_in_doc_set_version_id
        type: string
        source: system
        description: "FK -> DocSetVersion.id; the doc set whose publication took this topic live; null while UNPUBLISHED"
      - name: health_score
        type: number
        source: computed
        description: "Documentation health per calculations.topic_documentation_health_score; null until the topic has at least one revision"
        constraints: "0.0-100.0, 1 decimal place, round_half_up"
      - name: health_score_variant
        type: enum
        source: computed
        description: "Which variant produced health_score"
        constraints: "one of {PRE_PUBLICATION, POST_PUBLICATION}"

  - name: SourceRevision
    parent: Topic
    common_fields: false
    fields:
      - name: topic_id
        type: string
        source: input
        description: "FK -> Topic.id; the page this revision belongs to"
      - name: author_writer_id
        type: string
        source: system
        description: "FK -> Writer.id; taken from X-User-ID of the authoring Writer"
      - name: revision_number
        type: integer
        source: system
        description: "1-based revision counter within the topic"
      - name: body_word_count
        type: integer
        source: input
        description: "Source word count of the revision body, the basis of every localization quote"
        constraints: ">= 1 and <= 200000"
      - name: used_terms
        type: array
        source: input
        description: "Lowercased term forms that appear verbatim in the revision body; scanned against the ACTIVE terminology list"
        constraints: "0-200 strings, each 1-60 chars"
      - name: summary
        type: string
        source: input
        description: "Commit-style summary of the revision (docs-as-code changelog line)"
        constraints: "1-200 chars"
      - name: blocker_violation_count
        type: integer
        source: computed
        description: "Immutable snapshot of BLOCKER terminology violations at the instant of the commit"
        default: 0
      - name: warning_violation_count
        type: integer
        source: computed
        description: "Immutable snapshot of WARNING terminology violations at the instant of the commit"
        default: 0
      - name: violating_term_ids
        type: array
        source: computed
        description: "Ids of the ACTIVE TerminologyTerm rows this revision violated, ordered by TerminologyTerm.term ASC"

  - name: SignOff
    parent: Topic
    common_fields: true
    fields:
      - name: topic_id
        type: string
        source: input
        description: "FK -> Topic.id; the page under review"
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> Reviewer.id; the reviewer asked to sign off"
      - name: discipline
        type: enum
        source: system
        description: "Copied from Reviewer.discipline at request time; a topic may hold at most one non-SUPERSEDED sign-off per discipline"
        constraints: "one of {ENGINEERING, PRODUCT}"
      - name: state
        type: enum
        source: system
        description: "Sign-off outcome"
        default: PENDING
        constraints: "one of {PENDING, APPROVED, CHANGES_REQUESTED, SUPERSEDED}"
      - name: pinned_revision_number
        type: integer
        source: system
        description: "Topic.current_revision_number captured at the instant of APPROVED; null in every other state. A later revision supersedes the sign-off"
      - name: requested_at
        type: datetime
        source: system
        description: "Logical-clock instant the sign-off was requested"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant the reviewer decided; null while PENDING"
      - name: comment
        type: string
        source: input
        description: "Reviewer note recorded with the decision; null when omitted"
        constraints: "0-500 chars"

  - name: DocSetVersion
    parent: ReleaseTrain
    common_fields: true
    fields:
      - name: release_train_id
        type: string
        source: input
        description: "FK -> ReleaseTrain.id; the supported release this doc set documents"
      - name: version_label
        type: string
        source: input
        description: "Doc set label, e.g. 14.2-docs-r1"
        constraints: "1-40 chars; unique per release_train_id"
      - name: status
        type: enum
        source: system
        description: "Doc set lifecycle; a newer DRAFT supersedes an older DRAFT of the same train"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, SUPERSEDED, ARCHIVED}"
      - name: published_topic_count
        type: integer
        source: computed
        description: "Count of Topic rows whose published_in_doc_set_version_id equals this doc set"
        default: 0
      - name: projected_localization_budget_cents
        type: integer
        source: computed
        description: "Per calculations.doc_set_localization_budget — 0 until publication, then the round-per-locale-then-sum projection checked against ReleaseTrain.localization_budget_cap_cents"
        default: 0
      - name: eol_notice_text
        type: string
        source: input
        description: "End-of-life notice rendered on every archived page; null until archived"
        constraints: "10-300 chars"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; null while DRAFT or SUPERSEDED"
      - name: archived_at
        type: datetime
        source: system
        description: "Logical-clock instant of archival; null unless ARCHIVED"

  - name: ChangeRecord
    parent: ReleaseTrain
    common_fields: true
    fields:
      - name: release_train_id
        type: string
        source: input
        description: "FK -> ReleaseTrain.id; the release the change ships in"
      - name: internal_summary
        type: string
        source: input
        description: "Engineering-facing summary copied from the change management system"
        constraints: "1-300 chars"
      - name: customer_facing_text
        type: string
        source: input
        description: "Customer-facing rewrite produced by the editorial pass; null until an editorial pass succeeds"
        constraints: "10-300 chars"
      - name: severity
        type: enum
        source: input
        description: "Customer-impact severity, drives release-note ordering and weighting"
        constraints: "one of {BREAKING, SECURITY, MAJOR, MINOR, PATCH}"
      - name: category
        type: enum
        source: input
        description: "Editorial bucket the entry lands in"
        constraints: "one of {FEATURE, FIX, PERFORMANCE, SECURITY_PATCH, DEPRECATION}"
      - name: affected_component
        type: string
        source: input
        description: "Component key; matched against DeprecationNotice.feature_key when the record is BREAKING"
        constraints: "1-60 chars"
      - name: state
        type: enum
        source: system
        description: "Editorial lifecycle of the change record"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, REWORK_REQUESTED, EDITORIALLY_APPROVED, EXCLUDED, PUBLISHED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who submitted the record; the editorial pass must be performed by a different operator"
      - name: editorial_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator whose editorial pass approved the record; null until then"
      - name: terminology_blocker_count
        type: integer
        source: computed
        description: "BLOCKER terminology violations found in the most recent editorial pass; an immutable snapshot that term retirement does NOT recompute"
        default: 0
      - name: rework_count
        type: integer
        source: system
        description: "Number of editorial passes that bounced the record for terminology blockers"
        default: 0
      - name: exclusion_reason
        type: string
        source: input
        description: "Reason the record was kept out of the release notes; null unless EXCLUDED"
        constraints: "5-200 chars"

  - name: ReleaseNote
    parent: DocSetVersion
    common_fields: true
    fields:
      - name: release_train_id
        type: string
        source: input
        description: "FK -> ReleaseTrain.id; the release whose change records were compiled"
      - name: doc_set_version_id
        type: string
        source: input
        description: "FK -> DocSetVersion.id; the published doc set the notes ship inside"
      - name: status
        type: enum
        source: system
        description: "Compilation lifecycle; a newer compilation supersedes the previous COMPILED note of the same doc set"
        default: COMPILED
        constraints: "one of {COMPILED, PUBLISHED, SUPERSEDED}"
      - name: included_change_record_ids
        type: array
        source: computed
        description: "Ids of the compiled ChangeRecord rows, ordered by severity rank ASC then created_at ASC"
      - name: severity_counts
        type: object
        source: computed
        description: "Counts per severity in the compiled set, keys BREAKING, SECURITY, MAJOR, MINOR, PATCH"
      - name: headline_severity
        type: enum
        source: computed
        description: "Highest-ranked severity present in the compiled set"
        constraints: "one of {BREAKING, SECURITY, MAJOR, MINOR, PATCH}"
      - name: coverage_factor_provisional
        type: number
        source: computed
        description: "Approved-topic coverage at compile time per calculations.release_note_customer_impact_score"
        constraints: "0.00-1.00, 2 decimal places"
      - name: coverage_factor_final
        type: number
        source: computed
        description: "Published-topic coverage at publication time; null while COMPILED"
        constraints: "0.00-1.00, 2 decimal places"
      - name: impact_score_provisional
        type: number
        source: computed
        description: "Provisional customer-impact score stamped at compile time"
        constraints: "0.00-100.00, 2 decimal places, round_half_up"
      - name: impact_score_final
        type: number
        source: computed
        description: "Final customer-impact score stamped at publication; null while COMPILED"
        constraints: "0.00-100.00, 2 decimal places, round_half_up"
      - name: compiled_at
        type: datetime
        source: system
        description: "Logical-clock instant of compilation"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant of publication; null while COMPILED or SUPERSEDED"

  - name: LocaleProfile
    parent: null
    common_fields: true
    fields:
      - name: locale_code
        type: string
        source: input
        description: "BCP-47 locale code of the target language"
        constraints: "5 chars, pattern ll-CC (lowercase language, hyphen, uppercase region); unique"
      - name: publication_mode
        type: enum
        source: input
        description: "Whether translated pages go live with the source or on a delay"
        constraints: "one of {SIMULTANEOUS, DELAYED}"
      - name: tm_coverage_pct
        type: number
        source: input
        description: "Translation-memory coverage assumed by provisional quotes"
        constraints: "0-100, 2 decimal places"
      - name: per_word_rate_cents
        type: number
        source: input
        description: "Vendor rate in cents per effective source word"
        constraints: "> 0, 2 decimal places"
      - name: sla_days
        type: integer
        source: input
        description: "Contracted turnaround in days; also the delay applied to DELAYED publication"
        constraints: ">= 1 and <= 120"
      - name: parallel_job_limit
        type: integer
        source: input
        description: "Maximum number of active coordinator-created jobs whose closed date windows share a day"
        constraints: ">= 1 and <= 20"
      - name: status
        type: enum
        source: input
        description: "PAUSED locales accept no new jobs and are skipped by publication cascades"
        default: ACTIVE
        constraints: "one of {ACTIVE, PAUSED}"
      - name: committed_source_words
        type: integer
        source: computed
        description: "Conserved quantity per calculations.locale_committed_source_words — sum of reserved_source_words over jobs with state IN {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED}"
        default: 0
      - name: open_job_count
        type: integer
        source: computed
        description: "Count of LocalizationJob rows counted by committed_source_words"
        default: 0

  - name: LocalizationJob
    parent: Topic
    common_fields: true
    fields:
      - name: topic_id
        type: string
        source: input
        description: "FK -> Topic.id; the source page being translated"
      - name: locale_profile_id
        type: string
        source: input
        description: "FK -> LocaleProfile.id; the target locale"
      - name: source_revision_number
        type: integer
        source: system
        description: "Topic.current_revision_number pinned at job creation"
      - name: reserved_source_words
        type: integer
        source: system
        description: "Topic.latest_body_word_count pinned at job creation; the unit of the locale's conserved word balance"
      - name: window_start_date
        type: string
        source: input
        description: "First day of the vendor window; windows are CLOSED intervals on the locale"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: window_end_date
        type: string
        source: input
        description: "Last day of the vendor window, inclusive"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be >= window_start_date"
      - name: state
        type: enum
        source: system
        description: "Translation lifecycle with a rework cycle and a publication fork"
        default: QUEUED
        constraints: "one of {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED, PUBLISHED_LOCALIZED, CANCELLED}"
      - name: translated_word_count
        type: integer
        source: input
        description: "Words delivered by the vendor; null until the first delivery"
        constraints: ">= 1 and <= 400000"
      - name: tm_matched_word_count
        type: integer
        source: input
        description: "Delivered words matched from translation memory; null until the first delivery"
        constraints: ">= 0 and <= translated_word_count"
      - name: leverage_pct
        type: number
        source: computed
        description: "LocaleProfile.tm_coverage_pct for the provisional quote; 100 * tm_matched_word_count / translated_word_count for the final quote"
        constraints: "0-100, 2 decimal places, round_half_up"
      - name: cost_variant
        type: enum
        source: computed
        description: "Which variant of calculations.localization_job_cost last ran"
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: rush_surcharge_cents
        type: integer
        source: computed
        description: "Surcharge component of the most recent quote"
        default: 0
      - name: volume_discount_cents
        type: integer
        source: computed
        description: "Discount component of the most recent quote, keyed on the surcharge-inclusive subtotal"
        default: 0
      - name: estimated_cost_cents
        type: integer
        source: computed
        description: "Provisional quote stamped at job creation and never rewritten by delivery"
        default: 0
      - name: final_cost_cents
        type: integer
        source: computed
        description: "Final quote stamped by the most recent delivery; null until delivered"
      - name: publication_mode_applied
        type: enum
        source: computed
        description: "Branch taken by POST /localization-jobs/{id}/publish; null until a publish attempt succeeds"
        constraints: "one of {SIMULTANEOUS, DELAYED}"
      - name: scheduled_publish_date
        type: string
        source: computed
        description: "For the DELAYED branch, date(Topic.published_at) + LocaleProfile.sla_days days; null on the SIMULTANEOUS branch"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant the localized page went live; null unless PUBLISHED_LOCALIZED"
      - name: rework_count
        type: integer
        source: system
        description: "Number of times the delivery was bounced back to the vendor"
        default: 0
      - name: auto_created
        type: boolean
        source: system
        description: "True when the doc-set publication cascade created the job; such jobs bypass parallel_job_limit"
        default: false
      - name: cancel_reason
        type: string
        source: input
        description: "Reason recorded on cancellation; the archive cascade writes CASCADE_DOC_SET_ARCHIVED"
        constraints: "5-200 chars"

  - name: TerminologyTerm
    parent: null
    common_fields: true
    fields:
      - name: term
        type: string
        source: input
        description: "Canonical concept key governed by the style guide"
        constraints: "2-60 chars, lowercase; unique across TerminologyTerm rows"
      - name: preferred_form
        type: string
        source: input
        description: "The wording writers must use"
        constraints: "2-60 chars"
      - name: forbidden_forms
        type: array
        source: input
        description: "Lowercased wordings that trigger a violation when they appear in used_terms"
        constraints: "1-20 strings, each 2-60 chars; no string may equal any other ACTIVE term's preferred_form"
      - name: enforcement_severity
        type: enum
        source: input
        description: "BLOCKER violations gate review submission; WARNING violations only lower the health score"
        constraints: "one of {BLOCKER, WARNING}"
      - name: status
        type: enum
        source: system
        description: "RETIRED terms are excluded from future scans and from recomputed topic counters"
        default: ACTIVE
        constraints: "one of {ACTIVE, RETIRED}"
      - name: retired_at
        type: datetime
        source: system
        description: "Logical-clock instant of retirement; null while ACTIVE"

  - name: PageFeedback
    parent: Topic
    common_fields: false
    fields:
      - name: topic_id
        type: string
        source: input
        description: "FK -> Topic.id; the page the reader rated"
      - name: rating
        type: integer
        source: input
        description: "Page-level star rating"
        constraints: ">= 1 and <= 5"
      - name: outcome
        type: enum
        source: input
        description: "What the reader did next; only RESOLVED_SELF_SERVE and OPENED_TICKET enter the deflection denominator"
        constraints: "one of {RESOLVED_SELF_SERVE, OPENED_TICKET, ABANDONED}"
      - name: locale_code
        type: string
        source: input
        description: "Locale variant of the page the reader saw; must equal the locale_code of an existing LocaleProfile (validated by value, not an id FK)"
        constraints: "5 chars, pattern ll-CC"
      - name: session_key
        type: string
        source: input
        description: "Reader session identifier; at most one feedback row per (topic_id, session_key)"
        constraints: "6-60 chars"
      - name: comment
        type: string
        source: input
        description: "Free-text reader comment; null when omitted"
        constraints: "0-500 chars"

  - name: DeprecationNotice
    parent: ReleaseTrain
    common_fields: true
    fields:
      - name: release_train_id
        type: string
        source: input
        description: "FK -> ReleaseTrain.id; the release that announces the deprecation"
      - name: feature_key
        type: string
        source: input
        description: "Feature being deprecated; matched against ChangeRecord.affected_component for BREAKING records"
        constraints: "1-60 chars; unique per release_train_id"
      - name: severity_tier
        type: enum
        source: input
        description: "Drives the minimum notice period"
        constraints: "one of {BREAKING, MAJOR, MINOR}"
      - name: announce_date
        type: string
        source: input
        description: "Date the deprecation is announced to customers"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: deprecated_date
        type: string
        source: input
        description: "Date the feature stops being recommended"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be >= announce_date"
      - name: removal_date
        type: string
        source: input
        description: "Date the feature is removed"
        constraints: "ISO 8601 calendar date YYYY-MM-DD; must be > deprecated_date"
      - name: migration_guide_topic_id
        type: string
        source: input
        description: "FK -> Topic.id; the migration guide customers are pointed at; its release train must share the notice's product_key"
      - name: notice_days
        type: integer
        source: computed
        description: "removal_date - announce_date in whole days"
      - name: earliest_removal_date
        type: string
        source: computed
        description: "announce_date + MIN_NOTICE_DAYS[severity_tier] days per calculations.deprecation_timeline_compliance"
        constraints: "ISO 8601 calendar date YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle; RETIRED is reached only by the end-of-life cascade"
        default: DRAFTED
        constraints: "one of {DRAFTED, PUBLISHED, RETIRED}"
      - name: published_at
        type: datetime
        source: system
        description: "Logical-clock instant the notice was published; null while DRAFTED"

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: ReleaseTrain
    dimension: status
    initial_state: PLANNED
    terminal_states: [END_OF_LIFE]
    note: "Linear spine, but the last hop carries the deepest cascade in the scaffold."
    transitions:
      - from: PLANNED
        to: DOC_FREEZE
        trigger: "POST /release-trains/{id}/advance with target_status DOC_FREEZE"
        actor: DocsLead
        preconditions:
          - "target_status is the immediate successor of status in the order PLANNED < DOC_FREEZE < GA < MAINTENANCE < END_OF_LIFE, else ERR_RELEASE_TRAIN_INVALID_ADVANCE"
        side_effects:
          - "recompute approved_topic_ratio and doc_readiness_posture per calculations.release_train_doc_readiness (posture leaves the unconditional OPEN of PLANNED and becomes ratio-driven)"
          - "increments ReleaseTrain.version by 1"
      - from: DOC_FREEZE
        to: GA
        trigger: "POST /release-trains/{id}/advance with target_status GA"
        actor: DocsLead
        preconditions:
          - "at least one DocSetVersion of this train has status == PUBLISHED, else ERR_DOC_SET_NOT_PUBLISHED"
        side_effects:
          - "recompute approved_topic_ratio and doc_readiness_posture"
          - "increments ReleaseTrain.version by 1"
      - from: GA
        to: MAINTENANCE
        trigger: "POST /release-trains/{id}/advance with target_status MAINTENANCE"
        actor: DocsLead
        preconditions:
          - "status == GA"
        side_effects:
          - "doc_readiness_posture becomes FROZEN unconditionally (status IN {MAINTENANCE, END_OF_LIFE} short-circuits the ratio branch)"
          - "increments ReleaseTrain.version by 1"
      - from: MAINTENANCE
        to: END_OF_LIFE
        trigger: "POST /release-trains/{id}/advance with target_status END_OF_LIFE"
        actor: DocsLead
        preconditions:
          - "logical clock date >= support_end_date, else ERR_SUPPORT_END_DATE_NOT_REACHED"
        side_effects:
          - "CASCADE hop 1: status = END_OF_LIFE, doc_readiness_posture = FROZEN, eol_notice_posted = true"
          - "CASCADE hop 2 (caused by hop 1): every DocSetVersion of this train with status == PUBLISHED, ordered by created_at ASC, moves to ARCHIVED with archived_at = clock and eol_notice_text = 'End of life: support for <product_key> <version_label> ended on <support_end_date>.'"
          - "CASCADE hop 3 (caused by hop 2): every Topic whose published_in_doc_set_version_id is one of those doc sets, ordered by created_at ASC, moves publication_state PUBLISHED -> ARCHIVED and its health_score is recomputed with the POST_PUBLICATION variant"
          - "CASCADE hop 4 (caused by hop 3): every LocalizationJob of those topics with state IN {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED}, ordered by created_at ASC, moves to CANCELLED with cancel_reason 'CASCADE_DOC_SET_ARCHIVED'"
          - "CASCADE hop 5 (caused by hop 4): each such job's LocaleProfile.committed_source_words decreases by that job's reserved_source_words and open_job_count decreases by 1; ReleaseTrain.localization_committed_cents is then recomputed from the surviving jobs"
          - "every DeprecationNotice of this train with status == PUBLISHED moves to RETIRED"
          - "increments ReleaseTrain.version by 1"

  - entity: DocPlanItem
    dimension: status
    initial_state: DRAFTED
    terminal_states: [PUBLISHED, CANCELLED]
    note: "Branching with a revision loop; the source of the writer-load conserved quantity."
    transitions:
      - from: DRAFTED
        to: ASSIGNED
        trigger: "POST /plan-items/{id}/assign"
        actor: DocsLead
        preconditions:
          - "ReleaseTrain.status IN {PLANNED, DOC_FREEZE}, else ERR_RELEASE_TRAIN_CLOSED_FOR_PLANNING"
          - "Writer.status == ACTIVE, else ERR_WRITER_ON_LEAVE"
          - "window_end_date > window_start_date, else ERR_INVALID_DATE_WINDOW"
          - "the requested half-open window does not collide with any other window already occupied on that writer per validations[priority=50] (ERR_WRITER_WINDOW_OVERLAP)"
          - "Writer.committed_load_points + this item's freshly computed load_points <= Writer.capacity_points, else ERR_WRITER_CAPACITY_EXCEEDED"
        side_effects:
          - "assigned_writer_id, window_start_date, window_end_date written; load_points computed by calculations.writer_capacity_load_points"
          - "Writer.committed_load_points += load_points and Writer.assignment_count += 1 (calculations.writer_committed_load_points)"
          - "ReleaseTrain.approved_topic_ratio and doc_readiness_posture recomputed"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /plan-items/{id}/assign with a different writer_id (reassignment)"
        actor: DocsLead
        preconditions:
          - "status IN {ASSIGNED, IN_AUTHORING} (a deliverable already in review cannot change hands), else ERR_PLAN_ITEM_NOT_ASSIGNABLE"
          - "the new writer passes the same window-overlap and capacity checks"
        side_effects:
          - "previous writer: committed_load_points -= old load_points, assignment_count -= 1"
          - "load_points recomputed against the new writer's seniority_tier (the same deliverable is worth different points to different writers)"
          - "new writer: committed_load_points += new load_points, assignment_count += 1"
      - from: ASSIGNED
        to: IN_AUTHORING
        trigger: "POST /topics (first Topic created under this plan item)"
        actor: Writer
        preconditions: ["assigned_writer_id == X-User-ID of the acting Writer, else ERR_NOT_ASSIGNED_WRITER"]
        side_effects: ["status = IN_AUTHORING"]
      - from: IN_AUTHORING
        to: IN_REVIEW
        trigger: "POST /topics/{id}/submit-review on any Topic of this item"
        actor: Writer
        preconditions: ["the topic satisfies every submit-review precondition of state_machines.Topic (review dimension)"]
        side_effects: ["status = IN_REVIEW"]
      - from: IN_REVIEW
        to: IN_REVISION
        trigger: "system, hop 3 of the CHANGES_REQUESTED cascade on POST /sign-offs/{id}/decide"
        actor: system
        preconditions: ["a SignOff on one of this item's topics moved PENDING -> CHANGES_REQUESTED"]
        side_effects:
          - "rework_count += 1"
          - "load_points recomputed as base load + REWORK_POINTS * rework_count; the capacity ceiling is NOT re-checked on this cascade path"
          - "assigned Writer.committed_load_points recomputed so the conserved quantity still equals the sum over the writer's counted items"
      - from: IN_REVISION
        to: IN_REVIEW
        trigger: "POST /topics/{id}/submit-review after a new revision"
        actor: Writer
        preconditions: ["Topic.current_revision_number > Topic.last_submitted_revision_number, else ERR_NO_NEW_REVISION"]
        side_effects: ["status = IN_REVIEW"]
      - from: IN_REVIEW
        to: APPROVED_CONTENT
        trigger: "system, when a Topic of this item reaches review_state FULLY_APPROVED"
        actor: system
        preconditions: ["both ENGINEERING and PRODUCT sign-offs on the topic are APPROVED at pinned_revision_number == Topic.current_revision_number"]
        side_effects:
          - "status = APPROVED_CONTENT"
          - "ReleaseTrain.approved_plan_item_count += 1, approved_topic_ratio and doc_readiness_posture recomputed"
      - from: APPROVED_CONTENT
        to: IN_AUTHORING
        trigger: "POST /topics/{id}/revisions on an already-approved topic"
        actor: Writer
        preconditions: ["Topic.publication_state == UNPUBLISHED or PUBLISHED — either way the approval is invalidated"]
        side_effects:
          - "status = IN_AUTHORING"
          - "ReleaseTrain.approved_plan_item_count -= 1, ratio and posture recomputed"
      - from: APPROVED_CONTENT
        to: PUBLISHED
        trigger: "POST /doc-set-versions/{id}/publish"
        actor: DocsLead
        preconditions: ["one of this item's topics is taken live by the publishing doc set"]
        side_effects:
          - "status = PUBLISHED"
          - "assigned Writer.committed_load_points -= load_points and assignment_count -= 1 (a published deliverable frees capacity)"
      - from: DRAFTED
        to: CANCELLED
        trigger: "POST /plan-items/{id}/cancel"
        actor: DocsLead
        preconditions: ["status IN {DRAFTED, ASSIGNED, IN_AUTHORING, IN_REVIEW, IN_REVISION}, else ERR_PLAN_ITEM_NOT_CANCELLABLE"]
        side_effects:
          - "cancel_reason recorded; assigned_writer_id cleared"
          - "assigned Writer.committed_load_points -= load_points, assignment_count -= 1 (the compensating half of the assign invariant)"
          - "every non-SUPERSEDED SignOff on this item's topics moves to SUPERSEDED and each such Topic returns to review_state NOT_SUBMITTED"
          - "ReleaseTrain.plan_item_count -= 1, ratio and posture recomputed"
        note: "The same transition is declared once; it is reachable from ASSIGNED, IN_AUTHORING, IN_REVIEW and IN_REVISION with identical side effects."

  - entity: Topic
    dimension: review_state
    initial_state: NOT_SUBMITTED
    terminal_states: []
    note: "Cyclic: NOT_SUBMITTED -> PENDING_SIGNOFF -> CHANGES_REQUESTED -> PENDING_SIGNOFF, plus revision-driven invalidation back to NOT_SUBMITTED. Evolves independently of publication_state."
    transitions:
      - from: NOT_SUBMITTED
        to: PENDING_SIGNOFF
        trigger: "POST /topics/{id}/submit-review"
        actor: Writer
        preconditions:
          - "X-User-ID equals DocPlanItem.assigned_writer_id, else ERR_NOT_ASSIGNED_WRITER"
          - "current_revision_number >= 1, else ERR_NO_REVISIONS"
          - "current_revision_number > last_submitted_revision_number, else ERR_NO_NEW_REVISION"
          - "open_blocker_violations == 0, else ERR_TERMINOLOGY_BLOCKER_PRESENT"
          - "ReleaseTrain.doc_readiness_posture == OPEN, or posture == RESTRICTED with DocPlanItem.audience_tier == CRITICAL; FROZEN always rejects, else ERR_DOC_FREEZE_POSTURE_BLOCKED"
        side_effects:
          - "submitted_at = logical clock, last_submitted_revision_number = current_revision_number"
          - "DocPlanItem.status IN_AUTHORING -> IN_REVIEW"
      - from: CHANGES_REQUESTED
        to: PENDING_SIGNOFF
        trigger: "POST /topics/{id}/submit-review after a fresh revision"
        actor: Writer
        preconditions: ["same five preconditions as NOT_SUBMITTED -> PENDING_SIGNOFF; the revision guard is what closes the loop"]
        side_effects:
          - "submitted_at = logical clock, last_submitted_revision_number = current_revision_number"
          - "DocPlanItem.status IN_REVISION -> IN_REVIEW"
      - from: PENDING_SIGNOFF
        to: CHANGES_REQUESTED
        trigger: "POST /sign-offs/{id}/decide with decision CHANGES_REQUESTED"
        actor: Reviewer
        preconditions: ["the sign-off belongs to this topic and is PENDING"]
        side_effects:
          - "CASCADE hop 2 (caused by hop 1, the SignOff flip): review_state = CHANGES_REQUESTED and every OTHER SignOff of this topic in state IN {PENDING, APPROVED} moves to SUPERSEDED with pinned_revision_number cleared"
          - "CASCADE hop 3 (caused by hop 2): DocPlanItem.status IN_REVIEW -> IN_REVISION, rework_count += 1, load_points += REWORK_POINTS, Writer.committed_load_points recomputed"
          - "CASCADE hop 4 (caused by hop 3): ReleaseTrain.approved_topic_ratio and doc_readiness_posture recomputed"
      - from: PENDING_SIGNOFF
        to: FULLY_APPROVED
        trigger: "POST /sign-offs/{id}/decide with decision APPROVED (the second discipline)"
        actor: Reviewer
        preconditions:
          - "after this decision the topic holds one APPROVED ENGINEERING sign-off and one APPROVED PRODUCT sign-off"
          - "both APPROVED sign-offs carry pinned_revision_number == current_revision_number"
        side_effects:
          - "approved_at = logical clock, signoff_latency_days = floor(days between submitted_at and approved_at)"
          - "health_score recomputed with the PRE_PUBLICATION variant"
          - "DocPlanItem.status IN_REVIEW -> APPROVED_CONTENT, then ReleaseTrain ratio and posture recomputed"
      - from: PENDING_SIGNOFF
        to: NOT_SUBMITTED
        trigger: "POST /topics/{id}/revisions while under review"
        actor: Writer
        preconditions: ["the acting writer is the plan item's assigned writer"]
        side_effects:
          - "every SignOff of this topic in state IN {PENDING, APPROVED} moves to SUPERSEDED (version-pinning invalidation)"
          - "DocPlanItem.status IN_REVIEW -> IN_AUTHORING"
      - from: FULLY_APPROVED
        to: NOT_SUBMITTED
        trigger: "POST /topics/{id}/revisions after full approval"
        actor: Writer
        preconditions: ["the acting writer is the plan item's assigned writer"]
        side_effects:
          - "approved_at cleared, signoff_latency_days cleared, all sign-offs SUPERSEDED"
          - "DocPlanItem.status APPROVED_CONTENT -> IN_AUTHORING; ReleaseTrain ratio and posture recomputed"
          - "publication_state is NOT touched: a topic already live stays PUBLISHED while its review dimension falls back to NOT_SUBMITTED"

  - entity: Topic
    dimension: publication_state
    initial_state: UNPUBLISHED
    terminal_states: [ARCHIVED]
    note: "Second, independent dimension on the same row."
    transitions:
      - from: UNPUBLISHED
        to: PUBLISHED
        trigger: "POST /doc-set-versions/{id}/publish"
        actor: DocsLead
        preconditions: ["review_state == FULLY_APPROVED at the instant the doc set publishes"]
        side_effects:
          - "published_at = logical clock, published_in_doc_set_version_id = the doc set"
          - "health_score recomputed with the POST_PUBLICATION variant and health_score_variant = POST_PUBLICATION"
          - "DocPlanItem.status APPROVED_CONTENT -> PUBLISHED (which releases the writer's load points)"
          - "one QUEUED LocalizationJob is auto-created per ACTIVE LocaleProfile with publication_mode == SIMULTANEOUS that has no non-terminal job for this topic"
          - "each auto_created job takes auto_created = true, window_start_date = the logical clock's date and window_end_date = that date + LocaleProfile.sla_days days, so window_days == sla_days + 1 and an auto-created job NEVER carries a rush surcharge"
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /doc-set-versions/{id}/archive, or hop 3 of the END_OF_LIFE cascade"
        actor: DocsLead
        preconditions: ["published_in_doc_set_version_id == the doc set being archived"]
        side_effects:
          - "health_score recomputed with the POST_PUBLICATION variant"
          - "every LocalizationJob of this topic with state IN {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED} moves to CANCELLED, which decrements its locale's committed_source_words and open_job_count"

  - entity: SignOff
    dimension: state
    initial_state: PENDING
    terminal_states: [CHANGES_REQUESTED, SUPERSEDED]
    note: "Branching decision with a version pin; APPROVED is quasi-terminal (only a later revision moves it, to SUPERSEDED)."
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /sign-offs/{id}/decide with decision APPROVED"
        actor: Reviewer
        preconditions:
          - "X-User-ID == reviewer_id, else ERR_SIGNOFF_NOT_OWNED"
          - "state == PENDING, else ERR_SIGNOFF_ALREADY_DECIDED"
          - "Topic.review_state == PENDING_SIGNOFF, else ERR_TOPIC_NOT_IN_REVIEW"
        side_effects:
          - "decided_at = logical clock, pinned_revision_number = Topic.current_revision_number"
          - "if the sibling discipline is already APPROVED at the same pinned revision, the topic moves to FULLY_APPROVED (see Topic review dimension)"
          - "Reviewer.open_signoff_count -= 1"
      - from: PENDING
        to: CHANGES_REQUESTED
        trigger: "POST /sign-offs/{id}/decide with decision CHANGES_REQUESTED"
        actor: Reviewer
        preconditions:
          - "X-User-ID == reviewer_id, else ERR_SIGNOFF_NOT_OWNED"
          - "state == PENDING, else ERR_SIGNOFF_ALREADY_DECIDED"
          - "Topic.review_state == PENDING_SIGNOFF, else ERR_TOPIC_NOT_IN_REVIEW"
        side_effects:
          - "CASCADE hop 1: decided_at = logical clock, pinned_revision_number stays null, Reviewer.open_signoff_count -= 1"
          - "hops 2-4 continue on Topic, DocPlanItem and ReleaseTrain as declared on the Topic review dimension"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system: a new SourceRevision, a sibling CHANGES_REQUESTED decision, or DocPlanItem cancellation"
        actor: system
        preconditions: ["state IN {PENDING, APPROVED}"]
        side_effects: ["pinned_revision_number cleared; Reviewer.open_signoff_count -= 1 when the prior state was PENDING"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system: a new SourceRevision on the topic, a sibling CHANGES_REQUESTED decision, or DocPlanItem cancellation"
        actor: system
        preconditions: ["state == APPROVED"]
        side_effects: ["pinned_revision_number cleared"]

  - entity: DocSetVersion
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /doc-set-versions/{id}/publish"
        actor: DocsLead
        preconditions:
          - "status == DRAFT, else ERR_DOC_SET_NOT_DRAFT"
          - "at least one Topic of the train has review_state == FULLY_APPROVED, else ERR_NO_APPROVED_TOPICS"
          - "projected_localization_budget_cents (calculations.doc_set_localization_budget) <= ReleaseTrain.localization_budget_cap_cents, else ERR_LOCALIZATION_BUDGET_EXCEEDED — evaluated BEFORE any mutation"
        side_effects:
          - "status = PUBLISHED, published_at = logical clock, projected_localization_budget_cents stored"
          - "every FULLY_APPROVED Topic of the train, ordered by created_at ASC, moves publication_state UNPUBLISHED -> PUBLISHED; published_topic_count set to that count"
          - "each published topic's DocPlanItem moves APPROVED_CONTENT -> PUBLISHED, releasing the writer's load points"
          - "one auto_created QUEUED LocalizationJob per published topic per ACTIVE SIMULTANEOUS LocaleProfile (ordered by locale_code ASC), each reserving the topic's latest_body_word_count on that locale and bypassing parallel_job_limit"
          - "ReleaseTrain.localization_committed_cents recomputed; ReleaseTrain ratio and posture recomputed"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /doc-set-versions (a newer draft for the same release train)"
        actor: DocsLead
        preconditions: ["this doc set is the train's only status == DRAFT row"]
        side_effects: ["status = SUPERSEDED"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /doc-set-versions/{id}/archive"
        actor: DocsLead
        preconditions:
          - "status == PUBLISHED, else ERR_DOC_SET_NOT_PUBLISHED"
        side_effects:
          - "CASCADE hop 1: status = ARCHIVED, archived_at = logical clock, eol_notice_text stored, ReleaseTrain.eol_notice_posted = true"
          - "CASCADE hop 2 (caused by hop 1): every Topic with published_in_doc_set_version_id == this doc set moves publication_state PUBLISHED -> ARCHIVED, ordered by created_at ASC"
          - "CASCADE hop 3 (caused by hop 2): every LocalizationJob of those topics with state IN {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED} moves to CANCELLED with cancel_reason 'CASCADE_DOC_SET_ARCHIVED', ordered by created_at ASC"
          - "CASCADE hop 4 (caused by hop 3): each affected LocaleProfile.committed_source_words -= the cancelled job's reserved_source_words and open_job_count -= 1"
          - "CASCADE hop 5 (caused by hop 4): ReleaseTrain.localization_committed_cents recomputed over the surviving jobs"

  - entity: ChangeRecord
    dimension: state
    initial_state: SUBMITTED
    terminal_states: [EXCLUDED, PUBLISHED]
    note: "Editorial rework cycle: SUBMITTED -> REWORK_REQUESTED -> EDITORIALLY_APPROVED, with REWORK_REQUESTED able to repeat."
    transitions:
      - from: SUBMITTED
        to: EDITORIALLY_APPROVED
        trigger: "POST /change-records/{id}/editorial-pass whose used_terms raise zero BLOCKER violations"
        actor: DocsLead
        preconditions:
          - "X-User-ID != submitted_by_user_id, else ERR_EDITORIAL_SOD_VIOLATION"
          - "state IN {SUBMITTED, REWORK_REQUESTED}, else ERR_CHANGE_RECORD_NOT_EDITABLE"
        side_effects:
          - "customer_facing_text stored, editorial_by_user_id = X-User-ID, terminology_blocker_count = 0"
      - from: SUBMITTED
        to: REWORK_REQUESTED
        trigger: "POST /change-records/{id}/editorial-pass whose used_terms raise at least one BLOCKER violation"
        actor: DocsLead
        preconditions:
          - "X-User-ID != submitted_by_user_id, else ERR_EDITORIAL_SOD_VIOLATION"
          - "state IN {SUBMITTED, REWORK_REQUESTED}"
        side_effects:
          - "rework_count += 1, terminology_blocker_count = the BLOCKER violation count"
          - "customer_facing_text is NOT stored and editorial_by_user_id is NOT set (divergent side-effect set from the clean branch)"
      - from: REWORK_REQUESTED
        to: EDITORIALLY_APPROVED
        trigger: "POST /change-records/{id}/editorial-pass with clean used_terms"
        actor: DocsLead
        preconditions: ["X-User-ID != submitted_by_user_id"]
        side_effects: ["customer_facing_text stored, editorial_by_user_id = X-User-ID, terminology_blocker_count = 0; rework_count is left as-is"]
      - from: REWORK_REQUESTED
        to: REWORK_REQUESTED
        trigger: "POST /change-records/{id}/editorial-pass that still raises BLOCKER violations"
        actor: DocsLead
        preconditions: ["X-User-ID != submitted_by_user_id"]
        side_effects: ["rework_count += 1, terminology_blocker_count refreshed"]
      - from: SUBMITTED
        to: EXCLUDED
        trigger: "POST /change-records/{id}/exclude"
        actor: DocsLead
        preconditions: ["state IN {SUBMITTED, REWORK_REQUESTED}, else ERR_CHANGE_RECORD_NOT_EDITABLE"]
        side_effects: ["exclusion_reason stored; the record can never enter a release note"]
      - from: EDITORIALLY_APPROVED
        to: PUBLISHED
        trigger: "POST /release-notes/{id}/publish (cascade)"
        actor: DocsLead
        preconditions: ["the record's id appears in ReleaseNote.included_change_record_ids"]
        side_effects: ["state = PUBLISHED"]

  - entity: ReleaseNote
    dimension: status
    initial_state: COMPILED
    terminal_states: [PUBLISHED, SUPERSEDED]
    transitions:
      - from: COMPILED
        to: PUBLISHED
        trigger: "POST /release-notes/{id}/publish"
        actor: DocsLead
        preconditions:
          - "status == COMPILED, else ERR_RELEASE_NOTE_ALREADY_PUBLISHED"
          - "for every included ChangeRecord with severity == BREAKING there is a DeprecationNotice of the same release train whose feature_key == the record's affected_component and whose status == PUBLISHED, else ERR_MIGRATION_GUIDE_NOT_PUBLISHED"
        side_effects:
          - "coverage_factor_final and impact_score_final computed with the final variant of calculations.release_note_customer_impact_score"
          - "published_at = logical clock"
          - "every included ChangeRecord moves EDITORIALLY_APPROVED -> PUBLISHED"
      - from: COMPILED
        to: SUPERSEDED
        trigger: "POST /release-notes (a newer compilation for the same doc set)"
        actor: DocsLead
        preconditions: ["this note is the doc set's only status == COMPILED row"]
        side_effects: ["status = SUPERSEDED; its change records stay EDITORIALLY_APPROVED and are recompiled into the new note"]

  - entity: LocalizationJob
    dimension: state
    initial_state: QUEUED
    terminal_states: [PUBLISHED_LOCALIZED, CANCELLED]
    note: "Rework cycle plus a publication fork whose two branches carry different side-effect sets, rejoining at PUBLISHED_LOCALIZED."
    transitions:
      - from: QUEUED
        to: TRANSLATED
        trigger: "POST /localization-jobs/{id}/deliver"
        actor: LocalizationCoordinator
        preconditions:
          - "state IN {QUEUED, REWORK_REQUESTED}, else ERR_LOCALIZATION_JOB_NOT_DELIVERABLE"
          - "logical clock date <= window_end_date + SLA_GRACE_DAYS, else ERR_LOCALIZATION_SLA_BREACH"
          - "tm_matched_word_count <= translated_word_count, else ERR_INVALID_REQUEST"
        side_effects:
          - "translated_word_count and tm_matched_word_count stored; leverage_pct, rush_surcharge_cents, volume_discount_cents and final_cost_cents computed by the FINAL variant of calculations.localization_job_cost; cost_variant = FINAL"
          - "estimated_cost_cents is left untouched so the provisional/final divergence stays observable on one row"
      - from: TRANSLATED
        to: REWORK_REQUESTED
        trigger: "POST /localization-jobs/{id}/rework"
        actor: LocalizationCoordinator
        preconditions: ["state == TRANSLATED, else ERR_LOCALIZATION_JOB_NOT_TRANSLATED"]
        side_effects: ["rework_count += 1; final_cost_cents and leverage_pct retain the bounced delivery's values until the next delivery overwrites them"]
      - from: REWORK_REQUESTED
        to: TRANSLATED
        trigger: "POST /localization-jobs/{id}/deliver (loop close)"
        actor: LocalizationCoordinator
        preconditions: ["same as QUEUED -> TRANSLATED"]
        side_effects: ["same as QUEUED -> TRANSLATED; the FINAL quote is recomputed from the new word counts"]
      - from: TRANSLATED
        to: PUBLISHED_LOCALIZED
        trigger: "POST /localization-jobs/{id}/publish — SIMULTANEOUS branch, or DELAYED branch whose schedule has arrived"
        actor: LocalizationCoordinator
        preconditions:
          - "state IN {TRANSLATED, SCHEDULED_DELAYED}, else ERR_LOCALIZATION_JOB_NOT_TRANSLATED"
          - "Topic.publication_state == PUBLISHED, else ERR_SOURCE_TOPIC_NOT_PUBLISHED"
          - "SIMULTANEOUS branch only: ReleaseTrain.status IN {GA, MAINTENANCE}, else ERR_TRAIN_NOT_GA"
          - "DELAYED branch only: logical clock date >= scheduled_publish_date"
        side_effects:
          - "publication_mode_applied = the locale's publication_mode, published_at = logical clock"
          - "SIMULTANEOUS branch: scheduled_publish_date stays null"
          - "LocaleProfile.committed_source_words -= reserved_source_words and open_job_count -= 1 (the job leaves the active set)"
          - "ReleaseTrain.localization_committed_cents recomputed"
      - from: TRANSLATED
        to: SCHEDULED_DELAYED
        trigger: "POST /localization-jobs/{id}/publish — DELAYED branch whose schedule has not arrived"
        actor: LocalizationCoordinator
        preconditions:
          - "LocaleProfile.publication_mode == DELAYED"
          - "Topic.publication_state == PUBLISHED, else ERR_SOURCE_TOPIC_NOT_PUBLISHED"
          - "logical clock date < date(Topic.published_at) + LocaleProfile.sla_days days"
        side_effects:
          - "scheduled_publish_date = date(Topic.published_at) + sla_days days, publication_mode_applied = DELAYED"
          - "published_at stays null and the locale's committed_source_words is NOT released (divergent side-effect set from the SIMULTANEOUS branch)"
          - "ReleaseTrain.status is NOT consulted on this branch"
      - from: SCHEDULED_DELAYED
        to: PUBLISHED_LOCALIZED
        trigger: "POST /localization-jobs/{id}/publish once the logical clock reaches scheduled_publish_date"
        actor: LocalizationCoordinator
        preconditions: ["logical clock date >= scheduled_publish_date, else the job stays SCHEDULED_DELAYED and the response repeats it"]
        side_effects: ["as the SIMULTANEOUS join: published_at set, locale balance released, train localization_committed_cents recomputed"]
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /localization-jobs/{id}/cancel, or the doc-set archive / end-of-life cascade"
        actor: LocalizationCoordinator
        preconditions: ["state IN {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED}, else ERR_LOCALIZATION_JOB_NOT_CANCELLABLE"]
        side_effects:
          - "cancel_reason stored"
          - "LocaleProfile.committed_source_words -= reserved_source_words and open_job_count -= 1, restoring the locale's conserved word balance to its pre-creation value"
          - "ReleaseTrain.localization_committed_cents recomputed"
        note: "Declared once; reachable identically from TRANSLATED, REWORK_REQUESTED and SCHEDULED_DELAYED."

  - entity: TerminologyTerm
    dimension: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /terminology-terms/{id}/retire"
        actor: DocsLead
        preconditions: ["status == ACTIVE, else ERR_TERM_ALREADY_RETIRED"]
        side_effects:
          - "retired_at = logical clock"
          - "every Topic whose newest SourceRevision lists this term in violating_term_ids has open_blocker_violations and open_warning_violations recomputed over ACTIVE terms only (a topic can become submittable as a result)"
          - "SourceRevision.blocker_violation_count / warning_violation_count / violating_term_ids are immutable snapshots and are NOT rewritten"
          - "ChangeRecord.terminology_blocker_count is likewise NOT recomputed"

  - entity: DeprecationNotice
    dimension: status
    initial_state: DRAFTED
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFTED
        to: PUBLISHED
        trigger: "POST /deprecation-notices/{id}/publish"
        actor: DocsLead
        preconditions:
          - "status == DRAFTED, else ERR_DEPRECATION_NOTICE_ALREADY_PUBLISHED"
          - "logical clock date >= announce_date, else ERR_ANNOUNCE_DATE_NOT_REACHED"
          - "the migration guide Topic has publication_state == PUBLISHED, else ERR_MIGRATION_GUIDE_NOT_PUBLISHED"
        side_effects: ["published_at = logical clock"]
      - from: PUBLISHED
        to: RETIRED
        trigger: "system: the END_OF_LIFE cascade on the notice's release train"
        actor: system
        preconditions: ["status == PUBLISHED"]
        side_effects: ["status = RETIRED"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on a parent's `version` only
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: doc-set-create-stale-train
    parent_entity: ReleaseTrain
    write_endpoint: "POST /doc-set-versions"
    occ_field: "expected_release_train_version"
    description: |
      Creating a DocSetVersion against a ReleaseTrain whose version has advanced
      since the client last read it is rejected. A new draft legitimately supersedes
      the train's previous DRAFT doc set, so the operation is not self-blocking: the
      only defence against a writer working from a stale view of the train (its
      posture, its approved ratio, or an already-superseded draft) is the version
      check on the parent.
    error_id: ERR_STALE_RELEASE_TRAIN_VERSION
    http_status: 412

  - rule_id: release-note-compile-stale-doc-set
    parent_entity: DocSetVersion
    write_endpoint: "POST /release-notes"
    occ_field: "expected_doc_set_version_version"
    description: |
      Compiling a ReleaseNote against a DocSetVersion whose version has advanced
      since the client last read it is rejected. A fresh compilation legitimately
      supersedes the doc set's previous COMPILED note, so a second compile from a
      stale view would silently discard an editor's work; the version check on the
      parent doc set is the only thing that distinguishes an intentional recompile
      from one issued against an out-of-date candidate set.
    error_id: ERR_STALE_DOC_SET_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: writer_capacity_load_points
    trigger: "POST /plan-items/{id}/assign (initial assignment and reassignment); recomputed when DocPlanItem.rework_count changes"
    algorithm: weighted_scoring
    formula: |
      # STEP ORDER IS PART OF THE CONTRACT.
      1. size_points   = PAGE_POINTS * planned_page_count
      2. depth_points  = min(complexity_points, COMPLEXITY_CAP)          # cap applied BEFORE the multiplier
      3. ia_points     = IA_ADD[ia_placement]
      4. raw           = (size_points + depth_points + ia_points) * AUDIENCE_MULT[audience_tier] / SENIORITY_DIV[seniority_tier]
                         # audience multiplier applied BEFORE the seniority divisor
      5. base_load     = max(MIN_LOAD_POINTS, round(raw, 2))             # floor applied to the ROUNDED raw value
      6. load_points   = round(base_load + REWORK_POINTS * rework_count, 2)
                         # rework points are added AFTER the MIN_LOAD_POINTS floor, so they always raise the total
      # The seniority divisor means the SAME deliverable is worth different load_points to
      # different writers: reassignment must release the old writer's points and charge the
      # new writer the freshly recomputed amount.
    input_set: "One DocPlanItem's own fields plus the target Writer's seniority_tier. complexity_points above COMPLEXITY_CAP contribute nothing extra."
    constants:
      PAGE_POINTS: 2
      COMPLEXITY_CAP: 20
      AUDIENCE_MULT: { CRITICAL: 1.5, STANDARD: 1.0, INTERNAL: 0.75 }
      SENIORITY_DIV: { PRINCIPAL: 1.25, SENIOR: 1.0, ASSOCIATE: 0.80 }
      IA_ADD: { NEW_TOPIC: 4, EXISTING_TOPIC_UPDATE: 1, CONCEPT_HUB: 6 }
      MIN_LOAD_POINTS: 3.0
      REWORK_POINTS: 1.0
    precision: "2 decimal places, round_half_up"
    worked_examples:
      - "planned_page_count 6, complexity_points 10, STANDARD, NEW_TOPIC, SENIOR writer, rework_count 0 -> (12 + 10 + 4) * 1.0 / 1.0 = 26.00"
      - "planned_page_count 4, complexity_points 25, CRITICAL, CONCEPT_HUB, PRINCIPAL writer, rework_count 0 -> (8 + 20 + 6) * 1.5 / 1.25 = 40.80"
      - "planned_page_count 2, complexity_points 4, INTERNAL, EXISTING_TOPIC_UPDATE, ASSOCIATE writer, rework_count 0 -> (4 + 4 + 1) * 0.75 / 0.80 = 8.44"
      - "the same INTERNAL item after one CHANGES_REQUESTED cycle -> 8.44 + 1.0 = 9.44"

  - name: writer_committed_load_points
    trigger: "any transition that adds, moves, publishes or cancels a DocPlanItem, and any rework_count change"
    algorithm: aggregation
    formula: |
      committed_load_points = round(SUM(load_points of the writer's counted plan items), 2)
      assignment_count      = COUNT(counted plan items)
      # This is a CONSERVED QUANTITY: it must always equal the full recompute over the
      # counted set, no matter how many assign / reassign / rework / publish / cancel
      # operations preceded the read. Incremental bookkeeping that drifts from the
      # recompute is a defect.
    input_set: "DocPlanItems with assigned_writer_id == this writer and status IN {ASSIGNED, IN_AUTHORING, IN_REVIEW, IN_REVISION, APPROVED_CONTENT}. PUBLISHED and CANCELLED items are excluded — publishing and cancelling both RELEASE capacity."
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: release_train_doc_readiness
    trigger: "plan item create / assign / cancel, topic approval or approval invalidation, doc set publish, and every POST /release-trains/{id}/advance"
    algorithm: threshold
    formula: |
      1. plan_item_count          = COUNT(plan items of the train with status != CANCELLED)
      2. approved_plan_item_count = COUNT(those with status IN {APPROVED_CONTENT, PUBLISHED})
      3. approved_topic_ratio     = 1.00 if plan_item_count == 0
                                    else round(approved_plan_item_count / plan_item_count, 2)
         # EMPTY-SET CONVENTION: a train with no counted plan items is vacuously ready (1.00),
         # NOT 0.00 and NOT null.
      4. doc_readiness_posture:
           if status IN {MAINTENANCE, END_OF_LIFE}:            FROZEN     # short-circuits before the ratio is consulted
           elif status == PLANNED:                             OPEN       # planning is always open
           else:  # DOC_FREEZE or GA — the ratio-driven band
             if approved_topic_ratio >= FREEZE_READY_RATIO:     OPEN
             elif approved_topic_ratio >= RESTRICTED_FLOOR:     RESTRICTED
             else:                                             FROZEN
      # Boundary semantics are inclusive on both bands: ratio exactly 0.80 -> OPEN,
      # ratio exactly 0.50 -> RESTRICTED, ratio 0.49 -> FROZEN.
    input_set: "All non-CANCELLED DocPlanItems of the release train; the train's own status."
    constants:
      FREEZE_READY_RATIO: 0.80
      RESTRICTED_FLOOR: 0.50
    precision: "ratio to 2 decimal places, round_half_up"

  - name: terminology_violation_scan
    trigger: "POST /topics/{id}/revisions and POST /change-records/{id}/editorial-pass; re-run over a topic's newest revision when a TerminologyTerm is retired"
    algorithm: projection
    formula: |
      1. candidate_terms = ACTIVE TerminologyTerms ONLY, ordered by term ASC
         # RETIRED terms never produce a violation; ordering is by `term`, never by id.
      2. tokens = the submitted used_terms[] array, compared case-insensitively
      3. for each candidate term (in the pinned order):
           if ANY token equals ANY entry of that term's forbidden_forms (case-insensitive):
             record ONE violation for that term, carrying the term's enforcement_severity
             # A term violated by three different tokens still counts once.
      4. blocker_violation_count = COUNT(violations with enforcement_severity == BLOCKER)
      5. warning_violation_count = COUNT(violations with enforcement_severity == WARNING)
      6. violating_term_ids      = the violated terms' ids in the step-1 order (term ASC)
      # SNAPSHOT vs LIVE: SourceRevision.blocker_violation_count / warning_violation_count /
      # violating_term_ids and ChangeRecord.terminology_blocker_count are IMMUTABLE snapshots
      # of the scan at write time. Topic.open_blocker_violations / open_warning_violations are
      # LIVE: they are re-derived from the newest revision's violating_term_ids filtered to
      # ACTIVE terms, so retiring a term can lower them without rewriting any snapshot.
    input_set: "TerminologyTerms with status == ACTIVE at the moment of the scan."
    constants: {}
    precision: "integer counts"

  - name: localization_job_cost
    trigger: "POST /localization-jobs (PROVISIONAL) and POST /localization-jobs/{id}/deliver (FINAL)"
    algorithm: tiered_pricing
    formula: |
      # STEP ORDER IS PART OF THE CONTRACT. The rush surcharge is applied BEFORE the volume
      # discount, and the volume tier is selected from the SURCHARGE-INCLUSIVE subtotal.
      1. source_words   = variant-specific (see variants)
      2. tm_words       = variant-specific (see variants)
      3. leverage_pct   = 0.00 if source_words == 0 else round(tm_words * 100 / source_words, 2)
      4. effective_words = source_words - floor(tm_words * TM_DISCOUNT_FACTOR)
                           # translation-memory matches are cheaper, not free
      5. base_cents     = round(effective_words * per_word_rate_cents)
      6. window_days    = (window_end_date - window_start_date) in days + 1     # CLOSED interval
         rush_surcharge_cents = round(base_cents * RUSH_SURCHARGE_PCT / 100) if window_days < sla_days else 0
      7. subtotal       = base_cents + rush_surcharge_cents
      8. tier_pct       = VOLUME_TIERS applied to `subtotal` (first matching band, descending)
         volume_discount_cents = round(subtotal * tier_pct / 100)
      9. cost           = subtotal - volume_discount_cents
      # Applying the discount to base_cents first and then adding the surcharge yields a
      # DIFFERENT total, because the tier band is chosen from a different number.
    input_set: "One LocalizationJob plus its LocaleProfile (per_word_rate_cents, tm_coverage_pct, sla_days). No other job contributes."
    constants:
      TM_DISCOUNT_FACTOR: 0.70
      RUSH_SURCHARGE_PCT: 15
      VOLUME_TIERS: "subtotal >= 500000 -> 10; >= 200000 -> 6; >= 50000 -> 3; otherwise 0"
    precision: "cents are integers, round_half_up at each declared round(); leverage_pct to 2 decimal places"
    variants:
      - name: PROVISIONAL
        when: "at job creation, written to estimated_cost_cents with cost_variant = PROVISIONAL"
        difference: "source_words = reserved_source_words (the topic's latest_body_word_count at creation); tm_words = floor(source_words * LocaleProfile.tm_coverage_pct / 100) — the locale's ADVERTISED coverage, not a measured one"
      - name: FINAL
        when: "at delivery, written to final_cost_cents with cost_variant = FINAL; estimated_cost_cents is left intact so both numbers stay observable on one row"
        difference: "source_words = translated_word_count as delivered; tm_words = tm_matched_word_count as measured. Identical delivered volume with a different measured leverage produces a different total, and a delivery that matches the reservation exactly still diverges whenever measured leverage != advertised coverage."
    worked_examples:
      - "PROVISIONAL, reserved 1200 words, tm_coverage_pct 40, rate 12.5, window 2026-08-10..2026-08-17 (8 days), sla_days 10 -> tm_words 480, leverage 40.00, effective 864, base 10800, rush 1620, subtotal 12420, tier 0% -> estimated_cost_cents 12420"
      - "FINAL for the same job, translated 1300, tm_matched 780 -> leverage 60.00, effective 754, base 9425, rush 1414, subtotal 10839, tier 0% -> final_cost_cents 10839"
      - "Order-sensitivity witness: 15200 words, tm 0, rate 12.5, 8-day window vs sla 10 -> base 190000, rush 28500, subtotal 218500, tier 6% -> discount 13110 -> 205390. Discounting first would pick the 3% band on 190000 and yield 211945."

  - name: locale_committed_source_words
    trigger: "localization job create, publish, cancel, and every cascade that cancels jobs"
    algorithm: aggregation
    formula: |
      committed_source_words = SUM(reserved_source_words of the locale's open jobs)
      open_job_count         = COUNT(the locale's open jobs)
      # CONSERVED QUANTITY: create then cancel must return both fields to their exact
      # pre-create values; publish releases the same reservation the create charged.
    input_set: "LocalizationJobs with this locale_profile_id and state IN {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED}. PUBLISHED_LOCALIZED and CANCELLED jobs are excluded."
    constants: {}
    precision: "integer words"

  - name: release_train_localization_commitment
    trigger: "localization job create, deliver, publish, cancel; doc set publish/archive; end-of-life cascade"
    algorithm: aggregation
    formula: |
      localization_committed_cents =
        SUM over the train's open localization jobs of
          (final_cost_cents if cost_variant == FINAL else estimated_cost_cents)
      # A delivered job switches which of its two costs is counted — the provisional/final
      # reconciliation is visible on the train's ledger field, not only on the job.
    input_set: "LocalizationJobs whose Topic belongs (via DocPlanItem) to this release train and whose state IN {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED}."
    constants: {}
    precision: "integer cents"

  - name: doc_set_localization_budget
    trigger: "POST /doc-set-versions/{id}/publish, evaluated BEFORE any topic is taken live"
    algorithm: waterfall_allocation
    formula: |
      # ROUNDING ORDER IS PART OF THE CONTRACT: round PER LOCALE, then sum.
      1. publishable_words = SUM(latest_body_word_count of the train's FULLY_APPROVED topics)
      2. locales = ACTIVE LocaleProfiles with publication_mode == SIMULTANEOUS,
                   ordered by locale_code ASC
      3. for each locale in that order:
           tm_words        = floor(publishable_words * tm_coverage_pct / 100)
           effective_words = publishable_words - floor(tm_words * TM_DISCOUNT_FACTOR)
           locale_cents    = round(effective_words * per_word_rate_cents)   # ROUND HERE
      4. projected_localization_budget_cents = SUM(locale_cents)            # THEN SUM
      # Summing the unrounded per-locale products and rounding once at the end can differ
      # by one cent per locale, which is exactly enough to flip the cap comparison.
      5. reject with ERR_LOCALIZATION_BUDGET_EXCEEDED when
           projected_localization_budget_cents > ReleaseTrain.localization_budget_cap_cents
         # STRICT `>`: a projection exactly equal to the cap is allowed to publish.
      # No rush surcharge and no volume discount enter the projection; it is a per-locale
      # base quote only.
    input_set: "The train's FULLY_APPROVED Topics and the ACTIVE SIMULTANEOUS LocaleProfiles. PAUSED locales and DELAYED locales contribute nothing to the projection."
    constants:
      TM_DISCOUNT_FACTOR: 0.70
    precision: "integer cents, round_half_up per locale"
    worked_examples:
      - "publishable_words 1205; locales de-DE (rate 9.44, tm 0) and fr-FR (rate 7.86, tm 0) -> 11375 + 9471 = 20846. Summing first (11375.20 + 9471.30 = 20846.50) and rounding once would give 20847, so a cap of exactly 20846 publishes under the pinned order and would fail under the other."

  - name: topic_deflection_metrics
    trigger: "GET /topics/{id}/deflection-summary and every recompute of topic_documentation_health_score"
    algorithm: aggregation
    formula: |
      1. window_start = logical_clock - DEFLECTION_WINDOW_DAYS days
         window = PageFeedback of this topic with created_at >= window_start
                  AND created_at <= logical_clock                    # BOTH ends inclusive
      2. sample_count = COUNT(window)
      3. mean_rating  = null if sample_count == 0 else round(SUM(rating) / sample_count, 2)
      4. decided = window rows with outcome IN {RESOLVED_SELF_SERVE, OPENED_TICKET}
         # ABANDONED rows count toward sample_count and mean_rating but are EXCLUDED from
         # the deflection denominator: an abandoned session is neither deflected nor escalated.
      5. deflection_pct  = null if COUNT(decided) == 0
                           else round(COUNT(RESOLVED_SELF_SERVE) * 100 / COUNT(decided), 2)
         ticket_rate_pct = null if COUNT(decided) == 0
                           else round(COUNT(OPENED_TICKET) * 100 / COUNT(decided), 2)
      # Two distinct empty cases: no feedback at all (mean_rating and deflection_pct both null)
      # and feedback that is entirely ABANDONED (mean_rating present, deflection_pct null).
    input_set: "PageFeedback rows of this topic inside the trailing window; rows older than the window are ignored even though they are never deleted."
    constants:
      DEFLECTION_WINDOW_DAYS: 30
    precision: "2 decimal places, round_half_up"

  - name: topic_documentation_health_score
    trigger: "topic reaches FULLY_APPROVED (PRE_PUBLICATION); topic published or archived, and on every GET of a published topic (POST_PUBLICATION)"
    algorithm: weighted_scoring
    formula: |
      1. churn_penalty    = CHURN_W * max(0, current_revision_number - CHURN_FREE_REVISIONS)
      2. blocker_penalty  = BLOCKER_W * open_blocker_violations
      3. warning_penalty  = WARNING_W * open_warning_violations
      4. latency_penalty  = 0 if signoff_latency_days is null
                            else LATENCY_W * max(0, signoff_latency_days - LATENCY_GRACE_DAYS)
      5. score = 100 - churn_penalty - blocker_penalty - warning_penalty - latency_penalty
      6. variant-specific deductions (see variants) are subtracted from step 5
      7. health_score = round(max(0, score), 2)      # clamped at zero, never negative
      # Deduction weights are not normalized: a single BLOCKER costs four times a WARNING.
    input_set: "The topic's own live fields plus, in the POST_PUBLICATION variant, calculations.topic_deflection_metrics over the trailing feedback window."
    constants:
      CHURN_W: 4
      CHURN_FREE_REVISIONS: 2
      BLOCKER_W: 12
      WARNING_W: 3
      LATENCY_W: 2
      LATENCY_GRACE_DAYS: 3
      RATING_W: 4
      DEFLECTION_PENALTY_PER_POINT: 0.06
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PRE_PUBLICATION
        when: "publication_state == UNPUBLISHED — set when the topic reaches review_state FULLY_APPROVED"
        difference: "no reader-signal deductions at all; feedback rows are ignored even if some exist"
      - name: POST_PUBLICATION
        when: "publication_state IN {PUBLISHED, ARCHIVED}"
        difference: |
          subtract, in this order:
            rating_penalty     = 0 if sample_count == 0 else round(RATING_W * (5 - mean_rating), 2)
            deflection_penalty = 0 if deflection_pct is null
                                 else round(DEFLECTION_PENALTY_PER_POINT * (100 - deflection_pct), 2)
          A published topic with zero feedback in the window therefore scores IDENTICALLY to
          its PRE_PUBLICATION value while reporting health_score_variant = POST_PUBLICATION.
    worked_examples:
      - "PRE_PUBLICATION: current_revision_number 4, no open violations, signoff_latency_days 4 -> 100 - 4*(4-2) - 0 - 0 - 2*(4-3) = 90.00"
      - "POST_PUBLICATION on the same topic with 4 feedback rows (ratings 5,3,4,4 -> mean 4.00) of which 3 RESOLVED_SELF_SERVE and 1 OPENED_TICKET (deflection 75.00) -> 90.00 - 4*(5-4.00) - 0.06*(100-75.00) = 90.00 - 4.00 - 1.50 = 84.50"

  - name: release_note_customer_impact_score
    trigger: "POST /release-notes (provisional) and POST /release-notes/{id}/publish (final)"
    algorithm: forward_looking
    formula: |
      1. included = ChangeRecords of the doc set's release train with state == EDITORIALLY_APPROVED,
                    ordered by created_at ASC
         # EXCLUDED, REWORK_REQUESTED and SUBMITTED records are never included. An empty
         # included set is rejected with ERR_NO_PUBLISHABLE_CHANGES rather than scored as 0.
      2. severity_counts   = map severity -> COUNT(included with that severity)
      3. headline_severity = the severity of the highest SEV_WEIGHT present in `included`
      4. raw_impact        = SUM(SEV_WEIGHT[severity] of each included record)
      5. documented        = included records whose affected_component equals the feature_key
                             of at least one DocPlanItem of the train in the variant's
                             counted status set
         coverage_factor   = round(COUNT(documented) / COUNT(included), 2)
      6. impact_score      = min(100, round(raw_impact * (2 - coverage_factor), 2))
         # Undocumented change is what hurts customers: coverage 1.00 leaves the raw score
         # untouched, coverage 0.00 doubles it, and the result is capped at 100.
    input_set: "EDITORIALLY_APPROVED ChangeRecords of the release train; the train's DocPlanItems for the coverage term."
    constants:
      SEV_WEIGHT: { BREAKING: 40, SECURITY: 25, MAJOR: 12, MINOR: 4, PATCH: 1 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "at compilation, written to coverage_factor_provisional and impact_score_provisional"
        difference: "coverage counts DocPlanItems with status IN {APPROVED_CONTENT, PUBLISHED} — approved-but-unpublished documentation is credited as if it will ship"
      - name: final
        when: "at publication, written to coverage_factor_final and impact_score_final"
        difference: "coverage counts DocPlanItems with status == PUBLISHED only — documentation that never went live loses its credit and the score rises for identical change records"
    worked_examples:
      - "Two included records (MAJOR affecting feature-A, MINOR affecting feature-B) -> raw_impact 16, headline_severity MAJOR. Both features have APPROVED_CONTENT-or-PUBLISHED plan items at compile time -> coverage_factor_provisional 1.00, impact_score_provisional 16.00. Only feature-A's plan item ends up PUBLISHED -> coverage_factor_final 0.50, impact_score_final 24.00."

  - name: deprecation_timeline_compliance
    trigger: "POST /deprecation-notices"
    algorithm: threshold
    formula: |
      1. notice_days           = (removal_date - announce_date) in whole days
      2. earliest_removal_date = announce_date + MIN_NOTICE_DAYS[severity_tier] days
      3. reject unless announce_date <= deprecated_date  (ERR_INVALID_DATE_WINDOW)
      4. reject unless deprecated_date < removal_date    (ERR_INVALID_DATE_WINDOW)
      5. reject unless notice_days >= MIN_NOTICE_DAYS[severity_tier]
                                                         (ERR_NOTICE_PERIOD_TOO_SHORT)
         # INCLUSIVE boundary: notice_days exactly equal to the minimum is compliant.
      # notice_days and earliest_removal_date are stored on the notice so the accepted
      # timeline is auditable after the fact.
    input_set: "The submitted notice's three dates and its severity_tier. The release train's own dates do not relax the minimum."
    constants:
      MIN_NOTICE_DAYS: { BREAKING: 180, MAJOR: 90, MINOR: 30 }
    precision: "integer days"
    worked_examples:
      - "severity_tier MAJOR, announce_date 2026-08-05, deprecated_date 2026-09-01, removal_date 2026-11-03 -> notice_days 90, earliest_removal_date 2026-11-03 -> accepted at the exact boundary"
      - "the same notice with removal_date 2026-11-02 -> notice_days 89 -> ERR_NOTICE_PERIOD_TOO_SHORT"

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# -----------------------------------------------------------------------------
# Domain priority inside the business band: SAFETY / segregation-of-duties first
# (an unreviewed or self-reviewed publication is the worst outcome), then
# REFERENTIAL integrity, then TEMPORAL windows, then CONSTRAINT satisfaction
# (uniqueness, overlaps, aggregate limits), then FISCAL capacity and budget last.
# -----------------------------------------------------------------------------
validations:

  # ---- 1-3 authentication and identity ----
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty (a header sent as an empty string counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the six declared roles AND appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for an entity_backed role, X-User-ID is the id of an existing instance of that role's entity (Writer for role Writer, Reviewer for role Reviewer)"
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include Writer or Reviewer"

  # ---- 4-5 request shape ----
  - priority: 4
    category: business_constraint
    check: "every required input field present; correct JSON types; enum values inside their declared sets; integers non-negative where declared; rating within 1..5; money fields sent as integer cents (never strings); dates as YYYY-MM-DD and instants as ISO-8601 UTC with a trailing Z"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list GET endpoints"

  # ---- 6-7 existence, path left-to-right then body references ----
  - priority: 6
    category: existence
    check: "every id in the URL path exists, validated left to right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 7
    category: existence
    check: "every FK supplied in the request body exists: writer_id, reviewer_id, release_train_id, plan_item_id, parent_topic_id, locale_profile_id, topic_id, migration_guide_topic_id"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all write endpoints carrying a body FK"

  # ---- 8-9 ownership ----
  - priority: 8
    category: auth
    check: "X-User-ID equals the topic's DocPlanItem.assigned_writer_id"
    error_id: ERR_NOT_ASSIGNED_WRITER
    http_status: 403
    applies_to: "POST /topics, POST /topics/{id}/revisions, POST /topics/{id}/submit-review"
  - priority: 9
    category: auth
    check: "X-User-ID equals SignOff.reviewer_id"
    error_id: ERR_SIGNOFF_NOT_OWNED
    http_status: 403
    applies_to: "POST /sign-offs/{id}/decide"

  # ---- 10-11 optimistic concurrency (§1.2.1) ----
  - priority: 10
    category: state
    check: "expected_release_train_version equals the release train's current version"
    error_id: ERR_STALE_RELEASE_TRAIN_VERSION
    http_status: 412
    applies_to: "POST /doc-set-versions"
  - priority: 11
    category: state
    check: "expected_doc_set_version_version equals the doc set version's current version"
    error_id: ERR_STALE_DOC_SET_VERSION
    http_status: 412
    applies_to: "POST /release-notes"

  # ---- 20-29 state preconditions on the TARGET resource ----
  - priority: 20
    category: state
    check: "target_status is the immediate successor of the train's current status in the declared order"
    error_id: ERR_RELEASE_TRAIN_INVALID_ADVANCE
    http_status: 409
    applies_to: "POST /release-trains/{id}/advance"
  - priority: 20
    category: state
    check: "DocPlanItem.status IN {DRAFTED, ASSIGNED, IN_AUTHORING} for an assignment or reassignment"
    error_id: ERR_PLAN_ITEM_NOT_ASSIGNABLE
    http_status: 409
    applies_to: "POST /plan-items/{id}/assign"
  - priority: 20
    category: state
    check: "DocPlanItem.status IN {DRAFTED, ASSIGNED, IN_AUTHORING, IN_REVIEW, IN_REVISION}"
    error_id: ERR_PLAN_ITEM_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /plan-items/{id}/cancel"
  - priority: 20
    category: state
    check: "Topic.review_state IN {NOT_SUBMITTED, CHANGES_REQUESTED}"
    error_id: ERR_TOPIC_ALREADY_IN_REVIEW
    http_status: 409
    applies_to: "POST /topics/{id}/submit-review"
  - priority: 21
    category: state
    check: "Topic.current_revision_number >= 1 — a topic with no authored revision cannot enter review (empty input set, not a zero-length success)"
    error_id: ERR_NO_REVISIONS
    http_status: 409
    applies_to: "POST /topics/{id}/submit-review"
  - priority: 22
    category: state
    check: "Topic.current_revision_number > Topic.last_submitted_revision_number — resubmitting the same revision is rejected"
    error_id: ERR_NO_NEW_REVISION
    http_status: 409
    applies_to: "POST /topics/{id}/submit-review"
  - priority: 20
    category: state
    check: "SignOff.state == PENDING"
    error_id: ERR_SIGNOFF_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /sign-offs/{id}/decide"
  - priority: 20
    category: state
    check: "DocSetVersion.status == DRAFT"
    error_id: ERR_DOC_SET_NOT_DRAFT
    http_status: 409
    applies_to: "POST /doc-set-versions/{id}/publish"
  - priority: 20
    category: state
    check: "DocSetVersion.status == PUBLISHED (for archive; also the DOC_FREEZE -> GA advance requires one published doc set on the train)"
    error_id: ERR_DOC_SET_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /doc-set-versions/{id}/archive, POST /release-trains/{id}/advance, POST /release-notes"
  - priority: 20
    category: state
    check: "ChangeRecord.state IN {SUBMITTED, REWORK_REQUESTED}"
    error_id: ERR_CHANGE_RECORD_NOT_EDITABLE
    http_status: 409
    applies_to: "POST /change-records/{id}/editorial-pass, POST /change-records/{id}/exclude"
  - priority: 20
    category: state
    check: "ReleaseNote.status == COMPILED (PUBLISHED rejects with ERR_RELEASE_NOTE_ALREADY_PUBLISHED, SUPERSEDED with ERR_RELEASE_NOTE_SUPERSEDED)"
    error_id: ERR_RELEASE_NOTE_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /release-notes/{id}/publish"
  - priority: 20
    category: state
    check: "LocalizationJob.state IN {QUEUED, REWORK_REQUESTED} — checked BEFORE the SLA window, so a stale delivery on a PUBLISHED_LOCALIZED job reports the state error and never the SLA error"
    error_id: ERR_LOCALIZATION_JOB_NOT_DELIVERABLE
    http_status: 409
    applies_to: "POST /localization-jobs/{id}/deliver"
  - priority: 20
    category: state
    check: "LocalizationJob.state == TRANSLATED for rework; state IN {TRANSLATED, SCHEDULED_DELAYED} for publish"
    error_id: ERR_LOCALIZATION_JOB_NOT_TRANSLATED
    http_status: 409
    applies_to: "POST /localization-jobs/{id}/rework, POST /localization-jobs/{id}/publish"
  - priority: 20
    category: state
    check: "LocalizationJob.state IN {QUEUED, TRANSLATED, REWORK_REQUESTED, SCHEDULED_DELAYED}"
    error_id: ERR_LOCALIZATION_JOB_NOT_CANCELLABLE
    http_status: 409
    applies_to: "POST /localization-jobs/{id}/cancel"
  - priority: 20
    category: state
    check: "TerminologyTerm.status == ACTIVE"
    error_id: ERR_TERM_ALREADY_RETIRED
    http_status: 409
    applies_to: "POST /terminology-terms/{id}/retire"
  - priority: 20
    category: state
    check: "DeprecationNotice.status == DRAFTED (PUBLISHED and RETIRED both reject)"
    error_id: ERR_DEPRECATION_NOTICE_ALREADY_PUBLISHED
    http_status: 409
    applies_to: "POST /deprecation-notices/{id}/publish"
  - priority: 20
    category: state
    check: "the requested current_utc is not earlier than the logical clock's present value — the clock only moves forward"
    error_id: ERR_CLOCK_BACKWARD
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"

  # ---- 25-29 cross-entity guarded state (a DIFFERENT entity's state gates this write) ----
  - priority: 25
    category: state
    check: "ReleaseTrain.doc_readiness_posture == OPEN, or posture == RESTRICTED together with DocPlanItem.audience_tier == CRITICAL; posture FROZEN always rejects"
    error_id: ERR_DOC_FREEZE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /topics/{id}/submit-review"
  - priority: 25
    category: state
    check: "ReleaseTrain.status IN {PLANNED, DOC_FREEZE}"
    error_id: ERR_RELEASE_TRAIN_CLOSED_FOR_PLANNING
    http_status: 409
    applies_to: "POST /plan-items/{id}/assign"
  - priority: 25
    category: state
    check: "Writer.status == ACTIVE"
    error_id: ERR_WRITER_ON_LEAVE
    http_status: 409
    applies_to: "POST /plan-items/{id}/assign"
  - priority: 25
    category: state
    check: "Topic.publication_state == PUBLISHED"
    error_id: ERR_SOURCE_TOPIC_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /localization-jobs, POST /localization-jobs/{id}/publish"
  - priority: 25
    category: state
    check: "Topic.publication_state == PUBLISHED — readers can only rate live pages"
    error_id: ERR_FEEDBACK_TOPIC_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /topics/{id}/feedback"
  - priority: 25
    category: state
    check: "LocaleProfile.status == ACTIVE"
    error_id: ERR_LOCALE_PAUSED
    http_status: 409
    applies_to: "POST /localization-jobs"
  - priority: 26
    category: state
    check: "on the SIMULTANEOUS publication branch only, ReleaseTrain.status IN {GA, MAINTENANCE}; the DELAYED branch never consults the train's status"
    error_id: ERR_TRAIN_NOT_GA
    http_status: 409
    applies_to: "POST /localization-jobs/{id}/publish"
  - priority: 27
    category: state
    check: "Topic.review_state == PENDING_SIGNOFF"
    error_id: ERR_TOPIC_NOT_IN_REVIEW
    http_status: 409
    applies_to: "POST /topics/{id}/sign-offs, POST /sign-offs/{id}/decide"
  - priority: 28
    category: state
    check: "Topic.open_blocker_violations == 0 — WARNING-severity violations never block, and a violation whose term has been RETIRED no longer counts"
    error_id: ERR_TERMINOLOGY_BLOCKER_PRESENT
    http_status: 409
    applies_to: "POST /topics/{id}/submit-review"

  # ---- 30-39 safety and segregation of duties ----
  - priority: 30
    category: business_safety
    check: "the requested Reviewer's person_key differs from the person_key of the Writer who authored the topic's newest SourceRevision — an author may never review their own page. Checked BEFORE the one-sign-off-per-discipline uniqueness rule, so a self-review request for an already-covered discipline reports the self-review error."
    error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    applies_to: "POST /topics/{id}/sign-offs"
  - priority: 31
    category: business_safety
    check: "X-User-ID differs from ChangeRecord.submitted_by_user_id — the editor of customer-facing language may not be its submitter"
    error_id: ERR_EDITORIAL_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /change-records/{id}/editorial-pass"
  - priority: 32
    category: business_safety
    check: "every included ChangeRecord with severity == BREAKING is matched by a DeprecationNotice of the same release train with the same feature_key and status == PUBLISHED; and a deprecation notice may only publish once its migration guide topic is live"
    error_id: ERR_MIGRATION_GUIDE_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /release-notes/{id}/publish, POST /deprecation-notices/{id}/publish"

  # ---- 40-44 referential integrity beyond mere existence ----
  - priority: 40
    category: business_referential
    check: "parent_topic_id, when supplied, names a Topic under the SAME DocPlanItem"
    error_id: ERR_PARENT_TOPIC_MISMATCH
    http_status: 409
    applies_to: "POST /topics"
  - priority: 41
    category: business_referential
    check: "the parent chain is acyclic and ia_depth <= MAX_IA_DEPTH (4)"
    error_id: ERR_IA_DEPTH_EXCEEDED
    http_status: 409
    applies_to: "POST /topics"
  - priority: 42
    category: business_referential
    check: "migration_guide_topic_id names a Topic whose DocPlanItem belongs to a ReleaseTrain with the SAME product_key as the notice's train. Checked BEFORE the notice-period arithmetic, so a mismatched guide on a too-short timeline reports the referential error."
    error_id: ERR_MIGRATION_GUIDE_PRODUCT_MISMATCH
    http_status: 409
    applies_to: "POST /deprecation-notices"

  # ---- 45-49 temporal windows ----
  - priority: 45
    category: business_temporal
    check: "window_end_date > window_start_date for a writer assignment (half-open); window_end_date >= window_start_date for a localization job (closed); announce_date <= deprecated_date < removal_date for a deprecation notice; doc_freeze_date <= ga_date <= support_end_date for a release train"
    error_id: ERR_INVALID_DATE_WINDOW
    http_status: 400
    applies_to: "POST /release-trains, POST /plan-items/{id}/assign, POST /localization-jobs, POST /deprecation-notices"
  - priority: 46
    category: business_temporal
    check: "notice_days >= MIN_NOTICE_DAYS[severity_tier] (BREAKING 180, MAJOR 90, MINOR 30), inclusive at the boundary"
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 409
    applies_to: "POST /deprecation-notices"
  - priority: 47
    category: business_temporal
    check: "the logical clock's date is at or after announce_date"
    error_id: ERR_ANNOUNCE_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /deprecation-notices/{id}/publish"
  - priority: 48
    category: business_temporal
    check: "the logical clock's date is at or after ReleaseTrain.support_end_date"
    error_id: ERR_SUPPORT_END_DATE_NOT_REACHED
    http_status: 409
    applies_to: "POST /release-trains/{id}/advance with target_status END_OF_LIFE"
  - priority: 49
    category: business_temporal
    check: "the logical clock's date is at or before window_end_date + SLA_GRACE_DAYS (3) — a late delivery is refused rather than repriced"
    error_id: ERR_LOCALIZATION_SLA_BREACH
    http_status: 409
    applies_to: "POST /localization-jobs/{id}/deliver"

  # ---- 50-59 constraint satisfaction: uniqueness, overlap, aggregate limits, empty sets ----
  - priority: 50
    category: business_constraint
    check: "product_key + version_label is unique across release trains"
    error_id: ERR_DUPLICATE_VERSION_LABEL
    http_status: 409
    applies_to: "POST /release-trains"
  - priority: 50
    category: business_constraint
    check: "person_key is unique across writers, and separately unique across reviewers"
    error_id: ERR_DUPLICATE_PERSON_KEY
    http_status: 409
    applies_to: "POST /writers, POST /reviewers"
  - priority: 50
    category: business_constraint
    check: "slug is unique among the topics of one release train"
    error_id: ERR_DUPLICATE_TOPIC_SLUG
    http_status: 409
    applies_to: "POST /topics"
  - priority: 50
    category: business_constraint
    check: "locale_code is unique across locale profiles"
    error_id: ERR_DUPLICATE_LOCALE_CODE
    http_status: 409
    applies_to: "POST /locale-profiles"
  - priority: 50
    category: business_constraint
    check: "term is unique among ACTIVE terminology terms (a RETIRED term's spelling may be reused)"
    error_id: ERR_DUPLICATE_TERM
    http_status: 409
    applies_to: "POST /terminology-terms"
  - priority: 51
    category: business_constraint
    check: "the topic has no SignOff in state IN {PENDING, APPROVED, CHANGES_REQUESTED} for the requested discipline"
    error_id: ERR_DUPLICATE_SIGNOFF_DISCIPLINE
    http_status: 409
    applies_to: "POST /topics/{id}/sign-offs"
  - priority: 51
    category: business_constraint
    check: "the topic has no non-terminal LocalizationJob for the requested locale"
    error_id: ERR_DUPLICATE_LOCALIZATION_JOB
    http_status: 409
    applies_to: "POST /localization-jobs"
  - priority: 52
    category: business_constraint
    check: |
      HALF-OPEN writer windows: the requested [window_start_date, window_end_date) must not
      intersect the window of any other counted plan item of that writer, extended by
      HANDOFF_BUFFER_DAYS (2) on the LEADING edge only — i.e. the requested window is rejected
      when window_start_date < existing.window_end_date + 2 days AND
      window_end_date > existing.window_start_date. Two windows that merely touch
      (existing end == requested start) still collide because of the buffer; a gap of exactly
      2 days is accepted. Reassigning the SAME plan item never collides with itself.
    error_id: ERR_WRITER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /plan-items/{id}/assign"
  - priority: 53
    category: business_constraint
    check: |
      AGGREGATE locale capacity over CLOSED intervals: count the locale's open jobs whose
      [window_start_date, window_end_date] closed interval intersects the requested closed
      interval; reject when that count >= LocaleProfile.parallel_job_limit. Windows that touch
      at a single shared date DO intersect (closed semantics), unlike writer windows.
      auto_created jobs synthesized by a doc-set publish BYPASS this limit entirely.
    error_id: ERR_LOCALE_PARALLEL_JOB_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /localization-jobs"
  - priority: 56
    category: business_constraint
    check: "at least one Topic of the release train has review_state == FULLY_APPROVED — evaluated BEFORE the budget projection, so an empty candidate set never reports a budget error"
    error_id: ERR_NO_APPROVED_TOPICS
    http_status: 409
    applies_to: "POST /doc-set-versions/{id}/publish"
  - priority: 57
    category: business_constraint
    check: "at least one ChangeRecord of the release train is in state EDITORIALLY_APPROVED — an empty candidate set is an error, not a note with an empty body and a zero score"
    error_id: ERR_NO_PUBLISHABLE_CHANGES
    http_status: 409
    applies_to: "POST /release-notes"

  # ---- 60-61 fiscal capacity, evaluated last ----
  - priority: 60
    category: business_fiscal
    check: "projected_localization_budget_cents <= ReleaseTrain.localization_budget_cap_cents, using the round-per-locale-then-sum order; a projection exactly equal to the cap is accepted"
    error_id: ERR_LOCALIZATION_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /doc-set-versions/{id}/publish"
  - priority: 61
    category: business_fiscal
    check: "Writer.committed_load_points + the freshly computed load_points <= Writer.capacity_points; equality is accepted and only a strict excess is rejected. Evaluated AFTER the window-overlap check, so a request that both collides and overruns capacity reports the overlap."
    error_id: ERR_WRITER_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /plan-items/{id}/assign"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
# Every list endpoint accepts `limit?` (1..100, default 20) and `offset?`
# (default 0) and returns the paginated envelope declared in §1.0.
# -----------------------------------------------------------------------------
endpoints:

  # ---- logical clock (test-driving endpoint, /_ namespace) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical UTC clock, which every date and window rule in this domain reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z — the mandatory startup default — and it never falls back to real wall-clock time. The clock only moves forward."
    roles: [DocsLead]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "all subsequent submitted_at / approved_at / published_at / decided_at stamps and every date comparison use the new value"

  # ---- release trains ----
  - method: POST
    path: "/release-trains"
    description: "Registers a supported product release whose documentation is planned, published, localized and eventually end-of-lifed."
    roles: [DocsLead]
    code: 201
    input: [product_key, version_label, doc_freeze_date, ga_date, support_end_date, localization_budget_cap_cents]
    output: ReleaseTrain
    side_effects:
      - "status = PLANNED, doc_readiness_posture = OPEN, approved_topic_ratio = 1.00 (empty-set convention), all counters zero, eol_notice_posted = false"
  - method: GET
    path: "/release-trains/{id}"
    description: "Reads one release train including its live readiness posture and localization commitment."
    roles: [DocsLead, Writer, Reviewer, LocalizationCoordinator, SupportAnalyst]
    code: 200
    input: []
    output: ReleaseTrain
    side_effects: []
  - method: GET
    path: "/release-trains"
    description: "Lists release trains, newest first by created_at DESC."
    roles: [DocsLead, Writer, Reviewer, LocalizationCoordinator, SupportAnalyst]
    code: 200
    input: ["product_key?", "status?", "limit?", "offset?"]
    output: ReleaseTrain[]
    side_effects: []
  - method: POST
    path: "/release-trains/{id}/advance"
    description: "Advances the train one step along PLANNED -> DOC_FREEZE -> GA -> MAINTENANCE -> END_OF_LIFE. The END_OF_LIFE step runs the five-hop archive cascade."
    roles: [DocsLead]
    code: 200
    input: [target_status]
    output: ReleaseTrain
    side_effects:
      - "recomputes approved_topic_ratio and doc_readiness_posture (calculations.release_train_doc_readiness)"
      - "END_OF_LIFE only: archives published doc sets, archives their topics, cancels those topics' open localization jobs, releases each locale's committed_source_words and open_job_count, recomputes localization_committed_cents, retires published deprecation notices, sets eol_notice_posted = true"

  # ---- writers and reviewers ----
  - method: POST
    path: "/writers"
    description: "Registers a technical writer with a capacity ceiling expressed in load points."
    roles: [DocsLead]
    code: 201
    input: [person_key, full_name, seniority_tier, capacity_points, "status?"]
    output: Writer
    side_effects:
      - "status defaults to ACTIVE; committed_load_points = 0.00 and assignment_count = 0"
  - method: GET
    path: "/writers/{id}"
    description: "Reads one writer including the live committed_load_points ledger."
    roles: [DocsLead, Writer]
    code: 200
    input: []
    output: Writer
    side_effects: []
  - method: GET
    path: "/writers"
    description: "Lists writers."
    roles: [DocsLead]
    code: 200
    input: ["status?", "seniority_tier?", "limit?", "offset?"]
    output: Writer[]
    side_effects: []
  - method: GET
    path: "/writers/{id}/revisions"
    description: "Lists every source revision authored by this writer across all topics, ordered by created_at ASC. Revisions are immutable and are never returned by a create response other than their own, so this is one of their two discovery channels."
    roles: [DocsLead, Writer]
    code: 200
    input: ["limit?", "offset?"]
    output: SourceRevision[]
    side_effects: []
  - method: POST
    path: "/reviewers"
    description: "Registers an engineering or product reviewer who can give technical-accuracy sign-off."
    roles: [DocsLead]
    code: 201
    input: [person_key, full_name, discipline]
    output: Reviewer
    side_effects:
      - "open_signoff_count = 0"
  - method: GET
    path: "/reviewers/{id}"
    description: "Reads one reviewer."
    roles: [DocsLead, Reviewer]
    code: 200
    input: []
    output: Reviewer
    side_effects: []
  - method: GET
    path: "/reviewers"
    description: "Lists reviewers."
    roles: [DocsLead, Reviewer]
    code: 200
    input: ["discipline?", "limit?", "offset?"]
    output: Reviewer[]
    side_effects: []

  # ---- documentation plan ----
  - method: POST
    path: "/plan-items"
    description: "Creates a planned documentation deliverable for one feature of a release, including its information-architecture placement and audience tier."
    roles: [DocsLead]
    code: 201
    input: [release_train_id, feature_key, ia_placement, audience_tier, planned_page_count, complexity_points]
    output: DocPlanItem
    side_effects:
      - "status = DRAFTED, load_points = 0.00, rework_count = 0"
      - "ReleaseTrain.plan_item_count += 1 and approved_topic_ratio / doc_readiness_posture recomputed"
  - method: GET
    path: "/plan-items/{id}"
    description: "Reads one plan item including its computed load_points and rework_count."
    roles: [DocsLead, Writer, Reviewer]
    code: 200
    input: []
    output: DocPlanItem
    side_effects: []
  - method: GET
    path: "/plan-items"
    description: "Lists plan items, ordered by created_at ASC. Filterable by train, assigned writer, status and audience tier."
    roles: [DocsLead, Writer, Reviewer]
    code: 200
    input: ["release_train_id?", "assigned_writer_id?", "status?", "audience_tier?", "limit?", "offset?"]
    output: DocPlanItem[]
    side_effects: []
  - method: POST
    path: "/plan-items/{id}/assign"
    description: "Assigns (or reassigns) the deliverable to a writer for a half-open authoring window. Reassignment moves load points from the old writer to the new one, recomputed for the new writer's seniority."
    roles: [DocsLead]
    code: 200
    input: [writer_id, window_start_date, window_end_date]
    output: DocPlanItem
    side_effects:
      - "load_points computed by calculations.writer_capacity_load_points"
      - "target Writer.committed_load_points += load_points and assignment_count += 1"
      - "reassignment only: previous Writer.committed_load_points -= old load_points and assignment_count -= 1"
      - "status DRAFTED -> ASSIGNED on first assignment"
  - method: POST
    path: "/plan-items/{id}/cancel"
    description: "Cancels a planned deliverable, releasing the writer's capacity and superseding any open sign-offs on its topics."
    roles: [DocsLead]
    code: 200
    input: [cancel_reason]
    output: DocPlanItem
    side_effects:
      - "status = CANCELLED, assigned_writer_id cleared"
      - "assigned Writer.committed_load_points -= load_points and assignment_count -= 1"
      - "non-SUPERSEDED sign-offs on its topics move to SUPERSEDED; those topics return to review_state NOT_SUBMITTED"
      - "ReleaseTrain.plan_item_count -= 1 and readiness recomputed"

  # ---- topics, revisions, review ----
  - method: POST
    path: "/topics"
    description: "Creates a topic (page) under a plan item at a chosen point in the information architecture. Only the plan item's assigned writer may create its topics."
    roles: [Writer]
    code: 201
    input: [plan_item_id, slug, title, "parent_topic_id?"]
    output: Topic
    side_effects:
      - "ia_depth = 0 for a root topic, else parent.ia_depth + 1"
      - "review_state = NOT_SUBMITTED, publication_state = UNPUBLISHED, current_revision_number = 0, last_submitted_revision_number = 0, health_score = null"
      - "DocPlanItem.status ASSIGNED -> IN_AUTHORING on the first topic"
  - method: GET
    path: "/topics/{id}"
    description: "Reads one topic including both state dimensions, its live violation counts and its health score."
    roles: [DocsLead, Writer, Reviewer, LocalizationCoordinator, SupportAnalyst, Reader]
    code: 200
    input: []
    output: Topic
    side_effects:
      - "a published topic's health_score is re-derived with the POST_PUBLICATION variant before the response is rendered"
  - method: GET
    path: "/topics"
    description: "Lists topics, ordered by created_at ASC. Filterable by plan item, IA parent, publishing doc set and either state dimension."
    roles: [DocsLead, Writer, Reviewer, LocalizationCoordinator, SupportAnalyst]
    code: 200
    input: ["plan_item_id?", "parent_topic_id?", "published_in_doc_set_version_id?", "review_state?", "publication_state?", "limit?", "offset?"]
    output: Topic[]
    side_effects: []
  - method: POST
    path: "/topics/{id}/revisions"
    description: "Appends an immutable source revision (docs-as-code commit) and runs the terminology scan over its used_terms. A revision posted while the topic is under review or already approved invalidates every sign-off."
    roles: [Writer]
    code: 201
    input: [body_word_count, used_terms, summary]
    output: SourceRevision
    side_effects:
      - "revision_number = Topic.current_revision_number + 1; Topic.current_revision_number and latest_body_word_count updated"
      - "blocker_violation_count / warning_violation_count / violating_term_ids snapshotted from calculations.terminology_violation_scan; Topic.open_blocker_violations and open_warning_violations refreshed"
      - "review_state PENDING_SIGNOFF or FULLY_APPROVED -> NOT_SUBMITTED with every non-SUPERSEDED SignOff moved to SUPERSEDED; review_state CHANGES_REQUESTED is left unchanged"
      - "DocPlanItem.status IN_REVIEW or APPROVED_CONTENT -> IN_AUTHORING; ReleaseTrain readiness recomputed when an approval was invalidated"
  - method: GET
    path: "/topics/{id}/revisions"
    description: "Lists this topic's source revisions, ordered by revision_number ASC."
    roles: [DocsLead, Writer, Reviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: SourceRevision[]
    side_effects: []
  - method: POST
    path: "/topics/{id}/submit-review"
    description: "Submits the topic's newest revision for technical-accuracy sign-off. Gated on the release train's documentation-readiness posture and on the topic having no open BLOCKER terminology violations."
    roles: [Writer]
    code: 200
    input: []
    output: Topic
    side_effects:
      - "review_state -> PENDING_SIGNOFF, submitted_at = logical clock, last_submitted_revision_number = current_revision_number"
      - "DocPlanItem.status IN_AUTHORING or IN_REVISION -> IN_REVIEW"
  - method: POST
    path: "/topics/{id}/sign-offs"
    description: "Requests a technical-accuracy sign-off from one reviewer. An author may never be asked to review their own page, and each discipline may hold only one open sign-off per topic."
    roles: [DocsLead]
    code: 201
    input: [reviewer_id]
    output: SignOff
    side_effects:
      - "state = PENDING, discipline copied from the Reviewer, requested_at = logical clock, pinned_revision_number = null"
      - "Reviewer.open_signoff_count += 1"
  - method: GET
    path: "/topics/{id}/sign-offs"
    description: "Lists the sign-offs of one topic, ordered by created_at ASC, including SUPERSEDED history."
    roles: [DocsLead, Writer, Reviewer]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: SignOff[]
    side_effects: []
  - method: POST
    path: "/topics/{id}/feedback"
    description: "Records an anonymous reader rating on a live page. Immutable; the only write in the domain available to role Reader."
    roles: [Reader]
    code: 201
    input: [rating, outcome, locale_code, session_key, "comment?"]
    output: PageFeedback
    side_effects:
      - "Topic.health_score recomputed with the POST_PUBLICATION variant"
  - method: GET
    path: "/topics/{id}/feedback"
    description: "Lists a page's feedback rows, ordered by created_at ASC. Rows outside the deflection window are still returned here even though they no longer affect the metrics."
    roles: [DocsLead, SupportAnalyst]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: PageFeedback[]
    side_effects: []
  - method: GET
    path: "/topics/{id}/deflection-summary"
    description: "Computed read: support-ticket deflection metrics over the trailing 30-day window ending at the logical clock."
    roles: [DocsLead, SupportAnalyst]
    code: 200
    input: []
    output: { sample_count: integer, mean_rating: decimal_or_null, deflection_pct: decimal_or_null, ticket_rate_pct: decimal_or_null, window_start_date: date, window_end_date: date }
    side_effects: []

  # ---- sign-off decisions ----
  - method: GET
    path: "/sign-offs/{id}"
    description: "Reads one sign-off including the revision number it is pinned to."
    roles: [DocsLead, Writer, Reviewer]
    code: 200
    input: []
    output: SignOff
    side_effects: []
  - method: GET
    path: "/sign-offs"
    description: "Lists sign-offs, ordered by created_at ASC. Filterable by topic, reviewer, state and discipline."
    roles: [DocsLead, Reviewer]
    code: 200
    input: ["topic_id?", "reviewer_id?", "state?", "discipline?", "limit?", "offset?"]
    output: SignOff[]
    side_effects: []
  - method: POST
    path: "/sign-offs/{id}/decide"
    description: "The owning reviewer approves the topic at its current revision or requests changes. Approval pins the revision number; requesting changes runs the four-hop rework cascade."
    roles: [Reviewer]
    code: 200
    input: [decision, "comment?"]
    output: SignOff
    side_effects:
      - "APPROVED: pinned_revision_number = Topic.current_revision_number, decided_at set, Reviewer.open_signoff_count -= 1; when both disciplines are APPROVED at that revision the topic reaches FULLY_APPROVED, its PRE_PUBLICATION health_score is computed, the plan item reaches APPROVED_CONTENT and the train's readiness is recomputed"
      - "CHANGES_REQUESTED: sibling sign-offs SUPERSEDED, Topic.review_state = CHANGES_REQUESTED, DocPlanItem -> IN_REVISION with rework_count += 1 and load_points raised, Writer.committed_load_points recomputed, train readiness recomputed"

  # ---- versioned documentation sets ----
  - method: POST
    path: "/doc-set-versions"
    description: "Opens a draft documentation set for a release train. A new draft supersedes the train's previous draft, so the caller must present the train version it last observed."
    roles: [DocsLead]
    code: 201
    input: [release_train_id, version_label, expected_release_train_version]
    output: DocSetVersion
    side_effects:
      - "status = DRAFT, published_topic_count = 0, projected_localization_budget_cents = null"
      - "any existing DRAFT doc set of the train moves to SUPERSEDED"
      - "increments ReleaseTrain.version by 1"
  - method: GET
    path: "/doc-set-versions/{id}"
    description: "Reads one documentation set version including its stored budget projection and end-of-life notice."
    roles: [DocsLead, LocalizationCoordinator, SupportAnalyst]
    code: 200
    input: []
    output: DocSetVersion
    side_effects: []
  - method: GET
    path: "/doc-set-versions"
    description: "Lists documentation set versions, ordered by created_at ASC."
    roles: [DocsLead, LocalizationCoordinator, SupportAnalyst]
    code: 200
    input: ["release_train_id?", "status?", "limit?", "offset?"]
    output: DocSetVersion[]
    side_effects: []
  - method: POST
    path: "/doc-set-versions/{id}/publish"
    description: "Publishes the draft: takes every fully approved topic of the train live, checks the localization budget projection before mutating anything, and auto-creates localization jobs for the simultaneous-publication locales."
    roles: [DocsLead]
    code: 200
    input: []
    output: DocSetVersion
    side_effects:
      - "projected_localization_budget_cents computed and stored (calculations.doc_set_localization_budget), compared against the train cap BEFORE any state change"
      - "each FULLY_APPROVED Topic -> publication_state PUBLISHED with published_at, published_in_doc_set_version_id and a POST_PUBLICATION health_score; published_topic_count set"
      - "each such Topic's DocPlanItem -> PUBLISHED, releasing that writer's committed_load_points"
      - "one auto_created QUEUED LocalizationJob per published topic per ACTIVE SIMULTANEOUS locale (locale_code ASC), each with a PROVISIONAL cost quote, bypassing parallel_job_limit and bypassing the one-open-job-per-topic-and-locale uniqueness rule is NOT granted — a topic that already has an open job for that locale is skipped"
      - "each auto_created job spans [clock date, clock date + LocaleProfile.sla_days], so window_days == sla_days + 1 and no rush surcharge applies"
      - "LocaleProfile.committed_source_words / open_job_count and ReleaseTrain.localization_committed_cents updated; train readiness recomputed"
  - method: POST
    path: "/doc-set-versions/{id}/archive"
    description: "Archives a published documentation set with an end-of-life notice, running the five-hop cascade down to locale word balances."
    roles: [DocsLead]
    code: 200
    input: [eol_notice_text]
    output: DocSetVersion
    side_effects:
      - "status = ARCHIVED, archived_at = logical clock, ReleaseTrain.eol_notice_posted = true"
      - "its published topics -> ARCHIVED; their open localization jobs -> CANCELLED with cancel_reason CASCADE_DOC_SET_ARCHIVED"
      - "each affected LocaleProfile.committed_source_words -= reserved_source_words and open_job_count -= 1; ReleaseTrain.localization_committed_cents recomputed"

  # ---- change records and release notes ----
  - method: POST
    path: "/change-records"
    description: "Submits an internal change record for a release. The submitter is recorded from X-User-ID and may not later write its customer-facing language."
    roles: [DocsLead, Writer]
    code: 201
    input: [release_train_id, internal_summary, severity, category, affected_component]
    output: ChangeRecord
    side_effects:
      - "state = SUBMITTED, submitted_by_user_id = X-User-ID, customer_facing_text = null, terminology_blocker_count = 0, rework_count = 0"
  - method: GET
    path: "/change-records/{id}"
    description: "Reads one change record including its terminology blocker snapshot."
    roles: [DocsLead, Writer, SupportAnalyst]
    code: 200
    input: []
    output: ChangeRecord
    side_effects: []
  - method: GET
    path: "/change-records"
    description: "Lists change records, ordered by created_at ASC — the same order in which a release note compiles them."
    roles: [DocsLead, Writer, SupportAnalyst]
    code: 200
    input: ["release_train_id?", "state?", "severity?", "category?", "limit?", "offset?"]
    output: ChangeRecord[]
    side_effects: []
  - method: POST
    path: "/change-records/{id}/editorial-pass"
    description: "An editor other than the submitter rewrites the record in customer-facing language. The terminology scan decides whether the pass approves the record or bounces it for rework, and the two branches store different fields."
    roles: [DocsLead]
    code: 200
    input: [customer_facing_text, used_terms]
    output: ChangeRecord
    side_effects:
      - "zero BLOCKER violations: state = EDITORIALLY_APPROVED, customer_facing_text and editorial_by_user_id stored, terminology_blocker_count = 0"
      - "one or more BLOCKER violations: state = REWORK_REQUESTED, rework_count += 1, terminology_blocker_count snapshotted, customer_facing_text and editorial_by_user_id left untouched"
  - method: POST
    path: "/change-records/{id}/exclude"
    description: "Drops a change record from customer-facing communication for good."
    roles: [DocsLead]
    code: 200
    input: [exclusion_reason]
    output: ChangeRecord
    side_effects:
      - "state = EXCLUDED; the record can never be compiled into a release note"
  - method: POST
    path: "/release-notes"
    description: "Compiles the release train's editorially approved change records into a customer-facing release note for a published documentation set. A fresh compilation supersedes the doc set's previous note, so the caller must present the doc set version it last observed."
    roles: [DocsLead]
    code: 201
    input: [doc_set_version_id, expected_doc_set_version_version]
    output: ReleaseNote
    side_effects:
      - "included_change_record_ids, severity_counts, headline_severity, coverage_factor_provisional and impact_score_provisional computed (calculations.release_note_customer_impact_score, provisional variant); compiled_at set"
      - "any existing COMPILED note of the doc set moves to SUPERSEDED"
      - "increments DocSetVersion.version by 1"
  - method: GET
    path: "/release-notes/{id}"
    description: "Reads one release note including both provisional and final impact figures."
    roles: [DocsLead, SupportAnalyst]
    code: 200
    input: []
    output: ReleaseNote
    side_effects: []
  - method: GET
    path: "/release-notes"
    description: "Lists release notes, ordered by created_at ASC."
    roles: [DocsLead, SupportAnalyst]
    code: 200
    input: ["release_train_id?", "doc_set_version_id?", "status?", "limit?", "offset?"]
    output: ReleaseNote[]
    side_effects: []
  - method: POST
    path: "/release-notes/{id}/publish"
    description: "Publishes the compiled note. Every BREAKING change it carries must already have a published deprecation notice pointing customers at a live migration guide."
    roles: [DocsLead]
    code: 200
    input: []
    output: ReleaseNote
    side_effects:
      - "coverage_factor_final and impact_score_final computed with the final variant; published_at set"
      - "every included ChangeRecord -> PUBLISHED"

  # ---- localization ----
  - method: POST
    path: "/locale-profiles"
    description: "Registers a target locale with its translation-memory coverage, per-word rate, SLA and how many translation jobs it can run against overlapping windows."
    roles: [LocalizationCoordinator]
    code: 201
    input: [locale_code, publication_mode, tm_coverage_pct, per_word_rate_cents, sla_days, parallel_job_limit, "status?"]
    output: LocaleProfile
    side_effects:
      - "status defaults to ACTIVE; committed_source_words = 0 and open_job_count = 0"
  - method: GET
    path: "/locale-profiles/{id}"
    description: "Reads one locale profile including its live committed word balance."
    roles: [DocsLead, LocalizationCoordinator]
    code: 200
    input: []
    output: LocaleProfile
    side_effects: []
  - method: GET
    path: "/locale-profiles"
    description: "Lists locale profiles, ordered by locale_code ASC — the same order a budget projection walks them in."
    roles: [DocsLead, LocalizationCoordinator]
    code: 200
    input: ["status?", "publication_mode?", "limit?", "offset?"]
    output: LocaleProfile[]
    side_effects: []
  - method: POST
    path: "/localization-jobs"
    description: "Queues a manual translation job for a published topic into one locale over a closed calendar window, reserving the topic's current word count and quoting a provisional cost."
    roles: [LocalizationCoordinator]
    code: 201
    input: [topic_id, locale_profile_id, window_start_date, window_end_date]
    output: LocalizationJob
    side_effects:
      - "state = QUEUED, auto_created = false, source_revision_number and reserved_source_words snapshotted from the topic"
      - "estimated_cost_cents, leverage_pct, rush_surcharge_cents and volume_discount_cents computed with the PROVISIONAL variant; cost_variant = PROVISIONAL"
      - "LocaleProfile.committed_source_words += reserved_source_words and open_job_count += 1; ReleaseTrain.localization_committed_cents recomputed"
  - method: GET
    path: "/localization-jobs/{id}"
    description: "Reads one translation job with both its provisional and final cost figures."
    roles: [DocsLead, LocalizationCoordinator]
    code: 200
    input: []
    output: LocalizationJob
    side_effects: []
  - method: GET
    path: "/localization-jobs"
    description: "Lists translation jobs, ordered by created_at ASC. This is the only discovery channel for the jobs a doc-set publication auto-creates."
    roles: [DocsLead, LocalizationCoordinator]
    code: 200
    input: ["topic_id?", "locale_profile_id?", "state?", "cost_variant?", "limit?", "offset?"]
    output: LocalizationJob[]
    side_effects: []
  - method: POST
    path: "/localization-jobs/{id}/deliver"
    description: "Records delivered word counts and measured translation-memory matches, replacing the provisional quote with the final one. Refused outright once the SLA grace period has passed."
    roles: [LocalizationCoordinator]
    code: 200
    input: [translated_word_count, tm_matched_word_count]
    output: LocalizationJob
    side_effects:
      - "state -> TRANSLATED; leverage_pct, rush_surcharge_cents, volume_discount_cents and final_cost_cents computed with the FINAL variant; cost_variant = FINAL"
      - "estimated_cost_cents left intact; ReleaseTrain.localization_committed_cents now counts the final figure for this job"
  - method: POST
    path: "/localization-jobs/{id}/rework"
    description: "Bounces a delivered translation back to the vendor for correction."
    roles: [LocalizationCoordinator]
    code: 200
    input: []
    output: LocalizationJob
    side_effects:
      - "state = REWORK_REQUESTED, rework_count += 1; the last delivery's cost figures stand until the next delivery"
  - method: POST
    path: "/localization-jobs/{id}/publish"
    description: "Publishes the localized page. Simultaneous locales go live immediately once the release is GA; delayed locales are parked on a computed schedule and only go live once the logical clock reaches it."
    roles: [LocalizationCoordinator]
    code: 200
    input: []
    output: LocalizationJob
    side_effects:
      - "SIMULTANEOUS: state = PUBLISHED_LOCALIZED, published_at set, publication_mode_applied = SIMULTANEOUS, the locale's reservation released and the train's commitment recomputed"
      - "DELAYED before the schedule: state = SCHEDULED_DELAYED, scheduled_publish_date = date(Topic.published_at) + sla_days, publication_mode_applied = DELAYED, published_at stays null and the reservation is NOT released"
      - "DELAYED on or after the schedule: state = PUBLISHED_LOCALIZED with the reservation released"
  - method: POST
    path: "/localization-jobs/{id}/cancel"
    description: "Cancels a translation job and returns the locale's reserved word balance to its pre-creation value."
    roles: [LocalizationCoordinator]
    code: 200
    input: [cancel_reason]
    output: LocalizationJob
    side_effects:
      - "state = CANCELLED; LocaleProfile.committed_source_words -= reserved_source_words and open_job_count -= 1; ReleaseTrain.localization_committed_cents recomputed"

  # ---- terminology governance ----
  - method: POST
    path: "/terminology-terms"
    description: "Adds a style-guide term with its preferred form and the forbidden variants the scan looks for, at BLOCKER or WARNING severity."
    roles: [DocsLead]
    code: 201
    input: [term, preferred_form, forbidden_forms, enforcement_severity]
    output: TerminologyTerm
    side_effects:
      - "status = ACTIVE; the term takes effect for every subsequent revision and editorial pass, and never rewrites an existing snapshot"
  - method: GET
    path: "/terminology-terms/{id}"
    description: "Reads one terminology term."
    roles: [DocsLead, Writer]
    code: 200
    input: []
    output: TerminologyTerm
    side_effects: []
  - method: GET
    path: "/terminology-terms"
    description: "Lists terminology terms, ordered by term ASC — the order the violation scan walks them in."
    roles: [DocsLead, Writer]
    code: 200
    input: ["status?", "enforcement_severity?", "limit?", "offset?"]
    output: TerminologyTerm[]
    side_effects: []
  - method: POST
    path: "/terminology-terms/{id}/retire"
    description: "Retires a term. Live topic violation counts drop; the immutable per-revision and per-change-record snapshots do not change."
    roles: [DocsLead]
    code: 200
    input: []
    output: TerminologyTerm
    side_effects:
      - "status = RETIRED, retired_at = logical clock"
      - "every topic whose newest revision cited this term has open_blocker_violations / open_warning_violations and health_score recomputed"

  # ---- deprecation and migration ----
  - method: POST
    path: "/deprecation-notices"
    description: "Drafts a deprecation with its announce / deprecated / removal timeline and the migration guide customers are pointed at. The minimum notice period depends on severity."
    roles: [DocsLead]
    code: 201
    input: [release_train_id, feature_key, severity_tier, announce_date, deprecated_date, removal_date, migration_guide_topic_id]
    output: DeprecationNotice
    side_effects:
      - "status = DRAFTED; notice_days and earliest_removal_date computed and stored (calculations.deprecation_timeline_compliance)"
  - method: GET
    path: "/deprecation-notices/{id}"
    description: "Reads one deprecation notice including its computed timeline fields."
    roles: [DocsLead, SupportAnalyst]
    code: 200
    input: []
    output: DeprecationNotice
    side_effects: []
  - method: GET
    path: "/deprecation-notices"
    description: "Lists deprecation notices, ordered by created_at ASC. Filterable by train, migration guide topic, status and severity."
    roles: [DocsLead, SupportAnalyst]
    code: 200
    input: ["release_train_id?", "migration_guide_topic_id?", "status?", "severity_tier?", "limit?", "offset?"]
    output: DeprecationNotice[]
    side_effects: []
  - method: POST
    path: "/deprecation-notices/{id}/publish"
    description: "Publishes the deprecation once its announce date has arrived and its migration guide is live. Only a published notice unblocks a BREAKING release note."
    roles: [DocsLead]
    code: 200
    input: []
    output: DeprecationNotice
    side_effects:
      - "status = PUBLISHED, published_at = logical clock"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing or sent as an empty string"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the target endpoint in §1.5"
  - id: ERR_ROLE_IDENTITY_MISMATCH
    http: 403
    condition: "role Writer or Reviewer presents an X-User-ID that is not the id of an existing Writer / Reviewer"
  - id: ERR_NOT_ASSIGNED_WRITER
    http: 403
    condition: "a Writer acts on a topic whose plan item is assigned to someone else, or to nobody"
  - id: ERR_SIGNOFF_NOT_OWNED
    http: 403
    condition: "a Reviewer decides a sign-off addressed to a different reviewer"
  - id: ERR_SELF_REVIEW_FORBIDDEN
    http: 403
    condition: "the requested reviewer's person_key matches the person_key of the writer who authored the topic's newest revision"
  - id: ERR_EDITORIAL_SOD_VIOLATION
    http: 403
    condition: "the editorial pass is attempted by the same X-User-ID that submitted the change record"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong JSON type, unknown enum value, negative count, rating outside 1..5, malformed date or instant, money sent as a string, or tm_matched_word_count greater than translated_word_count"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset below 0"
  - id: ERR_INVALID_DATE_WINDOW
    http: 400
    condition: "a supplied window or timeline is misordered: writer window_end_date <= window_start_date, localization window_end_date < window_start_date, announce_date > deprecated_date, deprecated_date >= removal_date, or doc_freeze_date > ga_date > support_end_date"

  # ---- existence ----
  - id: ERR_RELEASE_TRAIN_NOT_FOUND
    http: 404
    condition: "no release train with the given id"
  - id: ERR_WRITER_NOT_FOUND
    http: 404
    condition: "no writer with the given id"
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "no reviewer with the given id"
  - id: ERR_PLAN_ITEM_NOT_FOUND
    http: 404
    condition: "no documentation plan item with the given id"
  - id: ERR_TOPIC_NOT_FOUND
    http: 404
    condition: "no topic with the given id, including a migration_guide_topic_id that names nothing"
  - id: ERR_PARENT_TOPIC_NOT_FOUND
    http: 404
    condition: "parent_topic_id names no topic"
  - id: ERR_SIGNOFF_NOT_FOUND
    http: 404
    condition: "no sign-off with the given id"
  - id: ERR_DOC_SET_VERSION_NOT_FOUND
    http: 404
    condition: "no documentation set version with the given id"
  - id: ERR_CHANGE_RECORD_NOT_FOUND
    http: 404
    condition: "no change record with the given id"
  - id: ERR_RELEASE_NOTE_NOT_FOUND
    http: 404
    condition: "no release note with the given id"
  - id: ERR_LOCALE_PROFILE_NOT_FOUND
    http: 404
    condition: "no locale profile with the given id"
  - id: ERR_LOCALIZATION_JOB_NOT_FOUND
    http: 404
    condition: "no localization job with the given id"
  - id: ERR_TERM_NOT_FOUND
    http: 404
    condition: "no terminology term with the given id"
  - id: ERR_DEPRECATION_NOTICE_NOT_FOUND
    http: 404
    condition: "no deprecation notice with the given id"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_RELEASE_TRAIN_VERSION
    http: 412
    condition: "expected_release_train_version does not equal the release train's current version"
  - id: ERR_STALE_DOC_SET_VERSION
    http: 412
    condition: "expected_doc_set_version_version does not equal the documentation set version's current version"

  # ---- state preconditions ----
  - id: ERR_RELEASE_TRAIN_INVALID_ADVANCE
    http: 409
    condition: "target_status is not the immediate successor of the train's current status, including any attempt to advance out of END_OF_LIFE"
  - id: ERR_SUPPORT_END_DATE_NOT_REACHED
    http: 409
    condition: "END_OF_LIFE requested while the logical clock is still before support_end_date"
  - id: ERR_RELEASE_TRAIN_CLOSED_FOR_PLANNING
    http: 409
    condition: "an assignment is attempted on a train whose status is GA, MAINTENANCE or END_OF_LIFE"
  - id: ERR_WRITER_ON_LEAVE
    http: 409
    condition: "the target writer's status is ON_LEAVE"
  - id: ERR_PLAN_ITEM_NOT_ASSIGNABLE
    http: 409
    condition: "assignment attempted on a plan item that is already in review, approved, published or cancelled"
  - id: ERR_PLAN_ITEM_NOT_CANCELLABLE
    http: 409
    condition: "cancellation attempted on a plan item that is APPROVED_CONTENT, PUBLISHED or already CANCELLED"
  - id: ERR_TOPIC_ALREADY_IN_REVIEW
    http: 409
    condition: "submit-review on a topic whose review_state is PENDING_SIGNOFF or FULLY_APPROVED"
  - id: ERR_NO_REVISIONS
    http: 409
    condition: "submit-review on a topic with current_revision_number 0"
  - id: ERR_NO_NEW_REVISION
    http: 409
    condition: "submit-review when current_revision_number is not greater than last_submitted_revision_number"
  - id: ERR_TERMINOLOGY_BLOCKER_PRESENT
    http: 409
    condition: "submit-review while the topic has at least one open BLOCKER terminology violation"
  - id: ERR_DOC_FREEZE_POSTURE_BLOCKED
    http: 409
    condition: "submit-review while the train's doc_readiness_posture is FROZEN, or RESTRICTED for a non-CRITICAL audience tier"
  - id: ERR_TOPIC_NOT_IN_REVIEW
    http: 409
    condition: "a sign-off is requested on, or decided for, a topic whose review_state is not PENDING_SIGNOFF"
  - id: ERR_SIGNOFF_ALREADY_DECIDED
    http: 409
    condition: "decide on a sign-off already APPROVED, CHANGES_REQUESTED or SUPERSEDED"
  - id: ERR_DOC_SET_NOT_DRAFT
    http: 409
    condition: "publish attempted on a doc set that is already PUBLISHED, SUPERSEDED or ARCHIVED"
  - id: ERR_DOC_SET_NOT_PUBLISHED
    http: 409
    condition: "archive attempted on a doc set that is not PUBLISHED; a DOC_FREEZE -> GA advance with no published doc set on the train; or a release-note compilation against a doc set that is not PUBLISHED"
  - id: ERR_CHANGE_RECORD_NOT_EDITABLE
    http: 409
    condition: "editorial pass or exclusion attempted on a record that is EDITORIALLY_APPROVED, EXCLUDED or PUBLISHED"
  - id: ERR_RELEASE_NOTE_ALREADY_PUBLISHED
    http: 409
    condition: "publish attempted on a release note that is already PUBLISHED"
  - id: ERR_RELEASE_NOTE_SUPERSEDED
    http: 409
    condition: "publish attempted on a release note that a later compilation superseded"
  - id: ERR_LOCALIZATION_JOB_NOT_DELIVERABLE
    http: 409
    condition: "deliver attempted on a job that is not QUEUED or REWORK_REQUESTED — checked before the SLA window"
  - id: ERR_LOCALIZATION_JOB_NOT_TRANSLATED
    http: 409
    condition: "rework on a job that is not TRANSLATED, or publish on a job that is neither TRANSLATED nor SCHEDULED_DELAYED"
  - id: ERR_LOCALIZATION_JOB_NOT_CANCELLABLE
    http: 409
    condition: "cancel attempted on a job that is already PUBLISHED_LOCALIZED or CANCELLED"
  - id: ERR_SOURCE_TOPIC_NOT_PUBLISHED
    http: 409
    condition: "a translation job is queued for, or published from, a topic whose publication_state is not PUBLISHED"
  - id: ERR_LOCALE_PAUSED
    http: 409
    condition: "a manual translation job is queued against a PAUSED locale profile"
  - id: ERR_TRAIN_NOT_GA
    http: 409
    condition: "a SIMULTANEOUS-locale job is published while its release train has not reached GA"
  - id: ERR_FEEDBACK_TOPIC_NOT_PUBLISHED
    http: 409
    condition: "reader feedback submitted against a topic that is UNPUBLISHED or ARCHIVED"
  - id: ERR_TERM_ALREADY_RETIRED
    http: 409
    condition: "retire attempted on a term whose status is already RETIRED"
  - id: ERR_DEPRECATION_NOTICE_ALREADY_PUBLISHED
    http: 409
    condition: "publish attempted on a deprecation notice that is PUBLISHED or RETIRED"
  - id: ERR_CLOCK_BACKWARD
    http: 409
    condition: "the requested logical clock value is earlier than the clock's present value"

  # ---- safety and referential integrity ----
  - id: ERR_MIGRATION_GUIDE_NOT_PUBLISHED
    http: 409
    condition: "a deprecation notice is published while its migration guide topic is not live, or a release note carrying a BREAKING change has no published deprecation notice for that component"
  - id: ERR_MIGRATION_GUIDE_PRODUCT_MISMATCH
    http: 409
    condition: "migration_guide_topic_id resolves to a topic whose release train has a different product_key from the notice's train"
  - id: ERR_PARENT_TOPIC_MISMATCH
    http: 409
    condition: "parent_topic_id resolves to a topic under a different documentation plan item"
  - id: ERR_IA_DEPTH_EXCEEDED
    http: 409
    condition: "the requested information-architecture placement would exceed depth 4 or close a cycle in the parent chain"

  # ---- temporal ----
  - id: ERR_NOTICE_PERIOD_TOO_SHORT
    http: 409
    condition: "removal_date minus announce_date is fewer days than the severity tier's minimum notice period"
  - id: ERR_ANNOUNCE_DATE_NOT_REACHED
    http: 409
    condition: "a deprecation notice is published before its announce_date"
  - id: ERR_LOCALIZATION_SLA_BREACH
    http: 409
    condition: "a delivery arrives more than SLA_GRACE_DAYS after the job's window_end_date"

  # ---- uniqueness, overlap, aggregate limits ----
  - id: ERR_DUPLICATE_VERSION_LABEL
    http: 409
    condition: "product_key + version_label already exists on another release train"
  - id: ERR_DUPLICATE_PERSON_KEY
    http: 409
    condition: "person_key already exists among writers, or among reviewers"
  - id: ERR_DUPLICATE_TOPIC_SLUG
    http: 409
    condition: "slug already exists among the topics of the same release train"
  - id: ERR_DUPLICATE_LOCALE_CODE
    http: 409
    condition: "locale_code already exists on another locale profile"
  - id: ERR_DUPLICATE_TERM
    http: 409
    condition: "term already exists among ACTIVE terminology terms"
  - id: ERR_DUPLICATE_SIGNOFF_DISCIPLINE
    http: 409
    condition: "the topic already holds a PENDING, APPROVED or CHANGES_REQUESTED sign-off for the requested reviewer's discipline"
  - id: ERR_DUPLICATE_LOCALIZATION_JOB
    http: 409
    condition: "the topic already has a non-terminal translation job for the requested locale"
  - id: ERR_WRITER_WINDOW_OVERLAP
    http: 409
    condition: "the requested half-open authoring window, extended by the two-day handoff buffer on its leading edge, intersects another counted window of the same writer"
  - id: ERR_LOCALE_PARALLEL_JOB_LIMIT_EXCEEDED
    http: 409
    condition: "the locale already has parallel_job_limit open jobs whose closed windows intersect the requested closed window"

  # ---- empty candidate sets ----
  - id: ERR_NO_APPROVED_TOPICS
    http: 409
    condition: "a doc set publication finds no FULLY_APPROVED topic on the train"
  - id: ERR_NO_PUBLISHABLE_CHANGES
    http: 409
    condition: "a release-note compilation finds no EDITORIALLY_APPROVED change record on the train"

  # ---- fiscal ----
  - id: ERR_LOCALIZATION_BUDGET_EXCEEDED
    http: 409
    condition: "the projected localization budget for the publication exceeds the train's localization_budget_cap_cents"
  - id: ERR_WRITER_CAPACITY_EXCEEDED
    http: 409
    condition: "the assignment would push the writer's committed_load_points strictly above capacity_points"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — segregation of duties
# -----------------------------------------------------------------------------
# Authoring, reviewing and editorial approval are held by different roles, and
# within a role by different identities: a writer cannot review their own page
# (ERR_SELF_REVIEW_FORBIDDEN) and a change record's submitter cannot write its
# customer-facing language (ERR_EDITORIAL_SOD_VIOLATION).
# -----------------------------------------------------------------------------
roles:

  - name: DocsLead
    description: "Documentation lead: owns planning, writer assignment, sign-off routing, versioned publication, editorial approval of change records, release-note compilation, terminology governance and deprecation communication. The only role that can move the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /release-trains and POST /release-trains/{id}/advance"
      - "POST /writers, POST /reviewers"
      - "POST /plan-items, POST /plan-items/{id}/assign, POST /plan-items/{id}/cancel"
      - "POST /topics/{id}/sign-offs"
      - "POST /doc-set-versions, POST /doc-set-versions/{id}/publish, POST /doc-set-versions/{id}/archive"
      - "POST /change-records/{id}/editorial-pass, POST /change-records/{id}/exclude"
      - "POST /release-notes, POST /release-notes/{id}/publish"
      - "POST /terminology-terms, POST /terminology-terms/{id}/retire"
      - "POST /deprecation-notices, POST /deprecation-notices/{id}/publish"
    shared_operations:
      - "POST /change-records (shared with Writer)"
      - "all GET reads except that only DocsLead and SupportAnalyst may read page feedback and the deflection summary"

  - name: Writer
    description: "Technical writer. May author topics and revisions only for the plan items assigned to them, and submit those topics for review. X-User-ID is the writer's own id."
    identity: "entity_backed:Writer"
    exclusive_operations:
      - "POST /topics"
      - "POST /topics/{id}/revisions"
      - "POST /topics/{id}/submit-review"
    shared_operations:
      - "POST /change-records (shared with DocsLead)"
      - "GET /release-trains, GET /writers/{id}, GET /writers/{id}/revisions, GET /plan-items, GET /topics, GET /topics/{id}/revisions, GET /topics/{id}/sign-offs, GET /sign-offs/{id}, GET /change-records, GET /terminology-terms"

  - name: Reviewer
    description: "Engineering or product reviewer who gives technical-accuracy sign-off. X-User-ID is the reviewer's own id and must match the sign-off addressed to them."
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /sign-offs/{id}/decide"
    shared_operations:
      - "GET /release-trains, GET /reviewers, GET /reviewers/{id}, GET /plan-items, GET /topics, GET /topics/{id}/revisions, GET /topics/{id}/sign-offs, GET /sign-offs, GET /sign-offs/{id}"

  - name: LocalizationCoordinator
    description: "Runs the translation pipeline: locale profiles, translation jobs, delivery, rework, localized publication and cancellation. Has no authority over source content, review or release notes."
    identity: "opaque"
    exclusive_operations:
      - "POST /locale-profiles"
      - "POST /localization-jobs"
      - "POST /localization-jobs/{id}/deliver"
      - "POST /localization-jobs/{id}/rework"
      - "POST /localization-jobs/{id}/publish"
      - "POST /localization-jobs/{id}/cancel"
    shared_operations:
      - "GET /release-trains, GET /topics, GET /doc-set-versions, GET /locale-profiles, GET /localization-jobs"

  - name: SupportAnalyst
    description: "Support-side consumer of documentation signals: reads page feedback, deflection metrics, release notes and deprecation notices. Writes nothing."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /topics/{id}/feedback and GET /topics/{id}/deflection-summary (shared with DocsLead only)"
      - "GET /release-trains, GET /topics, GET /doc-set-versions, GET /change-records, GET /release-notes, GET /deprecation-notices"

  - name: Reader
    description: "Anonymous documentation reader. May read a published topic and leave one page rating per session; nothing else."
    identity: "opaque"
    exclusive_operations:
      - "POST /topics/{id}/feedback"
    shared_operations:
      - "GET /topics/{id}"
