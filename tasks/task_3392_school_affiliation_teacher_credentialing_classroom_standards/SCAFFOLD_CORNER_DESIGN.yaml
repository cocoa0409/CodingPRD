          trigger:
            - call: "POST /society/schools"
              payload: { name: "NoHdr", display_name: "NoHdr School", uses_method_name: false, contact_email: "nh@x.org" }
              as: Anonymous
          assert:
            - "http 401 with error_id ERR_UNAUTHENTICATED"
