  - { method: POST, path: "/api/service-visits", description: "schedule a service visit at an approved account; 30-minute spacing rule applies", roles: [DistributorRep], code: 201, input: [account_id, window_start, window_end], output: ServiceVisit, side_effects: ["distributor_id set from X-User-ID"] }
