  - method: GET
    path: "/siting/routes"
    description: "List routes across projects (filtered-list FK reverse lookup for Route.project_id)"
    roles: *all_roles
    code: 200
    input: ["project_id?", "kind?", "status?", "limit?", "offset?"]
    output: Route[]
