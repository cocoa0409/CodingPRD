            - { call: "POST /proofs/${proof}/approve", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /gang-runs", payload: { paper_stock_id: "${stock}", press_type: "WEB", anchor_due_date: "2026-08-20T00:00:00Z" }, as: PressScheduler, captures: { gang: $.data.id, gv: $.data.version } }
          trigger:
            - { call: "POST /gang-runs/${gang}/members", payload: { job_id: "${job}", expected_gang_run_version: "${gv}" }, as: PressScheduler, captures: { err: $.data.error_id } }
          assert:
