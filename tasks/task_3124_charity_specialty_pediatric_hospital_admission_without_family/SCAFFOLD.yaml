    roles: [CareCoordinator]
    code: 200
    input: [new_scheduled_date]
    output: StagedProcedure
    side_effects: ["scheduled_date := new_scheduled_date; status := PLANNED; version += 1"]

  - method: POST
    path: "/charity-care/staged-procedures/{stageId}/cancel-stage"
    description: "Cancel a planned stage (plan contracts)"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: StagedProcedure
    side_effects: ["planned_stage_count -= 1; possible plan -> SURVEILLANCE; funding_status recompute; version += 1"]

