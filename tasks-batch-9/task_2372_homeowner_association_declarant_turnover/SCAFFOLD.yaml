# =============================================================================
# PRD Benchmark Seed Tables — Homeowner Association Declarant Turnover
# Sections §1.0 – §1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2372. Homeowner Association Declarant Turnover (community association transition committee): turnover trigger by percentage of lots sold or a fixed date under the declaration, transition audit of association finances, reserve funding adequacy and developer subsidy accounting, construction defect investigation with reserve of claims before statutes expire, transfer of records, warranties, plans and vendor contracts with assignment consent, board election converting from declarant-appointed to owner-elected directors, developer obligations for unbuilt amenities and common area conveyance, contract cancellation rights for developer-affiliated service agreements, budget re-forecast and assessment increase after subsidy ends

domain_name: hoa-declarant-turnover
api_prefix: /hoa

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /hoa with FK body fields;
  # no entity id is nested inside another entity's URL path except as an
  # explicit reverse-lookup sub-resource read.

  state_machine_shape: parallel
  # TurnoverCase carries two independent dimensions (governance_status ×
  # financial_status) that advance on separate triggers and are read together
  # only through the derived `turnover_posture`. Secondary shapes present:
  # DefectClaim is cyclic (NOTICED → REJECTED_BY_DEVELOPER → INVESTIGATING),
  # RecordsTransferItem is cyclic (DELIVERED → REJECTED → DELIVERED),
  # VendorContract is branching fork-join (ASSIGNMENT_REQUESTED → {CONSENTED,
  # CONSENT_REFUSED}), Director seating bubbles up into TurnoverCase governance.

  relationship_patterns:
    - one_to_many          # Association → Lot / CommonAreaComponent / SubsidyEntry / ...
    - self_referential     # SubsidyEntry.reverses_entry_id -> SubsidyEntry.id
    - cross_aggregate      # DefectClaim → CommonAreaComponent, VendorContract → CommonAreaComponent
    - polymorphic: false

  role_model: segregation_of_duties
  # Declarant (developer side) and TransitionCommittee (owner side) own disjoint
  # operations; Auditor and ElectionInspector are independent certifiers whose
  # X-User-ID must not coincide with the user who prepared the artifact they
  # certify.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Association
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the homeowner association
        constraints: 1..120 chars, non-blank
      - name: total_planned_lots
        type: integer
        source: input
        description: number of lots the declaration plans for the community; denominator of sold_lot_pct
        constraints: ">= 1"
      - name: turnover_threshold_pct
        type: number
        source: input
        description: percentage of lots that must be CLOSED before a PERCENT_SOLD turnover trigger may be certified
        constraints: 0.01..100.00, two decimals
      - name: fixed_turnover_date
        type: datetime
        source: input
        description: declaration's fixed outside date (ISO 8601 UTC) on or after which a FIXED_DATE turnover trigger may be certified
      - name: statute_of_repose_years
        type: integer
        source: input
        description: whole years added to a component's substantial_completion_date to obtain a defect claim's repose_deadline
        constraints: 1..15
      - name: reserve_pool_cents
        type: integer
        source: input
        description: cash balance of the reserve fund in cents; numerator of percent_funded
        constraints: ">= 0"
      - name: reserve_claim_pool_cents
        type: integer
        source: input
        description: cents earmarked for construction defect claim reserves; ceiling for reserve_claim_committed_cents
        constraints: ">= 0"
      - name: declarant_monthly_subsidy_cents
        type: integer
        source: input
        description: monthly deficit subsidy the declarant funds while the subsidy is active; drives assessment_reforecast's subsidy offset
        constraints: ">= 0"
      - name: sold_lot_count
        type: integer
        source: computed
        description: count of Lot rows for this association whose sale_status == CLOSED
        default: 0
      - name: sold_lot_pct
        type: number
        source: computed
        description: see calculations.sold_lot_percentage; two decimals, round_half_up
        default: 0.00
      - name: subsidy_receivable_cents
        type: integer
        source: computed
        description: see calculations.subsidy_receivable_balance; may be negative when payments exceed accruals
        default: 0
      - name: reserve_claim_committed_cents
        type: integer
        source: computed
        description: sum of reserved_amount_cents over DefectClaim rows of this association whose status == RESERVED
        default: 0
      - name: reserve_claim_available_cents
        type: integer
        source: computed
        description: reserve_claim_pool_cents - reserve_claim_committed_cents
        default: 0
      - name: subsidy_end_date
        type: datetime
        source: system
        description: date the declarant subsidy ends; null until the FINANCIAL dimension advances out of SUBSIDY_ACTIVE
        default: null
      - name: budget_forecast_status
        type: enum
        source: system
        description: whether the adopted operating forecast still reflects current obligations
        default: CURRENT
        constraints: "CURRENT | STALE"

  - name: TurnoverCase
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: FK -> Association.id; at most one TurnoverCase per Association
      - name: total_seats
        type: integer
        source: input
        description: board seats fixed by the bylaws; conserved quantity of the seat ledger invariant
        constraints: 3..9, odd
      - name: governance_status
        type: enum
        source: system
        description: governance dimension of the parallel state machine
        default: DECLARANT_CONTROL
        constraints: "DECLARANT_CONTROL | ELECTION_CALLED | ELECTION_HELD | OWNER_CONTROL"
      - name: financial_status
        type: enum
        source: system
        description: financial dimension of the parallel state machine, advanced independently of governance_status
        default: SUBSIDY_ACTIVE
        constraints: "SUBSIDY_ACTIVE | AUDIT_IN_PROGRESS | SETTLED"
      - name: turnover_posture
        type: enum
        source: computed
        description: see calculations.turnover_posture_derivation; SETTLED_LOCKED gates all association-scoped mutations
        default: DECLARANT_CONTROL_OPEN
        constraints: "DECLARANT_CONTROL_OPEN | TRANSITION_RESTRICTED | OWNER_CONTROL_OPEN | SETTLED_LOCKED"
      - name: trigger_basis
        type: enum
        source: system
        description: basis on which the turnover trigger was certified; null before certification
        default: null
        constraints: "PERCENT_SOLD | FIXED_DATE | null"
      - name: trigger_certified_at
        type: datetime
        source: system
        description: logical-clock instant at which certify-trigger succeeded; null before certification
        default: null
      - name: trigger_certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that certified the trigger; compared against director-seating actors for segregation of duties
        default: null
      - name: declarant_appointed_seats
        type: integer
        source: computed
        description: count of Director rows of this case with seat_type == DECLARANT_APPOINTED and status == SEATED
        default: 0
      - name: owner_elected_seats
        type: integer
        source: computed
        description: count of Director rows of this case with seat_type == OWNER_ELECTED and status == SEATED
        default: 0
      - name: vacant_seats
        type: integer
        source: computed
        description: total_seats - (declarant_appointed_seats + owner_elected_seats)
        default: 0
      - name: owner_elected_seats_required
        type: integer
        source: computed
        description: see calculations.governance_seat_ledger; 0 until the trigger is certified
        default: 0
      - name: records_transfer_completeness_pct
        type: number
        source: computed
        description: see calculations.records_transfer_completeness; two decimals, round_half_up
        default: 100.00
      - name: settlement_blocked
        type: boolean
        source: computed
        description: set true when an ISSUED AuditEngagement of the association re-derives finding_status EXCEPTION_NOTED after issuance
        default: false

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: FK -> Association.id
      - name: lot_number
        type: string
        source: input
        description: identifier printed on the recorded plat; unique per association
        constraints: 1..16 chars, unique within association_id
      - name: sale_status
        type: enum
        source: input
        description: sale posture of the lot; UNSOLD and UNDER_CONTRACT are settable at creation, CLOSED only via close-sale
        default: UNSOLD
        constraints: "UNSOLD | UNDER_CONTRACT | CLOSED"
      - name: closing_date
        type: datetime
        source: system
        description: date the sale closed; null unless sale_status == CLOSED
        default: null

  - name: CommonAreaComponent
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: FK -> Association.id
      - name: name
        type: string
        source: input
        description: component label as it appears on the reserve study schedule
        constraints: 1..80 chars
      - name: category
        type: enum
        source: input
        description: component class; AMENITY rows carry the declarant's unbuilt-amenity obligation
        constraints: "AMENITY | INFRASTRUCTURE | STRUCTURE"
      - name: replacement_cost_cents
        type: integer
        source: input
        description: current replacement cost used by the fully funded balance
        constraints: ">= 0"
      - name: useful_life_years
        type: integer
        source: input
        description: total useful life in years; denominator of the component's fully funded share
        constraints: ">= 1"
      - name: effective_age_years
        type: integer
        source: input
        description: consumed life in years; capped at useful_life_years inside the fully funded balance
        constraints: ">= 0"
      - name: promised_completion_date
        type: datetime
        source: input
        description: date the declarant promised substantial completion; overdue unbuilt rows block governance transfer and settlement
      - name: build_status
        type: enum
        source: input
        description: construction posture; UNBUILT and IN_PROGRESS are settable at creation, COMPLETE only via the BUILD_COMPLETE milestone
        default: UNBUILT
        constraints: "UNBUILT | IN_PROGRESS | COMPLETE"
      - name: substantial_completion_date
        type: datetime
        source: system
        description: effective date recorded by the BUILD_COMPLETE milestone; base date of every defect claim's repose_deadline
        default: null
      - name: conveyance_status
        type: enum
        source: system
        description: common area conveyance posture
        default: NOT_CONVEYED
        constraints: "NOT_CONVEYED | DEED_TENDERED | CONVEYED"
      - name: conveyed_at
        type: datetime
        source: system
        description: logical-clock instant the association accepted conveyance; null before acceptance
        default: null

  - name: ReserveStudy
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: FK -> Association.id
      - name: funding_method
        type: enum
        source: input
        description: method recorded at creation; the RECOMPUTE action may override it for a single evaluation
        constraints: "COMPONENT_FULL_FUNDING | CASH_FLOW"
      - name: planned_annual_contribution_cents
        type: integer
        source: input
        description: annual reserve contribution the study assumes; CASH_FLOW year-walk input
        constraints: ">= 0"
      - name: projected_annual_expenditure_cents
        type: integer
        source: input
        description: year-one projected reserve expenditure before escalation; CASH_FLOW year-walk input
        constraints: ">= 0"
      - name: evaluated_method
        type: enum
        source: computed
        description: method actually used by the most recent adequacy evaluation; null before the first RECOMPUTE
        default: null
        constraints: "COMPONENT_FULL_FUNDING | CASH_FLOW | null"
      - name: component_count
        type: integer
        source: computed
        description: count of CommonAreaComponent rows of the association with build_status == COMPLETE and conveyance_status == CONVEYED
        default: 0
      - name: fully_funded_balance_cents
        type: integer
        source: computed
        description: see calculations.reserve_funding_adequacy
        default: 0
      - name: percent_funded
        type: number
        source: computed
        description: reserve_pool_cents over fully_funded_balance_cents as a percentage; 0.00 when the balance is 0
        default: 0.00
      - name: min_projected_balance_cents
        type: integer
        source: computed
        description: minimum reserve balance over the CASH_FLOW year-walk horizon; 0 before a CASH_FLOW evaluation
        default: 0
      - name: adequacy_verdict
        type: enum
        source: computed
        description: method-dependent adequacy conclusion
        default: UNDETERMINED
        constraints: "ADEQUATE | MARGINAL | DEFICIENT | UNDETERMINED"
      - name: recommended_annual_contribution_cents
        type: integer
        source: computed
        description: method-dependent recommended contribution; feeds assessment_reforecast once the study is ADOPTED
        default: 0
      - name: status
        type: enum
        source: system
        description: study lifecycle; creating a new study supersedes any prior DRAFT of the same association
        default: DRAFT
        constraints: "DRAFT | ADOPTED | SUPERSEDED"

  - name: SubsidyEntry
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: FK -> Association.id
      - name: direction
        type: enum
        source: input
        description: ACCRUAL raises the receivable, PAYMENT lowers it, REVERSAL rows are system-created audit mirrors
        constraints: "ACCRUAL | PAYMENT (REVERSAL is system-created only)"
      - name: amount_cents
        type: integer
        source: input
        description: absolute amount in cents; sign is carried by direction
        constraints: ">= 1"
      - name: period_month
        type: string
        source: input
        description: subsidy month in YYYY-MM form; compared lexicographically against an audit period's month bounds
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: reverses_entry_id
        type: string
        source: system
        description: FK -> SubsidyEntry.id; set only on system-created REVERSAL mirrors, null otherwise
        default: null
      - name: posted_by_user_id
        type: string
        source: system
        description: X-User-ID that posted the entry; compared against the audit issuer for segregation of duties
      - name: status
        type: enum
        source: system
        description: POSTED rows participate in the receivable; REVERSED rows are excluded
        default: POSTED
        constraints: "POSTED | REVERSED"

  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: FK -> Association.id
      - name: period_start
        type: datetime
        source: input
        description: first instant of the audited period; closed interval lower bound
      - name: period_end
        type: datetime
        source: input
        description: last instant of the audited period; closed interval upper bound, must be >= period_start
      - name: status
        type: enum
        source: system
        description: engagement lifecycle
        default: ENGAGED
        constraints: "ENGAGED | ISSUED"
      - name: finding_status
        type: enum
        source: computed
        description: CLEAN when unreconciled_delta_cents == 0, EXCEPTION_NOTED otherwise; re-derived whenever the receivable moves after issuance
        default: CLEAN
        constraints: "CLEAN | EXCEPTION_NOTED"
      - name: unreconciled_delta_cents
        type: integer
        source: computed
        description: see calculations.audit_unreconciled_delta
        default: 0
      - name: audited_receivable_snapshot_cents
        type: integer
        source: computed
        description: in-window subsidy receivable frozen at issuance; never recomputed afterwards, so post-issuance movement of the association's receivable shows up as drift
        default: 0
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the Auditor that issued the report; null before issuance
        default: null

  - name: DefectClaim
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: FK -> Association.id
      - name: component_id
        type: string
        source: input
        description: FK -> CommonAreaComponent.id; must belong to the same association_id
      - name: defect_summary
        type: string
        source: input
        description: narrative of the alleged construction defect
        constraints: 1..400 chars
      - name: repair_cost_estimate_cents
        type: integer
        source: input
        description: cost-to-repair measure of damages; subtotal under the REPAIR_COST valuation basis
        constraints: ">= 1"
      - name: diminution_value_cents
        type: integer
        source: input
        description: diminution-in-value measure of damages; subtotal under the DIMINUTION valuation basis
        constraints: ">= 1"
      - name: repose_deadline
        type: datetime
        source: computed
        description: see calculations.defect_repose_deadline; null while the component has no substantial_completion_date
        default: null
      - name: status
        type: enum
        source: system
        description: claim lifecycle including the re-investigation cycle
        default: INVESTIGATING
        constraints: "INVESTIGATING | NOTICED | REJECTED_BY_DEVELOPER | RESERVED | WITHDRAWN | SETTLED | TIME_BARRED"
      - name: negotiation_round
        type: integer
        source: computed
        description: number of completed notice-and-rejection rounds; incremented by REINVESTIGATE
        default: 0
      - name: valuation_basis
        type: enum
        source: system
        description: basis chosen by the RESERVE action; null until the claim is reserved
        default: null
        constraints: "REPAIR_COST | DIMINUTION | null"
      - name: reserve_subtotal_cents
        type: integer
        source: computed
        description: damages subtotal selected by valuation_basis; 0 until reserved
        default: 0
      - name: litigation_admin_fee_cents
        type: integer
        source: computed
        description: tiered administrative fee; see calculations.defect_claim_reserve_amount
        default: 0
      - name: reserved_amount_cents
        type: integer
        source: computed
        description: reserve_subtotal_cents + litigation_admin_fee_cents while RESERVED; released to 0 on WITHDRAW and on SETTLE
        default: 0
      - name: settlement_amount_cents
        type: integer
        source: system
        description: amount the declarant accepted; null unless status == SETTLED
        default: null

  - name: VendorContract
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: FK -> Association.id
      - name: component_id
        type: string
        source: input
        description: FK -> CommonAreaComponent.id; the component the contract services, and the resource whose service windows may not collide
      - name: vendor_name
        type: string
        source: input
        description: contracting vendor
        constraints: 1..80 chars
      - name: developer_affiliated
        type: boolean
        source: input
        description: true when the vendor is an affiliate of the declarant; only these rows acquire a post-turnover cancellation right
      - name: annual_cost_cents
        type: integer
        source: input
        description: annual contract cost carried by the operating budget
        constraints: ">= 0"
      - name: service_window_start
        type: datetime
        source: input
        description: inclusive start of the service window
      - name: service_window_end
        type: datetime
        source: input
        description: exclusive end of the service window; must be > service_window_start
      - name: assignment_status
        type: enum
        source: system
        description: declarant-to-association assignment consent posture
        default: NOT_REQUESTED
        constraints: "NOT_REQUESTED | ASSIGNMENT_REQUESTED | CONSENTED | CONSENT_REFUSED"
      - name: status
        type: enum
        source: system
        description: contract lifecycle
        default: ACTIVE
        constraints: "ACTIVE | CANCELLABLE | CANCELLED | TERMINATED_FOR_REFUSAL"
      - name: cancellation_window_end
        type: datetime
        source: system
        description: last instant a CANCELLABLE developer-affiliated contract may be cancelled; null until the turnover trigger cascade sets it
        default: null

  - name: RecordsTransferItem
    parent: null
    common_fields: true
    fields:
      - name: turnover_case_id
        type: string
        source: input
        description: FK -> TurnoverCase.id
      - name: category
        type: enum
        source: input
        description: class of record, warranty, plan or contract the declarant must hand over
        constraints: "FINANCIAL_RECORDS | WARRANTIES | PLANS_AND_SPECS | VENDOR_CONTRACTS | PERMITS"
      - name: required
        type: boolean
        source: input
        description: whether the item counts toward records_transfer_completeness_pct
        default: true
      - name: status
        type: enum
        source: system
        description: transfer posture; REJECTED items may be re-delivered, forming the review cycle
        default: OUTSTANDING
        constraints: "OUTSTANDING | DELIVERED | ACCEPTED | REJECTED"
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent DELIVER action; null while OUTSTANDING
        default: null
      - name: rejection_reason
        type: string
        source: system
        description: reason recorded by the most recent REJECT review; null otherwise
        default: null

  - name: Director
    parent: null
    common_fields: true
    fields:
      - name: turnover_case_id
        type: string
        source: input
        description: FK -> TurnoverCase.id
      - name: full_name
        type: string
        source: input
        description: name of the seated director
        constraints: 1..80 chars
      - name: seat_type
        type: enum
        source: input
        description: DECLARANT_APPOINTED seats may only be created under DECLARANT_CONTROL by the Declarant; OWNER_ELECTED seats only under ELECTION_CALLED by the ElectionInspector
        constraints: "DECLARANT_APPOINTED | OWNER_ELECTED"
      - name: status
        type: enum
        source: system
        description: seat occupancy; only SEATED rows consume a seat
        default: SEATED
        constraints: "SEATED | RESIGNED | RESCINDED"
      - name: seated_by_user_id
        type: string
        source: system
        description: X-User-ID that created the seat
      - name: vacated_at
        type: datetime
        source: system
        description: logical-clock instant the seat was vacated by resignation or rescission; null while SEATED
        default: null

  - name: AssessmentSchedule
    parent: null
    common_fields: true
    fields:
      - name: association_id
        type: string
        source: input
        description: FK -> Association.id
      - name: fiscal_year
        type: integer
        source: input
        description: calendar fiscal year the schedule funds; the year runs YYYY-01-01 through YYYY-12-31
        constraints: 2024..2035
      - name: projected_operating_cost_cents
        type: integer
        source: input
        description: re-forecast operating cost for the fiscal year, excluding reserve contribution and subsidy offset
        constraints: ">= 0"
      - name: billable_lot_count
        type: integer
        source: computed
        description: count of Lot rows of the association with sale_status IN {CLOSED, UNDER_CONTRACT}
        default: 0
      - name: reserve_contribution_cents
        type: integer
        source: computed
        description: recommended_annual_contribution_cents of the association's ADOPTED ReserveStudy
        default: 0
      - name: subsidy_offset_cents
        type: integer
        source: computed
        description: declarant subsidy still covering months of the fiscal year; see calculations.assessment_reforecast
        default: 0
      - name: annual_requirement_cents
        type: integer
        source: computed
        description: projected_operating_cost_cents + reserve_contribution_cents - subsidy_offset_cents
        default: 0
      - name: per_lot_monthly_assessment_cents
        type: integer
        source: computed
        description: per-lot monthly assessment; rounding happens here first, before the annual total is derived
        default: 0
      - name: annual_budget_total_cents
        type: integer
        source: computed
        description: per_lot_monthly_assessment_cents * billable_lot_count * 12
        default: 0
      - name: residual_cents
        type: integer
        source: computed
        description: annual_budget_total_cents - annual_requirement_cents; over-collection credited to the reserve pool on adoption
        default: 0
      - name: increase_pct_vs_prior
        type: number
        source: computed
        description: percentage change of per_lot_monthly_assessment_cents against the most recent ADOPTED schedule; 0.00 when none exists
        default: 0.00
      - name: owner_vote_required
        type: boolean
        source: computed
        description: true when increase_pct_vs_prior is strictly greater than ASSESSMENT_INCREASE_CAP_PCT
        default: false
      - name: owner_vote_ratified
        type: boolean
        source: system
        description: whether the adopting call carried a ratified owner vote
        default: false
      - name: status
        type: enum
        source: system
        description: schedule lifecycle; creating a schedule supersedes any DRAFT of the same association and adopting one supersedes the prior ADOPTED schedule
        default: DRAFT
        constraints: "DRAFT | ADOPTED | SUPERSEDED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: TurnoverCase
    shape: parallel
    parallel_dimensions:
      governance_status: "DECLARANT_CONTROL -> ELECTION_CALLED -> ELECTION_HELD -> OWNER_CONTROL, with ELECTION_HELD -> ELECTION_CALLED revert on seat loss"
      financial_status: "SUBSIDY_ACTIVE -> AUDIT_IN_PROGRESS -> SETTLED"
    initial_state: "DECLARANT_CONTROL (governance) + SUBSIDY_ACTIVE (financial)"
    terminal_states: ["OWNER_CONTROL (governance)", "SETTLED (financial)"]
    transitions:

      - from: DECLARANT_CONTROL
        to: ELECTION_CALLED
        dimension: governance_status
        trigger: "POST /hoa/turnover-cases/{id}/certify-trigger"
        actor: TransitionCommittee
        preconditions:
          - "turnover_posture != SETTLED_LOCKED else ERR_TURNOVER_SETTLED_LOCKED"
          - "governance_status == DECLARANT_CONTROL else ERR_TURNOVER_STAGE_INVALID"
          - "when trigger_basis == PERCENT_SOLD: Association.sold_lot_pct >= Association.turnover_threshold_pct (inclusive) else ERR_TURNOVER_THRESHOLD_NOT_MET"
          - "when trigger_basis == FIXED_DATE: logical clock >= Association.fixed_turnover_date (inclusive) else ERR_FIXED_TURNOVER_DATE_NOT_REACHED"
        side_effects:
          - "CASCADE-1 hop A: governance_status = ELECTION_CALLED; trigger_basis = input; trigger_certified_at = logical clock; trigger_certified_by_user_id = X-User-ID; owner_elected_seats_required = calculations.governance_seat_ledger; turnover_posture re-derived"
          - "CASCADE-1 hop B (caused by hop A entering ELECTION_CALLED): every Director of this case with seat_type == DECLARANT_APPOINTED and status == SEATED transitions SEATED -> RESIGNED with vacated_at = logical clock, processed created_at ASC; declarant_appointed_seats -> 0 and vacant_seats recomputed"
          - "CASCADE-1 hop C (caused by hop B emptying the declarant-appointed seats): every VendorContract of the association with developer_affiliated == true and status == ACTIVE transitions ACTIVE -> CANCELLABLE with cancellation_window_end = trigger_certified_at + CANCELLATION_WINDOW_DAYS, processed created_at ASC"
          - "CASCADE-1 hop D (caused by hop C creating cancellable obligations): Association.budget_forecast_status CURRENT -> STALE; Association.version += 1"
          - "CASCADE-1 hop E (caused by hop D staling the forecast): every AssessmentSchedule of the association with status == DRAFT transitions DRAFT -> SUPERSEDED, processed created_at ASC"
        note: "Depth-5 transitive cascade; each hop is caused by the preceding hop, not by the original request."

      - from: ELECTION_CALLED
        to: ELECTION_HELD
        dimension: governance_status
        trigger: "system, evaluated at the end of POST /hoa/directors when the new seat makes owner_elected_seats == owner_elected_seats_required"
        actor: system
        preconditions:
          - "governance_status == ELECTION_CALLED"
          - "owner_elected_seats == owner_elected_seats_required (bubble-up from Director seating)"
        side_effects:
          - "governance_status = ELECTION_HELD; turnover_posture re-derived"

      - from: ELECTION_HELD
        to: ELECTION_CALLED
        dimension: governance_status
        trigger: "system, evaluated at the end of POST /hoa/directors/{id}/rescind when owner_elected_seats drops below owner_elected_seats_required"
        actor: system
        preconditions:
          - "governance_status == ELECTION_HELD"
          - "owner_elected_seats < owner_elected_seats_required after the rescission"
        side_effects:
          - "governance_status = ELECTION_CALLED; turnover_posture re-derived"
        note: "Revert edge that makes the governance dimension cyclic."

      - from: ELECTION_HELD
        to: OWNER_CONTROL
        dimension: governance_status
        trigger: "POST /hoa/turnover-cases/{id}/advance with dimension == GOVERNANCE"
        actor: TransitionCommittee
        preconditions:
          - "turnover_posture != SETTLED_LOCKED else ERR_TURNOVER_SETTLED_LOCKED"
          - "governance_status == ELECTION_HELD else ERR_TURNOVER_STAGE_INVALID"
          - "records_transfer_completeness_pct >= 80.00 (inclusive) else ERR_RECORDS_INCOMPLETE"
          - "no CommonAreaComponent of the association has category == AMENITY and build_status IN {UNBUILT, IN_PROGRESS} and promised_completion_date < logical clock, else ERR_UNBUILT_AMENITY_OUTSTANDING"
        side_effects:
          - "governance_status = OWNER_CONTROL; turnover_posture re-derived"

      - from: SUBSIDY_ACTIVE
        to: AUDIT_IN_PROGRESS
        dimension: financial_status
        trigger: "POST /hoa/turnover-cases/{id}/advance with dimension == FINANCIAL"
        actor: TransitionCommittee
        preconditions:
          - "turnover_posture != SETTLED_LOCKED else ERR_TURNOVER_SETTLED_LOCKED"
          - "financial_status == SUBSIDY_ACTIVE else ERR_TURNOVER_STAGE_INVALID"
          - "payload carries subsidy_end_date else ERR_INVALID_REQUEST"
          - "at least one AuditEngagement of the association has status IN {ENGAGED, ISSUED} else ERR_TRANSITION_AUDIT_MISSING"
        side_effects:
          - "financial_status = AUDIT_IN_PROGRESS; Association.subsidy_end_date = payload subsidy_end_date; Association.budget_forecast_status = STALE; Association.version += 1"
          - "CASCADE hop (caused by the forecast going stale): every AssessmentSchedule of the association with status == DRAFT transitions DRAFT -> SUPERSEDED, processed created_at ASC"
          - "turnover_posture re-derived"
        note: "Ending the subsidy is the same event as opening the audit window; the two are one transition so the subsidy end date can never drift from the financial dimension."

      - from: AUDIT_IN_PROGRESS
        to: SETTLED
        dimension: financial_status
        trigger: "POST /hoa/turnover-cases/{id}/advance with dimension == FINANCIAL"
        actor: TransitionCommittee
        preconditions:
          - "financial_status == AUDIT_IN_PROGRESS else ERR_TURNOVER_STAGE_INVALID"
          - "governance_status == OWNER_CONTROL else ERR_TURNOVER_STAGE_INVALID"
          - "settlement_blocked == false else ERR_SETTLEMENT_BLOCKED"
          - "at least one AuditEngagement of the association has status == ISSUED and finding_status == CLEAN else ERR_SETTLEMENT_BLOCKED"
          - "records_transfer_completeness_pct == 100.00 else ERR_RECORDS_INCOMPLETE"
          - "no DefectClaim of the association has status IN {INVESTIGATING, NOTICED, REJECTED_BY_DEVELOPER} else ERR_CLAIM_STATE_INVALID"
          - "no VendorContract of the association has developer_affiliated == true and status == CANCELLABLE else ERR_ASSIGNMENT_CONSENT_REQUIRED"
          - "no CommonAreaComponent of the association has category == AMENITY and build_status IN {UNBUILT, IN_PROGRESS} and promised_completion_date < logical clock, else ERR_UNBUILT_AMENITY_OUTSTANDING"
        side_effects:
          - "financial_status = SETTLED; turnover_posture re-derived to SETTLED_LOCKED (governance_status is already OWNER_CONTROL), which rejects every association-scoped mutation with ERR_TURNOVER_SETTLED_LOCKED"

  - entity: Lot
    shape: linear
    initial_state: "sale_status as supplied at creation (UNSOLD default, UNDER_CONTRACT permitted)"
    terminal_states: [CLOSED]
    transitions:
      - from: UNSOLD
        to: CLOSED
        trigger: "POST /hoa/lots/{id}/close-sale"
        actor: Declarant
        preconditions:
          - "turnover_posture != SETTLED_LOCKED (when a TurnoverCase exists) else ERR_TURNOVER_SETTLED_LOCKED"
          - "sale_status IN {UNSOLD, UNDER_CONTRACT} else ERR_LOT_STATE_INVALID"
        side_effects:
          - "closing_date = payload closing_date; Association.sold_lot_count += 1; Association.sold_lot_pct = calculations.sold_lot_percentage; Association.version += 1"
      - from: UNDER_CONTRACT
        to: CLOSED
        trigger: "POST /hoa/lots/{id}/close-sale"
        actor: Declarant
        preconditions:
          - "same as the UNSOLD -> CLOSED edge"
        side_effects:
          - "identical to the UNSOLD -> CLOSED edge; the lot stays billable under assessment_reforecast either way"

  - entity: CommonAreaComponent
    shape: linear
    initial_state: "build_status as supplied at creation + conveyance_status NOT_CONVEYED"
    terminal_states: [CONVEYED]
    transitions:
      - from: UNBUILT
        to: COMPLETE
        dimension: build_status
        trigger: "POST /hoa/components/{id}/milestones with milestone == BUILD_COMPLETE"
        actor: Declarant
        preconditions:
          - "acting role is Declarant for milestone BUILD_COMPLETE else ERR_ROLE_NOT_PERMITTED"
          - "build_status IN {UNBUILT, IN_PROGRESS} else ERR_COMPONENT_MILESTONE_INVALID"
          - "payload carries effective_date else ERR_INVALID_REQUEST"
        side_effects:
          - "build_status = COMPLETE; substantial_completion_date = payload effective_date"
          - "CASCADE hop (caused by substantial_completion_date being set): every DefectClaim of this component recomputes repose_deadline per calculations.defect_repose_deadline, processed created_at ASC"
      - from: IN_PROGRESS
        to: COMPLETE
        dimension: build_status
        trigger: "POST /hoa/components/{id}/milestones with milestone == BUILD_COMPLETE"
        actor: Declarant
        preconditions:
          - "same as the UNBUILT -> COMPLETE edge"
        side_effects:
          - "same as the UNBUILT -> COMPLETE edge"
      - from: NOT_CONVEYED
        to: DEED_TENDERED
        dimension: conveyance_status
        trigger: "POST /hoa/components/{id}/milestones with milestone == DEED_TENDERED"
        actor: Declarant
        preconditions:
          - "acting role is Declarant for milestone DEED_TENDERED else ERR_ROLE_NOT_PERMITTED"
          - "conveyance_status == NOT_CONVEYED else ERR_COMPONENT_MILESTONE_INVALID"
          - "build_status == COMPLETE else ERR_COMPONENT_MILESTONE_INVALID"
        side_effects:
          - "conveyance_status = DEED_TENDERED"
      - from: DEED_TENDERED
        to: CONVEYED
        dimension: conveyance_status
        trigger: "POST /hoa/components/{id}/milestones with milestone == CONVEYANCE_ACCEPTED"
        actor: TransitionCommittee
        preconditions:
          - "acting role is TransitionCommittee for milestone CONVEYANCE_ACCEPTED else ERR_ROLE_NOT_PERMITTED"
          - "conveyance_status == DEED_TENDERED else ERR_COMPONENT_MILESTONE_INVALID"
          - "turnover_posture != SETTLED_LOCKED (when a TurnoverCase exists) else ERR_TURNOVER_SETTLED_LOCKED"
        side_effects:
          - "conveyance_status = CONVEYED; conveyed_at = logical clock"
          - "CASCADE hop (caused by the conveyed component set changing): every ReserveStudy of the association with status == DRAFT resets evaluated_method = null, adequacy_verdict = UNDETERMINED, recommended_annual_contribution_cents = 0, so the study must be re-evaluated before it can be adopted"

  - entity: DefectClaim
    shape: cyclic
    initial_state: INVESTIGATING
    terminal_states: [WITHDRAWN, SETTLED, TIME_BARRED]
    transitions:
      - from: INVESTIGATING
        to: NOTICED
        trigger: "POST /hoa/defect-claims/{id}/actions with action == NOTICE"
        actor: TransitionCommittee
        preconditions:
          - "turnover_posture != SETTLED_LOCKED else ERR_TURNOVER_SETTLED_LOCKED"
          - "status == INVESTIGATING else ERR_CLAIM_STATE_INVALID"
          - "the component referenced by component_id has conveyance_status == CONVEYED else ERR_COMPONENT_NOT_CONVEYED"
          - "repose_deadline is not null and logical clock <= repose_deadline (inclusive) else ERR_REPOSE_PERIOD_EXPIRED"
        side_effects:
          - "status = NOTICED"
      - from: NOTICED
        to: REJECTED_BY_DEVELOPER
        trigger: "POST /hoa/defect-claims/{id}/actions with action == REJECT"
        actor: Declarant
        preconditions:
          - "status == NOTICED else ERR_CLAIM_STATE_INVALID"
        side_effects:
          - "status = REJECTED_BY_DEVELOPER"
      - from: REJECTED_BY_DEVELOPER
        to: INVESTIGATING
        trigger: "POST /hoa/defect-claims/{id}/actions with action == REINVESTIGATE"
        actor: TransitionCommittee
        preconditions:
          - "status == REJECTED_BY_DEVELOPER else ERR_CLAIM_STATE_INVALID"
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS else ERR_NEGOTIATION_ROUNDS_EXHAUSTED"
        side_effects:
          - "status = INVESTIGATING; negotiation_round += 1"
        note: "Closes the negotiation cycle INVESTIGATING -> NOTICED -> REJECTED_BY_DEVELOPER -> INVESTIGATING."
      - from: NOTICED
        to: RESERVED
        trigger: "POST /hoa/defect-claims/{id}/actions with action == RESERVE"
        actor: TransitionCommittee
        preconditions:
          - "status IN {NOTICED, REJECTED_BY_DEVELOPER} else ERR_CLAIM_STATE_INVALID"
          - "payload carries valuation_basis else ERR_INVALID_REQUEST"
          - "calculations.defect_claim_reserve_amount total <= Association.reserve_claim_available_cents (inclusive) else ERR_CLAIM_RESERVE_INSUFFICIENT"
        side_effects:
          - "status = RESERVED; valuation_basis, reserve_subtotal_cents, litigation_admin_fee_cents, reserved_amount_cents set per calculations.defect_claim_reserve_amount"
          - "Association.reserve_claim_committed_cents += reserved_amount_cents; Association.reserve_claim_available_cents recomputed; Association.version += 1"
      - from: REJECTED_BY_DEVELOPER
        to: RESERVED
        trigger: "POST /hoa/defect-claims/{id}/actions with action == RESERVE"
        actor: TransitionCommittee
        preconditions:
          - "same as the NOTICED -> RESERVED edge"
        side_effects:
          - "same as the NOTICED -> RESERVED edge"
      - from: NOTICED
        to: SETTLED
        trigger: "POST /hoa/defect-claims/{id}/actions with action == ACCEPT"
        actor: Declarant
        preconditions:
          - "status IN {NOTICED, RESERVED} else ERR_CLAIM_STATE_INVALID"
          - "payload carries settlement_amount_cents else ERR_INVALID_REQUEST"
        side_effects:
          - "status = SETTLED; settlement_amount_cents = payload value"
      - from: RESERVED
        to: SETTLED
        trigger: "POST /hoa/defect-claims/{id}/actions with action == ACCEPT"
        actor: Declarant
        preconditions:
          - "same as the NOTICED -> SETTLED edge"
        side_effects:
          - "status = SETTLED; settlement_amount_cents = payload value"
          - "Association.reserve_claim_committed_cents -= reserved_amount_cents; reserved_amount_cents = 0; Association.reserve_claim_available_cents recomputed; Association.version += 1"
      - from: RESERVED
        to: WITHDRAWN
        trigger: "POST /hoa/defect-claims/{id}/actions with action == WITHDRAW"
        actor: TransitionCommittee
        preconditions:
          - "status IN {INVESTIGATING, NOTICED, REJECTED_BY_DEVELOPER, RESERVED} else ERR_CLAIM_STATE_INVALID"
        side_effects:
          - "status = WITHDRAWN"
          - "compensating release: Association.reserve_claim_committed_cents -= reserved_amount_cents; reserved_amount_cents = 0; Association.reserve_claim_available_cents recomputed; Association.version += 1"
      - from: INVESTIGATING
        to: WITHDRAWN
        trigger: "POST /hoa/defect-claims/{id}/actions with action == WITHDRAW"
        actor: TransitionCommittee
        preconditions:
          - "same as the RESERVED -> WITHDRAWN edge"
        side_effects:
          - "status = WITHDRAWN; no fiscal release because reserved_amount_cents is already 0"
      - from: INVESTIGATING
        to: TIME_BARRED
        trigger: "POST /hoa/associations/{id}/repose-sweep"
        actor: TransitionCommittee
        preconditions:
          - "status == INVESTIGATING"
          - "repose_deadline is not null and logical clock > repose_deadline (strict)"
        side_effects:
          - "status = TIME_BARRED; swept claims are processed created_at ASC and reported in the sweep response"

  - entity: VendorContract
    shape: branching
    initial_state: "status ACTIVE + assignment_status NOT_REQUESTED"
    terminal_states: [CANCELLED, TERMINATED_FOR_REFUSAL]
    transitions:
      - from: NOT_REQUESTED
        to: ASSIGNMENT_REQUESTED
        dimension: assignment_status
        trigger: "POST /hoa/vendor-contracts/{id}/actions with action == REQUEST_ASSIGNMENT"
        actor: Declarant
        preconditions:
          - "assignment_status == NOT_REQUESTED else ERR_CONTRACT_STATE_INVALID"
          - "status IN {ACTIVE, CANCELLABLE} else ERR_CONTRACT_STATE_INVALID"
        side_effects:
          - "assignment_status = ASSIGNMENT_REQUESTED"
      - from: ASSIGNMENT_REQUESTED
        to: CONSENTED
        dimension: assignment_status
        trigger: "POST /hoa/vendor-contracts/{id}/actions with action == CONSENT"
        actor: TransitionCommittee
        preconditions:
          - "assignment_status == ASSIGNMENT_REQUESTED else ERR_CONTRACT_STATE_INVALID"
        side_effects:
          - "assignment_status = CONSENTED; status unchanged"
          - "CASCADE hop (caused by consent completing the contract handover): every RecordsTransferItem of the association's TurnoverCase with category == VENDOR_CONTRACTS and status == DELIVERED transitions DELIVERED -> ACCEPTED, processed created_at ASC"
          - "CASCADE hop (caused by those items being accepted): TurnoverCase.records_transfer_completeness_pct recomputed per calculations.records_transfer_completeness"
        note: "CONSENT branch of the fork; side-effect set is disjoint from the REFUSE_CONSENT branch."
      - from: ASSIGNMENT_REQUESTED
        to: CONSENT_REFUSED
        dimension: assignment_status
        trigger: "POST /hoa/vendor-contracts/{id}/actions with action == REFUSE_CONSENT"
        actor: TransitionCommittee
        preconditions:
          - "assignment_status == ASSIGNMENT_REQUESTED else ERR_CONTRACT_STATE_INVALID"
        side_effects:
          - "assignment_status = CONSENT_REFUSED; status -> TERMINATED_FOR_REFUSAL"
          - "Association.budget_forecast_status = STALE; Association.version += 1 (the refused service must be re-procured)"
        note: "REFUSE branch of the fork; terminates the contract instead of touching records items."
      - from: ACTIVE
        to: CANCELLABLE
        dimension: status
        trigger: "system, CASCADE-1 hop C of POST /hoa/turnover-cases/{id}/certify-trigger"
        actor: system
        preconditions:
          - "developer_affiliated == true and status == ACTIVE"
        side_effects:
          - "status = CANCELLABLE; cancellation_window_end = TurnoverCase.trigger_certified_at + CANCELLATION_WINDOW_DAYS"
      - from: CANCELLABLE
        to: CANCELLED
        dimension: status
        trigger: "POST /hoa/vendor-contracts/{id}/actions with action == CANCEL"
        actor: TransitionCommittee
        preconditions:
          - "status == CANCELLABLE else ERR_CONTRACT_STATE_INVALID"
          - "logical clock <= cancellation_window_end (inclusive) else ERR_CANCELLATION_WINDOW_CLOSED"
        side_effects:
          - "status = CANCELLED"
          - "Association.budget_forecast_status = STALE; Association.version += 1"
          - "CASCADE hop (caused by the forecast going stale): every AssessmentSchedule of the association with status == DRAFT transitions DRAFT -> SUPERSEDED, processed created_at ASC"

  - entity: RecordsTransferItem
    shape: cyclic
    initial_state: OUTSTANDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: OUTSTANDING
        to: DELIVERED
        trigger: "POST /hoa/records-items/{id}/transitions with action == DELIVER"
        actor: Declarant
        preconditions:
          - "status IN {OUTSTANDING, REJECTED} else ERR_RECORDS_ITEM_STATE_INVALID"
        side_effects:
          - "status = DELIVERED; delivered_at = logical clock; rejection_reason = null"
      - from: REJECTED
        to: DELIVERED
        trigger: "POST /hoa/records-items/{id}/transitions with action == DELIVER"
        actor: Declarant
        preconditions:
          - "same as the OUTSTANDING -> DELIVERED edge"
        side_effects:
          - "same as the OUTSTANDING -> DELIVERED edge"
        note: "Closes the review cycle DELIVERED -> REJECTED -> DELIVERED."
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /hoa/records-items/{id}/transitions with action == ACCEPT"
        actor: TransitionCommittee
        preconditions:
          - "status == DELIVERED else ERR_RECORDS_ITEM_STATE_INVALID"
        side_effects:
          - "status = ACCEPTED; TurnoverCase.records_transfer_completeness_pct recomputed per calculations.records_transfer_completeness"
      - from: DELIVERED
        to: REJECTED
        trigger: "POST /hoa/records-items/{id}/transitions with action == REJECT"
        actor: TransitionCommittee
        preconditions:
          - "status == DELIVERED else ERR_RECORDS_ITEM_STATE_INVALID"
          - "payload carries rejection_reason else ERR_INVALID_REQUEST"
        side_effects:
          - "status = REJECTED; rejection_reason = payload value; TurnoverCase.records_transfer_completeness_pct recomputed"

  - entity: AuditEngagement
    shape: linear
    initial_state: ENGAGED
    terminal_states: [ISSUED]
    transitions:
      - from: ENGAGED
        to: ISSUED
        trigger: "POST /hoa/audit-engagements/{id}/issue"
        actor: Auditor
        preconditions:
          - "status == ENGAGED else ERR_AUDIT_NOT_ISSUABLE"
          - "X-User-ID does not equal posted_by_user_id of any SubsidyEntry of the association with status == POSTED whose period_month falls inside the engagement window, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status = ISSUED; issued_by_user_id = X-User-ID; unreconciled_delta_cents = calculations.audit_unreconciled_delta; finding_status = CLEAN when the delta is 0 else EXCEPTION_NOTED"

  - entity: ReserveStudy
    shape: linear
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "POST /hoa/reserve-studies/{id}/actions with action == RECOMPUTE"
        actor: TransitionCommittee
        preconditions:
          - "status == DRAFT else ERR_NOT_IN_DRAFT"
          - "payload carries method else ERR_INVALID_REQUEST"
        side_effects:
          - "evaluated_method = payload method; component_count, fully_funded_balance_cents, percent_funded, min_projected_balance_cents, adequacy_verdict, recommended_annual_contribution_cents all recomputed per calculations.reserve_funding_adequacy"
        note: "Self-transition; the evaluation is repeatable and each run overwrites the previous verdict."
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /hoa/reserve-studies/{id}/actions with action == ADOPT"
        actor: TransitionCommittee
        preconditions:
          - "status == DRAFT else ERR_NOT_IN_DRAFT"
          - "evaluated_method is not null and adequacy_verdict != UNDETERMINED else ERR_ADEQUACY_NOT_EVALUATED"
        side_effects:
          - "status = ADOPTED"
          - "CASCADE hop (caused by this study becoming ADOPTED): the association's previously ADOPTED ReserveStudy transitions ADOPTED -> SUPERSEDED"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, on POST /hoa/reserve-studies creating a newer study for the same association"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "status = SUPERSEDED"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system, on the ADOPT of a newer study for the same association"
        actor: system
        preconditions:
          - "status == ADOPTED"
        side_effects:
          - "status = SUPERSEDED; assessment_reforecast will read the newly adopted study's recommendation from now on"

  - entity: AssessmentSchedule
    shape: linear
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /hoa/assessment-schedules/{id}/adopt"
        actor: TransitionCommittee
        preconditions:
          - "turnover_posture != SETTLED_LOCKED else ERR_TURNOVER_SETTLED_LOCKED"
          - "status == DRAFT else ERR_NOT_IN_DRAFT"
          - "when owner_vote_required == true: payload owner_vote_ratified == true else ERR_OWNER_VOTE_REQUIRED"
        side_effects:
          - "status = ADOPTED; owner_vote_ratified = payload value (false when omitted)"
          - "CASCADE hop (caused by this schedule becoming ADOPTED): the association's previously ADOPTED AssessmentSchedule transitions ADOPTED -> SUPERSEDED"
          - "Association.reserve_pool_cents += residual_cents; Association.budget_forecast_status = STALE -> CURRENT; Association.version += 1. No ReserveStudy is re-evaluated by this change; percent_funded only moves on an explicit RECOMPUTE."
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, on POST /hoa/assessment-schedules creating a newer schedule for the same association, and on any transition that sets Association.budget_forecast_status = STALE"
        actor: system
        preconditions:
          - "status == DRAFT"
        side_effects:
          - "status = SUPERSEDED"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system, on the adoption of a newer schedule for the same association"
        actor: system
        preconditions:
          - "status == ADOPTED"
        side_effects:
          - "status = SUPERSEDED; it remains the increase_pct_vs_prior baseline only until a newer ADOPTED schedule exists"

  - entity: Director
    shape: branching
    initial_state: SEATED
    terminal_states: [RESIGNED, RESCINDED]
    transitions:
      - from: SEATED
        to: RESIGNED
        trigger: "system, CASCADE-1 hop B of POST /hoa/turnover-cases/{id}/certify-trigger"
        actor: system
        preconditions:
          - "seat_type == DECLARANT_APPOINTED and status == SEATED"
        side_effects:
          - "status = RESIGNED; vacated_at = logical clock; TurnoverCase.declarant_appointed_seats and vacant_seats recomputed per calculations.governance_seat_ledger"
      - from: SEATED
        to: RESCINDED
        trigger: "POST /hoa/directors/{id}/rescind"
        actor: ElectionInspector
        preconditions:
          - "status == SEATED else ERR_DIRECTOR_STATE_INVALID"
          - "seat_type == OWNER_ELECTED else ERR_DIRECTOR_STATE_INVALID"
        side_effects:
          - "status = RESCINDED; vacated_at = logical clock; TurnoverCase.owner_elected_seats -= 1 and vacant_seats += 1, keeping total_seats == SEATED count + vacant_seats"
          - "CASCADE hop (caused by owner_elected_seats dropping below owner_elected_seats_required): TurnoverCase.governance_status ELECTION_HELD -> ELECTION_CALLED"

  - entity: SubsidyEntry
    shape: linear
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /hoa/subsidy-entries/{id}/reverse"
        actor: Declarant
        preconditions:
          - "status == POSTED else ERR_SUBSIDY_ENTRY_ALREADY_REVERSED"
          - "direction IN {ACCRUAL, PAYMENT} else ERR_SUBSIDY_ENTRY_ALREADY_REVERSED"
          - "reverses_entry_id is null (a REVERSAL mirror is never itself reversible) else ERR_SUBSIDY_ENTRY_ALREADY_REVERSED"
        side_effects:
          - "CASCADE-2 hop A: status = REVERSED, and a system SubsidyEntry is created with direction = REVERSAL, the same amount_cents and period_month, status = POSTED, posted_by_user_id = X-User-ID and reverses_entry_id = the target id"
          - "CASCADE-2 hop B (caused by the target leaving POSTED): Association.subsidy_receivable_cents recomputed per calculations.subsidy_receivable_balance; Association.version += 1"
          - "CASCADE-2 hop C (caused by the receivable moving): every ISSUED AuditEngagement of the association recomputes unreconciled_delta_cents against its frozen audited_receivable_snapshot_cents and flips finding_status to EXCEPTION_NOTED when the delta is non-zero"
          - "CASCADE-2 hop D (caused by an engagement becoming EXCEPTION_NOTED): TurnoverCase.settlement_blocked = true"
        note: "The mirror row carries direction REVERSAL and is excluded from calculations.subsidy_receivable_balance's input set, so it documents the undo without double-counting it."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assessment-schedule-create-stale-association
    parent_entity: Association
    write_endpoint: "POST /hoa/assessment-schedules"
    occ_field: "expected_association_version"
    description: |
      Creating an AssessmentSchedule against an Association whose version has
      advanced past the value the client last observed is rejected. A new
      schedule legitimately supersedes the association's prior DRAFT schedule
      (§1.2 AssessmentSchedule DRAFT -> SUPERSEDED), so a second create is a
      valid product operation rather than an invalid-state request; the stale
      version check is therefore the only thing that tells the client its view
      of the reserve recommendation, subsidy end date, billable lot set and
      forecast status is out of date before it silently supersedes work built
      on newer data.
    error_id: ERR_STALE_ASSOCIATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: sold_lot_percentage
    trigger: "side effect of POST /hoa/lots/{id}/close-sale (Lot UNSOLD|UNDER_CONTRACT -> CLOSED); writes Association.sold_lot_count and Association.sold_lot_pct"
    algorithm: threshold
    formula: |
      sold_lot_count = count(Lot WHERE association_id == A.id AND sale_status == CLOSED)
      sold_lot_pct   = round_half_up(100 * sold_lot_count / A.total_planned_lots, 2)
      # The PERCENT_SOLD turnover trigger compares the ROUNDED value:
      #   certifiable  iff  sold_lot_pct >= A.turnover_threshold_pct   (inclusive)
      # Truncating instead of rounding half up changes the verdict whenever the
      # exact quotient sits just below the threshold (2/3 -> 66.666… -> 66.67).
    input_set: "Lot rows of this association with sale_status == CLOSED only; UNSOLD and UNDER_CONTRACT rows are excluded from the numerator but still counted in total_planned_lots via the declaration, not via the Lot table"
    constants:
      PERCENT_SCALE: 100
    precision: "2 decimal places, round_half_up; comparison against turnover_threshold_pct is inclusive (>=)"

  - name: reserve_funding_adequacy
    trigger: "POST /hoa/reserve-studies/{id}/actions with action == RECOMPUTE; writes ReserveStudy.evaluated_method, component_count, fully_funded_balance_cents, percent_funded, min_projected_balance_cents, adequacy_verdict, recommended_annual_contribution_cents"
    algorithm: dual_variant_threshold
    formula: |
      # ---- shared, method-independent ----
      funded_components = CommonAreaComponent WHERE association_id == S.association_id
                          AND build_status == COMPLETE AND conveyance_status == CONVEYED
      component_count = count(funded_components)
      fully_funded_balance_cents =
          sum over funded_components of
             floor(replacement_cost_cents * min(effective_age_years, useful_life_years) / useful_life_years)
      percent_funded = 0.00 if fully_funded_balance_cents == 0
                       else round_half_up(100 * A.reserve_pool_cents / fully_funded_balance_cents, 2)

      # ---- variant COMPONENT_FULL_FUNDING ----
      if fully_funded_balance_cents == 0:
          adequacy_verdict = UNDETERMINED
          recommended_annual_contribution_cents = 0
          min_projected_balance_cents = 0
      else:
          adequacy_verdict = ADEQUATE  if percent_funded >= PERCENT_FUNDED_ADEQUATE_PCT
                             MARGINAL  if percent_funded >= PERCENT_FUNDED_MARGINAL_PCT
                             DEFICIENT otherwise
          recommended_annual_contribution_cents =
              max(0, ceil((fully_funded_balance_cents - A.reserve_pool_cents) / FFB_RECOVERY_YEARS))
          min_projected_balance_cents = 0

      # ---- variant CASH_FLOW ----
      balance[0] = A.reserve_pool_cents
      for y in 1..CASH_FLOW_PROJECTION_YEARS:
          expenditure[y] = floor(S.projected_annual_expenditure_cents
                                 * (100 + CASH_FLOW_ESCALATION_PCT_PER_YEAR * y) / 100)
          balance[y] = balance[y-1] + S.planned_annual_contribution_cents - expenditure[y]
      min_projected_balance_cents = min(balance[0..CASH_FLOW_PROJECTION_YEARS])   # year 0 participates
      adequacy_verdict = ADEQUATE  if min_projected_balance_cents >= 0
                         MARGINAL  if min_projected_balance_cents >= -CASH_FLOW_MARGINAL_FLOOR_CENTS
                         DEFICIENT otherwise
      recommended_annual_contribution_cents = S.planned_annual_contribution_cents
              + ceil(max(0, -min_projected_balance_cents) / CASH_FLOW_PROJECTION_YEARS)
      # CASH_FLOW never yields UNDETERMINED: the year-walk is well defined even with
      # zero funded components, so identical data can be ADEQUATE under CASH_FLOW and
      # UNDETERMINED under COMPONENT_FULL_FUNDING.
    input_set: "components filtered to build_status == COMPLETE AND conveyance_status == CONVEYED; a COMPLETE but NOT_CONVEYED component contributes nothing to the fully funded balance"
    constants:
      FFB_RECOVERY_YEARS: 10
      CASH_FLOW_PROJECTION_YEARS: 5
      CASH_FLOW_ESCALATION_PCT_PER_YEAR: 3
      PERCENT_FUNDED_ADEQUATE_PCT: 70.00
      PERCENT_FUNDED_MARGINAL_PCT: 30.00
      CASH_FLOW_MARGINAL_FLOOR_CENTS: 500000
    precision: "percent_funded 2 decimals round_half_up; every cents value floor()ed per line as written, verdict comparisons inclusive at the lower bound"
    variants:
      - name: component_full_funding
        when: "RECOMPUTE called with method == COMPONENT_FULL_FUNDING"
        difference: "verdict is driven by percent_funded against the 70.00 / 30.00 breakpoints and the recommendation amortises the funding gap over FFB_RECOVERY_YEARS; an empty funded-component set forces UNDETERMINED"
      - name: cash_flow
        when: "RECOMPUTE called with method == CASH_FLOW"
        difference: "verdict is driven by the minimum of a 5-year escalating year-walk and the recommendation tops up the planned contribution by the shortfall spread over the horizon; the funded-component set is irrelevant to the verdict"

  - name: subsidy_receivable_balance
    trigger: "side effect of POST /hoa/subsidy-entries and POST /hoa/subsidy-entries/{id}/reverse; writes Association.subsidy_receivable_cents"
    algorithm: aggregation
    formula: |
      subsidy_receivable_cents =
          sum(SubsidyEntry.amount_cents WHERE association_id == A.id AND status == POSTED AND direction == ACCRUAL)
        - sum(SubsidyEntry.amount_cents WHERE association_id == A.id AND status == POSTED AND direction == PAYMENT)
      # REVERSAL mirrors never enter the sum: they exist only so the ledger shows the
      # undo. The conservation invariant the pair (post, reverse) must preserve is
      #   sum(amount_cents WHERE direction == REVERSAL)
      #     == sum(amount_cents WHERE status == REVERSED)
      # and reversing entry E must return subsidy_receivable_cents to exactly the value
      # it held immediately before E was posted.
    input_set: "SubsidyEntry rows of the association with status == POSTED and direction IN {ACCRUAL, PAYMENT}; REVERSED rows and REVERSAL mirrors are excluded; no time window — the balance is life-to-date"
    constants: {}
    precision: "integer cents; the balance may be negative when payments exceed accruals"

  - name: audit_unreconciled_delta
    trigger: "POST /hoa/audit-engagements/{id}/issue freezes audited_receivable_snapshot_cents and computes unreconciled_delta_cents; the delta (and finding_status) are recomputed on every later change to Association.subsidy_receivable_cents"
    algorithm: projection
    formula: |
      # frozen once, at issuance:
      audited_receivable_snapshot_cents =
          sum(SubsidyEntry.amount_cents WHERE association_id == E.association_id
              AND status == POSTED AND direction == ACCRUAL AND in_window(period_month))
        - sum(SubsidyEntry.amount_cents WHERE association_id == E.association_id
              AND status == POSTED AND direction == PAYMENT AND in_window(period_month))
      where in_window(m) is  month_of(E.period_start) <= m <= month_of(E.period_end)
            compared as YYYY-MM strings, both bounds inclusive

      # recomputed at issuance and after every receivable movement:
      unreconciled_delta_cents = A.subsidy_receivable_cents - E.audited_receivable_snapshot_cents
      finding_status = CLEAN if unreconciled_delta_cents == 0 else EXCEPTION_NOTED
    input_set: "snapshot: POSTED entries whose period_month lies in the closed YYYY-MM window at the instant of issuance. Drift term: the association's life-to-date receivable at read time. Entries posted outside the window, and every post-issuance reversal, therefore surface as a non-zero delta."
    constants: {}
    precision: "integer cents; equality with 0 is exact, no tolerance band"

  - name: defect_claim_reserve_amount
    trigger: "POST /hoa/defect-claims/{id}/actions with action == RESERVE; writes DefectClaim.valuation_basis, reserve_subtotal_cents, litigation_admin_fee_cents, reserved_amount_cents and moves Association.reserve_claim_committed_cents / reserve_claim_available_cents"
    algorithm: tiered_pricing
    formula: |
      reserve_subtotal_cents = repair_cost_estimate_cents  if valuation_basis == REPAIR_COST
                               diminution_value_cents      if valuation_basis == DIMINUTION

      # The fee schedule is captioned "rate by total claim exposure", but the rate is
      # selected from reserve_subtotal_cents ALONE. Evaluation order is pinned:
      #   (1) subtotal  (2) tier from subtotal  (3) fee  (4) total = subtotal + fee
      # Re-selecting the tier from the total (or iterating to a fixed point) is wrong:
      # subtotal 1_950_000 yields 2_184_000 under the pinned order and 2_125_500 under
      # total-keyed selection.
      tier_rate = CLAIM_FEE_TIER_1_RATE if reserve_subtotal_cents <  CLAIM_FEE_TIER_1_CEILING_CENTS
                  CLAIM_FEE_TIER_2_RATE if reserve_subtotal_cents <  CLAIM_FEE_TIER_2_CEILING_CENTS
                  CLAIM_FEE_TIER_3_RATE otherwise
      litigation_admin_fee_cents = round_half_up(reserve_subtotal_cents * tier_rate, 0)
      reserved_amount_cents      = reserve_subtotal_cents + litigation_admin_fee_cents

      # fiscal gate (validation priority 15):
      #   reserved_amount_cents <= A.reserve_claim_available_cents   (inclusive)
      # on success:
      #   A.reserve_claim_committed_cents += reserved_amount_cents
      #   A.reserve_claim_available_cents  = A.reserve_claim_pool_cents - A.reserve_claim_committed_cents
      # WITHDRAW and ACCEPT from RESERVED release exactly reserved_amount_cents, so
      #   reserve_claim_committed_cents + reserve_claim_available_cents == reserve_claim_pool_cents
      # holds after every forward/compensating pair.
    input_set: "the single claim being reserved; the fiscal gate reads the association's live reserve_claim_available_cents, which already excludes every other RESERVED claim of the same association"
    constants:
      CLAIM_FEE_TIER_1_CEILING_CENTS: 2000000
      CLAIM_FEE_TIER_2_CEILING_CENTS: 10000000
      CLAIM_FEE_TIER_1_RATE: 0.12
      CLAIM_FEE_TIER_2_RATE: 0.09
      CLAIM_FEE_TIER_3_RATE: 0.06
    precision: "fee rounded to whole cents with round_half_up before it is added to the subtotal; tier bounds are lower-inclusive / upper-exclusive"
    variants:
      - name: repair_cost_basis
        when: "RESERVE called with valuation_basis == REPAIR_COST"
        difference: "subtotal is the cost-to-repair estimate, which can select a different (higher) fee tier rate than the diminution measure of the same claim"
      - name: diminution_basis
        when: "RESERVE called with valuation_basis == DIMINUTION"
        difference: "subtotal is the diminution-in-value measure; for the same claim row the reserved total and the committed pool movement differ from the repair-cost basis"

  - name: records_transfer_completeness
    trigger: "side effect of POST /hoa/records-items, POST /hoa/records-items/{id}/transitions (ACCEPT and REJECT edges) and of the VendorContract CONSENT cascade; writes TurnoverCase.records_transfer_completeness_pct"
    algorithm: aggregation
    formula: |
      required_items = RecordsTransferItem WHERE turnover_case_id == TC.id AND required == true
      records_transfer_completeness_pct =
          100.00 if count(required_items) == 0            # vacuously complete
          else round_half_up(100 * count(required_items WHERE status == ACCEPTED)
                             / count(required_items), 2)
      # Gates: governance transfer needs >= GOVERNANCE_RECORDS_THRESHOLD_PCT (inclusive);
      # financial settlement needs exactly 100.00.
    input_set: "RecordsTransferItem rows of this turnover case with required == true; items with required == false never move the percentage in either direction"
    constants:
      GOVERNANCE_RECORDS_THRESHOLD_PCT: 80.00
      SETTLEMENT_RECORDS_THRESHOLD_PCT: 100.00
    precision: "2 decimal places, round_half_up; the empty required set yields 100.00, never a division by zero"

  - name: assessment_reforecast
    trigger: "POST /hoa/assessment-schedules; writes AssessmentSchedule.billable_lot_count, reserve_contribution_cents, subsidy_offset_cents, annual_requirement_cents, per_lot_monthly_assessment_cents, annual_budget_total_cents, residual_cents, increase_pct_vs_prior, owner_vote_required"
    algorithm: waterfall_allocation
    formula: |
      billable_lot_count = count(Lot WHERE association_id == A.id
                                 AND sale_status IN {CLOSED, UNDER_CONTRACT})
      reserve_contribution_cents =
          (the ReserveStudy of A with status == ADOPTED).recommended_annual_contribution_cents
          # exactly one ADOPTED study can exist per association (§1.2 ReserveStudy)

      # subsidy months still covered inside the fiscal year, by lexicographic YYYY-MM:
      subsidised_months = count of m in {YYYY-01 … YYYY-12 of S.fiscal_year}
                          with m < month_of(A.subsidy_end_date)
                          # 0 when A.subsidy_end_date is null
      subsidy_offset_cents = A.declarant_monthly_subsidy_cents * subsidised_months

      annual_requirement_cents = S.projected_operating_cost_cents
                               + reserve_contribution_cents
                               - subsidy_offset_cents

      # ROUNDING ORDER — PINNED: per-lot first, then multiply back up.
      per_lot_monthly_assessment_cents =
          ceil(annual_requirement_cents / (billable_lot_count * MONTHS_PER_YEAR))
      annual_budget_total_cents =
          per_lot_monthly_assessment_cents * billable_lot_count * MONTHS_PER_YEAR
      residual_cents = annual_budget_total_cents - annual_requirement_cents
      # Summing first and rounding once would set annual_budget_total_cents ==
      # annual_requirement_cents and residual_cents == 0; that order is forbidden.
      # residual_cents is credited to A.reserve_pool_cents when the schedule is adopted.

      prior = the AssessmentSchedule of A with status == ADOPTED
              (at most one; null when none has ever been adopted)
      increase_pct_vs_prior = 0.00 if prior is null
          else round_half_up(100 * (per_lot_monthly_assessment_cents
                                    - prior.per_lot_monthly_assessment_cents)
                             / prior.per_lot_monthly_assessment_cents, 2)
      owner_vote_required = (increase_pct_vs_prior > ASSESSMENT_INCREASE_CAP_PCT)   # STRICT >
      # An increase that rounds to exactly 20.00 does NOT require an owner vote.
    input_set: "Lot rows filtered to sale_status IN {CLOSED, UNDER_CONTRACT} — the declarant absorbs the deficit on UNSOLD lots, so they are excluded from the divisor; the single ADOPTED ReserveStudy; the single ADOPTED AssessmentSchedule as the increase baseline"
    constants:
      MONTHS_PER_YEAR: 12
      ASSESSMENT_INCREASE_CAP_PCT: 20.00
    precision: "per_lot_monthly_assessment_cents is a ceiling to whole cents; increase_pct_vs_prior is 2 decimals round_half_up; the cap comparison is strict (>)"

  - name: defect_repose_deadline
    trigger: "computed on POST /hoa/defect-claims and recomputed as a cascade hop of the CommonAreaComponent BUILD_COMPLETE milestone; writes DefectClaim.repose_deadline"
    algorithm: interval_merge
    formula: |
      repose_deadline = null if component.substantial_completion_date is null
        else component.substantial_completion_date + A.statute_of_repose_years years
             (calendar-year addition on the same month and day; when that day does not
              exist in the target year — 29 February — clamp to 28 February, and keep
              the time-of-day of substantial_completion_date)
      # NOTICE is permitted while  logical clock <= repose_deadline  (inclusive).
      # The repose sweep bars a still-INVESTIGATING claim once  clock > repose_deadline (strict).
    input_set: "the claim's own component and the association's statute_of_repose_years at the moment of computation; a later change to statute_of_repose_years does not retroactively move already-computed deadlines because the field is input-only at association creation"
    constants: {}
    precision: "instant comparison at full ISO 8601 precision; the deadline instant itself is still inside the period"

  - name: governance_seat_ledger
    trigger: "computed on POST /hoa/turnover-cases/{id}/certify-trigger (owner_elected_seats_required) and on every Director create / resign cascade / rescind (the seat counters)"
    algorithm: constraint_propagation
    formula: |
      owner_elected_seats_required =
          0 if governance_status == DECLARANT_CONTROL
          else ceil(total_seats * OWNER_CONTROL_SEAT_NUMERATOR / OWNER_CONTROL_SEAT_DENOMINATOR)
      declarant_appointed_seats = count(Director WHERE turnover_case_id == TC.id
                                        AND seat_type == DECLARANT_APPOINTED AND status == SEATED)
      owner_elected_seats       = count(Director WHERE turnover_case_id == TC.id
                                        AND seat_type == OWNER_ELECTED AND status == SEATED)
      vacant_seats = total_seats - (declarant_appointed_seats + owner_elected_seats)
      # CONSERVED QUANTITY (must hold after every seat mutation, including the
      # certify-trigger resignation cascade and every rescission):
      #   total_seats == count(Director WHERE status == SEATED) + vacant_seats
      # Seating is refused when vacant_seats == 0 (ERR_SEAT_CAPACITY_EXCEEDED), so the
      # count can never exceed total_seats.
      # Bubble-up: owner_elected_seats == owner_elected_seats_required promotes
      # governance_status ELECTION_CALLED -> ELECTION_HELD; dropping below it demotes
      # ELECTION_HELD -> ELECTION_CALLED.
    input_set: "Director rows of this turnover case with status == SEATED; RESIGNED and RESCINDED rows free their seat and are excluded"
    constants:
      OWNER_CONTROL_SEAT_NUMERATOR: 2
      OWNER_CONTROL_SEAT_DENOMINATOR: 3
    precision: "integer seats; the required-seat count is a ceiling, so a 5-seat board requires 4 owner-elected seats"

  - name: turnover_posture_derivation
    trigger: "re-derived at the end of every transition that changes TurnoverCase.governance_status or TurnoverCase.financial_status; writes TurnoverCase.turnover_posture"
    algorithm: projection
    formula: |
      turnover_posture =
        DECLARANT_CONTROL_OPEN  if governance_status == DECLARANT_CONTROL and financial_status == SUBSIDY_ACTIVE
        SETTLED_LOCKED          elif governance_status == OWNER_CONTROL and financial_status == SETTLED
        OWNER_CONTROL_OPEN      elif governance_status == OWNER_CONTROL
        TRANSITION_RESTRICTED   otherwise
      # SETTLED_LOCKED is a gate, not a label: while a TurnoverCase of the association
      # is SETTLED_LOCKED, every association-scoped mutation listed in §1.4 priority 8
      # is rejected with ERR_TURNOVER_SETTLED_LOCKED.
    input_set: "the two dimension fields of the single TurnoverCase of the association; associations without a TurnoverCase are never gated"
    constants: {}
    precision: "exact enum comparison; the branches are evaluated top to bottom and the first match wins"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role may invoke this endpoint per §1.7; for TransitionCommittee the X-User-ID must equal the association_id the target resource belongs to; and on every shared dispatcher endpoint the requested discriminator must belong to the acting role — POST /hoa/components/{id}/milestones (BUILD_COMPLETE and DEED_TENDERED are Declarant-only, CONVEYANCE_ACCEPTED is TransitionCommittee-only), POST /hoa/records-items/{id}/transitions (DELIVER is Declarant-only, ACCEPT and REJECT are TransitionCommittee-only), POST /hoa/vendor-contracts/{id}/actions (REQUEST_ASSIGNMENT is Declarant-only, CONSENT, REFUSE_CONSENT and CANCEL are TransitionCommittee-only), POST /hoa/defect-claims/{id}/actions (REJECT and ACCEPT are Declarant-only, NOTICE, REINVESTIGATE, RESERVE and WITHDRAW are TransitionCommittee-only), POST /hoa/directors (DECLARANT_APPOINTED is Declarant-only, OWNER_ELECTED is ElectionInspector-only). This discriminator check runs before any state check, so a role mismatch outranks an illegal-from-state rejection."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "segregation of duties: on POST /hoa/audit-engagements/{id}/issue the acting X-User-ID must not equal posted_by_user_id of any POSTED SubsidyEntry of the association whose period_month lies inside the engagement window; on POST /hoa/directors the acting X-User-ID must not equal TurnoverCase.trigger_certified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hoa/audit-engagements/{id}/issue, POST /hoa/directors"

  - priority: 4
    category: existence
    check: "every id in the request path resolves, validated left to right"
    error_id: "ERR_ASSOCIATION_NOT_FOUND | ERR_TURNOVER_CASE_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_RESERVE_STUDY_NOT_FOUND | ERR_SUBSIDY_ENTRY_NOT_FOUND | ERR_AUDIT_ENGAGEMENT_NOT_FOUND | ERR_DEFECT_CLAIM_NOT_FOUND | ERR_VENDOR_CONTRACT_NOT_FOUND | ERR_RECORDS_ITEM_NOT_FOUND | ERR_DIRECTOR_NOT_FOUND | ERR_ASSESSMENT_SCHEDULE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 5
    category: existence
    check: "every foreign key in the request body resolves, and cross-entity bodies agree: DefectClaim.component_id and VendorContract.component_id must belong to the same association_id supplied in the body"
    error_id: "ERR_ASSOCIATION_NOT_FOUND | ERR_COMPONENT_NOT_FOUND | ERR_TURNOVER_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /hoa/lots, POST /hoa/components, POST /hoa/turnover-cases, POST /hoa/reserve-studies, POST /hoa/subsidy-entries, POST /hoa/audit-engagements, POST /hoa/defect-claims, POST /hoa/vendor-contracts, POST /hoa/records-items, POST /hoa/directors, POST /hoa/assessment-schedules"

  - priority: 6
    category: business_constraint
    check: "request body shape: required fields present, enum members legal, integers non-negative within their declared constraints, period_month matches YYYY-MM, period_end >= period_start, service_window_end > service_window_start, and action-conditional fields present (effective_date for BUILD_COMPLETE, valuation_basis for RESERVE, settlement_amount_cents for ACCEPT, rejection_reason for REJECT, subsidy_end_date for advance dimension FINANCIAL out of SUBSIDY_ACTIVE); computed and system fields supplied by a client are ignored, not rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: state
    check: "expected_association_version equals Association.version"
    error_id: ERR_STALE_ASSOCIATION_VERSION
    http_status: 412
    applies_to: "POST /hoa/assessment-schedules"

  - priority: 8
    category: state
    check: "the association's TurnoverCase (when one exists) has turnover_posture != SETTLED_LOCKED"
    error_id: ERR_TURNOVER_SETTLED_LOCKED
    http_status: 409
    applies_to: "POST /hoa/lots/{id}/close-sale, POST /hoa/components/{id}/milestones (CONVEYANCE_ACCEPTED), POST /hoa/defect-claims, POST /hoa/defect-claims/{id}/actions, POST /hoa/subsidy-entries, POST /hoa/subsidy-entries/{id}/reverse, POST /hoa/vendor-contracts, POST /hoa/vendor-contracts/{id}/actions, POST /hoa/reserve-studies, POST /hoa/reserve-studies/{id}/actions, POST /hoa/assessment-schedules, POST /hoa/assessment-schedules/{id}/adopt, POST /hoa/turnover-cases/{id}/certify-trigger, POST /hoa/turnover-cases/{id}/advance, POST /hoa/directors"

  - priority: 9
    category: state
    check: "the target resource is in a state the requested transition allows, per §1.2 (including at most one TurnoverCase per Association, ADOPT requiring a completed adequacy evaluation, and a SubsidyEntry being reversed at most once)"
    error_id: "ERR_TURNOVER_STAGE_INVALID | ERR_LOT_STATE_INVALID | ERR_COMPONENT_MILESTONE_INVALID | ERR_CLAIM_STATE_INVALID | ERR_CONTRACT_STATE_INVALID | ERR_RECORDS_ITEM_STATE_INVALID | ERR_DIRECTOR_STATE_INVALID | ERR_AUDIT_NOT_ISSUABLE | ERR_NOT_IN_DRAFT | ERR_ADEQUACY_NOT_EVALUATED | ERR_SUBSIDY_ENTRY_ALREADY_REVERSED | ERR_TURNOVER_CASE_EXISTS"
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 10
    category: business_referential
    check: "cross-entity state preconditions: NOTICE requires the claim's component to be CONVEYED; creating an AssessmentSchedule requires the association's financial_status != SUBSIDY_ACTIVE and an ADOPTED ReserveStudy; advancing FINANCIAL out of SUBSIDY_ACTIVE requires an AuditEngagement in {ENGAGED, ISSUED}"
    error_id: "ERR_COMPONENT_NOT_CONVEYED | ERR_SUBSIDY_STILL_ACTIVE | ERR_RESERVE_STUDY_NOT_ADOPTED | ERR_TRANSITION_AUDIT_MISSING"
    http_status: 409
    applies_to: "POST /hoa/defect-claims/{id}/actions (NOTICE), POST /hoa/assessment-schedules, POST /hoa/turnover-cases/{id}/advance"

  - priority: 11
    category: business_temporal
    check: "statutory clocks: NOTICE requires logical clock <= repose_deadline (inclusive); CANCEL requires logical clock <= cancellation_window_end (inclusive)"
    error_id: "ERR_REPOSE_PERIOD_EXPIRED | ERR_CANCELLATION_WINDOW_CLOSED"
    http_status: 422
    applies_to: "POST /hoa/defect-claims/{id}/actions (NOTICE), POST /hoa/vendor-contracts/{id}/actions (CANCEL)"

  - priority: 12
    category: business_constraint
    check: "occupation conflicts and uniqueness: audit periods of one association may not overlap as closed intervals [period_start, period_end] against any engagement with status IN {ENGAGED, ISSUED}; vendor service windows on one component may not overlap as half-open intervals [service_window_start, service_window_end) after the existing window's end is inflated by TRANSITION_BLACKOUT_DAYS, against contracts with status IN {ACTIVE, CANCELLABLE}; lot_number is unique per association"
    error_id: "ERR_AUDIT_PERIOD_OVERLAP | ERR_SERVICE_WINDOW_CONFLICT | ERR_DUPLICATE_LOT_NUMBER"
    http_status: 409
    applies_to: "POST /hoa/audit-engagements, POST /hoa/vendor-contracts, POST /hoa/lots"

  - priority: 13
    category: business_referential
    check: "declarant obligations still open: unresolved developer-affiliated cancellable contracts, overdue unbuilt amenities, and records completeness below the gate for the requested advance"
    error_id: "ERR_ASSIGNMENT_CONSENT_REQUIRED | ERR_UNBUILT_AMENITY_OUTSTANDING | ERR_RECORDS_INCOMPLETE"
    http_status: 422
    applies_to: "POST /hoa/turnover-cases/{id}/advance"

  - priority: 14
    category: business_safety
    check: "statutory thresholds and caps: PERCENT_SOLD needs sold_lot_pct >= turnover_threshold_pct; FIXED_DATE needs clock >= fixed_turnover_date; REINVESTIGATE needs negotiation_round < MAX_NEGOTIATION_ROUNDS; seating needs vacant_seats >= 1; adopting a schedule whose increase exceeds the cap needs owner_vote_ratified == true"
    error_id: "ERR_TURNOVER_THRESHOLD_NOT_MET | ERR_FIXED_TURNOVER_DATE_NOT_REACHED | ERR_NEGOTIATION_ROUNDS_EXHAUSTED | ERR_SEAT_CAPACITY_EXCEEDED | ERR_OWNER_VOTE_REQUIRED"
    http_status: 422
    applies_to: "POST /hoa/turnover-cases/{id}/certify-trigger, POST /hoa/defect-claims/{id}/actions (REINVESTIGATE), POST /hoa/directors, POST /hoa/assessment-schedules/{id}/adopt"

  - priority: 15
    category: business_fiscal
    check: "money last: a claim reserve must fit inside reserve_claim_available_cents (inclusive), and settlement requires an ISSUED CLEAN audit with settlement_blocked == false"
    error_id: "ERR_CLAIM_RESERVE_INSUFFICIENT | ERR_SETTLEMENT_BLOCKED"
    http_status: 422
    applies_to: "POST /hoa/defect-claims/{id}/actions (RESERVE), POST /hoa/turnover-cases/{id}/advance (FINANCIAL to SETTLED)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- reads ----
  - method: GET
    path: "/hoa/associations/{id}"
    description: "read one association including every derived finance counter"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: []
    output: Association
    side_effects: []

  - method: GET
    path: "/hoa/associations/{id}/lots"
    description: "list the association's lots; reverse lookup for Lot.association_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["sale_status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: GET
    path: "/hoa/associations/{id}/components"
    description: "list the association's common area components; reverse lookup for CommonAreaComponent.association_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["build_status?", "conveyance_status?", "category?", "limit?", "offset?"]
    output: CommonAreaComponent[]
    side_effects: []

  - method: GET
    path: "/hoa/associations/{id}/turnover-cases"
    description: "list the association's turnover cases (0 or 1); reverse lookup for TurnoverCase.association_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["limit?", "offset?"]
    output: TurnoverCase[]
    side_effects: []

  - method: GET
    path: "/hoa/associations/{id}/reserve-studies"
    description: "list the association's reserve studies; reverse lookup for ReserveStudy.association_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReserveStudy[]
    side_effects: []

  - method: GET
    path: "/hoa/associations/{id}/audit-engagements"
    description: "list the association's transition audit engagements; reverse lookup for AuditEngagement.association_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AuditEngagement[]
    side_effects: []

  - method: GET
    path: "/hoa/associations/{id}/assessment-schedules"
    description: "list the association's assessment schedules; reverse lookup for AssessmentSchedule.association_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["fiscal_year?", "status?", "limit?", "offset?"]
    output: AssessmentSchedule[]
    side_effects: []

  - method: GET
    path: "/hoa/turnover-cases/{id}"
    description: "read one turnover case including both parallel dimensions, the derived posture and the seat ledger"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: []
    output: TurnoverCase
    side_effects: []

  - method: GET
    path: "/hoa/turnover-cases/{id}/records-items"
    description: "list the case's records transfer items; reverse lookup for RecordsTransferItem.turnover_case_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: RecordsTransferItem[]
    side_effects: []

  - method: GET
    path: "/hoa/turnover-cases/{id}/directors"
    description: "list the case's board seats; reverse lookup for Director.turnover_case_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["seat_type?", "status?", "limit?", "offset?"]
    output: Director[]
    side_effects: []

  - method: GET
    path: "/hoa/defect-claims/{id}"
    description: "read one construction defect claim including its reserve breakdown and repose deadline"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: []
    output: DefectClaim
    side_effects: []

  - method: GET
    path: "/hoa/defect-claims"
    description: "filtered list of defect claims; reverse lookup for DefectClaim.association_id and DefectClaim.component_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["association_id?", "component_id?", "status?", "limit?", "offset?"]
    output: DefectClaim[]
    side_effects: []

  - method: GET
    path: "/hoa/vendor-contracts/{id}"
    description: "read one vendor contract including assignment posture and cancellation window"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: []
    output: VendorContract
    side_effects: []

  - method: GET
    path: "/hoa/vendor-contracts"
    description: "filtered list of vendor contracts; reverse lookup for VendorContract.association_id and VendorContract.component_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["association_id?", "component_id?", "developer_affiliated?", "status?", "limit?", "offset?"]
    output: VendorContract[]
    side_effects: []

  - method: GET
    path: "/hoa/subsidy-entries/{id}"
    description: "read one declarant subsidy ledger entry"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: []
    output: SubsidyEntry
    side_effects: []

  - method: GET
    path: "/hoa/subsidy-entries"
    description: "filtered list of subsidy ledger entries; reverse lookup for SubsidyEntry.association_id and for the self-referential SubsidyEntry.reverses_entry_id"
    roles: [PlatformAdmin, Declarant, TransitionCommittee, Auditor, ElectionInspector]
    code: 200
    input: ["association_id?", "reverses_entry_id?", "direction?", "status?", "limit?", "offset?"]
    output: SubsidyEntry[]
    side_effects: []

  # --------------------------------------------------------------- writes ----
  - method: POST
    path: "/hoa/associations"
    description: "register an association with its declaration parameters"
    roles: [PlatformAdmin]
    code: 201
    input: [name, total_planned_lots, turnover_threshold_pct, fixed_turnover_date, statute_of_repose_years, reserve_pool_cents, reserve_claim_pool_cents, declarant_monthly_subsidy_cents]
    output: Association
    side_effects:
      - "sold_lot_count = 0; sold_lot_pct = 0.00; subsidy_receivable_cents = 0; reserve_claim_committed_cents = 0"
      - "reserve_claim_available_cents = reserve_claim_pool_cents; budget_forecast_status = CURRENT; version = 1"

  - method: POST
    path: "/hoa/lots"
    description: "record a platted lot"
    roles: [Declarant]
    code: 201
    input: [association_id, lot_number, "sale_status?"]
    output: Lot
    side_effects:
      - "rejects a lot_number already used within the association (ERR_DUPLICATE_LOT_NUMBER)"

  - method: POST
    path: "/hoa/lots/{id}/close-sale"
    description: "close the sale of a lot, moving it into the turnover-trigger numerator"
    roles: [Declarant]
    code: 200
    input: [closing_date]
    output: Lot
    side_effects:
      - "sale_status = CLOSED; closing_date recorded"
      - "recomputes Association.sold_lot_count and Association.sold_lot_pct per calculations.sold_lot_percentage"
      - "increments Association.version by 1"

  - method: POST
    path: "/hoa/components"
    description: "register a common area component on the reserve schedule"
    roles: [Declarant]
    code: 201
    input: [association_id, name, category, replacement_cost_cents, useful_life_years, effective_age_years, promised_completion_date, "build_status?"]
    output: CommonAreaComponent
    side_effects:
      - "conveyance_status = NOT_CONVEYED; substantial_completion_date = null"

  - method: POST
    path: "/hoa/components/{id}/milestones"
    description: "record a construction or conveyance milestone; BUILD_COMPLETE and DEED_TENDERED belong to the Declarant, CONVEYANCE_ACCEPTED to the TransitionCommittee"
    roles: [Declarant, TransitionCommittee]
    code: 200
    input: [milestone, "effective_date?"]
    output: CommonAreaComponent
    side_effects:
      - "BUILD_COMPLETE: build_status = COMPLETE, substantial_completion_date = effective_date, then recomputes repose_deadline on every DefectClaim of this component"
      - "DEED_TENDERED: conveyance_status = DEED_TENDERED"
      - "CONVEYANCE_ACCEPTED: conveyance_status = CONVEYED, conveyed_at = logical clock, then resets every DRAFT ReserveStudy of the association to adequacy_verdict = UNDETERMINED with evaluated_method = null"

  - method: POST
    path: "/hoa/turnover-cases"
    description: "open the transition committee's turnover case for an association"
    roles: [PlatformAdmin]
    code: 201
    input: [association_id, total_seats]
    output: TurnoverCase
    side_effects:
      - "governance_status = DECLARANT_CONTROL; financial_status = SUBSIDY_ACTIVE; turnover_posture = DECLARANT_CONTROL_OPEN"
      - "vacant_seats = total_seats; owner_elected_seats_required = 0; records_transfer_completeness_pct = 100.00; settlement_blocked = false"
      - "rejects a second case for the same association (ERR_TURNOVER_CASE_EXISTS)"

  - method: POST
    path: "/hoa/turnover-cases/{id}/certify-trigger"
    description: "certify that the declaration's turnover trigger has fired and call the transition election"
    roles: [TransitionCommittee]
    code: 200
    input: [trigger_basis]
    output: TurnoverCase
    side_effects:
      - "CASCADE-1 hop A: governance_status = ELECTION_CALLED; trigger_basis, trigger_certified_at, trigger_certified_by_user_id recorded; owner_elected_seats_required computed"
      - "CASCADE-1 hop B: resigns every SEATED DECLARANT_APPOINTED Director of the case"
      - "CASCADE-1 hop C: moves every ACTIVE developer-affiliated VendorContract of the association to CANCELLABLE with cancellation_window_end"
      - "CASCADE-1 hop D: Association.budget_forecast_status = STALE; increments Association.version by 1"
      - "CASCADE-1 hop E: supersedes every DRAFT AssessmentSchedule of the association"

  - method: POST
    path: "/hoa/turnover-cases/{id}/advance"
    description: "advance one parallel dimension of the turnover case; dimension GOVERNANCE moves ELECTION_HELD -> OWNER_CONTROL, dimension FINANCIAL moves SUBSIDY_ACTIVE -> AUDIT_IN_PROGRESS (subsidy_end_date required) and then AUDIT_IN_PROGRESS -> SETTLED"
    roles: [TransitionCommittee]
    code: 200
    input: [dimension, "subsidy_end_date?"]
    output: TurnoverCase
    side_effects:
      - "GOVERNANCE: governance_status = OWNER_CONTROL; turnover_posture re-derived"
      - "FINANCIAL out of SUBSIDY_ACTIVE: financial_status = AUDIT_IN_PROGRESS; Association.subsidy_end_date set; Association.budget_forecast_status = STALE; increments Association.version by 1; supersedes every DRAFT AssessmentSchedule"
      - "FINANCIAL out of AUDIT_IN_PROGRESS: financial_status = SETTLED; turnover_posture = SETTLED_LOCKED, which locks every association-scoped mutation"

  - method: POST
    path: "/hoa/directors"
    description: "seat a board director; DECLARANT_APPOINTED seats belong to the Declarant, OWNER_ELECTED seats to the ElectionInspector"
    roles: [Declarant, ElectionInspector]
    code: 201
    input: [turnover_case_id, full_name, seat_type]
    output: Director
    side_effects:
      - "status = SEATED; seated_by_user_id = X-User-ID; recomputes declarant_appointed_seats, owner_elected_seats and vacant_seats per calculations.governance_seat_ledger"
      - "bubble-up: promotes governance_status ELECTION_CALLED -> ELECTION_HELD when owner_elected_seats reaches owner_elected_seats_required, and re-derives turnover_posture"
      - "refuses to seat when vacant_seats == 0 (ERR_SEAT_CAPACITY_EXCEEDED)"

  - method: POST
    path: "/hoa/directors/{id}/rescind"
    description: "rescind a seated director, freeing the seat"
    roles: [ElectionInspector]
    code: 200
    input: []
    output: Director
    side_effects:
      - "status = RESCINDED; vacated_at = logical clock; seat counters recomputed so total_seats == SEATED count + vacant_seats still holds"
      - "revert: demotes governance_status ELECTION_HELD -> ELECTION_CALLED when owner_elected_seats drops below owner_elected_seats_required, and re-derives turnover_posture"

  - method: POST
    path: "/hoa/records-items"
    description: "register a records, warranty, plan, permit or contract item the declarant owes the association"
    roles: [Declarant]
    code: 201
    input: [turnover_case_id, category, "required?"]
    output: RecordsTransferItem
    side_effects:
      - "status = OUTSTANDING; recomputes TurnoverCase.records_transfer_completeness_pct per calculations.records_transfer_completeness"

  - method: POST
    path: "/hoa/records-items/{id}/transitions"
    description: "drive a records item through its delivery review cycle; action DELIVER belongs to the Declarant, ACCEPT and REJECT to the TransitionCommittee"
    roles: [Declarant, TransitionCommittee]
    code: 200
    input: [action, "rejection_reason?"]
    output: RecordsTransferItem
    side_effects:
      - "DELIVER: status = DELIVERED; delivered_at = logical clock; rejection_reason cleared"
      - "ACCEPT: status = ACCEPTED; recomputes TurnoverCase.records_transfer_completeness_pct"
      - "REJECT: status = REJECTED; rejection_reason recorded; recomputes TurnoverCase.records_transfer_completeness_pct"

  - method: POST
    path: "/hoa/subsidy-entries"
    description: "post a declarant subsidy accrual or payment to the association's ledger"
    roles: [Declarant]
    code: 201
    input: [association_id, direction, amount_cents, period_month]
    output: SubsidyEntry
    side_effects:
      - "status = POSTED; posted_by_user_id = X-User-ID"
      - "recomputes Association.subsidy_receivable_cents per calculations.subsidy_receivable_balance; increments Association.version by 1"
      - "recomputes unreconciled_delta_cents and finding_status on every ISSUED AuditEngagement of the association, and sets TurnoverCase.settlement_blocked = true when any of them becomes EXCEPTION_NOTED"

  - method: POST
    path: "/hoa/subsidy-entries/{id}/reverse"
    description: "reverse a posted subsidy entry, creating the mirror REVERSAL row that documents the undo"
    roles: [Declarant]
    code: 200
    input: [reason]
    output: SubsidyEntry
    side_effects:
      - "CASCADE-2 hop A: the target entry's status = REVERSED and a system SubsidyEntry with direction = REVERSAL, the same amount_cents and period_month, and reverses_entry_id = target id is created (discoverable via GET /hoa/subsidy-entries?reverses_entry_id=...)"
      - "CASCADE-2 hop B: Association.subsidy_receivable_cents recomputed back to its pre-post value; increments Association.version by 1"
      - "CASCADE-2 hop C: every ISSUED AuditEngagement of the association recomputes unreconciled_delta_cents against its frozen audited_receivable_snapshot_cents and flips finding_status to EXCEPTION_NOTED when the delta is non-zero"
      - "CASCADE-2 hop D: TurnoverCase.settlement_blocked = true when any ISSUED engagement is EXCEPTION_NOTED"
      - "returns the reversed target entry, not the mirror"

  - method: POST
    path: "/hoa/audit-engagements"
    description: "engage the transition auditor over a closed accounting period"
    roles: [Auditor]
    code: 201
    input: [association_id, period_start, period_end]
    output: AuditEngagement
    side_effects:
      - "status = ENGAGED; finding_status = CLEAN; unreconciled_delta_cents = 0; audited_receivable_snapshot_cents = 0"
      - "rejects a period that overlaps an existing ENGAGED or ISSUED engagement of the association as closed intervals (ERR_AUDIT_PERIOD_OVERLAP)"

  - method: POST
    path: "/hoa/audit-engagements/{id}/issue"
    description: "issue the transition audit report, freezing the in-window subsidy receivable snapshot"
    roles: [Auditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects:
      - "status = ISSUED; issued_by_user_id = X-User-ID; audited_receivable_snapshot_cents frozen per calculations.audit_unreconciled_delta"
      - "unreconciled_delta_cents computed; finding_status = CLEAN when it is 0 else EXCEPTION_NOTED"
      - "refuses an auditor who posted any in-window subsidy entry of this association (ERR_SEGREGATION_OF_DUTIES)"

  - method: POST
    path: "/hoa/reserve-studies"
    description: "open a draft reserve study for the association"
    roles: [TransitionCommittee]
    code: 201
    input: [association_id, funding_method, planned_annual_contribution_cents, projected_annual_expenditure_cents]
    output: ReserveStudy
    side_effects:
      - "status = DRAFT; adequacy_verdict = UNDETERMINED; evaluated_method = null; recommended_annual_contribution_cents = 0"
      - "supersedes any other DRAFT study of the same association"

  - method: POST
    path: "/hoa/reserve-studies/{id}/actions"
    description: "act on a draft reserve study; action RECOMPUTE evaluates adequacy under the supplied method, action ADOPT makes the study the association's funding baseline"
    roles: [TransitionCommittee]
    code: 200
    input: [action, "method?"]
    output: ReserveStudy
    side_effects:
      - "RECOMPUTE: evaluated_method, component_count, fully_funded_balance_cents, percent_funded, min_projected_balance_cents, adequacy_verdict and recommended_annual_contribution_cents all rewritten per calculations.reserve_funding_adequacy"
      - "ADOPT: status = ADOPTED and the association's previously ADOPTED study is superseded; refused while adequacy_verdict is UNDETERMINED (ERR_ADEQUACY_NOT_EVALUATED)"

  - method: POST
    path: "/hoa/defect-claims"
    description: "open a construction defect claim against a common area component"
    roles: [TransitionCommittee]
    code: 201
    input: [association_id, component_id, defect_summary, repair_cost_estimate_cents, diminution_value_cents]
    output: DefectClaim
    side_effects:
      - "status = INVESTIGATING; negotiation_round = 0; valuation_basis = null; reserved_amount_cents = 0"
      - "repose_deadline computed per calculations.defect_repose_deadline, or null while the component has no substantial_completion_date"
      - "rejects a component_id that belongs to a different association (ERR_COMPONENT_NOT_FOUND)"

  - method: POST
    path: "/hoa/defect-claims/{id}/actions"
    description: "drive a defect claim through notice, negotiation, reserve, settlement or withdrawal; NOTICE, REINVESTIGATE, RESERVE and WITHDRAW belong to the TransitionCommittee, REJECT and ACCEPT to the Declarant"
    roles: [TransitionCommittee, Declarant]
    code: 200
    input: [action, "valuation_basis?", "settlement_amount_cents?"]
    output: DefectClaim
    side_effects:
      - "NOTICE: status = NOTICED, gated on the component being CONVEYED and on the repose deadline not having passed"
      - "REJECT: status = REJECTED_BY_DEVELOPER"
      - "REINVESTIGATE: status = INVESTIGATING; negotiation_round += 1, capped at MAX_NEGOTIATION_ROUNDS"
      - "RESERVE: status = RESERVED; reserve_subtotal_cents, litigation_admin_fee_cents and reserved_amount_cents set per calculations.defect_claim_reserve_amount; Association.reserve_claim_committed_cents increased and reserve_claim_available_cents recomputed; increments Association.version by 1"
      - "ACCEPT: status = SETTLED; settlement_amount_cents recorded; any committed reserve released back to the pool; increments Association.version by 1"
      - "WITHDRAW: status = WITHDRAWN; any committed reserve released back to the pool; increments Association.version by 1"

  - method: POST
    path: "/hoa/associations/{id}/repose-sweep"
    description: "sweep the association's still-investigating defect claims whose statute of repose has run and bar them"
    roles: [TransitionCommittee]
    code: 200
    input: []
    output: "{ swept_claim_count: integer, time_barred_claim_ids: string[] }"
    side_effects:
      - "every DefectClaim of the association with status == INVESTIGATING and logical clock strictly past repose_deadline transitions to TIME_BARRED, processed created_at ASC"
      - "claims with a null repose_deadline are never swept"

  - method: POST
    path: "/hoa/vendor-contracts"
    description: "register a service contract on a common area component"
    roles: [Declarant]
    code: 201
    input: [association_id, component_id, vendor_name, developer_affiliated, annual_cost_cents, service_window_start, service_window_end]
    output: VendorContract
    side_effects:
      - "status = ACTIVE; assignment_status = NOT_REQUESTED; cancellation_window_end = null"
      - "rejects a service window that collides with an existing ACTIVE or CANCELLABLE contract on the same component once that window's end is inflated by TRANSITION_BLACKOUT_DAYS (ERR_SERVICE_WINDOW_CONFLICT)"

  - method: POST
    path: "/hoa/vendor-contracts/{id}/actions"
    description: "act on a vendor contract; action REQUEST_ASSIGNMENT belongs to the Declarant, actions CONSENT, REFUSE_CONSENT and CANCEL to the TransitionCommittee"
    roles: [Declarant, TransitionCommittee]
    code: 200
    input: [action]
    output: VendorContract
    side_effects:
      - "REQUEST_ASSIGNMENT: assignment_status = ASSIGNMENT_REQUESTED"
      - "CONSENT: assignment_status = CONSENTED, then accepts every DELIVERED VENDOR_CONTRACTS records item of the association's turnover case and recomputes records_transfer_completeness_pct"
      - "REFUSE_CONSENT: assignment_status = CONSENT_REFUSED and status = TERMINATED_FOR_REFUSAL; Association.budget_forecast_status = STALE; increments Association.version by 1"
      - "CANCEL: status = CANCELLED, gated on the cancellation window still being open; Association.budget_forecast_status = STALE; increments Association.version by 1; supersedes every DRAFT AssessmentSchedule"

  - method: POST
    path: "/hoa/assessment-schedules"
    description: "re-forecast the operating budget and derive the post-subsidy per-lot assessment; requires the caller's last observed association version"
    roles: [TransitionCommittee]
    code: 201
    input: [association_id, fiscal_year, projected_operating_cost_cents, expected_association_version]
    output: AssessmentSchedule
    side_effects:
      - "billable_lot_count, reserve_contribution_cents, subsidy_offset_cents, annual_requirement_cents, per_lot_monthly_assessment_cents, annual_budget_total_cents, residual_cents, increase_pct_vs_prior and owner_vote_required all computed per calculations.assessment_reforecast"
      - "status = DRAFT; supersedes any other DRAFT schedule of the same association"
      - "increments Association.version by 1"
      - "rejected with ERR_STALE_ASSOCIATION_VERSION (412) when expected_association_version does not equal the association's current version"

  - method: POST
    path: "/hoa/assessment-schedules/{id}/adopt"
    description: "adopt a draft assessment schedule; an increase above the statutory cap needs a ratified owner vote"
    roles: [TransitionCommittee]
    code: 200
    input: ["owner_vote_ratified?"]
    output: AssessmentSchedule
    side_effects:
      - "status = ADOPTED; owner_vote_ratified recorded (false when omitted); the previously ADOPTED schedule is superseded"
      - "Association.reserve_pool_cents += residual_cents; Association.budget_forecast_status = CURRENT; increments Association.version by 1"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint that sets the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time, so every repose deadline, cancellation window and fixed turnover date is deterministic."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock; performs no business transition and supersedes nothing"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "role may not invoke this endpoint, a TransitionCommittee acts on another association's resource, or the requested dispatcher discriminator (milestone, action or seat_type) belongs to the other role"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user already posted an in-window subsidy entry and now tries to issue the audit, or the user who certified the trigger tries to seat a director"

  # ---- not found ----
  - id: ERR_ASSOCIATION_NOT_FOUND
    http: 404
    condition: "association id in path or body does not resolve"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "lot id in path does not resolve"
  - id: ERR_TURNOVER_CASE_NOT_FOUND
    http: 404
    condition: "turnover case id in path or body does not resolve"
  - id: ERR_COMPONENT_NOT_FOUND
    http: 404
    condition: "component id does not resolve, or resolves to a component of a different association than the body's association_id"
  - id: ERR_DEFECT_CLAIM_NOT_FOUND
    http: 404
    condition: "defect claim id in path does not resolve"
  - id: ERR_VENDOR_CONTRACT_NOT_FOUND
    http: 404
    condition: "vendor contract id in path does not resolve"
  - id: ERR_SUBSIDY_ENTRY_NOT_FOUND
    http: 404
    condition: "subsidy entry id in path does not resolve"
  - id: ERR_RESERVE_STUDY_NOT_FOUND
    http: 404
    condition: "reserve study id in path does not resolve"
  - id: ERR_RECORDS_ITEM_NOT_FOUND
    http: 404
    condition: "records transfer item id in path does not resolve"
  - id: ERR_AUDIT_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "audit engagement id in path does not resolve"
  - id: ERR_DIRECTOR_NOT_FOUND
    http: 404
    condition: "director id in path does not resolve"
  - id: ERR_ASSESSMENT_SCHEDULE_NOT_FOUND
    http: 404
    condition: "assessment schedule id in path does not resolve"

  # ---- shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, illegal enum member, out-of-range number, malformed period_month, inverted date range, or a missing action-conditional field (effective_date, valuation_basis, settlement_amount_cents, rejection_reason, method, subsidy_end_date)"

  # ---- concurrency ----
  - id: ERR_STALE_ASSOCIATION_VERSION
    http: 412
    condition: "expected_association_version does not match the association's current version on POST /hoa/assessment-schedules"

  # ---- state ----
  - id: ERR_TURNOVER_SETTLED_LOCKED
    http: 409
    condition: "the association's turnover case has turnover_posture == SETTLED_LOCKED, which bars every association-scoped mutation"
  - id: ERR_TURNOVER_STAGE_INVALID
    http: 409
    condition: "the requested certify-trigger or advance is not legal from the case's current governance_status / financial_status"
  - id: ERR_TURNOVER_CASE_EXISTS
    http: 409
    condition: "a turnover case already exists for the association"
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "close-sale on a lot that is already CLOSED"
  - id: ERR_COMPONENT_MILESTONE_INVALID
    http: 409
    condition: "milestone not legal from the component's current build_status / conveyance_status, including DEED_TENDERED before BUILD_COMPLETE"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "claim action not legal from the claim's current status, or settlement attempted while an unresolved claim remains"
  - id: ERR_CONTRACT_STATE_INVALID
    http: 409
    condition: "contract action not legal from the contract's current status / assignment_status"
  - id: ERR_RECORDS_ITEM_STATE_INVALID
    http: 409
    condition: "records item action not legal from the item's current status"
  - id: ERR_DIRECTOR_STATE_INVALID
    http: 409
    condition: "rescind on a director who is not SEATED"
  - id: ERR_SUBSIDY_ENTRY_ALREADY_REVERSED
    http: 409
    condition: "reverse called on an entry whose status is not POSTED, or on a REVERSAL mirror"
  - id: ERR_AUDIT_NOT_ISSUABLE
    http: 409
    condition: "issue called on an engagement whose status is not ENGAGED"
  - id: ERR_NOT_IN_DRAFT
    http: 409
    condition: "reserve study or assessment schedule action requires status == DRAFT"
  - id: ERR_ADEQUACY_NOT_EVALUATED
    http: 409
    condition: "ADOPT on a reserve study whose adequacy_verdict is still UNDETERMINED or whose evaluated_method is null"

  # ---- referential business rules ----
  - id: ERR_COMPONENT_NOT_CONVEYED
    http: 409
    condition: "NOTICE on a claim whose component has not been conveyed to the association"
  - id: ERR_SUBSIDY_STILL_ACTIVE
    http: 409
    condition: "assessment schedule creation while the turnover case's financial_status is still SUBSIDY_ACTIVE"
  - id: ERR_RESERVE_STUDY_NOT_ADOPTED
    http: 409
    condition: "assessment schedule creation with no ADOPTED reserve study for the association"
  - id: ERR_TRANSITION_AUDIT_MISSING
    http: 409
    condition: "advancing the FINANCIAL dimension out of SUBSIDY_ACTIVE with no ENGAGED or ISSUED audit engagement"
  - id: ERR_ASSIGNMENT_CONSENT_REQUIRED
    http: 422
    condition: "advance blocked by a developer-affiliated contract still sitting in CANCELLABLE"
  - id: ERR_UNBUILT_AMENITY_OUTSTANDING
    http: 422
    condition: "advance blocked by an AMENITY component still UNBUILT or IN_PROGRESS past its promised_completion_date"
  - id: ERR_RECORDS_INCOMPLETE
    http: 422
    condition: "records_transfer_completeness_pct below 80.00 for the governance advance, or below 100.00 for settlement"

  # ---- temporal business rules ----
  - id: ERR_REPOSE_PERIOD_EXPIRED
    http: 422
    condition: "NOTICE after the claim's repose_deadline has passed, or on a claim with no repose_deadline at all"
  - id: ERR_CANCELLATION_WINDOW_CLOSED
    http: 422
    condition: "CANCEL after cancellation_window_end"

  # ---- occupancy and uniqueness ----
  - id: ERR_AUDIT_PERIOD_OVERLAP
    http: 409
    condition: "audit period overlaps an existing ENGAGED or ISSUED engagement of the association, closed intervals, so touching endpoints collide"
  - id: ERR_SERVICE_WINDOW_CONFLICT
    http: 409
    condition: "vendor service window overlaps an existing window on the same component after the blackout buffer is applied"
  - id: ERR_DUPLICATE_LOT_NUMBER
    http: 409
    condition: "lot_number already used within the association"

  # ---- safety and threshold rules ----
  - id: ERR_TURNOVER_THRESHOLD_NOT_MET
    http: 422
    condition: "PERCENT_SOLD certification while sold_lot_pct is below turnover_threshold_pct"
  - id: ERR_FIXED_TURNOVER_DATE_NOT_REACHED
    http: 422
    condition: "FIXED_DATE certification before the declaration's fixed_turnover_date"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 422
    condition: "REINVESTIGATE once negotiation_round has reached MAX_NEGOTIATION_ROUNDS"
  - id: ERR_SEAT_CAPACITY_EXCEEDED
    http: 422
    condition: "seating a director when vacant_seats is already 0"
  - id: ERR_OWNER_VOTE_REQUIRED
    http: 422
    condition: "adopting a schedule whose increase_pct_vs_prior exceeds the cap without owner_vote_ratified == true"

  # ---- fiscal rules ----
  - id: ERR_CLAIM_RESERVE_INSUFFICIENT
    http: 422
    condition: "reserved amount exceeds the association's reserve_claim_available_cents"
  - id: ERR_SETTLEMENT_BLOCKED
    http: 422
    condition: "settlement attempted while settlement_blocked is true or with no ISSUED CLEAN audit engagement"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "registry operator; stands up associations and turnover cases and owns the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /hoa/associations"
      - "POST /hoa/turnover-cases"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET under /hoa"

  - name: Declarant
    description: "developer and its affiliates; owns lot sales, construction, the subsidy ledger, records delivery, vendor procurement, declarant-appointed seats and the developer side of claim negotiation"
    identity: opaque
    exclusive_operations:
      - "POST /hoa/lots"
      - "POST /hoa/lots/{id}/close-sale"
      - "POST /hoa/components"
      - "POST /hoa/components/{id}/milestones with milestone IN {BUILD_COMPLETE, DEED_TENDERED}"
      - "POST /hoa/records-items"
      - "POST /hoa/records-items/{id}/transitions with action == DELIVER"
      - "POST /hoa/subsidy-entries"
      - "POST /hoa/subsidy-entries/{id}/reverse"
      - "POST /hoa/vendor-contracts"
      - "POST /hoa/vendor-contracts/{id}/actions with action == REQUEST_ASSIGNMENT"
      - "POST /hoa/defect-claims/{id}/actions with action IN {REJECT, ACCEPT}"
      - "POST /hoa/directors with seat_type == DECLARANT_APPOINTED"
    shared_operations:
      - "every GET under /hoa"
      - "POST /hoa/components/{id}/milestones (shared endpoint, disjoint milestone set from TransitionCommittee)"
      - "POST /hoa/records-items/{id}/transitions (shared endpoint, disjoint action set)"
      - "POST /hoa/vendor-contracts/{id}/actions (shared endpoint, disjoint action set)"
      - "POST /hoa/defect-claims/{id}/actions (shared endpoint, disjoint action set)"
      - "POST /hoa/directors (shared endpoint, disjoint seat_type)"

  - name: TransitionCommittee
    description: "the owner-side transition committee acting for one association; X-User-ID is that association's id, so it can only touch its own community's resources"
    identity: "entity_backed:Association"
    exclusive_operations:
      - "POST /hoa/turnover-cases/{id}/certify-trigger"
      - "POST /hoa/turnover-cases/{id}/advance"
      - "POST /hoa/components/{id}/milestones with milestone == CONVEYANCE_ACCEPTED"
      - "POST /hoa/records-items/{id}/transitions with action IN {ACCEPT, REJECT}"
      - "POST /hoa/reserve-studies"
      - "POST /hoa/reserve-studies/{id}/actions"
      - "POST /hoa/defect-claims"
      - "POST /hoa/defect-claims/{id}/actions with action IN {NOTICE, REINVESTIGATE, RESERVE, WITHDRAW}"
      - "POST /hoa/associations/{id}/repose-sweep"
      - "POST /hoa/vendor-contracts/{id}/actions with action IN {CONSENT, REFUSE_CONSENT, CANCEL}"
      - "POST /hoa/assessment-schedules"
      - "POST /hoa/assessment-schedules/{id}/adopt"
    shared_operations:
      - "every GET under /hoa"
      - "POST /hoa/components/{id}/milestones (shared endpoint, disjoint milestone set from Declarant)"
      - "POST /hoa/records-items/{id}/transitions (shared endpoint, disjoint action set)"
      - "POST /hoa/vendor-contracts/{id}/actions (shared endpoint, disjoint action set)"
      - "POST /hoa/defect-claims/{id}/actions (shared endpoint, disjoint action set)"

  - name: Auditor
    description: "independent transition auditor; engages over a period and issues the report, and may not audit money it posted itself"
    identity: opaque
    exclusive_operations:
      - "POST /hoa/audit-engagements"
      - "POST /hoa/audit-engagements/{id}/issue"
    shared_operations:
      - "every GET under /hoa"

  - name: ElectionInspector
    description: "neutral election inspector; seats and rescinds owner-elected directors"
    identity: opaque
    exclusive_operations:
      - "POST /hoa/directors with seat_type == OWNER_ELECTED"
      - "POST /hoa/directors/{id}/rescind"
    shared_operations:
      - "every GET under /hoa"
      - "POST /hoa/directors (shared endpoint, disjoint seat_type from Declarant)"
