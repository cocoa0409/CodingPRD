          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p1_id: $.data.id
      - call: POST /participants
        payload:
          full_name: Denise Whitlock
          facility_name: Northgate Correctional
          facility_state: OH
          expected_release_date: '2026-08-10'
          record_categories:
          - PROPERTY_OFFENSE
          required_document_types:
          - STATE_ID
          - SSN_CARD
          - BIRTH_CERTIFICATE
          - WORK_HISTORY
          - MEDICAID_APPLICATION
          assigned_case_manager_user_id: cm-1
        as: CaseManager
        as_user_id: cm-1
        captures:
          p2_id: $.data.id
      - call: POST /grants
        payload:
          funder_name: Statewide Reentry Fund
          program_year: 2026
          authorized_cents: 5000000
          allowed_categories:
          - TOOLS
          - UNIFORM
          - TRANSIT_PASS
          - ID_FEE
          - LICENSE_FEE
          - WAGE_SUBSIDY
          per_participant_cap_cents: 60000
          retention_benchmark_pct: 50.0
        as: FunderAnalyst
        as_user_id: analyst-1
        captures:
          g1_id: $.data.id
      trigger:
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_a: $.data.version
      - call: POST /support-requests
        payload:
          participant_id: ${p1_id}
          grant_id: ${g1_id}
          category: TOOLS
          expected_grant_version: ${g1_v_a}
          line_items:
          - description: Full mechanic tool chest
            unit_cost_cents: 67227
            quantity: 1
          justification: Complete tool chest required by the diesel maintenance placement
        as: CaseManager
        as_user_id: cm-1
        captures:
          sr_ok_id: $.data.id
      - call: GET /grants/${g1_id}
        as: CaseManager
        as_user_id: cm-1
        captures:
          g1_v_b: $.data.version
      - call: POST /support-requests
        payload:
          participant_id: ${p2_id}
          grant_id: ${g1_id}
          category: TOOLS
          expected_grant_version: ${g1_v_b}
          line_items:
          - description: Full mechanic tool chest
            unit_cost_cents: 67228
            quantity: 1
          justification: Complete tool chest required by the diesel maintenance placement
        as: CaseManager
        as_user_id: cm-1
        captures:
          err_cap: $.data.error_id
      assert:
      - SupportRequest.${sr_ok_id}.requested_cents == 57143
      - SupportRequest.${sr_ok_id}.admin_fee_cents == 2857 and total_charge_cents == 60000
      - the accepted request's total_charge_cents 60000 == FunderGrant.${g1_id}.per_participant_cap_cents exactly
      - SupportRequest.${sr_ok_id}.status == SUBMITTED
      - the second POST /support-requests returns error_id ${err_cap} == ERR_PARTICIPANT_CAP_EXCEEDED with http_status
        409
      - the refused request would have computed requested_cents 57144, admin_fee_cents 2857, total_charge_cents 60001
      - GET /support-requests?grant_id=${g1_id} returns total_count == 1
      - FunderGrant.${g1_id}.open_request_count == 1 and committed_cents == 0
