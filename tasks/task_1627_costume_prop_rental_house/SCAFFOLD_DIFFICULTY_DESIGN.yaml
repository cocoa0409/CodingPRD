            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PC-1", coverage_cents: 600000, effective_date: "2026-01-01", expiry_date: "2027-06-30" }, as: HouseAdmin, captures: { cert_r: $.data.id } }
