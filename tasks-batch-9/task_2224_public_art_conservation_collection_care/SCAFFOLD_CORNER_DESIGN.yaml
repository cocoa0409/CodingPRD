      - name: survey_finalization_cascade_reaches_the_pool_balance
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: finalize_supersedes_visit_then_releases_allocation_then_credits_pool
          rationale: "That §1.8 instance already walks all four hops of CASCADE A end to end - survey FINALIZED, artwork TREATMENT_REQUIRED, the non-conservator SCHEDULED visit ABORTED with SUPERSEDED_BY_TREATMENT, its allocation RELEASED with VISIT_ABORTED and the pool balance restored to 20527500 - including the conditional skip for a protocol whose requires_conservator is true. A second corner instance would repeat the same chain with no new claim."
      - name: deaccession_execution_cascade_refunds_every_downstream_reservation
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: deaccession_execute_withdraws_proposal_aborts_visit_and_refunds_two_allocations
          rationale: "CASCADE B's four hops - custody terminal, proposal WITHDRAWN plus visit ABORTED plus consultation LAPSED plus notice VOID, both allocations RELEASED, pool restored - are exercised in one §1.8 chain with the depth-3-plus requirement already satisfied there."
      - name: assessment_revision_loop_is_cyclic_but_capped
        claim_type: cyclic_shape
        excluded_because:
          difficulty_instance: assessment_revision_loop_reenters_submitted_until_round_cap
          rationale: "The SUBMITTED -> REVISION_REQUESTED -> SUBMITTED loop, the restamping of submitted_by_user_id on each round and the ERR_REVISION_LIMIT_REACHED cap at two rounds are the entire content of that §1.8 instance."
      - name: artwork_custody_and_conservation_are_independent_dimensions
        claim_type: parallel_shape
        excluded_because:
          difficulty_instance: artwork_custody_and_conservation_dimensions_move_independently
          rationale: "The parallel-dimension claim - a work in IN_STORAGE while simultaneously TREATMENT_REQUIRED, with each dimension moved by a different trigger - is fully covered there."
      - name: visit_start_is_guarded_by_the_artwork_custody_dimension
        claim_type: guarded_transition
        excluded_because:
          difficulty_instance: visit_start_depends_on_artwork_custody_dimension
          rationale: "The cross-entity guard on SCHEDULED -> IN_PROGRESS (custody must be ON_VIEW or IN_STORAGE, else ERR_ARTWORK_CUSTODY_INVALID) is exactly that §1.8 instance's subject."

