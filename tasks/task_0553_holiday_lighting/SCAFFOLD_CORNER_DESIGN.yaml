              captures: { rd_id: $.data.id, rd_v0: $.data.version }
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL", scheduled_date: "2026-12-13T08:00:00Z" }
              as: Dispatcher
              captures: { job_a: $.data.id }
            - call: "POST /route-assignments"
              payload: { route_day_id: "${rd_id}", job_id: "${job_a}", window_start: "2026-12-13T08:00:00Z", window_end: "2026-12-13T09:00:00Z", expected_route_day_version: "${rd_v0}" }
              as: Dispatcher
            - call: "POST /jobs"
              payload: { contract_id: "${contract_id}", job_type: "INSTALL", scheduled_date: "2026-12-13T10:00:00Z" }
              as: Dispatcher
              captures: { job_b: $.data.id }
          trigger:
            - call: "POST /route-assignments"
              payload: { route_day_id: "${rd_id}", job_id: "${job_b}", window_start: "2026-12-13T10:00:00Z", window_end: "2026-12-13T11:00:00Z", expected_route_day_version: "${rd_v0}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.error_id == ERR_STALE_VERSION"
            - "RouteDay.${rd_id}.booked_stops == 1"

  # =================================================================
  - section: consistency_model
    instances:
      - name: invoice_create_immediate_balance_visible
        claim_type: immediate
        grounds: [entities.Customer.fields.outstanding_balance_cents, calculations.invoice_total_rounding]
        distinguishing_aspect: "Immediately after POST /invoices, GET /customers/{id} reflects outstanding_balance_cents == the invoice total (5000) in the same synchronous flow."
        test_recipe:
          setup: ["A customer with no invoices."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Imm Owner", service_address: "132 Main St", roofline_feet: 100 }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /invoices"
              payload: { customer_id: "${cust_id}", source_type: "MANUAL", tax_rate_bps: 0, line_items: [ { description: "Install", amount_cents: 5000, taxable: false } ] }
              as: BillingAdmin
          trigger:
            - call: "GET /customers/${cust_id}"
              payload: {}
              as: BillingAdmin
              captures: { bal: $.data.outstanding_balance_cents }
          assert:
            - "Customer.${cust_id}.outstanding_balance_cents == 5000"

  # =================================================================
  # excluded_because stubs — corners already exercised by §1.8
  # =================================================================
  - section: errors
    instances:
      - name: error_route_day_full_on_over_capacity
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROUTE_DAY_FULL]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / route_capacity_last_slot_rejected
          rationale: "ERR_ROUTE_DAY_FULL is asserted as the trigger outcome of the named §1.8 boundary instance."
      - name: error_window_overlap_on_conflicting_booking
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / assignment_window_halfopen_overlap_rejected
          rationale: "ERR_WINDOW_OVERLAP is asserted as the trigger outcome of the named §1.8 overlap instance."
      - name: error_bin_occupied_on_buffered_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_BIN_OCCUPIED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / storage_bin_buffered_overlap_rejected
          rationale: "ERR_BIN_OCCUPIED is asserted as the trigger outcome of the named §1.8 buffered-overlap instance."
      - name: error_job_not_bookable_on_cancelled_job
        claim_type: violation_to_error
        grounds: ["errors[ERR_JOB_NOT_BOOKABLE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / assignment_referential_vs_temporal_conflict
          rationale: "ERR_JOB_NOT_BOOKABLE is asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: error_plan_not_active_on_paid_off_plan
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / payment_state_vs_overpayment_conflict
          rationale: "ERR_PLAN_NOT_ACTIVE is asserted as the winning error of the named §1.8 priority-conflict instance."
      - name: error_route_day_not_dispatched_on_start
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROUTE_DAY_NOT_DISPATCHED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / job_start_requires_routeday_dispatched
          rationale: "ERR_ROUTE_DAY_NOT_DISPATCHED is asserted as the trigger outcome of the named §1.8 cross-entity instance."

  - section: state_machines
    instances:
      - name: job_reschedule_cycle_covered
        claim_type: cyclic
        grounds: [state_machines.Job.SCHEDULED_to_RESCHEDULED, state_machines.Job.RESCHEDULED_to_SCHEDULED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / job_weather_reschedule_cycle
          rationale: "The SCHEDULED<->RESCHEDULED weather cycle is fully exercised by the named §1.8 instance."
      - name: contract_cancel_cascade_covered
        claim_type: Side Effect Execution
        grounds: [state_machines.SeasonalContract.ACTIVE_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / contract_cancel_cascade_depth3
          rationale: "The cancel cascade (job -> assignment -> booked_stops) is exercised by the named §1.8 instance."
