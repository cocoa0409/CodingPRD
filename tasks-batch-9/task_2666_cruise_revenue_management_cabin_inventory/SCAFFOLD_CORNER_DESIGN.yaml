            - call: "POST /bookings"
              payload: { sailing_id: "${sail_c}", cabin_category_id: "${cat_ia}", guest_id: "${g_bo}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_bo: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_ada}/confirm"
              payload: {}
              as: ReservationAgent
              captures: { e1: $.data.error_id }
