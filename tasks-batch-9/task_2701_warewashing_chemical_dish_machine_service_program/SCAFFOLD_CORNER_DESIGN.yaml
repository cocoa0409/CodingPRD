      - name: credit_hold_yields_to_the_agreement_state_rule_on_placement_creation
        claim_type: Priority conflict
        grounds:
          - validations.customer_not_on_credit_hold
          - validations.agreement_must_be_active
        excluded_because:
          difficulty_instance: placement_agreement_state_error_outranks_credit_hold
          rationale: |
            That §1.8 instance already violates the priority-70 credit-hold rule and a much earlier
            agreement-state rule in one request and pins the agreement error as the response, then flips
            each violation off in turn to show the ladder is ordered rather than accidental. Re-testing
            the same pair here would only duplicate its assertions.

