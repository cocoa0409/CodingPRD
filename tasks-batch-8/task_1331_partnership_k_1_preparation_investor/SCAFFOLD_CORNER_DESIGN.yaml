              captures: { e: "$.data.error_id" }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (409): issuer rev_1 == recorded preparer rev_1"
            - "K1Amendment.${am}.status remains IN_REVIEW"

      - name: transfer_settle_before_settlement_date_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=8]", "errors[ERR_TAX_YEAR_WINDOW_CLOSED]"]
        distinguishing_aspect: "Temporal validation against the logical clock: with the clock at 2025-06-01, settling a transfer whose settlement_date is 2025-06-10 fails."
        test_recipe:
          setup: ["fund with two partners; CONFIRMED transfer (effective 2025-06-01, settlement 2025-06-10); logical clock at 2025-06-01"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund V20", ein: "22-4000021", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 6000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { t1: "$.data.id" }
            - call: "POST /funds/partners"
