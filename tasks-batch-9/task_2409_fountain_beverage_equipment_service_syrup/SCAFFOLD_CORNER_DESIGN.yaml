              as_user_id: "tech-1"
            - call: "POST /fountain-network/service-calls/${sc}/dispatch"
              payload: { van_code: "VAN-7", scheduled_window_start: "2026-08-02T13:00:00Z", scheduled_window_end: "2026-08-02T15:00:00Z" }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /fountain-network/service-calls/${sc}/arrive-on-site"
              payload: {}
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /fountain-network/service-calls/${sc}/escalate"
              payload: { escalation_reason_code: "PART_UNAVAILABLE" }
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "POST /fountain-network/service-calls/${sc}/dispatch"
