# =============================================================================
# §1.9 Scaffold Corner Design — task_1231_industrial_laundry_plant
# Breadth coverage: every testable claim of §1.1–§1.7 not already probed by §1.8
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: plant_create_returns_201_with_defaults
        claim_type: creation
        grounds: [entities.Plant, endpoints]
        distinguishing_aspect: "POST /plants with all required fields → 201; id/created_at/updated_at/version populated; version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id, p_version: $.data.version }
          assert:
            - "p_version == 1"
            - "response.p_id is a UUID"

      - name: plant_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Plant, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required reject_rate_alert_pct → ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plants"
              payload: { name: "P", par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: customer_get_nonexistent_returns_not_found
        claim_type: not_found
        grounds: [entities.Customer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{random-uuid} → ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Plant P exists"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: sort_item_reject_reason_forbidden_on_accepted
        claim_type: type_constraints
        grounds: [entities.SortItem.fields.reject_reason, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "disposition=ACCEPTED with reject_reason present → ERR_INVALID_REQUEST (reject_reason allowed only on REJECTED)."
        test_recipe:
          setup: ["Plant, category, customer, route dispatched, stop picked up, cart received, batch OPEN"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "TOWEL", piece_weight_lb: 0.5, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 500, cog_wash_rate_cents_per_lb: 120 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 5.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 5.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 5, disposition: "ACCEPTED", reject_reason: "STAIN" }
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: utility_reading_duplicate_period_month_rejected
        claim_type: type_constraints
        grounds: [entities.UtilityReading, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "(plant_id, period_month) unique on UtilityReading (common_fields:false — immutable, append-only, no version/updated_at fields); second POST with the same period_month → ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Plant P; one reading posted for 2026-05"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/utility-readings"
              payload: { period_month: "2026-05", kwh_used: 1000, gallons_used: 2000, clean_lbs_processed: 1000, kwh_rate_cents: 10, gallon_rate_cents: 2 }
              as: BillingClerk
          trigger:
            - call: "POST /plants/${p_id}/utility-readings"
              payload: { period_month: "2026-05", kwh_used: 9999, gallons_used: 9999, clean_lbs_processed: 1000, kwh_rate_cents: 10, gallon_rate_cents: 2 }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE"

      - name: garment_duplicate_chip_code_rejected
        claim_type: type_constraints
        grounds: [entities.Garment.fields.chip_code, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "chip_code is globally unique; second register with same chip_code → ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Plant P; category TOWEL; chip-tracking customer C; garment CHIP-X registered"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "TOWEL", piece_weight_lb: 0.5, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 500, cog_wash_rate_cents_per_lb: 120 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "RENTAL", chip_tracking_enabled: true, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /garments/register"
              payload: { customer_id: "${c_id}", category_id: "${cat_id}", chip_code: "CHIP-X" }
              as: PlantAdmin
          trigger:
            - call: "POST /garments/register"
              payload: { customer_id: "${c_id}", category_id: "${cat_id}", chip_code: "CHIP-X" }
              as: PlantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE"

      - name: system_fields_ignore_client_input
        claim_type: system_fields
        grounds: [entities.Customer]
        distinguishing_aspect: "Client-supplied id/version/account_balance_cents on create are ignored; server returns version=1, account_balance_cents=0."
        test_recipe:
          setup: ["Plant P"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 1000 }
              as: PlantAdmin
              captures: { ver: $.data.version, bal: $.data.account_balance_cents }
          assert:
            - "ver == 1"
            - "bal == 0"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: route_dispatch_without_stops_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Route.PLANNED_to_DISPATCHED, "errors[ERR_ROUTE_HAS_NO_STOPS]"]
        distinguishing_aspect: "Dispatch on a route with zero stops → ERR_ROUTE_HAS_NO_STOPS."
        test_recipe:
          setup: ["Plant P; route R with no stops"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ROUTE_HAS_NO_STOPS"

      - name: cart_receive_before_pickup_rejected_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.SoiledCart.DECLARED_to_RECEIVED, "errors[ERR_STOP_NOT_PICKED_UP]"]
        distinguishing_aspect: "Cart receive requires parent stop PICKED_UP; on a stop still ARRIVED the receive is rejected — but carts only exist after pickup, so this exercises the state guard via a second receive on an already-RECEIVED cart (ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Full pickup + receive done for the only cart"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 5.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 5.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: sort_batch_lock_empty_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.SortBatch.OPEN_to_LOCKED, "errors[ERR_EMPTY_SORT_BATCH]"]
        distinguishing_aspect: "Lock with total_sorted_pieces == 0 → ERR_EMPTY_SORT_BATCH (422)."
        test_recipe:
          setup: ["Pipeline through cart receive; batch OPEN with no items"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 5.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 5.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EMPTY_SORT_BATCH"

      - name: wash_load_terminal_finished_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WashLoad]
        distinguishing_aspect: "From FINISHED every action (start, finish-cycle, record-test, bypass-test, request-rewash, unload, cancel) → ERR_INVALID_STATE."
        test_recipe:
          setup: ["Full pipeline: load FINISHED via bypass-test path"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "TOWEL", piece_weight_lb: 0.5, wash_formula_code: "WF_STANDARD", hygienic_test_required: false, replacement_cost_cents: 500, cog_wash_rate_cents_per_lb: 120 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HOSPITALITY", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 5.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 5.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 10, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads"
              payload: { batch_id: "${b_id}", category_id: "${cat_id}", machine_id: "M1", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T09:00:00Z" }
              as: PlantOperator
              captures: { l_id: $.data.id }
            - call: "POST /wash-loads/${l_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/bypass-test"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/unload"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /wash-loads/${l_id}/cancel"
              payload: {}
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: wash_load_record_test_rewash_limit_reached
        claim_type: precondition_enforcement
        grounds: [state_machines.WashLoad.TESTED_FAIL_to_REWASH_PENDING, "errors[ERR_REWASH_LIMIT_REACHED]"]
        distinguishing_aspect: "After two rewashes (rewash_count == 2), a third request-rewash → ERR_REWASH_LIMIT_REACHED."
        test_recipe:
          setup: ["GOWN load, hygienic test required; fail → rewash → start → finish-cycle → fail → rewash (count=2); currently in REWASH_PENDING after 2nd rewash; start again, finish, fail"]
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
              captures: { p_id: $.data.id }
            - call: "POST /plants/${p_id}/linen-categories"
              payload: { code: "GOWN", piece_weight_lb: 1.5, wash_formula_code: "WF_STANDARD", hygienic_test_required: true, replacement_cost_cents: 3000, cog_wash_rate_cents_per_lb: 200 }
              as: PlantAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /plants/${p_id}/customers"
              payload: { name: "C", customer_kind: "HEALTHCARE", billing_mode: "COG", chip_tracking_enabled: false, credit_limit_cents: 100000000 }
              as: PlantAdmin
              captures: { c_id: $.data.id }
            - call: "POST /plants/${p_id}/routes"
              payload: { service_date: "2026-05-02", driver_name: "D1" }
              as: RouteDriver
              captures: { r_id: $.data.id }
            - call: "POST /routes/${r_id}/stops"
              payload: { customer_id: "${c_id}", sequence_index: 1, declared_soiled_weight_lb: 30.0 }
              as: RouteDriver
              captures: { s_id: $.data.id }
            - call: "POST /routes/${r_id}/dispatch"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/arrive"
              payload: {}
              as: RouteDriver
            - call: "POST /stops/${s_id}/pickup"
              payload: { carts: [ { cart_tag: "CART-1", scale_weight_lb: 30.0 } ] }
              as: RouteDriver
            - call: "GET /stops/${s_id}/carts"
              as: PlantOperator
              captures: { cart_id: "$.data[0].id" }
            - call: "POST /carts/${cart_id}/receive"
              payload: {}
              as: PlantOperator
            - call: "POST /sort-batches"
              payload: { stop_id: "${s_id}" }
              as: PlantOperator
              captures: { b_id: $.data.id }
            - call: "POST /sort-batches/${b_id}/items"
              payload: { category_id: "${cat_id}", pieces: 20, disposition: "ACCEPTED" }
              as: PlantOperator
            - call: "POST /sort-batches/${b_id}/lock"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads"
              payload: { batch_id: "${b_id}", category_id: "${cat_id}", machine_id: "M1", scheduled_start: "2026-05-02T08:00:00Z", scheduled_end: "2026-05-02T09:00:00Z" }
              as: PlantOperator
              captures: { l_id: $.data.id }
            - call: "POST /wash-loads/${l_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/record-test"
              payload: { outcome: "FAIL" }
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/request-rewash"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/record-test"
              payload: { outcome: "FAIL" }
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/request-rewash"
              payload: {}
              as: PlantOperator
          trigger:
            - call: "POST /wash-loads/${l_id}/start"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/finish-cycle"
              payload: {}
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/record-test"
              payload: { outcome: "FAIL" }
              as: PlantOperator
            - call: "POST /wash-loads/${l_id}/request-rewash"
              payload: {}
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REWASH_LIMIT_REACHED"

      - name: delivery_dispute_without_shortfall_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Delivery.DELIVERED_to_DISPUTED, "errors[ERR_NO_SHORTAGE]"]
        distinguishing_aspect: "Dispute on a delivery with shortfall_pieces == 0 → ERR_NO_SHORTAGE (422)."
        test_recipe:
          setup: ["Full delivery with pieces_delivered == pieces_promised (no shortfall)"]
          setup_api_calls:
            - call: "POST /plants"
