              as: TitleIXCoordinator
              as_user_id: "${coord_id}"
              captures: { d1_id: $.data.id }
            - { call: "GET /api/cases/${case_id}", as: TitleIXCoordinator, as_user_id: "${coord_id}", captures: { v1: $.data.version } }
            - call: "POST /api/cases/${case_id}/no-contact-directives"
              payload: { party_side: "RESPONDENT", restrictions: ["ELECTRONIC"], effective_from: "2026-08-09T23:59:59Z", effective_to: "2026-08-20T00:00:00Z", expected_case_version: "${v1}" }
