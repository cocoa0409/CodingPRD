      - name: monthly_minimum_billable_fee_exactly_covers_minimum
        grounds:
          - calculations.minimum_fee_reconciliation
          - calculations.statement_net_payable (step 3 -> step 4)
          - constants.MINIMUM_SHARE_PCT
