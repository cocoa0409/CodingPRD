      - name: bom_release_obsolete_cancel_depth_three_cascade
        grounds:
          - state_machines.Bom.DRAFT_to_RELEASED
          - state_machines.Bom.RELEASED_to_OBSOLETE
          - state_machines.WorkOrder.PLANNED_to_CANCELLED
          - entities.Bom.fields.status
          - entities.WorkOrder.fields.status
        distinguishing_aspect: |
          Depth-3 transitive chain from a different trigger (BOM release): releasing
          rev B (hop1: B->RELEASED) cascades the superseded rev A to OBSOLETE (hop2,
          caused by B's release) which in turn cancels A's PLANNED WorkOrder (hop3,
          caused by A becoming OBSOLETE). Distinct trigger and propagation pattern
          from the rework cascade.
        test_recipe:
          setup:
            - "RELEASED BOM rev A with one line; a PLANNED WorkOrder anchored to rev A; a DRAFT rev B that supersedes rev A and has a line on the same approved part."
          setup_api_calls:
            - call: "POST /parts"
