  # ===========================================================================
  # Rule 6 — boundary_precision_check (>= 2 instances, different metrics)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: config_lock_deadline_inclusive_boundary
        grounds:
          - entities.VehicleOrder.fields.configuration_lock_deadline
          - state_machines.VehicleOrder.PLACED_to_CONFIG_LOCKED
          - errors[ERR_CONFIG_LOCK_DEADLINE_PASSED]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "configuration_lock_deadline is inclusive: with placed_at 2026-09-01T00:00:00Z the deadline is 2026-09-15T00:00:00Z, so a change at exactly that instant is rejected by the deadline rule while the same call one millisecond earlier succeeds — an off-by-one on <= versus < flips the error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED; delivery center"
            - "Order placed so configuration_lock_deadline is 2026-09-15T00:00:00Z; the client reads the order version before any clock advance"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - *k_cfg_y
            - call: "POST /v1/vehicle-configurations/${cfg_y_id}/options"
              payload: { option_sku: "TOW_HITCH", option_category: "TOWING", price_cents: 130000 }
              as: PlatformAdmin
              captures: { opt_tow_id: $.data.id }
            - *k_buyer_dv
            - *k_verify_dv
            - *k_order_dv
            - *k_place_dv
            - call: "GET /v1/orders/${order_dv_id}"
              payload: {}
              as: Buyer
              as_user_id: "${buyer_dv_id}"
              captures: { order_dv_v: $.data.version, lock_deadline: $.data.configuration_lock_deadline }
          trigger:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/configuration-changes"
              payload: { add_option_ids: ["${opt_tow_id}"], remove_option_ids: [], expected_order_version: "${order_dv_v}" }
              as: Buyer
              as_user_id: "${buyer_dv_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "\"${lock_deadline}\" == 2026-09-15T00:00:00Z"
            - "the change attempt at exactly the deadline returns 400 with error_id == ERR_CONFIG_LOCK_DEADLINE_PASSED"
            - "GET /v1/orders/${order_dv_id} still reports status PLACED and the option list without ${opt_tow_id}"
            - "re-issuing the same call with current_utc 2026-09-14T23:59:59.999Z succeeds with 200 and a configuration that now contains ${opt_tow_id}"

      - name: mileage_deduction_thresholds_at_49999_50000_50001
        grounds:
          - calculations.trade_in_net_credit_cents
          - entities.TradeInAppraisal.fields.net_credit_cents
          - errors[ERR_APPRAISAL_OFFER_EXPIRED]
          - errors[ERR_APPRAISAL_EXPIRES_BEFORE_DELIVERY]
        distinguishing_aspect: "The mileage deduction uses a strict > threshold on odometer value: 49999 and 50000 miles both net 860000 cents while 50001 miles nets 859988, so an off-by-one on the threshold comparison is observable to the cent."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime ENACTED; delivery center"
            - "Three appraisals on one order, all with gross offer 900000 and reconditioning 40000, differing only in mileage 49999, 50000 and 50001, each valid until 2026-10-15T00:00:00Z"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - *k_order_dv
            - *k_place_dv
            - *k_pay_dv
            - call: "POST /v1/orders/${order_dv_id}/trade-in-appraisals"
              payload: { trade_vin: "5YJ3E1EA7PF000903", mileage: 49999, gross_offer_cents: 900000, reconditioning_estimate_cents: 40000, offer_valid_until: "2026-10-15T00:00:00Z" }
              as: TradeInSpecialist
              captures: { ap_low_id: $.data.id }
            - &k_ap_mid
              call: "POST /v1/orders/${order_dv_id}/trade-in-appraisals"
              payload: { trade_vin: "5YJ3E1EA7PF000904", mileage: 50000, gross_offer_cents: 900000, reconditioning_estimate_cents: 40000, offer_valid_until: "2026-10-15T00:00:00Z" }
              as: TradeInSpecialist
              captures: { ap_mid_id: $.data.id }
            - call: "POST /v1/orders/${order_dv_id}/trade-in-appraisals"
              payload: { trade_vin: "5YJ3E1EA7PF000905", mileage: 50001, gross_offer_cents: 900000, reconditioning_estimate_cents: 40000, offer_valid_until: "2026-10-15T00:00:00Z" }
              as: TradeInSpecialist
              captures: { ap_high_id: $.data.id }
          trigger:
            - call: "POST /v1/orders/${order_dv_id}/trade-in-appraisals/${ap_low_id}/appraise"
              payload: {}
              as: TradeInSpecialist
              captures: { net_low: $.data.net_credit_cents }
            - call: "POST /v1/orders/${order_dv_id}/trade-in-appraisals/${ap_mid_id}/appraise"
              payload: {}
              as: TradeInSpecialist
              captures: { net_mid: $.data.net_credit_cents }
            - call: "POST /v1/orders/${order_dv_id}/trade-in-appraisals/${ap_high_id}/appraise"
              payload: {}
              as: TradeInSpecialist
              captures: { net_high: $.data.net_credit_cents }
          assert:
            - "\"${net_low}\" == 860000 (49000 miles of headroom, no deduction)"
            - "\"${net_mid}\" == 860000 (exactly at the threshold, still no deduction)"
            - "\"${net_high}\" == 859988 (one mile past the threshold deducts 12 cents)"
            - "TradeInAppraisal.${ap_low_id}.net_credit_cents == 860000 and TradeInAppraisal.${ap_high_id}.net_credit_cents == 859988"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2 instances, different pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: order_placement_gated_by_jurisdiction_activation
        grounds:
          - state_machines.VehicleOrder.DRAFT_to_PLACED
          - state_machines.StateJurisdiction.DRAFT_to_ENACTED
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ORDER_FEE_UNPAID]
        distinguishing_aspect: "VehicleOrder.DRAFT to PLACED is gated on the StateJurisdiction pair: the same order with the fee already settled is rejected while the regime is DRAFT and accepted the instant the regime reaches ENACTED, so the order's transitions depend on a different entity's state."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; a DRAFT (not yet enacted) TX regime; delivery center"
            - "Order I1 placed is NOT possible yet: buyer verified, order created, order fee settled, regime still DRAFT"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_center_tx
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - *k_order_dv
            - *k_pay_dv
          trigger:
            - call: "POST /v1/orders/${order_dv_id}/place"
              payload: { expected_order_version: "${order_dv_v}" }
              as: Buyer
              as_user_id: "${buyer_dv_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /v1/jurisdictions/${jur_tx_id}/enact"
              payload: {}
              as: PlatformAdmin
              captures: { jur_state: $.data.status }
            - call: "POST /v1/orders/${order_dv_id}/place"
              payload: { expected_order_version: "${order_dv_v}" }
              as: Buyer
              as_user_id: "${buyer_dv_id}"
              captures: { order_state: $.data.status }
          assert:
            - "the first placement attempt returns 409 with error_id == ERR_INVALID_STATE"
            - "\"${jur_state}\" == ENACTED"
            - "\"${order_state}\" == PLACED"
            - "VehicleOrder.${order_dv_id}.configuration_lock_deadline == 2026-09-15T00:00:00Z"

      - name: appointment_confirmation_gated_by_order_readiness_posture
        grounds:
          - state_machines.DeliveryAppointment.BOOKED_to_CONFIRMED
          - state_machines.DeliveryAppointment.AT_RISK_to_CONFIRMED
          - entities.VehicleOrder.fields.delivery_readiness_posture
          - calculations.delivery_readiness_posture
        distinguishing_aspect: "DeliveryAppointment.BOOKED to CONFIRMED is gated on the VehicleOrder pair: a batch delay drops the order's posture back to FROZEN and returns the appointment to AT_RISK, and confirmation is refused until the new window is rebooked — so the appointment's valid transitions depend on the order's derived posture."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime with transport_lead_days 7; delivery center"
            - "Order J1 walked to AT_DELIVERY_CENTER with posture READY, appointment booked for 2026-09-18T15:00 to 16:00"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - *k_center_tx
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - *k_order_dv
            - *k_place_dv
            - *k_pay_dv
            - *k_lock_dv
            - &k_batch_j
              call: "POST /v1/production-batches"
              payload: { factory_code: "AUSTIN", model_code: "MODEL_Y_LR_AWD", unit_capacity: 1, planned_completion_at: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { batch_j_id: $.data.id }
            - call: "POST /v1/production-batches/${batch_j_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/production-batches/${batch_j_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000113" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/allocation"
              payload: { batch_id: "${batch_j_id}", expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/orders/${order_dv_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
              captures: { posture_ready: $.data.delivery_readiness_posture }
            - call: "POST /v1/delivery-appointments"
              payload: { order_id: "${order_dv_id}", delivery_center_id: "${center_tx_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-18T15:00:00Z", scheduled_end: "2026-09-18T16:00:00Z", expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
              captures: { appt_j_id: $.data.id, order_dv_v: $.data.version }
            - call: "POST /v1/delivery-appointments/${appt_j_id}/confirm"
              payload: {}
              as: DeliveryAdvisor
          trigger:
            - call: "POST /v1/production-batches/${batch_j_id}/delay"
              payload: { delay_days: 9 }
              as: PlatformAdmin
              captures: { batch_state: $.data.status }
            - call: "GET /v1/delivery-appointments/${appt_j_id}"
              payload: {}
              as: DeliveryAdvisor
              captures: { appt_state: $.data.status }
          assert:
            - "\"${posture_ready}\" == READY"
            - "\"${batch_state}\" == DELAYED"
            - "\"${appt_state}\" == AT_RISK — the order's posture change forced the appointment out of CONFIRMED"
            - "VehicleOrder.${order_dv_id}.delivery_readiness_posture == FROZEN and VehicleOrder.${order_dv_id}.status == AT_DELIVERY_CENTER"
            - "POST /v1/delivery-appointments/${appt_j_id}/rebook with scheduled_start 2026-09-30T15:00:00Z and scheduled_end 2026-09-30T16:00:00Z succeeds with 200 and returns status CONFIRMED, because the rebook also returns the order to DELIVERY_SCHEDULED and therefore to a non-FROZEN posture"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: delivery_bay_buffered_gap_rejects_sub_buffer_booking
        grounds:
          - validations[priority=11]
          - entities.StateJurisdiction.fields.delivery_buffer_minutes
          - errors[ERR_DELIVERY_SLOT_CONFLICT]
          - entities.DeliveryCenter.fields.booked_slot_count
        distinguishing_aspect: "Handover bays use buffered half-open intervals: with a 60-minute jurisdiction buffer, a 2026-09-22T16:30 start is 30 minutes after the prior 16:00 end and is rejected, while a 2026-09-22T17:00 start sits exactly on the buffer and is accepted — different geometry from the van rule, which has no buffer at all."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; TX regime with delivery_buffer_minutes 60; one delivery center with bay_count 1; two orders both AT_DELIVERY_CENTER at that center"
          setup_api_calls:
            - *k_clock
            - *k_jur_tx
            - *k_enact_tx
            - &k_center_bay1
              call: "POST /v1/delivery-centers"
              payload: { center_name: "El Paso Delivery", center_kind: "DELIVERY_CENTER", state_code: "TX", bay_count: 1, home_delivery_radius_miles: 50, van_count: 0 }
              as: PlatformAdmin
              captures: { center_bay1_id: $.data.id }
            - *k_cfg_y
            - *k_buyer_dv
            - *k_verify_dv
            - &k_buyer_k2
              call: "POST /v1/buyers"
              payload: { full_name: "Kim Buffer", email: "kim.buffer@example.com", residency_state_code: "TX" }
              as: Anonymous
              captures: { buyer_k2_id: $.data.id }
            - call: "POST /v1/buyers/${buyer_k2_id}/identity-verification"
              payload: {}
              as: PlatformAdmin
            - *k_order_dv
            - call: "POST /v1/orders"
              payload: { buyer_id: "${buyer_k2_id}", configuration_id: "${cfg_y_id}", jurisdiction_id: "${jur_tx_id}", delivery_center_id: "${center_bay1_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { order_k2_id: $.data.id, order_k2_v: $.data.version }
            - *k_place_dv
            - call: "POST /v1/orders/${order_k2_id}/place"
              payload: { expected_order_version: "${order_k2_v}" }
              as: Buyer
              as_user_id: "${buyer_k2_id}"
              captures: { order_k2_v: $.data.version }
            - *k_pay_dv
            - call: "POST /v1/_payments/simulate"
              payload: { order_id: "${order_k2_id}", outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - *k_lock_dv
            - call: "POST /v1/orders/${order_k2_id}/lock-configuration"
              payload: { expected_order_version: "${order_k2_v}" }
              as: PlatformAdmin
              captures: { order_k2_v: $.data.version }
            - &k_batch_k
              call: "POST /v1/production-batches"
              payload: { factory_code: "AUSTIN", model_code: "MODEL_Y_LR_AWD", unit_capacity: 2, planned_completion_at: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { batch_k_id: $.data.id }
            - call: "POST /v1/production-batches/${batch_k_id}/start"
              payload: {}
              as: PlatformAdmin
            - &k_unit_114
              call: "POST /v1/production-batches/${batch_k_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000114" }
              as: PlatformAdmin
            - &k_unit_115
              call: "POST /v1/production-batches/${batch_k_id}/allocation-units"
              payload: { vin: "7SAYGDEE1PF000115" }
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/allocation"
              payload: { batch_id: "${batch_k_id}", expected_order_version: "${order_dv_v}" }
              as: PlatformAdmin
              captures: { order_dv_v: $.data.version }
            - call: "POST /v1/orders/${order_k2_id}/allocation"
              payload: { batch_id: "${batch_k_id}", expected_order_version: "${order_k2_v}" }
              as: PlatformAdmin
              captures: { order_k2_v: $.data.version }
            - call: "POST /v1/orders/${order_dv_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_k2_id}/dispatch-to-transport"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_dv_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/orders/${order_k2_id}/arrive-at-center"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/delivery-appointments"
              payload: { order_id: "${order_dv_id}", delivery_center_id: "${center_bay1_id}", delivery_mode: "CENTER", scheduled_start: "2026-09-22T15:07:00Z", scheduled_end: "2026-09-22T16:00:00Z", expected_order_version: "${order_dv_v}" }
              as: DeliveryAdvisor
              captures: { appt_k1_id: $.data.id, order_dv_v: $.data.version }
