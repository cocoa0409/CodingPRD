          - entities.PolicyTerm.fields.effective_date
          - entities.PolicyTerm.fields.term_index
          - calculations.claims_made_step_premium
          - concurrency_rules.term-create-stale-policy
        distinguishing_aspect: |
          Because a term period is the half-open interval [effective_date, expiration_date), a
          renewal starting exactly on the prior term's 2027-08-01 expiration is accepted as
          term_index 2 at step factor 0.60, whereas a third term starting 2028-02-01 inside that
          renewal's window is rejected with ERR_TERM_PERIOD_OVERLAP (409).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured, CREDENTIALED through 2028-01-01."
            - "CLAIMS_MADE policy, prior_acts_step_credit 0, with a first term 2026-08-01 -> 2027-08-01 in IN_FORCE."
            - "The policy version is re-read before each term creation so that the OCC guard never masks the overlap check."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              captures: { term_a1: $.data.id }
            - call: "POST /mpl/policy-terms/${term_a1}/issuance"
              payload: {}
              as: UnderwritingOfficer
            - call: "GET /mpl/policies/${pol_a}"
              payload: {}
              as: UnderwritingOfficer
              captures: { pol_a_v1: $.data.version }
          trigger:
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2027-08-01", expiration_date: "2028-08-01", predecessor_term_id: "${term_a1}", expected_policy_version: "${pol_a_v1}" }
              as: UnderwritingOfficer
              captures: { term_a2: $.data.id }
            - call: "GET /mpl/policies/${pol_a}"
              payload: {}
              as: UnderwritingOfficer
              captures: { pol_a_v2: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2028-02-01", expiration_date: "2029-02-01", predecessor_term_id: "${term_a2}", expected_policy_version: "${pol_a_v2}" }
              as: UnderwritingOfficer
              captures: { err_overlap: $.data.error_id }
          assert:
            - "PolicyTerm.${term_a2}.term_index == 2"
            - "PolicyTerm.${term_a2}.rating_variant == RENEWAL_PROSPECTIVE"
            - "PolicyTerm.${term_a2}.claims_made_step_year == 2"
            - "PolicyTerm.${term_a2}.step_factor == 0.60"
            - "PolicyTerm.${term_a2}.premium_manual == 33060.00"
            - "PolicyTerm.${term_a2}.premium_net == 33060.00"
            - "PolicyTerm.${term_a2}.administrative_fee == 500.00"
            - "PolicyTerm.${term_a2}.guaranty_fund_assessment == 419.50"
            - "PolicyTerm.${term_a2}.term_total == 33979.50"
            - "PolicyTerm.${term_a2}.status == DRAFT"
            - "${err_overlap} == ERR_TERM_PERIOD_OVERLAP"
            - "Policy.${pol_a}.version == ${pol_a_v2}"

      - name: tail_reporting_windows_are_closed_intervals_so_touching_endpoints_conflict
        grounds:
          - validations[priority=68]
          - calculations.tail_premium
          - entities.TailEndorsement.fields.reporting_window_end
          - state_machines.TailEndorsement.QUOTED_to_ISSUED
        distinguishing_aspect: |
          An ISSUED ERP_5YR tail runs the CLOSED window 2027-08-01 .. 2032-07-31, so a second tail
          effective 2032-07-31 shares exactly one date and must fail with ERR_TAIL_WINDOW_OVERLAP
          (409), while one effective 2032-08-01 is quoted with window end 2037-07-31.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured, CREDENTIALED through 2028-01-01."
            - "CLAIMS_MADE policy with one term 2026-08-01 -> 2027-08-01 rated at premium_manual 19285.00 and step_factor 0.35, issued into IN_FORCE."
            - "The clock is advanced to 2027-08-01T00:00:00Z so the term is EXPIRED and can trigger a tail; the mature basis is round(19285.00 / 0.35, 2) = 55100.00."
            - "A first ERP_5YR tail effective 2027-08-01 is quoted and ISSUED."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              captures: { term_a1: $.data.id }
            - call: "POST /mpl/policy-terms/${term_a1}/issuance"
              payload: {}
              as: UnderwritingOfficer
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /mpl/policies/${pol_a}/tail-endorsements"
              payload: { triggering_term_id: "${term_a1}", tail_type: "ERP_5YR", trigger_reason: "CARRIER_CHANGE", effective_date: "2027-08-01" }
              as: UnderwritingOfficer
              captures: { tail_1: $.data.id }
            - call: "POST /mpl/tail-endorsements/${tail_1}/issuance"
              payload: {}
              as: UnderwritingOfficer
          trigger:
            - call: "POST /mpl/policies/${pol_a}/tail-endorsements"
              payload: { triggering_term_id: "${term_a1}", tail_type: "ERP_5YR", trigger_reason: "PRACTICE_CLOSURE", effective_date: "2032-07-31" }
              as: UnderwritingOfficer
              captures: { err_tail: $.data.error_id }
            - call: "POST /mpl/policies/${pol_a}/tail-endorsements"
              payload: { triggering_term_id: "${term_a1}", tail_type: "ERP_5YR", trigger_reason: "PRACTICE_CLOSURE", effective_date: "2032-08-01" }
              as: UnderwritingOfficer
              captures: { tail_3: $.data.id }
          assert:
            - "PolicyTerm.${term_a1}.status == EXPIRED"
            - "TailEndorsement.${tail_1}.mature_premium_basis == 55100.00"
            - "TailEndorsement.${tail_1}.tail_factor == 1.55"
            - "TailEndorsement.${tail_1}.tail_premium == 85405.00"
            - "TailEndorsement.${tail_1}.reporting_window_end == 2032-07-31"
            - "TailEndorsement.${tail_1}.status == ISSUED"
            - "${err_tail} == ERR_TAIL_WINDOW_OVERLAP"
            - "TailEndorsement.${tail_3}.effective_date == 2032-08-01"
            - "TailEndorsement.${tail_3}.reporting_window_end == 2037-07-31"
            - "TailEndorsement.${tail_3}.tail_premium == 85405.00"
            - "TailEndorsement.${tail_3}.status == QUOTED"

  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: declined_assignment_restores_firm_capacity_counter_without_drift
        grounds:
          - state_machines.CounselAssignment.ASSIGNED_to_DECLINED
          - entities.DefenseCounselFirm.fields.open_assignment_count
          - entities.Claim.fields.counsel_reassignment_required
          - calculations.counsel_panel_selection
        distinguishing_aspect: |
          open_assignment_count must return to exactly its pre-assignment value 0 after the decline
          even though the assignment row survives in DECLINED, and the firm must stay ACTIVE on the
          panel while being excluded from this one claim's reselection pool.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured, IN_FORCE claims-made term."
            - "One ACTIVE panel firm (Halloran, quality_score 95) admitted in COOK_IL for OBSTETRIC_INJURY, starting at open_assignment_count 0."
            - "One COVERED claim with Halloran assigned, which lifts open_assignment_count to 1."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              captures: { term_a1: $.data.id }
            - call: "POST /mpl/policy-terms/${term_a1}/issuance"
              payload: {}
              as: UnderwritingOfficer
            - call: "POST /mpl/counsel-firms"
              payload: { firm_name: "Halloran Defense LLP", admitted_venue_codes: ["COOK_IL"], allegation_specialties: ["OBSTETRIC_INJURY"], blended_hourly_rate: 500.00, quality_score: 95, max_concurrent_assignments: 5, conflict_insured_ids: [] }
              as: ClaimsCommitteeApprover
              as_user_id: "appr-1"
              captures: { firm_h: $.data.id }
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-05", report_date: "2026-09-01", venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", demand_amount: 800000.00 }
              as: ClaimsAdjuster
              captures: { clm_a: $.data.id }
            - call: "POST /mpl/claims/${clm_a}/coverage-decision"
              payload: { coverage_status: "COVERED" }
              as: ClaimsAdjuster
            - call: "POST /mpl/claims/${clm_a}/counsel-assignments"
              payload: {}
              as: ClaimsAdjuster
              captures: { asg_h: $.data.id }
            - call: "GET /mpl/counsel-firms/${firm_h}"
              payload: {}
              as: ClaimsAdjuster
              captures: { firm_h_open_before: $.data.open_assignment_count }
          trigger:
            - call: "POST /mpl/counsel-assignments/${asg_h}/decline"
