            - "Second trigger: HTTP 409 with data.error_id == \"ERR_DUPLICATE_CODE\" (FenceProduct.code PANEL-CL-10 already exists)"
            - "Third trigger: HTTP 409 with data.error_id == \"ERR_INVALID_ADDON_CATEGORY\" (a GATE cannot be the panel product)"
            - "Fourth trigger: HTTP 409 with data.error_id == \"ERR_INVALID_ADDON_CATEGORY\" (a FENCE_PANEL cannot be an add-on line)"
