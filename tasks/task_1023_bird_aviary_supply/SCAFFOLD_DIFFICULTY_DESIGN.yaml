            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /boarding-reservations"
              payload: { customer_id: "${cust_id}", cage_id: "${cage_id}", planned_check_in: "2026-07-03T00:00:00Z", planned_check_out: "2026-07-05T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res1_id: $.data.id }
            - call: "POST /boarding-reservations"
              payload: { customer_id: "${cust_id}", cage_id: "${cage_id}", planned_check_in: "2026-07-06T00:00:00Z", planned_check_out: "2026-07-08T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T00:00:00Z" }
              as: StoreManager
            - call: "POST /boarding-reservations/${res1_id}/check-in"
              payload: {}
              as: AviaryStaff
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /boarding-reservations/${res2_id}/check-in"
              payload: {}
              as: AviaryStaff
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_NO_BOARDING_CAPACITY"
            - "BoardingReservation.${res2_id}.status == RESERVED (unchanged)"
            - "CageUnit.${cage_id}.current_occupancy == 1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cage_within_cleaning_buffer_rejected
        grounds:
          - validations[priority=10]
          - entities.BoardingReservation.fields.planned_check_in
          - entities.BoardingReservation.fields.planned_check_out
        distinguishing_aspect: |
          Cage overlap uses a 12h cleaning-buffer interval: a reservation starting only 6h after a prior reservation's
          planned_check_out is rejected with ERR_CAGE_TIME_CONFLICT even though the raw windows do not overlap — buffered semantics on CageUnit.
        test_recipe:
          setup:
            - "One BOARDING cage (capacity 2 to prove it is a buffer conflict, not a capacity conflict); R1 planned 07-03..07-05; clock 07-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ovl Cage", email: "ovlc@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /cage-units"
              payload: { label: "B4", cage_class: "BOARDING", capacity: 2, nightly_rate_cents: 3000 }
              as: StoreManager
              captures: { cage_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /boarding-reservations"
              payload: { customer_id: "${cust_id}", cage_id: "${cage_id}", planned_check_in: "2026-07-03T00:00:00Z", planned_check_out: "2026-07-05T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res1_id: $.data.id }
          trigger:
            - call: "POST /boarding-reservations"
              payload: { customer_id: "${cust_id}", cage_id: "${cage_id}", planned_check_in: "2026-07-05T06:00:00Z", planned_check_out: "2026-07-07T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_CAGE_TIME_CONFLICT (start only 6h after prior checkout, inside 12h buffer)"

      - name: station_slot_overlap_rejected_adjacent_allowed
        grounds:
          - validations[priority=11]
          - entities.GroomingAppointment.fields.slot_start
          - entities.GroomingAppointment.fields.slot_end
        distinguishing_aspect: |
          Grooming overlap uses half-open [slot_start, slot_end) with NO buffer: an appointment overlapping an existing one
          is rejected (ERR_STATION_TIME_CONFLICT) while a back-to-back appointment (end == next start) is accepted — adjacency allowed, geometrically different from the cage buffer, on a different resource.
        test_recipe:
          setup:
            - "One GroomingStation offering WING_TRIM; existing appointment A1 [10:00, 10:30) on 2026-07-10; clock 07-01."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Slot Sam", email: "slot@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /grooming-stations"
              payload: { label: "G1", service_types: [ "WING_TRIM" ] }
              as: StoreManager
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /grooming-appointments"
              payload: { customer_id: "${cust_id}", grooming_station_id: "${st_id}", service_type: "WING_TRIM", slot_start: "2026-07-10T10:00:00Z", slot_end: "2026-07-10T10:30:00Z", fee_cents: 1500 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { a1_id: $.data.id }
          trigger:
            - call: "POST /grooming-appointments"
              payload: { customer_id: "${cust_id}", grooming_station_id: "${st_id}", service_type: "WING_TRIM", slot_start: "2026-07-10T10:15:00Z", slot_end: "2026-07-10T10:45:00Z", fee_cents: 1500 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "POST /grooming-appointments"
              payload: { customer_id: "${cust_id}", grooming_station_id: "${st_id}", service_type: "WING_TRIM", slot_start: "2026-07-10T10:30:00Z", slot_end: "2026-07-10T11:00:00Z", fee_cents: 1500 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { a3_id: $.data.id, a3_status: $.data.status }
          assert:
            - "Overlapping [10:15,10:45) rejected: data.error_id == ERR_STATION_TIME_CONFLICT"
            - "Adjacent [10:30,11:00) accepted: GroomingAppointment.${a3_id}.status == BOOKED"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_units_conserved_on_cancel_build
        grounds:
          - state_machines.SpecialOrder.QUEUED_to_CANCELLED
          - calculations.inventory_conservation
          - entities.InventoryItem.fields.quantity_on_hand
          - entities.InventoryItem.fields.quantity_allocated
        distinguishing_aspect: |
          Conserved quantity = InventoryItem (quantity_on_hand + quantity_allocated). Creating a SpecialOrder allocates
          build_qty (10->7 on hand, 0->3 allocated) and cancel-build releases exactly build_qty (back to 10 on hand, 0 allocated) — the sum stays 10.
        test_recipe:
          setup:
            - "DRY InventoryItem with 10 on hand; SpecialOrder created with build_qty 3 (allocates 3)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Inv Ann", email: "inva@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { sku: "KIT-3", feed_kind: "DRY", quantity_on_hand: 10 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", cage_item_id: "${inv_id}", build_qty: 3, line_items: [ { unit_price_cents: 1000, quantity: 1, tax_rate: 0.0 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${ord_id}/cancel-build"
              payload: {}
              as: StoreManager
              captures: { build_status: $.data.build_status }
          assert:
            - "InventoryItem.${inv_id}.quantity_on_hand == 10"
            - "InventoryItem.${inv_id}.quantity_allocated == 0"
            - "Conserved: quantity_on_hand + quantity_allocated == 10 both before create and after cancel-build"

      - name: wallet_credits_conserved_on_order_refund
        grounds:
          - state_machines.SpecialOrder.PAID_to_REFUNDED
          - entities.Customer.fields.wallet_credit_cents
          - entities.SpecialOrder.fields.invoice_total_cents
        distinguishing_aspect: |
          Conserved quantity = Customer.wallet_credit_cents (money). Paying an order debits invoice_total (5000->4000) and a
          subsequent refund credits exactly invoice_total (4000->5000), leaving the wallet unchanged — a different conserved quantity than inventory units.
        test_recipe:
          setup:
            - "Customer with 5000 wallet; DRY inventory 5 on hand; SpecialOrder invoice_total 1000, PAID, then build CANCELLED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ref Roy", email: "ref@x.com" }
              as: StoreManager
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet/adjustments"
              payload: { amount_cents: 5000 }
              as: StoreManager
            - call: "POST /inventory-items"
              payload: { sku: "KIT-4", feed_kind: "DRY", quantity_on_hand: 5 }
              as: StoreManager
              captures: { inv_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", cage_item_id: "${inv_id}", build_qty: 1, line_items: [ { unit_price_cents: 1000, quantity: 1, tax_rate: 0.0 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id, total: $.data.invoice_total_cents }
            - call: "POST /special-orders/${ord_id}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /special-orders/${ord_id}/cancel-build"
              payload: {}
              as: StoreManager
          trigger:
            - call: "POST /special-orders/${ord_id}/refund"
              payload: {}
              as: StoreManager
              captures: { pay_status: $.data.payment_status }
          assert:
            - "Customer.${cust_id}.wallet_credit_cents == 5000"
            - "SpecialOrder.${ord_id}.payment_status == REFUNDED"
            - "Conserved: pay debit 1000 exactly reversed by refund credit 1000"
