        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-plan-change-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A plan change carrying the version observed before a successful plan change (which legitimately superseded the pending one and bumped Subscription.version) is rejected ERR_STALE_VERSION 412."
        test_recipe:
          setup:
            - "Plans A and B; URBAN household; subscription on A (version 1 observed at creation)"
            - "First plan-changes to B succeeds with the fresh version (subscription.version -> 2)"
          setup_api_calls:
            - call: "POST /coopcare/subscription-plans"
              payload: { plan_code: "OCCA", monthly_fee_cents: 2900, included_cleanings_per_period: 1, included_health_checks_per_period: 0, supply_discount_pct: 0, sitting_discount_pct: 0 }
