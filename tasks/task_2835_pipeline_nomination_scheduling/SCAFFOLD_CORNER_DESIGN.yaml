  - section: errors
    instances:
      - name: unknown_nomination_id_returns_nomination_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOMINATION_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid UUID that names no nomination returns 404 ERR_NOMINATION_NOT_FOUND
          rather than 403: the not-found check runs before the ownership check, so an unknown id does
          not leak whether some other shipper owns it.
        test_recipe:
          setup:
            - "Master data exists but no nomination has ever been submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
            - call: "POST /pipeline/shippers"
              payload: { shipper_code: "ALPHA", name: "Alpha Trading", credit_limit_usd: 250000 }
              as: TariffAdministrator
              captures: { alpha_id: "$.data.id" }
          trigger:
            - call: "GET /pipeline/nominations/00000000-0000-4000-8000-000000000901"
              payload: {}
              as: Shipper
              as_user_id: "${alpha_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_NOMINATION_NOT_FOUND"
            - "the response body carries a human-readable message and no nomination payload"

      - name: unknown_batch_ticket_id_returns_batch_ticket_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_BATCH_TICKET_NOT_FOUND]
        distinguishing_aspect: |
          Both the read and the inject action agree on the same 404 for an unknown ticket id: the
          resource lookup precedes every state, quality and cycle-status guard, so an unknown id never
          surfaces as ERR_TICKET_INVALID_STATE or ERR_CYCLE_INVALID_STATE.
        test_recipe:
          setup:
            - "No batch ticket has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
          trigger:
            - call: "GET /pipeline/batch-tickets/00000000-0000-4000-8000-000000000902"
              payload: {}
              as: PipelineScheduler
              captures: { err: "$.data.error_id" }
            - call: "POST /pipeline/batch-tickets/00000000-0000-4000-8000-000000000902/inject"
              payload: { measured_sulfur_ppm: 9, measured_rvp_psi: 8, injected_bbl: 1000 }
              as: TerminalOperator
              captures: { err2: "$.data.error_id" }
          assert:
            - "HTTP 404 on both calls"
            - "data.error_id == ERR_BATCH_TICKET_NOT_FOUND on both calls"
            - "no BatchTicket row is created by the failed inject"

      - name: unknown_maintenance_event_id_returns_maintenance_event_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_MAINTENANCE_EVENT_NOT_FOUND]
        distinguishing_aspect: |
          The notify action on an unknown maintenance event id returns 404
          ERR_MAINTENANCE_EVENT_NOT_FOUND, never the 422 notice-period violation: the row must exist
          before its window can be measured against the notice requirement.
        test_recipe:
          setup:
            - "No maintenance event has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PipelineScheduler
          trigger:
            - call: "POST /pipeline/maintenance-events/00000000-0000-4000-8000-000000000903/notify"
              payload: {}
              as: PipelineScheduler
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_MAINTENANCE_EVENT_NOT_FOUND"
            - "GET /pipeline/maintenance-events returns total_count == 0"

      - name: unknown_settlement_id_returns_settlement_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_SETTLEMENT_NOT_FOUND]
        distinguishing_aspect: |
          Certifying an unknown settlement id yields 404 ERR_SETTLEMENT_NOT_FOUND rather than the
          403 segregation-of-duties refusal, even when the caller is the same user who published the
          only cycle: identity checks are only reached once the settlement row is resolved.
        test_recipe:
          setup:
            - "No settlement has been generated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PipelineScheduler
          trigger:
            - call: "POST /pipeline/settlements/00000000-0000-4000-8000-000000000904/certify"
              payload: {}
              as: PipelineScheduler
              as_user_id: "sched-certifier-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "data.error_id == ERR_SETTLEMENT_NOT_FOUND"
            - "GET /pipeline/settlements returns total_count == 0"

      - name: resubmit_a_submitted_nomination_returns_nomination_invalid_state
        claim_type: Violation → Error
        grounds:
          - errors[ERR_NOMINATION_INVALID_STATE]
          - state_machines.Nomination.REVISION_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          Resubmission is reserved for the revision loop: a nomination that is merely SUBMITTED has
          nothing to resubmit, so the call is refused with 409 ERR_NOMINATION_INVALID_STATE and the
          revision_count stays 0 — the shipper cannot use resubmit as a back-door edit while the
          window is still open.
