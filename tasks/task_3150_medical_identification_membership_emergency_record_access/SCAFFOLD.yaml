# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "memberId does not exist" }
  - { id: ERR_RECORD_ITEM_NOT_FOUND, http: 404, condition: "record item id does not exist or does not belong to the path member" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "order id does not exist or does not belong to the path member" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "verification ticket id does not exist" }
  - { id: ERR_PRODUCT_NOT_FOUND, http: 404, condition: "product_id / productId does not exist" }
  - { id: ERR_CONTACT_NOT_FOUND, http: 404, condition: "contact id does not exist or does not belong to the path member" }
  - { id: ERR_DIRECTIVE_NOT_FOUND, http: 404, condition: "directive id does not exist or does not belong to the path member" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "wandering case id does not exist or does not belong to the path member" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "dispute id does not exist" }
  - { id: ERR_RESPONDER_NOT_FOUND, http: 404, condition: "responderId does not exist" }
  - { id: ERR_GUARDIANSHIP_REQUIRED, http: 403, condition: "Guardian role lacks an ACTIVE GuardianLink to the path member, or a Member acts on another member's resource" }
  - { id: ERR_GUARDIAN_LINK_INVALID, http: 409, condition: "Guardian link target invalid: guardian not ACTIVE ADULT, self-link, or dependent already has an ACTIVE link" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Operation requires Member.status == ACTIVE" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in the from-state required by the transition (wrong order/ticket/dispute/directive/case state)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, bad enum, bad date, out-of-range integer" }
  - { id: ERR_RESPONDER_AUTH_FAILED, http: 403, condition: "Responder credential unknown, REVOKED, expired (expires_on <= current date), or HOTLINE lookup missing operator_id" }
  - { id: ERR_MEMBER_NOT_DISCLOSABLE, http: 409, condition: "identifier_code unknown or member status is CANCELLED — no disclosure permitted" }
  - { id: ERR_WANDERING_NOT_ELIGIBLE, http: 409, condition: "Member lacks has_cognitive_condition or already has an OPEN wandering case" }
  - { id: ERR_CONTACT_PRIORITY_CONFLICT, http: 409, condition: "priority_rank already used by another ACTIVE contact of the member" }
  - { id: ERR_ENGRAVING_OVERFLOW, http: 422, condition: "MANUAL engraving_text length exceeds product max_engrave_chars at create or confirm" }
  - { id: ERR_RECORD_ITEM_NOT_DISPUTABLE, http: 409, condition: "Disputed record item belongs to another member or is SUPERSEDED" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "wallet_credit_cents + amount_paid_cents < renewal_fee_cents at renewal" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_member_version does not match Member.version (OCC)" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "email already registered to another member" }
  - { id: ERR_DUPLICATE_CREDENTIAL, http: 409, condition: "responder credential_code already registered" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "product_sku already registered" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "An enrolled member acting on their own record (X-User-ID == memberId)"
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET /medical-id/members/{memberId} (self only)"
      - "POST /medical-id/members/{memberId}/renew (self only)"
      - "POST /medical-id/members/{memberId}/cancel (self only)"
      - "POST /medical-id/members/{memberId}/record-items and submit/supersede (self only)"
      - "POST/GET contacts, directives, orders, disputes, reminders, audit-events, access-events (self only)"

  - name: Guardian
    description: "An ACTIVE adult member administering a dependent via an ACTIVE GuardianLink (X-User-ID == guardian_member_id)"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /medical-id/members/{memberId}/wandering-cases (with HotlineOperator)"
    shared_operations:
      - "Every Member self-service operation, exercised on the linked dependent's memberId"
      - "POST /medical-id/members/{memberId}/wandering-cases/{caseId}/resolve"

  - name: RecordVerifier
    description: "Clinical staff who verify record items against provider documentation and adjudicate accuracy disputes"
    identity: "opaque"
    exclusive_operations:
      - "POST /medical-id/verification-tickets/{ticketId}/resolve"
      - "POST /medical-id/disputes/{disputeId}/claim-for-review, return-to-queue, resolve, dismiss"
    shared_operations:
      - "GET record-items and disputes lists"

  - name: Responder
    description: "Emergency responder authenticating with an agency credential to read a member record in an emergency"
    identity: "entity_backed:ResponderCredential"
    exclusive_operations:
      - "POST /medical-id/access-events (IDENTIFIER lookup_method; X-User-ID must equal the id of the ResponderCredential owning credential_code)"

  - name: HotlineOperator
    description: "24/7 hotline staff performing operator-assisted lookups and wandering support"
    identity: "opaque"
    exclusive_operations:
      - "POST /medical-id/access-events with lookup_method == HOTLINE"
      - "POST /medical-id/members/{memberId}/wandering-cases/{caseId}/resolve (with Guardian)"
    shared_operations:
      - "GET members, responders lists"
      - "POST /medical-id/members/{memberId}/wandering-cases (with Guardian)"

  - name: FulfillmentAgent
    description: "Engraving and shipping operations staff"
    identity: "opaque"
    exclusive_operations:
      - "POST .../orders/{orderId}/engrave"
      - "POST .../orders/{orderId}/ship"
    shared_operations:
      - "GET products, orders"

  - name: PlatformAdmin
    description: "Foundation operations administrator"
    identity: "opaque"
    exclusive_operations:
      - "POST /medical-id/_clock/set_current_utc, /medical-id/_reminders/dispatch"
      - "POST /medical-id/members (enrollment)"
      - "POST guardian-links and revoke"
      - "POST responders and revoke"
      - "POST /medical-id/products"
      - "POST /medical-id/members/{memberId}/cancel (administrative cancel)"
    shared_operations:
      - "All GET endpoints"
