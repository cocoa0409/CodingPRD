            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 500, per_item_cost_cents: 150, free_shipping_threshold_cents: 100 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Keychain", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 100, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders/${order_id}/ship"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_id}/deliver"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders/${order_id}/complete"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "GET /seller/shops/${shop_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { shop_v: $.data.version }
            - call: "POST /seller/payouts"
              payload: { shop_id: "${shop_id}", expected_shop_version: "${shop_v}" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { payout_id: $.data.id }
            - call: "POST /seller/cases"
              payload: { order_id: "${order_id}", type: "NON_DELIVERY" }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /seller/payouts/${payout_id}/release-hold"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /seller/cases/${case_id}/respond"
              payload: { message: "resolving" }
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/cases/${case_id}/resolve"
              payload: { decision: "NO_REFUND" }
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/payouts/${payout_id}/release-hold"
              payload: {}
              as: PlatformAdmin
              captures: { rel_status: $.data.status }
          assert:
            - "first release-hold response error_id == ERR_PAYOUT_HAS_OPEN_CASE"
            - "after resolve, Payout.${payout_id}.status == SCHEDULED"

  # =========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vacation_period_half_open_overlap
        grounds:
          - validations[priority=12]
          - entities.VacationPeriod.fields.starts_at
          - entities.VacationPeriod.fields.ends_at
          - errors[ERR_VACATION_OVERLAP]
        distinguishing_aspect: |
          Pairwise half-open [start,end) overlap on VacationPeriod: [04-05,04-15) overlaps an
          existing [04-01,04-10) and is rejected, but an adjacent [04-10,04-20) (end==start)
          is accepted.
        test_recipe:
          setup:
            - "Shop ACTIVE with one SCHEDULED vacation period [2026-04-01, 2026-04-10)."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/vacation-periods"
              payload: { shop_id: "${shop_id}", starts_at: "2026-04-01T00:00:00Z", ends_at: "2026-04-10T00:00:00Z" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { vp1: $.data.id }
          trigger:
            - call: "POST /seller/vacation-periods"
              payload: { shop_id: "${shop_id}", starts_at: "2026-04-05T00:00:00Z", ends_at: "2026-04-15T00:00:00Z" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { err: $.data.error_id }
            - call: "POST /seller/vacation-periods"
              payload: { shop_id: "${shop_id}", starts_at: "2026-04-10T00:00:00Z", ends_at: "2026-04-20T00:00:00Z" }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { vp3: $.data.id }
          assert:
            - "overlapping create response error_id == ERR_VACATION_OVERLAP"
            - "adjacent create returns VacationPeriod.${vp3}.status == SCHEDULED (accepted)"

      - name: production_capacity_aggregate_overlap
        grounds:
          - validations[priority=13]
          - entities.Shop.fields.max_concurrent_production
          - entities.Order.fields.ship_by_date
          - errors[ERR_PRODUCTION_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity overlap on Order production windows (different interval semantics
          and resource than VacationPeriod): with max_concurrent_production=1, a second MTO
          order whose [paid_at, ship_by_date] overlaps the first IN_PRODUCTION order is
          rejected with ERR_PRODUCTION_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Shop max_concurrent_production=1; MTO listing processing_time_days=7 (no material) published; order1 paid at 2026-03-01 (IN_PRODUCTION, window to 2026-03-08); order2 placed."
          setup_api_calls:
            - call: "POST /seller/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co", max_concurrent_production: 1 }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Bespoke Quilt", fulfillment_type: "MADE_TO_ORDER", processing_time_days: 7, price_cents: 12000 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order1: $.data.id }
            - call: "POST /seller/orders/${order1}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order2: $.data.id }
          trigger:
            - call: "POST /seller/orders/${order2}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRODUCTION_CAPACITY_EXCEEDED"
            - "Order.${order2}.payment_status == UNPAID"

  # =========================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: material_stock_conserved_on_cancel
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.IN_PRODUCTION_to_CANCELLED
          - entities.Material.fields.stock_qty
        distinguishing_aspect: |
          Conserved quantity = physical material stock: pay consumes material_qty_per_unit*quantity
          (=6) and cancel restores exactly 6, so Material.stock_qty returns to its pre-pay value 10.
        test_recipe:
          setup:
            - "Shop; Material stock_qty=10; MTO listing material_qty_per_unit=2 published; order quantity 3 placed and PAID (material drops to 4)."
          setup_api_calls:
            - call: "POST /seller/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co", max_concurrent_production: 5 }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 0, per_item_cost_cents: 0 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/materials"
              payload: { shop_id: "${shop_id}", name: "Yarn", stock_qty: 10, reorder_threshold: 1 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { mat_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", primary_material_id: "${mat_id}", material_qty_per_unit: 2, title: "Knit Blanket", fulfillment_type: "MADE_TO_ORDER", processing_time_days: 7, price_cents: 9000 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 3 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "GET /seller/materials/${mat_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { mid_stock: $.data.stock_qty }
          trigger:
            - call: "POST /seller/orders/${order_id}/cancel"
              payload: { cancel_reason: "buyer changed mind" }
              as: Seller
              as_user_id: "${shop_id}"
            - call: "GET /seller/materials/${mat_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { final_stock: $.data.stock_qty }
          assert:
            - "before cancel Material.${mat_id}.stock_qty == 4"
            - "after cancel Material.${mat_id}.stock_qty == 10"

      - name: shop_pending_balance_conserved_on_refund
        grounds:
          - state_machines.Order.UNPAID_to_PAID
          - state_machines.Order.NOT_STARTED_to_CANCELLED
          - entities.Shop.fields.pending_balance_cents
        distinguishing_aspect: |
          Conserved quantity = money (Shop.pending_balance_cents), a different quantity type than
          physical stock: pay adds order_net_cents (45) to pending_balance; cancel refunds and
          subtracts the same 45, leaving pending_balance_cents invariant at 0.
        test_recipe:
          setup:
            - "Shop (pending_balance 0); free-shipping listing price 100 published; READY_TO_SHIP order quantity 1 placed and PAID (net 45 -> pending 45)."
          setup_api_calls:
            - call: "POST /seller/shops"
              payload: { owner_seller_id: "seller_1", name: "Handmade Co" }
              as: PlatformAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /seller/shipping-profiles"
              payload: { shop_id: "${shop_id}", name: "US", base_cost_cents: 500, per_item_cost_cents: 150, free_shipping_threshold_cents: 100 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { sp_id: $.data.id }
            - call: "POST /seller/listings"
              payload: { shop_id: "${shop_id}", shipping_profile_id: "${sp_id}", title: "Sticker", fulfillment_type: "READY_TO_SHIP", processing_time_days: 1, price_cents: 100, quantity: 10 }
              as: Seller
              as_user_id: "${shop_id}"
              captures: { listing_id: $.data.id }
            - call: "POST /seller/listings/${listing_id}/publish"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
            - call: "POST /seller/orders"
              payload: { shop_id: "${shop_id}", listing_id: "${listing_id}", quantity: 1 }
              as: Buyer
              as_user_id: "buyer_1"
              captures: { order_id: $.data.id }
            - call: "POST /seller/orders/${order_id}/pay"
              payload: {}
              as: Buyer
              as_user_id: "buyer_1"
            - call: "GET /seller/shops/${shop_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { mid_pending: $.data.pending_balance_cents }
          trigger:
            - call: "POST /seller/orders/${order_id}/cancel"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { ps: $.data.payment_status, refunded: $.data.refunded_cents }
            - call: "GET /seller/shops/${shop_id}"
              payload: {}
              as: Seller
              as_user_id: "${shop_id}"
              captures: { final_pending: $.data.pending_balance_cents, final_avail: $.data.available_balance_cents }
          assert:
            - "before cancel Shop.${shop_id}.pending_balance_cents == 45"
            - "after cancel Shop.${shop_id}.pending_balance_cents == 0"
            - "Order.${order_id}.payment_status == REFUNDED"
            - "Order.${order_id}.refunded_cents == 100"
