# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0459_school_picture_day
# Breadth probe over §1.1-§1.7. excluded_because stubs reference §1.8 instances
# by name. Setup chains use the same structured form and §1.5 endpoints only.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_session_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.PictureDaySession
          - endpoints
        distinguishing_aspect: "POST /api/picture-day-sessions with all required fields -> 201; status DRAFT; retouch_credit_balance_cents == retouch_budget_cents; commission/gross 0; version 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Test El", scheduled_date: "2026-06-01T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 7000 }
              as: SchoolCoordinator
              captures: { sess: $.data.id, st: $.data.status, bal: $.data.retouch_credit_balance_cents, ver: $.data.version }
          assert:
            - "HTTP 201"
            - "PictureDaySession.${sess}.status == DRAFT"
            - "PictureDaySession.${sess}.retouch_credit_balance_cents == 7000"
            - "PictureDaySession.${sess}.school_commission_balance_cents == 0 and total_merchandise_cents == 0"
            - "PictureDaySession.${sess}.version == 1"

      - name: create_session_missing_required_field_422
        claim_type: Required Fields
        grounds:
          - entities.PictureDaySession
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /api/picture-day-sessions omitting school_name -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/picture-day-sessions"
              payload: { scheduled_date: "2026-06-01T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_INVALID_REQUEST"

      - name: get_session_not_found_404
        claim_type: Not Found
        grounds:
          - entities.PictureDaySession
          - "errors[ERR_SESSION_NOT_FOUND]"
        distinguishing_aspect: "GET /api/picture-day-sessions/{nonexistent} -> ERR_SESSION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/picture-day-sessions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_SESSION_NOT_FOUND"

      - name: list_sessions_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.PictureDaySession
          - endpoints
        distinguishing_aspect: "GET /api/picture-day-sessions returns array envelope with total_count and has_more present."
        test_recipe:
          setup: ["One session exists."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "One", scheduled_date: "2026-06-01T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
          trigger:
            - call: "GET /api/picture-day-sessions"
              payload: {}
              as: SchoolCoordinator
          assert:
            - "response_type == array; meta.total_count >= 1; has_more is boolean"

      - name: package_computed_premium_flag_on_order
        claim_type: Computed Fields
        grounds:
          - entities.PhotoOrder.fields.has_premium_line
          - endpoints
        distinguishing_aspect: "Adding a PREMIUM-tier line to a CART order sets PhotoOrder.has_premium_line == true; a non-premium line alone keeps it false."
        test_recipe:
          setup: ["Session GALLERY_OPEN with PREMIUM@40000 and BASIC@2499; one CART order O."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Flag School", scheduled_date: "2026-06-02T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "PR", name: "Prem", tier: "PREMIUM", base_price_cents: 40000 }
              as: SchoolCoordinator
              captures: { pkgP: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "A", grade: "1", homeroom: "A", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/students/${s1}/mark-absent"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/photo-orders"
              payload: { picture_day_session_id: "${sess}", student_id: "${s1}" }
              as: Guardian
              as_user_id: "g1"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o1}", package_item_id: "${pkgP}", quantity: 1 }
              as: Guardian
              as_user_id: "g1"
            - call: "GET /api/photo-orders/${o1}"
              payload: {}
              as: Guardian
              as_user_id: "g1"
              captures: { prem: $.data.has_premium_line }
          assert:
            - "PhotoOrder.${o1}.has_premium_line == true after the PREMIUM line is added"

      - name: order_line_unit_price_snapshot_system_field
        claim_type: System Fields
        grounds:
          - entities.OrderLine.fields.unit_price_cents
          - entities.OrderLine.fields.line_total_cents
        distinguishing_aspect: "OrderLine.unit_price_cents is snapshotted from the package at add time and line_total_cents == unit_price_cents * quantity; client-supplied price is ignored (field not in input)."
        test_recipe:
          setup: ["Session GALLERY_OPEN; BASIC@2499; CART order O."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Snap School", scheduled_date: "2026-06-03T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "B", name: "Basic", tier: "BASIC", base_price_cents: 2499 }
              as: SchoolCoordinator
              captures: { pkgB: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "A", grade: "1", homeroom: "A", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/students/${s1}/mark-absent"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/photo-orders"
              payload: { picture_day_session_id: "${sess}", student_id: "${s1}" }
              as: Guardian
              as_user_id: "g1"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o1}", package_item_id: "${pkgB}", quantity: 3 }
              as: Guardian
              as_user_id: "g1"
              captures: { up: $.data.unit_price_cents, lt: $.data.line_total_cents }
          assert:
            - "OrderLine.unit_price_cents == 2499"
            - "OrderLine.line_total_cents == 7497"

      - name: duplicate_sku_within_session_422
        claim_type: Type Constraints
        grounds:
          - entities.PackageItem.fields.sku
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Two PackageItems with the same sku in one session -> second create ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Session DRAFT with one package sku 'DUP'."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Dup School", scheduled_date: "2026-06-04T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "DUP", name: "First", tier: "BASIC", base_price_cents: 1000 }
              as: SchoolCoordinator
          trigger:
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "DUP", name: "Second", tier: "DELUXE", base_price_cents: 2000 }
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_INVALID_REQUEST"

      - name: package_base_price_zero_rejected_422
        claim_type: Type Constraints
        grounds:
          - entities.PackageItem.fields.base_price_cents
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "PackageItem with base_price_cents == 0 violates the > 0 constraint -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Session DRAFT."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Zero School", scheduled_date: "2026-06-05T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
          trigger:
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "Z", name: "Zero", tier: "BASIC", base_price_cents: 0 }
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_INVALID_REQUEST"

      - name: fk_student_session_not_found_404
        claim_type: Parent Relationships
        grounds:
          - entities.Student.fields.picture_day_session_id
          - "errors[ERR_SESSION_NOT_FOUND]"
        distinguishing_aspect: "POST /api/students with a non-existent picture_day_session_id -> ERR_SESSION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { picture_day_session_id: "00000000-0000-0000-0000-000000000000", full_name: "Ghost", grade: "1", homeroom: "A", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_SESSION_NOT_FOUND"

      - name: capture_slot_end_before_start_422
        claim_type: Type Constraints
        grounds:
          - entities.CaptureSlot.fields.end_minute
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "CaptureSlot with end_minute <= start_minute -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Session DRAFT with one backdrop and one photographer."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Slot School", scheduled_date: "2026-06-06T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/backdrops"
              payload: { picture_day_session_id: "${sess}", label: "B" }
              as: SchoolCoordinator
              captures: { bd: $.data.id }
            - call: "POST /api/photographers"
              payload: { picture_day_session_id: "${sess}", full_name: "P" }
              as: SchoolCoordinator
              captures: { phr: $.data.id }
          trigger:
            - call: "POST /api/capture-slots"
              payload: { picture_day_session_id: "${sess}", backdrop_id: "${bd}", photographer_id: "${phr}", homeroom: "A", start_minute: 700, end_minute: 700 }
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: lock_roster_empty_returns_empty_roster
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PictureDaySession.DRAFT_to_ROSTER_LOCKED
          - "errors[ERR_EMPTY_ROSTER]"
        distinguishing_aspect: "lock-roster on a DRAFT session with zero students -> ERR_EMPTY_ROSTER (409)."
        test_recipe:
          setup: ["Session DRAFT, no students."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Empty School", scheduled_date: "2026-06-07T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
          trigger:
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_EMPTY_ROSTER"

      - name: open_capture_no_active_package_empty_catalog
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PictureDaySession.ROSTER_LOCKED_to_CAPTURE_OPEN
          - "errors[ERR_EMPTY_CATALOG]"
        distinguishing_aspect: "open-capture on a ROSTER_LOCKED session with no active PackageItem -> ERR_EMPTY_CATALOG (409)."
        test_recipe:
          setup: ["Session ROSTER_LOCKED with a student but no packages."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "NoCat School", scheduled_date: "2026-06-08T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "A", grade: "1", homeroom: "A", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
          trigger:
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_EMPTY_CATALOG"

      - name: open_gallery_with_enrolled_student_capture_incomplete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PictureDaySession.CAPTURE_OPEN_to_GALLERY_OPEN
          - "errors[ERR_CAPTURE_INCOMPLETE]"
        distinguishing_aspect: "open-gallery while a Student is still ENROLLED -> ERR_CAPTURE_INCOMPLETE (409)."
        test_recipe:
          setup: ["Session CAPTURE_OPEN with one ENROLLED student (never photographed or absent)."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Incmp School", scheduled_date: "2026-06-09T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "B", name: "Basic", tier: "BASIC", base_price_cents: 2499 }
              as: SchoolCoordinator
              captures: { pkgB: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "A", grade: "1", homeroom: "A", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
          trigger:
            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_CAPTURE_INCOMPLETE"

      - name: open_gallery_with_retake_pending
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PictureDaySession.CAPTURE_OPEN_to_GALLERY_OPEN
          - "errors[ERR_RETAKE_PENDING]"
        distinguishing_aspect: "open-gallery while a Photo is RETAKE_REQUESTED -> ERR_RETAKE_PENDING (409)."
        test_recipe:
          setup: ["Session CAPTURE_OPEN; student matched; a RETAKE request leaves the photo RETAKE_REQUESTED."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "RtPnd School", scheduled_date: "2026-06-10T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 50000 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "B", name: "Basic", tier: "BASIC", base_price_cents: 2499 }
              as: SchoolCoordinator
              captures: { pkgB: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Match Me", grade: "1", homeroom: "A", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/photos"
              payload: { picture_day_session_id: "${sess}", candidate_name: "Match Me", candidate_grade: "1", candidate_homeroom: "A" }
              as: StudioPhotographer
              captures: { ph: $.data.id }
            - call: "POST /api/photos/${ph}/match"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/retouch-orders"
              payload: { photo_id: "${ph}", kind: "RETAKE" }
              as: StudioPhotographer
          trigger:
            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_RETAKE_PENDING"

      - name: close_ordering_with_submitted_order
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PictureDaySession.GALLERY_OPEN_to_ORDERING_CLOSED
          - "errors[ERR_OPEN_ORDERS_EXIST]"
        distinguishing_aspect: "close-ordering while a PhotoOrder is SUBMITTED -> ERR_OPEN_ORDERS_EXIST (409)."
        test_recipe:
          setup: ["Session GALLERY_OPEN with one SUBMITTED (unpaid) order."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Open School", scheduled_date: "2026-06-11T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "K", name: "K", tier: "BASIC", base_price_cents: 5000 }
              as: SchoolCoordinator
              captures: { pkg: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "A", grade: "1", homeroom: "A", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/students/${s1}/mark-absent"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/photo-orders"
              payload: { picture_day_session_id: "${sess}", student_id: "${s1}" }
              as: Guardian
              as_user_id: "g1"
              captures: { o1: $.data.id }
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o1}", package_item_id: "${pkg}", quantity: 1 }
              as: Guardian
              as_user_id: "g1"
            - call: "POST /api/photo-orders/${o1}/submit"
              payload: {}
              as: Guardian
              as_user_id: "g1"
          trigger:
            - call: "POST /api/picture-day-sessions/${sess}/close-ordering"
              payload: {}
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and error_id == ERR_OPEN_ORDERS_EXIST"

      - name: cancel_session_with_paid_order_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.PictureDaySession.to_CANCELLED
          - "errors[ERR_PAID_ORDERS_EXIST]"
        distinguishing_aspect: "cancel session while a PhotoOrder is PAID -> ERR_PAID_ORDERS_EXIST (409). Note: session must be in DRAFT/ROSTER_LOCKED/CAPTURE_OPEN to attempt cancel, but a PAID order requires GALLERY_OPEN; this corner instead asserts the guard by attempting cancel from CAPTURE_OPEN is allowed when no paid orders, and the paid-order block is exercised structurally — we drive a PAID order then attempt cancel which is itself invalid-from GALLERY_OPEN."
        excluded_because:
          difficulty_instance: non_linear_state_machine / order_branch_paid_vs_rejected
          rationale: "The PAID-order side effect that the cancel guard protects against is already asserted by the order-branch §1.8 instance; the cancel-from-GALLERY_OPEN invalid-from is covered by session_cancel_invalid_from_gallery below."

      - name: session_cancel_invalid_from_gallery_open
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PictureDaySession.to_CANCELLED
          - "errors[ERR_INVALID_SESSION_TRANSITION]"
        distinguishing_aspect: "cancel is only allowed from DRAFT/ROSTER_LOCKED/CAPTURE_OPEN; calling it from GALLERY_OPEN -> ERR_INVALID_SESSION_TRANSITION (409)."
        test_recipe:
          setup: ["Session in GALLERY_OPEN (no paid orders)."]
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "InvT School", scheduled_date: "2026-06-12T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "B", name: "B", tier: "BASIC", base_price_cents: 2499 }
              as: SchoolCoordinator
              captures: { pkgB: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "A", grade: "1", homeroom: "A", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
