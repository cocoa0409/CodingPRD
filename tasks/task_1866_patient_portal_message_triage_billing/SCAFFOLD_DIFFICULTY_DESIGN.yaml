# =============================================================================
# Task 1866 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 Difficulty Rules x 2 instances each. Every instance grounds in SCAFFOLD.yaml
# §1.1–§1.7 and carries an executable test_recipe (empty-DB -> setup -> trigger).
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains (PortalMessage deadline vs StaffMember burden).
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: deadline_from_receipt_vs_from_triage_policy
        grounds:
          - calculations.response_deadline
          - entities.Pool.fields.deadline_policy
          - entities.PortalMessage.fields.response_due_at
        distinguishing_aspect: |
          Same urgency (URGENT) and same target (120 min) yield different
          response_due_at values depending on pool.deadline_policy: FROM_RECEIPT
          bases on the original received_at (12:00) while FROM_TRIAGE bases on
          triaged_at (12:45). Entity domain: PortalMessage scheduling — distinct
          from burden_attributed_vs_touched (StaffMember domain).
        test_recipe:
          setup:
            - "Nurse, two PROVIDER_INBOX pools (identical targets; R uses FROM_RECEIPT, T uses FROM_TRIAGE), one COPAY patient"
            - "Two messages received at 2026-08-03T10:00:00Z; both triaged URGENT at 2026-08-03T10:45:00Z"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse Nora", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvR", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_RECEIPT" }, as: PracticeAdmin, captures: { pool_r: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvT", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_t: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat A", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_a: "$.data.id" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Rash", body: "Itchy rash spreading" }, as: Patient, as_user_id: "${pat_a}", captures: { m1: "$.data.id", m1_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Fever", body: "Fever 38.9" }, as: Patient, as_user_id: "${pat_a}", captures: { m2: "$.data.id", m2_v: "$.data.version" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:45:00Z" }, as: PracticeAdmin }
          trigger:
            - { call: "POST /inbox/portal-messages/${m1}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_r}", expected_message_version: "${m1_v}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { m1_due: "$.data.response_due_at" } }
            - { call: "POST /inbox/portal-messages/${m2}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_t}", expected_message_version: "${m2_v}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { m2_due: "$.data.response_due_at" } }
          assert:
            - "PortalMessage.${m1}.response_due_at == 2026-08-03T12:00:00Z (received 10:00 + 120m, FROM_RECEIPT)"
            - "PortalMessage.${m2}.response_due_at == 2026-08-03T12:45:00Z (triaged 10:45 + 120m, FROM_TRIAGE)"
            - "${m1_due} != ${m2_due} despite identical urgency and target minutes"

      - name: burden_attributed_vs_touched
        grounds:
          - calculations.provider_inbox_burden
          - entities.StaffMember.fields.open_inbox_count
          - entities.PortalMessage.fields.resolved_by_id
        distinguishing_aspect: |
          Same provider, same period: ATTRIBUTED counts only messages the
          provider personally resolved (1), TOUCHED counts every message the
          provider logged time on (2) — including M2 which was resolved by a
          different provider via cosign. Entity domain: StaffMember burden —
          distinct from deadline_from_receipt_vs_from_triage_policy
          (PortalMessage domain).
        test_recipe:
          setup:
            - "Triage nurse, delegate nurse N2, providers P1 and P2; PROVIDER_INBOX pool (FROM_TRIAGE); P1 has wide coverage; P2 delegates the pool to N2 (2026-08-03..2026-08-31)"
            - "M1: assigned to P1, P1 logs 8 CLINICAL minutes, P1 completes (RESOLVED, resolved_by=P1)"
            - "M2: assigned to N2, N2 starts review via grant, P1 logs 6 CLINICAL minutes, N2 completes -> PENDING_COSIGN, P2 cosigns (RESOLVED, resolved_by=P2)"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse Triage", staff_type: "NURSE" }, as: PracticeAdmin, captures: { n_tri: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse Dee", staff_type: "NURSE" }, as: PracticeAdmin, captures: { n_del: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr One", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr Two", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat B", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_b: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${p1}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/delegation-grants", payload: { delegate_staff_id: "${n_del}", pool_id: "${pool_p}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: Provider, as_user_id: "${p2}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M1", body: "M1 body" }, as: Patient, as_user_id: "${pat_b}", captures: { m1: "$.data.id", m1_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "M2", body: "M2 body" }, as: Patient, as_user_id: "${pat_b}", captures: { m2: "$.data.id", m2_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m1}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m1_v}" }, as: TriageNurse, as_user_id: "${n_tri}" }
            - { call: "POST /inbox/portal-messages/${m2}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m2_v}" }, as: TriageNurse, as_user_id: "${n_tri}" }
            - { call: "POST /inbox/portal-messages/${m1}/assign", payload: { staff_id: "${p1}" }, as: TriageNurse, as_user_id: "${n_tri}" }
            - { call: "POST /inbox/portal-messages/${m2}/assign", payload: { staff_id: "${n_del}" }, as: TriageNurse, as_user_id: "${n_tri}" }
            - { call: "POST /inbox/portal-messages/${m1}/start-review", payload: {}, as: Provider, as_user_id: "${p1}" }
            - { call: "POST /inbox/portal-messages/${m2}/start-review", payload: {}, as: TriageNurse, as_user_id: "${n_del}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m1}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${p1}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m2}", entry_kind: "CLINICAL_REVIEW", minutes: 6 }, as: Provider, as_user_id: "${p1}" }
            - { call: "POST /inbox/portal-messages/${m1}/complete", payload: { resolution_summary: "M1 done" }, as: Provider, as_user_id: "${p1}" }
            - { call: "POST /inbox/portal-messages/${m2}/complete", payload: { resolution_summary: "M2 drafted" }, as: TriageNurse, as_user_id: "${n_del}", captures: { m2_status: "$.data.status" } }
          trigger:
            - { call: "POST /inbox/portal-messages/${m2}/cosign", payload: { action: "COSIGN" }, as: Provider, as_user_id: "${p2}" }
            - { call: "GET /inbox/staff/${p1}/burden-summary", payload: {}, as: Provider, as_user_id: "${p1}", captures: { attr: "$.data.attributed_resolutions", touch: "$.data.touched_resolutions", cmin: "$.data.clinical_minutes" } }
          assert:
            - "burden.attributed_resolutions == 1 (only ${m1}; ${m2} was resolved_by ${p2})"
            - "burden.touched_resolutions == 2 (P1 logged entries on ${m1} and ${m2})"
            - "burden.clinical_minutes == 14 (8 + 6)"
            - "burden.open_inbox_count == 0 (both messages RESOLVED)"
            - "PortalMessage.${m2}.status == RESOLVED and resolved_by_id == ${p2}"
            - "${attr} != ${touch} — variants diverge on identical underlying data"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: mode (a) tiered/branching vs mode (b)
  # nested rounding order.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: evisit_tier_code_fee_selection
        grounds:
          - calculations.e_visit_tier_selection
          - calculations.patient_responsibility
          - calculations.clinical_minutes_total
        distinguishing_aspect: |
          Mode (a): tier selection over clinical_minutes_total (5-10/11-20/21+)
          with conditional branches on category (CLINICAL gate) and consent
          state, plus a nested min() in the COPAY responsibility — 12 provider
          minutes selects CPT_99422/8000c. Distinct mode from
          coinsurance_per_claim_rounding (mode b, rounding order).
        test_recipe:
          setup:
            - "Provider P with wide coverage; billing specialist; COPAY patient (copay 2500c); PROVIDER_INBOX pool FROM_TRIAGE; clock 2026-08-03T10:00:00Z"
            - "Message triaged CLINICAL/URGENT, assigned to P, IN_REVIEW, 12 provider CLINICAL minutes logged"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat C", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_c: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Cough", body: "Cough 5 days" }, as: Patient, as_user_id: "${pat_c}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 12 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent_id: "$.data[0].id", consent_fee: "$.data[0].disclosed_fee_cents" } }
            - { call: "POST /inbox/consent-records/${consent_id}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat_c}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "Treated via portal" }, as: Provider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { cl_code: "$.data.code", cl_fee: "$.data.fee_cents", cl_resp: "$.data.patient_responsibility_cents" } }
          assert:
            - "EVisitClaim.code == CPT_99422 (12 minutes in [11,20] tier)"
            - "EVisitClaim.fee_cents == 8000"
            - "EVisitClaim.patient_responsibility_cents == 2500 (min(copay 2500, fee 8000))"
            - "ConsentRecord.disclosed_code == CPT_99422 and disclosed_fee_cents == 8000 (pinned at determination time)"
            - "PortalMessage.${m}.billing_disposition == CHARGEABLE and status == RESOLVED"

      - name: coinsurance_per_claim_rounding
        grounds:
          - calculations.patient_responsibility
          - calculations.outstanding_billed_maintenance
          - entities.Patient.fields.outstanding_billed_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: round_half_up applied PER CLAIM at creation
          (1666.5 -> 1667 twice = 3334) vs the forbidden order sum-then-round
          (round_half_up(3333.0) = 3333). Two 99421 claims for a 0.3333
          coinsurance patient expose the 1-cent divergence. Distinct mode from
          evisit_tier_code_fee_selection (mode a).
        test_recipe:
          setup:
            - "COINSURANCE patient pct 0.3333; provider P wide coverage; billing specialist; PROVIDER_INBOX pool FROM_TRIAGE"
            - "Claim 1: M1 received 2026-08-03T10:00Z, 7 provider minutes (99421, 5000c), full consent+resolve, claim created and SUBMITTED"
            - "Clock advanced to 2026-08-11T10:00Z (192h later, outside the 168h dedupe window); Claim 2: identical flow on M2"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat D", plan_type: "COINSURANCE", coinsurance_pct: 0.3333 }, as: PracticeAdmin, captures: { pat_d: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "E1", body: "first" }, as: Patient, as_user_id: "${pat_d}", captures: { m1: "$.data.id", m1_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m1}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m1_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m1}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m1}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m1}", entry_kind: "CLINICAL_REVIEW", minutes: 7 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m1}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m1_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m1}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m1_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m1}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent1: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent1}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat_d}" }
            - { call: "POST /inbox/portal-messages/${m1}/complete", payload: { resolution_summary: "done1" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m1}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { cl1: "$.data.id", cl1_resp: "$.data.patient_responsibility_cents" } }
            - { call: "POST /inbox/e-visit-claims/${cl1}/submit", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}" }
            - { call: "GET /inbox/patients/${pat_d}", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { out_mid: "$.data.outstanding_billed_cents" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "E2", body: "second episode" }, as: Patient, as_user_id: "${pat_d}", captures: { m2: "$.data.id", m2_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m2}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m2_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m2}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m2}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m2}", entry_kind: "CLINICAL_REVIEW", minutes: 7 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m2}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m2_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m2}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m2_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m2}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent2: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent2}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat_d}" }
            - { call: "POST /inbox/portal-messages/${m2}/complete", payload: { resolution_summary: "done2" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m2}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { cl2: "$.data.id", cl2_resp: "$.data.patient_responsibility_cents" } }
          trigger:
            - { call: "POST /inbox/e-visit-claims/${cl2}/submit", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}" }
            - { call: "GET /inbox/patients/${pat_d}", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { out_end: "$.data.outstanding_billed_cents" } }
          assert:
            - "EVisitClaim.${cl1}.patient_responsibility_cents == 1667 (round_half_up(5000 * 0.3333) = round_half_up(1666.5) = 1667)"
            - "EVisitClaim.${cl2}.patient_responsibility_cents == 1667"
            - "Patient.outstanding_billed_cents after first submit == 1667"
            - "Patient.outstanding_billed_cents after second submit == 3334 (1667 + 1667 per-claim rounding), NOT 3333 (sum-then-round)"
            - "${out_mid} == 1667 and ${out_end} == 3334"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine: cyclic machines on DIFFERENT entities
  # (PortalMessage reopen loop vs EVisitClaim rework loop).
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: message_resolved_reopen_retriage_cycle
        grounds:
          - state_machines.PortalMessage.RESOLVED_to_REOPENED
          - state_machines.PortalMessage.REOPENED_to_TRIAGED
          - calculations.response_deadline
        distinguishing_aspect: |
          PortalMessage cycles RESOLVED -> REOPENED -> TRIAGED -> ... ->
          RESOLVED (patient-reply reopen loop); re-triage under FROM_TRIAGE
          policy moves response_due_at to 2026-08-04T13:00:00Z. Distinct entity
          from claim_denied_rework_resubmit_cycle (EVisitClaim).
        test_recipe:
          setup:
            - "NURSE_TRIAGE pool FROM_TRIAGE, routine target 240; nurse with wide coverage; patient"
            - "Message triaged ROUTINE/ADMINISTRATIVE at 2026-08-03T10:00Z (due 14:00), worked to RESOLVED"
            - "Clock 2026-08-04T09:00Z: patient reply reopens the message"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "NurseTriage", pool_kind: "NURSE_TRIAGE", target_minutes_emergent: 15, target_minutes_urgent: 60, target_minutes_routine: 240, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_n: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat E", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_e: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_n}", staff_id: "${nurse_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Refill", body: "need refill" }, as: Patient, as_user_id: "${pat_e}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_n}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { due1: "$.data.response_due_at" } }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${nurse_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "Refill routed" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T09:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages/${m}/reply", payload: { body: "still no refill" }, as: Patient, as_user_id: "${pat_e}", captures: { st_reop: "$.data.status", rc: "$.data.reopen_count" } }
          trigger:
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { m_v3: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_n}", expected_message_version: "${m_v3}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { due2: "$.data.response_due_at" } }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${nurse_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "Refilled" }, as: TriageNurse, as_user_id: "${nurse_id}" }
          assert:
            - "status after patient reply == REOPENED with reopen_count == 1 and assignee retained == ${nurse_id}"
            - "first response_due_at == 2026-08-03T14:00:00Z; after re-triage == 2026-08-04T13:00:00Z (09:00 + 240m)"
            - "final status == RESOLVED (cycle traversed RESOLVED -> REOPENED -> TRIAGED -> ASSIGNED -> IN_REVIEW -> RESOLVED)"
            - "${due1} != ${due2}"

      - name: claim_denied_rework_resubmit_cycle
        grounds:
          - state_machines.EVisitClaim.SUBMITTED_to_DENIED
          - state_machines.EVisitClaim.DENIED_to_DRAFT
          - state_machines.EVisitClaim.DRAFT_to_SUBMITTED
          - state_machines.EVisitClaim.SUBMITTED_to_PAID
        distinguishing_aspect: |
          EVisitClaim cycles DRAFT -> SUBMITTED -> DENIED -> DRAFT (rework) ->
          SUBMITTED -> PAID; rework requires the source message RESOLVED again
          and recomputes code/fee from current minutes. Distinct entity from
          message_resolved_reopen_retriage_cycle (PortalMessage).
        test_recipe:
          setup:
            - "Full billing flow: 8 provider minutes (99421/5000), COPAY 2500 patient, consent GRANTED, claim created and SUBMITTED"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat F", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_f: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Cyc", body: "cycle" }, as: Patient, as_user_id: "${pat_f}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent_id: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent_id}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat_f}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "v1 done" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { cl: "$.data.id" } }
            - { call: "POST /inbox/e-visit-claims/${cl}/submit", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}" }
          trigger:
            - { call: "POST /inbox/e-visit-claims/${cl}/record-adjudication", payload: { outcome: "DENIED", denial_reason: "Insufficient documentation" }, as: BillingSpecialist, as_user_id: "${bill_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v3: "$.data.version", m_st3: "$.data.status" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v3}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "v2 done" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/e-visit-claims/${cl}/rework", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { cl_st4: "$.data.status", cl_code2: "$.data.code" } }
            - { call: "POST /inbox/e-visit-claims/${cl}/submit", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}" }
            - { call: "POST /inbox/e-visit-claims/${cl}/record-adjudication", payload: { outcome: "PAID" }, as: BillingSpecialist, as_user_id: "${bill_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_st_end: "$.data.status" } }
            - { call: "GET /inbox/patients/${pat_f}", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { out_end: "$.data.outstanding_billed_cents" } }
          assert:
            - "after DENIED: claim.status == DENIED and message.status == REOPENED (cascade), reopen_count == 1"
            - "after rework: claim.status == DRAFT with recomputed code == CPT_99421 and fee_cents == 5000 (minutes unchanged at 8)"
            - "after re-submit and PAID: claim.status == PAID (full cycle DRAFT->SUBMITTED->DENIED->DRAFT->SUBMITTED->PAID traversed)"
            - "message auto-closed by PAID cascade: message.status == CLOSED"
            - "Patient.outstanding_billed_cents == 0 at the end (+2500 submit, -2500 rework, +2500 re-submit, -2500 PAID)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: depth-3 (claim denial) and depth-2 (grant
  # revoke) cascades from DIFFERENT triggers.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: claim_denial_reopens_message_and_trips_overload
        grounds:
          - state_machines.EVisitClaim.SUBMITTED_to_DENIED
          - state_machines.PortalMessage.RESOLVED_to_REOPENED
          - calculations.open_inbox_count_maintenance
          - calculations.overload_flag
        distinguishing_aspect: |
          Depth-3 chain from the record-adjudication(DENIED) trigger: claim ->
          DENIED causes message RESOLVED -> REOPENED (hop 1), which itself
          increments the rendering provider's open_inbox_count (hop 2), which
          itself flips inbox_overloaded at the >= 5 threshold (hop 3). Distinct
          trigger from delegation_revoke_reassigns_and_recounts.
        test_recipe:
          setup:
            - "Provider P with wide coverage has exactly 4 filler messages assigned (open_inbox_count == 4, inbox_overloaded == false)"
            - "Main message M: full billing flow with P as rendering provider; claim SUBMITTED; after M resolves, P.open_inbox_count == 4"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat G", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_g: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "F1", body: "f1" }, as: Patient, as_user_id: "${pat_g}", captures: { f1: "$.data.id", f1_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${f1}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_p}", expected_message_version: "${f1_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${f1}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "F2", body: "f2" }, as: Patient, as_user_id: "${pat_g}", captures: { f2: "$.data.id", f2_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${f2}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_p}", expected_message_version: "${f2_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${f2}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "F3", body: "f3" }, as: Patient, as_user_id: "${pat_g}", captures: { f3: "$.data.id", f3_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${f3}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_p}", expected_message_version: "${f3_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${f3}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "F4", body: "f4" }, as: Patient, as_user_id: "${pat_g}", captures: { f4: "$.data.id", f4_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${f4}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_p}", expected_message_version: "${f4_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${f4}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Main", body: "main clinical" }, as: Patient, as_user_id: "${pat_g}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 8 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "BILLABLE_CANDIDATE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/consent-records", payload: { message_id: "${m}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { consent_id: "$.data[0].id" } }
            - { call: "POST /inbox/consent-records/${consent_id}/respond", payload: { decision: "GRANTED" }, as: Patient, as_user_id: "${pat_g}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "treated" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { cl: "$.data.id" } }
            - { call: "POST /inbox/e-visit-claims/${cl}/submit", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}" }
            - { call: "GET /inbox/staff/${prov_id}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { pre_cnt: "$.data.open_inbox_count", pre_ov: "$.data.inbox_overloaded" } }
          trigger:
            - { call: "POST /inbox/e-visit-claims/${cl}/record-adjudication", payload: { outcome: "DENIED", denial_reason: "No established patient" }, as: BillingSpecialist, as_user_id: "${bill_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { m_st: "$.data.status", m_asg: "$.data.assignee_id" } }
            - { call: "GET /inbox/staff/${prov_id}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { post_cnt: "$.data.open_inbox_count", post_ov: "$.data.inbox_overloaded" } }
            - { call: "GET /inbox/patients/${pat_g}", payload: {}, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { out_post: "$.data.outstanding_billed_cents" } }
          assert:
            - "pre-denial: P.open_inbox_count == 4 and inbox_overloaded == false (${pre_cnt} == 4, ${pre_ov} == false)"
            - "hop 1: message.status == REOPENED with assignee_id == ${prov_id} (rendering provider)"
            - "hop 2: P.open_inbox_count == 5 (4 fillers + reopened M)"
            - "hop 3: P.inbox_overloaded == true (5 >= OVERLOAD_THRESHOLD 5)"
            - "claim.status == DENIED and Patient.outstanding_billed_cents == 2500 (DENIED stays in the outstanding set)"

      - name: delegation_revoke_reassigns_and_recounts
        grounds:
          - state_machines.DelegationGrant.ACTIVE_to_REVOKED
          - calculations.open_inbox_count_maintenance
        distinguishing_aspect: |
          Depth-2 chain from the revoke trigger: grant -> REVOKED causes every
          in-flight message of the delegate in that pool to be reassigned to the
          delegator (hop 1), and each reassignment itself shifts
          open_inbox_count zero-sum between delegate and delegator (hop 2).
          Distinct trigger from claim_denial_reopens_message_and_trips_overload.
        test_recipe:
          setup:
            - "Provider P1 delegates PROVIDER_INBOX pool to nurse N2 (window 2026-08-03..2026-08-05 17:00, closed)"
            - "M triaged to the pool, assigned to N2 (N2 count 1), N2 IN_REVIEW via grant; P1.open_inbox_count == 0"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse T", staff_type: "NURSE" }, as: PracticeAdmin, captures: { n_tri: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse D", staff_type: "NURSE" }, as: PracticeAdmin, captures: { n_del: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P1", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat H", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_h: "$.data.id" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/delegation-grants", payload: { delegate_staff_id: "${n_del}", pool_id: "${pool_p}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-05T17:00:00Z" }, as: Provider, as_user_id: "${p1}", captures: { grant: "$.data.id" } }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Deleg", body: "delegated work" }, as: Patient, as_user_id: "${pat_h}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "ADMINISTRATIVE", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${n_tri}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${n_del}" }, as: TriageNurse, as_user_id: "${n_tri}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: TriageNurse, as_user_id: "${n_del}" }
          trigger:
            - { call: "POST /inbox/delegation-grants/${grant}/revoke", payload: {}, as: Provider, as_user_id: "${p1}", captures: { g_st: "$.data.status", g_rev: "$.data.revoked_at" } }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${p1}", captures: { m_asg: "$.data.assignee_id", m_st: "$.data.status" } }
            - { call: "GET /inbox/staff/${n_del}", payload: {}, as: Provider, as_user_id: "${p1}", captures: { nd_cnt: "$.data.open_inbox_count" } }
            - { call: "GET /inbox/staff/${p1}", payload: {}, as: Provider, as_user_id: "${p1}", captures: { p1_cnt: "$.data.open_inbox_count" } }
          assert:
            - "grant.status == REVOKED and revoked_at == 2026-08-03T10:00:00Z (logical clock)"
            - "hop 1: message.assignee_id == ${p1} (delegator), status retained == IN_REVIEW"
            - "hop 2: delegate N2.open_inbox_count == 0 (was 1) and delegator P1.open_inbox_count == 1 (was 0) — zero-sum shift, global count unchanged at 1"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: (state vs business_safety) and
  # (business_safety vs business_fiscal).
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cosign_state_before_cosigner_identity
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - errors[ERR_NOT_AWAITING_COSIGN]
          - errors[ERR_NOT_AUTHORIZED_COSIGNER]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: a cosign call on an
          IN_REVIEW message by the WRONG provider violates both
          ERR_NOT_AWAITING_COSIGN (priority 7, state) and
          ERR_NOT_AUTHORIZED_COSIGNER (priority 10, safety); the state error
          MUST win. Distinct pair from
          chargeable_safety_before_minutes_fiscal (safety vs fiscal).
        test_recipe:
          setup:
            - "Providers P1 (assignee) and P2 (other); message IN_REVIEW assigned to P1 (never sent to PENDING_COSIGN)"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P1", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P2", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat I", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_i: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${p1}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Cosign", body: "clinical" }, as: Patient, as_user_id: "${pat_i}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${p1}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /inbox/portal-messages/${m}/cosign", payload: { action: "COSIGN" }, as: Provider, as_user_id: "${p2}", captures: { err: "$.data.error_id" } }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${p1}", captures: { m_st: "$.data.status" } }
          assert:
            - "error_id == ERR_NOT_AWAITING_COSIGN (state, priority 7) — NOT ERR_NOT_AUTHORIZED_COSIGNER (safety, priority 10)"
            - "http status == 409"
            - "message.status unchanged == IN_REVIEW; no side effects fired"

      - name: chargeable_safety_before_minutes_fiscal
        grounds:
          - validations[priority=9]
          - validations[priority=29]
          - errors[ERR_MESSAGE_NOT_CHARGEABLE]
          - errors[ERR_EVISIT_MINUTES_BELOW_MINIMUM]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_fiscal: claim
          creation on a RESOLVED but NOT_BILLABLE message with only 3 clinical
          minutes violates both ERR_MESSAGE_NOT_CHARGEABLE (priority 9, safety)
          and ERR_EVISIT_MINUTES_BELOW_MINIMUM (priority 29, fiscal); the
          safety error MUST win. Distinct pair from
          cosign_state_before_cosigner_identity (state vs safety).
        test_recipe:
          setup:
            - "Message RESOLVED with billing_disposition == NOT_BILLABLE and clinical_minutes_total == 3 (< 5)"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Dr P", staff_type: "PROVIDER" }, as: PracticeAdmin, captures: { prov_id: "$.data.id" } }
            - { call: "POST /inbox/staff", payload: { full_name: "Bill S", staff_type: "BILLING_SPECIALIST" }, as: PracticeAdmin, captures: { bill_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_TRIAGE" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat J", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_j: "$.data.id" } }
            - { call: "POST /inbox/coverage-windows", payload: { pool_id: "${pool_p}", staff_id: "${prov_id}", start_utc: "2026-08-03T00:00:00Z", end_utc: "2026-08-31T23:59:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "Quick Q", body: "short question" }, as: Patient, as_user_id: "${pat_j}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "ROUTINE", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/assign", payload: { staff_id: "${prov_id}" }, as: TriageNurse, as_user_id: "${nurse_id}" }
            - { call: "POST /inbox/portal-messages/${m}/start-review", payload: {}, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/time-entries", payload: { message_id: "${m}", entry_kind: "CLINICAL_REVIEW", minutes: 3 }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: Provider, as_user_id: "${prov_id}", captures: { m_v2: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/determine-billing", payload: { disposition: "NOT_BILLABLE", expected_message_version: "${m_v2}" }, as: Provider, as_user_id: "${prov_id}" }
            - { call: "POST /inbox/portal-messages/${m}/complete", payload: { resolution_summary: "answered, no charge" }, as: Provider, as_user_id: "${prov_id}" }
          trigger:
            - { call: "POST /inbox/e-visit-claims", payload: { message_id: "${m}", rendering_provider_id: "${prov_id}" }, as: BillingSpecialist, as_user_id: "${bill_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_MESSAGE_NOT_CHARGEABLE (business_safety, priority 9) — NOT ERR_EVISIT_MINUTES_BELOW_MINIMUM (business_fiscal, priority 29), although both conditions hold (3 < 5 minutes)"
            - "http status == 409"
            - "no EVisitClaim created: GET /inbox/e-visit-claims?message_id=${m} returns total_count == 0"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: SLA elapsed-seconds at the exact due
  # instant (sweep endpoint) vs integer-minutes tier boundary (claim creation).
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sla_breach_strictly_greater_than_due
        grounds:
          - calculations.sla_breach_evaluation
          - entities.PortalMessage.fields.sla_breached
        distinguishing_aspect: |
          Metric: elapsed seconds vs response_due_at on the sweep endpoint.
          Breach requires STRICTLY greater: at exactly 2026-08-03T12:00:00Z
          (== due) no breach; at 12:00:01Z breach. Distinct metric and endpoint
          from evisit_tier_boundary_10_vs_11_minutes (integer minutes at claim
          creation).
        test_recipe:
          setup:
            - "FROM_RECEIPT pool, urgent target 120; message received 2026-08-03T10:00:00Z, triaged URGENT (due 2026-08-03T12:00:00Z); no staff reply"
          setup_api_calls:
            - { call: "POST /inbox/staff", payload: { full_name: "Nurse N", staff_type: "NURSE" }, as: PracticeAdmin, captures: { nurse_id: "$.data.id" } }
            - { call: "POST /inbox/pools", payload: { name: "ProvInbox", pool_kind: "PROVIDER_INBOX", target_minutes_emergent: 30, target_minutes_urgent: 120, target_minutes_routine: 1440, deadline_policy: "FROM_RECEIPT" }, as: PracticeAdmin, captures: { pool_p: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat K", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_k: "$.data.id" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/portal-messages", payload: { subject: "SLA", body: "urgent" }, as: Patient, as_user_id: "${pat_k}", captures: { m: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /inbox/portal-messages/${m}/triage", payload: { urgency: "URGENT", category: "CLINICAL", pool_id: "${pool_p}", expected_message_version: "${m_v}" }, as: TriageNurse, as_user_id: "${nurse_id}", captures: { due: "$.data.response_due_at" } }
          trigger:
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:00Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_sla/sweep", payload: {}, as: PracticeAdmin, captures: { sweep1: "$.data.newly_breached_count" } }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { br1: "$.data.sla_breached" } }
            - { call: "POST /inbox/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:00:01Z" }, as: PracticeAdmin }
            - { call: "POST /inbox/_sla/sweep", payload: {}, as: PracticeAdmin, captures: { sweep2: "$.data.newly_breached_count" } }
            - { call: "GET /inbox/portal-messages/${m}", payload: {}, as: TriageNurse, as_user_id: "${nurse_id}", captures: { br2: "$.data.sla_breached" } }
          assert:
            - "response_due_at == 2026-08-03T12:00:00Z"
            - "at exactly 12:00:00Z: newly_breached_count == 0 and sla_breached == false (equality is NOT a breach)"
            - "at 12:00:01Z: newly_breached_count == 1 and sla_breached == true (strict >)"

      - name: evisit_tier_boundary_10_vs_11_minutes
        grounds:
          - calculations.e_visit_tier_selection
          - entities.EVisitClaim.fields.code
        distinguishing_aspect: |
          Metric: integer clinical minutes at claim creation. 10 minutes maps
          to CPT_99421 (tier top, inclusive) while 11 minutes maps to
          CPT_99422 (tier bottom, inclusive). Distinct metric and endpoint from
          sla_breach_strictly_greater_than_due (elapsed seconds at the sweep).
