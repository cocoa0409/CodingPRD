              as: LogisticsCoordinator
              captures: { s2: "$.data.id" }
            - call: "POST /field-ops/distribution-runs"
              payload: { incident_id: "${inc_id}", field_kitchen_id: "${fk_id}", driver_name: "Ana Ruiz", driver_phone: "+15550100", driver_safety_training_completed: true, vehicle_type: "VAN", planned_date: "2026-09-01T07:00:00Z", window_start: "2026-09-01T07:00:00Z", window_end: "2026-09-01T19:00:00Z", fuel_cost_cents: 6000, handling_cost_cents: 4000 }
              as: LogisticsCoordinator
              captures: { run_id: "$.data.id" }
