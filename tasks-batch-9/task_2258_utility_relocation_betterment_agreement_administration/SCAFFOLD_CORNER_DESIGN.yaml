      - name: priority_two_unauthorized_is_returned_before_the_body_is_even_parsed
        claim_type: Priority Ordering
        grounds: ["validations[priority=1]", "validations[priority=2]", "validations[priority=3]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "One request violates rules 1, 2 and 3 at once and each is tested in isolation from the same fixture: with no credential the answer is ERR_UNAUTHENTICATED 401 even though the role would also be wrong and the body is also malformed; with a valid credential for a role that does not hold the endpoint the answer is ERR_UNAUTHORIZED 403 and never ERR_INVALID_REQUEST 400, proving authentication precedes authorisation which precedes body validation."
        test_recipe:
          setup: ["A project and an owner exist; the request body deliberately omits the required facility_type and misspells owner_id."]
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Widening Section 3", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: "$.data.id" } }
          trigger:
            - { call: "POST /uro/facilities", payload: { ownr_id: "${o1}", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: ExternalAuditor }
          assert:
            - "the same body sent with no X-Role header returns ERR_UNAUTHENTICATED (401)"
            - "the body above sent as ExternalAuditor returns ERR_UNAUTHORIZED (403), not ERR_INVALID_REQUEST (400), because priority 2 precedes priority 3"
            - "the same body sent as UtilityCoordinator returns ERR_INVALID_REQUEST (400) for the missing facility_type"
            - "no UtilityFacility row is created in any of the three attempts"

      - name: malformed_body_at_priority_three_beats_the_unknown_path_id_at_priority_four
        claim_type: Priority Ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "errors[ERR_INVALID_REQUEST]", "errors[ERR_DOCUMENT_NOT_FOUND]"]
        distinguishing_aspect: "Both the path id and the body are wrong on the same request: the cost document id does not exist and disposition carries a value outside its enum. Priority 3 outranks priority 4, so the answer is ERR_INVALID_REQUEST 400 rather than ERR_DOCUMENT_NOT_FOUND 404 - the opposite of the ordering most implementations fall into, which resolve the path id first because the route handler needs the row."
        test_recipe:
          setup: ["Nothing beyond an authenticated AgreementOfficer is required; the referenced document id is a well-formed UUID that was never created."]
          setup_api_calls: []
          trigger:
            - { call: "POST /uro/cost-documents/11111111-1111-4111-8111-11111111110f/review", payload: { disposition: "MAYBE_LATER" }, as: AgreementOfficer, as_user_id: "officer-1" }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST (priority 3), not 404 ERR_DOCUMENT_NOT_FOUND"
            - "the same unknown id with a valid disposition ACCEPT returns 404 ERR_DOCUMENT_NOT_FOUND (priority 4)"
            - "nothing is written in either attempt"

      - name: prior_rights_gap_at_priority_sixteen_is_reported_before_the_permit_gap_at_priority_seventeen
        claim_type: Priority Ordering
        grounds: ["validations[priority=16]", "validations[priority=17]", "state_machines.RelocationPlan"]
        distinguishing_aspect: "Plan approval is guarded by two independent cross-entity checks and this fixture violates both: the determination is still UNDER_REVIEW and no permit has been granted. Priority 16 must win, so the officer sees ERR_PRIOR_RIGHTS_NOT_ISSUED 409 first; issuing the determination then reveals ERR_PERMIT_NOT_GRANTED 409 on the identical request, which is the cascading-validation shape - check A must run before check B and the second failure only becomes observable once the first is cured."
