            - "Return.${ret_id}.lookup_mode == NO_RECEIPT_LOOKUP"
            - "Return.${ret_id}.refund_cents == 8000"
            - "Return.${ret_id}.reward_reversal_cents == 0"

      # --- Excluded (covered by §1.8) ---
      - name: discount_stack_instant_then_rebate
        claim_type: Correct Result
        grounds:
          - 'calculations.line_discounted_amount'
        excluded_because:
          difficulty_instance: discount_stack_pinned_order_instant_then_rebate
          rationale: "Instant-then-rebate pinned order and net 19500 are the named §1.8 combinatorial_formula instance."
      - name: cancel_refund_partial_proration
        claim_type: Correct Result
        grounds:
          - 'calculations.cancel_refund'
        excluded_because:
          difficulty_instance: cancel_refund_proration_nonlinear_with_redemption
          rationale: "Partial proration (100 days, net 8712) is the named §1.8 combinatorial_formula instance."
      - name: receipted_return_block_rounding_refund
        claim_type: Precision
        grounds:
          - 'calculations.return_refund'
        excluded_because:
          difficulty_instance: return_refund_receipted_vs_no_receipt_diverge
          rationale: "Receipted BLOCK-rounding refund 16000 vs no-receipt 18000 is the named §1.8 dual_variant_calc instance."
      - name: reward_capped_clip
        claim_type: Variant Divergence
        grounds:
          - 'calculations.transaction_reward_accrual'
        excluded_because:
          difficulty_instance: reward_accrual_capped_vs_uncapped_on_membership
          rationale: "Capped (500) vs uncapped (800) accrual is the named §1.8 dual_variant_calc instance."
      - name: instant_saving_window_half_open
        claim_type: Precision
        grounds:
          - 'calculations.line_discounted_amount'
          - 'entities.InstantSaving.fields.window_end_utc'
        excluded_because:
          difficulty_instance: instant_saving_window_half_open_boundary
          rationale: "Half-open [start,end) window boundary (end excluded) is the named §1.8 resource_temporal_overlap instance."
      - name: reward_conserved_full_reversal
        claim_type: Reconciliation
        grounds:
          - 'calculations.return_refund'
          - 'entities.RewardLedgerEntry.fields.amount_cents'
        excluded_because:
          difficulty_instance: reward_conserved_accrual_then_reversal
          rationale: "Full-return reversal of 800 to net-zero ledger is the named §1.8 compensating_invariant instance."

  # ===========================================================================
  # SECTION: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_user_context_unauthenticated
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=1]'
          - 'errors[ERR_MISSING_OR_INVALID_USER_CONTEXT]'
        distinguishing_aspect: "A non-anonymous endpoint called without X-User-ID/X-User-Role headers returns ERR_MISSING_OR_INVALID_USER_CONTEXT (401)."
        test_recipe:
          setup:
            - "A plan exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /memberships"
              payload: {}
              as: NONE
              captures: { err: $.data.error_id }
          assert:
            - "response code == 401"
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT"

      - name: member_only_product_blocked_for_pending_membership
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=8]'
          - 'errors[ERR_MEMBER_ONLY_PRODUCT]'
          - 'entities.Product.fields.member_only'
        distinguishing_aspect: "Adding a member_only product to a transaction whose membership is ACTIVE succeeds; the pure safety check fires only when membership is not ACTIVE — here we confirm satisfaction passes when ACTIVE (isolated from priority-7)."
        test_recipe:
          setup:
            - "BASIC ACTIVE member; member_only product member 8000; OPEN transaction."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-MO-OK", list_price_cents: 10000, member_price_cents: 8000, member_only: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "MO-OK Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 1 }
              as: RegisterClerk
              captures: { line_id: $.data.id }
          assert:
            - "response code == 201"
            - "TransactionLine.${line_id}.unit_price_cents == 8000"

      - name: reward_redemption_exceeds_available_rejected
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=13]'
          - 'errors[ERR_REWARD_REDEMPTION_EXCEEDS_AVAILABLE]'
        distinguishing_aspect: "Renewing with redeem_reward_cents greater than available reward (accrued - redeemed) returns ERR_REWARD_REDEMPTION_EXCEEDS_AVAILABLE (422)."
        test_recipe:
          setup:
            - "EXECUTIVE ACTIVE member with 800 accrued reward (one FINALIZED txn qty 5); clock 2026-03-01; attempt to redeem 1000."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "EXECUTIVE", annual_fee_cents: 12000, reward_rate_bps: 200, reward_cap_cents: 100000, max_household_cards: 1, addon_fee_cents: 6000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-OVERR", list_price_cents: 10000, member_price_cents: 8000, reward_eligible: true }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ClubAdmin
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "OverR Mem", auto_renew: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
            - call: "GET /memberships/${m_id}"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { m_ver: $.data.version }
          trigger:
            - call: "POST /memberships/${m_id}/renew"
              payload: { expected_membership_version: "${m_ver}", redeem_reward_cents: 1000 }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "err == ERR_REWARD_REDEMPTION_EXCEEDS_AVAILABLE"

      - name: household_card_limit_included_rejected
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=10]'
          - 'errors[ERR_HOUSEHOLD_CARD_LIMIT]'
          - 'calculations.addon_card_fee'
        distinguishing_aspect: "Creating a second INCLUDED card when ACTIVE card count already equals plan.max_household_cards (1) returns ERR_HOUSEHOLD_CARD_LIMIT (409)."
        test_recipe:
          setup:
            - "BASIC ACTIVE member (max_household_cards 1) with one ACTIVE INCLUDED card already."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "HCLim Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Spouse", card_kind: "INCLUDED" }
              as: Member
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /household-cards"
              payload: { membership_id: "${m_id}", cardholder_name: "Kid", card_kind: "INCLUDED" }
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "err == ERR_HOUSEHOLD_CARD_LIMIT"

      - name: receipted_return_qty_exceeds_purchased_at_create
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=12]'
          - 'errors[ERR_RETURN_QTY_EXCEEDS_PURCHASED]'
        distinguishing_aspect: "Creating a receipted return whose qty (3) exceeds the original FINALIZED line qty (2) returns ERR_RETURN_QTY_EXCEEDS_PURCHASED (409) at creation time."
        test_recipe:
          setup:
            - "BASIC ACTIVE member; FINALIZED txn with line qty 2 of product P."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "BASIC", annual_fee_cents: 6000, max_household_cards: 1, addon_fee_cents: 4000 }
              as: ClubAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P-RQEX", list_price_cents: 10000, member_price_cents: 8000 }
              as: ClubAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /memberships"
              payload: { plan_id: "${plan_id}", primary_member_name: "RQEx Mem" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /payments"
              payload: { membership_id: "${m_id}", purpose: "SIGNUP", outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /transactions"
              payload: { membership_id: "${m_id}" }
              as: RegisterClerk
              captures: { txn_id: $.data.id }
            - call: "POST /transactions/${txn_id}/lines"
              payload: { product_id: "${prod_id}", qty: 2 }
              as: RegisterClerk
            - call: "POST /transactions/${txn_id}/finalize"
              payload: {}
              as: RegisterClerk
          trigger:
            - call: "POST /returns"
              payload: { membership_id: "${m_id}", product_id: "${prod_id}", qty: 3, transaction_id: "${txn_id}" }
              as: ServiceDeskClerk
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "err == ERR_RETURN_QTY_EXCEEDS_PURCHASED"

      # --- Excluded (priority-pair conflicts covered by §1.8) ---
      - name: state_not_active_over_member_only
        claim_type: Priority Ordering
        grounds:
          - 'validations[priority=7]'
          - 'validations[priority=8]'
        excluded_because:
          difficulty_instance: state_not_active_beats_member_only_safety
          rationale: "Priority-7 referential beating priority-8 safety is the named §1.8 priority_pair_validation_conflict instance."
      - name: purchase_limit_over_reward_fiscal
        claim_type: Priority Ordering
        grounds:
          - 'validations[priority=9]'
          - 'validations[priority=13]'
        excluded_because:
          difficulty_instance: purchase_limit_beats_reward_fiscal_redemption
          rationale: "Priority-9 constraint beating priority-13 fiscal is the named §1.8 priority_pair_validation_conflict instance."
      - name: purchase_limit_boundary_violation
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=9]'
          - 'errors[ERR_PURCHASE_LIMIT_EXCEEDED]'
        excluded_because:
          difficulty_instance: purchase_limit_at_exact_boundary
          rationale: "Cumulative qty 3 OK / 4 rejected on per_member_limit is the named §1.8 boundary_precision_check instance."
      - name: no_receipt_lookup_denied_outside_window
        claim_type: Violation → Error
        grounds:
          - 'validations[priority=11]'
          - 'errors[ERR_NO_RECEIPT_LOOKUP_DENIED]'
        excluded_because:
          difficulty_instance: no_receipt_lookup_window_inclusive_boundary
          rationale: "No-receipt lookup denied past the 90-day window is the named §1.8 resource_temporal_overlap instance."
      - name: empty_transaction_finalize_rejected
        claim_type: Violation → Error
        grounds:
          - 'errors[ERR_EMPTY_TRANSACTION]'
        excluded_because:
          difficulty_instance: finalize_empty_transaction_zero_line_edge
          rationale: "Finalizing a zero-line transaction is the named §1.8 boundary_precision_check instance."
      - name: membership_not_active_cross_entity_line_add
        claim_type: Cross-entity validation
        grounds:
          - 'validations[priority=7]'
          - 'errors[ERR_MEMBERSHIP_NOT_ACTIVE]'
        excluded_because:
          difficulty_instance: line_add_requires_membership_active
          rationale: "Line add gated on owning Membership ACTIVE is the named §1.8 cross_entity_state_dependency instance."

