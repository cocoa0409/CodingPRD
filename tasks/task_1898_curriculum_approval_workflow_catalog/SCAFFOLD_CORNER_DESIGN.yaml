            - { call: "POST /curriculum/proposals", payload: { proposal_type: "DEACTIVATION", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t2}", target_course_id: "${course_c}", declared_remaining_cohorts: 3, justification: "retire" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
          trigger:
