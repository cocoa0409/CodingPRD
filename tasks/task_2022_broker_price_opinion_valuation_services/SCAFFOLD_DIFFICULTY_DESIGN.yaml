          trigger:
            - call: "POST /bpo/valuation-orders/${ord_k}/comparables"
              payload: { source_property_id: "${cmp_k}", sale_price_cents: 40000001, sale_date: "2026-06-01T00:00:00Z", distance_miles: 1.5, adjustment_cents: 10000000 }
              as: Broker
