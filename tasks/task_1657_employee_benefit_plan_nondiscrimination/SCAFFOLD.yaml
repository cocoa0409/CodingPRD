scenario: |
  Employee Benefit Plan Nondiscrimination Testing (third-party plan administrator): census & compensation definition validation, highly-compensated employee determination & ownership attribution, coverage and ADP/ACP testing with correction methods, top-heavy determination & minimum contribution, cafeteria plan & dependent care testing, corrective distribution deadline & excise tax exposure, safe harbor design election & notice requirements, mid-year plan change impact analysis
domain_name: benefit-plan-nondiscrimination
api_prefix: /ndt

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: ein, type: string, source: input, description: "9-digit federal employer identification number", constraints: "exactly 9 digits; unique across all Employers" }
      - { name: entity_type, type: enum, source: input, description: "Legal entity form driving ownership attribution rules", constraints: "CORPORATION | S_CORPORATION | PARTNERSHIP | LLC | SOLE_PROPRIETORSHIP | NONPROFIT | GOVERNMENTAL" }
      - { name: controlled_group_id, type: string, source: input, description: "FK -> Employer.id; nullable self-reference linking this Employer to its parent Employer in a controlled group; null means standalone", default: null }
      - { name: status, type: enum, source: system, description: "Lifecycle state", default: ACTIVE, constraints: "ACTIVE | ARCHIVED" }

  - name: Plan
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; sponsoring employer" }
      - { name: plan_name, type: string, source: input, description: "Plan name" }
      - { name: plan_type, type: enum, source: input, description: "Plan type drives which tests apply", constraints: "401K | CAFETERIA_125 | DEPENDENT_CARE_FSA" }
      - { name: plan_number, type: string, source: input, description: "Three-digit plan number unique per employer", constraints: "unique within employer_id; 001-999" }
      - { name: status, type: enum, source: system, description: "Plan lifecycle", default: ACTIVE, constraints: "ACTIVE | TERMINATED" }

  - name: PlanVersion
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id" }
      - { name: effective_start, type: string, source: input, description: "ISO date (YYYY-MM-DD) this version's provisions take effect" }
      - { name: effective_end, type: string, source: input, description: "ISO date this version's provisions end; null for current", default: null }
      - { name: comp_definition, type: enum, source: input, description: "Compensation definition for testing", constraints: "W2 | SEC415 | SEC3401" }
      - { name: safe_harbor_design, type: enum, source: input, description: "Safe harbor election in effect", default: NONE, constraints: "NONE | BASIC_MATCH | ENHANCED_MATCH | QNEC_3PCT | QACA" }
      - { name: sh_match_formula, type: string, source: input, description: "Match formula descriptor, e.g. '100% of first 3% + 50% of next 2%'; required iff safe_harbor_design in {BASIC_MATCH, ENHANCED_MATCH}", default: null }
      - { name: entry_frequency, type: enum, source: input, description: "Entry frequency for eligibility", default: MONTHLY, constraints: "IMMEDIATE | MONTHLY | QUARTERLY | SEMI_ANNUAL | ANNUAL" }
      - { name: is_amendment, type: boolean, source: input, description: "true when this version amends an in-flight plan year (mid-year change)", default: false }
      - { name: status, type: enum, source: system, description: "Version status", default: DRAFT, constraints: "DRAFT | ADOPTED | SUPERSEDED" }

  - name: PlanYear
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id" }
      - { name: year_label, type: integer, source: input, description: "Calendar year label of the plan year start, e.g. 2026" }
      - { name: year_start, type: string, source: input, description: "ISO date plan year begins" }
      - { name: year_end, type: string, source: input, description: "ISO date plan year ends" }
      - { name: census_lock_version, type: integer, source: system, description: "Census snapshot lock counter; 0 = unlocked, increments on each lock" , default: 0 }
      - { name: status, type: enum, source: system, description: "Plan-year workflow state", default: DRAFT, constraints: "DRAFT | CENSUS_COLLECTING | CENSUS_LOCKED | TESTING | RESULTS_REVIEW | CORRECTING | FILED | TERMINATED" }
      - { name: prior_year_py_id, type: string, source: input, description: "FK -> PlanYear.id; prior plan year of the same plan, used by top-heavy and HCE lookback; null for first year", default: null }
      - { name: adopted_version_id, type: string, source: system, description: "FK -> PlanVersion.id; the PlanVersion whose provisions govern testing for this year; set when census is locked", default: null }

  - name: CensusEmployee
    parent: PlanYear
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: ssn, type: string, source: input, description: "Employee SSN (9 digits)", constraints: "unique within plan_year_id" }
      - { name: full_name, type: string, source: input, description: "Employee name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth" }
      - { name: date_of_hire, type: string, source: input, description: "ISO hire date" }
      - { name: date_of_termination, type: string, source: input, description: "ISO termination date; null if still employed", default: null }
      - { name: employment_status, type: enum, source: input, description: "Employment status as of census snapshot", constraints: "ACTIVE | TERMINATED | LEAVE_OF_ABSENCE" }
      - { name: ownership_pct_direct, type: number, source: input, description: "Direct ownership percentage in the employer (0-100)", default: 0 }
      - { name: is_officer, type: boolean, source: input, description: "Officer flag for HCE officer test", default: false }
      - { name: family_member_of_ssn, type: string, source: input, description: "FK -> CensusEmployee.ssn (same PlanYear); spouse/child/parent/grandparent of the referenced employee for IRC 318 family attribution; null if none", default: null }
      - { name: covered_status, type: enum, source: computed, description: "Whether employee is benefiting/eligible for coverage ratio test", constraints: "BENEFITING | ELIGIBLE_NOT_BENEFITING | EXCLUDABLE | INELIGIBLE" }
      - { name: hce_status, type: enum, source: computed, description: "Highly compensated determination", constraints: "HCE | NHCE | EXCLUDED_FROM_TESTING" }
      - { name: key_employee_status, type: enum, source: computed, description: "Key employee determination for top-heavy", constraints: "KEY | NON_KEY | EXCLUDED_FROM_TESTING" }
      - { name: attributed_ownership_pct, type: number, source: computed, description: "Ownership after family & entity attribution rollup" }

  - name: CompensationRecord
    parent: CensusEmployee
    common_fields: true
    fields:
      - { name: census_employee_id, type: string, source: input, description: "FK -> CensusEmployee.id" }
      - { name: comp_source, type: enum, source: input, description: "Which statutory definition this record measures", constraints: "W2 | SEC415 | SEC3401" }
      - { name: amount_cents, type: integer, source: input, description: "Compensation in cents for the plan year under this definition", constraints: ">= 0" }
      - { name: period, type: enum, source: input, description: "Measurement period", constraints: "CURRENT_YEAR | PRIOR_YEAR" }
      - { name: source, type: enum, source: system, description: "How the record entered the census", default: IMPORTED, constraints: "IMPORTED | ADMIN_ADJUSTED | SYSTEM_DERIVED" }

  - name: Contribution
    parent: CensusEmployee
    common_fields: true
    fields:
      - { name: census_employee_id, type: string, source: input, description: "FK -> CensusEmployee.id" }
      - { name: contribution_type, type: enum, source: input, description: "Contribution source bucket", constraints: "ELECTIVE_DEFERRAL | MATCH | QNEC | QMAC | PROFIT_SHARING | CAFETERIA_PRETAX | DEPENDENT_CARE_ELECTIVE" }
      - { name: amount_cents, type: integer, source: input, description: "Contribution amount in cents", constraints: "> 0" }
      - { name: contribution_date, type: string, source: input, description: "ISO date contribution was deposited" }
      - { name: status, type: enum, source: system, description: "Contribution lifecycle", default: POSTED, constraints: "POSTED | PENDING_DISTRIBUTION | DISTRIBUTED | RECHARACTERIZED | FORFEITED" }

  - name: RegulatoryLimit
    parent: null
    common_fields: true
    fields:
      - { name: year_label, type: integer, source: input, description: "Calendar year the limits apply to" }
      - { name: hce_comp_threshold_cents, type: integer, source: input, description: "IRC 414(q) compensation threshold for HCE (e.g. 15500000 = $155,000)" }
      - { name: key_officer_comp_threshold_cents, type: integer, source: input, description: "IRC 416(i) officer compensation threshold for key employee (e.g. 22000000)" }
      - { name: sec402g_limit_cents, type: integer, source: input, description: "402(g) elective deferral limit" }
      - { name: sec415_annual_additions_limit_cents, type: integer, source: input, description: "415(c) annual additions limit" }
      - { name: dependent_care_limit_cents, type: integer, source: input, description: "IRC 129 dependent care exclusion limit (500000 = $5,000)" }
      - { name: status, type: enum, source: system, description: "Row lifecycle", default: ACTIVE, constraints: "ACTIVE | SUPERSEDED" }

  - name: SafeHarborElection
    parent: PlanYear
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: design, type: enum, source: input, description: "Elected safe harbor design", constraints: "BASIC_MATCH | ENHANCED_MATCH | QNEC_3PCT | QACA" }
      - { name: elected_on, type: string, source: input, description: "ISO date the election was adopted" }
      - { name: status, type: enum, source: system, description: "Election lifecycle", default: PROPOSED, constraints: "PROPOSED | EFFECTIVE | SUSPENDED | REVOKED" }
      - { name: suspension_reason, type: string, source: input, description: "Reason for mid-year suspension; required when suspending", default: null }

  - name: SafeHarborNotice
    parent: SafeHarborElection
    common_fields: true
    fields:
      - { name: election_id, type: string, source: input, description: "FK -> SafeHarborElection.id" }
      - { name: notice_period_start, type: string, source: input, description: "ISO date the notice window opens" }
      - { name: notice_period_end, type: string, source: input, description: "ISO date the notice window closes (must be >= 30 days before plan year end)" }
      - { name: distributed_at, type: string, source: input, description: "ISO datetime the notice was distributed; null until distributed", default: null }
      - { name: status, type: enum, source: system, description: "Notice lifecycle", default: DRAFT, constraints: "DRAFT | DISTRIBUTED | ACKNOWLEDGED | LAPSED" }

  - name: TestRun
    parent: PlanYear
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: test_scope, type: enum, source: input, description: "Which battery this run executes", constraints: "COVERAGE_410B | ADP_401K | ACP_401M | TOP_HEAVY_416 | CAFETERIA_125 | DEPENDENT_CARE_129 | FULL_SUITE" }
      - { name: run_mode, type: enum, source: input, description: "PROVISIONAL uses current-year compensation and projected year-end data; FINAL uses locked census only", constraints: "PROVISIONAL | FINAL" }
      - { name: engine_input_hash, type: string, source: system, description: "Deterministic hash of the input snapshot (census lock version + contribution ids) used to detect staleness" }
      - { name: status, type: enum, source: system, description: "Run lifecycle", default: QUEUED, constraints: "QUEUED | RUNNING | PASSED | FAILED | SUPERSEDED | VOID" }
      - { name: overall_result, type: enum, source: computed, description: "Aggregate verdict across result lines", constraints: "PASS | FAIL | NOT_EVALUATED", default: NOT_EVALUATED }

  - name: TestResultLine
    parent: TestRun
    common_fields: true
    fields:
      - { name: test_run_id, type: string, source: input, description: "FK -> TestRun.id" }
      - { name: metric, type: enum, source: input, description: "Which metric this line reports", constraints: "COVERAGE_RATIO_PCT | ADP_HCE_PCT | ADP_NHCE_PCT | ADP_CEILING_PCT | ACP_HCE_PCT | ACP_NHCE_PCT | ACP_CEILING_PCT | TOP_HEAVY_RATIO_PCT | CAFETERIA_ELIGIBILITY_PCT | CAFETERIA_UTILIZATION_PCT | DEPENDENT_CARE_55PCT_AVG_PCT | KEY_EMPLOYEE_CONCENTRATION_PCT" }
      - { name: value_pct, type: number, source: computed, description: "Metric value as a percentage with 4-decimal precision" }
      - { name: threshold_pct, type: number, source: computed, description: "The statutory ceiling/floor the metric is compared against" }
      - { name: outcome, type: enum, source: computed, description: "Per-line verdict", constraints: "PASS | FAIL | NOT_APPLICABLE" }
      - { name: detail, type: object, source: computed, description: "Breakdown object: numerator/denominator cohort sizes, member ids, and sub-totals used" }

  - name: Correction
    parent: PlanYear
    common_fields: true
    fields:
      - { name: plan_year_id, type: string, source: input, description: "FK -> PlanYear.id" }
      - { name: test_run_id, type: string, source: input, description: "FK -> TestRun.id; the FAILED run this correction remedies" }
      - { name: correction_type, type: enum, source: input, description: "Statutory correction method", constraints: "CORRECTIVE_DISTRIBUTION | QNEC_CONTRIBUTION | QMAC_REALLOCATION | RECHARACTERIZATION | PLAN_AMENDMENT_RETRO" }
      - { name: target_census_employee_id, type: string, source: input, description: "FK -> CensusEmployee.id; employee the correction applies to (null for plan-wide QNEC)", default: null }
      - { name: amount_cents, type: integer, source: input, description: "Correction amount in cents", constraints: "> 0" }
      - { name: gap_period_income_cents, type: integer, source: computed, description: "Gap-period earnings allocable to a corrective distribution", default: 0 }
      - { name: excise_tax_cents, type: integer, source: computed, description: "10% excise tax on late corrective distributions; 0 when distributed on time", default: 0 }
      - { name: excise_status, type: enum, source: computed, description: "Parallel excise-tax dimension; independent of the approval pipeline", constraints: "NOT_ASSESSED | ACCRUING | ASSESSED | PAID", default: NOT_ASSESSED }
      - { name: status, type: enum, source: system, description: "Correction pipeline state", default: PROPOSED, constraints: "PROPOSED | APPROVED | EXECUTED | VOIDED" }
      - { name: deadline_date, type: string, source: computed, description: "Statutory deadline (12 months after plan year end for ADP/ACP)" }
      - { name: executed_at, type: string, source: system, description: "ISO datetime execution completed; null until executed", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PlanYear
    initial_state: DRAFT
    terminal_states: [FILED, TERMINATED]
    transitions:
      - from: DRAFT
        to: CENSUS_COLLECTING
        trigger: "POST /ndt/plan-years/{id}/open-census"
        actor: PlanAdministrator
        preconditions:
          - "plan_year.status == DRAFT"
          - "PlanYear.prior_year_py_id is null OR prior PlanYear.status == FILED"
        side_effects:
          - "increments PlanYear.version by 1"
      - from: CENSUS_COLLECTING
        to: CENSUS_LOCKED
        trigger: "POST /ndt/plan-years/{id}/lock-census"
        actor: PlanAdministrator
        preconditions:
          - "plan_year.status == CENSUS_COLLECTING"
          - "every CensusEmployee in plan_year has >= 1 CompensationRecord with period == CURRENT_YEAR and comp_source == plan_year.adopted PlanVersion.comp_definition"
          - "a PlanVersion with status == ADOPTED exists covering plan_year.year_start (its id is pinned into adopted_version_id)"
          - "a RegulatoryLimit row with year_label == plan_year.year_label and status == ACTIVE exists"
        side_effects:
          - "sets PlanYear.adopted_version_id to the covering ADOPTED PlanVersion"
          - "increments PlanYear.census_lock_version by 1"
          - "recomputes CensusEmployee.attributed_ownership_pct for all employees in the plan year (ownership_attribution)"
          - "recomputes CensusEmployee.hce_status for all employees (hce_determination)"
          - "recomputes CensusEmployee.key_employee_status for all employees (key_employee_determination)"
          - "recomputes CensusEmployee.covered_status for all employees (coverage_cohort_classification)"
          - "increments PlanYear.version by 1"
      - from: CENSUS_LOCKED
        to: CENSUS_COLLECTING
        trigger: "POST /ndt/plan-years/{id}/unlock-census"
        actor: PlanAdministrator
        preconditions:
          - "plan_year.status == CENSUS_LOCKED"
          - "no TestRun for this plan_year has status in {QUEUED, RUNNING}"
          - "no Correction for this plan_year has status in {PROPOSED, APPROVED}"
        side_effects:
          - "marks every TestRun with status == PASSED or FAILED as SUPERSEDED (cascade down)"
          - "increments PlanYear.version by 1"
      - from: CENSUS_LOCKED
        to: TESTING
        trigger: "POST /ndt/plan-years/{id}/test-runs (implicit transition on first run creation)"
        actor: ComplianceAnalyst
        preconditions:
          - "plan_year.status == CENSUS_LOCKED"
        side_effects:
          - "increments PlanYear.version by 1"
      - from: TESTING
        to: RESULTS_REVIEW
        trigger: "POST /ndt/test-runs/{id}/finalize"
        actor: ComplianceAnalyst
        preconditions:
          - "test_run.status in {PASSED, FAILED}"
          - "test_run.run_mode == FINAL"
        side_effects:
          - "if test_run.overall_result == FAIL: creates no Corrections automatically (analysts propose them explicitly)"
          - "increments PlanYear.version by 1"
      - from: RESULTS_REVIEW
        to: TESTING
        trigger: "POST /ndt/plan-years/{id}/test-runs (re-open testing round)"
        actor: ComplianceAnalyst
        preconditions:
          - "plan_year.status == RESULTS_REVIEW"
        side_effects:
          - "increments PlanYear.version by 1"
      - from: RESULTS_REVIEW
        to: CORRECTING
        trigger: "POST /ndt/plan-years/{id}/corrections (first correction proposal opens the correction phase)"
        actor: ComplianceAnalyst
        preconditions:
          - "plan_year.status == RESULTS_REVIEW"
          - "at least one FINAL TestRun with overall_result == FAIL exists for this plan year"
        side_effects:
          - "increments PlanYear.version by 1"
      - from: CORRECTING
        to: FILED
        trigger: "POST /ndt/plan-years/{id}/file"
        actor: PlanAdministrator
        preconditions:
          - "plan_year.status == CORRECTING"
          - "every Correction for this plan_year has status in {EXECUTED, VOIDED}"
          - "every TestRun with run_mode == FINAL created after the last EXECUTED Correction has overall_result == PASS"
        side_effects:
          - "assesses excise tax: for every EXECUTED Correction with executed_at > deadline_date and excise_status != PAID, sets excise_status = ASSESSED and excise_tax_cents per corrective_distribution_excise calculation"
          - "increments PlanYear.version by 1"
      - from: CENSUS_COLLECTING
        to: TERMINATED
        trigger: "POST /ndt/plan-years/{id}/terminate"
        actor: PlanAdministrator
        preconditions:
          - "plan_year.status in {DRAFT, CENSUS_COLLECTING}"
        side_effects:
          - "sets Plan.status = TERMINATED (cascade up)"
          - "increments PlanYear.version by 1"

  - entity: TestRun
    initial_state: QUEUED
    terminal_states: [PASSED, FAILED, SUPERSEDED, VOID]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "system event: engine picks up queued run in created_at ASC order per plan_year"
        actor: system
        preconditions:
          - "test_run.status == QUEUED"
          - "no other TestRun for the same plan_year is in RUNNING"
        side_effects:
          - "executes the metric battery per test_scope; creates TestResultLine rows (one per applicable metric)"
      - from: RUNNING
        to: PASSED
        trigger: "system event: all result lines evaluated with outcome in {PASS, NOT_APPLICABLE}"
        actor: system
        preconditions:
          - "test_run.status == RUNNING"
          - "every TestResultLine.outcome in {PASS, NOT_APPLICABLE}"
        side_effects:
          - "sets TestRun.overall_result = PASS"
          - "if run_mode == FINAL and overall_result == PASS: any SafeHarborElection for this plan_year with status == SUSPENDED stays SUSPENDED (no automatic reinstatement)"
      - from: RUNNING
        to: FAILED
        trigger: "system event: at least one result line evaluates outcome == FAIL"
        actor: system
        preconditions:
          - "test_run.status == RUNNING"
          - "exists TestResultLine.outcome == FAIL"
        side_effects:
          - "sets TestRun.overall_result = FAIL"
          - "for each FAILED ADP/ACP line on a FINAL run: sets every POSTED ELECTIVE_DEFERRAL / MATCH Contribution of each HCE cohort member (identified in detail.member_ids) to PENDING_DISTRIBUTION eligibility review flag via detail (no status change; review uses detail payload)"
      - from: QUEUED
        to: VOID
        trigger: "POST /ndt/test-runs/{id}/void"
        actor: ComplianceAnalyst
        preconditions:
          - "test_run.status == QUEUED"
        side_effects: []
      - from: PASSED
        to: SUPERSEDED
        trigger: "system cascade: PlanYear unlock-census transition"
        actor: system
        preconditions:
          - "plan_year census unlock triggered"
        side_effects: []
      - from: FAILED
        to: SUPERSEDED
        trigger: "system cascade: PlanYear unlock-census transition"
        actor: system
        preconditions:
          - "plan_year census unlock triggered"
        side_effects: []

  - entity: Correction
    initial_state: PROPOSED
    terminal_states: [EXECUTED, VOIDED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /ndt/corrections/{id}/approve"
        actor: PlanAdministrator
        preconditions:
          - "correction.status == PROPOSED"
          - "approver's X-User-ID != correction proposing analyst's recorded proposer_user_id (segregation of duties)"
          - "plan_year.status == CORRECTING"
        side_effects:
          - "increments Correction.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /ndt/corrections/{id}/execute"
        actor: PlanAdministrator
        preconditions:
          - "correction.status == APPROVED"
        side_effects:
          - "sets executed_at to logical clock now"
          - "if correction_type == CORRECTIVE_DISTRIBUTION and executed_at > deadline_date: computes excise_tax_cents = 10% of amount_cents and sets excise_status = ASSESSED; if executed_at <= deadline_date: excise_status stays NOT_ASSESSED and excise_tax_cents stays 0"
          - "if correction_type == CORRECTIVE_DISTRIBUTION: target Contribution(s) selected by waterfall (oldest contribution_date first, tie-break created_at ASC) move POSTED -> DISTRIBUTED until amount_cents is satisfied; last contribution may be partially distributed via RECHARACTERIZED split"
          - "if correction_type == QNEC_CONTRIBUTION: creates a new Contribution row with contribution_type == QNEC, amount == amount_cents, allocated pro-rata across NHCE cohort by equal-dollar method (equal dollars per NHCE, remainder cents to the earliest-created NHCE by created_at ASC)"
          - "re-runs dependent aggregates: marks every later TestRun for the plan_year with status in {PASSED, FAILED} as SUPERSEDED (staleness cascade)"
          - "increments Correction.version by 1 and increments PlanYear.version by 1"
      - from: PROPOSED
        to: VOIDED
        trigger: "POST /ndt/corrections/{id}/void"
        actor: ComplianceAnalyst
        preconditions:
          - "correction.status == PROPOSED"
        side_effects:
          - "increments Correction.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /ndt/corrections/{id}/void"
        actor: PlanAdministrator
        preconditions:
          - "correction.status == APPROVED"
          - "plan_year.status == CORRECTING"
        side_effects:
          - "increments Correction.version by 1"

  - entity: SafeHarborElection
    initial_state: PROPOSED
    terminal_states: [REVOKED]
    transitions:
      - from: PROPOSED
        to: EFFECTIVE
        trigger: "system event: election becomes effective when plan_year reaches CENSUS_LOCKED and the linked SafeHarborNotice status == DISTRIBUTED or ACKNOWLEDGED"
        actor: system
        preconditions:
          - "election.status == PROPOSED"
          - "plan_year.status == CENSUS_LOCKED"
          - "linked SafeHarborNotice.status in {DISTRIBUTED, ACKNOWLEDGED}"
          - "notice.distributed_at is within [notice_period_start, notice_period_end]"
        side_effects:
          - "sets the governing PlanVersion.safe_harbor_design = election.design (ledger sync)"
          - "increments SafeHarborElection.version by 1"
      - from: EFFECTIVE
        to: SUSPENDED
        trigger: "POST /ndt/safe-harbor-elections/{id}/suspend"
        actor: PlanAdministrator
        preconditions:
          - "election.status == EFFECTIVE"
          - "suspension_reason is provided"
          - "plan_year.status != FILED"
        side_effects:
          - "sets governing PlanVersion.safe_harbor_design = NONE (the plan loses safe harbor for the year and becomes subject to ADP/ACP testing)"
          - "marks every TestRun for the plan_year with status in {PASSED, FAILED} as SUPERSEDED (staleness cascade)"
          - "increments SafeHarborElection.version by 1"
      - from: PROPOSED
        to: REVOKED
        trigger: "POST /ndt/safe-harbor-elections/{id}/revoke"
        actor: PlanAdministrator
        preconditions:
          - "election.status == PROPOSED"
        side_effects:
          - "increments SafeHarborElection.version by 1"

  - entity: SafeHarborNotice
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, LAPSED]
    transitions:
      - from: DRAFT
        to: DISTRIBUTED
        trigger: "POST /ndt/safe-harbor-notices/{id}/distribute"
        actor: PlanAdministrator
        preconditions:
          - "notice.status == DRAFT"
          - "logical clock now is within [notice_period_start, notice_period_end]"
        side_effects:
          - "sets distributed_at to logical clock now"
          - "increments SafeHarborNotice.version by 1"
      - from: DISTRIBUTED
        to: ACKNOWLEDGED
        trigger: "POST /ndt/safe-harbor-notices/{id}/acknowledge"
        actor: PlanAdministrator
        preconditions:
          - "notice.status == DISTRIBUTED"
        side_effects:
          - "increments SafeHarborNotice.version by 1"
      - from: DRAFT
        to: LAPSED
        trigger: "system event: logical clock advances past notice_period_end while status == DRAFT (evaluated on every clock set)"
        actor: system
        preconditions:
          - "notice.status == DRAFT"
          - "logical clock now > notice_period_end"
        side_effects:
          - "the linked SafeHarborElection cannot become EFFECTIVE via this notice (notice precondition fails)"

  - entity: Contribution
    initial_state: POSTED
    terminal_states: [DISTRIBUTED, RECHARACTERIZED, FORFEITED]
    transitions:
      - from: POSTED
        to: DISTRIBUTED
        trigger: "system cascade: Correction execute with correction_type == CORRECTIVE_DISTRIBUTION"
        actor: system
        preconditions:
          - "contribution.status == POSTED"
          - "contribution is selected by the corrective-distribution waterfall"
        side_effects:
          - "updates plan-year HCE cohort deferral totals (derived field reconciliation)"
      - from: POSTED
        to: RECHARACTERIZED
        trigger: "system cascade: Correction execute with correction_type == RECHARACTERIZATION"
        actor: system
        preconditions:
          - "contribution.status == POSTED"
          - "contribution.contribution_type == ELECTIVE_DEFERRAL"
        side_effects:
          - "creates a sibling Contribution with contribution_type == MATCH for the recharacterized amount (cross-entity ledger sync)"
      - from: POSTED
        to: FORFEITED
        trigger: "POST /ndt/contributions/{id}/forfeit"
        actor: PlanAdministrator
        preconditions:
          - "contribution.status == POSTED"
          - "contribution.contribution_type in {MATCH, PROFIT_SHARING, QNEC, QMAC}"
          - "plan_year.status in {CENSUS_LOCKED, TESTING, RESULTS_REVIEW, CORRECTING}"
        side_effects:
          - "marks every TestRun for the plan_year with status in {PASSED, FAILED} as SUPERSEDED (staleness cascade)"
          - "increments Contribution.version by 1"

  - entity: PlanVersion
    initial_state: DRAFT
    terminal_states: [ADOPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "POST /ndt/plan-versions/{id}/adopt"
        actor: PlanAdministrator
        preconditions:
          - "plan_version.status == DRAFT"
          - "effective_start < effective_end OR effective_end is null"
          - "if is_amendment == true: an existing ADOPTED PlanVersion for the same plan with overlapping [effective_start, effective_end) exists and will be truncated"
          - "no other ADOPTED PlanVersion for the same plan has an overlapping half-open interval [effective_start, effective_end) after truncation"
        side_effects:
          - "when adopting an amendment overlapping an existing ADOPTED version: truncates the prior version's effective_end to this version's effective_start; if the truncated interval becomes empty (prior.effective_start >= new effective_start), prior version transitions ADOPTED -> SUPERSEDED"
          - "increments PlanVersion.version by 1"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system cascade: amendment adoption fully covers the prior version's interval"
        actor: system
        preconditions:
          - "amendment adoption leaves zero remaining covered days"
        side_effects:
          - "any PlanYear whose adopted_version_id references this PlanVersion and whose status is still in {CENSUS_COLLECTING} is unaffected (pinning only happens at lock); already-locked years keep their pinned version (version-pinning on approval)"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: plan-year-lock-stale-version
    parent_entity: PlanYear
    write_endpoint: "POST /ndt/plan-years/{id}/lock-census"
    occ_field: "expected_plan_year_version"
    description: |
      Locking a census against a PlanYear whose version has advanced since the
      client last observed it is rejected. Captures the case where another writer
      has mutated the plan year (e.g., added a CensusEmployee or recorded a new
      compensation row, each bumping PlanYear.version) so the caller's census
      snapshot view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: correction-approve-stale-version
    parent_entity: Correction
    write_endpoint: "POST /ndt/corrections/{id}/approve"
    occ_field: "expected_correction_version"
    description: |
      Approving a Correction whose version has advanced since the client last
      observed it is rejected. Captures the case where the proposing analyst has
      amended the amount or target since the approver's view, so the approval
      would otherwise sign off on terms the approver never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: election-suspend-stale-version
    parent_entity: SafeHarborElection
    write_endpoint: "POST /ndt/safe-harbor-elections/{id}/suspend"
    occ_field: "expected_election_version"
    description: |
      Suspending a SafeHarborElection whose version has advanced since the
      client last observed it is rejected, because the suspension resets the
      governing PlanVersion.safe_harbor_design and supersedes test runs —
      actions that must be taken against a current view of the election.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ownership_attribution
    trigger: "PlanYear lock-census; also re-evaluated when a CensusEmployee.family_member_of_ssn or ownership_pct_direct is updated while CENSUS_COLLECTING (field change marks derived values dirty; recomputed lazily on next read and definitely at next lock)"
    algorithm: constraint_propagation
    formula: |
      For each CensusEmployee e in plan_year:
        attributed = e.ownership_pct_direct
        # IRC 318 family attribution: spouse, child, parent, grandparent
        for each CensusEmployee f where f.family_member_of_ssn == e.ssn and f.plan_year_id == e.plan_year_id:
            attributed += f.ownership_pct_direct
        # Bidirectional: e also absorbs ownership of any employee who lists e as family
        for each CensusEmployee p where e.family_member_of_ssn == p.ssn and p.plan_year_id == e.plan_year_id:
            attributed += p.ownership_pct_direct
        # Entity attribution (employer is CORPORATION or S_CORPORATION):
        #   a >=50% owner's percentage is attributed to the corporation's employees
        #   per controlled-group rollup: capped at 100.
        e.attributed_ownership_pct = min(100, attributed)
      Evaluation order: direct sum -> family in -> family out -> entity cap.
      Family attribution is NOT transitive through two hops (A->B->C does not
      attribute A to C) — only one hop per IRC 318(a)(1) as modeled here.
    input_set: "CensusEmployee rows for the plan_year (all employment_status values)"
    constants:
      OWNERSHIP_CAP_PCT: 100
      FAMILY_ATTRIBUTION_HOPS: 1
    precision: "4 decimal places on percentages, round_half_up"
    variants: []

  - name: hce_determination
    trigger: "PlanYear lock-census"
    algorithm: threshold
    formula: |
      limit = RegulatoryLimit(year_label == plan_year.year_label, status == ACTIVE)
      For each CensusEmployee e:
        if e.employment_status == TERMINATED and termination before year_start of plan year:
            e.hce_status = EXCLUDED_FROM_TESTING; continue
        comp_prior = sum(CompensationRecord.amount_cents where census_employee_id == e.id
                          and comp_source == plan_year.comp_definition
                          and period == PRIOR_YEAR)
        is_hce = (e.attributed_ownership_pct > 5.0)   # strictly greater than 5%
              or (comp_prior > limit.hce_comp_threshold_cents)   # strictly greater
              or (e.is_officer and comp_prior > limit.key_officer_comp_threshold_cents)
        # top-paid group election NOT adopted in this system (out of scope)
        e.hce_status = HCE if is_hce else NHCE
    input_set: "CensusEmployee rows for plan_year; CompensationRecord rows with period == PRIOR_YEAR under the plan's adopted comp_definition"
    constants:
      OWNERSHIP_TEST_PCT: 5.0
    precision: "integer cents comparison; no rounding"
    variants:
      - name: lookback_year_basis
        when: "always — HCE status is determined on PRIOR_YEAR compensation"
        difference: "uses PRIOR_YEAR compensation records only; CURRENT_YEAR records never enter HCE determination"

  - name: key_employee_determination
    trigger: "PlanYear lock-census"
    algorithm: threshold
    formula: |
      limit = RegulatoryLimit(year_label == plan_year.year_label, status == ACTIVE)
      For each CensusEmployee e:
        comp_cur = sum(CompensationRecord.amount_cents where census_employee_id == e.id
                        and comp_source == plan_year.comp_definition
                        and period == CURRENT_YEAR)
        is_key = (e.attributed_ownership_pct > 5.0)
              or (e.attributed_ownership_pct > 1.0 and comp_cur > 15000000)   # 1% owner w/ comp > $150k
              or (e.is_officer and comp_cur > limit.key_officer_comp_threshold_cents)
        e.key_employee_status = KEY if is_key else NON_KEY
        if e.employment_status == TERMINATED and e.date_of_termination < plan_year.year_start:
            e.key_employee_status = EXCLUDED_FROM_TESTING
    input_set: "CensusEmployee rows for plan_year; CompensationRecord rows with period == CURRENT_YEAR"
    constants:
      OFFICER_TEST: true
      ONE_PCT_OWNER_COMP_CENTS: 15000000
    precision: "integer cents comparison; no rounding"
    variants: []

  - name: coverage_ratio_410b
    trigger: "TestRun QUEUED->RUNNING with test_scope in {COVERAGE_410B, FULL_SUITE}"
    algorithm: aggregation
    formula: |
      cohort = CensusEmployee where hce_status != EXCLUDED_FROM_TESTING
      excludable = rows where covered_status == EXCLUDABLE  # statutory exclusions
      benefiting_hce   = count(covered_status == BENEFITING and hce_status == HCE)
      eligible_hce     = count(hce_status == HCE and covered_status != EXCLUDABLE)
      benefiting_nhce  = count(covered_status == BENEFITING and hce_status == NHCE)
      eligible_nhce    = count(hce_status == NHCE and covered_status != EXCLUDABLE)
      if eligible_hce == 0: line outcome = NOT_APPLICABLE
      else:
        hce_pct  = 100.0 * benefiting_hce / eligible_hce
        nhce_pct = 100.0 * benefiting_nhce / eligible_nhce
        ratio    = nhce_pct / hce_pct * 100 when hce_pct > 0 else 0
        value_pct = round(ratio, 4)
        threshold_pct = 70.0000
        outcome = PASS if value_pct >= threshold_pct else FAIL   # >= boundary, inclusive
    input_set: "CensusEmployee in plan_year with hce_status != EXCLUDED_FROM_TESTING"
    constants:
      COVERAGE_THRESHOLD_PCT: 70.0
    precision: "4 decimal places, round_half_up; compare at the rounded value"
    variants: []

  - name: adp_test_401k
    trigger: "TestRun QUEUED->RUNNING with test_scope in {ADP_401K, FULL_SUITE}"
    algorithm: aggregation
    formula: |
      cohort = CensusEmployee with hce_status in {HCE, NHCE} and covered_status in {BENEFITING, ELIGIBLE_NOT_BENEFITING}
      For each member m:
        comp_m = sum(CompensationRecord.amount_cents where census_employee_id == m.id
                      and comp_source == plan_year.comp_definition and period == CURRENT_YEAR)
        deferrals_m = sum(Contribution.amount_cents where census_employee_id == m.id
                           and contribution_type == ELECTIVE_DEFERRAL
                           and status in {POSTED, PENDING_DISTRIBUTION})
        # DISTRIBUTED / RECHARACTERIZED deferrals are EXCLUDED in FINAL mode,
        # INCLUDED in PROVISIONAL mode (see variants)
        adr_m = if comp_m > 0 then 100.0 * deferrals_m / comp_m else 0
      adp_hce  = mean(adr_m over HCE members)    # simple average of individual ratios
      adp_nhce = mean(adr_m over NHCE members)
      ceiling = min(adp_nhce * 1.25, adp_nhce + 2.0, adp_nhce * 2.0)
      # the 1.25x prong and the lesser-of( +2 pct pts, 2x ) prong
      ceiling = max(adp_nhce * 1.25, min(adp_nhce + 2.0, adp_nhce * 2.0))
      value_pct (ADP_HCE_PCT)   = round(adp_hce, 4)
      value_pct (ADP_NHCE_PCT)  = round(adp_nhce, 4)
      value_pct (ADP_CEILING_PCT) = round(ceiling, 4)
      outcome = PASS if adp_hce <= ceiling else FAIL    # <= boundary, inclusive
    input_set: "CensusEmployee in plan_year with covered_status in {BENEFITING, ELIGIBLE_NOT_BENEFITING}; Contributions of type ELECTIVE_DEFERRAL"
    constants:
      BASIC_MULTIPLIER: 1.25
      ALT_ADDER_PCT: 2.0
      ALT_MULTIPLIER: 2.0
    precision: "individual ADR rounded to 4 decimals round_half_up BEFORE averaging; averages rounded to 4 decimals round_half_up"
    variants:
      - name: provisional_vs_final
        when: "run_mode == PROVISIONAL includes PENDING_DISTRIBUTION and DISTRIBUTED deferrals as if still posted; run_mode == FINAL excludes DISTRIBUTED and RECHARACTERIZED amounts"
        difference: "identical census + contributions yield a lower HCE ADP in FINAL after corrective distributions execute — the divergence drives the correction workflow"

  - name: acp_test_401m
    trigger: "TestRun QUEUED->RUNNING with test_scope in {ACP_401M, FULL_SUITE}"
    algorithm: aggregation
    formula: |
      Same cohort and structure as adp_test_401k but numerator is
        sum(Contribution.amount_cents where contribution_type in {MATCH, QMAC}
             and status in {POSTED, PENDING_DISTRIBUTION})
      plus after-tax employee contributions (not modeled separately; MATCH+QNEC excluded — QNEC counts only when elected to shift, see correction methods).
      Ceiling logic identical to ADP: max(1.25x, min(+2pp, 2x)) on NHCE ACR average.
    input_set: "CensusEmployee in plan_year with covered_status in {BENEFITING, ELIGIBLE_NOT_BENEFITING}; Contributions of type MATCH, QMAC"
    constants:
      BASIC_MULTIPLIER: 1.25
      ALT_ADDER_PCT: 2.0
      ALT_MULTIPLIER: 2.0
    precision: "individual ACR rounded to 4 decimals round_half_up BEFORE averaging; averages rounded to 4 decimals round_half_up"
    variants:
      - name: provisional_vs_final
        when: "same semantics as adp_test_401k variants"
        difference: "FINAL excludes DISTRIBUTED amounts"

  - name: top_heavy_determination
    trigger: "TestRun QUEUED->RUNNING with test_scope in {TOP_HEAVY_416, FULL_SUITE}"
    algorithm: aggregation
    formula: |
      # Determination date: last day of PRIOR plan year for years after the first;
      # for the first plan year, last day of CURRENT year (forward-looking).
      key_balance = sum over CensusEmployee where key_employee_status == KEY of
          all Contribution.amount_cents with status in {POSTED, PENDING_DISTRIBUTION, DISTRIBUTED}
      all_balance = sum over CensusEmployee where key_employee_status != EXCLUDED_FROM_TESTING of
          all Contribution.amount_cents with status in {POSTED, PENDING_DISTRIBUTION, DISTRIBUTED}
      ratio = if all_balance > 0 then 100.0 * key_balance / all_balance else 0
      value_pct (TOP_HEAVY_RATIO_PCT) = round(ratio, 4)
      threshold_pct = 60.0000
      outcome = FAIL (plan IS top-heavy) if value_pct > threshold_pct else PASS   # strictly greater than 60%
      # when top-heavy: minimum contribution owed = lesser of 3% of NHCE comp or
      # the highest key-employee contribution rate; computed by top_heavy_minimum_contribution.
    input_set: "Contributions of all CensusEmployee rows in plan_year (all statuses except FORFEITED)"
    constants:
      TOP_HEAVY_THRESHOLD_PCT: 60.0
    precision: "4 decimal places, round_half_up"
    variants:
      - name: first_year_forward_looking
        when: "plan_year.prior_year_py_id is null"
        difference: "determination date is the last day of the CURRENT year and contribution balances include current-year accruals; subsequent years measure as of the prior year's last day and use prior-year balances only"

  - name: top_heavy_minimum_contribution
    trigger: "derived when top_heavy_determination outcome == FAIL on a FINAL run; surfaced in TestResultLine.detail.min_contribution_cents"
    algorithm: waterfall_allocation
    formula: |
      key_rate_max = max over KEY employees of (100.0 * key_contribs_m / comp_m)
      floor_pct = min(3.0, key_rate_max)
      For each NHCE m with covered_status == BENEFITING:
          owed_m = floor_pct * comp_m / 100
          already_m = sum(employer-source Contribution.amount_cents where census_employee_id == m.id
                           and contribution_type in {MATCH, QNEC, QMAC, PROFIT_SHARING}
                           and status in {POSTED, PENDING_DISTRIBUTION})
          shortfall_m = max(0, owed_m - already_m)
      total_minimum_cents = sum(shortfall_m)
      # allocation waterfall: QNEC funding fills shortfalls in order of
      # smallest shortfall first; tie-break employee created_at ASC; any
      # rounding remainder (cents) goes to the earliest-created NHCE.
    input_set: "CensusEmployee with key_employee_status == NON_KEY and covered_status == BENEFITING; their CURRENT_YEAR compensation and employer-source contributions"
    constants:
      FLOOR_PCT: 3.0
    precision: "per-employee owed rounded to whole cents round_half_up; remainders allocated to earliest-created NHCE (created_at ASC)"
    variants: []

  - name: cafeteria_125_eligibility_test
    trigger: "TestRun QUEUED->RUNNING with test_scope in {CAFETERIA_125, FULL_SUITE} and plan.plan_type == CAFETERIA_125"
    algorithm: aggregation
    formula: |
      eligibility_pct = 100.0 * count(eligible NHCE) / count(all NHCE non-excludable)
      key_concentration_pct = 100.0 * (pretax benefits of KEY employees) / (total pretax benefits)
      where pretax benefits = sum(Contribution.amount_cents where contribution_type == CAFETERIA_PRETAX and status == POSTED)
      outcomes: eligibility line PASS if eligibility_pct >= 70.0
                concentration line (KEY_EMPLOYEE_CONCENTRATION_PCT) PASS if key_concentration_pct <= 25.0
    input_set: "CensusEmployee in plan_year; CAFETERIA_PRETAX contributions"
    constants:
      ELIGIBILITY_THRESHOLD_PCT: 70.0
      KEY_CONCENTRATION_CEILING_PCT: 25.0
    precision: "4 decimal places, round_half_up"
    variants: []

  - name: dependent_care_129_average_benefits
    trigger: "TestRun QUEUED->RUNNING with test_scope in {DEPENDENT_CARE_129, FULL_SUITE} and plan.plan_type == DEPENDENT_CARE_FSA"
    algorithm: aggregation
    formula: |
      For each non-excludable employee m:
        benefit_m = sum(Contribution.amount_cents where census_employee_id == m.id
                         and contribution_type == DEPENDENT_CARE_ELECTIVE and status == POSTED)
        benefit_m = min(benefit_m, RegulatoryLimit.dependent_care_limit_cents)   # statutory cap applied per-person BEFORE averaging
        pct_of_comp_m = if comp_m > 0 then 100.0 * benefit_m / comp_m else 0
      avg_hce  = mean(pct_of_comp_m over HCE)
      avg_nhce = mean(pct_of_comp_m over NHCE)
      value_pct (DEPENDENT_CARE_55PCT_AVG_PCT) = round(100.0 * avg_hce / avg_nhce, 4) if avg_nhce > 0 else (0 if avg_hce == 0 else 999.9999)
      outcome = PASS if avg_hce <= 0.55 * avg_nhce   # 55% average benefits test
    input_set: "CensusEmployee non-excludable; DEPENDENT_CARE_ELECTIVE contributions"
    constants:
      AVERAGE_BENEFITS_RATIO: 0.55
    precision: "per-person capped benefit in integer cents; per-person ratio rounded 4 decimals round_half_up BEFORE averaging"
    variants: []

  - name: corrective_distribution_excise
    trigger: "Correction APPROVED->EXECUTED and PlanYear CORRECTING->FILED"
    algorithm: threshold
    formula: |
      deadline = plan_year.year_end + 12 months (calendar arithmetic; e.g. 2026-12-31 -> 2027-12-31)
      if executed_at <= deadline: excise_tax_cents = 0, excise_status = NOT_ASSESSED
      else: excise_tax_cents = round(0.10 * amount_cents, 0)  (round_half_up to whole cents)
            excise_status = ASSESSED
      gap_period_income_cents = allocable earnings on the distributed amount from
      year_end to executed_at, computed at a flat deemed rate of 7% per annum
      pro-rated by ACT/365 on the excess amount:
        days = (executed_at.date - year_end).days
        gap_period_income_cents = round(amount_cents * 0.07 * days / 365, 0)
    input_set: "the Correction row and its PlanYear"
    constants:
      EXCISE_RATE: 0.10
      DEEMED_EARNINGS_RATE: 0.07
      DAY_COUNT: 365
    precision: "whole cents, round_half_up"
    variants: []

  - name: safe_harbor_notice_window_check
    trigger: "SafeHarborNotice DRAFT->DISTRIBUTED and system clock advance"
    algorithm: threshold
    formula: |
      window_valid = notice_period_start <= now <= notice_period_end
      and notice_period_end <= plan_year.year_start - 1 day  (notice must complete before the plan year begins for initial elections)
      or (plan_year already CENSUS_COLLECTING and notice_period_end <= year_end - 30 days) for mid-year amendments
      Violation at distribute time -> ERR_NOTICE_WINDOW_CLOSED.
    input_set: "SafeHarborNotice, its SafeHarborElection, and the PlanYear"
    constants:
      MIN_NOTICE_DAYS_BEFORE_YEAR_END: 30
    precision: "date granularity (whole days)"
    variants: []

  - name: mid_year_amendment_impact
    trigger: "PlanVersion DRAFT->ADOPTED with is_amendment == true and an overlapping ADOPTED version exists"
    algorithm: forward_looking
    formula: |
      days_amended = (amendment.effective_end or plan_year.year_end) - amendment.effective_start + 1 (inclusive days)
      days_total   = plan_year.year_end - plan_year.year_start + 1
      proration    = days_amended / days_total
      if amendment changes comp_definition or safe_harbor_design:
          every TestRun for the plan_year with status in {PASSED, FAILED} -> SUPERSEDED
      projected_safe_harbor_match_cents (when new design in {BASIC_MATCH, ENHANCED_MATCH}):
          per employee: match under formula * proration, rounded per-employee to whole cents round_half_up
      Surfaced in the amendment adoption response as impact projection.
    input_set: "the amending PlanVersion, the PlanYear(s) it overlaps, census + contributions"
    constants:
      DAY_BASIS: "inclusive calendar days"
    precision: "per-employee projection rounded to whole cents round_half_up; proration factor carried at 6 decimals"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted to invoke the endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-template ids resolve to existing entities (left-to-right: employer, plan, plan-year, then child); wrong parent chain returns 404"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Employer.status == ACTIVE for any child creation under it"
    error_id: ERR_EMPLOYER_ARCHIVED
    http_status: 409
    applies_to: ["POST /ndt/employers/{id}/plans"]
  - priority: 5
    category: state
    check: "Plan.status == ACTIVE for PlanVersion and PlanYear creation"
    error_id: ERR_PLAN_TERMINATED
    http_status: 409
    applies_to: ["POST /ndt/plans/{id}/plan-versions", "POST /ndt/plans/{id}/plan-years"]
  - priority: 6
    category: state
    check: "PlanYear.status permits the requested mutation (census writes only in CENSUS_COLLECTING; test-run creation only in CENSUS_LOCKED/TESTING/RESULTS_REVIEW; corrections only in CORRECTING; file only in CORRECTING)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["POST /ndt/plan-years/{id}/census-employees", "POST /ndt/census-employees/{id}/compensation-records", "POST /ndt/census-employees/{id}/contributions", "POST /ndt/plan-years/{id}/test-runs", "POST /ndt/plan-years/{id}/corrections", "POST /ndt/plan-years/{id}/file", "POST /ndt/plan-years/{id}/open-census", "POST /ndt/plan-years/{id}/lock-census", "POST /ndt/plan-years/{id}/unlock-census", "POST /ndt/plan-years/{id}/terminate", "POST /ndt/plan-years/{id}/safe-harbor-elections"]
  - priority: 7
    category: state
    check: "TestRun/Correction/Election/Notice current state allows the transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["POST /ndt/test-runs/{id}/void", "POST /ndt/test-runs/{id}/finalize", "POST /ndt/corrections/{id}/approve", "POST /ndt/corrections/{id}/execute", "POST /ndt/corrections/{id}/void", "POST /ndt/safe-harbor-elections/{id}/suspend", "POST /ndt/safe-harbor-elections/{id}/revoke", "POST /ndt/safe-harbor-notices/{id}/distribute", "POST /ndt/safe-harbor-notices/{id}/acknowledge"]
  - priority: 8
    category: business_safety
    check: "segregation of duties: Correction approver X-User-ID must differ from proposer_user_id recorded at proposal"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /ndt/corrections/{id}/approve"]
  - priority: 9
    category: business_safety
    check: "OCC: expected_<parent>_version matches the entity's current version (412 on mismatch)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /ndt/plan-years/{id}/lock-census", "POST /ndt/corrections/{id}/approve", "POST /ndt/safe-harbor-elections/{id}/suspend"]
  - priority: 10
    category: business_referential
    check: "FK integrity: census_employee_id belongs to the same plan_year chain as the request context; family_member_of_ssn references an existing CensusEmployee.ssn within the same PlanYear (self-reference); controlled_group_id references an existing Employer; prior_year_py_id references a PlanYear of the same Plan"
    error_id: ERR_FK_INTEGRITY
    http_status: 422
    applies_to: ["POST /ndt/census-employees/{id}/compensation-records", "POST /ndt/census-employees/{id}/contributions", "POST /ndt/plan-years/{id}/census-employees", "POST /ndt/employers", "POST /ndt/plans/{id}/plan-years", "POST /ndt/plan-years/{id}/corrections", "POST /ndt/plan-years/{id}/safe-harbor-elections"]
  - priority: 11
    category: business_constraint
    check: "uniqueness: ein unique across Employers; ssn unique within PlanYear; plan_number unique within Employer; one SafeHarborElection with status in {PROPOSED, EFFECTIVE} per PlanYear"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: ["POST /ndt/employers", "POST /ndt/plan-years/{id}/census-employees", "POST /ndt/employers/{id}/plans", "POST /ndt/plan-years/{id}/safe-harbor-elections"]
  - priority: 12
    category: business_constraint
    check: "enum and shape: all enum fields carry a declared member; dates are ISO; percentages 0-100; amounts positive where required; sh_match_formula present iff safe_harbor_design in {BASIC_MATCH, ENHANCED_MATCH}"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 13
    category: business_temporal
    check: "date intervals: PlanVersion.effective_start < effective_end; PlanYear.year_start < year_end; SafeHarborNotice.notice_period_start <= notice_period_end; contribution_date within [plan_year.year_start, plan_year.year_end]"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: ["POST /ndt/plans/{id}/plan-versions", "POST /ndt/plans/{id}/plan-years", "POST /ndt/safe-harbor-elections/{id}/notices", "POST /ndt/census-employees/{id}/contributions"]
  - priority: 14
    category: business_temporal
    check: "SafeHarborNotice distribution: logical clock now within [notice_period_start, notice_period_end] and window satisfies safe_harbor_notice_window_check"
    error_id: ERR_NOTICE_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /ndt/safe-harbor-notices/{id}/distribute"]
  - priority: 15
    category: business_constraint
    check: "PlanVersion adoption: no overlapping ADOPTED interval after truncation; amendment (is_amendment == true) requires an overlapping ADOPTED version to amend"
    error_id: ERR_VERSION_INTERVAL_CONFLICT
    http_status: 409
    applies_to: ["POST /ndt/plan-versions/{id}/adopt"]
  - priority: 16
    category: business_referential
    check: "lock-census completeness: every CensusEmployee has a CURRENT_YEAR CompensationRecord under the plan's comp_definition; an ADOPTED PlanVersion covers year_start; an ACTIVE RegulatoryLimit exists for year_label"
    error_id: ERR_CENSUS_INCOMPLETE
    http_status: 422
    applies_to: ["POST /ndt/plan-years/{id}/lock-census"]
  - priority: 17
    category: business_constraint
    check: "unlock-census blocked while any TestRun is QUEUED/RUNNING or any Correction is PROPOSED/APPROVED for the plan year"
    error_id: ERR_PENDING_WORK
    http_status: 409
    applies_to: ["POST /ndt/plan-years/{id}/unlock-census"]
  - priority: 18
    category: business_fiscal
    check: "Correction amount_cents > 0 and, for CORRECTIVE_DISTRIBUTION, does not exceed the sum of POSTED ELECTIVE_DEFERRAL contributions of target employee"
    error_id: ERR_CORRECTION_AMOUNT_INVALID
    http_status: 422
    applies_to: ["POST /ndt/plan-years/{id}/corrections", "POST /ndt/corrections/{id}/execute"]
  - priority: 19
    category: business_fiscal
    check: "Contribution.amount_cents > 0; CompensationRecord.amount_cents >= 0; per-employee total ELECTIVE_DEFERRAL (POSTED + PENDING_DISTRIBUTION) must not exceed RegulatoryLimit.sec402g_limit_cents for the year"
    error_id: ERR_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /ndt/census-employees/{id}/contributions", "POST /ndt/census-employees/{id}/compensation-records"]
  - priority: 20
    category: business_temporal
    check: "SafeHarborElection suspend requires suspension_reason and plan_year.status != FILED"
    error_id: ERR_ELECTION_LOCKED
    http_status: 409
    applies_to: ["POST /ndt/safe-harbor-elections/{id}/suspend"]
  - priority: 21
    category: state
    check: "plan_year.file precondition: all corrections terminal and latest FINAL test run passes"
    error_id: ERR_UNRESOLVED_FAILURES
    http_status: 409
    applies_to: ["POST /ndt/plan-years/{id}/file"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/ndt/_clock/set_current_utc"
    description: "Sets the server logical clock. Startup default is 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly that default and never falls back to wall-clock time. Advancing the clock re-evaluates SafeHarborNotice LAPSED transitions."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["evaluates SafeHarborNotice DRAFT -> LAPSED for notices whose notice_period_end < now"]

  # --- Employer ---
  - method: POST
    path: "/ndt/employers"
    description: "Create an employer"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, ein, entity_type, "controlled_group_id?"]
    output: Employer
    side_effects: []
  - method: POST
    path: "/ndt/employers/{id}/archive"
    description: "Archive an employer (ACTIVE -> ARCHIVED); archival is refused while any Plan under it has status == ACTIVE and a non-terminal PlanYear"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: ["sets Employer.status = ARCHIVED", "increments Employer.version by 1"]
  - method: GET
    path: "/ndt/employers/{id}"
    description: "Fetch an employer"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: Employer
    side_effects: []
  - method: GET
    path: "/ndt/employers"
    description: "List employers with pagination; optional filters"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["status?", "entity_type?", "controlled_group_id?", "limit?", "offset?"]
    output: Employer[]
    side_effects: []
  - method: GET
    path: "/ndt/employers/{id}/plans"
    description: "List plans of an employer (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Plan[]
    side_effects: []
  - method: POST
    path: "/ndt/employers/{id}/plans"
    description: "Create a plan under an employer"
    roles: [PlatformAdmin, PlanAdministrator]
    code: 201
    input: [plan_name, plan_type, plan_number]
    output: Plan
    side_effects: []

  # --- Plan ---
  - method: GET
    path: "/ndt/plans/{id}"
    description: "Fetch a plan"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: GET
    path: "/ndt/plans/{id}/plan-versions"
    description: "List versions of a plan (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PlanVersion[]
    side_effects: []
  - method: POST
    path: "/ndt/plans/{id}/plan-versions"
    description: "Create a plan version (provisions set)"
    roles: [PlatformAdmin, PlanAdministrator]
    code: 201
    input: [effective_start, "effective_end?", comp_definition, "safe_harbor_design?", "sh_match_formula?", "entry_frequency?", "is_amendment?"]
    output: PlanVersion
    side_effects: []
  - method: GET
    path: "/ndt/plans/{id}/plan-years"
    description: "List plan years of a plan (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PlanYear[]
    side_effects: []
  - method: POST
    path: "/ndt/plans/{id}/plan-years"
    description: "Create a plan year"
    roles: [PlatformAdmin, PlanAdministrator]
    code: 201
    input: [year_label, year_start, year_end, "prior_year_py_id?"]
    output: PlanYear
    side_effects: []

  # --- PlanVersion ---
  - method: GET
    path: "/ndt/plan-versions/{id}"
    description: "Fetch a plan version"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: PlanVersion
    side_effects: []
  - method: POST
    path: "/ndt/plan-versions/{id}/adopt"
    description: "Adopt a plan version; handles amendment truncation of overlapping ADOPTED versions and returns mid-year impact projection when is_amendment"
    roles: [PlatformAdmin, PlanAdministrator]
    code: 200
    input: []
    output: PlanVersion
    side_effects: ["truncates or supersedes overlapping ADOPTED versions", "if is_amendment: computes mid_year_amendment_impact projection (returned in the response detail) and supersedes affected TestRuns"]

  # --- PlanYear ---
  - method: GET
    path: "/ndt/plan-years"
    description: "List plan years across plans (filtered-list FK reverse reachability for prior_year_py_id and adopted_version_id)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["plan_id?", "status?", "prior_year_py_id?", "adopted_version_id?", "limit?", "offset?"]
    output: PlanYear[]
    side_effects: []
  - method: GET
    path: "/ndt/plan-years/{id}"
    description: "Fetch a plan year"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: PlanYear
    side_effects: []
  - method: POST
    path: "/ndt/plan-years/{id}/open-census"
    description: "DRAFT -> CENSUS_COLLECTING"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: PlanYear
    side_effects: ["increments PlanYear.version by 1"]
  - method: POST
    path: "/ndt/plan-years/{id}/lock-census"
    description: "CENSUS_COLLECTING -> CENSUS_LOCKED; runs attribution/HCE/key/coverage classification; OCC-guarded"
    roles: [PlanAdministrator]
    code: 200
    input: [expected_plan_year_version]
    output: PlanYear
    side_effects: ["sets adopted_version_id", "increments census_lock_version", "runs ownership_attribution, hce_determination, key_employee_determination, coverage_cohort_classification", "increments PlanYear.version by 1"]
  - method: POST
    path: "/ndt/plan-years/{id}/unlock-census"
    description: "CENSUS_LOCKED -> CENSUS_COLLECTING; supersedes all terminal TestRuns"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: PlanYear
    side_effects: ["marks every PASSED/FAILED TestRun SUPERSEDED", "increments PlanYear.version by 1"]
  - method: POST
    path: "/ndt/plan-years/{id}/terminate"
    description: "DRAFT/CENSUS_COLLECTING -> TERMINATED; cascades Plan.status = TERMINATED"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: PlanYear
    side_effects: ["sets Plan.status = TERMINATED", "increments PlanYear.version by 1"]
  - method: POST
    path: "/ndt/plan-years/{id}/file"
    description: "CORRECTING -> FILED; assesses excise on late corrections"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: PlanYear
    side_effects: ["assesses excise tax on late EXECUTED corrections", "increments PlanYear.version by 1"]
  - method: GET
    path: "/ndt/plan-years/{id}/census-employees"
    description: "List census employees of a plan year (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["hce_status?", "covered_status?", "limit?", "offset?"]
    output: CensusEmployee[]
    side_effects: []
  - method: POST
    path: "/ndt/plan-years/{id}/census-employees"
    description: "Add an employee to the census (CENSUS_COLLECTING only)"
    roles: [PlanAdministrator]
    code: 201
    input: [ssn, full_name, date_of_birth, date_of_hire, "date_of_termination?", employment_status, "ownership_pct_direct?", "is_officer?", "family_member_of_ssn?"]
    output: CensusEmployee
    side_effects: ["increments PlanYear.version by 1 (census mutation bumps parent version)"]
  - method: GET
    path: "/ndt/plan-years/{id}/test-runs"
    description: "List test runs of a plan year (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["status?", "test_scope?", "run_mode?", "limit?", "offset?"]
    output: TestRun[]
    side_effects: []
  - method: POST
    path: "/ndt/plan-years/{id}/test-runs"
    description: "Queue a nondiscrimination test run (CENSUS_LOCKED/TESTING/RESULTS_REVIEW)"
    roles: [ComplianceAnalyst]
    code: 201
    input: [test_scope, run_mode]
    output: TestRun
    side_effects: ["PlanYear transitions to TESTING when in CENSUS_LOCKED or RESULTS_REVIEW", "increments PlanYear.version by 1"]
  - method: GET
    path: "/ndt/plan-years/{id}/corrections"
    description: "List corrections of a plan year (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["status?", "correction_type?", "limit?", "offset?"]
    output: Correction[]
    side_effects: []
  - method: POST
    path: "/ndt/plan-years/{id}/corrections"
    description: "Propose a correction (RESULTS_REVIEW -> CORRECTING on first proposal)"
    roles: [ComplianceAnalyst]
    code: 201
    input: [test_run_id, correction_type, "target_census_employee_id?", amount_cents]
    output: Correction
    side_effects: ["records proposer_user_id from X-User-ID for segregation-of-duties", "PlanYear RESULTS_REVIEW -> CORRECTING", "increments PlanYear.version by 1"]
  - method: GET
    path: "/ndt/plan-years/{id}/safe-harbor-elections"
    description: "List safe harbor elections of a plan year (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SafeHarborElection[]
    side_effects: []
  - method: POST
    path: "/ndt/plan-years/{id}/safe-harbor-elections"
    description: "Propose a safe harbor election for the plan year"
    roles: [PlanAdministrator]
    code: 201
    input: [design, elected_on]
    output: SafeHarborElection
    side_effects: ["increments PlanYear.version by 1"]

  # --- CensusEmployee ---
  - method: GET
    path: "/ndt/census-employees/{id}"
    description: "Fetch a census employee (includes computed hce_status, key_employee_status, covered_status, attributed_ownership_pct)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: CensusEmployee
    side_effects: []
  - method: PATCH
    path: "/ndt/census-employees/{id}"
    description: "Update census employee input fields (CENSUS_COLLECTING only); recomputes dirty derived fields"
    roles: [PlanAdministrator]
    code: 200
    input: ["full_name?", "date_of_birth?", "date_of_hire?", "date_of_termination?", "employment_status?", "ownership_pct_direct?", "is_officer?", "family_member_of_ssn?"]
    output: CensusEmployee
    side_effects: ["marks derived attribution/HCE/key values dirty; recomputed at next lock", "increments PlanYear.version by 1"]
  - method: GET
    path: "/ndt/census-employees/{id}/compensation-records"
    description: "List compensation records of an employee (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["comp_source?", "period?", "limit?", "offset?"]
    output: CompensationRecord[]
    side_effects: []
  - method: POST
    path: "/ndt/census-employees/{id}/compensation-records"
    description: "Add a compensation record (CENSUS_COLLECTING only)"
    roles: [PlanAdministrator]
    code: 201
    input: [comp_source, amount_cents, period]
    output: CompensationRecord
    side_effects: ["increments PlanYear.version by 1"]
  - method: GET
    path: "/ndt/census-employees/{id}/contributions"
    description: "List contributions of an employee (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["contribution_type?", "status?", "limit?", "offset?"]
    output: Contribution[]
    side_effects: []
  - method: POST
    path: "/ndt/census-employees/{id}/contributions"
    description: "Post a contribution (plan_year in CENSUS_LOCKED/TESTING/RESULTS_REVIEW/CORRECTING or CENSUS_COLLECTING)"
    roles: [PlanAdministrator]
    code: 201
    input: [contribution_type, amount_cents, contribution_date]
    output: Contribution
    side_effects: ["validates 402(g) limit", "increments PlanYear.version by 1"]

  # --- RegulatoryLimit ---
  - method: POST
    path: "/ndt/regulatory-limits"
    description: "Publish statutory limits for a calendar year"
    roles: [PlatformAdmin]
    code: 201
    input: [year_label, hce_comp_threshold_cents, key_officer_comp_threshold_cents, sec402g_limit_cents, sec415_annual_additions_limit_cents, dependent_care_limit_cents]
    output: RegulatoryLimit
    side_effects: ["supersedes any prior ACTIVE row for the same year_label"]
  - method: GET
    path: "/ndt/regulatory-limits"
    description: "List regulatory limits (filtered by year)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["year_label?", "status?", "limit?", "offset?"]
    output: RegulatoryLimit[]
    side_effects: []

  # --- TestRun / TestResultLine ---
  - method: GET
    path: "/ndt/test-runs/{id}"
    description: "Fetch a test run"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: TestRun
    side_effects: []
  - method: GET
    path: "/ndt/test-runs/{id}/result-lines"
    description: "List result lines of a test run (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["metric?", "outcome?", "limit?", "offset?"]
    output: TestResultLine[]
    side_effects: []
  - method: POST
    path: "/ndt/test-runs/{id}/finalize"
    description: "PlanYear TESTING -> RESULTS_REVIEW for a completed FINAL run"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: TestRun
    side_effects: ["increments PlanYear.version by 1"]
  - method: POST
    path: "/ndt/test-runs/{id}/void"
    description: "QUEUED -> VOID"
    roles: [ComplianceAnalyst]
    code: 200
    input: []
    output: TestRun
    side_effects: []
  - method: POST
    path: "/ndt/test-runs/{id}/execute-synchronously"
    description: "Test-driving helper: synchronously advances QUEUED -> RUNNING -> PASSED/FAILED in one call (equivalent to waiting for the system engine pick-up). Deterministic ordering: per plan_year, queued runs execute in created_at ASC."
    roles: [PlatformAdmin, ComplianceAnalyst]
    code: 200
    input: []
    output: TestRun
    side_effects: ["executes the metric battery per test_scope and creates TestResultLine rows", "sets overall_result"]

  # --- Correction ---
  - method: GET
    path: "/ndt/corrections"
    description: "List corrections across plan years (filtered-list FK reverse reachability for test_run_id and target_census_employee_id)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["plan_year_id?", "test_run_id?", "target_census_employee_id?", "status?", "correction_type?", "excise_status?", "limit?", "offset?"]
    output: Correction[]
    side_effects: []
  - method: GET
    path: "/ndt/corrections/{id}"
    description: "Fetch a correction"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: Correction
    side_effects: []
  - method: POST
    path: "/ndt/corrections/{id}/approve"
    description: "PROPOSED -> APPROVED; segregation of duties enforced; OCC-guarded"
    roles: [PlanAdministrator]
    code: 200
    input: [expected_correction_version]
    output: Correction
    side_effects: ["increments Correction.version by 1"]
  - method: POST
    path: "/ndt/corrections/{id}/execute"
    description: "APPROVED -> EXECUTED; applies the correction method (distribution waterfall / QNEC allocation), computes excise and gap-period income"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Correction
    side_effects: ["applies correction method side effects", "computes excise_tax_cents and gap_period_income_cents", "supersedes later terminal TestRuns", "increments Correction.version and PlanYear.version by 1"]
  - method: POST
    path: "/ndt/corrections/{id}/void"
    description: "PROPOSED -> VOIDED (analyst) or APPROVED -> VOIDED (administrator)"
    roles: [PlanAdministrator, ComplianceAnalyst]
    code: 200
    input: []
    output: Correction
    side_effects: ["increments Correction.version by 1"]

  # --- SafeHarborElection / Notice ---
  - method: GET
    path: "/ndt/safe-harbor-elections/{id}"
    description: "Fetch an election"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: SafeHarborElection
    side_effects: []
  - method: POST
    path: "/ndt/safe-harbor-elections/{id}/suspend"
    description: "EFFECTIVE -> SUSPENDED; strips safe harbor design from governing PlanVersion; supersedes terminal TestRuns; OCC-guarded"
    roles: [PlanAdministrator]
    code: 200
    input: [suspension_reason, expected_election_version]
    output: SafeHarborElection
    side_effects: ["sets governing PlanVersion.safe_harbor_design = NONE", "supersedes PASSED/FAILED TestRuns of the plan year", "increments SafeHarborElection.version by 1"]
  - method: POST
    path: "/ndt/safe-harbor-elections/{id}/revoke"
    description: "PROPOSED -> REVOKED"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: SafeHarborElection
    side_effects: ["increments SafeHarborElection.version by 1"]
  - method: POST
    path: "/ndt/safe-harbor-elections/{id}/notices"
    description: "Create a safe harbor notice for an election"
    roles: [PlanAdministrator]
    code: 201
    input: [notice_period_start, notice_period_end]
    output: SafeHarborNotice
    side_effects: []
  - method: GET
    path: "/ndt/safe-harbor-elections/{id}/notice-list"
    description: "List notices of an election (FK reverse reachability)"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SafeHarborNotice[]
    side_effects: []
  - method: GET
    path: "/ndt/safe-harbor-notices/{id}"
    description: "Fetch a notice"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: SafeHarborNotice
    side_effects: []
  - method: POST
    path: "/ndt/safe-harbor-notices/{id}/distribute"
    description: "DRAFT -> DISTRIBUTED within the notice window"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: SafeHarborNotice
    side_effects: ["sets distributed_at to logical clock now", "if linked election is PROPOSED and plan_year is CENSUS_LOCKED, election becomes EFFECTIVE", "increments SafeHarborNotice.version by 1"]
  - method: POST
    path: "/ndt/safe-harbor-notices/{id}/acknowledge"
    description: "DISTRIBUTED -> ACKNOWLEDGED"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: SafeHarborNotice
    side_effects: ["increments SafeHarborNotice.version by 1"]

  # --- Contribution ---
  - method: GET
    path: "/ndt/contributions/{id}"
    description: "Fetch a contribution"
    roles: [PlatformAdmin, PlanAdministrator, ComplianceAnalyst, Auditor]
    code: 200
    input: []
    output: Contribution
    side_effects: []
  - method: POST
    path: "/ndt/contributions/{id}/forfeit"
    description: "POSTED -> FORFEITED for employer-source contributions; supersedes terminal TestRuns"
    roles: [PlanAdministrator]
    code: 200
    input: []
    output: Contribution
    side_effects: ["supersedes PASSED/FAILED TestRuns of the plan year", "increments Contribution.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or role not declared" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not resolve, or parent chain mismatch" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, unknown enum member, bad type, or conditional field violated (sh_match_formula presence)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity's current state does not permit the requested transition per §1.2" }
  - { id: ERR_EMPLOYER_ARCHIVED, http: 409, condition: "Child creation under an ARCHIVED employer" }
  - { id: ERR_PLAN_TERMINATED, http: 409, condition: "PlanVersion/PlanYear creation under a TERMINATED plan" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_<parent>_version mismatch" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Correction approver is the same user who proposed it" }
  - { id: ERR_FK_INTEGRITY, http: 422, condition: "Referenced FK does not exist or crosses plan-year/employer boundaries (includes family_member_of_ssn self-reference miss)" }
  - { id: ERR_DUPLICATE, http: 409, condition: "Uniqueness violation: ein / ssn-in-plan-year / plan_number-in-employer / active election per plan-year" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "Interval endpoints inverted or contribution_date outside plan year" }
  - { id: ERR_NOTICE_WINDOW_CLOSED, http: 422, condition: "Notice distribution outside [notice_period_start, notice_period_end] or window fails the 30-day rule" }
  - { id: ERR_VERSION_INTERVAL_CONFLICT, http: 409, condition: "PlanVersion adoption would leave two ADOPTED versions overlapping, or an amendment has nothing to amend" }
  - { id: ERR_CENSUS_INCOMPLETE, http: 422, condition: "lock-census attempted with missing CURRENT_YEAR compensation, missing ADOPTED version, or missing RegulatoryLimit" }
  - { id: ERR_PENDING_WORK, http: 409, condition: "unlock-census attempted while TestRuns QUEUED/RUNNING or Corrections PROPOSED/APPROVED exist" }
  - { id: ERR_CORRECTION_AMOUNT_INVALID, http: 422, condition: "Correction amount <= 0 or exceeds distributable balance of the target employee" }
  - { id: ERR_LIMIT_EXCEEDED, http: 422, condition: "402(g) elective deferral limit exceeded, or non-positive contribution amount, or negative compensation" }
  - { id: ERR_ELECTION_LOCKED, http: 409, condition: "Safe harbor suspension attempted without reason or after plan year FILED" }
  - { id: ERR_UNRESOLVED_FAILURES, http: 409, condition: "file attempted with non-terminal corrections or a failing latest FINAL run" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "TPA operations superuser: manages employers, regulatory limits, the logical clock, and can read everything"
    identity: "opaque"
    exclusive_operations:
      - "POST /ndt/_clock/set_current_utc"
      - "POST /ndt/employers"
      - "POST /ndt/employers/{id}/archive"
      - "POST /ndt/regulatory-limits"
    shared_operations:
      - "all GET endpoints"
      - "POST /ndt/employers/{id}/plans"
      - "POST /ndt/plans/{id}/plan-versions"
      - "POST /ndt/plans/{id}/plan-years"
      - "POST /ndt/plan-versions/{id}/adopt"
      - "POST /ndt/test-runs/{id}/execute-synchronously"
  - name: PlanAdministrator
    description: "TPA administrator assigned to the plan: runs census lifecycle, posts contributions, proposes elections/notices, approves and executes corrections, files the year"
    identity: "opaque"
    exclusive_operations:
      - "POST /ndt/plan-years/{id}/open-census"
      - "POST /ndt/plan-years/{id}/lock-census"
      - "POST /ndt/plan-years/{id}/unlock-census"
      - "POST /ndt/plan-years/{id}/terminate"
      - "POST /ndt/plan-years/{id}/file"
      - "POST /ndt/plan-years/{id}/census-employees"
      - "PATCH /ndt/census-employees/{id}"
      - "POST /ndt/census-employees/{id}/compensation-records"
      - "POST /ndt/census-employees/{id}/contributions"
      - "POST /ndt/plan-years/{id}/safe-harbor-elections"
      - "POST /ndt/corrections/{id}/approve"
      - "POST /ndt/corrections/{id}/execute"
      - "POST /ndt/safe-harbor-elections/{id}/suspend"
      - "POST /ndt/safe-harbor-elections/{id}/revoke"
      - "POST /ndt/safe-harbor-elections/{id}/notices"
      - "POST /ndt/safe-harbor-notices/{id}/distribute"
      - "POST /ndt/safe-harbor-notices/{id}/acknowledge"
      - "POST /ndt/contributions/{id}/forfeit"
    shared_operations:
      - "all GET endpoints"
      - "POST /ndt/employers/{id}/plans"
      - "POST /ndt/plans/{id}/plan-versions"
      - "POST /ndt/plans/{id}/plan-years"
      - "POST /ndt/plan-versions/{id}/adopt"
      - "POST /ndt/corrections/{id}/void"
  - name: ComplianceAnalyst
    description: "Testing analyst: queues and finalizes test runs, proposes corrections; cannot approve their own proposals (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /ndt/plan-years/{id}/test-runs"
      - "POST /ndt/test-runs/{id}/finalize"
      - "POST /ndt/test-runs/{id}/void"
      - "POST /ndt/plan-years/{id}/corrections"
    shared_operations:
      - "all GET endpoints"
      - "POST /ndt/test-runs/{id}/execute-synchronously"
      - "POST /ndt/corrections/{id}/void"
  - name: Auditor
    description: "Read-only external auditor"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "all GET endpoints"
