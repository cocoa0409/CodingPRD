  - section: cross_cutting_complexity_layers
    instances:
      - name: a_version_observed_before_sign_off_is_stale_for_the_determination_draft
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.determination-draft-stale-application
          - validations.priority_35.ERR_STALE_APPLICATION_VERSION
          - entities.Application.fields.version
        distinguishing_aspect: "The sign-off bubble-up is itself a write on the parent Application, so the version a specialist read while the assessment was merely SCORED is already stale one step later: drafting with it is 412 ERR_STALE_APPLICATION_VERSION (not 409, because the state check at priority 30 is satisfied), the refreshed version succeeds, and the stale value stays stale forever afterwards."
        test_recipe:
          setup:
            - "CHAIN as far as SCORED at clock 2026-08-05T09:30:00Z, capturing the Application version BEFORE sign-off"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: AccessibilityOfficeAdmin
            - call: "POST /applicants"
              payload: { full_name: "Dilnoza Rakhimova", date_of_birth: "1958-08-18", residence_zone: "IN_SERVICE_AREA", mobility_aid: "WALKER" }
