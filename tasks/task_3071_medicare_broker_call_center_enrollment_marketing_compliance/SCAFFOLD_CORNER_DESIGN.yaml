  # ===========================================================================
  - section: calculations
    instances:

      - name: prov_book_commission_rounds_each_term_before_summing
        claim_type: Precision
        grounds:
          - calculations.provisional_book_commission
          - entities.Enrollment.fields.effective_date
        distinguishing_aspect: "Each enrollment contributes two separately rounded terms rather than one rounded sum: with premium 1500 and rate 0.20 the initial term is RoundHalfUp(1500 x 12 x 0.20 x 1.06) == 3816.00 and the renewal term RoundHalfUp(1500 x 2 x 0.10 x 1.06) == 318.00, so summing first and rounding once would only coincidentally agree."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_enroll with effective_date 2026-11-01, so two of 2026's twelve months remain."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
          trigger:
            - call: "GET /agencies/${agency_id}/book-of-business"
              payload: { window_days: 365 }
              as: DirectorOfSales
          assert:
            - "the response status is 200 and window_start == 2026-10-01T00:00:00Z with window_end == 2027-10-01T00:00:00Z"
            - "qualifying_enrollment_count == 1"
            - "provisional_book_commission_cents == 4134.00, the sum of the rounded initial term 3816.00 and the rounded renewal term 318.00"
            - "the value is not 3966.00, which a single rounding after summing the unrounded terms would give"
            - "GET /agencies/${agency_id}/book-of-business?window_days=30 returns qualifying_enrollment_count == 0 and provisional_book_commission_cents == 0.00"

      - name: earned_commission_bills_a_rapid_disenrolled_row_exactly_one_month
        claim_type: Input Set Filtering
        grounds:
          - calculations.earned_commission_projections
          - entities.Enrollment.fields.disenrollment_status
        distinguishing_aspect: "The chronological pass admits only EFFECTUATED enrollments and floors BILLED_MONTHS at 1, so a rapid disenrollment in the effective month still bills one month at the initial rate — the row is not dropped from the input set and not billed zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through effectuation."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - *cc_ack
            - *cc_effect
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enrollments/${enrollment_id}/disenroll"
              payload: { disenrollment_date: "2026-11-10T00:00:00Z", disenrollment_reason: "BENEFICIARY_REQUEST" }
              as: CarrierIntegration
          assert:
            - "Enrollment.${enrollment_id}.disenrollment_status == RAPID_DISENROLLED with disenrolled_day_number == 9"
            - "Enrollment.${enrollment_id}.final_commission_cents == 300.00, one month at premium 1500 and the initial rate 0.20"
            - "the row is not billed zero and is not billed 150.00, which the renewal rate would give"
            - "the INITIAL entry 3600.00 and the RENEWAL entry 1800.00 remain in the ledger untouched by the as-earned recomputation"
            - "Agency.${agency_id}.commission_balance_cents == 1800.00, because the FINALIZED CHARGEBACK of -3600.00 is added to the two positive entries"

      - name: risk_score_ignores_a_live_call_and_counts_a_dropped_call
        claim_type: Input Set Filtering
        grounds:
          - calculations.agent_compliance_risk_score
          - entities.CallSession.fields.status
        distinguishing_aspect: "The session term admits only COMPLETED and DROPPED calls, so an IN_PROGRESS call contributes nothing: the same agent's score stays 0.00 with a live call carrying a null recording, and jumps to 10.00 the moment that call is completed under the same missing-recording conditions."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain plus a second scope, with a call session that omits recording_id and disclaimer_delivered, then connected."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_soa2
            - call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T09:30:00Z" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_id: $.data.id }
            - call: "POST /call-sessions/${call_id}/connect"
              payload: { disclaimer_delivered: false }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          trigger:
            - call: "GET /agents/${agent_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { risk_live: $.data.compliance_risk_score }
            - call: "POST /call-sessions/${call_id}/drop"
              payload: { reason: "CALLER_HUNG_UP" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
            - call: "GET /agents/${agent_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { risk_dropped: $.data.compliance_risk_score }
          assert:
            - "while the call is IN_PROGRESS the score is ${risk_live} == 0.00, because RINGING and IN_PROGRESS contribute nothing"
            - "after the drop the score is ${risk_dropped} == 10.00 — 3.0 for the null recording_id plus 7.0 for disclaimer_delivered false"
            - "the scope-of-appointment term contributes 0.0 because the attached scope has a non-empty plan_types_authorized and is not null"
            - "GET /call-sessions/${call_id} reports recording_status == MISSING and disclaimer_delivered == false"
            - "the score is not 2.00 and not 7.00, so both session penalties were applied on the same row"

      - name: complaint_finding_code_follows_table_order_for_a_shopper
        claim_type: Constants Applied
        grounds:
          - calculations.complaint_finding_codes
          - entities.Complaint.fields.complaint_type
          - entities.Complaint.fields.shopper_score
        distinguishing_aspect: "The finding table is evaluated top to bottom and the first match wins, so a SECRET_SHOPPER complaint that both failed the scope request and scored 55 returns SHOPPER_SOA_FAILURE rather than SHOPPER_LOW_SCORE, proving the row order — not the specificity of the condition — decides."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain with an ACTIVE agent."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - &cc_shopper_soa
              call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "SOA_MISSING", source: "SECRET_SHOPPER", severity: "HIGH", filed_on: "2026-09-28T00:00:00Z", shopper_score: 55, soa_requested_correctly: false, disclaimer_played: false, approved_marketing_used: false }
              as: ComplianceOfficer
              captures: { shopper_soa_id: $.data.id }
            - &cc_shopper_score
              call: "POST /complaints"
              payload: { agent_id: "${agent_id}", complaint_type: "PLAN_MISREPRESENTATION", source: "SECRET_SHOPPER", severity: "MEDIUM", filed_on: "2026-09-29T00:00:00Z", shopper_score: 65, soa_requested_correctly: true, disclaimer_played: true, approved_marketing_used: true }
              as: ComplianceOfficer
              captures: { shopper_score_id: $.data.id }
          trigger:
            - call: "POST /complaints/${shopper_soa_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${shopper_soa_id}/substantiate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${shopper_score_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${shopper_score_id}/substantiate"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the first substantiation returns 200 and Complaint.${shopper_soa_id}.finding_code == SHOPPER_SOA_FAILURE"
            - "finding_code is not SHOPPER_LOW_SCORE and not SHOPPER_DISCLAIMER_FAILURE, proving the table order decides"
            - "the second substantiation returns 200 and Complaint.${shopper_score_id}.finding_code == SHOPPER_LOW_SCORE at shopper_score 65, the only failing condition"
            - "the second finding_code is not MARKETING_VIOLATION even though complaint_type is PLAN_MISREPRESENTATION"
            - "GET /agents/${agent_id}/coaching-assignments returns exactly 2 rows and Agent.${agent_id}.open_coaching_count == 2"

      - name: ledger_entry_reversal_negates_the_current_non_reversed_total
        claim_type: Correct Result
        grounds:
          - calculations.commission_ledger_entry
          - entities.CommissionLedgerEntry.fields.entry_type
        distinguishing_aspect: "The REVERSAL amount is the negation of the running non-REVERSED total for that enrollment, so reversing after both the INITIAL 3600.00 and the RENEWAL 1800.00 exist yields -5400.00 rather than -3600.00 — the base moves with the ledger, not with the entry being reversed."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_enroll, then acknowledged and effectuated so both the INITIAL 3600.00 and the RENEWAL 1800.00 are PROVISIONAL."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - *cc_ack
            - *cc_effect
          trigger:
            - call: "POST /enrollments/${enrollment_id}/withdraw"
              payload: { reason: "BENEFICIARY_CHANGED_MIND" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
          assert:
            - "the withdrawal returns 200 and posts a REVERSAL entry with amount_cents == -5400.00"
            - "amount_cents is not -3600.00, because the base is the sum of every non-REVERSED entry of that enrollment"
            - "GET /commission-ledger-entries?enrollment_id=${enrollment_id} returns 3 rows: INITIAL 3600.00, RENEWAL 1800.00 and REVERSAL -5400.00"
            - "Agency.${agency_id}.commission_balance_cents == 0.00, since the REVERSAL entry is itself PROVISIONAL and the three sum to zero"
            - "Agent.${agent_id}.chargeback_tier == 1 from the withdrawal and Agent.${agent_id}.compliance_risk_score == 0.00, since no call was ever completed"

      - name: reconciliation_provisional_and_final_variants_diverge_on_one_period
        claim_type: Variant Divergence
        grounds:
          - calculations.carrier_reconciliation_variance
          - entities.CarrierReconciliation.fields.variance_variant
        distinguishing_aspect: "The two variants diverge by exactly the PROVISIONAL entries in the period: with one PROVISIONAL INITIAL of 3600.00 and one FINALIZED CHARGEBACK of -3600.00 the PROVISIONAL variant reports internal_total_cents 0.00 while the FINAL variant reports -3600.00, a 3600.00 delta from identical rows."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through disenrollment, which finalizes a -3600.00 CHARGEBACK and leaves the INITIAL entry PROVISIONAL, then a second period opened under the PROVISIONAL variant."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - *cc_ack
            - *cc_effect
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /enrollments/${enrollment_id}/disenroll"
              payload: { disenrollment_date: "2026-11-10T00:00:00Z", disenrollment_reason: "BENEFICIARY_REQUEST" }
              as: CarrierIntegration
            - &cc_recon_prov
              call: "POST /carrier-reconciliations"
              payload: { carrier_id: "${carrier_a_id}", period_month: "2026-10", carrier_reported_total_cents: 0, internal_total_variant: "PROVISIONAL" }
              as: DirectorOfSales
              captures: { recon_prov_id: $.data.id }
            - &cc_recon_final
              call: "POST /carrier-reconciliations"
              payload: { carrier_id: "${carrier_a_id}", period_month: "2026-10", carrier_reported_total_cents: 0, internal_total_variant: "FINAL" }
              as: DirectorOfSales
              captures: { recon_final_id: $.data.id }
          trigger:
            - call: "GET /carrier-reconciliations/${recon_prov_id}"
              payload: {}
              as: DirectorOfSales
              captures: { prov_total: $.data.internal_total_cents, prov_variance: $.data.variance_cents }
            - call: "GET /carrier-reconciliations/${recon_final_id}"
              payload: {}
              as: DirectorOfSales
              captures: { final_total: $.data.internal_total_cents, final_variance: $.data.variance_cents }
          assert:
            - "CarrierReconciliation.${recon_prov_id}.internal_total_cents == 0.00 with variance_variant == PROVISIONAL"
            - "CarrierReconciliation.${recon_final_id}.internal_total_cents == -3600.00 with variance_variant == FINAL"
            - "the two variants differ by exactly 3600.00, the amount of the still-PROVISIONAL INITIAL entry"
            - "CarrierReconciliation.${recon_prov_id}.variance_cents == 0.00 so POST /reconcile succeeds on it"
            - "CarrierReconciliation.${recon_final_id}.variance_cents == 3600.00 so POST /reconcile returns 409 ERR_RECONCILIATION_VARIANCE_NONZERO"

      - name: soa_validity_window_uses_the_agency_max_age
        claim_type: Constants Applied
        grounds:
          - calculations.soa_validity_window
          - entities.ScopeOfAppointment.fields.expires_on
        distinguishing_aspect: "The scope's usable window is derived from the owning agency's soa_max_age_days rather than a global constant: raising the agency's soa_max_age_days from 30 to 60 through PUT /agencies extends the same scope row's expires_on to 2026-11-30 and re-authorizes a submission that had just been refused."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through a completed call, then the clock moved to 2026-11-01."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /agencies/${agency_id}"
              payload: {}
              as: PlatformAdmin
              captures: { agency_v1: $.data.version }
            - call: "PUT /agencies/${agency_id}"
              payload: { soa_max_age_days: 60, expected_agency_version: "${agency_v1}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /scope-of-appointments/${soa_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { expires_after: $.data.expires_on }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_id: $.data.id }
          assert:
            - "ScopeOfAppointment.${soa_id}.expires_on == 2026-11-30T00:00:00Z, the captured_on 2026-10-01 plus the agency's new soa_max_age_days of 60"
            - "the submission at 2026-11-01 returns 201, whereas under the original 30-day setting it would have returned 422 ERR_SCOPE_OF_APPOINTMENT_MISSING"
            - "ScopeOfAppointment.${soa_id}.retained_until == 2036-09-28T00:00:00Z, unchanged because soa_retention_days was not edited"
            - "Agency.${agency_id}.version == 2 after the PUT and soa_max_age_days == 60"
            - "Enrollment.${enrollment_id}.submission_status == SUBMITTED and CallSession.${call_id}.status == COMPLETED"

# ===========================================================================
  - section: validations
    instances:

      - name: missing_user_context_header_is_the_first_check
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "Priority 1 runs before existence and before state, so a request with no X-User-Role at all against an unknown resource id answers 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER rather than 404, and the same holds for a role string outside the declared set."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Empty database, so no path id could resolve."
          setup_api_calls:
            - *cc_clock
          trigger:
            - call: "GET /agents/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnregisteredRole
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "the status is not 404 and not 403, so priority 1 fired before the existence check"
            - "response_type is error and data carries both error_id and message"
            - "the same call with as: ComplianceOfficer and a real but unallocated id returns 404 ERR_AGENT_NOT_FOUND instead"

      - name: compliance_officer_cannot_capture_a_scope_of_appointment
        claim_type: Violation -> Error
        grounds:
          - validations[priority=2]
          - roles.ComplianceOfficer.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "The permission check is a strict allow-list, so ComplianceOfficer is denied POST /scope-of-appointments — an operation reserved to LicensedAgent — with 403 ERR_INSUFFICIENT_PERMISSIONS rather than being silently permitted by virtue of any broader read access."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_member, so the member exists and only the role is wrong."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
          trigger:
            - call: "POST /scope-of-appointments"
              payload: { member_id: "${member_id}", agent_id: "${agent_id}", capture_channel: "TELEPHONIC_RECORDED", plan_types_authorized: ["MAPD"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_v1}" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "error_id != ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, since the role is a declared one"
            - "GET /scope-of-appointments?member_id=${member_id} returns 0 rows"
            - "the same payload sent as LicensedAgent with as_user_id ${agent_id} returns 201"

      - name: corrections_on_a_reconciliation_and_commission_ledger_are_denied_to_the_compliance_officer
        claim_type: Violation -> Error
        grounds:
          - roles.ComplianceOfficer.description
          - roles.DirectorOfSales.exclusive_operations
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "The money surface is a second exclusive-operation cluster: ComplianceOfficer may govern posture and adjudicate complaints but is refused POST /corrections and POST /commission-ledger-entries with 403, while DirectorOfSales is refused POST /complaints/{id}/substantiate."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_enroll plus an OPEN reconciliation period."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_enroll
            - &cc_recon_open
              call: "POST /carrier-reconciliations"
              payload: { carrier_id: "${carrier_a_id}", period_month: "2026-10", carrier_reported_total_cents: 3600, internal_total_variant: "PROVISIONAL" }
              as: DirectorOfSales
              captures: { recon_id: $.data.id }
          trigger:
            - call: "POST /corrections"
              payload: { enrollment_id: "${enrollment_id}", carrier_reconciliation_id: "${recon_id}", amount_cents: -100, period_month: "2026-10", memo: "Compliance attempted a money adjustment" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
            - call: "POST /commission-ledger-entries"
              payload: { enrollment_id: "${enrollment_id}", carrier_reconciliation_id: "${recon_id}", entry_type: "ADJUSTMENT", period_month: "2026-10" }
              as: ComplianceOfficer
              captures: { error_id_ledger: $.data.error_id }
          assert:
            - "the correction returns 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "the ledger post returns 403 and error_id_ledger == ERR_INSUFFICIENT_PERMISSIONS"
            - "the correction is NOT rejected on its own validation, so the permission gate genuinely precedes priority 20"
            - "GET /commission-ledger-entries?enrollment_id=${enrollment_id} still returns exactly 1 row"
            - "Agency.${agency_id}.commission_balance_cents == 3600.00"

      - name: call_complete_under_a_restricted_agency_is_allowed_under_a_frozen_one_is_not
        claim_type: Satisfaction -> Pass
        grounds:
          - validations[priority=5]
          - entities.Agency.fields.compliance_posture
          - errors.ERR_AGENCY_FROZEN
        distinguishing_aspect: "The posture gate admits OPEN and RESTRICTED but excludes FROZEN, so an identical completion request that succeeds while the agency is RESTRICTED is refused with 403 ERR_AGENCY_FROZEN once a fifth strike pushes the agency over, with no other input changed."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through a connected call, plus five substantiated complaints across the agency's agents that will drive the posture."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_call
            - *cc_connect
            - *cc_complaint
            - call: "POST /complaints/${complaint_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /complaints/${complaint_id}/substantiate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_maintenance/recompute-compliance-posture"
              payload: { agency_id: "${agency_id}" }
              as: PlatformAdmin
              captures: { posture_after_first: $.data.compliance_posture }
          trigger:
            - call: "POST /call-sessions/${call_id}/complete"
              payload: { recording_id: "REC-1001", disclaimer_delivered: true }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_or_status: $.data.status }
          assert:
            - "after one substantiation the posture is ${posture_after_first} == RESTRICTED, so the gate admits the operation"
            - "the completion under RESTRICTED returns 200 with error_or_status == COMPLETED"
            - "the same endpoint against a FROZEN agency returns 403 ERR_AGENCY_FROZEN, declaring the excluded posture value"
            - "the gate is a posture-value check and not a strike-count check: RESTRICTED is admitted even with a non-zero strike count"
            - "Agent.${agent_id}.status remains SUSPENDED by the RESTRICTED cascade while the call still completes"

      - name: priority_temporal_disclaimer_precedes_state_frozen
        claim_type: Priority Ordering
        grounds:
          - validations[priority=9]
          - validations[priority=5]
          - errors.ERR_DISCLAIMER_NOT_DELIVERED
          - errors.ERR_AGENCY_FROZEN
        distinguishing_aspect: "For POST /call-sessions/{id}/connect the two applicable rows are priority 9 (business_temporal, ERR_DISCLAIMER_NOT_DELIVERED at 422) and priority 5 (business_safety, ERR_AGENCY_FROZEN at 403); on an agency whose posture is still OPEN only the disclaimer row can fire, so the observed error_id is the temporal one and the status is 422."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T09:00:00Z; the full anchor chain plus a RINGING call created with disclaimer_delivered false and recording_id null; the agency posture is still OPEN with no complaint on file."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_id}", scope_of_appointment_id: "${soa_id}", started_at: "2026-10-01T09:00:00Z", scheduled_end_at: "2026-10-01T09:30:00Z" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /call-sessions/${call_id}/connect"
              payload: { disclaimer_delivered: false }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the connect returns 422 and error_id == ERR_DISCLAIMER_NOT_DELIVERED"
            - "error_id != ERR_AGENCY_FROZEN, because the agency is OPEN so priority 5 has nothing to report"
            - "GET /agencies/${agency_id} reports compliance_posture == OPEN"
            - "GET /call-sessions/${call_id} still reports status == RINGING and version 1"
            - "the 422 rather than 403 status confirms the temporal row owns the response once the safety row passes"

      - name: cross_entity_validation_carrier_contract_type_blocks_appointment
        claim_type: Cross-entity validation
        grounds:
          - errors.ERR_CARRIER_NOT_CONTRACTED
          - state_machines.Agent.transitions.LICENSED_to_CERTIFIED
          - entities.Carrier.fields.contract_type
        distinguishing_aspect: "Certification validity depends on a different entity's configuration: a MARKETING_ONLY carrier is refused with 403 ERR_CARRIER_NOT_CONTRACTED even though the agent is correctly LICENSED and the carrier is in status ACTIVE, and the same call against a CONTRACTED carrier succeeds."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain through *cc_lic, plus a second carrier of contract_type MARKETING_ONLY."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - &cc_carrier_marketing
              call: "POST /carriers"
              payload: { legal_name: "Pinnacle Marketing Group", naic_number: "60401", contract_type: "MARKETING_ONLY", initial_commission_rate_pct: 0.15, renewal_commission_rate_pct: 0.08, chargeback_clawback_pct: 0.30, ack_expected_within_days: 7, effectuation_expected_within_days: 45 }
              as: PlatformAdmin
              captures: { carrier_mkt_id: $.data.id }
          trigger:
            - call: "POST /agents/${agent_id}/certifications"
              payload: { carrier_id: "${carrier_mkt_id}", product_type: "MAPD", expires_on: "2027-12-31T00:00:00Z" }
              as: LicensingCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the certification against the MARKETING_ONLY carrier returns 403 and error_id == ERR_CARRIER_NOT_CONTRACTED"
            - "the carrier itself resolves, so this is not a 404: GET /carriers/${carrier_mkt_id} returns 200 with status ACTIVE"
            - "Agent.${agent_id}.status is still LICENSED and certified_carrier_count == 0"
            - "GET /agents/${agent_id}/certifications returns 0 rows"
            - "the same call with carrier_id ${carrier_a_id} returns 201 because that carrier is CONTRACTED"

      - name: aggregate_capacity_validation_rejects_only_the_collective_overage
        claim_type: Aggregate validation
        grounds:
          - calculations.aep_daily_submission_capacity_check
          - validations[priority=15]
          - errors.ERR_AEP_DAILY_SUBMISSION_CAPACITY_EXCEEDED
        distinguishing_aspect: "Each enrollment is individually well formed and in service, so the failure is collective: with capacity 2 the first two enrollments effective on 2026-11-01 both succeed and only the third is refused, and an enrollment with a different effective day still succeeds while the day is saturated."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, eleven days before the AEP window opens, so no fixing-day rule constrains the November elections. Agency with aep_daily_submission_capacity 2; one carrier, one plan, two members, one ACTIVE agent."
            - "Two completed call sessions, each with its own captured scope."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &cc_agency_cap
              call: "POST /agencies"
              payload: { name: "Alpine Senior Benefits LLC", service_center_code: "ALP-DAL-01", aep_start_date: "2026-10-15T00:00:00Z", aep_end_date: "2026-12-07T00:00:00Z", aep_daily_submission_capacity: 2, recording_retention_days: 2555, soa_retention_days: 3650, soa_max_age_days: 30, rapid_disenrollment_day_limit: 90 }
              as: PlatformAdmin
              captures: { agency_id: $.data.id, agency_v1: $.data.version }
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - *cc_soa2
            - *cc_call
            - *cc_connect
            - *cc_complete
            - *cc_call2
            - *cc_connect2
            - *cc_complete2
            - *cc_enroll
            - call: "GET /call-sessions/${call_id}"
              payload: {}
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_v2: $.data.version }
            - &cc_enroll_two
              call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v2}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_two_id: $.data.id }
          trigger:
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_id}", member_id: "${member_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_id}", effective_date: "2026-11-01T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_v2}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id_same_day: $.data.error_id }
            - call: "POST /enrollments"
              payload: { call_session_id: "${call_two_id}", member_id: "${member_two_id}", plan_id: "${plan_a_id}", agent_id: "${agent_id}", scope_of_appointment_id: "${soa_two_id}", effective_date: "2026-11-05T00:00:00Z", plan_type_discussed: "MAPD", expected_call_session_version: "${call_two_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { enrollment_other_day_id: $.data.id }
          assert:
            - "committed on 2026-11-01 is exactly 2, the capacity, so the next submission for that day returns 409 with error_id_same_day == ERR_AEP_DAILY_SUBMISSION_CAPACITY_EXCEEDED"
            - "the enrollment for 2026-11-05 returns 201 despite the saturation, because the check is scoped to the effective day"
            - "GET /enrollments?carrier_id=${carrier_a_id} returns exactly 3 rows"
            - "each of the three accepted enrollments is individually valid: submission_status SUBMITTED with disenrollment_status NOT_APPLICABLE"
            - "the refusal is aggregate, not per-row: no single enrollment exceeds anything on its own"

      - name: conditional_validation_recording_is_waived_for_written_scopes
        claim_type: Conditional validation
        grounds:
          - validations[priority=9]
          - entities.ScopeOfAppointment.fields.capture_channel
          - errors.ERR_RECORDING_MISSING
        distinguishing_aspect: "The recording requirement is conditioned on the scope's capture channel: a WRITTEN scope admits a call with recording_id null and still returns 200, while the identical call under a TELEPHONIC_RECORDED scope is refused — so the same request body flips outcome on an entity it never mentions."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z; the full anchor chain with one TELEPHONIC_RECORDED scope and one WRITTEN scope for the second member."
          setup_api_calls:
            - *cc_clock
            - *cc_agency
            - *cc_carrier
            - *cc_plan
            - *cc_drug
            - *cc_prov
            - *cc_agent
            - *cc_lic
            - *cc_cert
            - *cc_appt
            - *cc_member
            - *cc_member2
            - *cc_soa
            - &cc_soa_written
              call: "POST /scope-of-appointments"
              payload: { member_id: "${member_two_id}", agent_id: "${agent_id}", capture_channel: "WRITTEN", plan_types_authorized: ["MAPD"], captured_on: "2026-10-01T00:00:00Z", expected_member_version: "${member_two_v1}" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { soa_written_id: $.data.id }
            - &cc_call_written
              call: "POST /call-sessions"
              payload: { agent_id: "${agent_id}", member_id: "${member_two_id}", scope_of_appointment_id: "${soa_written_id}", started_at: "2026-10-01T11:00:00Z", scheduled_end_at: "2026-10-01T11:30:00Z" }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { call_written_id: $.data.id }
            - *cc_call
          trigger:
            - call: "POST /call-sessions/${call_written_id}/connect"
              payload: { disclaimer_delivered: false }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { status_written: $.data.status }
            - call: "POST /call-sessions/${call_id}/connect"
              payload: { disclaimer_delivered: false }
              as: LicensedAgent
              as_user_id: "${agent_id}"
              captures: { error_id_telephonic: $.data.error_id }
          assert:
            - "the WRITTEN-scope call connects with status_written == IN_PROGRESS despite a null recording_id and disclaimer_delivered false"
            - "the TELEPHONIC_RECORDED-scope call is refused with error_id_telephonic == ERR_DISCLAIMER_NOT_DELIVERED"
            - "Agent.${agent_id}.live_call_count == 1, counting only the connected call"
            - "GET /call-sessions/${call_written_id} reports recording_status == MISSING while status is IN_PROGRESS"
            - "the two calls carry identical bodies, so only the referenced scope's capture_channel changed the outcome"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: plan_comparison_computed_read_exposes_the_ranked_plans
