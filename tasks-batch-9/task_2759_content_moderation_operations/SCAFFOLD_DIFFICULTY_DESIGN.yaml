              payload: { resolution: "OVERTURNED" }
              as: Reviewer
              as_user_id: "${r2_id}"
            - call: "POST /moderation/transparency-reports"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T23:59:59Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /moderation/transparency-reports/${rep_id}/compute"
              payload: { variant: "PROVISIONAL" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { prov_enforcement: $.data.enforcement_volume, prov_removals: $.data.removal_volume }
            - call: "POST /moderation/transparency-reports/${rep_id}/compute"
              payload: { variant: "RESTATED" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
          assert:
            - "${prov_enforcement} == 2 and ${prov_removals} == 1 (PROVISIONAL counts the later-overturned REMOVE)"
            - "TransparencyReport.${rep_id}.variant == RESTATED"
            - "TransparencyReport.${rep_id}.enforcement_volume == 1"
            - "TransparencyReport.${rep_id}.removal_volume == 0"
            - "TransparencyReport.${rep_id}.warn_volume == 1"
            - "TransparencyReport.${rep_id}.age_gate_volume == 0"
            - "TransparencyReport.${rep_id}.overturn_adjusted_volume == 1 under both variants"
            - "TransparencyReport.${rep_id}.appeal_count == 1 and TransparencyReport.${rep_id}.appeal_overturn_rate == 1.0000"
            - "TransparencyReport.${rep_id}.legal_request_count == 0 and TransparencyReport.${rep_id}.legal_grant_rate == 0.0000"
            - "TransparencyReport.${rep_id}.status == COMPUTED"
  - rule_id: combinatorial_formula
    instances:
      - name: effective_confidence_tier_and_repeat_nonlinear
        grounds:
          - calculations.effective_confidence
          - calculations.routing_disposition
          - entities.DetectionSignal.fields.effective_confidence
          - entities.Account.fields.tier
          - entities.Account.fields.strike_points
        distinguishing_aspect: |
          Mode (a): the account tier discount is multiplicative on the raw classifier confidence
          while the repeat-offender bonus is additive AFTER that multiplication, so 0.9500 on a
          HIGH_PROFILE account holding 4 strike points resolves to 0.9500*0.85 + 0.04 = 0.8475 and
          NOT to the order-swapped (0.9500 + 0.04)*0.85 = 0.8415.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "HIGH_PROFILE account acct_vip; T2/VIOLENCE category VIOLENT_THREAT with ACTIVE v1 (auto 0.9000, floor 0.4000, REMOVE, 240 min SLA)."
            - "SENIOR reviewer Sven certified on v1 has already decided the account's first case REMOVE, so acct_vip holds exactly 4 strike points and lifetime_removed_count 1."
            - "A second LIVE TEXT content item of graphic_weight 1 exists on the same account."
          setup_api_calls:
            - call: "POST /moderation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/accounts"
              payload: { external_handle: "acct_vip", region_code: "US", tier: "HIGH_PROFILE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { acct_id: $.data.id }
            - call: "POST /moderation/policy-categories"
              payload: { code: "VIOLENT_THREAT", name: "Violent Threat", severity_tier: "T2", specialty: "VIOLENCE" }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { cat_id: $.data.id }
            - call: "POST /moderation/policy-versions"
              payload: { policy_category_id: "${cat_id}", version_label: "v1", auto_action_threshold: 0.9000, review_floor: 0.4000, enforcement_action: "REMOVE", appeal_window_hours: 72, review_sla_minutes: 240 }
              as: PolicyManager
              as_user_id: "pm-alice"
              captures: { pv1_id: $.data.id }
            - call: "POST /moderation/policy-versions/${pv1_id}/back-test"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/policy-versions/${pv1_id}/activate"
              payload: {}
              as: PolicyManager
              as_user_id: "pm-bob"
            - call: "POST /moderation/review-queues"
              payload: { name: "EN Violence", policy_category_id: "${cat_id}", language: "EN", specialty: "VIOLENCE" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/reviewers"
              payload: { display_name: "Sven", languages: ["EN"], specialties: ["VIOLENCE"], utc_offset_minutes: 0, shift_start_local_hour: 8, shift_end_local_hour: 20, role_class: "SENIOR" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { rs_id: $.data.id, rs_v: $.data.version }
            - call: "POST /moderation/reviewers/${rs_id}/certifications"
              payload: { policy_version_id: "${pv1_id}", expected_reviewer_version: "${rs_v}" }
              as: PolicyManager
              as_user_id: "pm-alice"
            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "TEXT", graphic_weight: 2 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ci1_id: $.data.id }
            - call: "POST /moderation/detection-signals"
              payload: { content_item_id: "${ci1_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.9000 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { sig1_ec: $.data.effective_confidence, case1_id: $.data.resulting_case_id }
            - call: "GET /moderation/moderation-cases/${case1_id}"
              payload: {}
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { c1_v: $.data.version }
            - call: "POST /moderation/moderation-cases/${case1_id}/assign"
              payload: { expected_case_version: "${c1_v}", target_reviewer_id: "${rs_id}" }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
            - call: "POST /moderation/moderation-cases/${case1_id}/decide"
              payload: { outcome: "REMOVE" }
              as: Reviewer
              as_user_id: "${rs_id}"
            - call: "POST /moderation/content-items"
              payload: { account_id: "${acct_id}", language: "EN", media_kind: "TEXT", graphic_weight: 1 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { ci2_id: $.data.id }
          trigger:
            - call: "POST /moderation/detection-signals"
              payload: { content_item_id: "${ci2_id}", policy_category_code: "VIOLENT_THREAT", classifier_id: "clf-violence-1", classifier_confidence: 0.9500 }
              as: TrustSafetyAdmin
              as_user_id: "ts-ops"
              captures: { sig2_id: $.data.id, case2_id: $.data.resulting_case_id }
          assert:
            - "${sig1_ec} == 0.7650 (0.9000 * 0.85 with a zero repeat bonus)"
            - "Account.${acct_id}.strike_points == 4 and Account.${acct_id}.standing == LIMITED"
            - "DetectionSignal.${sig2_id}.effective_confidence == 0.8475, not 0.8415"
            - "DetectionSignal.${sig2_id}.disposition == HUMAN_REVIEW even though 0.8475 < auto_action_threshold 0.9000 would also route to review — the HIGH_PROFILE branch fires first"
            - "ModerationCase.${case2_id}.status == PENDING_ASSIGNMENT"
            - "ModerationCase.${case2_id}.escalation_tier == 1 and ModerationCase.${case2_id}.escalation_reason == HIGH_PROFILE"
            - "ModerationCase.${case2_id}.sla_due_at == 2026-08-01T09:30:00Z (escalation_tier >= 1 skips the congestion multiplier)"
      - name: strike_points_multiply_then_ceil_once
        grounds:
          - calculations.strike_points_applied
          - calculations.account_strike_ledger
          - calculations.account_standing_posture
          - entities.ModerationCase.fields.strike_points_applied
          - state_machines.ModerationCase.ASSIGNED_to_DECIDED
        distinguishing_aspect: |
          Mode (b): rounding order changes the integer — a T3 base of 2 with the AGE_GATE weight
          0.75 and a repeat multiplier of 1.25 must be ceil(2 * 0.75 * 1.25) = ceil(1.875) = 2,
          whereas ceiling each factor first (ceil(2*0.75) = 2, then 2*1.25 = 2.5 -> 3) yields 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T09:00:00Z."
            - "STANDARD account acct_gamma; T3/VIOLENCE category GRAPHIC_MEDIA with ACTIVE v1 (auto 0.9000, floor 0.4000, AGE_GATE, 240 min SLA)."
            - "FRONTLINE reviewer Rita certified on v1 already decided the account's first case REMOVE, so strike_points is 2 and lifetime_removed_count is 1 (repeat multiplier 1.25)."
