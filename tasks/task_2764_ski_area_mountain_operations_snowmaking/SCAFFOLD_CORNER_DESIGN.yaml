      - name: the_season_area_counts_and_the_day_counters_reconcile_across_an_open_and_a_close
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.season_snow_accounting
          - calculations.day_guest_capacity
          - entities.SeasonConfig.fields.open_area_count
          - entities.DayPlan.fields.terrain_open_acres
          - endpoints[POST /mountain-ops/day-plans/{id}/close-day]
        distinguishing_aspect: |
          open_acres, openable_acres and the terrain_open_pct DENOMINATOR are three different sums over
          the same rows, and only a two-area season with unequal acreage separates them: after one of the
          two closes, open_acres and openable_acres are both 8.0 while the percentage divides by 26.0 and
          lands on 30.8. The day-close then has to reconcile in the other direction - the terrain, lift and
          admission counters must all return to zero in one call, with the released reservation retained -
          while openable_acres collapses to 0.0 and the percentage denominator does NOT (nothing became
          SEASON_CLOSED), so the percentage is 0.0 rather than undefined.
