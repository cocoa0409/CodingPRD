      - name: permit_renewal_with_an_overdue_snc_corrective_action_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=26]
          - errors[ERR_CORRECTIVE_ACTION_OVERDUE]
          - entities.ComplianceFinding.fields.is_overdue
        distinguishing_aspect: |
          Renewal is blocked by an SNC finding whose corrective action has lapsed — the deadline of
          2026-08-10 measured against a clock at 2026-08-11 — and unblocked the moment the facility
          responds, which proves the gate reads the finding's live overdue flag rather than its
          creation.
        test_recipe:
          setup:
            - "Facility with a 90,000,000-cent instrument and one SNC finding due 2026-08-10"
            - "Clock moved to 2026-08-11"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
