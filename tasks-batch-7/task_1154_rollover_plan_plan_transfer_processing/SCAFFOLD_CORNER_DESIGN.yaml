          trigger:
            - { call: "POST /v1/tax-forms/${f1}/correct", payload: { expected_tax_form_version: "${fv} - 1", taxable_amount_cents: 0 }, as: TaxReportingOfficer, captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/tax-forms/${f1}/correct", payload: { expected_tax_form_version: "${fv}", taxable_amount_cents: 0 }, as: TaxReportingOfficer, captures: { f2: "$.data.id", f2_rev: "$.data.revision" } }
          assert:
            - "stale correction (${fv} - 1) -> ERR_STALE_VERSION (${err}), HTTP 412"
            - "current-version correction succeeds: new revision == 1 (${f2_rev}), superseding ${f1}"

      - name: scheduled_notice_sweep_timing
        claim_type: scheduled_actions
        grounds: ["state_machines.FollowUpNotice.SCHEDULED_to_SENT", "entities.FollowUpNotice.fields.days_remaining"]
        distinguishing_aspect: "Scheduled actions fire only when the logical clock reaches them: with issue date 2026-06-01 the notices are due 2026-07-01/07-16/07-26; a sweep at 2026-07-05 sends only notice 1 (days_remaining 26, outstanding 10,800,000); a sweep at 2026-07-30 sends the remaining two (notice 3 reports days_remaining == 1)."
        test_recipe:
          setup: ["Plan A + IRA plan, clock 2026-06-01, P1 SEPARATED SINGLE, canonical A1, empty A2; full INDIRECT case issued at 2026-06-01 (deadline 2026-07-31); three notices SCHEDULED"]
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /v1/plans", payload: { plan_name: "IRA Plan", plan_type: "IRA" }, as: PlanSponsorAdmin, captures: { plan_ira: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 }, { source_type: "EMPLOYER_PRETAX", balance_cents: 2000000, basis_cents: 0, vested_pct: 60 }, { source_type: "ROTH", balance_cents: 1000000, basis_cents: 800000, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { d0: "$.data[0].id", d1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/issue-disbursement", payload: { method: "CHECK" }, as: RolloverProcessor, as_user_id: "proc-2", captures: { disb: "$.data.id" } }
            - { call: "POST /v1/disbursements/${disb}/issue", payload: {}, as: RolloverProcessor, as_user_id: "proc-2" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-05T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/sweeps/daily", payload: {}, as: OperationsAgent, captures: { sent1: "$.data.notices_sent" } }
            - { call: "GET /v1/rollover-cases/${c1}/notices", as: RolloverProcessor, captures: { n1_st: "$.data[0].status", n1_days: "$.data[0].days_remaining", n1_out: "$.data[0].outstanding_cents", n2_st: "$.data[1].status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-30T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/sweeps/daily", payload: {}, as: OperationsAgent, captures: { sent2: "$.data.notices_sent" } }
            - { call: "GET /v1/rollover-cases/${c1}/notices", as: RolloverProcessor, captures: { n3_st: "$.data[2].status", n3_days: "$.data[2].days_remaining" } }
          assert:
            - "sweep at 2026-07-05: notices_sent == 1 (${sent1}); notice1 SENT (${n1_st}) with days_remaining == 26 (${n1_days}) and outstanding_cents == 10800000 (${n1_out}); notice2 still SCHEDULED (${n2_st})"
            - "sweep at 2026-07-30: notices_sent == 2 (${sent2}); notice3 SENT (${n3_st}) with days_remaining == 1 (${n3_days})"
            - "case still AWAITING_REDEPOSIT (deadline 2026-07-31 not yet passed at sweep time)"

      - name: layer_dual_variant_stubs
        claim_type: optimistic_concurrency
        grounds: ["calculations.tax_form_amounts", "calculations.loan_offset_window"]
        excluded_because: { difficulty_instance: "tax_form_1099r_provisional_vs_corrected_after_shortfall", rationale: "Dual-variant layer asserted via both §1.8 rule-1 instances (TaxForm and Loan domains)." }

      - name: layer_cascade_stubs
        claim_type: side_effect_execution
        grounds: ["state_machines.Plan.ACTIVE_to_FROZEN", "state_machines.RolloverCase.AWAITING_REDEPOSIT_to_COMPLETED"]
        excluded_because: { difficulty_instance: "plan_freeze_cascade", rationale: "Cascading-side-effects layer asserted via §1.8 rule-4 instances (freeze and redeposit-completion chains)." }

  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the issue-disbursement response AND an immediately-following GET of the account both reflect the debited balances (vested 9,800,000 after a 1,000,000 partial assembly) with no reconciliation lag."
        test_recipe:
          setup: ["Plan A, clock 2026-06-01, P1 SEPARATED SINGLE, canonical A1; approved indirect case 1,000,000"]
