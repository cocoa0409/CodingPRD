            - { call: "POST /safety/coaching-assignments", payload: { driver_id: "${d_id}", coaching_type: "PROBATION", due_date: "2026-08-10T00:00:00Z", expected_driver_version: "${d_ver}" }, as: SafetyManager, captures: { co_id: $.data.id } }
