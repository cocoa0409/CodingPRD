  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers is rejected ERR_MISSING_CONTEXT_HEADER (400) before any role or existence check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /break-reports"
              payload: { location_description: "12 Oak St", source: CUSTOMER_CALL }
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_MISSING_CONTEXT_HEADER (http 400)"

      - name: confirm_as_crew_lead_returns_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "CrewLead is not in the confirm endpoint's role list -> ERR_FORBIDDEN_ROLE (403), and the break stays REPORTED."
        test_recipe:
          setup: ["Segment and REPORTED break; a crew exists"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: PVC, diameter_inches: 8, install_year: 1999 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /crews"
              payload: { crew_name: "Crew Oak", crew_size: 3, equipment_class: LIGHT, hourly_rate_cents: 6000 }
              as: Dispatcher
              captures: { cr: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "12 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
          trigger:
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: SPLIT, severity: LOW }
              as: CrewLead
              as_user_id: "${cr}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_FORBIDDEN_ROLE (http 403)"
            - "BreakReport.${br}.break_status remains REPORTED"

      - name: claim_filed_after_90_days_rejected
        claim_type: violation_to_error
        grounds: [calculations.claim_filing_window, "errors[ERR_CLAIM_FILED_LATE]"]
        distinguishing_aspect: "Filing exactly at confirmed_at + 90 days succeeds (inclusive boundary); filing one day later fails ERR_CLAIM_FILED_LATE."
        test_recipe:
          setup: ["Break confirmed at 2026-08-01T00:00:00Z (confirmed_at anchor)"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: PVC, diameter_inches: 8, install_year: 1999 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
            - call: "POST /break-reports"
              payload: { location_description: "12 Oak St", source: CUSTOMER_CALL }
              as: Dispatcher
              captures: { br: $.data.id }
            - call: "POST /break-reports/${br}/confirm"
              payload: { pipe_segment_id: "${seg}", break_type: SPLIT, severity: LOW }
              as: Dispatcher
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: System
            - call: "POST /damage-claims"
              payload: { break_report_id: "${br}", claimant_name: "On Time", claimed_amount_cents: 1000 }
              as: Dispatcher
              captures: { cl_ok: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: System
            - call: "POST /damage-claims"
              payload: { break_report_id: "${br}", claimant_name: "Too Late", claimed_amount_cents: 1000 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Claim at exactly confirmed_at + 90 days (2026-10-30T00:00:00Z) is created (SUBMITTED)"
            - "Claim at +91 days returns error_id ERR_CLAIM_FILED_LATE (http 409)"

      - name: approve_amount_above_claimed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_AMOUNT_EXCEEDS_CLAIMED]"]
        distinguishing_aspect: "approved_amount_cents greater than claimed_amount_cents is rejected ERR_AMOUNT_EXCEEDS_CLAIMED; approving exactly the claimed amount succeeds."
        test_recipe:
          setup: ["Confirmed break; claim for 100000 in SUBMITTED"]
          setup_api_calls:
            - call: "POST /pipe-segments"
              payload: { segment_ref: "MAIN-8-OAK", material: PVC, diameter_inches: 8, install_year: 1999 }
              as: PublicWorksEngineer
              captures: { seg: $.data.id }
