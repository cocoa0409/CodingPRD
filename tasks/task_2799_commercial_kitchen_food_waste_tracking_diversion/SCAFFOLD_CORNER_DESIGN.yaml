      - name: cyclic_shape_of_the_waste_entry_flag_loop
        claim_type: cyclic
        grounds: ["complexity_profile.state_machine_shape", "state_machines.WasteEntry"]
        excluded_because:
          difficulty_instance: waste_entry_flag_loop_twice_then_supersede_and_compensating_restore_to_recorded
          rationale: "The depth probe already drives RECORDED -> FLAGGED -> RECORDED twice, counts the loop, then supersedes and compensates back to RECORDED; a breadth restatement of the same loop would add no independent signal."

      - name: parallel_dimension_shape_of_the_diversion_consignment
        claim_type: parallel
        grounds: ["complexity_profile.state_machine_shape", "state_machines.DiversionConsignment"]
        excluded_because:
          difficulty_instance: consignment_settlement_dimension_cycles_while_logistics_dimension_is_pinned
          rationale: "The depth probe holds logistics_status pinned at COMPLETED while settlement_status cycles through TICKET_SUBMITTED -> DISPUTED -> TICKET_SUBMITTED -> SETTLED, which is exactly the independent-dimension claim."

      - name: branching_shape_of_the_baseline_period_review
        claim_type: branching
        grounds: ["complexity_profile.state_machine_shape", "state_machines.BaselinePeriod"]
        excluded_because:
          difficulty_instance: baseline_period_rejection_loop_reruns_metrics_over_changed_source_data
          rationale: "The certify / reject fork out of SUBMITTED and the recomputation on the second pass through the fork are both asserted by the depth probe."

      - name: guarded_transition_shape_across_target_and_baseline
        claim_type: guarded_transitions
        grounds: ["complexity_profile.state_machine_shape", "state_machines.ReductionTarget.PROPOSED_to_ACTIVE"]
        excluded_because:
          difficulty_instance: target_activation_requires_certified_baseline_period
          rationale: "The cross-entity guard (activate only while the referenced BaselinePeriod is CERTIFIED) is asserted in both directions by the depth probe."

      - name: cascade_down_pattern_from_void_to_site_posture
        claim_type: cascade_down
        grounds: ["state_machines.WasteEntry.RECORDED_to_VOIDED", "endpoints[POST /waste-entries/{id}/void]"]
        excluded_because:
          difficulty_instance: void_entry_cascades_four_hops_to_site_coaching_posture
          rationale: "The four-hop parent chain and the fact that only non-terminal alerts are touched are both covered by the depth probe."

      - name: bubble_up_pattern_at_shift_close
        claim_type: bubble_up
        grounds: ["state_machines.Shift.OPEN_to_CLOSED", "endpoints[POST /shifts/{id}/close]"]
        excluded_because:
          difficulty_instance: close_shift_cascades_four_hops_along_the_money_path_and_expires_the_alert
          rationale: "Closing the shift is the moment child entries finalise and their aggregate bubbles into Site and ReductionTarget; the depth probe walks every hop."

      - name: cross_entity_pattern_from_ticket_acceptance_to_target
        claim_type: cross_entity
        grounds: ["state_machines.HaulerTicket.SUBMITTED_to_ACCEPTED", "endpoints[POST /hauler-tickets/{id}/accept]"]
        excluded_because:
          difficulty_instance: accept_ticket_cascades_three_hops_to_flip_reduction_target_attainment
          rationale: "Ticket acceptance adjusting Site and then ReductionTarget is the cross-entity claim, asserted hop by hop in the depth probe."

      - name: ledger_sync_pattern_on_the_site_cost_ledger
        claim_type: ledger_sync
        grounds: ["state_machines.WasteEntry.RECORDED_to_VOIDED", "calculations.site_waste_aggregates"]
        excluded_because:
          difficulty_instance: voiding_a_correcting_entry_restores_the_site_cost_ledger_to_the_exact_cent
          rationale: "Before/after reconciliation of Site.valued_waste_cost_cents across a correction and its void is the depth probe's whole subject."

      - name: compensation_pattern_on_gram_conservation
        claim_type: compensation
        grounds: ["endpoints[DELETE /consignment-lines/{id}]", "calculations.routed_weight_allocation"]
        excluded_because:
          difficulty_instance: deleting_a_consignment_line_restores_the_gram_conservation_exactly
          rationale: "Reversal of every allocation side effect with no residual drift is asserted at the gram level by the depth probe."

      - name: conditional_cascade_pattern_on_alert_expiry
        claim_type: conditional_cascade
        grounds: ["state_machines.Shift.OPEN_to_CLOSED", "state_machines.CoachingAlert.OPEN_to_EXPIRED"]
        excluded_because:
          difficulty_instance: close_shift_cascades_four_hops_along_the_money_path_and_expires_the_alert
          rationale: "Only alerts still in OPEN are expired by the close cascade while ACKNOWLEDGED and RESOLVED ones are left alone — the conditional arm is asserted there."

  # =========================================================================
  # calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: shift_waste_intensity_sums_two_captures_and_reports_full_compliance
        claim_type: correct_result
        grounds: ["calculations.shift_waste_intensity", "endpoints[GET /shifts/{id}]"]
        distinguishing_aspect: "Plain forward computation with no boundary and no exclusion: 1000 + 1500 grams over 250 meals is exactly 10.000 kg per 1000 meals, the single ACTIVE station did report, and every gram is pre-consumer."
        test_recipe:
          setup: ["Site HK-01, one ACTIVE station PREP-1 (capture_lock_seconds default 30), food type Chicken Breast at 640 c/kg, OPEN AM shift on 2026-08-01 with 250 meals. The two captures are five minutes apart, well outside the 30 + 60 second station lock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T12:00:00Z" }
              as: "*"
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Chicken Breast", category: "PROTEIN", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: false, compostable: true, donation_shelf_life_hours: 720 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-08-01", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-08-01T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 1500, loss_reason: "SPOILAGE", captured_at: "2026-08-01T10:05:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
          trigger:
            - call: "GET /shifts/${shift_id}"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
          assert:
            - "HTTP 200 with shift_waste_grams == 2500 and waste_intensity_kg_per_1k_meals == 10.000"
            - "pre_consumer_share_pct == 1.0000 and capture_compliance_pct == 1.0000"
            - "leaderboard_score is still null because the shift has not been closed"

      - name: voided_capture_drops_out_of_the_shift_intensity_input_set
        claim_type: input_set_filtering
