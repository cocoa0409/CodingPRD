          trigger:
            - call: "POST /authorizer/monitoring-reports/${rep_id}/submit"
              payload: {}
              as: AuthorizerStaff
              captures: { err: $.data.error_id }
          assert:
            - "captured error_id == 'ERR_REPORT_INVALID_STATE'"
            - "MonitoringReport.${rep_id}.status == 'SUBMITTED' (unchanged)"

      - name: sm_lottery_execute_before_seal_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Lottery.SEALED_to_EXECUTED, "errors[ERR_LOTTERY_INVALID_STATE]"]
        distinguishing_aspect: "execute requires SEALED; executing an OPEN lottery fails with ERR_LOTTERY_INVALID_STATE and no ranks are assigned."
        test_recipe:
          setup: ["school OPEN (standard fixture); lottery 2028 OPEN with one auto-VERIFIED entry"]
          setup_api_calls:
            - call: "POST /authorizer/applications"
              payload: { school_name: "SM Lottery Academy", founding_group: "FG S5", cycle_year: 2027, proposed_grades: "K-8" }
