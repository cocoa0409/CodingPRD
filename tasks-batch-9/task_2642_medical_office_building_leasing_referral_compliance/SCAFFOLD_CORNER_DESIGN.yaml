          setup:
            - "One reference Building with an 8000 sf IMAGING suite already shielding_certified with lead_thickness_mm 2.5."
            - "One physician-owned INDEPENDENT_PRACTICE RADIOLOGY tenant on a DIRECT lease at 38.00 psf for 2026-09-01..2029-08-31."
