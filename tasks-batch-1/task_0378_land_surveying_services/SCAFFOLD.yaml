scenario: |
  Land Surveying Services: order & survey type (boundary/topo/ALTA/elevation), parcel/deed research,
  field-crew scheduling & equipment, fieldwork & data, plat/drawing production & seal, revision, rush,
  deliverable & invoice

domain_name: land-surveying-services
api_prefix: ""

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by foreign keys (SurveyOrder, ResearchPacket, FieldAssignment,
  # CrewMember, Instrument, DataSet, PlatDrawing, RevisionRequest, Deliverable, Invoice).
  # No deep nested URL ownership trees; children reference parents by FK fields.

  state_machine_shape: cyclic
  # SurveyOrder runs a branching pipeline; PlatDrawing carries a revision cycle
  # (SEALED-adjacent IN_REVISION -> DRAFTED -> ... loop); FieldAssignment is
  # branching with revert; Invoice carries a parallel/compound settlement axis.

  relationship_patterns:
    - one_to_many        # SurveyOrder -> {ResearchPacket, FieldAssignment, DataSet, PlatDrawing, Deliverable, Invoice}
    - many_to_many       # FieldAssignment <-> Instrument via InstrumentReservation junction
    - cross_aggregate    # PlatDrawing.sealed_by references CrewMember (licensed surveyor)

  role_model: segregation_of_duties
  # The licensed surveyor who seals a plat must not be the field tech who recorded
  # its source DataSet; research, fieldwork, drafting, sealing and billing are split.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Crew member legal name
      - name: role_type
        type: enum
        source: input
        description: "COORDINATOR (project coordinator) | PLS (Professional Land Surveyor, may seal) | TECH (field technician) | RESEARCHER | DRAFTER | BILLING_CLERK — each value backs the matching RBAC role in §1.7"
        constraints: "one of {COORDINATOR, PLS, TECH, RESEARCHER, DRAFTER, BILLING_CLERK}"
      - name: license_number
        type: string
        source: input
        description: State PLS license number; required when role_type=PLS, else null
        default: null
      - name: license_state
        type: string
        source: input
        description: Two-letter state code the PLS is licensed in; null unless role_type=PLS
        default: null
      - name: license_expires_on
        type: datetime
        source: input
        description: ISO 8601 date the PLS license expires; null unless role_type=PLS
        default: null
      - name: active
        type: boolean
        source: input
        description: Whether this crew member is available for scheduling
        default: true
      - name: open_assignment_count
        type: integer
        source: computed
        description: "Count of FieldAssignment rows for this crew member whose status IN {SCHEDULED, IN_PROGRESS}"
        default: 0

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - name: asset_tag
        type: string
        source: input
        description: Unique equipment asset tag
        constraints: "unique across all Instrument rows (case-sensitive exact match)"
      - name: instrument_type
        type: enum
        source: input
        description: "TOTAL_STATION | GPS_RTK | LEVEL | DRONE | SCANNER"
        constraints: "one of {TOTAL_STATION, GPS_RTK, LEVEL, DRONE, SCANNER}"
      - name: calibration_due_on
        type: datetime
        source: input
        description: ISO 8601 date by which the instrument must be recalibrated
      - name: status
        type: enum
        source: system
        description: "AVAILABLE | RESERVED | MAINTENANCE"
        default: AVAILABLE

  - name: SurveyOrder
    parent: null
    common_fields: true
    fields:
      - name: client_name
        type: string
        source: input
        description: Ordering client name
      - name: survey_type
        type: enum
        source: input
        description: "BOUNDARY | TOPO | ALTA | ELEVATION — drives required pipeline stages and base fee tier"
        constraints: "one of {BOUNDARY, TOPO, ALTA, ELEVATION}"
      - name: parcel_apn
        type: string
        source: input
        description: Assessor parcel number for the subject property
      - name: county_fips
        type: string
        source: input
        description: 5-digit county FIPS code used for deed-research routing
      - name: acreage
        type: number
        source: input
        description: Subject parcel size in acres; drives per-acre field fee
        constraints: "> 0"
      - name: rush
        type: boolean
        source: input
        description: Whether the client requested rush turnaround at order time
        default: false
      - name: requested_due_date
        type: datetime
        source: input
        description: ISO 8601 client-requested completion date
      - name: status
        type: enum
        source: system
        description: "INTAKE -> RESEARCH -> FIELD_READY -> IN_FIELD -> DATA_READY -> DRAFTING -> SEALED -> DELIVERED; cancellable from any pre-SEALED state to CANCELLED"
        default: INTAKE
      - name: research_clear
        type: boolean
        source: computed
        description: True once the order's ResearchPacket reached CLEARED; gates the RESEARCH->FIELD_READY transition
        default: false
      - name: base_fee_cents
        type: integer
        source: computed
        description: Survey-type base fee in cents, set on creation from BASE_FEE_BY_TYPE
        default: 0
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: Provisional total fee in cents computed at order creation (estimate variant)
        default: 0
      - name: final_fee_cents
        type: integer
        source: computed
        description: Final total fee in cents computed when the Invoice is issued (actual variant); 0 until issued
        default: 0
      - name: revision_count
        type: integer
        source: computed
        description: Number of RevisionRequest rows that have been APPLIED to this order's plats
        default: 0

  - name: ResearchPacket
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> SurveyOrder.id; the order this research belongs to (one packet per order)"
      - name: assigned_researcher_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the RESEARCHER assigned; must have role_type=RESEARCHER"
      - name: deed_book
        type: string
        source: input
        description: Recorded deed book reference
        default: null
      - name: deed_page
        type: string
        source: input
        description: Recorded deed page reference
        default: null
      - name: encumbrance_count
        type: integer
        source: input
        description: Count of liens/easements found during research; drives clear-vs-hold outcome
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN -> IN_PROGRESS -> {CLEARED | TITLE_HOLD}; TITLE_HOLD -> IN_PROGRESS (re-open allowed)"
        default: OPEN

  - name: FieldAssignment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> SurveyOrder.id; the order being surveyed in the field"
      - name: crew_member_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the TECH or PLS performing fieldwork; must have role_type IN {TECH, PLS}"
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 UTC field-window start (inclusive)
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO 8601 UTC field-window end (exclusive); must be after scheduled_start
      - name: status
        type: enum
        source: system
        description: "SCHEDULED -> IN_PROGRESS -> COMPLETED; SCHEDULED -> CANCELLED (releases reservations)"
        default: SCHEDULED
      - name: window_minutes
        type: integer
        source: computed
        description: "Whole minutes between scheduled_start and scheduled_end, floor((end-start)/60s)"
        default: 0

  - name: InstrumentReservation
    parent: null
    common_fields: true
    fields:
      - name: assignment_id
        type: string
        source: input
        description: "FK -> FieldAssignment.id; the field window this instrument is held for"
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id; the reserved instrument"
      - name: reserved_start
        type: datetime
        source: system
        description: Copied from the FieldAssignment.scheduled_start at reservation time (inclusive)
      - name: reserved_end
        type: datetime
        source: system
        description: Copied from the FieldAssignment.scheduled_end at reservation time (exclusive)
      - name: status
        type: enum
        source: system
        description: "HELD -> RELEASED; created HELD, set RELEASED when the assignment is CANCELLED or COMPLETED"
        default: HELD

  - name: DataSet
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> SurveyOrder.id; the order this field data belongs to"
      - name: assignment_id
        type: string
        source: input
        description: "FK -> FieldAssignment.id; the completed field window that produced this data"
      - name: recorded_by_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the TECH/PLS who recorded the data (segregation source)"
      - name: point_count
        type: integer
        source: input
        description: Number of surveyed points captured in the field
        constraints: ">= 0"
      - name: closure_error_ppm
        type: integer
        source: input
        description: Traverse closure error in parts-per-million; precision threshold gate for sealing
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "RAW -> REDUCED -> ACCEPTED; ACCEPTED is required before its order may enter DRAFTING"
        default: RAW

  - name: PlatDrawing
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> SurveyOrder.id; the order this plat depicts"
      - name: dataset_id
        type: string
        source: input
        description: "FK -> DataSet.id; the ACCEPTED dataset this drawing is reduced from"
      - name: drafted_by_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the DRAFTER who produced the drawing"
      - name: sealed_by_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the PLS who applied the seal; null until SEALED"
        default: null
      - name: status
        type: enum
        source: system
        description: "DRAFTED -> UNDER_REVIEW -> SEALED; SEALED|UNDER_REVIEW -> IN_REVISION -> DRAFTED (revision loop)"
        default: DRAFTED
      - name: sealed_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp the seal was applied; null until SEALED
        default: null

  - name: RevisionRequest
    parent: null
    common_fields: true
    fields:
      - name: plat_id
        type: string
        source: input
        description: "FK -> PlatDrawing.id; the drawing being revised"
      - name: reason
        type: enum
        source: input
        description: "CLIENT_CHANGE | FIELD_ERROR | DEED_DISCREPANCY — drives whether a re-seal fee applies"
        constraints: "one of {CLIENT_CHANGE, FIELD_ERROR, DEED_DISCREPANCY}"
      - name: notes
        type: string
        source: input
        description: Free-text revision description
        default: null
      - name: status
        type: enum
        source: system
        description: "REQUESTED -> APPLIED; REQUESTED -> REJECTED"
        default: REQUESTED
      - name: reseal_fee_cents
        type: integer
        source: computed
        description: Re-seal surcharge in cents added to the order when this revision is APPLIED (0 for FIELD_ERROR)
        default: 0

  - name: Deliverable
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> SurveyOrder.id; the order being delivered"
      - name: plat_id
        type: string
        source: input
        description: "FK -> PlatDrawing.id; the SEALED plat included in the package"
      - name: format
        type: enum
        source: input
        description: "PDF | DWG | PAPER"
        constraints: "one of {PDF, DWG, PAPER}"
      - name: status
        type: enum
        source: system
        description: "ASSEMBLED -> RELEASED; RELEASED is terminal"
        default: ASSEMBLED

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> SurveyOrder.id; the billed order (one issued invoice per order)"
      - name: issued_by_id
        type: string
        source: input
        description: "FK -> CrewMember.id; the BILLING_CLERK who issued the invoice"
      - name: subtotal_cents
        type: integer
        source: computed
        description: Sum of base, field, rush and reseal components in cents at issue time
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: Tax in cents computed from subtotal at issue time
        default: 0
      - name: total_cents
        type: integer
        source: computed
        description: subtotal_cents + tax_cents in cents
        default: 0
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Cumulative payments applied in cents
        default: 0
      - name: balance_due_cents
        type: integer
        source: computed
        description: total_cents - amount_paid_cents in cents
        default: 0
      - name: lifecycle_status
        type: enum
        source: system
        description: "DRAFT -> ISSUED -> CLOSED; parallel axis to payment_status"
        default: DRAFT
      - name: payment_status
        type: enum
        source: system
        description: "UNPAID -> PARTIAL -> PAID; independent parallel axis advanced by payments"
        default: UNPAID

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SurveyOrder
    initial_state: INTAKE
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: INTAKE
        to: RESEARCH
        trigger: "POST /survey-orders/{id}/start-research"
        actor: Coordinator
        preconditions:
          - "exactly one ResearchPacket exists for this order"
        side_effects:
          - "no fee change"
      - from: RESEARCH
        to: FIELD_READY
        trigger: "POST /survey-orders/{id}/clear-research"
        actor: Coordinator
        preconditions:
          - "order.research_clear == true (set when the order's ResearchPacket reached CLEARED)"
        side_effects:
          - "no fee change"
        note: "Cross-entity guard: requires ResearchPacket.status == CLEARED."
      - from: FIELD_READY
        to: IN_FIELD
        trigger: "POST /field-assignments/{id}/start (first assignment for the order starts)"
        actor: FieldTech
        preconditions:
          - "at least one FieldAssignment for this order is IN_PROGRESS"
        side_effects:
          - "order advances to IN_FIELD on first assignment start"
      - from: IN_FIELD
        to: DATA_READY
        trigger: "POST /data-sets/{id}/accept (a dataset for the order is ACCEPTED)"
        actor: Coordinator
        preconditions:
          - "at least one DataSet for this order has status == ACCEPTED"
        side_effects:
          - "order advances to DATA_READY"
      - from: DATA_READY
        to: DRAFTING
        trigger: "POST /plat-drawings (first plat for the order is created)"
        actor: Drafter
        preconditions:
          - "at least one DataSet for this order is ACCEPTED"
        side_effects:
          - "order advances to DRAFTING"
      - from: DRAFTING
        to: SEALED
        trigger: "POST /plat-drawings/{id}/seal (a plat for the order is SEALED)"
        actor: Surveyor
        preconditions:
          - "at least one PlatDrawing for this order is SEALED"
        side_effects:
          - "order advances to SEALED"
      - from: SEALED
        to: DRAFTING
        trigger: "POST /revision-requests/{id}/apply (revision applied to the order's SEALED plat)"
        actor: Coordinator
        preconditions:
          - "order.status == SEALED"
          - "the revision's plat was SEALED (its seal is being cleared)"
        side_effects:
          - "order reverts SEALED->DRAFTING so the plat can be re-drafted, re-reviewed and re-sealed (cyclic)"
        note: "Bubble-up: a revision that un-seals the order's plat returns the order to DRAFTING; it must re-seal to reach SEALED again."
      - from: SEALED
        to: DELIVERED
        trigger: "POST /deliverables/{id}/release"
        actor: Coordinator
        preconditions:
          - "the released Deliverable references a SEALED plat for this order"
          - "the order has an Invoice with lifecycle_status == ISSUED"
        side_effects:
          - "order becomes DELIVERED (terminal)"
        note: "Cross-entity guard on Invoice and Deliverable/Plat state."
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /survey-orders/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "order.status NOT IN {SEALED, DELIVERED}"
        side_effects:
          - "cascade: every SCHEDULED FieldAssignment for the order -> CANCELLED (which itself releases its HELD InstrumentReservations and flips each freed Instrument RESERVED->AVAILABLE)"
      - from: RESEARCH
        to: CANCELLED
        trigger: "POST /survey-orders/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "order.status NOT IN {SEALED, DELIVERED}"
        side_effects:
          - "cascade: every SCHEDULED FieldAssignment for the order -> CANCELLED -> reservations RELEASED -> instruments AVAILABLE"
      - from: FIELD_READY
        to: CANCELLED
        trigger: "POST /survey-orders/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "order.status NOT IN {SEALED, DELIVERED}"
        side_effects:
          - "cascade: every SCHEDULED FieldAssignment for the order -> CANCELLED -> each HELD InstrumentReservation -> RELEASED -> each freed Instrument RESERVED->AVAILABLE (depth-3 chain)"
      - from: IN_FIELD
        to: CANCELLED
        trigger: "POST /survey-orders/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "order.status NOT IN {SEALED, DELIVERED}"
        side_effects:
          - "cascade: every SCHEDULED FieldAssignment for the order -> CANCELLED -> reservations RELEASED -> instruments AVAILABLE"
      - from: DATA_READY
        to: CANCELLED
        trigger: "POST /survey-orders/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "order.status NOT IN {SEALED, DELIVERED}"
        side_effects:
          - "cascade: every SCHEDULED FieldAssignment for the order -> CANCELLED -> reservations RELEASED -> instruments AVAILABLE"
      - from: DRAFTING
        to: CANCELLED
        trigger: "POST /survey-orders/{id}/cancel"
        actor: Coordinator
        preconditions:
          - "order.status NOT IN {SEALED, DELIVERED}"
        side_effects:
          - "cascade: every SCHEDULED FieldAssignment for the order -> CANCELLED -> reservations RELEASED -> instruments AVAILABLE"

  - entity: ResearchPacket
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /research-packets/{id}/begin"
        actor: Researcher
        preconditions:
          - "assigned_researcher_id resolves to a CrewMember with role_type == RESEARCHER and active == true"
          - "parent SurveyOrder.status == RESEARCH"
        side_effects:
          - "no fee change"
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "POST /research-packets/{id}/clear"
        actor: Researcher
        preconditions:
          - "encumbrance_count == 0"
        side_effects:
          - "set parent SurveyOrder.research_clear = true"
        note: "Boundary: clear is permitted only at exactly zero encumbrances."
      - from: IN_PROGRESS
        to: TITLE_HOLD
        trigger: "POST /research-packets/{id}/hold"
        actor: Researcher
        preconditions:
          - "encumbrance_count >= 1"
        side_effects:
          - "no order advance; research_clear stays false"
      - from: TITLE_HOLD
        to: IN_PROGRESS
        trigger: "POST /research-packets/{id}/begin"
        actor: Researcher
        preconditions:
          - "parent SurveyOrder.status == RESEARCH"
        side_effects:
          - "re-open for re-investigation (cyclic)"

  - entity: FieldAssignment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /field-assignments/{id}/start"
        actor: FieldTech
        preconditions:
          - "parent SurveyOrder.status IN {FIELD_READY, IN_FIELD}"
          - "crew member is active"
        side_effects:
          - "if parent order.status == FIELD_READY, advance order to IN_FIELD (bubble-up)"
          - "increment crew member open_assignment_count is unchanged (count tracks SCHEDULED|IN_PROGRESS; already counted)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /field-assignments/{id}/complete"
        actor: FieldTech
        preconditions:
          - "assignment.status == IN_PROGRESS"
        side_effects:
          - "each HELD InstrumentReservation for this assignment -> RELEASED; each freed Instrument RESERVED->AVAILABLE"
          - "decrement crew member open_assignment_count by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /field-assignments/{id}/cancel OR cascade from SurveyOrder cancel"
        actor: FieldTech
        preconditions:
          - "assignment.status == SCHEDULED"
        side_effects:
          - "each HELD InstrumentReservation for this assignment -> RELEASED; each freed Instrument RESERVED->AVAILABLE"
          - "decrement crew member open_assignment_count by 1"

  - entity: PlatDrawing
    initial_state: DRAFTED
    terminal_states: []
    transitions:
      - from: DRAFTED
        to: UNDER_REVIEW
        trigger: "POST /plat-drawings/{id}/submit-review"
        actor: Drafter
        preconditions:
          - "source DataSet.status == ACCEPTED"
        side_effects:
          - "no fee change"
      - from: UNDER_REVIEW
        to: SEALED
        trigger: "POST /plat-drawings/{id}/seal"
        actor: Surveyor
        preconditions:
          - "sealing CrewMember role_type == PLS, active == true, license not expired"
          - "sealing CrewMember.id != source DataSet.recorded_by_id (segregation of duties)"
          - "source DataSet.closure_error_ppm <= MAX_SEALABLE_CLOSURE_PPM"
        side_effects:
          - "set sealed_by_id, sealed_at; advance parent order DRAFTING->SEALED"
      - from: SEALED
        to: IN_REVISION
        trigger: "POST /revision-requests/{id}/apply (revision applied to a SEALED plat)"
        actor: Coordinator
        preconditions:
          - "a RevisionRequest in REQUESTED state targets this plat"
        side_effects:
          - "clear seal: set sealed_by_id=null, sealed_at=null"
          - "add reseal_fee_cents to order.estimated_fee_cents per RESEAL_FEE_BY_REASON; increment order.revision_count by 1"
          - "revert parent SurveyOrder SEALED->DRAFTING (the order must re-seal to reach SEALED again)"
      - from: UNDER_REVIEW
        to: IN_REVISION
        trigger: "POST /revision-requests/{id}/apply (revision applied to an UNDER_REVIEW plat)"
        actor: Coordinator
        preconditions:
          - "a RevisionRequest in REQUESTED state targets this plat"
        side_effects:
          - "increment order.revision_count by 1; no reseal fee (was not sealed)"
      - from: IN_REVISION
        to: DRAFTED
        trigger: "POST /plat-drawings/{id}/resume-draft"
        actor: Drafter
        preconditions:
          - "plat.status == IN_REVISION"
        side_effects:
          - "cyclic return to drafting for re-work"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /invoices/{id}/issue"
        actor: BillingClerk
        preconditions:
          - "parent SurveyOrder.status IN {SEALED, DELIVERED}"
          - "invoice.lifecycle_status == DRAFT"
        side_effects:
          - "freeze final_fee_cents on the order (actual variant); compute subtotal/tax/total; set order.final_fee_cents = invoice.total_cents"
      - from: ISSUED
        to: CLOSED
        trigger: "POST /invoices/{id}/payments (payment that brings balance to zero)"
        actor: BillingClerk
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "after this payment balance_due_cents == 0"
        side_effects:
          - "lifecycle_status -> CLOSED; payment_status -> PAID (parallel axis)"
      - from: ISSUED
        to: ISSUED
        trigger: "POST /invoices/{id}/payments (partial payment)"
        actor: BillingClerk
        preconditions:
          - "invoice.lifecycle_status == ISSUED"
          - "0 < payment_amount_cents AND resulting balance_due_cents > 0"
        side_effects:
          - "amount_paid_cents += payment; balance_due_cents recomputed; payment_status UNPAID->PARTIAL on first partial (parallel axis advances independently of lifecycle_status)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plat-seal-stale-order
    parent_entity: SurveyOrder
    write_endpoint: "POST /plat-drawings/{id}/seal"
    occ_field: "expected_order_version"
    description: |
      Sealing a plat advances its parent SurveyOrder DRAFTING->SEALED, which mutates
      the order's version. A second seal request that carries an order version older
      than the order's current version is rejected as stale: the client's view of the
      order predates a mutation it did not observe (e.g., a revision-apply that bumped
      revision_count, or a sibling plat seal that already advanced the order).
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: invoice-issue-stale-order
    parent_entity: SurveyOrder
    write_endpoint: "POST /invoices/{id}/issue"
    occ_field: "expected_order_version"
    description: |
      Issuing an Invoice freezes the order's final_fee_cents from the order's current
      estimated components. A revision applied after the client last read the order
      bumps the order's version (and its fee components). Issuing against a stale order
      version is rejected so the clerk cannot freeze a fee total computed from a view
      of the order that has since changed.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_fee_estimate
    trigger: "POST /survey-orders (order creation) — provisional estimate variant"
    algorithm: tiered_pricing
    formula: |
      base_fee_cents = BASE_FEE_BY_TYPE[survey_type]
      # per-acre field component, tiered: marginal rates per acre band, summed across bands
      acres = order.acreage
      field_fee_cents = 0
      remaining = acres
      for (band_cap, rate_cents_per_acre) in ACRE_TIERS:   # ordered ascending by cap
          band_acres = min(remaining, band_cap_width(band))
          field_fee_cents += round_half_up(band_acres * rate_cents_per_acre)
          remaining -= band_acres
          if remaining <= 0: break
      # rush surcharge is a percentage of (base + field), applied AFTER both, rounded once
      pre_rush = base_fee_cents + field_fee_cents
      rush_fee_cents = round_half_up(pre_rush * RUSH_PCT) if order.rush else 0
      estimated_fee_cents = base_fee_cents + field_fee_cents + rush_fee_cents
    input_set: "Single SurveyOrder at creation; survey_type, acreage, rush only. No research/field/revision inputs yet."
    constants:
      BASE_FEE_BY_TYPE: { BOUNDARY: 120000, TOPO: 180000, ALTA: 350000, ELEVATION: 90000 }
      ACRE_TIERS: "[(cap=5 acres, 8000 cents/acre), (cap=20 acres i.e. next 15 acres, 5000 cents/acre), (cap=∞, 3000 cents/acre)]"
      RUSH_PCT: 0.30
    precision: "cents (integer); round_half_up on each per-band product and on the single rush product"
    variants:
      - name: estimate
        when: "at order creation"
        difference: "Uses order-time inputs only; rush surcharge from the order's rush flag; ignores applied revisions."

  - name: invoice_final_fee
    trigger: "POST /invoices/{id}/issue — final/actual variant; transition Invoice DRAFT->ISSUED"
    algorithm: aggregation
    formula: |
      base_fee_cents  = order.base_fee_cents
      field_fee_cents = order_field_fee_component(order)   # recomputed from order.acreage via ACRE_TIERS (same band math)
      # rush: actual variant charges rush ONLY if the order was delivered after requested_due_date logic
      # is irrelevant here — actual rush is charged iff order.rush == true (same flag), BUT
      # reseal surcharges accumulated from APPLIED revisions are now added (these did not exist at estimate time)
      reseal_total_cents = sum(rr.reseal_fee_cents for rr in RevisionRequests where rr.plat.order_id == order.id AND rr.status == APPLIED)
      pre_rush = base_fee_cents + field_fee_cents
      rush_fee_cents = round_half_up(pre_rush * RUSH_PCT) if order.rush else 0
      subtotal_cents = base_fee_cents + field_fee_cents + rush_fee_cents + reseal_total_cents
      tax_cents = round_half_up(subtotal_cents * TAX_PCT)
      total_cents = subtotal_cents + tax_cents
    input_set: "The order plus all RevisionRequest rows for its plats with status == APPLIED (CLEARED filter). Excludes REQUESTED and REJECTED revisions."
    constants:
      TAX_PCT: 0.0825
      RUSH_PCT: 0.30
    precision: "cents (integer); round_half_up on rush product and on tax product; sum of integer reseal fees is exact"
    variants:
      - name: actual
        when: "at invoice issue"
        difference: "Adds reseal surcharges from APPLIED revisions (absent at estimate) and tax; same base+field+rush core, so final_fee_cents diverges from estimated_fee_cents whenever any revision was applied or tax is nonzero."

  - name: revision_reseal_fee
    trigger: "POST /revision-requests (creation) — sets RevisionRequest.reseal_fee_cents from reason"
    algorithm: threshold
    formula: |
      reseal_fee_cents = RESEAL_FEE_BY_REASON[reason]
      # NOTE: the value is computed and stored on the RevisionRequest at creation,
      # but only added to order.estimated_fee_cents when the revision is APPLIED to a
      # plat that was SEALED (revision applied to an UNDER_REVIEW plat adds nothing).
    input_set: "Single RevisionRequest.reason at creation."
    constants:
      RESEAL_FEE_BY_REASON: { CLIENT_CHANGE: 40000, DEED_DISCREPANCY: 25000, FIELD_ERROR: 0 }
    precision: "cents (integer); exact table lookup"

  - name: assignment_window_minutes
    trigger: "POST /field-assignments (creation) and on any window change"
    algorithm: aggregation
    formula: |
      window_minutes = floor( (epoch_seconds(scheduled_end) - epoch_seconds(scheduled_start)) / 60 )
    input_set: "Single FieldAssignment scheduled_start/scheduled_end."
    constants:
      MAX_SEALABLE_CLOSURE_PPM: 100
      TURNAROUND_MINUTES: 60
    precision: "integer minutes, floor"
    note: |
      MAX_SEALABLE_CLOSURE_PPM (100) is the inclusive ceiling on DataSet.closure_error_ppm
      that the seal precondition (§1.4 priority 11) enforces; closure_error_ppm == 100 seals,
      101 is rejected. TURNAROUND_MINUTES (60) is the symmetric buffer added on EACH side of an
      InstrumentReservation's [start,end) window for the instrument-overlap check (§1.4 priority 15).

  - name: crew_member_risk_score
    trigger: "GET /crew-members/{id}/risk-score (computed read) — risk variant on CrewMember, distinct domain from fee accounting"
    algorithm: weighted_scoring
    formula: |
      load_factor   = min(open_assignment_count, OPEN_CAP) / OPEN_CAP            # 0..1
      license_factor = 1.0 if (role_type==PLS AND license_expires_on within EXPIRY_WARN_DAYS of now) else 0.0
      # weighted blend, then scaled to 0..100, round_half_up
      raw = W_LOAD * load_factor + W_LICENSE * license_factor
      risk_score = round_half_up(raw * 100)
    input_set: "Single CrewMember; open_assignment_count (computed) and license fields. Distinct entity domain from fee calcs."
    constants:
      OPEN_CAP: 5
      EXPIRY_WARN_DAYS: 30
      W_LOAD: 0.6
      W_LICENSE: 0.4
    precision: "integer 0..100, round_half_up"
    variants:
      - name: scheduling_risk
        when: "on GET risk-score"
        difference: "Risk scoring on a CrewMember — a different entity domain from order/invoice fee accounting; blends workload and license-expiry factors."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "Request body has all required fields with valid types/enums"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_order_version matches SurveyOrder.version on seal/issue endpoints"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /plat-drawings/{id}/seal, POST /invoices/{id}/issue"
  - priority: 7
    category: business_referential
    check: "Assigned researcher has role_type == RESEARCHER (and active) for research begin"
    error_id: ERR_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /research-packets, POST /research-packets/{id}/begin"
  - priority: 8
    category: business_referential
    check: "Field assignment crew member has role_type IN {TECH, PLS} and active==true"
    error_id: ERR_ROLE_MISMATCH
    http_status: 422
    applies_to: "POST /field-assignments"
  - priority: 9
    category: business_safety
    check: "Seal segregation of duties: sealing PLS.id must differ from source DataSet.recorded_by_id"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 422
    applies_to: "POST /plat-drawings/{id}/seal"
  - priority: 10
    category: business_safety
    check: "Sealing crew member is PLS, active, with a non-expired license (license_expires_on > now)"
    error_id: ERR_SEAL_NOT_LICENSED
    http_status: 422
    applies_to: "POST /plat-drawings/{id}/seal"
  - priority: 11
    category: business_constraint
    check: "Source DataSet.closure_error_ppm <= MAX_SEALABLE_CLOSURE_PPM for seal"
    error_id: ERR_CLOSURE_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /plat-drawings/{id}/seal"
  - priority: 12
    category: business_constraint
    check: "Research clear requires encumbrance_count == 0 (else must hold)"
    error_id: ERR_TITLE_NOT_CLEAR
    http_status: 422
    applies_to: "POST /research-packets/{id}/clear"
  - priority: 13
    category: business_temporal
    check: "FieldAssignment scheduled_end strictly after scheduled_start"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /field-assignments"
  - priority: 14
    category: business_temporal
    check: "Crew member has no other SCHEDULED/IN_PROGRESS FieldAssignment whose [start,end) half-open interval overlaps this one (adjacency allowed: end==start is OK)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /field-assignments"
  - priority: 15
    category: business_temporal
    check: "Instrument has no other HELD reservation whose [start,end) interval, expanded by TURNAROUND_MINUTES buffer on each side, overlaps this window (buffered-interval semantics)"
    error_id: ERR_INSTRUMENT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /instrument-reservations"
  - priority: 16
    category: business_constraint
    check: "Instrument calibration_due_on is in the future relative to the assignment scheduled_end"
    error_id: ERR_INSTRUMENT_OUT_OF_CALIBRATION
    http_status: 422
    applies_to: "POST /instrument-reservations"
  - priority: 17
    category: business_referential
    check: "Asset tag uniqueness across Instrument rows"
    error_id: ERR_DUPLICATE_ASSET_TAG
    http_status: 409
    applies_to: "POST /instruments"
  - priority: 18
    category: business_constraint
    check: "Payment amount_cents > 0 and does not exceed current balance_due_cents (no overpayment)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /invoices/{id}/payments"
  - priority: 19
    category: business_referential
    check: "At most one ResearchPacket per order; at most one ISSUED/CLOSED Invoice per order"
    error_id: ERR_DUPLICATE_CHILD
    http_status: 409
    applies_to: "POST /research-packets, POST /invoices/{id}/issue"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- CrewMember ----
  - method: POST
    path: /crew-members
    description: Register a crew member
    roles: [Coordinator]
    code: 201
    input: ["full_name", "role_type", "license_number?", "license_state?", "license_expires_on?", "active?"]
    output: CrewMember
    side_effects: ["open_assignment_count=0"]
  - method: GET
    path: /crew-members/{id}
    description: Get a crew member
    roles: [Coordinator, Researcher, FieldTech, Drafter, Surveyor, BillingClerk]
    code: 200
    input: []
    output: CrewMember
    side_effects: []
  - method: GET
    path: /crew-members
    description: List crew members (filterable by role_type)
    roles: [Coordinator, Researcher, FieldTech, Drafter, Surveyor, BillingClerk]
    code: 200
    input: ["role_type?", "active?", "limit?", "offset?"]
    output: CrewMember[]
    side_effects: []
  - method: GET
    path: /crew-members/{id}/risk-score
    description: Computed scheduling risk score for a crew member
    roles: [Coordinator]
    code: 200
    output: CrewMember
    input: []
    side_effects: ["computes crew_member_risk_score (read-only)"]

  # ---- Instrument ----
  - method: POST
    path: /instruments
    description: Register an instrument
    roles: [Coordinator]
    code: 201
    input: ["asset_tag", "instrument_type", "calibration_due_on"]
    output: Instrument
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: /instruments/{id}
    description: Get an instrument
    roles: [Coordinator, FieldTech]
    code: 200
    input: []
    output: Instrument
    side_effects: []
  - method: GET
    path: /instruments
    description: List instruments
    roles: [Coordinator, FieldTech]
    code: 200
    input: ["instrument_type?", "status?", "limit?", "offset?"]
    output: Instrument[]
    side_effects: []

  # ---- SurveyOrder ----
  - method: POST
    path: /survey-orders
    description: Create a survey order
    roles: [Coordinator]
    code: 201
    input: ["client_name", "survey_type", "parcel_apn", "county_fips", "acreage", "rush?", "requested_due_date"]
    output: SurveyOrder
    side_effects: ["compute base_fee_cents from survey_type; compute estimated_fee_cents (order_fee_estimate); status=INTAKE"]
  - method: GET
    path: /survey-orders/{id}
    description: Get a survey order
    roles: [Coordinator, Researcher, FieldTech, Drafter, Surveyor, BillingClerk]
    code: 200
    input: []
    output: SurveyOrder
    side_effects: []
  - method: GET
    path: /survey-orders
    description: List survey orders
    roles: [Coordinator, Researcher, FieldTech, Drafter, Surveyor, BillingClerk]
    code: 200
    input: ["status?", "survey_type?", "limit?", "offset?"]
    output: SurveyOrder[]
    side_effects: []
  - method: POST
    path: /survey-orders/{id}/start-research
    description: Move order INTAKE->RESEARCH
    roles: [Coordinator]
    code: 200
    input: []
    output: SurveyOrder
    side_effects: ["status INTAKE->RESEARCH"]
  - method: POST
    path: /survey-orders/{id}/clear-research
    description: Move order RESEARCH->FIELD_READY once research cleared
    roles: [Coordinator]
    code: 200
    input: []
    output: SurveyOrder
    side_effects: ["status RESEARCH->FIELD_READY (requires research_clear==true)"]
  - method: POST
    path: /survey-orders/{id}/cancel
    description: Cancel an order (pre-SEALED)
    roles: [Coordinator]
    code: 200
    input: []
    output: SurveyOrder
    side_effects: ["status->CANCELLED; cascade-cancel SCHEDULED FieldAssignments -> release reservations -> free instruments"]

  # ---- ResearchPacket ----
  - method: POST
    path: /research-packets
    description: Open a research packet for an order
    roles: [Coordinator, Researcher]
    code: 201
    input: ["order_id", "assigned_researcher_id", "deed_book?", "deed_page?", "encumbrance_count?"]
    output: ResearchPacket
    side_effects: ["status=OPEN"]
  - method: GET
    path: /research-packets/{id}
    description: Get a research packet
    roles: [Coordinator, Researcher]
    code: 200
    input: []
    output: ResearchPacket
    side_effects: []
  - method: GET
    path: /research-packets
    description: List research packets (filter by order_id or assigned_researcher_id)
    roles: [Coordinator, Researcher]
    code: 200
    input: ["order_id?", "assigned_researcher_id?", "status?", "limit?", "offset?"]
    output: ResearchPacket[]
    side_effects: []
  - method: POST
    path: /research-packets/{id}/begin
    description: OPEN/TITLE_HOLD -> IN_PROGRESS
    roles: [Researcher]
    code: 200
    input: []
    output: ResearchPacket
    side_effects: ["status->IN_PROGRESS"]
  - method: POST
    path: /research-packets/{id}/clear
    description: IN_PROGRESS -> CLEARED
    roles: [Researcher]
    code: 200
    input: []
    output: ResearchPacket
    side_effects: ["status->CLEARED; set parent order.research_clear=true"]
  - method: POST
    path: /research-packets/{id}/hold
    description: IN_PROGRESS -> TITLE_HOLD
    roles: [Researcher]
    code: 200
    input: []
    output: ResearchPacket
    side_effects: ["status->TITLE_HOLD"]

  # ---- FieldAssignment ----
  - method: POST
    path: /field-assignments
    description: Schedule a field crew on a window for an order
    roles: [Coordinator]
    code: 201
    input: ["order_id", "crew_member_id", "scheduled_start", "scheduled_end"]
    output: FieldAssignment
    side_effects: ["status=SCHEDULED; compute window_minutes; increment crew_member.open_assignment_count"]
  - method: GET
    path: /field-assignments/{id}
    description: Get a field assignment
    roles: [Coordinator, FieldTech]
    code: 200
    input: []
    output: FieldAssignment
    side_effects: []
  - method: GET
    path: /field-assignments
    description: List field assignments (filter by order_id or crew_member_id)
    roles: [Coordinator, FieldTech]
    code: 200
    input: ["order_id?", "crew_member_id?", "status?", "limit?", "offset?"]
    output: FieldAssignment[]
    side_effects: []
  - method: POST
    path: /field-assignments/{id}/start
    description: SCHEDULED -> IN_PROGRESS
    roles: [FieldTech]
    code: 200
    input: []
    output: FieldAssignment
    side_effects: ["status->IN_PROGRESS; bubble-up order FIELD_READY->IN_FIELD"]
  - method: POST
    path: /field-assignments/{id}/complete
    description: IN_PROGRESS -> COMPLETED
    roles: [FieldTech]
    code: 200
    input: []
    output: FieldAssignment
    side_effects: ["status->COMPLETED; release reservations -> free instruments; decrement open_assignment_count"]
  - method: POST
    path: /field-assignments/{id}/cancel
    description: SCHEDULED -> CANCELLED
    roles: [Coordinator, FieldTech]
    code: 200
    input: []
    output: FieldAssignment
    side_effects: ["status->CANCELLED; release reservations -> free instruments; decrement open_assignment_count"]

  # ---- InstrumentReservation ----
  - method: POST
    path: /instrument-reservations
    description: Hold an instrument for a field assignment window
    roles: [Coordinator]
    code: 201
    input: ["assignment_id", "instrument_id"]
    output: InstrumentReservation
    side_effects: ["copy window from assignment; status=HELD; instrument AVAILABLE->RESERVED"]
  - method: GET
    path: /instrument-reservations/{id}
    description: Get a reservation
    roles: [Coordinator, FieldTech]
    code: 200
    input: []
    output: InstrumentReservation
    side_effects: []
  - method: GET
    path: /instrument-reservations
    description: List reservations (filter by assignment_id or instrument_id)
    roles: [Coordinator, FieldTech]
    code: 200
    input: ["assignment_id?", "instrument_id?", "status?", "limit?", "offset?"]
    output: InstrumentReservation[]
    side_effects: []

  # ---- DataSet ----
  - method: POST
    path: /data-sets
    description: Record field data from a completed assignment
    roles: [FieldTech, Surveyor]
    code: 201
    input: ["order_id", "assignment_id", "recorded_by_id", "point_count", "closure_error_ppm"]
    output: DataSet
    side_effects: ["status=RAW"]
  - method: GET
    path: /data-sets/{id}
    description: Get a dataset
    roles: [Coordinator, FieldTech, Drafter, Surveyor]
    code: 200
    input: []
    output: DataSet
    side_effects: []
  - method: GET
    path: /data-sets
    description: List datasets (filter by order_id, assignment_id, or recorded_by_id)
    roles: [Coordinator, FieldTech, Drafter, Surveyor]
    code: 200
    input: ["order_id?", "assignment_id?", "recorded_by_id?", "status?", "limit?", "offset?"]
    output: DataSet[]
    side_effects: []
  - method: POST
    path: /data-sets/{id}/reduce
    description: RAW -> REDUCED
    roles: [Drafter, Surveyor]
    code: 200
    input: []
    output: DataSet
    side_effects: ["status->REDUCED"]
  - method: POST
    path: /data-sets/{id}/accept
    description: REDUCED -> ACCEPTED
    roles: [Surveyor]
    code: 200
    input: []
    output: DataSet
    side_effects: ["status->ACCEPTED; advance parent order IN_FIELD->DATA_READY"]

  # ---- PlatDrawing ----
  - method: POST
    path: /plat-drawings
    description: Create a plat drawing from an accepted dataset
    roles: [Drafter]
    code: 201
    input: ["order_id", "dataset_id", "drafted_by_id"]
    output: PlatDrawing
    side_effects: ["status=DRAFTED; advance parent order DATA_READY->DRAFTING"]
  - method: GET
    path: /plat-drawings/{id}
    description: Get a plat drawing
    roles: [Coordinator, Drafter, Surveyor]
    code: 200
    input: []
    output: PlatDrawing
    side_effects: []
  - method: GET
    path: /plat-drawings
    description: List plat drawings (filter by order_id, dataset_id, drafted_by_id, or sealed_by_id)
    roles: [Coordinator, Drafter, Surveyor]
    code: 200
    input: ["order_id?", "dataset_id?", "drafted_by_id?", "sealed_by_id?", "status?", "limit?", "offset?"]
    output: PlatDrawing[]
    side_effects: []
  - method: POST
    path: /plat-drawings/{id}/submit-review
    description: DRAFTED -> UNDER_REVIEW
    roles: [Drafter]
    code: 200
    input: []
