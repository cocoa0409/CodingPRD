            - call: "POST /toll/_clock/advance_day"
              payload: { days: 30 }
              as: SettlementOfficer
            - call: "POST /toll/violations/${veq}/issue_notice"
              payload: {}
              as: ViolationsOfficer
            - call: "POST /toll/violations/${vlt}/issue_notice"
              payload: {}
