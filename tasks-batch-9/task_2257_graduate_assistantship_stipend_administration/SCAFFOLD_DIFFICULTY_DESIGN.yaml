      - name: over_appointment_on_single_day_inclusive_window_touch
        grounds:
          - calculations.student_effort_aggregate
          - "validations[priority=17]"
          - "errors[ERR_OVER_APPOINTMENT]"
          - entities.GraduateStudent.fields.effort_cap_pct
        distinguishing_aspect: |
          Appointment windows are closed-closed and inclusive on BOTH ends, so a successor starting on
          2026-11-30 - the exact last day of the incumbent - overlaps by one day and pushes aggregate
          effort to 100 against the 75 cap (ERR_OVER_APPOINTMENT), while an otherwise identical
          successor starting one day later on 2026-12-01 does not overlap and submits successfully at
          aggregate effort 50.
