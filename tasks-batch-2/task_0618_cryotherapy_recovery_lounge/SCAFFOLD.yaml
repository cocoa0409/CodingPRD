# =============================================================================
# Cryotherapy & Recovery Lounge — PRD Benchmark Scaffold (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: |
  Cryotherapy & Recovery Lounge (Restore Hyper Wellness style): service menu
  (whole-body cryo/red-light/compression/sauna), session booking &
  equipment/room, membership & credit packs, waiver & contraindication
  screening, intro offer & upgrade, multi-location, recurring billing & freeze,
  technician schedule

domain_name: cryotherapy-recovery-lounge
api_prefix: /

# =============================================================================
# Complexity Profile (§0.1–§0.4) — Expert band
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  # Location is a tree root for Room/Technician/TechnicianShift; Member is a
  # second root for Waiver/Subscription/CreditPack/Booking; Booking and
  # Subscription carry cross-aggregate FKs into the Location tree and into the
  # ServiceType/MembershipPlan configuration entities.

  state_machine_shape: cyclic
  # Subscription is cyclic (ACTIVE -> FROZEN -> ACTIVE freeze loop). Booking is
  # branching (BOOKED -> {COMPLETED, NO_SHOW, CANCELLED}). CreditPack has a
  # forward refund/expiry shape. Waiver is linear with a revoke revert.

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: peer_roles
  # Member (entity_backed) books and manages own subscription/packs; Technician
  # (entity_backed) completes/no-shows sessions on own shift; LocationManager
  # and PlatformAdmin (opaque) run config, billing, and operational endpoints.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  # ---------------------------------------------------------------------------
  - name: Location
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Lounge location display name" }
      - { name: state_code, type: string, source: input, description: "US state code, e.g. CA, TX (used to gate waiver/intro rules)" }
      - { name: timezone, type: string, source: input, description: "IANA timezone label, informational only; all clock logic is UTC" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: "OPEN", constraints: "OPEN, CLOSED" }
      - { name: open_booking_count, type: integer, source: computed, description: "Count of Bookings at this location whose status IN {BOOKED}" }

  # ---------------------------------------------------------------------------
  - name: ServiceType
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: code, type: enum, source: input, description: "WHOLE_BODY_CRYO | RED_LIGHT | COMPRESSION | INFRARED_SAUNA", constraints: "WHOLE_BODY_CRYO, RED_LIGHT, COMPRESSION, INFRARED_SAUNA; unique" }
      - { name: name, type: string, source: input, description: "Service display name" }
      - { name: duration_minutes, type: integer, source: input, description: "Session length in minutes", constraints: ">= 5" }
      - { name: buffer_minutes, type: integer, source: input, description: "Cleaning/turnover buffer added after the session before the room frees", constraints: ">= 0" }
      - { name: credit_cost, type: integer, source: input, description: "Number of service credits a single session of this service consumes", constraints: ">= 1" }
      - { name: requires_medical_clearance, type: boolean, source: input, description: "If true, a contraindication flag blocks booking entirely (e.g. WHOLE_BODY_CRYO)", default: false }
      - { name: active, type: boolean, source: input, description: "If false the service is hidden from the menu and cannot be booked", default: true }

  # ---------------------------------------------------------------------------
  - name: Room
    parent: Location
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: location_id, type: string, source: system, description: "FK -> Location.id; owning location" }
      - { name: service_type_id, type: string, source: input, description: "FK -> ServiceType.id; the single service this room/equipment delivers" }
      - { name: name, type: string, source: input, description: "Room/equipment label, e.g. 'Cryo Chamber 1'" }
      - { name: status, type: enum, source: system, description: "AVAILABLE (rooms are always created AVAILABLE in v1)", default: "AVAILABLE", constraints: "AVAILABLE" }

  # ---------------------------------------------------------------------------
  - name: Technician
    parent: Location
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Technician" }
      - { name: location_id, type: string, source: system, description: "FK -> Location.id; home location" }
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: status, type: enum, source: system, description: "ACTIVE (technicians are always created ACTIVE in v1)", default: "ACTIVE", constraints: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: TechnicianShift
    parent: Technician
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: technician_id, type: string, source: system, description: "FK -> Technician.id; owning technician" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; location the technician is rostered at for this shift" }
      - { name: starts_at, type: datetime, source: input, description: "Shift start, ISO 8601 UTC (inclusive bound)" }
      - { name: ends_at, type: datetime, source: input, description: "Shift end, ISO 8601 UTC (exclusive bound)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED", default: "SCHEDULED", constraints: "SCHEDULED, CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: MembershipPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: tier, type: enum, source: input, description: "BASE | PLUS | ELITE", constraints: "BASE, PLUS, ELITE; unique" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Recurring monthly fee in cents", constraints: ">= 0" }
      - { name: monthly_credit_grant, type: integer, source: input, description: "Service credits granted at the start of each billing cycle" }
      - { name: rollover_cap, type: integer, source: input, description: "Max unused granted credits that carry to the next cycle (0 = no rollover)", default: 0 }
      - { name: late_cancel_fee_waived, type: boolean, source: input, description: "If true, late-cancel and no-show fees are 0 for this tier (ELITE perk)", default: false }
      - { name: active, type: boolean, source: input, description: "If false the plan cannot be subscribed to", default: true }

  # ---------------------------------------------------------------------------
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Member" }
      - { name: home_location_id, type: string, source: input, description: "FK -> Location.id; member's default location" }
      - { name: email, type: string, source: input, description: "Login email", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Member name" }
      - { name: state_code, type: string, source: input, description: "Member residence US state code" }
      - { name: contraindication_flag, type: boolean, source: system, description: "True when the active Waiver screening reported a disqualifying contraindication; blocks medical-clearance services", default: false }
      - { name: intro_offer_used, type: boolean, source: system, description: "True once this member has purchased the one-time intro credit pack", default: false }
      - { name: credit_balance, type: integer, source: computed, description: "Sum of remaining_credits across this member's CreditPacks whose status=ACTIVE, plus the current Subscription's granted_credits_remaining; never negative" }
      - { name: status, type: enum, source: system, description: "ACTIVE (members are always created ACTIVE in v1)", default: "ACTIVE", constraints: "ACTIVE" }

  # ---------------------------------------------------------------------------
  - name: Waiver
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: screening_answers, type: object, source: input, description: "Map of contraindication question code -> boolean answer" }
      - { name: has_contraindication, type: boolean, source: input, description: "Client-attested screening result; true means a disqualifying condition was reported" }
      - { name: signed_at, type: datetime, source: system, description: "Logical-clock timestamp when the waiver was signed" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REVOKED | SUPERSEDED", default: "ACTIVE", constraints: "ACTIVE, REVOKED, SUPERSEDED" }

  # ---------------------------------------------------------------------------
  - name: Subscription
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: plan_id, type: string, source: input, description: "FK -> MembershipPlan.id; current plan" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN | CANCELLED", default: "ACTIVE", constraints: "ACTIVE, FROZEN, CANCELLED" }
      - { name: cycle_anchor_at, type: datetime, source: system, description: "Logical-clock timestamp of the current cycle start; cycle length is BILLING_CYCLE_DAYS=30" }
      - { name: current_cycle_end_at, type: datetime, source: computed, description: "cycle_anchor_at + 30 days (exclusive); the next bill date when ACTIVE" }
      - { name: granted_credits_remaining, type: integer, source: computed, description: "Granted credits left in the current cycle; replenished to plan.monthly_credit_grant (plus capped rollover) at each cycle bill; never negative" }
      - { name: freeze_cycles_remaining, type: integer, source: system, description: "How many upcoming cycles remain frozen; 0 when ACTIVE", default: 0 }
      - { name: lifetime_paid_cents, type: integer, source: computed, description: "Sum of amount_cents across this subscription's Invoices whose status=PAID" }

  # ---------------------------------------------------------------------------
  - name: CreditPack
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; owning member" }
      - { name: is_intro, type: boolean, source: input, description: "True if this is the one-time discounted intro pack" }
      - { name: total_credits, type: integer, source: input, description: "Credits purchased in this pack", constraints: ">= 1" }
      - { name: remaining_credits, type: integer, source: computed, description: "Credits not yet consumed; decremented by bookings; never negative" }
      - { name: price_paid_cents, type: integer, source: computed, description: "Final price charged for the pack after intro discount and platform fee" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | REFUNDED | EXPIRED", default: "ACTIVE", constraints: "ACTIVE, DEPLETED, REFUNDED, EXPIRED" }
      - { name: expires_at, type: datetime, source: system, description: "Logical-clock timestamp when remaining credits expire (purchase + PACK_VALIDITY_DAYS=180)" }

  # ---------------------------------------------------------------------------
  - name: Booking
    parent: Member
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; the booking member" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; where the session occurs" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; the booked room/equipment" }
      - { name: service_type_id, type: string, source: system, description: "FK -> ServiceType.id; copied from the room's service at booking time" }
      - { name: starts_at, type: datetime, source: input, description: "Session start, ISO 8601 UTC (inclusive bound)" }
      - { name: occupies_until_at, type: datetime, source: computed, description: "starts_at + service.duration_minutes + service.buffer_minutes (exclusive); the room is occupied on the half-open interval [starts_at, occupies_until_at)" }
      - { name: credits_charged, type: integer, source: computed, description: "Credits debited for this booking = service.credit_cost; refunded on eligible cancel" }
      - { name: credit_source, type: enum, source: computed, description: "SUBSCRIPTION | PACK | SPLIT; which wallet the credits came from", constraints: "SUBSCRIPTION, PACK, SPLIT" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "Late-cancel or no-show fee assessed in cents; 0 when none", default: 0 }
      - { name: status, type: enum, source: system, description: "BOOKED | COMPLETED | NO_SHOW | CANCELLED", default: "BOOKED", constraints: "BOOKED, COMPLETED, NO_SHOW, CANCELLED" }

  # ---------------------------------------------------------------------------
  - name: Invoice
    parent: Subscription
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "Logical-clock timestamp the invoice was issued" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; owning subscription" }
      - { name: kind, type: enum, source: system, description: "SIGNUP | RENEWAL | UPGRADE_PRORATION | FREEZE_FEE", constraints: "SIGNUP, RENEWAL, UPGRADE_PRORATION, FREEZE_FEE" }
      - { name: amount_cents, type: integer, source: computed, description: "Charged amount in cents" }
      - { name: status, type: enum, source: system, description: "PAID (all invoices are paid at issue in v1; append-only)", default: "PAID", constraints: "PAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Location
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /locations/{location_id}/close"
        actor: "PlatformAdmin or LocationManager"
        preconditions:
          - "Location.status == OPEN"
        side_effects:
          - "Location.status -> CLOSED (booking create and room create at this location are rejected with ERR_LOCATION_CLOSED while CLOSED)"
      - from: CLOSED
        to: OPEN
        trigger: "POST /locations/{location_id}/open"
        actor: "PlatformAdmin or LocationManager"
        preconditions:
          - "Location.status == CLOSED"
        side_effects:
          - "Location.status -> OPEN"

  # ---------------------------------------------------------------------------
  - entity: Waiver
    field: status
    initial_state: ACTIVE
    terminal_states: [REVOKED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /members/{member_id}/waivers (a newer waiver is signed)"
        actor: Member
        preconditions:
          - "A prior Waiver for this member is in status=ACTIVE"
        side_effects:
          - "Prior ACTIVE waiver -> SUPERSEDED"
          - "New waiver becomes the member's single ACTIVE waiver"
          - "Recompute Member.contraindication_flag from the new ACTIVE waiver's has_contraindication"
        note: "Signing a fresh waiver supersedes the old one in the same request."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /members/{member_id}/waivers/{waiver_id}/revoke"
        actor: LocationManager
        preconditions:
          - "Waiver is the member's ACTIVE waiver"
        side_effects:
          - "Member.contraindication_flag -> true (no ACTIVE waiver on file means screening is presumed failed)"
          - "Any future-dated BOOKED bookings for medical-clearance services are NOT auto-cancelled here (booking gate re-checks at create time only)"

  # ---------------------------------------------------------------------------
  - entity: Subscription
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /subscriptions/{subscription_id}/freeze"
        actor: Member
        preconditions:
          - "Subscription.status == ACTIVE"
          - "freeze_cycles in [1, MAX_FREEZE_CYCLES=3]"
          - "Member has no Booking in status=BOOKED with starts_at within the frozen window"
        side_effects:
          - "Subscription.status -> FROZEN"
          - "freeze_cycles_remaining = freeze_cycles"
          - "granted_credits_remaining -> 0 (frozen cycles grant no credits)"
          - "Recompute Member.credit_balance"
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /subscriptions/{subscription_id}/unfreeze OR system at run_billing when freeze_cycles_remaining reaches 0"
        actor: "Member or system"
        preconditions:
          - "Subscription.status == FROZEN"
        side_effects:
          - "Subscription.status -> ACTIVE"
          - "freeze_cycles_remaining -> 0"
          - "cycle_anchor_at -> current clock; current_cycle_end_at recomputed"
          - "granted_credits_remaining -> plan.monthly_credit_grant"
          - "Recompute Member.credit_balance"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system POST /_billing/run (a 30-day cycle has elapsed for an ACTIVE subscription)"
        actor: system
        preconditions:
          - "clock >= current_cycle_end_at"
          - "Subscription.status == ACTIVE"
        side_effects:
          - "Append Invoice{kind=RENEWAL, amount_cents=plan.monthly_fee_cents, status=PAID}"
          - "cycle_anchor_at -> previous current_cycle_end_at; current_cycle_end_at recomputed"
          - "granted_credits_remaining -> plan.monthly_credit_grant + min(rollover_cap, prior granted_credits_remaining)"
          - "Recompute Member.credit_balance and Subscription.lifetime_paid_cents"
        note: "Cyclic self-transition: ACTIVE renews to ACTIVE each cycle."
      - from: FROZEN
        to: FROZEN
        trigger: "system POST /_billing/run (a frozen cycle elapsed)"
        actor: system
        preconditions:
          - "clock >= current_cycle_end_at"
          - "Subscription.status == FROZEN"
          - "freeze_cycles_remaining > 1"
        side_effects:
          - "Append Invoice{kind=FREEZE_FEE, amount_cents=FREEZE_FEE_CENTS=1000, status=PAID}"
          - "cycle_anchor_at advances one cycle; current_cycle_end_at recomputed"
          - "freeze_cycles_remaining -= 1"
          - "Recompute Subscription.lifetime_paid_cents"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{subscription_id}/cancel"
        actor: Member
        preconditions:
          - "Subscription.status == ACTIVE"
        side_effects:
          - "Subscription.status -> CANCELLED"
          - "granted_credits_remaining -> 0"
          - "Recompute Member.credit_balance"
      - from: FROZEN
        to: CANCELLED
        trigger: "POST /subscriptions/{subscription_id}/cancel"
        actor: Member
        preconditions:
          - "Subscription.status == FROZEN"
        side_effects:
          - "Subscription.status -> CANCELLED"
          - "freeze_cycles_remaining -> 0"
          - "Recompute Member.credit_balance"

  # ---------------------------------------------------------------------------
  - entity: CreditPack
    field: status
    initial_state: ACTIVE
    terminal_states: [DEPLETED, REFUNDED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (a Booking consumes the last remaining credit of this pack)"
        actor: system
        preconditions:
          - "remaining_credits reaches 0 after a booking debit"
        side_effects:
          - "CreditPack.status -> DEPLETED"
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /members/{member_id}/credit-packs/{pack_id}/refund"
        actor: LocationManager
        preconditions:
          - "CreditPack.status == ACTIVE"
          - "remaining_credits > 0"
        side_effects:
          - "Compute refund_amount_cents per credit_pack_refund calculation"
          - "remaining_credits -> 0"
          - "CreditPack.status -> REFUNDED"
          - "Recompute Member.credit_balance"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system POST /_billing/run (clock >= expires_at)"
        actor: system
        preconditions:
          - "CreditPack.status == ACTIVE"
          - "clock >= expires_at"
        side_effects:
          - "remaining_credits -> 0"
          - "CreditPack.status -> EXPIRED"
          - "Recompute Member.credit_balance"

  # ---------------------------------------------------------------------------
  - entity: Booking
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /bookings/{booking_id}/complete"
        actor: Technician
        preconditions:
          - "Booking.status == BOOKED"
          - "Acting Technician has a SCHEDULED TechnicianShift at booking.location_id covering booking.starts_at"
          - "clock >= booking.starts_at"
        side_effects:
          - "Booking.status -> COMPLETED"
          - "Location.open_booking_count decremented"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /bookings/{booking_id}/no-show"
        actor: Technician
        preconditions:
          - "Booking.status == BOOKED"
          - "clock >= booking.starts_at"
        side_effects:
          - "Booking.status -> NO_SHOW"
          - "Compute fee_charged_cents per cancellation_fee calculation in NO_SHOW mode"
          - "Consumed credits are NOT refunded (no-show forfeits the session credits)"
          - "Location.open_booking_count decremented"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/cancel"
        actor: Member
        preconditions:
          - "Booking.status == BOOKED"
          - "clock < booking.starts_at"
        side_effects:
          - "Booking.status -> CANCELLED"
          - "Compute fee_charged_cents per cancellation_fee calculation in CANCEL mode (0 when notice >= FREE_CANCEL_MINUTES)"
          - "Refund credits_charged back to their original source: add to Subscription.granted_credits_remaining first up to what was taken from it, remainder to the originating CreditPack (status REFUNDED/DEPLETED/EXPIRED packs are skipped and that portion is forfeited)"
          - "Recompute Member.credit_balance"
          - "Location.open_booking_count decremented"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-room
    parent_entity: Room
    write_endpoint: "POST /bookings"
    occ_field: "expected_room_version"
    description: |
      Creating a Booking against a Room whose version has advanced since the
      client last observed it is rejected with a stale-version error. A booking
      create bumps the room's version (the room's occupied intervals are part of
      its booking surface); a second create that still carries the previously
      observed room version is therefore stale and rejected, which is the
      sanctioned way to serialize two legitimately-overlapping booking attempts
      on the same room without depending on request timing.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: subscription-upgrade-stale
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{subscription_id}/upgrade"
    occ_field: "expected_subscription_version"
    description: |
      Upgrading a Subscription whose version has advanced since the client last
      observed it is rejected with a stale-version error. A renewal at
      run_billing, a freeze, or a prior upgrade all bump the subscription
      version and re-anchor the cycle used by proration; an upgrade carrying a
      stale subscription version would prorate against an outdated cycle anchor
      and is therefore rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- DUAL-VARIANT instance 1 (entity domain: Subscription) ---
  - name: subscription_cancellation_refund
    trigger: "GET /subscriptions/{subscription_id}/refund-quote and POST /subscriptions/{subscription_id}/cancel preview"
    algorithm: forward_looking
    formula: |
      cycle_days = BILLING_CYCLE_DAYS (30)
      elapsed_days = floor((clock - cycle_anchor_at) / 1 day)   # whole days since cycle start
      remaining_days = cycle_days - elapsed_days
      # The endpoint returns BOTH variants; the variant that becomes the actual
      # credited refund is pinned per `variants` below.
    input_set: "The single ACTIVE/FROZEN Subscription for the member; uses the current cycle only."
    constants:
      BILLING_CYCLE_DAYS: 30
    precision: "integer cents, round_half_up at the single pinned rounding step of each variant"
    variants:
      - name: PROVISIONAL_REMAINING
        when: "Quote/preview surface and any partial-refund display"
        difference: "refund = round_half_up(plan.monthly_fee_cents * remaining_days / cycle_days) — one rounding over the remaining fraction"
      - name: FINAL_DAILY_FLOOR
        when: "The amount actually credited on cancel commit"
        difference: "daily_rate = floor(plan.monthly_fee_cents / cycle_days); refund = plan.monthly_fee_cents - daily_rate * elapsed_days — charges whole used days at a floored daily rate, diverges from PROVISIONAL by the rounding residue"

  # --- DUAL-VARIANT instance 2 (entity domain: CreditPack — different subject) ---
  - name: credit_pack_refund
    trigger: "POST /members/{member_id}/credit-packs/{pack_id}/refund (ACTIVE->REFUNDED side effect)"
    algorithm: aggregation
    formula: |
      per_credit_avg = round_half_up(price_paid_cents / total_credits)
    input_set: "The single CreditPack being refunded; remaining_credits > 0."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: AVERAGE_PRICE_UNUSED
        when: "Default refund policy for non-intro packs"
        difference: "refund = per_credit_avg * remaining_credits — refund unused credits at the average price"
      - name: TOTAL_MINUS_CONSUMED
        when: "Intro packs (is_intro=true): the discount is forfeited on refund"
        difference: "refund = price_paid_cents - per_credit_avg * (total_credits - remaining_credits) — total paid minus consumed-at-average; differs from AVERAGE_PRICE_UNUSED by the rounding residue times the discount"

  # --- COMBINATORIAL instance 1 — mode (a): >=3 inputs, nested min/max + tiered branch ---
  - name: cancellation_fee
    trigger: "Booking BOOKED->CANCELLED (CANCEL mode) and BOOKED->NO_SHOW (NO_SHOW mode)"
    algorithm: threshold
    formula: |
      notice_minutes = floor((booking.starts_at - clock) / 1 minute)   # >= 0 in CANCEL mode; in NO_SHOW mode treat as 0
      if member's ACTIVE plan tier has late_cancel_fee_waived == true: fee = 0
      elif mode == CANCEL and notice_minutes >= FREE_CANCEL_MINUTES: fee = 0
      else:
        hours_short = ceil((FREE_CANCEL_MINUTES - notice_minutes) / 60)   # NO_SHOW: notice_minutes=0 -> 4
        fee = min(FEE_CAP_CENTS, BASE_FEE_CENTS + LATE_RATE_PER_HOUR_CENTS * hours_short)
    input_set: "Single booking, its member's active subscription tier, and the clock."
    constants:
      FREE_CANCEL_MINUTES: 240
      BASE_FEE_CENTS: 2000
      LATE_RATE_PER_HOUR_CENTS: 1500
      FEE_CAP_CENTS: 5000
    precision: "integer cents; ceil on hours_short, then min-cap"

  # --- COMBINATORIAL instance 2 — mode (b): nested rounding where order is pinned ---
  - name: credit_pack_price
    trigger: "POST /members/{member_id}/credit-packs (price_paid_cents computed at purchase)"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED: round per-credit discounted price FIRST,
      # then sum across credits, then apply the platform fee, then round once.
      discount_pct = INTRO_DISCOUNT_PCT if is_intro else 0
      per_credit = round_half_up(LIST_PRICE_PER_CREDIT_CENTS * (1 - discount_pct))   # round per line item
      subtotal = per_credit * total_credits                                          # then sum
      price_paid_cents = round_half_up(subtotal * (1 + PLATFORM_FEE_PCT))            # then fee, round once
      # "sum-then-round" (subtotal = round(LIST*(1-disc)*total_credits)) is the
      # WRONG order and is explicitly forbidden; it diverges by the rounding residue.
    input_set: "The CreditPack being purchased: total_credits and is_intro."
    constants:
      LIST_PRICE_PER_CREDIT_CENTS: 2195
      INTRO_DISCOUNT_PCT: 0.30
      PLATFORM_FEE_PCT: 0.08
    precision: "integer cents, round_half_up, applied per-credit then once at the end"

  # --- COMBINATORIAL instance 3 — mode (c): pinned evaluation order (circular-looking) ---
  - name: subscription_upgrade_charge
    trigger: "POST /subscriptions/{subscription_id}/upgrade (UPGRADE_PRORATION Invoice)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order MUST be: (1) resolve elapsed/remaining days from the
      # CURRENT cycle anchor BEFORE re-anchoring; (2) compute the fee delta;
      # (3) prorate; (4) THEN re-anchor the cycle. Re-anchoring first would zero
      # remaining_days and make the proration 0 — the order is load-bearing.
      cycle_days = BILLING_CYCLE_DAYS (30)
      elapsed_days = floor((clock - cycle_anchor_at) / 1 day)
      remaining_days = cycle_days - elapsed_days
      fee_delta = new_plan.monthly_fee_cents - old_plan.monthly_fee_cents     # must be > 0 (upgrade only)
      proration_cents = round_half_up(fee_delta * remaining_days / cycle_days)
    input_set: "The member's ACTIVE Subscription, its current plan, and the target plan."
    constants:
      BILLING_CYCLE_DAYS: 30
    precision: "integer cents, round_half_up at the single proration step"

  # --- AGGREGATION: credit waterfall debit on booking ---
  - name: booking_credit_debit
    trigger: "POST /bookings (credits_charged + credit_source)"
    algorithm: waterfall_allocation
    formula: |
      cost = service.credit_cost
      # Bucket order is PINNED: subscription granted credits first, then the
      # member's ACTIVE CreditPacks ordered by expires_at ASC, then created_at ASC
      # as the tie-break. No id is ever used for ordering.
      take_sub = min(cost, subscription.granted_credits_remaining if subscription.status==ACTIVE else 0)
      remaining = cost - take_sub
      for pack in member ACTIVE CreditPacks sorted by (expires_at ASC, created_at ASC):
          take = min(remaining, pack.remaining_credits)
          pack.remaining_credits -= take
          remaining -= take
          if remaining == 0: break
      if remaining > 0: reject ERR_INSUFFICIENT_CREDITS (no debit applied)
      credit_source = SUBSCRIPTION if take_sub==cost else (PACK if take_sub==0 else SPLIT)
    input_set: "Member's ACTIVE Subscription granted credits and ACTIVE CreditPacks at booking time."
    constants: {}
    precision: "integer credits; no rounding"

  # --- AGGREGATION/derived: member credit balance reconciliation ---
  - name: member_credit_balance
    trigger: "Any change to a Subscription's granted_credits_remaining or a CreditPack's remaining_credits/status"
    algorithm: aggregation
    formula: |
      credit_balance = (subscription.granted_credits_remaining if subscription and subscription.status in {ACTIVE, FROZEN} else 0)
                       + sum(pack.remaining_credits for pack in member CreditPacks where pack.status == ACTIVE)
      # never negative
    input_set: "Member's Subscription plus all ACTIVE CreditPacks."
    constants: {}
    precision: "integer credits"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; entity_backed roles acting on a member/technician resource must own it (X-User-ID == resource owner id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right (location/member/room/booking/subscription/pack)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Every FK in the request body references an existing resource (plan_id, room_id, service_type_id, home_location_id, location_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints carrying FK body fields"

  - priority: 5
    category: business_constraint
    check: "Pagination bounds: limit in [1,100], offset >= 0"
    error_id: ERR_VALIDATION_PAGINATION
    http_status: 400
    applies_to: "all list (GET collection) endpoints"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, integers within declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 7
    category: business_constraint
    check: "freeze_cycles is an integer in [1, MAX_FREEZE_CYCLES=3]"
    error_id: ERR_FREEZE_CYCLES_INVALID
    http_status: 400
    applies_to: "POST /subscriptions/{subscription_id}/freeze"

  - priority: 8
    category: state
    check: "Optimistic-concurrency: expected_<parent>_version matches the parent's current version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bookings, POST /subscriptions/{subscription_id}/upgrade"

  - priority: 9
    category: state
    check: "Target resource is in a valid state for the requested transition (see §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 10
    category: state
    check: "Location must be OPEN to create a room or accept a booking at it"
    error_id: ERR_LOCATION_CLOSED
    http_status: 409
    applies_to: "POST /locations/{location_id}/rooms, POST /bookings"

  - priority: 11
    category: business_constraint
    check: "Single subscription: a member may not start a new subscription while a non-CANCELLED subscription exists"
    error_id: ERR_DUPLICATE_SUBSCRIPTION
    http_status: 409
    applies_to: "POST /members/{member_id}/subscription"

  - priority: 12
    category: business_constraint
    check: "The booked room's ServiceType.active must be true"
    error_id: ERR_SERVICE_INACTIVE
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 13
    category: business_safety
    check: "Waiver/contraindication gate: booking a service with requires_medical_clearance=true is blocked when Member.contraindication_flag==true"
    error_id: ERR_CONTRAINDICATION_BLOCK
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 14
    category: business_safety
    check: "No-waiver gate: booking ANY service requires the member to have an ACTIVE Waiver on file"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /bookings"

  - priority: 15
    category: business_temporal
    check: "Room temporal overlap: the requested booking's half-open interval [starts_at, starts_at+duration+buffer) must not intersect any BOOKED booking's interval on the same room"
    error_id: ERR_ROOM_UNAVAILABLE
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 16
    category: business_temporal
    check: "Technician shift overlap: a new TechnicianShift's half-open interval [starts_at, ends_at) must not intersect any SCHEDULED shift of the same technician (zero-buffer adjacency permitted)"
    error_id: ERR_SHIFT_OVERLAP
    http_status: 409
    applies_to: "POST /technicians/{technician_id}/shifts"

  - priority: 17
    category: business_temporal
    check: "Staffing gate: a booking's [starts_at, occupies_until_at) must be fully covered by at least one SCHEDULED TechnicianShift at the booking's location"
    error_id: ERR_NO_TECHNICIAN_ON_DUTY
    http_status: 409
    applies_to: "POST /bookings"

  - priority: 18
    category: business_constraint
    check: "Intro-offer uniqueness: a member may purchase is_intro=true at most once (Member.intro_offer_used)"
    error_id: ERR_INTRO_ALREADY_USED
    http_status: 409
    applies_to: "POST /members/{member_id}/credit-packs"

  - priority: 19
    category: business_constraint
    check: "Upgrade direction: target plan monthly_fee_cents must be strictly greater than current plan's (upgrade only)"
    error_id: ERR_NOT_AN_UPGRADE
    http_status: 409
    applies_to: "POST /subscriptions/{subscription_id}/upgrade"

  - priority: 20
    category: business_fiscal
    check: "Sufficient credits: the booking_credit_debit waterfall must cover service.credit_cost across subscription + ACTIVE packs"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 422
    applies_to: "POST /bookings"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock & billing ops ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary UTC instant. Server startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["Logical clock advanced/reset to the provided instant"]

  - method: POST
    path: "/_billing/run"
    description: "Advance recurring billing: for every Subscription whose clock >= current_cycle_end_at, renew (ACTIVE), charge freeze fee or auto-unfreeze (FROZEN); expire CreditPacks past expires_at. Idempotent for a fixed clock."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ subscriptions_renewed: integer, subscriptions_unfrozen: integer, packs_expired: integer }"
    side_effects:
      - "Subscription ACTIVE->ACTIVE renewal invoices + credit grant + rollover"
      - "Subscription FROZEN freeze-fee invoices and FROZEN->ACTIVE auto-unfreeze when freeze_cycles_remaining hits 0"
      - "CreditPack ACTIVE->EXPIRED past expires_at; Member.credit_balance recomputed"

  # ---- Locations ----
  - method: POST
    path: "/locations"
    description: "Create a lounge location"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, timezone]
    output: Location
    side_effects: ["status=OPEN, open_booking_count=0"]

  - method: GET
    path: "/locations"
    description: "List locations (paginated)"
    roles: [PlatformAdmin, LocationManager, Member, Technician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Location[]
    side_effects: []

  - method: GET
    path: "/locations/{location_id}"
    description: "Get a location"
    roles: [PlatformAdmin, LocationManager, Member, Technician]
    code: 200
    input: []
    output: Location
    side_effects: []

  - method: POST
    path: "/locations/{location_id}/close"
    description: "Close a location (no new rooms or bookings accepted while CLOSED)"
