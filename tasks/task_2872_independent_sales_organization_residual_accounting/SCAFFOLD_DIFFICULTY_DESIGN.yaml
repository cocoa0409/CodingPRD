              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-5002", monthly_minimum_cents: 2500, per_transaction_fee_cents: 20, equipment_lease_monthly_cents: 0, boarded_on: "2026-01-05" }
              as: IsoAdmin
              captures: { m2: $.data.id }
            - call: "POST /merchants/${m2}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:aaa1" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 1240, sales_volume_cents: 4812355, interchange_cents: 92140, assessments_cents: 6255, gross_income_cents: 168430 }
              as: ResidualAnalyst
              captures: { l1: $.data.id }
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
          trigger:
            - call: "POST /residual-batches/${b1}/recall"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m2}", transaction_count: 125, sales_volume_cents: 100000, interchange_cents: 1800, assessments_cents: 130, gross_income_cents: 3200 }
              as: ResidualAnalyst
              captures: { l2: $.data.id }
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
          assert:
            - "immediately after the recall call: ResidualBatch.${b1}.state == RECEIVED, recall_count == 1, total_normalized_net_revenue_cents == 0, line_count == 1, gross_volume_cents == 4812355"
            - "immediately after the recall call: ResidualLine.${l1}.normalized_net_revenue_cents == 0, processor_cost_cents == 0 and normalization_mode_applied == null"
            - "after the second normalize: ResidualBatch.${b1}.state == NORMALIZED and recall_count == 1   # re-normalizing does not bump recall_count"
            - "after the second normalize: ResidualLine.${l1}.normalized_net_revenue_cents == 40939 and ResidualLine.${l2}.normalized_net_revenue_cents == 70"
            - "ResidualBatch.${b1}.line_count == 2 and ResidualBatch.${b1}.gross_volume_cents == 4912355"
            - "ResidualBatch.${b1}.total_normalized_net_revenue_cents == 41009"

      - name: statement_parallel_dimensions_hold_finalize_then_settle
        grounds:
          - state_machines.AgentStatement (shape parallel)
          - state_machines.AgentStatement.settlement_UNSETTLED_to_HELD
          - state_machines.AgentStatement.lifecycle_ISSUED_to_FINALIZED
          - state_machines.AgentStatement.settlement_HELD_to_UNSETTLED
          - state_machines.AgentStatement.settlement_UNSETTLED_to_SETTLED
        distinguishing_aspect: |
          The two dimensions of one row are driven out of phase: hold is applied while
          lifecycle_state == ISSUED, then finalize succeeds even though settlement_state
          is HELD (a linear reading of the machine would refuse it), producing the
