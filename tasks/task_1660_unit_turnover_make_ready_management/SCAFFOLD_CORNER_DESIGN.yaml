      - name: property_manager_cannot_create_property
        claim_type: rbac_denial
        grounds: [roles, endpoints]
        distinguishing_aspect: "Property creation is RegionalManager-exclusive in the approval chain: PropertyManager → 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
