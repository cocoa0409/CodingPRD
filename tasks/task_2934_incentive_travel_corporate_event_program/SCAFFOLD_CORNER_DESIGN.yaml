        the same one.
      - GET /qualifiers/${qb_id} after the redraft shows tax_status back at "PENDING_REPORT", and GET
        /programs/${p_id} still shows reported_award_total_cents 0 because the replacement is only a DRAFT.
- section: validations
  instances:
  - name: uniqueness_violations_on_employee_code_tier_key_and_milestone_sequence
    claim_type: violation_to_error
    grounds:
    - §1.4 priority 22 (ERR_DUPLICATE_EMPLOYEE_CODE, ERR_DUPLICATE_TIER_KEY, ERR_DUPLICATE_MILESTONE_SEQUENCE)
    - §1.6 the five 409 duplicate errors
    - §1.5 POST /qualifiers, POST /award-tiers, POST /deposit-milestones
    distinguishing_aspect: |
      Priority 22 packs five independent uniqueness keys into one rule, and three of them are
      scoped to a parent rather than global. This instance triggers those three and, crucially,
      proves the scoping by making the SAME employee_code and the SAME tier_code succeed on a
      second program in the same database — a global unique index would fail that half. It also
      splits the composite tier key: tier_code alone and tier_rank alone each collide.
      The remaining two keys need REGISTRATION_OPEN / ONSITE and are handled by the second
      violation_to_error instance in this section, because POST /qualifiers is gated to
      {DESIGN, SOURCING, CONTRACTED} and would return ERR_PROGRAM_STATE_INVALID from ONSITE.
    test_recipe:
      setup: Empty database. The canonical program sits at CONTRACTED with the PLATINUM/GOLD ladder, employee
        codes S-1001 and S-2001 taken, and an EXECUTED hotel contract whose deposit schedule already occupies
        sequences 1, 2 and 3. A second, freshly created program (FY27 Chairmans Club) sits at DESIGN with
        no tiers and no qualifiers.
      setup_api_calls:
      - call: POST /programs
        payload:
          name: FY26 Presidents Circle
          fiscal_year: 2026
          qualification_metric: NET_REVENUE_CENTS
          sales_period_start: '2026-01-01T00:00:00Z'
          sales_period_end: '2026-06-30T00:00:00Z'
          budget_total_cents: 5000000
        as: ProgramDirector
        as_user_id: pd-01
        captures:
          p_id: $.data.id
      - call: POST /award-tiers
