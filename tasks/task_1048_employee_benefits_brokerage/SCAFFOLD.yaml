# =============================================================================
# Employee-Benefits Brokerage & Consulting — Scaffold (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: |
  1048. Employee-Benefits Brokerage & Consulting: client & census, plan marketing &
  carrier quote, renewal & rate negotiation, open-enrollment & benefits-admin setup,
  compliance (ACA/5500/ERISA), commission/fee & bonus, wellness/stop-loss, reporting

domain_name: employee-benefits-brokerage
api_prefix: ""

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # flat: peer entities linked by foreign keys; Client is the hub but children are
  # top-level collections addressed by their own id, not nested under /clients/{id}.
  state_machine_shape: cyclic
  # Renewal negotiation loops NEGOTIATING->NEGOTIATING; Election forks SELECTED->{CONFIRMED,WAIVED}.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  # ComplianceFiling: the officer who prepares a filing may not be the one who certifies it.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: ein, type: string, source: input, description: "Employer identification number, 9 digits", constraints: "unique across Clients" }
      - { name: industry, type: enum, source: input, description: "RETAIL | MANUFACTURING | TECH | HEALTHCARE | OTHER" }
      - { name: fiscal_year_end_month, type: integer, source: input, description: "Month 1-12 the plan/fiscal year ends", constraints: "1..12" }
      - { name: full_time_equivalent_count, type: integer, source: computed, description: "Count of CensusMember with status=ACTIVE AND employment_type=FULL_TIME for this Client" }
      - { name: employee_count, type: integer, source: computed, description: "Count of CensusMember with status=ACTIVE for this Client" }
      - { name: is_ale, type: boolean, source: computed, description: "Applicable Large Employer: full_time_equivalent_count >= ALE_THRESHOLD (50)" }
      - { name: enrolled_headcount, type: integer, source: computed, description: "Count of Election with status=CONFIRMED across this Client's EnrollmentWindows (conserved quantity: enrolled_headcount invariant)" }
      - { name: active_premium_total_cents, type: integer, source: computed, description: "Sum of monthly_premium_cents over this Client's Policy rows with lifecycle_status=ACTIVE (conserved quantity: premium ledger invariant)" }
      - { name: ytd_commission_cents, type: integer, source: computed, description: "Sum of finalized_commission_cents over this Client's Policy rows with commission_status=FINALIZED" }

  - name: CensusMember
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the employer this member belongs to" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: birth_date, type: datetime, source: input, description: "Date of birth (ISO 8601 date)" }
      - { name: annual_salary_cents, type: integer, source: input, description: "Annual salary in cents (drives rate-of-pay affordability)" }
      - { name: monthly_contribution_cents, type: integer, source: input, description: "Member's required monthly contribution for the lowest-cost self-only plan" }
      - { name: employment_type, type: enum, source: input, description: "FULL_TIME | PART_TIME" }
      - { name: affordable_rate_of_pay, type: boolean, source: computed, description: "monthly_contribution_cents <= round(AFFORDABILITY_PCT * annual_salary_cents/12)" }
      - { name: affordable_fpl, type: boolean, source: computed, description: "monthly_contribution_cents <= round(AFFORDABILITY_PCT * FPL_ANNUAL_CENTS/12)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> TERMINATED", default: "ACTIVE" }

  - name: MarketingCampaign
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; employer being marketed" }
      - { name: coverage_line, type: enum, source: input, description: "MEDICAL | DENTAL | VISION | LIFE" }
      - { name: target_effective_date, type: datetime, source: input, description: "Intended coverage effective date" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OPEN -> CLOSED", default: "DRAFT" }

  - name: CarrierQuote
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> MarketingCampaign.id; the marketing effort this quote answers" }
      - { name: carrier_name, type: string, source: input, description: "Quoting carrier" }
      - { name: monthly_premium_cents, type: integer, source: input, description: "Quoted composite monthly premium in cents", constraints: ">= 1" }
      - { name: commission_rate_pct, type: number, source: input, description: "Carrier-offered commission rate as a fraction, e.g. 0.04", constraints: "0 <= x <= 1" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> SELECTED | DECLINED", default: "SUBMITTED" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; policy holder" }
      - { name: quote_id, type: string, source: input, description: "FK -> CarrierQuote.id; the SELECTED quote this policy binds" }
      - { name: coverage_line, type: enum, source: system, description: "Copied from the quote's MarketingCampaign.coverage_line" }
      - { name: carrier_name, type: string, source: system, description: "Copied from CarrierQuote.carrier_name" }
      - { name: effective_date, type: datetime, source: input, description: "Coverage start (inclusive)" }
      - { name: expiration_date, type: datetime, source: input, description: "Coverage end (inclusive); must be > effective_date" }
      - { name: original_premium_cents, type: integer, source: system, description: "monthly_premium_cents at bind time; anchors the renewal floor" }
      - { name: monthly_premium_cents, type: integer, source: system, description: "Current monthly premium; initialized from the quote, updated to agreed_premium_cents on renewal AGREED" }
      - { name: commission_rate_pct, type: number, source: system, description: "Copied from CarrierQuote.commission_rate_pct" }
      - { name: estimated_commission_cents, type: integer, source: computed, description: "Forward-looking annualized commission (see commission_estimation)" }
      - { name: finalized_commission_cents, type: integer, source: computed, description: "Chronological commission for months elapsed, set on finalize-commission (see commission_finalization); 0 until FINALIZED" }
      - { name: commission_status, type: enum, source: system, description: "PENDING -> FINALIZED", default: "PENDING" }
      - { name: renewal_status, type: enum, source: system, description: "NONE -> RENEWING -> RENEWED (driven by the Policy's Renewal)", default: "NONE" }
      - { name: lifecycle_status, type: enum, source: system, description: "BOUND -> ACTIVE -> TERMINATED", default: "BOUND" }

  - name: Renewal
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy being renewed" }
      - { name: initial_offer_premium_cents, type: integer, source: input, description: "Carrier's opening renewal premium", constraints: ">= 1" }
      - { name: current_offer_premium_cents, type: integer, source: system, description: "Premium currently on the table (last proposal)" }
      - { name: proposing_side, type: enum, source: system, description: "CARRIER | BROKER — which side made current_offer_premium_cents", default: "CARRIER" }
      - { name: round_count, type: integer, source: system, description: "Number of counters exchanged", default: 0 }
      - { name: agreed_premium_cents, type: integer, source: system, description: "Set to current_offer_premium_cents when AGREED; 0 otherwise" }
      - { name: status, type: enum, source: system, description: "OPEN -> NEGOTIATING -> AGREED | DECLINED", default: "OPEN" }

  - name: EnrollmentWindow
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; employer running open enrollment" }
      - { name: plan_year, type: integer, source: input, description: "Plan year, e.g. 2027" }
      - { name: opens_at, type: datetime, source: input, description: "Window opens (inclusive)" }
      - { name: closes_at, type: datetime, source: input, description: "Window closes (exclusive); must be > opens_at" }
      - { name: total_confirmed_cents, type: integer, source: computed, description: "Round-per-election-then-sum of confirmed election costs at finalize (see election_premium_rounding)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> OPEN -> FINALIZED", default: "SCHEDULED" }

  - name: Election
    parent: null
    common_fields: true
    fields:
      - { name: window_id, type: string, source: input, description: "FK -> EnrollmentWindow.id; the enrollment window" }
      - { name: census_member_id, type: string, source: input, description: "FK -> CensusMember.id; the electing member" }
      - { name: policy_id, type: string, source: input, description: "FK -> Policy.id; the policy elected" }
      - { name: coverage_tier, type: enum, source: input, description: "EMPLOYEE_ONLY | EMPLOYEE_SPOUSE | EMPLOYEE_CHILD | FAMILY" }
      - { name: monthly_cost_cents, type: integer, source: computed, description: "round(policy.monthly_premium_cents * TIER_FACTOR[coverage_tier]); computed on CONFIRM" }
      - { name: status, type: enum, source: system, description: "SELECTED -> CONFIRMED | WAIVED ; CONFIRMED -> WITHDRAWN", default: "SELECTED" }

  - name: ComplianceFiling
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; employer the filing is for" }
      - { name: filing_type, type: enum, source: input, description: "ACA_1094C | FORM_5500 | ERISA_SPD" }
      - { name: plan_year, type: integer, source: input, description: "Plan year the filing covers" }
      - { name: due_date, type: datetime, source: input, description: "Regulatory due date" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the officer who prepared it; null until PREPARED" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the officer who certified it; null until CERTIFIED" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PREPARED -> CERTIFIED -> FILED | LATE", default: "DRAFT" }

  - name: StopLossPolicy
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; self-funded employer covered" }
      - { name: attachment_point_cents, type: integer, source: input, description: "Specific stop-loss deductible; reimbursement begins strictly above this", constraints: ">= 1" }
      - { name: aggregate_limit_cents, type: integer, source: input, description: "Aggregate attachment for reporting" }
      - { name: wellness_credit_pct, type: number, source: input, description: "Wellness premium credit fraction, e.g. 0.05", constraints: "0 <= x <= 1" }
      - { name: cumulative_claims_cents, type: integer, source: system, description: "Running sum of recorded claim amounts", default: 0 }
      - { name: reimbursed_cents, type: integer, source: computed, description: "max(0, cumulative_claims_cents - attachment_point_cents)" }
      - { name: wellness_credit_cents, type: integer, source: computed, description: "round(wellness_credit_pct * cumulative_claims_cents)" }
      - { name: total_recovery_cents, type: integer, source: computed, description: "reimbursed_cents + wellness_credit_cents" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: CensusMember
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /census-members/{id}/terminate"
        actor: BenefitsConsultant
        preconditions: []
        side_effects:
          - "Client.employee_count recomputed (decremented)"
          - "Client.full_time_equivalent_count recomputed if FULL_TIME"
          - "Client.is_ale recomputed from the new full_time_equivalent_count"

  - entity: MarketingCampaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /campaigns/{id}/open"
        actor: BenefitsConsultant
        preconditions: []
        side_effects: ["campaign begins accepting CarrierQuote submissions"]
      - from: OPEN
        to: CLOSED
        trigger: "system: a CarrierQuote for this campaign is SELECTED"
        actor: system
        preconditions: []
        side_effects: ["all other SUBMITTED CarrierQuotes for this campaign -> DECLINED"]

  - entity: CarrierQuote
    initial_state: SUBMITTED
    terminal_states: [SELECTED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: SELECTED
        trigger: "POST /quotes/{id}/select"
        actor: BenefitsConsultant
        preconditions:
          - "parent MarketingCampaign.status == OPEN (else ERR_INVALID_STATE)  [cross-entity: Quote depends on Campaign]"
        side_effects:
          - "parent MarketingCampaign.status -> CLOSED"
          - "every sibling CarrierQuote for the campaign still in SUBMITTED -> DECLINED"
      - from: SUBMITTED
        to: DECLINED
        trigger: "system: a sibling CarrierQuote on the same campaign is SELECTED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Policy
    initial_state: BOUND
    terminal_states: [TERMINATED]
    transitions:
      - from: BOUND
        to: ACTIVE
        trigger: "POST /policies/{id}/activate"
        actor: BenefitsConsultant
        preconditions:
          - "no other ACTIVE Policy for the same client_id and coverage_line whose [effective_date, expiration_date] (closed) overlaps this policy's (else ERR_COVERAGE_OVERLAP)"
        side_effects:
          - "Client.active_premium_total_cents += monthly_premium_cents  [premium ledger invariant, forward]"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /policies/{id}/terminate"
        actor: BenefitsConsultant
        preconditions: []
        side_effects:
          - "Client.active_premium_total_cents -= monthly_premium_cents  [premium ledger invariant, compensating]"

  - entity: Renewal
    initial_state: OPEN
    terminal_states: [AGREED, DECLINED]
    transitions:
      - from: OPEN
        to: NEGOTIATING
        trigger: "POST /renewals/{id}/counter"
        actor: BenefitsConsultant | CarrierRep
        preconditions: []
        side_effects:
          - "current_offer_premium_cents = proposed_premium_cents"
          - "proposing_side = BROKER if actor is BenefitsConsultant else CARRIER"
          - "round_count += 1"
      - from: NEGOTIATING
        to: NEGOTIATING
        trigger: "POST /renewals/{id}/counter"
        actor: BenefitsConsultant | CarrierRep
        preconditions:
          - "actor's side != proposing_side (a side may not counter its own standing offer; else ERR_INVALID_STATE)"
        side_effects:
          - "current_offer_premium_cents = proposed_premium_cents"
          - "proposing_side flips to the actor's side"
          - "round_count += 1  [CYCLE: NEGOTIATING -> NEGOTIATING]"
      - from: OPEN
        to: AGREED
        trigger: "POST /renewals/{id}/settle (action=ACCEPT)"
        actor: BenefitsConsultant
        preconditions:
          - "current_offer_premium_cents (== initial_offer_premium_cents when OPEN) >= round(RENEWAL_FLOOR_PCT * Policy.original_premium_cents) (else ERR_PREMIUM_BELOW_FLOOR)"
        side_effects:
          - "agreed_premium_cents = current_offer_premium_cents"
          - "Policy.monthly_premium_cents = agreed_premium_cents"
          - "Policy.renewal_status = RENEWED"
          - "Policy.estimated_commission_cents recomputed from the new premium"
          - "Client.active_premium_total_cents recomputed over ACTIVE policies (transitive cascade hop C)"
      - from: NEGOTIATING
        to: AGREED
        trigger: "POST /renewals/{id}/settle (action=ACCEPT)"
        actor: BenefitsConsultant
        preconditions:
          - "current_offer_premium_cents >= round(RENEWAL_FLOOR_PCT * Policy.original_premium_cents) (else ERR_PREMIUM_BELOW_FLOOR)"
        side_effects:
          - "agreed_premium_cents = current_offer_premium_cents"
          - "Policy.monthly_premium_cents = agreed_premium_cents"
          - "Policy.renewal_status = RENEWED"
          - "Policy.estimated_commission_cents recomputed from the new premium"
          - "Client.active_premium_total_cents recomputed over ACTIVE policies (transitive cascade hop C)"
      - from: OPEN
        to: DECLINED
        trigger: "POST /renewals/{id}/settle (action=DECLINE)"
        actor: BenefitsConsultant
        preconditions: []
        side_effects:
          - "Policy.renewal_status = NONE (Policy.monthly_premium_cents left unchanged — no drift)"
      - from: NEGOTIATING
        to: DECLINED
        trigger: "POST /renewals/{id}/settle (action=DECLINE)"
        actor: BenefitsConsultant
        preconditions: []
        side_effects:
          - "Policy.renewal_status = NONE (Policy.monthly_premium_cents left unchanged — no drift)"

  - entity: EnrollmentWindow
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /enrollment-windows/{id}/open"
        actor: BenefitsConsultant
        preconditions:
          - "logical clock >= opens_at (else ERR_WINDOW_NOT_YET_OPEN)"
        side_effects: ["window begins accepting Elections"]
      - from: OPEN
        to: FINALIZED
        trigger: "POST /enrollment-windows/{id}/finalize"
        actor: BenefitsConsultant
        preconditions:
          - "logical clock >= closes_at (else ERR_WINDOW_NOT_CLOSED)"
        side_effects:
          - "every Election for this window still in SELECTED -> CONFIRMED (cascade hop B)"
          - "each such CONFIRMED Election increments Client.enrolled_headcount (cascade hop C)"
          - "total_confirmed_cents = round-per-election-then-sum of monthly_cost_cents over CONFIRMED elections"

  - entity: Election
    initial_state: SELECTED
    terminal_states: [WAIVED, WITHDRAWN]
    transitions:
      - from: SELECTED
        to: CONFIRMED
        trigger: "POST /elections/{id}/confirm"
        actor: ClientContact
        preconditions:
          - "parent EnrollmentWindow.status == OPEN (else ERR_INVALID_STATE)  [cross-entity: Election depends on EnrollmentWindow]"
          - "referenced Policy.lifecycle_status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "monthly_cost_cents = round(Policy.monthly_premium_cents * TIER_FACTOR[coverage_tier])"
          - "Client.enrolled_headcount += 1  [enrolled headcount invariant, forward]"
      - from: SELECTED
        to: WAIVED
        trigger: "POST /elections/{id}/waive"
        actor: ClientContact
        preconditions:
          - "parent EnrollmentWindow.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "no change to Client.enrolled_headcount  [BRANCH: divergent side-effect set vs CONFIRMED]"
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /elections/{id}/withdraw"
        actor: ClientContact
        preconditions: []
        side_effects:
          - "Client.enrolled_headcount -= 1  [enrolled headcount invariant, compensating]"

  - entity: ComplianceFiling
    initial_state: DRAFT
    terminal_states: [FILED, LATE]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /filings/{id}/prepare"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: ["prepared_by_user_id = acting X-User-ID"]
      - from: PREPARED
        to: CERTIFIED
        trigger: "POST /filings/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "acting X-User-ID != prepared_by_user_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "the filing's Client has >= 1 Policy with lifecycle_status == ACTIVE (else ERR_NO_ACTIVE_COVERAGE)  [cross-entity referential]"
        side_effects: ["certified_by_user_id = acting X-User-ID"]
      - from: CERTIFIED
        to: FILED
        trigger: "POST /filings/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "logical clock <= due_date"
        side_effects: ["filing recorded on time"]
      - from: CERTIFIED
        to: LATE
        trigger: "POST /filings/{id}/file"
        actor: ComplianceOfficer
        preconditions:
          - "logical clock > due_date  [branch on clock: same trigger, divergent terminal state]"
        side_effects: ["filing recorded late"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: renewal-create-stale-policy
    parent_entity: Policy
    write_endpoint: "POST /renewals"
    occ_field: "expected_policy_version"
    description: |
      Creating a Renewal against a Policy whose version has advanced since the
      client last observed it is rejected. A new Renewal legitimately supersedes
      the prior renewal cycle for that policy, so a create carrying a stale
      expected_policy_version is refused: the caller's view of the policy predates
      a mutation (e.g. an activation or an earlier renewal that already moved the
      policy on).
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: commission_estimation
    trigger: "on Policy bind (POST /policies) and recomputed on renewal AGREED"
    algorithm: tiered_pricing
    formula: |
      annual_premium_cents = monthly_premium_cents * 12
      base = annual_premium_cents * commission_rate_pct
      volume_mult =
        COMMISSION_TIER2_MULT if annual_premium_cents >= COMMISSION_TIER2_CENTS
        else COMMISSION_TIER1_MULT if annual_premium_cents >= COMMISSION_TIER1_CENTS
        else BASE_MULT
      line_mult = LINE_MULT[coverage_line]
      estimated_commission_cents = round(base * volume_mult * line_mult)   # round_half_up
    input_set: "single Policy; uses its current monthly_premium_cents, commission_rate_pct, coverage_line"
    constants:
      COMMISSION_TIER1_CENTS: 6000000
      COMMISSION_TIER2_CENTS: 12000000
      BASE_MULT: 1.00
      COMMISSION_TIER1_MULT: 1.05
      COMMISSION_TIER2_MULT: 1.10
      LINE_MULT: { MEDICAL: 1.00, DENTAL: 0.90, VISION: 0.85, LIFE: 0.95 }
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: estimated
        when: "at bind and on renewal, before commission is finalized"
        difference: "forward-looking: annualizes current monthly premium (x12) and applies the volume-tier multiplier"

  - name: commission_finalization
    trigger: "on POST /policies/{id}/finalize-commission (Policy must be ACTIVE)"
    algorithm: chronological
    formula: |
      months_active = (clock.year - effective_date.year) * 12 + (clock.month - effective_date.month)
      months_active = max(0, months_active)
      line_mult = LINE_MULT[coverage_line]
      finalized_commission_cents = round(monthly_premium_cents * commission_rate_pct * months_active * line_mult)  # round_half_up
    input_set: "single Policy; uses months elapsed from effective_date to the logical clock"
    constants:
      LINE_MULT: { MEDICAL: 1.00, DENTAL: 0.90, VISION: 0.85, LIFE: 0.95 }
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: finalized
        when: "on finalize-commission"
        difference: "chronological: multiplies actual months elapsed and applies NO volume-tier multiplier — diverges from the estimated variant for the same Policy"

  - name: aca_affordability
    trigger: "recomputed on CensusMember create and on any field update"
    algorithm: threshold
    formula: |
      rate_of_pay_threshold_cents = round(AFFORDABILITY_PCT * (annual_salary_cents / 12))   # round_half_up
      fpl_threshold_cents         = round(AFFORDABILITY_PCT * (FPL_ANNUAL_CENTS / 12))       # round_half_up
      affordable_rate_of_pay = monthly_contribution_cents <= rate_of_pay_threshold_cents
      affordable_fpl         = monthly_contribution_cents <= fpl_threshold_cents
    input_set: "single CensusMember"
    constants:
      AFFORDABILITY_PCT: 0.0912
      FPL_ANNUAL_CENTS: 1506000
    precision: "0 decimal places (integer cents), round_half_up"
    variants:
      - name: rate_of_pay_safe_harbor
        when: "affordability judged against the member's own salary"
        difference: "threshold scales with annual_salary_cents/12"
      - name: fpl_safe_harbor
        when: "affordability judged against the federal poverty line"
        difference: "threshold uses the fixed FPL_ANNUAL_CENTS/12 — yields a different affordable_* result than rate_of_pay for the same member"

  - name: election_premium_rounding
    trigger: "on Election CONFIRM (per-election cost) and on EnrollmentWindow finalize (window total)"
    algorithm: aggregation
    formula: |
      per election: monthly_cost_cents = round(Policy.monthly_premium_cents * TIER_FACTOR[coverage_tier])   # round_half_up
      window total (PINNED ORDER — round per election THEN sum):
        total_confirmed_cents = sum( round(Policy.monthly_premium_cents * TIER_FACTOR[tier]) for each CONFIRMED election )
      The alternative "sum then round" (sum of the unrounded products, rounded once) is NOT used.
    input_set: "CONFIRMED Elections for the window; tie-break not needed (summation is order-independent once each term is rounded)"
    constants:
      TIER_FACTOR: { EMPLOYEE_ONLY: 1.00, EMPLOYEE_SPOUSE: 2.00, EMPLOYEE_CHILD: 1.75, FAMILY: 2.85 }
    precision: "0 decimal places (integer cents), round_half_up; per-term rounding precedes summation"

  - name: fte_and_ale
    trigger: "recomputed on CensusMember create and terminate"
    algorithm: aggregation
    formula: |
      employee_count = count(CensusMember where client_id == Client.id AND status == ACTIVE)
      full_time_equivalent_count = count(CensusMember where client_id == Client.id AND status == ACTIVE AND employment_type == FULL_TIME)
      is_ale = full_time_equivalent_count >= ALE_THRESHOLD
    input_set: "CensusMembers for the client filtered to status==ACTIVE"
    constants:
      ALE_THRESHOLD: 50
    precision: "integer counts"

  - name: enrolled_headcount_ledger
    trigger: "on Election CONFIRM (+1), on Election WITHDRAWN (-1), on EnrollmentWindow finalize cascade"
    algorithm: aggregation
    formula: |
      enrolled_headcount = count(Election where status == CONFIRMED AND its window.client_id == Client.id)
    input_set: "CONFIRMED Elections across the client's windows"
    precision: "integer count"

  - name: active_premium_ledger
    trigger: "on Policy activate (+), Policy terminate (-), renewal AGREED (recompute)"
    algorithm: aggregation
    formula: |
      active_premium_total_cents = sum(Policy.monthly_premium_cents where client_id == Client.id AND lifecycle_status == ACTIVE)
    input_set: "ACTIVE Policies for the client"
    precision: "integer cents"

  - name: ytd_commission_ledger
    trigger: "on Policy finalize-commission"
    algorithm: aggregation
    formula: |
      ytd_commission_cents = sum(Policy.finalized_commission_cents where client_id == Client.id AND commission_status == FINALIZED)
    input_set: "FINALIZED Policies for the client"
    precision: "integer cents"

  - name: renewal_floor
    trigger: "on POST /renewals/{id}/settle (action=ACCEPT), evaluated against the current offer"
    algorithm: threshold
    formula: |
      floor_cents = round(RENEWAL_FLOOR_PCT * Policy.original_premium_cents)   # round_half_up
      accept is allowed only if current_offer_premium_cents >= floor_cents, else ERR_PREMIUM_BELOW_FLOOR
    input_set: "single Renewal + its Policy.original_premium_cents"
    constants:
      RENEWAL_FLOOR_PCT: 0.50
    precision: "0 decimal places (integer cents), round_half_up"

  - name: stop_loss_recovery
    trigger: "on POST /stop-loss-policies/{id}/record-claim"
    algorithm: threshold
    formula: |
      cumulative_claims_cents += claim_amount_cents
      reimbursed_cents      = max(0, cumulative_claims_cents - attachment_point_cents)   # STRICT: equal to attachment yields 0
      wellness_credit_cents = round(wellness_credit_pct * cumulative_claims_cents)        # round_half_up
      total_recovery_cents  = reimbursed_cents + wellness_credit_cents
    input_set: "single StopLossPolicy"
    precision: "0 decimal places (integer cents), round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity_backed ClientContact, X-User-ID must equal the owning Client.id of the resource (election's window.client_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /elections, POST /elections/{id}/confirm, POST /elections/{id}/waive, POST /elections/{id}/withdraw"
  - priority: 4
    category: existence
    check: "each id in the path exists; body FK ids reference existing rows"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: state
    check: "target resource is in a state from which this transition is defined; additionally POST /elections requires its EnrollmentWindow.status == OPEN and POST /renewals requires its Policy.lifecycle_status == ACTIVE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints, POST /elections, POST /renewals"
  - priority: 6
    category: state
    check: "OCC: expected_policy_version matches the current Policy.version"
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412
    applies_to: "POST /renewals"
  - priority: 7
    category: business_safety
    check: "segregation of duties: certifier's X-User-ID differs from prepared_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /filings/{id}/certify"
  - priority: 8
    category: business_referential
    check: "certify requires the filing's Client to have >= 1 ACTIVE Policy"
    error_id: ERR_NO_ACTIVE_COVERAGE
    http_status: 409
    applies_to: "POST /filings/{id}/certify"
  - priority: 9
    category: business_referential
    check: "Policy.quote_id must reference a CarrierQuote in SELECTED and belonging to a campaign of the same client_id"
    error_id: ERR_QUOTE_NOT_SELECTED
    http_status: 409
    applies_to: "POST /policies"
  - priority: 10
    category: business_referential
    check: "an Election's policy_id, census_member_id and window_id must all belong to the same Client"
    error_id: ERR_CLIENT_MISMATCH
    http_status: 409
    applies_to: "POST /elections"
  - priority: 11
    category: business_temporal
    check: "a new EnrollmentWindow's [opens_at, closes_at) half-open interval must not overlap another window for the same client (adjacency closes_at==opens_at is allowed)"
    error_id: ERR_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /enrollment-windows"
  - priority: 12
    category: business_temporal
    check: "activating a Policy must not create a [effective_date, expiration_date] closed-interval overlap with another ACTIVE Policy for the same client and coverage_line (touching endpoints DO conflict)"
    error_id: ERR_COVERAGE_OVERLAP
    http_status: 409
    applies_to: "POST /policies/{id}/activate"
  - priority: 13
    category: business_temporal
    check: "window open requires clock >= opens_at; window finalize requires clock >= closes_at; filing timing branch on due_date"
    error_id: ERR_WINDOW_NOT_YET_OPEN
    http_status: 409
    applies_to: "POST /enrollment-windows/{id}/open, POST /enrollment-windows/{id}/finalize"
  - priority: 14
    category: business_constraint
    check: "field-shape constraints: expiration_date > effective_date; closes_at > opens_at; monthly_premium_cents >= 1; commission_rate_pct in [0,1]; fiscal_year_end_month in 1..12; EIN unique"
    error_id: ERR_INVALID_FIELD
    http_status: 422
    applies_to: "POST /policies, POST /enrollment-windows, POST /quotes, POST /clients"
  - priority: 15
    category: business_fiscal
    check: "renewal ACCEPT requires current_offer_premium_cents >= round(RENEWAL_FLOOR_PCT * Policy.original_premium_cents)"
    error_id: ERR_PREMIUM_BELOW_FLOOR
    http_status: 409
    applies_to: "POST /renewals/{id}/settle"
  - priority: 16
    category: business_constraint
    check: "duplicate EIN on client create"
    error_id: ERR_DUPLICATE_EIN
    http_status: 409
    applies_to: "POST /clients"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Client ----
  - { method: POST, path: "/clients", description: "Onboard an employer client", roles: [BenefitsConsultant], code: 201, input: ["legal_name", "ein", "industry", "fiscal_year_end_month"], output: Client, side_effects: ["computed ledgers initialized to 0; is_ale=false"] }
  - { method: GET, path: "/clients/{id}", description: "Read a client (with computed reporting ledgers)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: Client, side_effects: [] }
  - { method: GET, path: "/clients", description: "List clients", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["limit?", "offset?"], output: "Client[]", side_effects: [] }

  # ---- CensusMember ----
  - { method: POST, path: "/census-members", description: "Add a census member", roles: [BenefitsConsultant], code: 201, input: ["client_id", "full_name", "birth_date", "annual_salary_cents", "monthly_contribution_cents", "employment_type"], output: CensusMember, side_effects: ["Client.employee_count / full_time_equivalent_count / is_ale recomputed; affordability computed"] }
  - { method: GET, path: "/census-members/{id}", description: "Read a census member", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: CensusMember, side_effects: [] }
  - { method: GET, path: "/census-members", description: "List census members (reverse-reachability for client_id)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["client_id?", "limit?", "offset?"], output: "CensusMember[]", side_effects: [] }
  - { method: POST, path: "/census-members/{id}/terminate", description: "Terminate a census member", roles: [BenefitsConsultant], code: 200, input: [], output: CensusMember, side_effects: ["status->TERMINATED; Client counts + is_ale recomputed"] }

  # ---- MarketingCampaign ----
  - { method: POST, path: "/campaigns", description: "Start a plan-marketing campaign", roles: [BenefitsConsultant], code: 201, input: ["client_id", "coverage_line", "target_effective_date"], output: MarketingCampaign, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/campaigns/{id}", description: "Read a campaign", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: MarketingCampaign, side_effects: [] }
  - { method: GET, path: "/campaigns", description: "List campaigns (reverse-reachability for client_id)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["client_id?", "limit?", "offset?"], output: "MarketingCampaign[]", side_effects: [] }
  - { method: POST, path: "/campaigns/{id}/open", description: "Open a campaign for carrier quotes", roles: [BenefitsConsultant], code: 200, input: [], output: MarketingCampaign, side_effects: ["status DRAFT->OPEN"] }

  # ---- CarrierQuote ----
  - { method: POST, path: "/quotes", description: "Carrier submits a quote", roles: [CarrierRep], code: 201, input: ["campaign_id", "carrier_name", "monthly_premium_cents", "commission_rate_pct"], output: CarrierQuote, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/quotes/{id}", description: "Read a quote", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: CarrierQuote, side_effects: [] }
  - { method: GET, path: "/quotes", description: "List quotes (reverse-reachability for campaign_id)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["campaign_id?", "limit?", "offset?"], output: "CarrierQuote[]", side_effects: [] }
  - { method: POST, path: "/quotes/{id}/select", description: "Broker selects the winning quote", roles: [BenefitsConsultant], code: 200, input: [], output: CarrierQuote, side_effects: ["status->SELECTED; campaign->CLOSED; sibling quotes->DECLINED"] }

  # ---- Policy ----
  - { method: POST, path: "/policies", description: "Bind a policy from a SELECTED quote", roles: [BenefitsConsultant], code: 201, input: ["client_id", "quote_id", "effective_date", "expiration_date"], output: Policy, side_effects: ["copies coverage_line/carrier/premium/rate from quote; original_premium_cents set; estimated_commission_cents computed; lifecycle_status=BOUND"] }
  - { method: GET, path: "/policies/{id}", description: "Read a policy", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: Policy, side_effects: [] }
  - { method: GET, path: "/policies", description: "List policies (reverse-reachability for client_id and quote_id)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["client_id?", "quote_id?", "limit?", "offset?"], output: "Policy[]", side_effects: [] }
  - { method: POST, path: "/policies/{id}/activate", description: "Activate a bound policy", roles: [BenefitsConsultant], code: 200, input: [], output: Policy, side_effects: ["lifecycle_status BOUND->ACTIVE; Client.active_premium_total_cents += monthly_premium_cents; overlap checked"] }
  - { method: POST, path: "/policies/{id}/terminate", description: "Terminate an active policy", roles: [BenefitsConsultant], code: 200, input: [], output: Policy, side_effects: ["lifecycle_status ACTIVE->TERMINATED; Client.active_premium_total_cents -= monthly_premium_cents"] }
  - { method: POST, path: "/policies/{id}/finalize-commission", description: "Finalize commission for an active policy", roles: [BenefitsConsultant], code: 200, input: [], output: Policy, side_effects: ["finalized_commission_cents computed (chronological); commission_status PENDING->FINALIZED; Client.ytd_commission_cents recomputed"] }

  # ---- Renewal ----
  - { method: POST, path: "/renewals", description: "Open a renewal negotiation on an ACTIVE policy (OCC on Policy.version)", roles: [BenefitsConsultant], code: 201, input: ["policy_id", "expected_policy_version", "initial_offer_premium_cents"], output: Renewal, side_effects: ["status=OPEN; current_offer=initial_offer; increments Policy.version by 1; Policy.renewal_status=RENEWING"] }
  - { method: GET, path: "/renewals/{id}", description: "Read a renewal", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: Renewal, side_effects: [] }
  - { method: GET, path: "/renewals", description: "List renewals (reverse-reachability for policy_id)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["policy_id?", "limit?", "offset?"], output: "Renewal[]", side_effects: [] }
  - { method: POST, path: "/renewals/{id}/counter", description: "Either side proposes a new premium (negotiation cycle)", roles: [BenefitsConsultant, CarrierRep], code: 200, input: ["proposed_premium_cents"], output: Renewal, side_effects: ["current_offer/proposing_side/round_count updated; status->NEGOTIATING"] }
  - { method: POST, path: "/renewals/{id}/settle", description: "Broker accepts or declines the current offer", roles: [BenefitsConsultant], code: 200, input: ["action"], output: Renewal, side_effects: ["ACCEPT->AGREED (cascade to Policy + Client); DECLINE->DECLINED"] }

  # ---- EnrollmentWindow ----
  - { method: POST, path: "/enrollment-windows", description: "Schedule an open-enrollment window", roles: [BenefitsConsultant], code: 201, input: ["client_id", "plan_year", "opens_at", "closes_at"], output: EnrollmentWindow, side_effects: ["status=SCHEDULED; overlap checked"] }
  - { method: GET, path: "/enrollment-windows/{id}", description: "Read a window", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: EnrollmentWindow, side_effects: [] }
  - { method: GET, path: "/enrollment-windows", description: "List windows (reverse-reachability for client_id)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["client_id?", "limit?", "offset?"], output: "EnrollmentWindow[]", side_effects: [] }
  - { method: POST, path: "/enrollment-windows/{id}/open", description: "Open the window (clock-gated)", roles: [BenefitsConsultant], code: 200, input: [], output: EnrollmentWindow, side_effects: ["status SCHEDULED->OPEN"] }
  - { method: POST, path: "/enrollment-windows/{id}/finalize", description: "Finalize the window; confirm SELECTED elections", roles: [BenefitsConsultant], code: 200, input: [], output: EnrollmentWindow, side_effects: ["status OPEN->FINALIZED; SELECTED elections->CONFIRMED; enrolled_headcount cascade; total_confirmed_cents computed"] }

  # ---- Election ----
  - { method: POST, path: "/elections", description: "Member elects a policy during enrollment", roles: [ClientContact], code: 201, input: ["window_id", "census_member_id", "policy_id", "coverage_tier"], output: Election, side_effects: ["status=SELECTED"] }
  - { method: GET, path: "/elections/{id}", description: "Read an election", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: Election, side_effects: [] }
  - { method: GET, path: "/elections", description: "List elections (reverse-reachability for window_id, census_member_id, policy_id)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["window_id?", "census_member_id?", "policy_id?", "limit?", "offset?"], output: "Election[]", side_effects: [] }
  - { method: POST, path: "/elections/{id}/confirm", description: "Confirm an election", roles: [ClientContact], code: 200, input: [], output: Election, side_effects: ["status SELECTED->CONFIRMED; monthly_cost_cents computed; enrolled_headcount +=1"] }
  - { method: POST, path: "/elections/{id}/waive", description: "Waive an election (branch)", roles: [ClientContact], code: 200, input: [], output: Election, side_effects: ["status SELECTED->WAIVED; no headcount change"] }
  - { method: POST, path: "/elections/{id}/withdraw", description: "Withdraw a confirmed election (compensating)", roles: [ClientContact], code: 200, input: [], output: Election, side_effects: ["status CONFIRMED->WITHDRAWN; enrolled_headcount -=1"] }

  # ---- ComplianceFiling ----
  - { method: POST, path: "/filings", description: "Open a compliance filing (ACA/5500/ERISA)", roles: [ComplianceOfficer], code: 201, input: ["client_id", "filing_type", "plan_year", "due_date"], output: ComplianceFiling, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/filings/{id}", description: "Read a filing", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: ComplianceFiling, side_effects: [] }
  - { method: GET, path: "/filings", description: "List filings (reverse-reachability for client_id)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["client_id?", "limit?", "offset?"], output: "ComplianceFiling[]", side_effects: [] }
  - { method: POST, path: "/filings/{id}/prepare", description: "Prepare a filing", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceFiling, side_effects: ["status DRAFT->PREPARED; prepared_by_user_id set"] }
  - { method: POST, path: "/filings/{id}/certify", description: "Certify a prepared filing (segregation of duties)", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceFiling, side_effects: ["status PREPARED->CERTIFIED; certified_by_user_id set"] }
  - { method: POST, path: "/filings/{id}/file", description: "File a certified filing (on-time->FILED else LATE)", roles: [ComplianceOfficer], code: 200, input: [], output: ComplianceFiling, side_effects: ["status CERTIFIED->FILED or ->LATE per clock vs due_date"] }

  # ---- StopLossPolicy ----
  - { method: POST, path: "/stop-loss-policies", description: "Set up a wellness/stop-loss policy", roles: [BenefitsConsultant], code: 201, input: ["client_id", "attachment_point_cents", "aggregate_limit_cents", "wellness_credit_pct"], output: StopLossPolicy, side_effects: ["cumulative_claims_cents=0"] }
  - { method: GET, path: "/stop-loss-policies/{id}", description: "Read a stop-loss policy", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: [], output: StopLossPolicy, side_effects: [] }
  - { method: GET, path: "/stop-loss-policies", description: "List stop-loss policies (reverse-reachability for client_id)", roles: [BenefitsConsultant, CarrierRep, ComplianceOfficer, ClientContact, PlatformAdmin], code: 200, input: ["client_id?", "limit?", "offset?"], output: "StopLossPolicy[]", side_effects: [] }
  - { method: POST, path: "/stop-loss-policies/{id}/record-claim", description: "Record a claim; recompute reimbursement (strict attachment threshold)", roles: [BenefitsConsultant], code: 200, input: ["claim_amount_cents"], output: StopLossPolicy, side_effects: ["cumulative_claims_cents += amount; reimbursed/wellness/total recomputed"] }

  # ---- Test-driving ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: ["to_iso8601"], output: "null", side_effects: ["logical clock advanced/rewound to to_iso8601"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a recognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted, or ClientContact X-User-ID != owning Client.id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path id or referenced body FK id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "resource not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_POLICY_VERSION, http: 412, condition: "expected_policy_version does not match current Policy.version on POST /renewals" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "filing certifier's X-User-ID equals prepared_by_user_id" }
  - { id: ERR_NO_ACTIVE_COVERAGE, http: 409, condition: "certify attempted for a client with no ACTIVE Policy" }
  - { id: ERR_QUOTE_NOT_SELECTED, http: 409, condition: "Policy bind references a quote that is not SELECTED or not on a campaign of the same client" }
  - { id: ERR_CLIENT_MISMATCH, http: 409, condition: "election's window/member/policy do not all belong to the same client" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "new EnrollmentWindow [opens_at, closes_at) overlaps an existing window for the client" }
  - { id: ERR_COVERAGE_OVERLAP, http: 409, condition: "activating a Policy overlaps an ACTIVE Policy for the same client and coverage_line ([effective,expiration] closed)" }
  - { id: ERR_WINDOW_NOT_YET_OPEN, http: 409, condition: "window open before clock >= opens_at" }
  - { id: ERR_WINDOW_NOT_CLOSED, http: 409, condition: "window finalize before clock >= closes_at" }
  - { id: ERR_PREMIUM_BELOW_FLOOR, http: 409, condition: "renewal ACCEPT with current_offer below round(RENEWAL_FLOOR_PCT * original_premium_cents)" }
  - { id: ERR_INVALID_FIELD, http: 422, condition: "field-shape violation: expiration<=effective, closes<=opens, premium<1, rate out of [0,1], fiscal month out of 1..12, or missing required field" }
  - { id: ERR_DUPLICATE_EIN, http: 409, condition: "client create with an EIN already in use" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BenefitsConsultant
    description: "The broker/consultant: onboards clients, manages census, runs marketing, binds/activates policies, negotiates renewals, runs enrollment, finalizes commissions, sets up stop-loss."
    identity: "opaque"
    exclusive_operations:
      - "POST /clients"
      - "POST /census-members"
      - "POST /census-members/{id}/terminate"
      - "POST /campaigns"
      - "POST /campaigns/{id}/open"
      - "POST /quotes/{id}/select"
      - "POST /policies"
      - "POST /policies/{id}/activate"
      - "POST /policies/{id}/terminate"
      - "POST /policies/{id}/finalize-commission"
      - "POST /renewals"
      - "POST /renewals/{id}/settle"
      - "POST /enrollment-windows"
      - "POST /enrollment-windows/{id}/open"
      - "POST /enrollment-windows/{id}/finalize"
      - "POST /stop-loss-policies"
      - "POST /stop-loss-policies/{id}/record-claim"
    shared_operations:
      - "POST /renewals/{id}/counter (shared with CarrierRep)"
      - "all GET reads"

  - name: CarrierRep
    description: "Carrier representative: submits quotes and counters during renewal negotiation."
    identity: "opaque"
    exclusive_operations:
      - "POST /quotes"
    shared_operations:
      - "POST /renewals/{id}/counter (shared with BenefitsConsultant)"
      - "all GET reads"

  - name: ComplianceOfficer
    description: "Prepares, certifies, and files ACA/5500/ERISA filings; segregation of duties enforced across prepare vs certify by X-User-ID."
    identity: "opaque"
    exclusive_operations:
      - "POST /filings"
      - "POST /filings/{id}/prepare"
      - "POST /filings/{id}/certify"
      - "POST /filings/{id}/file"
    shared_operations:
      - "all GET reads"

  - name: ClientContact
    description: "Employer HR administrator acting for their own Client; creates/confirms/waives/withdraws employee elections."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /elections"
      - "POST /elections/{id}/confirm"
      - "POST /elections/{id}/waive"
      - "POST /elections/{id}/withdraw"
    shared_operations:
      - "all GET reads"

  - name: PlatformAdmin
    description: "Operational role for the logical clock and read access."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads"
