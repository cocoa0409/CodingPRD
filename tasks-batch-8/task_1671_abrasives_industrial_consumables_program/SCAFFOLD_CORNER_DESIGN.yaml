              payload: { sku: "SE-B", name: "Speed Under Disc", product_form: "COATED", max_operating_speed_rpm: 4999 }
              as: ProgramAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-SE", asset_tag: "GR-SE", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${pa_id}", operation_name: "DEBURR", standard_qty_per_part: 0.0250, effective_from: "2026-01-01" }
              as: AccountManager
            - call: "POST /api/lots"
              payload: { product_id: "${pa_id}", lot_code: "L-SEA", manufacture_date: "2026-06-01", qty_received: 100 }
              as: AccountManager
              captures: { lota_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${pb_id}", lot_code: "L-SEB", manufacture_date: "2026-06-01", qty_received: 100 }
              as: AccountManager
              captures: { lotb_id: $.data.id }
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${pa_id}", lot_id: "${lota_id}", usage_date: "2026-08-01", qty_used: 10, parts_produced: 400 }
              as: AccountManager
              captures: { ur_id: $.data.id }
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${pb_id}", lot_id: "${lotb_id}", usage_date: "2026-08-01", qty_used: 10, parts_produced: 400 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "Product at exactly spindle rpm (5000 >= 5000): usage record created (201)"
            - "Product one rpm under (4999 < 5000): HTTP 409 ERR_SPEED_RATING_EXCEEDED"

      - name: usage_guard_required_bonded_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_GUARD_REQUIRED]"
        distinguishing_aspect: "BONDED media requires machine guard_type IN {FIXED, ADJUSTABLE}; guard NONE is rejected even when the speed check passes."
        test_recipe:
          setup: ["BONDED product rpm 6000 shelf 12 (lot expiry 2027-06-01); ACTIVE machine spindle 5000 guard NONE; lot qty 100"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "GD-1", name: "Guard Wheel", product_form: "BONDED", max_operating_speed_rpm: 6000, shelf_life_months: 12 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-GD", asset_tag: "GR-GD", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "NONE" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/lots"
              payload: { product_id: "${p_id}", lot_code: "L-GD", manufacture_date: "2026-06-01", qty_received: 100 }
              as: AccountManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /api/usage-records"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", lot_id: "${lot_id}", usage_date: "2026-08-01", qty_used: 5, parts_produced: 200 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_GUARD_REQUIRED (speed 6000 >= 5000 passed; guard check fires)"

      - name: confirm_order_preconditions_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.BlanketOrder.DRAFT_to_OPEN"
          - "errors[ERR_CONTRACT_NOT_ACTIVE]"
          - "errors[ERR_CONTRACT_LINE_MISSING]"
          - "errors[ERR_PRODUCT_DISCONTINUED]"
        distinguishing_aspect: "Confirm's three precondition layers each reject distinctly: DRAFT contract -> ERR_CONTRACT_NOT_ACTIVE; ACTIVE contract without a matching price line -> ERR_CONTRACT_LINE_MISSING; line present but product DISCONTINUED -> ERR_PRODUCT_DISCONTINUED."
        test_recipe:
          setup:
            - "Case A: contract DRAFT (never activated) with a line for PA; blanket order A for PA"
            - "Case B: contract ACTIVE with a line only for PB_OTHER; blanket order B for PB_MAIN"
            - "Case C: contract ACTIVE with a line for PC1; blanket order C for PC1; PC1 discontinued (replacement PC2)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CF-A", name: "Confirm A", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "CF-BM", name: "Confirm B Main", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { pbm_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "CF-BO", name: "Confirm B Other", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { pbo_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "CF-C1", name: "Confirm C Old", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { pc1_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "CF-C2", name: "Confirm C New", product_form: "COATED", max_operating_speed_rpm: 6500 }
              as: ProgramAdmin
              captures: { pc2_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-CFA", contract_number: "C-CFA", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${pa_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { ca_id: $.data.id }
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${ca_id}", product_id: "${pa_id}", committed_qty: 10 }
              as: AccountManager
              captures: { boa_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-CFB", contract_number: "C-CFB", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${pbo_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { cb_id: $.data.id }
            - call: "POST /api/contracts/${cb_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${cb_id}", product_id: "${pbm_id}", committed_qty: 10 }
              as: AccountManager
              captures: { bob_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-CFC", contract_number: "C-CFC", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${pc1_id}", base_unit_price_cents: 9000 }, { product_id: "${pc2_id}", base_unit_price_cents: 9500 } ] }
              as: AccountManager
              captures: { cc_id: $.data.id }
            - call: "POST /api/contracts/${cc_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${cc_id}", product_id: "${pc1_id}", committed_qty: 10 }
              as: AccountManager
              captures: { boc_id: $.data.id }
            - call: "POST /api/products/${pc1_id}/discontinue"
              payload: { replacement_product_id: "${pc2_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/blanket-orders/${boa_id}/confirm"
              as: ProgramAdmin
              captures: { err_a: $.data.error_id }
            - call: "POST /api/blanket-orders/${bob_id}/confirm"
              as: ProgramAdmin
              captures: { err_b: $.data.error_id }
            - call: "POST /api/blanket-orders/${boc_id}/confirm"
              as: ProgramAdmin
              captures: { err_c: $.data.error_id }
          assert:
            - "Case A: HTTP 409 ERR_CONTRACT_NOT_ACTIVE (contract DRAFT)"
            - "Case B: HTTP 409 ERR_CONTRACT_LINE_MISSING (no line for the order's product)"
            - "Case C: HTTP 409 ERR_PRODUCT_DISCONTINUED (contract ACTIVE, line exists, product DISCONTINUED)"

      - name: disposal_hazard_method_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_HAZARD_DISPOSAL_METHOD_REQUIRED]"
        distinguishing_aspect: "Hazard-class used media (METAL_SWARF) disposed via LANDFILL is rejected — only HAZARDOUS_WASTE_FACILITY is permitted."
        test_recipe:
          setup: ["BONDED product with used_media_hazard_class METAL_SWARF"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "DH-1", name: "Hazard Wheel", product_form: "BONDED", max_operating_speed_rpm: 6000, shelf_life_months: 36, used_media_hazard_class: "METAL_SWARF" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /api/disposal-records"
              payload: { customer_ref: "PLANT-DH", product_id: "${p_id}", qty_disposed: 10, gross_weight_kg: 10.00, disposal_method: "LANDFILL", manifest_number: "MF-1", certified_facility_ref: "FAC-1", disposed_at: "2026-08-05" }
              as: EHSOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_HAZARD_DISPOSAL_METHOD_REQUIRED"

      - name: disposal_manifest_fields_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_MANIFEST_FIELDS_REQUIRED]"
        distinguishing_aspect: "Hazard disposal with the correct method but without manifest_number/certified_facility_ref is a 400 conditional-required rejection."
        test_recipe:
          setup: ["BONDED product with used_media_hazard_class METAL_SWARF"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "DM-1", name: "Manifest Wheel", product_form: "BONDED", max_operating_speed_rpm: 6000, shelf_life_months: 36, used_media_hazard_class: "METAL_SWARF" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /api/disposal-records"
              payload: { customer_ref: "PLANT-DM", product_id: "${p_id}", qty_disposed: 10, gross_weight_kg: 10.00, disposal_method: "HAZARDOUS_WASTE_FACILITY", disposed_at: "2026-08-05" }
              as: EHSOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_MANIFEST_FIELDS_REQUIRED"

      - name: disposal_non_hazard_recycling_ok
        claim_type: satisfaction_pass
        grounds:
          - "validations[priority=7]"
          - "entities.Product.fields.used_media_hazard_class"
        distinguishing_aspect: "Non-hazard media (NONE) via RECYCLING needs no manifest fields — the conditional compliance checks do not fire."
        test_recipe:
          setup: ["COATED product (hazard class defaults to NONE)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "DN-1", name: "NonHaz Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /api/disposal-records"
              payload: { customer_ref: "PLANT-DN", product_id: "${p_id}", qty_disposed: 12, gross_weight_kg: 25.50, disposal_method: "RECYCLING", disposed_at: "2026-08-05" }
              as: EHSOfficer
              captures: { d_id: $.data.id }
          assert:
            - "HTTP 201; DisposalRecord.${d_id} created with customer_ref PLANT-DN and no manifest fields required"

      - name: window_shape_invalid_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Window shape validation: a standard with effective_to == effective_from (empty half-open window) and a trial with scheduled_end < scheduled_start are both 400 rejections."
        test_recipe:
          setup: ["Machine ACTIVE spindle 5000 FIXED; COATED product rpm 6000"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "WS-1", name: "Window Shape Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-WS", asset_tag: "GR-WS", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "BADWIN", standard_qty_per_part: 0.0250, effective_from: "2026-06-01", effective_to: "2026-06-01" }
              as: AccountManager
              captures: { err1: $.data.error_id }
            - call: "POST /api/trials"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", scheduled_start: "2026-09-10", scheduled_end: "2026-09-05" }
              as: AccountManager
              captures: { err2: $.data.error_id }
          assert:
            - "Standard with effective_to == effective_from: HTTP 400 ERR_INVALID_REQUEST (empty half-open window)"
            - "Trial with scheduled_end < scheduled_start: HTTP 400 ERR_INVALID_REQUEST"

      - name: release_scheduled_on_term_end_allowed
        claim_type: satisfaction_pass
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_RELEASE_WINDOW_OUTSIDE_TERM]"
        distinguishing_aspect: "Contract-term window is closed-inclusive: scheduled_ship_date == term_end is allowed; one day later is rejected."
        test_recipe:
          setup: ["COATED product; contract ACTIVE term 2026-01-01..2027-12-31; blanket order committed 100 OPEN"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "TE-1", name: "Term End Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-TE", contract_number: "C-TE", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 100 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v2: $.data.version }
          trigger:
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 10, scheduled_ship_date: "2027-12-31", expected_blanket_order_version: "${bo_v2}" }
              as: AccountManager
              captures: { ra_id: $.data.id }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { bo_v3: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 10, scheduled_ship_date: "2028-01-01", expected_blanket_order_version: "${bo_v3}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "Release.${ra_id} created (201): scheduled_ship_date == term_end is inside the inclusive window"
            - "Second release (2028-01-01): HTTP 409 ERR_RELEASE_WINDOW_OUTSIDE_TERM"

  # ============================================================ endpoints
  - section: endpoints
    instances:
      - name: release_create_success_envelope
        claim_type: standard_crud
        grounds:
          - "response_envelope"
          - "endpoints"
        distinguishing_aspect: "A successful create returns the FIXED success envelope: meta.api_request_id + api_request_timestamp, response_type object, and the Release payload under data with server-computed fields populated."
        test_recipe:
          setup: ["COATED product; contract ACTIVE (base 10000, escalation 0); blanket order committed 20 OPEN"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "EN-1", name: "Envelope Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-EN", contract_number: "C-EN", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 20 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
          trigger:
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 5, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id, rel_prov: $.data.provisional_unit_price_cents }
          assert:
            - "HTTP 201; envelope: response_type == object, meta.api_request_id present, meta.api_request_timestamp present"
            - "data.id is a server-minted UUID; data.status == SCHEDULED; data.provisional_unit_price_cents == 10000"
            - "data.allocations == [] and data.final_unit_price_cents == null (not yet shipped)"

  # ============================================================ errors
  - section: errors
    instances:
      - name: discontinue_replacement_invalid_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_REPLACEMENT_INVALID]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Discontinuation guards: replacement equal to the product itself or already DISCONTINUED -> ERR_REPLACEMENT_INVALID (409); replacement_product_id omitted entirely -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Products P1, P2, P3 ACTIVE; P2 already discontinued with replacement P3"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "RI-1", name: "Repl Invalid 1", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "RI-2", name: "Repl Invalid 2", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "RI-3", name: "Repl Invalid 3", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /api/products/${p2_id}/discontinue"
              payload: { replacement_product_id: "${p3_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/products/${p1_id}/discontinue"
              payload: { replacement_product_id: "${p1_id}" }
              as: ProgramAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /api/products/${p1_id}/discontinue"
              payload: { replacement_product_id: "${p2_id}" }
              as: ProgramAdmin
              captures: { err2: $.data.error_id }
            - call: "POST /api/products/${p1_id}/discontinue"
              payload: {}
              as: ProgramAdmin
              captures: { err3: $.data.error_id }
          assert:
            - "Replacement == self: HTTP 409 ERR_REPLACEMENT_INVALID"
            - "Replacement already DISCONTINUED: HTTP 409 ERR_REPLACEMENT_INVALID"
            - "Replacement omitted: HTTP 400 ERR_INVALID_REQUEST"
            - "Product.${p1_id}.status remains ACTIVE after all three rejections"

      - name: error_machine_not_active_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_MACHINE_NOT_ACTIVE]"
        excluded_because:
          difficulty_instance: usage_record_gated_by_machine_status
          rationale: "ERR_MACHINE_NOT_ACTIVE is asserted as the failure path of that §1.8 instance (and as the winning error in usage_create_state_beats_safety)."

      - name: error_release_exceeds_remaining_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RELEASE_EXCEEDS_REMAINING]"
        excluded_because:
          difficulty_instance: release_qty_exactly_remaining_boundary
          rationale: "ERR_RELEASE_EXCEEDS_REMAINING is asserted by that §1.8 instance (remaining + 1 rejected after exact-boundary success)."

      - name: error_regulator_report_covered
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REGULATOR_REPORT_REQUIRED]"
        excluded_because:
          difficulty_instance: hazard_month_mass_exactly_1000_boundary
          rationale: "ERR_REGULATOR_REPORT_REQUIRED is asserted at the exact 1000.00 kg boundary in that §1.8 instance."

  # ============================================================ rbac
  - section: rbac
    instances:
      - name: rbac_product_create_forbidden_for_account_manager
        claim_type: rbac_denial
        grounds:
          - "roles"
          - "errors[ERR_FORBIDDEN_FOR_ROLE]"
        distinguishing_aspect: "POST /api/products is exclusive to ProgramAdmin; AccountManager is denied with 403 before any payload validation."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/products"
              payload: { sku: "RB-1", name: "Rbac Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN_FOR_ROLE; error envelope shape preserved (response_type error, data.error_id, data.message)"

      - name: rbac_submit_results_forbidden_for_program_admin
        claim_type: rbac_denial
        grounds:
          - "roles"
          - "errors[ERR_FORBIDDEN_FOR_ROLE]"
        distinguishing_aspect: "Trial results submission is exclusive to EHSOfficer; even ProgramAdmin (the conversion approver) is denied — this separation is what makes the segregation-of-duties rule enforceable."
        test_recipe:
          setup: ["Machine ACTIVE spindle 5000 FIXED; COATED product rpm 6000; trial ACTIVE"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "RB-2", name: "Rbac Trial Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-RB", asset_tag: "GR-RB", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/trials"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", scheduled_start: "2026-09-01", scheduled_end: "2026-09-03" }
              as: AccountManager
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /api/trials/${t_id}/submit-results"
              payload: { measured_removal_rate_g_per_min: 12.5, parts_per_unit_media: 120, cost_per_part_cents: 42 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN_FOR_ROLE"
            - "TrialCase.${t_id}.status remains ACTIVE (no state change from the denied call)"

      - name: missing_auth_header_returns_400
        claim_type: rbac_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Requests without X-User-Role / X-User-ID headers are rejected with 400 before role or existence checks."
        test_recipe:
          setup: ["One product exists"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "RB-3", name: "Header Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /api/products/${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (headers omitted entirely)"

      - name: sod_convert_same_user_rejected
        claim_type: rbac_denial
        grounds:
          - "state_machines.TrialCase.EVALUATION_to_CONVERTED"
          - "errors[ERR_SEPARATION_OF_DUTIES]"
          - "entities.TrialCase.fields.results_submitted_by_user_id"
        distinguishing_aspect: "Segregation of duties: the converting X-User-ID must differ from results_submitted_by_user_id; the same person (ehs-7) wearing the ProgramAdmin hat is rejected even though the role is correct."
        test_recipe:
          setup: ["Machine ACTIVE spindle 5000 FIXED; COATED product rpm 6000; trial submitted to EVALUATION by user ehs-7"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "SD-1", name: "SoD Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-SD", asset_tag: "GR-SD", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/trials"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", scheduled_start: "2026-09-01", scheduled_end: "2026-09-03" }
              as: AccountManager
              captures: { t_id: $.data.id }
            - call: "POST /api/trials/${t_id}/submit-results"
              payload: { measured_removal_rate_g_per_min: 12.5, parts_per_unit_media: 120, cost_per_part_cents: 42 }
              as: EHSOfficer
              as_user_id: "ehs-7"
              captures: { t_st: $.data.status }
          trigger:
            - call: "POST /api/trials/${t_id}/convert"
              as: ProgramAdmin
              as_user_id: "ehs-7"
              captures: { err: $.data.error_id }
            - call: "GET /api/trials/${t_id}"
              as: ProgramAdmin
              captures: { t_st2: $.data.status }
          assert:
            - "Trial reached EVALUATION with results_submitted_by_user_id == ehs-7"
            - "Convert by the same user id (ehs-7) under ProgramAdmin role: HTTP 409 ERR_SEPARATION_OF_DUTIES"
            - "TrialCase.${t_id}.status remains EVALUATION"

  # ============================================================ cross_cutting_layers
  - section: cross_cutting_layers
    instances:
      - name: occ_release_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[release-create-stale-order]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on BlanketOrder.version: a release create carrying the pre-first-create version is rejected with 412 after the first create advanced the order version — deterministic with two strictly sequential requests."
        test_recipe:
          setup: ["COATED product; contract ACTIVE; blanket order committed 50 OPEN at version 2 (post-confirm)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "OC-1", name: "OCC Release Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-OC", contract_number: "C-OC", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 50 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 10, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { r1_id: $.data.id }
          trigger:
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 5, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { err: $.data.error_id }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { bo_rem: $.data.remaining_qty, bo_vend: $.data.version }
          assert:
            - "First create succeeds with expected_blanket_order_version == 2 (advances order to version 3)"
            - "Second create replaying version 2: HTTP 412 with error_id == ERR_STALE_VERSION"
            - "BlanketOrder.${bo_id}.remaining_qty == 40 (only the first release reserved) and version == 3"

      - name: occ_contract_amend_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[contract-amend-stale-version]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "OCC on Contract.version: a second amend replaying the activation-era version is rejected with 412; the first amend's escalation_pct remains in effect."
        test_recipe:
          setup: ["Contract ACTIVE at version 2 (post-activation)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "OC-2", name: "OCC Contract Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-OC2", contract_number: "C-OC2", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.04, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
              captures: { c_v: $.data.version }
            - call: "PATCH /api/contracts/${c_id}"
              payload: { expected_contract_version: "${c_v}", escalation_pct: 0.05 }
              as: ProgramAdmin
              captures: { c_v2: $.data.version }
          trigger:
            - call: "PATCH /api/contracts/${c_id}"
              payload: { expected_contract_version: "${c_v}", escalation_pct: 0.06 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
            - call: "GET /api/contracts/${c_id}"
              as: ProgramAdmin
              captures: { c_esc: $.data.escalation_pct, c_vend: $.data.version }
          assert:
            - "First amend (version 2) succeeds and advances contract to version 3"
            - "Second amend replaying version 2: HTTP 412 ERR_STALE_VERSION"
            - "Contract.${c_id}.escalation_pct == 0.05 (stale amend did not apply) and version == 3"

      - name: substitution_accept_repricing_flow
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.Release.ON_HOLD_to_SCHEDULED"
          - "entities.BlanketOrder.fields.substitution_status"
          - "calculations.release_price_at_date"
        distinguishing_aspect: "Accepting the substitution swaps the order's product to the replacement, re-stamps provisional prices from the replacement's contract line (9500c), returns ON_HOLD releases to SCHEDULED, and re-opens the order to new releases."
        test_recipe:
          setup:
            - "Products P1 (line 9000c) and P2 (line 9500c); contract ACTIVE escalation 0; blanket order for P1 committed 50 OPEN; release qty 5 SCHEDULED; P1 discontinued with replacement P2 (order PENDING, release ON_HOLD)"
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "SA-1", name: "Subst Old", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /api/products"
              payload: { sku: "SA-2", name: "Subst New", product_form: "COATED", max_operating_speed_rpm: 6500 }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-SA", contract_number: "C-SA", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p1_id}", base_unit_price_cents: 9000 }, { product_id: "${p2_id}", base_unit_price_cents: 9500 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p1_id}", committed_qty: 50 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 5, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "POST /api/products/${p1_id}/discontinue"
              payload: { replacement_product_id: "${p2_id}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /api/blanket-orders/${bo_id}/accept-substitution"
              as: AccountManager
              captures: { bo_prod: $.data.product_id, bo_sub: $.data.substitution_status, bo_unit: $.data.provisional_unit_price_cents, bo_v5: $.data.version }
            - call: "GET /api/releases/${rel_id}"
              as: AccountManager
              captures: { rel_st: $.data.status, rel_prov: $.data.provisional_unit_price_cents }
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 2, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v5}" }
              as: AccountManager
              captures: { rel2_id: $.data.id, rel2_prov: $.data.provisional_unit_price_cents }
          assert:
            - "BlanketOrder.${bo_id}.product_id == ${p2_id} (swapped to replacement) and substitution_status == ACCEPTED"
            - "BlanketOrder.${bo_id}.provisional_unit_price_cents == 9500 (replacement line price)"
            - "Release.${rel_id}.status == SCHEDULED (returned from ON_HOLD) with provisional_unit_price_cents == 9500"
            - "New release on the ACCEPTED order succeeds (201) with provisional_unit_price_cents == 9500"

      - name: conversion_retires_old_standard_creates_new
        claim_type: cascading_side_effects
        grounds:
          - "state_machines.TrialCase.EVALUATION_to_CONVERTED"
          - "state_machines.UsageStandard.ACTIVE_to_RETIRED"
        distinguishing_aspect: "Conversion side effects: the prior ACTIVE standard for (machine, product) is RETIRED and a new standard is created with standard_qty_per_part = round_half_up(1/120, 4) = 0.0083, effective_from = current clock date 2026-08-01, linked via converted_standard_id."
        test_recipe:
          setup: ["Machine ACTIVE spindle 5000 FIXED; COATED product rpm 6000; ACTIVE standard 0.0100 [2026-01-01, open); trial [2026-09-01, 2026-09-05] submitted by ehs-7 (parts_per_unit_media 120)"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "CV-1", name: "Convert Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/machines"
              payload: { customer_ref: "PLANT-CV", asset_tag: "GR-CV", machine_type: "ANGLE_GRINDER", spindle_max_rpm: 5000, guard_type: "FIXED" }
              as: AccountManager
              captures: { m_id: $.data.id }
            - call: "POST /api/standards"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", operation_name: "OLD_RATE", standard_qty_per_part: 0.0100, effective_from: "2026-01-01" }
              as: AccountManager
              captures: { s0_id: $.data.id }
            - call: "POST /api/trials"
              payload: { machine_id: "${m_id}", product_id: "${p_id}", scheduled_start: "2026-09-01", scheduled_end: "2026-09-05" }
              as: AccountManager
              captures: { t_id: $.data.id }
            - call: "POST /api/trials/${t_id}/submit-results"
              payload: { measured_removal_rate_g_per_min: 12.5, parts_per_unit_media: 120, cost_per_part_cents: 42 }
              as: EHSOfficer
              as_user_id: "ehs-7"
          trigger:
            - call: "POST /api/trials/${t_id}/convert"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { t_st: $.data.status, new_std: $.data.converted_standard_id }
            - call: "GET /api/standards/${new_std}"
              as: ProgramAdmin
              captures: { ns_rate: $.data.standard_qty_per_part, ns_from: $.data.effective_from, ns_to: $.data.effective_to, ns_st: $.data.status, ns_op: $.data.operation_name }
            - call: "GET /api/standards/${s0_id}"
              as: ProgramAdmin
              captures: { s0_st: $.data.status }
          assert:
            - "TrialCase.${t_id}.status == CONVERTED and converted_standard_id set (different converter admin-1 vs submitter ehs-7 satisfies SoD)"
            - "New UsageStandard.${new_std}: status ACTIVE, standard_qty_per_part == 0.0083 (round_half_up(1/120, 4)), effective_from == 2026-08-01 (clock date), effective_to == null, operation_name == TRIAL-CONVERSION"
            - "Old UsageStandard.${s0_id}.status == RETIRED (conversion cascade freed the window)"

  # ============================================================ consistency_model
  - section: consistency_model
    instances:
      - name: read_your_writes_remaining_immediate
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile"
          - "calculations.blanket_remaining_qty"
        distinguishing_aspect: "Immediate consistency: the release reservation is visible in the blanket order's remaining_qty on the very next read, in the same logical instant — no eventual lag."
        test_recipe:
          setup: ["COATED product; contract ACTIVE; blanket order committed 100 OPEN"]
          setup_api_calls:
            - call: "POST /api/products"
              payload: { sku: "RY-1", name: "ReadYourWrites Disc", product_form: "COATED", max_operating_speed_rpm: 6000 }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { customer_ref: "PLANT-RY", contract_number: "C-RY", term_start: "2026-01-01", term_end: "2027-12-31", price_hold_end: "2026-12-31", escalation_pct: 0.0, escalation_effective_date: "2027-01-01", lines: [ { product_id: "${p_id}", base_unit_price_cents: 10000 } ] }
              as: AccountManager
              captures: { c_id: $.data.id }
            - call: "POST /api/contracts/${c_id}/activate"
              as: ProgramAdmin
            - call: "POST /api/blanket-orders"
              payload: { contract_id: "${c_id}", product_id: "${p_id}", committed_qty: 100 }
              as: AccountManager
              captures: { bo_id: $.data.id }
            - call: "POST /api/blanket-orders/${bo_id}/confirm"
              as: ProgramAdmin
              captures: { bo_v: $.data.version, rem0: $.data.remaining_qty }
          trigger:
            - call: "POST /api/blanket-orders/${bo_id}/releases"
              payload: { qty: 40, scheduled_ship_date: "2026-09-01", expected_blanket_order_version: "${bo_v}" }
              as: AccountManager
              captures: { rel_id: $.data.id }
            - call: "GET /api/blanket-orders/${bo_id}"
              as: AccountManager
              captures: { rem1: $.data.remaining_qty }
          assert:
            - "remaining_qty == 100 immediately after confirm"
            - "remaining_qty == 60 on the read immediately following the release create (same logical clock instant)"
