            - "Promotion.${promoC_id}.status == PENDING_REVIEW"
            - "Promotion.${promoE_id}.status == PENDING_REVIEW"

  - rule_id: compensating_invariant
    instances:
      - name: settlement_post_then_reverse_conserves_the_zero_sum_inter_club_ledger
        conserved_quantity: "sum of Club.settlement_ledger_cents across every Club, which must equal 0 before the post, after the post and after the reversal; plus the sweep flag GuestUsageEvent.settlement_id, which must return to null"
        grounds:
          - state_machines.UsageSettlement.OPEN_to_POSTED
          - state_machines.UsageSettlement.POSTED_to_REVERSED
          - calculations.usage_settlement_net
          - entities.Club.fields.settlement_ledger_cents
          - entities.GuestUsageEvent.fields.settlement_id
          - errors[ERR_DUPLICATE_SETTLEMENT_PERIOD]
        distinguishing_aspect: |
          Posting moves 93702 cents from the home club's ledger to the host club's, so the two-club sum
          stays 0 while both members of the pair move. Reversing must undo BOTH halves and also release
          the sweep flags: an implementation that only credits the home club back, or that leaves
          settlement_id stamped on the guest usage rows, leaves the invariant intact on one axis and
          broken on the other. The re-settlement at the end is the detector for the flag half - it can
          only reproduce gross 105000 from 2 events and 84 visits if every swept row really became
          eligible again.
        test_recipe:
          setup:
            - "One franchisee owning two OPEN clubs on two of its own territories: home club H and host club X, each with guest_fee_cents 1250."
            - "One PUBLISHED CORE12 template and one member at H whose agreement carries multi_club_access true."
            - "Two unsettled 2026-08 guest usage batches at host X for that agreement: 50 visits (62500 cents) and 34 visits (42500 cents), 105000 cents gross in total."
            - "One OPEN settlement for (2026-08, H, X): admin_hold_cents round_half_up(8400.0) = 8400, net_before_rebate_cents 96600, rebate_pct 0.03, volume_rebate_cents 2898, net_payable_cents 93702. Both club ledgers are still 0."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Two Rivers Fitness LLC", contact_email: "ops@tworiversfit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { th_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.3, center_lng: -118.3, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { tx_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${th_id}", name: "Two Rivers Home", opened_on: "2021-06-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /franchise/clubs/${ch_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${tx_id}", name: "Two Rivers Host", opened_on: "2021-06-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { cx_id: $.data.id }
            - call: "POST /franchise/clubs/${cx_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/plan-templates"
              payload: { code: "CORE12", monthly_dues_cents: 4500, initiation_fee_cents: 4900, term_months: 12, cancellation_notice_days: 30, floor_price_cents: 3600 }
              as: BrandAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /franchise/plan-templates/${pt_id}/publish"
              payload: {}
              as: BrandAdministrator
            - call: "POST /franchise/members"
              payload: { full_name: "Teodora Vlasic", email: "teodora.vlasic@example.com", home_state_code: "CA" }
              as: ClubManager
              as_user_id: "${ch_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /franchise/clubs/${ch_id}"
              payload: {}
              as: BrandAdministrator
              captures: { ch_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m1_id}", home_club_id: "${ch_id}", plan_template_id: "${pt_id}", expected_club_version: "${ch_v}", signed_on: "2026-08-01", multi_club_access: true }
              as: ClubManager
              as_user_id: "${ch_id}"
              captures: { ag1_id: $.data.id }
            - call: "POST /franchise/guest-usage-events"
              payload: { agreement_id: "${ag1_id}", host_club_id: "${cx_id}", period_month: "2026-08", visit_count: 50 }
              as: ClubManager
              as_user_id: "${cx_id}"
              captures: { g1_id: $.data.id }
            - call: "POST /franchise/guest-usage-events"
              payload: { agreement_id: "${ag1_id}", host_club_id: "${cx_id}", period_month: "2026-08", visit_count: 34 }
              as: ClubManager
              as_user_id: "${cx_id}"
              captures: { g2_id: $.data.id }
            - call: "POST /franchise/usage-settlements"
              payload: { period_month: "2026-08", home_club_id: "${ch_id}", host_club_id: "${cx_id}" }
              as: BrandAdministrator
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /franchise/usage-settlements/${s1_id}/post"
              payload: {}
              as: BrandAdministrator
            - call: "POST /franchise/usage-settlements/${s1_id}/reverse"
              payload: { reason: "Host club disputed the visit log" }
              as: BrandAdministrator
            - call: "POST /franchise/usage-settlements"
              payload: { period_month: "2026-08", home_club_id: "${ch_id}", host_club_id: "${cx_id}" }
              as: BrandAdministrator
              captures: { s2_id: $.data.id }
          assert:
            - "UsageSettlement.${s1_id}.event_count == 2"
            - "UsageSettlement.${s1_id}.visit_count == 84"
            - "UsageSettlement.${s1_id}.gross_fee_cents == 105000"
            - "UsageSettlement.${s1_id}.admin_hold_cents == 8400"
            - "UsageSettlement.${s1_id}.net_before_rebate_cents == 96600"
            - "UsageSettlement.${s1_id}.rebate_pct == 0.03"
            - "UsageSettlement.${s1_id}.volume_rebate_cents == 2898"
            - "UsageSettlement.${s1_id}.net_payable_cents == 93702"
            - "immediately after the post, Club.${ch_id}.settlement_ledger_cents == -93702"
            - "immediately after the post, Club.${cx_id}.settlement_ledger_cents == 93702"
            - "immediately after the post, Club.${ch_id}.settlement_ledger_cents + Club.${cx_id}.settlement_ledger_cents == 0"
            - "immediately after the post, UsageSettlement.${s1_id}.status == POSTED"
            - "after the reverse, Club.${ch_id}.settlement_ledger_cents == 0"
            - "after the reverse, Club.${cx_id}.settlement_ledger_cents == 0"
            - "after the reverse, UsageSettlement.${s1_id}.status == REVERSED"
            - "after the reverse, UsageSettlement.${s1_id}.net_payable_cents == 93702"
            - "after the reverse, GuestUsageEvent.${g1_id}.settlement_id == null"
            - "after the reverse, GuestUsageEvent.${g2_id}.settlement_id == null"
            - "the re-settlement response status == 201"
            - "UsageSettlement.${s2_id}.event_count == 2"
            - "UsageSettlement.${s2_id}.visit_count == 84"
            - "UsageSettlement.${s2_id}.gross_fee_cents == 105000"
            - "UsageSettlement.${s2_id}.net_payable_cents == 93702"
            - "UsageSettlement.${s2_id}.status == OPEN"
            - "GuestUsageEvent.${g1_id}.settlement_id == ${s2_id}"
            - "GuestUsageEvent.${g2_id}.settlement_id == ${s2_id}"

      - name: corporate_allocate_then_recall_conserves_lifetime_funded_total
        conserved_quantity: "CorporateAccount.lifetime_funded_cents, together with the two identities pool_balance_cents + allocated_cents == lifetime_funded_cents and sum(Franchisee.corporate_allocation_cents) == CorporateAccount.allocated_cents"
        grounds:
          - endpoints[POST /franchise/corporate-accounts/{id}/fund]
          - endpoints[POST /franchise/corporate-accounts/{id}/allocate]
          - endpoints[POST /franchise/corporate-accounts/{id}/recall-allocation]
          - calculations.corporate_allocation
          - calculations.effective_monthly_dues
          - entities.Franchisee.fields.corporate_allocation_cents
        distinguishing_aspect: |
          A different conserved quantity on a different pair of ledgers: money is conserved between one
          undistributed pool and N franchisee balances, not swapped between two symmetric peers, and the
          split is uneven (66667 / 33333 after the one-cent remainder waterfall) so a reversal that
          re-derives shares by naive floor division would leave the pool one cent short. The recall must
          reproduce the exact same 2:1 weighting and remainder ordering it allocated with, and
          enrolled_agreement_count must not move at all - it is a membership count, not money.
        test_recipe:
          setup:
            - "Two national-account-eligible franchisees: f1 with OPEN club c1, f2 with OPEN club c2 on a distant territory."
            - "One PUBLISHED CORE12 template at 4500 cents and one ACTIVE CorporateAccount with corporate_credit_pct 0.045 and allocation_method USAGE_SHARE."
            - "Three agreements enrolled in that account - two at c1 and one at c2 - each with effective_monthly_dues_cents 4500 - round_half_up(4500 * 0.045) = 4500 - 203 = 4297, and each driven to agreement_status ACTIVE by a paid 4297-cent charge. Weights are therefore f1 = 2 and f2 = 1."
            - "The account has been funded with 100000 cents, so pool_balance_cents is 100000, allocated_cents 0 and lifetime_funded_cents 100000."
