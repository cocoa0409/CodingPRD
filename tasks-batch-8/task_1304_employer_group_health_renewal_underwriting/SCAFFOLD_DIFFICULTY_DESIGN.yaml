            - { call: "POST /underwriting-cases/${c}/claims-experiences", payload: { experience_period_start: "2024-01-01T00:00:00Z", experience_period_end: "2024-12-31T00:00:00Z", total_paid_claims_cents: 19200000, total_enrollment_months: 4800, large_claim_count: 0, pooling_threshold_cents: 5000000 }, as: Underwriter, captures: { clExact: "$.data.id" } }
          trigger:
            - { call: "POST /claims-experiences/${clShort}/submit", payload: {}, as: Underwriter, as_user_id: "uw-001", captures: { eid: "$.data.error_id" } }
