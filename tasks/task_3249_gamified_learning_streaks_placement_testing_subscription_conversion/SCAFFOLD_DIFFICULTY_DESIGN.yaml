              as_user_id: "${ada}"
              captures: { seat: $.data.id, sub_v2: $.data.version }
            - call: "POST /engagement-offers"
              payload: { learner_id: "${bea}", milestone_code: "HEART_DEPLETION" }
              as: PlatformAdmin
              captures: { offer: $.data.id }
            - call: "POST /_clock/set_current_utc"
