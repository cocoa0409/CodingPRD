              captures: { occ: $.data.occupied_units }
          assert:
            - "Before dispatch: Zone.${zone_id}.occupied_units == 200 (100 live * footprint 2)"
            - "After dispatch: Zone.${zone_id}.occupied_units == 120 (60 live * 2)"
            - "After void: Zone.${zone_id}.occupied_units == 200 (restored; occupied_after_void == occupied_before_dispatch)"

      # --- Instance 2: Order confirm+cancel conserves credit + committed_qty --
      - name: confirm_cancel_conserves_open_balance_and_committed_quantity
        grounds:
          - state_machines.BrokerOrder.DRAFT_to_CONFIRMED
          - state_machines.BrokerOrder.CONFIRMED_to_CANCELLED
          - entities.Broker.fields.open_balance_cents
          - entities.AvailabilityEntry.fields.committed_quantity
        distinguishing_aspect: |
          Conserved quantities = Broker.open_balance_cents AND
          AvailabilityEntry.committed_quantity (DIFFERENT conserved quantities from
          the zone-footprint invariant). The invariant: both return to their
          pre-confirm values after the compensating cancel — open_balance 0->X->0
          and committed_quantity 0->qty->0.
        test_recipe:
          setup:
            - "SALEABLE batch published @500c, available=200. Broker IN_STATE OR credit high, open_balance 0, entry committed 0. Order one line qty=200 in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/varieties"
              payload: { common_name: "Yarrow T", cultivar_code: "YART1", propagation_form: "LINER", grow_cycle_days: 5, container_footprint_units: 1, ship_ready_grade_min_height_cm: 8, ship_ready_min_live_pct: 0.50, requires_phyto: false }
              as: GrowerManager
              captures: { var_id: $.data.id }
            - call: "POST /nursery/varieties/${var_id}/activate"
              payload: {}
              as: GrowerManager
            - call: "POST /nursery/zones"
              payload: { name: "GH9 B", climate_class: "MIXED", capacity_units: 3000 }
              as: GrowerManager
              captures: { zone_id: $.data.id }
            - call: "POST /nursery/batches"
              payload: { variety_id: "${var_id}", zone_id: "${zone_id}", source_supplier: "S", sourced_count: 200 }
              as: ProductionTech
              captures: { batch_id: $.data.id }
            - call: "GET /nursery/zones/${zone_id}"
              payload: {}
              as: ProductionTech
              captures: { zv: $.data.version }
            - call: "POST /nursery/batches/${batch_id}/transplant"
              payload: { started_count: 200, expected_zone_version: "${zv}" }
              as: ProductionTech
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-07T00:00:00Z" }
              as: GrowerManager
            - call: "POST /nursery/batches/${batch_id}/input-logs"
              payload: { event_type: "GRADE", mean_height_cm: 10, dead_observed: 0 }
              as: ProductionTech
            - call: "POST /nursery/batches/${batch_id}/start-grading"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/batches/${batch_id}/finalize-grade"
              payload: {}
              as: ProductionTech
            - call: "POST /nursery/availability"
              payload: { batch_id: "${batch_id}", unit_price_cents: 500 }
              as: SalesCoordinator
              captures: { e1: $.data.id }
            - call: "POST /nursery/brokers"
              payload: { company_name: "OR Broker", contact_email: "or@x.com", ship_to_state: "OR", credit_limit_cents: 5000000 }
              as: SalesCoordinator
              captures: { broker_id: $.data.id }
            - call: "POST /nursery/orders"
              payload: { broker_id: "${broker_id}", requested_ship_date: "2026-03-01T00:00:00Z" }
              as: SalesCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /nursery/orders/${order_id}/lines"
              payload: { availability_entry_id: "${e1}", quantity: 200 }
              as: SalesCoordinator
            - call: "GET /nursery/orders/${order_id}"
              payload: {}
              as: SalesCoordinator
              captures: { ov: $.data.version }
          trigger:
            - call: "POST /nursery/orders/${order_id}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesCoordinator
              captures: { total: $.data.order_total_cents }
            - call: "POST /nursery/orders/${order_id}/cancel"
              payload: {}
              as: SalesCoordinator
            - call: "GET /nursery/brokers/${broker_id}"
              payload: {}
              as: SalesCoordinator
              captures: { ob: $.data.open_balance_cents }
            - call: "GET /nursery/availability/${e1}"
              payload: {}
              as: SalesCoordinator
              captures: { cq: $.data.committed_quantity }
          assert:
            - "After confirm: Broker.${broker_id}.open_balance_cents == 104900 (order_total: 200*500 + freight 4900) and AvailabilityEntry.${e1}.committed_quantity == 200"
            - "After cancel: Broker.${broker_id}.open_balance_cents == 0 (restored to pre-confirm)"
            - "After cancel: AvailabilityEntry.${e1}.committed_quantity == 0 and available_quantity == 200 (restored)"
