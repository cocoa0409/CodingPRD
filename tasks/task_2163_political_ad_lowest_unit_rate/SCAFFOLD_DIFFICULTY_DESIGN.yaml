              as: StationComplianceOfficer
              as_user_id: "officer-beta"
            - call: "GET /political-ads/orders/${ord}"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord_v1: $.data.version }
            - call: "POST /political-ads/orders/${ord}/payments"
              payload: { direction: "CHARGE", amount_cents: 100000, expected_order_version: "${ord_v1}" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
          trigger:
            - call: "POST /political-ads/orders/${ord}/cancel"
              payload: { cancellation_reason: "Campaign withdrew the flight" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord_v2: $.data.version }
            - call: "POST /political-ads/orders/${ord}/payments"
              payload: { direction: "REFUND", amount_cents: 100000, expected_order_version: "${ord_v2}" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
          assert:
            - "CommercialOrder.${ord}.status == CANCELLED"
            - "CommercialOrder.${ord}.payment_status == REFUNDED"
            - "CommercialOrder.${ord}.net_due_cents == 0"
            - "CommercialOrder.${ord}.gross_charge_cents == 0"
            - "CommercialOrder.${ord}.paid_cents == 100000"
            - "CommercialOrder.${ord}.refunded_cents == 100000"
            - "CommercialOrder.${ord}.paid_cents - CommercialOrder.${ord}.refunded_cents == CommercialOrder.${ord}.net_due_cents"
            - "CommercialOrder.${ord}.rebate_total_cents == 100000"
            - "ScheduledSpot.${sp}.status == CANCELLED"
            - "ScheduledSpot.${sp}.charged_rate_cents == 0"
            - "GET /political-ads/rebates?order_id=${ord} returns exactly 1 entry with amount_cents == 100000 and reason == ORDER_CANCELLED"

      - name: cancelling_granted_order_conserves_election_equal_opportunity_units
        grounds:
          - state_machines.EqualOpportunityRequest.RECEIVED_to_GRANTED
          - state_machines.EqualOpportunityRequest.GRANTED_to_RECEIVED
          - entities.EqualOpportunityRequest.fields.owed_units
          - entities.EqualOpportunityRequest.fields.fulfilled_units
          - calculations.equal_opportunity_owed_units
        distinguishing_aspect: |
          The conserved quantity is AIRTIME UNITS, not money:
          election_eo_outstanding_units = sum over GRANTED requests of (owed_units -
          fulfilled_units) is 0 before the grant, 1 after it, and exactly 0 again after the
          compensating cancellation of the granted order, with no residual owed_units drift.
        test_recipe:
          setup:
            - "One station with eo_parity_basis SPOT_COUNT, a PRIMARY election on 2026-09-15 and one EARLY_NEWS rate class."
            - "Okafor's order is COMPLETED after its single 30-second spot aired at 2026-08-10T12:00:00Z."
            - "Whitlock holds an ACCEPTED order on the same election and rate class with one 30-second spot on 2026-08-25."
            - "Whitlock filed an equal-opportunity request at 2026-08-11T09:00:00Z which the station GRANTED against that order, setting owed_units to 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WUNI-TV", licensee_name: "Unit Parity Broadcasting", market_code: "DMA-620", political_file_posting_deadline_hours: 24, daily_political_seconds_cap: 300, eo_parity_basis: "SPOT_COUNT" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/elections"
              payload: { station_id: "${st}", office_sought: "Governor", election_type: "PRIMARY", election_date: "2026-09-15" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { el: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-EN", daypart: "EARLY_NEWS", preemptible: true, preemption_priority: 2, posted_rate_cents: 100000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Okafor For Governor", requested_class: "CANDIDATE", election_id: "${el}", candidate_name: "Lena Okafor", office_sought: "Governor", qualification_evidence_ref: "FEC-F2-2026-0101" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv_o: $.data.id }
            - call: "POST /political-ads/advertisers/${adv_o}/review"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers/${adv_o}/decision"
              payload: { decision: "CLASSIFY_CANDIDATE", reason: "Ballot access confirmed" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Whitlock For Governor", requested_class: "CANDIDATE", election_id: "${el}", candidate_name: "Ray Whitlock", office_sought: "Governor", qualification_evidence_ref: "FEC-F2-2026-0102" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv_w: $.data.id }
            - call: "POST /political-ads/advertisers/${adv_w}/review"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers/${adv_w}/decision"
              payload: { decision: "CLASSIFY_CANDIDATE", reason: "Ballot access confirmed" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv_o}", rate_class_id: "${rc}", payment_terms: "NET_30", sponsorship_disclosure_text: "PAID FOR BY Okafor For Governor; AUTHORIZED BY Okafor For Governor", disclosure_duration_seconds: 5, election_id: "${el}", agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv_o}"
              captures: { ord_t: $.data.id }
            - call: "POST /political-ads/orders/${ord_t}/spots"
              payload: { air_date: "2026-08-10", start_offset_seconds: 0, duration_seconds: 30, program_code: "EN-T1" }
              as: AdvertiserAgent
              as_user_id: "${adv_o}"
              captures: { sp_t: $.data.id }
            - call: "POST /political-ads/orders/${ord_t}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv_o}"
            - call: "POST /political-ads/orders/${ord_t}/decision"
              payload: { decision: "ACCEPT" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T12:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/spots/${sp_t}/disposition"
              payload: { disposition: "AIRED" }
