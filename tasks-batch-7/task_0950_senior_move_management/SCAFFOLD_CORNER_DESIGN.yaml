              as: MOVE_MANAGER
              captures: { f3: "$.data.id" }
          trigger:
            - call: "POST /inventory-items/${f1}/designate"
              payload: { disposition: "KEEP", assigned_room_id: "${room}" }
              as: MOVE_MANAGER
            - call: "POST /inventory-items/${f2}/designate"
              payload: { disposition: "KEEP", assigned_room_id: "${room}" }
              as: MOVE_MANAGER
              captures: { e11: "$.data.error_id" }
          assert:
            - "the first trigger call succeeds and InventoryItem.${f1}.disposition == KEEP"
            - "DestinationRoom.${room}.keep_load_linear_inches == 192.00 and headroom_linear_inches == 0.00"
            - "the second trigger call responds 422 and ${e11} == ERR_ROOM_CAPACITY_EXCEEDED"
            - "InventoryItem.${f2}.disposition == UNDECIDED"
            - "designating ${f3} into the same room after ${f1} would pass the linear test at 198.00 against 192.00 only if capacity allowed, so the linear error still wins; rung 69 is reached only when the linear test passes"

