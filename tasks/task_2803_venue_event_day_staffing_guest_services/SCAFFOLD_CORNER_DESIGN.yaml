              payload: { position_slot_id: "${slot_id}", staff_member_id: "${m1}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id, asg_att: $.data.attendance_status, asg_pay: $.data.payout_status }
          assert:
            - "${cert_status} == 'VALID' and ${slot_status_before} == 'OPEN' and ${slot_cost} == ${plan_base} == 19600"
            - "HTTP status is 201"
            - "${asg_att} == 'SCHEDULED' and ${asg_pay} == 'PENDING'"
            - "StaffAssignment.${asg_1}.source == 'MANUAL', shift_bid_id is null, late_check_in == false, worked_minutes == 0, total_payout_cents == 0"
            - "PositionSlot.${slot_id}.filled_headcount == 1 and status == 'PARTIALLY_FILLED'"
            - "StaffingPlan.${plan_id}.total_required_headcount == 2 and base_labor_cost_cents == 19600 - filling a head does not reprice the plan"
            - "StaffMember.${m1}.reliability_score == 100, season_reliability_score == 100, completed_assignment_count == 0, status == ACTIVE"
            - "GET /backfill-requests?position_slot_id=${slot_id} returns total_count == 0"

      - name: duplicate_bid_on_the_same_slot_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 13]
          - errors[ERR_DUPLICATE_BID]
          - state_machines.ShiftBid.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: >-
          The uniqueness rule counts only non-terminal rows: a second SUBMITTED bid by the same
          member on the same slot returns ERR_DUPLICATE_BID, but once the first bid is WITHDRAWN the
          same member may bid again and the slot then carries two bid rows, one terminal and one live.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event with an ACTIVE plan and a TICKET_TAKER slot of required_headcount_override 2."
            - "One ACTIVE member m1 with one SUBMITTED bid on that slot."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Duplicate Bid Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ada Bidder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${m1}", position_slot_id: "${slot_id}" }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { bid_1: $.data.id }
          trigger:
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${m1}", position_slot_id: "${slot_id}" }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { err_dup: $.data.error_id }
            - call: "POST /shift-bids/${bid_1}/withdraw"
              as: StaffMember
              as_user_id: "${m1}"
            - call: "POST /shift-bids"
              payload: { staff_member_id: "${m1}", position_slot_id: "${slot_id}" }
              as: StaffMember
              as_user_id: "${m1}"
              captures: { bid_2: $.data.id, bid_2_status: $.data.status }
          assert:
            - "${err_dup} == 'ERR_DUPLICATE_BID' with HTTP 409"
            - "immediately after the refusal GET /shift-bids?position_slot_id=${slot_id} returns total_count == 1"
            - "ShiftBid.${bid_1}.status == WITHDRAWN after the withdraw"
            - "the third call returns 201 with ${bid_2_status} == 'SUBMITTED' - a terminal bid does not block a re-bid"
            - "GET /shift-bids?position_slot_id=${slot_id} returns total_count == 2 and GET /shift-bids?position_slot_id=${slot_id}&status=SUBMITTED returns total_count == 1"
            - "PositionSlot.${slot_id}.filled_headcount == 0 and status == OPEN - bidding never fills a slot"

      - name: reopen_limit_reached_after_two_reopens_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority 15]
          - validations[priority 16]
          - errors[ERR_REOPEN_LIMIT_REACHED]
          - errors[ERR_REOPEN_WINDOW_CLOSED]
          - errors[ERR_ISSUE_STATE_INVALID]
          - state_machines.GuestIssue.RESOLVED_to_REOPENED
          - state_machines.GuestIssue.RESOLVED_to_CLOSED
        distinguishing_aspect: >-
          The ceiling and the window are separate rules and the window outranks the ceiling: after
          two reopens a third inside the 1440-minute window reports ERR_REOPEN_LIMIT_REACHED, but the
          same third attempt made 1441 minutes after resolution reports ERR_REOPEN_WINDOW_CLOSED
          instead - and once the mirror condition lets the issue close, every further reopen is
          ERR_ISSUE_STATE_INVALID.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z."
            - "One IN_PROGRESS Event; one ACTIVE member with a VALID CODE_OF_CONDUCT certification."
            - "One MEDIUM / OTHER GuestIssue taken through assign -> resolve NO_ACTION -> reopen -> assign -> resolve -> reopen -> assign -> resolve, each reopen inside the window, leaving reopen_count 2 and resolved_at 2026-09-12T19:20:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Reopen Ceiling Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-members"
              payload: { full_name: "Ida Responder", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2020-01-01T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { m1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${m1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
              captures: { cert_1: $.data.id }
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "TEXT_LINE", category: "OTHER", severity: "MEDIUM", description: "Repeat complaint" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { gi_1: $.data.id }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /guest-issues/${gi_1}/resolve"
              payload: { resolution_type: "NO_ACTION" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:10:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /guest-issues/${gi_1}/reopen"
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { count_1: $.data.reopen_count }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /guest-issues/${gi_1}/resolve"
              payload: { resolution_type: "NO_ACTION" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:20:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /guest-issues/${gi_1}/reopen"
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { count_2: $.data.reopen_count }
            - call: "POST /guest-issues/${gi_1}/assign"
              payload: { staff_member_id: "${m1}" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /guest-issues/${gi_1}/resolve"
              payload: { resolution_type: "NO_ACTION" }
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { resolved_at_final: $.data.resolved_at }
          trigger:
            - call: "POST /guest-issues/${gi_1}/reopen"
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { err_ceiling: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-13T19:21:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /guest-issues/${gi_1}/reopen"
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { err_window: $.data.error_id }
            - call: "POST /guest-issues/${gi_1}/close"
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
            - call: "POST /guest-issues/${gi_1}/reopen"
              as: GuestServicesSupervisor
              as_user_id: "sup-1"
              captures: { err_closed: $.data.error_id }
          assert:
            - "${count_1} == 1 and ${count_2} == 2, and each reopen cleared resolved_at, resolution_type and resolved_by_user_id"
            - "${resolved_at_final} == '2026-09-12T19:20:00Z'"
            - "${err_ceiling} == 'ERR_REOPEN_LIMIT_REACHED' with HTTP 409 - the clock is only 0 minutes past resolution, so the window rule is satisfied and the ceiling rule speaks"
            - "${err_window} == 'ERR_REOPEN_WINDOW_CLOSED' with HTTP 409 at 1441 minutes past resolution - the window rule outranks the ceiling rule that is also violated"
            - "the close returns 200 with status CLOSED - its mirror condition needs strictly more than 1440 minutes, which 1441 satisfies"
            - "${err_closed} == 'ERR_ISSUE_STATE_INVALID' with HTTP 409 and GuestIssue.${gi_1}.reopen_count is still 2"

      - name: closed_issue_refund_decision_reports_state_before_fiscal
        claim_type: priority_ordering
        grounds:
          - validations[priority 10]
          - validations[priority 22]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_beats_fiscal_on_closed_issue_refund"
          rationale: >-
            The §1.8 instance violates the state rule and the refund sub-state rule with one call and
            asserts ERR_ISSUE_STATE_INVALID wins, which is exactly this priority-conflict pair.

      - name: uncertified_member_on_a_full_slot_reports_certification_first
        claim_type: priority_ordering
        grounds:
          - validations[priority 12]
          - validations[priority 17]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / safety_beats_constraint_on_uncertified_full_slot"
          rationale: >-
            The §1.8 instance sends one call that violates both the certification rule and the slot
            capacity rule and asserts ERR_CERTIFICATION_MISSING, covering the safety-outranks-capacity
            claim.

      - name: duplicate_assignment_reports_before_the_rest_conflict
        claim_type: priority_ordering
        grounds:
          - validations[priority 13]
          - validations[priority 14]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / constraint_beats_temporal_on_duplicate_assignment"
          rationale: >-
            The §1.8 instance asserts that a second assignment on the very same slot reports
            ERR_DUPLICATE_ASSIGNMENT rather than the ERR_SHIFT_REST_CONFLICT it also implies, which is
            this pair.

      - name: checkin_outside_an_in_progress_event_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 11]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / checkin_requires_event_in_progress"
          rationale: >-
            The §1.8 instance walks the same assignment through FORECAST, PLANNED, IN_PROGRESS and
            CLOSED parent events and asserts ERR_EVENT_STATE_INVALID everywhere except IN_PROGRESS,
            which is the cross-entity validation claim for CHECK_IN.

      - name: rest_buffer_of_exactly_thirty_minutes_is_allowed
        claim_type: temporal_validation
        grounds:
          - validations[priority 14]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / shift_rest_buffer_exact_30_minute_gap"
          rationale: >-
            The §1.8 instance tests the 29 / 30 / 31-minute gaps around REST_BUFFER_MINUTES and
            asserts ERR_SHIFT_REST_CONFLICT only below 30, covering the temporal rule's boundary.

      - name: accessibility_units_aggregate_over_the_overlap_window
        claim_type: aggregate_validation
        grounds:
          - validations[priority 18]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / accessibility_peak_units_half_open_slices"
          rationale: >-
            The §1.8 instance builds three individually-valid requests whose collective peak exceeds
            unit_count and asserts ERR_ACCESSIBILITY_CAPACITY_EXCEEDED, which is the aggregate
            validation claim.

  # ===================================================================================
  # 5. From Table 5 (Endpoints) - §1.5 surface: 66 endpoints spanning standard CRUD,
  #    action, bulk-action, cross-reference, computed-read and conditional-action shapes
  # ===================================================================================
  - section: endpoints
    instances:
      - name: position_type_crud_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /position-types]
          - endpoints[GET /position-types/{id}]
          - endpoints[PATCH /position-types/{id}]
          - endpoints[GET /position-types]
          - entities.PositionType
        distinguishing_aspect: >-
          The full create / read / update / list cycle on the one entity that has no state machine:
          the PATCH bumps version 1 -> 2 and retunes the rate, the list comes back ordered by code ASC
          rather than by insertion order, and the code filter narrows it to one row.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z. No other fixtures."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
          trigger:
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4, required_certifications: ["EVACUATION_PROCEDURES"] }
              as: StaffingCoordinator
              captures: { pt_usher: $.data.id, pt_v1: $.data.version, tip_default: $.data.is_tip_eligible, contracted_default: $.data.is_contracted_position }
            - call: "GET /position-types/${pt_usher}"
              as: GuestExperienceDirector
              captures: { read_rate: $.data.base_hourly_rate_cents, read_min: $.data.min_headcount }
            - call: "PATCH /position-types/${pt_usher}"
              payload: { base_hourly_rate_cents: 2600, min_headcount: 6, is_tip_eligible: true }
              as: StaffingCoordinator
              captures: { pt_v2: $.data.version, patched_rate: $.data.base_hourly_rate_cents }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_taker: $.data.id }
            - call: "POST /position-types"
              payload: { code: "ELEVATOR_OPERATOR", display_name: "Elevator Operator", base_hourly_rate_cents: 2400, attendance_ratio_per_1000: 0.2, min_headcount: 1, required_certifications: ["ELEVATOR_OPERATION"] }
              as: StaffingCoordinator
              captures: { pt_elev: $.data.id }
            - call: "GET /position-types?limit=10&offset=0"
              as: GuestServicesSupervisor
              captures: { list_total: $.meta.total_count, list_has_more: $.meta.has_more, first_code: "$.data[0].code" }
            - call: "GET /position-types?code=USHER&limit=10&offset=0"
              as: GuestServicesSupervisor
              captures: { filtered_total: $.meta.total_count }
          assert:
            - "the create returns 201 with ${pt_v1} == 1, ${tip_default} == false and ${contracted_default} == false"
            - "${read_rate} == 2200 and ${read_min} == 4 - the read returns exactly what was stored"
            - "the PATCH returns 200 with ${pt_v2} == 2, ${patched_rate} == 2600, min_headcount 6, is_tip_eligible true, display_name still 'Usher' and required_certifications still ['EVACUATION_PROCEDURES']"
            - "PositionType.${pt_usher}.updated_at == '2026-09-01T09:00:00Z' and created_at == '2026-09-01T09:00:00Z'"
            - "${list_total} == 3, ${list_has_more} == false and ${first_code} == 'ELEVATOR_OPERATOR' - the list is ordered by code ASC, not by creation order, so ${pt_elev} leads, ${pt_taker} follows and ${pt_usher} is last"
            - "${filtered_total} == 1"

      - name: position_slot_delete_returns_204_and_row_disappears
        claim_type: standard_crud
        grounds:
          - endpoints[DELETE /position-slots/{id}]
          - endpoints[GET /position-slots/{id}]
          - errors[ERR_PLAN_STATE_INVALID]
          - errors[ERR_POSITION_SLOT_NOT_FOUND]
          - calculations.staffing_plan_projected_labor_cost
        distinguishing_aspect: >-
          Delete is the one endpoint that returns 204 with no body, it re-derives the owning plan's
          four aggregates on the way out (57166 -> 40833), the row is genuinely gone rather than soft
          deleted, and the same call is refused with ERR_PLAN_STATE_INVALID once the plan leaves DRAFT.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T09:00:00Z."
            - "One PLANNED Event (expected_attendance 6000, TIER_1 x1.00) with a DRAFT plan carrying two TICKET_TAKER slots on an 18:00Z -> 22:05Z shift (245 minutes, 2000 cents/h): slot A at its derived headcount 5 (cost 40833) and slot B overridden to 2 (cost 16333)."
            - "No bids and no assignments anywhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Slot Delete Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 6000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v1: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 1, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z" }
              as: StaffingCoordinator
              captures: { slot_a: $.data.id, cost_a: $.data.slot_labor_cost_cents, req_a: $.data.required_headcount }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_id}", zone_code: "Z200", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:05:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_b: $.data.id, cost_b: $.data.slot_labor_cost_cents }
            - call: "GET /staffing-plans/${plan_id}"
              as: StaffingCoordinator
              captures: { base_before: $.data.base_labor_cost_cents, hc_before: $.data.total_required_headcount, proj_before: $.data.projected_labor_cost_cents }
          trigger:
            - call: "DELETE /position-slots/${slot_b}"
              as: StaffingCoordinator
            - call: "GET /staffing-plans/${plan_id}"
              as: StaffingCoordinator
              captures: { base_after: $.data.base_labor_cost_cents, hc_after: $.data.total_required_headcount, proj_after: $.data.projected_labor_cost_cents, surcharge_after: $.data.accessibility_surcharge_cents }
            - call: "GET /position-slots/${slot_b}"
              as: StaffingCoordinator
              captures: { err_gone: $.data.error_id }
            - call: "GET /position-slots?plan_id=${plan_id}&limit=10&offset=0"
              as: StaffingCoordinator
              captures: { slot_total: $.meta.total_count }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v1}" }
              as: StaffingCoordinator
            - call: "DELETE /position-slots/${slot_a}"
              as: StaffingCoordinator
              captures: { err_plan_state: $.data.error_id }
          assert:
            - "${req_a} == 5, ${cost_a} == 40833 and ${cost_b} == 16333"
            - "${base_before} == 57166, ${hc_before} == 7 and ${proj_before} == 57166"
            - "the DELETE returns HTTP 204 with no response body"
            - "${base_after} == 40833, ${hc_after} == 5, ${surcharge_after} == 0 and ${proj_after} == 40833 - the aggregates were re-derived from the surviving slot alone"
            - "${err_gone} == 'ERR_POSITION_SLOT_NOT_FOUND' with HTTP 404 - the row is deleted, not hidden"
            - "${slot_total} == 1"
            - "${err_plan_state} == 'ERR_PLAN_STATE_INVALID' with HTTP 409 once the plan is ACTIVE, and PositionSlot.${slot_a} still exists"

      - name: run_bid_award_batch_mixes_award_waitlist_and_decline
        claim_type: bulk_action
        grounds:
          - endpoints[POST /position-slots/{id}/run-bid-award]
          - calculations.staff_member_reliability_score
          - state_machines.ShiftBid.SUBMITTED_to_AWARDED
          - state_machines.ShiftBid.SUBMITTED_to_WAITLISTED
          - state_machines.ShiftBid.SUBMITTED_to_DECLINED_BY_SYSTEM
        distinguishing_aspect: >-
          One batch call produces three different per-item outcomes in one deterministic pass: with
          four bids on a slot of capacity 2, the two most senior certified bidders are AWARDED with
          rank_score 100, the third is WAITLISTED with CAPACITY_EXHAUSTED, and the uncertified fourth
          is DECLINED_BY_SYSTEM with CERTIFICATION_MISSING - a skip, not a rollback of the whole run.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T10:00:00Z."
            - "One PLANNED Event (expected_attendance 6000) whose ACTIVE plan carries one TICKET_TAKER slot requiring CODE_OF_CONDUCT, required_headcount_override 2, 18:00Z -> 22:05Z."
            - "Four ACTIVE members, all with the default reliability_score 100 so seniority alone ranks them: m1 (2018-01-01), m2 (2019-01-01), m3 (2020-01-01), m4 (2021-01-01)."
            - "m1, m2 and m3 hold VALID CODE_OF_CONDUCT certifications; m4 holds none."
            - "All four have filed SUBMITTED bids on the slot, in the order m4, m3, m2, m1 so that creation order cannot be mistaken for ranking order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T10:00:00Z" }
