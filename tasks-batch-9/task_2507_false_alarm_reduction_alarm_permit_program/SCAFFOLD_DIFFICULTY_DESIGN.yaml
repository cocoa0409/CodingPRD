      - name: occurrence_index_permit_year_resets_at_renewal_and_suppresses_the_same_fee
        grounds:
          - calculations.false_alarm_occurrence_index
          - calculations.escalating_false_alarm_fee
          - calculations.invoice_assembly
          - entities.FeeSchedule.fields.counting_window_mode
          - entities.AlarmSite.fields.chargeable_count_window
          - state_machines.AlarmPermit.RENEWAL_DUE_to_ACTIVE
        distinguishing_aspect: >-
          With byte-identical site, system, contact and incident data, flipping only
          counting_window_mode to PERMIT_YEAR makes the 2025-12-15 renewal reset the governing
          counter, so the 2026-02-10 incident is occurrence_index 2, falls inside the
          free_alarm_allowance of 2, is assessed 0 cents, and produces no FALSE_ALARM_FEE
          invoice at all — while chargeable_count_rolling_365 still reads 4.
        test_recipe:
          setup:
            - "Identical fixture to occurrence_index_rolling_365_counts_across_the_renewal_boundary except the ACTIVE FeeSchedule has counting_window_mode = PERMIT_YEAR."
            - "Same two ECV contacts, same four PERMITTED systems, same four renewals on 2025-12-15, same four incident dates."
            - "Balance after setup is 4 permit-issue invoices (5000 + 500 admin, then one 550 late penalty at the 2025-12-15 nightly = 6050 each) plus 4 renewal invoices (3000 + 500 admin = 3500 each)."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2025-01-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
              payload:
                <<: *fs_base
                schedule_code: "FS-2507-PY"
                counting_window_mode: "PERMIT_YEAR"
              as: ProgramAdministrator
              captures: {sched_id: $.data.id}
            - {call: "POST /false-alarm-program/fee-schedules/${sched_id}/activate", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Sentinel Monitoring LLC", license_number: "AC-2507-002", contact_email: "ops2@sentinel2507.example", contact_phone: "+15550100102", score_mode: "VOLUME_WEIGHTED"}, as: ProgramAdministrator, captures: {company_id: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-PY-118-ROLLING-WAY", street_address: "118 Rolling Way", city: "Fairview", zip_code: "44011", occupancy_class: "RESIDENTIAL", police_beat: "B12"}, as: ProgramAdministrator, captures: {site_id: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Dana Reyes", phone_number: "+15550100201", relationship: "OWNER", contact_priority: 1, is_ecv_callable: true}, as: ProgramAdministrator, captures: {c1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Marco Reyes", phone_number: "+15550100202", relationship: "KEYHOLDER", contact_priority: 2, is_ecv_callable: true}, as: ProgramAdministrator, captures: {c2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 8, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2024-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys1: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 6, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2024-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 4, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2024-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys3: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 4, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2024-12-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys4: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys1}/approve-registration", payload: {}, as: PermitClerk, captures: {permit1: $.data.id}}
