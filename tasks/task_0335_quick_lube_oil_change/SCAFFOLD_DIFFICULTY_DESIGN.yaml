            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_a}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 22000 }
              as: ServiceAdvisor
              captures: { wo_a: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_b}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 23000, coupon_code: "NOPE_NO_SUCH" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
