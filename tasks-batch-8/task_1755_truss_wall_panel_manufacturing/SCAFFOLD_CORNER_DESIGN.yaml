  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "No X-User-Role/X-User-ID at all -> 401 ERR_UNAUTHENTICATED before any role/existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/jobs", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED with HTTP 401"

      - name: unknown_resource_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /plant/jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND with HTTP 404"

      - name: existence_validated_left_to_right_path_before_body
        claim_type: priority_ordering
        grounds: ["validations[priority=4]"]
        distinguishing_aspect: "POST /plant/jobs/{bad}/designs with a bogus path job AND a bogus supersedes_design_id in the body fails on the path job first (left-to-right), and still 404 — the body FK and the OCC check (priority 6) are never reached."
        test_recipe:
          setup: ["a real customer and job exist so expected_job_version carries a server-issued value"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Real Job", jobsite_address: "40 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { real_job: $.data.id, job_v: $.data.version } }
          trigger:
            - { call: "POST /plant/jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v}", supersedes_design_id: "7b3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d3" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND with HTTP 404 (path segment job resolved before body FK)"

      - name: role_check_precedes_existence_check
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=4]"]
        distinguishing_aspect: "A role that is forbidden for the endpoint AND a non-existent path id together -> 403 ERR_FORBIDDEN_ROLE (priority 2 beats 404 priority 4)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plant/jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/confirm", as: ShopFloorLead, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_FORBIDDEN_ROLE with HTTP 403 even though the job does not exist"

      - name: clock_default_and_slot_in_past_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=33]", "errors[ERR_SLOT_IN_PAST]"]
        distinguishing_aspect: "With no set_current_utc call the logical clock is exactly 2026-08-01T00:00:00Z: a slot starting 2026-07-31 is rejected, one starting exactly 2026-08-01T00:00:00Z accepted; after moving the clock to 2026-08-05, a 2026-08-04 slot is rejected."
        test_recipe:
          setup: ["crane CR-C ACTIVE; no clock calls yet"]
          setup_api_calls:
            - { call: "POST /plant/cranes", payload: { crane_code: "CR-C", capacity_lbs: 8000, crane_class: "STANDARD", hourly_rate_cents: 15000 }, as: PlantManager, captures: { cr: $.data.id, cr_v: $.data.version } }
          trigger:
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-07-31T10:00:00Z", end_at: "2026-07-31T12:00:00Z", expected_crane_version: "${cr_v}" }, as: ProductionPlanner, captures: { err1: $.data.error_id } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-01T02:00:00Z", expected_crane_version: "${cr_v}" }, as: ProductionPlanner, captures: { s1: $.data.id } }
            - { call: "POST /plant/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: PlantManager }
            - { call: "GET /plant/cranes/${cr}", as: PlantManager, captures: { cr_v2: $.data.version } }
            - { call: "POST /plant/crane-slots", payload: { crane_id: "${cr}", purpose: "BUILD_PICK", start_at: "2026-08-04T10:00:00Z", end_at: "2026-08-04T12:00:00Z", expected_crane_version: "${cr_v2}" }, as: ProductionPlanner, captures: { err2: $.data.error_id } }
          assert:
            - "${err1} == ERR_SLOT_IN_PAST (default clock 2026-08-01T00:00:00Z makes 2026-07-31 past)"
            - "start_at == clock exactly ACCEPTED: CraneSlot.${s1} created (>= semantics)"
            - "${err2} == ERR_SLOT_IN_PAST after clock moved to 2026-08-05"

      - name: duplicate_component_ref_and_broken_revision_chain
        claim_type: violation_to_error
        grounds: ["validations[priority=28]", "validations[priority=29]", "errors[ERR_DUPLICATE_COMPONENT_REF]", "errors[ERR_REVISION_CHAIN_BROKEN]"]
        distinguishing_aspect: "Second DRAFT for a component_ref with an open revision -> ERR_DUPLICATE_COMPONENT_REF; supersedes_design_id pointing at a non-SEALED design -> ERR_REVISION_CHAIN_BROKEN; both after OCC passes so job version is unchanged."
        test_recipe:
          setup: ["job confirmed (version 2); design TR-01 in DRAFT"]
          setup_api_calls:
            - { call: "POST /plant/customer-accounts", payload: { company_name: "Acme", credit_limit_cents: 500000, delivery_terms: "DELIVERED" }, as: PlantManager, captures: { cust: $.data.id } }
            - { call: "POST /plant/engineers", payload: { full_name: "E1", license_number: "PE-1", license_state: "GA", license_expiry: "2027-06-30T00:00:00Z", seal_authority: "TRUSS_AND_PANEL" }, as: PlantManager, captures: { eng1: $.data.id } }
            - { call: "POST /plant/jobs", payload: { customer_id: "${cust}", job_name: "Dup Job", jobsite_address: "20 Nowhere", jobsite_state: "GA", delivery_window_start: "2026-08-20T00:00:00Z", delivery_window_end: "2026-08-27T00:00:00Z", contracted_value_cents: 100000 }, as: PlantManager, captures: { job: $.data.id, job_v: $.data.version } }
            - { call: "POST /plant/jobs/${job}/confirm", as: PlantManager, captures: { job_v2: $.data.version } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v2}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { dsg: $.data.id } }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v3: $.data.version } }
          trigger:
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-01", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, expected_job_version: "${job_v3}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { err1: $.data.error_id } }
            - { call: "POST /plant/jobs/${job}/designs", payload: { component_ref: "TR-99", component_type: "ROOF_TRUSS", span_ft: 30.0, pitch_degrees: 22.62, design_load_psf: 40.0, lumber_grade: "SYP_NO1", plating: "P18", quantity_required: 4, supersedes_design_id: "${dsg}", expected_job_version: "${job_v3}" }, as: DesignEngineer, as_user_id: "${eng1}", captures: { err2: $.data.error_id } }
            - { call: "GET /plant/jobs/${job}", as: PlantManager, captures: { job_v4: $.data.version } }
          assert:
            - "${err1} == ERR_DUPLICATE_COMPONENT_REF (open DRAFT revision exists for TR-01)"
            - "${err2} == ERR_REVISION_CHAIN_BROKEN (supersedes target ${dsg} is DRAFT, not SEALED)"
            - "${job_v4} == ${job_v3} (rejected creates never bumped Job.version)"

      - name: reservation_kind_mismatch_and_insufficient_inventory
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "validations[priority=26]", "errors[ERR_RESERVATION_KIND_MISMATCH]", "errors[ERR_INSUFFICIENT_INVENTORY]"]
        distinguishing_aspect: "Lumber reservation pointing at a plate lot, a lumber reservation whose lot grade differs from the design grade, and an over-availability reservation are each rejected with their distinct error; successful reservation reads back RESERVED."
