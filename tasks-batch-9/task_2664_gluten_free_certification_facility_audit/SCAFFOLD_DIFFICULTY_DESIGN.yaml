  - rule_id: boundary_precision_check
    instances:
      - name: lot_verdict_and_critical_severity_strict_greater_than_boundaries
        grounds:
          - calculations.lot_test_verdict
          - entities.LotTest.fields.threshold_applied_ppm
          - entities.LotTest.fields.verdict
          - entities.LotTest.fields.nonconformance_created
          - state_machines.Certificate.ISSUED_to_SUSPENDED
          - calculations.open_nc_penalty_points
          - validations.priority_37
        distinguishing_aspect: |
          Two strict-greater-than boundaries ride on the same decimal input against an integer
          threshold of 10: 10.0 PASSES and 10.1 FAILS on the verdict edge, while 20.0 (exactly
          CRITICAL_EXCEEDANCE_FACTOR * threshold) is MAJOR and 20.1 is CRITICAL on the severity
          edge. Any >= comparison, any rounding of ppm_result to an integer, or any float
          comparison that treats 10.1 as 10 collapses one of the four cases. The failing lot is
          also test_type-sensitive: only the UNANNOUNCED failure suspends the certificate, and the
          later FOR_CAUSE failures must not suspend it a second time.
        test_recipe:
          setup:
            - "The canonical certified product: threshold_ppm 10, sampling_lots_per_year 2, sampling_exclusion_days 182, certificate issued 2026-08-11T00:00:00Z."
            - "The clock is moved to 2026-08-12T00:00:00Z and every sample is collected on that same day so priority 36 cannot fire."
            - "Lot L-1001 is SCHEDULED with ppm_result 10.0 (exactly the threshold, PASSES) and sets last_scheduled_sample_on; every later lot uses UNANNOUNCED or FOR_CAUSE so the SCHEDULED exclusion window of 182 days is never violated."
            - "Lot L-1002 is UNANNOUNCED with ppm_result 10.1 (FAIL, MAJOR) and suspends the certificate with suspension_reason FAILED_UNANNOUNCED_TEST; lot L-1003 is FOR_CAUSE with ppm_result 20.0 (FAIL, MAJOR because the CRITICAL edge is strict)."
