# =============================================================================
# Freight Brokerage Platform — Scaffold Difficulty Design (§1.8)
#
# Test Targeting Index — cross-references every Difficulty Rule (§0.5) against
# concrete grounds in SCAFFOLD.yaml's §1.1–§1.7 and supplies an empty-DB test
# recipe per instance. ≥2 instances per rule_id → ≥18 instances total.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_linehaul_spot_vs_contract_on_quote_request
        grounds:
          - calculations.quote_linehaul
          - calculations.quote_linehaul.variants.contract
          - calculations.quote_linehaul.variants.spot
          - entities.QuoteRequest.fields.rate_source
          - entities.QuoteRequest.fields.quoted_linehaul_cents
          - state_machines.QuoteRequest.OPEN_to_QUOTED
        distinguishing_aspect: |
          On the QuoteRequest entity (pricing domain), the same lane/equipment can
          produce two different quoted_linehaul_cents values depending on whether
          a matching ACTIVE RateContract is referenced — the CONTRACT variant
          returns RateContract.flat_rate_cents, while the SPOT variant returns
          SPOT_BASE_CENTS_PER_EQUIPMENT[eq] + distance_units * SPOT_PER_UNIT_CENTS[eq].
        test_recipe:
          setup:
            - "POST /brokerages → Brokerage B with factoring_reserve_pct=5.00, detention_free_minutes=120, detention_rate_cents_per_15min=1500"
            - "POST /brokerages/B/shippers → Shipper S with credit_limit_cents=10_000_000, smartway_required=false"
            - "POST /brokerages/B/rate-contracts → RC for shipper=S, lane=10001→20002, equipment=DRY_VAN, flat_rate_cents=88888, effective_from=now-1d, effective_to=now+30d, status=ACTIVE"
            - "POST /brokerages/B/shippers/S/quote-requests → Q1 with rate_contract_id=RC.id, origin=10001, dest=20002, equipment=DRY_VAN (CONTRACT path)"
            - "POST /brokerages/B/shippers/S/quote-requests → Q2 with rate_contract_id=null, origin=10001, dest=20002, equipment=DRY_VAN (SPOT path)"
          trigger:
            - "POST /brokerages/B/shippers/S/quote-requests/Q1/quote"
            - "POST /brokerages/B/shippers/S/quote-requests/Q2/quote"
          assert:
            - "Q1.rate_source == 'CONTRACT'"
            - "Q1.quoted_linehaul_cents == 88888"
            - "Q2.rate_source == 'SPOT'"
            - "Q2.quoted_linehaul_cents == 130010   # 30000 + 10001*10"
            - "Q1.quoted_linehaul_cents != Q2.quoted_linehaul_cents"

      - name: detention_provisional_vs_final_on_load
        grounds:
          - calculations.detention_provisional
          - calculations.detention_final
          - entities.Load.fields.provisional_detention_cents
          - entities.Load.fields.final_detention_cents
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
          - state_machines.Load.DELIVERED_to_INVOICED
        distinguishing_aspect: |
          On the Load entity (operations/billing domain — STRUCTURALLY DIFFERENT
          from Rule 1's first instance which sits on the QuoteRequest pricing
          domain), the same actual_arrive_at/actual_depart_at can produce
          different detention cents at /deliver versus /invoice when Brokerage
          detention_free_minutes or detention_rate_cents_per_15min are updated
          between the two transitions.
        test_recipe:
          setup:
            - "Run quote_linehaul_spot_vs_contract path through ACCEPTED Q1 (CONTRACT, 88888 cents)"
            - "POST /carriers → Carrier C with insurance_expires_on=now+90d, smartway_certified=true; /qualify"
            - "POST /loads → L tendered on Q1 to C; /carrier-accept; /depart"
            - "POST /loads/L/deliver with actual_arrive_at=now, actual_depart_at=now+225min (using current Brokerage settings free=120, rate=1500)"
            - "PATCH Brokerage B → detention_free_minutes=60, detention_rate_cents_per_15min=2000 (settings updated between deliver and invoice)"
          trigger:
            - "POST /loads/L/invoice"
          assert:
            - "L.provisional_detention_cents == 10500   # ceil((225-120)/15)*1500 = 7*1500"
            - "L.final_detention_cents == 22000         # ceil((225-60)/15)*2000 = 11*2000"
            - "L.provisional_detention_cents != L.final_detention_cents"
            - "Invoice.detention_cents == 22000        # frozen from final"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_factoring_haircut_three_input_modes
        grounds:
          - calculations.factoring_haircut
          - entities.FactoringAdvance.fields.haircut_cents
          - entities.FactoringAdvance.fields.reserve_cents
          - entities.FactoringAdvance.fields.advanced_cents
          - entities.Brokerage.fields.factoring_reserve_pct
        distinguishing_aspect: |
          MODE (a): non-linear formula with ≥3 inputs (T, reserve_pct, tier
          constants) selecting tier slices via nested min/max, with rate that
          depends on which tier slice the bucket sits in — output advanced_cents
          depends jointly on three sources whose interaction is non-additive
          across tier boundaries.
        test_recipe:
          setup:
            - "Take an INVOICED Load L (from any prior recipe) whose Invoice.invoice_total_cents == 600_000 (construct via spot lane 0→57000 DRY_VAN = 30000+57000*10=600000 linehaul, zero detention, zero accessorial)"
            - "Brokerage B.factoring_reserve_pct = 5.00 (default)"
          trigger:
            - "POST /brokerages/B/invoices/{L.invoice_id}/factor"
          assert:
            - "FactoringAdvance.invoice_total_at_advance_cents == 600000"
            - "FactoringAdvance.haircut_cents == 12000   # 100k*0.030 + 400k*0.020 + 100k*0.010 = 3000+8000+1000"
            - "FactoringAdvance.reserve_cents == 30000   # round_half_up(600000 * 5.00 / 100)"
            - "FactoringAdvance.advanced_cents == 558000 # 600000 - 12000 - 30000"

      - name: detention_pinned_ceil_then_multiply_rounding_order
        grounds:
          - calculations.detention_provisional
          - calculations.detention_provisional.constants.ROUNDING_ORDER
          - entities.Load.fields.provisional_detention_cents
        distinguishing_aspect: |
          MODE (b): pinned multi-step rounding order. "Ceil-to-15min-increment
          FIRST, then multiply by rate" produces 1500 cents for 1 chargeable
          minute at 1500 cents/15min; the FORBIDDEN order (multiply by
          per-minute rate then ceil to cent) produces 100 cents. The scaffold
          fixes the former and the test asserts that exact cents value, falsifying
          any implementation that reorders the operations. This is a DIFFERENT
          MODE from Rule 2's first instance (which sits in mode (a)).
        test_recipe:
          setup:
            - "Brokerage B with detention_free_minutes=120, detention_rate_cents_per_15min=1500 (unchanged)"
            - "Construct a Load L: spot DRY_VAN 0→1000 → linehaul 30000+1000*10=40000; carrier QUALIFIED; tendered, accepted, departed"
          trigger:
            - "POST /loads/L/deliver with actual_arrive_at=now, actual_depart_at=now+121min (1 chargeable minute past free)"
          assert:
            - "L.provisional_detention_cents == 1500   # ceil(1/15)=1 increment * 1500; NOT 100 which would be the forbidden multiply-then-ceil order"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_claim_review_counter_cycle
        grounds:
          - state_machines.DisputeClaim.IN_REVIEW_to_COUNTER_OFFERED
          - state_machines.DisputeClaim.COUNTER_OFFERED_to_IN_REVIEW
          - endpoints["POST /brokerages/{brokerageId}/dispute-claims/{claimId}/counter"]
          - endpoints["POST /brokerages/{brokerageId}/dispute-claims/{claimId}/reject-counter"]
        distinguishing_aspect: |
          The DisputeClaim state machine contains a CYCLE: IN_REVIEW →
          COUNTER_OFFERED via /counter, and COUNTER_OFFERED → IN_REVIEW via
          /reject-counter. The same claim can oscillate between these two
          non-terminal states arbitrarily many times — a property a linear A→B→C
          pipeline cannot exhibit. Sits on DisputeClaim.
        test_recipe:
          setup:
            - "Reach a DisputeClaim DC in IN_REVIEW state on an INVOICED Load (linehaul 40000, no detention, no accessorial → invoice_total 40000)"
            - "ShipperUser files dispute claimed_cents=10000; BrokerOps /start-review"
          trigger:
            - "POST /dispute-claims/DC/counter   counter_offer_cents=4000  → COUNTER_OFFERED"
            - "POST /dispute-claims/DC/reject-counter                       → IN_REVIEW (counter_offer_cents cleared)"
            - "POST /dispute-claims/DC/counter   counter_offer_cents=5000  → COUNTER_OFFERED (2nd round)"
            - "POST /dispute-claims/DC/reject-counter                       → IN_REVIEW (2nd cycle)"
          assert:
            - "After step 2: DC.status == 'IN_REVIEW' AND DC.counter_offer_cents IS NULL"
            - "After step 3: DC.status == 'COUNTER_OFFERED' AND DC.counter_offer_cents == 5000"
            - "After step 4: DC.status == 'IN_REVIEW' AND DC.counter_offer_cents IS NULL"

      - name: invoice_parallel_factoring_and_settlement_dimensions
        grounds:
          - state_machines.Invoice
          - entities.Invoice.fields.factoring_status
          - entities.Invoice.fields.settlement_status
          - state_machines.Invoice.NOT_FACTORED_to_FACTORED
          - state_machines.Invoice.FACTORED_to_RECOURSED
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.Invoice.ISSUED_to_WRITTEN_OFF
        distinguishing_aspect: |
          The Invoice entity carries TWO INDEPENDENT state dimensions —
          factoring_status (NOT_FACTORED|FACTORED|RECOURSED) and
          settlement_status (ISSUED|PAID|WRITTEN_OFF) — that evolve on the same
          row driven by different triggers (the parallel non-linear shape from
          §0.5 §1.2). Sits on Invoice (DIFFERENT entity from Rule 3's first
          instance which sits on DisputeClaim).
        test_recipe:
          setup:
            - "Build an INVOICED Load L with Invoice INV; invoice_total_cents = 46500 (linehaul 40000 + detention 1500 + accessorial 5000)"
          trigger:
            - "POST /invoices/INV/factor   → factoring_status=FACTORED, settlement_status still=ISSUED"
            - "(no settlement transition fires because Invoice.factoring_status != NOT_FACTORED — ISSUED → PAID guard)"
          assert:
            - "INV.factoring_status == 'FACTORED'"
            - "INV.settlement_status == 'ISSUED'  # parallel: changing factoring did NOT auto-complete settlement"
            - "INV.amount_paid_cents == 46500     # face value applied"
            - "INV.balance_due_cents == 0         # but ISSUED→PAID guarded by factoring_status != FACTORED"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: dispute_resolve_cascades_through_invoice_then_settlement_then_shipper_credit
        grounds:
          - state_machines.DisputeClaim.IN_REVIEW_to_RESOLVED
          - calculations.claim_credit_application
          - state_machines.Invoice.ISSUED_to_PAID
          - entities.Invoice.fields.amount_credited_cents
          - entities.Invoice.fields.invoice_total_cents
          - entities.Invoice.fields.balance_due_cents
          - entities.Shipper.fields.outstanding_invoiced_cents
        distinguishing_aspect: |
          Three-hop cascade in which every link is the CONSEQUENCE of the
          previous link, not a fan-out from the original /resolve trigger:
          (Hop 1) /resolve mutates DisputeClaim.status → RESOLVED, which by
          claim_credit_application (Hop 2) mutates Invoice.invoice_total_cents
          and Invoice.amount_credited_cents, driving Invoice.balance_due_cents
          to 0. (Hop 3) BECAUSE balance_due_cents reached 0 AND
          factoring_status != FACTORED, the automatic Invoice ISSUED → PAID
          settlement transition fires, which (Hop 4) decrements
          Shipper.outstanding_invoiced_cents by the original Invoice face
          value. Each hop is the consequence of the previous hop's mutation —
          /resolve does NOT directly mutate Shipper.outstanding_invoiced_cents;
          the settlement transition does, and the settlement transition only
          fires because balance_due_cents was driven to 0 by the credit
          application from hop 2.
        test_recipe:
          setup:
            - "Brokerage B with defaults; Shipper S smartway_required=false credit_limit_cents=200000"
            - "Build INVOICED Load L on Shipper S, qualified Carrier C: spot DRY_VAN 0→1000 → linehaul_cents=40000; deliver with depart=arrive+120min (detention=0 at free boundary); no accessorials; Invoice INV: invoice_total_cents=40000, balance_due_cents=40000; Shipper.outstanding_invoiced_cents=40000 (incremented by /invoice)"
            - "ShipperUser POST /invoices/INV/dispute-claims claim_type=DAMAGE claimed_cents=40000 → DC.status=OPEN (claimed_cents == balance_due_cents, allowed)"
            - "BrokerOps POST /dispute-claims/DC/start-review → DC.status=IN_REVIEW"
          trigger:
            - "POST /dispute-claims/DC/resolve  settled_credit_cents=40000   (full credit)"
          assert:
            - "DC.status == 'RESOLVED' AND DC.settled_credit_cents == 40000                     # hop 1"
            - "Invoice.invoice_total_cents == 0      # 40000 - 40000                              # hop 2 caused by hop 1 via claim_credit_application"
            - "Invoice.amount_credited_cents == 40000                                              # hop 2"
            - "Invoice.balance_due_cents == 0        # max(0, 0 - 0 - 40000)                       # hop 2"
            - "Invoice.settlement_status == 'PAID'   # auto-transition because balance==0 AND factoring_status != FACTORED # hop 3 caused by hop 2"
            - "Shipper.outstanding_invoiced_cents == 0   # 40000 - 40000 (invoice face value)      # hop 4 caused by hop 3"
        note: "Cascade depth = 4 (DisputeClaim → Invoice credit fields → Invoice.settlement_status → Shipper.outstanding_invoiced_cents). Satisfies the ≥3 depth quota of Rule 4."

      - name: writeoff_cascades_through_invoice_credit_to_shipper_outstanding
        grounds:
          - state_machines.Invoice.ISSUED_to_WRITTEN_OFF
          - entities.Invoice.fields.amount_credited_cents
          - entities.Invoice.fields.balance_due_cents
          - entities.Shipper.fields.outstanding_invoiced_cents
        distinguishing_aspect: |
          Depth-2 cascade originating from a DIFFERENT trigger than Rule 4's
          first instance (DisputeClaim /resolve): here the trigger is BrokerOps
          POST /invoices/{id}/write-off. (Hop 1) the /write-off transition
          mutates Invoice.amount_credited_cents to drive balance_due_cents to 0
          and flips Invoice.settlement_status → WRITTEN_OFF. (Hop 2) BECAUSE
          settlement_status flipped to a terminal state, the side-effect
          decrements Shipper.outstanding_invoiced_cents by the original
          invoice_total_cents. Hop 2 is a consequence of hop 1 — /write-off
          does not directly write to Shipper; the settlement-transition
          side-effect does.
        test_recipe:
          setup:
            - "Brokerage B; Shipper S with credit_limit_cents=200000; baseline outstanding_invoiced_cents=0"
            - "Build INVOICED Load L with Invoice INV: linehaul=40000 (spot DRY_VAN 0→1000), detention=1500 (depart=arrive+121min, 1 chargeable min), accessorial=5000 (1 APPROVED LUMPER), invoice_total_cents=46500"
            - "After /invoice: Shipper.outstanding_invoiced_cents == 46500"
          trigger:
            - "POST /invoices/INV/write-off"
          assert:
            - "Invoice.settlement_status == 'WRITTEN_OFF'                                       # hop 1"
            - "Invoice.amount_credited_cents == 46500                                            # hop 1"
            - "Invoice.balance_due_cents == 0                                                    # hop 1"
            - "Shipper.outstanding_invoiced_cents == 0     # decremented by original 46500       # hop 2 caused by hop 1"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_load_carrier_accept
        grounds:
          - validations[priority=5]   # state precondition: ERR_LOAD_NOT_TENDERED
          - validations[priority=6]   # business_safety: ERR_CARRIER_NOT_QUALIFIED
          - state_machines.Load.TENDERED_to_ACCEPTED
        distinguishing_aspect: |
          Pair {state, business_safety}: when CarrierUser calls /carrier-accept
          on a load that is ALREADY in ACCEPTED state AND whose carrier is also
          not QUALIFIED, both checks fail — the scaffold pins state (priority 5)
          to fire BEFORE business_safety (priority 6), so the response must be
          ERR_LOAD_NOT_TENDERED, not ERR_CARRIER_NOT_QUALIFIED.
        test_recipe:
          setup:
            - "Brokerage B; Shipper S; Carrier C QUALIFIED with insurance valid"
            - "Build Load L via accepted quote and /carrier-accept once (status now ACCEPTED)"
            - "POST /carriers/C/suspend (carrier now SUSPENDED — fails priority 6 check)"
          trigger:
            - "POST /loads/L/carrier-accept   (X-User-Role=CarrierUser, X-User-ID=C)"
          assert:
            - "Response status == 409"
            - "Response.data.error_id == 'ERR_LOAD_NOT_TENDERED'   # state (P5) wins over business_safety (P6)"

      - name: business_fiscal_vs_business_temporal_quote_accept
        grounds:
          - validations[priority=15]  # business_fiscal: ERR_SHIPPER_CREDIT_LIMIT_EXCEEDED
          - validations[priority=16]  # business_temporal: ERR_QUOTE_EXPIRED
          - state_machines.QuoteRequest.QUOTED_to_ACCEPTED
        distinguishing_aspect: |
          DIFFERENT category pair from Rule 5's first instance ({state,
          business_safety}). Here the pair is {business_fiscal,
          business_temporal}. When ShipperUser calls /accept on a QUOTED quote
          that is BOTH past pickup_window_end (P16) AND would cause
          outstanding + quoted_linehaul to exceed credit_limit (P15), both
          checks fail — the scaffold pins lower priority number first, so P15
          fires before P16. Response MUST be ERR_SHIPPER_CREDIT_LIMIT_EXCEEDED,
          not ERR_QUOTE_EXPIRED.
        test_recipe:
          setup:
            - "Brokerage B with default clock"
            - "Shipper S with credit_limit_cents=50000; create a prior INVOICED Load so Shipper.outstanding_invoiced_cents=40000 (linehaul 40000, no detention, no accessorial)"
            - "POST /quote-requests Q with pickup_window_end = t_q (some clock time T); broker /quote, forcing quoted_linehaul_cents == 20000 (so outstanding+new=60000 > 50000)"
            - "POST /_clock/advance to t = t_q + 1 minute (now Q is past pickup_window_end). Use POST /_sweep/expire-quotes only AFTER the trigger if needed; before the trigger, Q.status MUST still be QUOTED (no sweep yet) so the temporal check fires at /accept time, not auto-expiry."
          trigger:
            - "POST /quote-requests/Q/accept   (X-User-Role=ShipperUser, X-User-ID=S)"
          assert:
            - "Response status == 402"
            - "Response.data.error_id == 'ERR_SHIPPER_CREDIT_LIMIT_EXCEEDED'   # business_fiscal (P15) wins over business_temporal (P16); lower priority number fires first"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: detention_free_minutes_boundary_inclusive
        grounds:
          - calculations.detention_provisional
          - entities.Brokerage.fields.detention_free_minutes
          - state_machines.Load.IN_TRANSIT_to_DELIVERED
          - endpoints["POST /brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/deliver"]
        distinguishing_aspect: |
          Numeric threshold crossing on a TIME metric reachable through
          POST /loads/{id}/deliver. Free time is 120 minutes; at exactly 120
          minutes elapsed (chargeable_minutes = max(0, 120-120) = 0 → 0
          increments → 0 cents). At 121 minutes elapsed → 1 chargeable minute
          → ceil(1/15)=1 increment → 1500 cents. This boundary uses the
          `max(0, elapsed - free)` form which is "elapsed > free" exclusive,
          NOT "elapsed >= free" — falsifies any implementation using the wrong
          comparator.
        test_recipe:
          setup:
            - "Brokerage B detention_free_minutes=120, detention_rate_cents_per_15min=1500; Load L1 and L2 both IN_TRANSIT"
          trigger:
            - "POST /loads/L1/deliver  actual_depart_at = actual_arrive_at + 120 min exactly"
            - "POST /loads/L2/deliver  actual_depart_at = actual_arrive_at + 121 min"
          assert:
            - "L1.provisional_detention_cents == 0      # boundary inclusive: 120 min is free"
            - "L2.provisional_detention_cents == 1500   # 1 min over → 1 increment → 1500"

      - name: dispute_claimed_zero_amount_empty_boundary
        grounds:
          - validations[priority=12]   # ERR_CLAIM_AMOUNT_INVALID
          - entities.DisputeClaim.fields.claimed_cents
          - endpoints["POST /brokerages/{brokerageId}/invoices/{invoiceId}/dispute-claims"]
        distinguishing_aspect: |
          DIFFERENT metric and DIFFERENT endpoint from the first boundary
          instance: this is a zero-quantity / "empty" boundary on POST
          /invoices/{id}/dispute-claims. The validation pin is
          claimed_cents > 0 strictly; claimed_cents = 0 (zero count) and
          claimed_cents = -1 both fail with ERR_CLAIM_AMOUNT_INVALID, while
          claimed_cents = 1 is accepted. Falsifies any `>= 0` implementation.
        test_recipe:
          setup:
            - "INVOICED Load with Invoice INV (invoice_total_cents = 46500, balance_due_cents = 46500)"
          trigger:
            - "POST /invoices/INV/dispute-claims  claim_type=DAMAGE  claimed_cents=0   (Shipper)"
            - "POST /invoices/INV/dispute-claims  claim_type=DAMAGE  claimed_cents=1   (Shipper)"
          assert:
            - "First call: HTTP 422, error_id == 'ERR_CLAIM_AMOUNT_INVALID'"
            - "Second call: HTTP 201, DisputeClaim.status == 'OPEN', DisputeClaim.claimed_cents == 1"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: load_tender_depends_on_carrier_qualified_state
        grounds:
          - state_machines.Load
          - state_machines.Carrier
          - validations[priority=6]   # ERR_CARRIER_NOT_QUALIFIED
          - endpoints["POST /brokerages/{brokerageId}/shippers/{shipperId}/loads"]
        distinguishing_aspect: |
          Entity pair (Load, Carrier): the Load TENDERED creation transition is
          gated by Carrier.status — a Carrier in PENDING_QUALIFICATION or
          SUSPENDED or REVOKED cannot receive a tender. This is a precondition
          on a different entity's state from the entity being mutated.
        test_recipe:
          setup:
            - "Build accepted QuoteRequest Q (any path)"
            - "Carrier C in PENDING_QUALIFICATION (do NOT /qualify)"
          trigger:
            - "POST /brokerages/B/shippers/S/loads  body={quote_request_id: Q, carrier_id: C}"
          assert:
            - "Response status == 409 AND error_id == 'ERR_CARRIER_NOT_QUALIFIED'"
            - "No Load row was created (GET /shippers/S/loads returns empty)"

      - name: invoice_factor_depends_on_dispute_claim_state
        grounds:
          - state_machines.Invoice.NOT_FACTORED_to_FACTORED
          - state_machines.DisputeClaim
          - validations[priority=13]   # ERR_INVOICE_NOT_FACTORABLE (via open dispute) → uses ERR_INVOICE_HAS_OPEN_DISPUTE
          - endpoints["POST /brokerages/{brokerageId}/invoices/{invoiceId}/factor"]
        distinguishing_aspect: |
          DIFFERENT entity pair from Rule 7's first instance: (Invoice,
          DisputeClaim). Invoice.NOT_FACTORED → FACTORED is gated by the absence
          of any DisputeClaim on this invoice in OPEN/IN_REVIEW/COUNTER_OFFERED
          states. A claim that is RESOLVED or WITHDRAWN does NOT block factoring,
          but an OPEN one does — cross-entity state dependency between two
          aggregates.
        test_recipe:
          setup:
            - "INVOICED Load with Invoice INV (invoice_total_cents = 46500)"
            - "ShipperUser POST /invoices/INV/dispute-claims  claim_type=OVERCHARGE  claimed_cents=2000  → DC.status=OPEN"
          trigger:
            - "POST /invoices/INV/factor"
          assert:
            - "Response status == 409 AND error_id == 'ERR_INVOICE_HAS_OPEN_DISPUTE'"
            - "Invoice.factoring_status == 'NOT_FACTORED'  # gate held"
            - "No FactoringAdvance row created"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: rate_contract_half_open_interval_overlap_on_lane
        grounds:
          - entities.RateContract.fields.effective_from
          - entities.RateContract.fields.effective_to
          - validations[priority=10]   # ERR_RATE_CONTRACT_OVERLAP
          - endpoints["POST /brokerages/{brokerageId}/rate-contracts"]
        distinguishing_aspect: |
          Half-open interval semantics on the RateContract resource: two ACTIVE
          contracts on the same shipper+lane+equipment must satisfy
          [from_A, to_A) ∩ [from_B, to_B) == ∅. Boundary touch IS permitted
          (RC1.effective_to == RC2.effective_from is allowed because to is
          exclusive). Any other overlap is rejected with ERR_RATE_CONTRACT_OVERLAP.
        test_recipe:
          setup:
            - "Brokerage B; Shipper S; POST /rate-contracts RC1 shipper=S lane=10000→20000 eq=DRY_VAN flat=50000 effective_from=t0 effective_to=t0+30d"
          trigger:
            - "POST /rate-contracts RC2  same shipper+lane+equipment  effective_from=t0+30d  effective_to=t0+60d   (TOUCH at boundary)"
            - "POST /rate-contracts RC3  same shipper+lane+equipment  effective_from=t0+29d  effective_to=t0+50d   (1-day overlap)"
          assert:
            - "RC2 creation succeeds (201) — boundary touch allowed under half-open semantics"
            - "RC3 creation fails: HTTP 409, error_id == 'ERR_RATE_CONTRACT_OVERLAP'"

      - name: detention_free_window_aggregate_capacity_on_load
        grounds:
          - calculations.detention_provisional
          - entities.Brokerage.fields.detention_free_minutes
          - entities.Load.fields.actual_arrive_at
          - entities.Load.fields.actual_depart_at
          - endpoints["POST /brokerages/{brokerageId}/shippers/{shipperId}/loads/{loadId}/deliver"]
        distinguishing_aspect: |
          DIFFERENT interval semantics from RateContract's half-open
          [from, to) overlap: on Load, the [actual_arrive_at, actual_depart_at]
          interval is a closed range and the "overlap" with the FREE WINDOW is
          a SUBTRACTIVE-CAPACITY overlap — the first detention_free_minutes of
          interval-length are "free aggregate capacity" consumed before any
          chargeable cents accrue. Two loads can have identical interval lengths
          but different chargeable detention depending on the brokerage's free
          window. The geometric treatment is INCLUSIVE-INCLUSIVE on the arrival
          side and capacity-subtractive on the free minutes, structurally
          different from RateContract's half-open exclusion test.
        test_recipe:
          setup:
            - "Brokerage B detention_free_minutes=120, rate=1500; Load L1 and L2 IN_TRANSIT"
          trigger:
            - "POST /loads/L1/deliver  arrive=t0  depart=t0+119min   (interval-length 119, ENTIRELY inside free window)"
            - "POST /loads/L2/deliver  arrive=t0  depart=t0+150min   (interval-length 150, free consumed + 30 chargeable)"
          assert:
            - "L1.provisional_detention_cents == 0      # entirely inside free aggregate capacity"
            - "L2.provisional_detention_cents == 3000   # ceil(30/15)=2 increments × 1500 = 3000"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invoice_face_value_conservation_through_dispute_resolution
        grounds:
          - calculations.claim_credit_application
          - state_machines.DisputeClaim.IN_REVIEW_to_RESOLVED
          - entities.Invoice.fields.invoice_total_cents
          - entities.Invoice.fields.amount_credited_cents
          - entities.Invoice.fields.amount_paid_cents
          - entities.Invoice.fields.balance_due_cents
        distinguishing_aspect: |
          Conserved quantity: TOTAL_OBLIGATION_CENTS = Invoice.balance_due_cents
          + Invoice.amount_paid_cents + Invoice.amount_credited_cents must EQUAL
          the ORIGINAL Invoice face value at issuance, both before AND after a
          dispute /resolve. Concretely:
            invariant: invoice_total_cents_PRE_resolve ==
                       invoice_total_cents_POST_resolve + (amount_credited_POST - amount_credited_PRE)
          The /resolve action and its compensating arithmetic (decrement
          invoice_total_cents by exactly the credit amount, increment
          amount_credited_cents by the same amount) keep the obligation
          unchanged in aggregate — the credit just reassigns dollars between
          "still owed" and "credited away".
        test_recipe:
          setup:
            - "INVOICED Load with Invoice INV: invoice_total_cents=46500, amount_paid_cents=0, amount_credited_cents=0, balance_due_cents=46500"
            - "Record INV.invoice_total_cents_PRE = 46500"
            - "ShipperUser files DC claimed_cents=3000 claim_type=DAMAGE; BrokerOps /start-review"
          trigger:
            - "POST /dispute-claims/DC/resolve  settled_credit_cents=3000"
          assert:
            - "INV.invoice_total_cents     == 43500  # 46500 - 3000"
            - "INV.amount_credited_cents   == 3000"
            - "INV.amount_paid_cents       == 0"
            - "INV.balance_due_cents       == 40500"
            - "Invariant: 46500 == 43500 + 3000 - 0   # PRE_total == POST_total + credit_delta"
            - "Invariant: INV.balance_due_cents + INV.amount_paid_cents + INV.amount_credited_cents == 46500   # original face value conserved"

      - name: shipper_outstanding_invoiced_conservation_through_settle_and_writeoff
        grounds:
          - entities.Shipper.fields.outstanding_invoiced_cents
          - state_machines.Load.DELIVERED_to_INVOICED
          - state_machines.Invoice.ISSUED_to_WRITTEN_OFF
        distinguishing_aspect: |
          DIFFERENT conserved quantity from Rule 9's first instance (invoice
          face value): here we conserve the Shipper-level credit-utilisation
          quantity = Shipper.outstanding_invoiced_cents + sum(Invoice.balance_due_cents
          for non-terminal invoices of this shipper). The /invoice transition
          increases outstanding by invoice_total_cents; the compensating
          /write-off (or full payment, but here we use /write-off as the
          compensating action) MUST decrease outstanding by the SAME
          invoice_total_cents, leaving the global quantity {available credit on
          shipper} unchanged at the moment of the round trip. Pinned formula:
            net_delta(outstanding) == 0  for an /invoice + /write-off pair on the same load
        test_recipe:
          setup:
            - "Shipper S with credit_limit_cents=200000; baseline outstanding_invoiced_cents=0; available_credit_baseline = 200000"
            - "Build a Load L all the way to INVOICED with Invoice INV invoice_total_cents=46500"
            - "After /invoice: read Shipper.outstanding_invoiced_cents == 46500 (available_credit_mid = 200000-46500 = 153500)"
          trigger:
            - "POST /invoices/INV/write-off"
          assert:
            - "Invoice.settlement_status == 'WRITTEN_OFF'"
            - "Shipper.outstanding_invoiced_cents == 0   # net delta over invoice+write-off pair is 0"
            - "Invariant: available_credit_AFTER == available_credit_BASELINE == 200000   # conserved quantity restored"
