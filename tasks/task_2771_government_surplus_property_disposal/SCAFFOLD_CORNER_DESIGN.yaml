      - name: calc_fmv_governing_assessment_ranked_by_assessed_on
        claim_type: input_set_filtering
        grounds:
          - calculations.asset_fair_market_value.formula
          - calculations.asset_fair_market_value.input_set
          - entities.ConditionAssessment.fields.superseded
        distinguishing_aspect: "The governing row is chosen by assessed_on DESC, not by insertion order, so filing an older appraisal after a newer one leaves the value unchanged and marks the *newly inserted* row superseded — an implementation that simply takes the latest insert would drop the value from 850000 to 300000."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one SUBMITTED turn-in for DOT-01 with a single FURNITURE asset (cost 1000000, acquired 2026-01-10) assessed C2 on 2026-07-28 -> fair_market_value_cents 850000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /agencies"
              payload: { name: "State Department of Transportation", agency_code: "DOT-01", agency_type: "STATE_AGENCY" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ag: "$.data.id" }
            - call: "POST /turn-ins"
              payload: { turning_in_agency_id: "${ag}", custody_location: "Austin Yard 4" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { ti: "$.data.id" }
            - call: "POST /assets"
              payload: { turn_in_id: "${ti}", category: "FURNITURE", description: "Modular workstation cluster", acquisition_cost_cents: 1000000, acquisition_date: "2026-01-10" }
              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C2", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-28", expected_asset_version: "${a1_v}" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { as_new: "$.data.id" }
            - call: "GET /assets/${a1}"
              payload: {}
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { a1_v2: "$.data.version" }
          trigger:
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C5", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-20", expected_asset_version: "${a1_v2}", notes: "Back-dated inspection sheet located in the yard office" }
              as: SurplusAssessor
              as_user_id: "assessor-01"
              captures: { as_old: "$.data.id" }
          assert:
            - "response code 201 — a back-dated assessment is accepted as a row"
            - "SurplusAsset.${a1}.fair_market_value_cents is still 850000 and condition_code is still C2"
            - "ConditionAssessment.${as_new}.superseded == false — the 2026-07-28 row still governs"
            - "ConditionAssessment.${as_old}.superseded == true — the just-inserted 2026-07-20 row is the superseded one"
            - "SurplusAsset.${a1}.version == 3 — the asset is still rewritten by the insert even though the value did not move"
            - "TurnIn.${ti}.appraised_total_cents == 850000"
            - "GET /assets/${a1}/condition-assessments returns total_count 2"

