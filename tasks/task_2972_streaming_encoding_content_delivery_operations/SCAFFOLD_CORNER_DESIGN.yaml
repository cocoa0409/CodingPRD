              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver1: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver1}" }
              as: EncodingEngineer
              captures: { l_id: $.data.id }
            - call: "POST /encoding-ladders/${l_id}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_id}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver2: $.data.version }
          trigger:
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "CODEC_DEPRECATION", target_codec_family: "H264", expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "CODEC_DEPRECATION", target_codec_family: "HEVC", expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
              captures: { j_id: $.data.id }
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver3: $.data.version }
            - call: "POST /reprocess-jobs"
              payload: { title_id: "${t_id}", source_ladder_id: "${l_id}", trigger_reason: "STANDARD_UPDATE", target_codec_family: "AV1", expected_title_version: "${t_ver3}" }
              as: EncodingEngineer
            - call: "POST /reprocess-jobs/${j_id}/abort"
              payload: { abort_reason: "OPERATOR_ABORT" }
              as: EncodingEngineer
            - call: "POST /reprocess-jobs/${j_id}/abort"
              payload: { abort_reason: "OPERATOR_ABORT" }
              as: EncodingEngineer
          assert:
