          - entities.Dataset.fields.live_row_count
          - entities.Dataset.fields.version_index_high_water
          - validations[priority=31]
          - errors.ERR_NO_PREDECESSOR_VERSION
        distinguishing_aspect: |
          Retraction is a compensating transition on the published-record ledger: exactly one version is
          LIVE at all times, live_row_count is restored to the predecessor's 50000, and
          version_index_high_water stays at 2 — it is monotonic and never rewinds, which is what makes a
