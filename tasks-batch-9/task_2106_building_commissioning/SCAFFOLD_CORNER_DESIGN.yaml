  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_project_version_blocks_plan_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-project]
          - validations[priority=8]
          - errors[ERR_STALE_PROJECT_VERSION]
        distinguishing_aspect: "A plan create carrying the version read before an issue was logged answers 412 ERR_STALE_PROJECT_VERSION; re-reading the project and resending the current version succeeds, and the new plan supersedes nothing because none existed."
        test_recipe:
          setup:
            - "Project P was read at version V0 and one S4 issue has since been logged, advancing CxProject.version past V0."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "OCC Plan Cx", building_name: "OCC Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 100000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id, pv0: $.data.version }
            - call: "POST /owner-requirements"
              payload: { project_id: "${p}", metric_key: "SUPPLY_AIRFLOW_CFM", target_value: 10000, tolerance_pct: 5, criticality: "CRITICAL" }
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
              captures: { r1: $.data.id }
            - call: "POST /owner-requirements/${r1}/approve"
              payload: {}
              as: OwnerRepresentative
              as_user_id: "u-owner-1"
            - call: "POST /issues"
              payload: { project_id: "${p}", origin: "DESIGN_REVIEW", severity: "S4", description: "Drawing index missing a sheet" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { i1: $.data.id }
          trigger:
            - call: "POST /cx-plans"
              payload: { project_id: "${p}", title: "Stale attempt", expected_project_version: "${pv0}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { err: $.data.error_id }
            - call: "GET /cx-projects/${p}"
              payload: {}
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pv1: $.data.version }
            - call: "POST /cx-plans"
              payload: { project_id: "${p}", title: "Current attempt", expected_project_version: "${pv1}" }
              as: CxAuthority
              as_user_id: "u-cxa-1"
              captures: { pl: $.data.id, pl_status: $.data.status }
          assert:
            - "${err} == ERR_STALE_PROJECT_VERSION with HTTP 412"
            - "${pv1} > ${pv0}"
            - "${pl_status} == DRAFT and GET /cx-plans?project_id=${p} returns total_count == 1"
            - "CxProject.${p}.version == ${pv1} + 1 after the successful create"

      - name: stale_project_version_blocks_credit_submission
        claim_type: optimistic_concurrency
        grounds:
