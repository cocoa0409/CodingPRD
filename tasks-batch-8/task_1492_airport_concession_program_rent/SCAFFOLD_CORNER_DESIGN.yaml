            - { call: "POST /concessions/leases/${l1}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/leases", payload: { tenant_id: "${t2}", premises_code: "D4", category: "RETAIL", term_start_date: "2026-01-01", term_end_date: "2030-12-31", mag_annual_cents: 900000, pct_rate_below_bp: 700, pct_breakpoint_cents: 400000, pct_rate_above_bp: 900, acdbe_goal_bp: 2500, ti_allowance_cents: 200000, buildout_deadline: "2026-09-30", min_spe_cents: 900 }, as: AirportAdmin, captures: { l2: $.data.id } }
            - { call: "POST /concessions/leases/${l2}/transition", payload: { action: "ACTIVATE" }, as: AirportAdmin }
            - { call: "POST /concessions/sales-reports", payload: { lease_id: "${l1}", period_month: "2026-01", gross_sales_cents: 100000 }, as: Tenant, as_user_id: "${t1}" }
          trigger:
            - { call: "GET /concessions/leases", payload: { tenant_id: "${t1}" }, as: ConcessionAnalyst }
            - { call: "GET /concessions/sales-reports", payload: { lease_id: "${l1}" }, as: ConcessionAnalyst }
            - { call: "GET /concessions/sales-reports", payload: { lease_id: "${l2}" }, as: ConcessionAnalyst }
          assert:
