            - call: "POST /eqp/contractors"
              payload: { business_name: "Role Walk Bracing", license_no: "LIC-9007", certified_scopes: ["CRIPPLE_WALL_BRACING"], certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
