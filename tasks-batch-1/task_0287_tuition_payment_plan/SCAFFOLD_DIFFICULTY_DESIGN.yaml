              as: Registrar
              captures: { stu_10: $.data.id }
            - call: "POST /institutions/plan-templates"
              payload: { institution_id: "${inst_j}", name: "AUTO4", installment_count: 4, down_payment_pct: 0.20, plan_fee_cents: 4500, late_fee_grace_days: 3, autopay_required: true }
              as: Registrar
              captures: { tpl_j: $.data.id }
            - call: "POST /institutions/enrollments"
              payload: { student_id: "${stu_10}", term_id: "${term_j}", plan_template_id: "${tpl_j}", autopay_enabled: false }
              as: Registrar
              captures: { enr_10: $.data.id }
            - call: "POST /institutions/charges"
              payload: { enrollment_id: "${enr_10}", kind: "TUITION", amount_cents: 500000 }
