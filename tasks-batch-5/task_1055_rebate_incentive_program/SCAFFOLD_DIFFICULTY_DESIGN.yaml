          A boundary on a different metric (elapsed dormancy days, not money) reached through a
          different endpoint (POST /api/programs/{id}/escheat-sweep): a CHECK payout released on
          2026-07-10 is swept at 2027-01-06, exactly ESCHEAT_DORMANCY_DAYS 180 days later, because the
          comparison is >= 180 rather than > 180.
