  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics
  # reached through DISTINCT endpoints.
  # Instance 1: numeric threshold — credibility active score exactly 0.50
  #   (the substantiation gate is "< 0.50 forbids SUBSTANTIATED", so 0.50
  #   exactly PASSES — >= semantics) via POST /er/findings/{id}/substantiate.
  # Instance 2: zero-count edge — trend headcount denominator exactly 0 with
  #   zero closed cases yields rate 0.00 (not an error), via
  #   POST /er/trend-snapshots.
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: credibility_exactly_050_allows_substantiation
        grounds:
          - calculations.credibility_score
          - validations[priority=17]
          - state_machines.Finding.substantiation_status=DRAFT_to_substantiation_status IN {SUBSTANTIATED, UNSUBSTANTIATED, INCONCLUSIVE}
        distinguishing_aspect: |
          Numeric-threshold boundary on the credibility metric via
          POST /er/findings/{id}/substantiate (distinct metric and endpoint
          from the sibling): with corroboration_count=3, contradiction_count=2,
          account_age_days=0 the active CORROBORATION_WEIGHTED score is exactly
          0.50 (0.50 + 0.10*3 - 0.15*2 = 0.50); the gate forbids SUBSTANTIATED
          only when every active score is strictly < 0.50, so the exactly-0.50
          boundary PASSES and SUBSTANTIATED succeeds.
        test_recipe:
          setup:
            - "A case in FINDINGS_DRAFT with a finding in DRAFT and exactly one CredibilityAssessment with corroboration_count=3, contradiction_count=2, account_age_days=0 -> score_corroboration == 0.50 exactly, active_variant CORROBORATION_WEIGHTED."
            - "Clock at default."
