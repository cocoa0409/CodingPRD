              as: SanitationTech
              captures: { san2_st: "$.data.status", san2_attempts: "$.data.attempt_count", san2_seq: "$.data.sequence_no" }
            - call: "POST /lines/${line_id}/environmental-swabs"
              payload: { zone: "ZONE_2", site_code: "DRAIN-4", organism: "LISTERIA_SPP", collected_at: "2026-08-02T06:10:00Z" }
              as: QATechnician
              captures: { swab_res: "$.data.result", swab_at: "$.data.resulted_at" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { run_st: "$.data.run_status", run_disp: "$.data.disposition_status", run_started: "$.data.started_at" }
          assert:
            - "${line_posture} == RESTRICTED with ${line_cas} == 0 and ${line_last} null: a brand-new line has no VALIDATED clean, so the projection yields the declared NEW_LINE_POSTURE"
            - "${ws_status} == IN_SERVICE, ${ws_idx} == 0.000, ${ws_target} == 20.0 and ${ws_count} == 0"
            - "${lot2_st} == PENDING_APPROVAL and ${lot2_pre} is null: no score exists before approval evaluates the PREHARVEST variant"
            - "${rcpt2_st} == PENDING_INSPECTION"
            - "${san2_st} == SCHEDULED with ${san2_attempts} == 0 and ${san2_seq} == 1"
            - "${swab_res} == PENDING with ${swab_at} null"
            - "${run_st} == SETUP and ${run_disp} == UNRESTRICTED at once, with ${run_started} null: the two dimensions each begin at their own initial state"

      - name: corner_positive_preharvest_test_rejects_lot_with_zero_scores
        claim_type: Valid Transition
        grounds:
          - state_machines[GrowerLot].transitions[PENDING_APPROVAL->REJECTED]
          - calculations.grower_lot_risk_score.variants[PREHARVEST]
        distinguishing_aspect: "The same approve trigger reaches REJECTED and writes both scores as 0, bypassing the weighted score entirely even though the lot's field evidence would otherwise have scored 100."
        test_recipe:
          setup: ["the clock is 2026-08-02T05:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T05:00:00Z" }
              as: PlantAdmin
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-300", ranch_block: "B3", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T08:00:00Z", water_source: "WELL", adjacent_animal_operation: false, preharvest_test_result: "POSITIVE", prior_rejected_receipt_count: 0 }
              as: QATechnician
              captures: { lot3: "$.data.id" }
          trigger:
            - call: "POST /grower-lots/${lot3}/approve"
              as: QAManager
              captures: { st: "$.data.status", pre: "$.data.preharvest_risk_score", trail: "$.data.trailing_risk_score", ver: "$.data.version" }
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lot3}", received_at: "2026-08-02T05:30:00Z", pulp_temp_c: 2.0, gross_weight_lb: 10000.00, tare_weight_lb: 1000.00 }
              as: ReceivingClerk
              captures: { rid3: "$.data.id" }
          assert:
            - "${st} == REJECTED, not APPROVED and not SUSPENDED: the POSITIVE branch of the approve trigger wins over the score branches"
            - "${pre} == 0 and ${trail} == 0, even though WELL water with no animal adjacency and no prior rejects would have scored 100"
            - "${ver} == 2: the transition is a write and bumps the version"
            - "${rid3} exists: receiving a load against a rejected lot is still allowed, because the gate lives on consumption (ERR_GROWER_LOT_NOT_APPROVED), not on receiving"

      - name: corner_low_preharvest_score_approves_into_suspension
        claim_type: Valid Transition
        grounds:
          - state_machines[GrowerLot].transitions[PENDING_APPROVAL->SUSPENDED]
          - calculations.grower_lot_risk_score.constants
          - validations[priority=39]
        distinguishing_aspect: "One approve call on a lot scoring 20 lands in SUSPENDED rather than APPROVED, and a consumption against its accepted receipt is then refused with ERR_GROWER_LOT_NOT_APPROVED even though the receipt itself is perfectly good."
        test_recipe:
          setup: ["execute BASE steps 1-5 and 10-14, so P_ROMAINE, S_FS, L1 with a VALIDATED clean, W1 and a SETUP run exist"]
          setup_api_calls:
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-400", ranch_block: "B4", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T08:00:00Z", water_source: "SURFACE", adjacent_animal_operation: true, preharvest_test_result: "PRESUMPTIVE", prior_rejected_receipt_count: 4 }
              as: QATechnician
              captures: { lot4: "$.data.id" }
          trigger:
            - call: "POST /grower-lots/${lot4}/approve"
              as: QAManager
              captures: { st: "$.data.status", pre: "$.data.preharvest_risk_score", trail: "$.data.trailing_risk_score" }
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lot4}", received_at: "2026-08-02T05:40:00Z", pulp_temp_c: 2.0, gross_weight_lb: 21000.00, tare_weight_lb: 1000.00 }
              as: ReceivingClerk
              captures: { rid4: "$.data.id" }
            - call: "POST /raw-receipts/${rid4}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 0.00 }
              as: QATechnician
              captures: { rst: "$.data.status", racc: "$.data.accepted_lb" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:30:00Z" }
              as: PlantAdmin
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-03T06:30:00Z", free_chlorine_ppm: 24.0, ph: 6.8, orp_mv: 700, turbidity_ntu: 1.2 }
              as: LineOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T07:00:00Z" }
              as: PlantAdmin
            - call: "POST /process-runs/${run_id}/start"
              as: LineOperator
              captures: { rv: "$.data.version" }
            - call: "POST /process-runs/${run_id}/lot-consumptions"
              payload: { raw_receipt_id: "${rid4}", consumed_lb: 10000.00, expected_process_run_version: "${rv}" }
              as: LineOperator
              captures: { err: "$.data.error_id" }
          assert:
            - "${pre} == 20 == 100 - 25 (SURFACE) - 15 (animal adjacency) - 20 (PRESUMPTIVE) - min(20, 5 x 4) (prior rejects)"
            - "${st} == SUSPENDED because 20 < RISK_SUSPEND_THRESHOLD 50, and ${trail} == 20 (the trailing score is seeded from the frozen preharvest value)"
            - "${rst} == ACCEPTED and ${racc} == 20000.00: the receipt path is unaffected by the lot's suspension"
            - "${err} == ERR_GROWER_LOT_NOT_APPROVED with HTTP 422: the suspension is enforced at consumption time"

      - name: corner_approve_twice_is_refused
        claim_type: Idempotency
        grounds:
          - validations[priority=26]
          - errors[ERR_GROWER_LOT_INVALID_STATE]
        distinguishing_aspect: "A second approve on an already APPROVED lot returns ERR_GROWER_LOT_INVALID_STATE and leaves version and scores untouched, so approval is not idempotent-by-replay."
        test_recipe:
          setup: ["execute BASE steps 1-7, so G1 is APPROVED with both scores 100 and version 2"]
          setup_api_calls: []
          trigger:
            - call: "GET /grower-lots/${lot_id}"
              as: QAManager
              captures: { v_before: "$.data.version", st_before: "$.data.status" }
            - call: "POST /grower-lots/${lot_id}/approve"
              as: QAManager
              captures: { err: "$.data.error_id" }
            - call: "GET /grower-lots/${lot_id}"
              as: QAManager
              captures: { v_after: "$.data.version", st_after: "$.data.status" }
          assert:
            - "${err} == ERR_GROWER_LOT_INVALID_STATE with HTTP 409"
            - "${st_before} == ${st_after} == APPROVED and ${v_after} == ${v_before}: a refused transition performs no write at all"

      - name: corner_recalled_lot_is_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines[GrowerLot].terminal_states
          - validations[priority=26]
        distinguishing_aspect: "From RECALLED neither recall nor approve is possible, and the same lockdown holds for the other terminal value REJECTED, so both leaves of the branching machine are closed."
        test_recipe:
          setup: ["execute BASE steps 1-9, then recall G1; separately a second lot G2 was rejected on a POSITIVE preharvest test"]
          setup_api_calls:
            - call: "POST /grower-lots/${lot_id}/recall"
              as: QAManager
              captures: { rst: "$.data.status", rat: "$.data.recalled_at" }
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-500", ranch_block: "B5", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T08:00:00Z", water_source: "WELL", adjacent_animal_operation: false, preharvest_test_result: "POSITIVE" }
              as: QATechnician
              captures: { lot5: "$.data.id" }
            - call: "POST /grower-lots/${lot5}/approve"
              as: QAManager
          trigger:
            - call: "POST /grower-lots/${lot_id}/recall"
              as: QAManager
              captures: { e_recall_again: "$.data.error_id" }
            - call: "POST /grower-lots/${lot_id}/approve"
              as: QAManager
              captures: { e_approve_recalled: "$.data.error_id" }
            - call: "POST /grower-lots/${lot5}/recall"
              as: QAManager
              captures: { e_recall_rejected: "$.data.error_id" }
            - call: "POST /grower-lots/${lot5}/approve"
              as: QAManager
              captures: { e_approve_rejected: "$.data.error_id" }
          assert:
            - "${rst} == RECALLED and ${rat} == 2026-08-02T05:00:00.000Z, the logical clock at the recall instant"
            - "all four follow-up calls return ERR_GROWER_LOT_INVALID_STATE with HTTP 409"
            - "the recall cascade therefore cannot be run twice, which matters because hop 4 rewrites case counters and a replay would double-count them"

      - name: corner_sanitation_validation_failure_cascade_fires_all_five_hops
        claim_type: Side Effect Execution
        grounds:
          - state_machines[SanitationEvent].transitions[AWAITING_VALIDATION->FAILED]
          - state_machines[WashSystem].transitions[IN_SERVICE->DUMP_REQUIRED]
          - state_machines[ProcessRun].dimension=run_status.transitions[SETUP->CANCELLED]
        distinguishing_aspect: "A PASS outcome carrying atp_rlu 250 against a line limit of 200 still lands in FAILED, and every one of the five declared hops is observable: failed_reason, a MAJOR corrective action, a RESTRICTED posture, a DUMP_REQUIRED wash system and a CANCELLED SETUP run whose disposition dimension is left alone."
        test_recipe:
          setup:
            - "execute BASE steps 1-9, so P_ROMAINE, S_FS, L1 (max_atp_rlu 200, 12 components), W1, G1 APPROVED and R1 ACCEPTED exist and the clock is 2026-08-02T05:00:00Z"
            - "a SETUP run RUN_X on L1 referencing W1 exists"
          setup_api_calls:
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { runx: "$.data.id" }
            - call: "POST /lines/${line_id}/sanitation-events"
              payload: { shift: "SANITATION", scheduled_for: "2026-08-02T06:00:00Z", is_allergen_changeover: false }
              as: SanitationTech
              captures: { sanx: "$.data.id" }
            - call: "POST /sanitation-events/${sanx}/start"
              as: SanitationTech
              as_user_id: "sant-1"
            - call: "POST /sanitation-events/${sanx}/submit"
              payload: { disassembled_component_count: 12, atp_rlu: 250, allergen_swab_result: "NEGATIVE" }
              as: SanitationTech
              as_user_id: "sant-1"
              captures: { sub_status: "$.data.status" }
          trigger:
            - call: "POST /sanitation-events/${sanx}/validate"
              payload: { outcome: "PASS" }
              as: QATechnician
              as_user_id: "qat-1"
              captures: { san_status: "$.data.status", san_reason: "$.data.failed_reason", san_valid_at: "$.data.validated_at" }
            - call: "GET /lines/${line_id}"
              as: QAManager
              captures: { posture: "$.data.posture", ca_count: "$.data.open_corrective_action_count" }
            - call: "GET /lines/${line_id}/corrective-actions"
              as: QAManager
              captures: { ca_sev: "$.data[0].severity", ca_src: "$.data[0].source_type", ca_ref: "$.data[0].source_ref_id", ca_status: "$.data[0].status" }
            - call: "GET /wash-systems/${ws_id}"
              as: QAManager
              captures: { ws_status: "$.data.status" }
            - call: "GET /process-runs/${runx}"
              as: QAManager
              captures: { rx_status: "$.data.run_status", rx_disp: "$.data.disposition_status" }
          assert:
            - "${sub_status} == AWAITING_VALIDATION, so the failing measurement is recorded and only judged at validation time"
            - "hop 1: ${san_status} == FAILED with ${san_reason} == ATP_ABOVE_LIMIT and ${san_valid_at} null, even though the request asked for PASS - 250 > 200 overrides the requested outcome"
            - "hop 2: ${ca_sev} == MAJOR, ${ca_src} == SANITATION_FAILURE, ${ca_ref} == ${sanx}, ${ca_status} == OPEN and ${ca_count} == 1"
            - "hop 3: ${posture} == RESTRICTED"
            - "hop 4: ${ws_status} == DUMP_REQUIRED, because W1 is referenced by a SETUP run on the failing line"
            - "hop 5: ${rx_status} == CANCELLED while ${rx_disp} == UNRESTRICTED - the cancellation touches only the run_status dimension"

      - name: corner_fresh_pass_does_not_clear_unverified_corrective_action
        claim_type: Precondition Enforcement
        grounds:
          - calculations.line_posture.formula
          - state_machines[SanitationEvent].transitions[FAILED->IN_PROGRESS]
          - state_machines[CorrectiveAction].transitions[VERIFICATION_PENDING->VERIFIED]
        distinguishing_aspect: "The failed event is restarted on the same row (attempt_count 2) and passes cleanly, yet the line remains RESTRICTED and a run start is refused with ERR_LINE_NOT_OPEN until the MAJOR corrective action reaches VERIFIED; only then does the next gate, the DUMP_REQUIRED wash system, become visible."
        test_recipe:
          setup:
            - "execute BASE steps 1-9, so P_ROMAINE, S_FS, L1 (max_atp_rlu 200, 12 components), W1, G1 APPROVED and R1 ACCEPTED exist and the clock is 2026-08-02T05:00:00Z"
            - "then drive the sanitation-failure chain below, which leaves event ${sanx} FAILED, one OPEN MAJOR corrective action ${ca_id}, L1 RESTRICTED, W1 DUMP_REQUIRED and the SETUP run CANCELLED"
          setup_api_calls:
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T12:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { runx: "$.data.id" }
            - call: "POST /lines/${line_id}/sanitation-events"
