              payload: {}
              as: DesignEngineer
              captures: { seg_a_v2: $.data.version }
            - call: "POST /cabling/link-routes"
              payload: { link_id: "${link2}", pathway_segment_id: "${seg_a}", sequence_index: 1, expected_segment_version: "${seg_a_v2}" }
              as: DesignEngineer
          trigger:
            - call: "POST /cabling/trade-coordinations/${coord}/block"
              payload: { block_reason: "Ceiling grid closed ahead of schedule" }
              as: ProjectManager
            - call: "POST /cabling/links/${link2}/pull"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
              captures: { err: $.data.error_id }
            - call: "POST /cabling/trade-coordinations/${coord}/unblock"
              payload: {}
              as: ProjectManager
            - call: "POST /cabling/links/${link2}/pull"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
              captures: { err2: $.data.error_id }
            - call: "POST /cabling/trade-coordinations/${coord}/confirm"
              payload: { confirmed_date: "2026-08-12" }
              as: ProjectManager
            - call: "POST /cabling/links/${link2}/pull"
              payload: {}
              as: Installer
              as_user_id: "user-installer-01"
          assert:
            - "the block response has coordination_state == \"BLOCKED\" and block_reason == \"Ceiling grid closed ahead of schedule\""
            - "the pull during the block returns 409 with data.error_id == \"ERR_TRADE_NOT_COORDINATED\""
            - "GET /cabling/links/${link1} is unaffected throughout and still returns install_state == \"PULLED\""
            - "the unblock response has coordination_state == \"REQUESTED\" with block_reason == null and confirmed_date == null"
            - "the pull straight after the unblock still returns 409 ERR_TRADE_NOT_COORDINATED, because REQUESTED is not one of {CONFIRMED, RELEASED}"
            - "the re-confirm returns 200 with coordination_state == \"CONFIRMED\" and confirmed_date == \"2026-08-12\""
            - "the pull after the re-confirm returns 200 with install_state == \"PULLED\" for ${link2}"

      - name: mac_ticket_loops_back_to_submitted_on_rework
        claim_type: cyclic
        grounds: [state_machines.MacTicket.IN_PROGRESS_to_SUBMITTED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / mac_ticket_rework_cycle_returns_to_submitted
          rationale: "The cycle, its rework_count and the budget unwind are asserted end-to-end by the named §1.8 instance."

      - name: link_record_dimension_moves_without_the_install_dimension
        claim_type: parallel
        grounds: [state_machines.Link.record_state]
        excluded_because:
          difficulty_instance: non_linear_state_machine / link_install_and_record_dimensions_advance_independently
          rationale: "Independent advance of the two Link state dimensions is the whole subject of the named §1.8 instance."

      - name: pull_guarded_by_the_ceiling_coordination_state
        claim_type: guarded_transitions
        grounds: [state_machines.Link.DESIGNED_to_PULLED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / link_pull_depends_on_ceiling_trade_coordination_state
          rationale: "The guard's negative and positive paths are both asserted by the named §1.8 instance."

      - name: condemn_cascades_down_to_routes_and_links
        claim_type: cascade_down
        grounds: [state_machines.PathwaySegment.SERVICEABLE_to_CONDEMNED]
        excluded_because:
          difficulty_instance: transitive_cascade / condemn_cascades_to_route_link_project_and_warranty_revert
          rationale: "The four-hop downward cascade and its non-terminal-child selectivity are asserted by the named §1.8 instance."

      - name: certification_bubbles_up_to_project_eligibility
        claim_type: bubble_up
        grounds: [entities.CablingProject.fields.warranty_status]
        excluded_because:
          difficulty_instance: transitive_cascade / certify_cascades_to_project_rollup_eligibility_and_registration_ready
          rationale: "The upward roll-up from the last certified link to registration READY is asserted by the named §1.8 instance."

      - name: rack_assignment_syncs_the_room_power_ledger
        claim_type: ledger_sync
        grounds: [calculations.room_power_ledger]
        excluded_because:
          difficulty_instance: compensating_invariant / assignment_release_returns_exactly_the_room_volt_amperes_it_drew
          rationale: "Ledger reconciliation two hops up is asserted before and after the write by the named §1.8 instance."

      - name: route_withdraw_compensates_the_segment_fill
        claim_type: compensation
        grounds: [state_machines.LinkPathwayRoute.OCCUPYING_to_WITHDRAWN]
        excluded_because:
          difficulty_instance: compensating_invariant / route_withdraw_returns_exactly_the_pathway_area_it_consumed
          rationale: "The undo of every fill side effect with no drift is asserted by the named §1.8 instance."

      - name: termination_reads_the_rooms_grounding_state
        claim_type: cross_entity
        grounds: [state_machines.Link.PULLED_to_TERMINATED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / link_termination_depends_on_telecom_room_grounding_status
          rationale: "Entity A's transition reading entity B's state is asserted in both directions by the named §1.8 instance."

  - section: calculations
    instances:
      - name: tray_percentage_bend_derate_and_the_minimum_fill_floor_are_all_applied
        claim_type: constants_applied
        grounds:
          - calculations.pathway_fill_evaluation.constants
          - entities.PathwaySegment.fields.allowed_fill_pct
        distinguishing_aspect: "Three segments differing only in pathway_type and bend_count exercise three different arms of the allowed_fill_pct expression in one pass: TRAY_FILL_PCT 50 on the tray, FILL_PCT_1_CABLE 53 minus BEND_DERATE_PCT * (6 - 2) = 45 on the six-bend conduit, and the MIN_FILL_PCT floor of 25 on the twenty-bend conduit where the raw arithmetic gives 17."
        test_recipe:
          setup:
            - "Project RVT1 with a CAT6A CMP cable type of outer_diameter_mm 7.9 (cross_section_area_sq_mm 49.02)"
            - "Chained segments PS-A (CABLE_TRAY, 20000.0 sq mm, 0 bends), PS-B (EMT_CONDUIT, 573.0 sq mm, 6 bends, upstream PS-A) and PS-C (EMT_CONDUIT, 573.0 sq mm, 20 bends, upstream PS-B)"
            - "Link TR01-A01 with horizontal_length_m 40.00 and patch_cord_allowance_m 2.00"
          setup_api_calls:
            - call: "POST /cabling/projects"
              payload: { name: "Riverside Tower Cabling", site_code: "RVT1", plenum_ceiling: true, identifier_scheme: "TIA_606_CLASS_1" }
              as: ProjectManager
              captures: { proj: $.data.id }
            - call: "POST /cabling/telecom-rooms"
              payload: { project_id: "${proj}", room_code: "TR01", floor: 3, branch_circuit_amps: 20, ups_capacity_va: 3000 }
              as: ProjectManager
              captures: { room: $.data.id }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-A", pathway_type: "CABLE_TRAY", usable_area_sq_mm: 20000.0, length_m: 40.0, bend_count: 0, in_plenum_space: true, shared_with_power: false, power_separation_mm: 0 }
              as: DesignEngineer
              captures: { seg_a: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-B", pathway_type: "EMT_CONDUIT", usable_area_sq_mm: 573.0, length_m: 12.0, bend_count: 6, in_plenum_space: false, shared_with_power: false, power_separation_mm: 0, upstream_segment_id: "${seg_a}" }
              as: DesignEngineer
              captures: { seg_b: $.data.id }
            - call: "POST /cabling/pathway-segments"
              payload: { project_id: "${proj}", segment_code: "PS-C", pathway_type: "EMT_CONDUIT", usable_area_sq_mm: 573.0, length_m: 9.0, bend_count: 20, in_plenum_space: false, shared_with_power: false, power_separation_mm: 0, upstream_segment_id: "${seg_b}" }
              as: DesignEngineer
              captures: { seg_c: $.data.id }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj}", telecom_room_id: "${room}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
              as: DesignEngineer
              captures: { link: $.data.id }
            - call: "GET /cabling/pathway-segments/${seg_a}"
              payload: {}
              as: DesignEngineer
              captures: { seg_a_v: $.data.version }
            - call: "GET /cabling/pathway-segments/${seg_b}"
              payload: {}
              as: DesignEngineer
              captures: { seg_b_v: $.data.version }
            - call: "GET /cabling/pathway-segments/${seg_c}"
              payload: {}
              as: DesignEngineer
              captures: { seg_c_v: $.data.version }
          trigger:
            - call: "POST /cabling/link-routes"
