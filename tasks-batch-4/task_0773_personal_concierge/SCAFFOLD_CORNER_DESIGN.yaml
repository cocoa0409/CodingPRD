      - name: standing_request_generate_creates_occurrence
        claim_type: Action endpoint
        grounds: [entities.ServiceRequest.fields.recurrence_parent_id, "endpoints.POST./concierge/service-requests/{id}/generate"]
        distinguishing_aspect: "generate on a standing WEEKLY request creates a new SUBMITTED occurrence with recurrence_parent_id equal to the template id."
        test_recipe:
