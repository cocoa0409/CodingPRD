scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: nurse_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Nurse.fields.current_level, entities.Nurse.fields.differential_status]
        distinguishing_aspect: "POST /nurses with only required inputs returns 201 with current_level==CN_I and differential_status==INACTIVE defaults applied."
        test_recipe:
          setup: ["Clock default 2026-08-01"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-100", full_name: "Default Nurse", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { dn_id: $.data.id, dn_level: $.data.current_level, dn_diff: $.data.differential_status, dn_version: $.data.version }
          trigger:
            - call: "GET /clinical-ladder/nurses/${dn_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "dn_level == CN_I"
            - "dn_diff == INACTIVE"
            - "dn_version == 1"

      - name: nurse_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Nurse.fields.employee_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting employee_code on nurse creation yields 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /clinical-ladder/nurses"
              payload: { full_name: "No Code", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { nc_err: $.data.error_id }
          assert:
            - "nc_err == ERR_INVALID_REQUEST"

      - name: nurse_duplicate_employee_code_rejected
        claim_type: type_constraints
        grounds: [entities.Nurse.fields.employee_code]
        distinguishing_aspect: "Second nurse with the same employee_code is rejected (uniqueness constraint)."
        test_recipe:
          setup: ["One nurse with employee_code RN-DUP exists"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-DUP", full_name: "First", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
          trigger:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-DUP", full_name: "Second", hire_date: "2021-01-01T00:00:00Z", home_unit: "ICU-4W" }
              as: ProgramAdmin
              captures: { dup_err: $.data.error_id }
          assert:
            - "dup_err == ERR_INVALID_REQUEST or ERR_INVALID_STATE (uniqueness violation surfaces as a 4xx)"

      - name: nurse_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /nurses/{random-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /clinical-ladder/nurses/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { nf_err: $.data.error_id }
          assert:
            - "nf_err == ERR_NOT_FOUND"

      - name: nurse_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "GET /nurses with default limit returns envelope with meta.api_request_id, data as array, and pagination fields total_count/has_more present."
        test_recipe:
          setup: ["Three nurses exist"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-P1", full_name: "P1", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-P2", full_name: "P2", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-P3", full_name: "P3", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
          trigger:
            - call: "GET /clinical-ladder/nurses"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
              captures: { pg_total: $.data }
          assert:
            - "response contains total_count == 3 and has_more == true at limit 2"

      - name: participation_event_invalid_kind_enum_rejected
        claim_type: type_constraints
        grounds: [entities.ParticipationEvent.fields.event_kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "event_kind outside the declared enum set is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Nurse PE1 exists"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-PE1", full_name: "PE One", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { pe1_nurse: $.data.id }
          trigger:
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${pe1_nurse}", event_kind: "NOT_A_KIND", points: 5, occurred_on: "2026-01-01T00:00:00Z" }
              as: Nurse
              as_user_id: "${pe1_nurse}"
              captures: { pe_err: $.data.error_id }
          assert:
            - "pe_err == ERR_INVALID_REQUEST"

      - name: certification_immutable_decision_no_update_endpoint
        claim_type: immutability
        grounds: [entities.AdvancementDecision]
        distinguishing_aspect: "AdvancementDecision carries common_fields: false (append-only): its rows expose id and created_at but NO version field, and §1.5 declares no PUT/PATCH/DELETE route for decisions — verified by reading a created decision via the declared sub-resource list and observing the absence of version."
        test_recipe:
          setup: ["Application IN_REVIEW scored to 50 (< 75), then DENY decided; decisions list readable"]
          setup_api_calls:
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-IMM", full_name: "Imm Nurse", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { imm_n: $.data.id, imm_nv: $.data.version }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-IMMR", full_name: "Imm Rev", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { imm_r: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-IMMRB", full_name: "Imm Rev B", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { imm_rb: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-IMMRC", full_name: "Imm Rev C", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { imm_rc: $.data.id }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${imm_n}", target_level: "CN_II", portfolio_narrative: "p", expected_nurse_version: "${imm_nv}" }
              as: Nurse
              as_user_id: "${imm_n}"
              captures: { imm_app: $.data.id }
            - call: "POST /clinical-ladder/applications/${imm_app}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${imm_n}"
            - call: "POST /clinical-ladder/applications/${imm_app}/assignments"
              payload: { reviewer_nurse_id: "${imm_r}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${imm_app}/assignments"
              payload: { reviewer_nurse_id: "${imm_rb}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${imm_app}/assignments"
              payload: { reviewer_nurse_id: "${imm_rc}" }
              as: ProgramAdmin
            - call: "GET /clinical-ladder/applications/${imm_app}/assignments"
              payload: {}
              as: ProgramAdmin
              captures: { imm_asg: "$.data[0].id", imm_asgb: "$.data[1].id", imm_asgc: "$.data[2].id" }
            - call: "POST /clinical-ladder/review-assignments/${imm_asg}/score"
              payload: { dimension_scores: { leadership: 50, clinical_expertise: 50, professional_development: 50, outcomes: 50 } }
              as: Nurse
              as_user_id: "${imm_r}"
            - call: "POST /clinical-ladder/review-assignments/${imm_asgb}/score"
              payload: { dimension_scores: { leadership: 50, clinical_expertise: 50, professional_development: 50, outcomes: 50 } }
              as: Nurse
              as_user_id: "${imm_rb}"
            - call: "POST /clinical-ladder/review-assignments/${imm_asgc}/score"
              payload: { dimension_scores: { leadership: 50, clinical_expertise: 50, professional_development: 50, outcomes: 50 } }
              as: Nurse
              as_user_id: "${imm_rc}"
            - call: "GET /clinical-ladder/applications/${imm_app}"
              payload: {}
              as: ProgramAdmin
              captures: { imm_v: $.data.version }
            - call: "POST /clinical-ladder/applications/${imm_app}/decide"
              payload: { outcome: "DENY", expected_application_version: "${imm_v}" }
              as: ProgramAdmin
          trigger:
            - call: "GET /clinical-ladder/applications/${imm_app}/decisions"
              payload: {}
              as: ProgramAdmin
              captures: { imm_rows: $.data }
          assert:
            - "len(imm_rows) == 1 and imm_rows[0] has id and created_at but no version key (append-only entity)"

      - name: computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.Nurse.fields.retention_risk_score, entities.Nurse.fields.tenure_years]
        distinguishing_aspect: "Client-supplied retention_risk_score or tenure_years on POST /nurses is ignored; server computes them (risk 0, tenure from hire_date)."
        test_recipe:
          setup: ["Clock default"]
          setup_api_calls: []
          trigger:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-CMP", full_name: "Computed", hire_date: "2016-07-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { cmp_id: $.data.id, cmp_risk: $.data.retention_risk_score, cmp_tenure: $.data.tenure_years }
          assert:
            - "cmp_risk == 0"
            - "cmp_tenure == 10 (floor of (2026-08-01 - 2016-07-01)/365.25 = floor(10.08))"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: application_submit_from_submitted_invalid
        claim_type: invalid_transition
        grounds: [state_machines.Application.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second submit on an already-SUBMITTED application returns ERR_INVALID_STATE; idempotency guard."
        test_recipe:
          setup: ["Criterion CN_II active; nurse APP1 with SUBMITTED application"]
          setup_api_calls:
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-APP1", full_name: "App One", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { a1_nurse: $.data.id, a1_nv: $.data.version }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${a1_nurse}", target_level: "CN_II", portfolio_narrative: "p", expected_nurse_version: "${a1_nv}" }
              as: Nurse
              as_user_id: "${a1_nurse}"
              captures: { a1_app: $.data.id }
            - call: "POST /clinical-ladder/applications/${a1_app}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${a1_nurse}"
          trigger:
            - call: "POST /clinical-ladder/applications/${a1_app}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${a1_nurse}"
              captures: { a1_err: $.data.error_id }
          assert:
            - "a1_err == ERR_INVALID_STATE"

      - name: application_terminal_approved_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Application.terminal_states]
        distinguishing_aspect: "From APPROVED, withdraw / submit / return-for-revision all return ERR_INVALID_STATE."
        test_recipe:
          setup: ["Nurse AP2 with APPROVED application (full committee flow)"]
          setup_api_calls:
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-AP2", full_name: "Ap Two", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { a2_nurse: $.data.id, a2_nv: $.data.version }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-ARV", full_name: "Ap Rev", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { a2_rev: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-ARVB", full_name: "Ap Rev B", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { a2_revb: $.data.id }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-ARVC", full_name: "Ap Rev C", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { a2_revc: $.data.id }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${a2_nurse}", target_level: "CN_II", portfolio_narrative: "p", expected_nurse_version: "${a2_nv}" }
              as: Nurse
              as_user_id: "${a2_nurse}"
              captures: { a2_app: $.data.id }
            - call: "POST /clinical-ladder/applications/${a2_app}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${a2_nurse}"
            - call: "POST /clinical-ladder/applications/${a2_app}/assignments"
              payload: { reviewer_nurse_id: "${a2_rev}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${a2_app}/assignments"
              payload: { reviewer_nurse_id: "${a2_revb}" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/applications/${a2_app}/assignments"
              payload: { reviewer_nurse_id: "${a2_revc}" }
              as: ProgramAdmin
            - call: "GET /clinical-ladder/applications/${a2_app}/assignments"
              payload: {}
              as: ProgramAdmin
              captures: { a2_asg: "$.data[0].id", a2_asgb: "$.data[1].id", a2_asgc: "$.data[2].id" }
            - call: "POST /clinical-ladder/review-assignments/${a2_asg}/score"
              payload: { dimension_scores: { leadership: 80, clinical_expertise: 80, professional_development: 80, outcomes: 80 } }
              as: Nurse
              as_user_id: "${a2_rev}"
            - call: "POST /clinical-ladder/review-assignments/${a2_asgb}/score"
              payload: { dimension_scores: { leadership: 80, clinical_expertise: 80, professional_development: 80, outcomes: 80 } }
              as: Nurse
              as_user_id: "${a2_revb}"
            - call: "POST /clinical-ladder/review-assignments/${a2_asgc}/score"
              payload: { dimension_scores: { leadership: 80, clinical_expertise: 80, professional_development: 80, outcomes: 80 } }
              as: Nurse
              as_user_id: "${a2_revc}"
            - call: "GET /clinical-ladder/applications/${a2_app}"
              payload: {}
              as: ProgramAdmin
              captures: { a2_v: $.data.version }
            - call: "POST /clinical-ladder/applications/${a2_app}/decide"
              payload: { outcome: "APPROVE", expected_application_version: "${a2_v}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /clinical-ladder/applications/${a2_app}/withdraw"
              payload: {}
              as: Nurse
              as_user_id: "${a2_nurse}"
              captures: { a2_werr: $.data.error_id }
            - call: "POST /clinical-ladder/applications/${a2_app}/return-for-revision"
              payload: {}
              as: ProgramAdmin
              captures: { a2_rerr: $.data.error_id }
          assert:
            - "a2_werr == ERR_INVALID_STATE"
            - "a2_rerr == ERR_INVALID_STATE"

      - name: assignment_recuse_terminal_no_score
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ReviewAssignment.transitions]
        distinguishing_aspect: "A RECUSED assignment cannot later be scored (terminal state); score attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Nurse AP3 application IN_REVIEW; assignment ASG recused"]
          setup_api_calls:
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-AP3", full_name: "Ap Three", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { a3_nurse: $.data.id, a3_nv: $.data.version }
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-ARV3", full_name: "Ap Rev3", hire_date: "2019-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { a3_rev: $.data.id }
            - call: "POST /clinical-ladder/applications"
              payload: { nurse_id: "${a3_nurse}", target_level: "CN_II", portfolio_narrative: "p", expected_nurse_version: "${a3_nv}" }
              as: Nurse
              as_user_id: "${a3_nurse}"
              captures: { a3_app: $.data.id }
            - call: "POST /clinical-ladder/applications/${a3_app}/submit"
              payload: {}
              as: Nurse
              as_user_id: "${a3_nurse}"
            - call: "POST /clinical-ladder/applications/${a3_app}/assignments"
              payload: { reviewer_nurse_id: "${a3_rev}" }
              as: ProgramAdmin
              captures: { a3_asg: $.data.id }
            - call: "POST /clinical-ladder/review-assignments/${a3_asg}/recuse"
              payload: {}
              as: Nurse
              as_user_id: "${a3_rev}"
          trigger:
            - call: "POST /clinical-ladder/review-assignments/${a3_asg}/score"
              payload: { dimension_scores: { leadership: 80, clinical_expertise: 80, professional_development: 80, outcomes: 80 } }
              as: Nurse
              as_user_id: "${a3_rev}"
              captures: { a3_serr: $.data.error_id }
          assert:
            - "a3_serr == ERR_INVALID_STATE"

      - name: participation_void_terminal_no_verify
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ParticipationEvent.transitions]
        distinguishing_aspect: "A VOIDED participation event cannot be verified; verify attempt returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Nurse PE2 with one PENDING_VERIFICATION event that is voided"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-PE2", full_name: "Pe Two", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { pe2_nurse: $.data.id }
            - call: "POST /clinical-ladder/participation-events"
              payload: { nurse_id: "${pe2_nurse}", event_kind: "QI_PROJECT", points: 5, occurred_on: "2026-01-01T00:00:00Z" }
              as: Nurse
              as_user_id: "${pe2_nurse}"
              captures: { pe2_id: $.data.id }
            - call: "POST /clinical-ladder/participation-events/${pe2_id}/void"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /clinical-ladder/participation-events/${pe2_id}/verify"
              payload: {}
              as: ProgramAdmin
              captures: { pe2_err: $.data.error_id }
          assert:
            - "pe2_err == ERR_INVALID_STATE"

      - name: claim_denied_terminal_no_approve
        claim_type: invalid_transition
        grounds: [state_machines.ReimbursementClaim.transitions]
        distinguishing_aspect: "Approve on a DENIED claim returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Nurse CL1 cert + claim denied"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-CL1", full_name: "Cl One", hire_date: "2021-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { cl1_nurse: $.data.id }
            - call: "POST /clinical-ladder/certifications"
              payload: { nurse_id: "${cl1_nurse}", track: "BASIC", certifying_body: "ANCC", exam_fee_cents: 40000, obtained_on: "2025-01-01T00:00:00Z", expires_on: "2028-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { cl1_cert: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims"
              payload: { certification_id: "${cl1_cert}", claimed_amount_cents: 30000 }
              as: Nurse
              as_user_id: "${cl1_nurse}"
              captures: { cl1_claim: $.data.id }
            - call: "POST /clinical-ladder/reimbursement-claims/${cl1_claim}/deny"
              payload: { denial_reason: "late filing" }
              as: ProgramAdmin
          trigger:
            - call: "POST /clinical-ladder/reimbursement-claims/${cl1_claim}/approve"
              payload: {}
              as: ProgramAdmin
              captures: { cl1_err: $.data.error_id }
          assert:
            - "cl1_err == ERR_INVALID_STATE"

      - name: ops_sweep_expires_stale_assignment
        claim_type: side_effect_execution
        grounds: [state_machines.ReviewAssignment.PENDING_to_EXPIRED]
        distinguishing_aspect: "ReviewAssignment still PENDING 15 days after creation is swept to EXPIRED by _ops/run_cycle; quorum gate then excludes it."
        test_recipe:
          setup: ["Application IN_REVIEW with one PENDING assignment created at 2026-08-01; clock advances to 2026-08-16"]
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 0, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-EX", full_name: "Ex Nurse", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
              captures: { ex_nurse: $.data.id, ex_nv: $.data.version }
