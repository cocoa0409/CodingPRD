            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "SUBCONTRACTOR_LIST" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/subcontractor-exposures", payload: { subcontractor_name: "SubNoCert", payments_dollars: 10000, governing_class_code_id: "${cc_a}" }, as: Auditor, as_user_id: "${aud}", captures: { sub1: "$.data.id" } }
