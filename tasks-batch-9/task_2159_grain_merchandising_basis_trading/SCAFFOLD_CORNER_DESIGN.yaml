              captures: { tkt_id: $.data.id }
          trigger:
            - call: "POST /grain/delivery-tickets/${tkt_id}/apply"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BUSHELS_EXCEEDED"
            - "the response status is 422"
            - "DeliveryTicket.${tkt_id}.status == GRADED and net_bushels == 15000.00"
            - "PurchaseContract.${c_id}.delivered_bushels == 0.00"
            - "PurchaseContract.${c_id}.delivery_status == OPEN"

      - name: curing_a_call_with_a_short_payment_returns_cure_amount_insufficient
        claim_type: Violation to Error
        grounds:
          - validations[priority=37]
          - errors[ERR_CURE_AMOUNT_INSUFFICIENT]
        distinguishing_aspect: "Inside the cure window a 100.00 payment against a 10400.00 call fails at priority 37 with ERR_CURE_AMOUNT_INSUFFICIENT, leaving the call OPEN, cured_amount_usd 0 and posted_margin_usd unchanged at 6600.00."
        test_recipe:
          setup:
            - "One desk with a 5,000,000 USD credit line and a SHORT CORN 2026-12 position of 4 lots at 448, marked to 500 so an OPEN 10400.00 call exists with the clock still inside the cure window."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "CD39", name: "Corner Desk 39", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 4, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp_id: $.data.id }
            - call: "POST /grain/hedge-positions/${hp_id}/mark-to-market"
              payload: { settlement_price_cents: 500 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
            - call: "GET /grain/margin-calls?hedge_position_id=${hp_id}&status=OPEN"
              payload: {}
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { call_id: "$.data[0].id" }
          trigger:
            - call: "POST /grain/margin-calls/${call_id}/cure"
              payload: { payment_usd: 100.00 }
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { err: $.data.error_id }
          assert:
            - "MarginCall.${call_id}.issued_at == 2026-08-01T00:00:00.000Z"
            - "MarginCall.${call_id}.cure_deadline_at == 2026-08-02T00:00:00.000Z"
            - "${err} == ERR_CURE_AMOUNT_INSUFFICIENT"
            - "the response status is 422"
            - "MarginCall.${call_id}.status == OPEN and cured_amount_usd == 0"
            - "HedgePosition.${hp_id}.posted_margin_usd == 6600.00 and status == MARGIN_CALL"

      - name: cancelling_as_the_creating_user_returns_segregation_of_duties
        claim_type: Segregation of duties
        grounds:
          - validations[priority=25]
          - entities.PurchaseContract.fields.created_by_user_id
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "The check compares X-User-ID, not role: a RiskOfficer request carrying the same user id that created the contract is refused with ERR_SEGREGATION_OF_DUTIES (403), and the identical request from a different user id succeeds."
        test_recipe:
          setup:
            - "Desk, elevator, SHORT 2026-12 hedge with 10 lots at 448, ACTIVE basis -32 bid and one FULLY_PRICED 20,000-bushel CASH contract created by user id u-dual-1."
          setup_api_calls:
