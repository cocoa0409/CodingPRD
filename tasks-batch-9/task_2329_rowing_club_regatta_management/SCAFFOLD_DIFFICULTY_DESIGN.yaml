            - call: "POST /boathouse/water-sessions"
              payload: { shell_id: "${shell_a_id}", session_kind: "PRACTICE", planned_start_at: "2026-08-01T06:00:00Z", planned_end_at: "2026-08-01T08:00:00Z", coach_member_id: "${coach_id}", primary_launch_driver_member_id: "${driver_id}", athlete_member_ids: ["${nell_id}"] }
              as: Coach
