      - name: scan_unknown_barcode_returns_404
        claim_type: violation_to_error
        grounds: ["errors[ERR_BARCODE_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "Scanning a barcode that matches no item of the transaction's event yields 404 ERR_BARCODE_NOT_FOUND (existence), distinct from ERR_ITEM_NOT_ON_FLOOR."
        test_recipe:
          setup: ["Event in SALE_ACTIVE; OPEN transaction."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
