  - rule_id: compensating_invariant
    instances:
      - name: seat_capacity_conservation_survives_cancel
        grounds:
          - conserved_invariants.seat_capacity_conservation
          - calculations.test_center_seat_ledger
          - state_machines.ExamAppointment.SCHEDULED_to_CANCELLED_BY_CANDIDATE
          - state_machines.ExamAuthorization.SCHEDULED_to_APPROVED_TO_SIT
          - endpoints[POST /exam-appointments/{exam_appointment_id}/cancel]
        distinguishing_aspect: |
          The forward action decrements a stored counter and the compensating action must restore it exactly,
          so seats_committed + seats_available == seat_count has to hold before, during and after the cycle.
          The compensation is also CYCLIC on a second entity: the authorization must return from SCHEDULED to
          APPROVED_TO_SIT (not advance to a terminal state), and its attempt_number must NOT be consumed —
          the classic drift bug is a cancel that releases the seat but burns the attempt or leaves the
          authorization stranded in SCHEDULED with no appointment.
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z default."
            - "Applicant 'Wren Castile' holds an EXAM_APPROVED PE_CIVIL application with an APPROVED_TO_SIT authorization (attempt_number 1), verified through supervisor 'Otto Vance'."
            - "TestCenter 'Medford Hall' is OPEN with seat_labels [S1, S2] (seat_count 2)."
            - "Wren holds a SCHEDULED appointment on S1 for 2026-09-10T08:00Z..16:00Z, so seats_committed is 1, seats_available is 1 and the sum equals seat_count 2."
