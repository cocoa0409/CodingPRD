              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_mrun
              call: "POST /machining-runs"
              payload: { engine_platform_id: "${plat_id}", casting_lot_id: "${lot_cast_id}", component_type: "CYLINDER_BORE", lsl_mm: 64.980, usl_mm: 65.020 }
