            - "DistributionEvent.${rc_evt_id}.status == RECALLED"
            - "DistributionEvent.${rc_evt_id}.recycled_amount_cents == 3000000"
            - "Commitment.${rca_id}.drawn_cents == 4200000"
            - "Commitment.${rcb_id}.drawn_cents == 2800000"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: commitment_default_cascades_to_call_partially_defaulted
        grounds:
          - state_machines.Commitment.ACTIVE_to_DEFAULTED
          - state_machines.CapitalCall.ISSUED_to_PARTIALLY_DEFAULTED
          - entities.LimitedPartner.fields.default_strike_count
        distinguishing_aspect: |
          Depth-3 cascade from a Commitment trigger: declare-default mutates the Commitment (A) ->
          its PENDING CapitalCallAllocation is set DEFAULTED (B, caused by A) -> that allocation's parent
          CapitalCall re-evaluates to PARTIALLY_DEFAULTED (C, caused by B), each hop caused by the prior.
        test_recipe:
          setup:
            - "Fund INVESTING; LP with default_strike_count 1 (one allocation already DEFAULTED on a prior call)."
            - "An ACTIVE commitment for that LP with a PENDING allocation on a second ISSUED call that also has a fundable peer allocation."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP K", lp_type: "INSTITUTION", tax_id_last4: "9005" }
              as: FundAdministrator
              captures: { lpk_id: "$.data.id" }
            - call: "POST /limited-partners"
              payload: { legal_name: "LP L", lp_type: "INSTITUTION", tax_id_last4: "9006" }
              as: FundAdministrator
              captures: { lpl_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "Cascade Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { csf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${csf_id}", lp_id: "${lpk_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { csk_id: "$.data.id" }
            - call: "POST /commitments/${csk_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${csf_id}", lp_id: "${lpl_id}", committed_cents: 4000000 }
              as: FundManager
              captures: { csl_id: "$.data.id" }
            - call: "POST /commitments/${csl_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /funds/${csf_id}/activate"
              payload: {}
              as: FundManager
            # First call: LP K's allocation will be defaulted to reach strike_count 1.
            - call: "GET /funds/${csf_id}"
              payload: {}
              as: FundManager
              captures: { csf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${csf_id}", purpose: "INVESTMENT", called_amount_cents: 1000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${csf_v1}" }
              as: FundManager
              captures: { cs_call1_id: "$.data.id" }
            - call: "GET /capital-call-allocations?commitment_id=${csk_id}"
              payload: {}
              as: FundAdministrator
              captures: { cs_k_alloc1_id: "$.data[0].id" }
            - call: "POST /capital-call-allocations/${cs_k_alloc1_id}/default"
              payload: {}
              as: FundAdministrator
            # Second call: LP K's allocation is PENDING; peer LP L allocation also PENDING.
            - call: "GET /funds/${csf_id}"
              payload: {}
              as: FundManager
              captures: { csf_v2: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${csf_id}", purpose: "INVESTMENT", called_amount_cents: 900000, due_date: "2024-03-01T00:00:00Z", expected_fund_version: "${csf_v2}" }
              as: FundManager
              captures: { cs_call2_id: "$.data.id" }
            - call: "GET /capital-call-allocations?commitment_id=${csk_id}&capital_call_id=${cs_call2_id}"
              payload: {}
              as: FundAdministrator
              captures: { cs_k_alloc2_id: "$.data[0].id" }
          trigger:
            - call: "POST /commitments/${csk_id}/declare-default"
              payload: {}
              as: FundManager
              captures: { cs_def_status: "$.data.status" }
          assert:
            - "Commitment.${csk_id}.status == DEFAULTED"
            - "CapitalCallAllocation.${cs_k_alloc2_id}.status == DEFAULTED"
            - "CapitalCall.${cs_call2_id}.status == PARTIALLY_DEFAULTED"

      - name: writeoff_mark_cascades_to_investment_and_company
        grounds:
          - state_machines.ValuationMark.DRAFT_to_FINAL
          - entities.Investment.fields.status
          - entities.PortfolioCompany.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from a ValuationMark trigger (different origin than the commitment-default
          cascade): finalizing a WRITE_OFF mark sets the mark FINAL (A) -> its owning Investment to
          IMPAIRED (B, caused by A) -> that Investment's PortfolioCompany to WRITTEN_OFF (C, caused by B).
        test_recipe:
          setup:
            - "Fund with one ACTIVE investment in a HELD portfolio company; a DRAFT WRITE_OFF mark on that investment."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP M", lp_type: "INSTITUTION", tax_id_last4: "9007" }
              as: FundAdministrator
              captures: { lpm_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "WriteOff Fund", vintage_year: 2024, target_size_cents: 5000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { wof_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${wof_id}", lp_id: "${lpm_id}", committed_cents: 5000000 }
              as: FundManager
              captures: { wom_id: "$.data.id" }
            - call: "POST /commitments/${wom_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /portfolio-companies"
              payload: { name: "Delta", sector: "Bio" }
              as: FundManager
              captures: { wopc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${wof_id}", portfolio_company_id: "${wopc_id}", cost_basis_cents: 3000000, ownership_pct_bps: 1200 }
              as: FundManager
              captures: { woinv_id: "$.data.id" }
            - call: "POST /valuation-marks"
              payload: { investment_id: "${woinv_id}", as_of_date: "2024-06-30T00:00:00Z", fair_value_cents: 0, methodology: "WRITE_OFF" }
              as: FundAdministrator
              captures: { womark_id: "$.data.id" }
          trigger:
            - call: "POST /valuation-marks/${womark_id}/finalize"
              payload: {}
              as: FundAdministrator
              captures: { wo_mark_status: "$.data.status" }
          assert:
            - "ValuationMark.${womark_id}.status == FINAL"
            - "Investment.${woinv_id}.status == IMPAIRED"
            - "Investment.${woinv_id}.current_mark_cents == 0"
            - "PortfolioCompany.${wopc_id}.status == WRITTEN_OFF"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_capital_call_cancel
        grounds:
          - validations[priority=6]
          - validations[priority=13]
        distinguishing_aspect: |
          state (priority 6, ERR_INVALID_STATE) vs business_fiscal (priority 13,
          ERR_CALL_EXCEEDS_UNFUNDED): cancelling an already-CANCELLED call while also (hypothetically)
          requesting more than unfunded returns the higher-priority ERR_INVALID_STATE, not the fiscal error.
        test_recipe:
          setup:
            - "An ISSUED capital call that is cancelled (now CANCELLED); a second cancel is attempted."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP N", lp_type: "INSTITUTION", tax_id_last4: "9008" }
              as: FundAdministrator
              captures: { lpn_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "PriOne Fund", vintage_year: 2024, target_size_cents: 6000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { p1f_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${p1f_id}", lp_id: "${lpn_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { p1c_id: "$.data.id" }
            - call: "POST /commitments/${p1c_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${p1f_id}"
              payload: {}
              as: FundManager
              captures: { p1f_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${p1f_id}", purpose: "INVESTMENT", called_amount_cents: 1000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${p1f_v1}" }
              as: FundManager
              captures: { p1call_id: "$.data.id" }
            - call: "POST /capital-calls/${p1call_id}/cancel"
              payload: {}
              as: FundManager
          trigger:
            - call: "POST /capital-calls/${p1call_id}/cancel"
              payload: {}
              as: FundManager
              captures: { p1_err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: temporal_overlap_beats_mfn_safety_unreached
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          business_temporal (priority 9, ERR_FEE_PERIOD_OVERLAP) vs business_safety (priority 11,
          ERR_MFN_RANK_TAKEN) — a different category pair than instance 1: a fee-accrual whose period
          overlaps an existing accrual returns ERR_FEE_PERIOD_OVERLAP regardless of any unrelated MFN clash.
        test_recipe:
          setup:
            - "Fund with one ACCRUED fee accrual for 2024-01-01..2024-04-01; a new accrual for 2024-03-01..2024-05-01 overlaps it."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP O", lp_type: "INSTITUTION", tax_id_last4: "9009" }
              as: FundAdministrator
              captures: { lpo_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "PriTwo Fund", vintage_year: 2024, target_size_cents: 6000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800 }
              as: FundManager
              captures: { p2f_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${p2f_id}", lp_id: "${lpo_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { p2c_id: "$.data.id" }
            - call: "POST /commitments/${p2c_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /funds/${p2f_id}/fee-accruals"
              payload: { period_start: "2024-01-01T00:00:00Z", period_end: "2024-04-01T00:00:00Z" }
              as: FundAdministrator
              captures: { p2accr_id: "$.data.id" }
          trigger:
            - call: "POST /funds/${p2f_id}/fee-accruals"
              payload: { period_start: "2024-03-01T00:00:00Z", period_end: "2024-05-01T00:00:00Z" }
              as: FundAdministrator
              captures: { p2_err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_FEE_PERIOD_OVERLAP"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: recycling_cap_boundary_exact_zero_headroom
        grounds:
          - calculations.recycle_distribution
          - validations[priority=15]
          - entities.Fund.fields.recycled_to_date_cents
        distinguishing_aspect: |
          Numeric-threshold boundary on the recall endpoint: with recycled_to_date already at the cap,
          headroom == 0 so recallable <= 0 and the recall is rejected with ERR_RECYCLING_CAP_EXCEEDED;
          one cent of headroom would have allowed it.
        test_recipe:
          setup:
            - "Fund recycling_cap_pct_bps 5000 (cap = 50% of 10000000 committed = 5000000); already recycled 5000000."
            - "A second PAID recyclable distribution exists to attempt recalling beyond the cap."
          setup_api_calls:
            - call: "POST /limited-partners"
              payload: { legal_name: "LP P", lp_type: "INSTITUTION", tax_id_last4: "9010" }
              as: FundAdministrator
              captures: { lpp_id: "$.data.id" }
            - call: "POST /limited-partners"
              payload: { legal_name: "LP Q", lp_type: "INSTITUTION", tax_id_last4: "9011" }
              as: FundAdministrator
              captures: { lpq_id: "$.data.id" }
            - call: "POST /funds"
              payload: { name: "CapBoundary Fund", vintage_year: 2024, target_size_cents: 10000000, mgmt_fee_rate_bps: 200, carry_rate_bps: 2000, pref_rate_bps: 800, recycling_cap_pct_bps: 5000 }
              as: FundManager
              captures: { cbf_id: "$.data.id" }
            - call: "POST /commitments"
              payload: { fund_id: "${cbf_id}", lp_id: "${lpp_id}", committed_cents: 6000000 }
              as: FundManager
              captures: { cbp_id: "$.data.id" }
            - call: "POST /commitments/${cbp_id}/accept"
              payload: {}
              as: FundManager
            - call: "POST /commitments"
              payload: { fund_id: "${cbf_id}", lp_id: "${lpq_id}", committed_cents: 4000000 }
              as: FundManager
              captures: { cbq_id: "$.data.id" }
            - call: "POST /commitments/${cbq_id}/accept"
              payload: {}
              as: FundManager
            - call: "GET /funds/${cbf_id}"
              payload: {}
              as: FundManager
              captures: { cbf_v1: "$.data.version" }
            - call: "POST /capital-calls"
              payload: { fund_id: "${cbf_id}", purpose: "INVESTMENT", called_amount_cents: 10000000, due_date: "2024-02-01T00:00:00Z", expected_fund_version: "${cbf_v1}" }
              as: FundManager
              captures: { cb_call_id: "$.data.id" }
            - call: "GET /capital-calls/${cb_call_id}/allocations"
              payload: {}
              as: FundAdministrator
              captures: { cbal1_id: "$.data[0].id", cbal1_amt: "$.data[0].allocated_amount_cents", cbal2_id: "$.data[1].id", cbal2_amt: "$.data[1].allocated_amount_cents" }
            - call: "POST /capital-call-allocations/${cbal1_id}/fund"
              payload: { paid_amount_cents: "${cbal1_amt}" }
              as: FundAdministrator
            - call: "POST /capital-call-allocations/${cbal2_id}/fund"
              payload: { paid_amount_cents: "${cbal2_amt}" }
              as: FundAdministrator
            - call: "POST /portfolio-companies"
              payload: { name: "Epsilon", sector: "Energy" }
              as: FundManager
              captures: { cbpc_id: "$.data.id" }
            - call: "POST /investments"
              payload: { fund_id: "${cbf_id}", portfolio_company_id: "${cbpc_id}", cost_basis_cents: 10000000, ownership_pct_bps: 1000 }
              as: FundManager
              captures: { cbinv_id: "$.data.id" }
            - call: "POST /investments/${cbinv_id}/realize"
              payload: { realized_proceeds_cents: 10000000 }
              as: FundManager
            # First recyclable distribution of 5000000 — recalled to fill the cap exactly.
            - call: "GET /funds/${cbf_id}"
              payload: {}
              as: FundManager
              captures: { cbf_v2: "$.data.version" }
            - call: "POST /distribution-events"
              payload: { fund_id: "${cbf_id}", source_investment_id: "${cbinv_id}", gross_amount_cents: 5000000, distribution_type: "RETURN_OF_CAPITAL", recyclable: true, expected_fund_version: "${cbf_v2}" }
              as: FundManager
              captures: { cb_evt1_id: "$.data.id" }
            - call: "POST /distribution-events/${cb_evt1_id}/pay"
              payload: {}
              as: FundAdministrator
            - call: "POST /distribution-events/${cb_evt1_id}/recall"
              payload: {}
              as: FundManager
            # Second recyclable distribution — its recall must hit zero headroom.
            - call: "GET /funds/${cbf_id}"
              payload: {}
              as: FundManager
              captures: { cbf_v3: "$.data.version" }
            - call: "POST /distribution-events"
              payload: { fund_id: "${cbf_id}", source_investment_id: "${cbinv_id}", gross_amount_cents: 2000000, distribution_type: "RETURN_OF_CAPITAL", recyclable: true, expected_fund_version: "${cbf_v3}" }
              as: FundManager
              captures: { cb_evt2_id: "$.data.id" }
            - call: "POST /distribution-events/${cb_evt2_id}/pay"
              payload: {}
              as: FundAdministrator
          trigger:
