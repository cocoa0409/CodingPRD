      - call: POST /issuer-applications/${app_id}/review
        payload: {}
        as: AgencyReviewer
        as_user_id: reviewer-1
      - call: POST /issuer-applications/${app_id}/approve
        payload: {}
        as: AgencyReviewer
        as_user_id: reviewer-1
      - call: GET /issuer-applications/${app_id}
        payload: {}
        as: AgencyReviewer
        captures:
          iss_id: $.data.approved_issuer_id
      - call: GET /issuers/${iss_id}
        payload: {}
        as: PlatformAdmin
        captures:
          iss_v: $.data.version
      - call: POST /document-custodians
        payload:
          firm_name: TrustVault Custody
        as: PlatformAdmin
        captures:
          cust_id: $.data.id
      - call: POST /custodian-engagements
        payload:
          custodian_id: ${cust_id}
          issuer_id: ${iss_id}
          window_start: '2026-01-01'
          window_end: '2027-01-01'
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /pools
        payload:
          issuer_id: ${iss_id}
          custodian_id: ${cust_id}
          pool_type: SINGLE_FAMILY
          term_months: 360
          note_rate_bps: 700
          expected_issuer_version: ${iss_v}
        as: IssuerOfficer
        as_user_id: ${iss_id}
        captures:
          pool_id: $.data.id
      - call: POST /loans
        payload:
          pool_id: ${pool_id}
          principal_balance_cents: 2000000
          note_rate_bps: 800
          government_insurance: FHA
          escrow_monthly_cents: 20000
        as: IssuerOfficer
        as_user_id: ${iss_id}
      - call: POST /loans
        payload:
          pool_id: ${pool_id}
