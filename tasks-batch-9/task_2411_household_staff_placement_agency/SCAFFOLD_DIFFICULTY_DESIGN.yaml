  - name: adjudicated_fail_cascades_through_candidate_trial_and_requisition
    grounds: state_machines.BackgroundVerification.FLAGGED -> ADJUDICATED_FAIL (cascade hops 1-4); state_machines.Candidate.BACKGROUND_PENDING
      -> REJECTED; state_machines.TrialEngagement.SCHEDULED -> CANCELLED; state_machines.RoleRequisition.TRIALING
      -> SOURCING
    mechanism: 'One adjudication write moves four rows: the verification to ADJUDICATED_FAIL (hop 1 rejects the candidate),
      hop 2 cancels the candidate''s live trial with cancel_reason VETTING_FAILED, hop 3 demotes the now-empty TRIALING
      requisition to SOURCING, and hop 4 parks the availability dimension at INACTIVE. Nothing in the request body
      names the trial or the requisition.'
    naive_implementation: Set the verification status and reject the candidate, leaving the SCHEDULED trial and the
      TRIALING requisition behind as orphans that the household can still act on.
    distinguishing_aspect: A single POST to /background-verifications/{id}/adjudicate changes four rows across four
      entities, with the trial's cancel_reason stamped VETTING_FAILED and the requisition's active_trial_count back
      to 0.
