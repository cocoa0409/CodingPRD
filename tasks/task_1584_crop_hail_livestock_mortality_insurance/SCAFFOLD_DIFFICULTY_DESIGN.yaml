# =============================================================================
# Task 1584 — Crop Hail & Livestock Mortality Insurance
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 difficulty rules × 2 instances each = 18 instances total
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc
  # Two calculations, different entity domains, both exhibit provisional-vs-final
  # or context-dependent divergence on identical data.
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: policy_premium_provisional_vs_final_at_bind
        grounds:
          - calculations.policy_premium_aggregation
          - state_machines.Policy.APPLICATION_to_BOUND
        distinguishing_aspect: |
          Entity domain = Policy premium. Same CoverageUnit set, same
          RateTable; the provisional variant runs at unit-create time with the
          then-current clock and picks one RateTable row; the final variant runs
          at bind time after a newer RateTable row has been published and picks
          the newer row, yielding a different frozen premium.
        test_recipe:
          setup:
            - "Carrier exists; one grower G with prior_claims_count=0 (surcharge=0)"
            - "RateTable R1 PUBLISHED (crop-hail, county=06001, crop=CORN, rate=350 cents per $100, effective 2026-01-01, open-ended)"
            - "RateTable R2 DRAFT then PUBLISHED (same kind/county/crop, rate=400, effective 2026-08-01, open-ended). After R2 publishes, R1 must be superseded first to avoid overlap."
            - "Policy P in APPLICATION; one CoverageUnit CU (county=06001, crop=CORN, declared_acres=100). At CU creation clock=2026-07-15, R1 selected → CU.premium_cents = round_half_up(4_000_000 * 350 / 10_000) = 140_000."
            - "Clock advanced to 2026-08-01; bind runs against R2 → policy.premium_cents = round_half_up(4_000_000 * 400 / 10_000) = 160_000 (recomputed at bind time per the final variant)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-A", legal_name: "Carrier A", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 350, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { r1_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${r1_id}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower A", tax_id_last4: "1234", email: "a@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-07-20T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 100 }
              as: Underwriter
              captures: { cu_id: $.data.id, cu_prov_premium: $.data.premium_cents }
            # Advance clock past R1's effective window, supersede R1, publish R2.
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 400, effective_from: "2026-08-01T00:00:00Z" }
              as: Underwriter
              captures: { r2_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${r1_id}/supersede"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/rate-tables/${r2_id}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Underwriter
          trigger:
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
              captures: { final_premium: $.data.premium_cents }
          assert:
            - "CoverageUnit.${cu_id}.premium_cents == 140000  (provisional at unit-create, R1)"
            - "Policy.${policy_id}.premium_cents == 160000    (final at bind, R2 picked)"
            - "Policy.${policy_id}.lifecycle_state == BOUND"
            - "Policy.${policy_id}.billing_state == BILLED"


      - name: provisional_vs_final_indemnity_divergence_on_claim
        grounds:
          - calculations.provisional_indemnity
          - calculations.final_indemnity
          - state_machines.Claim.INSPECTION_SCHEDULED_to_INSPECTED
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Entity domain = Claim indemnity (distinct from Policy premium). Same
          FieldInspection inputs produce 95_000 provisionally; the final variant
          runs at LossDetermination with approver-supplied PARTIAL approved
          amount = 90_000 and a 20% dual-coverage offset against a 200_000-cent
          federal liability (= 40_000), yielding final = 90_000 - 40_000 = 50_000.
        test_recipe:
          setup:
            - "Carrier; grower; PUBLISHED livestock rate CATTLE band [150000,250000), rate=400"
            - "Federal crop policy for the same grower with liability_cents=200_000, crop_code='CATTLE', county='06001', status=ACTIVE"
            - "Policy P (LIVESTOCK_MORTALITY) with CU(species=CATTLE, head_count=10, per_head_value=200_000); liability=2_000_000; premium=80_000; reserve=48_000"
            - "P BOUND, PAID_IN_FULL (80_000), clock advanced to 2026-08-03 (ACTIVE)"
            - "Initial HeadReport timely (10 head)"
            - "Claim filed loss_date=2026-08-04, deceased=1, appraised=100_000"
            - "DualCoverageLink created between P and the FederalCropPolicy"
            - "Adjuster assigned, FieldInspection submitted (observed_appraisal=95_000, observed_deceased_count=1) → provisional = 95_000"
            - "Submit for review → UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-B2", legal_name: "Carrier B2", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Rancher B", tax_id_last4: "5555", email: "b@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/adjusters"
              payload: { full_name: "Adj B", license_number: "ADJ-B2-1", county_codes: ["06001"], species_qualified: ["CATTLE"], capacity_max_open_claims: 5 }
              as: Underwriter
              captures: { adjuster_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "LIVESTOCK_MORTALITY", species: "CATTLE", value_band_floor_cents: 150000, value_band_ceiling_cents: 250000, rate_per_100_cents_of_liability: 400, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt_id}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/federal-crop-policies"
              payload: { grower_id: "${grower_id}", fci_policy_number: "FCI-B2-1", coverage_level_pct: 0.75, crop_code: "CATTLE", county_code: "06001", effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-12-31T00:00:00Z", liability_cents: 200000 }
              as: Underwriter
              captures: { fci_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "LIVESTOCK_MORTALITY", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2027-08-02T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { species: "CATTLE", declared_head_count: 10, per_head_value_cents: 200000 }
              as: Underwriter
              captures: { cu_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/premium-payments"
              payload: { amount_cents: 80000 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units/${cu_id}/head-reports"
              payload: { report_kind: "INITIAL", reported_head_count: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims"
              payload: { coverage_unit_id: "${cu_id}", loss_date: "2026-08-04T00:00:00Z", appraisal_value_cents: 100000, deceased_head_count: 1 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { claim_id: $.data.id, policy_v_pre: $.data.version }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/dual-coverage-links"
              payload: { federal_crop_policy_id: "${fci_id}" }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/field-inspections"
              payload: { adjuster_id: "${adjuster_id}", scheduled_for: "2026-08-04T12:00:00Z", observed_appraisal_cents: 95000, observed_deceased_count: 1, notes: "single head dead" }
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/submit-for-review"
              payload: {}
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "GET /carriers/${carrier_id}/policies/${policy_id}"
              payload: {}
              as: ClaimsApprover
              captures: { policy_v_at_review: $.data.version }
          trigger:
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/determinations"
              payload: { decision: "PARTIAL", approved_indemnity_cents: 90000, expected_policy_version: "${policy_v_at_review}" }
              as: ClaimsApprover
              captures: { det_id: $.data.id, final_indem: $.data.final_indemnity_cents }
          assert:
            - "Claim.${claim_id}.provisional_indemnity_cents == 95000"
            - "LossDetermination.${det_id}.applied_coverage_reduction_pct == 0"
            - "LossDetermination.${det_id}.applied_late_notification_penalty_pct == 0"
            - "LossDetermination.${det_id}.applied_dual_coverage_offset_cents == 40000"
            - "LossDetermination.${det_id}.final_indemnity_cents == 50000"
            - "Claim.${claim_id}.final_indemnity_cents == 50000"
            - "Claim.${claim_id}.claim_state == APPROVED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (two DIFFERENT modes: (b) nested rounding and
  # (a) multi-input non-linear interaction)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: nested_rounding_per_unit_then_sum_then_surcharge_then_credit
        grounds:
          - calculations.policy_premium_aggregation
          - calculations.high_risk_surcharge_tier
          - calculations.continuous_coverage_carryover_credit
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Per-unit round_half_up
          THEN sum THEN apply high-risk surcharge THEN subtract carryover credit.
          We pin: acres=3 and acres=5, rate=333, surcharge=10% (prior_claims_count=2),
          carryover credit = round_half_up(prior_premium*0.05) = 200. Per-unit:
          3996 + 6660 = 10656; *1.10 = 11722 (rounded); -200 = 11522.
        test_recipe:
          setup:
            - "Carrier; grower G"
            - "PUBLISHED rate R (crop-hail, 06001, CORN, rate=333)"
            - "Adjuster ADJ licensed for 06001"
            - "Prior policy P0 with TWO CUs (3 acres and 1 acre), BOUND, PAID_IN_FULL"
            - "Two Claims on P0 (one per CU), each pushed to APPROVED so Grower.prior_claims_count becomes 2"
            - "P0 expired by advancing clock past 2026-08-20"
            - "New policy P1 with prior_policy_id=P0, effective_date=2026-08-23 (gap=3d), expiration=2026-12-31"
            - "P1 has two CUs: 3 acres and 5 acres"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-C2", legal_name: "Carrier C2", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower C", tax_id_last4: "7777", email: "c@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/adjusters"
              payload: { full_name: "Adj C", license_number: "ADJ-C-1", county_codes: ["06001"], species_qualified: [], capacity_max_open_claims: 10 }
              as: Underwriter
              captures: { adjuster_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt_id}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-08-20T00:00:00Z" }
              as: Underwriter
              captures: { prior_policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 3 }
              as: Underwriter
              captures: { prior_cu1: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
              captures: { prior_cu2: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/bind"
              payload: {}
              as: Underwriter
            # Prior premium = round_half_up(3*40000*333/10000) + round_half_up(1*40000*333/10000) = 3996 + 1332 = 5328
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/premium-payments"
              payload: { amount_cents: 5328 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            # File two claims (one per CU). Each must go REPORTED→INSPECTION_SCHEDULED→INSPECTED→UNDER_REVIEW→APPROVED.
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims"
              payload: { coverage_unit_id: "${prior_cu1}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { claim1_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims/${claim1_id}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims/${claim1_id}/field-inspections"
              payload: { adjuster_id: "${adjuster_id}", scheduled_for: "2026-08-04T12:00:00Z", observed_percent_damage_pct: 10, notes: "hail dmg" }
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims/${claim1_id}/submit-for-review"
              payload: {}
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "GET /carriers/${carrier_id}/policies/${prior_policy_id}"
              payload: {}
              as: ClaimsApprover
              captures: { p0_v1: $.data.version }
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims/${claim1_id}/determinations"
              payload: { decision: "APPROVE", approved_indemnity_cents: 10000, expected_policy_version: "${p0_v1}" }
              as: ClaimsApprover
            # Claim 2
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims"
              payload: { coverage_unit_id: "${prior_cu2}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { claim2_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims/${claim2_id}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims/${claim2_id}/field-inspections"
              payload: { adjuster_id: "${adjuster_id}", scheduled_for: "2026-08-04T12:00:00Z", observed_percent_damage_pct: 10, notes: "hail dmg 2" }
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims/${claim2_id}/submit-for-review"
              payload: {}
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "GET /carriers/${carrier_id}/policies/${prior_policy_id}"
              payload: {}
              as: ClaimsApprover
              captures: { p0_v2: $.data.version }
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/claims/${claim2_id}/determinations"
              payload: { decision: "APPROVE", approved_indemnity_cents: 5000, expected_policy_version: "${p0_v2}" }
              as: ClaimsApprover
            # Expire P0
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: Underwriter
            - call: "GET /carriers/${carrier_id}/policies/${prior_policy_id}"
              payload: {}
              as: Underwriter
              captures: { p0_v_final: $.data.version }
          trigger:
            - call: "POST /carriers/${carrier_id}/policies/${prior_policy_id}/renewals"
              payload: { decision: "RENEW", effective_date: "2026-08-23T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", expected_prior_policy_version: "${p0_v_final}" }
              as: Underwriter
              captures: { renewal_id: $.data.id, carryover: $.data.carryover_credit_cents }
            # The renewal creates a new policy. Retrieve it.
            - call: "GET /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}" }
              as: Underwriter
              captures: { new_policy_id: "$.data[1].id" }
            - call: "POST /carriers/${carrier_id}/policies/${new_policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 3 }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${new_policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 5 }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${new_policy_id}/bind"
              payload: {}
              as: Underwriter
              captures: { final_premium: $.data.premium_cents }
          assert:
            - "Renewal.${renewal_id}.continuity_gap_days == 3"
            - "Renewal.${renewal_id}.carryover_credit_cents == 266"   # round_half_up(5328 * 0.05) = round_half_up(266.4) = 266
            - "Policy.${new_policy_id}.continuous_coverage_carryover_credit_cents == 266"
            - "Policy.${new_policy_id}.high_risk_surcharge_pct == 10"
            - "Policy.${new_policy_id}.premium_cents == 11456"          # (3996+6660)*1.10 = 11722; 11722-266 = 11456
            - "Policy.${new_policy_id}.lifecycle_state == BOUND"

      - name: tiered_rate_and_value_band_interaction_livestock
        grounds:
          - calculations.coverage_unit_premium
          - calculations.provisional_indemnity
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction (value
          band lookup + per-head-cap + MIN-of-two-appraisals + tiered surcharge).
          Different from the rounding-order mode exercised by the other instance.
        test_recipe:
          setup:
            - "Carrier; grower; PUBLISHED livestock rate rows: CATTLE band [150000,250000) rate=400; CATTLE band [250000,500000) rate=500"
            - "Policy for CATTLE with TWO CUs — CU1: head_count=4, per_head=200000 (band-1); CU2: head_count=2, per_head=300000 (band-2)"
            - "CU1 liability = 4*200000=800000; premium = round_half_up(800000*400/10000)=32000"
            - "CU2 liability = 2*300000=600000; premium = round_half_up(600000*500/10000)=30000"
            - "subtotal = 62000; no surcharge; premium_cents = 62000"
            - "Claim on CU2: 1 head dead; grower appraised=400000; adjuster observed=350000. Band ceiling=500000 → cap = 500000*1 = 500000. MIN(400000, 350000)=350000 < 500000 cap → provisional=350000."
            - "Claim on CU1: 1 head dead; grower appraised=300000; adjuster observed=280000. Band ceiling=250000 → cap=250000*1=250000. MIN(300000,280000)=280000 but capped to 250000 → provisional=250000."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-D", legal_name: "Carrier D", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Rancher D", tax_id_last4: "8888", email: "d@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/adjusters"
              payload: { full_name: "Adj D", license_number: "ADJ-D-1", county_codes: ["06001"], species_qualified: ["CATTLE"], capacity_max_open_claims: 10 }
              as: Underwriter
              captures: { adjuster_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "LIVESTOCK_MORTALITY", species: "CATTLE", value_band_floor_cents: 150000, value_band_ceiling_cents: 250000, rate_per_100_cents_of_liability: 400, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt1: $.data.id }
