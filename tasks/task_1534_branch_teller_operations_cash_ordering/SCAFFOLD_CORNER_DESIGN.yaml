              captures: { d_id: $.data.id }
            - call: "POST /api/branches/${b_id}/cash-orders"
              payload: { delivery_date: "2026-08-03", expected_branch_version: "${b_ver}", requested_amount_cents: 500000 }
              as: Teller
              as_user_id: "${t_id}"
              captures: { o_id: $.data.id, o_ordered: $.data.ordered_amount_cents }
            - call: "POST /api/cash-orders/${o_id}/approve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
            - call: "POST /api/drawers/${d_id}/transactions"
