              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/commission"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints"
              payload: { reporter_contact: "n1", kind: "ODOR", description: "smell", reported_at: "2026-08-01T09:00:00Z" }
              as: Anonymous
              captures: { c_id: $.data.id }
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${c_id}/resolve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${c_id}/reopen"
              payload: {}
              as: MunicipalAuditor
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${c_id}/resolve"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${c_id}/reopen"
              payload: {}
              as: MunicipalAuditor
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${c_id}/resolve"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/sites/${site_id}/complaints/${c_id}/reopen"
