      - name: sharing_case_appeal_cycle_returns_to_under_review
        grounds:
          - state_machines.SharingCase.SUBSTANTIATED_to_APPEAL_PENDING
          - state_machines.SharingCase.APPEAL_PENDING_to_UNDER_REVIEW
          - state_machines.SeasonPass.REVOKED_to_ACTIVE
          - entities.SharingCase.fields.review_round
          - endpoints[POST /sharing-cases/{case_id}/appeal]
        distinguishing_aspect: |
          The SharingCase machine is cyclic with a branching fork: UNDER_REVIEW forks to SUBSTANTIATED
          or DISMISSED with different side-effect sets, and SUBSTANTIATED loops back through
          APPEAL_PENDING into UNDER_REVIEW a second time (review_round 1 -> 2). The DISMISSED reached on
          round 2 carries compensation side effects that the round-1 DISMISSED would not have, so the
          same trigger on the same target state produces state-history-dependent behaviour.
        test_recipe:
          setup:
            - "Program in SEASON_ACTIVE with PUBLISHED GOLD tier (30000)."
            - "ParkDay 2026-08-05 STANDARD (100/1000)."
            - "Processed ACTIVE GOLD pass bought PAY_IN_FULL (paid_to_date_cents 30000, billing_status PAID_IN_FULL)."
            - "One gate entry on 2026-08-05, then a SharingCase opened manually by gate agent 'agent-77' citing that visit, reviewed by compliance officer 'officer-9' (review_round 1) and decided SUBSTANTIATED — so the pass is REVOKED before the trigger."
