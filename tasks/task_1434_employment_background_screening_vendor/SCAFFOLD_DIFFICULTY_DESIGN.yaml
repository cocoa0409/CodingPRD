          assert:
            - "first decision: error_id == ERR_IA_REQUIRED (jurisdiction mandates IA despite ADVERSE_ELIGIBLE matrix outcome)"
            - "after the PROCEED_ADVERSE IA: decision succeeds, order.adjudication_status == PRE_ADVERSE_PENDING"
