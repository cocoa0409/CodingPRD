  # =========================================================================
  # Rule 7: cross_entity_state_dependency — different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: batch_production_requires_formula_active_and_validation_passed
        grounds:
          - state_machines.ProductionBatch.PLANNED_to_IN_PRODUCTION
          - validations[priority=27]
          - validations[priority=10]
        distinguishing_aspect: |
          ProductionBatch.start-production depends on Formula.status == ACTIVE
          (cross-entity: ProductionBatch -> Formula) and on ProcessValidation.status
          == PASSED with valid_until > now (cross-entity: ProductionBatch -> ProcessValidation).
          Without both, production cannot start.
        test_recipe:
          setup:
            - "A Formula exists in APPROVED status (not yet ACTIVATED — missing label approval)."
            - "A PASSED ProcessValidation exists for the formula."
            - "Clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ADMIN
            - call: "POST /api/v1/nutrient-profiles"
              payload:
                profile_code: "INF-0-6M"
                nutrient_specs:
                  - nutrient_code: "PROTEIN"
                    unit: "g"
                    min_per_100kcal: 1.80
                    max_per_100kcal: 3.50
                    target_per_100kcal: 2.50
                regulation_ref: "21 CFR 107.100"
                effective_from: "2026-01-01T00:00:00Z"
              as: REGULATORY_AFFAIRS
              captures: { npcross_id: $.data.id }
            - call: "POST /api/v1/nutrient-profiles/${npcross_id}/submit"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/nutrient-profiles/${npcross_id}/approve"
              payload: {}
              as: REGULATORY_AFFAIRS
