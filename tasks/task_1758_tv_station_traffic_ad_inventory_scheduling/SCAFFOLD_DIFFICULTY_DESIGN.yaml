              as: SalesRep
            - call: "GET /traffic/orders/${order9x_id}"
              payload: {}
              as: SalesRep
              captures: { order9x_v: "$.data.version"}
            - call: "POST /traffic/orders/${order9x_id}/approve"
              payload: { expected_order_version: "${order9x_v}" }
              as: TrafficManager
            - call: "GET /traffic/orders/${order9x_id}/lines"
              payload: {}
              as: SalesRep
              captures: { line9x_id: "$.data[0].id"}
            - call: "GET /traffic/order-lines/${line9x_id}/spots"
              payload: {}
              as: TrafficManager
              captures: { spot9x_id: "$.data[0].id"}
