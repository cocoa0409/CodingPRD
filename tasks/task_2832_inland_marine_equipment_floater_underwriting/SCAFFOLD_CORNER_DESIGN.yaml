              payload: { part_type: "REPORTING_FORM", valuation_basis: "ACV", deductible_cents: 100000, aggregate_limit_cents: 200000000, reporting_frequency: "MONTHLY", reporting_annual_rate_bp: 250, reporting_limit_cents: 20000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: UnderwritingManager
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/reporting-sweep"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/coverage-parts/${cp}/reporting-sweep"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/coverage-parts/${cp}/value-reports"
              payload: { limit: 100, offset: 0 }
              as: Underwriter
          assert:
            - "trigger[0] HTTP status == 200"
            - "trigger[0] response swept_period_count == 0"
            - "trigger[0] response delinquent_report_ids == [] (empty array, not null)"
            - "trigger[0] response policy_status == IN_FORCE"
            - "trigger[0] response part_id == ${cp}"
            - "after trigger[0]: CoveragePart.${cp}.latest_report_period_end_date is still null and no ValueReport row exists on the part"
            - "after trigger[0]: Policy.${pol}.status == IN_FORCE and premium_balance_cents == 100000 (the minimum premium booked as INITIAL_PREMIUM at bind; a reporting-form part earns nothing until a report is adjudicated)"
            - "trigger[2] response swept_period_count == 1"
            - "trigger[2] response delinquent_report_ids has exactly 1 element"
            - "trigger[2] response policy_status == SUSPENDED"
            - "after trigger[2]: CoveragePart.${cp}.latest_report_period_end_date == 2026-08-31"
            - "trigger[3] response: 1 row, total_count == 1, that report has status DELINQUENT, reported_value_cents == 0, period_start_date 2026-08-01, period_end_date 2026-08-31 and due_date 2026-09-15"
            - "after trigger[2]: Policy.${pol}.premium_balance_cents == 100000 - a delinquency suspends the policy but books no premium"
            - "the September period (2026-09-01..2026-09-30, due 2026-10-15) is NOT swept on either call because it has not fully elapsed"

