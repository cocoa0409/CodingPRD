            - { call: "POST /servicing/escrow-accounts/${acct2_id}/analyses", payload: { analysis_year: 2027, projection_start_date: "2026-09-01", method: "PROSPECTIVE", expected_escrow_account_version: "${acct2_v}" }, as: EscrowAnalyst, as_user_id: "ea_1", captures: { ana2_id: $.data.id } }
            - { call: "POST /servicing/analyses/${ana2_id}/compute", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/analyses/${ana2_id}/issue-statement", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
          trigger:
            - { call: "POST /servicing/analyses/${ana1_id}/finalize", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
            - { call: "POST /servicing/analyses/${ana2_id}/finalize", payload: {}, as: EscrowAnalyst, as_user_id: "ea_1" }
          assert:
            - "EscrowAnalysisCycle.${ana1_id}.surplus_cents == 5000"
            - "Account 1 ledger: GET /servicing/escrow-accounts/${acct1_id}/ledger?entry_type=SURPLUS_REFUND returns exactly 1 row with amount_cents == -5000"
            - "EscrowAccount.${acct1_id}.balance_cents == 20000 (refund brings balance exactly to cushion target)"
            - "EscrowAnalysisCycle.${ana2_id}.surplus_cents == 4999"
            - "Account 2 ledger: GET /servicing/escrow-accounts/${acct2_id}/ledger?entry_type=SURPLUS_REFUND returns 0 rows (credit-only path)"
            - "EscrowAccount.${acct2_id}.balance_cents == 24999 (unchanged)"

      - name: force_placement_exactly_45_days
        grounds:
          - "validations[priority=13]"
          - state_machines.InsurancePolicy.NOTICE_2_SENT_to_FORCE_PLACED
        distinguishing_aspect: |
          Duration boundary: charge at exactly notice_1 + 45 days (and notice_2 + 15 days) succeeds
          (>= semantics); the twin charged at notice_1 + 44 days fails with ERR_NOTICE_WINDOW_NOT_MET.
          Metric: day-count windows. Endpoint: charge-force-placement — distinct metric and endpoint
          from the surplus-cents boundary.
