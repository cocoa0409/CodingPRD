        payload: {}
        as: ComplianceOfficer
      - call: POST /boardgov/insurance-policies/${p1}/activate
        payload: {}
        as: ComplianceOfficer
      - call: POST /boardgov/insurance-policies
        payload:
          nonprofit_id: ${np}
