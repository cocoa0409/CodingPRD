      - name: capsule_embargo_on_the_capsule_row_blocks_a_box_item_buy_out
        grounds:
          - calculations.capsule_embargo_end
          - validations[priority=38]
          - errors[ERR_CAPSULE_EMBARGOED]
          - entities.BoxItem.fields.embargo_until
