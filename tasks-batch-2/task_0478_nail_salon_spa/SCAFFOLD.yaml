    path: "/clients"
    description: "Create a client."
    roles: [FrontDesk, SalonManager]
    code: 201
    input: [full_name, email]
    output: Client
    side_effects: ["loyalty_points_balance=0; active_no_show_strikes=0; deposit_required=false"]
  - method: GET
    path: "/clients"
    description: "List clients."
    roles: [FrontDesk, SalonManager]
    code: 200
    input: ["email?", "deposit_required?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: GET
    path: "/clients/{id}"
    description: "Fetch a client with decayed active_no_show_strikes and deposit_required recomputed against current clock."
    roles: [FrontDesk, SalonManager, Client]
    code: 200
