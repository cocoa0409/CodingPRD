  # ------------------------------------------------------------- Rule 6 ----
  - rule_id: boundary_precision_check
    instances:
      - name: residue_limit_inclusive_boundary
        grounds:
          - calculations.residue_verdict_threshold
          - state_machines.LeafLot.GRADED_to_LAB_SUBMITTED
          - state_machines.LeafLot.GRADED_to_ON_HOLD
        distinguishing_aspect: |
          Metric = pesticide residue ppm on POST /residue-tests: exactly
          0.50 ppm passes (<= inclusive) leaving the lot LAB_SUBMITTED; 0.51
          ppm is FAIL_SOFT and forces ON_HOLD. One-cent-of-a-ppm flips the
          state.
        test_recipe:
          setup:
            - "Supplier ACTIVE; two BLACK lots (10.0 kg each), both graded B, awaiting residue tests"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Boundary Co", origin_region: "Kangra" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-01", weight_kg: 10.0, cost_per_kg_cents: 600, moisture_pct: 5.5 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l1: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l1}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "BLACK", harvest_date: "2026-02-02", weight_kg: 10.0, cost_per_kg_cents: 600, moisture_pct: 5.5 }, as: ProcurementLead, as_user_id: "pl-1", captures: { l2: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${l2}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${l1}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.50, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1", captures: { v1: $.data.verdict } }
            - { call: "POST /tea-ops/leaf-lots/${l2}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.51, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1", captures: { v2: $.data.verdict } }
            - { call: "GET /tea-ops/leaf-lots/${l1}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { st1: $.data.status } }
            - { call: "GET /tea-ops/leaf-lots/${l2}", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { st2: $.data.status } }
          assert:
            - "0.50 ppm: verdict ${v1} == PASS, lot status ${st1} == LAB_SUBMITTED (boundary is inclusive)"
            - "0.51 ppm: verdict ${v2} == FAIL_SOFT, lot status ${st2} == ON_HOLD"

      - name: private_label_minimum_exact_vs_one_below
        grounds:
          - validations[priority=12]
          - state_machines.ProductionRun.IN_PROGRESS_to_COMPLETED
          - errors[ERR_PRIVATE_LABEL_MINIMUM_UNMET]
        distinguishing_aspect: |
          Metric = integer unit count on POST /runs/{id}/complete (different
          metric and endpoint from instance 1): actual_units exactly equal to
          the 1000-unit contract minimum completes; 999 is rejected and the
          run stays IN_PROGRESS.
        test_recipe:
          setup:
            - "RELEASED CONVENTIONAL LOOSE_PACK batch; LOOSE_PACK line; ACTIVE contract (min 1000, total 100000, base 200) on the recipe; two scheduled+started runs in disjoint windows"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Min Co", origin_region: "Darjeeling" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-01", weight_kg: 60.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R11", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r11: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r11}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r11}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 20.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/packaging-lines", payload: { name: "LP-3", line_type: "LOOSE_PACK" }, as: ProductionPlanner, as_user_id: "pp-1", captures: { ln: $.data.id } }
            - { call: "POST /tea-ops/contracts", payload: { customer_name: "Gamma Mart", recipe_id: "${r11}", minimum_units_per_run: 1000, contracted_total_units: 100000, base_unit_price_cents: 200 }, as: AccountManager, as_user_id: "am-1", captures: { c1: $.data.id } }
            - { call: "POST /tea-ops/contracts/${c1}/activate", payload: {}, as: AccountManager, as_user_id: "am-1" }
            - { call: "POST /tea-ops/runs", payload: { line_id: "${ln}", batch_id: "${b}", planned_start: "2026-08-05T08:00:00Z", planned_end: "2026-08-05T09:00:00Z", planned_units: 1000, contract_id: "${c1}" }, as: ProductionPlanner, as_user_id: "pp-1", captures: { run1: $.data.id } }
            - { call: "POST /tea-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:30:00Z" }, as: PlatformAdmin, as_user_id: "adm-1" }
            - { call: "POST /tea-ops/runs/${run1}/start", payload: {}, as: ProductionPlanner, as_user_id: "pp-1" }
            - { call: "POST /tea-ops/runs", payload: { line_id: "${ln}", batch_id: "${b}", planned_start: "2026-08-05T10:00:00Z", planned_end: "2026-08-05T11:00:00Z", planned_units: 1000, contract_id: "${c1}" }, as: ProductionPlanner, as_user_id: "pp-1", captures: { run2: $.data.id } }
            - { call: "POST /tea-ops/runs/${run1}/complete", payload: { actual_units: 1000 }, as: ProductionPlanner, as_user_id: "pp-1", captures: { st1: $.data.status } }
            - { call: "POST /tea-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:30:00Z" }, as: PlatformAdmin, as_user_id: "adm-1" }
            - { call: "POST /tea-ops/runs/${run2}/start", payload: {}, as: ProductionPlanner, as_user_id: "pp-1" }
          trigger:
            - { call: "POST /tea-ops/runs/${run2}/complete", payload: { actual_units: 999 }, as: ProductionPlanner, as_user_id: "pp-1", captures: { err: $.data.error_id } }
            - { call: "GET /tea-ops/runs/${run2}", payload: {}, as: ProductionPlanner, as_user_id: "pp-1", captures: { st2: $.data.status } }
            - { call: "GET /tea-ops/contracts/${c1}", payload: {}, as: AccountManager, as_user_id: "am-1", captures: { fu: $.data.fulfilled_units } }
          assert:
            - "run1 with actual_units == 1000 (exactly the minimum) completed: ${st1} == COMPLETED"
            - "run2 with 999 fails: ${err} == ERR_PRIVATE_LABEL_MINIMUM_UNMET and stays ${st2} == IN_PROGRESS"
            - "PrivateLabelContract.${c1}.fulfilled_units == 1000 (failed completion credits nothing)"

  # ------------------------------------------------------------- Rule 7 ----
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_complete_requires_batch_released
        grounds:
          - state_machines.ProductionRun.IN_PROGRESS_to_COMPLETED
          - state_machines.BlendBatch.RELEASED_to_RECALLED
          - errors[ERR_BATCH_NOT_RELEASABLE]
        distinguishing_aspect: |
          Entity pair ProductionRun -> BlendBatch: a run that is IN_PROGRESS
          when its batch is recalled cannot complete; the cascade cancels only
          SCHEDULED runs, so the live run fails at completion with
          ERR_BATCH_NOT_RELEASABLE.
        test_recipe:
          setup:
            - "RELEASED CONVENTIONAL LOOSE_PACK batch (single GREEN lot); LOOSE_PACK line; run started (clock inside window)"
          setup_api_calls:
            - { call: "POST /tea-ops/suppliers", payload: { name: "Recall Co", origin_region: "Kigali" }, as: ProcurementLead, as_user_id: "pl-1", captures: { sup: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots", payload: { supplier_id: "${sup}", leaf_type: "GREEN", harvest_date: "2026-02-01", weight_kg: 30.0, cost_per_kg_cents: 800, moisture_pct: 5.0 }, as: ProcurementLead, as_user_id: "pl-1", captures: { lot: $.data.id } }
            - { call: "POST /tea-ops/leaf-lots/${lot}/grade-assessments", payload: { aroma_score: 80, briskness_score: 80, appearance_score: 80 }, as: SensoryGrader, as_user_id: "gr-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.20, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/recipes", payload: { name: "R12", certification_target: "CONVENTIONAL", pack_format: "LOOSE_PACK", components: [{ leaf_type: "GREEN", min_grade: "C", pct: 100.0 }] }, as: BlendMaster, as_user_id: "bm-1", captures: { r12: $.data.id } }
            - { call: "POST /tea-ops/recipes/${r12}/activate", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches", payload: { recipe_id: "${r12}", target_weight_kg: 20.0 }, as: BlendMaster, as_user_id: "bm-1", captures: { b: $.data.id } }
            - { call: "POST /tea-ops/batches/${b}/lock-recipe", payload: {}, as: BlendMaster, as_user_id: "bm-1", captures: { bv: $.data.version } }
            - { call: "POST /tea-ops/batches/${b}/allocations", payload: { lot_id: "${lot}", allocated_kg: 20.0, expected_batch_version: "${bv}" }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/finalize-allocation", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/blend", payload: { measured_moisture_pct: 5.0 }, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/submit-qc", payload: {}, as: BlendMaster, as_user_id: "bm-1" }
            - { call: "POST /tea-ops/batches/${b}/release", payload: {}, as: QAManager, as_user_id: "qa-1" }
            - { call: "POST /tea-ops/packaging-lines", payload: { name: "LP-4", line_type: "LOOSE_PACK" }, as: ProductionPlanner, as_user_id: "pp-1", captures: { ln: $.data.id } }
            - { call: "POST /tea-ops/runs", payload: { line_id: "${ln}", batch_id: "${b}", planned_start: "2026-08-05T08:00:00Z", planned_end: "2026-08-05T10:00:00Z", planned_units: 500 }, as: ProductionPlanner, as_user_id: "pp-1", captures: { run: $.data.id } }
            - { call: "POST /tea-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:30:00Z" }, as: PlatformAdmin, as_user_id: "adm-1" }
            - { call: "POST /tea-ops/runs/${run}/start", payload: {}, as: ProductionPlanner, as_user_id: "pp-1" }
          trigger:
            - { call: "POST /tea-ops/batches/${b}/recall", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { b_st: $.data.status } }
            - { call: "POST /tea-ops/runs/${run}/complete", payload: { actual_units: 500 }, as: ProductionPlanner, as_user_id: "pp-1", captures: { err: $.data.error_id } }
            - { call: "GET /tea-ops/runs/${run}", payload: {}, as: ProductionPlanner, as_user_id: "pp-1", captures: { r_st: $.data.status } }
          assert:
            - "BlendBatch.${b}.status == RECALLED (${b_st})"
            - "complete fails: ${err} == ERR_BATCH_NOT_RELEASABLE"
            - "the IN_PROGRESS run was NOT cascade-cancelled (only SCHEDULED runs are): ${r_st} == IN_PROGRESS"

      - name: allocation_requires_lot_released
        grounds:
          - state_machines.BlendBatch
          - state_machines.LeafLot
          - errors[ERR_LOT_NOT_RELEASED]
          - concurrency_rules[allocation-create-stale-batch]
        distinguishing_aspect: |
          Entity pair BlendBatch -> LeafLot (different pair from instance 1):
          allocating from a lot that is LAB_SUBMITTED (tested PASS but never
          QA-released) is rejected with ERR_LOT_NOT_RELEASED even though the
          lot passed its lab gate.
        test_recipe:
          setup:
            - "Supplier ACTIVE; lot BLACK 20.0 kg graded A, residue PASS, status LAB_SUBMITTED (never released); CONVENTIONAL TEA_BAG recipe ACTIVE; batch target 10.0 RECIPE_LOCKED"
          setup_api_calls:
