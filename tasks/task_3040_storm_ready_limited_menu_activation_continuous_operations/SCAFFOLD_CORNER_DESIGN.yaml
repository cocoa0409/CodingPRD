              as: CommandCenterAdmin
            - call: "POST /ops/storm-events"
              payload: { name: "Hurricane Delta" }
              as: CommandCenterAdmin
              captures: { se: $.data.id, se_v: $.data.version }
            - call: "POST /ops/storm-events/${se}/units"
              payload: { unit_code: "U-1", address: "1 Storm Way" }
              as: CommandCenterAdmin
              captures: { u: $.data.id }
            - call: "POST /ops/storm-events/${se}/activate"
              payload: { expected_storm_event_version: "${se_v}" }
              as: CommandCenterAdmin
            - call: "POST /ops/units/${u}/condition-reports"
              payload: { power: "DOWN", water: "UP", gas: "UP", payment_network: "UP" }
              as: UnitManager
            - call: "POST /ops/crew-members"
              payload: { full_name: "Jo Vega", role: "SERVER", home_unit_id: "${u}", is_jump_team: false }
              as: FieldCoordinator
              captures: { m: $.data.id }
            - call: "POST /ops/assignments"
              payload: { crew_member_id: "${m}", unit_id: "${u}", assigned_from: "2026-09-10T07:00:00Z", assigned_until: "2026-09-12T00:00:00Z", travel_origin: "Atlanta" }
              as: FieldCoordinator
              captures: { a: $.data.id }
          trigger:
            - call: "POST /ops/assignments/${a}/start"
              payload: {}
              as: FieldCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with error_id == ERR_NOT_JUMP_TEAM (409)"
            - "CrewAssignment.${a}.status == SCHEDULED (unchanged)"

