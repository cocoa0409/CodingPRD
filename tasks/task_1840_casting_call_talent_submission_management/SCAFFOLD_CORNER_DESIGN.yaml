  # ==========================================================================
  # Section: cross-cutting complexity layers
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_breakdown_version_rejected_on_submit
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[submission-create-stale-breakdown]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC: creating a submission with a stale expected_breakdown_version (observed before another write bumped the breakdown) is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["Released OPEN breakdown; client captured version 1, then a widen bumped version to 2"]
          setup_api_calls:
            - { call: "POST /casting/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CastingDirector }
            - call: "POST /casting/productions"
              payload: { title: "OCC1", production_type: "FILM", union_signatory: false, shoot_city: "LA", shoot_state: "CA", start_date: "2026-08-01T00:00:00Z", wrap_date: "2026-09-30T00:00:00Z", casting_office_id: "office-1" }
              as: CastingDirector
              captures: { pid: $.data.id }
            - call: "POST /casting/productions/${pid}/roles"
              payload: { character_name: "R", is_minor_role: false, is_union_covered: false, engagement_start: "2026-08-10T00:00:00Z", engagement_end: "2026-08-12T00:00:00Z" }
              as: CastingDirector
              captures: { rid: $.data.id }
            - call: "POST /casting/productions/${pid}/breakdowns"
              payload: { role_id: "${rid}", distribution: "AGENT_ONLY", submission_deadline: "2026-09-01T00:00:00Z", rate_weekly_cents: 1000000 }
              as: CastingDirector
              captures: { bid: $.data.id }
            - call: "POST /casting/breakdowns/${bid}/release"
              payload: { distribution: "AGENT_ONLY" }
              as: CastingDirector
              captures: { brv_stale: $.data.version }
            # widen bumps version (client's captured version now stale)
            - call: "POST /casting/breakdowns/${bid}/widen"
              payload: {}
              as: CastingDirector
            - call: "POST /casting/talents"
              payload: { full_name: "T", date_of_birth: "1990-01-01T00:00:00Z", union_status: "NON_UNION" }
              as: CastingDirector
              captures: { tid: $.data.id }
          trigger:
            - call: "POST /casting/breakdowns/${bid}/submissions"
              payload: { talent_id: "${tid}", expected_breakdown_version: "${brv_stale}" }
              as: CastingAssociate
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (captured version predates the widen bump)"
            - "http_status == 412"

