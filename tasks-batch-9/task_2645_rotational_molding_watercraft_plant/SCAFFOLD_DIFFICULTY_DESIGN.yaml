              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_b: $.data.id }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v1: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc_a}", resin_lot_id: "${lot}", charge_kg: 12.000, regrind_kg: 1.200, expected_resin_lot_version: "${lot_v1}" }
