              as: CouncilAdmin
              captures: { complete_err: $.data.error_id }
          assert:
            - "complete_err == ERR_TRANSFER_INVALID_STATE (state priority 4 beats recall priority 5 and OCC priority 13 even though all three would independently fail)"
            - "InventoryTransfer.${tr1}.status == REQUESTED (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check on DIFFERENT metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: attainment_gate_exactly_80_vs_just_below
        grounds:
          - calculations.forecast_attainment_pct
          - state_machines.CookieSeason.OPEN_to_SELLING
        distinguishing_aspect: |
          Metric = forecast_attainment_pct (numeric threshold, >= 80.00).
          Endpoint = order confirm (gate evaluated as cascade). Two runs:
          80/100 -> exactly 80.00 -> SELLING; 79/100 -> 79.00 -> stays OPEN.
          Boundary is INCLUSIVE (>=).
        test_recipe:
          setup:
            - "Season OPEN; purchased 100; SUBMITTED order of exactly 80 units (second scenario variant asserts 79 stays OPEN — the pinned case here is the inclusive boundary hit)"
