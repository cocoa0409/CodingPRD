            - "The self-verification returns HTTP 409 with error.id == \"ERR_SELF_VERIFICATION_FORBIDDEN\"; the u_nurse_2 retry returns HTTP 200 with status == \"LABEL_VERIFIED\" and verified_by_user_id == \"u_nurse_2\""
            - "The self-decision returns HTTP 409 with error.id == \"ERR_SELF_DECISION_FORBIDDEN\"; the u_liaison_2 retry returns HTTP 200 with status == \"AUTHORIZED\", authorized_device_count == 1 and payer_reference == \"PA-77301\""
            - "The self-interpretation returns HTTP 409 with error.id == \"ERR_SELF_INTERPRETATION_FORBIDDEN\"; the u_aud_2 retry returns HTTP 200 with status == \"INTERPRETED\" and recommendation == \"HEARING_AID\""
            - "${dispenser} == \"u_aud_1\", ${bill} == \"REFUND_PENDING\", ${restock} == 31500 (max(12500, round_half_up(210000 * 1500 / 10000))) and ${refund} == 178150 (210000 - 31500 - 350 for one day of wear at 350 cents)"
            - "The settlement sent with X-User-ID u_aud_1 and X-User-Role PracticeAdmin returns HTTP 409 with error.id == \"ERR_SELF_SETTLEMENT_FORBIDDEN\" — the role gate at priority 2 passes on the header role, so the identity rule at priority 9 is what rejects it"
            - "The u_admin_1 settlement returns HTTP 200 with billing_status == \"SETTLED\" and fit_status still \"RETURNED\""
            - "The u_tech_2 completion returns HTTP 409 with error.id == \"ERR_REPROCESSING_TECH_MISMATCH\" and EndoscopeAsset.${scope_id}.status is still \"REPROCESSING\" with cycle_count 0"
            - "The u_tech_1 completion returns HTTP 200 with status == \"READY\", cycle_count == 1, consecutive_mec_failures == 0, reprocessing_started_by_user_id == null, last_reprocessed_at == \"2026-08-01T00:00:00Z\" and hld_expires_at == \"2026-08-08T00:00:00Z\" (168 hours later)"
            - "This rule reverses the other four: the same actor is required, so u_tech_1 succeeds where a second tech fails"

  # ===========================================================================
  # SECTION 8 — CROSS-CUTTING COMPLEXITY LAYERS
  # complexity_profile.complexity_layers declares optimistic_concurrency,
  # cascading_side_effects, dual_variant_calculation and
  # version_pinning_on_approval. The guide has a row for the first three; the
  # fourth has no row of its own and is asserted through the case's
  # pinned_policy_version in §1.8's booking chains and in the consistency
  # instance below. Rows for layers this scaffold does not declare
  # (soft_delete, multi_tenancy, bulk_operations, ...) are skipped.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: vial_create_rejects_stale_patient_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[vial-create-stale-patient]
          - errors.ERR_STALE_PATIENT_VERSION
          - state_machines.ImmunotherapyVial.LABEL_VERIFIED_to_DISCARDED
          - endpoints[POST /immunotherapy-vials]
        distinguishing_aspect: "The declared OCC field expected_patient_version is checked against the Patient row's live version: the version observed before an unrelated PATCH is refused with 412, the version observed after it is accepted, and a re-read version is required again for the next vial because the supersede side effect bumps the patient row itself."
        test_recipe:
          setup:
            - "PayerPolicy with defaults; one adult Patient created at version 1; one ALLERGEN_CONCENTRATE lot."
            - "A PATCH of prior_systemic_reaction_count moves the patient to version 2, which makes the originally observed version stale."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "OCC Health", plan_code: "XCUA-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10251", full_name: "Emil Draganov", date_of_birth: "1971-06-06", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id, v1: $.data.version }
            - call: "POST /supply-lots"
              payload: { item_type: "ALLERGEN_CONCENTRATE", lot_number: "LOT-1033", quantity_received: 6, expires_at: "2027-06-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "PATCH /patients/${pat_id}"
              payload: { prior_systemic_reaction_count: 1 }
              as: PracticeAdmin
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "MRN-10251|BLUE_1_100|2026-12-01", expires_at: "2026-12-01T00:00:00Z", expected_patient_version: "${v1}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "MRN-10251|BLUE_1_100|2026-12-01", expires_at: "2026-12-01T00:00:00Z", expected_patient_version: "${v2}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { vial_1: $.data.id }
            - call: "POST /immunotherapy-vials/${vial_1}/label-verification"
              payload: { label_text_confirmation: "MRN-10251|BLUE_1_100|2026-12-01" }
              as: AllergyNurse
              as_user_id: "u_nurse_2"
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { v3: $.data.version }
            - call: "POST /immunotherapy-vials"
              payload: { patient_id: "${pat_id}", supply_lot_id: "${lot_id}", dilution_code: "BLUE_1_100", label_text: "MRN-10251|BLUE_1_100|2026-12-15", expires_at: "2026-12-15T00:00:00Z", expected_patient_version: "${v3}" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { vial_2: $.data.id }
            - call: "GET /patients/${pat_id}"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { v4: $.data.version }
          assert:
            - "${v1} == 1 and ${v2} == 2 — the PATCH is the write that made the first observation stale"
            - "The first vial create returns HTTP 412 with error.id == \"ERR_STALE_PATIENT_VERSION\" and no ImmunotherapyVial row exists: GET /immunotherapy-vials?patient_id=${pat_id} returns total_count == 0"
            - "The second vial create returns HTTP 201 with status \"MIXED\", volume_ml_initial 5.00 and mixed_by_user_id \"u_nurse_1\""
            - "The label-verification returns HTTP 200 with status \"LABEL_VERIFIED\" and Patient.${pat_id}.immunotherapy_status == \"BUILD_UP\""
            - "The third vial create returns HTTP 201 because it carries the re-read ${v3} rather than a remembered literal"
            - "ImmunotherapyVial.${vial_1}.status == \"DISCARDED\" with discard_reason == \"SUPERSEDED\", volume_ml_wasted == 5.00 and volume_ml_remaining == 0.00 — the identity 5.00 == 0.00 + 0.00 + 5.00 holds"
            - "ImmunotherapyVial.${vial_2}.status == \"MIXED\" and GET /immunotherapy-vials?patient_id=${pat_id} returns total_count == 2"
            - "${v4} is strictly greater than ${v3} — the supersede side effect is declared to increment the patient's version, which is exactly why the next compounder must re-read it"

      - name: dispense_create_rejects_stale_study_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispense-create-stale-study]
          - errors.ERR_STALE_STUDY_VERSION
          - entities.DiagnosticStudy.fields.superseded_dispense_count
          - endpoints[POST /device-dispenses]
        distinguishing_aspect: "A second dispense on the same INTERPRETED study is legitimate, so state alone cannot gate it: the version observed at results is stale once the interpretation lands, and the version observed at interpretation is stale once the first dispense lands, so only a re-read version lets the second unit supersede the first and take superseded_dispense_count to 1."
        test_recipe:
          setup:
            - "PayerPolicy with defaults; one adult Patient; one AUDIOMETRY study with pta_db_hl 61.0 recorded by u_aud_1 and interpreted by u_aud_2, so the recommendation is HEARING_AID; one HEARING_AID lot with 3 units."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Study OCC Health", plan_code: "XCUB-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10252", full_name: "Petra Ivanauskas", date_of_birth: "1954-07-07", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "${pat_id}", study_type: "AUDIOMETRY" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { study_id: $.data.id }
            - call: "POST /diagnostic-studies/${study_id}/results"
              payload: { pta_db_hl: 61.0, word_recognition_pct: 54.0 }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { v_perf: $.data.version }
            - call: "POST /diagnostic-studies/${study_id}/interpretation"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_2"
              captures: { v_int: $.data.version }
            - call: "POST /supply-lots"
              payload: { item_type: "HEARING_AID", lot_number: "LOT-1034", quantity_received: 3, expires_at: "2028-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA400008", ear: "LEFT", price_cents: 195000, expected_study_version: "${v_perf}" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA400008", ear: "LEFT", price_cents: 195000, expected_study_version: "${v_int}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { disp_1: $.data.id }
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA400009", ear: "RIGHT", price_cents: 195000, expected_study_version: "${v_int}" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "GET /diagnostic-studies/${study_id}"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { v_fresh: $.data.version }
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA400009", ear: "RIGHT", price_cents: 195000, expected_study_version: "${v_fresh}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { disp_2: $.data.id }
          assert:
            - "${v_perf} == 2 and ${v_int} == 3 — recording results and recording the interpretation are two writes on the study row"
            - "The first dispense returns HTTP 412 with error.id == \"ERR_STALE_STUDY_VERSION\", not 409 — the study is INTERPRETED, so the only defect is the observed version"
            - "The second dispense returns HTTP 201 with fit_status \"FITTED\", billing_status \"INVOICED\" and DiagnosticStudy.${study_id}.superseded_dispense_count == 0"
            - "The third dispense reuses the now-stale ${v_int} and returns HTTP 412 with error.id == \"ERR_STALE_STUDY_VERSION\" — creating the first dispense advanced the study row, which is what stops an audiologist from superseding a unit they never saw"
            - "${v_fresh} is strictly greater than ${v_int}"
            - "The fourth dispense returns HTTP 201 and DiagnosticStudy.${study_id}.superseded_dispense_count == 1"
            - "Both dispenses exist: GET /device-dispenses?diagnostic_study_id=${study_id} returns total_count == 2 with ids ${disp_1} and ${disp_2}"
            - "SupplyLot.${lot_id} still satisfies 3 == quantity_on_hand + quantity_consumed + quantity_wasted, and the two 412s consumed nothing"

      - name: reaction_event_drives_a_four_level_side_effect_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ImmunotherapyDose.ADMINISTERED_to_REACTION_HELD
          - calculations.patient_anaphylaxis_risk_score
          - calculations.observation_minutes_required
        excluded_because:
          difficulty_instance: transitive_cascade / reaction_event_four_hop_cascade
          rationale: "The named §1.8 instance verifies the chain end-to-end and in order — dose hold, escalation rollback and POST_REACTION rescore, supervision flip with the ORDERED order's observation window resized, then the vial and booking flags — which is exactly this layer's claim."

      - name: refund_variants_diverge_on_the_same_returned_device
        claim_type: dual_variant_calculation
        grounds:
          - calculations.device_trial_refund
          - entities.DeviceDispense.fields.refund_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / refund_variant_divergence_on_device_dispense
          rationale: "The named §1.8 instance runs both refund variants over the same dispense and asserts the delta on the switch, which is this layer's whole claim."

  # ===========================================================================
  # SECTION 9 — CONSISTENCY MODEL
  # complexity_profile.consistency_model is `immediate`.
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: booking_cancel_is_immediately_visible_in_every_derived_read
        claim_type: immediate
        grounds:
          - state_machines.ProcedureBooking.SCHEDULED_to_CANCELLED
          - state_machines.SinuplastyCase.SCHEDULED_to_AUTHORIZED
          - calculations.surgery_block_utilization
          - calculations.supply_lot_availability
          - entities.SinuplastyCase.fields.pinned_policy_version
        distinguishing_aspect: "One cancel touches four rows and every consequence is readable at once: the cancel response itself already reports CANCELLED, and the immediately following reads show the block's booked_minutes and utilization_bps back at 0 with status OPEN, the lot's reservation released, and the case back to AUTHORIZED with its original auth_expires_at and pinned_policy_version intact — nothing lags behind a second read."
        test_recipe:
          setup:
            - "PayerPolicy CONA-2999 with requires_prior_auth true, max_balloon_devices 2, min_documented_criteria 2, min_medical_management_days 28, requires_ct_within_months 12, auth_validity_days 90."
            - "One adult Patient; one LEFT / MAXILLARY case (planned_device_count 1) documented ELIGIBLE, submitted by u_liaison_1 and approved by u_liaison_2 at the default clock, so authorized_device_count is 1 and auth_expires_at is 2026-10-30T00:00:00Z."
            - "One READY endoscope, one BALLOON_DEVICE lot with 4 units, and one four-hour surgery-center block with max_concurrent_cases 2 and therefore capacity_minutes 480."
            - "One SCHEDULED 60-minute BALLOON_SINUPLASTY booking inside that block."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Immediate Health", plan_code: "CONA-2999", requires_prior_auth: true, max_balloon_devices: 2, min_documented_criteria: 2, min_medical_management_days: 28, requires_ct_within_months: 12, auth_validity_days: 90 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id, pol_v: $.data.version }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10253", full_name: "Odile Ferreira", date_of_birth: "1962-09-09", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_id}", laterality: "LEFT", sinuses: ["MAXILLARY"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { case_id: $.data.id }
            - call: "POST /sinuplasty-cases/${case_id}/documentation"
              payload: { ct_study_date: "2026-05-01", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-14" }, { therapy_code: "INCS", start_date: "2026-06-15", end_date: "2026-06-28" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_INCS"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /sinuplasty-cases/${case_id}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
              captures: { pinned: $.data.pinned_policy_version }
            - call: "POST /sinuplasty-cases/${case_id}/payer-decisions"
              payload: { decision: "APPROVED", payer_reference: "PA-77401" }
              as: PayerLiaison
              as_user_id: "u_liaison_2"
              captures: { expires: $.data.auth_expires_at }
            - call: "POST /endoscopes"
              payload: { serial_number: "SC-0013", model: "ENT-Flex 9" }
              as: PracticeAdmin
              captures: { scope_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_type: "BALLOON_DEVICE", lot_number: "LOT-1035", quantity_received: 4, expires_at: "2028-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /surgery-center-blocks"
              payload: { center_name: "Day Surgery West", block_start_at: "2026-08-05T08:00:00Z", block_end_at: "2026-08-05T12:00:00Z", max_concurrent_cases: 2 }
              as: PracticeAdmin
              captures: { block_id: $.data.id, cap: $.data.capacity_minutes }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "BALLOON_SINUPLASTY", venue: "SURGERY_CENTER", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z", physician_user_id: "u_ent_1", sinuplasty_case_id: "${case_id}", endoscope_asset_id: "${scope_id}", supply_lot_id: "${lot_id}", surgery_center_block_id: "${block_id}", planned_device_count: 1 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { book_id: $.data.id }
          trigger:
            - call: "POST /procedure-bookings/${book_id}/cancel"
              payload: { cancel_reason: "PATIENT_REQUEST" }
              as: PracticeAdmin
              captures: { cancelled_status: $.data.status }
            - call: "GET /surgery-center-blocks/${block_id}"
              payload: {}
              as: PracticeAdmin
            - call: "GET /supply-lots/${lot_id}"
              payload: {}
              as: PracticeAdmin
            - call: "GET /sinuplasty-cases/${case_id}"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
            - call: "GET /endoscopes/${scope_id}"
              payload: {}
              as: SterileProcessingTech
              as_user_id: "u_tech_1"
          assert:
            - "${pinned} == 1, ${expires} == \"2026-10-30T00:00:00Z\" and ${cap} == 480"
            - "Before the cancel the derived reads are already populated: SurgeryCenterBlock.${block_id}.booked_case_count == 1, booked_minutes == 60, utilization_bps == 1250; SupplyLot.${lot_id}.quantity_reserved == 1 and available_quantity == 3; SinuplastyCase.${case_id}.status == \"SCHEDULED\""
            - "${cancelled_status} == \"CANCELLED\" in the cancel response itself — the write's own response already carries the new state, which is the definition of the immediate model"
            - "The block read returns booked_case_count == 0, booked_minutes == 0, utilization_bps == 0 and status == \"OPEN\" on the very first read after the cancel"
            - "The lot read returns quantity_reserved == 0, quantity_on_hand == 4, quantity_consumed == 0, available_quantity == 4 and status == \"ACTIVE\"; the identity 4 == 4 + 0 + 0 holds"
            - "The case read returns status == \"AUTHORIZED\" with authorized_device_count == 1, auth_expires_at == \"2026-10-30T00:00:00Z\" and pinned_policy_version == 1 — the compensation restores the schedulable state without re-opening the payer loop"
            - "The scope read returns status == \"READY\" — the booking never started, so no reprocessing state was entered"
            - "ProcedureBooking.${book_id}.status == \"CANCELLED\" and cancel_reason == \"PATIENT_REQUEST\"; a second identical read returns the same values, so no figure settles late"
