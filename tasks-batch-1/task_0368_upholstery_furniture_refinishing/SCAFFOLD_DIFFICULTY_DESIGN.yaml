scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: workorder_estimate_vs_final_invoice_diverge
        grounds:
          - calculations.estimate_total
          - calculations.final_invoice
          - state_machines.WorkOrder.ESTIMATING_to_AWAITING_APPROVAL
          - state_machines.WorkOrder.IN_PRODUCTION_to_READY_FOR_FULFILLMENT
          - entities.WorkOrder.fields.estimate_total_cents
          - entities.WorkOrder.fields.final_invoice_cents
        distinguishing_aspect: |
          On the WorkOrder entity, the forward-looking estimate_total (catalog prices, 40300) and the
          chronological final_invoice (RECEIVED actual prices, 42000) produce DIFFERENT totals for the
          same order; the divergence is 1700 cents driven purely by received-price overrides.
        test_recipe:
          setup:
            - "FabricSku catalog price 1800 c/yd, FoamSpec catalog price 350 c/bf."
            - "REUPHOLSTERY WorkOrder, one LineItem: 6 yd fabric, 10 bf foam, 4 labor-hours -> estimate_total 40300."
            - "Order APPROVED with deposit 12090; two MaterialOrders received at HIGHER prices (fabric 2000, foam 400)."
            - "A ShopDay (cap 8h) booked, production leg completed, order at IN_PRODUCTION."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Dana D", email: "dana@x.com", phone: "555-0100" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /fabric-skus"
              payload: { sku_code: "LIN-SLATE", name: "Belgian Linen Slate", price_cents_per_yard: 1800, roll_width_inches: 54, in_stock_yards: 100 }
              as: ShopManager
              captures: { fab_id: $.data.id }
            - call: "POST /foam-specs"
              payload: { grade_code: "HD-FOAM", density_lb: 2.0, price_cents_per_board_foot: 350 }
              as: ShopManager
              captures: { foam_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://p/1.jpg", damage_note: "worn seat" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Sofa 3-cushion", fabric_sku_id: "${fab_id}", foam_spec_id: "${foam_id}", yardage_required: 6, board_feet_required: 10, labor_hours: 4 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${wo_v_est}" }
              as: Estimator
              captures: { est_id: $.data.id }
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_v_appr: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v_appr}", deposit_amount_cents: 12090 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /material-orders"
              payload: { work_order_id: "${wo_id}", fabric_sku_id: "${fab_id}", yards_ordered: 6 }
              as: ShopManager
              captures: { mo_fab_id: $.data.id }
            - call: "POST /material-orders"
              payload: { work_order_id: "${wo_id}", foam_spec_id: "${foam_id}", board_feet_ordered: 10 }
              as: ShopManager
              captures: { mo_foam_id: $.data.id }
            - call: "POST /material-orders/${mo_fab_id}/receive"
              payload: { received_fabric_price_cents_per_yard: 2000 }
              as: ShopManager
            - call: "POST /material-orders/${mo_foam_id}/receive"
              payload: { received_foam_price_cents_per_board_foot: 400 }
              as: ShopManager
            - call: "POST /shop-days"
              payload: { work_date: "2026-04-01", labor_capacity_hours: 8 }
              as: ShopManager
              captures: { day_id: $.data.id }
            - call: "POST /fulfillment-legs"
              payload: { work_order_id: "${wo_id}", kind: "PRODUCTION", shop_day_id: "${day_id}" }
              as: ShopManager
              captures: { prod_leg_id: $.data.id }
            - call: "POST /fulfillment-legs/${prod_leg_id}/dispatch"
              as: ShopManager
            - call: "POST /fulfillment-legs/${prod_leg_id}/complete"
              as: ShopManager
          trigger:
            - call: "POST /work-orders/${wo_id}/finish-production"
              as: ShopManager
              captures: { final_inv: $.data.final_invoice_cents, est_after: $.data.estimate_total_cents }
          assert:
            - "WorkOrder.${wo_id}.estimate_total_cents == 40300"
            - "WorkOrder.${wo_id}.final_invoice_cents == 42000"
            - "WorkOrder.${wo_id}.final_invoice_cents - WorkOrder.${wo_id}.estimate_total_cents == 1700"

      - name: materialorder_provisional_vs_finalized_cost_diverge
        grounds:
          - calculations.material_finalized_cost
          - state_machines.MaterialOrder.ORDERED_to_RECEIVED
          - entities.MaterialOrder.fields.provisional_cost_cents
          - entities.MaterialOrder.fields.finalized_cost_cents
        distinguishing_aspect: |
          On the MaterialOrder entity (a different domain from WorkOrder), provisional_cost (catalog
          1800x6=10800) and finalized_cost (received 2000x6=12000) differ by 1200 cents; both variants
          are pinned on the same order row.
        test_recipe:
          setup:
            - "An APPROVED REUPHOLSTERY WorkOrder exists with fabric catalog price 1800 c/yd."
            - "A fabric MaterialOrder of 6 yards is placed (provisional 10800), then received at 2000 c/yd (finalized 12000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Eli E", email: "eli@x.com", phone: "555-0101" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /fabric-skus"
              payload: { sku_code: "VEL-RUST", name: "Velvet Rust", price_cents_per_yard: 1800, roll_width_inches: 54, in_stock_yards: 100 }
              as: ShopManager
              captures: { fab_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://p/2.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Armchair", fabric_sku_id: "${fab_id}", yardage_required: 6, labor_hours: 4 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${wo_v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_v_appr: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v_appr}", deposit_amount_cents: 10000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /material-orders"
              payload: { work_order_id: "${wo_id}", fabric_sku_id: "${fab_id}", yards_ordered: 6 }
              as: ShopManager
              captures: { mo_id: $.data.id, prov: $.data.provisional_cost_cents }
          trigger:
            - call: "POST /material-orders/${mo_id}/receive"
              payload: { received_fabric_price_cents_per_yard: 2000 }
              as: ShopManager
              captures: { fin: $.data.finalized_cost_cents }
          assert:
            - "MaterialOrder.${mo_id}.provisional_cost_cents == 10800"
            - "MaterialOrder.${mo_id}.finalized_cost_cents == 12000"
            - "MaterialOrder.${mo_id}.finalized_cost_cents - MaterialOrder.${mo_id}.provisional_cost_cents == 1200"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rush_surcharge_tiered_nonlinear_mode_a
        grounds:
          - calculations.estimate_total
          - entities.Estimate.fields.rush_surcharge_cents
          - entities.WorkOrder.fields.rush_requested
        distinguishing_aspect: |
          MODE (a): the rush surcharge is a non-linear tiered-rate formula with >=3 inputs
          (labor_total, RUSH_TIER1, two rates) -- labor 65000 over the 50000 tier yields
          round(50000*0.15)+round(15000*0.30)=7500+4500=12000, not a flat percentage.
        test_recipe:
          setup:
            - "REUPHOLSTERY rush WorkOrder; one LineItem 10 labor-hours (labor_total 65000 > tier 50000), 4 yd fabric @ 2000 (8000)."
            - "estimate_total = 65000 + 8000 + 12000 rush = 85000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fay F", email: "fay@x.com", phone: "555-0102" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /fabric-skus"
              payload: { sku_code: "WOOL-NAVY", name: "Wool Navy", price_cents_per_yard: 2000, roll_width_inches: 54, in_stock_yards: 50 }
              as: ShopManager
              captures: { fab_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY", rush_requested: true }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://p/3.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Sectional", fabric_sku_id: "${fab_id}", yardage_required: 4, labor_hours: 10 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v_est: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${wo_v_est}" }
              as: Estimator
              captures: { est_id: $.data.id, rush: $.data.rush_surcharge_cents, tot: $.data.total_cents }
          assert:
            - "Estimate.${est_id}.rush_surcharge_cents == 12000"
            - "Estimate.${est_id}.labor_total_cents == 65000"
            - "Estimate.${est_id}.materials_total_cents == 8000"
            - "Estimate.${est_id}.total_cents == 85000"

      - name: per_piece_subtotal_round_per_term_then_sum_mode_b
        grounds:
          - calculations.per_piece_subtotal
          - entities.LineItem.fields.piece_subtotal_cents
        distinguishing_aspect: |
          MODE (b): nested-rounding order is pinned to round-EACH-term-then-sum. With fractional
          yardage 6.5 @ 1799 (=11693.5->11694) and labor 3.5h @ 6500 (=22750) and foam 7.5 bf @ 333
          (=2497.5->2498), round-per-term-then-sum = 11694+22750+2498 = 36942; sum-then-round would
          differ at the half-cent boundary, so the order matters.
        test_recipe:
          setup:
            - "FabricSku 1799 c/yd, FoamSpec 333 c/bf; REUPHOLSTERY LineItem yardage 6.5, board_feet 7.5, labor 3.5."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Gus G", email: "gus@x.com", phone: "555-0103" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /fabric-skus"
              payload: { sku_code: "TWD-MOSS", name: "Tweed Moss", price_cents_per_yard: 1799, roll_width_inches: 54, in_stock_yards: 100 }
              as: ShopManager
              captures: { fab_id: $.data.id }
            - call: "POST /foam-specs"
              payload: { grade_code: "MD-FOAM", density_lb: 1.8, price_cents_per_board_foot: 333 }
              as: ShopManager
              captures: { foam_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://p/4.jpg" }
              as: IntakeClerk
          trigger:
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Loveseat", fabric_sku_id: "${fab_id}", foam_spec_id: "${foam_id}", yardage_required: 6.5, board_feet_required: 7.5, labor_hours: 3.5 }
              as: IntakeClerk
              captures: { li_id: $.data.id, sub: $.data.piece_subtotal_cents }
          assert:
            - "LineItem.${li_id}.piece_subtotal_cents == 36942"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: workorder_cyclic_revision_loop
        grounds:
          - state_machines.WorkOrder.AWAITING_APPROVAL_to_REVISION_REQUESTED
          - state_machines.WorkOrder.REVISION_REQUESTED_to_AWAITING_APPROVAL
          - entities.Estimate.fields.version_no
          - entities.Estimate.fields.status
        distinguishing_aspect: |
          WorkOrder exhibits a CYCLE: AWAITING_APPROVAL -> REVISION_REQUESTED -> AWAITING_APPROVAL,
          producing a second Estimate version_no=2 while version_no=1 becomes SUPERSEDED; the loop
          re-enters AWAITING_APPROVAL, which a linear pipeline cannot.
        test_recipe:
          setup:
            - "REUPHOLSTERY order with one LineItem; v1 estimate authored, order AWAITING_APPROVAL."
            - "Customer requests revision -> REVISION_REQUESTED; Estimator authors v2 superseding v1 -> AWAITING_APPROVAL."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Hana H", email: "hana@x.com", phone: "555-0104" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /fabric-skus"
              payload: { sku_code: "COT-CLAY", name: "Cotton Clay", price_cents_per_yard: 1500, roll_width_inches: 54, in_stock_yards: 100 }
              as: ShopManager
              captures: { fab_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://p/5.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Ottoman", fabric_sku_id: "${fab_id}", yardage_required: 2, labor_hours: 2 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: Estimator
              captures: { est_v1_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/request-revision"
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v2: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${wo_v2}", supersedes_estimate_id: "${est_v1_id}" }
              as: Estimator
              captures: { est_v2_id: $.data.id }
          assert:
            - "Estimate.${est_v2_id}.version_no == 2"
            - "Estimate.${est_v2_id}.status == ACTIVE"
            - "Estimate.${est_v1_id}.status == SUPERSEDED"
            - "WorkOrder.${wo_id}.status == AWAITING_APPROVAL"
            - "WorkOrder.${wo_id}.active_estimate_id == ${est_v2_id}"

      - name: warrantyclaim_branching_approve_vs_deny
        grounds:
          - state_machines.WarrantyClaim.OPEN_to_APPROVED
          - state_machines.WarrantyClaim.OPEN_to_DENIED
          - entities.WarrantyClaim.fields.covered
        distinguishing_aspect: |
          WarrantyClaim branches from OPEN into two divergent terminals -- APPROVED (requires covered==true)
          vs DENIED -- on a DIFFERENT entity from WorkOrder; an out-of-window covered==false claim can ONLY
          take the DENIED branch, exercising fork divergence.
        test_recipe:
          setup:
            - "A COMPLETED WorkOrder with completed_at 2026-03-01T00:00:00Z (set via clock)."
            - "An out-of-window claim filed 2026-05-31 (91 days, covered==false)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ivy I", email: "ivy@x.com", phone: "555-0105" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REPAIR", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://p/6.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Chair frame", yardage_required: 0, labor_hours: 2 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${wo_v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_v_appr: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v_appr}", deposit_amount_cents: 4000 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /shop-days"
              payload: { work_date: "2026-02-20", labor_capacity_hours: 8 }
              as: ShopManager
              captures: { day_id: $.data.id }
            - call: "POST /fulfillment-legs"
              payload: { work_order_id: "${wo_id}", kind: "PRODUCTION", shop_day_id: "${day_id}" }
              as: ShopManager
              captures: { prod_leg_id: $.data.id }
            - call: "POST /fulfillment-legs/${prod_leg_id}/dispatch"
              as: ShopManager
            - call: "POST /fulfillment-legs/${prod_leg_id}/complete"
              as: ShopManager
            - call: "POST /work-orders/${wo_id}/finish-production"
              as: ShopManager
            - call: "POST /fulfillment-legs"
              payload: { work_order_id: "${wo_id}", kind: "PICKUP", scheduled_window_start: "2026-02-28T09:00:00Z", scheduled_window_end: "2026-02-28T11:00:00Z" }
              as: ShopManager
              captures: { pick_leg_id: $.data.id }
            - call: "POST /fulfillment-legs/${pick_leg_id}/dispatch"
              as: ShopManager
            - call: "POST /fulfillment-legs/${pick_leg_id}/complete"
              as: ShopManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ShopManager
            - call: "GET /work-orders/${wo_id}"
              as: ShopManager
              captures: { bal: $.data.balance_due_cents }
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { settlement_amount_cents: "${bal}" }
              as: ShopManager
            - call: "POST /work-orders/${wo_id}/warranty-claims"
              payload: { defect_note: "seam split", filed_at: "2026-05-31T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id, cov: $.data.covered }
          trigger:
            - call: "POST /warranty-claims/${claim_id}/deny"
              as: ShopManager
              captures: { st: $.data.status }
          assert:
            - "WarrantyClaim.${claim_id}.covered == false"
            - "WarrantyClaim.${claim_id}.status == DENIED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_cascade_materialorder_then_fabric_stock_depth3
        grounds:
          - state_machines.WorkOrder.APPROVED_to_CANCELLED
          - state_machines.MaterialOrder.ORDERED_to_CANCELLED
          - entities.FabricSku.fields.in_stock_yards
          - entities.WorkOrder.fields.materials_committed_cents
        distinguishing_aspect: |
          DEPTH-3 chain from the CANCEL trigger: cancel WorkOrder -> that mutates each ORDERED
          MaterialOrder to CANCELLED -> CANCELLED material-order's own side-effect returns 6 reserved
          yards to FabricSku.in_stock_yards (94->100). Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "FabricSku starts at 100 in_stock_yards. APPROVED order has one ORDERED fabric MaterialOrder of 6 yards (stock now 94, committed 10800)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Jon J", email: "jon@x.com", phone: "555-0106" }
              as: IntakeClerk
              captures: { cust_id: $.data.id }
            - call: "POST /fabric-skus"
              payload: { sku_code: "DEN-INK", name: "Denim Ink", price_cents_per_yard: 1800, roll_width_inches: 54, in_stock_yards: 100 }
              as: ShopManager
              captures: { fab_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", service_type: "REUPHOLSTERY", rush_requested: false }
              as: IntakeClerk
              captures: { wo_id: $.data.id }
            - call: "POST /condition-photos"
              payload: { work_order_id: "${wo_id}", image_uri: "s3://p/7.jpg" }
              as: IntakeClerk
            - call: "POST /work-orders/${wo_id}/line-items"
              payload: { piece_label: "Bench", fabric_sku_id: "${fab_id}", yardage_required: 6, labor_hours: 4 }
              as: IntakeClerk
            - call: "GET /work-orders/${wo_id}"
              as: Estimator
              captures: { wo_v_est: $.data.version }
            - call: "POST /work-orders/${wo_id}/estimates"
              payload: { expected_work_order_version: "${wo_v_est}" }
              as: Estimator
            - call: "GET /work-orders/${wo_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_v_appr: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v_appr}", deposit_amount_cents: 12090 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /material-orders"
              payload: { work_order_id: "${wo_id}", fabric_sku_id: "${fab_id}", yards_ordered: 6 }
              as: ShopManager
              captures: { mo_id: $.data.id }
            - call: "GET /work-orders/${wo_id}"
              as: ShopManager
              captures: { wo_v_cancel: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: { expected_work_order_version: "${wo_v_cancel}", refund_destination: "ORIGINAL" }
              as: ShopManager
          assert:
            - "MaterialOrder.${mo_id}.status == CANCELLED"
