# =============================================================================
# 401(k) Retirement Plan Management — Benchmark Scaffold (v1)
# =============================================================================

scenario: |
  401(k) Retirement Plan Management: participant enrollment, contribution rate,
  employer match (Safe Harbor/tiered), vesting schedule (Cliff/Graded), plan loan,
  Hardship withdrawal, age-based RMD

domain_name: retirement-401k
api_prefix: /plans

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_deferred_actions
    - cascading_side_effects

  entity_topology: hybrid
  state_machine_shape: branching          # Loan (current → default → satisfied; current → satisfied), HardshipWithdrawal (requested → {approved,denied}), Participant active/suspended/terminated
  relationship_patterns:
    - one_to_many                         # Plan has many Participants; Participant has many ContributionRecords, Loans, etc.
    - cross_aggregate                     # VestingSnapshot crosses Plan + Participant; LoanRepayment debits ContributionRecord pool

  role_model: segregation_of_duties       # PlanAdministrator approves; PayrollProcessor posts contributions; Participant initiates; ComplianceOfficer finalizes RMD; same role cannot do two adjacent steps
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plan
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: plan_name, type: string, source: input, description: "Display name of the employer's 401(k) plan" }
      - { name: plan_year, type: integer, source: input, description: "Calendar plan year, e.g. 2026; used for annual contribution limit checks" }
      - { name: match_formula_type, type: enum, source: input, description: "SAFE_HARBOR_BASIC | TIERED" }
      - { name: tiered_brackets, type: array, source: input, description: "When match_formula_type=TIERED, list of {employee_deferral_pct_up_to, match_rate_pct} brackets ordered ascending; ignored when SAFE_HARBOR_BASIC", default: null }
      - { name: vesting_schedule_type, type: enum, source: input, description: "CLIFF | GRADED" }
      - { name: cliff_years, type: integer, source: input, description: "Years of service before 100% vested; required when vesting_schedule_type=CLIFF", default: null }
      - { name: graded_percentages, type: array, source: input, description: "Array of 7 integers [yr0,yr1,yr2,yr3,yr4,yr5,yr6] in [0..100], strictly non-decreasing, terminating at 100; required when GRADED", default: null }
      - { name: rmd_age, type: integer, source: input, description: "Age at which RMD obligations begin", default: 73 }
      - { name: current_vesting_epoch, type: integer, source: computed, description: "Monotonic counter; advanced by POST /plans/{planId}/advance-vesting-epoch", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → FROZEN" }

  - name: Participant
    parent: Plan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning Plan.id" }
      - { name: employee_external_id, type: string, source: input, description: "External payroll identifier; unique within plan" }
      - { name: date_of_birth, type: string, source: input, description: "YYYY-MM-DD; used by RMD age computation" }
      - { name: hire_date, type: string, source: input, description: "YYYY-MM-DD; baseline for vesting service years" }
      - { name: annual_compensation_cents, type: integer, source: input, description: "Gross annual compensation in cents, used in match cap and limit checks" }
      - { name: elected_deferral_pct, type: number, source: input, description: "Percent of pay (0..100, two decimals) the participant elects to contribute" }
      - { name: deferral_suspended_until, type: string, source: computed, description: "Plan-clock date YYYY-MM-DD until which deferrals are blocked; null if not suspended", default: null }
      - { name: vested_pct_snapshot, type: number, source: computed, description: "Vested percent at current_vesting_epoch (0..100, one decimal)", default: 0 }
      - { name: vesting_epoch_at_snapshot, type: integer, source: computed, description: "Plan.current_vesting_epoch when vested_pct_snapshot was last refreshed", default: 0 }
      - { name: cumulative_employee_contribution_cents, type: integer, source: computed, description: "Sum of all POSTED ContributionRecord.employee_amount_cents for this participant", default: 0 }
      - { name: cumulative_employer_match_cents, type: integer, source: computed, description: "Sum of all POSTED ContributionRecord.employer_match_cents for this participant", default: 0 }
      - { name: total_account_balance_cents, type: integer, source: computed, description: "cumulative_employee_contribution_cents + cumulative_employer_match_cents − sum of TAXED hardship/loan_default amounts", default: 0 }
      - { name: status, type: enum, source: system, description: "ENROLLED → ACTIVE → SUSPENDED → TERMINATED" }

  - name: ContributionRecord
    parent: Participant
    common_fields: false   # immutable ledger entry: only id + created_at
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning Plan.id" }
      - { name: participant_id, type: string, source: system, description: "Owning Participant.id" }
      - { name: pay_period_end, type: string, source: input, description: "YYYY-MM-DD; the pay period ending date" }
      - { name: gross_pay_cents, type: integer, source: input, description: "Gross pay for the period in cents" }
      - { name: employee_amount_cents, type: integer, source: computed, description: "round_half_up( gross_pay_cents * elected_deferral_pct / 100 ); capped so YTD ≤ EMPLOYEE_ANNUAL_LIMIT_CENTS" }
      - { name: employer_match_cents, type: integer, source: computed, description: "Result of employer_match calculation (per match_formula_type)" }
      - { name: status, type: enum, source: system, description: "POSTED (terminal); REJECTED only when validation fails before commit, in which case no row is persisted" }

  - name: VestingSnapshot
    parent: Participant
    common_fields: false   # append-only audit row: id + created_at
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning Plan.id" }
      - { name: participant_id, type: string, source: system, description: "Owning Participant.id" }
      - { name: vesting_epoch, type: integer, source: system, description: "Plan.current_vesting_epoch at which this snapshot was generated" }
      - { name: service_years_completed, type: integer, source: computed, description: "floor((plan_clock_date − hire_date) / 365)" }
      - { name: vested_pct, type: number, source: computed, description: "Result of vested_percent calculation for this Participant at this epoch" }
      - { name: vested_balance_cents, type: integer, source: computed, description: "round_half_up( total_account_balance_cents * vested_pct / 100 )" }

  - name: Loan
    parent: Participant
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning Plan.id" }
      - { name: participant_id, type: string, source: system, description: "Owning Participant.id" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Loan amount requested" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Set on APPROVED; equals requested_amount_cents (rejected entirely if it exceeds the max-loan calculation)" }
      - { name: term_months, type: integer, source: input, description: "Repayment term in whole months; 1..60 inclusive" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "round_half_up( approved_amount_cents / term_months ); the LAST repayment absorbs any rounding remainder" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "approved_amount_cents − sum of POSTED LoanRepayment.principal_cents" }
      - { name: payments_made, type: integer, source: computed, description: "Count of POSTED LoanRepayment rows" }
      - { name: origination_date, type: string, source: computed, description: "Plan clock date when loan transitioned REQUESTED→ACTIVE" }
      - { name: next_due_date, type: string, source: computed, description: "Plan clock date when next monthly payment is due" }
      - { name: status, type: enum, source: system, description: "REQUESTED → ACTIVE → SATISFIED; ACTIVE → DEFAULTED; REQUESTED → REJECTED" }

  - name: LoanRepayment
    parent: Loan
    common_fields: false   # append-only ledger row
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning Plan.id" }
      - { name: participant_id, type: string, source: system, description: "Owning Participant.id" }
      - { name: loan_id, type: string, source: system, description: "Owning Loan.id" }
      - { name: payment_amount_cents, type: integer, source: input, description: "Amount being paid this installment" }
      - { name: principal_cents, type: integer, source: computed, description: "Equal to payment_amount_cents (simplified: no interest split tracked at row level)" }
      - { name: posted_on, type: string, source: computed, description: "Plan clock date at posting" }
      - { name: status, type: enum, source: system, description: "POSTED (terminal)" }

  - name: HardshipWithdrawal
    parent: Participant
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning Plan.id" }
      - { name: participant_id, type: string, source: system, description: "Owning Participant.id" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount requested" }
      - { name: hardship_reason_code, type: enum, source: input, description: "MEDICAL | EDUCATION | PRIMARY_RESIDENCE | FUNERAL | EVICTION" }
      - { name: approved_amount_cents, type: integer, source: computed, description: "Set when status=APPROVED; equals min(requested_amount_cents, vested_balance_cents_at_request); 0 when DENIED" }
      - { name: vested_balance_cents_at_request, type: integer, source: computed, description: "Snapshot of vested_balance_cents (per vested_balance calculation) when row was created; immutable thereafter" }
      - { name: status, type: enum, source: system, description: "REQUESTED → APPROVED | DENIED" }

  - name: RMDSchedule
    parent: Participant
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning Plan.id" }
      - { name: participant_id, type: string, source: system, description: "Owning Participant.id" }
      - { name: rmd_year, type: integer, source: input, description: "Calendar year the RMD applies to; must equal age_attained year ≥ Plan.rmd_age" }
      - { name: prior_year_end_balance_cents, type: integer, source: computed, description: "Snapshot of total_account_balance_cents at the moment of row creation (the implementation's stand-in for prior-Dec-31 balance under plan clock)" }
      - { name: distribution_period_factor, type: number, source: computed, description: "Lookup from UNIFORM_LIFETIME_TABLE keyed by age_attained" }
      - { name: required_amount_cents, type: integer, source: computed, description: "round_half_up( prior_year_end_balance_cents / distribution_period_factor )" }
      - { name: due_date, type: string, source: computed, description: "December 31 of rmd_year for non-first-year; April 1 of (rmd_year+1) for first-year RMD" }
      - { name: distributed_amount_cents, type: integer, source: computed, description: "Amount actually distributed by FULFILLED; 0 otherwise", default: 0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED → FULFILLED | MISSED" }

  - name: PlanClock
    parent: Plan
    common_fields: false   # singleton config snapshot; id + created_at only
    fields:
      - { name: plan_id, type: string, source: system, description: "Owning Plan.id; unique (exactly one row per Plan)" }
      - { name: current_date, type: string, source: computed, description: "YYYY-MM-DD; advanced only by POST /plans/{planId}/_clock/advance" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Plan
    initial_state: DRAFT
    terminal_states: [FROZEN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /plans/{planId}/activate
        actor: PlanAdministrator
        preconditions:
          - "match_formula_type and vesting_schedule_type populated"
          - "If TIERED, tiered_brackets non-empty; if CLIFF, cliff_years≥1; if GRADED, graded_percentages length=7 and graded_percentages[6]=100"
        side_effects:
          - "PlanClock row created with current_date = today's UTC date (the only time a real wall-clock value enters the system; thereafter only /_clock/advance moves it)"

      - from: ACTIVE
        to: FROZEN
        trigger: POST /plans/{planId}/freeze
        actor: PlanAdministrator
        preconditions:
          - "No Loan in ACTIVE status with outstanding_principal_cents > 0"
          - "No HardshipWithdrawal in REQUESTED status"
          - "No RMDSchedule in SCHEDULED status with due_date < PlanClock.current_date"
        side_effects:
          - "All ENROLLED|ACTIVE participants are flipped to SUSPENDED (deferral_suspended_until set to '9999-12-31')"

  - entity: Participant
    initial_state: ENROLLED
    terminal_states: [TERMINATED]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: POST /plans/{planId}/participants/{participantId}/activate
        actor: PayrollProcessor
        preconditions:
          - "Plan.status == ACTIVE"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when a HardshipWithdrawal transitions REQUESTED → APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "deferral_suspended_until set to PlanClock.current_date + 180 days"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic during POST /plans/{planId}/_clock/advance when new current_date > deferral_suspended_until)"
        actor: system
        preconditions: []
        side_effects:
          - "deferral_suspended_until reset to null"

      - from: ACTIVE
        to: TERMINATED
        trigger: POST /plans/{planId}/participants/{participantId}/terminate
        actor: PlanAdministrator
        preconditions:
          - "No Loan in ACTIVE status"
        side_effects:
          - "All RMDSchedule rows with status=SCHEDULED and due_date < PlanClock.current_date flipped to MISSED (cascade hop A→Participant→RMDSchedule, depth 2)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: POST /plans/{planId}/participants/{participantId}/terminate
        actor: PlanAdministrator
        preconditions:
          - "No Loan in ACTIVE status"
        side_effects: []

  - entity: Loan
    initial_state: REQUESTED
    terminal_states: [SATISFIED, DEFAULTED, REJECTED]
    transitions:
      - from: REQUESTED
        to: ACTIVE
        trigger: POST /plans/{planId}/participants/{participantId}/loans/{loanId}/approve
        actor: PlanAdministrator
        preconditions:
          - "Participant.status IN {ACTIVE, SUSPENDED}"
          - "requested_amount_cents ≤ max_loan_amount calculation"
          - "Participant has no other Loan in {REQUESTED, ACTIVE} (one outstanding loan per participant)"
        side_effects:
          - "approved_amount_cents := requested_amount_cents"
          - "origination_date := PlanClock.current_date"
          - "next_due_date := origination_date + 30 days"
          - "monthly_payment_cents computed per max_loan + payment formula"

      - from: REQUESTED
        to: REJECTED
        trigger: POST /plans/{planId}/participants/{participantId}/loans/{loanId}/reject
        actor: PlanAdministrator
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: SATISFIED
        trigger: "system (automatic on LoanRepayment posting when outstanding_principal_cents reaches 0)"
        actor: system
        preconditions:
          - "outstanding_principal_cents == 0 after this repayment"
        side_effects: []

      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (automatic during POST /plans/{planId}/_clock/advance when next_due_date + 90 days < new current_date and outstanding_principal_cents > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 1: a synthetic deemed-distribution ContributionRecord-equivalent debit is applied — Participant.total_account_balance_cents -= outstanding_principal_cents"
          - "Cascade hop 2: Participant.vested_pct_snapshot is REFRESHED against the new total_account_balance_cents at next access (mark vesting_epoch_at_snapshot = -1 so the next vested-balance read forces recompute)"
          - "outstanding_principal_cents := 0"

  - entity: HardshipWithdrawal
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: POST /plans/{planId}/participants/{participantId}/hardship-withdrawals/{withdrawalId}/approve
        actor: ComplianceOfficer
        preconditions:
          - "Participant.status IN {ACTIVE, SUSPENDED}"
          - "vested_balance_cents_at_request > 0"
          - "Participant has no Loan in REQUESTED status (must resolve outstanding loan request first)"
        side_effects:
          - "Cascade hop 1: approved_amount_cents := min(requested_amount_cents, vested_balance_cents_at_request); Participant.total_account_balance_cents -= approved_amount_cents"
          - "Cascade hop 2: Participant.status flips ACTIVE→SUSPENDED with deferral_suspended_until = PlanClock.current_date + 180 days (per Participant state machine system transition)"
          - "Cascade hop 3: any future ContributionRecord POST in the suspension window will be rejected with ERR_DEFERRAL_SUSPENDED (no row created, no participant balance change)"

      - from: REQUESTED
        to: DENIED
        trigger: POST /plans/{planId}/participants/{participantId}/hardship-withdrawals/{withdrawalId}/deny
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

  - entity: RMDSchedule
    initial_state: SCHEDULED
    terminal_states: [FULFILLED, MISSED]
    transitions:
      - from: SCHEDULED
        to: FULFILLED
        trigger: POST /plans/{planId}/participants/{participantId}/rmd-schedules/{scheduleId}/fulfill
        actor: ComplianceOfficer
        preconditions:
          - "distributed_amount_cents in request body ≥ required_amount_cents"
          - "PlanClock.current_date ≤ due_date"
        side_effects:
          - "Participant.total_account_balance_cents -= distributed_amount_cents"
          - "RMDSchedule.distributed_amount_cents := request body value"

      - from: SCHEDULED
        to: MISSED
        trigger: "system (automatic during POST /plans/{planId}/_clock/advance when new current_date > due_date and status is still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: MISSED
        trigger: "system (cascade during POST /plans/{planId}/participants/{participantId}/terminate when due_date < PlanClock.current_date)"
        actor: system
        preconditions:
          - "Triggering Participant.status transitioned to TERMINATED in same request"
          - "due_date < PlanClock.current_date"
        side_effects: []
        note: "Second cascade path for terminate hop 2 (see Participant.ACTIVE→TERMINATED side_effects)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two PlanAdministrator users approve two pending loan REQUESTs for the same Participant simultaneously"
    guarantee: "At most one Loan per Participant in {REQUESTED, ACTIVE}; second approve is rejected"
    error_id: ERR_LOAN_ALREADY_OUTSTANDING
    http_status: 409
    serialization: "First-writer-wins on Loan.status transition REQUESTED→ACTIVE"

  - scenario: "Hardship approve and loan approve fire for the same Participant simultaneously, both passing balance checks independently"
    guarantee: "Whichever commits second is rejected because the first has already mutated total_account_balance_cents or suspension state"
    error_id: ERR_INSUFFICIENT_VESTED_BALANCE
    http_status: 409
    serialization: "First-writer-wins on Participant.total_account_balance_cents debit"

  - scenario: "Two PayrollProcessor users POST a ContributionRecord for the same Participant + identical pay_period_end simultaneously"
    guarantee: "Pay-period contributions are unique per (participant_id, pay_period_end); second is rejected"
    error_id: ERR_DUPLICATE_PAY_PERIOD
    http_status: 409
    serialization: "First-writer-wins on ContributionRecord insertion"

  - scenario: "RMD fulfill and Plan freeze fire simultaneously while an RMDSchedule is past its due_date"
    guarantee: "If freeze commits first, fulfill is rejected (plan frozen); if fulfill commits first, freeze fails its precondition on SCHEDULED+overdue RMDs"
    error_id: ERR_PLAN_FROZEN
    http_status: 409
    serialization: "First-writer-wins on Plan.status transition ACTIVE→FROZEN"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: employer_match
    trigger: "POST /plans/{planId}/participants/{participantId}/contribution-records (computes employer_match_cents on the new row before persisting)"
    algorithm: tiered_pricing
    formula: |
      # The same gross_pay + elected_deferral_pct input produces a different match
      # under SAFE_HARBOR_BASIC vs TIERED; both are pinned formulas, but they differ.
      eligible_deferral_pct = min(elected_deferral_pct, 100)
      employee_amount_cents = round_half_up(gross_pay_cents * eligible_deferral_pct / 100)

      if Plan.match_formula_type == SAFE_HARBOR_BASIC:
          # 100% of first 3% deferred + 50% of next 2% deferred (cap at 4% of pay)
          tier1_pct = min(eligible_deferral_pct, 3.0)               # up to 3 pp
          tier2_pct = min(max(eligible_deferral_pct - 3.0, 0), 2.0) # next 2 pp
          match_pct_of_pay = tier1_pct * 1.0 + tier2_pct * 0.5
          employer_match_cents = round_half_up(gross_pay_cents * match_pct_of_pay / 100)

      elif Plan.match_formula_type == TIERED:
          # Walk Plan.tiered_brackets in order. Each bracket = {employee_deferral_pct_up_to, match_rate_pct}.
          # The bracket's match_rate_pct multiplies the EMPLOYEE deferral percentage points in that band.
          remaining_pct = eligible_deferral_pct
          previous_cap = 0
          match_pct_of_pay = 0
          for b in Plan.tiered_brackets:        # already ordered ascending by employee_deferral_pct_up_to
              band_width_pp = max(0, b.employee_deferral_pct_up_to - previous_cap)
              applied_pp = min(remaining_pct, band_width_pp)
              match_pct_of_pay += applied_pp * (b.match_rate_pct / 100)
              remaining_pct -= applied_pp
              previous_cap = b.employee_deferral_pct_up_to
              if remaining_pct <= 0: break
          employer_match_cents = round_half_up(gross_pay_cents * match_pct_of_pay / 100)

      # YTD cap (combined across employee + employer is governed separately by ANNUAL_LIMIT_CHECK):
      # employer_match_cents itself is then capped so that
      #   cumulative_employer_match_cents + employer_match_cents ≤ EMPLOYER_ANNUAL_LIMIT_CENTS
      # If the cap binds, the bound value is what gets written.
    input_set: "Plan (match_formula_type, tiered_brackets), Participant (cumulative_employer_match_cents), new ContributionRecord (gross_pay_cents, elected_deferral_pct)"
    constants:
      EMPLOYER_ANNUAL_LIMIT_CENTS: 4600000   # $46,000
      EMPLOYEE_ANNUAL_LIMIT_CENTS: 2350000   # $23,500
    precision: "Each per-row money value rounded round_half_up at the end of its own computation; sums are exact integer cents"
    variants:
      - name: safe_harbor_basic
        when: "Plan.match_formula_type == SAFE_HARBOR_BASIC"
        difference: "Uses fixed 100%/3% + 50%/2% rule; ignores tiered_brackets entirely"
      - name: tiered
        when: "Plan.match_formula_type == TIERED"
        difference: "Walks tiered_brackets in order; identical (gross_pay, deferral) inputs produce a different employer_match_cents than safe_harbor_basic"

  - name: vested_percent
    trigger: "Read-time: any endpoint computing vested_balance_cents (POST loan request, POST hardship request, POST vesting-snapshot, GET participant); and write-time during POST /_clock/advance after each plan-year boundary crossing"
    algorithm: threshold
    formula: |
      # Two valid algorithms keyed on Plan.vesting_schedule_type — CLIFF vs GRADED
      # produce different vested_pct for identical service_years_completed.
      service_days = days_between(Participant.hire_date, PlanClock.current_date)
      service_years_completed = service_days // 365     # integer floor

      if Plan.vesting_schedule_type == CLIFF:
          if service_years_completed >= Plan.cliff_years:
              vested_pct = 100.0
          else:
              vested_pct = 0.0

      elif Plan.vesting_schedule_type == GRADED:
          idx = min(service_years_completed, 6)         # clamp to last bucket
          vested_pct = float(Plan.graded_percentages[idx])
    input_set: "Plan (vesting_schedule_type, cliff_years, graded_percentages), PlanClock (current_date), Participant (hire_date)"
    constants: {}
    precision: "vested_pct stored to 1 decimal place; vested_balance_cents = round_half_up(total_account_balance_cents * vested_pct / 100)"
    variants:
      - name: cliff
        when: "Plan.vesting_schedule_type == CLIFF"
        difference: "Binary: 0% below cliff_years, 100% at/above. Boundary uses `>=` on integer service_years_completed"
      - name: graded
        when: "Plan.vesting_schedule_type == GRADED"
        difference: "Stepwise per graded_percentages bucket; never returns 100% before year 6 unless graded_percentages[k]=100 for k<6"

  - name: max_loan_amount
    trigger: "POST /plans/{planId}/participants/{participantId}/loans (validates requested_amount_cents at creation) and again at /approve"
    algorithm: aggregation
    formula: |
      # Step 1 — vested-floor inputs:
      vested_pct = vested_percent(Participant)
      vested_balance_cents = round_half_up(Participant.total_account_balance_cents * vested_pct / 100)

      # Step 2 — IRS-style cap:
      raw_cap_cents = min(
          vested_balance_cents // 2,                  # 50% of vested balance, integer-floor
          ABSOLUTE_LOAN_CAP_CENTS
      )

      # Step 3 — Highest-outstanding-in-past-365-days reduction:
      # Walk every Loan for this Participant whose status was ACTIVE at any time in the
      # last 365 days (i.e., origination_date >= current_date - 365 OR
      # (status == ACTIVE and any LoanRepayment.posted_on >= current_date - 365)).
      # Take max(outstanding_principal_cents observed) — for SATISFIED loans use the
      # MAX outstanding seen during that window (= approved_amount_cents − payments made
      # before the window started). For ACTIVE loans, the current outstanding counts.
      hi_outstanding_cents = max over qualifying loans (or 0 if none)

      max_loan_cents = max(0, raw_cap_cents - hi_outstanding_cents)
      monthly_payment_cents = round_half_up(approved_amount_cents / term_months)
      # Last installment absorbs rounding remainder so the total equals approved_amount_cents exactly.
    input_set: "Participant.total_account_balance_cents, vested_percent output, all Loan rows for this participant"
    constants:
      ABSOLUTE_LOAN_CAP_CENTS: 5000000        # $50,000
      WINDOW_DAYS: 365
    precision: "Integer cents throughout; the // operator is integer floor division"

  - name: required_minimum_distribution
    trigger: "POST /plans/{planId}/participants/{participantId}/rmd-schedules (creates a SCHEDULED row for a given rmd_year)"
    algorithm: threshold
    formula: |
      age_attained = rmd_year - year(Participant.date_of_birth)
      if age_attained < Plan.rmd_age:
          reject ERR_RMD_NOT_YET_REQUIRED

      prior_year_end_balance_cents = Participant.total_account_balance_cents   # plan-clock stand-in
      distribution_period_factor = UNIFORM_LIFETIME_TABLE[age_attained]
      required_amount_cents = round_half_up(prior_year_end_balance_cents / distribution_period_factor)

      # First-year RMD (age_attained == Plan.rmd_age) gets due_date = April 1 of (rmd_year + 1);
      # all later years' due_date = December 31 of rmd_year.
      is_first_year = (age_attained == Plan.rmd_age and
                       not exists prior RMDSchedule row for this participant)
      due_date = "%d-04-01" % (rmd_year + 1) if is_first_year else "%d-12-31" % rmd_year
    input_set: "Plan.rmd_age, Participant.date_of_birth, Participant.total_account_balance_cents, prior RMDSchedule rows"
    constants:
      UNIFORM_LIFETIME_TABLE:
        73: 26.5
        74: 25.5
        75: 24.6
        76: 23.7
        77: 22.9
        78: 22.0
        79: 21.1
        80: 20.2
    precision: "round_half_up on the final required_amount_cents division"

  - name: contribution_annual_limit_check
    trigger: "POST /plans/{planId}/participants/{participantId}/contribution-records (validation before persisting the row)"
    algorithm: aggregation
    formula: |
      ytd_employee = sum( employee_amount_cents
                          for row in ContributionRecord
                          where row.participant_id = current and year(row.pay_period_end) = year(new.pay_period_end))
      ytd_employer = sum( employer_match_cents [same filter] )

      proposed_employee = round_half_up(new.gross_pay_cents * Participant.elected_deferral_pct / 100)
      proposed_employer = employer_match(...)   # using same elected_deferral_pct + gross_pay

      if (ytd_employee + proposed_employee) > EMPLOYEE_ANNUAL_LIMIT_CENTS:
          reject ERR_ANNUAL_EMPLOYEE_LIMIT_EXCEEDED
      if (ytd_employer + proposed_employer) > EMPLOYER_ANNUAL_LIMIT_CENTS:
          # silently CAP employer side rather than reject:
          proposed_employer = max(0, EMPLOYER_ANNUAL_LIMIT_CENTS - ytd_employer)
    input_set: "All ContributionRecord rows for this participant in the same calendar year"
    constants:
      EMPLOYEE_ANNUAL_LIMIT_CENTS: 2350000
      EMPLOYER_ANNUAL_LIMIT_CENTS: 4600000
    precision: "Integer cents; round_half_up where division is involved"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be authorized for this endpoint per §1.7 RBAC; segregation-of-duties forbids the same X-User-ID from doing two adjacent roles' steps on the same Plan within the same workflow"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resources exist (validate left-to-right: planId → participantId → loanId/withdrawalId/scheduleId)"
    error_id: "ERR_PLAN_NOT_FOUND | ERR_PARTICIPANT_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_HARDSHIP_NOT_FOUND | ERR_RMD_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Plan must be ACTIVE for any participant-side mutation (enroll, activate, contribution, loan, hardship, RMD schedule/fulfill)"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: all participant-side mutations

  - priority: 5
    category: state
    check: "Participant.status must permit the operation (e.g., ACTIVE for contribution; ACTIVE|SUSPENDED for loan approve)"
    error_id: ERR_PARTICIPANT_NOT_IN_VALID_STATE
    http_status: 409
    applies_to: "All Participant-scoped mutations"

  - priority: 6
    category: state
    check: "Target resource is in the correct state for the requested transition (loan approve requires REQUESTED, hardship approve requires REQUESTED, etc.)"
    error_id: "varies (ERR_LOAN_NOT_REQUESTED, ERR_HARDSHIP_NOT_REQUESTED, ERR_RMD_NOT_SCHEDULED)"
    http_status: 409
    applies_to: state-transition endpoints

  - priority: 7
    category: business_temporal
    check: "Pay-period uniqueness — no two ContributionRecord rows may share (participant_id, pay_period_end)"
    error_id: ERR_DUPLICATE_PAY_PERIOD
    http_status: 409
    applies_to: "POST contribution-records"

  - priority: 8
    category: business_safety
    check: "Deferral suspension active — participant.deferral_suspended_until is not null and PlanClock.current_date ≤ deferral_suspended_until → reject contribution"
    error_id: ERR_DEFERRAL_SUSPENDED
    http_status: 409
    applies_to: "POST contribution-records"

  - priority: 9
    category: business_referential
    check: "One outstanding loan per participant — a new loan REQUEST is rejected if any existing Loan is in {REQUESTED, ACTIVE}; approving a loan is rejected if a sibling loan reached ACTIVE first"
    error_id: ERR_LOAN_ALREADY_OUTSTANDING
    http_status: 409
    applies_to: "POST loans, POST loans/{id}/approve"

  - priority: 10
    category: business_fiscal
    check: "Requested loan amount ≤ max_loan_amount calculation; otherwise reject"
    error_id: ERR_LOAN_EXCEEDS_MAX
    http_status: 422
    applies_to: "POST loans, POST loans/{id}/approve"

  - priority: 11
    category: business_fiscal
    check: "Hardship requested_amount_cents > 0 and vested_balance_cents_at_request > 0; otherwise reject"
    error_id: ERR_INSUFFICIENT_VESTED_BALANCE
    http_status: 422
    applies_to: "POST hardship-withdrawals, POST hardship-withdrawals/{id}/approve"

  - priority: 12
    category: business_fiscal
    check: "Combined annual contribution limit — ytd_employee + proposed_employee ≤ EMPLOYEE_ANNUAL_LIMIT_CENTS; otherwise reject (employer side silently caps, never rejects)"
    error_id: ERR_ANNUAL_EMPLOYEE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST contribution-records"

  - priority: 13
    category: business_temporal
    check: "RMD eligibility — rmd_year must satisfy (rmd_year - year(date_of_birth)) ≥ Plan.rmd_age"
    error_id: ERR_RMD_NOT_YET_REQUIRED
    http_status: 422
    applies_to: "POST rmd-schedules"

  - priority: 14
    category: business_temporal
    check: "RMD uniqueness — at most one RMDSchedule per (participant_id, rmd_year)"
    error_id: ERR_DUPLICATE_RMD_YEAR
    http_status: 409
    applies_to: "POST rmd-schedules"

  - priority: 15
    category: business_constraint
    check: "RMD fulfill distributed_amount_cents ≥ required_amount_cents; PlanClock.current_date ≤ due_date"
    error_id: "ERR_RMD_UNDERPAID (when distributed < required); ERR_RMD_PAST_DUE (when current_date > due_date)"
    http_status: 422
    applies_to: "POST rmd-schedules/{id}/fulfill"

  - priority: 16
    category: business_constraint
    check: "OCC version match — if request body carries `version`, it must equal server's current version of the mutated resource"
    error_id: ERR_STALE_DATA
    http_status: 409
    applies_to: "All mutation endpoints on common_fields=true entities"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Plan ----
  - method: POST
    path: "/plans"
    description: "Create a draft Plan"
    roles: [PlanAdministrator]
    code: 201
    input: [plan_name, plan_year, match_formula_type, "tiered_brackets?", vesting_schedule_type, "cliff_years?", "graded_percentages?", "rmd_age?"]
    output: Plan
    side_effects: ["status=DRAFT; current_vesting_epoch=0"]

  - method: GET
    path: "/plans"
    description: "List Plans"
    roles: [PlanAdministrator, ComplianceOfficer, PayrollProcessor]
    code: 200
    input: ["limit?", "offset?"]
    output: "Plan[]"
    side_effects: []

  - method: GET
    path: "/plans/{planId}"
    description: "Get a Plan"
    roles: [PlanAdministrator, ComplianceOfficer, PayrollProcessor]
    code: 200
    input: []
    output: Plan
    side_effects: []

  - method: POST
    path: "/plans/{planId}/activate"
    description: "DRAFT → ACTIVE; creates PlanClock"
    roles: [PlanAdministrator]
    code: 200
    input: ["version?"]
    output: Plan
    side_effects: ["PlanClock row created at today's date"]

  - method: POST
    path: "/plans/{planId}/freeze"
    description: "ACTIVE → FROZEN; suspends all participants"
    roles: [PlanAdministrator]
    code: 200
    input: ["version?"]
    output: Plan
    side_effects: ["All ENROLLED|ACTIVE Participants → SUSPENDED with deferral_suspended_until='9999-12-31'"]

  - method: POST
    path: "/plans/{planId}/advance-vesting-epoch"
    description: "Increment Plan.current_vesting_epoch by 1; downstream reads of vested_pct_snapshot will refresh"
    roles: [PlanAdministrator]
    code: 200
    input: ["version?"]
    output: Plan
    side_effects: ["current_vesting_epoch += 1"]

  - method: POST
    path: "/plans/{planId}/_clock/advance"
    description: "Advance plan clock to a new YYYY-MM-DD; drives time-gated automatic transitions (loan default, RMD MISSED, hardship suspension expiry)"
    roles: [PlanAdministrator]
    code: 200
    input: ["new_date", "version?"]
    output: PlanClock
    side_effects:
      - "Walk Loans: ACTIVE && next_due_date + 90 days < new_date && outstanding_principal_cents>0 → DEFAULTED (with deemed-distribution cascade)"
      - "Walk RMDSchedules: SCHEDULED && due_date < new_date → MISSED"
      - "Walk Participants: SUSPENDED && deferral_suspended_until < new_date → ACTIVE; deferral_suspended_until → null"
      - "Plan year crossing: vested_percent recomputed lazily on next read"

  # ---- Participant ----
  - method: POST
    path: "/plans/{planId}/participants"
    description: "Enroll a participant"
    roles: [PlanAdministrator]
    code: 201
    input: [employee_external_id, date_of_birth, hire_date, annual_compensation_cents, elected_deferral_pct]
    output: Participant
    side_effects: ["status=ENROLLED; vested_pct_snapshot=0; vesting_epoch_at_snapshot=0"]

  - method: GET
    path: "/plans/{planId}/participants"
    description: "List participants"
    roles: [PlanAdministrator, ComplianceOfficer, PayrollProcessor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Participant[]"
    side_effects: []

  - method: GET
    path: "/plans/{planId}/participants/{participantId}"
    description: "Get a participant (returns total_account_balance_cents and current vested_balance_cents)"
    roles: [PlanAdministrator, ComplianceOfficer, PayrollProcessor]
    code: 200
    input: []
    output: Participant
    side_effects: ["vested_pct_snapshot lazily refreshed if vesting_epoch_at_snapshot != Plan.current_vesting_epoch"]

  - method: POST
    path: "/plans/{planId}/participants/{participantId}/activate"
    description: "ENROLLED → ACTIVE"
    roles: [PayrollProcessor]
    code: 200
    input: ["version?"]
    output: Participant
    side_effects: []

  - method: POST
    path: "/plans/{planId}/participants/{participantId}/terminate"
    description: "{ACTIVE,SUSPENDED} → TERMINATED"
    roles: [PlanAdministrator]
    code: 200
    input: ["version?"]
    output: Participant
    side_effects: ["Overdue SCHEDULED RMDSchedules → MISSED (cascade depth 2)"]

  - method: PATCH
    path: "/plans/{planId}/participants/{participantId}/deferral"
    description: "Update elected_deferral_pct (0..100)"
    roles: [Participant, PayrollProcessor]
    code: 200
    input: ["elected_deferral_pct", "version?"]
    output: Participant
    side_effects: []

  # ---- ContributionRecord ----
  - method: POST
    path: "/plans/{planId}/participants/{participantId}/contribution-records"
    description: "Post a pay-period contribution; computes employee_amount + employer_match"
    roles: [PayrollProcessor]
    code: 201
    input: [pay_period_end, gross_pay_cents]
    output: ContributionRecord
    side_effects:
      - "employee_amount_cents and employer_match_cents computed and stored (employer side may be CAPPED rather than rejected when EMPLOYER_ANNUAL_LIMIT is reached)"
      - "Participant.cumulative_employee_contribution_cents += employee_amount_cents"
      - "Participant.cumulative_employer_match_cents += employer_match_cents"
      - "Participant.total_account_balance_cents updated"

  - method: GET
    path: "/plans/{planId}/participants/{participantId}/contribution-records"
    description: "List a participant's contribution records"
    roles: [PlanAdministrator, ComplianceOfficer, PayrollProcessor, Participant]
    code: 200
    input: ["limit?", "offset?", "year?"]
    output: "ContributionRecord[]"
    side_effects: []

  # ---- VestingSnapshot ----
  - method: POST
    path: "/plans/{planId}/participants/{participantId}/vesting-snapshots"
    description: "Materialize an immutable vested-balance snapshot at the current epoch"
    roles: [PlanAdministrator, ComplianceOfficer]
    code: 201
    input: []
    output: VestingSnapshot
    side_effects: ["vested_percent run; row appended"]

  - method: GET
    path: "/plans/{planId}/participants/{participantId}/vesting-snapshots"
    description: "List vesting snapshots"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: "VestingSnapshot[]"
    side_effects: []

  # ---- Loan ----
  - method: POST
    path: "/plans/{planId}/participants/{participantId}/loans"
    description: "Request a loan; validates against max_loan_amount but does not yet originate"
    roles: [Participant]
    code: 201
    input: [requested_amount_cents, term_months]
    output: Loan
    side_effects: ["status=REQUESTED; outstanding_principal_cents=requested_amount_cents (provisional, not yet debited)"]

  - method: GET
    path: "/plans/{planId}/participants/{participantId}/loans"
    description: "List participant loans"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Loan[]"
    side_effects: []

  - method: GET
    path: "/plans/{planId}/participants/{participantId}/loans/{loanId}"
    description: "Get a loan"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: POST
    path: "/plans/{planId}/participants/{participantId}/loans/{loanId}/approve"
    description: "REQUESTED → ACTIVE"
    roles: [PlanAdministrator]
    code: 200
    input: ["version?"]
    output: Loan
    side_effects:
      - "approved_amount_cents := requested_amount_cents"
      - "origination_date := PlanClock.current_date"
      - "next_due_date := origination_date + 30 days"
      - "monthly_payment_cents := round_half_up(approved_amount_cents / term_months)"

  - method: POST
    path: "/plans/{planId}/participants/{participantId}/loans/{loanId}/reject"
    description: "REQUESTED → REJECTED"
    roles: [PlanAdministrator]
    code: 200
    input: ["version?"]
    output: Loan
    side_effects: []

  - method: POST
    path: "/plans/{planId}/participants/{participantId}/loans/{loanId}/repayments"
    description: "Post a loan repayment; may transition loan to SATISFIED"
    roles: [Participant, PayrollProcessor]
    code: 201
    input: [payment_amount_cents]
    output: LoanRepayment
    side_effects:
      - "outstanding_principal_cents -= payment_amount_cents (must not go negative; reject with ERR_LOAN_OVERPAYMENT)"
      - "next_due_date += 30 days"
      - "If outstanding_principal_cents == 0 → Loan.status = SATISFIED"

  # ---- HardshipWithdrawal ----
  - method: POST
    path: "/plans/{planId}/participants/{participantId}/hardship-withdrawals"
    description: "Request a hardship withdrawal"
    roles: [Participant]
    code: 201
    input: [requested_amount_cents, hardship_reason_code]
    output: HardshipWithdrawal
    side_effects:
      - "status=REQUESTED"
      - "vested_balance_cents_at_request := round_half_up(Participant.total_account_balance_cents * vested_percent / 100) (frozen at creation)"

  - method: GET
    path: "/plans/{planId}/participants/{participantId}/hardship-withdrawals"
    description: "List hardship withdrawals"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "HardshipWithdrawal[]"
    side_effects: []

  - method: POST
    path: "/plans/{planId}/participants/{participantId}/hardship-withdrawals/{withdrawalId}/approve"
    description: "REQUESTED → APPROVED (debits balance, suspends deferrals 180 days)"
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: HardshipWithdrawal
    side_effects:
      - "approved_amount_cents := min(requested_amount_cents, vested_balance_cents_at_request)"
      - "Participant.total_account_balance_cents -= approved_amount_cents"
      - "Participant.status = SUSPENDED; deferral_suspended_until = PlanClock.current_date + 180 days"

  - method: POST
    path: "/plans/{planId}/participants/{participantId}/hardship-withdrawals/{withdrawalId}/deny"
    description: "REQUESTED → DENIED"
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: HardshipWithdrawal
    side_effects: []

  # ---- RMDSchedule ----
  - method: POST
    path: "/plans/{planId}/participants/{participantId}/rmd-schedules"
    description: "Create a SCHEDULED RMD for the given rmd_year"
    roles: [ComplianceOfficer]
    code: 201
    input: [rmd_year]
    output: RMDSchedule
    side_effects: ["required_amount_cents and due_date computed per UNIFORM_LIFETIME_TABLE and first-year rules"]

  - method: GET
    path: "/plans/{planId}/participants/{participantId}/rmd-schedules"
    description: "List RMD schedules"
    roles: [PlanAdministrator, ComplianceOfficer, Participant]
    code: 200
    input: ["limit?", "offset?"]
    output: "RMDSchedule[]"
    side_effects: []

  - method: POST
    path: "/plans/{planId}/participants/{participantId}/rmd-schedules/{scheduleId}/fulfill"
    description: "SCHEDULED → FULFILLED (records distribution and debits balance)"
    roles: [ComplianceOfficer]
    code: 200
    input: [distributed_amount_cents, "version?"]
    output: RMDSchedule
    side_effects:
      - "Participant.total_account_balance_cents -= distributed_amount_cents"
      - "distributed_amount_cents stored on row"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # ---- Auth & headers ----
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not authorized for this endpoint, or segregation-of-duties violation" }

  # ---- Existence ----
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "Plan with planId does not exist" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "Participant with participantId does not exist within plan" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "Loan with loanId does not exist for this participant" }
  - { id: ERR_HARDSHIP_NOT_FOUND, http: 404, condition: "HardshipWithdrawal with withdrawalId does not exist" }
  - { id: ERR_RMD_NOT_FOUND, http: 404, condition: "RMDSchedule with scheduleId does not exist" }

  # ---- Plan state ----
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Operation requires Plan.status == ACTIVE" }
  - { id: ERR_PLAN_NOT_DRAFT, http: 409, condition: "Activate requires Plan.status == DRAFT" }
  - { id: ERR_PLAN_FROZEN, http: 409, condition: "Operation rejected because Plan.status == FROZEN" }
  - { id: ERR_FREEZE_PRECONDITION_VIOLATED, http: 409, condition: "Plan freeze rejected: outstanding loan, pending hardship, or overdue RMD exists" }

  # ---- Participant state ----
  - { id: ERR_PARTICIPANT_NOT_IN_VALID_STATE, http: 409, condition: "Participant status does not permit this operation" }

  # ---- Resource-state transitions ----
  - { id: ERR_LOAN_NOT_REQUESTED, http: 409, condition: "Loan approve/reject requires status == REQUESTED" }
  - { id: ERR_HARDSHIP_NOT_REQUESTED, http: 409, condition: "Hardship approve/deny requires status == REQUESTED" }
  - { id: ERR_RMD_NOT_SCHEDULED, http: 409, condition: "RMD fulfill requires status == SCHEDULED" }

  # ---- Business: contributions ----
  - { id: ERR_DUPLICATE_PAY_PERIOD, http: 409, condition: "ContributionRecord with same (participant_id, pay_period_end) already exists" }
  - { id: ERR_DEFERRAL_SUSPENDED, http: 409, condition: "Participant deferral is suspended (after hardship approval) and current date ≤ deferral_suspended_until" }
  - { id: ERR_ANNUAL_EMPLOYEE_LIMIT_EXCEEDED, http: 422, condition: "ytd_employee + proposed_employee > EMPLOYEE_ANNUAL_LIMIT_CENTS" }

  # ---- Business: loans ----
  - { id: ERR_LOAN_ALREADY_OUTSTANDING, http: 409, condition: "Participant has another Loan in {REQUESTED, ACTIVE}" }
  - { id: ERR_LOAN_EXCEEDS_MAX, http: 422, condition: "Requested amount > max_loan_amount calculation result" }
  - { id: ERR_LOAN_OVERPAYMENT, http: 422, condition: "Repayment payment_amount_cents > outstanding_principal_cents" }
  - { id: ERR_LOAN_TERM_INVALID, http: 400, condition: "term_months not in [1..60]" }

  # ---- Business: hardship ----
  - { id: ERR_INSUFFICIENT_VESTED_BALANCE, http: 422, condition: "Hardship request amount > vested_balance_cents_at_request, or vested_balance_cents_at_request == 0" }

  # ---- Business: RMD ----
  - { id: ERR_RMD_NOT_YET_REQUIRED, http: 422, condition: "rmd_year - year(date_of_birth) < Plan.rmd_age" }
  - { id: ERR_DUPLICATE_RMD_YEAR, http: 409, condition: "RMDSchedule already exists for (participant_id, rmd_year)" }
  - { id: ERR_RMD_UNDERPAID, http: 422, condition: "RMD fulfill distributed_amount_cents < required_amount_cents" }
  - { id: ERR_RMD_PAST_DUE, http: 422, condition: "RMD fulfill attempted after due_date (current_date > due_date)" }

  # ---- Concurrency ----
  - { id: ERR_STALE_DATA, http: 409, condition: "Request version does not match server's current version (OCC)" }

  # ---- Request format ----
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or out-of-range value (e.g., elected_deferral_pct > 100)" }
  - { id: ERR_INVALID_PLAN_CONFIG, http: 400, condition: "Plan create rejected: tiered_brackets/cliff_years/graded_percentages inconsistent with declared formula/schedule" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 422, condition: "POST /_clock/advance with new_date ≤ current_date" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlanAdministrator
    description: "Manages plan lifecycle (create/activate/freeze), enrolls/terminates participants, approves loans, drives plan clock and vesting epoch"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans"
      - "POST /plans/{planId}/activate"
      - "POST /plans/{planId}/freeze"
      - "POST /plans/{planId}/advance-vesting-epoch"
      - "POST /plans/{planId}/_clock/advance"
      - "POST /plans/{planId}/participants"
      - "POST /plans/{planId}/participants/{participantId}/terminate"
      - "POST /plans/{planId}/participants/{participantId}/loans/{loanId}/approve"
      - "POST /plans/{planId}/participants/{participantId}/loans/{loanId}/reject"
    shared_operations:
      - "GET /plans*, GET /plans/{planId}/participants*, GET /plans/{planId}/participants/{participantId}/loans*, etc."
      - "POST /plans/{planId}/participants/{participantId}/vesting-snapshots"

  - name: PayrollProcessor
    description: "Posts pay-period contributions and activates participants once payroll setup is complete; may also post repayments on behalf of a participant"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans/{planId}/participants/{participantId}/activate"
      - "POST /plans/{planId}/participants/{participantId}/contribution-records"
    shared_operations:
      - "GET listing endpoints"
      - "PATCH /plans/{planId}/participants/{participantId}/deferral (shared with Participant)"
      - "POST /plans/{planId}/participants/{participantId}/loans/{loanId}/repayments (shared with Participant)"

  - name: ComplianceOfficer
    description: "Owns regulatory side: hardship approval/denial, RMD scheduling and fulfilment, vesting snapshots for audit"
    identity: "opaque"
    exclusive_operations:
      - "POST /plans/{planId}/participants/{participantId}/hardship-withdrawals/{withdrawalId}/approve"
      - "POST /plans/{planId}/participants/{participantId}/hardship-withdrawals/{withdrawalId}/deny"
      - "POST /plans/{planId}/participants/{participantId}/rmd-schedules"
      - "POST /plans/{planId}/participants/{participantId}/rmd-schedules/{scheduleId}/fulfill"
    shared_operations:
      - "GET listing endpoints"
      - "POST /plans/{planId}/participants/{participantId}/vesting-snapshots"

  - name: Participant
    description: "End user acting as themselves; requests loans, requests hardship withdrawals, sets deferral, posts own loan repayments"
    identity: "entity_backed:Participant"
    exclusive_operations:
      - "POST /plans/{planId}/participants/{participantId}/loans (self only — X-User-ID must equal participantId)"
      - "POST /plans/{planId}/participants/{participantId}/hardship-withdrawals (self only)"
    shared_operations:
      - "GET own loans/hardship/RMD/contribution rows"
      - "PATCH /plans/{planId}/participants/{participantId}/deferral (self only)"
      - "POST /plans/{planId}/participants/{participantId}/loans/{loanId}/repayments (self only)"
      - "POST /plans/{planId}/participants/{participantId}/vesting-snapshots (self only)"

# Segregation-of-duties summary (enforced by validation priority 2):
# - The same X-User-ID may NOT both POST a loan request (as Participant) AND approve it
#   (as PlanAdministrator), even if that operator happens to hold both role headers
#   across two calls. Approval rejects with ERR_INSUFFICIENT_PERMISSIONS when the
#   approver's X-User-ID equals the requesting participant's id.
# - The same X-User-ID may NOT both POST a hardship request and approve it.
# - The same X-User-ID may NOT both POST a ContributionRecord (PayrollProcessor) and
#   later approve a loan against the resulting balance (PlanAdministrator) within the
#   same plan year — modeled via a recorded actor_id pair check.
