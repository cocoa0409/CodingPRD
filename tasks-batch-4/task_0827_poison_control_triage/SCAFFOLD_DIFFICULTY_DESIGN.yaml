scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: exposure_estimated_vs_confirmed_toxicity
        grounds:
          - calculations.exposure_toxicity_score
          - entities.Exposure.fields.confirmed_dose_mg
          - state_machines.FacilityConsult.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          The ESTIMATED variant scores the exposure from dose_range_high_mg (0.50) while the
          CONFIRMED variant re-scores from the facility-supplied confirmed_dose_mg (1.67); the
          divergence lives on the Exposure entity domain, distinct from the RiskAssessment
          aggregate dual-variant.
        test_recipe:
          setup:
            - "Substance acetaminophen (toxic_dose_mg_per_kg=150, onset_hours=4)."
            - "ACCEPTING facility (capacity 2); case weight 20kg; one INGESTION exposure dose_high 1500 (ESTIMATED score 0.50)."
            - "Case triaged with a COMPLETED RiskAssessment (risk_tier MODERATE); an ACTIVE FacilityConsult is open."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /healthcare-facilities"
              payload: { name: "Metro ED", facility_type: "ED", status: "ACCEPTING", consult_capacity: 2 }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Tara Tox", credential: "TOXICOLOGIST" }
              as: SystemAdmin
              captures: { tox: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 5, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1000, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
              captures: { exp: $.data.id }
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
            - call: "POST /facility-consults"
              payload: { case_id: "${case}", facility_id: "${fac}", consult_duration_minutes: 90 }
              as: Toxicologist
              as_user_id: "${tox}"
              captures: { consult: $.data.id }
          trigger:
            - call: "POST /facility-consults/${consult}/close"
              payload: { confirmed_dose_mg: 5000 }
              as: Toxicologist
              as_user_id: "${tox}"
          assert:
            - "Exposure.${exp}.toxicity_score == 1.67 (CONFIRMED variant; the ESTIMATED value was 0.50)"
            - "Exposure.${exp}.severity_band == CRITICAL"
            - "Exposure.${exp}.confirmed_dose_mg == 5000"

      - name: aggregate_max_vs_additive
        grounds:
          - calculations.case_aggregate_risk
          - entities.RiskAssessment.fields.aggregate_score_max
          - entities.RiskAssessment.fields.aggregate_score_additive
        distinguishing_aspect: |
          On the same two exposures the MAX aggregation yields 1.00 while the ADDITIVE
          co-ingestant aggregation yields 1.78; this dual-variant lives on the RiskAssessment
          entity domain, different from the Exposure-level ESTIMATED/CONFIRMED variant.
        test_recipe:
          setup:
            - "Two substances: acetaminophen (tdk 150, onset 4) and ibuprofen (tdk 100, onset 2)."
            - "Case weight 20kg with exposure A (acetaminophen INGESTION dose_high 3000 -> 1.00 SEVERE) and exposure B (ibuprofen INGESTION dose_high 600 -> 0.30 MODERATE)."
            - "Case triaged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /substances"
              payload: { name: "ibuprofen", category: "ANALGESIC", toxic_dose_mg_per_kg: 100, onset_hours: 2, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_ibu: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 5, patient_weight_kg: 20, patient_sex: "FEMALE", chief_complaint: "co-ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 2500, dose_range_high_mg: 3000, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_ibu}", route: "INGESTION", dose_range_low_mg: 400, dose_range_high_mg: 600, time_since_exposure_hours: 1 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
          assert:
            - "RiskAssessment.${ra}.aggregate_score_max == 1.00"
            - "RiskAssessment.${ra}.aggregate_score_additive == 1.78"
            - "RiskAssessment.${ra}.risk_tier == SEVERE"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: toxicity_route_branch_nonlinear
        grounds:
          - calculations.exposure_toxicity_score
          - entities.Exposure.fields.route
          - entities.Exposure.fields.toxicity_score
        distinguishing_aspect: |
          exposure_toxicity_score combines >=3 inputs (dose_range_high_mg, patient_weight_kg,
          substance.toxic_dose_mg_per_kg, route bioavailability, time factor) with a route branch:
          identical dose 3000 scores 1.00 via INGESTION (bioavail 1.0) but 0.40 via DERMAL
          (bioavail 0.4) [mode (a) non-linear multi-input].
        test_recipe:
          setup:
            - "Substance acetaminophen (tdk 150, onset 4); case weight 20kg."
            - "Exposure A recorded INGESTION dose 3000 (score 1.00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 40, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "mixed route" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 3000, dose_range_high_mg: 3000, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
              captures: { exp_a: $.data.id }
          trigger:
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "DERMAL", dose_range_low_mg: 3000, dose_range_high_mg: 3000, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
              captures: { exp_b: $.data.id }
          assert:
            - "Exposure.${exp_a}.toxicity_score == 1.00 (INGESTION, bioavail 1.0)"
            - "Exposure.${exp_b}.toxicity_score == 0.40 (DERMAL, bioavail 0.4)"
            - "Exposure.${exp_b}.severity_band == MODERATE"

      - name: additive_round_per_exposure_then_sum
        grounds:
          - calculations.case_aggregate_risk
          - entities.RiskAssessment.fields.aggregate_score_additive
        distinguishing_aspect: |
          aggregate_score_additive rounds each per-exposure weighted contribution to 2dp BEFORE
          summing then applies the co-ingestant multiplier; with exposure scores 0.78 and 0.55
          the pinned round-then-sum order yields 1.76 (sum-then-round would give 1.75) [mode (b)
          rounding order].
        test_recipe:
          setup:
            - "Substance acetaminophen (tdk 150, onset 4); case weight 20kg."
            - "Exposure X dose_high 2350 (score 0.78 SEVERE, weight 1.25) and exposure Y dose_high 1650 (score 0.55 MODERATE, weight 1.00)."
            - "Case triaged."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 30, patient_weight_kg: 20, patient_sex: "FEMALE", chief_complaint: "double dose" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 2350, dose_range_high_mg: 2350, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1650, dose_range_high_mg: 1650, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
          trigger:
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
          assert:
            - "RiskAssessment.${ra}.aggregate_score_additive == 1.76"
            - "RiskAssessment.${ra}.aggregate_score_max == 0.78"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: case_branch_and_retriage_cycle
        grounds:
          - state_machines.ExposureCase.TRIAGED_to_MONITORING
          - state_machines.ExposureCase.MONITORING_to_RETRIAGE
          - state_machines.RiskAssessment.FINALIZED_to_SUPERSEDED
        distinguishing_aspect: |
          ExposureCase is non-linear: TRIAGED branches to MONITORING vs REFERRED and
          MONITORING->RETRIAGE forms a cycle; adding a new exposure to a MONITORING case loops
          it back to RETRIAGE and supersedes the active assessment and disposition.
        test_recipe:
          setup:
            - "MODERATE case in MONITORING (est score 0.50) with a FINALIZED RiskAssessment, ACTIVE HOME Disposition, and scheduled follow-ups."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /protocols"
              payload: { risk_tier: "MODERATE", management_setting: "HOME", followup_count: 2, followup_interval_hours: 24, requires_toxicologist: false }
              as: SystemAdmin
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
            - call: "POST /risk-assessments/${ra}/finalize"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/dispositions"
              payload: { risk_assessment_id: "${ra}", disposition_type: "HOME_MANAGEMENT" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { disp: $.data.id }
          trigger:
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 400, dose_range_high_mg: 600, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
          assert:
            - "ExposureCase.${case}.status == RETRIAGE"
            - "RiskAssessment.${ra}.status == SUPERSEDED"
            - "Disposition.${disp}.status == SUPERSEDED"

      - name: followup_reschedule_cycle
        grounds:
          - state_machines.FollowUpCall.SCHEDULED_to_ATTEMPTED
          - state_machines.FollowUpCall.ATTEMPTED_to_SCHEDULED
          - entities.FollowUpCall.fields.attempt_count
        distinguishing_aspect: |
          FollowUpCall cycles SCHEDULED->ATTEMPTED->SCHEDULED: a call completed with NO_ANSWER
          while attempt_count < 3 reverts to SCHEDULED (re-window +6h); a non-linear machine on a
          different entity than the ExposureCase branch/cycle.
        test_recipe:
          setup:
            - "MODERATE case in MONITORING with auto-scheduled follow-up calls; first call captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /protocols"
              payload: { risk_tier: "MODERATE", management_setting: "HOME", followup_count: 2, followup_interval_hours: 24, requires_toxicologist: false }
              as: SystemAdmin
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
            - call: "POST /risk-assessments/${ra}/finalize"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/dispositions"
              payload: { risk_assessment_id: "${ra}", disposition_type: "HOME_MANAGEMENT" }
              as: Specialist
              as_user_id: "${spi}"
            - call: "GET /follow-up-calls?case_id=${case}"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { fu: "$.data[0].id" }
          trigger:
            - call: "POST /follow-up-calls/${fu}/attempt"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /follow-up-calls/${fu}/complete"
              payload: { outcome: "NO_ANSWER" }
              as: Specialist
              as_user_id: "${spi}"
          assert:
            - "FollowUpCall.${fu}.status == SCHEDULED (reverted from ATTEMPTED on NO_ANSWER)"
            - "FollowUpCall.${fu}.attempt_count == 1"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consult_close_cascade_depth3
        grounds:
          - state_machines.FacilityConsult.ACTIVE_to_CLOSED
          - calculations.exposure_toxicity_score
          - calculations.case_aggregate_risk
          - state_machines.ExposureCase.MONITORING_to_REFERRED
        distinguishing_aspect: |
          Closing a FacilityConsult cascades three caused hops: consult CLOSED -> exposure
          re-scored CONFIRMED (1.67) -> active RiskAssessment recomputed to CRITICAL -> case
          MONITORING->REFERRED with all follow-ups CANCELLED and pending_followup_count -> 0.
        test_recipe:
          setup:
            - "MODERATE case in MONITORING (est 0.50) with 2 scheduled follow-ups and an ACTIVE consult (facility capacity 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /protocols"
              payload: { risk_tier: "MODERATE", management_setting: "HOME", followup_count: 2, followup_interval_hours: 24, requires_toxicologist: false }
              as: SystemAdmin
            - call: "POST /healthcare-facilities"
              payload: { name: "Metro ED", facility_type: "ED", status: "ACCEPTING", consult_capacity: 2 }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Tara Tox", credential: "TOXICOLOGIST" }
              as: SystemAdmin
              captures: { tox: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
              captures: { exp: $.data.id }
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
            - call: "POST /risk-assessments/${ra}/finalize"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/dispositions"
              payload: { risk_assessment_id: "${ra}", disposition_type: "HOME_MANAGEMENT" }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /facility-consults"
              payload: { case_id: "${case}", facility_id: "${fac}", consult_duration_minutes: 90 }
              as: Toxicologist
              as_user_id: "${tox}"
              captures: { consult: $.data.id }
          trigger:
            - call: "POST /facility-consults/${consult}/close"
              payload: { confirmed_dose_mg: 5000 }
              as: Toxicologist
              as_user_id: "${tox}"
          assert:
            - "Exposure.${exp}.toxicity_score == 1.67"
            - "RiskAssessment.${ra}.risk_tier == CRITICAL"
            - "ExposureCase.${case}.status == REFERRED"
            - "ExposureCase.${case}.pending_followup_count == 0"

      - name: worsened_followup_cascade_depth2
        grounds:
          - state_machines.FollowUpCall.ATTEMPTED_to_COMPLETED
          - state_machines.ExposureCase.MONITORING_to_RETRIAGE
          - state_machines.RiskAssessment.FINALIZED_to_SUPERSEDED
        distinguishing_aspect: |
          Completing a FollowUpCall with outcome WORSENED cascades two caused hops from a
          different trigger than the consult-close chain: call COMPLETED -> case
          MONITORING->RETRIAGE -> active FINALIZED RiskAssessment and ACTIVE Disposition both
          ->SUPERSEDED.
        test_recipe:
          setup:
            - "MODERATE case in MONITORING with an auto-scheduled follow-up that has been ATTEMPTED once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /protocols"
              payload: { risk_tier: "MODERATE", management_setting: "HOME", followup_count: 2, followup_interval_hours: 24, requires_toxicologist: false }
              as: SystemAdmin
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
