              payload: { expected_lot_version: "${lotA_v} - 1" }
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 412; data.error_id == ERR_STALE_VERSION (stale lot version)."

      - name: version_increments_on_mutation
        claim_type: derived_field_reconciliation
        grounds: ["entities.Cohort.fields.cumulative_feed_kg"]
        distinguishing_aspect: "Cohort.version increments by 1 and cumulative_feed_kg reconciles to the sum of feed logs after each feeding."
        test_recipe:
          setup: ["Cohort C1 version 1, cumulative_feed_kg 0."]
          setup_api_calls:
            - call: "POST /species"
              payload: { common_name: "Atlantic Salmon", code: "SALM", target_market_weight_g: 5000, base_daily_growth_g: 5.0, default_processing_yield_pct: 0.62, min_water_temp_c: 2, max_water_temp_c: 18 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /tanks"
              payload: { name: "T1", kind: "TANK", volume_liters: 100000, max_biomass_kg: 100000 }
              as: FarmManager
              captures: { t1: $.data.id }
            - call: "POST /cohorts"
              payload: { label: "C1", species_id: "${sp}", current_tank_id: "${t1}", fish_count: 100, stocked_avg_weight_g: 50, stocked_at: "2026-01-01T00:00:00Z" }
              as: FarmTechnician
              captures: { c1: $.data.id }
            - call: "POST /cohorts/${c1}/feed-logs"
              payload: { fed_at: "2026-01-01T00:00:00Z", amount_kg: 10, feed_type: "starter" }
              as: FarmTechnician
          trigger:
            - call: "POST /cohorts/${c1}/feed-logs"
              payload: { fed_at: "2026-01-01T00:00:00Z", amount_kg: 15, feed_type: "grower" }
              as: FarmTechnician
            - call: "GET /cohorts/${c1}"
              payload: {}
              as: FarmTechnician
          assert:
            - "After two feedings, Cohort.cumulative_feed_kg == 25.00 and Cohort.version >= 3 (one bump per feed)."

