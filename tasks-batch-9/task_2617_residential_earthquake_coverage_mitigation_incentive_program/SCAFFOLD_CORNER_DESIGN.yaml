      - name: compensation_pattern_on_the_mitigation_discount_channel
        claim_type: compensation
        grounds:
          - state_machines.Policy.mitigation_status.DISCOUNT_APPLIED_to_UNMITIGATED
          - calculations.mitigation_discount_application
        excluded_because:
          difficulty_instance: premium_ledger_conservation_after_mitigation_discount_revocation
          rationale: "That §1.8 compensating_invariant instance already drives the full undo path - revoke-mitigation-discount from DISCOUNT_APPLIED back to UNMITIGATED - and asserts that mitigation_discount_cents, annual_premium_cents and prorated_credit_cents all return to their pre-discount values with no drift, while the Dwelling stays VERIFIED and the grant stays VERIFIED_COMPLETE. A second compensation test here would repeat the same call chain and the same literals."

      - name: cross_entity_side_effect_pattern_from_inspection_to_policy
        claim_type: cross_entity
        grounds:
          - state_machines.RetrofitProject.status.AWAITING_INSPECTION_to_VERIFIED
          - state_machines.Policy.mitigation_status.RETROFIT_VERIFIED_to_DISCOUNT_APPLIED
        excluded_because:
          difficulty_instance: inspection_pass_cascades_four_hops_from_inspection_to_policy_premium
          rationale: "The §1.8 transitive_cascade instance already verifies every cross-entity hop of the PASS cascade end to end - Inspection to RetrofitProject, then Dwelling and RetrofitGrant, then GrantCycle and Policy.mitigation_status, then the recomputed premium fields - asserting the state and the affected fields of each entity B. Re-testing one hop in isolation here adds no distinguishing coverage."

