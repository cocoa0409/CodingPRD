          trigger:
            - call: "POST /api/unavailability-windows/${win_id}/approve"
              as: SchedulerAdmin
              captures: { win_status: $.data.status }
            - call: "GET /api/call-assignments/${a_id}"
              as: SchedulerAdmin
              captures: { a_status: $.data.status }
            - call: "GET /api/call-slots/${slot_0909}"
              as: SchedulerAdmin
              captures: { slot_status: $.data.status }
            - call: "GET /api/coverage-gaps?slot_id=${slot_0909}"
              as: SchedulerAdmin
              captures: { gap_reason: $.data.0.reason, gap_status: $.data.0.status }
            - call: "GET /api/call-programs/${prog_id}"
