              captures: { hold_2: $.data.fiduciary_holding_minor }
            - call: "POST /fiduciary-transactions/${t3}/settle"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { t3_state: $.data.status }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { hold_3: $.data.fiduciary_holding_minor }
            - call: "GET /cedents/${ced_id}"
              payload: {}
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { ced_receipts: $.data.settled_receipts_minor, ced_reinst: $.data.outstanding_reinstatement_premium_minor }
