# ============================================================================
# SCAFFOLD.yaml — Transit Fare Enforcement & Proof of Payment
# §1.0 Response Envelope · §1.1 Entities · §1.2 State Machines
# §1.2.1 Concurrency Rules · §1.3 Calculations · §1.4 Validations
# §1.5 Endpoints · §1.6 Errors · §1.7 RBAC
# ============================================================================

scenario: |
  Generate task harder than expert level!

  2696. Transit Fare Enforcement & Proof of Payment (transit agency fare compliance):
  proof-of-payment zone designation and signage requirements, inspection deployment
  planning by line, time and evasion rate with random sampling design, inspection
  encounter workflow with fare media validation and identity handling, citation
  issuance versus warning policy with progressive penalties, administrative
  adjudication, payment plans and community service alternatives, decriminalization
  and equity analysis of citation distribution by demographic and geography, revenue
  recovery versus enforcement cost measurement, appeals process and citation
  dismissal criteria

domain_name: transit-fare-enforcement-pop
api_prefix: ""           # peer resources mounted at the root: /fare-zones, /citations, /appeals, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities joined by foreign keys; no nesting in URL paths except the two
  # reverse-reachability sub-resource reads (/fare-zones/{id}/signage-audits,
  # /citations/{id}/payments, /payment-plans/{id}/payments).

  state_machine_shape: parallel
  # Citation carries two independent state dimensions (adjudication_status ×
  # settlement_status). FareZone and Appeal are cyclic; InspectionEncounter is a
  # 4-way branch with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # FareZone -> InspectionDeployment, Citation -> PenaltyPayment
    - many_to_many         # FareZone <-> TransitLine via ZoneLineAssignment
    - self_referential     # Citation.reissued_from_citation_id -> Citation.id
    - cross_aggregate      # Appeal decision mutates Citation, PaymentPlan and PenaltyPayment

  role_model: segregation_of_duties
  # The HearingOfficer who decided a citation's administrative hearing may not
  # decide the appeal of that same hearing; enforcement planning, field inspection,
  # adjudication and appellate review are disjoint operation sets.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================

entities:

  - name: FareZone
    parent: null
    common_fields: true
    fields:
      - name: zone_code
        type: string
        source: input
        description: Unique proof-of-payment zone code printed on platform signage.
        constraints: "unique across all FareZone rows regardless of designation_status; 3-32 chars"
      - name: name
        type: string
        source: input
        description: Human-readable zone name.
      - name: required_sign_count
        type: integer
        source: input
        description: Number of proof-of-payment notices statute requires inside the zone.
        constraints: ">= 1"
      - name: verified_sign_count
        type: integer
        source: computed
        description: signs_verified_count of the latest SignageAudit for this zone; 0 when no audit exists.
        default: 0
      - name: signage_compliance_pct
        type: number
        source: computed
        description: verified_sign_count / required_sign_count per calculations.zone_signage_compliance_pct; 4 decimals.
        default: 0.0
      - name: penalty_multiplier_bps
        type: integer
        source: input
        description: Zone penalty scaling factor in basis points applied to the progressive base tier.
        default: 10000
        constraints: "10000 <= penalty_multiplier_bps <= 15000"
      - name: enforcement_policy
        type: enum
        source: input
        description: Citation-versus-warning policy in force inside this zone.
        default: CITATION_IMMEDIATE
        constraints: "one of {WARNING_FIRST, CITATION_IMMEDIATE}"
      - name: max_concurrent_deployments
        type: integer
        source: input
        description: Aggregate cap on InspectionDeployment rows whose closed windows intersect inside this zone.
        default: 2
        constraints: "1 <= max_concurrent_deployments <= 5"
      - name: designation_status
        type: enum
        source: system
        description: Zone designation lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_SIGNAGE, DESIGNATED, SUSPENDED, REVOKED}"
      - name: designated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent DESIGNATED entry; null before first designation.
      - name: suspension_reason
        type: enum
        source: system
        description: Why the zone left DESIGNATED.
        constraints: "one of {SIGNAGE_DEFICIENCY, ADMINISTRATIVE_HOLD} or null"

  - name: TransitLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: Unique line identifier as published to riders.
        constraints: "unique across all TransitLine rows"
      - name: mode
        type: enum
        source: input
        description: Service mode of the line.
        constraints: "one of {BUS, LIGHT_RAIL, COMMUTER_RAIL, STREETCAR}"
      - name: daily_boardings
        type: integer
        source: input
        description: Average weekday boardings used as the sampling-frame size.
        constraints: ">= 1"
      - name: baseline_evasion_rate_bps
        type: integer
        source: input
        description: Prior-survey evasion rate in basis points used to size the random sample.
        constraints: "0 <= baseline_evasion_rate_bps <= 10000"

  - name: ZoneLineAssignment
    parent: null
    common_fields: false
    fields:
      - name: zone_id
        type: string
        source: input
        description: FK -> FareZone.id; the proof-of-payment zone this line segment sits inside.
      - name: line_id
        type: string
        source: input
        description: FK -> TransitLine.id; the line whose platforms carry the zone signage.
      - name: platform_segment_count
        type: integer
        source: input
        description: Number of platform segments of this line inside the zone.
        constraints: ">= 1"
      - name: effective_from
        type: datetime
        source: input
        description: Instant from which the line is enforceable inside the zone (inclusive).

  - name: SignageAudit
    parent: null
    common_fields: false
    fields:
      - name: zone_id
        type: string
        source: input
        description: FK -> FareZone.id; the zone whose notices were counted.
      - name: audited_at
        type: datetime
        source: input
        description: Instant the physical count was taken; drives latest-audit selection.
      - name: signs_verified_count
        type: integer
        source: input
        description: Compliant proof-of-payment notices physically verified during this audit.
        constraints: ">= 0"
      - name: deficiency_note
        type: string
        source: input
        description: Free-text description of missing or illegible notices.
      - name: auditor_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the EnforcementPlanner who filed the audit; not an entity id.

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: badge_number
        type: string
        source: input
        description: Unique badge number of the fare inspector.
        constraints: "unique across all Inspector rows"
      - name: display_name
        type: string
        source: input
        description: Inspector name printed on citations.
      - name: certification_expiry
        type: datetime
        source: input
        description: Instant the inspector's fare-enforcement certification lapses (exclusive upper bound of validity).
      - name: status
        type: enum
        source: input
        description: Duty status of the inspector.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: citations_issued_count
        type: integer
        source: computed
        description: Count of Citation rows with issuing_inspector_id == this id and adjudication_status IN {ISSUED, CONTESTED, UPHELD, REDUCED}.
        default: 0

  - name: Rider
    parent: null
    common_fields: true
    fields:
      - name: rider_ref
        type: string
        source: input
        description: Unique agency reference for the rider record.
        constraints: "unique across all Rider rows"
      - name: display_name
        type: string
        source: input
        description: Rider name as recorded during identity capture.
      - name: demographic_band
        type: enum
        source: input
        description: Self-reported demographic band used only for aggregate equity analysis.
        constraints: "one of {BAND_A, BAND_B, BAND_C, BAND_D, UNDISCLOSED}"
      - name: residence_geo_tract
        type: string
        source: input
        description: Census tract code of the rider's residence used for geographic equity analysis.
      - name: fare_assistance_enrolled
        type: boolean
        source: input
        description: True when the rider is enrolled in the reduced-fare assistance program.
        default: false
      - name: prior_warning_count
        type: integer
        source: computed
        description: Count of InspectionEncounter rows with rider_id == this id and outcome == WARNING_ISSUED.
        default: 0
      - name: prior_citation_count
        type: integer
        source: computed
        description: Count of Citation rows with rider_id == this id and adjudication_status IN {ISSUED, CONTESTED, UPHELD, REDUCED}.
        default: 0

  - name: InspectionDeployment
    parent: null
    common_fields: true
    fields:
      - name: line_id
        type: string
        source: input
        description: FK -> TransitLine.id; the line the inspection team is deployed on.
      - name: zone_id
        type: string
        source: input
        description: FK -> FareZone.id; the proof-of-payment zone the deployment enforces.
      - name: window_start
        type: datetime
        source: input
        description: Inclusive start of the deployment window.
      - name: window_end
        type: datetime
        source: input
        description: Exclusive end of the deployment window; must be > window_start and whole minutes apart.
      - name: planned_inspector_count
        type: integer
        source: input
        description: Number of inspectors funded for the window; drives enforcement cost.
        constraints: "1 <= planned_inspector_count <= 20"
      - name: sampling_method
        type: enum
        source: input
        description: Random sampling design used to select riders for inspection.
        constraints: "one of {SYSTEMATIC_INTERVAL, CLUSTER_RANDOM, STRATIFIED_TIME}"
      - name: target_sample_size
        type: integer
        source: input
        description: Sample size the design requires for a statistically usable evasion estimate.
        constraints: ">= 1"
      - name: achieved_sample_count
        type: integer
        source: computed
        description: Count of InspectionEncounter rows with deployment_id == this id and outcome != VOIDED.
        default: 0
      - name: voided_encounter_count
        type: integer
        source: computed
        description: Count of InspectionEncounter rows with deployment_id == this id and outcome == VOIDED.
        default: 0
      - name: sample_adequacy_ratio
        type: number
        source: computed
        description: achieved_sample_count / target_sample_size per calculations.deployment_sample_adequacy_ratio; 4 decimals.
        default: 0.0
      - name: measured_evasion_rate_bps
        type: integer
        source: computed
        description: Evasion rate in bps under the encounter_denominator variant; written at CLOSED. Null before close.
      - name: resolved_evasion_rate_bps
        type: integer
        source: computed
        description: Evasion rate in bps under the resolved_denominator variant; written at CLOSED. Null before close.
      - name: enforcement_cost_cents
        type: integer
        source: computed
        description: Labour plus zone premium per calculations.deployment_enforcement_cost_cents; written at CLOSED. Null before close.
      - name: status
        type: enum
        source: system
        description: Deployment lifecycle state.
        default: PLANNED
        constraints: "one of {PLANNED, ACTIVE, CLOSED, VOIDED}"
      - name: void_reason
        type: enum
        source: system
        description: Why the deployment was voided.
        constraints: "one of {ZONE_SUSPENDED, PLANNER_CANCELLED} or null"

  - name: InspectionEncounter
    parent: null
    common_fields: true
    fields:
      - name: deployment_id
        type: string
        source: input
        description: FK -> InspectionDeployment.id; the deployment this encounter was sampled under.
      - name: inspector_id
        type: string
        source: input
        description: FK -> Inspector.id; the inspector who conducted the encounter.
      - name: rider_id
        type: string
        source: input
        description: FK -> Rider.id; null when identity_capture_method == REFUSED.
      - name: occurred_at
        type: datetime
        source: input
        description: Instant of the encounter; must satisfy window_start <= occurred_at < window_end and occurred_at <= logical clock.
      - name: fare_media_type
        type: enum
        source: input
        description: Class of proof of payment the rider presented.
        constraints: "one of {SMARTCARD, MOBILE_QR, PAPER_TRANSFER, CASH_RECEIPT, NONE}"
      - name: media_reference
        type: string
        source: input
        description: Serial, token or receipt number of the presented media; null when fare_media_type == NONE.
      - name: media_validated_at
        type: datetime
        source: input
        description: Instant the media was tapped/validated; null means no validation record exists.
      - name: media_expires_at
        type: datetime
        source: input
        description: Instant the presented media stops being valid; null means the media carries no expiry record.
      - name: media_zone_code
        type: string
        source: input
        description: Zone code the presented media was sold for; compared against the deployment zone's zone_code.
      - name: identity_capture_method
        type: enum
        source: input
        description: How the rider's identity was established during the encounter.
        constraints: "one of {GOVT_ID, SELF_REPORTED, REFUSED}"
      - name: validation_result
        type: enum
        source: computed
        description: Fare-media verdict per calculations.encounter_validation_result.
        constraints: "one of {VALID, EXPIRED, UNVALIDATED_TAP, WRONG_ZONE, NO_PROOF}"
      - name: outcome
        type: enum
        source: system
        description: Encounter disposition.
        default: PENDING
        constraints: "one of {PENDING, COMPLIANT, WARNING_ISSUED, CITATION_ISSUED, UNRESOLVED_IDENTITY, VOIDED}"

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - name: encounter_id
        type: string
        source: input
        description: FK -> InspectionEncounter.id; the encounter this citation was written from.
      - name: rider_id
        type: string
        source: system
        description: FK -> Rider.id; copied from the encounter at issuance.
      - name: zone_id
        type: string
        source: system
        description: FK -> FareZone.id; copied from the encounter's deployment at issuance.
      - name: issuing_inspector_id
        type: string
        source: system
        description: FK -> Inspector.id; copied from the encounter at issuance.
      - name: reissued_from_citation_id
        type: string
        source: system
        description: FK -> Citation.id; set only on citations minted by POST /citations/{id}/reissue; null otherwise.
      - name: issued_at
        type: datetime
        source: system
        description: Logical-clock instant of issuance; a reissued citation inherits the original citation's issued_at.
      - name: offense_sequence
        type: integer
        source: computed
        description: Progressive ladder position under the warning_inclusive variant of calculations.citation_offense_sequence.
      - name: citation_only_sequence
        type: integer
        source: computed
        description: Progressive ladder position under the citation_only variant of calculations.citation_offense_sequence.
      - name: assessed_penalty_cents
        type: integer
        source: computed
        description: Penalty assessed at issuance per calculations.citation_assessed_penalty_cents using offense_sequence.
      - name: reduction_floor_cents
        type: integer
        source: computed
        description: Lowest penalty an adjudicator may reduce to; same formula evaluated with citation_only_sequence.
      - name: admin_fee_cents
        type: integer
        source: computed
        description: Administrative fee per calculations.citation_admin_fee_cents; tier keyed on assessed_penalty_cents.
      - name: total_due_cents
        type: integer
        source: computed
        description: assessed_penalty_cents + admin_fee_cents.
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Sum of PenaltyPayment.amount_cents for this citation with source IN {DOWN_PAYMENT, PLAN_INSTALLMENT, DIRECT} minus those with source == DISMISSAL_REVERSAL.
        default: 0
      - name: service_credit_cents
        type: integer
        source: computed
        description: Sum of PenaltyPayment.amount_cents for this citation with source == SERVICE_CREDIT.
        default: 0
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: total_due_cents - amount_paid_cents - service_credit_cents; floored at 0 and 0 whenever settlement_status IN {SATISFIED, WRITTEN_OFF}.
      - name: contest_deadline_at
        type: datetime
        source: computed
        description: issued_at + CONTEST_WINDOW_DAYS days; inclusive last instant a hearing may be requested.
      - name: adjudication_status
        type: enum
        source: system
        description: Adjudication dimension of the parallel state machine.
        default: ISSUED
        constraints: "one of {ISSUED, CONTESTED, UPHELD, REDUCED, DISMISSED, VOID}"
      - name: settlement_status
        type: enum
        source: system
        description: Settlement dimension of the parallel state machine; evolves independently of adjudication_status.
        default: OUTSTANDING
        constraints: "one of {OUTSTANDING, PLAN_ACTIVE, SERVICE_ACTIVE, SATISFIED, WRITTEN_OFF}"
      - name: dismissal_reason_code
        type: enum
        source: system
        description: Reason recorded when adjudication_status becomes DISMISSED or VOID; null otherwise.
        constraints: "one of {SIGNAGE_DEFICIENT, VALID_FARE_PRESENTED, IDENTITY_ERROR, ZONE_NOT_DESIGNATED, FIRST_OFFENSE_DIVERSION, PROCEDURAL_DEFECT} or null"
      - name: dismissed_at
        type: datetime
        source: system
        description: Logical-clock instant adjudication_status became DISMISSED or VOID; null otherwise.

  - name: AdjudicationHearing
    parent: null
    common_fields: true
    fields:
      - name: citation_id
        type: string
        source: input
        description: FK -> Citation.id; the contested citation.
      - name: requested_by_rider_id
        type: string
        source: system
        description: FK -> Rider.id; the rider who requested the hearing.
      - name: scheduled_for
        type: datetime
        source: computed
        description: Logical clock at contest time + HEARING_LEAD_DAYS days.
      - name: hearing_officer_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the HearingOfficer who recorded the decision; null while SCHEDULED.
      - name: decision
        type: enum
        source: system
        description: Administrative decision recorded at the hearing.
        default: PENDING
        constraints: "one of {PENDING, UPHOLD, DISMISS, REDUCE}"
      - name: dismissal_reason_code
        type: enum
        source: input
        description: Required when decision == DISMISS; forbidden for UPHOLD and REDUCE.
        constraints: "one of {SIGNAGE_DEFICIENT, VALID_FARE_PRESENTED, IDENTITY_ERROR, ZONE_NOT_DESIGNATED, FIRST_OFFENSE_DIVERSION, PROCEDURAL_DEFECT} or null"
      - name: reduced_penalty_cents
        type: integer
        source: input
        description: Required when decision == REDUCE; must satisfy citation.reduction_floor_cents <= value < citation.assessed_penalty_cents.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant the decision was recorded; starts the appeal window.
      - name: status
        type: enum
        source: system
        description: Hearing lifecycle state.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, HELD, CANCELLED}"

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - name: citation_id
        type: string
        source: input
        description: FK -> Citation.id; the citation under appellate review.
      - name: hearing_id
        type: string
        source: input
        description: FK -> AdjudicationHearing.id; the HELD hearing being appealed; must reference the same citation_id.
      - name: appellant_rider_id
        type: string
        source: system
        description: FK -> Rider.id; copied from citation.rider_id at filing.
      - name: grounds_code
        type: enum
        source: input
        description: Statutory ground asserted by the appellant.
        constraints: "one of {SIGNAGE_DEFICIENCY, IDENTITY_ERROR, VALID_FARE_EVIDENCE, PROCEDURAL_DEFECT, HARDSHIP}"
      - name: statement
        type: string
        source: input
        description: Appellant's written statement for the current round.
      - name: round_index
        type: integer
        source: system
        description: 1 on filing; incremented on each resubmission after a supplement request.
        default: 1
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the current round's submission.
      - name: supplement_deadline_at
        type: datetime
        source: system
        description: submitted_at of the supplement request + SUPPLEMENT_WINDOW_DAYS days; null unless status == SUPPLEMENT_REQUESTED.
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the AppealsBoardMember who decided; null while undecided.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant the appeal was granted or denied.
      - name: dismissal_reason_code
        type: enum
        source: input
        description: Required when decision == GRANTED; written onto the citation as its dismissal reason.
        constraints: "one of {SIGNAGE_DEFICIENT, VALID_FARE_PRESENTED, IDENTITY_ERROR, ZONE_NOT_DESIGNATED, FIRST_OFFENSE_DIVERSION, PROCEDURAL_DEFECT} or null"
      - name: status
        type: enum
        source: system
        description: Appeal lifecycle state; SUBMITTED and SUPPLEMENT_REQUESTED form a cycle.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, SUPPLEMENT_REQUESTED, GRANTED, DENIED, WITHDRAWN}"

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - name: citation_id
        type: string
        source: input
        description: FK -> Citation.id; the citation being financed.
      - name: installment_count
        type: integer
        source: input
        description: Number of scheduled installments after the down payment.
        constraints: "PLAN_MIN_INSTALLMENTS <= installment_count <= PLAN_MAX_INSTALLMENTS"
      - name: down_payment_cents
        type: integer
        source: input
        description: Amount collected at plan creation; must be >= the minimum down payment.
        constraints: ">= 0 and < citation.outstanding_balance_cents"
      - name: financed_cents
        type: integer
        source: computed
        description: citation.outstanding_balance_cents at creation minus down_payment_cents.
      - name: base_installment_cents
        type: integer
        source: computed
        description: floor(financed_cents / installment_count) per calculations.payment_plan_schedule.
      - name: final_installment_cents
        type: integer
        source: computed
        description: base_installment_cents + (financed_cents - base_installment_cents * installment_count).
      - name: first_due_at
        type: datetime
        source: computed
        description: Plan created_at + INSTALLMENT_INTERVAL_DAYS days.
      - name: installments_paid_count
        type: integer
        source: computed
        description: Count of PenaltyPayment rows with plan_id == this id and source == PLAN_INSTALLMENT.
        default: 0
      - name: missed_installment_count
        type: integer
        source: computed
        description: Installments whose due instant is <= the logical clock and which remain unpaid, per calculations.plan_delinquency_assessment.
        default: 0
      - name: remaining_balance_cents
        type: integer
        source: computed
        description: financed_cents minus the sum of PenaltyPayment.amount_cents with plan_id == this id and source == PLAN_INSTALLMENT.
      - name: status
        type: enum
        source: system
        description: Plan lifecycle state.
        default: ACTIVE
        constraints: "one of {ACTIVE, COMPLETED, DEFAULTED, CANCELLED}"

  - name: CommunityServiceAssignment
    parent: null
    common_fields: true
    fields:
      - name: citation_id
        type: string
        source: input
        description: FK -> Citation.id; the citation being worked off.
      - name: partner_org_name
        type: string
        source: input
        description: Name of the community partner supervising the service.
      - name: required_hours
        type: integer
        source: computed
        description: ceil(citation.outstanding_balance_cents / SERVICE_CREDIT_CENTS_PER_HOUR) at creation.
      - name: hours_completed
        type: integer
        source: computed
        description: Sum of hours logged through POST /community-service-assignments/{id}/log-hours.
        default: 0
      - name: credited_cents
        type: integer
        source: computed
        description: Sum of PenaltyPayment.amount_cents with source == SERVICE_CREDIT for this assignment's citation.
        default: 0
      - name: status
        type: enum
        source: system
        description: Assignment lifecycle state.
        default: ACTIVE
        constraints: "one of {ACTIVE, COMPLETED, FORFEITED, CANCELLED}"

  - name: PenaltyPayment
    parent: null
    common_fields: false
    fields:
      - name: citation_id
        type: string
        source: system
        description: FK -> Citation.id; the citation this ledger row settles or reverses.
      - name: plan_id
        type: string
        source: system
        description: FK -> PaymentPlan.id; set for DOWN_PAYMENT and PLAN_INSTALLMENT rows, null otherwise.
      - name: amount_cents
        type: integer
        source: system
        description: Positive magnitude of the ledger row; DISMISSAL_REVERSAL rows are subtracted by the ledger.
        constraints: "> 0"
      - name: source
        type: enum
        source: system
        description: Which action produced this ledger row.
        constraints: "one of {DOWN_PAYMENT, PLAN_INSTALLMENT, DIRECT, SERVICE_CREDIT, DISMISSAL_REVERSAL}"
      - name: hours_credited
        type: integer
        source: system
        description: Service hours that produced this row; 0 unless source == SERVICE_CREDIT.
        default: 0
      - name: applied_at
        type: datetime
        source: system
        description: Logical-clock instant the row was applied; used by the cash-basis revenue report window.

# ============================================================================
# §1.2 State Machine Table
# ============================================================================

state_machines:

  - entity: FareZone
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNAGE
        trigger: "POST /fare-zones/{id}/submit-for-signage"
        actor: EnforcementPlanner
        preconditions:
          - "zone.designation_status == DRAFT"
          - "at least one ZoneLineAssignment row exists with zone_id == zone.id"
        side_effects:
          - "designation_status := PENDING_SIGNAGE"
          - "suspension_reason := null"
          - "increments FareZone.version by 1 and refreshes updated_at"
      - from: SUSPENDED
        to: PENDING_SIGNAGE
        trigger: "POST /fare-zones/{id}/submit-for-signage"
        actor: EnforcementPlanner
        preconditions:
          - "zone.designation_status == SUSPENDED"
        side_effects:
          - "designation_status := PENDING_SIGNAGE"
          - "suspension_reason := null"
          - "increments FareZone.version by 1 and refreshes updated_at"
        note: "Cyclic arm — a suspended zone re-enters the signage queue and can be designated again."
      - from: PENDING_SIGNAGE
        to: DESIGNATED
        trigger: "POST /fare-zones/{id}/designate"
        actor: EnforcementPlanner
        preconditions:
          - "zone.designation_status == PENDING_SIGNAGE"
          - "at least one SignageAudit row exists with zone_id == zone.id"
          - "zone.signage_compliance_pct >= SIGNAGE_MIN_PCT (0.9000)"
        side_effects:
          - "designation_status := DESIGNATED"
          - "designated_at := logical clock"
          - "increments FareZone.version by 1 and refreshes updated_at"
      - from: DESIGNATED
        to: SUSPENDED
        trigger: "POST /fare-zones/{id}/suspend"
        actor: EnforcementPlanner
        preconditions:
          - "zone.designation_status == DESIGNATED"
        side_effects:
          - "designation_status := SUSPENDED, suspension_reason := ADMINISTRATIVE_HOLD"
          - "CASCADE link 1: every InspectionDeployment with zone_id == zone.id and status IN {PLANNED, ACTIVE} transitions to VOIDED with void_reason := ZONE_SUSPENDED"
          - "CASCADE link 2 (caused by link 1): every InspectionEncounter with deployment_id == a deployment voided by link 1 and outcome == PENDING transitions to VOIDED"
          - "CASCADE link 3 (caused by link 2): each such deployment recomputes achieved_sample_count, voided_encounter_count and sample_adequacy_ratio"
          - "increments FareZone.version by 1"
      - from: DESIGNATED
        to: SUSPENDED
        trigger: "system event: POST /signage-audits lands a latest audit that drops signage_compliance_pct below SIGNAGE_MIN_PCT"
        actor: system
        preconditions:
          - "zone.designation_status == DESIGNATED"
          - "recomputed zone.signage_compliance_pct < 0.9000"
        side_effects:
          - "designation_status := SUSPENDED, suspension_reason := SIGNAGE_DEFICIENCY"
          - "CASCADE link 1: every InspectionDeployment with zone_id == zone.id and status IN {PLANNED, ACTIVE} transitions to VOIDED with void_reason := ZONE_SUSPENDED"
          - "CASCADE link 2 (caused by link 1): every InspectionEncounter with deployment_id == a deployment voided by link 1 and outcome == PENDING transitions to VOIDED"
          - "CASCADE link 3 (caused by link 2): each such deployment recomputes achieved_sample_count, voided_encounter_count and sample_adequacy_ratio"
          - "increments FareZone.version by 1"
        note: "Automatic transition — no operator call; fires inside the POST /signage-audits request."
      - from: DESIGNATED
        to: REVOKED
        trigger: "POST /fare-zones/{id}/revoke"
        actor: EnforcementPlanner
        preconditions:
          - "zone.designation_status IN {DESIGNATED, SUSPENDED}"
        side_effects:
          - "designation_status := REVOKED"
          - "every InspectionDeployment with zone_id == zone.id and status IN {PLANNED, ACTIVE} transitions to VOIDED with void_reason := ZONE_SUSPENDED"
          - "CASCADE link 1: every Citation with zone_id == zone.id and adjudication_status IN {ISSUED, CONTESTED} transitions adjudication_status := VOID, dismissal_reason_code := ZONE_NOT_DESIGNATED, dismissed_at := logical clock"
          - "CASCADE link 2 (caused by link 1): each such citation's settlement_status transitions to WRITTEN_OFF, and every PaymentPlan with that citation_id and status == ACTIVE transitions to CANCELLED, and every CommunityServiceAssignment with that citation_id and status == ACTIVE transitions to CANCELLED"
          - "CASCADE link 3 (caused by link 2): for each citation whose settlement_status became WRITTEN_OFF with amount_paid_cents > 0, a PenaltyPayment row is appended with source := DISMISSAL_REVERSAL, amount_cents := the pre-cascade amount_paid_cents, plan_id := null, applied_at := logical clock, driving amount_paid_cents to 0"
          - "Rider.prior_citation_count and Inspector.citations_issued_count are recomputed for every citation touched by link 1"
          - "increments FareZone.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /fare-zones/{id}/revoke"
        actor: EnforcementPlanner
        preconditions:
          - "zone.designation_status IN {DESIGNATED, SUSPENDED}"
        side_effects:
          - "identical cascade to the DESIGNATED -> REVOKED transition"
          - "increments FareZone.version by 1"

  - entity: InspectionDeployment
    initial_state: PLANNED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /inspection-deployments/{id}/activate"
        actor: EnforcementPlanner
        preconditions:
          - "deployment.status == PLANNED"
          - "the FareZone referenced by deployment.zone_id has designation_status == DESIGNATED (cross-entity)"
          - "logical clock >= deployment.window_start"
        side_effects:
          - "status := ACTIVE"
          - "increments InspectionDeployment.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /inspection-deployments/{id}/close"
        actor: EnforcementPlanner
        preconditions:
          - "deployment.status == ACTIVE"
          - "no InspectionEncounter with deployment_id == deployment.id has outcome == PENDING"
          - "deployment.sample_adequacy_ratio >= SAMPLE_ADEQUACY_MIN (0.8000)"
        side_effects:
          - "status := CLOSED"
          - "measured_evasion_rate_bps := calculations.deployment_evasion_rate_bps variant encounter_denominator"
          - "resolved_evasion_rate_bps := calculations.deployment_evasion_rate_bps variant resolved_denominator"
          - "enforcement_cost_cents := calculations.deployment_enforcement_cost_cents"
          - "increments InspectionDeployment.version by 1"
      - from: PLANNED
        to: VOIDED
        trigger: "POST /inspection-deployments/{id}/void"
        actor: EnforcementPlanner
        preconditions:
          - "deployment.status IN {PLANNED, ACTIVE}"
        side_effects:
          - "status := VOIDED, void_reason := PLANNER_CANCELLED"
          - "every InspectionEncounter with deployment_id == deployment.id and outcome == PENDING transitions to VOIDED"
          - "achieved_sample_count, voided_encounter_count and sample_adequacy_ratio recomputed"
          - "increments InspectionDeployment.version by 1"
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /inspection-deployments/{id}/void"
        actor: EnforcementPlanner
        preconditions:
          - "deployment.status IN {PLANNED, ACTIVE}"
        side_effects:
          - "status := VOIDED, void_reason := PLANNER_CANCELLED"
          - "every InspectionEncounter with deployment_id == deployment.id and outcome == PENDING transitions to VOIDED"
          - "achieved_sample_count, voided_encounter_count and sample_adequacy_ratio recomputed"
          - "increments InspectionDeployment.version by 1"
      - from: PLANNED
        to: VOIDED
        trigger: "system event: the FareZone referenced by zone_id leaves DESIGNATED (suspend, signage-driven suspension, or revoke)"
        actor: system
        preconditions:
          - "deployment.status IN {PLANNED, ACTIVE}"
        side_effects:
          - "status := VOIDED, void_reason := ZONE_SUSPENDED"
          - "every InspectionEncounter with deployment_id == deployment.id and outcome == PENDING transitions to VOIDED"
          - "achieved_sample_count, voided_encounter_count and sample_adequacy_ratio recomputed"
        note: "Automatic middle link of the zone-suspension cascade."

  - entity: InspectionEncounter
    initial_state: PENDING
    terminal_states: [COMPLIANT, WARNING_ISSUED, CITATION_ISSUED, UNRESOLVED_IDENTITY, VOIDED]
    transitions:
      - from: PENDING
        to: COMPLIANT
        trigger: "POST /inspection-encounters/{id}/resolve with disposition == COMPLIANT"
        actor: FareInspector
        preconditions:
          - "encounter.outcome == PENDING"
          - "encounter.validation_result == VALID"
          - "the acting FareInspector's X-User-ID equals encounter.inspector_id"
        side_effects:
          - "outcome := COMPLIANT"
          - "increments InspectionEncounter.version by 1"
        note: "Branch 1 of the 4-way fork — no rider counters change."
      - from: PENDING
        to: WARNING_ISSUED
        trigger: "POST /inspection-encounters/{id}/resolve with disposition == WARNING_ISSUED"
        actor: FareInspector
        preconditions:
          - "encounter.outcome == PENDING"
          - "encounter.validation_result IN {EXPIRED, UNVALIDATED_TAP, WRONG_ZONE, NO_PROOF}"
          - "encounter.rider_id is not null"
          - "the acting FareInspector's X-User-ID equals encounter.inspector_id"
        side_effects:
          - "outcome := WARNING_ISSUED"
          - "Rider.prior_warning_count recomputed for encounter.rider_id (cross-entity)"
          - "increments InspectionEncounter.version by 1"
        note: "Branch 2 — the only branch that raises the warning-inclusive ladder for future citations."
      - from: PENDING
        to: UNRESOLVED_IDENTITY
        trigger: "POST /inspection-encounters/{id}/resolve with disposition == UNRESOLVED_IDENTITY"
        actor: FareInspector
        preconditions:
          - "encounter.outcome == PENDING"
          - "encounter.identity_capture_method == REFUSED"
          - "the acting FareInspector's X-User-ID equals encounter.inspector_id"
        side_effects:
          - "outcome := UNRESOLVED_IDENTITY"
          - "increments InspectionEncounter.version by 1"
        note: "Branch 3 — counted in the encounter_denominator evasion variant, excluded from the resolved_denominator variant."
      - from: PENDING
        to: CITATION_ISSUED
        trigger: "POST /citations"
        actor: FareInspector
        preconditions:
          - "encounter.outcome == PENDING"
          - "encounter.validation_result IN {EXPIRED, UNVALIDATED_TAP, WRONG_ZONE, NO_PROOF}"
          - "encounter.rider_id is not null and encounter.identity_capture_method IN {GOVT_ID, SELF_REPORTED}"
          - "the FareZone of the encounter's deployment has designation_status == DESIGNATED"
          - "when that zone's enforcement_policy == WARNING_FIRST, the warning_inclusive offense_sequence for this rider is >= 2"
        side_effects:
          - "outcome := CITATION_ISSUED"
          - "a Citation row is created in adjudication_status ISSUED and settlement_status OUTSTANDING"
          - "Rider.prior_citation_count and Inspector.citations_issued_count recomputed"
          - "increments InspectionEncounter.version by 1"
        note: "Branch 4 — the only branch that mints a Citation."
      - from: PENDING
        to: VOIDED
        trigger: "system event: the parent InspectionDeployment transitions to VOIDED"
        actor: system
        preconditions:
          - "encounter.outcome == PENDING"
        side_effects:
          - "outcome := VOIDED"
          - "parent deployment recomputes achieved_sample_count and voided_encounter_count"
        note: "Automatic terminal link of the zone-suspension cascade."

  - entity: Citation
    dimension: adjudication_status
    initial_state: ISSUED
    terminal_states: [DISMISSED, VOID]
    transitions:
      - from: ISSUED
        to: CONTESTED
        trigger: "POST /citations/{id}/contest"
        actor: Rider
        preconditions:
          - "citation.adjudication_status == ISSUED"
          - "logical clock <= citation.contest_deadline_at"
          - "citation.rider_id == acting Rider's X-User-ID"
          - "no AdjudicationHearing with this citation_id has status == SCHEDULED"
        side_effects:
          - "adjudication_status := CONTESTED"
          - "an AdjudicationHearing row is created with status SCHEDULED, decision PENDING, scheduled_for := logical clock + HEARING_LEAD_DAYS"
          - "increments Citation.version by 1"
      - from: CONTESTED
        to: ISSUED
        trigger: "POST /adjudication-hearings/{id}/cancel"
        actor: HearingOfficer
        preconditions:
          - "hearing.status == SCHEDULED"
          - "citation.adjudication_status == CONTESTED"
        side_effects:
          - "hearing.status := CANCELLED"
          - "adjudication_status := ISSUED (revert arm)"
          - "increments Citation.version by 1"
      - from: CONTESTED
        to: UPHELD
        trigger: "POST /adjudication-hearings/{id}/decide with decision == UPHOLD"
        actor: HearingOfficer
        preconditions:
          - "hearing.status == SCHEDULED and citation.adjudication_status == CONTESTED"
        side_effects:
          - "adjudication_status := UPHELD"
          - "hearing.status := HELD, hearing.decision := UPHOLD, hearing.decided_at := logical clock, hearing.hearing_officer_user_id := acting X-User-ID"
          - "increments Citation.version by 1"
      - from: CONTESTED
        to: REDUCED
        trigger: "POST /adjudication-hearings/{id}/decide with decision == REDUCE"
        actor: HearingOfficer
        preconditions:
          - "hearing.status == SCHEDULED and citation.adjudication_status == CONTESTED"
          - "citation.reduction_floor_cents <= reduced_penalty_cents < citation.assessed_penalty_cents"
        side_effects:
          - "adjudication_status := REDUCED"
          - "assessed_penalty_cents := reduced_penalty_cents; admin_fee_cents, total_due_cents and outstanding_balance_cents recomputed per calculations.citation_admin_fee_cents"
          - "hearing.status := HELD, hearing.decision := REDUCE, hearing.decided_at := logical clock, hearing.hearing_officer_user_id := acting X-User-ID"
          - "increments Citation.version by 1"
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /adjudication-hearings/{id}/decide with decision == DISMISS"
        actor: HearingOfficer
        preconditions:
          - "hearing.status == SCHEDULED and citation.adjudication_status == CONTESTED"
          - "dismissal_reason_code is present"
          - "when dismissal_reason_code == FIRST_OFFENSE_DIVERSION, citation.offense_sequence == 1"
        side_effects:
          - "adjudication_status := DISMISSED, dismissal_reason_code := input reason, dismissed_at := logical clock"
          - "CASCADE link 2 (caused by the dismissal): settlement_status := WRITTEN_OFF; every PaymentPlan with this citation_id and status == ACTIVE transitions to CANCELLED; every CommunityServiceAssignment with this citation_id and status == ACTIVE transitions to CANCELLED"
          - "CASCADE link 3 (caused by link 2): when the pre-cascade amount_paid_cents > 0, a PenaltyPayment row is appended with source := DISMISSAL_REVERSAL, amount_cents := pre-cascade amount_paid_cents, plan_id := null, applied_at := logical clock, driving amount_paid_cents to 0"
          - "Rider.prior_citation_count and Inspector.citations_issued_count recomputed"
          - "hearing.status := HELD, hearing.decision := DISMISS, hearing.decided_at := logical clock, hearing.hearing_officer_user_id := acting X-User-ID"
          - "increments Citation.version by 1"
      - from: UPHELD
        to: DISMISSED
        trigger: "POST /appeals/{id}/decide with decision == GRANTED"
        actor: AppealsBoardMember
        preconditions:
          - "appeal.status IN {SUBMITTED, SUPPLEMENT_REQUESTED}"
          - "citation.adjudication_status IN {UPHELD, REDUCED}"
          - "acting X-User-ID != the hearing's hearing_officer_user_id (segregation of duties)"
        side_effects:
          - "CASCADE link 1: appeal.status := GRANTED, appeal.decided_at := logical clock, appeal.decided_by_user_id := acting X-User-ID"
          - "CASCADE link 2 (caused by link 1): adjudication_status := DISMISSED, dismissal_reason_code := appeal.dismissal_reason_code, dismissed_at := logical clock"
          - "CASCADE link 3 (caused by link 2): settlement_status := WRITTEN_OFF; every ACTIVE PaymentPlan for this citation transitions to CANCELLED; every ACTIVE CommunityServiceAssignment for this citation transitions to CANCELLED"
          - "CASCADE link 4 (caused by link 3): when the pre-cascade amount_paid_cents > 0, a PenaltyPayment row is appended with source := DISMISSAL_REVERSAL, amount_cents := pre-cascade amount_paid_cents, plan_id := null, applied_at := logical clock, driving amount_paid_cents to 0"
          - "Rider.prior_citation_count and Inspector.citations_issued_count recomputed"
          - "increments Citation.version by 1"
      - from: REDUCED
        to: DISMISSED
        trigger: "POST /appeals/{id}/decide with decision == GRANTED"
        actor: AppealsBoardMember
        preconditions:
          - "identical to the UPHELD -> DISMISSED arm"
        side_effects:
          - "identical four-link cascade to the UPHELD -> DISMISSED arm"
      - from: ISSUED
        to: VOID
        trigger: "system event: POST /fare-zones/{id}/revoke on the citation's zone"
        actor: system
        preconditions:
          - "citation.adjudication_status IN {ISSUED, CONTESTED}"
        side_effects:
          - "adjudication_status := VOID, dismissal_reason_code := ZONE_NOT_DESIGNATED, dismissed_at := logical clock"
          - "settlement_status := WRITTEN_OFF and the same plan/assignment/reversal cascade links as the DISMISS arm"
      - from: CONTESTED
        to: VOID
        trigger: "system event: POST /fare-zones/{id}/revoke on the citation's zone"
        actor: system
        preconditions:
          - "citation.adjudication_status IN {ISSUED, CONTESTED}"
        side_effects:
          - "adjudication_status := VOID, dismissal_reason_code := ZONE_NOT_DESIGNATED, dismissed_at := logical clock"
          - "any SCHEDULED AdjudicationHearing for this citation transitions to CANCELLED"
          - "settlement_status := WRITTEN_OFF and the same plan/assignment/reversal cascade links as the DISMISS arm"

  - entity: Citation
    dimension: settlement_status
    initial_state: OUTSTANDING
    terminal_states: [SATISFIED, WRITTEN_OFF]
    transitions:
      - from: OUTSTANDING
        to: PLAN_ACTIVE
        trigger: "POST /payment-plans"
        actor: Rider
        preconditions:
          - "citation.settlement_status == OUTSTANDING"
          - "citation.adjudication_status IN {ISSUED, UPHELD, REDUCED}"
          - "expected_citation_version matches citation.version"
        side_effects:
          - "settlement_status := PLAN_ACTIVE"
          - "a PaymentPlan row is created in status ACTIVE"
          - "a PenaltyPayment row with source DOWN_PAYMENT is appended when down_payment_cents > 0, refreshing amount_paid_cents and outstanding_balance_cents"
          - "increments Citation.version by 1"
      - from: SERVICE_ACTIVE
        to: PLAN_ACTIVE
        trigger: "POST /payment-plans with supersede_alternative == true"
        actor: Rider
        preconditions:
          - "citation.settlement_status == SERVICE_ACTIVE"
          - "citation.adjudication_status IN {ISSUED, UPHELD, REDUCED}"
          - "expected_citation_version matches citation.version"
        side_effects:
          - "every CommunityServiceAssignment with this citation_id and status == ACTIVE transitions to FORFEITED (already-credited SERVICE_CREDIT ledger rows are retained)"
          - "settlement_status := PLAN_ACTIVE and a PaymentPlan row is created in status ACTIVE"
          - "increments Citation.version by 1"
      - from: OUTSTANDING
        to: SERVICE_ACTIVE
        trigger: "POST /community-service-assignments"
        actor: Rider
        preconditions:
          - "citation.settlement_status == OUTSTANDING"
          - "citation.adjudication_status IN {ISSUED, UPHELD, REDUCED}"
          - "citation.outstanding_balance_cents > 0"
          - "expected_citation_version matches citation.version"
        side_effects:
          - "settlement_status := SERVICE_ACTIVE"
          - "a CommunityServiceAssignment row is created in status ACTIVE with required_hours computed"
          - "increments Citation.version by 1"
      - from: PLAN_ACTIVE
        to: OUTSTANDING
        trigger: "POST /payment-plans/{id}/assess-delinquency"
        actor: EnforcementPlanner
        preconditions:
          - "plan.status == ACTIVE"
          - "recomputed plan.missed_installment_count >= PLAN_DEFAULT_MISSED_THRESHOLD (2)"
        side_effects:
          - "plan.status := DEFAULTED"
          - "settlement_status := OUTSTANDING (cyclic arm — the citation returns to the collectible pool and a fresh plan may be created)"
          - "increments Citation.version by 1"
      - from: PLAN_ACTIVE
        to: SATISFIED
        trigger: "POST /payment-plans/{id}/installments paying the final installment"
        actor: Rider
        preconditions:
          - "plan.status == ACTIVE"
          - "the posted amount_cents equals the scheduled installment amount for the next unpaid installment"
          - "plan.remaining_balance_cents - amount_cents == 0"
        side_effects:
          - "a PenaltyPayment row with source PLAN_INSTALLMENT is appended"
          - "plan.status := COMPLETED"
          - "settlement_status := SATISFIED, outstanding_balance_cents := 0"
          - "increments Citation.version by 1"
      - from: SERVICE_ACTIVE
        to: SATISFIED
        trigger: "POST /community-service-assignments/{id}/log-hours reaching required_hours"
        actor: EnforcementPlanner
        preconditions:
          - "assignment.status == ACTIVE"
          - "assignment.hours_completed + posted hours >= assignment.required_hours"
        side_effects:
          - "a PenaltyPayment row with source SERVICE_CREDIT is appended, capped so credited_cents never exceeds the outstanding balance at log time"
          - "assignment.status := COMPLETED"
          - "settlement_status := SATISFIED, outstanding_balance_cents := 0"
          - "increments Citation.version by 1"
      - from: OUTSTANDING
        to: SATISFIED
        trigger: "POST /citations/{id}/payments covering the full outstanding balance"
        actor: Rider
        preconditions:
          - "citation.settlement_status == OUTSTANDING"
          - "amount_cents == citation.outstanding_balance_cents"
        side_effects:
          - "a PenaltyPayment row with source DIRECT is appended"
          - "settlement_status := SATISFIED, outstanding_balance_cents := 0"
          - "increments Citation.version by 1"
      - from: OUTSTANDING
        to: WRITTEN_OFF
        trigger: "system event: adjudication_status becomes DISMISSED or VOID"
        actor: system
        preconditions:
          - "citation.settlement_status IN {OUTSTANDING, PLAN_ACTIVE, SERVICE_ACTIVE}"
        side_effects:
          - "settlement_status := WRITTEN_OFF, outstanding_balance_cents := 0"
          - "the DISMISSAL_REVERSAL ledger row is appended when amount_paid_cents > 0"
      - from: PLAN_ACTIVE
        to: WRITTEN_OFF
        trigger: "system event: adjudication_status becomes DISMISSED or VOID"
        actor: system
        preconditions:
          - "citation.settlement_status IN {OUTSTANDING, PLAN_ACTIVE, SERVICE_ACTIVE}"
        side_effects:
          - "settlement_status := WRITTEN_OFF, outstanding_balance_cents := 0, ACTIVE plan := CANCELLED, DISMISSAL_REVERSAL row appended when amount_paid_cents > 0"
      - from: SERVICE_ACTIVE
        to: WRITTEN_OFF
        trigger: "system event: adjudication_status becomes DISMISSED or VOID"
        actor: system
        preconditions:
          - "citation.settlement_status IN {OUTSTANDING, PLAN_ACTIVE, SERVICE_ACTIVE}"
        side_effects:
          - "settlement_status := WRITTEN_OFF, outstanding_balance_cents := 0, ACTIVE assignment := CANCELLED, DISMISSAL_REVERSAL row appended when amount_paid_cents > 0"

  - entity: AdjudicationHearing
    initial_state: SCHEDULED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /adjudication-hearings/{id}/decide"
        actor: HearingOfficer
        preconditions:
          - "hearing.status == SCHEDULED"
          - "the referenced Citation has adjudication_status == CONTESTED (cross-entity)"
          - "decision IN {UPHOLD, DISMISS, REDUCE}"
          - "dismissal_reason_code present if and only if decision == DISMISS"
          - "reduced_penalty_cents present if and only if decision == REDUCE"
        side_effects:
          - "status := HELD, decision := input decision, decided_at := logical clock, hearing_officer_user_id := acting X-User-ID"
          - "the citation's adjudication_status moves to UPHELD, REDUCED or DISMISSED per the Citation adjudication machine"
          - "increments AdjudicationHearing.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /adjudication-hearings/{id}/cancel"
        actor: HearingOfficer
        preconditions:
          - "hearing.status == SCHEDULED"
        side_effects:
          - "status := CANCELLED"
          - "the citation's adjudication_status reverts CONTESTED -> ISSUED"
          - "increments AdjudicationHearing.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: the citation's adjudication_status becomes VOID through zone revocation"
        actor: system
        preconditions:
          - "hearing.status == SCHEDULED"
        side_effects:
          - "status := CANCELLED"

  - entity: Appeal
    initial_state: SUBMITTED
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SUPPLEMENT_REQUESTED
        trigger: "POST /appeals/{id}/request-supplement"
        actor: AppealsBoardMember
        preconditions:
          - "appeal.status == SUBMITTED"
          - "appeal.round_index < APPEAL_MAX_ROUNDS (2)"
        side_effects:
          - "status := SUPPLEMENT_REQUESTED"
          - "supplement_deadline_at := logical clock + SUPPLEMENT_WINDOW_DAYS days"
          - "increments Appeal.version by 1"
      - from: SUPPLEMENT_REQUESTED
        to: SUBMITTED
        trigger: "POST /appeals/{id}/resubmit"
        actor: Rider
        preconditions:
          - "appeal.status == SUPPLEMENT_REQUESTED"
          - "logical clock <= appeal.supplement_deadline_at"
          - "appeal.round_index < APPEAL_MAX_ROUNDS (2)"
          - "appeal.appellant_rider_id == acting Rider's X-User-ID"
        side_effects:
          - "status := SUBMITTED, round_index := round_index + 1, statement := input statement, submitted_at := logical clock, supplement_deadline_at := null"
          - "increments Appeal.version by 1"
        note: "Cyclic arm — SUBMITTED and SUPPLEMENT_REQUESTED alternate until round_index reaches APPEAL_MAX_ROUNDS."
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /appeals/{id}/decide with decision == GRANTED"
        actor: AppealsBoardMember
        preconditions:
          - "appeal.status IN {SUBMITTED, SUPPLEMENT_REQUESTED}"
          - "acting X-User-ID != the referenced hearing's hearing_officer_user_id"
          - "dismissal_reason_code is present"
        side_effects:
          - "status := GRANTED, decided_at := logical clock, decided_by_user_id := acting X-User-ID"
          - "starts the four-link dismissal cascade on the Citation adjudication machine"
          - "increments Appeal.version by 1"
      - from: SUPPLEMENT_REQUESTED
        to: GRANTED
        trigger: "POST /appeals/{id}/decide with decision == GRANTED"
        actor: AppealsBoardMember
        preconditions:
          - "identical to the SUBMITTED -> GRANTED arm"
        side_effects:
          - "identical to the SUBMITTED -> GRANTED arm"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /appeals/{id}/decide with decision == DENIED"
        actor: AppealsBoardMember
        preconditions:
          - "appeal.status IN {SUBMITTED, SUPPLEMENT_REQUESTED}"
          - "acting X-User-ID != the referenced hearing's hearing_officer_user_id"
          - "dismissal_reason_code is absent"
        side_effects:
          - "status := DENIED, decided_at := logical clock, decided_by_user_id := acting X-User-ID"
          - "the citation's adjudication_status and settlement_status are left unchanged"
          - "increments Appeal.version by 1"
      - from: SUPPLEMENT_REQUESTED
        to: DENIED
        trigger: "POST /appeals/{id}/decide with decision == DENIED"
        actor: AppealsBoardMember
        preconditions:
          - "identical to the SUBMITTED -> DENIED arm"
        side_effects:
          - "identical to the SUBMITTED -> DENIED arm"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: Rider
        preconditions:
          - "appeal.status IN {SUBMITTED, SUPPLEMENT_REQUESTED}"
          - "appeal.appellant_rider_id == acting Rider's X-User-ID"
        side_effects:
          - "status := WITHDRAWN"
          - "increments Appeal.version by 1"
      - from: SUPPLEMENT_REQUESTED
        to: WITHDRAWN
        trigger: "POST /appeals/{id}/withdraw"
        actor: Rider
        preconditions:
          - "identical to the SUBMITTED -> WITHDRAWN arm"
        side_effects:
          - "status := WITHDRAWN"

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, DEFAULTED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /payment-plans/{id}/installments paying the final scheduled installment"
        actor: Rider
        preconditions:
          - "plan.status == ACTIVE"
          - "plan.installments_paid_count + 1 == plan.installment_count"
          - "posted amount_cents == plan.final_installment_cents"
        side_effects:
          - "status := COMPLETED, remaining_balance_cents := 0"
          - "the citation's settlement_status := SATISFIED"
          - "increments PaymentPlan.version by 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /payment-plans/{id}/assess-delinquency"
        actor: EnforcementPlanner
        preconditions:
          - "plan.status == ACTIVE"
          - "recomputed missed_installment_count >= 2"
        side_effects:
          - "status := DEFAULTED"
          - "the citation's settlement_status reverts PLAN_ACTIVE -> OUTSTANDING"
          - "increments PaymentPlan.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system event: the citation's adjudication_status becomes DISMISSED or VOID"
        actor: system
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "status := CANCELLED"
          - "the citation's settlement_status := WRITTEN_OFF and a DISMISSAL_REVERSAL ledger row is appended when amount_paid_cents > 0"

  - entity: CommunityServiceAssignment
    initial_state: ACTIVE
    terminal_states: [COMPLETED, FORFEITED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /community-service-assignments/{id}/log-hours reaching required_hours"
        actor: EnforcementPlanner
        preconditions:
          - "assignment.status == ACTIVE"
          - "hours_completed + posted hours >= required_hours"
        side_effects:
          - "status := COMPLETED"
          - "a capped SERVICE_CREDIT PenaltyPayment row is appended and the citation's settlement_status := SATISFIED"
          - "increments CommunityServiceAssignment.version by 1"
      - from: ACTIVE
        to: FORFEITED
        trigger: "system event: POST /payment-plans with supersede_alternative == true on the same citation"
        actor: system
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "status := FORFEITED"
          - "already-credited SERVICE_CREDIT ledger rows are retained so citation.service_credit_cents is unchanged"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system event: the citation's adjudication_status becomes DISMISSED or VOID"
        actor: system
        preconditions:
          - "assignment.status == ACTIVE"
        side_effects:
          - "status := CANCELLED"
          - "the citation's settlement_status := WRITTEN_OFF"

# ============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent Citation's version only
# ============================================================================

concurrency_rules:
  - rule_id: plan-create-stale-citation
    parent_entity: Citation
    write_endpoint: "POST /payment-plans"
    occ_field: "expected_citation_version"
    description: |
      Creating a PaymentPlan against a Citation whose version has advanced since
      the client last observed it is rejected with a stale-version error. A new
      plan legitimately supersedes a DEFAULTED or CANCELLED predecessor and may
      also forfeit an ACTIVE CommunityServiceAssignment, so the write cannot be
      screened out by a state precondition alone; the version check pins the
      client's view of the citation ledger (outstanding_balance_cents,
      settlement_status) at the instant the plan terms were computed.
    error_id: ERR_STALE_CITATION_VERSION
    http_status: 412

  - rule_id: service-create-stale-citation
    parent_entity: Citation
    write_endpoint: "POST /community-service-assignments"
    occ_field: "expected_citation_version"
    description: |
      Creating a CommunityServiceAssignment against a Citation whose version has
      advanced since the client last observed it is rejected with a stale-version
      error. required_hours is derived from outstanding_balance_cents at creation
      time, so a stale view would lock in an hour count the ledger no longer
      supports; a new assignment legitimately follows a FORFEITED or CANCELLED
      predecessor and therefore cannot be screened out by state alone.
    error_id: ERR_STALE_CITATION_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================

calculations:

  - name: zone_signage_compliance_pct
    trigger: "On POST /signage-audits (after the new row is appended) and read-time recompute on GET /fare-zones/{id}"
    algorithm: aggregation
    formula: |
      audits = [a for a in SignageAudit if a.zone_id == zone.id]
      if audits is empty:
          verified_sign_count = 0
          signage_compliance_pct = 0.0000
      else:
          latest = sort(audits, key=(audited_at DESC, created_at DESC))[0]
          verified_sign_count = latest.signs_verified_count
          signage_compliance_pct = round_half_up(
              verified_sign_count / zone.required_sign_count, 4)
      # capped at 1.0000 when verified_sign_count > required_sign_count
      signage_compliance_pct = min(signage_compliance_pct, 1.0000)
    input_set: "All SignageAudit rows with zone_id == zone.id, no status filter (SignageAudit is append-only and has no status). Selection is a single row: the maximum audited_at; ties broken by the later created_at; created_at is used as the tie-break, never id."
    constants:
      SIGNAGE_MIN_PCT: 0.9000
    precision: "4 decimal places, round_half_up"

  - name: encounter_validation_result
    trigger: "On POST /inspection-encounters, before outcome is set; the value is frozen on the row"
    algorithm: constraint_propagation
    formula: |
      zone_code = FareZone[InspectionDeployment[encounter.deployment_id].zone_id].zone_code
      if encounter.fare_media_type == NONE:
          return NO_PROOF
      if encounter.fare_media_type in {SMARTCARD, MOBILE_QR}:
          # ELECTRONIC branch — validation record first, then zone, then expiry
          if encounter.media_validated_at is null:      return UNVALIDATED_TAP
          if encounter.media_zone_code != zone_code:    return WRONG_ZONE
          if encounter.media_expires_at is null:        return NO_PROOF
          if encounter.media_expires_at < encounter.occurred_at: return EXPIRED
          return VALID
      # PAPER branch (PAPER_TRANSFER, CASH_RECEIPT) — expiry BEFORE zone
      if encounter.media_expires_at is null:            return NO_PROOF
      if encounter.media_expires_at < encounter.occurred_at: return EXPIRED
      if encounter.media_zone_code != zone_code:        return WRONG_ZONE
      return VALID
    input_set: "Only fields on the encounter row plus the zone_code of the FareZone referenced by the encounter's deployment. media_validated_at is never compared to occurred_at."
    constants: {}
    precision: "Not numeric; the branch evaluation order above is normative and MUST NOT be reordered. media_expires_at == occurred_at is NOT expired (strict `<`)."

  - name: citation_offense_sequence
    trigger: "On POST /citations and on POST /citations/{id}/reissue, before penalty assessment"
    algorithm: chronological
    formula: |
      # half-open lookback: (issued_at - LOOKBACK_DAYS days, issued_at]
      lo = issued_at - LOOKBACK_DAYS days
      prior_citations = count(c in Citation where
            c.rider_id == rider.id
        and c.id != this.id
        and lo < c.issued_at <= issued_at
        and c.adjudication_status in {ISSUED, CONTESTED, UPHELD, REDUCED})
      prior_warnings = count(e in InspectionEncounter where
            e.rider_id == rider.id
        and e.outcome == WARNING_ISSUED
        and lo < e.occurred_at <= issued_at)
      offense_sequence        = 1 + prior_warnings + prior_citations   # warning_inclusive
      citation_only_sequence  = 1 + prior_citations                    # citation_only
    input_set: "Citation rows for the same rider with adjudication_status IN {ISSUED, CONTESTED, UPHELD, REDUCED} (DISMISSED and VOID rows are excluded and stop counting the moment they are dismissed) plus InspectionEncounter rows for the same rider with outcome == WARNING_ISSUED, both restricted to the half-open lookback window."
    constants:
      LOOKBACK_DAYS: 365
    precision: "Integer counts; ordering is by the timestamps above, never by id."
    variants:
      - name: warning_inclusive
        when: "Written to Citation.offense_sequence at issuance and reissuance; drives assessed_penalty_cents and the WARNING_FIRST policy gate."
        difference: "Counts prior WARNING_ISSUED encounters as ladder steps alongside prior citations."
      - name: citation_only
        when: "Written to Citation.citation_only_sequence at issuance and reissuance; drives reduction_floor_cents, the lowest penalty an adjudicator may reduce to."
        difference: "Ignores warnings entirely, so for a rider whose only prior contact was a warning it returns 1 where warning_inclusive returns 2 — a strictly lower ladder tier and therefore a strictly lower penalty for identical inputs."

  - name: citation_assessed_penalty_cents
    trigger: "On POST /citations and POST /citations/{id}/reissue; recomputed as an override on a REDUCE hearing decision"
    algorithm: tiered_pricing
    formula: |
      def assess(seq, zone, rider):
          tier_base = BASE_TIER_CENTS[min(seq, 3)]                     # 1 -> 7500, 2 -> 15000, >=3 -> 25000
          scaled    = round_half_up(tier_base * zone.penalty_multiplier_bps / 10000)
          if rider.fare_assistance_enrolled:
              discounted = round_half_up(scaled * (10000 - ASSISTANCE_DISCOUNT_BPS) / 10000)
          else:
              discounted = scaled
          return max(PENALTY_FLOOR_CENTS, min(PENALTY_CAP_CENTS, discounted))

      assessed_penalty_cents = assess(offense_sequence, zone, rider)
      reduction_floor_cents  = assess(citation_only_sequence, zone, rider)
    input_set: "The citation's own offense_sequence / citation_only_sequence, the FareZone.penalty_multiplier_bps of citation.zone_id, and Rider.fare_assistance_enrolled of citation.rider_id."
    constants:
      BASE_TIER_CENTS: { 1: 7500, 2: 15000, 3: 25000 }
      ASSISTANCE_DISCOUNT_BPS: 5000
      PENALTY_CAP_CENTS: 27500
      PENALTY_FLOOR_CENTS: 2500
    precision: "Integer cents. Evaluation order is pinned: tier lookup -> zone scaling (round_half_up) -> assistance discount (round_half_up) -> clamp as max(FLOOR, min(CAP, x)). Rounding after each multiplicative step, never once at the end."

  - name: citation_admin_fee_cents
    trigger: "On POST /citations, POST /citations/{id}/reissue, and after a REDUCE hearing decision rewrites assessed_penalty_cents"
    algorithm: threshold
    formula: |
      # The fee schedule is published as a band on the amount the rider owes, which
      # LOOKS circular because total_due depends on the fee. Evaluation order is
      # pinned: the band is keyed on assessed_penalty_cents (PRE-fee), never on
      # total_due_cents.
      if   assessed_penalty_cents <= FEE_BAND_1_MAX:  fee_bps = 800
      elif assessed_penalty_cents <= FEE_BAND_2_MAX:  fee_bps = 1200
      else:                                          fee_bps = 1500
      admin_fee_cents = round_half_up(assessed_penalty_cents * fee_bps / 10000)
      total_due_cents = assessed_penalty_cents + admin_fee_cents
    input_set: "citation.assessed_penalty_cents only."
    constants:
      FEE_BAND_1_MAX: 10000
      FEE_BAND_2_MAX: 20000
    precision: "Integer cents, round_half_up. At assessed_penalty_cents == 20000 the pinned order yields fee 2400 / total 22400, whereas keying the band on total_due_cents would yield fee 3000 / total 23000 — the pinned order is normative."

  - name: citation_outstanding_balance_cents
    trigger: "After every PenaltyPayment append, every REDUCE decision, and every settlement_status transition"
    algorithm: aggregation
    formula: |
      paid_in  = sum(p.amount_cents for p in PenaltyPayment
                     where p.citation_id == citation.id
                       and p.source in {DOWN_PAYMENT, PLAN_INSTALLMENT, DIRECT})
      reversed = sum(p.amount_cents for p in PenaltyPayment
                     where p.citation_id == citation.id
                       and p.source == DISMISSAL_REVERSAL)
      amount_paid_cents    = paid_in - reversed
      service_credit_cents = sum(p.amount_cents for p in PenaltyPayment
                     where p.citation_id == citation.id and p.source == SERVICE_CREDIT)
      if citation.settlement_status in {SATISFIED, WRITTEN_OFF}:
          outstanding_balance_cents = 0
      else:
          outstanding_balance_cents = max(0,
              total_due_cents - amount_paid_cents - service_credit_cents)
    input_set: "All PenaltyPayment rows with citation_id == citation.id; PenaltyPayment is append-only and carries no status filter. Order of summation does not affect the result."
    constants: {}
    precision: "Integer cents; exact, no rounding."

  - name: deployment_sample_adequacy_ratio
    trigger: "After every InspectionEncounter create or void that touches the deployment, and on POST /inspection-deployments/{id}/close"
    algorithm: threshold
    formula: |
      achieved_sample_count  = count(e in InspectionEncounter
                                     where e.deployment_id == d.id and e.outcome != VOIDED)
      voided_encounter_count = count(e in InspectionEncounter
                                     where e.deployment_id == d.id and e.outcome == VOIDED)
      sample_adequacy_ratio  = round_half_up(achieved_sample_count / d.target_sample_size, 4)
      close_allowed = sample_adequacy_ratio >= SAMPLE_ADEQUACY_MIN
    input_set: "All InspectionEncounter rows with deployment_id == d.id; PENDING rows count toward achieved_sample_count but a deployment with any PENDING encounter cannot be closed."
    constants:
      SAMPLE_ADEQUACY_MIN: 0.8000
    precision: "4 decimal places, round_half_up. The gate is inclusive: a ratio of exactly 0.8000 closes; 0.7999 is rejected with ERR_SAMPLE_SIZE_INADEQUATE."

  - name: deployment_evasion_rate_bps
    trigger: "On POST /inspection-deployments/{id}/close"
    algorithm: aggregation
    formula: |
      NONCOMPLIANT = {EXPIRED, UNVALIDATED_TAP, WRONG_ZONE, NO_PROOF}

      # variant encounter_denominator -> measured_evasion_rate_bps
      pool_a = [e for e in encounters(d) if e.outcome != VOIDED]
      num_a  = count(e in pool_a if e.validation_result in NONCOMPLIANT)
      measured_evasion_rate_bps = 0 if len(pool_a) == 0 else \
          round_half_up(num_a * 10000 / len(pool_a))

      # variant resolved_denominator -> resolved_evasion_rate_bps
      pool_b = [e for e in encounters(d) if e.outcome not in {VOIDED, UNRESOLVED_IDENTITY}]
      num_b  = count(e in pool_b if e.validation_result in NONCOMPLIANT)
      resolved_evasion_rate_bps = 0 if len(pool_b) == 0 else \
          round_half_up(num_b * 10000 / len(pool_b))
    input_set: "InspectionEncounter rows with deployment_id == d.id. Variant A excludes only outcome == VOIDED; variant B additionally excludes outcome == UNRESOLVED_IDENTITY from BOTH numerator and denominator."
    constants: {}
    precision: "Integer basis points, round_half_up; empty pool yields 0."
    variants:
      - name: encounter_denominator
        when: "Written to InspectionDeployment.measured_evasion_rate_bps; the statutory rate the agency publishes."
        difference: "Treats identity-refusal encounters as observed evaders, inflating the denominator and (because those encounters are always non-compliant) the numerator too."
      - name: resolved_denominator
        when: "Written to InspectionDeployment.resolved_evasion_rate_bps; the rate used for equity-adjusted internal planning."
        difference: "Drops identity-refusal encounters entirely, so for the same encounter set it returns a strictly different rate whenever at least one UNRESOLVED_IDENTITY encounter exists and the remaining pool is not uniformly non-compliant."

  - name: deployment_enforcement_cost_cents
    trigger: "On POST /inspection-deployments/{id}/close"
    algorithm: tiered_pricing
    formula: |
      dur_min = whole minutes between d.window_start and d.window_end
      reg_min = min(dur_min, REGULAR_MINUTES_CAP)          # 360
      ot_min  = max(0, dur_min - REGULAR_MINUTES_CAP)
      per_inspector_cents = round_half_up(reg_min * REGULAR_RATE_CENTS_PER_HOUR / 60) \
                          + round_half_up(ot_min  * OVERTIME_RATE_CENTS_PER_HOUR / 60)
      labour_cents = per_inspector_cents * d.planned_inspector_count
      zone = FareZone[d.zone_id]
      premium_cents = round_half_up(labour_cents * ZONE_PREMIUM_BPS / 10000) \
                      if zone.penalty_multiplier_bps > 10000 else 0
      enforcement_cost_cents = labour_cents + premium_cents
    input_set: "The deployment's own window and planned_inspector_count plus FareZone.penalty_multiplier_bps of d.zone_id. Encounter counts do NOT affect cost."
    constants:
      REGULAR_RATE_CENTS_PER_HOUR: 4800
      OVERTIME_RATE_CENTS_PER_HOUR: 7200
      REGULAR_MINUTES_CAP: 360
      ZONE_PREMIUM_BPS: 500
    precision: "Integer cents. Pinned order: round per-inspector regular and overtime legs separately, THEN multiply by head count, THEN apply the zone premium to the multiplied labour total."

  - name: payment_plan_schedule
    trigger: "On POST /payment-plans"
    algorithm: waterfall_allocation
    formula: |
      financed_cents = citation.outstanding_balance_cents - down_payment_cents
      base_installment_cents = floor(financed_cents / installment_count)
      remainder_cents = financed_cents - base_installment_cents * installment_count
      final_installment_cents = base_installment_cents + remainder_cents
      schedule = [base_installment_cents] * (installment_count - 1) + [final_installment_cents]
      # due dates: installment k (1-based) is due at plan.created_at + k * 30 days
      minimum_down_payment_cents = round_half_up(
          citation.outstanding_balance_cents * MIN_DOWN_PAYMENT_BPS / 10000)
    input_set: "citation.outstanding_balance_cents at plan-creation time, the requested down_payment_cents and installment_count."
    constants:
      MIN_DOWN_PAYMENT_BPS: 1000
      PLAN_MIN_INSTALLMENTS: 2
      PLAN_MAX_INSTALLMENTS: 6
      INSTALLMENT_INTERVAL_DAYS: 30
      PLAN_DEFAULT_MISSED_THRESHOLD: 2
    precision: |
      Integer cents. The rounding ORDER is normative: divide with floor per
      installment and push the whole remainder into the FINAL installment, so
      sum(schedule) == financed_cents exactly. Computing each installment as
      round_half_up(financed_cents / installment_count) and summing would collect
      a different total (e.g. financed 17660 over 3 installments: pinned schedule
      [5886, 5886, 5888] sums to 17660, whereas round-then-sum yields
      [5887, 5887, 5887] = 17661, one cent of over-collection) and is forbidden.

  - name: plan_delinquency_assessment
    trigger: "On POST /payment-plans/{id}/assess-delinquency"
    algorithm: chronological
    formula: |
      due_at(k) = plan.created_at + k * INSTALLMENT_INTERVAL_DAYS days   # k = 1..installment_count
      missed_installment_count = count(k in 1..plan.installment_count where
          due_at(k) <= logical_clock and plan.installments_paid_count < k)
      if missed_installment_count >= PLAN_DEFAULT_MISSED_THRESHOLD:
          plan.status := DEFAULTED and citation.settlement_status := OUTSTANDING
    input_set: "The plan's own created_at, installment_count and installments_paid_count (count of PLAN_INSTALLMENT ledger rows), evaluated against the logical clock. Installments are consumed strictly in ascending k."
    constants:
      INSTALLMENT_INTERVAL_DAYS: 30
      PLAN_DEFAULT_MISSED_THRESHOLD: 2
    precision: "Integer count; the due-date comparison is inclusive (due_at(k) <= clock counts as due)."

  - name: service_hours_required
    trigger: "On POST /community-service-assignments (required_hours) and on POST /community-service-assignments/{id}/log-hours (credit conversion)"
    algorithm: threshold
    formula: |
      required_hours = ceil(citation.outstanding_balance_cents / SERVICE_CREDIT_CENTS_PER_HOUR)

      # log-hours conversion, capped so the ledger identity can never go negative
      raw_credit_cents = posted_hours * SERVICE_CREDIT_CENTS_PER_HOUR
      credit_cents     = min(raw_credit_cents, citation.outstanding_balance_cents)
      # a SERVICE_CREDIT PenaltyPayment row is appended for credit_cents only when credit_cents > 0
    input_set: "citation.outstanding_balance_cents at the moment of the call and the posted hours (integer >= 1)."
    constants:
      SERVICE_CREDIT_CENTS_PER_HOUR: 1500
    precision: "Integer hours via ceil; integer cents for the credit. The cap is applied per log-hours call, before the ledger row is appended."

  - name: equity_disparity_index
    trigger: "On GET /reports/equity-distribution"
    algorithm: weighted_scoring
    formula: |
      # window is half-open: window_start <= occurred_at < window_end
      pool = [e for e in InspectionEncounter if e.rider_id is not null
              and e.outcome != VOIDED
              and window_start <= e.occurred_at < window_end]
      cited = [e for e in pool if exists(c in Citation where c.encounter_id == e.id
               and c.adjudication_status in {ISSUED, CONTESTED, UPHELD, REDUCED})]
      groups = distinct key(e) over pool, where key = Rider.demographic_band
               when group_by == DEMOGRAPHIC_BAND else Rider.residence_geo_tract
      systemwide_citation_rate = 0.0000 if len(pool) == 0 else \
          round_half_up(len(cited) / len(pool), 4)
      for g in groups (ordered by group key ASC):
          rate_g = round_half_up(cited_in_g / pool_in_g, 4)     # ROUND FIRST
      groups_evaluated = len(groups)
      disparity_index = 0.0000 if groups_evaluated == 0 else round_half_up(
          sum(abs(rate_g - systemwide_citation_rate) for g in groups) / groups_evaluated, 4)
    input_set: "InspectionEncounter rows with rider_id not null and outcome != VOIDED whose occurred_at falls in the half-open window; a rider's group key is read from the Rider row. Citations with adjudication_status IN {DISMISSED, VOID} do not mark their encounter as cited."
    constants: {}
    precision: |
      4 decimal places, round_half_up, and the ORDER is normative: each group rate
      is rounded to 4 dp BEFORE the deviation is taken, then the mean deviation is
      rounded again. Aggregating raw unrounded rates and rounding once at the end is
      forbidden and observably different (e.g. group rates 1/3 and 1/2 against a
      systemwide 2/5: pinned order yields 0.0834, raw-then-round yields 0.0833).

  - name: revenue_recovery
    trigger: "On GET /reports/revenue-recovery"
    algorithm: forward_looking
    formula: |
      # cost leg is identical for both bases
      closed = [d for d in InspectionDeployment if d.status == CLOSED
                and window_start <= d.window_start < window_end]
      enforcement_cost_cents = sum(d.enforcement_cost_cents for d in closed)
      deployments_counted = len(closed)

      if basis == ACCRUAL:
          billed = [c for c in Citation
                    if window_start <= c.issued_at < window_end
                    and c.adjudication_status in {ISSUED, CONTESTED, UPHELD, REDUCED}]
          recovered_cents = sum(c.total_due_cents for c in billed)
          citations_counted = len(billed)
      else:  # basis == CASH
          rows = [p for p in PenaltyPayment
                  if window_start <= p.applied_at < window_end]
          recovered_cents = sum(p.amount_cents for p in rows
                                if p.source in {DOWN_PAYMENT, PLAN_INSTALLMENT, DIRECT, SERVICE_CREDIT}) \
                          - sum(p.amount_cents for p in rows if p.source == DISMISSAL_REVERSAL)
          citations_counted = count(distinct p.citation_id for p in rows)

      net_recovery_cents = recovered_cents - enforcement_cost_cents
      recovery_ratio_bps = 0 if enforcement_cost_cents == 0 else \
          round_half_up(recovered_cents * 10000 / enforcement_cost_cents)
    input_set: "Half-open window on Citation.issued_at (ACCRUAL) or PenaltyPayment.applied_at (CASH); cost leg over InspectionDeployment rows with status == CLOSED and window_start inside the same half-open window."
    constants: {}
    precision: "Integer cents and integer basis points, round_half_up; a zero cost leg yields recovery_ratio_bps == 0."
    variants:
      - name: accrual_basis
        when: "basis == ACCRUAL — the amount billed to riders in the window."
        difference: "Counts the full total_due_cents of every live citation issued in the window regardless of whether a cent was collected, and ignores the payment ledger entirely."
      - name: cash_basis
        when: "basis == CASH — the amount actually banked in the window."
        difference: "Counts only ledger rows applied inside the window, net of DISMISSAL_REVERSAL, so a citation issued but unpaid contributes 0 and a dismissal reverses previously banked cash."

# ============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority order)
# ============================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the six roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the role in X-User-Role appears in the called endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "request body contains every required field of the endpoint's input with the declared type; enum fields carry a declared member; integer amounts and counts are >= their declared minimum"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 5
    category: business_constraint
    check: "window_end > window_start and the two instants are a whole number of minutes apart; report window_end > window_start"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /inspection-deployments, GET /reports/equity-distribution, GET /reports/revenue-recovery"

  - priority: 6
    category: existence
    check: "every id in the URL path resolves, validated left to right"
    error_id: "ERR_ZONE_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_RIDER_NOT_FOUND | ERR_DEPLOYMENT_NOT_FOUND | ERR_ENCOUNTER_NOT_FOUND | ERR_CITATION_NOT_FOUND | ERR_HEARING_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_SERVICE_ASSIGNMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 7
    category: existence
    check: "every foreign-key id in the request body resolves, validated in the field order declared by the endpoint's input"
    error_id: "ERR_ZONE_NOT_FOUND | ERR_LINE_NOT_FOUND | ERR_DEPLOYMENT_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_RIDER_NOT_FOUND | ERR_ENCOUNTER_NOT_FOUND | ERR_CITATION_NOT_FOUND | ERR_HEARING_NOT_FOUND"
    http_status: 404
    applies_to: "POST /zone-line-assignments, POST /signage-audits, POST /inspection-deployments, POST /inspection-encounters, POST /citations, POST /appeals, POST /payment-plans, POST /community-service-assignments"

  - priority: 8
    category: state
    check: "expected_citation_version equals the referenced Citation's current version"
    error_id: ERR_STALE_CITATION_VERSION
    http_status: 412
    applies_to: "POST /payment-plans, POST /community-service-assignments"

  - priority: 9
    category: auth
    check: "when the acting role is Rider, X-User-ID equals the rider foreign key of the target resource (Citation.rider_id, Appeal.appellant_rider_id, or PaymentPlan.citation_id -> Citation.rider_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /citations/{id}/contest, POST /citations/{id}/payments, POST /appeals, POST /appeals/{id}/resubmit, POST /appeals/{id}/withdraw, POST /payment-plans, POST /payment-plans/{id}/installments, POST /community-service-assignments"

  - priority: 10
    category: auth
    check: "when the acting role is FareInspector, X-User-ID equals encounter.inspector_id of the target encounter"
    error_id: ERR_INSPECTOR_NOT_ON_ENCOUNTER
    http_status: 403
    applies_to: "POST /inspection-encounters/{id}/resolve, POST /citations"

  - priority: 11
    category: auth
    check: "the acting AppealsBoardMember's X-User-ID differs from the hearing_officer_user_id recorded on the appeal's hearing"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appeals/{id}/decide, POST /appeals/{id}/request-supplement"

  - priority: 12
    category: state
    check: "FareZone.designation_status is the from-state the requested zone transition declares"
    error_id: ERR_INVALID_ZONE_STATE
    http_status: 409
    applies_to: "POST /fare-zones/{id}/submit-for-signage, POST /fare-zones/{id}/designate, POST /fare-zones/{id}/suspend, POST /fare-zones/{id}/revoke"

  - priority: 13
    category: state
    check: "InspectionDeployment.status is the from-state the requested transition declares (PLANNED to activate, ACTIVE to close, PLANNED or ACTIVE to void)"
    error_id: ERR_INVALID_DEPLOYMENT_STATE
    http_status: 409
    applies_to: "POST /inspection-deployments/{id}/activate, POST /inspection-deployments/{id}/close, POST /inspection-deployments/{id}/void"

  - priority: 14
    category: state
    check: "the referenced InspectionDeployment has status == ACTIVE"
    error_id: ERR_DEPLOYMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /inspection-encounters"

  - priority: 15
    category: state
    check: "InspectionEncounter.outcome == PENDING"
    error_id: ERR_ENCOUNTER_NOT_PENDING
    http_status: 409
    applies_to: "POST /inspection-encounters/{id}/resolve, POST /citations"

  - priority: 16
    category: state
    check: "no InspectionEncounter of the deployment has outcome == PENDING"
    error_id: ERR_OPEN_ENCOUNTERS_REMAIN
    http_status: 409
    applies_to: "POST /inspection-deployments/{id}/close"

  - priority: 17
    category: state
    check: "Citation.adjudication_status == ISSUED for a contest request; IN {ISSUED, UPHELD, REDUCED} for settlement requests; == DISMISSED for a reissue"
    error_id: ERR_CITATION_STATUS_INVALID
    http_status: 409
    applies_to: "POST /citations/{id}/contest, POST /citations/{id}/reissue, POST /payment-plans, POST /community-service-assignments, POST /citations/{id}/payments"

  - priority: 18
    category: state
    check: "Citation.settlement_status == OUTSTANDING, with one exception: on POST /payment-plans the value SERVICE_ACTIVE also passes this rule regardless of supersede_alternative, because the ACTIVE community-service alternative is adjudicated later by priority 37 (supersede_alternative true supersedes it, false is refused with ERR_ALTERNATIVE_ALREADY_ACTIVE)"
    error_id: ERR_SETTLEMENT_STATUS_INVALID
    http_status: 409
    applies_to: "POST /payment-plans, POST /community-service-assignments, POST /citations/{id}/payments"

  - priority: 19
    category: state
    check: "AdjudicationHearing.status == SCHEDULED"
    error_id: ERR_HEARING_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /adjudication-hearings/{id}/decide, POST /adjudication-hearings/{id}/cancel"

  - priority: 20
    category: state
    check: "AdjudicationHearing.status == HELD and decision IN {UPHOLD, REDUCE} for the hearing an appeal is filed against"
    error_id: ERR_HEARING_NOT_APPEALABLE
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 21
    category: state
    check: "Appeal.status == SUBMITTED for a supplement request, == SUPPLEMENT_REQUESTED for a resubmission, IN {SUBMITTED, SUPPLEMENT_REQUESTED} for a decision or withdrawal"
    error_id: ERR_APPEAL_STATUS_INVALID
    http_status: 409
    applies_to: "POST /appeals/{id}/request-supplement, POST /appeals/{id}/resubmit, POST /appeals/{id}/decide, POST /appeals/{id}/withdraw"

  - priority: 22
    category: state
    check: "PaymentPlan.status == ACTIVE"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /payment-plans/{id}/installments, POST /payment-plans/{id}/assess-delinquency"

  - priority: 23
    category: state
    check: "CommunityServiceAssignment.status == ACTIVE"
    error_id: ERR_SERVICE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /community-service-assignments/{id}/log-hours"

  - priority: 24
    category: business_safety
    check: "the FareZone of the encounter's deployment has designation_status == DESIGNATED at the moment of issuance"
    error_id: ERR_ZONE_NOT_DESIGNATED
    http_status: 409
    applies_to: "POST /citations, POST /inspection-deployments/{id}/activate"

  - priority: 25
    category: business_safety
    check: "the FareZone has at least one SignageAudit row and signage_compliance_pct >= 0.9000"
    error_id: ERR_SIGNAGE_BELOW_THRESHOLD
    http_status: 409
    applies_to: "POST /fare-zones/{id}/designate"

  - priority: 26
    category: business_safety
    check: "the acting Inspector has status == ACTIVE"
    error_id: ERR_INSPECTOR_SUSPENDED
    http_status: 409
    applies_to: "POST /inspection-encounters, POST /citations"

  - priority: 27
    category: business_safety
    check: "the acting Inspector's certification_expiry is strictly after the encounter's occurred_at"
    error_id: ERR_INSPECTOR_CERT_EXPIRED
    http_status: 409
    applies_to: "POST /inspection-encounters, POST /citations"

  - priority: 28
    category: business_safety
    check: "encounter.rider_id is not null and encounter.identity_capture_method IN {GOVT_ID, SELF_REPORTED}"
    error_id: ERR_IDENTITY_NOT_ESTABLISHED
    http_status: 422
    applies_to: "POST /citations"

  - priority: 29
    category: business_safety
    check: "when the citation's zone has enforcement_policy == WARNING_FIRST, the warning_inclusive offense_sequence computed for this rider is >= 2"
    error_id: ERR_WARNING_REQUIRED_FIRST_OFFENSE
    http_status: 409
    applies_to: "POST /citations"

  - priority: 30
    category: business_safety
    check: "encounter.validation_result IN {EXPIRED, UNVALIDATED_TAP, WRONG_ZONE, NO_PROOF} for a citation or a WARNING_ISSUED disposition; == VALID for a COMPLIANT disposition; identity_capture_method == REFUSED for an UNRESOLVED_IDENTITY disposition"
    error_id: ERR_DISPOSITION_NOT_SUPPORTED
    http_status: 409
    applies_to: "POST /citations, POST /inspection-encounters/{id}/resolve"

  - priority: 31
    category: business_referential
    check: "a ZoneLineAssignment row exists with zone_id == body.zone_id and line_id == body.line_id whose effective_from <= window_start"
    error_id: ERR_LINE_NOT_ASSIGNED_TO_ZONE
    http_status: 422
    applies_to: "POST /inspection-deployments"

  - priority: 32
    category: business_referential
    check: "the (zone_id, line_id) pair is not already present in ZoneLineAssignment"
    error_id: ERR_ASSIGNMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /zone-line-assignments"

  - priority: 33
    category: business_referential
    check: "zone_code is unique across FareZone; line_code is unique across TransitLine; badge_number is unique across Inspector; rider_ref is unique across Rider"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /fare-zones, POST /transit-lines, POST /inspectors, POST /riders"

  - priority: 34
    category: business_referential
    check: "no Citation already references this encounter_id, unless the request is a reissue of a citation DISMISSED with reason PROCEDURAL_DEFECT"
    error_id: ERR_ENCOUNTER_ALREADY_CITED
    http_status: 409
    applies_to: "POST /citations, POST /citations/{id}/reissue"

  - priority: 35
    category: business_referential
    check: "the referenced hearing's citation_id equals the body citation_id"
    error_id: ERR_HEARING_CITATION_MISMATCH
    http_status: 422
    applies_to: "POST /appeals"

  - priority: 36
    category: business_referential
    check: "no Appeal for this citation has status IN {SUBMITTED, SUPPLEMENT_REQUESTED}"
    error_id: ERR_APPEAL_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /appeals"

  - priority: 37
    category: business_referential
    check: "no CommunityServiceAssignment with status == ACTIVE and no PaymentPlan with status == ACTIVE exists for this citation, unless supersede_alternative == true on plan creation"
    error_id: ERR_ALTERNATIVE_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /payment-plans, POST /community-service-assignments"

  - priority: 38
    category: business_referential
    check: "the citation named by a reissue has dismissal_reason_code == PROCEDURAL_DEFECT"
    error_id: ERR_REISSUE_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /citations/{id}/reissue"

  - priority: 39
    category: business_temporal
    check: "window_start <= occurred_at < window_end of the referenced deployment AND occurred_at <= the logical clock"
    error_id: ERR_ENCOUNTER_OUTSIDE_WINDOW
    http_status: 422
    applies_to: "POST /inspection-encounters"

  - priority: 40
    category: business_temporal
    check: "no other InspectionDeployment on the same line_id with status IN {PLANNED, ACTIVE, CLOSED} has a half-open window [window_start, window_end) that intersects the requested half-open window"
    error_id: ERR_DEPLOYMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /inspection-deployments"

  - priority: 41
    category: business_temporal
    check: "the count of InspectionDeployment rows on the same zone_id with status IN {PLANNED, ACTIVE, CLOSED} whose CLOSED interval [window_start, window_end] intersects the requested closed interval is < zone.max_concurrent_deployments"
    error_id: ERR_ZONE_DEPLOYMENT_CAPACITY
    http_status: 409
    applies_to: "POST /inspection-deployments"

  - priority: 42
    category: business_temporal
    check: "the logical clock is <= citation.contest_deadline_at"
    error_id: ERR_CONTEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /citations/{id}/contest"

  - priority: 43
    category: business_temporal
    check: "the logical clock is <= hearing.decided_at + APPEAL_WINDOW_DAYS (21) days"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appeals"

  - priority: 44
    category: business_temporal
    check: "the logical clock is <= appeal.supplement_deadline_at"
    error_id: ERR_SUPPLEMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appeals/{id}/resubmit"

  - priority: 45
    category: business_temporal
    check: "the logical clock is <= citation.dismissed_at + REISSUE_WINDOW_DAYS (14) days"
    error_id: ERR_REISSUE_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /citations/{id}/reissue"

  - priority: 46
    category: business_constraint
    check: "appeal.round_index < APPEAL_MAX_ROUNDS (2)"
    error_id: ERR_APPEAL_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /appeals/{id}/resubmit"

  - priority: 47
    category: business_constraint
    check: "deployment.sample_adequacy_ratio >= 0.8000"
    error_id: ERR_SAMPLE_SIZE_INADEQUATE
    http_status: 409
    applies_to: "POST /inspection-deployments/{id}/close"

  - priority: 48
    category: business_constraint
    check: "2 <= installment_count <= 6"
    error_id: ERR_INSTALLMENT_COUNT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /payment-plans"

  - priority: 49
    category: business_constraint
    check: "dismissal_reason_code is present when decision == DISMISS (hearing) or GRANTED (appeal), and absent otherwise; reduced_penalty_cents is present if and only if decision == REDUCE"
    error_id: ERR_DECISION_FIELDS_INVALID
    http_status: 422
    applies_to: "POST /adjudication-hearings/{id}/decide, POST /appeals/{id}/decide"

  - priority: 50
    category: business_constraint
    check: "when dismissal_reason_code == FIRST_OFFENSE_DIVERSION, citation.offense_sequence == 1"
    error_id: ERR_DIVERSION_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /adjudication-hearings/{id}/decide, POST /appeals/{id}/decide"

  - priority: 51
    category: business_constraint
    check: "posted hours is an integer >= 1"
    error_id: ERR_INVALID_SERVICE_HOURS
    http_status: 422
    applies_to: "POST /community-service-assignments/{id}/log-hours"

  - priority: 52
    category: business_fiscal
    check: "down_payment_cents >= round_half_up(citation.outstanding_balance_cents * 1000 / 10000)"
    error_id: ERR_DOWN_PAYMENT_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /payment-plans"

  - priority: 53
    category: business_fiscal
    check: "down_payment_cents < citation.outstanding_balance_cents so financed_cents >= installment_count"
    error_id: ERR_DOWN_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /payment-plans"

  - priority: 54
    category: business_fiscal
    check: "citation.reduction_floor_cents <= reduced_penalty_cents < citation.assessed_penalty_cents"
    error_id: ERR_REDUCTION_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /adjudication-hearings/{id}/decide"

  - priority: 55
    category: business_fiscal
    check: "a direct payment's amount_cents is > 0 and <= citation.outstanding_balance_cents; an installment's amount_cents equals the scheduled amount of the next unpaid installment"
    error_id: ERR_PAYMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /citations/{id}/payments, POST /payment-plans/{id}/installments"

  - priority: 56
    category: business_fiscal
    check: "citation.outstanding_balance_cents > 0"
    error_id: ERR_NOTHING_OUTSTANDING
    http_status: 422
    applies_to: "POST /community-service-assignments, POST /citations/{id}/payments"

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================

endpoints:

  # ---- FareZone designation & signage -------------------------------------
  - method: POST
    path: "/fare-zones"
    description: "Register a proof-of-payment zone in DRAFT."
    roles: [EnforcementPlanner]
    code: 201
    input: [zone_code, name, required_sign_count, "penalty_multiplier_bps?", "enforcement_policy?", "max_concurrent_deployments?"]
    output: FareZone
    side_effects: ["designation_status := DRAFT", "verified_sign_count := 0, signage_compliance_pct := 0.0"]

  - method: POST
    path: "/fare-zones/{id}/submit-for-signage"
    description: "Move a DRAFT or SUSPENDED zone into PENDING_SIGNAGE."
    roles: [EnforcementPlanner]
    code: 200
    input: []
    output: FareZone
    side_effects: ["designation_status := PENDING_SIGNAGE", "suspension_reason := null", "increments FareZone.version by 1"]

  - method: POST
    path: "/fare-zones/{id}/designate"
    description: "Designate a PENDING_SIGNAGE zone once signage_compliance_pct >= 0.9000."
    roles: [EnforcementPlanner]
    code: 200
    input: []
    output: FareZone
    side_effects: ["designation_status := DESIGNATED", "designated_at := logical clock", "increments FareZone.version by 1"]

  - method: POST
    path: "/fare-zones/{id}/suspend"
    description: "Suspend a DESIGNATED zone for an administrative hold; voids its PLANNED and ACTIVE deployments and their PENDING encounters."
    roles: [EnforcementPlanner]
    code: 200
    input: []
    output: FareZone
    side_effects:
      - "designation_status := SUSPENDED, suspension_reason := ADMINISTRATIVE_HOLD"
      - "cascade: deployments -> VOIDED (void_reason ZONE_SUSPENDED) -> their PENDING encounters -> VOIDED -> deployment sample counters recomputed"
      - "increments FareZone.version by 1"

  - method: POST
    path: "/fare-zones/{id}/revoke"
    description: "Revoke zone designation; voids live citations in the zone and writes off their balances."
    roles: [EnforcementPlanner]
    code: 200
    input: []
    output: FareZone
    side_effects:
      - "designation_status := REVOKED"
      - "cascade: live Citations -> VOID (ZONE_NOT_DESIGNATED) -> settlement_status WRITTEN_OFF + ACTIVE plans/assignments CANCELLED -> DISMISSAL_REVERSAL PenaltyPayment appended when amount_paid_cents > 0"
      - "PLANNED and ACTIVE deployments -> VOIDED; SCHEDULED hearings -> CANCELLED"
      - "Rider.prior_citation_count and Inspector.citations_issued_count recomputed"
      - "increments FareZone.version by 1"

  - method: GET
    path: "/fare-zones/{id}"
    description: "Read one zone including verified_sign_count and signage_compliance_pct."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector, HearingOfficer, AppealsBoardMember, Rider]
    code: 200
    input: []
    output: FareZone
    side_effects: []

  - method: GET
    path: "/fare-zones"
    description: "List zones with optional designation_status filter and pagination."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector, HearingOfficer, AppealsBoardMember, Rider]
    code: 200
    input: ["designation_status?", "limit?", "offset?"]
    output: FareZone[]
    side_effects: []

  - method: GET
    path: "/fare-zones/{id}/signage-audits"
    description: "List the signage audits filed against a zone (FK reverse-reachability for SignageAudit.zone_id)."
    roles: [EnforcementPlanner, EquityAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: SignageAudit[]
    side_effects: []

  - method: POST
    path: "/signage-audits"
    description: "File a physical signage count; recomputes the zone's compliance and can auto-suspend a DESIGNATED zone."
    roles: [EnforcementPlanner]
    code: 201
    input: [zone_id, audited_at, signs_verified_count, "deficiency_note?"]
    output: SignageAudit
    side_effects:
      - "auditor_user_id := acting X-User-ID"
      - "recomputes FareZone.verified_sign_count and signage_compliance_pct per calculations.zone_signage_compliance_pct"
      - "cascade when the zone is DESIGNATED and the new pct < 0.9000: zone -> SUSPENDED (SIGNAGE_DEFICIENCY) -> deployments -> VOIDED -> PENDING encounters -> VOIDED -> deployment sample counters recomputed"
      - "increments FareZone.version by 1"

  # ---- Lines & zone-line assignments -------------------------------------
  - method: POST
    path: "/transit-lines"
    description: "Register a transit line with its sampling-frame size and baseline evasion rate."
    roles: [EnforcementPlanner]
    code: 201
    input: [line_code, mode, daily_boardings, baseline_evasion_rate_bps]
    output: TransitLine
    side_effects: []

  - method: GET
    path: "/transit-lines/{id}"
    description: "Read one transit line."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector]
    code: 200
    input: []
    output: TransitLine
    side_effects: []

  - method: POST
    path: "/zone-line-assignments"
    description: "Attach a line's platform segments to a proof-of-payment zone (immutable junction row)."
    roles: [EnforcementPlanner]
    code: 201
    input: [zone_id, line_id, platform_segment_count, effective_from]
    output: ZoneLineAssignment
    side_effects: []

  - method: GET
    path: "/zone-line-assignments/{id}"
    description: "Read one zone-line assignment."
    roles: [EnforcementPlanner, EquityAnalyst]
    code: 200
    input: []
    output: ZoneLineAssignment
    side_effects: []

  - method: GET
    path: "/zone-line-assignments"
    description: "List zone-line assignments (FK reverse-reachability for zone_id and line_id)."
    roles: [EnforcementPlanner, EquityAnalyst]
    code: 200
    input: ["zone_id?", "line_id?", "limit?", "offset?"]
    output: ZoneLineAssignment[]
    side_effects: []

  # ---- Inspectors & riders ------------------------------------------------
  - method: POST
    path: "/inspectors"
    description: "Register a fare inspector."
    roles: [EnforcementPlanner]
    code: 201
    input: [badge_number, display_name, certification_expiry, "status?"]
    output: Inspector
    side_effects: ["citations_issued_count := 0"]

  - method: GET
    path: "/inspectors/{id}"
    description: "Read one inspector including citations_issued_count."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector, HearingOfficer]
    code: 200
    input: []
    output: Inspector
    side_effects: []

  - method: POST
    path: "/riders"
    description: "Register a rider record with the demographic and geographic attributes used by equity analysis."
    roles: [EnforcementPlanner]
    code: 201
    input: [rider_ref, display_name, demographic_band, residence_geo_tract, "fare_assistance_enrolled?"]
    output: Rider
    side_effects: ["prior_warning_count := 0, prior_citation_count := 0"]

  - method: GET
    path: "/riders/{id}"
    description: "Read one rider including prior_warning_count and prior_citation_count."
    roles: [EnforcementPlanner, EquityAnalyst, Rider, HearingOfficer, AppealsBoardMember]
    code: 200
    input: []
    output: Rider
    side_effects: []

  # ---- Inspection deployments --------------------------------------------
  - method: POST
    path: "/inspection-deployments"
    description: "Plan a sampled inspection deployment on one line inside one zone."
    roles: [EnforcementPlanner]
    code: 201
    input: [line_id, zone_id, window_start, window_end, planned_inspector_count, sampling_method, target_sample_size]
    output: InspectionDeployment
    side_effects: ["status := PLANNED", "achieved_sample_count := 0, voided_encounter_count := 0, sample_adequacy_ratio := 0.0"]

  - method: POST
    path: "/inspection-deployments/{id}/activate"
    description: "Activate a PLANNED deployment; requires the zone to be DESIGNATED and the clock to have reached window_start."
    roles: [EnforcementPlanner]
    code: 200
    input: []
    output: InspectionDeployment
    side_effects: ["status := ACTIVE", "increments InspectionDeployment.version by 1"]

  - method: POST
    path: "/inspection-deployments/{id}/close"
    description: "Close an ACTIVE deployment; freezes both evasion-rate variants and the enforcement cost."
    roles: [EnforcementPlanner]
    code: 200
    input: []
    output: InspectionDeployment
    side_effects:
      - "status := CLOSED"
      - "measured_evasion_rate_bps, resolved_evasion_rate_bps := calculations.deployment_evasion_rate_bps (both variants)"
      - "enforcement_cost_cents := calculations.deployment_enforcement_cost_cents"
      - "increments InspectionDeployment.version by 1"

  - method: POST
    path: "/inspection-deployments/{id}/void"
    description: "Void a PLANNED or ACTIVE deployment; voids its PENDING encounters."
    roles: [EnforcementPlanner]
    code: 200
    input: []
    output: InspectionDeployment
    side_effects:
      - "status := VOIDED, void_reason := PLANNER_CANCELLED"
      - "PENDING encounters -> VOIDED; achieved_sample_count, voided_encounter_count and sample_adequacy_ratio recomputed"
      - "increments InspectionDeployment.version by 1"

  - method: GET
    path: "/inspection-deployments/{id}"
    description: "Read one deployment with its sampling and cost fields."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector]
    code: 200
    input: []
    output: InspectionDeployment
    side_effects: []

  - method: GET
    path: "/inspection-deployments"
    description: "List deployments (FK reverse-reachability for line_id and zone_id)."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector]
    code: 200
    input: ["line_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: InspectionDeployment[]
    side_effects: []

  # ---- Inspection encounters ---------------------------------------------
  - method: POST
    path: "/inspection-encounters"
    description: "Record a sampled encounter under an ACTIVE deployment; derives validation_result from the presented fare media."
    roles: [FareInspector]
    code: 201
    input: [deployment_id, inspector_id, "rider_id?", occurred_at, fare_media_type, "media_reference?", "media_validated_at?", "media_expires_at?", "media_zone_code?", identity_capture_method]
    output: InspectionEncounter
    side_effects:
      - "outcome := PENDING"
      - "validation_result := calculations.encounter_validation_result"
      - "deployment.achieved_sample_count and sample_adequacy_ratio recomputed"

  - method: POST
    path: "/inspection-encounters/{id}/resolve"
    description: "Resolve a PENDING encounter as COMPLIANT, WARNING_ISSUED or UNRESOLVED_IDENTITY (the 4th branch, CITATION_ISSUED, is reached through POST /citations)."
    roles: [FareInspector]
    code: 200
    input: [disposition]
    output: InspectionEncounter
    side_effects:
      - "outcome := disposition"
      - "on WARNING_ISSUED: Rider.prior_warning_count recomputed"
      - "increments InspectionEncounter.version by 1"

  - method: GET
    path: "/inspection-encounters/{id}"
    description: "Read one encounter including its computed validation_result."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector, HearingOfficer, AppealsBoardMember]
    code: 200
    input: []
    output: InspectionEncounter
    side_effects: []

  - method: GET
    path: "/inspection-encounters"
    description: "List encounters (FK reverse-reachability for deployment_id, inspector_id and rider_id)."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector, HearingOfficer, AppealsBoardMember]
    code: 200
    input: ["deployment_id?", "inspector_id?", "rider_id?", "outcome?", "limit?", "offset?"]
    output: InspectionEncounter[]
    side_effects: []

  # ---- Citations ----------------------------------------------------------
  - method: POST
    path: "/citations"
    description: "Issue a citation for a PENDING non-compliant encounter; computes the progressive penalty, the admin fee band and the reduction floor."
    roles: [FareInspector]
    code: 201
    input: [encounter_id]
    output: Citation
    side_effects:
      - "encounter.outcome := CITATION_ISSUED"
      - "offense_sequence := calculations.citation_offense_sequence variant warning_inclusive; citation_only_sequence := variant citation_only"
      - "assessed_penalty_cents := calculations.citation_assessed_penalty_cents; admin_fee_cents := calculations.citation_admin_fee_cents"
      - "total_due_cents := assessed_penalty_cents + admin_fee_cents; outstanding_balance_cents := total_due_cents"
      - "reduction_floor_cents, contest_deadline_at set; adjudication_status := ISSUED, settlement_status := OUTSTANDING"
      - "Rider.prior_citation_count and Inspector.citations_issued_count incremented"
      - "increments InspectionEncounter.version by 1"

  - method: GET
    path: "/citations/{id}"
    description: "Read one citation with its money identity fields and both status dimensions."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector, HearingOfficer, AppealsBoardMember, Rider]
    code: 200
    input: []
    output: Citation
    side_effects: []

  - method: GET
    path: "/citations"
    description: "List citations (FK reverse-reachability for encounter_id, rider_id, zone_id, issuing_inspector_id and reissued_from_citation_id)."
    roles: [EnforcementPlanner, EquityAnalyst, FareInspector, HearingOfficer, AppealsBoardMember, Rider]
    code: 200
    input: ["rider_id?", "zone_id?", "encounter_id?", "issuing_inspector_id?", "reissued_from_citation_id?", "adjudication_status?", "settlement_status?", "limit?", "offset?"]
    output: Citation[]
    side_effects: []

  - method: GET
    path: "/citations/{id}/payments"
    description: "List the penalty payments and credits applied to a citation (FK reverse-reachability for PenaltyPayment.citation_id)."
    roles: [EnforcementPlanner, HearingOfficer, AppealsBoardMember, Rider]
    code: 200
    input: ["limit?", "offset?"]
    output: PenaltyPayment[]
    side_effects: []

  - method: POST
    path: "/citations/{id}/contest"
    description: "Rider contests an ISSUED citation inside the 30-day contest window; schedules an administrative hearing."
    roles: [Rider]
    code: 201
    input: []
    output: AdjudicationHearing
    side_effects:
      - "citation.adjudication_status := CONTESTED"
      - "hearing created with status SCHEDULED, decision PENDING, scheduled_for := clock + 14 days"
      - "requested_by_rider_id := citation.rider_id"
      - "increments Citation.version by 1"

  - method: POST
    path: "/citations/{id}/payments"
    description: "Apply a direct payment against a citation's outstanding balance."
    roles: [Rider, EnforcementPlanner]
    code: 201
    input: [amount_cents]
    output: PenaltyPayment
    side_effects:
      - "source := DIRECT, applied_at := logical clock"
      - "citation.amount_paid_cents += amount_cents; outstanding_balance_cents := calculations.citation_outstanding_balance_cents"
      - "citation.settlement_status := SATISFIED when outstanding_balance_cents reaches 0"
      - "increments Citation.version by 1"

  - method: POST
    path: "/citations/{id}/reissue"
    description: "Reissue a citation dismissed for a procedural defect within the 14-day reissue window; the new citation carries reissued_from_citation_id."
    roles: [EnforcementPlanner]
    code: 201
    input: []
    output: Citation
    side_effects:
      - "new Citation created with reissued_from_citation_id := {id}, adjudication_status ISSUED, settlement_status OUTSTANDING"
      - "penalty recomputed at the original offense_sequence; admin fee band re-derived"
      - "Rider.prior_citation_count and Inspector.citations_issued_count incremented"

  # ---- Administrative adjudication ---------------------------------------
  - method: POST
    path: "/adjudication-hearings/{id}/decide"
    description: "Hearing officer decides a SCHEDULED hearing: UPHOLD, REDUCE (to at least the reduction floor) or DISMISS."
    roles: [HearingOfficer]
    code: 200
    input: [decision, "dismissal_reason_code?", "reduced_penalty_cents?"]
    output: AdjudicationHearing
    side_effects:
      - "hearing.status := HELD, decision := input decision, decided_at := logical clock, hearing_officer_user_id := acting X-User-ID"
      - "citation.adjudication_status := UPHELD | REDUCED | DISMISSED"
      - "on REDUCE: assessed_penalty_cents := reduced_penalty_cents, admin_fee_cents re-derived from the new band, total_due_cents and outstanding_balance_cents recomputed"
      - "on DISMISS: cascade -> settlement_status WRITTEN_OFF, ACTIVE plan/assignment CANCELLED, DISMISSAL_REVERSAL PenaltyPayment appended when amount_paid_cents > 0, Rider.prior_citation_count and Inspector.citations_issued_count decremented"
      - "increments Citation.version by 1"

  - method: POST
    path: "/adjudication-hearings/{id}/cancel"
    description: "Cancel a SCHEDULED hearing; the citation returns to ISSUED."
    roles: [HearingOfficer]
    code: 200
    input: []
    output: AdjudicationHearing
    side_effects: ["hearing.status := CANCELLED", "citation.adjudication_status := ISSUED", "increments Citation.version by 1"]

  - method: GET
    path: "/adjudication-hearings/{id}"
    description: "Read one hearing."
    roles: [EnforcementPlanner, HearingOfficer, AppealsBoardMember, Rider, EquityAnalyst]
    code: 200
    input: []
    output: AdjudicationHearing
    side_effects: []

  - method: GET
    path: "/adjudication-hearings"
    description: "List hearings (FK reverse-reachability for citation_id and requested_by_rider_id)."
    roles: [EnforcementPlanner, HearingOfficer, AppealsBoardMember, Rider, EquityAnalyst]
    code: 200
    input: ["citation_id?", "requested_by_rider_id?", "status?", "limit?", "offset?"]
    output: AdjudicationHearing[]
    side_effects: []

  # ---- Appeals ------------------------------------------------------------
  - method: POST
    path: "/appeals"
    description: "Appeal a HELD hearing that upheld or reduced a citation, within the 21-day appeal window."
    roles: [Rider]
    code: 201
    input: [citation_id, hearing_id, grounds_code, statement]
    output: Appeal
    side_effects:
      - "status := SUBMITTED, round_index := 1, submitted_at := logical clock"
      - "appellant_rider_id := citation.rider_id"

  - method: POST
    path: "/appeals/{id}/request-supplement"
    description: "Board member returns a SUBMITTED appeal for supplementation and opens a 14-day supplement window."
    roles: [AppealsBoardMember]
    code: 200
    input: []
    output: Appeal
    side_effects:
      - "status := SUPPLEMENT_REQUESTED, supplement_deadline_at := clock + 14 days"
      - "increments Appeal.version by 1"

  - method: POST
    path: "/appeals/{id}/resubmit"
    description: "Appellant resupplies a SUPPLEMENT_REQUESTED appeal before its supplement deadline; each resubmission consumes one of the 2 allowed rounds."
    roles: [Rider]
    code: 200
    input: [statement]
    output: Appeal
    side_effects:
      - "status := SUBMITTED, round_index += 1, submitted_at := logical clock, supplement_deadline_at := null"
      - "increments Appeal.version by 1"

  - method: POST
    path: "/appeals/{id}/decide"
    description: "Board member grants or denies a SUBMITTED appeal; a grant dismisses the citation and unwinds all settlement artifacts."
    roles: [AppealsBoardMember]
    code: 200
    input: [decision, "dismissal_reason_code?"]
    output: Appeal
    side_effects:
      - "status := GRANTED | DENIED, decided_at := logical clock, decided_by_user_id := acting X-User-ID"
      - "on GRANTED: cascade link 1 citation.adjudication_status := DISMISSED with dismissal_reason_code -> link 2 settlement_status := WRITTEN_OFF and outstanding_balance_cents := 0 -> link 3 ACTIVE PaymentPlan := CANCELLED and ACTIVE CommunityServiceAssignment := CANCELLED -> link 4 DISMISSAL_REVERSAL PenaltyPayment appended when amount_paid_cents > 0"
      - "on GRANTED: Rider.prior_citation_count and Inspector.citations_issued_count decremented"
      - "increments Citation.version by 1"

  - method: POST
    path: "/appeals/{id}/withdraw"
    description: "Appellant withdraws a SUBMITTED or SUPPLEMENT_REQUESTED appeal; the citation keeps its hearing outcome."
    roles: [Rider]
    code: 200
    input: []
    output: Appeal
    side_effects: ["status := WITHDRAWN, decided_at := logical clock", "increments Appeal.version by 1"]

  - method: GET
    path: "/appeals/{id}"
    description: "Read one appeal including round_index and supplement_deadline_at."
    roles: [EnforcementPlanner, HearingOfficer, AppealsBoardMember, Rider, EquityAnalyst]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: GET
    path: "/appeals"
    description: "List appeals (FK reverse-reachability for citation_id, hearing_id and appellant_rider_id)."
    roles: [EnforcementPlanner, HearingOfficer, AppealsBoardMember, Rider, EquityAnalyst]
    code: 200
    input: ["citation_id?", "hearing_id?", "appellant_rider_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []

  # ---- Payment plans ------------------------------------------------------
  - method: POST
    path: "/payment-plans"
    description: "Open an installment plan against a citation. expected_citation_version is the citation's last-read version; a stale value is rejected with 412 so that a plan is never opened over a citation whose balance moved."
    roles: [Rider, EnforcementPlanner]
    code: 201
    input: [citation_id, installment_count, down_payment_cents, expected_citation_version, "supersede_alternative?"]
    output: PaymentPlan
    side_effects:
      - "financed_cents := outstanding_balance_cents - down_payment_cents; base_installment_cents and final_installment_cents := calculations.payment_plan_schedule"
      - "first_due_at := clock + 30 days; status := ACTIVE; installments_paid_count := 0, missed_installment_count := 0"
      - "DOWN_PAYMENT PenaltyPayment appended; citation.amount_paid_cents += down_payment_cents; outstanding_balance_cents recomputed"
      - "citation.settlement_status := PLAN_ACTIVE"
      - "when supersede_alternative is true and the citation has an ACTIVE CommunityServiceAssignment: that assignment := FORFEITED (its already-credited SERVICE_CREDIT ledger rows are retained) and settlement_status moves SERVICE_ACTIVE -> PLAN_ACTIVE; supersede_alternative defaults to false, in which case an ACTIVE alternative is refused by validations priority 37"
      - "increments Citation.version by 1"

  - method: POST
    path: "/payment-plans/{id}/installments"
    description: "Pay the next scheduled installment on an ACTIVE plan."
    roles: [Rider, EnforcementPlanner]
    code: 201
    input: [amount_cents]
    output: PenaltyPayment
    side_effects:
      - "source := PLAN_INSTALLMENT, applied_at := logical clock, plan_id := {id}"
      - "plan.installments_paid_count += 1; remaining_balance_cents recomputed"
      - "citation.amount_paid_cents += amount_cents; outstanding_balance_cents := calculations.citation_outstanding_balance_cents"
      - "plan.status := COMPLETED and citation.settlement_status := SATISFIED when remaining_balance_cents reaches 0"
      - "increments Citation.version by 1"

  - method: POST
    path: "/payment-plans/{id}/assess-delinquency"
    description: "Evaluate an ACTIVE plan against the logical clock; missed installments accumulate and 2 missed installments default the plan."
    roles: [EnforcementPlanner]
    code: 200
    input: []
    output: PaymentPlan
    side_effects:
      - "missed_installment_count := calculations.plan_delinquency_assessment"
      - "status := DEFAULTED when missed_installment_count >= 2; citation.settlement_status := OUTSTANDING"
      - "increments PaymentPlan.version by 1 and Citation.version by 1 on default"

  - method: GET
    path: "/payment-plans/{id}"
    description: "Read one plan with its installment schedule and delinquency counters."
    roles: [EnforcementPlanner, Rider, HearingOfficer, AppealsBoardMember]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []

  - method: GET
    path: "/payment-plans"
    description: "List plans (FK reverse-reachability for PaymentPlan.citation_id)."
    roles: [EnforcementPlanner, Rider, HearingOfficer, AppealsBoardMember]
    code: 200
    input: ["citation_id?", "status?", "limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []

  - method: GET
    path: "/payment-plans/{id}/payments"
    description: "List the payments booked against a plan (FK reverse-reachability for PenaltyPayment.plan_id)."
    roles: [EnforcementPlanner, Rider, HearingOfficer, AppealsBoardMember]
    code: 200
    input: ["limit?", "offset?"]
    output: PenaltyPayment[]
    side_effects: []

  # ---- Community service alternative --------------------------------------
  - method: POST
    path: "/community-service-assignments"
    description: "Open a community-service alternative against a citation. expected_citation_version is the citation's last-read version; a stale value is rejected with 412 so that hours are never assigned against a moved balance."
    roles: [Rider, EnforcementPlanner]
    code: 201
    input: [citation_id, partner_org_name, expected_citation_version]
    output: CommunityServiceAssignment
    side_effects:
      - "required_hours := calculations.service_hours_required; hours_completed := 0, credited_cents := 0; status := ACTIVE"
      - "citation.settlement_status := SERVICE_ACTIVE"
      - "increments Citation.version by 1"

  - method: POST
    path: "/community-service-assignments/{id}/log-hours"
    description: "Credit completed service hours at 1500 cents per hour, capped at the citation's outstanding balance."
    roles: [EnforcementPlanner]
    code: 200
    input: [hours]
    output: CommunityServiceAssignment
    side_effects:
      - "hours_completed += hours; credited_cents recomputed and capped at citation.outstanding_balance_cents"
      - "SERVICE_CREDIT PenaltyPayment appended with hours_credited set"
      - "citation.service_credit_cents += credit; outstanding_balance_cents := calculations.citation_outstanding_balance_cents"
      - "status := COMPLETED and citation.settlement_status := SATISFIED when hours_completed >= required_hours or outstanding_balance_cents reaches 0"
      - "increments Citation.version by 1"

  - method: GET
    path: "/community-service-assignments/{id}"
    description: "Read one community-service assignment."
    roles: [EnforcementPlanner, Rider, HearingOfficer, AppealsBoardMember]
    code: 200
    input: []
    output: CommunityServiceAssignment
    side_effects: []

  - method: GET
    path: "/community-service-assignments"
    description: "List community-service assignments (FK reverse-reachability for CommunityServiceAssignment.citation_id)."
    roles: [EnforcementPlanner, Rider, HearingOfficer, AppealsBoardMember]
    code: 200
    input: ["citation_id?", "status?", "limit?", "offset?"]
    output: CommunityServiceAssignment[]
    side_effects: []

  # ---- Equity and revenue reporting ---------------------------------------
  - method: GET
    path: "/reports/equity-distribution"
    description: "Citation-distribution equity report over a closed window, grouped by demographic band or residence geo tract. Groups are ordered by group_key ascending. An empty encounter pool yields groups_evaluated 0, systemwide_citation_rate 0.0000 and disparity_index 0.0000 rather than an error."
    roles: [EnforcementPlanner, EquityAnalyst]
    code: 200
    input: [window_start, window_end, group_by]
    output:
      window_start: "string (ISO-8601 UTC, echo of input)"
      window_end: "string (ISO-8601 UTC, echo of input)"
      group_by: "string enum {DEMOGRAPHIC_BAND, GEO_TRACT} (echo of input)"
      groups_evaluated: "integer count of groups with encounter_pool_count > 0"
      encounter_pool_count: "integer total non-voided encounters in the window"
      citation_count: "integer total citations issued in the window excluding VOID and DISMISSED"
      systemwide_citation_rate: "decimal string with 4 decimal places, half-up"
      disparity_index: "decimal string with 4 decimal places, half-up, per calculations.equity_disparity_index"
      groups: "array of objects {group_key: string, encounter_pool_count: integer, citation_count: integer, citation_rate: decimal(4) string, rate_delta: decimal(4) string}"
    side_effects: []

  - method: GET
    path: "/reports/revenue-recovery"
    description: "Revenue recovery versus enforcement cost over a closed window under either the ACCRUAL or the CASH basis (dual-variant, see calculations.revenue_recovery)."
    roles: [EnforcementPlanner, EquityAnalyst]
    code: 200
    input: [window_start, window_end, basis]
    output:
      window_start: "string (ISO-8601 UTC, echo of input)"
      window_end: "string (ISO-8601 UTC, echo of input)"
      basis: "string enum {ACCRUAL, CASH} (echo of input)"
      citations_counted: "integer; under ACCRUAL the count of live citations issued in the window, under CASH the count of distinct citation_id values on ledger rows applied in the window"
      deployments_counted: "integer count of InspectionDeployment rows with status CLOSED whose window_start falls in the reporting window"
      recovered_cents: "integer recovery leg per the selected variant of calculations.revenue_recovery"
      enforcement_cost_cents: "integer sum of enforcement_cost_cents over the counted deployments"
      net_recovery_cents: "integer recovered_cents minus enforcement_cost_cents (may be negative)"
      recovery_ratio_bps: "integer basis points, round_half_up; 0 when enforcement_cost_cents is 0"
    side_effects: []

  # ---- Logical clock ------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the deterministic logical clock used by every temporal rule (contest deadlines, appeal and supplement windows, installment due dates, certification expiry, deployment windows). The default logical clock at process start is 2026-08-01T00:00:00Z."
    roles: [EnforcementPlanner, FareInspector, HearingOfficer, AppealsBoardMember, EquityAnalyst, Rider]
    code: 200
    input: [to_iso8601]
    output:
      current_utc: "string (ISO-8601 UTC, the clock value now in effect)"
    side_effects: ["logical clock advanced or rewound to the supplied instant; no business records are modified"]

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================

errors:

  # ---- auth ---------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in §1.7"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is declared but is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "acting role Rider and X-User-ID differs from the citation's rider_id (or the appeal's appellant_rider_id / the plan's citation.rider_id)"
  - id: ERR_INSPECTOR_NOT_ON_ENCOUNTER
    http: 403
    condition: "acting role FareInspector and X-User-ID differs from the encounter's inspector_id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting AppealsBoardMember's X-User-ID equals the hearing_officer_user_id recorded on the hearing the appeal was filed against — the officer who adjudicated a citation may not also act on its appeal"

  # ---- request schema -----------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, a field has the wrong JSON type, an enum value is outside its declared set, or a numeric field is outside its declared range"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "window_start >= window_end on a deployment or a report request, or an ISO-8601 instant is unparseable or not UTC"

  # ---- not found ----------------------------------------------------------
  - id: ERR_ZONE_NOT_FOUND
    http: 404
    condition: "the fare zone named by the path id or by zone_id does not exist"
  - id: ERR_LINE_NOT_FOUND
    http: 404
    condition: "the transit line named by the path id or by line_id does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "the zone-line assignment named by the path id does not exist"
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "the inspector named by the path id or by inspector_id does not exist"
  - id: ERR_RIDER_NOT_FOUND
    http: 404
    condition: "the rider named by the path id or by rider_id does not exist"
  - id: ERR_DEPLOYMENT_NOT_FOUND
    http: 404
    condition: "the inspection deployment named by the path id or by deployment_id does not exist"
  - id: ERR_ENCOUNTER_NOT_FOUND
    http: 404
    condition: "the inspection encounter named by the path id or by encounter_id does not exist"
  - id: ERR_CITATION_NOT_FOUND
    http: 404
    condition: "the citation named by the path id or by citation_id does not exist"
  - id: ERR_HEARING_NOT_FOUND
    http: 404
    condition: "the adjudication hearing named by the path id or by hearing_id does not exist"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "the appeal named by the path id does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "the payment plan named by the path id does not exist"
  - id: ERR_SERVICE_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "the community-service assignment named by the path id does not exist"

  # ---- optimistic concurrency --------------------------------------------
  - id: ERR_STALE_CITATION_VERSION
    http: 412
    condition: "expected_citation_version does not equal the citation's current version on POST /payment-plans or POST /community-service-assignments"

  # ---- state --------------------------------------------------------------
  - id: ERR_INVALID_ZONE_STATE
    http: 409
    condition: "the requested zone transition is not declared from the zone's current designation_status"
  - id: ERR_INVALID_DEPLOYMENT_STATE
    http: 409
    condition: "the requested deployment transition is not declared from the deployment's current status"
  - id: ERR_DEPLOYMENT_NOT_ACTIVE
    http: 409
    condition: "an encounter is recorded against a deployment whose status is not ACTIVE"
  - id: ERR_ENCOUNTER_NOT_PENDING
    http: 409
    condition: "an encounter is resolved or cited while its outcome is not PENDING"
  - id: ERR_OPEN_ENCOUNTERS_REMAIN
    http: 409
    condition: "a deployment is closed while at least one of its encounters is still PENDING"
  - id: ERR_CITATION_STATUS_INVALID
    http: 409
    condition: "the operation requires a citation adjudication_status the citation is not in (contest requires ISSUED; reissue requires DISMISSED; a plan or service alternative requires ISSUED, UPHELD or REDUCED)"
  - id: ERR_SETTLEMENT_STATUS_INVALID
    http: 409
    condition: "the operation requires a citation settlement_status the citation is not in (a new plan or assignment requires OUTSTANDING; SATISFIED, WRITTEN_OFF, PLAN_ACTIVE and SERVICE_ACTIVE are refused)"
  - id: ERR_HEARING_NOT_SCHEDULED
    http: 409
    condition: "a hearing is decided or cancelled while its status is not SCHEDULED"
  - id: ERR_HEARING_NOT_APPEALABLE
    http: 409
    condition: "an appeal is filed against a hearing whose status is not HELD or whose decision is DISMISS or PENDING"
  - id: ERR_APPEAL_STATUS_INVALID
    http: 409
    condition: "the requested appeal transition is not declared from the appeal's current status"
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "an installment or a delinquency assessment targets a plan whose status is not ACTIVE"
  - id: ERR_SERVICE_NOT_ACTIVE
    http: 409
    condition: "hours are logged against a community-service assignment whose status is not ACTIVE"

  # ---- business safety ----------------------------------------------------
  - id: ERR_ZONE_NOT_DESIGNATED
    http: 409
    condition: "a deployment is activated, an encounter is recorded, or a citation is issued while the governing zone's designation_status is not DESIGNATED"
  - id: ERR_SIGNAGE_BELOW_THRESHOLD
    http: 409
    condition: "a zone is designated while signage_compliance_pct < 0.9000"
  - id: ERR_INSPECTOR_SUSPENDED
    http: 409
    condition: "the encounter's inspector has status SUSPENDED"
  - id: ERR_INSPECTOR_CERT_EXPIRED
    http: 409
    condition: "the encounter's inspector has certification_expiry strictly before the encounter's occurred_at"
  - id: ERR_IDENTITY_NOT_ESTABLISHED
    http: 422
    condition: "a citation is issued for an encounter whose rider_id is null or whose identity_capture_method is REFUSED"
  - id: ERR_WARNING_REQUIRED_FIRST_OFFENSE
    http: 409
    condition: "a citation is issued on a first offense inside a zone whose enforcement_policy is WARNING_FIRST"
  - id: ERR_DISPOSITION_NOT_SUPPORTED
    http: 409
    condition: "a resolve disposition contradicts the encounter's computed validation_result (COMPLIANT requires VALID; UNRESOLVED_IDENTITY requires a null rider_id or a REFUSED identity capture)"

  # ---- business referential ----------------------------------------------
  - id: ERR_LINE_NOT_ASSIGNED_TO_ZONE
    http: 422
    condition: "a deployment names a line that has no zone-line assignment to the named zone effective at window_start"
  - id: ERR_ASSIGNMENT_ALREADY_EXISTS
    http: 409
    condition: "a zone-line assignment already exists for this zone_id and line_id pair"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "zone_code, line_code, badge_number or rider_ref duplicates an existing record"
  - id: ERR_ENCOUNTER_ALREADY_CITED
    http: 409
    condition: "a citation already exists for the named encounter_id"
  - id: ERR_HEARING_CITATION_MISMATCH
    http: 422
    condition: "an appeal names a hearing whose citation_id differs from the appeal's citation_id"
  - id: ERR_APPEAL_ALREADY_OPEN
    http: 409
    condition: "the citation already has an appeal in SUBMITTED or SUPPLEMENT_REQUESTED, or an appeal that reached GRANTED or DENIED"
  - id: ERR_ALTERNATIVE_ALREADY_ACTIVE
    http: 409
    condition: "the citation already has an ACTIVE PaymentPlan or an ACTIVE CommunityServiceAssignment"
  - id: ERR_REISSUE_NOT_PERMITTED
    http: 409
    condition: "reissue targets a citation whose dismissal_reason_code is not PROCEDURAL_DEFECT"

  # ---- business temporal --------------------------------------------------
  - id: ERR_ENCOUNTER_OUTSIDE_WINDOW
    http: 422
    condition: "occurred_at falls outside the deployment's half-open window [window_start, window_end)"
  - id: ERR_DEPLOYMENT_WINDOW_OVERLAP
    http: 409
    condition: "a live deployment on the same line has a half-open window [window_start, window_end) that overlaps the requested window; adjacency is allowed"
  - id: ERR_ZONE_DEPLOYMENT_CAPACITY
    http: 409
    condition: "adding the deployment would make the count of live deployments whose closed intervals [window_start, window_end] contain any instant of the requested closed interval reach the zone's max_concurrent_deployments"
  - id: ERR_CONTEST_WINDOW_CLOSED
    http: 422
    condition: "a contest is filed after the citation's contest_deadline_at (issued_at + 30 days)"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "an appeal is filed more than 21 days after the hearing's decided_at"
  - id: ERR_SUPPLEMENT_WINDOW_CLOSED
    http: 422
    condition: "a resubmission arrives after the appeal's supplement_deadline_at"
  - id: ERR_REISSUE_WINDOW_CLOSED
    http: 422
    condition: "a reissue is requested more than 14 days after the citation's dismissed_at"

  # ---- business constraint ------------------------------------------------
  - id: ERR_APPEAL_ROUND_LIMIT
    http: 409
    condition: "a resubmission would push round_index beyond the 2 permitted appeal rounds"
  - id: ERR_SAMPLE_SIZE_INADEQUATE
    http: 409
    condition: "a deployment is closed while sample_adequacy_ratio would be strictly below 0.8000"
  - id: ERR_INSTALLMENT_COUNT_OUT_OF_RANGE
    http: 422
    condition: "installment_count is below 2 or above 6"
  - id: ERR_DECISION_FIELDS_INVALID
    http: 422
    condition: "a hearing or appeal decision omits a field its branch requires or supplies one its branch forbids (REDUCE requires reduced_penalty_cents and forbids dismissal_reason_code; DISMISS and GRANTED require dismissal_reason_code and forbid reduced_penalty_cents; UPHOLD and DENIED forbid both)"
  - id: ERR_DIVERSION_NOT_ELIGIBLE
    http: 422
    condition: "dismissal_reason_code FIRST_OFFENSE_DIVERSION is used on a citation whose offense_sequence is greater than 1"
  - id: ERR_INVALID_SERVICE_HOURS
    http: 422
    condition: "the posted hours value is not an integer greater than or equal to 1"

  # ---- business fiscal ----------------------------------------------------
  - id: ERR_DOWN_PAYMENT_BELOW_MINIMUM
    http: 422
    condition: "down_payment_cents is below 10 percent of the citation's outstanding_balance_cents, rounded half-up"
  - id: ERR_DOWN_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "down_payment_cents is greater than or equal to the citation's outstanding_balance_cents, leaving nothing to finance"
  - id: ERR_REDUCTION_BELOW_FLOOR
    http: 422
    condition: "reduced_penalty_cents is below the citation's reduction_floor_cents or is greater than or equal to assessed_penalty_cents"
  - id: ERR_PAYMENT_AMOUNT_INVALID
    http: 422
    condition: "a direct payment amount is not positive or exceeds the outstanding balance, or an installment amount differs from the next unpaid scheduled amount"
  - id: ERR_NOTHING_OUTSTANDING
    http: 422
    condition: "a payment, plan or service alternative targets a citation whose outstanding_balance_cents is 0"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
# Role model: segregation_of_duties. The three decision stages of a citation are
# held by three different roles (FareInspector issues, HearingOfficer adjudicates,
# AppealsBoardMember hears the appeal), and validations priority 11 additionally
# forbids the SAME X-User-ID from acting at two stages of one citation.

roles:

  - name: EnforcementPlanner
    description: "Agency enforcement planner: designates proof-of-payment zones, files signage audits, maintains the line network and the inspector and rider registries, plans and closes sampled deployments, administers settlement artifacts and reads both analytics reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /fare-zones"
      - "POST /fare-zones/{id}/submit-for-signage"
      - "POST /fare-zones/{id}/designate"
      - "POST /fare-zones/{id}/suspend"
      - "POST /fare-zones/{id}/revoke"
      - "POST /signage-audits"
      - "POST /transit-lines"
      - "POST /zone-line-assignments"
      - "POST /inspectors"
      - "POST /riders"
      - "POST /inspection-deployments"
      - "POST /inspection-deployments/{id}/activate"
      - "POST /inspection-deployments/{id}/close"
      - "POST /inspection-deployments/{id}/void"
      - "POST /citations/{id}/reissue"
      - "POST /payment-plans/{id}/assess-delinquency"
      - "POST /community-service-assignments/{id}/log-hours"
    shared_operations:
      - "POST /citations/{id}/payments (shared with Rider)"
      - "POST /payment-plans (shared with Rider)"
      - "POST /payment-plans/{id}/installments (shared with Rider)"
      - "POST /community-service-assignments (shared with Rider)"
      - "GET /reports/equity-distribution (shared with EquityAnalyst)"
      - "GET /reports/revenue-recovery (shared with EquityAnalyst)"
      - "POST /_clock/set_current_utc (shared with every role)"
      - "all GET reads on zones, lines, assignments, signage audits, inspectors, riders, deployments, encounters, citations, payments, hearings, appeals, plans and service assignments"

  - name: FareInspector
    description: "Field fare inspector working an ACTIVE deployment: records sampled encounters, validates fare media, handles identity capture, and issues either a warning or a citation."
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspection-encounters"
      - "POST /inspection-encounters/{id}/resolve"
      - "POST /citations"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with every role)"
      - "GET /fare-zones, GET /fare-zones/{id}, GET /transit-lines/{id}, GET /inspectors/{id}"
      - "GET /inspection-deployments, GET /inspection-deployments/{id}"
      - "GET /inspection-encounters, GET /inspection-encounters/{id}"
      - "GET /citations, GET /citations/{id}"

  - name: Rider
    description: "Cited rider: contests a citation, files and supplements appeals, and settles a balance by direct payment, installment plan or community service."
    identity: "entity_backed:Rider"
    exclusive_operations:
      - "POST /citations/{id}/contest"
      - "POST /appeals"
      - "POST /appeals/{id}/resubmit"
      - "POST /appeals/{id}/withdraw"
    shared_operations:
      - "POST /citations/{id}/payments (shared with EnforcementPlanner)"
      - "POST /payment-plans (shared with EnforcementPlanner)"
      - "POST /payment-plans/{id}/installments (shared with EnforcementPlanner)"
      - "POST /community-service-assignments (shared with EnforcementPlanner)"
      - "POST /_clock/set_current_utc (shared with every role)"
      - "GET /fare-zones, GET /fare-zones/{id}, GET /riders/{id}"
      - "GET /citations, GET /citations/{id}, GET /citations/{id}/payments"
      - "GET /adjudication-hearings, GET /adjudication-hearings/{id}"
      - "GET /appeals, GET /appeals/{id}"
      - "GET /payment-plans, GET /payment-plans/{id}, GET /payment-plans/{id}/payments"
      - "GET /community-service-assignments, GET /community-service-assignments/{id}"

  - name: HearingOfficer
    description: "Administrative hearing officer: adjudicates contested citations by upholding, reducing to at least the reduction floor, or dismissing on a declared reason code. The deciding officer's X-User-ID is stamped on the hearing as hearing_officer_user_id."
    identity: "opaque"
    exclusive_operations:
      - "POST /adjudication-hearings/{id}/decide"
      - "POST /adjudication-hearings/{id}/cancel"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with every role)"
      - "GET /fare-zones/{id}, GET /riders/{id}, GET /inspectors/{id}"
      - "GET /inspection-encounters, GET /inspection-encounters/{id}"
      - "GET /citations, GET /citations/{id}, GET /citations/{id}/payments"
      - "GET /adjudication-hearings, GET /adjudication-hearings/{id}"
      - "GET /appeals, GET /appeals/{id}"
      - "GET /payment-plans, GET /payment-plans/{id}, GET /payment-plans/{id}/payments"
      - "GET /community-service-assignments, GET /community-service-assignments/{id}"

  - name: AppealsBoardMember
    description: "Appeals board member: requests supplementation of an appeal or grants or denies it. A grant dismisses the citation and unwinds every settlement artifact. Per validations priority 11 a board member may not act on an appeal whose hearing carries that same user's id as hearing_officer_user_id."
    identity: "opaque"
    exclusive_operations:
      - "POST /appeals/{id}/request-supplement"
      - "POST /appeals/{id}/decide"
    shared_operations:
      - "POST /_clock/set_current_utc (shared with every role)"
      - "GET /fare-zones/{id}, GET /riders/{id}"
      - "GET /inspection-encounters, GET /inspection-encounters/{id}"
      - "GET /citations, GET /citations/{id}, GET /citations/{id}/payments"
      - "GET /adjudication-hearings, GET /adjudication-hearings/{id}"
      - "GET /appeals, GET /appeals/{id}"
      - "GET /payment-plans, GET /payment-plans/{id}, GET /payment-plans/{id}/payments"
      - "GET /community-service-assignments, GET /community-service-assignments/{id}"

  - name: EquityAnalyst
    description: "Read-only decriminalization and equity analyst: measures citation distribution by demographic band and geographic tract and reconciles revenue recovery against enforcement cost. Holds no write authority over any business record."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /reports/equity-distribution (shared with EnforcementPlanner)"
      - "GET /reports/revenue-recovery (shared with EnforcementPlanner)"
      - "POST /_clock/set_current_utc (shared with every role)"
      - "GET /fare-zones, GET /fare-zones/{id}, GET /fare-zones/{id}/signage-audits"
      - "GET /transit-lines/{id}, GET /zone-line-assignments, GET /zone-line-assignments/{id}"
      - "GET /inspectors/{id}, GET /riders/{id}"
      - "GET /inspection-deployments, GET /inspection-deployments/{id}"
      - "GET /inspection-encounters, GET /inspection-encounters/{id}"
      - "GET /citations, GET /citations/{id}"
      - "GET /adjudication-hearings, GET /adjudication-hearings/{id}"
      - "GET /appeals, GET /appeals/{id}"
