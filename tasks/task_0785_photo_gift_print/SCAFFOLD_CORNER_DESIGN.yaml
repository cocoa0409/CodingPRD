scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: corner_customer_creation_returns_fields
        claim_type: Creation
        grounds: [entities.Customer, endpoints.POST_/customers]
        distinguishing_aspect: "POST /customers with email+full_name returns 201 with id, store_credit_cents==0, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "new@x.com", full_name: "New" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
          assert:
            - "response code 201; Customer.${cust}.store_credit_cents == 0; Customer.${cust}.version == 1"

      - name: corner_customer_not_found
        claim_type: Not Found
        grounds: [entities.Customer, "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers on a random non-existent UUID returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000009"
              payload: {}
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CUSTOMER_NOT_FOUND, http 404"

      - name: corner_template_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Template, "validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /templates omitting the required base_unit_price_cents is rejected with ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION, http 422"

      - name: corner_first_address_is_default
        claim_type: System Fields
        grounds: [entities.Address.is_default, "endpoints.POST_/customers/{id}/addresses"]
        distinguishing_aspect: "The customer's first address gets is_default==true and a second address gets is_default==false; input cannot override."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
          trigger:
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { a1: $.data.id, d1: $.data.is_default }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "2 B St", city: "SF", region: "CA", postal_code: "94102", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { a2: $.data.id, d2: $.data.is_default }
          assert:
            - "Address.${a1}.is_default == true"
            - "Address.${a2}.is_default == false"

      - name: corner_finish_not_in_allowed_finishes_rejected
        claim_type: Type Constraints
        grounds: [entities.Order.finish, "validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Quoting with a finish (METAL) not in the template's allowed_finishes is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["A DRAFT project on a template whose allowed_finishes is [MATTE] only."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "CANVAS", name: "Canvas", surface_count: 1, base_unit_price_cents: 4000, production_days: 5, allowed_finishes: ["MATTE"], min_photos: 1, max_photos: 1 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quote"
              payload: { quantity: 1, finish: "METAL", ship_method: "STANDARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION, http 422"

      - name: corner_order_computed_pricing_fields
        claim_type: Computed Fields
        grounds: [entities.Order.subtotal_cents, entities.Order.total_cents]
        excluded_because:
          difficulty_instance: line_subtotal_tiered_finish_quantity_mode_a
          rationale: "Computed unit_price/subtotal correctness is asserted with literal values by the mode-(a) combinatorial instance."

  # =========================================================================
  - section: state_machines
    instances:
      - name: corner_autolayout_from_laid_out_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Project.DRAFT_to_LAID_OUT, "errors[ERR_INVALID_PROJECT_STATE]"]
        distinguishing_aspect: "Auto-layout on a project already in LAID_OUT (not DRAFT) is rejected with ERR_INVALID_PROJECT_STATE."
        test_recipe:
          setup: ["A project already auto-laid-out (LAID_OUT) with 2 placed photos."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_PROJECT_STATE, http 409"

      - name: corner_approve_non_pending_proof_rejected
        claim_type: Idempotency
        grounds: [state_machines.Proof.GENERATED_to_APPROVED, "errors[ERR_PROOF_NOT_PENDING]"]
        distinguishing_aspect: "Approving a proof whose state is already APPROVED (second approve) is rejected with ERR_PROOF_NOT_PENDING."
        test_recipe:
          setup: ["A project with an APPROVED proof."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROOF_NOT_PENDING, http 409"

      - name: corner_cancel_shipped_order_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.cancel_fulfillment_to_CANCELLED, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling an order whose fulfillment_status is SHIPPED is rejected with ERR_ORDER_NOT_CANCELLABLE."
        test_recipe:
          setup: ["An order advanced to fulfillment SHIPPED (shipment IN_TRANSIT)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addr: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 5, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${order}/production-job"
              payload: {}
              as: ProductionOperator
              captures: { job: "$.data[0].id" }
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /orders/${order}/shipments"
              payload: { address_id: "${addr}", carrier: "UPS", method: "STANDARD" }
              as: ProductionOperator
              captures: { ship: $.data.id }
            - call: "POST /shipments/${ship}/advance"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /orders/${order}/cancel"
              payload: { refund_destination: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_CANCELLABLE, http 409"

      - name: corner_advance_done_job_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ProductionJob.FINISHING_to_DONE, "errors[ERR_PRODUCTION_NOT_ADVANCEABLE]"]
        distinguishing_aspect: "Advancing a ProductionJob already in DONE has no transition and returns ERR_PRODUCTION_NOT_ADVANCEABLE."
        test_recipe:
          setup: ["A paid order whose ProductionJob has been advanced to DONE."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addr: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 5, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /orders/${order}/production-job"
              payload: {}
              as: ProductionOperator
              captures: { job: "$.data[0].id" }
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
          trigger:
            - call: "POST /production-jobs/${job}/advance"
              payload: {}
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRODUCTION_NOT_ADVANCEABLE, http 409"

      - name: corner_pay_already_paid_rejected
        claim_type: Idempotency
        grounds: [state_machines.Order.pay_UNPAID_to_PAID, "errors[ERR_ORDER_NOT_PAYABLE]"]
        distinguishing_aspect: "Paying an order that is already PAID (second pay) is rejected with ERR_ORDER_NOT_PAYABLE."
        test_recipe:
          setup: ["A paid order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /customers/${cust}/addresses"
              payload: { recipient_name: "C", line1: "1 A St", city: "SF", region: "CA", postal_code: "94101", country: "US" }
              as: Customer
              as_user_id: "${cust}"
              captures: { addr: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/photos"
              payload: { filename: "b.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /projects/${proj}/autolayout"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "GET /projects/${proj}"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { pv: $.data.version }
            - call: "POST /projects/${proj}/proofs"
              payload: { expected_project_version: "${pv}" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proof: $.data.id }
            - call: "POST /proofs/${proof}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
            - call: "POST /orders"
              payload: { project_id: "${proj}", quantity: 5, finish: "MATTE", ship_method: "STANDARD", ship_address_id: "${addr}", payment_method: "CARD" }
              as: Customer
              as_user_id: "${cust}"
              captures: { order: $.data.id }
            - call: "POST /orders/${order}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
          trigger:
            - call: "POST /orders/${order}/pay"
              payload: {}
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_PAYABLE, http 409"

      - name: corner_project_on_retired_template_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Template.ACTIVE_to_RETIRED, "validations[priority=12]", "errors[ERR_TEMPLATE_RETIRED]"]
        distinguishing_aspect: "Creating a project on a RETIRED template is rejected with ERR_TEMPLATE_RETIRED."
        test_recipe:
          setup: ["A template that has been retired."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /templates/${tmpl}/retire"
              payload: {}
              as: CatalogAdmin
          trigger:
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TEMPLATE_RETIRED, http 409"

      - name: corner_shipment_advance_delivered_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Shipment.IN_TRANSIT_to_DELIVERED, "errors[ERR_SHIPMENT_NOT_ADVANCEABLE]"]
        excluded_because:
          difficulty_instance: order_parallel_payment_fulfillment_axes
          rationale: "The parallel-axes instance drives a shipment through IN_TRANSIT to DELIVERED (terminal); a further advance from DELIVERED is the natural terminal-lockdown assertion on that same reachable path."

      - name: corner_proof_revert_unlocks_photos
        claim_type: Compensation
        grounds: [state_machines.Project.IN_PROOF_to_DRAFT, entities.Photo.status]
        excluded_because:
          difficulty_instance: project_revision_cycle_in_proof_back_to_draft
          rationale: "Photo unlock (PLACED->UPLOADED) on request-changes is asserted by the cyclic-state-machine difficulty instance."

  # =========================================================================
  - section: calculations
    instances:
      - name: corner_free_ship_promo_zeros_shipping
        claim_type: Constants Applied
        grounds: [calculations.order_total, entities.Order.shipping_cents]
        distinguishing_aspect: "A FREE_SHIP promo on the quote sets shipping_cents to 0 instead of the STANDARD 799."
        test_recipe:
          setup: ["A DRAFT project (base 1000) and a FREE_SHIP promo, min_subtotal 0, stackable."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
              payload: { product_type: "PHOTOBOOK", name: "Book", surface_count: 20, base_unit_price_cents: 1000, production_days: 3, allowed_finishes: ["MATTE"], min_photos: 2, max_photos: 50 }
              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /promotions"
              payload: { code: "FREESHIP", kind: "FREE_SHIP", value: 0, min_subtotal_cents: 0, stackable: true, per_customer_limit: 9 }
              as: CatalogAdmin
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "P" }
              as: Customer
              as_user_id: "${cust}"
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /projects/${proj}/quote"
              payload: { quantity: 10, finish: "MATTE", ship_method: "STANDARD", promo_codes: ["FREESHIP"] }
              as: Customer
              as_user_id: "${cust}"
              captures: { sh: $.data.shipping_cents, tot: $.data.total_cents }
          assert:
            - "quote.shipping_cents == 0 (FREE_SHIP overrides STANDARD 799)"
            - "quote.total_cents == 9500 (subtotal 9500, no discount, shipping 0)"

      - name: corner_express_shipping_and_transit
        claim_type: Correct Result
        grounds: [calculations.order_total, calculations.promised_ship_date, entities.Order.shipping_cents]
        distinguishing_aspect: "EXPRESS quote applies shipping 1999 and estimated promised date base 2026-03-01 + 3 prod + 2 transit = 2026-03-06."
        test_recipe:
          setup: ["A DRAFT project (base 1000, production_days 3); clock at its 2026-03-01 default."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: CatalogAdmin
              captures: { cust: $.data.id }
            - call: "POST /templates"
