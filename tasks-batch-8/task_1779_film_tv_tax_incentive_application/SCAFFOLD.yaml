# =============================================================================
# PRD Benchmark Seed Tables — Film & TV Tax Incentive Application
# State film office incentive program: eligibility, qualified spend, caps,
# CPA audit, credit issuance, transfer market, claw-back, cash-flow, multi-
# jurisdiction allocation.
# =============================================================================

scenario: |
  Film & TV Tax Incentive Application (state film office incentive program): program eligibility & application deadline by jurisdiction, qualified spend tracking & vendor residency verification, above/below-the-line cap application, CPA audit & documentation package, credit issuance, transfer/sale market & pricing, claw-back risk & compliance conditions, cash-flow modeling against production schedule, multi-jurisdiction allocation

domain_name: film-tv-tax-incentive
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (flat topology; FK links in bodies)
# =============================================================================
entities:
  - name: JurisdictionProgram
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_code, type: string, source: input, description: "State/jurisdiction code, e.g. GA" }
      - { name: program_name, type: string, source: input, description: "Program display name" }
      - { name: fiscal_year, type: string, source: input, description: "Fiscal year label, e.g. FY2027" }
      - { name: window_opens_at, type: datetime, source: input, description: "Application window open instant (inclusive). Must be strictly before window_closes_at" }
      - { name: window_closes_at, type: datetime, source: input, description: "Application window close instant (inclusive: submit allowed when now <= window_closes_at)" }
      - { name: annual_cap_cents, type: integer, source: input, description: "Annual program credit cap in cents; must be > 0" }
      - { name: minimum_qualified_spend_cents, type: integer, source: input, description: "Per-application minimum qualified spend threshold (inclusive >=)" }
      - { name: base_rate_standard, type: number, source: input, description: "Credit rate below the elevated tier, e.g. 0.25" }
      - { name: base_rate_elevated, type: number, source: input, description: "Credit rate at/above the elevated tier threshold, e.g. 0.30" }
      - { name: elevated_tier_threshold_cents, type: integer, source: input, description: "Capped qualified spend at which the elevated rate applies (inclusive >=)" }
      - { name: atl_cap_pct, type: number, source: input, description: "Above-the-line share cap as fraction of pre-cap total qualified spend, e.g. 0.40" }
      - { name: resident_uplift_pct, type: number, source: input, description: "Per-entry uplift fraction for resident BTL labor with a VERIFIED vendor, e.g. 0.025" }
      - { name: transfer_price_floor_pct, type: number, source: input, description: "Minimum transfer price as fraction of face amount (inclusive >=), e.g. 0.90" }
      - { name: vendor_verification_validity_days, type: integer, source: input, description: "Days a vendor residency verification stays valid: spend_date in [verified_at, verified_at + days)" }
      - { name: appeal_window_days, type: integer, source: input, description: "Days after clawback notice during which appeal is allowed (appeal allowed when now <= appeal_deadline_at)" }
      - { name: daily_interest_rate, type: number, source: input, description: "Clawback interest per day on shortfall base, e.g. 0.0005" }
      - { name: credit_validity_days, type: integer, source: input, description: "Days after issuance a certificate remains redeemable/transferable" }
      - { name: transfer_proposal_validity_days, type: integer, source: input, description: "Days a transfer proposal stays open for accept/settle" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | SUSPENDED | CLOSED", constraints: "initial DRAFT" }
      - { name: allocated_credit_cents, type: integer, source: computed, default: 0, description: "Net outstanding issued credit = sum issued minus sum recovered via sustained clawbacks" }
      - { name: remaining_cap_cents, type: integer, source: computed, description: "annual_cap_cents - allocated_credit_cents; debited on issuance, restored on sustained clawback recovery; invariant: allocated + remaining == annual_cap" }

  - name: ProductionCompany
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal entity name" }
      - { name: fein, type: string, source: input, description: "Federal employer identification number; unique" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }

  - name: Production
    parent: null
    common_fields: true
    fields:
      - { name: production_company_id, type: string, source: input, description: "FK -> ProductionCompany.id; owning company" }
      - { name: title, type: string, source: input, description: "Production title" }
      - { name: production_type, type: enum, source: input, description: "FEATURE | SERIES | DOCUMENTARY | COMMERCIAL" }
      - { name: scheduled_start_date, type: datetime, source: input, description: "Scheduled principal photography start; must be strictly before scheduled_wrap_date" }
      - { name: scheduled_wrap_date, type: datetime, source: input, description: "Scheduled wrap date; anchors cash-flow milestones" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total production budget; must be > 0" }

  - name: CreditBuyer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Buyer legal name (taxpayer purchasing credits)" }
      - { name: tax_id, type: string, source: input, description: "Buyer tax identifier; unique" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }

  - name: IncentiveApplication
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; production seeking the incentive" }
      - { name: jurisdiction_program_id, type: string, source: input, description: "FK -> JurisdictionProgram.id; program applied to" }
      - { name: estimated_qualified_spend_cents, type: integer, source: input, description: "Applicant-reported estimated qualified spend; eligibility pre-check at approve" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | CORRECTION_REQUESTED | APPROVED | DENIED | WITHDRAWN | CREDIT_ISSUED | REVOKED", constraints: "initial DRAFT" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submission; null until submitted" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID of the FilmOfficeReviewer who claimed the review" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the FilmOfficeReviewer who approved or denied; must differ from reviewer_user_id (segregation of duties)" }
      - { name: atl_qualified_cents, type: integer, source: computed, default: 0, description: "Sum of effective_amount_cents over QUALIFIED non-superseded ATL spend entries" }
      - { name: btl_qualified_cents, type: integer, source: computed, default: 0, description: "Sum of effective_amount_cents over QUALIFIED non-superseded BTL spend entries" }
      - { name: capped_total_qualified_cents, type: integer, source: computed, default: 0, description: "After above-the-line cap: atl_capped + btl_qualified (see atl_btl_cap_application)" }
      - { name: provisional_credit_cents, type: integer, source: computed, default: 0, description: "PROVISIONAL variant of credit_amount over system-qualified sums; 0 when below minimum" }
      - { name: recomputed_credit_cents, type: integer, source: computed, default: 0, description: "credit_amount over CURRENT system-qualified sums, refreshed on every totals change; drives certificate overissued_exposure_cents after issuance" }
      - { name: final_credit_cents, type: integer, source: system, description: "FINAL variant of credit_amount over attested amounts; locked when audit package is ACCEPTED; null until then" }
      - { name: allocation_share_pct, type: number, source: computed, default: 0, description: "This application's share of sibling qualified spend: round_half_up(capped_total * 10000 / sum_sibling_capped) / 100 over sibling applications of the same production with status IN {APPROVED, CREDIT_ISSUED}; 0 when the sibling sum is 0" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: production_id, type: string, source: input, description: "FK -> Production.id; production-level vendor registry" }
      - { name: legal_name, type: string, source: input, description: "Vendor legal name" }
      - { name: tax_id, type: string, source: input, description: "Vendor tax identifier" }
      - { name: residency_jurisdiction, type: string, source: input, description: "Claimed residency jurisdiction code" }
      - { name: residency_status, type: enum, source: system, description: "UNVERIFIED | VERIFIED | REJECTED", constraints: "initial UNVERIFIED" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock instant of latest VERIFIED decision; null otherwise. Validity window is [verified_at, verified_at + program.vendor_verification_validity_days), evaluated at spend-entry qualification against the application's program" }
      - { name: residency_reviewed_by, type: string, source: system, description: "X-User-ID of the FilmOfficeReviewer who last decided residency" }

  - name: SpendEntry
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> IncentiveApplication.id; application this spend is claimed under" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; vendor must belong to the same production as the application" }
      - { name: external_invoice_ref, type: string, source: input, description: "Vendor invoice reference; unique per production across ALL of its applications (multi-jurisdiction double-count guard)" }
      - { name: category, type: enum, source: input, description: "ATL | BTL (above/below the line)" }
      - { name: is_resident_labor, type: boolean, source: input, default: false, description: "Whether the spend is resident labor (uplift-eligible only when category == BTL and vendor VERIFIED)" }
      - { name: spend_date, type: datetime, source: input, description: "Date the spend was incurred; must fall inside the vendor's verification validity window at qualification" }
      - { name: amount_cents, type: integer, source: input, description: "Gross spend amount; must be > 0" }
      - { name: amends_entry_id, type: string, source: input, description: "FK -> SpendEntry.id; optional. When present, the referenced entry (same application, status IN {PENDING_REVIEW, QUALIFIED, DISQUALIFIED}) is atomically moved to SUPERSEDED and this entry replaces it", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | QUALIFIED | DISQUALIFIED | SUPERSEDED", constraints: "initial PENDING_REVIEW" }
      - { name: effective_amount_cents, type: integer, source: computed, default: 0, description: "amount_cents + round_half_up(amount_cents * resident_uplift_pct) when QUALIFIED and uplift-eligible at review time; else amount_cents when QUALIFIED; 0 while not QUALIFIED. Uplift is rounded PER ENTRY then summed (pinned rounding order)" }
      - { name: disqualify_reason, type: string, source: system, description: "Reason recorded on disqualification (manual or cascade)" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the FilmOfficeReviewer who last reviewed the entry" }

  - name: AuditPackage
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> IncentiveApplication.id; at most one package per application with status NOT IN {REJECTED}" }
      - { name: cpa_user_id, type: string, source: system, description: "X-User-ID of the engaging CPAAuditor (opaque operator id); only this user may submit drafts and attest" }
      - { name: status, type: enum, source: system, description: "ENGAGED | DRAFT_SUBMITTED | FIELDWORK | ATTESTED | ACCEPTED | REJECTED", constraints: "initial ENGAGED" }
      - { name: documentation_complete, type: boolean, source: input, description: "CPA assertion that the documentation package (invoices, residency proofs, ledgers) is complete; required true at attest" }
      - { name: attested_atl_cents, type: integer, source: input, description: "CPA-attested above-the-line qualified spend; authoritative input to the FINAL credit variant; null until attest" }
      - { name: attested_btl_cents, type: integer, source: input, description: "CPA-attested below-the-line qualified spend; null until attest" }
      - { name: exception_count, type: integer, source: system, default: 0, description: "Increments by 1 on every raise-exceptions transition" }
      - { name: attested_at, type: datetime, source: system, description: "Logical-clock instant of attestation; null until ATTESTED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the FilmOfficeReviewer who accepted/rejected; must differ from cpa_user_id (segregation of duties)" }

  - name: CreditCertificate
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> IncentiveApplication.id; 1:1, set at issuance" }
      - { name: certificate_number, type: string, source: system, description: "Server-minted certificate number; identity only, never used in business decisions" }
      - { name: issued_amount_cents, type: integer, source: system, description: "= application.final_credit_cents at issuance" }
      - { name: remaining_amount_cents, type: integer, source: computed, description: "issued_amount_cents - settled transfer amounts - redeemed amounts - clawed-back remainder. Conservation: issued == remaining + settled_transfers + redemptions + recovered" }
      - { name: redeemed_total_cents, type: integer, source: system, default: 0, description: "Cumulative redemptions" }
      - { name: transferred_total_cents, type: integer, source: system, default: 0, description: "Cumulative settled transfer amounts" }
      - { name: overissued_exposure_cents, type: integer, source: computed, default: 0, description: "max(0, issued_amount_cents - application.recomputed_credit_cents); recomputed whenever application totals change after issuance; a 0 -> >0 transition auto-opens (or updates) a SPEND_SHORTFALL ClawbackCase" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of issuance" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + program.credit_validity_days; redeem/transfer-create/settle rejected when now > expires_at" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_TRANSFERRED | FULLY_TRANSFERRED | REDEEMED | CLAWED_BACK", constraints: "initial ISSUED" }

  - name: CreditTransfer
    parent: null
    common_fields: true
    fields:
      - { name: certificate_id, type: string, source: input, description: "FK -> CreditCertificate.id; certificate slice being sold" }
      - { name: buyer_id, type: string, source: input, description: "FK -> CreditBuyer.id; purchasing taxpayer" }
      - { name: seller_production_company_id, type: string, source: system, description: "Derived from certificate -> application -> production -> production_company_id" }
      - { name: amount_cents, type: integer, source: input, description: "Face amount of credit transferred; must be > 0 and <= certificate.remaining_amount_cents at propose and at settle" }
      - { name: price_cents, type: integer, source: input, description: "Agreed cash price; must satisfy price_cents >= floor(program.transfer_price_floor_pct * amount_cents)" }
      - { name: current_price_cents, type: integer, source: system, description: "Price after latest counter round; starts equal to price_cents; settlement pays current_price_cents" }
      - { name: round_count, type: integer, source: system, default: 0, description: "Number of counter rounds applied" }
      - { name: status, type: enum, source: system, description: "PROPOSED | COUNTERED | ACCEPTED | SETTLED | CANCELLED", constraints: "initial PROPOSED" }
      - { name: proposed_at, type: datetime, source: system, description: "Logical-clock instant of proposal" }
      - { name: expires_at, type: datetime, source: system, description: "proposed_at + program.transfer_proposal_validity_days; counter/accept/settle rejected when now > expires_at" }
      - { name: settled_at, type: datetime, source: system, description: "Logical-clock instant of settlement; null until SETTLED" }
      - { name: cancellation_reason, type: enum, source: system, description: "MANUAL | INSUFFICIENT_REMAINING | CERTIFICATE_CLAWED_BACK; null unless CANCELLED" }

  - name: ClawbackCase
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> IncentiveApplication.id; target application (must be CREDIT_ISSUED)" }
      - { name: certificate_id, type: string, source: system, description: "FK -> CreditCertificate.id; derived from the application's certificate at case creation" }
      - { name: trigger_reason, type: enum, source: input, description: "SPEND_SHORTFALL | RESIDENCY_FAILURE | MISSING_AUDIT | MISREPRESENTATION" }
      - { name: penalty_mode, type: enum, source: input, default: "SIMPLE", description: "SIMPLE | AGGRAVATED; selects the clawback_assessment variant" }
      - { name: shortfall_amount_cents, type: integer, source: input, description: "Assessment base. Optional on manual open: defaults to certificate.overissued_exposure_cents. Auto-opened cases always use current exposure. Must be > 0 and <= certificate.issued_amount_cents", constraints: "optional on manual open" }
      - { name: status, type: enum, source: system, description: "OPENED | NOTICE_SENT | APPEALED | SUSTAINED | VACATED | SETTLED", constraints: "initial OPENED" }
      - { name: notice_sent_at, type: datetime, source: system, description: "Logical-clock instant of notice; null until NOTICE_SENT" }
      - { name: appeal_deadline_at, type: datetime, source: computed, description: "notice_sent_at + program.appeal_window_days; appeal allowed when now <= appeal_deadline_at; resolve SUSTAINED from NOTICE_SENT requires now > appeal_deadline_at" }
      - { name: appealed_at, type: datetime, source: system, description: "Null until appealed" }
      - { name: resolved_at, type: datetime, source: system, description: "Null until SUSTAINED / VACATED / SETTLED" }
      - { name: interest_cents, type: integer, source: computed, description: "min(round_half_up(shortfall_amount_cents * program.daily_interest_rate * days_notice_to_resolve), floor(shortfall_amount_cents * 0.5)); days counts calendar days from notice_sent_at to resolved_at" }
      - { name: assessed_total_cents, type: integer, source: computed, description: "SIMPLE: shortfall + interest. AGGRAVATED: round_half_up(shortfall * 1.25) + interest. Computed at resolve SUSTAINED" }
      - { name: recovered_from_certificate_cents, type: integer, source: system, default: 0, description: "On SUSTAINED: the certificate's entire remaining_amount_cents at sustain time is forfeited and restored to program remaining_cap_cents" }
      - { name: cash_assessment_cents, type: integer, source: computed, description: "SUSTAINED: max(0, assessed_total_cents - recovered_from_certificate_cents). SETTLED: settled_amount_cents" }
      - { name: settled_amount_cents, type: integer, source: input, description: "Negotiated cash settlement; required when resolve outcome == SETTLED", constraints: "conditional" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: JurisdictionProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/jurisdiction-programs/{programId}/transition {to_state: OPEN}"
        actor: FilmOfficeAdmin
        preconditions:
          - "window_opens_at < window_closes_at (ERR_INVALID_REQUEST)"
          - "No other program with the same jurisdiction_code and status NOT IN {CLOSED} has a window overlapping [window_opens_at, window_closes_at) under half-open semantics; touching boundaries (other.window_closes_at == this.window_opens_at or other.window_opens_at == this.window_closes_at) do NOT overlap (ERR_PROGRAM_WINDOW_OVERLAP)"
        side_effects: []
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /api/jurisdiction-programs/{programId}/transition {to_state: SUSPENDED}"
        actor: FilmOfficeAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /api/jurisdiction-programs/{programId}/transition {to_state: OPEN}"
        actor: FilmOfficeAdmin
        preconditions:
          - "Window overlap re-checked as on DRAFT -> OPEN (ERR_PROGRAM_WINDOW_OVERLAP)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /api/jurisdiction-programs/{programId}/transition {to_state: CLOSED}"
        actor: FilmOfficeAdmin
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/jurisdiction-programs/{programId}/transition {to_state: CLOSED}"
        actor: FilmOfficeAdmin
        preconditions: []
        side_effects: []

  - entity: IncentiveApplication
    initial_state: DRAFT
    terminal_states: [DENIED, WITHDRAWN, REVOKED]
    note: "CREDIT_ISSUED is non-terminal (can be REVOKED by sustained clawback). DENIED/WITHDRAWN/REVOKED free the (production_id, jurisdiction_program_id) pair for a fresh application."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/applications/{applicationId}/submit"
        actor: Producer
        preconditions:
          - "Caller owns the application's production company (ERR_NOT_OWNER)"
          - "Program status == OPEN (ERR_PROGRAM_NOT_OPEN)"
          - "now >= program.window_opens_at (ERR_WINDOW_NOT_YET_OPEN)"
          - "now <= program.window_closes_at (ERR_APPLICATION_DEADLINE_PASSED; boundary inclusive)"
        side_effects:
          - "submitted_at = now (logical clock)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/applications/{applicationId}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the production company (ERR_NOT_OWNER)"]
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/applications/{applicationId}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the production company (ERR_NOT_OWNER)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /api/applications/{applicationId}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the production company (ERR_NOT_OWNER)"]
        side_effects: []
      - from: CORRECTION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /api/applications/{applicationId}/withdraw"
        actor: Producer
        preconditions: ["Caller owns the production company (ERR_NOT_OWNER)"]
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/applications/{applicationId}/claim-review"
        actor: FilmOfficeReviewer
        preconditions: []
        side_effects:
          - "reviewer_user_id = X-User-ID"
      - from: UNDER_REVIEW
        to: CORRECTION_REQUESTED
        trigger: "POST /api/applications/{applicationId}/request-corrections"
        actor: FilmOfficeReviewer
        preconditions: []
        side_effects: []
      - from: CORRECTION_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /api/applications/{applicationId}/resubmit"
        actor: Producer
        preconditions: ["Caller owns the production company (ERR_NOT_OWNER)"]
        side_effects: []
        note: "Correction loop is unbounded (cyclic)."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/applications/{applicationId}/approve"
        actor: FilmOfficeReviewer
        preconditions:
          - "X-User-ID != reviewer_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "estimated_qualified_spend_cents >= program.minimum_qualified_spend_cents (ERR_MINIMUM_SPEND_NOT_MET)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "allocation_share_pct recomputed for this application and all siblings"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/applications/{applicationId}/deny"
        actor: FilmOfficeReviewer
        preconditions:
          - "X-User-ID != reviewer_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
      - from: APPROVED
        to: CREDIT_ISSUED
        trigger: "POST /api/applications/{applicationId}/issue-credit"
        actor: FilmOfficeAdmin
        preconditions:
          - "When application.status == CREDIT_ISSUED (a certificate already exists): the request fails with ERR_CERTIFICATE_ALREADY_ISSUED rather than ERR_INVALID_STATE_TRANSITION — the endpoint explicitly maps the already-issued state to the domain error"
          - "An AuditPackage for this application exists with status == ACCEPTED (ERR_AUDIT_NOT_ACCEPTED)"
          - "No CreditCertificate exists yet for this application (ERR_CERTIFICATE_ALREADY_ISSUED)"
          - "final_credit_cents > 0, i.e. attested capped total >= program.minimum_qualified_spend_cents (ERR_MINIMUM_SPEND_NOT_MET)"
          - "final_credit_cents <= program.remaining_cap_cents (ERR_PROGRAM_CAP_EXHAUSTED; exact fit allowed)"
        side_effects:
          - "Create CreditCertificate: issued_amount_cents = final_credit_cents, remaining = issued, issued_at = now, expires_at = now + program.credit_validity_days"
          - "program.remaining_cap_cents -= final_credit_cents; program.allocated_credit_cents += final_credit_cents (ledger sync; invariant allocated + remaining == annual_cap preserved)"
          - "application.recomputed_credit_cents = final_credit_cents at this instant"
      - from: CREDIT_ISSUED
        to: REVOKED
        trigger: "system (cascade from ClawbackCase resolve outcome SUSTAINED: the certificate's clawback revokes its application)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Vendor
    initial_state: UNVERIFIED
    terminal_states: []
    note: "residency_status field machine. REJECTED can be re-reviewed to VERIFIED (cycle); VERIFIED can be revoked to REJECTED with a deep cascade."
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /api/vendors/{vendorId}/review-residency {decision: VERIFIED}"
        actor: FilmOfficeReviewer
        preconditions: []
        side_effects:
          - "verified_at = now; residency_reviewed_by = X-User-ID"
      - from: UNVERIFIED
        to: REJECTED
        trigger: "POST /api/vendors/{vendorId}/review-residency {decision: REJECTED}"
        actor: FilmOfficeReviewer
        preconditions: []
        side_effects:
          - "residency_reviewed_by = X-User-ID"
      - from: REJECTED
        to: VERIFIED
        trigger: "POST /api/vendors/{vendorId}/review-residency {decision: VERIFIED}"
        actor: FilmOfficeReviewer
        preconditions: []
        side_effects:
          - "verified_at = now; residency_reviewed_by = X-User-ID"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /api/vendors/{vendorId}/review-residency {decision: REJECTED}"
        actor: FilmOfficeReviewer
        preconditions: []
        side_effects:
          - "CASCADE link 1: every SpendEntry with vendor_id == this vendor and status == QUALIFIED (across ALL applications of the production) -> DISQUALIFIED with disqualify_reason = VENDOR_RESIDENCY_REVOKED"
          - "CASCADE link 2: each affected application recomputes atl_qualified_cents, btl_qualified_cents, capped_total_qualified_cents, provisional_credit_cents, recomputed_credit_cents, allocation_share_pct (see qualified_spend_totals / atl_btl_cap_application / credit_amount)"
          - "CASCADE link 3: for each affected application with a certificate, certificate.overissued_exposure_cents is recomputed; a 0 -> >0 transition auto-opens a ClawbackCase (trigger_reason SPEND_SHORTFALL, shortfall = exposure, status OPENED) or updates the shortfall of an existing unresolved SPEND_SHORTFALL case (status IN {OPENED, NOTICE_SENT, APPEALED})"
          - "residency_reviewed_by = X-User-ID"

  - entity: SpendEntry
    initial_state: PENDING_REVIEW
    terminal_states: [SUPERSEDED]
    note: "QUALIFIED and DISQUALIFIED are not terminal: QUALIFIED can be disqualified later (audit finding) or superseded; DISQUALIFIED can be re-qualified or superseded via amendment."
    transitions:
      - from: PENDING_REVIEW
        to: QUALIFIED
        trigger: "POST /api/spend-entries/{entryId}/review {decision: QUALIFY}"
        actor: FilmOfficeReviewer
        preconditions:
          - "application.status IN {APPROVED, CREDIT_ISSUED} (ERR_INVALID_STATE_TRANSITION)"
          - "vendor.residency_status == VERIFIED (ERR_VENDOR_RESIDENCY_NOT_VERIFIED)"
          - "spend_date IN [vendor.verified_at, vendor.verified_at + program.vendor_verification_validity_days) — start inclusive, end exclusive (ERR_VERIFICATION_WINDOW_EXPIRED)"
        side_effects:
          - "effective_amount_cents computed (per-entry uplift rounding; see qualified_spend_totals)"
          - "reviewed_by = X-User-ID"
          - "Application totals recompute: atl/btl_qualified_cents, capped_total_qualified_cents, provisional_credit_cents, recomputed_credit_cents, allocation_share_pct (own + siblings)"
          - "If application has a certificate: certificate.overissued_exposure_cents recomputed; 0 -> >0 auto-opens/updates SPEND_SHORTFALL ClawbackCase"
      - from: PENDING_REVIEW
        to: DISQUALIFIED
        trigger: "POST /api/spend-entries/{entryId}/review {decision: DISQUALIFY, disqualify_reason}"
        actor: FilmOfficeReviewer
        preconditions: []
        side_effects:
          - "disqualify_reason recorded; reviewed_by = X-User-ID"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /api/spend-entries/{entryId}/review {decision: DISQUALIFY, disqualify_reason}"
        actor: FilmOfficeReviewer
        preconditions: []
        side_effects:
          - "effective_amount_cents -> 0; application totals recompute (same recompute cascade as QUALIFY, including certificate exposure and auto-clawback on 0 -> >0 exposure transition)"
      - from: DISQUALIFIED
        to: QUALIFIED
        trigger: "POST /api/spend-entries/{entryId}/review {decision: QUALIFY}"
        actor: FilmOfficeReviewer
        preconditions:
          - "Same vendor-residency and verification-window preconditions as PENDING_REVIEW -> QUALIFIED"
        side_effects:
          - "Same recompute cascade as PENDING_REVIEW -> QUALIFIED"
      - from: PENDING_REVIEW
        to: SUPERSEDED
        trigger: "system (a new SpendEntry is created with amends_entry_id == this entry)"
        actor: system
        preconditions: []
        side_effects: []
      - from: QUALIFIED
        to: SUPERSEDED
        trigger: "system (amendment via amends_entry_id)"
        actor: system
        preconditions: []
        side_effects:
          - "Application totals recompute exactly as in QUALIFIED -> DISQUALIFIED (removal of effective_amount_cents), including certificate exposure and auto-clawback on 0 -> >0 transition"
      - from: DISQUALIFIED
        to: SUPERSEDED
        trigger: "system (amendment via amends_entry_id)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AuditPackage
    initial_state: ENGAGED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: ENGAGED
        to: DRAFT_SUBMITTED
        trigger: "POST /api/audit-packages/{packageId}/submit-draft"
        actor: CPAAuditor
        preconditions: ["X-User-ID == cpa_user_id (ERR_NOT_OWNER)"]
        side_effects: []
      - from: FIELDWORK
        to: DRAFT_SUBMITTED
        trigger: "POST /api/audit-packages/{packageId}/submit-draft"
        actor: CPAAuditor
        preconditions: ["X-User-ID == cpa_user_id (ERR_NOT_OWNER)"]
        side_effects: []
      - from: DRAFT_SUBMITTED
        to: FIELDWORK
        trigger: "POST /api/audit-packages/{packageId}/raise-exceptions"
        actor: FilmOfficeReviewer
        preconditions: []
        side_effects:
          - "exception_count += 1"
        note: "Rework cycle DRAFT_SUBMITTED -> FIELDWORK -> DRAFT_SUBMITTED is unbounded."
      - from: DRAFT_SUBMITTED
        to: ATTESTED
        trigger: "POST /api/audit-packages/{packageId}/attest"
        actor: CPAAuditor
        preconditions:
          - "X-User-ID == cpa_user_id (ERR_NOT_OWNER)"
          - "documentation_complete == true in this request (ERR_AUDIT_PACKAGE_INCOMPLETE)"
          - "No SpendEntry of the application has status == PENDING_REVIEW (ERR_SPEND_ENTRIES_PENDING)"
        side_effects:
          - "attested_atl_cents / attested_btl_cents recorded; attested_at = now"
      - from: ATTESTED
        to: ACCEPTED
        trigger: "POST /api/audit-packages/{packageId}/decision {outcome: ACCEPT}"
        actor: FilmOfficeReviewer
        preconditions:
          - "X-User-ID != cpa_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "application.final_credit_cents = FINAL variant of credit_amount over attested_atl_cents / attested_btl_cents (locked)"
          - "application.recomputed_credit_cents refreshed"
      - from: ATTESTED
        to: REJECTED
        trigger: "POST /api/audit-packages/{packageId}/decision {outcome: REJECT, decision_reason}"
        actor: FilmOfficeReviewer
        preconditions:
          - "X-User-ID != cpa_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by_user_id = X-User-ID"
          - "Application remains APPROVED; a new AuditPackage may be created (the REJECTED package no longer blocks creation)"

  - entity: CreditCertificate
    initial_state: ISSUED
    terminal_states: [FULLY_TRANSFERRED, REDEEMED, CLAWED_BACK]
    transitions:
      - from: ISSUED
        to: PARTIALLY_TRANSFERRED
        trigger: "system (first CreditTransfer settles with amount < remaining)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: FULLY_TRANSFERRED
        trigger: "system (a CreditTransfer settles with amount == remaining)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PARTIALLY_TRANSFERRED
        to: FULLY_TRANSFERRED
        trigger: "system (a CreditTransfer settles and remaining reaches 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /api/certificates/{certificateId}/redeem with redeem_amount_cents == remaining_amount_cents"
        actor: Producer
        preconditions:
          - "Caller owns the certificate's production company (ERR_NOT_OWNER)"
          - "now <= expires_at (ERR_CERTIFICATE_EXPIRED)"
          - "redeem_amount_cents > 0 and <= remaining_amount_cents (ERR_AMOUNT_EXCEEDS_REMAINING)"
        side_effects:
          - "remaining_amount_cents -= redeem_amount_cents; redeemed_total_cents += redeem_amount_cents"
      - from: PARTIALLY_TRANSFERRED
        to: REDEEMED
        trigger: "POST /api/certificates/{certificateId}/redeem with redeem_amount_cents == remaining_amount_cents"
        actor: Producer
        preconditions: ["Same as ISSUED -> REDEEMED"]
        side_effects: ["Same as ISSUED -> REDEEMED"]
      - from: ISSUED
        to: CLAWED_BACK
        trigger: "system (ClawbackCase resolve outcome SUSTAINED)"
        actor: system
        preconditions: []
        side_effects:
          - "recovered_from_certificate_cents = remaining_amount_cents; remaining_amount_cents -> 0"
          - "program.remaining_cap_cents += recovered; program.allocated_credit_cents -= recovered (invariant allocated + remaining == annual_cap preserved)"
          - "CASCADE: every CreditTransfer of this certificate with status IN {PROPOSED, COUNTERED, ACCEPTED} -> CANCELLED with cancellation_reason CERTIFICATE_CLAWED_BACK"
          - "CASCADE: application.status -> REVOKED"
      - from: PARTIALLY_TRANSFERRED
        to: CLAWED_BACK
        trigger: "system (ClawbackCase resolve outcome SUSTAINED)"
        actor: system
        preconditions: []
        side_effects: ["Same as ISSUED -> CLAWED_BACK"]
    note: "redeem with redeem_amount_cents < remaining keeps status unchanged (ISSUED or PARTIALLY_TRANSFERRED); overissued_exposure_cents recomputes do not change status."

  - entity: CreditTransfer
    initial_state: PROPOSED
    terminal_states: [SETTLED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /api/transfers/{transferId}/counter {new_price_cents}"
        actor: CreditBuyer
        preconditions:
          - "Caller is the transfer's buyer (X-User-ID == buyer_id, ERR_NOT_OWNER)"
          - "now <= expires_at (ERR_TRANSFER_EXPIRED)"
          - "new_price_cents >= floor(program.transfer_price_floor_pct * amount_cents) (ERR_TRANSFER_PRICE_BELOW_FLOOR)"
        side_effects:
          - "current_price_cents = new_price_cents; round_count += 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /api/transfers/{transferId}/counter {new_price_cents}"
        actor: Producer
        preconditions:
          - "Caller owns the seller production company (ERR_NOT_OWNER)"
          - "now <= expires_at (ERR_TRANSFER_EXPIRED)"
          - "new_price_cents >= floor(program.transfer_price_floor_pct * amount_cents) (ERR_TRANSFER_PRICE_BELOW_FLOOR)"
        side_effects:
          - "current_price_cents = new_price_cents; round_count += 1"
        note: "Negotiation loop PROPOSED <-> COUNTERED is unbounded; the party NOT holding the current offer counters."
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /api/transfers/{transferId}/accept"
        actor: CreditBuyer
        preconditions:
          - "Caller is the buyer (ERR_NOT_OWNER)"
          - "now <= expires_at (ERR_TRANSFER_EXPIRED)"
        side_effects: []
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /api/transfers/{transferId}/accept"
        actor: Producer
        preconditions:
          - "Caller owns the seller production company (ERR_NOT_OWNER)"
          - "now <= expires_at (ERR_TRANSFER_EXPIRED)"
        side_effects: []
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /api/transfers/{transferId}/settle"
        actor: FilmOfficeAdmin
        preconditions:
          - "certificate.status IN {ISSUED, PARTIALLY_TRANSFERRED} (ERR_INVALID_STATE_TRANSITION)"
          - "now <= certificate.expires_at (ERR_CERTIFICATE_EXPIRED)"
          - "now <= expires_at (ERR_TRANSFER_EXPIRED)"
          - "amount_cents <= certificate.remaining_amount_cents (ERR_AMOUNT_EXCEEDS_REMAINING)"
        side_effects:
          - "CASCADE link 1: certificate.remaining_amount_cents -= amount_cents; transferred_total_cents += amount_cents; certificate status: ISSUED -> PARTIALLY_TRANSFERRED, or -> FULLY_TRANSFERRED when remaining reaches 0"
          - "CASCADE link 2: every OTHER transfer of the same certificate with status IN {PROPOSED, COUNTERED} and amount_cents > certificate.remaining_amount_cents -> CANCELLED with cancellation_reason INSUFFICIENT_REMAINING"
          - "settled_at = now"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /api/transfers/{transferId}/cancel"
        actor: Producer
        preconditions: ["Caller owns the seller production company (ERR_NOT_OWNER)"]
        side_effects: ["cancellation_reason = MANUAL"]
      - from: COUNTERED
        to: CANCELLED
        trigger: "POST /api/transfers/{transferId}/cancel"
        actor: Producer
        preconditions: ["Caller owns the seller production company (ERR_NOT_OWNER)"]
        side_effects: ["cancellation_reason = MANUAL"]

  - entity: ClawbackCase
    initial_state: OPENED
    terminal_states: [SUSTAINED, VACATED, SETTLED]
    transitions:
      - from: OPENED
        to: NOTICE_SENT
        trigger: "POST /api/clawback-cases/{caseId}/send-notice"
        actor: FilmOfficeAdmin
        preconditions: []
        side_effects:
          - "notice_sent_at = now; appeal_deadline_at = now + program.appeal_window_days"
      - from: NOTICE_SENT
        to: APPEALED
        trigger: "POST /api/clawback-cases/{caseId}/appeal"
        actor: Producer
        preconditions:
          - "Caller owns the application's production company (ERR_NOT_OWNER)"
          - "now <= appeal_deadline_at (ERR_APPEAL_WINDOW_CLOSED)"
        side_effects:
          - "appealed_at = now"
      - from: NOTICE_SENT
        to: SUSTAINED
        trigger: "POST /api/clawback-cases/{caseId}/resolve {outcome: SUSTAINED}"
        actor: FilmOfficeAdmin
        preconditions:
          - "now > appeal_deadline_at — appeal window must have lapsed (ERR_NOTICE_WINDOW_ACTIVE)"
        side_effects:
          - "resolved_at = now; interest_cents and assessed_total_cents computed per clawback_assessment variant selected by penalty_mode"
          - "CASCADE: certificate -> CLAWED_BACK (see CreditCertificate machine: recovery, program cap restore, transfer cancellation, application revocation)"
      - from: APPEALED
        to: SUSTAINED
        trigger: "POST /api/clawback-cases/{caseId}/resolve {outcome: SUSTAINED}"
        actor: FilmOfficeAdmin
        preconditions: []
        side_effects: ["Same as NOTICE_SENT -> SUSTAINED"]
      - from: NOTICE_SENT
        to: VACATED
        trigger: "POST /api/clawback-cases/{caseId}/resolve {outcome: VACATE}"
        actor: FilmOfficeAdmin
        preconditions: []
        side_effects: ["resolved_at = now; no financial mutation"]
      - from: APPEALED
        to: VACATED
        trigger: "POST /api/clawback-cases/{caseId}/resolve {outcome: VACATE}"
        actor: FilmOfficeAdmin
        preconditions: []
        side_effects: ["resolved_at = now; no financial mutation"]
      - from: NOTICE_SENT
        to: SETTLED
        trigger: "POST /api/clawback-cases/{caseId}/resolve {outcome: SETTLE, settled_amount_cents}"
        actor: FilmOfficeAdmin
        preconditions: ["settled_amount_cents required and > 0 (ERR_INVALID_REQUEST)"]
        side_effects: ["resolved_at = now; cash_assessment_cents = settled_amount_cents; certificate and program untouched"]
      - from: APPEALED
        to: SETTLED
        trigger: "POST /api/clawback-cases/{caseId}/resolve {outcome: SETTLE, settled_amount_cents}"
        actor: FilmOfficeAdmin
        preconditions: ["settled_amount_cents required and > 0 (ERR_INVALID_REQUEST)"]
        side_effects: ["resolved_at = now; cash_assessment_cents = settled_amount_cents; certificate and program untouched"]

# =============================================================================
# Concurrency Rules (true races only, resolved via OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: program-amend-stale-version
    parent_entity: JurisdictionProgram
    write_endpoint: "POST /api/jurisdiction-programs/{programId}/amend"
    occ_field: "expected_program_version"
    description: |
      Amending a program's configuration with an expected_program_version that
      no longer matches the program's current version is rejected. Each amend
      legitimately supersedes the prior configuration values, so a client whose
      view of the program predates the latest amend would otherwise write on a
      stale basis; the OCC check is the only signal that the basis moved.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
  - rule_id: transfer-create-stale-certificate
    parent_entity: CreditCertificate
    write_endpoint: "POST /api/transfers"
    occ_field: "expected_certificate_version"
    description: |
      Creating a CreditTransfer against a certificate whose version has
      advanced since the client last observed it is rejected. Multiple PROPOSED
      transfers against one certificate are legitimate, so a sequential second
      create would succeed under natural product semantics; the OCC check
      forces the seller to re-read the certificate (remaining_amount_cents,
      outstanding proposals) before proposing on a stale basis.
    error_id: ERR_STALE_CERTIFICATE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: qualified_spend_totals
    trigger: "spend entry create (with or without amendment-supersede), spend entry review (QUALIFY or DISQUALIFY), vendor residency revocation cascade, audit decision ACCEPT (refresh only)"
    algorithm: aggregation
    formula: |
      input_set = SpendEntry rows where entry.application_id == application.id
                  AND entry.status == QUALIFIED
      (PENDING_REVIEW, DISQUALIFIED, SUPERSEDED are all excluded)
      per_entry_effective(e) =
        if e.category == "BTL" AND e.is_resident_labor == true
           AND vendor(e.vendor_id).residency_status == "VERIFIED" at review time:
            e.amount_cents + round_half_up(e.amount_cents * program.resident_uplift_pct)
        else:
            e.amount_cents
      # PINNED ROUNDING ORDER: uplift is rounded to whole cents PER ENTRY
      # (round_half_up) and only then summed. Computing the uplift on the
      # category total instead ("sum then round") is a DIFFERENT, non-conformant
      # result: e.g. two BTL resident entries of 101 cents each yield
      # 104 + 104 = 208 under the pinned order, vs 202 + round_half_up(5.05)
      # = 207 under sum-then-round.
      atl_qualified_cents = sum(per_entry_effective(e) for e in input_set if e.category == "ATL")
      btl_qualified_cents = sum(per_entry_effective(e) for e in input_set if e.category == "BTL")
    input_set: "QUALIFIED SpendEntry rows of the application only"
    constants:
      ROUNDING: "round_half_up to whole cents, applied per entry before summation"
    precision: "integer cents"
    variants: []

  - name: atl_btl_cap_application
    trigger: "runs inside credit_amount whenever qualified totals change; also refreshes application.capped_total_qualified_cents"
    algorithm: constraint_propagation
    formula: |
      # PINNED EVALUATION ORDER (breaks the circular-looking definition where
      # the ATL cap is a fraction of the total that itself contains capped ATL):
      #   step 1: T_pre = atl_qualified_cents + btl_qualified_cents   (RAW sums)
      #   step 2: atl_cap_cents = floor(program.atl_cap_pct * T_pre)
      #   step 3: atl_capped_cents = min(atl_qualified_cents, atl_cap_cents)
      #   step 4: capped_total_qualified_cents = atl_capped_cents + btl_qualified_cents
      # BTL is never capped. Using atl_capped inside the cap base, or applying
      # the cap to BTL, or rounding the cap with round_half_up instead of floor,
      # are all NON-conformant and produce different cents.
    input_set: "application.atl_qualified_cents and application.btl_qualified_cents (system sums), or attested_atl_cents / attested_btl_cents when computing the FINAL variant"
    constants: {}
    precision: "integer cents; floor on the cap product"
    variants: []

  - name: credit_amount
    trigger: "on every qualified_spend_totals recompute (PROVISIONAL + recomputed); at audit decision ACCEPT (FINAL, locked to final_credit_cents); on GET /api/applications/{id}/credit-estimate"
    algorithm: tiered_pricing
    formula: |
      # Step 1: source sums by variant (see variants below), then run
      # atl_btl_cap_application to get capped_total.
      # Step 2: minimum gate: if capped_total < program.minimum_qualified_spend_cents:
      #           credit = 0, meets_minimum = false
      # Step 3: tier selection (boundary INCLUSIVE):
      #           rate = program.base_rate_elevated  if capped_total >= program.elevated_tier_threshold_cents
      #                  program.base_rate_standard  otherwise
      # Step 4: credit_cents = round_half_up(capped_total * rate)
      # Multi-input non-linearity: (category split, cap, minimum gate, tier
      # boundary) interact; the tier test uses the POST-cap total.
    input_set: "capped totals from the variant's source sums"
    constants: {}
    precision: "integer cents, round_half_up on the final product"
    variants:
      - name: PROVISIONAL
        when: "Pre-audit estimate; used by provisional_credit_cents and credit-estimate default"
        difference: "Sources system-qualified sums (atl_qualified_cents / btl_qualified_cents from entry reviews)"
      - name: FINAL
        when: "Audit-driven; computed at attest for credit-estimate?variant=FINAL, locked to final_credit_cents at audit ACCEPT"
        difference: "Sources CPA-attested sums (attested_atl_cents / attested_btl_cents); identical data can yield a different credit and even a different rate tier when attested totals differ from system sums"

  - name: transfer_price_floor
    trigger: "POST /api/transfers and POST /api/transfers/{id}/counter"
    algorithm: threshold
    formula: |
      floor_cents = floor(program.transfer_price_floor_pct * amount_cents)
      require price_cents >= floor_cents   # boundary INCLUSIVE
      # program is resolved via certificate -> application -> jurisdiction_program
    input_set: "the transfer's amount_cents and the program's transfer_price_floor_pct"
    constants: {}
    precision: "integer cents; floor on the product"
    variants: []

  - name: clawback_assessment
    trigger: "ClawbackCase resolve with outcome SUSTAINED"
    algorithm: chronological
    formula: |
      base = case.shortfall_amount_cents
      days = calendar_days(case.notice_sent_at, case.resolved_at)   # both from logical clock; same day -> 0
      interest_raw = round_half_up(base * program.daily_interest_rate * days)
      interest_cents = min(interest_raw, floor(base * INTEREST_CAP_PCT))
      SIMPLE:     assessed_total_cents = base + interest_cents
      AGGRAVATED: assessed_total_cents = round_half_up(base * AGGRAVATED_MULTIPLIER) + interest_cents
      recovered_from_certificate_cents = certificate.remaining_amount_cents (entire remainder forfeited)
      cash_assessment_cents = max(0, assessed_total_cents - recovered_from_certificate_cents)
    input_set: "the case, its certificate, and the program's daily_interest_rate"
    constants:
      INTEREST_CAP_PCT: 0.5
      AGGRAVATED_MULTIPLIER: 1.25
    precision: "integer cents; round_half_up on interest and on the aggravated base"
    variants:
      - name: SIMPLE
        when: "penalty_mode == SIMPLE (default; shortfalls, residency failures)"
        difference: "assessed = base + capped interest"
      - name: AGGRAVATED
        when: "penalty_mode == AGGRAVATED (misrepresentation)"
        difference: "assessed = round_half_up(base * 1.25) + capped interest — always strictly greater than SIMPLE for base > 0"

  - name: cashflow_projection
    trigger: "GET /api/applications/{id}/cashflow-projection"
    algorithm: forward_looking
    formula: |
      basis = final_credit_cents if an ACCEPTED audit package exists (or a
              certificate is issued), else provisional_credit_cents
      milestones over production.scheduled_wrap_date (W):
        M1 PRODUCTION_WRAP: date = W,        pct = 0.40
        M2 AUDIT_COMPLETE:  date = W + 90d,  pct = 0.30
        M3 CREDIT_ISSUANCE: date = W + 180d, pct = remainder
      PINNED REMAINDER RULE: m1 = round_half_up(basis * 0.40);
        m2 = round_half_up(basis * 0.30); m3 = basis - m1 - m2 (never rounded).
      OPTIMISTIC: amounts as above at the milestone dates; expected_net_proceeds_cents = basis.
      CONSERVATIVE: assumes the credit is sold on the transfer market:
        net = round_half_up(basis * program.transfer_price_floor_pct);
        the 40/30/remainder split is applied to net; every milestone date
        shifts +30 days (settlement lag).
    input_set: "application credit fields, production.scheduled_wrap_date, program.transfer_price_floor_pct"
    constants:
      M1_PCT: 0.40
      M2_PCT: 0.30
      M1_LAG_DAYS: 0
      M2_LAG_DAYS: 90
      M3_LAG_DAYS: 180
      CONSERVATIVE_SETTLEMENT_LAG_DAYS: 30
    precision: "integer cents, round_half_up except pinned remainder"
    variants:
      - name: OPTIMISTIC
        when: "variant=OPTIMISTIC (default)"
        difference: "full face value at milestone dates"
      - name: CONSERVATIVE
        when: "variant=CONSERVATIVE"
        difference: "proceeds discounted to the transfer price floor and every milestone shifted +30 days"

  - name: multi_jurisdiction_allocation
    trigger: "on every application approve and every qualified_spend_totals recompute for any application of the same production"
    algorithm: aggregation
    formula: |
      siblings = applications A where A.production_id == this.production_id
                 AND A.status IN {APPROVED, CREDIT_ISSUED}
      S = sum(A.capped_total_qualified_cents for A in siblings)
      for each A in siblings:
        A.allocation_share_pct = (S == 0) ? 0
          : round_half_up(A.capped_total_qualified_cents * 10000 / S) / 100
      # Double-count guard (structural, not computed here):
      # external_invoice_ref is unique per production across ALL applications,
      # so one invoice can never feed two jurisdictions.
    input_set: "sibling applications of the same production in status APPROVED or CREDIT_ISSUED"
    constants: {}
    precision: "percentage with exactly 2 decimal places, round_half_up at 1/100th of a percent"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — lower number wins
# when a single request violates multiple rules)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and well-formed", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path ids and body FK references resolve to existing resources, validated left-to-right (path first, then body)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: auth, check: "Entity-backed ownership: Producer's X-User-ID equals the resource chain's production_company_id; CreditBuyer's X-User-ID equals transfer buyer_id; CPAAuditor's X-User-ID equals audit package cpa_user_id", error_id: ERR_NOT_OWNER, http_status: 403, applies_to: "Producer/CreditBuyer/CPAAuditor write endpoints on owned resources" }
  - { priority: 5, category: state, check: "Target resource is in a state from which the requested transition is declared", error_id: ERR_INVALID_STATE_TRANSITION, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: state, check: "Lifecycle-uniqueness conflicts: second open application for (production, program); second non-REJECTED audit package; second certificate; submit while program not OPEN", error_id: "ERR_APPLICATION_ALREADY_OPEN | ERR_AUDIT_PACKAGE_EXISTS | ERR_CERTIFICATE_ALREADY_ISSUED | ERR_PROGRAM_NOT_OPEN", http_status: 409, applies_to: "POST /api/applications, POST /api/audit-packages, POST /api/applications/{id}/issue-credit, POST /api/applications/{id}/submit" }
  - { priority: 7, category: state, check: "OCC: expected_<parent>_version in the request body equals the parent entity's current version", error_id: "ERR_STALE_PROGRAM_VERSION | ERR_STALE_CERTIFICATE_VERSION", http_status: 412, applies_to: "POST /api/jurisdiction-programs/{id}/amend, POST /api/transfers" }
  - { priority: 8, category: business_safety, check: "Compliance gates: vendor residency VERIFIED at spend qualification; audit package ACCEPTED at issuance; documentation complete and no pending entries at attest; segregation of duties (approver != reviewer; audit decider != cpa)", error_id: "ERR_VENDOR_RESIDENCY_NOT_VERIFIED | ERR_AUDIT_NOT_ACCEPTED | ERR_AUDIT_PACKAGE_INCOMPLETE | ERR_SPEND_ENTRIES_PENDING | ERR_SEGREGATION_OF_DUTIES", http_status: 409, applies_to: "spend-entry review, issue-credit, attest, approve, deny, audit decision" }
  - { priority: 9, category: business_temporal, check: "Window/deadline checks against the logical clock: submission window, vendor verification validity, certificate expiry, transfer expiry, appeal window, notice quiet period", error_id: "ERR_WINDOW_NOT_YET_OPEN | ERR_APPLICATION_DEADLINE_PASSED | ERR_VERIFICATION_WINDOW_EXPIRED | ERR_CERTIFICATE_EXPIRED | ERR_TRANSFER_EXPIRED | ERR_APPEAL_WINDOW_CLOSED | ERR_NOTICE_WINDOW_ACTIVE", http_status: 409, applies_to: "submit, spend-entry review, redeem, transfers create/counter/accept/settle, appeal, resolve" }
  - { priority: 10, category: business_constraint, check: "Structural uniqueness/geometry: program window overlap per jurisdiction (half-open); external_invoice_ref unique per production across all its applications", error_id: "ERR_PROGRAM_WINDOW_OVERLAP | ERR_DUPLICATE_SPEND_INVOICE", http_status: 409, applies_to: "program create/transition OPEN, spend-entry create" }
  - { priority: 11, category: business_referential, check: "Body-reference coherence: spend entry's vendor belongs to the application's production; amends_entry_id references an entry of the same application in an amendable status", error_id: "ERR_VENDOR_PRODUCTION_MISMATCH | ERR_AMENDMENT_TARGET_MISMATCH", http_status: 409, applies_to: "spend-entry create" }
  - { priority: 12, category: business_fiscal, check: "Amount/cap checks: minimum spend gates, program cap sufficiency, transfer price floor, amount <= remaining, clawback base <= issued amount", error_id: "ERR_MINIMUM_SPEND_NOT_MET | ERR_PROGRAM_CAP_EXHAUSTED | ERR_TRANSFER_PRICE_BELOW_FLOOR | ERR_AMOUNT_EXCEEDS_REMAINING | ERR_CLAWBACK_EXCEEDS_EXPOSURE", http_status: 409, applies_to: "approve, issue-credit, transfers create/counter, redeem, settle, clawback create" }
  - { priority: 13, category: business_constraint, check: "Request shape: required fields present, enums valid, amounts > 0, window_opens_at < window_closes_at, scheduled_start_date < scheduled_wrap_date; unknown payload fields rejected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
    # NOTE on priority 13 placement: pure request-shape failures (missing
    # required field, bad enum) are detected before any stateful evaluation in
    # practice; it is listed last here because §1.8/§1.9 never dual-fail it
    # against business rules. The only pinned conflict pairs are state(5) vs
    # temporal(9) and safety(8) vs fiscal(12) — see difficulty design.

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- JurisdictionProgram ---
  - method: POST
    path: "/api/jurisdiction-programs"
    description: "Create a jurisdiction incentive program (status DRAFT, allocated 0, remaining = annual_cap)"
    roles: [FilmOfficeAdmin]
    code: 201
    input: [jurisdiction_code, program_name, fiscal_year, window_opens_at, window_closes_at, annual_cap_cents, minimum_qualified_spend_cents, base_rate_standard, base_rate_elevated, elevated_tier_threshold_cents, atl_cap_pct, resident_uplift_pct, transfer_price_floor_pct, vendor_verification_validity_days, appeal_window_days, daily_interest_rate, credit_validity_days, transfer_proposal_validity_days]
    output: JurisdictionProgram
    side_effects: ["status=DRAFT", "allocated_credit_cents=0", "remaining_cap_cents=annual_cap_cents", "ERR_PROGRAM_WINDOW_OVERLAP if an overlapping window exists for the same jurisdiction_code among programs with status NOT IN {CLOSED} (half-open intervals)"]
  - method: GET
    path: "/api/jurisdiction-programs"
    description: "List programs with pagination and filters"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: ["status?", "jurisdiction_code?", "fiscal_year?", "limit?", "offset?"]
    output: "JurisdictionProgram[]"
    side_effects: []
  - method: GET
    path: "/api/jurisdiction-programs/{programId}"
    description: "Get a program"
    roles: [FilmOfficeAdmin, FilmOfficeReviewer, Producer, CPAAuditor, CreditBuyer]
    code: 200
    input: []
    output: JurisdictionProgram
    side_effects: []
  - method: POST
    path: "/api/jurisdiction-programs/{programId}/amend"
    description: "Amend program configuration (DRAFT or OPEN only); OCC-guarded; increments program.version"
    roles: [FilmOfficeAdmin]
    code: 200
    input: [expected_program_version, "window_opens_at?", "window_closes_at?", "annual_cap_cents?", "minimum_qualified_spend_cents?", "base_rate_standard?", "base_rate_elevated?", "elevated_tier_threshold_cents?", "atl_cap_pct?", "resident_uplift_pct?", "transfer_price_floor_pct?", "vendor_verification_validity_days?", "appeal_window_days?", "daily_interest_rate?", "credit_validity_days?", "transfer_proposal_validity_days?"]
    output: JurisdictionProgram
    side_effects: ["Applies provided fields", "increments JurisdictionProgram.version by 1", "annual_cap_cents changes resize remaining_cap_cents = new_annual_cap - allocated_credit_cents", "window changes re-run the half-open overlap check (ERR_PROGRAM_WINDOW_OVERLAP)"]
  - method: POST
    path: "/api/jurisdiction-programs/{programId}/transition"
    description: "Program lifecycle transition per the JurisdictionProgram state machine"
    roles: [FilmOfficeAdmin]
    code: 200
    input: [to_state]
    output: JurisdictionProgram
    side_effects: ["status transition per state machine", "OPEN re-entry re-checks window overlap"]

