              as: PlatformAdmin
              captures:
                sid: "$.data.id"
            - call: "POST /nabs/skus/${sid}/lots"
              payload: { lot_code: "L", qty_received: 10, unit_cost_cents: 10, expires_on: "2027-01-01" }
              as: PlatformAdmin
            - call: "POST /nabs/members"
              payload: { email: "mdr@x.com", full_name: "MDR", date_of_birth: "1990-01-01", home_state_code: "CA" }
              as: PlatformAdmin
              captures:
                mid: "$.data.id"
            - call: "POST /nabs/orders"
              payload: { member_id: "${mid}", channel: "RETAIL" }
              as: Member
              as_user_id: "${mid}"
              captures:
                oid: "$.data.id"
            - call: "POST /nabs/orders/${oid}/lines"
              payload: { sku_id: "${sid}", qty: 3 }
              as: Member
              as_user_id: "${mid}"
              captures:
                lid: "$.data.id"
          trigger:
            - call: "DELETE /nabs/orders/${oid}/lines/${lid}"
              as: Member
              as_user_id: "${mid}"
            - call: "GET /nabs/skus/${sid}"
              as: ShopStaff
              captures:
                onhand: "$.data.on_hand_cached"
          assert:
            - "captured onhand == 10 (DRAFT line addition never decremented; delete is a no-op on inventory)"

