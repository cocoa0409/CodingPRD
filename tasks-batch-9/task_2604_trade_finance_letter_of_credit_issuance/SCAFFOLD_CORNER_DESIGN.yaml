        claim_type: parallel
        grounds:
          - state_machines.Presentation.examination_status
          - state_machines.Presentation.settlement_status
        excluded_because:
          difficulty_instance: presentation_parallel_examination_and_settlement_dimensions
          rationale: |
            The 1.8 non_linear_state_machine instance already drives both
            dimensions of one Presentation across a full COMPLYING / CLAIM_LODGED
            / PAID sequence and asserts the combined state after every hop, which
            is exactly the `parallel` shape claim.

      - name: cancel_reverses_every_issuance_side_effect_without_drift
        claim_type: compensation
        grounds:
          - state_machines.DocumentaryCredit.ISSUED_to_CANCELLED
          - state_machines.FacilityAllocation.OPEN_to_RELEASED
        excluded_because:
          difficulty_instance: facility_allocated_cents_conserved_across_issue_then_cancel
          rationale: |
            The 1.8 compensating_invariant instance already captures
            allocated_before, drives the facility to RESTRICTED / SUSPENDED with
            an ON_HOLD sibling, cancels, and asserts released_cents equals
            allocated_cents + charge_cents with allocated_after == allocated_before
            and every sibling restored - the no-drift compensation claim in full.

      - name: credit_loops_from_amendment_pending_back_to_issued_more_than_once
        claim_type: cyclic
        grounds:
          - state_machines.DocumentaryCredit.ISSUED_to_AMENDMENT_PENDING
          - state_machines.DocumentaryCredit.AMENDMENT_PENDING_to_ISSUED
        excluded_because:
          difficulty_instance: credit_amendment_cycle_returns_to_issued_twice
          rationale: |
            The 1.8 non_linear_state_machine instance already traverses the
            ISSUED -> AMENDMENT_PENDING -> ISSUED loop twice, once ending in
            REJECTED and once in ACCEPTED, and asserts amendment_seq after each
            pass, which subsumes the loop-count claim.

