  - rule_id: non_linear_state_machine
    instances:

      - name: lot_bond_axis_cycles_while_production_axis_holds_at_aging
        grounds:
          - state_machines.Lot.IN_BOND_to_TAX_DETERMINED
          - state_machines.Lot.TAX_DETERMINED_to_IN_BOND
          - entities.Lot.fields.production_status
          - entities.Lot.fields.bond_status
          - state_machines.ReleaseOrder.REQUESTED_to_APPROVED
          - state_machines.ReleaseOrder.APPROVED_to_EXECUTED
        distinguishing_aspect: |
          Non-linearity on the LOT entity takes the form of two independent state
          axes: across APPROVE and a partial EXECUTE the bond axis travels
          IN_BOND -> TAX_DETERMINED -> IN_BOND (a closed cycle) while the
          production axis never leaves AGING, proving the axes are not a single
          combined status field.
