          trigger:
            - { call: "GET /vendors/00000000-0000-4000-8000-000000000000", payload: {}, as: "", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400), not ERR_NOT_FOUND — auth precedes existence"

