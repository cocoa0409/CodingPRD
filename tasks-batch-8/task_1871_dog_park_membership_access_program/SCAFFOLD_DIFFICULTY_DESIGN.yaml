            - "Membership.${ms_id}.status == EXPIRED (link 1: term_end < run time)"
            - "Member.${m_id}.status == LAPSED (link 2: caused by the membership flip)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkin_state_beats_size_mismatch
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_MEMBER_NOT_ACTIVE]
          - errors[ERR_DOG_SIZE_AREA_MISMATCH]
        distinguishing_aspect: |
          Category pair state vs business_constraint: a SUSPENDED member checking
          a LARGE dog into a SMALL area violates both rules; priority 8 state
          beats priority 10 constraint so ERR_MEMBER_NOT_ACTIVE wins — distinct
          category pair from the safety-vs-capacity instance below.
