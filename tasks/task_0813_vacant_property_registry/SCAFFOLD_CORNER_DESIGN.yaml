scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: property_create_returns_computed_fee_and_initial_states
        claim_type: computed_fields
        grounds:
          - entities.Property.fields.registration_fee_cents
          - entities.Property.fields.registration_status
          - entities.Property.fields.foreclosure_status
          - calculations.registration_fee
        distinguishing_aspect: "An OWNER/ABANDONED property is created ACTIVE, foreclosure NONE, with registration_fee_cents 15000 (10000 + 50% surcharge) posted to the ledger so outstanding_balance_cents == 15000."
        test_recipe:
          setup: ["OWNER registrant; register an ABANDONED property."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner AA", party_type: "OWNER", email: "aa@x.com", contact_phone: "555-0200", mailing_address: "100 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
          trigger:
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-001", street_address: "1 Elm", occupancy_status: "ABANDONED", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
          assert:
            - "Property.${prop_id}.registration_fee_cents == 15000"
            - "Property.${prop_id}.registration_status == ACTIVE"
            - "Property.${prop_id}.foreclosure_status == NONE"
            - "Property.${prop_id}.outstanding_balance_cents == 15000"
            - "Property.${prop_id}.version == 1"

      - name: owner_registrant_license_number_defaults_null
        claim_type: defaults
        grounds:
          - entities.Registrant.fields.license_number
          - entities.Registrant.fields.party_type
        distinguishing_aspect: "An OWNER registrant created without license_number stores license_number == null (default)."
        test_recipe:
          setup: ["No prior state."]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner BB", party_type: "OWNER", email: "bb@x.com", contact_phone: "555-0201", mailing_address: "101 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
          assert:
            - "Registrant.${reg_id}.license_number == null"
            - "Registrant.${reg_id}.party_type == OWNER"

      - name: get_property_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - endpoints."GET /registry/properties/{id}"
          - errors[ERR_PROPERTY_NOT_FOUND]
        distinguishing_aspect: "GET on a non-existent property id returns ERR_PROPERTY_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /registry/properties/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "error_id == ERR_PROPERTY_NOT_FOUND"

      - name: property_missing_parcel_id_returns_validation
        claim_type: required_fields
        grounds:
          - entities.Property.fields.parcel_id
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Creating a property without the required parcel_id returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["OWNER registrant exists."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner CC", party_type: "OWNER", email: "cc@x.com", contact_phone: "555-0202", mailing_address: "102 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
          trigger:
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", street_address: "2 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "error_id == ERR_VALIDATION"

      - name: property_invalid_occupancy_enum_returns_validation
        claim_type: type_constraints
        grounds:
          - entities.Property.fields.occupancy_status
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "occupancy_status outside {VACANT, ABANDONED} returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["OWNER registrant exists."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner DD", party_type: "OWNER", email: "dd@x.com", contact_phone: "555-0203", mailing_address: "103 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
          trigger:
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-INV", street_address: "3 Elm", occupancy_status: "OCCUPIED", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "error_id == ERR_VALIDATION"

      - name: create_property_unknown_registrant_returns_404
        claim_type: not_found
        grounds:
          - entities.Property.fields.registrant_id
          - errors[ERR_REGISTRANT_NOT_FOUND]
        distinguishing_aspect: "Creating a property whose registrant_id does not resolve returns ERR_REGISTRANT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/properties"
              payload: { registrant_id: "00000000-0000-0000-0000-000000000000", parcel_id: "C-NR", street_address: "4 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "error_id == ERR_REGISTRANT_NOT_FOUND"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: cure_already_cured_violation_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Violation.OPEN_to_CURED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Curing a violation already in CURED returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["Standard CN-01 cure 10; OWNER/VACANT property; inspection fails CN-01 -> violation cured to CURED."]
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "CN-01", category: "LANDSCAPING", description: "weeds", severity_weight: 3, cure_period_days: 10, base_fine_cents: 5000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner EE", party_type: "OWNER", email: "ee@x.com", contact_phone: "555-0204", mailing_address: "104 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-CN", street_address: "5 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "C1", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["CN-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "CURE" }
              as: CodeOfficer
          trigger:
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "CURE" }
              as: CodeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: foreclosure_advance_past_reo_returns_terminal
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Property.AUCTION_SCHEDULED_to_REO
          - errors[ERR_FORECLOSURE_TERMINAL]
        distinguishing_aspect: "After four ADVANCE calls foreclosure_status is REO; a fifth ADVANCE returns ERR_FORECLOSURE_TERMINAL (409)."
        test_recipe:
          setup: ["OWNER/VACANT property; foreclosure advanced NONE->NOTICE_OF_DEFAULT->LIS_PENDENS->AUCTION_SCHEDULED->REO."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner FF", party_type: "OWNER", email: "ff@x.com", contact_phone: "555-0205", mailing_address: "105 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-REO", street_address: "6 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: ProgramAdmin
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: ProgramAdmin
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: ProgramAdmin
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: ProgramAdmin
          trigger:
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "ADVANCE" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Property.${prop_id}.foreclosure_status == REO"
            - "response.status == 409"
            - "error_id == ERR_FORECLOSURE_TERMINAL"

      - name: redeem_from_none_returns_terminal
        claim_type: invalid_transition
        grounds:
          - state_machines.Property.NOTICE_OF_DEFAULT_to_NONE
          - errors[ERR_FORECLOSURE_TERMINAL]
        distinguishing_aspect: "REDEEM on a property whose foreclosure_status is NONE returns ERR_FORECLOSURE_TERMINAL (409)."
        test_recipe:
          setup: ["OWNER/VACANT property, foreclosure NONE."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner GG", party_type: "OWNER", email: "gg@x.com", contact_phone: "555-0206", mailing_address: "106 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-RDM", street_address: "7 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "POST /registry/properties/${prop_id}/foreclosure"
              payload: { action: "REDEEM" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "error_id == ERR_FORECLOSURE_TERMINAL"

  # =====================================================================
  # Section: validations (error-catalog coverage)
  # =====================================================================
  - section: validations
    instances:
      - name: lender_registrant_without_license_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_LICENSE_REQUIRED]
        distinguishing_aspect: "A LENDER registrant created without license_number returns ERR_LICENSE_REQUIRED (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Bank Co", party_type: "LENDER", email: "bank@x.com", contact_phone: "555-0300", mailing_address: "200 Bank St" }
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "error_id == ERR_LICENSE_REQUIRED"

      - name: property_registration_type_mismatch_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_TYPE_MISMATCH]
        distinguishing_aspect: "registration_type LENDER against an OWNER registrant returns ERR_TYPE_MISMATCH (422)."
        test_recipe:
          setup: ["OWNER registrant exists."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner HH", party_type: "OWNER", email: "hh@x.com", contact_phone: "555-0301", mailing_address: "201 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
          trigger:
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-TM", street_address: "8 Elm", occupancy_status: "VACANT", registration_type: "LENDER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "error_id == ERR_TYPE_MISMATCH"

      - name: duplicate_parcel_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_PARCEL]
        distinguishing_aspect: "A second property with an already-registered parcel_id returns ERR_DUPLICATE_PARCEL (409)."
        test_recipe:
          setup: ["OWNER registrant with one property parcel_id C-DUP."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner II", party_type: "OWNER", email: "ii@x.com", contact_phone: "555-0302", mailing_address: "202 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-DUP", street_address: "9 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
          trigger:
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-DUP", street_address: "10 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "error_id == ERR_DUPLICATE_PARCEL"

      - name: inspection_end_before_start_returns_invalid_window
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: "scheduled_end not strictly after scheduled_start returns ERR_INVALID_WINDOW (422)."
        test_recipe:
          setup: ["OWNER/VACANT property."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner JJ", party_type: "OWNER", email: "jj@x.com", contact_phone: "555-0303", mailing_address: "203 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-IW", street_address: "11 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
          trigger:
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "C2", scheduled_start: "2026-03-02T11:00:00Z", scheduled_end: "2026-03-02T09:00:00Z" }
              as: CodeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "error_id == ERR_INVALID_WINDOW"

      - name: escalate_before_cure_deadline_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_CURE_PERIOD_ACTIVE]
          - entities.Violation.fields.cure_deadline_at
        distinguishing_aspect: "Escalating a violation before the clock reaches cure_deadline_at returns ERR_CURE_PERIOD_ACTIVE (409)."
        test_recipe:
          setup: ["Standard CP-01 cure 10; property; inspection fails CP-01 at default clock 2026-03-01 -> violation OPEN with cure_deadline_at 2026-03-11; clock left at 2026-03-01."]
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "CP-01", category: "SECURING", description: "fence", severity_weight: 4, cure_period_days: 10, base_fine_cents: 8000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner KK", party_type: "OWNER", email: "kk@x.com", contact_phone: "555-0304", mailing_address: "204 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-CP", street_address: "12 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "C3", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["CP-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
          trigger:
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "error_id == ERR_CURE_PERIOD_ACTIVE"

      - name: demolition_balance_below_threshold_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=17]
          - errors[ERR_BALANCE_BELOW_DEMOLITION_THRESHOLD]
        distinguishing_aspect: "With 3 OPEN violations but outstanding_balance 10000 (< 50000), demolition listing returns ERR_BALANCE_BELOW_DEMOLITION_THRESHOLD (409) — balance check runs after the satisfied violation-count check."
        test_recipe:
          setup: ["Three standards DB-1..DB-3; OWNER/VACANT property (fee 10000); inspection fails all three -> 3 OPEN violations; no fines (balance 10000)."]
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "DB-1", category: "SANITATION", description: "db1", severity_weight: 6, cure_period_days: 5, base_fine_cents: 10000 }
              as: ProgramAdmin
            - call: "POST /registry/maintenance-standards"
              payload: { code: "DB-2", category: "SANITATION", description: "db2", severity_weight: 6, cure_period_days: 5, base_fine_cents: 10000 }
              as: ProgramAdmin
            - call: "POST /registry/maintenance-standards"
              payload: { code: "DB-3", category: "SANITATION", description: "db3", severity_weight: 6, cure_period_days: 5, base_fine_cents: 10000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner LL", party_type: "OWNER", email: "ll@x.com", contact_phone: "555-0305", mailing_address: "205 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-DBAL", street_address: "13 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "C4", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["DB-1", "DB-2", "DB-3"] }
              as: CodeOfficer
          trigger:
            - call: "POST /registry/demolition-listings"
              payload: { property_id: "${prop_id}" }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "Property.${prop_id}.open_violation_count == 3"
            - "Property.${prop_id}.outstanding_balance_cents == 10000"
            - "response.status == 409"
            - "error_id == ERR_BALANCE_BELOW_DEMOLITION_THRESHOLD"

      - name: record_lien_below_min_amount_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_LIEN_AMOUNT_TOO_LOW]
        distinguishing_aspect: "Recording a lien from an ASSESSED fine whose finalized accrual is 10000 (< 25000) returns ERR_LIEN_AMOUNT_TOO_LOW (409)."
        test_recipe:
          setup: ["Standard LT-01 base 10000 cure 5; OWNER/VACANT property; violation escalated+fined at 2026-03-06 (fine ASSESSED, 0 days overdue => finalized would be 10000)."]
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "LT-01", category: "STRUCTURAL", description: "minor", severity_weight: 3, cure_period_days: 5, base_fine_cents: 10000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner MM", party_type: "OWNER", email: "mm@x.com", contact_phone: "555-0306", mailing_address: "206 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-LT", street_address: "14 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "C5", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["LT-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${viol_id}/fines"
              payload: {}
              as: CodeOfficer
              captures: { fine_id: "$.data.id" }
          trigger:
            - call: "POST /registry/fines/${fine_id}/record-lien"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "error_id == ERR_LIEN_AMOUNT_TOO_LOW"

      - name: foreclose_lien_not_reo_returns_error
        claim_type: violation_to_error
        grounds:
          - validations[priority=19]
          - errors[ERR_PROPERTY_NOT_REO]
          - state_machines.Lien.RECORDED_to_FORECLOSED
        distinguishing_aspect: "Foreclosing a RECORDED lien while Property.foreclosure_status is NONE returns ERR_PROPERTY_NOT_REO (409)."
        test_recipe:
          setup: ["Standard FL-01 base 30000 cure 5; OWNER/VACANT property; violation escalated+fined at 2026-03-06; fine recorded as Lien (RECORDED); foreclosure_status NONE."]
          setup_api_calls:
            - call: "POST /registry/maintenance-standards"
              payload: { code: "FL-01", category: "STRUCTURAL", description: "major", severity_weight: 9, cure_period_days: 5, base_fine_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner NN", party_type: "OWNER", email: "nn@x.com", contact_phone: "555-0307", mailing_address: "207 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-FL", street_address: "15 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /registry/inspections"
              payload: { property_id: "${prop_id}", inspector_badge: "C6", scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T11:00:00Z" }
              as: CodeOfficer
              captures: { insp_id: "$.data.id" }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { result: "FAIL", failed_standard_codes: ["FL-01"] }
              as: CodeOfficer
            - call: "GET /registry/violations?inspection_id=${insp_id}"
              payload: {}
              as: CodeOfficer
              captures: { viol_id: "$.data[0].id" }
            - call: "POST /registry/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /registry/violations/${viol_id}/transition"
              payload: { action: "ESCALATE" }
              as: CodeOfficer
            - call: "POST /registry/violations/${viol_id}/fines"
              payload: {}
              as: CodeOfficer
              captures: { fine_id: "$.data.id" }
            - call: "POST /registry/fines/${fine_id}/record-lien"
              payload: {}
              as: ProgramAdmin
            - call: "GET /registry/liens?source_fine_id=${fine_id}"
              payload: {}
              as: ProgramAdmin
              captures: { lien_id: "$.data[0].id" }
          trigger:
            - call: "POST /registry/liens/${lien_id}/foreclose"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "error_id == ERR_PROPERTY_NOT_REO"

  # =====================================================================
  # Section: roles (RBAC denials)
  # =====================================================================
  - section: roles
    instances:
      - name: code_officer_cannot_record_lien_returns_unauthorized
        claim_type: role_denial
        grounds:
          - roles.CodeOfficer
          - endpoints."POST /registry/fines/{id}/record-lien"
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "CodeOfficer calling record-lien (a ProgramAdmin exclusive) returns ERR_UNAUTHORIZED (403); authorization is checked before resource existence."
        test_recipe:
          setup: ["Empty DB (authz precedes existence)."]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/fines/00000000-0000-0000-0000-000000000000/record-lien"
              payload: {}
              as: CodeOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: registrant_cannot_demolish_returns_unauthorized
        claim_type: role_denial
        grounds:
          - roles.Registrant
          - endpoints."POST /registry/properties/{id}/demolish"
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Registrant calling demolish (a ProgramAdmin exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /registry/properties/00000000-0000-0000-0000-000000000000/demolish"
              payload: {}
              as: Registrant
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "error_id == ERR_UNAUTHORIZED"

      - name: anonymous_cannot_read_property_returns_unauthenticated
        claim_type: role_denial
        grounds:
          - endpoints."GET /registry/properties/{id}"
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "An Anonymous (unauthenticated) caller reading a property returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /registry/properties/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

