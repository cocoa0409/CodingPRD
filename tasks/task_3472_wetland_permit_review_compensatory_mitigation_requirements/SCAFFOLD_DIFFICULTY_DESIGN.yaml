            - { call: "POST /wetland-permits/alternatives-analyses/${aa_id}/review", payload: { verdict: "ACCEPT" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-plans", payload: { application_id: "${app_id}", mechanism: "BANK_CREDITS" }, as: Applicant, as_user_id: "${ap_id}", captures: { plan_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/submit", payload: {}, as: Applicant, as_user_id: "${ap_id}" }
            - { call: "POST /wetland-permits/mitigation-plans/${plan_id}/review", payload: { verdict: "APPROVE" }, as: Reviewer, as_user_id: "rev-1" }
            - { call: "POST /wetland-permits/mitigation-banks", payload: { bank_name: "Shenandoah Mitigation Bank", sponsor_name: "Shenandoah Conservancy", state_code: "VA", service_area_watersheds: ["18020101"], credit_capacity: { FORESTED_WETLAND: 20 }, base_price_per_credit: { FORESTED_WETLAND: 30000 } }, as: SystemAdmin, captures: { bank_id: "$.data.id" } }
            - { call: "POST /wetland-permits/mitigation-banks/${bank_id}/approve", payload: {}, as: DistrictEngineer, as_user_id: "de-1" }
            - { call: "POST /wetland-permits/credit-transactions", payload: { bank_id: "${bank_id}", plan_id: "${plan_id}", resource_type: "FORESTED_WETLAND", credits: 9.0 }, as: Applicant, as_user_id: "${ap_id}", captures: { txn1: "$.data.id" } }
            - { call: "POST /wetland-permits/credit-transactions/${txn1}/purchase", payload: {}, as: Applicant, as_user_id: "${ap_id}", captures: { total1: "$.data.total_price_dollars" } }
          trigger:
