      - name: policy_revision_loop_and_asset_gating_loop_are_covered_by_the_cyclic_difficulty_instances
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.BiometricPolicy.IN_REVIEW_to_DRAFT
        excluded_because:
          difficulty_instance: policy_review_kickback_cycle_increments_revision_count_and_restamps_submitter
          rationale: "The cyclic-shape claim is exactly what that difficulty instance asserts: it drives DRAFT -> IN_REVIEW -> DRAFT -> IN_REVIEW, pins revision_count to 1 and proves the loop re-stamps submitted_by_user_id, so a separate corner test would re-run the same edges with weaker assertions."

      - name: incident_parallel_dimensions_are_covered_by_the_parallel_difficulty_instance
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.IncidentCase
        excluded_because:
          difficulty_instance: incident_containment_and_notification_dimensions_advance_independently
          rationale: "That difficulty instance already advances containment_status and notification_status independently and then proves the guard between them via ERR_NOTIFICATION_OUTSTANDING; the parallel-dimension claim has no residue left to test."

      - name: guarded_cross_entity_transitions_are_covered_by_the_cross_entity_difficulty_instances
        claim_type: guarded_transitions
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.BiometricAsset.CLASSIFIED_to_ACTIVE
        excluded_because:
          difficulty_instance: asset_activation_requires_notice_packet_in_published_state
          rationale: "The guard 'A -> B only if entity C is in state X' is the whole content of that difficulty instance, which flips only NoticePacket.status between two otherwise identical activation attempts."

      - name: consent_regrant_compensation_is_covered_by_the_compensating_invariant_instance
        claim_type: compensation
        grounds:
          - state_machines.ConsentRecord.SOLICITED_to_GRANTED
          - state_machines.AlternativeAccommodation.REQUESTED_to_ENDED
        excluded_because:
          difficulty_instance: regranting_consent_ends_the_auto_accommodation_and_restores_enrollment_count
          rationale: "That difficulty instance is the compensation claim: it reverses the auto-accommodation side effect of a revocation and proves enrolled_subject_count returns to exactly its pre-revocation value with no drift."

