    grounds: validations.guarantee_window_open; calculations.replacement_refund_proration; calculations.placement_fee_computation
      (guarantee_expires_on, half-open)
    mechanism: 'guarantee_expires_on is 2026-11-30 (start 2026-09-01 plus 90 days) and the window is half-open, so
      the last admissible clock date is 2026-11-29. The claim filed on that date carries elapsed_days 89 and unused_days
      1: gross = ROUND_HALF_UP(3349499 / 90) = 37217, which falls under the 1000000 tier floor and so retains only
      500 bps = 1861, netting 35356.'
