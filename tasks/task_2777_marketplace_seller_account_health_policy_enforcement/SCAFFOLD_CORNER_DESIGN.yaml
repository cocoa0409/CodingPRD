              captures: { ap1_state: $.data.state }
          assert:
            - "${ap1_deadline} == 2026-08-15T00:00:00.000Z   # decided_at 2026-08-01 + ESCALATION_WINDOW_DAYS 14"
            - "first escalate at 2026-08-16: HTTP 422 and ${err_code} == ERR_ESCALATION_WINDOW_CLOSED"
            - "Appeal.${ap1}.state was still DENIED after the refusal"
            - "second escalate at exactly the deadline: HTTP 200 and ${ap1_state} == ESCALATED_REVIEW"
            - "Appeal.${ap1}.escalation_requested_at == 2026-08-15T00:00:00.000Z"
            - "EnforcementAction.${a1}.state == UPHELD   # the denial upheld it; escalation does not move it back"
