      - name: error_unauthenticated_missing_headers
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers returns ERR_UNAUTHENTICATED (401) before role checks."
        test_recipe:
          setup: ["Any endpoint"]
          setup_api_calls: []
          trigger:
            - call: "GET /complaint-office/products"
              payload: {}
              as: __NO_AUTH_HEADERS__
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "http status == 401"

