              as: PostSupervisor
            - call: "POST /post-production/projects/${proj_id}/activate"
              payload: {}
              as: PostSupervisor
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { storage_before: $.data.storage_used_gb }
            - call: "POST /post-production/projects/${proj_id}/batches"
              payload: { batch_label: "DAY01", ingest_window_start: "2026-07-31T00:00:00Z", ingest_window_end: "2026-08-31T23:59:59Z" }
              as: MediaManager
              captures: { batch_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/start-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C001", source_bytes: 1073741824, duration_frames: 100 }
              as: MediaManager
              captures: { asset1_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/assets"
              payload: { batch_id: "${batch_id}", reel_name: "A001", clip_name: "C002", source_bytes: 536870912, duration_frames: 100 }
              as: MediaManager
              captures: { asset2_id: $.data.id }
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/finish-ingest"
              payload: {}
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets/${asset1_id}/proxy-complete"
              payload: { proxy_bytes: 268435456 }
              as: MediaManager
            - call: "POST /post-production/projects/${proj_id}/assets/${asset2_id}/proxy-complete"
              payload: { proxy_bytes: 134217728 }
              as: MediaManager
          trigger:
            - call: "POST /post-production/projects/${proj_id}/batches/${batch_id}/purge"
              payload: {}
              as: MediaManager
            - call: "GET /post-production/projects/${proj_id}"
              payload: {}
              as: PostSupervisor
              captures: { storage_after: $.data.storage_used_gb }
          assert:
            - "storage_before == 0.0"
            - "storage_after == 0.0"
            - "storage_after == storage_before   # bytes conserved across add + purge"
