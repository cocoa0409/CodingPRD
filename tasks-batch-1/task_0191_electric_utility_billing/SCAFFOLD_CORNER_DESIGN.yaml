              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill1_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", due_date: "2026-03-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill2_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acct_v_pre: $.data.version }
            - call: "POST /bills/${bill1_id}/issue"
              payload: { expected_account_version: "${acct_v_pre}" }
              as: BillingOperator
          trigger:
            - call: "POST /bills/${bill2_id}/issue"
              payload: { expected_account_version: "${acct_v_pre}" }
              as: BillingOperator
              captures: { err: $.data.error_id }
          assert:
            - "first issue succeeded and bumped account.version; second issue with the now-stale ${acct_v_pre} returns ERR_STALE_ACCOUNT_VERSION (http 412)"
            - "Bill.${bill2_id}.status == DRAFT (unchanged)"

      - name: budget_trueup_stale_account_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[budget-trueup-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / budget_levelized_vs_standard_actual_on_bill
          rationale: "The budget-plan OCC field is declared and exercised through the budget true-up path; the stale-version negative is the OCC corollary of the budget-billing difficulty instance and the bill-issue OCC corner above already enumerates the stale-version 412 contract on the same parent (Account)."

      - name: cascade_disconnect_ordering_end_to_end
        claim_type: cascading_side_effects
        grounds: [state_machines.Account.DISCONNECT_PENDING_to_ACTIVE, state_machines.ServiceOrder.SCHEDULED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / payment_clears_arrears_cascades_cancel_disconnect_revert_service
          rationale: "The full payment->arrears-clear->cancel-disconnect->revert-service cascade is asserted end-to-end by the named §1.8 transitive-cascade instance."

  # =========================================================================
  - section: consistency_model
    instances:
      - name: issued_bill_charges_visible_in_same_response
        claim_type: immediate
        grounds: [endpoints, entities.Bill.fields.total_due_cents]
        distinguishing_aspect: "POST /bills/{id}/issue returns the fully computed charge lines (energy 156, demand 1600, total_due 2756) in the same response — immediate consistency, no read-after-write lag."
        test_recipe:
          setup: ["Account + meter + reads producing actual 2756; DRAFT bill"]
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-COR-29", name: "Corner 29", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Immediate Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-IM1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T17:00:00Z", interval_end: "2026-01-05T18:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T18:00:00Z", interval_end: "2026-01-05T19:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T07:00:00Z", interval_end: "2026-01-05T08:00:00Z", import_kwh: 4.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { energy: $.data.energy_charge_cents, demand: $.data.demand_charge_cents, due: $.data.total_due_cents }
          assert:
            - "issue response Bill.${bill_id}.energy_charge_cents == 156"
            - "issue response Bill.${bill_id}.demand_charge_cents == 1600"
            - "issue response Bill.${bill_id}.total_due_cents == 2756"
