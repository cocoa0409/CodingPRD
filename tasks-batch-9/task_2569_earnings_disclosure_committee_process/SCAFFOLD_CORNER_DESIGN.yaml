      - name: subcertification_due_instant_admits_the_internal_target_and_rejects_one_second_past_it
        claim_type: temporal_validation
        grounds:
          - validations[priority=40]
          - errors[ERR_SUBCERT_DUE_OUT_OF_WINDOW]
          - calculations.statutory_deadline_resolution
          - endpoints[POST /disclosure/sub-certifications]
        distinguishing_aspect: |
          The admissible due window is the half-open interval (clock, internal_target_utc], and both ends
          are probed from both sides in one chain. internal_target_utc is 2026-08-05T17:30:00Z — the
          statutory deadline minus five CALENDAR days with no business-day roll — so a due_utc of exactly
          2026-08-05T17:30:00Z is accepted while 2026-08-05T17:30:01Z is refused, and a due_utc of exactly
          the logical clock 2026-08-01T00:00:00Z is refused while 2026-08-01T00:00:01Z is accepted. The
          operation is legal at the instant it is requested yet schedules a certification that would land
          after the internal target, which is exactly the future conflict this rule detects: an
          implementation that compares against statutory_deadline_utc instead of internal_target_utc
          accepts the 17:30:01 leg, and one that uses >= on the lower bound accepts the clock leg.
        test_recipe:
          setup:
            - "An adopted charter with a FINANCE and a LEGAL seat, and a FY2026-Q2 cycle in CLOSE_OPEN (internal_buffer_days 5)."
            - "The logical clock is exactly 2026-08-01T00:00:00Z, the startup default, and is never moved."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Owen Legal", function: "LEGAL", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id, deadline: $.data.statutory_deadline_utc, target: $.data.internal_target_utc }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_id}"
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_id}"
          trigger:
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "REVENUE", due_utc: "2026-08-05T17:30:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { on_target_id: $.data.id, on_target_status: $.data.status, on_target_weight: $.data.scope_weight }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "OPERATIONS", due_utc: "2026-08-05T17:30:01Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              expect_error: { http: 409, error_id: ERR_SUBCERT_DUE_OUT_OF_WINDOW }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "IT_CONTROLS", due_utc: "2026-08-01T00:00:00Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              expect_error: { http: 409, error_id: ERR_SUBCERT_DUE_OUT_OF_WINDOW }
            - call: "POST /disclosure/sub-certifications"
              payload: { cycle_id: "${cycle_id}", member_id: "${fin_id}", scope_area: "LEGAL_CONTINGENCY", due_utc: "2026-08-01T00:00:01Z" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
              captures: { one_sec_id: $.data.id, one_sec_status: $.data.status, one_sec_weight: $.data.scope_weight }
            - call: "GET /disclosure/reporting-cycles/${cycle_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { total_weight: $.data.total_assigned_scope_weight, coverage: $.data.certification_coverage_pct }
          assert:
            - "${deadline} == \"2026-08-10T17:30:00Z\" and ${target} == \"2026-08-05T17:30:00Z\""
            - "${on_target_status} == PENDING and ${on_target_weight} == 30.00"
            - "the 2026-08-05T17:30:01Z leg returns 409 ERR_SUBCERT_DUE_OUT_OF_WINDOW"
            - "the 2026-08-01T00:00:00Z leg returns 409 ERR_SUBCERT_DUE_OUT_OF_WINDOW"
            - "${one_sec_status} == PENDING and ${one_sec_weight} == 25.00"
            - "${total_weight} == 55.00 and ${coverage} == 0.00"
          notes: |
            The two accepted rows do not collide under §1.4 priority 41: the on-target row occupies the
            closed window [2026-08-02T17:30:00Z, 2026-08-05T17:30:00Z] and the one-second row occupies
            [2026-07-29T00:00:01Z, 2026-08-01T00:00:01Z], which are disjoint, so the aggregate capacity of
            two is never consulted. total_assigned_scope_weight is 30.00 + 25.00 and coverage is 0.00
            because neither row is SUBMITTED yet.

      - name: approve_gate_reads_the_whole_set_recompute_so_a_matching_new_line_can_still_block_the_document
        claim_type: cascading_validation
        grounds:
          - validations[priority=27]
          - calculations.tie_out_variance_and_tolerance_escalation
          - errors[ERR_TIE_OUT_NOT_PASSED]
          - state_machines.TieOutItem.MATCHED_to_VARIANCE
          - state_machines.TieOutItem.VARIANCE_to_MATCHED
          - state_machines.TieOutItem.VARIANCE_to_WAIVED
        distinguishing_aspect: |
          Check A (§1.4 priority 27, the APPROVE gate) can only be evaluated after check B (STEP 1-5 of
          the tie-out recompute) has been re-run over the document's WHOLE non-WAIVED item set, and the
          chain makes the dependency visible by adding a line that itself MATCHES: item 2 at 40 bp
          against a 60 bp tolerance is comfortably inside its own tolerance, yet it lifts the document
          total from 24 to 64 bp, which drops the tier multiplier from 1.00 to 0.75, which floors item 1's
          effective tolerance from 25 to 18 and flips item 1 — untouched by the request — to VARIANCE, so
          tie_out_status becomes FAILED and the APPROVE is refused. Waiving item 1 then removes it from
          the STEP-2 snapshot, the total relaxes to 40, the tier returns to 1.00 and the APPROVE succeeds:
          the gate is re-derived from the recompute, never cached. An implementation that evaluates only
          the row it just wrote approves a FAILED document.
        test_recipe:
          setup:
            - "An adopted charter with two FINANCE seats (so a tie-out review has a non-preparer reviewer) and a LEGAL seat, and a FY2026-Q2 cycle in CLOSE_OPEN."
            - "One PERIODIC_FILING document in IN_REVIEW carrying a single tie-out line at 24 bp against a 25 bp tolerance, so tie_out_total_variance_bp is 24, the tier is 1.00 and tie_out_status is PASSED."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
