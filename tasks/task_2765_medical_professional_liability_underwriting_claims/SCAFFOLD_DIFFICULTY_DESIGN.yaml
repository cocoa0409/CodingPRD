# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2765 - Medical Professional Liability Underwriting & Claims
#
# 9 rule_ids x >= 2 differentiated instances = 22 instances.
# Every money / index literal in an `assert:` below was computed by executing
# the referenced §1.3 formula (Decimal, ROUND_HALF_UP) against the literals
# pinned in the same instance's `setup_api_calls:`.
#
# Standing conventions used by every chain:
#   * The logical clock is pinned explicitly with POST /mpl/_clock/set_current_utc
#     before anything date-sensitive; the scaffold default is 2026-08-01T00:00:00Z.
#   * Opaque-role audit ids are pinned as literals (uw-1, adj-1, appr-1, chair-1,
#     act-1, chief-1, comp-1) wherever segregation of duties is in play.
#   * Every OCC write is preceded by a GET of the parent so `expected_*_version`
#     is a ${var} captured from a server response, never a literal.
# ===========================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: risk_classification_snapshot_versus_renewal_prospective_band_divergence
        grounds:
          - calculations.insured_risk_classification
          - calculations.insured_risk_classification.variants.UNDERWRITING_SNAPSHOT
          - calculations.insured_risk_classification.variants.RENEWAL_PROSPECTIVE
          - entities.Insured.fields.risk_class_code
          - entities.PolicyTerm.fields.rating_variant
          - entities.PolicyTerm.fields.rated_risk_class_factor
        distinguishing_aspect: |
          The same four open claims are excluded by UNDERWRITING_SNAPSHOT and included at
          OPEN_CLAIM_WEIGHT by RENEWAL_PROSPECTIVE, so Insured.risk_class_code stays R2 (factor
          1.00) while the renewal term rates at R3 (factor 1.30) off identical stored data.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "SpecialtyClass OBSTETRICS_GYNECOLOGY with base_rate_per_million 38000.00 and hazard_index 7.0."
            - "Credentialed PHYSICIAN insured in COOK_IL with high_severity_procedure_pct 40."
            - "CLAIMS_MADE policy, per-claim limit 1000000.00, first term 2026-08-01 -> 2027-08-01 IN_FORCE."
            - "Four open claims reported inside the first term (claim_status INTAKE, coverage UNDER_REVIEW)."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              captures: { term_a1: $.data.id }
            - call: "POST /mpl/policy-terms/${term_a1}/issuance"
              payload: {}
              as: UnderwritingOfficer
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-05", report_date: "2026-09-01", venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", demand_amount: 100000.00 }
              as: ClaimsAdjuster
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-06", report_date: "2026-09-02", venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", demand_amount: 100000.00 }
              as: ClaimsAdjuster
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-07", report_date: "2026-09-03", venue_code: "COOK_IL", allegation_category: "DIAGNOSIS_FAILURE", demand_amount: 100000.00 }
              as: ClaimsAdjuster
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-08", report_date: "2026-09-04", venue_code: "COOK_IL", allegation_category: "DIAGNOSIS_FAILURE", demand_amount: 100000.00 }
              as: ClaimsAdjuster
            - call: "GET /mpl/policies/${pol_a}"
              payload: {}
              as: UnderwritingOfficer
              captures: { pol_a_v1: $.data.version }
          trigger:
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2027-08-01", expiration_date: "2028-08-01", predecessor_term_id: "${term_a1}", expected_policy_version: "${pol_a_v1}" }
              as: UnderwritingOfficer
              captures: { term_a2: $.data.id }
          assert:
            - "Insured.${ins_a}.open_claim_count == 4"
            - "Insured.${ins_a}.closed_paid_claim_count == 0"
            - "Insured.${ins_a}.risk_class_score == 4.20"
            - "Insured.${ins_a}.risk_class_code == R2"
            - "Insured.${ins_a}.risk_class_factor == 1.00"
            - "PolicyTerm.${term_a2}.rating_variant == RENEWAL_PROSPECTIVE"
            - "PolicyTerm.${term_a2}.rated_risk_class_code == R3"
            - "PolicyTerm.${term_a2}.rated_risk_class_factor == 1.30"
            - "PolicyTerm.${term_a2}.claims_made_step_year == 2"
            - "PolicyTerm.${term_a2}.step_factor == 0.60"
            - "PolicyTerm.${term_a2}.premium_manual == 42978.00"
            - "PolicyTerm.${term_a2}.premium_net == 42978.00"
            - "PolicyTerm.${term_a2}.administrative_fee == 500.00"
            - "PolicyTerm.${term_a2}.guaranty_fund_assessment == 543.48"
            - "PolicyTerm.${term_a2}.term_total == 44021.48"
            - "PolicyTerm.${term_a1}.rated_risk_class_code == R2"

      - name: claim_incurred_case_versus_actuarial_delta_after_expense_payment
        grounds:
          - calculations.claim_incurred_loss
          - calculations.claim_incurred_loss.variants.CASE_INCURRED
          - calculations.claim_incurred_loss.variants.ACTUARIAL_INCURRED
          - calculations.case_reserve_projection.variants.FORMULA_BASIS
          - entities.Claim.fields.case_incurred
          - entities.Claim.fields.actuarial_incurred
        distinguishing_aspect: |
          With paid_expense 40000.00 sitting under an expense_reserve of 182700.00, CASE_INCURRED
          erodes the reserve to 835200.00 while ACTUARIAL_INCURRED stacks payments on the full
          reserve at 875200.00 - a delta of exactly min(paid_expense, expense_reserve) = 40000.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured, in-force claims-made term."
            - "Claim with demand_amount 1000000.00 in COOK_IL, coverage COVERED, handling INVESTIGATION."
            - "One FORMULA_BASIS reserve entry: indemnity 652500.00, expense 182700.00."
            - "A COOK_IL panel firm assigned to the claim."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ClaimsAdjuster
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "OBSTETRICS_GYNECOLOGY", base_class_code: "CLASS_6", base_rate_per_million: 38000.00, hazard_index: 7.0, benchmark_severity: 640000.00 }
              as: ActuarialAnalyst
              captures: { sc_obgyn: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Rivera OBGYN PC", specialty_class_id: "${sc_obgyn}", venue_code: "COOK_IL", high_severity_procedure_pct: 40, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              captures: { ins_a: $.data.id }
            - call: "POST /mpl/insureds/${ins_a}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_a}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              captures: { pol_a: $.data.id, pol_a_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_a}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_a_v0}" }
              as: UnderwritingOfficer
              captures: { term_a1: $.data.id }
            - call: "POST /mpl/policy-terms/${term_a1}/issuance"
              payload: {}
              as: UnderwritingOfficer
            - call: "POST /mpl/counsel-firms"
              payload: { firm_name: "Halloran Defense LLP", admitted_venue_codes: ["COOK_IL"], allegation_specialties: ["OBSTETRIC_INJURY", "SURGICAL_ERROR"], blended_hourly_rate: 425.00, quality_score: 90, max_concurrent_assignments: 5, conflict_insured_ids: [] }
              as: ClaimsCommitteeApprover
              captures: { firm_h: $.data.id }
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_a}", incident_date: "2026-08-05", report_date: "2026-09-01", venue_code: "COOK_IL", allegation_category: "OBSTETRIC_INJURY", demand_amount: 1000000.00 }
              as: ClaimsAdjuster
              captures: { clm_a: $.data.id }
            - call: "POST /mpl/claims/${clm_a}/coverage-decision"
              payload: { coverage_status: "COVERED" }
              as: ClaimsAdjuster
            - call: "GET /mpl/claims/${clm_a}"
              payload: {}
              as: ClaimsAdjuster
              captures: { clm_a_v1: $.data.version }
            - call: "POST /mpl/claims/${clm_a}/reserve-entries"
              payload: { method: "FORMULA_BASIS", effective_at: "2026-09-05T00:00:00Z", rationale: "initial projected reserve", expected_claim_version: "${clm_a_v1}" }
              as: ClaimsAdjuster
              captures: { res_a1: $.data.id }
            - call: "POST /mpl/claims/${clm_a}/counsel-assignments"
              payload: {}
              as: ClaimsAdjuster
              captures: { asg_a1: $.data.id }
          trigger:
            - call: "POST /mpl/claims/${clm_a}/expense-payments"
              payload: { amount: 40000.00, invoice_reference: "HAL-2026-0001", counsel_assignment_id: "${asg_a1}" }
              as: ClaimsAdjuster
          assert:
            - "ReserveEntry.${res_a1}.computed_indemnity_amount == 652500.00"
            - "ReserveEntry.${res_a1}.computed_expense_amount == 182700.00"
            - "Claim.${clm_a}.indemnity_reserve == 652500.00"
            - "Claim.${clm_a}.expense_reserve == 182700.00"
            - "Claim.${clm_a}.paid_expense == 40000.00"
            - "Claim.${clm_a}.paid_indemnity == 0.00"
            - "Claim.${clm_a}.case_incurred == 835200.00"
            - "Claim.${clm_a}.actuarial_incurred == 875200.00"
            - "Claim.${clm_a}.actuarial_incurred - Claim.${clm_a}.case_incurred == 40000.00"
            - "CounselAssignment.${asg_a1}.billed_expense_amount == 40000.00"
            - "DefenseCounselFirm.${firm_h}.billed_expense_total == 40000.00"

  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: admin_fee_tier_keyed_on_premium_net_not_on_term_total
        grounds:
          - calculations.claims_made_step_premium
          - calculations.claims_made_step_premium.constants.ADMIN_FEE_TIER_1_MAX
          - calculations.claims_made_step_premium.constants.GUARANTY_FUND_RATE
          - entities.PolicyTerm.fields.administrative_fee
          - entities.PolicyTerm.fields.guaranty_fund_assessment
          - entities.PolicyTerm.fields.term_total
        distinguishing_aspect: |
          Mode (c) - order of operations: premium_net lands at 24800.00, just under
          ADMIN_FEE_TIER_1_MAX 25000.00, while term_total lands at 25363.13, just over it, so keying
          the tier on term_total instead of premium_net yields 500.00 rather than the correct 250.00
          and drags the guaranty-fund assessment from 313.13 to 316.25.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "SpecialtyClass ORTHOPEDIC_SURGERY with base_rate_per_million 24800.00 and hazard_index 6.0."
            - "PHYSICIAN insured in MARICOPA_AZ (venue factor 1.00) with high_severity_procedure_pct 30 -> R2, factor 1.00."
            - "CLAIMS_MADE policy at the 1000000.00 limit (ILF 1.00) with prior_acts_step_credit 4, so the first term rates at step year 5 (factor 1.00)."
            - "No completed risk-management programs and no closed peer review cases, so credit and surcharge are both 0."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "ORTHOPEDIC_SURGERY", base_class_code: "CLASS_5", base_rate_per_million: 24800.00, hazard_index: 6.0, benchmark_severity: 480000.00 }
              as: ActuarialAnalyst
              captures: { sc_ortho: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Desert Orthopedics PLLC", specialty_class_id: "${sc_ortho}", venue_code: "MARICOPA_AZ", high_severity_procedure_pct: 30, years_in_practice: 12, board_certified: true }
              as: UnderwritingOfficer
              captures: { ins_b: $.data.id }
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_b}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 4, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              captures: { pol_b: $.data.id, pol_b_v0: $.data.version }
          trigger:
            - call: "POST /mpl/policies/${pol_b}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_b_v0}" }
              as: UnderwritingOfficer
              captures: { term_b1: $.data.id }
          assert:
            - "PolicyTerm.${term_b1}.claims_made_step_year == 5"
            - "PolicyTerm.${term_b1}.step_factor == 1.00"
            - "PolicyTerm.${term_b1}.increased_limits_factor == 1.00"
            - "PolicyTerm.${term_b1}.venue_severity_factor == 1.00"
            - "PolicyTerm.${term_b1}.rated_risk_class_code == R2"
            - "PolicyTerm.${term_b1}.premium_manual == 24800.00"
            - "PolicyTerm.${term_b1}.premium_net == 24800.00"
            - "PolicyTerm.${term_b1}.administrative_fee == 250.00"
            - "PolicyTerm.${term_b1}.guaranty_fund_assessment == 313.13"
            - "PolicyTerm.${term_b1}.term_total == 25363.13"
            - "Policy.${pol_b}.quoted_premium_total == 25363.13"
            - "Policy.${pol_b}.written_premium_net_total == 0.00"

      - name: required_reserve_rounds_each_claim_before_summing
        grounds:
          - calculations.reserve_adequacy_ratio
          - calculations.rate_indication
          - entities.RateFiling.fields.required_reserve_total
          - entities.RateFiling.fields.reserve_adequacy_ratio
          - entities.RateFiling.fields.credibility_weighted_indication_pct
        distinguishing_aspect: |
          Mode (b) - rounding placement: two claims demanding 12345.68 and 12345.67 each round to
          3160.49, summing to 6320.98, whereas summing the raw products first and rounding once
          yields 6320.99; the pinned per-claim rounding is the only path to 6320.98.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "SpecialtyClass FAMILY_MEDICINE, base_rate_per_million 9500.00, hazard_index 2.0."
            - "PHYSICIAN insured in MARICOPA_AZ with high_severity_procedure_pct 10 -> R1, factor 0.85."
            - "One IN_FORCE term 2026-08-01 -> 2027-08-01 with premium_net 2826.25."
            - "Two COVERED claims in MARICOPA_AZ, demands 12345.68 and 12345.67 (both BAND_1, factor 0.20), each carrying a CASE_BASIS reserve of 2000.00 indemnity + 900.00 expense."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
            - call: "POST /mpl/specialty-classes"
              payload: { specialty_code: "FAMILY_MEDICINE", base_class_code: "CLASS_1", base_rate_per_million: 9500.00, hazard_index: 2.0, benchmark_severity: 180000.00 }
              as: ActuarialAnalyst
              captures: { sc_fm: $.data.id }
            - call: "POST /mpl/insureds"
              payload: { entity_type: "PHYSICIAN", legal_name: "Papago Family Medicine", specialty_class_id: "${sc_fm}", venue_code: "MARICOPA_AZ", high_severity_procedure_pct: 10, years_in_practice: 8, board_certified: true }
              as: UnderwritingOfficer
              captures: { ins_c: $.data.id }
            - call: "POST /mpl/insureds/${ins_c}/credentialing-decision"
              payload: { credentialing_status: "CREDENTIALED", credentialing_expires_on: "2028-01-01" }
              as: UnderwritingOfficer
            - call: "POST /mpl/policies"
              payload: { insured_id: "${ins_c}", coverage_form: "CLAIMS_MADE", limit_per_claim: 1000000.00, limit_aggregate: 3000000.00, retroactive_date: "2026-08-01", prior_acts_step_credit: 0, consent_to_settle_clause: "NONE" }
              as: UnderwritingOfficer
              captures: { pol_c: $.data.id, pol_c_v0: $.data.version }
            - call: "POST /mpl/policies/${pol_c}/terms"
              payload: { effective_date: "2026-08-01", expiration_date: "2027-08-01", expected_policy_version: "${pol_c_v0}" }
              as: UnderwritingOfficer
              captures: { term_c1: $.data.id }
            - call: "POST /mpl/policy-terms/${term_c1}/issuance"
              payload: {}
              as: UnderwritingOfficer
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_c}", incident_date: "2026-08-10", report_date: "2026-09-01", venue_code: "MARICOPA_AZ", allegation_category: "DIAGNOSIS_FAILURE", demand_amount: 12345.68 }
              as: ClaimsAdjuster
              captures: { clm_c1: $.data.id }
            - call: "POST /mpl/claims/${clm_c1}/coverage-decision"
              payload: { coverage_status: "COVERED" }
              as: ClaimsAdjuster
            - call: "GET /mpl/claims/${clm_c1}"
              payload: {}
              as: ClaimsAdjuster
              captures: { clm_c1_v: $.data.version }
            - call: "POST /mpl/claims/${clm_c1}/reserve-entries"
              payload: { method: "CASE_BASIS", indemnity_amount: 2000.00, expense_amount: 900.00, effective_at: "2026-09-05T00:00:00Z", rationale: "adjuster case reserve", expected_claim_version: "${clm_c1_v}" }
              as: ClaimsAdjuster
            - call: "POST /mpl/claims"
              payload: { insured_id: "${ins_c}", incident_date: "2026-08-11", report_date: "2026-09-02", venue_code: "MARICOPA_AZ", allegation_category: "MEDICATION_ERROR", demand_amount: 12345.67 }
              as: ClaimsAdjuster
              captures: { clm_c2: $.data.id }
            - call: "POST /mpl/claims/${clm_c2}/coverage-decision"
              payload: { coverage_status: "COVERED" }
              as: ClaimsAdjuster
            - call: "GET /mpl/claims/${clm_c2}"
              payload: {}
              as: ClaimsAdjuster
              captures: { clm_c2_v: $.data.version }
            - call: "POST /mpl/claims/${clm_c2}/reserve-entries"
              payload: { method: "CASE_BASIS", indemnity_amount: 2000.00, expense_amount: 900.00, effective_at: "2026-09-06T00:00:00Z", rationale: "adjuster case reserve", expected_claim_version: "${clm_c2_v}" }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /mpl/rate-filings"
              payload: { specialty_class_id: "${sc_fm}", indication_method: "LOSS_RATIO_METHOD", proposed_rate_change_pct: 5.00, experience_period_start: "2026-08-01", experience_period_end: "2027-08-01", effective_date: "2027-08-01" }
              as: ActuarialAnalyst
              as_user_id: "act-1"
              captures: { rf_c: $.data.id }
          assert:
            - "RateFiling.${rf_c}.claim_count_in_scope == 2"
            - "RateFiling.${rf_c}.required_reserve_total == 6320.98"
            - "RateFiling.${rf_c}.carried_reserve_total == 5800.00"
            - "RateFiling.${rf_c}.reserve_adequacy_ratio == 0.9176"
            - "RateFiling.${rf_c}.adequacy_flag == ADEQUATE"
            - "RateFiling.${rf_c}.in_scope_premium_total == 2826.25"
            - "RateFiling.${rf_c}.actuarial_incurred_total == 5800.00"
            - "RateFiling.${rf_c}.experience_loss_ratio == 2.0522"
            - "RateFiling.${rf_c}.indicated_change_pct == 215.72"
            - "RateFiling.${rf_c}.credibility_weight == 0.30"
            - "RateFiling.${rf_c}.credibility_weighted_indication_pct == 67.87"
            - "RateFiling.${rf_c}.filing_number == RF-000001"
            - "PolicyTerm.${term_c1}.premium_net == 2826.25"

      - name: hammer_exposure_caps_before_excess_split
        grounds:
          - calculations.settlement_insured_share
          - calculations.settlement_insured_share.constants.HAMMER_EXPOSURE_MULTIPLIER
          - calculations.settlement_insured_share.constants.HAMMER_INSURED_SHARE_PCT
          - state_machines.SettlementNegotiation.VETOED_to_HAMMER_INVOKED
          - entities.SettlementNegotiation.fields.carrier_share_amount
          - entities.Claim.fields.insured_share_receivable
        distinguishing_aspect: |
          Mode (a) - nested min/max: min(400000.00 * 1.60, 1000000.00) = 640000.00 feeds
          max(0.00, 640000.00 - 400000.00) = 240000.00, which halves to an insured share of
          120000.00 and a carrier share of 520000.00; three operators compose in one pinned order.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OBSTETRICS_GYNECOLOGY class, COOK_IL insured."
            - "CLAIMS_MADE policy with consent_to_settle_clause HAMMER and per-claim limit 1000000.00, first term IN_FORCE."
            - "Claim demanding 800000.00, coverage COVERED, suit filed (claim_status LITIGATION)."
            - "Negotiation proposing 400000.00 with 450000.00 authority granted by a different user, tendered to the insured, and vetoed."
          setup_api_calls:
            - call: "POST /mpl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UnderwritingOfficer
