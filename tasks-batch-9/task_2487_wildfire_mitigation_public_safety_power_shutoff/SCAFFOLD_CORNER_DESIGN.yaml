            - call: "POST /community-resource-centers"
              payload: { resource_center_code: "CRC-W2", district_code: "D-WEST", site_capacity: 3, accessibility_certified: true }
              as: CommunityLiaison
              captures: { crc_active_id: $.data.id }
            - call: "POST /psps-events/${evm_id}/activate-resource-centers"
              payload: {}
              as: PSPSDutyOfficer
          trigger:
            - call: "POST /psps-events/${evm_id}/activate-resource-centers"
              payload: { requested_resource_center_ids: ["${crc_active_id}"] }
              as: PSPSDutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response is HTTP 409 with data.error_id == ERR_RESOURCE_CENTER_ALREADY_ACTIVE"
            - "CommunityResourceCenter.${crc_active_id}.status is still ACTIVATED with activation_order 1"
            - "PSPSEvent.${evm_id}.crc_capacity_served is still 3 — the capacity was not double counted"
            - "PSPSEvent.${evm_id}.crc_mitigation_credit == 0.74 and net_benefit_ratio == 0.2743, unchanged by the rejection"

      - name: stale_version_error_is_triggerable_on_both_concurrency_rules
        claim_type: Error triggerability
        excluded_because:
          difficulty_instance: record_completion_then_withdraw_conserves_hardened_mileage_ledger
          rationale: "ERR_STALE_VERSION is triggered by both §1.2.1 rules in the cross_cutting_complexity_layers section of this file and again on the priority-7 pair in the validations section; no further probe adds information."
      - name: event_not_cancellable_error_is_triggerable
        claim_type: Error triggerability
        excluded_because:
          difficulty_instance: circuit_energization_full_cycle_returns_to_energized
          rationale: "ERR_EVENT_NOT_CANCELLABLE is raised in this file's state_machines section (cancel_on_a_closed_event_is_not_cancellable), which walks the same closed-event lockdown that instance establishes."
      - name: filing_review_track_errors_are_triggerable
        claim_type: Error triggerability
        excluded_because:
