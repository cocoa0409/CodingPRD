            - "the second trigger call returns HTTP 422 with error_id ERR_RECIPROCITY_NOT_AVAILABLE, because UT is not a member of the NV profile's reciprocity_states [AZ]"
            - "LicenseTransfer.${lt_r2}.status == NOT_STARTED after the refusal"
