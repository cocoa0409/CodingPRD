  - rule_id: priority_pair_validation_conflict
    instances:
      - name: issue_expired_recalled_unit_state_error_wins
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - endpoints.POST /tissue-bank/tissue-units/{id}/issue
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): the unit violates BOTH the
          state precondition (status EXPIRED -> ERR_UNIT_NOT_ISSUABLE_STATE, priority 4)
          AND two safety gates (ERR_UNIT_EXPIRED and ERR_UNIT_UNDER_ACTIVE_RECALL,
          priority 5); priority 4 must win.
        test_recipe:
          setup:
            - "Supplier qualified; freezer; 1 BONE unit U-001 (lot L1, expiration_at 2026-09-01T00:00:00Z) ACCEPTED + released AVAILABLE"
            - "Recall R1 (lot L1, window covering receipt) ACTIVATED -> U-001 QUARANTINED (RECALL)"
            - "Clock advanced to 2026-09-02T00:00:00Z -> expiry sweep moves U-001 QUARANTINED -> EXPIRED (hold_reason cleared)"
            - "At trigger: U-001 is EXPIRED (state violation) AND past expiration_at AND under an ACTIVE recall (two safety violations)"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2026-09-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/recalls", payload: { supplier_id: "${sup}", lot_numbers: ["L1"], received_window_start: "2026-01-01T00:00:00Z", received_window_end: "2026-12-31T00:00:00Z", reason: "Lot L1 sterility failure" }, as: QualityManager, as_user_id: "qm-1", captures: { rc1: $.data.id } }
            - { call: "POST /tissue-bank/recalls/${rc1}/activate", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: SupplyChainAdmin, as_user_id: "sca-1" }
          trigger:
            - { call: "POST /tissue-bank/tissue-units/${u1}/issue", as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNIT_NOT_ISSUABLE_STATE (priority 4 state beats priority 5 safety)"
            - "err != ERR_UNIT_EXPIRED and err != ERR_UNIT_UNDER_ACTIVE_RECALL although both safety gates also fail"
            - "TissueUnit.${u1}.status == EXPIRED (sweep ran; failure is not about sweep non-execution)"

      - name: accept_suspended_supplier_over_cap_safety_wins
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - endpoints.POST /tissue-bank/shipments/{id}/accept
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_fiscal), distinct from the
          state-vs-safety pair: the accept violates BOTH the supplier-qualification
          safety gate (ERR_SUPPLIER_NOT_QUALIFIED, priority 5) AND the inventory-value
          fiscal cap (ERR_INVENTORY_VALUE_CAP_EXCEEDED, priority 9); priority 5 must win.
        test_recipe:
          setup:
            - "Supplier qualified; ParLevelPolicy BONE max_inventory_value_cents == 25000"
            - "Shipment SH1 (3 BONE units lot L1 @10001 = declared 30003; projected WEIGHTED_AVERAGE valuation 30003.00 > 25000) created while supplier QUALIFIED"
            - "Supplier then manually SUSPENDED by ComplianceOfficer"
            - "At trigger: accept violates safety (suspended) AND fiscal (30003.00 > 25000)"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/par-level-policies", payload: { tissue_type: BONE, par_quantity: 5, max_inventory_value_cents: 25000 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { pol: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-003", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/suspend", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SUPPLIER_NOT_QUALIFIED (priority 5 safety beats priority 9 fiscal)"
            - "err != ERR_INVENTORY_VALUE_CAP_EXCEEDED although projected valuation 30003.00 exceeds the 25000 cap"
            - "Shipment.${sh1}.status == RECEIVED (no side effects fired)"

  - rule_id: boundary_precision_check
    instances:
      - name: temperature_reading_exactly_at_max_in_range
        grounds:
          - entities.Freezer.fields.max_celsius
          - entities.TemperatureReading.fields.in_range
          - endpoints.POST /tissue-bank/freezers/{id}/readings
        distinguishing_aspect: |
          Metric = temperature (degrees): the in-range test is the INCLUSIVE
          [min_celsius, max_celsius] — a reading of exactly -60.0 on a [-80.0, -60.0]
          freezer is in-range and opens NO excursion, while -59.9 (0.1 above max)
          opens one. Endpoint: POST /freezers/{id}/readings.
        test_recipe:
          setup:
            - "Freezer FZ-ULT-1 [-80.0, -60.0], OPERATIONAL, no readings yet"
          setup_api_calls:
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/freezers/${fz}/readings", payload: { temp_celsius: -60.0 }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { rd1_in_range: $.data.in_range, rd1_ex: $.data.excursion_id } }
            - { call: "POST /tissue-bank/freezers/${fz}/readings", payload: { temp_celsius: -59.9 }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { rd2_in_range: $.data.in_range, rd2_ex: $.data.excursion_id } }
          assert:
            - "rd1_in_range == true and rd1_ex == null (exactly at max is in range; >= vs > pinned)"
            - "Freezer.${fz}.status == OPERATIONAL after the first reading"
            - "rd2_in_range == false and rd2_ex != null; Freezer.${fz}.status == EXCURSION_ACTIVE after the second"
            - "Excursion.${rd2_ex}.max_deviation_celsius == 0.1"

      - name: par_level_exactly_met_no_reorder
        grounds:
          - calculations.par_level_deficit
          - endpoints.GET /tissue-bank/par-level-policies/{id}
          - endpoints.POST /tissue-bank/tissue-units/{id}/issue
        distinguishing_aspect: |
          Metric = unit count (not temperature), endpoint = GET policy + POST issue
          (not readings): on_hand_available == par_quantity yields deficit 0 and
          needs_reorder == false because the comparator is strict <; dropping to
          par - 1 flips needs_reorder true with deficit 1.
        test_recipe:
          setup:
            - "Supplier qualified; freezer; ParLevelPolicy BONE par_quantity = 2"
            - "2 BONE units ACCEPTED + released AVAILABLE (on_hand_available == 2)"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/par-level-policies", payload: { tissue_type: BONE, par_quantity: 2, max_inventory_value_cents: 100000000 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { pol: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id", u2: "$.data[1].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u2}/release", as: QualityManager, as_user_id: "qm-1" }
          trigger:
            - { call: "GET /tissue-bank/par-level-policies/${pol}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { a1: $.data.on_hand_available, d1: $.data.deficit, r1: $.data.needs_reorder } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/issue", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/par-level-policies/${pol}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { a2: $.data.on_hand_available, d2: $.data.deficit, r2: $.data.needs_reorder } }
          assert:
            - "a1 == 2 and d1 == 0 and r1 == false (equality does NOT trigger reorder; strict < pinned)"
            - "a2 == 1 and d2 == 1 and r2 == true (par - 1 crosses the boundary)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: unit_release_blocked_by_freezer_excursion
        grounds:
          - state_machines.TissueUnit.QUARANTINED_to_AVAILABLE
          - state_machines.Freezer.OPERATIONAL_to_EXCURSION_ACTIVE
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair TissueUnit x Freezer: a QUARANTINED unit's release
          transition is gated on its freezer being OPERATIONAL; while the freezer
          is EXCURSION_ACTIVE the release fails ERR_FREEZER_IN_EXCURSION, and only
          the freezer's excursion resolution (RELEASE) makes the same call succeed.
        test_recipe:
          setup:
            - "Supplier qualified; freezer [-80.0,-60.0]; shipment ACCEPTED with 1 STANDARD BONE unit U-001 still QUARANTINED (hold_reason NONE)"
            - "Manual excursion reported by tbc-1 -> Freezer EXCURSION_ACTIVE; U-001 hold_reason -> EXCURSION"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id" } }
            - { call: "POST /tissue-bank/freezers/${fz}/excursions", payload: { reason: "Door left ajar observed on rounds" }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { ex: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1", captures: { err: $.data.error_id } }
            - { call: "POST /tissue-bank/excursions/${ex}/investigate", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/excursions/${ex}/resolve", payload: { disposition: RELEASE, resolution_notes: "Brief door-ajar, temps verified stable" }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "GET /tissue-bank/tissue-units/${u1}", as: QualityManager, as_user_id: "qm-1", captures: { st: $.data.status } }
          assert:
            - "err == ERR_FREEZER_IN_EXCURSION (unit-level transition blocked by freezer-level state)"
            - "After resolve-RELEASE: st == AVAILABLE (the same unit transitioned only once the freezer returned to OPERATIONAL)"
            - "Freezer.${fz}.status == OPERATIONAL and current_excursion_id == null"
            - "Severity of ${ex} == LOW (manual report: deviation 0, duration < 1h, 1 STANDARD unit -> 2 pts), so RELEASE was legal"

      - name: shipment_accept_blocked_by_supplier_suspension
        grounds:
          - state_machines.Shipment.RECEIVED_to_ACCEPTED
          - state_machines.Supplier.QUALIFIED_to_SUSPENDED
          - state_machines.Supplier.SUSPENDED_to_QUALIFIED
        distinguishing_aspect: |
          Entity pair Shipment x Supplier (distinct from TissueUnit x Freezer):
          accept re-evaluates supplier qualification at accept time — a shipment
          received while the supplier was QUALIFIED fails accept after suspension
          and succeeds after reinstatement.
        test_recipe:
          setup:
            - "Supplier qualified; freezer; shipment SH1 RECEIVED (created while QUALIFIED)"
            - "ComplianceOfficer suspends the supplier"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 5000, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/suspend", as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { err: $.data.error_id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/reinstate", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { st2: $.data.status } }
          assert:
            - "err == ERR_SUPPLIER_NOT_QUALIFIED (cross-entity gate at accept time, not receipt time)"
            - "st2 == ACCEPTED after reinstate (same shipment, gate re-evaluated)"
            - "Supplier.${sup}.status == QUALIFIED after reinstate (score 100 >= 60, documents still VERIFIED)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: or_room_half_open_adjacency
        grounds:
          - entities.ImplantCase.fields.or_room_id
          - validations[priority=7]
          - endpoints.POST /tissue-bank/implant-cases
        distinguishing_aspect: |
          Resource = or_room_id, interval semantics = half-open [start, end):
          a case starting exactly when another ends (end == start) does NOT
          conflict, while strict intersection does.
        test_recipe:
          setup:
            - "Case A: OR-1 [2026-09-01T10:00:00Z, 2026-09-01T12:00:00Z) exists (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /tissue-bank/implant-cases", payload: { patient_ref: "P-A", or_room_id: "OR-1", scheduled_start: "2026-09-01T10:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: ImplantingSurgeon, as_user_id: "surg-1", captures: { cA: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/implant-cases", payload: { patient_ref: "P-B", or_room_id: "OR-1", scheduled_start: "2026-09-01T12:00:00Z", scheduled_end: "2026-09-01T13:00:00Z" }, as: ImplantingSurgeon, as_user_id: "surg-2", captures: { cB: $.data.id } }
            - { call: "POST /tissue-bank/implant-cases", payload: { patient_ref: "P-C", or_room_id: "OR-1", scheduled_start: "2026-09-01T11:00:00Z", scheduled_end: "2026-09-01T13:00:00Z" }, as: ImplantingSurgeon, as_user_id: "surg-2", captures: { errC: $.data.error_id } }
            - { call: "POST /tissue-bank/implant-cases", payload: { patient_ref: "P-D", or_room_id: "OR-2", scheduled_start: "2026-09-01T10:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: ImplantingSurgeon, as_user_id: "surg-2", captures: { cD: $.data.id } }
          assert:
            - "cB created (201): B.start == A.end is adjacency, not overlap (half-open semantics)"
            - "errC == ERR_OR_ROOM_DOUBLE_BOOKED: [11:00,13:00) strictly intersects [10:00,12:00)"
            - "cD created (201): same window but a different or_room_id resource"
            - "ImplantCase.${cA}.status == SCHEDULED and ImplantCase.${cB}.status == SCHEDULED"

      - name: supplier_document_closed_interval_touching_conflict
        grounds:
          - entities.SupplierDocument.fields.valid_from
          - entities.SupplierDocument.fields.valid_to
          - endpoints.POST /tissue-bank/suppliers/{id}/documents
        distinguishing_aspect: |
          Resource = (supplier, doc_type), interval semantics = CLOSED
          [valid_from, valid_to] — the opposite of the OR-room rule: a document
          whose valid_from equals an existing document's valid_to DOES conflict
          (shared endpoint), and the resource dimension is supplier+doc_type, not
          a room.
        test_recipe:
          setup:
            - "Supplier S exists (PENDING_QUALIFICATION); document D1 FDA_REGISTRATION [2026-01-01, 2026-12-31] SUBMITTED"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-2", valid_from: "2026-12-31T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { err_touch: $.data.error_id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-3", valid_from: "2027-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { d3: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-06-01T00:00:00Z", valid_to: "2026-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { d4: $.data.id } }
          assert:
            - "err_touch == ERR_DOC_VALIDITY_OVERLAP (closed interval: D1.valid_to == new.valid_from shares a point)"
            - "d3 created (201): [2027-01-01, ...] shares no point with D1's window"
            - "d4 created (201): overlapping window but a DIFFERENT doc_type resource"
            - "SupplierDocument.${d1}.status == SUBMITTED (failed insert had no side effects)"

  - rule_id: compensating_invariant
    instances:
      - name: excursion_release_cycle_conserves_physical_unit_count
        grounds:
          - state_machines.Freezer.OPERATIONAL_to_EXCURSION_ACTIVE
          - state_machines.TemperatureExcursion.UNDER_INVESTIGATION_to_RESOLVED_RELEASE
          - state_machines.TissueUnit
        distinguishing_aspect: |
          Conserved quantity = physical on-hand count: for the freezer, the sum
          count(units with status IN {QUARANTINED, AVAILABLE, RESERVED}) equals 3
          before the excursion, during the hold, and after resolve-RELEASE — the
          open/resolve pair compensates exactly (only the reservation is consumed,
          by design, and it releases into QUARANTINED, preserving the count).
        test_recipe:
          setup:
            - "Supplier qualified; freezer [-80.0,-60.0]; 3 STANDARD BONE units (lot L1: 10001, 10001, 10002) ACCEPTED + released AVAILABLE"
            - "Case C1 (2026-08-10) holds ACTIVE reservation R1 on U-001 -> statuses {RESERVED:1, AVAILABLE:2}"
            - "physical_count = count(status IN {QUARANTINED, AVAILABLE, RESERVED}) == 3 before trigger"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-003", unit_cost_cents: 10002, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id", u2: "$.data[1].id", u3: "$.data[2].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u2}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u3}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/implant-cases", payload: { patient_ref: "P-1", or_room_id: "OR-1", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: ImplantingSurgeon, as_user_id: "surg-1", captures: { c1: $.data.id } }
            - { call: "POST /tissue-bank/implant-cases/${c1}/reservations", payload: { tissue_unit_id: "${u1}" }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { res1: $.data.id } }
          trigger:
            - { call: "POST /tissue-bank/freezers/${fz}/readings", payload: { temp_celsius: -55.0 }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { ex: $.data.excursion_id } }
            - { call: "GET /tissue-bank/freezers/${fz}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { occ_mid: $.data.occupied_count } }
            - { call: "POST /tissue-bank/excursions/${ex}/investigate", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/excursions/${ex}/resolve", payload: { disposition: RELEASE, resolution_notes: "Brief 5-degree spike, media verified" }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "GET /tissue-bank/freezers/${fz}", as: SupplyChainAdmin, as_user_id: "sca-1", captures: { occ_post: $.data.occupied_count } }
          assert:
            - "occ_mid == 3 (INVARIANT at hold time: QUARANTINED units still physically stored; nothing left the freezer)"
            - "occ_post == 3 (INVARIANT after resolve-RELEASE: open+release pair conserves count(units IN {QUARANTINED, AVAILABLE, RESERVED}))"
            - "Reservation.${res1}.status == RELEASED with release_reason == EXCURSION (the reservation is the only consumed artifact)"
            - "After resolve: all 3 units AVAILABLE with hold_reason NONE"
            - "Severity of ${ex} == 46 MEDIUM (deviation 40 + duration 0 + units 6 + tier 0), so RELEASE legal"

      - name: excursion_release_cycle_conserves_inventory_valuation
        grounds:
          - calculations.inventory_valuation
          - state_machines.TemperatureExcursion.UNDER_INVESTIGATION_to_RESOLVED_RELEASE
        distinguishing_aspect: |
          Conserved quantity = money, not count: WEIGHTED_AVERAGE total_value for
          the tissue_type equals 30004.00 before the excursion, DURING the hold
          (QUARANTINED remains inside the on-hand inclusion set), and after
          resolve-RELEASE — the excursion pair must not leak or create value.
        test_recipe:
          setup:
            - "Supplier qualified; freezer [-80.0,-60.0]; 3 STANDARD BONE units, single lot L1 (10001, 10001, 10002), ACCEPTED + released AVAILABLE"
            - "Pre-trigger valuation WEIGHTED_AVERAGE == 30004.00 (one lot line: round_half_up(10001.333... x 3))"
          setup_api_calls:
            - { call: "POST /tissue-bank/suppliers", payload: { legal_name: "Acme Tissue Source", license_number: "LIC-001" }, as: QualityManager, as_user_id: "qm-1", captures: { sup: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: AATB_ACCREDITATION, document_ref: "AATB-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_a: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_a}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents", payload: { doc_type: FDA_REGISTRATION, document_ref: "FDA-1", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-12-31T00:00:00Z" }, as: QualityManager, as_user_id: "qm-1", captures: { doc_f: $.data.id } }
            - { call: "POST /tissue-bank/suppliers/${sup}/documents/${doc_f}/verify", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/suppliers/${sup}/approve", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /tissue-bank/freezers", payload: { name: "FZ-ULT-1", min_celsius: -80.0, max_celsius: -60.0, nominal_capacity: 50 }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { fz: $.data.id } }
            - { call: "POST /tissue-bank/shipments", payload: { supplier_id: "${sup}", freezer_id: "${fz}", items: [ { tissue_type: BONE, lot_number: "L1", serial_number: "U-001", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-002", unit_cost_cents: 10001, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD }, { tissue_type: BONE, lot_number: "L1", serial_number: "U-003", unit_cost_cents: 10002, expiration_at: "2027-01-01T00:00:00Z", criticality_tier: STANDARD } ] }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { sh1: $.data.id } }
            - { call: "POST /tissue-bank/shipments/${sh1}/accept", as: TissueBankCoordinator, as_user_id: "tbc-1" }
            - { call: "GET /tissue-bank/tissue-units?shipment_id=${sh1}", as: QualityManager, as_user_id: "qm-1", captures: { u1: "$.data[0].id", u2: "$.data[1].id", u3: "$.data[2].id" } }
            - { call: "POST /tissue-bank/tissue-units/${u1}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u2}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/tissue-units/${u3}/release", as: QualityManager, as_user_id: "qm-1" }
            - { call: "GET /tissue-bank/inventory/valuation", payload: { tissue_type: BONE, method: WEIGHTED_AVERAGE }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { val_pre: $.data.total_value } }
          trigger:
            - { call: "POST /tissue-bank/freezers/${fz}/readings", payload: { temp_celsius: -55.0 }, as: TissueBankCoordinator, as_user_id: "tbc-1", captures: { ex: $.data.excursion_id } }
            - { call: "GET /tissue-bank/inventory/valuation", payload: { tissue_type: BONE, method: WEIGHTED_AVERAGE }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { val_mid: $.data.total_value, cnt_mid: $.data.on_hand_count } }
            - { call: "POST /tissue-bank/excursions/${ex}/investigate", as: QualityManager, as_user_id: "qm-1" }
            - { call: "POST /tissue-bank/excursions/${ex}/resolve", payload: { disposition: RELEASE, resolution_notes: "Brief 5-degree spike, media verified" }, as: QualityManager, as_user_id: "qm-1" }
            - { call: "GET /tissue-bank/inventory/valuation", payload: { tissue_type: BONE, method: WEIGHTED_AVERAGE }, as: SupplyChainAdmin, as_user_id: "sca-1", captures: { val_post: $.data.total_value } }
          assert:
            - "val_pre == 30004.00 (single lot line: round_half_up(10001.333... x 3, 2dp))"
            - "val_mid == 30004.00 and cnt_mid == 3 (QUARANTINED units remain in the on-hand inclusion set; quarantine is not a valuation event)"
            - "val_post == 30004.00 (resolve-RELEASE compensates the open exactly; no value drift)"
