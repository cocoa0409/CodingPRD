      - name: risk_level_tier_boundaries_20_and_40
        claim_type: constants_applied
        grounds: [calculations.assessment_risk_score]
        distinguishing_aspect: "Tier boundary precision on the STANDARD variant: score exactly 20 maps MODERATE (>= 20) and exactly 40 maps HIGH (>= 40); verified on two separate cases with single-factor inputs WEAPON_ACCESS sev 1 (20) and sev 2 (40)."
        test_recipe:
          setup: ["Two cases (A, B) in UNDER_ASSESSMENT on one school; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Tier HS", school_code: "TIR", enrollment_count: 500 }
              as: DistrictAdministrator
              captures: { school_id: $.data.id }
