  # =========================================================================
  - section: endpoints
    instances:
      - name: overpayment_full_recovery_marks_recovered
        claim_type: Action endpoint
        grounds: [state_machines.OverpaymentClaim.OPEN_to_RECOVERED, entities.OverpaymentClaim.fields.recovered_amount_cents]
        distinguishing_aspect: "Recording a recovery of exactly amount_cents (93072) sets status RECOVERED and recovered_amount_cents 93072."
        test_recipe:
          setup: ["an OPEN OverpaymentClaim amount_cents 93072"]
          setup_api_calls:
            - call: "POST /ccdf/income-standards"
              payload: { household_size: 3, entry_monthly_limit_cents: 400000, exit_monthly_limit_cents: 500000, state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/rate-ceilings"
              payload: { provider_type: "CENTER", care_level: "TODDLER", max_daily_rate_cents: 5000, effective_start: "2020-01-01T00:00:00Z", effective_end: "2030-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
            - call: "POST /ccdf/families"
              payload: { applicant_name: "A Fam", household_size: 3, monthly_gross_income_cents: 250000, monthly_self_employment_income_cents: 0, state_code: "CA" }
              as: CaseWorker
              captures: { fam_id: $.data.id }
            - call: "POST /ccdf/parent-activities"
              payload: { family_id: "${fam_id}", activity_type: "WORK", weekly_hours: 40 }
              as: CaseWorker
            - call: "POST /ccdf/determinations"
              payload: { family_id: "${fam_id}", determination_type: "INITIAL" }
              as: CaseWorker
              captures: { det_id: $.data.id }
            - call: "POST /ccdf/determinations/${det_id}/finalize"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/providers"
              payload: { name: "Sunny Center", provider_type: "CENTER", published_daily_rate_cents: 6000, license_expiry_date: "2027-01-01T00:00:00Z", state_code: "CA" }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /ccdf/providers/${prov_id}/license"
              payload: { action: "VERIFY" }
              as: ProgramAdmin
            - call: "GET /ccdf/families/${fam_id}"
              payload: {}
              as: CaseWorker
              captures: { fam_v: $.data.version }
            - call: "POST /ccdf/authorizations"
              payload: { family_id: "${fam_id}", provider_id: "${prov_id}", determination_id: "${det_id}", child_name: "Kid One", care_level: "TODDLER", start_date: "2026-03-01T00:00:00Z", end_date: "2026-09-01T00:00:00Z", authorized_days_per_month: 22, expected_family_version: "${fam_v}" }
              as: CaseWorker
              captures: { auth_id: $.data.id }
            - call: "POST /ccdf/authorizations/${auth_id}/activate"
              payload: {}
              as: CaseWorker
            - call: "POST /ccdf/attendance-records"
              payload: { authorization_id: "${auth_id}", service_month: "2026-03", present_days: 18, absent_days: 3 }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { att_id: $.data.id }
            - call: "POST /ccdf/attendance-records/${att_id}/approve"
              payload: {}
              as: CaseWorker
            - call: "GET /ccdf/payments?attendance_record_id=${att_id}"
              payload: {}
              as: CaseWorker
              captures: { pay_id: "$.data[0].id" }
            - call: "POST /ccdf/payments/${pay_id}/reverse"
              payload: { reason: "audit" }
              as: ProgramAdmin
            - call: "GET /ccdf/overpayment-claims?payment_id=${pay_id}"
              payload: {}
              as: ProgramAdmin
              captures: { oc_id: "$.data[0].id" }
          trigger:
            - call: "POST /ccdf/overpayment-claims/${oc_id}/record-recovery"
              payload: { recovered_amount_cents: 93072 }
              as: ProgramAdmin
          assert:
            - "OverpaymentClaim.${oc_id}.status == RECOVERED"
            - "OverpaymentClaim.${oc_id}.recovered_amount_cents == 93072"

  # =========================================================================
  # Excluded corners — already exercised by a §1.8 difficulty instance.
  # =========================================================================
  - section: validations
    instances:
      - name: error_provider_not_licensed_on_activate
        claim_type: Violation to Error
        grounds: ["errors[ERR_PROVIDER_NOT_LICENSED]"]
        excluded_because:
          difficulty_instance: activate_requires_provider_licensed
          rationale: "The failure path (provider PENDING_VERIFICATION -> ERR_PROVIDER_NOT_LICENSED on activate) is asserted by that §1.8 cross-entity instance."

      - name: error_authorization_overlap_on_create
        claim_type: Temporal validation
        grounds: ["errors[ERR_AUTHORIZATION_OVERLAP]"]
        excluded_because:
          difficulty_instance: authorization_halfopen_interval_overlap
          rationale: "Half-open overlap rejection is the asserted trigger of that §1.8 temporal-overlap instance."

      - name: error_rate_ceiling_overlap_on_create
        claim_type: Temporal validation
        grounds: ["errors[ERR_RATE_CEILING_OVERLAP]"]
        excluded_because:
          difficulty_instance: rate_ceiling_closed_interval_overlap
          rationale: "Closed-interval ceiling overlap rejection is the asserted trigger of that §1.8 instance."

  - section: state_machines
    instances:
      - name: excluded_provider_revoke_suspends_authorizations
        claim_type: Cross-entity
        grounds: [state_machines.Provider.LICENSED_to_REVOKED]
        excluded_because:
          difficulty_instance: license_revoke_cascade_provider_authorization_attendance
          rationale: "Provider REVOKE -> Authorization SUSPENDED -> AttendanceRecord REJECTED cascade is asserted end-to-end by that §1.8 cascade instance."

      - name: excluded_income_threshold_boundary
        claim_type: Type Constraints
        grounds: [entities.EligibilityDetermination.fields.income_eligible]
        excluded_because:
          difficulty_instance: income_eligibility_threshold_on_finalize
          rationale: "The == entry limit vs +1 boundary is asserted by that §1.8 boundary instance."
