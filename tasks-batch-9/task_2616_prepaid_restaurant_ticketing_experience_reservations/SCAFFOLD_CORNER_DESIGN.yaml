            - call: "POST /services/${svc_id}/publish"
              payload: {}
              as: KitchenLead
              as_user_id: "${r_id}"
              captures: { e403: $.data.error_id }
            - call: "GET /reservations/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { e404: $.data.error_id }
            - call: "POST /reservations/${res_id}/seat"
              payload: {}
              as: RestaurantManager
