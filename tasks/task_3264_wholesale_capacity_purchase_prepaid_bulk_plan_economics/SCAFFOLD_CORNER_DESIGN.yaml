              payload: {}
              as: CapacityPlanner
          assert:
            - "breakage_rate_ppm is an integer with no fractional part"
            - "with a single expired term whose entire price was recognized as breakage the rate is exactly 1000000"
            - "with a single expired term whose breakage is 666 of a 1999 price the rate is round_half_up(1000000 * 666 / 1999) == 333167"
            - "the decimal form 0.333167 is never returned"
            - "an agreement with no expired term returns 0 rather than null"

  # ===========================================================================
  - section: validations
    instances:

      - name: error_agreement_suspended_on_term_purchase
        claim_type: Violation → Error
        grounds:
          - errors.ERR_AGREEMENT_SUSPENDED
          - validations[priority=8]
        excluded_because:
          difficulty_instance: term_purchase_requires_parent_agreement_active
          rationale: "Asserted as the failure path of the named §1.8 instance, which pins the same suspension gate on the same purchase endpoint."

      - name: error_insufficient_agreement_capacity_at_the_oversale_ceiling
        claim_type: Aggregate validation
        grounds:
          - errors.ERR_INSUFFICIENT_AGREEMENT_CAPACITY
          - validations[priority=10]
        excluded_because:
          difficulty_instance: agreement_oversale_ladder_with_below_breakpoint_tier_cost
          rationale: "Asserted as the failure path of the named §1.8 instance, which pins the inclusive ceiling at allocated_data_mb 120000 and the rejection one step past it."

      - name: error_addon_window_overlap_on_exact_adjacency
        claim_type: Temporal validation
        grounds:
          - errors.ERR_ADDON_WINDOW_OVERLAP
          - validations[priority=27]
        excluded_because:
          difficulty_instance: roaming_addon_half_open_window_overlap_on_a_subscriber
          rationale: "Asserted as the failure path of the named §1.8 instance, which pins the half-open adjacency acceptance and the one-second-early rejection."

      - name: error_port_in_flight_on_subscriber_cancel
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PORT_IN_FLIGHT
          - validations[priority=25]
        excluded_because:
          difficulty_instance: churn_requires_no_port_in_flight_on_a_different_pair
          rationale: "Asserted as the failure path of the named §1.8 instance, which pins the cancel-port escape hatch that makes the churn reachable."

      - name: missing_auth_headers_return_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request with no X-User-Role header at all is refused at the auth layer with 401 ERR_UNAUTHENTICATED, before any existence or state check runs."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One agreement on file."
          setup_api_calls:
            - *c_clock
            - *c_ag
          trigger:
            - call: "GET /carriers/capacity-agreements/${ag_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and err == ERR_UNAUTHENTICATED"
            - "err != ERR_AGREEMENT_NOT_FOUND, so the auth layer precedes the existence layer"
            - "an unknown role string in X-User-Role also produces ERR_UNAUTHENTICATED"
            - "a well-formed role with an X-User-ID that names no Subscriber produces ERR_UNAUTHENTICATED for the entity_backed check"
            - "response_type is error and data carries both error_id and message"

      - name: role_not_permitted_returns_forbidden_role
        claim_type: Violation → Error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_ROLE
          - endpoints.POST_/carriers/sim-inventories/{id}/return
        distinguishing_aspect: "A SupportAgent calling the fulfillment-only media return endpoint is refused with 403 ERR_FORBIDDEN_ROLE rather than any state error."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One agreement, one CA eSIM block."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - *c_inv
          trigger:
            - call: "POST /carriers/sim-inventories/${inv_id}/return"
              payload: {}
              as: SupportAgent
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and err == ERR_FORBIDDEN_ROLE"
            - "err != ERR_UNAUTHENTICATED, because the headers were well formed and the role exists"
            - "the same call as FulfillmentOperator is not refused at the role layer"
            - "a Subscriber calling the agreement create endpoint is also refused with ERR_FORBIDDEN_ROLE"
            - "an opaque role's X-User-ID is not required to name any entity"

      - name: partner_not_authorized_for_state_returns_422
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors.ERR_PARTNER_NOT_AUTHORIZED_FOR_STATE
          - entities.RetailPartner.fields.partner_state_codes
        distinguishing_aspect: "A retail-partner activation for a subscriber state the partner does not list is refused with 422 ERR_PARTNER_NOT_AUTHORIZED_FOR_STATE, and the state list is the gate rather than the partner's status."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. Active agreement, offered H3, one CA subscriber, a partner authorized only for NV, and a partner restock inventory block."
          setup_api_calls:
            - *c_clock
            - *c_ag
            - call: "POST /carriers/capacity-agreements/${ag_id}/activate"
              payload: {}
              as: CapacityPlanner
            - *c_plan
            - call: "POST /carriers/plans/${plan_id}/offer"
              payload: {}
              as: CapacityPlanner
            - &c_partner_nv
              call: "POST /carriers/retail-partners"
              payload: { partner_name: "Sierra Retail Group", partner_state_codes: ["NV"] }
              as: CapacityPlanner
              captures: { partner_nv_id: $.data.id }
            - *c_sub
            - *c_term
            - call: "POST /carriers/prepaid-terms/${term_id}/purchase"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_id}"
          trigger:
            - call: "POST /carriers/activations"
              payload: { subscriber_id: "${sub_id}", prepaid_term_id: "${term_id}", activation_channel: "RETAIL_PARTNER", retail_partner_id: "${partner_nv_id}" }
              as: Subscriber
              as_user_id: "${sub_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_PARTNER_NOT_AUTHORIZED_FOR_STATE"
            - "err != ERR_PARTNER_SUSPENDED, because the partner is ACTIVE and only its state list is wrong"
            - "the subscriber's state_code CA is absent from partner_state_codes [\"NV\"]"
            - "the same activation as DIGITAL is accepted for the same subscriber"
            - "a partner listing CA and NV is accepted for the CA subscriber"

      - name: suspended_partner_blocks_new_retail_activations
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
          - errors.ERR_PARTNER_SUSPENDED
          - state_machines.RetailPartner.ACTIVE or DEFLECTED_to_SUSPENDED
        distinguishing_aspect: "A partner in SUSPENDED state cannot serve a new retail activation even when its state list covers the subscriber, and the error is ERR_PARTNER_SUSPENDED."
        test_recipe:
