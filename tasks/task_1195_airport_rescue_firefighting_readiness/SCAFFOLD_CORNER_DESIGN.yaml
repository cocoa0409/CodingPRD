            - { call: "POST /arff/incidents/${inc1}/mutual-aid-requests", payload: { agreement_id: "${ag1}", units_requested: 2 }, as: ArffChief, captures: { req1: $.data.id } }
          trigger:
            - { call: "POST /arff/mutual-aid-requests/${req1}/decline", as: ArffChief, captures: { r_status: $.data.status } }
            - { call: "POST /arff/mutual-aid-requests/${req1}/deploy", as: ArffChief, captures: { err: $.data.error_id } }
          assert:
            - "${r_status} == \"DECLINED\" and ${err} == \"ERR_REQUEST_NOT_ACTIONABLE\""

      - name: sm_incident_close_blocked_by_open_request
        claim_type: precondition_enforcement
        grounds: [state_machines.AlertIncident.CONTROLLED_to_CLOSED, "errors[ERR_OPEN_REQUESTS_EXIST]"]
        distinguishing_aspect: "Incident close is guarded by sibling MutualAidRequest state: REQUESTED blocks with ERR_OPEN_REQUESTS_EXIST; after decline, close succeeds."
        test_recipe:
          setup:
            - "Compliant index-C airport; ACTIVE agreement; incident REPORTED with a REQUESTED mutual-aid request; incident then responded and controlled"
          setup_api_calls:
            - { call: "POST /arff/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AirportManager }
            - { call: "POST /arff/airport-profile", payload: { airport_code: "KDEMO", certificated_index: "C" }, as: AirportManager }
            - { call: "POST /arff/aircraft", payload: { model_name: "B737-900", length_ft: 138.2, avg_daily_departures: 6.0, in_scheduled_service: true }, as: AirportManager }
