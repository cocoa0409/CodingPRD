            - "Show.${show_id}.held_net_sqft == 0 and assigned_net_sqft == 0 and available_net_sqft == 600"
            - "Show.${show_id}.committed_ratio_pct == 0 and floor_posture == OPEN"

      - name: last_obligation_delivery_cascades_to_priority_tier_upgrade
        grounds:
          - state_machines.FulfillmentObligation.PENDING_to_DELIVERED
          - state_machines.SponsorshipDeal.PARTIAL_to_COMPLETE
          - calculations.sponsorship_fulfillment_status
          - calculations.exhibitor_priority_points
          - entities.Exhibitor.fields.priority_tier
        distinguishing_aspect: |
          A DEPTH-3 chain whose links are a child row, its parent's derived axis and a GRANDPARENT-LEVEL
          threshold: obligation PENDING->DELIVERED -> deal fulfillment PARTIAL->COMPLETE -> +12 credited
          points push the exhibitor from 591 to 603 and flip priority_tier SILVER->GOLD.  Resolving the
          FIRST of the two obligations moves only link 1 and leaves 591/SILVER, proving the chain is
          transitive rather than a single fan-out.
        test_recipe:
          setup:
            - "VenueContract MCC / HALL_A EXECUTED; Show 'National Buyers Expo' in PLANNING."
            - "SponsorshipPackage ENTRY_ARCH: list 700000, floor 500000, inventory_total 2, two obligation codes, priority_point_value 12."
            - "Exhibitor 'Nordic Furnishings' carries ledger_points 590 from one posted adjustment."
