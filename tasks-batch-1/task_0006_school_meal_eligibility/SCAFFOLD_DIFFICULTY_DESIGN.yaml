scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: paid_charge_variants_application_vs_direct_certification
        grounds:
          - calculations.compute_paid_charge
          - calculations.compute_paid_charge.variants.standard_application_based
          - calculations.compute_paid_charge.variants.direct_certification
          - state_machines.MealApplication.UNDER_REVIEW_to_APPROVED
          - entities.EligibilityDetermination.fields.source
          - entities.EligibilityDetermination.fields.tier
        distinguishing_aspect: |
          On ServiceTransaction (entity domain: meal pricing), the SAME MenuItem
          list_price_cents=300 and SAME PAID-tier candidate income produces
          paid_charge_cents=30 under standard_application_based (REDUCED tier
          via approved application) but paid_charge_cents=0 under
          direct_certification (FREE tier pinned by direct_certification_flag).
        test_recipe:
          setup:
            - "Two households at the same income level ($45,000/yr, family of 4, CA): Household A has direct_certification_flag=true; Household B has direct_certification_flag=false and submits a MealApplication that is approved."
            - "Both households have a student at school ELEM-101 with no allergies."
            - "MenuItem 'Cheese Pizza Slice' costs 300 cents, school ELEM-101."
            - "Server clock pinned to 2026-01-15T12:00:00.000Z."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00.000Z" }
              as: PlatformAdmin
            # Household A: direct certification
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Alice DC", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_a_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_a_id}", full_name: "Anna DC", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_a_id: $.data.id }
            # Direct-certification eligibility via /eligibility-determinations endpoint
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_a_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-01-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
              captures: { elig_a_id: $.data.id }
            # Household B: application-based
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Bob App", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_b_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_b_id}", full_name: "Ben App", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_b_id: $.data.id }
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_b_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_b_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /school-meals/applications/${app_b_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_b_id}"
            - call: "POST /school-meals/applications/${app_b_id}/start-review"
              payload: {}
              as: DistrictReviewer
            - call: "POST /school-meals/applications/${app_b_id}/approve"
              payload: { decision_reason: "verified" }
              as: DistrictReviewer
            # MenuItem
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Cheese Pizza Slice", list_price_cents: 300, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: ["MILK"], calories: 280 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
          trigger:
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_a_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_a_id: $.data.id, tx_a_charge: $.data.paid_charge_cents, tx_a_tier: $.data.applied_tier }
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_b_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_b_id: $.data.id, tx_b_charge: $.data.paid_charge_cents, tx_b_tier: $.data.applied_tier }
          assert:
            # Household B income annual=4500000c=$45,000 → monthly = 375000c = $3,750
            # CA fam=4: FPL_monthly=260000c, thr_free=338000c, thr_red=481000c
            # $3750 = 375000c is between 338000 and 481000 → REDUCED
            # paid_charge = min(40, round_half_up(300*0.10)) = min(40, 30) = 30 cents
            - "ServiceTransaction.${tx_a_id}.applied_tier == FREE"
            - "ServiceTransaction.${tx_a_id}.paid_charge_cents == 0"
            - "ServiceTransaction.${tx_b_id}.applied_tier == REDUCED"
            - "ServiceTransaction.${tx_b_id}.paid_charge_cents == 30"

      - name: reimbursement_variants_cash_vs_accrual
        grounds:
          - calculations.compute_claim_reimbursement
          - calculations.compute_claim_reimbursement.variants.cash_basis
          - calculations.compute_claim_reimbursement.variants.accrual_basis
          - state_machines.ReimbursementClaim.DRAFT_to_SUBMITTED
          - entities.ReimbursementClaim.fields.accounting_basis
          - entities.ReimbursementClaim.fields.total_reimbursement_cents
        distinguishing_aspect: |
          On ReimbursementClaim (entity domain: USDA reimbursement aggregation —
          DIFFERENT from §1.3.compute_paid_charge which is on ServiceTransaction),
          the SAME underlying set of transactions in [period_start_utc,
          period_end_utc] yields total_reimbursement_cents=1410 under CASH
          (only SETTLED) vs 1880 under ACCRUAL (SETTLED + DISPUTED, REFUNDED=0).
        test_recipe:
          setup:
            - "Two ReimbursementClaim records for school ELEM-101 with adjacent non-overlapping periods (gap >= 1 day): claim A covers 2026-01-01..2026-01-31 with CASH basis; claim B covers 2026-02-02..2026-02-28 with ACCRUAL basis."
            - "School ELEM-101 has 5 served transactions all on 2026-01-15 by one FREE-tier student: 3 SETTLED, 1 DISPUTED, 1 REFUNDED. fed_reimbursement_free_cents=470 per MenuItem."
            - "All 5 transactions fall in claim A's period; for claim B we replicate the same 5 transactions one month later in February for the same student."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "C", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "C kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-01-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Hot Lunch", list_price_cents: 0, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 600 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
            # Top up parent account (FREE tier so charges are 0; but for SETTLED transition the check is balance >= 0 which holds)
            # 5 transactions for Jan: 3 settled, 1 disputed, 1 refunded
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx1: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx1}/settle"
              payload: {}
              as: SchoolStaff
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx2: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx2}/settle"
              payload: {}
              as: SchoolStaff
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx3: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx3}/settle"
              payload: {}
              as: SchoolStaff
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx4: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx4}/settle"
              payload: {}
              as: SchoolStaff
            - call: "POST /school-meals/service-transactions/${tx4}/dispute"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx5: $.data.id, tx5_v: $.data.version }
            - call: "POST /school-meals/service-transactions/${tx5}/settle"
              payload: {}
              as: SchoolStaff
              captures: { tx5_v_settled: $.data.version }
            - call: "POST /school-meals/service-transactions/${tx5}/refund"
              payload: { expected_servicetransaction_version: "${tx5_v_settled}" }
              as: SchoolStaff
            # Create claim A (CASH); advance clock past period to satisfy "no PENDING txns in window"
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/reimbursement-claims"
              payload: { school_code: "ELEM-101", period_start_utc: "2026-01-01T00:00:00.000Z", period_end_utc: "2026-01-31T23:59:59.000Z", accounting_basis: "CASH" }
              as: SchoolStaff
              captures: { claim_a_id: $.data.id }
          trigger:
            - call: "POST /school-meals/reimbursement-claims/${claim_a_id}/submit"
              payload: {}
              as: SchoolStaff
              captures: { claim_a_total: $.data.total_reimbursement_cents, claim_a_count: $.data.included_transaction_count }
          assert:
            # CASH only counts SETTLED. tx1, tx2, tx3 are SETTLED; tx4 is DISPUTED (excluded); tx5 is REFUNDED (excluded)
            # → 3 * 470 = 1410
            - "ReimbursementClaim.${claim_a_id}.total_reimbursement_cents == 1410"
            - "ReimbursementClaim.${claim_a_id}.included_transaction_count == 3"
            - "ReimbursementClaim.${claim_a_id}.status == SUBMITTED"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: paid_charge_tiered_with_allergen_surcharge_mode_a
        grounds:
          - calculations.compute_paid_charge
          - entities.MenuItem.fields.list_price_cents
          - entities.MenuItem.fields.allergens_present
          - entities.AllergyProfile.fields.allergens
        distinguishing_aspect: |
          Mode (a): formula has 4 inputs (applied_tier, list_price_cents,
          allergens_present ∩ AllergyProfile.allergens, substitute_for_allergen
          flag) with non-linear interaction via nested min() + conditional
          branch on tier + intersection-conditional surcharge addition.
          REDUCED tier × $8.00 item × allergen overlap × substitution requested
          yields tier_cents = min(40, 80) + 25 = 65, demonstrating
          non-linear cap interaction.
        test_recipe:
          setup:
            - "Student with AllergyProfile allergens=[PEANUT], severity=MILD."
            - "MenuItem 'PB Cookie' costs 800 cents, contains PEANUT."
            - "Household with annual_income=5,500,000 cents ($55,000), family_size=4, CA → REDUCED tier via approved application."
            - "Server clock pinned to 2026-01-15T12:00:00.000Z."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Reduced Fam", family_size: 4, annual_income_cents: 5500000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "R kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/allergy-profiles"
              payload: { student_id: "${stu_id}", allergens: ["PEANUT"], severity: "MILD" }
              as: SchoolStaff
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_id: $.data.id }
            - call: "POST /school-meals/applications/${app_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/applications/${app_id}/start-review"
              payload: {}
              as: DistrictReviewer
            - call: "POST /school-meals/applications/${app_id}/approve"
              payload: { decision_reason: "income verified" }
              as: DistrictReviewer
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "PB Cookie", list_price_cents: 800, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: ["PEANUT"], calories: 220 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
          trigger:
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}", substitute_for_allergen: true }
              as: SchoolStaff
              captures: { tx_id: $.data.id, tx_charge: $.data.paid_charge_cents, tx_tier: $.data.applied_tier }
          assert:
            # annual=5500000c=$55,000 → monthly=458333c (round_half_up(5500000/12)=458333)
            # 458333 between thr_free=338000 and thr_red=481000 → REDUCED
            # tier_cents = min(40, round_half_up(800*0.10)) = min(40, 80) = 40
            # +25 surcharge (PEANUT intersect, sub_for_allergen=true, tier!=FREE) → 65
            - "ServiceTransaction.${tx_id}.applied_tier == REDUCED"
            - "ServiceTransaction.${tx_id}.paid_charge_cents == 65"

      - name: tier_determination_rounding_order_mode_b
        grounds:
          - calculations.determine_tier_from_income
          - entities.MealApplication.fields.snapshot_annual_income_cents
          - entities.MealApplication.fields.snapshot_family_size
          - entities.MealApplication.fields.snapshot_address_state
        distinguishing_aspect: |
          Mode (b): rounding-order matters. The pinned order is
          round_half_up(annual/12) BEFORE compare; if a naive implementation
          computed annual/12 with no rounding, exact boundary cases (e.g.,
          annual=4056001 cents) would yield household_monthly=338000.0833...,
          which truncated could equal 338000 (FREE) but rounded equals 338000
          (FREE) — divergence appears at annual=4056006 where rounded=338001
          but truncated=338000.
        test_recipe:
          setup:
            - "Single application: household with annual=4,056,006 cents (boundary +6 cents above the round-up threshold), family_size=4, CA."
            - "Server clock pinned to 2026-01-15T12:00:00.000Z."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Boundary Fam", family_size: 4, annual_income_cents: 4056006, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_id: $.data.id }
            - call: "POST /school-meals/applications/${app_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/applications/${app_id}/start-review"
              payload: {}
              as: DistrictReviewer
          trigger:
            - call: "POST /school-meals/applications/${app_id}/approve"
              payload: { decision_reason: "boundary test" }
              as: DistrictReviewer
              captures: { app_status: $.data.status }
            # then look up the eligibility determination created
            - call: "GET /school-meals/households/${hh_id}/eligibility-determinations"
              payload: {}
              as: DistrictReviewer
              captures: { elig_list_total: $.data }
          assert:
            # household_monthly_cents = round_half_up(4056006/12) = round_half_up(338000.5) = 338001
            # thr_free=338000, thr_red=481000 → 338001 > 338000, 338001 <= 481000 → REDUCED
            # Under unrounded compute (4056006/12 = 338000.5), naive truncation -> 338000 -> FREE — divergence.
            - "MealApplication.${app_id}.status == APPROVED"
            - "The new EligibilityDetermination returned by GET /school-meals/households/${hh_id}/eligibility-determinations has tier == REDUCED (NOT FREE — the +6 cents pushes round_half_up over the threshold)."

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: mealapplication_branching_with_appeal_cycle
        grounds:
          - state_machines.MealApplication.DRAFT_to_SUBMITTED
          - state_machines.MealApplication.UNDER_REVIEW_to_DENIED
          - state_machines.MealApplication.DENIED_to_APPEALED
          - state_machines.MealApplication.APPEALED_to_UNDER_REVIEW
          - state_machines.MealApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          MealApplication is branching+cyclic: UNDER_REVIEW forks to APPROVED
          or DENIED, and DENIED→APPEALED→UNDER_REVIEW completes a cycle that
          can ultimately route to APPROVED on second review. The same
          application id can pass through UNDER_REVIEW twice. NOT linear.
        test_recipe:
          setup:
            - "Household submits MealApplication; reviewer DENIES on first pass; parent APPEALS; reviewer re-reviews and APPROVES on second pass."
            - "Server clock pinned to 2026-02-01T09:00:00.000Z."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Cycle Fam", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_id: $.data.id }
            - call: "POST /school-meals/applications/${app_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/applications/${app_id}/start-review"
              payload: {}
              as: DistrictReviewer
            - call: "POST /school-meals/applications/${app_id}/deny"
              payload: { decision_reason: "missing documentation" }
              as: DistrictReviewer
              captures: { app_v_denied: $.data.version }
          trigger:
            - call: "POST /school-meals/applications/${app_id}/appeal"
              payload: { appeal_reason: "documents attached", expected_mealapplication_version: "${app_v_denied}" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_status_appealed: $.data.status }
            - call: "POST /school-meals/applications/${app_id}/start-review"
              payload: {}
              as: DistrictReviewer
              captures: { app_status_under_review_2: $.data.status }
            - call: "POST /school-meals/applications/${app_id}/approve"
              payload: { decision_reason: "verified on appeal" }
              as: DistrictReviewer
              captures: { app_status_final: $.data.status, app_final_v: $.data.version }
          assert:
            - "MealApplication.${app_id}.status == APPROVED (NOT DENIED — the cycle DENIED→APPEALED→UNDER_REVIEW→APPROVED was traversed; second pass through UNDER_REVIEW is the cycle proof)"
            - "MealApplication.${app_id}.version >= 5 (DRAFT->SUBMITTED, ->UNDER_REVIEW, ->DENIED, ->APPEALED, ->UNDER_REVIEW, ->APPROVED — six transitions bumping version)"

      - name: eligibilitydetermination_parallel_lifecycle_and_verification
        grounds:
          - state_machines.EligibilityDetermination.lifecycle_status_ACTIVE_to_SUPERSEDED
          - state_machines.EligibilityDetermination.verification_status_UNVERIFIED_to_VERIFIED
          - entities.EligibilityDetermination.fields.lifecycle_status
          - entities.EligibilityDetermination.fields.verification_status
        distinguishing_aspect: |
          EligibilityDetermination has two INDEPENDENT state dimensions:
          lifecycle_status ∈ {ACTIVE, SUPERSEDED, EXPIRED, REVOKED} evolves
          INDEPENDENTLY of verification_status ∈ {UNVERIFIED, VERIFIED,
          DEFERRED}. The same determination can become VERIFIED while still
          ACTIVE, or remain UNVERIFIED while becoming SUPERSEDED. Parallel
          dimensions on the SAME entity row — a different non-linear shape
          than MealApplication's branching cycle.
        test_recipe:
          setup:
            - "Household has a single ACTIVE+UNVERIFIED EligibilityDetermination."
            - "USDAAuditor calls verify, flipping verification_status to VERIFIED without touching lifecycle_status."
            - "Server clock pinned to 2026-02-15T10:00:00.000Z."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "ParaDim", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-01-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
              captures: { elig_id: $.data.id, elig_lc_initial: $.data.lifecycle_status, elig_vs_initial: $.data.verification_status }
          trigger:
            - call: "POST /school-meals/eligibility-determinations/${elig_id}/verify"
              payload: {}
              as: USDAAuditor
              captures: { elig_lc_after: $.data.lifecycle_status, elig_vs_after: $.data.verification_status }
          assert:
            - "EligibilityDetermination.${elig_id}.lifecycle_status == ACTIVE (UNCHANGED by verify — proof of independence)"
            - "EligibilityDetermination.${elig_id}.verification_status == VERIFIED (changed by verify)"
            - "EligibilityDetermination.${elig_id}.version >= 2 (initial create + verify)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: application_approved_supersedes_eligibility_recompute_pending_charges_depth_3
        grounds:
          - state_machines.MealApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.EligibilityDetermination.lifecycle_status_ACTIVE_to_SUPERSEDED
          - calculations.compute_paid_charge
          - entities.ServiceTransaction.fields.applied_tier
        distinguishing_aspect: |
          Depth-3 cascade where each hop is CAUSED BY the prior hop's mutation
          (not parallel fan-out):
            (1) POST approve on MealApplication B → creates EligibilityDetermination
                B (tier=FREE, lifecycle=ACTIVE) for household H.
            (2) The CREATION of determination B (step 1's mutation) causes
                determination A (the prior ACTIVE one for H, tier=PAID) to flip
                lifecycle_status A→SUPERSEDED.
            (3) The SUPERSEDED transition on A (step 2's mutation) causes
                every PENDING ServiceTransaction tied to A to re-bind its
                eligibility_determination_id to B AND recompute paid_charge_cents
                via §1.3.compute_paid_charge (PAID→FREE: charge goes from
                300→0).
        test_recipe:
          setup:
            - "Household H (family=4, CA, annual=$80,000, no direct cert) has an existing PAID-tier EligibilityDetermination A created via operator (source=APPLICATION via approved earlier MealApplication A)."
            - "Student S of H has a PENDING ServiceTransaction TX charged at PAID tier (300 cents) bound to determination A."
            - "A second MealApplication B is created for H with updated income $30,000 (would yield FREE), submitted and started-review."
            - "Server clock pinned to 2026-03-01T10:00:00.000Z."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Cascade Fam", family_size: 4, annual_income_cents: 8000000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "Casc kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            # First application A → PAID
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /school-meals/applications/${app_a_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/applications/${app_a_id}/start-review"
              payload: {}
              as: DistrictReviewer
            - call: "POST /school-meals/applications/${app_a_id}/approve"
              payload: { decision_reason: "initial verified" }
              as: DistrictReviewer
            # Income drops, household record updated
            - call: "PATCH /school-meals/households/${hh_id}"
              payload: { annual_income_cents: 3000000 }
              as: SchoolStaff
              captures: { hh_v_after_patch: $.data.version }
            # MenuItem for the PENDING transaction
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Sandwich", list_price_cents: 300, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 350 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
            # Top up parent account so PAID-tier 300c charge is feasible later
            - call: "POST /school-meals/parent-accounts/${hh_id}/topup"
              payload: { amount_cents: 1000, idempotency_key: "topup-cascade-1" }
              as: Parent
              as_user_id: "${hh_id}"
            # Create PENDING transaction at PAID tier (determination A is ACTIVE+PAID)
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_id: $.data.id, tx_initial_tier: $.data.applied_tier, tx_initial_charge: $.data.paid_charge_cents, tx_initial_elig_id: $.data.eligibility_determination_id }
            # Second application B with updated low income → FREE
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /school-meals/applications/${app_b_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/applications/${app_b_id}/start-review"
              payload: {}
              as: DistrictReviewer
          trigger:
            - call: "POST /school-meals/applications/${app_b_id}/approve"
              payload: { decision_reason: "income reduced; FREE granted" }
              as: DistrictReviewer
              captures: { app_b_status: $.data.status }
            - call: "GET /school-meals/service-transactions/${tx_id}"
              payload: {}
              as: SchoolStaff
              captures: { tx_post_tier: $.data.applied_tier, tx_post_charge: $.data.paid_charge_cents, tx_post_elig: $.data.eligibility_determination_id }
          assert:
            # Application A approved → determination A tier=PAID (annual=80000000c, monthly=6666667c >> 481000 → PAID)
            # TX created → applied_tier=PAID, paid_charge_cents=300
            # Application B approved (after income patched to 3000000c=$30K, monthly=250000c < thr_free=338000 → FREE) →
            #   - new determination B (FREE, ACTIVE) created (cascade depth 1)
            #   - determination A flipped to SUPERSEDED (cascade depth 2)
            #   - PENDING tx re-bound to B, paid_charge recomputed: FREE tier → 0 (cascade depth 3)
            - "ServiceTransaction.${tx_id}.applied_tier == FREE  # was PAID, became FREE via depth-3 cascade"
            - "ServiceTransaction.${tx_id}.paid_charge_cents == 0  # was 300, recomputed to 0"
            - "ServiceTransaction.${tx_id}.eligibility_determination_id != ${tx_initial_elig_id}  # re-bound from A to B"

      - name: allergy_update_rejects_pending_transactions_depth_2
        grounds:
          - endpoints.PATCH./school-meals/allergy-profiles/{id}
          - state_machines.ServiceTransaction.PENDING_to_REJECTED
          - entities.AllergyProfile.fields.allergens
          - entities.AllergyProfile.fields.severity
          - entities.ServiceTransaction.fields.rejection_reason
        distinguishing_aspect: |
          Depth-2 cascade originating from PATCH allergy-profiles (a
          DIFFERENT trigger from rule 4 instance 1 which originates from
          MealApplication APPROVED):
            (1) PATCH /allergy-profiles/{id} adds PEANUT to allergens with
                severity=SEVERE_ANAPHYLACTIC.
            (2) The MUTATION on the profile (step 1) causes every PENDING
                ServiceTransaction for student S whose MenuItem.allergens_present
                contains PEANUT to transition PENDING→REJECTED with
                rejection_reason=ALLERGEN_CONFLICT.
        test_recipe:
          setup:
            - "Student S has AllergyProfile allergens=[], severity=MILD."
            - "Two PENDING ServiceTransactions for S: TX1 on a PEANUT-containing MenuItem (PB Cookie), TX2 on a non-PEANUT MenuItem (Apple)."
            - "Server clock pinned to 2026-03-15T11:00:00.000Z."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T11:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Allergy Fam", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "A kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/allergy-profiles"
              payload: { student_id: "${stu_id}", allergens: [], severity: "MILD" }
              as: SchoolStaff
              captures: { profile_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-01-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "PB Cookie", list_price_cents: 100, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: ["PEANUT"], calories: 200 }
              as: SchoolStaff
              captures: { peanut_menu_id: $.data.id }
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Apple", list_price_cents: 50, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 80 }
              as: SchoolStaff
              captures: { apple_menu_id: $.data.id }
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${peanut_menu_id}" }
              as: SchoolStaff
              captures: { tx1_id: $.data.id }
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${apple_menu_id}" }
              as: SchoolStaff
              captures: { tx2_id: $.data.id }
          trigger:
            - call: "PATCH /school-meals/allergy-profiles/${profile_id}"
              payload: { allergens: ["PEANUT"], severity: "SEVERE_ANAPHYLACTIC" }
              as: SchoolStaff
            - call: "GET /school-meals/service-transactions/${tx1_id}"
              payload: {}
              as: SchoolStaff
              captures: { tx1_status_after: $.data.status, tx1_reason_after: $.data.rejection_reason }
            - call: "GET /school-meals/service-transactions/${tx2_id}"
              payload: {}
              as: SchoolStaff
              captures: { tx2_status_after: $.data.status }
          assert:
            - "ServiceTransaction.${tx1_id}.status == REJECTED  # cascade depth 2: PATCH caused PENDING→REJECTED"
            - "ServiceTransaction.${tx1_id}.rejection_reason == ALLERGEN_CONFLICT"
            - "ServiceTransaction.${tx2_id}.status == PENDING  # Apple has no PEANUT; unaffected"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_dispute_then_severe_allergen
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ALLERGEN_CONFLICT]
        distinguishing_aspect: |
          Category pair: state (priority 5, ERR_INVALID_STATE) vs business_safety
          (priority 6, ERR_ALLERGEN_CONFLICT). A SETTLED ServiceTransaction
          cannot accept a new POST /service-transactions/{id}/settle attempt
          (state violation), AND the same body would also violate allergen
          safety (severe allergen present). Priority 5 wins → server returns
          ERR_INVALID_STATE, NOT ERR_ALLERGEN_CONFLICT.
        test_recipe:
          setup:
            - "Student S has AllergyProfile allergens=[PEANUT], severity=SEVERE_ANAPHYLACTIC."
            - "MenuItem 'PB Cookie' contains PEANUT, list_price=100c."
            - "A ServiceTransaction TX for S on PB Cookie was created (note: created BEFORE the SEVERE allergen was added — so it was allowed) and then SETTLED."
            - "An attempt to settle the already-SETTLED TX is made WITHOUT substitute_for_allergen — both checks would fire if state didn't dominate."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Prio Fam", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "Prio kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            # Create profile with no allergens first (so PENDING tx is allowed)
            - call: "POST /school-meals/allergy-profiles"
              payload: { student_id: "${stu_id}", allergens: [], severity: "MILD" }
              as: SchoolStaff
              captures: { profile_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-01-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "PB Cookie", list_price_cents: 100, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: ["PEANUT"], calories: 200 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_id: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx_id}/settle"
              payload: {}
              as: SchoolStaff
            # Now upgrade allergen severity to SEVERE — but this PATCH does NOT
            # affect already-SETTLED tx (REJECTED cascade only targets PENDING).
            - call: "PATCH /school-meals/allergy-profiles/${profile_id}"
              payload: { allergens: ["PEANUT"], severity: "SEVERE_ANAPHYLACTIC" }
              as: SchoolStaff
          trigger:
            - call: "POST /school-meals/service-transactions/${tx_id}/settle"
              payload: {}
              as: SchoolStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 (HTTP for ERR_INVALID_STATE)"
            - "Response.data.error_id == ERR_INVALID_STATE  # state (priority 5) wins over business_safety (priority 6); NOT ERR_ALLERGEN_CONFLICT"

      - name: auth_vs_business_fiscal_other_parent_topup_over_cap
        grounds:
          - validations[priority=3]
          - validations[priority=9]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - errors[ERR_TOPUP_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair: auth (priority 3, ERR_NOT_RESOURCE_OWNER) vs
          business_fiscal (priority 9, ERR_TOPUP_CAP_EXCEEDED). A Parent
          attempts to top up Household B's account (not their own) with
          amount_cents=25,000 (over the $200 daily cap). Both checks would
          fire — ownership AND cap — but auth (priority 3) wins, so server
          returns ERR_NOT_RESOURCE_OWNER (403), NOT
          ERR_TOPUP_CAP_EXCEEDED (422).
        test_recipe:
          setup:
            - "Two households A and B with their own ParentAccounts."
            - "Parent of A (X-User-ID=Household A.id) attempts a $250 top-up against ParentAccount of B."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T08:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "ParentA", family_size: 2, annual_income_cents: 3000000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_a_id: $.data.id }
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "ParentB", family_size: 2, annual_income_cents: 3000000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_b_id: $.data.id }
          trigger:
            - call: "POST /school-meals/parent-accounts/${hh_b_id}/topup"
              payload: { amount_cents: 25000, idempotency_key: "other-parent-attempt-1" }
              as: Parent
              as_user_id: "${hh_a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 403 (ERR_NOT_RESOURCE_OWNER)"
            - "Response.data.error_id == ERR_NOT_RESOURCE_OWNER  # auth priority 3 dominates business_fiscal priority 9"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: fpl_free_tier_boundary_at_exact_threshold
        grounds:
          - calculations.determine_tier_from_income
          - state_machines.MealApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Numeric threshold boundary on /applications/{id}/approve endpoint:
          household_monthly_cents <= threshold_free_cents uses `<=` (inclusive).
          At annual_income_cents=4,056,000 (CA, fam=4), household_monthly_cents
          rounds to exactly 338000 which equals thr_free=338000 — tier MUST
          be FREE (NOT REDUCED). A test using `<` would incorrectly produce
          REDUCED. Different metric from the topup cap boundary below
          (income-vs-FPL, not currency-vs-cap), and reachable through a
          different endpoint (approve, not topup).
        test_recipe:
          setup:
            - "Household with annual_income_cents=4056000 (exactly $40,560/yr), family_size=4, CA."
            - "MealApplication submitted and started-review."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-10T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Boundary Fam", family_size: 4, annual_income_cents: 4056000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_id: $.data.id }
            - call: "POST /school-meals/applications/${app_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/applications/${app_id}/start-review"
              payload: {}
              as: DistrictReviewer
          trigger:
            - call: "POST /school-meals/applications/${app_id}/approve"
              payload: { decision_reason: "exact-boundary" }
              as: DistrictReviewer
            - call: "GET /school-meals/households/${hh_id}/eligibility-determinations"
              payload: {}
              as: DistrictReviewer
          assert:
            # round_half_up(4056000/12) = 338000 exactly; thr_free=338000; 338000<=338000 → FREE
            - "The created EligibilityDetermination has tier == FREE  # boundary inclusive (<=); a `<` impl would return REDUCED"

      - name: topup_cap_boundary_at_exact_200_dollars
        grounds:
          - calculations.recompute_topup_window
          - validations[priority=9]
          - errors[ERR_TOPUP_CAP_EXCEEDED]
        distinguishing_aspect: |
          Currency-vs-cap boundary on /parent-accounts/{id}/topup endpoint:
          daily_topup_total_cents + amount_cents <= DAILY_TOPUP_CAP_CENTS
          (20000) uses `<=` (inclusive). A topup of exactly 20000 cents on a
          fresh window MUST succeed (NOT reject); a follow-up topup of even
          1 cent in the same UTC day MUST reject with
          ERR_TOPUP_CAP_EXCEEDED. Different metric (currency cap vs FPL income)
          and different endpoint than the FPL boundary above.
        test_recipe:
          setup:
            - "Fresh Household H, fresh ParentAccount (daily_topup_total_cents=0)."
            - "Server clock pinned to 2026-04-11T00:00:00.000Z (UTC day boundary)."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "TopUp Fam", family_size: 2, annual_income_cents: 3000000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            # First topup at exactly $200 — must succeed
            - call: "POST /school-meals/parent-accounts/${hh_id}/topup"
              payload: { amount_cents: 20000, idempotency_key: "tup-cap-1" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { entry1_id: $.data.id, entry1_amount: $.data.amount_cents }
          trigger:
            # Second topup of 1 cent same day — must reject
            - call: "POST /school-meals/parent-accounts/${hh_id}/topup"
              payload: { amount_cents: 1, idempotency_key: "tup-cap-2" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "First topup entry1.amount_cents == 20000 and HTTP 201 (boundary inclusive: 0+20000 == 20000 cap is allowed)"
            - "Response.data.error_id == ERR_TOPUP_CAP_EXCEEDED  # second topup 20000+1=20001 > 20000 rejects"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: service_transaction_create_requires_active_eligibility
        grounds:
          - calculations.select_active_determination
          - errors[ERR_NO_ACTIVE_ELIGIBILITY]
          - entities.ServiceTransaction.fields.eligibility_determination_id
          - entities.EligibilityDetermination.fields.lifecycle_status
        distinguishing_aspect: |
          Entity pair: ServiceTransaction (action) ↔ EligibilityDetermination
          (state-dependency target). POST /service-transactions cannot create
          a PENDING row unless an EligibilityDetermination of the student's
          household has lifecycle_status==ACTIVE AND covers server_clock_utc.
          If the household's only determination is REVOKED, creation fails
          with ERR_NO_ACTIVE_ELIGIBILITY.
        test_recipe:
          setup:
            - "Household H has exactly one EligibilityDetermination, REVOKED by USDAAuditor."
            - "Student S of H exists; MenuItem M exists."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-12T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Rev Fam", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "Rev kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-04-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
              captures: { elig_id: $.data.id, elig_v: $.data.version }
            - call: "POST /school-meals/eligibility-determinations/${elig_id}/revoke"
              payload: { expected_eligibilitydetermination_version: "${elig_v}" }
              as: USDAAuditor
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Plain Bread", list_price_cents: 100, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 150 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
          trigger:
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "Response.data.error_id == ERR_NO_ACTIVE_ELIGIBILITY  # ServiceTransaction creation depends on EligibilityDetermination.lifecycle_status==ACTIVE"

      - name: reimbursement_claim_submit_requires_all_transactions_settled
        grounds:
          - state_machines.ReimbursementClaim.DRAFT_to_SUBMITTED
          - errors[ERR_PERIOD_NOT_SETTLED]
          - entities.ServiceTransaction.fields.status
        distinguishing_aspect: |
          Entity pair: ReimbursementClaim (action) ↔ ServiceTransaction
          (state-dependency target) — DIFFERENT from the
          ServiceTransaction↔EligibilityDetermination pair above. POST
          /reimbursement-claims/{id}/submit fails if any ServiceTransaction
          in [period_start_utc, period_end_utc] for any student at
          school_code is PENDING or DISPUTED.
        test_recipe:
          setup:
            - "School ELEM-101 has 2 ServiceTransactions in 2026-01-01..2026-01-31: TX1 SETTLED, TX2 PENDING."
            - "A ReimbursementClaim DRAFT exists for that period."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "ClaimFam", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "Claim kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-01-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Free Lunch", list_price_cents: 0, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 500 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx1_id: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx1_id}/settle"
              payload: {}
              as: SchoolStaff
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx2_id: $.data.id }
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/reimbursement-claims"
              payload: { school_code: "ELEM-101", period_start_utc: "2026-01-01T00:00:00.000Z", period_end_utc: "2026-01-31T23:59:59.000Z", accounting_basis: "CASH" }
              as: SchoolStaff
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /school-meals/reimbursement-claims/${claim_id}/submit"
              payload: {}
              as: SchoolStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response.data.error_id == ERR_PERIOD_NOT_SETTLED  # TX2 PENDING blocks submission"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: eligibility_determinations_half_open_no_adjacency_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_ELIGIBILITY_OVERLAP]
          - entities.EligibilityDetermination.fields.valid_from_utc
          - entities.EligibilityDetermination.fields.valid_to_utc
        distinguishing_aspect: |
          Interval semantics: [valid_from_utc, valid_to_utc) — half-open
          (start inclusive, end exclusive). Adjacency at exact boundary
          (new.valid_from_utc == existing.valid_to_utc) is ALLOWED (no
          buffer). True interior overlap rejects. Resource: Household-scoped
          EligibilityDeterminations.
        test_recipe:
          setup:
            - "Household H has ACTIVE determination A: valid 2026-01-01T00:00:00.000Z .. 2026-03-01T00:00:00.000Z (half-open)."
            - "Attempt to create determination B that overlaps interior of A."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Overlap Fam", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-01-01T00:00:00.000Z", valid_to_utc: "2026-03-01T00:00:00.000Z" }
              as: SchoolStaff
              captures: { elig_a_id: $.data.id }
          trigger:
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-02-15T00:00:00.000Z", valid_to_utc: "2026-04-01T00:00:00.000Z" }
              as: SchoolStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response.data.error_id == ERR_ELIGIBILITY_OVERLAP  # new [02-15, 04-01) overlaps existing [01-01, 03-01) on the interior"

      - name: reimbursement_claims_closed_intervals_with_one_day_gap_buffer
        grounds:
          - validations[priority=7]
          - errors[ERR_CLAIM_PERIOD_OVERLAP]
          - entities.ReimbursementClaim.fields.period_start_utc
          - entities.ReimbursementClaim.fields.period_end_utc
        distinguishing_aspect: |
          DIFFERENT interval semantics from EligibilityDetermination above:
          [period_start_utc, period_end_utc] is CLOSED (both endpoints
          inclusive) AND requires a 1-calendar-day GAP between consecutive
          claims for the same school_code (new.period_start_utc >=
          existing.period_end_utc + 1 day). Adjacency at the exact boundary
          REJECTS (unlike EligibilityDetermination above). Resource:
          School-scoped ReimbursementClaims.
        test_recipe:
          setup:
            - "School ELEM-101 has Claim A: period 2026-01-01T00:00:00.000Z .. 2026-01-31T23:59:59.000Z."
            - "Attempt Claim B starting 2026-02-01T00:00:00.000Z — adjacency without 1-day gap (gap from 2026-01-31T23:59:59 to 2026-02-01T00:00:00 is < 1 day)."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/reimbursement-claims"
              payload: { school_code: "ELEM-101", period_start_utc: "2026-01-01T00:00:00.000Z", period_end_utc: "2026-01-31T23:59:59.000Z", accounting_basis: "CASH" }
              as: SchoolStaff
              captures: { claim_a_id: $.data.id }
          trigger:
            - call: "POST /school-meals/reimbursement-claims"
              payload: { school_code: "ELEM-101", period_start_utc: "2026-02-01T00:00:00.000Z", period_end_utc: "2026-02-28T23:59:59.000Z", accounting_basis: "CASH" }
              as: SchoolStaff
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "Response.data.error_id == ERR_CLAIM_PERIOD_OVERLAP  # gap < 1 day buffer; CLOSED-interval semantics + 1-day gap rule differ from EligibilityDetermination's half-open zero-buffer rule"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: settle_then_refund_leaves_ledger_balance_unchanged
        grounds:
          - state_machines.ServiceTransaction.PENDING_to_SETTLED
          - state_machines.ServiceTransaction.SETTLED_to_REFUNDED
          - entities.ParentAccount.fields.balance_cents
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: ParentAccount.balance_cents (currency in cents).
          Forward action: settle a PAID-tier 300c transaction → balance
          decreases by 300. Compensating action: refund that same transaction
          → balance increases by 300. Pinned invariant: balance_cents AFTER
          settle+refund == balance_cents BEFORE settle (delta = 0). Two
          opposite-signed LedgerEntries created — sum(CREDIT)-sum(DEBIT)
          unchanged.
        test_recipe:
          setup:
            - "Household H, ParentAccount with balance_cents=5000 (after $50 topup)."
            - "PAID-tier ServiceTransaction TX of 300c was SETTLED → balance=4700."
            - "Refund TX → balance MUST return to 5000."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T10:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "Inv Fam", family_size: 4, annual_income_cents: 8000000, address_state: "CA", direct_certification_flag: false }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "Inv kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/applications"
              payload: { household_id: "${hh_id}", school_year: "2025-2026" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { app_id: $.data.id }
            - call: "POST /school-meals/applications/${app_id}/submit"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
            - call: "POST /school-meals/applications/${app_id}/start-review"
              payload: {}
              as: DistrictReviewer
            - call: "POST /school-meals/applications/${app_id}/approve"
              payload: { decision_reason: "PAID tier confirmed" }
              as: DistrictReviewer
            - call: "POST /school-meals/parent-accounts/${hh_id}/topup"
              payload: { amount_cents: 5000, idempotency_key: "inv-1" }
              as: Parent
              as_user_id: "${hh_id}"
              captures: { topup_entry_id: $.data.id }
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Sandwich", list_price_cents: 300, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 350 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_id: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx_id}/settle"
              payload: {}
              as: SchoolStaff
              captures: { tx_v_after_settle: $.data.version, tx_charge: $.data.paid_charge_cents }
            - call: "GET /school-meals/parent-accounts/${hh_id}"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
              captures: { balance_after_settle: $.data.balance_cents }
          trigger:
            - call: "POST /school-meals/service-transactions/${tx_id}/refund"
              payload: { expected_servicetransaction_version: "${tx_v_after_settle}" }
              as: SchoolStaff
            - call: "GET /school-meals/parent-accounts/${hh_id}"
              payload: {}
              as: Parent
              as_user_id: "${hh_id}"
              captures: { balance_after_refund: $.data.balance_cents }
          assert:
            # Initial: 0. After topup: +5000 = 5000. After settle (PAID 300c): -300 = 4700. After refund: +300 = 5000.
            - "ParentAccount.${hh_id}.balance_cents == 5000  # AFTER refund — matches pre-settle balance (invariant)"
            - "balance_after_refund == 5000 (named 5000, NOT a paraphrase)"

      - name: settle_then_refund_zeros_federal_reimbursement_invariant
        grounds:
          - state_machines.ServiceTransaction.PENDING_to_SETTLED
          - state_machines.ServiceTransaction.SETTLED_to_REFUNDED
          - entities.ServiceTransaction.fields.federal_reimbursement_cents
          - calculations.compute_claim_reimbursement
        distinguishing_aspect: |
          DIFFERENT conserved quantity: ReimbursementClaim.total_reimbursement_cents
          (USDA reimbursement in cents) for a CASH-basis claim. Forward
          action: SETTLE stamps federal_reimbursement_cents=470 (FREE rate)
          on the transaction, contributing 470 to the eventual claim total.
          Compensating action: REFUND zeros federal_reimbursement_cents,
          contributing 0. Pinned invariant: a SETTLE+REFUND pair on a single
          transaction nets to 0 in the CASH-basis claim total (the
          transaction is excluded from the SETTLED filter; even if it
          weren't, its fed_reimb=0 contributes 0).
        test_recipe:
          setup:
            - "School ELEM-101 has 2 ServiceTransactions in 2026-01: TX_A SETTLED (fed_reimb=470), TX_B SETTLED-then-REFUNDED (fed_reimb stamped 470 then zeroed)."
            - "CASH-basis Claim for 2026-01-01..2026-01-31 is submitted."
          setup_api_calls:
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/households"
              payload: { primary_parent_name: "InvFed Fam", family_size: 4, annual_income_cents: 4500000, address_state: "CA", direct_certification_flag: true }
              as: SchoolStaff
              captures: { hh_id: $.data.id }
            - call: "POST /school-meals/students"
              payload: { household_id: "${hh_id}", full_name: "InvFed kid", school_code: "ELEM-101", grade_level: 3 }
              as: SchoolStaff
              captures: { stu_id: $.data.id }
            - call: "POST /school-meals/eligibility-determinations"
              payload: { household_id: "${hh_id}", source: "DIRECT_CERTIFICATION", tier: "FREE", valid_from_utc: "2026-01-01T00:00:00.000Z", valid_to_utc: "2026-08-31T23:59:59.000Z" }
              as: SchoolStaff
            - call: "POST /school-meals/menu-items"
              payload: { school_code: "ELEM-101", name: "Lunch", list_price_cents: 0, federal_reimbursement_free_cents: 470, federal_reimbursement_reduced_cents: 430, federal_reimbursement_paid_cents: 70, allergens_present: [], calories: 500 }
              as: SchoolStaff
              captures: { menu_id: $.data.id }
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_a_id: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx_a_id}/settle"
              payload: {}
              as: SchoolStaff
            - call: "POST /school-meals/service-transactions"
              payload: { student_id: "${stu_id}", menu_item_id: "${menu_id}" }
              as: SchoolStaff
              captures: { tx_b_id: $.data.id }
            - call: "POST /school-meals/service-transactions/${tx_b_id}/settle"
              payload: {}
              as: SchoolStaff
              captures: { tx_b_v: $.data.version }
            - call: "POST /school-meals/service-transactions/${tx_b_id}/refund"
              payload: { expected_servicetransaction_version: "${tx_b_v}" }
              as: SchoolStaff
            # Advance clock past period and create CASH claim
            - call: "POST /school-meals/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /school-meals/reimbursement-claims"
              payload: { school_code: "ELEM-101", period_start_utc: "2026-01-01T00:00:00.000Z", period_end_utc: "2026-01-31T23:59:59.000Z", accounting_basis: "CASH" }
              as: SchoolStaff
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /school-meals/reimbursement-claims/${claim_id}/submit"
              payload: {}
              as: SchoolStaff
              captures: { claim_total: $.data.total_reimbursement_cents, claim_count: $.data.included_transaction_count }
          assert:
            # CASH counts only SETTLED. TX_A is SETTLED (470). TX_B is REFUNDED (excluded).
            # Total = 470, count = 1. Invariant: TX_B's settle+refund pair contributes 0 to the claim — IDENTICAL
            # to if TX_B had never been settled at all.
            - "ReimbursementClaim.${claim_id}.total_reimbursement_cents == 470  # only TX_A counted; TX_B's settle+refund net 0"
            - "ReimbursementClaim.${claim_id}.included_transaction_count == 1"
