              as_user_id: "${owner_id}"
              captures: { election_id: $.data.id }
            - &k_reply
              call: "POST /sanction-cases/${case_id}/reply"
              payload: { reply_text: "The store is the only staple-food retailer within 12 miles." }
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - &k_det_cmp
              call: "POST /sanction-cases/${case_id}/determination"
              payload: { sanction_type: "CMP_IN_LIEU" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /sanction-cases/${case_id}/cmp-payments"
              payload: { amount_cents: 23456 }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { payment_entry_id: $.data.id }
          assert:
            - "the response is 201 and PenaltyLedgerEntry.${payment_entry_id} carries id and created_at but no version and no updated_at"
            - "PenaltyLedgerEntry.${payment_entry_id}.entry_type == CMP_PAYMENT"
            - "PenaltyLedgerEntry.${payment_entry_id}.amount_cents == -23456"
            - "PenaltyLedgerEntry.${payment_entry_id}.reason_code == RETAILER_REMITTANCE"
            - "PenaltyLedgerEntry.${payment_entry_id}.balance_after_cents == 400000"
            - "GET /sanction-cases/${case_id}/penalty-ledger returns exactly 2 rows and the CMP_ASSESSED row still reads amount_cents 423456 with balance_after_cents 423456"
            - "SanctionCase.${case_id}.cmp_outstanding_cents == 400000"
            - "Owner.${owner_id}.cmp_outstanding_cents == 400000 and sanction_flag == HAS_ACTIVE_CMP_DEBT"
            - "CmpElection.${election_id}.status == APPROVED (not yet PAID, the balance is still positive)"

      - name: ebt_terminal_create_with_unknown_depot_returns_depot_not_found
        claim_type: Parent Relationships
        grounds:
          - validations.priority_4_body_fk_resolution
          - errors.ERR_DEPOT_NOT_FOUND
          - entities.EbtTerminal.parent_EquipmentDepot
        distinguishing_aspect: "A terminal cannot exist without its depot: an unused depot UUID in the body returns 404 ERR_DEPOT_NOT_FOUND and creates no terminal, so the real depot's counters stay at 5/0/0/0/0."
        test_recipe:
          setup:
            - "One TX depot owning 5 units and no terminals."
          setup_api_calls:
            - &k_depot
              call: "POST /equipment-depots"
              payload: { state_code: "TX", total_units_owned: 5 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { depot_id: $.data.id }
          trigger:
            - call: "POST /ebt-terminals"
              payload: { depot_id: "00000000-0000-4000-8000-00000000dead", serial_number: "EBT-9999", model: "EBT_ONLY_WIRELESS" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { depot_404_error_id: $.data.error_id }
          assert:
            - "the response is 404 and ${depot_404_error_id} == ERR_DEPOT_NOT_FOUND"
            - "GET /ebt-terminals?depot_id=${depot_id} returns total_count == 0"
            - "EquipmentDepot.${depot_id}.units_in_stock == 5 and units_reserved == 0 and units_deployed == 0 and units_pending_return == 0 and units_retired == 0"

      - name: terminal_deployment_is_the_many_to_many_junction_between_store_and_terminal
        claim_type: Parent Relationships
        grounds:
          - complexity_profile.entity_topology
          - entities.TerminalDeployment.parent_Store
          - entities.TerminalDeployment.parent_EbtTerminal
          - endpoints.GET_/terminal-deployments
        distinguishing_aspect: "graph topology: one terminal is booked at two different stores over disjoint windows and one store holds two different terminals, and both directions of the junction are reachable via GET /terminal-deployments?terminal_id= and ?store_id= without either parent owning the other."
        test_recipe:
          setup:
            - "Two authorized stores under the same owner (the shared CONVENIENCE store plus a second store authorized through its own application and visit) and a 5-unit TX depot with two terminals."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - &k_store_b
              call: "POST /stores"
              payload: { owner_id: "${owner_id}", store_name: "Rio Corner Market", state_code: "TX", store_type: "CONVENIENCE", checkout_lane_count: 1, staple_shelf_linear_feet: 30, annual_gross_sales_cents: 24000000, annual_staple_sales_cents: 14000000, max_terminal_slots: 1 }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { store_b_id: $.data.id, store_b_v: $.data.version }
            - &k_app_b
              call: "POST /applications"
              payload: { store_id: "${store_b_id}", expected_store_version: "${store_b_v}", application_type: "INITIAL", claimed_criterion: "CRITERION_A", reported_inventory_lines: *k_inv_pass }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { app_b_id: $.data.id }
            - &k_submit_b
              call: "POST /applications/${app_b_id}/submit"
              payload: {}
              as: RetailerOwner
              as_user_id: "${owner_id}"
            - &k_visit_b
              call: "POST /store-visits"
              payload: { application_id: "${app_b_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-01T04:00:00Z", window_end: "2026-08-01T05:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit_b_id: $.data.id }
            - &k_clock_0401
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T04:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - &k_start_b
              call: "POST /store-visits/${visit_b_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - &k_findings_b
              call: "POST /store-visits/${visit_b_id}/findings"
              payload: { observed_inventory_lines: *k_inv_pass, observed_staple_shelf_linear_feet: 30 }
              as: Inspector
              as_user_id: "${insp_id}"
            - &k_decision_b
              call: "POST /applications/${app_b_id}/decision"
              payload: { outcome: "APPROVED" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
            - *k_depot
            - &k_term
              call: "POST /ebt-terminals"
              payload: { depot_id: "${depot_id}", serial_number: "EBT-0001", model: "EBT_ONLY_WIRELESS" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { term_id: $.data.id }
            - &k_term2
              call: "POST /ebt-terminals"
              payload: { depot_id: "${depot_id}", serial_number: "EBT-0002", model: "EBT_ONLY_DIAL" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { term2_id: $.data.id }
          trigger:
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term_id}", deploy_start: "2026-08-01T00:00:00Z", deploy_end: "2026-09-30T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { dep_a1_id: $.data.id }
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_b_id}", terminal_id: "${term_id}", deploy_start: "2026-10-01T00:00:00Z", deploy_end: "2026-12-31T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { dep_b1_id: $.data.id }
            - call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term2_id}", deploy_start: "2026-08-01T00:00:00Z", deploy_end: "2026-09-30T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { dep_a2_id: $.data.id }
          assert:
            - "all three bookings return 201 with status RESERVED"
            - "GET /terminal-deployments?terminal_id=${term_id} returns exactly 2 rows: ${dep_a1_id} at ${store_id} and ${dep_b1_id} at ${store_b_id}"
            - "GET /terminal-deployments?store_id=${store_id} returns exactly 2 rows: ${dep_a1_id} and ${dep_a2_id}"
            - "EquipmentDepot.${depot_id}.units_reserved == 2 (one unit twice-booked still counts once)"
            - "EquipmentDepot.${depot_id}.units_in_stock == 3"

  - section: state_machines
    instances:

      - name: application_submit_moves_draft_to_submitted_and_stamps_desk_figures
        claim_type: Valid Transition
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - calculations.staple_criterion_a_qualification.DESK_VARIETY_FIRST
        distinguishing_aspect: "The declared DRAFT -> SUBMITTED edge fires, submitted_at is stamped from the logical clock and the desk figures are (re)computed to 4 qualifying / 2 perishable categories."
        test_recipe:
          setup:
            - "One owner, the shared store and a DRAFT CRITERION_A application whose 12 reported lines all carry unit_count >= 3."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
          trigger:
            - *k_submit
          assert:
            - "the response is 200 and Application.${app_id}.status == SUBMITTED"
            - "Application.${app_id}.submitted_at == 2026-08-01T00:00:00Z"
            - "Application.${app_id}.desk_qualifying_categories == 4"
            - "Application.${app_id}.desk_perishable_categories == 2"
            - "Application.${app_id}.desk_criterion_pass == true"
            - "Application.${app_id}.hold_reason_code == null"
            - "Store.${store_id}.authorization_status == NOT_AUTHORIZED (submit does not authorize)"

      - name: store_visit_start_moves_scheduled_to_in_progress_at_window_open
        claim_type: Valid Transition
        grounds:
          - state_machines.StoreVisit.SCHEDULED_to_IN_PROGRESS
          - calculations.inspector_committed_minutes
        distinguishing_aspect: "With the clock exactly at window_start the SCHEDULED -> IN_PROGRESS edge fires (the gate is >=, not >), and committed_minutes stays at the scheduled 120 because IN_PROGRESS is still a committed status."
        test_recipe:
          setup:
            - "A SUBMITTED application with a 2026-08-01T00:00Z-02:00Z visit scheduled to Dana Ruiz, clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
          trigger:
            - *k_start
          assert:
            - "the response is 200 and StoreVisit.${visit_id}.status == IN_PROGRESS"
            - "StoreVisit.${visit_id}.window_minutes == 120"
            - "Inspector.${insp_id}.committed_minutes == 120"
            - "Application.${app_id}.status == PENDING_VISIT (unchanged by start)"

      - name: cmp_election_refiled_supersedes_the_earlier_election_row
        claim_type: Valid Transition
        grounds:
          - state_machines.CmpElection.ELECTED_to_SUPERSEDED
          - endpoints.POST_/sanction-cases/{caseId}/cmp-elections
        distinguishing_aspect: "A second election on the same case drives the first row ELECTED -> SUPERSEDED and leaves exactly one ELECTED row, and because the first election bumped nothing the same case version is still current."
        test_recipe:
          setup:
            - "A CHARGE_ISSUED INELIGIBLE_ITEMS_HARDSHIP case with one ELECTED CmpElection on file."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_inv_open
            - *k_ev_household
            - *k_conclude_ineligible
            - *k_case
            - *k_charge
            - *k_election
          trigger:
            - call: "POST /sanction-cases/${case_id}/cmp-elections"
              payload: { expected_sanction_case_version: "${case_v}", hardship_ownership_change_pending: true }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { election2_id: $.data.id }
          assert:
            - "the response is 201"
            - "CmpElection.${election_id}.status == SUPERSEDED"
            - "CmpElection.${election2_id}.status == ELECTED"
            - "CmpElection.${election2_id}.hardship_ownership_change_pending == true"
            - "GET /sanction-cases/${case_id}/cmp-elections?status=ELECTED returns total_count == 1"

      - name: visit_start_before_window_start_cannot_open_the_visit
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.StoreVisit.SCHEDULED_to_IN_PROGRESS.preconditions
          - validations.priority_12_business_temporal
          - errors.ERR_VISIT_WINDOW_NOT_OPEN
        distinguishing_aspect: "The clock sits at 2026-08-01T00:00Z while the window opens 2026-08-02T00:00Z, so the transition is refused with 409 ERR_VISIT_WINDOW_NOT_OPEN and the visit stays SCHEDULED with its minutes still committed."
        test_recipe:
          setup:
            - "A SUBMITTED application with a visit scheduled for tomorrow and the clock left at today."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - &k_visit_tomorrow
              call: "POST /store-visits"
              payload: { application_id: "${app_id}", inspector_id: "${insp_id}", visit_type: "PRE_AUTHORIZATION", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T02:00:00Z" }
              as: FnsAnalyst
              as_user_id: "fns-analyst-1"
              captures: { visit_tmw_id: $.data.id }
          trigger:
            - call: "POST /store-visits/${visit_tmw_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { window_not_open_error_id: $.data.error_id }
          assert:
            - "the response is 409 and ${window_not_open_error_id} == ERR_VISIT_WINDOW_NOT_OPEN"
            - "StoreVisit.${visit_tmw_id}.status == SCHEDULED"
            - "Inspector.${insp_id}.committed_minutes == 120"

      - name: visit_start_with_inactive_inspector_cannot_open_the_visit
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.StoreVisit.SCHEDULED_to_IN_PROGRESS.preconditions
          - errors.ERR_INVALID_STATE
          - endpoints.PATCH_/inspectors/{inspectorId}
        distinguishing_aspect: "The window is open but the assigned inspector was set INACTIVE after scheduling, so start returns 409 ERR_INVALID_STATE - a cross-entity precondition on a different entity than the one transitioning."
        test_recipe:
          setup:
            - "A SUBMITTED application with an open-window visit whose inspector is then deactivated."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - call: "PATCH /inspectors/${insp_id}"
              payload: { status: "INACTIVE" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /store-visits/${visit_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { inactive_insp_error_id: $.data.error_id }
          assert:
            - "the response is 409 and ${inactive_insp_error_id} == ERR_INVALID_STATE"
            - "StoreVisit.${visit_id}.status == SCHEDULED"
            - "Inspector.${insp_id}.status == INACTIVE and committed_minutes == 120 (deactivation does not release commitments)"

      - name: deployment_activation_on_unauthorized_store_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TerminalDeployment.RESERVED_to_ACTIVE.preconditions
          - validations.priority_10_business_safety
          - errors.ERR_STORE_NOT_AUTHORIZED
        distinguishing_aspect: "Reserving a terminal for a NOT_AUTHORIZED store is allowed, but activating it is refused with 403 ERR_STORE_NOT_AUTHORIZED, so the depot unit stays RESERVED rather than moving to DEPLOYED."
        test_recipe:
          setup:
            - "A store that never filed an application, plus a depot with one wireless terminal reserved to it."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_depot
            - *k_term
            - &k_deploy
              call: "POST /terminal-deployments"
              payload: { store_id: "${store_id}", terminal_id: "${term_id}", deploy_start: "2026-08-01T00:00:00Z", deploy_end: "2026-09-30T00:00:00Z" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { dep_id: $.data.id }
          trigger:
            - call: "POST /terminal-deployments/${dep_id}/activate"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { not_authorized_error_id: $.data.error_id }
          assert:
            - "the response is 403 and ${not_authorized_error_id} == ERR_STORE_NOT_AUTHORIZED"
            - "TerminalDeployment.${dep_id}.status == RESERVED and activated_at == null"
            - "EbtTerminal.${term_id}.status == RESERVED"
            - "EquipmentDepot.${depot_id}.units_reserved == 1 and units_deployed == 0 and units_in_stock == 4"
            - "Store.${store_id}.active_terminal_count == 0"

      - name: scheduling_a_visit_commits_inspector_minutes_and_advances_the_application
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Application.SUBMITTED_to_PENDING_VISIT.side_effects
          - calculations.inspector_committed_minutes
        distinguishing_aspect: "One POST /store-visits produces three effects at once: the visit row in SCHEDULED, +120 on Inspector.committed_minutes, and the application moving SUBMITTED -> PENDING_VISIT."
        test_recipe:
          setup:
            - "A SUBMITTED application and an ACTIVE inspector with 0 committed minutes."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
          trigger:
            - *k_visit
          assert:
            - "the response is 201 and StoreVisit.${visit_id}.status == SCHEDULED"
            - "StoreVisit.${visit_id}.window_minutes == 120"
            - "Inspector.${insp_id}.committed_minutes == 120"
            - "Application.${app_id}.status == PENDING_VISIT"

      - name: approval_mints_the_fns_number_and_authorizes_the_store
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_APPROVED.side_effects
          - state_machines.Store.NOT_AUTHORIZED_to_AUTHORIZED
          - entities.Store.fields.fns_number
        distinguishing_aspect: "The APPROVED decision writes into a different entity than the one transitioning: Store.fns_number is minted as the first value of the FNS-1000001 sequence, authorization_status becomes AUTHORIZED and authorized_at is stamped, while sanction_status stays NONE."
        test_recipe:
          setup:
            - "An UNDER_REVIEW application whose only visit submitted passing findings (verified pass, depth 30 ft >= the 24 ft CONVENIENCE floor, no discrepancy)."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
          trigger:
            - *k_decision
          assert:
            - "the response is 200 and Application.${app_id}.status == APPROVED"
            - "Application.${app_id}.decision_reason_code == APPROVED_CRITERION_A"
            - "Application.${app_id}.decided_at == 2026-08-01T00:00:00Z"
            - "Store.${store_id}.fns_number == FNS-1000001"
            - "Store.${store_id}.authorization_status == AUTHORIZED"
            - "Store.${store_id}.authorized_at == 2026-08-01T00:00:00Z"
            - "Store.${store_id}.sanction_status == NONE (the parallel dimension is untouched)"

      - name: charge_letter_sets_both_ten_day_deadlines_and_flags_the_store_charged
        claim_type: Side Effect Execution
        grounds:
          - state_machines.SanctionCase.CHARGE_DRAFT_to_CHARGE_ISSUED.side_effects
          - state_machines.Store.sanction_status.UNDER_INVESTIGATION_to_CHARGED
        distinguishing_aspect: "Issuing the charge letter at 2026-08-01 sets reply_due_at and cmp_election_due_at to exactly 2026-08-11T00:00:00Z, records charge_issued_by_user_id for the later SOD check, and moves only the store's sanction_status dimension to CHARGED while authorization_status stays AUTHORIZED."
        test_recipe:
          setup:
            - "An authorized store with a SUBSTANTIATED ineligible-items investigation and a CHARGE_DRAFT sanction case."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_inv_open
            - *k_ev_household
            - *k_conclude_ineligible
            - *k_case
          trigger:
            - *k_charge
          assert:
            - "the response is 200 and SanctionCase.${case_id}.status == CHARGE_ISSUED"
            - "SanctionCase.${case_id}.charge_letter_sent_at == 2026-08-01T00:00:00Z"
            - "SanctionCase.${case_id}.reply_due_at == 2026-08-11T00:00:00Z"
            - "SanctionCase.${case_id}.cmp_election_due_at == 2026-08-11T00:00:00Z"
            - "SanctionCase.${case_id}.charge_issued_by_user_id == fns-admin-1"
            - "Store.${store_id}.sanction_status == CHARGED"
            - "Store.${store_id}.authorization_status == AUTHORIZED"

      - name: reply_to_a_charge_draft_case_is_rejected_as_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SanctionCase.CHARGE_ISSUED_to_REPLY_RECEIVED.preconditions
          - validations.priority_9_state
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CHARGE_DRAFT has no reply edge, so the reply is refused with 409 ERR_INVALID_STATE even though the caller is the correct owner and no deadline exists yet to violate."
        test_recipe:
          setup:
            - "A CHARGE_DRAFT sanction case whose charge letter has not been issued."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_app
            - *k_submit
            - *k_insp
            - *k_visit
            - *k_start
            - *k_findings
            - *k_decision
            - *k_inv_open
            - *k_ev_household
            - *k_conclude_ineligible
            - *k_case
          trigger:
            - call: "POST /sanction-cases/${case_id}/reply"
              payload: { reply_text: "Filed before the charge letter arrived." }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { early_reply_error_id: $.data.error_id }
          assert:
            - "the response is 409 and ${early_reply_error_id} == ERR_INVALID_STATE"
            - "SanctionCase.${case_id}.status == CHARGE_DRAFT"
            - "SanctionCase.${case_id}.reply_text == null and reply_received_at == null"
            - "Store.${store_id}.sanction_status == UNDER_INVESTIGATION"

      - name: activating_a_released_deployment_is_rejected_as_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TerminalDeployment.RESERVED_to_RELEASED
          - state_machines.TerminalDeployment.RESERVED_to_ACTIVE.preconditions
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "RELEASED is terminal, so activate returns 409 ERR_INVALID_STATE and the depot unit that already returned to stock is not re-reserved."
        test_recipe:
          setup:
            - "A depot with one terminal reserved to a store and then explicitly released."
          setup_api_calls:
            - *k_owner
            - *k_store
            - *k_depot
            - *k_term
            - *k_deploy
            - call: "POST /terminal-deployments/${dep_id}/release"
              payload: { close_reason_code: "RETAILER_REQUEST" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
          trigger:
            - call: "POST /terminal-deployments/${dep_id}/activate"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { released_activate_error_id: $.data.error_id }
          assert:
            - "the response is 409 and ${released_activate_error_id} == ERR_INVALID_STATE"
            - "TerminalDeployment.${dep_id}.status == RELEASED and activated_at == null"
            - "EbtTerminal.${term_id}.status == IN_STOCK"
            - "EquipmentDepot.${depot_id}.units_in_stock == 5 and units_reserved == 0"

      - name: freshly_created_rows_land_on_their_declared_initial_states
        claim_type: Initial State
        grounds:
