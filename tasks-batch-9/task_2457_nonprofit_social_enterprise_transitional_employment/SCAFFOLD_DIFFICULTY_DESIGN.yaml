              captures: { p1_id: $.data.id }
            - call: "POST /work-shifts"
              payload: { business_line_id: "${bl_id}", starts_at: "2026-09-07T08:00:00Z", ends_at: "2026-09-07T20:00:00Z", trainee_capacity: 2, supervisor_user_id: "sup-1" }
              as: ProgramDirector
              captures: { ws1_id: $.data.id }
            - call: "POST /shift-assignments"
              payload: { work_shift_id: "${ws1_id}", participant_id: "${p1_id}" }
