      - name: score_immediately_visible_in_entry_read
        claim_type: immediate
        grounds: [calculations.session_points, entities.EventEntry.fields.event_points]
        distinguishing_aspect: "Immediate consistency: the score call's own response shows SCORED and a plain GET right after (no delay, no ops run) shows recomputed event_points."
        test_recipe:
          setup: ["Event IN_PROGRESS, entry A GRID_LOCKED, session CLOSED with A's result submitted"]
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Sync Cup", year: 2026, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 171.0 }, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/start", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/lock-grid", payload: {}, as: RaceDirector, captures: { e_v4: $.data.version } }
            - { call: "POST /karting/events/${e_id}/sessions", payload: { session_type: "MAIN", sequence: 1, expected_event_version: "${e_v4}" }, as: RaceDirector, captures: { sess: $.data.id, se_v1: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "OPEN" }, as: RaceDirector, captures: { se_v2: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "CLOSED" }, as: RaceDirector, captures: { se_v3: $.data.version } }
            - { call: "POST /karting/sessions/${sess}/results", payload: { results: [ { entry_id: "${en_a}", finish_position: 1, best_lap_ms: 45000, total_time_ms: 600000 } ], expected_session_version: "${se_v3}" }, as: RaceDirector }
          trigger:
            - { call: "POST /karting/sessions/${sess}/score", payload: {}, as: RaceDirector }
            - { call: "GET /karting/entries/${en_a}", payload: {}, as: LeagueAdmin }
          assert:
            - "score response: RaceSession.${sess}.status == SCORED in the same response"
            - "immediately after: EventEntry.${en_a}.event_points == 25 (no lag, no reconciliation job)"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_event_registration_closed_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_REGISTRATION_CLOSED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / entry_requires_event_registration_open
          rationale: "Asserted as the failure leg and success leg of the named §1.8 instance; also the winning error in entry_closed_registration_shadows_class_mismatch."
      - name: error_booking_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BOOKING_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / kart_half_open_window_overlap
          rationale: "Asserted as the rejection of the overlapping window in the named §1.8 instance (and as the winning error in booking_overlap_shadows_track_capacity)."
      - name: error_track_capacity_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_TRACK_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / track_aggregate_capacity_window
          rationale: "Asserted as the 5th-booking rejection in the named §1.8 instance."
      - name: error_open_incidents_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_INCIDENTS]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / event_finalize_blocked_by_open_incident
          rationale: "Asserted as the first finalize rejection in the named §1.8 instance."
      - name: error_class_mismatch_standalone
        claim_type: violation_to_error
        grounds: ["errors[ERR_CLASS_MISMATCH]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / entry_closed_registration_shadows_class_mismatch
          rationale: "The shadowed leg uses the same violation; the standalone positive-boundary/negative pair for age eligibility is covered by calculations corner class_age_boundary_inclusive."
