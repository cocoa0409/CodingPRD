      - name: field_read_projects_every_derived_quantity_without_mutating_anything
        claim_type: computed_read
        grounds:
          - endpoints[GET /storage-fields/{id}]
          - entities.StorageField.fields.inventory_pct
          - entities.StorageField.fields.deliverability_tier
          - entities.StorageField.fields.wells_in_service_count
          - entities.StorageField.fields.scheduled_run_count
        distinguishing_aspect: |
          A single GET has to project eight derived quantities that live nowhere in the create payload —
          max_working_gas_dth, inventory_pct, current_pressure_psig, deliverability_tier, both rates,
          field_posture, wells_in_service_count and scheduled_run_count — and it must do so without
          bumping `version`: three consecutive reads by three different roles (including the Shipper,
          who holds no contract on the field and has no field-write capability at all) return
          byte-identical rows.
        test_recipe:
          setup:
            - "Field F_MINI with two wells (MINI-1 IN_SERVICE, MINI-OBS an OBSERVATION well) and one compressor unit U-1 holding one SCHEDULED run."
            - "One shipper NORTHLINE registered so the Shipper-role read has a real principal; it holds no contract on the field."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-OBS", well_type: "OBSERVATION", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { wo: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-10T00:00:00Z", window_end_at: "2026-08-10T08:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { v1: $.data.version }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: IntegrityEngineer
              captures: { v2: $.data.version }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { v3: $.data.version }
            - call: "GET /compressor-units/${u1}"
              payload: {}
              as: FieldOperator
          assert:
            - "every read returns max_working_gas_dth == 500000, working_gas_inventory_dth == 250000, inventory_pct == 50.00, current_pressure_psig == 1500"
            - "deliverability_tier == TIER_3 with max_withdrawal_rate_dth_per_day == 150000 and max_injection_rate_dth_per_day == 150000"
            - "field_posture == OPEN, wells_in_service_count == 1 (the OBSERVATION well does not count) and scheduled_run_count == 1"
            - "retained_fuel_pool_dth == 0.000, fuel_gas_used_dth == 0.000 and opening_working_gas_dth == 250000"
            - "${v1} == ${v2} == ${v3} — reads never bump the version, and the Shipper read is admitted with no ownership relationship to the field"
            - "CompressorUnit.${u1}.scheduled_run_count == 1, status == COMMITTED and lifetime_fuel_dth == 0.00"

      - name: emergency_advance_requires_different_inputs_per_target_status
        claim_type: conditional_action
        grounds:
          - endpoints[POST /emergency-events/{id}/advance]
          - validations.priority_16_ERR_EVACUATION_RADIUS_INVALID
          - state_machines.EmergencyEvent.transitions.RESPONDING_to_EVACUATION_ORDERED
          - global_constants.MAX_EVACUATION_RADIUS_M
        distinguishing_aspect: |
          One action endpoint takes a `to_status` discriminator and its optional inputs are required or
          forbidden depending on that value: advancing to RESPONDING succeeds with responder_notes and
          no radius, advancing to EVACUATION_ORDERED without evacuation_radius_m is refused, and the
          same radius that is mandatory on the evacuation edge is simply ignored on the containment
          edge — so the endpoint cannot be implemented with a single flat required-field list.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1; a CRITICAL LEAK EmergencyEvent E1 detected at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /emergency-events"
              payload: { storage_field_id: "${f1}", event_type: "LEAK", severity: "CRITICAL", detected_at: "2026-08-01T00:00:00Z", well_id: "${w1}" }
              as: FieldOperator
              captures: { ev1: $.data.id }
          trigger:
            - call: "POST /emergency-events/${ev1}/advance"
              payload: { to_status: "RESPONDING", responder_notes: "Crew dispatched" }
              as: FieldOperator
            - call: "POST /emergency-events/${ev1}/advance"
              payload: { to_status: "EVACUATION_ORDERED" }
              as: FieldOperator
              captures: { e1: $.data.error_id }
            - call: "POST /emergency-events/${ev1}/advance"
              payload: { to_status: "EVACUATION_ORDERED", evacuation_radius_m: 2500 }
              as: FieldOperator
            - call: "POST /emergency-events/${ev1}/advance"
              payload: { to_status: "CONTAINED", responder_notes: "Well killed and vented", evacuation_radius_m: 4000 }
              as: FieldOperator
            - call: "GET /emergency-events/${ev1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-a"
          assert:
            - "the RESPONDING advance returns HTTP 200 with status RESPONDING, responder_notes stored and evacuation_radius_m still null"
            - "${e1} == ERR_EVACUATION_RADIUS_INVALID with HTTP 422 and the event still RESPONDING"
            - "the second attempt with evacuation_radius_m 2500 returns HTTP 200 with status EVACUATION_ORDERED and evacuation_radius_m == 2500"
            - "the CONTAINED advance returns HTTP 200 with contained_at == 2026-08-01T00:00:00Z and evacuation_radius_m STILL 2500 — the radius supplied on this edge is ignored, not stored"
            - "StorageField.${f1}.field_posture returns to OPEN once the event is CONTAINED, with wells_in_service_count == 1"
            - "the event carries well_id == ${w1} and severity CRITICAL throughout"

  # =========================================================================
  # ERRORS
  # =========================================================================
  - section: errors
    instances:

      - name: eight_remaining_lookup_codes_are_each_reachable_and_not_found_is_never_generic
        claim_type: error_triggerable
        grounds:
          - validations.priority_4_ERR_STORAGE_FIELD_NOT_FOUND
          - validations.priority_5_ERR_CONTRACT_NOT_FOUND
          - errors.ERR_MIT_NOT_FOUND
          - errors.ERR_REMEDIATION_PROGRAM_NOT_FOUND
          - errors.ERR_COMPRESSOR_UNIT_NOT_FOUND
          - errors.ERR_COMPRESSOR_RUN_NOT_FOUND
          - errors.ERR_SHIPPER_NOT_FOUND
          - errors.ERR_TICKET_NOT_FOUND
          - errors.ERR_EMERGENCY_EVENT_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
        distinguishing_aspect: |
          Priority 4 maps the path resource TYPE to a distinct code, so a single shared
          ERR_NOT_FOUND — or reusing ERR_STORAGE_FIELD_NOT_FOUND everywhere — passes a naive
          implementation. This instance closes the catalog by hitting the eight lookup codes that no
          other instance in either design file reaches, and it does so on a populated database (so the
          404 is genuinely a per-id miss, not an empty-table artefact) and with a body-FK miss on
          POST /storage-contracts to show priority 5 reuses the same per-type mapping.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1, one compressor unit U-1 and one shipper NORTHLINE all successfully created, so every table involved holds at least one row."
            - "The literal id 00000000-0000-4000-8000-000000000000 is used as the absent id everywhere; it is a well-formed uuid so priority 3 cannot claim it."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
          trigger:
            - call: "GET /mechanical-integrity-tests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntegrityEngineer
              captures: { e1: $.data.error_id }
            - call: "POST /remediation-programs/00000000-0000-4000-8000-000000000000/complete"
              payload: { verification_notes: "n/a" }
              as: IntegrityEngineer
              as_user_id: "eng-b"
              captures: { e2: $.data.error_id }
            - call: "GET /compressor-units/00000000-0000-4000-8000-000000000000/runs"
              payload: { limit: 100 }
              as: FieldOperator
              captures: { e3: $.data.error_id }
            - call: "POST /compressor-runs/00000000-0000-4000-8000-000000000000/complete"
              payload: {}
              as: FieldOperator
              captures: { e4: $.data.error_id }
            - call: "GET /shippers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchedulingCoordinator
              captures: { e5: $.data.error_id }
            - call: "GET /gas-movement-tickets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FieldOperator
              captures: { e6: $.data.error_id }
            - call: "POST /emergency-events/00000000-0000-4000-8000-000000000000/advance"
              payload: { to_status: "RESPONDING", responder_notes: "n/a" }
              as: FieldOperator
              captures: { e7: $.data.error_id }
            - call: "POST /regulatory-reports/00000000-0000-4000-8000-000000000000/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-b"
              captures: { e8: $.data.error_id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "00000000-0000-4000-8000-000000000000", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { e9: $.data.error_id }
          assert:
            - "${e1} == ERR_MIT_NOT_FOUND with HTTP 404"
            - "${e2} == ERR_REMEDIATION_PROGRAM_NOT_FOUND with HTTP 404 — the missing program is reported before the segregation-of-duties check at priority 26"
            - "${e3} == ERR_COMPRESSOR_UNIT_NOT_FOUND with HTTP 404 — a sub-resource listing on an absent parent is a 404, not an empty 200 list"
            - "${e4} == ERR_COMPRESSOR_RUN_NOT_FOUND with HTTP 404"
            - "${e5} == ERR_SHIPPER_NOT_FOUND with HTTP 404"
            - "${e6} == ERR_TICKET_NOT_FOUND with HTTP 404"
            - "${e7} == ERR_EMERGENCY_EVENT_NOT_FOUND with HTTP 404 — reported ahead of the priority-16 radius check"
            - "${e8} == ERR_REPORT_NOT_FOUND with HTTP 404"
            - "${e9} == ERR_SHIPPER_NOT_FOUND with HTTP 404 — priority 5 uses the same per-type mapping for a body FK, and it fires on shipper_id because that key precedes storage_field_id in the endpoint's input order"
            - "every one of the nine responses carries meta.api_request_id and meta.api_request_timestamp with response_type object and data.message present alongside data.error_id"
            - "no StorageContract row was created by the last call: GET /storage-contracts returns total_count == 0"

      - name: missing_x_user_headers_or_an_unknown_role_is_unauthenticated_before_any_other_check
        claim_type: error_triggerable
        grounds:
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_UNAUTHORIZED
          - errors.ERR_UNAUTHENTICATED
          - response_envelope.error_shape
        distinguishing_aspect: |
          Priority 1 has three independent triggers that are easy to collapse into one: an absent
          X-User-Role, an absent-or-empty X-User-ID, and an X-User-Role string that is syntactically
          fine but names no role in §1.7. All three must yield 401 rather than 403, and they must win
          against a request that would ALSO have failed on role (Shipper on a FieldOperator endpoint),
          on shape (a create payload missing required fields) and on lookup (an absent path id) —
          which is what separates a real header gate from an authorisation check that happens to run
          first for authenticated users.
        test_recipe:
          setup:
            - "Field F_MINI exists so the well-create endpoint has a valid parent, but the unauthenticated calls never reach it."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
          trigger:
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: NONE
              captures: { e1: $.data.error_id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              as_user_id: ""
              captures: { e2: $.data.error_id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: ReservoirEngineer
              as_user_id: "eng-a"
              captures: { e3: $.data.error_id }
            - call: "POST /wells"
              payload: { well_name: "GHOST-1" }
              as: NONE
              captures: { e4: $.data.error_id }
            - call: "GET /mechanical-integrity-tests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NONE
              captures: { e5: $.data.error_id }
            - call: "POST /storage-fields/${f1}/season"
              payload: { season: "WITHDRAWAL" }
              as: Shipper
              as_user_id: ""
              captures: { e6: $.data.error_id }
          assert:
            - "`as: NONE` means the request is sent with NO X-User-Role and NO X-User-ID header at all; `as_user_id: \"\"` means X-User-Role is sent but X-User-ID is the empty string (not whitespace, not omitted)"
            - "${e1} == ERR_UNAUTHENTICATED with HTTP 401 on an endpoint whose roles list is otherwise the widest in the API"
            - "${e2} == ERR_UNAUTHENTICATED with HTTP 401 — a present role with an empty X-User-ID is still unauthenticated"
            - "${e3} == ERR_UNAUTHENTICATED with HTTP 401, NOT ERR_UNAUTHORIZED 403: ReservoirEngineer is not a role declared in §1.7, so it fails the header gate rather than the authorisation gate"
            - "${e4} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_INVALID_REQUEST 400, even though the payload is missing storage_field_id, well_type, rated_rate_dth_per_day and last_mit_passed_at"
            - "${e5} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_MIT_NOT_FOUND 404 — priority 1 outranks priority 4"
            - "${e6} == ERR_UNAUTHENTICATED with HTTP 401, not ERR_UNAUTHORIZED 403 — the empty id is caught before the fact that Shipper may not flip a season"
            - "StorageField.${f1}.season is still INJECTION and version is unchanged after all six refusals"

      - name: three_action_endpoints_report_their_own_invalid_state_code_on_a_terminal_row
        claim_type: error_triggerable
        grounds:
          - validations.priority_7_ERR_INVALID_TICKET_STATE
          - errors.ERR_INVALID_MIT_STATE
          - errors.ERR_INVALID_REMEDIATION_STATE
          - errors.ERR_INVALID_RUN_STATE
          - state_machines.MechanicalIntegrityTest.terminal_states
          - state_machines.RemediationProgram.terminal_states
          - state_machines.CompressorRun.terminal_states
        distinguishing_aspect: |
          Priority 7 is one rule with a per-entity code table, and these three codes are the ones no
          other instance reaches. Each is provoked by replaying a transition that already ran on a row
          that is now terminal — record-result on a PASSED test, complete on a COMPLETED program,
          complete on a COMPLETED run — so the second call is refused for state reasons even though
          every temporal precondition it also has (clock past scheduled_end_at / window_end_at) is
          satisfied, and no side effect is applied twice.
        test_recipe:
          setup:
            - "Field F_MINI with two wells MINI-1 and MINI-2 and one compressor unit U-1."
            - "MIT T1 on MINI-1 scheduled 2026-08-02T00:00:00Z..2026-08-02T06:00:00Z, recorded PASS by eng-a at clock 2026-08-02T06:00:00Z."
            - "MIT T2 on MINI-2 scheduled the same window, recorded FAIL by eng-a, which opens RemediationProgram P1 on MINI-2; P1 is completed by eng-b (a different user, so priority 26 is satisfied)."
            - "Run R1 on U-1 over 2026-08-02T00:00:00Z..2026-08-02T04:00:00Z, completed at clock 2026-08-02T06:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w2: $.data.id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "CASING_PRESSURE", scheduled_start_at: "2026-08-02T00:00:00Z", scheduled_end_at: "2026-08-02T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { t1: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w2}", test_type: "CASING_PRESSURE", scheduled_start_at: "2026-08-02T00:00:00Z", scheduled_end_at: "2026-08-02T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { t2: $.data.id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "${u1}", window_start_at: "2026-08-02T00:00:00Z", window_end_at: "2026-08-02T04:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: FieldOperator
              captures: { r1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "POST /mechanical-integrity-tests/${t1}/record-result"
              payload: { outcome: "PASS", result_pressure_psig: 1200 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "POST /mechanical-integrity-tests/${t2}/record-result"
              payload: { outcome: "FAIL", result_pressure_psig: 2400 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "GET /remediation-programs"
              payload: { well_id: "${w2}", limit: 100 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { p1: "$.data[0].id" }
            - call: "POST /remediation-programs/${p1}/complete"
              payload: { verification_notes: "Packer replaced and retested" }
              as: IntegrityEngineer
              as_user_id: "eng-b"
            - call: "POST /compressor-runs/${r1}/complete"
              payload: {}
              as: FieldOperator
          trigger:
            - call: "POST /mechanical-integrity-tests/${t1}/record-result"
              payload: { outcome: "FAIL", result_pressure_psig: 2900 }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e1: $.data.error_id }
            - call: "POST /remediation-programs/${p1}/complete"
              payload: { verification_notes: "Second sign-off" }
              as: IntegrityEngineer
              as_user_id: "eng-b"
              captures: { e2: $.data.error_id }
            - call: "POST /compressor-runs/${r1}/complete"
              payload: {}
              as: FieldOperator
              captures: { e3: $.data.error_id }
            - call: "GET /wells/${w1}"
              payload: {}
              as: IntegrityEngineer
              as_user_id: "eng-a"
            - call: "GET /compressor-units/${u1}"
              payload: {}
              as: FieldOperator
          assert:
            - "${e1} == ERR_INVALID_MIT_STATE with HTTP 409 — T1 is PASSED, a terminal state, and the replayed FAIL never runs"
            - "${e2} == ERR_INVALID_REMEDIATION_STATE with HTTP 409 — P1 is COMPLETED, so priority 7 fires ahead of the priority-26 SoD check that eng-b would have passed anyway"
            - "${e3} == ERR_INVALID_RUN_STATE with HTTP 409 — R1 is COMPLETED even though the clock is still past window_end_at, so the temporal precondition alone cannot explain the refusal"
            - "Well.${w1}.integrity_state is still MIT_CURRENT and shut_in_reason is null: the refused FAIL did not shut the well in and opened no RemediationProgram"
            - "GET /remediation-programs?well_id=${w1} returns total_count == 0, and RemediationProgram.${p1}.completed_by_user_id is still eng-b with a single completed_at"
            - "CompressorUnit.${u1}.lifetime_fuel_dth == 110.40 and scheduled_run_count == 0 with status AVAILABLE — the fuel was drawn exactly once, and StorageField.${f1}.fuel_gas_used_dth == 110.40 with working_gas_inventory_dth == 249889.600"

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:

      - name: all_five_roles_can_run_their_own_exclusive_operations_end_to_end
        claim_type: exclusive_operations_allowed
        grounds:
          - roles.FieldOperator.exclusive_operations
          - roles.IntegrityEngineer.exclusive_operations
          - roles.SchedulingCoordinator.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.Shipper.exclusive_operations
          - roles.FieldOperator.shared_operations
        distinguishing_aspect: |
          The five roles form a chain rather than a hierarchy — no role is a superset of another — so a
          single storage cycle can only be driven by handing control back and forth: FieldOperator
          registers the reservoir and the well, IntegrityEngineer books the integrity test,
          SchedulingCoordinator onboards the shipper and writes the contract, the Shipper files and
          submits the nomination, SchedulingCoordinator confirms it, FieldOperator meters the gas and
          ComplianceOfficer prepares the report. This instance proves every exclusive operation is
          reachable by its owner, and that the two shared writes (emergency-event create and the clock)
          work from more than one role.
        test_recipe:
          setup:
            - "Empty database, logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-1", rated_horsepower: 6000, derate_factor: 0.00 }
              as: FieldOperator
              captures: { u1: $.data.id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "CASING_PRESSURE", scheduled_start_at: "2026-08-20T00:00:00Z", scheduled_end_at: "2026-08-20T06:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { t1: $.data.id }
            - call: "POST /shippers"
              payload: { legal_name: "Northline Gas Marketing", duns_number: "123456789", penalty_threshold_usd: 500000.00 }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /storage-contracts"
              payload: { shipper_id: "${s1}", storage_field_id: "${f1}", contract_code: "CN-1", service_class: "FIRM", max_storage_quantity_dth: 1000000, max_daily_injection_dth: 100000, max_daily_withdrawal_dth: 100000, term_start_date: "2026-08-01", term_end_date: "2026-12-31", commodity_rate_usd_per_dth: 0.0450, index_price_usd_per_dth: 3.4500, cash_out_method: "MONTHLY_AGGREGATE" }
              as: SchedulingCoordinator
              captures: { c1: $.data.id }
            - call: "POST /storage-contracts/${c1}/activate"
              payload: {}
              as: SchedulingCoordinator
            - call: "GET /storage-contracts/${c1}"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
              captures: { cv1: $.data.version }
            - call: "POST /nominations"
              payload: { contract_id: "${c1}", gas_day: "2026-08-02", direction: "INJECTION", nominated_volume_dth: 80000, expected_contract_version: "${cv1}" }
              as: Shipper
              as_user_id: "${s1}"
              captures: { n1: $.data.id }
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
              as_user_id: "${s1}"
            - call: "POST /nominations/${n1}/confirm"
              payload: {}
              as: SchedulingCoordinator
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "${n1}", well_id: "${w1}", actual_volume_dth: 80000 }
              as: FieldOperator
              captures: { g1: $.data.id }
            - call: "POST /regulatory-reports"
              payload: { storage_field_id: "${f1}", report_type: "INVENTORY_VERIFICATION", period_start_date: "2026-08-01", period_end_date: "2026-08-31", measured_inventory_dth: 250000 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { rp1: $.data.id }
            - call: "POST /emergency-events"
              payload: { storage_field_id: "${f1}", event_type: "PRESSURE_ANOMALY", severity: "MINOR", detected_at: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { ev1: $.data.id }
            - call: "POST /emergency-events"
              payload: { storage_field_id: "${f1}", event_type: "LEAK", severity: "MINOR", detected_at: "2026-08-01T00:00:00Z", well_id: "${w1}" }
              as: FieldOperator
              captures: { ev2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
          assert:
            - "every call returns HTTP 200/201 — no 403 appears anywhere in the chain"
            - "MechanicalIntegrityTest.${t1}.status == SCHEDULED with recorded_by_user_id null (booking does not record a result)"
            - "StorageContract.${c1}.status == ACTIVE and version == ${cv1} after activation, so the Shipper's OCC token is the post-activation value"
            - "Nomination.${n1}.status == CONFIRMED with confirmed_volume_dth == 80000 and curtailed_volume_dth == 0"
            - "GasMovementTicket.${g1}.status == PENDING with every charge and volume field (fuel_retention_dth, net_volume_dth, commodity_charge_usd, volume_discount_usd, fuel_charge_usd, total_charge_usd, confirmed_at) still null and StorageField.${f1}.working_gas_inventory_dth still 250000 — metering does not move gas"
            - "RegulatoryReport.${rp1}.status == DRAFT with prepared_by_user_id == officer-a, book_inventory_dth == 250000.000 and variance_pct == 0.0000"
            - "both EmergencyEvents are created with status DETECTED — POST /emergency-events is shared, so FieldOperator and ComplianceOfficer both succeed, and neither MINOR event changes StorageField.${f1}.field_posture from OPEN"
            - "the clock write succeeds from ComplianceOfficer, confirming POST /_clock/set_current_utc is shared by all four operator roles"

      - name: operational_and_integrity_exclusives_are_rejected_for_every_other_role
        claim_type: other_role_rejected
        grounds:
          - roles.FieldOperator.exclusive_operations
          - roles.IntegrityEngineer.exclusive_operations
          - validations.priority_2_ERR_UNAUTHORIZED
          - validations.priority_4_ERR_STORAGE_FIELD_NOT_FOUND
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          Priority 2 sits above the priority-4 path lookup, so every one of these refusals is a 403
          even when the path id is a well-formed uuid that resolves to nothing and the body is missing
          required fields — which is the only way to distinguish an authorisation gate that runs first
          from one bolted on after the resource is loaded. The pairs are also chosen so that the
          "closest" role is refused: IntegrityEngineer, who owns wellbore integrity, still may not
          change a well's service state, and FieldOperator, who owns the well, still may not record its
          integrity result.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1 exists so the refusals are not confused with an empty database; the sentinel id 00000000-0000-4000-8000-000000000000 stands in for resources that were never created."
          setup_api_calls:
            - call: "POST /storage-fields"
              payload: { name: "Cavern Mini", field_code: "F-MINI", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, season: "INJECTION", opening_working_gas_dth: 250000, deliverability_method: "CURVE_INTERPOLATED", deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: FieldOperator
              captures: { f1: $.data.id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-1", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: FieldOperator
              captures: { w1: $.data.id }
            - call: "GET /storage-fields/${f1}"
              payload: {}
              as: FieldOperator
              captures: { fv1: $.data.version }
          trigger:
            - call: "POST /storage-fields"
              payload: { name: "Rogue Cavern", field_code: "F-ROGUE", total_capacity_dth: 1000000, cushion_gas_dth: 500000, base_pressure_psig: 800, pressure_span_psig: 1400, max_pressure_psig: 3000, deliverability_curve: [{ inventory_pct: 0, withdrawal_dth_per_day: 0, injection_dth_per_day: 300000 }, { inventory_pct: 100, withdrawal_dth_per_day: 300000, injection_dth_per_day: 0 }] }
              as: SchedulingCoordinator
              captures: { e1: $.data.error_id }
            - call: "POST /storage-fields/${f1}/season"
              payload: { season: "WITHDRAWAL" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { e2: $.data.error_id }
            - call: "POST /wells"
              payload: { storage_field_id: "${f1}", well_name: "MINI-2", well_type: "INJECTION_WITHDRAWAL", rated_rate_dth_per_day: 600000, last_mit_passed_at: "2026-06-01T00:00:00Z" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e3: $.data.error_id }
            - call: "POST /wells/${w1}/service-change"
              payload: { to_operational_state: "SHUT_IN", reason: "Integrity concern" }
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e4: $.data.error_id }
            - call: "POST /compressor-units"
              payload: { storage_field_id: "${f1}", unit_code: "U-9", rated_horsepower: 6000 }
              as: SchedulingCoordinator
              captures: { e5: $.data.error_id }
            - call: "POST /compressor-runs"
              payload: { compressor_unit_id: "00000000-0000-4000-8000-000000000000", window_start_at: "2026-08-10T00:00:00Z", window_end_at: "2026-08-10T08:00:00Z", allocated_horsepower: 3000, mode: "INJECTION" }
              as: SchedulingCoordinator
              captures: { e6: $.data.error_id }
            - call: "POST /compressor-runs/00000000-0000-4000-8000-000000000000/complete"
              payload: {}
              as: IntegrityEngineer
              as_user_id: "eng-a"
              captures: { e7: $.data.error_id }
            - call: "POST /gas-movement-tickets"
              payload: { nomination_id: "00000000-0000-4000-8000-000000000000", well_id: "${w1}", actual_volume_dth: 1000 }
              as: SchedulingCoordinator
              captures: { e8: $.data.error_id }
            - call: "POST /gas-movement-tickets/00000000-0000-4000-8000-000000000000/confirm"
              payload: { expected_storage_field_version: "${fv1}" }
              as: Shipper
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e9: $.data.error_id }
            - call: "POST /gas-movement-tickets/00000000-0000-4000-8000-000000000000/reverse"
              payload: { reversal_reason: "Rogue reversal" }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { e10: $.data.error_id }
            - call: "POST /mechanical-integrity-tests"
              payload: { well_id: "${w1}", test_type: "CASING_PRESSURE", scheduled_start_at: "2026-08-20T00:00:00Z", scheduled_end_at: "2026-08-20T06:00:00Z" }
              as: FieldOperator
              captures: { e11: $.data.error_id }
            - call: "POST /mechanical-integrity-tests/00000000-0000-4000-8000-000000000000/record-result"
              payload: { outcome: "PASS", result_pressure_psig: 1200 }
              as: ComplianceOfficer
              as_user_id: "officer-a"
              captures: { e12: $.data.error_id }
            - call: "POST /remediation-programs/00000000-0000-4000-8000-000000000000/complete"
              payload: { verification_notes: "Signed off" }
              as: FieldOperator
              captures: { e13: $.data.error_id }
          assert:
            - "${e1} through ${e13} are all ERR_UNAUTHORIZED with HTTP 403"
            - "${e6}, ${e7}, ${e9}, ${e10}, ${e12} and ${e13} are 403 rather than the 404 their sentinel path/body ids would otherwise earn — priority 2 outranks priorities 4 and 5"
            - "${e1} is 403 rather than ERR_INVALID_REQUEST 400 even though the payload omits the optional-but-defaulted season and opening_working_gas_dth legitimately, and ${e5} is 403 rather than 400 for the omitted derate_factor"
            - "${e9} is ERR_UNAUTHORIZED, not ERR_CONTRACT_NOT_OWNED: the Shipper role is not on the confirm endpoint at all, so priority 2 fires before the priority-6 ownership narrowing"
            - "no state changed: GET /storage-fields returns the single field ${f1} with season INJECTION and version ${fv1}, Well.${w1}.operational_state == IN_SERVICE, GET /compressor-units total_count == 0, GET /mechanical-integrity-tests total_count == 0"

      - name: commercial_and_compliance_exclusives_are_rejected_for_every_other_role
        claim_type: other_role_rejected
        grounds:
          - roles.SchedulingCoordinator.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - roles.Shipper.exclusive_operations
          - validations.priority_2_ERR_UNAUTHORIZED
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          The commercial and compliance halves of the API are the ones most likely to be collapsed into
          a single "back office" permission, so this instance refuses each one from its nearest
          neighbour: the Shipper may not confirm the nomination it just filed, the SchedulingCoordinator
          may not file a nomination on its own customer's behalf, and the ComplianceOfficer — who reads
          every contract — may not write one or settle a cash-out. It also pins the direction of the
          Shipper boundary: the nomination-create and nomination-submit pair is exclusive to the
          Shipper, so the coordinator's refusal is a 403 and not a "helpful" delegation.
        test_recipe:
          setup:
            - "Field F_MINI, shipper NORTHLINE, one ACTIVE FIRM contract CN-1 and one DRAFT Nomination N1 on gas day 2026-08-02 filed by the shipper."
          setup_api_calls:
            - call: "POST /storage-fields"
