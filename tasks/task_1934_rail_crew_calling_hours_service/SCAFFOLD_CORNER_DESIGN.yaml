        distinguishing_aspect: "Selector predicate is fatigue_score < 80.0 (strict): exactly 80.0 excludes, 79.9 admits."
        excluded_because:
          difficulty_instance: combinatorial_formula / fatigue_weighted_scoring_multifactor
          rationale: "The fatigue formula's correctness and its gate wiring are exercised there; the exact 80.0 boundary requires staging five DISTURBED rests plus a five-day streak (5+ full duty cycles), so the strict-< boundary semantics are pinned here as a documentation stub."

