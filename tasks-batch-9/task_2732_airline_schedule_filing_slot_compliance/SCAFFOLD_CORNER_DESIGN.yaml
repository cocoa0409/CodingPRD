      - name: a_reaccommodation_notice_cannot_go_out_by_sms_and_cannot_be_dispatched_twice
        claim_type: violation_to_error
        grounds:
          - "validations.priority_47_ERR_NOTIFICATION_CHANNEL_INSUFFICIENT"
          - "validations.priority_40_ERR_NOTIFICATION_STATE_INVALID"
          - endpoints.POST_notification_obligations_notification_obligation_id_dispatch
        distinguishing_aspect: |
          A MANDATORY_REACCOMMODATION obligation refuses channel SMS with
          ERR_NOTIFICATION_CHANNEL_INSUFFICIENT (422) but accepts EMAIL, and once DISPATCHED a second
          dispatch on any channel is ERR_NOTIFICATION_STATE_INVALID (409) — proving the channel rule is
          tier-conditional and the dispatch is single-shot. The rejected SMS attempt must not decrement
          FlightLeg.open_obligation_count.
        test_recipe:
          setup:
            - "Home carrier HX; MUC and TXL LEVEL_2_FACILITATED; Season W26 OPEN; ScheduleVersion W26-D1 with one MUC->TXL leg on 2026-11-03 08:00Z->09:00Z."
            - "The leg carries booked_first 0, booked_business 0, booked_economy 10."
            - "One obligation raised by hand with trigger_kind RETIME and change_magnitude_minutes 180, so obligation_tier is MANDATORY_REACCOMMODATION, compensation_cents 251240 and notify_deadline_utc 2026-08-04T00:00:00Z; the clock stays at 2026-08-01T00:00:00Z so the dispatch is not late."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
