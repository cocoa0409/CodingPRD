              as: AdmissionsDirector
              captures: { usk: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Tim B", date_of_birth: "1927-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uind}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/bed-reservations"
              payload: { residency_id: "${rid}", unit_id: "${usk}", hold_expiry_period: 3 }
              as: CareCoordinator
              captures: { brid: $.data.id }
            - call: "POST /ccrc/communities/${cid}/clock/advance"
              payload: { by_periods: 3 }
              as: FinanceOfficer
          trigger:
            - call: "POST /ccrc/bed-reservations/${brid}/occupy"
              payload: {}
              as: CareCoordinator
              captures: { br_status: $.data.status }
          assert:
            - "BedReservation.status == OCCUPIED (occupied at period 3 == hold_expiry_period 3; <= passes)"
            - "Unit ${usk}.status == OCCUPIED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: care_apply_requires_residency_active
        grounds:
          - state_machines.CareTransition.PROPOSED_to_APPLIED
          - entities.Residency.fields.status
          - errors[ERR_RESIDENCY_NOT_ACTIVE]
        distinguishing_aspect: |
          CareTransition→Residency dependency: applying a PROPOSED care transition is rejected with
          ERR_RESIDENCY_NOT_ACTIVE when the parent Residency is RESERVED (not yet activated). The
          transition's validity depends on a different entity's state.
        test_recipe:
          setup:
            - "Community c; residency in RESERVED (assigned a unit but NOT activated); a care transition PROPOSED against it."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Holly", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "H Plan", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "H1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Hugh R", date_of_birth: "1926-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/care-transitions"
              payload: { residency_id: "${rid}", to_level: "ASSISTED" }
              as: CareCoordinator
              captures: { ctid: $.data.id }
          trigger:
            - call: "POST /ccrc/care-transitions/${ctid}/apply"
              payload: {}
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RESIDENCY_NOT_ACTIVE (CareTransition apply gated on Residency.status)"

      - name: waitlist_place_requires_residency_waitlisted_and_unit_available
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_PLACED
          - entities.Residency.fields.status
          - entities.Unit.fields.status
          - errors[ERR_UNIT_NOT_AVAILABLE]
        distinguishing_aspect: |
          A different entity pair (WaitlistEntry→Unit): placing the head waitlist entry is rejected
          with ERR_UNIT_NOT_AVAILABLE when the target INDEPENDENT unit is already OCCUPIED by a prior
          assignment — the place transition depends on Unit state, not on the Residency-state pair
          exercised in instance 1.
        test_recipe:
          setup:
            - "Community c; residency r1 WAITLISTED rank 1 for INDEPENDENT; the only INDEPENDENT unit already OCCUPIED by a different RESERVED residency r2."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Juniper", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "J Plan", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "J1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Jo One", date_of_birth: "1925-01-01" }
              as: AdmissionsDirector
              captures: { res1: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Jo Two", date_of_birth: "1924-01-01" }
              as: AdmissionsDirector
              captures: { res2: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res1}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r1: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res2}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r2: $.data.id }
            - call: "POST /ccrc/residencies/${r2}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/waitlist-entries"
              payload: { community_id: "${cid}", residency_id: "${r1}", target_care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /ccrc/waitlist-entries/${w1}/place"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNIT_NOT_AVAILABLE (place gated on Unit.status == AVAILABLE)"
            - "Residency ${r1}.status still WAITLISTED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: skilled_bed_capacity_blocks_second_concurrent_hold
        grounds:
          - validations[priority=13]
          - entities.Unit.fields.bed_capacity
          - errors[ERR_BED_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the SKILLED health-center bed pool: a unit with
          bed_capacity=1 already carrying one HELD reservation rejects a second concurrent HELD
          reservation with ERR_BED_CAPACITY_EXCEEDED — committed (HELD+OCCUPIED) holds counted against
          capacity.
        test_recipe:
          setup:
            - "Community c; two ACTIVE residencies; a SKILLED unit bed_capacity=1 with one HELD reservation for the first residency."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "BedTown", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "B Plan", contract_type: "TYPE_A", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "BI1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { ui1: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "BI2", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { ui2: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "BSK", care_level: "SKILLED", bed_capacity: 1 }
              as: AdmissionsDirector
              captures: { usk: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Bea 1", date_of_birth: "1923-01-01" }
              as: AdmissionsDirector
              captures: { res1: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Bea 2", date_of_birth: "1922-01-01" }
              as: AdmissionsDirector
              captures: { res2: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res1}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r1: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res2}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r2: $.data.id }
            - call: "POST /ccrc/residencies/${r1}/assign-unit"
              payload: { unit_id: "${ui1}" }
              as: AdmissionsDirector
              captures: { r1v: $.data.version }
            - call: "POST /ccrc/residencies/${r2}/assign-unit"
              payload: { unit_id: "${ui2}" }
              as: AdmissionsDirector
              captures: { r2v: $.data.version }
            - call: "POST /ccrc/residencies/${r1}/activate"
              payload: { expected_residency_version: "${r1v}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/residencies/${r2}/activate"
              payload: { expected_residency_version: "${r2v}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/bed-reservations"
              payload: { residency_id: "${r1}", unit_id: "${usk}", hold_expiry_period: 10 }
              as: CareCoordinator
              captures: { br1: $.data.id }
          trigger:
            - call: "POST /ccrc/bed-reservations"
              payload: { residency_id: "${r2}", unit_id: "${usk}", hold_expiry_period: 10 }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BED_CAPACITY_EXCEEDED (capacity 1 already committed by one HELD hold)"

      - name: independent_unit_single_occupancy_blocks_second_assignment
        grounds:
          - state_machines.Residency.DEPOSIT_HELD_to_RESERVED
          - entities.Unit.fields.status
          - errors[ERR_UNIT_NOT_AVAILABLE]
        distinguishing_aspect: |
          Single-slot mutual-exclusion semantics on the INDEPENDENT unit pool — a different resource
          pool with a different interval treatment (capacity-1 point occupancy, no time window). An
          INDEPENDENT unit already OCCUPIED by one residency rejects a second assign-unit with
          ERR_UNIT_NOT_AVAILABLE, contrasting the N-slot aggregate-capacity arithmetic of instance 1.
        test_recipe:
          setup:
            - "Community c; one INDEPENDENT unit already OCCUPIED by residency r1 (RESERVED); residency r2 still DEPOSIT_HELD."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "SoloTown", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "S Plan", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "SU1", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Sol 1", date_of_birth: "1921-01-01" }
              as: AdmissionsDirector
              captures: { res1: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Sol 2", date_of_birth: "1920-01-01" }
              as: AdmissionsDirector
              captures: { res2: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res1}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r1: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${res2}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { r2: $.data.id }
            - call: "POST /ccrc/residencies/${r1}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
          trigger:
            - call: "POST /ccrc/residencies/${r2}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNIT_NOT_AVAILABLE (independent unit single-occupancy collision)"
            - "Residency ${r2}.status still DEPOSIT_HELD"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bed_occupy_then_release_conserves_available_skilled_units
        grounds:
          - state_machines.BedReservation.HELD_to_OCCUPIED
          - state_machines.BedReservation.OCCUPIED_to_RELEASED
          - entities.Unit.fields.status
        distinguishing_aspect: |
          Conserved quantity = count of SKILLED Units with status==AVAILABLE. Occupy (forward: one
          AVAILABLE skilled unit → OCCUPIED) paired with release (compensating: OCCUPIED → AVAILABLE)
          must leave that count exactly equal to its pre-occupy value, with no drift.
        test_recipe:
          setup:
            - "Community c; residency ACTIVE; one SKILLED unit AVAILABLE (so available-skilled-count == 1) with a HELD reservation for the residency."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Conserve A", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "CA Plan", contract_type: "TYPE_A", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 0 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "CAI", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uind: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "CAS", care_level: "SKILLED", bed_capacity: 1 }
              as: AdmissionsDirector
              captures: { usk: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Cal A", date_of_birth: "1919-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uind}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
            - call: "POST /ccrc/bed-reservations"
              payload: { residency_id: "${rid}", unit_id: "${usk}", hold_expiry_period: 10 }
              as: CareCoordinator
              captures: { brid: $.data.id }
          trigger:
            - call: "POST /ccrc/bed-reservations/${brid}/occupy"
              payload: {}
              as: CareCoordinator
              captures: { occ_status: $.data.status }
            - call: "POST /ccrc/bed-reservations/${brid}/release"
              payload: {}
              as: CareCoordinator
            - call: "GET /ccrc/units"
              payload: { community_id: "${cid}", care_level: "SKILLED", status: "AVAILABLE" }
              as: CareCoordinator
              captures: { avail_skilled: "$.data[0].status" }
          assert:
            - "after occupy: Unit ${usk}.status == OCCUPIED (count of AVAILABLE skilled units == 0)"
            - "after release: Unit ${usk}.status == AVAILABLE (count of AVAILABLE skilled units back to 1 — conserved, no drift)"

      - name: second_person_add_then_remove_conserves_active_occupant_count
        grounds:
          - entities.Residency.fields.has_second_person
          - entities.SecondPerson.fields.status
          - errors[ERR_SECOND_PERSON_EXISTS]
        distinguishing_aspect: |
          A different conserved quantity = the residency's ACTIVE second-occupant count (0 or 1, mirrored
          by has_second_person). Adding a second person (forward: count 0→1, has_second_person false→true)
          paired with removing it (compensating: count 1→0, true→false) returns the residency to its
          original single-occupant state with no drift.
        test_recipe:
          setup:
            - "Community c; residency ACTIVE in an INDEPENDENT unit with NO second person (has_second_person == false)."
          setup_api_calls:
            - call: "POST /ccrc/communities"
              payload: { name: "Conserve B", actuarial_discount_rate_bps: 0, reserve_assets_cents: 0 }
              as: FinanceOfficer
              captures: { cid: $.data.id }
            - call: "POST /ccrc/contract-plans"
              payload: { community_id: "${cid}", name: "CB Plan", contract_type: "TYPE_C", entrance_fee_cents: 5000000, refund_plan: "DECLINING", monthly_service_fee_cents: 300000, second_person_fee_cents: 150000 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
            - call: "POST /ccrc/units"
              payload: { community_id: "${cid}", unit_number: "CBI", care_level: "INDEPENDENT" }
              as: AdmissionsDirector
              captures: { uid: $.data.id }
            - call: "POST /ccrc/residents"
              payload: { community_id: "${cid}", full_name: "Cleo B", date_of_birth: "1918-01-01" }
              as: AdmissionsDirector
              captures: { resd: $.data.id }
            - call: "POST /ccrc/residencies"
              payload: { community_id: "${cid}", primary_resident_id: "${resd}", contract_plan_id: "${pid}" }
              as: AdmissionsDirector
              captures: { rid: $.data.id }
            - call: "POST /ccrc/residencies/${rid}/assign-unit"
              payload: { unit_id: "${uid}" }
              as: AdmissionsDirector
              captures: { rv: $.data.version }
            - call: "POST /ccrc/residencies/${rid}/activate"
              payload: { expected_residency_version: "${rv}" }
              as: AdmissionsDirector
          trigger:
            - call: "POST /ccrc/residencies/${rid}/second-persons"
              payload: { full_name: "Cleo Spouse", date_of_birth: "1919-02-02" }
              as: AdmissionsDirector
              captures: { spid: $.data.id }
            - call: "GET /ccrc/residencies/${rid}"
              payload: {}
              as: AdmissionsDirector
              captures: { has2_mid: $.data.has_second_person }
            - call: "POST /ccrc/second-persons/${spid}/remove"
              payload: {}
              as: AdmissionsDirector
            - call: "GET /ccrc/residencies/${rid}"
              payload: {}
              as: AdmissionsDirector
              captures: { has2_after: $.data.has_second_person }
          assert:
            - "after add: Residency.has_second_person == true (occupant count 1)"
            - "after remove: Residency.has_second_person == false (occupant count back to 0 — conserved)"
            - "SecondPerson ${spid}.status == REMOVED"
