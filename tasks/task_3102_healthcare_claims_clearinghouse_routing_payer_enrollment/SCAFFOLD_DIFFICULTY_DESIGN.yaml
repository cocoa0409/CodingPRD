            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYTB", display_name: "Tiered Payer", claims_lead_time_days: 1, remittance_lead_time_days: 1, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED", monthly_minimum_cents: 0 }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/payers/${pay_a}/pricing-tiers"
              payload: { applies_to: "CLAIM", volume_floor: 1, volume_ceiling: 10, rate_cents: 100 }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers/${pay_a}/pricing-tiers"
              payload: { applies_to: "CLAIM", volume_floor: 11, rate_cents: 50 }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments"
              payload: { payer_id: "${pay_a}", transaction_type: "CLAIMS_837" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { enr_c: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/enrollments/${enr_c}/submit"
              payload: {}
              as: ProviderAdmin
