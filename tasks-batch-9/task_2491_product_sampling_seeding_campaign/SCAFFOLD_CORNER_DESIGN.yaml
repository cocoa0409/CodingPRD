              as: CampaignManager
              captures: { kl1_id: $.data.id }
          assert:
            - "Both calls return HTTP status 200 and 201 respectively"
            - "the set_current_utc response carries current_utc == 2026-08-09T12:30:00Z"
            - "Campaign.${camp_id}.created_at == 2026-08-01T00:00:00Z"
            - "KitLine.${kl1_id}.created_at == 2026-08-09T12:30:00Z"
