            - call: "GET /items/${it}"
              as: IntakeOfficer
              captures: { get_status: $.data.status, get_v: $.data.version }
          assert:
            - "pub_status == \"LISTED\" and pub_v == 2 (mutation visible in the same response)"
            - "get_status == pub_status and get_v == pub_v (immediate read-after-write agreement)"
