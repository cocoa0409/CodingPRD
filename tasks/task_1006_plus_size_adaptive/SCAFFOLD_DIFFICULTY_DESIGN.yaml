              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Everyday Tee", category: "TOPS", base_price_cents: 6805, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 24, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb1: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "SIGNATURE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, sub_ver: $.data.version }
            - call: "POST /box-subscriptions/${sub_id}/shipments"
              payload: { expected_subscription_version: "${sub_ver}", item_variant_ids: ["${vb1}"] }
              as: StoreManager
              captures: { ship_id: $.data.id }
            - call: "POST /box-subscriptions/${sub_id}/status"
              payload: { to_status: "PAUSED" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /box-shipments/${ship_id}/ship"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SUBSCRIPTION_NOT_ACTIVE"
            - "BoxShipment.${ship_id}.status == CURATED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: specialist_buffered_overlap_rejected
        grounds:
          - calculations.specialist_buffer_overlap
          - state_machines.StylingAppointment.REQUESTED_to_CONFIRMED
          - entities.FitSpecialist.fields.buffer_minutes
          - errors[ERR_SPECIALIST_UNAVAILABLE]
        distinguishing_aspect: |
          FitSpecialist resource, BUFFERED single-occupancy: a new booking 11:10-11:40
          does not raw-overlap the confirmed 10:00-11:00 appointment, but falls inside
          the specialist's 15-minute buffer clearance, so CONFIRM is rejected with
          ERR_SPECIALIST_UNAVAILABLE.
        test_recipe:
          setup:
            - "Specialist with buffer_minutes 15 and a confirmed 10:00-11:00 appointment; a second customer requests 11:10-11:40 (10-minute gap)."
          setup_api_calls:
            - call: "POST /customers/register"
