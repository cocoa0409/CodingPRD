design_notes:
  reachability_audit: |
    Every validation rung and every transition side effect was walked against the
    rungs above it and the preconditions below it.

    1. Rung 9 (the standing-order write gate) sits above state, OCC and every
       business rung, so it could starve rungs 10 to 39 of reachability on the three
       gated endpoints. It does not, because the gate is scoped to
       X-User-Role == NurseInjector. Every one of those three endpoints also admits
       Physician, and a Physician-performed call skips rung 9 entirely. Every lower
       rung is therefore reachable through the Physician path even with all standing
       orders revoked. The four exclusions are enumerated on the rung itself.
    2. Rungs 21 to 25 (the five re-dose factors) only apply when procedure_type is
       REDOSE. An INITIAL procedure skips all five, which is what keeps rungs 26 to
       28 reachable for a patient with no prior insertion.
    3. Rung 23 (re-dose interval) also fires when there is no prior COMPLETED
       procedure of that hormone. Rung 21 (staleness) and rung 22 (trough window) sit
       ABOVE rung 23 and both read an anchor that does not exist in that case; the
       rule is that rungs 21 and 22 are skipped when the anchor is absent, so the
       request lands on rung 23. Without this, rung 23's no-anchor condition would be
       unreachable.
    4. Rung 26 (post-insertion restriction, 14 days, any hormone) sits above rung 23
       only in the sense of priority order - in fact rung 26 is BELOW rungs 21 to 25.
       For a same-hormone re-dose the 84-day (or 70-day) interval at rung 23 always
       subsumes the 14-day window, so rung 26 would be unreachable if it only ever
       saw re-doses. It is reachable through a CROSS-hormone INITIAL procedure: a
       patient who completed a testosterone insertion on day 0 and books an estradiol
       INITIAL insertion on day 10 skips rungs 21 to 25 entirely and lands on rung 26.
    5. Rung 32 (series expired) commits the forfeiture write before failing. This is
       only reachable while the pack is still ACTIVE; a pack already in EXPIRED fails
       the same rung with no further write, so the side effect fires exactly once.
       Rung 33 (exhausted) sits below rung 32, so an expired-and-exhausted pack
       reports expiry.
    6. The Procedure recall_status axis transition RECALL_AFFECTED -> NOTIFIED runs
       inside the same request as NONE -> RECALL_AFFECTED. RECALL_AFFECTED is
       therefore never observable at rest. This is intentional and declared; no test
       may assert on a persisted RECALL_AFFECTED.
    7. PelletLot.sterility_status RELEASED -> QUARANTINED has no manual endpoint, so
       its only producer is a SEVERE AdverseEvent naming a lot_id. That path is
       reachable: POST /clinic/adverse-events accepts an optional lot_id.
    8. Procedure SUPPLY_HOLD -> SCHEDULED is reachable through two distinct triggers
       (standing-order reinstate, financial-hold clear) but deliberately NOT for
       hold_reason LOT_RECALL, which is stated on the transition. A recall-held
       procedure's only exit is cancel, and that leg is declared.
    9. FACILITY_FEE_WAIVER_THRESHOLD_CENTS 42625 is exactly attainable - see the
       constant's own note - so the `>=` boundary is hittable and both branches fire.
    10. ROLLING_MG_CAP_ESTRADIOL 400 against MAX_DOSE_PER_PROCEDURE_MG_ESTRADIOL 150
        means the rolling cap binds on the third estradiol procedure at the earliest,
        which is inside the 365-day window only if the 70-day re-dose interval is
        respected: 3 x 70 = 210 days < 365. Reachable.
    11. Every enum value declared in §1.1 has a producing transition or a producing
        calculation. Enum values that would otherwise be dead were deleted rather
        than left declared: StandingOrder has no EXPIRED (expiry is evaluated at gate
        time), PelletLot has no EXPIRED (expiry is evaluated at allocation time), and
        ConsentRecord has no REVOKED.
  seam_interactions: |
    Density here comes from mechanisms changing each other's answers, not from
    parallel features. The load-bearing interactions:
    - The membership discount can cost a patient the facility-fee waiver, so a PLUS
      member's total exceeds a non-member's on the identical procedure.
    - Breakage at perform lowers delivered_total_mg, which lowers the rolling
      exposure, which can let a later procedure through a cap that the planned
      figure would have blocked.
    - A SEVERE adverse event suspends a standing order, which holds procedures
      belonging to OTHER patients, which releases THEIR reserved pellets back into
      the FEFO pool, which changes which lot a third patient's allocation draws.
    - A protocol publication de-consents procedures, which is what makes the
      consent-attach leg cyclic and forces a second consent under the new version.
    - The lab's two ranges drive two different subsystems from one number: the
      optimal band gates re-dose, the critical threshold gates every administration.
    - The financing default cascade holds SCHEDULED procedures, releasing their
      pellets, which changes FEFO outcomes for unrelated patients.
