# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3325_wholesale_broker_channel_pricing_engine_broker_compliance
#
# One block per §0.5 Difficulty Rule, each carrying 2 instances (>= 18 total).
# Every instance grounds in an element declared in SCAFFOLD.yaml §1.1-§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: repurchase_exposure_pair_share_vs_flat_reversal
        grounds:
          - calculations.repurchase_exposure
          - calculations.repurchase_exposure.variants.compensating_reversal
          - calculations.repurchase_exposure.variants.flat_reversal
          - state_machines.LoanSubmission.transitions.FUNDED_to_REPURCHASED
          - entities.Broker.fields.rolling_funded_volume_cents
        distinguishing_aspect: "On the LoanSubmission domain the pinned compensating reversal of a 40000000-cent loan against a 60000000-cent rolling volume charges 44000000 cents, while the flat-reversal interpretation of the same inputs charges 40000000 — a 4000000-cent divergence from identical state."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B1 is APPROVED with licensed_states [CA], rolling_funded_volume_cents 60000000 cents, and one FUNDED loan of 40000000 cents carrying a CRITICAL TITLE_DEFECT QC review that requires repurchase and is still inside its 30-day window."
          setup_api_calls:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Pair Share Wholesale LLC", nmls_id: "NMLS-3325001", home_state: "CA", volume_expectation_cents: 100000000 }
              as: ChannelManager
              captures: { b1: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b1}/licenses"
              payload: { state_code: "CA", license_number: "CA-MB-3325-1", license_type: "MORTGAGE_BROKER", expires_on: "2027-12-31T00:00:00Z" }
              as: ChannelManager
            - call: "POST /wholesale-channel/brokers/${b1}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 100000000, audit_attested: true }
              as: ChannelManager
              captures: { fr1: $.data.id }
            - call: "POST /wholesale-channel/financial-reviews/${fr1}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b1_v_fr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b1}/product-eligibilities"
              payload: { product_code: "CONVENTIONAL", max_ltv: 0.9500, min_fico: 620, max_loan_amount_cents: 200000000 }
              as: ChannelManager
              captures: { pe1: $.data.id, b1_v_pe: $.data.version }
            - call: "POST /wholesale-channel/product-eligibilities/${pe1}/decision"
              payload: { outcome: "APPROVED", expected_broker_version: "${b1_v_pe}" }
              as: ChannelManager
              captures: { b1_v_elig: $.data.version }
            - call: "POST /wholesale-channel/compensation-plans"
              payload: { broker_id: "${b1}", plan_code: "PLAN_A", default_election: "LENDER_PAID", lender_paid_amount_cents: 250000, borrower_paid_amount_cents: 300000, is_active: true }
              as: ChannelManager
              captures: { plan1: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b1}/approve"
              payload: {}
              as: ChannelManager
              captures: { b1_v_approve: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b1}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.125, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "ltv", bucket: "up-to-60", adjust_pct: 0.000 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs1: $.data.id, rs1_v: $.data.version }
            - call: "POST /wholesale-channel/rate-sheets/${rs1}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5000, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs1_v}" }
              as: BrokerUser
              as_user_id: "${b1}"
              captures: { q1: $.data.id }
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b1}", pricing_quote_id: "${q1}", borrower_name: "Pair Share Borrower", property_state: "CA", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan1}" }
              as: BrokerUser
              as_user_id: "${b1}"
              captures: { l1: $.data.id, b1_v_sub: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l1}/underwrite"
              payload: { expected_broker_version: "${b1_v_sub}" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b1_v_uw: $.data.version }
            - call: "POST /wholesale-channel/underwriting-decisions"
              payload: { loan_submission_id: "${l1}", decision_type: "CONDITIONAL", conditions: ["standard conditions"], decision_notes: "proceed" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b1_v_cond: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l1}/clear-to-close"
              payload: {}
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b1_v_ctc: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l1}/fund"
              payload: {}
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b1_v_fund: $.data.version }
            - call: "POST /wholesale-channel/quality-control-reviews"
              payload: { loan_submission_id: "${l1}", defect_type: "TITLE_DEFECT", severity: "CRITICAL", remediation_status: "NONE" }
              as: QualityControlAnalyst
              captures: { qc1: $.data.id, b1_v_qc: $.data.version }
          trigger:
            - call: "POST /wholesale-channel/quality-control-reviews/${qc1}/repurchase"
              payload: {}
              as: QualityControlAnalyst
              captures: { b1_v_re_after: $.data.version }
          assert:
            - "the response status is 200 and the returned loan status is REPURCHASED"
            - "LoanSubmission.${l1}.repurchase_exposure_cents == 44000000"
            - "LoanSubmission.${l1}.repurchase_exposure_cents != 40000000"
            - "Broker.${b1}.rolling_funded_volume_cents == 60000000 - 40000000 == 20000000"

      - name: broker_score_review_basis_vs_declared_basis
        grounds:
          - calculations.broker_financial_strength_score
          - calculations.broker_financial_strength_score.variants.lender_basis_pending_review
          - calculations.broker_financial_strength_score.variants.broker_declared_basis
          - state_machines.FinancialReview.transitions.PENDING_to_PASSED
          - entities.Broker.fields.financial_strength_score
        distinguishing_aspect: "On the Broker/FinancialReview domain the pinned lender basis scores 78.00 yet leaves the Broker at 0.00 until PASSED, while the declared basis would install 78.00 on the Broker the moment the review row exists — the same review, two different broker.financial_strength_score values at the same instant."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B2 submitted with no financial review yet."
          setup_api_calls:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Declared Basis Wholesale Inc", nmls_id: "NMLS-3325002", home_state: "TX", volume_expectation_cents: 100000000 }
              as: ChannelManager
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /wholesale-channel/brokers/${b2}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 100000000, audit_attested: true }
              as: ChannelManager
              captures: { fr2: $.data.id, b2_v_before: $.data.version }
          assert:
            - "the response status is 201 and FinancialReview.${fr2}.computed_financial_strength_score == 78.00"
            - "FinancialReview.${fr2}.status == PENDING"
            - "GET /wholesale-channel/brokers/${b2} returns financial_strength_score == 0.00 and tier == UNRATED"
            - "GET /wholesale-channel/brokers/${b2} returns financial_strength_score != 78.00, ruling out the broker_declared_basis variant"
            - "GET /wholesale-channel/brokers/${b2}/financial-reviews?status=PASSED returns 0 rows"

  # ===========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: pricing_quote_price_points_provisional_tier_with_single_rounding
        grounds:
          - calculations.pricing_quote_price_points
          - calculations.overall_rate_adjustment
          - entities.PricingQuote.fields.price_points
          - calculations.pricing_quote_price_points.constants.TIER_DISCOUNT
        distinguishing_aspect: "Formula mode (c): the price-point discount is keyed on the tier of the provisional (pre-discount) point value, so the evaluation order must be pinned — the provisional -1.125 is PLATINUM and lands at -1.375, while a provisional of exactly -0.500 would also be PLATINUM and land at -0.750, proving the inclusive boundary and the no-re-entry rule."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B3 is APPROVED with a PUBLISHED CONVENTIONAL sheet whose base rate is 6.125 and whose credit and ltv buckets carry the standard adjustments."
          setup_api_calls:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Combinatorial Wholesale Co", nmls_id: "NMLS-3325003", home_state: "CA", volume_expectation_cents: 100000000 }
              as: ChannelManager
              captures: { b3: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b3}/licenses"
              payload: { state_code: "CA", license_number: "CA-MB-3325-3", license_type: "MORTGAGE_BROKER", expires_on: "2027-12-31T00:00:00Z" }
              as: ChannelManager
            - call: "POST /wholesale-channel/brokers/${b3}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 100000000, audit_attested: true }
              as: ChannelManager
              captures: { fr3: $.data.id }
            - call: "POST /wholesale-channel/financial-reviews/${fr3}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b3_v_fr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b3}/approve"
              payload: {}
              as: ChannelManager
              captures: { b3_v_appr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b3}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.125, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "ltv", bucket: "up-to-60", adjust_pct: 0.000 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs3: $.data.id, rs3_v: $.data.version }
          trigger:
            - call: "POST /wholesale-channel/rate-sheets/${rs3}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs3_v}" }
              as: BrokerUser
              as_user_id: "${b3}"
              captures: { q3a: $.data.id }
          assert:
            - "the response status is 201"
            - "PricingQuote.${q3a}.overall_adjustment_pct == -0.125"
            - "PricingQuote.${q3a}.price_points == -1.375"
            - "PricingQuote.${q3a}.note_rate_pct == 6.000"
            - "PricingQuote.${q3a}.adjustment_trace has exactly 4 entries in the order credit, ltv, occupancy, product, with adjustment_trace[1].bucket == \"up-to-60\""
            - "the same four dimensions applied a second time would reproduce -1.375, proving the discount reads the provisional tier and not the final value"
            - "PricingQuote.${q3a}.price_points != -1.125, ruling out the pre-discount provisional value"

      - name: note_rate_single_rounding_across_lock_boundaries
        grounds:
          - calculations.pricing_quote_note_rate
          - calculations.pricing_quote_note_rate.variants.sum_then_round
          - calculations.lock_adjustment
          - calculations.pricing_quote_note_rate.constants.LOCK_SURCHARGE_15D
        distinguishing_aspect: "Formula mode (b): nesting the lock bucket next to the credit bucket and summing three terms before a single round-half-up to three decimals, so the lock boundary decides the third decimal — 29 days yields 6.375, exactly 30 days yields 6.250, exactly 60 days yields 6.125."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B4 is APPROVED with a PUBLISHED CONVENTIONAL sheet."
          setup_api_calls:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Rounding Trap Wholesale LP", nmls_id: "NMLS-3325004", home_state: "TX", volume_expectation_cents: 100000000 }
              as: ChannelManager
              captures: { b4: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b4}/licenses"
              payload: { state_code: "TX", license_number: "TX-MB-3325-4", license_type: "MORTGAGE_BROKER", expires_on: "2027-12-31T00:00:00Z" }
              as: ChannelManager
            - call: "POST /wholesale-channel/brokers/${b4}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 100000000, audit_attested: true }
              as: ChannelManager
              captures: { fr4: $.data.id }
            - call: "POST /wholesale-channel/financial-reviews/${fr4}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b4_v_fr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b4}/approve"
              payload: {}
              as: ChannelManager
              captures: { b4_v_appr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b4}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.125, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "ltv", bucket: "60-70", adjust_pct: 0.050 }, { dim: "ltv", bucket: "70-80", adjust_pct: 0.125 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs4: $.data.id, rs4_v: $.data.version }
          trigger:
            - call: "POST /wholesale-channel/rate-sheets/${rs4}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.6500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 29, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs4_v}" }
              as: BrokerUser
              as_user_id: "${b4}"
              captures: { q4a: $.data.id, rs4_v2: $.data.version }
            - call: "POST /wholesale-channel/rate-sheets/${rs4}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.7500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs4_v2}" }
              as: BrokerUser
              as_user_id: "${b4}"
              captures: { q4b: $.data.id, rs4_v3: $.data.version }
            - call: "POST /wholesale-channel/rate-sheets/${rs4}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.7500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 60, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs4_v3}" }
              as: BrokerUser
              as_user_id: "${b4}"
              captures: { q4c: $.data.id }
          assert:
            - "PricingQuote.${q4a}.adjustment_trace[1].bucket == \"60-70\" and PricingQuote.${q4a}.overall_adjustment_pct == 0.125"
            - "PricingQuote.${q4a}.lock_adjustment_pct == 0.125 and PricingQuote.${q4a}.note_rate_pct == 6.375"
            - "PricingQuote.${q4a}.price_points == -0.875, the provisional -0.625 banded as PLATINUM"
            - "PricingQuote.${q4b}.lock_adjustment_pct == 0.000 and PricingQuote.${q4b}.note_rate_pct == 6.250"
            - "PricingQuote.${q4c}.lock_adjustment_pct == -0.125 and PricingQuote.${q4c}.note_rate_pct == 6.125"
            - "PricingQuote.${q4a}.note_rate_pct != PricingQuote.${q4b}.note_rate_pct"

  # ===========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: loan_submission_branching_fork_join_and_cyclic_review_loop
        grounds:
          - state_machines.LoanSubmission
          - state_machines.LoanSubmission.transitions.UNDERWRITING_to_CONDITIONAL_APPROVAL
          - state_machines.LoanSubmission.transitions.UNDERWRITING_to_SUSPENDED_REVIEW
          - state_machines.LoanSubmission.transitions.SUBMITTED_to_UNDERWRITING
          - entities.LoanSubmission.fields.closing_path
        distinguishing_aspect: "LoanSubmission carries both non-linear shapes: a branching fork-join out of UNDERWRITING into CONDITIONAL_APPROVAL or SUSPENDED_REVIEW that rejoin at CLEAR_TO_CLOSE, and a cycle SUSPENDED_REVIEW -> SUBMITTED -> UNDERWRITING that a loan may traverse more than once."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B5 is APPROVED with a valid TX license, a PUBLISHED CONVENTIONAL sheet and an APPROVED CONVENTIONAL eligibility."
          setup_api_calls:
            - call: "POST /wholesale-channel/brokers"
              payload: { legal_name: "Fork Join Wholesale LLC", nmls_id: "NMLS-3325005", home_state: "TX", volume_expectation_cents: 100000000 }
              as: ChannelManager
              captures: { b5: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b5}/licenses"
              payload: { state_code: "TX", license_number: "TX-MB-3325-5", license_type: "MORTGAGE_BROKER", expires_on: "2027-12-31T00:00:00Z" }
              as: ChannelManager
            - call: "POST /wholesale-channel/brokers/${b5}/financial-reviews"
              payload: { net_worth_cents: 100000000, liquidity_cents: 40000000, total_liabilities_cents: 0, years_in_business: 5, prior_year_funded_volume_cents: 100000000, audit_attested: true }
              as: ChannelManager
              captures: { fr5: $.data.id }
            - call: "POST /wholesale-channel/financial-reviews/${fr5}/decision"
              payload: { outcome: "PASSED" }
              as: ChannelManager
              captures: { b5_v_fr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b5}/product-eligibilities"
              payload: { product_code: "CONVENTIONAL", max_ltv: 0.9500, min_fico: 620, max_loan_amount_cents: 200000000 }
              as: ChannelManager
              captures: { pe5: $.data.id, b5_v_pe: $.data.version }
            - call: "POST /wholesale-channel/product-eligibilities/${pe5}/decision"
              payload: { outcome: "APPROVED", expected_broker_version: "${b5_v_pe}" }
              as: ChannelManager
              captures: { b5_v_elig: $.data.version }
            - call: "POST /wholesale-channel/compensation-plans"
              payload: { broker_id: "${b5}", plan_code: "PLAN_A", default_election: "LENDER_PAID", lender_paid_amount_cents: 250000, borrower_paid_amount_cents: 300000, is_active: true }
              as: ChannelManager
              captures: { plan5: $.data.id }
            - call: "POST /wholesale-channel/brokers/${b5}/approve"
              payload: {}
              as: ChannelManager
              captures: { b5_v_appr: $.data.version }
            - call: "POST /wholesale-channel/brokers/${b5}/rate-sheets"
              payload: { product_code: "CONVENTIONAL", base_rate_pct: 6.125, adjustment_table: [{ dim: "credit", bucket: "760-plus", adjust_pct: -0.125 }, { dim: "ltv", bucket: "up-to-60", adjust_pct: 0.000 }, { dim: "occupancy", bucket: "PRIMARY_RESIDENCE", adjust_pct: 0.000 }, { dim: "product", bucket: "CONVENTIONAL", adjust_pct: 0.000 }] }
              as: ChannelManager
              captures: { rs5: $.data.id, rs5_v: $.data.version }
            - call: "POST /wholesale-channel/rate-sheets/${rs5}/pricing-quotes"
              payload: { representative_fico: 780, ltv_ratio: 0.5500, occupancy_type: "PRIMARY_RESIDENCE", loan_amount_cents: 40000000, lock_period_days: 30, loan_purpose: "PURCHASE", expected_rate_sheet_version: "${rs5_v}" }
              as: BrokerUser
              as_user_id: "${b5}"
              captures: { q5: $.data.id }
            - call: "POST /wholesale-channel/loan-submissions"
              payload: { broker_id: "${b5}", pricing_quote_id: "${q5}", borrower_name: "Fork Join Borrower", property_state: "TX", loan_amount_cents: 40000000, lock_expires_at: "2027-01-01T00:00:00Z", compensation_election: "LENDER_PAID", comp_plan_id: "${plan5}" }
              as: BrokerUser
              as_user_id: "${b5}"
              captures: { l5: $.data.id, b5_v_sub: $.data.version }
          trigger:
            - call: "POST /wholesale-channel/loan-submissions/${l5}/underwrite"
              payload: { expected_broker_version: "${b5_v_sub}" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b5_v_uw: $.data.version }
            - call: "POST /wholesale-channel/underwriting-decisions"
              payload: { loan_submission_id: "${l5}", decision_type: "SUSPENDED", decision_notes: "missing income docs for suspension review" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b5_v_susp: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l5}/resubmit"
              payload: { resubmission_note: "income documents supplied by broker" }
              as: BrokerUser
              as_user_id: "${b5}"
              captures: { b5_v_resub: $.data.version }
            - call: "POST /wholesale-channel/loan-submissions/${l5}/underwrite"
              payload: { expected_broker_version: "${b5_v_resub}" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b5_v_uw2: $.data.version }
            - call: "POST /wholesale-channel/underwriting-decisions"
              payload: { loan_submission_id: "${l5}", decision_type: "CONDITIONAL", conditions: ["updated appraisal"], decision_notes: "conditions cleared path" }
              as: Underwriter
              as_user_id: "uw-dana"
              captures: { b5_v_cond: $.data.version }
          assert:
            - "after the SUSPENDED decision LoanSubmission.${l5}.status == SUSPENDED_REVIEW"
            - "after the CONDITIONAL decision that follows the resubmission, LoanSubmission.${l5}.status == CONDITIONAL_APPROVAL, proving the SUSPENDED_REVIEW -> SUBMITTED -> UNDERWRITING cycle re-entered the fork and took the other branch"
            - "LoanSubmission.${l5}.status was SUSPENDED_REVIEW at the moment the resubmit call succeeded, and SUBMITTED immediately after it"
            - "GET /wholesale-channel/loan-submissions/${l5}/underwriting-decisions returns exactly 2 rows, in recorded order"
            - "LoanSubmission.${l5}.closing_path is null while the loan is only CONDITIONAL_APPROVAL"

      - name: quality_control_review_defect_remediate_void_cycle
        grounds:
          - state_machines.QualityControlReview
          - state_machines.QualityControlReview.transitions.DEFECT_to_REMEDIATED
