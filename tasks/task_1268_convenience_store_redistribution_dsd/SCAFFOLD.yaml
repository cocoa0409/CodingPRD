    output: TaxStampSupply
    side_effects: []
  - method: GET
    path: "/tax-stamp-supplies"
    description: "List tax stamp supplies"
    roles: [WholesaleAdmin, SalesRep]
    code: 200
    input: ["jurisdiction_code?"]
    output: TaxStampSupply[]
    side_effects: []
  - method: POST
    path: "/delivery-manifests"
    description: "Create a delivery-day manifest"
    roles: [WholesaleAdmin]
    code: 201
    input: [route_code, delivery_date, capacity_lbs]
    output: DeliveryManifest
    side_effects: []
  - method: GET
    path: "/delivery-manifests"
    description: "List manifests"
    roles: [WholesaleAdmin, RouteDriver]
    code: 200
    input: ["route_code?", "delivery_date?", "fuel_rate_id?"]
    output: DeliveryManifest[]
    side_effects: []
  - method: GET
    path: "/delivery-manifests/{id}"
    description: "Fetch manifest"
    roles: [WholesaleAdmin, RouteDriver]
    code: 200
    input: []
    output: DeliveryManifest
    side_effects: []
  - method: POST
    path: "/delivery-manifests/{id}/begin-loading"
    description: "Advance manifest SCHEDULED -> LOADING"
    roles: [WholesaleAdmin]
    code: 200
    input: []
    output: DeliveryManifest
    side_effects: ["increments DeliveryManifest.version by 1"]
  - method: POST
    path: "/delivery-manifests/{id}/assign-order"
    description: "Assign a SUBMITTED order to this manifest (OCC on manifest version)"
    roles: [WholesaleAdmin]
    code: 200
    input: [order_id, expected_manifest_version]
    output: PurchaseOrder
    side_effects:
      - "order transitions SUBMITTED -> ASSIGNED, sets manifest_id"
      - "DeliveryManifest.total_weight_lbs recomputed; overweight_flag may flip true"
      - "increments DeliveryManifest.version by 1"
