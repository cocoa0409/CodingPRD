        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / cycle_state_beats_expired_qualification_on_load
          rationale: "The expired-qualification refusal is asserted there in isolation as the lower-priority loser."

  - section: rbac
    instances:
      - name: corner_quality_manager_owns_the_ccp_judgement_surface
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - rbac.QualityManager.exclusive_operations
          - rbac.QualityManager.shared_operations
        distinguishing_aspect: "One QualityManager identity walks its whole exclusive surface end to end — validation runs, decision, disposition, package inspection and release — and can also read the customer and the money line."
        test_recipe:
          setup:
            - "the standard world with PAL-001 accepted, C1 loaded, started and clean-logged"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_clean
          trigger:
            - *c_disp
            - *c_inspect1
            - { call: "GET /chargeback-lines?customer_id=${cust_id}", as: QualityManager, as_user_id: "qm_alice", captures: { qm_cb_id: "$.data[0].id" } }
            - { call: "GET /customers/${cust_id}", as: QualityManager, as_user_id: "qm_alice", captures: { qm_bal: $.data.chargeback_balance_cents } }
          assert:
            - "every call returns 2xx for the QualityManager role"
            - "VesselCycle.${cyc1_id}.state == DISPOSITIONED with actual_tolling_fee_cents == 12825"
            - "CycleLoad.${load1_id}.inspection_state == INSPECTED with leaker_ppm == 3000"
            - "GET /chargeback-lines returns 1 row and GET /customers/${cust_id} reports chargeback_balance_cents == 6788"

      - name: corner_scheduler_and_operator_cannot_cross_into_quality_operations
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - rbac.PlantScheduler.exclusive_operations
          - rbac.PlantOperator.exclusive_operations
          - rbac.QualityManager.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations.p2[all -> ERR_UNAUTHORIZED]
        distinguishing_aspect: "Role denial is decided at priority 2, before any state or payload rule: the scheduler is refused the CCP log, the operator is refused disposition, and the QualityManager is refused vessel setup — each with an untouched world."
        test_recipe:
          setup:
            - "the standard world; C1 is RUNNING with PAL-001 in the chamber"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 195, come_up_seconds: 104, water_temp_c: 7.5 }, as: PlantScheduler, captures: { e_rbac1: $.data.error_id } }
            - { call: "POST /vessel-cycles/${cyc1_id}/disposition", payload: {}, as: PlantOperator, as_user_id: "op_bob", captures: { e_rbac2: $.data.error_id } }
            - { call: "POST /vessels", payload: { vessel_code: "HPP-9", chamber_volume_liters: 350, max_pressure_mpa: 600.0, pump_ramp_rate_mpa_per_sec: 6.0, decompression_seconds: 12, basket_count: 4, hourly_operating_cost_cents: 90000 }, as: QualityManager, as_user_id: "qm_alice", captures: { e_rbac3: $.data.error_id } }
            - { call: "POST /lots/${lot1_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.2 }, as: PlantScheduler, captures: { e_rbac4: $.data.error_id } }
          assert:
            - "all four calls return HTTP 403 with data.error_id == ERR_UNAUTHORIZED"
            - "no CycleLog row exists and VesselCycle.${cyc1_id}.state is still RUNNING"
            - "exactly 1 Vessel row exists"
            - "Lot.${lot1_id}.custody_state is still IN_VESSEL"

      - name: corner_missing_or_unknown_role_header_cannot_reach_any_endpoint
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations.p1[all -> ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication is priority 1: an omitted X-Role header and an unrecognised role value both yield 401 on a plain read, ahead of the 403 that a known-but-wrong role would get."
        test_recipe:
          setup:
            - "customer VERDE exists"
          setup_api_calls:
            - *c_clock
            - *c_cust
          trigger:
            - { call: "GET /customers/${cust_id}", as: "(X-Role header omitted)", captures: { e_auth1: $.data.error_id } }
            - { call: "GET /customers/${cust_id}", as: "Janitor", captures: { e_auth2: $.data.error_id } }
          assert:
            - "both calls return HTTP 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "neither response contains any Customer field"
            - "data.error_id != ERR_UNAUTHORIZED (the request never reaches the priority-2 role check)"

      - name: corner_customer_cannot_read_another_customers_pallet
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations.p6[GET /lots/{id} -> ERR_NOT_RESOURCE_OWNER]
          - rbac.Customer.identity
        distinguishing_aspect: "The Customer role is entity_backed, so ownership is decided by X-User-ID against Lot.customer_id: NORTE gets 403 on VERDE's pallet at priority 6, after the 404 check has already proved the row exists, while VERDE gets 200 on the same id."
        test_recipe:
          setup:
            - "customers VERDE and NORTE both exist; PAL-001 belongs to VERDE"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_cust2
            - *c_fam
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_lot1
          trigger:
            - { call: "GET /lots/${lot1_id}", as: Customer, as_user_id: "${cust2_id}", captures: { e_owner: $.data.error_id } }
            - { call: "GET /lots/${lot1_id}", as: Customer, as_user_id: "${cust_id}", captures: { own_pallet: $.data.pallet_ref } }
          assert:
            - "trigger step 1: HTTP 403 with data.error_id == ERR_NOT_RESOURCE_OWNER"
            - "trigger step 2: HTTP 200 with pallet_ref == PAL-001 and customer_id == ${cust_id}"

      - name: corner_the_operator_who_signed_the_log_cannot_adjudicate_it
        claim_type: Segregation of duties
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations.p9[POST /deviations/{id}/adjudicate -> ERR_SEGREGATION_OF_DUTIES]
          - entities.CycleLog.fields.logged_by_user_id
          - complexity_profile.role_model
        distinguishing_aspect: "The bar is on the identity, not the role: op_bob wearing the QualityManager hat is still refused because he signed the CCP record, and qm_alice adjudicating the same deviation succeeds."
        test_recipe:
          setup:
