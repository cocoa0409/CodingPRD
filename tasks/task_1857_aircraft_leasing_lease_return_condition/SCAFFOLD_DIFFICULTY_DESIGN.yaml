  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_wrong_state_and_over_balance_state_wins
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_CLAIM_NOT_PAYABLE]
          - errors[ERR_RESERVE_BALANCE_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state(5) vs business_fiscal(10): re-paying a PAID claim
          of 560000 when the balance has dropped to 0 violates both the APPROVED-only
          state precondition and the balance check; the state error
          ERR_CLAIM_NOT_PAYABLE must win.
        test_recipe:
          setup:
            - "ACTIVE lease; accepted report 100.0 h / 20 cycles -> balance 560000; claim A claimed+approved 560000 then PAID (balance 0); claim B approved 100000 (proves approval does not check balance)"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-K1", model: "A319", manufacture_date: "2013-07-19" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-K1" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/documents/${d1}/review", payload: { decision: "VERIFIED" }, as: LessorAdmin }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Kilo Air" }, as: LessorAdmin, captures: { les: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${les}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 1000000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300, accrual_basis: "ACTUAL" }, as: LessorAdmin, captures: { lease: "$.data.id"} }
            - { call: "POST /leasing/leases/${lease}/activate", payload: {}, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/utilization-reports", payload: { period_month: "2026-08", flight_hours: 100.0, flight_cycles: 20 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id"} }
            - { call: "POST /leasing/utilization-reports/${rep}/review", payload: { decision: "ACCEPT" }, as: LessorAdmin }
            - { call: "POST /leasing/leases/${lease}/reserve-claims", payload: { maintenance_event_ref: "ENG-SHOP-A", claimed_amount_cents: 560000 }, as: LesseeRep, as_user_id: "${les}", captures: { clA: "$.data.id"} }
            - { call: "POST /leasing/reserve-claims/${clA}/decide", payload: { decision: "APPROVE", approved_amount_cents: 560000 }, as: LessorAdmin }
            - { call: "POST /leasing/reserve-claims/${clA}/pay", payload: {}, as: FinanceManager }
          trigger:
            - { call: "POST /leasing/reserve-claims/${clA}/pay", payload: {}, as: FinanceManager, captures: { err: "$.data.error_id"} }
          assert:
            - "second pay of the PAID claim is rejected with ERR_CLAIM_NOT_PAYABLE (state, priority 5)"
            - "ERR_RESERVE_BALANCE_EXCEEDED (fiscal, priority 10) is NOT returned even though 560000 > balance 0 also fails"

      - name: activate_records_missing_and_overlap_safety_wins
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_RECORDS_INCOMPLETE]
          - errors[ERR_LEASE_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_safety(6) vs business_temporal(7) — a
          different pair than state-vs-fiscal: activating lease Y with no VERIFIED
          BIRTH_RECORD while overlapping DRAFT lease X must surface
          ERR_RECORDS_INCOMPLETE, not ERR_LEASE_PERIOD_OVERLAP.
        test_recipe:
          setup:
            - "Aircraft with a BIRTH_RECORD document still SUBMITTED (never verified); DRAFT lease X [2026-08-01, 2027-08-01); DRAFT lease Y [2027-01-01, 2028-01-01) overlapping X"
          setup_api_calls:
            - { call: "POST /leasing/aircraft", payload: { msn: "MSN-L2", model: "E195-E2", manufacture_date: "2021-05-05" }, as: LessorAdmin, captures: { ac: "$.data.id"} }
            - { call: "POST /leasing/aircraft/${ac}/documents", payload: { doc_type: "BIRTH_RECORD", doc_reference: "BR-L2" }, as: LessorAdmin, captures: { d1: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Lima Air" }, as: LessorAdmin, captures: { lesX: "$.data.id"} }
            - { call: "POST /leasing/lessees", payload: { legal_name: "Lima2 Air" }, as: LessorAdmin, captures: { lesY: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${lesX}", start_date: "2026-08-01", end_date: "2027-08-01", monthly_rent_cents: 900000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { leaseX: "$.data.id"} }
            - { call: "POST /leasing/leases", payload: { aircraft_id: "${ac}", lessee_id: "${lesY}", start_date: "2027-01-01", end_date: "2028-01-01", monthly_rent_cents: 950000, reserve_rate_per_fh_cents: 4000, reserve_rate_per_fc_cents: 8000, monthly_hour_cap: 300 }, as: LessorAdmin, captures: { leaseY: "$.data.id"} }
          trigger:
            - { call: "POST /leasing/leases/${leaseY}/activate", payload: {}, as: LessorAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "activation rejected with ERR_RECORDS_INCOMPLETE (safety, priority 6)"
            - "ERR_LEASE_PERIOD_OVERLAP (temporal, priority 7) is NOT returned even though lease Y overlaps DRAFT lease X"

  - rule_id: boundary_precision_check
    instances:
      - name: pay_claim_equal_to_balance_allowed
        grounds:
          - validations[priority=10]
          - state_machines.ReserveClaim.APPROVED_to_PAID
        distinguishing_aspect: |
          Numeric threshold boundary on the reserve-balance metric via the pay
          endpoint: approved amount exactly equal to the balance is payable
          (>= semantics), while 1 cent over is rejected.
        test_recipe:
          setup:
            - "ACTIVE lease with reserve balance exactly 560000 (accepted 100.0 h / 20 cycles); claim A approved 560000 (== balance); claim B approved 1 with balance then 0"
          setup_api_calls:
