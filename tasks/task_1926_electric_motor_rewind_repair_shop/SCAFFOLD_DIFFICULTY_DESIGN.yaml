  # ==========================================================================
  # Rule 6 — boundary_precision_check: two exact boundaries on DIFFERENT
  # metrics reachable through DIFFERENT endpoints.
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: core_loss_exactly_five_percent_passes
        grounds:
          - calculations.core_loss_verdict
          - entities.TestRecord.fields.verdict
        distinguishing_aspect: |
          Metric core-loss percentage on POST .../tests: measured_watts exactly
          3750 on a 75 kW motor is exactly 5.000% and MUST yield verdict PASS
          (<= comparison); 3751 W MUST yield FAIL.
        test_recipe:
          setup:
            - "WorkOrder in INCOMING_TEST for a 75 kW motor"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /shops/${shop_id}/customers"
              payload: { company_name: "C" }
              as: ServiceManager
              captures: { cust_id: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-10", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { motor_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${motor_id}", priority: "STANDARD" }
              as: Technician
              captures: { wo_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "INCOMING", insulation_megohms: 500 }
              as: Technician
              as_user_id: "op-t"
          trigger:
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "CORE_LOSS", measured_watts: 3750 }
              as: Technician
              as_user_id: "op-t"
              captures: { tr_pass: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders/${wo_id}/tests"
              payload: { kind: "CORE_LOSS", measured_watts: 3751 }
              as: Technician
              as_user_id: "op-t"
              captures: { tr_fail: $.data.id }
          assert:
            - "TestRecord.${tr_pass}.verdict == PASS   # 3750/75000 == 0.05 exactly; <= passes"
            - "TestRecord.${tr_fail}.verdict == FAIL   # 3751/75000 > 0.05"

      - name: standing_hold_boundary_thirty_days_is_watch_not_hold
        grounds:
          - calculations.customer_standing
          - entities.Customer.fields.standing
        distinguishing_aspect: |
          Metric days-overdue on GET .../customers/{id}: an invoice exactly 30
          days past due keeps standing at WATCH; HOLD requires strictly more
          than 30 days (> comparison, not >=). Different metric (whole days
          overdue) and different endpoint (customer read) from the core-loss
          wattage boundary on POST .../tests.
        test_recipe:
          setup:
            - "W0 (1h STANDARD frame 200) released at default clock 2026-08-01 -> invoice I0 total 34680c, due 2026-08-31; never paid"
            - "Clock at 2026-09-30T00:00:00Z: I0 is exactly 30 days past due"
          setup_api_calls:
            - call: "POST /shops"
              payload: { shop_name: "S", easa_accreditation_id: "EASA-12345", labor_rate_small_cents: 8500, labor_rate_medium_cents: 9500, labor_rate_large_cents: 11200, labor_rate_xlarge_cents: 13800, rush_premium_pct: 0.35, replace_threshold_pct: 0.65, supplies_low_pct: 0.08, supplies_high_pct: 0.06, warranty_months: 12, pool_slot_monthly_cents: 4500, pool_loan_daily_cents: 1800, pool_loan_grace_days: 3 }
              as: ShopAdmin
