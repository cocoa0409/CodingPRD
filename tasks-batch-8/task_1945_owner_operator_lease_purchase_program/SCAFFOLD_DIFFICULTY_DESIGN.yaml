  - rule_id: priority_pair_validation_conflict
    instances:
      - name: activate_state_error_beats_compliance_error
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - state_machines.LeaseAgreement.APPLICATION_to_ACTIVE
        distinguishing_aspect: |
          Category pair state(p4) vs business_safety(p5): the lease is already ACTIVE
          AND the operator's documents have expired (classification FLAGGED); the
          activation attempt must fail with the state error ERR_LEASE_NOT_IN_APPLICATION,
          not ERR_COMPLIANCE_REQUIREMENTS_UNMET.
        test_recipe:
          setup:
            - "Lease ACTIVATED while docs valid (docs expire 2026-08-20)"
            - "clock advanced to 2026-08-21 so all required docs are EXPIRED and classification flips FLAGGED"
          setup_api_calls:
