            - "RoyaltyReport.${rep2_id}.earned_royalty_cents == 25000 (cumulative_before == 100000000 >= cap -> entire report at tier 2: 1000000 * 250/10000)"
      - name: share_sum_exactly_10000_boundary
        grounds:
          - validations[priority=8]
          - errors[ERR_SHARE_SUM_INVALID]
          - state_machines.InventionDisclosure.INVENTORSHIP_REVIEW_to_INVENTORSHIP_CONFIRMED
        distinguishing_aspect: |
          Metric: roster share_bp sum in basis points, via the finalize
          endpoint (a different metric and endpoint than the sales-tier cap).
          Sum 9999 fails; sum exactly 10000 passes — ==, not >=.
        test_recipe:
          setup:
            - "NON_FEDERAL disclosure INVENTORSHIP_REVIEW with three CONFIRMED entries 3333+3333+3333 = 9999bp"
          setup_api_calls:
            - { call: "POST /tlo/departments", payload: { name: "EECS", college_name: "Engineering" }, as: SystemAdmin, captures: { dept_id: "$.data.id" } }
