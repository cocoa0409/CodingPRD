              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Mia Duarte", grade_level: 3, date_of_birth: "2017-02-02T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/medication-stock-lots"
              payload: { school_id: "${sch_id}", medication_code: "EPINEPHRINE", lot_number: "EPI-IRV-1", is_stock_protocol: false, initial_quantity: 5, expiration_date: "2027-06-30T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { lot_ns_id: $.data.id }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: DistrictHealthAdmin
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "ILLNESS", acuity: "URGENT" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /health-office/health-visits/${visit_id}/assess"
              payload: { assessment_note: "Hives spreading, no airway compromise yet" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
          trigger:
            - call: "POST /health-office/administration-records/stock-emergency"
              payload: { visit_id: "${visit_id}", medication_code: "EPINEPHRINE", units: 1 }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_NO_ELIGIBLE_LOT"
            - "data.error_id != ERR_INSUFFICIENT_STOCK"
            - "MedicationStockLot.${lot_ns_id}.quantity_on_hand == 5"
            - "MedicationStockLot.${lot_ns_id}.quantity_reserved == 0"
            - "MedicationStockLot.${lot_ns_id}.status == AVAILABLE"
            - "HealthVisit.${visit_id}.pending_administration_count == 0"
            - "School.${sch_id}.epinephrine_days_of_supply == 16.67"
            - "School.${sch_id}.stock_protocol_status == DEPLETED"

  - rule_id: cross_entity_state_dependency
    instances:

      - name: visit_creation_gated_by_school_coverage_posture
        grounds:
          - validations[priority=18]
          - errors[ERR_SCHOOL_COVERAGE_UNAVAILABLE]
          - calculations.school_coverage_posture
          - calculations.school_nurse_coverage_ratio
          - state_machines.HealthVisit.null_to_OPEN
          - entities.School.fields.coverage_posture
        distinguishing_aspect: |
          Entity pair = HealthVisit depends on School: the null -> OPEN transition
          is refused while School.coverage_posture is UNCOVERED (no ACTIVE
          CoverageAssignment means delivered_weekly_minutes 0 and a null DELIVERED
          ratio), and the identical request succeeds the moment a coverage block
          lifts the same School to LIMITED. Nothing about the Student or the visit
          payload changes between the two attempts.
        test_recipe:
          setup:
            - "School JAC11 with one ENROLLED student and one RN, but NO CoverageAssignment at all, so delivered_weekly_minutes is 0, delivered_students_per_nurse_fte is null and coverage_posture is UNCOVERED."
            - "No medication stock lots, so stock_protocol_status is DEPLETED."
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Jackson Elementary", building_code: "JAC11", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/nurses"
              payload: { full_name: "Rita Nolan", credential: "RN", weekly_contracted_minutes: 2400, delegation_authorized: false }
              as: DistrictHealthAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Noor Rahim", grade_level: 2, date_of_birth: "2018-06-30T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT" }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "GET /health-office/schools/${sch_id}"
              payload: {}
              as: DistrictHealthAdmin
              captures: { posture_before: $.data.coverage_posture }
          trigger:
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "ILLNESS", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { err: $.data.error_id }
            - call: "POST /health-office/coverage-assignments"
              payload: { nurse_id: "${rn_id}", school_id: "${sch_id}", weekday: "MON", start_minute: 480, end_minute: 960, effective_from: "2026-07-01T00:00:00Z" }
              as: DistrictHealthAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /health-office/health-visits"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", nurse_id: "${rn_id}", complaint_code: "ILLNESS", acuity: "ROUTINE" }
              as: SchoolNurse
              as_user_id: "${rn_id}"
              captures: { visit_id: $.data.id, triage: $.data.triage_score }
          assert:
            - "Before the coverage block: School.${sch_id}.delivered_weekly_minutes == 0.0"
            - "Before the coverage block: School.${sch_id}.delivered_students_per_nurse_fte == null"
            - "Before the coverage block: School.${sch_id}.coverage_posture == UNCOVERED"
            - "First attempt: HTTP status == 409 and data.error_id == ERR_SCHOOL_COVERAGE_UNAVAILABLE"
            - "First attempt: School.${sch_id}.occupied_cot_count == 0"
            - "After the coverage block: School.${sch_id}.delivered_weekly_minutes == 480.0"
            - "After the coverage block: School.${sch_id}.delivered_students_per_nurse_fte == 4.38"
            - "After the coverage block: School.${sch_id}.coverage_posture == LIMITED"
            - "Second attempt: HTTP status == 201 and HealthVisit.${visit_id}.status == OPEN"
            - "Second attempt: HealthVisit.${visit_id}.triage_score == 26"
            - "Second attempt: School.${sch_id}.occupied_cot_count == 1"

      - name: return_to_class_gated_by_student_immunization_status
        grounds:
          - validations[priority=26]
          - errors[ERR_IMMUNIZATION_HOLD]
          - state_machines.HealthVisit.IN_ASSESSMENT_to_DISPOSITIONED
          - entities.Student.fields.immunization_status
          - entities.Student.fields.alert_flags
          - calculations.student_risk_scoring
        distinguishing_aspect: |
          Entity pair = HealthVisit depends on Student (a different pair from the
          HealthVisit/School instance): the IN_ASSESSMENT -> DISPOSITIONED
          RETURN_TO_CLASS branch is refused with ERR_IMMUNIZATION_HOLD while the
          Student row carries immunization_status NONCOMPLIANT on an ILLNESS
          encounter, and the identical dispose succeeds after PATCH
          /health-office/students/{id} flips that field to COMPLIANT.
