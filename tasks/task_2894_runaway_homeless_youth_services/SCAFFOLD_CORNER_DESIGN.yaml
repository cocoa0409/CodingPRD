      - name: critical_tier_screening_cannot_be_dispositioned_cleared
        claim_type: error_triggerability
        grounds:
          - validations[priority=18]
          - errors.ERR_SCREENING_CRITICAL_TIER
          - calculations.trafficking_risk_score
        distinguishing_aspect: "Indicator codes COMMERCIAL_SEX (40) and THIRD_PARTY_CONTROL (30) score 70, at or above CRITICAL_THRESHOLD 60, so CLEARED is refused with 422 ERR_SCREENING_CRITICAL_TIER while the very same row can still be dispositioned ESCALATED."
        test_recipe:
          setup:
            - "one youth with a SUBMITTED SafetyScreening carrying COMMERCIAL_SEX and THIRD_PARTY_CONTROL, so score 70 and tier CRITICAL"
          setup_api_calls:
            - call: "POST /ryhs/youths"
              payload: { legal_first_name: "Juno", legal_last_name: "Vasquez", date_of_birth: "2010-03-15", unaccompanied: true }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { crt_youth_id: $.data.id }
            - call: "POST /ryhs/youths/${crt_youth_id}/safety-screenings"
              payload: { indicator_codes: ["COMMERCIAL_SEX", "THIRD_PARTY_CONTROL"] }
              as: OutreachWorker
              as_user_id: "worker-1"
              captures: { crt_scr_id: $.data.id }
          trigger:
            - call: "POST /ryhs/safety-screenings/${crt_scr_id}/disposition"
              payload: { disposition: "CLEARED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { crt_err_id: $.data.error_id }
            - call: "POST /ryhs/safety-screenings/${crt_scr_id}/disposition"
              payload: { disposition: "ESCALATED", specialized_response_code: "ADVOCATE_ASSIGNED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "the CLEARED attempt returns HTTP 422 with error_id ERR_SCREENING_CRITICAL_TIER"
            - "SafetyScreening.${crt_scr_id}.score == 70"
            - "SafetyScreening.${crt_scr_id}.tier == CRITICAL"
            - "immediately after the refused CLEARED, SafetyScreening.${crt_scr_id}.status == SUBMITTED"
            - "the ESCALATED disposition returns HTTP 200 and SafetyScreening.${crt_scr_id}.status == ESCALATED"
            - "Youth.${crt_youth_id}.risk_posture == FROZEN"

