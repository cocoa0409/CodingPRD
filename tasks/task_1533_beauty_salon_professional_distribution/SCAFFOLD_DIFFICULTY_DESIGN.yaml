# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: education_accrual_provisional_vs_final
        grounds:
          - calculations.education_credit_accrual
          - entities.SalonAccount.fields.education_credit_points
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Order.SHIPPED_to_DELIVERED
        distinguishing_aspect: |
          Same order data, two accrual variants diverge: the provisional variant uses the
          tier at submit (GOLD, multiplier 2 -> 180 points), the final variant uses the tier
          at delivery (PLATINUM, multiplier 3 -> 270 points). Entity domain: order-driven
          education-credit accrual on SalonAccount (vs consultant compensation in the
          sibling instance).
        test_recipe:
          setup:
            - "ACTIVE salon in GOLD tier; one RETAIL product base_price_cents 10000"
            - "Order of 10 units submitted (merch 90000, provisional accrual 180 points posted)"
            - "Salon tier overridden to PLATINUM before delivery"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C One", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon A", territory_code: "CA", assigned_consultant_id: "${c_id}" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-A-1", issuing_state: "CA", license_type: COSMETOLOGY, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: DistributionAdmin, captures: { s_v1: "$.data.version" } }
            - { call: "POST /api/salon-accounts/${s_id}/tier-override", payload: { tier: GOLD, expected_salon_account_version: "${s_v1}" }, as: DistributionAdmin }
            - { call: "POST /api/brands", payload: { name: "BrandX" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-A", name: "Shampoo", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 10000, weight_grams: 250 }, as: DistributionAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p_id}", quantity: 10 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /api/orders/${o_id}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: DistributionAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /api/salon-accounts/${s_id}/tier-override", payload: { tier: PLATINUM, expected_salon_account_version: "${s_v2}" }, as: DistributionAdmin }
            - { call: "POST /api/orders/${o_id}/approve", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/order-items?order_id=${o_id}", payload: {}, as: DistributionAdmin, captures: { it0: "$.data[0].id" } }
            - { call: "POST /api/orders/${o_id}/shipments", payload: { method: GROUND, items: [ { order_item_id: "${it0}", quantity: 10 } ] }, as: WarehouseOperator, captures: { sh_id: "$.data.id" } }
            - { call: "POST /api/shipments/${sh_id}/create-label", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${sh_id}/ship", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${sh_id}/deliver", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/salon-accounts/${s_id}/credit-ledger", payload: {}, as: DistributionAdmin }
          assert:
            - "SalonAccount.${s_id}.education_credit_points == 270"
            - "Ledger holds PROVISIONAL_ACCRUAL entry with points == 180 (floor(90000/1000) * GOLD 2 at submit)"
            - "Ledger holds FINAL_ACCRUAL entry with points == 90 (final 270 = floor(90000/1000) * PLATINUM 3, minus provisional 180)"
            - "SalonAccount.${s_id}.tier == PLATINUM"

      - name: consultant_commission_straight_vs_accelerator
        grounds:
          - calculations.consultant_commission
          - entities.SalesConsultant.fields.commission_accrued_cents
          - state_machines.Order.SHIPPED_to_DELIVERED
        distinguishing_aspect: |
          Two consultants with identical delivered order data (net_merch_cents 100000)
          receive different commissions: STRAIGHT pays round(100000 * 0.05) == 5000,
          ACCELERATOR (empty monthly volume) pays 100000 * 0.04 == 4000. Entity domain:
          SalesConsultant compensation (vs SalonAccount credit accrual in the sibling
          instance).
        test_recipe:
          setup:
            - "Two ACTIVE SILVER salons, salon S assigned to STRAIGHT consultant, salon A assigned to ACCELERATOR consultant"
            - "Each salon has a delivered order of 10 x RETAIL 10000-cent product (net_merch 100000 each)"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "CS", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { cs_id: "$.data.id" } }
            - { call: "POST /api/sales-consultants", payload: { full_name: "CA", territory_codes: ["CA"], commission_model: ACCELERATOR }, as: DistributionAdmin, captures: { ca_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon S", territory_code: "CA", assigned_consultant_id: "${cs_id}" }, as: SalesConsultant, as_user_id: "${cs_id}", captures: { ss_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${ss_id}/licenses", payload: { license_number: "LIC-S-1", issuing_state: "CA", license_type: BARBER, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${ss_id}", captures: { lic_s: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_s}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon A", territory_code: "CA", assigned_consultant_id: "${ca_id}" }, as: SalesConsultant, as_user_id: "${ca_id}", captures: { sa_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${sa_id}/licenses", payload: { license_number: "LIC-A-9", issuing_state: "CA", license_type: ESTHETICIAN, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${sa_id}", captures: { lic_a: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_a}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "BrandC" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-C", name: "Color Cream", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 10000, weight_grams: 100 }, as: DistributionAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${ss_id}", items: [ { product_id: "${p_id}", quantity: 10 } ] }, as: SalonBuyer, as_user_id: "${ss_id}", captures: { os_id: "$.data.id" } }
            - { call: "POST /api/orders/${os_id}/submit", payload: {}, as: SalonBuyer, as_user_id: "${ss_id}" }
            - { call: "POST /api/orders/${os_id}/approve", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/order-items?order_id=${os_id}", payload: {}, as: DistributionAdmin, captures: { its0: "$.data[0].id" } }
            - { call: "POST /api/orders/${os_id}/shipments", payload: { method: GROUND, items: [ { order_item_id: "${its0}", quantity: 10 } ] }, as: WarehouseOperator, captures: { shs: "$.data.id" } }
            - { call: "POST /api/shipments/${shs}/create-label", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${shs}/ship", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${shs}/deliver", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/orders", payload: { salon_account_id: "${sa_id}", items: [ { product_id: "${p_id}", quantity: 10 } ] }, as: SalonBuyer, as_user_id: "${sa_id}", captures: { oa_id: "$.data.id" } }
            - { call: "POST /api/orders/${oa_id}/submit", payload: {}, as: SalonBuyer, as_user_id: "${sa_id}" }
            - { call: "POST /api/orders/${oa_id}/approve", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/order-items?order_id=${oa_id}", payload: {}, as: DistributionAdmin, captures: { ita0: "$.data[0].id" } }
            - { call: "POST /api/orders/${oa_id}/shipments", payload: { method: GROUND, items: [ { order_item_id: "${ita0}", quantity: 10 } ] }, as: WarehouseOperator, captures: { sha: "$.data.id" } }
            - { call: "POST /api/shipments/${sha}/create-label", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${sha}/ship", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${sha}/deliver", payload: {}, as: WarehouseOperator }
          trigger:
            - { call: "GET /api/sales-consultants/${cs_id}", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/sales-consultants/${ca_id}", payload: {}, as: DistributionAdmin }
          assert:
            - "SalesConsultant.${cs_id}.commission_accrued_cents == 5000"
            - "SalesConsultant.${ca_id}.commission_accrued_cents == 4000"
            - "SalesConsultant.${ca_id}.commission_month_volume_cents == 100000"

  - rule_id: combinatorial_formula
    instances:
      - name: line_pricing_tier_variant_lifecycle_branches
        grounds:
          - calculations.line_unit_pricing
          - entities.OrderItem.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: three products priced for one GOLD salon take three
          different conditional branches - BACKBAR (tier then backbar discount:
          round(round(20000*0.9)*0.8) == 14400), RETAIL (tier only: round(20000*0.9) ==
          18000), LIQUIDATION week-0 (flat 20% off base, discounts replaced: 16000).
        test_recipe:
          setup:
            - "ACTIVE GOLD salon; brand with products P1 BACKBAR 20000 ACTIVE, P2 RETAIL 20000 ACTIVE, P3 RETAIL 20000 in LIQUIDATION (liquidation_started_at = default clock, week 0)"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C P", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon P", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-P-1", issuing_state: "CA", license_type: NAIL_TECH, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: DistributionAdmin, captures: { s_v: "$.data.version" } }
            - { call: "POST /api/salon-accounts/${s_id}/tier-override", payload: { tier: GOLD, expected_salon_account_version: "${s_v}" }, as: DistributionAdmin }
            - { call: "POST /api/brands", payload: { name: "BrandP" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-P1", name: "Backbar Liter", variant_type: BACKBAR, hazmat_class: NONE, base_price_cents: 20000, weight_grams: 1000 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-P2", name: "Retail Bottle", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 20000, weight_grams: 300 }, as: DistributionAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-P3", name: "Old Line", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 20000, weight_grams: 300 }, as: DistributionAdmin, captures: { p3: "$.data.id" } }
            - { call: "POST /api/products/${p3}/lifecycle", payload: { target_status: DISCONTINUED }, as: DistributionAdmin }
            - { call: "POST /api/products/${p3}/lifecycle", payload: { target_status: LIQUIDATION }, as: DistributionAdmin }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
          trigger:
            - { call: "GET /api/order-items?order_id=${o_id}", payload: {}, as: SalonBuyer, as_user_id: "${s_id}", captures: { i1u: "$.data[0].unit_price_cents" } }
            - { call: "GET /api/orders/${o_id}", payload: {}, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_v: "$.data.version" } }
            - { call: "POST /api/orders/${o_id}/items", payload: { product_id: "${p2}", quantity: 1, expected_order_version: "${o_v}" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { i2u: "$.data.unit_price_cents" } }
            - { call: "GET /api/orders/${o_id}", payload: {}, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_v2: "$.data.version" } }
            - { call: "POST /api/orders/${o_id}/items", payload: { product_id: "${p3}", quantity: 1, expected_order_version: "${o_v2}" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { i3u: "$.data.unit_price_cents" } }
            - { call: "GET /api/orders/${o_id}", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
          assert:
            - "P1 (BACKBAR, GOLD) unit_price_cents == 14400"
            - "P2 (RETAIL, GOLD) unit_price_cents == 18000"
            - "P3 (LIQUIDATION week 0) unit_price_cents == 16000 (no tier/backbar discounts)"
            - "Order.${o_id}.merchandise_total_cents == 48400"

      - name: order_total_round_per_unit_then_multiply
        grounds:
          - calculations.order_totals
          - entities.OrderItem.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order rounds the discounted unit price
          first (round_half_up(3333 * 0.9) == 3000), then multiplies (3000 * 3 == 9000).
          The alternative order (round(9999 * 0.9) == 8999) is observably wrong.
        test_recipe:
          setup:
            - "ACTIVE GOLD salon; RETAIL product base_price_cents 3333"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C R", territory_codes: ["TX"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon R", territory_code: "TX" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-R-1", issuing_state: "TX", license_type: SALON_BUSINESS, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: DistributionAdmin, captures: { s_v: "$.data.version" } }
            - { call: "POST /api/salon-accounts/${s_id}/tier-override", payload: { tier: GOLD, expected_salon_account_version: "${s_v}" }, as: DistributionAdmin }
            - { call: "POST /api/brands", payload: { name: "BrandR" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-R1", name: "Serum", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 3333, weight_grams: 100 }, as: DistributionAdmin, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p_id}", quantity: 3 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
            - { call: "GET /api/order-items?order_id=${o_id}", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "GET /api/orders/${o_id}", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
          assert:
            - "OrderItem.unit_price_cents == 3000 (round_half_up(3333 * 0.9) = round_half_up(2999.7))"
            - "OrderItem.line_total_cents == 9000 (3000 * 3; NOT round(9999 * 0.9) = 8999)"
            - "Order.${o_id}.merchandise_total_cents == 9000"

      - name: credit_cap_net_accrual_evaluation_order
        grounds:
          - calculations.credit_redemption_cap
          - calculations.education_credit_accrual
          - entities.Order.fields.credit_applied_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency, pinned order merch -> cap -> applied ->
          net -> accrual: merch 120000, requested 600 points = 60000 cents equals the
          50% cap (60000) so it applies; net 60000; provisional accrual uses the NET
          (floor(60000/1000)*1 == 60), never the gross (which would give 120).
        test_recipe:
          setup:
            - "ACTIVE SILVER salon with education_credit_points == 1000 from a delivered 1000000-cent order"
            - "Second DRAFT order with merch 120000 and a 600-point redemption applied"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C K", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon K", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-K-1", issuing_state: "CA", license_type: COSMETOLOGY, valid_until: "2028-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "BrandK" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-K1", name: "Pro Kit", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 100000, weight_grams: 900 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-K2", name: "Mask", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 20000, weight_grams: 200 }, as: DistributionAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 10 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o1: "$.data.id" } }
            - { call: "POST /api/orders/${o1}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "POST /api/orders/${o1}/approve", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/order-items?order_id=${o1}", payload: {}, as: DistributionAdmin, captures: { it1: "$.data[0].id" } }
            - { call: "POST /api/orders/${o1}/shipments", payload: { method: GROUND, items: [ { order_item_id: "${it1}", quantity: 10 } ] }, as: WarehouseOperator, captures: { sh1: "$.data.id" } }
            - { call: "POST /api/shipments/${sh1}/create-label", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${sh1}/ship", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/shipments/${sh1}/deliver", payload: {}, as: WarehouseOperator }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p2}", quantity: 6 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o2: "$.data.id" } }
            - { call: "POST /api/orders/${o2}/redeem-credits", payload: { points: 600 }, as: SalonBuyer, as_user_id: "${s_id}" }
          trigger:
            - { call: "POST /api/orders/${o2}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "GET /api/orders/${o2}", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: DistributionAdmin }
          assert:
            - "Order.${o2}.credit_applied_cents == 60000 (600 points at the exact 50% cap of 120000)"
            - "Order.${o2}.net_merch_cents == 60000"
            - "PROVISIONAL_ACCRUAL for order ${o2} == 60 points (floor(60000/1000) * SILVER 1, computed on net, not gross)"
            - "SalonAccount.${s_id}.education_credit_points == 460 (1000 - 600 + 60)"

  - rule_id: non_linear_state_machine
    instances:
      - name: salon_suspend_reinstate_cycle
        grounds:
          - state_machines.SalonAccount.ACTIVE_to_SUSPENDED
          - state_machines.SalonAccount.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic shape on SalonAccount: ACTIVE -> SUSPENDED -> ACTIVE is legal (manual
          suspend followed by reinstate with a still-valid license), and
          suspension_reason is set then cleared across the cycle. Entity: SalonAccount
          (vs Order's parallel dimensions in the sibling instance).
        test_recipe:
          setup:
            - "ACTIVE salon with a VERIFIED license valid until 2027-06-01"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C Y", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon Y", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-Y-1", issuing_state: "CA", license_type: BARBER, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /api/salon-accounts/${s_id}/suspend", payload: { reason: "manual audit" }, as: ComplianceOfficer }
            - { call: "POST /api/salon-accounts/${s_id}/reinstate", payload: {}, as: ComplianceOfficer }
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "After suspend: SalonAccount.status == SUSPENDED with suspension_reason == MANUAL"
            - "After reinstate: SalonAccount.status == ACTIVE and suspension_reason == null"
            - "SalonAccount.version advanced by exactly 2 across suspend+reinstate (one increment per mutation)"

      - name: order_payment_fulfillment_parallel_dimensions
        grounds:
          - state_machines.Order.DRAFT_to_SUBMITTED
          - state_machines.Order.SUBMITTED_to_APPROVED
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on one Order entity: fulfillment_status and
          payment_status evolve independently - submit moves (DRAFT -> SUBMITTED) x
          (UNPAID -> AUTHORIZED); approve moves fulfillment to APPROVED and payment to
          CAPTURED; a buyer cancel from SUBMITTED lands (CANCELLED, VOIDED) without ever
          passing through CAPTURED. Entity: Order (vs SalonAccount's cycle above).
        test_recipe:
          setup:
            - "ACTIVE SILVER salon; one RETAIL product base_price_cents 5000"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C D", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon D", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-D-1", issuing_state: "CA", license_type: COSMETOLOGY, valid_until: "2027-06-01T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "BrandD" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-D1", name: "Gel", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 5000, weight_grams: 150 }, as: DistributionAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p_id}", quantity: 2 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o1: "$.data.id" } }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p_id}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o2: "$.data.id" } }
          trigger:
            - { call: "POST /api/orders/${o1}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "POST /api/orders/${o1}/approve", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/orders/${o2}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "POST /api/orders/${o2}/cancel", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "GET /api/orders/${o1}", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/orders/${o2}", payload: {}, as: DistributionAdmin }
          assert:
            - "Order.${o1}: fulfillment_status == APPROVED AND payment_status == CAPTURED"
            - "Order.${o2}: fulfillment_status == CANCELLED AND payment_status == VOIDED (AUTHORIZED voided, never CAPTURED)"
            - "Order.${o1}.grand_total_cents == 10000 (SILVER, no shipping yet)"

  - rule_id: transitive_cascade
    instances:
      - name: license_expiry_suspension_cascade
        grounds:
          - state_machines.ProfessionalLicense.VERIFIED_to_EXPIRED
          - state_machines.SalonAccount.ACTIVE_to_SUSPENDED
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - state_machines.PromotionRedemption.APPLIED_to_REVERSED
        distinguishing_aspect: |
          Depth-4 cascade triggered by the ops sweep (license expiry): license EXPIRED
          -> salon SUSPENDED -> SUBMITTED order CANCELLED (payment VOIDED) -> the
          order's APPLIED redemption REVERSED (budget restored 3 -> 5) and its
          provisional accrual reversed (points 10 -> 0). Trigger: POST
          /api/ops/run-daily-sweep (vs diversion substantiation in the sibling instance).
        test_recipe:
          setup:
            - "ACTIVE SILVER salon whose only license expires 2026-08-10; SAMPLE promotion budget 5 activated; order (1 x RETAIL 10000) has the promotion redeemed (2 sample units, budget -> 3) and is SUBMITTED (provisional accrual 10 points)"
            - "Logical clock advanced to 2026-08-15"
          setup_api_calls:
            - { call: "POST /api/sales-consultants", payload: { full_name: "C E", territory_codes: ["CA"], commission_model: STRAIGHT }, as: DistributionAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts", payload: { legal_name: "Salon E", territory_code: "CA" }, as: SalesConsultant, as_user_id: "${c_id}", captures: { s_id: "$.data.id" } }
            - { call: "POST /api/salon-accounts/${s_id}/licenses", payload: { license_number: "LIC-E-1", issuing_state: "CA", license_type: COSMETOLOGY, valid_until: "2026-08-10T00:00:00Z" }, as: SalonBuyer, as_user_id: "${s_id}", captures: { lic_id: "$.data.id" } }
            - { call: "POST /api/licenses/${lic_id}/verify", payload: {}, as: ComplianceOfficer }
            - { call: "POST /api/brands", payload: { name: "BrandE" }, as: DistributionAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-E1", name: "Cream", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 10000, weight_grams: 200 }, as: DistributionAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/products", payload: { brand_id: "${b_id}", sku: "SKU-E2", name: "Sample Sachet", variant_type: RETAIL, hazmat_class: NONE, base_price_cents: 500, weight_grams: 10 }, as: DistributionAdmin, captures: { p2: "$.data.id" } }
            - { call: "POST /api/promotions", payload: { code: "SAMP1", promo_type: SAMPLE, eligible_tiers: [SILVER], starts_at: "2026-07-01T00:00:00Z", ends_at: "2027-01-01T00:00:00Z", budget_units: 5, per_salon_cap: 10, sample_product_id: "${p2}", sample_units_per_redemption: 2 }, as: DistributionAdmin, captures: { promo: "$.data.id" } }
            - { call: "POST /api/promotions/${promo}/activate", payload: {}, as: DistributionAdmin }
            - { call: "POST /api/orders", payload: { salon_account_id: "${s_id}", items: [ { product_id: "${p1}", quantity: 1 } ] }, as: SalonBuyer, as_user_id: "${s_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /api/orders/${o_id}/redeem-promotion", payload: { code: "SAMP1" }, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "POST /api/orders/${o_id}/submit", payload: {}, as: SalonBuyer, as_user_id: "${s_id}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: DistributionAdmin }
          trigger:
            - { call: "POST /api/ops/run-daily-sweep", payload: {}, as: DistributionAdmin, captures: { sweep_lic: "$.data.expired_license_count", sweep_susp: "$.data.suspended_salon_count" } }
            - { call: "GET /api/salon-accounts/${s_id}", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/orders/${o_id}", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/promotions/${promo}", payload: {}, as: DistributionAdmin }
            - { call: "GET /api/promotion-redemptions?order_id=${o_id}", payload: {}, as: DistributionAdmin }
          assert:
            - "Sweep result: expired_license_count == 1 and suspended_salon_count == 1"
            - "ProfessionalLicense.${lic_id}.status == EXPIRED"
            - "SalonAccount.${s_id}.status == SUSPENDED with suspension_reason == LICENSE_EXPIRED"
            - "Order.${o_id}.fulfillment_status == CANCELLED and payment_status == VOIDED"
            - "Promotion.${promo}.remaining_budget_units == 5 (2 units restored)"
            - "The redemption for order ${o_id} has status == REVERSED with reversal_reason == ACCOUNT_SUSPENDED"
            - "SalonAccount.${s_id}.education_credit_points == 0 (provisional 10 reversed)"

      - name: diversion_substantiation_strike_cascade
        grounds:
          - state_machines.DiversionCase.UNDER_REVIEW_to_SUBSTANTIATED
          - state_machines.SalonAccount.ACTIVE_to_SUSPENDED
          - state_machines.Order.SUBMITTED_to_CANCELLED
          - calculations.diversion_risk_score
        distinguishing_aspect: |
          Depth-3 cascade triggered by compliance adjudication: the second MAJOR
          substantiation pushes diversion_strike_points to 4 (>= 3) -> salon SUSPENDED
          (DIVERSION_STRIKES) -> SUBMITTED order CANCELLED with provisional accrual
          reversed. Trigger: POST /api/diversion-cases/{id}/substantiate (vs ops sweep
          in the sibling instance).
        test_recipe:
          setup:
