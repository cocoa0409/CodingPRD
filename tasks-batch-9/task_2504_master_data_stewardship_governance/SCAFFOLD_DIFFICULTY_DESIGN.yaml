  - rule_id: boundary_precision_check
    instances:
      - name: measured_pct_exactly_at_threshold_earns_full_weight
        grounds:
          - calculations.domain_quality_scorecard
          - calculations.domain_posture_recompute
          - entities.QualityFinding.fields.gap_pct
        distinguishing_aspect: |
          measured_pct exactly equal to threshold_pct is a PASS that earns the full
          weight_points (weighted_score 100.00, zero findings). One point below the threshold
          switches to the proportional branch and the per-rule rounding produces 98.90, not
          99.00 or 98.89 - so the boundary is tested from both sides with the rounding mode
          visible in the delta.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER ACTIVE / OPEN with exactly one ACTIVE quality rule QR1 (weight_points 40, threshold_pct 90.00, severity HIGH, dimension COMPLETENESS)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
