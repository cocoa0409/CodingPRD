  - rule_id: boundary_precision_check
    instances:
      # ---- Instance 1: surge tier >= boundary (demand 4 vs 5) on POST /orders ----
      - name: surge_tier_boundary_demand_5_inclusive
        grounds:
          - calculations.delivery_fee_quote
          - entities.Zone.fields.surge_tier_1_demand
          - entities.Order.fields.surge_multiplier_applied
        distinguishing_aspect: |
          Numeric-threshold metric on POST /orders: demand exactly equal to
          surge_tier_1_demand (5) triggers tier-1 (>= boundary is inclusive) -> multiplier
          1.25, while the 4th order (demand 4) stays tier-0 (1.0). Boundary is >= not >.
        test_recipe:
          setup:
            - "Zone DT (tier1 at 5). Four prior PLACED orders, then a 5th measured order so its placement sees demand exactly 5."
          setup_api_calls:
            - call: "POST /zones"
