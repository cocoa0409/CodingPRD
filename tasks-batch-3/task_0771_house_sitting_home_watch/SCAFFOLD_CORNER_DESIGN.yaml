  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: key_checkout_no_copies_available_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=17]", "errors[ERR_NO_KEY_COPIES_AVAILABLE]"]
        distinguishing_aspect: "With key_copies_total 1 and one copy already CHECKED_OUT, checking out a second assignment returns ERR_NO_KEY_COPIES_AVAILABLE 409."
        test_recipe:
          setup: ["Property with key_copies_total 1; two AT_OFFICE key assignments; the first has been checked out."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/key-assignments"
              payload: { property_id: "${prop_id}", sitter_id: "${st_id}", booking_id: "${bk_id}" }
              as: Coordinator
              captures: { key1_id: $.data.id }
            - call: "POST /home-watch/key-assignments"
              payload: { property_id: "${prop_id}", sitter_id: "${st_id}", booking_id: "${bk_id}" }
              as: Coordinator
              captures: { key2_id: $.data.id }
            - call: "POST /home-watch/key-assignments/${key1_id}/check-out"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /home-watch/key-assignments/${key2_id}/check-out"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_NO_KEY_COPIES_AVAILABLE"
            - "Property.${prop_id}.available_key_copies == 0"

      - name: report_lost_at_office_key_returns_409
        claim_type: Violation → Error
        grounds: [state_machines.KeyAssignment.CHECKED_OUT_to_LOST, "errors[ERR_KEY_NOT_CHECKED_OUT]"]
        distinguishing_aspect: "report-lost on an AT_OFFICE (never checked out) key returns ERR_KEY_NOT_CHECKED_OUT 409."
        test_recipe:
          setup: ["A key assignment exists in AT_OFFICE."]
          setup_api_calls:
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/key-assignments"
              payload: { property_id: "${prop_id}", sitter_id: "${st_id}", booking_id: "${bk_id}" }
              as: Coordinator
              captures: { key_id: $.data.id }
          trigger:
            - call: "POST /home-watch/key-assignments/${key_id}/report-lost"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_KEY_NOT_CHECKED_OUT"
            - "KeyAssignment.${key_id}.status == AT_OFFICE"

      - name: pay_draft_invoice_not_issued_returns_409
        claim_type: Violation → Error
        grounds: [state_machines.Invoice.ISSUED_to_PAID, "errors[ERR_INVOICE_NOT_ISSUED]"]
        distinguishing_aspect: "Paying an invoice still in DRAFT (booking only SCHEDULED, not activated) returns ERR_INVOICE_NOT_ISSUED 409."
        test_recipe:
          setup: ["Sitter CLEARED + BOND assigned to a VACATION booking (SCHEDULED); its invoice is DRAFT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
            - call: "POST /home-watch/properties"
              payload: { client_id: "${cl_id}", label: "Cabin", address: "1 Lake Rd", size_tier: "SMALL", has_pets: false, checklist_config: ["MAIL"], center_lat: 40.0, center_lng: -70.0, key_copies_total: 1 }
              as: Coordinator
              captures: { prop_id: $.data.id }
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
              as: Coordinator
              captures: { st_id: $.data.id }
            - call: "POST /home-watch/background-checks"
              payload: { sitter_id: "${st_id}", provider_ref: "PRV-1", expires_at: "2027-01-01T00:00:00Z" }
              as: Coordinator
              captures: { bg_id: $.data.id }
            - call: "POST /home-watch/background-checks/${bg_id}/decide"
              payload: { decision: "CLEARED" }
              as: Coordinator
            - call: "GET /home-watch/sitters/${st_id}"
              payload: {}
              as: Coordinator
              captures: { st_v: $.data.version }
            - call: "POST /home-watch/coverage-policies"
              payload: { sitter_id: "${st_id}", policy_type: "BOND", coverage_amount_cents: 1000000, effective_from: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z", expected_sitter_version: "${st_v}" }
              as: Coordinator
            - call: "POST /home-watch/bookings"
              payload: { property_id: "${prop_id}", booking_type: "VACATION", start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-01T00:00:00Z", base_visit_rate_cents: 4000 }
              as: Coordinator
              captures: { bk_id: $.data.id }
            - call: "POST /home-watch/bookings/${bk_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /home-watch/bookings/${bk_id}/assign"
              payload: { sitter_id: "${st_id}" }
              as: Coordinator
            - call: "GET /home-watch/invoices?booking_id=${bk_id}"
              payload: {}
              as: Coordinator
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /home-watch/invoices/${inv_id}/pay"
              payload: {}
              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVOICE_NOT_ISSUED"
            - "Invoice.${inv_id}.status == DRAFT"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: sitter_cannot_create_client_returns_unauthorized
        claim_type: peer_roles
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /home-watch/clients as a Sitter (a Coordinator-exclusive op) returns ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["A sitter exists to act as."]
          setup_api_calls:
            - call: "POST /home-watch/sitters"
              payload: { full_name: "Sam", email: "sam@x.com" }
