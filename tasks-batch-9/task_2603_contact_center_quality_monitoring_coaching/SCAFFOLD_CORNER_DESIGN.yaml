              as_user_id: "${ev1}"
            - call: "POST /agents/${ag1}/recognition"
              payload: { award_code: "QUARTERLY_STAR", points: 50 }
              as: QualityManager
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i4}", source: "RANDOM" }
              as: QualityManager
              captures: { sel4: $.data.id }
            - call: "POST /sample-selections/${sel4}/assign"
              payload: { assigned_evaluator_id: "${ev1}", review_window_start: "2026-08-05T12:00:00Z", review_window_end: "2026-08-05T13:00:00Z" }
              as: QualityManager
            - call: "POST /evaluations"
              payload: { selection_id: "${sel4}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e4: $.data.id }
            - call: "POST /evaluations/${e4}/submit"
              payload: { item_scores: { DISCLOSE: 5, GREET: 4, RESOLVE: 5, SURVEY: 4 } }
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "GET /agents/${ag1}"
              payload: {}
              as: Supervisor
            - call: "POST /agents/${ag1}/recognition"
              payload: { award_code: "QUARTERLY_STAR", points: 50 }
              as: QualityManager
          assert:
            - "after trigger 1: Evaluation.${e1}.weighted_score == 93.00, compliance_result == PASS, and Agent.${ag1}.consecutive_passing_evaluations == 1 with quality_index_rolling == 93.00"
            - "after trigger 5: Evaluation.${e2}.weighted_score == 82.00 with compliance_result == PASS and auto_fail_triggered == false, yet Agent.${ag1}.consecutive_passing_evaluations == 0 -- the streak breaks on score < 85.00 exactly like it would on a FAIL, while coaching_state stays NONE and open_compliance_findings stays 0 because nothing failed compliance"
            - "after trigger 9: Evaluation.${e3}.weighted_score == 90.00 and consecutive_passing_evaluations == 1 -- restarted, NOT 2: the 82.00 in between is not skipped over"
            - "after trigger 9 the rolling index is (93.00 + 82.00 + 90.00) / 3 == 88.33"
            - "trigger 10 -> HTTP 422 ERR_RECOGNITION_THRESHOLD_NOT_MET at 88.33 < RECOGNITION_MIN_INDEX 92.00, and Agent.${ag1}.recognition_points stays 0"
            - "after trigger 14: Evaluation.${e4}.weighted_score == 93.00, consecutive_passing_evaluations == 2, and the ROLLING_4 index is (93.00 + 82.00 + 90.00 + 93.00) / 4 == 89.50"
            - "trigger 16 -> HTTP 422 ERR_RECOGNITION_THRESHOLD_NOT_MET again: a streak of 2 does not buy recognition, because validations[priority=53] reads quality_index_rolling (89.50) and never the streak"
            - "GET /sample-plans/${pl1} shows sample_quota_attainment consumed 4 / remaining 0 and targeted_reserved_count 0 -- no submit failed compliance, so the targeted reserve never fired"
            - "GET /evaluators/${ev1} shows open_assignment_count 0: each submit released the assignment before the next one was made, which is why max_open_assignments 3 was never breached across four sequential reviews"
      - name: complexity_submit_cascade_three_hops
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: "transitive_cascade / cascade_submit_autofail_reserves_targeted_sampling_slot"
          rationale: "The three-hop submit cascade (Interaction.compliance_hold -> Agent.open_compliance_findings and coaching_state -> the OPEN plan's targeted reserve) is exercised end to end by that §1.8 instance, including the conditional hop that leaves EVALUATED selections untouched and the reserve arithmetic on the plan. Re-testing the same hops here would duplicate its asserts without adding a distinguishing angle; the consistency_model instance below only checks that the hops are visible on the first read, not what they compute."
      - name: complexity_dual_variant_score_and_index
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: "dual_variant_calc / dual_variant_evaluation_na_renormalized_vs_fixed_denominator"
          rationale: "Both declared dual-variant pairs are already pinned by §1.8: the evaluation score's RENORMALIZED vs FIXED_DENOMINATOR treatment of an NA item (78.82 vs 82.00 on the same item_scores) by that instance, and the rolling vs duration-weighted quality index by dual_variant_agent_index_rolling_vs_duration_weighted. A §1.9 instance would have to reuse the identical fixtures to say anything, so the breadth walk defers to them."

  # =========================================================================
  # 9. From Table 9 (Consistency Model)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: consistency_submit_response_and_first_reads_already_show_every_hop
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /evaluations/{id}/submit]
          - endpoints[GET /interactions/{id}]
          - endpoints[GET /agents/{id}]
          - endpoints[GET /sample-plans/{id}]
          - endpoints[GET /agents/{id}/quality-summary]
          - calculations.evaluation_weighted_score
          - calculations.agent_quality_index
        distinguishing_aspect: "One write fans out to five entities, and the model is immediate: the submit response body itself already carries the computed scores and the compliance verdict, and the very first read of each downstream row -- no retry, no polling, no second request to settle -- shows the finished hop. Even the two purely computed reads (the agent's persisted rolling index and the never-persisted quality-summary projection) agree with each other on the first attempt, and every parent's version counter has already moved when it is first read."
        test_recipe:
          setup:
            - "canonical prelude up to a DRAFT evaluation; the parents' pre-submit versions are captured so the post-submit reads can be compared against them rather than against assumed absolute numbers"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Care Quality", version_label: "2026.08", auto_fail_policy: "COMPLIANCE_SECTION_ZERO", min_compliance_item_score: 3, behaviors: [ { code: "DISCLOSE", label: "Disclosures", weight_pct: 30.00, max_points: 5, compliance_critical: true, auto_fail_on_violation: true, guidance_text: "State the recording disclosure." }, { code: "GREET", label: "Greeting", weight_pct: 20.00, max_points: 5, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Resolution", weight_pct: 35.00, max_points: 5, guidance_text: "Resolve or set a next step." }, { code: "SURVEY", label: "Survey", weight_pct: 15.00, max_points: 5, allows_not_applicable: true, guidance_text: "Invite to the survey." } ] }
              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Eve Evaluator", max_open_assignments: 3 }
              as: QualityManager
              captures: { ev1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 4, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id }
            - call: "POST /interactions/${i1}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
              captures: { iv0: $.data.version }
            - call: "POST /sample-plans"
              payload: { form_id: "${f1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", per_agent_target_volume: 4, source_mix: { random_pct: 100, targeted_pct: 0, customer_flagged_pct: 0 } }
              as: QualityManager
              captures: { pl1: $.data.id }
            - call: "POST /sample-plans/${pl1}/open"
              payload: {}
              as: QualityManager
              captures: { plv0: $.data.version }
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i1}", source: "RANDOM" }
              as: QualityManager
              captures: { sel1: $.data.id }
            - call: "POST /sample-selections/${sel1}/assign"
              payload: { assigned_evaluator_id: "${ev1}", review_window_start: "2026-08-05T09:00:00Z", review_window_end: "2026-08-05T11:00:00Z" }
              as: QualityManager
              captures: { selv0: $.data.version }
            - call: "GET /agents/${ag1}"
              payload: {}
              as: Supervisor
              captures: { agv0: $.data.version }
            - call: "POST /evaluations"
              payload: { selection_id: "${sel1}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e1: $.data.id }
            - call: "GET /evaluators/${ev1}"
              payload: {}
              as: QualityManager
              captures: { evoc0: $.data.open_assignment_count }
          trigger:
            - call: "POST /evaluations/${e1}/submit"
              payload: { item_scores: { DISCLOSE: 0, GREET: 4, RESOLVE: 3, SURVEY: 5 } }
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "GET /interactions/${i1}"
              payload: {}
              as: ComplianceAuditor
            - call: "GET /agents/${ag1}"
              payload: {}
              as: Supervisor
            - call: "GET /sample-selections/${sel1}"
              payload: {}
              as: QualityManager
            - call: "GET /sample-plans/${pl1}"
              payload: {}
              as: QualityManager
            - call: "GET /evaluators/${ev1}"
              payload: {}
              as: QualityManager
            - call: "GET /agents/${ag1}/quality-summary"
              payload: {}
              as: Supervisor
            - call: "GET /evaluations/${e1}"
              payload: {}
              as: QualityEvaluator
              as_user_id: "${ev1}"
          assert:
            - "setup sanity -- ${evoc0} == 1 (the assignment is open) and ${agv0} == 1"
            - "trigger 1 response body ALONE already carries the finished computation: weighted_score == 52.00, raw_weighted_score == 52.00, auto_fail_triggered == true, compliance_result == FAIL, review_status == SUBMITTED, submitted_at == \"2026-08-05T09:00:00Z\" -- no follow-up read is needed to learn the verdict (DISCLOSE 0 zeroes the 30.00 compliance section, leaving 16.00 + 21.00 + 15.00)"
            - "trigger 2, the FIRST read of the interaction, shows compliance_hold == true and version == ${iv0} + 1 -- hop 1 is not deferred"
            - "trigger 3, the FIRST read of the agent, shows open_compliance_findings == 1, coaching_state == REQUIRED, consecutive_passing_evaluations == 0, quality_index_rolling == 52.00 and version == ${agv0} + 1 -- hop 2 and the index recomputation are both already in place"
            - "trigger 4 shows SampleSelection.${sel1}.status == EVALUATED with version == ${selv0} + 1"
            - "trigger 5 shows the plan's targeted_reserve_by_agent[${ag1}] == 1, targeted_reserved_count == 1, sample_quota_attainment consumed 1 / remaining 3, and version == ${plv0} + 1 -- hop 3 landed in the same request"
            - "trigger 6 shows open_assignment_count == 0, down from ${evoc0} == 1 with no settling delay"
            - "trigger 7, the never-persisted projection, agrees with the persisted field on the first attempt: quality_index_rolling == 52.00, evaluations_considered == 1, paired_sample_size == 1, repeat_contact_rate == 0.00, and both csat_gap_paired and csat_gap_all are null because the high partition (effective_score >= 85.00) is empty"
            - "trigger 8 re-reads the evaluation and returns byte-identical scores and states to trigger 1's response body -- the write response is not an optimistic projection that a later read corrects"
            - "no assertion in this recipe requires a retry, a sleep or a second attempt: any implementation that queues the cascade and answers 200 before it completes fails trigger 2, 3 or 5 on the first read"
