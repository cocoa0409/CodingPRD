      - name: enrollment_create_rejects_a_stale_winery_version_before_it_can_supersede_an_unseen_row
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.enrollment-create-stale-winery
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/dtc/carrier-enrollments
          - entities.Winery.fields.version
          - state_machines.CarrierEnrollment
        distinguishing_aspect: |
          §1.2.1's second rule guards POST /dtc/carrier-enrollments on expected_winery_version, and the
          reason is destructive rather than arithmetical: the create silently supersedes the winery's prior
          enrollment on the same program. A client working from a stale read would suspend a row it never saw, so
          the write is refused. The instance also pins which writes do and do not advance the guard: the create
          does (1 -> 2 -> 3), the carrier's APPROVED decision does not, so the same stale value is refused twice
          while the version sits still.
        test_recipe:
          setup:
            - "Estate 1 exists at version 1 with an ACTIVE TX permit and a GSO program serving TX, but no enrollment yet. Clock 2026-08-01."
            - "The winery is never suspended, reinstated or cascaded during the trigger, so the only writes that can move Winery.version are the enrollment creates themselves."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
              as: PlatformAdmin
              captures: { w_id: $.data.id }
            - call: "POST /dtc/state-rules"
              payload: { state_code: "TX", allows_dtc: true, per_consumer_limit_liters: 27.000, per_consumer_period: "ROLLING_12_MONTHS", per_winery_annual_limit_liters: 5000.000, excise_rate_per_liter_cents: 55, large_format_surcharge_cents_per_liter: 20, excise_cap_cents_per_shipment: 100000, sales_tax_rate_bps: 825, tax_on_shipping: true, excise_in_tax_base: false, adult_signature_required: true, requires_carrier_program: true, reporting_frequency: "MONTHLY", zero_filing_required: true, min_purchaser_age: 21, renewal_lead_days: 45 }
              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "TX", permit_number: "TX-DTC-1", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
              captures: { p_tx_id: $.data.id }
            - call: "POST /dtc/state-permits/${p_tx_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "POST /dtc/carrier-programs"
              payload: { carrier_code: "GSO", program_name: "Wine Shipper TX", states_served: ["TX"], requires_enrollment: true, adult_signature_service_code: "AS21" }
              as: PlatformAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /dtc/consumers"
              payload: { full_name: "Ada Buyer", email: "ada@example.com", birthdate: "1985-04-02", address_line: "12 Vine St", city: "Austin", state_code: "TX", zip_code: "78701" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /dtc/consumers/${c_id}/id-verification"
              payload: { id_verification_method: "DOCUMENT" }
              as: ComplianceOfficer
              as_user_id: "officer_a"
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
              captures: { w_v1: $.data.version }
          trigger:
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ce1_id: $.data.id }
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1B", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
            - call: "POST /dtc/carrier-enrollments/${ce1_id}/decision"
              payload: { decision: "APPROVED" }
              as: CarrierAgent
              as_user_id: "agent_1"
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-1C", expected_winery_version: "${w_v1}" }
              as: WineryOperator
              as_user_id: "${w_id}"
            - call: "GET /dtc/wineries/${w_id}"
              payload: {}
              as: PlatformAdmin
              captures: { w_v2: $.data.version }
            - call: "POST /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}", carrier_program_id: "${cp_id}", account_number: "ACCT-2", expected_winery_version: "${w_v2}" }
              as: WineryOperator
              as_user_id: "${w_id}"
              captures: { ce2_id: $.data.id }
            - call: "GET /dtc/carrier-enrollments"
              payload: { winery_id: "${w_id}" }
              as: PlatformAdmin
          assert:
            - "the first enrollment with the observed version 1: HTTP 201 with data.status \"PENDING\", and Winery.${w_id}.version is now 2"
            - "the second create replaying version 1: HTTP 412 with error_id \"ERR_STALE_VERSION\", and CarrierEnrollment.${ce1_id}.status is still \"PENDING\" \u2014 the supersede never fired"
            - "the carrier's APPROVED decision does NOT touch the guard: Winery.${w_id}.version is still 2 while CarrierEnrollment.${ce1_id}.status is \"APPROVED\" with decided_by_user_id \"agent_1\""
            - "replaying version 1 again: HTTP 412 with error_id \"ERR_STALE_VERSION\" \u2014 still stale, because the version moved once and stayed there"
            - "the create with the refreshed version 2: HTTP 201 with data.status \"PENDING\", data.account_number \"ACCT-2\", and Winery.${w_id}.version is now 3"
            - "that accepted create is the one allowed to be destructive: CarrierEnrollment.${ce1_id}.status is now \"SUSPENDED\" while its approved_at and decided_by_user_id are preserved"
            - "exactly two enrollment rows exist: GET /dtc/carrier-enrollments?winery_id=${w_id} reports total_count 2 \u2014 the two refusals created nothing"
      - name: missed_run_count_suspends_at_the_second_miss_and_a_reset_restarts_the_count_from_zero
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.club_run_selection.constants.MISSED_RUN_SUSPEND_THRESHOLD
          - state_machines.ClubSubscription.ACTIVE_to_SUSPENDED_COMPLIANCE
          - entities.ClubSubscription.fields.missed_run_count
          - endpoints.POST_/dtc/club-runs
          - complexity_profile.complexity_layers.rate_threshold_triggers
        distinguishing_aspect: |
          MISSED_RUN_SUSPEND_THRESHOLD is 2 and the comparison is `missed_run_count + 1 >= threshold`, so the
          suspension must land on the SECOND miss, not the first and not the third. A rejected run leaves
          next_run_date untouched, which is what makes the counter accumulate at all: the same subscription is
          still due and is re-processed on the next run. The reset facet is then observable in a way a simple
          re-read cannot fake — after reinstatement the very next miss reads 1, not 3, and does not re-suspend.
        test_recipe:
          setup:
            - "The TX rule blocks 78701 as a DRY_COUNTY ZIP effective 2026-01-01, and that is the consumer's default shipping ZIP, so every club order this winery generates is REJECTED with ERR_PROHIBITED_DESTINATION \u2014 a non-overridable failure."
            - "Estate 1 holds an ACTIVE TX permit and an APPROVED GSO enrollment; Ada is ID-verified. Clock 2026-08-01."
            - "A MONTHLY subscription (2 x 750 ml at 2600 c, annual_allotment 6) is due 2026-08-01 with missed_run_count 0 and consumed_shipments 0."
            - "Every run below uses run_date 2026-08-01, which equals the logical clock date and is therefore legal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
