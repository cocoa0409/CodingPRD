            - "OperatorTruck.${truck_id}.reservation_fee_balance_cents == 0"
            - "Booking.${booking_id}.fee_refunded_cents == 2500"

      - name: prepared_units_conserved_void_never_consumes
        grounds:
          - calculations.prepared_units_ledger
          - state_machines.Order.OPEN_to_SETTLED
          - state_machines.Order.OPEN_to_VOID
          - entities.MenuItem.fields.prepared_units
        distinguishing_aspect: "Different conserved quantity = MenuItem.prepared_units (units, not cents): settling one order consumes units, but voiding a second order with the same item leaves prepared_units unchanged by the void (units_made(OPEN) - consumed(SETTLED) holds); a settle(-2) + void(0) net change is exactly -2, never -4, so prepared_units==8."
        test_recipe:
          setup:
