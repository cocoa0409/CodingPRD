        claim_type: cross_entity_validation
        grounds: ["validations[priority=25]", "errors[ERR_PRODUCT_DISCONTINUED]", "endpoints.POST_/foundry/products/{id}/discontinue"]
        distinguishing_aspect: "After discontinue, a production-order create against that product fails ERR_PRODUCT_DISCONTINUED — the referential gate on order create (the allocation-confirm side of the same rule is covered by the difficulty instance)."
