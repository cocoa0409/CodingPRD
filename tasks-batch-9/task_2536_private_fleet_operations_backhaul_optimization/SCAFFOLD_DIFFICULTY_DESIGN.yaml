            - "the new statement's pay_plan_version equals the reversed statement's pay_plan_version (re-accrual never refreshes the pin)"
            - "Domicile.${dom_chi_id}.accrued_pay_cents == 29924 and Driver.${drv_77_id}.ytd_gross_cents == 29924"

      - name: backhaul_offer_review_loop_bounded_and_accepted_state_reverts_on_cancel
        grounds:
          - state_machines.BackhaulOffer
          - entities.BackhaulOffer.fields.review_round
          - errors.ERR_REVIEW_ROUND_LIMIT
          - endpoints[POST /fleet/backhaul-offers/{offer_id}/revise]
        distinguishing_aspect: |
          CYCLIC + BACKWARD-EDGE on the BackhaulOffer entity, a different entity
          from the Trip instance above. PROPOSED <-> UNDER_REVIEW is a genuine
          loop with a bounded counter: the third revise leaves review_round at 3
          and the fourth is refused with ERR_REVIEW_ROUND_LIMIT. ACCEPTED then
          looks final but is NOT terminal - cancelling the linked trip drags the
          offer back to PROPOSED, and the round counter is NOT reset by that
          reversal, so the offer returns to the market permanently unable to be
          revised again.
        test_recipe:
          setup:
            - "Store S-1001 and Domicile DOM-CHI exist; offer B1 is created with revenue_cents 54000, 400 cases, 42 deadhead + 168 loaded miles, DRY."
            - "Three complete review rounds are executed, each raising revenue: 56000 (round 1), 58000 (round 2), 60000 (round 3)."
            - "Round-3 economics: variable_cost 42450 unchanged, gross_margin 60000 - 42450 = 17550, tier_margin_pct 0.2925, commission 3600, contribution_margin 13950, margin_pct 0.2325."
