        distinguishing_aspect: |
          Conserved quantity: money allocation of one PenaltyAssessment. Across waive(2000) then
          settle(3000) of an assessed 5000, the identity assessed_cents == waived_cents +
          settled_cents + outstanding_cents holds after every transition, and the vendor rollup
          drains 5000 -> 3000 -> 0 in lockstep.
