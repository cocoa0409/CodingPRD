              payload: { return_note: "Basis excludes the regional fleet; re-size." }
              as: TreasuryRiskManager
              as_user_id: "u_trm_1"
            - call: "POST /fuel/consumption-forecasts/${f3_id}/publish"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs/${prog_id}/size"
              payload: {}
              as: FuelAnalyst
            - call: "POST /fuel/hedge-programs/${prog_id}/submit"
              payload: {}
              as: FuelAnalyst
