scenario: |
  Employee Self-Service & HR Help Desk (HR shared services center): knowledge base
  authoring & search, ticket intake with category/priority & SLA, tier-1 resolution
  vs specialist escalation, sensitive case routing & confidentiality, data change
  request approval (address/direct deposit) with fraud verification, satisfaction
  survey & deflection metrics, seasonal volume (open enrollment) staffing, audit
  trail of employee data changes

domain_name: employee-self-service-hr-help-desk
api_prefix: /hr-helpdesk

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat          # peer entities joined by FK references; no nested ownership URLs
  state_machine_shape: parallel  # Ticket: workflow_status x sla_status; DataChangeRequest: approval_status x fraud_status; cycles on Ticket/KbArticle/DCR
  relationship_patterns:
    - one_to_many
    - self_referential           # Employee.manager_id; KbArticle.supersedes_article_id (revision chains)
    - cross_aggregate            # Ticket -> KbArticle (deflection source + resolution article); SurveyResponse -> Agent attribution
  role_model: segregation_of_duties  # KB author != publisher; DCR requester/verifier != approver
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_number, type: string, source: input, description: "Unique HRIS employee number; duplicates rejected with ERR_DUPLICATE_EMPLOYEE_NUMBER" }
      - { name: full_name, type: string, source: input, description: "Employee legal full name" }
      - { name: email, type: string, source: input, description: "Work email address" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", default: ACTIVE, constraints: "ACTIVE | ON_LEAVE | TERMINATED; TERMINATED is terminal" }
      - { name: manager_id, type: string, source: input, description: "FK -> Employee.id; direct manager, used for MANAGER_CONFIRMATION fraud verification; null for top of tree", constraints: "nullable" }
      - { name: address_line1, type: string, source: system, description: "Street address; written only by DataChangeRequest application", constraints: "nullable" }
      - { name: city, type: string, source: system, description: "City; written only by DataChangeRequest application", constraints: "nullable" }
      - { name: region, type: string, source: system, description: "State/province; written only by DataChangeRequest application", constraints: "nullable" }
      - { name: postal_code, type: string, source: system, description: "Postal code; written only by DataChangeRequest application", constraints: "nullable" }
      - { name: bank_routing_number, type: string, source: system, description: "Bank routing number; written only by DIRECT_DEPOSIT DataChangeRequest application", constraints: "nullable" }
      - { name: bank_account_number, type: string, source: system, description: "Bank account number; written only by DIRECT_DEPOSIT DataChangeRequest application", constraints: "nullable" }
      - { name: bank_account_type, type: enum, source: system, description: "Bank account type; written only by DIRECT_DEPOSIT DataChangeRequest application", constraints: "CHECKING | SAVINGS | null" }
      - { name: has_pending_dcr, type: boolean, source: system, description: "True while any DataChangeRequest for this employee is in PENDING_VERIFICATION or PENDING_APPROVAL; maintained on DCR create/approve/reject/cancel; flips bump Employee.version", default: false }
      - { name: open_ticket_count, type: integer, source: computed, description: "Count of Tickets with employee_id = this id and workflow_status IN {NEW, TRIAGED, IN_PROGRESS, PENDING_EMPLOYEE, ESCALATED, REOPENED}" }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Unique team name; duplicates rejected with ERR_VALIDATION" }
      - { name: description, type: string, source: input, description: "Free-text team purpose", constraints: "nullable" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Agent display name" }
      - { name: email, type: string, source: input, description: "Agent work email" }
      - { name: tier, type: enum, source: input, description: "Skill tier; T1 = tier-1 generalist, T2 = specialist", constraints: "T1 | T2" }
      - { name: clearance, type: enum, source: input, description: "Confidentiality clearance; SENSITIVE required to view/act on sensitive-category tickets", default: STANDARD, constraints: "STANDARD | SENSITIVE" }
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; home team of the agent" }
      - { name: capacity_max, type: integer, source: input, description: "Maximum number of open tickets assigned to the agent at once; 0 means the agent cannot be assigned", default: 10, constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Inactive agents are excluded from selectors and assignment", default: true }
      - { name: assigned_open_count, type: integer, source: computed, description: "Count of Tickets with assigned_agent_id = this id and workflow_status IN {NEW (sensitive auto-assign at intake), TRIAGED, IN_PROGRESS, PENDING_EMPLOYEE, ESCALATED}" }
      - { name: rolling_csat, type: number, source: computed, description: "Recency-weighted CSAT per calculations.csat_rolling_calculation; null when fewer than 1 submitted survey in window", constraints: "nullable" }
      - { name: coaching_hold, type: boolean, source: system, description: "Set true when rolling_csat < CSAT_COACHING_THRESHOLD with >= CSAT_MIN_SURVEYS submitted surveys in window; cleared when recomputed value >= threshold; setting true releases the agent's assigned open tickets", default: false }

  - name: TicketCategory
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique category code; duplicates rejected with ERR_DUPLICATE_CATEGORY_CODE" }
      - { name: name, type: string, source: input, description: "Human-readable category name" }
      - { name: is_sensitive, type: boolean, source: input, description: "Sensitive categories (e.g. harassment, medical) route to SENSITIVE-clearance agents and mask content from standard-clearance readers", default: false }
      - { name: specialist_team_id, type: string, source: input, description: "FK -> Team.id; team whose T2 agents receive escalations for this category" }
      - { name: active, type: boolean, source: input, description: "Inactive categories reject new ticket intake with ERR_CATEGORY_INACTIVE", default: true }

  - name: SlaPolicy
    parent: null
    common_fields: true
    fields:
      - { name: category_id, type: string, source: input, description: "FK -> TicketCategory.id; category this policy row applies to" }
      - { name: priority, type: enum, source: input, description: "Priority this row applies to", constraints: "P1 | P2 | P3 | P4" }
      - { name: first_response_minutes, type: integer, source: input, description: "Base minutes from ticket creation to first agent response", constraints: "> 0" }
      - { name: resolution_minutes, type: integer, source: input, description: "Base minutes from ticket creation to resolution", constraints: "> 0" }
      - { name: clock_mode, type: enum, source: input, description: "WALL_CLOCK counts all elapsed minutes; BUSINESS_HOURS counts only minutes inside 09:00-17:00 UTC Monday-Friday. Row is unique per (category_id, priority); duplicates rejected with ERR_SLA_POLICY_DUPLICATE", default: WALL_CLOCK, constraints: "WALL_CLOCK | BUSINESS_HOURS" }

  - name: KbArticle
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Article title; search matches case-insensitive substring over title and keywords" }
      - { name: body, type: string, source: input, description: "Article body markdown" }
      - { name: keywords, type: array, source: input, description: "Search keyword strings", default: [] }
      - { name: category_id, type: string, source: input, description: "FK -> TicketCategory.id; category the article deflects tickets for" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the creator; author may not publish own article (segregation of duties)" }
      - { name: status, type: enum, source: system, description: "Lifecycle per KbArticleLifecycle machine", default: DRAFT, constraints: "DRAFT | IN_REVIEW | PUBLISHED | SUPERSEDED | ARCHIVED" }
      - { name: supersedes_article_id, type: string, source: input, description: "FK -> KbArticle.id; set at creation to declare this article a revision of a PUBLISHED article; null for chain roots", constraints: "nullable; target must be PUBLISHED at creation" }
      - { name: published_at, type: datetime, source: system, description: "Timestamp of PUBLISHED transition", constraints: "nullable" }
      - { name: published_by_user_id, type: string, source: system, description: "X-User-ID of the publishing KnowledgeManager", constraints: "nullable" }
      - { name: view_count, type: integer, source: computed, description: "Count of ArticleView rows with article_id = this id" }
      - { name: deflection_fail_count, type: integer, source: computed, description: "Count of ArticleView rows with article_id = this id and deflection_outcome = TICKET_CREATED" }

  - name: ArticleView
    parent: null
    common_fields: false
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; viewer (X-User-ID of caller)" }
      - { name: article_id, type: string, source: input, description: "FK -> KbArticle.id; viewed article (must be PUBLISHED)" }
      - { name: viewed_at, type: datetime, source: system, description: "Logical-clock timestamp of the view; equals created_at" }
      - { name: deflection_outcome, type: enum, source: system, description: "NONE until a ticket links this view; TICKET_CREATED when the same employee opens a ticket in the article's category within DEFLECTION_WINDOW_MINUTES of viewed_at", default: NONE, constraints: "NONE | TICKET_CREATED" }

  - name: Ticket
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; requester; must equal caller X-User-ID when role=Employee" }
      - { name: category_id, type: string, source: input, description: "FK -> TicketCategory.id; intake category" }
      - { name: subject, type: string, source: input, description: "One-line subject; masked as [REDACTED] for readers without SENSITIVE clearance when sensitive" }
      - { name: description, type: string, source: input, description: "Full description; masked as [REDACTED] under the same rule as subject" }
      - { name: priority, type: enum, source: input, description: "Ticket priority; drives SlaPolicy lookup", default: P3, constraints: "P1 | P2 | P3 | P4" }
      - { name: sensitive, type: boolean, source: system, description: "Copied from TicketCategory.is_sensitive at creation; immutable thereafter" }
      - { name: tier, type: enum, source: system, description: "Current handling tier; T1 at intake, T2 after escalation", default: T1, constraints: "T1 | T2" }
      - { name: workflow_status, type: enum, source: system, description: "Workflow dimension per TicketWorkflow machine", default: NEW, constraints: "NEW | TRIAGED | IN_PROGRESS | PENDING_EMPLOYEE | ESCALATED | RESOLVED | REOPENED | CLOSED | CANCELLED" }
      - { name: sla_status, type: enum, source: system, description: "Parallel SLA-clock dimension per TicketSlaClock machine", default: ON_TRACK, constraints: "ON_TRACK | AT_RISK | BREACHED_RESPONSE | BREACHED_RESOLUTION | MET" }
      - { name: assigned_agent_id, type: string, source: system, description: "FK -> Agent.id; current assignee; null when unassigned", constraints: "nullable" }
      - { name: source_article_id, type: string, source: system, description: "FK -> KbArticle.id; set when intake links a recent ArticleView (deflection failure)", constraints: "nullable" }
      - { name: resolution_article_id, type: string, source: input, description: "FK -> KbArticle.id; article cited at resolution; must be PUBLISHED", constraints: "nullable" }
      - { name: resolution_summary, type: string, source: input, description: "Resolution note supplied at resolve", constraints: "nullable" }
      - { name: first_response_due_at, type: datetime, source: system, description: "Computed per calculations.sla_deadline_calculation at creation" }
      - { name: resolution_due_at, type: datetime, source: system, description: "Computed per calculations.sla_deadline_calculation at creation" }
      - { name: first_responded_at, type: datetime, source: system, description: "First agent respond timestamp; null until first respond", constraints: "nullable" }
      - { name: resolved_at, type: datetime, source: system, description: "Most recent RESOLVED transition timestamp", constraints: "nullable" }
      - { name: closed_at, type: datetime, source: system, description: "CLOSED transition timestamp", constraints: "nullable" }
      - { name: escalation_count, type: integer, source: system, description: "Number of escalations", default: 0 }
      - { name: reopen_count, type: integer, source: system, description: "Number of reopens", default: 0 }
      - { name: masked, type: boolean, source: computed, description: "True in a read response when the reader lacks SENSITIVE clearance for a sensitive ticket and is not the owner; subject/description then returned as [REDACTED]" }

  - name: TicketEvent
    parent: null
    common_fields: false
    fields:
      - { name: ticket_id, type: string, source: system, description: "FK -> Ticket.id; owning ticket" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor; 'system' for clock-driven events" }
      - { name: event_type, type: enum, source: system, description: "Transition event type", constraints: "CREATED | TRIAGED | ASSIGNED | UNASSIGNED | RESPONDED | INFO_REQUESTED | INFO_PROVIDED | ESCALATED | RESOLVED | REOPENED | CLOSED | CANCELLED | AUTO_CLOSED | SLA_BREACH | COACHING_RELEASE" }
      - { name: from_state, type: string, source: system, description: "workflow_status before the transition", constraints: "nullable" }
      - { name: to_state, type: string, source: system, description: "workflow_status after the transition", constraints: "nullable" }
      - { name: note, type: string, source: system, description: "Reason/body supplied with the triggering call", constraints: "nullable" }

  - name: DataChangeRequest
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; subject employee; must equal caller X-User-ID when role=Employee" }
      - { name: change_type, type: enum, source: input, description: "Which profile block changes", constraints: "ADDRESS | DIRECT_DEPOSIT" }
      - { name: new_values, type: object, source: input, description: "ADDRESS requires {address_line1, city, region, postal_code}; DIRECT_DEPOSIT requires {bank_routing_number, bank_account_number, bank_account_type}" }
      - { name: approval_status, type: enum, source: system, description: "Approval dimension per DataChangeRequestApproval machine", constraints: "PENDING_VERIFICATION | PENDING_APPROVAL | APPLIED | REJECTED | CANCELLED" }
      - { name: fraud_status, type: enum, source: system, description: "Parallel fraud dimension per DataChangeRequestFraud machine", constraints: "NOT_REQUIRED | PENDING | VERIFIED | FAILED | LOCKED" }
      - { name: submitted_at, type: datetime, source: system, description: "Creation timestamp (logical clock)" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of approving/rejecting HRDataSteward", constraints: "nullable" }
      - { name: decided_at, type: datetime, source: system, description: "Approve/reject timestamp", constraints: "nullable" }
      - { name: applied_at, type: datetime, source: system, description: "APPLIED timestamp", constraints: "nullable" }
      - { name: reject_reason, type: string, source: input, description: "Reason supplied at reject", constraints: "nullable" }

  - name: FraudVerification
    parent: null
    common_fields: true
    fields:
      - { name: dcr_id, type: string, source: system, description: "FK -> DataChangeRequest.id; owning request (exactly one per DataChangeRequest that requires verification)" }
      - { name: method, type: enum, source: system, description: "SECURITY_CODE = employee supplies challenge code; MANAGER_CONFIRMATION = manager of record confirms", constraints: "SECURITY_CODE | MANAGER_CONFIRMATION" }
      - { name: challenge_code, type: string, source: system, description: "Server-minted 6-digit code issued at creation; readable by the owning employee and HRDataSteward via the fraud-verifications sub-resource" }
      - { name: attempts, type: integer, source: system, description: "Failed verification attempts; reaching FRAUD_MAX_ATTEMPTS locks the verification and rejects the DCR", default: 0 }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | FAILED | LOCKED", default: PENDING }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID that satisfied the verification (employee for SECURITY_CODE, manager for MANAGER_CONFIRMATION); that user may not approve the same DCR", constraints: "nullable" }
      - { name: verified_at, type: datetime, source: system, description: "Verification timestamp", constraints: "nullable" }

  - name: SurveyResponse
    parent: null
    common_fields: true
    fields:
      - { name: ticket_id, type: string, source: system, description: "FK -> Ticket.id; exactly one survey per ticket, issued on first RESOLVED transition" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; survey recipient (ticket requester)" }
      - { name: agent_id, type: string, source: system, description: "FK -> Agent.id; attributed agent = Ticket.assigned_agent_id at resolution time; null if unassigned", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ISSUED | SUBMITTED | EXPIRED", default: ISSUED }
      - { name: score, type: integer, source: input, description: "CSAT score supplied at submit", constraints: "1..5 inclusive; null until submitted" }
      - { name: comment, type: string, source: input, description: "Optional free-text comment", constraints: "nullable" }
      - { name: issued_at, type: datetime, source: system, description: "Issuance timestamp (resolution time)" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + SURVEY_TTL_DAYS; submit after this fails with ERR_SURVEY_EXPIRED" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp", constraints: "nullable" }

  - name: StaffingWindow
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: input, description: "FK -> Team.id; team this seasonal window staffs" }
      - { name: name, type: string, source: input, description: "Window label (e.g. Open Enrollment 2026)" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive window start (closed-interval semantics for overlap)" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive window end; must be >= window_start" }
      - { name: required_t1_hours, type: number, source: input, description: "Required T1 agent-hours inside the window", constraints: ">= 0" }
      - { name: required_t2_hours, type: number, source: input, description: "Required T2 agent-hours inside the window", constraints: ">= 0" }
      - { name: sla_multiplier, type: number, source: input, description: "SLA relief multiplier applied to base policy minutes for tickets created in this team's categories while the window is ACTIVE", default: 1.0, constraints: ">= 1.0" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | COMPLETED | CANCELLED; PLANNED->ACTIVE when clock reaches window_start; ACTIVE->COMPLETED when clock passes window_end", default: PLANNED }
      - { name: covered_t1_hours, type: number, source: computed, description: "Sum of SCHEDULED T1 AgentShift minutes intersected with [window_start, window_end], divided by 60" }
      - { name: covered_t2_hours, type: number, source: computed, description: "Same for T2 agents" }
      - { name: coverage_posture, type: enum, source: computed, description: "Per calculations.staffing_coverage_posture: UNDER_STAFFED | ADEQUATE | SURPLUS" }

  - name: AgentShift
    parent: null
    common_fields: true
    fields:
      - { name: agent_id, type: string, source: input, description: "FK -> Agent.id; scheduled agent" }
      - { name: staffing_window_id, type: string, source: input, description: "FK -> StaffingWindow.id; window this shift counts toward; window must be PLANNED or ACTIVE" }
      - { name: shift_start, type: datetime, source: input, description: "Half-open interval start; must be >= window_start" }
      - { name: shift_end, type: datetime, source: input, description: "Half-open interval end (exclusive); must be > shift_start and <= window_end" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | CANCELLED; cancelled shifts excluded from coverage and overlap checks", default: SCHEDULED }

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; subject employee whose profile changed" }
      - { name: dcr_id, type: string, source: system, description: "FK -> DataChangeRequest.id; originating request" }
      - { name: field_changed, type: string, source: system, description: "Employee field name that changed (e.g. address_line1, bank_account_number)" }
      - { name: old_value, type: string, source: system, description: "Value before the change (string-serialized; null if previously unset)", constraints: "nullable" }
      - { name: new_value, type: string, source: system, description: "Value after the change (string-serialized)" }
      - { name: changed_by_user_id, type: string, source: system, description: "X-User-ID that performed/approved the change" }
      - { name: change_source, type: enum, source: system, description: "Origin of the change; v1 writes only DCR_APPLIED (from DCR approval)", constraints: "DCR_APPLIED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Ticket
    state_field: workflow_status
    initial_state: NEW
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /hr-helpdesk/tickets/{id}/triage"
        actor: HelpDeskAgent | SensitiveCaseManager
        preconditions:
          - "caller has SENSITIVE clearance when ticket.sensitive is true (else ERR_CONFIDENTIALITY_CLEARANCE_REQUIRED)"
        side_effects:
          - "optional priority override re-looks-up SlaPolicy(category_id, new priority) and recomputes first_response_due_at/resolution_due_at from created_at with the surge multiplier in effect at creation"
          - "append TicketEvent(TRIAGED); bump version"
      - from: [NEW, TRIAGED, ESCALATED, REOPENED]
        to: IN_PROGRESS
        trigger: "POST /hr-helpdesk/tickets/{id}/assign"
        actor: HelpDeskAgent | SpecialistAgent | SensitiveCaseManager | HRServicesAdmin
        preconditions:
          - "expected_ticket_version equals ticket.version (else ERR_STALE_TICKET_VERSION, 412)"
          - "assignee exists, active == true (else ERR_AGENT_NOT_FOUND / ERR_AGENT_AT_CAPACITY pre-checks)"
          - "assignee.assigned_open_count < assignee.capacity_max (else ERR_AGENT_AT_CAPACITY)"
          - "ticket.sensitive == false OR assignee.clearance == SENSITIVE (else ERR_CONFIDENTIALITY_CLEARANCE_REQUIRED)"
          - "assignee.tier == ticket.tier (else ERR_AGENT_TIER_INSUFFICIENT)"
          - "roles SpecialistAgent/SensitiveCaseManager may only self-assign (agent_id == caller X-User-ID)"
        side_effects:
          - "assigned_agent_id := agent_id; append TicketEvent(ASSIGNED) (UNASSIGNED->ASSIGNED pair when replacing a prior agent)"
          - "increment Ticket.version by 1"
      - from: [TRIAGED, IN_PROGRESS, ESCALATED]
        to: SAME
        trigger: "POST /hr-helpdesk/tickets/{id}/respond"
        actor: HelpDeskAgent | SpecialistAgent | SensitiveCaseManager
        preconditions:
          - "caller has SENSITIVE clearance when ticket.sensitive is true"
        side_effects:
          - "first_responded_at := now iff null (BREACHED_RESPONSE sla_status, once set, is NOT cleared by responding)"
          - "append TicketEvent(RESPONDED); bump version"
      - from: IN_PROGRESS
        to: PENDING_EMPLOYEE
        trigger: "POST /hr-helpdesk/tickets/{id}/request-info"
        actor: HelpDeskAgent | SpecialistAgent | SensitiveCaseManager
        preconditions: ["caller has SENSITIVE clearance when ticket.sensitive is true"]
        side_effects: ["append TicketEvent(INFO_REQUESTED); bump version"]
      - from: PENDING_EMPLOYEE
        to: IN_PROGRESS
        trigger: "POST /hr-helpdesk/tickets/{id}/provide-info"
        actor: Employee
        preconditions: ["caller X-User-ID == ticket.employee_id"]
        side_effects: ["append TicketEvent(INFO_PROVIDED); bump version"]
      - from: [TRIAGED, IN_PROGRESS]
        to: ESCALATED
        trigger: "POST /hr-helpdesk/tickets/{id}/escalate"
        actor: HelpDeskAgent
        preconditions:
          - "ticket.tier == T1 (escalating a T2 ticket fails with ERR_TICKET_INVALID_STATE)"
          - "specialist selector non-empty: agents with team_id == category.specialist_team_id AND tier == T2 AND active == true AND (clearance == SENSITIVE when ticket.sensitive) AND assigned_open_count < capacity_max; empty pool -> ERR_NO_ELIGIBLE_SPECIALIST, no state change"
        side_effects:
          - "tier := T2; escalation_count += 1"
          - "assigned_agent_id := selector winner (rank: assigned_open_count ASC, tie created_at ASC)"
          - "SLA clocks unchanged: first_response_due_at/resolution_due_at/sla_status are NOT reset by escalation"
          - "append TicketEvent(ESCALATED); bump version"
      - from: [IN_PROGRESS, REOPENED]
        to: RESOLVED
        trigger: "POST /hr-helpdesk/tickets/{id}/resolve"
        actor: HelpDeskAgent | SpecialistAgent | SensitiveCaseManager
        preconditions:
          - "caller has SENSITIVE clearance when ticket.sensitive is true"
          - "resolution_article_id, when supplied, references a KbArticle with status == PUBLISHED (else ERR_RESOLUTION_ARTICLE_NOT_PUBLISHED)"
        side_effects:
          - "resolved_at := now; sla_status := MET iff now <= resolution_due_at else BREACHED_RESOLUTION (overwrites ON_TRACK/AT_RISK/BREACHED_RESPONSE)"
          - "iff this is the FIRST RESOLVED transition of the ticket: create SurveyResponse(status=ISSUED, employee_id=ticket.employee_id, agent_id=ticket.assigned_agent_id, issued_at=now, expires_at=now + SURVEY_TTL_DAYS)"
          - "append TicketEvent(RESOLVED); bump version"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /hr-helpdesk/tickets/{id}/reopen"
        actor: Employee
        preconditions:
          - "caller X-User-ID == ticket.employee_id"
          - "now <= resolved_at + REOPEN_WINDOW_HOURS (inclusive boundary; else ERR_REOPEN_WINDOW_PASSED)"
        side_effects:
          - "reopen_count += 1; sla_status := ON_TRACK and resolution_due_at := now + (resolution_minutes x surge multiplier at creation) re-anchored from now"
          - "no new SurveyResponse is created (one survey per ticket)"
          - "append TicketEvent(REOPENED); bump version"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /hr-helpdesk/tickets/{id}/close (owner employee) OR system auto-close on clock advance when resolved_at <= now - AUTO_CLOSE_DAYS"
        actor: Employee | system
        preconditions: ["manual close: caller X-User-ID == ticket.employee_id"]
        side_effects: ["closed_at := now; append TicketEvent(CLOSED or AUTO_CLOSED); bump version"]
      - from: [NEW, TRIAGED]
        to: CANCELLED
        trigger: "POST /hr-helpdesk/tickets/{id}/cancel"
        actor: Employee
        preconditions: ["caller X-User-ID == ticket.employee_id"]
        side_effects: ["assigned_agent_id := null; append TicketEvent(CANCELLED); bump version"]

  - entity: Ticket
    state_field: sla_status
    initial_state: ON_TRACK
    terminal_states: [MET, BREACHED_RESOLUTION]
    transitions:
      - from: ON_TRACK
        to: AT_RISK
        trigger: "system, on clock advance (POST /hr-helpdesk/_clock/set_current_utc) or lazy evaluation on read"
        actor: system
        preconditions:
          - "workflow_status IN {NEW, TRIAGED, IN_PROGRESS, PENDING_EMPLOYEE, ESCALATED, REOPENED}"
          - "(now - created_at) / (resolution_due_at - created_at) >= SLA_AT_RISK_FRACTION (0.75, inclusive boundary) AND now <= resolution_due_at AND NOT first-response breached"
        side_effects: ["append TicketEvent(SLA_BREACH, note=AT_RISK); bump version"]
      - from: [ON_TRACK, AT_RISK]
        to: BREACHED_RESPONSE
        trigger: "system, on clock advance or lazy evaluation on read"
        actor: system
        preconditions:
          - "workflow_status non-terminal AND first_responded_at IS NULL AND now > first_response_due_at AND now <= resolution_due_at"
        side_effects: ["append TicketEvent(SLA_BREACH, note=BREACHED_RESPONSE); bump version"]
      - from: [ON_TRACK, AT_RISK, BREACHED_RESPONSE]
        to: BREACHED_RESOLUTION
        trigger: "system, on clock advance or lazy evaluation on read"
        actor: system
        preconditions: ["workflow_status non-terminal AND now > resolution_due_at"]
        side_effects: ["append TicketEvent(SLA_BREACH, note=BREACHED_RESOLUTION); bump version"]
      - from: [ON_TRACK, AT_RISK, BREACHED_RESPONSE]
        to: MET
        trigger: "POST /hr-helpdesk/tickets/{id}/resolve (see TicketWorkflow RESOLVED transition)"
        actor: HelpDeskAgent | SpecialistAgent | SensitiveCaseManager
        preconditions: ["now <= resolution_due_at at resolution time"]
        side_effects: []
      - from: [ON_TRACK, AT_RISK, BREACHED_RESPONSE, BREACHED_RESOLUTION]
        to: BREACHED_RESOLUTION
        trigger: "POST /hr-helpdesk/tickets/{id}/resolve when now > resolution_due_at"
        actor: HelpDeskAgent | SpecialistAgent | SensitiveCaseManager
        preconditions: []
        side_effects: []
    note: "Breach priority when several conditions hold at once: BREACHED_RESOLUTION > BREACHED_RESPONSE > AT_RISK > ON_TRACK. sla_status never changes on CLOSED/CANCELLED tickets."

  - entity: KbArticle
    state_field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, ARCHIVED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /hr-helpdesk/kb-articles/{id}/submit-review"
        actor: KnowledgeManager | HelpDeskAgent | SpecialistAgent
        preconditions: ["caller X-User-ID == author_user_id OR caller role == KnowledgeManager"]
        side_effects: ["bump version"]
      - from: IN_REVIEW
        to: PUBLISHED
        trigger: "POST /hr-helpdesk/kb-articles/{id}/publish"
        actor: KnowledgeManager
        preconditions:
          - "caller X-User-ID != author_user_id (segregation of duties; else ERR_AUTHOR_CANNOT_PUBLISH)"
          - "iff supersedes_article_id IS NOT NULL: the referenced article currently has status == PUBLISHED (else ERR_ARTICLE_INVALID_STATE — the chain head has moved)"
        side_effects:
          - "published_at := now; published_by_user_id := caller"
          - "iff supersedes_article_id IS NOT NULL: referenced article transitions PUBLISHED -> SUPERSEDED in the same transaction (conserves exactly one PUBLISHED head per revision chain)"
          - "bump version (and the superseded article's version)"
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /hr-helpdesk/kb-articles/{id}/return-draft"
        actor: KnowledgeManager
        preconditions: []
        side_effects: ["rework loop; bump version"]
      - from: PUBLISHED
        to: ARCHIVED
        trigger: "POST /hr-helpdesk/kb-articles/{id}/archive"
        actor: KnowledgeManager
        preconditions: []
        side_effects: ["article leaves Employee-visible search results; bump version"]

  - entity: DataChangeRequest
    state_field: approval_status
    initial_state: "PENDING_VERIFICATION when fraud verification is required, else PENDING_APPROVAL (see DataChangeRequestFraud)"
    terminal_states: [APPLIED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING_VERIFICATION
        to: PENDING_APPROVAL
        trigger: "POST /hr-helpdesk/data-change-requests/{id}/verify (successful verification)"
        actor: Employee
        preconditions: ["fraud_status becomes VERIFIED via the parallel fraud machine"]
        side_effects: ["bump version"]
      - from: PENDING_APPROVAL
        to: PENDING_VERIFICATION
        trigger: "POST /hr-helpdesk/data-change-requests/{id}/verify (a failed attempt while approval-pending is impossible; re-verification loop entered only from approve-time safety re-check)"
        actor: system
        preconditions: ["never taken via public API in v1; reserved loop documented for completeness — approval requires fraud_status IN {VERIFIED, NOT_REQUIRED}"]
        side_effects: []
        note: "kept to document the cyclic shape; the reachable cycle in v1 is PENDING_VERIFICATION <-> (fraud FAILED) -> PENDING_VERIFICATION via the fraud dimension"
      - from: [PENDING_VERIFICATION, PENDING_APPROVAL]
        to: APPLIED
        trigger: "POST /hr-helpdesk/data-change-requests/{id}/approve"
        actor: HRDataSteward
        preconditions:
          - "fraud gate (business_safety): fraud_status IN {VERIFIED, NOT_REQUIRED}; approving from PENDING_VERIFICATION (fraud PENDING/FAILED) fails with ERR_FRAUD_VERIFICATION_REQUIRED, not a state error"
          - "employee.status == ACTIVE (else ERR_EMPLOYEE_INACTIVE)"
          - "caller X-User-ID != employee_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
          - "caller X-User-ID != FraudVerification.verified_by_user_id when a verification exists (else ERR_VERIFIER_CANNOT_APPROVE)"
        side_effects:
          - "write new_values onto Employee fields (address_* or bank_*); increment Employee.version by 1 and refresh updated_at"
          - "append one AuditLogEntry per changed Employee field (change_source=DCR_APPLIED, changed_by_user_id=caller, dcr_id=this id)"
          - "every OTHER DataChangeRequest of the same employee in PENDING_VERIFICATION or PENDING_APPROVAL transitions to CANCELLED (profile mutation invalidates in-flight verification)"
          - "recompute Employee.has_pending_dcr (false when no PENDING_* remain); decided_by_user_id/decided_at/applied_at set; bump version"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /hr-helpdesk/data-change-requests/{id}/reject"
        actor: HRDataSteward
        preconditions: ["caller X-User-ID != employee_id (else ERR_SELF_APPROVAL_FORBIDDEN)"]
        side_effects: ["reject_reason stored; decided_* set; recompute Employee.has_pending_dcr; bump version"]
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "system, when the parallel fraud machine reaches LOCKED (3 failed attempts)"
        actor: system
        preconditions: []
        side_effects: ["reject_reason := 'FRAUD_VERIFICATION_LOCKED'; recompute Employee.has_pending_dcr; bump version"]
      - from: [PENDING_VERIFICATION, PENDING_APPROVAL]
        to: CANCELLED
        trigger: "POST /hr-helpdesk/data-change-requests/{id}/cancel (owner) OR POST /hr-helpdesk/employees/{id}/status to TERMINATED (cascade) OR sibling DCR application"
        actor: Employee | system
        preconditions: ["manual cancel: caller X-User-ID == dcr.employee_id"]
        side_effects: ["recompute Employee.has_pending_dcr; bump version"]

  - entity: DataChangeRequest
    state_field: fraud_status
    initial_state: "PENDING when verification required, else NOT_REQUIRED"
    terminal_states: [NOT_REQUIRED, VERIFIED, LOCKED]
    transitions:
      - from: [PENDING, FAILED]
        to: VERIFIED
        trigger: "POST /hr-helpdesk/data-change-requests/{id}/verify with correct evidence"
        actor: Employee
        preconditions:
          - "fraud_status != LOCKED; a verify call against a LOCKED verification fails with ERR_FRAUD_VERIFICATION_LOCKED, raised at state-check priority ahead of the generic DCR state check"
          - "method == SECURITY_CODE: caller X-User-ID == dcr.employee_id AND evidence_code == FraudVerification.challenge_code"
          - "method == MANAGER_CONFIRMATION: caller X-User-ID == Employee(dcr.employee_id).manager_id (else ERR_FORBIDDEN_ROLE)"
        side_effects:
          - "FraudVerification.status := VERIFIED; verified_by_user_id := caller; verified_at := now"
          - "approval_status PENDING_VERIFICATION -> PENDING_APPROVAL"
      - from: [PENDING, FAILED]
        to: FAILED
        trigger: "POST /hr-helpdesk/data-change-requests/{id}/verify with wrong evidence_code (SECURITY_CODE)"
        actor: Employee
        preconditions: ["FraudVerification.attempts < FRAUD_MAX_ATTEMPTS (3) before this attempt (else ERR_FRAUD_VERIFICATION_LOCKED)"]
        side_effects:
          - "request rejected with ERR_FRAUD_EVIDENCE_MISMATCH (422) AND FraudVerification.attempts += 1, status := FAILED"
          - "iff attempts reaches 3: FraudVerification.status := LOCKED, dcr.fraud_status := LOCKED, approval_status -> REJECTED"
      - from: [PENDING, FAILED]
        to: LOCKED
        trigger: "third failed verify attempt (see above)"
        actor: system
        preconditions: []
        side_effects: ["approval_status -> REJECTED; Employee.has_pending_dcr recomputed"]
    note: "Requirement rule at creation: DIRECT_DEPOSIT always requires verification; ADDRESS requires verification iff the employee has any FraudVerification with status IN {FAILED, LOCKED} created within the trailing FRAUD_LOOKBACK_DAYS (30) days; otherwise NOT_REQUIRED and the DCR starts in PENDING_APPROVAL."

  - entity: SurveyResponse
    state_field: status
    initial_state: ISSUED
    terminal_states: [SUBMITTED, EXPIRED]
    transitions:
      - from: ISSUED
        to: SUBMITTED
        trigger: "POST /hr-helpdesk/surveys/{id}/submit"
        actor: Employee
        preconditions:
          - "caller X-User-ID == survey.employee_id"
          - "now <= expires_at (lazy expiry: past-due ISSUED surveys fail submit with ERR_SURVEY_EXPIRED)"
          - "score IN 1..5 (else ERR_VALIDATION)"
        side_effects:
          - "submitted_at := now"
          - "recompute Agent(agent_id).rolling_csat per calculations.csat_rolling_calculation over trailing CSAT_WINDOW_DAYS"
          - "recompute Agent.coaching_hold := (submitted survey count in window >= CSAT_MIN_SURVEYS) AND (rolling_csat < CSAT_COACHING_THRESHOLD); when it flips false->true, release the agent's assigned open tickets (workflow_status IN {TRIAGED, IN_PROGRESS, ESCALATED} -> assigned_agent_id := null, workflow_status := TRIAGED, append TicketEvent(COACHING_RELEASE) per ticket)"
        note: "transitive depth-3 cascade: survey submit -> Agent rolling_csat/coaching_hold -> Ticket reassignment + TicketEvent"
      - from: ISSUED
        to: EXPIRED
        trigger: "system, on clock advance when expires_at < now"
        actor: system
        preconditions: []
        side_effects: ["bump version"]

  - entity: StaffingWindow
    state_field: status
    initial_state: "PLANNED (or ACTIVE immediately when window_start <= now <= window_end at creation)"
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "system, on clock advance when window_start <= now <= window_end (also evaluated at creation)"
        actor: system
        preconditions: []
        side_effects: ["bump version"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system, on clock advance when now > window_end"
        actor: system
        preconditions: []
        side_effects: ["bump version"]
      - from: [PLANNED, ACTIVE]
        to: CANCELLED
        trigger: "POST /hr-helpdesk/staffing-windows/{id}/cancel"
        actor: WorkforcePlanner
        preconditions: []
        side_effects: ["shifts remain but window no longer applies sla_multiplier; bump version"]

  - entity: AgentShift
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /hr-helpdesk/agent-shifts/{id}/cancel"
        actor: WorkforcePlanner
        preconditions: []
        side_effects: ["window coverage recomputes (covered_*_hours, coverage_posture); bump version"]

  - entity: Employee
    state_field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ON_LEAVE
        trigger: "POST /hr-helpdesk/employees/{id}/status"
        actor: HRServicesAdmin
        preconditions: []
        side_effects: ["bump version"]
      - from: ON_LEAVE
        to: ACTIVE
        trigger: "POST /hr-helpdesk/employees/{id}/status"
        actor: HRServicesAdmin
        preconditions: []
        side_effects: ["bump version"]
      - from: [ACTIVE, ON_LEAVE]
        to: TERMINATED
        trigger: "POST /hr-helpdesk/employees/{id}/status"
        actor: HRServicesAdmin
        preconditions: []
        side_effects:
          - "all DataChangeRequests of this employee in PENDING_VERIFICATION or PENDING_APPROVAL transition to CANCELLED; has_pending_dcr recomputed"
          - "open tickets are NOT cancelled (they remain actionable)"
          - "bump version"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: ticket-assign-stale-ticket
    parent_entity: Ticket
    write_endpoint: "POST /hr-helpdesk/tickets/{id}/assign"
    occ_field: expected_ticket_version
    description: |
      Assigning a Ticket whose version has advanced since the caller last
      observed it is rejected. Reassignment is legitimate product behavior
      (a ticket may be re-homed), so the stale write is detected purely via
      the expected_ticket_version check, not via any state precondition.
    error_id: ERR_STALE_TICKET_VERSION
    http_status: 412
  - rule_id: dcr-create-stale-employee
    parent_entity: Employee
    write_endpoint: "POST /hr-helpdesk/data-change-requests"
    occ_field: expected_employee_version
    description: |
      Creating a DataChangeRequest against an Employee whose version has
      advanced since the caller last read the profile (e.g. another DCR was
      just created or applied, flipping has_pending_dcr or writing profile
      fields) is rejected. The new request edits values the caller could not
      have seen, so the stale create is rejected via expected_employee_version.
    error_id: ERR_STALE_EMPLOYEE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: sla_deadline_calculation
    trigger: "ticket creation (POST /hr-helpdesk/tickets); also triage with priority override; also reopen re-anchor"
    algorithm: threshold
    formula: |
      policy := SlaPolicy WHERE category_id = ticket.category_id AND priority = ticket.priority
      (missing row -> ERR_SLA_POLICY_NOT_FOUND, ticket not created)
      surge := 1.0
      IF EXISTS StaffingWindow w WITH w.team_id == category.specialist_team_id
         AND w.status == ACTIVE AND w.window_start <= created_at <= w.window_end:
           surge := w.sla_multiplier          # at most one ACTIVE window per team (overlap rule)
      eff_resolution := ceil(policy.resolution_minutes * surge)      # round UP to whole minutes
      eff_first_response := ceil(policy.first_response_minutes * surge)
      VARIANT WALL_CLOCK:
        resolution_due_at := created_at + eff_resolution minutes (all minutes count)
        first_response_due_at := created_at + eff_first_response minutes
      VARIANT BUSINESS_HOURS:
        walk forward from created_at consuming only minutes inside 09:00:00-17:00:00 UTC
        Monday-Friday (Saturday/Sunday contribute zero); the due instant is the moment the
        eff_*-th business minute is consumed.
    input_set: "the single new Ticket; SlaPolicy row keyed (category_id, priority); ACTIVE StaffingWindow rows of the category's specialist team covering created_at"
    constants:
      BUSINESS_DAY_START_UTC: "09:00"
      BUSINESS_DAY_END_UTC: "17:00"
    precision: "whole minutes (ceil after multiplier); timestamps ISO8601 UTC second precision"
    variants:
      - name: wall_clock
        when: "SlaPolicy.clock_mode == WALL_CLOCK"
        difference: "every elapsed minute counts; weekend/night minutes included"
      - name: business_hours
        when: "SlaPolicy.clock_mode == BUSINESS_HOURS"
        difference: "only minutes inside 09:00-17:00 UTC Mon-Fri count; identical input instant yields a strictly later due instant whenever the span touches non-business time"

  - name: sla_clock_evaluation
    trigger: "POST /hr-helpdesk/_clock/set_current_utc (all non-terminal tickets), and lazily on every Ticket read"
    algorithm: threshold
    formula: |
      FOR each Ticket with workflow_status IN {NEW, TRIAGED, IN_PROGRESS, PENDING_EMPLOYEE, ESCALATED, REOPENED}:
        IF now > resolution_due_at:                          sla_status := BREACHED_RESOLUTION
        ELIF first_responded_at IS NULL AND now > first_response_due_at: sla_status := BREACHED_RESPONSE
        ELIF (now - created_at)/(resolution_due_at - created_at) >= SLA_AT_RISK_FRACTION: sla_status := AT_RISK
        ELSE: sla_status stays ON_TRACK
      # evaluation order pins breach priority: resolution > response > at-risk
    input_set: "Tickets in non-terminal workflow_status; sla_status transitions only ON_TRACK -> AT_RISK -> BREACHED_* (no healing backwards)"
    constants:
      SLA_AT_RISK_FRACTION: 0.75
    precision: "boundary inclusive: fraction == 0.75 exactly flips to AT_RISK; now == due_at exactly is NOT a breach (breach requires now > due_at)"
    variants: []

  - name: deflection_link_and_rate
    trigger: "POST /hr-helpdesk/tickets (link step); GET /hr-helpdesk/metrics/deflection (rate step)"
    algorithm: aggregation
    formula: |
      LINK (at ticket creation):
        candidates := ArticleView WHERE employee_id = new.employee_id
          AND article.category_id = new.category_id
          AND viewed_at >= (created_at - DEFLECTION_WINDOW_MINUTES)   # inclusive boundary
          AND deflection_outcome == NONE
        IF candidates non-empty:
          chosen := the candidate with latest viewed_at (tie-break: created_at DESC)
          new.source_article_id := chosen.article_id
          chosen.deflection_outcome := TICKET_CREATED
      RATE (metrics read for category C):
        views := ArticleView v JOIN KbArticle a ON v.article_id = a.id
          WHERE a.category_id = C AND v.viewed_at IN [now - DEFLECTION_WINDOW_DAYS, now]  # inclusive both ends
        created := COUNT(views WHERE deflection_outcome == TICKET_CREATED)
        IF views == 0: deflection_rate := 0.0                        # empty-set guard
        ELSE: deflection_rate := 1 - created / COUNT(views)
    input_set: "link step: the viewing employee's ArticleViews in the trailing 60 minutes, same category, unconsumed; rate step: all ArticleViews of articles in the category inside the trailing 30-day window"
    constants:
      DEFLECTION_WINDOW_MINUTES: 60
      DEFLECTION_WINDOW_DAYS: 30
    precision: "deflection_rate rounded to 4 decimal places, round_half_up"
    variants: []

  - name: csat_rolling_calculation
    trigger: "SurveyResponse submit (recompute for the attributed agent); GET /hr-helpdesk/metrics/csat (on-read recompute)"
    algorithm: weighted_scoring
    formula: |
      surveys := SurveyResponse WHERE agent_id = X AND status == SUBMITTED
        AND submitted_at IN [now - CSAT_WINDOW_DAYS, now]           # inclusive both ends
      age_i := (now - submitted_at_i) in whole days (floor of second difference / 86400)
      w_i := round_half_up(0.5 ^ (age_i / CSAT_HALF_LIFE_DAYS), 6)
      # PINNED ROUNDING ORDER (mode b): round each weighted term FIRST, then sum, then divide, then round
      term_i := round_half_up(score_i * w_i, 2)
      recency_weighted_mean := round_half_up( SUM(term_i) / SUM(w_i), 2 )
      simple_mean := round_half_up( SUM(score_i) / COUNT(surveys), 2 )
      # rounding order matters: summing UNROUNDED score_i*w_i then rounding once can differ
      # in the final cents from the pinned order (e.g. scores 1,1,2 at ages 0,0,12 -> 1.21 vs 1.22)
      coaching evaluation: coaching_hold := (COUNT(surveys) >= CSAT_MIN_SURVEYS) AND (recency_weighted_mean < CSAT_COACHING_THRESHOLD)
    input_set: "SUBMITTED SurveyResponses attributed to the agent (agent_id set at issuance from Ticket.assigned_agent_id) inside the trailing 30-day window; EXPIRED/ISSUED excluded"
    constants:
      CSAT_WINDOW_DAYS: 30
      CSAT_HALF_LIFE_DAYS: 14
      CSAT_MIN_SURVEYS: 3
      CSAT_COACHING_THRESHOLD: 3.00
    precision: "weights 6dp, per-term products 2dp, final means 2dp; all round_half_up"
    variants:
      - name: simple_mean
        when: "reported as metrics/csat.simple_mean"
        difference: "equal weight to every survey in window; ignores recency entirely"
      - name: recency_weighted_mean
        when: "reported as metrics/csat.recency_weighted_mean and used for coaching_hold"
        difference: "same survey set, exponentially decayed weights; scores 5,4,2 at ages 0,7,28 days yield simple 3.67 vs weighted 4.26"

  - name: staffing_coverage_posture
    trigger: "GET /hr-helpdesk/staffing-windows/{id} (on-read); after shift create/cancel"
    algorithm: constraint_propagation
    formula: |
      FOR tier IN {T1, T2}:
        covered[tier] := SUM over AgentShift s (status == SCHEDULED, s.staffing_window_id = W.id,
                           agent(s.agent_id).tier == tier)
                         of minutes( max(s.shift_start, W.window_start), min(s.shift_end, W.window_end) ) / 60
        # interval clip: overlap of half-open shift with INCLUSIVE window bounds; zero/negative clips contribute 0
        ratio[tier] := IF required[tier] == 0 THEN 1.0 ELSE covered[tier] / required[tier]
      overall := MIN(ratio[T1], ratio[T2])         # weakest tier gates the whole window
      posture := UNDER_STAFFED if overall < COVERAGE_UNDER_RATIO
                 else ADEQUATE if overall <= COVERAGE_SURPLUS_RATIO
                 else SURPLUS
    input_set: "SCHEDULED AgentShifts of the window only (CANCELLED excluded); both tier ratios; the min() over tiers makes the 4-input formula non-linear"
    constants:
      COVERAGE_UNDER_RATIO: 0.90
      COVERAGE_SURPLUS_RATIO: 1.10
    precision: "ratios compared exactly; covered hours to 2dp round_half_up; zero-required tier contributes ratio 1.0 (empty-set guard), so a window with both required hours == 0 is ADEQUATE"
    variants: []

  - name: sla_attainment_calculation
    trigger: "GET /hr-helpdesk/metrics/sla-attainment"
    algorithm: aggregation
    formula: |
      pool := Ticket WHERE category_id = C AND resolved_at IS NOT NULL
        AND workflow_status IN {RESOLVED, REOPENED, CLOSED}          # reached resolution at least once
      met := COUNT(pool WHERE sla_status == MET)
      breached := COUNT(pool WHERE sla_status == BREACHED_RESOLUTION)
      total := met + breached
      attainment_pct := IF total == 0 THEN 0.0 ELSE round_half_up(100.0 * met / total, 1)
    input_set: "tickets of the category that have resolved at least once; REOPENED tickets count once by their CURRENT sla_status"
    constants: {}
    precision: "1 decimal place, round_half_up"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role; for entity_backed roles the X-User-ID must reference an existing Employee/Agent row", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller role is listed in the endpoint's roles; ownership scope: role Employee may only act on / read resources where the owning employee_id == X-User-ID (tickets, surveys, DCRs, fraud-verifications, audit-log, GET /employees/{id}); list endpoints for role Employee are force-scoped to the caller", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: business_constraint, check: "request shape: required fields present, enums within declared sets, types valid, object sub-fields of DataChangeRequest.new_values complete for the change_type", error_id: "ERR_VALIDATION | ERR_INVALID_ENUM", http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "path ids exist left-to-right, then body foreign keys exist (employee_id, category_id, agent_id, article_id, team_id, staffing_window_id, ticket_id); missing SlaPolicy row for (category_id, priority) at ticket intake is also raised here", error_id: "ERR_EMPLOYEE_NOT_FOUND | ERR_AGENT_NOT_FOUND | ERR_TEAM_NOT_FOUND | ERR_CATEGORY_NOT_FOUND | ERR_SLA_POLICY_NOT_FOUND | ERR_ARTICLE_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_DCR_NOT_FOUND | ERR_SURVEY_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_SHIFT_NOT_FOUND", http_status: 404, applies_to: "all" }
  - { priority: 5, category: auth, check: "record-level ownership for role Employee on a specific located resource (ticket.employee_id / survey.employee_id / dcr.employee_id / employee.id == X-User-ID)", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "GET/act on owned resources" }
  - { priority: 6, category: state, check: "target entity is in a from-state of the requested transition (ticket workflow/sla, article, DCR approval/fraud, survey, staffing window, agent shift, employee status); a verify call against a LOCKED fraud verification raises ERR_FRAUD_VERIFICATION_LOCKED here, ahead of the generic DCR state error", error_id: "ERR_TICKET_INVALID_STATE | ERR_DCR_INVALID_STATE | ERR_ARTICLE_INVALID_STATE | ERR_SURVEY_INVALID_STATE | ERR_WINDOW_INVALID_STATE | ERR_SHIFT_INVALID_STATE | ERR_EMPLOYEE_INVALID_STATE | ERR_FRAUD_VERIFICATION_LOCKED", http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "confidentiality: any write/action on a sensitive ticket requires caller agent clearance SENSITIVE; fraud gate: approve requires fraud_status IN {VERIFIED, NOT_REQUIRED} and verification not LOCKED; employee-active gate: DCR create/approve require Employee.status == ACTIVE; segregation of duties: KB author != publisher, DCR requester != approver, fraud verifier != approver", error_id: "ERR_CONFIDENTIALITY_CLEARANCE_REQUIRED | ERR_FRAUD_VERIFICATION_REQUIRED | ERR_FRAUD_VERIFICATION_LOCKED | ERR_EMPLOYEE_INACTIVE | ERR_AUTHOR_CANNOT_PUBLISH | ERR_SELF_APPROVAL_FORBIDDEN | ERR_VERIFIER_CANNOT_APPROVE", http_status: "403 | 409 | 422", applies_to: "ticket write actions, DCR create/approve, KB publish" }
  - { priority: 8, category: business_constraint, check: "capacity (assigned_open_count < capacity_max), tier match (assignee.tier == ticket.tier), specialist pool non-empty on escalate, overlaps (AgentShift half-open; StaffingWindow closed-interval per team), uniqueness (sla policy per category+priority, one pending DCR per employee+change_type, employee_number, category code), OCC expected_*_version match", error_id: "ERR_AGENT_AT_CAPACITY | ERR_AGENT_TIER_INSUFFICIENT | ERR_NO_ELIGIBLE_SPECIALIST | ERR_SHIFT_OVERLAP | ERR_WINDOW_OVERLAP | ERR_SLA_POLICY_DUPLICATE | ERR_DUPLICATE_DATA_CHANGE_PENDING | ERR_DUPLICATE_EMPLOYEE_NUMBER | ERR_DUPLICATE_CATEGORY_CODE | ERR_STALE_TICKET_VERSION | ERR_STALE_EMPLOYEE_VERSION", http_status: "409 | 412 | 422", applies_to: "assign, escalate, shift/window/policy/employee/category/DCR create" }
  - { priority: 9, category: business_temporal, check: "reopen within REOPEN_WINDOW_HOURS of resolved_at (inclusive); survey submit before expires_at; shift_start < shift_end and shift inside window bounds; window_start <= window_end", error_id: "ERR_REOPEN_WINDOW_PASSED | ERR_SURVEY_EXPIRED | ERR_INVALID_TIME_RANGE | ERR_SHIFT_OUTSIDE_WINDOW", http_status: "409 | 422", applies_to: "reopen, survey submit, shift create, window create" }
  - { priority: 10, category: business_referential, check: "referenced domain objects are usable: resolution_article_id is PUBLISHED; ticket category active == true at intake; viewed article is PUBLISHED; shift's window is PLANNED or ACTIVE; supersedes target article is PUBLISHED at revision creation", error_id: "ERR_RESOLUTION_ARTICLE_NOT_PUBLISHED | ERR_CATEGORY_INACTIVE | ERR_ARTICLE_INVALID_STATE | ERR_WINDOW_INVALID_STATE", http_status: "409 | 422", applies_to: "resolve, ticket create, article-view create, shift create, kb-article create" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Employees ----
  - { method: POST, path: "/hr-helpdesk/employees", description: "Create employee", roles: [HRServicesAdmin], code: 201, input: [employee_number, full_name, email, "manager_id?", "status?"], output: Employee, side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/employees", description: "List employees with filters/pagination", roles: [HRServicesAdmin, HRDataSteward, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager, WorkforcePlanner, KnowledgeManager], code: 200, input: ["status?", "manager_id?", "limit?", "offset?"], output: "Employee[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/employees/{id}", description: "Read one employee (Employee role: self only)", roles: [Employee, HRServicesAdmin, HRDataSteward, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [], output: Employee, side_effects: [none] }
  - { method: POST, path: "/hr-helpdesk/employees/{id}/status", description: "Employee lifecycle transition ACTIVE<->ON_LEAVE, ->TERMINATED; terminating auto-cancels pending DCRs", roles: [HRServicesAdmin], code: 200, input: [status], output: Employee, side_effects: ["cascade: pending DCRs -> CANCELLED on TERMINATED", "increments Employee.version by 1"] }
  - { method: GET, path: "/hr-helpdesk/employees/{id}/audit-log", description: "Audit trail of profile data changes for the employee, newest first (created_at DESC)", roles: [Employee, HRServicesAdmin, HRDataSteward], code: 200, input: ["limit?", "offset?"], output: "AuditLogEntry[]", side_effects: [none] }
  # ---- Teams & Agents ----
  - { method: POST, path: "/hr-helpdesk/teams", description: "Create team", roles: [HRServicesAdmin], code: 201, input: [name, "description?"], output: Team, side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/teams", description: "List teams", roles: [HRServicesAdmin, WorkforcePlanner, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: ["limit?", "offset?"], output: "Team[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/teams/{id}", description: "Read one team", roles: [HRServicesAdmin, WorkforcePlanner, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [], output: Team, side_effects: [none] }
  - { method: POST, path: "/hr-helpdesk/agents", description: "Create agent", roles: [HRServicesAdmin], code: 201, input: [display_name, email, tier, team_id, "clearance?", "capacity_max?", "active?"], output: Agent, side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/agents", description: "List agents with filters", roles: [HRServicesAdmin, WorkforcePlanner, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: ["team_id?", "tier?", "clearance?", "active?", "limit?", "offset?"], output: "Agent[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/agents/{id}", description: "Read one agent (includes computed assigned_open_count, rolling_csat, coaching_hold)", roles: [HRServicesAdmin, WorkforcePlanner, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [], output: Agent, side_effects: [none] }
  # ---- Categories & SLA policies ----
  - { method: POST, path: "/hr-helpdesk/ticket-categories", description: "Create ticket category", roles: [HRServicesAdmin], code: 201, input: [code, name, specialist_team_id, "is_sensitive?", "active?"], output: TicketCategory, side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/ticket-categories", description: "List categories", roles: [Employee, HRServicesAdmin, HRDataSteward, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager, KnowledgeManager, WorkforcePlanner], code: 200, input: ["active?", "specialist_team_id?", "limit?", "offset?"], output: "TicketCategory[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/ticket-categories/{id}", description: "Read one category", roles: [Employee, HRServicesAdmin, HRDataSteward, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager, KnowledgeManager, WorkforcePlanner], code: 200, input: [], output: TicketCategory, side_effects: [none] }
  - { method: POST, path: "/hr-helpdesk/sla-policies", description: "Create SLA policy row for (category_id, priority); duplicate pair rejected", roles: [HRServicesAdmin], code: 201, input: [category_id, priority, first_response_minutes, resolution_minutes, "clock_mode?"], output: SlaPolicy, side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/sla-policies", description: "List SLA policy rows", roles: [HRServicesAdmin, WorkforcePlanner, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: ["category_id?", "priority?", "limit?", "offset?"], output: "SlaPolicy[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/ticket-categories/{id}/sla-policies", description: "SLA policy rows of one category (reverse FK reachability)", roles: [HRServicesAdmin, WorkforcePlanner, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: ["limit?", "offset?"], output: "SlaPolicy[]", side_effects: [none] }
  # ---- Knowledge base ----
  - { method: POST, path: "/hr-helpdesk/kb-articles", description: "Author article draft; supersedes_article_id creates a revision of a PUBLISHED article; author_user_id := caller", roles: [KnowledgeManager, HelpDeskAgent, SpecialistAgent], code: 201, input: [title, body, category_id, "keywords?", "supersedes_article_id?"], output: KbArticle, side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/kb-articles", description: "List/search articles; q matches case-insensitive substring of title/keywords; role Employee sees PUBLISHED only; sort view_count DESC, created_at DESC", roles: [Employee, KnowledgeManager, HRServicesAdmin, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: ["q?", "category_id?", "status?", "supersedes_article_id?", "limit?", "offset?"], output: "KbArticle[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/kb-articles/{id}", description: "Read one article; role Employee gets ERR_ARTICLE_NOT_FOUND unless status == PUBLISHED", roles: [Employee, KnowledgeManager, HRServicesAdmin, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [], output: KbArticle, side_effects: [none] }
  - { method: POST, path: "/hr-helpdesk/kb-articles/{id}/submit-review", description: "DRAFT -> IN_REVIEW (author or KnowledgeManager)", roles: [KnowledgeManager, HelpDeskAgent, SpecialistAgent], code: 200, input: [], output: KbArticle, side_effects: ["increments KbArticle.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/kb-articles/{id}/publish", description: "IN_REVIEW -> PUBLISHED; SoD: publisher != author; publishing a revision supersedes the chain head atomically", roles: [KnowledgeManager], code: 200, input: [], output: KbArticle, side_effects: ["supersede: prior PUBLISHED chain head -> SUPERSEDED", "increments KbArticle.version by 1 (and superseded article's version)"] }
  - { method: POST, path: "/hr-helpdesk/kb-articles/{id}/return-draft", description: "IN_REVIEW -> DRAFT rework loop", roles: [KnowledgeManager], code: 200, input: ["note?"], output: KbArticle, side_effects: ["increments KbArticle.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/kb-articles/{id}/archive", description: "PUBLISHED -> ARCHIVED", roles: [KnowledgeManager], code: 200, input: [], output: KbArticle, side_effects: ["increments KbArticle.version by 1"] }
  # ---- Article views (deflection telemetry) ----
  - { method: POST, path: "/hr-helpdesk/article-views", description: "Record a self-service article view by the calling employee; article must be PUBLISHED; viewed_at stamped from logical clock", roles: [Employee], code: 201, input: [article_id], output: ArticleView, side_effects: ["KbArticle.view_count recomputed"] }
  - { method: GET, path: "/hr-helpdesk/article-views", description: "List article views with filters", roles: [HRServicesAdmin, KnowledgeManager, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: ["employee_id?", "article_id?", "deflection_outcome?", "limit?", "offset?"], output: "ArticleView[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/article-views/{id}", description: "Read one article view (owner employee or staff)", roles: [Employee, HRServicesAdmin, KnowledgeManager, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [], output: ArticleView, side_effects: [none] }
  # ---- Tickets ----
  - { method: POST, path: "/hr-helpdesk/tickets", description: "Intake a ticket; computes SLA deadlines (with surge multiplier), links deflection ArticleView, auto-assigns SENSITIVE-clearance agent when category is sensitive (selector: active, clearance SENSITIVE, assigned_open_count < capacity_max; rank assigned_open_count ASC then created_at ASC; empty pool leaves unassigned NEW)", roles: [Employee], code: 201, input: [employee_id, category_id, subject, description, "priority?"], output: Ticket, side_effects: ["sla_deadline_calculation", "deflection_link_and_rate (link step)", "TicketEvent(CREATED)", "Employee.open_ticket_count recomputed"] }
  - { method: GET, path: "/hr-helpdesk/tickets", description: "List tickets with filters; role Employee force-scoped to own employee_id; sla_status lazily re-evaluated", roles: [Employee, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager, HRServicesAdmin], code: 200, input: ["employee_id?", "assigned_agent_id?", "category_id?", "workflow_status?", "sla_status?", "priority?", "source_article_id?", "resolution_article_id?", "limit?", "offset?"], output: "Ticket[]", side_effects: ["lazy sla_clock_evaluation"] }
  - { method: GET, path: "/hr-helpdesk/tickets/{id}", description: "Read one ticket; sensitive tickets return subject/description as [REDACTED] with masked=true for agents lacking SENSITIVE clearance (owner employee and SENSITIVE-cleared staff see full)", roles: [Employee, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager, HRServicesAdmin], code: 200, input: [], output: Ticket, side_effects: ["lazy sla_clock_evaluation"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/triage", description: "NEW -> TRIAGED; optional priority override recomputes SLA deadlines from created_at with creation-time surge multiplier", roles: [HelpDeskAgent, SensitiveCaseManager], code: 200, input: ["priority?"], output: Ticket, side_effects: ["sla_deadline_calculation (only when priority override supplied)", "TicketEvent(TRIAGED)", "increments Ticket.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/assign", description: "Assign/reassign an agent (OCC on expected_ticket_version); capacity, clearance, tier checks; {NEW,TRIAGED,ESCALATED,REOPENED} -> IN_PROGRESS", roles: [HelpDeskAgent, SpecialistAgent, SensitiveCaseManager, HRServicesAdmin], code: 200, input: [agent_id, expected_ticket_version], output: Ticket, side_effects: ["TicketEvent(ASSIGNED)", "increments Ticket.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/respond", description: "Agent response; sets first_responded_at iff null; workflow_status unchanged", roles: [HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [body], output: Ticket, side_effects: ["TicketEvent(RESPONDED)", "increments Ticket.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/request-info", description: "IN_PROGRESS -> PENDING_EMPLOYEE", roles: [HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [body], output: Ticket, side_effects: ["TicketEvent(INFO_REQUESTED)", "increments Ticket.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/provide-info", description: "PENDING_EMPLOYEE -> IN_PROGRESS (owner employee)", roles: [Employee], code: 200, input: [body], output: Ticket, side_effects: ["TicketEvent(INFO_PROVIDED)", "increments Ticket.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/escalate", description: "TRIAGED/IN_PROGRESS -> ESCALATED; tier T1->T2; auto-assigns T2 specialist of category.specialist_team_id (selector: active, tier T2, clearance SENSITIVE when ticket.sensitive, assigned_open_count < capacity_max; rank assigned_open_count ASC then created_at ASC; empty pool -> ERR_NO_ELIGIBLE_SPECIALIST); SLA clocks unchanged", roles: [HelpDeskAgent], code: 200, input: ["reason?"], output: Ticket, side_effects: ["TicketEvent(ESCALATED)", "increments Ticket.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/resolve", description: "IN_PROGRESS/REOPENED -> RESOLVED; sets sla_status MET/BREACHED_RESOLUTION; creates SurveyResponse(ISSUED) on first resolution only", roles: [HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [resolution_summary, "resolution_article_id?"], output: Ticket, side_effects: ["SurveyResponse created (first resolution)", "TicketEvent(RESOLVED)", "increments Ticket.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/reopen", description: "RESOLVED -> REOPENED within REOPEN_WINDOW_HOURS of resolved_at (inclusive); re-anchors resolution_due_at; no new survey", roles: [Employee], code: 200, input: [reason], output: Ticket, side_effects: ["sla_deadline_calculation (re-anchor from reopen instant)", "TicketEvent(REOPENED)", "increments Ticket.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/close", description: "RESOLVED -> CLOSED (owner employee)", roles: [Employee], code: 200, input: [], output: Ticket, side_effects: ["TicketEvent(CLOSED)", "increments Ticket.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/tickets/{id}/cancel", description: "NEW/TRIAGED -> CANCELLED (owner employee); unassigns", roles: [Employee], code: 200, input: ["reason?"], output: Ticket, side_effects: ["TicketEvent(CANCELLED)", "increments Ticket.version by 1"] }
  - { method: GET, path: "/hr-helpdesk/tickets/{id}/events", description: "Ticket event log, chronological (created_at ASC)", roles: [Employee, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager, HRServicesAdmin], code: 200, input: ["limit?", "offset?"], output: "TicketEvent[]", side_effects: [none] }
  # ---- Data change requests & fraud verification ----
  - { method: POST, path: "/hr-helpdesk/data-change-requests", description: "Submit a profile data change (OCC on expected_employee_version); fraud requirement decided per DataChangeRequestFraud note; creates FraudVerification with server-minted challenge_code when required", roles: [Employee], code: 201, input: [employee_id, change_type, new_values, expected_employee_version], output: DataChangeRequest, side_effects: ["FraudVerification created when required", "Employee.has_pending_dcr := true", "increments Employee.version by 1"] }
  - { method: GET, path: "/hr-helpdesk/data-change-requests", description: "List DCRs; role Employee force-scoped to own", roles: [Employee, HRDataSteward, HRServicesAdmin], code: 200, input: ["employee_id?", "approval_status?", "change_type?", "limit?", "offset?"], output: "DataChangeRequest[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/data-change-requests/{id}", description: "Read one DCR (owner employee / steward / admin)", roles: [Employee, HRDataSteward, HRServicesAdmin], code: 200, input: [], output: DataChangeRequest, side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/data-change-requests/{id}/fraud-verifications", description: "Fraud verification record(s) of the DCR (0-1 entries); exposes challenge_code to the owner employee", roles: [Employee, HRDataSteward, HRServicesAdmin], code: 200, input: ["limit?", "offset?"], output: "FraudVerification[]", side_effects: [none] }
  - { method: POST, path: "/hr-helpdesk/data-change-requests/{id}/verify", description: "Attempt fraud verification; SECURITY_CODE matches challenge_code; MANAGER_CONFIRMATION requires caller = employee's manager; wrong code -> 422 + attempts+1; 3rd failure locks and rejects the DCR", roles: [Employee], code: 200, input: [method, "evidence_code?"], output: DataChangeRequest, side_effects: ["FraudVerification status/attempts updated", "on success: approval_status -> PENDING_APPROVAL", "on 3rd failure: approval_status -> REJECTED, fraud_status -> LOCKED", "increments DataChangeRequest.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/data-change-requests/{id}/approve", description: "PENDING_APPROVAL -> APPLIED; fraud gate + employee-active + SoD; writes Employee profile fields, appends per-field AuditLogEntry, auto-cancels sibling pending DCRs", roles: [HRDataSteward], code: 200, input: [], output: DataChangeRequest, side_effects: ["Employee profile fields written; increments Employee.version by 1", "AuditLogEntry per changed field", "sibling PENDING_* DCRs -> CANCELLED", "Employee.has_pending_dcr recomputed", "increments DataChangeRequest.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/data-change-requests/{id}/reject", description: "PENDING_APPROVAL -> REJECTED (steward)", roles: [HRDataSteward], code: 200, input: [reason], output: DataChangeRequest, side_effects: ["Employee.has_pending_dcr recomputed", "increments DataChangeRequest.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/data-change-requests/{id}/cancel", description: "PENDING_* -> CANCELLED (owner employee)", roles: [Employee], code: 200, input: [], output: DataChangeRequest, side_effects: ["Employee.has_pending_dcr recomputed", "increments DataChangeRequest.version by 1"] }
  # ---- Surveys ----
  - { method: GET, path: "/hr-helpdesk/surveys", description: "List surveys; role Employee force-scoped to own", roles: [Employee, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager, HRServicesAdmin], code: 200, input: ["employee_id?", "ticket_id?", "agent_id?", "status?", "limit?", "offset?"], output: "SurveyResponse[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/surveys/{id}", description: "Read one survey (owner / staff)", roles: [Employee, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager, HRServicesAdmin], code: 200, input: [], output: SurveyResponse, side_effects: [none] }
  - { method: POST, path: "/hr-helpdesk/surveys/{id}/submit", description: "ISSUED -> SUBMITTED with score 1..5; recomputes attributed agent rolling CSAT and coaching_hold (with ticket-release cascade on flip to true)", roles: [Employee], code: 200, input: [score, "comment?"], output: SurveyResponse, side_effects: ["csat_rolling_calculation", "coaching cascade (see SurveyResponse machine)"] }
  # ---- Seasonal staffing ----
  - { method: POST, path: "/hr-helpdesk/staffing-windows", description: "Create seasonal staffing window; per-team closed-interval overlap rejected (touching endpoints conflict)", roles: [WorkforcePlanner], code: 201, input: [team_id, name, window_start, window_end, required_t1_hours, required_t2_hours, "sla_multiplier?"], output: StaffingWindow, side_effects: ["status computed from logical clock at creation"] }
  - { method: GET, path: "/hr-helpdesk/staffing-windows", description: "List staffing windows", roles: [WorkforcePlanner, HRServicesAdmin, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: ["team_id?", "status?", "limit?", "offset?"], output: "StaffingWindow[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/staffing-windows/{id}", description: "Read one window including computed covered_t1_hours/covered_t2_hours/coverage_posture", roles: [WorkforcePlanner, HRServicesAdmin, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [], output: StaffingWindow, side_effects: ["staffing_coverage_posture recomputed"] }
  - { method: POST, path: "/hr-helpdesk/staffing-windows/{id}/cancel", description: "PLANNED/ACTIVE -> CANCELLED", roles: [WorkforcePlanner], code: 200, input: [], output: StaffingWindow, side_effects: ["increments StaffingWindow.version by 1"] }
  - { method: POST, path: "/hr-helpdesk/agent-shifts", description: "Schedule an agent shift inside a window; per-agent half-open overlap rejected (back-to-back allowed); window must be PLANNED/ACTIVE; shift must lie within window bounds", roles: [WorkforcePlanner], code: 201, input: [agent_id, staffing_window_id, shift_start, shift_end], output: AgentShift, side_effects: ["staffing_coverage_posture recomputed"] }
  - { method: GET, path: "/hr-helpdesk/agent-shifts", description: "List shifts", roles: [WorkforcePlanner, HRServicesAdmin], code: 200, input: ["agent_id?", "staffing_window_id?", "status?", "limit?", "offset?"], output: "AgentShift[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/agent-shifts/{id}", description: "Read one shift", roles: [WorkforcePlanner, HRServicesAdmin], code: 200, input: [], output: AgentShift, side_effects: [none] }
  - { method: POST, path: "/hr-helpdesk/agent-shifts/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [WorkforcePlanner], code: 200, input: [], output: AgentShift, side_effects: ["staffing_coverage_posture recomputed"] }
  # ---- Audit ----
  - { method: GET, path: "/hr-helpdesk/audit-log-entries", description: "Global audit trail of employee data changes with filters", roles: [HRServicesAdmin, HRDataSteward], code: 200, input: ["employee_id?", "dcr_id?", "change_source?", "limit?", "offset?"], output: "AuditLogEntry[]", side_effects: [none] }
  - { method: GET, path: "/hr-helpdesk/audit-log-entries/{id}", description: "Read one audit log entry", roles: [HRServicesAdmin, HRDataSteward], code: 200, input: [], output: AuditLogEntry, side_effects: [none] }
  # ---- Metrics (computed reads) ----
  - { method: GET, path: "/hr-helpdesk/metrics/deflection", description: "KB deflection rate for a category over trailing 30 days", roles: [HRServicesAdmin, KnowledgeManager, WorkforcePlanner], code: 200, input: [category_id], output: "{ category_id: string, window_days: integer, view_count: integer, ticket_created_count: integer, deflection_rate: number }", side_effects: ["deflection_link_and_rate (rate step)"] }
  - { method: GET, path: "/hr-helpdesk/metrics/sla-attainment", description: "SLA attainment for a category over tickets that reached resolution", roles: [HRServicesAdmin, WorkforcePlanner, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [category_id], output: "{ category_id: string, met_count: integer, breached_count: integer, attainment_pct: number }", side_effects: ["sla_attainment_calculation"] }
  - { method: GET, path: "/hr-helpdesk/metrics/csat", description: "Agent CSAT over trailing 30 days: simple_mean and recency_weighted_mean per pinned rounding order", roles: [HRServicesAdmin, WorkforcePlanner, HelpDeskAgent, SpecialistAgent, SensitiveCaseManager], code: 200, input: [agent_id], output: "{ agent_id: string, window_days: integer, survey_count: integer, simple_mean: number, recency_weighted_mean: number }", side_effects: ["csat_rolling_calculation"] }
  # ---- Test-driving clock ----
  - { method: POST, path: "/hr-helpdesk/_clock/set_current_utc", description: "Set the logical clock. Startup default before any call is exactly 2026-08-01T00:00:00Z (never wall-clock). Advancing re-evaluates: ticket sla_status (TicketSlaClock), survey expiry (ISSUED->EXPIRED past expires_at), RESOLVED ticket auto-close past AUTO_CLOSE_DAYS, staffing window activation/completion", roles: [HRServicesAdmin], code: 200, input: [to_iso8601], output: "{ now_utc: string }", side_effects: ["sla_clock_evaluation", "survey expiry sweep", "ticket auto-close sweep", "staffing window status sweep"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/invalid X-User-Role or X-User-ID, or entity_backed X-User-ID references no row" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "role not in endpoint roles, or record-level ownership/scope violated (incl. MANAGER_CONFIRMATION by non-manager)" }
  - { id: ERR_VALIDATION, http: 400, condition: "missing required field, wrong type, or incomplete new_values sub-fields for the change_type" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "enum field carries a value outside its declared set" }
  - { id: ERR_EMPLOYEE_NOT_FOUND, http: 404, condition: "no Employee with the referenced id" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "no Agent with the referenced id" }
  - { id: ERR_TEAM_NOT_FOUND, http: 404, condition: "no Team with the referenced id" }
  - { id: ERR_CATEGORY_NOT_FOUND, http: 404, condition: "no TicketCategory with the referenced id" }
  - { id: ERR_SLA_POLICY_NOT_FOUND, http: 404, condition: "no SlaPolicy row for (category_id, priority) at ticket intake" }
  - { id: ERR_ARTICLE_NOT_FOUND, http: 404, condition: "no KbArticle with the referenced id; also returned to role Employee for non-PUBLISHED articles" }
  - { id: ERR_TICKET_NOT_FOUND, http: 404, condition: "no Ticket with the referenced id" }
  - { id: ERR_DCR_NOT_FOUND, http: 404, condition: "no DataChangeRequest with the referenced id" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "no SurveyResponse with the referenced id" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "no StaffingWindow with the referenced id" }
  - { id: ERR_SHIFT_NOT_FOUND, http: 404, condition: "no AgentShift with the referenced id" }
  - { id: ERR_TICKET_INVALID_STATE, http: 409, condition: "ticket workflow_status is not a from-state of the requested transition (incl. escalating a T2 ticket)" }
  - { id: ERR_DCR_INVALID_STATE, http: 409, condition: "DCR approval_status is not a from-state of the requested transition" }
  - { id: ERR_ARTICLE_INVALID_STATE, http: 409, condition: "KbArticle status is not a from-state of the requested transition (incl. publishing a revision whose supersedes target is no longer PUBLISHED, or creating a revision of a non-PUBLISHED article)" }
  - { id: ERR_SURVEY_INVALID_STATE, http: 409, condition: "survey not in ISSUED for submit (already SUBMITTED or EXPIRED)" }
  - { id: ERR_WINDOW_INVALID_STATE, http: 409, condition: "staffing window not in a from-state of the requested transition (e.g. shift into COMPLETED/CANCELLED window, cancel of COMPLETED window)" }
  - { id: ERR_SHIFT_INVALID_STATE, http: 409, condition: "shift not SCHEDULED for cancel" }
  - { id: ERR_EMPLOYEE_INVALID_STATE, http: 409, condition: "employee status transition invalid (any transition out of TERMINATED)" }
  - { id: ERR_CONFIDENTIALITY_CLEARANCE_REQUIRED, http: 403, condition: "write/action on a sensitive ticket by an agent whose clearance is STANDARD (reads are masked instead of rejected)" }
  - { id: ERR_FRAUD_VERIFICATION_REQUIRED, http: 409, condition: "approve attempted while fraud_status is PENDING or FAILED" }
  - { id: ERR_FRAUD_VERIFICATION_LOCKED, http: 409, condition: "verify attempted after the verification is LOCKED (or DCR already rejected by lockout)" }
  - { id: ERR_FRAUD_EVIDENCE_MISMATCH, http: 422, condition: "SECURITY_CODE evidence_code does not equal the challenge_code; attempt recorded, attempts incremented" }
  - { id: ERR_EMPLOYEE_INACTIVE, http: 422, condition: "DCR create/approve while Employee.status is ON_LEAVE or TERMINATED" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "approve/reject where caller X-User-ID equals the DCR's employee_id" }
  - { id: ERR_VERIFIER_CANNOT_APPROVE, http: 403, condition: "approve where caller X-User-ID equals FraudVerification.verified_by_user_id" }
  - { id: ERR_AUTHOR_CANNOT_PUBLISH, http: 403, condition: "publish where caller X-User-ID equals KbArticle.author_user_id" }
  - { id: ERR_AGENT_AT_CAPACITY, http: 409, condition: "assignee.assigned_open_count >= assignee.capacity_max (capacity_max 0 means never assignable)" }
  - { id: ERR_AGENT_TIER_INSUFFICIENT, http: 409, condition: "assignee.tier != ticket.tier on manual assign" }
  - { id: ERR_NO_ELIGIBLE_SPECIALIST, http: 422, condition: "escalate selector pool empty (no active T2 agent of the category's specialist team under capacity with required clearance)" }
  - { id: ERR_SHIFT_OVERLAP, http: 409, condition: "new shift strictly overlaps another SCHEDULED shift of the same agent (half-open [start,end): touching endpoints allowed)" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "new window intersects another PLANNED/ACTIVE window of the same team (closed-interval: touching endpoints conflict)" }
  - { id: ERR_SLA_POLICY_DUPLICATE, http: 409, condition: "SlaPolicy row already exists for (category_id, priority)" }
  - { id: ERR_DUPLICATE_DATA_CHANGE_PENDING, http: 409, condition: "employee already has a PENDING_VERIFICATION/PENDING_APPROVAL DCR of the same change_type" }
  - { id: ERR_DUPLICATE_EMPLOYEE_NUMBER, http: 409, condition: "employee_number already exists" }
  - { id: ERR_DUPLICATE_CATEGORY_CODE, http: 409, condition: "category code already exists" }
  - { id: ERR_REOPEN_WINDOW_PASSED, http: 409, condition: "reopen attempted after resolved_at + REOPEN_WINDOW_HOURS (72h, inclusive boundary)" }
  - { id: ERR_SURVEY_EXPIRED, http: 409, condition: "submit attempted when now > expires_at (lazy expiry) or survey already EXPIRED" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "shift_end <= shift_start, or window_end < window_start" }
  - { id: ERR_SHIFT_OUTSIDE_WINDOW, http: 422, condition: "shift_start < window_start or shift_end > window_end" }
  - { id: ERR_RESOLUTION_ARTICLE_NOT_PUBLISHED, http: 422, condition: "resolution_article_id references an article whose status is not PUBLISHED" }
  - { id: ERR_CATEGORY_INACTIVE, http: 422, condition: "ticket intake into a category with active == false" }
  - { id: ERR_STALE_TICKET_VERSION, http: 412, condition: "expected_ticket_version != current Ticket.version on assign" }
  - { id: ERR_STALE_EMPLOYEE_VERSION, http: 412, condition: "expected_employee_version != current Employee.version on DCR create" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Employee
    description: "Employee self-service user; owns tickets, DCRs, surveys, article views"
    identity: "entity_backed:Employee"
    exclusive_operations: ["create ticket (own)", "provide-info / reopen / close / cancel own ticket", "create/cancel own DCR", "verify own DCR fraud challenge (SECURITY_CODE, or MANAGER_CONFIRMATION as manager of record)", "submit own survey", "record article view"]
    shared_operations: ["read published KB articles / search", "read own employee record and audit log", "list categories"]
  - name: HelpDeskAgent
    description: "Tier-1 generalist agent; triages, responds, resolves, escalates"
    identity: "entity_backed:Agent"
    exclusive_operations: ["triage ticket", "escalate ticket"]
    shared_operations: ["read/assign/respond/request-info/resolve non-sensitive tickets", "author KB drafts", "read agents/teams/categories/sla-policies", "read ticket events"]
  - name: SpecialistAgent
    description: "Tier-2 specialist; picks up escalated tickets of own team"
    identity: "entity_backed:Agent"
    exclusive_operations: ["self-assign ESCALATED T2 tickets"]
    shared_operations: ["read/respond/request-info/resolve non-sensitive tickets", "author KB drafts", "read ticket events"]
  - name: SensitiveCaseManager
    description: "SENSITIVE-cleared agent; the only agent role that may act on sensitive-category tickets"
    identity: "entity_backed:Agent"
    exclusive_operations: ["triage/assign/respond/resolve sensitive tickets (clearance SENSITIVE)"]
    shared_operations: ["all non-sensitive ticket actions shared with HelpDeskAgent/SpecialistAgent", "read ticket events"]
  - name: KnowledgeManager
    description: "KB editorial owner; may not publish an article they authored (SoD)"
    identity: "opaque"
    exclusive_operations: ["publish article", "return-draft", "archive article"]
    shared_operations: ["author KB drafts", "read articles/views", "read deflection metrics"]
  - name: HRDataSteward
    description: "Compliance approver for data change requests; may not approve own request or a request they verified (SoD)"
    identity: "opaque"
    exclusive_operations: ["approve DCR", "reject DCR"]
    shared_operations: ["read employees/DCRs/fraud-verifications", "read audit log"]
  - name: WorkforcePlanner
    description: "Seasonal staffing planner; owns staffing windows and shifts"
    identity: "opaque"
    exclusive_operations: ["create/cancel staffing windows", "create/cancel agent shifts"]
    shared_operations: ["read agents/teams/windows/shifts", "read SLA attainment and CSAT metrics"]
  - name: HRServicesAdmin
    description: "Platform administrator for the shared services center; configuration and lifecycle authority"
    identity: "opaque"
    exclusive_operations: ["create employees/teams/agents/categories/sla-policies", "employee status transitions", "set logical clock"]
    shared_operations: ["read all non-masked resources", "assign tickets", "read audit log"]

# Derived-constant annex (referenced by machines/calculations):
constants_annex:
  REOPEN_WINDOW_HOURS: 72
  AUTO_CLOSE_DAYS: 5
  SURVEY_TTL_DAYS: 7
  FRAUD_MAX_ATTEMPTS: 3
  FRAUD_LOOKBACK_DAYS: 30
  MASKED_PLACEHOLDER: "[REDACTED]"
