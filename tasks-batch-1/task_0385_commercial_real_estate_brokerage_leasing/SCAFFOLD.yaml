# =============================================================================
# Commercial Real Estate Brokerage & Leasing — seed tables (SCAFFOLD.yaml, §1.0–§1.7)
# =============================================================================

scenario: "385. Commercial Real Estate Brokerage & Leasing: property/space inventory & availability, tenant-rep & requirement matching, tour scheduling, LOI & lease proposal, commission split (listing/procuring), pipeline/deal stage, market comps, co-broke"

domain_name: cre-brokerage-leasing
api_prefix: ""   # flat top-level resource collections (/brokerages, /spaces, /listings, /deals, ...) — no shared nesting prefix

# -----------------------------------------------------------------------------
# Complexity profile (§0.1–§0.4)
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation        # LOI / lease-proposal counter-offer rounds between listing-side and tenant-side brokers
  secondary_archetype: temporal_windowing           # tour scheduling against per-space availability windows with buffer + showing-hold semantics
  complexity_layers:
    - optimistic_concurrency                         # OCC on Deal.version for proposal submission (CREATE-with-supersede of the open round)
    - cascading_side_effects                         # execute-deal cascades across Space, Listing, sibling Deals, Requirement
    - dual_variant_calculation                       # gross-vs-net effective rent; pro-rata-vs-fixed commission split
    - derived_field_reconciliation                   # Listing.available_sf / Space.status / Requirement.match_count recomputed on cascade

  entity_topology: graph                             # Deal is a many-to-many junction binding Listing + Requirement + two Brokers; Comp references a Space; flat FK references, no nested ownership tree
  state_machine_shape: cyclic                        # Deal proposal rounds loop COUNTERED -> COUNTERED (negotiation); Tour has revert; Listing/Space branch
  relationship_patterns:
    - many_to_many                                   # Deal junctions Listing<->Requirement; ShowingHold junctions Tour<->Space
    - cross_aggregate                                # Deal transitions gated by Listing state and Requirement state across aggregate boundaries
    - polymorphic                                    # (not used) — kept flat
  role_model: peer_roles                             # ListingBroker owns Listings/Spaces; TenantBroker owns Requirements/Tours; BrokerageAdmin operational; both broker roles co-own a Deal
  consistency_model: immediate                       # all cascades atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Brokerage
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brokerage firm name" }
      - { name: side, type: enum, source: input, description: "LISTING | TENANT_REP | DUAL — which side(s) this firm operates", constraints: "one of LISTING, TENANT_REP, DUAL" }
      - { name: default_commission_pct, type: number, source: input, description: "Default total commission rate as a fraction of total lease consideration, e.g. 0.06", default: 0.06, constraints: "0 < value <= 0.15" }

  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: brokerage_id, type: string, source: input, description: "FK -> Brokerage.id; the firm this broker belongs to" }
      - { name: full_name, type: string, source: input, description: "Broker full name" }
      - { name: license_no, type: string, source: input, description: "State license number (unique among brokers)", constraints: "unique across all Broker rows" }
      - { name: role, type: enum, source: input, description: "LISTING_BROKER | TENANT_BROKER | ADMIN — the broker's operating capacity", constraints: "one of LISTING_BROKER, TENANT_BROKER, ADMIN" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — SUSPENDED brokers cannot create deals or proposals", default: "ACTIVE", constraints: "one of ACTIVE, SUSPENDED" }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: listing_broker_id, type: string, source: input, description: "FK -> Broker.id; the LISTING_BROKER who controls this property" }
      - { name: name, type: string, source: input, description: "Building / property name" }
      - { name: market, type: string, source: input, description: "Submarket code, e.g. SOMA-SF", constraints: "non-empty" }
      - { name: asset_class, type: enum, source: input, description: "OFFICE | RETAIL | INDUSTRIAL | FLEX", constraints: "one of OFFICE, RETAIL, INDUSTRIAL, FLEX" }
      - { name: total_sf, type: integer, source: input, description: "Total rentable square feet of the building", constraints: "value >= 1" }
      - { name: available_sf, type: integer, source: computed, description: "Sum of rentable_sf over child Spaces whose status == AVAILABLE (only); recomputed on any Space status change. ON_HOLD, UNDER_LOI, LEASED, OFF_MARKET, DRAFT spaces are excluded — so accept (AVAILABLE->UNDER_LOI) decrements it and a compensating kill (UNDER_LOI->AVAILABLE) restores it exactly." }

  - name: Space
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; the building this suite belongs to" }
      - { name: suite_no, type: string, source: input, description: "Suite / unit label, unique within a property", constraints: "unique per (property_id, suite_no)" }
      - { name: rentable_sf, type: integer, source: input, description: "Rentable square feet of this suite", constraints: "value >= 1" }
      - { name: asking_rent_psf_yr, type: number, source: input, description: "Asking base rent per square foot per year (annual, full-service unless overridden)", constraints: "value > 0" }
      - { name: free_rent_months, type: integer, source: input, description: "Months of free rent offered in the asking package", default: 0, constraints: "0 <= value <= 24" }
      - { name: ti_allowance_psf, type: number, source: input, description: "Tenant-improvement allowance per square foot in the asking package", default: 0, constraints: "value >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | AVAILABLE | ON_HOLD | UNDER_LOI | LEASED | OFF_MARKET", default: "DRAFT", constraints: "one of DRAFT, AVAILABLE, ON_HOLD, UNDER_LOI, LEASED, OFF_MARKET" }
      - { name: held_by_tour_id, type: string, source: system, description: "FK -> Tour.id; the Tour holding this space via ShowingHold while status=ON_HOLD; null otherwise" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: space_id, type: string, source: input, description: "FK -> Space.id; the suite being marketed by this listing" }
      - { name: listing_broker_id, type: string, source: input, description: "FK -> Broker.id; the LISTING_BROKER of record" }
      - { name: term_months, type: integer, source: input, description: "Marketed lease term in months", constraints: "value >= 1" }
      - { name: annual_escalation_pct, type: number, source: input, description: "Annual base-rent escalation as a fraction, e.g. 0.03 = 3% per year", default: 0.03, constraints: "0 <= value <= 0.20" }
      - { name: co_broke_offered_pct, type: number, source: input, description: "Fraction of the TOTAL commission the listing side offers the procuring (tenant) side on a co-broke deal, e.g. 0.50", default: 0.5, constraints: "0 <= value <= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | UNDER_NEGOTIATION | EXECUTED | WITHDRAWN", default: "DRAFT", constraints: "one of DRAFT, ACTIVE, UNDER_NEGOTIATION, EXECUTED, WITHDRAWN" }
      - { name: open_deal_count, type: integer, source: computed, description: "Count of child Deals whose stage NOT IN {DEAD, EXECUTED}; recomputed on any Deal stage change" }

  - name: Requirement
    parent: null
    common_fields: true
    fields:
      - { name: tenant_broker_id, type: string, source: input, description: "FK -> Broker.id; the TENANT_BROKER representing the prospect" }
      - { name: tenant_name, type: string, source: input, description: "Prospective tenant company name" }
      - { name: market, type: string, source: input, description: "Target submarket code; matched against Property.market", constraints: "non-empty" }
      - { name: asset_class, type: enum, source: input, description: "Required asset class; matched against Property.asset_class", constraints: "one of OFFICE, RETAIL, INDUSTRIAL, FLEX" }
      - { name: min_sf, type: integer, source: input, description: "Minimum acceptable rentable square feet", constraints: "value >= 1" }
      - { name: max_sf, type: integer, source: input, description: "Maximum acceptable rentable square feet", constraints: "value >= min_sf" }
      - { name: max_rent_psf_yr, type: number, source: input, description: "Maximum acceptable asking base rent per square foot per year", constraints: "value > 0" }
      - { name: status, type: enum, source: system, description: "OPEN | TOURING | NEGOTIATING | PLACED | CLOSED_LOST", default: "OPEN", constraints: "one of OPEN, TOURING, NEGOTIATING, PLACED, CLOSED_LOST" }
      - { name: match_count, type: integer, source: computed, description: "Count of currently-matching Listings per the matching predicate in §1.3; recomputed when this Requirement or any candidate Space/Listing changes" }

  - name: Tour
    parent: null
    common_fields: true
    fields:
      - { name: requirement_id, type: string, source: input, description: "FK -> Requirement.id; the search this tour serves" }
      - { name: tenant_broker_id, type: string, source: input, description: "FK -> Broker.id; the TENANT_BROKER conducting the tour" }
      - { name: space_id, type: string, source: input, description: "FK -> Space.id; the suite being toured" }
      - { name: window_start, type: datetime, source: input, description: "Tour window start (ISO 8601 UTC); half-open interval [window_start, window_end)", constraints: "window_start < window_end" }
      - { name: window_end, type: datetime, source: input, description: "Tour window end (ISO 8601 UTC), exclusive" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | COMPLETED | CANCELLED | NO_SHOW", default: "REQUESTED", constraints: "one of REQUESTED, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW" }
      - { name: holds_space, type: boolean, source: system, description: "True while this Tour holds its Space via a ShowingHold (status CONFIRMED with hold flag); set false on COMPLETED/CANCELLED/NO_SHOW", default: false }

  - name: Deal
    parent: null
    common_fields: true
    fields:
      - { name: listing_id, type: string, source: input, description: "FK -> Listing.id; the marketed listing under negotiation" }
      - { name: requirement_id, type: string, source: input, description: "FK -> Requirement.id; the tenant requirement being placed" }
      - { name: listing_broker_id, type: string, source: input, description: "FK -> Broker.id; LISTING_BROKER side of the deal" }
      - { name: procuring_broker_id, type: string, source: input, description: "FK -> Broker.id; TENANT_BROKER side (the procuring cause); equals listing_broker_id only when is_co_broke is false" }
      - { name: is_co_broke, type: boolean, source: computed, description: "True when listing_broker_id and procuring_broker_id belong to different Brokerages; drives the commission split variant" }
      - { name: stage, type: enum, source: system, description: "PROSPECT | LOI_DRAFT | LOI_COUNTERED | LOI_ACCEPTED | LEASE_OUT | EXECUTED | DEAD", default: "PROSPECT", constraints: "one of PROSPECT, LOI_DRAFT, LOI_COUNTERED, LOI_ACCEPTED, LEASE_OUT, EXECUTED, DEAD" }
      - { name: round_count, type: integer, source: computed, description: "Count of child Proposals on this Deal; the negotiation round number" }
      - { name: accepted_proposal_id, type: string, source: system, description: "FK -> Proposal.id; the Proposal whose terms were accepted (set on LOI_ACCEPTED); null before acceptance" }
      - { name: total_consideration, type: number, source: computed, description: "Total base-rent consideration of the accepted proposal over the lease term per §1.3 lease_consideration; 0 until LOI_ACCEPTED" }
      - { name: total_commission, type: number, source: computed, description: "Total commission dollars = total_consideration * effective_commission_pct; 0 until LOI_ACCEPTED" }

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; the deal this negotiation round belongs to" }
      - { name: from_side, type: enum, source: input, description: "LISTING | TENANT — which side authored this round", constraints: "one of LISTING, TENANT" }
      - { name: base_rent_psf_yr, type: number, source: input, description: "Proposed year-1 base rent per square foot per year", constraints: "value > 0" }
      - { name: term_months, type: integer, source: input, description: "Proposed lease term in months", constraints: "value >= 1" }
      - { name: free_rent_months, type: integer, source: input, description: "Proposed months of free rent", default: 0, constraints: "0 <= value <= 24" }
      - { name: ti_allowance_psf, type: number, source: input, description: "Proposed tenant-improvement allowance per square foot", default: 0, constraints: "value >= 0" }
      - { name: annual_escalation_pct, type: number, source: input, description: "Proposed annual base-rent escalation fraction", default: 0.03, constraints: "0 <= value <= 0.20" }
      - { name: outcome, type: enum, source: system, description: "PENDING | COUNTERED | ACCEPTED | REJECTED — round disposition", default: "PENDING", constraints: "one of PENDING, COUNTERED, ACCEPTED, REJECTED" }
      - { name: net_effective_rent_psf_yr, type: number, source: computed, description: "Net effective rent PSF/yr for this proposal per §1.3 net_effective_rent" }

  - name: CommissionSplit
    parent: null
    common_fields: false   # immutable ledger row: id + created_at only
    fields:
      - { name: deal_id, type: string, source: input, description: "FK -> Deal.id; the executed deal this split settles" }
      - { name: broker_id, type: string, source: input, description: "FK -> Broker.id; the payee broker" }
      - { name: side, type: enum, source: system, description: "LISTING | PROCURING — which side this payout represents", constraints: "one of LISTING, PROCURING" }
      - { name: amount, type: number, source: computed, description: "Dollar payout for this side per §1.3 commission_split; LISTING + PROCURING amounts sum exactly to Deal.total_commission" }

  - name: Comp
    parent: null
    common_fields: false   # append-only market record: id + created_at only
    fields:
      - { name: space_id, type: string, source: input, description: "FK -> Space.id; the suite the comp records" }
      - { name: deal_id, type: string, source: system, description: "FK -> Deal.id; the executed deal that produced this comp (system-stamped on EXECUTED)" }
      - { name: market, type: string, source: system, description: "Submarket code copied from the Property at execution time" }
      - { name: effective_rent_psf_yr, type: number, source: system, description: "Net effective rent PSF/yr of the executed deal, copied from the accepted Proposal" }
      - { name: term_months, type: integer, source: system, description: "Executed lease term in months" }
      - { name: executed_at, type: datetime, source: system, description: "Server clock value at execution (ISO 8601 UTC)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Space
    initial_state: DRAFT
    terminal_states: [LEASED]
    transitions:
      - from: DRAFT
        to: AVAILABLE
        trigger: "POST /spaces/{spaceId}/publish"
        actor: ListingBroker
        preconditions:
          - "rentable_sf >= 1 and asking_rent_psf_yr > 0"
        side_effects:
          - "Recompute parent Property.available_sf (this Space now counts)"

      - from: AVAILABLE
        to: ON_HOLD
        trigger: "system: Tour REQUESTED->CONFIRMED with hold=true (bubble-up from Tour)"
        actor: system
        preconditions:
          - "No other Space in ON_HOLD or UNDER_LOI conflict (the Tour confirm caused this)"
        side_effects:
          - "Set held_by_tour_id = confirming Tour.id"

      - from: ON_HOLD
        to: AVAILABLE
        trigger: "system: held Tour leaves CONFIRMED (COMPLETED/CANCELLED/NO_SHOW)"
        actor: system
        preconditions: []
        side_effects:
          - "Clear held_by_tour_id = null"
          - "Recompute parent Property.available_sf"

      - from: AVAILABLE
        to: UNDER_LOI
        trigger: "system: a Deal on this Space's Listing reaches LOI_ACCEPTED"
        actor: system
        preconditions:
          - "Space.status == AVAILABLE (ERR_SPACE_NOT_AVAILABLE if not)"
        side_effects:
          - "Recompute parent Property.available_sf (AVAILABLE->UNDER_LOI decrements available_sf by this Space.rentable_sf)"

      - from: ON_HOLD
        to: UNDER_LOI
        trigger: "system: a Deal on this Space's Listing reaches LOI_ACCEPTED"
        actor: system
        preconditions:
          - "The accepting Deal's Requirement equals the Requirement of the holding Tour, OR no holding Tour"
        side_effects:
          - "Clear held_by_tour_id; the holding Tour (if any) -> COMPLETED"

      - from: UNDER_LOI
        to: AVAILABLE
        trigger: "system: the Deal that drove UNDER_LOI goes DEAD before EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute parent Property.available_sf"

      - from: UNDER_LOI
        to: LEASED
        trigger: "system: the Deal reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute parent Property.available_sf (no change: UNDER_LOI and LEASED are both excluded from available_sf)"

      - from: AVAILABLE
        to: OFF_MARKET
        trigger: "POST /spaces/{spaceId}/withdraw"
        actor: ListingBroker
        preconditions:
          - "No child Listing in UNDER_NEGOTIATION; no Space in UNDER_LOI"
        side_effects:
          - "All child Listings in DRAFT/ACTIVE -> WITHDRAWN"
          - "Recompute parent Property.available_sf"

      - from: OFF_MARKET
        to: AVAILABLE
        trigger: "POST /spaces/{spaceId}/publish"
        actor: ListingBroker
        preconditions: []
        side_effects:
          - "Recompute parent Property.available_sf"

  - entity: Listing
    initial_state: DRAFT
    terminal_states: [EXECUTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /listings/{listingId}/activate"
        actor: ListingBroker
        preconditions:
          - "Parent Space.status == AVAILABLE (ERR_SPACE_NOT_AVAILABLE)"
        side_effects:
          - "Recompute owning Requirement.match_count for all requirements matching this listing"

      - from: ACTIVE
        to: UNDER_NEGOTIATION
        trigger: "system: first child Deal advances to LOI_DRAFT"
        actor: system
        preconditions: []
        side_effects:
          - "open_deal_count recomputed"

      - from: UNDER_NEGOTIATION
        to: ACTIVE
        trigger: "system: open_deal_count returns to 0 (all deals DEAD, none EXECUTED)"
        actor: system
        preconditions: []
        side_effects:
          - "open_deal_count recomputed = 0"

      - from: UNDER_NEGOTIATION
        to: EXECUTED
        trigger: "system: a child Deal reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "All sibling Deals on this Listing whose stage NOT IN {EXECUTED, DEAD} -> DEAD (cascade)"
          - "Parent Space -> LEASED (cascade)"

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /listings/{listingId}/withdraw"
        actor: ListingBroker
        preconditions:
          - "No child Deal in stage IN {LOI_ACCEPTED, LEASE_OUT} (ERR_LISTING_HAS_LIVE_DEAL)"
        side_effects:
          - "All child Deals NOT IN {EXECUTED, DEAD} -> DEAD"
          - "Recompute Requirement.match_count for affected requirements"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /listings/{listingId}/withdraw"
        actor: ListingBroker
        preconditions: []
        side_effects: []

  - entity: Requirement
    initial_state: OPEN
    terminal_states: [PLACED, CLOSED_LOST]
    transitions:
      - from: OPEN
        to: TOURING
        trigger: "system: first Tour for this Requirement reaches CONFIRMED"
        actor: system
        preconditions: []
        side_effects: []

      - from: TOURING
        to: OPEN
        trigger: "system: all Tours for this Requirement leave CONFIRMED and no Deal is open"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: NEGOTIATING
        trigger: "system: first Deal on this Requirement advances to LOI_DRAFT"
        actor: system
        preconditions: []
        side_effects: []

      - from: TOURING
        to: NEGOTIATING
        trigger: "system: first Deal on this Requirement advances to LOI_DRAFT"
        actor: system
        preconditions: []
        side_effects: []

      - from: NEGOTIATING
        to: PLACED
        trigger: "system: a Deal on this Requirement reaches EXECUTED"
        actor: system
        preconditions: []
        side_effects:
          - "All other Tours for this Requirement in REQUESTED/CONFIRMED -> CANCELLED (cascade)"

      - from: NEGOTIATING
        to: OPEN
        trigger: "system: the only open Deal goes DEAD"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: CLOSED_LOST
        trigger: "POST /requirements/{requirementId}/close"
        actor: TenantBroker
        preconditions:
          - "No Deal on this Requirement in stage IN {LOI_ACCEPTED, LEASE_OUT, EXECUTED} (ERR_REQUIREMENT_HAS_LIVE_DEAL)"
        side_effects:
          - "All Tours for this Requirement in REQUESTED/CONFIRMED -> CANCELLED (cascade)"

      - from: TOURING
        to: CLOSED_LOST
        trigger: "POST /requirements/{requirementId}/close"
        actor: TenantBroker
        preconditions:
          - "No Deal on this Requirement in stage IN {LOI_ACCEPTED, LEASE_OUT, EXECUTED}"
        side_effects:
          - "All Tours for this Requirement in REQUESTED/CONFIRMED -> CANCELLED (cascade)"

  - entity: Tour
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /tours/{tourId}/confirm"
        actor: ListingBroker
        preconditions:
          - "Space.status IN {AVAILABLE, ON_HOLD} (ERR_SPACE_NOT_AVAILABLE if LEASED/OFF_MARKET/UNDER_LOI)"
          - "Tour window does not overlap any other CONFIRMED Tour on the same Space under the 30-min buffer rule (ERR_TOUR_WINDOW_CONFLICT) — §1.3 tour_space_overlap"
          - "Tour window does not overlap any other CONFIRMED Tour run by the same tenant_broker_id under the no-buffer half-open rule (ERR_BROKER_DOUBLE_BOOKED) — §1.3 tour_broker_overlap"
        side_effects:
          - "If hold=true: set holds_space=true; Space AVAILABLE -> ON_HOLD with held_by_tour_id=this Tour; Requirement OPEN -> TOURING (bubble-up)"

      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /tours/{tourId}/complete"
        actor: TenantBroker
        preconditions:
          - "current_clock >= window_start (ERR_TOUR_NOT_STARTED)"
        side_effects:
          - "If holds_space: Space ON_HOLD -> AVAILABLE, clear held_by_tour_id, set holds_space=false"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /tours/{tourId}/cancel"
        actor: TenantBroker
        preconditions: []
        side_effects: []

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /tours/{tourId}/cancel"
        actor: TenantBroker
        preconditions: []
        side_effects:
          - "If holds_space: Space ON_HOLD -> AVAILABLE, clear held_by_tour_id, set holds_space=false; recompute Property.available_sf"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /tours/{tourId}/no-show"
        actor: ListingBroker
        preconditions:
          - "current_clock >= window_end (ERR_TOUR_NOT_ENDED)"
        side_effects:
          - "If holds_space: Space ON_HOLD -> AVAILABLE, clear held_by_tour_id, set holds_space=false"

  - entity: Deal
    initial_state: PROSPECT
    terminal_states: [EXECUTED, DEAD]
    transitions:
      - from: PROSPECT
        to: LOI_DRAFT
        trigger: "POST /deals/{dealId}/proposals (first Proposal, from_side=LISTING or TENANT)"
        actor: ListingBroker | TenantBroker
        preconditions:
          - "Authoring broker is not SUSPENDED (ERR_BROKER_SUSPENDED)"
          - "Listing.status IN {ACTIVE, UNDER_NEGOTIATION} (ERR_LISTING_NOT_NEGOTIABLE)"
          - "Requirement.status IN {OPEN, TOURING, NEGOTIATING} (ERR_REQUIREMENT_NOT_ACTIVE)"
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
          - "Authoring broker is on the matching side (LISTING proposal by listing_broker_id; TENANT proposal by procuring_broker_id) (ERR_WRONG_SIDE)"
        side_effects:
          - "New Proposal created with outcome=PENDING; round_count incremented"
          - "Listing ACTIVE -> UNDER_NEGOTIATION (bubble-up); Requirement -> NEGOTIATING (bubble-up)"
          - "increments Deal.version by 1"

      - from: LOI_DRAFT
        to: LOI_COUNTERED
        trigger: "POST /deals/{dealId}/proposals (counter from opposite side)"
        actor: ListingBroker | TenantBroker
        preconditions:
          - "from_side is opposite to the latest PENDING Proposal's from_side (ERR_WRONG_SIDE)"
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "Latest PENDING Proposal -> COUNTERED; new Proposal created PENDING; round_count incremented"
          - "increments Deal.version by 1"

      - from: LOI_COUNTERED
        to: LOI_COUNTERED
        trigger: "POST /deals/{dealId}/proposals (next counter from opposite side — negotiation loop)"
        actor: ListingBroker | TenantBroker
        preconditions:
          - "from_side is opposite to the latest PENDING Proposal's from_side (ERR_WRONG_SIDE)"
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "Latest PENDING Proposal -> COUNTERED; new Proposal created PENDING; round_count incremented"
          - "increments Deal.version by 1"

      - from: LOI_DRAFT
        to: LOI_ACCEPTED
        trigger: "POST /deals/{dealId}/accept"
        actor: ListingBroker | TenantBroker
        preconditions:
          - "Acceptor is the side that did NOT author the latest PENDING Proposal (ERR_WRONG_SIDE)"
          - "Space.status IN {AVAILABLE, ON_HOLD} (ERR_SPACE_NOT_AVAILABLE)"
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "Latest PENDING Proposal -> ACCEPTED; accepted_proposal_id set; total_consideration, total_commission computed"
          - "Space -> UNDER_LOI (cross-entity cascade); if holding Tour exists, Tour -> COMPLETED"
          - "increments Deal.version by 1"

      - from: LOI_COUNTERED
        to: LOI_ACCEPTED
        trigger: "POST /deals/{dealId}/accept"
        actor: ListingBroker | TenantBroker
        preconditions:
          - "Acceptor is the side that did NOT author the latest PENDING Proposal (ERR_WRONG_SIDE)"
          - "Space.status IN {AVAILABLE, ON_HOLD} (ERR_SPACE_NOT_AVAILABLE)"
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "Latest PENDING Proposal -> ACCEPTED; accepted_proposal_id set; total_consideration, total_commission computed"
          - "Space -> UNDER_LOI (cross-entity cascade); if holding Tour exists, Tour -> COMPLETED"
          - "increments Deal.version by 1"

      - from: LOI_ACCEPTED
        to: LEASE_OUT
        trigger: "POST /deals/{dealId}/lease-out"
        actor: ListingBroker
        preconditions:
          - "Space.status == UNDER_LOI"
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "increments Deal.version by 1"

      - from: LEASE_OUT
        to: EXECUTED
        trigger: "POST /deals/{dealId}/execute"
        actor: ListingBroker
        preconditions:
          - "Space.status == UNDER_LOI"
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "CommissionSplit rows created (LISTING + PROCURING) summing to total_commission (conserved-quantity invariant)"
          - "Space UNDER_LOI -> LEASED (cascade); Listing UNDER_NEGOTIATION -> EXECUTED (cascade); sibling Deals NOT IN {EXECUTED,DEAD} -> DEAD (cascade)"
          - "Requirement NEGOTIATING -> PLACED (cascade); other Tours of that Requirement -> CANCELLED (cascade)"
          - "Comp append-only row created stamping effective_rent_psf_yr, market, term_months, executed_at"
          - "increments Deal.version by 1"

      - from: LOI_DRAFT
        to: DEAD
        trigger: "POST /deals/{dealId}/kill"
        actor: ListingBroker | TenantBroker
        preconditions:
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "All Proposals PENDING -> REJECTED"
          - "Listing UNDER_NEGOTIATION -> ACTIVE if open_deal_count returns to 0 (bubble-up); Requirement NEGOTIATING -> OPEN if its only open Deal (bubble-up)"
          - "increments Deal.version by 1"

      - from: LOI_COUNTERED
        to: DEAD
        trigger: "POST /deals/{dealId}/kill"
        actor: ListingBroker | TenantBroker
        preconditions:
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "All Proposals PENDING -> REJECTED"
          - "Listing -> ACTIVE (bubble-up if open_deal_count=0); Requirement -> OPEN (bubble-up)"
          - "increments Deal.version by 1"

      - from: LOI_ACCEPTED
        to: DEAD
        trigger: "POST /deals/{dealId}/kill"
        actor: ListingBroker | TenantBroker
        preconditions:
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "Accepted Proposal -> REJECTED; accepted_proposal_id cleared; total_consideration=0; total_commission=0"
          - "Space UNDER_LOI -> AVAILABLE (compensation cascade); Property.available_sf recomputed"
          - "Listing -> ACTIVE (bubble-up if open_deal_count=0); Requirement -> OPEN (bubble-up)"
          - "increments Deal.version by 1"

      - from: PROSPECT
        to: DEAD
        trigger: "POST /deals/{dealId}/kill"
        actor: ListingBroker | TenantBroker
        preconditions:
          - "expected_deal_version matches Deal.version (ERR_STALE_DEAL_VERSION)"
        side_effects:
          - "increments Deal.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on Deal.version
# =============================================================================
concurrency_rules:
  - rule_id: proposal-create-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /deals/{dealId}/proposals"
    occ_field: "expected_deal_version"
    description: |
      Submitting a Proposal against a Deal whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already authored a Proposal (which legitimately supersedes the
      prior open round and flips the latest PENDING Proposal to COUNTERED), so
      the current writer's view of the deal — including which side now owes the
      next move — is stale.
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412

  - rule_id: deal-accept-stale-deal
    parent_entity: Deal
    write_endpoint: "POST /deals/{dealId}/accept"
    occ_field: "expected_deal_version"
    description: |
      Accepting a Deal whose version has advanced since the client last observed
      it is rejected. This captures the case where the counterparty has just
      countered (a new PENDING Proposal supersedes the one the acceptor intended
      to accept), so accepting against the stale version would bind the wrong
      terms.
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: net_effective_rent
    trigger: "computed on every Proposal create; stored on Proposal.net_effective_rent_psf_yr"
    algorithm: forward_looking
    formula: |
      # Net effective rent PSF/yr amortizes free rent and TI allowance across the
      # term, against escalated gross rent. Order is PINNED: escalate first, sum the
      # gross stream, subtract free-rent months at the YEAR-1 base rate, subtract
      # TI, then divide by (term_years), then round.
      n_years = ceil(term_months / 12)                         # whole lease-years touched
      gross_total_psf = 0.0
      for y in 0 .. (n_years - 1):
        year_rate = base_rent_psf_yr * ((1 + annual_escalation_pct) ** y)
        # last partial year is pro-rated by its month fraction
        months_in_year = min(12, term_months - 12*y)
        gross_total_psf += year_rate * (months_in_year / 12.0)
      free_rent_credit_psf = base_rent_psf_yr * (free_rent_months / 12.0)   # credited at YEAR-1 rate (PINNED)
      net_total_psf = gross_total_psf - free_rent_credit_psf - ti_allowance_psf
      term_years = term_months / 12.0
      net_effective_rent_psf_yr = round(net_total_psf / term_years, 2)      # round ONCE at the end (PINNED, round_half_up)
    input_set: "single Proposal's own fields"
    constants:
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up, single final rounding"
    variants:
      - name: gross_effective_rent
        when: "reported alongside net for comparison; NOT stored, derivable"
        difference: "gross omits the free_rent_credit and ti_allowance subtraction: gross_effective = round(gross_total_psf / term_years, 2). Same inputs, different number — the spread between gross and net is the concession value."

  - name: lease_consideration
    trigger: "computed on Deal accept (LOI_DRAFT/LOI_COUNTERED -> LOI_ACCEPTED); stored on Deal.total_consideration"
    algorithm: aggregation
    formula: |
      # Total base-rent dollars over the term from the ACCEPTED proposal, using the
      # escalated gross stream (free rent and TI are NOT netted out of consideration —
      # consideration is the gross rent the tenant contracts to pay).
      p = accepted Proposal
      rsf = parent Space.rentable_sf
      n_years = ceil(p.term_months / 12)
      total = 0.0
      for y in 0 .. (n_years - 1):
        year_rate = p.base_rent_psf_yr * ((1 + p.annual_escalation_pct) ** y)
        months_in_year = min(12, p.term_months - 12*y)
        total += year_rate * rsf * (months_in_year / 12.0)
      total_consideration = round(total, 2)        # sum-then-round (PINNED)
    input_set: "the single ACCEPTED Proposal and its Deal's Space.rentable_sf"
    constants:
      ROUNDING: round_half_up
    precision: "2 decimal places, round_half_up, sum-then-round (round once after summing all years)"

  - name: effective_commission_pct
    trigger: "computed on Deal accept; folded into Deal.total_commission"
    algorithm: threshold
    formula: |
      # The total commission rate applied to consideration. Uses the LISTING broker's
      # Brokerage.default_commission_pct UNLESS the deal is co-broke and the listing's
      # term is long, in which case a discounted tier applies.
      base_pct = listing_broker's Brokerage.default_commission_pct
      if accepted Proposal.term_months >= LONG_TERM_MONTHS:
        eff = base_pct - LONG_TERM_DISCOUNT       # large-deal discount tier
      else:
        eff = base_pct
      effective_commission_pct = max(eff, MIN_COMMISSION_PCT)   # floor (PINNED)
      Deal.total_commission = round(Deal.total_consideration * effective_commission_pct, 2)
    input_set: "the Deal's listing broker's Brokerage and the accepted Proposal.term_months"
    constants:
      LONG_TERM_MONTHS: 120      # >= 120 months (10 yr) qualifies for the discount tier
      LONG_TERM_DISCOUNT: 0.01   # 1 percentage-point reduction
      MIN_COMMISSION_PCT: 0.03   # commission rate never floored below 3%
    precision: "rate kept at full precision; dollar product rounded to 2 dp, round_half_up"

  - name: commission_split
    trigger: "computed on Deal execute (LEASE_OUT -> EXECUTED); produces CommissionSplit rows"
    algorithm: waterfall_allocation
    formula: |
      # Split Deal.total_commission between LISTING and PROCURING sides.
      total = Deal.total_commission
      if Deal.is_co_broke:
        procuring_amount = round(total * Listing.co_broke_offered_pct, 2)
        listing_amount   = round(total - procuring_amount, 2)   # remainder, NOT independently rounded (PINNED — conserves total)
      else:
        # in-house deal: the same broker is both sides; full commission to listing side,
        # zero PROCURING row is still written for ledger completeness.
        procuring_amount = 0.00
        listing_amount   = round(total, 2)
      # INVARIANT (conserved quantity): listing_amount + procuring_amount == Deal.total_commission exactly.
    input_set: "the single Deal, its Listing.co_broke_offered_pct, and is_co_broke flag"
    constants:
      ROUNDING: round_half_up
    precision: "procuring rounded to 2 dp; listing is total minus procuring (residual) so the pair conserves total exactly"
    variants:
      - name: co_broke_split
        when: "Deal.is_co_broke == true (listing and procuring brokers in different brokerages)"
        difference: "procuring side receives co_broke_offered_pct of total; listing receives the residual."
      - name: in_house_split
        when: "Deal.is_co_broke == false (same brokerage on both sides)"
        difference: "listing side receives the entire commission; procuring row is 0.00."

  - name: requirement_match_predicate
    trigger: "recomputed on Requirement create/update, Space publish/withdraw, Listing activate/withdraw; stored on Requirement.match_count"
    algorithm: aggregation
    formula: |
      # A Listing L matches Requirement R iff ALL hold:
      #   L.status IN {ACTIVE, UNDER_NEGOTIATION}
      #   Property(L.Space).market == R.market
      #   Property(L.Space).asset_class == R.asset_class
      #   R.min_sf <= Space(L).rentable_sf <= R.max_sf            (inclusive both ends — PINNED >=, <=)
      #   Space(L).asking_rent_psf_yr <= R.max_rent_psf_yr        (inclusive — PINNED <=)
      # match_count = count of matching Listings.
      match_count = COUNT(L : all predicate clauses true)
    input_set: "all Listings whose status IN {ACTIVE, UNDER_NEGOTIATION}, joined to their Space and Property"
    constants: {}
    precision: "integer count; boundaries inclusive (>= min_sf, <= max_sf, <= max_rent_psf_yr)"

  - name: tour_space_overlap
    trigger: "evaluated on Tour confirm (REQUESTED -> CONFIRMED) against the same Space"
    algorithm: interval_merge
    formula: |
      # SPACE interval semantics: BUFFERED. Two CONFIRMED tour windows on the SAME Space
      # conflict when, after expanding each existing CONFIRMED window by
      # TURNOVER_BUFFER_MINUTES on BOTH ends, the half-open candidate window
      # [window_start, window_end) intersects the expanded existing window. Touching
      # exactly at a buffered boundary does NOT conflict (strict inequality):
      #   reject iff candidate.window_start <  T.window_end + BUFFER
      #          AND candidate.window_end   >  T.window_start - BUFFER
      conflict = EXISTS existing CONFIRMED Tour T on same Space (T != candidate) such that
                 candidate.window_start < T.window_end + BUFFER
                 AND candidate.window_end > T.window_start - BUFFER
    input_set: "all Tours on the same Space (space_id) with status == CONFIRMED"
    constants:
      TURNOVER_BUFFER_MINUTES: 30
    precision: "minute-resolution datetime arithmetic; strict inequality at buffered boundary (touching the buffered edge allowed)"

  - name: tour_broker_overlap
    trigger: "evaluated on Tour confirm (REQUESTED -> CONFIRMED) against the same tenant broker"
    algorithm: interval_merge
    formula: |
      # BROKER interval semantics: PURE HALF-OPEN, NO BUFFER. Two CONFIRMED tours run by
      # the SAME tenant_broker_id conflict iff their half-open [start, end) intervals
      # overlap with zero buffer. Back-to-back tours (candidate.start == T.end) do NOT
      # conflict (half-open):
      #   reject iff candidate.window_start < T.window_end
      #          AND candidate.window_end   > T.window_start
      conflict = EXISTS existing CONFIRMED Tour T with T.tenant_broker_id == candidate.tenant_broker_id
                 (T != candidate) such that
                 candidate.window_start < T.window_end
                 AND candidate.window_end > T.window_start
    input_set: "all Tours run by the same tenant_broker_id with status == CONFIRMED (across any Space)"
    constants: {}
    precision: "minute-resolution datetime arithmetic; pure half-open, zero buffer (back-to-back allowed)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-referenced resource exists (validated left-to-right); every FK in body resolves"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting broker owns / is a party to the resource (ListingBroker owns Listing/Space; TenantBroker owns Requirement/Tour; Deal mutation by a party broker of that Deal)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "all mutating endpoints with ownership semantics"

  - priority: 5
    category: business_constraint
    check: "Request body conforms to field constraints (enum membership, numeric ranges, min_sf<=max_sf, window_start<window_end, suite uniqueness)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"

  - priority: 6
    category: state
    check: "Optimistic concurrency: expected_deal_version equals current Deal.version on Deal-guarded writes"
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412
    applies_to: "POST /deals/{id}/proposals, /accept, /lease-out, /execute, /kill"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_referential
    check: "Proposal/accept author is on the correct negotiation side (alternation + acceptor-is-counterparty)"
    error_id: ERR_WRONG_SIDE
    http_status: 409
    applies_to: "POST /deals/{id}/proposals, POST /deals/{id}/accept"

  - priority: 9
    category: business_referential
    check: "Listing is negotiable (status IN {ACTIVE, UNDER_NEGOTIATION}) when the FIRST proposal is authored; deal-open only requires a non-terminal Listing (status NOT IN {WITHDRAWN, EXECUTED})"
    error_id: ERR_LISTING_NOT_NEGOTIABLE
    http_status: 409
    applies_to: "POST /deals/{id}/proposals (negotiability); POST /deals (non-terminal only)"

  - priority: 10
    category: business_referential
    check: "Requirement is in an active status {OPEN, TOURING, NEGOTIATING} to attach a deal/tour"
    error_id: ERR_REQUIREMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /deals, POST /tours"

  - priority: 11
    category: business_safety
    check: "Space is in a publishable/showable status for the operation (publish/activate/confirm/accept require AVAILABLE or ON_HOLD as specified)"
    error_id: ERR_SPACE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /listings/{id}/activate, POST /tours/{id}/confirm, POST /deals/{id}/accept"

  - priority: 12
    category: business_temporal
    check: "Tour window does not overlap an existing CONFIRMED Tour on the same Space under the 30-min buffer rule (§1.3 tour_space_overlap)"
    error_id: ERR_TOUR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /tours/{id}/confirm"

  - priority: 12.5
    category: business_temporal
    check: "Tour window does not overlap an existing CONFIRMED Tour run by the same tenant_broker_id under the no-buffer half-open rule (§1.3 tour_broker_overlap)"
    error_id: ERR_BROKER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /tours/{id}/confirm"

  - priority: 13
    category: business_temporal
    check: "Tour clock gates: complete requires current_clock >= window_start; no-show requires current_clock >= window_end"
    error_id: ERR_TOUR_NOT_STARTED
    http_status: 409
    applies_to: "POST /tours/{id}/complete, POST /tours/{id}/no-show"

  - priority: 14
    category: business_constraint
    check: "Listing cannot be withdrawn while a live deal exists (stage IN {LOI_ACCEPTED, LEASE_OUT})"
    error_id: ERR_LISTING_HAS_LIVE_DEAL
    http_status: 409
    applies_to: "POST /listings/{id}/withdraw"

  - priority: 15
    category: business_constraint
    check: "Requirement cannot be closed while a live deal exists (stage IN {LOI_ACCEPTED, LEASE_OUT, EXECUTED})"
    error_id: ERR_REQUIREMENT_HAS_LIVE_DEAL
    http_status: 409
    applies_to: "POST /requirements/{id}/close"

  - priority: 16
    category: business_safety
    check: "Acting broker is not SUSPENDED when opening a deal or authoring a proposal"
    error_id: ERR_BROKER_SUSPENDED
    http_status: 409
    applies_to: "POST /deals, POST /deals/{id}/proposals"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Brokerage ---
  - method: POST
    path: "/brokerages"
    description: "Create a brokerage firm"
    roles: [BrokerageAdmin]
    code: 201
    input: [name, side, "default_commission_pct?"]
    output: Brokerage
    side_effects: []

  - method: GET
    path: "/brokerages/{brokerageId}"
    description: "Get a brokerage"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Brokerage
    side_effects: []

  # --- Broker ---
  - method: POST
    path: "/brokers"
    description: "Register a broker under a brokerage"
    roles: [BrokerageAdmin]
    code: 201
    input: [brokerage_id, full_name, license_no, role]
    output: Broker
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/brokers/{brokerId}"
    description: "Get a broker"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Broker
    side_effects: []

  - method: GET
    path: "/brokers"
    description: "List brokers; filter by brokerage_id"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["brokerage_id?", "limit?", "offset?"]
    output: Broker[]
    side_effects: []

  - method: POST
    path: "/brokers/{brokerId}/suspend"
    description: "Suspend a broker (ACTIVE -> SUSPENDED)"
    roles: [BrokerageAdmin]
    code: 200
    input: []
    output: Broker
    side_effects: ["status=SUSPENDED"]

  # --- Property ---
  - method: POST
    path: "/properties"
    description: "Create a property"
    roles: [ListingBroker]
    code: 201
    input: [listing_broker_id, name, market, asset_class, total_sf]
    output: Property
    side_effects: ["available_sf=0"]

  - method: GET
    path: "/properties/{propertyId}"
    description: "Get a property (includes computed available_sf)"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties/{propertyId}/spaces"
    description: "List spaces under a property (FK reverse-reachability for Space.property_id)"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["limit?", "offset?"]
    output: Space[]
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties; filter by listing_broker_id (FK reverse-reachability for Property.listing_broker_id)"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["listing_broker_id?", "market?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  # --- Space ---
  - method: POST
    path: "/spaces"
    description: "Create a space (suite) within a property"
    roles: [ListingBroker]
    code: 201
    input: [property_id, suite_no, rentable_sf, asking_rent_psf_yr, "free_rent_months?", "ti_allowance_psf?"]
    output: Space
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/spaces/{spaceId}"
    description: "Get a space"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Space
    side_effects: []

  - method: GET
    path: "/spaces"
    description: "List/search spaces; filter by property_id, status, or held_by_tour_id"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["property_id?", "status?", "held_by_tour_id?", "limit?", "offset?"]
    output: Space[]
    side_effects: []

  - method: POST
    path: "/spaces/{spaceId}/publish"
    description: "Publish a space to market (DRAFT/OFF_MARKET -> AVAILABLE)"
    roles: [ListingBroker]
    code: 200
    input: []
    output: Space
    side_effects: ["status=AVAILABLE", "recompute Property.available_sf"]

  - method: POST
    path: "/spaces/{spaceId}/withdraw"
    description: "Withdraw a space from market (AVAILABLE -> OFF_MARKET)"
    roles: [ListingBroker]
    code: 200
    input: []
    output: Space
    side_effects: ["status=OFF_MARKET", "child Listings DRAFT/ACTIVE -> WITHDRAWN", "recompute Property.available_sf"]

  # --- Listing ---
  - method: POST
    path: "/listings"
    description: "Create a listing for an AVAILABLE space"
    roles: [ListingBroker]
    code: 201
    input: [space_id, listing_broker_id, term_months, "annual_escalation_pct?", "co_broke_offered_pct?"]
    output: Listing
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/listings/{listingId}"
    description: "Get a listing (includes computed open_deal_count)"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Listing
    side_effects: []

  - method: GET
    path: "/listings"
    description: "List/search listings; filter by space_id, listing_broker_id, status"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["space_id?", "listing_broker_id?", "status?", "limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/listings/{listingId}/activate"
    description: "Activate a listing (DRAFT -> ACTIVE)"
    roles: [ListingBroker]
    code: 200
    input: []
    output: Listing
    side_effects: ["status=ACTIVE", "recompute matching Requirement.match_count"]

  - method: POST
    path: "/listings/{listingId}/withdraw"
    description: "Withdraw a listing (DRAFT/ACTIVE -> WITHDRAWN)"
    roles: [ListingBroker]
    code: 200
    input: []
    output: Listing
    side_effects: ["status=WITHDRAWN", "open Deals -> DEAD", "recompute Requirement.match_count"]

  # --- Requirement ---
  - method: POST
    path: "/requirements"
    description: "Create a tenant requirement"
    roles: [TenantBroker]
    code: 201
    input: [tenant_broker_id, tenant_name, market, asset_class, min_sf, max_sf, max_rent_psf_yr]
    output: Requirement
    side_effects: ["status=OPEN", "compute match_count"]

  - method: GET
    path: "/requirements/{requirementId}"
    description: "Get a requirement (includes computed match_count)"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Requirement
    side_effects: []

  - method: GET
    path: "/requirements"
    description: "List requirements; filter by tenant_broker_id, status"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["tenant_broker_id?", "status?", "limit?", "offset?"]
    output: Requirement[]
    side_effects: []

  - method: GET
    path: "/requirements/{requirementId}/matches"
    description: "List Listings currently matching this requirement per §1.3 predicate"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["limit?", "offset?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/requirements/{requirementId}/close"
    description: "Close a requirement lost (OPEN/TOURING -> CLOSED_LOST)"
    roles: [TenantBroker]
    code: 200
    input: []
    output: Requirement
    side_effects: ["status=CLOSED_LOST", "open Tours -> CANCELLED"]

  # --- Tour ---
  - method: POST
    path: "/tours"
    description: "Request a tour of a space for a requirement"
    roles: [TenantBroker]
    code: 201
    input: [requirement_id, tenant_broker_id, space_id, window_start, window_end]
    output: Tour
    side_effects: ["status=REQUESTED", "holds_space=false"]

  - method: GET
    path: "/tours/{tourId}"
    description: "Get a tour"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Tour
    side_effects: []

  - method: GET
    path: "/tours"
    description: "List tours; filter by requirement_id, space_id, tenant_broker_id, status"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["requirement_id?", "space_id?", "tenant_broker_id?", "status?", "limit?", "offset?"]
    output: Tour[]
    side_effects: []

  - method: POST
    path: "/tours/{tourId}/confirm"
    description: "Confirm a tour (REQUESTED -> CONFIRMED); optionally hold the space"
    roles: [ListingBroker]
    code: 200
    input: ["hold?"]
    output: Tour
    side_effects: ["status=CONFIRMED", "if hold: Space AVAILABLE->ON_HOLD, Requirement OPEN->TOURING", "space overlap check (buffered)", "broker overlap check (no buffer)"]

  - method: POST
    path: "/tours/{tourId}/complete"
    description: "Complete a confirmed tour (CONFIRMED -> COMPLETED)"
    roles: [TenantBroker]
    code: 200
    input: []
    output: Tour
    side_effects: ["status=COMPLETED", "release space hold if held"]

  - method: POST
    path: "/tours/{tourId}/cancel"
    description: "Cancel a tour (REQUESTED/CONFIRMED -> CANCELLED)"
    roles: [TenantBroker]
    code: 200
    input: []
    output: Tour
    side_effects: ["status=CANCELLED", "release space hold if held"]

  - method: POST
    path: "/tours/{tourId}/no-show"
    description: "Mark a confirmed tour as a no-show (CONFIRMED -> NO_SHOW)"
    roles: [ListingBroker]
    code: 200
    input: []
    output: Tour
    side_effects: ["status=NO_SHOW", "release space hold if held"]

  # --- Deal ---
  - method: POST
    path: "/deals"
    description: "Open a deal binding a Listing to a Requirement (junction). Listing must be non-terminal (status NOT IN {WITHDRAWN, EXECUTED}); a DRAFT listing is allowed at open time (negotiability is enforced at first proposal). Requirement must be active. Acting broker must not be SUSPENDED."
    roles: [ListingBroker, TenantBroker]
    code: 201
    input: [listing_id, requirement_id]
    output: Deal
    side_effects: ["stage=PROSPECT", "set listing_broker_id (=Listing.listing_broker_id), procuring_broker_id (=Requirement.tenant_broker_id), is_co_broke (=different brokerages)"]

  - method: GET
    path: "/deals/{dealId}"
    description: "Get a deal (includes computed round_count, total_consideration, total_commission)"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Deal
    side_effects: []

  - method: GET
    path: "/deals"
    description: "List/pipeline deals; filter by listing_id, requirement_id, listing_broker_id, procuring_broker_id, accepted_proposal_id, stage"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["listing_id?", "requirement_id?", "listing_broker_id?", "procuring_broker_id?", "accepted_proposal_id?", "stage?", "limit?", "offset?"]
    output: Deal[]
    side_effects: []

  - method: POST
    path: "/deals/{dealId}/proposals"
    description: "Submit an LOI/lease proposal round (negotiation step); OCC-guarded"
    roles: [ListingBroker, TenantBroker]
    code: 201
    input: [from_side, base_rent_psf_yr, term_months, expected_deal_version, "free_rent_months?", "ti_allowance_psf?", "annual_escalation_pct?"]
    output: Proposal
    side_effects: ["new Proposal PENDING", "prior PENDING -> COUNTERED", "Deal stage advance", "increments Deal.version by 1"]

  - method: GET
    path: "/deals/{dealId}/proposals"
    description: "List proposals for a deal (negotiation history, sub-resource form)"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["limit?", "offset?"]
    output: Proposal[]
    side_effects: []

  - method: GET
    path: "/proposals/{proposalId}"
    description: "Get a single proposal"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Proposal
    side_effects: []

  - method: GET
    path: "/proposals"
    description: "List proposals; filter by deal_id (FK reverse-reachability for Proposal.deal_id)"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["deal_id?", "from_side?", "outcome?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []

  - method: POST
    path: "/deals/{dealId}/accept"
    description: "Accept the latest PENDING proposal (-> LOI_ACCEPTED); OCC-guarded"
    roles: [ListingBroker, TenantBroker]
    code: 200
    input: [from_side, expected_deal_version]
    output: Deal
    side_effects: ["accepted Proposal=ACCEPTED", "compute total_consideration/total_commission", "Space->UNDER_LOI", "increments Deal.version by 1"]

  - method: POST
    path: "/deals/{dealId}/lease-out"
    description: "Send the lease out for signature (LOI_ACCEPTED -> LEASE_OUT); OCC-guarded"
    roles: [ListingBroker]
    code: 200
    input: [expected_deal_version]
    output: Deal
    side_effects: ["stage=LEASE_OUT", "increments Deal.version by 1"]

  - method: POST
    path: "/deals/{dealId}/execute"
    description: "Execute the lease (LEASE_OUT -> EXECUTED); OCC-guarded; commission split + comp + cascades"
    roles: [ListingBroker]
    code: 200
    input: [expected_deal_version]
    output: Deal
    side_effects: ["stage=EXECUTED", "CommissionSplit rows created", "Space->LEASED", "Listing->EXECUTED", "sibling Deals->DEAD", "Requirement->PLACED", "Comp created", "increments Deal.version by 1"]

  - method: POST
    path: "/deals/{dealId}/kill"
    description: "Kill a deal (-> DEAD); OCC-guarded; compensating cascade if past LOI_ACCEPTED"
    roles: [ListingBroker, TenantBroker]
    code: 200
    input: [expected_deal_version]
    output: Deal
    side_effects: ["stage=DEAD", "Proposals PENDING->REJECTED", "compensation cascade if was LOI_ACCEPTED", "increments Deal.version by 1"]

  # --- CommissionSplit (read-only ledger) ---
  - method: GET
    path: "/commission-splits/{splitId}"
    description: "Get a single commission split row"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: CommissionSplit
    side_effects: []

  - method: GET
    path: "/commission-splits"
    description: "List commission splits; filter by deal_id (FK reverse-reachability) or broker_id (FK reverse-reachability)"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["deal_id?", "broker_id?", "limit?", "offset?"]
    output: CommissionSplit[]
    side_effects: []

  # --- Comp (read-only market record) ---
  - method: GET
    path: "/comps/{compId}"
    description: "Get a single market comp"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: []
    output: Comp
    side_effects: []

  - method: GET
    path: "/comps"
    description: "List market comps; filter by space_id (FK reverse-reachability), deal_id (FK reverse-reachability), market"
    roles: [BrokerageAdmin, ListingBroker, TenantBroker]
    code: 200
    input: ["space_id?", "deal_id?", "market?", "limit?", "offset?"]
    output: Comp[]
    side_effects: []

  # --- Test-driving clock control (outside public business surface) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock for temporal tests (tour gates)"
    roles: [BrokerageAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for this endpoint per §1.7"
  - id: ERR_NOT_OWNER
    http: 403
    condition: "Acting broker is not the owner/party of the targeted resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource or referenced FK does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Body fails field constraints (enum, range, min_sf<=max_sf, window ordering, suite uniqueness, license uniqueness)"
  - id: ERR_STALE_DEAL_VERSION
    http: 412
    condition: "expected_deal_version does not match current Deal.version on a Deal-guarded write"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_WRONG_SIDE
    http: 409
    condition: "Proposal authored by wrong side, or acceptor is the side that authored the latest PENDING proposal"
  - id: ERR_LISTING_NOT_NEGOTIABLE
    http: 409
    condition: "Listing status not in {ACTIVE, UNDER_NEGOTIATION} when a proposal is attempted"
  - id: ERR_REQUIREMENT_NOT_ACTIVE
    http: 409
    condition: "Requirement status not in {OPEN, TOURING, NEGOTIATING} when a deal/tour is attached"
  - id: ERR_SPACE_NOT_AVAILABLE
    http: 409
    condition: "Space not in the required status for publish/activate/confirm/accept"
  - id: ERR_TOUR_WINDOW_CONFLICT
    http: 409
    condition: "Tour window overlaps an existing CONFIRMED tour on the same space under the 30-min buffer rule"
  - id: ERR_BROKER_DOUBLE_BOOKED
    http: 409
    condition: "Tour window overlaps another CONFIRMED tour run by the same tenant broker under the no-buffer half-open rule"
  - id: ERR_TOUR_NOT_STARTED
    http: 409
    condition: "Tour complete attempted before current_clock >= window_start"
  - id: ERR_TOUR_NOT_ENDED
    http: 409
    condition: "Tour no-show attempted before current_clock >= window_end"
  - id: ERR_LISTING_HAS_LIVE_DEAL
    http: 409
    condition: "Withdraw/close blocked because a deal is in stage {LOI_ACCEPTED, LEASE_OUT}"
  - id: ERR_REQUIREMENT_HAS_LIVE_DEAL
    http: 409
    condition: "Requirement close blocked because a deal is in stage {LOI_ACCEPTED, LEASE_OUT, EXECUTED}"
  - id: ERR_BROKER_SUSPENDED
    http: 409
    condition: "Acting broker is SUSPENDED and cannot open deals or author proposals"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed request body (non-JSON, wrong types) prior to field validation"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BrokerageAdmin
    description: "Operational administrator: manages brokerages and brokers, controls the test clock. Not a party to deals."
    identity: "opaque"
    exclusive_operations:
      - "POST /brokerages — create brokerage"
      - "POST /brokers — register broker"
      - "POST /brokers/{id}/suspend — suspend broker"
      - "POST /_clock/set_current_utc — set test clock"
    shared_operations:
      - "All GET read/list/search endpoints"

  - name: ListingBroker
    description: "Represents the landlord/listing side. Owns Properties, Spaces, Listings; the listing party on a Deal. Identified by Broker.id with role LISTING_BROKER."
    identity: "entity_backed:Broker"
    exclusive_operations:
      - "POST /properties — create property"
      - "POST /spaces — create space"
      - "POST /spaces/{id}/publish — publish space"
      - "POST /spaces/{id}/withdraw — withdraw space"
      - "POST /listings — create listing"
      - "POST /listings/{id}/activate — activate listing"
      - "POST /listings/{id}/withdraw — withdraw listing"
      - "POST /tours/{id}/confirm — confirm tour (listing side controls access)"
      - "POST /tours/{id}/no-show — mark no-show"
      - "POST /deals/{id}/lease-out — send lease out"
      - "POST /deals/{id}/execute — execute lease"
    shared_operations:
      - "POST /deals — open deal (either party)"
      - "POST /deals/{id}/proposals — author LISTING-side proposal"
      - "POST /deals/{id}/accept — accept latest proposal (when counterparty)"
      - "POST /deals/{id}/kill — kill deal (either party)"
      - "All GET read/list/search endpoints"

  - name: TenantBroker
    description: "Represents the tenant/procuring side. Owns Requirements and Tours; the procuring party on a Deal. Identified by Broker.id with role TENANT_BROKER."
    identity: "entity_backed:Broker"
    exclusive_operations:
      - "POST /requirements — create requirement"
      - "POST /requirements/{id}/close — close requirement"
      - "POST /tours — request tour"
      - "POST /tours/{id}/complete — complete tour"
      - "POST /tours/{id}/cancel — cancel tour"
    shared_operations:
      - "POST /deals — open deal (either party)"
      - "POST /deals/{id}/proposals — author TENANT-side proposal"
      - "POST /deals/{id}/accept — accept latest proposal (when counterparty)"
      - "POST /deals/{id}/kill — kill deal (either party)"
      - "All GET read/list/search endpoints"
