              as: PortfolioManager
            - call: "GET /lease-admin/rent-schedule-lines/${line_future}"
              payload: {}
              as: PortfolioManager
              captures: { line_eff_after: $.data.effective_rent_cents, line_base_after: $.data.base_rent_cents }
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: PortfolioManager
              captures: { rent_post: $.data.cached_annual_rent_cents }
          assert:
            - "rent_pre == 600000 + 660000   # past line 600000 + future line with 10% esc = 1260000"
            - "rent_pre == 1260000"
            - "line_base_after == 2400000      # cascaded from amendment"
            - "line_eff_after == 2640000       # recomputed: round_half_up(2400000 * 11000/10000)"
            - "rent_post == 600000 + 2640000   # past line unchanged + future recomputed"
            - "rent_post == 3240000"

      - name: termination_cascade_to_billing_and_dates
        grounds:
          - state_machines.Lease.ACTIVE_to_TERMINATED
