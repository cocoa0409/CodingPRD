            - call: "POST /registry/patients/${p_id}/conditioning"
              payload: { action: "INFUSE", expected_patient_version: "${p_v3}" }
              as: MedicalDirector
              as_user_id: "md-1"
              is_negative_trigger: true
              captures: { err_viability: "$.data.error_id" }
            - call: "GET /registry/shipments/${sh_id}"
              payload: {}
              as: CollectionCenterOps
              as_user_id: "${center_id}"
              captures: { sh_status_final: "$.data.status", sh_must_final: "$.data.must_infuse_by" }
            - call: "GET /registry/patients/${p_id}"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_cond_final: "$.data.conditioning_status", p_v_final: "$.data.version" }
          assert:
            - "the collection is recorded with dose_adequacy \"ADEQUATE\" (3.10 >= MIN_CD34_E6_PER_KG 2.00) and must_infuse_by \"2026-08-14T12:00:00Z\" = collected_at 2026-08-11T12:00:00Z + VIABILITY_HOURS[PBSC] 72 h"
            - "INFUSE while the shipment is only \"IN_TRANSIT\" returns 422 with error_id \"ERR_PRODUCT_NOT_DELIVERED\" (priority 28)"
            - "the DELIVERED event at 2026-08-11T20:00:00Z is accepted and the shipment becomes \"DELIVERED\" - it is NOT discarded, because 2026-08-11T20:00:00Z is before must_infuse_by"
            - "at clock 2026-08-14T12:00:01Z - exactly one second past must_infuse_by - INFUSE returns 422 with error_id \"ERR_PRODUCT_VIABILITY_EXPIRED\": priority 28 passes (a DELIVERED shipment exists) and priority 39 passes (the dose is ADEQUATE), so priority 47 is the first rule that fires"
            - "the expiry is a refusal, not a mutation: the shipment stays \"DELIVERED\" with must_infuse_by unchanged, and the patient stays in conditioning_status \"STARTED\" at the same version"
            - "had the clock stopped at exactly 2026-08-14T12:00:00Z the infusion would have succeeded - the comparison is now > must_infuse_by, strictly"

  # ---------------------------------------------------------------------------
  # §1.7 RBAC Matrix — five roles, role_model segregation_of_duties, two opaque
  # identities (TransplantCoordinator, MedicalDirector, RegistryOperations) and
  # two entity_backed identities (DonorRegistryLiaison -> Registry,
  # CollectionCenterOps -> CollectionCenter).
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:

      - name: exclusive_operations_refuse_every_other_role_and_unknown_headers
        claim_type: Cannot perform other roles' exclusive_operations
        grounds:
          - roles[TransplantCoordinator].exclusive_operations
          - roles[DonorRegistryLiaison].exclusive_operations
          - roles[MedicalDirector].exclusive_operations
          - roles[CollectionCenterOps].exclusive_operations
          - roles[RegistryOperations].exclusive_operations
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: |
          One sweep across all five roles' exclusive operations, each called by a role that is NOT listed
          for the endpoint, plus the degenerate case of the very same gate: priority 1 (unknown or missing
          headers) runs before priority 2 (wrong role). Four of the denials deliberately use a path id that
          does not exist, which proves the authorization gate at priority 2 fires BEFORE the existence
          checks at priority 5 - a 404 there would mean the ordering is inverted and would leak resource
          existence to unauthorized callers. Two denials are the scaffold's own notes made testable:
          RegistryOperations may not perform ANY clinical write, and MedicalDirector - though clinical -
          may not record health screening, which belongs to the donor's registry.
        test_recipe:
          setup:
            - "one domestic registry exists, so a real Registry.id is available as a DonorRegistryLiaison identity"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
          trigger:
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-9001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: MedicalDirector
              as_user_id: "md-1"
              is_negative_trigger: true
              captures: { err_md_patients: "$.data.error_id" }
            - call: "POST /registry/registries"
              payload: { code: "AUS-AU", name: "Australian Bone Marrow Donor Registry", country_code: "AU", currency_code: "AUD", fx_rate_to_usd: 1.5200, is_domestic: false, cooperation_tier: 2, ct_response_deadline_hours: 120 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              is_negative_trigger: true
              captures: { err_tc_registries: "$.data.error_id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-9001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: CollectionCenterOps
              as_user_id: "cc-unknown"
              is_negative_trigger: true
              captures: { err_cco_donors: "$.data.error_id" }
            - call: "POST /registry/clearance-items/00000000-0000-4000-8000-000000000001/result"
              payload: { result: "PASS" }
              as: RegistryOperations
              as_user_id: "ops-1"
              is_negative_trigger: true
              captures: { err_ops_clearance: "$.data.error_id" }
            - call: "POST /registry/workup-cases/00000000-0000-4000-8000-000000000002/collection-method"
              payload: { method: "PBSC", rationale: "Operations attempting a clinical decision." }
              as: RegistryOperations
              as_user_id: "ops-1"
              is_negative_trigger: true
              captures: { err_ops_method: "$.data.error_id" }
            - call: "POST /registry/match-candidates/00000000-0000-4000-8000-000000000003/screening"
              payload: { outcome: "PASS", deferral_type: "NONE" }
              as: MedicalDirector
              as_user_id: "md-1"
              is_negative_trigger: true
              captures: { err_md_screening: "$.data.error_id" }
            - call: "POST /registry/collection-bookings"
              payload: { workup_case_id: "00000000-0000-4000-8000-000000000004", collection_center_id: "00000000-0000-4000-8000-000000000005", start_at: "2026-08-11T08:00:00Z" }
              as: MedicalDirector
              as_user_id: "md-1"
              is_negative_trigger: true
              captures: { err_md_booking: "$.data.error_id" }
            - call: "POST /registry/search-requests/00000000-0000-4000-8000-000000000006/deadline-sweep"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              is_negative_trigger: true
              captures: { err_tc_sweep: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: CollectionCenterOps
              as_user_id: "cc-unknown"
              is_negative_trigger: true
              captures: { err_cco_clock: "$.data.error_id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-9002", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: ""
              is_negative_trigger: true
              captures: { err_missing_user: "$.data.error_id" }
            - call: "GET /registry/donors"
              payload: { limit: 10, offset: 0 }
              as: TransplantCoordinator
              as_user_id: ""
              is_negative_trigger: true
              captures: { err_missing_user_read: "$.data.error_id" }
          assert:
            - "MedicalDirector calling POST /registry/patients returns 403 with error_id \"ERR_UNAUTHORIZED\" - patient registration is exclusive to TransplantCoordinator"
            - "TransplantCoordinator calling POST /registry/registries returns 403 \"ERR_UNAUTHORIZED\"; CollectionCenterOps calling POST /registry/donors returns 403 \"ERR_UNAUTHORIZED\"; MedicalDirector calling POST /registry/collection-bookings returns 403 \"ERR_UNAUTHORIZED\"; TransplantCoordinator calling the deadline sweep returns 403 \"ERR_UNAUTHORIZED\"; CollectionCenterOps calling POST /_clock/set_current_utc returns 403 \"ERR_UNAUTHORIZED\""
            - "RegistryOperations is refused BOTH clinical writes - POST /registry/clearance-items/{id}/result and POST /registry/workup-cases/{id}/collection-method - with 403 \"ERR_UNAUTHORIZED\""
            - "MedicalDirector is refused POST /registry/match-candidates/{id}/screening with 403 \"ERR_UNAUTHORIZED\": health screening is the donor registry's write, not the transplant physician's"
            - "the four denials that carry a non-existent path or body id STILL return 403 \"ERR_UNAUTHORIZED\", never a 404 - priority 2 precedes priority 5 and priority 6, so an unauthorized caller cannot probe which ids exist"
            - "an empty X-User-ID returns 401 with error_id \"ERR_UNAUTHENTICATED\" even though the role name is valid, and it does so on a read endpoint too - priority 1 applies_to all and runs before every other rule"
            - "no resource is created by any of these eleven calls: the only row in the system afterwards is the one registry from setup"

      - name: shared_operations_accept_either_declared_role_on_the_same_resource
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - roles[TransplantCoordinator].shared_operations
          - roles[MedicalDirector].shared_operations
          - roles[CollectionCenterOps].shared_operations
          - roles[RegistryOperations].shared_operations
          - roles[DonorRegistryLiaison].shared_operations
        distinguishing_aspect: |
          The four declared shared operations are exercised by BOTH of their permitted roles against the
          same resources, interleaved, so that a naive "one role owns the endpoint" implementation fails:
          the conditioning timeline is SCHEDULEd by the coordinator and STARTed by the physician; the
          courier chain has one event filed by the collection center and the next by national operations;
          the donor follow-up is filed by the registry liaison and a second by the physician; the booking
          is cancelled by the physician even though the center created it.
        test_recipe:
          setup:
            - "the canonical domestic single-donor chain up to a CONFIRMED booking on 2026-08-11T08:00:00Z with method PBSC, plus a second booking that will be cancelled by the physician"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/collection-centers"
              payload: { name: "Midwest Apheresis Center", country_code: "US", concurrent_collection_capacity: 2 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { center_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id", p_v1: "$.data.version" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
