            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv}", rate_class_id: "${rc}", payment_terms: "PREPAY", sponsorship_disclosure_text: "PAID FOR BY Empire Growth Fund", disclosure_duration_seconds: 5, agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 0, duration_seconds: 30, program_code: "EN-1" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/decision"
              payload: { decision: "ACCEPT" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
              captures: { ord_v_seen: $.data.version }
          trigger:
            - call: "POST /political-ads/orders/${ord}/payments"
              payload: { direction: "CHARGE", amount_cents: 100000, expected_order_version: "${ord_v_seen} - 1" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STALE_ORDER_VERSION"
            - "HTTP status == 412"
            - "CommercialOrder.${ord}.paid_cents == 0"
            - "CommercialOrder.${ord}.payment_status == INVOICED"
            - "CommercialOrder.${ord}.version == ${ord_v_seen}"

      - name: preempted_spot_is_excluded_from_the_derived_spot_count_and_charge
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CommercialOrder.fields.spot_count
          - calculations.order_gross_charge
          - state_machines.ScheduledSpot.SCHEDULED_to_PREEMPTED
        distinguishing_aspect: "spot_count counts only SCHEDULED and AIRED rows: preempting one of five 30-second spots drops spot_count from 5 to 4, which reselects the 0 percent volume tier and RAISES every surviving spot from 7037 to 7407 while gross_charge_cents falls from 35185 to 29628."
        test_recipe:
          setup: ["One station, one MORNING rate class at posted_rate_cents 12345 and one CLASSIFIED_ISSUE advertiser holding an ACCEPTED PREPAY order with five 30-second spots on 2026-08-20 and gross_charge_cents 35185."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WDRV-TV", licensee_name: "Derived Field Media", market_code: "DMA-145", political_file_posting_deadline_hours: 24, daily_political_seconds_cap: 300 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-AM", daypart: "MORNING", preemptible: true, preemption_priority: 3, posted_rate_cents: 12345 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Empire Growth Fund", requested_class: "ISSUE" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv: $.data.id }
            - call: "POST /political-ads/advertisers/${adv}/review"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers/${adv}/decision"
              payload: { decision: "CLASSIFY_ISSUE", reason: "Non-candidate issue advocacy" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv}", rate_class_id: "${rc}", payment_terms: "PREPAY", sponsorship_disclosure_text: "PAID FOR BY Empire Growth Fund", disclosure_duration_seconds: 5, agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 0, duration_seconds: 30, program_code: "AM-1" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { sp1: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 3600, duration_seconds: 30, program_code: "AM-2" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { sp2: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 7200, duration_seconds: 30, program_code: "AM-3" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 10800, duration_seconds: 30, program_code: "AM-4" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 14400, duration_seconds: 30, program_code: "AM-5" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv}"
            - call: "POST /political-ads/orders/${ord}/decision"
              payload: { decision: "ACCEPT" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
              captures: { gross_before: $.data.gross_charge_cents }
          trigger:
            - call: "POST /political-ads/spots/${sp1}/disposition"
              payload: { disposition: "PREEMPTED", preemption_reason: "Breaking news override" }
              as: TrafficScheduler
              as_user_id: "traffic-01"
          assert:
            - "${gross_before} == 35185"
            - "CommercialOrder.${ord}.spot_count == 4"
            - "CommercialOrder.${ord}.gross_charge_cents == 29628"
            - "ScheduledSpot.${sp1}.charged_rate_cents == 0"
            - "ScheduledSpot.${sp1}.unit_equivalent_rate_cents == 0"
            - "ScheduledSpot.${sp2}.charged_rate_cents == 7407"
            - "CommercialOrder.${ord}.payment_status == INVOICED"
            - "GET /political-ads/rebates?order_id=${ord} returns total_count == 0, because nothing had been paid yet"

      - name: cascading_side_effects_layer_is_exercised_end_to_end
        claim_type: cascading_side_effects
        grounds: ["calculations.luc_final_reprice"]
        excluded_because:
          difficulty_instance: transitive_cascade / final_determination_reprice_cascades_spot_order_rebate_file_entry
          rationale: "The four-hop reprice chain and its file-entry tail are asserted in full by the named difficulty instance."

      - name: rate_threshold_trigger_layer_is_exercised_at_the_posture_boundary
        claim_type: rate_threshold_triggers
        grounds: ["calculations.station_compliance_posture"]
        excluded_because:
          difficulty_instance: boundary_precision_check / posture_freezes_at_exactly_two_overdue_and_relaxes_to_restricted_at_one
          rationale: "Both sides of POSTURE_FROZEN_THRESHOLD and POSTURE_RESTRICTED_THRESHOLD are asserted by the named difficulty instance."

      - name: dual_variant_calculation_layer_is_exercised_on_both_subjects
        claim_type: dual_variant_calculation
        grounds: ["calculations.lowest_unit_charge", "calculations.equal_opportunity_owed_units"]
        excluded_because:
          difficulty_instance: dual_variant_calc / luc_provisional_vs_final_diverge_on_same_rate_class
          rationale: "Variant divergence on the pricing subject is asserted there, and on the equal-opportunity subject by eo_owed_units_dollar_value_diverges_from_spot_count."

  - section: consistency_model
    instances:
      - name: acceptance_cascade_is_visible_immediately_in_the_same_response_and_in_reads
        claim_type: immediate
        grounds:
          - state_machines.CommercialOrder.SUBMITTED_to_ACCEPTED
          - entities.Station.fields.pending_file_entry_count
          - entities.LucDetermination.fields.variant
        distinguishing_aspect: "The consistency model is immediate: the ACCEPT response already carries payment_status INVOICED, accepted_at and payment_due_at, and reads issued straight afterwards already show the PENDING political file entry, the PROVISIONAL determination and Station.pending_file_entry_count 1 with no sweep in between."
        test_recipe:
          setup: ["One station with a PRIMARY election, one EARLY_NEWS rate class and one CLASSIFIED_CANDIDATE advertiser holding a SUBMITTED NET_30 order with one 30-second spot on 2026-08-20."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /political-ads/stations"
              payload: { call_sign: "WIMM-TV", licensee_name: "Immediate Media LLC", market_code: "DMA-146", political_file_posting_deadline_hours: 24, daily_political_seconds_cap: 300 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { st: $.data.id }
            - call: "POST /political-ads/elections"
              payload: { station_id: "${st}", office_sought: "US Senate", election_type: "PRIMARY", election_date: "2026-09-15" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { el: $.data.id }
            - call: "POST /political-ads/rate-classes"
              payload: { station_id: "${st}", class_code: "RC-EN", daypart: "EARLY_NEWS", preemptible: true, preemption_priority: 2, posted_rate_cents: 100000 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { rc: $.data.id }
            - call: "POST /political-ads/advertisers"
              payload: { station_id: "${st}", legal_name: "Rivera For Senate", requested_class: "CANDIDATE", election_id: "${el}", candidate_name: "Dana Rivera", office_sought: "US Senate", qualification_evidence_ref: "FEC-F2-2026-0088" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
              captures: { adv: $.data.id }
            - call: "POST /political-ads/advertisers/${adv}/review"
              payload: {}
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/advertisers/${adv}/decision"
              payload: { decision: "CLASSIFY_CANDIDATE", reason: "Ballot access confirmed" }
              as: StationComplianceOfficer
              as_user_id: "officer-alpha"
            - call: "POST /political-ads/orders"
              payload: { station_id: "${st}", advertiser_id: "${adv}", rate_class_id: "${rc}", payment_terms: "NET_30", sponsorship_disclosure_text: "PAID FOR BY Rivera For Senate; AUTHORIZED BY Rivera For Senate", disclosure_duration_seconds: 5, election_id: "${el}", agency_placed: false }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { ord: $.data.id }
            - call: "POST /political-ads/orders/${ord}/spots"
              payload: { air_date: "2026-08-20", start_offset_seconds: 0, duration_seconds: 30, program_code: "EN-1" }
              as: AdvertiserAgent
              as_user_id: "${adv}"
              captures: { sp: $.data.id }
            - call: "POST /political-ads/orders/${ord}/submit"
              payload: {}
              as: AdvertiserAgent
              as_user_id: "${adv}"
          trigger:
            - call: "POST /political-ads/orders/${ord}/decision"
              payload: { decision: "ACCEPT" }
              as: StationComplianceOfficer
              as_user_id: "officer-beta"
              captures: { ps: $.data.payment_status, acc: $.data.accepted_at, due: $.data.payment_due_at }
            - call: "GET /political-ads/file-entries"
              payload: { station_id: "${st}" }
              as: PublicComplainant
              as_user_id: "public-77"
              captures: { fe: "$.data[0].id", fe_due: "$.data[0].due_at", fe_type: "$.data[0].event_type" }
            - call: "GET /political-ads/luc-determinations"
              payload: { election_id: "${el}", rate_class_id: "${rc}", variant: "PROVISIONAL" }
              as: PublicComplainant
              as_user_id: "public-77"
              captures: { det: "$.data[0].id", det_luc: "$.data[0].luc_cents", det_basis: "$.data[0].basis" }
          assert:
            - "${ps} == INVOICED"
            - "${acc} == 2026-08-05T09:00:00.000Z"
            - "${due} == 2026-09-04T09:00:00.000Z"
            - "${fe_type} == ORDER_ACCEPTED"
            - "${fe_due} == 2026-08-06T09:00:00.000Z"
            - "PoliticalFileEntry.${fe}.posting_status == PENDING"
            - "PoliticalFileEntry.${fe}.disclosure_snapshot == PAID FOR BY Rivera For Senate; AUTHORIZED BY Rivera For Senate"
            - "${det_luc} == 100000"
            - "${det_basis} == POSTED_RATE_FALLBACK"
            - "LucDetermination.${det}.variant == PROVISIONAL"
            - "ScheduledSpot.${sp}.charged_rate_cents == 100000"
            - "ScheduledSpot.${sp}.luc_capped == false"
            - "Station.${st}.pending_file_entry_count == 1"
