      - name: effective_slot_capacity_is_the_floor_bounded_minimum
        claim_type: correct_result
        grounds:
          - calculations.screening_event_effective_capacity
          - entities.ScreeningEvent.fields.effective_slot_capacity
        distinguishing_aspect: |
          effective_slot_capacity is min(slot_capacity, floor(window / length)):
          a three-hour window of 60-minute slots caps an ambitious slot_capacity
          of 10 at 3, a small slot_capacity of 2 wins over a window that would
          allow 6, and a 170-minute window floors to 2 rather than rounding to 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE screening_host_approved site hosting three non-overlapping events on three consecutive days."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
              payload: { name: "Sunrise Coop", region_code: "R-1", licensed_capacity: 40, iep_seat_capacity: 2, languages_supported: ["en"], screening_host_approved: true, status: "ACTIVE" }
              as: PlacementAdministrator
              captures: { site1_id: "$.data.id" }
          trigger:
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "Long slots", window_start_utc: "2026-08-20T09:00:00Z", window_end_utc: "2026-08-20T12:00:00Z", slot_capacity: 10, slot_length_minutes: 60 }
              as: ChildFindCoordinator
              captures: { event_a_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "Few slots", window_start_utc: "2026-08-21T09:00:00Z", window_end_utc: "2026-08-21T12:00:00Z", slot_capacity: 2, slot_length_minutes: 30 }
              as: ChildFindCoordinator
              captures: { event_b_id: "$.data.id" }
            - call: "POST /child-find/screening-events"
              payload: { site_id: "${site1_id}", event_label: "Ragged window", window_start_utc: "2026-08-22T09:00:00Z", window_end_utc: "2026-08-22T11:50:00Z", slot_capacity: 10, slot_length_minutes: 60 }
              as: ChildFindCoordinator
              captures: { event_c_id: "$.data.id" }
          assert:
            - "first response.status_code == 201"
            - "ScreeningEvent.${event_a_id}.slot_capacity == 10"
            - "ScreeningEvent.${event_a_id}.effective_slot_capacity == 3"
            - "ScreeningEvent.${event_b_id}.effective_slot_capacity == 2"
            - "ScreeningEvent.${event_c_id}.effective_slot_capacity == 2"
            - "ScreeningEvent.${event_a_id}.booked_slot_count == 0"

      - name: leap_day_birthdays_map_to_march_first_for_both_derived_dates
        claim_type: correct_result
        grounds:
          - calculations.child_kindergarten_eligibility_date
          - entities.Child.fields.third_birthday
          - entities.Child.fields.kindergarten_eligibility_date
        distinguishing_aspect: |
          A 2024-02-29 birth has no anniversary in non-leap years, so both derived
          dates use the Mar-01 mapping: third_birthday is 2027-03-01 and the fifth
          birthday 2029-03-01 falls before that year's Sep-01 cutoff, giving
          2029-09-01; a 2023-09-02 birth shows the other side of the cutoff, since
          its fifth birthday 2028-09-02 falls just after Sep-01 and rolls to
          2029-09-01 as well, while a 2023-09-01 birth lands exactly on the cutoff
          and keeps 2028-09-01.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three children are created; none is referred, so only the derived dates are exercised."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /child-find/children"
              payload: { first_name: "Leap", last_name: "Day", date_of_birth: "2024-02-29", guardian_full_name: "G Day", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_leap_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Just", last_name: "After", date_of_birth: "2023-09-02", guardian_full_name: "G After", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_after_id: "$.data.id" }
            - call: "POST /child-find/children"
              payload: { first_name: "Exactly", last_name: "OnCutoff", date_of_birth: "2023-09-01", guardian_full_name: "G Cutoff", district_of_residence: "D-01", primary_language_code: "en" }
              as: ChildFindCoordinator
              captures: { child_cutoff_id: "$.data.id" }
          assert:
            - "first response.status_code == 201"
            - "Child.${child_leap_id}.third_birthday == \"2027-03-01\""
            - "Child.${child_leap_id}.kindergarten_eligibility_date == \"2029-09-01\""
            - "Child.${child_after_id}.third_birthday == \"2026-09-02\""
            - "Child.${child_after_id}.kindergarten_eligibility_date == \"2029-09-01\""
            - "Child.${child_cutoff_id}.third_birthday == \"2026-09-01\""
            - "Child.${child_cutoff_id}.kindergarten_eligibility_date == \"2028-09-01\""

