          setup:
            - "Client CL-SJ with dr_readiness_required false and a 100000-cent postage deposit, so the escrow rule cannot interfere."
            - "ACTIVE template T-SJ: FIRST_CLASS, sheets_per_document 1, no inserts; two hygienic records in postal_code 30301 -> one FIRST_CLASS THREE_DIGIT batch of 2 pieces."
            - "All six scans are accepted and the run is COMPLETED, so the job sits in PRINTED with integrity_status PENDING and both pieces at SCAN_MATCHED — reconciliation has simply not been run yet."
            - "The batch is OPEN with piece_count 2 and tray_count 1."
