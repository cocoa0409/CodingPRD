      - name: telemetry_window_excludes_readings_older_than_7_days
        claim_type: input_set_filtering
        grounds: [calculations.inventory_depletion_projection]
        distinguishing_aspect: "A reading recorded 8 days before 'now' is outside the half-open [now-7d, now) window: rate reflects only the recent reading (consumed 5.2834 gal over 7 days = 0.7548 gal/day), not the ancient one."
        test_recipe:
          setup: ["ONLINE station; reading at 2026-08-01T00:00:00Z (10000 pulses x 2.0 ml) then reading at 2026-08-08T12:00:00Z (10000 pulses x 2.0 ml); clock 2026-08-09T00:00:00Z -> window [2026-08-02T00:00:00Z, 2026-08-09T00:00:00Z) contains only the second reading"]
