          - entities.Equipment.fields.runtime_at_last_service_hours
        distinguishing_aspect: "Conserved quantity = wear-baseline alignment (different from wallet cents): completing maintenance MUST leave runtime_at_last_service_hours == cumulative_runtime_hours and dispatch_count_since_service == 0, so the recomputed wear_score reflects only post-reset age — no residual hours/dispatch drift."
        test_recipe:
          setup:
            - "Equipment age 24 that reached MAINTENANCE_DUE (wear 105, cumulative 44, dispatch_count 1) via a completed 44h visit; start then complete maintenance."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ci2@x.com", full_name: "CI Two", service_zip: "10808" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "17 Q St", lawn_area_sqft: 3000, zip: "10808" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "SUMMER", contract_price_cents: 20000, term_months: 4 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "10808", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew Q", home_route_id: "${route_id}" }
              as: DispatchManager
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-CI2", equipment_type: "MOWER", age_months: 24, assigned_route_id: "${route_id}" }
              as: DispatchManager
              captures: { eq_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "LAWN", runtime_hours: 44 }
              as: DispatchManager
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/dispatch"
              payload: {}
              as: DispatchManager
            - call: "POST /visits/${v_id}/complete"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /equipment/${eq_id}/start-maintenance"
              payload: {}
              as: DispatchManager
          trigger:
            - call: "POST /equipment/${eq_id}/complete-maintenance"
              payload: {}
              as: DispatchManager
              captures: { estatus: $.data.status }
          assert:
            - "Equipment.${eq_id}.status == IDLE"
            - "Equipment.${eq_id}.dispatch_count_since_service == 0"
            - "Equipment.${eq_id}.runtime_at_last_service_hours == 44"
            - "Equipment.${eq_id}.wear_score == 12"
