      - name: the_draw_fans_side_effects_out_to_households_units_and_the_plan
        claim_type: side_effect_execution
        grounds:
          - state_machines.LotteryEvent.PENDING_to_DRAWN
          - state_machines.Household.APPLIED_to_SELECTED
          - state_machines.AffordableUnit.MARKETING_to_RESERVED
          - state_machines.MarketingPlan.APPROVED_to_CLOSED
        distinguishing_aspect: |
          One draw executes four distinct declared side-effect families in a single request:
          cascade-down onto the applicant households (SELECTED / WAITLISTED with rank_position
          set), cross-entity onto the project's MARKETING units (RESERVED, paired rank-for-rank
          in unit_number ASC order), bubble-up onto the parent MarketingPlan (CLOSED), and the
          event's own bookkeeping (drawn_at taken from the logical clock, round_seq unchanged
          at 0). The pairing is positional, so the lowest unit_number goes to rank 1 even though
          rank 1 applied second.
