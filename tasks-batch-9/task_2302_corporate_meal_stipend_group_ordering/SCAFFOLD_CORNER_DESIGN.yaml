  - section: consistency_model
    instances:

      - name: a_single_deliver_response_and_the_immediate_follow_up_reads_already_agree
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.admin_fee_assessment
          - calculations.imputed_income_accrual
        distinguishing_aspect: "consistency_model is immediate, so the deliver response itself already carries settlement_status CAPTURED, employer_net_cents 1787 and admin_fee_cents 89, and reads of the period, the program rollups and the lazily created imputed record issued straight afterwards agree with it without any retry, delay or second write."
        test_recipe:
          setup:
            - "Acme Corp program; Engineering rule (cap 2500, daily 1, allocation 50000); HQ Lobby; Thai Garden; Ada with a personal card; OPEN 2026-08 period; her 1000-cent order for Monday 2026-08-03 is CONFIRMED with 1787 reserved."
