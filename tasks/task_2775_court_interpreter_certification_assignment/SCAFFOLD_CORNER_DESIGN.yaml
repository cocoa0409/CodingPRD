# =============================================================================
# §1.9  SCAFFOLD CORNER DESIGN — court-interpreter-program
# -----------------------------------------------------------------------------
# Breadth probe over §1.1-§1.7 of SCAFFOLD.yaml. Sections and claim_type values
# are taken verbatim from references/claim-extraction-guide.md; corners already
# proved by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an excluded_because stub
# instead of a test_recipe.
#
# Unless a recipe sets it explicitly, the logical clock sits at its default
# 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # =========================================================================
  - section: Entities
    instances:

      - name: language_creation_returns_every_declared_field_with_defaults_applied
        claim_type: Creation
        grounds: [entities.Language, "endpoints[POST /languages]"]
        distinguishing_aspect: "A minimal POST /languages body (telephonic_vendor_available omitted) returns 201 with the declared default false and the computed roster counter seeded at 0, not null."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
          assert:
            - "trigger returns HTTP 201 with response_type == object"
            - "data.code == spa, data.name == Spanish, data.tier_class == DESIGNATED, data.oral_exam_available == true"
            - "data.telephonic_vendor_available == false (declared default)"
            - "data.active_credentialed_count == 0"
            - "data.id is a UUID with no type prefix, data.version == 1, data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"

      - name: courthouse_retrieval_returns_the_stored_row_including_computed_ledger
        claim_type: Retrieval
        grounds: [entities.Courthouse, "endpoints[GET /courthouses/{id}]"]
        distinguishing_aspect: "GET /courthouses/{id} echoes every input field and reports the three ledger fields at their empty-book values, with available_pay_cents equal to the full budget."
        test_recipe:
          setup:
            - "One courthouse created with pay_budget_cents 5000000 and no assignments anywhere."
          setup_api_calls:
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000 }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
          trigger:
            - call: "GET /courthouses/${ch_main}"
              payload: {}
              as: SchedulingCoordinator
          assert:
            - "trigger returns HTTP 200 with data.id == ${ch_main}"
            - "data.name == Capitol Main Courthouse, data.county_code == CAS, data.courtroom_count == 12, data.remote_equipment_tier == CERTIFIED_VRI, data.vri_concurrent_capacity == 1"
            - "data.status == OPEN (declared default)"
            - "data.pay_budget_cents == 5000000, data.encumbered_pay_cents == 0, data.obligated_pay_cents == 0, data.available_pay_cents == 5000000"

      - name: interpreter_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["endpoints[GET /interpreters]", response_envelope.pagination_fields]
        distinguishing_aspect: "total_count reports the whole filtered set (3) while data carries only the page; has_more is true on the first page of two and false on the second, and the roster_status filter narrows total_count itself."
        test_recipe:
          setup:
            - "Three interpreters exist, all still APPLICANT (no credentials): Ana Reyes, Bo Lim, Dev Kaur."
          setup_api_calls:
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
            - call: "POST /interpreters"
              payload: { full_name: "Bo Lim", email: "bo.lim@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
            - call: "POST /interpreters"
              payload: { full_name: "Dev Kaur", email: "dev.kaur@courts.example.gov", home_county_code: "NOR" }
              as: CredentialingOfficer
          trigger:
            - call: "GET /interpreters"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /interpreters"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /interpreters"
              payload: { home_county_code: "NOR" }
              as: ProgramAdmin
          assert:
            - "first trigger returns HTTP 200 with response_type == array, total_count == 3, limit == 2, offset == 0, has_more == true, and exactly 2 rows"
            - "second trigger returns total_count == 3, offset == 2, has_more == false, and exactly 1 row"
            - "third trigger returns total_count == 1 with the single NOR row (the filter narrows total_count, not just the page)"
            - "no row appears in both the first and the second page"

      - name: hearing_get_with_unknown_uuid_returns_not_found
        claim_type: Not Found
        grounds: ["validations[priority=4]", "errors[ERR_HEARING_NOT_FOUND]", "endpoints[GET /hearings/{id}]"]
        distinguishing_aspect: "A syntactically valid but unknown UUID on the hearings path yields the hearing-specific 404 error_id, not a generic config-resource 404."
        test_recipe:
          setup:
            - "Empty database; no hearing has ever been created."
          setup_api_calls: []
          trigger:
            - call: "GET /hearings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SchedulingCoordinator
          assert:
            - "trigger returns HTTP 404 with response_type == error and data.error_id == ERR_HEARING_NOT_FOUND"

      - name: hearing_create_without_scheduled_end_is_rejected
        claim_type: Required Fields
        grounds: [entities.Hearing, "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "scheduled_end has source input with no default, so omitting it fails shape validation at priority 3 and no Hearing row is created."
        test_recipe:
          setup:
            - "One language and one courthouse exist so that only the missing field can fail."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000 }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
          trigger:
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_spa}", case_number: "CR-2026-0900", hearing_type: "TRIAL", in_custody: true, scheduled_start: "2026-09-10T09:00:00.000Z", requested_delivery_mode: "IN_PERSON" }
              as: SchedulingCoordinator
          assert:
            - "trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /hearings returns total_count == 0"

      - name: interpreter_create_omitting_optional_flags_applies_declared_defaults
        claim_type: Defaults
        grounds: [entities.Interpreter, "endpoints[POST /interpreters]"]
        distinguishing_aspect: "accepts_in_person, accepts_remote, phone, roster_status, ethics_training_status and every computed score must land on their declared defaults, including the quality scores at 100 rather than 0 or null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
          assert:
            - "trigger returns HTTP 201 with data.accepts_in_person == true and data.accepts_remote == true"
            - "data.phone == null, data.ethics_completed_on == null, data.suspension_through == null"
            - "data.roster_status == APPLICANT, data.ethics_training_status == NOT_STARTED"
            - "data.credential_tier == NONE, data.credentialed_language_ids == []"
            - "data.complaint_points == 0, data.rolling_12_month_score == 100, data.lifetime_score == 100"
            - "data.pending_pay_cents == 0, data.paid_pay_cents == 0, data.version == 1"

      - name: hearing_priority_and_lead_time_are_computed_and_client_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Hearing.priority_score, entities.Hearing.lead_time_days, calculations.hearing_priority_score]
        distinguishing_aspect: "The client sends priority_score 5, priority_class C, lead_time_days 999 and status SERVED; all four are ignored and recomputed from the formula (PLEA 30 + custody 0 + NON_DESIGNATED 5 + urgency 0 = 35, class C, lead 44 days)."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z; language kor (NON_DESIGNATED); courthouse CH_MAIN."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "kor", name: "Korean", tier_class: "NON_DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_kor: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000 }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
          trigger:
            - call: "POST /hearings"
              payload: { courthouse_id: "${ch_main}", language_id: "${lang_kor}", case_number: "CR-2026-0901", hearing_type: "PLEA", in_custody: false, scheduled_start: "2026-09-14T09:00:00.000Z", scheduled_end: "2026-09-14T10:00:00.000Z", requested_delivery_mode: "IN_PERSON", priority_score: 5, priority_class: "C", lead_time_days: 999, status: "SERVED" }
              as: SchedulingCoordinator
          assert:
            - "trigger returns HTTP 201 with data.lead_time_days == 44 and data.priority_score == 35 (30 + 0 + 5 + max(0, 20 - 2 x 44))"
            - "data.priority_class == C"
            - "data.status == SCHEDULED — the supplied SERVED is ignored"
            - "data.continuance_count == 0 and data.continuance_reason_code == null"

      - name: language_system_fields_are_server_minted_and_client_input_ignored
        claim_type: System Fields
        grounds: [entities.Language, response_envelope]
        distinguishing_aspect: "Client-supplied id, created_at, updated_at, version and the computed active_credentialed_count are all discarded: the row gets a fresh server UUID, version 1 and count 0."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /languages"
              payload: { code: "mix", name: "Mixteco Bajo", tier_class: "RARE", oral_exam_available: false, telephonic_vendor_available: true, id: "11111111-1111-4111-8111-111111111111", version: 77, created_at: "2000-01-01T00:00:00.000Z", updated_at: "2000-01-01T00:00:00.000Z", active_credentialed_count: 42 }
              as: ProgramAdmin
          assert:
            - "trigger returns HTTP 201 with data.id != 11111111-1111-4111-8111-111111111111"
            - "data.version == 1 and data.active_credentialed_count == 0"
            - "data.created_at != 2000-01-01T00:00:00.000Z"
            - "data.tier_class == RARE, data.oral_exam_available == false, data.telephonic_vendor_available == true"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: exam_attempt_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds: [entities.ExamAttempt, "endpoints[GET /credentials/{id}/exam-attempts]"]
        distinguishing_aspect: "ExamAttempt is declared common_fields false: the row exposes id and created_at but no version and no updated_at, §1.5 offers no update or delete endpoint for it, and a failed attempt is preserved rather than overwritten by the next one."
        test_recipe:
          setup:
            - "Interpreter Ana Reyes with a CERTIFIED spa credential in PENDING_WRITTEN; a failing written attempt of 62 on 2026-08-01 and a passing written attempt of 86 recorded on 2026-11-01 (more than RETAKE_WAIT_DAYS 90 later)."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { i1: "$.data.id", i1_v1: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i1}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${i1_v1}" }
              as: CredentialingOfficer
              captures: { cred1: "$.data.id" }
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 62, taken_on: "2026-08-01" }
              as: CredentialingOfficer
              captures: { ea1: "$.data.id", ea1_result: "$.data.result", ea1_ordinal: "$.data.attempt_ordinal" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-11-01" }
              as: CredentialingOfficer
            - call: "GET /credentials/${cred1}/exam-attempts"
              payload: { exam_type: "WRITTEN" }
              as: CredentialingOfficer
          assert:
            - "${ea1_result} == FAIL and ${ea1_ordinal} == 1"
            - "first trigger returns HTTP 201 with data.result == PASS, data.attempt_ordinal == 2, data.credential_id == ${cred1}"
            - "first trigger response carries data.id and data.created_at but no version and no updated_at field"
            - "second trigger returns total_count == 2 with both rows preserved, ordered by created_at ASC, the first still score 62 / FAIL"
            - "GET /credentials/${cred1} returns written_attempt_count == 2 and written_best_score == 86 (best, not last)"

      - name: credential_create_with_unknown_target_tier_is_rejected
        claim_type: Type Constraints
        grounds: [entities.Credential.target_tier, "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "target_tier is an enum of exactly four values; JOURNEYMAN is outside the declared set and fails at priority 3 before any credentialing rule (priority 21 or 23) can run."
        test_recipe:
          setup:
            - "One language and one interpreter exist; the interpreter holds no credential yet."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { i1: "$.data.id", i1_v1: "$.data.version" }
          trigger:
            - call: "POST /credentials"
              payload: { interpreter_id: "${i1}", language_id: "${lang_spa}", target_tier: "JOURNEYMAN", expected_interpreter_version: "${i1_v1}" }
              as: CredentialingOfficer
          assert:
            - "trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /credentials?interpreter_id=${i1} returns total_count == 0"
            - "GET /interpreters/${i1} returns roster_status == APPLICANT and version == ${i1_v1} (the rejected call did not bump the parent)"

      - name: exam_attempt_under_unknown_credential_parent_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.ExamAttempt.parent, "validations[priority=4]", "errors[ERR_CREDENTIAL_NOT_FOUND]"]
        distinguishing_aspect: "ExamAttempt declares Credential as its parent and is only reachable through the nested route, so an unknown parent id fails path existence at priority 4 with the credential-specific 404 even though the body itself is well formed."
        test_recipe:
          setup:
            - "Empty database; no credential has ever been created."
          setup_api_calls: []
          trigger:
            - call: "POST /credentials/00000000-0000-4000-8000-000000000000/exam-attempts"
              payload: { exam_type: "WRITTEN", score: 86, taken_on: "2026-08-01" }
              as: CredentialingOfficer
          assert:
            - "trigger returns HTTP 404 with data.error_id == ERR_CREDENTIAL_NOT_FOUND"

      - name: assignment_create_with_unresolvable_body_foreign_key_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Assignment.hearing_id, "validations[priority=5]", "errors[ERR_HEARING_NOT_FOUND]", complexity_profile.entity_topology]
        distinguishing_aspect: "The topology is flat, so cross-references arrive in the body: an unknown hearing_id must fail body-FK resolution at priority 5 with the hearing-specific 404, and it must do so before the OCC check at priority 8 even though expected_hearing_version is meaningless for a row that does not exist."
        test_recipe:
          setup:
            - "Language spa, courthouse CH_MAIN and an ACTIVE interpreter exist, but no hearing has been created."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /courthouses"
              payload: { name: "Capitol Main Courthouse", county_code: "CAS", courtroom_count: 12, remote_equipment_tier: "CERTIFIED_VRI", vri_concurrent_capacity: 1, pay_budget_cents: 5000000 }
              as: ProgramAdmin
              captures: { ch_main: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { i1: "$.data.id", i1_v1: "$.data.version" }
          trigger:
            - call: "POST /assignments"
              payload: { hearing_id: "00000000-0000-4000-8000-000000000000", interpreter_id: "${i1}", delivery_mode: "IN_PERSON", expected_hearing_version: "${i1_v1}" }
              as: SchedulingCoordinator
          assert:
            - "trigger returns HTTP 404 with data.error_id == ERR_HEARING_NOT_FOUND (priority 5 precedes the priority 8 OCC check)"
            - "GET /assignments returns total_count == 0"

  # =========================================================================
  - section: State Machines
    instances:

      - name: credential_initial_state_branches_on_target_tier_and_language_class
        claim_type: Initial State
        grounds: [state_machines.Credential.initial_state, "validations[priority=21]", entities.Credential.status]
        distinguishing_aspect: "A CERTIFIED credential starts at PENDING_WRITTEN, while a PROVISIONAL credential in a RARE language skips both examination stages and starts at PENDING_ETHICS — the initial state is not a constant."
        test_recipe:
          setup:
            - "Languages spa (DESIGNATED, oral_exam_available true) and mix (RARE, oral_exam_available false, telephonic_vendor_available true)."
            - "One interpreter, Bo Lim, with no credential yet; the two credentials are in different languages so the per-language uniqueness rule at priority 23 cannot fire."
          setup_api_calls:
            - call: "POST /languages"
              payload: { code: "spa", name: "Spanish", tier_class: "DESIGNATED", oral_exam_available: true }
              as: ProgramAdmin
              captures: { lang_spa: "$.data.id" }
            - call: "POST /languages"
              payload: { code: "mix", name: "Mixteco Bajo", tier_class: "RARE", oral_exam_available: false, telephonic_vendor_available: true }
              as: ProgramAdmin
              captures: { lang_mix: "$.data.id" }
            - call: "POST /interpreters"
              payload: { full_name: "Bo Lim", email: "bo.lim@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { i5: "$.data.id", i5_v1: "$.data.version" }
          trigger:
            - call: "POST /credentials"
              payload: { interpreter_id: "${i5}", language_id: "${lang_spa}", target_tier: "CERTIFIED", expected_interpreter_version: "${i5_v1}" }
              as: CredentialingOfficer
            - call: "GET /interpreters/${i5}"
              payload: {}
              as: CredentialingOfficer
              captures: { i5_v2: "$.data.version" }
            - call: "POST /credentials"
              payload: { interpreter_id: "${i5}", language_id: "${lang_mix}", target_tier: "PROVISIONAL", expected_interpreter_version: "${i5_v2}" }
              as: CredentialingOfficer
          assert:
            - "first trigger returns HTTP 201 with data.status == PENDING_WRITTEN, data.tier == null, data.written_attempt_count == 0, data.oral_attempt_count == 0, data.renewal_count == 0"
            - "second trigger shows roster_status == CANDIDATE (the first credential moved the interpreter off APPLICANT) and ${i5_v2} > ${i5_v1}"
            - "third trigger returns HTTP 201 with data.status == PENDING_ETHICS — a PROVISIONAL credential in a RARE language enters the ethics stage directly"
            - "third trigger returns data.issued_on == null, data.expires_on == null, data.grace_through == null"
            - "GET /credentials?interpreter_id=${i5} returns total_count == 2"

      - name: complaint_adjudicate_before_review_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_COMPLAINT_STATE]", state_machines.Complaint.FILED_to_REVIEWED]
        distinguishing_aspect: "adjudicate is only defined from REVIEWED; invoking it on a FILED complaint must fail at priority 12 and must not create a DisciplinaryAction or touch the interpreter's points."
        test_recipe:
          setup:
            - "One interpreter, Ana Reyes, with a complaint C1 (ETHICS, SEVERE) filed against her but not yet reviewed. The complaint carries no assignment_id, so no assignment compliance dimension is involved."
          setup_api_calls:
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { i1: "$.data.id" }
            - call: "POST /complaints"
              payload: { interpreter_id: "${i1}", category: "ETHICS", severity: "SEVERE", narrative: "Interpreter discussed the case with a juror in the hallway." }
              as: QualityReviewer
              as_user_id: "qr-001"
              captures: { c1: "$.data.id", c1_status: "$.data.status", c1_filer: "$.data.filed_by_user_id" }
          trigger:
            - call: "POST /complaints/${c1}/adjudicate"
              payload: { disposition: "SUBSTANTIATED", sanction_type: "REVOCATION" }
              as: ProgramAdmin
              as_user_id: "pa-001"
          assert:
            - "${c1_status} == FILED and ${c1_filer} == qr-001"
            - "trigger returns HTTP 409 with data.error_id == ERR_INVALID_COMPLAINT_STATE"
            - "GET /complaints/${c1} returns status == FILED, disposition == null, adjudicator_user_id == null, adjudicated_at == null"
            - "GET /disciplinary-actions?interpreter_id=${i1} returns total_count == 0"
            - "GET /interpreters/${i1} returns roster_status == APPLICANT and complaint_points == 0"

      - name: complaint_review_twice_is_rejected_on_the_second_call
        claim_type: Idempotency
        grounds: ["validations[priority=12]", "errors[ERR_INVALID_COMPLAINT_STATE]", "endpoints[POST /complaints/{id}/review]"]
        distinguishing_aspect: "review is not idempotent: the first call moves FILED -> REVIEWED and records the reviewer, the second identical call is refused at priority 12 and must not overwrite reviewer_user_id, reviewer_recommendation or the version."
        test_recipe:
          setup:
            - "Complaint C1 (ACCURACY, MAJOR) filed against Ana Reyes by qr-001; qr-002 is a different quality reviewer, so the segregation rule at priority 7 is satisfied on both calls."
          setup_api_calls:
            - call: "POST /interpreters"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@courts.example.gov", home_county_code: "CAS" }
              as: CredentialingOfficer
              captures: { i1: "$.data.id" }
            - call: "POST /complaints"
              payload: { interpreter_id: "${i1}", category: "ACCURACY", severity: "MAJOR", narrative: "Two answers rendered in summary form." }
              as: QualityReviewer
              as_user_id: "qr-001"
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /complaints/${c1}/review"
              payload: { recommendation: "SUBSTANTIATE", findings: "Recording confirms summarisation." }
              as: QualityReviewer
              as_user_id: "qr-002"
            - call: "POST /complaints/${c1}/review"
              payload: { recommendation: "DISMISS", findings: "Second look: rendition acceptable." }
              as: QualityReviewer
              as_user_id: "qr-003"
          assert:
