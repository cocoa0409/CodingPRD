            - "data.error_id == ERR_REVERSE_FOIA_PENDING"

  # =================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: reading_room_aggregate_capacity_half_open
        grounds:
          - calculations.booking_overlap_detection
          - validations[priority=19]
          - entities.ReadingRoom.fields.capacity
        distinguishing_aspect: |
          AGGREGATE-CAPACITY half-open semantics on ReadingRoom: with capacity=1, an existing booking
          [10:00,11:00) blocks an overlapping [10:30,11:30) (ERR_ROOM_AT_CAPACITY) but a touching
          [11:00,12:00) is accepted because half-open intervals sharing an endpoint do not overlap.
        test_recipe:
          setup:
            - "A reading room with capacity=1 holding one booking [10:00,11:00) for a request."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer U", badge_id: "B-U1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /reading-rooms"
              payload: { name: "Room 1", capacity: 1 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { room_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen V", email: "v2@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Inspect docs", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /reading-rooms/${room_id}/bookings"
              payload: { request_id: "${r_id}", starts_at: "2026-03-02T10:00:00.000Z", ends_at: "2026-03-02T11:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { bk1_id: $.data.id }
          trigger:
            - call: "POST /reading-rooms/${room_id}/bookings"
              payload: { request_id: "${r_id}", starts_at: "2026-03-02T10:30:00.000Z", ends_at: "2026-03-02T11:30:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_ROOM_AT_CAPACITY   # overlaps the capacity-1 room"
            - "a separate POST [11:00,12:00) on the same room returns 201 (touching endpoint, half-open, no conflict)"

      - name: review_station_closed_interval_buffer
        grounds:
          - calculations.booking_overlap_detection
          - validations[priority=20]
          - entities.ReviewStation.fields.buffer_minutes
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource entity (ReviewStation): single-occupancy
          CLOSED intervals with a buffer_minutes=15 gap. A new booking starting exactly when the prior one
          ends (touching) is REJECTED with ERR_STATION_BUFFER_CONFLICT — the opposite adjacency rule from
          the half-open reading room.
        test_recipe:
          setup:
            - "A review station with buffer_minutes=15 holding one booking [13:00,14:00]."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer W", badge_id: "B-W1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /review-stations"
              payload: { name: "Station 1", buffer_minutes: 15 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { stn_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen X", email: "x2@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Review docs", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /review-stations/${stn_id}/bookings"
              payload: { request_id: "${r_id}", starts_at: "2026-03-02T13:00:00.000Z", ends_at: "2026-03-02T14:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { sbk1_id: $.data.id }
          trigger:
            - call: "POST /review-stations/${stn_id}/bookings"
              payload: { request_id: "${r_id}", starts_at: "2026-03-02T14:00:00.000Z", ends_at: "2026-03-02T15:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_STATION_BUFFER_CONFLICT   # touching at 14:00 within 15-min buffer of closed interval"

  # =================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_resume_conserves_outstanding_balance
        grounds:
          - state_machines.FoiaRequest.PROCESSING_to_AWAITING_PAYMENT
          - state_machines.FoiaRequest.AWAITING_PAYMENT_to_PROCESSING
          - calculations.outstanding_balance_recompute
          - entities.Requester.fields.outstanding_balance_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = Requester.outstanding_balance_cents. The forward action (fee-estimate above
          threshold) sets fee_payment_status=DUE and adds the assessed fee to the balance; the compensating
          action (payment) flips it to PAID and removes the same amount. Invariant: after PAY, the requester's
          outstanding_balance_cents returns to its pre-assessment value (0 here). Pinned: balance == sum of
          DUE requests' assessed_fee_cents.
        test_recipe:
          setup:
            - "A COMMERCIAL requester (balance 0) with one PROCESSING request; fee assessed at 45000 (>250) -> AWAITING_PAYMENT, balance 45000."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer Y", badge_id: "B-Y1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "PayCo", email: "pay@x.com", declared_category: "COMMERCIAL" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Big commercial set", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "COMMERCIAL" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v0: $.data.version }
            - call: "POST /requests/${r_id}/fee-estimate"
              payload: { search_hours: 6, review_hours: 4, billable_pages: 500, expected_request_version: "${v0}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { fee: $.data.assessed_fee_cents }
          trigger:
            - call: "POST /requests/${r_id}/payment"
              payload: { amount_cents: 45000 }
              as: Requester
              as_user_id: "${req_user_id}"
          assert:
            - "FoiaRequest(r_id).fee_payment_status == PAID"
            - "FoiaRequest(r_id).status == PROCESSING"
            - "Requester(req_user_id).outstanding_balance_cents == 0   # forward +45000 then compensating -45000"

      - name: remand_reverse_conserves_release_count_invariant
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_REVERSED
          - state_machines.ResponsiveRecord.WITHHELD_to_PENDING
          - state_machines.FoiaRequest.DENIED_to_PROCESSING
        distinguishing_aspect: |
          DIFFERENT conserved quantity = the count of ResponsiveRecords NOT yet finally released
          (records whose disposition != RELEASABLE) on a request. A DENIED request has all N records
          WITHHELD (unreleased count N). An appeal REVERSE compensates the denial by releasing every
          record: invariant after REVERSE is unreleased_count == 0 and the per-record total is unchanged
          (no record created or destroyed). Pinned: count(records) constant, unreleased_count -> 0.
        test_recipe:
          setup:
            - "A DENIED request with two WITHHELD records (each B5-cited); appeal UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /officers"
              payload: { full_name: "Officer Z", badge_id: "B-Z1" }
              as: FoiaOfficer
              as_user_id: "bootstrap-officer"
              captures: { off_id: $.data.id }
            - call: "POST /appeal-authorities"
              payload: { full_name: "Authority Three", badge_id: "A-003" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /requesters"
              payload: { full_name: "Citizen ZZ", email: "zz@x.com", declared_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { req_user_id: $.data.id }
            - call: "POST /requests"
              payload: { requester_id: "${req_user_id}", subject_description: "Two withheld docs", received_at: "2026-01-05T00:00:00.000Z" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { r_id: $.data.id }
            - call: "POST /requests/${r_id}/perfect"
              payload: { fee_category: "OTHER" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/assign"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Doc 1", page_count: 1 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec1: $.data.id }
            - call: "POST /requests/${r_id}/records"
              payload: { title: "Doc 2", page_count: 1 }
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { rec2: $.data.id }
            - call: "POST /requests/${r_id}/exemptions"
              payload: { applies_to_kind: "RECORD", exemption_code: "B5", justification: "deliberative", record_id: "${rec1}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/exemptions"
              payload: { applies_to_kind: "RECORD", exemption_code: "B5", justification: "deliberative", record_id: "${rec2}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /records/${rec1}/review"
              payload: { disposition: "WITHHELD" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /records/${rec2}/review"
              payload: { disposition: "WITHHELD" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "GET /requests/${r_id}"
              payload: {}
              as: FoiaOfficer
              as_user_id: "${off_id}"
              captures: { v_det: $.data.version }
            - call: "POST /requests/${r_id}/determination"
              payload: { expected_request_version: "${v_det}" }
              as: FoiaOfficer
              as_user_id: "${off_id}"
            - call: "POST /requests/${r_id}/appeals"
              payload: { appellant_id: "${req_user_id}", grounds: "all releasable", filed_at: "2026-02-10T00:00:00.000Z" }
              as: Requester
              as_user_id: "${req_user_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /appeals/${ap_id}/assign"
              payload: {}
              as: AppealAuthority
              as_user_id: "${auth_id}"
          trigger:
            - call: "POST /appeals/${ap_id}/decide"
              payload: { decision: "REVERSE" }
              as: AppealAuthority
              as_user_id: "${auth_id}"
          assert:
            - "Appeal(ap_id).status == REVERSED"
            - "FoiaRequest(r_id).status == GRANTED"
            - "GET /requests/${r_id}/records returns exactly 2 records (count unchanged)"
            - "both ResponsiveRecord.disposition == RELEASABLE   # unreleased_count 2 -> 0"
