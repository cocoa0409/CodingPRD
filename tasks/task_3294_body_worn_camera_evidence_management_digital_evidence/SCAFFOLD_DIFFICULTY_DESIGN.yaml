              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:01:00Z", content_hash_sha256: "gggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggggg", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rb: $.data.id }
            - call: "POST /agencies/${ag}/recordings/${rb}/reverify"
              payload: { content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
              as: Officer
              as_user_id: "${officer}"
            - call: "POST /agencies/${ag}/cases"
              payload: { case_number: "CN-1", title: "Case One", lead_officer_id: "${officer}" }
              as: Officer
              as_user_id: "${officer}"
              captures: { cs: $.data.id }
            - call: "POST /agencies/${ag}/cases/${cs}/evidence"
              payload: { recording_id: "${ra}" }
              as: Officer
              as_user_id: "${officer}"
            - call: "POST /agencies/${ag}/cases/${cs}/evidence"
              payload: { recording_id: "${rb}" }
              as: Officer
              as_user_id: "${officer}"
          trigger:
            - call: "POST /agencies/${ag}/cases/${cs}/submit-review"
              payload: {}
              as: Officer
              as_user_id: "${officer}"
              captures: { err: $.data.error_id }
          assert:
            - "Recording.${rb}.upload_status == INTEGRITY_VERIFIED after reverify (hash matches but B was never categorized: tagging_required blocked category-less upload, and the failed upload never categorized)"
            - "CaseEntity.${cs}.evidence_count == 2"
            - "trigger response status == 409 with err == ERR_EVIDENCE_NOT_READY (B is INTEGRITY_VERIFIED, not in {ACTIVE, RETENTION_DUE} — the case transition reads the recording's state across the link)"
            - "CaseEntity.${cs}.status == OPEN still"

      - name: officer_retire_blocked_by_lead_case_and_suspend_blocked_by_device
        grounds:
          - state_machines.Officer.ACTIVE_to_RETIRED
          - state_machines.Officer.ACTIVE_to_SUSPENDED
          - errors[ERR_LEAD_CASES_OPEN]
          - errors[ERR_DEVICE_STILL_ASSIGNED]
        distinguishing_aspect: "Entity pair Officer -> {CaseEntity, Device}: suspend fails with ERR_DEVICE_STILL_ASSIGNED while a device is ASSIGNED to the officer, and after unassign the retire still fails with ERR_LEAD_CASES_OPEN because the officer leads an OPEN case — two different cross-entity gates on two different transitions of the same officer, proving the officer lifecycle reads both Device.assignment_status and CaseEntity.status."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency with ACTIVE policy. Officer with an ASSIGNED docked device and an OPEN case led by that officer (no evidence needed — retire gate reads the case only)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/cases"
              payload: { case_number: "CN-1", title: "Case One", lead_officer_id: "${officer}" }
              as: Officer
              as_user_id: "${officer}"
              captures: { cs: $.data.id }
          trigger:
            - call: "POST /agencies/${ag}/officers/${officer}/suspend"
              payload: {}
              as: AgencyAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /agencies/${ag}/devices/${dev}/unassign"
              payload: {}
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/officers/${officer}/retire"
              payload: {}
              as: AgencyAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_DEVICE_STILL_ASSIGNED (suspend reads Device.assignment_status)"
            - "err2 == ERR_LEAD_CASES_OPEN (retire reads CaseEntity.status OPEN across the lead_officer_id link — after the device gate is cleared)"
            - "Officer.${officer}.status == ACTIVE still"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: docking_session_single_occupancy_half_open
        grounds:
          - state_machines.Device.UNDOCKED_to_DOCKED
          - state_machines.Device.DOCKED_to_UNDOCKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Interval semantics: single-occupancy with half-open boundaries on the Device resource — dock while DOCKED fails (no double-occupancy), undock while UNDOCKED fails, and dock -> undock -> dock at distinct clock positions succeeds because the first occupancy [dock, undock) ends exactly when the second begins; the boundary instant belongs to the new session, not the old."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency with ACTIVE policy. Device registered (starts DOCKED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
          trigger:
            - call: "POST /agencies/${ag}/devices/${dev}/dock"
              payload: {}
              as: DeviceCoordinator
              captures: { err1: $.data.error_id }
            - call: "POST /agencies/${ag}/devices/${dev}/undock"
              payload: {}
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/devices/${dev}/undock"
              payload: {}
              as: DeviceCoordinator
              captures: { err2: $.data.error_id }
            - call: "POST /agencies/${ag}/devices/${dev}/dock"
              payload: {}
              as: DeviceCoordinator
              captures: { devd: $.data.id }
          assert:
            - "err1 == ERR_INVALID_STATE (dock on an already-DOCKED device: overlapping occupancy rejected)"
            - "err2 == ERR_INVALID_STATE (undock on an already-UNDOCKED device: no open interval to close)"
            - "the final dock succeeds (status 200) — after undock the occupancy interval is closed and the same instant is available to the next session (half-open semantics)"
            - "Device.${dev}.dock_status == DOCKED"

      - name: policy_activation_mutual_exclusion_across_supersede_window
        grounds:
          - state_machines.AgencyPolicy.DRAFT_to_ACTIVE
          - state_machines.AgencyPolicy.ACTIVE_to_SUPERSEDED
          - errors[ERR_POLICY_ALREADY_ACTIVE]
        distinguishing_aspect: "Interval semantics: aggregate-capacity mutual exclusion on the Agency policy slot — at most one ACTIVE policy occupies the agency's policy window; a second activation while the first occupies it fails with ERR_POLICY_ALREADY_ACTIVE, and only after supersede closes the first policy's active interval can the second activate. Different interval arithmetic from the dock session: capacity-of-one over the agency aggregate, not a per-resource open/closed pair."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency with two DRAFT policies P1 (tagging false, rate 0) and P2 (tagging true, rate 50)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: false, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { p1: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL", "TASER_ARMED"], tagging_required: true, supervisor_review_rate_pct: 50, default_share_expiry_days: 14 }
              as: AgencyAdmin
              captures: { p2: $.data.id }
            - call: "POST /agencies/${ag}/policies/${p1}/activate"
              payload: {}
              as: AgencyAdmin
          trigger:
            - call: "POST /agencies/${ag}/policies/${p2}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /agencies/${ag}/policies/${p1}/supersede"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/policies/${p2}/activate"
              payload: {}
              as: AgencyAdmin
              captures: { p2a: $.data.id }
          assert:
            - "err1 == ERR_POLICY_ALREADY_ACTIVE (P1's active window still occupied the agency slot)"
            - "second activate succeeds: AgencyPolicy.${p2a}.status == ACTIVE (P1's window closed by supersede first)"
            - "GET policies list shows P1 SUPERSEDED and P2 ACTIVE — exactly one ACTIVE policy for the agency"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: hold_place_release_preserves_purgeable_count
        grounds:
          - state_machines.LegalHold.ACTIVE_to_RELEASED
          - state_machines.Recording.ACTIVE_to_RETENTION_DUE
          - state_machines.Recording.RETENTION_DUE_to_PURGED
          - entities.Recording.fields.legal_hold_count
        distinguishing_aspect: "Conserved quantity: count of purge-eligible recordings (RETENTION_DUE with legal_hold_count == 0) plus held recordings. A RETENTION_DUE recording placed under a RECORDING-scoped hold is skipped by the retention run (purged == 0, held_skipped == 1); releasing the hold and re-running purges it — the pair place+release leaves the agency's storage_used_bytes after the full cycle exactly as if no hold had existed (0 after purge), and no recording is ever purged while held."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency with ACTIVE policy (tagging true, rate 0). Officer with assigned device. One ACTIVE INCIDENT recording (1 MiB). Clock advanced 200 days so the recording is past retention; an ACTIVE RECORDING-scoped legal hold covers it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rec: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/legal-holds"
              payload: { scope_type: "RECORDING", recording_id: "${rec}", authority_reference: "SUBP-2027-01" }
              as: RecordsOfficer
              captures: { hold: $.data.id }
          trigger:
            - call: "POST /agencies/${ag}/retention/run"
              payload: {}
              as: AgencyAdmin
              captures: { run1: $.data }
            - call: "POST /agencies/${ag}/legal-holds/${hold}/release"
              payload: {}
              as: RecordsOfficer
            - call: "POST /agencies/${ag}/retention/run"
              payload: {}
              as: AgencyAdmin
          assert:
            - "first run: purged == 0 and held_skipped == 1 (hold overrides retention — purge blocked)"
            - "Recording.${rec}.upload_status == RETENTION_DUE after the first run (marked due, not purged)"
            - "Recording.${rec}.legal_hold_count == 0 after the release"
            - "second run: purged == 1 and Recording.${rec}.upload_status == PURGED (place+release left the purge pipeline with zero net drift)"
            - "Agency.${ag}.storage_used_bytes == 0 after the second run"

      - name: case_link_unlink_preserves_agency_storage_total
        grounds:
          - state_machines.CaseEvidenceLink.LINKED_to_UNLINKED
          - calculations.case_retention_due_at
          - entities.Agency.fields.storage_used_bytes
        distinguishing_aspect: "Conserved quantity: agency.storage_used_bytes across a link/unlink pair. Linking an ACTIVE 1 MiB recording to a case raises case.total_evidence_bytes to 1048576 and evidence_count to 1 while agency.storage_used_bytes stays 1048576; unlinking returns case totals to 0/null while agency.storage_used_bytes STILL reads 1048576 — link+unlink conserve the agency-level byte total exactly (the recording never left ACTIVE), proving the pair is a no-op on the conserved quantity."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Agency with ACTIVE policy (tagging true, rate 0). Officer with assigned device. One ACTIVE INCIDENT recording (1 MiB). One OPEN case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /agencies"
              payload: { name: "Metro PD" }
              as: AgencyAdmin
              captures: { ag: $.data.id }
            - call: "POST /agencies/${ag}/policies"
              payload: { recording_triggers: ["MANUAL"], tagging_required: true, supervisor_review_rate_pct: 0, default_share_expiry_days: 30 }
              as: AgencyAdmin
              captures: { pol: $.data.id }
            - call: "POST /agencies/${ag}/policies/${pol}/activate"
              payload: {}
              as: AgencyAdmin
            - call: "POST /agencies/${ag}/officers"
              payload: { badge_number: "B-100", full_name: "Ana Ruiz", rank: "OFFICER" }
              as: AgencyAdmin
              captures: { officer: $.data.id }
            - call: "POST /agencies/${ag}/devices"
              payload: { serial_number: "SN-1", model: "AXON-B4" }
              as: DeviceCoordinator
              captures: { dev: $.data.id }
            - call: "POST /agencies/${ag}/devices/${dev}/assign"
              payload: { officer_id: "${officer}" }
              as: DeviceCoordinator
            - call: "POST /agencies/${ag}/recordings"
              payload: { device_id: "${dev}", trigger_code: "MANUAL", duration_seconds: 60, size_bytes: 1048576, recorded_at: "2026-09-01T00:00:00Z", content_hash_sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", category: "INCIDENT" }
              as: Officer
              as_user_id: "${officer}"
              captures: { rec: $.data.id }
            - call: "POST /agencies/${ag}/cases"
              payload: { case_number: "CN-1", title: "Case One", lead_officer_id: "${officer}" }
              as: Officer
              as_user_id: "${officer}"
              captures: { cs: $.data.id }
          trigger:
            - call: "POST /agencies/${ag}/cases/${cs}/evidence"
              payload: { recording_id: "${rec}" }
              as: Officer
              as_user_id: "${officer}"
              captures: { lnk: $.data.id }
            - call: "GET /agencies/${ag}"
              payload: {}
              as: RecordsOfficer
              captures: { used_mid: $.data.storage_used_bytes }
            - call: "DELETE /agencies/${ag}/cases/${cs}/evidence/${lnk}"
              payload: {}
              as: Officer
              as_user_id: "${officer}"
          assert:
            - "used_mid == 1048576 (link did not double-count: agency total conserved through the forward action)"
            - "after unlink: CaseEntity.${cs}.evidence_count == 0 and total_evidence_bytes == 0 and retention_due_at is null"
            - "Agency.${ag}.storage_used_bytes == 1048576 (link+unlink pair net-zero on the conserved agency byte total)"
            - "CaseEvidenceLink.${lnk}.status == UNLINKED with unlinked_at == 2026-09-01T00:00:00Z"
