            - "${s15_err} == ERR_COMMAND_CENTER_NOT_ACTIVATED with HTTP 409"
            - "SurveyWindow.${s15_sw}.window_state == ELIGIBLE and survey_opened_at == null"
            - "HospitalUnit.${s15_u}.posture == OPEN (no cascade fired)"

