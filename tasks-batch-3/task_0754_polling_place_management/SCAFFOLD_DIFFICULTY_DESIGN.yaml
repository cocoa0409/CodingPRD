              payload: { poll_worker_id: "${wc}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { ac: $.data.id }
            - call: "POST /assignments/${ac}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /shifts"
              payload: { assignment_id: "${ac}", scheduled_start: "2026-11-03T06:00:00Z", scheduled_end: "2026-11-03T12:00:00Z" }
              as: PrecinctCaptain
              captures: { s_id: $.data.id }
            - call: "POST /polling-places/${pp_id}/suspend"
              payload: { reason: "outage" }
              as: PrecinctCaptain
          trigger:
            - call: "POST /shifts/${s_id}/check-in"
              payload: {}
              as: PrecinctCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Shift.${s_id}.status == SCHEDULED"
            - "PollingPlace.${pp_id}.readiness_posture == SUSPENDED"

      - name: open_requires_equipment_operational
        grounds:
          - state_machines.PollingPlace.SETUP_to_OPEN
          - entities.EquipmentUnit.fields.status
          - validations[priority=6]
        distinguishing_aspect: "PollingPlace open depends on EquipmentUnit state (pair PollingPlace->EquipmentUnit, distinct from Shift->PollWorker): a place whose deployed scanner is OUT_OF_SERVICE cannot open and returns ERR_EQUIPMENT_NOT_OPERATIONAL despite meeting quorum and having a kit AT_PLACE."
        test_recipe:
          setup:
            - "Place staffed to quorum, kit AT_PLACE, scanner deployed then driven OUT_OF_SERVICE via an escalated equipment incident; place still SETUP (never opened)."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /elections/${el_id}/open-voting"
              payload: {}
              as: ElectionAdmin
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "Precinct 1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 5, station_capacity: 5 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /equipment"
              payload: { equipment_type: "SCANNER", serial_number: "SN-1" }
              as: ElectionAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /equipment/${eq_id}/deploy"
              payload: { polling_place_id: "${pp_id}" }
              as: ElectionAdmin
            - call: "POST /supply-kits"
              payload: { election_id: "${el_id}", ballot_count: 500, seal_number: "SEAL-1" }
              as: CustodyOfficer
              captures: { kit_id: $.data.id }
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "ISSUE" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "DISPATCH" }
              as: CustodyOfficer
            - call: "POST /supply-kits/${kit_id}/custody-events"
              payload: { event_type: "RECEIVE", polling_place_id: "${pp_id}" }
              as: CustodyOfficer
            - call: "POST /poll-workers"
              payload: { full_name: "Cert W", email: "cw@x.com" }
              as: ElectionAdmin
              captures: { wc: $.data.id }
            - call: "POST /poll-workers/${wc}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${wc}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { ac: $.data.id }
            - call: "POST /assignments/${ac}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /incidents"
              payload: { polling_place_id: "${pp_id}", category: "EQUIPMENT", description: "DOA scanner", equipment_unit_id: "${eq_id}" }
              as: SupportAgent
              captures: { inc_id: $.data.id }
            - call: "POST /incidents/${inc_id}/escalate"
              payload: {}
              as: SupportAgent
          trigger:
            - call: "POST /polling-places/${pp_id}/open"
              payload: {}
              as: PrecinctCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EQUIPMENT_NOT_OPERATIONAL"
            - "EquipmentUnit.${eq_id}.status == OUT_OF_SERVICE"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: worker_shift_pairwise_overlap_half_open
        grounds:
          - validations[priority=8]
          - entities.Shift.fields.scheduled_start
          - entities.Shift.fields.scheduled_end
        distinguishing_aspect: "Per-worker pairwise overlap (resource PollWorker), half-open [start,end): a second shift 11:00-13:00 for a worker already holding 09:00-12:00 is rejected with ERR_WORKER_SHIFT_OVERLAP, but an adjacent 12:00-14:00 shift (sharing only the boundary) is allowed."
        test_recipe:
          setup:
            - "One certified worker with an ACTIVE assignment holds shift 09:00-12:00; attempt to schedule an overlapping 11:00-13:00 shift for the same worker."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "Precinct 1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 5, station_capacity: 5 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /poll-workers"
              payload: { full_name: "Jane Poll", email: "jane@x.com" }
              as: ElectionAdmin
              captures: { w_id: $.data.id }
            - call: "POST /poll-workers/${w_id}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${w_id}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { a_id: $.data.id }
            - call: "POST /assignments/${a_id}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /shifts"
              payload: { assignment_id: "${a_id}", scheduled_start: "2026-11-03T09:00:00Z", scheduled_end: "2026-11-03T12:00:00Z" }
              as: PrecinctCaptain
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { assignment_id: "${a_id}", scheduled_start: "2026-11-03T11:00:00Z", scheduled_end: "2026-11-03T13:00:00Z" }
              as: PrecinctCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_WORKER_SHIFT_OVERLAP"

      - name: place_station_aggregate_capacity_overlap
        grounds:
          - validations[priority=9]
          - entities.PollingPlace.fields.station_capacity
        distinguishing_aspect: "Aggregate-capacity overlap on a different resource (PollingPlace, station_capacity=1): a second worker's shift 11:00-13:00 overlapping an existing 09:00-12:00 shift at the same place is rejected with ERR_PLACE_CAPACITY_EXCEEDED — count-of-overlaps semantics, not pairwise same-worker."
        test_recipe:
          setup:
            - "Place station_capacity=1; worker A holds shift 09:00-12:00; worker B (different worker) attempts an overlapping 11:00-13:00 shift at the same place."
          setup_api_calls:
            - call: "POST /elections"
              payload: { name: "General", jurisdiction: "COUNTY-1", election_date: "2026-11-03", initial_ballot_stock: 10000 }
              as: ElectionAdmin
              captures: { el_id: $.data.id }
            - call: "POST /polling-places"
              payload: { election_id: "${el_id}", name: "Precinct 1", address: "1 Main St", min_workers_required: 1, staffing_capacity: 5, station_capacity: 1 }
              as: ElectionAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /poll-workers"
              payload: { full_name: "W A", email: "a@x.com" }
              as: ElectionAdmin
              captures: { wa: $.data.id }
            - call: "POST /poll-workers/${wa}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${wa}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { aa: $.data.id }
            - call: "POST /assignments/${aa}/activate"
              payload: {}
              as: PrecinctCaptain
            - call: "POST /shifts"
              payload: { assignment_id: "${aa}", scheduled_start: "2026-11-03T09:00:00Z", scheduled_end: "2026-11-03T12:00:00Z" }
              as: PrecinctCaptain
              captures: { sa: $.data.id }
            - call: "POST /poll-workers"
              payload: { full_name: "W B", email: "b@x.com" }
              as: ElectionAdmin
              captures: { wb: $.data.id }
            - call: "POST /poll-workers/${wb}/complete-training"
              payload: {}
              as: ElectionAdmin
            - call: "POST /assignments"
              payload: { poll_worker_id: "${wb}", polling_place_id: "${pp_id}" }
              as: PrecinctCaptain
              captures: { ab: $.data.id }
            - call: "POST /assignments/${ab}/activate"
              payload: {}
