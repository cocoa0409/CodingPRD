# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2884 — Ballot Measure Petition Signature Verification
#
# Every `grounds:` entry resolves into SCAFFOLD.yaml §1.1–§1.6. Every `setup_api_calls`
# entry is a structured call against a §1.5 endpoint with a role drawn from §1.7.
# Every numeric literal in an `assert:` line was executed against the §1.3 formula and
# its `constants:` before being written here.
#
# Shared fixture vocabulary used across instances (all values are literals, never inferred):
#   clock                 logical clock starts at 2026-08-01T00:00:00Z
#   standard SOS-FULL     gubernatorial_vote_total 100, signature_pct_bps 200 -> required_valid_signatures 2
#                         sample_pct_bps 10000 / sample_min_count 1 (census draw)
#                         sufficiency_upper_bps 15000 -> upper_gate 3; sufficiency_lower_bps 5000 -> lower_gate 1
#                         county_distribution_pct_bps 500, required_qualifying_counties 1
#                         verification_rate_millicents_per_signature 4750, county_surcharge_bps 250
#                         cure_allowed true, cure_window_days 30, cure_eligibility_floor_bps 5000
#   standard SOS-POOLED-A same, but sample_pct_bps 5000 / sample_min_count 2, stratification_mode POOLED
#   standard SOS-STRAT-A  same as SOS-POOLED-A, but stratification_mode STRATIFIED
#   county ALPHA          registered_voter_count 20 -> distribution minimum ceil(20*500/10000) == 1
#   county BRAVO          registered_voter_count 20 -> distribution minimum 1
#   cleared_at            2026-08-01T00:00:00.000Z; circulation_deadline 2027-01-28T00:00:00.000Z (+180d)
#   per-batch cost        round_half_up(n * 4750 / 1000): 1 line -> 5c, 2 lines -> 10c, 3 lines -> 14c, 4 lines -> 19c

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: pooled_vs_stratified_projection_divergence_on_petition
        grounds:
          - calculations.sample_selection
          - calculations.sample_projection
          - entities.VerificationStandard.fields.stratification_mode
          - entities.VerificationRound.fields.projected_valid_count
          - entities.VerificationRound.fields.validity_rate_bps
        distinguishing_aspect: |
          This instance's two variants live in the Petition/VerificationRound signature-projection
          domain: byte-identical line data (2 accepted lines in ALPHA, 2 in BRAVO, exactly one ALPHA
          line unregistered) projects 4 valid signatures at a round-level rate of 10000 bps under
          pooled_projection and 3 at 7500 bps under stratified_projection, because STRATIFIED applies
          sample_min_count once per county and extrapolates each county's own rate over that county's
          accepted total.
        test_recipe:
          setup:
            - "Two verification standards differing ONLY in stratification_mode: SOS-POOLED-A (POOLED) and SOS-STRAT-A (STRATIFIED); both carry sample_pct_bps 5000 and sample_min_count 2."
            - "Counties ALPHA and BRAVO, each with registered_voter_count 20."
            - "Voter roll: VA1 ACTIVE (ALPHA), VA2 INACTIVE (ALPHA), VB1 ACTIVE (BRAVO), VB2 ACTIVE (BRAVO)."
            - "Two petitions cleared for circulation on 2026-08-01: pet_p under SOS-POOLED-A, pet_s under SOS-STRAT-A. Each has required_valid_signatures 2, upper_gate 3, lower_gate 1."
            - "Each petition carries one ALPHA batch (lines 1=VA1, 2=VA2) and one BRAVO batch (lines 1=VB1, 2=VB2), all affidavit-verified, all signed_on 2026-08-05, so accepted_raw_total == 4 on both petitions."
            - "Both petitions are SIGNATURES_FILED with one OPEN RANDOM_SAMPLE round each; every line the round selected has been validated by its county clerk."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-POOLED-A", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 5000, sample_min_count: 2, sufficiency_upper_bps: 15000, sufficiency_lower_bps: 5000, stratification_mode: "POOLED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250, cure_allowed: true, cure_window_days: 30, cure_eligibility_floor_bps: 5000, circulation_window_days: 180 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_pooled_id: $.data.id }
            - call: "POST /verification-standards"
              payload: { jurisdiction_code: "SOS-STRAT-A", gubernatorial_vote_total: 100, signature_pct_bps: 200, sample_pct_bps: 5000, sample_min_count: 2, sufficiency_upper_bps: 15000, sufficiency_lower_bps: 5000, stratification_mode: "STRATIFIED", county_distribution_pct_bps: 500, required_qualifying_counties: 1, verification_rate_millicents_per_signature: 4750, county_surcharge_bps: 250, cure_allowed: true, cure_window_days: 30, cure_eligibility_floor_bps: 5000, circulation_window_days: 180 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { std_strat_id: $.data.id }
            - call: "POST /counties"
              payload: { county_code: "ALPHA", name: "Alpha County", registered_voter_count: 20 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { alpha_id: $.data.id }
            - call: "POST /counties"
              payload: { county_code: "BRAVO", name: "Bravo County", registered_voter_count: 20 }
              as: SosAdmin
              as_user_id: "admin-1"
              captures: { bravo_id: $.data.id }
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA1", full_name: "Ada Adams", signature_on_file_hash: "H-VA1", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /voter-records"
              payload: { county_id: "${alpha_id}", voter_id_number: "VA2", full_name: "Abe Archer", signature_on_file_hash: "H-VA2", registration_date: "2020-01-01T00:00:00Z", registration_status: "INACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /voter-records"
              payload: { county_id: "${bravo_id}", voter_id_number: "VB1", full_name: "Bea Brooks", signature_on_file_hash: "H-VB1", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /voter-records"
              payload: { county_id: "${bravo_id}", voter_id_number: "VB2", full_name: "Ben Bright", signature_on_file_hash: "H-VB2", registration_date: "2020-01-01T00:00:00Z", registration_status: "ACTIVE" }
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /petitions"
              payload: { standard_id: "${std_pooled_id}", proponent_name: "Pooled Committee", submitted_title: "Pooled Measure", measure_subject_codes: ["EDUCATION"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_p_id: $.data.id }
            - call: "POST /petitions/${pet_p_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_p_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_p_v: $.data.version }
            - call: "PUT /petitions/${pet_p_id}/title-summary"
              payload: { official_title: "Pooled Education Funding Act", official_summary: "Raises school funding statewide.", expected_petition_version: "${pet_p_v}" }
              as: TitleExaminer
              as_user_id: "title-1"
            - call: "POST /petitions/${pet_p_id}/clear-for-circulation"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /petitions"
              payload: { standard_id: "${std_strat_id}", proponent_name: "Stratified Committee", submitted_title: "Stratified Measure", measure_subject_codes: ["EDUCATION"] }
              as: Proponent
              as_user_id: "prop-1"
              captures: { pet_s_id: $.data.id }
            - call: "POST /petitions/${pet_s_id}/submit"
              payload: {}
              as: Proponent
              as_user_id: "prop-1"
            - call: "POST /petitions/${pet_s_id}/format-decision"
              payload: { decision: "APPROVE" }
              as: ElectionsExaminer
              as_user_id: "exam-1"
              captures: { pet_s_v: $.data.version }
            - call: "PUT /petitions/${pet_s_id}/title-summary"
              payload: { official_title: "Stratified Education Funding Act", official_summary: "Raises school funding statewide.", expected_petition_version: "${pet_s_v}" }
              as: TitleExaminer
              as_user_id: "title-1"
            - call: "POST /petitions/${pet_s_id}/clear-for-circulation"
              payload: {}
              as: SosAdmin
              as_user_id: "admin-1"
            - call: "POST /circulators"
