              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-OTHER", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl2: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl2}/items"
              payload: { item_code: "X9", category: "ELECTRICAL", severity: "CRITICAL", pass_criteria: "no stored electrical faults", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl2}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
