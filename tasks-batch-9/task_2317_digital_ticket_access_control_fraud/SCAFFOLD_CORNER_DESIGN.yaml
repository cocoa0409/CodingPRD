  # ===========================================================================
  # Table 2 — State Machines
  # state_machine_shape is parallel (Ticket carries two independent dimensions);
  # the branching, cyclic, cascade, compensation and guarded-transition rows are
  # already owned by §1.8 instances and are recorded here as exclusions.
  # ===========================================================================
  - section: state_machines
    instances:
      - name: event_advance_status_rejects_a_skipped_stage
        claim_type: invalid_transitions
        grounds:
          - state_machines[Event].transitions
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          The Event ladder declares only DRAFT → ON_SALE from DRAFT, so asking for
          IN_PROGRESS from DRAFT is ERR_INVALID_STATE (409) even though IN_PROGRESS is a
          legal target status later; the same request also cannot skip backwards.
        test_recipe:
          setup:
            - "One Event in DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "IN_PROGRESS" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { err_skip: $.data.error_id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "RECONCILED" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { err_terminal: $.data.error_id }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ok_status: $.data.status, ok_ver: $.data.version }
          assert:
            - "${err_skip} == ERR_INVALID_STATE with HTTP 409"
            - "${err_terminal} == ERR_INVALID_STATE with HTTP 409 — RECONCILED is reached only as a system side effect of finalizing a report, never by direct request"
            - "${ok_status} == ON_SALE and ${ok_ver} == 2 — only the accepted transition bumped the version"
            - "Event.${ev_id} was still DRAFT immediately after each rejected call"

      - name: gate_initial_state_and_session_open_side_effects
        claim_type: initial_state
        grounds:
          - state_machines[Gate].initial_state
          - state_machines[Gate].transitions[IDLE_to_SCANNING]
          - state_machines[ScanSession].initial_state
          - endpoints[POST /scan-sessions].side_effects
        distinguishing_aspect: |
          A newly created Gate starts IDLE with admitted_scan_count 0 and
          last_session_closed_at null; opening a session moves the Gate to SCANNING and
          bumps Gate.version (which is why the next session open needs the NEW version),
          while the ScanSession itself starts OPEN with opened_at stamped from the logical
          clock and all three scan counters at 0.
        test_recipe:
          setup:
            - "Event advanced to DOORS_OPEN with AccessZone GA1 and Gate G1; logical clock at 2026-09-12T18:10:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/access-zones"
              payload: { zone_code: "GA1", required_entitlement_level: "GA", fire_code_capacity: 200, face_value_reference_cents: 8750 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { z_id: $.data.id }
            - call: "POST /events/${ev_id}/gates"
              payload: { gate_code: "G1", access_zone_id: "${z_id}", throughput_per_minute: 20, lanes_open: 2 }
              as: VenueAdmin
              as_user_id: "admin-1"
              captures: { g1_id: $.data.id, g1_status0: $.data.status, g1_v: $.data.version, g1_admitted0: $.data.admitted_scan_count }
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "ON_SALE" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events/${ev_id}/advance-status"
              payload: { target_status: "DOORS_OPEN" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:10:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /scan-sessions"
              payload: { gate_id: "${g1_id}", operator_device_id: "SCN-1", mode: "ONLINE", expected_gate_version: "${g1_v}" }
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { s1_id: $.data.id, s1_status: $.data.status, s1_opened: $.data.opened_at, s1_closed: $.data.closed_at, s1_online: $.data.online_scan_count }
            - call: "GET /gates/${g1_id}"
              as: GateOperator
              as_user_id: "gate-op-1"
              captures: { g1_status1: $.data.status, g1_v1: $.data.version }
          assert:
            - "${g1_status0} == IDLE and ${g1_admitted0} == 0 and ${g1_v} == 1 — a fresh Gate is in its declared initial_state"
            - "${s1_status} == OPEN and ${s1_opened} == 2026-09-12T18:10:00Z and ${s1_closed} == null"
            - "${s1_online} == 0 and ScanSession.${s1_id}.offline_uploaded_count == 0 and duplicate_suppressed_count == 0"
            - "${g1_status1} == SCANNING and ${g1_v1} == 2 — opening the session bumped the gate version"
            - "Gate.${g1_id}.last_session_closed_at == null"

      - name: scan_session_second_close_is_rejected_as_a_terminal_state
        claim_type: idempotency
        grounds:
          - state_machines[ScanSession].terminal_states
          - state_machines[Gate].transitions[SCANNING_to_IDLE]
          - endpoints[POST /scan-sessions/{id}/close].side_effects
          - validations[priority=9]
        distinguishing_aspect: |
          CLOSED is a terminal ScanSession state, so replaying close is ERR_INVALID_STATE
          (409) rather than a no-op 200; the first close is also the only thing that sets
          Gate.last_session_closed_at and returns the Gate to IDLE, and the replay must
          not touch either.
        test_recipe:
          setup:
            - "Event DOORS_OPEN with Gate G1; an ONLINE ScanSession opened at 2026-09-12T18:10:00Z; clock advanced to 2026-09-12T18:12:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueAdmin
              as_user_id: "admin-1"
            - call: "POST /events"
              payload:
                name: "Aurora Night"
                venue_name: "Northgate Arena"
                fire_code_capacity: 200
                barcode_anchor_at: "2026-09-12T18:00:00Z"
                doors_open_at: "2026-09-12T18:00:00Z"
                event_start_at: "2026-09-12T19:00:00Z"
                transfer_window_closes_at: "2026-09-12T17:00:00Z"
              as: VenueAdmin
