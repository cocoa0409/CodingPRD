# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3334 adjustable bed / sleep data
# 9 rules x 2 instances. All setup chains start from empty-DB; the logical
# clock defaults to 2026-09-01T00:00:00Z and is pinned explicitly in each
# instance that depends on it.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sleep_score_provisional_vs_final_diverge_on_same_night
        grounds:
          - calculations.sleep_score
          - entities.SleepNight.fields.provisional_score
          - entities.SleepNight.fields.final_score
          - state_machines.SleepNight.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          Same ingested inputs (420 min asleep, 10 restlessness events, 64 bpm)
          produce provisional_score 83 under the 0.6/0.4 rest/duration weights
          but final_score 86 under the 0.5/0.3/0.2 weights that add the heart
          component (heart_component = 96) — a dual-variant calculation on the
          SleepNight entity domain, distinct from the WarrantyClaim domain of
          the sibling instance.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Store, four catalog models, registered customer, completed assessment, confirmed order, scheduled visit, one PAIRED BASE device."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "Flagship", zone_codes: ["941"], default_window_capacity_slots: 4 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "Mattress One", category: "MATTRESS", price_cents: 250000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "BASE-1", name: "Base One", category: "ADJUSTABLE_BASE", price_cents: 180000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "CHAM-1", name: "Chamber One", category: "AIR_CHAMBER", price_cents: 40000, replacement_part_price_cents: 40000, warranty_months: 60 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "PUMP-1", name: "Pump One", category: "PUMP", price_cents: 30000, replacement_part_price_cents: 30000, warranty_months: 36 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "a@x.com", full_name: "Ann A" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "SIDE", weight_band: "OVER_230", partner_sleeper: true, preferred_feel: "FIRM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "MAT-1", qty: 1 }, { sku: "BASE-1", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /sleep/orders/${order_id}/confirm"
              payload: { payment_method: "PAY_IN_FULL" }
              as: SalesAssociate
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-02T08:00:00Z", window_end: "2026-09-02T12:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
            - call: "POST /sleep/delivery-visits"
              payload: { order_id: "${order_id}", delivery_window_id: "${win_id}" }
              as: SalesAssociate
              captures: { visit_id: $.data.id }
            - call: "POST /sleep/devices"
              payload: { order_id: "${order_id}", kind: "BASE", serial_number: "SN-B1", firmware_version: "1.0" }
              as: DeliveryTechnician
              captures: { dev_id: $.data.id }
            - call: "POST /sleep/devices/${dev_id}/pair"
              payload: { target_status: "PAIRED", connectivity_verified: true }
              as: DeliveryTechnician
          trigger:
            - call: "POST /sleep/devices/${dev_id}/sleep-nights"
              payload: { night_date: "2026-09-01", minutes_asleep: 420, restlessness_events: 10, avg_heart_rate: 64 }
              as: DeviceGateway
              captures: { night_id: $.data.id, prov: $.data.provisional_score }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
            - call: "GET /sleep/sleep-nights/${night_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "SleepNight.${night_id}.provisional_score == 83"
            - "SleepNight.${night_id}.final_score == 86"
            - "SleepNight.${night_id}.status == FINAL"
            - "SleepNight.${night_id}.provisional_score != SleepNight.${night_id}.final_score"

      - name: warranty_credit_time_based_vs_nights_used_diverge
        grounds:
          - calculations.prorated_warranty_credit
          - entities.WarrantyClaim.fields.proration_variant
          - entities.WarrantyClaim.fields.credit_cents
        distinguishing_aspect: |
          Same device and service history (12 months in service of a 24-month
          ELECTRONICS warranty, 3 FINAL nights): TIME_BASED yields
          round(12000 * (1 - 12/24)) = 6000, NIGHTS_USED yields
          round(12000 * (1 - 3/720)) = 11950 — a dual-variant calculation on
          the WarrantyClaim entity domain, distinct from the SleepNight domain
          of the sibling instance.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Full delivered order for customer with one PAIRED SENSOR-capable ELECTRONICS-priced device; catalog includes ELECTRONICS model ELEC-1 priced 12000 with replacement_part_price_cents 12000 and warranty_months 24. Device registered, order DELIVERED with trial_verified_at 2026-09-01. Three nights ingested and finalized (final_nights_count == 3). Clock advanced 12*30=360 days to 2027-08-27T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "Flagship", zone_codes: ["941"], default_window_capacity_slots: 4 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "Mattress One", category: "MATTRESS", price_cents: 250000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "BASE-1", name: "Base One", category: "ADJUSTABLE_BASE", price_cents: 180000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "CHAM-1", name: "Chamber One", category: "AIR_CHAMBER", price_cents: 40000, replacement_part_price_cents: 40000, warranty_months: 60 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "PUMP-1", name: "Pump One", category: "PUMP", price_cents: 30000, replacement_part_price_cents: 30000, warranty_months: 36 }
              as: PlatformAdmin
            - call: "POST /sleep/product-models"
              payload: { sku: "ELEC-1", name: "Remote One", category: "ELECTRONICS", price_cents: 12000, replacement_part_price_cents: 12000, warranty_months: 24 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "w@x.com", full_name: "Walt W" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "MAT-1", qty: 1 }, { sku: "ELEC-1", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /sleep/orders/${order_id}/confirm"
              payload: { payment_method: "PAY_IN_FULL" }
              as: SalesAssociate
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
            - call: "POST /sleep/delivery-visits"
              payload: { order_id: "${order_id}", delivery_window_id: "${win_id}" }
              as: SalesAssociate
              captures: { visit_id: $.data.id }
            - call: "POST /sleep/devices"
              payload: { order_id: "${order_id}", kind: "BASE", serial_number: "SN-B1", firmware_version: "1.0" }
              as: DeliveryTechnician
              captures: { dev_id: $.data.id }
            - call: "POST /sleep/devices/${dev_id}/pair"
              payload: { target_status: "PAIRED", connectivity_verified: true }
              as: DeliveryTechnician
            - call: "POST /sleep/delivery-visits/${visit_id}/complete"
              payload: { outcome: "VERIFIED", setup_checklist: { base_assembled: true, chambers_connected: true, remote_configured: true, connectivity_verified: true } }
              as: DeliveryTechnician
            - call: "POST /sleep/devices/${dev_id}/sleep-nights"
              payload: { night_date: "2026-09-01", minutes_asleep: 400, restlessness_events: 5, avg_heart_rate: 62 }
              as: DeviceGateway
            - call: "POST /sleep/devices/${dev_id}/sleep-nights"
              payload: { night_date: "2026-09-02", minutes_asleep: 410, restlessness_events: 6, avg_heart_rate: 63 }
              as: DeviceGateway
            - call: "POST /sleep/devices/${dev_id}/sleep-nights"
              payload: { night_date: "2026-09-03", minutes_asleep: 420, restlessness_events: 7, avg_heart_rate: 64 }
              as: DeviceGateway
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-27T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /sleep/warranty-claims"
              payload: { order_id: "${order_id}", device_id: "${dev_id}", component_category: "ELECTRONICS", proration_variant: "TIME_BASED", description: "remote dead" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_t: $.data.id }
            - call: "POST /sleep/warranty-claims/${claim_t}/review"
              payload: { decision: "APPROVE" }
              as: ServiceAgent
              captures: { credit_t: $.data.credit_cents }
            - call: "POST /sleep/warranty-claims"
              payload: { order_id: "${order_id}", device_id: "${dev_id}", component_category: "ELECTRONICS", proration_variant: "NIGHTS_USED", description: "remote dead again" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_n: $.data.id }
            - call: "POST /sleep/warranty-claims/${claim_n}/review"
              payload: { decision: "APPROVE" }
              as: ServiceAgent
              captures: { credit_n: $.data.credit_cents }
          assert:
            - "WarrantyClaim.${claim_t}.months_in_service == 12"
            - "WarrantyClaim.${claim_t}.credit_cents == 6000"
            - "WarrantyClaim.${claim_n}.final_nights_used == 3"
            - "WarrantyClaim.${claim_n}.credit_cents == 11950"
            - "credit on the same failure history differs by variant: 6000 != 11950"
            - "WarrantyClaim.${claim_n}.applied_to == STORE_CREDIT and Customer.${cust_id}.store_credit_cents == 6000 + 11950 == 17950"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: deferred_interest_minimum_payments_then_retroactive_accrual
        grounds:
          - calculations.financing_schedule
          - calculations.deferred_interest_accrual
          - state_machines.FinancingPlan
        distinguishing_aspect: |
          Combinatorial mode (a): a formula with >= 3 inputs and non-linear
          interaction — offer_type gates BOTH the payment formula
          (ceil(principal*0.03) minimum) AND the promo clock AND the
          retroactive interest branch; paying exactly the minimum for 12 promo
          months leaves balance 153600, and crossing the promo boundary with a
          positive balance posts retro interest 47976 computed on the ORIGINAL
          principal, landing balance at 201576. Distinct mode from the sibling
          instance's nested-rounding (b).
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Order total_due 240000 (single MATTRESS line at 240000: subtotal 240000, no discount, fee 0). DEFERRED_INTEREST plan: term 24, apr_bps 1999, down_payment 0. Note: DEFERRED down-payment floor = round(0.10 * 240000) = 24000, so down_payment_cents is 24000 and principal = 216000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - &mat240
              call: "POST /sleep/product-models"
              payload: { sku: "MAT-240", name: "Mattress 240", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "d@x.com", full_name: "Dee D" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "MAT-240", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, total_due: $.data.total_due_cents }
            - call: "POST /sleep/financing-plans"
              payload: { order_id: "${order_id}", offer_type: "DEFERRED_INTEREST", term_months: 24, apr_bps: 1999, down_payment_cents: 24000 }
              as: FinanceAgent
              captures: { plan_id: $.data.id, monthly: $.data.monthly_payment_cents }
            - call: "POST /sleep/financing-plans/${plan_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /sleep/orders/${order_id}/confirm"
              payload: { payment_method: "FINANCING", financing_plan_id: "${plan_id}" }
              as: SalesAssociate
          trigger:
            - call: "POST /sleep/financing-plans/${plan_id}/payments"
              payload: { amount_cents: 77760 }
              as: FinanceAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /sleep/financing-plans/${plan_id}"
              payload: {}
              as: FinanceAgent
          assert:
            - "FinancingPlan.${plan_id}.principal_cents == 216000"
            - "FinancingPlan.${plan_id}.monthly_payment_cents == 6480  # ceil(216000 * 0.03)"
            - "after one payment of 77760 (= 12 x 6480, exactly the 12 promo minimums): paid_cents == 77760, balance_cents == 138240 before clock crossing"
            - "after clock crosses promo end (activated 2026-09-01 + 12 months = 2027-09-01): retro_interest_posted == true"
            - "retro interest == round_half_up(216000 * 0.1999 * 1) == 43178 (computed on ORIGINAL principal, not remaining balance)"
            - "FinancingPlan.${plan_id}.balance_cents == 138240 + 43178 == 181418"

      - name: restocking_refund_per_line_rounding_then_sum_then_fee
        grounds:
          - calculations.restocking_refund
          - entities.TrialReturn.fields.depreciation_cents
          - entities.TrialReturn.fields.restocking_fee_cents
          - entities.TrialReturn.fields.refund_cents
        distinguishing_aspect: |
          Combinatorial mode (b): nested rounding order is load-bearing and
          pinned — per-line depreciation rounded half-up FIRST, then summed,
          then the restocking fee computed on total_paid, then subtraction.
          Chosen line prices (33333 x 3 bedding lines in DAMAGED condition at
          0.10 each: per-line 3333.3 -> 3333 vs sum-then-round 10000) diverge
          by exactly 1 cent if the order is violated. Distinct mode from the
          sibling instance's multi-input branching (a).
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. DELIVERED order with line_items: 3 x BEDDING at 33333 each (line totals 99999... no: 33333 each = 99999 subtotal, fee 9900 -> total_paid 109899), plus trial active at night 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - &bed33333
              call: "POST /sleep/product-models"
              payload: { sku: "BED-1", name: "Sheets", category: "BEDDING", price_cents: 33333, replacement_part_price_cents: 0, warranty_months: 24 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "r@x.com", full_name: "Ree R" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "SIDE", weight_band: "UNDER_130", partner_sleeper: false, preferred_feel: "PLUSH" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "BED-1", qty: 3 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /sleep/orders/${order_id}/confirm"
              payload: { payment_method: "PAY_IN_FULL" }
              as: SalesAssociate
            - call: "POST /sleep/delivery-windows"
              payload: { store_id: "${store_id}", team_id: "T1", window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z", capacity_slots: 4 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
            - call: "POST /sleep/delivery-visits"
              payload: { order_id: "${order_id}", delivery_window_id: "${win_id}" }
              as: SalesAssociate
              captures: { visit_id: $.data.id }
            - call: "POST /sleep/devices"
              payload: { order_id: "${order_id}", kind: "BASE", serial_number: "SN-R1", firmware_version: "1.0" }
              as: DeliveryTechnician
              captures: { dev_id: $.data.id }
            - call: "POST /sleep/devices/${dev_id}/pair"
              payload: { target_status: "PAIRED", connectivity_verified: true }
              as: DeliveryTechnician
            - call: "POST /sleep/delivery-visits/${visit_id}/complete"
              payload: { outcome: "VERIFIED", setup_checklist: { base_assembled: true, chambers_connected: true, remote_configured: true, connectivity_verified: true } }
              as: DeliveryTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/orders/${order_id}/trial-return"
              payload: { reason: "too soft", refund_destination: "ORIGINAL_PAYMENT" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /sleep/trial-returns/${tr_id}/inspect"
              payload: { outcome: "APPROVED", condition: "DAMAGED" }
              as: ServiceAgent
          assert:
            - "line_items [{sku BED-1, qty 3}] collapses to ONE line: line_total_cents = 3 * 33333 = 99999"
            - "TrialReturn.${tr_id}.depreciation_cents == 10000  # per-line rounding: round_half_up(99999 * 0.10) = 9999.9 -> 10000; a sum-then-round implementation over per-unit 3333.3 values would yield 9999 — the pinned order decides the cent"
            - "TrialReturn.${tr_id}.restocking_fee_cents == 10990  # max(9900, round_half_up(0.10 * 109899)) = max(9900, 10989.9 -> 10990)"
            - "TrialReturn.${tr_id}.refund_cents == 109899 - 10000 - 10990 == 88909"
            - "Order.${order_id}.order_status == RETURNED and payment_status == REFUNDED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_dimensions_payment_and_fulfillment_evolve_independently
        grounds:
          - state_machines.Order
          - entities.Order.fields.order_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity: order_status walks
          PLACED -> CONFIRMED -> FULFILLING -> DELIVERED while payment_status
          walks UNPAID -> FINANCED -> REFUNDED on an independent axis; a later
          return flips payment_status to REFUNDED while order_status continues
          to RETURNED — the two dimensions are asserted at mismatched
          combinations (CONFIRMED x FINANCED, DELIVERED x FINANCED). Distinct
          entity from the sibling's WarrantyClaim cycle.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Financed order confirmed (order_status CONFIRMED x payment_status FINANCED), then delivered via verified visit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sleep/stores"
              payload: { name: "S", zone_codes: ["941"] }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /sleep/product-models"
              payload: { sku: "MAT-1", name: "Mattress One", category: "MATTRESS", price_cents: 240000, replacement_part_price_cents: 0, warranty_months: 120 }
              as: PlatformAdmin
            - call: "POST /sleep/customers"
              payload: { home_store_id: "${store_id}", email: "p@x.com", full_name: "Pat P" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /sleep/fit-assessments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", sleep_position: "BACK", weight_band: "BAND_130_230", partner_sleeper: false, preferred_feel: "MEDIUM" }
              as: SalesAssociate
              captures: { fa_id: $.data.id }
            - call: "POST /sleep/fit-assessments/${fa_id}/complete"
              payload: {}
              as: SalesAssociate
            - call: "POST /sleep/orders"
              payload: { customer_id: "${cust_id}", fit_assessment_id: "${fa_id}", line_items: [{ sku: "MAT-1", qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /sleep/financing-plans"
