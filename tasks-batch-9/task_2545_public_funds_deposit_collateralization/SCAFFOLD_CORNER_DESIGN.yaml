        distinguishing_aspect: "POST /custodians/{id}/approve moves PENDING_APPROVAL -> APPROVED, stamps approved_at from the logical clock and bumps version, and only then may an agreement naming that custodian be circulated."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one PENDING_APPROVAL custodian."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
