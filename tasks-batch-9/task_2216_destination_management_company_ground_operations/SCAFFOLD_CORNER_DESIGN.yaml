        distinguishing_aspect: "A rain plan is only meaningful for an element that declares itself weather dependent, so pointing alternative_for_element_id at an indoor element with is_weather_dependent false is rejected with HTTP 422 on create and again on patch; flipping the target's flag to true makes the identical patch succeed."
