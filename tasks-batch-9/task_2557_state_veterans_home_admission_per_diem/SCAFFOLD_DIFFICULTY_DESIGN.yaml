  - rule_id: combinatorial_formula
    instances:
      - name: per_diem_bed_hold_per_day_rounding_order_pinned
        grounds:
          - calculations.per_diem_claim_amount
          - entities.CareUnit.fields.per_diem_rate_cents
          - entities.PerDiemClaim.fields.bed_hold_day_count
          - entities.CensusDay.fields.payable_rate_cents
        distinguishing_aspect: |
          The bed-hold half rate must be rounded to whole cents PER DAY and only then multiplied by
          the day count: round_half_up(11857 * 5000 / 10000) = 5929, times 3 days = 17787, so the
          claim is 349783. An implementation that multiplies first and rounds the total computes
          round_half_up(17785.5) = 17786 and lands on 349782 — a one-cent divergence that only a
          rate whose half is a .5 fraction combined with an odd bed-hold day count can expose.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome and one CERTIFIED NURSING CareUnit with per_diem_rate_cents 11857."
            - "One Resident admitted 2026-08-01, hospitalized 2026-08-10, readmitted 2026-08-13, so exactly 3 BED_HOLD_DAY rows exist."
            - "A census run through 2026-08-31 has materialised 28 RESIDENT_DAY and 3 BED_HOLD_DAY CensusDay rows."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
