  - rule_id: combinatorial_formula
    instances:
      - name: batch_purchase_price_per_line_rounding_order_mode_b
        grounds:
          - calculations.batch_purchase_price
          - entities.AccessCodeBatch.fields.total_price_cents
          - entities.AccessCodeBatch.fields.quantity_purchased
          - entities.TrainingProvider.fields.credit_balance_cents
          - endpoints[POST /access-code-batches]
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters. A two-line purchase
          [{EXAM_ONLY, 25}, {COURSE_PLUS_EXAM, 1}] combines three independent inputs (per-bundle base
          cents, the per-line volume discount tier, and the jurisdiction surcharge pct 0.045) and both
          lines produce a half-cent surcharge: 85500 * 0.045 = 3847.5 -> 3848 and 8900 * 0.045 = 400.5
          -> 401. The scaffold pins round-per-line-then-sum, giving 98649; the sum-then-round reading
          (94400 * 0.045 = 4248, total 98648) is off by exactly 1 cent, so the assertion discriminates
          the two orders. Note the 25-unit line takes the 0.05 tier while the 1-unit line takes 0.00,
          so a single global discount is also excluded.
        test_recipe:
          setup:
            - "Jurisdiction TX-TRAVIS with exam_fee_surcharge_pct 0.045, provider prepaid with exactly 500000 cents, EN exam form."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"], accepts_remote_proctoring: true, requires_local_registration: true, posting_deadline_days: 30, recert_cycle_months: 60, exam_fee_surcharge_pct: 0.045 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /training-providers"
              payload: { legal_name: "Lone Star Food Safety", jurisdiction_id: "${jur_id}", contact_email: "ops@lonestar.test" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /training-providers/${prov_id}/credit-adjustments"
              payload: { amount_cents: 500000, memo: "prepay-2026" }
              as: PlatformAdmin
            - call: "POST /exam-forms"
              payload: { form_code: "FM-EN-01", version_label: "2026.1", language: "EN", accreditation_body: "ANAB_CFP", scored_item_count: 80, national_cut_score: 70, base_minutes: 120, pretest_item_count: 10, translated_extra_minutes: 30 }
              as: PlatformAdmin
              captures: { form_id: $.data.id }
          trigger:
            - call: "POST /access-code-batches"
              payload: { training_provider_id: "${prov_id}", exam_form_id: "${form_id}", line_items: [{ bundle_type: "EXAM_ONLY", quantity: 25 }, { bundle_type: "COURSE_PLUS_EXAM", quantity: 1 }], expires_at: "2027-06-30T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { batch_id: $.data.id, total: $.data.total_price_cents }
          assert:
            - "AccessCodeBatch.${batch_id}.total_price_cents == 98649 (line 1 = 85500 + 3848 = 89348; line 2 = 8900 + 401 = 9301)"
            - "AccessCodeBatch.${batch_id}.total_price_cents != 98648 — the sum-then-round order is rejected"
            - "AccessCodeBatch.${batch_id}.quantity_purchased == 26 and AccessCodeBatch.${batch_id}.available_count == 26"
            - "AccessCodeBatch.${batch_id}.status == ACTIVE"
            - "TrainingProvider.${prov_id}.lifetime_charged_cents == 98649 and TrainingProvider.${prov_id}.credit_balance_cents == 401351"
      - name: batch_void_refund_tier_keyed_on_gross_mode_c
        grounds:
          - calculations.batch_void_refund
          - entities.AccessCodeBatch.fields.void_gross_credit_cents
          - entities.AccessCodeBatch.fields.void_restock_fee_cents
          - entities.AccessCodeBatch.fields.void_net_credit_cents
          - endpoints[POST /access-code-batches/{id}/void]
          - state_machines.AccessCodeBatch.ACTIVE_to_VOIDED
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order. net = gross - fee,
          while fee comes from a restock tier that a naive reading keys off the credit actually posted.
          The batch is built so the two readings diverge across the 50000 tier boundary: gross = 50683
          (only 683 above the boundary), so keying on gross selects 0.05 -> fee 2534 -> net 48149,
          whereas keying the tier off the net credit would land under 50000, select 0.10, and yield
          fee 5068 / net 45615. Distinct mode from the per-line-rounding instance, and a distinct
          formula (waterfall_allocation on a void, not tiered_pricing on a purchase).
        test_recipe:
          setup:
            - "Jurisdiction TX-TRAVIS (surcharge 0.045) and a provider prepaid 500000 cents."
            - "A batch of line_items [{EXAM_ONLY, 11}, {COURSE_PLUS_EXAM, 1}]: line 1 = 39600 + 1782 = 41382, line 2 = 8900 + 401 = 9301, total_price_cents 50683, quantity_purchased 12, all 12 codes AVAILABLE (nothing assigned), so refundable_units == quantity_purchased and gross == total_price_cents exactly."
          setup_api_calls:
            - call: "POST /jurisdictions"
