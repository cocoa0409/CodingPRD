  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_case_version_on_plan_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-create-stale-case]", "errors[ERR_STALE_CASE_VERSION]", "validations[priority=18]"]
        distinguishing_aspect: "Creating a second plan with a stale expected_case_version (the version observed before the first plan create bumped Case.version) returns ERR_STALE_CASE_VERSION (412)."
        test_recipe:
          setup: ["A FILED Chapter 13 case; one plan has already been created, advancing Case.version. The client re-sends the pre-first-create version."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "OCC Debtor", email: "occ@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_v_stale: $.data.version }
            - call: "POST /plans"
              payload: { case_id: "${case_id}", monthly_payment_cents: 50000, plan_duration_months: 36, expected_case_version: "${case_v_stale}" }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { plan1_id: $.data.id }
          trigger:
            - call: "POST /plans"
              payload: { case_id: "${case_id}", monthly_payment_cents: 60000, plan_duration_months: 36, expected_case_version: "${case_v_stale}" }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /plans .status == 412"
            - "POST /plans .data.error_id == ERR_STALE_CASE_VERSION"

      - name: derived_total_exempt_recomputed_on_schedule_c_add
        claim_type: derived_field_reconciliation
        grounds: [entities.Case.fields.total_exempt_value_cents, endpoints]
        distinguishing_aspect: "Adding two Schedule C rows (250000 then 150000) against a 1000000 Schedule A asset recomputes Case.total_exempt_value_cents to 400000 immediately (before any discharge)."
        test_recipe:
          setup: ["A DRAFT case with a Schedule A asset of 1000000."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Deriv Debtor", email: "deriv@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "A", description: "house", asset_value_cents: 1000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "C", description: "homestead", claimed_exempt_value_cents: 250000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
          trigger:
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "C", description: "wildcard", claimed_exempt_value_cents: 150000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
          assert:
            - "Case.${case_id}.total_exempt_value_cents == 400000"

