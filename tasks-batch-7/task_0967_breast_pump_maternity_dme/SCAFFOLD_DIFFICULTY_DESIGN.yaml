# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index (task 0967)
# 9 Difficulty Rules x >=2 instances each (20 instances total).
# All chains replay against SCAFFOLD.yaml §1.5 verbatim.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_adjudicated_patient_responsibility
        grounds:
          - calculations.provisional_patient_responsibility
          - calculations.adjudication_waterfall
        distinguishing_aspect: |
          Billing-domain dual variant: the provisional estimate freezes list-price allowed
          and qualify-time deductible (patient 30000), while the adjudicated waterfall uses
          the payer's allowed 25000 and remit-time deductible (patient 25000) — identical
          order data, different result.
        test_recipe:
          setup:
            - "Member with COMMERCIAL_PPO policy (deductible 50000, coinsurance 0.20, oop_max 0 = no cap, requires_prior_auth false, prior_auth_threshold_cents 50000)"
            - "STANDARD DOUBLE_ELECTRIC pump at 30000; prescription VERIFIED; order qualified and DELIVERED; claim SUBMITTED by ins-1"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Pat One", email: "p1@x.com", date_of_birth: "1992-03-04", shipping_address: "1 Main St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", requires_prior_auth: false, prior_auth_threshold_cents: 50000, deductible_cents: 50000, coinsurance_pct: 0.2, oop_max_cents: 0 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "1 Main St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_id}", carrier: "UPS", tracking_number: "1Z-1" }
              as: WarehouseOperator
              captures: { sh_id: $.data.id }
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "OUT_FOR_DELIVERY" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
            - call: "POST /dme/claims"
              payload: { pump_order_id: "${o_id}" }
              as: InsuranceSpecialist
              as_user_id: "ins-1"
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /dme/claims/${cl_id}/remit"
              payload: { outcome: "APPROVED", adjudicated_allowed_cents: 25000, insurance_paid_cents: 0, remittance_reference: "REM-1" }
              as: BillingSpecialist
              as_user_id: "bill-1"
          assert:
            - "PumpOrder.${o_id}.provisional_patient_cents == 30000"
            - "Claim.${cl_id}.patient_responsibility_cents == 25000"
            - "Claim.${cl_id}.deductible_applied_cents == 25000"
            - "Claim.${cl_id}.status == ADJUDICATED"
            - "Member.${m_id}.out_of_pocket_balance_cents == 25000"
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 25000"
            - "PumpOrder.${o_id}.billing_status == ADJUDICATED"

      - name: rolling_vs_calendar_anchored_resupply_cadence
        grounds:
          - calculations.resupply_next_eligible_date
        distinguishing_aspect: |
          ResupplySchedule-domain dual variant: with the same delivery anchor 2026-05-01,
          frequency 90, and the same off-cadence fulfillment date 2026-08-10, the ROLLING
          schedule next-eligible is 2026-11-08 while the CALENDAR_ANCHORED schedule snaps
          to the next anchor instant 2026-10-28.
        test_recipe:
          setup:
            - "Two members, each with a delivered pump order; policies identical except schedule_mode (ROLLING vs CALENDAR_ANCHORED, frequency 90)"
            - "Catalog has STANDARD pump 30000 and PART VALVE 500 covered_under_resupply"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PART", name: "Valve", sku: "PART-VALVE", unit_price_cents: 500, covered_under_resupply: true, max_qty_per_frequency: 4 }
              as: PlatformAdmin
              captures: { part_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Roll Mem", email: "roll@x.com", date_of_birth: "1990-01-01", shipping_address: "2 Oak St" }
              as: CareCoordinator
              captures: { m_roll: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Cal Mem", email: "cal@x.com", date_of_birth: "1991-02-02", shipping_address: "3 Pine St" }
              as: CareCoordinator
              captures: { m_cal: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_roll}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", resupply_frequency_days: 90, schedule_mode: "ROLLING" }
              as: PlatformAdmin
              captures: { pol_roll: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_cal}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", resupply_frequency_days: 90, schedule_mode: "CALENDAR_ANCHORED" }
              as: PlatformAdmin
              captures: { pol_cal: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_roll}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_roll: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_cal}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_cal: $.data.id }
            - call: "POST /dme/prescriptions/${rx_roll}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/prescriptions/${rx_cal}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_roll}", policy_id: "${pol_roll}", prescription_id: "${rx_roll}", pump_item_id: "${pump_id}", shipping_address: "2 Oak St" }
              as: CareCoordinator
              captures: { o_roll: $.data.id }
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_cal}", policy_id: "${pol_cal}", prescription_id: "${rx_cal}", pump_item_id: "${pump_id}", shipping_address: "3 Pine St" }
              as: CareCoordinator
              captures: { o_cal: $.data.id }
            - call: "POST /dme/pump-orders/${o_roll}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders/${o_cal}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_roll}", carrier: "UPS", tracking_number: "1Z-R" }
              as: WarehouseOperator
              captures: { sh_roll: $.data.id }
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_cal}", carrier: "UPS", tracking_number: "1Z-C" }
              as: WarehouseOperator
              captures: { sh_cal: $.data.id }
            - call: "POST /dme/shipments/${sh_roll}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_roll}/advance"
              payload: { to_status: "OUT_FOR_DELIVERY" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_roll}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_cal}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_cal}/advance"
              payload: { to_status: "OUT_FOR_DELIVERY" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_cal}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
            - call: "GET /dme/resupply-schedules"
              payload: { member_id: "${m_roll}", catalog_item_id: "${part_id}" }
              as: CareCoordinator
              captures: { sched_roll: "$.data[0].id" }
            - call: "GET /dme/resupply-schedules"
              payload: { member_id: "${m_cal}", catalog_item_id: "${part_id}" }
              as: CareCoordinator
              captures: { sched_cal: "$.data[0].id" }
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dme/resupply-orders"
              payload: { schedule_id: "${sched_roll}", member_id: "${m_roll}", quantity: 1 }
              as: CareCoordinator
            - call: "POST /dme/resupply-orders"
              payload: { schedule_id: "${sched_cal}", member_id: "${m_cal}", quantity: 1 }
              as: CareCoordinator
          assert:
            - "ResupplySchedule.${sched_roll}.last_fulfilled_date == 2026-08-10"
            - "ResupplySchedule.${sched_roll}.next_eligible_date == 2026-11-08"
            - "ResupplySchedule.${sched_cal}.last_fulfilled_date == 2026-08-10"
            - "ResupplySchedule.${sched_cal}.next_eligible_date == 2026-10-28"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: adjudication_waterfall_nested_min_max
        grounds:
          - calculations.adjudication_waterfall
        distinguishing_aspect: |
          Mode (a): four-input waterfall with nested min/max — deductible allocation,
          coinsurance on the remainder, and the OOP-max branch binding: patient is capped
          at 55000 although deductible+coinsurance alone would yield 60000.
        test_recipe:
          setup:
            - "Member with policy deductible 50000 (met 0), coinsurance 0.20, oop_max_cents 55000, no prior auth"
            - "Pump order (30000) qualified and DELIVERED; claim SUBMITTED by ins-1"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Wf Mem", email: "wf@x.com", date_of_birth: "1988-07-07", shipping_address: "4 Elm St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", deductible_cents: 50000, coinsurance_pct: 0.2, oop_max_cents: 55000 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "4 Elm St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/qualify"
              as: InsuranceSpecialist
            - call: "POST /dme/shipments"
              payload: { pump_order_id: "${o_id}", carrier: "UPS", tracking_number: "1Z-W" }
              as: WarehouseOperator
              captures: { sh_id: $.data.id }
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "IN_TRANSIT" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "OUT_FOR_DELIVERY" }
              as: WarehouseOperator
            - call: "POST /dme/shipments/${sh_id}/advance"
              payload: { to_status: "DELIVERED" }
              as: WarehouseOperator
            - call: "POST /dme/claims"
              payload: { pump_order_id: "${o_id}" }
              as: InsuranceSpecialist
              as_user_id: "ins-1"
              captures: { cl_id: $.data.id }
          trigger:
            - call: "POST /dme/claims/${cl_id}/remit"
              payload: { outcome: "APPROVED", adjudicated_allowed_cents: 100000, insurance_paid_cents: 45000 }
              as: BillingSpecialist
              as_user_id: "bill-1"
          assert:
            - "Claim.${cl_id}.deductible_applied_cents == 50000"
            - "Claim.${cl_id}.patient_responsibility_cents == 55000"
            - "Claim.${cl_id}.status == ADJUDICATED"
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 50000"
            - "Member.${m_id}.oop_accumulated_cents == 55000"
            - "Member.${m_id}.out_of_pocket_balance_cents == 55000"

      - name: per_line_rounding_then_sum_bundle_discount
        grounds:
          - calculations.order_line_pricing
          - calculations.bundle_discount
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned per-line-then-sum. Two garment lines at
          4995 each discount to round_half_up(499.5)=500 per line, total 1000; the unpinned
          sum-then-round alternative would give 999 — the scaffold requires 1000.
        test_recipe:
          setup:
            - "Catalog: STANDARD pump 30000; garment GARMENT-C at 4995; policy garment_allowance 4"
            - "Order created (PENDING_QUALIFICATION) with primary pump line"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/catalog-items"
              payload: { item_type: "COMPRESSION_GARMENT", name: "GarmentC", sku: "GAR-C", unit_price_cents: 4995 }
              as: PlatformAdmin
              captures: { gar_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Round Mem", email: "round@x.com", date_of_birth: "1993-05-05", shipping_address: "5 Birch St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", garment_allowance_per_period: 4 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "5 Birch St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /dme/pump-orders/${o_id}/lines"
              payload: { catalog_item_id: "${gar_id}", quantity: 1 }
              as: CareCoordinator
              captures: { line1: $.data.id }
            - call: "POST /dme/pump-orders/${o_id}/lines"
              payload: { catalog_item_id: "${gar_id}", quantity: 1 }
              as: CareCoordinator
              captures: { line2: $.data.id }
          assert:
            - "OrderLine.${line1}.line_total_cents == 4995"
            - "OrderLine.${line1}.discount_cents == 500"
            - "OrderLine.${line2}.discount_cents == 500"
            - "PumpOrder.${o_id}.merchandise_subtotal_cents == 39990"
            - "PumpOrder.${o_id}.discount_total_cents == 1000"
            - "PumpOrder.${o_id}.order_total_cents == 38990"

      - name: bundle_discount_circular_evaluation_order
        grounds:
          - calculations.bundle_discount
        distinguishing_aspect: |
          Mode (c): the bundle tier is keyed on the pre-discount subtotal that itself
          contains the garment lines (15000 pump + 6000 garment = 21000 >= 20000). The
          pinned evaluation order qualifies the discount; evaluating the tier after
          discounting (20400 -> garment excluded or post-discount base) would deny it.
        test_recipe:
          setup:
            - "Catalog: STANDARD pump PUMP-CHEAP at 15000; garment GARMENT-A at 6000; policy garment_allowance 4"
            - "Order created with primary pump line (15000); subtotal without garments is 15000 < 20000"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "CheapPump", sku: "PUMP-CHEAP", unit_price_cents: 15000, insurance_tier: "STANDARD", pump_type: "SINGLE_ELECTRIC", warranty_months: 6 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/catalog-items"
              payload: { item_type: "COMPRESSION_GARMENT", name: "GarmentA", sku: "GAR-A", unit_price_cents: 6000 }
              as: PlatformAdmin
              captures: { gar_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Circ Mem", email: "circ@x.com", date_of_birth: "1994-06-06", shipping_address: "6 Cedar St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", garment_allowance_per_period: 4 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "SINGLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/pump-orders"
              payload: { member_id: "${m_id}", policy_id: "${pol_id}", prescription_id: "${rx_id}", pump_item_id: "${pump_id}", shipping_address: "6 Cedar St" }
              as: CareCoordinator
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /dme/pump-orders/${o_id}/lines"
              payload: { catalog_item_id: "${gar_id}", quantity: 1 }
              as: CareCoordinator
              captures: { line1: $.data.id }
          assert:
            - "PumpOrder.${o_id}.merchandise_subtotal_cents == 21000"
            - "OrderLine.${line1}.discount_cents == 600"
            - "PumpOrder.${o_id}.discount_total_cents == 600"
            - "PumpOrder.${o_id}.order_total_cents == 20400"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: pump_order_parallel_fulfillment_and_billing_dimensions
        grounds:
          - state_machines.PumpOrder
          - state_machines.PumpOrderBilling
        distinguishing_aspect: |
          Parallel shape on PumpOrder: fulfillment_status and billing_status evolve
          independently — creating a PA moves billing UNBILLED -> AUTH_PENDING while
          fulfillment stays QUALIFIED; approving the PA moves billing to AUTH_APPROVED
          while fulfillment is still QUALIFIED; shipping then moves only fulfillment.
        test_recipe:
          setup:
            - "Policy requires_prior_auth true; pump 30000; order QUALIFIED"
          setup_api_calls:
            - call: "POST /dme/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dme/catalog-items"
              payload: { item_type: "PUMP", name: "StdPump", sku: "PUMP-STD", unit_price_cents: 30000, insurance_tier: "STANDARD", pump_type: "DOUBLE_ELECTRIC", warranty_months: 12 }
              as: PlatformAdmin
              captures: { pump_id: $.data.id }
            - call: "POST /dme/members"
              payload: { full_name: "Par Mem", email: "par@x.com", date_of_birth: "1990-08-08", shipping_address: "7 Ash St" }
              as: CareCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /dme/policies"
              payload: { member_id: "${m_id}", payer_name: "PayerX", plan_type: "COMMERCIAL_PPO", benefit_period_start: "2026-01-01", benefit_period_end: "2027-01-01", requires_prior_auth: true }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /dme/prescriptions"
              payload: { member_id: "${m_id}", diagnosis_code: "Z39.1", pump_type: "DOUBLE_ELECTRIC", issued_date: "2026-04-15", expiration_date: "2026-10-01" }
              as: CareCoordinator
              captures: { rx_id: $.data.id }
            - call: "POST /dme/prescriptions/${rx_id}/verify"
              as: InsuranceSpecialist
            - call: "POST /dme/pump-orders"
