# =============================================================================
# Task 2022 — Broker Price Opinion & Valuation Services (BPO/valuation vendor)
# Scaffold (§1.0–§1.7)
# =============================================================================

scenario: |
  2022. Broker Price Opinion & Valuation Services (BPO/valuation vendor): order intake & property/geography assignment to broker, comparable selection rules & adjustment guidance, photo/inspection level (drive-by vs interior) requirements, quality control review & revision cycle, turnaround SLA & client scorecard, licensing restrictions by state (BPO vs appraisal), fee schedule & payment, order volume forecasting

domain_name: broker-price-opinion-valuation
api_prefix: /bpo

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - { name: client_code, type: string, source: input, description: "Globally unique client code (uppercase alphanumeric, 3–12 chars)", constraints: "unique; regex ^[A-Z0-9]{3,12}$" }
      - { name: display_name, type: string, source: input, description: "Human-readable client name" }
      - { name: sla_hours_standard, type: integer, source: input, description: "Standard turnaround SLA in whole hours; must be >= 24 and <= 240" }
      - { name: sla_hours_rush, type: integer, source: input, description: "Rush turnaround SLA in whole hours; must be >= 4 and < sla_hours_standard" }
      - { name: late_penalty_bps_per_day, type: integer, source: input, description: "Late-fee penalty charged to vendor in basis points of fee per calendar day past SLA, 0..2000", default: 250 }
      - { name: scorecard_weight_turnaround, type: number, source: input, description: "Weight (0..1) of turnaround component in client scorecard", default: 0.5 }
      - { name: scorecard_weight_quality, type: number, source: input, description: "Weight (0..1) of quality component in client scorecard", default: 0.3 }
      - { name: scorecard_weight_revision, type: number, source: input, description: "Weight (0..1) of revision-rate component in client scorecard", default: 0.2 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED", default: ACTIVE }

  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: broker_code, type: string, source: input, description: "Globally unique broker code (uppercase alphanumeric, 3–12 chars)", constraints: "unique; regex ^[A-Z0-9]{3,12}$" }
      - { name: full_name, type: string, source: input, description: "Broker legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique" }
      - { name: max_concurrent_orders, type: integer, source: input, description: "Maximum orders this broker may hold in ASSIGNED or IN_PROGRESS at once; 1..50" }
      - { name: status, type: enum, source: system, description: "PENDING_ONBOARDING → ACTIVE → SUSPENDED | TERMINATED", default: PENDING_ONBOARDING }
      - { name: composite_score, type: number, source: computed, description: "Read-only weighted composite score (0..100) recomputed on every QC verdict and SLA breach" }

  - name: BrokerLicense
    parent: Broker
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; owning broker" }
      - { name: state_code, type: string, source: input, description: "US state code (2 uppercase letters)" }
      - { name: license_kind, type: enum, source: input, description: "BPO | APPRAISAL — kinds of valuation the broker may perform in this state" }
      - { name: license_number, type: string, source: input, description: "Issuing-body license number" }
      - { name: expires_on, type: datetime, source: input, description: "License expiry (ISO 8601 UTC date-time)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED | REVOKED", default: ACTIVE }

  - name: StateRegulation
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "US state code; unique", constraints: "unique" }
      - { name: bpo_permitted, type: boolean, source: input, description: "Whether non-appraisal BPO reports may be issued in this state" }
      - { name: appraisal_required_for_interior, type: boolean, source: input, description: "Whether interior-inspection orders must be performed by an APPRAISAL-licensed broker" }
      - { name: min_driveby_radius_miles, type: number, source: input, description: "Minimum radius (miles) within which a comparable must sit to count toward drive-by minimum", default: 1.0 }
      - { name: min_interior_radius_miles, type: number, source: input, description: "Minimum radius (miles) for interior-inspection comps", default: 0.5 }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: street_address, type: string, source: input, description: "Street address" }
      - { name: city, type: string, source: input, description: "City" }
      - { name: state_code, type: string, source: input, description: "US state (2 uppercase letters)" }
      - { name: postal_code, type: string, source: input, description: "ZIP code" }
      - { name: living_area_sqft, type: integer, source: input, description: "Gross living area in square feet; > 0" }
      - { name: lot_area_sqft, type: integer, source: input, description: "Lot area in square feet; > 0" }
      - { name: year_built, type: integer, source: input, description: "Year property was built; 1700..2100" }
      - { name: property_type, type: enum, source: input, description: "SINGLE_FAMILY | CONDO | TOWNHOME | MULTI_FAMILY | MANUFACTURED" }
      - { name: status, type: enum, source: system, description: "REGISTERED | ARCHIVED", default: REGISTERED }

  - name: ValuationOrder
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id; ordering client" }
      - { name: property_id, type: string, source: system, description: "FK -> Property.id; subject property" }
      - { name: assigned_broker_id, type: string, source: computed, description: "FK -> Broker.id; currently assigned broker (null until dispatch)" }
      - { name: order_kind, type: enum, source: input, description: "BPO | APPRAISAL — valuation product ordered" }
      - { name: inspection_level, type: enum, source: input, description: "DRIVE_BY | INTERIOR" }
      - { name: priority, type: enum, source: input, description: "STANDARD | RUSH", default: STANDARD }
      - { name: agreed_fee_cents, type: integer, source: input, description: "Gross fee agreed with client, integer cents, 100..1_000_000" }
      - { name: sla_due_at, type: datetime, source: computed, description: "Read-only ISO 8601 UTC due timestamp; computed from priority at DISPATCHED" }
      - { name: completed_at, type: datetime, source: computed, description: "Read-only UTC timestamp when order transitioned to COMPLETED" }
      - { name: days_late, type: integer, source: computed, description: "Read-only; 0 if completed on or before sla_due_at; else floor((completed_at - sla_due_at)/86400) rounded half-up to whole days" }
      - { name: late_penalty_cents, type: integer, source: computed, description: "Read-only; computed from late_penalty formula on completion" }
      - { name: net_payable_cents, type: integer, source: computed, description: "Read-only; broker-net payout after vendor late-fee retention" }
      - { name: fulfillment_status, type: enum, source: system, description: "INTAKE | READY_FOR_DISPATCH | DISPATCHED | IN_PROGRESS | REPORT_SUBMITTED | QC_REVIEW | REVISION_REQUESTED | ACCEPTED | COMPLETED | CANCELLED | REJECTED", default: INTAKE }
      - { name: payment_status, type: enum, source: system, description: "UNBILLED | INVOICED | PAID | PARTIALLY_PAID | WAIVED", default: UNBILLED }
      - { name: revision_count, type: integer, source: computed, description: "Read-only count of QCRevisionRequest rows for this order; starts at 0" }
      - { name: is_rush_breach, type: boolean, source: computed, description: "Read-only; true iff priority==RUSH and completed_at > sla_due_at" }

  - name: Comparable
    parent: ValuationOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ValuationOrder.id; parent order" }
      - { name: source_property_id, type: string, source: input, description: "FK -> Property.id; the comparable property referenced" }
      - { name: sale_price_cents, type: integer, source: input, description: "Comparable sale price in cents; > 0" }
      - { name: sale_date, type: datetime, source: input, description: "Comparable sale date (ISO 8601 UTC)" }
      - { name: distance_miles, type: number, source: input, description: "Distance from subject property in miles, 2-decimal half-up; 0.01..100.00" }
      - { name: adjustment_cents, type: integer, source: input, description: "Total signed adjustment applied to comp sale price to align with subject, integer cents" }
      - { name: adjusted_value_cents, type: integer, source: computed, description: "Read-only = sale_price_cents + adjustment_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | SELECTED | REJECTED", default: DRAFT }

  - name: PhotoEvidence
    parent: ValuationOrder
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ValuationOrder.id; parent order" }
      - { name: photo_kind, type: enum, source: input, description: "FRONT | REAR | STREET | INTERIOR_LIVING | INTERIOR_KITCHEN | INTERIOR_BATH | DEFECT | OTHER" }
      - { name: file_url, type: string, source: input, description: "URL of uploaded photo" }
      - { name: captured_at, type: datetime, source: input, description: "UTC timestamp the photo was captured (must be >= order creation and <= now)" }
      - { name: uploaded_by_broker_id, type: string, source: system, description: "FK -> Broker.id; broker who uploaded" }

  - name: FeeLine
    parent: ValuationOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ValuationOrder.id; parent order" }
      - { name: fee_kind, type: enum, source: input, description: "BASE | RUSH_SURCHARGE | INTERIOR_SURCHARGE | APPRAISAL_SURCHARGE | TRAVEL | MISC" }
      - { name: description, type: string, source: input, description: "Short line description" }
      - { name: amount_cents, type: integer, source: input, description: "Signed integer cents; may be negative for credits" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | CANCELLED", default: DRAFT }

  - name: QCReview
    parent: ValuationOrder
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ValuationOrder.id; parent order" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the QCReviewer who performed review (opaque id string)" }
      - { name: cycle_index, type: integer, source: computed, description: "1 for the first review on this order, incremented per cycle" }
      - { name: verdict, type: enum, source: input, description: "APPROVE | REVISE | REJECT" }
      - { name: defects_found, type: integer, source: input, description: "Count of defects cited; >= 0" }
      - { name: notes, type: string, source: input, description: "Free-text reviewer notes" }
      - { name: reviewed_at, type: datetime, source: computed, description: "UTC timestamp when verdict was recorded" }
      - { name: is_segregation_violation, type: boolean, source: computed, description: "Read-only; true iff reviewer_id equals the assigned broker's broker_code-derived opaque id (recorded for audit; verdict still rejected)" }

  - name: QCRevisionRequest
    parent: ValuationOrder
    common_fields: false
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ValuationOrder.id; parent order" }
      - { name: qc_review_id, type: string, source: system, description: "FK -> QCReview.id; review that produced this revision request" }
      - { name: cycle_index, type: integer, source: computed, description: "Matches QCReview.cycle_index" }
      - { name: reason, type: string, source: input, description: "Free-text revision reason" }
      - { name: due_at, type: datetime, source: computed, description: "Read-only; = reviewed_at + REVISION_WINDOW_HOURS" }
      - { name: resolved_at, type: datetime, source: computed, description: "UTC timestamp when broker resubmitted (null until resubmission)" }
      - { name: outcome, type: enum, source: system, description: "OPEN | RESOLVED_ON_TIME | RESOLVED_LATE | EXPIRED", default: OPEN }

  - name: PayoutBatch
    parent: null
    common_fields: true
    fields:
      - { name: broker_id, type: string, source: input, description: "FK -> Broker.id; batch recipient" }
      - { name: period_start, type: datetime, source: input, description: "ISO 8601 UTC inclusive period start" }
      - { name: period_end, type: datetime, source: input, description: "ISO 8601 UTC exclusive period end; must be > period_start" }
      - { name: total_payable_cents, type: integer, source: computed, description: "Read-only; sum of ValuationOrder.net_payable_cents for orders COMPLETED with completed_at in [period_start, period_end) and assigned_broker_id == broker_id" }
      - { name: order_count, type: integer, source: computed, description: "Read-only; count of orders contributing to total_payable_cents" }
      - { name: status, type: enum, source: system, description: "OPEN → APPROVED → DISBURSED | VOIDED", default: OPEN }

  - name: VolumeForecast
    parent: null
    common_fields: false
    fields:
      - { name: state_code, type: string, source: input, description: "US state code the forecast covers" }
      - { name: forecast_month, type: string, source: input, description: "YYYY-MM month bucket the forecast predicts" }
      - { name: predicted_order_count, type: integer, source: computed, description: "Read-only; predicted orders for this state+month using forecasting rule" }
      - { name: model_version, type: string, source: system, description: "Forecast model identifier, e.g. VWMA-3m-v1" }
      - { name: generated_at, type: datetime, source: computed, description: "UTC timestamp at forecast generation" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ValuationOrder
    initial_state: INTAKE
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: INTAKE
        to: READY_FOR_DISPATCH
        trigger: "POST /bpo/valuation-orders/{id}/submit"
        actor: ClientAdmin
        preconditions:
          - "ValuationOrder.property_id references a Property in status REGISTERED (ERR_PROPERTY_NOT_REGISTERED)"
          - "StateRegulation for Property.state_code must be in status ACTIVE (ERR_STATE_REGULATION_SUSPENDED)"
          - "If order_kind == BPO then StateRegulation.bpo_permitted must be true (ERR_BPO_NOT_PERMITTED)"
          - "If inspection_level == INTERIOR and StateRegulation.appraisal_required_for_interior is true then order_kind must be APPRAISAL (ERR_INTERIOR_REQUIRES_APPRAISAL)"
          - "agreed_fee_cents must be >= 100 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Validate comparable-count floor against state minimums (no-op here, re-checked at report submit)"

      - from: READY_FOR_DISPATCH
        to: DISPATCHED
        trigger: "POST /bpo/valuation-orders/{id}/dispatch"
        actor: DispatchCoordinator
        preconditions:
          - "ValuationOrder.assigned_broker_id must be null (ERR_ORDER_ALREADY_DISPATCHED)"
          - "Selected broker.status must be ACTIVE (ERR_BROKER_NOT_ACTIVE)"
          - "Selected broker holds ACTIVE BrokerLicense for Property.state_code whose license_kind >= order_kind (APPRAISAL covers BPO and APPRAISAL; BPO covers only BPO) and expires_on > now (ERR_LICENSE_NOT_VALID_FOR_STATE)"
          - "Selected broker's count of orders in {DISPATCHED, IN_PROGRESS, REPORT_SUBMITTED, QC_REVIEW, REVISION_REQUESTED} < max_concurrent_orders (ERR_BROKER_CAPACITY_FULL)"
          - "expected_order_version request-body field matches ValuationOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "assigned_broker_id := request broker_id"
          - "sla_due_at := now + (sla_hours_standard if priority==STANDARD else sla_hours_rush) hours (from owning ClientAccount)"
          - "Broker.open_order_count incremented"
          - "Increments ValuationOrder.version by 1"

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /bpo/valuation-orders/{id}/accept"
        actor: Broker
        preconditions:
          - "X-User-ID must equal ValuationOrder.assigned_broker_id (ERR_FORBIDDEN)"
          - "Order must currently be DISPATCHED (ERR_INVALID_STATE)"
        side_effects:
          - "Start inspection clock (no durable field; used for SLA scoring)"
          - "Increments ValuationOrder.version by 1"

      - from: DISPATCHED
        to: READY_FOR_DISPATCH
        trigger: "POST /bpo/valuation-orders/{id}/decline"
        actor: Broker
        preconditions:
          - "X-User-ID must equal ValuationOrder.assigned_broker_id (ERR_FORBIDDEN)"
        side_effects:
          - "assigned_broker_id := null"
          - "Broker.open_order_count decremented"
          - "Broker decline_count incremented (used in composite_score)"
          - "Increments ValuationOrder.version by 1"

      - from: IN_PROGRESS
        to: REPORT_SUBMITTED
        trigger: "POST /bpo/valuation-orders/{id}/report"
        actor: Broker
        preconditions:
          - "X-User-ID must equal ValuationOrder.assigned_broker_id (ERR_FORBIDDEN)"
          - "Comparable count in {SELECTED} on this order must satisfy state minimum (3 for DRIVE_BY, 4 for INTERIOR) (ERR_INSUFFICIENT_COMPARABLES)"
          - "For inspection_level == DRIVE_BY, count of PhotoEvidence rows with photo_kind IN {FRONT, STREET} must be >= 2 (ERR_INSUFFICIENT_PHOTOS)"
          - "For inspection_level == INTERIOR, count of PhotoEvidence rows with photo_kind IN {INTERIOR_LIVING, INTERIOR_KITCHEN, INTERIOR_BATH} must be >= 3 (one of each) (ERR_INSUFFICIENT_PHOTOS)"
          - "Sum of FeeLine.amount_cents for status != CANCELLED must equal ValuationOrder.agreed_fee_cents (ERR_FEE_RECONCILE_MISMATCH)"
        side_effects:
          - "Trigger recompute of Comparable.adjusted_value_cents for all SELECTED comparables"
          - "Increments ValuationOrder.version by 1"

      - from: REPORT_SUBMITTED
        to: QC_REVIEW
        trigger: "POST /bpo/valuation-orders/{id}/qc/open"
        actor: QCReviewer
        preconditions:
          - "No OPEN QCReview cycle exists for this order (ERR_QC_CYCLE_ALREADY_OPEN)"
        side_effects:
          - "Create QCReview row with cycle_index = (max prior cycle_index) + 1"
          - "Increments ValuationOrder.version by 1"

      - from: QC_REVIEW
        to: ACCEPTED
        trigger: "POST /bpo/valuation-orders/{id}/qc/{qc_id}/verdict (verdict=APPROVE)"
        actor: QCReviewer
        preconditions:
          - "QCReview.cycle_index must equal the latest cycle for the order (ERR_QC_CYCLE_STALE)"
          - "QCReviewer X-User-ID must NOT equal ValuationOrder.assigned_broker_id mapped to the broker's opaque id (segregation of duties) (ERR_SEGREGATION_OF_DUTIES)"
          - "defects_found must be 0 for APPROVE (ERR_INVALID_REQUEST)"
        side_effects:
          - "Set QCReview.reviewed_at := now"
          - "Trigger broker composite_score recompute (quality component += 1.0, weighted by client scorecard_weight_quality)"
          - "Increments ValuationOrder.version by 1"

      - from: QC_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /bpo/valuation-orders/{id}/qc/{qc_id}/verdict (verdict=REVISE)"
        actor: QCReviewer
        preconditions:
          - "QCReview.cycle_index must equal the latest cycle (ERR_QC_CYCLE_STALE)"
          - "QCReviewer X-User-ID must NOT equal ValuationOrder.assigned_broker_id's opaque id (ERR_SEGREGATION_OF_DUTIES)"
          - "defects_found must be >= 1 for REVISE (ERR_INVALID_REQUEST)"
        side_effects:
          - "Create QCRevisionRequest row with cycle_index == QCReview.cycle_index, due_at := now + REVISION_WINDOW_HOURS"
          - "ValuationOrder.revision_count += 1"
          - "Set QCReview.reviewed_at := now"
          - "Increments ValuationOrder.version by 1"

      - from: QC_REVIEW
        to: REJECTED
        trigger: "POST /bpo/valuation-orders/{id}/qc/{qc_id}/verdict (verdict=REJECT)"
        actor: QCReviewer
        preconditions:
          - "QCReview.cycle_index must equal the latest cycle (ERR_QC_CYCLE_STALE)"
          - "QCReviewer X-User-ID must NOT equal ValuationOrder.assigned_broker_id's opaque id (ERR_SEGREGATION_OF_DUTIES)"
          - "defects_found must be >= 3 for REJECT (ERR_INVALID_REQUEST)"
        side_effects:
          - "Set QCReview.reviewed_at := now"
          - "Trigger broker composite_score recompute (quality component += 0.0 for this order)"
          - "Broker.open_order_count decremented"
          - "Cancel all FeeLine rows in DRAFT status (CONFIRMED fee lines remain for audit)"
          - "Increments ValuationOrder.version by 1"

      - from: REVISION_REQUESTED
        to: REPORT_SUBMITTED
        trigger: "POST /bpo/valuation-orders/{id}/revision/{rev_id}/resubmit"
        actor: Broker
        preconditions:
          - "X-User-ID must equal ValuationOrder.assigned_broker_id (ERR_FORBIDDEN)"
          - "QCRevisionRequest.outcome must be OPEN (ERR_REVISION_NOT_OPEN)"
        side_effects:
          - "QCRevisionRequest.resolved_at := now"
          - "QCRevisionRequest.outcome := RESOLVED_ON_TIME if now <= due_at else RESOLVED_LATE"
          - "If RESOLVED_LATE, trigger broker composite_score recompute (turnaround component degraded)"
          - "Increments ValuationOrder.version by 1"

      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /bpo/valuation-orders/{id}/complete"
        actor: OperationsManager
        preconditions:
          - "ValuationOrder.fulfillment_status must be ACCEPTED (ERR_INVALID_STATE)"
          - "All QCRevisionRequest rows for the order must have outcome != OPEN (ERR_OPEN_REVISION_EXISTS)"
        side_effects:
          - "completed_at := now"
          - "Compute days_late := max(0, floor((completed_at - sla_due_at) / 86400)) rounding half-up to whole days"
          - "Compute late_penalty_cents via late_fee calculation"
          - "Compute net_payable_cents := agreed_fee_cents - late_penalty_cents (floored at 0)"
          - "Broker.open_order_count decremented"
          - "Trigger broker composite_score recompute (turnaround component based on is_rush_breach and days_late)"
          - "Increments ValuationOrder.version by 1"

      - from: INTAKE
        to: CANCELLED
        trigger: "POST /bpo/valuation-orders/{id}/cancel"
        actor: ClientAdmin
        preconditions:
          - "Order must be in INTAKE (ERR_INVALID_STATE)"
        side_effects:
          - "Cancel any DRAFT Comparable and DRAFT FeeLine rows (set status := CANCELLED)"
          - "Increments ValuationOrder.version by 1"

      - from: READY_FOR_DISPATCH
        to: CANCELLED
        trigger: "POST /bpo/valuation-orders/{id}/cancel"
        actor: ClientAdmin
        preconditions:
          - "Order must be in READY_FOR_DISPATCH (ERR_INVALID_STATE)"
        side_effects:
          - "Same cascade as INTAKE → CANCELLED"
          - "Increments ValuationOrder.version by 1"

      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /bpo/valuation-orders/{id}/cancel"
        actor: ClientAdmin
        preconditions:
          - "Order must be in DISPATCHED (ERR_INVALID_STATE)"
        side_effects:
          - "assigned_broker_id := null; Broker.open_order_count decremented; Broker decline_count NOT incremented (cancellation is not a decline)"
          - "Same cascade as INTAKE → CANCELLED"
          - "Increments ValuationOrder.version by 1"

  - entity: Broker
    initial_state: PENDING_ONBOARDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_ONBOARDING
        to: ACTIVE
        trigger: "POST /bpo/brokers/{id}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "Broker holds at least one BrokerLicense row with status == ACTIVE and expires_on > now (ERR_NO_ACTIVE_LICENSE)"
        side_effects:
          - "Increments Broker.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /bpo/brokers/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Broker.composite_score < SUSPEND_THRESHOLD or ComplianceOfficer override (no additional precondition)"
        side_effects:
          - "All orders assigned to this broker in {DISPATCHED} revert to READY_FOR_DISPATCH with assigned_broker_id := null"
          - "All orders assigned to this broker in {IN_PROGRESS, REPORT_SUBMITTED, QC_REVIEW, REVISION_REQUESTED} remain but block dispatch of new orders to this broker"
          - "Increments Broker.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /bpo/brokers/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "No order assigned to this broker is in REVISION_REQUESTED with a QCRevisionRequest.outcome == OPEN and due_at < now (ERR_OVERDUE_REVISION_BLOCKS_REINSTATE)"
        side_effects:
          - "Increments Broker.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /bpo/brokers/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "No order assigned to this broker in {DISPATCHED, IN_PROGRESS, REPORT_SUBMITTED, QC_REVIEW, REVISION_REQUESTED, ACCEPTED} (ERR_OPEN_ORDERS_EXIST)"
        side_effects:
          - "All BrokerLicense rows for this broker transition to REVOKED"
          - "Increments Broker.version by 1"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /bpo/brokers/{id}/terminate"
        actor: ComplianceOfficer
        preconditions:
          - "No order assigned to this broker in {DISPATCHED, IN_PROGRESS, REPORT_SUBMITTED, QC_REVIEW, REVISION_REQUESTED, ACCEPTED} (ERR_OPEN_ORDERS_EXIST)"
        side_effects:
          - "All BrokerLicense rows for this broker transition to REVOKED"
          - "Increments Broker.version by 1"

  - entity: PayoutBatch
    initial_state: OPEN
    terminal_states: [DISBURSED, VOIDED]
    transitions:
      - from: OPEN
        to: APPROVED
        trigger: "POST /bpo/payout-batches/{id}/approve"
        actor: BillingClerk
        preconditions:
          - "order_count must be >= 1 (ERR_EMPTY_BATCH)"
          - "expected_batch_version request-body field matches PayoutBatch.version (ERR_STALE_VERSION)"
        side_effects:
          - "Snapshot total_payable_cents (no further recompute)"
          - "Increments PayoutBatch.version by 1"

      - from: APPROVED
        to: DISBURSED
        trigger: "POST /bpo/payout-batches/{id}/disburse"
        actor: BillingClerk
        preconditions:
          - "All contributing orders must still be in COMPLETED state (ERR_ORDER_NOT_COMPLETED)"
        side_effects:
          - "For each contributing ValuationOrder, set payment_status := PAID (or PARTIALLY_PAID if external partial-payment flag set — out of scope; always PAID here)"
          - "Increments PayoutBatch.version by 1"

      - from: OPEN
        to: VOIDED
        trigger: "POST /bpo/payout-batches/{id}/void"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "Increments PayoutBatch.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-dispatch-stale-version
    parent_entity: ValuationOrder
    write_endpoint: "POST /bpo/valuation-orders/{id}/dispatch"
    occ_field: "expected_order_version"
    description: |
      Dispatching a ValuationOrder whose version has advanced since the
      client last observed it is rejected. Captures the case where another
      dispatcher legitimately dispatched the same order moments earlier
      (which itself increments ValuationOrder.version) and the current
      writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payout-approve-stale-version
    parent_entity: PayoutBatch
    write_endpoint: "POST /bpo/payout-batches/{id}/approve"
    occ_field: "expected_batch_version"
    description: |
      Approving a PayoutBatch whose version has advanced since the client
      last observed it is rejected. Two clerks racing to approve the same
      OPEN batch would otherwise double-snapshot total_payable_cents; the
      stale writer is rejected on OCC.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: late_fee
    trigger: "On ValuationOrder ACCEPTED → COMPLETED transition"
    algorithm: threshold
    formula: |
      days_late := max(0, round_half_up((completed_at - sla_due_at) / 86400))
      if days_late == 0: late_penalty_cents = 0
      else:
        bps_per_day := ClientAccount.late_penalty_bps_per_day
        raw_penalty := agreed_fee_cents * bps_per_day * days_late / 10000
        late_penalty_cents := min(round_half_up(raw_penalty), agreed_fee_cents)
      net_payable_cents := agreed_fee_cents - late_penalty_cents
    input_set: "The completing ValuationOrder row + its ClientAccount.late_penalty_bps_per_day"
    constants:
      SECONDS_PER_DAY: 86400
      MAX_BPS_PER_DAY: 2000
    precision: "integer cents; days_late rounded half-up; raw_penalty rounded half-up at the end"

  - name: composite_score
    trigger: "On every QC verdict, every order completion, every revision resolved late, and every broker decline"
    algorithm: weighted_scoring
    formula: |
      // Components computed over rolling 90-day window ending at `now`,
      // inclusive of `now - 90*86400`, exclusive of `now`:
      //   turnaround := 1 - min(1, late_completed_orders / max(1, total_completed_orders))
      //   quality    := mean over QC verdicts in window: APPROVE=1.0, REVISE=0.5, REJECT=0.0
      //   revision   := 1 - min(1, revision_count_in_window / max(1, completed_orders_in_window))
      // Each component then weighted by ClientAccount.scorecard_weight_* of the order's client
      // (if multiple clients, use order-count-weighted average of each client's weights).
      // Raw = 100 * (w_t * turnaround + w_q * quality + w_r * revision)
      // Composite = clamp(round_half_up(Raw * 100) / 100, 0, 100)
      // Decline penalty: each decline in window subtracts 1.0 point AFTER weighting, before clamping.
    input_set: "Broker's completed/cancelled orders and QC verdicts within trailing 90-day window"
    constants:
      WINDOW_DAYS: 90
      DECLINE_PENALTY_PTS: 1.0
      SUSPEND_THRESHOLD: 50.0
    precision: "2 decimal places, round_half_up; clamped to [0, 100]"
    variants:
      - name: client_weighted
        when: "Client scorecard view — per-client breakdown"
        difference: "Composite computed per (broker, client) using only that client's orders and weights; no cross-client averaging"
      - name: global
        when: "Global broker view used for suspension decisions"
        difference: "Components pooled across all clients; weights are order-count-weighted averages of each contributing client's weights"

  - name: fee_reconciliation
    trigger: "On ValuationOrder IN_PROGRESS → REPORT_SUBMITTED transition (pre-check) and on PayoutBatch snapshot"
    algorithm: aggregation
    formula: |
      fee_sum := sum(FeeLine.amount_cents WHERE FeeLine.order_id == order.id AND status != CANCELLED)
      if fee_sum != agreed_fee_cents: reject with ERR_FEE_RECONCILE_MISMATCH
      // Payout aggregation: sum net_payable_cents over contributing orders, rounded half-up per line
      total_payable_cents := sum(net_payable_cents) for orders in period
    input_set: "All FeeLine rows for the order; all contributing COMPLETED orders for the payout batch"
    precision: "integer cents; no float rounding"
    variants:
      - name: per_line_then_sum
        when: "Payout batch computation"
        difference: "Each line's net contribution rounded to integer cents before summation (round-per-line)"
      - name: sum_then_round
        when: "Client-facing invoice presentation (read-only display only)"
        difference: "Net amounts summed at full precision then rounded at presentation; may differ from per_line_then_sum by up to (order_count - 1) cents"

  - name: volume_forecast
    trigger: "On POST /bpo/volume-forecasts (operator-initiated)"
    algorithm: forward_looking
    formula: |
      // Volume-weighted moving average over trailing 3 calendar months of COMPLETED orders
      // in the same state_code. Window = [first day of (forecast_month - 3 months), first day of forecast_month)
      // Weighted: month-1 weight 3, month-2 weight 2, month-3 weight 1
      // predicted = round_half_up( (3*c1 + 2*c2 + 1*c3) / 6 )
      // where c1 = orders completed in forecast_month-1, c2 = forecast_month-2, c3 = forecast_month-3
    input_set: "All ValuationOrder rows with completed_at in window and Property.state_code == forecast.state_code"
    constants:
      WINDOW_MONTHS: 3
      WEIGHTS: [3, 2, 1]
    precision: "integer count; round_half_up"

  - name: comparable_adjustment_cap
    trigger: "On POST /bpo/valuation-orders/{id}/comparables (creation) and on SELECT transition"
    algorithm: constraint_propagation
    formula: |
      // Per-state adjustment cap: total |adjustment_cents| <= ADJUSTMENT_CAP_PCT * sale_price_cents
      // Also: adjusted_value_cents must be > 0
      cap := round_half_up(ADJUSTMENT_CAP_PCT * sale_price_cents)
      if abs(adjustment_cents) > cap: reject with ERR_ADJUSTMENT_EXCEEDS_CAP
      if sale_price_cents + adjustment_cents <= 0: reject with ERR_ADJUSTMENT_NONPOSITIVE
    input_set: "The new Comparable row being created/selected"
    constants:
      ADJUSTMENT_CAP_PCT: 0.25
    precision: "cap computed at integer cents with round_half_up"

  - name: sla_due_at
    trigger: "On ValuationOrder READY_FOR_DISPATCH → DISPATCHED transition"
    algorithm: chronological
    formula: |
      base := ClientAccount.sla_hours_standard if priority == STANDARD else ClientAccount.sla_hours_rush
      sla_due_at := dispatched_at + base * 3600 seconds
    input_set: "ValuationOrder + owning ClientAccount"
    precision: "second-precision UTC; no rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (client, order, qc, revision, broker, batch, forecast)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Body-referenced foreign-key resources exist (property_id, source_property_id, broker_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is permitted"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_safety
    check: "Segregation of duties: QCReviewer X-User-ID must not equal assigned broker's opaque id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bpo/valuation-orders/{id}/qc/{qc_id}/verdict"

  - priority: 7
    category: business_safety
    check: "State-level BPO licensing: bpo_permitted, appraisal_required_for_interior, license_kind compatibility"
    error_id: ERR_LICENSE_NOT_VALID_FOR_STATE
    http_status: 422
    applies_to: "POST /bpo/valuation-orders/{id}/dispatch, POST /bpo/valuation-orders/{id}/submit"

  - priority: 8
    category: business_safety
    check: "Order-level compliance: inspection level vs order_kind compatibility at submit"
    error_id: ERR_INTERIOR_REQUIRES_APPRAISAL
    http_status: 422
    applies_to: "POST /bpo/valuation-orders/{id}/submit"

  - priority: 9
    category: business_safety
    check: "BPO not permitted in subject property's state"
    error_id: ERR_BPO_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /bpo/valuation-orders/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "Comparable-count floor: 3 for DRIVE_BY, 4 for INTERIOR; count of SELECTED comparables must meet floor"
    error_id: ERR_INSUFFICIENT_COMPARABLES
    http_status: 422
    applies_to: "POST /bpo/valuation-orders/{id}/report"

  - priority: 11
    category: business_constraint
    check: "Photo-evidence minimum: 2 photos incl FRONT+STREET for DRIVE_BY; 3 photos incl one each INTERIOR_LIVING/KITCHEN/BATH for INTERIOR"
    error_id: ERR_INSUFFICIENT_PHOTOS
    http_status: 422
    applies_to: "POST /bpo/valuation-orders/{id}/report"

  - priority: 12
    category: business_fiscal
    check: "Fee reconciliation: sum of non-cancelled FeeLine amounts equals agreed_fee_cents"
    error_id: ERR_FEE_RECONCILE_MISMATCH
    http_status: 422
    applies_to: "POST /bpo/valuation-orders/{id}/report"

  - priority: 13
    category: business_constraint
    check: "Comparable adjustment cap: |adjustment_cents| <= 25% of sale_price_cents; adjusted_value_cents > 0"
    error_id: ERR_ADJUSTMENT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /bpo/valuation-orders/{id}/comparables, POST /bpo/valuation-orders/{id}/comparables/{comp_id}/select"

  - priority: 14
    category: business_constraint
    check: "Comparable distance floor: distance_miles >= state.min_driveby_radius_miles (DRIVE_BY) or min_interior_radius_miles (INTERIOR)"
    error_id: ERR_COMPARABLE_RADIUS_VIOLATION
    http_status: 422
    applies_to: "POST /bpo/valuation-orders/{id}/comparables, POST /bpo/valuation-orders/{id}/comparables/{comp_id}/select"

  - priority: 15
    category: business_constraint
    check: "Broker capacity: count of orders in {DISPATCHED, IN_PROGRESS, REPORT_SUBMITTED, QC_REVIEW, REVISION_REQUESTED} < max_concurrent_orders"
    error_id: ERR_BROKER_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /bpo/valuation-orders/{id}/dispatch"

  - priority: 16
    category: business_referential
    check: "Order must not already have an assigned broker when dispatching"
    error_id: ERR_ORDER_ALREADY_DISPATCHED
    http_status: 409
    applies_to: "POST /bpo/valuation-orders/{id}/dispatch"

  - priority: 17
    category: business_referential
    check: "No OPEN QCReview cycle exists on order when opening a new one"
    error_id: ERR_QC_CYCLE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /bpo/valuation-orders/{id}/qc/open"

  - priority: 18
    category: business_referential
    check: "QC verdict must target the latest cycle"
    error_id: ERR_QC_CYCLE_STALE
    http_status: 409
    applies_to: "POST /bpo/valuation-orders/{id}/qc/{qc_id}/verdict"

  - priority: 19
    category: business_referential
    check: "QCRevisionRequest must be OPEN to resubmit"
    error_id: ERR_REVISION_NOT_OPEN
    http_status: 409
    applies_to: "POST /bpo/valuation-orders/{id}/revision/{rev_id}/resubmit"

  - priority: 20
    category: business_referential
    check: "No OPEN QCRevisionRequest on order when completing"
    error_id: ERR_OPEN_REVISION_EXISTS
    http_status: 409
    applies_to: "POST /bpo/valuation-orders/{id}/complete"

  - priority: 21
    category: business_referential
    check: "PayoutBatch.order_count >= 1 at approval"
    error_id: ERR_EMPTY_BATCH
    http_status: 409
    applies_to: "POST /bpo/payout-batches/{id}/approve"

  - priority: 22
    category: business_referential
    check: "All contributing orders in COMPLETED at disburse"
    error_id: ERR_ORDER_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /bpo/payout-batches/{id}/disburse"

  - priority: 23
    category: business_referential
    check: "No OPEN orders assigned to broker at termination"
    error_id: ERR_OPEN_ORDERS_EXIST
    http_status: 409
    applies_to: "POST /bpo/brokers/{id}/terminate"

  - priority: 24
    category: business_referential
    check: "No overdue OPEN QCRevisionRequest assigned to broker at reinstate"
    error_id: ERR_OVERDUE_REVISION_BLOCKS_REINSTATE
    http_status: 409
    applies_to: "POST /bpo/brokers/{id}/reinstate"

  - priority: 25
    category: business_referential
    check: "Broker must hold at least one ACTIVE license at activation"
    error_id: ERR_NO_ACTIVE_LICENSE
    http_status: 409
    applies_to: "POST /bpo/brokers/{id}/activate"

  - priority: 26
    category: state
    check: "Property.status must be REGISTERED when used as subject"
    error_id: ERR_PROPERTY_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /bpo/valuation-orders, POST /bpo/valuation-orders/{id}/submit"

  - priority: 27
    category: state
    check: "StateRegulation.status must be ACTIVE for the subject's state"
    error_id: ERR_STATE_REGULATION_SUSPENDED
    http_status: 409
    applies_to: "POST /bpo/valuation-orders, POST /bpo/valuation-orders/{id}/submit"

  - priority: 28
    category: business_fiscal
    check: "OCC: expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bpo/valuation-orders/{id}/dispatch, POST /bpo/payout-batches/{id}/approve"

  - priority: 29
    category: business_constraint
    check: "Request body fields conform to declared types, ranges, enum sets, string patterns"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 30
    category: auth
    check: "Ownership: X-User-ID matches the entity-backed role's resource owner (e.g., Broker acting on own assigned order)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /bpo/valuation-orders/{id}/accept, POST /bpo/valuation-orders/{id}/decline, POST /bpo/valuation-orders/{id}/report, POST /bpo/valuation-orders/{id}/revision/{rev_id}/resubmit, POST /bpo/valuation-orders/{id}/photos"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Client accounts
  - method: POST
    path: /bpo/client-accounts
    description: "Register a new client account"
    roles: [PlatformAdmin]
    code: 201
    input: [client_code, display_name, sla_hours_standard, sla_hours_rush, "late_penalty_bps_per_day?", "scorecard_weight_turnaround?", "scorecard_weight_quality?", "scorecard_weight_revision?"]
    output: ClientAccount
    side_effects: []

  - method: GET
    path: /bpo/client-accounts
    description: "List client accounts with pagination"
    roles: [PlatformAdmin, OperationsManager, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: ClientAccount[]
    side_effects: []

  - method: GET
    path: /bpo/client-accounts/{id}
    description: "Get a single client account"
    roles: [PlatformAdmin, OperationsManager, BillingClerk, ClientAdmin]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []

  # --- State regulations
  - method: POST
    path: /bpo/state-regulations
    description: "Create or replace a state regulation row"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, bpo_permitted, appraisal_required_for_interior, "min_driveby_radius_miles?", "min_interior_radius_miles?"]
    output: StateRegulation
    side_effects: []

  - method: GET
    path: /bpo/state-regulations
    description: "List state regulations"
    roles: [ComplianceOfficer, PlatformAdmin, OperationsManager, DispatchCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: StateRegulation[]
    side_effects: []

  - method: GET
    path: /bpo/state-regulations/{state_code}
    description: "Get a single state regulation"
    roles: [ComplianceOfficer, PlatformAdmin, OperationsManager, DispatchCoordinator]
    code: 200
    input: []
    output: StateRegulation
    side_effects: []

  # --- Properties
  - method: POST
    path: /bpo/properties
    description: "Register a property"
    roles: [OperationsManager, ClientAdmin]
    code: 201
    input: [street_address, city, state_code, postal_code, living_area_sqft, lot_area_sqft, year_built, property_type]
    output: Property
    side_effects: []

  - method: GET
    path: /bpo/properties
    description: "List properties"
    roles: [OperationsManager, ClientAdmin, DispatchCoordinator, Broker]
    code: 200
    input: ["limit?", "offset?", "state_code?", "status?"]
    output: Property[]
    side_effects: []

  - method: GET
    path: /bpo/properties/{id}
    description: "Get a property"
    roles: [OperationsManager, ClientAdmin, DispatchCoordinator, Broker]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: /bpo/properties/{id}/comparables
    description: "List comparables that reference this property as their source_property_id"
    roles: [OperationsManager, DispatchCoordinator, Broker, QCReviewer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Comparable[]
    side_effects: []

  # --- Brokers
  - method: POST
    path: /bpo/brokers
    description: "Onboard a new broker"
    roles: [ComplianceOfficer]
    code: 201
    input: [broker_code, full_name, email, max_concurrent_orders]
    output: Broker
    side_effects: []

  - method: GET
    path: /bpo/brokers
    description: "List brokers"
    roles: [ComplianceOfficer, PlatformAdmin, OperationsManager, DispatchCoordinator, BillingClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Broker[]
    side_effects: []

  - method: GET
    path: /bpo/brokers/{id}
    description: "Get a broker"
    roles: [ComplianceOfficer, PlatformAdmin, OperationsManager, DispatchCoordinator, BillingClerk, Broker]
    code: 200
    input: []
    output: Broker
    side_effects: []

  - method: POST
    path: /bpo/brokers/{id}/activate
    description: "Activate a broker (must have at least one ACTIVE license)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Broker
    side_effects: ["Increments Broker.version by 1"]

  - method: POST
    path: /bpo/brokers/{id}/suspend
    description: "Suspend a broker (reverts their DISPATCHED orders to READY_FOR_DISPATCH)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Broker
    side_effects: ["Cascade reverts DISPATCHED orders to READY_FOR_DISPATCH and clears assigned_broker_id", "Increments Broker.version by 1"]

  - method: POST
    path: /bpo/brokers/{id}/reinstate
    description: "Reinstate a suspended broker (blocked by overdue open revision)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Broker
    side_effects: ["Increments Broker.version by 1"]

  - method: POST
    path: /bpo/brokers/{id}/terminate
    description: "Terminate a broker (no open orders allowed)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Broker
    side_effects: ["All BrokerLicense rows transition to REVOKED", "Increments Broker.version by 1"]

  # --- Broker licenses
  - method: POST
    path: /bpo/brokers/{id}/licenses
