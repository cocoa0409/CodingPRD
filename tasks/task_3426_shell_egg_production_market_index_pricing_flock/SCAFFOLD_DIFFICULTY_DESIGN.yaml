# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3426_shell_egg_production_market_index_pricing_flock
#
# Depth probe: 2+ instances per each of the nine Difficulty Rules of SKILL.md
# section 0.5, every instance grounded in SCAFFOLD.yaml sections 1.1-1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_point_vs_final_week_average
        grounds:
          - calculations.settlement_index_pricing
          - state_machines.Settlement.PROVISIONAL_to_FINAL
          - endpoints.POST_/api/orders/{id}/ship
          - endpoints.POST_/api/settlements/{id}/finalize
        distinguishing_aspect: "Entity domain SalesOrder/Settlement: the PROVISIONAL variant prices off the single latest quotation effective at the ship clock (170 -> unit 182) while the FINAL variant prices off the week-window mean (160) minus the volume discount (4) -> unit 168; identical order data, two different totals."
        test_recipe:
          setup:
            - "Complex 'Heartland Layers' (MIDWEST) with house H1 (CONVENTIONAL, 100000 hens) holding LAYING flock F1 of 80000 hens at age 18 (weekly projection 39666 dozen)."
            - "Customer 'Sunrise Grocers' (RETAIL, credit 500000000) with ACTIVE commitment: CONVENTIONAL, MIDWEST, 100000 dozen/week, adjustment +12 cents, window [2026-09-01, 2027-03-01]."
            - "URNER_BARRY quotations for MIDWEST/LARGE: 150 effective 2026-09-07, 160 effective 2026-09-09, 170 effective 2026-09-11."
            - "Order for 30000 dozen LARGE, ship week 2026-09-07, ALLOCATED to the complex."
          setup_api_calls:
            - &k_clock0901
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/complexes"
              payload: { name: "Heartland Layers", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 100000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-04-28T00:00:00Z", placed_hen_count: 80000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/customers"
              payload: { name: "Sunrise Grocers", segment: "RETAIL", credit_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { cu_id: $.data.id }
            - call: "POST /api/customers/${cu_id}/commitments"
              payload: { program: "CONVENTIONAL", region_code: "MIDWEST", weekly_dozen_committed: 100000, price_adjustment_cents_per_dozen: 12, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z" }
              as: SalesManager
              captures: { cm_id: $.data.id }
            - call: "POST /api/commitments/${cm_id}/activate"
              payload: {}
              as: SalesManager
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v: $.data.version }
            - call: "POST /api/market-quotations"
              payload: { region_code: "MIDWEST", size_class: "LARGE", price_cents_per_dozen: 150, effective_date: "2026-09-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotations"
              payload: { region_code: "MIDWEST", size_class: "LARGE", price_cents_per_dozen: 160, effective_date: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotations"
              payload: { region_code: "MIDWEST", size_class: "LARGE", price_cents_per_dozen: 170, effective_date: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 30000, size_class: "LARGE", expected_commitment_version: "${cm_v}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /api/orders/${ord_id}/allocate"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/orders/${ord_id}/ship"
              payload: {}
              as: PlantManager
            - call: "GET /api/orders/${ord_id}/settlements"
              payload: {}
              as: SalesManager
              captures: { st_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/settlements/${st_id}/finalize"
              payload: {}
              as: SalesManager
          assert:
            - "after ship: Settlement.${st_id}.status == PROVISIONAL"
            - "Settlement.${st_id}.provisional_index_cents == 170 (latest quotation effective <= 2026-09-12)"
            - "Settlement.${st_id}.provisional_unit_price_cents == 182 and provisional_total_cents == 5460000"
            - "after finalize: Settlement.${st_id}.status == FINAL, final_index_average_cents == 160 (mean of 150, 160, 170)"
            - "Settlement.${st_id}.final_volume_discount_cents == 4 (RETAIL week spend 5160000 >= 2000000 threshold)"
            - "Settlement.${st_id}.final_unit_price_cents == 168 and final_total_cents == 5040000"
            - "provisional_unit_price_cents (182) != final_unit_price_cents (168) for identical order data — the two variants provably diverge"
            - "SalesOrder.${ord_id}.status == SETTLED"

      - name: feed_batch_actual_fifo_vs_standard_budget
        grounds:
          - calculations.feed_batch_costing
          - entities.FeedBatch.fields.actual_cost_per_dozen_cents
          - entities.FeedBatch.fields.standard_cost_per_dozen_cents
        distinguishing_aspect: "Entity domain FeedBatch/FeedContract (unrelated to settlement pricing): the ACTUAL variant FIFO-weights real receipts (hedged tons at futures+basis, unhedged at receipt spot+basis) yielding 26570 cents/ton and 53.14 cents/dozen, while the STANDARD variant yields the constant 50.40 cents/dozen — the same batch carries both figures."
        test_recipe:
          setup:
            - "Complex 'Mill West' with mill capacity 1000 tons/day."
            - "CORN contract: 200 tons, basis 2000, spot reference 17000, window [2026-09-01, 2026-10-01), hedged 100 tons at futures 16000; receipts: 120 tons at spot 17500 (2026-09-02), then 80 tons at spot 18000 (2026-09-03) — total_cost 3790000, average 18950 cents/ton, status FILLED."
            - "SOYBEAN_MEAL contract: 100 tons, basis 3000, spot reference 34000, window [2026-09-01, 2026-09-15), unhedged; receipt 100 tons at spot 35000 (2026-09-04) — average 38000 cents/ton, status FILLED."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Mill West", region_code: "WEST", mill_receiving_tons_per_day: 1000 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/feed-contracts"
              payload: { complex_id: "${cx_id}", commodity: "CORN", total_tons: 200, basis_cents_per_ton: 2000, spot_reference_cents_per_ton: 17000, delivery_start: "2026-09-01T00:00:00Z", delivery_end: "2026-10-01T00:00:00Z" }
              as: ProcurementLead
              captures: { fc_corn: $.data.id }
            - call: "POST /api/feed-contracts/${fc_corn}/hedge"
              payload: { hedged_tons: 100, hedge_futures_cents_per_ton: 16000 }
              as: ProcurementLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/feed-contracts/${fc_corn}/receive"
              payload: { tons: 120, spot_cents_per_ton: 17500 }
              as: ProcurementLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/feed-contracts/${fc_corn}/receive"
              payload: { tons: 80, spot_cents_per_ton: 18000 }
              as: ProcurementLead
            - call: "POST /api/feed-contracts"
              payload: { complex_id: "${cx_id}", commodity: "SOYBEAN_MEAL", total_tons: 100, basis_cents_per_ton: 3000, spot_reference_cents_per_ton: 34000, delivery_start: "2026-09-01T00:00:00Z", delivery_end: "2026-09-15T00:00:00Z" }
              as: ProcurementLead
              captures: { fc_soy: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/feed-contracts/${fc_soy}/receive"
              payload: { tons: 100, spot_cents_per_ton: 35000 }
              as: ProcurementLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/complexes/${cx_id}/feed-batches"
              payload: { program: "CONVENTIONAL", corn_tons: 60, soybean_tons: 40 }
              as: ComplexManager
              as_user_id: "${cx_id}"
              captures: { fb_id: $.data.id }
          assert:
            - "FeedBatch.${fb_id}.blended_cost_cents_per_ton == 26570 ((60*18950 + 40*38000)/100)"
            - "FeedBatch.${fb_id}.actual_cost_per_dozen_cents == 53.14 (26570 * 4.0 / 2000)"
            - "FeedBatch.${fb_id}.standard_cost_per_dozen_cents == 50.40 (constant budget blend 25200 cents/ton)"
            - "actual (53.14) != standard (50.40) for the same batch — the variants diverge because receipts priced above budget"
            - "FeedContract.${fc_corn}.average_received_cost_cents_per_ton == 18950 and hedged_applied_tons == 100 (hedge consumed entirely by the first receipt)"
            - "Complex.${cx_id}.corn_inventory_tons == 140 and soy_inventory_tons == 60 after the batch"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: allocation_capacity_nested_min_max_quarantine_branch
        grounds:
          - calculations.order_allocation_capacity
          - state_machines.SalesOrder.BOOKED_to_ALLOCATED
        distinguishing_aspect: "Mode (a): available = 0 if posture == QUARANTINE else max(0, projection(week) - already-allocated) — a conditional branch on complex state wrapped around nested min/max over projection and allocation totals; order 2 blocks purely because the nested subtraction leaves 14791 < 15000."
        test_recipe:
          setup:
            - "Complex 'Prairie Gold' (MIDWEST) with LAYING flock of 50000 hens at age 18: week-offset-0 projection 24791 dozen."
            - "ACTIVE commitment: CONVENTIONAL, MIDWEST, 100000 dozen/week, adjustment 0, window [2026-09-01, 2027-03-01]."
            - "Order A for 10000 dozen in week 2026-09-07, already ALLOCATED (consumes 10000 of the 24791)."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Prairie Gold", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 100000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-04-28T00:00:00Z", placed_hen_count: 50000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/customers"
              payload: { name: "Sunrise Grocers", segment: "RETAIL", credit_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { cu_id: $.data.id }
            - call: "POST /api/customers/${cu_id}/commitments"
              payload: { program: "CONVENTIONAL", region_code: "MIDWEST", weekly_dozen_committed: 100000, price_adjustment_cents_per_dozen: 0, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z" }
              as: SalesManager
              captures: { cm_id: $.data.id }
            - call: "POST /api/commitments/${cm_id}/activate"
              payload: {}
              as: SalesManager
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v: $.data.version }
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 10000, size_class: "LARGE", expected_commitment_version: "${cm_v}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ord_a: $.data.id }
            - call: "POST /api/orders/${ord_a}/allocate"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v2: $.data.version }
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 15000, size_class: "LARGE", expected_commitment_version: "${cm_v2}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ord_b: $.data.id }
          trigger:
            - call: "POST /api/orders/${ord_b}/allocate"
              payload: {}
              as: ProductionPlanner
          assert:
            - "SalesOrder.${ord_a}.status == ALLOCATED with allocated_dozen == 10000 and allocated_complex_id == ${cx_id}"
            - "SalesOrder.${ord_b}.status == BLOCKED with allocated_complex_id null — available = max(0, 24791 - 10000) = 14791 < 15000"
            - "the allocate response is 200 (empty candidate pool is a deferred-queue outcome, not an error)"
            - "CustomerCommitment.${cm_id}.blocked_order_count == 1"

      - name: packing_distribution_largest_remainder_rounding
        grounds:
          - calculations.packing_size_distribution
          - endpoints.POST_/api/complexes/{id}/packing-runs
        distinguishing_aspect: "Mode (b): case counts are floored PER SIZE CLASS first and the 3-case remainder is then distributed by largest fractional part with enum-order tie-break (SMALL .959, PEEWEE .735, JUMBO .656 win) — 'round the total' or average-rate rounding yields a different carton assortment."
        test_recipe:
          setup:
            - "Complex 'Grading Central' with house HA (CONVENTIONAL, 50000) holding flock A (20000 hens, placed 2026-08-25 at age 20) and house HB (CONVENTIONAL, 50000) holding flock B (30000 hens, placed 2026-08-25 at age 25); both LAYING."
            - "One run-ops week at 2026-09-01 accrues 9916 + 14875 = 24791 dozen into the conventional bucket; ages advance to 21 and 26 (band blend YOUNG x PEAK with weights 9906 and 16083)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/complexes"
              payload: { name: "Grading Central", region_code: "SOUTHEAST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "HA", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { ha_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "HB", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { hb_id: $.data.id }
            - call: "POST /api/houses/${ha_id}/flocks"
              payload: { flock_code: "FA", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-04-07T00:00:00Z", placed_hen_count: 20000 }
              as: ProductionPlanner
              captures: { fa_id: $.data.id }
            - call: "POST /api/houses/${hb_id}/flocks"
              payload: { flock_code: "FB", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-03-03T00:00:00Z", placed_hen_count: 30000 }
              as: ProductionPlanner
              captures: { fb_id: $.data.id }
            - call: "POST /api/flocks/${fa_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/flocks/${fb_id}/place"
              payload: {}
              as: ProductionPlanner
            - *k_clock0901
            - call: "POST /api/complexes/${cx_id}/run-ops"
              payload: {}
              as: PlatformAdmin
              captures: { cx_v: $.data.version, bucket_pre: $.data.ungraded_conventional_dozen }
          trigger:
            - call: "POST /api/complexes/${cx_id}/packing-runs"
              payload: { program: "CONVENTIONAL", dozen_input: 2970, run_date: "2026-09-01T00:00:00Z", expected_complex_version: "${cx_v}" }
              as: PlantManager
              captures: { pr_id: $.data.id }
          assert:
            - "precondition: bucket_pre == 24791 (9916 from flock A at age 20, 14875 from flock B at age 25)"
            - "PackingRun.${pr_id}.total_cases == 99 (floor(2970 / 30))"
            - "PackingRun.${pr_id}.cases_by_size == { JUMBO: 6, EXTRA_LARGE: 19, LARGE: 40, MEDIUM: 22, SMALL: 9, PEEWEE: 3 }"
            - "the floors alone sum to 96; the 3-case remainder goes to SMALL (fraction .959), PEEWEE (.735), JUMBO (.656) — largest-remainder reconciliation, not total-rounding"
            - "PackingRun.${pr_id}.status == PACKED"
            - "Complex.${cx_id}.ungraded_conventional_dozen == 21821 after consumption (24791 - 2970)"

      - name: settlement_discount_keyed_on_prediscount_week_spend
        grounds:
          - calculations.settlement_index_pricing
          - entities.Settlement.fields.final_volume_discount_cents
        distinguishing_aspect: "Mode (c): the volume-discount tier is keyed on PRE-discount week spend (11700 x 172 = 2012400 >= 2000000 -> tier 4 cents), while the post-discount total (1965600) falls BELOW the threshold — an implementation that keys the tier on the post-discount total returns unit 172; the pinned evaluation order returns 168."
        test_recipe:
          setup:
            - "Complex 'Heartland Layers' (MIDWEST) with LAYING flock of 80000 hens at age 18 (projection 39666 dozen)."
            - "Customer 'Metro Markets' (RETAIL, credit 500000000) with ACTIVE commitment: CONVENTIONAL, MIDWEST, 50000 dozen/week, adjustment +12, window [2026-09-01, 2027-03-01]; it is the customer's only order in week 2026-09-07."
            - "Quotations MIDWEST/LARGE: 150 @ 2026-09-07, 160 @ 2026-09-09, 170 @ 2026-09-11 (week mean 160)."
            - "Order for 11700 dozen LARGE, week 2026-09-07, ALLOCATED."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Heartland Layers", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 100000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-04-28T00:00:00Z", placed_hen_count: 80000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/customers"
              payload: { name: "Metro Markets", segment: "RETAIL", credit_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { cu_id: $.data.id }
            - call: "POST /api/customers/${cu_id}/commitments"
              payload: { program: "CONVENTIONAL", region_code: "MIDWEST", weekly_dozen_committed: 50000, price_adjustment_cents_per_dozen: 12, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z" }
              as: SalesManager
              captures: { cm_id: $.data.id }
            - call: "POST /api/commitments/${cm_id}/activate"
              payload: {}
              as: SalesManager
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v: $.data.version }
            - call: "POST /api/market-quotations"
              payload: { region_code: "MIDWEST", size_class: "LARGE", price_cents_per_dozen: 150, effective_date: "2026-09-07T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotations"
              payload: { region_code: "MIDWEST", size_class: "LARGE", price_cents_per_dozen: 160, effective_date: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/market-quotations"
              payload: { region_code: "MIDWEST", size_class: "LARGE", price_cents_per_dozen: 170, effective_date: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 11700, size_class: "LARGE", expected_commitment_version: "${cm_v}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /api/orders/${ord_id}/allocate"
              payload: {}
              as: ProductionPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/orders/${ord_id}/ship"
              payload: {}
              as: PlantManager
            - call: "GET /api/orders/${ord_id}/settlements"
              payload: {}
              as: SalesManager
              captures: { st_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/settlements/${st_id}/finalize"
              payload: {}
              as: SalesManager
          assert:
            - "Settlement.${st_id}.final_index_average_cents == 160"
            - "week spend computed at PRE-discount prices: 11700 * 172 == 2012400 >= 2000000, so the RETAIL tier grants 4 cents/dozen"
            - "Settlement.${st_id}.final_volume_discount_cents == 4 and final_unit_price_cents == 168"
            - "Settlement.${st_id}.final_total_cents == 1965600 — the post-discount spend (1965600 < 2000000) must NOT demote the tier"
            - "Settlement.${st_id}.status == FINAL"

# __CONTINUE__

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: flock_molt_cycle_laying_molt_laying
        grounds:
          - state_machines.Flock.LAYING_to_MOLT
          - state_machines.Flock.MOLT_to_LAYING
          - calculations.run_ops_week_advance
        distinguishing_aspect: "Cyclic machine on Flock: LAYING -> MOLT -> LAYING loops back to a previously held state with molt_count = 1 and the post-molt 0.95 rate factor; a second molt is rejected because the loop is single-shot per flock."
        test_recipe:
          setup:
            - "Complex 'Molt Ridge' with house H1 (CONVENTIONAL, 100000) holding flock F1 of 60000 hens placed 2026-09-01 (age 0, GROWING)."
            - "run-ops at 2027-08-17 advances 50 weeks: F1 is LAYING at age 50 with 57097 hens; conventional bucket holds 977577 dozen."
          setup_api_calls:
