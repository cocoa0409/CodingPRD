            - "error_id == ERR_SUBLEASE_BEYOND_GROUND_LEASE (end one day past expiry is rejected)"
            - "a sibling create with end_date 2030-01-01 exactly would pass the temporal check"

      - name: one_active_sublease_per_store_mutual_exclusion
        grounds:
          - validations.priority_10_business_referential
          - errors.ERR_ACTIVE_SUBLEASE_EXISTS
        distinguishing_aspect: |
          Different interval semantics — mutual-exclusion occupancy rather than
          containment: a store may host AT MOST ONE non-terminal sublease over
          its lifetime window; a second sublease that is temporally disjoint
          from the first still collides because the first is ACTIVE. Different
          resource (Store) and different geometric treatment (existence, not
          interval overlap).
