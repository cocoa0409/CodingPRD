  # ---------------------------------------------------------- complexity_layers
  - section: complexity_layers
    instances:
      - name: occ_stale_contract_version_on_settlement_create
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[settlement-create-stale-contract]", "errors[ERR_STALE_VERSION]", "validations[priority=7]"]
        distinguishing_aspect: "OCC on RetailerContract.version: after a first settlement create bumps the contract version, a second create carrying the previously observed version is rejected 412 ERR_STALE_VERSION — deterministic over two strictly sequential requests."
        test_recipe:
          setup: ["farm; ACTIVE contract (version 2 after activate); one settlement S1 created with expected_contract_version == 2 (success, contract version advances)"]
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Occ Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/contracts"
              payload: { farm_id: "${farm_id}", retailer_name: "RetailCo", pricing_model: "MARKET_INDEX", spread_cents: 5, margin_pct: 0, claim_premium_pct: 0, claim_required: "NONE", effective_start: "2026-01-01", effective_end: "2026-12-31", weekly_min_dozen: 10, max_open_dozen: 100 }
              as: ContractManager
              captures: { contract_id: "$.data.id" }
            - call: "POST /api/contracts/${contract_id}/activate"
              payload: {}
              as: ContractManager
            - call: "GET /api/contracts/${contract_id}"
              payload: {}
              as: ContractManager
              captures: { cv: "$.data.version" }
            - call: "POST /api/settlements"
              payload: { contract_id: "${contract_id}", period_start: "2026-07-27", period_end: "2026-08-02", market_index_cents: 140, expected_contract_version: "${cv}" }
              as: ContractManager
              captures: { s1: "$.data.id" }
          trigger:
            - call: "POST /api/settlements"
              payload: { contract_id: "${contract_id}", period_start: "2026-08-03", period_end: "2026-08-09", market_index_cents: 141, expected_contract_version: "${cv}" }
              as: ContractManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 412; err == ERR_STALE_VERSION — expected_contract_version ${cv} is stale after S1 bumped the contract version"
            - "Settlement.${s1}.status remains DRAFT; no supersede fired for the rejected create"
      - name: recall_scope_sweeps_only_matching_lots
        claim_type: cascade_scope
        grounds: [state_machines.Recall.INITIATED_to_SCOPED, entities.Recall.fields.scoped_lot_count, entities.EggLot.fields.recall_id]
        distinguishing_aspect: "The sweep selector is precise: farm match AND scope_flock match AND pack_date inside the inclusive window AND lifecycle in {FRESH, RELEASED, ALLOCATED}. Lot A2 (pack 2026-08-03, outside window) and lot B1 (different flock) survive; only A1 (flock A, pack 2026-08-01) is RECALLED."
        test_recipe:
          setup:
            - "farm; houses H1/H2; LAYING flocks FA (H1) and FB (H2)"
            - "FA: production 2026-07-31 (240 eggs) -> run RA1 confirmed at clock 2026-08-01 (lot A1, pack 2026-08-01); production 2026-08-02 (240 eggs) -> run RA2 confirmed at clock 2026-08-03 (lot A2, pack 2026-08-03)"
            - "FB: production 2026-07-31 -> run RB1 confirmed at clock 2026-08-01 (lot B1, pack 2026-08-01)"
            - "manual recall: scope_flock FA, window [2026-08-01, 2026-08-02]"
          setup_api_calls:
            - call: "POST /api/farms"
              payload: { name: "Scope Farm", certification_program: "CONVENTIONAL", daily_overhead_cents: 12000 }
              as: PlatformAdmin
              captures: { farm_id: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H1", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house1: "$.data.id" }
            - call: "POST /api/houses"
              payload: { farm_id: "${farm_id}", house_code: "H2", environment_type: "CAGED", capacity_hens: 2000 }
              as: FarmManager
              captures: { house2: "$.data.id" }
            - call: "POST /api/flocks"
              payload: { house_id: "${house1}", breed_code: "HYLINE_BROWN", breed_peak_rate_pct: 95.0, placement_date: "2026-01-05", initial_hen_count: 1000, pullet_cost_cents: 420000 }
