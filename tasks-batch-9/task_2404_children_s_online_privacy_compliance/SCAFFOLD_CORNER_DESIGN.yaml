  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: notice_create_against_a_stale_service_version_is_refused_with_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[notice-create-stale-service]
          - errors[ERR_STALE_SERVICE_VERSION]
          - endpoints["POST /parental-notices"]
        distinguishing_aspect: "OnlineService.version is the single OCC token and it advances on EVERY write to the aggregate, including the notice create itself — so a client that reuses the version it read before its own successful create is refused with ERR_STALE_SERVICE_VERSION (412), the refused attempt does NOT advance the version, and re-reading the version makes the same request succeed."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; a service whose version has already advanced to 3 through creation (1), one evidence row (2) and one determination run (3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Stale Notice Kids", operator_organization: "Stale Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id, v_create: $.data.version }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
