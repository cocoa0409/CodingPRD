  # =========================================================================
  - section: endpoints
    instances:
      - name: standards_summary_aggregates_open_corrections_across_the_whole_desk
        claim_type: computed_read
        grounds:
          - endpoints[GET /standards-desk/newsrooms/{id}/standards-summary]
          - calculations.desk_training_compliance_index
          - calculations.newsroom_standards_posture
        distinguishing_aspect: "The summary is a pure read that aggregates over the desk: two fully trained journalists give 100.00, and one INTAKE complaint on each of two DRAFT stories gives open_correction_request_count 2 with published_story_count 0 and posture OPEN."
        test_recipe:
          setup:
            - "A default newsroom (required module SOURCING) with an executive editor and a reporter, both trained"
