            - { call: "POST /api/evaluation-line-items/${l_h5}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/post", as: TransferEvaluator, as_user_id: "eval-b" }
            - { call: "GET /api/requirement-applications", payload: { line_item_id: "${l_e2}" }, as: TransferEvaluator, captures: { e2_row0_slot: "$.data[0].slot", e2_row0_cr: "$.data[0].applied_credits", e2_row1_slot: "$.data[1].slot", e2_row1_cr: "$.data[1].applied_credits" } }
            - { call: "GET /api/requirement-applications", payload: { line_item_id: "${l_h5}" }, as: TransferEvaluator, captures: { h5_row_status: "$.data[0].status", h5_row_cr: "$.data[0].applied_credits" } }
            - { call: "GET /api/students/${s_id}", as: TransferEvaluator, captures: { s_total: "$.data.total_posted_transfer_credits" } }
          assert:
            - "TransferCreditEvaluation.${ev_id}.applied_credits_total == 60.0 (global cap MAX_TRANSFER_CREDITS hit exactly)"
            - "each MATH line applied 6.0 to MAJOR_CORE: EvaluationLineItem.${l_m1}.applied_credits == 6.0 (MAJOR_CORE filled 30.0 exactly by 5 lines)"
            - "E-201 line applied 5.0 all to GENED_COMMS (slot need 6.0); E-202 line splits: the RequirementApplication row set for ${l_e2} is exactly { slot GENED_COMMS applied_credits 1.0, slot FREE_ELECTIVE applied_credits 4.0 } (two rows; verify as an order-insensitive set since both are written in one posting transaction)"
            - "H-301..H-304 lines each applied_credits == 5.0 to FREE_ELECTIVE (bucket reaches 4.0 spill + 20.0 = 24.0 full)"
            - "EvaluationLineItem.${l_h5}.applied_credits == 0.0 and its RequirementApplication row has status == UNAPPLIED with applied_credits == 0.0 (cap boundary: 60.0 reached exactly, next line gets nothing)"
            - "TransferStudent.${s_id}.total_posted_transfer_credits == 60.0"

      - name: provisional_total_per_line_rounding_order
        grounds:
          - calculations.evaluation_provisional_total
          - calculations.provisional_credit_award
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — each line's provisional_credits
          is rounded to 1dp FIRST (3.375 -> 3.4, 3.375 -> 3.4, 1.6875 -> 1.7) and the
          evaluation total sums the ROUNDED values with NO second rounding (8.5);
          summing raw values then rounding once would give round(8.4375,1) == 8.4.
          The scaffold pins per-line-then-sum; 8.5 != 8.4 proves the order.
        test_recipe:
          setup:
            - "QUARTER partner; courses C1 (MATH, 4.0), C2 (ENGL, 4.0), C3 (HIST, 2.0); ACTIVE agreement with equivalencies Q-101->C1 (4.5h), Q-102->C2 (4.5h), Q-103->C3 (2.25h)"
            - "Student with VERIFIED transcript carrying the three courses, all grade B"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Quarter College", institution_code: "QC", credit_system: "QUARTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "ENGL-150", title: "Literature", credit_hours: 4.0, level: "LOWER", department: "ENGL", gened_tags: [] }, as: RegistrarAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "HIST-150", title: "Seminar", credit_hours: 2.0, level: "LOWER", department: "HIST", gened_tags: [] }, as: RegistrarAdmin, captures: { c3: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "Q-101", external_title: "Q101", external_credit_hours: 4.5, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c2}", external_course_code: "Q-102", external_title: "Q102", external_credit_hours: 4.5, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c3}", external_course_code: "Q-103", external_title: "Q103", external_credit_hours: 2.25, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Ronda Rounding", email: "ronda@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "Q-101", title: "Q101", credit_hours: 4.5, grade: "B" }, { external_course_code: "Q-102", title: "Q102", credit_hours: 4.5, grade: "B" }, { external_course_code: "Q-103", title: "Q103", credit_hours: 2.25, grade: "B" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}", as: TransferEvaluator, captures: { prov_total: "$.data.provisional_credits_total" } }
          assert:
            - "TransferCreditEvaluation.${ev_id}.provisional_credits_total == 8.5 (3.4 + 3.4 + 1.7: per-line 1dp rounded values summed, no second rounding)"
            - "the forbidden alternative order (sum raw 8.4375 then round) would yield 8.4; observed value 8.5 pins the per-line-then-sum order"

  # ==================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ==================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_suspend_reactivate_cycle
        grounds:
          - state_machines.ArticulationAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ArticulationAgreement.SUSPENDED_to_ACTIVE
          - state_machines.CourseEquivalency.INACTIVE_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on ArticulationAgreement (ACTIVE -> SUSPENDED -> ACTIVE, a
          genuine A->B->A loop, not a linear pipeline). Distinct entity from the
          sibling instance (TransferCreditEvaluation). Equivalency status rides the
          cycle: INACTIVE under DRAFT, ACTIVE after activate, INACTIVE after suspend,
          ACTIVE again after reactivate.
        test_recipe:
          setup:
            - "Partner and course exist; agreement in DRAFT with one equivalency created while DRAFT (equivalency starts INACTIVE)"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Cycle College", institution_code: "CC", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "BIO-110", title: "Biology", credit_hours: 4.0, level: "LOWER", department: "BIOL", gened_tags: ["GENED_SCIENCE"] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id", ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "BIO-101", external_title: "Bio", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin, captures: { eq_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/course-equivalencies/${eq_id}", as: RegistrarAdmin, captures: { eq_st_after_activate: "$.data.status" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/suspend", as: RegistrarAdmin }
            - { call: "GET /api/course-equivalencies/${eq_id}", as: RegistrarAdmin, captures: { eq_st_after_suspend: "$.data.status" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/reactivate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_st_final: "$.data.status" } }
            - { call: "GET /api/course-equivalencies/${eq_id}", as: RegistrarAdmin, captures: { eq_st_final: "$.data.status" } }
          assert:
            - "equivalency created under DRAFT agreement starts INACTIVE"
            - "after activate: CourseEquivalency.${eq_id}.status == ACTIVE"
            - "after suspend: CourseEquivalency.${eq_id}.status == INACTIVE"
            - "after reactivate: ArticulationAgreement.${ag_id}.status == ACTIVE and CourseEquivalency.${eq_id}.status == ACTIVE — the A->B->A cycle closed"

      - name: evaluation_post_reopen_repost_cycle
        grounds:
          - state_machines.TransferCreditEvaluation.POSTED_to_IN_REVIEW
          - state_machines.TransferCreditEvaluation.EVALUATED_to_POSTED
          - calculations.posted_transfer_credit_ledger
        distinguishing_aspect: |
          Cyclic machine on TransferCreditEvaluation (IN_REVIEW -> EVALUATED -> POSTED
          -> IN_REVIEW -> EVALUATED -> POSTED) with full compensation on the backward
          arc. Distinct entity from the sibling instance (ArticulationAgreement).
          The second pass through the cycle reproduces identical outcomes because the
          waterfall is deterministic.
        test_recipe:
          setup:
            - "SEMESTER partner, C1 (MATH, 4.0), ACTIVE agreement with equivalency M-101 -> C1 (4.0h); student major MATH; transcript with M-101 grade A; evaluation posted once (line applied 4.0 to MAJOR_CORE)"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "State University", institution_code: "SU", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Cy Clic", email: "cy@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
            - { call: "POST /api/evaluation-line-items/${l1}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/post", as: TransferEvaluator, as_user_id: "eval-b" }
            - { call: "GET /api/students/${s_id}", as: TransferEvaluator, captures: { tot_after_post: "$.data.total_posted_transfer_credits" } }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/reopen", payload: { reason: "Student submitted additional coursework" }, as: TransferEvaluator }
            - { call: "GET /api/evaluation-line-items/${l1}", as: TransferEvaluator, captures: { l1_st_reopen: "$.data.status", l1_applied_reopen: "$.data.applied_credits" } }
            - { call: "GET /api/students/${s_id}", as: TransferEvaluator, captures: { tot_after_reopen: "$.data.total_posted_transfer_credits" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/post", as: TransferEvaluator, as_user_id: "eval-b" }
            - { call: "GET /api/students/${s_id}", as: TransferEvaluator, captures: { tot_after_repost: "$.data.total_posted_transfer_credits" } }
          assert:
            - "after first post: TransferStudent.${s_id}.total_posted_transfer_credits == 4.0"
            - "after reopen: TransferCreditEvaluation.${ev_id}.status == IN_REVIEW; EvaluationLineItem.${l1}.status == ADOPTED with applied_credits == null; student total == 0.0"
            - "after re-finalize + re-post: TransferCreditEvaluation.${ev_id}.status == POSTED and student total == 4.0 again (cycle POSTED->IN_REVIEW->EVALUATED->POSTED with identical deterministic outcome)"

  # ==================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and >= 2, different triggers)
  # ==================================================================
  - rule_id: transitive_cascade
    instances:
      - name: appeal_overturn_cascades_petition_line_evaluation
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_OVERTURNED
          - state_machines.Petition.DENIED_to_APPROVED
          - state_machines.EvaluationLineItem.PETITION_REQUIRED_to_ADOPTED
          - state_machines.TransferCreditEvaluation.POSTED_to_IN_REVIEW
        distinguishing_aspect: |
          Depth-3 chain triggered by appeal adjudication (POST .../appeals/{id}/adjudicate
          OVERTURNED): appeal mutates petition (link 1: DENIED -> APPROVED); that petition
          mutation itself flips the line item (link 2: DENIED -> ADOPTED with recomputed
          awarded_credits); that line mutation itself forces the POSTED evaluation open
          (link 3: POSTED -> IN_REVIEW with full reopen compensation). Each link is caused
          by the previous mutation, not by the original request.
        test_recipe:
          setup:
            - "QUARTER partner; course CART (ART, 4.0, no tags); NO equivalency for external ART-210, so the line is PETITION_REQUIRED"
            - "Student (major MATH); evaluation IN_REVIEW; petition filed by student, reviewed and DENIED by faculty fac-1; line then DENIED by evaluator; evaluation finalized by eval-a and posted by eval-b"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Art College", institution_code: "AC", credit_system: "QUARTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "ART-200", title: "Sculpture I", credit_hours: 4.0, level: "LOWER", department: "ART", gened_tags: [] }, as: RegistrarAdmin, captures: { c_art: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Ann Appeal", email: "ann@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "ART-210", title: "Sculpture", credit_hours: 4.5, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
            - { call: "POST /api/petitions", payload: { line_item_id: "${l1}", proposed_internal_course_id: "${c_art}", syllabus_ref: "s3://syllabi/art210.pdf" }, as: Student, as_user_id: "${s_id}", captures: { pet_id: "$.data.id" } }
            - { call: "POST /api/petitions/${pet_id}/start-review", as: FacultyAdjudicator, as_user_id: "fac-1" }
            - { call: "POST /api/petitions/${pet_id}/adjudicate", payload: { decision: "DENIED", adjudication_note: "Insufficient studio hours documented" }, as: FacultyAdjudicator, as_user_id: "fac-1" }
            - { call: "POST /api/evaluation-line-items/${l1}/deny", payload: { reason: "Petition denied by faculty" }, as: TransferEvaluator }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/post", as: TransferEvaluator, as_user_id: "eval-b" }
          trigger:
            - { call: "POST /api/appeals", payload: { petition_id: "${pet_id}", grounds: "New syllabus evidence provided by department chair" }, as: Student, as_user_id: "${s_id}", captures: { ap_id: "$.data.id" } }
            - { call: "POST /api/appeals/${ap_id}/start-review", as: FacultyAdjudicator, as_user_id: "fac-2" }
            - { call: "POST /api/appeals/${ap_id}/adjudicate", payload: { decision: "OVERTURNED", adjudication_note: "New evidence accepted by committee" }, as: FacultyAdjudicator, as_user_id: "fac-2" }
            - { call: "GET /api/petitions/${pet_id}", as: FacultyAdjudicator, captures: { pet_st: "$.data.status" } }
            - { call: "GET /api/evaluation-line-items/${l1}", as: FacultyAdjudicator, captures: { l1_st: "$.data.status", l1_aw: "$.data.awarded_credits" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}", as: FacultyAdjudicator, captures: { ev_st: "$.data.status", ev_reason: "$.data.reopen_reason" } }
          assert:
            - "link 1: Petition.${pet_id}.status == APPROVED"
            - "link 2: EvaluationLineItem.${l1}.status == ADOPTED, resolution == PETITION, awarded_credits == 3.0 (half-step(4.5*2/3) capped by 4.0)"
            - "link 3: TransferCreditEvaluation.${ev_id}.status == IN_REVIEW with reopen_reason == APPEAL_OVERTURN (forced reopen because evaluation was POSTED)"
            - "compensation: TransferStudent.${s_id}.total_posted_transfer_credits == 0.0 (the single DENIED line contributed 0 at post; reopen removes nothing further)"

      - name: clock_expiry_cascades_agreement_equivalency_line
        grounds:
          - state_machines.ArticulationAgreement.ACTIVE_to_EXPIRED
          - state_machines.CourseEquivalency.ACTIVE_to_INACTIVE
          - state_machines.EvaluationLineItem.AUTO_MATCHED_to_PETITION_REQUIRED
        distinguishing_aspect: |
          Depth-3 chain triggered by the logical clock (POST /api/_clock/set_current_utc),
          a different trigger from the sibling instance (appeal adjudication): clock set
          expires the agreement (link 1: ACTIVE -> EXPIRED); the expiry cascade flips its
          equivalencies (link 2: ACTIVE -> INACTIVE); each equivalency flip itself flips
          dependent open line items (link 3: AUTO_MATCHED -> PETITION_REQUIRED, clearing
          equivalency_id/internal_course_id/provisional_credits) and the parent
          evaluation's provisional_credits_total is recomputed as a consequence.
        test_recipe:
          setup:
            - "QUARTER partner; course C1 (MATH, 4.0); agreement window [2024-08-01, 2026-05-10) ACTIVE with equivalency MATH-101 (4.5h) covering term 2025-06-15"
            - "Student; VERIFIED transcript; evaluation created (stays DRAFT) with its line AUTO_MATCHED, provisional_credits == 3.4"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Quarter College", institution_code: "QC", credit_system: "QUARTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2026-05-10" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-101", external_title: "Intro Calc", external_credit_hours: 4.5, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin, captures: { eq_id: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Ed Expiry", email: "ed@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "MATH-101", title: "Intro Calc", credit_hours: 4.5, grade: "B" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_st: "$.data.status" } }
            - { call: "GET /api/course-equivalencies/${eq_id}", as: RegistrarAdmin, captures: { eq_st: "$.data.status" } }
            - { call: "GET /api/evaluation-line-items/${l1}", as: RegistrarAdmin, captures: { l1_st: "$.data.status", l1_eq: "$.data.equivalency_id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}", as: RegistrarAdmin, captures: { ev_prov: "$.data.provisional_credits_total" } }
          assert:
            - "link 1: ArticulationAgreement.${ag_id}.status == EXPIRED (half-open window: clock date 2026-05-10 >= effective_end 2026-05-10 triggers expiry)"
            - "link 2: CourseEquivalency.${eq_id}.status == INACTIVE"
            - "link 3: EvaluationLineItem.${l1}.status == PETITION_REQUIRED with equivalency_id == null and provisional_credits == null"
            - "derived recompute: TransferCreditEvaluation.${ev_id}.provisional_credits_total == 0 (only provisional line cleared)"

  # ==================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ==================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pla_credit_state_precondition_beats_cap
        grounds:
          - validations[priority=7]
          - validations[priority=26]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PLA_CAP_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): re-crediting an already
          CREDITED PLA violates the state precondition (priority 7) AND the fiscal cap
          (priority 26: 24.0 already posted + 24.0 again = 48.0 > MAX_PLA_CREDITS 30).
          The state error ERR_INVALID_STATE must win because state precedes
          business_fiscal in the ordered validation table.
        test_recipe:
          setup:
            - "Student with one PLA: claimed 24.0, verified 24.0, already CREDITED (total_posted_pla_credits == 24.0)"
          setup_api_calls:
            - { call: "POST /api/students", payload: { full_name: "Pat Pla", email: "pat@x.edu", declared_major: "HIST", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/prior-learning-assessments", payload: { student_id: "${s_id}", source_type: "CLEP", credential_ref: "CLEP-1", claimed_credits: 24.0 }, as: Student, as_user_id: "${s_id}", captures: { pla1: "$.data.id" } }
            - { call: "POST /api/prior-learning-assessments/${pla1}/verify", payload: { verified_credits: 24.0 }, as: TransferEvaluator }
            - { call: "POST /api/prior-learning-assessments/${pla1}/credit", as: TransferEvaluator }
          trigger:
            - { call: "POST /api/prior-learning-assessments/${pla1}/credit", as: TransferEvaluator, captures: { err: "$.data.error_id" } }
          assert:
            - "second credit attempt: error_id == ERR_INVALID_STATE (409), NOT ERR_PLA_CAP_EXCEEDED — although both conditions fail, state (p7) precedes business_fiscal (p26)"
            - "TransferStudent.${s_id}.total_posted_pla_credits remains 24.0 (no mutation on rejection)"

      - name: appeal_window_temporal_beats_duplicate_constraint
        grounds:
          - validations[priority=19]
          - validations[priority=22]
          - errors[ERR_APPEAL_WINDOW_EXPIRED]
          - errors[ERR_APPEAL_ALREADY_EXISTS]
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_constraint) — a different
          pair from the sibling instance's (state vs business_fiscal). A second appeal
          filed 31 days after the petition denial violates BOTH the 30-day window
          (priority 19) and the one-appeal-per-petition uniqueness rule (priority 22);
          ERR_APPEAL_WINDOW_EXPIRED must win.
        test_recipe:
          setup:
            - "Petition DENIED at logical time 2026-05-01T00:00:00Z (decided_at); one appeal already filed at 2026-05-11 (within window)"
            - "Logical clock now 2026-06-01T00:00:00Z — 31 days after denial, past the inclusive 30-day window ending 2026-05-31"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Art College", institution_code: "AC", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "ART-200", title: "Sculpture I", credit_hours: 4.0, level: "LOWER", department: "ART", gened_tags: [] }, as: RegistrarAdmin, captures: { c_art: "$.data.id" } }
            - { call: "POST /api/students", payload: { full_name: "Timely Tessa", email: "tessa@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "ART-210", title: "Sculpture", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
            - { call: "POST /api/petitions", payload: { line_item_id: "${l1}", proposed_internal_course_id: "${c_art}", syllabus_ref: "s3://syllabi/art210.pdf" }, as: Student, as_user_id: "${s_id}", captures: { pet_id: "$.data.id" } }
            - { call: "POST /api/petitions/${pet_id}/start-review", as: FacultyAdjudicator, as_user_id: "fac-1" }
            - { call: "POST /api/petitions/${pet_id}/adjudicate", payload: { decision: "DENIED", adjudication_note: "Syllabus lacks required contact hours" }, as: FacultyAdjudicator, as_user_id: "fac-1" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: RegistrarAdmin }
            - { call: "POST /api/appeals", payload: { petition_id: "${pet_id}", grounds: "First appeal with additional documentation" }, as: Student, as_user_id: "${s_id}", captures: { ap1: "$.data.id" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: RegistrarAdmin }
          trigger:
            - { call: "POST /api/appeals", payload: { petition_id: "${pet_id}", grounds: "Second appeal attempt with further evidence" }, as: Student, as_user_id: "${s_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_APPEAL_WINDOW_EXPIRED (422), NOT ERR_APPEAL_ALREADY_EXISTS — both fail (clock 2026-06-01 > decided_at 2026-05-01 + 30d AND appeal ${ap1} exists); business_temporal (p19) precedes business_constraint (p22)"

  # ==================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ==================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: grade_points_two_zero_inclusive_boundary
        grounds:
          - calculations.grade_point_conversion
          - state_machines.EvaluationLineItem.PENDING_to_AUTO_MATCHED
          - state_machines.EvaluationLineItem.PENDING_to_DENIED
        distinguishing_aspect: |
          Metric = grade points; endpoint = POST /api/transfer-credit-evaluations.
          The transferability threshold is inclusive at 2.0: a C (exactly 2.0) is
          AUTO_MATCHED while a C- (1.7) is auto-DENIED with resolution AUTO_GRADE.
          Exact boundary precision (>= vs >) on the grade-point metric.
        test_recipe:
          setup:
            - "QUARTER partner; course C1 (MATH, 4.0); ACTIVE agreement with equivalencies for MATH-101 and MATH-102 (both 4.5h, windows covering 2025-06-15)"
            - "Student; VERIFIED transcript with MATH-101 grade C (2.0) and MATH-102 grade C- (1.7)"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Quarter College", institution_code: "QC", credit_system: "QUARTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-101", external_title: "Calc 1", external_credit_hours: 4.5, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-102", external_title: "Calc 2", external_credit_hours: 4.5, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Grace Boundary", email: "grace@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "MATH-101", title: "Calc 1", credit_hours: 4.5, grade: "C" }, { external_course_code: "MATH-102", title: "Calc 2", credit_hours: 4.5, grade: "C-" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l_c_st: "$.data[0].status", l_cm_st: "$.data[1].status", l_cm_res: "$.data[1].resolution" } }
          assert:
            - "line[0] (grade C, grade_points == 2.0 exactly): status == AUTO_MATCHED — the >= 2.0 boundary is inclusive"
            - "line[1] (grade C-, grade_points == 1.7): status == DENIED and resolution == AUTO_GRADE with denial_reason == GRADE_BELOW_TRANSFER_THRESHOLD"

      - name: pla_cap_exact_thirty_boundary
        grounds:
          - calculations.pla_cap_allocation
          - state_machines.PriorLearningAssessment.VERIFIED_to_CREDITED
          - errors[ERR_PLA_CAP_EXCEEDED]
        distinguishing_aspect: |
          Metric = cumulative posted PLA credits (distinct from the sibling's grade
          points); endpoint = POST /api/prior-learning-assessments/{id}/credit
          (distinct from the sibling's evaluation create). Crediting to exactly
          MAX_PLA_CREDITS (24.0 + 6.0 == 30.0) is allowed (<= boundary), while the
          next 1.0 credit (30.0 + 1.0 > 30.0) is rejected with ERR_PLA_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "Student with PLA1 CREDITED at 24.0; PLA2 VERIFIED at 6.0; PLA3 VERIFIED at 1.0"
          setup_api_calls:
            - { call: "POST /api/students", payload: { full_name: "Cap Carl", email: "carl@x.edu", declared_major: "HIST", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/prior-learning-assessments", payload: { student_id: "${s_id}", source_type: "MILITARY_JST", credential_ref: "JST-1", claimed_credits: 24.0 }, as: Student, as_user_id: "${s_id}", captures: { pla1: "$.data.id" } }
            - { call: "POST /api/prior-learning-assessments/${pla1}/verify", payload: { verified_credits: 24.0 }, as: TransferEvaluator }
            - { call: "POST /api/prior-learning-assessments/${pla1}/credit", as: TransferEvaluator }
            - { call: "POST /api/prior-learning-assessments", payload: { student_id: "${s_id}", source_type: "CLEP", credential_ref: "CLEP-2", claimed_credits: 6.0 }, as: Student, as_user_id: "${s_id}", captures: { pla2: "$.data.id" } }
            - { call: "POST /api/prior-learning-assessments/${pla2}/verify", payload: { verified_credits: 6.0 }, as: TransferEvaluator }
            - { call: "POST /api/prior-learning-assessments", payload: { student_id: "${s_id}", source_type: "AP", credential_ref: "AP-3", claimed_credits: 1.0 }, as: Student, as_user_id: "${s_id}", captures: { pla3: "$.data.id" } }
            - { call: "POST /api/prior-learning-assessments/${pla3}/verify", payload: { verified_credits: 1.0 }, as: TransferEvaluator }
          trigger:
            - { call: "POST /api/prior-learning-assessments/${pla2}/credit", as: TransferEvaluator, captures: { pla2_st: "$.data.status" } }
            - { call: "POST /api/prior-learning-assessments/${pla3}/credit", as: TransferEvaluator, captures: { err: "$.data.error_id" } }
            - { call: "GET /api/students/${s_id}", as: TransferEvaluator, captures: { pla_total: "$.data.total_posted_pla_credits" } }
          assert:
            - "PLA2 credit succeeds: status == CREDITED (24.0 + 6.0 == 30.0 == MAX_PLA_CREDITS, <= boundary inclusive)"
            - "PLA3 credit rejected: error_id == ERR_PLA_CAP_EXCEEDED (30.0 + 1.0 > 30.0)"
            - "TransferStudent.${s_id}.total_posted_pla_credits == 30.0 (exactly at cap)"

  # ==================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ==================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: post_blocked_when_equivalency_agreement_suspended
        grounds:
          - validations[priority=13]
          - state_machines.TransferCreditEvaluation.EVALUATED_to_POSTED
          - state_machines.ArticulationAgreement.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair (TransferCreditEvaluation, ArticulationAgreement): the
          evaluation's EVALUATED -> POSTED transition is gated on the state of a
          DIFFERENT entity — every ADOPTED line's equivalency agreement must be ACTIVE.
          Suspending the agreement between finalize and post blocks the post with
          ERR_AGREEMENT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "QUARTER partner; C1 (MATH, 4.0); ACTIVE agreement with equivalency MATH-101; evaluation EVALUATED (line ADOPTED via auto-match) by eval-a"
            - "Agreement then SUSPENDED (cascade flips nothing because the line is already ADOPTED, not AUTO_MATCHED)"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Quarter College", institution_code: "QC", credit_system: "QUARTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-101", external_title: "Intro Calc", external_credit_hours: 4.5, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Gated Gail", email: "gail@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "MATH-101", title: "Intro Calc", credit_hours: 4.5, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
            - { call: "POST /api/evaluation-line-items/${l1}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
            - { call: "POST /api/articulation-agreements/${ag_id}/suspend", as: RegistrarAdmin }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/post", as: TransferEvaluator, as_user_id: "eval-b", captures: { err: "$.data.error_id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}", as: TransferEvaluator, captures: { ev_st: "$.data.status" } }
          assert:
            - "post rejected: error_id == ERR_AGREEMENT_NOT_ACTIVE (the ADOPTED line's equivalency belongs to a SUSPENDED agreement)"
            - "TransferCreditEvaluation.${ev_id}.status remains EVALUATED (no partial mutation)"

      - name: guide_publish_blocked_without_active_agreement
        grounds:
          - validations[priority=16.5]
          - state_machines.TransferGuide.DRAFT_to_PUBLISHED
          - errors[ERR_GUIDE_NO_ACTIVE_AGREEMENT]
        distinguishing_aspect: |
          Entity pair (TransferGuide, ArticulationAgreement) — a different pair from
          the sibling instance's (TransferCreditEvaluation, ArticulationAgreement):
          the guide's DRAFT -> PUBLISHED transition requires at least one ACTIVE
          agreement for the partner; with only a DRAFT agreement, publish fails with
          ERR_GUIDE_NO_ACTIVE_AGREEMENT.
        test_recipe:
          setup:
            - "Partner exists; one agreement in DRAFT (never activated); transfer guide in DRAFT for that partner"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Guide College", institution_code: "GC", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/transfer-guides", payload: { partner_institution_id: "${p_id}", catalog_year: 2026 }, as: RegistrarAdmin, captures: { g_id: "$.data.id" } }
          trigger:
            - { call: "POST /api/transfer-guides/${g_id}/publish", as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
            - { call: "GET /api/transfer-guides/${g_id}", as: RegistrarAdmin, captures: { g_st: "$.data.status" } }
          assert:
            - "publish rejected: error_id == ERR_GUIDE_NO_ACTIVE_AGREEMENT"
            - "TransferGuide.${g_id}.status remains DRAFT"

  # ==================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ==================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: agreement_windows_half_open_adjacency_allowed
        grounds:
          - validations[priority=17]
          - entities.ArticulationAgreement.fields.effective_end
          - errors[ERR_AGREEMENT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN [effective_start, effective_end) on
          ArticulationAgreement: a successor agreement starting exactly at the
          predecessor's end (2027-07-31) is ADJACENT and allowed, while starting one
          day earlier (2027-07-30) overlaps and is rejected. Distinct entity and
          semantics from the sibling instance (closed windows on CourseEquivalency).
        test_recipe:
          setup:
            - "Partner exists; agreement A1 [2024-08-01, 2027-07-31) in DRAFT for scope ALL"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Adjacent College", institution_code: "AJ", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { a1: "$.data.id" } }
          trigger:
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2027-07-31", effective_end: "2028-07-31" }, as: RegistrarAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2027-07-30", effective_end: "2028-07-31" }, as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "A2 (start == A1.end) created successfully with status DRAFT — adjacency is allowed under half-open semantics"
            - "A3 (start 2027-07-30 < A1.end) rejected: error_id == ERR_AGREEMENT_WINDOW_OVERLAP"

      - name: equivalency_windows_closed_adjacency_rejected
        grounds:
          - validations[priority=18]
          - entities.CourseEquivalency.fields.effective_until
          - errors[ERR_EQUIVALENCY_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = CLOSED [effective_from, effective_until] on
          CourseEquivalency — the OPPOSITE geometric treatment from the sibling
          instance's half-open agreement windows: a follow-on equivalency whose
          effective_from equals the predecessor's effective_until (2025-07-31)
          OVERLAPS (both claim that date) and is rejected; only a strictly-later start
          (2025-08-01) is allowed.
        test_recipe:
          setup:
            - "Partner, course C1, ACTIVE agreement (version observed at 2 after activation)"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Closed College", institution_code: "CL", credit_system: "QUARTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
          trigger:
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-101", external_title: "Calc v1", external_credit_hours: 4.5, effective_from: "2024-08-01", effective_until: "2025-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin, captures: { eq1: "$.data.id" } }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v2: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-101", external_title: "Calc v2", external_credit_hours: 4.5, effective_from: "2025-07-31", effective_until: "2026-07-31", expected_agreement_version: "${ag_v2}" }, as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-101", external_title: "Calc v3", external_credit_hours: 4.5, effective_from: "2025-08-01", effective_until: "2026-07-31", expected_agreement_version: "${ag_v2}" }, as: RegistrarAdmin, captures: { eq3: "$.data.id" } }
          assert:
            - "EQ1 [2024-08-01, 2025-07-31] created (201)"
            - "EQ2 with effective_from == 2025-07-31 (touching EQ1's inclusive end) rejected: error_id == ERR_EQUIVALENCY_WINDOW_OVERLAP — closed intervals treat adjacency as overlap"
            - "EQ3 with effective_from == 2025-08-01 created (201); the failed EQ2 did not bump the agreement version, so ${ag_v2} remains valid for EQ3"

  # ==================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ==================================================================
  - rule_id: compensating_invariant
    instances:
      - name: post_reopen_conserves_posted_credit_total
        grounds:
          - calculations.posted_transfer_credit_ledger
          - state_machines.TransferCreditEvaluation.EVALUATED_to_POSTED
          - state_machines.TransferCreditEvaluation.POSTED_to_IN_REVIEW
          - entities.TransferStudent.fields.total_posted_transfer_credits
        distinguishing_aspect: |
          Conserved quantity = the student's posted transfer credit ledger (a credit
          sum): post adds exactly sum(applied_credits), the paired reopen subtracts
          exactly the same amount, so total_posted_transfer_credits after the
          post->reopen pair equals its pre-post value (0.0). Distinct quantity type
          from the sibling instance (active-equivalency cardinality).
        test_recipe:
          setup:
            - "SEMESTER partner, C1 (MATH, 4.0), ACTIVE agreement, equivalency M-101 -> C1; student; evaluation fully posted with the single line applied at 4.0"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "State University", institution_code: "SU", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin }
            - { call: "POST /api/students", payload: { full_name: "Ledger Liz", email: "liz@x.edu", declared_major: "MATH", catalog_year: 2026 }, as: RegistrarAdmin, captures: { s_id: "$.data.id", s_v0: "$.data.version" } }
            - { call: "POST /api/transcripts", payload: { student_id: "${s_id}", partner_institution_id: "${p_id}", term_completed: "2025-06-15", courses: [ { external_course_code: "M-101", title: "Calc", credit_hours: 4.0, grade: "A" } ] }, as: TransferCenterStaff, captures: { t_id: "$.data.id" } }
            - { call: "POST /api/transcripts/${t_id}/verify", as: TransferCenterStaff }
            - { call: "POST /api/transfer-credit-evaluations", payload: { student_id: "${s_id}", transcript_id: "${t_id}" }, as: TransferEvaluator, captures: { ev_id: "$.data.id" } }
            - { call: "GET /api/transfer-credit-evaluations/${ev_id}/line-items", as: TransferEvaluator, captures: { l1: "$.data[0].id" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/start-review", as: TransferEvaluator }
            - { call: "POST /api/evaluation-line-items/${l1}/adopt", payload: {}, as: TransferEvaluator }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/finalize", as: TransferEvaluator, as_user_id: "eval-a" }
          trigger:
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/post", as: TransferEvaluator, as_user_id: "eval-b" }
            - { call: "GET /api/students/${s_id}", as: TransferEvaluator, captures: { tot_after_post: "$.data.total_posted_transfer_credits" } }
            - { call: "POST /api/transfer-credit-evaluations/${ev_id}/reopen", payload: { reason: "Recheck requested" }, as: TransferEvaluator }
            - { call: "GET /api/students/${s_id}", as: TransferEvaluator, captures: { tot_after_reopen: "$.data.total_posted_transfer_credits" } }
            - { call: "GET /api/requirement-applications", payload: { student_id: "${s_id}" }, as: TransferEvaluator }
          assert:
            - "after post: TransferStudent.${s_id}.total_posted_transfer_credits == 4.0 (sum of applied_credits over POSTED lines)"
            - "after reopen: TransferStudent.${s_id}.total_posted_transfer_credits == 0.0 — exactly the pre-post value; the forward+compensating pair conserves the ledger"
            - "after reopen: GET /api/requirement-applications?student_id returns an empty list (applications deleted by compensation)"

      - name: suspend_reactivate_conserves_active_equivalency_count
        grounds:
          - calculations.equivalency_activation_invariant
          - state_machines.ArticulationAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ArticulationAgreement.SUSPENDED_to_ACTIVE
          - entities.CourseEquivalency.fields.status
        distinguishing_aspect: |
          Conserved quantity = the cardinality of ACTIVE equivalencies under the
          agreement (a count, distinct from the sibling instance's credit sum): the
          suspend -> reactivate pair restores exactly the suspended set, so
          count(status == ACTIVE) after reactivate == count before suspend == 2.
        test_recipe:
          setup:
            - "Partner; courses C1 (MATH) and C2 (ENGL); agreement ACTIVE with two equivalencies EQ1 (MATH-101) and EQ2 (ENGL-101), both ACTIVE"
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Count College", institution_code: "CT", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "ENGL-150", title: "Literature", credit_hours: 3.0, level: "LOWER", department: "ENGL", gened_tags: [] }, as: RegistrarAdmin, captures: { c2: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "MATH-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin, captures: { eq1: "$.data.id" } }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v: "$.data.version" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c2}", external_course_code: "ENGL-101", external_title: "Lit", external_credit_hours: 3.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v}" }, as: RegistrarAdmin, captures: { eq2: "$.data.id" } }
          trigger:
            - { call: "POST /api/articulation-agreements/${ag_id}/suspend", as: RegistrarAdmin }
            - { call: "GET /api/course-equivalencies/${eq1}", as: RegistrarAdmin, captures: { eq1_mid: "$.data.status" } }
            - { call: "GET /api/course-equivalencies/${eq2}", as: RegistrarAdmin, captures: { eq2_mid: "$.data.status" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/reactivate", as: RegistrarAdmin }
            - { call: "GET /api/course-equivalencies/${eq1}", as: RegistrarAdmin, captures: { eq1_end: "$.data.status" } }
            - { call: "GET /api/course-equivalencies/${eq2}", as: RegistrarAdmin, captures: { eq2_end: "$.data.status" } }
          assert:
            - "before suspend: count(ACTIVE equivalencies under ${ag_id}) == 2 (EQ1 and EQ2 both ACTIVE)"
            - "after suspend: EQ1 == INACTIVE and EQ2 == INACTIVE (count ACTIVE == 0)"
            - "after reactivate: EQ1 == ACTIVE and EQ2 == ACTIVE — count after reactivate (2) == count before suspend (2); the suspend+reactivate pair conserves active-equivalency cardinality"
