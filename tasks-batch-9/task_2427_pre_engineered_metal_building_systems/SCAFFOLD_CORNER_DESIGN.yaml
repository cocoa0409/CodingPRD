        distinguishing_aspect: "Three distinct temporal rules meet here: a lot window that starts before the logical clock is 422 ERR_LOT_WINDOW_IN_PAST; an inverted or empty range is 400 ERR_INVALID_WINDOW_RANGE on both the lot and the load endpoint; and a window starting exactly at the current clock instant is accepted because the rule is 'before the clock', not 'at or before'."
