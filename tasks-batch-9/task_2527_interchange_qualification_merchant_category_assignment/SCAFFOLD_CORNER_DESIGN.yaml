              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { final_uncommitted: $.data.uncommitted_capacity_cents, final_count: $.data.enrolled_count, final_state: $.data.enrollment_state, final_capacity: $.data.total_capacity_cents }
          assert:
            - "${mid_uncommitted} == 14000000"
            - "${mid_state} == OPEN"
            - "${final_capacity} == 20000000"
            - "${final_uncommitted} == 5000000"
            - "${final_count} == 2"
            - "${final_state} == CLOSED_FULL"
            - "IncentiveEnrollment.${enr_a}.status == ENROLLED"
            - "IncentiveEnrollment.${enr_b}.status == ENROLLED"

      - name: endpoint_cross_reference_link_window_with_an_unknown_rate_version_returns_404
