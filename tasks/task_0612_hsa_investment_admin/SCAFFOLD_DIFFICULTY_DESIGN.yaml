            - "Distribution.${d_id}.status remains REQUESTED; HsaAccount.${acc_id}.cash_balance_cents == 80000"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: coverage_period_closed_closed_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_COVERAGE_OVERLAP]
          - entities.CoveragePeriod.fields.effective_month
          - entities.CoveragePeriod.fields.end_month
        distinguishing_aspect: |
          CoveragePeriod uses CLOSED-CLOSED month intervals: an existing ATTESTED period months 1..6 and a
          new period months 6..9 share month 6 and are rejected ERR_COVERAGE_OVERLAP, whereas an adjacent
          period months 7..9 (boundary at 6/7) would be accepted. Resource CoveragePeriod on HsaAccount;
          adjacency-allowed semantics distinct from instance #2's half-open PayrollPeriod.
        test_recipe:
          setup:
            - "Account (PENDING_VERIFICATION is fine; coverage attestation does not require ACTIVE) with one ATTESTED CoveragePeriod SELF_ONLY months 1..6."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Ko Lin", email: "ko.lin@x.com", date_of_birth: "1975-05-25" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "SELF_ONLY", effective_month: 1, end_month: 6 }
              as: AccountAdmin
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "FAMILY", effective_month: 6, end_month: 9 }
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_COVERAGE_OVERLAP (closed-closed: months 1..6 and 6..9 share month 6)"

      - name: payroll_period_half_open_overlap
        grounds:
          - validations[priority=12b]
          - errors[ERR_PAYROLL_PERIOD_OVERLAP]
          - entities.PayrollPeriod.fields.period_start_day
          - entities.PayrollPeriod.fields.period_end_day
        distinguishing_aspect: |
          PayrollPeriod uses HALF-OPEN [start, end) day intervals on a DIFFERENT resource (Employer): an
          existing SCHEDULED period [1, 15) and a new period [10, 20) overlap on days 10..14 and are
          rejected, whereas a new period [15, 20) (start == prior end) shares NO point and would be
          accepted. Half-open / adjacency-forbidden-at-shared-interior semantics distinct from instance #1.
        test_recipe:
          setup:
            - "Employer E with one SCHEDULED PayrollPeriod [1, 15) (period_start_day 1, period_end_day 15)."
          setup_api_calls:
            - call: "POST /hsa/employers"
              payload: { name: "Globex" }
              as: AccountAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /hsa/employers/${emp_id}/payroll-periods"
              payload: { period_start_day: 1, period_end_day: 15 }
              as: AccountAdmin
          trigger:
            - call: "POST /hsa/employers/${emp_id}/payroll-periods"
              payload: { period_start_day: 10, period_end_day: 20 }
              as: AccountAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_PAYROLL_PERIOD_OVERLAP (half-open [1,15) and [10,20) overlap on days 10..14)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: distribution_reverse_conserves_cash
        grounds:
          - state_machines.Distribution.REQUESTED_to_CLEARED
          - state_machines.Distribution.CLEARED_to_REVERSED
          - entities.HsaAccount.fields.cash_balance_cents
        distinguishing_aspect: |
          Conserved quantity = cash_balance_cents. Clearing a 80000 distribution lowers cash by 80000;
          reversing it raises cash by exactly 80000, so cash_balance_cents returns to its pre-clear value
          (300000). Invariant: post-reverse cash == pre-clear cash. Distinct conserved quantity from
          instance #2 (cash+invested total).
        test_recipe:
          setup:
            - "ACTIVE account, cash 300000 from a posted INDIVIDUAL contribution of 300000; holder requests a 80000 REIMBURSEMENT distribution d; adminA clears d (cash 220000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Mo Nair", email: "mo.nair@x.com", date_of_birth: "1977-07-17" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "FAMILY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 300000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/distributions"
              payload: { method: "REIMBURSEMENT", amount_cents: 80000 }
              as: Accountholder
              as_user_id: "${h_id}"
              captures: { d_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d_id}/clear"
              as: AccountAdmin
              as_user_id: "adminA"
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/distributions/${d_id}/reverse"
              as: AccountAdmin
              as_user_id: "adminB"
          assert:
            - "Distribution.${d_id}.status == REVERSED"
            - "HsaAccount.${acc_id}.cash_balance_cents == 300000 (restored to pre-clear value; clear -80000 then reverse +80000 nets 0)"

      - name: sweep_unwind_conserves_cash_plus_invested
        grounds:
          - state_machines.InvestmentSweep.EXECUTED_to_UNWOUND
          - entities.HsaAccount.fields.cash_balance_cents
          - entities.HsaAccount.fields.invested_balance_cents
        distinguishing_aspect: |
          Conserved quantity = cash_balance_cents + invested_balance_cents. Sweeping 300000 from cash
          500000 yields cash 200000 / invested 300000 (total 500000); unwinding returns cash 500000 /
          invested 0 (total still 500000). Invariant: cash+invested unchanged across sweep+unwind.
          Distinct conserved quantity from instance #1 (cash alone).
        test_recipe:
          setup:
            - "ACTIVE account, cash 500000 from a posted INDIVIDUAL contribution of 500000; an EXECUTED InvestmentSweep of 300000 (cash 200000, invested 300000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AccountAdmin
            - call: "POST /hsa/accountholders"
              payload: { full_name: "Ned Orr", email: "ned.orr@x.com", date_of_birth: "1976-06-16" }
              as: AccountAdmin
              captures: { h_id: $.data.id }
            - call: "POST /hsa/accounts"
              payload: { accountholder_id: "${h_id}", plan_year: 2026 }
              as: AccountAdmin
              captures: { acc_id: $.data.id, tok: $.data.verification_token }
            - call: "POST /hsa/accounts/${acc_id}/coverage-periods"
              payload: { coverage_tier: "FAMILY", effective_month: 1, end_month: 12 }
              as: AccountAdmin
            - call: "POST /hsa/accounts/${acc_id}/verify"
              payload: { verification_token: "${tok}" }
              as: Accountholder
              as_user_id: "${h_id}"
            - call: "POST /hsa/accounts/${acc_id}/contributions"
              payload: { channel: "INDIVIDUAL", amount_cents: 500000 }
              as: AccountAdmin
              captures: { c_id: $.data.id }
            - call: "POST /hsa/accounts/${acc_id}/contributions/${c_id}/post"
              as: AccountAdmin
            - call: "GET /hsa/accounts/${acc_id}"
              as: AccountAdmin
              captures: { acc_v: $.data.version }
            - call: "POST /hsa/accounts/${acc_id}/sweeps"
              payload: { requested_amount_cents: 300000, expected_account_version: "${acc_v}" }
              as: AccountAdmin
              captures: { sweep_id: $.data.id }
          trigger:
            - call: "POST /hsa/accounts/${acc_id}/sweeps/${sweep_id}/unwind"
              as: AccountAdmin
          assert:
            - "InvestmentSweep.${sweep_id}.status == UNWOUND"
            - "HsaAccount.${acc_id}.cash_balance_cents == 500000 and invested_balance_cents == 0"
            - "cash_balance_cents + invested_balance_cents == 500000 before AND after unwind (conserved)"
