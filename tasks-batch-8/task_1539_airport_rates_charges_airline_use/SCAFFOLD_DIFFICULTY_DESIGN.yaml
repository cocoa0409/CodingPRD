              captures: { rs_xsa_id: $.data.id }
            - call: "POST /airport/rates_settings/{rs_xsa_id}/publish"
              payload: {}
              as: AirportFinance
            - call: "POST /airport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AirportFinance
            - call: "POST /airport/rates_settings/{rs_xsa_id}/adopt"
              payload: {}
              as: AirportDirector
            - call: "POST /airport/airline_agreements/{ag_sa_id}/countersign"
              payload: {}
              as: SignatoryAirline
              as_user_id: "${sa_id}"
            - call: "POST /airport/fiscal_years/{fy_xsa_id}/activity_records"
              payload: { airline_id: "${sa_id}", activity_date: "2026-09-10T00:00:00Z", landed_weight_kg: 1000, signature_status_at_activity: "SIGNATORY" }
