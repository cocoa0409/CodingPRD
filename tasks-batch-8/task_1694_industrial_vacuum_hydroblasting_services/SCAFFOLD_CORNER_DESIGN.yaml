# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# =============================================================================
scaffold_corner_design:
  # ================================================================ entities
  - section: entities
    instances:
      - name: site_creation_applies_defaults
        claim_type: defaults
        grounds: ["entities.Site.fields.credit_status", "endpoints[POST /v1/sites]"]
        distinguishing_aspect: "Omitting credit_status at site creation applies the default GOOD_STANDING and active_rate_schedule_id starts null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id } }
          trigger:
            - { call: "GET /v1/sites/${site_id}", payload: {}, as: ProjectManager }
          assert:
            - "Site.${site_id}.credit_status == GOOD_STANDING (default applied)"
            - "Site.${site_id}.active_rate_schedule_id is null and version == 1"

      - name: job_pins_rate_schedule_at_creation
        claim_type: system_fields
        grounds: ["entities.Job.fields.pinned_rate_schedule_id", "complexity_profile.complexity_layers"]
        distinguishing_aspect: "Version-pinning: a job created while schedule S1 is ACTIVE pins S1 forever; activating a replacement S2 afterwards does NOT retarget the existing job."
        test_recipe:
          setup: ["Site with S1 ACTIVE; job J created (pins S1); S2 created and activated (S1 -> SUPERSEDED)"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Pinned job" }, as: ProjectManager, captures: { job_id: $.data.id, job_pin: $.data.pinned_rate_schedule_id } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S2", vacuum_per_gallon_cents: 999, hydroblast_per_foot_cents: 9999, labor_rate_cents_per_hour: 9999, equipment_rate_cents_per_hour: 9999, standby_rate_cents_per_hour: 9999, overtime_multiplier: 2.0, minimum_invoice_cents: 1 }, as: AccountManager, captures: { s2: $.data.id } }
            - { call: "GET /v1/sites/${site_id}", payload: {}, as: AccountManager, captures: { site_v2: $.data.version } }
            - { call: "POST /v1/rate-schedules/${s2}/activate", payload: { expected_site_version: "${site_v2}" }, as: AccountManager }
          trigger:
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_pin_after: $.data.pinned_rate_schedule_id } }
          assert:
            - "job_pin == ${s1} at creation"
            - "job_pin_after == ${s1} still, after S2 activation (RateSchedule.${s1}.status == SUPERSEDED)"

      - name: entity_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /v1/jobs without pricing_mode fails shape validation with ERR_INVALID_REQUEST (400) before any state or business check."
        test_recipe:
          setup: ["Site with ACTIVE schedule"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
          trigger:
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", description: "no pricing mode" }, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status 400"

      - name: entity_invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "entities.Job.fields.job_type"]
        distinguishing_aspect: "job_type SANDBLAST is not in {VACUUM, HYDROBLAST, COMBINED}; rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Site with ACTIVE schedule"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
          trigger:
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "SANDBLAST", pricing_mode: "UNIT_RATE", description: "bad enum" }, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST and HTTP status 400"

      - name: entity_get_with_unknown_id_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/jobs/{random uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/jobs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404"

      - name: waste_profile_retrieval_echoes_stored_fields
        claim_type: retrieval
        grounds: ["endpoints[GET /v1/waste-profiles/{profileId}]"]
        distinguishing_aspect: "GET by id returns exactly the stored characterization fields including density 8.345 and variance_basis VOLUME."
        test_recipe:
          setup: ["Site + facility + DRAFT profile"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Bayport Terminal" }, as: AccountManager, captures: { site_id: $.data.id } }
            - { call: "POST /v1/disposal-facilities", payload: { name: "Gulf Coast TSDF", epa_id: "TXD0001", total_capacity_tons: 1000 }, as: PlatformAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /v1/waste-profiles", payload: { site_id: "${site_id}", facility_id: "${fac_id}", waste_code: "D008", hazard_class: "HAZ", density_lbs_per_gal: 8.345, disposal_rate_per_ton_cents: 35000, variance_basis: "VOLUME" }, as: ComplianceOfficer, captures: { prof_id: $.data.id } }
          trigger:
            - { call: "GET /v1/waste-profiles/${prof_id}", payload: {}, as: ProjectManager }
          assert:
            - "WasteProfile.${prof_id}: density_lbs_per_gal == 8.345, variance_basis == VOLUME, disposal_rate_per_ton_cents == 35000, status == DRAFT"

      - name: jobs_list_paginates_with_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /v1/jobs]"]
        distinguishing_aspect: "GET /v1/jobs?site_id=X&limit=2 returns 2 items with total_count 3 and has_more true; offset=2 returns the last item with has_more false."
        test_recipe:
          setup: ["Site with ACTIVE schedule and 3 jobs"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "J1" }, as: ProjectManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "J2" }, as: ProjectManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "HYDROBLAST", pricing_mode: "TIME_AND_MATERIALS", description: "J3" }, as: ProjectManager }
          trigger:
            - { call: "GET /v1/jobs?site_id=${site_id}&limit=2&offset=0", payload: {}, as: ProjectManager }
            - { call: "GET /v1/jobs?site_id=${site_id}&limit=2&offset=2", payload: {}, as: ProjectManager }
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"

      - name: system_fields_minted_by_server_at_logical_clock
        claim_type: system_fields
        grounds: ["entities.EquipmentUnit", "response_envelope"]
        distinguishing_aspect: "Created entity carries server-minted id (UUID), version 1, and created_at equal to the logical clock default 2026-08-01T00:00:00Z (rendered with three fractional digits)."
        test_recipe:
          setup: ["empty DB; logical clock unset (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-09", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id, unit_v: $.data.version, unit_created: $.data.created_at } }
          assert:
            - "unit_v == 1"
            - "unit_created == 2026-08-01T00:00:00.000Z (logical clock default, not wall clock)"

  # ================================================================ state_machines
  - section: state_machines
    instances:
      - name: job_cancel_from_terminal_state_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.Job.QUOTED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on an already-CANCELLED job is rejected ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["QUOTED job (no assignments) cancelled once"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "cancel twice" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/jobs/${job_id}/cancel", payload: {}, as: ProjectManager }
          trigger:
            - { call: "POST /v1/jobs/${job_id}/cancel", payload: {}, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (CANCELLED is terminal)"

      - name: invoice_paid_terminal_cannot_be_voided
        claim_type: terminal_lockdown
        grounds: ["state_machines.Invoice.ISSUED_to_PAID", "state_machines.Invoice.DRAFT_to_VOID"]
        distinguishing_aspect: "Voiding a PAID invoice is rejected ERR_INVALID_STATE; PAID is terminal."
        test_recipe:
          setup: ["Job INVOICED; invoice ISSUED then PAID"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "paid lockdown" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["SLIP_TRIP"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_id}", water_used_gallons: 500, water_captured_gallons: 500 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_id: $.data.id } }
            - { call: "POST /v1/containment-records/${cr_id}/verify", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/complete-field-work", payload: { gallons_removed: 1000, feet_cleaned: 0 }, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/generate-invoice", payload: {}, as: ProjectManager, captures: { inv_id: $.data.id } }
            - { call: "POST /v1/invoices/${inv_id}/issue", payload: {}, as: AccountManager }
            - { call: "POST /v1/invoices/${inv_id}/mark-paid", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /v1/invoices/${inv_id}/void", payload: {}, as: AccountManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and Invoice.${inv_id}.status == PAID"

      - name: manifest_depart_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.DisposalManifest"]
        distinguishing_aspect: "depart requires ISSUED; a DRAFT manifest cannot depart (ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Job IN_PROGRESS; manifest DRAFT"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Bayport Terminal" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/disposal-facilities", payload: { name: "Gulf Coast TSDF", epa_id: "TXD0001", total_capacity_tons: 1000 }, as: PlatformAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /v1/waste-profiles", payload: { site_id: "${site_id}", facility_id: "${fac_id}", waste_code: "D008", hazard_class: "HAZ", density_lbs_per_gal: 8.0, disposal_rate_per_ton_cents: 35000, variance_basis: "WEIGHT" }, as: ComplianceOfficer, captures: { prof_id: $.data.id } }
            - { call: "POST /v1/waste-profiles/${prof_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /v1/waste-profiles/${prof_id}/approve", payload: {}, as: EnvironmentalApprover, as_user_id: "ea_1" }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "depart early" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests", payload: { job_id: "${job_id}", waste_profile_id: "${prof_id}", estimated_gallons: 1000 }, as: ProjectManager, captures: { man_id: $.data.id } }
          trigger:
            - { call: "POST /v1/manifests/${man_id}/depart", payload: {}, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE and DisposalManifest.${man_id}.status == DRAFT"

      - name: jha_approve_from_draft_rejected_after_occ_passes
        claim_type: invalid_transition
        grounds:
          - state_machines.JobHazardAnalysis.SUBMITTED_to_APPROVED
          - concurrency_rules[jha-approval-stale-job]
        distinguishing_aspect: "Approve on a DRAFT JHA with a CORRECT expected_job_version passes the OCC check (priority 5) and then fails the state check (priority 6) with ERR_INVALID_STATE — proving check order OCC-then-state."
        test_recipe:
          setup: ["QUOTED job; JHA DRAFT (never submitted)"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "occ-then-state" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["SLIP_TRIP"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
          trigger:
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (not ERR_STALE_VERSION: the OCC check passed with the fresh version)"

      - name: permit_double_activation_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Permit.ISSUED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Activating an already-ACTIVE permit (idempotency probe) is rejected ERR_INVALID_STATE."
        test_recipe:
          setup: ["MOBILIZED job; HOT_WORK permit ACTIVE"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S1", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { s1: $.data.id } }
            - { call: "POST /v1/rate-schedules/${s1}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-02", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "double activate" }, as: ProjectManager, captures: { job_id: $.data.id } }
