# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1224 — Vessel Agency & Port Call Coordination (harder-than-expert)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: da_estimate_vs_final_tariff_supersede
        grounds:
          - calculations.port_dues_calc
          - calculations.da_totals_calc
          - entities.DALine.fields.tariff_id
          - state_machines.PortCall.ALONGSIDE_to_SAILED
        distinguishing_aspect: |
          Entity domain DisbursementAccount: the ESTIMATE variant pins the tariff published at DA creation
          (272250 cents for GT 30000 / 3 estimated days under tariff v1) while the FINAL variant recomputes at
          sailing under the SUPERSEDING tariff v2 with actual days (408000 cents for 4 actual days) — identical
          port call, two valid algorithms, different money.
        test_recipe:
          setup:
            - "Port call SINGA GT 30000 hazmat, eta 2026-06-10T20:00Z (night), etd 2026-06-13T01:00Z (53h -> 3 estimated days)"
            - "Tariff v1 (2.0/1.5 cents per GT-day, night 0.25, hazmat 0.40) published before DA creation; v2 (2.2/1.6, night 0.30) published after"
            - "DA PRO_FORMA holds PORT_DUES line estimated 272250 pinned to v1; call fully cleared and ALONGSIDE; DA FUNDED via 250000 advance"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /principals", payload: { name: "Apex Shipping", contact_email: "ops@apex.example", credit_limit_cents: 0 }, as: AgencyAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /port-calls", payload: { principal_id: "${p_id}", vessel_name: "MV Meridian", imo_number: "9074729", vessel_gt: 30000, flag_state: "PA", port_code: "SINGA", eta: "2026-06-10T20:00:00Z", etd: "2026-06-13T01:00:00Z", cargo_description: "grain containers", hazmat_flag: true }, as: AgencyOps, as_user_id: "ops-1", captures: { pc_id: "$.data.id", pc_v: "$.data.version" } }
            - { call: "POST /tariffs", payload: { port_code: "SINGA", component: "PORT_DUES", effective_from: "2026-01-01T00:00:00Z", night_surcharge_pct: 0.25, hazmat_surcharge_pct: 0.40, gt_tiers: [ { gt_up_to: 20000, rate_cents: 2.0 }, { gt_up_to: null, rate_cents: 1.5 } ] }, as: PortAuthority, captures: { tar_v1: "$.data.id" } }
            - { call: "POST /disbursement-accounts", payload: { port_call_id: "${pc_id}", expected_port_call_version: "${pc_v}" }, as: AgencyOps, as_user_id: "ops-1", captures: { da_id: "$.data.id" } }
            - { call: "POST /tariffs", payload: { port_code: "SINGA", component: "PORT_DUES", effective_from: "2026-05-15T00:00:00Z", night_surcharge_pct: 0.30, hazmat_surcharge_pct: 0.40, gt_tiers: [ { gt_up_to: 20000, rate_cents: 2.2 }, { gt_up_to: null, rate_cents: 1.6 } ] }, as: PortAuthority, captures: { tar_v2: "$.data.id" } }
            - { call: "POST /authority-notifications", payload: { port_call_id: "${pc_id}", authority_type: "PORT_STATE_CONTROL", payload_summary: "psc pkg" }, as: AgencyOps, captures: { n_psc: "$.data.id" } }
            - { call: "POST /authority-notifications", payload: { port_call_id: "${pc_id}", authority_type: "IMMIGRATION", payload_summary: "imm pkg" }, as: AgencyOps, captures: { n_imm: "$.data.id" } }
            - { call: "POST /authority-notifications", payload: { port_call_id: "${pc_id}", authority_type: "CUSTOMS", payload_summary: "cus pkg" }, as: AgencyOps, captures: { n_cus: "$.data.id" } }
            - { call: "POST /authority-notifications", payload: { port_call_id: "${pc_id}", authority_type: "HARBOR_MASTER", payload_summary: "hm pkg" }, as: AgencyOps, captures: { n_hm: "$.data.id" } }
            - { call: "POST /authority-notifications/${n_psc}/submit", as: AgencyOps }
            - { call: "POST /authority-notifications/${n_imm}/submit", as: AgencyOps }
            - { call: "POST /authority-notifications/${n_cus}/submit", as: AgencyOps }
            - { call: "POST /authority-notifications/${n_hm}/submit", as: AgencyOps }
            - { call: "POST /port-calls/${pc_id}/file-pre-arrival", as: AgencyOps }
            - { call: "POST /authority-notifications/${n_psc}/acknowledge", payload: { authority_reference: "PSC-1" }, as: PortAuthority }
            - { call: "POST /authority-notifications/${n_imm}/acknowledge", payload: { authority_reference: "IMM-1" }, as: PortAuthority }
            - { call: "POST /authority-notifications/${n_cus}/acknowledge", payload: { authority_reference: "CUS-1" }, as: PortAuthority }
            - { call: "POST /authority-notifications/${n_hm}/acknowledge", payload: { authority_reference: "HM-1" }, as: PortAuthority }
            - { call: "POST /port-calls/${pc_id}/grant-clearance", as: PortAuthority }
            - { call: "POST /berth-windows", payload: { port_call_id: "${pc_id}", berth_code: "B1", start_at: "2026-06-10T18:00:00Z", end_at: "2026-06-14T06:00:00Z" }, as: AgencyOps, captures: { bw_id: "$.data.id" } }
            - { call: "POST /berth-windows/${bw_id}/confirm", as: PortAuthority }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T21:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /berth-windows/${bw_id}/occupy", as: AgencyOps }
            - { call: "POST /port-calls/${pc_id}/record-arrival", payload: { berth_window_id: "${bw_id}" }, as: AgencyOps }
            - { call: "POST /disbursement-accounts/${da_id}/send", as: AgencyOps }
            - { call: "POST /disbursement-accounts/${da_id}/advances", payload: { amount_cents: 250000 }, as: AgencyFinance, captures: { adv_id: "$.data.id" } }
            - { call: "GET /disbursement-accounts/${da_id}/lines", as: AgencyOps, captures: { pd_line: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-13T23:00:00Z" }, as: AgencyAdmin }
          trigger:
            - { call: "POST /port-calls/${pc_id}/record-sailing", payload: { berth_window_id: "${bw_id}" }, as: AgencyOps }
          assert:
            - "PortCall.${pc_id}.ops_status == SAILED and alongside_days_actual == 4"
            - "DALine.${pd_line}.estimated_cents == 272250 (ESTIMATE variant, tariff pinned)"
            - "DALine.${pd_line}.actual_cents == 408000 (FINAL variant under superseding tariff)"
            - "DALine.${pd_line}.tariff_id == ${tar_v1} while Tariff.${tar_v1}.status == SUPERSEDED"
            - "DisbursementAccount.${da_id}.total_estimated_cents == 279056 (272250 + per-line fee 6806)"
            - "BerthWindow.${bw_id}.status == RELEASED"
      - name: principal_exposure_forward_vs_cash
        grounds:
          - calculations.principal_exposure_calc
          - entities.Principal.fields.credit_limit_cents
        distinguishing_aspect: |
          Entity domain Principal (credit risk, distinct from the DA accounting domain of the sibling instance):
          the same account state — one DA estimated 102500 with 82000 received and 20000 applied — yields
          forward_exposure_cents 102500 under FORWARD_LOOKING but cash_basis_exposure_cents 20000 under CASH_BASIS.
        test_recipe:
          setup:
            - "Principal credit limit 1000000; one port call at tariff-less port NODUE; DA with two SUNDRY lines 60000 + 40000 (fee 1500 + 1000 = 2500; total 102500; advance_required 82000)"
            - "DA SENT_TO_PRINCIPAL then FUNDED by an 82000 advance (== advance_required boundary); 20000 of it applied"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /principals", payload: { name: "Borealis Lines", contact_email: "fin@borealis.example", credit_limit_cents: 1000000 }, as: AgencyAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /port-calls", payload: { principal_id: "${p_id}", vessel_name: "SS Taiga", imo_number: "9000002", vessel_gt: 5000, flag_state: "NO", port_code: "NODUE", eta: "2026-06-01T10:00:00Z", etd: "2026-06-02T10:00:00Z", cargo_description: "general" }, as: AgencyOps, as_user_id: "ops-1", captures: { pc_id: "$.data.id", pc_v: "$.data.version" } }
            - { call: "POST /disbursement-accounts", payload: { port_call_id: "${pc_id}", expected_port_call_version: "${pc_v}" }, as: AgencyOps, as_user_id: "ops-1", captures: { da_id: "$.data.id" } }
            - { call: "POST /disbursement-accounts/${da_id}/lines", payload: { category: "SUNDRY", description: "line a", estimated_cents: 60000 }, as: AgencyOps, captures: { ln_a: "$.data.id" } }
            - { call: "POST /disbursement-accounts/${da_id}/lines", payload: { category: "SUNDRY", description: "line b", estimated_cents: 40000 }, as: AgencyOps, captures: { ln_b: "$.data.id" } }
            - { call: "POST /disbursement-accounts/${da_id}/send", as: AgencyOps }
            - { call: "POST /disbursement-accounts/${da_id}/advances", payload: { amount_cents: 82000 }, as: AgencyFinance, captures: { adv_id: "$.data.id" } }
            - { call: "POST /funding-advances/${adv_id}/apply", payload: { amount_cents: 20000 }, as: AgencyFinance }
          trigger:
            - { call: "GET /principals/${p_id}/exposure", as: AgencyFinance }
          assert:
            - "response data.forward_exposure_cents == 102500"
            - "response data.cash_basis_exposure_cents == 20000"
            - "response data.credit_headroom_cents == 897500"
            - "DisbursementAccount.${da_id}.status == FUNDED (82000 received >= 82000 required)"
  - rule_id: combinatorial_formula
    instances:
      - name: port_dues_tier_boundary_and_surcharges
        grounds:
          - calculations.port_dues_calc
          - entities.Tariff.fields.gt_tiers
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — marginal GT tiers (inclusive upper bound at 20000),
          ceil-days, and conditional night/hazmat surcharge branches; GT 20000 bills 40000 cents for one day while
          GT 20001 bills 40002 (one extra GT at the 1.5-cent marginal rate, single line-level round_half_up).
        test_recipe:
          setup:
            - "Tariff SINGA: tiers [{20000, 2.0}, {null, 1.5}], night 0.25, hazmat 0.40"
            - "Call A GT 20000, call B GT 20001; both eta 2026-06-10T10:00Z (daytime, no night branch), hazmat false, etd 2026-06-11T09:00Z (23h -> 1 day)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /principals", payload: { name: "Apex Shipping", contact_email: "ops@apex.example", credit_limit_cents: 0 }, as: AgencyAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /port-calls", payload: { principal_id: "${p_id}", vessel_name: "MV Low", imo_number: "9000010", vessel_gt: 20000, flag_state: "PA", port_code: "SINGA", eta: "2026-06-10T10:00:00Z", etd: "2026-06-11T09:00:00Z", cargo_description: "bulk" }, as: AgencyOps, as_user_id: "ops-1", captures: { pc_a: "$.data.id", pc_a_v: "$.data.version" } }
            - { call: "POST /port-calls", payload: { principal_id: "${p_id}", vessel_name: "MV High", imo_number: "9000011", vessel_gt: 20001, flag_state: "PA", port_code: "SINGA", eta: "2026-06-10T10:00:00Z", etd: "2026-06-11T09:00:00Z", cargo_description: "bulk" }, as: AgencyOps, as_user_id: "ops-1", captures: { pc_b: "$.data.id", pc_b_v: "$.data.version" } }
            - { call: "POST /tariffs", payload: { port_code: "SINGA", component: "PORT_DUES", effective_from: "2026-01-01T00:00:00Z", night_surcharge_pct: 0.25, hazmat_surcharge_pct: 0.40, gt_tiers: [ { gt_up_to: 20000, rate_cents: 2.0 }, { gt_up_to: null, rate_cents: 1.5 } ] }, as: PortAuthority, captures: { tar_id: "$.data.id" } }
            - { call: "POST /disbursement-accounts", payload: { port_call_id: "${pc_a}", expected_port_call_version: "${pc_a_v}" }, as: AgencyOps, as_user_id: "ops-1", captures: { da_a: "$.data.id" } }
            - { call: "POST /disbursement-accounts", payload: { port_call_id: "${pc_b}", expected_port_call_version: "${pc_b_v}" }, as: AgencyOps, as_user_id: "ops-1", captures: { da_b: "$.data.id" } }
          trigger:
            - { call: "GET /disbursement-accounts/${da_a}/lines", as: AgencyOps }
            - { call: "GET /disbursement-accounts/${da_b}/lines", as: AgencyOps }
          assert:
            - "DA ${da_a} line[0].category == PORT_DUES and estimated_cents == 40000 (20000 GT entirely inside tier 1, inclusive boundary)"
            - "DA ${da_b} line[0].estimated_cents == 40002 (40001.5 rounded half-up once at line level)"
            - "neither line carries night or hazmat surcharge (daytime eta, hazmat false)"
      - name: agency_fee_per_line_rounding_order
        grounds:
          - calculations.agency_fee_calc
          - calculations.da_totals_calc
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct from the tiered-formula mode (a) sibling): the fee rounds each line's
          2.5% to integer cents BEFORE summing — two 3333-cent lines yield 83 + 83 = 166, whereas the rejected
          sum-then-round order would yield 167; the scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Tariff-less port NODUE; DA with two MANUAL SUNDRY lines of 3333 cents each"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /principals", payload: { name: "Apex Shipping", contact_email: "ops@apex.example", credit_limit_cents: 0 }, as: AgencyAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /port-calls", payload: { principal_id: "${p_id}", vessel_name: "SS Rye", imo_number: "9000020", vessel_gt: 5000, flag_state: "PA", port_code: "NODUE", eta: "2026-06-01T10:00:00Z", etd: "2026-06-02T10:00:00Z", cargo_description: "general" }, as: AgencyOps, as_user_id: "ops-1", captures: { pc_id: "$.data.id", pc_v: "$.data.version" } }
            - { call: "POST /disbursement-accounts", payload: { port_call_id: "${pc_id}", expected_port_call_version: "${pc_v}" }, as: AgencyOps, as_user_id: "ops-1", captures: { da_id: "$.data.id" } }
            - { call: "POST /disbursement-accounts/${da_id}/lines", payload: { category: "SUNDRY", description: "l1", estimated_cents: 3333 }, as: AgencyOps, captures: { ln1: "$.data.id" } }
          trigger:
            - { call: "POST /disbursement-accounts/${da_id}/lines", payload: { category: "SUNDRY", description: "l2", estimated_cents: 3333 }, as: AgencyOps, captures: { ln2: "$.data.id" } }
            - { call: "GET /disbursement-accounts/${da_id}", as: AgencyOps }
          assert:
            - "DisbursementAccount.${da_id}.agency_fee_estimated_cents == 166 (not 167)"
            - "DisbursementAccount.${da_id}.total_estimated_cents == 6832"
            - "DisbursementAccount.${da_id}.advance_required_cents == 5466 (round_half_up(0.80 * 6832), evaluated after the fee — pinned order lines -> fee -> advance)"
  - rule_id: non_linear_state_machine
    instances:
      - name: po_invoice_dispute_cycle
        grounds:
          - state_machines.PurchaseOrder.DELIVERED_to_DISPUTED
          - state_machines.PurchaseOrder.DISPUTED_to_INVOICED
          - state_machines.PurchaseOrder.INVOICED_to_MATCHED
          - calculations.po_variance_calc
        distinguishing_aspect: |
          PurchaseOrder is cyclic: DELIVERED -> DISPUTED (invoice with 20% over variance) -> INVOICED (reinvoice
          at 5%) -> MATCHED; the dispute loop revisits a prior state dimension rather than a linear pipeline.
        test_recipe:
          setup:
            - "Vendor ChandlerCo (PROVISIONS) ACTIVE; port call NOMINATED; PO estimated 10000 driven DRAFT -> SENT -> ACKNOWLEDGED -> DELIVERED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /principals", payload: { name: "Apex Shipping", contact_email: "ops@apex.example", credit_limit_cents: 0 }, as: AgencyAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /port-calls", payload: { principal_id: "${p_id}", vessel_name: "SS Rye", imo_number: "9000020", vessel_gt: 5000, flag_state: "PA", port_code: "NODUE", eta: "2026-06-01T10:00:00Z", etd: "2026-06-02T10:00:00Z", cargo_description: "general" }, as: AgencyOps, as_user_id: "ops-1", captures: { pc_id: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "ChandlerCo", categories: ["PROVISIONS"], contact_email: "sales@chandler.example" }, as: AgencyAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /purchase-orders", payload: { port_call_id: "${pc_id}", vendor_id: "${v_id}", category: "PROVISIONS", estimated_cents: 10000, needed_by: "2026-06-05T00:00:00Z" }, as: AgencyOps, captures: { po_id: "$.data.id" } }
            - { call: "POST /purchase-orders/${po_id}/send", as: AgencyOps }
            - { call: "POST /purchase-orders/${po_id}/acknowledge", as: VendorRep, as_user_id: "${v_id}" }
            - { call: "POST /purchase-orders/${po_id}/deliver", as: VendorRep, as_user_id: "${v_id}" }
          trigger:
            - { call: "POST /purchase-orders/${po_id}/invoice", payload: { invoiced_cents: 12000 }, as: VendorRep, as_user_id: "${v_id}" }
            - { call: "POST /purchase-orders/${po_id}/reinvoice", payload: { invoiced_cents: 10500 }, as: VendorRep, as_user_id: "${v_id}" }
            - { call: "POST /purchase-orders/${po_id}/match", as: AgencyFinance }
          assert:
            - "after invoice 12000: PurchaseOrder.${po_id}.status == DISPUTED and variance_pct == 20.0"
            - "after reinvoice 10500: status == INVOICED and variance_pct == 5.0"
            - "after match: status == MATCHED (terminal); loop DELIVERED -> DISPUTED -> INVOICED -> MATCHED traversed"
      - name: notification_reject_resubmit_cycle
        grounds:
          - state_machines.AuthorityNotification.SUBMITTED_to_REJECTED
          - state_machines.AuthorityNotification.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          AuthorityNotification is cyclic on a different entity than PurchaseOrder: SUBMITTED -> REJECTED ->
          SUBMITTED resubmission loops, with revision_count monotonically counting loop iterations (2 after two
          reject/resubmit rounds) while rejection_reason retains the latest reason.
        test_recipe:
          setup:
            - "Port call NOMINATED with a CUSTOMS notification submitted once"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /principals", payload: { name: "Apex Shipping", contact_email: "ops@apex.example", credit_limit_cents: 0 }, as: AgencyAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /port-calls", payload: { principal_id: "${p_id}", vessel_name: "SS Rye", imo_number: "9000020", vessel_gt: 5000, flag_state: "PA", port_code: "NODUE", eta: "2026-06-01T10:00:00Z", etd: "2026-06-02T10:00:00Z", cargo_description: "general" }, as: AgencyOps, as_user_id: "ops-1", captures: { pc_id: "$.data.id" } }
            - { call: "POST /authority-notifications", payload: { port_call_id: "${pc_id}", authority_type: "CUSTOMS", payload_summary: "cus pkg" }, as: AgencyOps, captures: { n_id: "$.data.id" } }
            - { call: "POST /authority-notifications/${n_id}/submit", as: AgencyOps }
          trigger:
            - { call: "POST /authority-notifications/${n_id}/reject", payload: { reason: "forms incomplete" }, as: PortAuthority }
            - { call: "POST /authority-notifications/${n_id}/resubmit", as: AgencyOps }
            - { call: "POST /authority-notifications/${n_id}/reject", payload: { reason: "forms incomplete" }, as: PortAuthority }
            - { call: "POST /authority-notifications/${n_id}/resubmit", as: AgencyOps }
            - { call: "POST /authority-notifications/${n_id}/acknowledge", payload: { authority_reference: "CUST-77" }, as: PortAuthority }
          assert:
            - "AuthorityNotification.${n_id}.revision_count == 2"
            - "AuthorityNotification.${n_id}.status == ACKNOWLEDGED and authority_reference == CUST-77"
            - "AuthorityNotification.${n_id}.rejection_reason == forms incomplete (retained through the loop)"
  - rule_id: transitive_cascade
    instances:
      - name: port_call_cancel_depth3_cascade
        grounds:
          - state_machines.PortCall.NOMINATED_to_CANCELLED
          - state_machines.ServiceOrder.ORDERED_to_CANCELLED
          - calculations.da_totals_calc
        distinguishing_aspect: |
          Depth-3 chain from the cancel trigger: PortCall cancel mutates ServiceOrder/PurchaseOrder (link 1);
          each order cancellation reverses its DALine mirror (link 2 — caused by the order mutation, not by the
          original call); the line reversals force da_totals_calc to recompute DA totals (link 3).
        test_recipe:
          setup:
            - "Call NOMINATED with DA (lines mirrored from a 20000 TUG order and a 10000 PO: fee 750, total 30750, advance_required 24600), one REQUESTED berth window, one DRAFT notification, one REQUESTED crew change"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /principals", payload: { name: "Apex Shipping", contact_email: "ops@apex.example", credit_limit_cents: 0 }, as: AgencyAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /port-calls", payload: { principal_id: "${p_id}", vessel_name: "SS Rye", imo_number: "9000020", vessel_gt: 5000, flag_state: "PA", port_code: "NODUE", eta: "2026-06-10T10:00:00Z", etd: "2026-06-12T10:00:00Z", cargo_description: "general" }, as: AgencyOps, as_user_id: "ops-1", captures: { pc_id: "$.data.id", pc_v: "$.data.version" } }
            - { call: "POST /disbursement-accounts", payload: { port_call_id: "${pc_id}", expected_port_call_version: "${pc_v}" }, as: AgencyOps, as_user_id: "ops-1", captures: { da_id: "$.data.id" } }
            - { call: "POST /vendors", payload: { name: "ChandlerCo", categories: ["PROVISIONS", "STORES"], contact_email: "sales@chandler.example" }, as: AgencyAdmin, captures: { v_id: "$.data.id" } }
            - { call: "POST /service-orders", payload: { port_call_id: "${pc_id}", kind: "TUG", vendor_id: "${v_id}", resource_unit: "TUG-7", window_start: "2026-06-10T12:00:00Z", window_end: "2026-06-10T13:00:00Z", estimated_cents: 20000 }, as: AgencyOps, captures: { so_id: "$.data.id" } }
            - { call: "POST /purchase-orders", payload: { port_call_id: "${pc_id}", vendor_id: "${v_id}", category: "PROVISIONS", estimated_cents: 10000, needed_by: "2026-06-10T09:00:00Z" }, as: AgencyOps, captures: { po_id: "$.data.id" } }
