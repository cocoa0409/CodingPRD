            - "deal remains SETTLED; settlement remains POSTED; the AUTHORIZED leg is untouched"

      - name: deal_create_requires_active_agent
        grounds:
          - validations[priority=8]
          - errors[ERR_AGENT_INVALID_STATE]
          - entities.Agent.fields.status
        distinguishing_aspect: |
          Entity pair Deal -> Agent (different pair than Settlement<->Leg):
          creating a Deal for an ONBOARDING or SUSPENDED agent is rejected with
          ERR_AGENT_INVALID_STATE — the deal's very existence is gated by the
          parent agent's lifecycle state.
        test_recipe:
          setup:
            - "Agent created (ONBOARDING, never activated)"
          setup_api_calls:
