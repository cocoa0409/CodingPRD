              as: GinOperator
              captures: { err: $.data.error_id }
          assert:
            - "http 403, error_id == ERR_FORBIDDEN; no schedule persisted"

      - name: rbac_classingclerk_cannot_complete_ginning
        claim_type: rbac_denial
        grounds: ["roles[GinOperator]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "complete-ginning is GinOperator-exclusive: ClassingClerk (who may write classing results on the bale) cannot create bales."
        test_recipe:
          setup: ["grower; shift; module in GINNING"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C71", legal_name: "Role Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-RB" }
              as: GinOperator
              captures: { s: $.data.id }
