# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x 3 instances = 27 instances. All chains replay against SCAFFOLD.yaml
# §1.5 from empty-DB. Standard event config (used unless an instance says otherwise):
#   min_bid_pct_bps=3000, min_bid_increment_cents=500, min_bid_floor_cents=1000,
#   tiers=[<100000:+2500, <500000:+5000, top:+10000], ack_threshold_cents=25000,
#   solicitation_cooldown_days=30, cert_validity_months=12, cert_grace_days=30.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_split_aggregate_vs_prorata
        grounds:
          - calculations.revenue_contribution_split
          - calculations.event_financial_summary
          - entities.Invoice.fields.contribution_prorata_cents
        distinguishing_aspect: |
          Invoice-domain fiscal split: AGGREGATE (single subtraction on pinned FMV)
          yields contribution 50000 while PRORATA (per-line round_half_up allocation,
          no remainder reconciliation) yields 50001 on identical inputs — a 1-cent
          divergence caused purely by rounding placement.
        test_recipe:
          setup:
            - "Event (standard config) advanced to SOLICITING; donors d1/d2/d3 each with a PLEDGED solicitation; items i1/i2/i3 (PHYSICAL) with APPROVED valuations 33333/33333/33334; event in CATALOGING; bundle B contains i1,i2,i3 (bundle_fmv 100000) and is PUBLISHED (min_bid 30000); event BIDDING_OPEN; bidder br with payment method; winning bid 150000; event closed; invoice paid in full"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala A", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor One", email: "d1@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn1: "$.data.id" } }
            - { call: "POST /donors", payload: { full_name: "Donor Two", email: "d2@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn2: "$.data.id" } }
            - { call: "POST /donors", payload: { full_name: "Donor Three", email: "d3@x.org", donor_type: "BUSINESS" }, as: ProcurementOfficer, captures: { dn3: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn1}", gala_event_id: "${ev}", ask_description: "Vase", ask_estimate_cents: 30000 }, as: ProcurementOfficer, captures: { so1: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn2}", gala_event_id: "${ev}", ask_description: "Print", ask_estimate_cents: 30000 }, as: ProcurementOfficer, captures: { so2: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn3}", gala_event_id: "${ev}", ask_description: "Sculpture", ask_estimate_cents: 30000 }, as: ProcurementOfficer, captures: { so3: "$.data.id" } }
            - { call: "POST /solicitations/${so1}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so3}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so1}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so3}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so1}", title: "Vase", description: "Ceramic", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it1: "$.data.id", it1_v: "$.data.version" } }
            - { call: "POST /items", payload: { solicitation_id: "${so2}", title: "Print", description: "Litho", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it2: "$.data.id", it2_v: "$.data.version" } }
            - { call: "POST /items", payload: { solicitation_id: "${so3}", title: "Sculpture", description: "Bronze", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it3: "$.data.id", it3_v: "$.data.version" } }
            - { call: "POST /items/${it1}/valuations", payload: { fmv_cents: 33333, fmv_source: "APPRAISAL", expected_item_version: "${it1_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va1: "$.data.id" } }
            - { call: "POST /items/${it2}/valuations", payload: { fmv_cents: 33333, fmv_source: "APPRAISAL", expected_item_version: "${it2_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va2: "$.data.id" } }
            - { call: "POST /items/${it3}/valuations", payload: { fmv_cents: 33334, fmv_source: "APPRAISAL", expected_item_version: "${it3_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va3: "$.data.id" } }
            - { call: "POST /valuations/${va1}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /valuations/${va2}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /valuations/${va3}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Art Trio" }, as: CatalogManager, captures: { bd: "$.data.id" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it1}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it2}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it3}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/publish", payload: {}, as: CatalogManager, captures: { bd_v: "$.data.version" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev}", full_name: "Bidder A", email: "ba@x.org", paddle_no: 1, payment_method_on_file: true }, as: GalaAdmin, captures: { br: "$.data.id" } }
            - { call: "POST /bundles/${bd}/bids", payload: { amount_cents: 150000, expected_bundle_version: "${bd_v}" }, as: Bidder, as_user_id: "${br}" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "GET /invoices", payload: { bundle_id: "${bd}" }, as: GalaAdmin, captures: { inv: "$.data[0].id" } }
            - { call: "POST /invoices/${inv}/payments", payload: { amount_cents: 150000, method: "CARD" }, as: Bidder, as_user_id: "${br}", captures: { pay: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { payment_id: "${pay}", outcome: "SUCCEEDED" }, as: GalaAdmin }
          trigger:
            - { call: "GET /invoices/${inv}", payload: {}, as: FinanceOfficer, captures: { agg_c: "$.data.contribution_portion_cents", pro_c: "$.data.contribution_prorata_cents" } }
            - { call: "GET /gala-events/${ev}/summary", payload: {}, as: FinanceOfficer }
          assert:
            - "Invoice.${inv}.revenue_portion_cents == 100000"
            - "Invoice.${inv}.contribution_portion_cents == 50000 (AGGREGATE: max(0, 150000-100000))"
            - "Invoice.${inv}.contribution_prorata_cents == 50001 (PRORATA: round_half_up allocs 50000/50000/50001, per-line excess 16667+16667+16667)"
            - "summary.recognized_contribution_cents == 50000"
            - "summary.prorata_contribution_cents == 50001"
            - "summary.recognized_revenue_cents == 100000"

      - name: acknowledgment_fmv_asof_vs_pinned
        grounds:
          - calculations.acknowledgment_fmv_cents
          - entities.Invoice.fields.pinned_bundle_fmv_cents
          - entities.DonorAcknowledgment.fields.fmv_cents
        distinguishing_aspect: |
          Donor-acknowledgment domain: AS_OF_ISSUE tracks the latest APPROVED valuation
          (45000 after post-close re-valuation) while the invoice's PINNED_AT_SALE FMV
          stays at the publish-time 40000 — the two as-of variants diverge by 5000 cents
          for the same underlying item.
        test_recipe:
          setup:
            - "Event in standard config; item 'Watch' valued 40000 and sold solo for 50000 (invoice pinned FMV 40000); after close, a second valuation 45000 is submitted and approved while the item's acknowledgment is still PENDING"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala B", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor W", email: "dw@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Watch", ask_estimate_cents: 40000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Watch", description: "Swiss", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "APPRAISAL", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va1: "$.data.id" } }
            - { call: "POST /valuations/${va1}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Watch Solo" }, as: CatalogManager, captures: { bd: "$.data.id" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/publish", payload: {}, as: CatalogManager, captures: { bd_v: "$.data.version" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev}", full_name: "Bidder A", email: "ba@x.org", paddle_no: 1, payment_method_on_file: true }, as: GalaAdmin, captures: { br: "$.data.id" } }
            - { call: "POST /bundles/${bd}/bids", payload: { amount_cents: 50000, expected_bundle_version: "${bd_v}" }, as: Bidder, as_user_id: "${br}" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "GET /invoices", payload: { bundle_id: "${bd}" }, as: GalaAdmin, captures: { inv: "$.data[0].id" } }
          trigger:
            - { call: "GET /items/${it}", payload: {}, as: ProcurementOfficer, captures: { it_v2: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 45000, fmv_source: "COMPARABLE_SALE", expected_item_version: "${it_v2}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va2: "$.data.id" } }
            - { call: "POST /valuations/${va2}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "GET /acknowledgments", payload: { item_id: "${it}" }, as: FinanceOfficer, captures: { ack_fmv: "$.data[0].fmv_cents" } }
            - { call: "GET /invoices/${inv}", payload: {}, as: FinanceOfficer, captures: { pin_fmv: "$.data.pinned_bundle_fmv_cents" } }
          assert:
            - "DonorAcknowledgment for item ${it} has fmv_cents == 45000 and status == PENDING (AS_OF_ISSUE refreshed)"
            - "Invoice.${inv}.pinned_bundle_fmv_cents == 40000 (PINNED_AT_SALE unchanged)"
            - "Invoice.${inv}.contribution_portion_cents == 10000 (computed from pinned 40000, not 45000)"
            - "Item.${it}.current_fmv_cents == 45000"

      - name: bundle_min_bid_preview_vs_locked
        grounds:
          - calculations.minimum_bid_cents
          - entities.Bundle.fields.min_bid_cents
        distinguishing_aspect: |
          Bundle domain: the PREVIEW variant reflects un-frozen FMVs while DRAFT
          (6000 at FMV 20000, then 12000 after re-valuation to 40000) whereas the
          LOCKED variant freezes at publish (12000) and ignores a later re-valuation
          to 50000 — preview and locked diverge across the publish boundary.
        test_recipe:
          setup:
            - "Event in SOLICITING; item valued 20000; event CATALOGING; bundle created and item attached; before publish the item is re-valued to 40000; after publish the item is re-valued to 50000"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala C", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor P", email: "dp@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Painting", ask_estimate_cents: 20000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Painting", description: "Oil", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 20000, fmv_source: "DONOR_DECLARED", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va1: "$.data.id" } }
            - { call: "POST /valuations/${va1}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Painting Solo" }, as: CatalogManager, captures: { bd: "$.data.id" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it}" }, as: CatalogManager }
            - { call: "GET /bundles/${bd}", payload: {}, as: CatalogManager, captures: { preview_1: "$.data.min_bid_cents" } }
          trigger:
            - { call: "GET /items/${it}", payload: {}, as: ProcurementOfficer, captures: { it_v2: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "APPRAISAL", expected_item_version: "${it_v2}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va2: "$.data.id" } }
            - { call: "POST /valuations/${va2}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "GET /bundles/${bd}", payload: {}, as: CatalogManager, captures: { preview_2: "$.data.min_bid_cents" } }
            - { call: "POST /bundles/${bd}/publish", payload: {}, as: CatalogManager }
            - { call: "GET /items/${it}", payload: {}, as: ProcurementOfficer, captures: { it_v3: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 50000, fmv_source: "APPRAISAL", expected_item_version: "${it_v3}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va3: "$.data.id" } }
            - { call: "POST /valuations/${va3}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "GET /bundles/${bd}", payload: {}, as: CatalogManager, captures: { locked: "$.data.min_bid_cents", locked_fmv: "$.data.bundle_fmv_cents" } }
          assert:
            - "preview before re-valuation == 6000 (round_half_up(20000*0.3)=6000, floor 1000, grid 6000)"
            - "preview after re-valuation to 40000 == 12000"
            - "locked min_bid_cents after publish == 12000"
            - "after post-publish re-valuation to 50000: Bundle.${bd}.min_bid_cents still == 12000 and bundle_fmv_cents still == 40000 (LOCKED), while Item.${it}.current_fmv_cents == 50000 (PREVIEW basis moved)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: min_bid_nested_rounding_order
        grounds:
          - calculations.minimum_bid_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order bps-round-half-up -> floor ->
          ceil-to-grid gives 10000 for FMV 33333 but 10500 for FMV 33335 (raw
          10000.5 rounds to 10001, then ceils to the 500 grid); any other ordering
          (e.g., grid before bps-round) yields 10000 for both.
        test_recipe:
          setup:
            - "Event in CATALOGING with two valued items: iA fmv 33333, iB fmv 33335; bundles bA and bB each containing one item, both PUBLISHED"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala D", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "Donor A", email: "da@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn1: "$.data.id" } }
            - { call: "POST /donors", payload: { full_name: "Donor B", email: "db@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn2: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn1}", gala_event_id: "${ev}", ask_description: "Lot A", ask_estimate_cents: 33000 }, as: ProcurementOfficer, captures: { so1: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn2}", gala_event_id: "${ev}", ask_description: "Lot B", ask_estimate_cents: 33000 }, as: ProcurementOfficer, captures: { so2: "$.data.id" } }
            - { call: "POST /solicitations/${so1}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so1}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so2}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so1}", title: "Lot A", description: "A", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it1: "$.data.id", it1_v: "$.data.version" } }
            - { call: "POST /items", payload: { solicitation_id: "${so2}", title: "Lot B", description: "B", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it2: "$.data.id", it2_v: "$.data.version" } }
            - { call: "POST /items/${it1}/valuations", payload: { fmv_cents: 33333, fmv_source: "APPRAISAL", expected_item_version: "${it1_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va1: "$.data.id" } }
            - { call: "POST /items/${it2}/valuations", payload: { fmv_cents: 33335, fmv_source: "APPRAISAL", expected_item_version: "${it2_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va2: "$.data.id" } }
            - { call: "POST /valuations/${va1}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /valuations/${va2}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Bundle A" }, as: CatalogManager, captures: { bda: "$.data.id" } }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Bundle B" }, as: CatalogManager, captures: { bdb: "$.data.id" } }
            - { call: "POST /bundles/${bda}/items", payload: { item_id: "${it1}" }, as: CatalogManager }
            - { call: "POST /bundles/${bdb}/items", payload: { item_id: "${it2}" }, as: CatalogManager }
          trigger:
            - { call: "POST /bundles/${bda}/publish", payload: {}, as: CatalogManager, captures: { mb_a: "$.data.min_bid_cents" } }
            - { call: "POST /bundles/${bdb}/publish", payload: {}, as: CatalogManager, captures: { mb_b: "$.data.min_bid_cents" } }
          assert:
            - "Bundle.${bda}.min_bid_cents == 10000 (rhu(33333*0.3)=10000; max(10000,1000)=10000; ceil(10000/500)*500=10000)"
            - "Bundle.${bdb}.min_bid_cents == 10500 (rhu(33335*0.3)=10001; max(10001,1000)=10001; ceil(10001/500)*500=10500)"
            - "Bundle.${bda}.bundle_fmv_cents == 33333 and Bundle.${bdb}.bundle_fmv_cents == 33335"

      - name: min_next_bid_tier_boundary
        grounds:
          - calculations.min_next_bid_cents
          - entities.GalaEvent.fields.bid_increment_tiers
        distinguishing_aspect: |
          Mode (a) tiered formula with >=3 inputs (current high, tier table, min_bid):
          a current high of exactly 100000 selects the NEXT tier (strict < on
          up_to_cents), so min_next becomes 105000 — and 104999 is rejected while
          105000 is accepted (>= acceptance boundary).
