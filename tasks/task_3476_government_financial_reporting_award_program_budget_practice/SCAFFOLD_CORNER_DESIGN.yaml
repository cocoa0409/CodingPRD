  # ===========================================================================
  - section: calculations
    instances:

      - name: provisional_score_partial_mean_after_two_findings
        claim_type: Correct Result
        grounds:
          - calculations.provisional_award_score
        distinguishing_aspect: "The provisional score is a live partial aggregate: after findings of 85.00 and 86.00 it reads 85.50; it is null before the first finding and resets to null on appeal."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission UNDER_REVIEW with three ACCEPTED assignments; no findings yet."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - *c_m1
            - *c_e1
            - *c_rev1
            - *c_train1
            - *c_att1
            - *c_m2
            - *c_e2
            - *c_rev2
            - *c_train2
            - *c_att2
            - *c_m3
            - *c_e3
            - *c_rev3
            - *c_train3
            - *c_att3
            - *c_asg1
            - *c_asg2
            - *c_asg3
            - *c_acc1
            - *c_acc2
            - *c_acc3
          trigger:
            - call: "GET /gfoa/report-submissions/${sub_s}"
              payload: {}
              as: PlatformAdmin
              captures: { prov0: "$.data.provisional_score" }
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
            - call: "POST /gfoa/review-assignments/${asg2}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 88 }, { criterion_code: "C2", score: 84 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev2}"
            - call: "GET /gfoa/report-submissions/${sub_s}"
              payload: {}
              as: PlatformAdmin
              captures: { prov2: "$.data.provisional_score", sub_status: "$.data.status" }
          assert:
            - "before any finding: provisional_score is null"
            - "after two findings (85.00, 86.00): provisional_score == 85.50"
            - "status is still UNDER_REVIEW (quorum not reached) and final_score stays null"

      - name: dues_medium_independent_hits_low_tier
        claim_type: Correct Result
        grounds:
          - calculations.member_annual_dues
        distinguishing_aspect: "A MEDIUM independent officer lands at pre_total 35000 — inside the 5% tier — and pays 33250; the tier is keyed on the pre-discount total, never the final dues."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /gfoa/members"
              payload: { full_name: "Mid Indy", email: "mi@x.com", government_size_band: "MEDIUM", independent_finance_officer: true }
              as: PlatformAdmin
              captures: { dues_mi: $.data.annual_dues_cents }
          assert:
            - "Member.annual_dues_cents == 33250 (30000 base + 5000 fee = 35000; 35000 >= 30000 -> 5%; 35000 * 0.95 = 33250)"

      - name: cycle_posture_scheduled_before_window_opens
        claim_type: Correct Result
        grounds:
          - calculations.cycle_posture
          - entities.AwardCycle.fields.posture
        distinguishing_aspect: "Posture is a pure clock derivation: at 2026-08-15 (before opens 2026-09-01) the cycle reads SCHEDULED and submit fails; the same cycle read OPEN at 2026-09-01 exactly (inclusive lower bound)."
        test_recipe:
          setup:
            - "Logical clock 2026-08-15T00:00:00Z; FR checklist/cycle with window [2026-09-01, 2026-10-15); DRAFT submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
          trigger:
            - call: "GET /gfoa/award-cycles/${cyc_fr}"
              payload: {}
              as: PlatformAdmin
              captures: { posture_early: "$.data.posture" }
            - call: "POST /gfoa/report-submissions/${sub_s}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /gfoa/award-cycles/${cyc_fr}"
              payload: {}
              as: PlatformAdmin
              captures: { posture_open: "$.data.posture" }
            - call: "POST /gfoa/report-submissions/${sub_s}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { sub_status: $.data.status }
          assert:
            - "at 2026-08-15 posture == SCHEDULED and submit returns 409 ERR_SUBMISSION_WINDOW_CLOSED"
            - "at exactly 2026-09-01 (opens, inclusive) posture == OPEN and submit succeeds: status == SUBMITTED"

      - name: pro_rata_pending_total_includes_requesting_application
        claim_type: Correct Result
        grounds:
          - calculations.scholarship_grant_amount
        excluded_because:
          difficulty_instance: scholarship_flat_cap_vs_pro_rata
          rationale: "The PRO_RATA divisor (total PENDING including self) is exactly what the difficulty instance asserts: 100000*100000/200000 = 50000."

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Authentication precedes everything: a request with no X-User-Role/X-User-ID to a bogus submission id returns 401, never 404."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /gfoa/report-submissions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 with error_id == ERR_UNAUTHENTICATED (not 404)"

      - name: forbidden_role_yields_to_shape_validation
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_VALIDATION
        distinguishing_aspect: "Request-shape validation (priority 2) precedes role authorization (priority 3): a Member POSTing to /gfoa/governments with a malformed body gets 400 ERR_VALIDATION, while the same call with a valid body gets 403 ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; member m1 exists."
          setup_api_calls:
            - *c_clock
            - *c_m1
          trigger:
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Broken Body Only" }
              as: Member
              as_user_id: "${m1}"
              captures: { err_shape: $.data.error_id }
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Rogue Gov", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: Member
              as_user_id: "${m1}"
              captures: { err_role: $.data.error_id }
          assert:
            - "malformed body from the wrong role returns 400 ERR_VALIDATION (shape beats role)"
            - "valid body from the wrong role returns 403 ERR_FORBIDDEN_ROLE"
            - "neither call creates a Government (list stays empty for PlatformAdmin GETs)"

      - name: government_contact_cannot_submit_others_submission
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "Ownership is per-government: the contact of government B cannot submit government A's DRAFT submission even though the role is correct and the resource exists."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; gov_s has a DRAFT submission; gov_b is another government."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Boundary", gov_type: "CITY", population_band: "MEDIUM", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_b: $.data.id }
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_b}"
              captures: { err: $.data.error_id }
          assert:
            - "submit by a different government's contact returns 403 ERR_NOT_RESOURCE_OWNER"
            - "ReportSubmission.${sub_s}.status remains DRAFT"

      - name: cycle_checklist_program_mismatch_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CYCLE_CHECKLIST_MISMATCH
          - validations[priority=8]
        distinguishing_aspect: "A cycle must reference an ACTIVE checklist of the SAME program_type: a BUDGET_PRESENTATION checklist on a FINANCIAL_REPORTING cycle is rejected 422."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; only a BUDGET_PRESENTATION checklist exists."
          setup_api_calls:
            - *c_clock
            - call: "POST /gfoa/checklist-versions"
              payload: { program_type: "BUDGET_PRESENTATION", version_label: "2026.1-B", pass_score: 85.00, criteria: [{ criterion_code: "P", weight: 0.30 }, { criterion_code: "F", weight: 0.40 }, { criterion_code: "C", weight: 0.30 }] }
              as: PlatformAdmin
              captures: { cl_bud: $.data.id }
          trigger:
            - call: "POST /gfoa/award-cycles"
              payload: { program_type: "FINANCIAL_REPORTING", fiscal_year: 2026, submission_opens_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-15T00:00:00Z", review_close_at: "2026-12-01T00:00:00Z", checklist_version_id: "${cl_bud}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "cycle creation returns 422 ERR_CYCLE_CHECKLIST_MISMATCH"
            - "no cycle is created (GET /gfoa/award-cycles returns 0 rows)"

      - name: checklist_weight_sum_invalid_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_WEIGHT_SUM_INVALID
          - entities.ChecklistVersion.fields.criteria
        distinguishing_aspect: "Criterion weights must sum to exactly 1.000: 0.5 + 0.4 is rejected; the exact-sum rule is what makes finding_weighted_score total 100 at perfect scores."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /gfoa/checklist-versions"
              payload: { program_type: "FINANCIAL_REPORTING", version_label: "bad", pass_score: 85.00, criteria: [{ criterion_code: "C1", weight: 0.5 }, { criterion_code: "C2", weight: 0.4 }] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "create returns 422 ERR_WEIGHT_SUM_INVALID (0.9 != 1.000)"
            - "no checklist row exists afterwards"

      - name: duplicate_active_checklist_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CHECKLIST_ALREADY_ACTIVE
          - state_machines.ChecklistVersion
        distinguishing_aspect: "Exactly one ACTIVE checklist per program_type: a second FR checklist is rejected while the first is ACTIVE; after a standard supersedes it, a replacement is accepted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; FR checklist v1 ACTIVE; a standard effective 2026-09-10 ready to supersede it."
          setup_api_calls:
            - *c_clock
            - *c_cl_fr
          trigger:
            - call: "POST /gfoa/checklist-versions"
              payload: { program_type: "FINANCIAL_REPORTING", version_label: "2026.2", pass_score: 86.00, criteria: [{ criterion_code: "C1", weight: 1.0 }] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /gfoa/standards-references"
              payload: { topic_code: "GASB-103", title: "Financial Reporting Model Improvements", program_type: "FINANCIAL_REPORTING", effective_date: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { std: $.data.id }
            - call: "POST /gfoa/standards-references/${std}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /gfoa/checklist-versions"
              payload: { program_type: "FINANCIAL_REPORTING", version_label: "2026.2", pass_score: 86.00, criteria: [{ criterion_code: "C1", weight: 1.0 }] }
              as: PlatformAdmin
              captures: { cl_new: $.data.id }
          assert:
            - "second ACTIVE checklist while v1 is ACTIVE returns 409 ERR_CHECKLIST_ALREADY_ACTIVE"
            - "after activation supersedes v1, the replacement create returns 201 with status ACTIVE"
            - "ChecklistVersion.${cl_fr}.status == SUPERSEDED and ChecklistVersion.${cl_new}.status == ACTIVE"

      - name: duplicate_open_submission_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_DUPLICATE_SUBMISSION
        distinguishing_aspect: "One open submission per (government, cycle): a second create while the first is DRAFT/SUBMITTED is rejected; the rule no longer bites once every prior submission is DECIDED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; gov_s has a DRAFT submission in the FR cycle."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
          trigger:
            - call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_s}", cycle_id: "${cyc_fr}" }
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { err: $.data.error_id }
          assert:
            - "the second create returns 409 ERR_DUPLICATE_SUBMISSION"
            - "GET /gfoa/report-submissions?government_id=${gov_s} returns exactly 1 row"

      - name: non_small_government_scholarship_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_GOVERNMENT_NOT_SMALL
          - entities.Government.fields.population_band
        distinguishing_aspect: "The small-government programs are band-gated: a MEDIUM government's application is rejected 422 at creation regardless of fund balance."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; a SCHOLARSHIP fund with pool 100000; gov_s is MEDIUM."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - call: "POST /gfoa/scholarship-funds"
              payload: { fiscal_year: 2026, program_label: "SCHOLARSHIP", pool_total_cents: 100000, per_applicant_cap_cents: 50000 }
              as: PlatformAdmin
              captures: { fund: $.data.id }
          trigger:
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund}", government_id: "${gov_s}", purpose: "CONFERENCE_SCHOLARSHIP", requested_cents: 10000 }
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { err: $.data.error_id }
          assert:
            - "create returns 422 ERR_GOVERNMENT_NOT_SMALL (population_band MEDIUM)"
            - "no application row exists afterwards"

      - name: purpose_program_mismatch_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_PURPOSE_PROGRAM_MISMATCH
          - entities.ScholarshipFund.fields.program_label
        distinguishing_aspect: "Fund and application purposes are paired: a TECHNICAL_ASSISTANCE request against a SCHOLARSHIP fund is rejected 422 even for an eligible SMALL government."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; SCHOLARSHIP fund; SMALL government."
          setup_api_calls:
            - *c_clock
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Village of Tiny", gov_type: "CITY", population_band: "SMALL", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_t: $.data.id }
            - call: "POST /gfoa/scholarship-funds"
              payload: { fiscal_year: 2026, program_label: "SCHOLARSHIP", pool_total_cents: 100000, per_applicant_cap_cents: 50000 }
              as: PlatformAdmin
              captures: { fund: $.data.id }
          trigger:
            - call: "POST /gfoa/scholarship-applications"
              payload: { fund_id: "${fund}", government_id: "${gov_t}", purpose: "TECHNICAL_ASSISTANCE", requested_cents: 10000 }
              as: GovernmentContact
              as_user_id: "${gov_t}"
              captures: { err: $.data.error_id }
          assert:
            - "create returns 422 ERR_PURPOSE_PROGRAM_MISMATCH"

      - name: finding_criterion_set_must_match_pinned_checklist
        claim_type: Violation → Error
        grounds:
          - errors.ERR_UNKNOWN_CRITERION
          - errors.ERR_CRITERION_SET_INCOMPLETE
        distinguishing_aspect: "Findings score exactly the pinned checklist's criteria: an unknown code (X1) and a missing code (C2 omitted) are both 422s, and failed attempts leave the assignment ACCEPTED so a corrected finding still succeeds."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission UNDER_REVIEW; rev1 ACCEPTED assignment."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - *c_m1
            - *c_e1
            - *c_rev1
            - *c_train1
            - *c_att1
            - *c_asg1
            - *c_acc1
          trigger:
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "X1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { err_unknown: $.data.error_id }
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { err_incomplete: $.data.error_id }
            - call: "POST /gfoa/review-assignments/${asg1}/finding"
              payload: { criterion_scores: [{ criterion_code: "C1", score: 90 }, { criterion_code: "C2", score: 80 }], comments: [] }
              as: Reviewer
              as_user_id: "${rev1}"
              captures: { ws: $.data.weighted_score }
          assert:
            - "unknown criterion returns 422 ERR_UNKNOWN_CRITERION"
            - "missing criterion returns 422 ERR_CRITERION_SET_INCOMPLETE"
            - "the corrected finding then succeeds with weighted_score == 85.00, proving the failed attempts did not consume the assignment"

      - name: chair_not_on_committee_rejected
        claim_type: Violation → Error
        grounds:
          - errors.ERR_CHAIR_NOT_ON_COMMITTEE
          - entities.BestPracticePublication.fields.chair_member_id
        distinguishing_aspect: "chair_member_id must be an element of member_ids: a chair outside the committee roster is a 422 at creation."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; members chairM and creatorM exist."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - *c_creatorM
          trigger:
            - call: "POST /gfoa/publications"
              payload: { committee_name: "Broken Committee", chair_member_id: "${chairM}", member_ids: ["${creatorM}"], title: "Bad Roster", topic_code: "IC-GRANTS" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { err: $.data.error_id }
          assert:
            - "create returns 422 ERR_CHAIR_NOT_ON_COMMITTEE (chair not in member_ids)"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: response_envelope_error_shape
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "Every error carries the fixed envelope: response_type error, data.error_id, data.message, and the meta block with api_request_id and api_request_timestamp."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission DRAFT."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
          trigger:
            - call: "POST /gfoa/report-submissions/${sub_s}/submit"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { err: $.data.error_id }
          assert:
            - "the response has response_type == error and data.error_id == ERR_SUBMISSION_STATE_INVALID"
            - "data.message is a non-empty string and meta.api_request_id / meta.api_request_timestamp are present"

      - name: submissions_list_filters_by_status_and_government
        claim_type: Listing
        grounds:
          - endpoints.GET_/gfoa/report-submissions
        distinguishing_aspect: "Filters compose: status=DRAFT returns only drafts of the cycle; government_id scopes to one owner; a GovernmentContact always sees only own rows even without the filter."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; gov_s has a SUBMITTED submission; gov_b has a DRAFT submission in the same cycle."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - call: "POST /gfoa/governments"
              payload: { legal_name: "Town of Boundary", gov_type: "CITY", population_band: "MEDIUM", state_code: "OH" }
              as: PlatformAdmin
              captures: { gov_b: $.data.id }
            - call: "POST /gfoa/report-submissions"
              payload: { government_id: "${gov_b}", cycle_id: "${cyc_fr}" }
              as: GovernmentContact
              as_user_id: "${gov_b}"
              captures: { sub_b: $.data.id }
          trigger:
            - call: "GET /gfoa/report-submissions"
              payload: { cycle_id: "${cyc_fr}", status: "DRAFT" }
              as: PlatformAdmin
            - call: "GET /gfoa/report-submissions"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_b}"
          assert:
            - "PlatformAdmin with status=DRAFT sees exactly 1 row: ${sub_b}"
            - "PlatformAdmin with no status filter sees 2 rows"
            - "GovernmentContact ${gov_b} with no filters sees exactly 1 row (own government's), never ${sub_s}"

      - name: assignment_read_masks_reviewer_for_government
        claim_type: Conditional action
        grounds:
          - endpoints.GET_/gfoa/review-assignments
          - entities.ReviewAssignment.fields.reviewer_id
        distinguishing_aspect: "Blind review is enforced at the read surface: GovernmentContact reads see reviewer_id null and only reviewer_alias R1-1, while AwardsDirector sees the true reviewer_id."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission UNDER_REVIEW with one OFFERED assignment for rev1."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - *c_m1
            - *c_e1
            - *c_rev1
            - *c_train1
            - *c_att1
            - *c_asg1
          trigger:
            - call: "GET /gfoa/review-assignments/${asg1}"
              payload: {}
              as: GovernmentContact
              as_user_id: "${gov_s}"
              captures: { masked_rev: "$.data.reviewer_id", alias: "$.data.reviewer_alias" }
            - call: "GET /gfoa/review-assignments/${asg1}"
              payload: {}
              as: AwardsDirector
              captures: { clear_rev: "$.data.reviewer_id" }
          assert:
            - "GovernmentContact read: reviewer_id is null and reviewer_alias == \"R1-1\""
            - "AwardsDirector read: reviewer_id == ${rev1}"

  # ===========================================================================
  - section: errors
    instances:

      - name: no_eligible_reviewer_empty_pool
        claim_type: violation_to_error
        grounds:
          - errors.ERR_NO_ELIGIBLE_REVIEWER
          - calculations.blind_reviewer_selection
        distinguishing_aspect: "The selector's empty-pool fallback fires on independence grounds: the only ELIGIBLE reviewer is employed by the submitting government, so blind assignment returns 409 instead of breaking independence."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission SUBMITTED; the sole ELIGIBLE reviewer has employer_government_id == the submitting government."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - *c_m1
            - call: "POST /gfoa/reviewer-profiles"
              payload: { member_id: "${m1}", employer_government_id: "${gov_s}" }
              as: Member
              as_user_id: "${m1}"
              captures: { rev_in: $.data.id }
            - call: "PUT /gfoa/reviewer-profiles/${rev_in}"
              payload: { status: "TRAINED" }
              as: PlatformAdmin
            - call: "PUT /gfoa/reviewer-profiles/${rev_in}"
              payload: { independence_attested: true }
              as: Reviewer
              as_user_id: "${rev_in}"
          trigger:
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: AwardsDirector
              captures: { err: $.data.error_id }
          assert:
            - "assign returns 409 ERR_NO_ELIGIBLE_REVIEWER"
            - "ReviewerProfile.${rev_in}.open_assignment_count == 0 and the submission stays SUBMITTED (no UNDER_REVIEW flip without an assignment)"

      - name: conflicted_government_attestation_excludes_reviewer
        claim_type: violation_to_error
        grounds:
          - calculations.blind_reviewer_selection
          - entities.ReviewerProfile.fields.conflicted_government_ids
        distinguishing_aspect: "Independence via attested conflict list: a reviewer who attests a conflict with the submitting government is skipped, and assignment falls to the next ranked reviewer."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; submission SUBMITTED; rev1 (trained first) attests a conflict with the submitting government; rev2 is clean."
          setup_api_calls:
            - *c_clock
            - *c_gov_s
            - *c_cl_fr
            - *c_cyc_fr
            - *c_sub_create
            - *c_submit
            - *c_m1
            - *c_e1
            - *c_rev1
            - *c_train1
            - call: "PUT /gfoa/reviewer-profiles/${rev1}"
              payload: { independence_attested: true, conflicted_government_ids: ["${gov_s}"] }
              as: Reviewer
              as_user_id: "${rev1}"
            - *c_m2
            - *c_e2
            - *c_rev2
            - *c_train2
            - *c_att2
          trigger:
            - call: "POST /gfoa/review-assignments"
              payload: { submission_id: "${sub_s}" }
              as: AwardsDirector
              captures: { asg: $.data.id, asg_rev: $.data.reviewer_id }
          assert:
            - "the assignment selects ${rev2}, not ${rev1} (conflict attestation excludes despite earlier training)"
            - "ReviewerProfile.${rev1}.open_assignment_count == 0 and ReviewerProfile.${rev2}.open_assignment_count == 1"

      - name: self_approval_forbidden_when_chair_created
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SELF_APPROVAL_FORBIDDEN
          - validations[priority=7]
        distinguishing_aspect: "Segregation of duties inside the committee: when the chair is also the creator, publish is refused even though the chair-only and state gates all pass."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; publication created by chairM with chair == creator; comment period opened and closed with zero comments."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - call: "POST /gfoa/publications"
              payload: { committee_name: "Solo Chair Committee", chair_member_id: "${chairM}", member_ids: ["${chairM}"], title: "Solo Draft", topic_code: "IC-GRANTS" }
              as: CommitteeMember
              as_user_id: "${chairM}"
              captures: { pub_solo: $.data.id }
            - call: "POST /gfoa/publications/${pub_solo}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${chairM}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/publications/${pub_solo}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${chairM}"
              captures: { pub_solo_v: $.data.version }
          trigger:
            - call: "POST /gfoa/publications/${pub_solo}/publish"
              payload: { expected_publication_version: "${pub_solo_v}" }
              as: CommitteeMember
              as_user_id: "${chairM}"
              captures: { err: $.data.error_id }
          assert:
            - "publish returns 403 ERR_SELF_APPROVAL_FORBIDDEN (chair == created_by_member_id)"
            - "BestPracticePublication.${pub_solo}.status remains RESOLUTION"

      - name: publish_with_unresolved_comments_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNRESOLVED_COMMENTS
          - entities.BestPracticePublication.fields.pending_comment_count
        distinguishing_aspect: "Publish requires pending_comment_count == 0: one PENDING comment blocks publication even for a non-creator chair with a current OCC version."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z; publication pub (creator creatorM, chair chairM) in RESOLUTION with one PENDING comment."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - *c_creatorM
            - *c_pub
            - call: "POST /gfoa/publications/${pub}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /gfoa/members"
              payload: { full_name: "Commenter Kim", email: "kim@x.com", government_size_band: "SMALL" }
              as: PlatformAdmin
              captures: { cm: $.data.id }
            - call: "POST /gfoa/member-comments"
              payload: { publication_id: "${pub}", body: "Please clarify the escalation matrix." }
              as: Member
              as_user_id: "${cm}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/publications/${pub}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { pub_v: $.data.version }
          trigger:
            - call: "POST /gfoa/publications/${pub}/publish"
              payload: { expected_publication_version: "${pub_v}" }
              as: CommitteeMember
              as_user_id: "${chairM}"
              captures: { err: $.data.error_id }
          assert:
            - "publish returns 409 ERR_UNRESOLVED_COMMENTS (pending_comment_count == 1)"
            - "BestPracticePublication.${pub}.status remains RESOLUTION and published_at stays null"

      - name: publish_with_superseded_pinned_standard_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PINNED_STANDARD_SUPERSEDED
          - entities.BestPracticePublication.fields.pinned_standards_reference_id
        distinguishing_aspect: "Version-pinning on approval: a publication pinned to a standard that a newer same-topic standard has superseded cannot publish until re-pinned via a revision round."
        test_recipe:
          setup:
            - "Logical clock 2026-09-15T00:00:00Z. Standard GASB-103 v1 (effective 2026-09-10) is EFFECTIVE; publication pinned to it has passed through comment and close. Then GASB-103 v2 (effective 2026-09-10) activates, superseding v1."
          setup_api_calls:
            - *c_clock
            - *c_chairM
            - *c_creatorM
            - call: "POST /gfoa/standards-references"
              payload: { topic_code: "GASB-103", title: "Reporting Model (2025)", program_type: "FINANCIAL_REPORTING", effective_date: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { std1: $.data.id }
            - call: "POST /gfoa/standards-references/${std1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /gfoa/publications"
              payload: { committee_name: "Accounting Practices Committee", chair_member_id: "${chairM}", member_ids: ["${chairM}", "${creatorM}"], title: "Reporting Model Implementation", topic_code: "IC-REPORT", pinned_standards_reference_id: "${std1}" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { pub_pin: $.data.id }
            - call: "POST /gfoa/publications/${pub_pin}/open-comment-period"
              payload: { closes_at: "2026-09-20T00:00:00Z" }
              as: CommitteeMember
              as_user_id: "${creatorM}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-21T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /gfoa/publications/${pub_pin}/close-comment-period"
              payload: {}
              as: CommitteeMember
              as_user_id: "${creatorM}"
              captures: { pub_pin_v: $.data.version }
            - call: "POST /gfoa/standards-references"
              payload: { topic_code: "GASB-103", title: "Reporting Model (2026)", program_type: "FINANCIAL_REPORTING", effective_date: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { std2: $.data.id }
            - call: "POST /gfoa/standards-references/${std2}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /gfoa/publications/${pub_pin}/publish"
              payload: { expected_publication_version: "${pub_pin_v}" }
              as: CommitteeMember
              as_user_id: "${chairM}"
              captures: { err: $.data.error_id }
          assert:
            - "StandardsReference.${std1}.status == SUPERSEDED after the v2 activation (same topic_code)"
            - "publish returns 409 ERR_PINNED_STANDARD_SUPERSEDED"
            - "BestPracticePublication.${pub_pin}.status remains RESOLUTION"

