# =============================================================================
# PRD Benchmark Seed Tables — task_0272_escape_room_attraction_booking (Expert)
# Escape Room & Attraction Booking API
# =============================================================================

scenario: |
  Escape Room & Attraction Booking: room/time-slot inventory, group size & private
  booking, dynamic/peak pricing, waiver & age rules, staff/game-master assignment,
  buffer/reset time, gift card, reschedule/no-show

domain_name: escape-room-attraction-booking
api_prefix: /
# Flat top-level collection routing: every entity is reachable at /<collection>/{id}
# and listable at /<collection> with FK filters. Nested action/creation routes
# (/venues/{id}/rooms/{id}/time-slots/{id}/... ) are retained for the ownership tree;
# the flat routes provide canonical reads, listing, and FK reverse-reachability.

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency        # OCC on TimeSlot.version for slot grab (CREATE-with-supersede)
    - cascading_side_effects        # reschedule / cancel / no-show propagate across slot, GM, gift card
    - dual_variant_calculation      # quoted price (forward) vs settled charge (chronological) ; per-line vs whole-group rounding
    - rate_threshold_triggers       # peak-pricing breakpoints, group-size tier breakpoints, no-show strike threshold

  entity_topology: hybrid
  # Venue -> Room -> TimeSlot is a strict ownership tree; Booking, GiftCard,
  # Customer, GameMaster are peer entities cross-cutting that tree via FKs.

  state_machine_shape: parallel
  # Booking carries two independent state axes (lifecycle_status x payment_status);
  # TimeSlot has a branching-with-revert machine; Participant waiver loops.

  relationship_patterns:
    - one_to_many        # Venue->Room, Room->TimeSlot, Booking->Participant
    - cross_aggregate    # Booking references TimeSlot (under Room aggregate) and GiftCard
    - polymorphic        # GiftCardEntry.related_booking_id may be null (top-up vs spend)

  role_model: peer_roles
  # Customer owns own bookings/participants; VenueManager configures rooms/pricing/gift
  # cards; GameMaster runs check-in/complete; PlatformAdmin is opaque operator.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Venue name" }
      - { name: timezone, type: string, source: input, description: "IANA tz name (e.g. America/New_York); informational, all stored times are UTC" }
      - { name: open_minute_of_day, type: integer, source: input, description: "Daily opening as minutes from local midnight, 0..1439", constraints: "0 <= open_minute_of_day < close_minute_of_day" }
      - { name: close_minute_of_day, type: integer, source: input, description: "Daily closing as minutes from local midnight, 1..1440", constraints: "open_minute_of_day < close_minute_of_day <= 1440" }
      - { name: no_show_fee_pct, type: number, source: input, description: "Fraction of booking final_charge_cents retained on NO_SHOW, 0.0..1.0", default: 0.5, constraints: "0.0 <= no_show_fee_pct <= 1.0" }
      - { name: no_show_strike_limit, type: integer, source: input, description: "Strike count at which a Customer is barred from new CONFIRMED bookings (>= triggers block)", default: 3, constraints: ">= 1" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision; refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Room
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; set from path on create" }
      - { name: name, type: string, source: input, description: "Room/attraction name" }
      - { name: min_group_size, type: integer, source: input, description: "Minimum participants for any booking", constraints: ">= 1 and <= max_group_size" }
      - { name: max_group_size, type: integer, source: input, description: "Maximum participants for any booking", constraints: ">= min_group_size" }
      - { name: min_age, type: integer, source: input, description: "Minimum participant age in whole years; 0 means no age floor", default: 0, constraints: ">= 0" }
      - { name: waiver_required, type: boolean, source: input, description: "If true every participant must have waiver_signed before CHECKED_IN", default: true }
      - { name: base_price_cents, type: integer, source: input, description: "Per-participant base price in cents before pricing rules", constraints: ">= 0" }
      - { name: private_surcharge_cents, type: integer, source: input, description: "Flat surcharge added to a private booking (whole room reserved)", default: 0, constraints: ">= 0" }
      - { name: game_minutes, type: integer, source: input, description: "Active play duration of the experience in minutes", constraints: ">= 1" }
      - { name: reset_buffer_minutes, type: integer, source: input, description: "Buffer/reset time after game_minutes during which the room is unavailable", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: "ACTIVE", constraints: "ACTIVE, RETIRED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: PricingRule
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; set from path on create" }
      - { name: room_id, type: string, source: input, description: "FK -> Room.id; rule applies only to bookings of this room" }
      - { name: peak_dow_mask, type: integer, source: input, description: "Bitmask of peak days-of-week (bit0=Monday ... bit6=Sunday) computed against slot start_utc UTC weekday", constraints: "0..127" }
      - { name: peak_start_minute_of_day, type: integer, source: input, description: "Peak window start, minutes from UTC midnight, inclusive", constraints: "0..1439" }
      - { name: peak_end_minute_of_day, type: integer, source: input, description: "Peak window end, minutes from UTC midnight, exclusive", constraints: "peak_start_minute_of_day < peak_end_minute_of_day <= 1440" }
      - { name: peak_multiplier_bps, type: integer, source: input, description: "Peak per-participant price multiplier in basis points (10000 = 1.0x)", default: 10000, constraints: ">= 10000" }
      - { name: large_group_threshold, type: integer, source: input, description: "Group size at which the large-group multiplier applies (>= threshold triggers)", constraints: ">= 1" }
      - { name: large_group_multiplier_bps, type: integer, source: input, description: "Large-group multiplier in basis points applied to per-participant price", default: 10000, constraints: ">= 10000" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: GameMaster
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; set from path on create" }
      - { name: full_name, type: string, source: input, description: "Game master display name" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | OFF_DUTY", default: "AVAILABLE", constraints: "AVAILABLE, OFF_DUTY" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of TimeSlot rows in {HELD,BOOKED} whose assigned_game_master_id == this id", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: TimeSlot
    parent: Room
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; set from path on create" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; copied from room on create" }
      - { name: start_utc, type: datetime, source: input, description: "Slot game start (ISO 8601 UTC). Occupied interval is [start_utc, start_utc + room.game_minutes + room.reset_buffer_minutes)" }
      - { name: game_end_utc, type: datetime, source: computed, description: "start_utc + room.game_minutes minutes" }
      - { name: block_end_utc, type: datetime, source: computed, description: "start_utc + room.game_minutes + room.reset_buffer_minutes minutes; end of the resource-occupation interval" }
      - { name: assigned_game_master_id, type: string, source: system, description: "FK -> GameMaster.id; null until a booking is held; set on HELD, cleared on revert to OPEN" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; the booking currently holding this slot, null when OPEN/BLOCKED/CLOSED" }
      - { name: status, type: enum, source: system, description: "OPEN | HELD | BOOKED | BLOCKED | CLOSED", default: "OPEN", constraints: "OPEN, HELD, BOOKED, BLOCKED, CLOSED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only; equals X-User-ID when acting as Customer" }
      - { name: email, type: string, source: input, description: "Customer email (unique, case-insensitive)" }
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: no_show_strike_count, type: integer, source: computed, description: "Count of this customer's bookings in NO_SHOW lifecycle_status; risk score gating new bookings", default: 0 }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Booking
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; copied from slot's room on create" }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; copied from the held slot" }
      - { name: time_slot_id, type: string, source: input, description: "FK -> TimeSlot.id; the slot this booking grabs (must be OPEN at create)" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the booking owner" }
      - { name: gift_card_id, type: string, source: input, description: "FK -> GiftCard.id; optional gift card applied at confirm time; null when paying by card" }
      - { name: group_size, type: integer, source: input, description: "Number of participants intended (must be within room min/max)", constraints: "room.min_group_size <= group_size <= room.max_group_size" }
      - { name: is_private, type: boolean, source: input, description: "Whether the whole room is reserved privately (adds private_surcharge_cents)", default: false }
      - { name: quoted_charge_cents, type: integer, source: computed, description: "Forward-looking price quote at DRAFT/CONFIRM using group_size; see price_quote calc" }
      - { name: final_charge_cents, type: integer, source: computed, description: "Chronological settled charge at COMPLETED/NO_SHOW using checked-in participants; see price_settlement calc" }
      - { name: gift_card_applied_cents, type: integer, source: computed, description: "Amount drawn from gift card at confirm, <= quoted_charge_cents and <= gift card balance", default: 0 }
      - { name: no_show_fee_cents, type: integer, source: computed, description: "Fee retained on NO_SHOW; 0 otherwise", default: 0 }
      - { name: lifecycle_status, type: enum, source: system, description: "DRAFT | CONFIRMED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", default: "DRAFT", constraints: "DRAFT, CONFIRMED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | AUTHORIZED | CAPTURED | REFUNDED — independent axis evolving with lifecycle", default: "UNPAID", constraints: "UNPAID, AUTHORIZED, CAPTURED, REFUNDED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Participant
    parent: Booking
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; set from path on create" }
      - { name: display_name, type: string, source: input, description: "Participant name" }
      - { name: age, type: integer, source: input, description: "Participant age in whole years", constraints: ">= 0" }
      - { name: waiver_status, type: enum, source: system, description: "PENDING | SIGNED | REVOKED", default: "PENDING", constraints: "PENDING, SIGNED, REVOKED" }
      - { name: checked_in, type: boolean, source: system, description: "True if this participant was present at check-in; drives final settlement count", default: false }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: GiftCard
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: system, description: "FK -> Venue.id; gift card is venue-scoped" }
      - { name: code, type: string, source: input, description: "Redemption code (unique within venue, case-insensitive)" }
      - { name: initial_balance_cents, type: integer, source: input, description: "Issued face value in cents", constraints: ">= 1" }
      - { name: balance_cents, type: integer, source: computed, description: "Current redeemable balance; equals initial_balance_cents + sum(GiftCardEntry.delta_cents)", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DEPLETED | VOID", default: "ACTIVE", constraints: "ACTIVE, DEPLETED, VOID" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: GiftCardEntry
    parent: GiftCard
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: gift_card_id, type: string, source: system, description: "FK -> GiftCard.id; set from path/context on create" }
      - { name: related_booking_id, type: string, source: system, description: "FK -> Booking.id; the booking that caused this entry, null for manual top-ups" }
      - { name: entry_type, type: enum, source: system, description: "SPEND | REFUND | TOPUP", constraints: "SPEND, REFUND, TOPUP" }
      - { name: delta_cents, type: integer, source: system, description: "Signed change to balance: SPEND negative, REFUND positive, TOPUP positive" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, ms precision; append-only, never mutated" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # --------------------------------------------------------------------------
  # TimeSlot — branching with revert. OPEN <-> HELD, HELD -> BOOKED -> OPEN,
  # plus manager BLOCK/CLOSE. assigned_game_master_id and booking_id cycle.
  # --------------------------------------------------------------------------
  - entity: TimeSlot
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: HELD
        trigger: "POST /bookings (slot grab while creating a DRAFT booking)"
        actor: Customer
        preconditions:
          - "slot.status == OPEN"
          - "slot's room.status == ACTIVE"
          - "no other TimeSlot of the SAME room in {HELD,BOOKED} whose [start_utc, block_end_utc) interval overlaps this slot's interval (half-open overlap on same room)"
          - "at least one GameMaster of the venue is AVAILABLE and has no {HELD,BOOKED} slot of ANY room whose [start_utc, block_end_utc) interval overlaps this slot's game window [start_utc, game_end_utc) (closed-on-start, half-open-on-end staff overlap)"
        side_effects:
          - "slot.status -> HELD"
          - "slot.booking_id = new booking.id"
          - "slot.assigned_game_master_id = selected GameMaster (eligibility: status==AVAILABLE AND no overlapping {HELD,BOOKED} assignment per precondition; ranking: active_assignment_count ASC; tie-break: created_at ASC; empty pool -> ERR_NO_GAMEMASTER_AVAILABLE)"
          - "selected GameMaster.active_assignment_count += 1 (recomputed)"
          - "new Booking created in lifecycle_status=DRAFT, payment_status=UNPAID"
          - "increments TimeSlot.version by 1"
        note: "This is the CREATE-with-supersede write guarded by OCC on TimeSlot.version (see concurrency_rules slot-grab-stale-slot)."

      - from: HELD
        to: BOOKED
        trigger: "POST /bookings/{booking_id}/confirm"
        actor: Customer
        preconditions:
          - "booking.lifecycle_status == DRAFT"
          - "slot.status == HELD"
        side_effects:
          - "slot.status -> BOOKED"
          - "increments TimeSlot.version by 1"

      - from: [HELD, BOOKED]
        to: OPEN
        trigger: "system (booking cancelled or rescheduled away from this slot)"
        actor: system
        preconditions:
          - "owning booking transitions to CANCELLED, or booking reschedules onto a different slot"
        side_effects:
          - "slot.status -> OPEN"
          - "slot.booking_id = null"
          - "freed GameMaster.active_assignment_count -= 1 (recomputed) and slot.assigned_game_master_id = null"
          - "increments TimeSlot.version by 1"
        note: "Compensation: reverses the HELD side effects; gm assignment count conserved."

      - from: OPEN
        to: BLOCKED
        trigger: "POST /time-slots/{slot_id}/block"
        actor: VenueManager
        preconditions:
          - "slot.status == OPEN"
        side_effects:
          - "slot.status -> BLOCKED (maintenance/reset hold, not bookable)"
          - "increments TimeSlot.version by 1"

      - from: BLOCKED
        to: OPEN
        trigger: "POST /time-slots/{slot_id}/unblock"
        actor: VenueManager
        preconditions:
          - "slot.status == BLOCKED"
        side_effects:
          - "slot.status -> OPEN"
          - "increments TimeSlot.version by 1"

      - from: [OPEN, BLOCKED]
        to: CLOSED
        trigger: "POST /time-slots/{slot_id}/close"
        actor: VenueManager
        preconditions:
          - "slot.status in {OPEN, BLOCKED} (a HELD/BOOKED slot cannot be closed)"
        side_effects:
          - "slot.status -> CLOSED (permanently removed from inventory)"
          - "increments TimeSlot.version by 1"

  # --------------------------------------------------------------------------
  # Booking — lifecycle axis. DRAFT -> CONFIRMED -> CHECKED_IN -> COMPLETED;
  # CONFIRMED -> {NO_SHOW, CANCELLED}; CONFIRMED -> CONFIRMED (reschedule cycle).
  # Cross-entity guarded by TimeSlot, Participant, GiftCard, Customer state.
  # --------------------------------------------------------------------------
  - entity: Booking
    field: lifecycle_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /bookings/{booking_id}/confirm"
        actor: Customer
        preconditions:
          - "booking.lifecycle_status == DRAFT"
          - "held slot.status == HELD"
          - "owning Customer.no_show_strike_count < venue.no_show_strike_limit (cross-entity gate on Customer)"
          - "if gift_card_id present: GiftCard.status == ACTIVE and GiftCard.venue_id == booking.venue_id (cross-entity gate on GiftCard)"
        side_effects:
          - "quoted_charge_cents computed via price_quote calc"
          - "if gift_card_id present: gift_card_applied_cents = min(quoted_charge_cents, GiftCard.balance_cents); a SPEND GiftCardEntry of delta_cents = -gift_card_applied_cents is appended; GiftCard.balance_cents recomputed; if balance reaches 0 GiftCard.status -> DEPLETED"
          - "payment_status -> AUTHORIZED (authorizes quoted_charge_cents - gift_card_applied_cents on card)"
          - "TimeSlot HELD -> BOOKED (see TimeSlot machine)"
          - "lifecycle_status -> CONFIRMED"
          - "increments Booking.version by 1"
        note: "Cascade origin (depth 3): confirm -> GiftCardEntry append -> GiftCard.balance recompute -> GiftCard.status DEPLETED."

      - from: CONFIRMED
        to: CONFIRMED
        trigger: "POST /bookings/{booking_id}/reschedule"
        actor: Customer
        preconditions:
          - "booking.lifecycle_status == CONFIRMED"
          - "target new_time_slot_id refers to an OPEN slot of the SAME room as the current booking"
          - "new slot passes the same room-overlap and game-master-overlap preconditions as the OPEN->HELD transition"
          - "request carries expected_time_slot_version equal to the CURRENT (old) slot's version (OCC)"
        side_effects:
          - "old slot: BOOKED -> OPEN (compensation; frees its GameMaster, clears booking_id)"
          - "new slot: OPEN -> HELD -> BOOKED, assigned_game_master_id selected by same selector, booking_id = this booking"
          - "booking.time_slot_id and room_id-derived fields updated; quoted_charge_cents recomputed via price_quote (peak window may differ)"
          - "if a gift card was applied: NO change to gift_card_applied_cents at reschedule (quote delta is re-authorized on card only)"
          - "increments Booking.version by 1"
        note: "Cyclic self-transition (CONFIRMED->CONFIRMED). Cascade origin (depth 2): reschedule -> old TimeSlot OPEN -> freed GameMaster.active_assignment_count decrement."

      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{booking_id}/check-in"
        actor: GameMaster
        preconditions:
          - "booking.lifecycle_status == CONFIRMED"
          - "count of Participant rows with checked_in==true >= room.min_group_size (at least the minimum group actually present)"
          - "if room.waiver_required: every Participant with checked_in==true has waiver_status == SIGNED"
          - "every Participant with checked_in==true has age >= room.min_age"
        side_effects:
          - "lifecycle_status -> CHECKED_IN"
          - "increments Booking.version by 1"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /bookings/{booking_id}/complete"
        actor: GameMaster
        preconditions:
          - "booking.lifecycle_status == CHECKED_IN"
        side_effects:
          - "final_charge_cents computed via price_settlement calc (uses count of checked_in participants, not group_size)"
          - "payment_status AUTHORIZED -> CAPTURED (captures final_charge_cents - gift_card_applied_cents)"
          - "lifecycle_status -> COMPLETED"
          - "increments Booking.version by 1"

      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /bookings/{booking_id}/no-show"
        actor: GameMaster
        preconditions:
          - "booking.lifecycle_status == CONFIRMED"
        side_effects:
          - "no_show_fee_cents = round_half_up(quoted_charge_cents * venue.no_show_fee_pct) (gift-card-funded portion is NOT refunded; card portion stays spent)"
          - "final_charge_cents = no_show_fee_cents"
          - "payment_status AUTHORIZED -> CAPTURED (captures the no_show_fee_cents card portion; remainder voided)"
          - "slot: BOOKED -> OPEN (compensation, frees GameMaster)"
          - "owning Customer.no_show_strike_count recomputed (+1) — risk scoring cascade"
          - "lifecycle_status -> NO_SHOW"
          - "increments Booking.version by 1"
        note: "Cascade origin (depth 3): no-show -> Customer.no_show_strike_count increment -> (when count reaches venue.no_show_strike_limit) Customer can no longer reach CONFIRMED on future bookings."

      - from: [DRAFT, CONFIRMED]
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/cancel"
        actor: Customer
        preconditions:
          - "booking.lifecycle_status in {DRAFT, CONFIRMED}"
        side_effects:
          - "if a gift card SPEND was applied (CONFIRMED): a REFUND GiftCardEntry of delta_cents = +gift_card_applied_cents is appended; GiftCard.balance_cents recomputed; if GiftCard.status was DEPLETED and balance > 0 it returns to ACTIVE; gift_card_applied_cents reset to 0"
          - "payment_status -> REFUNDED if was AUTHORIZED/CAPTURED, else stays UNPAID"
          - "held/booked slot -> OPEN (compensation; frees GameMaster)"
          - "lifecycle_status -> CANCELLED"
          - "increments Booking.version by 1"
        note: "Compensating action: cancel of a CONFIRMED booking restores gift card balance exactly (conserved quantity = initial_balance_cents + sum(entries))."

  # --------------------------------------------------------------------------
  # Booking — payment_status axis (parallel dimension on the SAME entity).
  # Evolves under lifecycle transitions above; listed separately to make the
  # parallel-dimension shape explicit (Rule 3).
  # --------------------------------------------------------------------------
  - entity: Booking
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: AUTHORIZED
        trigger: "system (booking confirm)"
        actor: system
        preconditions:
          - "lifecycle DRAFT -> CONFIRMED fired"
        side_effects:
          - "authorizes (quoted_charge_cents - gift_card_applied_cents) on card"
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "system (booking complete or no-show)"
        actor: system
        preconditions:
          - "lifecycle CHECKED_IN -> COMPLETED, or CONFIRMED -> NO_SHOW fired"
        side_effects:
          - "captures final_charge_cents - gift_card_applied_cents (complete) or no_show_fee_cents card portion (no-show)"
      - from: [AUTHORIZED, CAPTURED]
        to: REFUNDED
        trigger: "system (booking cancel)"
        actor: system
        preconditions:
          - "lifecycle -> CANCELLED fired on a previously CONFIRMED booking"
        side_effects:
          - "voids/refunds the card authorization or capture in full"

  # --------------------------------------------------------------------------
  # Participant — waiver loop (cyclic: SIGNED -> REVOKED -> SIGNED).
  # --------------------------------------------------------------------------
  - entity: Participant
    field: waiver_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: [PENDING, REVOKED]
        to: SIGNED
        trigger: "POST /participants/{participant_id}/sign-waiver"
        actor: Customer
        preconditions:
          - "owning booking.lifecycle_status in {DRAFT, CONFIRMED} (waivers signed before check-in)"
          - "participant.age >= owning room.min_age"
        side_effects:
          - "waiver_status -> SIGNED"
          - "increments Participant.version by 1"
      - from: SIGNED
        to: REVOKED
        trigger: "POST /participants/{participant_id}/revoke-waiver"
        actor: Customer
        preconditions:
          - "owning booking.lifecycle_status in {DRAFT, CONFIRMED}"
        side_effects:
          - "waiver_status -> REVOKED"
          - "increments Participant.version by 1"

  # --------------------------------------------------------------------------
  # GiftCard — balance-driven status. ACTIVE <-> DEPLETED (cyclic via refund),
  # ACTIVE/DEPLETED -> VOID (manager).
  # --------------------------------------------------------------------------
  - entity: GiftCard
    field: status
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: DEPLETED
        trigger: "system (SPEND entry drives balance_cents to 0)"
        actor: system
        preconditions:
          - "balance_cents == 0 after a SPEND GiftCardEntry append"
        side_effects:
          - "status -> DEPLETED"
      - from: DEPLETED
        to: ACTIVE
        trigger: "system (REFUND entry restores balance_cents > 0)"
        actor: system
        preconditions:
          - "balance_cents > 0 after a REFUND GiftCardEntry append"
        side_effects:
          - "status -> ACTIVE"
      - from: [ACTIVE, DEPLETED]
        to: VOID
        trigger: "POST /gift-cards/{gift_card_id}/void"
        actor: VenueManager
        preconditions:
          - "no Booking in lifecycle_status==CONFIRMED currently holding a SPEND against this card (i.e. no outstanding authorized draw)"
        side_effects:
          - "status -> VOID; balance frozen, no further SPEND/REFUND/TOPUP accepted"
          - "increments GiftCard.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: slot-grab-stale-slot
    parent_entity: TimeSlot
    write_endpoint: "POST /bookings"
    occ_field: "expected_time_slot_version"
    description: |
      Creating a Booking grabs an OPEN TimeSlot and transitions it to HELD. If the
      slot's version has advanced since the client last observed it (another writer
      already grabbed it, legitimately superseding the OPEN state under the booking
      flow), the create is rejected on the stale version. The slot-grab is a true
      CREATE-with-supersede write: a second client observing the same OPEN slot and
      version would itself legitimately succeed under product semantics, so the
      conflict is resolved by OCC on TimeSlot.version rather than a state precondition.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

  - rule_id: reschedule-stale-slot
    parent_entity: TimeSlot
    write_endpoint: "POST /bookings/{booking_id}/reschedule"
    occ_field: "expected_time_slot_version"
    description: |
      Rescheduling a CONFIRMED booking releases the current (old) slot and grabs a new
      OPEN slot. The request carries expected_time_slot_version for the CURRENT slot; if
      that slot's version has advanced since the client observed it, the reschedule is
      rejected on the stale version. This is the CREATE-with-supersede pattern applied to
      the slot swap.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  # --- DUAL-VARIANT pair #1 lives across price_quote (Booking, forward) and
  #     no_show_strike_score (Customer, chronological count) — different domains.
  - name: price_quote
    trigger: "Booking DRAFT->CONFIRMED (confirm), and recomputed on CONFIRMED->CONFIRMED (reschedule)"
    algorithm: forward_looking
    formula: |
      # Forward-looking: uses the INTENDED group_size, not who actually shows up.
      # Evaluation order is pinned (Rule 2c circular-look avoidance):
      #   1. per_participant = base_price_cents
      #   2. if slot falls in a peak window for the room (PricingRule whose room_id==booking.room_id,
      #      slot.start_utc UTC weekday bit set in peak_dow_mask, and
      #      peak_start_minute_of_day <= (slot.start_utc minute-of-day UTC) < peak_end_minute_of_day):
      #         per_participant = floor(per_participant * peak_multiplier_bps / 10000)
      #   3. if group_size >= large_group_threshold:
      #         per_participant = floor(per_participant * large_group_multiplier_bps / 10000)
      #   4. line_total = per_participant * group_size       # whole-group computed AFTER per-participant rounding (round-then-multiply order pinned)
      #   5. if is_private: line_total += room.private_surcharge_cents
      #   6. quoted_charge_cents = line_total
      # If NO PricingRule matches the room, peak and large-group multipliers are 1.0x (10000 bps).
    input_set: "Single Booking + its Room + the one PricingRule for booking.room_id (if any). group_size is the intended size."
    constants:
      BPS_DENOM: 10000
    precision: "integer cents; floor on each per-participant multiplier step, in the pinned order above"
    variants:
      - name: quote_at_confirm
        when: "DRAFT->CONFIRMED"
        difference: "uses group_size as the participant count"
      - name: quote_at_reschedule
        when: "CONFIRMED->CONFIRMED reschedule onto a new slot"
        difference: "recomputed because the new slot may fall in a different peak window; group_size unchanged"

  - name: price_settlement
    trigger: "Booking CHECKED_IN->COMPLETED (complete)"
    algorithm: chronological
    formula: |
      # Chronological / actuals: uses the count of Participants with checked_in==true
      # (settled_count), which may be < group_size if some no-showed individually.
      # Same pinned per-participant order as price_quote, but multiplies by settled_count:
      #   1. per_participant = base_price_cents
      #   2. peak step (same predicate as price_quote, evaluated against the CURRENT slot)
      #   3. large-group step: applies iff settled_count >= large_group_threshold
      #      (NOTE: uses settled_count, not group_size — a group that booked large but
      #       checked in small loses the large-group multiplier)
      #   4. line_total = per_participant * settled_count
      #   5. if is_private: line_total += room.private_surcharge_cents
      #   6. final_charge_cents = line_total
    input_set: "Single Booking + its Room + PricingRule for booking.room_id + Participants where checked_in==true."
    constants:
      BPS_DENOM: 10000
    precision: "integer cents; floor on each per-participant multiplier step, same pinned order as price_quote"
    variants:
      - name: settle_full_group
        when: "all booked participants checked in"
        difference: "settled_count == group_size, so final_charge_cents == quoted_charge_cents"
      - name: settle_partial_group
        when: "some participants not checked in"
        difference: "settled_count < group_size; large-group multiplier may drop out, diverging from the quote"

  - name: no_show_fee
    trigger: "Booking CONFIRMED->NO_SHOW (no-show)"
    algorithm: threshold
    formula: |
      no_show_fee_cents = round_half_up(quoted_charge_cents * venue.no_show_fee_pct)
      final_charge_cents = no_show_fee_cents
    input_set: "Single Booking quoted_charge_cents + owning Venue.no_show_fee_pct"
    constants: {}
    precision: "round_half_up to integer cents"

  - name: no_show_strike_score
    trigger: "Booking CONFIRMED->NO_SHOW; recomputed whenever a booking of the customer enters/leaves NO_SHOW"
    algorithm: aggregation
    formula: |
      no_show_strike_count = count of Booking rows where customer_id == this customer
                             AND lifecycle_status == NO_SHOW
      # Risk gate: a Customer with no_show_strike_count >= venue.no_show_strike_limit
      # cannot drive any booking DRAFT->CONFIRMED at that venue.
    input_set: "All Bookings for the customer in lifecycle_status == NO_SHOW (no time window; full history). Tie-break n/a (count)."
    constants: {}
    precision: "integer count"

  - name: gift_card_balance
    trigger: "any GiftCardEntry append (SPEND on confirm, REFUND on cancel, TOPUP on manual top-up)"
    algorithm: aggregation
    formula: |
      balance_cents = initial_balance_cents + sum(GiftCardEntry.delta_cents
                        for entries where gift_card_id == this card, ALL entries, no status filter)
      # Conserved-quantity invariant (Rule 9): for any booking that applies then refunds a
      # card (confirm SPEND -delta, cancel REFUND +delta of equal magnitude), the running
      # balance_cents returns to its pre-confirm value exactly. delta magnitudes are equal
      # because gift_card_applied_cents is the single source for both signs.
    input_set: "All GiftCardEntry rows for the card (append-only log; no filtering)."
    constants: {}
    precision: "integer cents; balance_cents floored at 0 is impossible because gift_card_applied_cents <= balance_cents at SPEND time"

  - name: gamemaster_load
    trigger: "TimeSlot enters/leaves {HELD,BOOKED} (slot grab, confirm, cancel, reschedule, no-show)"
    algorithm: aggregation
    formula: |
      active_assignment_count = count of TimeSlot rows where assigned_game_master_id == this gm
                                AND status IN {HELD, BOOKED}
      # Selector for assignment at OPEN->HELD: candidate set = GameMasters where status==AVAILABLE
      # AND no {HELD,BOOKED} slot of ANY room overlapping the target game window
      # [start_utc, game_end_utc). Ranking: active_assignment_count ASC. Tie-break: created_at ASC.
      # Empty candidate set -> ERR_NO_GAMEMASTER_AVAILABLE.
    input_set: "All TimeSlot rows in {HELD,BOOKED} assigned to the gm."
    constants: {}
    precision: "integer count"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix; for entity_backed Customer acting on a booking, X-User-ID must equal booking.customer_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Referenced resources in the path exist, validated left-to-right (venue, then room, then slot/booking, then participant)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Referenced resources in the body exist (time_slot_id, customer_id, gift_card_id, room_id)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "booking create/confirm/reschedule, pricing-rule create"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum values valid; numeric ranges (group_size integer, age >= 0)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 6
    category: state
    check: "Target resource in a valid state for the requested transition (slot OPEN to grab, booking DRAFT to confirm, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 7
    category: business_constraint
    check: "OCC: expected_time_slot_version matches current TimeSlot.version on slot-grab and reschedule"
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412
    applies_to: "POST /bookings, POST /bookings/{booking_id}/reschedule"

  - priority: 8
    category: business_safety
    check: "Age rule: at check-in every checked_in participant has age >= room.min_age"
    error_id: ERR_AGE_REQUIREMENT_NOT_MET
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/check-in, sign-waiver"

  - priority: 9
    category: business_safety
    check: "Waiver rule: if room.waiver_required, every checked_in participant has waiver_status==SIGNED at check-in"
    error_id: ERR_WAIVER_NOT_SIGNED
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/check-in"

  - priority: 10
    category: business_constraint
    check: "Group-size rule: group_size within [room.min_group_size, room.max_group_size] at booking create; checked_in count >= room.min_group_size at check-in"
    error_id: ERR_GROUP_SIZE_INVALID
    http_status: 409
    applies_to: "POST /bookings, check-in"

  - priority: 11
    category: business_temporal
    check: "Same-room temporal overlap: target slot's [start_utc, block_end_utc) must not overlap any {HELD,BOOKED} slot of the same room (includes reset buffer)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /bookings, reschedule, slot create"

  - priority: 12
    category: business_temporal
    check: "Game-master temporal overlap: no AVAILABLE gm free whose existing {HELD,BOOKED} game windows [start_utc, game_end_utc) avoid the target game window (buffer excluded for staff)"
    error_id: ERR_NO_GAMEMASTER_AVAILABLE
    http_status: 409
    applies_to: "POST /bookings, reschedule"

  - priority: 13
    category: business_safety
    check: "No-show risk gate: owning Customer.no_show_strike_count < venue.no_show_strike_limit before DRAFT->CONFIRMED"
    error_id: ERR_NO_SHOW_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/confirm"

  - priority: 14
    category: business_fiscal
    check: "Gift card usable: GiftCard.status==ACTIVE, venue matches, and balance_cents > 0 when applied at confirm"
    error_id: ERR_GIFT_CARD_UNUSABLE
    http_status: 409
    applies_to: "POST /bookings/{booking_id}/confirm"

  - priority: 15
    category: business_constraint
    check: "Slot within venue operating window: slot game window fits between open_minute_of_day and close_minute_of_day (informational tz, evaluated on UTC minute-of-day)"
    error_id: ERR_OUTSIDE_OPERATING_HOURS
    http_status: 409
    applies_to: "POST /time-slots"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Venue ---
  - method: POST
    path: "/venues"
    description: "Create venue"
    roles: [PlatformAdmin]
    code: 201
    input: [name, timezone, open_minute_of_day, close_minute_of_day, "no_show_fee_pct?", "no_show_strike_limit?"]
    output: Venue
    side_effects: ["version=1"]

  - method: GET
    path: "/venues/{venue_id}"
    description: "Read venue"
    roles: [PlatformAdmin, VenueManager, GameMaster, Customer]
    code: 200
    input: []
    output: Venue
    side_effects: []

  # --- Room (flat; venue_id in body / filter) ---
  - method: POST
    path: "/rooms"
    description: "Create room under a venue"
    roles: [VenueManager]
    code: 201
    input: [venue_id, name, min_group_size, max_group_size, base_price_cents, game_minutes, "min_age?", "waiver_required?", "private_surcharge_cents?", "reset_buffer_minutes?"]
    output: Room
    side_effects: ["status=ACTIVE", "version=1"]

  - method: GET
    path: "/rooms/{room_id}"
    description: "Read room"
    roles: [PlatformAdmin, VenueManager, GameMaster, Customer]
    code: 200
    input: []
    output: Room
    side_effects: []

  - method: GET
    path: "/rooms"
    description: "List rooms (filtered; reverse-reachability for Room.venue_id)"
    roles: [PlatformAdmin, VenueManager, GameMaster, Customer]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: Room[]
    side_effects: []

  - method: POST
    path: "/rooms/{room_id}/retire"
    description: "Retire a room (no new bookings)"
    roles: [VenueManager]
    code: 200
    input: [expected_room_version]
    output: Room
    side_effects: ["status -> RETIRED", "increments Room.version by 1"]

  # --- PricingRule (flat; venue_id + room_id in body / filter) ---
  - method: POST
    path: "/pricing-rules"
    description: "Create pricing rule for a room"
    roles: [VenueManager]
    code: 201
    input: [venue_id, room_id, peak_dow_mask, peak_start_minute_of_day, peak_end_minute_of_day, large_group_threshold, "peak_multiplier_bps?", "large_group_multiplier_bps?"]
    output: PricingRule
    side_effects: ["version=1"]

  - method: GET
    path: "/pricing-rules/{pricing_rule_id}"
    description: "Read pricing rule"
    roles: [PlatformAdmin, VenueManager, Customer]
    code: 200
    input: []
    output: PricingRule
    side_effects: []

  - method: GET
    path: "/pricing-rules"
    description: "List pricing rules (filtered; reverse-reachability for PricingRule.venue_id and PricingRule.room_id)"
    roles: [PlatformAdmin, VenueManager, Customer]
    code: 200
    input: ["venue_id?", "room_id?", "limit?", "offset?"]
    output: PricingRule[]
    side_effects: []

  # --- GameMaster (flat; venue_id in body / filter) ---
  - method: POST
    path: "/game-masters"
    description: "Create game master under a venue"
    roles: [VenueManager]
    code: 201
    input: [venue_id, full_name]
    output: GameMaster
    side_effects: ["status=AVAILABLE", "active_assignment_count=0", "version=1"]

  - method: GET
    path: "/game-masters/{game_master_id}"
    description: "Read game master (includes active_assignment_count)"
    roles: [PlatformAdmin, VenueManager, GameMaster]
    code: 200
    input: []
    output: GameMaster
    side_effects: []

  - method: GET
    path: "/game-masters"
    description: "List game masters (filtered; reverse-reachability for GameMaster.venue_id)"
    roles: [PlatformAdmin, VenueManager, GameMaster]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: GameMaster[]
    side_effects: []

  - method: POST
    path: "/game-masters/{game_master_id}/set-status"
    description: "Set a game master AVAILABLE or OFF_DUTY"
    roles: [VenueManager]
    code: 200
    input: [status, expected_game_master_version]
    output: GameMaster
    side_effects: ["status updated", "increments GameMaster.version by 1"]

  # --- TimeSlot (flat; room_id in body / filter) ---
  - method: POST
    path: "/time-slots"
    description: "Create a bookable time slot for a room"
    roles: [VenueManager]
    code: 201
    input: [room_id, start_utc]
    output: TimeSlot
    side_effects: ["status=OPEN", "venue_id copied from room", "game_end_utc and block_end_utc computed", "version=1"]

  - method: GET
    path: "/time-slots/{slot_id}"
    description: "Read time slot"
    roles: [PlatformAdmin, VenueManager, GameMaster, Customer]
    code: 200
    input: []
    output: TimeSlot
    side_effects: []

  - method: GET
    path: "/time-slots"
    description: "List time slots (filtered; reverse-reachability for TimeSlot.room_id, TimeSlot.venue_id, TimeSlot.assigned_game_master_id, TimeSlot.booking_id)"
    roles: [PlatformAdmin, VenueManager, GameMaster, Customer]
    code: 200
    input: ["room_id?", "venue_id?", "assigned_game_master_id?", "booking_id?", "status?", "limit?", "offset?"]
    output: TimeSlot[]
    side_effects: []

  - method: POST
    path: "/time-slots/{slot_id}/block"
    description: "Block an OPEN slot (maintenance)"
    roles: [VenueManager]
    code: 200
    input: [expected_time_slot_version]
    output: TimeSlot
    side_effects: ["status OPEN -> BLOCKED", "increments TimeSlot.version by 1"]

  - method: POST
    path: "/time-slots/{slot_id}/unblock"
    description: "Unblock a BLOCKED slot"
    roles: [VenueManager]
    code: 200
    input: [expected_time_slot_version]
    output: TimeSlot
    side_effects: ["status BLOCKED -> OPEN", "increments TimeSlot.version by 1"]

  - method: POST
    path: "/time-slots/{slot_id}/close"
    description: "Permanently close an OPEN/BLOCKED slot"
    roles: [VenueManager]
    code: 200
    input: [expected_time_slot_version]
    output: TimeSlot
    side_effects: ["status -> CLOSED", "increments TimeSlot.version by 1"]

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Register a customer"
    roles: [PlatformAdmin, Customer]
    code: 201
    input: [email, full_name]
    output: Customer
    side_effects: ["no_show_strike_count=0", "version=1"]

  - method: GET
    path: "/customers/{customer_id}"
    description: "Read customer (includes no_show_strike_count)"
    roles: [PlatformAdmin, VenueManager, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Booking (flat; cross-aggregate FKs in body / filter) ---
  - method: POST
    path: "/bookings"
    description: "Create booking: grab an OPEN slot (-> HELD), assign a game master, create DRAFT booking. OCC on slot."
    roles: [Customer]
    code: 201
    input: [time_slot_id, customer_id, group_size, expected_time_slot_version, "is_private?"]
    output: Booking
    side_effects:
      - "venue_id and room_id copied from the slot's room"
      - "slot OPEN -> HELD, assigned_game_master_id selected (selector in calc gamemaster_load)"
      - "selected GameMaster.active_assignment_count += 1 (recomputed)"
      - "increments TimeSlot.version by 1"
      - "Booking created lifecycle_status=DRAFT, payment_status=UNPAID"

  - method: GET
    path: "/bookings/{booking_id}"
    description: "Read booking (includes quoted/final/no_show charges and both status axes)"
    roles: [PlatformAdmin, VenueManager, GameMaster, Customer]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings (filtered; reverse-reachability for Booking.customer_id, Booking.time_slot_id, Booking.gift_card_id, Booking.room_id, Booking.venue_id)"
    roles: [PlatformAdmin, VenueManager, GameMaster, Customer]
    code: 200
    input: ["customer_id?", "time_slot_id?", "gift_card_id?", "room_id?", "venue_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{booking_id}/participants"
    description: "Add a participant to a DRAFT/CONFIRMED booking"
    roles: [Customer]
    code: 201
    input: [display_name, age]
    output: Participant
    side_effects: ["waiver_status=PENDING", "checked_in=false", "version=1"]

  - method: GET
    path: "/participants/{participant_id}"
    description: "Read participant"
    roles: [PlatformAdmin, VenueManager, GameMaster, Customer]
    code: 200
    input: []
    output: Participant
    side_effects: []

  - method: GET
    path: "/participants"
    description: "List participants (filtered; reverse-reachability for Participant.booking_id)"
    roles: [PlatformAdmin, VenueManager, GameMaster, Customer]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: Participant[]
    side_effects: []

  - method: POST
    path: "/participants/{participant_id}/sign-waiver"
    description: "Sign a participant's waiver"
    roles: [Customer]
    code: 200
    input: [expected_participant_version]
    output: Participant
    side_effects: ["waiver_status -> SIGNED", "increments Participant.version by 1"]

  - method: POST
    path: "/participants/{participant_id}/revoke-waiver"
    description: "Revoke a participant's waiver"
    roles: [Customer]
    code: 200
    input: [expected_participant_version]
    output: Participant
    side_effects: ["waiver_status -> REVOKED", "increments Participant.version by 1"]

  - method: POST
    path: "/participants/{participant_id}/mark-present"
    description: "Game master marks a participant present (checked_in=true) before check-in"
    roles: [GameMaster]
    code: 200
    input: [expected_participant_version]
    output: Participant
    side_effects: ["checked_in -> true", "increments Participant.version by 1"]

  - method: POST
    path: "/bookings/{booking_id}/confirm"
    description: "Confirm DRAFT booking: compute quote, apply gift card, authorize payment, slot HELD->BOOKED"
    roles: [Customer]
    code: 200
    input: ["gift_card_id?", "expected_booking_version"]
    output: Booking
    side_effects:
      - "quoted_charge_cents computed (price_quote)"
      - "if gift_card_id: SPEND GiftCardEntry appended, GiftCard.balance recomputed, DEPLETED if 0"
      - "payment_status -> AUTHORIZED, slot -> BOOKED, lifecycle_status -> CONFIRMED"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{booking_id}/reschedule"
    description: "Reschedule a CONFIRMED booking onto a new OPEN slot of the same room. OCC on the CURRENT slot."
    roles: [Customer]
    code: 200
    input: [new_time_slot_id, expected_time_slot_version, expected_booking_version]
    output: Booking
    side_effects:
      - "old slot BOOKED -> OPEN (frees gm), new slot OPEN -> BOOKED (assigns gm)"
      - "quoted_charge_cents recomputed (price_quote, new peak window)"
      - "increments Booking.version by 1 and both slots' versions by 1"

  - method: POST
    path: "/bookings/{booking_id}/check-in"
    description: "Game master checks in the present group (CONFIRMED->CHECKED_IN)"
    roles: [GameMaster]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects: ["lifecycle_status -> CHECKED_IN", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{booking_id}/complete"
    description: "Complete a CHECKED_IN booking: settle final charge, capture payment"
    roles: [GameMaster]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "final_charge_cents computed (price_settlement, checked_in count)"
      - "payment_status -> CAPTURED, lifecycle_status -> COMPLETED"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{booking_id}/no-show"
    description: "Mark a CONFIRMED booking NO_SHOW: retain fee, free slot, increment customer strike"
    roles: [GameMaster]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "no_show_fee_cents computed (no_show_fee), final_charge_cents = fee"
      - "payment_status -> CAPTURED, slot -> OPEN (frees gm)"
      - "owning Customer.no_show_strike_count recomputed (+1)"
      - "lifecycle_status -> NO_SHOW, increments Booking.version by 1"

  - method: POST
    path: "/bookings/{booking_id}/cancel"
    description: "Cancel a DRAFT/CONFIRMED booking: refund gift card spend, free slot"
    roles: [Customer]
    code: 200
    input: [expected_booking_version]
    output: Booking
    side_effects:
      - "if gift card SPEND applied: REFUND GiftCardEntry appended, balance restored, DEPLETED->ACTIVE if applicable"
      - "payment_status -> REFUNDED (if was AUTHORIZED/CAPTURED), slot -> OPEN (frees gm)"
      - "lifecycle_status -> CANCELLED, increments Booking.version by 1"

  # --- GiftCard (flat; venue_id in body / filter) ---
  - method: POST
    path: "/gift-cards"
    description: "Issue a gift card under a venue"
    roles: [VenueManager]
    code: 201
    input: [venue_id, code, initial_balance_cents]
    output: GiftCard
    side_effects: ["balance_cents=initial_balance_cents", "status=ACTIVE", "version=1"]

  - method: GET
    path: "/gift-cards/{gift_card_id}"
    description: "Read gift card (includes balance_cents)"
    roles: [PlatformAdmin, VenueManager, Customer]
    code: 200
    input: []
    output: GiftCard
    side_effects: []

  - method: GET
    path: "/gift-cards"
    description: "List gift cards (filtered; reverse-reachability for GiftCard.venue_id)"
    roles: [PlatformAdmin, VenueManager, Customer]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: GiftCard[]
    side_effects: []

  - method: POST
    path: "/gift-cards/{gift_card_id}/top-up"
    description: "Manually top up a gift card balance (appends TOPUP entry)"
    roles: [VenueManager]
    code: 200
    input: [amount_cents, expected_gift_card_version]
    output: GiftCard
    side_effects: ["TOPUP GiftCardEntry appended", "balance_cents recomputed", "increments GiftCard.version by 1"]

  - method: POST
    path: "/gift-cards/{gift_card_id}/void"
    description: "Void a gift card (no outstanding authorized draw)"
    roles: [VenueManager]
    code: 200
    input: [expected_gift_card_version]
    output: GiftCard
    side_effects: ["status -> VOID", "increments GiftCard.version by 1"]

  # --- GiftCardEntry (append-only ledger; flat read + filter) ---
  - method: GET
    path: "/gift-card-entries/{entry_id}"
    description: "Read a single gift card ledger entry"
    roles: [PlatformAdmin, VenueManager, Customer]
    code: 200
    input: []
    output: GiftCardEntry
    side_effects: []

  - method: GET
    path: "/gift-card-entries"
    description: "List gift card ledger entries (filtered; reverse-reachability for GiftCardEntry.gift_card_id and GiftCardEntry.related_booking_id)"
    roles: [PlatformAdmin, VenueManager, Customer]
    code: 200
    input: ["gift_card_id?", "related_booking_id?", "limit?", "offset?"]
    output: GiftCardEntry[]
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Customer acting on a booking they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path or body resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed body field, invalid enum, or out-of-range numeric" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_SLOT_VERSION, http: 412, condition: "expected_time_slot_version does not match current TimeSlot.version on slot-grab or reschedule" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<entity>_version does not match current version on a versioned non-slot mutation (booking/room/gift-card/participant/game-master)" }
  - { id: ERR_AGE_REQUIREMENT_NOT_MET, http: 409, condition: "A checked-in participant is below room.min_age (at check-in), or sign-waiver attempted for under-age participant" }
  - { id: ERR_WAIVER_NOT_SIGNED, http: 409, condition: "Room requires waivers but a checked-in participant has waiver_status != SIGNED at check-in" }
  - { id: ERR_GROUP_SIZE_INVALID, http: 409, condition: "group_size outside [min_group_size, max_group_size] at create, or checked-in count below min_group_size at check-in" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Target slot's occupied interval overlaps another HELD/BOOKED slot of the same room (buffer included)" }
  - { id: ERR_NO_GAMEMASTER_AVAILABLE, http: 409, condition: "No AVAILABLE game master free for the target game window (staff overlap, buffer excluded)" }
  - { id: ERR_NO_SHOW_LIMIT_REACHED, http: 409, condition: "Owning customer's no_show_strike_count >= venue.no_show_strike_limit at confirm" }
  - { id: ERR_GIFT_CARD_UNUSABLE, http: 409, condition: "Gift card not ACTIVE, wrong venue, zero balance, or voided when applied" }
  - { id: ERR_OUTSIDE_OPERATING_HOURS, http: 409, condition: "Time slot game window falls outside venue open/close minute-of-day window" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Customer email or gift-card code already exists (case-insensitive)" }
  - { id: ERR_ROOM_RETIRED, http: 409, condition: "Attempt to create a slot or grab a booking on a RETIRED room" }
  - { id: ERR_VALIDATION_PAGINATION, http: 422, condition: "limit/offset out of allowed range (limit 1..100, offset >= 0)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator that provisions venues and registers customers; cross-venue read access"
    identity: opaque
    exclusive_operations:
      - "POST /venues — create venue"
    shared_operations:
      - "POST /customers — register customer (also Customer)"
      - "GET reads across venues, rooms, slots, bookings, gift cards, game masters"

  - name: VenueManager
    description: "Manages a venue's rooms, pricing rules, game masters, time-slot inventory, and gift cards"
    identity: opaque
    exclusive_operations:
      - "POST /venues/{id}/rooms — create room"
      - "POST /venues/{id}/rooms/{id}/retire — retire room"
      - "POST /venues/{id}/pricing-rules — create pricing rule"
      - "POST /venues/{id}/game-masters — create game master"
      - "POST /venues/{id}/game-masters/{id}/set-status — set gm status"
      - "POST /venues/{id}/rooms/{id}/time-slots — create slot"
      - "POST .../time-slots/{id}/block | /unblock | /close — slot lifecycle"
      - "POST /venues/{id}/gift-cards — issue gift card"
      - "POST /venues/{id}/gift-cards/{id}/top-up | /void — gift card lifecycle"
    shared_operations:
      - "GET reads within the venue"

  - name: GameMaster
    description: "Runs the experience: marks participants present, checks in, completes, marks no-show"
    identity: entity_backed:GameMaster
    exclusive_operations:
      - "POST .../participants/{id}/mark-present — mark participant present"
      - "POST /venues/{id}/bookings/{id}/check-in — check in group"
      - "POST /venues/{id}/bookings/{id}/complete — complete game"
      - "POST /venues/{id}/bookings/{id}/no-show — mark no-show"
    shared_operations:
      - "GET reads within the venue"

  - name: Customer
    description: "Books, manages own bookings/participants/waivers, confirms, reschedules, cancels"
    identity: entity_backed:Customer
    exclusive_operations:
      - "POST /venues/{id}/bookings — create booking (grab slot)"
      - "POST /venues/{id}/bookings/{id}/confirm | /reschedule | /cancel — booking lifecycle"
      - "POST .../participants — add participant"
      - "POST .../participants/{id}/sign-waiver | /revoke-waiver — waiver"
    shared_operations:
      - "POST /customers — register customer (also PlatformAdmin)"
      - "GET reads on own bookings/participants and on public venue/room/slot/pricing/gift-card data"
