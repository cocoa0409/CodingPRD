    distinguishing_aspect: 'Mode (c): the reconcile order is pinned as tier-then-multiplier-then-

      deduction-split, and the late_accrual_recut variant re-buckets by

      observed_date instead of recorded_at, so the review step that routes the

      figure through the agreement''s RE_NEGOTIATION state changes the

      provisional figure without any new observation.

      '
