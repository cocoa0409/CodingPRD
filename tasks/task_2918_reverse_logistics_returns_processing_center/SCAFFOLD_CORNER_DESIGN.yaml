              payload: {}
              as: DispositionSupervisor
              as_user_id: "u_super2"
              captures: { do_status: $.data.status, net: $.data.net_recovery_cents }
          assert:
            - "HTTP 200 with do_status == EXECUTED and net == 5904 (gross 7200, effective_fee_pct 0.18, channel_fee_cents 1296, refurb_cost_cents 0)"
            - "GET /shrink-ledger-entries?client_id=${c_id} returns total_count == 1 with entry_type == RECOVERY_CREDIT, amount_cents == 5461 (5904 - round_half_up(5904 * 0.075) == 5904 - 443) and sequence_no == 1"
            - "GET /clients/${c_id} shows settlement_balance_cents == 5461 and shrink_ledger_cents == 0 — the exact discriminator, because shrink_ledger_cents sums only RECEIPT_VARIANCE, REFURB_COST, DONATION_WRITE_OFF and DESTRUCTION_WRITE_OFF"
            - "GET /clients/${c_id} shows projected_settlement_balance_cents == -12539, because the cascade left the line in RELEASE_PENDING with a RefundRelease of net_refund_cents 18000 (gross 20000, restocking_fee_pct 0.10, fee 2000) which the projection subtracts: 5461 - 18000"
            - "GET /shrink-ledger-entries?client_id=${c_id}&entry_type=RECOVERY_CREDIT returns the same single row, and entry_type=DESTRUCTION_WRITE_OFF returns total_count == 0"
