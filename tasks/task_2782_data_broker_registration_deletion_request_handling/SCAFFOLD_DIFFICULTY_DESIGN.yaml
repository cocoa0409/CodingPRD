  - rule_id: cross_entity_state_dependency
    instances:
      - name: execute_gated_on_an_accepted_registration_for_the_consumers_own_state
        grounds:
          - validations.priority_40.ERR_NO_ACCEPTED_REGISTRATION
          - state_machines.DeletionRequest.VERIFIED_to_EXECUTING
          - calculations.registry_standing_derivation
          - entities.Consumer.fields.state_code
          - entities.Registration.fields.state_code
        distinguishing_aspect: |
          The DeletionRequest is fully VERIFIED and internally ready, yet execution depends on
          the state of a third entity the request does not reference: a Registration of the same
          broker whose state_code equals the Consumer's state_code and whose half-open coverage
          period contains the clock. The broker holds an ACCEPTED CA filing, but the consumer is
          in NV, so execute is refused until the NV filing is accepted; the identical call then
          succeeds and the broker's standing flips DELINQUENT -> COMPLIANT.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One DataBroker operating in CA and NV with 500000 cents of credit."
            - "Its CA Registration covering [2026-09-01, 2027-03-01) is ACCEPTED (provisional 47000, final 23307), so fee_paid_cents is 23307 and fee_credit_cents is 476693; because NV has no ACCEPTED filing the broker's registry_standing is DELINQUENT."
            - "One Consumer of that broker with state_code NV, derived_profile_count 0 and no sensitive categories."
            - "That consumer's DeletionRequest passed a GOVT_ID attempt scoring 93.50 and is in VERIFIED, decided by reviewer-alpha."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brokers"
