              as: SystemAdmin
              captures: { scr_id: $.data.id }
            - call: "GET /manuscripts/${m_id}/ethics-cases"
              as: SystemAdmin
              captures: { ec_id: "$.data[0].id" }
          assert:
            - "HTTP 201 on the screening"
            - "IntegrityScreening.${scr_id}.verdict == BLOCK"
            - "Manuscript.${m_id}.integrity_status == BLOCK"
            - "Manuscript.${m_id}.status == SUBMITTED"
            - "GET /manuscripts/${m_id}/ethics-cases returns exactly 1 row"
            - "EthicsCase.${ec_id}.case_type == IMAGE_INTEGRITY"
            - "EthicsCase.${ec_id}.severity == HIGH"
            - "EthicsCase.${ec_id}.state == OPEN"
            - "EthicsCase.${ec_id}.opened_by == SCREENING_CASCADE"

      - name: integrity_rollup_ignores_prior_revision_round_screenings
        claim_type: input_set_filtering
        grounds:
          - calculations.integrity_verdict_rollup
          - entities.IntegrityScreening.fields.round
          - state_machines.Manuscript.REVISION_SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          The manuscript-level integrity_status is the roll-up of screenings for the current
          revision_round only: a round-0 FLAG at 25.0 is excluded once the manuscript reaches
          revision_round 1, where a single PASS screening at 5.0 leaves integrity_status PASS
          rather than the worse historical FLAG.
