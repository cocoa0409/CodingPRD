        grounds:
          - state_machines.FaultRecord.CLOSED_VERIFIED_to_REOPENED
          - state_machines.FaultRecord.REOPENED_to_PINPOINTED
        distinguishing_aspect: |
          FaultRecord is cyclic: after the full repair loop reaches CLOSED_VERIFIED, a
          reopen returns it to REOPENED (unresolved back to 1, resolved 24m back to 0,
          closed_at cleared) and a second pinpoint with a shorter trace (10.0 us) moves it
          REOPENED -> PINPOINTED with a recomputed corridor [702.0, 858.0].
        test_recipe:
          setup:
            - "Full repair cycle complete on circuit C (KV_15, length 1000, budget 800000): fault CLOSED_VERIFIED via accepted splice and passing retest; unresolved_fault_count == 0, resolved_fault_count_24m == 1."
