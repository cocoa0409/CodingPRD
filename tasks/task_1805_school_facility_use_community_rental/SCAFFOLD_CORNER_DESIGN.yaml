# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1805: School Facility Use & Community Rental
# Breadth probe: testable claims of SCAFFOLD.yaml §1.1–§1.7 not already covered
# by §1.8. Sections and claim_types follow references/claim-extraction-guide.md.
#
# Shared fixture shorthand (built inline per instance):
#   NP-STD policy: NONPROFIT x STANDARD hourly 5000, custodial 4000, bp 2000, floor 10000
#   Approved-permit chain = create org -> insurance -> request -> submit ->
#     begin_review (captures req_vr) -> approve { expected_request_version: ${req_vr} }
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_site_returns_201_with_defaults
        claim_type: creation
        grounds: [entities.SchoolSite]
        distinguishing_aspect: "POST /district/sites with required fields -> 201; site_status defaults to ACTIVE, version == 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "GET /district/sites/${site_id}"
              payload: {}
              as: DistrictAdmin
          assert:
            - "SchoolSite.site_status == ACTIVE (default applied)"
            - "SchoolSite.rental_timezone == 'America/Los_Angeles' (default applied when omitted)"
            - "SchoolSite.version == 1 and id is a type-prefix-free UUID"

      - name: facility_defaults_and_unique_code_within_site
        claim_type: defaults
        grounds: [entities.Facility.fields.setup_buffer_minutes, entities.Facility.fields.facility_code]
        distinguishing_aspect: "Omitted buffers default to 30/30 and requires_custodian true; duplicate facility_code within the same site -> ERR_DUPLICATE; same code on a DIFFERENT site is allowed."
        test_recipe:
          setup: ["Site A exists"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RSA", display_name: "Site A" }
              as: DistrictAdmin
              captures: { site_a: $.data.id }
            - call: "POST /district/sites"
              payload: { site_code: "RSB", display_name: "Site B" }
              as: DistrictAdmin
              captures: { site_b: $.data.id }
          trigger:
            - call: "POST /district/sites/${site_a}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 300 }
              as: DistrictAdmin
              captures: { fac_a: $.data.id }
            - call: "POST /district/sites/${site_a}/facilities"
              payload: { facility_code: "GYM", facility_tier: "PREMIUM", capacity: 100 }
              as: DistrictAdmin
              captures: { dup_err: $.data.error_id }
            - call: "POST /district/sites/${site_b}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 100 }
              as: DistrictAdmin
              captures: { fac_b: $.data.id }
          assert:
            - "First create: setup_buffer_minutes == 30, teardown_buffer_minutes == 30, requires_custodian == true, facility_status == AVAILABLE"
            - "Duplicate facility_code within site A: dup_err == ERR_DUPLICATE (409)"
            - "Same facility_code on site B succeeds (uniqueness scope is site-local)"

      - name: computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.RenterOrganization.fields.outstanding_balance_cents, entities.RenterOrganization.fields.credit_balance_cents]
        distinguishing_aspect: "Client-supplied values for computed fields (outstanding_balance_cents, credit_balance_cents, forfeiture_count, org_standing) on renter create are ignored; server initializes to 0/GOOD_STANDING."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/renters"
              payload: { org_name: "Sneaky Org", rate_class: "FOR_PROFIT", outstanding_balance_cents: 0, credit_balance_cents: 999999, forfeiture_count: 0, org_standing: "GOOD_STANDING" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
          assert:
            - "RenterOrganization.credit_balance_cents == 0 (client 999999 ignored)"
            - "RenterOrganization.outstanding_balance_cents == 0"
            - "RenterOrganization.org_standing == GOOD_STANDING"

      - name: system_fields_server_minted
        claim_type: system_fields
        grounds: [entities.SchoolSite]
        distinguishing_aspect: "Client-supplied id/created_at/updated_at/version on create are ignored; server mints id (UUID, no prefix), stamps created_at in ISO8601 UTC with milliseconds, sets version 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/sites"
              payload: { site_code: "SYS1", display_name: "System Field Test", id: "00000000-0000-0000-0000-000000000000", created_at: "1999-01-01T00:00:00Z", version: 42 }
              as: DistrictAdmin
              captures: { sid: $.data.id, sver: $.data.version, screated: $.data.created_at }
          assert:
            - "Response id != '00000000-0000-0000-0000-000000000000' (server-minted)"
            - "version == 1 (client 42 ignored)"
            - "created_at is the logical clock time (default 2026-08-01T00:00:00.000Z), not 1999"

      - name: get_nonexistent_resources_return_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns 404 ERR_NOT_FOUND for site, facility, request, permit, invoice, work order, damage assessment, seasonal permit."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /district/permits/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: FacilitiesDirector
              captures: { e1: $.data.error_id }
            - call: "GET /district/sites/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: DistrictAdmin
              captures: { e2: $.data.error_id }
          assert:
            - "e1 == ERR_NOT_FOUND with http 404"
            - "e2 == ERR_NOT_FOUND with http 404"

      - name: renter_org_name_case_insensitive_uniqueness
        claim_type: type_constraints
        grounds: [entities.RenterOrganization.fields.org_name, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "org_name uniqueness is case-insensitive: 'Riverview PTA' then 'riverview pta' -> ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /district/renters"
              payload: { org_name: "Riverview PTA", rate_class: "NONPROFIT", nonprofit_registration_no: "12-3456789" }
              as: FacilitiesDirector
          trigger:
            - call: "POST /district/renters"
              payload: { org_name: "riverview pta", rate_class: "NONPROFIT", nonprofit_registration_no: "99-9999999" }
              as: FacilitiesDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE (409)"

      - name: nonprofit_requires_registration_number
        claim_type: required_fields
        grounds: [entities.RenterOrganization.fields.nonprofit_registration_no, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Creating a NONPROFIT renter without nonprofit_registration_no -> ERR_INVALID_REQUEST (400); FOR_PROFIT without it succeeds."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/renters"
              payload: { org_name: "NoReg Nonprofit", rate_class: "NONPROFIT" }
              as: FacilitiesDirector
              captures: { err1: $.data.error_id }
            - call: "POST /district/renters"
              payload: { org_name: "Plain Profit", rate_class: "FOR_PROFIT" }
              as: FacilitiesDirector
              captures: { fp_id: $.data.id }
          assert:
            - "err1 == ERR_INVALID_REQUEST (400)"
            - "FOR_PROFIT create succeeds with nonprofit_registration_no absent"

      - name: enum_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.RenterOrganization.fields.rate_class, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "rate_class 'CHARITY' (not in INTERNAL|NONPROFIT|FOR_PROFIT) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/renters"
              payload: { org_name: "Bad Enum Org", rate_class: "CHARITY" }
              as: FacilitiesDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (400)"

      - name: buffer_must_be_15_minute_multiple
        claim_type: type_constraints
        grounds: [entities.Facility.fields.setup_buffer_minutes, "errors[ERR_INVALID_TIME_WINDOW]"]
        distinguishing_aspect: "setup_buffer_minutes 20 (not a multiple of 15) -> ERR_INVALID_TIME_WINDOW (422); negative -> same."
        test_recipe:
          setup: ["Site exists"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 100, setup_buffer_minutes: 20 }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_TIME_WINDOW (422)"

      - name: facility_requires_existing_site_parent
        claim_type: parent_relationships
        grounds: [entities.Facility.parent, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /district/sites/{unknown-id}/facilities -> ERR_NOT_FOUND (404) — nested path validates parent existence first."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/sites/11111111-2222-3333-4444-555555555555/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 100 }
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND (404)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: request_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.RentalRequest]
        distinguishing_aspect: "Newly created RentalRequest has request_status == DRAFT and revision_round == 0, submitted_at == null."
        test_recipe:
          setup: ["Site+facility+policy+renter exist"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 300 }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/rate_policies"
              payload: { policy_code: "NP-STD", rate_class: "NONPROFIT", facility_tier: "STANDARD", hourly_rate_cents: 5000, deposit_basis_points: 2000, custodial_hourly_cents: 4000, effective_from: "2026-01-01T00:00:00Z", deposit_floor_cents: 10000 }
              as: DistrictAdmin
            - call: "POST /district/renters"
              payload: { org_name: "Riverview PTA", rate_class: "NONPROFIT", nonprofit_registration_no: "12-3456789" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Draft Event", headcount_estimate: 50, starts_at: "2026-12-01T01:00:00Z", ends_at: "2026-12-01T03:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id, st: $.data.request_status }
          assert:
            - "request_status == DRAFT; revision_round == 0; submitted_at == null"

      - name: approve_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.RentalRequest, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "approve on a DRAFT request (never submitted) -> ERR_INVALID_STATE_TRANSITION (409)."
        test_recipe:
          setup: ["Site+facility+policy+renter+insurance; request in DRAFT"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 300 }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/rate_policies"
              payload: { policy_code: "NP-STD", rate_class: "NONPROFIT", facility_tier: "STANDARD", hourly_rate_cents: 5000, deposit_basis_points: 2000, custodial_hourly_cents: 4000, effective_from: "2026-01-01T00:00:00Z", deposit_floor_cents: 10000 }
              as: DistrictAdmin
            - call: "POST /district/renters"
              payload: { org_name: "Riverview PTA", rate_class: "NONPROFIT", nonprofit_registration_no: "12-3456789" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Draft Event", headcount_estimate: 50, starts_at: "2026-12-01T01:00:00Z", ends_at: "2026-12-01T03:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
          trigger:
            - call: "POST /district/requests/${req_id}/approve"
              payload: { expected_request_version: "${req_v}" }
              as: FacilitiesDirector
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (409); no Permit created"

      - name: cancel_completed_permit_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Permit.lifecycle_status, "errors[ERR_PERMIT_NOT_CANCELLABLE]"]
        distinguishing_aspect: "POST /district/permits/{id}/cancel on a COMPLETED permit -> ERR_PERMIT_NOT_CANCELLABLE (409); post-event disputes route through damage assessment."
        test_recipe:
          setup: ["Full approved+secured permit; clock past event; permit COMPLETED"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 300 }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/rate_policies"
              payload: { policy_code: "NP-STD", rate_class: "NONPROFIT", facility_tier: "STANDARD", hourly_rate_cents: 5000, deposit_basis_points: 2000, custodial_hourly_cents: 4000, effective_from: "2026-01-01T00:00:00Z", deposit_floor_cents: 10000 }
              as: DistrictAdmin
            - call: "POST /district/renters"
              payload: { org_name: "Riverview PTA", rate_class: "NONPROFIT", nonprofit_registration_no: "12-3456789" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
            - call: "POST /district/renters/${org_id}/insurance_certificates"
              payload: { insurer_name: "Aegis Mutual", per_occurrence_limit_cents: 200000000, aggregate_limit_cents: 400000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Auction", headcount_estimate: 100, starts_at: "2026-09-13T00:00:00Z", ends_at: "2026-09-13T03:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
              captures: { req_vr: $.data.version }
            - call: "POST /district/requests/${req_id}/approve"
              payload: { expected_request_version: "${req_vr}" }
              as: FacilitiesDirector
              captures: { permit_id: $.data.id }
            - call: "POST /district/permits/${permit_id}/payments"
              payload: { txn_kind: "DEPOSIT_CAPTURE", amount_cents: 10000, idempotency_key: "dep-cc-1" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-13T12:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/permits/${permit_id}/complete"
              payload: {}
              as: SiteCoordinator
          trigger:
            - call: "POST /district/permits/${permit_id}/cancel"
              payload: { cancellation_reason: "too late" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PERMIT_NOT_CANCELLABLE (409); permit remains COMPLETED"

      - name: terminal_denied_request_rejects_all_mutations
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RentalRequest, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "DENIED is terminal: submit, begin_review, approve, request_revision, withdraw on a DENIED request all fail with ERR_INVALID_STATE_TRANSITION (409)."
        test_recipe:
          setup: ["Request progressed to UNDER_REVIEW then DENIED"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 300 }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/rate_policies"
              payload: { policy_code: "NP-STD", rate_class: "NONPROFIT", facility_tier: "STANDARD", hourly_rate_cents: 5000, deposit_basis_points: 2000, custodial_hourly_cents: 4000, effective_from: "2026-01-01T00:00:00Z", deposit_floor_cents: 10000 }
              as: DistrictAdmin
            - call: "POST /district/renters"
              payload: { org_name: "Riverview PTA", rate_class: "NONPROFIT", nonprofit_registration_no: "12-3456789" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Doomed Event", headcount_estimate: 50, starts_at: "2026-12-01T01:00:00Z", ends_at: "2026-12-01T03:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
            - call: "POST /district/requests/${req_id}/deny"
              payload: { denial_reason_code: "DISCRETIONARY" }
              as: FacilitiesDirector
          trigger:
            - call: "POST /district/renters/${org_id}/requests/${req_id}/withdraw"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION (409) — DENIED terminal lockdown"

      - name: revision_limit_exceeded_on_fourth_cycle
        claim_type: precondition_enforcement
        grounds: [state_machines.RentalRequest, "errors[ERR_REVISION_LIMIT_EXCEEDED]", entities.RentalRequest.fields.revision_round]
        distinguishing_aspect: "After 3 full revision cycles (revision_round == 3), a 4th request_revision -> ERR_REVISION_LIMIT_EXCEEDED (409)."
        test_recipe:
          setup: ["Request cycled 3 times: UNDER_REVIEW with revision_round == 3"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 300 }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/rate_policies"
              payload: { policy_code: "NP-STD", rate_class: "NONPROFIT", facility_tier: "STANDARD", hourly_rate_cents: 5000, deposit_basis_points: 2000, custodial_hourly_cents: 4000, effective_from: "2026-01-01T00:00:00Z", deposit_floor_cents: 10000 }
              as: DistrictAdmin
            - call: "POST /district/renters"
              payload: { org_name: "Riverview PTA", rate_class: "NONPROFIT", nonprofit_registration_no: "12-3456789" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Looping Event", headcount_estimate: 50, starts_at: "2026-12-01T01:00:00Z", ends_at: "2026-12-01T03:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
            - call: "POST /district/requests/${req_id}/request_revision"
              payload: { revision_note: "round 1" }
              as: SiteCoordinator
            - call: "POST /district/renters/${org_id}/requests/${req_id}/resubmit"
              payload: { headcount_estimate: 49 }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
            - call: "POST /district/requests/${req_id}/request_revision"
              payload: { revision_note: "round 2" }
              as: SiteCoordinator
            - call: "POST /district/renters/${org_id}/requests/${req_id}/resubmit"
              payload: { headcount_estimate: 48 }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
            - call: "POST /district/requests/${req_id}/request_revision"
              payload: { revision_note: "round 3" }
              as: SiteCoordinator
            - call: "POST /district/renters/${org_id}/requests/${req_id}/resubmit"
              payload: { headcount_estimate: 47 }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
          trigger:
            - call: "POST /district/requests/${req_id}/request_revision"
              payload: { revision_note: "round 4 attempt" }
              as: SiteCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REVISION_LIMIT_EXCEEDED (409); request remains UNDER_REVIEW with revision_round == 3"

      - name: idempotent_double_submit_rejected
        claim_type: idempotency
        grounds: [state_machines.RentalRequest.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED request again -> ERR_INVALID_STATE_TRANSITION (409); submitted_at unchanged from first submit."
        test_recipe:
          setup: ["Request SUBMITTED at clock 2026-08-10T00:00:00Z"]
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High" }
