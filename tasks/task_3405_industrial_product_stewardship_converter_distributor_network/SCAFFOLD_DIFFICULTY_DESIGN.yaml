              as: Converter
              as_user_id: "${conv_id}"
              captures: { oc_id: $.data.id }
            - call: "POST /stewardship/orders/${oc_id}/advance"
              payload: {}
              as: Converter
              as_user_id: "${conv_id}"
            - *c_dist1
            - call: "POST /stewardship/counterfeit-reports"
              payload: { formulation_id: "${f_id}", lot_code: "L-9", channel_description: "auction-site die-cut reels", implicated_converter_id: "${conv_id}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { rep3_id: $.data.id }
          trigger:
            - call: "POST /stewardship/counterfeit-reports/${rep3_id}/disposition"
              payload: { outcome: "CONFIRMED_COUNTERFEIT" }
              as: QualityAuditor
              as_user_id: "qa-9"
            - call: "GET /stewardship/price-agreements/${agc2_id}"
              payload: {}
              as: ChannelManager
              as_user_id: "cm-1"
              captures: { agc2_v2: $.data.version }
            - call: "POST /stewardship/orders"
