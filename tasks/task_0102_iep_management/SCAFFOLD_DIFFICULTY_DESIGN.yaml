# =============================================================================
# task_0102_iep_management — Scaffold Difficulty Design (Test Targeting Index)
#
# Companion to SCAFFOLD.yaml. Every instance below grounds in elements already
# declared in SCAFFOLD.yaml §1.1–§1.6. Deleting this file leaves the scaffold's
# declared behavior unchanged — this file only drives unit-test coverage.
#
# Rule definitions, minimum-instance counts, and differentiation clauses are
# authoritative in the scaffold-generator skill at §0.5; this file does not
# restate them. All rule_id values match §0.5 verbatim.
# =============================================================================

scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1: Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: lre_percentage_dual_basis_on_iep
        grounds:
          - calculations.lre_percentage
          - entities.IEP.fields.lre_percentage_instructional
          - entities.IEP.fields.lre_percentage_school_day
          - entities.IEP.fields.total_instructional_minutes_per_week
          - entities.IEP.fields.total_school_day_minutes_per_week
          - endpoints.GET_/districts/{districtId}/students/{studentId}/ieps/{iepId}/lre-summary
        distinguishing_aspect: |
          Operates on IEP entity domain. Identical pull-out minutes feed two
          denominators (instructional 1500 vs school-day 1875), producing two
          different lre_percentages from the same data; only the
          instructional_basis is canonical for lre_classification.
        test_recipe:
          setup:
            - "POST /districts → district1 (current_date=2025-01-01)"
            - "POST /districts/{district1}/students → student1 with date_of_birth=2014-01-01, parent_user_id=parentA"
            - "POST .../eligibility-evaluations + request-consent + Parent approve + finalize ELIGIBLE for student1 (categories=['SLD'])"
            - "POST .../parental-consents (scope=IEP_IMPLEMENTATION) and Parent approve"
            - "POST .../ieps with total_instructional_minutes_per_week=1500, total_school_day_minutes_per_week=1875, meeting_held_at=2025-01-15"
            - "POST .../ieps/{iep1}/goals (one goal, one objective weight=1.00, progress=0)"
            - "POST .../ieps/{iep1}/related-services with service_type=OT, minutes_per_week=300, location_setting=PULL_OUT"
            - "POST .../parental-consents (scope=RELATED_SERVICE, target=service1) and Parent approve"
            - "PUT .../related-services/{service1}/activate with consent_id"
            - "POST .../ieps/{iep1}/activate"
          trigger:
            - "GET /districts/{district1}/students/{student1}/ieps/{iep1}/lre-summary"
          assert:
            - "response.data.lre_percentage_instructional == 20.00"
            - "response.data.lre_percentage_school_day == 16.00"
            - "response.data.lre_classification == 'LRE_A'"
            - "lre_percentage_instructional != lre_percentage_school_day (20.00 != 16.00) — same numerator, different denominator"

      - name: goal_mastery_weighted_vs_simple_on_iepgoal
        grounds:
          - calculations.goal_mastery_tier
          - entities.IEPGoal.fields.objectives
          - entities.IEPGoal.fields.mastery_score
          - entities.IEPGoal.fields.mastery_tier
          - endpoints.POST_/districts/{districtId}/students/{studentId}/ieps/{iepId}/goals/{goalId}/progress-reports
        distinguishing_aspect: |
          Operates on IEPGoal entity domain (different from lre_percentage which
          is on IEP). Weighted score with skewed weights vs. naive equal-weight
          average produces DIFFERENT mastery_tier on identical inputs:
          weighted=81.00 (MASTERED) vs simple-average=30.00 (INSUFFICIENT_PROGRESS).
        test_recipe:
          setup:
            - "District + Student + ELIGIBLE evaluation + ACTIVE IEP per shared bootstrap"
            - "POST .../ieps/{iep1}/goals with objectives=[{id:o1,weight:0.9,latest_progress_percent:0},{id:o2,weight:0.05,latest_progress_percent:0},{id:o3,weight:0.05,latest_progress_percent:0}]"
            - "IEP activate → goal becomes ACTIVE"
          trigger:
            - "POST .../goals/{goal1}/progress-reports with reporting_period_index=1, objective_progress=[{id:o1,progress:90},{id:o2,progress:0},{id:o3,progress:0}]"
          assert:
            - "goal.mastery_score == 81.00  # 0.9*90 + 0.05*0 + 0.05*0 = 81.00"
            - "goal.mastery_tier == 'MASTERED'"
            - "Naive simple-average would be (90+0+0)/3 = 30.00 → INSUFFICIENT_PROGRESS — implementation MUST use weighted formula (different tier proves divergence)"

  # -------------------------------------------------------------------------
  # Rule 2: Combinatorial formulas across different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: goal_mastery_weighted_tier_branching_mode_a
        grounds:
          - calculations.goal_mastery_tier
          - entities.IEPGoal.fields.objectives
          - entities.IEPGoal.fields.mastery_tier
        distinguishing_aspect: |
          Mode (a): formula with ≥3 inputs (3 objective weights × 3 progress
          values = 6 numeric inputs) and non-linear conditional tier branching
          on the resulting score. Boundaries pinned at >=80 MASTERED, >=50
          PROGRESSING, else INSUFFICIENT_PROGRESS.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE IEP"
            - "POST .../goals with objectives=[{id:o1,weight:0.4,latest_progress_percent:0},{id:o2,weight:0.4,latest_progress_percent:0},{id:o3,weight:0.2,latest_progress_percent:0}]"
          trigger:
            - "POST .../goals/{goal1}/progress-reports with objective_progress=[{id:o1,progress:60},{id:o2,progress:50},{id:o3,progress:30}]"
          assert:
            - "goal.mastery_score == 50.00  # 0.4*60 + 0.4*50 + 0.2*30 = 24 + 20 + 6 = 50.00"
            - "goal.mastery_tier == 'PROGRESSING'  # boundary at >=50.00 is PROGRESSING, not INSUFFICIENT_PROGRESS"

      - name: compensatory_minutes_round_per_session_then_sum_mode_b
        grounds:
          - calculations.compensatory_service_hours
          - entities.RelatedService.fields.compensatory_minutes_owed
          - entities.ServiceSession.fields.scheduled_minutes
          - state_machines.RelatedService.ACTIVE_to_SUSPENDED
          - endpoints.PUT_/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/suspend
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. PINNED order is
          round-per-session-then-sum. With three 25-minute sessions:
          per-session 25*1.5=37.5 → round_half_up=38, sum=114. Naive
          sum-then-round = 37.5*3=112.5 → 113. Two valid orders yield
          different totals; scaffold pins 114.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE RelatedService (OT, 75 min/week)"
            - "Schedule three ServiceSession rows each 25 scheduled_minutes, all scheduled_start <= current_date and still SCHEDULED (no deliver, no cancel)"
          trigger:
            - "PUT .../related-services/{service1}/suspend"
          assert:
            - "service.status == 'SUSPENDED'"
            - "service.compensatory_minutes_owed == 114  # 38+38+38 (round-then-sum); NOT 113 (sum-then-round)"

  # -------------------------------------------------------------------------
  # Rule 3: Non-linear state-machine shape on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: parental_consent_revocation_cycle_with_reissue
        grounds:
          - state_machines.ParentalConsent.PENDING_to_APPROVED
          - state_machines.ParentalConsent.APPROVED_to_WITHDRAWN
          - endpoints.POST_/districts/{districtId}/students/{studentId}/parental-consents/{consentId}/approve
          - endpoints.POST_/districts/{districtId}/students/{studentId}/parental-consents/{consentId}/withdraw
          - endpoints.POST_/districts/{districtId}/students/{studentId}/parental-consents
        distinguishing_aspect: |
          ParentalConsent forms a cycle via revocation+reissue:
          PENDING→APPROVED→WITHDRAWN, then a NEW ParentalConsent row is
          created (PENDING)→APPROVED→… reaching APPROVED a second time on the
          same target_resource_id. The same target_resource_id therefore
          passes through APPROVED at least twice — non-linear.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE RelatedService gated by consent1 (APPROVED)"
          trigger:
            - "POST .../parental-consents/{consent1}/withdraw → service auto-SUSPENDED"
            - "POST .../parental-consents (scope=RELATED_SERVICE, target=service1) → consent2 (PENDING)"
            - "POST .../parental-consents/{consent2}/approve"
            - "PUT .../related-services/{service1}/resume with consent_id=consent2"
          assert:
            - "consent1.status == 'WITHDRAWN'"
            - "consent2.status == 'APPROVED'"
            - "service1.status == 'ACTIVE' AND service1.consent_id == consent2.id"
            - "Cycle observable: same RelatedService traversed ACTIVE→SUSPENDED→ACTIVE via two distinct ParentalConsent rows for the same target"

      - name: iep_amendment_cycle_on_iep_entity
        grounds:
          - state_machines.IEP.ACTIVE_to_AMENDMENT_PENDING
          - state_machines.IEP.AMENDMENT_PENDING_to_ACTIVE
          - endpoints.POST_/districts/{districtId}/students/{studentId}/ieps/{iepId}/begin-amendment
          - endpoints.POST_/districts/{districtId}/students/{studentId}/ieps/{iepId}/finalize-amendment
        distinguishing_aspect: |
          IEP (different entity from ParentalConsent) admits a cycle
          ACTIVE→AMENDMENT_PENDING→ACTIVE. The same IEP id reaches the ACTIVE
          state at least twice over its lifetime via the amendment loop.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE IEP (iep1)"
          trigger:
            - "POST .../ieps/{iep1}/begin-amendment"
            - "POST .../ieps/{iep1}/finalize-amendment"
            - "POST .../ieps/{iep1}/begin-amendment"
            - "POST .../ieps/{iep1}/finalize-amendment"
          assert:
            - "iep1.status == 'ACTIVE' at end"
            - "iep1.version >= 5  # original create + activate + 4 amendment-cycle transitions"
            - "iep1.status sequence over operations: ACTIVE → AMENDMENT_PENDING → ACTIVE → AMENDMENT_PENDING → ACTIVE (cycle traversed twice)"

  # -------------------------------------------------------------------------
  # Rule 4: Transitive cascade chains from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: consent_withdrawal_cascades_to_iep_amendment_depth_3
        grounds:
          - state_machines.ParentalConsent.APPROVED_to_WITHDRAWN
          - state_machines.ParentalConsent.APPROVED_to_WITHDRAWN.side_effects
          - state_machines.RelatedService.ACTIVE_to_SUSPENDED
          - calculations.compensatory_service_hours
          - entities.RelatedService.fields.compensatory_minutes_owed
          - entities.IEP.fields.status
        distinguishing_aspect: |
          Trigger: Parent withdraws ParentalConsent(scope=RELATED_SERVICE).
          Hop 1 — ParentalConsent.status: APPROVED→WITHDRAWN.
          Hop 2 — caused BY hop 1: RelatedService for that consent
                    auto-transitions ACTIVE→SUSPENDED.
          Hop 3 — caused BY hop 2: compensatory_service_hours calc fires,
                    sets RelatedService.compensatory_minutes_owed > 0, AND if
                    the sum across services on the parent IEP > 0, parent IEP
                    enters AMENDMENT_PENDING.
          Each hop is the consequence of the previous hop, not of the original
          action. Depth = 3.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE IEP with ACTIVE OT service (75 min/week) gated by consent1"
            - "Schedule 3 SCHEDULED ServiceSessions of 25 scheduled_minutes each in the past"
          trigger:
            - "POST .../parental-consents/{consent1}/withdraw"
          assert:
            - "consent1.status == 'WITHDRAWN' (hop 1)"
            - "service1.status == 'SUSPENDED' (hop 2, caused by hop 1)"
            - "service1.compensatory_minutes_owed == 114 (hop 3, caused by hop 2)"
            - "iep1.status == 'AMENDMENT_PENDING' (hop 3 also propagates to IEP because compensatory_minutes_owed > 0)"

      - name: ineligible_finalization_cascades_to_goals_and_services_depth_3
        grounds:
          - state_machines.EligibilityEvaluation.IN_PROGRESS_to_INELIGIBLE
          - state_machines.EligibilityEvaluation.IN_PROGRESS_to_INELIGIBLE.side_effects
          - state_machines.IEP.ACTIVE_to_REVOKED
          - state_machines.IEPGoal.ACTIVE_to_DISCONTINUED
          - state_machines.RelatedService.ACTIVE_to_SUSPENDED
          - entities.Student.fields.current_iep_id
          - entities.Student.fields.lre_classification
        distinguishing_aspect: |
          DIFFERENT trigger from the consent-withdrawal cascade above:
          SchoolPsychologist finalizes a TRIENNIAL evaluation as INELIGIBLE
          while the student has an ACTIVE IEP.
          Hop 1 — EligibilityEvaluation: IN_PROGRESS→INELIGIBLE.
          Hop 2 — caused BY hop 1: Student.current_iep_id resolves, that IEP
                    transitions ACTIVE→REVOKED.
          Hop 3 — caused BY hop 2: every ACTIVE IEPGoal under that IEP
                    transitions to DISCONTINUED, and every ACTIVE
                    RelatedService transitions to SUSPENDED, AND
                    Student.current_iep_id is cleared to null.
          Depth = 3; propagation pattern (evaluation → IEP lifecycle → child
          collections) is structurally different from the
          consent → service → IEP amendment chain.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE IEP with one ACTIVE goal (mastery_tier=PROGRESSING) and one ACTIVE OT service"
            - "Create a new TRIENNIAL EligibilityEvaluation, request-consent, Parent approves, evaluator psychologist (distinct from parent) takes evaluation to IN_PROGRESS"
          trigger:
            - "POST .../eligibility-evaluations/{eval2}/finalize with disability_categories=[]"
          assert:
            - "eval2.status == 'INELIGIBLE' (hop 1)"
            - "iep1.status == 'REVOKED' (hop 2, caused by hop 1)"
            - "goal1.status == 'DISCONTINUED' AND service1.status == 'SUSPENDED' (hop 3, caused by hop 2)"
            - "student1.current_iep_id == null AND student1.lre_classification == 'NOT_APPLICABLE' (hop 3 also)"

  # -------------------------------------------------------------------------
  # Rule 5: Validation priority conflicts across different error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_referential_on_goal_creation
        grounds:
          - validations[priority=5]            # state (ERR_IEP_NOT_DRAFT)
          - validations[priority=6]            # business_referential (ERR_CROSS_STUDENT_REFERENCE)
          - errors.ERR_IEP_NOT_DRAFT
          - errors.ERR_CROSS_STUDENT_REFERENCE
          - endpoints.POST_/districts/{districtId}/students/{studentId}/ieps/{iepId}/goals
        distinguishing_aspect: |
          Category pair = (state, business_referential). On POST goals where
          BOTH the IEP is in EXPIRED (not DRAFT/AMENDMENT_PENDING) AND the
          request body carries an objective referencing another student's id,
          the state check (priority 5) fires before the referential check
          (priority 6). Wins: ERR_IEP_NOT_DRAFT.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE IEP, then advance clock by 400 days so iep1 auto-EXPIRES"
            - "Create a second student2 in same district"
          trigger:
            - "POST /districts/{district1}/students/{student1}/ieps/{iep1}/goals with body containing objective referencing student2's external resource"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_IEP_NOT_DRAFT'  # state-category check wins over referential-category check"

      - name: business_safety_vs_business_fiscal_on_service_activation
        grounds:
          - validations[priority=8]            # business_safety (ERR_STUDENT_NOT_ELIGIBLE)
          - validations[priority=19]           # business_fiscal (ERR_SERVICE_MINUTES_EXCEED_INSTRUCTIONAL_TIME)
          - errors.ERR_STUDENT_NOT_ELIGIBLE
          - errors.ERR_SERVICE_MINUTES_EXCEED_INSTRUCTIONAL_TIME
          - endpoints.PUT_/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/activate
        distinguishing_aspect: |
          DIFFERENT category pair from the previous instance: (business_safety,
          business_fiscal). Activating a RelatedService when the student has
          NO ELIGIBLE evaluation AND the proposed minutes_per_week would push
          IEP.special_education_minutes_per_week above
          total_instructional_minutes_per_week. Safety wins (priority 8 <
          priority 19).
        test_recipe:
          setup:
            - "Create student with NO finalized EligibilityEvaluation"
            - "Create DRAFT IEP with total_instructional_minutes_per_week=1500"
            - "POST a PROPOSED OT service with minutes_per_week=2000 (exceeds 1500)"
            - "Create RELATED_SERVICE consent and Parent-approve"
          trigger:
            - "PUT .../related-services/{service1}/activate with consent_id"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_STUDENT_NOT_ELIGIBLE'  # safety-category check wins over fiscal-category check"

  # -------------------------------------------------------------------------
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: lre_classification_inclusive_60_pct_boundary
        grounds:
          - calculations.lre_percentage
          - calculations.lre_percentage.constants.LRE_B_UPPER_INCLUSIVE
          - entities.IEP.fields.lre_percentage_instructional
          - entities.Student.fields.lre_classification
          - endpoints.PUT_/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/activate
          - endpoints.GET_/districts/{districtId}/students/{studentId}/ieps/{iepId}/lre-summary
        distinguishing_aspect: |
          Numeric metric: lre_percentage_instructional crossing 60.00.
          Inclusive boundary: <= 60.00 → LRE_B; > 60.00 → LRE_C. Endpoint
          surface: PUT activate on RelatedService (mutates the metric)
          followed by GET lre-summary. At sped=900/1500=60.00 EXACTLY:
          classification = LRE_B. Adding 15 more minutes
          (sped=915/1500=61.00) crosses to LRE_C.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE IEP (1500 instructional minutes/week) with no services"
            - "Propose three OT/PT/SPEECH services with 300, 300, 300 minutes_per_week, all PULL_OUT, all consented"
            - "PUT activate first two services → sped=600 → lre_percentage_instructional=40.00 → LRE_B"
          trigger:
            - "PUT .../related-services/{service3}/activate  # brings sped to 900/1500 = 60.00 exactly"
            - "GET .../ieps/{iep1}/lre-summary"
          assert:
            - "response.data.lre_percentage_instructional == 60.00"
            - "response.data.lre_classification == 'LRE_B'  # inclusive at 60.00"
            - "After adding a 4th 15-minute service: lre_percentage_instructional == 61.00 → lre_classification == 'LRE_C' (> 60.00 strict)"

      - name: triennial_overdue_zero_day_boundary
        grounds:
          - calculations.triennial_status
          - calculations.triennial_status.constants.DUE_SOON_WINDOW_DAYS
          - entities.Student.fields.triennial_reevaluation_due_date
          - entities.Student.fields.triennial_status
          - entities.District.fields.current_date
          - endpoints.POST_/districts/{districtId}/clock/advance
          - endpoints.GET_/districts/{districtId}/students/{studentId}
        distinguishing_aspect: |
          DIFFERENT metric from lre_classification (this is a date-difference
          in calendar days, not a percentage). DIFFERENT endpoint surface
          (POST /clock/advance is the mutation; GET /students/{id} is the
          observation). Boundary: days_to_due == 0 → DUE_SOON;
          days_to_due == -1 → OVERDUE.
        test_recipe:
          setup:
            - "POST /districts (current_date=2025-01-01)"
            - "Create student + finalize ELIGIBLE evaluation on 2025-01-01 → triennial_reevaluation_due_date=2028-01-01"
            - "Advance clock by 90 days → days_to_due=985 → ON_TRACK (sanity)"
            - "Advance clock to 2027-10-03 (90 days before due) → days_to_due=90 → DUE_SOON"
          trigger:
            - "POST /districts/{district1}/clock/advance by_days=90  # current_date → 2028-01-01, days_to_due=0"
            - "GET /districts/{district1}/students/{student1}"
            - "POST /districts/{district1}/clock/advance by_days=1   # current_date → 2028-01-02, days_to_due=-1"
            - "GET /districts/{district1}/students/{student1}"
          assert:
            - "After advance to 2028-01-01: student.triennial_status == 'DUE_SOON'  # boundary inclusive at 0"
            - "After advance to 2028-01-02: student.triennial_status == 'OVERDUE'   # strict > 0 days past flips to OVERDUE"

  # -------------------------------------------------------------------------
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: iep_activation_requires_eligibility_eligible
        grounds:
          - state_machines.IEP.DRAFT_to_ACTIVE
          - state_machines.IEP.DRAFT_to_ACTIVE.preconditions
          - entities.Student.fields.current_eligibility_evaluation_id
          - entities.EligibilityEvaluation.fields.status
          - errors.ERR_STUDENT_NOT_ELIGIBLE
          - endpoints.POST_/districts/{districtId}/students/{studentId}/ieps/{iepId}/activate
        distinguishing_aspect: |
          Entity pair: IEP ↔ EligibilityEvaluation. IEP DRAFT→ACTIVE is
          rejected unless the Student's current_eligibility_evaluation_id
          resolves to an EligibilityEvaluation in ELIGIBLE state.
        test_recipe:
          setup:
            - "Create district + student"
            - "Create EligibilityEvaluation eval1; do NOT finalize (leave in IN_PROGRESS)"
            - "POST .../ieps with valid fields → iep1 in DRAFT"
            - "Create IEP_IMPLEMENTATION consent for iep1 → Parent approve"
            - "Add one PROPOSED goal"
          trigger:
            - "POST .../ieps/{iep1}/activate"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_STUDENT_NOT_ELIGIBLE'  # IEP transition blocked by EligibilityEvaluation state"
            - "After finalizing eval1 ELIGIBLE and re-attempting activate: response.status_code == 200 and iep1.status == 'ACTIVE'"

      - name: related_service_activation_requires_consent_approved
        grounds:
          - state_machines.RelatedService.PROPOSED_to_ACTIVE
          - state_machines.RelatedService.PROPOSED_to_ACTIVE.preconditions
          - entities.RelatedService.fields.consent_id
          - entities.ParentalConsent.fields.status
          - errors.ERR_SERVICE_CONSENT_NOT_APPROVED
          - endpoints.PUT_/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/activate
        distinguishing_aspect: |
          DIFFERENT entity pair from above (RelatedService ↔ ParentalConsent,
          not IEP ↔ EligibilityEvaluation). RelatedService PROPOSED→ACTIVE
          requires the referenced ParentalConsent to be in APPROVED.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE IEP"
            - "POST .../related-services with service_type=SPEECH, minutes_per_week=120 → service1 in PROPOSED"
            - "POST .../parental-consents (scope=RELATED_SERVICE, target=service1) → consent1 in PENDING (NOT approved)"
          trigger:
            - "PUT .../related-services/{service1}/activate with consent_id=consent1"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_SERVICE_CONSENT_NOT_APPROVED'"
            - "After Parent approves consent1 and retry: response.status_code == 200 and service1.status == 'ACTIVE'"

  # -------------------------------------------------------------------------
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: service_session_closed_interval_adjacency_overlap
        grounds:
          - validations[priority=14]
          - errors.ERR_SERVICE_SESSION_OVERLAP
          - entities.ServiceSession.fields.scheduled_start
          - entities.ServiceSession.fields.scheduled_end
          - concurrency_rules[scenario-keyword=ServiceSession]
          - endpoints.POST_/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/sessions
        distinguishing_aspect: |
          Interval semantics = CLOSED on both endpoints (adjacency counts as
          overlap). Two sessions on the SAME RelatedService where
          session_A.scheduled_end == session_B.scheduled_start are REJECTED
          (touching endpoints overlap). Resource entity: ServiceSession.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE RelatedService (OT)"
            - "POST first session with scheduled_start=2025-03-01T09:00Z, scheduled_end=2025-03-01T10:00Z → session1 SCHEDULED"
          trigger:
            - "POST second session with scheduled_start=2025-03-01T10:00Z, scheduled_end=2025-03-01T11:00Z  # touches session1 at 10:00 exactly"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_SERVICE_SESSION_OVERLAP'  # closed-interval adjacency rejected"

      - name: iep_period_half_open_interval_no_overlap_on_touch
        grounds:
          - validations[priority=15]
          - errors.ERR_IEP_PERIOD_OVERLAP
          - entities.IEP.fields.effective_start_date
          - entities.IEP.fields.scheduled_review_date
          - endpoints.POST_/districts/{districtId}/students/{studentId}/ieps/{iepId}/activate
        distinguishing_aspect: |
          DIFFERENT interval semantics: HALF-OPEN [start, end). Two IEPs on
          the SAME Student where iepA.scheduled_review_date ==
          iepB.effective_start_date are ACCEPTED (touching is NOT overlap
          under half-open). Resource entity: IEP (different from
          ServiceSession). The same numeric/temporal touching that REJECTS
          under closed semantics ACCEPTS under half-open semantics.
        test_recipe:
          setup:
            - "Bootstrap student1 ELIGIBLE"
            - "Activate iep1 with effective_start_date=2025-09-01, total_instructional_minutes_per_week=1500 (scheduled_review_date computed as 2026-09-01)"
            - "Wait by advancing clock to 2026-09-01 — iep1 auto-EXPIRES"
            - "Create iep2 (DRAFT) for same student with effective_start_date=2026-09-01 (exactly touches iep1.scheduled_review_date)"
            - "Bootstrap iep2 consent, goal, fresh eligibility re-finalization not needed (still ELIGIBLE)"
          trigger:
            - "POST .../ieps/{iep2}/activate"
          assert:
            - "response.status_code == 200"
            - "iep2.status == 'ACTIVE'  # half-open intervals: touching at 2026-09-01 is NOT overlap"
            - "By contrast: a DRAFT iep3 with effective_start_date=2026-08-31 (strictly inside iep1's period before expiry) would be rejected with ERR_IEP_PERIOD_OVERLAP — demonstrating the half-open semantics"

  # -------------------------------------------------------------------------
  # Rule 9: Compensating-action invariants across different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: session_schedule_cancel_preserves_utilization_percent
        grounds:
          - entities.RelatedService.fields.utilization_percent
          - entities.RelatedService.fields.total_delivered_minutes
          - entities.RelatedService.fields.total_prescribed_minutes_to_date
          - state_machines.ServiceSession.SCHEDULED_to_CANCELLED
          - endpoints.POST_/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/sessions
          - endpoints.POST_/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/sessions/{sessionId}/cancel
        distinguishing_aspect: |
          Conserved quantity type = utilization ratio (a percentage on
          RelatedService). Forward action: schedule a ServiceSession.
          Compensating action: cancel that same session before any deliver.
          Invariant pinned as explicit formula: pre-pair utilization_percent
          == post-pair utilization_percent, because total_delivered_minutes
          is unchanged and total_prescribed_minutes_to_date is unchanged
          (scheduling and cancelling do not move minutes between buckets in
          a way that affects the ratio).
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE OT service with 75 min/week"
            - "Advance clock 14 days (2 weeks) → total_prescribed_minutes_to_date == 150"
            - "Schedule + deliver one session of 60 actual_minutes → total_delivered_minutes=60, utilization_percent=40.00"
            - "Record pre_pair_utilization = service.utilization_percent  # = 40.00"
          trigger:
            - "POST a new session (scheduled_minutes=30, scheduled_start in past) → session2 SCHEDULED"
            - "POST .../sessions/{session2}/cancel → session2 CANCELLED"
          assert:
            - "service.utilization_percent == 40.00  # unchanged from pre_pair_utilization"
            - "service.total_delivered_minutes == 60  # unchanged"
            - "service.total_prescribed_minutes_to_date == 150  # unchanged"
            - "Invariant: pre_pair_utilization == post_pair_utilization exactly (no drift)"

      - name: service_suspend_resume_preserves_lre_percentage
        grounds:
          - entities.IEP.fields.lre_percentage_instructional
          - entities.IEP.fields.special_education_minutes_per_week
          - state_machines.RelatedService.ACTIVE_to_SUSPENDED
          - state_machines.RelatedService.SUSPENDED_to_ACTIVE
          - calculations.lre_percentage
          - endpoints.PUT_/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/suspend
          - endpoints.PUT_/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/resume
        distinguishing_aspect: |
          DIFFERENT conserved-quantity type from utilization_percent: this is
          the IEP-level lre_percentage_instructional (a percentage on a
          DIFFERENT entity, IEP, derived from a SUM of ACTIVE pull-out
          minutes — not from a ratio of delivered/prescribed). Forward
          action: suspend a RelatedService (sped minutes drop, lre drops).
          Compensating action: resume the SAME service with no intermediate
          state changes (sped minutes restored, lre restored). Invariant:
          pre_pair_lre_percentage_instructional ==
          post_pair_lre_percentage_instructional exactly.
        test_recipe:
          setup:
            - "Shared bootstrap to ACTIVE IEP with total_instructional_minutes_per_week=1500"
            - "Activate OT service (300 PULL_OUT min/week) and SPEECH service (150 PULL_OUT min/week)"
            - "Verify pre_pair iep.lre_percentage_instructional == 30.00  # (300+150)/1500*100 = 30.00"
            - "Verify pre_pair iep.special_education_minutes_per_week == 450"
            - "Verify pre_pair student.lre_classification == 'LRE_B'  # 30.00 in (20, 60]"
          trigger:
            - "PUT .../related-services/{ot_service}/suspend  # lre temporarily drops to 150/1500*100=10.00, classification flips to LRE_A"
            - "PUT .../related-services/{ot_service}/resume with consent_id=consent_ot  # consent still APPROVED — service re-activates"
          assert:
            - "iep.lre_percentage_instructional == 30.00  # exactly equal to pre_pair value"
            - "iep.special_education_minutes_per_week == 450  # exactly equal to pre_pair value"
            - "student.lre_classification == 'LRE_B'  # restored"
            - "Invariant: pre_pair_lre_percentage_instructional == post_pair_lre_percentage_instructional (no drift)"
