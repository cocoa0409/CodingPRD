        distinguishing_aspect: "One ELECTRONICS item with purchase price 400000 and declared 350000 reads basis ACV at 373333 before certification, basis APPRAISAL at 900000 after certification, and falls back to ACV at 373333 (not DECLARED) after the appraisal is voided, because the ACV regime outranks the DECLARED regime."
