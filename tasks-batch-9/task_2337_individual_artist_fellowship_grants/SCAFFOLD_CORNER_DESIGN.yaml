      - name: slate_membership_and_coverage_are_enforced_separately
        claim_type: cross_reference_link
        grounds:
          - validations[error_id=ERR_INCOMPLETE_SLATE]
          - validations[error_id=ERR_APPLICATION_NOT_ON_PANEL]
        distinguishing_aspect: |
          Two different defects on the same endpoint must produce two different
          codes: omitting a SCORED application of the panel is ERR_INCOMPLETE_SLATE,
          while naming an application that was never assigned to the panel is
          ERR_APPLICATION_NOT_ON_PANEL even though the coverage requirement is
          satisfied by the other two ids. An implementation that only checks
          set-equality collapses both into one code.
        test_recipe:
