  # =========================================================================
  # Section: validations — violation-to-error (non-difficulty)
  # =========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Request without X-User-Role returns 401."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /mill/fiber-lots"
              as: __NO_ROLE__
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: forbidden_role_on_fiber_lot_create
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "CustomerServiceRep may not POST /mill/fiber-lots (MillPlanner exclusive)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 100.0, unit_cost_per_lb: 1.5 }
              as: CustomerServiceRep
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 403"
            - "error_id == ERR_FORBIDDEN"

      - name: duplicate_machine_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "Second SpinningMachine with same machine_code fails."
        test_recipe:
          setup: ["One SpinningMachine SPIN-DUP exists"]
          setup_api_calls:
            - call: "POST /mill/spinning-machines"
              payload: { machine_code: "SPIN-DUP", supported_count_min_ne: 10.0, supported_count_max_ne: 30.0 }
              as: MillAdmin
          trigger:
            - call: "POST /mill/spinning-machines"
              payload: { machine_code: "SPIN-DUP", supported_count_min_ne: 15.0, supported_count_max_ne: 25.0 }
              as: MillAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_KEY"

      - name: fk_reference_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "POST /mill/machine-assignments with bogus machine_id returns 422 ERR_REFERENCE_NOT_FOUND."
        test_recipe:
          setup: ["A YarnLot exists (so yarn_lot_id resolves); machine_id will be a bogus UUID"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
              as: MillPlanner
              captures: { fl_id: $.data.id }
            - call: "POST /mill/blend-recipes"
              payload: { recipe_code: "FK-ERR", target_yarn_count_ne: 20.0 }
              as: MillPlanner
              captures: { rec_id: $.data.id, rec_v: $.data.version }
            - call: "POST /mill/blend-recipes/${rec_id}/components"
              payload: { fiber_lot_id: "${fl_id}", component_weight_lbs: 100.0 }
              as: MillPlanner
            - call: "POST /mill/blend-recipes/${rec_id}/approve"
              payload: { expected_recipe_version: "${rec_v}" }
              as: MillPlanner
            - call: "POST /mill/yarn-lots"
              payload: { recipe_id: "${rec_id}", spun_weight_lbs: 100.0, actual_yarn_count_ne: 20.0 }
              as: SpinningSupervisor
              captures: { yl_id: $.data.id }
          trigger:
            - call: "POST /mill/machine-assignments"
              payload: { machine_id: "00000000-0000-0000-0000-000000000000", yarn_lot_id: "${yl_id}", window_start: "2026-08-14T08:00:00Z", window_end: "2026-08-14T12:00:00Z" }
              as: SpinningSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_REFERENCE_NOT_FOUND"

      - name: count_out_of_range_for_machine
        claim_type: violation_to_error
        grounds: ["errors[ERR_COUNT_OUT_OF_RANGE]"]
        distinguishing_aspect: "MachineAssignment rejected when recipe.target_yarn_count_ne is outside machine's supported range."
        test_recipe:
          setup: ["Recipe with target_ne=50.0; machine supporting 10-30"]
          setup_api_calls:
            - call: "POST /mill/fiber-lots"
              payload: { fiber_type: "COTTON", received_weight_lbs: 500.0, unit_cost_per_lb: 1.5 }
