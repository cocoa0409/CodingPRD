              captures: { code_b: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { candidate_id: "${cand_a}", accommodation_type: "EXTRA_TIME", requested_multiplier: 1.5, documentation_ref: "DOC-EXTRA-1" }
