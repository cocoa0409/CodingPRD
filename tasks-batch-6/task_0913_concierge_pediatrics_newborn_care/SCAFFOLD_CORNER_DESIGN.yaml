            - call: "POST /peds/form-requests"
              payload: { membership_id: "${mem_id}", form_type: "CAMP", needed_by_date: "2026-08-01" }
              as: CareCoordinator
              captures: { fr_id: "$.data.id", fr_status: "$.data.status", fr_reason: "$.data.blocked_reason" }
          trigger:
            - call: "POST /peds/form-requests/${fr_id}/issue"
