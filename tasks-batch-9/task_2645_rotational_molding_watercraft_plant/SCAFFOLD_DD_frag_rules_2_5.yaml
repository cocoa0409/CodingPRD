            - call: "POST /finished-units/${fu1}/outfit"
              payload: { hardware_kit_serial: "HK-CASD-0001" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu1}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "POST /finished-units/${fu2}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu2}/outfit"
              payload: { hardware_kit_serial: "HK-CASD-0002" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fu2}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /finished-units/${fu2}/inspect"
              payload: { wall_thickness_points: [4.60, 7.40, 4.60, 7.40, 4.60, 7.40], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "GET /finished-units/${fu1}"
              payload: {}
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "before the trigger ProductionOrder.${po}.status == \"COMPLETE\" with completed_qty == 2, total_cost_cents == 13027 and unit_cost_cents == 6513 == floor(13027 / 2), where material_cost_cents == 5040 == round_half_up(24.000 * 210), oven_energy_cost_cents == 6000 == round_half_up(60 * 100), and overhead_cents == 1987 == round_half_up(11040 * 18.00 / 100) on the pre-overhead subtotal 11040 (tier row max_subtotal_cents 500000)"
            - "LINK 1: the re-inspection returns 200 and FinishedUnit.${fu2}.build_status == \"REWORK\" with inspection_verdict \"REWORK\" and rework_count == 1; wall_cv_pct == 23.33 > wall_cv_max_pct 12.00 (ladder clause 5) while min_wall_thickness_mm 4.60 >= 4.50 and final_warpage_index 0.510 <= 2.500 keep it out of SCRAP"
            - "LINK 2: ProductionOrder.${po}.completed_qty == 1 — the rollup counts hull ${fu1} only, because ${fu2} is neither SELLABLE nor in any logistics state that would still count it"
            - "LINK 3: ProductionOrder.${po}.status == \"IN_PRODUCTION\" — a COMPLETE order was re-opened by a quality event, with scrapped_qty still 0"
            - "TERMINAL EFFECT: ProductionOrder.${po}.unit_cost_cents == 13027 == floor(13027 / 1). The inputs did not move — material_cost_cents is still 5040, oven_energy_cost_cents still 6000, overhead_cents still 1987 and total_cost_cents still 13027 — so the doubled unit cost is caused solely by the completed_qty that link 2 lowered"
            - "the untouched sibling proves the cascade is scoped: FinishedUnit.${fu1}.build_status == \"SELLABLE\" with rework_count == 0, inspection_verdict \"PASS\", wall_cv_pct 1.08 and logistics_status \"UNALLOCATED\""
            - "the chain is re-entrant rather than one-way: the order is now IN_PRODUCTION and a later PASS on ${fu2} would drive completed_qty back to 2 and unit_cost_cents back to 6513, which is why unit_cost_cents must be recomputed on every rollup and never stored as a one-time figure"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # Each instance constructs a state that trips BOTH members of one declared
  # pair and asserts the LOWER priority number's error_id wins, with control
  # calls proving the suppressed member was genuinely live. The three
  # instances use DIFFERENT error-category pairs (§0.5 Rule 5 clause):
  #   PAIR-1  state x business_temporal
  #   PAIR-2  business_safety x business_fiscal
  #   PAIR-5  business_safety x business_temporal
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pair1_order_not_schedulable_beats_oven_window_conflict
        grounds:
          - validations[priority=34]
          - validations[priority=62]
          - calculations.oven_arm_window_check
          - calculations.mold_selection
          - errors.ERR_ORDER_NOT_SCHEDULABLE
          - errors.ERR_OVEN_WINDOW_CONFLICT
        distinguishing_aspect: |
          PAIR-1 pits category STATE (priority 34, ERR_ORDER_NOT_SCHEDULABLE)
          against category BUSINESS_TEMPORAL (priority 62,
          ERR_OVEN_WINDOW_CONFLICT) on POST /molding-cycles — a
          state-vs-temporal pair that neither of the other two instances uses,
          and the only one of the three where both members return the same HTTP
          status (409), so the error_id alone discriminates.
        test_recipe:
          setup:
            - "ProductModel PM-P1-KM (nominal_charge_kg 12.000) with TWO moulds MLD-P1A and MLD-P1B, both cavity_count 1 and nominal_charge_kg 12.000. Two moulds are deliberate: the second one keeps calculations.mold_selection non-empty so priority 70 ERR_NO_ELIGIBLE_MOLD can never mask the pair."
            - "OvenStation OV-1 with arm_count 2 and changeover_buffer_min 15, CoolingBay CB-1 FORCED_AIR with concurrent_slot_capacity 2, and a qualified ResinLot LOT-P1 of 500.000 kg so every release passes its resin gate."
            - "PO-P1-A (ordered_qty 1) is released and holds one SCHEDULED cycle CYC-P1-A on OV-1 arm 1 with oven_start_at 09:00 and scheduled_oven_minutes 60, so arm 1 is occupied over the buffered span around 09:00-10:00 and MLD-P1A is occupied over the half-open span [09:00, 10:30)."
            - "PO-P1-B (ordered_qty 1) is created and left in DRAFT — never released — so it trips priority 34."
            - "PO-P1-C (ordered_qty 1) is released to READY_TO_SCHEDULE and holds no cycle, so it passes priority 34 and its overbuild budget floor(1 * 1.20) == 1 is untouched."
          setup_api_calls:
            - call: "POST /product-models"
              payload: { model_code: "PM-P1-KM", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "FLINT", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 12.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 2.0000, nest_factor: 0.5000, unit_weight_kg: 24.000, msrp_cents: 300000, warranty_basis: "FLAT", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-P1A", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 12.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold_a: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-P1B", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 12.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold_b: $.data.id }
            - call: "POST /oven-stations"
              payload: { station_code: "OV-1", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - call: "POST /cooling-bays"
              payload: { bay_code: "CB-1", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - call: "POST /technicians"
              payload: { employee_code: "T-OPR-1", full_name: "Omar Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - call: "POST /warehouses"
              payload: { site_code: "WH-P1", footprint_capacity_cube_m3: 20.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 20.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-P1", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "FLINT", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2035-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-P1-A", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_a: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-P1-B", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_b: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-P1-C", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_c: $.data.id }
            - call: "POST /production-orders/${po_a}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_a_v: $.data.version }
            - call: "POST /production-orders/${po_c}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po_a}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_a_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc_a: $.data.id }
          trigger:
            - call: "GET /production-orders/${po_b}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_b_v1: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po_b}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:30:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_b_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /production-orders/${po_b}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_b_v2: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po_b}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T13:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_b_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /production-orders/${po_c}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { po_c_v1: $.data.version }
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po_c}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:30:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_c_v1}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /molding-cycles?production_order_id=${po_b}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /production-orders/${po_b}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "CONFLICT CALL (both members live): the first POST /molding-cycles returns 409 with data.error_id == \"ERR_ORDER_NOT_SCHEDULABLE\" — member A at priority 34 wins over member B at priority 62. PO-P1-B is DRAFT (34 trips) AND the requested arm-1 window 09:30-10:30 overlaps CYC-P1-A's buffered 09:00-10:00 span (62 trips)."
            - "the winner is NOT \"ERR_OVEN_WINDOW_CONFLICT\": both members carry http_status 409, so the response status cannot be what distinguishes them — only the error_id can, which is exactly what makes this pair worth pinning"
            - "nothing between the two members interfered: priority 58 passes because cooling_mode FORCED_AIR equals CoolingBay.airflow_mode, priority 59 passes because SIZE_CLASS_ORDER[MID] 2 <= SIZE_CLASS_ORDER[OVERSIZE] 4, and priorities 32 and 33 pass because OV-1 is OPERATIONAL and CB-1 is OPERATIONAL"
            - "CONTROL A (member A alone): the second POST /molding-cycles — same DRAFT order, but arm 2 and a non-overlapping 13:00 window — also returns 409 \"ERR_ORDER_NOT_SCHEDULABLE\", so member A alone reproduces the conflict call's observable outcome"
            - "CONTROL B (member B alone): the third POST /molding-cycles — the RELEASED order PO-P1-C over the same conflicting arm-1 09:30 window — returns 409 with data.error_id == \"ERR_OVEN_WINDOW_CONFLICT\". This is the falsifying half: member B WAS live in the conflict call and was suppressed purely by priority order, not by being satisfied."
            - "CONTROL B also proves the mould pool never masked the pair: MLD-P1A is excluded by the half-open overlap [09:00, 10:30) vs [09:30, 11:00) while MLD-P1B remains eligible, so priority 70 ERR_NO_ELIGIBLE_MOLD and ERR_MOLD_WINDOW_CONFLICT are both vacuous"
            - "TERMINAL: GET /molding-cycles?production_order_id=${po_b} returns 0 rows, ProductionOrder.${po_b}.status is still \"DRAFT\" and ProductionOrder.${po_b}.version == ${po_b_v1} — all three rejections were pure, writing no cycle and bumping no version, and CYC-P1-A is still \"SCHEDULED\""

      - name: pair2_regrind_limit_beats_resin_insufficient
        grounds:
          - validations[priority=52]
          - validations[priority=72]
          - calculations.cycle_regrind_percentage
          - calculations.resin_mass_ledger
          - errors.ERR_REGRIND_LIMIT_EXCEEDED
          - errors.ERR_RESIN_INSUFFICIENT
        distinguishing_aspect: |
          A DIFFERENT category pair from PAIR-1: BUSINESS_SAFETY (priority 52,
          ERR_REGRIND_LIMIT_EXCEEDED, 422) against BUSINESS_FISCAL (priority
          72, ERR_RESIN_INSUFFICIENT, 409) on POST /resin-charges. Because the
          two members also differ in HTTP status, this instance pins the
          product-safety-before-money ordering at the status-code level as well
          as the error_id level: a 409 anywhere in the conflict case would mean
          the money check ran first.
        test_recipe:
          setup:
            - "ProductModel PM-P2-KM with nominal_charge_kg 24.000, charge_tolerance_pct 5.00 and max_regrind_pct 30.00; Mold MLD-P2-1 with cavity_count 1 and nominal_charge_kg 24.000 == 24.000 * 1."
            - "TWO qualified ResinLots identical on grade, additive package, colour, melt index and regrind_pct_by_mass, differing only in mass: LOT-P2-BIG with received_kg 500.000 and LOT-P2-SMALL with received_kg 10.000. Only LOT-P2-BIG clears the release gate round(24.000 * 0.95, 3) == 22.800, which is why the order can be released at all; LOT-P2-SMALL is unqualified on mass but still status AVAILABLE, so it can be named in a charge request."
            - "PO-P2 (ordered_qty 1) is released and holds one SCHEDULED cycle CYC-P2 (OV-1 arm 1, 09:00-10:00, cooling 30, FORCED_AIR) with charged_mass_kg 0.000 and cycle_regrind_pct 0.00 and NO ResinCharge rows, so every regrind computation below sees the candidate charge alone."
