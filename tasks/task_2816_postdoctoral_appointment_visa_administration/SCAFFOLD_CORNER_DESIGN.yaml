      - name: the_title_class_pairing_and_the_term_length_window_are_each_reachable
        claim_type: error_triggerable
        grounds:
          - validations.priority_13_ERR_TITLE_CLASS_MISMATCH
          - validations.priority_16_ERR_TERM_LENGTH_INVALID
          - endpoints.POST /appointments
        distinguishing_aspect: "Both semantic errors live on POST /appointments behind the priority-5 shape check, so they are only reachable with a well-formed body: POSTDOC_FELLOW paired with EMPLOYEE is a legal enum pair that fails the pairing rule at priority 13, and an 11-month or 37-month term is a legal date pair that fails the [12, 36] window at priority 16. The two inclusive endpoints, 12 months and 36 months, must both be accepted, so the window is closed at both ends."
