      - name: empty_post_segregation_snapshot_set_yields_zero_earnings
        grounds:
          - calculations.earnings_growth_bps
          - calculations.earnings_adjustment
          - entities.ValuationSnapshot.fields.as_of_date
          - errors.ERR_VALUATION_SNAPSHOT_MISSING
          - validations[priority=62]
        distinguishing_aspect: |
          v1 is the EARLIEST snapshot whose as_of_date is >= the segregation date, and the set can be
          empty — in which case v1 collapses onto v0 and the growth is exactly 0 bps, not the growth to
          the most recent snapshot on file. Three sibling accounts separate the three readings that a
          careless implementation conflates: (a) snapshots on 2026-06-30 and 2026-08-15 with segregation
          on 2026-09-15 yields 0 bps and a payee balance of exactly 400000, because the 2026-08-15
          snapshot sits strictly inside the interval and is ignored entirely (a "latest snapshot"
          implementation reports 2000 bps and 480000); (b) a snapshot on exactly 2026-09-15 IS a
          candidate because the comparison is >=, giving 1000 bps and 440000; (c) a case whose
          valuation_date has no exactly-matching snapshot cannot be qualified at all and reports
          ERR_VALUATION_SNAPSHOT_MISSING, even though the hold was placed successfully at receipt.
