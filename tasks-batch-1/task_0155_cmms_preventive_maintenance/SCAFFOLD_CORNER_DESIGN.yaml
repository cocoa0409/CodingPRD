  # =========================================================================
  # Errors — entries already exercised by §1.8 are stubbed
  # =========================================================================
  - section: errors
    instances:
      - name: error_stale_version_on_reservation_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[reservation-create-stale-part]"]
        distinguishing_aspect: "OCC: reserving against a SparePart with a stale expected_spare_part_version (one behind the bumped value) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["a SparePart whose version was bumped by a first reservation; client still holds the pre-bump version"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site SV", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /spare-parts"
              payload: { sku: "SV-1", name: "SV Part", on_hand_qty: 20, unit_cost_cents: 100 }
              as: InventoryClerk
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset SV", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "ROUTINE", estimated_labor_hours: 1 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
            - call: "POST /work-orders/${wid}/reservations"
              payload: { spare_part_id: "${pid}", qty: 2, expected_spare_part_version: "${pv0}" }
              as: InventoryClerk
          trigger:
            - call: "POST /work-orders/${wid}/reservations"
              payload: { spare_part_id: "${pid}", qty: 2, expected_spare_part_version: "${pv0}" }
              as: InventoryClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response status 412"

      - name: error_unauthenticated_missing_role_header
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "a request with an unrecognized X-User-Role is rejected ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /spare-parts"
              as: Ghost
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "response status 401"

      - name: error_downtime_overlap_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_DOWNTIME_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / asset_downtime_open_ray_overlap
          rationale: "ERR_DOWNTIME_OVERLAP is asserted as the failure path of the named §1.8 instance."

      - name: error_tech_double_booked_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_TECH_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / technician_window_closed_interval_overlap
          rationale: "ERR_TECH_DOUBLE_BOOKED is asserted as the failure path of the named §1.8 instance."

      - name: assign_junior_to_overhaul_skill_insufficient
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_SKILL_INSUFFICIENT]", calculations.calc_skill_gate]
        distinguishing_aspect: "an UNASSIGNED OVERHAUL work order (requires MASTER) assigned to a JUNIOR technician with ample backlog room is rejected ERR_SKILL_INSUFFICIENT (422); state and backlog checks both pass so the skill gate is the sole failure."
        test_recipe:
          setup: ["an UNASSIGNED OVERHAUL work order (released to queue) and a JUNIOR technician with empty backlog"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Site SK", maintenance_budget_cents: 1000000 }
              as: MaintenanceManager
              captures: { sid: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Junior2", skill_level: "JUNIOR", weekly_capacity_hours: 40 }
              as: MaintenanceManager
              captures: { tid: $.data.id }
            - call: "POST /assets"
              payload: { site_id: "${sid}", name: "Asset SK", acquisition_cost_cents: 100 }
              as: MaintenanceManager
              captures: { aid: $.data.id }
            - call: "POST /work-orders"
              payload: { asset_id: "${aid}", wo_type: "CORRECTIVE", severity: "OVERHAUL", estimated_labor_hours: 4 }
              as: Planner
              captures: { wid: $.data.id }
            - call: "POST /work-orders/${wid}/release-to-queue"
              as: Planner
          trigger:
            - call: "POST /work-orders/${wid}/assign"
              payload: { technician_id: "${tid}" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SKILL_INSUFFICIENT"
            - "WorkOrder.${wid}.execution_status == UNASSIGNED"

      - name: error_asset_busy_stub
        claim_type: violation_to_error
        grounds: ["errors[ERR_ASSET_BUSY]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / asset_retire_blocked_by_open_downtime
          rationale: "ERR_ASSET_BUSY is asserted as the failure path of the named §1.8 instance."

