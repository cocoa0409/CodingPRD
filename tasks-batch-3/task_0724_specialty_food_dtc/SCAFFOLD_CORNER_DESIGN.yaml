# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Specialty-Food & Gourmet DTC — breadth probe across §1.1–§1.7
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_creation_returns_201_with_fields
        claim_type: Creation
        grounds: ["entities.Customer", "endpoints"]
        distinguishing_aspect: "POST /customers with email/full_name/home_zone returns 201 and a Customer with status ACTIVE, wallet_credit_cents 0, loyalty_points_balance 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { email: "new@x.com", full_name: "New Cust", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
          assert:
            - "response code == 201"
            - "Customer.${cust_id}.status == ACTIVE"
            - "Customer.${cust_id}.wallet_credit_cents == 0"
            - "Customer.${cust_id}.loyalty_points_balance == 0"

      - name: customer_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.Customer", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{non-existent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /customers/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_NOT_FOUND", "http status == 404"]

      - name: customer_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.Customer.fields.home_zone", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /customers omitting home_zone returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { email: "x@x.com", full_name: "X" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_INVALID_REQUEST"]

      - name: customer_create_invalid_zone_enum_returns_invalid_enum
        claim_type: Type Constraints
        grounds: ["entities.Customer.fields.home_zone", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "POST /customers with home_zone 'Z9' (not in Z1..Z4) returns ERR_INVALID_ENUM (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { email: "z9@x.com", full_name: "Z9", home_zone: "Z9" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_INVALID_ENUM"]

      - name: customer_duplicate_email_rejected
        claim_type: Type Constraints
        grounds: ["entities.Customer.fields.email", "errors[ERR_DUPLICATE_EMAIL]", "validations[priority=18]"]
        distinguishing_aspect: "A second POST /customers with an already-registered email returns ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["One customer already registered with email dup@x.com."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "dup@x.com", full_name: "First", home_zone: "Z1" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /customers", payload: { email: "dup@x.com", full_name: "Second", home_zone: "Z2" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_DUPLICATE_EMAIL"]

      - name: sku_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: ["entities.Sku.fields.id", "entities.Sku.fields.status"]
        distinguishing_aspect: "POST /skus mints id and starts status DRAFT and label_approved false regardless of any client-supplied status."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /skus", payload: { name: "Sys Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_id: $.data.id, st: $.data.status } }
          assert: ["Sku.${sku_id}.status == DRAFT", "Sku.${sku_id}.label_approved == false", "Sku.${sku_id}.id is a UUID"]

      - name: sku_default_allergens_empty
        claim_type: Defaults
        grounds: ["entities.Sku.fields.allergens"]
        distinguishing_aspect: "POST /skus omitting allergens applies default []."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /skus", payload: { name: "Plain Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 2000 }, as: InventoryManager, captures: { sku_id: $.data.id } }
          assert: ["Sku.${sku_id}.allergens == []"]

      - name: sku_available_units_computed_from_released_lots
        claim_type: Computed Fields
        grounds: ["entities.Sku.fields.available_units", "state_machines.Lot.QUARANTINE_to_RELEASED"]
        distinguishing_aspect: "Sku.available_units equals the released lot's produced_units once a lot is released; a QUARANTINE lot contributes 0."
        test_recipe:
          setup: ["A SKU with one QUARANTINE lot of 7 units, then released."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Avail Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_id: $.data.id } }
            - { call: "POST /skus/${sku_id}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_id}", lot_code: "LA", produced_units: 7, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_id: $.data.id, lot_v: $.data.version } }
          trigger:
            - { call: "POST /lots/${lot_id}/release", payload: { expected_lot_version: "${lot_v}" }, as: InventoryManager }
          assert: ["Sku.${sku_id}.available_units == 7 after release"]

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: order_cancel_from_delivered_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Order.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an order whose fulfillment_status is DELIVERED (terminal) returns ERR_INVALID_STATE; no refund fires."
        test_recipe:
          setup: ["A DELIVERED order."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Del Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "del@x.com", full_name: "Del", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/pay", payload: { outcome: "SUCCEEDED" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/ship", payload: {}, as: InventoryManager }
            - { call: "POST /orders/${order_id}/deliver", payload: {}, as: InventoryManager }
          trigger:
            - { call: "POST /orders/${order_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_INVALID_STATE"]

      - name: subscription_cancel_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.Subscription.ACTIVE_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second cancel on a CANCELLED subscription returns ERR_INVALID_STATE (terminal lockdown)."
        test_recipe:
          setup: ["A CANCELLED subscription."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Term Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 2900 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "term@x.com", full_name: "Term", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /subscriptions/${sub_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_INVALID_STATE"]

      - name: sku_label_hold_reverts_active_to_label_hold_and_pauses_subscriptions
        claim_type: Side Effect Execution
        grounds: ["state_machines.Sku.ACTIVE_to_LABEL_HOLD", "state_machines.Subscription.ACTIVE_to_PAUSED"]
        distinguishing_aspect: "POST /skus/{id}/label/hold on an ACTIVE SKU sets status LABEL_HOLD, label_approved false, and auto-pauses ACTIVE subscriptions on that SKU."
        test_recipe:
          setup: ["An ACTIVE SKU with an ACTIVE subscription on it."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Hold Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 2900 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "hold@x.com", full_name: "Hold", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /skus/${sku_a}/label/hold", payload: {}, as: ComplianceOfficer, captures: { st: $.data.status } }
          assert:
            - "Sku.${sku_a}.status == LABEL_HOLD"
            - "Sku.${sku_a}.label_approved == false"
            - "Subscription.${sub_id}.status == PAUSED"

      - name: referral_qualifies_when_referred_first_order_ships
        claim_type: Valid Transition
        grounds: ["state_machines.Referral.PENDING_to_QUALIFIED", "state_machines.Order.RESERVED_to_SHIPPED"]
        distinguishing_aspect: "When a referred customer's first order reaches SHIPPED, the PENDING Referral auto-transitions to QUALIFIED."
        test_recipe:
          setup: ["A referrer and a referred customer (created with referrer_id), referred has a paid reserved order."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Ref Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "rer@x.com", full_name: "Referrer", home_zone: "Z1" }, as: PlatformAdmin, captures: { ref_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "red@x.com", full_name: "Referred", home_zone: "Z1", referrer_id: "${ref_id}" }, as: PlatformAdmin, captures: { red_id: $.data.id } }
            - { call: "GET /referrals?referred_id=${red_id}", payload: {}, as: PlatformAdmin, captures: { referral_id: "$.data[0].id" } }
            - { call: "POST /orders", payload: { customer_id: "${red_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${red_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${red_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${red_id}" }
            - { call: "POST /orders/${order_id}/pay", payload: { outcome: "SUCCEEDED" }, as: Customer, as_user_id: "${red_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/ship", payload: {}, as: InventoryManager }
          assert: ["the Referral ${referral_id} for ${red_id} has status == QUALIFIED"]

      - name: lot_release_quarantine_only_invalid_from_recalled
        claim_type: Invalid Transitions
        grounds: ["state_machines.Lot.RELEASED_to_RECALLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Recalling a QUARANTINE lot (never released) returns ERR_INVALID_STATE; recall is only valid from RELEASED."
        test_recipe:
          setup: ["A QUARANTINE lot."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Q Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id } }
          trigger:
            - { call: "POST /lots/${lot_a}/recall", payload: {}, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_INVALID_STATE"]

      - name: referral_reward_credits_referrer_points
        claim_type: Side Effect Execution
        grounds: ["state_machines.Referral.QUALIFIED_to_REWARDED", "entities.Customer.fields.loyalty_points_balance"]
        distinguishing_aspect: "Rewarding a QUALIFIED referral sets reward_points 500 and credits the referrer's loyalty_points_balance += 500."
        test_recipe:
          setup: ["A QUALIFIED referral whose referred customer's first order shipped; referrer loyalty starts 0."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Rw Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "rwr@x.com", full_name: "Rwr", home_zone: "Z1" }, as: PlatformAdmin, captures: { ref_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "rwd@x.com", full_name: "Rwd", home_zone: "Z1", referrer_id: "${ref_id}" }, as: PlatformAdmin, captures: { red_id: $.data.id } }
            - { call: "GET /referrals?referred_id=${red_id}", payload: {}, as: PlatformAdmin, captures: { referral_id: "$.data[0].id" } }
            - { call: "POST /orders", payload: { customer_id: "${red_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${red_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${red_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${red_id}" }
            - { call: "POST /orders/${order_id}/pay", payload: { outcome: "SUCCEEDED" }, as: Customer, as_user_id: "${red_id}" }
            - { call: "POST /orders/${order_id}/ship", payload: {}, as: InventoryManager }
          trigger:
            - { call: "POST /referrals/${referral_id}/reward", payload: {}, as: PlatformAdmin, captures: { rp: $.data.reward_points } }
          assert:
            - "Referral.${referral_id}.reward_points == 500"
            - "Customer.${ref_id}.loyalty_points_balance == 500"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: perishable_order_total_handling_and_expedite
        claim_type: Correct Result
        grounds: ["calculations.order_total", "entities.Sku.fields.storage_class"]
        distinguishing_aspect: "A perishable line adds 450 handling and expedites shipping (zone Z3 base 1200 * 1.5 = 1800); subtotal 9600 (5% disc) yields total 11370."
        test_recipe:
          setup: ["One PERISHABLE line (1500x4=6000) + one AMBIENT line (1200x3=3600), zone Z3, no redeem."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Cold Brew", category: "COFFEE", storage_class: "PERISHABLE", unit_price_cents: 1500 }, as: InventoryManager, captures: { sku_p: $.data.id } }
            - { call: "POST /skus/${sku_p}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_p}", lot_code: "LP", produced_units: 50, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_p: $.data.id, lot_p_v: $.data.version } }
            - { call: "POST /lots/${lot_p}/release", payload: { expected_lot_version: "${lot_p_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_p}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /skus", payload: { name: "Amb Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1200 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 50, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "per@x.com", full_name: "Per", home_zone: "Z3" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z3" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_p}", quantity: 4 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 3 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { total: $.data.total_cents } }
          assert:
            - "Order.${order_id}.subtotal_cents == 9600"
            - "Order.${order_id}.discount_cents == 480"
            - "Order.${order_id}.handling_cents == 450"
            - "Order.${order_id}.shipping_cents == 1800"
            - "Order.${order_id}.total_cents == 11370"

      - name: corporate_bulk_quote_top_tier_total
        claim_type: Correct Result
        grounds: ["calculations.corporate_bulk_quote", "state_machines.BulkQuote.DRAFT_to_QUOTED"]
        distinguishing_aspect: "Bulk 200 units * 1500 = 300000 hits the 20%/0.03 tier: discount 60000, handling 7200, gift wrap 10*350=3500, total 250700."
        test_recipe:
          setup: ["An ACTIVE SKU priced 1500; a DRAFT bulk quote for 200 units with 10 gift boxes."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Bulk Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1500 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 1000, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "corp@x.com", full_name: "Corp", home_zone: "Z1" }, as: CorporateBuyer, captures: { buyer_id: $.data.id } }
            - { call: "POST /bulk-quotes", payload: { corporate_buyer_id: "${buyer_id}", sku_id: "${sku_a}", quantity: 200, gift_box_count: 10 }, as: CorporateBuyer, as_user_id: "${buyer_id}", captures: { bq_id: $.data.id } }
          trigger:
            - { call: "POST /bulk-quotes/${bq_id}/quote", payload: {}, as: PlatformAdmin, captures: { tot: $.data.total_cents } }
          assert:
            - "BulkQuote.${bq_id}.discount_cents == 60000"
            - "BulkQuote.${bq_id}.handling_cents == 7200"
            - "BulkQuote.${bq_id}.total_cents == 250700"

      - name: bulk_quote_tier_boundary_below_20000_no_discount
        claim_type: Constants Applied
        grounds: ["calculations.corporate_bulk_quote"]
        distinguishing_aspect: "Bulk 10 units * 1000 = 10000 (< 20000) takes the 0%/0.06 tier: discount 0, handling 600, total 10600."
        test_recipe:
          setup: ["An ACTIVE SKU priced 1000; a DRAFT bulk quote for 10 units, 0 gift boxes."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Sm Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 100, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "sm@x.com", full_name: "Sm", home_zone: "Z1" }, as: CorporateBuyer, captures: { buyer_id: $.data.id } }
            - { call: "POST /bulk-quotes", payload: { corporate_buyer_id: "${buyer_id}", sku_id: "${sku_a}", quantity: 10 }, as: CorporateBuyer, as_user_id: "${buyer_id}", captures: { bq_id: $.data.id } }
          trigger:
            - { call: "POST /bulk-quotes/${bq_id}/quote", payload: {}, as: PlatformAdmin }
          assert:
            - "BulkQuote.${bq_id}.discount_cents == 0"
            - "BulkQuote.${bq_id}.handling_cents == 600"
            - "BulkQuote.${bq_id}.total_cents == 10600"

      - name: fefo_selects_earliest_expiry_lot
        claim_type: Correct Result
        grounds: ["state_machines.Order.DRAFT_to_RESERVED", "entities.OrderLine.fields.lot_id"]
        distinguishing_aspect: "When two RELEASED lots exist, reserve assigns the line's lot_id to the lot with the earliest expiry_iso (FEFO), tie-break created_at ASC."
        test_recipe:
          setup: ["A SKU with two RELEASED lots: lot_early expiry 2026-05-01, lot_late expiry 2026-09-01."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "FEFO Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LATE", produced_units: 5, expiry_iso: "2026-09-01T00:00:00Z" }, as: InventoryManager, captures: { lot_late: $.data.id, lot_late_v: $.data.version } }
            - { call: "POST /lots/${lot_late}/release", payload: { expected_lot_version: "${lot_late_v}" }, as: InventoryManager }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "EARLY", produced_units: 5, expiry_iso: "2026-05-01T00:00:00Z" }, as: InventoryManager, captures: { lot_early: $.data.id, lot_early_v: $.data.version } }
            - { call: "POST /lots/${lot_early}/release", payload: { expected_lot_version: "${lot_early_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "fefo@x.com", full_name: "Fefo", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /orders/${order_id}/lines", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { chosen_lot: "$.data[0].lot_id" } }
          assert: ["the order line's lot_id == ${lot_early} (earliest expiry chosen)"]

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: reserve_insufficient_points_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=15]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "Reserve requesting more redeem points than the customer's balance returns ERR_INSUFFICIENT_POINTS (422)."
        test_recipe:
          setup: ["A customer with 0 loyalty points; an order requesting 50 redeem points."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Pt Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "pt@x.com", full_name: "Pt", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1", requested_redeem_points: 50 }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_INSUFFICIENT_POINTS"]

      - name: lot_release_after_expiry_rejected
        claim_type: Temporal validation
        grounds: ["validations[priority=11]", "errors[ERR_LOT_EXPIRED]", "state_machines.Lot.QUARANTINE_to_RELEASED"]
        distinguishing_aspect: "Releasing a lot whose expiry_iso is at/before the current clock returns ERR_LOT_EXPIRED (409)."
        test_recipe:
          setup: ["A QUARANTINE lot with expiry 2026-04-01; clock advanced to 2026-04-02."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "ExpRel Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-04-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-02T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_LOT_EXPIRED"]

      - name: self_referral_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=14]", "errors[ERR_SELF_REFERRAL]"]
        distinguishing_aspect: "POST /referrals with referrer_id == referred_id returns ERR_SELF_REFERRAL (422)."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "self@x.com", full_name: "Self", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /referrals", payload: { referrer_id: "${cust_id}", referred_id: "${cust_id}" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_SELF_REFERRAL"]

      - name: winback_offer_for_active_customer_rejected
        claim_type: Conditional validation
        grounds: ["validations[priority=13]", "errors[ERR_NOT_WINBACK_ELIGIBLE]"]
        distinguishing_aspect: "POST /winback-offers for an ACTIVE (not DORMANT+CHURN_IMMINENT) customer returns ERR_NOT_WINBACK_ELIGIBLE (409)."
        test_recipe:
          setup: ["A freshly created ACTIVE customer (churn_band OK)."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "act@x.com", full_name: "Act", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /winback-offers", payload: { customer_id: "${cust_id}", discount_pct: 0.20, expires_iso: "2026-12-31T00:00:00Z" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_NOT_WINBACK_ELIGIBLE"]

      - name: gift_order_missing_recipient_email_rejected
        claim_type: Conditional validation
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]", "entities.Order.fields.gift_recipient_email"]
        distinguishing_aspect: "POST /orders with order_kind GIFT but no gift_recipient_email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "gift@x.com", full_name: "Gift", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "GIFT", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_INVALID_REQUEST"]

      - name: ship_lot_understock_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=17]", "errors[ERR_LOT_UNDERSTOCK]", "state_machines.Order.RESERVED_to_SHIPPED"]
        distinguishing_aspect: "Shipping a paid reserved order whose selected lot was recalled to 0 remaining returns ERR_LOT_UNDERSTOCK (409)."
        test_recipe:
          setup: ["A paid RESERVED order on a lot that is then recalled (remaining_units 0) before ship."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Us Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "us@x.com", full_name: "Us", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { customer_id: "${cust_id}", order_kind: "ONE_TIME", ship_zone: "Z1" }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/lines", payload: { sku_id: "${sku_a}", quantity: 1 }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/reserve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /orders/${order_id}/pay", payload: { outcome: "SUCCEEDED" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /lots/${lot_a}/recall", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /orders/${order_id}/ship", payload: {}, as: InventoryManager, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_LOT_UNDERSTOCK"]

      - name: reserve_insufficient_inventory_excluded_difficulty
        claim_type: Violation → Error
        grounds: ["validations[priority=16]", "errors[ERR_INSUFFICIENT_INVENTORY]"]
        excluded_because:
          difficulty_instance: temporal_lot_expiry_excludes_from_fefo
          rationale: "ERR_INSUFFICIENT_INVENTORY on reserve is asserted as the failure path of the named §1.8 lot-expiry temporal instance."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_customers_pagination_envelope
        claim_type: Listing
        grounds: ["endpoints", "entities.Customer"]
        distinguishing_aspect: "GET /customers returns a paginated array envelope with total_count and has_more in meta/pagination fields."
        test_recipe:
          setup: ["Two customers exist."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "p1@x.com", full_name: "P1", home_zone: "Z1" }, as: PlatformAdmin }
            - { call: "POST /customers", payload: { email: "p2@x.com", full_name: "P2", home_zone: "Z1" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /customers?limit=1&offset=0", payload: {}, as: PlatformAdmin, captures: { first: "$.data[0].id" } }
          assert:
            - "response_type == array"
            - "total_count == 2 and has_more == true (limit 1 of 2)"

      - name: bulk_quote_accept_requires_quoted_state
        claim_type: Conditional action
        grounds: ["endpoints", "state_machines.BulkQuote.QUOTED_to_ACCEPTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /bulk-quotes/{id}/accept on a DRAFT (not yet QUOTED) quote returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A DRAFT (un-quoted) bulk quote."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Acc Sauce", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /customers", payload: { email: "acc@x.com", full_name: "Acc", home_zone: "Z1" }, as: CorporateBuyer, captures: { buyer_id: $.data.id } }
            - { call: "POST /bulk-quotes", payload: { corporate_buyer_id: "${buyer_id}", sku_id: "${sku_a}", quantity: 10 }, as: CorporateBuyer, as_user_id: "${buyer_id}", captures: { bq_id: $.data.id } }
          trigger:
            - { call: "POST /bulk-quotes/${bq_id}/accept", payload: {}, as: CorporateBuyer, as_user_id: "${buyer_id}", captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_INVALID_STATE"]

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: missing_auth_headers_rejected
        claim_type: auth
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID returns ERR_UNAUTHENTICATED (401). (No `as:` role supplied — negative auth test.)"
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /customers", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_UNAUTHENTICATED"]

      - name: customer_cannot_create_sku_forbidden
        claim_type: peer_roles
        grounds: ["roles", "validations[priority=2]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A Customer calling POST /skus (InventoryManager-exclusive) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["One customer."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "cust@x.com", full_name: "Cust", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /skus", payload: { name: "Hack", category: "HOT_SAUCE", storage_class: "AMBIENT", unit_price_cents: 1000 }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_FORBIDDEN_ROLE"]

      - name: customer_cannot_cancel_other_customers_subscription
        claim_type: peer_roles
        grounds: ["roles", "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Customer cancelling another customer's subscription returns ERR_NOT_RESOURCE_OWNER (403); ownership compares X-User-ID to Subscription.customer_id."
        test_recipe:
          setup: ["Customer A owns a subscription; Customer B acts on it."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "Own Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 2900 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "owna@x.com", full_name: "Own A", home_zone: "Z1" }, as: PlatformAdmin, captures: { a_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "ownb@x.com", full_name: "Own B", home_zone: "Z1" }, as: PlatformAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${a_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${a_id}", captures: { sub_id: $.data.id } }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/cancel", payload: {}, as: Customer, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert: ["response error_id == ERR_NOT_RESOURCE_OWNER"]

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_swap_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[swap-stage-stale-subscription]", "endpoints"]
        distinguishing_aspect: "POST /subscriptions/{id}/swap with the current expected_subscription_version succeeds and bumps Subscription.version by 1."
        test_recipe:
          setup: ["An ACTIVE subscription on SKU A; a second ACTIVE swap-target SKU B exists."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "SwA Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 2900 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_a}", lot_code: "LA", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_a: $.data.id, lot_a_v: $.data.version } }
            - { call: "POST /lots/${lot_a}/release", payload: { expected_lot_version: "${lot_a_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_a}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /skus", payload: { name: "SwB Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 4900 }, as: InventoryManager, captures: { sku_b: $.data.id } }
            - { call: "POST /skus/${sku_b}/label/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lots", payload: { sku_id: "${sku_b}", lot_code: "LB", produced_units: 5, expiry_iso: "2026-12-01T00:00:00Z" }, as: InventoryManager, captures: { lot_b: $.data.id, lot_b_v: $.data.version } }
            - { call: "POST /lots/${lot_b}/release", payload: { expected_lot_version: "${lot_b_v}" }, as: InventoryManager }
            - { call: "POST /skus/${sku_b}/activate", payload: {}, as: InventoryManager }
            - { call: "POST /customers", payload: { email: "sw@x.com", full_name: "Sw", home_zone: "Z1" }, as: PlatformAdmin, captures: { cust_id: $.data.id } }
            - { call: "POST /subscriptions", payload: { customer_id: "${cust_id}", sku_id: "${sku_a}", tier: "STARTER", cadence_days: 14 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id, sub_v: $.data.version } }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/swap", payload: { pending_swap_sku_id: "${sku_b}", expected_subscription_version: "${sub_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { new_v: $.data.version } }
          assert:
            - "Subscription.${sub_id}.pending_swap_sku_id == ${sku_b}"
            - "Subscription.${sub_id}.version == ${sub_v} + 1"

      - name: occ_swap_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[swap-stage-stale-subscription]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second swap carrying the pre-swap (now stale) expected_subscription_version is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An ACTIVE subscription that has already had one successful swap (version advanced)."]
          setup_api_calls:
            - { call: "POST /skus", payload: { name: "St Coffee", category: "COFFEE", storage_class: "AMBIENT", unit_price_cents: 2900 }, as: InventoryManager, captures: { sku_a: $.data.id } }
            - { call: "POST /skus/${sku_a}/label/approve", payload: {}, as: ComplianceOfficer }
