              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bakery/offer-windows/${w1}/advance"
              payload: { to_status: "OPEN" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1_v1: $.data.version }
            - call: "POST /bakery/orders"
              payload: { customer_id: "${cust_id}", offer_window_id: "${w1}", handoff_mode: "PICKUP_COUNTER" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
            - call: "POST /bakery/orders/${o1}/lines"
              payload: { menu_item_id: "${mi_cookie}", quantity: 13, expected_offer_window_version: "${w1_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_1: $.data.id }
            - call: "POST /bakery/orders/${o1}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bakery/payments"
              payload: { order_id: "${o1}", tip_mode: "FIXED", tip_fixed_cents: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { pay_1: $.data.id }
            - call: "POST /bakery/payments/${pay_1}/capture"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "GET /bakery/orders/${o1}"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
              captures: { o1_v: $.data.version }
          trigger:
            - call: "POST /bakery/payments/${pay_1}/refunds"
              payload: { amount_cents: 600, refund_reason: "stale view refund", expected_order_version: "${o1_v} - 1" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { err: $.data.error_id }
            - call: "POST /bakery/payments/${pay_1}/refunds"
              payload: { amount_cents: 600, refund_reason: "fresh view refund", expected_order_version: "${o1_v}" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mv: $.data.id, sub_leg: $.data.leg_subtotal_cents }
          assert:
            - "${err} == ERR_STALE_ORDER_VERSION with HTTP 412"
            - "${sub_leg} == 600 and MoneyMovement.${mv}.leg_tip_cents == 0"
            - "Payment.${pay_1}.refunded_cents == 600 and Order.${o1}.payment_status == PARTIALLY_REFUNDED"
            - "GET /bakery/money-movements with payment_id ${pay_1} returns exactly 1 movement"

      - name: recall_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.IngredientLot.CONSUMED_to_RECALLED
        excluded_because:
          difficulty_instance: transitive_cascade / recall_lot_depth_six_cascade_with_status_guarded_dead_leg
          rationale: "All six hops and the guarded dead leg are asserted there."

      - name: under_yield_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Batch.BAKED_to_UNDER_YIELD
        excluded_because:
          difficulty_instance: transitive_cascade / under_yield_shortfall_depth_four_cascade_from_yield_confirmation
          rationale: "All four hops plus the allocation order are asserted there."

      - name: capacity_threshold_trigger_at_eighty_percent
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.capacity_posture
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hold_occupancy_interval_is_right_open_so_expiry_frees_units
          rationale: "The CONSTRAINED boundary at exactly 16/20 == 0.80 and the fall back to OPEN_CAPACITY are asserted there."

  - section: consistency_model
    instances:
      - name: confirm_response_already_carries_every_recomputed_field
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.order_subtotal
          - calculations.order_tax_total
          - calculations.window_units_remaining
        distinguishing_aspect: "The consistency model is immediate: the single confirm response already carries subtotal_cents 4600, tax_total_cents 0 and order_status CONFIRMED, and a capacity read taken immediately afterwards already shows held_units 0 and confirmed_units 13 with no second write."
        test_recipe:
          setup:
            - "An ACTIVE baker, a LISTED cookie, an OPEN window and a PENDING_HOLD order of 13 cookies."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bakery/customers"
              payload: { baker_id: "${baker_id}", display_name: "Ada Byron", email: "ada@example.com", delivery_distance_km: 6.0 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Brown Butter Cookie" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_cookie: $.data.id }
            - call: "POST /bakery/recipes/${r_cookie}/components"
              payload: { component_name: "flour and butter", quantity_grams: 500, declared_allergens: ["wheat", "milk"] }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/recipes/${r_cookie}/publish"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/menu-items"
              payload: { baker_id: "${baker_id}", recipe_id: "${r_cookie}", name: "Brown Butter Cookie", product_class: "SHELF_STABLE", pricing_basis: "PER_DOZEN_BAKERS", unit_price_cents: 450, dozen_price_cents: 4600 }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { mi_cookie: $.data.id }
            - call: "POST /bakery/menu-items/${mi_cookie}/listing-status"
              payload: { to_status: "LISTED" }
              as: Baker
              as_user_id: "${baker_id}"
            - call: "POST /bakery/offer-windows"
              payload: { baker_id: "${baker_id}", label: "Wed 6 May", opens_at: "2026-05-04T00:00:00Z", order_cutoff_at: "2026-05-06T12:00:00Z", production_date: "2026-05-07T06:00:00Z", handoff_date: "2026-05-07T15:00:00Z", handoff_window_end_at: "2026-05-07T19:00:00Z" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1: $.data.id }
            - call: "POST /bakery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bakery/offer-windows/${w1}/advance"
              payload: { to_status: "OPEN" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { w1_v1: $.data.version }
            - call: "POST /bakery/orders"
              payload: { customer_id: "${cust_id}", offer_window_id: "${w1}", handoff_mode: "PICKUP_COUNTER" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { o1: $.data.id }
            - call: "POST /bakery/orders/${o1}/lines"
              payload: { menu_item_id: "${mi_cookie}", quantity: 13, expected_offer_window_version: "${w1_v1}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line_1: $.data.id }
          trigger:
            - call: "POST /bakery/orders/${o1}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st: $.data.order_status, sub: $.data.subtotal_cents, tax: $.data.tax_total_cents, fee: $.data.delivery_fee_cents, v: $.data.version }
            - call: "GET /bakery/offer-windows/${w1}/capacity"
              payload: {}
              as: Baker
              as_user_id: "${baker_id}"
              captures: { h: $.data.held_units, c: $.data.confirmed_units, u: $.data.units_remaining }
          assert:
            - "${st} == CONFIRMED and ${sub} == 4600 and ${tax} == 0 and ${fee} == 0"
            - "${v} >= 2, because the confirm mutated the order at least once"
            - "${h} == 0 and ${c} == 13 and ${u} == 227"
            - "Order.${o1}.hold_expires_at == null immediately after the confirm response"
            - "Baker.${baker_id}.annual_gross_sales_cents == 4600 in the same request cycle"

