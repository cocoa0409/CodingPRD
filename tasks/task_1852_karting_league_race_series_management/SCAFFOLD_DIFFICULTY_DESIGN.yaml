            - "SessionResult.${r_a}.points_awarded == 25 and EventEntry.${en_a}.event_points == 25 (pre-penalty values restored)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: penalty_reorders_results_points_standings
        grounds:
          - state_machines.Incident.UNDER_REVIEW_to_UPHELD
          - state_machines.SessionResult.PROVISIONAL_to_AMENDED
          - calculations.session_points
          - calculations.season_standings
        distinguishing_aspect: |
          Depth-3 cascade triggered by incident adjudication: adjudicate UPHELD
          mutates SessionResult (hop 1: penalty_seconds_applied + re-rank ->
          finish_position rewritten, status AMENDED); the result change itself
          triggers EventEntry.event_points recompute (hop 2); the entry total
          change triggers season standings re-rank (hop 3, observable via GET
          standings). Not a fan-out: each hop is caused by the previous one.
        test_recipe:
          setup:
            - "Scored MAIN session in an IN_PROGRESS event: A pos1 total 600000ms (25 pts), B pos2 total 61000... correction: B total 603000ms (22 pts)"
            - "Incident filed against A's entry by RaceDirector rd-1 and moved UNDER_REVIEW by Steward st-1"
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Cascade Cup", year: 2026, drop_rounds: 0, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "B", date_of_birth: "1991-01-01", body_weight_kg: 81.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_b: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_b}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_b}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_b: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_b}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_a}/inspections", payload: { measured_combined_weight_kg: 171.0 }, as: RaceDirector }
            - { call: "POST /karting/entries/${en_b}/inspections", payload: { measured_combined_weight_kg: 172.0 }, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/start", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/lock-grid", payload: {}, as: RaceDirector, captures: { e_v4: $.data.version } }
            - { call: "POST /karting/events/${e_id}/sessions", payload: { session_type: "MAIN", sequence: 1, expected_event_version: "${e_v4}" }, as: RaceDirector, captures: { sess: $.data.id, se_v1: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "OPEN" }, as: RaceDirector, captures: { se_v2: $.data.version } }
            - { call: "PATCH /karting/sessions/${sess}", payload: { status: "CLOSED" }, as: RaceDirector, captures: { se_v3: $.data.version } }
            - { call: "POST /karting/sessions/${sess}/results", payload: { results: [ { entry_id: "${en_a}", finish_position: 1, best_lap_ms: 45000, total_time_ms: 600000 }, { entry_id: "${en_b}", finish_position: 2, best_lap_ms: 45100, total_time_ms: 603000 } ], expected_session_version: "${se_v3}" }, as: RaceDirector, captures: { r_a: "$.data[0].id", r_b: "$.data[1].id" } }
            - { call: "POST /karting/sessions/${sess}/score", payload: {}, as: RaceDirector }
            - { call: "POST /karting/events/${e_id}/incidents", payload: { entry_id: "${en_a}", session_id: "${sess}", description: "Overtake under yellow" }, as: RaceDirector, as_user_id: "rd-1", captures: { inc: $.data.id } }
            - { call: "POST /karting/incidents/${inc}/open-review", payload: {}, as: Steward, as_user_id: "st-1" }
          trigger:
            - { call: "POST /karting/incidents/${inc}/adjudicate", payload: { decision: "UPHELD", penalty_kind: "TIME_SECONDS", penalty_seconds: 5 }, as: Steward, as_user_id: "st-1" }
          assert:
            - "hop 1: SessionResult.${r_a}.penalty_seconds_applied == 5; re-rank by effective_total_ms (A 605000 > B 603000) -> ${r_a}.finish_position == 2, ${r_b}.finish_position == 1; both status AMENDED"
            - "hop 2: points recomputed -> ${r_a}.points_awarded == 22, ${r_b}.points_awarded == 25; EventEntry.${en_a}.event_points == 22, EventEntry.${en_b}.event_points == 25"
            - "hop 3: GET standings (class ${cls_id}) now ranks driver ${d_b} (25) above ${d_a} (22) — order swapped without any direct standings write"
            - "session points total conserved: 22 + 25 == 47 (was 25 + 22 before the penalty)"

      - name: event_cancel_withdraws_entries_refunds_fees
        grounds:
          - state_machines.RaceEvent.IN_PROGRESS_to_CANCELLED
          - state_machines.EventEntry.ENTERED_to_WITHDRAWN
          - entities.LeagueSeason.fields.collected_fees_cents
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (event cancel, not incident
          adjudication): cancel mutates each non-terminal EventEntry to WITHDRAWN
          (hop 1); each withdrawal of a PAID entry itself flips fee_status to
          REFUNDED and recomputes LeagueSeason.collected_fees_cents (hop 2).
        test_recipe:
          setup:
            - "Season ACTIVE, event REGISTRATION_OPEN with two PAID entries (fee 5000 each); season collected_fees_cents == 10000"
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Rain Cup", year: 2026, drop_rounds: 0, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "B", date_of_birth: "1991-01-01", body_weight_kg: 81.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_b: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_b}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /karting/events/${e_id}/open-registration", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_a}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_a: $.data.id } }
            - { call: "POST /karting/events/${e_id}/entries", payload: { driver_id: "${d_b}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }, as: LeagueAdmin, captures: { en_b: $.data.id } }
            - { call: "POST /karting/entries/${en_a}/pay", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/entries/${en_b}/pay", payload: {}, as: LeagueAdmin }
          trigger:
            - { call: "POST /karting/events/${e_id}/cancel", payload: {}, as: LeagueAdmin }
            - { call: "GET /karting/seasons/${s_id}", payload: {}, as: LeagueAdmin }
          assert:
            - "hop 1: EventEntry.${en_a}.status == WITHDRAWN and EventEntry.${en_b}.status == WITHDRAWN"
            - "hop 2: both entries fee_status == REFUNDED"
            - "hop 2 derived field: LeagueSeason.${s_id}.collected_fees_cents == 0 (was 10000 before cancel)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: entry_closed_registration_shadows_class_mismatch
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_EVENT_REGISTRATION_CLOSED]
          - errors[ERR_CLASS_MISMATCH]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: one request violating both
          (event still SCHEDULED so registration closed, AND 10-year-old driver
          outside SENIOR 16-44) must return the state error
          ERR_EVENT_REGISTRATION_CLOSED, not ERR_CLASS_MISMATCH.
        test_recipe:
          setup:
            - "Season ACTIVE with SENIOR class (16-44); event created but registration never opened (status SCHEDULED)"
            - "Driver J ACTIVE but age 10 at event_date (born 2016-01-01, event 2026-09-05) — fails class eligibility"
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Priority Cup", year: 2026, drop_rounds: 0, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "Junior", date_of_birth: "2016-01-01", body_weight_kg: 40.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_j: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_j}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
          trigger:
            - call: "POST /karting/events/${e_id}/entries"
              payload: { driver_id: "${d_j}", class_id: "${cls_id}", entry_type: "OWNER_DRIVER" }
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with error_id == ERR_EVENT_REGISTRATION_CLOSED (state, priority 6)"
            - "ERR_CLASS_MISMATCH (business_safety, priority 7) is shadowed even though the driver is also age-ineligible"

      - name: booking_overlap_shadows_track_capacity
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_BOOKING_OVERLAP]
          - errors[ERR_TRACK_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_constraint (different
          pair than state-vs-safety): a booking whose kart is already booked in an
          overlapping window (temporal) AND whose window already holds
          TRACK_CAPACITY_KARTS bookings (aggregate constraint) must return
          ERR_BOOKING_OVERLAP, not ERR_TRACK_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Karts K1..K4 AVAILABLE; drivers D1..D4 ACTIVE; four bookings RESERVED on K1..K4, all window 10:00-11:00 (track at capacity 4)"
            - "Driver D5 books K1 for 10:30-11:30: violates kart overlap AND aggregate capacity"
          setup_api_calls:
            - { call: "POST /karting/karts", payload: { fleet_number: "K-1", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_1: $.data.id } }
            - { call: "POST /karting/karts", payload: { fleet_number: "K-2", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_2: $.data.id } }
            - { call: "POST /karting/karts", payload: { fleet_number: "K-3", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_3: $.data.id } }
            - { call: "POST /karting/karts", payload: { fleet_number: "K-4", eligible_class_codes: ["SENIOR"] }, as: LeagueAdmin, captures: { k_4: $.data.id } }
            - { call: "POST /karting/drivers", payload: { full_name: "D1", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_1: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_1}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "D2", date_of_birth: "1990-01-02", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_2: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_2}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "D3", date_of_birth: "1990-01-03", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_3: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_3}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "D4", date_of_birth: "1990-01-04", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_4: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_4}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "D5", date_of_birth: "1990-01-05", body_weight_kg: 80.0, license_type: "RENTAL" }, as: LeagueAdmin, captures: { d_5: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_5}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_1}", kart_id: "${k_1}", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_1}" }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_2}", kart_id: "${k_2}", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_2}" }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_3}", kart_id: "${k_3}", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_3}" }
            - { call: "POST /karting/practice-bookings", payload: { driver_id: "${d_4}", kart_id: "${k_4}", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T11:00:00Z", pricing_mode: "FLAT" }, as: Driver, as_user_id: "${d_4}" }
          trigger:
            - call: "POST /karting/practice-bookings"
              payload: { driver_id: "${d_5}", kart_id: "${k_1}", start_time: "2026-09-01T10:30:00Z", end_time: "2026-09-01T11:30:00Z", pricing_mode: "FLAT" }
              as: Driver
              as_user_id: "${d_5}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger rejected with error_id == ERR_BOOKING_OVERLAP (business_temporal, priority 8)"
            - "ERR_TRACK_CAPACITY_EXCEEDED (business_constraint, priority 9) is shadowed even though 4 bookings already intersect the window"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: weight_exact_minimum_passes
        grounds:
          - calculations.weight_compliance
          - entities.TechInspection.fields.outcome
        distinguishing_aspect: |
          Metric = combined weight kg at the class minimum: measured exactly 170.0
          against min 170.0 must PASS (>= boundary, not >); reached via
          POST /karting/entries/{id}/inspections.
        test_recipe:
          setup:
            - "Season ACTIVE, SENIOR class min_combined_weight_kg 170.0; event REGISTRATION_OPEN; entry E for driver A"
          setup_api_calls:
            - { call: "POST /karting/seasons", payload: { name: "Scale Cup", year: 2026, drop_rounds: 0, points_scheme: [25, 22, 20], fastest_lap_bonus_points: 0 }, as: LeagueAdmin, captures: { s_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/classes", payload: { code: "SENIOR", min_age: 16, max_age: 44, min_combined_weight_kg: 170.0, entry_fee_cents: 5000, rental_kart_allowed: true }, as: LeagueAdmin, captures: { cls_id: $.data.id } }
            - { call: "POST /karting/seasons/${s_id}/activate", payload: {}, as: LeagueAdmin }
            - { call: "POST /karting/drivers", payload: { full_name: "A", date_of_birth: "1990-01-01", body_weight_kg: 80.0, license_type: "OWNER" }, as: LeagueAdmin, captures: { d_a: $.data.id } }
            - { call: "PATCH /karting/drivers/${d_a}", payload: { status: "ACTIVE" }, as: LeagueAdmin }
            - { call: "POST /karting/seasons/${s_id}/events", payload: { round_number: 1, event_date: "2026-09-05T00:00:00Z", track_name: "Club Circuit" }, as: LeagueAdmin, captures: { e_id: $.data.id } }
