      - name: restricted_entry_count_conserved_through_deal_cycle
        grounds:
          - state_machines.Deal.INTAKE_to_ACTIVE
          - state_machines.Deal.ACTIVE_to_CLOSED
          - state_machines.RestrictedListEntry.ACTIVE_to_REMOVED
        distinguishing_aspect: |
          Conserved quantity = count of ACTIVE RestrictedListEntry rows for a ticker: a
          MANUAL entry holds the count at 1, deal activation raises it to 2 (forward action),
          and deal close removes exactly the deal-sourced entry (compensating action),
          returning the count to 1. Different conserved quantity (row count) than
          approval_quantity_conserved_through_match_and_void (share balance).
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; MANUAL ACTIVE entry for ACME exists (count 1)"
            - "Deal PROJECTORCA (ticker ACME, no event window) in INTAKE"
