      - name: upheld_protest_cascade_through_placements_points_titles_and_filing
        grounds:
          - state_machines.Protest.UNDER_REVIEW_to_UPHELD
          - state_machines.Entry.JUDGED_to_DISQUALIFIED
          - calculations.championship_points_award
          - calculations.title_recording
          - state_machines.RegistryFiling.ACCEPTED_to_PENDING
          - state_machines.Show.RESULTS_FILED_to_COMPLETED
        distinguishing_aspect: |
            Depth-4 cascade whose links are all RESULT-shaped, and it runs BACKWARDS through work already
            filed with the registry: upholding a protest disqualifies the class winner (link 1), which vacates
            placement 1 and re-runs the points award over a divisor that just shrank from 5 dogs to 4, dropping
            the winner's award from 2 points to 1 (link 2), which rewrites two different dogs' rollups and the
            show total (link 3), which reopens an ACCEPTED RegistryFiling and pulls the Show back out of
            RESULTS_FILED (link 4). Unlike the schedule cascade, every link here rewrites an already-frozen
            result, so an implementation that decrements instead of recomputing from scratch drifts.

