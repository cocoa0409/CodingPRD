          - entities.Visit.fields.window_start_min
          - entities.Route.fields.booked_minutes
        distinguishing_aspect: "Interval semantics A: half-open [start,end) minute windows on a single Route; [600,720) truly overlaps an existing [540,660) (600 < 660) and is rejected with ERR_VISIT_WINDOW_OVERLAP. Resource: Route."
