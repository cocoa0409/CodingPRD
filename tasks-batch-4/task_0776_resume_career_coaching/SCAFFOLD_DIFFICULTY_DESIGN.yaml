          assert:
            - "the booking response error_id == ERR_ORDER_NOT_IN_PRODUCTION"
            - "the booking response error_id != ERR_COACH_SLOT_CONFLICT"

      - name: referential_beats_fiscal_on_booking
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_COACH_INACTIVE]
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[session-book-stale-order]
        distinguishing_aspect: |
          Same POST /orders/{id}/sessions request targets an INACTIVE coach (referential,
          priority 7) while carrying a stale expected_order_version (fiscal OCC, priority 11);
          ERR_COACH_INACTIVE wins over ERR_STALE_VERSION. Pair (business_referential, business_fiscal).
        test_recipe:
