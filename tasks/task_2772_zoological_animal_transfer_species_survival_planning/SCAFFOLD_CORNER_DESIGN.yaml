            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id, m1_v1: $.data.version }
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "HOLD", subject_animal_id: "${m1_id}", analysis_mode: "PEDIGREE_ONLY", priority_rank: 1, expires_on: "2026-08-05", expected_subject_animal_version: "${m1_v1}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:00Z" }
              as: AccreditationAdmin
          trigger:
            - call: "POST /population-recommendations/${rec_id}/endorse"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "Response status is 422 and data.error_id == 'ERR_RECOMMENDATION_EXPIRED'"
            - "PopulationRecommendation.${rec_id}.status == EXPIRED, persisted despite the rejection"
            - "Animal.${m1_id}.pending_recommendation_id == null"
            - "SpeciesProgram.${program_id}.open_recommendation_count == 0"
            - "SpeciesProgram.${program_id}.plan_status == CYCLE_CLOSED and cycle_closed_on == 2026-08-06T09:00:00Z, because the last open recommendation left the open set"

      - name: negotiation_can_loop_between_the_parties_until_the_round_cap
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines[TransferAgreement].transitions[COUNTERED->OFFERED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / agreement_offer_counter_cycle_hits_round_cap
          rationale: "That instance walks the OFFERED -> COUNTERED -> OFFERED loop to round_number 4 and shows the fifth turn refused with ERR_NEGOTIATION_ROUND_LIMIT while accept still succeeds, which is the full cyclic-shape claim including its termination condition."
      - name: protocol_stage_can_regress_and_readvance
        claim_type: cyclic
        grounds:
          - state_machines[IntroductionProtocol]
          - calculations.introduction_aggression_accumulator
        excluded_because:
          difficulty_instance: non_linear_state_machine / introduction_protocol_regresses_then_readvances
          rationale: "That instance drives VISUAL_CONTACT -> PARTIAL_CONTACT -> VISUAL_CONTACT -> PARTIAL_CONTACT -> FULL_CONTACT and pins the regression counter, so the second cyclic machine's loop and its MAX_REGRESSIONS termination are already asserted."
      - name: execute_cascade_reaches_the_program_state
        claim_type: cascade_down
        grounds:
          - state_machines[TransferAgreement].transitions[ACCEPTED->EXECUTED].side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / execute_cascade_four_links_to_cycle_closed
          rationale: "That instance asserts all four links of the execute cascade end to end (animal HELD -> RESERVED, recommendation ENDORSED -> FULFILLED, open_recommendation_count recompute, program PUBLISHED -> CYCLE_CLOSED)."
      - name: abort_cascade_reaches_the_program_state
        claim_type: conditional_cascade
        grounds:
          - state_machines[IntroductionProtocol].transitions[PARTIAL_CONTACT->ABORTED].side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / introduction_abort_cascade_four_links_to_cycle_closed
          rationale: "That instance shows the abort cascade declining only the BREED_WITH recommendations that are still in the open set while the already FULFILLED one is untouched, which is the conditional-cascade claim."
      - name: termination_reverses_every_slot_side_effect
        claim_type: compensation
        grounds:
          - state_machines[TransferAgreement].transitions[EXECUTED->TERMINATED].side_effects
        excluded_because:
          difficulty_instance: compensating_invariant / slot_conservation_across_execute_and_terminate
          rationale: "That instance reconciles occupied_slots and reserved_slots at both institutions before execute, after execute and after terminate, proving the compensation leaves no drift."
      - name: ledger_balances_reconcile_after_termination
        claim_type: ledger_sync
        grounds:
          - state_machines[TransferAgreement].transitions[ACCEPTED->EXECUTED].side_effects
          - entities.Institution.fields.transfer_credit_balance
        excluded_because:
          difficulty_instance: compensating_invariant / credit_ledger_zero_sum_across_execute_and_terminate
          rationale: "That instance pins the double-entry posting at execute and its exact reversal at terminate, including the final-variant delta, so the ancestor ledger field is reconciled before and after."

  - section: calculations
    instances:
      - name: crate_training_currency_takes_the_latest_date_not_the_latest_write
        claim_type: chronological
        grounds:
          - calculations.crate_training_currency
          - entities.Animal.fields.last_crate_session_on
          - endpoints[POST /animals/{animalId}/crate-training-sessions]
        distinguishing_aspect: "Three sessions are recorded out of chronological order (07-28, then 07-20, then 07-24): the count reaches 3 and last_crate_session_on settles on the maximum session_date 2026-07-28 rather than on the most recently created row 2026-07-24."
        test_recipe:
          setup: ["Cedar Ridge Zoo, a species program and M1 exist. Clock at its 2026-08-01T00:00:00Z default."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /animals/${m1_id}/crate-training-sessions"
              payload: { session_date: "2026-07-28", trainer_name: "T Rios", duration_minutes: 20 }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /animals/${m1_id}/crate-training-sessions"
              payload: { session_date: "2026-07-20", trainer_name: "T Rios", duration_minutes: 15 }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /animals/${m1_id}/crate-training-sessions"
              payload: { session_date: "2026-07-24", trainer_name: "M Okafor", duration_minutes: 35 }
              as: Registrar
              as_user_id: "${sender_id}"
          assert:
            - "After the first call: crate_training_sessions_count == 1 and last_crate_session_on == 2026-07-28"
            - "After the second call: crate_training_sessions_count == 2 and last_crate_session_on is still 2026-07-28"
            - "After the third call: crate_training_sessions_count == 3 and last_crate_session_on == 2026-07-28"
            - "Animal.${m1_id}.version == 4 (creation plus three sessions)"
            - "GET /animals/${m1_id} reports the same values as the last session response"

      - name: holding_slot_occupancy_counts_held_animals_per_holder
        claim_type: aggregation
        grounds:
          - calculations.holding_slot_occupancy
          - entities.Institution.fields.occupied_slots
          - entities.Institution.fields.reserved_slots
        distinguishing_aspect: "With no agreement anywhere in the system, occupied_slots equals the number of HELD animals at each holder (2 at Cedar Ridge, 1 at Harbor Bay) and reserved_slots stays 0 at both, so the SLOT_CONSERVATION sum equals the 3 non-DISPOSED animals."
        test_recipe:
          setup: ["Empty database, then two institutions and three animals are accessioned."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Harbor Bay Zoo", jurisdiction_code: "US-TX", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
          trigger:
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-102", sex: "FEMALE", birth_date: "2019-09-01", founder_representation_pct: 22.00 }
              as: Registrar
              as_user_id: "${sender_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${receiver_id}", owning_institution_id: "${receiver_id}", local_id: "HB-201", sex: "FEMALE", birth_date: "2020-03-15", founder_representation_pct: 30.00 }
              as: Registrar
              as_user_id: "${receiver_id}"
          assert:
            - "Institution.${sender_id}.occupied_slots == 2 and reserved_slots == 0"
            - "Institution.${receiver_id}.occupied_slots == 1 and reserved_slots == 0"
            - "Institution.${sender_id}.holding_capacity_slots is still 40, so capacity is not consumed by the counters"
            - "occupied_slots + reserved_slots summed over both institutions == 3, the number of non-DISPOSED animals"

      - name: transfer_scope_derives_intra_jurisdiction_for_two_same_state_parties
        claim_type: correct_result
        grounds:
          - calculations.transfer_scope_derivation
          - entities.TransferAgreement.fields.transfer_scope
          - endpoints[POST /transfer-agreements]
        distinguishing_aspect: "Two institutions both coded US-CA produce transfer_scope INTRA_JURISDICTION, not INTERSTATE, because the derivation compares the full jurisdiction_code before it compares the two-letter country prefix; the INTRA_JURISDICTION document panel is empty."
        test_recipe:
          setup: ["Cedar Ridge Zoo (US-CA) and Bayside Aquarium (US-CA), a PUBLISHED program, M1 at Cedar Ridge, F1 at Bayside, and an ENDORSED BREED_WITH recommendation for M1."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Cedar Ridge Zoo", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { sender_id: $.data.id }
            - call: "POST /institutions"
              payload: { name: "Bayside Aquarium", jurisdiction_code: "US-CA", accreditation_status: "ACCREDITED", accreditation_expires_on: "2028-12-31", holding_capacity_slots: 40, disposition_policy_on_file: true }
              as: AccreditationAdmin
              captures: { local_receiver_id: $.data.id }
            - call: "POST /species-programs"
              payload: { taxon_name: "Panthera uncia", program_type: "SSP_RED", target_population_size: 300, studbook_keeper_name: "K. Ahlgren" }
              as: AccreditationAdmin
              captures: { program_id: $.data.id }
            - call: "POST /species-programs/${program_id}/publish-plan"
              payload: {}
              as: ProgramCoordinator
              as_user_id: "${program_id}"
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${sender_id}", owning_institution_id: "${sender_id}", local_id: "CR-101", sex: "MALE", birth_date: "2019-05-10", founder_representation_pct: 12.45 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { m1_id: $.data.id, m1_v1: $.data.version }
            - call: "POST /animals"
              payload: { species_program_id: "${program_id}", holding_institution_id: "${local_receiver_id}", owning_institution_id: "${local_receiver_id}", local_id: "BA-201", sex: "FEMALE", birth_date: "2020-03-15", founder_representation_pct: 30.00 }
              as: Registrar
              as_user_id: "${local_receiver_id}"
              captures: { f1_id: $.data.id }
            - call: "POST /population-recommendations"
              payload: { species_program_id: "${program_id}", recommendation_type: "BREED_WITH", subject_animal_id: "${m1_id}", paired_animal_id: "${f1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${local_receiver_id}", analysis_mode: "PEDIGREE_ONLY", priority_rank: 1, expires_on: "2026-12-31", expected_subject_animal_version: "${m1_v1}" }
              as: ProgramCoordinator
              as_user_id: "${program_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /population-recommendations/${rec_id}/endorse"
              payload: {}
              as: Registrar
              as_user_id: "${sender_id}"
          trigger:
            - call: "POST /transfer-agreements"
              payload: { recommendation_id: "${rec_id}", animal_id: "${m1_id}", sending_institution_id: "${sender_id}", receiving_institution_id: "${local_receiver_id}", ownership_disposition: "BREEDING_LOAN", offspring_disposition_rule: "SENDER_RETAINS", breeding_rights: "FULL", transport_cost_share_pct: 0.0 }
              as: Registrar
              as_user_id: "${sender_id}"
              captures: { ta_id: $.data.id }
          assert:
            - "Response status is 201"
            - "TransferAgreement.${ta_id}.transfer_scope == INTRA_JURISDICTION"
            - "TransferAgreement.${ta_id}.status == DRAFT and round_number == 0"
            - "GET /transfer-agreements?transfer_scope=INTRA_JURISDICTION returns total_count == 1"
            - "GET /transfer-agreements?transfer_scope=INTERSTATE returns total_count == 0"

      - name: kinship_verdict_differs_between_analysis_modes
        claim_type: variant_divergence
        grounds:
          - calculations.kinship_and_pairing_verdict.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / pedigree_only_vs_molecular_projected_inbreeding
          rationale: "That instance runs the identical pedigree on both PEDIGREE_ONLY and MOLECULAR_ASSISTED and pins the two different projected_offspring_inbreeding values and the resulting verdicts, including the delta the molecular weight introduces."
      - name: kinship_threshold_boundary_is_inclusive
        claim_type: threshold
        grounds:
          - calculations.kinship_and_pairing_verdict.constants.MAX_OFFSPRING_INBREEDING
        excluded_because:
          difficulty_instance: boundary_precision_check / molecular_inbreeding_exact_limit_blocks_endorsement
          rationale: "That instance tests the value exactly at MAX_OFFSPRING_INBREEDING and one representable step below it, which is the threshold / threshold-minus-one pair for this calculation."
      - name: demographic_need_index_weights_sum_correctly
        claim_type: weighted_scoring
        grounds:
          - calculations.demographic_need_index
        excluded_because:
          difficulty_instance: combinatorial_formula / demographic_need_index_nonlinear_program_weighted_composite
          rationale: "That instance pins the composite index and its 0-100 score for two program types whose PROGRAM_WEIGHT differs, proving the weights are applied without drift."
      - name: credit_valuation_variant_is_chosen_by_lifecycle_stage
        claim_type: variant_selection
        grounds:
          - calculations.transfer_credit_valuation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / provisional_vs_final_transfer_credit_points
          rationale: "That instance shows provisional_at_execution running at execute and final_at_delivery running at deliver on the same agreement, with both stored values asserted as literals."
      - name: credit_ledger_absorbs_the_provisional_to_final_delta
        claim_type: reconciliation
        grounds:
          - calculations.transfer_credit_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / credit_ledger_zero_sum_across_execute_and_terminate
          rationale: "That instance follows both institutions' transfer_credit_balance across execute, deliver and terminate, so the variant-switch delta and its reversal are both reconciled."
      - name: credit_component_rounding_does_not_drift
        claim_type: precision
        grounds:
          - calculations.transfer_credit_valuation.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / credit_component_rounding_order_pinned_round_then_sum
          rationale: "That instance contrasts round-then-sum with sum-then-round on the same inputs and pins the one-cent difference, which is the precision claim for this formula."
      - name: studbook_surcharge_tier_boundaries
        claim_type: tiered_pricing
        grounds:
          - calculations.studbook_lateness_assessment
        excluded_because:
          difficulty_instance: combinatorial_formula / studbook_surcharge_tier_keyed_on_base_points_only
          rationale: "That instance walks the surcharge tiers at their exact boundaries and shows the tier keyed on base points rather than on the surcharged total."
      - name: thermal_excursion_window_is_order_independent
        claim_type: chronological
        grounds:
          - calculations.thermal_excursion_window
        excluded_because:
          difficulty_instance: boundary_precision_check / thermal_excursion_exact_max_and_inclusive_clearance_day
          rationale: "That instance pins the excursion minute total at exactly MAX_EXCURSION_MINUTES and one sample beyond it, which exercises the chronological sample walk and its threshold together."
      - name: quarantine_room_intervals_merge_and_abut
        claim_type: interval_merge
        grounds:
          - calculations.quarantine_room_availability
        excluded_because:
          difficulty_instance: resource_temporal_overlap / quarantine_room_half_open_window_with_phase_conditional_buffer
          rationale: "That instance probes an abutting window, a one-day overlap and the phase-conditional sanitation buffer on the same room, covering merged, adjacent and disjoint cases."
      - name: carrier_capacity_aggregates_over_the_overlap_set
        claim_type: aggregation
        grounds:
          - calculations.carrier_overlap_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / carrier_closed_interval_aggregate_capacity_at_one_second
          rationale: "That instance shows two individually legal bookings and a third that pushes the aggregate over CARRIER_OVERLAP_LIMIT by a single second of overlap."
      - name: quarantine_minimum_days_threshold
        claim_type: threshold
        grounds:
          - calculations.quarantine_requirement
        excluded_because:
          difficulty_instance: boundary_precision_check / thermal_excursion_exact_max_and_inclusive_clearance_day
          rationale: "That instance attempts the clear on day 29 (refused with ERR_QUARANTINE_MINIMUM_NOT_MET) and on day 30 (accepted), which is the threshold-minus-one / threshold pair for QUARANTINE_MIN_DAYS_STANDARD."
      - name: certificate_validity_window_is_derived_from_exam_date
        claim_type: correct_result
        grounds:
          - calculations.document_validity_window
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / certificate_issue_gated_on_signing_vet_license_state
          rationale: "That instance asserts valid_until == 2026-09-19 for exam_date 2026-08-20 on the issued certificate while the refused sibling keeps valid_until null, so the window formula and its non-application are both pinned."
      - name: aggression_accumulator_is_windowed
        claim_type: chronological
        grounds:
          - calculations.introduction_aggression_accumulator
        excluded_because:
          difficulty_instance: non_linear_state_machine / introduction_protocol_regresses_then_readvances
          rationale: "That instance records observations in date order across stages and pins the accumulator at the AGGRESSION_REGRESSION_THRESHOLD boundary and after each stage reset."
      - name: program_rollup_recomputes_rather_than_increments
        claim_type: aggregation
        grounds:
          - calculations.program_recommendation_rollup
        excluded_because:
          difficulty_instance: transitive_cascade / execute_cascade_four_links_to_cycle_closed
          rationale: "That instance asserts open_recommendation_count before and after the cascade and the program's CYCLE_CLOSED flip that depends on the recomputed value."

  - section: validations
    instances:
      - name: duplicate_local_id_at_same_holder_returns_duplicate_animal_local_id
