scaffold_difficulty_design:
  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: sla_deadline_wall_vs_business_clock
        grounds:
          - calculations.sla_deadline_calculation
          - entities.SlaPolicy.fields.clock_mode
          - entities.Ticket.fields.resolution_due_at
        distinguishing_aspect: |
          Ticket/SLA domain: identical creation instant (2026-08-01T00:00:00Z, a
          Saturday) and identical base minutes (60/240) produce different due
          timestamps purely from the SlaPolicy.clock_mode variant — WALL_CLOCK
          yields 2026-08-01T04:00:00Z, BUSINESS_HOURS skips the weekend and
          yields 2026-08-03T13:00:00Z.
        test_recipe:
          setup:
            - "team T; categories C_WALL and C_BIZ both routed to T; P3 SLA policies with first_response 60 / resolution 240, clock_mode WALL_CLOCK for C_WALL and BUSINESS_HOURS for C_BIZ"
            - "employee E; logical clock at the startup default 2026-08-01T00:00:00Z (Saturday)"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Tier2 Support" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "BEN-W", name: "Benefits Wall", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { c_wall: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "BEN-B", name: "Benefits Biz", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { c_biz: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${c_wall}", priority: "P3", first_response_minutes: 60, resolution_minutes: 240, clock_mode: "WALL_CLOCK" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${c_biz}", priority: "P3", first_response_minutes: 60, resolution_minutes: 240, clock_mode: "BUSINESS_HOURS" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E100", full_name: "Wanda Wall", email: "wanda@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${c_wall}", subject: "wall ticket", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_wall: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${c_biz}", subject: "biz ticket", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_biz: $.data.id } }
          assert:
            - "Ticket.${t_wall}.first_response_due_at == 2026-08-01T01:00:00Z"
            - "Ticket.${t_wall}.resolution_due_at == 2026-08-01T04:00:00Z"
            - "Ticket.${t_biz}.first_response_due_at == 2026-08-03T10:00:00Z"
            - "Ticket.${t_biz}.resolution_due_at == 2026-08-03T13:00:00Z"
            - "Ticket.${t_wall}.resolution_due_at != Ticket.${t_biz}.resolution_due_at"
      - name: csat_simple_vs_recency_weighted
        grounds:
          - calculations.csat_rolling_calculation
          - entities.Agent.fields.rolling_csat
          - entities.SurveyResponse.fields.agent_id
        distinguishing_aspect: |
          Survey/Agent domain (distinct from the Ticket/SLA domain of the
          sibling instance): the same three submitted scores 5,4,2 at ages
          0,7,28 days yield simple_mean 3.67 but recency_weighted_mean 4.26 —
          two valid aggregations, different numbers, both exposed.
        test_recipe:
          setup:
            - "T1 agent A; category CAT with WALL_CLOCK P3 policy (480/480); employee E"
            - "ticket1 created+assigned to A+resolved at 2026-08-01, its survey submitted with score 2"
            - "clock at 2026-08-22: ticket2 created+assigned to A+resolved, survey submitted with score 4"
            - "clock at 2026-08-29: ticket3 created+assigned to A+resolved, survey submitted with score 5"
            - "at read time (2026-08-29) submission ages are 28, 7, 0 days"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "CSAT Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Agent A", email: "a@x.com", tier: "T1", team_id: "${tm_id}", capacity_max: 10 }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "PAY", name: "Payroll", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E200", full_name: "Sara Survey", email: "sara@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            # day 0: ticket1 -> resolve -> survey score 2
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t1", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t1: $.data.id, t1_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t1}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t1_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t1}/resolve", payload: { resolution_summary: "done1" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t1}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s1: "$.data[0].id" } }
            - { call: "POST /hr-helpdesk/surveys/${s1}/submit", payload: { score: 2 }, as: Employee, as_user_id: "${emp_id}" }
            # day 21
            - { call: "POST /hr-helpdesk/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T00:00:00Z" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t2", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t2: $.data.id, t2_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t2}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t2_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t2}/resolve", payload: { resolution_summary: "done2" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t2}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s2: "$.data[0].id" } }
            - { call: "POST /hr-helpdesk/surveys/${s2}/submit", payload: { score: 4 }, as: Employee, as_user_id: "${emp_id}" }
            # day 28
            - { call: "POST /hr-helpdesk/_clock/set_current_utc", payload: { to_iso8601: "2026-08-29T00:00:00Z" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t3", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t3: $.data.id, t3_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t3}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t3_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t3}/resolve", payload: { resolution_summary: "done3" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t3}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s3: "$.data[0].id" } }
            - { call: "POST /hr-helpdesk/surveys/${s3}/submit", payload: { score: 5 }, as: Employee, as_user_id: "${emp_id}" }
          trigger:
            - { call: "GET /hr-helpdesk/metrics/csat", payload: { agent_id: "${ag_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "$.data.survey_count == 3"
            - "$.data.simple_mean == 3.67"
            - "$.data.recency_weighted_mean == 4.26"
            - "$.data.simple_mean != $.data.recency_weighted_mean"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: staffing_coverage_min_ratio_multitier
        grounds:
          - calculations.staffing_coverage_posture
          - entities.StaffingWindow.fields.coverage_posture
        distinguishing_aspect: |
          Mode (a) multi-input non-linear: 4 inputs (covered_t1, covered_t2,
          required_t1, required_t2) interact through an inner per-tier ratio
          with a zero-guard branch and an outer MIN over tiers feeding a
          two-threshold branch — overall = min(36/40, 8/10) = 0.8 < 0.90, so
          the weakest tier (T2), not the average, drives UNDER_STAFFED.
        test_recipe:
          setup:
            - "team T; T1 agent A1 and T2 agent A2 on T; window W 2026-08-03T00:00:00Z..2026-08-08T00:00:00Z requiring 40 T1-hours and 10 T2-hours"
            - "A1 has four SCHEDULED 9h shifts (2026-08-03..06, 09:00-18:00 = 36h); A2 has two SCHEDULED 4h shifts (2026-08-03..04, 09:00-13:00 = 8h)"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Staffing Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "T1 Agent", email: "t1@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { a1: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "T2 Agent", email: "t2@x.com", tier: "T2", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { a2: $.data.id } }
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm_id}", name: "OE Week", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-08T00:00:00Z", required_t1_hours: 40, required_t2_hours: 10 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { w_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${a1}", staffing_window_id: "${w_id}", shift_start: "2026-08-03T09:00:00Z", shift_end: "2026-08-03T18:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1" }
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${a1}", staffing_window_id: "${w_id}", shift_start: "2026-08-04T09:00:00Z", shift_end: "2026-08-04T18:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1" }
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${a1}", staffing_window_id: "${w_id}", shift_start: "2026-08-05T09:00:00Z", shift_end: "2026-08-05T18:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1" }
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${a1}", staffing_window_id: "${w_id}", shift_start: "2026-08-06T09:00:00Z", shift_end: "2026-08-06T18:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1" }
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${a2}", staffing_window_id: "${w_id}", shift_start: "2026-08-03T09:00:00Z", shift_end: "2026-08-03T13:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1" }
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${a2}", staffing_window_id: "${w_id}", shift_start: "2026-08-04T09:00:00Z", shift_end: "2026-08-04T13:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1" }
          trigger:
            - { call: "GET /hr-helpdesk/staffing-windows/${w_id}", as: WorkforcePlanner, as_user_id: "planner-1" }
          assert:
            - "$.data.covered_t1_hours == 36.0"
            - "$.data.covered_t2_hours == 8.0"
            - "$.data.coverage_posture == UNDER_STAFFED   # min(0.9, 0.8) = 0.8 < 0.90"
      - name: csat_rounding_order_pinned
        grounds:
          - calculations.csat_rolling_calculation
          - entities.SurveyResponse.fields.score
        distinguishing_aspect: |
          Mode (b) nested rounding (distinct mode from the sibling instance):
          the pinned order rounds each score*weight term to 2dp BEFORE summing;
          scores 1,1,2 at ages 0,0,12 days give 1.21 under the pinned order
          versus 1.22 when summing unrounded products then rounding once —
          the implementation must follow the pinned order to land on 1.21.
        test_recipe:
          setup:
            - "T1 agent A; category CAT with WALL_CLOCK P3 policy; employee E"
            - "ticket1 resolved by A at 2026-08-01 and its survey submitted with score 2"
            - "clock advanced to 2026-08-13T00:00:00Z; ticket2 and ticket3 resolved by A, surveys submitted with scores 1 and 1"
            - "at read time ages are 12, 0, 0 days -> weights 0.552077, 1.000000, 1.000000; terms 1.10, 1.00, 1.00"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Round Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Agent R", email: "r@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "HRIS", name: "HRIS Access", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E300", full_name: "Ron Round", email: "ron@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t1", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t1: $.data.id, t1_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t1}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t1_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t1}/resolve", payload: { resolution_summary: "done1" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t1}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s1: "$.data[0].id" } }
            - { call: "POST /hr-helpdesk/surveys/${s1}/submit", payload: { score: 2 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /hr-helpdesk/_clock/set_current_utc", payload: { to_iso8601: "2026-08-13T00:00:00Z" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t2", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t2: $.data.id, t2_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t2}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t2_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t2}/resolve", payload: { resolution_summary: "done2" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t2}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s2: "$.data[0].id" } }
            - { call: "POST /hr-helpdesk/surveys/${s2}/submit", payload: { score: 1 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t3", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t3: $.data.id, t3_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t3}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t3_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t3}/resolve", payload: { resolution_summary: "done3" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t3}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s3: "$.data[0].id" } }
            - { call: "POST /hr-helpdesk/surveys/${s3}/submit", payload: { score: 1 }, as: Employee, as_user_id: "${emp_id}" }
          trigger:
            - { call: "GET /hr-helpdesk/metrics/csat", payload: { agent_id: "${ag_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "$.data.recency_weighted_mean == 1.21   # NOT 1.22 (sum-then-round order)"
            - "$.data.simple_mean == 1.33"
            - "$.data.survey_count == 3"
            - "Agent.${ag_id}.coaching_hold == true   # 1.21 < 3.00 with >= 3 surveys"

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_reopen_cycle_sla_reanchor
        grounds:
          - state_machines.Ticket.workflow_status.RESOLVED_to_REOPENED
          - state_machines.Ticket.workflow_status.REOPENED_to_RESOLVED
          - calculations.sla_deadline_calculation
        distinguishing_aspect: |
          Cyclic machine on Ticket: RESOLVED -> REOPENED -> RESOLVED is a true
          loop (not a pipeline); the second pass re-anchors resolution_due_at
          from the reopen instant (10:00 + 480min = 18:00) while reopen_count
          accumulates and exactly one SurveyResponse exists per ticket.
        test_recipe:
          setup:
            - "category CAT with WALL_CLOCK P3 policy (480/480); T1 agent A; employee E; clock default 2026-08-01T00:00:00Z"
            - "ticket created, assigned to A, resolved at 00:00 (MET); clock then advanced to 2026-08-01T10:00:00Z"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Cycle Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Agent C", email: "c@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "CYC", name: "Cycle Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E400", full_name: "Rey Open", email: "rey@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "cyc", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/resolve", payload: { resolution_summary: "first fix" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: HRServicesAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/reopen", payload: { reason: "still broken" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/resolve", payload: { resolution_summary: "second fix" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t_id}" }, as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "Ticket.${t_id}.workflow_status == RESOLVED after the REOPENED loop"
            - "Ticket.${t_id}.reopen_count == 1"
            - "Ticket.${t_id}.resolution_due_at == 2026-08-01T18:00:00Z  (re-anchored at reopen)"
            - "Ticket.${t_id}.sla_status == MET  (second resolution at 10:00 <= 18:00)"
            - "GET /hr-helpdesk/surveys?ticket_id=${t_id} total_count == 1  (no second survey issued)"
      - name: dcr_parallel_dimensions_fraud_retry_cycle
        grounds:
          - state_machines.DataChangeRequest.approval_status
          - state_machines.DataChangeRequest.fraud_status
          - entities.DataChangeRequest.fields.fraud_status
        distinguishing_aspect: |
          Parallel state dimensions on DataChangeRequest (approval_status x
          fraud_status on one row, evolving independently): a failed
          verification moves ONLY fraud_status PENDING->FAILED while
          approval_status stays PENDING_VERIFICATION; the fraud dimension then
          cycles FAILED->VERIFIED on retry and drags approval_status forward.
        test_recipe:
          setup:
            - "employee E (ACTIVE, version 1); no prior fraud failures, but DIRECT_DEPOSIT always requires verification"
            - "DCR created for DIRECT_DEPOSIT; approval_status PENDING_VERIFICATION, fraud_status PENDING; challenge_code read from the fraud-verifications sub-resource"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E500", full_name: "Dee Deposit", email: "dee@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "DIRECT_DEPOSIT", new_values: { bank_routing_number: "021000021", bank_account_number: "123456789", bank_account_type: "CHECKING" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { dcr_id: $.data.id } }
            - { call: "GET /hr-helpdesk/data-change-requests/${dcr_id}/fraud-verifications", as: Employee, as_user_id: "${emp_id}", captures: { chal: "$.data[0].challenge_code" } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/verify", payload: { method: "SECURITY_CODE", evidence_code: "BAD000" }, as: Employee, as_user_id: "${emp_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/verify", payload: { method: "SECURITY_CODE", evidence_code: "${chal}" }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /hr-helpdesk/data-change-requests/${dcr_id}/approve", payload: { }, as: HRDataSteward, as_user_id: "steward-1" }
          assert:
            - "first verify response error_id == ERR_FRAUD_EVIDENCE_MISMATCH (http 422) and FraudVerification.attempts == 1"
            - "after failed attempt: approval_status == PENDING_VERIFICATION while fraud_status == FAILED (dimensions independent)"
            - "after correct code + approve: DataChangeRequest.${dcr_id}.approval_status == APPLIED and fraud_status == VERIFIED"
            - "Employee.${emp_id}.bank_routing_number == 021000021 and bank_account_type == CHECKING"
            - "GET /hr-helpdesk/employees/${emp_id}/audit-log returns 3 entries, all change_source == DCR_APPLIED"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: survey_submit_coaching_hold_releases_tickets
        grounds:
          - state_machines.SurveyResponse.ISSUED_to_SUBMITTED
          - calculations.csat_rolling_calculation
          - entities.Agent.fields.coaching_hold
        distinguishing_aspect: |
          Depth-3 chain from the survey-submit trigger: SUBMITTED recomputes
          Agent.rolling_csat; the recomputed value crossing below 3.00 flips
          Agent.coaching_hold; the flag flip releases the agent's assigned
          open tickets (assigned_agent_id null, workflow_status TRIAGED) and
          appends COACHING_RELEASE TicketEvents — each link caused by the
          previous one, not by the original submit.
        test_recipe:
          setup:
            - "T1 agent A (capacity 10); category CAT (480/480 wall); employee E"
            - "tickets t1..t4 all assigned to A; t1..t3 resolved and their surveys submitted with score 1 (ages 0); t4 left IN_PROGRESS assigned to A"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Coach Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Agent K", email: "k@x.com", tier: "T1", team_id: "${tm_id}", capacity_max: 10 }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "COA", name: "Coach Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E600", full_name: "Karl Kase", email: "karl@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t1", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t1: $.data.id, t1_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t2", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t2: $.data.id, t2_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t3", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t3: $.data.id, t3_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "t4", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t4: $.data.id, t4_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t1}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t1_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t2}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t2_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t3}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t3_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t4}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t4_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t1}/resolve", payload: { resolution_summary: "r1" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t2}/resolve", payload: { resolution_summary: "r2" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "POST /hr-helpdesk/tickets/${t3}/resolve", payload: { resolution_summary: "r3" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t1}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s1: "$.data[0].id" } }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t2}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s2: "$.data[0].id" } }
            - { call: "GET /hr-helpdesk/surveys", payload: { ticket_id: "${t3}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { s3: "$.data[0].id" } }
            - { call: "POST /hr-helpdesk/surveys/${s1}/submit", payload: { score: 1 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "POST /hr-helpdesk/surveys/${s2}/submit", payload: { score: 1 }, as: Employee, as_user_id: "${emp_id}" }
          trigger:
            - { call: "POST /hr-helpdesk/surveys/${s3}/submit", payload: { score: 1 }, as: Employee, as_user_id: "${emp_id}" }
            - { call: "GET /hr-helpdesk/agents/${ag_id}", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/tickets/${t4}", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/tickets/${t4}/events", as: HRServicesAdmin, as_user_id: "admin-1" }
          assert:
            - "Agent.${ag_id}.rolling_csat == 1.0"
            - "Agent.${ag_id}.coaching_hold == true  (third submit reaches CSAT_MIN_SURVEYS with 1.0 < 3.00)"
            - "Ticket.${t4}.assigned_agent_id == null"
            - "Ticket.${t4}.workflow_status == TRIAGED"
            - "Ticket.${t4} events contain an entry with event_type == COACHING_RELEASE"
      - name: dcr_apply_employee_mutation_cancels_sibling_dcr
        grounds:
          - state_machines.DataChangeRequest.approval_status.PENDING_APPROVAL_to_APPLIED
          - entities.Employee.fields.has_pending_dcr
          - entities.AuditLogEntry.fields.change_source
        distinguishing_aspect: |
          Depth-2+ chain from the approve trigger (different trigger from the
          survey-submit sibling instance): approve writes Employee profile
          fields (Employee.version bumps); that Employee mutation itself
          auto-cancels the sibling PENDING_VERIFICATION deposit DCR and
          recomputes has_pending_dcr — the sibling cancel is caused by the
          employee mutation, not directly by the approve call.
        test_recipe:
          setup:
            - "employee E (version 1); DCR d1 ADDRESS created (no fraud history -> NOT_REQUIRED -> PENDING_APPROVAL, Employee.version 2)"
            - "DCR d2 DIRECT_DEPOSIT created with expected_employee_version 2 -> PENDING_VERIFICATION (Employee.version 3)"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E700", full_name: "Sid Sibling", email: "sid@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "ADDRESS", new_values: { address_line1: "100 Main St", city: "Denver", region: "CO", postal_code: "80202" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { d1: $.data.id } }
            - { call: "GET /hr-helpdesk/employees/${emp_id}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_v2: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "DIRECT_DEPOSIT", new_values: { bank_routing_number: "021000021", bank_account_number: "123456789", bank_account_type: "SAVINGS" }, expected_employee_version: "${emp_v2}" }, as: Employee, as_user_id: "${emp_id}", captures: { d2: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests/${d1}/approve", payload: { }, as: HRDataSteward, as_user_id: "steward-1" }
            - { call: "GET /hr-helpdesk/data-change-requests/${d2}", as: HRDataSteward, as_user_id: "steward-1" }
            - { call: "GET /hr-helpdesk/employees/${emp_id}", as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/employees/${emp_id}/audit-log", as: HRDataSteward, as_user_id: "steward-1" }
          assert:
            - "DataChangeRequest.${d1}.approval_status == APPLIED"
            - "DataChangeRequest.${d2}.approval_status == CANCELLED  (sibling cascade from the Employee mutation)"
            - "Employee.${emp_id}.city == Denver and postal_code == 80202"
            - "Employee.${emp_id}.has_pending_dcr == false"
            - "audit log holds exactly 4 entries (address_line1, city, region, postal_code), all change_source == DCR_APPLIED, dcr_id == ${d1}"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_rejected_dcr_terminated_employee_state_beats_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_DCR_INVALID_STATE]
          - errors[ERR_EMPLOYEE_INACTIVE]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: the DCR is already
          REJECTED (state, priority 6) AND the employee is TERMINATED
          (safety, priority 7) — the approve must surface ERR_DCR_INVALID_STATE
          because state preconditions outrank business-safety checks.
        test_recipe:
          setup:
            - "employee E; DCR d1 ADDRESS in PENDING_APPROVAL (fraud NOT_REQUIRED); steward rejects it -> REJECTED; admin then terminates E"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E800", full_name: "Pam Prio", email: "pam@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id, emp_v: $.data.version } }
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "ADDRESS", new_values: { address_line1: "1 A St", city: "Boise", region: "ID", postal_code: "83701" }, expected_employee_version: "${emp_v}" }, as: Employee, as_user_id: "${emp_id}", captures: { d1: $.data.id } }
            - { call: "POST /hr-helpdesk/data-change-requests/${d1}/reject", payload: { reason: "insufficient evidence" }, as: HRDataSteward, as_user_id: "steward-1" }
            - { call: "POST /hr-helpdesk/employees/${emp_id}/status", payload: { status: "TERMINATED" }, as: HRServicesAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests/${d1}/approve", payload: { }, as: HRDataSteward, as_user_id: "steward-2", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_DCR_INVALID_STATE (http 409)  # NOT ERR_EMPLOYEE_INACTIVE"
            - "DataChangeRequest.${d1}.approval_status remains REJECTED"
      - name: assign_sensitive_uncleared_at_capacity_safety_beats_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_CONFIDENTIALITY_CLEARANCE_REQUIRED]
          - errors[ERR_AGENT_AT_CAPACITY]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint (distinct
          from the sibling's state vs business_safety): the assignee violates
          BOTH the confidentiality-clearance rule (STANDARD agent on a
          sensitive ticket) AND the capacity rule (capacity_max 0) — the
          clearance error must win.
        test_recipe:
          setup:
            - "team T; sensitive category SEC (is_sensitive true) routed to T; employee E; ticket in SEC (no SENSITIVE-clearance agent exists, so intake leaves it unassigned NEW)"
            - "agent X: tier T1, clearance STANDARD, capacity_max 0"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Sec Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "SEC", name: "Sensitive", is_sensitive: true, specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E900", full_name: "Sue Secret", email: "sue@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "confidential", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Std Agent", email: "std@x.com", tier: "T1", team_id: "${tm_id}", clearance: "STANDARD", capacity_max: 0 }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_x: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${ag_x}", expected_ticket_version: "${t_v}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CONFIDENTIALITY_CLEARANCE_REQUIRED (http 403)  # NOT ERR_AGENT_AT_CAPACITY"
            - "Ticket.${t_id}.assigned_agent_id remains null and workflow_status remains NEW"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: sla_at_risk_exactly_75_percent_elapsed
        grounds:
          - calculations.sla_clock_evaluation
          - state_machines.Ticket.sla_status.ON_TRACK_to_AT_RISK
        distinguishing_aspect: |
          Inclusive >= boundary on the elapsed-fraction metric: at 359/480
          minutes the ticket stays ON_TRACK; at exactly 360/480 == 0.75 it
          flips to AT_RISK — reached through the clock endpoint, not through
          any ticket write.
        test_recipe:
          setup:
            - "category CAT with WALL_CLOCK P3 policy first_response 480 / resolution 480; employee E; ticket created at the default clock 2026-08-01T00:00:00Z (both dues 2026-08-01T08:00:00Z); no agent response"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "SLA Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "SLA", name: "SLA Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E110", full_name: "Ada Risk", email: "ada@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "risk", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T05:59:00Z" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/tickets/${t_id}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { sla_359: $.data.sla_status } }
            - { call: "POST /hr-helpdesk/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "GET /hr-helpdesk/tickets/${t_id}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { sla_360: $.data.sla_status } }
          assert:
            - "sla_359 == ON_TRACK   # 359/480 = 0.7479 < 0.75"
            - "sla_360 == AT_RISK    # 360/480 = 0.75 exactly, inclusive boundary"
            - "Ticket.${t_id}.first_response_due_at == 2026-08-01T08:00:00Z (unchanged by clock advance)"
      - name: staffing_posture_zero_required_hours_adequate
        grounds:
          - calculations.staffing_coverage_posture
          - entities.StaffingWindow.fields.coverage_posture
        distinguishing_aspect: |
          Zero-count/empty-set edge on the coverage-ratio metric (different
          metric and different endpoint from the sibling instance): with
          required_t1_hours == 0 AND required_t2_hours == 0 and zero shifts,
          the division guard must yield ADEQUATE, not UNDER_STAFFED or an error.
        test_recipe:
          setup:
            - "team T; staffing window W 2026-08-03..2026-08-08 with required_t1_hours 0 and required_t2_hours 0; no shifts exist"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Zero Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm_id}", name: "Zero Req", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-08T00:00:00Z", required_t1_hours: 0, required_t2_hours: 0 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { w_id: $.data.id } }
          trigger:
            - { call: "GET /hr-helpdesk/staffing-windows/${w_id}", as: WorkforcePlanner, as_user_id: "planner-1" }
          assert:
            - "$.data.covered_t1_hours == 0.0 and $.data.covered_t2_hours == 0.0"
            - "$.data.coverage_posture == ADEQUATE   # zero-required tiers contribute ratio 1.0"

  # ------------------------------------------------------------------ Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_resolution_requires_published_article
        grounds:
          - state_machines.Ticket.workflow_status.IN_PROGRESS_to_RESOLVED
          - validations[priority=10]
          - errors[ERR_RESOLUTION_ARTICLE_NOT_PUBLISHED]
        distinguishing_aspect: |
          Entity pair Ticket x KbArticle: the RESOLVED transition is gated on
          the referenced article being PUBLISHED; citing a DRAFT article
          rejects the resolve and leaves the ticket IN_PROGRESS.
        test_recipe:
          setup:
            - "category CAT (480/480 wall policy); T1 agent A; employee E; KbArticle ART in DRAFT (author km-1); ticket assigned to A, IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "KB Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Agent KB", email: "kb@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "KBC", name: "KB Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E120", full_name: "Ken Base", email: "ken@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "Reset SSO", body: "steps", category_id: "${cat_id}" }, as: KnowledgeManager, as_user_id: "km-1", captures: { art_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "sso broken", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${ag_id}", expected_ticket_version: "${t_v}" }, as: HelpDeskAgent, as_user_id: "${ag_id}" }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/resolve", payload: { resolution_summary: "see article", resolution_article_id: "${art_id}" }, as: HelpDeskAgent, as_user_id: "${ag_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RESOLUTION_ARTICLE_NOT_PUBLISHED (http 422)"
            - "Ticket.${t_id}.workflow_status remains IN_PROGRESS and resolved_at remains null"
      - name: dcr_create_requires_active_employee
        grounds:
          - state_machines.DataChangeRequest.approval_status
          - validations[priority=7]
          - errors[ERR_EMPLOYEE_INACTIVE]
        distinguishing_aspect: |
          Entity pair DataChangeRequest x Employee (distinct from the
          sibling's Ticket x KbArticle): DCR creation is gated on the parent
          Employee being ACTIVE; an ON_LEAVE employee's request is rejected
          with ERR_EMPLOYEE_INACTIVE before any fraud or OCC logic runs.
        test_recipe:
          setup:
            - "employee E transitioned ACTIVE -> ON_LEAVE (version now 2)"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E130", full_name: "Lou Leave", email: "lou@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/employees/${emp_id}/status", payload: { status: "ON_LEAVE" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_v2: $.data.version } }
          trigger:
            - { call: "POST /hr-helpdesk/data-change-requests", payload: { employee_id: "${emp_id}", change_type: "ADDRESS", new_values: { address_line1: "9 B St", city: "Provo", region: "UT", postal_code: "84601" }, expected_employee_version: "${emp_v2}" }, as: Employee, as_user_id: "${emp_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EMPLOYEE_INACTIVE (http 422)"
            - "GET /hr-helpdesk/data-change-requests?employee_id=${emp_id} total_count == 0"

  # ------------------------------------------------------------------ Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: agent_shift_half_open_back_to_back_allowed
        grounds:
          - validations[priority=8]
          - entities.AgentShift.fields.shift_end
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Half-open [start, end) interval semantics on the AgentShift resource:
          a 17:00-21:00 shift touches the existing 09:00-17:00 shift and is
          ALLOWED, while 16:59-18:00 strictly overlaps and is rejected.
        test_recipe:
          setup:
            - "team T; T1 agent A; window W 2026-08-03T00:00:00Z..2026-08-08T00:00:00Z (PLANNED); A has shift 2026-08-03 09:00-17:00"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Shift Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "Agent S", email: "s@x.com", tier: "T1", team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { ag_id: $.data.id } }
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm_id}", name: "Week1", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-08T00:00:00Z", required_t1_hours: 10, required_t2_hours: 0 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { w_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${ag_id}", staffing_window_id: "${w_id}", shift_start: "2026-08-03T09:00:00Z", shift_end: "2026-08-03T17:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1" }
          trigger:
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${ag_id}", staffing_window_id: "${w_id}", shift_start: "2026-08-03T17:00:00Z", shift_end: "2026-08-03T21:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { sh2: $.data.id } }
            - { call: "POST /hr-helpdesk/agent-shifts", payload: { agent_id: "${ag_id}", staffing_window_id: "${w_id}", shift_start: "2026-08-03T16:59:00Z", shift_end: "2026-08-03T18:00:00Z" }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { err: $.data.error_id } }
          assert:
            - "the back-to-back shift 17:00-21:00 succeeds (201) — touching endpoints allowed under half-open semantics"
            - "err == ERR_SHIFT_OVERLAP (http 409) for the strictly overlapping 16:59-18:00 shift"
            - "GET /hr-helpdesk/agent-shifts?agent_id=${ag_id} total_count == 2"
      - name: staffing_window_touching_endpoints_conflict
        grounds:
          - validations[priority=8]
          - entities.StaffingWindow.fields.window_end
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Closed-interval semantics on the StaffingWindow resource (different
          resource and different interval arithmetic from the sibling
          instance): a window starting exactly when another same-team window
          ends (2026-11-30T00:00:00Z) CONFLICTS, while a gap of one day
          succeeds.
        test_recipe:
          setup:
            - "team T; existing PLANNED window W1 2026-10-01T00:00:00Z..2026-11-30T00:00:00Z (clock is 2026-08-01, so PLANNED)"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "Win Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm_id}", name: "OE Part 1", window_start: "2026-10-01T00:00:00Z", window_end: "2026-11-30T00:00:00Z", required_t1_hours: 100, required_t2_hours: 20 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm_id}", name: "OE Touching", window_start: "2026-11-30T00:00:00Z", window_end: "2026-12-31T00:00:00Z", required_t1_hours: 50, required_t2_hours: 10 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { err: $.data.error_id } }
            - { call: "POST /hr-helpdesk/staffing-windows", payload: { team_id: "${tm_id}", name: "OE Part 2", window_start: "2026-12-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z", required_t1_hours: 50, required_t2_hours: 10 }, as: WorkforcePlanner, as_user_id: "planner-1", captures: { w3: $.data.id } }
          assert:
            - "err == ERR_WINDOW_OVERLAP (http 409)  # closed intervals: end == start of another window is a conflict"
            - "the 2026-12-01 window succeeds (201) and GET /hr-helpdesk/staffing-windows?team_id=${tm_id} total_count == 2"

  # ------------------------------------------------------------------ Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: agent_workload_conserved_across_assign_reassign
        grounds:
          - entities.Agent.fields.assigned_open_count
          - state_machines.Ticket.workflow_status (assign transition)
          - concurrency_rules[ticket-assign-stale-ticket]
        distinguishing_aspect: |
          Conserved quantity = total assigned open tickets summed across all
          agents: the assign(A1) -> reassign(A2) pair leaves
          SUM(Agent.assigned_open_count) == 1 unchanged; the reassign is the
          compensating action that debits A1 while crediting A2.
        test_recipe:
          setup:
            - "team T; T1 agents A1 and A2 (capacity 10); category CAT (480/480); employee E; one ticket (version 1)"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "WL Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A1", email: "a1@x.com", tier: "T1", team_id: "${tm_id}", capacity_max: 10 }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { a1: $.data.id } }
            - { call: "POST /hr-helpdesk/agents", payload: { display_name: "A2", email: "a2@x.com", tier: "T1", team_id: "${tm_id}", capacity_max: 10 }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { a2: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "WLC", name: "WL Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/sla-policies", payload: { category_id: "${cat_id}", priority: "P3", first_response_minutes: 480, resolution_minutes: 480 }, as: HRServicesAdmin, as_user_id: "admin-1" }
            - { call: "POST /hr-helpdesk/employees", payload: { employee_number: "E140", full_name: "Will Load", email: "will@x.com" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { emp_id: $.data.id } }
            - { call: "POST /hr-helpdesk/tickets", payload: { employee_id: "${emp_id}", category_id: "${cat_id}", subject: "wl", description: "d" }, as: Employee, as_user_id: "${emp_id}", captures: { t_id: $.data.id, t_v: $.data.version } }
          trigger:
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${a1}", expected_ticket_version: "${t_v}" }, as: HelpDeskAgent, as_user_id: "${a1}", captures: { t_v2: $.data.version } }
            - { call: "POST /hr-helpdesk/tickets/${t_id}/assign", payload: { agent_id: "${a2}", expected_ticket_version: "${t_v2}" }, as: HelpDeskAgent, as_user_id: "${a2}" }
            - { call: "GET /hr-helpdesk/agents/${a1}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { c1: $.data.assigned_open_count } }
            - { call: "GET /hr-helpdesk/agents/${a2}", as: HRServicesAdmin, as_user_id: "admin-1", captures: { c2: $.data.assigned_open_count } }
          assert:
            - "c1 == 0 and c2 == 1"
            - "c1 + c2 == 1  (invariant: SUM(assigned_open_count) over agents == number of open assigned tickets, unchanged by the assign/reassign pair)"
            - "Ticket.${t_id}.assigned_agent_id == ${a2} and workflow_status == IN_PROGRESS"
      - name: kb_chain_single_published_head_conserved
        grounds:
          - state_machines.KbArticle.IN_REVIEW_to_PUBLISHED
          - entities.KbArticle.fields.supersedes_article_id
        distinguishing_aspect: |
          Conserved quantity = number of PUBLISHED articles per revision chain
          (exactly 1): publish(revision B) paired with its compensating
          supersede(base A) leaves the chain's published-head count invariant;
          a different conserved quantity than the agent-workload sibling.
        test_recipe:
          setup:
            - "category CAT; article A authored by km-1 and published by km-2 (SoD) -> PUBLISHED chain head"
          setup_api_calls:
            - { call: "POST /hr-helpdesk/teams", payload: { name: "KB Chain Team" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { tm_id: $.data.id } }
            - { call: "POST /hr-helpdesk/ticket-categories", payload: { code: "KCH", name: "KB Chain Cat", specialist_team_id: "${tm_id}" }, as: HRServicesAdmin, as_user_id: "admin-1", captures: { cat_id: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "VPN Setup v1", body: "v1", category_id: "${cat_id}" }, as: KnowledgeManager, as_user_id: "km-1", captures: { art_a: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles/${art_a}/submit-review", payload: { }, as: KnowledgeManager, as_user_id: "km-1" }
            - { call: "POST /hr-helpdesk/kb-articles/${art_a}/publish", payload: { }, as: KnowledgeManager, as_user_id: "km-2" }
          trigger:
            - { call: "POST /hr-helpdesk/kb-articles", payload: { title: "VPN Setup v2", body: "v2", category_id: "${cat_id}", supersedes_article_id: "${art_a}" }, as: KnowledgeManager, as_user_id: "km-1", captures: { art_b: $.data.id } }
            - { call: "POST /hr-helpdesk/kb-articles/${art_b}/submit-review", payload: { }, as: KnowledgeManager, as_user_id: "km-1" }
            - { call: "POST /hr-helpdesk/kb-articles/${art_b}/publish", payload: { }, as: KnowledgeManager, as_user_id: "km-2" }
            - { call: "GET /hr-helpdesk/kb-articles/${art_a}", as: KnowledgeManager, as_user_id: "km-1", captures: { a_status: $.data.status } }
            - { call: "GET /hr-helpdesk/kb-articles", payload: { category_id: "${cat_id}", status: "PUBLISHED" }, as: KnowledgeManager, as_user_id: "km-1" }
          assert:
            - "a_status == SUPERSEDED  (compensating transition fired with the publish)"
            - "KbArticle.${art_b}.status == PUBLISHED"
            - "GET /hr-helpdesk/kb-articles?category_id=${cat_id}&status=PUBLISHED total_count == 1  (invariant: exactly one PUBLISHED head per chain)"
            - "the single PUBLISHED row's id == ${art_b}"
