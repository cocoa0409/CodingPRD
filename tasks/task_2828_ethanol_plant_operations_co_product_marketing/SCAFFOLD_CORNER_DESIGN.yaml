      - name: hedge_unit_sizes_are_applied_per_commodity
        claim_type: constants_applied
        grounds:
          - calculations.hedge_pnl
          - entities.HedgePosition.fields.unit_size
        distinguishing_aspect: |
          The contract multiplier is chosen by commodity, not shared: CORN
          stamps 5000, ETHANOL 29000 and NATGAS 10000, so a LONG of 20 corn lots
          entered at 450.00 against a 440.00 mark shows exactly -1000000 cents
          of unrealized loss while the same 10-cent adverse move on one ethanol
          lot would be -290000.
        test_recipe:
          setup:
            - "Plant exists with all five marks posted for 2026-10 (corn 440.0, ethanol 178.00, natgas 320.0, soybean meal 330.00, SBO 48.00)."
