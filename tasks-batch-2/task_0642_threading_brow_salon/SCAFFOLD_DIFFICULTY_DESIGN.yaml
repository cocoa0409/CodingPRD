      scaffold pins credit-decision FIRST then discount over the remaining chargeable subtotal; with a

      credit drawn the discount applies only to addon_part (150, not 350), yielding 4350. Distinct

      mode from instance 1''s mode (a) and instance 2''s mode (b).

