              as: RegistrarClerk
              captures: { ep: $.data.id }
            - call: "POST /r2t4/enrollments/${ep}/awards"
              payload: { program: "PELL_GRANT", amount_cents: 200000 }
              as: FinancialAidOfficer
              captures: { pp: $.data.id }
            - call: "POST /r2t4/awards/${pp}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { dp1: $.data.id }
            - call: "POST /r2t4/disbursements/${dp1}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/awards/${pp}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ep}/awards"
              payload: { program: "SUBSIDIZED_LOAN", amount_cents: 300000 }
              as: FinancialAidOfficer
              captures: { lp: $.data.id }
            - call: "POST /r2t4/awards/${lp}/accept"
              payload: {}
              as: Student
              as_user_id: "${sp}"
            - call: "POST /r2t4/awards/${lp}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { dp2: $.data.id }
            - call: "POST /r2t4/disbursements/${dp2}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /r2t4/awards/${lp}/disbursements"
              payload: { amount_cents: 200000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ep}/awards"
              payload: { program: "UNSUBSIDIZED_LOAN", amount_cents: 100000 }
              as: FinancialAidOfficer
              captures: { up: $.data.id }
            - call: "POST /r2t4/awards/${up}/accept"
              payload: {}
              as: Student
              as_user_id: "${sp}"
            - call: "POST /r2t4/awards/${up}/disbursements"
              payload: { amount_cents: 100000 }
              as: FinancialAidOfficer
            - call: "POST /r2t4/enrollments/${ep}/withdraw"
              payload: { withdrawal_type: "OFFICIAL", notification_date: "2026-10-25" }
              as: RegistrarClerk
              captures: { cp: $.data.id }
            - call: "POST /r2t4/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-26T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /r2t4/withdrawal-cases/${cp}/calculate"
              payload: {}
              as: FinancialAidOfficer
              as_user_id: "officer-1"
              captures: { cp_v: $.data.version }
            - call: "GET /r2t4/withdrawal-cases/${cp}/offers"
              payload: {}
              as: FinancialAidOfficer
              captures: { ofp: "$.data[0].id" }
            - call: "POST /r2t4/post-withdrawal-offers/${ofp}/accept"
              payload: {}
              as: Student
              as_user_id: "${sp}"
          trigger:
            - call: "POST /r2t4/withdrawal-cases/${cp}/recalculate"
              payload: { expected_withdrawal_case_version: "${cp_v}" }
              as: FinancialAidOfficer
              as_user_id: "officer-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OFFER_ALREADY_ACCEPTED (http 409)"
            - "WithdrawalCase.${cp}.status remains CALCULATED (the UNSUB offer is still SENT)"

      - name: student_unofficial_withdraw_forbidden
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "roles"
          - "state_machines.Enrollment.ENROLLED_to_WITHDRAWN"
        distinguishing_aspect: "Role-scoped input: Student may self-report only an OFFICIAL withdrawal; UNOFFICIAL determination is a registrar function (ERR_FORBIDDEN_FOR_ROLE)."
        test_recipe:
          setup: ["Term T1; enrollment owned by the calling student"]
          setup_api_calls:
