            - *k_spec
            - *k_cal
            - *k_act
            - *k_bt
            - *k_ftp
            - *k_ftp_rec
            - *k_ftp_rev
            - *k_rmc
            - *k_rmc_rec
            - *k_rmc_rev
            - *k_set
            - *k_set_rec
            - *k_set_rev
            - *k_submit
            - *k_cert
            - *k_eip
            - *k_fleet
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-F1", in_service_date: "2026-11-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { fut_err: $.data.error_id }
            - call: "POST /emissions/engine-units"
              payload: { engine_family_id: "${fam_id}", fleet_id: "${flt_id}", serial_number: "UN-F2", in_service_date: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { unit_ok: $.data.id }
          assert:
            - "in_service 2026-11-02 against the 2026-11-01 clock fails 422 with error_id ERR_IN_SERVICE_DATE_IN_FUTURE via ${fut_err}"
            - "in_service exactly at the clock succeeds (201) via ${unit_ok} — the boundary is inclusive"

      - name: maintenance_odometer_above_accumulated_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=12]
