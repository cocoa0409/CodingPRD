          assert:
            - "${r_sc1_state} == \"ENROLLED\", ${r_sc2_state} == \"WAITLISTED\", ${taken_before} == 1, ${waitlist_before} == 1, ${avail_before} == 0 (setup)"
            - "${d_sc1_ev} == \"DISPUTED\" and ${d_sc1_pl} == \"PROVISIONAL\" — only the evidence axis moved on the determination itself"
            - "${r_sc1_after} == \"DENIED\" and ${r_sc1_reason} == \"EVIDENCE_DISPUTED\" — visible on the very next read, with the logical clock unchanged"
            - "${r_sc2_after} == \"ENROLLED\" — the waitlisted student was promoted inside the SAME request that denied SC1; nothing had to be re-polled or retried"
            - "${taken_after} == 1, ${held_after} == 0, ${waitlist_after} == 0 and ${avail_after} == 0 — the released seat was immediately re-occupied, so the counters never pass through an inconsistent intermediate state that a client could observe"
            - "seat_ledger(secI) == 1 taken + 0 held + 0 waitlisted + 1 denied == 2 == the row count reported by GET /sections/${seci}/registrations, and ${row0} == \"DENIED\" (created_at ASC)"
            - "${d_sc2_ev} == \"UNVERIFIED\" and ${d_sc2_pl} == \"PROVISIONAL\" — the cascade touched only the disputed student's determination; the promoted student's own determination is untouched"
