          A counted cap and a wall-clock deadline on the same case, plus the exact deadline boundary:
          statute_deadline_at is filed_at + 180 days and the comparison is strict (clock now <
          deadline), so 2027-01-28T00:00:00Z is already too late while 2027-01-27T23:59:59Z is still in
          time. The amendment round-trip also re-scores the complaint from the amended loss figure, so
