            - call: "POST /motions"
              payload: { title: "M2", description: "D2", category: "ELECTION", voting_window_start: "2026-04-10T00:00:00Z", voting_window_end: "2026-04-15T00:00:00Z", eligible_voter_count: 5, quorum_pct: 40 }
              as: BoardMember
              as_user_id: "${bm_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: HOAManager
            - call: "POST /motions/${m1_id}/ballots"
              payload: { homeowner_id: "${v1_id}", choice: "YES" }
              as: Homeowner
              as_user_id: "${v1_id}"
            - call: "POST /motions/${m1_id}/ballots"
              payload: { homeowner_id: "${v2_id}", choice: "NO" }
              as: Homeowner
              as_user_id: "${v2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-11T00:00:00Z" }
              as: HOAManager
            - call: "POST /motions/${m2_id}/ballots"
              payload: { homeowner_id: "${v1_id}", choice: "YES" }
              as: Homeowner
              as_user_id: "${v1_id}"
            - call: "POST /motions/${m2_id}/ballots"
              payload: { homeowner_id: "${v2_id}", choice: "YES" }
              as: Homeowner
              as_user_id: "${v2_id}"
          trigger:
            - call: "GET /ballots"
              payload: { homeowner_id: "${v1_id}" }
              as: HOAManager
              captures: { blist: $.data }
          assert:
            - "len(blist) == 2"

      - name: computed_read_property_derived
        claim_type: computed_read
        grounds:
          - entities.Property.fields.total_outstanding_cents
        distinguishing_aspect: "GET /properties/{id} returns the computed total_outstanding_cents alongside stored fields."
        excluded_because:
          difficulty_instance: transitive_cascade / payment_reversal_depth_3_cascade
          rationale: "The reversal cascade instance already asserts Property.total_outstanding_cents at multiple points."

  # =====================================================================
  # ERRORS
  # =====================================================================
  - section: errors
    instances:
      - name: stale_version_on_autopay_supersede
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[autopay-mandate-supersede-stale]
        distinguishing_aspect: "Second sequential POST /homeowners/{id}/autopay-mandate with expected_homeowner_version equal to the pre-first-write value returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup:
            - "Homeowner H (version=1)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hocc@ex.com", full_name: "H OCC" }
