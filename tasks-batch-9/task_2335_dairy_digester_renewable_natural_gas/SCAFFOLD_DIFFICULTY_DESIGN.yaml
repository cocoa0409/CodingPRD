              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { pathway_id: "$.data.id", pathway_v1: "$.data.version" }
            - call: "POST /credit-batches"
              payload: { pathway_id: "${pathway_id}", facility_id: "${facility_id}", period_start_date: "2026-08-01", period_end_date: "2026-08-31", expected_pathway_version: "${pathway_v1}" }
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { batch_id: "$.data.id" }
