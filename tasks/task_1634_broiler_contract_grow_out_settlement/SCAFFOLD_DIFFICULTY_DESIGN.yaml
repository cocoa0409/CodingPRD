            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-45", week_ending_date: "2026-12-12" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h1}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-T21" }, as: IntegratorAdmin, captures: { f1: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h2}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-T22" }, as: IntegratorAdmin, captures: { f2: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h3}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-T23" }, as: IntegratorAdmin, captures: { f3: $.data.id } }
            - { call: "POST /api/flocks/${f1}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/flocks/${f2}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/flocks/${f3}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p3: $.data.id } }
            - { call: "POST /api/placements/${p1}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/placements/${p2}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/placements/${p3}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f1}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-T21" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f2}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-T22" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f3}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-T23" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-T2", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/flocks/${f1}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler }
            - { call: "POST /api/flocks/${f2}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler }
            - { call: "POST /api/flocks/${f3}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { err: $.data.error_id } }
            - { call: "POST /api/flocks/${f3}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-11" }, as: LivehaulScheduler }
          assert:
            - "two bookings on 2026-09-10 succeed; third same-day booking rejected with ERR_CREW_OVERBOOKED"
            - "the same third flock booked on 2026-09-11 succeeds — capacity is per-day aggregate, not a date-interval exclusion"

  # ------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: loan_waterfall_conserves_total_outstanding
        grounds:
          - calculations.loan_outstanding_recompute
          - state_machines.Settlement.PENDING_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity: grower total outstanding. sum(GrowerLoan
          .outstanding_cents) after settlement approval ==
          sum_before - settlement.loan_repayment_cents, and
          Grower.loan_outstanding_cents (the denormalized mirror) equals the
          same value — approval plus its compensating recompute leaves zero
          drift.
        test_recipe:
          setup:
            - "Grower with loans 30000 + 90000 = 120000 outstanding and a locked settlement with loan_repayment_cents 46875"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-I1", full_name: "Invariant Grower" }, as: IntegratorAdmin, captures: { g: $.data.id, g_v1: $.data.version } }
            - { call: "POST /api/growers/${g}/loans", payload: { principal_cents: 30000, recovery_pct: 15, purpose: OPERATING, expected_grower_version: "${g_v1}" }, as: IntegratorAdmin }
            - { call: "GET /api/growers/${g}", payload: {}, as: IntegratorAdmin, captures: { gv: $.data.version } }
            - { call: "POST /api/growers/${g}/loans", payload: { principal_cents: 90000, recovery_pct: 15, purpose: OPERATING, expected_grower_version: "${gv}" }, as: IntegratorAdmin }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 20000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-I1", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-46", week_ending_date: "2026-12-19" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-I1" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 10000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-10", feed_lbs: 100000, feed_type: STARTER, ticket_no: "FT-I1" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-I1", max_catches_per_day: 2 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs: $.data.id } }
            - { call: "POST /api/flocks/${f}/weight-tickets", payload: { ticket_no: "WT-I1", weighed_at: "2026-09-10T08:00:00Z", live_weight_lbs: 50000 }, as: LivehaulScheduler }
            - { call: "POST /api/catch-schedules/${cs}/complete", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/settlement-groups/${grp}/lock", payload: {}, as: SettlementAnalyst }
            - { call: "GET /api/flocks/${f}/settlement", payload: {}, as: SettlementAnalyst, captures: { s: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/settlements/${s}/approve", payload: {}, as: SettlementAnalyst }
            - { call: "GET /api/growers/${g}", payload: {}, as: IntegratorAdmin, captures: { out: $.data.loan_outstanding_cents } }
          assert:
            - "120000 - 46875 == 73125 == Grower.${g}.loan_outstanding_cents (conserved: total outstanding decreases by exactly the settlement's loan_repayment_cents)"
            - "sum over loans (0 + 73125) == Grower.loan_outstanding_cents == 73125 (denormalized mirror in exact agreement)"

      - name: catch_cancel_restores_flock_and_crew_capacity
        grounds:
          - state_machines.Flock.GROWING_to_CATCH_SCHEDULED
          - state_machines.CatchSchedule.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: crew same-day booking count and flock state
          pair — schedule-then-cancel is a compensating action pair that
          leaves the crew's same-day count unchanged (net zero) and the
          flock back in GROWING, a different conserved quantity than money.
        test_recipe:
          setup:
            - "Crew max 1; flock GROWING, age >= 35 days"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /api/growers", payload: { grower_code: "G-I2", full_name: "Invariant Grower 2" }, as: IntegratorAdmin, captures: { g: $.data.id } }
            - { call: "POST /api/houses", payload: { grower_id: "${g}", house_no: "H1", capacity_birds: 5000 }, as: IntegratorAdmin, captures: { h: $.data.id } }
            - { call: "POST /api/contracts", payload: { grower_id: "${g}", contract_no: "C-I2", base_pay_cents_per_lb: 6, committed_house_count: 1, term_start_date: "2026-01-01", term_end_date: "2027-01-01" }, as: IntegratorAdmin, captures: { c: $.data.id } }
            - { call: "POST /api/contracts/${c}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/settlement-groups", payload: { group_code: "WK-47", week_ending_date: "2026-12-26" }, as: SettlementAnalyst, captures: { grp: $.data.id } }
            - { call: "POST /api/flocks", payload: { house_id: "${h}", contract_id: "${c}", settlement_group_id: "${grp}", flock_no: "F-I2" }, as: IntegratorAdmin, captures: { f: $.data.id } }
            - { call: "POST /api/flocks/${f}/placements", payload: { scheduled_date: "2026-08-01", head_count: 1000 }, as: IntegratorAdmin, captures: { p: $.data.id } }
            - { call: "POST /api/placements/${p}/confirm", payload: {}, as: IntegratorAdmin }
            - { call: "POST /api/flocks/${f}/feed-deliveries", payload: { delivered_date: "2026-08-05", feed_lbs: 1000, feed_type: STARTER, ticket_no: "FT-I2" }, as: IntegratorAdmin }
            - { call: "POST /api/catch-crews", payload: { crew_code: "CREW-I2", max_catches_per_day: 1 }, as: LivehaulScheduler, captures: { crew: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: IntegratorAdmin }
          trigger:
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler, captures: { cs: $.data.id } }
            - { call: "POST /api/catch-schedules/${cs}/cancel", payload: {}, as: LivehaulScheduler }
            - { call: "POST /api/flocks/${f}/catch-schedules", payload: { crew_id: "${crew}", catch_date: "2026-09-10" }, as: LivehaulScheduler }
          assert:
            - "after cancel, Flock.${f}.status returns to GROWING and CatchSchedule.${cs}.status == CANCELLED"
            - "a fresh schedule for the same crew and same catch_date succeeds — the cancelled booking released the capacity slot (schedule+cancel conserves the crew's same-day booking count)"
