            - "sstat == PAID and bal == 0"

      - name: fk_reverse_reachability_filtered_lists
        claim_type: cross_reference
        grounds: ["entities.SalesReport.fields.lease_id", "entities.TIDraw.fields.lease_id", "entities.AuditCase.fields.lease_id", "entities.Lease.fields.tenant_id"]
        distinguishing_aspect: "Children are discoverable from their parents: GET /sales-reports?lease_id, GET /ti-draws?lease_id, GET /audits?lease_id and GET /leases?tenant_id each return only the matching children."
        test_recipe:
          setup: ["Two tenants T1, T2; lease L1 (T1, premises A1) ACTIVE with one report; lease L2 (T2, premises D4) ACTIVE with none"]
          setup_api_calls:
