  - rule_id: priority_pair_validation_conflict
    instances:
      - name: release_cancelled_early_state_beats_temporal
        grounds:
          - "validations[priority=9]"
          - "validations[priority=15]"
          - state_machines.Disbursement
        distinguishing_aspect: |
          Error-category pair (state, business_temporal): releasing a CANCELLED disbursement whose
          scheduled_release_date is still in the future violates both rules; priority 9 (state)
          beats priority 15 (temporal), so ERR_INVALID_STATE_TRANSITION wins over
          ERR_RELEASE_TOO_EARLY.
        test_recipe:
          setup:
            - "Setup A account ACTIVE; balance 100000"
            - "Disbursement 30000, due 2026-12-20, scheduled_release_date 2026-12-01 (future), already CANCELLED by its scheduler"
          setup_api_calls:
            - { call: "POST /servicing/payees", payload: { payee_type: "TAX_AUTHORITY", legal_name: "County Treasurer", remit_to_address: "1 Civic Center", ach_routing_mask: "****1234" }, as: DisbursementProcessor, as_user_id: "dp_1", captures: { pay_id: $.data.id } }
