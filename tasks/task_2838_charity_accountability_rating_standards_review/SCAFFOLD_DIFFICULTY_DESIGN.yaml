  - rule_id: non_linear_state_machine
    instances:
      - name: rating_cycle_correction_revision_loop
        grounds:
          - state_machines.RatingCycle.ORG_REVIEW_to_CORRECTION_REQUESTED
          - state_machines.RatingCycle.CORRECTION_REQUESTED_to_DATA_COLLECTION
          - state_machines.RatingCycle.DATA_COLLECTION_to_SCORED
          - state_machines.RatingCycle.SCORED_to_ORG_REVIEW
          - state_machines.CorrectionRequest.UNDER_ANALYST_REVIEW_to_ACCEPTED
          - entities.RatingCycle.fields.correction_round
        distinguishing_aspect: |
          A four-node CYCLE traversed in full, in the RatingCycle workflow:
          ORG_REVIEW -> CORRECTION_REQUESTED -> DATA_COLLECTION -> SCORED ->
          ORG_REVIEW. Re-entering DATA_COLLECTION is destructive - it clears the
          provisional figures, stales every DimensionScore and sends the
          GovernanceProfile back to PENDING - so the second lap is not a replay of
          the first, and the loop is bounded by correction_round < 2.
