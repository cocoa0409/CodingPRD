scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: ticket_fee_provisional_vs_final
        grounds:
          - calculations.tipping_fee
          - entities.Ticket.fields.estimated_fee_cents
          - entities.Ticket.fields.tipping_fee_cents
          - state_machines.Ticket.CREATED_to_WEIGHED
        distinguishing_aspect: "On a Ticket, the provisional estimate (manifest declared 7.0 tons -> 30100) and the final fee (net 8.0 tons -> 33900) diverge because they read different weight fields."
        test_recipe:
          setup:
            - "A hauler with a MSW manifest declaring 7.0 tons, and a ticket for MSW weighed at net 8.0 tons (gross 10.0, tare 2.0), facility gas NORMAL."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/manifests"
              payload: { hauler_account_id: "${hauler_id}", declared_material: "MSW", declared_weight_tons: 7.0 }
              as: Hauler
              as_user_id: "${hauler_id}"
              captures: { man_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 10.0, manifest_id: "${man_id}" }
              as: GateOperator
              as_user_id: "op1"
              captures: { tk_id: $.data.id, est: $.data.estimated_fee_cents }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op1"
              captures: { fin: $.data.tipping_fee_cents }
          assert:
            - "Ticket.${tk_id}.estimated_fee_cents == 30100"
            - "Ticket.${tk_id}.tipping_fee_cents == 33900"
            - "Ticket.${tk_id}.estimated_fee_cents != Ticket.${tk_id}.tipping_fee_cents"

      - name: facility_diversion_provisional_vs_final
        grounds:
          - calculations.diversion_rate
          - entities.Facility.fields.diversion_rate_provisional
          - entities.Facility.fields.diversion_rate_final
        distinguishing_aspect: "On a Facility (different entity domain from Ticket), the forward-looking diversion rate counts INSPECTED+POSTED tonnage (10 diverted / 16 total = 0.625) while the final rate counts POSTED only (10/10 = 1.0)."
        test_recipe:
          setup:
            - "Facility with one POSTED GREEN_WASTE ticket (net 10.0, diverted) and one INSPECTED-but-unposted MSW ticket (net 6.0, non-diverted)."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "GREEN_WASTE", gross_weight_tons: 12.0 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { g_id: $.data.id }
            - call: "POST /landfill/tickets/${g_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${g_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
            - call: "POST /landfill/tickets/${g_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 8.0 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { m_id: $.data.id }
            - call: "POST /landfill/tickets/${m_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${m_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
          trigger:
            - call: "GET /landfill/facilities/${fac_id}"
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { prov: $.data.diversion_rate_provisional, fin: $.data.diversion_rate_final }
          assert:
            - "Facility.${fac_id}.diversion_rate_provisional == 0.625"
            - "Facility.${fac_id}.diversion_rate_final == 1.0"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tipping_fee_nonlinear_tier_gas_branch
        grounds:
          - calculations.tipping_fee
          - entities.Ticket.fields.tipping_fee_cents
          - entities.Facility.fields.gas_status
        distinguishing_aspect: "Mode (a): the final fee for MSW net 4.0 has >=3 interacting inputs (marginal tier rate 4500, gas_status branch multiplier 1.10, nested max with MINIMUM_FEE) yielding 19800, versus 18000 without the ELEVATED branch."
        test_recipe:
          setup:
            - "Facility with gas ELEVATED (methane 300 ppm), a MSW ticket weighed at net 4.0 tons."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/gas-readings"
              payload: { methane_ppm: 300, reading_at: "2026-03-01T08:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 6.0 }
              as: GateOperator
              as_user_id: "op1"
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op1"
              captures: { fee: $.data.tipping_fee_cents }
          assert:
            - "Ticket.${tk_id}.tipping_fee_cents == 19800"

      - name: invoice_rounding_per_line_then_sum
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.total_cents
          - entities.Invoice.fields.tipping_subtotal_cents
        distinguishing_aspect: "Mode (b): three CONSTRUCTION_DEBRIS lines each with tipping 2600 give total 8484 when each host-fee line is rounded then summed (round(2827.5)=2828 x3), whereas sum-then-round gives 8483 — the scaffold pins per-line rounding."
        test_recipe:
          setup:
            - "Hauler with three POSTED CONSTRUCTION_DEBRIS tickets (net 0.5 tons each, tipping 2600 each), then a settlement invoice."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { t1: $.data.id }
            - call: "POST /landfill/tickets/${t1}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${t1}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fv1: $.data.version }
            - call: "POST /landfill/tickets/${t1}/post"
              payload: { expected_facility_version: "${fv1}" }
              as: GateOperator
              as_user_id: "op_post"
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { t2: $.data.id }
            - call: "POST /landfill/tickets/${t2}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${t2}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fv2: $.data.version }
            - call: "POST /landfill/tickets/${t2}/post"
              payload: { expected_facility_version: "${fv2}" }
              as: GateOperator
              as_user_id: "op_post"
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { t3: $.data.id }
            - call: "POST /landfill/tickets/${t3}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${t3}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fv3: $.data.version }
            - call: "POST /landfill/tickets/${t3}/post"
              payload: { expected_facility_version: "${fv3}" }
              as: GateOperator
              as_user_id: "op_post"
          trigger:
            - call: "POST /landfill/invoices"
              payload: { hauler_account_id: "${hauler_id}" }
              as: BillingClerk
              as_user_id: "bc1"
              captures: { inv_id: $.data.id, total: $.data.total_cents }
          assert:
            - "Invoice.${inv_id}.tipping_subtotal_cents == 7800"
            - "Invoice.${inv_id}.total_cents == 8484"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ticket_branch_inspect_pass_vs_reject
        grounds:
          - state_machines.Ticket.WEIGHED_to_INSPECTED
          - state_machines.Ticket.WEIGHED_to_REJECTED
          - entities.Ticket.fields.status
        distinguishing_aspect: "On Ticket, the WEIGHED state forks: inspect PASS -> INSPECTED (inspected_by set) while inspect REJECT -> REJECTED (terminal, no airspace/charge), divergent side-effect sets from one state."
        test_recipe:
          setup:
            - "A MSW ticket weighed to net 8.0 tons."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 10.0 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op_insp"
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "REJECT", reject_reason: "contaminated" }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { st: $.data.status }
          assert:
            - "Ticket.${tk_id}.status == REJECTED"
            - "HaulerAccount.${hauler_id}.balance_cents == 0"

      - name: special_waste_branch_approve_vs_deny
        grounds:
          - state_machines.SpecialWasteApproval.PENDING_to_APPROVED
          - state_machines.SpecialWasteApproval.PENDING_to_DENIED
          - entities.Manifest.fields.special_waste_cleared
        distinguishing_aspect: "On SpecialWasteApproval (different entity from Ticket), PENDING forks: APPROVE sets parent Manifest.special_waste_cleared=true, DENY leaves it false — divergent cross-entity side effects."
        test_recipe:
          setup:
            - "A hauler ASBESTOS manifest with a PENDING special-waste approval."
          setup_api_calls:
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/manifests"
              payload: { hauler_account_id: "${hauler_id}", declared_material: "ASBESTOS", declared_weight_tons: 3.0 }
              as: Hauler
              as_user_id: "${hauler_id}"
              captures: { man_id: $.data.id }
            - call: "POST /landfill/manifests/${man_id}/special-waste-approvals"
              payload: { waste_type: "ASBESTOS", profile_ref: "PRF-1" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { swa_id: $.data.id }
          trigger:
            - call: "POST /landfill/special-waste-approvals/${swa_id}/decide"
              payload: { decision: "APPROVE", decision_note: "profile ok" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { st: $.data.status }
          assert:
            - "SpecialWasteApproval.${swa_id}.status == APPROVED"
            - "Manifest.${man_id}.special_waste_cleared == true"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: post_airspace_cascade_cell_full_facility_closed
        grounds:
          - state_machines.Ticket.INSPECTED_to_POSTED
          - state_machines.Cell.OPEN_to_FULL
          - entities.Facility.fields.acceptance_posture
          - entities.Cell.fields.status
        distinguishing_aspect: "Depth-3 chain from ticket post: Ticket.post mutates Cell.consumed (hop1) -> Cell reaches capacity so Cell.status->FULL (hop2) -> the now-FULL last open cell forces Facility.acceptance_posture->CLOSED (hop3)."
        test_recipe:
          setup:
            - "Facility with total airspace 0.75 and a single cell of capacity 0.75; one CONSTRUCTION_DEBRIS ticket (net 0.5, airspace 0.75) INSPECTED."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 0.75 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 0.75 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
          assert:
            - "Cell.${cell_id}.consumed_cubic_yards == 0.75"
            - "Cell.${cell_id}.status == FULL"
            - "Facility.${fac_id}.acceptance_posture == CLOSED"

      - name: payment_settles_invoice_reactivates_hauler
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - state_machines.HaulerAccount.SUSPENDED_to_ACTIVE
          - entities.HaulerAccount.fields.balance_cents
          - calculations.invoice_total
        distinguishing_aspect: "Depth-3 chain from payment: Payment reaches invoice total so Invoice.status->PAID (hop1) -> hauler balance released by tipping_subtotal 5200 (hop2) -> balance falls below limit so HaulerAccount.status->ACTIVE (hop3)."
        test_recipe:
          setup:
            - "SUSPENDED hauler (credit_limit 5200, two posted CONSTRUCTION_DEBRIS tickets bringing balance to 5200) with an ISSUED invoice total 5656."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 5200 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { t1: $.data.id }
            - call: "POST /landfill/tickets/${t1}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${t1}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fv1: $.data.version }
            - call: "POST /landfill/tickets/${t1}/post"
              payload: { expected_facility_version: "${fv1}" }
              as: GateOperator
              as_user_id: "op_post"
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { t2: $.data.id }
            - call: "POST /landfill/tickets/${t2}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${t2}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fv2: $.data.version }
            - call: "POST /landfill/tickets/${t2}/post"
              payload: { expected_facility_version: "${fv2}" }
              as: GateOperator
              as_user_id: "op_post"
            - call: "POST /landfill/invoices"
              payload: { hauler_account_id: "${hauler_id}" }
              as: BillingClerk
              as_user_id: "bc1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /landfill/invoices/${inv_id}/payments"
              payload: { amount_cents: 5656, method: "ACH" }
              as: BillingClerk
              as_user_id: "bc1"
          assert:
            - "Invoice.${inv_id}.status == PAID"
            - "HaulerAccount.${hauler_id}.balance_cents == 0"
            - "HaulerAccount.${hauler_id}.status == ACTIVE"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_post
        grounds:
          - validations[priority=6]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: "Category pair state vs business_fiscal: a WEIGHED (not INSPECTED) ticket whose fee also exceeds the hauler's tiny credit limit returns ERR_INVALID_STATE (priority 6), not ERR_CREDIT_LIMIT_EXCEEDED (priority 13)."
        test_recipe:
          setup:
            - "Hauler credit_limit 100 cents; a MSW ticket weighed (net 8.0, fee 33900) but NOT inspected."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 10.0 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
              captures: { err: $.data.error_id }
          assert:
            - "Ticket.${tk_id}.status == WEIGHED"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: safety_beats_constraint_on_post
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_FACILITY_CLOSED]
          - errors[ERR_NO_AIRSPACE]
        distinguishing_aspect: "Category pair business_safety vs business_constraint: posting an INSPECTED ticket when the facility is CLOSED (gas exceedance) AND has no cell airspace returns ERR_FACILITY_CLOSED (priority 9), not ERR_NO_AIRSPACE (priority 12)."
        test_recipe:
          setup:
            - "Facility with NO cells and gas EXCEEDANCE (methane 500 -> posture CLOSED); a MSW ticket INSPECTED."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 10.0 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/facilities/${fac_id}/gas-readings"
              payload: { methane_ppm: 500, reading_at: "2026-03-01T09:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FACILITY_CLOSED"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: methane_exceedance_500_inclusive_boundary
        grounds:
          - calculations.gas_status
          - entities.Facility.fields.gas_status
          - entities.GasReading.fields.resulting_gas_status
        distinguishing_aspect: "Numeric threshold metric: methane_ppm exactly 500 classifies EXCEEDANCE (>= inclusive), reachable via POST gas-readings; 499 would be ELEVATED."
        test_recipe:
          setup:
            - "A facility with no readings yet."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /landfill/facilities/${fac_id}/gas-readings"
              payload: { methane_ppm: 500, reading_at: "2026-03-01T10:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { rgs: $.data.resulting_gas_status }
          assert:
            - "GasReading.resulting_gas_status == EXCEEDANCE"
            - "Facility.${fac_id}.gas_status == EXCEEDANCE"
            - "Facility.${fac_id}.acceptance_posture == CLOSED"

      - name: empty_load_zero_net_weight_boundary
        grounds:
          - state_machines.Ticket.CREATED_to_WEIGHED
          - validations[priority=12]
          - errors[ERR_EMPTY_LOAD]
        distinguishing_aspect: "Zero-quantity edge on a different metric/endpoint: weigh-out with tare 5.0 == gross 5.0 yields net 0 and is rejected ERR_EMPTY_LOAD at the weigh-out endpoint; any positive net succeeds."
        test_recipe:
          setup:
            - "A MSW ticket created with gross 5.0 tons."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 5.0 }
              as: GateOperator
              as_user_id: "op1"
              captures: { tk_id: $.data.id }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 5.0 }
              as: GateOperator
              as_user_id: "op1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EMPTY_LOAD"
            - "Ticket.${tk_id}.status == CREATED"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ticket_post_requires_facility_not_closed
        grounds:
          - state_machines.Ticket.INSPECTED_to_POSTED
          - entities.Facility.fields.acceptance_posture
          - errors[ERR_FACILITY_CLOSED]
        distinguishing_aspect: "Entity pair Ticket->Facility: an INSPECTED ticket cannot POST while Facility.acceptance_posture == CLOSED (gas exceedance), even though a cell with airspace exists."
        test_recipe:
          setup:
            - "Facility with an OPEN cell holding airspace but gas EXCEEDANCE (posture CLOSED); a MSW ticket INSPECTED."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "MSW", gross_weight_tons: 10.0 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 2.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/facilities/${fac_id}/gas-readings"
              payload: { methane_ppm: 620, reading_at: "2026-03-01T11:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FACILITY_CLOSED"
            - "Ticket.${tk_id}.status == INSPECTED"

      - name: manifest_submit_requires_hauler_active
        grounds:
          - state_machines.Manifest.DRAFT_to_SUBMITTED
          - entities.HaulerAccount.fields.status
          - errors[ERR_HAULER_SUSPENDED]
        distinguishing_aspect: "Entity pair Manifest->HaulerAccount: a DRAFT manifest cannot be SUBMITTED while its HaulerAccount.status == SUSPENDED (balance hit the credit limit)."
        test_recipe:
          setup:
            - "Hauler credit_limit 2600 driven SUSPENDED by one posted CONSTRUCTION_DEBRIS ticket; a second DRAFT manifest for that hauler."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 2600 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { t1: $.data.id }
            - call: "POST /landfill/tickets/${t1}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${t1}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fv1: $.data.version }
            - call: "POST /landfill/tickets/${t1}/post"
              payload: { expected_facility_version: "${fv1}" }
              as: GateOperator
              as_user_id: "op_post"
            - call: "POST /landfill/manifests"
              payload: { hauler_account_id: "${hauler_id}", declared_material: "MSW", declared_weight_tons: 4.0 }
              as: Hauler
              as_user_id: "${hauler_id}"
              captures: { man_id: $.data.id }
          trigger:
            - call: "POST /landfill/manifests/${man_id}/submit"
              payload: {}
              as: Hauler
              as_user_id: "${hauler_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HaulerAccount.${hauler_id}.status == SUSPENDED"
            - "response.data.error_id == ERR_HAULER_SUSPENDED"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: scale_reservation_lane_halfopen_overlap
        grounds:
          - entities.ScaleReservation.fields.window_start
          - entities.ScaleReservation.fields.window_end
          - validations[priority=11]
          - errors[ERR_LANE_OCCUPIED]
        distinguishing_aspect: "Half-open interval semantics on facility+lane: a reservation [10:30,11:30) collides with existing [10:00,11:00) on lane 1 -> ERR_LANE_OCCUPIED, while a touching [11:00,12:00) would be allowed (adjacency permitted)."
        test_recipe:
          setup:
            - "Facility OPEN with a RESERVED lane-1 window [10:00,11:00)."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/scale-reservations"
              payload: { lane_number: 1, truck_ref: "T-1", window_start: "2026-03-02T10:00:00Z", window_end: "2026-03-02T11:00:00Z" }
              as: GateOperator
              as_user_id: "op1"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /landfill/facilities/${fac_id}/scale-reservations"
              payload: { lane_number: 1, truck_ref: "T-2", window_start: "2026-03-02T10:30:00Z", window_end: "2026-03-02T11:30:00Z" }
              as: GateOperator
              as_user_id: "op1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_LANE_OCCUPIED"

      - name: disposal_window_cell_buffer_conflict
        grounds:
          - entities.DisposalWindow.fields.window_start
          - entities.DisposalWindow.fields.window_end
          - validations[priority=11]
          - errors[ERR_WINDOW_CONFLICT]
        distinguishing_aspect: "Closed-interval-plus-60-minute-buffer semantics on a Cell (different resource): a window starting 11:30 is only 30 minutes after an existing [10:00,11:00] window and is rejected ERR_WINDOW_CONFLICT, whereas a 60-minute gap would be allowed."
        test_recipe:
          setup:
            - "A cell with a SCHEDULED ASBESTOS disposal window [10:00,11:00]."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/cells/${cell_id}/disposal-windows"
              payload: { waste_type: "ASBESTOS", window_start: "2026-03-03T10:00:00Z", window_end: "2026-03-03T11:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /landfill/cells/${cell_id}/disposal-windows"
              payload: { waste_type: "ASBESTOS", window_start: "2026-03-03T11:30:00Z", window_end: "2026-03-03T12:30:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "eo1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_WINDOW_CONFLICT"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: post_void_conserves_facility_airspace
        grounds:
          - state_machines.Ticket.INSPECTED_to_POSTED
          - state_machines.Ticket.POSTED_to_VOIDED
          - entities.Facility.fields.consumed_airspace_cubic_yards
          - entities.Cell.fields.consumed_cubic_yards
        distinguishing_aspect: "Conserved quantity = total consumed airspace: after post (Facility.consumed 0.75) then void, Facility.consumed_airspace_cubic_yards returns to 0.0 and the cell reopens — zero drift in cubic yards."
        test_recipe:
          setup:
            - "A POSTED CONSTRUCTION_DEBRIS ticket (net 0.5, airspace 0.75) on a facility whose consumed airspace is 0.75."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/void"
              payload: {}
              as: GateOperator
              as_user_id: "op_post"
          assert:
            - "Ticket.${tk_id}.status == VOIDED"
            - "Cell.${cell_id}.consumed_cubic_yards == 0.0"
            - "Facility.${fac_id}.consumed_airspace_cubic_yards == 0.0"

      - name: post_void_conserves_hauler_balance
        grounds:
          - state_machines.Ticket.INSPECTED_to_POSTED
          - state_machines.Ticket.POSTED_to_VOIDED
          - entities.HaulerAccount.fields.balance_cents
        distinguishing_aspect: "Conserved quantity = hauler receivable in cents: post charges balance +2600 then void reverses it, returning HaulerAccount.balance_cents to 0 — a different conserved quantity (money) than airspace."
        test_recipe:
          setup:
            - "A POSTED CONSTRUCTION_DEBRIS ticket (fee 2600) that charged the hauler's balance to 2600."
          setup_api_calls:
            - call: "POST /landfill/facilities"
              payload: { name: "F1", total_airspace_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /landfill/facilities/${fac_id}/cells"
              payload: { name: "C1", capacity_cubic_yards: 1000 }
              as: FacilityAdmin
              captures: { cell_id: $.data.id }
            - call: "POST /landfill/hauler-accounts"
              payload: { name: "H1", credit_limit_cents: 100000000 }
              as: FacilityAdmin
              captures: { hauler_id: $.data.id }
            - call: "POST /landfill/tickets"
              payload: { facility_id: "${fac_id}", hauler_account_id: "${hauler_id}", material: "CONSTRUCTION_DEBRIS", gross_weight_tons: 1.5 }
              as: GateOperator
              as_user_id: "op_insp"
              captures: { tk_id: $.data.id }
            - call: "POST /landfill/tickets/${tk_id}/weigh-out"
              payload: { tare_weight_tons: 1.0 }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "POST /landfill/tickets/${tk_id}/inspect"
              payload: { result: "PASS" }
              as: GateOperator
              as_user_id: "op_insp"
            - call: "GET /landfill/facilities/${fac_id}"
              as: GateOperator
              as_user_id: "op_post"
              captures: { fac_v: $.data.version }
            - call: "POST /landfill/tickets/${tk_id}/post"
              payload: { expected_facility_version: "${fac_v}" }
              as: GateOperator
              as_user_id: "op_post"
          trigger:
            - call: "POST /landfill/tickets/${tk_id}/void"
              payload: {}
              as: GateOperator
              as_user_id: "op_post"
          assert:
