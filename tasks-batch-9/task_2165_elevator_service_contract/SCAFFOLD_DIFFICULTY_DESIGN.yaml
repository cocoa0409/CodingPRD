              as_user_id: "pa-1"
              captures: { i1_id: $.data.id }
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${ki_id}", car_code: "CAR-I2", car_type: "TRACTION", capacity_lbs: 3000 }
