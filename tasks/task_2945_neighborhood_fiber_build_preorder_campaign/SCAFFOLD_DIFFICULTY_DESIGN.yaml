          setup:
            - "Campaign with deposit_amount_cents 1000; zone with household_count 10, threshold_pct 10.00 and required_permit_types [ROW, TRAFFIC_CONTROL]."
            - "One SERVICEABLE address and one preorder, so the final rate is 10.00."
            - "ROW permit APPROVED; TRAFFIC_CONTROL application created and SUBMITTED but not decided."
            - "One pole request ATTACHED on a 12000-cent quote, so pole readiness is already satisfied."
            - "Clock 2026-10-01T00:00:00Z with qualification-run and sequencing-run executed, so the zone is QUALIFIED and SEQUENCED."
