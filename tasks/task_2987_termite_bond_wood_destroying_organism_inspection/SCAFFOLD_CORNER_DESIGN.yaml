            - "an empty X-User-Role returns 401 ERR_UNAUTHENTICATED, and an empty X-User-ID returns the same 401: both headers are required and emptiness counts as absence"
            - "the unknown role posting a property returns 403 ERR_UNAUTHORIZED, not 400 — priority 20 precedes shape validation, and no property row is created"
            - "GET /_clock/current with no identity headers returns 200 with current_utc 2026-08-01T00:00:00.000Z: the clock read is the only endpoint exempt from priority 10"

