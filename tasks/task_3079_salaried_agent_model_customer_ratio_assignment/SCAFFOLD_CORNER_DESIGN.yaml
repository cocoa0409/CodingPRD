          - state_machines.Survey.transitions.DISPATCHED_to_EXPIRED_DISPATCH
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A DISPATCHED survey answers once (RESPONDED); a second respond is refused with ERR_INVALID_STATE, and a survey that has aged through two ops runs first answers via the EXPIRED_DISPATCH -> RESPONDED leg instead — the second trigger is not a duplicate of the first."
        test_recipe:
          setup:
