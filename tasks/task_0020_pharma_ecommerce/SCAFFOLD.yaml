# =============================================================================
# Pharmaceutical e-commerce compliance benchmark — SCAFFOLD.yaml
# =============================================================================

scenario: |
  Pharmaceutical e-commerce compliance system: drug catalog management with
  national drug code validation, OTC/prescription classification, special-control
  category tagging (narcotic/psychotropic/toxic), shelving review, and indication
  and contraindication information; prescription review with prescription upload,
  prescriber qualification verification, prescription validity period check,
  drug-prescription matching, and prescription archiving; pharmacist re-review
  with qualified-pharmacist assignment, drug interaction check, dosage rationality
  review, dispensing approval, and review-record retention; purchase limit rules
  with per-order/per-period quantity caps by drug category, real-name purchase
  requirements, special-population restrictions, and multi-order aggregation
  detection; cold chain delivery with cold-chain drug identification,
  temperature-monitoring device dispatch, courier qualification check,
  transit-temperature record collection, and out-of-range disposal; adverse drug
  reaction reporting with patient-reported and pharmacist-identified entry,
  severity classification, regulatory authority submission within reporting
  deadlines, follow-up tracking, and case-record archiving; qualification annual
  review with vendor business license, drug operation permit, pharmacist
  certificate, expiration alerts, and re-submission workflow; event-driven
  synchronization with regulatory authority, payment, logistics, and electronic
  prescription platform; audit logging for prescription review and sales records.

domain_name: pharma-ecommerce
api_prefix: /pharma-platforms

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: "compliance / audit"
  secondary_archetype: "workflow orchestration"
  complexity_layers:
    - "cascading side effects"
    - "scheduled / deferred actions"
    - "derived field reconciliation"
    - "idempotency"
  entity_topology: hybrid
  # PharmaPlatform is the top-level aggregate; Drug, Vendor, Pharmacist, Customer
  # sit flat under it with FK references. Prescription/Order/PharmacistReview
  # form a chain. AuditLog and ExternalEvent are append-only event logs.
  state_machine_shape: branching
  # Prescription: branching with revert (APPROVED → REVIEW_PENDING revoke loop).
  # PharmacistReview: cyclic (REQUEST_CHANGE returns to IN_REVIEW).
  # Order: parallel dimensions (payment_status × dispensing_status).
  # AdverseReactionReport: branching (FOLLOW_UP_PENDING fork + ARCHIVED join).
  # Vendor: cyclic (REVIEW_REQUIRED ↔ ACTIVE via re-submission).
  relationship_patterns:
    - one_to_many       # PharmaPlatform → Drug, Vendor, Customer, Order, ...
    - cross_aggregate   # Order references Drug, Vendor, Customer, Prescription, PharmacistReview
    - polymorphic       # AuditLog.subject_type can reference Prescription, Order, AdverseReactionReport, Vendor
  role_model: segregation_of_duties
  # The pharmacist who performed prescription review (PrescriptionReviewer)
  # MUST NOT be the same identity as the pharmacist re-reviewing the order
  # (PharmacistReReviewer); enforced by ERR_SEGREGATION_OF_DUTIES_VIOLATION.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PharmaPlatform
    parent: null
    common_fields: true
    fields:
      - { name: name,                 type: string,   source: input,    description: "Platform display name" }
      - { name: jurisdiction,         type: string,   source: input,    description: "Regulatory jurisdiction code (e.g., CN, US-CA)" }
      - { name: current_clock_iso,    type: datetime, source: system,   default: "1970-01-01T00:00:00.000Z", description: "Deterministic platform clock; advances only via POST /_clock/advance" }
      - { name: regulatory_endpoint,  type: string,   source: input,    description: "Mock regulatory submission endpoint identifier (free-form string; events recorded against this id)" }

  - name: Drug
    parent: PharmaPlatform
    common_fields: true
    fields:
      - { name: platform_id,            type: string,  source: system, description: "Parent platform" }
      - { name: ndc,                    type: string,  source: input,  description: "National Drug Code, must match regex ^\\d{4,5}-\\d{3,4}-\\d{1,2}$ and be unique per platform" }
      - { name: name,                   type: string,  source: input,  description: "Trade name" }
      - { name: classification,         type: enum,    source: input,  description: "OTC | PRESCRIPTION", constraints: "values: OTC, PRESCRIPTION" }
      - { name: control_category,       type: enum,    source: input,  description: "Special-control tag", constraints: "values: NONE, NARCOTIC, PSYCHOTROPIC_I, PSYCHOTROPIC_II, TOXIC" }
      - { name: cold_chain_required,    type: boolean, source: input,  default: false, description: "Whether the drug must be transported under cold chain (2–8 °C)" }
      - { name: indications,            type: array,   source: input,  description: "List of indication keywords" }
      - { name: contraindications,      type: array,   source: input,  description: "List of contraindication keywords (e.g., PREGNANCY, MINOR, RENAL_FAILURE)" }
      - { name: per_order_qty_cap,      type: integer, source: input,  description: "Maximum units allowed in a single Order (must be >= 1)" }
      - { name: per_period_qty_cap,     type: integer, source: input,  description: "Maximum units a single Customer may purchase across orders within PERIOD_DAYS" }
      - { name: vendor_id,              type: string,  source: input,  description: "Vendor that supplies this drug" }
      - { name: status,                 type: enum,    source: system, description: "Shelving status", constraints: "values: PENDING_REVIEW, ON_SHELF, OFF_SHELF" }

  - name: Vendor
    parent: PharmaPlatform
    common_fields: true
    fields:
      - { name: platform_id,                       type: string,   source: system, description: "Parent platform" }
      - { name: name,                              type: string,   source: input,  description: "Vendor legal name" }
      - { name: business_license_no,               type: string,   source: input,  description: "Business license number" }
      - { name: business_license_expires_at,       type: datetime, source: input,  description: "Business license expiry (ISO8601 UTC)" }
      - { name: drug_operation_permit_no,          type: string,   source: input,  description: "Drug operation permit number" }
      - { name: drug_operation_permit_expires_at,  type: datetime, source: input,  description: "Drug operation permit expiry" }
      - { name: qualification_status,              type: enum,     source: system, description: "Annual review status", constraints: "values: ACTIVE, REVIEW_REQUIRED, SUSPENDED" }
      - { name: latest_review_submitted_at,        type: datetime, source: system, default: null, description: "Timestamp of most recent re-submission" }

  - name: Pharmacist
    parent: PharmaPlatform
    common_fields: true
    fields:
      - { name: platform_id,             type: string,   source: system, description: "Parent platform" }
      - { name: full_name,               type: string,   source: input,  description: "Pharmacist legal name" }
      - { name: certificate_no,          type: string,   source: input,  description: "Pharmacist certificate number" }
      - { name: certificate_expires_at,  type: datetime, source: input,  description: "Certificate expiry (ISO8601 UTC)" }
      - { name: qualification_status,    type: enum,     source: system, description: "Active or expired", constraints: "values: ACTIVE, EXPIRED, SUSPENDED" }
      - { name: courier_qualified,       type: boolean,  source: input,  default: false, description: "Whether this pharmacist is also a qualified cold-chain courier (used by ColdChainShipment courier check)" }

  - name: Customer
    parent: PharmaPlatform
    common_fields: true
    fields:
      - { name: platform_id,             type: string,   source: system, description: "Parent platform" }
      - { name: real_name,               type: string,   source: input,  description: "Customer legal name (real-name purchase requirement)" }
      - { name: id_document_no,          type: string,   source: input,  description: "Government ID number; non-empty required for any prescription drug purchase" }
      - { name: special_population_flags, type: array,   source: input,  description: "Subset of {PREGNANCY, MINOR, RENAL_FAILURE, GERIATRIC}; used by drug.contraindications match" }
      - { name: real_name_verified,      type: boolean,  source: input,  default: false, description: "True after offline ID verification" }

  - name: Prescription
    parent: PharmaPlatform
    common_fields: true
    fields:
      - { name: platform_id,                type: string,   source: system, description: "Parent platform" }
      - { name: customer_id,                type: string,   source: input,  description: "Patient on the prescription" }
      - { name: prescriber_name,            type: string,   source: input,  description: "Prescribing physician name" }
      - { name: prescriber_license_no,      type: string,   source: input,  description: "Prescribing physician license number; ERR_PRESCRIBER_NOT_QUALIFIED if absent or matches a denylist seeded via POST /platforms/{pid}/prescriber-denylist" }
      - { name: image_url,                  type: string,   source: input,  description: "Uploaded prescription image URL" }
      - { name: issued_at,                  type: datetime, source: input,  description: "Date prescription was written" }
      - { name: validity_days,              type: integer,  source: input,  description: "Validity in days from issued_at; defaults vary by control_category but client supplies value (server enforces caps; see validity_days_cap)" }
      - { name: drug_items,                 type: array,    source: input,  description: "List of {drug_id, qty} pairs the prescription authorises" }
      - { name: reviewer_pharmacist_id,     type: string,   source: system, default: null, description: "Pharmacist who approved this prescription (set on APPROVE)" }
      - { name: archived_at,                type: datetime, source: system, default: null, description: "Timestamp at which the prescription was archived (terminal step after order delivery)" }
      - { name: status,                     type: enum,     source: system, description: "UPLOADED → REVIEW_PENDING → APPROVED / REJECTED → REVOKED → ARCHIVED", constraints: "values: UPLOADED, REVIEW_PENDING, APPROVED, REJECTED, REVOKED, ARCHIVED" }

  - name: PurchaseLimitRule
    parent: PharmaPlatform
    common_fields: true
    fields:
      - { name: platform_id,         type: string,  source: system, description: "Parent platform" }
      - { name: control_category,    type: enum,    source: input,  description: "Drug control category this rule covers", constraints: "values: NONE, NARCOTIC, PSYCHOTROPIC_I, PSYCHOTROPIC_II, TOXIC" }
      - { name: window_days,         type: integer, source: input,  description: "Rolling window length (closed at left, open at right) in days" }
      - { name: max_units_per_window, type: integer, source: input,  description: "Aggregate cap across all the customer's PAID orders in the window" }
      - { name: blocks_special_populations, type: array, source: input, description: "Subset of {PREGNANCY, MINOR, RENAL_FAILURE, GERIATRIC} that may NOT purchase any drug in this category" }

  - name: Order
    parent: PharmaPlatform
    common_fields: true
    fields:
      - { name: platform_id,             type: string,   source: system, description: "Parent platform" }
      - { name: customer_id,             type: string,   source: input,  description: "Buying customer" }
      - { name: prescription_id,         type: string,   source: input,  default: null, description: "Required when any line is a PRESCRIPTION drug; null otherwise" }
      - { name: items,                   type: array,    source: input,  description: "Order lines: [{drug_id, qty, unit_price_cents}], at least one element" }
      - { name: total_amount_cents,      type: integer,  source: computed, description: "Sum of qty*unit_price_cents over items (no rounding — integer cents)" }
      - { name: cold_chain_required,     type: boolean,  source: computed, description: "True iff any item.drug.cold_chain_required is true" }
      - { name: payment_status,          type: enum,     source: system, description: "UNPAID → PAID → REFUNDED", constraints: "values: UNPAID, PAID, REFUNDED" }
      - { name: dispensing_status,       type: enum,     source: system, description: "PENDING_REVIEW → PHARMACIST_REVIEWING → APPROVED → DISPENSED → SHIPPED → DELIVERED; or REJECTED / CANCELLED branches", constraints: "values: PENDING_REVIEW, PHARMACIST_REVIEWING, APPROVED, REJECTED, DISPENSED, SHIPPED, DELIVERED, CANCELLED" }
      - { name: paid_at,                 type: datetime, source: system, default: null, description: "Set when payment_status flips to PAID" }
      - { name: pharmacist_review_id,    type: string,   source: system, default: null, description: "Set when a PharmacistReview is opened for this order" }
      - { name: cold_chain_shipment_id,  type: string,   source: system, default: null, description: "Set when a ColdChainShipment is dispatched" }

  - name: PharmacistReview
    parent: Order
    common_fields: true
    fields:
      - { name: platform_id,                  type: string,   source: system, description: "Parent platform (denormalized)" }
      - { name: order_id,                     type: string,   source: system, description: "Order under review" }
      - { name: assigned_pharmacist_id,       type: string,   source: input,  description: "Pharmacist assigned for re-review (must differ from prescription's reviewer_pharmacist_id — see ERR_SEGREGATION_OF_DUTIES_VIOLATION)" }
      - { name: interaction_check_passed,     type: boolean,  source: input,  default: null, description: "Result of drug-interaction screening (set when reviewer submits decision)" }
      - { name: dosage_rationality_passed,    type: boolean,  source: input,  default: null, description: "Result of dosage rationality screening" }
      - { name: decision_notes,               type: string,   source: input,  default: null, description: "Free-form notes; required when status flips to REQUEST_CHANGE or REJECTED" }
      - { name: revision_count,               type: integer,  source: system, default: 0, description: "Number of REQUEST_CHANGE → IN_REVIEW round-trips" }
      - { name: status,                       type: enum,     source: system, description: "PENDING → IN_REVIEW → APPROVED / REJECTED / REQUEST_CHANGE; REQUEST_CHANGE → IN_REVIEW (cycle)", constraints: "values: PENDING, IN_REVIEW, APPROVED, REJECTED, REQUEST_CHANGE" }

  - name: ColdChainShipment
    parent: Order
    common_fields: true
    fields:
      - { name: platform_id,           type: string,   source: system, description: "Parent platform" }
      - { name: order_id,              type: string,   source: system, description: "Associated order" }
      - { name: courier_pharmacist_id, type: string,   source: input,  description: "Pharmacist with courier_qualified=true who carries the shipment" }
      - { name: device_id,             type: string,   source: input,  description: "Identifier of the temperature-monitoring device dispatched" }
      - { name: dispatched_at,         type: datetime, source: system, description: "Set on DISPATCHED transition (= platform clock at dispatch)" }
      - { name: temperature_readings,  type: array,    source: input,  description: "Append-only list of {recorded_at, celsius_tenths}; celsius_tenths is integer °C × 10 (e.g., 27 means 2.7 °C). Each appended reading recomputes excursion_score." }
      - { name: excursion_score,       type: integer,  source: computed, description: "Sum over readings of severity_points × max(1, ceil(reading_window_minutes)); see calculations.cold_chain_excursion_score for ordering" }
      - { name: status,                type: enum,     source: system, description: "DISPATCHED → IN_TRANSIT → DELIVERED / DISPOSED", constraints: "values: DISPATCHED, IN_TRANSIT, DELIVERED, DISPOSED" }

  - name: AdverseReactionReport
    parent: PharmaPlatform
    common_fields: true
    fields:
      - { name: platform_id,             type: string,   source: system, description: "Parent platform" }
      - { name: order_id,                type: string,   source: input,  default: null, description: "Originating order, optional" }
      - { name: drug_id,                 type: string,   source: input,  description: "Drug implicated in the reaction" }
      - { name: customer_id,             type: string,   source: input,  description: "Patient who experienced the reaction" }
      - { name: reporter_kind,           type: enum,     source: input,  description: "Who entered the report", constraints: "values: PATIENT, PHARMACIST" }
      - { name: severity,                type: enum,     source: input,  description: "Initial classification at intake", constraints: "values: NON_SERIOUS, SERIOUS" }
      - { name: reported_at,             type: datetime, source: system, description: "Set to platform clock on creation" }
      - { name: reporting_deadline_at,   type: datetime, source: computed, description: "Computed at creation; recomputed if severity is escalated" }
      - { name: submitted_to_authority_at, type: datetime, source: system, default: null, description: "Set on REPORTED → SUBMITTED" }
      - { name: follow_up_due_at,        type: datetime, source: computed, default: null, description: "For SERIOUS reports: submitted_to_authority_at + FOLLOW_UP_DAYS days" }
      - { name: archived_at,             type: datetime, source: system, default: null, description: "Set on transition into ARCHIVED" }
      - { name: status,                  type: enum,     source: system, description: "REPORTED → SUBMITTED → ACKNOWLEDGED / FOLLOW_UP_PENDING → ARCHIVED", constraints: "values: REPORTED, SUBMITTED, ACKNOWLEDGED, FOLLOW_UP_PENDING, ARCHIVED" }

  - name: AuditLog
    parent: PharmaPlatform
    common_fields: false   # immutable append-only
    fields:
      - { name: platform_id,    type: string,   source: system, description: "Parent platform" }
      - { name: subject_type,   type: enum,     source: system, description: "Polymorphic subject", constraints: "values: PRESCRIPTION, ORDER, PHARMACIST_REVIEW, COLD_CHAIN_SHIPMENT, ADVERSE_REACTION_REPORT, VENDOR" }
      - { name: subject_id,     type: string,   source: system, description: "Subject row id" }
      - { name: action,         type: enum,     source: system, description: "Discrete event name", constraints: "values: PRESCRIPTION_APPROVED, PRESCRIPTION_REJECTED, PRESCRIPTION_REVOKED, PHARMACIST_REVIEW_APPROVED, PHARMACIST_REVIEW_REJECTED, PHARMACIST_REVIEW_REQUEST_CHANGE, ORDER_DISPENSED, ORDER_SHIPPED, ORDER_DELIVERED, ORDER_REFUNDED, COLD_CHAIN_DISPOSED, ADR_SUBMITTED, ADR_ARCHIVED, VENDOR_SUSPENDED" }
      - { name: actor_role,     type: string,   source: system, description: "X-User-Role at time of action; 'system' for auto transitions" }
      - { name: actor_id,       type: string,   source: system, description: "X-User-ID at time of action; 'system' for auto" }
      - { name: occurred_at,    type: datetime, source: system, description: "Platform clock at action time" }
      - { name: payload,        type: object,   source: system, description: "Snapshot of relevant fields at the moment of action (e.g., for ORDER_DISPENSED: {dispensing_status, total_amount_cents, version})" }

  - name: ExternalEvent
    parent: PharmaPlatform
    common_fields: false  # append-only
    fields:
      - { name: platform_id,    type: string,   source: system, description: "Parent platform" }
      - { name: channel,        type: enum,     source: system, description: "Outbound integration", constraints: "values: REGULATORY_AUTHORITY, PAYMENT, LOGISTICS, E_PRESCRIPTION_PLATFORM" }
      - { name: event_type,     type: string,   source: system, description: "e.g., 'adr.submitted', 'order.paid', 'shipment.dispatched', 'prescription.archived'" }
      - { name: subject_type,   type: enum,     source: system, description: "Same value set as AuditLog.subject_type" }
      - { name: subject_id,     type: string,   source: system, description: "Subject row id" }
      - { name: occurred_at,    type: datetime, source: system, description: "Platform clock at event emission" }
      - { name: payload,        type: object,   source: system, description: "Channel-specific payload (e.g., REGULATORY_AUTHORITY for adr.submitted: {report_id, severity, deadline_at})" }
      - { name: idempotency_key, type: string,  source: system, description: "Stable key for this event (e.g., '{event_type}:{subject_id}:{version}'); duplicate emissions are suppressed" }

  - name: PrescriberDenylistEntry
    parent: PharmaPlatform
    common_fields: false
    fields:
      - { name: platform_id,         type: string, source: system, description: "Parent platform" }
      - { name: prescriber_license_no, type: string, source: input, description: "License numbers on this list cause ERR_PRESCRIBER_NOT_QUALIFIED on prescription upload" }
      - { name: reason,              type: string, source: input,  description: "Free-form reason" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Drug
    initial_state: PENDING_REVIEW
    terminal_states: []          # ON_SHELF and OFF_SHELF are both reversible
    transitions:
      - from: PENDING_REVIEW
        to: ON_SHELF
        trigger: POST /platforms/{pid}/drugs/{drugId}/shelve
        actor: PlatformAdmin
        preconditions:
          - "Drug currently PENDING_REVIEW (ERR_DRUG_NOT_PENDING_REVIEW)"
          - "Drug.vendor.qualification_status == ACTIVE (ERR_VENDOR_NOT_ACTIVE) — cross-entity"
          - "Drug.ndc unique among ON_SHELF drugs of platform (ERR_NDC_DUPLICATE)"
          - "If control_category != NONE: classification MUST be PRESCRIPTION (ERR_CONTROL_CATEGORY_REQUIRES_PRESCRIPTION)"
        side_effects: []
      - from: ON_SHELF
        to: OFF_SHELF
        trigger: POST /platforms/{pid}/drugs/{drugId}/off-shelve
        actor: PlatformAdmin
        preconditions:
          - "Drug currently ON_SHELF (ERR_DRUG_NOT_ON_SHELF)"
        side_effects:
          - "Outstanding Orders that contain this drug AND have dispensing_status IN {PENDING_REVIEW, PHARMACIST_REVIEWING}: dispensing_status → REJECTED (cascade)."
          - "Each cascaded Order also writes an AuditLog with action=ORDER_DISPENSED-superseded subject not applicable; actually appends action=PHARMACIST_REVIEW_REJECTED only if its review existed — see Order REJECTED transition."
      - from: OFF_SHELF
        to: ON_SHELF
        trigger: POST /platforms/{pid}/drugs/{drugId}/shelve
        actor: PlatformAdmin
        preconditions:
          - "Drug currently OFF_SHELF (ERR_DRUG_NOT_OFF_SHELF — when caller intends a re-shelve; wired via the same endpoint)"
          - "Drug.vendor.qualification_status == ACTIVE (ERR_VENDOR_NOT_ACTIVE)"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: Vendor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: REVIEW_REQUIRED
        trigger: "system (auto, when platform clock crosses min(business_license_expires_at, drug_operation_permit_expires_at) — ALERT_DAYS days), evaluated at POST /_clock/advance"
        actor: system
        preconditions:
          - "Vendor.qualification_status == ACTIVE"
          - "platform.current_clock_iso >= min(license_expires_at, permit_expires_at) - ALERT_DAYS"
        side_effects:
          - "Append AuditLog action=VENDOR_SUSPENDED-precursor not applicable; for ACTIVE→REVIEW_REQUIRED no AuditLog entry, but ExternalEvent channel=REGULATORY_AUTHORITY event_type='vendor.review_required' is emitted (idempotency_key: 'vendor.review_required:{vendor_id}:{version}')"
      - from: REVIEW_REQUIRED
        to: SUSPENDED
        trigger: "system (auto, when platform clock >= max(business_license_expires_at, drug_operation_permit_expires_at)), evaluated at POST /_clock/advance"
        actor: system
        preconditions:
          - "Vendor.qualification_status == REVIEW_REQUIRED"
          - "platform.current_clock_iso >= max(license_expires_at, permit_expires_at)"
        side_effects:
          - "Append AuditLog action=VENDOR_SUSPENDED, subject_type=VENDOR"
          - "All ON_SHELF Drugs of this vendor: status → OFF_SHELF (cascade depth 1)"
          - "Cascading Drug OFF_SHELF cancels in-flight Orders with that drug per Drug ON_SHELF→OFF_SHELF rule (cascade depth 2)"
      - from: REVIEW_REQUIRED
        to: ACTIVE
        trigger: POST /platforms/{pid}/vendors/{vendorId}/resubmit-qualification
        actor: VendorAdmin
        preconditions:
          - "Vendor currently in REVIEW_REQUIRED (ERR_VENDOR_NOT_IN_REVIEW)"
          - "Body provides new business_license_expires_at and drug_operation_permit_expires_at strictly greater than platform.current_clock_iso (ERR_RENEWAL_DATE_NOT_FUTURE)"
        side_effects:
          - "latest_review_submitted_at = platform.current_clock_iso"
          - "Vendor.qualification_status → ACTIVE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /platforms/{pid}/vendors/{vendorId}/resubmit-qualification
        actor: VendorAdmin
        preconditions:
          - "Vendor currently SUSPENDED (ERR_VENDOR_NOT_SUSPENDED is not raised here — same endpoint accepted; only ERR_VENDOR_NOT_RENEWABLE if status not in {REVIEW_REQUIRED, SUSPENDED})"
          - "Body renewal dates strictly greater than platform clock (ERR_RENEWAL_DATE_NOT_FUTURE)"
        side_effects:
          - "Vendor.qualification_status → ACTIVE"
          - "Vendor's drugs remain OFF_SHELF (no auto re-shelve — operator must re-shelve manually)"

  # ---------------------------------------------------------------------------
  - entity: Pharmacist
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (auto on POST /_clock/advance when platform clock >= certificate_expires_at)"
        actor: system
        preconditions:
          - "Pharmacist.qualification_status == ACTIVE"
        side_effects: []
      - from: EXPIRED
        to: ACTIVE
        trigger: POST /platforms/{pid}/pharmacists/{pharmacistId}/renew-certificate
        actor: PlatformAdmin
        preconditions:
          - "Body provides new certificate_expires_at strictly greater than platform clock (ERR_RENEWAL_DATE_NOT_FUTURE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /platforms/{pid}/pharmacists/{pharmacistId}/suspend
        actor: PlatformAdmin
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: Prescription
    initial_state: UPLOADED
    terminal_states: [REJECTED, ARCHIVED, REVOKED]
    transitions:
      - from: UPLOADED
        to: REVIEW_PENDING
        trigger: "system (auto on POST /platforms/{pid}/prescriptions creation, after input validation passes)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVIEW_PENDING
        to: APPROVED
        trigger: POST /platforms/{pid}/prescriptions/{rxId}/approve
        actor: PrescriptionReviewer
        preconditions:
          - "Pharmacist (acting as reviewer) qualification_status == ACTIVE (ERR_PHARMACIST_NOT_ACTIVE)"
          - "platform.current_clock_iso < issued_at + min(validity_days, validity_days_cap_for_control_category) (ERR_PRESCRIPTION_EXPIRED)"
          - "prescriber_license_no NOT in PrescriberDenylistEntry (ERR_PRESCRIBER_NOT_QUALIFIED)"
          - "Every drug_items[].drug_id resolves to a Drug with status==ON_SHELF AND classification==PRESCRIPTION (ERR_DRUG_NOT_PRESCRIBABLE)"
          - "For each drug whose contraindications intersect customer.special_population_flags: reject (ERR_CONTRAINDICATION_VIOLATION)"
        side_effects:
          - "reviewer_pharmacist_id = X-User-ID"
          - "Append AuditLog action=PRESCRIPTION_APPROVED, subject_type=PRESCRIPTION"
          - "Emit ExternalEvent channel=E_PRESCRIPTION_PLATFORM, event_type='prescription.approved', idempotency_key='prescription.approved:{rx_id}:{version}'"
      - from: REVIEW_PENDING
        to: REJECTED
        trigger: POST /platforms/{pid}/prescriptions/{rxId}/reject
        actor: PrescriptionReviewer
        preconditions: []
        side_effects:
          - "Append AuditLog action=PRESCRIPTION_REJECTED"
      - from: APPROVED
        to: REVOKED
        trigger: POST /platforms/{pid}/prescriptions/{rxId}/revoke
        actor: PrescriptionReviewer
        preconditions:
          - "No Order in {PHARMACIST_REVIEWING, APPROVED, DISPENSED, SHIPPED, DELIVERED} references this prescription (ERR_PRESCRIPTION_IN_USE)"
        side_effects:
          - "Append AuditLog action=PRESCRIPTION_REVOKED"
          - "Emit ExternalEvent channel=E_PRESCRIPTION_PLATFORM, event_type='prescription.revoked'"
          - "Outstanding Orders in PENDING_REVIEW dispensing_status referencing this prescription: dispensing_status → CANCELLED (cascade)"
      - from: APPROVED
        to: ARCHIVED
        trigger: "system (auto when ALL referencing Orders reach DELIVERED, cancelled, or refunded states; evaluated at the moment an Order transitions to DELIVERED / CANCELLED / REFUNDED)"
        actor: system
        preconditions:
          - "Prescription currently APPROVED"
          - "No referencing Order in {PENDING_REVIEW, PHARMACIST_REVIEWING, APPROVED, DISPENSED, SHIPPED}"
        side_effects:
          - "archived_at = platform.current_clock_iso"
          - "Append AuditLog action=PRESCRIPTION_REVOKED-not applicable; uses action=ADR_ARCHIVED is wrong; emits no AuditLog (archive is bookkeeping). Emits ExternalEvent channel=E_PRESCRIPTION_PLATFORM event_type='prescription.archived'."

  # ---------------------------------------------------------------------------
  - entity: Order
    initial_state: PENDING_REVIEW   # this is the dispensing_status initial; payment_status starts UNPAID
    terminal_states: [DELIVERED, CANCELLED, REJECTED]
    transitions:
      # ----- Payment dimension (parallel state) -----
      - from: "payment:UNPAID"
        to: "payment:PAID"
        trigger: POST /platforms/{pid}/orders/{orderId}/pay
        actor: Customer
        preconditions:
          - "dispensing_status == PHARMACIST_REVIEWING OR APPROVED OR PENDING_REVIEW (ERR_ORDER_NOT_PAYABLE: must not be REJECTED/CANCELLED)"
          - "If any item.drug.classification==PRESCRIPTION: prescription_id is set AND Prescription.status==APPROVED (ERR_PRESCRIPTION_NOT_APPROVED)"
        side_effects:
          - "paid_at = platform.current_clock_iso"
          - "Emit ExternalEvent channel=PAYMENT, event_type='order.paid', idempotency_key='order.paid:{order_id}:{version}'"
      - from: "payment:PAID"
        to: "payment:REFUNDED"
        trigger: "system (auto when dispensing_status flips to REJECTED or CANCELLED while payment_status==PAID)"
        actor: system
        preconditions: []
        side_effects:
          - "Append AuditLog action=ORDER_REFUNDED, subject_type=ORDER"
          - "Emit ExternalEvent channel=PAYMENT event_type='order.refunded' (idempotency_key='order.refunded:{order_id}:{version}')"
      # ----- Dispensing dimension -----
      - from: "dispensing:PENDING_REVIEW"
        to: "dispensing:PHARMACIST_REVIEWING"
        trigger: POST /platforms/{pid}/orders/{orderId}/open-pharmacist-review
        actor: PharmacistReReviewer
        preconditions:
          - "Order.dispensing_status == PENDING_REVIEW (ERR_ORDER_NOT_REVIEWABLE)"
          - "If any item is PRESCRIPTION drug: Prescription.status == APPROVED (ERR_PRESCRIPTION_NOT_APPROVED)"
          - "X-User-ID (acting pharmacist) != Prescription.reviewer_pharmacist_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION) — see segregation_of_duties role rule"
          - "Pharmacist.qualification_status == ACTIVE (ERR_PHARMACIST_NOT_ACTIVE)"
          - "Purchase-limit check passes (ERR_PURCHASE_LIMIT_EXCEEDED) — see calculations.purchase_limit_aggregation"
          - "Special-population check passes (ERR_SPECIAL_POPULATION_RESTRICTED)"
        side_effects:
          - "Create PharmacistReview with status=IN_REVIEW (creation skips PENDING)"
          - "Order.pharmacist_review_id = new review id"
      - from: "dispensing:PHARMACIST_REVIEWING"
        to: "dispensing:APPROVED"
        trigger: "system (auto when PharmacistReview.status flips to APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Append AuditLog action=PHARMACIST_REVIEW_APPROVED"
      - from: "dispensing:PHARMACIST_REVIEWING"
        to: "dispensing:REJECTED"
        trigger: "system (auto when PharmacistReview.status flips to REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Append AuditLog action=PHARMACIST_REVIEW_REJECTED"
          - "If payment_status==PAID: payment_status → REFUNDED (cascade depth 2 via Payment dimension)"
          - "If prescription's only outstanding referencing Order was this one: Prescription auto-archive evaluation runs (cascade depth 3)"
      - from: "dispensing:APPROVED"
        to: "dispensing:DISPENSED"
        trigger: POST /platforms/{pid}/orders/{orderId}/dispense
        actor: Pharmacist
        preconditions:
          - "Order.dispensing_status == APPROVED (ERR_ORDER_NOT_APPROVED)"
          - "Order.payment_status == PAID (ERR_ORDER_NOT_PAID)"
        side_effects:
          - "Append AuditLog action=ORDER_DISPENSED"
      - from: "dispensing:DISPENSED"
        to: "dispensing:SHIPPED"
        trigger: POST /platforms/{pid}/orders/{orderId}/ship
        actor: PlatformAdmin
        preconditions:
          - "Order.dispensing_status == DISPENSED (ERR_ORDER_NOT_DISPENSED)"
          - "If cold_chain_required: a ColdChainShipment must exist with status==DISPATCHED (ERR_COLD_CHAIN_SHIPMENT_REQUIRED)"
        side_effects:
          - "Append AuditLog action=ORDER_SHIPPED"
          - "Emit ExternalEvent channel=LOGISTICS event_type='order.shipped'"
          - "If cold_chain_shipment exists: ColdChainShipment.status DISPATCHED→IN_TRANSIT (cascade depth 2)"
      - from: "dispensing:SHIPPED"
        to: "dispensing:DELIVERED"
        trigger: POST /platforms/{pid}/orders/{orderId}/deliver
        actor: PlatformAdmin
        preconditions:
          - "Order.dispensing_status == SHIPPED (ERR_ORDER_NOT_SHIPPED)"
          - "If cold_chain_required: ColdChainShipment.status IN {IN_TRANSIT, DELIVERED} AND excursion_score <= COLD_CHAIN_DISPOSE_THRESHOLD (ERR_COLD_CHAIN_OUT_OF_RANGE)"
        side_effects:
          - "Append AuditLog action=ORDER_DELIVERED"
          - "Emit ExternalEvent channel=LOGISTICS event_type='order.delivered'"
          - "If cold_chain_shipment exists and IN_TRANSIT: ColdChainShipment.status → DELIVERED (cascade depth 2)"
          - "Auto-archive evaluation for prescription (cascade depth 3): if all sibling Orders in terminal states, Prescription→ARCHIVED"
      - from: "dispensing:PENDING_REVIEW"
        to: "dispensing:CANCELLED"
        trigger: POST /platforms/{pid}/orders/{orderId}/cancel
        actor: Customer
        preconditions:
          - "Order.dispensing_status == PENDING_REVIEW (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If payment_status==PAID: payment_status → REFUNDED (cascade depth 2)"
          - "Auto-archive evaluation for prescription (cascade depth 3) if no other outstanding orders"

  # ---------------------------------------------------------------------------
  - entity: PharmacistReview
    initial_state: PENDING            # but reviews are created directly in IN_REVIEW (PENDING is not externally observable in current flow)
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: IN_REVIEW
        to: APPROVED
        trigger: POST /platforms/{pid}/orders/{orderId}/pharmacist-reviews/{reviewId}/approve
        actor: PharmacistReReviewer
        preconditions:
          - "review.status == IN_REVIEW (ERR_REVIEW_NOT_IN_REVIEW)"
          - "Body provides interaction_check_passed=true AND dosage_rationality_passed=true (ERR_REVIEW_CHECKS_FAILED)"
          - "X-User-ID == review.assigned_pharmacist_id (ERR_REVIEWER_MISMATCH)"
          - "X-User-ID != Prescription.reviewer_pharmacist_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "Pharmacist.qualification_status == ACTIVE (ERR_PHARMACIST_NOT_ACTIVE)"
        side_effects:
          - "Order.dispensing_status PHARMACIST_REVIEWING → APPROVED (cascade)"
          - "Append AuditLog action=PHARMACIST_REVIEW_APPROVED"
      - from: IN_REVIEW
        to: REJECTED
        trigger: POST /platforms/{pid}/orders/{orderId}/pharmacist-reviews/{reviewId}/reject
        actor: PharmacistReReviewer
        preconditions:
          - "review.status == IN_REVIEW (ERR_REVIEW_NOT_IN_REVIEW)"
          - "decision_notes string length >= 10 (ERR_REVIEW_NOTES_TOO_SHORT)"
          - "X-User-ID == review.assigned_pharmacist_id (ERR_REVIEWER_MISMATCH)"
        side_effects:
          - "Order.dispensing_status → REJECTED (cascade depth 1)"
          - "If Order.payment_status == PAID: payment_status → REFUNDED (cascade depth 2)"
          - "Append AuditLog action=PHARMACIST_REVIEW_REJECTED"
      - from: IN_REVIEW
        to: REQUEST_CHANGE
        trigger: POST /platforms/{pid}/orders/{orderId}/pharmacist-reviews/{reviewId}/request-change
        actor: PharmacistReReviewer
        preconditions:
          - "review.status == IN_REVIEW (ERR_REVIEW_NOT_IN_REVIEW)"
          - "decision_notes string length >= 10 (ERR_REVIEW_NOTES_TOO_SHORT)"
          - "revision_count < MAX_REVISIONS (ERR_REVIEW_MAX_REVISIONS — MAX_REVISIONS = 2)"
        side_effects:
          - "Append AuditLog action=PHARMACIST_REVIEW_REQUEST_CHANGE"
      - from: REQUEST_CHANGE
        to: IN_REVIEW
        trigger: POST /platforms/{pid}/orders/{orderId}/pharmacist-reviews/{reviewId}/resume
        actor: PharmacistReReviewer
        preconditions:
          - "review.status == REQUEST_CHANGE (ERR_REVIEW_NOT_IN_REQUEST_CHANGE)"
          - "X-User-ID == review.assigned_pharmacist_id (ERR_REVIEWER_MISMATCH)"
        side_effects:
          - "revision_count += 1"
        note: "Cyclic: REQUEST_CHANGE → IN_REVIEW completes a revision loop"

  # ---------------------------------------------------------------------------
  - entity: ColdChainShipment
    initial_state: DISPATCHED
    terminal_states: [DELIVERED, DISPOSED]
    transitions:
      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "system (auto on Order ship transition; or POST /platforms/{pid}/cold-chain-shipments/{shipmentId}/mark-in-transit for direct test access)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system (auto on Order deliver transition when excursion_score <= COLD_CHAIN_DISPOSE_THRESHOLD)"
        actor: system
        preconditions:
          - "excursion_score <= COLD_CHAIN_DISPOSE_THRESHOLD"
        side_effects: []
      - from: IN_TRANSIT
        to: DISPOSED
        trigger: POST /platforms/{pid}/cold-chain-shipments/{shipmentId}/dispose
        actor: PlatformAdmin
        preconditions:
          - "shipment.status == IN_TRANSIT OR DISPATCHED (ERR_SHIPMENT_NOT_DISPOSABLE)"
          - "excursion_score > COLD_CHAIN_DISPOSE_THRESHOLD (ERR_DISPOSAL_NOT_JUSTIFIED)"
        side_effects:
          - "Append AuditLog action=COLD_CHAIN_DISPOSED"
          - "Order.dispensing_status → REJECTED (cascade depth 1)"
          - "If Order.payment_status==PAID: payment_status → REFUNDED (cascade depth 2)"
      - from: DISPATCHED
        to: DISPOSED
        trigger: POST /platforms/{pid}/cold-chain-shipments/{shipmentId}/dispose
        actor: PlatformAdmin
        preconditions:
          - "excursion_score > COLD_CHAIN_DISPOSE_THRESHOLD (ERR_DISPOSAL_NOT_JUSTIFIED)"
        side_effects:
          - "Order.dispensing_status → REJECTED, refund cascade as above"

  # ---------------------------------------------------------------------------
  - entity: AdverseReactionReport
    initial_state: REPORTED
    terminal_states: [ARCHIVED]
    transitions:
      - from: REPORTED
        to: SUBMITTED
        trigger: POST /platforms/{pid}/adverse-reactions/{reportId}/submit
        actor: PharmacistReReviewer
        preconditions:
          - "report.status == REPORTED (ERR_REPORT_NOT_REPORTED)"
          - "platform.current_clock_iso < reporting_deadline_at + GRACE_HOURS (ERR_REPORTING_DEADLINE_PASSED — submission past deadline plus grace is rejected)"
        side_effects:
          - "submitted_to_authority_at = platform.current_clock_iso"
          - "If severity==SERIOUS: follow_up_due_at = submitted_to_authority_at + FOLLOW_UP_DAYS"
          - "Append AuditLog action=ADR_SUBMITTED"
          - "Emit ExternalEvent channel=REGULATORY_AUTHORITY event_type='adr.submitted', idempotency_key='adr.submitted:{report_id}:{version}'"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: POST /platforms/{pid}/adverse-reactions/{reportId}/acknowledge
        actor: RegulatoryGateway
        preconditions:
          - "severity == NON_SERIOUS (ERR_REPORT_REQUIRES_FOLLOW_UP — serious reports must transit through FOLLOW_UP_PENDING)"
        side_effects: []
      - from: SUBMITTED
        to: FOLLOW_UP_PENDING
        trigger: "system (auto immediately after SUBMITTED if severity==SERIOUS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FOLLOW_UP_PENDING
        to: ARCHIVED
        trigger: POST /platforms/{pid}/adverse-reactions/{reportId}/archive
        actor: PharmacistReReviewer
        preconditions:
          - "report.status IN {FOLLOW_UP_PENDING, ACKNOWLEDGED} (ERR_REPORT_NOT_ARCHIVABLE)"
          - "If severity==SERIOUS: platform.current_clock_iso >= follow_up_due_at (ERR_FOLLOW_UP_INCOMPLETE)"
        side_effects:
          - "archived_at = platform.current_clock_iso"
          - "Append AuditLog action=ADR_ARCHIVED"
      - from: ACKNOWLEDGED
        to: ARCHIVED
        trigger: POST /platforms/{pid}/adverse-reactions/{reportId}/archive
        actor: PharmacistReReviewer
        preconditions:
          - "severity == NON_SERIOUS (ERR_REPORT_NOT_ARCHIVABLE)"
        side_effects:
          - "archived_at = platform.current_clock_iso"
          - "Append AuditLog action=ADR_ARCHIVED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two PharmacistReReviewers race to open-pharmacist-review on the same Order"
    guarantee: "At most one PharmacistReview is created per Order; second request rejected"
    error_id: ERR_REVIEW_ALREADY_OPEN
    http_status: 409
    serialization: "First-writer-wins on Order.pharmacist_review_id field"

  - scenario: "Approve and reject submitted simultaneously on the same PharmacistReview"
    guarantee: "Exactly one transition wins; loser receives state-conflict error"
    error_id: ERR_REVIEW_NOT_IN_REVIEW
    http_status: 409
    serialization: "First-writer-wins on PharmacistReview.status; CAS via version field"

  - scenario: "Two prescription approvals on the same Prescription submitted simultaneously"
    guarantee: "Exactly one approval succeeds; loser is rejected"
    error_id: ERR_PRESCRIPTION_NOT_IN_REVIEW
    http_status: 409
    serialization: "First-writer-wins on Prescription.status field"

  - scenario: "Customer pay and cancel race on the same Order in PENDING_REVIEW"
    guarantee: "Exactly one operation succeeds; loser receives state-conflict error"
    error_id: ERR_ORDER_NOT_PAYABLE
    http_status: 409
    serialization: "First-writer-wins on Order.dispensing_status / payment_status combo"

  - scenario: "Two ExternalEvent emissions sharing the same idempotency_key"
    guarantee: "At most one ExternalEvent row created per idempotency_key; duplicate emission silently no-ops (no error to caller; this rule is for system-internal emitters that record once)"
    error_id: ERR_IDEMPOTENCY_CONFLICT
    http_status: 409
    serialization: "First-writer-wins on ExternalEvent.idempotency_key uniqueness"

  - scenario: "Drug shelve and off-shelve submitted simultaneously"
    guarantee: "Exactly one transition wins; loser observes wrong state"
    error_id: ERR_DRUG_NOT_PENDING_REVIEW
    http_status: 409
    serialization: "First-writer-wins on Drug.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: order_total_amount_cents
    trigger: "Order creation; recomputed if items array is rewritten via PATCH (not supported in v1, so effectively at creation only)"
    algorithm: aggregation
    formula: |
      total_amount_cents = sum( line.qty * line.unit_price_cents for line in items )
      All values are integer cents — NO rounding occurs anywhere; decimals are not allowed in unit_price_cents.
    input_set: "items at the moment of order creation; no state filter (all lines included)"
    constants: {}
    precision: "integer cents (no rounding because integer arithmetic)"

  - name: purchase_limit_aggregation
    trigger: "POST /platforms/{pid}/orders (Order creation) and POST .../open-pharmacist-review"
    algorithm: chronological
    formula: |
      For each line in proposed Order:
        rule = PurchaseLimitRule for line.drug.control_category (else NONE rule); if no rule exists for the
               control_category, no limit applies for that line.
        window_start = platform.current_clock_iso - rule.window_days days
        # Inclusive at left boundary, exclusive at right boundary (closed-open)
        existing_units = sum(
          past_line.qty
          for past_order in Orders WHERE customer_id == proposed.customer_id
                                   AND payment_status == PAID
                                   AND paid_at >= window_start
                                   AND paid_at <  platform.current_clock_iso
          for past_line in past_order.items
          WHERE past_line.drug.control_category == line.drug.control_category
        )
        proposed_units = sum(
          ol.qty for ol in proposed_order.items
          WHERE ol.drug.control_category == line.drug.control_category
        )
        IF existing_units + proposed_units > rule.max_units_per_window:
          raise ERR_PURCHASE_LIMIT_EXCEEDED
      Per-order cap: for each line, line.qty MUST NOT exceed line.drug.per_order_qty_cap
                     (raise ERR_PURCHASE_LIMIT_EXCEEDED).
      Special-population: if customer.special_population_flags ∩ rule.blocks_special_populations != ∅,
                           raise ERR_SPECIAL_POPULATION_RESTRICTED.
      Order of checks (pinned): per_order_qty_cap → special-population → window aggregation.
    input_set: "Customer's PAID orders with paid_at in [now - window_days, now); orders in REFUNDED, CANCELLED, REJECTED are excluded; PENDING/PHARMACIST_REVIEWING/APPROVED/DISPENSED/SHIPPED/DELIVERED with payment_status==UNPAID are excluded"
    constants:
      WINDOW_BOUNDARY: "[start, now)"
    precision: "integer units"
    note: "Chronological — past orders are summed in paid_at order, but since the test is a single threshold compare, ordering only matters for ERR_PURCHASE_LIMIT_EXCEEDED message determinism (we use the chronologically earliest violating control_category)."

  - name: cold_chain_excursion_score
    trigger: "Each append to ColdChainShipment.temperature_readings (POST /cold-chain-shipments/{id}/readings) and every recompute when the shipment ships or delivers"
    algorithm: aggregation
    formula: |
      Inputs: ordered list of readings sorted ASCENDING by recorded_at.
      For each reading r_i (i = 0..n-1):
        if 20 <= r_i.celsius_tenths <= 80:                # 2.0°C ≤ T ≤ 8.0°C
          severity_i = 0
        elif r_i.celsius_tenths < 20 OR r_i.celsius_tenths > 80:
          if r_i.celsius_tenths < 0 OR r_i.celsius_tenths > 150:    # < 0°C or > 15°C
            severity_i = 5                                          # critical
          else:
            severity_i = 1                                          # mild
        # window_minutes between this reading and next; for last reading use 1
        if i < n-1:
          window_minutes_i = max(1, ceil((r_{i+1}.recorded_at - r_i.recorded_at) / 60s))
        else:
          window_minutes_i = 1
        per_reading_score_i = severity_i * window_minutes_i      # PER-READING ROUND not needed (already integer)
      excursion_score = sum(per_reading_score_i for all i)        # SUM-AFTER-INTEGER-MULT
      # Order is pinned: compute per-reading integer score first, THEN sum.
      # Reverse order ("sum severities, multiply by total minutes") is FORBIDDEN — yields wrong value.
    input_set: "All readings on this shipment, sorted ASC by recorded_at; no filtering"
    constants:
      COLD_RANGE_LOW_TENTHS: 20         # 2.0°C
      COLD_RANGE_HIGH_TENTHS: 80        # 8.0°C
      CRITICAL_LOW_TENTHS: 0            # 0.0°C
      CRITICAL_HIGH_TENTHS: 150         # 15.0°C
      MILD_SEVERITY: 1
      CRITICAL_SEVERITY: 5
      COLD_CHAIN_DISPOSE_THRESHOLD: 30
    precision: "integer minutes (ceil); integer score sums"
    variants:
      - name: per_reading_then_sum
        when: "DEFAULT — the only correct ordering"
        difference: "Compute severity_i * window_minutes_i first per reading, then sum. Pinned."
      - name: sum_then_multiply
        when: "FORBIDDEN — included to make ordering ambiguity explicit"
        difference: "If implementer mistakenly does (sum severities) × (sum minutes) the result diverges; this variant is documented as the trap, not as a permitted alternative."

  - name: adr_reporting_deadline
    trigger: "AdverseReactionReport creation (POST .../adverse-reactions); recomputed if severity is escalated via PATCH (.../escalate)"
    algorithm: forward_looking
    formula: |
      base = reported_at  (which is platform.current_clock_iso at creation)
      IF severity == SERIOUS:
        reporting_deadline_at = base + 24 hours          (forward-looking: deadline computed from intake)
      ELIF severity == NON_SERIOUS:
        reporting_deadline_at = base + 15 days           (forward-looking)
      # Variant difference vs chronological_recompute:
      # If severity is later escalated NON_SERIOUS→SERIOUS, the FORWARD-LOOKING variant
      # uses the ORIGINAL reported_at; the CHRONOLOGICAL variant uses the moment of
      # escalation. The scaffold pins FORWARD-LOOKING (anchored at intake) — escalation
      # never extends the clock; if 24h has already passed since reported_at, submission
      # is past deadline.
    input_set: "reported_at (immutable) and current severity"
    constants:
      SERIOUS_DEADLINE_HOURS: 24
      NON_SERIOUS_DEADLINE_DAYS: 15
      GRACE_HOURS: 0
      FOLLOW_UP_DAYS: 7
    precision: "datetime, ISO8601 UTC, millisecond truncation"
    variants:
      - name: forward_looking_anchored_at_intake
        when: "DEFAULT — used everywhere in the scaffold"
        difference: "Deadline anchored at original reported_at; escalation does not reset clock. Result for an escalated report differs from the chronological variant."
      - name: chronological_recompute_at_escalation
        when: "Defined to articulate the dual-variant; NOT used by transitions"
        difference: "Deadline = escalation_at + 24h; would cause two different reporting_deadline_at for identical inputs (reported_at, escalation_at)."

  - name: vendor_qualification_review_score
    trigger: "POST /platforms/{pid}/vendors/{vendorId}/resubmit-qualification AND on each POST /_clock/advance"
    algorithm: weighted_scoring
    formula: |
      # Three components — circular-looking dependency: total tier is a function of inputs,
      # and the per-component WEIGHT_TIER is keyed on total. Pin the evaluation order.
      Step 1 (compute raw days):
        L_days = (business_license_expires_at - platform.current_clock_iso) in whole days, floor
        P_days = (drug_operation_permit_expires_at - platform.current_clock_iso) in whole days, floor
        if Vendor has at least one Pharmacist (vendor → pharmacist join via same platform):
          C_days = min over pharmacists of (certificate_expires_at - clock) in whole days, floor
        else:
          C_days = +∞ sentinel (ignored)
      Step 2 (severity points; piecewise on each component):
        score(component_days) =
          0   if days >= 90
          1   if 30 <= days < 90
          3   if 0  <= days < 30
          5   if days < 0          (already expired)
      Step 3 (raw_total — uniform weights):
        raw_total = score(L_days) + score(P_days) + score(C_days if not sentinel else 0)
      Step 4 (TIER from raw_total):
        TIER = 'GREEN'  if raw_total <= 1
        TIER = 'YELLOW' if 2 <= raw_total <= 4
        TIER = 'RED'    if raw_total >= 5
      Step 5 (final WEIGHTED_SCORE — TIER is fed back as a multiplier):
        WEIGHTED_SCORE = raw_total * { GREEN: 1.0, YELLOW: 1.5, RED: 2.0 }[TIER]
        # Step 5 is the "circular-looking" hop: TIER depends on raw_total, then re-multiplies it.
        # Order pinned: Step 5 always runs AFTER Step 4. Round-half-up to 1 decimal.
      Step 6 (auto transitions — invoked at POST /_clock/advance):
        if Vendor.qualification_status == ACTIVE and TIER in {YELLOW, RED}: ACTIVE → REVIEW_REQUIRED
        if TIER == RED and clock >= max(L_expires, P_expires): REVIEW_REQUIRED → SUSPENDED
    input_set: "All Pharmacists with platform_id == vendor.platform_id are joined to estimate vendor's pharmacist coverage; absence treated as +∞ days"
    constants:
      ALERT_DAYS: 30
      GREEN_MULTIPLIER: 1.0
      YELLOW_MULTIPLIER: 1.5
      RED_MULTIPLIER: 2.0
    precision: "WEIGHTED_SCORE rounded half-up to 1 decimal place; raw_total integer; days floor"
    variants:
      - name: tiered_then_weighted
        when: "DEFAULT — pinned order"
        difference: "Compute raw_total first, derive TIER, THEN multiply. The 'circular-looking' aspect is that TIER is keyed on the total, then folded back as a multiplier on that same total."
      - name: weighted_then_tier
        when: "FORBIDDEN — included for clarity; multiplying first then tiering produces a different score for the same inputs"
        difference: "Defining TIER = bucket(raw_total*default_mult) yields a different value when an input lands near the 90/30 day boundary."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                  check: "X-User-ID and X-User-Role headers must be present and well-formed",                                  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all endpoints except POST /_clock/advance" }
  - { priority: 2,  category: auth,                  check: "Role must be permitted for this endpoint per RBAC matrix",                                          error_id: ERR_INSUFFICIENT_PERMISSIONS,               http_status: 403, applies_to: "all endpoints" }
  - { priority: 3,  category: existence,             check: "All path-parameter resources must exist (left-to-right; first miss wins)",                          error_id: "ERR_*_NOT_FOUND",                          http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 3.5, category: concurrency,          check: "Optional `version` in body must equal current row version (OCC) on mutation endpoints",             error_id: ERR_VERSION_MISMATCH,                       http_status: 409, applies_to: "all mutation endpoints when version is supplied" }
  - { priority: 4,  category: state,                 check: "Subject resource state must permit the requested transition",                                       error_id: "ERR_*_NOT_*",                              http_status: 409, applies_to: "all action endpoints" }
  # ----- Domain-specific business validations -----
  - { priority: 10, category: business_safety,       check: "Drug.ndc must match regex ^\\d{4,5}-\\d{3,4}-\\d{1,2}$",                                            error_id: ERR_NDC_INVALID_FORMAT,                     http_status: 400, applies_to: "POST /platforms/{pid}/drugs" }
  - { priority: 11, category: business_referential,  check: "Drug.ndc must be unique within platform among non-OFF_SHELF drugs",                                  error_id: ERR_NDC_DUPLICATE,                          http_status: 409, applies_to: "POST /drugs and POST /drugs/{id}/shelve" }
  - { priority: 12, category: business_safety,       check: "If Drug.control_category != NONE, classification MUST be PRESCRIPTION",                              error_id: ERR_CONTROL_CATEGORY_REQUIRES_PRESCRIPTION, http_status: 400, applies_to: "POST /drugs and POST /drugs/{id}/shelve" }
  - { priority: 13, category: business_referential,  check: "Drug.vendor_id must belong to a Vendor with qualification_status==ACTIVE on shelve",                  error_id: ERR_VENDOR_NOT_ACTIVE,                      http_status: 409, applies_to: "POST /drugs/{id}/shelve" }
  - { priority: 20, category: business_safety,       check: "Prescription.prescriber_license_no must NOT be on PrescriberDenylist",                                error_id: ERR_PRESCRIBER_NOT_QUALIFIED,               http_status: 422, applies_to: "POST /prescriptions and POST /prescriptions/{id}/approve" }
  - { priority: 21, category: business_temporal,     check: "platform clock < issued_at + min(validity_days, validity_days_cap_for_control_category)",            error_id: ERR_PRESCRIPTION_EXPIRED,                   http_status: 422, applies_to: "POST /prescriptions/{id}/approve" }
  - { priority: 22, category: business_referential,  check: "Every drug_items[].drug_id must resolve to ON_SHELF, classification==PRESCRIPTION drug",              error_id: ERR_DRUG_NOT_PRESCRIBABLE,                  http_status: 422, applies_to: "POST /prescriptions/{id}/approve" }
  - { priority: 23, category: business_safety,       check: "No drug.contraindications intersect customer.special_population_flags",                              error_id: ERR_CONTRAINDICATION_VIOLATION,             http_status: 422, applies_to: "POST /prescriptions/{id}/approve" }
  - { priority: 30, category: business_safety,       check: "Customer.real_name_verified == true AND id_document_no non-empty for any prescription drug",         error_id: ERR_REAL_NAME_REQUIRED,                     http_status: 403, applies_to: "POST /orders (when any item is PRESCRIPTION drug)" }
  - { priority: 31, category: business_constraint,   check: "Per-order: line.qty <= drug.per_order_qty_cap",                                                       error_id: ERR_PURCHASE_LIMIT_EXCEEDED,                http_status: 422, applies_to: "POST /orders" }
  - { priority: 32, category: business_safety,       check: "Customer.special_population_flags ∩ rule.blocks_special_populations == ∅",                            error_id: ERR_SPECIAL_POPULATION_RESTRICTED,          http_status: 403, applies_to: "POST /orders" }
  - { priority: 33, category: business_constraint,   check: "Aggregated units in [now - window_days, now) + proposed units <= rule.max_units_per_window",         error_id: ERR_PURCHASE_LIMIT_EXCEEDED,                http_status: 422, applies_to: "POST /orders and POST /orders/{id}/open-pharmacist-review" }
  - { priority: 40, category: business_safety,       check: "PharmacistReReviewer X-User-ID != Prescription.reviewer_pharmacist_id (segregation of duties)",       error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION,        http_status: 403, applies_to: "POST /orders/{id}/open-pharmacist-review and POST /pharmacist-reviews/{id}/approve" }
  - { priority: 41, category: business_constraint,   check: "Reviewer X-User-ID == review.assigned_pharmacist_id on review action endpoints",                       error_id: ERR_REVIEWER_MISMATCH,                      http_status: 403, applies_to: "POST /pharmacist-reviews/{id}/approve|reject|request-change|resume" }
  - { priority: 42, category: business_safety,       check: "Acting Pharmacist.qualification_status == ACTIVE",                                                    error_id: ERR_PHARMACIST_NOT_ACTIVE,                  http_status: 403, applies_to: "open-pharmacist-review and pharmacist-review action endpoints" }
  - { priority: 43, category: business_constraint,   check: "On approve: interaction_check_passed==true AND dosage_rationality_passed==true",                      error_id: ERR_REVIEW_CHECKS_FAILED,                   http_status: 422, applies_to: "POST /pharmacist-reviews/{id}/approve" }
  - { priority: 44, category: business_constraint,   check: "decision_notes length >= 10 on REJECT or REQUEST_CHANGE",                                             error_id: ERR_REVIEW_NOTES_TOO_SHORT,                 http_status: 422, applies_to: "POST /pharmacist-reviews/{id}/reject|request-change" }
  - { priority: 45, category: business_constraint,   check: "revision_count < MAX_REVISIONS (=2) when issuing REQUEST_CHANGE",                                     error_id: ERR_REVIEW_MAX_REVISIONS,                   http_status: 409, applies_to: "POST /pharmacist-reviews/{id}/request-change" }
  - { priority: 50, category: business_constraint,   check: "If cold_chain_required: courier_pharmacist_id resolves to Pharmacist with courier_qualified==true AND qualification_status==ACTIVE", error_id: ERR_COURIER_NOT_QUALIFIED, http_status: 422, applies_to: "POST /cold-chain-shipments" }
  - { priority: 51, category: business_referential,  check: "Cold-chain shipment can only be created for Order with cold_chain_required==true and dispensing_status==APPROVED|DISPENSED",        error_id: ERR_COLD_CHAIN_NOT_APPLICABLE, http_status: 422, applies_to: "POST /cold-chain-shipments" }
  - { priority: 52, category: business_safety,       check: "On dispose: excursion_score > COLD_CHAIN_DISPOSE_THRESHOLD",                                          error_id: ERR_DISPOSAL_NOT_JUSTIFIED,                 http_status: 422, applies_to: "POST /cold-chain-shipments/{id}/dispose" }
  - { priority: 53, category: business_safety,       check: "On Order deliver: excursion_score <= COLD_CHAIN_DISPOSE_THRESHOLD when cold_chain_required",          error_id: ERR_COLD_CHAIN_OUT_OF_RANGE,                http_status: 422, applies_to: "POST /orders/{id}/deliver" }
  - { priority: 60, category: business_temporal,     check: "On submit ADR: clock < reporting_deadline_at + GRACE_HOURS",                                          error_id: ERR_REPORTING_DEADLINE_PASSED,              http_status: 422, applies_to: "POST /adverse-reactions/{id}/submit" }
  - { priority: 61, category: business_temporal,     check: "On archive serious ADR: clock >= follow_up_due_at",                                                  error_id: ERR_FOLLOW_UP_INCOMPLETE,                   http_status: 409, applies_to: "POST /adverse-reactions/{id}/archive" }
  - { priority: 70, category: business_temporal,     check: "Vendor renewal expiry must be strictly greater than platform clock",                                  error_id: ERR_RENEWAL_DATE_NOT_FUTURE,                http_status: 422, applies_to: "POST /vendors/{id}/resubmit-qualification and POST /pharmacists/{id}/renew-certificate" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Platforms -----
  - { method: POST,   path: "/pharma-platforms",                                                                description: "Create a platform",                                            roles: [PlatformAdmin],                                                       code: 201, input: ["name","jurisdiction","regulatory_endpoint"],                                                  output: PharmaPlatform,                       side_effects: ["current_clock_iso initialised to 1970-01-01T00:00:00.000Z"] }
  - { method: GET,    path: "/pharma-platforms/{pid}",                                                          description: "Get a platform",                                               roles: [PlatformAdmin, VendorAdmin, PrescriptionReviewer, PharmacistReReviewer, Customer, RegulatoryGateway], code: 200, input: [], output: PharmaPlatform, side_effects: [] }
  - { method: POST,   path: "/pharma-platforms/{pid}/_clock/advance",                                           description: "Advance deterministic platform clock; runs auto-sweeps for vendor/pharmacist expiry", roles: [PlatformAdmin],                       code: 200, input: ["to_iso (ISO8601 UTC, must be > current_clock_iso)"], output: PharmaPlatform, side_effects: ["Trigger vendor/pharmacist expiry sweeps; emit ExternalEvents"] }

  # ----- Drugs -----
  - { method: POST,   path: "/pharma-platforms/{pid}/drugs",                                                    description: "Create Drug (status starts PENDING_REVIEW)",                   roles: [PlatformAdmin, VendorAdmin],                                          code: 201, input: ["ndc","name","classification","control_category","cold_chain_required?","indications","contraindications","per_order_qty_cap","per_period_qty_cap","vendor_id"], output: Drug, side_effects: ["status = PENDING_REVIEW"] }
  - { method: GET,    path: "/pharma-platforms/{pid}/drugs",                                                    description: "List drugs (filterable by status, classification, control_category)", roles: [PlatformAdmin, VendorAdmin, PrescriptionReviewer, PharmacistReReviewer, Customer, RegulatoryGateway], code: 200, input: ["status?","classification?","control_category?","limit?","offset?"], output: "Drug[]", side_effects: [] }
  - { method: GET,    path: "/pharma-platforms/{pid}/drugs/{drugId}",                                           description: "Get a drug",                                                   roles: [PlatformAdmin, VendorAdmin, PrescriptionReviewer, PharmacistReReviewer, Customer, RegulatoryGateway], code: 200, input: [], output: Drug, side_effects: [] }
  - { method: POST,   path: "/pharma-platforms/{pid}/drugs/{drugId}/shelve",                                    description: "Move PENDING_REVIEW or OFF_SHELF → ON_SHELF",                  roles: [PlatformAdmin],                                                       code: 200, input: [], output: Drug, side_effects: ["status → ON_SHELF"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/drugs/{drugId}/off-shelve",                                description: "ON_SHELF → OFF_SHELF, cascades to outstanding orders",         roles: [PlatformAdmin],                                                       code: 200, input: [], output: Drug, side_effects: ["status → OFF_SHELF; cascades cancel/reject orders containing drug"] }

  # ----- Vendors -----
  - { method: POST,   path: "/pharma-platforms/{pid}/vendors",                                                  description: "Create Vendor (status starts ACTIVE)",                          roles: [PlatformAdmin],                                                       code: 201, input: ["name","business_license_no","business_license_expires_at","drug_operation_permit_no","drug_operation_permit_expires_at"], output: Vendor, side_effects: ["qualification_status = ACTIVE"] }
  - { method: GET,    path: "/pharma-platforms/{pid}/vendors",                                                  description: "List vendors",                                                  roles: [PlatformAdmin, VendorAdmin, RegulatoryGateway],                       code: 200, input: ["qualification_status?","limit?","offset?"], output: "Vendor[]", side_effects: [] }
  - { method: GET,    path: "/pharma-platforms/{pid}/vendors/{vendorId}",                                       description: "Get vendor",                                                    roles: [PlatformAdmin, VendorAdmin, RegulatoryGateway],                       code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST,   path: "/pharma-platforms/{pid}/vendors/{vendorId}/resubmit-qualification",                description: "Re-submit license + permit renewal dates; returns vendor to ACTIVE", roles: [VendorAdmin],                                                  code: 200, input: ["business_license_expires_at","drug_operation_permit_expires_at"], output: Vendor, side_effects: ["qualification_status → ACTIVE; latest_review_submitted_at = clock"] }

  # ----- Pharmacists -----
  - { method: POST,   path: "/pharma-platforms/{pid}/pharmacists",                                              description: "Create Pharmacist (status ACTIVE)",                             roles: [PlatformAdmin],                                                       code: 201, input: ["full_name","certificate_no","certificate_expires_at","courier_qualified?"], output: Pharmacist, side_effects: ["qualification_status = ACTIVE"] }
  - { method: GET,    path: "/pharma-platforms/{pid}/pharmacists",                                              description: "List pharmacists",                                              roles: [PlatformAdmin, VendorAdmin, PharmacistReReviewer, PrescriptionReviewer], code: 200, input: ["qualification_status?","limit?","offset?"], output: "Pharmacist[]", side_effects: [] }
  - { method: GET,    path: "/pharma-platforms/{pid}/pharmacists/{pharmacistId}",                               description: "Get pharmacist",                                                roles: [PlatformAdmin, VendorAdmin, PharmacistReReviewer, PrescriptionReviewer], code: 200, input: [], output: Pharmacist, side_effects: [] }
  - { method: POST,   path: "/pharma-platforms/{pid}/pharmacists/{pharmacistId}/renew-certificate",             description: "EXPIRED → ACTIVE",                                              roles: [PlatformAdmin],                                                       code: 200, input: ["certificate_expires_at"], output: Pharmacist, side_effects: ["qualification_status → ACTIVE"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/pharmacists/{pharmacistId}/suspend",                       description: "ACTIVE → SUSPENDED",                                            roles: [PlatformAdmin],                                                       code: 200, input: [], output: Pharmacist, side_effects: ["qualification_status → SUSPENDED"] }

  # ----- Customers -----
  - { method: POST,   path: "/pharma-platforms/{pid}/customers",                                                description: "Create Customer",                                               roles: [PlatformAdmin],                                                       code: 201, input: ["real_name","id_document_no","special_population_flags","real_name_verified?"], output: Customer, side_effects: [] }
  - { method: GET,    path: "/pharma-platforms/{pid}/customers/{customerId}",                                   description: "Get customer",                                                  roles: [PlatformAdmin, Customer],                                            code: 200, input: [], output: Customer, side_effects: [] }
  - { method: PATCH,  path: "/pharma-platforms/{pid}/customers/{customerId}",                                   description: "Update customer special_population_flags or real_name_verified", roles: [PlatformAdmin],                                                       code: 200, input: ["special_population_flags?","real_name_verified?","version?"], output: Customer, side_effects: [] }

  # ----- Prescriber denylist -----
  - { method: POST,   path: "/pharma-platforms/{pid}/prescriber-denylist",                                      description: "Add a prescriber to the denylist",                              roles: [PlatformAdmin, RegulatoryGateway],                                    code: 201, input: ["prescriber_license_no","reason"], output: PrescriberDenylistEntry, side_effects: [] }
  - { method: GET,    path: "/pharma-platforms/{pid}/prescriber-denylist",                                      description: "List denylist",                                                 roles: [PlatformAdmin, PrescriptionReviewer, RegulatoryGateway],              code: 200, input: ["limit?","offset?"], output: "PrescriberDenylistEntry[]", side_effects: [] }

  # ----- Purchase limit rules -----
  - { method: POST,   path: "/pharma-platforms/{pid}/purchase-limit-rules",                                     description: "Create per-category purchase rule",                             roles: [PlatformAdmin],                                                       code: 201, input: ["control_category","window_days","max_units_per_window","blocks_special_populations"], output: PurchaseLimitRule, side_effects: [] }
  - { method: GET,    path: "/pharma-platforms/{pid}/purchase-limit-rules",                                     description: "List rules",                                                    roles: [PlatformAdmin, PrescriptionReviewer, PharmacistReReviewer],           code: 200, input: ["control_category?"], output: "PurchaseLimitRule[]", side_effects: [] }
  - { method: DELETE, path: "/pharma-platforms/{pid}/purchase-limit-rules/{ruleId}",                            description: "Delete a rule",                                                 roles: [PlatformAdmin],                                                       code: 204, input: [], output: null, side_effects: [] }

  # ----- Prescriptions -----
  - { method: POST,   path: "/pharma-platforms/{pid}/prescriptions",                                            description: "Upload a prescription (auto-advances UPLOADED → REVIEW_PENDING)", roles: [Customer, PrescriptionReviewer],                                    code: 201, input: ["customer_id","prescriber_name","prescriber_license_no","image_url","issued_at","validity_days","drug_items"], output: Prescription, side_effects: ["status = REVIEW_PENDING"] }
  - { method: GET,    path: "/pharma-platforms/{pid}/prescriptions/{rxId}",                                     description: "Get prescription",                                              roles: [Customer, PrescriptionReviewer, PharmacistReReviewer, RegulatoryGateway, PlatformAdmin], code: 200, input: [], output: Prescription, side_effects: [] }
  - { method: POST,   path: "/pharma-platforms/{pid}/prescriptions/{rxId}/approve",                             description: "REVIEW_PENDING → APPROVED",                                     roles: [PrescriptionReviewer],                                                code: 200, input: [], output: Prescription, side_effects: ["status → APPROVED; reviewer_pharmacist_id = X-User-ID; AuditLog; ExternalEvent"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/prescriptions/{rxId}/reject",                              description: "REVIEW_PENDING → REJECTED",                                     roles: [PrescriptionReviewer],                                                code: 200, input: [], output: Prescription, side_effects: ["status → REJECTED; AuditLog"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/prescriptions/{rxId}/revoke",                              description: "APPROVED → REVOKED (only when no active orders)",               roles: [PrescriptionReviewer, PlatformAdmin],                                 code: 200, input: [], output: Prescription, side_effects: ["status → REVOKED; cascade-cancel orders in PENDING_REVIEW"] }

  # ----- Orders -----
  - { method: POST,   path: "/pharma-platforms/{pid}/orders",                                                   description: "Place an order; runs purchase-limit checks",                    roles: [Customer],                                                            code: 201, input: ["customer_id","prescription_id?","items"], output: Order, side_effects: ["dispensing_status = PENDING_REVIEW; payment_status = UNPAID; total_amount_cents computed; cold_chain_required computed"] }
  - { method: GET,    path: "/pharma-platforms/{pid}/orders/{orderId}",                                         description: "Get order",                                                     roles: [Customer, PlatformAdmin, PharmacistReReviewer, RegulatoryGateway],    code: 200, input: [], output: Order, side_effects: [] }
  - { method: GET,    path: "/pharma-platforms/{pid}/orders",                                                   description: "List orders (filter by customer/dispensing_status/payment_status)", roles: [PlatformAdmin, RegulatoryGateway],                                code: 200, input: ["customer_id?","dispensing_status?","payment_status?","limit?","offset?"], output: "Order[]", side_effects: [] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/pay",                                     description: "UNPAID → PAID (payment dimension)",                             roles: [Customer],                                                            code: 200, input: [], output: Order, side_effects: ["payment_status → PAID; paid_at = clock"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/cancel",                                  description: "PENDING_REVIEW → CANCELLED (customer-initiated)",               roles: [Customer],                                                            code: 200, input: [], output: Order, side_effects: ["dispensing_status → CANCELLED; cascade refund if PAID"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/open-pharmacist-review",                  description: "PENDING_REVIEW → PHARMACIST_REVIEWING; creates PharmacistReview", roles: [PharmacistReReviewer],                                              code: 201, input: ["assigned_pharmacist_id"], output: PharmacistReview, side_effects: ["dispensing_status → PHARMACIST_REVIEWING; pharmacist_review_id set"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/dispense",                                description: "APPROVED → DISPENSED",                                          roles: [Pharmacist, PharmacistReReviewer],                                    code: 200, input: [], output: Order, side_effects: ["dispensing_status → DISPENSED"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/ship",                                    description: "DISPENSED → SHIPPED; auto-advances cold-chain shipment",        roles: [PlatformAdmin],                                                       code: 200, input: [], output: Order, side_effects: ["dispensing_status → SHIPPED; ColdChainShipment DISPATCHED→IN_TRANSIT cascade"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/deliver",                                 description: "SHIPPED → DELIVERED; checks excursion_score",                  roles: [PlatformAdmin],                                                       code: 200, input: [], output: Order, side_effects: ["dispensing_status → DELIVERED; ColdChainShipment IN_TRANSIT→DELIVERED; auto-archive prescription"] }

  # ----- Pharmacist Reviews (action endpoints; no list/get GET to keep surface lean) -----
  - { method: GET,    path: "/pharma-platforms/{pid}/orders/{orderId}/pharmacist-reviews/{reviewId}",           description: "Get review",                                                    roles: [PharmacistReReviewer, PlatformAdmin],                                 code: 200, input: [], output: PharmacistReview, side_effects: [] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/pharmacist-reviews/{reviewId}/approve",   description: "IN_REVIEW → APPROVED",                                          roles: [PharmacistReReviewer],                                                code: 200, input: ["interaction_check_passed","dosage_rationality_passed","decision_notes?"], output: PharmacistReview, side_effects: ["status → APPROVED; Order dispensing_status → APPROVED cascade"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/pharmacist-reviews/{reviewId}/reject",    description: "IN_REVIEW → REJECTED",                                          roles: [PharmacistReReviewer],                                                code: 200, input: ["decision_notes"], output: PharmacistReview, side_effects: ["status → REJECTED; Order → REJECTED; refund cascade"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/pharmacist-reviews/{reviewId}/request-change", description: "IN_REVIEW → REQUEST_CHANGE",                                roles: [PharmacistReReviewer],                                                code: 200, input: ["decision_notes"], output: PharmacistReview, side_effects: ["status → REQUEST_CHANGE"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/orders/{orderId}/pharmacist-reviews/{reviewId}/resume",    description: "REQUEST_CHANGE → IN_REVIEW (cycle)",                            roles: [PharmacistReReviewer],                                                code: 200, input: [], output: PharmacistReview, side_effects: ["status → IN_REVIEW; revision_count += 1"] }

  # ----- Cold Chain Shipments -----
  - { method: POST,   path: "/pharma-platforms/{pid}/cold-chain-shipments",                                     description: "Dispatch a cold-chain shipment for an APPROVED/DISPENSED order", roles: [PlatformAdmin],                                                       code: 201, input: ["order_id","courier_pharmacist_id","device_id"], output: ColdChainShipment, side_effects: ["status = DISPATCHED; dispatched_at = clock; Order.cold_chain_shipment_id set"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/cold-chain-shipments/{shipmentId}/readings",               description: "Append a temperature reading; recomputes excursion_score",       roles: [PlatformAdmin, Pharmacist],                                           code: 200, input: ["recorded_at","celsius_tenths"], output: ColdChainShipment, side_effects: ["temperature_readings appended; excursion_score recomputed"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/cold-chain-shipments/{shipmentId}/mark-in-transit",        description: "DISPATCHED → IN_TRANSIT (alternative to Order.ship cascade — for direct test access)", roles: [PlatformAdmin], code: 200, input: [], output: ColdChainShipment, side_effects: ["status → IN_TRANSIT"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/cold-chain-shipments/{shipmentId}/dispose",                description: "→ DISPOSED (only when excursion_score > threshold)",            roles: [PlatformAdmin],                                                       code: 200, input: [], output: ColdChainShipment, side_effects: ["status → DISPOSED; Order → REJECTED, refund cascade"] }
  - { method: GET,    path: "/pharma-platforms/{pid}/cold-chain-shipments/{shipmentId}",                        description: "Get shipment",                                                  roles: [PlatformAdmin, Pharmacist, RegulatoryGateway],                        code: 200, input: [], output: ColdChainShipment, side_effects: [] }

  # ----- Adverse Reaction Reports -----
  - { method: POST,   path: "/pharma-platforms/{pid}/adverse-reactions",                                        description: "Create ADR (REPORTED); deadline computed",                       roles: [Customer, PharmacistReReviewer],                                      code: 201, input: ["order_id?","drug_id","customer_id","reporter_kind","severity"], output: AdverseReactionReport, side_effects: ["status = REPORTED; reporting_deadline_at computed"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/adverse-reactions/{reportId}/escalate",                    description: "Escalate severity NON_SERIOUS → SERIOUS; deadline reset per forward-looking variant", roles: [PharmacistReReviewer], code: 200, input: [], output: AdverseReactionReport, side_effects: ["severity = SERIOUS; reporting_deadline_at recomputed (anchored at original reported_at)"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/adverse-reactions/{reportId}/submit",                      description: "REPORTED → SUBMITTED",                                          roles: [PharmacistReReviewer],                                                code: 200, input: [], output: AdverseReactionReport, side_effects: ["submitted_to_authority_at = clock; serious → FOLLOW_UP_PENDING auto"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/adverse-reactions/{reportId}/acknowledge",                 description: "SUBMITTED → ACKNOWLEDGED (non-serious only)",                   roles: [RegulatoryGateway],                                                   code: 200, input: [], output: AdverseReactionReport, side_effects: ["status → ACKNOWLEDGED"] }
  - { method: POST,   path: "/pharma-platforms/{pid}/adverse-reactions/{reportId}/archive",                     description: "→ ARCHIVED (serious requires follow-up window)",                roles: [PharmacistReReviewer],                                                code: 200, input: [], output: AdverseReactionReport, side_effects: ["archived_at = clock"] }
  - { method: GET,    path: "/pharma-platforms/{pid}/adverse-reactions/{reportId}",                             description: "Get ADR",                                                       roles: [PharmacistReReviewer, RegulatoryGateway, PlatformAdmin],              code: 200, input: [], output: AdverseReactionReport, side_effects: [] }
  - { method: GET,    path: "/pharma-platforms/{pid}/adverse-reactions",                                        description: "List ADRs (filter by status/severity)",                          roles: [PharmacistReReviewer, RegulatoryGateway, PlatformAdmin],              code: 200, input: ["status?","severity?","limit?","offset?"], output: "AdverseReactionReport[]", side_effects: [] }

  # ----- Audit and external event read endpoints -----
  - { method: GET,    path: "/pharma-platforms/{pid}/audit-logs",                                               description: "List audit logs (filter by subject_type/subject_id/action)",     roles: [PlatformAdmin, RegulatoryGateway],                                    code: 200, input: ["subject_type?","subject_id?","action?","limit?","offset?"], output: "AuditLog[]", side_effects: [] }
  - { method: GET,    path: "/pharma-platforms/{pid}/external-events",                                          description: "List external sync events (filter by channel/event_type)",       roles: [PlatformAdmin, RegulatoryGateway],                                    code: 200, input: ["channel?","event_type?","subject_id?","limit?","offset?"], output: "ExternalEvent[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / context ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,                http: 403, condition: "Role not allowed for this endpoint" }
  - { id: ERR_INVALID_REQUEST,                         http: 400, condition: "Generic input/body validation failure (missing field, type mismatch, enum value out of set)" }

  # --- Existence ---
  - { id: ERR_NOT_FOUND,                               http: 404, condition: "Generic resource not found" }
  - { id: ERR_PLATFORM_NOT_FOUND,                      http: 404, condition: "Platform id not found" }
  - { id: ERR_DRUG_NOT_FOUND,                          http: 404, condition: "Drug id not found" }
  - { id: ERR_VENDOR_NOT_FOUND,                        http: 404, condition: "Vendor id not found" }
  - { id: ERR_PHARMACIST_NOT_FOUND,                    http: 404, condition: "Pharmacist id not found" }
  - { id: ERR_CUSTOMER_NOT_FOUND,                      http: 404, condition: "Customer id not found" }
  - { id: ERR_PRESCRIPTION_NOT_FOUND,                  http: 404, condition: "Prescription id not found" }
  - { id: ERR_ORDER_NOT_FOUND,                         http: 404, condition: "Order id not found" }
  - { id: ERR_REVIEW_NOT_FOUND,                        http: 404, condition: "PharmacistReview id not found" }
  - { id: ERR_SHIPMENT_NOT_FOUND,                      http: 404, condition: "ColdChainShipment id not found" }
  - { id: ERR_REPORT_NOT_FOUND,                        http: 404, condition: "AdverseReactionReport id not found" }
  - { id: ERR_RULE_NOT_FOUND,                          http: 404, condition: "PurchaseLimitRule id not found" }

  # --- Concurrency / version ---
  - { id: ERR_VERSION_MISMATCH,                        http: 409, condition: "Optional version in body does not equal current row version" }
  - { id: ERR_IDEMPOTENCY_CONFLICT,                    http: 409, condition: "ExternalEvent idempotency_key already used by a different payload (system-internal; surfaced if test inspects it)" }

  # --- Drug / catalog ---
  - { id: ERR_NDC_INVALID_FORMAT,                      http: 400, condition: "Drug.ndc fails regex" }
  - { id: ERR_NDC_DUPLICATE,                           http: 409, condition: "Another non-OFF_SHELF drug on the same platform has the same NDC" }
  - { id: ERR_CONTROL_CATEGORY_REQUIRES_PRESCRIPTION,  http: 400, condition: "Drug.control_category != NONE but classification != PRESCRIPTION" }
  - { id: ERR_DRUG_NOT_PENDING_REVIEW,                 http: 409, condition: "Drug.shelve called when status not in {PENDING_REVIEW, OFF_SHELF}" }
  - { id: ERR_DRUG_NOT_ON_SHELF,                       http: 409, condition: "Drug.off-shelve called when status != ON_SHELF" }
  - { id: ERR_DRUG_NOT_OFF_SHELF,                      http: 409, condition: "Re-shelve called explicitly on a drug that is not OFF_SHELF" }
  - { id: ERR_DRUG_NOT_PRESCRIBABLE,                   http: 422, condition: "Prescription drug_items references a drug that is not ON_SHELF or not classification==PRESCRIPTION" }

  # --- Vendor / qualification ---
  - { id: ERR_VENDOR_NOT_ACTIVE,                       http: 409, condition: "Drug shelve / new drug create requires vendor.qualification_status==ACTIVE" }
  - { id: ERR_VENDOR_NOT_IN_REVIEW,                    http: 409, condition: "Re-submit-qualification called when vendor.qualification_status not in {REVIEW_REQUIRED, SUSPENDED}" }
  - { id: ERR_RENEWAL_DATE_NOT_FUTURE,                 http: 422, condition: "Renewal expiry date is not strictly greater than platform clock" }

  # --- Pharmacist ---
  - { id: ERR_PHARMACIST_NOT_ACTIVE,                   http: 403, condition: "Acting/assigned pharmacist's qualification_status != ACTIVE" }

  # --- Customer / real-name ---
  - { id: ERR_REAL_NAME_REQUIRED,                      http: 403, condition: "Order containing prescription drug requires customer.real_name_verified==true and id_document_no non-empty" }

  # --- Prescription ---
  - { id: ERR_PRESCRIPTION_NOT_IN_REVIEW,              http: 409, condition: "Approve/reject called when prescription.status != REVIEW_PENDING" }
  - { id: ERR_PRESCRIPTION_EXPIRED,                    http: 422, condition: "Approve called after issued_at + validity_days" }
  - { id: ERR_PRESCRIBER_NOT_QUALIFIED,                http: 422, condition: "Prescriber license is on the denylist" }
  - { id: ERR_CONTRAINDICATION_VIOLATION,              http: 422, condition: "Drug.contraindications intersects customer.special_population_flags" }
  - { id: ERR_PRESCRIPTION_IN_USE,                     http: 409, condition: "Prescription.revoke called while at least one Order in non-terminal state references it" }
  - { id: ERR_PRESCRIPTION_NOT_APPROVED,               http: 409, condition: "Order pay/open-pharmacist-review requires referenced prescription.status==APPROVED" }

  # --- Purchase limits ---
  - { id: ERR_PURCHASE_LIMIT_EXCEEDED,                 http: 422, condition: "Per-order or per-window quantity cap would be exceeded" }
  - { id: ERR_SPECIAL_POPULATION_RESTRICTED,           http: 403, condition: "Customer special_population_flags blocked from drug control_category by PurchaseLimitRule" }

  # --- Order state ---
  - { id: ERR_ORDER_NOT_REVIEWABLE,                    http: 409, condition: "open-pharmacist-review called when dispensing_status != PENDING_REVIEW" }
  - { id: ERR_ORDER_NOT_PAYABLE,                       http: 409, condition: "Pay called when order is in REJECTED/CANCELLED or already PAID/REFUNDED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE,                   http: 409, condition: "Cancel called when dispensing_status != PENDING_REVIEW" }
  - { id: ERR_ORDER_NOT_APPROVED,                      http: 409, condition: "Dispense called when dispensing_status != APPROVED" }
  - { id: ERR_ORDER_NOT_PAID,                          http: 409, condition: "Dispense called when payment_status != PAID" }
  - { id: ERR_ORDER_NOT_DISPENSED,                     http: 409, condition: "Ship called when dispensing_status != DISPENSED" }
  - { id: ERR_ORDER_NOT_SHIPPED,                       http: 409, condition: "Deliver called when dispensing_status != SHIPPED" }
  - { id: ERR_REVIEW_ALREADY_OPEN,                     http: 409, condition: "open-pharmacist-review called when Order already has pharmacist_review_id (concurrency loser)" }

  # --- Pharmacist review ---
  - { id: ERR_REVIEW_NOT_IN_REVIEW,                    http: 409, condition: "Action endpoint expects review.status==IN_REVIEW" }
  - { id: ERR_REVIEW_NOT_IN_REQUEST_CHANGE,            http: 409, condition: "resume expects review.status==REQUEST_CHANGE" }
  - { id: ERR_REVIEWER_MISMATCH,                       http: 403, condition: "X-User-ID != review.assigned_pharmacist_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION,         http: 403, condition: "Acting pharmacist == prescription.reviewer_pharmacist_id" }
  - { id: ERR_REVIEW_CHECKS_FAILED,                    http: 422, condition: "Approve called without interaction_check_passed=true AND dosage_rationality_passed=true" }
  - { id: ERR_REVIEW_NOTES_TOO_SHORT,                  http: 422, condition: "decision_notes < 10 chars on reject/request-change" }
  - { id: ERR_REVIEW_MAX_REVISIONS,                    http: 409, condition: "request-change attempted when revision_count >= MAX_REVISIONS (=2)" }

  # --- Cold chain ---
  - { id: ERR_COLD_CHAIN_NOT_APPLICABLE,               http: 422, condition: "Shipment created for an Order without cold_chain_required or in wrong dispensing_status" }
  - { id: ERR_COURIER_NOT_QUALIFIED,                   http: 422, condition: "courier_pharmacist_id is not courier_qualified or not ACTIVE" }
  - { id: ERR_COLD_CHAIN_SHIPMENT_REQUIRED,            http: 409, condition: "Order.ship called on cold-chain order without a DISPATCHED ColdChainShipment" }
  - { id: ERR_DISPOSAL_NOT_JUSTIFIED,                  http: 422, condition: "Dispose called when excursion_score <= COLD_CHAIN_DISPOSE_THRESHOLD" }
  - { id: ERR_COLD_CHAIN_OUT_OF_RANGE,                 http: 422, condition: "Order.deliver called when shipment.excursion_score > threshold" }
  - { id: ERR_SHIPMENT_NOT_DISPOSABLE,                 http: 409, condition: "Dispose called on shipment in terminal state" }

  # --- ADR ---
  - { id: ERR_REPORT_NOT_REPORTED,                     http: 409, condition: "Submit called when status != REPORTED" }
  - { id: ERR_REPORT_REQUIRES_FOLLOW_UP,               http: 409, condition: "Acknowledge called on a SERIOUS report (must transit FOLLOW_UP_PENDING)" }
  - { id: ERR_REPORT_NOT_ARCHIVABLE,                   http: 409, condition: "Archive called from a state other than {FOLLOW_UP_PENDING, ACKNOWLEDGED}, or severity rules violated" }
  - { id: ERR_REPORTING_DEADLINE_PASSED,               http: 422, condition: "Submit attempted after reporting_deadline_at + GRACE_HOURS" }
  - { id: ERR_FOLLOW_UP_INCOMPLETE,                    http: 409, condition: "Archive on serious ADR before follow_up_due_at" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operates the platform: catalog, vendors, pharmacists, customers, fulfillment, audit"
    identity: opaque
    exclusive_operations:
      - "POST /pharma-platforms — Create platform"
      - "POST /_clock/advance — Advance clock"
      - "POST /drugs/{id}/shelve — Shelve drug"
      - "POST /drugs/{id}/off-shelve — Off-shelve drug"
      - "POST /vendors — Create vendor"
      - "POST /pharmacists — Create pharmacist"
      - "POST /pharmacists/{id}/renew-certificate — Renew pharmacist"
      - "POST /pharmacists/{id}/suspend — Suspend pharmacist"
      - "POST /customers — Create customer"
      - "PATCH /customers/{id} — Update customer"
      - "POST /purchase-limit-rules — Create rule"
      - "DELETE /purchase-limit-rules/{id} — Delete rule"
      - "POST /orders/{id}/ship — Ship order"
      - "POST /orders/{id}/deliver — Deliver order"
      - "POST /cold-chain-shipments — Dispatch shipment"
      - "POST /cold-chain-shipments/{id}/mark-in-transit — Mark in transit"
      - "POST /cold-chain-shipments/{id}/dispose — Dispose shipment"
    shared_operations:
      - "POST /drugs — with VendorAdmin"
      - "POST /prescriber-denylist — with RegulatoryGateway"
      - "POST /cold-chain-shipments/{id}/readings — with Pharmacist"
      - "GET /audit-logs — with RegulatoryGateway"
      - "GET /external-events — with RegulatoryGateway"
      - "POST /prescriptions/{id}/revoke — with PrescriptionReviewer"

  - name: VendorAdmin
    description: "Vendor operator — manages own catalog drug submissions and qualification renewal"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /vendors/{vendorId}/resubmit-qualification — Re-submit qualification (only when X-User-ID == vendor.id)"
    shared_operations:
      - "POST /drugs — with PlatformAdmin (creating drugs whose vendor_id == X-User-ID)"
      - "GET /drugs, GET /vendors, GET /vendors/{id}, GET /pharmacists — read access"

  - name: PrescriptionReviewer
    description: "Pharmacist acting in the FIRST-LINE prescription review role (validates prescription document)"
    identity: "entity_backed:Pharmacist"
    exclusive_operations:
      - "POST /prescriptions/{id}/approve — Approve prescription"
      - "POST /prescriptions/{id}/reject — Reject prescription"
    shared_operations:
      - "POST /prescriptions — Upload prescription (with Customer)"
      - "POST /prescriptions/{id}/revoke — Revoke (with PlatformAdmin)"
      - "GET /prescriber-denylist, GET /pharmacists, GET /purchase-limit-rules — read"

  - name: PharmacistReReviewer
    description: "Pharmacist acting in the SECOND-LINE re-review role (drug interaction + dosage rationality on the order)"
    identity: "entity_backed:Pharmacist"
    exclusive_operations:
      - "POST /orders/{id}/open-pharmacist-review — Open second-line review"
      - "POST /pharmacist-reviews/{id}/approve — Approve review (X-User-ID != prescription.reviewer_pharmacist_id, segregation of duties)"
      - "POST /pharmacist-reviews/{id}/reject — Reject review"
      - "POST /pharmacist-reviews/{id}/request-change — Request change"
      - "POST /pharmacist-reviews/{id}/resume — Resume after change"
      - "POST /adverse-reactions/{id}/escalate — Escalate severity"
      - "POST /adverse-reactions/{id}/submit — Submit ADR"
      - "POST /adverse-reactions/{id}/archive — Archive ADR"
    shared_operations:
      - "POST /adverse-reactions — Create ADR (with Customer)"
      - "POST /orders/{id}/dispense — Dispense (with Pharmacist)"
      - "GET /orders, GET /pharmacist-reviews/{id}, GET /pharmacists, GET /prescriptions/{id} — read"
    note: "Same Pharmacist may switch between PrescriptionReviewer and PharmacistReReviewer X-User-Role headers across requests, but on a single Prescription/Order pair the two X-User-IDs MUST differ (segregation of duties enforced by ERR_SEGREGATION_OF_DUTIES_VIOLATION)."

  - name: Pharmacist
    description: "Generic pharmacist actions that are not part of either review role: cold-chain readings + dispense"
    identity: "entity_backed:Pharmacist"
    exclusive_operations: []
    shared_operations:
      - "POST /orders/{id}/dispense — with PharmacistReReviewer"
      - "POST /cold-chain-shipments/{id}/readings — with PlatformAdmin"
      - "GET /cold-chain-shipments/{id} — read"

  - name: Customer
    description: "End consumer — places orders, uploads prescriptions, reports ADRs"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /orders — Place order (X-User-ID == customer_id)"
      - "POST /orders/{id}/pay — Pay (must be the placing customer)"
      - "POST /orders/{id}/cancel — Cancel"
    shared_operations:
      - "POST /prescriptions — Upload (with PrescriptionReviewer)"
      - "POST /adverse-reactions — Report ADR (with PharmacistReReviewer)"
      - "GET /orders/{id}, GET /customers/{id}, GET /prescriptions/{id}, GET /drugs — read"

  - name: RegulatoryGateway
    description: "Regulatory authority gateway — acknowledges submitted ADRs, manages denylist, reads audit"
    identity: opaque
    exclusive_operations:
      - "POST /adverse-reactions/{id}/acknowledge — Acknowledge ADR"
    shared_operations:
      - "POST /prescriber-denylist — with PlatformAdmin"
      - "GET /audit-logs, GET /external-events, GET /adverse-reactions — read"
