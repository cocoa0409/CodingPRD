  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: scoring_task_revision_cycle
        grounds:
          - state_machines.ScoringTask.IN_PROGRESS_to_SUBMITTED
          - state_machines.ScoringTask.SUBMITTED_to_RETURNED_FOR_REVISION
          - state_machines.ScoringTask.RETURNED_FOR_REVISION_to_IN_PROGRESS
        distinguishing_aspect: |
          ScoringTask cycles SUBMITTED -> RETURNED_FOR_REVISION -> IN_PROGRESS -> SUBMITTED ->
          ACCEPTED: a cyclic machine on the ScoringTask entity (not a linear pipeline), with
          the study remaining SCORING_IN_PROGRESS throughout the loop.
        test_recipe:
          setup:
            - "HST study with PRIMARY task assigned to scorer S1"
