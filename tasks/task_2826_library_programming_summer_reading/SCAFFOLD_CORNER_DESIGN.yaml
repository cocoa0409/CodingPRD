              payload: { units: 20, logged_on: "2026-07-21", source: "STAFF_DESK" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /library/participants/${part}/log-corrections"
              payload: { corrected_entry_id: "${e1}", units_delta: -10, expected_participant_version: "${pv_old}" }
