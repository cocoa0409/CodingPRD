            - call: "GET /districts/${d_id}/schools/${s_id}/students/${v_id}"
              payload: {}
              as: TeamLead
              captures: { v_v2: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${v_id}/plans"
              payload: { catalog_entry_id: "${ce_id}", interventionist_id: "${i_id}", expected_student_version: "${v_v2}" }
              as: TeamLead
              captures: { p_id: $.data.id }
            # Now create WINTER window showing TIER_3 band to authorize TIER_2→TIER_3 movement
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "WINTER", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "WINTER", opens_on: "2026-12-01", closes_on: "2026-12-15" }
              as: DistrictCoordinator
              captures: { w2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w2_id}/scores"
              payload: { student_id: "${v_id}", subject: "READING", raw_score: 60 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w2_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w2_id}/score"
              payload: {}
              as: DistrictCoordinator
            # Propose TIER_3 movement
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${v_id}"
              payload: {}
              as: TeamLead
              captures: { v_v3: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${v_id}/tier-movements"
              payload: { to_tier: "TIER_3", rationale: "WINTER screening shows TIER_3", expected_student_version: "${v_v3}" }
