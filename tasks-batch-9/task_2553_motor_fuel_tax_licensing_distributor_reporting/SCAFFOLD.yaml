scenario: |
  Generate task harder than expert level!

  2553. Motor Fuel Tax Licensing & Distributor Reporting (state motor fuel tax unit): licensee
  classification across suppliers, distributors, blenders, transporters and retailers with bonding
  requirements, terminal rack removal reporting and tax imposition point determination, tax-exempt
  sales to government, agriculture and export with certificate documentation, dyed fuel rules,
  penalties for on-road use and roadside inspection coordination, monthly return filing with
  schedules by product, transaction type and counterparty, refund claims for off-road use, power
  take-off allocations and refrigeration units, cross-matching between supplier and distributor
  schedules to detect unreported gallons, audit selection and evasion investigation
domain_name: motor-fuel-tax-licensing-distributor-reporting
api_prefix: "/mft"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - conditional_feature_flags

  entity_topology: graph
  # Licensee is self-referential (group filer), MonthlyReturn is self-referential (amendment
  # chain), and MatchDiscrepancy is a junction across two Licensees + two MonthlyReturns for the
  # same (product, period) cell. ScheduleLine is a many-to-many edge between a filer's schedule
  # and an arbitrary counterparty Licensee, so the reporting surface is a directed graph whose
  # edges must agree from both endpoints.

  state_machine_shape: cyclic
  # Licensee cycles ACTIVE -> SUSPENDED -> ACTIVE; MatchDiscrepancy cycles
  # INQUIRY_SENT -> RESPONSE_RECEIVED -> INQUIRY_SENT for up to MAX_INQUIRY_ROUNDS;
  # AuditCase cycles PRELIM_FINDINGS -> TAXPAYER_RESPONSE -> FIELDWORK and carries two
  # independent dimensions (case_status x assessment_status); MonthlyReturn carries two
  # independent dimensions (filing_status x match_status).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  # ReturnsExaminer recommends refund dispositions but cannot decide them; AuditManager opens and
  # works audit cases but cannot issue their assessments; the acting X-User-ID that opened a case
  # or reviewed a claim is barred from the second step even when it carries the other role.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 62 endpoints / 75 error codes / 10 calculations / 8 state machines /
  # 79 ordered validation rules. Density, not volume, is the point: every gallon reported on a
  # schedule plays four separate roles at once - (a) a tax-base input, (b) a cross-match edge that
  # must agree with a counterparty's independently filed schedule, (c) a refund-capacity input,
  # and (d) a risk-score input feeding audit selection.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================================
# 1.1 Entity-Relationship Table
# =====================================================================================
entities:
  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the licensee
        constraints: 1..120 chars
      - name: fein
        type: string
        source: input
        description: federal employer identification number, unique across all licensees
        constraints: "pattern ^[0-9]{2}-[0-9]{7}$; uniqueness violation -> ERR_DUPLICATE_FEIN"
      - name: license_type
        type: enum
        source: input
        description: statutory classification driving bond multiplier, schedule rights and imposition-point role
        constraints: "one of {SUPPLIER, DISTRIBUTOR, BLENDER, TRANSPORTER, RETAILER}"
      - name: mailing_state
        type: string
        source: input
        description: two-letter state code of record
        constraints: "pattern ^[A-Z]{2}$"
      - name: status
        type: enum
        source: system
        description: license lifecycle state
        default: PENDING_BOND
        constraints: "one of {PENDING_BOND, ACTIVE, SUSPENDED, REVOKED}"
      - name: parent_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; nullable; consolidated group filer (parent must have license_type SUPPLIER, status ACTIVE, and parent_licensee_id == null); self-reference or depth > 1 -> ERR_INVALID_PARENT_LICENSEE"
        default: null
      - name: gross_net_election
        type: enum
        source: input
        description: "irrevocable election picking the taxable-gallons basis variant applied to this licensee's rack removals"
        default: NET
        constraints: "one of {NET, GROSS}"
      - name: retail_channel
        type: enum
        source: input
        description: "conditional flag; HIGHWAY retailers may not take DYED_DIESEL at the rack"
        default: NOT_APPLICABLE
        constraints: "one of {HIGHWAY, MARINE, FARM, NOT_APPLICABLE}"
      - name: avg_monthly_tax_liability_cents
        type: integer
        source: computed
        description: "per calculations.licensee_bond_requirement: mean tax_due_cents over the newest up-to-3 MonthlyReturns of this licensee with filing_status == FILED; NEW_LICENSEE_ASSUMED_LIABILITY_CENTS when that set is empty"
      - name: required_bond_cents
        type: integer
        source: computed
        description: "per calculations.licensee_bond_requirement; doubles while status == SUSPENDED"
      - name: posted_bond_cents
        type: integer
        source: computed
        description: "sum of BondInstrument.amount_cents for this licensee with status == ACTIVE"
      - name: bond_deficiency_cents
        type: integer
        source: computed
        description: "max(0, required_bond_cents - posted_bond_cents)"
      - name: balance_cents
        type: integer
        source: computed
        description: "per calculations.licensee_balance: signed sum of every LedgerEntry.amount_cents of this licensee; positive means the licensee owes the state"
      - name: effective_taxable_gallons_ytd
        type: number
        source: computed
        description: "per calculations.licensee_balance input_set note: sum of MonthlyReturn.taxable_gallons_total over this licensee's returns with filing_status == FILED whose period_month year equals the logical clock's calendar year; 2 decimals"
      - name: dyed_violation_count
        type: integer
        source: system
        description: count of this licensee's RoadsideInspection rows with dye_test_result POSITIVE and status != DISMISSED
        default: 0
      - name: late_filing_count
        type: integer
        source: system
        description: count of this licensee's FILED-or-SUPERSEDED original returns whose days_late was >= 1
        default: 0
      - name: open_audit_count
        type: integer
        source: system
        description: count of AuditCase rows with subject_licensee_id == this id and case_status != CLOSED
        default: 0
      - name: open_discrepancy_count
        type: integer
        source: system
        description: "count of MatchDiscrepancy rows where distributor_licensee_id == this id and status IN {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED}"
        default: 0
      - name: unreported_gallons_total
        type: number
        source: computed
        description: "sum of MatchDiscrepancy.variance_gallons where distributor_licensee_id == this id, direction == UNREPORTED_BY_PURCHASER and status NOT IN {WRITTEN_OFF, RESOLVED_EXPLAINED}; 2 decimals"
      - name: risk_score_variance_weighted
        type: integer
        source: computed
        description: "per calculations.licensee_risk_score variant VARIANCE_WEIGHTED; 0..100"
      - name: risk_score_frequency_weighted
        type: integer
        source: computed
        description: "per calculations.licensee_risk_score variant FREQUENCY_WEIGHTED; 0..100"

  - name: BondInstrument
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the principal on the surety bond (taken from the path)"
      - name: amount_cents
        type: integer
        source: input
        description: face amount of the bond
        constraints: ">= 100000"
      - name: surety_name
        type: string
        source: input
        description: issuing surety company
      - name: effective_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the bond takes effect
      - name: status
        type: enum
        source: system
        description: bond lifecycle state
        default: ACTIVE
        constraints: "one of {ACTIVE, RELEASED, FORFEITED}"
      - name: release_reason
        type: enum
        source: system
        description: why the bond left ACTIVE; SUPERSEDED_BY_NEW_BOND is written by the system on the prior ACTIVE bond when a newer bond is posted, OPERATOR_RELEASE by POST /mft/bonds/{id}/release, LICENSE_REVOKED by the revoke cascade
        default: null
        constraints: "one of {SUPERSEDED_BY_NEW_BOND, OPERATOR_RELEASE, LICENSE_REVOKED} or null while ACTIVE"

  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - name: terminal_control_number
        type: string
        source: input
        description: IRS terminal control number, unique
        constraints: "pattern ^T[0-9]{2}[A-Z]{2}[0-9]{4}$; uniqueness violation -> ERR_DUPLICATE_TCN"
      - name: name
        type: string
        source: input
        description: terminal trade name
      - name: state_code
        type: string
        source: input
        description: two-letter state code where the rack sits
        constraints: "pattern ^[A-Z]{2}$"

  - name: ExemptionCertificate
    parent: Licensee
    common_fields: true
    fields:
      - name: purchaser_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the exempt purchaser named on the certificate (government fleets, farms and out-of-state buyers are registered as RETAILER licensees)"
      - name: exemption_type
        type: enum
        source: input
        description: statutory exemption class; gates which product codes may ride on the certificate
        constraints: "one of {GOVERNMENT, AGRICULTURE, EXPORT}"
      - name: document_number
        type: string
        source: input
        description: "certificate document number, unique across ALL certificates (validation priority 300), not merely per purchaser"
        constraints: "uniqueness violation -> ERR_DUPLICATE_CERTIFICATE_NUMBER"
      - name: valid_from
        type: string
        source: input
        description: ISO 8601 date; coverage window start, inclusive
      - name: valid_to
        type: string
        source: input
        description: ISO 8601 date; coverage window end, inclusive; must be >= valid_from
      - name: status
        type: enum
        source: system
        description: certificate state
        default: ACTIVE
        constraints: "one of {ACTIVE, REVOKED}"

  - name: RackRemoval
    parent: Terminal
    common_fields: false
    fields:
      - name: terminal_id
        type: string
        source: input
        description: "FK -> Terminal.id; the rack the fuel physically left"
      - name: position_holder_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the SUPPLIER holding the terminal position; its gross_net_election picks the taxable-gallons basis variant"
      - name: purchaser_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the licensee taking delivery at the rack"
      - name: exemption_certificate_id
        type: string
        source: input
        description: "FK -> ExemptionCertificate.id; nullable; certificate presented at the rack"
        default: null
      - name: product_code
        type: enum
        source: input
        description: fuel product removed
        constraints: "one of {GASOLINE, UNDYED_DIESEL, DYED_DIESEL, JET_FUEL, AVIATION_GAS, ETHANOL_E100, BIODIESEL_B100}"
      - name: gross_gallons
        type: number
        source: input
        description: billed (uncorrected) gallons, 2 decimals
        constraints: "> 0"
      - name: net_gallons
        type: number
        source: input
        description: temperature-corrected gallons, 2 decimals
        constraints: "> 0 and <= gross_gallons"
      - name: removal_date
        type: string
        source: input
        description: ISO 8601 date of the rack removal
      - name: destination_state
        type: string
        source: input
        description: two-letter destination state code declared on the bill of lading
        constraints: "pattern ^[A-Z]{2}$"
      - name: bill_of_lading_number
        type: string
        source: input
        description: BOL number, unique per terminal_id
        constraints: "uniqueness violation -> ERR_DUPLICATE_BOL"
      - name: taxable_gallons
        type: number
        source: computed
        description: "per calculations.rack_removal_tax_imposition; 0.00 when imposition_point == NONE_EXEMPT; 2 decimals"
      - name: imposition_point
        type: enum
        source: computed
        description: "per calculations.rack_removal_tax_imposition"
        constraints: "one of {TERMINAL_RACK, DEFERRED_TO_PURCHASER, NONE_EXEMPT}"
      - name: tax_imposed
        type: boolean
        source: computed
        description: "true only when imposition_point == TERMINAL_RACK"
      - name: tax_amount_cents
        type: integer
        source: computed
        description: "per calculations.rack_removal_tax_imposition; 0 unless imposition_point == TERMINAL_RACK"
      - name: deferred_tax_cents
        type: integer
        source: computed
        description: "per calculations.rack_removal_tax_imposition; the tax the purchaser will owe on its own return; 0 unless imposition_point == DEFERRED_TO_PURCHASER"
      - name: basis_used
        type: enum
        source: computed
        description: which gallons basis variant produced taxable_gallons
        constraints: "one of {NET, GROSS}"

  - name: MonthlyReturn
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the filer"
      - name: period_month
        type: string
        source: input
        description: reporting period
        constraints: "pattern ^[0-9]{4}-(0[1-9]|1[0-2])$; at most one non-SUPERSEDED return per (licensee_id, period_month) -> ERR_DUPLICATE_RETURN_PERIOD"
      - name: amends_return_id
        type: string
        source: system
        description: "FK -> MonthlyReturn.id; nullable; the return this row amends (self-referential amendment chain)"
        default: null
      - name: amendment_sequence
        type: integer
        source: system
        description: 0 for an original return, prior sequence + 1 for each amendment
        default: 0
      - name: amendment_count
        type: integer
        source: system
        description: number of amendment rows created against this return
        default: 0
      - name: filing_status
        type: enum
        source: system
        description: filing dimension of this return's parallel state machine
        default: DRAFT
        constraints: "one of {DRAFT, FILED, SUPERSEDED}"
      - name: match_status
        type: enum
        source: system
        description: cross-match dimension of this return's parallel state machine, advanced independently of filing_status
        default: NOT_MATCHED
        constraints: "one of {NOT_MATCHED, MATCH_CLEAN, MATCH_VARIANCE, MATCH_RESOLVED}"
      - name: attest_name
        type: string
        source: input
        description: name of the officer attesting the return at file time
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: logical-clock instant the return was filed; null while DRAFT
        default: null
      - name: due_at
        type: datetime
        source: computed
        description: "20th day of the month following period_month at 23:59:59Z"
      - name: days_late
        type: integer
        source: computed
        description: "per calculations.return_penalty_and_interest; 0 when filed_at <= due_at"
      - name: taxable_gallons_total
        type: number
        source: computed
        description: "per calculations.monthly_return_tax_due: sum over product codes of the floored per-product net gallons; 2 decimals"
      - name: tax_due_cents
        type: integer
        source: computed
        description: "per calculations.monthly_return_tax_due"
      - name: interest_cents
        type: integer
        source: computed
        description: "per calculations.return_penalty_and_interest step 2"
      - name: penalty_cents
        type: integer
        source: computed
        description: "per calculations.return_penalty_and_interest step 3"
      - name: total_remittance_cents
        type: integer
        source: computed
        description: "per calculations.return_penalty_and_interest step 4: tax_due_cents + interest_cents + penalty_cents"
      - name: amendment_delta_cents
        type: integer
        source: computed
        description: "0 for an original return; for an amendment, this return's total_remittance_cents minus the superseded return's total_remittance_cents"

  - name: ReturnSchedule
    parent: MonthlyReturn
    common_fields: true
    fields:
      - name: return_id
        type: string
        source: input
        description: "FK -> MonthlyReturn.id; taken from the path"
      - name: schedule_code
        type: enum
        source: input
        description: statutory schedule this block of transactions belongs to
        constraints: "one of {SCH_1_RECEIVED_TAX_PAID, SCH_2_RECEIVED_TAX_UNPAID, SCH_5_DELIVERED_TAX_COLLECTED, SCH_6_EXEMPT_SALES, SCH_7_EXPORTS, SCH_10_DYED_SALES}; at most one schedule per (return_id, schedule_code, product_code) -> ERR_DUPLICATE_SCHEDULE"
      - name: product_code
        type: enum
        source: input
        description: fuel product this schedule reports
        constraints: "one of {GASOLINE, UNDYED_DIESEL, DYED_DIESEL, JET_FUEL, AVIATION_GAS, ETHANOL_E100, BIODIESEL_B100}"
      - name: total_gallons
        type: number
        source: input
        description: "gallons total the FILER declares for this schedule, 2 decimals; it is never auto-maintained from the lines, and at filing time it must equal the exact 2-decimal sum of this schedule's ScheduleLine.gallons or the filing fails with ERR_SCHEDULE_TOTALS_MISMATCH"
      - name: line_count
        type: integer
        source: computed
        description: number of ScheduleLine rows under this schedule
        default: 0

  - name: ScheduleLine
    parent: ReturnSchedule
    common_fields: false
    fields:
      - name: schedule_id
        type: string
        source: input
        description: "FK -> ReturnSchedule.id; taken from the path"
      - name: counterparty_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the other side of the transaction; allowed license_type set depends on the parent schedule_code (validations priority 201)"
      - name: exemption_certificate_id
        type: string
        source: input
        description: "FK -> ExemptionCertificate.id; nullable; required on SCH_6_EXEMPT_SALES and SCH_7_EXPORTS lines"
        default: null
      - name: transaction_type
        type: enum
        source: input
        description: movement type reported on this line
        constraints: "one of {PURCHASE, SALE, EXPORT, IMPORT, BLEND, TRANSFER}"
      - name: gallons
        type: number
        source: input
        description: gallons on this line, 2 decimals
        constraints: "> 0"
      - name: document_date
        type: string
        source: input
        description: ISO 8601 date of the underlying document; must fall inside the parent return's period_month
      - name: bill_of_lading_number
        type: string
        source: input
        description: "BOL / invoice number, unique per (parent schedule's return_id, counterparty_licensee_id) per validation priority 402"
        constraints: "uniqueness violation -> ERR_DUPLICATE_BOL"

  - name: CrossMatchRun
    parent: null
    common_fields: true
    fields:
      - name: period_month
        type: string
        source: input
        description: period being cross-matched
        constraints: "pattern ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: run_status
        type: enum
        source: system
        description: run lifecycle; a run is computed and closed inside the request that creates it
        default: COMPLETED
        constraints: "one of {COMPLETED}"
      - name: tolerance_gallons
        type: number
        source: system
        description: the TOLERANCE_GALLONS constant snapshotted into this run
        default: 5.00
      - name: matched_cells_count
        type: integer
        source: computed
        description: number of (supplier, purchaser, product) cells examined by this run
        default: 0
      - name: discrepancy_count
        type: integer
        source: computed
        description: number of MatchDiscrepancy rows this run created
        default: 0
      - name: gross_unreported_gallons_total
        type: number
        source: computed
        description: "sum of variance_gallons over every discrepancy this run created with direction == UNREPORTED_BY_PURCHASER, frozen at creation time and never re-derived; 2 decimals"
        default: 0.00
      - name: unreported_gallons_total
        type: number
        source: computed
        description: "live sum of variance_gallons over this run's discrepancies with direction == UNREPORTED_BY_PURCHASER and status != WRITTEN_OFF; 2 decimals"
        default: 0.00
      - name: written_off_gallons_total
        type: number
        source: computed
        description: "live sum of variance_gallons over this run's discrepancies with direction == UNREPORTED_BY_PURCHASER and status == WRITTEN_OFF; 2 decimals"
        default: 0.00
      - name: escalated_count
        type: integer
        source: computed
        description: number of discrepancies this run auto-escalated to a new AuditCase
        default: 0
      - name: escalation_skipped_count
        type: integer
        source: computed
        description: number of discrepancies that met the auto-escalation gallons threshold but were left OPEN because an overlapping non-CLOSED AuditCase already covered the subject and period
        default: 0

  - name: MatchDiscrepancy
    parent: CrossMatchRun
    common_fields: true
    fields:
      - name: run_id
        type: string
        source: input
        description: "FK -> CrossMatchRun.id; the run that produced this row"
      - name: supplier_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the seller side of the cell (the licensee that reported SCH_5_DELIVERED_TAX_COLLECTED)"
      - name: distributor_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the purchaser side of the cell (the licensee expected to report SCH_1_RECEIVED_TAX_PAID)"
      - name: supplier_return_id
        type: string
        source: system
        description: "FK -> MonthlyReturn.id; the seller's FILED return for the run's period_month"
      - name: distributor_return_id
        type: string
        source: system
        description: "FK -> MonthlyReturn.id; nullable; the purchaser's FILED return for the run's period_month, null when direction == MISSING_COUNTERPARTY_RETURN"
        default: null
      - name: product_code
        type: enum
        source: input
        description: product of the cell
        constraints: "one of {GASOLINE, UNDYED_DIESEL, DYED_DIESEL, JET_FUEL, AVIATION_GAS, ETHANOL_E100, BIODIESEL_B100}"
      - name: supplier_gallons
        type: number
        source: computed
        description: seller-side gallons of the cell, 2 decimals
      - name: distributor_gallons
        type: number
        source: computed
        description: purchaser-side gallons of the cell, 2 decimals; 0.00 when the purchaser filed nothing for the cell
      - name: variance_gallons
        type: number
        source: computed
        description: "supplier_gallons - distributor_gallons, 2 decimals; sign fixes direction"
      - name: direction
        type: enum
        source: computed
        description: "per calculations.cross_match_variance"
        constraints: "one of {UNREPORTED_BY_PURCHASER, OVERSTATED_BY_PURCHASER, MISSING_COUNTERPARTY_RETURN}"
      - name: status
        type: enum
        source: system
        description: inquiry / resolution state
        default: OPEN
        constraints: "one of {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED, RESOLVED_EXPLAINED, WRITTEN_OFF, ESCALATED_TO_AUDIT}"
      - name: inquiry_round
        type: integer
        source: system
        description: number of inquiries sent on this discrepancy; capped by MAX_INQUIRY_ROUNDS
        default: 0
      - name: last_question
        type: string
        source: input
        description: text of the most recent inquiry
        default: null
      - name: last_explanation
        type: string
        source: input
        description: text of the most recent licensee response
        default: null
      - name: response_due_date
        type: string
        source: input
        description: ISO 8601 date the licensee response is due
        default: null

  - name: RefundClaim
    parent: Licensee
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the claimant"
      - name: claim_type
        type: enum
        source: input
        description: statutory refund basis
        constraints: "one of {OFF_ROAD, PTO, REFRIGERATION_UNIT, EXPORT}"
      - name: period_month
        type: string
        source: input
        description: "period the refund is claimed for; the claimant's MonthlyReturn with this period_month and filing_status == FILED supplies the tax-paid gallons pool"
        constraints: "pattern ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: claimed_gallons
        type: number
        source: input
        description: gallons of UNDYED_DIESEL claimed, 2 decimals
        constraints: "> 0"
      - name: equipment_class
        type: enum
        source: input
        description: power-take-off equipment class; required when claim_type == PTO, must be null otherwise
        default: null
        constraints: "one of {CONCRETE_MIXER, REFUSE_PACKER, BULK_TANKER_PUMP} or null"
      - name: allowable_gallons
        type: number
        source: computed
        description: "per calculations.refund_allowable_gallons; 2 decimals"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "per calculations.refund_allowable_gallons final step"
      - name: status
        type: enum
        source: system
        description: claim lifecycle state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, REVIEWED, HELD, APPROVED, PARTIALLY_APPROVED, DENIED, PAID}"
      - name: status_before_hold
        type: enum
        source: system
        description: status the claim is restored to when the hold clears
        default: null
        constraints: "one of {SUBMITTED, REVIEWED} or null"
      - name: hold_reason
        type: enum
        source: system
        description: why the claim is HELD
        default: null
        constraints: "one of {BOND_DEFICIENCY, OPEN_AUDIT} or null"
      - name: recommendation
        type: enum
        source: input
        description: examiner recommendation recorded at review
        default: null
        constraints: "one of {APPROVE, PARTIAL, DENY} or null"
      - name: recommended_gallons
        type: number
        source: input
        description: gallons the examiner recommends when recommendation == PARTIAL, 2 decimals
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: opaque X-User-ID of the ReturnsExaminer that reviewed the claim; barred from deciding it
        default: null
      - name: decider_user_id
        type: string
        source: system
        description: opaque X-User-ID of the TaxSupervisor that decided the claim
        default: null
      - name: payment_reference
        type: string
        source: input
        description: warrant / ACH reference recorded at payment
        default: null

  - name: RoadsideInspection
    parent: Licensee
    common_fields: true
    fields:
      - name: inspected_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the licensee whose vehicle was stopped"
      - name: inspection_date
        type: string
        source: input
        description: ISO 8601 date of the roadside stop
      - name: dye_test_result
        type: enum
        source: input
        description: outcome of the on-site dye test of the vehicle's supply tank
        constraints: "one of {NEGATIVE, POSITIVE}"
      - name: gallons_in_tank
        type: number
        source: input
        description: gallons measured in the supply tank, 2 decimals
        constraints: ">= 0"
      - name: vehicle_identifier
        type: string
        source: input
        description: plate or VIN of the stopped vehicle
      - name: location_description
        type: string
        source: input
        description: highway / milepost description of the stop
      - name: prior_positive_count
        type: integer
        source: computed
        description: "number of this licensee's earlier RoadsideInspection rows with dye_test_result POSITIVE and status != DISMISSED, counted by inspection_date ASC then created_at ASC strictly before this row; fixes the escalation multiplier"
        default: 0
      - name: penalty_cents
        type: integer
        source: computed
        description: "per calculations.dyed_fuel_penalty; 0 when dye_test_result == NEGATIVE"
      - name: status
        type: enum
        source: system
        description: inspection lifecycle state
        default: RECORDED
        constraints: "one of {RECORDED, PENALTY_ASSESSED, DISMISSED}"
      - name: dismissal_reason
        type: string
        source: input
        description: text recorded when a penalty is dismissed
        default: null

  - name: AuditCase
    parent: Licensee
    common_fields: true
    fields:
      - name: subject_licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the licensee under audit"
      - name: source_discrepancy_id
        type: string
        source: input
        description: "FK -> MatchDiscrepancy.id; nullable; supplied by the AuditManager when the case documents a cross-match escalation, and set automatically to the resolving discrepancy id when the case is created by the ESCALATE_TO_AUDIT cascade"
        default: null
      - name: selection_method
        type: enum
        source: input
        description: why this case was opened; RISK_SCORE requires the selected risk variant to clear AUDIT_SELECTION_THRESHOLD
        constraints: "one of {RISK_SCORE, CROSS_MATCH_ESCALATION, ROADSIDE_REFERRAL}"
      - name: risk_score_variant
        type: enum
        source: input
        description: which calculations.licensee_risk_score variant is used to test AUDIT_SELECTION_THRESHOLD; ignored unless selection_method == RISK_SCORE
        default: VARIANCE_WEIGHTED
        constraints: "one of {VARIANCE_WEIGHTED, FREQUENCY_WEIGHTED}"
      - name: selection_score
        type: integer
        source: computed
        description: the risk score of the selected variant frozen at case creation; 0 when selection_method != RISK_SCORE
        default: 0
      - name: period_start_month
        type: string
        source: input
        description: first period covered by the audit
        constraints: "pattern ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: period_end_month
        type: string
        source: input
        description: last period covered by the audit; must be >= period_start_month
        constraints: "pattern ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: case_status
        type: enum
        source: system
        description: fieldwork dimension of this case's parallel state machine
        default: OPEN
        constraints: "one of {OPEN, FIELDWORK, PRELIM_FINDINGS, TAXPAYER_RESPONSE, CLOSED}"
      - name: assessment_status
        type: enum
        source: system
        description: assessment dimension of this case's parallel state machine, advanced independently of case_status
        default: NONE
        constraints: "one of {NONE, ISSUED, PROTESTED, FINAL, ABATED}"
      - name: response_rounds
        type: integer
        source: system
        description: number of times the case has re-entered FIELDWORK from TAXPAYER_RESPONSE; capped by MAX_AUDIT_RESPONSE_ROUNDS
        default: 0
      - name: additional_tax_cents
        type: integer
        source: input
        description: additional tax asserted by the assessment
        default: 0
      - name: evasion_indicator
        type: boolean
        source: input
        description: true when the assessment asserts wilful evasion; selects the 50% fraud penalty rate
        default: false
      - name: assessment_penalty_cents
        type: integer
        source: computed
        description: "per calculations.assessment_amounts"
      - name: assessment_interest_cents
        type: integer
        source: computed
        description: "per calculations.assessment_amounts"
      - name: assessed_total_cents
        type: integer
        source: computed
        description: "per calculations.assessment_amounts: additional_tax_cents + assessment_penalty_cents + assessment_interest_cents"
      - name: opened_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the AuditManager that opened the case; barred from issuing its assessment
      - name: assessed_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the TaxSupervisor that issued the assessment
        default: null
      - name: protest_grounds
        type: string
        source: input
        description: text of the licensee's protest
        default: null
      - name: abatement_reason
        type: string
        source: input
        description: text recorded when an issued assessment is abated
        default: null

  - name: LedgerEntry
    parent: Licensee
    common_fields: false
    fields:
      - name: licensee_id
        type: string
        source: input
        description: "FK -> Licensee.id; the account this entry posts to"
      - name: entry_type
        type: enum
        source: system
        description: what produced this entry
        constraints: "one of {RETURN_TAX, RETURN_TAX_ADJUSTMENT, PENALTY, INTEREST, ASSESSMENT, ABATEMENT, REFUND, PAYMENT, PENALTY_REVERSAL}"
      - name: amount_cents
        type: integer
        source: system
        description: signed amount; positive increases what the licensee owes, negative decreases it
      - name: source_entity_type
        type: enum
        source: system
        description: polymorphic pointer type for the object that produced this entry
        constraints: "one of {MonthlyReturn, RefundClaim, AuditCase, RoadsideInspection, Payment}"
      - name: source_entity_id
        type: string
        source: system
        description: polymorphic id of the producing object, interpreted per source_entity_type; deliberately NOT a declared foreign key because the target type varies
        default: null
      - name: effective_date
        type: string
        source: system
        description: ISO 8601 date the entry posts on, taken from the logical clock at creation
      - name: memo
        type: string
        source: system
        description: human-readable description of the posting

# =====================================================================================
# 1.2 State Machine Table
# =====================================================================================
state_machines:
  - entity: Licensee
    initial_state: PENDING_BOND
    terminal_states: [REVOKED]
    note: |
      Cyclic shape: ACTIVE -> SUSPENDED -> ACTIVE. The suspension leg doubles required_bond_cents,
      which is what makes the return leg non-trivial (the licensee must post more bond before it
      can be reinstated).
    transitions:
      - from: PENDING_BOND
        to: ACTIVE
        trigger: "POST /mft/licensees/{id}/activate"
        actor: LicensingOfficer
        preconditions:
          - "licensee.status == PENDING_BOND"
          - "licensee.bond_deficiency_cents == 0 (posted_bond_cents >= required_bond_cents; equality passes)"
        side_effects:
          - "status := ACTIVE"
          - "recompute required_bond_cents, posted_bond_cents, bond_deficiency_cents per calculations.licensee_bond_requirement"
          - "increments Licensee.version by 1; refreshes updated_at"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mft/licensees/{id}/activate"
        actor: LicensingOfficer
        preconditions:
          - "licensee.status == SUSPENDED"
          - "licensee.dyed_violation_count < DYED_SUSPENSION_THRESHOLD (2) else ERR_DYED_VIOLATION_HOLD"
          - "licensee.bond_deficiency_cents == 0 evaluated with the SUSPENDED multiplier 2.0 still in force"
        side_effects:
          - "status := ACTIVE"
          - "required_bond_cents recomputed with suspension multiplier 1.0 (compensates the doubling applied on suspension)"
          - "for every RefundClaim of this licensee with status == HELD and hold_reason == BOND_DEFICIENCY: status := status_before_hold, status_before_hold := null, hold_reason := null (compensation of the suspension cascade)"
          - "increments Licensee.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mft/licensees/{id}/suspend"
        actor: LicensingOfficer
        preconditions:
          - "licensee.status == ACTIVE"
        side_effects:
          - "status := SUSPENDED"
          - "required_bond_cents recomputed with suspension multiplier 2.0; bond_deficiency_cents re-derived"
          - "if bond_deficiency_cents > 0 then for every RefundClaim of this licensee with status IN {SUBMITTED, REVIEWED}: status_before_hold := status, status := HELD, hold_reason := BOND_DEFICIENCY"
          - "increments Licensee.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, inside POST /mft/roadside-inspections when the new inspection pushes dyed_violation_count to DYED_SUSPENSION_THRESHOLD (2)"
        actor: system
        preconditions:
          - "licensee.status == ACTIVE"
          - "licensee.dyed_violation_count >= DYED_SUSPENSION_THRESHOLD (2) after the inspection's increment"
        side_effects:
          - "status := SUSPENDED (hop 2 of the dyed-fuel cascade)"
          - "required_bond_cents recomputed with suspension multiplier 2.0; bond_deficiency_cents re-derived (hop 3, caused by hop 2)"
          - "if bond_deficiency_cents > 0 then every RefundClaim of this licensee with status IN {SUBMITTED, REVIEWED} moves to HELD with hold_reason BOND_DEFICIENCY and status_before_hold recorded (hop 4, caused by hop 3)"
          - "increments Licensee.version by 1"
        note: "This is the only automatic Licensee transition; it is what makes the roadside cascade four hops deep."
      - from: PENDING_BOND
        to: REVOKED
        trigger: "POST /mft/licensees/{id}/revoke"
        actor: LicensingOfficer
        preconditions:
          - "licensee.status != REVOKED"
        side_effects:
          - "status := REVOKED"
          - "every BondInstrument of this licensee with status == ACTIVE: status := FORFEITED, release_reason := LICENSE_REVOKED (conditional cascade: RELEASED bonds untouched)"
          - "every ExemptionCertificate with purchaser_licensee_id == this id and status == ACTIVE: status := REVOKED"
          - "every RefundClaim of this licensee with status IN {SUBMITTED, REVIEWED, HELD}: status := DENIED"
          - "increments Licensee.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /mft/licensees/{id}/revoke"
        actor: LicensingOfficer
        preconditions:
          - "licensee.status != REVOKED"
        side_effects:
          - "identical to the PENDING_BOND -> REVOKED cascade above"
          - "increments Licensee.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /mft/licensees/{id}/revoke"
        actor: LicensingOfficer
        preconditions:
          - "licensee.status != REVOKED"
        side_effects:
          - "identical to the PENDING_BOND -> REVOKED cascade above"
          - "increments Licensee.version by 1"

  - entity: BondInstrument
    initial_state: ACTIVE
    terminal_states: [RELEASED, FORFEITED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /mft/bonds/{id}/release"
        actor: LicensingOfficer
        preconditions:
          - "bond.status == ACTIVE"
          - "licensee.status != REVOKED"
        side_effects:
          - "status := RELEASED, release_reason := OPERATOR_RELEASE"
          - "licensee.posted_bond_cents and bond_deficiency_cents re-derived"
          - "increments BondInstrument.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "system, inside POST /mft/licensees/{id}/bonds when a newer bond is posted for the same licensee"
        actor: system
        preconditions:
          - "bond.status == ACTIVE"
        side_effects:
          - "status := RELEASED, release_reason := SUPERSEDED_BY_NEW_BOND"
          - "licensee.posted_bond_cents becomes exactly the new bond's amount_cents"
          - "increments BondInstrument.version by 1"
        note: "This supersede semantics is why bond posting is a true OCC race — see concurrency_rules.bond-post-stale-licensee."
      - from: ACTIVE
        to: FORFEITED
        trigger: "system, inside POST /mft/licensees/{id}/revoke"
        actor: system
        preconditions:
          - "bond.status == ACTIVE"
        side_effects:
          - "status := FORFEITED, release_reason := LICENSE_REVOKED"
          - "increments BondInstrument.version by 1"

  - entity: ExemptionCertificate
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /mft/exemption-certificates/{id}/revoke"
        actor: LicensingOfficer
        preconditions:
          - "certificate.status == ACTIVE"
        side_effects:
          - "status := REVOKED"
          - "already-recorded RackRemoval and ScheduleLine rows keep their computed tax figures (no retroactive recomputation); only later presentations of the certificate fail with ERR_CERTIFICATE_NOT_VALID_ON_DATE"
          - "increments ExemptionCertificate.version by 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "system, inside POST /mft/licensees/{id}/revoke for certificates whose purchaser_licensee_id is the revoked licensee"
        actor: system
        preconditions:
          - "certificate.status == ACTIVE"
        side_effects:
          - "status := REVOKED"
          - "increments ExemptionCertificate.version by 1"

  - entity: MonthlyReturn
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: |
      Parallel dimensions on one row: filing_status (DRAFT -> FILED -> SUPERSEDED) and match_status
      (NOT_MATCHED -> MATCH_CLEAN | MATCH_VARIANCE -> MATCH_RESOLVED) advance independently. A
      FILED return can sit at any match_status, and a SUPERSEDED return keeps whatever match_status
      it had reached. Amendment rows form a self-referential chain through amends_return_id.
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /mft/returns/{id}/file"
        actor: LicenseeAgent
        preconditions:
          - "return.filing_status == DRAFT"
          - "licensee.status != REVOKED (ERR_LICENSEE_REVOKED) - cross-entity guard on Licensee"
          - "logical clock >= first instant of the month after period_month, else ERR_PERIOD_NOT_CLOSED"
          - "for licensee.license_type IN {DISTRIBUTOR, BLENDER, RETAILER}: for every product_code, sum of gallons on SCH_5_DELIVERED_TAX_COLLECTED + SCH_6_EXEMPT_SALES + SCH_7_EXPORTS + SCH_10_DYED_SALES schedules <= sum of gallons on SCH_1_RECEIVED_TAX_PAID + SCH_2_RECEIVED_TAX_UNPAID schedules, else ERR_SCHEDULE_TOTALS_MISMATCH"
          - "every ScheduleLine on a SCH_6_EXEMPT_SALES or SCH_7_EXPORTS schedule has a non-null exemption_certificate_id whose status == ACTIVE and whose [valid_from, valid_to] closed window contains the line's document_date, else ERR_CERTIFICATE_NOT_VALID_ON_DATE"
        side_effects:
          - "taxable_gallons_total and tax_due_cents := calculations.monthly_return_tax_due"
          - "days_late, interest_cents, penalty_cents, total_remittance_cents := calculations.return_penalty_and_interest (evaluation order: tax -> interest -> penalty -> total)"
          - "filed_at := logical clock; attest_name := request attest_name; filing_status := FILED"
          - "if amends_return_id == null: append LedgerEntry(RETURN_TAX, +tax_due_cents) always, plus LedgerEntry(INTEREST, +interest_cents) when interest_cents > 0, plus LedgerEntry(PENALTY, +penalty_cents) when penalty_cents > 0"
          - "if amends_return_id != null: amendment_delta_cents := this.total_remittance_cents - amended.total_remittance_cents; append exactly one LedgerEntry(RETURN_TAX_ADJUSTMENT, +amendment_delta_cents) even when the delta is 0; the amended return's filing_status := SUPERSEDED"
          - "licensee.balance_cents re-derived from the ledger; licensee.effective_taxable_gallons_ytd re-derived over returns with filing_status == FILED"
          - "if days_late >= 1 and amends_return_id == null: licensee.late_filing_count += 1 (a period is counted late once, on its original filing; an amendment of an already-late period does not count again)"
          - "licensee.avg_monthly_tax_liability_cents, required_bond_cents and bond_deficiency_cents re-derived (a filed return changes the bond basis)"
          - "increments MonthlyReturn.version by 1"
      - from: FILED
        to: SUPERSEDED
        trigger: "system, inside POST /mft/returns/{id}/file for a return whose amends_return_id points at this row"
        actor: system
        preconditions:
          - "this.filing_status == FILED"
        side_effects:
          - "filing_status := SUPERSEDED; match_status is left exactly as it was"
          - "this row drops out of every FILED-filtered aggregate (bond basis, effective_taxable_gallons_ytd, cross-match input set, refund tax-paid pool)"
          - "increments MonthlyReturn.version by 1"
      - from: NOT_MATCHED
        to: MATCH_CLEAN
        trigger: "system, inside POST /mft/cross-match-runs when no MatchDiscrepancy row of the run names this return"
        actor: system
        preconditions:
          - "return.filing_status == FILED and return.period_month == run.period_month"
        side_effects:
          - "match_status := MATCH_CLEAN (filing_status untouched)"
          - "increments MonthlyReturn.version by 1"
        note: "match_status dimension - independent of the filing dimension."
      - from: NOT_MATCHED
        to: MATCH_VARIANCE
        trigger: "system, inside POST /mft/cross-match-runs when at least one MatchDiscrepancy of the run names this return as supplier_return_id or distributor_return_id"
        actor: system
        preconditions:
          - "return.filing_status == FILED and return.period_month == run.period_month"
        side_effects:
          - "match_status := MATCH_VARIANCE"
          - "increments MonthlyReturn.version by 1"
      - from: MATCH_VARIANCE
        to: MATCH_RESOLVED
        trigger: "system, inside POST /mft/discrepancies/{id}/resolve when no discrepancy naming this return remains in {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED}"
        actor: system
        preconditions:
          - "return.match_status == MATCH_VARIANCE"
        side_effects:
          - "match_status := MATCH_RESOLVED"
          - "increments MonthlyReturn.version by 1"

  - entity: MatchDiscrepancy
    initial_state: OPEN
    terminal_states: [RESOLVED_EXPLAINED, WRITTEN_OFF, ESCALATED_TO_AUDIT]
    note: |
      Cyclic negotiation rounds: INQUIRY_SENT -> RESPONSE_RECEIVED -> INQUIRY_SENT, bounded by
      MAX_INQUIRY_ROUNDS. The resolve action is a three-way fork whose side-effect sets differ.
    transitions:
      - from: OPEN
        to: INQUIRY_SENT
        trigger: "POST /mft/discrepancies/{id}/inquiries"
        actor: ReturnsExaminer
        preconditions:
          - "discrepancy.status IN {OPEN, RESPONSE_RECEIVED}"
          - "discrepancy.inquiry_round < MAX_INQUIRY_ROUNDS (3), else ERR_INQUIRY_ROUND_LIMIT"
        side_effects:
          - "status := INQUIRY_SENT; inquiry_round += 1; last_question and response_due_date recorded"
          - "increments MatchDiscrepancy.version by 1"
      - from: INQUIRY_SENT
        to: RESPONSE_RECEIVED
        trigger: "POST /mft/discrepancies/{id}/responses"
        actor: LicenseeAgent
        preconditions:
          - "discrepancy.status == INQUIRY_SENT"
          - "X-User-ID == discrepancy.distributor_licensee_id, else ERR_LICENSEE_SCOPE_VIOLATION"
        side_effects:
          - "status := RESPONSE_RECEIVED; last_explanation recorded"
          - "increments MatchDiscrepancy.version by 1"
      - from: RESPONSE_RECEIVED
        to: INQUIRY_SENT
        trigger: "POST /mft/discrepancies/{id}/inquiries (second and third rounds)"
        actor: ReturnsExaminer
        preconditions:
          - "discrepancy.status == RESPONSE_RECEIVED"
          - "discrepancy.inquiry_round < MAX_INQUIRY_ROUNDS (3), else ERR_INQUIRY_ROUND_LIMIT"
        side_effects:
          - "status := INQUIRY_SENT; inquiry_round += 1"
          - "increments MatchDiscrepancy.version by 1"
        note: "The cycle edge. Round 3 is the last permitted inquiry; a fourth attempt fails."
      - from: OPEN
        to: RESOLVED_EXPLAINED
        trigger: "POST /mft/discrepancies/{id}/resolve with resolution == EXPLAINED"
        actor: ReturnsExaminer
        preconditions:
          - "discrepancy.status IN {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED}"
        side_effects:
          - "status := RESOLVED_EXPLAINED"
          - "distributor licensee.open_discrepancy_count -= 1; distributor licensee.unreported_gallons_total re-derived (this variance drops out)"
          - "if no discrepancy naming distributor_return_id remains in {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED} then that return's match_status := MATCH_RESOLVED"
          - "run.unreported_gallons_total and run.written_off_gallons_total are NOT changed (EXPLAINED keeps the gallons in the live unreported pool of the run for audit-trail purposes)"
          - "increments MatchDiscrepancy.version by 1"
      - from: RESPONSE_RECEIVED
        to: WRITTEN_OFF
        trigger: "POST /mft/discrepancies/{id}/resolve with resolution == WRITTEN_OFF"
        actor: ReturnsExaminer
        preconditions:
          - "discrepancy.status IN {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED}"
          - "write_off_reason supplied and abs(variance_gallons) < AUTO_ESCALATION_GALLONS (10000.00), else ERR_WRITE_OFF_NOT_PERMITTED"
        side_effects:
          - "status := WRITTEN_OFF"
          - "run.unreported_gallons_total -= variance_gallons and run.written_off_gallons_total += variance_gallons, so run.gross_unreported_gallons_total is conserved"
          - "distributor licensee.open_discrepancy_count -= 1; distributor licensee.unreported_gallons_total re-derived"
          - "if no discrepancy naming distributor_return_id remains in {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED} then that return's match_status := MATCH_RESOLVED"
          - "increments MatchDiscrepancy.version by 1"
      - from: RESPONSE_RECEIVED
        to: ESCALATED_TO_AUDIT
        trigger: "POST /mft/discrepancies/{id}/resolve with resolution == ESCALATE_TO_AUDIT"
        actor: ReturnsExaminer
        preconditions:
          - "discrepancy.status IN {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED}"
          - "no AuditCase with subject_licensee_id == escalation subject and case_status != CLOSED overlaps [run.period_month, run.period_month] under the AUDIT_PERIOD_BUFFER_MONTHS rule, else ERR_AUDIT_PERIOD_OVERLAP"
        side_effects:
          - "status := ESCALATED_TO_AUDIT (hop 1a)"
          - "create AuditCase{subject_licensee_id := distributor_licensee_id when direction == UNREPORTED_BY_PURCHASER else supplier_licensee_id, source_discrepancy_id := this id, selection_method := CROSS_MATCH_ESCALATION, selection_score := 0, period_start_month := period_end_month := run.period_month, case_status := OPEN, assessment_status := NONE, opened_by_user_id := acting X-User-ID} (hop 1b)"
          - "subject licensee.open_audit_count += 1 (hop 2, caused by hop 1b)"
          - "because open_audit_count > 0, every RefundClaim of the subject licensee with status IN {SUBMITTED, REVIEWED} moves to HELD with hold_reason OPEN_AUDIT and status_before_hold recorded (hop 3, caused by hop 2)"
          - "distributor licensee.open_discrepancy_count -= 1; if no discrepancy naming distributor_return_id remains in {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED} then that return's match_status := MATCH_RESOLVED"
          - "increments MatchDiscrepancy.version by 1"
      - from: OPEN
        to: ESCALATED_TO_AUDIT
        trigger: "system, inside POST /mft/cross-match-runs when variance_gallons >= AUTO_ESCALATION_GALLONS (10000.00) and direction == UNREPORTED_BY_PURCHASER"
        actor: system
        preconditions:
          - "discrepancy.status == OPEN (just created by this run)"
          - "no AuditCase with subject_licensee_id == distributor_licensee_id and case_status != CLOSED overlaps the run period under the AUDIT_PERIOD_BUFFER_MONTHS rule; when one does, the discrepancy is left OPEN and run.escalation_skipped_count += 1 instead"
        side_effects:
          - "status := ESCALATED_TO_AUDIT; run.escalated_count += 1"
          - "create AuditCase as in the manual escalation above with opened_by_user_id := the run requester's X-User-ID"
          - "subject licensee.open_audit_count += 1, then that licensee's SUBMITTED/REVIEWED RefundClaims move to HELD with hold_reason OPEN_AUDIT"
          - "the escalated discrepancy is excluded from distributor licensee.open_discrepancy_count"
          - "increments MatchDiscrepancy.version by 1"

  - entity: RefundClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, PAID]
    note: |
      Branching fork-join with a revert leg: REVIEWED forks into APPROVED / PARTIALLY_APPROVED /
      DENIED with different side-effect sets, and the HELD state is entered by cascade from two
      different causes and reverted to status_before_hold when the cause clears.
    transitions:
      - from: SUBMITTED
        to: REVIEWED
        trigger: "POST /mft/refund-claims/{id}/review"
        actor: ReturnsExaminer
        preconditions:
          - "claim.status == SUBMITTED"
          - "recommendation == PARTIAL requires recommended_gallons in (0, claim.allowable_gallons], else ERR_INVALID_REQUEST"
        side_effects:
          - "status := REVIEWED; recommendation and recommended_gallons recorded; reviewer_user_id := acting X-User-ID"
          - "increments RefundClaim.version by 1"
      - from: SUBMITTED
        to: HELD
        trigger: "system, from the suspension bond cascade or from an AuditCase opening on the claimant"
        actor: system
        preconditions:
          - "claim.status IN {SUBMITTED, REVIEWED}"
        side_effects:
          - "status_before_hold := status; status := HELD; hold_reason := BOND_DEFICIENCY or OPEN_AUDIT"
          - "increments RefundClaim.version by 1"
      - from: HELD
        to: SUBMITTED
        trigger: "system, on POST /mft/licensees/{id}/activate (bond hold) or on the AuditCase reaching CLOSED with subject open_audit_count back to 0 (audit hold)"
        actor: system
        preconditions:
          - "claim.status == HELD"
          - "hold_reason's cause has cleared"
        side_effects:
          - "status := status_before_hold; status_before_hold := null; hold_reason := null"
          - "increments RefundClaim.version by 1"
      - from: REVIEWED
        to: APPROVED
        trigger: "POST /mft/refund-claims/{id}/decide with decision == APPROVED"
        actor: TaxSupervisor
        preconditions:
          - "claim.status == REVIEWED"
          - "acting X-User-ID != claim.reviewer_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "claim.refund_amount_cents >= MIN_REFUND_CENTS (2000), else ERR_REFUND_BELOW_MINIMUM"
        side_effects:
          - "status := APPROVED; decider_user_id := acting X-User-ID; allowable_gallons and refund_amount_cents keep their submit-time values"
          - "increments RefundClaim.version by 1"
      - from: REVIEWED
        to: PARTIALLY_APPROVED
        trigger: "POST /mft/refund-claims/{id}/decide with decision == PARTIALLY_APPROVED"
        actor: TaxSupervisor
        preconditions:
          - "claim.status == REVIEWED"
          - "claim.recommendation == PARTIAL and claim.recommended_gallons is not null, else ERR_DECISION_AMOUNT_INVALID (validation priority 410)"
          - "acting X-User-ID != claim.reviewer_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "allowable_gallons := recommended_gallons; refund_amount_cents recomputed from the reduced gallons per calculations.refund_allowable_gallons final step (this is the branch that changes the money)"
          - "status := PARTIALLY_APPROVED; decider_user_id := acting X-User-ID"
          - "if the recomputed refund_amount_cents < MIN_REFUND_CENTS (2000) the request is rejected with ERR_REFUND_BELOW_MINIMUM and nothing is written"
          - "increments RefundClaim.version by 1"
      - from: REVIEWED
        to: DENIED
        trigger: "POST /mft/refund-claims/{id}/decide with decision == DENIED"
        actor: TaxSupervisor
        preconditions:
          - "claim.status == REVIEWED"
          - "acting X-User-ID != claim.reviewer_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status := DENIED; allowable_gallons := 0.00; refund_amount_cents := 0; decider_user_id := acting X-User-ID"
          - "the claim's gallons are released back into the period's tax-paid pool for later claims (the waterfall skips DENIED claims)"
          - "increments RefundClaim.version by 1"
      - from: HELD
        to: DENIED
        trigger: "system, inside POST /mft/licensees/{id}/revoke"
        actor: system
        preconditions:
          - "claim.status IN {SUBMITTED, REVIEWED, HELD}"
        side_effects:
          - "status := DENIED; allowable_gallons := 0.00; refund_amount_cents := 0"
          - "increments RefundClaim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /mft/refund-claims/{id}/pay"
        actor: TaxSupervisor
        preconditions:
          - "claim.status IN {APPROVED, PARTIALLY_APPROVED}"
        side_effects:
          - "status := PAID; payment_reference recorded"
          - "append LedgerEntry(REFUND, -refund_amount_cents, source_entity_type RefundClaim); licensee.balance_cents re-derived"
          - "increments RefundClaim.version by 1"
      - from: PARTIALLY_APPROVED
        to: PAID
        trigger: "POST /mft/refund-claims/{id}/pay"
        actor: TaxSupervisor
        preconditions:
          - "claim.status IN {APPROVED, PARTIALLY_APPROVED}"
        side_effects:
          - "identical to the APPROVED -> PAID leg, using the reduced refund_amount_cents"
          - "increments RefundClaim.version by 1"

  - entity: RoadsideInspection
    initial_state: RECORDED
    terminal_states: [DISMISSED]
    transitions:
      - from: RECORDED
        to: PENALTY_ASSESSED
        trigger: "system, inside POST /mft/roadside-inspections when dye_test_result == POSITIVE"
        actor: system
        preconditions:
          - "inspection.dye_test_result == POSITIVE"
          - "inspected licensee.status != REVOKED"
        side_effects:
          - "prior_positive_count frozen; penalty_cents := calculations.dyed_fuel_penalty; status := PENALTY_ASSESSED (hop 1a)"
          - "append LedgerEntry(PENALTY, +penalty_cents, source_entity_type RoadsideInspection); licensee.balance_cents re-derived (hop 1b)"
          - "inspected licensee.dyed_violation_count += 1 (hop 1c)"
          - "if dyed_violation_count >= DYED_SUSPENSION_THRESHOLD (2) and licensee.status == ACTIVE: licensee.status := SUSPENDED (hop 2, caused by hop 1c)"
          - "the suspension re-derives required_bond_cents with multiplier 2.0 and bond_deficiency_cents (hop 3, caused by hop 2)"
          - "if bond_deficiency_cents > 0: the licensee's SUBMITTED/REVIEWED RefundClaims move to HELD with hold_reason BOND_DEFICIENCY (hop 4, caused by hop 3)"
          - "increments RoadsideInspection.version by 1"
      - from: PENALTY_ASSESSED
        to: DISMISSED
        trigger: "POST /mft/roadside-inspections/{id}/dismiss"
        actor: TaxSupervisor
        preconditions:
          - "inspection.status == PENALTY_ASSESSED, else ERR_INSPECTION_NOT_DISMISSIBLE"
        side_effects:
          - "status := DISMISSED; dismissal_reason recorded"
          - "append LedgerEntry(PENALTY_REVERSAL, -penalty_cents, source_entity_type RoadsideInspection); licensee.balance_cents re-derived so the money invariant holds exactly"
          - "licensee.dyed_violation_count -= 1"
          - "the licensee's status is deliberately NOT auto-reinstated: a SUSPENDED licensee stays SUSPENDED until POST /mft/licensees/{id}/activate, so required_bond_cents keeps the 2.0 multiplier"
          - "increments RoadsideInspection.version by 1"

  - entity: AuditCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: |
      Parallel dimensions on one row: case_status (with the cycle PRELIM_FINDINGS ->
      TAXPAYER_RESPONSE -> FIELDWORK bounded by MAX_AUDIT_RESPONSE_ROUNDS) and assessment_status
      (NONE -> ISSUED -> PROTESTED -> FINAL | ABATED). Closing the case is the only place the two
      dimensions are coupled.
    transitions:
      - from: OPEN
        to: FIELDWORK
        trigger: "POST /mft/audit-cases/{id}/advance with to_status == FIELDWORK"
        actor: AuditManager
        preconditions:
          - "case.case_status IN {OPEN, TAXPAYER_RESPONSE}"
          - "when coming from TAXPAYER_RESPONSE: case.response_rounds < MAX_AUDIT_RESPONSE_ROUNDS (2), else ERR_AUDIT_ROUND_LIMIT"
        side_effects:
          - "case_status := FIELDWORK"
          - "increments AuditCase.version by 1"
      - from: FIELDWORK
        to: PRELIM_FINDINGS
        trigger: "POST /mft/audit-cases/{id}/advance with to_status == PRELIM_FINDINGS"
        actor: AuditManager
        preconditions:
          - "case.case_status == FIELDWORK"
        side_effects:
          - "case_status := PRELIM_FINDINGS"
          - "increments AuditCase.version by 1"
      - from: PRELIM_FINDINGS
        to: TAXPAYER_RESPONSE
        trigger: "POST /mft/audit-cases/{id}/advance with to_status == TAXPAYER_RESPONSE"
        actor: AuditManager
        preconditions:
          - "case.case_status == PRELIM_FINDINGS"
        side_effects:
          - "case_status := TAXPAYER_RESPONSE"
          - "increments AuditCase.version by 1"
      - from: TAXPAYER_RESPONSE
        to: FIELDWORK
        trigger: "POST /mft/audit-cases/{id}/advance with to_status == FIELDWORK (re-opened fieldwork round)"
        actor: AuditManager
        preconditions:
          - "case.case_status == TAXPAYER_RESPONSE"
          - "case.response_rounds < MAX_AUDIT_RESPONSE_ROUNDS (2), else ERR_AUDIT_ROUND_LIMIT"
        side_effects:
          - "case_status := FIELDWORK; response_rounds += 1"
          - "increments AuditCase.version by 1"
        note: "The cycle edge on the case dimension."
      - from: PRELIM_FINDINGS
        to: CLOSED
        trigger: "POST /mft/audit-cases/{id}/advance with to_status == CLOSED"
        actor: AuditManager
        preconditions:
          - "case.case_status == PRELIM_FINDINGS"
          - "case.assessment_status IN {NONE, FINAL, ABATED}, else ERR_ASSESSMENT_PENDING_DISPOSITION (the only coupling between the two dimensions)"
        side_effects:
          - "case_status := CLOSED"
          - "subject licensee.open_audit_count -= 1"
          - "if subject licensee.open_audit_count == 0: every RefundClaim of that licensee with status == HELD and hold_reason == OPEN_AUDIT reverts to status_before_hold"
          - "increments AuditCase.version by 1"
      - from: NONE
        to: ISSUED
        trigger: "POST /mft/audit-cases/{id}/assessments"
        actor: TaxSupervisor
        preconditions:
          - "case.assessment_status == NONE, else ERR_ASSESSMENT_ALREADY_ISSUED"
          - "case.case_status IN {PRELIM_FINDINGS, TAXPAYER_RESPONSE}, else ERR_AUDIT_CASE_STATE_INVALID"
          - "acting X-User-ID != case.opened_by_user_id, else ERR_ASSESSMENT_SEGREGATION_VIOLATION (validation priority 107)"
        side_effects:
          - "additional_tax_cents and evasion_indicator recorded; assessment_penalty_cents, assessment_interest_cents and assessed_total_cents := calculations.assessment_amounts; assessment_status := ISSUED; assessed_by_user_id := acting X-User-ID (hop 1)"
          - "append LedgerEntry(ASSESSMENT, +assessed_total_cents, source_entity_type AuditCase); licensee.balance_cents re-derived (hop 2, caused by hop 1)"
          - "because the ledger moved, licensee.avg_monthly_tax_liability_cents is unaffected but licensee.balance_cents feeds the money invariant asserted by compensating_invariant"
          - "increments AuditCase.version by 1"
      - from: ISSUED
        to: PROTESTED
        trigger: "POST /mft/audit-cases/{id}/protest"
        actor: LicenseeAgent
        preconditions:
          - "case.assessment_status == ISSUED"
          - "X-User-ID == case.subject_licensee_id, else ERR_LICENSEE_SCOPE_VIOLATION"
        side_effects:
          - "assessment_status := PROTESTED; protest_grounds recorded; the ASSESSMENT ledger entry is left in place"
          - "increments AuditCase.version by 1"
      - from: ISSUED
        to: FINAL
        trigger: "POST /mft/audit-cases/{id}/finalize"
        actor: TaxSupervisor
        preconditions:
          - "case.assessment_status IN {ISSUED, PROTESTED}"
        side_effects:
          - "assessment_status := FINAL (the ledger is unchanged; the liability is now collectible)"
          - "increments AuditCase.version by 1"
      - from: PROTESTED
        to: FINAL
        trigger: "POST /mft/audit-cases/{id}/finalize"
        actor: TaxSupervisor
        preconditions:
          - "case.assessment_status IN {ISSUED, PROTESTED}"
        side_effects:
          - "assessment_status := FINAL"
          - "increments AuditCase.version by 1"
      - from: ISSUED
        to: ABATED
        trigger: "POST /mft/audit-cases/{id}/abate"
        actor: TaxSupervisor
        preconditions:
          - "case.assessment_status IN {ISSUED, PROTESTED}"
        side_effects:
          - "assessment_status := ABATED; abatement_reason recorded"
          - "append LedgerEntry(ABATEMENT, -assessed_total_cents, source_entity_type AuditCase); licensee.balance_cents re-derived back to its pre-assessment value (compensating action of the ISSUED leg)"
          - "increments AuditCase.version by 1"
      - from: PROTESTED
        to: ABATED
        trigger: "POST /mft/audit-cases/{id}/abate"
        actor: TaxSupervisor
        preconditions:
          - "case.assessment_status IN {ISSUED, PROTESTED}"
        side_effects:
          - "identical to the ISSUED -> ABATED leg"
          - "increments AuditCase.version by 1"

# =====================================================================================
# 1.2.1 Concurrency Rules  (OCC on the parent's version - the only sanctioned mechanism)
# =====================================================================================
concurrency_rules:
  - rule_id: bond-post-stale-licensee
    parent_entity: Licensee
    write_endpoint: "POST /mft/licensees/{id}/bonds"
    occ_field: "expected_licensee_version"
    description: |
      Posting a BondInstrument against a Licensee whose version has advanced since the client last
      observed it is rejected with a stale-version error. Bond posting is legitimately a
      create-with-supersede operation - a newly posted bond releases the prior ACTIVE bond and
      becomes the whole of posted_bond_cents - so a second post that carries the version the client
      read before the first post would otherwise silently wipe out a bond the client never saw.
    error_id: ERR_STALE_LICENSEE_VERSION
    http_status: 412
  - rule_id: amendment-create-stale-return
    parent_entity: MonthlyReturn
    write_endpoint: "POST /mft/returns/{id}/amendments"
    occ_field: "expected_return_version"
    description: |
      Creating an amendment against a MonthlyReturn whose version has advanced since the client last
      observed it is rejected with a stale-version error. Multiple amendments of one period are
      legitimate (each new amendment supersedes the previous one on filing), so the original return
      stays FILED and a second amendment request would otherwise succeed against a view of the
      return that predates the first amendment - including a view that predates cross-match writing
      match_status onto the same row.
    error_id: ERR_STALE_RETURN_VERSION
    http_status: 412

# =====================================================================================
# 1.3 Calculation Rules Table
# =====================================================================================
calculations:
  - name: rack_removal_tax_imposition
    trigger: "POST /mft/rack-removals (side effect: sets taxable_gallons, imposition_point, tax_imposed, tax_amount_cents, deferred_tax_cents, basis_used)"
    algorithm: constraint_propagation
    formula: |
      # STEP 1 - pick the gallons basis (dual-variant switch, keyed on the POSITION HOLDER's
      #          irrevocable election, never on the purchaser's).
      if position_holder.gross_net_election == "NET":
          basis_used  = "NET";   basis_gallons = net_gallons
      else:
          basis_used  = "GROSS"; basis_gallons = gross_gallons

      # STEP 2 - imposition point. The branches are evaluated STRICTLY in this order; the first
      #          matching branch wins and no later branch may override it.
      # 2a. dyed product is never taxed at the rack
      if product_code == "DYED_DIESEL":
          imposition_point = "NONE_EXEMPT"
      # 2b. out-of-state destination WITH a valid EXPORT certificate
      elif destination_state != HOME_STATE_CODE and cert_valid(exemption_certificate_id, "EXPORT"):
          imposition_point = "NONE_EXEMPT"
      # 2c. out-of-state destination WITHOUT a valid EXPORT certificate: tax rides at the rack and
      #     the purchaser must claim it back through an EXPORT RefundClaim
      elif destination_state != HOME_STATE_CODE:
          imposition_point = "TERMINAL_RACK"
      # 2d. in-state with a valid GOVERNMENT or AGRICULTURE certificate whose product set covers
      #     product_code (GOVERNMENT: {GASOLINE, UNDYED_DIESEL}; AGRICULTURE: {UNDYED_DIESEL})
      elif cert_valid(exemption_certificate_id, "GOVERNMENT") or cert_valid(exemption_certificate_id, "AGRICULTURE"):
          imposition_point = "NONE_EXEMPT"
      # 2e. in-state sale to an ACTIVE licensed SUPPLIER or DISTRIBUTOR: imposition is deferred to
      #     that purchaser's own monthly return. A SUPPLIER/DISTRIBUTOR purchaser carrying
      #     bond_deficiency_cents > 0 never reaches this calculation at all - the removal is
      #     refused earlier by validation priority 500 (ERR_PURCHASER_BOND_DEFICIENT), so this
      #     branch may assume the purchaser is fully bonded.
      elif purchaser.license_type in {"SUPPLIER", "DISTRIBUTOR"} and purchaser.status == "ACTIVE":
          imposition_point = "DEFERRED_TO_PURCHASER"
      # 2f. everyone else (BLENDER, TRANSPORTER, RETAILER, or a SUSPENDED supplier/distributor)
      else:
          imposition_point = "TERMINAL_RACK"

      # STEP 3 - money. RATE_CENTS_PER_GALLON is a per-product decimal in cents.
      rate = RATE_CENTS_PER_GALLON[product_code]
      if imposition_point == "NONE_EXEMPT":
          taxable_gallons = 0.00; tax_imposed = false
          tax_amount_cents = 0;   deferred_tax_cents = 0
      elif imposition_point == "TERMINAL_RACK":
          taxable_gallons = basis_gallons; tax_imposed = true
          tax_amount_cents = round_half_up(basis_gallons * rate)   # -> integer cents
          deferred_tax_cents = 0
      else:  # DEFERRED_TO_PURCHASER
          taxable_gallons = basis_gallons; tax_imposed = false
          tax_amount_cents = 0
          deferred_tax_cents = round_half_up(basis_gallons * rate)
    input_set: |
      One RackRemoval row plus: the position holder Licensee (for gross_net_election), the purchaser
      Licensee (license_type, status, bond_deficiency_cents, retail_channel), and at most one
      ExemptionCertificate. cert_valid(cid, type) is true iff cid is not null AND the certificate's
      status == ACTIVE AND its exemption_type == type AND its purchaser_licensee_id ==
      removal.purchaser_licensee_id AND removal_date lies inside the CLOSED window
      [valid_from, valid_to] AND product_code is in CERT_PRODUCT_SET[type].
    constants:
      HOME_STATE_CODE: "MN"
      RATE_CENTS_PER_GALLON:
        GASOLINE: 28.6
        UNDYED_DIESEL: 30.9
        DYED_DIESEL: 0.0
        JET_FUEL: 5.0
        AVIATION_GAS: 10.0
        ETHANOL_E100: 28.6
        BIODIESEL_B100: 30.9
      CERT_PRODUCT_SET:
        GOVERNMENT: [GASOLINE, UNDYED_DIESEL]
        AGRICULTURE: [UNDYED_DIESEL]
        EXPORT: [GASOLINE, UNDYED_DIESEL, JET_FUEL, AVIATION_GAS, ETHANOL_E100, BIODIESEL_B100]
    precision: "gallons carry 2 decimals; money is integer cents produced by a single round_half_up of gallons * rate"
    variants:
      - name: net_temperature_corrected
        when: "position_holder.gross_net_election == NET"
        difference: "taxable_gallons = net_gallons, so the same physical load is taxed on fewer gallons than the GROSS variant"
      - name: gross_billed
        when: "position_holder.gross_net_election == GROSS"
        difference: "taxable_gallons = gross_gallons; for an 8000.00/7960.00 gross/net load of UNDYED_DIESEL the two variants differ by 1236 cents on the identical input row"

  - name: monthly_return_tax_due
    trigger: "POST /mft/returns/{id}/file (side effect: sets taxable_gallons_total and tax_due_cents)"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (this is the whole difficulty of this rule):
      #   sum gallons per PRODUCT first at full 2-decimal precision, floor the product's net at
      #   zero, multiply the product's net gallons by the rate ONCE, and round to cents ONCE per
      #   product. Do NOT round per ScheduleLine and do NOT round after summing all products.
      tax_due_cents = 0
      taxable_gallons_total = 0.00
      for product in PRODUCT_CODES:                       # iterate in PRODUCT_CODES order
          received_unpaid = sum(line.gallons for lines under schedule_code SCH_2_RECEIVED_TAX_UNPAID
                                and product)              # exact 2-decimal sum
          exempt_sales    = sum(line.gallons for lines under schedule_code SCH_6_EXEMPT_SALES and product)
          exports         = sum(line.gallons for lines under schedule_code SCH_7_EXPORTS and product)
          net = received_unpaid - exempt_sales - exports
          net = max(0.00, net)                            # PER-PRODUCT floor: a negative product
                                                          # never subsidises another product
          taxable_gallons_total += net
          tax_due_cents += round_half_up(net * RATE_CENTS_PER_GALLON[product])
    input_set: |
      Every ScheduleLine under every ReturnSchedule of THIS return row only (schedules of a
      superseded or draft sibling return are excluded). SCH_1_RECEIVED_TAX_PAID,
      SCH_5_DELIVERED_TAX_COLLECTED and SCH_10_DYED_SALES gallons never enter tax_due_cents: SCH_1
      only feeds the refund tax-paid pool, SCH_5 only feeds cross-matching, SCH_10 is informational.
    constants:
      PRODUCT_CODES: [GASOLINE, UNDYED_DIESEL, DYED_DIESEL, JET_FUEL, AVIATION_GAS, ETHANOL_E100, BIODIESEL_B100]
      RATE_CENTS_PER_GALLON: "same table as rack_removal_tax_imposition"
    precision: "2 decimals on gallons, one round_half_up to integer cents per product code"
    variants:
      - name: per_product_single_rounding
        when: "always - this is the pinned order"
        difference: "two SCH_2 UNDYED_DIESEL lines of 100.01 gallons each yield round_half_up(200.02 * 30.9) = 6181 cents"
      - name: per_line_rounding_rejected
        when: "never - documented only to pin what the implementation must NOT do"
        difference: "rounding each line first would yield 3090 + 3090 = 6180 cents, one cent short"

  - name: return_penalty_and_interest
    trigger: "POST /mft/returns/{id}/file (side effect: sets days_late, interest_cents, penalty_cents, total_remittance_cents)"
    algorithm: threshold
    formula: |
      # The bracket that selects the penalty percentage is keyed on a subtotal that ALREADY
      # contains interest, while interest itself is keyed only on tax. The dependency LOOKS
      # circular; the evaluation order below is the pinned resolution and must be followed exactly.
      # STEP 1: due_at = 20th day of the month after period_month at 23:59:59Z
      #         days_late = 0 if filed_at <= due_at
      #                     else ceil((filed_at - due_at) / 86400 seconds)
      # STEP 2: interest on TAX ONLY
      interest_cents = 0 if days_late == 0 else round_half_up(tax_due_cents * DAILY_INTEREST_RATE * days_late)
      # STEP 3: penalty on the tax+interest subtotal, tier by days_late, surcharge by subtotal size
      if days_late == 0:
          penalty_cents = 0
      else:
          subtotal = tax_due_cents + interest_cents
          pct = 0.05 if days_late <= 30 else (0.10 if days_late <= 60 else 0.15)
          if subtotal >= LARGE_DEFICIENCY_CENTS:
              pct = pct + 0.05                      # surcharge applied to the tier, not compounded
          penalty_cents = max(LATE_FILING_MIN_PENALTY_CENTS, round_half_up(subtotal * pct))
      # STEP 4: total
      total_remittance_cents = tax_due_cents + interest_cents + penalty_cents
    input_set: |
      One MonthlyReturn row after monthly_return_tax_due has run, plus the logical clock at file
      time. For an amendment return (amends_return_id != null) days_late is measured from the SAME
      due_at as the original period and, when this.tax_due_cents <= amended.tax_due_cents, both
      interest_cents and penalty_cents are copied verbatim from the amended return instead of being
      recomputed - so a corrective amendment that does not increase tax cannot manufacture new
      penalty. When this.tax_due_cents > amended.tax_due_cents, STEP 2 and STEP 3 run on the FULL
      amended tax_due_cents using the amendment's own filed_at.
    constants:
      DAILY_INTEREST_RATE: 0.00025
      LATE_FILING_MIN_PENALTY_CENTS: 5000
      LARGE_DEFICIENCY_CENTS: 1000000
      DUE_DAY_OF_FOLLOWING_MONTH: 20
    precision: "integer cents, round_half_up at each of STEP 2 and STEP 3 (never a single combined rounding)"
    variants:
      - name: original_filing
        when: "amends_return_id == null"
        difference: "interest and penalty computed from this return's own filed_at"
      - name: amendment_no_increase
        when: "amends_return_id != null and this.tax_due_cents <= amended.tax_due_cents"
        difference: "interest_cents and penalty_cents copied from the amended return, so amendment_delta_cents equals the pure tax difference"

  - name: licensee_bond_requirement
    trigger: "POST /mft/licensees (initial), POST /mft/licensees/{id}/bonds, POST /mft/bonds/{id}/release, POST /mft/returns/{id}/file, and every Licensee status transition"
    algorithm: threshold
    formula: |
      basis_returns = the newest up-to-3 MonthlyReturns with licensee_id == this licensee and
                      filing_status == FILED, ordered by period_month DESC, tie-break created_at ASC
      if basis_returns is empty:
          avg_monthly_tax_liability_cents = NEW_LICENSEE_ASSUMED_LIABILITY_CENTS
      else:
          avg_monthly_tax_liability_cents = floor(sum(r.tax_due_cents for r in basis_returns) / count(basis_returns))
      suspension_multiplier = 2.0 if status == "SUSPENDED" else 1.0
      raw = avg_monthly_tax_liability_cents * BOND_MONTHS * TYPE_MULTIPLIER[license_type] * suspension_multiplier
      rounded_up = ceil(raw / BOND_ROUNDING_CENTS) * BOND_ROUNDING_CENTS
      required_bond_cents = min(MAX_BOND_CENTS, max(MIN_BOND_CENTS, rounded_up))
      posted_bond_cents   = sum(b.amount_cents for BondInstrument b of this licensee with status == ACTIVE)
      bond_deficiency_cents = max(0, required_bond_cents - posted_bond_cents)
    input_set: "MonthlyReturns with filing_status == FILED only (DRAFT and SUPERSEDED excluded); BondInstruments with status == ACTIVE only (RELEASED and FORFEITED excluded)"
    constants:
      NEW_LICENSEE_ASSUMED_LIABILITY_CENTS: 500000
      BOND_MONTHS: 3
      BOND_ROUNDING_CENTS: 100000
      MIN_BOND_CENTS: 200000
      MAX_BOND_CENTS: 100000000
      TYPE_MULTIPLIER:
        SUPPLIER: 1.0
        DISTRIBUTOR: 1.0
        BLENDER: 1.0
        TRANSPORTER: 0.5
        RETAILER: 0.25
    precision: "integer cents; the ceil to BOND_ROUNDING_CENTS happens BEFORE the min/max clamp"

  - name: licensee_risk_score
    trigger: "GET /mft/licensees/{id}/risk-profile (read) and POST /mft/audit-cases when selection_method == RISK_SCORE (gate)"
    algorithm: weighted_scoring
    formula: |
      # Two independently defensible weightings of the SAME compliance history. Both share the
      # behaviour terms and differ only in how the cross-match signal is weighted: by MAGNITUDE of
      # unreported gallons, or by FREQUENCY of unresolved discrepancies.
      late_points = min(24, 8 * late_filing_count)
      dyed_points = min(30, 15 * dyed_violation_count)
      variance_points  = min(60, round_half_up(unreported_gallons_total / GALLONS_PER_RISK_POINT))
      frequency_points = min(60, POINTS_PER_OPEN_DISCREPANCY * open_discrepancy_count)
      risk_score_variance_weighted  = min(100, variance_points  + late_points + dyed_points)
      risk_score_frequency_weighted = min(100, frequency_points + late_points + dyed_points)
      # Audit selection gate:
      selected = risk_score_variance_weighted  if risk_score_variant == "VARIANCE_WEIGHTED"
            else risk_score_frequency_weighted
      if selection_method == "RISK_SCORE" and selected < AUDIT_SELECTION_THRESHOLD:
          reject with ERR_RISK_SCORE_BELOW_THRESHOLD
      selection_score = selected (frozen on the AuditCase at creation)
    input_set: |
      MatchDiscrepancy rows where distributor_licensee_id == this licensee: variance_points uses
      direction == UNREPORTED_BY_PURCHASER and status NOT IN {WRITTEN_OFF, RESOLVED_EXPLAINED};
      frequency_points counts rows with status IN {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED} regardless
      of direction. Plus the licensee's late_filing_count and dyed_violation_count counters.
    constants:
      GALLONS_PER_RISK_POINT: 500
      POINTS_PER_OPEN_DISCREPANCY: 6
      AUDIT_SELECTION_THRESHOLD: 60
    precision: "integer points; the division by GALLONS_PER_RISK_POINT is rounded half-up before the min() cap"
    variants:
      - name: VARIANCE_WEIGHTED
        when: "risk_score_variant == VARIANCE_WEIGHTED (the default)"
        difference: "three OPEN discrepancies of 9999.00 gallons each score 60 (29997/500 -> 60 capped), clearing AUDIT_SELECTION_THRESHOLD"
      - name: FREQUENCY_WEIGHTED
        when: "risk_score_variant == FREQUENCY_WEIGHTED"
        difference: "the same three discrepancies score 18 (3 * 6) and the identical licensee is NOT selectable for a RISK_SCORE audit"

  - name: cross_match_variance
    trigger: "POST /mft/cross-match-runs (creates MatchDiscrepancy rows and sets the run's counters)"
    algorithm: chronological
    formula: |
      cells = []
      for supplier in Licensees with a MonthlyReturn(filing_status == FILED, period_month == run.period_month)
                      carrying at least one SCH_5_DELIVERED_TAX_COLLECTED schedule
                      ordered by supplier.created_at ASC:
        for (counterparty_licensee_id, product) pairs appearing on that supplier's SCH_5 schedules,
            ordered by counterparty.created_at ASC then product_code in PRODUCT_CODES order:
          supplier_gallons = sum(line.gallons for that supplier's SCH_5 lines with this counterparty and product)
          purchaser_return = the MonthlyReturn with licensee_id == counterparty, period_month ==
                             run.period_month and filing_status == FILED (at most one exists)
          if purchaser_return is null:
              distributor_gallons = 0.00
              direction_hint = "MISSING_COUNTERPARTY_RETURN"
          else:
              distributor_gallons = sum(line.gallons for purchaser_return's
                                        SCH_1_RECEIVED_TAX_PAID lines with counterparty == supplier and product)
              direction_hint = null
          variance = supplier_gallons - distributor_gallons          # 2 decimals
          matched_cells_count += 1
          if abs(variance) > TOLERANCE_GALLONS:                      # STRICT '>' - exactly
                                                                     # TOLERANCE_GALLONS creates nothing
              direction = direction_hint or ("UNREPORTED_BY_PURCHASER" if variance > 0
                                             else "OVERSTATED_BY_PURCHASER")
              create MatchDiscrepancy{... status: OPEN ...}
              discrepancy_count += 1
              if direction == "UNREPORTED_BY_PURCHASER":
                  gross_unreported_gallons_total += variance
                  unreported_gallons_total       += variance
                  if variance >= AUTO_ESCALATION_GALLONS:            # inclusive '>='
                      escalate (or, when an overlapping non-CLOSED AuditCase exists,
                                leave OPEN and escalation_skipped_count += 1)
      # returns whose licensee appears in no created discrepancy for this period go MATCH_CLEAN,
      # the others go MATCH_VARIANCE
    input_set: |
      Only MonthlyReturns with filing_status == FILED and period_month == run.period_month enter
      either side; DRAFT and SUPERSEDED returns are invisible to cross-matching. Cell enumeration
      order is created_at ASC on the licensee rows and PRODUCT_CODES order on the product, never
      row id, so the created discrepancies' created_at ordering is reproducible.
    constants:
      TOLERANCE_GALLONS: 5.00
      AUTO_ESCALATION_GALLONS: 10000.00
      AUDIT_PERIOD_BUFFER_MONTHS: 1
    precision: "gallons 2 decimals; comparisons are exact decimal comparisons, not float"

  - name: refund_allowable_gallons
    trigger: "POST /mft/refund-claims (sets allowable_gallons and refund_amount_cents) and re-run on POST /mft/refund-claims/{id}/decide with decision == PARTIALLY_APPROVED"
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 - statutory basis, per claim type
      if claim_type == "OFF_ROAD" or claim_type == "EXPORT":
          basis = claimed_gallons
      elif claim_type == "PTO":
          basis = round_half_up_2dp(claimed_gallons * PTO_ALLOCATION_PCT[equipment_class])
      else:  # REFRIGERATION_UNIT
          basis = min(claimed_gallons, REEFER_MONTHLY_CAP_GALLONS)
      # STEP 2 - waterfall against the period's tax-paid pool, oldest claim first
      pool = sum(line.gallons for SCH_1_RECEIVED_TAX_PAID lines of product UNDYED_DIESEL on the
                 claimant's MonthlyReturn with this period_month and filing_status == FILED)
      consumed = sum(c.allowable_gallons for the claimant's other RefundClaims with the same
                     period_month and status NOT IN {"DENIED"}, ordered by created_at ASC)
      available = pool - consumed
      if basis > available:
          reject with ERR_REFUND_EXCEEDS_TAX_PAID          # aggregate validation, not a silent clamp
      allowable_gallons = basis
      # STEP 3 - money
      refund_amount_cents = round_half_up(allowable_gallons * RATE_CENTS_PER_GALLON["UNDYED_DIESEL"])
      # STEP 4 - payability floor, checked at decide time (see validations priority 504)
      #          refund_amount_cents >= MIN_REFUND_CENTS, inclusive
    input_set: |
      Exactly one FILED MonthlyReturn of the claimant for period_month supplies the pool (a
      SUPERSEDED return contributes nothing, so an amendment that drops SCH_1 gallons shrinks the
      pool for later claims). Prior claims of any status except DENIED consume the pool, including
      claims still SUBMITTED, REVIEWED or HELD.
    constants:
      PTO_ALLOCATION_PCT:
        CONCRETE_MIXER: 0.30
        REFUSE_PACKER: 0.25
        BULK_TANKER_PUMP: 0.15
      REEFER_MONTHLY_CAP_GALLONS: 1500.00
      MIN_REFUND_CENTS: 2000
      REFUND_PRODUCT_CODE: UNDYED_DIESEL
    precision: "allowable_gallons rounded half-up to 2 decimals BEFORE the money step; refund_amount_cents is one round_half_up of allowable_gallons * 30.9"

  - name: dyed_fuel_penalty
    trigger: "POST /mft/roadside-inspections when dye_test_result == POSITIVE (sets penalty_cents)"
    algorithm: tiered_pricing
    formula: |
      if dye_test_result == "NEGATIVE":
          penalty_cents = 0
      else:
          base = max(DYED_BASE_PENALTY_CENTS, round_half_up(gallons_in_tank * DYED_PER_GALLON_CENTS))
          multiplier = 1.0 if prior_positive_count == 0 else (2.0 if prior_positive_count == 1 else 3.0)
          penalty_cents = round_half_up(base * multiplier)      # max() first, THEN the multiplier
    input_set: |
      prior_positive_count counts the inspected licensee's earlier RoadsideInspection rows with
      dye_test_result == POSITIVE and status != DISMISSED, ordered by inspection_date ASC then
      created_at ASC, counting only rows strictly before this one. A dismissed prior offence does
      not escalate a later one.
    constants:
      DYED_BASE_PENALTY_CENTS: 100000
      DYED_PER_GALLON_CENTS: 1000
      DYED_SUSPENSION_THRESHOLD: 2
    precision: "integer cents; the max() is evaluated before the multiplier so the escalation applies to the floor as well as the per-gallon amount"

  - name: assessment_amounts
    trigger: "POST /mft/audit-cases/{id}/assessments (sets assessment_penalty_cents, assessment_interest_cents, assessed_total_cents)"
    algorithm: threshold
    formula: |
      pct = FRAUD_PENALTY_PCT if evasion_indicator else NEGLIGENCE_PENALTY_PCT
      assessment_penalty_cents = round_half_up(additional_tax_cents * pct)
      period_due_at = 20th day of the month after period_end_month at 23:59:59Z
      days_elapsed = max(0, floor((logical_clock_now - period_due_at) / 86400 seconds))
      assessment_interest_cents = round_half_up(additional_tax_cents * DAILY_INTEREST_RATE * days_elapsed)
      assessed_total_cents = additional_tax_cents + assessment_penalty_cents + assessment_interest_cents
    input_set: "one AuditCase row, its period_end_month, and the logical clock at issuance; interest never accrues on the penalty"
    constants:
      NEGLIGENCE_PENALTY_PCT: 0.10
      FRAUD_PENALTY_PCT: 0.50
      DAILY_INTEREST_RATE: 0.00025
    precision: "integer cents, one round_half_up per component"

  - name: licensee_balance
    trigger: "every LedgerEntry append (return filing, amendment filing, refund payment, roadside penalty and its reversal, assessment and its abatement, licensee payment)"
    algorithm: aggregation
    formula: |
      balance_cents = sum(e.amount_cents for LedgerEntry e with licensee_id == this licensee)
      # Sign convention: RETURN_TAX, RETURN_TAX_ADJUSTMENT (may be negative), PENALTY, INTEREST and
      # ASSESSMENT post positive; REFUND, PAYMENT, ABATEMENT and PENALTY_REVERSAL post negative.
      # INVARIANT M (money): for every licensee at every instant,
      #     Licensee.balance_cents == sum of that licensee's LedgerEntry.amount_cents
      # and an ISSUED assessment followed by its ABATEMENT leaves balance_cents at exactly its
      # pre-assessment value, with the two ledger rows both retained.
      # INVARIANT G (gallons): for every licensee at every instant,
      #     Licensee.effective_taxable_gallons_ytd ==
      #         sum(r.taxable_gallons_total for r in that licensee's MonthlyReturns with
      #             filing_status == FILED and period_month's year == logical clock's year)
      # and filing an amendment whose schedules reproduce the superseded return's gallons leaves
      # effective_taxable_gallons_ytd unchanged, because the SUPERSEDED row leaves the sum on the
      # same request in which the amendment row joins it.
    input_set: "all LedgerEntry rows of the licensee, no status filter (the ledger is append-only; corrections are new rows, never edits)"
    constants: {}
    precision: "integer cents; no rounding (the ledger only ever stores already-rounded amounts)"

# =====================================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; the FIRST violated rule
#     produces the response and no later rule may override it)
# =====================================================================================
validations:
  # ---- authentication / authorization -----------------------------------------------
  - priority: 10
    category: auth
    check: "X-User-Role header present and one of the six declared roles; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 25
    category: auth
    check: "when the acting role is LicenseeAgent, X-User-ID must equal the licensee_id that owns the addressed resource (Licensee.id itself, MonthlyReturn.licensee_id, ReturnSchedule -> return.licensee_id, ScheduleLine -> schedule -> return.licensee_id, RefundClaim.licensee_id, MatchDiscrepancy.distributor_licensee_id, BondInstrument.licensee_id); list endpoints are silently narrowed to the agent's own licensee_id instead of erroring"
    error_id: ERR_LICENSEE_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all LicenseeAgent-accessible endpoints"
  # ---- request shape ----------------------------------------------------------------
  - priority: 30
    category: existence
    check: "body/query schema: required fields present, types correct, enum members legal, numeric constraints (gross_gallons > 0, net_gallons > 0 and <= gross_gallons, claimed_gallons > 0, amount_cents > 0, additional_tax_cents >= 0), pattern constraints (period_month ^[0-9]{4}-(0[1-9]|1[0-2])$, destination_state ^[A-Z]{2}$, ISO 8601 timestamps), and conditional requirements (equipment_class required iff claim_type == PTO; evasion_indicator required on assessment issuance)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 35
    category: existence
    check: "limit is an integer in [1,100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all list endpoints"
  # ---- path existence, left to right ------------------------------------------------
  - priority: 40
    category: existence
    check: "{id} in /mft/licensees/{id}/... resolves to a Licensee"
    error_id: ERR_LICENSEE_NOT_FOUND
    http_status: 404
    applies_to: "all /mft/licensees/{id} paths"
  - priority: 41
    category: existence
    check: "{id} in /mft/bonds/{id}/... resolves to a BondInstrument"
    error_id: ERR_BOND_NOT_FOUND
    http_status: 404
    applies_to: "POST /mft/bonds/{id}/release"
  - priority: 42
    category: existence
    check: "{id} in /mft/terminals/{id} resolves to a Terminal"
    error_id: ERR_TERMINAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /mft/terminals/{id}"
  - priority: 43
    category: existence
    check: "{id} in /mft/exemption-certificates/{id}/... resolves to an ExemptionCertificate"
    error_id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    applies_to: "GET /mft/exemption-certificates/{id}, POST /mft/exemption-certificates/{id}/revoke"
  - priority: 44
    category: existence
    check: "{id} in /mft/rack-removals/{id} resolves to a RackRemoval"
    error_id: ERR_RACK_REMOVAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /mft/rack-removals/{id}"
  - priority: 45
    category: existence
    check: "{id} in /mft/returns/{id}/... resolves to a MonthlyReturn"
    error_id: ERR_RETURN_NOT_FOUND
    http_status: 404
    applies_to: "all /mft/returns/{id} paths"
  - priority: 46
    category: existence
    check: "{id} in /mft/schedules/{id}/... resolves to a ReturnSchedule"
    error_id: ERR_SCHEDULE_NOT_FOUND
    http_status: 404
    applies_to: "GET /mft/schedules/{id}, POST /mft/schedules/{id}/lines"
  - priority: 47
    category: existence
    check: "{id} in /mft/schedule-lines/{id} resolves to a ScheduleLine"
    error_id: ERR_SCHEDULE_LINE_NOT_FOUND
    http_status: 404
    applies_to: "GET /mft/schedule-lines/{id}"
  - priority: 48
    category: existence
    check: "{id} in /mft/cross-match-runs/{id} resolves to a CrossMatchRun"
    error_id: ERR_CROSS_MATCH_RUN_NOT_FOUND
    http_status: 404
    applies_to: "GET /mft/cross-match-runs/{id}"
  - priority: 49
    category: existence
    check: "{id} in /mft/discrepancies/{id}/... resolves to a MatchDiscrepancy"
    error_id: ERR_DISCREPANCY_NOT_FOUND
    http_status: 404
    applies_to: "all /mft/discrepancies/{id} paths"
  - priority: 50
    category: existence
    check: "{id} in /mft/refund-claims/{id}/... resolves to a RefundClaim"
    error_id: ERR_REFUND_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "all /mft/refund-claims/{id} paths"
  - priority: 51
    category: existence
    check: "{id} in /mft/roadside-inspections/{id}/... resolves to a RoadsideInspection"
    error_id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /mft/roadside-inspections/{id}, POST /mft/roadside-inspections/{id}/dismiss"
  - priority: 52
    category: existence
    check: "{id} in /mft/audit-cases/{id}/... resolves to an AuditCase"
    error_id: ERR_AUDIT_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all /mft/audit-cases/{id} paths"
  # ---- body foreign keys, in declaration order --------------------------------------
  - priority: 55
    category: existence
    check: "body FKs naming a Licensee resolve: licensee_id, parent_licensee_id, purchaser_licensee_id, position_holder_licensee_id, counterparty_licensee_id, inspected_licensee_id, subject_licensee_id"
    error_id: ERR_LICENSEE_NOT_FOUND
    http_status: 404
    applies_to: "POST /mft/licensees, POST /mft/rack-removals, POST /mft/exemption-certificates, POST /mft/schedules/{id}/lines, POST /mft/refund-claims, POST /mft/roadside-inspections, POST /mft/audit-cases"
  - priority: 56
    category: existence
    check: "body terminal_id resolves to a Terminal"
    error_id: ERR_TERMINAL_NOT_FOUND
    http_status: 404
    applies_to: "POST /mft/rack-removals"
  - priority: 57
    category: existence
    check: "body exemption_certificate_id, when not null, resolves to an ExemptionCertificate"
    error_id: ERR_CERTIFICATE_NOT_FOUND
    http_status: 404
    applies_to: "POST /mft/rack-removals, POST /mft/schedules/{id}/lines"
  - priority: 58
    category: existence
    check: "body source_discrepancy_id, when not null, resolves to a MatchDiscrepancy"
    error_id: ERR_DISCREPANCY_NOT_FOUND
    http_status: 404
    applies_to: "POST /mft/audit-cases"
  # ---- optimistic concurrency (§1.2.1) ---------------------------------------------
  - priority: 60
    category: state
    check: "expected_licensee_version equals the addressed Licensee's current version"
    error_id: ERR_STALE_LICENSEE_VERSION
    http_status: 412
    applies_to: "POST /mft/licensees/{id}/bonds"
  - priority: 61
    category: state
    check: "expected_return_version equals the amended MonthlyReturn's current version"
    error_id: ERR_STALE_RETURN_VERSION
    http_status: 412
    applies_to: "POST /mft/returns/{id}/amendments"
  # ---- state preconditions ---------------------------------------------------------
  - priority: 70
    category: state
    check: "the addressed Licensee is not REVOKED (a REVOKED licensee accepts no new bonds, returns, schedules, refund claims or audit cases)"
    error_id: ERR_LICENSEE_REVOKED
    http_status: 409
    applies_to: "POST /mft/licensees/{id}/bonds, POST /mft/licensees/{id}/activate, POST /mft/licensees/{id}/suspend, POST /mft/returns, POST /mft/returns/{id}/file, POST /mft/refund-claims"
  - priority: 71
    category: state
    check: "the transition requested by activate/suspend/revoke is legal from the Licensee's current status (activate only from PENDING_BOND or SUSPENDED, suspend only from ACTIVE, revoke from PENDING_BOND, ACTIVE or SUSPENDED, i.e. from any status the licensee has not already left)"
    error_id: ERR_LICENSEE_STATE_INVALID
    http_status: 409
    applies_to: "POST /mft/licensees/{id}/activate, POST /mft/licensees/{id}/suspend, POST /mft/licensees/{id}/revoke"
  - priority: 72
    category: state
    check: "the addressed BondInstrument.status == ACTIVE"
    error_id: ERR_BOND_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /mft/bonds/{id}/release"
  - priority: 73
    category: state
    check: "the addressed ExemptionCertificate.status == ACTIVE"
    error_id: ERR_CERTIFICATE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /mft/exemption-certificates/{id}/revoke"
  - priority: 74
    category: state
    check: "the target MonthlyReturn.filing_status == DRAFT for schedule building and for filing (a FILED or SUPERSEDED return accepts no new schedules, no new lines and cannot be filed again)"
    error_id: ERR_RETURN_ALREADY_FILED
    http_status: 409
    applies_to: "POST /mft/returns/{id}/schedules, POST /mft/schedules/{id}/lines, POST /mft/returns/{id}/file"
  - priority: 75
    category: state
    check: "the MonthlyReturn being amended has filing_status == FILED"
    error_id: ERR_RETURN_NOT_FILED
    http_status: 409
    applies_to: "POST /mft/returns/{id}/amendments"
  - priority: 76
    category: state
    check: "the MatchDiscrepancy is in the state the action requires: inquiries from OPEN or RESPONSE_RECEIVED; responses from INQUIRY_SENT; resolve from OPEN, INQUIRY_SENT or RESPONSE_RECEIVED"
    error_id: ERR_DISCREPANCY_STATE_INVALID
    http_status: 409
    applies_to: "POST /mft/discrepancies/{id}/inquiries, POST /mft/discrepancies/{id}/responses, POST /mft/discrepancies/{id}/resolve"
  - priority: 77
    category: state
    check: "the RefundClaim is in the state the action requires: review from SUBMITTED; decide from REVIEWED; pay from APPROVED or PARTIALLY_APPROVED"
    error_id: ERR_REFUND_STATE_INVALID
    http_status: 409
    applies_to: "POST /mft/refund-claims/{id}/review, POST /mft/refund-claims/{id}/decide, POST /mft/refund-claims/{id}/pay"
  - priority: 78
    category: state
    check: "the RoadsideInspection.status == PENALTY_ASSESSED"
    error_id: ERR_INSPECTION_NOT_DISMISSIBLE
    http_status: 409
    applies_to: "POST /mft/roadside-inspections/{id}/dismiss"
  - priority: 79
    category: state
    check: "the AuditCase is in the state the action requires: advance from OPEN, FIELDWORK, PRELIM_FINDINGS or TAXPAYER_RESPONSE and only along a transition the machine declares; assessments from PRELIM_FINDINGS or TAXPAYER_RESPONSE or TAXPAYER_RESPONSE with assessment_status == NONE; abate and protest from assessment_status == ISSUED; finalize from assessment_status IN {ISSUED, PROTESTED}; and no action at all is accepted once case_status == CLOSED"
    error_id: ERR_AUDIT_CASE_STATE_INVALID
    http_status: 409
    applies_to: "all POST /mft/audit-cases/{id}/... paths"
  - priority: 80
    category: state
    check: "assessment_status == NONE when an assessment is issued (one assessment per case; a second issuance is refused rather than replacing the first)"
    error_id: ERR_ASSESSMENT_ALREADY_ISSUED
    http_status: 409
    applies_to: "POST /mft/audit-cases/{id}/assessments"
  - priority: 81
    category: state
    check: "closing a case requires assessment_status IN {NONE, FINAL, ABATED} - an ISSUED or PROTESTED assessment must be finalized or abated first (the only coupling between the two parallel dimensions)"
    error_id: ERR_ASSESSMENT_PENDING_DISPOSITION
    http_status: 409
    applies_to: "POST /mft/audit-cases/{id}/advance with to_status == CLOSED"
  # ---- business rules: safety / compliance -----------------------------------------
  - priority: 100
    category: business_safety
    check: "the purchaser named on a rack removal has status ACTIVE or SUSPENDED (a PENDING or REVOKED purchaser may not take delivery at a rack at all)"
    error_id: ERR_PURCHASER_LICENSE_INVALID
    http_status: 422
    applies_to: "POST /mft/rack-removals"
  - priority: 101
    category: business_safety
    check: "the position holder named on a rack removal is an ACTIVE SUPPLIER"
    error_id: ERR_POSITION_HOLDER_INVALID
    http_status: 422
    applies_to: "POST /mft/rack-removals"
  - priority: 102
    category: business_safety
    check: "a presented ExemptionCertificate belongs to the purchaser on the transaction (certificate.purchaser_licensee_id == purchaser_licensee_id / counterparty_licensee_id)"
    error_id: ERR_CERTIFICATE_HOLDER_MISMATCH
    http_status: 422
    applies_to: "POST /mft/rack-removals, POST /mft/schedules/{id}/lines"
  - priority: 103
    category: business_safety
    check: "a presented ExemptionCertificate has status ACTIVE and the transaction date lies inside the closed window [valid_from, valid_to]; re-checked at filing time for every SCH_6_EXEMPT_SALES and SCH_7_EXPORTS line, so a certificate revoked between line entry and filing blocks the filing"
    error_id: ERR_CERTIFICATE_NOT_VALID_ON_DATE
    http_status: 422
    applies_to: "POST /mft/rack-removals, POST /mft/schedules/{id}/lines, POST /mft/returns/{id}/file"
  - priority: 104
    category: business_safety
    check: "product_code is a member of CERT_PRODUCT_SET[certificate.exemption_type] (GOVERNMENT covers GASOLINE and UNDYED_DIESEL only; AGRICULTURE covers UNDYED_DIESEL only)"
    error_id: ERR_EXEMPTION_PRODUCT_MISMATCH
    http_status: 422
    applies_to: "POST /mft/rack-removals, POST /mft/schedules/{id}/lines"
  - priority: 105
    category: business_safety
    check: "a SCH_10_DYED_SALES line's counterparty must not be a licensee with retail_channel == HIGHWAY, and a DYED_DIESEL line may never appear on SCH_2_RECEIVED_TAX_UNPAID, SCH_5_DELIVERED_TAX_COLLECTED or SCH_6_EXEMPT_SALES"
    error_id: ERR_DYED_FUEL_ON_ROAD_PROHIBITED
    http_status: 422
    applies_to: "POST /mft/schedules/{id}/lines"
  - priority: 106
    category: business_safety
    check: "segregation of duties on refunds: the X-User-ID deciding a claim must differ from RefundClaim.reviewer_user_id, and the X-User-ID paying it must differ from RefundClaim.decider_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /mft/refund-claims/{id}/decide, POST /mft/refund-claims/{id}/pay"
  - priority: 107
    category: business_safety
    check: "segregation of duties on audits: the X-User-ID issuing an assessment must differ from AuditCase.opened_by_user_id, and the X-User-ID abating an assessment must differ from AuditCase.assessed_by_user_id"
    error_id: ERR_ASSESSMENT_SEGREGATION_VIOLATION
    http_status: 422
    applies_to: "POST /mft/audit-cases/{id}/assessments, POST /mft/audit-cases/{id}/abate"
  - priority: 108
    category: business_safety
    check: "no AuditCase with subject_licensee_id == licensee_id and case_status != CLOSED exists when a refund claim is filed (an open audit freezes new claims from the subject; claims that already existed when the case opened are moved to HELD by the cascade instead)"
    error_id: ERR_REFUND_BLOCKED_BY_AUDIT
    http_status: 422
    applies_to: "POST /mft/refund-claims"
  - priority: 109
    category: business_safety
    check: "a licensee whose dyed_violation_count >= DYED_SUSPENSION_THRESHOLD (2) may not be reinstated until the count is brought back below the threshold by dismissing an inspection"
    error_id: ERR_DYED_VIOLATION_HOLD
    http_status: 422
    applies_to: "POST /mft/licensees/{id}/activate"
  # ---- business rules: referential integrity ---------------------------------------
  - priority: 200
    category: business_referential
    check: "ReturnSchedule.product_code is legal for the schedule_code (SCH_10_DYED_SALES accepts only DYED_DIESEL; every other schedule_code rejects DYED_DIESEL)"
    error_id: ERR_SCHEDULE_PRODUCT_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /mft/returns/{id}/schedules"
  - priority: 201
    category: business_referential
    check: "the counterparty's license_type is legal for the schedule_code: SCH_1_RECEIVED_TAX_PAID and SCH_2_RECEIVED_TAX_UNPAID require a SUPPLIER or DISTRIBUTOR counterparty; SCH_7_EXPORTS requires a counterparty whose mailing_state != HOME_STATE_CODE"
    error_id: ERR_COUNTERPARTY_TYPE_INVALID
    http_status: 422
    applies_to: "POST /mft/schedules/{id}/lines"
  - priority: 202
    category: business_referential
    check: "at filing, every schedule's DECLARED total_gallons equals the exact 2-decimal sum of its ScheduleLine.gallons (aggregate reconciliation of the filer's attested totals against the detail lines)"
    error_id: ERR_SCHEDULE_TOTALS_MISMATCH
    http_status: 422
    applies_to: "POST /mft/returns/{id}/file"
  - priority: 203
    category: business_referential
    check: "a return may not be filed with zero schedules, and a return whose licensee is a SUPPLIER must carry at least one SCH_5_DELIVERED_TAX_COLLECTED schedule"
    error_id: ERR_MISSING_REQUIRED_SCHEDULE
    http_status: 422
    applies_to: "POST /mft/returns/{id}/file"
  - priority: 204
    category: business_referential
    check: "an amendment target must be the newest non-SUPERSEDED return of its (licensee_id, period_month) chain and must not itself be an amendment that has already been amended"
    error_id: ERR_AMENDMENT_TARGET_INVALID
    http_status: 422
    applies_to: "POST /mft/returns/{id}/amendments"
  - priority: 205
    category: business_referential
    check: "when source_discrepancy_id is supplied, selection_method must be CROSS_MATCH_ESCALATION, the discrepancy's escalation subject (distributor_licensee_id when direction == UNREPORTED_BY_PURCHASER, else supplier_licensee_id) must equal subject_licensee_id, and the discrepancy's status must be one of {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED} - an already ESCALATED_TO_AUDIT discrepancy cannot seed a second case"
    error_id: ERR_DISCREPANCY_SOURCE_MISMATCH
    http_status: 422
    applies_to: "POST /mft/audit-cases"
  - priority: 206
    category: business_referential
    check: "an explanation may only reference a period the discrepancy actually covers: a response's referenced_return_id, when supplied, must belong to the discrepancy's distributor_licensee_id"
    error_id: ERR_RESPONSE_RETURN_MISMATCH
    http_status: 422
    applies_to: "POST /mft/discrepancies/{id}/responses"
  # ---- business rules: temporal ----------------------------------------------------
  - priority: 300
    category: business_temporal
    check: "a cross-match run's period_month must be strictly earlier than the logical clock's own month (an in-flight period is not matchable)"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /mft/cross-match-runs"
  - priority: 301
    category: business_temporal
    check: "no other ACTIVE ExemptionCertificate for the same (purchaser_licensee_id, exemption_type) may have a [valid_from, valid_to] window that touches or overlaps the requested one (closed intervals: shared endpoints collide)"
    error_id: ERR_CERTIFICATE_PERIOD_OVERLAP
    http_status: 422
    applies_to: "POST /mft/exemption-certificates"
  - priority: 302
    category: business_temporal
    check: "no other non-CLOSED AuditCase for the same subject_licensee_id may have a [period_start_month, period_end_month] window that overlaps the requested one after each side is widened by AUDIT_PERIOD_BUFFER_MONTHS on both ends (half-open month semantics: a one-month gap still collides)"
    error_id: ERR_AUDIT_PERIOD_OVERLAP
    http_status: 422
    applies_to: "POST /mft/audit-cases"
  - priority: 303
    category: business_temporal
    check: "period_start_month <= period_end_month, valid_from <= valid_to, and neither an inspection_date nor a bond effective_date may lie after the logical clock"
    error_id: ERR_DATE_RANGE_INVALID
    http_status: 422
    applies_to: "POST /mft/audit-cases, POST /mft/exemption-certificates, POST /mft/roadside-inspections, POST /mft/licensees/{id}/bonds"
  - priority: 304
    category: business_temporal
    check: "a refund claim's period_month must already have a FILED (non-SUPERSEDED) MonthlyReturn for the claimant"
    error_id: ERR_REFUND_PERIOD_NOT_FILED
    http_status: 422
    applies_to: "POST /mft/refund-claims"
  # ---- business rules: constraint satisfaction -------------------------------------
  - priority: 400
    category: business_constraint
    check: "Licensee.fein is unique across all licensees"
    error_id: ERR_DUPLICATE_FEIN
    http_status: 409
    applies_to: "POST /mft/licensees"
  - priority: 401
    category: business_constraint
    check: "Terminal.terminal_control_number is unique across all terminals"
    error_id: ERR_DUPLICATE_TCN
    http_status: 409
    applies_to: "POST /mft/terminals"
  - priority: 402
    category: business_constraint
    check: "bill_of_lading_number is unique per terminal_id on rack removals, and unique per (schedule.return_id, counterparty_licensee_id) on schedule lines"
    error_id: ERR_DUPLICATE_BOL
    http_status: 409
    applies_to: "POST /mft/rack-removals, POST /mft/schedules/{id}/lines"
  - priority: 403
    category: business_constraint
    check: "at most one non-SUPERSEDED MonthlyReturn exists per (licensee_id, period_month)"
    error_id: ERR_DUPLICATE_RETURN_PERIOD
    http_status: 409
    applies_to: "POST /mft/returns"
  - priority: 404
    category: business_constraint
    check: "at most one ReturnSchedule exists per (return_id, schedule_code, product_code)"
    error_id: ERR_DUPLICATE_SCHEDULE
    http_status: 409
    applies_to: "POST /mft/returns/{id}/schedules"
  - priority: 405
    category: business_constraint
    check: "at most one CrossMatchRun with run_status != FAILED exists per period_month"
    error_id: ERR_DUPLICATE_MATCH_RUN
    http_status: 409
    applies_to: "POST /mft/cross-match-runs"
  - priority: 406
    category: business_constraint
    check: "MatchDiscrepancy.inquiry_round < MAX_INQUIRY_ROUNDS (3) before a new inquiry is sent"
    error_id: ERR_INQUIRY_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /mft/discrepancies/{id}/inquiries"
  - priority: 407
    category: business_constraint
    check: "AuditCase.response_rounds < MAX_AUDIT_RESPONSE_ROUNDS (2) before the case may cycle back from TAXPAYER_RESPONSE into FIELDWORK"
    error_id: ERR_AUDIT_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /mft/audit-cases/{id}/advance"
  - priority: 408
    category: business_constraint
    check: "when selection_method == RISK_SCORE, the subject's risk score under the requested risk_score_variant must be >= AUDIT_SELECTION_THRESHOLD (60)"
    error_id: ERR_RISK_SCORE_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /mft/audit-cases"
  - priority: 409
    category: business_constraint
    check: "a resolve with resolution == WRITTEN_OFF must supply write_off_reason and is permitted only when abs(variance_gallons) < AUTO_ESCALATION_GALLONS (10000.00); a variance at or above the auto-escalation threshold must be EXPLAINED or ESCALATE_TO_AUDIT, never written off"
    error_id: ERR_WRITE_OFF_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /mft/discrepancies/{id}/resolve"
  - priority: 410
    category: business_constraint
    check: "a decide with decision == PARTIALLY_APPROVED is legal only when the review recorded recommendation == PARTIAL with a non-null recommended_gallons in (0, allowable_gallons]; the decider supplies no gallons of its own"
    error_id: ERR_DECISION_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /mft/refund-claims/{id}/decide"
  - priority: 411
    category: business_constraint
    check: "REFRIGERATION_UNIT and PTO claims must not name an equipment_class outside PTO_ALLOCATION_PCT, and claimed_gallons on a REFRIGERATION_UNIT claim must not exceed REEFER_MONTHLY_CAP_GALLONS by more than a factor of 10 (an obvious data-entry error is rejected rather than capped)"
    error_id: ERR_EQUIPMENT_CLASS_INVALID
    http_status: 422
    applies_to: "POST /mft/refund-claims"
  - priority: 412
    category: business_constraint
    check: "ExemptionCertificate.document_number is unique across all certificates"
    error_id: ERR_DUPLICATE_CERTIFICATE_NUMBER
    http_status: 409
    applies_to: "POST /mft/exemption-certificates"
  - priority: 413
    category: business_constraint
    check: "parent_licensee_id, when supplied, names a licensee with license_type == SUPPLIER, status == ACTIVE and parent_licensee_id == null (consolidated groups are exactly one level deep and a licensee may not be its own parent)"
    error_id: ERR_INVALID_PARENT_LICENSEE
    http_status: 422
    applies_to: "POST /mft/licensees"
  # ---- business rules: fiscal (always last) ----------------------------------------
  - priority: 500
    category: business_fiscal
    check: "a rack removal whose purchaser has license_type IN {SUPPLIER, DISTRIBUTOR}, whose destination_state == HOME_STATE_CODE and which presents no valid exemption certificate - the deferral shape - is refused when that purchaser's bond_deficiency_cents > 0, whatever the purchaser's status"
    error_id: ERR_PURCHASER_BOND_DEFICIENT
    http_status: 422
    applies_to: "POST /mft/rack-removals"
  - priority: 501
    category: business_fiscal
    check: "releasing a bond must not leave the licensee with posted_bond_cents < required_bond_cents while its status is ACTIVE"
    error_id: ERR_BOND_RELEASE_WOULD_CREATE_DEFICIENCY
    http_status: 422
    applies_to: "POST /mft/bonds/{id}/release"
  - priority: 502
    category: business_fiscal
    check: "a licensee may not be activated while bond_deficiency_cents > 0"
    error_id: ERR_BOND_DEFICIENCY_BLOCKS_ACTIVATION
    http_status: 422
    applies_to: "POST /mft/licensees/{id}/activate"
  - priority: 503
    category: business_fiscal
    check: "per calculations.refund_allowable_gallons STEP 2, the claim's basis must not exceed the period's remaining tax-paid pool"
    error_id: ERR_REFUND_EXCEEDS_TAX_PAID
    http_status: 422
    applies_to: "POST /mft/refund-claims"
  - priority: 504
    category: business_fiscal
    check: "refund_amount_cents (or, for PARTIALLY_APPROVED, the amount recomputed on the review's recommended_gallons) must be >= MIN_REFUND_CENTS (2000, inclusive)"
    error_id: ERR_REFUND_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /mft/refund-claims/{id}/decide"
  - priority: 505
    category: business_fiscal
    check: "an abatement always reverses the case's assessed_total_cents in full (partial abatement is not offered), so it is refused when the licensee's balance_cents is below assessed_total_cents - a payment has already retired part of the assessed liability and the full reversal would push the balance below its pre-assessment value and mint a credit"
    error_id: ERR_ABATEMENT_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /mft/audit-cases/{id}/abate"
  - priority: 506
    category: business_fiscal
    check: "a payment's amount_cents must be > 0 and must not exceed the licensee's current balance_cents (no credit balances are created through payments)"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "POST /mft/licensees/{id}/payments"

# =====================================================================================
# 1.5 API Endpoint Table
# =====================================================================================
endpoints:
  # ---- Licensee ---------------------------------------------------------------------
  - method: POST
    path: "/mft/licensees"
    description: "register a motor fuel licensee; the row starts in PENDING_BOND and its bond requirement is computed immediately from the NEW_LICENSEE_ASSUMED_LIABILITY_CENTS assumption"
    roles: [LicensingOfficer]
    code: 201
    input: [legal_name, fein, license_type, mailing_state, "gross_net_election?", "retail_channel?", "parent_licensee_id?"]
    output: Licensee
    side_effects:
      - "status := PENDING_BOND"
      - "calculations.licensee_bond_requirement sets avg_monthly_tax_liability_cents, required_bond_cents, posted_bond_cents = 0 and bond_deficiency_cents"
      - "balance_cents := 0; all compliance counters := 0"
  - method: GET
    path: "/mft/licensees/{id}"
    description: "read one licensee including its bond, balance and risk counters"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, FieldInspector, LicenseeAgent]
    code: 200
    input: []
    output: Licensee
    side_effects: []
  - method: GET
    path: "/mft/licensees"
    description: "list licensees; parent_licensee_id finds the members of a consolidated group"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, FieldInspector]
    code: 200
    input: ["license_type?", "status?", "parent_licensee_id?", "limit?", "offset?"]
    output: Licensee[]
    side_effects: []
  - method: POST
    path: "/mft/licensees/{id}/activate"
    description: "issue or reinstate the license; refuses while the licensee is under-bonded or holds two dyed-fuel violations"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: Licensee
    side_effects:
      - "status := ACTIVE; required_bond_cents recomputed with suspension multiplier 1.0"
      - "HELD RefundClaims with hold_reason BOND_DEFICIENCY revert to status_before_hold"
      - "version += 1"
  - method: POST
    path: "/mft/licensees/{id}/suspend"
    description: "suspend an active license; doubles the bond requirement and freezes the licensee's pending refunds"
    roles: [LicensingOfficer, TaxSupervisor]
    code: 200
    input: [reason]
    output: Licensee
    side_effects:
      - "status := SUSPENDED; required_bond_cents recomputed with suspension multiplier 2.0; bond_deficiency_cents re-derived"
      - "SUBMITTED/REVIEWED RefundClaims move to HELD with hold_reason BOND_DEFICIENCY when a deficiency appears"
      - "version += 1"
  - method: POST
    path: "/mft/licensees/{id}/revoke"
    description: "revoke the license permanently"
    roles: [LicensingOfficer]
    code: 200
    input: [reason]
    output: Licensee
    side_effects:
      - "status := REVOKED (terminal); ACTIVE BondInstruments := FORFEITED with release_reason LICENSE_REVOKED, so they stop counting toward posted_bond_cents"
      - "posted_bond_cents and bond_deficiency_cents re-derived per calculations.licensee_bond_requirement, so a revoked licensee whose bonds were just released carries a full deficiency"
      - "ACTIVE ExemptionCertificates naming this licensee as purchaser := REVOKED"
      - "SUBMITTED/REVIEWED/HELD RefundClaims := DENIED with allowable_gallons 0.00 and refund_amount_cents 0"
      - "version += 1"
  - method: POST
    path: "/mft/licensees/{id}/bonds"
    description: "post a surety bond for the licensee; expected_licensee_version guards against posting against a stale view of the licensee"
    roles: [LicensingOfficer]
    code: 201
    input: [amount_cents, surety_name, effective_date, expected_licensee_version]
    output: BondInstrument
    side_effects:
      - "BondInstrument created with status ACTIVE"
      - "any older ACTIVE bond of the same licensee := RELEASED with release_reason SUPERSEDED_BY_NEW_BOND"
      - "licensee posted_bond_cents and bond_deficiency_cents re-derived per calculations.licensee_bond_requirement; licensee.version += 1"
  - method: GET
    path: "/mft/licensees/{id}/bonds"
    description: "list the licensee's bond instruments, active and released"
    roles: [LicensingOfficer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BondInstrument[]
    side_effects: []
  - method: POST
    path: "/mft/bonds/{id}/release"
    description: "release an active bond at the operator's request; refused when it would leave an ACTIVE licensee under-bonded"
    roles: [LicensingOfficer]
    code: 200
    input: []
    output: BondInstrument
    side_effects:
      - "status := RELEASED with release_reason OPERATOR_RELEASE"
      - "licensee posted_bond_cents and bond_deficiency_cents re-derived; licensee.version += 1"
  - method: GET
    path: "/mft/licensees/{id}/bond-status"
    description: "computed read of the bond position, showing the three-month liability average that drives the requirement"
    roles: [LicensingOfficer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: []
    output: { avg_monthly_tax_liability_cents: integer, required_bond_cents: integer, posted_bond_cents: integer, bond_deficiency_cents: integer, basis_return_count: integer }
    side_effects: []
  - method: GET
    path: "/mft/licensees/{id}/ledger-entries"
    description: "list the licensee's append-only tax ledger in created_at order"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: POST
    path: "/mft/licensees/{id}/payments"
    description: "record a remittance received from the licensee; posts a negative PAYMENT ledger row"
    roles: [TaxSupervisor]
    code: 201
    input: [amount_cents, effective_date, "memo?"]
    output: LedgerEntry
    side_effects:
      - "LedgerEntry(PAYMENT, -amount_cents, source_entity_type Payment) appended"
      - "licensee.balance_cents re-derived per calculations.licensee_balance; licensee.version += 1"
  - method: GET
    path: "/mft/licensees/{id}/risk-profile"
    description: "computed read returning BOTH risk-score variants side by side together with the inputs that produced them"
    roles: [AuditManager, TaxSupervisor, ReturnsExaminer]
    code: 200
    input: []
    output: { risk_score_variance_weighted: integer, risk_score_frequency_weighted: integer, unreported_gallons_total: number, open_discrepancy_count: integer, late_filing_count: integer, dyed_violation_count: integer, audit_selection_threshold: integer }
    side_effects: []
  # ---- Terminal --------------------------------------------------------------------
  - method: POST
    path: "/mft/terminals"
    description: "register a terminal rack by its federal terminal control number"
    roles: [LicensingOfficer]
    code: 201
    input: [terminal_control_number, name, state_code]
    output: Terminal
    side_effects: []
  - method: GET
    path: "/mft/terminals/{id}"
    description: "read one terminal"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, FieldInspector, LicenseeAgent]
    code: 200
    input: []
    output: Terminal
    side_effects: []
  - method: GET
    path: "/mft/terminals"
    description: "list terminals"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Terminal[]
    side_effects: []
  # ---- ExemptionCertificate --------------------------------------------------------
  - method: POST
    path: "/mft/exemption-certificates"
    description: "issue an exemption certificate to a purchaser for a closed date window; windows for the same (purchaser, exemption_type) may not touch"
    roles: [LicensingOfficer]
    code: 201
    input: [purchaser_licensee_id, exemption_type, document_number, valid_from, valid_to]
    output: ExemptionCertificate
    side_effects:
      - "status := ACTIVE"
  - method: GET
    path: "/mft/exemption-certificates/{id}"
    description: "read one exemption certificate"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, FieldInspector, LicenseeAgent]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: []
  - method: GET
    path: "/mft/exemption-certificates"
    description: "list exemption certificates; purchaser_licensee_id finds every certificate held by a licensee"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["purchaser_licensee_id?", "exemption_type?", "status?", "limit?", "offset?"]
    output: ExemptionCertificate[]
    side_effects: []
  - method: POST
    path: "/mft/exemption-certificates/{id}/revoke"
    description: "revoke a certificate; already-recorded transactions keep their computed tax figures, only later presentations fail"
    roles: [LicensingOfficer]
    code: 200
    input: [reason]
    output: ExemptionCertificate
    side_effects:
      - "status := REVOKED (terminal)"
  # ---- RackRemoval -----------------------------------------------------------------
  - method: POST
    path: "/mft/rack-removals"
    description: "report a removal of product across a terminal rack; determines the imposition point and the taxable gallons basis"
    roles: [LicenseeAgent, ReturnsExaminer]
    code: 201
    input: [terminal_id, position_holder_licensee_id, purchaser_licensee_id, product_code, gross_gallons, net_gallons, removal_date, destination_state, bill_of_lading_number, "exemption_certificate_id?"]
    output: RackRemoval
    side_effects:
      - "calculations.rack_removal_tax_imposition sets basis_used, imposition_point, taxable_gallons, tax_imposed, tax_amount_cents, deferred_tax_cents"
  - method: GET
    path: "/mft/rack-removals/{id}"
    description: "read one rack removal with its computed tax determination"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, FieldInspector, LicenseeAgent]
    code: 200
    input: []
    output: RackRemoval
    side_effects: []
  - method: GET
    path: "/mft/rack-removals"
    description: "list rack removals by terminal, position holder, purchaser, certificate or removal month"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["terminal_id?", "position_holder_licensee_id?", "purchaser_licensee_id?", "exemption_certificate_id?", "removal_month?", "imposition_point?", "limit?", "offset?"]
    output: RackRemoval[]
    side_effects: []
  # ---- MonthlyReturn / schedules ---------------------------------------------------
  - method: POST
    path: "/mft/returns"
    description: "open a DRAFT monthly return for a licensee and period"
    roles: [LicenseeAgent, ReturnsExaminer]
    code: 201
    input: [licensee_id, period_month]
    output: MonthlyReturn
    side_effects:
      - "filing_status := DRAFT; match_status := NOT_MATCHED; due_at := 20th of the following month 23:59:59Z"
  - method: GET
    path: "/mft/returns/{id}"
    description: "read one monthly return with both status dimensions and all money fields"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: []
    output: MonthlyReturn
    side_effects: []
  - method: GET
    path: "/mft/returns"
    description: "list monthly returns; amends_return_id walks the amendment chain forward"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["licensee_id?", "period_month?", "filing_status?", "match_status?", "amends_return_id?", "limit?", "offset?"]
    output: MonthlyReturn[]
    side_effects: []
  - method: POST
    path: "/mft/returns/{id}/schedules"
    description: "add a schedule (schedule_code x product_code) to a DRAFT return, carrying the filer's declared gallons total for that schedule"
    roles: [LicenseeAgent, ReturnsExaminer]
    code: 201
    input: [schedule_code, product_code, total_gallons]
    output: ReturnSchedule
    side_effects:
      - "total_gallons stored exactly as declared by the filer; line_count := 0"
  - method: GET
    path: "/mft/returns/{id}/schedules"
    description: "list the schedules of a return"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["schedule_code?", "limit?", "offset?"]
    output: ReturnSchedule[]
    side_effects: []
  - method: GET
    path: "/mft/schedules/{id}"
    description: "read one schedule with its declared gallons total and its line count"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: []
    output: ReturnSchedule
    side_effects: []
  - method: POST
    path: "/mft/schedules/{id}/lines"
    description: "add a transaction line to a schedule of a DRAFT return"
    roles: [LicenseeAgent, ReturnsExaminer]
    code: 201
    input: [counterparty_licensee_id, transaction_type, gallons, document_date, bill_of_lading_number, "exemption_certificate_id?"]
    output: ScheduleLine
    side_effects:
      - "parent schedule line_count += 1; the schedule's declared total_gallons is deliberately NOT adjusted (the declared-vs-derived reconciliation happens once, at filing); schedule.version += 1"
  - method: GET
    path: "/mft/schedules/{id}/lines"
    description: "list the lines of a schedule"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: ScheduleLine[]
    side_effects: []
  - method: GET
    path: "/mft/schedule-lines/{id}"
    description: "read one schedule line"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: []
    output: ScheduleLine
    side_effects: []
  - method: GET
    path: "/mft/schedule-lines"
    description: "list schedule lines across schedules, filtered by schedule, counterparty or certificate"
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["schedule_id?", "counterparty_licensee_id?", "exemption_certificate_id?", "transaction_type?", "limit?", "offset?"]
    output: ScheduleLine[]
    side_effects: []
  - method: POST
    path: "/mft/returns/{id}/file"
    description: "file a DRAFT return; computes the tax, then interest, then penalty in that pinned order and posts the ledger rows"
    roles: [LicenseeAgent, ReturnsExaminer]
    code: 200
    input: [attest_name]
    output: MonthlyReturn
    side_effects:
      - "filing_status := FILED; filed_at := logical clock; attest_name recorded"
      - "calculations.monthly_return_tax_due then calculations.return_penalty_and_interest set taxable_gallons_total, tax_due_cents, days_late, interest_cents, penalty_cents, total_remittance_cents"
      - "LedgerEntry(RETURN_TAX, +tax_due_cents), plus (INTEREST, +interest_cents) and (PENALTY, +penalty_cents) when non-zero; licensee.balance_cents re-derived"
      - "licensee.effective_taxable_gallons_ytd, avg_monthly_tax_liability_cents, required_bond_cents and bond_deficiency_cents re-derived; late_filing_count += 1 when days_late >= 1 and amends_return_id == null"
      - "when this return amends another: the amended row := SUPERSEDED and a RETURN_TAX_ADJUSTMENT ledger row for amendment_delta_cents is appended"
  - method: POST
    path: "/mft/returns/{id}/amendments"
    description: "open a DRAFT amendment of a FILED return; the original stays FILED until the amendment is itself filed"
    roles: [LicenseeAgent, ReturnsExaminer]
    code: 201
    input: [expected_return_version, reason]
    output: MonthlyReturn
    side_effects:
      - "new DRAFT MonthlyReturn with amends_return_id := {id}, amendment_sequence := amended.amendment_sequence + 1, same licensee_id and period_month"
      - "amended.amendment_count += 1; amended.version += 1"
  # ---- cross-matching --------------------------------------------------------------
  - method: POST
    path: "/mft/cross-match-runs"
    description: "run supplier-to-distributor schedule cross-matching for a closed period; creates one MatchDiscrepancy per out-of-tolerance cell"
    roles: [ReturnsExaminer, TaxSupervisor]
    code: 201
    input: [period_month, "tolerance_gallons?"]
    output: CrossMatchRun
    side_effects:
      - "calculations.cross_match_variance enumerates cells in created_at order and creates MatchDiscrepancy rows"
      - "run counters set; each FILED return of the period moves to MATCH_CLEAN or MATCH_VARIANCE"
      - "for every created discrepancy: the distributor licensee's open_discrepancy_count += 1, and for direction == UNREPORTED_BY_PURCHASER its unreported_gallons_total += variance_gallons (an auto-escalated discrepancy is excluded from open_discrepancy_count)"
      - "cells at or above AUTO_ESCALATION_GALLONS auto-escalate (creating an AuditCase and holding the subject's refunds) unless an overlapping non-CLOSED case exists, in which case escalation_skipped_count += 1"
  - method: GET
    path: "/mft/cross-match-runs/{id}"
    description: "read one cross-match run with its conserved gallons counters"
    roles: [ReturnsExaminer, TaxSupervisor, AuditManager]
    code: 200
    input: []
    output: CrossMatchRun
    side_effects: []
  - method: GET
    path: "/mft/cross-match-runs"
    description: "list cross-match runs"
    roles: [ReturnsExaminer, TaxSupervisor, AuditManager]
    code: 200
    input: ["period_month?", "run_status?", "limit?", "offset?"]
    output: CrossMatchRun[]
    side_effects: []
  - method: GET
    path: "/mft/discrepancies/{id}"
    description: "read one cross-match discrepancy"
    roles: [ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: []
    output: MatchDiscrepancy
    side_effects: []
  - method: GET
    path: "/mft/discrepancies"
    description: "list discrepancies by run, by either side of the cell, or by the returns they were derived from"
    roles: [ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["run_id?", "supplier_licensee_id?", "distributor_licensee_id?", "supplier_return_id?", "distributor_return_id?", "product_code?", "status?", "direction?", "limit?", "offset?"]
    output: MatchDiscrepancy[]
    side_effects: []
  - method: POST
    path: "/mft/discrepancies/{id}/inquiries"
    description: "send an inquiry round to the purchaser; bounded by MAX_INQUIRY_ROUNDS"
    roles: [ReturnsExaminer]
    code: 200
    input: [question, response_due_date]
    output: MatchDiscrepancy
    side_effects:
      - "status := INQUIRY_SENT; inquiry_round += 1; last_question and response_due_date recorded"
  - method: POST
    path: "/mft/discrepancies/{id}/responses"
    description: "the purchaser's written explanation of the variance"
    roles: [LicenseeAgent]
    code: 200
    input: [explanation, "referenced_return_id?"]
    output: MatchDiscrepancy
    side_effects:
      - "status := RESPONSE_RECEIVED; last_explanation recorded"
  - method: POST
    path: "/mft/discrepancies/{id}/resolve"
    description: "three-way disposition of a discrepancy: EXPLAINED, WRITTEN_OFF or ESCALATE_TO_AUDIT, each with a different side-effect set"
    roles: [ReturnsExaminer]
    code: 200
    input: [resolution, "write_off_reason?"]
    output: MatchDiscrepancy
    side_effects:
      - "EXPLAINED: status := RESOLVED_EXPLAINED; the run's gallons counters are untouched"
      - "WRITTEN_OFF: status := WRITTEN_OFF; run.unreported_gallons_total -= variance and run.written_off_gallons_total += variance so gross_unreported_gallons_total is conserved"
      - "ESCALATE_TO_AUDIT: status := ESCALATED_TO_AUDIT, an AuditCase is created, subject open_audit_count += 1 and the subject's SUBMITTED/REVIEWED RefundClaims move to HELD"
      - "in all three cases: distributor open_discrepancy_count -= 1 and the distributor's return may move to MATCH_RESOLVED"
  # ---- refunds ---------------------------------------------------------------------
  - method: POST
    path: "/mft/refund-claims"
    description: "file a refund claim for tax-paid gallons used off-road, in power take-off equipment, in refrigeration units, or exported"
    roles: [LicenseeAgent, ReturnsExaminer]
    code: 201
    input: [licensee_id, claim_type, period_month, claimed_gallons, "equipment_class?"]
    output: RefundClaim
    side_effects:
      - "calculations.refund_allowable_gallons sets allowable_gallons and refund_amount_cents against the period's remaining tax-paid pool"
      - "status := SUBMITTED"
  - method: GET
    path: "/mft/refund-claims/{id}"
    description: "read one refund claim"
    roles: [ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: []
    output: RefundClaim
    side_effects: []
  - method: GET
    path: "/mft/refund-claims"
    description: "list refund claims"
    roles: [ReturnsExaminer, TaxSupervisor, AuditManager, LicenseeAgent]
    code: 200
    input: ["licensee_id?", "claim_type?", "period_month?", "status?", "limit?", "offset?"]
    output: RefundClaim[]
    side_effects: []
  - method: POST
    path: "/mft/refund-claims/{id}/review"
    description: "examiner review recording a recommendation; the reviewer is then barred from deciding the claim"
    roles: [ReturnsExaminer]
    code: 200
    input: [recommendation, "recommended_gallons?"]
    output: RefundClaim
    side_effects:
      - "status := REVIEWED; recommendation and recommended_gallons recorded; reviewer_user_id := acting X-User-ID"
  - method: POST
    path: "/mft/refund-claims/{id}/decide"
    description: "supervisor decision fork: APPROVED, PARTIALLY_APPROVED (which recomputes the money from recommended_gallons) or DENIED"
    roles: [TaxSupervisor]
    code: 200
    input: [decision]
    output: RefundClaim
    side_effects:
      - "status := APPROVED | PARTIALLY_APPROVED | DENIED; decider_user_id := acting X-User-ID"
      - "PARTIALLY_APPROVED: allowable_gallons := recommended_gallons and refund_amount_cents recomputed, then re-checked against MIN_REFUND_CENTS"
      - "DENIED: allowable_gallons := 0.00, refund_amount_cents := 0 and the gallons return to the period's pool"
  - method: POST
    path: "/mft/refund-claims/{id}/pay"
    description: "pay an approved claim; posts the negative REFUND ledger row"
    roles: [TaxSupervisor]
    code: 200
    input: [payment_reference]
    output: RefundClaim
    side_effects:
      - "status := PAID; payment_reference recorded"
      - "LedgerEntry(REFUND, -refund_amount_cents) appended; licensee.balance_cents re-derived"
  # ---- roadside enforcement --------------------------------------------------------
  - method: POST
    path: "/mft/roadside-inspections"
    description: "record a roadside dyed-fuel inspection; a POSITIVE dye test assesses the penalty and starts the four-hop enforcement cascade"
    roles: [FieldInspector]
    code: 201
    input: [inspected_licensee_id, inspection_date, dye_test_result, gallons_in_tank, vehicle_identifier, "location_description?"]
    output: RoadsideInspection
    side_effects:
      - "NEGATIVE: status stays RECORDED and penalty_cents := 0"
      - "POSITIVE: prior_positive_count frozen, penalty_cents := calculations.dyed_fuel_penalty, status := PENALTY_ASSESSED, PENALTY ledger row appended, dyed_violation_count += 1"
      - "POSITIVE reaching DYED_SUSPENSION_THRESHOLD: licensee := SUSPENDED -> required_bond_cents doubled -> SUBMITTED/REVIEWED RefundClaims := HELD"
  - method: GET
    path: "/mft/roadside-inspections/{id}"
    description: "read one roadside inspection"
    roles: [FieldInspector, TaxSupervisor, AuditManager, ReturnsExaminer, LicenseeAgent]
    code: 200
    input: []
    output: RoadsideInspection
    side_effects: []
  - method: GET
    path: "/mft/roadside-inspections"
    description: "list roadside inspections"
    roles: [FieldInspector, TaxSupervisor, AuditManager, ReturnsExaminer, LicenseeAgent]
    code: 200
    input: ["inspected_licensee_id?", "dye_test_result?", "status?", "limit?", "offset?"]
    output: RoadsideInspection[]
    side_effects: []
  - method: POST
    path: "/mft/roadside-inspections/{id}/dismiss"
    description: "dismiss an assessed inspection; reverses the penalty on the ledger without un-suspending the licensee"
    roles: [TaxSupervisor]
    code: 200
    input: [dismissal_reason]
    output: RoadsideInspection
    side_effects:
      - "status := DISMISSED; dismissal_reason recorded"
      - "LedgerEntry(PENALTY_REVERSAL, -penalty_cents) appended; licensee.balance_cents re-derived to its pre-penalty value; dyed_violation_count -= 1"
      - "the licensee's SUSPENDED status and doubled bond requirement are deliberately left in place"
  # ---- audit -----------------------------------------------------------------------
  - method: POST
    path: "/mft/audit-cases"
    description: "open an audit case by risk score, by cross-match referral or by roadside referral; RISK_SCORE selection is gated on AUDIT_SELECTION_THRESHOLD under the chosen variant"
    roles: [AuditManager]
    code: 201
    input: [subject_licensee_id, selection_method, period_start_month, period_end_month, "risk_score_variant?", "source_discrepancy_id?"]
    output: AuditCase
    side_effects:
      - "case_status := OPEN; assessment_status := NONE; selection_score frozen from calculations.licensee_risk_score; opened_by_user_id := acting X-User-ID"
      - "subject open_audit_count += 1; the subject's SUBMITTED/REVIEWED RefundClaims move to HELD with hold_reason OPEN_AUDIT"
  - method: GET
    path: "/mft/audit-cases/{id}"
    description: "read one audit case with both parallel status dimensions"
    roles: [AuditManager, TaxSupervisor, ReturnsExaminer, LicenseeAgent]
    code: 200
    input: []
    output: AuditCase
    side_effects: []
  - method: GET
    path: "/mft/audit-cases"
    description: "list audit cases; source_discrepancy_id finds the case a cross-match escalation created"
    roles: [AuditManager, TaxSupervisor, ReturnsExaminer, LicenseeAgent]
    code: 200
    input: ["subject_licensee_id?", "case_status?", "assessment_status?", "source_discrepancy_id?", "selection_method?", "limit?", "offset?"]
    output: AuditCase[]
    side_effects: []
  - method: POST
    path: "/mft/audit-cases/{id}/advance"
    description: "move the case dimension: OPEN -> FIELDWORK -> PRELIM_FINDINGS -> TAXPAYER_RESPONSE -> FIELDWORK (bounded cycle) or PRELIM_FINDINGS -> CLOSED"
    roles: [AuditManager]
    code: 200
    input: [to_status]
    output: AuditCase
    side_effects:
      - "case_status := to_status; response_rounds += 1 on the TAXPAYER_RESPONSE -> FIELDWORK cycle edge"
      - "to_status == CLOSED: subject open_audit_count -= 1 and, at zero, HELD RefundClaims with hold_reason OPEN_AUDIT revert to status_before_hold"
  - method: POST
    path: "/mft/audit-cases/{id}/assessments"
    description: "issue the deficiency assessment; the penalty rate depends on the evasion indicator and interest runs from the period's original due date to the logical clock"
    roles: [TaxSupervisor]
    code: 201
    input: [additional_tax_cents, evasion_indicator]
    output: AuditCase
    side_effects:
      - "calculations.assessment_amounts sets assessment_penalty_cents, assessment_interest_cents, assessed_total_cents; assessment_status := ISSUED; assessed_by_user_id := acting X-User-ID"
      - "LedgerEntry(ASSESSMENT, +assessed_total_cents) appended; licensee.balance_cents re-derived"
  - method: POST
    path: "/mft/audit-cases/{id}/abate"
    description: "abate an issued or protested assessment in full; the compensating ledger row restores the pre-assessment balance exactly"
    roles: [TaxSupervisor]
    code: 200
    input: [abatement_reason]
    output: AuditCase
    side_effects:
      - "assessment_status := ABATED; abatement_reason recorded"
      - "LedgerEntry(ABATEMENT, -assessed_total_cents) appended; licensee.balance_cents re-derived to its pre-assessment value; both ledger rows are retained"
  - method: POST
    path: "/mft/audit-cases/{id}/protest"
    description: "the audited licensee protests the assessment; the ledger is deliberately left untouched"
    roles: [LicenseeAgent]
    code: 200
    input: [protest_grounds]
    output: AuditCase
    side_effects:
      - "assessment_status := PROTESTED; protest_grounds recorded"
  - method: POST
    path: "/mft/audit-cases/{id}/finalize"
    description: "make an issued or protested assessment final and collectible"
    roles: [TaxSupervisor]
    code: 200
    input: []
    output: AuditCase
    side_effects:
      - "assessment_status := FINAL; the ledger is unchanged"
  # ---- test-driving surface --------------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock, which every due-date, days-late, certificate-window, interest and period-closed rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandated startup default); the server never falls back to real wall-clock time."
    roles: [LicensingOfficer, ReturnsExaminer, TaxSupervisor, AuditManager, FieldInspector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "the logical clock is set; no persisted entity is modified"

# =====================================================================================
# 1.6 Error Code Catalog (every id below is produced by at least one §1.4 rule and is
#     reachable through at least one §1.5 endpoint)
# =====================================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role header present and one of the six declared roles; X-User-ID header present and non-empty"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role appears in the endpoint's roles list"
  - id: ERR_LICENSEE_SCOPE_VIOLATION
    http: 403
    condition: "when the acting role is LicenseeAgent, X-User-ID must equal the licensee_id that owns the addressed resource (Licensee.id itself, MonthlyReturn.licensee_id, ReturnSchedule -> return.licensee_id, ScheduleLine -> schedule -> return.licensee_id, RefundClaim.licensee_id, MatchDiscrepancy.distributor_licensee_id, BondInstrument.licensee_id); list endpoints are silently narrowed to the agent's own licensee_id instead of erroring"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "body/query schema: required fields present, types correct, enum members legal, numeric constraints (gross_gallons > 0, net_gallons > 0 and <= gross_gallons, claimed_gallons > 0, amount_cents > 0, additional_tax_cents >= 0), pattern constraints (period_month ^[0-9]{4}-(0[1-9]|1[0-2])$, destination_state ^[A-Z]{2}$, ISO 8601 timestamps), and conditional requirements (equipment_class required iff claim_type == PTO; evasion_indicator required on assessment issuance)"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit is an integer in [1,100] and offset is an integer >= 0"
  - id: ERR_LICENSEE_NOT_FOUND
    http: 404
    condition: "{id} in /mft/licensees/{id}/... resolves to a Licensee | ALSO: body FKs naming a Licensee resolve: licensee_id, parent_licensee_id, purchaser_licensee_id, position_holder_licensee_id, counterparty_licensee_id, inspected_licensee_id, subject_licensee_id"
  - id: ERR_BOND_NOT_FOUND
    http: 404
    condition: "{id} in /mft/bonds/{id}/... resolves to a BondInstrument"
  - id: ERR_TERMINAL_NOT_FOUND
    http: 404
    condition: "{id} in /mft/terminals/{id} resolves to a Terminal | ALSO: body terminal_id resolves to a Terminal"
  - id: ERR_CERTIFICATE_NOT_FOUND
    http: 404
    condition: "{id} in /mft/exemption-certificates/{id}/... resolves to an ExemptionCertificate | ALSO: body exemption_certificate_id, when not null, resolves to an ExemptionCertificate"
  - id: ERR_RACK_REMOVAL_NOT_FOUND
    http: 404
    condition: "{id} in /mft/rack-removals/{id} resolves to a RackRemoval"
  - id: ERR_RETURN_NOT_FOUND
    http: 404
    condition: "{id} in /mft/returns/{id}/... resolves to a MonthlyReturn"
  - id: ERR_SCHEDULE_NOT_FOUND
    http: 404
    condition: "{id} in /mft/schedules/{id}/... resolves to a ReturnSchedule"
  - id: ERR_SCHEDULE_LINE_NOT_FOUND
    http: 404
    condition: "{id} in /mft/schedule-lines/{id} resolves to a ScheduleLine"
  - id: ERR_CROSS_MATCH_RUN_NOT_FOUND
    http: 404
    condition: "{id} in /mft/cross-match-runs/{id} resolves to a CrossMatchRun"
  - id: ERR_DISCREPANCY_NOT_FOUND
    http: 404
    condition: "{id} in /mft/discrepancies/{id}/... resolves to a MatchDiscrepancy | ALSO: body source_discrepancy_id, when not null, resolves to a MatchDiscrepancy"
  - id: ERR_REFUND_CLAIM_NOT_FOUND
    http: 404
    condition: "{id} in /mft/refund-claims/{id}/... resolves to a RefundClaim"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "{id} in /mft/roadside-inspections/{id}/... resolves to a RoadsideInspection"
  - id: ERR_AUDIT_CASE_NOT_FOUND
    http: 404
    condition: "{id} in /mft/audit-cases/{id}/... resolves to an AuditCase"
  - id: ERR_STALE_LICENSEE_VERSION
    http: 412
    condition: "expected_licensee_version equals the addressed Licensee's current version"
  - id: ERR_STALE_RETURN_VERSION
    http: 412
    condition: "expected_return_version equals the amended MonthlyReturn's current version"
  - id: ERR_LICENSEE_REVOKED
    http: 409
    condition: "the addressed Licensee is not REVOKED (a REVOKED licensee accepts no new bonds, returns, schedules, refund claims or audit cases)"
  - id: ERR_LICENSEE_STATE_INVALID
    http: 409
    condition: "the transition requested by activate/suspend/revoke is legal from the Licensee's current status (activate only from PENDING_BOND or SUSPENDED, suspend only from ACTIVE, revoke from PENDING_BOND, ACTIVE or SUSPENDED, i.e. from any status the licensee has not already left)"
  - id: ERR_BOND_NOT_ACTIVE
    http: 409
    condition: "the addressed BondInstrument.status == ACTIVE"
  - id: ERR_CERTIFICATE_NOT_ACTIVE
    http: 409
    condition: "the addressed ExemptionCertificate.status == ACTIVE"
  - id: ERR_RETURN_ALREADY_FILED
    http: 409
    condition: "the target MonthlyReturn.filing_status == DRAFT for schedule building and for filing (a FILED or SUPERSEDED return accepts no new schedules, no new lines and cannot be filed again)"
  - id: ERR_RETURN_NOT_FILED
    http: 409
    condition: "the MonthlyReturn being amended has filing_status == FILED"
  - id: ERR_DISCREPANCY_STATE_INVALID
    http: 409
    condition: "the MatchDiscrepancy is in the state the action requires: inquiries from OPEN or RESPONSE_RECEIVED; responses from INQUIRY_SENT; resolve from OPEN, INQUIRY_SENT or RESPONSE_RECEIVED"
  - id: ERR_REFUND_STATE_INVALID
    http: 409
    condition: "the RefundClaim is in the state the action requires: review from SUBMITTED; decide from REVIEWED; pay from APPROVED or PARTIALLY_APPROVED"
  - id: ERR_INSPECTION_NOT_DISMISSIBLE
    http: 409
    condition: "the RoadsideInspection.status == PENALTY_ASSESSED"
  - id: ERR_AUDIT_CASE_STATE_INVALID
    http: 409
    condition: "the AuditCase is in the state the action requires: advance from OPEN, FIELDWORK, PRELIM_FINDINGS or TAXPAYER_RESPONSE and only along a transition the machine declares; assessments from PRELIM_FINDINGS or TAXPAYER_RESPONSE with assessment_status == NONE; abate and protest from assessment_status == ISSUED; finalize from assessment_status IN {ISSUED, PROTESTED}; and no action at all is accepted once case_status == CLOSED"
  - id: ERR_ASSESSMENT_ALREADY_ISSUED
    http: 409
    condition: "assessment_status == NONE when an assessment is issued (one assessment per case; a second issuance is refused rather than replacing the first)"
  - id: ERR_ASSESSMENT_PENDING_DISPOSITION
    http: 409
    condition: "closing a case requires assessment_status IN {NONE, FINAL, ABATED} - an ISSUED or PROTESTED assessment must be finalized or abated first (the only coupling between the two parallel dimensions)"
  - id: ERR_PURCHASER_LICENSE_INVALID
    http: 422
    condition: "the purchaser named on a rack removal has status ACTIVE or SUSPENDED (a PENDING or REVOKED purchaser may not take delivery at a rack at all)"
  - id: ERR_POSITION_HOLDER_INVALID
    http: 422
    condition: "the position holder named on a rack removal is an ACTIVE SUPPLIER"
  - id: ERR_CERTIFICATE_HOLDER_MISMATCH
    http: 422
    condition: "a presented ExemptionCertificate belongs to the purchaser on the transaction (certificate.purchaser_licensee_id == purchaser_licensee_id / counterparty_licensee_id)"
  - id: ERR_CERTIFICATE_NOT_VALID_ON_DATE
    http: 422
    condition: "a presented ExemptionCertificate has status ACTIVE and the transaction date lies inside the closed window [valid_from, valid_to]; re-checked at filing time for every SCH_6_EXEMPT_SALES and SCH_7_EXPORTS line, so a certificate revoked between line entry and filing blocks the filing"
  - id: ERR_EXEMPTION_PRODUCT_MISMATCH
    http: 422
    condition: "product_code is a member of CERT_PRODUCT_SET[certificate.exemption_type] (GOVERNMENT covers GASOLINE and UNDYED_DIESEL only; AGRICULTURE covers UNDYED_DIESEL only)"
  - id: ERR_DYED_FUEL_ON_ROAD_PROHIBITED
    http: 422
    condition: "a SCH_10_DYED_SALES line's counterparty must not be a licensee with retail_channel == HIGHWAY, and a DYED_DIESEL line may never appear on SCH_2_RECEIVED_TAX_UNPAID, SCH_5_DELIVERED_TAX_COLLECTED or SCH_6_EXEMPT_SALES"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "segregation of duties on refunds: the X-User-ID deciding a claim must differ from RefundClaim.reviewer_user_id, and the X-User-ID paying it must differ from RefundClaim.decider_user_id"
  - id: ERR_ASSESSMENT_SEGREGATION_VIOLATION
    http: 422
    condition: "segregation of duties on audits: the X-User-ID issuing an assessment must differ from AuditCase.opened_by_user_id, and the X-User-ID abating an assessment must differ from AuditCase.assessed_by_user_id"
  - id: ERR_REFUND_BLOCKED_BY_AUDIT
    http: 422
    condition: "no AuditCase with subject_licensee_id == claim.licensee_id and case_status != CLOSED exists when a refund claim is decided (an open audit freezes the claimant's money)"
  - id: ERR_DYED_VIOLATION_HOLD
    http: 422
    condition: "a licensee whose dyed_violation_count >= DYED_SUSPENSION_THRESHOLD (2) may not be reinstated until the count is brought back below the threshold by dismissing an inspection"
  - id: ERR_SCHEDULE_PRODUCT_NOT_ALLOWED
    http: 422
    condition: "ReturnSchedule.product_code is legal for the schedule_code (SCH_10_DYED_SALES accepts only DYED_DIESEL; every other schedule_code rejects DYED_DIESEL)"
  - id: ERR_COUNTERPARTY_TYPE_INVALID
    http: 422
    condition: "the counterparty's license_type is legal for the schedule_code: SCH_1_RECEIVED_TAX_PAID and SCH_2_RECEIVED_TAX_UNPAID require a SUPPLIER or DISTRIBUTOR counterparty; SCH_7_EXPORTS requires a counterparty whose mailing_state != HOME_STATE_CODE"
  - id: ERR_SCHEDULE_TOTALS_MISMATCH
    http: 422
    condition: "at filing, every schedule's stored total_gallons equals the exact 2-decimal sum of its ScheduleLine.gallons and its line_count equals the number of those lines"
  - id: ERR_MISSING_REQUIRED_SCHEDULE
    http: 422
    condition: "a return may not be filed with zero schedules, and a return whose licensee is a SUPPLIER must carry at least one SCH_5_DELIVERED_TAX_COLLECTED schedule"
  - id: ERR_AMENDMENT_TARGET_INVALID
    http: 422
    condition: "an amendment target must be the newest non-SUPERSEDED return of its (licensee_id, period_month) chain and must not itself be an amendment that has already been amended"
  - id: ERR_DISCREPANCY_SOURCE_MISMATCH
    http: 422
    condition: "when source_discrepancy_id is supplied, selection_method must be CROSS_MATCH_ESCALATION, the discrepancy's escalation subject (distributor_licensee_id when direction == UNREPORTED_BY_PURCHASER, else supplier_licensee_id) must equal subject_licensee_id, and the discrepancy's status must be one of {OPEN, INQUIRY_SENT, RESPONSE_RECEIVED} - an already ESCALATED_TO_AUDIT discrepancy cannot seed a second case"
  - id: ERR_RESPONSE_RETURN_MISMATCH
    http: 422
    condition: "an explanation may only reference a period the discrepancy actually covers: a response's referenced_return_id, when supplied, must belong to the discrepancy's distributor_licensee_id"
  - id: ERR_PERIOD_NOT_CLOSED
    http: 422
    condition: "a cross-match run's period_month must be strictly earlier than the logical clock's own month (an in-flight period is not matchable)"
  - id: ERR_CERTIFICATE_PERIOD_OVERLAP
    http: 422
    condition: "no other ACTIVE ExemptionCertificate for the same (purchaser_licensee_id, exemption_type) may have a [valid_from, valid_to] window that touches or overlaps the requested one (closed intervals: shared endpoints collide)"
  - id: ERR_AUDIT_PERIOD_OVERLAP
    http: 422
    condition: "no other non-CLOSED AuditCase for the same subject_licensee_id may have a [period_start_month, period_end_month] window that overlaps the requested one after each side is widened by AUDIT_PERIOD_BUFFER_MONTHS on both ends (half-open month semantics: a one-month gap still collides)"
  - id: ERR_DATE_RANGE_INVALID
    http: 422
    condition: "period_start_month <= period_end_month, valid_from <= valid_to, and neither an inspection_date nor a bond effective_date may lie after the logical clock"
  - id: ERR_REFUND_PERIOD_NOT_FILED
    http: 422
    condition: "a refund claim's period_month must already have a FILED (non-SUPERSEDED) MonthlyReturn for the claimant"
  - id: ERR_DUPLICATE_FEIN
    http: 409
    condition: "Licensee.fein is unique across all licensees"
  - id: ERR_DUPLICATE_TCN
    http: 409
    condition: "Terminal.terminal_control_number is unique across all terminals"
  - id: ERR_DUPLICATE_BOL
    http: 409
    condition: "bill_of_lading_number is unique per terminal_id on rack removals, and unique per (schedule.return_id, counterparty_licensee_id) on schedule lines"
  - id: ERR_DUPLICATE_RETURN_PERIOD
    http: 409
    condition: "at most one non-SUPERSEDED MonthlyReturn exists per (licensee_id, period_month)"
  - id: ERR_DUPLICATE_SCHEDULE
    http: 409
    condition: "at most one ReturnSchedule exists per (return_id, schedule_code, product_code)"
  - id: ERR_DUPLICATE_MATCH_RUN
    http: 409
    condition: "at most one CrossMatchRun with run_status != FAILED exists per period_month"
  - id: ERR_INQUIRY_ROUND_LIMIT
    http: 422
    condition: "MatchDiscrepancy.inquiry_round < MAX_INQUIRY_ROUNDS (3) before a new inquiry is sent"
  - id: ERR_AUDIT_ROUND_LIMIT
    http: 422
    condition: "AuditCase.response_rounds < MAX_AUDIT_RESPONSE_ROUNDS (2) before the case may cycle back from TAXPAYER_RESPONSE into FIELDWORK"
  - id: ERR_RISK_SCORE_BELOW_THRESHOLD
    http: 422
    condition: "when selection_method == RISK_SCORE, the subject's risk score under the requested risk_score_variant must be >= AUDIT_SELECTION_THRESHOLD (60)"
  - id: ERR_WRITE_OFF_NOT_PERMITTED
    http: 422
    condition: "a resolve with resolution == WRITTEN_OFF must supply write_off_reason and is permitted only when abs(variance_gallons) < AUTO_ESCALATION_GALLONS (10000.00); a variance at or above the auto-escalation threshold must be EXPLAINED or ESCALATE_TO_AUDIT, never written off"
  - id: ERR_DECISION_AMOUNT_INVALID
    http: 422
    condition: "a decide with decision == PARTIALLY_APPROVED is legal only when the review recorded recommendation == PARTIAL with a non-null recommended_gallons in (0, allowable_gallons]; the decider supplies no gallons of its own"
  - id: ERR_EQUIPMENT_CLASS_INVALID
    http: 422
    condition: "REFRIGERATION_UNIT and PTO claims must not name an equipment_class outside PTO_ALLOCATION_PCT, and claimed_gallons on a REFRIGERATION_UNIT claim must not exceed REEFER_MONTHLY_CAP_GALLONS by more than a factor of 10 (an obvious data-entry error is rejected rather than capped)"
  - id: ERR_DUPLICATE_CERTIFICATE_NUMBER
    http: 409
    condition: "ExemptionCertificate.document_number is unique across all certificates"
  - id: ERR_INVALID_PARENT_LICENSEE
    http: 422
    condition: "parent_licensee_id, when supplied, names a licensee with license_type == SUPPLIER, status == ACTIVE and parent_licensee_id == null (consolidated groups are exactly one level deep and a licensee may not be its own parent)"
  - id: ERR_PURCHASER_BOND_DEFICIENT
    http: 422
    condition: "an in-state rack removal to a SUPPLIER or DISTRIBUTOR purchaser (i.e. one that would defer imposition) is refused when that purchaser's bond_deficiency_cents > 0"
  - id: ERR_BOND_RELEASE_WOULD_CREATE_DEFICIENCY
    http: 422
    condition: "releasing a bond must not leave the licensee with posted_bond_cents < required_bond_cents while its status is ACTIVE"
  - id: ERR_BOND_DEFICIENCY_BLOCKS_ACTIVATION
    http: 422
    condition: "a licensee may not be activated while bond_deficiency_cents > 0"
  - id: ERR_REFUND_EXCEEDS_TAX_PAID
    http: 422
    condition: "per calculations.refund_allowable_gallons STEP 2, the claim's basis must not exceed the period's remaining tax-paid pool"
  - id: ERR_REFUND_BELOW_MINIMUM
    http: 422
    condition: "refund_amount_cents (or, for PARTIALLY_APPROVED, the amount recomputed on the review's recommended_gallons) must be >= MIN_REFUND_CENTS (2000, inclusive)"
  - id: ERR_ABATEMENT_AMOUNT_INVALID
    http: 422
    condition: "an abatement always reverses the case's assessed_total_cents in full (partial abatement is not offered), so it is refused when the licensee's balance_cents is below assessed_total_cents - a payment has already retired part of the assessed liability and the full reversal would push the balance below its pre-assessment value and mint a credit"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "a payment's amount_cents must be > 0 and must not exceed the licensee's current balance_cents (no credit balances are created through payments)"

# =====================================================================================
# 1.7 RBAC Matrix (role_model: segregation_of_duties)
# =====================================================================================
roles:
  - name: LicenseeAgent
    description: "the licensed taxpayer acting for itself: reports rack removals, builds and files returns, answers cross-match inquiries, claims refunds and protests assessments. Sees only its own data."
    identity: "entity_backed:Licensee"
    exclusive_operations:
      - "POST /mft/discrepancies/{id}/responses (only the purchaser side may explain its own variance)"
      - "POST /mft/audit-cases/{id}/protest (only the audited licensee may protest)"
    shared_operations:
      - "POST /mft/rack-removals, POST /mft/returns, POST /mft/returns/{id}/schedules, POST /mft/schedules/{id}/lines, POST /mft/returns/{id}/file, POST /mft/returns/{id}/amendments, POST /mft/refund-claims (shared with ReturnsExaminer, who may key transactions on a licensee's behalf)"
      - "all GET reads of its own licensee, bonds, bond-status, ledger, terminals, certificates, rack removals, returns, schedules, schedule lines, discrepancies, refund claims, inspections and audit cases; list endpoints are narrowed to X-User-ID rather than rejected"
    note: "X-User-ID equals a Licensee.id. Any attempt to address another licensee's resource fails with ERR_LICENSEE_SCOPE_VIOLATION (priority 25) before any state, business or fiscal check runs."
  - name: LicensingOfficer
    description: "licensing and bonding desk: registers licensees and terminals, issues and revokes exemption certificates, posts and releases surety bonds, and moves the license through PENDING_BOND / ACTIVE / SUSPENDED / REVOKED."
    identity: opaque
    exclusive_operations:
      - "POST /mft/licensees"
      - "POST /mft/licensees/{id}/activate"
      - "POST /mft/licensees/{id}/revoke"
      - "POST /mft/licensees/{id}/bonds"
      - "POST /mft/bonds/{id}/release"
      - "POST /mft/terminals"
      - "POST /mft/exemption-certificates"
      - "POST /mft/exemption-certificates/{id}/revoke"
    shared_operations:
      - "POST /mft/licensees/{id}/suspend (shared with TaxSupervisor)"
      - "POST /_clock/set_current_utc (shared with every operator role)"
      - "GET reads across licensees, bonds, bond-status, ledger entries, terminals, certificates, rack removals, returns, schedules and schedule lines"
  - name: ReturnsExaminer
    description: "returns processing desk: keys and files returns on a licensee's behalf, runs schedule cross-matching, works discrepancies through the inquiry cycle, and reviews refund claims. May never decide or pay a refund it reviewed."
    identity: opaque
    exclusive_operations:
      - "POST /mft/discrepancies/{id}/inquiries"
      - "POST /mft/discrepancies/{id}/resolve"
      - "POST /mft/refund-claims/{id}/review"
    shared_operations:
      - "POST /mft/cross-match-runs (shared with TaxSupervisor)"
      - "POST /mft/rack-removals, POST /mft/returns, POST /mft/returns/{id}/schedules, POST /mft/schedules/{id}/lines, POST /mft/returns/{id}/file, POST /mft/returns/{id}/amendments, POST /mft/refund-claims (shared with LicenseeAgent)"
      - "GET reads across licensees, ledger entries, terminals, certificates, rack removals, returns, schedules, schedule lines, cross-match runs, discrepancies, refund claims, inspections, audit cases and risk profiles"
      - "POST /_clock/set_current_utc"
    note: "reviewer_user_id is stamped from this role's X-User-ID and is then barred from POST /mft/refund-claims/{id}/decide (ERR_SEGREGATION_OF_DUTIES)."
  - name: TaxSupervisor
    description: "money authority: decides and pays refunds, issues, finalizes and abates audit assessments, dismisses roadside penalties, records taxpayer payments and may suspend a license. Never reviews the refunds it decides and never issues an assessment on a case it opened."
    identity: opaque
    exclusive_operations:
      - "POST /mft/refund-claims/{id}/decide"
      - "POST /mft/refund-claims/{id}/pay"
      - "POST /mft/audit-cases/{id}/assessments"
      - "POST /mft/audit-cases/{id}/abate"
      - "POST /mft/audit-cases/{id}/finalize"
      - "POST /mft/roadside-inspections/{id}/dismiss"
      - "POST /mft/licensees/{id}/payments"
    shared_operations:
      - "POST /mft/licensees/{id}/suspend (shared with LicensingOfficer)"
      - "POST /mft/cross-match-runs (shared with ReturnsExaminer)"
      - "GET reads across licensees, bonds, bond-status, ledger entries, terminals, certificates, rack removals, returns, schedules, schedule lines, cross-match runs, discrepancies, refund claims, inspections, audit cases and risk profiles"
      - "POST /_clock/set_current_utc"
    note: "decider_user_id and assessed_by_user_id are stamped from this role's X-User-ID; the pay leg then bars the decider and the abate leg bars the assessor."
  - name: AuditManager
    description: "audit selection and casework: opens cases by risk score or referral and drives the case dimension through fieldwork, findings, taxpayer response and closure. Deliberately has no money authority."
    identity: opaque
    exclusive_operations:
      - "POST /mft/audit-cases"
      - "POST /mft/audit-cases/{id}/advance"
    shared_operations:
      - "GET reads across licensees, bonds, bond-status, ledger entries, terminals, certificates, rack removals, returns, schedules, schedule lines, cross-match runs, discrepancies, refund claims, inspections, audit cases and risk profiles"
      - "POST /_clock/set_current_utc"
    note: "opened_by_user_id is stamped from this role's X-User-ID; that user is then barred from issuing the case's assessment even if it also holds TaxSupervisor."
  - name: FieldInspector
    description: "roadside enforcement: records dyed-fuel inspections in the field. Cannot dismiss its own findings and cannot touch returns, refunds or audits."
    identity: opaque
    exclusive_operations:
      - "POST /mft/roadside-inspections"
    shared_operations:
      - "GET /mft/licensees/{id}, GET /mft/licensees, GET /mft/terminals/{id}, GET /mft/exemption-certificates/{id}, GET /mft/rack-removals/{id}, GET /mft/roadside-inspections/{id}, GET /mft/roadside-inspections"
      - "POST /_clock/set_current_utc"
