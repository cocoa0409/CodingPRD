        claim_type: role_matrix
        grounds:
          - "roles.CustomerSupport"
          - "roles.FleetDispatcher"
          - "roles.RemoteOperator"
          - "roles.SafetyOfficer"
          - "roles.MerchantOperator"
          - "errors.ERR_ROLE_FORBIDDEN"
          - "endpoints[GET /service-zones/{zone_id}]"
        distinguishing_aspect: >-
          Authorisation is declared per endpoint, so holding rights over an entity elsewhere buys nothing
          here: CustomerSupport may read orders but not dispatch them, FleetDispatcher owns the fleet but may
          not retire a segment, RemoteOperator drives missions but may not create their route plans,
          SafetyOfficer owns the health dimension but not the duty dimension, and MerchantOperator is refused
          even on a read of the zone it operates in - while the identical route-plan create from the
          FleetDispatcher succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z"
            - "ServiceZone Z1 PERMITTED with segments S1, S2, S3, S5 APPROVED, Merchant M1 ACTIVE and Robot R1 dispatched onto mission MI1"
            - "order O1 is DISPATCHED at version 2, while the version captured into o_v at creation is 1 and is therefore stale"
            - "the mission version was read into mi_v, so the route-plan payloads below are complete and current"
            - "every triggering payload is well formed and every named row exists, so the role is the only possible cause of a refusal"
            - "GET /service-zones/{zone_id} is declared for PlatformAdmin, FleetDispatcher, RemoteOperator, SafetyOfficer and CustomerSupport only"
