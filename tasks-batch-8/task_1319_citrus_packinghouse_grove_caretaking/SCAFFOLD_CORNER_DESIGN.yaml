          assert:
            - "${v6_e0} == ERR_PAYMENT_AMOUNT_INVALID (400); ${v6_e1} == ERR_INVOICE_OVERPAYMENT (422)"
            - "After 5000: PARTIALLY_PAID, paid_cents 5000, grower balance 15000"
