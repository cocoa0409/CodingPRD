            - { call: "POST /api/breeding-seasons/${s}/end-breeding", payload: {}, as: HerdManager }
            - { call: "POST /api/calf-crops", payload: { breeding_season_id: "${s}", ranch_id: "${ranch_id}", crop_year: 2026, steer_head: 40, heifer_head: 60 }, as: HerdManager, captures: { c: $.data.id } }
          trigger:
            - { call: "POST /api/sale-lots", payload: { calf_crop_id: "${c}", ranch_id: "${ranch_id}", lot_class: "STEER", head_count: 10, base_price_cents_per_cwt: 23000, slide_cents_per_lb: 10, base_weight_lbs: 520, shrink_pct: 0.03, precon_claim: "NONE", freight_cents_per_head: 3000, commission_pct: 0.025 }, as: SalesAgent, as_user_id: "u-sale-1", captures: { err: $.data.error_id } }
