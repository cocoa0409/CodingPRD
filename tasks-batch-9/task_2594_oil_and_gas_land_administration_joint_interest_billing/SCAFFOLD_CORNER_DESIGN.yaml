scaffold_corner_design:

  # ============================================================================
  # Section 1 - Entities (claim-extraction-guide "From Table 1")
  # ============================================================================
  - section: entities
    instances:
      - name: lease_creation_returns_the_declared_system_defaults
        claim_type: creation
        grounds:
          - entities.Lease
          - endpoints.POST_/land-admin/leases
          - entities.Lease.fields.tenure_status
          - entities.Lease.fields.obligation_status
          - entities.Lease.fields.held_acres
        distinguishing_aspect: |
          A POST with every required input returns 201 and the create response already carries the
          system-minted posture fields: tenure_status PRIMARY_TERM, obligation_status COMPLIANT,
          extension_exercised false, committed_acres_total 0.00, held_acres 0.00 and version 1.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-07-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30", extension_option_months: 24, extension_bonus_per_acre_cents: 15000, shut_in_royalty_per_acre_cents: 500, continuous_dev_window_days: 180 }
              as: LandAdministrator
              captures: { lease_id: $.data.id }
          assert:
            - "HTTP 201 with response_type \"object\""
            - "Lease.${lease_id}.lease_number == \"L-001\" and lessor_name == \"Alpha Minerals\""
            - "Lease.${lease_id}.gross_acres == 640.00 and royalty_rate == 0.187500"
            - "Lease.${lease_id}.tenure_status == PRIMARY_TERM"
            - "Lease.${lease_id}.obligation_status == COMPLIANT"
            - "Lease.${lease_id}.extension_exercised == false and extension_bonus_paid_cents == 0"
            - "Lease.${lease_id}.shut_in_payments_made == 0 and shut_in_start_date == null and shut_in_next_due_date == null"
            - "Lease.${lease_id}.last_operation_end_date == null and continuous_dev_deadline == null"
            - "Lease.${lease_id}.committed_acres_total == 0.00 and held_acres == 0.00"
            - "Lease.${lease_id}.version == 1"

      - name: get_well_returns_the_stored_well_with_its_derived_ledger
        claim_type: retrieval
        grounds:
          - endpoints.GET_/land-admin/wells/{well_id}
          - entities.Well.fields.allocation_factor_total
          - entities.Well.fields.plugging_liability_cents
          - entities.Well.fields.billed_to_date_cents
        distinguishing_aspect: |
          GET /land-admin/wells/{well_id} echoes the stored well and its three derived ledger fields;
          for a 9500 ft well with two committed allocations it returns allocation_factor_total
          1.000000, plugging_liability_cents 14900000 and billed_to_date_cents 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Leases L-001 (640.00 acres) and L-002 (320.00 acres)"
            - "Well Sandstone 1H, OIL, 9500 ft, with 480.00 acres from L-001 and 160.00 from L-002, pooling_status POOLED_EFFECTIVE, no interests and no statements yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31" }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 480.00 }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease2_id}", committed_acres: 160.00 }
              as: LandAdministrator
            - call: "POST /land-admin/wells/${well_id}/pooling-effectuation"
              payload: { effective_date: "2026-04-01" }
              as: LandAdministrator
          trigger:
            - call: "GET /land-admin/wells/${well_id}"
              payload: {}
              as: JointInterestAccountant
              as_user_id: "u-jib-1"
          assert:
            - "HTTP 200 with response_type \"object\""
            - "Well.${well_id}.well_name == \"Sandstone 1H\" and api_number == \"42-123-45678\""
            - "Well.${well_id}.product_type == OIL and total_depth_ft == 9500"
            - "Well.${well_id}.well_status == PROPOSED and pooling_status == POOLED_EFFECTIVE"
            - "Well.${well_id}.allocation_factor_total == 1.000000"
            - "Well.${well_id}.plugging_liability_cents == 14900000"
            - "Well.${well_id}.billed_to_date_cents == 0"
            - "Well.${well_id}.consent_working_interest_pct == 0.000000"

      - name: list_leases_returns_a_paginated_envelope_with_total_count
        claim_type: listing
        grounds:
          - endpoints.GET_/land-admin/leases
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three leases on file, GET /land-admin/leases?limit=2&offset=0 returns exactly 2 rows,
          total_count 3 and has_more true; offset=2 returns 1 row with has_more false.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Three leases L-001, L-002 and L-003 created in that order"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-003", lessor_name: "Gamma Minerals", gross_acres: 160.00, royalty_rate: 0.200000, primary_term_end_date: "2028-06-30" }
              as: LandAdministrator
          trigger:
            - call: "GET /land-admin/leases?limit=2&offset=0"
              payload: {}
              as: AuditReviewer
              as_user_id: "u-audit-1"
            - call: "GET /land-admin/leases?limit=2&offset=2"
              payload: {}
              as: AuditReviewer
              as_user_id: "u-audit-1"
          assert:
            - "first call: HTTP 200 with response_type \"array\" and exactly 2 Lease rows in data"
            - "first call: the paginated envelope reports limit == 2, offset == 0, total_count == 3, has_more == true"
            - "second call: exactly 1 Lease row in data with lease_number == \"L-003\""
            - "second call: the paginated envelope reports limit == 2, offset == 2, total_count == 3, has_more == false"

      - name: get_lease_with_an_unknown_id_returns_lease_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/land-admin/leases/{lease_id}
          - validations[priority=30, error_id=ERR_LEASE_NOT_FOUND]
          - errors.ERR_LEASE_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid but unknown lease_id in the path resolves to no Lease, so the read
          returns ERR_LEASE_NOT_FOUND with HTTP 404 rather than an empty object or a 200.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z; one unrelated lease L-001 exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
          trigger:
            - call: "GET /land-admin/leases/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LandAdministrator
          assert:
            - "HTTP 404 with response_type \"error\" and data.error_id == \"ERR_LEASE_NOT_FOUND\""
            - "no Lease row is created or mutated by the call"

      - name: create_lease_missing_required_gross_acres_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_/land-admin/leases
          - entities.Lease.fields.gross_acres
          - validations[priority=25, error_id=ERR_VALIDATION]
        distinguishing_aspect: |
          gross_acres is source input with no default, so omitting it fails the priority-25 required
          field check with ERR_VALIDATION 400 and no Lease row is persisted.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-07-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
          assert:
            - "HTTP 400 with response_type \"error\" and data.error_id == \"ERR_VALIDATION\""
            - "GET /land-admin/leases returns total_count == 0"

      - name: omitted_lease_option_fields_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Lease.fields.extension_option_months
          - entities.Lease.fields.extension_bonus_per_acre_cents
          - entities.Lease.fields.shut_in_royalty_per_acre_cents
          - entities.Lease.fields.continuous_dev_window_days
          - endpoints.POST_/land-admin/leases
        distinguishing_aspect: |
          Creating a lease with only its five required inputs yields extension_option_months 0,
          extension_bonus_per_acre_cents 0, shut_in_royalty_per_acre_cents 0 and
          continuous_dev_window_days 180 - the declared defaults, not nulls.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-07-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-009", lessor_name: "Omega Minerals", gross_acres: 100.00, royalty_rate: 0.125000, primary_term_end_date: "2027-03-31" }
              as: LandAdministrator
              captures: { lease_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Lease.${lease_id}.extension_option_months == 0"
            - "Lease.${lease_id}.extension_bonus_per_acre_cents == 0"
            - "Lease.${lease_id}.shut_in_royalty_per_acre_cents == 0"
            - "Lease.${lease_id}.continuous_dev_window_days == 180"

      - name: omitted_afe_election_terms_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Afe.fields.non_consent_penalty_multiple
          - entities.Afe.fields.minimum_consent_pct
          - endpoints.POST_/land-admin/wells/{well_id}/afes
        distinguishing_aspect: |
          An AFE created without non_consent_penalty_multiple or minimum_consent_pct takes 3.0 and
          0.500000 respectively, and starts ELECTIONS_OPEN with both tallies at 0.000000.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Well Sandstone 1H, OIL, 9500 ft, no allocations or interests needed for AFE creation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_id: $.data.id }
          trigger:
            - call: "POST /land-admin/wells/${well_id}/afes"
              payload: { afe_number: "AFE-900", operation_type: "WORKOVER", estimated_cost_cents: 1500000, cost_class: "OPERATING", election_deadline_date: "2026-08-31" }
              as: LandAdministrator
              captures: { afe_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Afe.${afe_id}.non_consent_penalty_multiple == 3.0"
            - "Afe.${afe_id}.minimum_consent_pct == 0.500000"
            - "Afe.${afe_id}.afe_status == ELECTIONS_OPEN"
            - "Afe.${afe_id}.consent_working_interest_pct == 0.000000 and non_consent_working_interest_pct == 0.000000"

      - name: lease_committed_acres_total_and_held_acres_are_computed_from_allocations
        claim_type: computed_fields
        grounds:
          - entities.Lease.fields.committed_acres_total
          - entities.Lease.fields.held_acres
          - entities.WellLeaseAllocation.fields.allocation_factor
          - calculations.unit_allocation_factor
        distinguishing_aspect: |
          L-001 (640.00 gross acres) committed 480.00 acres to well A and 100.00 acres to well B has
          committed_acres_total 580.00 and held_acres 580.00 = min(640.00, 580.00); each well shows
          allocation_factor 1.000000 on its single allocation because the factor is per well, not per
          lease.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Lease L-001 with 640.00 gross acres"
            - "Wells Sandstone 1H and Sandstone 2H, both OIL, 9500 ft"
            - "480.00 acres of L-001 committed to Sandstone 1H"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_a_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 2H", api_number: "42-123-45679", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_b_id: $.data.id }
            - call: "POST /land-admin/wells/${well_a_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 480.00 }
              as: LandAdministrator
              captures: { alloc_a_id: $.data.id }
          trigger:
            - call: "POST /land-admin/wells/${well_b_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 100.00 }
              as: LandAdministrator
              captures: { alloc_b_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Lease.${lease1_id}.committed_acres_total == 580.00"
            - "Lease.${lease1_id}.held_acres == 580.00"
            - "WellLeaseAllocation.${alloc_a_id}.allocation_factor == 1.000000 and allocation_status == COMMITTED"
            - "WellLeaseAllocation.${alloc_b_id}.allocation_factor == 1.000000 and allocation_status == COMMITTED"
            - "Well.${well_a_id}.allocation_factor_total == 1.000000 and Well.${well_b_id}.allocation_factor_total == 1.000000"
            - "Well.${well_a_id}.pooling_status == POOLED_FORMING and Well.${well_b_id}.pooling_status == POOLED_FORMING"

      - name: well_creation_mints_its_own_status_pooling_and_ledger_fields
        claim_type: system_fields
        grounds:
          - entities.Well.fields.well_status
          - entities.Well.fields.pooling_status
          - entities.Well.fields.first_production_date
          - endpoints.POST_/land-admin/wells
          - calculations.plugging_liability_estimate
        distinguishing_aspect: |
          The create response mints id, created_at, updated_at and version 1 and sets well_status
          PROPOSED, pooling_status UNPOOLED, first_production_date null, shut_in_since null and
          plugging_liability_cents 14900000 - none of which are client inputs.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-07-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_id: $.data.id }
          assert:
            - "HTTP 201 with a server-minted Well.${well_id}.id, created_at and updated_at"
            - "Well.${well_id}.version == 1"
            - "Well.${well_id}.well_status == PROPOSED"
            - "Well.${well_id}.pooling_status == UNPOOLED"
            - "Well.${well_id}.first_production_date == null and shut_in_since == null"
            - "Well.${well_id}.allocation_factor_total == 0.000000 and consent_working_interest_pct == 0.000000 and billed_to_date_cents == 0"
            - "Well.${well_id}.plugging_liability_cents == 14900000"

      - name: create_interest_owner_with_an_undeclared_owner_type_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.InterestOwner.fields.owner_type
          - validations[priority=26, error_id=ERR_VALIDATION]
          - endpoints.POST_/land-admin/interest-owners
        distinguishing_aspect: |
          owner_type is constrained to WORKING_INTEREST_PARTNER, ROYALTY_OWNER and
          OVERRIDING_ROYALTY_OWNER, so "MINERAL_OWNER" fails the priority-26 enum check with
          ERR_VALIDATION 400 and no InterestOwner row is written.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-07-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/interest-owners"
              payload: { owner_name: "Zeta Minerals", owner_type: "MINERAL_OWNER", contact_email: "zeta@example.com" }
              as: LandAdministrator
          assert:
            - "HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "GET /land-admin/interest-owners returns total_count == 0"

      - name: create_lease_with_a_royalty_rate_above_one_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Lease.fields.royalty_rate
          - validations[priority=26, error_id=ERR_VALIDATION]
          - endpoints.POST_/land-admin/leases
        distinguishing_aspect: |
          royalty_rate is a 6-decimal percentage constrained to 0 < royalty_rate < 1, so 1.250000
          fails the priority-26 numeric-range check with ERR_VALIDATION 400 - a different constraint
          shape (numeric range) than the enum case above.
        test_recipe:
          setup:
            - "Empty database; logical clock at 2026-07-10T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-010", lessor_name: "Theta Minerals", gross_acres: 200.00, royalty_rate: 1.250000, primary_term_end_date: "2027-03-31" }
              as: LandAdministrator
          assert:
            - "HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "GET /land-admin/leases returns total_count == 0"

      - name: create_afe_under_an_unknown_well_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Afe.fields.well_id
          - validations[priority=30, error_id=ERR_WELL_NOT_FOUND]
          - endpoints.POST_/land-admin/wells/{well_id}/afes
        distinguishing_aspect: |
          Afe declares parent Well, so a create under an unknown well_id path segment is rejected at
          priority 30 with ERR_WELL_NOT_FOUND 404 before any body validation runs.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z; one unrelated well exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
          trigger:
            - call: "POST /land-admin/wells/00000000-0000-4000-8000-000000000000/afes"
              payload: { afe_number: "AFE-901", operation_type: "DRILL", estimated_cost_cents: 500000, cost_class: "CAPITAL", election_deadline_date: "2026-08-31" }
              as: LandAdministrator
          assert:
            - "HTTP 404 with data.error_id == \"ERR_WELL_NOT_FOUND\""
            - "GET /land-admin/afes returns total_count == 0"

      - name: the_lease_well_allocation_junction_is_discoverable_from_both_sides
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.WellLeaseAllocation
          - endpoints.GET_/land-admin/lease-allocations
        distinguishing_aspect: |
          WellLeaseAllocation is the many-to-many junction between Lease and Well: with L-001 split
          across two wells and Sandstone 1H drawing on two leases, the filtered list returns 2 rows
          for lease_id == L-001 and 2 rows for well_id == Sandstone 1H over the same 3 allocations.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Leases L-001 (640.00 acres) and L-002 (320.00 acres)"
            - "Well Sandstone 1H with 480.00 acres from L-001 and 160.00 from L-002; well Sandstone 2H with 100.00 acres from L-001"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 640.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 320.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31" }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_a_id: $.data.id }
            - call: "POST /land-admin/wells"
