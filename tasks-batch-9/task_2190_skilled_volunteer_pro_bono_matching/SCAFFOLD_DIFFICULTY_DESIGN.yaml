        grounds:
          - validation_priority_conflicts[work_state_beats_availability_hours]
          - validations[priority=23]
          - validations[priority=55]
          - entities.AvailabilityWindow.fields.hours_remaining
          - state_machines.Engagement.work_status.IN_PROGRESS_to_SUBMITTED
        distinguishing_aspect: |
          state (priority 23) versus business_fiscal (priority 55) on POST /engagements/{id}/time-logs.
          The request is engineered so BOTH fire: the engagement is already SUBMITTED (time-logs require
          IN_PROGRESS) and the window has only 41.00 - 30.00 = 11.00 hours left against a 12.00-hour log.
          The response MUST be ERR_INVALID_WORK_STATE (409), never ERR_AVAILABILITY_HOURS_EXCEEDED (422).
          Note the scaffold's own dual_failure narration uses "a log of 30.00 hours", which cannot reach
          either check because TimeLog.hours is constrained to <= 12.00 and would be rejected by P17
          ERR_VALIDATION first; this recipe uses 12.00 hours against an 11.00-hour remainder instead so
          that P17 passes and the P23/P55 pair is genuinely the only contest.
