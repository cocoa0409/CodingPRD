            - "after trigger[0]: SafetySubstantiation.${sub1_id}.status == SUPERSEDED and SafetySubstantiation.${sub2_id}.status == DRAFT with revision_round == 1"
            - "after trigger[0]: ProductListing.${lst_id}.safety_status == UNSUBSTANTIATED and marketable == false, while listing_status is STILL LISTED and listed_product_count is still 1"
