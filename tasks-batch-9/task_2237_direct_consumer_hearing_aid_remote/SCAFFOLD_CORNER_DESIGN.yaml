            - { call: "POST /state-policies", payload: { state_code: "CA", otc_sales_permitted: true, telehealth_fitting_permitted: true, min_age_years: 18, trial_period_days: 45, restocking_fee_mode: "FLAT_PCT", restocking_fee_pct: 0.1, restocking_fee_cap_cents: 0, shipping_refundable: false, referral_validity_days: 180, waiver_required: false, max_loss_damage_claims: 2 }, as: PlatformAdmin, captures: { pol_ca: "$.data.id" } }
            - { call: "POST /providers", payload: { provider_type: "LICENSED_AUDIOLOGIST", npi: "1000000001", full_name: "Aud One", licensed_state_codes: ["CA"], daily_capacity_minutes: 240, buffer_minutes: 10 }, as: PlatformAdmin, captures: { prov_a: "$.data.id" } }
            - { call: "POST /patients", payload: { state_policy_id: "${pol_ca}", email: "cyc@x.test", full_name: "Cyc One", age_years: 70 }, as: CareOpsAgent, captures: { pat_cy: "$.data.id" } }
            - { call: "POST /patients/${pat_cy}/screening-sessions", payload: {}, as: Patient, as_user_id: "${pat_cy}", captures: { scr_cy: "$.data.id" } }
            - { call: "PATCH /screening-sessions/${scr_cy}", payload: { pure_tone_avg_db: 40.0, asymmetry_db: 5.0, self_reported_difficulty_score: 20, speech_in_noise_pct: 70.0, symptom_codes: ["SUDDEN_LOSS"] }, as: Patient, as_user_id: "${pat_cy}" }
            - { call: "POST /screening-sessions/${scr_cy}/submit", payload: {}, as: Patient, as_user_id: "${pat_cy}" }
            - { call: "GET /provider-referrals?patient_id=${pat_cy}", payload: {}, as: CareOpsAgent, captures: { ref_cy: "$.data[0].id" } }
            - { call: "POST /remote-fitting-sessions", payload: { patient_id: "${pat_cy}", session_type: "REFERRAL_EVALUATION", scheduled_start_utc: "2026-08-03T10:00:00Z", scheduled_end_utc: "2026-08-03T10:30:00Z", provider_id: "${prov_a}", provider_referral_id: "${ref_cy}" }, as: Patient, as_user_id: "${pat_cy}", captures: { sess_cy: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:05:00Z" }, as: PlatformAdmin }
            - { call: "POST /remote-fitting-sessions/${sess_cy}/start", payload: {}, as: LicensedAudiologist, as_user_id: "${prov_a}" }
            - { call: "POST /remote-fitting-sessions/${sess_cy}/complete", payload: {}, as: LicensedAudiologist, as_user_id: "${prov_a}" }
          trigger:
            - { call: "POST /provider-referrals/${ref_cy}/determination", payload: { clearance_outcome: "CLEARED", clearance_note: "no pathology" }, as: LicensedAudiologist, as_user_id: "${prov_a}" }
          assert:
            - "HTTP 200"
            - "data.status == \"CLEARED\""
            - "data.triggering_screening_session_id == ${scr_cy}"
            - "data.cleared_finding_count == 1"
            - "GET /provider-referrals/${ref_cy}/cleared-findings returns total_count == 1 and data[0].screening_session_id == ${scr_cy}"
            - "GET /red-flag-findings?cleared_by_referral_id=${ref_cy} returns total_count == 1"
            - "GET /patients/${pat_cy} returns data.status == \"PROVIDER_CLEARED\""
            - "GET /patients/${pat_cy} returns data.open_mandatory_flag_count == 0"

