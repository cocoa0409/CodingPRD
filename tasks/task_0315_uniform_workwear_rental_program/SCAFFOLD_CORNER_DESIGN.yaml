            - call: "POST /garments/${g1}/finish-wash"
              payload: {}
              as: CleanroomTech
            - call: "POST /service-visits/${v}/deliver"
              payload: {}
              as: RouteDriver
              captures: { vdel: $.data.version }
          trigger:
            - call: "POST /service-visits/${v}/reconcile"
              payload: { expected_service_visit_version: "${vcreate}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VISIT_VERSION"
            - "HTTP status == 412"

      - name: declare_damage_three_level_cascade
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Assignment.ASSIGNED_to_DAMAGED
          - state_machines.Garment.ASSIGNED_to_RETIRED
          - calculations.account_outstanding
        excluded_because:
          difficulty_instance: transitive_cascade / declare_loss_to_charge_to_ledger_to_past_due
          rationale: "The N-level charge->ledger->posture cascade is asserted end-to-end by the named §1.8 loss-cascade instance; declare-damage follows the identical chain shape."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: assignment_side_effects_visible_same_request
        claim_type: immediate
        grounds:
          - endpoints[POST /assignments]
          - entities.Garment.fields.lifecycle_status
          - entities.Wearer.fields.assigned_garment_count
        distinguishing_aspect: "Immediately after POST /assignments, a GET on the garment shows lifecycle_status=ASSIGNED and a GET on the wearer shows assigned_garment_count=1 (no lag)."
        test_recipe:
          setup: ["One IN_STOCK garment, one ACTIVE wearer."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "ImmCo", service_day: "MON" }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-IM", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gt: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Im", shirt_size: "M", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { wr: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gt}", tag_code: "T1" }
              as: ProgramAdmin
              captures: { g1: $.data.id }
            - call: "POST /assignments"
              payload: { garment_id: "${g1}", wearer_id: "${wr}" }
              as: AccountManager
          trigger:
            - call: "GET /wearers/${wr}"
              payload: {}
              as: AccountManager
          assert:
            - "Wearer.${wr}.assigned_garment_count == 1"
            - "Garment.${g1}.lifecycle_status == ASSIGNED"
