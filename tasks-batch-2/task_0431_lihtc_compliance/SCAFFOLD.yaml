# =============================================================================
# Scaffold: LIHTC Affordable Housing Compliance (task_0431)
# §1.0 – §1.7 (this file). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  431. LIHTC Affordable Housing Compliance: unit set-aside (income/rent limits by AMI),
  tenant income certification & recert, rent & utility-allowance calculation,
  available-unit & next-available rule, 8609/credit delivery, state HFA inspection (UPCS),
  over-income & student rule, noncompliance/8823

domain_name: lihtc-compliance
api_prefix: ""   # flat topology: every entity is a top-level collection (/projects, /buildings, /units, ...); FKs supplied in bodies and discoverable via filtered-list GETs

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency        # OCC on Building.version for credit recapture races
    - cascading_side_effects        # 8823 findings cascade unit -> building -> project posture
    - dual_variant_calculation      # provisional (forward) vs final (chronological) first-year credit
    - derived_field_reconciliation  # income/rent limits, applicable fraction, qualified basis, credit
  entity_topology: flat             # every entity is a top-level collection; relationships are FK references in bodies, discoverable via filtered-list GETs (no nested URLs)
  state_machine_shape: branching    # Certification, Inspection, Building credit lifecycle fork/revert; Unit li_status cycles
  relationship_patterns:
    - one_to_many                   # Project<-Building<-Unit via FK; Building<-Inspection
    - cross_aggregate               # Lease binds Household and Unit; Finding references Project + Building + Inspection
    - self_referential: false
  role_model: segregation_of_duties # OwnerAgent certifies; StateHFA inspects & issues 8823; an agent cannot self-clear its own finding
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Project
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: area_median_income_cents, type: integer, source: input, description: "Area Median Income for a 4-person household, annual, in cents (baseline for all unit income limits)", constraints: ">= 100000" }
      - { name: minimum_set_aside, type: enum, source: input, description: "Elected minimum set-aside test: TWENTY_FIFTY | FORTY_SIXTY | AVERAGE_INCOME", constraints: "TWENTY_FIFTY | FORTY_SIXTY | AVERAGE_INCOME" }
      - { name: placed_in_service_date, type: datetime, source: input, description: "Date the project was placed in service (start of compliance period)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SET_ASIDE_MET -> CREDIT_PERIOD -> COMPLIANCE_PERIOD (CLOSED terminal)", default: "DRAFT", constraints: "DRAFT | SET_ASIDE_MET | CREDIT_PERIOD | COMPLIANCE_PERIOD | CLOSED" }
      - { name: posture, type: enum, source: computed, description: "COMPLIANT | AT_RISK | NONCOMPLIANT — derived from open findings and set-aside satisfaction across all buildings", default: "COMPLIANT", constraints: "COMPLIANT | AT_RISK | NONCOMPLIANT" }
      - { name: open_finding_count, type: integer, source: computed, description: "Count of unresolved Findings under this project — status IN {OPEN, REPORTED_8823}; CORRECTED findings are excluded. Reporting an 8823 keeps the finding unresolved (count unchanged); only correcting it decrements the count.", default: 0 }

  - name: Building
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; owning project (supplied in create body)" }
      - { name: bin, type: string, source: input, description: "Building Identification Number (unique within project)" }
      - { name: eligible_basis_cents, type: integer, source: input, description: "Depreciable eligible basis for credit, in cents", constraints: ">= 0" }
      - { name: credit_type, type: enum, source: input, description: "NINE_PERCENT | FOUR_PERCENT — applicable credit percentage class", constraints: "NINE_PERCENT | FOUR_PERCENT" }
      - { name: total_residential_units, type: integer, source: input, description: "Count of all residential units in the building", constraints: ">= 1" }
      - { name: total_residential_sqft, type: integer, source: input, description: "Total residential floor space in square feet", constraints: ">= 1" }
      - { name: applicable_fraction, type: number, source: computed, description: "min(unit_fraction, floor_space_fraction) over qualified low-income units, 4 decimals", default: 0 }
      - { name: qualified_basis_cents, type: integer, source: computed, description: "floor(eligible_basis_cents * applicable_fraction)", default: 0 }
      - { name: first_year_fraction, type: number, source: computed, description: "Applicable fraction pinned for credit year 1; provisional at allocation, final at first 8609 issuance", default: 0 }
      - { name: annual_credit_cents, type: integer, source: computed, description: "floor(qualified_basis_cents * credit_bp / 10000) using first_year_fraction in year 1", default: 0 }
      - { name: credit_status, type: enum, source: system, description: "PRE_ALLOCATION -> PROVISIONAL_8609 -> FINAL_8609 (RECAPTURED terminal); branch back PROVISIONAL_8609 on revoke", default: "PRE_ALLOCATION", constraints: "PRE_ALLOCATION | PROVISIONAL_8609 | FINAL_8609 | RECAPTURED" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id; owning building (supplied in create body)" }
      - { name: unit_number, type: string, source: input, description: "Unit label (unique within building)" }
      - { name: bedroom_count, type: integer, source: input, description: "Number of bedrooms; 0 = studio", constraints: "0 <= bedroom_count <= 3" }
      - { name: sqft, type: integer, source: input, description: "Unit floor space in square feet", constraints: ">= 1" }
      - { name: utility_allowance_cents, type: integer, source: input, description: "Monthly utility allowance for this unit, in cents", constraints: ">= 0" }
      - { name: ami_designation, type: enum, source: input, description: "Targeted AMI band: AMI_40 | AMI_50 | AMI_60 | AMI_80 | MARKET. MARKET units are never low-income.", constraints: "AMI_40 | AMI_50 | AMI_60 | AMI_80 | MARKET" }
      - { name: income_limit_cents, type: integer, source: computed, description: "Annual income limit for ami_designation at this bedroom_count; floor(AMI * pct * hh_factor)" }
      - { name: gross_rent_ceiling_cents, type: integer, source: computed, description: "floor(income_limit_cents * 0.30 / 12) monthly gross rent ceiling" }
      - { name: net_max_rent_cents, type: integer, source: computed, description: "gross_rent_ceiling_cents - utility_allowance_cents (monthly net rent ceiling)" }
      - { name: li_status, type: enum, source: system, description: "VACANT_NEVER_OCCUPIED -> QUALIFIED <-> OVER_INCOME -> DISQUALIFIED; MARKET units are MARKET_RENTED. Cycle QUALIFIED<->OVER_INCOME via recert/available-unit.", default: "VACANT_NEVER_OCCUPIED", constraints: "VACANT_NEVER_OCCUPIED | QUALIFIED | OVER_INCOME | DISQUALIFIED | MARKET_RENTED" }
      - { name: is_low_income_counted, type: boolean, source: computed, description: "true when li_status in {QUALIFIED, OVER_INCOME}; drives applicable_fraction numerator", default: false }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project the household applies within (supplied in create body)" }
      - { name: head_name, type: string, source: input, description: "Head of household name" }
      - { name: household_size, type: integer, source: input, description: "Number of members", constraints: ">= 1" }
      - { name: all_full_time_students, type: boolean, source: input, description: "true if every member is a full-time student" }
      - { name: student_exception, type: enum, source: input, description: "Exception that rescues an all-student household: NONE | TANF | JOB_TRAINING | SINGLE_PARENT | MARRIED_JOINT_FILER | FORMER_FOSTER", default: "NONE", constraints: "NONE | TANF | JOB_TRAINING | SINGLE_PARENT | MARRIED_JOINT_FILER | FORMER_FOSTER" }
      - { name: student_eligible, type: boolean, source: computed, description: "false only when all_full_time_students=true AND student_exception=NONE", default: true }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; certified household (supplied in create body)" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; unit the certification is for (supplied in create body)" }
      - { name: cert_type, type: enum, source: input, description: "INITIAL (move-in qualification) | RECERT (annual recertification)", constraints: "INITIAL | RECERT" }
      - { name: annual_income_cents, type: integer, source: input, description: "Certified annual household income in cents", constraints: ">= 0" }
      - { name: effective_date, type: datetime, source: input, description: "Certification effective date" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED / REJECTED; SUBMITTED->DRAFT on revise", default: "DRAFT", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED" }
      - { name: over_income_threshold_cents, type: integer, source: computed, description: "floor(unit.income_limit_cents * 1.40); recerts above this flip the unit OVER_INCOME" }
      - { name: is_over_income, type: boolean, source: computed, description: "true when cert_type=RECERT AND annual_income_cents > over_income_threshold_cents", default: false }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id; leasing household (supplied in lease body)" }
      - { name: unit_id, type: string, source: system, description: "FK -> Unit.id; leased unit (from path)" }
      - { name: monthly_rent_cents, type: integer, source: input, description: "Contract monthly rent in cents (tenant-paid portion)", constraints: ">= 0" }
      - { name: rent_start_date, type: datetime, source: input, description: "Lease occupancy start (inclusive). Occupancy interval is half-open [rent_start_date, rent_end_date)." }
      - { name: rent_end_date, type: datetime, source: input, description: "Lease occupancy end (exclusive). A back-to-back lease starting exactly at a prior lease's rent_end_date does NOT overlap (half-open, zero-buffer)." }
      - { name: status, type: enum, source: system, description: "ACTIVE on creation; a Lease is an append-only occupancy record with no termination action in this version", default: "ACTIVE", constraints: "ACTIVE" }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: input, description: "FK -> Building.id; inspected building (supplied in create body)" }
      - { name: window_start, type: datetime, source: input, description: "Inspection window start (inclusive). Inspection window is the CLOSED interval [window_start, window_end] plus a mandatory 7-day separation buffer between any two inspections on the same building." }
      - { name: window_end, type: datetime, source: input, description: "Inspection window end (inclusive). Closed interval; a new window must start at least INSPECTION_BUFFER_DAYS (7) after a prior window_end on the same building." }
      - { name: inspected_on, type: datetime, source: input, description: "Inspection date" }
      - { name: deduction_points, type: array, source: input, description: "Array of integer deduction points for each deficiency found (UPCS scoring)" }
      - { name: has_exigent_health_safety, type: boolean, source: input, description: "true if an exigent health & safety (life-threatening) deficiency was found", default: false }
      - { name: score, type: integer, source: computed, description: "100 - sum(deduction_points), floored at 0" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL — FAIL if has_exigent_health_safety OR score < PASS_THRESHOLD (60)", default: "PASS" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CONDUCTED -> CLOSED; CONDUCTED->CLOSED only when linked findings resolved", default: "SCHEDULED", constraints: "SCHEDULED | CONDUCTED | CLOSED" }

  - name: Finding
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project the noncompliance is logged against" }
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; building the noncompliance is logged against" }
      - { name: inspection_id, type: string, source: system, description: "FK -> Inspection.id; originating inspection for UPCS_FAIL findings; null for findings raised outside an inspection (e.g., AVAILABLE_UNIT_VIOLATION from a disqualify action)", default: null }
      - { name: category, type: enum, source: input, description: "8823 noncompliance category: OVER_INCOME_UNCURED | STUDENT_VIOLATION | RENT_OVERCHARGE | UPCS_FAIL | SET_ASIDE_FAILURE | AVAILABLE_UNIT_VIOLATION", constraints: "OVER_INCOME_UNCURED | STUDENT_VIOLATION | RENT_OVERCHARGE | UPCS_FAIL | SET_ASIDE_FAILURE | AVAILABLE_UNIT_VIOLATION" }
      - { name: discovered_on, type: datetime, source: input, description: "Date noncompliance was discovered" }
      - { name: origin_agent_id, type: string, source: system, description: "Opaque X-User-ID of the actor who created the underlying chain (the inspection's scheduler, or the certification's owner agent); the StateHFA reporting the 8823 must differ from this" }
      - { name: status, type: enum, source: system, description: "OPEN -> CORRECTED / REPORTED_8823; REPORTED_8823 -> CORRECTED on back-in-compliance", default: "OPEN", constraints: "OPEN | CORRECTED | REPORTED_8823" }
      - { name: reported_8823_on, type: datetime, source: system, description: "Date Form 8823 was filed for this finding (set on transition to REPORTED_8823)" }

  - name: Form8609
    parent: null
    common_fields: true
    fields:
      - { name: building_id, type: string, source: system, description: "FK -> Building.id; building this credit allocation certificate is issued for (from path)" }
      - { name: issuance_type, type: enum, source: input, description: "PROVISIONAL (allocation estimate, forward-looking) | FINAL (year-1 actual, chronological)", constraints: "PROVISIONAL | FINAL" }
      - { name: allocated_fraction, type: number, source: system, description: "Snapshot of building.first_year_fraction at issuance" }
      - { name: allocated_annual_credit_cents, type: integer, source: system, description: "Snapshot of building.annual_credit_cents at issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED -> REVOKED (terminal)", default: "ISSUED", constraints: "ISSUED | REVOKED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Certification
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /certifications/{id}/submit"
        actor: OwnerAgent
        preconditions:
          - "Certification.status == DRAFT"
          - "Household.student_eligible == true for the certified household (ERR_STUDENT_INELIGIBLE)"
          - "For cert_type INITIAL: annual_income_cents <= unit.income_limit_cents (ERR_INCOME_OVER_LIMIT)"
        side_effects:
          - "Recompute over_income_threshold_cents = floor(unit.income_limit_cents * 1.40)"
          - "Recompute is_over_income = (cert_type==RECERT AND annual_income_cents > over_income_threshold_cents)"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /certifications/{id}/revise"
        actor: OwnerAgent
        preconditions:
          - "Certification.status == SUBMITTED"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /certifications/{id}/approve"
        actor: StateHFA
        preconditions:
          - "Certification.status == SUBMITTED"
        side_effects:
          - "INITIAL approval on a designated LI unit: unit.li_status VACANT_NEVER_OCCUPIED -> QUALIFIED"
          - "RECERT approval with is_over_income==true: unit.li_status QUALIFIED -> OVER_INCOME (still counted low-income; arms the available-unit rule)"
          - "RECERT approval with is_over_income==false on an OVER_INCOME unit: unit.li_status OVER_INCOME -> QUALIFIED (disarms available-unit rule)"
          - "Recompute building.applicable_fraction, qualified_basis_cents, annual_credit_cents (derived-field reconciliation)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /certifications/{id}/approve"
        actor: StateHFA
        preconditions:
          - "Certification.status == SUBMITTED"
          - "Request body decision == REJECT"
        side_effects: []

  - entity: Unit
    initial_state: VACANT_NEVER_OCCUPIED
    terminal_states: [DISQUALIFIED]
    transitions:
      - from: VACANT_NEVER_OCCUPIED
        to: QUALIFIED
        trigger: "system: INITIAL Certification approved on a designated LI unit"
        actor: system
        preconditions:
          - "Unit.ami_designation != MARKET"
          - "Approved INITIAL Certification exists for the unit with annual_income_cents <= income_limit_cents"
        side_effects:
          - "Bubble up: recompute building.applicable_fraction and qualified_basis_cents"
      - from: VACANT_NEVER_OCCUPIED
        to: MARKET_RENTED
        trigger: "POST /units/{id}/lease (market unit) "
        actor: OwnerAgent
        preconditions:
          - "Unit.ami_designation == MARKET"
        side_effects: []
      - from: QUALIFIED
        to: OVER_INCOME
        trigger: "system: RECERT Certification approved with is_over_income==true"
        actor: system
        preconditions:
          - "Unit.li_status == QUALIFIED"
        side_effects:
          - "Unit stays counted low-income (is_low_income_counted remains true)"
          - "Arms the available-unit rule for this building: the next available comparable-or-smaller unit must be rented to a qualified household"
      - from: OVER_INCOME
        to: QUALIFIED
        trigger: "system: RECERT Certification approved with is_over_income==false"
        actor: system
        preconditions:
          - "Unit.li_status == OVER_INCOME"
        side_effects:
          - "Disarms the available-unit rule contribution for this unit"
      - from: OVER_INCOME
        to: DISQUALIFIED
        trigger: "POST /units/{id}/disqualify"
        actor: StateHFA
        preconditions:
          - "Unit.li_status == OVER_INCOME"
        side_effects:
          - "is_low_income_counted -> false"
          - "Cross-entity cascade: recompute building.applicable_fraction, qualified_basis_cents, annual_credit_cents; create Finding(category=AVAILABLE_UNIT_VIOLATION, origin_agent_id = acting StateHFA's X-User-ID); that Finding bumps project.open_finding_count and recomputes project.posture"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /units/{id}/disqualify"
        actor: StateHFA
        preconditions:
          - "Unit.li_status == QUALIFIED"
        side_effects:
          - "is_low_income_counted -> false"
          - "Cross-entity cascade: recompute building.applicable_fraction, qualified_basis_cents, annual_credit_cents; create Finding(category=AVAILABLE_UNIT_VIOLATION, origin_agent_id = acting StateHFA's X-User-ID); that Finding bumps project.open_finding_count and recomputes project.posture"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /inspections/{id}/conduct"
        actor: StateHFA
        preconditions:
          - "Inspection.status == SCHEDULED"
        side_effects:
          - "Compute score = max(0, 100 - sum(deduction_points))"
          - "Compute result = FAIL if has_exigent_health_safety OR score < 60 else PASS"
          - "If result == FAIL: create Finding(category=UPCS_FAIL, status=OPEN, origin_agent_id = conducting StateHFA's X-User-ID) for the building; that Finding bumps project.open_finding_count and recomputes project.posture (cascade)"
      - from: CONDUCTED
        to: CLOSED
        trigger: "POST /inspections/{id}/close"
        actor: StateHFA
        preconditions:
          - "Inspection.status == CONDUCTED"
          - "No Finding with this inspection_id is in status OPEN or REPORTED_8823 (ERR_OPEN_FINDINGS_BLOCK_CLOSE)"
        side_effects: []

  - entity: Finding
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: REPORTED_8823
        trigger: "POST /findings/{id}/report"
        actor: StateHFA
        preconditions:
          - "Finding.status == OPEN"
          - "Acting StateHFA X-User-ID must differ from Finding.origin_agent_id (the actor who conducted the inspection / created the underlying chain) — segregation of duties, ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Set reported_8823_on = current clock time"
          - "Recompute project.posture (stays NONCOMPLIANT while any finding OPEN or REPORTED_8823)"
      - from: OPEN
        to: CORRECTED
        trigger: "POST /findings/{id}/correct"
        actor: OwnerAgent
        preconditions:
          - "Finding.status == OPEN"
        side_effects:
          - "Decrement project.open_finding_count by 1; recompute project.posture"
      - from: REPORTED_8823
        to: CORRECTED
        trigger: "POST /findings/{id}/correct"
        actor: OwnerAgent
        preconditions:
          - "Finding.status == REPORTED_8823"
        side_effects:
          - "Decrement project.open_finding_count by 1; recompute project.posture"

  - entity: Building
    initial_state: PRE_ALLOCATION
    terminal_states: [RECAPTURED]
    transitions:
      - from: PRE_ALLOCATION
        to: PROVISIONAL_8609
        trigger: "POST /buildings/{id}/form8609 (issuance_type=PROVISIONAL)"
        actor: StateHFA
        preconditions:
          - "Building.credit_status == PRE_ALLOCATION"
          - "Owning project.status in {SET_ASIDE_MET, CREDIT_PERIOD} (ERR_SET_ASIDE_NOT_MET)"
        side_effects:
          - "Pin building.first_year_fraction = forward-looking provisional fraction (all designated LI units treated as qualified full year)"
          - "Recompute annual_credit_cents from first_year_fraction; snapshot into a Form8609(issuance_type=PROVISIONAL, status=ISSUED)"
      - from: PROVISIONAL_8609
        to: FINAL_8609
        trigger: "POST /buildings/{id}/form8609 (issuance_type=FINAL)"
        actor: StateHFA
        preconditions:
          - "Building.credit_status == PROVISIONAL_8609"
          - "expected_building_version matches Building.version (ERR_STALE_VERSION)"
        side_effects:
          - "Pin building.first_year_fraction = final chronological fraction (average of 12 month-end qualified fractions)"
          - "Recompute annual_credit_cents from first_year_fraction; snapshot into a Form8609(issuance_type=FINAL, status=ISSUED); increments Building.version by 1"
      - from: FINAL_8609
        to: PROVISIONAL_8609
        trigger: "POST /buildings/{id}/revoke-final"
        actor: StateHFA
        preconditions:
          - "Building.credit_status == FINAL_8609"
        side_effects:
          - "Set the FINAL Form8609.status -> REVOKED; restore first_year_fraction to provisional; recompute annual_credit_cents"
      - from: FINAL_8609
        to: RECAPTURED
        trigger: "POST /buildings/{id}/recapture"
        actor: StateHFA
        preconditions:
          - "Building.credit_status == FINAL_8609"
          - "Owning project.posture == NONCOMPLIANT (ERR_RECAPTURE_REQUIRES_NONCOMPLIANT)"
          - "expected_building_version matches Building.version (ERR_STALE_VERSION)"
        side_effects:
          - "Compensation: annual_credit_cents -> 0; applicable_fraction -> 0; qualified_basis_cents -> 0; the FINAL Form8609.status -> REVOKED; increments Building.version by 1"

  - entity: Project
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SET_ASIDE_MET
        trigger: "POST /projects/{id}/certify-set-aside"
        actor: StateHFA
        preconditions:
          - "Project.status == DRAFT"
          - "Minimum set-aside test satisfied per calculations.minimum_set_aside_test (ERR_SET_ASIDE_NOT_MET). The test is evaluated over the SUM of total_residential_units across all buildings of the project (denominator) and the count of low-income-designated units with ami_designation at or below the test ceiling (numerator). The 8609-issuance precondition (validations[priority=11]) uses the SAME computed result."
        side_effects:
          - "Recompute project.posture"
      - from: SET_ASIDE_MET
        to: CREDIT_PERIOD
        trigger: "POST /projects/{id}/begin-credit-period"
        actor: StateHFA
        preconditions:
          - "Project.status == SET_ASIDE_MET"
          - "At least one building has credit_status FINAL_8609 (ERR_INVALID_STATE)"
        side_effects: []
      - from: CREDIT_PERIOD
        to: COMPLIANCE_PERIOD
        trigger: "POST /projects/{id}/begin-compliance-period"
        actor: StateHFA
        preconditions:
          - "Project.status == CREDIT_PERIOD"
        side_effects: []
      - from: COMPLIANCE_PERIOD
        to: CLOSED
        trigger: "POST /projects/{id}/close"
        actor: StateHFA
        preconditions:
          - "Project.status == COMPLIANCE_PERIOD"
          - "project.open_finding_count == 0 (ERR_OPEN_FINDINGS_BLOCK_CLOSE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: final8609-stale-building
    parent_entity: Building
    write_endpoint: "POST /buildings/{id}/form8609"
    occ_field: "expected_building_version"
    description: |
      Issuing the FINAL Form 8609 against a Building whose version has advanced
      since the client last observed it is rejected. A FINAL issuance supersedes
      the PROVISIONAL credit snapshot; if another writer has already issued the
      FINAL 8609 (advancing the building version and pinning the chronological
      fraction), the current writer's view of the building is stale and its
      issuance is rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: recapture-stale-building
    parent_entity: Building
    write_endpoint: "POST /buildings/{id}/recapture"
    occ_field: "expected_building_version"
    description: |
      Recapturing credit on a Building whose version has advanced since the
      client last observed it is rejected. A recapture zeroes the qualified
      basis and revokes the FINAL 8609; if the building version moved on (e.g.,
      a FINAL 8609 was just re-issued), the recapture request carries a stale
      version and is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: unit_income_and_rent_limits
    trigger: "Unit creation; any change to project.area_median_income_cents or unit.ami_designation/bedroom_count/utility_allowance_cents"
    algorithm: tiered_pricing
    formula: |
      # all money in integer cents; AMI = project.area_median_income_cents (4-person baseline)
      pct = { AMI_40:40, AMI_50:50, AMI_60:60, AMI_80:80 }[ami_designation]   # MARKET has no limits
      hh  = 1 if bedroom_count==0 else max(1, round(bedroom_count * 1.5))      # imputed household size
      factor_bp = HH_FACTOR_BP[hh]                                            # see constants
      income_limit_cents      = floor( AMI * pct/100 * factor_bp/10000 )
      gross_rent_ceiling_cents = floor( income_limit_cents * 30/100 / 12 )
      net_max_rent_cents      = gross_rent_ceiling_cents - utility_allowance_cents
    input_set: "single Unit plus its owning Project's AMI baseline; MARKET units skip the computation (all three fields null)"
    constants:
      HH_FACTOR_BP: { 1: 7000, 2: 8000, 3: 9000, 4: 10000, 5: 10800, 6: 11600 }
      RENT_PCT: 30
      MONTHS: 12
    precision: "integer cents; every division floored (ROUND_DOWN) at each named step, in the order shown"

  - name: over_income_threshold
    trigger: "Certification submit (status DRAFT->SUBMITTED)"
    algorithm: threshold
    formula: |
      over_income_threshold_cents = floor( unit.income_limit_cents * 140/100 )
      is_over_income = (cert_type == RECERT) AND (annual_income_cents > over_income_threshold_cents)
    input_set: "single Certification and its unit's income_limit_cents"
    constants: { OVER_INCOME_BP: 14000 }
    precision: "integer cents, ROUND_DOWN; strict '>' boundary (exactly 140% is NOT over-income)"

  - name: minimum_set_aside_test
    trigger: "POST /projects/{id}/certify-set-aside; POST /buildings/{id}/form8609"
    algorithm: threshold
    formula: |
      total_units = sum(Building.total_residential_units for all buildings of the project)
      # a unit is "set-aside designated" if its ami_designation != MARKET and it is at or below the test ceiling
      if minimum_set_aside == TWENTY_FIFTY:
        ceiling = AMI_50                      # AMI_40 or AMI_50 count
        designated = count(Unit where ami_designation IN {AMI_40, AMI_50})
        satisfied = (designated * 100 >= 25 * total_units)     # >= 25%
      elif minimum_set_aside == FORTY_SIXTY:
        ceiling = AMI_60                      # AMI_40, AMI_50, AMI_60 count
        designated = count(Unit where ami_designation IN {AMI_40, AMI_50, AMI_60})
        satisfied = (designated * 100 >= 40 * total_units)     # >= 40%
      elif minimum_set_aside == AVERAGE_INCOME:
        li = [Unit where ami_designation IN {AMI_40, AMI_50, AMI_60, AMI_80}]
        pct(u) = {AMI_40:40, AMI_50:50, AMI_60:60, AMI_80:80}[u.ami_designation]
        avg_designation = round_half_up( sum(pct(u) for u in li) / count(li), 2 )
        satisfied = (count(li) >= 1) AND (avg_designation <= 60.00)
    input_set: "all Units across all buildings of the project, by ami_designation; uses unit COUNTS (occupancy/li_status NOT required — set-aside is a design-level test of unit designations)"
    constants:
      TWENTY_FIFTY_PCT: 25
      FORTY_SIXTY_PCT: 40
      AVERAGE_INCOME_CEILING: 60.00
    precision: "integer percent comparison via cross-multiplication (designated*100 >= pct*total_units), strict '>=' inclusion; average to 2 decimals ROUND_HALF_UP with '<=' boundary"

  - name: building_applicable_fraction_and_credit
    trigger: "any unit li_status change under the building; INITIAL/RECERT approval; recapture"
    algorithm: aggregation
    formula: |
      li_units = count(Unit under building where is_low_income_counted == true)
      li_sqft  = sum(Unit.sqft under building where is_low_income_counted == true)
      unit_fraction       = round_half_up( li_units / total_residential_units, 4 )
      floor_space_fraction = round_half_up( li_sqft  / total_residential_sqft, 4 )
      applicable_fraction = min(unit_fraction, floor_space_fraction)
      qualified_basis_cents = floor( eligible_basis_cents * applicable_fraction )
      credit_bp = { NINE_PERCENT:900, FOUR_PERCENT:400 }[credit_type]
      annual_credit_cents = floor( qualified_basis_cents * credit_bp/10000 )
    input_set: "all Units under the building filtered to is_low_income_counted==true (li_status in {QUALIFIED, OVER_INCOME}); DISQUALIFIED and MARKET_RENTED excluded"
    constants: { NINE_PERCENT_BP: 900, FOUR_PERCENT_BP: 400 }
    precision: "fractions to 4 decimals ROUND_HALF_UP; basis and credit floored (ROUND_DOWN); evaluation order pinned: fraction -> qualified_basis -> credit"

  - name: first_year_credit_dual_variant
    trigger: "8609 issuance: PROVISIONAL (Building PRE_ALLOCATION->PROVISIONAL_8609) and FINAL (PROVISIONAL_8609->FINAL_8609)"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL (forward-looking): treat every designated low-income unit as qualified
      # for the full year (max-out), regardless of actual month-by-month occupancy.
      prov_fraction = round_half_up( count(Unit where ami_designation != MARKET) / total_residential_units, 4 )
      first_year_fraction = prov_fraction
      annual_credit_cents = floor( eligible_basis_cents * prov_fraction * credit_bp/10000 )
    input_set: "PROVISIONAL: all non-MARKET units (designated), counted as if qualified full year"
    constants: { NINE_PERCENT_BP: 900, FOUR_PERCENT_BP: 400 }
    precision: "fraction 4 decimals ROUND_HALF_UP; credit floored ROUND_DOWN"
    variants:
      - name: provisional_forward_looking
        when: "at 8609 allocation (Building PRE_ALLOCATION->PROVISIONAL_8609), before first-year occupancy is known"
        difference: "numerator = all designated (non-MARKET) units treated as qualified for the entire year (forward projection)"
      - name: final_chronological
        when: "at first-year true-up (Building PROVISIONAL_8609->FINAL_8609), after the 12 month-end occupancy snapshots are known"
        difference: |
          numerator = chronological average of the 12 month-end qualified fractions:
          first_year_fraction = round_half_up( sum(monthly_qualified_units[m]/total_residential_units for m in 1..12) / 12, 4 ),
          where monthly_qualified_units[m] is supplied in the FINAL issuance request body as a 12-element array.
          Same data, different algorithm -> different fraction and different annual_credit_cents than the provisional variant.

  - name: project_posture
    trigger: "any Finding status change; any unit disqualification; set-aside certification"
    algorithm: aggregation
    formula: |
      open_count     = count(Finding under project where status == OPEN)
      reported_count = count(Finding under project where status == REPORTED_8823)
      # open_finding_count field = open_count + reported_count (all unresolved findings)
      if reported_count >= 1:
        posture = NONCOMPLIANT      # an 8823 has been filed and not yet cleared
      elif open_count >= 1:
        posture = AT_RISK           # findings discovered but not yet reported to IRS
      else:
        posture = COMPLIANT
    input_set: "all Findings under the project; OPEN and REPORTED_8823 counted separately (CORRECTED excluded)"
    constants: {}
    precision: "integer counts; NONCOMPLIANT dominates AT_RISK dominates COMPLIANT"

  - name: occupancy_interval_overlap
    trigger: "Lease creation (POST /units/{id}/lease)"
    algorithm: interval_merge
    formula: |
      # Half-open, zero-buffer. New interval N=[new_start, new_end), existing ACTIVE lease E=[e_start, e_end).
      overlaps(N, E) := (new_start < e_end) AND (e_start < new_end)
      # Adjacency (new_start == e_end OR new_end == e_start) does NOT overlap.
      reject with ERR_LEASE_OVERLAP if overlaps(N, E) for any ACTIVE lease E on the unit
    input_set: "all ACTIVE Lease rows on the target unit"
    constants: {}
    precision: "datetime comparison; half-open intervals; zero buffer"

  - name: inspection_window_separation
    trigger: "Inspection creation (POST /inspections)"
    algorithm: interval_merge
    formula: |
      # Closed intervals WITH a mandatory separation buffer. New window N=[new_start, new_end],
      # existing window E=[e_start, e_end]. Buffer = INSPECTION_BUFFER_DAYS days on each side.
      conflicts(N, E) := (new_start <= e_end + BUFFER) AND (e_start <= new_end + BUFFER)
      reject with ERR_INSPECTION_WINDOW_CONFLICT if conflicts(N, E) for any inspection E on the building
    input_set: "all Inspection rows on the target building (any status)"
    constants: { INSPECTION_BUFFER_DAYS: 7 }
    precision: "datetime comparison; closed intervals expanded by a 7-day buffer; differs from lease overlap (half-open, zero-buffer)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc which still requires headers"
  - priority: 2
    category: auth
    check: "Acting role is permitted for the endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Every path/body resource id resolves, validated left-to-right (project, building, unit, household, certification, inspection, finding)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is allowed"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_constraint
    check: "OCC: expected_building_version equals Building.version on FINAL 8609 issuance and recapture"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /buildings/{id}/form8609 (FINAL); POST /buildings/{id}/recapture"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: the StateHFA reporting a Finding (8823) must not be the OwnerAgent who created the underlying certification/inspection chain"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /findings/{id}/report"
  - priority: 7
    category: business_constraint
    check: "Student rule: an all-full-time-student household with student_exception NONE cannot be certified (student_eligible==false)"
    error_id: ERR_STUDENT_INELIGIBLE
    http_status: 422
    applies_to: "POST /certifications/{id}/submit"
  - priority: 8
    category: business_fiscal
    check: "INITIAL certification income must not exceed the unit income limit for its designation/bedroom_count"
    error_id: ERR_INCOME_OVER_LIMIT
    http_status: 422
    applies_to: "POST /certifications/{id}/submit"
  - priority: 8.5
    category: business_temporal
    check: "Lease occupancy overlap: a new Lease on a Unit whose half-open interval [rent_start_date, rent_end_date) intersects any existing ACTIVE Lease interval on the same unit is rejected. Zero-buffer half-open semantics: a lease starting exactly at a prior lease's rent_end_date does NOT overlap."
    error_id: ERR_LEASE_OVERLAP
    http_status: 409
    applies_to: "POST /units/{id}/lease"
  - priority: 9
    category: business_fiscal
    check: "Lease tenant-paid rent must not exceed unit.net_max_rent_cents (rent + utility allowance overcharge)"
    error_id: ERR_RENT_OVER_LIMIT
    http_status: 422
    applies_to: "POST /units/{id}/lease"
  - priority: 9.5
    category: business_temporal
    check: "Inspection window separation: scheduling an Inspection whose closed window [window_start, window_end] is within INSPECTION_BUFFER_DAYS (7) of any existing inspection window on the same building (i.e., new window_start < prior window_end + 7 days, with closed-interval/buffer semantics) is rejected."
    error_id: ERR_INSPECTION_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /inspections"
  - priority: 10
    category: business_referential
    check: "Available-unit rule: while an OVER_INCOME unit exists in a building, a comparable-or-smaller unit (bedroom_count <= the over-income unit's) may not be leased to a non-qualified (MARKET or student-ineligible) household"
    error_id: ERR_AVAILABLE_UNIT_RULE
    http_status: 409
    applies_to: "POST /units/{id}/lease"
  - priority: 11
    category: business_constraint
    check: "Minimum set-aside test must be satisfied before set-aside certification or 8609 issuance"
    error_id: ERR_SET_ASIDE_NOT_MET
    http_status: 409
    applies_to: "POST /projects/{id}/certify-set-aside; POST /buildings/{id}/form8609"
  - priority: 12
    category: state
    check: "An inspection cannot CLOSE while any of its findings is OPEN or REPORTED_8823; a project cannot CLOSE while open_finding_count > 0"
    error_id: ERR_OPEN_FINDINGS_BLOCK_CLOSE
    http_status: 409
    applies_to: "POST /inspections/{id}/close; POST /projects/{id}/close"
  - priority: 13
    category: business_constraint
    check: "Recapture requires the owning project to be NONCOMPLIANT"
    error_id: ERR_RECAPTURE_REQUIRES_NONCOMPLIANT
    http_status: 409
    applies_to: "POST /buildings/{id}/recapture"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used for discovered_on / reported_8823_on stamps. Server startup default is 2026-01-01T00:00:00Z; before any set, the clock reads exactly this default (never real wall-clock)."
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced to to_iso8601"]

  # ---- Project ----
  - method: POST
    path: "/projects"
    description: "Create a LIHTC project"
    roles: [OwnerAgent]
    code: 201
    input: [name, area_median_income_cents, minimum_set_aside, placed_in_service_date]
    output: Project
    side_effects: ["status=DRAFT, posture=COMPLIANT, open_finding_count=0"]
  - method: GET
    path: "/projects"
    description: "List projects (paginated)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: ["limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: GET
    path: "/projects/{id}"
    description: "Get a project"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: POST
    path: "/projects/{id}/certify-set-aside"
    description: "StateHFA certifies the minimum set-aside is met (DRAFT->SET_ASIDE_MET)"
    roles: [StateHFA]
    code: 200
    input: []
    output: Project
    side_effects: ["status DRAFT->SET_ASIDE_MET if set-aside satisfied; recompute posture"]
  - method: POST
    path: "/projects/{id}/begin-credit-period"
    description: "Advance project SET_ASIDE_MET->CREDIT_PERIOD"
    roles: [StateHFA]
    code: 200
    input: []
    output: Project
    side_effects: ["status SET_ASIDE_MET->CREDIT_PERIOD"]
  - method: POST
    path: "/projects/{id}/begin-compliance-period"
    description: "Advance project CREDIT_PERIOD->COMPLIANCE_PERIOD"
    roles: [StateHFA]
    code: 200
    input: []
    output: Project
    side_effects: ["status CREDIT_PERIOD->COMPLIANCE_PERIOD"]
  - method: POST
    path: "/projects/{id}/close"
    description: "Close a project (COMPLIANCE_PERIOD->CLOSED)"
    roles: [StateHFA]
    code: 200
    input: []
    output: Project
    side_effects: ["status COMPLIANCE_PERIOD->CLOSED if open_finding_count==0"]

  # ---- Building ----
  - method: POST
    path: "/buildings"
    description: "Create a building under a project (project_id in body)"
    roles: [OwnerAgent]
    code: 201
    input: [project_id, bin, eligible_basis_cents, credit_type, total_residential_units, total_residential_sqft]
    output: Building
    side_effects: ["credit_status=PRE_ALLOCATION; applicable_fraction=0; qualified_basis_cents=0; annual_credit_cents=0"]
  - method: GET
    path: "/buildings"
    description: "List buildings, optionally filtered by project_id (reverse-reachability for Building.project_id)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: Building[]
    side_effects: []
  - method: GET
    path: "/buildings/{id}"
    description: "Get a building (with derived applicable_fraction, qualified_basis_cents, annual_credit_cents)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: []
    output: Building
    side_effects: []
  - method: POST
    path: "/buildings/{id}/form8609"
    description: "Issue a Form 8609. issuance_type=PROVISIONAL drives PRE_ALLOCATION->PROVISIONAL_8609 (forward-looking fraction). issuance_type=FINAL drives PROVISIONAL_8609->FINAL_8609 (chronological fraction); FINAL requires expected_building_version and monthly_qualified_units."
    roles: [StateHFA]
    code: 201
    input: [issuance_type, "monthly_qualified_units?", "expected_building_version?"]
    output: Form8609
    side_effects: ["Pin first_year_fraction; recompute annual_credit_cents; snapshot Form8609; FINAL increments Building.version by 1"]
  - method: GET
    path: "/form8609s"
    description: "List Form 8609 certificates, optionally filtered by building_id (reverse-reachability for Form8609.building_id)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: ["building_id?", "limit?", "offset?"]
    output: Form8609[]
    side_effects: []
  - method: GET
    path: "/form8609s/{id}"
    description: "Get a Form 8609 certificate"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: []
    output: Form8609
    side_effects: []
  - method: POST
    path: "/buildings/{id}/revoke-final"
    description: "Revoke a FINAL 8609 (FINAL_8609->PROVISIONAL_8609); restores provisional fraction"
    roles: [StateHFA]
    code: 200
    input: []
    output: Building
    side_effects: ["FINAL Form8609.status->REVOKED; first_year_fraction restored to provisional; recompute annual_credit_cents"]
  - method: POST
    path: "/buildings/{id}/recapture"
    description: "Recapture credit (FINAL_8609->RECAPTURED); requires NONCOMPLIANT project and expected_building_version"
    roles: [StateHFA]
    code: 200
    input: [expected_building_version]
    output: Building
    side_effects: ["annual_credit_cents->0; applicable_fraction->0; qualified_basis_cents->0; FINAL Form8609.status->REVOKED; increments Building.version by 1"]

  # ---- Unit ----
  - method: POST
    path: "/units"
    description: "Create a unit under a building (building_id in body); income/rent limits computed on create"
    roles: [OwnerAgent]
    code: 201
    input: [building_id, unit_number, bedroom_count, sqft, utility_allowance_cents, ami_designation]
    output: Unit
    side_effects: ["compute income_limit_cents, gross_rent_ceiling_cents, net_max_rent_cents; li_status=VACANT_NEVER_OCCUPIED; is_low_income_counted=false"]
  - method: GET
    path: "/units"
    description: "List units, optionally filtered by building_id (reverse-reachability for Unit.building_id)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: ["building_id?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []
  - method: GET
    path: "/units/{id}"
    description: "Get a unit (with derived limits and li_status)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: POST
    path: "/units/{id}/lease"
    description: "Lease a unit to a household, creating a Lease. Enforces rent ceiling, student rule, available-unit rule, and occupancy-interval overlap."
    roles: [OwnerAgent]
    code: 201
    input: [household_id, monthly_rent_cents, rent_start_date, rent_end_date]
    output: Lease
    side_effects: ["create Lease(status=ACTIVE); MARKET unit -> li_status=MARKET_RENTED"]
  - method: POST
    path: "/units/{id}/disqualify"
    description: "StateHFA enforcement: disqualify a QUALIFIED or OVER_INCOME unit (e.g., available-unit-rule breach found on audit). Drives li_status->DISQUALIFIED, creates an AVAILABLE_UNIT_VIOLATION Finding, and cascades building credit + project posture."
    roles: [StateHFA]
    code: 200
    input: [discovered_on]
    output: Unit
    side_effects: ["li_status->DISQUALIFIED; is_low_income_counted=false; recompute building fraction/credit; create Finding(AVAILABLE_UNIT_VIOLATION); cascade open_finding_count + posture"]

  # ---- Lease ----
  - method: GET
    path: "/leases"
    description: "List leases, optionally filtered by unit_id or household_id (reverse-reachability for Lease.unit_id and Lease.household_id)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: ["unit_id?", "household_id?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []
  - method: GET
    path: "/leases/{id}"
    description: "Get a lease"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: []
    output: Lease
    side_effects: []

  # ---- Household ----
  - method: POST
    path: "/households"
    description: "Register a household within a project (project_id in body)"
    roles: [OwnerAgent]
    code: 201
    input: [project_id, head_name, household_size, all_full_time_students, "student_exception?"]
    output: Household
    side_effects: ["compute student_eligible = NOT(all_full_time_students AND student_exception==NONE)"]
  - method: GET
    path: "/households"
    description: "List households, optionally filtered by project_id (reverse-reachability for Household.project_id)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: ["project_id?", "limit?", "offset?"]
    output: Household[]
    side_effects: []
  - method: GET
    path: "/households/{id}"
    description: "Get a household"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: []
    output: Household
    side_effects: []

  # ---- Certification ----
  - method: POST
    path: "/certifications"
    description: "Create an income certification (INITIAL or RECERT) for a household on a unit (household_id and unit_id in body)"
    roles: [OwnerAgent]
    code: 201
    input: [household_id, unit_id, cert_type, annual_income_cents, effective_date]
    output: Certification
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/certifications"
    description: "List certifications, optionally filtered by unit_id or household_id (reverse-reachability for Certification.unit_id and Certification.household_id)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: ["unit_id?", "household_id?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []
  - method: GET
    path: "/certifications/{id}"
    description: "Get a certification (with over_income_threshold_cents, is_over_income)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: []
    output: Certification
    side_effects: []
  - method: POST
    path: "/certifications/{id}/submit"
    description: "Submit a DRAFT certification (DRAFT->SUBMITTED); enforces student rule and INITIAL income limit"
    roles: [OwnerAgent]
    code: 200
    input: []
    output: Certification
    side_effects: ["compute over_income_threshold_cents and is_over_income; status DRAFT->SUBMITTED"]
  - method: POST
    path: "/certifications/{id}/revise"
    description: "Send a SUBMITTED certification back to DRAFT (SUBMITTED->DRAFT)"
    roles: [OwnerAgent]
    code: 200
    input: []
    output: Certification
    side_effects: ["status SUBMITTED->DRAFT"]
  - method: POST
    path: "/certifications/{id}/approve"
    description: "StateHFA decides a SUBMITTED certification (SUBMITTED->APPROVED or REJECTED). decision=APPROVE drives unit li_status side effects."
    roles: [StateHFA]
    code: 200
    input: [decision]
    output: Certification
    side_effects: ["APPROVE: unit li_status transitions per certification; recompute building fraction/credit. REJECT: no unit change."]

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "Schedule a UPCS inspection for a building (building_id in body). Enforces the inspection-window separation buffer against existing inspections on the building."
    roles: [StateHFA]
    code: 201
    input: [building_id, window_start, window_end, inspected_on, deduction_points, "has_exigent_health_safety?"]
    output: Inspection
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/inspections"
    description: "List inspections, optionally filtered by building_id (reverse-reachability for Inspection.building_id)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: ["building_id?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection (with computed score and result)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/conduct"
    description: "Conduct a scheduled inspection (SCHEDULED->CONDUCTED); computes score/result; FAIL creates a UPCS_FAIL Finding"
    roles: [StateHFA]
    code: 200
    input: []
    output: Inspection
    side_effects: ["compute score, result; FAIL -> create Finding(UPCS_FAIL); cascade open_finding_count + posture"]
  - method: POST
    path: "/inspections/{id}/close"
    description: "Close a conducted inspection (CONDUCTED->CLOSED); blocked while findings OPEN/REPORTED_8823"
    roles: [StateHFA]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status CONDUCTED->CLOSED"]

  # ---- Finding ----
  - method: GET
    path: "/findings"
    description: "List findings, optionally filtered by project_id, building_id, or inspection_id (reverse-reachability for Finding.project_id, Finding.building_id, Finding.inspection_id)"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: ["project_id?", "building_id?", "inspection_id?", "limit?", "offset?"]
    output: Finding[]
    side_effects: []
  - method: GET
    path: "/findings/{id}"
    description: "Get a finding"
    roles: [OwnerAgent, StateHFA]
    code: 200
    input: []
    output: Finding
    side_effects: []
  - method: POST
    path: "/findings/{id}/report"
    description: "File Form 8823 for an OPEN finding (OPEN->REPORTED_8823); segregation of duties enforced"
    roles: [StateHFA]
    code: 200
    input: []
    output: Finding
    side_effects: ["set reported_8823_on; recompute posture"]
  - method: POST
    path: "/findings/{id}/correct"
    description: "Mark a finding corrected (OPEN/REPORTED_8823 -> CORRECTED)"
    roles: [OwnerAgent]
    code: 200
    input: []
    output: Finding
    side_effects: ["decrement open_finding_count; recompute posture"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A referenced project/building/unit/household/certification/inspection/finding does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, or invalid enum/type" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state permitting the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_building_version does not match Building.version on FINAL 8609 issuance or recapture" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "StateHFA reporting an 8823 is the same actor who created the underlying certification/inspection chain" }
  - { id: ERR_STUDENT_INELIGIBLE, http: 422, condition: "All-full-time-student household with no qualifying exception cannot be certified" }
  - { id: ERR_INCOME_OVER_LIMIT, http: 422, condition: "INITIAL certification income exceeds the unit income limit" }
  - { id: ERR_RENT_OVER_LIMIT, http: 422, condition: "Lease tenant-paid rent exceeds unit.net_max_rent_cents" }
  - { id: ERR_LEASE_OVERLAP, http: 409, condition: "New lease occupancy interval overlaps an existing ACTIVE lease on the same unit (half-open, zero-buffer)" }
  - { id: ERR_INSPECTION_WINDOW_CONFLICT, http: 409, condition: "New inspection window is within the 7-day separation buffer of an existing inspection window on the same building (closed-interval, buffered)" }
  - { id: ERR_AVAILABLE_UNIT_RULE, http: 409, condition: "Comparable-or-smaller unit leased to a non-qualified household while an over-income unit exists (next-available-unit rule)" }
  - { id: ERR_SET_ASIDE_NOT_MET, http: 409, condition: "Minimum set-aside test not satisfied for set-aside certification or 8609 issuance" }
  - { id: ERR_OPEN_FINDINGS_BLOCK_CLOSE, http: 409, condition: "Inspection or project cannot close while findings are OPEN or REPORTED_8823" }
  - { id: ERR_RECAPTURE_REQUIRES_NONCOMPLIANT, http: 409, condition: "Recapture attempted on a project that is not NONCOMPLIANT" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OwnerAgent
    description: "Property owner / management agent. Creates and operates the LIHTC project, buildings, units, households; certifies tenant income; leases units; corrects findings. Cannot self-clear by filing the 8823 that reports its own work."
    identity: "opaque"
    exclusive_operations:
      - "POST /projects — create project"
      - "POST /buildings — create building"
      - "POST /units — create unit"
      - "POST /households — register household"
      - "POST /units/{id}/lease — lease a unit"
      - "POST /certifications — create certification"
      - "POST /certifications/{id}/submit — submit certification"
      - "POST /certifications/{id}/revise — revise certification"
      - "POST /findings/{id}/correct — correct a finding"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "All GET endpoints"
  - name: StateHFA
    description: "State Housing Finance Agency. Independent oversight: approves/rejects certifications, certifies set-aside, issues/revokes/recaptures Form 8609, conducts UPCS inspections, files 8823 reports. Segregation of duties bars it from reporting findings on chains it itself created."
    identity: "opaque"
    exclusive_operations:
      - "POST /projects/{id}/certify-set-aside"
      - "POST /projects/{id}/begin-credit-period"
      - "POST /projects/{id}/begin-compliance-period"
      - "POST /projects/{id}/close"
      - "POST /buildings/{id}/form8609"
      - "POST /buildings/{id}/revoke-final"
      - "POST /buildings/{id}/recapture"
      - "POST /certifications/{id}/approve"
      - "POST /inspections"
      - "POST /inspections/{id}/conduct"
      - "POST /inspections/{id}/close"
      - "POST /findings/{id}/report"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "All GET endpoints"
