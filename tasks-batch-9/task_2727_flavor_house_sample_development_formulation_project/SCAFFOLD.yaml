    path: "/substantiation-records/{record_id}/verify"
    description: "Verify a pending certificate, or re-verify a revoked one after remediation"
    roles: [RegulatoryAffairs]
    code: 200
    input: []
    output: SubstantiationRecord
    side_effects:
      - "PENDING -> VERIFIED or REVOKED -> VERIFIED; sets verified_at and increments SubstantiationRecord.version"
      - "recomputes RawMaterial.verified_claim_types and, on re-verification, RawMaterial.claim_status"
      - "on re-verification: every RegulatoryDocument pinned to this record -> STALE"

  - method: POST
    path: "/substantiation-records/{record_id}/revoke"
    description: "Revoke a verified certificate and propagate the compliance cascade"
    roles: [RegulatoryAffairs]
    code: 200
    input: [revocation_reason]
    output: SubstantiationRecord
    side_effects:
      - "VERIFIED -> REVOKED; increments SubstantiationRecord.version"
      - "LINK 1: RawMaterial.claim_status -> RESTRICTED"
      - "LINK 2: APPROVED formulas transitively containing the material -> REWORK_REQUIRED when claim_type is in the brief's required claim set"
      - "LINK 3: those formulas' SampleLots RELEASED -> HELD"
      - "LINK 4: those lots' shipments in DRAFT or PACKET_ASSEMBLED -> BLOCKED with block_reason LOT_HELD"
      - "every RegulatoryDocument pinned to this record -> STALE"

