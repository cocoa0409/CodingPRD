              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { p_id: "$.data.id" }
            - call: "POST /registry/search-requests"
              payload: { patient_id: "${p_id}", search_scope: "DOMESTIC_ONLY" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { sr_id: "$.data.id" }
            - call: "GET /registry/match-candidates"
              payload: { search_request_id: "${sr_id}" }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { mc1_id: "$.data[0].id" }
            - call: "POST /registry/match-candidates/${mc1_id}/typing-requests"
              payload: { priority_flag: false }
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { ct1_id: "$.data.id" }
            - call: "POST /registry/typing-requests/${ct1_id}/response"
              payload: { reported_hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, donor_available_flag: true }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/screening"
              payload: { outcome: "PASS", deferral_type: "NONE" }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
            - call: "POST /registry/match-candidates/${mc1_id}/workup-cases"
              payload: {}
              as: TransplantCoordinator
              as_user_id: "tc-1"
              captures: { wc_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T08:00:00Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "GET /registry/workup-cases/${wc_id}/clearance-items"
              payload: {}
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { ci_phys: "$.data[0].id" }
            - call: "POST /registry/clearance-items/${ci_phys}/result"
              payload: { result: "PASS" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { phys_by: "$.data.resulted_by_user_id" }
          trigger:
            - call: "POST /registry/workup-cases/${wc_id}/collection-method"
              payload: { method: "MARROW", rationale: "Marrow harvest preferred by the transplant team" }
              as: MedicalDirector
              as_user_id: "md-1"
              captures: { err_conflict: "$.data.error_id" }
            - call: "POST /registry/workup-cases/${wc_id}/collection-method"
              payload: { method: "MARROW", rationale: "Marrow harvest preferred by the transplant team" }
              as: MedicalDirector
