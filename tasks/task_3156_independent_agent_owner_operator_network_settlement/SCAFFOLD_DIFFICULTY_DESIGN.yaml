        grounds:
          - state_machines.CapacityOwner.transitions.QUALIFIED_to_OUT_OF_SERVICE
          - state_machines.Trip.transitions.DISPATCH_PENDING_to_ABORTED
          - state_machines.Load.transitions.AWARDED_to_POSTED
