              payload: { partner_id: "${pa_id}", channel: "PARTNER_APP", category: "ACCOUNT_ACCESS", severity: "LOW", received_at: "2026-08-01T00:00:00Z", narrative: "Reachability fixture complaint.", is_reg_e_dispute: false }
              as: ComplianceOfficer
