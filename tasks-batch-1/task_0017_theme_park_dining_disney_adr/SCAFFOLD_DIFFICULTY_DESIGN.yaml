  # =========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: restaurant_slot_capacity_aggregate_seat_sum_half_open_overlap
        grounds:
          - validations[priority=13]
          - endpoints.POST_/v1/reservations
          - errors[ERR_SLOT_CAPACITY_EXCEEDED]
          - entities.Restaurant.fields.capacity_per_slot
        distinguishing_aspect: |
          Restaurant slot capacity uses AGGREGATE-SUM semantics with strict half-open
          intervals: sum(party_size of overlapping reservations in non-terminal states) +
          candidate party_size MUST NOT exceed capacity_per_slot. Two existing CONFIRMED
          reservations with party_size 3 and 2 occupy the slot [18:00, 18:30) at a
          capacity_per_slot=4 restaurant; candidate party_size=1 → 3+2+1=6 > 4 → reject.
          Interval semantics: aggregate-capacity sum (NOT pairwise overlap). Resource:
          Restaurant slot.
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z."
            - "Restaurant with capacity_per_slot=4."
            - "Two existing CONFIRMED reservations from OTHER guests at slot 2026-02-15T18:00:00Z (party_size 3 and 2, total seat usage 5 exceeds cap)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/restaurants"
              payload: { name: "Storybook Dining", park_code: "MAGIC_KINGDOM", capacity_per_slot: 4, slot_minutes: 30, is_character_dining: true, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "08:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            # Guest A — fills 3 seats (note: the 'aggregate' aspect needs sum, so we OVERFILL via two guests to surface capacity_per_slot logic).
            - call: "POST /v1/guests"
              payload: { email: "g_to1a@x.com", full_name: "A Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_a_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_a_id}", tier: "STANDARD", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_a_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_a_id}", park_code: "MAGIC_KINGDOM", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_a_id}"
              captures: { ps_a_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_a_id}", restaurant_id: "${r_id}", park_session_id: "${ps_a_id}", dining_plan_id: "${dp_a_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 3 }
              as: Guest
              as_user_id: "${g_a_id}"
              captures: { res_a_id: $.data.id }
            - call: "POST /v1/reservations/${res_a_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_a_id}"
            # Guest B — would add 2 more, but should hit ERR_SLOT_CAPACITY_EXCEEDED already (3+2 > 4). Use party_size=1 instead to succeed.
            - call: "POST /v1/guests"
              payload: { email: "g_to1b@x.com", full_name: "B Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_b_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_b_id}", tier: "STANDARD", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_b_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_b_id}", park_code: "MAGIC_KINGDOM", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_b_id}"
              captures: { ps_b_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_b_id}", restaurant_id: "${r_id}", park_session_id: "${ps_b_id}", dining_plan_id: "${dp_b_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_b_id}"
              captures: { res_b_id: $.data.id }
            - call: "POST /v1/reservations/${res_b_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_b_id}"
            # Trigger guest — should hit ERR_SLOT_CAPACITY_EXCEEDED (existing 3+1=4, candidate +1 → 5 > 4).
            - call: "POST /v1/guests"
              payload: { email: "g_to1t@x.com", full_name: "T Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_t_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_t_id}", tier: "STANDARD", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_t_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_t_id}", park_code: "MAGIC_KINGDOM", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_t_id}"
              captures: { ps_t_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_t_id}", restaurant_id: "${r_id}", park_session_id: "${ps_t_id}", dining_plan_id: "${dp_t_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_t_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "Response HTTP status == 409"
            - "response.data.error_id == 'ERR_SLOT_CAPACITY_EXCEEDED'"

      - name: guest_double_booking_padded_buffer_60min_pairwise_overlap
        grounds:
          - validations[priority=14]
          - endpoints.POST_/v1/reservations
          - errors[ERR_GUEST_DOUBLE_BOOKING]
        distinguishing_aspect: |
          Guest double-booking uses PADDED-BUFFER PAIRWISE overlap semantics: each
          reservation's effective occupation is [slot_start - 60min, slot_end + 60min], and
          the candidate's [slot_start, slot_end) must not overlap any existing such
          occupation (across ALL restaurants for the same guest). Different interval
          semantics from instance 1 (padded buffer per reservation vs aggregate seat-count
          sum). Resource: Guest (not Restaurant). Example: an existing CONFIRMED reservation
          at slot 17:00–17:30 expands to [16:00, 18:30] occupation; candidate at 18:00 in
          another restaurant overlaps and is rejected.
        test_recipe:
          setup:
            - "Clock at 2026-01-15T12:00:00Z."
            - "Guest has one CONFIRMED reservation at Restaurant A slot 2026-02-15T17:00:00Z (effective occupation 2026-02-15T16:00:00Z to 2026-02-15T18:30:00Z)."
            - "Candidate is at Restaurant B slot 2026-02-15T18:00:00Z (overlaps the buffered occupation)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
