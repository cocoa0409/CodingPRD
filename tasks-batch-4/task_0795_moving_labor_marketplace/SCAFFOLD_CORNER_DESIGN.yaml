  - section: rbac
    instances:
      - name: helper_cannot_create_job
        claim_type: unauthorized_role
        grounds: [roles.Helper, 'errors[ERR_FORBIDDEN]']
        distinguishing_aspect: "A Helper calling POST /jobs (a Customer-exclusive op) is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A RateCard, InsurancePolicy, and an APPROVED Helper exist."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /helpers", payload: { display_name: "HH", email: "hh@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { hh: "$.data.id" } }
          trigger:
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Helper, as_user_id: "${hh}", captures: { err: "$.data.error_id" } }
          assert:
            - "http_status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: customer_cannot_create_assignment
        claim_type: unauthorized_role
        grounds: [roles.Dispatcher, 'errors[ERR_FORBIDDEN]']
        distinguishing_aspect: "A Customer calling POST /assignments (a Dispatcher-exclusive op) is rejected with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A BOOKED Job and an APPROVED Helper exist."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /helpers", payload: { display_name: "HH", email: "hh@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { hh: "$.data.id" } }
            - { call: "POST /helpers/${hh}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "POST /assignments", payload: { job_id: "${job}", helper_id: "${hh}" }, as: Customer, as_user_id: "${cust}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: helper_cannot_checkin_others_assignment
        claim_type: owner_mismatch
        grounds: [roles.Helper, state_machines.Assignment.ASSIGNED_to_CHECKED_IN, 'errors[ERR_FORBIDDEN]']
        distinguishing_aspect: "A different Helper (not the assignment owner) calling POST /assignments/{id}/check-in is rejected with ERR_FORBIDDEN because X-User-ID != Assignment.helper_id."
        test_recipe:
          setup: ["A BOOKED Job with helper HA ASSIGNED; a second APPROVED helper HB exists."]
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
            - { call: "POST /helpers", payload: { display_name: "HA", email: "ha@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { ha: "$.data.id" } }
            - { call: "POST /helpers/${ha}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /helpers", payload: { display_name: "HB", email: "hb@x.com", base_hourly_rate_cents: 4000 }, as: Admin, captures: { hb: "$.data.id" } }
            - { call: "POST /helpers/${hb}/vet", payload: { decision: "APPROVE" }, as: Admin }
            - { call: "POST /jobs", payload: { rate_card_id: "${rc}", insurance_policy_id: "${pol}", job_type: "MOVE", crew_size: 1, estimated_hours: 2.0, window_start: "2026-03-11T09:00:00Z", window_end: "2026-03-11T11:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { job: "$.data.id" } }
            - { call: "POST /jobs/${job}/quote", payload: {}, as: Customer, as_user_id: "${cust}", captures: { q: "$.data.id" } }
            - { call: "GET /jobs/${job}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${job}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /assignments", payload: { job_id: "${job}", helper_id: "${ha}" }, as: Dispatcher, captures: { asg: "$.data.id" } }
          trigger:
            - { call: "POST /assignments/${asg}/check-in", payload: {}, as: Helper, as_user_id: "${hb}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN"
            - "Assignment.${asg}.status == ASSIGNED"

  # ---------------------------------------------------------------------------
  # Corners already exercised by §1.8 difficulty instances -> stubs (no recipe).
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_crew_full_on_assign
        claim_type: violation_to_error
        grounds: ['errors[ERR_CREW_FULL]']
        excluded_because:
          difficulty_instance: crew_slots_full_boundary
          rationale: "The crew-slot count boundary asserts ERR_CREW_FULL on the (crew_size+1)th assignment."
      - name: error_helper_unavailable_on_assign
        claim_type: violation_to_error
        grounds: ['errors[ERR_HELPER_UNAVAILABLE]']
        excluded_because:
          difficulty_instance: helper_overlap_with_travel_buffer
          rationale: "Helper travel-buffer overlap asserts ERR_HELPER_UNAVAILABLE."
      - name: error_truck_unavailable_on_assign_truck
        claim_type: violation_to_error
        grounds: ['errors[ERR_TRUCK_UNAVAILABLE]']
        excluded_because:
          difficulty_instance: truck_overlap_touching_endpoints
          rationale: "Truck closed-interval overlap asserts ERR_TRUCK_UNAVAILABLE."
      - name: error_helper_not_approved_on_assign
        claim_type: violation_to_error
        grounds: ['errors[ERR_HELPER_NOT_APPROVED]']
        excluded_because:
          difficulty_instance: assign_requires_helper_approved
          rationale: "Assigning a PENDING_REVIEW helper asserts ERR_HELPER_NOT_APPROVED."
      - name: error_no_crew_checked_in_on_start
        claim_type: violation_to_error
        grounds: ['errors[ERR_NO_CREW_CHECKED_IN]']
        excluded_because:
          difficulty_instance: start_requires_checked_in_crew
          rationale: "Starting with no CHECKED_IN assignment asserts ERR_NO_CREW_CHECKED_IN."

  - section: calculations
    instances:
      - name: addons_taxed_total_computed
        claim_type: correct_result
        grounds: [calculations.addons_taxed_total]
        excluded_because:
          difficulty_instance: addons_per_line_round_then_sum
          rationale: "Per-line-then-sum add-on tax total is asserted at 8135."
      - name: claim_settlement_variants_computed
        claim_type: variant_divergence
        grounds: [calculations.claim_settlement]
        excluded_because:
          difficulty_instance: claim_settlement_basic_vs_full_diverge
          rationale: "BASIC (140000) vs FULL (135000) settlement asserted for identical claimed amount."
      - name: helper_rating_avg_computed
        claim_type: correct_result
        grounds: [calculations.helper_rating_avg]
        excluded_because:
          difficulty_instance: rating_suspends_helper_releases_assignment
          rationale: "rating_avg == 1.0 is asserted after the single 1-star rating."
