              payload: { specialist_id: "${s1}" }
              as: ReferralCoordinator
              captures: { r4_v: $.data.version }
          trigger:
            - call: "POST /referrals/${r2}/appointments"
              payload: { expected_referral_version: "${r2_v}", scheduled_start: "2026-08-02T10:45:00Z", scheduled_end: "2026-08-02T11:30:00Z" }
