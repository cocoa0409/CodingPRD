        grounds:
          - state_machines.Load.ARRIVED_to_DELIVERED
          - calculations.driver_hos_replay
          - calculations.hos_status_evaluation
          - state_machines.Load.ASSIGNED_to_PAPERWORK_VERIFIED
        distinguishing_aspect: |
          Depth-3 chain triggered by deliver (distinct trigger from incident close):
          deliver L1 appends system DUTY_OFF -> Driver cycle_on_duty_minutes_8d
          recomputes to 4340 >= 4200 -> hos_status flips CYCLE_EXHAUSTED -> the
          driver's OTHER ASSIGNED load L2 is force-unassigned to PAPERWORK_VERIFIED
