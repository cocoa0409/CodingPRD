            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv_pre_notice: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv_pre_notice}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv_pub: $.data.version }
          trigger:
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.kk@x.test", child_pseudonym: "child-623", intended_uses: ["PARTICIPATION_CORE"], consent_method: "KNOWLEDGE_BASED_AUTH", expected_service_version: "${sv_pub}" }
              as: ComplianceOfficer
              captures: { consent_a: $.data.id, consent_a_status: $.data.status, tier_a: $.data.required_tier_at_creation }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.ll@x.test", child_pseudonym: "child-624", intended_uses: ["PARTICIPATION_CORE"], consent_method: "KNOWLEDGE_BASED_AUTH", expected_service_version: "${sv_pub}" }
              as: ComplianceOfficer
              captures: { err_stale: $.data.error_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv_after: $.data.version, active_after: $.data.active_consent_count }
            - call: "POST /consent-requests"
              payload: { service_id: "${svc_id}", notice_id: "${notice_id}", parent_email: "guardian.ll@x.test", child_pseudonym: "child-624", intended_uses: ["PARTICIPATION_CORE"], consent_method: "KNOWLEDGE_BASED_AUTH", expected_service_version: "${sv_after}" }
              as: ComplianceOfficer
              captures: { consent_b: $.data.id, consent_b_status: $.data.status }
            - call: "GET /consent-requests"
              payload: { service_id: "${svc_id}", limit: 100, offset: 0 }
              as: ComplianceOfficer
              captures: { consent_total: $.meta.total_count }
          assert:
            - "${v_after_det} == 3, ${sv_pre_notice} == 3 and ${sv_pub} == 5 (notice create then publish each add one)"
            - "${consent_a_status} == INITIATED with ${tier_a} == 1 (PARTICIPATION_CORE, no approved persistent-identifier integrations to bump the tier)"
            - "${err_stale} == ERR_STALE_SERVICE_VERSION with HTTP 412 for a DIFFERENT parent and child — the token guards the service aggregate, not the parent/child pair"
            - "${sv_after} == 6 and ${active_after} == 0 (one increment for the accepted create; INITIATED is not counted as an active consent)"
            - "${consent_b_status} == INITIATED once the token is refreshed"
            - "${consent_total} == 2, so the refused create left no ConsentRequest row"

      - name: deletion_fulfilment_cascade_reaches_integrations_and_posture
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
        excluded_because:
          difficulty_instance: transitive_cascade / deletion_fulfilment_six_link_cascade_unfreezes_to_restricted
          rationale: "The full six-link cascade from rights-request fulfilment through record disposal, consent revocation, integration re-audit and posture recomputation is asserted end-to-end by the named §1.8 instance."

      - name: determination_selects_between_two_variant_formulas
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
        excluded_because:
          difficulty_instance: dual_variant_calc / determination_variant_divergence_audience_first_vs_design_first
          rationale: "Variant selection and the divergence of AUDIENCE_FIRST versus DESIGN_FIRST on identical evidence are asserted by the named §1.8 instance."

      - name: exposure_point_thresholds_change_the_posture_band
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
        excluded_because:
          difficulty_instance: boundary_precision_check / exposure_points_exact_forty_restricts_and_zero_point_cdn_does_not
          rationale: "The exact-40 restrict boundary, the exact-80 freeze boundary and the zero-point CDN case are asserted by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: posture_and_exposure_recompute_without_any_compliance_run
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.compliance_posture
          - calculations.third_party_exposure_points
          - endpoints["POST /online-services/{id}/posture"]
        distinguishing_aspect: "Consistency is immediate, not run-driven: every derived field is correct in the first read after the write that caused it, and POST /compliance-runs is needed only for clock-driven expiry and disposal — compliance_run_sequence stays 0 while open_audit_count, third_party_exposure_points and compliance_posture move three times, and the posture endpoint reports the new posture in the very response that set the override."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; MIXED_AUDIENCE service with one declared ANALYTICS integration (persistent identifier, CHILD_DIRECTED_AREA, vendor Kid Metrics) that is disclosed by the published notice."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Immediate Kids", operator_organization: "Immediate Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
              captures: { det_status: $.data.determination_status, det_score: $.data.design_score }
            - call: "POST /third-party-integrations"
              payload: { service_id: "${svc_id}", vendor_name: "Kid Metrics", integration_type: "ANALYTICS", collects_persistent_identifier: true, placement_area: "CHILD_DIRECTED_AREA" }
              as: ComplianceOfficer
              captures: { int_id: $.data.id, int_status: $.data.status }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], disclosed_integration_vendors: ["Kid Metrics"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_0: $.data.third_party_exposure_points, open_0: $.data.open_audit_count, posture_0: $.data.compliance_posture, decisions_0: $.data.audit_decision_count, runs_0: $.data.compliance_run_sequence }
            - call: "POST /third-party-integrations/${int_id}/status"
              payload: { to_status: "AUDIT_PENDING" }
              as: ComplianceOfficer
              captures: { int_pending: $.data.status }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_1: $.data.third_party_exposure_points, open_1: $.data.open_audit_count, posture_1: $.data.compliance_posture, runs_1: $.data.compliance_run_sequence }
            - call: "POST /third-party-integrations/${int_id}/status"
              payload: { to_status: "APPROVED" }
              as: ComplianceOfficer
              captures: { int_approved: $.data.status }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { exposure_2: $.data.third_party_exposure_points, open_2: $.data.open_audit_count, posture_2: $.data.compliance_posture, decisions_2: $.data.audit_decision_count, runs_2: $.data.compliance_run_sequence }
            - call: "POST /online-services/${svc_id}/posture"
              payload: { posture_override: "FROZEN" }
              as: ComplianceOfficer
              captures: { posture_in_write_response: $.data.compliance_posture, exposure_in_write_response: $.data.third_party_exposure_points }
            - call: "POST /online-services/${svc_id}/posture"
              payload: { posture_override: null }
              as: ComplianceOfficer
              captures: { posture_cleared: $.data.compliance_posture, override_cleared: $.data.posture_override }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture_final: $.data.compliance_posture, exposure_final: $.data.third_party_exposure_points, runs_final: $.data.compliance_run_sequence }
          assert:
            - "${det_status} == MIXED_AUDIENCE with ${det_score} == 0.60, and ${int_status} == DECLARED"
            - "${exposure_0} == 0, ${open_0} == 0, ${posture_0} == OPEN, ${decisions_0} == 0, ${runs_0} == 0 (a DECLARED integration contributes no points and opens no audit)"
            - "${int_pending} == AUDIT_PENDING, and the very next read already shows ${open_1} == 1 with ${posture_1} == RESTRICTED while ${exposure_1} == 0 and ${runs_1} == 0"
            - "${int_approved} == APPROVED, and the very next read shows ${exposure_2} == 30 (ANALYTICS 15 x 2 for the persistent identifier), ${open_2} == 0, ${decisions_2} == 1, ${posture_2} == OPEN because 30 < 40 — no compliance run was needed, ${runs_2} == 0"
            - "${posture_in_write_response} == FROZEN and ${exposure_in_write_response} == 30 — the write response itself carries the recomputed posture, so no follow-up read is required"
            - "${posture_cleared} == OPEN with ${override_cleared} == null (clearing the override falls straight back to the ladder)"
            - "${posture_final} == OPEN, ${exposure_final} == 30 and ${runs_final} == 0 — every one of these transitions was immediately consistent"






