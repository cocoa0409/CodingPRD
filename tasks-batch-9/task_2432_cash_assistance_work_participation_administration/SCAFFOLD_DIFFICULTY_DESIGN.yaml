  - rule_id: compensating_invariant
    instances:
      - name: voiding_a_partial_authorization_restores_the_transportation_fiscal_year_headroom
        grounds:
          - calculations.supportive_service_waterfall
          - state_machines.SupportiveServiceAuthorization.status
          - entities.AssistanceCase.fields.supportive_fy_authorized_cents
          - constants.SUPPORTIVE_CAPS_CENTS
        distinguishing_aspect: |
          The conserved quantity is money capacity per (case, service_type,
          fiscal_year): type_used + remaining_type == 60000 must hold after the
          first authorization (45000 + 15000), after the partial second one
          (60000 + 0) and again after the void (45000 + 15000). The void is the
          compensating action: it must return exactly the 15000 that was
          authorized, not the 30000 that was requested, so a later request can be
          authorized at 15000 again.
        test_recipe:
          setup:
