        distinguishing_aspect: "finalization requires the logical clock date to be strictly after period_end: with the clock at 2026-08-05 and period_end 2026-08-31 the call is HTTP 409 ERR_PERIOD_NOT_CLOSED, and advancing the clock to 2026-09-01 makes the same call succeed."
        test_recipe:
          setup:
