  # =========================================================================
  # Section: concurrency (from Cross-Cutting complexity layers: optimistic_concurrency)
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: patch_program_with_stale_expected_program_version_returns_412
        claim_type: occ_stale_version
        grounds:
          - concurrency_rules[program-patch-stale-version]
          - endpoints[PATCH /programs/{id}]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: "PATCH /programs/{id} with expected_program_version < program.version returns ERR_STALE_PROGRAM_VERSION / 412; two sequential PATCHes where the second still carries the version the client observed before the first are deterministically rejected."
        test_recipe:
          setup:
            - "Program PROG_v exists with version=1 (freshly created)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /funders"
              payload: { name: "F_v", fiscal_year_start_month: 7, grant_cents_total: 100000000, reporting_currency: "USD" }
              as: PlatformAdmin
              captures: { f_v_id: $.data.id }
            - call: "POST /providers"
              payload: { legal_name: "P_v", location_lat: 40.0, location_lng: -74.0, accessibility_features: ["WHEELCHAIR"], languages_supported: ["EN"] }
              as: PlatformAdmin
              captures: { p_v_id: $.data.id }
            - call: "POST /programs"
              payload: { provider_id: "${p_v_id}", funder_id: "${f_v_id}", category: "FOOD", eligibility_income_max_cents: 500000, eligibility_age_min: 18, eligibility_age_max: 65, unit_cost_cents: 10000, capacity_slots_total: 5 }
              as: PlatformAdmin
              captures: { prog_v_id: $.data.id, prog_v_v0: $.data.version }
            - call: "PATCH /programs/${prog_v_id}"
              payload: { expected_program_version: "${prog_v_v0}", unit_cost_cents: 15000 }
              as: PlatformAdmin
              captures: { prog_v_v1: $.data.version }
          trigger:
            - call: "PATCH /programs/${prog_v_id}"
              payload: { expected_program_version: "${prog_v_v0}", unit_cost_cents: 20000 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "After first PATCH: Program.${prog_v_id}.version == 2"
            - "Second PATCH still carrying expected_program_version=1 → error_id == ERR_STALE_PROGRAM_VERSION"
            - "HTTP status == 412"

