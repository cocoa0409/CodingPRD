            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /api/products/${pid}/racc-assignments", payload: { market_code: "CA_CFIA" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { ra: $.data.id } }
