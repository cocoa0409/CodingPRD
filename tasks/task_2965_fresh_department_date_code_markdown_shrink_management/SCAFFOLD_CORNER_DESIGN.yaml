            - "DateCodeLot.${lot_p2}.status == 'DONATED' with units_donated == 10 and quantity_on_hand == 0"
            - "DateCodeLot.${lot_p1}.status == 'WITHDRAWN'"
            - "partner read: data.pickups_completed_count == 1 and data.units_received_total == 10"

  - section: validations
    instances:
      - name: duplicate_upc_inside_one_department_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 40]
          - errors[ERR_ITEM_UPC_DUPLICATE]
          - entities.Item.fields.upc
        distinguishing_aspect: |
          The uniqueness key is (department_id, upc): re-posting the same UPC into the same
          department is ERR_ITEM_UPC_DUPLICATE (409) and the department still holds exactly one
          item.
        test_recipe:
          setup:
            - "The MEAT base chain up to one item with UPC 000111222333."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
            - call: "POST /fresh/markdown-ladders/${ladder_id}/activate"
              payload: {}
              as: StoreOperationsAdmin
            - call: "POST /fresh/departments"
              payload: { store_id: "${store_id}", markdown_ladder_id: "${ladder_id}", code: "MEAT", shelf_life_days_default: 10 }
              as: StoreOperationsAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz", base_retail_cents: 599, unit_cost_cents: 420, daily_forecast_units: 4.00 }
              as: DepartmentManager
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /fresh/items"
              payload: { department_id: "${dept_id}", upc: "000111222333", description: "Ribeye Steak 12oz (relabel)", base_retail_cents: 649, unit_cost_cents: 430, daily_forecast_units: 3.00 }
              as: DepartmentManager
          assert:
            - "HTTP status is 409"
            - "data.error_id == 'ERR_ITEM_UPC_DUPLICATE'"
            - "GET /fresh/items?department_id=${dept_id} returns total_count == 1 and data[0].id == ${item_id}"
            - "Item.${item_id}.base_retail_cents == 599 (the rejected create overwrote nothing)"

      - name: same_upc_in_a_different_department_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 40]
          - entities.Item.fields.upc
          - entities.Department.fields.code
        distinguishing_aspect: |
          The uniqueness scope stops at the department: the identical UPC 000111222333 that is a
          409 inside MEAT is a clean 201 inside DELI, and each department then lists exactly one
          item.
        test_recipe:
          setup:
            - "Store 0412 with two ACTIVE ladders, MEAT-STD-2026 and DELI-STD-2026, and one department for each."
            - "One MEAT item already carries UPC 000111222333."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
