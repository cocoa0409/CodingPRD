      - name: corner_mode_share_survey_computes_both_variants_and_trend
        claim_type: correct_result
        grounds:
          - calculations.walk_bike_mode_share
          - endpoints.POST_/srts/schools/{id}/mode-share-surveys
        distinguishing_aspect: |
          One survey append writes four derived fields from two different denominators:
          responses = 120 + 40 + 150 + 160 + 30 = 500 gives RAW_TALLY
          100 * 160 / 500 = 32.00, while enrollment_at_survey 640 gives
          ENROLLMENT_WEIGHTED 100 * 160 / 640 = 25.00. The trend is 32.00 - 18.50 = 13.50,
          and latest_survey_term_code becomes 2026FA. The 7.00-point gap between the two
          stored shares is the non-response inflation and must be visible in the SAME
          response body.
        test_recipe:
          setup:
            - "One school with baseline_walk_bike_mode_share_pct 18.50 and no surveys yet."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /srts/schools/${school_id}/mode-share-surveys"
              payload: { term_code: "2026FA", survey_date: "2026-10-01", classrooms_reporting: 24, enrollment_at_survey: 640, walk_count: 120, bike_count: 40, bus_count: 150, car_count: 160, other_count: 30 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
          assert:
            - "response returns HTTP 200"
            - "School.${school_id}.walk_bike_mode_share_pct == 32.00"
            - "School.${school_id}.walk_bike_mode_share_weighted_pct == 25.00"
            - "School.${school_id}.mode_share_trend_pct == 13.50"
            - "School.${school_id}.latest_survey_term_code == 2026FA"
            - "School.${school_id}.mode_share_surveys has length 1 with recorded_at == 2026-08-01T00:00:00Z"

      - name: corner_trend_reads_raw_tally_and_latest_survey_only
        claim_type: variant_selection
        grounds:
          - calculations.walk_bike_mode_share.variant_selection
          - calculations.walk_bike_mode_share.constants.TREND_BASIS_VARIANT
          - calculations.walk_bike_mode_share.input_set
        distinguishing_aspect: |
          Two independent selections are asserted at once. (1) TREND_BASIS_VARIANT is
          RAW_TALLY: after the 2027SP survey the trend must be 24.00 - 18.50 = 5.50, not
          the weighted-based 20.00 - 18.50 = 1.50. (2) The projection reads the LATEST
          survey by survey_date DESC, never an average and never the most recently
          appended row: appending an out-of-order 2026-09-15 survey whose own RAW share is
          60.00 must leave all four derived fields sitting on the 2027SP figures, with the
          history array grown to length 3.
        test_recipe:
          setup:
            - "School with baseline 18.50 holding two surveys: 2026FA (2026-10-01, RAW 32.00) then 2027SP (2027-02-02, RAW 24.00 / weighted 20.00)."
          setup_api_calls:
            - call: "POST /srts/schools"
              payload: { name: "Maple Grove Elementary", district_code: "D-07", enrollment_count: 640, session_start_date: "2026-08-24", session_end_date: "2027-06-11", am_window_start_utc: "07:15", am_window_end_utc: "08:15", pm_window_start_utc: "14:45", pm_window_end_utc: "15:45", baseline_walk_bike_mode_share_pct: 18.50 }
              as: ProgramAdmin
              as_user_id: "adm-1"
              captures: { school_id: $.data.id }
            - call: "POST /srts/schools/${school_id}/mode-share-surveys"
              payload: { term_code: "2026FA", survey_date: "2026-10-01", classrooms_reporting: 24, enrollment_at_survey: 640, walk_count: 120, bike_count: 40, bus_count: 150, car_count: 160, other_count: 30 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
            - call: "POST /srts/schools/${school_id}/mode-share-surveys"
              payload: { term_code: "2027SP", survey_date: "2027-02-02", classrooms_reporting: 24, enrollment_at_survey: 600, walk_count: 90, bike_count: 30, bus_count: 140, car_count: 200, other_count: 40 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
          trigger:
            - call: "GET /srts/schools/${school_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "adm-1"
            - call: "POST /srts/schools/${school_id}/mode-share-surveys"
              payload: { term_code: "2026SU", survey_date: "2026-09-15", classrooms_reporting: 20, enrollment_at_survey: 500, walk_count: 200, bike_count: 100, bus_count: 100, car_count: 80, other_count: 20 }
              as: SchoolLiaison
              as_user_id: "${school_id}"
          assert:
            - "first trigger call shows walk_bike_mode_share_pct 24.00, walk_bike_mode_share_weighted_pct 20.00, mode_share_trend_pct 5.50 (NOT 1.50) and latest_survey_term_code 2027SP"
            - "second trigger call returns HTTP 200 and School.${school_id}.mode_share_surveys has length 3"
            - "after the out-of-order append the derived fields are UNCHANGED: 24.00 / 20.00 / 5.50 / 2027SP — the 60.00 RAW share of the 2026SU survey is never adopted"

