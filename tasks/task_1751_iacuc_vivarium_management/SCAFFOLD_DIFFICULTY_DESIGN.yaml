            - "Wean at exactly 2026-08-22T00:00:00Z succeeds (inclusive boundary)"
            - "Litter.state == WEANED and weaned_count == 4"


  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (2 instances, different pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
