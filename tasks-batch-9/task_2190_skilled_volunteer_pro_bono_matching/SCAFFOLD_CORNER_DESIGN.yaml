        distinguishing_aspect: "A NOT_STARTED engagement legitimately has zero agreements: the listing is HTTP 200 with total_count 0 (the documented 'length 0 or 1' lower bound), and the consequence is visible - POST /engagements/{id}/start fails with ERR_AGREEMENT_NOT_EXECUTED because there is no governing agreement at all."
