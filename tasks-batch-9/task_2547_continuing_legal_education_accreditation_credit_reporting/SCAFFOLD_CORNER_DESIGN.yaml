            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "On Demand Evidence Review", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2026-05-05T00:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2011", full_name: "Noel Bright", admission_date: "2006-03-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${ca_id}", verification_method: "CERTIFICATE", attended_minutes: 300, completion_date: "2026-06-06T00:00:00Z", certificate_reference: "CERT-3002" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rec1_id: $.data.id }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "SUSPEND", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
              captures: { prov_v3: $.data.version }
          trigger:
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "REINSTATE", expected_provider_version: "${prov_v3}" }
              as: BoardAdmin
