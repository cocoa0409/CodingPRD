            - { call: "POST /trade-accounts/${tid}/verify", payload: { decision: "APPROVE", tier: "TIER_1" }, as: Member, as_user_id: "${mid}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN and HTTP 403"

      - name: production_planner_cannot_confirm_order
        claim_type: role_denial
        grounds: [roles.ProductionPlanner, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "ProductionPlanner manages slots but cannot confirm orders; denied ERR_FORBIDDEN."
        test_recipe:
          setup: ["retail guest QUOTE order with one stock line"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery R3", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "R3-01", name: "R3", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
          trigger:
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN and HTTP 403"

      - name: huboperator_cannot_settle_return
        claim_type: role_denial
        grounds: [roles.HubOperator, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Settling returns is exclusive to GalleryAssociate; HubOperator is denied ERR_FORBIDDEN."
        test_recipe:
          setup: ["stock order delivered 2026-09-05; return REQUESTED"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery R4", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "R4-01", name: "R4", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate, captures: { lid: $.data.id } }
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: GalleryAssociate }
            - { call: "POST /delivery-appointments", payload: { order_id: "${oid}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 60, room_placement: false, assembly_required: false }, as: GalleryAssociate, captures: { aid: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "POST /delivery-appointments/${aid}/record-outcome", payload: { outcome: "COMPLETED", packaging_removed: false }, as: HubOperator }
            - { call: "POST /returns", payload: { order_id: "${oid}", order_line_ids: ["${lid}"] }, as: GalleryAssociate, captures: { rid: $.data.id } }
          trigger:
            - { call: "POST /returns/${rid}/settle", payload: { decision: "APPROVE" }, as: HubOperator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN and HTTP 403"

  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_rejected_on_confirmed_amendment
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-line-add-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "On a CONFIRMED order, a line addition carrying the pre-amendment expected_order_version is rejected 412 ERR_STALE_VERSION after a first amendment advanced the version."
        test_recipe:
          setup: ["retail guest CONFIRMED order with one custom line (deposit 60000 paid); version captured after confirm"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery X1", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "X1-01", name: "X1c", list_price_cents: 120000, line_kind: "CUSTOM" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /products", payload: { sku: "X1-02", name: "X1s", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pids: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
            - { call: "POST /orders/${oid}/confirm", payload: { deposit_payment_cents: 60000 }, as: GalleryAssociate, captures: { ovar: $.data.version } }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pids}", qty: 1, expected_order_version: "${ovar}" }, as: GalleryAssociate, captures: { lid2: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pids}", qty: 1, expected_order_version: "${ovar}" }, as: GalleryAssociate, captures: { err: $.data.error_id } }
          assert:
            - "First amendment succeeds with expected_order_version == observed version (order.version advanced by 1)"
            - "Second amendment with the same stale expected_order_version: error_id == ERR_STALE_VERSION and HTTP 412"

      - name: occ_ignored_for_quote_orders
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-line-add-stale-order]"]
        distinguishing_aspect: "In QUOTE the expected_order_version field is optional and ignored: omitting it never fails, and line additions still re-price (version increments do not block)."
        test_recipe:
          setup: ["retail guest QUOTE order with one stock line"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery X2", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "X2-01", name: "X2", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
          trigger:
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 2 }, as: GalleryAssociate, captures: { lid: $.data.id } }
          assert:
            - "Second line addition succeeds without expected_order_version while order is QUOTE"

      - name: ops_run_dispatches_due_appointment
        claim_type: scheduled_actions
        grounds: [state_machines.DeliveryAppointment.SCHEDULED_to_OUT_FOR_DELIVERY, endpoints.POST_/_ops/run_daily_cycle]
        distinguishing_aspect: "The ops-run checkpoint advances SCHEDULED appointments whose delivery_date has been reached by the logical clock to OUT_FOR_DELIVERY."
        test_recipe:
          setup: ["stock order READY_FOR_DELIVERY with appointment dated 2026-09-05; clock advanced to 2026-09-05"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery X3", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "X3-01", name: "X3", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: GalleryAssociate }
            - { call: "POST /delivery-appointments", payload: { order_id: "${oid}", gallery_id: "${gid}", delivery_date: "2026-09-05", duration_minutes: 60, room_placement: true, assembly_required: true }, as: GalleryAssociate, captures: { aid: $.data.id, st0: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T08:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "GET /delivery-appointments/${aid}", payload: {}, as: PlatformAdmin, captures: { st1: $.data.status } }
          assert:
            - "Appointment.${aid} was SCHEDULED at creation and is OUT_FOR_DELIVERY after the cycle"

      - name: second_sourcebook_release_archives_first
        claim_type: cascading_side_effects
        grounds: [state_machines.SourceBook.RELEASED_to_ARCHIVED, entities.Product.fields.promo_active]
        distinguishing_aspect: "Releasing a newer source book archives the previously RELEASED one and flips promo_active off for products listed only in the older book."
        test_recipe:
          setup: ["P1 and P2; SB1 [P1] released at clock 2026-09-22; SB2 [P2] created with print_ready 2026-09-02; clock advanced to 2026-09-23"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "X4-01", name: "X4a", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { p1: $.data.id } }
            - { call: "POST /products", payload: { sku: "X4-02", name: "X4b", list_price_cents: 10000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { p2: $.data.id } }
            - { call: "POST /source-books", payload: { title: "SB1", product_ids: ["${p1}"], print_ready_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin, captures: { sb1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "POST /source-books", payload: { title: "SB2", product_ids: ["${p2}"], print_ready_date: "2026-09-02T00:00:00Z" }, as: PlatformAdmin, captures: { sb2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-23T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /_ops/run_daily_cycle", payload: {}, as: PlatformAdmin }
            - { call: "GET /products/${p1}", payload: {}, as: PlatformAdmin, captures: { pr1: $.data.promo_active } }
            - { call: "GET /products/${p2}", payload: {}, as: PlatformAdmin, captures: { pr2: $.data.promo_active } }
          assert:
            - "Product.${p1}.promo_active == false (SB1 archived by SB2's release)"
            - "Product.${p2}.promo_active == true"

  - section: consistency_model
    instances:
      - name: confirm_response_reflects_final_totals_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, endpoints.POST_/orders/confirm]
        distinguishing_aspect: "Immediate consistency: the confirm response body itself carries the final settled total (219900 = 200000 + 19900) and READY_FOR_DELIVERY status with no follow-up read required."
        test_recipe:
          setup: ["retail guest QUOTE order with one stock line list 200000"]
          setup_api_calls:
            - { call: "POST /galleries", payload: { name: "Gallery S1", region: "WEST", daily_route_minutes_capacity: 480 }, as: PlatformAdmin, captures: { gid: $.data.id } }
            - { call: "POST /products", payload: { sku: "S1-01", name: "S1", list_price_cents: 200000, line_kind: "STOCK" }, as: PlatformAdmin, captures: { pid: $.data.id } }
            - { call: "POST /orders", payload: { gallery_id: "${gid}" }, as: GalleryAssociate, captures: { oid: $.data.id } }
            - { call: "POST /orders/${oid}/lines", payload: { product_id: "${pid}", qty: 1 }, as: GalleryAssociate }
          trigger:
            - { call: "POST /orders/${oid}/confirm", payload: {}, as: GalleryAssociate, captures: { tot: $.data.total_cents, st: $.data.status, sub: $.data.subtotal_cents, fee: $.data.white_glove_fee_cents } }
          assert:
            - "Confirm response: subtotal_cents == 200000, white_glove_fee_cents == 19900, total_cents == 219900, status == READY_FOR_DELIVERY"
