scenario: |
  1113. Construction Schedule & Delay Claim Analysis (construction scheduling consultant):
  baseline CPM schedule development & activity logic, monthly update with actual progress
  & critical path shift, time impact analysis for change events, concurrent delay & float
  ownership determination, acceleration directive & cost recovery, notice requirements &
  contemporaneous documentation, extension of time request & owner response, liquidated
  damages exposure.

domain_name: construction-schedule-delay
api_prefix: /construction-projects

complexity_profile:
  primary_archetype: graph_constraint
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - temporal_windowing
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ConstructionProject
    parent: null
    common_fields: true
    fields:
      - { name: project_name, type: string, source: input, description: "Human-readable project name" }
      - { name: contract_start_date, type: datetime, source: input, description: "Notice-to-proceed date (ISO8601 UTC)" }
      - { name: contract_completion_date, type: datetime, source: input, description: "Contractual substantial-completion date" }
      - { name: current_completion_date, type: datetime, source: computed, description: "contract_completion_date + sum(APPROVED EOT durations); recomputed on each EOT approval" }
      - { name: liquidated_damages_daily_rate_cents, type: integer, source: input, description: "Per-calendar-day LD rate stipulated in contract, in cents" }
      - { name: ld_cap_cents, type: integer, source: input, description: "Aggregate LD cap (cents); assessment MAY NOT exceed this" }
      - { name: float_ownership_policy, type: enum, source: input, default: "CONTRACTOR_OWNS", description: "CONTRACTOR_OWNS | OWNER_OWNS | SHARED_FIRST_COME; determines who absorbs float consumption" }
      - { name: notice_window_days, type: integer, source: input, default: 21, description: "Calendar days from delay event start within which written notice must be lodged; late notice forfeits time (cost may still be evaluated per policy)" }
      - { name: status, type: enum, source: system, description: "PRECONSTRUCTION → ACTIVE → SUBSTANTIALLY_COMPLETE → CLOSED" }

  - name: ScheduleVersion
    parent: ConstructionProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConstructionProject.id; owning project" }
      - { name: kind, type: enum, source: input, description: "BASELINE | UPDATE; exactly one ACCEPTED BASELINE per project" }
      - { name: data_date, type: datetime, source: input, description: "Cutoff date up to which actuals are reported (UPDATE) or schedule origin (BASELINE)" }
      - { name: revision_number, type: integer, source: system, description: "Per-kind monotonically increasing counter starting at 1" }
      - { name: supersedes_version_id, type: string, source: input, description: "FK -> ScheduleVersion.id; for UPDATEs, the prior UPDATE this replaces; null for BASELINE" }
      - { name: projected_finish_date, type: datetime, source: computed, description: "Max EF over terminal activities; from CPM pass" }
      - { name: critical_path_activity_count, type: integer, source: computed, description: "Count of activities with total_float_days == 0 under the active critical-path variant" }
      - { name: total_activities, type: integer, source: computed, description: "Count of activities in this version" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → ACCEPTED | REJECTED; REJECTED → DRAFT allowed (revision cycle)" }

  - name: Activity
    parent: ScheduleVersion
    common_fields: true
    fields:
      - { name: schedule_version_id, type: string, source: system, description: "FK -> ScheduleVersion.id" }
      - { name: activity_code, type: string, source: input, description: "Contractor's activity ID (e.g., 'A1010'); unique within schedule_version" }
      - { name: description, type: string, source: input, description: "Activity scope text" }
      - { name: original_duration_days, type: integer, source: input, description: "Planned duration in calendar days (>0)" }
      - { name: remaining_duration_days, type: integer, source: input, description: "Days of work remaining (<= original_duration_days); refreshed on each progress update" }
      - { name: percent_complete, type: number, source: input, default: 0, description: "0..100 inclusive" }
      - { name: actual_start, type: datetime, source: input, description: "Nullable; stamped when progress first reports percent_complete > 0" }
      - { name: actual_finish, type: datetime, source: input, description: "Nullable; stamped when percent_complete reaches 100" }
      - { name: early_start, type: datetime, source: computed, description: "From CPM forward pass" }
      - { name: early_finish, type: datetime, source: computed, description: "early_start + (percent_complete==100 ? 0 : remaining_duration_days)" }
      - { name: late_start, type: datetime, source: computed, description: "From CPM backward pass" }
      - { name: late_finish, type: datetime, source: computed, description: "late_start + remaining_duration_days" }
      - { name: total_float_days, type: integer, source: computed, description: "late_finish - early_finish (calendar days); 0 indicates critical" }
      - { name: is_critical, type: boolean, source: computed, description: "true iff total_float_days == 0 under active critical-path variant" }

  - name: ActivityRelationship
    parent: ScheduleVersion
    common_fields: false
    fields:
      - { name: schedule_version_id, type: string, source: system, description: "FK -> ScheduleVersion.id" }
      - { name: predecessor_activity_id, type: string, source: input, description: "FK -> Activity.id; must belong to same schedule_version" }
      - { name: successor_activity_id, type: string, source: input, description: "FK -> Activity.id; must belong to same schedule_version and != predecessor" }
      - { name: relationship_type, type: enum, source: input, description: "FS | SS | FF | SF" }
      - { name: lag_days, type: integer, source: input, default: 0, description: "Signed lag in calendar days" }

  - name: ProgressUpdate
    parent: ScheduleVersion
    common_fields: true
    fields:
      - { name: schedule_version_id, type: string, source: system, description: "FK -> ScheduleVersion.id; must be an UPDATE version" }
      - { name: reporting_period_end, type: datetime, source: input, description: "Month-end cutoff" }
      - { name: submitted_by_contractor_user_id, type: string, source: input, description: "Opaque contractor user ID" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → APPROVED | REJECTED; REJECTED → DRAFT (rework)" }

  - name: ProgressEntry
    parent: ProgressUpdate
    common_fields: false
    fields:
      - { name: progress_update_id, type: string, source: system, description: "FK -> ProgressUpdate.id" }
      - { name: activity_id, type: string, source: input, description: "FK -> Activity.id; must belong to the ProgressUpdate's schedule_version" }
      - { name: percent_complete, type: number, source: input, description: "0..100" }
      - { name: remaining_duration_days, type: integer, source: input, description: ">=0; 0 iff percent_complete == 100" }
      - { name: actual_start, type: datetime, source: input, description: "Nullable; required if percent_complete > 0" }
      - { name: actual_finish, type: datetime, source: input, description: "Nullable; required iff percent_complete == 100" }

  - name: DelayEvent
    parent: ConstructionProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConstructionProject.id" }
      - { name: title, type: string, source: input, description: "Short title of the change/delay event" }
      - { name: causation, type: enum, source: input, description: "OWNER_CAUSED | CONTRACTOR_CAUSED | THIRD_PARTY | FORCE_MAJEURE" }
      - { name: event_start_date, type: datetime, source: input, description: "First day of impact" }
      - { name: event_end_date, type: datetime, source: input, description: "Last day of impact; null for ongoing" }
      - { name: notice_submitted_at, type: datetime, source: system, description: "Stamped at NOTICED transition" }
      - { name: notice_within_window, type: boolean, source: computed, description: "true iff notice_submitted_at - event_start_date <= project.notice_window_days" }
      - { name: fragnet_activity_ids, type: array, source: input, description: "List of Activity ids inserted as fragnet into the accepted UPDATE schedule for TIA" }
      - { name: fragnet_inserted_into_version_id, type: string, source: input, description: "FK -> ScheduleVersion.id; the UPDATE against which TIA is computed" }
      - { name: tia_prolongation_days_prospective, type: integer, source: computed, description: "Fragnet-insertion result vs. unimpacted projected_finish_date" }
      - { name: tia_prolongation_days_retrospective, type: integer, source: computed, description: "Time-slice windows result vs. unimpacted as-built" }
      - { name: apportioned_compensable_days, type: integer, source: computed, description: "After concurrency + causation split" }
      - { name: apportioned_excusable_non_compensable_days, type: integer, source: computed, description: "Concurrent w/ contractor delay or force majeure w/o owner concurrency" }
      - { name: apportioned_non_excusable_days, type: integer, source: computed, description: "Contractor-caused portion" }
      - { name: status, type: enum, source: system, description: "DRAFT → NOTICED → TIA_SUBMITTED → TIA_ACCEPTED | TIA_REJECTED; TIA_REJECTED → NOTICED (resubmit)" }

  - name: TimeExtensionRequest
    parent: ConstructionProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConstructionProject.id" }
      - { name: delay_event_id, type: string, source: input, description: "FK -> DelayEvent.id; must be TIA_ACCEPTED" }
      - { name: requested_days, type: integer, source: input, description: ">0; equals delay_event.apportioned_excusable+compensable" }
      - { name: approved_days, type: integer, source: system, description: "Owner's determination; <= requested_days" }
      - { name: cost_recovery_cents, type: integer, source: input, description: "Associated prolongation cost sought (compensable portion only)" }
      - { name: awarded_cost_cents, type: integer, source: system, description: "Owner's award on approval" }
      - { name: submission_round, type: integer, source: system, description: "1 on first submission; increments on each DENIED → SUBMITTED appeal" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → UNDER_REVIEW → APPROVED | PARTIALLY_APPROVED | DENIED; DENIED → SUBMITTED (appeal)" }

  - name: AccelerationDirective
    parent: ConstructionProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConstructionProject.id" }
      - { name: directive_reference, type: string, source: input, description: "Owner's directive identifier" }
      - { name: issued_at, type: datetime, source: system, description: "Stamped at ISSUED" }
      - { name: directed_completion_date, type: datetime, source: input, description: "Date owner now demands" }
      - { name: baseline_completion_date, type: datetime, source: computed, description: "project.current_completion_date at time of issuance (snapshot)" }
      - { name: days_to_recover, type: integer, source: computed, description: "baseline_completion_date - directed_completion_date (positive = acceleration demanded)" }
      - { name: actual_cost_cents, type: integer, source: input, description: "Documented actual acceleration cost (overtime, premium freight, etc.)" }
      - { name: measured_mile_cost_cents, type: integer, source: input, description: "Cost via measured-mile analysis (productivity delta × unimpacted rate)" }
      - { name: recovered_cost_cents, type: integer, source: system, description: "Amount owner agrees to pay under the selected recovery variant" }
      - { name: recovery_variant, type: enum, source: system, description: "ACTUAL_COST | MEASURED_MILE; owner picks at RESOLVED" }
      - { name: status, type: enum, source: system, description: "ISSUED → ACKNOWLEDGED → PERFORMING → COMPLETED | DISPUTED; DISPUTED → UNDER_NEGOTIATION → RESOLVED" }

  - name: LiquidatedDamagesAssessment
    parent: ConstructionProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> ConstructionProject.id" }
      - { name: assessment_period_start, type: datetime, source: input, description: "First day for which LDs are sought" }
      - { name: assessment_period_end, type: datetime, source: input, description: "Last day for which LDs are sought (inclusive)" }
      - { name: culpable_days, type: integer, source: computed, description: "Calendar days in period attributable to contractor (projected_finish - current_completion_date, clipped to period)" }
      - { name: gross_ld_cents, type: integer, source: computed, description: "culpable_days * liquidated_damages_daily_rate_cents" }
      - { name: assessed_ld_cents, type: integer, source: computed, description: "min(gross_ld_cents, project.ld_cap_cents - prior_assessed_total)" }
      - { name: prior_assessed_total_cents, type: integer, source: computed, description: "Sum of assessed_ld_cents over prior UPHELD/ASSESSED assessments on this project" }
      - { name: status, type: enum, source: system, description: "PROPOSED → ASSESSED | WAIVED | OFFSET_BY_EOT; ASSESSED → APPEALED → UPHELD | REDUCED | REVERSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ConstructionProject
    initial_state: PRECONSTRUCTION
    terminal_states: [CLOSED]
    transitions:
      - from: PRECONSTRUCTION
        to: ACTIVE
        trigger: "POST /construction-projects/{projectId}/activate (auto-fires when first BASELINE schedule_version is ACCEPTED)"
        actor: ProjectControlsEngineer
        preconditions:
          - "Project in PRECONSTRUCTION (ERR_INVALID_STATE)"
          - "An ACCEPTED BASELINE ScheduleVersion exists for project (ERR_BASELINE_NOT_ACCEPTED)"
        side_effects:
          - "current_completion_date := contract_completion_date"

      - from: ACTIVE
        to: SUBSTANTIALLY_COMPLETE
        trigger: "POST /construction-projects/{projectId}/declare-substantial-completion"
        actor: OwnerRepresentative
        preconditions:
          - "Project in ACTIVE (ERR_INVALID_STATE)"
          - "Every Activity in the latest ACCEPTED UPDATE has percent_complete == 100 (ERR_ACTIVITIES_INCOMPLETE)"
        side_effects:
          - "Any PROPOSED LiquidatedDamagesAssessment whose assessment_period_end >= today transitions to ASSESSED (LD auto-assess at SC)"

      - from: SUBSTANTIALLY_COMPLETE
        to: CLOSED
        trigger: "POST /construction-projects/{projectId}/close"
        actor: OwnerRepresentative
        preconditions:
          - "Project in SUBSTANTIALLY_COMPLETE (ERR_INVALID_STATE)"
          - "All TimeExtensionRequests in {APPROVED, PARTIALLY_APPROVED, DENIED} (terminal) (ERR_CLAIMS_OPEN)"
          - "All AccelerationDirectives in {COMPLETED, RESOLVED} (ERR_ACCELERATION_OPEN)"
          - "All LiquidatedDamagesAssessments in {ASSESSED, WAIVED, OFFSET_BY_EOT, UPHELD, REDUCED, REVERSED} (ERR_LD_OPEN)"
        side_effects: []

  - entity: ScheduleVersion
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /construction-projects/{pid}/schedule-versions/{vid}/submit"
        actor: ContractorScheduler
        preconditions:
          - "ScheduleVersion in DRAFT (ERR_INVALID_STATE)"
          - "Activity count > 0 (ERR_EMPTY_SCHEDULE)"
          - "CPM pass completes without cycle (ERR_CYCLE_DETECTED)"
        side_effects:
          - "Run cpm_forward_backward_pass; persist ES/EF/LS/LF/TF on every Activity"
          - "Run critical_path_identification under project's active variant; set is_critical, critical_path_activity_count, projected_finish_date"
          - "If kind == UPDATE: recompute project.current_completion_date drift (no side effect to project yet — only on ACCEPTED)"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /construction-projects/{pid}/schedule-versions/{vid}/accept"
        actor: ProjectControlsEngineer
        preconditions:
          - "ScheduleVersion in SUBMITTED (ERR_INVALID_STATE)"
          - "OCC: payload expected_project_version == project.version (ERR_STALE_VERSION)"
          - "If kind == BASELINE: no other ACCEPTED BASELINE exists (ERR_BASELINE_ALREADY_ACCEPTED)"
          - "If kind == UPDATE: an ACCEPTED BASELINE exists (ERR_BASELINE_NOT_ACCEPTED)"
        side_effects:
          - "If kind == BASELINE and project.status == PRECONSTRUCTION: auto-fire project activation chain"
          - "If kind == UPDATE: replace prior ACCEPTED UPDATE (prior stays ACCEPTED historically but only latest is 'current'); recompute project.current_completion_date by re-running critical_path_identification against approved EOTs"
          - "Increments project.version by 1"
          - "Bubbles up: any DelayEvent whose fragnet_inserted_into_version_id == this version gets tia_prolongation_days_* recomputed"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /construction-projects/{pid}/schedule-versions/{vid}/reject"
        actor: ProjectControlsEngineer
        preconditions:
          - "ScheduleVersion in SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Clear all computed Activity date/float fields (so a resubmission recomputes cleanly)"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /construction-projects/{pid}/schedule-versions/{vid}/revise"
        actor: ContractorScheduler
        preconditions:
          - "ScheduleVersion in REJECTED (ERR_INVALID_STATE)"
        side_effects:
          - "revision_number incremented by 1"

  - entity: ProgressUpdate
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/submit"
        actor: ContractorScheduler
        preconditions:
          - "ProgressUpdate in DRAFT (ERR_INVALID_STATE)"
          - "Parent ScheduleVersion is ACCEPTED UPDATE (ERR_SCHEDULE_NOT_ACCEPTED)"
          - "Every ProgressEntry references an Activity in the parent version (ERR_ACTIVITY_NOT_IN_VERSION)"
        side_effects: []

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/approve"
        actor: ProjectControlsEngineer
        preconditions:
          - "ProgressUpdate in SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Apply each ProgressEntry: write percent_complete, remaining_duration_days, actual_start, actual_finish onto Activity"
          - "Run cpm_forward_backward_pass on parent ScheduleVersion (recompute floats and projected_finish_date)"
          - "If projected_finish_date crosses project.current_completion_date: cascade create a PROPOSED LiquidatedDamagesAssessment for the overrun window"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/reject"
        actor: ProjectControlsEngineer
        preconditions:
          - "ProgressUpdate in SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: REJECTED
        to: DRAFT
        trigger: "POST /construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/revise"
        actor: ContractorScheduler
        preconditions:
          - "ProgressUpdate in REJECTED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: DelayEvent
    initial_state: DRAFT
    terminal_states: [TIA_ACCEPTED]
    transitions:
      - from: DRAFT
        to: NOTICED
        trigger: "POST /construction-projects/{pid}/delay-events/{did}/notice"
        actor: ContractorScheduler
        preconditions:
          - "DelayEvent in DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "notice_submitted_at := current logical clock"
          - "Compute notice_within_window vs project.notice_window_days"
          - "If !notice_within_window and causation in {OWNER_CAUSED, THIRD_PARTY}: flag forfeiture of time component (cost may still be evaluated); no error raised at this step"

      - from: NOTICED
        to: TIA_SUBMITTED
        trigger: "POST /construction-projects/{pid}/delay-events/{did}/tia/submit"
        actor: ContractorScheduler
        preconditions:
          - "DelayEvent in NOTICED (ERR_INVALID_STATE)"
          - "fragnet_inserted_into_version_id is an ACCEPTED UPDATE (ERR_SCHEDULE_NOT_ACCEPTED)"
          - "fragnet_activity_ids non-empty and all reference Activities in fragnet_inserted_into_version_id (ERR_ACTIVITY_NOT_IN_VERSION)"
        side_effects:
          - "Run time_impact_analysis (both variants): persist tia_prolongation_days_prospective & _retrospective"
          - "Run concurrent_delay_apportionment: persist apportioned_*_days"

      - from: TIA_SUBMITTED
        to: TIA_ACCEPTED
        trigger: "POST /construction-projects/{pid}/delay-events/{did}/tia/accept"
        actor: ClaimsConsultant
        preconditions:
          - "DelayEvent in TIA_SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "If causation == OWNER_CAUSED and notice_within_window: eligible for compensable EOT"

      - from: TIA_SUBMITTED
        to: TIA_REJECTED
        trigger: "POST /construction-projects/{pid}/delay-events/{did}/tia/reject"
        actor: ClaimsConsultant
        preconditions:
          - "DelayEvent in TIA_SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: TIA_REJECTED
        to: NOTICED
        trigger: "POST /construction-projects/{pid}/delay-events/{did}/resubmit"
        actor: ContractorScheduler
        preconditions:
          - "DelayEvent in TIA_REJECTED (ERR_INVALID_STATE)"
        side_effects:
          - "Clear tia_prolongation_days_* and apportioned_*_days (recomputed on next TIA submission)"

  - entity: TimeExtensionRequest
    initial_state: DRAFT
    terminal_states: [APPROVED, PARTIALLY_APPROVED, DENIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /construction-projects/{pid}/eot-requests/{eid}/submit"
        actor: ContractorScheduler
        preconditions:
          - "TimeExtensionRequest in DRAFT (ERR_INVALID_STATE)"
          - "delay_event.status == TIA_ACCEPTED (ERR_TIA_NOT_ACCEPTED)"
          - "requested_days <= (apportioned_compensable_days + apportioned_excusable_non_compensable_days) of the linked DelayEvent (ERR_REQUESTED_DAYS_EXCEED_ENTITLEMENT)"
          - "If cost_recovery_cents > 0 then apportioned_compensable_days > 0 (ERR_NON_COMPENSABLE_COST)"
        side_effects:
          - "submission_round incremented if this is an appeal (DENIED → SUBMITTED); else 1"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /construction-projects/{pid}/eot-requests/{eid}/begin-review"
        actor: OwnerRepresentative
        preconditions:
          - "EOT in SUBMITTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /construction-projects/{pid}/eot-requests/{eid}/approve"
        actor: OwnerRepresentative
        preconditions:
          - "EOT in UNDER_REVIEW (ERR_INVALID_STATE)"
          - "Payload approved_days == requested_days (ERR_APPROVED_DAYS_MISMATCH)"
          - "Payload awarded_cost_cents == cost_recovery_cents if compensable (ERR_AWARD_MISMATCH)"
        side_effects:
          - "project.current_completion_date += approved_days"
          - "project.version incremented"
          - "Cascade: any PROPOSED LiquidatedDamagesAssessment whose assessment_period overlaps [old_current_completion, new_current_completion) transitions to OFFSET_BY_EOT"

      - from: UNDER_REVIEW
        to: PARTIALLY_APPROVED
        trigger: "POST /construction-projects/{pid}/eot-requests/{eid}/partial-approve"
        actor: OwnerRepresentative
        preconditions:
          - "EOT in UNDER_REVIEW (ERR_INVALID_STATE)"
          - "0 < approved_days < requested_days (ERR_INVALID_PARTIAL_DAYS)"
        side_effects:
          - "project.current_completion_date += approved_days"
          - "project.version incremented"
          - "Cascade: overlapping PROPOSED LDAs transition to OFFSET_BY_EOT (only for approved portion)"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /construction-projects/{pid}/eot-requests/{eid}/deny"
        actor: OwnerRepresentative
        preconditions:
          - "EOT in UNDER_REVIEW (ERR_INVALID_STATE)"
        side_effects: []

      - from: DENIED
        to: SUBMITTED
        trigger: "POST /construction-projects/{pid}/eot-requests/{eid}/appeal"
        actor: ContractorScheduler
        preconditions:
          - "EOT in DENIED (ERR_INVALID_STATE)"
          - "submission_round < 3 (ERR_APPEAL_LIMIT_REACHED)"
        side_effects:
          - "submission_round incremented"

  - entity: AccelerationDirective
    initial_state: ISSUED
    terminal_states: [COMPLETED, RESOLVED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /construction-projects/{pid}/acceleration-directives/{aid}/acknowledge"
        actor: ContractorScheduler
        preconditions:
          - "Directive in ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "Snapshot baseline_completion_date from project.current_completion_date"
          - "Compute days_to_recover"

      - from: ACKNOWLEDGED
        to: PERFORMING
        trigger: "POST /construction-projects/{pid}/acceleration-directives/{aid}/begin-performance"
        actor: ContractorScheduler
        preconditions:
          - "Directive in ACKNOWLEDGED (ERR_INVALID_STATE)"
        side_effects: []

      - from: PERFORMING
        to: COMPLETED
        trigger: "POST /construction-projects/{pid}/acceleration-directives/{aid}/complete"
        actor: ContractorScheduler
        preconditions:
          - "Directive in PERFORMING (ERR_INVALID_STATE)"
          - "actual_cost_cents and measured_mile_cost_cents populated (ERR_COST_DATA_MISSING)"
        side_effects:
          - "Owner selects recovery_variant ∈ {ACTUAL_COST, MEASURED_MILE} (default ACTUAL_COST)"
          - "recovered_cost_cents := selected variant's cost"
          - "If recovered_cost_cents > 0: credit contractor (no further cascade — billing out of scope)"

      - from: PERFORMING
        to: DISPUTED
        trigger: "POST /construction-projects/{pid}/acceleration-directives/{aid}/dispute"
        actor: ContractorScheduler
        preconditions:
          - "Directive in PERFORMING (ERR_INVALID_STATE)"
        side_effects: []

      - from: DISPUTED
        to: UNDER_NEGOTIATION
        trigger: "POST /construction-projects/{pid}/acceleration-directives/{aid}/negotiate"
        actor: OwnerRepresentative
        preconditions:
          - "Directive in DISPUTED (ERR_INVALID_STATE)"
        side_effects: []

      - from: UNDER_NEGOTIATION
        to: RESOLVED
        trigger: "POST /construction-projects/{pid}/acceleration-directives/{aid}/resolve"
        actor: OwnerRepresentative
        preconditions:
          - "Directive in UNDER_NEGOTIATION (ERR_INVALID_STATE)"
          - "Payload specifies recovery_variant and recovered_cost_cents (ERR_COST_DATA_MISSING)"
        side_effects:
          - "recovered_cost_cents := payload value"

  - entity: LiquidatedDamagesAssessment
    initial_state: PROPOSED
    terminal_states: [WAIVED, OFFSET_BY_EOT, UPHELD, REDUCED, REVERSED]
    transitions:
      - from: PROPOSED
        to: ASSESSED
        trigger: "POST /construction-projects/{pid}/ld-assessments/{lid}/assess (or system auto-assess at substantial completion)"
        actor: OwnerRepresentative
        preconditions:
          - "LDA in PROPOSED (ERR_INVALID_STATE)"
          - "culpable_days > 0 (ERR_NO_CULPABLE_DELAY)"
        side_effects:
          - "Compute gross_ld_cents := culpable_days * project.liquidated_damages_daily_rate_cents"
          - "Compute prior_assessed_total_cents := sum(assessed_ld_cents over other LDAs on project in {ASSESSED, UPHELD, REDUCED})"
          - "assessed_ld_cents := min(gross_ld_cents, max(0, project.ld_cap_cents - prior_assessed_total_cents))"

      - from: PROPOSED
        to: WAIVED
        trigger: "POST /construction-projects/{pid}/ld-assessments/{lid}/waive"
        actor: OwnerRepresentative
        preconditions:
          - "LDA in PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "assessed_ld_cents := 0"

      - from: PROPOSED
        to: OFFSET_BY_EOT
        trigger: "system (auto when EOT approval shifts current_completion_date over the assessment period)"
        actor: system
        preconditions: []
        side_effects:
          - "assessed_ld_cents := 0"

      - from: ASSESSED
        to: APPEALED
        trigger: "POST /construction-projects/{pid}/ld-assessments/{lid}/appeal"
        actor: ContractorScheduler
        preconditions:
          - "LDA in ASSESSED (ERR_INVALID_STATE)"
        side_effects: []

      - from: APPEALED
        to: UPHELD
        trigger: "POST /construction-projects/{pid}/ld-assessments/{lid}/uphold"
        actor: OwnerRepresentative
        preconditions:
          - "LDA in APPEALED (ERR_INVALID_STATE)"
        side_effects: []

      - from: APPEALED
        to: REDUCED
        trigger: "POST /construction-projects/{pid}/ld-assessments/{lid}/reduce"
        actor: OwnerRepresentative
        preconditions:
          - "LDA in APPEALED (ERR_INVALID_STATE)"
          - "Payload reduced_ld_cents < assessed_ld_cents (ERR_REDUCTION_NOT_SMALLER)"
        side_effects:
          - "assessed_ld_cents := payload.reduced_ld_cents"

      - from: APPEALED
        to: REVERSED
        trigger: "POST /construction-projects/{pid}/ld-assessments/{lid}/reverse"
        actor: OwnerRepresentative
        preconditions:
          - "LDA in APPEALED (ERR_INVALID_STATE)"
        side_effects:
          - "assessed_ld_cents := 0"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: schedule-accept-stale-project
    parent_entity: ConstructionProject
    write_endpoint: "POST /construction-projects/{pid}/schedule-versions/{vid}/accept"
    occ_field: "expected_project_version"
    description: |
      Accepting a ScheduleVersion against a ConstructionProject whose version has
      advanced since the client last observed it is rejected. Captures the case
      where another writer has just accepted a different version (which mutates
      project.current_completion_date and version) — the current writer's view
      of project state is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: eot-approve-stale-project
    parent_entity: ConstructionProject
    write_endpoint: "POST /construction-projects/{pid}/eot-requests/{eid}/approve"
    occ_field: "expected_project_version"
    description: |
      Approving an EOT against a ConstructionProject whose version has advanced
      since the client last observed it is rejected. The EOT approval mutates
      current_completion_date, so two back-to-back approvals from the same
      stale snapshot would double-shift the date.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: cpm_forward_backward_pass
    trigger: "ScheduleVersion submit; ProgressUpdate approve"
    algorithm: topological
    formula: |
      1. Topological sort of Activity by ActivityRelationship edges (FS/SS/FF/SF with lag_days).
         Cycle → ERR_CYCLE_DETECTED.
      2. Forward pass (in topological order):
           For each Activity a with no predecessor: early_start = data_date of parent version.
           For each (pred, a, type, lag):
             FS: candidate = pred.early_finish + lag
             SS: candidate = pred.early_start + lag
             FF: candidate = pred.early_finish + lag - a.remaining_duration_days
             SF: candidate = pred.early_start + lag - a.remaining_duration_days
           a.early_start = max over candidates (or data_date if no predecessor).
           a.early_finish = a.early_start + a.remaining_duration_days.
      3. Backward pass (reverse topological order):
           For each Activity a with no successor: late_finish = max_EF_over_terminal_activities.
           For each (a, succ, type, lag):
             FS: candidate = succ.late_start - lag
             SS: candidate = succ.late_start - lag + a.remaining_duration_days
             FF: candidate = succ.late_finish - lag
             SF: candidate = succ.late_finish - lag + a.remaining_duration_days
           a.late_finish = min over candidates (or project horizon if no successor).
           a.late_start = a.late_finish - a.remaining_duration_days.
      4. total_float_days = (late_finish - early_finish) in whole calendar days.
    input_set: "All Activities and ActivityRelationships on the target ScheduleVersion"
    precision: "integer calendar days"
    constants: {}

  - name: critical_path_identification
    trigger: "After cpm_forward_backward_pass"
    algorithm: threshold
    formula: |
      Variant LONGEST_PATH (default when project has no external constraint):
        critical_activities := { a : a.total_float_days == 0 }
      Variant LEAST_FLOAT_PATH (when contract imposes an externally constrained finish):
        min_tf := min(a.total_float_days over all a)
        critical_activities := { a : a.total_float_days == min_tf }
      Sets is_critical on each Activity; aggregates critical_path_activity_count and
      projected_finish_date (= max EF over terminal activities) on the ScheduleVersion.
    input_set: "Activities on ScheduleVersion after CPM pass"
    precision: "integer days"
    constants: {}
    variants:
      - name: LONGEST_PATH
        when: "No externally imposed completion constraint"
        difference: "critical = total_float_days == 0"
      - name: LEAST_FLOAT_PATH
        when: "Externally constrained finish (project completion earlier than computed horizon)"
        difference: "critical = total_float_days == min(total_float_days); can produce a different critical set and a different count"

  - name: time_impact_analysis
    trigger: "DelayEvent TIA submission"
    algorithm: topological
    formula: |
      Prospective (FRAGNET_INSERTION):
        1. Take the fragnet_inserted_into_version_id's activities and relationships.
        2. Synthesize new Activity nodes from fragnet_activity_ids (linked into the
           network per the supplied predecessor ties).
        3. Re-run cpm_forward_backward_pass on the augmented network.
        4. tia_prolongation_days_prospective := new_projected_finish_date - old_projected_finish_date.
      Retrospective (TIME_SLICE_WINDOWS):
        1. Partition [data_date_of_baseline_accepted_update, today] into monthly windows.
        2. In each window, recompute critical path using as-built actuals recorded by
           approved ProgressUpdates in that window; accumulate the critical delay days
           attributable to the fragnet's causal chain.
        3. tia_prolongation_days_retrospective := sum of critical delay days across windows.
    input_set: "Target UPDATE schedule, fragnet activities, all approved ProgressUpdates up to today"
    precision: "integer days"
    constants: {}
    variants:
      - name: FRAGNET_INSERTION
        when: "Prospective — used for forward-looking EOT determination"
        difference: "Adds fragnet to as-planned network; ignores subsequent as-built progress"
      - name: TIME_SLICE_WINDOWS
        when: "Retrospective — used for forensic determination"
        difference: "Rebuilds critical path window-by-window from as-built; can yield a different prolongation total than fragnet insertion"

  - name: concurrent_delay_apportionment
    trigger: "DelayEvent TIA submission (after time_impact_analysis)"
    algorithm: waterfall_allocation
    formula: |
      Let P := tia_prolongation_days_prospective.
      Let contractor_concurrent := critical contractor-caused delay days overlapping the event window.
      Let owner_concurrent := critical owner-caused delay days overlapping the event window.
      Allocation order:
        1. apportioned_non_excusable_days := contractor_concurrent (floored at 0).
        2. residual := P - apportioned_non_excusable_days.
        3. If causation == OWNER_CAUSED AND notice_within_window:
             apportioned_compensable_days := min(residual, owner_concurrent if owner_concurrent>0 else residual)
             apportioned_excusable_non_compensable_days := residual - apportioned_compensable_days
           elif causation == FORCE_MAJEURE OR (causation == OWNER_CAUSED AND !notice_within_window):
             apportioned_compensable_days := 0
             apportioned_excusable_non_compensable_days := residual
           else (CONTRACTOR_CAUSED, THIRD_PARTY):
             apportioned_compensable_days := 0
             apportioned_excusable_non_compensable_days := 0
             apportioned_non_excusable_days := P
        4. Apply float_ownership_policy: if OWNER_OWNS, the owner absorbs float consumption
           first (i.e., apportioned_compensable_days is reduced by float consumed during
           the window before owner_concurrent was critical); if CONTRACTOR_OWNS, no such
           adjustment; if SHARED_FIRST_COME, the party whose event became critical first
           absorbs the float.
    input_set: "DelayEvent, linked fragnet schedule, all overlapping critical DelayEvents"
    precision: "integer days"
    constants: {}
    variants:
      - name: CONTRACTOR_OWNS_FLOAT
        when: "project.float_ownership_policy == CONTRACTOR_OWNS"
        difference: "Contractor absorbs float consumption; compensable days computed against raw prolongation"
      - name: OWNER_OWNS_FLOAT
        when: "project.float_ownership_policy == OWNER_OWNS"
        difference: "Owner absorbs float; compensable days start only after float is exhausted"

  - name: acceleration_cost_recovery
    trigger: "AccelerationDirective COMPLETED or RESOLVED"
    algorithm: constraint_propagation
    formula: |
      Variant ACTUAL_COST:
        recovered_cost_cents := actual_cost_cents.
      Variant MEASURED_MILE:
        baseline_productivity := unimpacted_qty / unimpacted_hours
        impacted_productivity := total_qty / total_hours_in_acceleration_window
        loss_factor := max(0, (baseline_productivity - impacted_productivity) / baseline_productivity)
        recovered_cost_cents := round_half_up(measured_mile_cost_cents * loss_factor, 2)
      Selected variant is written onto directive.recovery_variant.
    input_set: "AccelerationDirective fields, daily progress records in window"
    precision: "2 decimal places (round_half_up)"
    constants: {}
    variants:
      - name: ACTUAL_COST
        when: "Contractor kept contemporaneous cost records; owner accepts them"
        difference: "Recover the documented actual amount, regardless of measured-mile analysis"
      - name: MEASURED_MILE
        when: "Owner disputes actuals and applies a productivity-loss formula"
        difference: "Recover a fraction of measured_mile_cost_cents proportional to lost productivity"

  - name: liquidated_damages_exposure
    trigger: "LDA assess; ProgressUpdate approval cascade creating PROPOSED LDA"
    algorithm: tiered_pricing
    formula: |
      culpable_days := max(0, days_between(max(assessment_period_start, project.current_completion_date),
                                           min(assessment_period_end, projected_finish_or_actual_SC)))
      gross_ld_cents := culpable_days * project.liquidated_damages_daily_rate_cents
      prior_assessed_total_cents := sum(assessed_ld_cents) over LDAs on project in {ASSESSED, UPHELD, REDUCED}
      remaining_cap := max(0, project.ld_cap_cents - prior_assessed_total_cents)
      assessed_ld_cents := min(gross_ld_cents, remaining_cap)
    input_set: "LDA fields, project LD config, prior assessments on project"
    precision: "integer cents"
    constants: {}

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced resources exist (validated left-to-right: project, version, activity, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: state
    check: "Target resource in correct state for this transition (per state machine preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 5
    category: business_safety
    check: "ActivityRelationship insertion must not introduce a cycle in the schedule DAG"
    error_id: ERR_CYCLE_DETECTED
    http_status: 422
    applies_to: "POST /construction-projects/{pid}/schedule-versions/{vid}/relationships; POST .../submit"

  - priority: 6
    category: business_safety
    check: "ActivityRelationship predecessor and successor must both belong to the same ScheduleVersion"
    error_id: ERR_ACTIVITY_NOT_IN_VERSION
    http_status: 422
    applies_to: "POST .../relationships"

  - priority: 7
    category: business_temporal
    check: "activity.actual_finish must be >= activity.actual_start; progress entries must satisfy percent_complete==100 iff remaining_duration_days==0"
    error_id: ERR_INVALID_PROGRESS
    http_status: 422
    applies_to: "POST .../progress-updates"

  - priority: 8
    category: business_temporal
    check: "DelayEvent notice must be evaluated against project.notice_window_days (event_start_date <= notice_submitted_at <= event_start_date + notice_window_days for in-window)"
    error_id: ERR_NOTICE_DATA_INVALID
    http_status: 422
    applies_to: "POST .../delay-events; POST .../delay-events/{id}/notice"

  - priority: 9
    category: business_constraint
    check: "Only one ACCEPTED BASELINE ScheduleVersion per ConstructionProject"
    error_id: ERR_BASELINE_ALREADY_ACCEPTED
    http_status: 409
    applies_to: "POST .../schedule-versions/{vid}/accept"

  - priority: 10
    category: business_constraint
    check: "An UPDATE ScheduleVersion cannot be ACCEPTED unless an ACCEPTED BASELINE exists"
    error_id: ERR_BASELINE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST .../schedule-versions/{vid}/accept"

  - priority: 11
    category: business_referential
    check: "TimeExtensionRequest.delay_event_id must reference a DelayEvent in TIA_ACCEPTED status"
    error_id: ERR_TIA_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST .../eot-requests; POST .../eot-requests/{eid}/submit"

  - priority: 12
    category: business_fiscal
    check: "TimeExtensionRequest.requested_days must not exceed apportioned_compensable_days + apportioned_excusable_non_compensable_days of the linked DelayEvent"
    error_id: ERR_REQUESTED_DAYS_EXCEED_ENTITLEMENT
    http_status: 422
    applies_to: "POST .../eot-requests; POST .../eot-requests/{eid}/submit"

  - priority: 13
    category: business_fiscal
    check: "If cost_recovery_cents > 0, linked DelayEvent must have apportioned_compensable_days > 0"
    error_id: ERR_NON_COMPENSABLE_COST
    http_status: 422
    applies_to: "POST .../eot-requests"

  - priority: 14
    category: business_fiscal
    check: "LiquidatedDamagesAssessment.assessed_ld_cents must respect project.ld_cap_cents aggregate cap"
    error_id: ERR_LD_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST .../ld-assessments/{lid}/assess"

  - priority: 15
    category: business_temporal
    check: "EOT appeal allowed only while submission_round < 3"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 409
    applies_to: "POST .../eot-requests/{eid}/appeal"

  - priority: 16
    category: state
    check: "OCC expected_project_version must equal current project.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST .../schedule-versions/{vid}/accept; POST .../eot-requests/{eid}/approve; POST .../eot-requests/{eid}/partial-approve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Default startup time is 2026-05-01T00:00:00Z and the clock NEVER falls back to real wall time."
    roles: [SystemAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server logical clock updated"]

  # --- ConstructionProject ---
  - method: POST
    path: "/construction-projects"
    description: "Create a new construction project"
    roles: [ProjectControlsEngineer]
    code: 201
    input: [project_name, contract_start_date, contract_completion_date, liquidated_damages_daily_rate_cents, ld_cap_cents, "float_ownership_policy?", "notice_window_days?"]
    output: ConstructionProject
    side_effects: ["status = PRECONSTRUCTION", "current_completion_date := contract_completion_date"]

  - method: GET
    path: "/construction-projects"
    description: "List construction projects"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConstructionProject[]"
    side_effects: []

  - method: GET
    path: "/construction-projects/{pid}"
    description: "Get a project"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: []
    output: ConstructionProject
    side_effects: []

  - method: POST
    path: "/construction-projects/{pid}/activate"
    description: "Manually activate a project (rare; normally auto-activates on baseline acceptance)"
    roles: [ProjectControlsEngineer]
    code: 200
    input: []
    output: ConstructionProject
    side_effects: ["status PRECONSTRUCTION → ACTIVE"]

  - method: POST
    path: "/construction-projects/{pid}/declare-substantial-completion"
    description: "Declare substantial completion"
    roles: [OwnerRepresentative]
    code: 200
    input: []
    output: ConstructionProject
    side_effects: ["status → SUBSTANTIALLY_COMPLETE", "auto-assess any PROPOSED LDA past period end"]

  - method: POST
    path: "/construction-projects/{pid}/close"
    description: "Close a project"
    roles: [OwnerRepresentative]
    code: 200
    input: []
    output: ConstructionProject
    side_effects: ["status → CLOSED"]

  # --- ScheduleVersion ---
  - method: POST
    path: "/construction-projects/{pid}/schedule-versions"
    description: "Create a schedule version (BASELINE or UPDATE)"
    roles: [ContractorScheduler]
    code: 201
    input: [kind, data_date, "supersedes_version_id?"]
    output: ScheduleVersion
    side_effects: ["status = DRAFT", "revision_number := 1"]

  - method: GET
    path: "/construction-projects/{pid}/schedule-versions"
    description: "List schedule versions for a project"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: ["limit?", "offset?", "kind?", "status?"]
    output: "ScheduleVersion[]"
    side_effects: []

  - method: GET
    path: "/construction-projects/{pid}/schedule-versions/{vid}"
    description: "Get a schedule version"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: []
    output: ScheduleVersion
    side_effects: []

  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/submit"
    description: "Submit a draft schedule for review; runs CPM"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: ScheduleVersion
    side_effects: ["status → SUBMITTED", "cpm_forward_backward_pass runs", "critical_path_identification runs"]

  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/accept"
    description: "Accept a submitted schedule (OCC on project.version)"
    roles: [ProjectControlsEngineer]
    code: 200
    input: [expected_project_version]
    output: ScheduleVersion
    side_effects:
      - "status → ACCEPTED"
      - "Increments ConstructionProject.version by 1"
      - "If kind == BASELINE and project PRECONSTRUCTION → ACTIVE"
      - "If kind == UPDATE: recompute project.current_completion_date"

  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/reject"
    description: "Reject a submitted schedule"
    roles: [ProjectControlsEngineer]
    code: 200
    input: []
    output: ScheduleVersion
    side_effects: ["status → REJECTED", "Clear computed Activity date/float fields"]

  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/revise"
    description: "Bring a rejected schedule back to draft for rework"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: ScheduleVersion
    side_effects: ["status REJECTED → DRAFT", "revision_number += 1"]

  # --- Activity ---
  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/activities"
    description: "Add an activity to a draft schedule"
    roles: [ContractorScheduler]
    code: 201
    input: [activity_code, description, original_duration_days, "remaining_duration_days?"]
    output: Activity
    side_effects: ["remaining_duration_days defaults to original_duration_days if omitted"]

  - method: GET
    path: "/construction-projects/{pid}/schedule-versions/{vid}/activities"
    description: "List activities in a schedule version"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: ["limit?", "offset?", "is_critical?"]
    output: "Activity[]"
    side_effects: []

  - method: GET
    path: "/construction-projects/{pid}/schedule-versions/{vid}/activities/{aid}"
    description: "Get an activity"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: []
    output: Activity
    side_effects: []

  # --- ActivityRelationship ---
  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/relationships"
    description: "Add a logic tie between two activities (cycle-checked)"
    roles: [ContractorScheduler]
    code: 201
    input: [predecessor_activity_id, successor_activity_id, relationship_type, "lag_days?"]
    output: ActivityRelationship
    side_effects: ["Cycle check on augmented graph"]

  - method: GET
    path: "/construction-projects/{pid}/schedule-versions/{vid}/relationships"
    description: "List relationships in a schedule version"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ActivityRelationship[]"
    side_effects: []

  # --- ProgressUpdate / ProgressEntry ---
  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/progress-updates"
    description: "Create a progress update against an UPDATE schedule version"
    roles: [ContractorScheduler]
    code: 201
    input: [reporting_period_end, submitted_by_contractor_user_id]
    output: ProgressUpdate
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/construction-projects/{pid}/schedule-versions/{vid}/progress-updates"
    description: "List progress updates"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProgressUpdate[]"
    side_effects: []

  - method: GET
    path: "/construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}"
    description: "Get a progress update"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: []
    output: ProgressUpdate
    side_effects: []

  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/entries"
    description: "Add a per-activity progress entry"
    roles: [ContractorScheduler]
    code: 201
    input: [activity_id, percent_complete, remaining_duration_days, "actual_start?", "actual_finish?"]
    output: ProgressEntry
    side_effects: []

  - method: GET
    path: "/construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/entries"
    description: "List entries of a progress update"
    roles: [ContractorScheduler, ProjectControlsEngineer, OwnerRepresentative, ClaimsConsultant, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ProgressEntry[]"
    side_effects: []

  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/submit"
    description: "Submit progress update"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: ProgressUpdate
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/approve"
    description: "Approve progress update (applies actuals, recomputes CPM, may spawn LDA)"
    roles: [ProjectControlsEngineer]
    code: 200
    input: []
    output: ProgressUpdate
    side_effects:
      - "status → APPROVED"
      - "Apply ProgressEntries to Activities"
      - "cpm_forward_backward_pass + critical_path_identification on parent ScheduleVersion"
      - "If projected_finish_date > project.current_completion_date: cascade create PROPOSED LiquidatedDamagesAssessment for overrun window"

  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/reject"
    description: "Reject progress update"
    roles: [ProjectControlsEngineer]
    code: 200
    input: []
    output: ProgressUpdate
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/construction-projects/{pid}/schedule-versions/{vid}/progress-updates/{puid}/revise"
    description: "Revise rejected progress update back to DRAFT"
    roles: [ContractorScheduler]
    code: 200
    input: []
    output: ProgressUpdate
    side_effects: ["status REJECTED → DRAFT"]

  # --- DelayEvent ---
  - method: POST
    path: "/construction-projects/{pid}/delay-events"
