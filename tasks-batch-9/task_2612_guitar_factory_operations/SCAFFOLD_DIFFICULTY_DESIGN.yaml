# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2612_guitar_factory_operations
#
# One block per §0.5 difficulty rule. Every block carries at least two
# differentiated instances: instances under the same rule_id must differ in
# MECHANISM, not merely in data. Each instance states why the scaffold already
# grounds it (`grounds`), what a plausible-but-wrong implementation would
# produce (`distinguishing_aspect`), and a fully executable `test_recipe` whose
# `assert` values are pre-computed literals — never formulas.
#
# All `setup_api_calls` entries are structured call objects with keys
# `call`, `payload`, `as`, optional `as_user_id`, optional `captures`.
# `${var}` refers to a value captured earlier in the same chain.
# The logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: quote_provisional_vs_binding_diverge_on_three_axes
        grounds: "§1.3 custom_shop_quote_total declares two variants: PROVISIONAL over OptionSelection rows in {PENDING_APPROVAL, SELECTED} priced at the LIVE OptionCatalog.upcharge_cents, and BINDING over rows in {LOCKED} priced at the FROZEN OptionSelection.locked_upcharge_cents. §1.2 lock-options force-rejects every PENDING_APPROVAL row, so the two variants see different input sets as well as different price sources."
        distinguishing_aspect: "An implementation that computes one total and reuses it for both fields, or that keeps the pending option in the binding set, reports binding_quote_total_cents 886185 instead of 716610. An implementation that keeps the pending option out of the PROVISIONAL set reports provisional 716610 instead of 886185. Only the correct dual-variant split yields the pair (886185, 716610) on the SAME order at the SAME instant."
        test_recipe:
          setup: "One custom-shop ENDORSER order with base_price_cents 480000, one ARTISAN option approved to SELECTED (upcharge 130000) and one MASTER option still PENDING_APPROVAL (upcharge 95000). Confirm the order so lock-options is legal."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /option-catalog", payload: { option_code: "INL-VINE", option_group: "INLAY", upcharge_cents: 130000, complexity_class: "ARTISAN", lead_time_days: 45, incompatible_option_codes: ["INL-DOT"] }, as: PlantAdmin, captures: { optA: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "TOP-BRZ", option_group: "TOP_WOOD", upcharge_cents: 95000, complexity_class: "MASTER", lead_time_days: 30, requires_finish_system: "NITRO" }, as: PlantAdmin, captures: { optB: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-001", model_code: "OM45", base_price_cents: 480000, is_custom_shop: true, artist_tier: "ENDORSER", finish_system: "NITRO", promised_date: "2026-10-01T00:00:00Z" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { bo1: "$.data.id", bo_v1: "$.data.version" } }
            - { call: "POST /build-orders/${bo1}/option-selections", payload: { option_id: "${optA}", quantity: 1, expected_build_order_version: "${bo_v1}" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { sel1: "$.data.id" } }
            - { call: "POST /option-selections/${sel1}/approve", payload: {}, as: CustomShopCoordinator, as_user_id: "csc-dana" }
            - { call: "GET /build-orders/${bo1}", payload: {}, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { bo_v2: "$.data.version" } }
            - { call: "POST /build-orders/${bo1}/option-selections", payload: { option_id: "${optB}", quantity: 1, expected_build_order_version: "${bo_v2}" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { sel2: "$.data.id" } }
            - { call: "POST /build-orders/${bo1}/confirm", payload: { deposit_cents: 200000 }, as: CustomShopCoordinator, as_user_id: "csc-bob" }
          trigger: "POST /build-orders/${bo1}/lock-options as CustomShopCoordinator"
          assert:
            http_status: 200
            commercial_status: "OPTIONS_LOCKED"
            provisional_quote_total_cents: 886185
            binding_quote_total_cents: 716610
            note: "The PROVISIONAL figure must NOT be recomputed by lock-options — it stays at 886185 while the BINDING figure lands at 716610, a delta of 169575. Selection sel1 is now LOCKED with locked_upcharge_cents 130000 and line_total_cents 175500; selection sel2 is REJECTED with line_total_cents 166250 retained for audit."

      - name: lot_yield_nominal_vs_actual_diverge_on_moisture_kerf_and_input_set
        grounds: "§1.3 tonewood_lot_yield declares NOMINAL_YIELD as a forward_looking receipt-time projection (moisture_at_receipt_pct, one whole-lot NOMINAL_KERF_BP allowance, no Billet rows consulted) and ACTUAL_YIELD as a chronological replay (current moisture_content_pct, ACTUAL_KERF_BP charged per cut, driven entirely by Billet rows). §1.1 stores both on TonewoodLot."
        distinguishing_aspect: "A second, mechanically different dual-variant pair from the quote: here the variants disagree about which MOISTURE READING is authoritative and about how KERF is charged, not merely about which child rows are in scope. An implementation that shares one moisture figure reports actual_yield_board_feet 54.01 (55.00 discounted by the 12.0% receipt shrinkage) instead of 55.00; one that shares the kerf model reports nominal_yield_board_feet 95.50 instead of 97.90. The max(0, ...) shrinkage clamp is what keeps the 7.0% current reading from CREDITING the lot with negative loss."
        test_recipe:
          setup: "A 100.00 board-foot APPENDIX_II rosewood lot received at 12.0% moisture, dried to 7.0%, conditioned, released, then cut into two billets of 30.00 and 25.00 board feet."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "EAST_INDIAN_ROSEWOOD", cites_appendix: "APPENDIX_II", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/attest-permit", payload: { permit_number: "CITES-II-4471" }, as: ComplianceOfficer, as_user_id: "co-alice" }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/release", payload: {}, as: WoodBuyer, captures: { lot_v1: "$.data.version" } }
            - { call: "POST /billets", payload: { billet_code: "BLT-001", lot_id: "${lot1}", board_feet: 30.00, grade: "AAA", expected_tonewood_lot_version: "${lot_v1}" }, as: Machinist, captures: { blt1: "$.data.id" } }
            - { call: "GET /tonewood-lots/${lot1}", payload: {}, as: Machinist, captures: { lot_v2: "$.data.version" } }
          trigger: "POST /billets with billet_code BLT-002, lot_id ${lot1}, board_feet 25.00, grade AA, expected_tonewood_lot_version ${lot_v2} as Machinist, then GET /tonewood-lots/${lot1}"
          assert:
            http_status: 201
            lot_nominal_yield_board_feet: 97.90
            lot_actual_yield_board_feet: 55.00
            lot_board_feet_kerf_loss: 1.65
            lot_board_feet_available: 43.35
            lot_board_feet_unassigned: 55.00
            lot_status: "RELEASED"
            note: "97.90 = 100.00 * (10000 - 180 - 30) / 10000 using the 12.0% RECEIPT reading. 55.00 = (30.00 + 25.00) with a ZERO shrinkage term because the 7.0% current reading is below the 8.0% target and the clamp fires. Kerf 0.90 + 0.75 = 1.65 is charged per cut, not once per lot."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: quote_nested_rounding_round_each_line_then_sum
        grounds: "§1.3 custom_shop_quote_total pins combinatorial mode (b): Step 1 rounds EVERY line independently at its own complexity multiplier and Step 2 sums the rounded lines. §1.1 persists the per-line figure as OptionSelection.line_total_cents, so the intermediate rounding is observable."
        distinguishing_aspect: "Three ARTISAN options at 12004, 22004 and 32004 cents each land on a .4 fractional cent (x * 1.35), so each rounds DOWN, but their raw sum 66012 * 1.35 = 89116.2 rounds down to 89116. Round-then-sum gives 389115; sum-then-round gives 389116. Exactly one cent separates the correct answer from the most natural wrong one, and no other operand choice in the scaffold exposes it."
        test_recipe:
          setup: "A standard (non custom-shop) POLY order with base_price_cents 300000, artist_tier NONE, carrying three ARTISAN options whose upcharges are 12004, 22004 and 32004 cents."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /option-catalog", payload: { option_code: "INL-DOT", option_group: "INLAY", upcharge_cents: 12004, complexity_class: "ARTISAN", lead_time_days: 10, incompatible_option_codes: ["INL-VINE"] }, as: PlantAdmin, captures: { optC: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "HW-GOLD", option_group: "HARDWARE", upcharge_cents: 22004, complexity_class: "ARTISAN", lead_time_days: 12 }, as: PlantAdmin, captures: { optD: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "EL-PICKUP", option_group: "ELECTRONICS", upcharge_cents: 32004, complexity_class: "ARTISAN", lead_time_days: 20, requires_finish_system: "POLY" }, as: PlantAdmin, captures: { optE: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-002", model_code: "D28", base_price_cents: 300000, is_custom_shop: false, artist_tier: "NONE", finish_system: "POLY", promised_date: "2026-11-01T00:00:00Z" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { bo2: "$.data.id", bo2_v1: "$.data.version" } }
            - { call: "POST /build-orders/${bo2}/option-selections", payload: { option_id: "${optC}", quantity: 1, expected_build_order_version: "${bo2_v1}" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { selC: "$.data.id" } }
            - { call: "GET /build-orders/${bo2}", payload: {}, as: CustomShopCoordinator, captures: { bo2_v2: "$.data.version" } }
            - { call: "POST /build-orders/${bo2}/option-selections", payload: { option_id: "${optD}", quantity: 1, expected_build_order_version: "${bo2_v2}" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { selD: "$.data.id" } }
            - { call: "GET /build-orders/${bo2}", payload: {}, as: CustomShopCoordinator, captures: { bo2_v3: "$.data.version" } }
          trigger: "POST /build-orders/${bo2}/option-selections with option_id ${optE}, quantity 1, expected_build_order_version ${bo2_v3} as CustomShopCoordinator, then GET /build-orders/${bo2}"
          assert:
            http_status: 201
            selection_line_total_cents: 43205
            provisional_quote_total_cents: 389115
            note: "Per-line: 16205 + 29705 + 43205 = 89115, plus base 300000 = 389115. is_custom_shop false zeroes the surcharge and artist_tier NONE zeroes the discount, so nothing masks the one-cent rounding difference. 389116 is the sum-then-round trap."

      - name: cure_hours_composed_from_four_dimensions_with_asymmetric_rounding
        grounds: "§1.3 finish_cure_ready_at declares combinatorial mode (a): finish system, coat count, booth humidity and booth temperature each contribute a term, humidity CEILS into a penalty while temperature FLOORS into a relief, the relief is capped at TEMP_RELIEF_CAP_HOURS, and a per-system MIN_CURE_HOURS floor is applied last. §1.2 pins the sampling instant to complete-spray."
        distinguishing_aspect: "Getting three of the four dimensions right still produces the wrong hour count. Using floor for humidity gives rh_steps 1 and cure_hours 396; using ceil for temperature gives temp_steps 3 either way here but reversing the pair gives 384; omitting the extra-coat term gives 336; sampling the booth at run CREATION rather than at complete-spray gives 384 because no reading exists yet. Only the full four-term composition yields 408 hours and cure_ready_at 2026-08-22T09:00:00Z."
        test_recipe:
          setup: "An order carried all the way to build_stage IN_ASSEMBLY, then a 12-coat NITRO finish run booked into a FINISH_BOOTH sitting at 52.0% RH and 27.0 C, with the clock advanced to 2026-08-05T09:00:00Z before the spray is closed out."
          setup_api_calls: &chain_a
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /storage-rooms", payload: { room_code: "FB-1", room_type: "FINISH_BOOTH", target_rh_pct: 50.0, rh_tolerance_pct: 5.0, target_temp_c: 21.0, capacity_slots: 1 }, as: PlantAdmin, captures: { fb1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "CNC-1", station_type: "CNC_ROUTER", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { cnc1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "HS-1", station_type: "HAND_SHAPING", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { hs1: "$.data.id" } }
            - { call: "POST /component-specs", payload: { spec_code: "TOP-OM", component_type: "BODY_TOP", required_species_codes: ["SITKA_SPRUCE", "EAST_INDIAN_ROSEWOOD"], min_grade: "AA", nominal_board_feet: 6.00, target_thickness_mm: 2.90, thickness_tolerance_mm: 0.10, cnc_minutes: 45, hand_shape_minutes: 60, required_room_type: "BUILD_ROOM" }, as: PlantAdmin, captures: { spec1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "EAST_INDIAN_ROSEWOOD", cites_appendix: "APPENDIX_II", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/attest-permit", payload: { permit_number: "CITES-II-4471" }, as: ComplianceOfficer, as_user_id: "co-alice" }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/release", payload: {}, as: WoodBuyer, captures: { lot_v1: "$.data.version" } }
            - { call: "POST /billets", payload: { billet_code: "BLT-001", lot_id: "${lot1}", board_feet: 30.00, grade: "AAA", expected_tonewood_lot_version: "${lot_v1}" }, as: Machinist, captures: { blt1: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "INL-VINE", option_group: "INLAY", upcharge_cents: 130000, complexity_class: "ARTISAN", lead_time_days: 45, incompatible_option_codes: ["INL-DOT"] }, as: PlantAdmin, captures: { optA: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-001", model_code: "OM45", base_price_cents: 480000, is_custom_shop: true, artist_tier: "ENDORSER", finish_system: "NITRO", promised_date: "2026-10-01T00:00:00Z" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { bo1: "$.data.id", bo_v1: "$.data.version" } }
            - { call: "POST /build-orders/${bo1}/option-selections", payload: { option_id: "${optA}", quantity: 1, expected_build_order_version: "${bo_v1}" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { sel1: "$.data.id" } }
            - { call: "POST /option-selections/${sel1}/approve", payload: {}, as: CustomShopCoordinator, as_user_id: "csc-dana" }
            - { call: "POST /build-orders/${bo1}/confirm", payload: { deposit_cents: 200000 }, as: CustomShopCoordinator, as_user_id: "csc-bob" }
            - { call: "POST /build-orders/${bo1}/lock-options", payload: {}, as: CustomShopCoordinator, as_user_id: "csc-bob" }
            - { call: "POST /build-orders/${bo1}/release-components", payload: {}, as: Machinist }
            - { call: "POST /components", payload: { spec_id: "${spec1}", billet_id: "${blt1}", build_order_id: "${bo1}" }, as: Machinist, captures: { cmp1: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", starts_at: "2026-08-02T08:00:00Z", ends_at: "2026-08-02T09:00:00Z", build_order_id: "${bo1}", component_id: "${cmp1}" }, as: Machinist, captures: { res1: "$.data.id" } }
            - { call: "POST /components/${cmp1}/route", payload: { station_reservation_id: "${res1}", measured_thickness_mm: 2.90 }, as: Machinist }
            - { call: "POST /station-reservations", payload: { station_id: "${hs1}", starts_at: "2026-08-02T10:00:00Z", ends_at: "2026-08-02T11:00:00Z", build_order_id: "${bo1}", component_id: "${cmp1}" }, as: Luthier, captures: { res2: "$.data.id" } }
            - { call: "POST /components/${cmp1}/hand-shape", payload: { station_reservation_id: "${res2}", measured_thickness_mm: 2.90 }, as: Luthier }
            - { call: "POST /components/${cmp1}/qc", payload: { verdict: "ACCEPT" }, as: QualityInspector }
            - { call: "POST /build-orders/${bo1}/start-assembly", payload: {}, as: Luthier, captures: { bo_v3: "$.data.version" } }
            - { call: "POST /finish-runs", payload: { build_order_id: "${bo1}", booth_id: "${fb1}", finish_system: "NITRO", coat_count: 12, expected_build_order_version: "${bo_v3}" }, as: FinishTech, captures: { fr1: "$.data.id" } }
            - { call: "POST /storage-rooms/${fb1}/climate-readings", payload: { rh_pct: 52.0, temp_c: 27.0 }, as: FinishTech }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T09:00:00Z" }, as: PlantAdmin }
          trigger: "POST /finish-runs/${fr1}/complete-spray as FinishTech"
          assert:
            http_status: 200
            status: "CURING"
            spray_completed_at: "2026-08-05T09:00:00Z"
            cure_hours: 408
            cure_ready_at: "2026-08-22T09:00:00Z"
            cure_suspended_minutes: 0
            note: "coat_hours 336 + 4*18 = 408; rh ceil((52.0-45.0)/5.0) = 2 steps = +24; temp floor((27.0-21.0)/2.0) = 3 steps = -24 capped at -48; max(240, 408) = 408. The booth at 52.0% RH is still IN_SPEC because FB-1 targets 50.0 with a 5.0 tolerance, so the climate guard does not fire."

      - name: export_declared_value_tier_pinned_to_goods_not_declared
        grounds: "§1.3 export_declared_value pins combinatorial mode (c): a five-step order in which the fee tier is keyed on goods_value_cents ALONE and the insurance base is goods + doc_fee, excluding insurance itself. §1.1 stores all three figures on ExportShipment so every step is observable."
        distinguishing_aspect: "A third, structurally different combinatorial mechanism: not nested rounding and not multi-dimensional composition, but an ORDER-OF-OPERATIONS pin with a self-referential trap. Goods of 498000 sit just under the inclusive TIER_1 ceiling of 500000, while the resulting declared value 510019 sits just above it. Re-deriving the tier from the declared value drops the rate from 150bp to 110bp and yields 508009. Charging insurance on goods alone yields declared 509952. Only the pinned order yields 510019."
        test_recipe:
          setup: "A standard order with base_price_cents 498000, no options, confirmed and locked so binding_quote_total_cents is exactly 498000, and no CITES-listed wood in the instrument."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /build-orders", payload: { order_code: "ORD-EXP", model_code: "D28", base_price_cents: 498000, is_custom_shop: false, artist_tier: "NONE", finish_system: "POLY", promised_date: "2026-12-01T00:00:00Z" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { boX: "$.data.id" } }
            - { call: "POST /build-orders/${boX}/confirm", payload: { deposit_cents: 50000 }, as: CustomShopCoordinator, as_user_id: "csc-bob" }
            - { call: "POST /build-orders/${boX}/lock-options", payload: {}, as: CustomShopCoordinator, as_user_id: "csc-bob" }
          trigger: "POST /export-shipments with build_order_id ${boX} and destination_country_code JP as ComplianceOfficer"
          assert:
            http_status: 201
            status: "DOCS_PENDING"
            goods_value_cents: 498000
            doc_fee_cents: 7470
            insurance_cents: 4549
            declared_value_cents: 510019
            cites_permit_required: false
            required_cites_appendix: "NONE"
            note: "498000 <= 500000 so TIER_1 at 150bp: doc_fee round_half_up(7470.0) = 7470, above the 3000 floor. Insurance round_half_up(505470 * 90 / 10000) = round_half_up(4549.23) = 4549. Declared 510019. The trap answer 508009 comes from re-deriving the tier from 510019."

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: finish_refinish_cycle_returns_order_to_in_assembly
        grounds: "§1.2 BuildOrder.build_stage declares the cycle IN_ASSEMBLY -> IN_FINISH -> IN_ASSEMBLY, closed by POST /finish-runs/{finish_run_id}/reject, which increments refinish_count and frees the booth slot. §1.2.1 declares POST /finish-runs OCC-guarded precisely because a replacement run legitimately supersedes the rejected one."
        distinguishing_aspect: "An implementation that treats build_stage as monotonic either refuses the reject (leaving the order stuck in IN_FINISH) or drops it into a dead-end REFINISH state from which no second finish run can be booked. The observable difference is that after the reject the order is back in IN_ASSEMBLY with refinish_count 1, the booth's occupied_slots is back to 0, and a SECOND POST /finish-runs against the same order succeeds."
        test_recipe:
          setup: "The canonical order carried to build_stage IN_FINISH with a 12-coat NITRO run curing in FB-1."
          setup_api_calls: *chain_a
          trigger: "POST /finish-runs/${fr1}/complete-spray as FinishTech, then POST /finish-runs/${fr1}/reject with reason ORANGE_PEEL as QualityInspector"
          assert:
            http_status: 200
            finish_run_status: "REJECTED"
            build_order_build_stage: "IN_ASSEMBLY"
            build_order_commercial_status: "OPTIONS_LOCKED"
            build_order_refinish_count: 1
            booth_occupied_slots: 0
            note: "The cycle is genuinely closed: a subsequent POST /finish-runs with a freshly re-read expected_build_order_version returns 201 and drives build_stage back to IN_FINISH. commercial_status is untouched by the whole loop."

      - name: storage_room_quarantine_then_recertify_cycle
        grounds: "§1.2 StorageRoom.climate_status declares a four-transition cycle IN_SPEC -> OUT_OF_SPEC -> QUARANTINED -> IN_SPEC with an empty terminal_states list. The QUARANTINED hop is time-gated on QUARANTINE_AFTER_HOURS (24) measured from out_of_spec_since, and certify additionally requires the LATEST reading to be back inside tolerance."
        distinguishing_aspect: "A mechanically different non-linearity from the refinish cycle: this loop is driven by the SAME endpoint firing three different transitions depending on elapsed time and reading value, and it has a self-healing branch (a good reading from OUT_OF_SPEC returns to IN_SPEC directly, skipping QUARANTINED). An implementation that quarantines on the first bad reading reports QUARANTINED after step 1; one that ignores out_of_spec_since never reaches QUARANTINED at all; one that lets a reading clear QUARANTINED skips the certify requirement entirely."
        test_recipe:
          setup: "A single DRY_STORE room targeting 45.0% RH with a 3.0 point tolerance."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /storage-rooms/${dry1}/climate-readings", payload: { rh_pct: 61.0, temp_c: 22.0 }, as: FinishTech }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-02T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms/${dry1}/climate-readings", payload: { rh_pct: 62.0, temp_c: 22.0 }, as: FinishTech }
            - { call: "POST /storage-rooms/${dry1}/climate-readings", payload: { rh_pct: 48.0, temp_c: 21.0 }, as: FinishTech }
          trigger: "POST /storage-rooms/${dry1}/certify as PlantAdmin"
          assert:
            http_status: 200
            climate_status: "IN_SPEC"
            out_of_spec_since: null
            latest_rh_pct: 48.0
            latest_temp_c: 21.0
            note: "Step 3 drove IN_SPEC -> OUT_OF_SPEC with out_of_spec_since 2026-08-01T00:00:00Z. Step 5, exactly 24 hours later, satisfied the inclusive >= QUARANTINE_AFTER_HOURS gate and drove OUT_OF_SPEC -> QUARANTINED. Step 6 updated latest_rh_pct to 48.0 but left climate_status QUARANTINED — readings never clear a quarantine. Only certify closes the cycle, and it needed abs(48.0 - 45.0) <= 3.0 to be allowed."

      - name: build_stage_and_commercial_status_advance_independently
        grounds: "§1.2 declares TWO state machines over the same BuildOrder row: build_stage (DRAFT ... SERIALIZED) and commercial_status (QUOTED ... CLOSED). confirm and lock-options move only the commercial dimension; release-components moves only the physical dimension, and it is the single point where the two interlock (it demands commercial_status OPTIONS_LOCKED)."
        distinguishing_aspect: "A third, orthogonal non-linearity: parallel rather than cyclic. An implementation that collapses the two dimensions into one lifecycle either advances build_stage on confirm (reporting COMPONENTS_RELEASED before the shop floor has been told) or refuses release-components because build_stage is 'behind'. The observable signature is a single GET showing build_stage DRAFT together with commercial_status OPTIONS_LOCKED — a combination that is impossible in a collapsed model."
        test_recipe:
          setup: "A custom-shop order with one approved ARTISAN option, confirmed with a 200000 cent deposit."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /option-catalog", payload: { option_code: "INL-VINE", option_group: "INLAY", upcharge_cents: 130000, complexity_class: "ARTISAN", lead_time_days: 45, incompatible_option_codes: ["INL-DOT"] }, as: PlantAdmin, captures: { optA: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-001", model_code: "OM45", base_price_cents: 480000, is_custom_shop: true, artist_tier: "ENDORSER", finish_system: "NITRO", promised_date: "2026-10-01T00:00:00Z" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { bo1: "$.data.id", bo_v1: "$.data.version" } }
            - { call: "POST /build-orders/${bo1}/option-selections", payload: { option_id: "${optA}", quantity: 1, expected_build_order_version: "${bo_v1}" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { sel1: "$.data.id" } }
            - { call: "POST /option-selections/${sel1}/approve", payload: {}, as: CustomShopCoordinator, as_user_id: "csc-dana" }
            - { call: "POST /build-orders/${bo1}/confirm", payload: { deposit_cents: 200000 }, as: CustomShopCoordinator, as_user_id: "csc-bob" }
          trigger: "POST /build-orders/${bo1}/lock-options as CustomShopCoordinator, then GET /build-orders/${bo1}"
          assert:
            http_status: 200
            build_stage: "DRAFT"
            commercial_status: "OPTIONS_LOCKED"
            binding_quote_total_cents: 716610
            deposit_paid_cents: 200000
            deposit_held_cents: 200000
            note: "Two full commercial transitions have fired while the physical dimension has not moved at all. A subsequent POST /build-orders/${bo1}/release-components as Machinist then moves build_stage DRAFT -> COMPONENTS_RELEASED while commercial_status stays OPTIONS_LOCKED, and the same call issued BEFORE lock-options would have failed with ERR_COMMERCIAL_STATUS_INVALID."

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: climate_excursion_cascades_four_levels_deep
        grounds: "§1.2 StorageRoom IN_SPEC -> OUT_OF_SPEC spells out three explicitly-labelled cascade links: FinishRun CURING -> CURE_SUSPENDED, then BuildOrder IN_FINISH -> FINISH_HELD, then StationReservation HELD -> RELEASED with the Station minute-bucket moves. Four entities move from one POST."
        distinguishing_aspect: "Depth is the discriminator. An implementation that stops at level 2 leaves the order in IN_FINISH; one that stops at level 3 leaves the future reservation HELD and the station's held_minutes at 60. The conditional guard at level 4 is also load-bearing: only reservations with starts_at STRICTLY AFTER current_utc are released, so an already-started window would survive. The Station ledger makes the whole chain observable in integers."
        test_recipe:
          setup: "The canonical order curing in FB-1 at 2026-08-05T09:00:00Z, with one already-consumed CNC window and one future CNC window still held."
          setup_api_calls: *chain_a
          trigger: "POST /finish-runs/${fr1}/complete-spray as FinishTech; POST /station-reservations with station_id ${cnc1}, starts_at 2026-08-10T08:00:00Z, ends_at 2026-08-10T09:00:00Z, build_order_id ${bo1} as Machinist (capture res3); then POST /storage-rooms/${fb1}/climate-readings with rh_pct 60.0 and temp_c 22.0 as FinishTech"
          assert:
            http_status: 200
            booth_climate_status: "OUT_OF_SPEC"
            booth_out_of_spec_since: "2026-08-05T09:00:00Z"
            finish_run_status: "CURE_SUSPENDED"
            finish_run_cure_suspend_started_at: "2026-08-05T09:00:00Z"
            build_order_build_stage: "FINISH_HELD"
            reservation_res3_status: "RELEASED"
            station_cnc1_total_scheduled_minutes: 120
            station_cnc1_held_minutes: 0
            station_cnc1_consumed_minutes: 60
            station_cnc1_released_minutes: 60
            note: "abs(60.0 - 50.0) = 10.0 exceeds FB-1's 5.0 tolerance, so the booth goes OUT_OF_SPEC and all four levels fire in one request. cure_hours stays pinned at 408 and cure_ready_at is NOT recomputed; only the suspension clock starts. The consumed 60 minutes from res1 are untouched, proving the cascade released only the future hold."

      - name: lot_rejection_cascades_four_levels_through_a_different_spine
        grounds: "§1.2 TonewoodLot -> REJECTED spells out three labelled links along an entirely different entity spine: Billet {AVAILABLE, RESERVED} -> QUARANTINED, then Component -> QC_HELD with qc_hold_reason PROTECTED_SPECIES, then BuildOrder -> COMPLIANCE_HOLD with stage_before_compliance_hold recorded. §1.3 lot_board_feet_ledger defines the bucket movements the same call must perform."
        distinguishing_aspect: "Different root, different spine, different guard shape from the climate cascade: the filters here are on STATUS SETS ({AVAILABLE, RESERVED}, NOT IN {INSTALLED, SCRAPPED}, NOT IN {SERIALIZED, SCRAPPED}) rather than on a timestamp comparison, and level 4 must SAVE the pre-hold stage so clear-compliance-hold can restore it. An implementation that cascades but forgets stage_before_compliance_hold can never lift the hold correctly; one that skips the board-feet movement breaks the conservation invariant, leaving 99.10 board feet unaccounted for."
        test_recipe:
          setup: "The canonical order taken as far as an ACCEPTED component (build_stage COMPONENTS_RELEASED, billet RESERVED), with the APPENDIX_II rosewood lot already attested and released."
          setup_api_calls: &chain_b
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: PlantAdmin }
            - { call: "POST /storage-rooms", payload: { room_code: "DRY-1", room_type: "DRY_STORE", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 20 }, as: PlantAdmin, captures: { dry1: "$.data.id" } }
            - { call: "POST /storage-rooms", payload: { room_code: "BR-1", room_type: "BUILD_ROOM", target_rh_pct: 45.0, rh_tolerance_pct: 3.0, target_temp_c: 21.0, capacity_slots: 10 }, as: PlantAdmin, captures: { br1: "$.data.id" } }
            - { call: "POST /storage-rooms", payload: { room_code: "FB-1", room_type: "FINISH_BOOTH", target_rh_pct: 50.0, rh_tolerance_pct: 5.0, target_temp_c: 21.0, capacity_slots: 1 }, as: PlantAdmin, captures: { fb1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "CNC-1", station_type: "CNC_ROUTER", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { cnc1: "$.data.id" } }
            - { call: "POST /stations", payload: { station_code: "HS-1", station_type: "HAND_SHAPING", room_id: "${br1}", changeover_minutes: 30 }, as: PlantAdmin, captures: { hs1: "$.data.id" } }
            - { call: "POST /component-specs", payload: { spec_code: "TOP-OM", component_type: "BODY_TOP", required_species_codes: ["SITKA_SPRUCE", "EAST_INDIAN_ROSEWOOD"], min_grade: "AA", nominal_board_feet: 6.00, target_thickness_mm: 2.90, thickness_tolerance_mm: 0.10, cnc_minutes: 45, hand_shape_minutes: 60, required_room_type: "BUILD_ROOM" }, as: PlantAdmin, captures: { spec1: "$.data.id" } }
            - { call: "POST /tonewood-lots", payload: { lot_code: "LOT-001", species_code: "EAST_INDIAN_ROSEWOOD", cites_appendix: "APPENDIX_II", board_feet_received: 100.00, moisture_content_pct: 12.0, storage_room_id: "${dry1}" }, as: WoodBuyer, captures: { lot1: "$.data.id" } }
            - { call: "POST /tonewood-lots/${lot1}/attest-permit", payload: { permit_number: "CITES-II-4471" }, as: ComplianceOfficer, as_user_id: "co-alice" }
            - { call: "POST /tonewood-lots/${lot1}/moisture-readings", payload: { moisture_content_pct: 7.0 }, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/condition", payload: {}, as: WoodBuyer }
            - { call: "POST /tonewood-lots/${lot1}/release", payload: {}, as: WoodBuyer, captures: { lot_v1: "$.data.version" } }
            - { call: "POST /billets", payload: { billet_code: "BLT-001", lot_id: "${lot1}", board_feet: 30.00, grade: "AAA", expected_tonewood_lot_version: "${lot_v1}" }, as: Machinist, captures: { blt1: "$.data.id" } }
            - { call: "POST /option-catalog", payload: { option_code: "INL-VINE", option_group: "INLAY", upcharge_cents: 130000, complexity_class: "ARTISAN", lead_time_days: 45, incompatible_option_codes: ["INL-DOT"] }, as: PlantAdmin, captures: { optA: "$.data.id" } }
            - { call: "POST /build-orders", payload: { order_code: "ORD-001", model_code: "OM45", base_price_cents: 480000, is_custom_shop: true, artist_tier: "ENDORSER", finish_system: "NITRO", promised_date: "2026-10-01T00:00:00Z" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { bo1: "$.data.id", bo_v1: "$.data.version" } }
            - { call: "POST /build-orders/${bo1}/option-selections", payload: { option_id: "${optA}", quantity: 1, expected_build_order_version: "${bo_v1}" }, as: CustomShopCoordinator, as_user_id: "csc-bob", captures: { sel1: "$.data.id" } }
            - { call: "POST /option-selections/${sel1}/approve", payload: {}, as: CustomShopCoordinator, as_user_id: "csc-dana" }
            - { call: "POST /build-orders/${bo1}/confirm", payload: { deposit_cents: 200000 }, as: CustomShopCoordinator, as_user_id: "csc-bob" }
            - { call: "POST /build-orders/${bo1}/lock-options", payload: {}, as: CustomShopCoordinator, as_user_id: "csc-bob" }
            - { call: "POST /build-orders/${bo1}/release-components", payload: {}, as: Machinist }
            - { call: "POST /components", payload: { spec_id: "${spec1}", billet_id: "${blt1}", build_order_id: "${bo1}" }, as: Machinist, captures: { cmp1: "$.data.id" } }
            - { call: "POST /station-reservations", payload: { station_id: "${cnc1}", starts_at: "2026-08-02T08:00:00Z", ends_at: "2026-08-02T09:00:00Z", build_order_id: "${bo1}", component_id: "${cmp1}" }, as: Machinist, captures: { res1: "$.data.id" } }
            - { call: "POST /components/${cmp1}/route", payload: { station_reservation_id: "${res1}", measured_thickness_mm: 2.90 }, as: Machinist }
            - { call: "POST /station-reservations", payload: { station_id: "${hs1}", starts_at: "2026-08-02T10:00:00Z", ends_at: "2026-08-02T11:00:00Z", build_order_id: "${bo1}", component_id: "${cmp1}" }, as: Luthier, captures: { res2: "$.data.id" } }
            - { call: "POST /components/${cmp1}/hand-shape", payload: { station_reservation_id: "${res2}", measured_thickness_mm: 2.90 }, as: Luthier }
            - { call: "POST /components/${cmp1}/qc", payload: { verdict: "ACCEPT" }, as: QualityInspector }
          trigger: "POST /tonewood-lots/${lot1}/reject with reason PERMIT_WITHDRAWN as ComplianceOfficer"
          assert:
            http_status: 200
            lot_status: "REJECTED"
            lot_permit_status: "INVALID"
            billet_status: "QUARANTINED"
            component_status: "QC_HELD"
            component_qc_hold_reason: "PROTECTED_SPECIES"
            build_order_build_stage: "COMPLIANCE_HOLD"
            build_order_stage_before_compliance_hold: "COMPONENTS_RELEASED"
            lot_board_feet_available: 0.00
            lot_board_feet_unassigned: 0.00
            lot_board_feet_reserved: 0.00
            lot_board_feet_scrapped: 99.10
            lot_board_feet_kerf_loss: 0.90
            note: "One POST moves a TonewoodLot, a Billet, a Component and a BuildOrder. The ledger still reconciles: 0.00 + 0.00 + 0.00 + 0.00 + 99.10 + 0.90 = 100.00 = board_feet_received. A following POST /components/${cmp1}/disposition with disposition REWORK must be refused with ERR_REWORK_NOT_PERMITTED because impounded wood may only be scrapped."

      - name: inspection_failure_cascades_three_levels_into_commercial_risk
        grounds: "§1.2 SetupInspection MEASURED -> FAILED spells out link 1 (BuildOrder build_stage INSPECTION -> SETUP, rework_round_count += 1) and link 2 (at REWORK_ESCALATION_THRESHOLD the commercial dimension flips to AT_RISK, promised_date slips REWORK_SLIP_DAYS and priority_score is recomputed). §1.3 build_priority_score supplies the arithmetic."
        distinguishing_aspect: "A third cascade whose depth is CONDITIONAL on an accumulated counter rather than on a status filter or a timestamp: the FIRST failure cascades only two levels (stage plus counter) while the SECOND crosses the threshold and reaches the commercial dimension, the promised date and the priority score. An implementation that escalates on the first failure reports AT_RISK one round early; one that never escalates leaves commercial_status OPTIONS_LOCKED with priority_score unchanged at 69.50 instead of 87.50."
        test_recipe:
          setup: "The canonical order carried to build_stage INSPECTION, with round 1 already failed (rework_round_count 1, order back in SETUP) and round 2 opened and measured out of spec."
          setup_api_calls: *chain_a
          trigger: "Carry the order to INSPECTION (complete-spray, advance the clock to 2026-08-22T09:00:00Z, buff, complete, fretwork, setup), then run round 1: POST /build-orders/${bo1}/setup-inspections as Luthier lu-eve, POST /setup-inspections/{round1}/measure with action_mm_treble 1.75, action_mm_bass 2.10, relief_mm 0.20, intonation_cents_max 4.8 as lu-eve, POST /setup-inspections/{round1}/sign as QualityInspector qi-frank; then POST /build-orders/${bo1}/setup as Luthier is not needed because the failure already returned the order to SETUP; open round 2 with POST /build-orders/${bo1}/setup-inspections as lu-eve, measure it identically, and finally POST /setup-inspections/{round2}/sign as qi-frank"
          assert:
            http_status: 200
            inspection_round_number: 2
            inspection_status: "FAILED"
            inspection_verdict: "FAIL"
            inspection_deviation_score: 13.00
            build_order_build_stage: "SETUP"
            build_order_rework_round_count: 2
            build_order_commercial_status: "AT_RISK"
            build_order_promised_date: "2026-10-15T00:00:00Z"
            build_order_priority_score: 87.50
            note: "After round 1 the order was in SETUP with rework_round_count 1, commercial_status still OPTIONS_LOCKED and promised_date still 2026-10-01T00:00:00Z. Round 2 crosses REWORK_ESCALATION_THRESHOLD 2: promised_date slips 14 days to 2026-10-15 and priority_score becomes 40 (SIGNATURE is not set here, artist_tier is ENDORSER so 20) + 15 (custom shop) + 25 (AT_RISK) + max(0, 90 - 54) * 0.5 = 20 + 15 + 25 + 27.50 = 87.50 at current_utc 2026-08-22T09:00:00Z."

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: p1_build_stage_state_check_outranks_booth_climate_posture
        grounds: "§1.4 priority 50 (state) carries the note 'PRIORITY PAIR P1 — this rule OUTRANKS the climate posture check at priority 60', and priority 60 (business_safety, ERR_ROOM_CLIMATE_OUT_OF_SPEC) lists POST /finish-runs among its endpoints. Both rules are armed by the same request."
        distinguishing_aspect: "Pair P1 sits at the 50/60 rungs and is decided by category (state before business_safety). An implementation that checks the physical world before the paperwork returns ERR_ROOM_CLIMATE_OUT_OF_SPEC; the correct answer is ERR_BUILD_STAGE_INVALID because an order that is not yet IN_ASSEMBLY has no business asking for a booth at all, in spec or not."
        test_recipe:
          setup: "The canonical order left at build_stage COMPONENTS_RELEASED (start-assembly deliberately NOT called) with one ACCEPTED component."
          setup_api_calls: *chain_b
          trigger: "POST /storage-rooms/${fb1}/climate-readings with rh_pct 60.0 and temp_c 22.0 as FinishTech (driving FB-1 to OUT_OF_SPEC), then GET /build-orders/${bo1} to read the current version, then POST /finish-runs with build_order_id ${bo1}, booth_id ${fb1}, finish_system NITRO, coat_count 8 and that correct expected_build_order_version, as FinishTech"
          assert:
            http_status: 409
            error_id: "ERR_BUILD_STAGE_INVALID"
            losing_error_id: "ERR_ROOM_CLIMATE_OUT_OF_SPEC"
            booth_climate_status: "OUT_OF_SPEC"
            build_order_build_stage: "COMPONENTS_RELEASED"
            finish_runs_for_order_count: 0
            note: "Both conditions are genuinely true: build_stage is COMPONENTS_RELEASED (not IN_ASSEMBLY) AND FB-1 is OUT_OF_SPEC because abs(60.0 - 50.0) = 10.0 > 5.0. The OCC field is correct, so priority 55 is not in play. Exactly one error body comes back and it is the priority-50 one."

      - name: p2_cites_compliance_outranks_deposit_settlement
        grounds: "§1.4 priority 61 carries the note 'PRIORITY PAIR P2 — this rule OUTRANKS the deposit settlement check at priority 85 ... Wildlife law outranks money', and priority 85 (ERR_DEPOSIT_INSUFFICIENT, 402) lists POST /export-shipments/{shipment_id}/release. §1.3 gives MIN_SETTLE_BP 2000 and MIN_DEPOSIT_BP 1000."
        distinguishing_aspect: "A different pair of rungs (61/85), a different category clash (business_safety versus business_fiscal) and — crucially — a different HTTP STATUS on each side: 409 for the winner, 402 for the loser. An implementation that validates cheapest-first, or that treats a 402 as more urgent than a 409, returns ERR_DEPOSIT_INSUFFICIENT. Arming the trap also requires a minimum-legal deposit at confirm, so the shortfall only becomes visible at settlement."
        test_recipe:
          setup: "The canonical order confirmed with the smallest legal deposit (88619 cents), carried all the way to SERIALIZED / INVOICED, with a CITES shipment whose docs are attached — and only then is the contributing rosewood permit withdrawn."
