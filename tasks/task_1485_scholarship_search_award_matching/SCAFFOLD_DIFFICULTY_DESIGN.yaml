              payload: { full_name: "Inv One", email: "i1@x.com", grade_level: 12, gpa_hundredths: 350, residency_state: "CA", intended_major: "STEM", household_income_cents: 3000000, efc_cents: 0, cost_of_attendance_cents: 3000000, institution_name: "State U" }
