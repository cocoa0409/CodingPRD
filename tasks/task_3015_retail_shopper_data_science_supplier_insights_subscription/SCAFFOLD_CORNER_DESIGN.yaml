        claim_type: scheduled_actions
        grounds: [endpoints]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z: a grant whose window ends at that instant is already expired without any clock call."
        test_recipe:
          setup:
