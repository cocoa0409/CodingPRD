            - "Configuration.${vvb_cf}.status == DRAFT"

      - name: substitution_by_factory_ops_forbidden_and_compatible_passes
        claim_type: satisfaction_pass
        grounds: ['validations[priority=15]', state_machines.SubstitutionRequest.PENDING_to_APPROVED]
        distinguishing_aspect: "Satisfaction path: a compatible proposed component (ALLOWED for the chassis) approves cleanly, swaps the job's component, and re-prices the order by price_delta * qty."
        test_recipe:
          setup: ["shortage-blocked job; PENDING substitution SSD-A(5000c) -> SSD-B(7000c) for a qty-2 line; order total before approval 210000c"]
          setup_api_calls:
            - { call: "POST /api/accounts", payload: { company_name: "VV3", account_tier: "STANDARD", credit_limit_cents: 10000000 }, as: PlatformAdmin, captures: { vv3_a: $.data.id } }
            - { call: "POST /api/chassis-models", payload: { model_code: "VVL3", category: "LAPTOP", base_price_cents: 100000, build_duration_hours: 24 }, as: PlatformAdmin, captures: { vv3_l: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "VV3S1", kind: "STORAGE", price_cents: 5000, lead_time_days: 3, stock_on_hand: 0, revision: "A01" }, as: PlatformAdmin, captures: { vv3_s1: $.data.id } }
            - { call: "POST /api/components", payload: { sku: "VV3S2", kind: "STORAGE", price_cents: 7000, lead_time_days: 3, stock_on_hand: 50, revision: "A01" }, as: PlatformAdmin, captures: { vv3_s2: $.data.id } }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${vv3_l}", component_id: "${vv3_s1}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - { call: "POST /api/compatibility-rules", payload: { chassis_model_id: "${vv3_l}", component_id: "${vv3_s2}", rule_type: "ALLOWED" }, as: PlatformAdmin }
            - call: "POST /api/configurations"
              payload:
                account_id: "${vv3_a}"
                chassis_model_id: "${vv3_l}"
                component_selections: [{ component_id: "${vv3_s1}", qty: 1 }]
              as: CustomerUser
              as_user_id: "${vv3_a}"
              captures: { vv3_cf: $.data.id }
            - { call: "POST /api/configurations/${vv3_cf}/validate", payload: {}, as: CustomerUser, as_user_id: "${vv3_a}", captures: { vv3_cv: $.data.version } }
            - { call: "POST /api/orders", payload: { account_id: "${vv3_a}", po_number: "PO-VV3" }, as: CustomerUser, as_user_id: "${vv3_a}", captures: { vv3_o: $.data.id } }
            - { call: "POST /api/orders/${vv3_o}/lines", payload: { configuration_id: "${vv3_cf}", qty: 2, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${vv3_a}" }
            - { call: "POST /api/orders/${vv3_o}/submit", payload: { expected_configuration_version: "${vv3_cv}" }, as: CustomerUser, as_user_id: "${vv3_a}" }
            - call: "GET /api/orders/${vv3_o}/build-jobs"
              payload: {}
              as: FactoryOps
              captures:
                vv3_j: $.data[0].id
            - { call: "POST /api/build-jobs/${vv3_j}/allocate", payload: {}, as: FactoryOps }
            - call: "GET /api/build-jobs/${vv3_j}/substitution-requests"
              payload: {}
              as: FactoryOps
              captures:
                vv3_sr: $.data[0].id
            - { call: "POST /api/substitution-requests/${vv3_sr}/reject", payload: {}, as: CustomerUser, as_user_id: "${vv3_a}" }
            - { call: "POST /api/substitution-requests/${vv3_sr}/repropose", payload: { proposed_component_id: "${vv3_s2}" }, as: FactoryOps }
          trigger:
            - { call: "POST /api/substitution-requests/${vv3_sr}/approve", payload: {}, as: CustomerUser, as_user_id: "${vv3_a}" }
          assert:
            - "SubstitutionRequest.${vv3_sr}.status == APPROVED"
            - "BuildJob.${vv3_j}.status == QUEUED   # back in queue with swapped component"
            - "Order.${vv3_o}.build_status == SUBMITTED and total_cents == 214000   # 210000 + 2000 * 2"
            - "CustomerAccount.${vv3_a}.outstanding_cents == 214000"

      - name: substitution_incompatible_component_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=15]', 'errors[ERR_SUBSTITUTION_INCOMPATIBLE]']
