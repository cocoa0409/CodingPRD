  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_cancelled_permit_state_beats_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_INVALID_PERMIT_STATE]
          - errors[ERR_DEPOSIT_NOT_PAID]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a CANCELLED permit whose invoice also has
          paid_cents < deposit_cents fails both the state gate (p7) and the fiscal gate (p11);
          the response MUST be ERR_INVALID_PERMIT_STATE, proving state precedes fiscal.
        test_recipe:
          setup:
            - "Application awarded -> Permit RESERVED; invoice still DRAFT and unpaid (0 < deposit 4000)"
            - "Permit cancelled from RESERVED (0% penalty); permit now CANCELLED AND deposit unpaid"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: AthleticsAdmin }
            - { call: "POST /organizations", payload: { name: "Riverview SC", classification: "RESIDENT", org_type: "YOUTH_LEAGUE", prior_seasons_active: 3 }, as: AthleticsAdmin, captures: { o_id: $.data.id } }
            - { call: "POST /facilities", payload: { name: "Memorial Field 1", facility_class: "RECTANGLE", has_lights: true, capacity: 120, weekly_prime_hour_cap: 12, nightly_light_block_cap: 16 }, as: AthleticsAdmin, captures: { f_id: $.data.id } }
