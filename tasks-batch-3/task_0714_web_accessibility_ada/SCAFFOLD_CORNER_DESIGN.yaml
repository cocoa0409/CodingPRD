scaffold_corner_design:

  # =================================================================
  - section: entities
    instances:
      - name: create_organization_returns_201_with_fields
        claim_type: Creation
        grounds: ["entities.Organization", "endpoints[POST /compliance/organizations]"]
        distinguishing_aspect: "POST with legal_name+contact_email returns 201 and echoes both fields plus system id; account_credit_cents defaults 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id", credit: "$.data.account_credit_cents" }
          assert:
            - "Organization.${org_id}.legal_name == Acme"
            - "Organization.${org_id}.account_credit_cents == 0"

      - name: get_site_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Site", "endpoints[GET /compliance/sites/{id}]", "errors[ERR_RESOURCE_NOT_FOUND]"]
        distinguishing_aspect: "GET /sites/{nonexistent-uuid} returns ERR_RESOURCE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /compliance/sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_RESOURCE_NOT_FOUND"
            - "http_status == 404"

      - name: create_site_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: ["entities.Site", "endpoints[POST /compliance/sites]", "errors[ERR_MISSING_REQUIRED_FIELD]"]
        distinguishing_aspect: "POST /sites omitting audited_page_count returns ERR_MISSING_REQUIRED_FIELD (422)."
        test_recipe:
          setup: ["one organization"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://x.test" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_MISSING_REQUIRED_FIELD"
            - "http_status == 422"

      - name: create_site_page_count_below_one_returns_422
        claim_type: Type Constraints
        grounds: ["entities.Site.fields.audited_page_count", "errors[ERR_INVALID_FIELD_VALUE]"]
        distinguishing_aspect: "audited_page_count=0 violates integer>=1 -> ERR_INVALID_FIELD_VALUE (422)."
        test_recipe:
          setup: ["one organization"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://y.test", audited_page_count: 0 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_FIELD_VALUE"
            - "http_status == 422"

      - name: scan_bad_enum_wcag_level_returns_422
        claim_type: Type Constraints
        grounds: ["entities.Scan.fields.wcag_target_level", "errors[ERR_INVALID_FIELD_VALUE]"]
        distinguishing_aspect: "wcag_target_level=AAAA is not in {A,AA,AAA} -> ERR_INVALID_FIELD_VALUE (422)."
        test_recipe:
          setup: ["org+site"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://z.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "AAAA" }
              as: AuditEngineer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_FIELD_VALUE"
            - "http_status == 422"

      - name: list_sites_pagination_envelope_present
        claim_type: Listing
        grounds: ["entities.Site", "endpoints[GET /compliance/sites]"]
        distinguishing_aspect: "GET /sites returns response_type=array with pagination total_count/has_more."
        test_recipe:
          setup: ["org with one site"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://l.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /compliance/sites?organization_id=${org_id}&limit=10&offset=0"
              payload: {}
              as: OrgAdmin
              as_user_id: "${org_id}"
          assert:
            - "response_type == array"
            - "meta.total_count == 1"
            - "meta.has_more == false"

      - name: list_sites_invalid_pagination_returns_422
        claim_type: Listing
        grounds: ["endpoints[GET /compliance/sites]", "errors[ERR_INVALID_PAGINATION]", "validations[priority=19]"]
        distinguishing_aspect: "GET /sites?limit=0 violates pagination bounds -> ERR_INVALID_PAGINATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /compliance/sites?limit=0"
              payload: {}
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_PAGINATION"
            - "http_status == 422"

      - name: retest_run_immutable_no_version_field
        claim_type: Immutability
        grounds: ["entities.RetestRun", "endpoints[POST /compliance/retest-runs]"]
        distinguishing_aspect: "RetestRun is common_fields:false append-only; response carries id+created_at but no version field and no update endpoint exists."
        excluded_because:
          difficulty_instance: non_linear_state_machine / finding_remediation_revision_cycle
          rationale: "RetestRun creation (PASS/FAIL) is exercised within the revision-cycle §1.8 instance; immutability is its structural corollary."

  # =================================================================
  - section: state_machines
    instances:
      - name: cancel_scan_from_running_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.Scan.QUEUED_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "cancel is only valid from QUEUED; calling it on a RUNNING scan returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["org+ACTIVE sub+site; a scan in RUNNING"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "SCAN" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://run.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "A" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
          trigger:
            - call: "POST /compliance/scans/${scan_id}/cancel"
              payload: {}
              as: AuditEngineer
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: legal_resolve_from_received_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.LegalDemand.RESPONDING_to_RESOLVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "resolve requires status IN {RESPONDING,ESCALATED}; calling resolve on a RECEIVED demand returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["org+site; a LegalDemand in RECEIVED"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://ld.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/legal-demands"
              payload: { site_id: "${site_id}", claimant_name: "X", response_due_at: "2026-04-01T00:00:00Z" }
              as: ComplianceManager
              captures: { ld_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/legal-demands/${ld_id}/resolve"
              payload: {}
              as: ComplianceManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: terminal_resolved_finding_cannot_accept_risk
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.AuditFinding.OPEN_to_WONT_FIX_ACCEPTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "accept-risk requires OPEN; a RESOLVED (terminal) finding rejects accept-risk with ERR_INVALID_STATE."
        test_recipe:
          setup: ["org+ACTIVE sub+site; finding driven OPEN->...->RESOLVED via PASS retest"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "SCAN" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://res.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "A" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" } ] }
              as: AuditEngineer
            - call: "GET /compliance/findings?scan_id=${scan_id}"
              payload: {}
              as: AuditEngineer
              captures: { f_id: "$.data[0].id" }
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f_id}", assigned_vendor_id: "v1", estimated_effort_hours: 2 }
              as: RemediationVendor
              captures: { task_id: "$.data.id" }
            - call: "POST /compliance/remediation-tasks/${task_id}/begin"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/remediation-tasks/${task_id}/submit"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/retest-runs"
              payload: { finding_id: "${f_id}", remediation_task_id: "${task_id}", outcome: "PASS" }
              as: AuditEngineer
          trigger:
            - call: "POST /compliance/findings/${f_id}/accept-risk"
              payload: {}
              as: ComplianceManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: newly_created_scan_starts_queued
        claim_type: Initial State
        grounds: ["state_machines.Scan", "entities.Scan.fields.status"]
        distinguishing_aspect: "A freshly created scan has status QUEUED and version 1."
        test_recipe:
          setup: ["org+site"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://init.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "AA" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id", st: "$.data.status", v: "$.data.version" }
          assert:
            - "Scan.${scan_id}.status == QUEUED"
            - "Scan.${scan_id}.version == 1"

      - name: supersede_target_not_rejected_returns_409
        claim_type: Precondition Enforcement
        grounds: ["state_machines.AuditFinding.REOPENED_to_IN_REMEDIATION", "errors[ERR_SUPERSEDE_TARGET_NOT_REJECTED]"]
        distinguishing_aspect: "Creating a task with supersedes_task_id pointing at an ASSIGNED (not REJECTED) task returns ERR_SUPERSEDE_TARGET_NOT_REJECTED (409)."
        test_recipe:
          setup: ["org+ACTIVE sub+site; finding OPEN with one ASSIGNED task t1 (not rejected)"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "SCAN" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://sup.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "A" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" } ] }
              as: AuditEngineer
            - call: "GET /compliance/findings?scan_id=${scan_id}"
              payload: {}
              as: AuditEngineer
              captures: { f_id: "$.data[0].id" }
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f_id}", assigned_vendor_id: "v1", estimated_effort_hours: 2 }
              as: RemediationVendor
              captures: { t1_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f_id}", assigned_vendor_id: "v2", estimated_effort_hours: 3, supersedes_task_id: "${t1_id}" }
              as: RemediationVendor
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_SUPERSEDE_TARGET_NOT_REJECTED"
            - "http_status == 409"

      - name: vpat_revoke_cascades_certification_revoked
        claim_type: Side Effect Execution
        grounds: ["state_machines.VpatReport.ISSUED_to_REVOKED", "state_machines.Certification.GRANTED_to_REVOKED"]
        distinguishing_aspect: "Revoking an ISSUED VPAT cascades its GRANTED certification to REVOKED."
        excluded_because:
          difficulty_instance: compensating_invariant / vpat_issue_revoke_conserves_certification_count
          rationale: "The cascade VPAT-revoke -> Certification REVOKED is the asserted core of that §1.8 instance."

  # =================================================================
  - section: calculations
    instances:
      - name: empty_scan_findings_all_resolved_gives_full_score
        claim_type: Correct Result
        grounds: ["calculations.conformance_score"]
        distinguishing_aspect: "Scan with a single CRITICAL finding later RESOLVED -> certified score = 100.00 (passed_weight==total_weight)."
        test_recipe:
          setup: ["org+ACTIVE sub+site; scan COMPLETED 1 CRITICAL; resolved; VPAT pinned & issuable"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "SCAN" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://full.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "A" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" } ] }
              as: AuditEngineer
            - call: "GET /compliance/findings?scan_id=${scan_id}"
              payload: {}
              as: AuditEngineer
              captures: { f_id: "$.data[0].id" }
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f_id}", assigned_vendor_id: "v1", estimated_effort_hours: 2 }
              as: RemediationVendor
              captures: { task_id: "$.data.id" }
            - call: "POST /compliance/remediation-tasks/${task_id}/begin"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/remediation-tasks/${task_id}/submit"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/retest-runs"
              payload: { finding_id: "${f_id}", remediation_task_id: "${task_id}", outcome: "PASS" }
              as: AuditEngineer
            - call: "POST /compliance/vpat-reports"
              payload: { site_id: "${site_id}", source_scan_id: "${scan_id}" }
              as: ComplianceManager
              captures: { vpat_id: "$.data.id" }
            - call: "GET /compliance/scans/${scan_id}"
              payload: {}
              as: ComplianceManager
              captures: { scan_v: "$.data.version" }
          trigger:
            - call: "POST /compliance/vpat-reports/${vpat_id}/issue"
              payload: { expected_scan_version: "${scan_v}" }
              as: ComplianceManager
              captures: { cs: "$.data.certified_conformance_score", lvl: "$.data.conformance_level" }
          assert:
            - "VpatReport.${vpat_id}.certified_conformance_score == 100.00"
            - "VpatReport.${vpat_id}.conformance_level == WCAG_AA_FULL"

      - name: provisional_score_frozen_at_completion
        claim_type: Variant Selection
        grounds: ["calculations.conformance_score", "entities.Scan.fields.provisional_conformance_score"]
        distinguishing_aspect: "provisional_conformance_score is frozen at completion (all OPEN -> 0.00) and does not change when findings later resolve."
        excluded_because:
          difficulty_instance: dual_variant_calc / conformance_provisional_vs_certified_diverge
          rationale: "Provisional==0.00 at completion is asserted in the dual-variant §1.8 instance."

  # =================================================================
  - section: validations
    instances:
      - name: vpat_create_scan_not_completed_returns_409
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_SCAN_NOT_COMPLETED]", "endpoints[POST /compliance/vpat-reports]"]
        distinguishing_aspect: "Creating a DRAFT VPAT against a RUNNING (not COMPLETED) scan returns ERR_SCAN_NOT_COMPLETED (409)."
        test_recipe:
          setup: ["org+ACTIVE sub+site; a scan in RUNNING (never completed)"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "SCAN" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://nc.test", audited_page_count: 5 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "A" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
          trigger:
            - call: "POST /compliance/vpat-reports"
              payload: { site_id: "${site_id}", source_scan_id: "${scan_id}" }
              as: ComplianceManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_SCAN_NOT_COMPLETED"
            - "http_status == 409"

      - name: training_complete_below_pass_returns_422
        claim_type: Violation → Error
        grounds: ["validations[priority=13]", "errors[ERR_SCORE_BELOW_PASS]", "state_machines.TrainingEnrollment.IN_PROGRESS_to_COMPLETED"]
        distinguishing_aspect: "Completing training with score_pct=70 (<80) returns ERR_SCORE_BELOW_PASS (422)."
        test_recipe:
          setup: ["org; enrollment driven ENROLLED->IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Acme", contact_email: "a@acme.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/training-enrollments"
              payload: { organization_id: "${org_id}", learner_email: "lrn@acme.test" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { enr_id: "$.data.id" }
