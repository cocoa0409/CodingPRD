              captures: { ru: $.data.reserved_until }
          assert:
            - "ru == 2026-08-13T08:00:00Z (the T&S expiry, earlier than resulted_at+72h = 2026-08-13T09:00:00Z and unit expiry 2026-09-12T00:00:00Z)"
      - name: ffp_ab_patient_only_ab_plasma_compatible
        claim_type: correct_result
        grounds:
          - "calculations.unit_compatibility_decision"
        distinguishing_aspect: "Plasma-matrix edge branch: an AB patient may receive ONLY AB plasma; an A FFP unit is rejected at issue."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; patient AB NEG with ACTIVE T&S; FFP order READY; U-FFP-A (A NEG) AVAILABLE"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "FFP", abo_type: "A", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-200", product_type: "FFP", abo_type: "A", rh_type: "NEG", volume_ml: 250, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-510", lot_number: "LOT-2", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-200"
              as: BloodBankTechnologist
              captures: { u_ffp: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u_ffp}/release-from-quarantine"
              as: BloodBankTechnologist
            - call: "POST /blood-bank/patients"
              payload: { mrn: "M-3002", full_name: "Mona Doe", date_of_birth: "1973-03-03" }
              as: BloodBankTechnologist
              captures: { pat: $.data.id, pat_v: $.data.version }
            - call: "POST /blood-bank/type-and-screens"
              payload: { patient_id: "${pat}", specimen_collected_at: "2026-08-10T08:00:00Z", expected_patient_version: "${pat_v}" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { ts: $.data.id }
            - call: "POST /blood-bank/type-and-screens/${ts}/result"
              payload: { abo_result: "AB", rh_result: "NEG", antibody_screen: "NEGATIVE", antibody_identifications: [] }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
            - call: "POST /blood-bank/type-and-screens/${ts}/validate"
              as: BloodBankTechnologist
              as_user_id: "tech-b"
            - call: "POST /blood-bank/transfusion-orders"
              payload: { patient_id: "${pat}", product_type: "FFP", units_requested: 1, urgency: "ROUTINE", indication_code: "COAGULOPATHY" }
              as: OrderingPhysician
              as_user_id: "doc-1"
              captures: { ord: $.data.id }
            - call: "POST /blood-bank/transfusion-orders/${ord}/verify"
              as: BloodBankTechnologist
              as_user_id: "tech-a"
          trigger:
            - call: "POST /blood-bank/issue-records"
              payload: { order_id: "${ord}", unit_id: "${u_ffp}", verified_by_user_id: "tech-b" }
              as: BloodBankTechnologist
              as_user_id: "tech-a"
              captures: { err: $.data.error_id }
          assert:
            - "response is 422 ERR_UNIT_INCOMPATIBLE (AB patient plasma matrix admits only AB)"
            - "BloodUnit.${u_ffp}.status stays AVAILABLE"
      - name: supplier_cost_calc_corner
        claim_type: correct_result
        grounds:
          - "calculations.supplier_order_estimated_cost"
        excluded_because:
          difficulty_instance: supplier_order_cost_per_line_then_total_rounding
          rationale: "Per-line-then-sum rounding order, tier selection, and the single emergency-surcharge rounding are all asserted with literals there."
      - name: shelf_life_dual_variant_corner
        claim_type: variant_divergence
        grounds:
          - "calculations.unit_expiration_at_receive"
        excluded_because:
          difficulty_instance: ffp_unit_fixed_shelf_vs_thawed_clock
          rationale: "Both variants computed as literal expires_at values there."
      - name: posture_dual_variant_corner
        claim_type: variant_divergence
        grounds:
          - "calculations.bucket_physical_posture"
          - "calculations.bucket_prospective_posture"
        excluded_because:
          difficulty_instance: bucket_physical_vs_prospective_posture
          rationale: "CRITICAL vs NORMAL divergence on identical stock asserted there."
      - name: compatibility_inversion_corner
        claim_type: correct_result
        grounds:
          - "calculations.unit_compatibility_decision"
        excluded_because:
          difficulty_instance: compatibility_decision_abo_plasma_inversion
          rationale: "O-patient RBC-vs-FFP inverse-matrix behavior asserted there."
      - name: return_disposition_corner
        claim_type: correct_result
        grounds:
          - "calculations.return_disposition"
        excluded_because:
          difficulty_instance: return_thirty_minute_boundary
          rationale: "The 30m00s vs 30m01s boundary and both dispositions asserted there."
      - name: pack_constitution_corner
        claim_type: correct_result
        grounds:
          - "calculations.mtp_pack_constitution"
        excluded_because:
          difficulty_instance: mtp_pack_constitution_evaluation_order
          rationale: "Component order, preference-list walk over FEFO, and shortfall recording asserted there."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_400
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A call without X-User-Role/X-User-ID is rejected before any other check, even on a read endpoint."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /blood-bank/patients"
              captures: { err: $.data.error_id }
          assert:
            - "response is 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (not 403, not 404)"
      - name: over_receipt_returns_422
        claim_type: violation_to_error
        grounds:
          - "validations[priority=24]"
          - "errors[ERR_OVER_RECEIPT]"
        distinguishing_aspect: "Receiving two units against a line of quantity 1 exceeds the ordered amount."
        test_recipe:
          setup: ["supplier + order (RBC O NEG x1) ACKNOWLEDGED"]
          setup_api_calls:
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
          trigger:
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }, { unit_number: "U-101", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-501", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response is 422 ERR_OVER_RECEIPT"
            - "no units created: GET /blood-bank/blood-units?supplier_order_id=${so_id} -> total_count == 0 (the receipt is atomic)"
      - name: duplicate_active_policy_returns_409
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
          - "errors[ERR_POLICY_BUCKET_DUPLICATE]"
        distinguishing_aspect: "A second ACTIVE policy for the same bucket is rejected; retiring the first frees the bucket."
        test_recipe:
          setup: ["policy P1 ACTIVE for RBC:O:NEG"]
          setup_api_calls:
            - call: "POST /blood-bank/par-level-policies"
              payload: { product_type: "RBC", abo_type: "O", rh_type: "NEG", watch_threshold: 6, shortage_threshold: 4, critical_threshold: 2 }
              as: BloodBankSupervisor
              captures: { pol: $.data.id }
          trigger:
            - call: "POST /blood-bank/par-level-policies"
              payload: { product_type: "RBC", abo_type: "O", rh_type: "NEG", watch_threshold: 9, shortage_threshold: 9, critical_threshold: 9 }
              as: BloodBankSupervisor
              captures: { err: $.data.error_id }
            - call: "POST /blood-bank/par-level-policies/${pol}/retire"
              as: BloodBankSupervisor
            - call: "POST /blood-bank/par-level-policies"
              payload: { product_type: "RBC", abo_type: "O", rh_type: "NEG", watch_threshold: 9, shortage_threshold: 9, critical_threshold: 9 }
              as: BloodBankSupervisor
              captures: { pol2: $.data.id }
          assert:
            - "first duplicate attempt: 409 ERR_POLICY_BUCKET_DUPLICATE"
            - "after retire: create succeeds, ParLevelPolicy.${pol2}.status == ACTIVE and ${pol}.status == RETIRED"
      - name: supplier_suspended_blocks_submit
        claim_type: violation_to_error
        grounds:
          - "validations[priority=26]"
          - "errors[ERR_SUPPLIER_SUSPENDED]"
        distinguishing_aspect: "Submitting an order to a SUSPENDED supplier fails; creating the DRAFT is still allowed."
        test_recipe:
          setup: ["supplier S1 suspended; DRAFT order against it"]
          setup_api_calls:
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 1 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/suppliers/${sup_id}/suspend"
              payload: { reason: "documentation lapse" }
              as: BloodBankSupervisor
          trigger:
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response is 409 ERR_SUPPLIER_SUSPENDED"
            - "SupplierOrder.${so_id}.status stays DRAFT"
      - name: wastage_review_gate_blocks_coordinator_submit
        claim_type: violation_to_error
        grounds:
          - "validations[priority=29]"
          - "errors[ERR_WASTAGE_REVIEW_REQUIRED]"
          - "calculations.rolling_wastage_rate"
        distinguishing_aspect: "Conditional + role-dependent: with the bucket wastage rate at 0.3333 (>= 0.05) a SupplierCoordinator submit is blocked, while a BloodBankSupervisor submit of the same DRAFT succeeds."
        test_recipe:
          setup: ["clock 2026-08-10T09:00:00Z; 3 RBC O NEG units received, 1 discarded (rate 0.3333); new DRAFT order SO2 with an RBC line"]
          setup_api_calls:
            - call: "POST /blood-bank/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: BloodBankSupervisor
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 3 }] }
              as: SupplierCoordinator
              captures: { so1: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so1}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so1}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so1}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }, { unit_number: "U-101", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-501", lot_number: "LOT-1", antigen_negative: [] }, { unit_number: "U-102", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-502", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so1}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/discard"
              payload: { note: "qc failure" }
              as: BloodBankSupervisor
              as_user_id: "sup-1"
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 2 }] }
              as: SupplierCoordinator
              captures: { so2: $.data.id }
          trigger:
            - call: "POST /blood-bank/supplier-orders/${so2}/submit"
              as: SupplierCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /blood-bank/supplier-orders/${so2}/submit"
              as: BloodBankSupervisor
              captures: { so2_status: $.data.status }
          assert:
            - "coordinator submit: 409 ERR_WASTAGE_REVIEW_REQUIRED (rate 0.3333 >= 0.05 for the RBC:O:NEG bucket)"
            - "supervisor submit of the same DRAFT: 200, so2_status == SUBMITTED (role exemption)"
      - name: state_vs_safety_priority_corner
        claim_type: priority_ordering
        grounds:
          - "validations[priority=7]"
          - "validations[priority=8]"
        excluded_because:
          difficulty_instance: state_vs_safety_on_held_order_issue
          rationale: "Dual-failure ordering asserted there."
      - name: safety_vs_constraint_priority_corner
        claim_type: priority_ordering
        grounds:
          - "validations[priority=8]"
          - "validations[priority=22]"
        excluded_because:
          difficulty_instance: safety_vs_constraint_on_fulfilled_order_crossmatch
          rationale: "Dual-failure ordering asserted there."
      - name: existence_vs_state_priority_corner
        claim_type: priority_ordering
        grounds:
          - "validations[priority=5]"
          - "validations[priority=7]"
        excluded_because:
          difficulty_instance: existence_vs_state_on_issue
          rationale: "Dual-failure ordering asserted there."
      - name: ts_active_at_exact_expiry_corner
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "entities.TypeAndScreen.fields.expires_at"
        excluded_because:
          difficulty_instance: ts_expiry_exact_instant_crossmatch_rejected
          rationale: "The strict-inequality expiry boundary (both sides) asserted there."

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: pagination_defaults_and_limit_offset
        claim_type: listing
        grounds:
          - "response_envelope.pagination_defaults"
          - "endpoints[\"GET /blood-bank/blood-units\"]"
        distinguishing_aspect: "Default page is 10 with total_count/has_more; limit=5&offset=10 lands on the last page of 12."
        test_recipe:
          setup: ["supplier order with 12 received units"]
          setup_api_calls:
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 12 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-001", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-001", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-002", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-002", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-003", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-003", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-004", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-004", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-005", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-005", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-006", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-006", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-007", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-007", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-008", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-008", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-009", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-009", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-010", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-010", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-011", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-011", lot_number: "LOT-P", antigen_negative: [] }, { unit_number: "U-012", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-012", lot_number: "LOT-P", antigen_negative: [] }] }
              as: SupplierCoordinator
          trigger:
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}"
              as: BloodBankTechnologist
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&limit=5&offset=10"
              as: BloodBankTechnologist
          assert:
            - "default page: 10 items returned, total_count == 12, has_more == true (limit default 10, offset default 0)"
            - "limit=5&offset=10: 2 items returned, total_count == 12, has_more == false"
      - name: list_filter_by_status
        claim_type: listing
        grounds:
          - "endpoints[\"GET /blood-bank/blood-units\"]"
        distinguishing_aspect: "The status filter partitions the same collection: AVAILABLE returns one unit, QUARANTINED returns the other."
        test_recipe:
          setup: ["two units received; U-100 released, U-101 still QUARANTINED"]
          setup_api_calls:
            - call: "POST /blood-bank/suppliers"
              payload: { name: "SanguiServe", license_number: "LIC-100", default_lead_time_hours: 48 }
              as: BloodBankSupervisor
              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 2 }] }
              as: SupplierCoordinator
              captures: { so_id: $.data.id }
            - call: "POST /blood-bank/supplier-orders/${so_id}/submit"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/acknowledge"
              as: SupplierCoordinator
            - call: "POST /blood-bank/supplier-orders/${so_id}/receive"
              payload: { units: [{ unit_number: "U-100", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-500", lot_number: "LOT-1", antigen_negative: [] }, { unit_number: "U-101", product_type: "RBC", abo_type: "O", rh_type: "NEG", volume_ml: 300, collected_at: "2026-08-01T00:00:00Z", donor_id: "D-501", lot_number: "LOT-1", antigen_negative: [] }] }
              as: SupplierCoordinator
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&unit_number=U-100"
              as: BloodBankTechnologist
              captures: { u1: "$.data[0].id" }
            - call: "POST /blood-bank/blood-units/${u1}/release-from-quarantine"
              as: BloodBankTechnologist
          trigger:
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&status=AVAILABLE"
              as: BloodBankTechnologist
            - call: "GET /blood-bank/blood-units?supplier_order_id=${so_id}&status=QUARANTINED"
              as: BloodBankTechnologist
          assert:
            - "status=AVAILABLE -> total_count == 1 and the only row's unit_number == U-100"
            - "status=QUARANTINED -> total_count == 1 and the only row's unit_number == U-101"
      - name: get_nonexistent_unit_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_UNIT_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "A well-formed but unknown unit id yields the resource-specific 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /blood-bank/blood-units/00000000-0000-0000-0000-000000000000"
              as: BloodBankTechnologist
              captures: { err: $.data.error_id }
          assert:
