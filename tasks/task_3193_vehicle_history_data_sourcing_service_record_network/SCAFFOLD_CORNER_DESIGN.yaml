            - call: "GET /listings/${lst}"
              as: Any
              captures: { lv1: $.data.version }
            - call: "POST /dealers/${dl}/listings/${lst}/enroll_guarantee"
              payload: { expected_listing_version: "${lv1}" }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { g: $.data.guarantee_status }
          assert:
            - "Enroll with pre-publish version -> HTTP 412 ERR_STALE_VERSION"
            - "Enroll with current version -> g == 'ENROLLED'"

      - name: shop_tier_pro_upgrade_at_fifty_records
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.shop_tool_tier
        distinguishing_aspect: "reporting_tool_tier flips BASIC -> PRO exactly when the 50th ACTIVE service record lands (inclusive >= 50)."
        test_recipe:
          setup: ["network; shop ACTIVE; 49 service records submitted (transcribed as a loop by the unit-test generator)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /shops"
              payload: { legal_name: "S1" }
              as: NetworkAdmin
              captures: { shop: $.data.id }
            - call: "POST /shops/${shop}/approve"
              payload: {}
              as: NetworkAdmin
            # LOOP x49: expand verbatim with i = 1..49 substituted into payload_ref/idempotency_key
            - call: "POST /shops/${shop}/service-records"
              payload: { vin: "1HGCM82633A004352", event_date: "2026-08-01", odometer_reading: 10000, payload_ref: "s{i}", idempotency_key: "k-s{i}" }
              as: ShopOperator
              as_user_id: "${shop}"
          trigger:
            - call: "GET /shops/${shop}"
              as: Any
              captures: { t49: $.data.reporting_tool_tier }
            - call: "POST /shops/${shop}/service-records"
              payload: { vin: "1HGCM82633A004352", event_date: "2026-08-02", odometer_reading: 10100, payload_ref: "s50", idempotency_key: "k-s50" }
              as: ShopOperator
              as_user_id: "${shop}"
            - call: "GET /shops/${shop}"
              as: Any
              captures: { t50: $.data.reporting_tool_tier }
          assert:
            - "t49 == 'BASIC' (49 < 50)"
            - "t50 == 'PRO' (50 >= 50, inclusive threshold)"

  # =====================================================================
  # Section: consistency model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_cascade_in_same_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.vehicle_brand_rollup
        distinguishing_aspect: "All cascade effects are visible in the immediately-following GET: after a salvage title ingest, the very next vehicle read shows canonical_brand SALVAGE — no delay, no recompute endpoint."
        test_recipe:
          setup: ["network; MVA ACTIVE; CLEAN vehicle"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id }
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-09-01", payload_ref: "t2", idempotency_key: "k-t2" }
              as: SourceOperator
              as_user_id: "${mva}"
            - call: "GET /vehicles/${veh}"
              as: Any
              captures: { brand: $.data.canonical_brand, sev: $.data.brand_severity }
          assert:
            - "brand == 'SALVAGE' and sev == 5 immediately (no advance_epoch required)"
