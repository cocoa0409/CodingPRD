            - "LINK 3 — FundingSource.${s1}.disadvantaged_committed_cents == 100000, disadvantaged_share_pct == 100.00, equity_shortfall_cents == 0"
            - "LINK 4 — WaterSystem.${ws}.inventory_status == AMENDMENT_PENDING and WaterSystem.${ws}.program_posture == RESTRICTED"
            - "ReplacementOrder.${o1}.fulfillment_state == COMPLETED and ReplacementOrder.${o1}.replaced_sides == [UTILITY, CUSTOMER]"
            - "ReplacementOrder.${o1}.flushing_duration_minutes == 31"
            - "ServiceLine.${l1}.replacement_state == REPLACED_FULL"
            - "ServiceLine.${l1}.classification == NON_LEAD and ServiceLine.${l1}.inventory_state == CLASSIFIED_VERIFIED and ServiceLine.${l1}.certainty_score == 100.00"
            - "ServiceLine.${l1}.replacement_priority_score == 40.00"
            - "WaterSystem.${ws}.lead_count == 0 and WaterSystem.${ws}.non_lead_count == 1"

