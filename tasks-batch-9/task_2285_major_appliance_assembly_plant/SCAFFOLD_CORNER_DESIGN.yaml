          setup:
            - "Base fixture: Line L1 (ST10/ST20), SUP1, P-DOOR-A, WM-X RELEASED with POS-DOOR on P-DOOR-A, ShiftPlan A; slot index 1 SEQUENCED and RELEASED, so Line.max_released_sequence_index == 1"
