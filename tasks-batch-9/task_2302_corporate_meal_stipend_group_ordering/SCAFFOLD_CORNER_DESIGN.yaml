            - { call: "POST /benefit-periods", payload: { employee_id: "${emp_id}", period_month: "2026-09" }, as: BenefitsController, captures: { e_period: $.data.error_id } }
            - { call: "POST /benefit-periods/${per_id}/close", payload: { mode: "FINAL" }, as: Employee, as_user_id: "${emp_id}", captures: { e_close: $.data.error_id } }
            - { call: "POST /orders/${ord_id}/confirm", as: ProgramAdmin, captures: { e_confirm: $.data.error_id } }
