# =============================================================================
# task_3054 — Independent Broker-Dealer Affiliation Models & Advisor Payout Grid
# PRD Benchmark seed tables (§1.0 – §1.7)
# =============================================================================
scenario: |
  Independent Broker-Dealer Affiliation Models & Advisor Payout Grid (LPL Financial):
  affiliation model selection across independent contractor, employee, institutional and
  hybrid channels with different economics, payout grid computation on production tiers
  with product-level rate differences and retroactive true-up, transition assistance loans
  amortized against future production with forgiveness milestones, branch supervision
  structure with office of supervisory jurisdiction responsibilities, advisory versus
  brokerage account revenue split and fee levelization, advisor recruiting pipeline with
  book portability and protocol considerations, expense pass-through for technology,
  errors-and-omissions coverage and clearing charges, advisor departure with account
  retention contests

domain_name: broker-dealer-advisor-payout
api_prefix: /

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - rate_threshold_triggers
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: branch_code, type: string, source: input, description: "Human supervisor code for the branch (field operations key)", constraints: "unique; immutable after create" }
      - { name: name, type: string, source: input, description: "Branch display name" }
      - { name: transmittal_account, type: string, source: input, description: "Supervisory transmittal account the branch clears through", constraints: "unique" }
      - { name: osj_name, type: string, source: input, description: "Name of the office of supervisory jurisdiction responsible for this branch" }
      - { name: osj_enabled, type: boolean, source: system, description: "false until the first supervisory enrollment completes", default: false }
      - { name: state, type: enum, source: computed, description: "SUPERVISED | UNSUPERVISED", constraints: "enum: SUPERVISED, UNSUPERVISED; only supervisor enrollments (not advisor links) move this field" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE (lifecycle status, moved in lockstep with state)", constraints: "enum: DRAFT, ACTIVE" }
      - { name: supervising_advisor_count, type: integer, source: computed, description: "Count of AdvisorBranchLink rows on this branch whose is_supervisor=true" }
      - { name: current_payout_period_id, type: string, source: system, description: "PayoutPeriod currently tagged to this branch, null before the first period is opened for it" }

  - name: Advisor
    parent: null
    common_fields: true
    fields:
      - { name: advisor_code, type: string, source: input, description: "Human key for the advisor (business key used in all branch operations)", constraints: "unique; immutable" }
      - { name: crd_number, type: string, source: input, description: "Central Registration Depository number", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Advisor legal name" }
      - { name: affiliation_model, type: enum, source: input, description: "IC | EMPLOYEE | HYBRID | INSTITUTIONAL — affiliation channel (business key, chosen per advisor per client contract)", constraints: "enum: IC, EMPLOYEE, HYBRID, INSTITUTIONAL" }
      - { name: primary_branch_code, type: string, source: input, description: "FK -> Branch.branch_code; the advisor's home branch (advisors must never be addressed by a server-minted branch id)" }
      - { name: ingested_book_total_cents, type: number, source: input, description: "Gross value of the production book the advisor brings in, in cents", default: 0 }
      - { name: book_transferred_cents, type: number, source: input, description: "Gross value actually transferred at enrollment, in cents", default: 0 }
      - { name: book_portability_pct, type: computed, description: "Trailing-12-month portability ratio in basis points; equals book_transferred_cents * 10000 // ingested_book_total_cents (floor), 0 when ingested_book_total_cents == 0" }
      - { name: protocol_eligible, type: boolean, source: input, description: "Whether the advisor's prior firm is a protocol signatory", default: false }
      - { name: t12_production_cents, type: computed, description: "Sum of gross_commission_cents over this advisor's RevenueEntry rows with production_date in [clock - 365 days, clock], status IN {RELEASED, TRUE_UP_APPLIED}" }
      - { name: ytd_payout_earned_cents, type: computed, description: "Sum of advisor_payout_cents over this advisor's released payout lines for PayoutPeriods in calendar year of the current period, status IN {RELEASED, TRUE_UP_APPLIED}" }
      - { name: ytd_payout_paid_cents, type: computed, description: "Sum of all non-voided amount_cents drawn against this advisor's released payout lines (ADVANCE + AMORTIZATION + ADJUSTMENT)" }
      - { name: outstanding_loan_balance_cents, type: computed, description: "Sum of remaining_balance_cents over this advisor's PayoutLoan rows with status ACTIVE" }
      - { name: eo_coverage_level, type: enum, source: input, description: "STANDARD | PREMIUM | LIMITED — errors-and-omissions coverage tier", default: STANDARD, constraints: "enum: STANDARD, PREMIUM, LIMITED" }
      - { name: eo_charge_locked_cents, type: number, source: computed, description: "Errors-and-omissions charge already settled for the current calendar year, in cents" }
      - { name: pass_through_locked_cents, type: number, source: computed, description: "Technology and service pass-through already settled for the current calendar year, in cents" }
      - { name: annual_payout_cap_hit, type: boolean, source: computed, description: "true once this advisor's cumulative released payout has reached the annual gross payout cap", default: false }
      - { name: retention_status, type: enum, source: computed, description: "NOT_AT_RISK | CONTESTED | RETAINED | DEPARTED_CONFIRMED" }
      - { name: status, type: enum, source: system, description: "PROSPECT | ONBOARDING | ACTIVE | SUSPENDED | DEPARTING | DEPARTED", constraints: "enum: PROSPECT, ONBOARDING, ACTIVE, SUSPENDED, DEPARTING, DEPARTED" }

  - name: BranchSupervisorEnrollment
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_code, type: string, source: input, description: "FK -> Branch.branch_code; branch whose transmittal account is being used" }
      - { name: advisor_code, type: string, source: input, description: "FK -> Advisor.advisor_code; advisor being enrolled as supervisor — OSJ identity is always the acting advisor" }
      - { name: effective_date, type: string, source: input, description: "ISO date the enrollment takes effect" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ENROLLED | REVOKED", constraints: "enum: REQUESTED, ENROLLED, REVOKED" }

  - name: AdvisorBranchLink
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_code, type: string, source: input, description: "FK -> Advisor.advisor_code; advisor being assigned" }
      - { name: branch_code, type: string, source: input, description: "FK -> Branch.branch_code; branch the advisor is assigned to" }
      - { name: is_supervisor, type: boolean, source: input, description: "Whether this link carries supervisory responsibility for the branch", default: false }
      - { name: assignment_type, type: enum, source: input, description: "PRIMARY | SECONDARY", constraints: "enum: PRIMARY, SECONDARY" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | INACTIVE", constraints: "enum: ASSIGNED, INACTIVE" }

  - name: Account
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_code, type: string, source: input, description: "FK -> Advisor.advisor_code; servicing advisor of the account" }
      - { name: account_number, type: string, source: input, description: "Client account number", constraints: "unique" }
      - { name: account_type, type: enum, source: input, description: "ADVISORY | BROKERAGE", constraints: "enum: ADVISORY, BROKERAGE" }
      - { name: balance_cents, type: number, source: input, description: "Account balance in cents", default: 0 }
      - { name: annual_fee_cents, type: number, source: input, description: "For ADVISORY accounts: the annual advisory fee billed on this account, in cents; 0 for BROKERAGE", default: 0 }
      - { name: base_annual_fee_cents, type: number, source: computed, description: "Annual advisory fee the account started the calendar year with, in cents; stamped when the account is first levelized and never changed afterwards" }
      - { name: rafee_effective_bps, type: number, source: computed, description: "Effective basis points of the advisory fee at the last levelization sweep; null until the first levelization" }
      - { name: held_away, type: boolean, source: input, description: "Whether the account is held away from the broker-dealer and therefore not counted in revenue splits", default: false }
      - { name: fee_levelized, type: boolean, source: computed, description: "Whether this advisory account's fee has already been levelized for the current calendar year", default: false }
      - { name: pending_transfer_at, type: datetime, source: system, description: "Logical-clock instant at which the account entered PENDING_TRANSFER; null in every other state. The 24-hour supervisory window is measured from this instant." }
      - { name: status, type: enum, source: system, description: "OPEN | FROZEN | PENDING_TRANSFER | TRANSFERRED_OUT | RETENTION_CONTESTED | RETAINED", constraints: "enum: OPEN, FROZEN, PENDING_TRANSFER, TRANSFERRED_OUT, RETENTION_CONTESTED, RETAINED" }

  - name: RevenueEntry
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_code, type: string, source: input, description: "FK -> Advisor.advisor_code; producing advisor" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account that generated the revenue" }
      - { name: product_type, type: enum, source: input, description: "EQUITY | MUTUAL_FUND | ANNUITY | BROKERAGE_TRAIL | ADVISORY", constraints: "enum: EQUITY, MUTUAL_FUND, ANNUITY, BROKERAGE_TRAIL, ADVISORY" }
      - { name: gross_commission_cents, type: number, source: input, description: "Gross commission or fee in cents, strictly positive", constraints: "> 0" }
      - { name: production_date, type: string, source: input, description: "ISO date used for tier accumulation and true-up (back-dated entries ARE counted in their own period, not in creation order)" }
      - { name: status, type: enum, source: system, description: "DRAFT | RELEASED | TRUE_UP_APPLIED", constraints: "enum: DRAFT, RELEASED, TRUE_UP_APPLIED" }

  - name: PayoutPeriod
    parent: Branch
    common_fields: true
    fields:
      - { name: branch_code, type: string, source: input, description: "FK -> Branch.branch_code; branch the period belongs to" }
      - { name: year, type: integer, source: input, description: "Calendar year of the period; five periods per calendar month" }
      - { name: month, type: integer, source: input, description: "Calendar month of the period, 1-12" }
      - { name: period_index, type: integer, source: input, description: "Period within the day-of-month cycle, 1-5", constraints: "1 <= period_index <= 5" }
      - { name: state, type: enum, source: computed, description: "OPEN | CLOSED | PAID | REOPENED | VOID" }
      - { name: status, type: enum, source: system, description: "Mirror of state used for the payout-period lifecycle endpoint; enum: OPEN, CLOSED, PAID, REOPENED, VOID" }
      - { name: period_gross_cents, type: number, source: computed, description: "Sum of gross_commission_cents over RELEASED RevenueEntry rows whose production_date falls in the period's calendar month" }
      - { name: period_payout_cents, type: number, source: computed, description: "Sum of release_amount_cents over the period's payout lines with status RELEASED" }
      - { name: true_up_amount_cents, type: number, source: computed, description: "Sum of true_up_amount_cents over the period's payout lines with status TRUE_UP_APPLIED; negative when the final grid base rate is lower than the provisional rate" }

  - name: AdvisorPayoutLine
    parent: PayoutPeriod
    common_fields: true
    fields:
      - { name: payout_period_id, type: string, source: input, description: "FK -> PayoutPeriod.id; period the line settles in" }
      - { name: advisor_code, type: string, source: input, description: "FK -> Advisor.advisor_code; advisor being paid" }
      - { name: period_gross_cents, type: number, source: computed, description: "Sum of gross_commission_cents over the advisor's RELEASED RevenueEntry rows in the period's calendar month" }
      - { name: projected_annual_production_cents, type: number, source: input, description: "Tier basis used for the provisional release; immutable after the release" }
      - { name: provisional_base_rate_bps, type: integer, source: computed, description: "Release-time base rate from the tier grid, in basis points" }
      - { name: release_amount_cents, type: number, source: computed, description: "Sum over the period's entries of round_half_up(gross_commission_cents * provisional_rate_bps / 10000) at the line's final applied rate" }
      - { name: true_up_amount_cents, type: number, source: computed, description: "Final income minus provisional income for the period after the grid is recomputed on cumulative year production" }
      - { name: net_settlement_cents, type: number, source: computed, description: "gross payout basis minus expense pass-through minus errors-and-omissions charges" }
      - { name: status, type: enum, source: system, description: "DRAFT | RELEASED | TRUE_UP_APPLIED | VOID", constraints: "enum: DRAFT, RELEASED, TRUE_UP_APPLIED, VOID" }

  - name: PayoutLoan
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_code, type: string, source: input, description: "FK -> Advisor.advisor_code; advisor receiving the transition assistance" }
      - { name: principal_cents, type: number, source: input, description: "Loan principal in cents", constraints: "> 0; at most 50000000 (LPL_PARITY_PRINCIPAL_CAP_CENTS)" }
      - { name: amortization_rate_bps, type: integer, source: input, description: "Percentage of each release draw repaid against the loan, in basis points", constraints: "> 0" }
      - { name: forgiveness_milestone_pct, type: integer, source: input, description: "Percentage of the principal forgiven once the milestone is met", constraints: "0 <= milestone <= 100" }
      - { name: remaining_balance_cents, type: computed, description: "principal_cents minus cumulative amortization_applied_cents minus forgiven_cents, floored at 0" }
      - { name: milestone_progress_cents, type: computed, description: "Sum of gross_commission_cents over this advisor's RevenueEntry rows with production_date within [first RELEASED entry for this loan - 12 months, clock], status IN {RELEASED, TRUE_UP_APPLIED}, capped at the milestone threshold" }
      - { name: status, type: enum, source: system, description: "REQUESTED | ACTIVE | AMORTIZING | REPAID | FORGIVEN | DISCHARGED", constraints: "enum: REQUESTED, ACTIVE, AMORTIZING, REPAID, FORGIVEN, DISCHARGED" }

  - name: LoanAmortizationEntry
    parent: PayoutLoan
    common_fields: true
    fields:
      - { name: payout_loan_id, type: string, source: input, description: "FK -> PayoutLoan.id; loan being reduced" }
      - { name: payout_period_id, type: string, source: input, description: "FK -> PayoutPeriod.id; period the draw came from" }
      - { name: amortization_amount_cents, type: number, source: computed, description: "SIGNED loan reduction. Positive on a release draw: round_half_up(release_amount_cents * amortization_rate_bps / 10000), clipped so the loan never over-pays. Negative when a period true-up is negative: the whole negative true-up is added back to the loan balance. Zero on a forgiveness row." }
      - { name: forgiveness_amount_cents, type: number, source: computed, description: "principal_cents * forgiveness_milestone_pct // 100 booked on the forgiveness milestone" }
      - { name: status, type: enum, source: system, description: "POSTED | VOID", constraints: "enum: POSTED, VOID; rows are written POSTED and are only ever voided by a period reopen" }

  - name: ExpensePassThrough
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_code, type: string, source: input, description: "FK -> Advisor.advisor_code; advisor the charge is billed to" }
      - { name: payout_period_id, type: string, source: input, description: "FK -> PayoutPeriod.id; period the pass-through is drawn from" }
      - { name: category, type: enum, source: input, description: "TECHNOLOGY | CLEARING | E_AND_O | REGULATORY", constraints: "enum: TECHNOLOGY, CLEARING, E_AND_O, REGULATORY" }
      - { name: billing_model, type: enum, source: input, description: "Per-advisor basis: FLAT_MONTHLY or PCT_OF_GROSS", constraints: "enum: FLAT_MONTHLY, PCT_OF_GROSS" }
      - { name: amount_cents, type: number, source: computed, description: "Charge amount in cents for the period; never exceeds the advisor's gross payout basis for the period" }
      - { name: status, type: enum, source: system, description: "PENDING | POSTED | WAIVED", constraints: "enum: PENDING, POSTED, WAIVED" }

  - name: AdvisoryRevenueSplit
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; advisory account being split" }
      - { name: payout_period_id, type: string, source: input, description: "FK -> PayoutPeriod.id; period the split is recorded in" }
      - { name: advisory_fee_cents, type: number, source: computed, description: "Annual advisory fee share allocated to the period for the account" }
      - { name: brokerage_revenue_cents, type: number, source: computed, description: "Brokerage-side revenue for the same account in the same period, from BROKERAGE_TRAIL entries" }
      - { name: advisory_revenue_cents, type: computed, description: "Levelized advisory revenue actually credited to the advisor: the amount is portability-banded and clipped by the fee cap, and the levelization delta is added back" }
      - { name: levelization_delta_cents, type: computed, description: "round_half_up(balance_cents * (TARGET_BPS - rafee_effective_bps) // 10000) applied once per account per calendar year; signed" }
      - { name: status, type: enum, source: system, description: "PENDING | POSTED | VOID", constraints: "enum: PENDING, POSTED, VOID" }

  - name: TransitionRecord
    parent: Advisor
    common_fields: true
    fields:
      - { name: advisor_code, type: string, source: input, description: "FK -> Advisor.advisor_code; advisor whose book is being contested" }
      - { name: payout_period_id, type: string, source: input, description: "FK -> PayoutPeriod.id; period the departure is booked in" }
      - { name: retention_credit_cents, type: number, source: computed, description: "Contest credit granted to the advisor: retention_rate_bps applied to the book, clipped by the credit cap" }
      - { name: accounts_in_contest_count, type: integer, source: computed, description: "Count of accounts on CONTRACT_DATA in the canned retention package for this transition" }
      - { name: accounts_retained_count, type: integer, source: computed, description: "Count of accounts held at settle; while the contest is open it counts the advisor's accounts with status RETENTION_CONTESTED, and the settle call sets it to the number of account ids submitted as retained" }
      - { name: settled_amount_cents, type: number, source: computed, description: "Sum over the transition's AccountRetention rows of credit_amount_cents, counting POSTED, RETAINED and LOST rows; VOID rows are excluded" }
      - { name: retention_ratio_bps, type: computed, description: "accounts_retained_count * 10000 // accounts_in_contest_count, floor, and 0 when accounts_in_contest_count == 0" }
      - { name: status, type: enum, source: system, description: "PENDING | CONTESTED | SETTLED", constraints: "enum: PENDING, CONTESTED, SETTLED" }

  - name: AccountRetention
    parent: TransitionRecord
    common_fields: true
    fields:
      - { name: transition_record_id, type: string, source: input, description: "FK -> TransitionRecord.id; transition the account is contested under" }
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; account being contested" }
      - { name: retention_rate_bps, type: integer, source: input, description: "Retention credit rate for this account, in basis points", constraints: "> 0" }
      - { name: credit_amount_cents, type: number, source: computed, description: "round_half_up(account.balance_cents * retention_rate_bps / 10000), clipped by the book retention credit cap" }
      - { name: status, type: enum, source: system, description: "PENDING | POSTED | RETAINED | LOST | VOID", constraints: "enum: PENDING, POSTED, RETAINED, LOST, VOID; only POSTED rows count toward the retention ratio" }# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Advisor
    initial_state: PROSPECT
    terminal_states: [DEPARTED]
    transitions:
      - from: PROSPECT
        to: ONBOARDING
        trigger: "POST /advisors/{id}/enrollment"
        actor: AdvisorOps
        preconditions:
          - "advisor.crd_number is non-empty"
          - "Branch with branch_code == advisor.primary_branch_code exists (ERR_ADVISOR_NOT_FOUND otherwise)"
          - "A PayoutLoan row for this advisor exists with status IN {REQUESTED, ACTIVE} (ERR_NO_TRANSITION_LOAN otherwise)"
        side_effects:
          - "advisor.status = ONBOARDING"
          - "accounts_under_advisor = count(Account where advisor_code == advisor.advisor_code) — read-only derivation, no writes"
        note: "Enrollment is the only door into the payout grid; the loan precondition mirrors the real transition-assistance contract."

      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /advisors/{id}/affiliation"
        actor: AdvisorOps
        preconditions:
          - "advisor.book_portability_pct >= 5000 (ERR_BOOK_PORTABILITY_BELOW_MINIMUM otherwise)"
          - "advisor.protocol_eligible == true OR advisor.book_portability_pct >= 7000 (ERR_PORTABILITY_PROTOCOL_FAILURE otherwise)"
          - "Branch with branch_code == advisor.primary_branch_code has status ACTIVE (ERR_BRANCH_NOT_ACTIVE otherwise)"
          - "advisor.eo_coverage_level != LIMITED (ERR_EO_COVERAGE_INSUFFICIENT otherwise)"
        side_effects:
          - "advisor.status = ACTIVE"
          - "advisor.retention_status = NOT_AT_RISK"
          - "every PayoutLoan for this advisor with status REQUESTED -> ACTIVE"
        note: "PROSPECT -> ACTIVE direct is rejected with ERR_INVALID_STATE; activation itself cascades the loan into ACTIVE."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /advisors/{id}/state"
        actor: ComplianceOfficer
        preconditions:
          - "the advisor's primary branch has state SUPERVISED, i.e. at least one supervisory enrollment is ENROLLED (ERR_INVALID_STATE otherwise)"
          - "no RevenueEntry of the advisor is still DRAFT (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "advisor.status = SUSPENDED"
          - "all OPEN accounts for the advisor -> FROZEN"
        note: "Suspension is supervisory, not voluntary; an unsupervised branch has no authority to suspend, which is a cross-entity state dependency on Branch.state."

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /advisors/{id}/state"
        actor: ComplianceOfficer
        preconditions:
          - "the advisor's primary branch has state SUPERVISED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "advisor.status = ACTIVE"
          - "all FROZEN accounts for the advisor -> OPEN"
        note: "Reinstatement releases the freeze side effect of the suspension, so SUSPENDED -> ACTIVE -> SUSPENDED is a reachable cycle."

      - from: ACTIVE
        to: DEPARTING
        trigger: "POST /advisors/{id}/departure"
        actor: AdvisorOps
        preconditions:
          - "advisor.outstanding_loan_balance_cents == 0 (ERR_LOAN_BALANCE_OUTSTANDING otherwise)"
          - "no PayoutPeriod tagged to advisor.primary_branch_code has state IN {OPEN, REOPENED} (ERR_PERIOD_NOT_CLOSED otherwise)"
        side_effects:
          - "advisor.status = DEPARTING"
          - "every Account for the advisor with status OPEN -> FROZEN"
          - "every RevenueEntry for the advisor with status DRAFT -> RELEASED (frozen books still earn, but only for accounts not in a retention contest)"
          - "advisor.retention_status -> CONTESTED when a TransitionRecord is opened, otherwise stays NOT_AT_RISK"

      - from: DEPARTING
        to: ACTIVE
        trigger: "POST /advisors/{id}/departure/reinstate"
        actor: AdvisorOps
        preconditions:
          - "no TransitionRecord for the advisor has status SETTLED (ERR_TRANSITION_ALREADY_SETTLED otherwise)"
        side_effects:
          - "advisor.status = ACTIVE"
          - "every Account for the advisor with status FROZEN -> OPEN"
          - "every Account for the advisor with status RETENTION_CONTESTED -> OPEN"
          - "advisor.retention_status = RETAINED"
        note: "This is the cycle edge: DEPARTING -> ACTIVE -> DEPARTING is reachable, and the reinstatement reverses the freeze cascade of the departure."

      - from: DEPARTING
        to: DEPARTED
        trigger: "POST /advisors/{id}/departure/settle"
        actor: ComplianceOfficer
        preconditions:
          - "the advisor's TransitionRecord has status SETTLED (ERR_TRANSITION_NOT_SETTLED otherwise)"
          - "every AccountRetention row for that TransitionRecord has status IN {POSTED, RETAINED, LOST} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "advisor.status = DEPARTED"
          - "every AccountRetention row for the transition with status POSTED -> RETAINED"
          - "every PayoutLoan for the advisor with status IN {ACTIVE, AMORTIZING} -> DISCHARGED"
          - "advisor.outstanding_loan_balance_cents -> 0 via DISCHARGED loans"
          - "advisor.retention_status = DEPARTED_CONFIRMED"
          - "every RevenueEntry for the advisor with status RELEASED -> TRUE_UP_APPLIED"

  - entity: Account
    initial_state: OPEN
    terminal_states: [TRANSFERRED_OUT]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /advisors/{id}/state (advisor suspension) or POST /advisors/{id}/departure"
        actor: system
        preconditions: []
        side_effects:
          - "no new RevenueEntry may be created against this account until it returns to OPEN"

      - from: FROZEN
        to: OPEN
        trigger: "POST /advisors/{id}/departure/reinstate"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: PENDING_TRANSFER
        trigger: "POST /advisors/{id}/book-transfer"
        actor: AdvisorOps
        preconditions:
          - "advisor.status == DEPARTING or advisor.status == DEPARTED (ERR_INVALID_STATE otherwise)"
          - "advisor.book_portability_pct >= 6000 (ERR_BOOK_PORTABILITY_BELOW_MINIMUM otherwise)"
        side_effects:
          - "account.status = PENDING_TRANSFER"

      - from: PENDING_TRANSFER
        to: TRANSFERRED_OUT
        trigger: "POST /accounts/{id}/transfer/confirm"
        actor: system
        preconditions:
          - "the current logical clock is at or after account.pending_transfer_at + 24 hours (ERR_TRANSFER_HOLD_PERIOD otherwise; exactly 24 hours passes)"
        side_effects:
          - "account.status = TRANSFERRED_OUT"
          - "account.fee_levelized = true (a transferred account is closed out of the levelization sweep)"
          - "the owning advisor's RevenueEntry rows with status DRAFT -> VOID"

      - from: PENDING_TRANSFER
        to: RETENTION_CONTESTED
        trigger: "POST /transitions/{id}/retention/contest"
        actor: BranchManager
        preconditions:
          - "a TransitionRecord for the account's advisor exists with status CONTESTED (ERR_TRANSITION_NOT_CONTESTED otherwise)"
        side_effects:
          - "account.status = RETENTION_CONTESTED"
          - "a new AccountRetention row is created with status POSTED and credit_amount_cents = round_half_up(account.balance_cents * retention_rate_bps / 10000)"

      - from: RETENTION_CONTESTED
        to: RETAINED
        trigger: "POST /transitions/{id}/retention/settle (account_id is in the submitted account_ids_retained)"
        actor: BranchManager
        preconditions:
          - "len(account_ids_retained) * 10000 // accounts_in_contest_count >= RETENTION_TARGET_BPS (ERR_RETENTION_TARGET_MISSED otherwise)"
          - "every submitted account_id carries an AccountRetention row on this transition with status POSTED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "account.status = RETAINED"
          - "the account's AccountRetention row -> RETAINED"
          - "every Account of the advisor with status FROZEN -> OPEN"
          - "the advisor's TransitionRecord -> SETTLED"
          - "advisor.retention_status = RETAINED"

      - from: RETENTION_CONTESTED
        to: PENDING_TRANSFER
        trigger: "POST /transitions/{id}/retention/lose (account_id is in the submitted account_ids_lost) or POST /transitions/{id}/retention/settle for an account_id not listed as retained"
        actor: BranchManager
        preconditions:
          - "len(account_ids_lost) * 10000 // accounts_in_contest_count > 10000 - RETENTION_TARGET_BPS (ERR_RETENTION_TARGET_MET otherwise)"
        side_effects:
          - "account.status = PENDING_TRANSFER"
          - "account.pending_transfer_at is stamped with the current logical clock"
          - "the account's AccountRetention row -> LOST"
          - "the advisor's TransitionRecord -> SETTLED"
          - "advisor.retention_status = DEPARTED_CONFIRMED"

  - entity: PayoutPeriod
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /payout-periods/{id}/state"
        actor: BranchManager
        preconditions:
          - "at least one RevenueEntry with production_date in the period's calendar month for an advisor on the period's branch has status RELEASED (ERR_PERIOD_HAS_NO_RELEASED_PRODUCTION otherwise)"
          - "no RevenueEntry with production_date in the period's calendar month for an advisor on the period's branch is still DRAFT (ERR_PERIOD_HAS_DRAFT_ENTRIES otherwise)"
        side_effects:
          - "period.state = CLOSED"

      - from: CLOSED
        to: PAID
        trigger: "POST /payout-periods/{id}/state"
        actor: BranchManager
        preconditions:
          - "every RevenueEntry in the period's calendar month for advisors on the period's branch has status IN {RELEASED, TRUE_UP_APPLIED} (ERR_PERIOD_HAS_DRAFT_ENTRIES otherwise)"
          - "the line's provisional_base_rate_bps == the tier base rate for the projected basis (ERR_PERIOD_PROVISIONAL_BASIS_MISMATCH otherwise)"
        side_effects:
          - "period.state = PAID"
          - "for every AdvisorPayoutLine of the period with status DRAFT -> RELEASED and release_amount_cents is computed at the provisional rate; no true-up is applied by this transition"
          - "an advisor whose payout line is released keeps its loan on ACTIVE until a subsequent true-up or forgiveness milestone moves it"
          - "every ExpensePassThrough row for the period with status PENDING -> POSTED and amount_cents is pinned"
          - "every PayoutLoan of a paid line's advisor with status ACTIVE -> AMORTIZING; a LoanAmortizationEntry is POSTED and remaining_balance_cents is reduced"
          - "every AdvisoryRevenueSplit row for the period with status PENDING -> POSTED and advisory_revenue_cents is pinned"
          - "advisor.annual_payout_cap_hit may flip to true when the advisor's cumulative released payout reaches the annual cap"

      - from: PAID
        to: REOPENED
        trigger: "POST /payout-periods/{id}/state"
        actor: ComplianceOfficer
        preconditions:
          - "period.state == PAID"
        side_effects:
          - "the period's postings are reversed: every line of the period with status TRUE_UP_APPLIED -> RELEASED and its true_up_amount_cents -> 0"
          - "every PayoutLoan amortization posted by this period is reversed: the LoanAmortizationEntry -> VOID and remaining_balance_cents is restored"
          - "every ExpensePassThrough row posted by this period with status POSTED -> PENDING"
          - "every AdvisoryRevenueSplit row posted by this period with status POSTED -> VOID"

      - from: REOPENED
        to: PAID
        trigger: "POST /payout-periods/{id}/state"
        actor: ComplianceOfficer
        preconditions:
          - "every RevenueEntry in the period's calendar month for advisors on the period's branch has status IN {RELEASED, TRUE_UP_APPLIED} (ERR_PERIOD_HAS_DRAFT_ENTRIES otherwise)"
        side_effects:
          - "the period is re-posted exactly as the CLOSED -> PAID transition posts it"
        note: "Cycle edge: OPEN -> CLOSED -> PAID -> REOPENED -> PAID. Re-opening reverses true-ups, loan amortization and pass-throughs, then re-posting reapplies them."

      - from: CLOSED
        to: VOID
        trigger: "POST /payout-periods/{id}/state"
        actor: ComplianceOfficer
        preconditions:
          - "no AdvisorPayoutLine of the period has status IN {RELEASED, TRUE_UP_APPLIED} (ERR_PERIOD_ALREADY_POSTED otherwise)"
        side_effects:
          - "period.state = VOID"
          - "every AdvisorPayoutLine of the period with status DRAFT -> VOID"

  - entity: AdvisorPayoutLine
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /payout-periods/{id}/state to PAID (system transition)"
        actor: system
        preconditions:
          - "the line's advisor.status IN {ACTIVE, ONBOARDING, DEPARTING}"
        side_effects:
          - "line.release_amount_cents is computed as the sum over the period's entries of round_half_up(gross_commission_cents * applied_rate_bps / 10000)"
          - "advisor.ytd_payout_earned_cents is recomputed"
          - "period.period_payout_cents is recomputed"

      - from: RELEASED
        to: TRUE_UP_APPLIED
        trigger: "POST /payout-periods/{id}/true-up"
        actor: BranchManager
        preconditions:
          - "the line's period state IN {CLOSED, PAID, REOPENED} (ERR_PERIOD_NOT_CLOSED otherwise)"
          - "the line has already been released, i.e. its status is RELEASED (ERR_INVALID_STATE otherwise)"
          - "line.provisional_base_rate_bps == the tier base rate for line.projected_annual_production_cents (ERR_PERIOD_PROVISIONAL_BASIS_MISMATCH otherwise)"
        side_effects:
          - "line.true_up_amount_cents is computed as final_income - provisional_income on the advisor's cumulative year production for the period month"
          - "line.release_amount_cents is recomputed at the final applied rate"
          - "period.true_up_amount_cents and period.period_payout_cents are recomputed"
          - "advisor.ytd_payout_earned_cents is recomputed"
          - "when true_up_amount_cents < 0 the shortfall is added to the advisor's outstanding_loan_balance_cents by posting a LoanAmortizationEntry with status POSTED"

      - from: TRUE_UP_APPLIED
        to: RELEASED
        trigger: "POST /payout-periods/{id}/state to REOPENED (compensation of the true-up)"
        actor: ComplianceOfficer
        preconditions:
          - "the period is being reopened"
        side_effects:
          - "line.true_up_amount_cents -> 0"
          - "line.release_amount_cents is restored to its provisional value"
          - "the compensating LoanAmortizationEntry posted by the true-up -> VOID and the loan balance is restored"

  - entity: Branch
    initial_state: UNSUPERVISED
    terminal_states: []
    transitions:
      - from: UNSUPERVISED
        to: SUPERVISED
        trigger: "POST /branch-supervisor-enrollments/{id}/state to ENROLLED"
        actor: PlatformAdmin
        preconditions:
          - "the enrollment is in REQUESTED"
          - "no other enrollment on this branch is already ENROLLED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "branch.state = SUPERVISED and branch.osj_enabled = true"
          - "branch.status = ACTIVE"
          - "branch.supervising_advisor_count is recomputed"
        note: "The office of supervisory jurisdiction is what makes the branch supervised; the escalation is driven only by supervisor enrollments, never by ordinary advisor links."

      - from: SUPERVISED
        to: UNSUPERVISED
        trigger: "POST /branch-supervisor-enrollments/{id}/state to REVOKED, or POST /advisor-links/{id}/state deactivating the last supervisor link"
        actor: PlatformAdmin
        preconditions:
          - "no ENROLLED supervisor enrollment remains and no ASSIGNED supervisor link remains (ERR_INVALID_STATE otherwise)"
          - "no payout period tagged to this branch has state IN {OPEN, REOPENED} (ERR_PERIOD_NOT_CLOSED otherwise)"
        side_effects:
          - "branch.state = UNSUPERVISED and branch.osj_enabled = false"
          - "branch.status = DRAFT"
          - "branch.supervising_advisor_count is recomputed to 0"
        note: "Cycle edge: UNSUPERVISED -> SUPERVISED -> UNSUPERVISED is reachable, and the demotion re-blocks every operation that needs a supervised branch."

  - entity: RevenueEntry
    initial_state: DRAFT
    terminal_states: [VOID]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: "POST /revenue-entries/{id}/release, or POST /advisors/{id}/departure which releases the whole draft book"
        actor: AdvisorOps
        preconditions:
          - "the owning account status is OPEN or FROZEN (ERR_INVALID_STATE otherwise; a TRANSFERRED_OUT account can no longer earn)"
        side_effects:
          - "entry.status = RELEASED"
          - "the advisor's trailing-12-month production and the period's gross are recomputed"

      - from: RELEASED
        to: TRUE_UP_APPLIED
        trigger: "POST /payout-periods/{id}/true-up, or POST /advisors/{id}/departure/settle"
        actor: BranchManager
        preconditions:
          - "the entry belongs to the period being true-upped"
        side_effects:
          - "entry.status = TRUE_UP_APPLIED"

      - from: RELEASED
        to: VOID
        trigger: "POST /accounts/{id}/transfer/confirm (system transition)"
        actor: system
        preconditions:
          - "the owning account reached TRANSFERRED_OUT"
        side_effects:
          - "entry.status = VOID"

      - from: DRAFT
        to: VOID
        trigger: "POST /accounts/{id}/transfer/confirm (system transition)"
        actor: system
        preconditions:
          - "the owning account reached TRANSFERRED_OUT"
        side_effects:
          - "entry.status = VOID"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: period-close-stale-branch
    parent_entity: Branch
    write_endpoint: "POST /payout-periods/{id}/state"
    occ_field: "expected_branch_version"
    description: |
      Closing or posting a PayoutPeriod against a Branch whose version has advanced
      since the client last observed it is rejected, because any advisor link, account
      move, or supervisory enrollment on the branch legitimately bumps the branch
      version and the client's view of the branch is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payout-line-settlement-stale-advisor
    parent_entity: Advisor
    write_endpoint: "POST /advisor-payout-lines/{id}/settlement"
    occ_field: "expected_advisor_version"
    description: |
      Settling an advisor payout line against an Advisor whose version has advanced
      since the client last observed it is rejected, because a release, a loan
      amortization or a book move legitimately bumps the advisor version and the
      settlement the client is asking for is therefore computed from a stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transition-open-stale-advisor
    parent_entity: Advisor
    write_endpoint: "POST /transitions"
    occ_field: "expected_advisor_version"
    description: |
      Opening a TransitionRecord against an Advisor whose version has advanced since
      the client last observed it is rejected, because account freezes, loan balance
      changes and retention flags all bump the advisor version and a new transition
      may then legitimately supersede the state the client was describing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: payout_grid_rate
    trigger: "payout line release and true-up; any recomputation of an advisor's final applied rate"
    algorithm: tiered_pricing
    formula: |
      # Granularity decision — PINNED, not the classic marginal ladder:
      # a revenue entry is paid at the single rate of the tier its cumulative
      # year-to-date production lands in AFTER the entry is added.
      rate_for(basis_cents, product_type, affiliation_model):
          raw = GRID_TIER_BASE_BPS(basis_cents)
                + PRODUCT_RATE_DELTA_BPS(product_type)
                - AFFILIATION_MODEL_OFFSET_BPS(affiliation_model)
          return min(MAX_RATE_BPS, max(MIN_RATE_BPS, raw))

      GRID_TIER_BASE_BPS(basis_cents):
          if basis_cents < 100_000_000:            return 7000
          elif basis_cents < 250_000_000:          return 8000
          else:                                    return 9000
      # boundaries are inclusive-lower: 100_000_000 lands in the 8000 tier,
      # 250_000_000 lands in the 9000 tier, 249_999_999 stays in 8000.

      provisional_applied_rate = rate_for(projected_annual_production_cents, entry.product_type, advisor.affiliation_model)
      final_applied_rate       = rate_for(cumulative_year_production_through(entry), entry.product_type, advisor.affiliation_model)
    input_set: "RevenueEntry rows with status IN {RELEASED, TRUE_UP_APPLIED}; DRAFT and VOID entries are excluded from every basis. cumulative_year_production_through(entry) sums gross_commission_cents for the advisor in calendar year order by production_date ASC, then by created_at ASC as the tie-break, up to and including the entry itself."
    constants:
      GRID_TIER_1_BASE_BPS: 7000
      GRID_TIER_2_BASE_BPS: 8000
      GRID_TIER_3_BASE_BPS: 9000
      GRID_TIER_1_CEILING_CENTS: 100000000
      GRID_TIER_2_CEILING_CENTS: 250000000
      PRODUCT_DELTA_EQUITY_BPS: 0
      PRODUCT_DELTA_MUTUAL_FUND_BPS: -500
      PRODUCT_DELTA_ANNUITY_BPS: -700
      PRODUCT_DELTA_BROKERAGE_TRAIL_BPS: -300
      PRODUCT_DELTA_ADVISORY_BPS: 500
      MODEL_OFFSET_IC_BPS: 0
      MODEL_OFFSET_EMPLOYEE_BPS: 500
      MODEL_OFFSET_HYBRID_BPS: 250
      MODEL_OFFSET_INSTITUTIONAL_BPS: 6500
      MAX_RATE_BPS: 9000
      MIN_RATE_BPS: 500
    precision: "basis points are integers; money is rounded once per revenue entry with round_half_up to whole cents"
    variants:
      - name: provisional_grid_rate
        when: "at payout-line release (the CLOSED -> PAID posting)"
        difference: "uses projected_annual_production_cents as the tier basis and the entry's product_type delta; every entry of the period is paid at this one rate"
      - name: final_grid_rate
        when: "at true-up, recomputed on the advisor's cumulative year production"
        difference: "uses cumulative_year_production_through(entry) as the tier basis, so entries straddling a tier boundary pay at different rates and the line's true_up_amount_cents is the signed income difference"

  - name: period_release_amount
    trigger: "payout line release and true-up recomputation"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER — PINNED: round per revenue entry, then sum.
      # Summing first and rounding once is a different number and is incorrect.
      release_amount_cents = 0
      for entry in entries(advisor, period_month) ordered by production_date ASC, created_at ASC:
          rate = provisional_applied_rate if line.status == RELEASED else final_applied_rate_for(entry)
          release_amount_cents += round_half_up(entry.gross_commission_cents * rate / 10000)
    input_set: "RevenueEntry rows for the advisor with production_date in the period's calendar month, status IN {RELEASED, TRUE_UP_APPLIED}"
    constants:
      ROUNDING_MODE: round_half_up
    precision: "per-entry round_half_up to whole cents, then sum"

  - name: period_true_up_amount
    trigger: "POST /payout-periods/{id}/true-up"
    algorithm: aggregation
    formula: |
      final_income        = sum(round_half_up(e.gross_commission_cents * final_grid_rate(e) / 10000) for e in period entries)
      provisional_income  = sum(round_half_up(e.gross_commission_cents * provisional_applied_rate / 10000) for e in period entries)
      true_up_amount_cents = final_income - provisional_income     # signed; negative when the rate fell
    input_set: "RevenueEntry rows for the advisor with production_date in the period's calendar month, status IN {RELEASED, TRUE_UP_APPLIED}; cumulative basis runs over the whole calendar year, period entries included"
    constants:
      ROUNDING_MODE: round_half_up
    precision: "per-entry round_half_up, then sum; the difference is exact integer cents"
    variants:
      - name: positive_true_up
        when: "cumulative year production crosses into a higher tier, or the model offset leaves a higher rate at the new basis"
        difference: "adds income to the advisor's released payout for the period"
      - name: negative_true_up
        when: "cumulative year production falls back to a lower effective rate than the provisional rate"
        difference: "the negative true-up_amount_cents is applied against the advisor's loan balance as a LoanAmortizationEntry rather than reducing the release"

  - name: net_settlement
    trigger: "POST /payout-periods/{id}/net-settlement"
    algorithm: waterfall_allocation
    formula: |
      # Order-dependence, pinned:
      #   step 1 — payout basis
      payout_basis = period_payout_cents + period_true_up_amount_cents
      #   step 2 — expense pass-through pool, clipped by what the basis can absorb
      pass_pool_cents = 0
      for row in ExpensePassThrough(advisor, period) ordered by category ASC:
          row.amount_cents = round_half_up(payout_basis * PASS_THROUGH_RATE_BPS(row.category) / 10000) if row.billing_model == PCT_OF_GROSS else PASS_THROUGH_FLAT_CENTS(row.category)
          row.amount_cents = min(row.amount_cents, max(0, payout_basis - pass_pool_cents))
          pass_pool_cents += row.amount_cents
      pass_through_cents = pass_pool_cents
      #   step 3 — errors-and-omissions pool, computed on the pre-pass-through basis, clipped by what is left
      eo_pool_cents = 0
      for row in ExpensePassThrough(advisor, period) where category in {E_AND_O, REGULATORY} ordered by category ASC:
          row.amount_cents = round_half_up(payout_basis * EO_RATE_BPS(advisor.eo_coverage_level) / 10000)
          row.amount_cents = min(row.amount_cents, max(0, payout_basis - pass_through_cents - eo_pool_cents))
          eo_pool_cents += row.amount_cents
      eo_charge_cents = eo_pool_cents
      #   step 4 — only now is the supervisory override keyed on the net
      net_settlement_cents = payout_basis - pass_through_cents - eo_charge_cents
      if net_settlement_cents < 0:
          net_settlement_cents = 0                     # never negative
      supervisory_override_cents = round_half_up(net_settlement_cents * SUPERVISORY_OVERRIDE_BPS(affiliation_model) / 10000)
    input_set: "the advisor's ExpensePassThrough rows for the period with status IN {PENDING, POSTED}; WAIVED rows are excluded from both pools"
    constants:
      PASS_THROUGH_TECHNOLOGY_FLAT_CENTS: 3000000
      PASS_THROUGH_CLEARING_FLAT_CENTS: 500000
      PASS_THROUGH_REGULATORY_FLAT_CENTS: 600000
      PASS_THROUGH_TECHNOLOGY_PCT_BPS: 200
      PASS_THROUGH_CLEARING_PCT_BPS: 100
      PASS_THROUGH_REGULATORY_PCT_BPS: 50
      PASS_THROUGH_REGULATORY_CLIPABLE: true
      PASS_THROUGH_EO_CLIPABLE: false
      EO_RATE_STANDARD_BPS: 120
      EO_RATE_PREMIUM_BPS: 350
      EO_RATE_LIMITED_BPS: 900
      SUPERVISORY_OVERRIDE_IC_BPS: 0
      SUPERVISORY_OVERRIDE_EMPLOYEE_BPS: 0
      SUPERVISORY_OVERRIDE_HYBRID_BPS: 100
      SUPERVISORY_OVERRIDE_INSTITUTIONAL_BPS: 250
      ANNUAL_PAYOUT_CAP_CENTS: 500000000
    precision: "round_half_up to whole cents at each pool step; the supervisory override is keyed on the post-pool net, not on the payout basis. The errors-and-omissions pool is computed on the gross payout basis BEFORE the line gross / true-up split and is never clipped by it, so it does not shrink when the true-up is negative. Regulatory pass-through rows are the one clipable flat category. advisor.annual_payout_cap_hit flips to true when the advisor's cumulative released payout reaches ANNUAL_PAYOUT_CAP_CENTS; the flip is flagged only and does not truncate the release."

  - name: loan_amortization
    trigger: "advisor payout-line release; payout true-up; forgiveness milestone evaluation at POST /payout-loans/{id}/amortize"
    algorithm: waterfall_allocation
    formula: |
      on_release(line):
          amortization_amount_cents = round_half_up(line.release_amount_cents * loan.amortization_rate_bps / 10000)
          amortization_amount_cents = min(amortization_amount_cents, loan.remaining_balance_cents)   # never over-pay
          loan.remaining_balance_cents -= amortization_amount_cents
      on_true_up(line):
          # a positive true-up is PAID OUT and does not touch the loan;
          # a negative true-up is added back to the loan as a signed amortization row
          if line.true_up_amount_cents < 0:
              post LoanAmortizationEntry(amortization_amount_cents = line.true_up_amount_cents)   # negative
              loan.remaining_balance_cents -= line.true_up_amount_cents
      on_discharge():                            # POST /advisors/{id}/departure/settle
          post LoanAmortizationEntry(forgiveness_amount_cents = loan.remaining_balance_cents)
          loan.remaining_balance_cents = 0
          loan.status = DISCHARGED
      on_milestone():
          if loan.milestone_progress_cents >= round_half_up(loan.principal_cents * loan.forgiveness_milestone_pct / 100):
              forgiveness_amount_cents = min(loan.principal_cents * loan.forgiveness_milestone_pct // 100, loan.remaining_balance_cents)
              loan.remaining_balance_cents -= forgiveness_amount_cents
              loan.status = FORGIVEN
          elif loan.remaining_balance_cents == 0:
              loan.status = REPAID
    input_set: "LoanAmortizationEntry rows for the loan with status POSTED (VOID rows reverse); milestone progress counts RevenueEntry rows with status IN {RELEASED, TRUE_UP_APPLIED} whose production_date is within 12 months of the first RELEASED entry for the loan"
    constants:
      LPL_PARITY_PRINCIPAL_CAP_CENTS: 50000000
      MILESTONE_WINDOW_MONTHS: 12
      LOAN_CONSERVATION_IDENTITY: "principal_cents == remaining_balance_cents + sum(POSTED amortization_amount_cents) + sum(POSTED forgiveness_amount_cents)"
    precision: "round_half_up on each amortization draw and true-up application; the forgiveness milestone amount is floor-divided (integer division) and is not rounded"

  - name: advisory_fee_levelization
    trigger: "POST /advisory-splits/levelize"
    algorithm: weighted_scoring
    formula: |
      # Levelization is a fractional adjustment, and the rounding order is pinned:
      # round ONCE on the signed delta, then apply it to the fee.
      for each ADVISORY account of the advisor with held_away == false and fee_levelized == false:
          if account.base_annual_fee_cents is null: account.base_annual_fee_cents = account.annual_fee_cents
          # annual_fee_cents is then REWRITTEN to the levelized target fee so a
          # second sweep in the same calendar year is a no-op (fee_levelized guard).
          rafee_effective_bps = round_half_up(account.base_annual_fee_cents * 10000 / account.balance_cents) if account.balance_cents > 0 else 0
          levelization_delta_cents = round_half_up(account.balance_cents * (FEE_LEVEL_TARGET_BPS - rafee_effective_bps) / 10000)
          advisory_revenue_cents = round_half_up(account.base_annual_fee_cents * APPLIED_REBATE_BPS(band) / 10000) + levelization_delta_cents
          account.annual_fee_cents = account.base_annual_fee_cents + levelization_delta_cents
          advisory_revenue_cents = min(advisory_revenue_cents, LEVELIZATION_FEE_CAP_CENTS)   # pinned cap
          account.fee_levelized = true
      APPLIED_REBATE_BPS(band):
          band 1 → ADVISORY_REBATE_BAND_1_BPS when 0  <= advisor.book_portability_pct < 6000
          band 2 → ADVISORY_REBATE_BAND_2_BPS when 6000 <= advisor.book_portability_pct < 8000
          band 3 → ADVISORY_REBATE_BAND_3_BPS when 8000 <= advisor.book_portability_pct <= 10000
    input_set: "Account rows with account_type == ADVISORY, held_away == false; BROKERAGE accounts are excluded from levelization entirely and their fee contributes only through BROKERAGE_TRAIL revenue entries"
    constants:
      FEE_LEVEL_TARGET_BPS: 85
      ADVISORY_REBATE_BAND_1_BPS: 6000
      ADVISORY_REBATE_BAND_2_BPS: 7000
      ADVISORY_REBATE_BAND_3_BPS: 8000
      LEVELIZATION_FEE_CAP_CENTS: 30000000
    precision: "one round_half_up on the signed levelization delta; the rebate is rounded separately and the two are summed"

  - name: retention_credit
    trigger: "POST /transitions/{id}/retention/contest; POST /transitions/{id}/retention/settle"
    algorithm: watermark
    formula: |
      credit_cap_cents = round_half_up(advisor.book_transferred_cents * RETENTION_CREDIT_CAP_BPS / 10000)
      # the cap is a running watermark over POSTED rows only; LOST rows keep their
      # recorded credit and do not release cap, so a reversal never frees the slot
      for each Account on the transition in order of Account.account_number ASC:
          credit_amount_cents = round_half_up(account.balance_cents * row.retention_rate_bps / 10000)
          if running_posted_credit >= credit_cap_cents:
              reject with ERR_RETENTION_CREDIT_EXHAUSTED   # no row is posted
          credit_amount_cents = min(credit_amount_cents, credit_cap_cents - running_posted_credit)
          running_posted_credit += credit_amount_cents
      retention_ratio_bps = accounts_retained_count * 10000 // accounts_in_contest_count    # floor; 0 when the denominator is 0
      settle passes when retention_ratio_bps >= RETENTION_TARGET_BPS (7000)
    input_set: "AccountRetention rows whose status is not VOID; the cap is consumed in account_number ascending order and VOID rows do not consume cap"
    constants:
      LPL_PARITY_BOOK_CAP_CENTS: 200000000
      RETENTION_TARGET_BPS: 7000
      RETENTION_CREDIT_CAP_BPS: 200
      ROUNDING_MODE: round_half_up
    precision: "round_half_up per account; the cap remainder is clipped, never re-spread"
    variants:
      - name: balance_based_credit
        when: "the canonical reading — the retention rate is applied to the account balance"
        difference: "credit = round_half_up(account.balance_cents * rate_bps / 10000)"
      - name: revenue_based_credit
        when: "the alternate reading — the retention rate is applied to the gross revenue the account booked in the contest period"
        difference: "credit = round_half_up(sum(RevenueEntry.gross_commission_cents for the account in the period) * rate_bps / 10000), which is a different number for the same account whenever booked gross differs from balance"# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's roles and, for entity_backed roles, X-User-ID equals the id of the Advisor identified by the body's advisor_code"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 2.5
    category: business_constraint
    check: "a retention contest may only be opened for an account whose status is PENDING_TRANSFER; an account already contested, already retained, or already TRANSFERRED_OUT cannot be contested again in the same period, so the (payout_period_id, account_id) slot is occupied for the life of the contest"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /transitions/{id}/retention/contest"
  - priority: 2.55
    category: business_fiscal
    check: "the payout period the line is opened in is tagged to the advisor's primary branch, and the advisor has not already reached the annual gross payout cap"
    error_id: ERR_PAYOUT_CAP_REACHED
    http_status: 409
    applies_to: "POST /advisors/{id}/payout-lines"
  - priority: 2.6
    category: state
    check: "an advisor can only be SUSPENDED or reinstated from a supervised branch: the branch addressed by advisor.primary_branch_code must have state SUPERVISED, and patient no DRAFT revenue entry may remain"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /advisors/{id}/state"
  - priority: 2.7
    category: business_constraint
    check: "the (branch_code, year, month, period_index) tuple does not already have a payout period on file — branch_code is the composite partition key, so 2026/9 index 1 can be opened once per branch and periods 1-5 are the five periods of the month"
    error_id: ERR_PERIOD_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /payout-periods"
  - priority: 3
    category: existence
    check: "the branch_code in the path or body resolves to a Branch"
    error_id: ERR_BRANCH_NOT_FOUND
    http_status: 404
    applies_to: "POST /payout-periods, POST /branch-supervisor-enrollments, POST /advisor-links, POST /advisors, PATCH /branches/{id}, GET /branches/{id}, GET /branches/{id}/payout-periods, GET /branches/{id}/advisor-links"
  - priority: 4
    category: existence
    check: "the advisor_code in the path or body resolves to an Advisor"
    error_id: ERR_ADVISOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /advisor-links, POST /accounts, POST /revenue-entries, POST /payout-loans, POST /transitions, PATCH /advisors/{id}, GET /advisors/{id}, POST /advisors/{id}/enrollment, POST /advisors/{id}/affiliation"
  - priority: 5
    category: existence
    check: "a server-minted id in the path resolves to its resource within the scope the path implies"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all paths carrying {id} for Account, RevenueEntry, PayoutPeriod, AdvisorPayoutLine, PayoutLoan, LoanAmortizationEntry, ExpensePassThrough, AdvisoryRevenueSplit, TransitionRecord, AccountRetention, AdvisorBranchLink, BranchSupervisorEnrollment"
  - priority: 6
    category: business_constraint
    check: "expected_branch_version or expected_advisor_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /payout-periods/{id}/state, POST /payout-periods/{id}/true-up, POST /advisor-payout-lines/{id}/settlement, POST /transitions, PATCH /branches/{id}, PATCH /advisors/{id}, POST /advisors/{id}/enrollment, POST /advisors/{id}/affiliation, POST /advisors/{id}/state, POST /advisors/{id}/book-transfer, POST /advisors/{id}/departure, POST /advisors/{id}/departure/reinstate, POST /advisors/{id}/departure/settle, POST /transitions/{id}/retention/settle, POST /transitions/{id}/retention/lose"
  - priority: 7
    category: business_temporal
    check: "the logical clock has been set by POST /_clock/set_current_utc before any transition that reads 12-month or 24-hour window arithmetic"
    error_id: ERR_CLOCK_NOT_SET
    http_status: 409
    applies_to: "POST /accounts/{id}/transfer/confirm, POST /transitions, POST /payout-loans/{id}/forgive"
  - priority: 8
    category: business_temporal
    check: "no PayoutPeriod tagged to the advisor's branch is in state OPEN or REOPENED, and the payout period being closed or posted is tagged to the branch addressed in the path"
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 409
    applies_to: "POST /advisors/{id}/departure, POST /payout-periods/{id}/true-up"
  - priority: 9
    category: business_safety
    check: "the advisor's errors-and-omissions coverage is not LIMITED and every advisory account being transferred sits under a branch whose supervisory enrollments have made the office of supervisory jurisdiction active"
    error_id: ERR_EO_COVERAGE_INSUFFICIENT
    http_status: 403
    applies_to: "POST /advisors/{id}/affiliation, POST /accounts/{id}/transfer/confirm, POST /advisors/{id}/departure/settle"
  - priority: 10
    category: business_constraint
    check: "the advisor's book portability ratio meets the threshold the operation requires, and the advisor is a protocol signatory when the ratio alone is insufficient"
    error_id: ERR_BOOK_PORTABILITY_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /advisors/{id}/affiliation, POST /advisors/{id}/book-transfer"
  - priority: 11
    category: business_constraint
    check: "the advisor's transition assistance loan balance is fully repaid, or the loan is discharged by the departure settlement"
    error_id: ERR_LOAN_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /advisors/{id}/departure, POST /transitions"
  - priority: 12
    category: business_fiscal
    check: "the reservation or entitlement a transition contest consumes is still open for the payout period — the period must not be PAID or VOID when a retention contest or a book transfer is attempted"
    error_id: ERR_PERIOD_ALREADY_POSTED
    http_status: 409
    applies_to: "POST /transitions/{id}/retention/contest, POST /payout-periods/{id}/state"
  - priority: 13
    category: state
    check: "the resource is in the from-state the requested transition requires"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"
  - priority: 14
    category: business_constraint
    check: "all child rows of an aggregate are in a settleable state before the aggregate is closed: no account of the advisor is FROZEN and no retention row of the transition is still PENDING"
    error_id: ERR_FROZEN_ACCOUNTS_REMAIN
    http_status: 409
    applies_to: "POST /advisors/{id}/state, POST /transitions/{id}/retention/settle, POST /advisors/{id}/departure/settle"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the clock reads the fixed startup default 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
    side_effects: ["subsequent 12-month and 24-hour window arithmetic is evaluated against the new clock"]

  - method: POST
    path: "/branches"
    description: "Create a branch; the office of supervisory jurisdiction becomes active only after the first supervisory enrollment"
    roles: [PlatformAdmin]
    code: 201
    input: [branch_code, name, transmittal_account, osj_name]
    output: Branch
    side_effects: ["status=DRAFT", "state=UNSUPERVISED", "osj_enabled=false", "supervising_advisor_count=0"]

  - method: GET
    path: "/branches"
    description: "List branches"
    roles: [PlatformAdmin, BranchManager, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Branch[]
    side_effects: []

  - method: GET
    path: "/branches/{id}"
    description: "Get a branch"
    roles: [PlatformAdmin, BranchManager, ComplianceOfficer, AdvisorOps]
    code: 200
    input: []
    output: Branch
    side_effects: []

  - method: PATCH
    path: "/branches/{id}"
    description: "Update branch descriptive fields under optimistic concurrency"
    roles: [PlatformAdmin]
    code: 200
    input: ["name?", "osj_name?", expected_branch_version]
    output: Branch
    side_effects: ["increments Branch.version by 1"]

  - method: GET
    path: "/branches/{id}/advisor-links"
    description: "List the advisor links on a branch (FK reverse-reachability for AdvisorBranchLink.branch_code)"
    roles: [PlatformAdmin, BranchManager, ComplianceOfficer, AdvisorOps]
    code: 200
    input: []
    output: AdvisorBranchLink[]
    side_effects: []

  - method: GET
    path: "/branches/{id}/payout-periods"
    description: "List the payout periods tagged to a branch (FK reverse-reachability for PayoutPeriod.branch_code)"
    roles: [PlatformAdmin, BranchManager, ComplianceOfficer, AdvisorOps]
    code: 200
    input: []
    output: PayoutPeriod[]
    side_effects: []

  - method: GET
    path: "/branches/{id}/supervisor-enrollments"
    description: "List the supervisory enrollments on a branch (FK reverse-reachability for BranchSupervisorEnrollment.branch_code)"
    roles: [PlatformAdmin, BranchManager, ComplianceOfficer]
    code: 200
    input: []
    output: BranchSupervisorEnrollment[]
    side_effects: []

  - method: POST
    path: "/branch-supervisor-enrollments"
    description: "Open a supervisory enrollment on a branch by an advisor; the acting advisor is the office of supervisory jurisdiction identity"
    roles: [PlatformAdmin, BranchManager]
    code: 201
    input: [branch_code, advisor_code, effective_date]
    output: BranchSupervisorEnrollment
    side_effects: ["status=REQUESTED"]
    note: "The enrollment is accepted in branch_code terms; advisors are never addressed by server-minted branch id."

  - method: POST
    path: "/branch-supervisor-enrollments/{id}/state"
    description: "Advance or revoke a supervisory enrollment; ENROLLED makes the branch's office of supervisory jurisdiction active"
    roles: [PlatformAdmin, BranchManager]
    code: 200
    input: [to_status, expected_branch_version]
    output: BranchSupervisorEnrollment
    side_effects:
      - "REQUESTED -> ENROLLED sets Branch.state=SUPERVISED, Branch.osj_enabled=true, and Branch.status=ACTIVE"
      - "Branch is escalated (status=ACTIVE, osj_enabled=true) when its degree of supervision crosses from 0 to 1 supervisors"
      - "REVOKED sets Branch.state=UNSUPERVISED and Branch.status=DRAFT when no other ENROLLED supervisor remains"
      - "increments Branch.version by 1"

  - method: GET
    path: "/advisor-links"
    description: "List advisor-to-branch links"
    roles: [PlatformAdmin, BranchManager, ComplianceOfficer, AdvisorOps]
    code: 200
    input: ["advisor_code?", "branch_code?", "status?", "limit?", "offset?"]
    output: AdvisorBranchLink[]
    side_effects: []

  - method: GET
    path: "/advisor-links/{id}"
    description: "Get an advisor link"
    roles: [PlatformAdmin, BranchManager, ComplianceOfficer, AdvisorOps]
    code: 200
    input: []
    output: AdvisorBranchLink
    side_effects: []

  - method: POST
    path: "/advisor-links"
    description: "Assign an advisor to a branch, optionally with supervisory responsibility"
    roles: [AdvisorOps, BranchManager, PlatformAdmin]
    code: 201
    input: [advisor_code, branch_code, is_supervisor, assignment_type]
    output: AdvisorBranchLink
    side_effects: ["status=ASSIGNED", "recomputes Branch.supervising_advisor_count", "increments Branch.version by 1"]

  - method: POST
    path: "/advisor-links/{id}/state"
    description: "Deactivate or reactivate an advisor link"
    roles: [AdvisorOps, BranchManager, PlatformAdmin]
    code: 200
    input: [to_status, expected_branch_version]
    output: AdvisorBranchLink
    side_effects: ["recomputes Branch.supervising_advisor_count", "increments Branch.version by 1"]

  - method: POST
    path: "/advisors"
    description: "Create an advisor record with its affiliation model and ingested book"
    roles: [PlatformAdmin, AdvisorOps]
    code: 201
    input: [advisor_code, crd_number, full_name, affiliation_model, primary_branch_code, ingested_book_total_cents, book_transferred_cents, protocol_eligible, "eo_coverage_level?"]
    output: Advisor
    side_effects: ["status=PROSPECT", "book_portability_pct is derived", "retention_status=NOT_AT_RISK"]

  - method: GET
    path: "/advisors"
    description: "List advisors"
    roles: [PlatformAdmin, AdvisorOps, BranchManager, ComplianceOfficer]
    code: 200
    input: ["primary_branch_code?", "status?", "affiliation_model?", "limit?", "offset?"]
    output: Advisor[]
    side_effects: []

  - method: GET
    path: "/advisors/{id}"
    description: "Get an advisor"
    roles: [PlatformAdmin, AdvisorOps, BranchManager, ComplianceOfficer]
    code: 200
    input: []
    output: Advisor
    side_effects: []

  - method: PATCH
    path: "/advisors/{id}"
    description: "Update the advisor's book transfer value, protocol status or coverage tier under optimistic concurrency"
    roles: [AdvisorOps, PlatformAdmin]
    code: 200
    input: ["book_transferred_cents?", "protocol_eligible?", "eo_coverage_level?", expected_advisor_version]
    output: Advisor
    side_effects: ["recomputes book_portability_pct", "increments Advisor.version by 1"]

  - method: POST
    path: "/advisors/{id}/enrollment"
    description: "Move an advisor from PROSPECT to ONBOARDING"
    roles: [AdvisorOps]
    code: 200
    input: [expected_advisor_version]
    output: Advisor
    side_effects: ["status=ONBOARDING", "increments Advisor.version by 1"]

  - method: POST
    path: "/advisors/{id}/affiliation"
    description: "Activate an advisor under an affiliation model"
    roles: [AdvisorOps]
    code: 200
    input: [affiliation_model, expected_advisor_version]
    output: Advisor
    side_effects:
      - "status=ACTIVE"
      - "REQUESTED loans of the advisor -> ACTIVE"
      - "increments Advisor.version by 1"

  - method: POST
    path: "/advisors/{id}/state"
    description: "Suspension and reinstatement of an advisor"
    roles: [ComplianceOfficer]
    code: 200
    input: [to_status, expected_advisor_version]
    output: Advisor
    side_effects:
      - "ACTIVE -> SUSPENDED freezes every OPEN account of the advisor"
      - "SUSPENDED -> ACTIVE requires that no account of the advisor remains FROZEN"
      - "increments Advisor.version by 1"

  - method: POST
    path: "/advisors/{id}/departure"
    description: "Begin an advisor departure: freeze the book and release the frozen production"
    roles: [AdvisorOps]
    code: 200
    input: [expected_advisor_version]
    output: Advisor
    side_effects:
      - "status=DEPARTING"
      - "every OPEN account -> FROZEN"
      - "every DRAFT revenue entry of the advisor -> RELEASED"
      - "increments Advisor.version by 1"

  - method: POST
    path: "/advisors/{id}/departure/settle"
    description: "Settle a departure into DEPARTED, retaining the contested accounts and discharging the loans"
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_advisor_version]
    output: Advisor
    side_effects:
      - "status=DEPARTED"
      - "every AccountRetention row of the transition -> RETAINED"
      - "every active or amortizing loan -> DISCHARGED with remaining_balance_cents 0 and a forgiveness_amount_cents row equal to the residual balance"
      - "retention_status=DEPARTED_CONFIRMED"
      - "every RELEASED revenue entry of the advisor -> TRUE_UP_APPLIED"
      - "increments Advisor.version by 1"

  - method: POST
    path: "/advisors/{id}/departure/reinstate"
    description: "Reverse a departure: unfreeze the book and return the advisor to ACTIVE"
    roles: [AdvisorOps]
    code: 200
    input: [expected_advisor_version]
    output: Advisor
    side_effects:
      - "status=ACTIVE"
      - "every FROZEN and RETENTION_CONTESTED account -> OPEN"
      - "retention_status=RETAINED"
      - "increments Advisor.version by 1"

  - method: POST
    path: "/advisors/{id}/payout-lines"
    description: "Open a payout line for the advisor in a payout period with a provisional tier basis"
    roles: [AdvisorOps, BranchManager]
    code: 201
    input: [payout_period_id, projected_annual_production_cents]
    output: AdvisorPayoutLine
    side_effects: ["status=DRAFT", "provisional_base_rate_bps is derived from the projected basis"]
    note: "Rejected with ERR_PAYOUT_CAP_REACHED when advisor.annual_payout_cap_hit is already true."

  - method: GET
    path: "/advisor-payout-lines"
    description: "List advisor payout lines"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["payout_period_id?", "advisor_code?", "status?", "limit?", "offset?"]
    output: AdvisorPayoutLine[]
    side_effects: []

  - method: GET
    path: "/advisor-payout-lines/{id}"
    description: "Get an advisor payout line"
    roles: [AdvisorOps, BranchManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: AdvisorPayoutLine
    side_effects: []

  - method: POST
    path: "/advisor-payout-lines/{id}/settlement"
    description: "Net the payout basis against the expense pass-through and errors-and-omissions pools"
    roles: [BranchManager, AdvisorOps]
    code: 200
    input: [expected_advisor_version]
    output: AdvisorPayoutLine
    side_effects:
      - "net_settlement_cents is computed by the waterfall"
      - "the advisor's expense pass-through rows are consumed against the basis"
      - "increments Advisor.version by 1"

  - method: POST
    path: "/advisors/{id}/crd-change"
    description: "Supervisory correction of an advisor's registration number, filed on the advisor record itself"
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: [crd_number, expected_advisor_version]
    output: Advisor
    side_effects: ["increments Advisor.version by 1"]

  - method: POST
    path: "/advisors/bulk-import"
