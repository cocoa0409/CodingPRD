          assert:
            - "the rule created in setup had status == \"SCHEDULED\", blackout_hours == 4.0 and monthly_blackout_hours == 4.0"
            - "the WAIVE call returns 200 with data.status == \"WAIVED\" and data.enforced_at == null"
            - "the ENFORCE call returns 422 with data.error_id == \"ERR_INVALID_BLACKOUT_STATE\""
            - "GET /carriage/blackout-rules/${bl_id} returns status == \"WAIVED\" and enforced_at == null"
            - "a second WAIVE also returns 422 with data.error_id == \"ERR_INVALID_BLACKOUT_STATE\""

      - name: renewal_offer_requires_an_existing_analysis_row
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CarriageAgreement.RENEWAL_ANALYSIS_to_RENEWAL_OFFERED
          - errors[ERR_RENEWAL_REQUIRES_ANALYSIS]
          - errors[ERR_RENEWAL_WINDOW_NOT_OPEN]
          - endpoints[POST /carriage/renewal-analyses]
        distinguishing_aspect: >-
          SM2's OFFER edge exists but carries a cross-entity precondition: with
          renewal_status already RENEWAL_ANALYSIS and zero RenewalAnalysis rows the
          call is 422 ERR_RENEWAL_REQUIRES_ANALYSIS, and it succeeds only after a
          BASE_CASE analysis is posted — while START_ANALYSIS itself needs
          term_end_date within 270 days, which 2027-01-31 satisfies from 2026-08-01.
        test_recipe:
          setup:
            - "Cliffside Telco holds an executed agreement ending 2027-01-31, which is 183 days after the 2026-08-01 clock and therefore inside the 270-day renewal window."
            - "One 2026-06 report is accepted so the analysis has a latest_accepted_report_id to anchor on."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
