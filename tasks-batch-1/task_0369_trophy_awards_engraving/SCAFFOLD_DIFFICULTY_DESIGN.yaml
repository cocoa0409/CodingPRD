            - "Order.${order_id}.payment_status == UNPAID"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ---- component allocation: aggregate-capacity overlap (sum of reserved <= on_hand) ----
      - name: component_aggregate_capacity_overlap_rejects_overbook
        grounds:
          - calculations.component_available
          - validations[priority=12]
          - state_machines.Order.PRICED_to_CONFIRMED
        distinguishing_aspect: |
          Interval semantics = AGGREGATE CAPACITY on Component: two confirmations 'occupy' the same component pool;
          the second confirm is rejected ERR_COMPONENT_SHORTAGE because cumulative RESERVED qty would exceed on_hand_qty
          (sum-of-reservations <= capacity), not a point collision.
        test_recipe:
          setup:
            - "Component on_hand 3. Order A reserves 2 (confirmed). Order B priced needs 2 more; total 4 > 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: Anonymous
            - call: "POST /rush-policies"
              payload: { name: "std", expedited_surcharge_pct: 0.25, rush_surcharge_pct: 0.50, rush_min_business_days: 1, active: true }
              as: ShopManager
            - call: "POST /components"
              payload: { code: "BASE-15", name: "Base", on_hand_qty: 3, reorder_point: 0 }
              as: ShopManager
              captures: { comp_id: $.data.id }
            - call: "POST /catalog-products"
              payload: { sku: "ASA-15", name: "Plaque", product_type: "PLAQUE", base_price_cents: 1000, engraving_price_per_char_cents: 0, logo_setup_fee_cents: 0, standard_lead_days: 3, bom: [{ component_id: "${comp_id}", qty_per_unit: 1 }] }
              as: ShopManager
