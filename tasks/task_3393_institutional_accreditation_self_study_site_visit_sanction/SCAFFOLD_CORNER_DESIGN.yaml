      - name: eligibility_deficiency_refiling_loop
        claim_type: Valid Transition
        grounds:
          - state_machines.EligibilityApplication.FILED_to_DEFICIENT
          - state_machines.EligibilityApplication.DEFICIENT_to_FILED
        distinguishing_aspect: "The FILED -> DEFICIENT -> FILED loop is cyclic: REQUEST_COMPLETION returns the application to the liaison, re-filing succeeds, and a subsequent DENY closes it — filed_at refreshes on the second filing."
        test_recipe:
          setup:
            - "PROSPECTIVE institution with a DRAFT eligibility application."
          setup_api_calls:
            - *k_clock
            - *k_inst
            - *k_elig_new
          trigger:
            - *k_elig_file
            - call: "POST /accreditation/eligibility-applications/${elig_id}/adjudicate"
              payload: { decision: "REQUEST_COMPLETION", adjudication_notes: "Missing financial exhibit." }
              as: CommissionStaff
              captures: { st_def: $.data.status }
            - *k_elig_file
            - call: "GET /accreditation/institutions/${inst_id}/eligibility-applications"
              payload: {}
              as: CommissionStaff
              captures: { st_refiled: "$.data[0].status" }
            - call: "POST /accreditation/eligibility-applications/${elig_id}/adjudicate"
              payload: { decision: "DENY", adjudication_notes: "Incomplete after resubmission." }
              as: CommissionStaff
              captures: { st_denied: $.data.status }
          assert:
            - "st_def == DEFICIENT after REQUEST_COMPLETION, st_refiled == FILED after the cyclic re-file, st_denied == DENIED"
            - "Institution.${inst_id}.accreditation_status remains PROSPECTIVE throughout (denial is not an exit to CANDIDATE)"

