            - "${lic_st} == SUSPENDED and ${areq} == false, so ${ast} == SUBMITTED — filing during a suspension is permitted"
            - "${e_ae} == ERR_ACTIVE_ENFORCEMENT_BLOCKS_AMENDMENT with HTTP 409"
            - "LicenseAmendment.${amd}.status is still SUBMITTED with decided_at null, and Provider.${prov}.licensed_capacity is unchanged"

      - name: err_unauthenticated_four_ways_to_fail_the_identity_envelope
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_UNAUTHENTICATED
          - validations.priority_4_ERR_UNAUTHENTICATED
          - roles.Applicant
        distinguishing_aspect: "All four identity failures answer 401, never 403: a missing X-User-ID, an empty-string X-User-ID, an X-User-Role outside the eight declared roles, and an entity-backed X-User-ID that resolves to no Provider row are indistinguishable to the caller — authorisation is never reached, so nothing about the target resource leaks."
        test_recipe:
          setup:
            - "One DRAFT provider, reachable only through its own Applicant identity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
          trigger:
            - call: "POST /licensing/providers/${prov}/submit-application"
              as: Applicant
              omit_header: "X-User-ID"
              captures: { e_missing: $.data.error_id }
            - call: "POST /licensing/providers/${prov}/submit-application"
              as: Applicant
              as_user_id: ""
              captures: { e_blank: $.data.error_id }
            - call: "POST /licensing/providers/${prov}/submit-application"
              as: Auditor
              as_user_id: "${prov}"
              captures: { e_role: $.data.error_id }
            - call: "POST /licensing/providers/${prov}/submit-application"
              as: Applicant
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { e_ghost: $.data.error_id }
          assert:
            - "${e_missing} == ERR_UNAUTHENTICATED with HTTP 401 — X-User-ID absent (validation 1)"
            - "${e_blank} == ERR_UNAUTHENTICATED with HTTP 401 — an empty string is not an identity"
            - "${e_role} == ERR_UNAUTHENTICATED with HTTP 401 — an undeclared role is an authentication failure, not a 403 (validation 2)"
            - "${e_ghost} == ERR_UNAUTHENTICATED with HTTP 401 — the entity-backed identity resolves to no Provider row (validation 4)"
            - "Provider.${prov}.application_status is still DRAFT and version is still 1 after all four attempts"
            - "POST /licensing/providers is the single endpoint that sends no X-User-ID at all, which is why the setup call above carries none"

      - name: err_ownership_violation_applicant_reaches_another_providers_roster
        claim_type: error_triggerable
        grounds:
          - errors[ERR_OWNERSHIP_VIOLATION]
          - validations.priority_15_ERR_OWNERSHIP_VIOLATION
          - roles.Applicant
          - roles.LicensingInspector
        distinguishing_aspect: "Ownership is transitive and per-identity: an Applicant holding a valid role and a valid identity is still refused with ERR_OWNERSHIP_VIOLATION 403 on a roster reached through another provider's provider_id, and the same rule refuses an inspector who is not the target inspection's inspector_id."
        test_recipe:
          setup:
            - "Two independent providers, each with one PRESCHOOL roster, plus two inspectors and one inspection assigned to the first inspector."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov_a: $.data.id }
            - call: "POST /licensing/providers"
              payload: { legal_name: "Little Acorns Home", county_code: "CTY-01", site_address: "40 Pine Rd", program_type: "FAMILY_HOME", requested_capacity: 6 }
              as: Applicant
              captures: { prov_b: $.data.id }
            - call: "POST /licensing/age-group-rosters"
              payload: { provider_id: "${prov_a}", age_group: "PRESCHOOL", requested_group_size: 10 }
              as: Applicant
              as_user_id: "${prov_a}"
              captures: { r_a: $.data.id, r_a_v: $.data.version }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp_1: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Omar Vance", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp_2: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov_a}", inspector_id: "${insp_1}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins: $.data.id }
          trigger:
            - call: "PATCH /licensing/age-group-rosters/${r_a}"
              payload: { enrolled_count: 4 }
              as: Applicant
              as_user_id: "${prov_b}"
              captures: { e_own: $.data.error_id }
            - call: "POST /licensing/inspections/${ins}/start"
              as: LicensingInspector
              as_user_id: "${insp_2}"
              captures: { e_own2: $.data.error_id }
            - call: "PATCH /licensing/age-group-rosters/${r_a}"
              payload: { enrolled_count: 4 }
              as: Applicant
              as_user_id: "${prov_a}"
              captures: { r_a_v2: $.data.version }
          assert:
            - "${e_own} == ERR_OWNERSHIP_VIOLATION with HTTP 403 — the role is right and the identity resolves, only the ownership chain (AgeGroupRoster.provider_id) does not lead to ${prov_b}"
            - "AgeGroupRoster.${r_a}.enrolled_count is still 0 and version is still ${r_a_v} after the refusal"
            - "${e_own2} == ERR_OWNERSHIP_VIOLATION with HTTP 403 — Inspection.${ins}.inspector_id is ${insp_1}, so ${insp_2} may not start it"
            - "Inspection.${ins}.status is still SCHEDULED with started_at null"
            - "${r_a_v2} == ${r_a_v} + 1 — the owning Applicant's identical request is accepted, so the refusals were about identity and not about the payload"

  # ---------------------------------------------------------------------------
  # Guide section 7 — From Table 7 (RBAC). The two bullets become
  # exclusive_operations / shared_operations instances; §1.7's role_model is
  # `segregation_of_duties`, whose row ("same user cannot do step A and step B")
  # becomes the two segregation instances below. The other role-model rows
  # (approval_chain, peer_roles, hierarchical_override, delegated_authority)
  # are not this scaffold's model and yield no instances.
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: rbac_exclusive_operations_seven_cross_role_attempts_are_unauthorized
        claim_type: exclusive_operations
        grounds:
          - roles.AgencyAdmin.exclusive_operations
          - roles.Applicant.exclusive_operations
          - roles.LicensingSupervisor.exclusive_operations
          - roles.ComplaintIntakeSpecialist.exclusive_operations
          - roles.BackgroundCheckUnit.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
          - validations.priority_3_ERR_UNAUTHORIZED
        distinguishing_aspect: "Every role's exclusive list is exclusive in both directions — no role in this domain is a superset of another, so even the AgencyAdmin is refused the Applicant's submit-application and the LicensingSupervisor is refused both the clock and the intake screen, each with ERR_UNAUTHORIZED 403 and no state change."
        test_recipe:
          setup:
            - "One DRAFT provider with a staff member and an open check, one inspector with a SCHEDULED inspection, and one RECEIVED complaint."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licensing/providers"
              payload: { legal_name: "Bright Start Center", county_code: "CTY-01", site_address: "12 Elm St", program_type: "CENTER", requested_capacity: 10 }
              as: Applicant
              captures: { prov: $.data.id }
            - call: "POST /licensing/staff-members"
              payload: { provider_id: "${prov}", full_name: "Dana Reed", member_type: "DIRECTOR", date_of_birth: "1985-04-02", qualified_age_groups: ["PRESCHOOL"], role_title: "Director" }
              as: Applicant
              as_user_id: "${prov}"
              captures: { dir: $.data.id }
            - call: "POST /licensing/background-checks"
              payload: { staff_member_id: "${dir}", check_type: "FBI_FINGERPRINT" }
              as: BackgroundCheckUnit
              captures: { bc: $.data.id }
            - call: "POST /licensing/inspectors"
              payload: { full_name: "Ivy Cole", county_code: "CTY-01", certified_age_groups: ["PRESCHOOL"] }
              as: AgencyAdmin
              captures: { insp: $.data.id }
            - call: "POST /licensing/inspections"
              payload: { provider_id: "${prov}", inspector_id: "${insp}", inspection_type: "ANNUAL", scheduled_for: "2026-08-05T09:00:00Z", target_age_groups: ["PRESCHOOL"] }
              as: LicensingSupervisor
              captures: { ins: $.data.id }
            - call: "POST /licensing/complaints"
              payload: { provider_id: "${prov}", intake_channel: "PHONE", allegation_category: "RECORDS", affected_age_group: "SCHOOL_AGE", narrative: "Attendance records incomplete." }
              as: ComplaintIntakeSpecialist
              captures: { cmp: $.data.id }
          trigger:
            - call: "POST /licensing/providers/${prov}/clear-checks"
              as: Applicant
              as_user_id: "${prov}"
              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: LicensingSupervisor
              captures: { e2: $.data.error_id }
            - call: "POST /licensing/checklist-items"
              payload: { code: "FA-401", title: "Playground surfacing intact", category: "FACILITY", default_severity: "MODERATE", age_groups_applicable: ["PRESCHOOL"] }
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { e3: $.data.error_id }
            - call: "POST /licensing/complaints/${cmp}/screen"
              payload: { decision: "SCREEN_IN" }
              as: LicensingSupervisor
              captures: { e4: $.data.error_id }
            - call: "POST /licensing/inspections/${ins}/finalize"
              as: LicensingInspector
              as_user_id: "${insp}"
              captures: { e5: $.data.error_id }
            - call: "POST /licensing/background-checks/${bc}/result"
              payload: { result: "CLEARED" }
              as: LicensingSupervisor
              captures: { e6: $.data.error_id }
            - call: "POST /licensing/providers/${prov}/submit-application"
              as: AgencyAdmin
              captures: { e7: $.data.error_id }
          assert:
            - "${e1} == ERR_UNAUTHORIZED 403 — clear-checks is LicensingSupervisor-exclusive"
            - "${e2} == ERR_UNAUTHORIZED 403 — the logical clock is AgencyAdmin-exclusive, and the clock still reads 2026-08-05T09:00:00Z afterwards"
            - "${e3} == ERR_UNAUTHORIZED 403 and no ChecklistItem with code FA-401 exists"
            - "${e4} == ERR_UNAUTHORIZED 403 — screening is ComplaintIntakeSpecialist-exclusive; Complaint.${cmp}.status is still RECEIVED"
            - "${e5} == ERR_UNAUTHORIZED 403 — the inspector conducts but never finalizes; Inspection.${ins}.status is still SCHEDULED"
            - "${e6} == ERR_UNAUTHORIZED 403 — recording a registry result is BackgroundCheckUnit-exclusive; BackgroundCheck.${bc}.status is still SUBMITTED"
            - "${e7} == ERR_UNAUTHORIZED 403 — submit-application is Applicant-exclusive even for the AgencyAdmin; Provider.${prov}.application_status is still DRAFT"

      - name: rbac_shared_operations_two_roles_write_the_same_rows
        claim_type: shared_operations
        grounds:
          - roles.AgencyAdmin.shared_operations
          - roles.LicensingSupervisor.shared_operations
          - roles.LicensingInspector.shared_operations
          - endpoints.POST /licensing/inspections
          - endpoints.POST /licensing/violations/{violation_id}/disposition
        distinguishing_aspect: "Shared endpoints are shared for the whole verb, but one shared endpoint is restricted by payload value: both the supervisor and the admin may schedule inspections and both the inspector and the supervisor may disposition a violation, yet a VACATED disposition from the LicensingInspector is refused with ERR_UNAUTHORIZED 403 while the identical body from the LicensingSupervisor is accepted."
        test_recipe:
          setup:
            - "A provider, an inspector, and an IN_PROGRESS inspection carrying one CRITICAL citation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
