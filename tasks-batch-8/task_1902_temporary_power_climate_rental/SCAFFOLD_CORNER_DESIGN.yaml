            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "ACCESSORY_KIT", accessory_kit_id: "${kit_id}", quantity: 2, expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
              captures: { line_id: $.data.id }
          assert:
            - "sized_kw == 275; required amps == 331 (ceil(275000 / 831.36))"
            - "quantity 1: error_id == ERR_KIT_UNDERSIZED (422)"
            - "quantity 2: 201, line created (2 x 200 = 400 >= 331)"

