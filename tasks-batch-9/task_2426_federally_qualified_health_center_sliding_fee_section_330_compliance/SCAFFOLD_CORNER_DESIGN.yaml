            - "Encounter.${cmco1_id}.wraparound_status == \"PENDING\" and wraparound_due_cents == null"

      - name: governance_deficient_board_cannot_approve_a_scope_change
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 19]
          - errors[ERR_GOVERNANCE_DEFICIENT]
          - endpoints[POST /scope-change-requests/{id}/decide]
          - calculations.governance_posture
        distinguishing_aspect: >-
          Validity of the approval depends on a different entity set: with only one seated board
          member the grantee is GOVERNANCE_DEFICIENT (below MIN_BOARD_SEATS 3 and below
          PATIENT_MAJORITY_MIN_PCT), so APPROVE is refused with ERR_GOVERNANCE_DEFICIENT / 409 while
          the same request remains legally reviewable — begin-review succeeded.
        test_recipe:
          setup:
            - "BOOT_CORE is executed, so exactly one NON_PATIENT seat is SEATED"
            - "An ADD_SITE request for the PROPOSED annex is submitted and moved into review"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_site2
            - *c_scr_add
            - call: "POST /scope-change-requests/${cscr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /scope-change-requests/${cscr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "${cchair_id}"
          trigger:
            - call: "POST /scope-change-requests/${cscr_id}/decide"
              payload: { decision: "APPROVE", decision_note: "Annex approved by a one-member board" }
              as: BoardChair
              as_user_id: "${cchair_id}"
              captures: { e_gov: $.data.error_id }
          assert:
            - "HealthCenter.${chc_id}.governance_posture == \"GOVERNANCE_DEFICIENT\""
            - "the setup begin-review returned HTTP 200 and ScopeChangeRequest.${cscr_id}.status == \"UNDER_REVIEW\""
            - "HTTP 409 and data.error_id == \"ERR_GOVERNANCE_DEFICIENT\""
            - "ScopeChangeRequest.${cscr_id}.status == \"UNDER_REVIEW\" and decided_at == null"
            - "ServiceSite.${csite2_id}.status == \"PROPOSED\""

      - name: twenty_sixth_board_seat_rejected_by_the_aggregate_cap
        claim_type: aggregate_validation
        grounds:
          - validations[priority 39]
          - errors[ERR_BOARD_SEAT_LIMIT]
          - calculations.governance_posture.constants.MAX_BOARD_SEATS
          - endpoints[POST /health-centers/{id}/board-members]
        distinguishing_aspect: >-
          Every individual seat is valid (unique seat_number, well-ordered term, correct conditional
          fields) yet the collective count is capped: seat 26 is refused with ERR_BOARD_SEAT_LIMIT /
          409 because seated_board_count has already reached MAX_BOARD_SEATS 25.
        test_recipe:
          setup:
            - "BOOT_CORE is executed; the FINANCE seat occupies seat_number 1"
            - "Twenty-four further NON_PATIENT COMMUNITY seats (seat_number 2 through 25) are seated with term [2026-01-01, 2028-12-31], bringing seated_board_count to 25"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - call: "POST /health-centers/${chc_id}/board-members"
              payload: { seat_number: 2, seat_type: "NON_PATIENT", expertise_category: "COMMUNITY", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cseat2_id: $.data.id }
            - call: "POST /health-centers/${chc_id}/board-members"
              payload: { seat_number: 25, seat_type: "NON_PATIENT", expertise_category: "COMMUNITY", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { cseat25_id: $.data.id }
            - call: "GET /health-centers/${chc_id}/governance-summary"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { gov_seated_25: $.data.seated_board_count }
          trigger:
            - call: "POST /health-centers/${chc_id}/board-members"
              payload: { seat_number: 26, seat_type: "NON_PATIENT", expertise_category: "COMMUNITY", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { e_seatcap: $.data.error_id }
          assert:
            - "seat_number 2 through 25 each returned HTTP 201 and gov_seated_25 == 25"
            - "HTTP 409 and data.error_id == \"ERR_BOARD_SEAT_LIMIT\""
            - "GET /board-members?health_center_id=${chc_id} returns total_count == 25"
            - "HealthCenter.${chc_id}.seated_board_count == 25"

      - name: encounter_dated_exactly_at_the_logical_clock_is_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 23]
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[POST /encounters]
          - calculations.patient_charge_cents
        distinguishing_aspect: >-
          The future-date rule is strictly greater-than, so an encounter dated exactly at the current
          logical instant 2026-06-01 passes and is priced through the sliding fee (nominal 2500)
          rather than raising ERR_ENCOUNTER_DATE_IN_FUTURE.
        test_recipe:
          setup:
            - "BOOT_PT is executed and the clock is then advanced to 2026-06-01T00:00:00Z"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${cp_id}", service_site_id: "${csite_id}", service_definition_id: "${csvc_id}", encounter_date: "2026-06-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 8000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { eqc_id: $.data.id }
          assert:
            - "HTTP 201 and Encounter.${eqc_id}.encounter_date == \"2026-06-01T00:00:00.000Z\""
            - "Encounter.${eqc_id}.charge_basis == \"NOMINAL_FEE\""
            - "Encounter.${eqc_id}.patient_charge_cents == 2500"
            - "Encounter.${eqc_id}.income_verification_id == ${civ_id}"
            - "Patient.${cp_id}.patient_balance_cents == 2500"

      - name: fee_schedule_selector_runs_before_the_guideline_lookup
        claim_type: cascading_validation
        grounds:
          - validations[priority 36]
          - validations[priority 37]
          - errors[ERR_NO_EFFECTIVE_FEE_SCHEDULE]
          - calculations.fpg_percent
        distinguishing_aspect: >-
          Both the schedule selector (priority 36) and the guideline lookup (priority 37) fail for the
          same verification, and the guideline lookup depends on the selected schedule's fpg_year, so
          the answer must be ERR_NO_EFFECTIVE_FEE_SCHEDULE / 409 — never
          ERR_POVERTY_GUIDELINE_MISSING.
        test_recipe:
          setup:
            - "No PovertyGuideline is published at all"
            - "The grantee, its baseline site and service, and a patient exist, but no FeeSchedule was ever drafted"
          setup_api_calls:
            - *c_hc
            - *c_site
            - *c_svc
            - *c_p
            - *c_iv
          trigger:
            - call: "POST /income-verifications/${civ_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
              captures: { e_cascade: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_NO_EFFECTIVE_FEE_SCHEDULE\""
            - "data.error_id != \"ERR_POVERTY_GUIDELINE_MISSING\""
            - "IncomeVerification.${civ_id}.status == \"SUBMITTED\""
            - "IncomeVerification.${civ_id}.assigned_discount_tier_id == null"

      - name: refused_documentation_blocks_verify_but_not_mark_insufficient
        claim_type: conditional_validation
        grounds:
          - validations[priority 16]
          - errors[ERR_DOCUMENTATION_REFUSED]
          - endpoints[POST /income-verifications/{id}/verify]
          - endpoints[POST /income-verifications/{id}/resubmit]
        distinguishing_aspect: >-
          The refusal rule is conditional on the decision: with documentation_type REFUSED the
          MARK_INSUFFICIENT decision is allowed (the row moves to INSUFFICIENT), and only the VERIFY
          decision raises ERR_DOCUMENTATION_REFUSED / 422 — so a REFUSED packet can be cycled but
          never approved.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "Patient 'Ida Renn' submits a verification whose documentation_type is REFUSED"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p_ref
            - *c_iv_ref
          trigger:
            - call: "POST /income-verifications/${civr_id}/verify"
              payload: { decision: "MARK_INSUFFICIENT", insufficiency_reason: "Patient declined to supply documentation" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
              captures: { ins_round: $.data.resubmit_round }
            - call: "POST /income-verifications/${civr_id}/resubmit"
              payload: { documentation_type: "REFUSED" }
              as: PatientServicesRep
              as_user_id: "psr-1"
              captures: { r1_round: $.data.resubmit_round }
            - call: "POST /income-verifications/${civr_id}/verify"
              payload: { decision: "VERIFY" }
              as: EligibilityVerifier
              as_user_id: "ev-1"
              captures: { e_refused: $.data.error_id }
          assert:
            - "the MARK_INSUFFICIENT call returned HTTP 200 with status INSUFFICIENT and ins_round == 0"
            - "the resubmit call returned HTTP 200 with status SUBMITTED and r1_round == 1"
            - "the VERIFY call returned HTTP 422 with data.error_id == \"ERR_DOCUMENTATION_REFUSED\""
            - "IncomeVerification.${civr_id}.status == \"SUBMITTED\" and resubmit_round == 1"
            - "Patient.${cpr_id}.sliding_fee_status == \"UNVERIFIED\""

      - name: not_seated_chair_outranks_the_stale_health_center_version
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: not_seated_board_member_beats_stale_health_center_version
          rationale: >-
            §1.8 already pits priority 14 (ERR_NOT_SEATED_BOARD_MEMBER) against priority 10
            (ERR_STALE_HEALTH_CENTER_VERSION) on the same adopt call with both conditions violated
            simultaneously, which is exactly this row's priority-conflict claim.
        grounds:
          - validations[priority 14]
          - validations[priority 10]
          - errors[ERR_NOT_SEATED_BOARD_MEMBER]

      - name: period_overlap_outranks_the_nominal_fee_cap
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: fee_schedule_period_overlap_beats_nominal_fee_above_cap
          rationale: >-
            §1.8 already adopts a schedule that both overlaps a live period (priority 24) and carries
            a nominal fee above the grantee cap (priority 41) and pins ERR_FEE_SCHEDULE_PERIOD_OVERLAP
            as the answer.
        grounds:
          - validations[priority 24]
          - validations[priority 41]
          - errors[ERR_FEE_SCHEDULE_PERIOD_OVERLAP]

      - name: fee_schedule_period_adjacency_and_equal_start_supersede
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: fee_schedule_periods_half_open_overlap_adjacency_and_equal_start_supersede
          rationale: >-
            §1.8 already walks the temporal matrix for fee-schedule periods — abutting periods pass,
            one-instant overlap fails, and an equal-start adoption supersedes the incumbent — which
            covers the temporal-validation row for this entity.
        grounds:
          - validations[priority 24]
          - errors[ERR_FEE_SCHEDULE_PERIOD_OVERLAP]

      - name: encounter_site_scope_state_gates_billing
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: encounter_creation_depends_on_service_site_scope_state
          rationale: >-
            §1.8 already tests ERR_SITE_NOT_IN_SCOPE across the PROPOSED, IN_SCOPE, SUSPENDED and
            ON_HOLD site states with an otherwise identical encounter payload.
        grounds:
          - validations[priority 33]
          - errors[ERR_SITE_NOT_IN_SCOPE]

      - name: granted_waiver_protects_the_nominal_charge_from_void
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: void_restores_patient_balance_with_zero_drift_after_a_granted_waiver
          rationale: >-
            §1.8 already triggers ERR_INABILITY_TO_PAY_PROTECTED on the protected path and then
            proves the compensating ledger restore, so a standalone violation test would duplicate it.
        grounds:
          - validations[priority 17]
          - errors[ERR_INABILITY_TO_PAY_PROTECTED]

      - name: resubmission_loop_cap_and_stale_schedule_errors
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: corrective_action_plan_reject_resubmit_cycle_capped_at_two_rounds
          rationale: >-
            ERR_LOOP_LIMIT_EXCEEDED is exercised by the §1.8 CAP resubmission cap (and again by the
            scope-change revision cap), and ERR_FEE_SCHEDULE_OUT_OF_DATE is exercised by the §1.8
            scope-approval dependency on fee_schedule_review_status; both would be re-runs here.
        grounds:
          - validations[priority 12]
          - validations[priority 20]
          - errors[ERR_LOOP_LIMIT_EXCEEDED]
          - errors[ERR_FEE_SCHEDULE_OUT_OF_DATE]

  # ===========================================================================
  - section: endpoints
    instances:

      - name: board_member_create_read_and_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /health-centers/{id}/board-members]
          - endpoints[GET /board-members/{id}]
          - endpoints[GET /board-members]
          - endpoints[POST /board-members/{id}/resign]
        distinguishing_aspect: >-
          BoardMember has no PATCH: the write surface is create plus resign, so the round trip is
          create -> read-by-id -> list (filtered by health_center_id) -> resign, and the resigned row
          stays listable with status RESIGNED while seated_board_count drops back to 1.
        test_recipe:
          setup:
            - "The 2026 guideline is published and the grantee exists with one SEATED FINANCE seat"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_chair
          trigger:
            - call: "POST /health-centers/${chc_id}/board-members"
              payload: { seat_number: 2, seat_type: "NON_PATIENT", expertise_category: "CLINICAL", term_start: "2026-02-01T00:00:00Z", term_end: "2029-01-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { crud_seat_id: $.data.id, crud_seat_v: $.data.version }
            - call: "GET /board-members/${crud_seat_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { crud_read_status: $.data.status }
            - call: "GET /board-members"
              payload: { health_center_id: "${chc_id}", status: "SEATED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /board-members/${crud_seat_id}/resign"
              payload: { resignation_date: "2026-07-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { crud_resign_v: $.data.version }
          assert:
            - "the create returned HTTP 201 with status SEATED, seat_number 2, expertise_category \"CLINICAL\" and crud_seat_v == 1"
            - "crud_read_status == \"SEATED\" and BoardMember.${crud_seat_id}.patient_id == null"
            - "the filtered list returned total_count == 2, has_more false, limit 10, offset 0"
            - "the resign returned HTTP 200 with status RESIGNED, resignation_date \"2026-07-01T00:00:00.000Z\" and crud_resign_v == 2"
            - "GET /board-members?health_center_id=${chc_id}&status=SEATED now returns total_count == 1"
            - "HealthCenter.${chc_id}.seated_board_count == 1"

      - name: fee_schedule_annual_review_action_stamps_review_metadata
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /fee-schedules/{id}/annual-review]
          - calculations.fee_schedule_review_status
          - entities.FeeSchedule.fields.last_reviewed_at
        distinguishing_aspect: >-
          The annual review is a metadata action, not a state transition: it re-stamps
          last_reviewed_at with the current logical clock 2026-12-01 and stores
          reviewed_against_guideline_year 2026, leaving status ADOPTED and review_status CURRENT
          (122 elapsed days is far short of the 365-day rule and 2026 is still the latest published
          guideline year).
        test_recipe:
          setup:
            - "BOOT_CORE is executed; the schedule was adopted at 2026-08-01"
            - "The clock is advanced to 2026-12-01T00:00:00Z"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /fee-schedules/${cfs_id}/annual-review"
              payload: { reviewed_against_guideline_year: 2026 }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { ar_status: $.data.review_status }
          assert:
            - "HTTP 200 and ar_status == \"CURRENT\""
            - "FeeSchedule.${cfs_id}.last_reviewed_at == \"2026-12-01T00:00:00.000Z\""
            - "FeeSchedule.${cfs_id}.reviewed_against_guideline_year == 2026"
            - "FeeSchedule.${cfs_id}.status == \"ADOPTED\""
            - "FeeSchedule.${cfs_id}.adopted_at == \"2026-08-01T00:00:00.000Z\""
            - "HealthCenter.${chc_id}.version == 5"

      - name: governance_summary_computed_read_matches_the_governance_calculation
        claim_type: computed_read
        grounds:
          - endpoints[GET /health-centers/{id}/governance-summary]
          - calculations.governance_posture
          - entities.BoardMember.fields.seat_type
        distinguishing_aspect: >-
          The computed read recomputes every governance field from the BoardMember rows rather than
          echoing stored counters: with a single NON_PATIENT FINANCE seat it returns seated 1,
          qualified_patient 0, non_patient 1, healthcare_industry 0, patient_seat_pct 0.00 and
          GOVERNANCE_DEFICIENT, and its version field mirrors HealthCenter.version 5.
        test_recipe:
          setup:
            - "BOOT_CORE is executed, leaving exactly one SEATED NON_PATIENT seat"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
          trigger:
            - call: "GET /health-centers/${chc_id}/governance-summary"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { gs_seated: $.data.seated_board_count, gs_qp: $.data.qualified_patient_seat_count, gs_np: $.data.non_patient_seat_count, gs_ind: $.data.healthcare_industry_seat_count, gs_pct: $.data.patient_seat_pct, gs_posture: $.data.governance_posture, gs_version: $.data.version }
          assert:
            - "HTTP 200 and response_type == \"object\""
            - "gs_seated == 1 and gs_qp == 0 and gs_np == 1 and gs_ind == 0"
            - "gs_pct == 0.00"
            - "gs_posture == \"GOVERNANCE_DEFICIENT\""
            - "gs_version == 5 and HealthCenter.${chc_id}.governance_posture == \"GOVERNANCE_DEFICIENT\""

      - name: claim_wraparound_is_allowed_only_while_a_wraparound_is_outstanding
        claim_type: conditional_action
        grounds:
          - endpoints[POST /encounters/{id}/claim-wraparound]
          - state_machines.Encounter.wraparound_dimension
          - state_machines.Encounter.PAID_to_RECONCILED
          - calculations.wraparound_due_cents
        distinguishing_aspect: >-
          The action is gated on the parallel wraparound dimension: from PENDING it moves to CLAIMED
          without touching pps_claim_status PAID, the follow-up call with receipt_confirmed true
          moves it to RECEIVED and only then lets pps_claim_status reach RECONCILED, and a third call
          on the now-terminal row is refused with ERR_INVALID_STATE_TRANSITION / 409.
        test_recipe:
          setup:
            - "BOOT_PT is executed; one MEDICAID_MCO encounter is billed and paid 14000 against a PPS rate of 20000"
            - "The nominal patient portion is 2500, so wraparound_due_cents settles at 20000 - 14000 - 2500 = 3500"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_p
            - *c_iv
            - *c_ivv
            - *c_mco1
            - *c_mco1_bill
            - call: "POST /encounters/${cmco1_id}/record-payment"
              payload: { mco_paid_cents: 14000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cw_due: $.data.wraparound_due_cents, cw_state0: $.data.wraparound_status }
          trigger:
            - call: "POST /encounters/${cmco1_id}/claim-wraparound"
              payload: {}
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cw_state1: $.data.wraparound_status, cw_claim1: $.data.pps_claim_status }
            - call: "POST /encounters/${cmco1_id}/claim-wraparound"
              payload: { receipt_confirmed: true }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cw_state2: $.data.wraparound_status, cw_claim2: $.data.pps_claim_status }
            - call: "POST /encounters/${cmco1_id}/claim-wraparound"
              payload: { receipt_confirmed: true }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { cw_err: $.data.error_id }
          assert:
            - "cw_due == 3500 and cw_state0 == \"PENDING\""
            - "the first claim returned HTTP 200 with cw_state1 == \"CLAIMED\" and cw_claim1 == \"PAID\""
            - "the second claim returned HTTP 200 with cw_state2 == \"RECEIVED\" and cw_claim2 == \"RECONCILED\""
            - "the third claim returned HTTP 409 with data.error_id == \"ERR_INVALID_STATE_TRANSITION\""
            - "HealthCenter.${chc_id}.wraparound_receivable_cents == 0"

      - name: scope_change_request_link_binds_the_target_site_on_both_sides
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /health-centers/{id}/scope-change-requests]
          - endpoints[GET /scope-change-requests]
          - entities.ScopeChangeRequest.fields.target_site_id
          - complexity_profile.entity_topology
        distinguishing_aspect: >-
          The link is queryable from both directions: the ADD_SITE request is retrievable by
          target_site_id filter and by health_center_id filter, and the PROPOSED site it points at is
          simultaneously visible under GET /health-centers/{id}/service-sites while staying outside
          the in_scope_site_count of 1.
        test_recipe:
          setup:
            - "BOOT_CORE is executed and the PROPOSED annex site plus its ADD_SITE request exist"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_site2
            - *c_scr_add
          trigger:
            - call: "GET /scope-change-requests"
              payload: { target_site_id: "${csite2_id}" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /health-centers/${chc_id}/service-sites"
              payload: { status: "PROPOSED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "the target_site_id filter returned total_count == 1 with the single row id ${cscr_id}"
            - "ScopeChangeRequest.${cscr_id}.health_center_id == ${chc_id} and target_site_id == ${csite2_id}"
            - "the PROPOSED site listing returned total_count == 1 with the single row id ${csite2_id}"
            - "HealthCenter.${chc_id}.in_scope_site_count == 1"

      - name: compliance_sweep_skips_rows_that_are_not_yet_due
        claim_type: bulk_action
        grounds:
          - endpoints[POST /_ops/compliance-sweep]
          - calculations.compliance_sweep_epoch
          - entities.SiteVisitFinding.fields.cap_due_at
        distinguishing_aspect: >-
          The sweep is skip-not-rollback: with two OPEN findings due 2026-08-02 and 2026-08-31 and
          the clock at 2026-08-02, exactly one escalates, the other is left untouched at OPEN, and the
          single response counts only the escalated row.
        test_recipe:
          setup:
            - "BOOT_CORE is executed"
            - "Two CONDITION findings are issued at clock 2026-08-01: one with cap_due_days 1 (due 2026-08-02) and one with cap_due_days 30 (due 2026-08-31)"
            - "The clock is advanced to 2026-08-02T00:00:00Z"
          setup_api_calls:
            - *c_pg26
            - *c_hc
            - *c_site
            - *c_svc
            - *c_chair
            - *c_fs
            - *c_t1
            - *c_t2
            - *c_hcv
            - *c_adopt
            - *c_find1
            - *c_find30
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /_ops/compliance-sweep"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { bulk_escalated: $.data.escalated_finding_count, bulk_expired_iv: $.data.expired_verification_count, bulk_expired_fs: $.data.expired_fee_schedule_count }
          assert:
            - "HTTP 200 and bulk_escalated == 1"
            - "bulk_expired_iv == 0 and bulk_expired_fs == 0"
            - "SiteVisitFinding.${cfind1_id}.status == \"ESCALATED\" and escalated_at == \"2026-08-02T00:00:00.000Z\""
            - "SiteVisitFinding.${cfind30_id}.status == \"OPEN\" and escalated_at == null"
            - "HealthCenter.${chc_id}.open_condition_count == 1 and scope_posture == \"FROZEN\""

  # ===========================================================================
  - section: errors
    instances:

      - name: request_missing_x_user_id_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority 1]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - response_envelope.error_shape
        distinguishing_aspect: >-
          The auth-header check is priority 1, so a POST /health-centers that omits X-User-ID fails
          with ERR_MISSING_AUTH_HEADERS / 401 before the body is even validated, and the error body
          carries the full meta envelope with response_type "error".
        test_recipe:
          setup:
            - "Empty database; no headers are pre-seeded"
          setup_api_calls: []
          trigger:
            - call: "POST /health-centers"
              payload: { legal_name: "Headerless Health", grant_number: "H80CS00999" }
              as: PlatformAdmin
              as_user_id: null
              captures: { e_noauth: $.data.error_id }
          assert:
            - "HTTP 401 and data.error_id == \"ERR_MISSING_AUTH_HEADERS\""
            - "response_type == \"error\" and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are both present"
            - "the missing required fields pps_base_rate_cents and medicare_upper_limit_cents did NOT produce ERR_VALIDATION"
            - "GET /health-centers with valid headers returns total_count == 0"

      - name: unknown_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority 2]
          - errors[ERR_UNKNOWN_ROLE]
          - roles
        distinguishing_aspect: >-
          An X-User-Role of "Auditor" is not one of the seven declared roles, so the request fails
          with ERR_UNKNOWN_ROLE / 401 at priority 2 — distinct from the 403 ERR_UNAUTHORIZED a
          declared-but-unpermitted role would get on the same endpoint.
        test_recipe:
          setup:
            - "The 2026 guideline is published"
          setup_api_calls:
            - *c_pg26
          trigger:
            - call: "GET /poverty-guidelines/${cpg26_id}"
              payload: {}
              as: "Auditor"
              as_user_id: "aud-1"
              captures: { e_unknownrole: $.data.error_id }
          assert:
            - "HTTP 401 and data.error_id == \"ERR_UNKNOWN_ROLE\""
            - "the same GET as ComplianceOfficer returns HTTP 200 with guideline_year 2026"

      - name: every_declared_not_found_error_is_triggerable_by_unknown_path_id
        claim_type: violation_to_error
        grounds:
          - errors[ERR_HEALTH_CENTER_NOT_FOUND]
          - errors[ERR_POVERTY_GUIDELINE_NOT_FOUND]
          - errors[ERR_BOARD_MEMBER_NOT_FOUND]
          - errors[ERR_SERVICE_SITE_NOT_FOUND]
          - errors[ERR_SERVICE_DEFINITION_NOT_FOUND]
          - errors[ERR_SCOPE_CHANGE_REQUEST_NOT_FOUND]
          - errors[ERR_FEE_SCHEDULE_NOT_FOUND]
          - errors[ERR_DISCOUNT_TIER_NOT_FOUND]
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_INCOME_VERIFICATION_NOT_FOUND]
          - errors[ERR_ENCOUNTER_NOT_FOUND]
          - errors[ERR_WAIVER_NOT_FOUND]
          - errors[ERR_UDS_REPORT_NOT_FOUND]
          - errors[ERR_QUALITY_MEASURE_RESULT_NOT_FOUND]
          - errors[ERR_SITE_VISIT_FINDING_NOT_FOUND]
          - errors[ERR_CORRECTIVE_ACTION_PLAN_NOT_FOUND]
          - validations[priority 6]
        distinguishing_aspect: >-
          All sixteen declared 404s are reachable and each names its own entity: sixteen GET-by-id
          calls with the same syntactically valid but unknown UUID return sixteen distinct error_ids,
          none of them a generic ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database except the 2026 guideline, so every other lookup is genuinely absent"
          setup_api_calls:
            - *c_pg26
          trigger:
            - call: "GET /health-centers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceOfficer
