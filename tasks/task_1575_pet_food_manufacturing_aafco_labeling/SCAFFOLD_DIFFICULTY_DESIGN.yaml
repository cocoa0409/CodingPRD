          assert:
            - "accept-for-review rejected: error_id == ERR_OPEN_RECALL"
            - "StateRegistration.${reg_id}.status remains SUBMITTED"

  # -------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — different interval semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: line_schedule_half_open_window_conflict
        grounds:
          - validations[priority=12]
          - errors[ERR_LINE_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: half-open [start, start+8h) on the LINE-A
          resource — a second batch starting exactly at the first batch's
          window end (16:00 after an 08:00 start) is allowed (adjacent,
          gap=0), while one starting at 15:59 collides and is rejected with
          ERR_LINE_SCHEDULE_CONFLICT. Resource entity: ProductionBatch.line_id.
        test_recipe:
          setup:
            - "Two LOCKed formulas; batch X on LINE-G 08:00 RELEASED_FOR_PRODUCTION; batches Y (15:59) and Z (16:00) on LINE-G SCHEDULED"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Oscar Pets", fein: "163456780", contact_email: "qa@oscar.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "Oscar Supply", fsma_facility_id: "FSMA-O001", country_code: "US", risk_tier: "LOW" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Herring Meal", ingredient_code: "HRML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.66, CRUDE_FAT: 0.15, MOISTURE: 0.07 }, allergen_class: "FISH" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-8001" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "OS-001", product_name: "Oscar Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 26.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/substantiate"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/formulas/${f_id}/lock"
              payload: {}
              as: QAApprover
            - call: "GET /petfood/formulas/${f_id}"
              payload: {}
              as: ProductionPlanner
              captures: { f_ver: $.data.version }
            - call: "POST /petfood/formulas/${f_id}/production-batches"
              payload: { planned_kg: 400.0, line_id: "LINE-G", scheduled_start: "2026-08-15T08:00:00Z", expected_formula_version: "${f_ver}" }
              as: ProductionPlanner
              captures: { bx_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/production-batches"
              payload: { planned_kg: 400.0, line_id: "LINE-G", scheduled_start: "2026-08-15T15:59:00Z", expected_formula_version: "${f_ver} + 1" }
              as: ProductionPlanner
              captures: { by_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/production-batches"
              payload: { planned_kg: 400.0, line_id: "LINE-G", scheduled_start: "2026-08-15T16:00:00Z", expected_formula_version: "${f_ver} + 2" }
              as: ProductionPlanner
              captures: { bz_id: $.data.id }
            - call: "POST /petfood/production-batches/${bx_id}/release"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /petfood/production-batches/${by_id}/release"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /petfood/production-batches/${bz_id}/release"
              payload: {}
              as: ProductionPlanner
              captures: { bz_status: $.data.status }
          assert:
            - "Batch Y (15:59 start) release rejected: error_id == ERR_LINE_SCHEDULE_CONFLICT"
            - "Batch Z (16:00 start, touches window end) releases: status == RELEASED_FOR_PRODUCTION (half-open boundary admitted)"

      - name: registration_resubmit_after_rejection_window
        grounds:
          - state_machines.StateRegistration.REJECTED_to_SUBMITTED
          - calculations.registration_fee_schedule
        distinguishing_aspect: |
          Interval semantics: aggregate-capacity style — the annual
          registration occupies the formula's (state_code) slot for the
          registration year; resubmission after REJECTED is allowed only while
          no APPROVED registration for the same (formula, state_code) occupies
          the slot (uniqueness over the year interval, not a timed window).
          Resource entity: StateRegistration (formula_id, state_code) pair.
          Distinct from the half-open timed-window semantics of the line
          schedule. A resubmit after REJECTED recomputes the fee; a second
          SUBMITTED registration for the same state while one is APPROVED is
          rejected with ERR_DUPLICATE_KEY.
        test_recipe:
          setup:
            - "LOCKED formula; registration R1 for TX rejected; registration R2 for TX approved afterwards; resubmit R1 and attempt a fresh duplicate TX submission"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Papa Pets", fein: "173456780", contact_email: "ra@papa.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "Papa Supply", fsma_facility_id: "FSMA-P001", country_code: "US", risk_tier: "LOW" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Whitefish Meal", ingredient_code: "WFML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.64, CRUDE_FAT: 0.12, MOISTURE: 0.08 }, allergen_class: "FISH" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-9001" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "PP-001", product_name: "Papa Cat", species: "CAT", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 30.0, crude_fat_min_pct: 12.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/substantiate"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/formulas/${f_id}/state-registrations"
              payload: { state_code: "TX", label_revision_ref: 1, tonnage_tier: "T1" }
              as: RegulatoryAffairs
              as_user_id: "${bo_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /petfood/state-registrations/${r1_id}/accept-for-review"
              payload: {}
              as: StateRegulator
            - call: "POST /petfood/state-registrations/${r1_id}/reject"
              payload: {}
              as: StateRegulator
          trigger:
            - call: "POST /petfood/state-registrations/${r1_id}/resubmit"
              payload: { tonnage_tier: "T3" }
              as: RegulatoryAffairs
              as_user_id: "${bo_id}"
              captures: { r1_status: $.data.status, r1_fee: $.data.fee_cents }
            - call: "POST /petfood/formulas/${f_id}/state-registrations"
              payload: { state_code: "TX", label_revision_ref: 1, tonnage_tier: "T1" }
              as: RegulatoryAffairs
              as_user_id: "${bo_id}"
              captures: { err: $.data.error_id }
          assert:
            - "R1 resubmitted: status == SUBMITTED, fee_cents == 12000 (TX base 6000 x T3 2.0 recomputed)"
            - "Fresh duplicate TX submission while R1 occupies the slot: error_id == ERR_DUPLICATE_KEY"

  # -------------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: recall_initiate_terminate_preserves_lot_population
        grounds:
          - state_machines.RecallAction.INITIATED_to_EFFECTIVENESS_CHECK
          - state_machines.RecallAction.INITIATED_to_TERMINATED
          - entities.BrandOwner.fields.open_recall_count
          - entities.Formula.fields.open_recall_flag
        distinguishing_aspect: |
          Conserved quantity: brand-level open_recall_count (and the formula's
          open_recall_flag). Forward action (recall initiation) increments
          BrandOwner.open_recall_count by 1 and sets open_recall_flag true;
          the compensating action (terminate) decrements the count by 1 and
          clears the flag — the pair leaves open_recall_count unchanged
          (invariant: count_after_terminate == count_before_initiate).
        test_recipe:
          setup:
            - "LOCKED formula with one COMPLETED batch and one lot; no recalls open"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Quebec Pets", fein: "183456780", contact_email: "qa@quebec.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/suppliers"
              payload: { supplier_name: "Quebec Supply", fsma_facility_id: "FSMA-Q001", country_code: "CA", risk_tier: "LOW" }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /petfood/suppliers/${sup_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Kangaroo Meal", ingredient_code: "KGML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.62, CRUDE_FAT: 0.09, MOISTURE: 0.08 }, allergen_class: "OTHER" }
              as: FormulationScientist
              captures: { ing_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", coa_document_ref: "COA-10001" }
              as: QualityAnalyst
              captures: { sia_id: $.data.id }
            - call: "POST /petfood/supplier-ingredient-approvals/${sia_id}/approve"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "QB-001", product_name: "Quebec Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/nutrient-profiles"
              payload: { profile_basis: "FORMULATION_CALC", crude_protein_min_pct: 26.0, crude_fat_min_pct: 9.0, crude_fiber_max_pct: 3.0, moisture_max_pct: 10.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/substantiate"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/formulas/${f_id}/lock"
              payload: {}
              as: QAApprover
            - call: "GET /petfood/formulas/${f_id}"
              payload: {}
              as: ProductionPlanner
              captures: { f_ver: $.data.version }
            - call: "POST /petfood/formulas/${f_id}/production-batches"
              payload: { planned_kg: 200.0, line_id: "LINE-H", scheduled_start: "2026-08-16T08:00:00Z", expected_formula_version: "${f_ver}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
            - call: "POST /petfood/production-batches/${b_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /petfood/production-batches/${b_id}/start-run"
              payload: {}
              as: LineOperator
            - call: "POST /petfood/production-batches/${b_id}/complete"
              payload: { actual_kg: 200.0 }
              as: LineOperator
            - call: "POST /petfood/production-batches/${b_id}/lots"
              payload: { packaged_units: 50, best_by_date: "2027-08-01T00:00:00Z" }
              as: LineOperator
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /petfood/recall-actions"
              payload: { formula_id: "${f_id}", scope_batch_ids: ["${b_id}"], recall_class: "CLASS_III", reason: "Test recall" }
              as: QAApprover
              captures: { ra_id: $.data.id }
            - call: "GET /petfood/brand-owners/${bo_id}"
              payload: {}
              as: QAApprover
              captures: { cnt_mid: $.data.open_recall_count }
            - call: "POST /petfood/recall-actions/${ra_id}/terminate"
              payload: {}
              as: QAApprover
            - call: "GET /petfood/brand-owners/${bo_id}"
              payload: {}
              as: QAApprover
              captures: { cnt_end: $.data.open_recall_count }
            - call: "GET /petfood/formulas/${f_id}"
              payload: {}
              as: QAApprover
              captures: { flag_end: $.data.open_recall_flag }
          assert:
            - "After initiate: BrandOwner.${bo_id}.open_recall_count == 1"
            - "After terminate: BrandOwner.${bo_id}.open_recall_count == 0 (conserved)"
            - "After terminate: Formula.${f_id}.open_recall_flag == false"
            - "BatchLotCode.${lot_id}.status == QUARANTINED (compensated, not left RECALLED)"

      - name: revision_cycle_preserves_inclusion_sum
        grounds:
          - state_machines.Formula.NUTRIENT_REVIEW_to_DRAFT
          - validations[priority=10]
          - entities.FormulaIngredient.fields.inclusion_pct
        distinguishing_aspect: |
          Conserved quantity: the formula's total inclusion percentage. A
          revision cycle (submit -> request-revision -> adjust lines ->
          resubmit) must leave sum(FormulaIngredient.inclusion_pct) == 100.00
          at every re-entry to NUTRIENT_REVIEW: the forward action (revision
          request) unlocks line editing and the compensating re-submission is
          rejected by ERR_INCLUSION_SUM_INVALID whenever the sum drifts (e.g.
          adding a 5% line without removing mass), restoring the invariant by
          rejection rather than by mutation.
        test_recipe:
          setup:
            - "Formula with one 100% line in NUTRIENT_REVIEW; revision requested; a second 5% line added (sum now 105)"
          setup_api_calls:
            - call: "POST /petfood/brand-owners"
              payload: { legal_name: "Romeo Pets", fein: "193456780", contact_email: "ra@romeo.example" }
              as: PlatformAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Bison Meal", ingredient_code: "BSML0001", nutrient_matrix: { CRUDE_PROTEIN: 0.60, CRUDE_FAT: 0.08, MOISTURE: 0.09 }, allergen_class: "BEEF" }
              as: FormulationScientist
              captures: { ing1_id: $.data.id }
            - call: "POST /petfood/ingredients"
              payload: { aafco_name: "Sweet Potato", ingredient_code: "SWPT0001", nutrient_matrix: { CRUDE_PROTEIN: 0.04, CRUDE_FAT: 0.01, MOISTURE: 0.12 }, allergen_class: "NONE" }
              as: FormulationScientist
              captures: { ing2_id: $.data.id }
            - call: "POST /petfood/brand-owners/${bo_id}/formulas"
              payload: { formula_code: "RM-001", product_name: "Romeo Dog", species: "DOG", life_stage: "ADULT_MAINTENANCE", adequacy_basis: "FORMULATION" }
              as: FormulationScientist
              captures: { f_id: $.data.id }
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing1_id}", inclusion_pct: 100.0 }
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
            - call: "POST /petfood/formulas/${f_id}/request-revision"
              payload: {}
              as: QAApprover
            - call: "POST /petfood/formulas/${f_id}/ingredients"
              payload: { ingredient_id: "${ing2_id}", inclusion_pct: 5.0 }
              as: FormulationScientist
          trigger:
            - call: "POST /petfood/formulas/${f_id}/submit-nutrient-review"
              payload: {}
              as: FormulationScientist
              captures: { err: $.data.error_id }
            - call: "GET /petfood/formulas/${f_id}"
              payload: {}
              as: FormulationScientist
              captures: { f_status: $.data.status }
          assert:
            - "Re-submit with sum 105.0 rejected: error_id == ERR_INCLUSION_SUM_INVALID"
            - "Formula.${f_id}.status remains DRAFT (invariant preserved by rejection; sum gate keeps 100.00 invariant at every NUTRIENT_REVIEW entry)"
