            - "after ACCEPT, the identical certify succeeds: audit_status == CERTIFIED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: showtime_buffered_overlap_on_screen
        grounds:
          - validations[priority=9]
          - errors[ERR_SHOWTIME_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: buffered turnaround on resource Screen — a feature
          occupies [starts_at, starts_at+runtime] plus a 30-minute turnaround, so
          a gap of exactly 30 minutes is allowed but 29 is rejected; distinct
          from the sibling's half-open adjacency semantics on PreShowReel.
        test_recipe:
          setup: ["screen with a 19:00 showtime of a 120-minute feature (occupied until 21:00, buffered to 21:30)"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st1: "$.data.id" } }
          trigger:
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T21:30:00Z" }, as: NetworkOps, captures: { st2: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T21:29:00Z" }, as: NetworkOps, captures: { err: "$.data.error_id" } }
          assert:
            - "21:30 showtime succeeds (gap exactly TURNAROUND_MINUTES == 30 is allowed)"
            - "21:29 showtime rejected: error_id == ERR_SHOWTIME_OVERLAP (gap 29 < 30)"

      - name: slot_halfopen_overlap_in_reel
        grounds:
          - validations[priority=9]
          - errors[ERR_SLOT_INTERVAL_OVERLAP]
        distinguishing_aspect: |
          Interval semantics: half-open [offset, offset+duration) on resource
          PreShowReel — touching endpoints (offset 60 after [0,60)) are allowed,
          while an interval starting one second before the predecessor's end is
          rejected; no buffer exists, unlike the sibling's Screen rule.
        test_recipe:
          setup:
            - "reel ASSEMBLING; three APPROVED NATIONAL campaigns of distinct categories; slot A occupies [0,60)"
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a1: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a1}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 900000 }, as: SalesManager, as_user_id: "sm-1", captures: { c1: "$.data.id" } }
            - { call: "POST /network/campaigns/${c1}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c1}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/advertisers", payload: { name: "BurgerCo", advertiser_type: NATIONAL, category: QSR }, as: SalesManager, captures: { a2: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a2}", name: "C2", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 900000 }, as: SalesManager, as_user_id: "sm-1", captures: { c2: "$.data.id" } }
            - { call: "POST /network/campaigns/${c2}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c2}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/advertisers", payload: { name: "ShopCo", advertiser_type: NATIONAL, category: RETAIL }, as: SalesManager, captures: { a3: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a3}", name: "C3", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 900000 }, as: SalesManager, as_user_id: "sm-1", captures: { c3: "$.data.id" } }
            - { call: "POST /network/campaigns/${c3}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c3}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c1}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager }
          trigger:
            - { call: "GET /network/reels/${r_id}", payload: {}, as: SalesManager, captures: { rv2: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c2}", start_offset_seconds: 60, duration_seconds: 30, expected_reel_version: "${rv2}" }, as: SalesManager, captures: { sl2: "$.data.id" } }
            - { call: "GET /network/reels/${r_id}", payload: {}, as: SalesManager, captures: { rv3: "$.data.version" } }
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c3}", start_offset_seconds: 89, duration_seconds: 15, expected_reel_version: "${rv3}" }, as: SalesManager, captures: { err: "$.data.error_id" } }
          assert:
            - "slot B at offset 60 succeeds: half-open touching ([0,60) then [60,90)) is not an overlap"
            - "slot C at offset 89 rejected: error_id == ERR_SLOT_INTERVAL_OVERLAP ([89,104) intersects [60,90))"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: reel_pool_seconds_conserved_across_add_cancel
        grounds:
          - state_machines.ReelSlot.RESERVED_to_CANCELED
          - calculations.pool_capacity_check
          - entities.PreShowReel.fields.national_used_seconds
        distinguishing_aspect: |
          Conserved quantity: pool seconds (time). The forward action (slot
          create, +60 national seconds) paired with its compensating action (slot
          cancel) returns national_used_seconds to exactly its pre-action value;
          national_used + national_free == 720 throughout.
        test_recipe:
          setup: ["reel ASSEMBLING with national_used_seconds == 0; APPROVED NATIONAL campaign"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
          trigger:
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager, captures: { sl: "$.data.id" } }
            - { call: "POST /network/slots/${sl}/cancel", payload: {}, as: SalesManager }
          assert:
            - "after create: PreShowReel.${r_id}.national_used_seconds == 60"
            - "after cancel: national_used_seconds == 0 — exactly the pre-action value; no drift"
            - "invariant held throughout: national_used_seconds + national_free == 720"

      - name: campaign_reserved_cents_conserved_across_add_cancel
        grounds:
          - calculations.slot_estimated_cost
          - entities.Campaign.fields.reserved_estimated_cents
          - entities.Campaign.fields.budget_cents
        distinguishing_aspect: |
          Conserved quantity: money (cents), a different type from the sibling's
          seconds. Slot create debits reserved_estimated_cents by the snapshot
          estimate (330) and slot cancel restores it; budget headroom
          (budget_cents - reserved_estimated_cents) is unchanged by the pair.
        test_recipe:
          setup: ["APPROVED NATIONAL campaign, budget 500000, forecast-132 showtime (estimated cost 330)"]
          setup_api_calls:
            - { call: "POST /network/theaters", payload: { name: "MetroPlex", market_tier: MAJOR_METRO }, as: NetworkOps, captures: { t_id: "$.data.id" } }
            - { call: "POST /network/theaters/${t_id}/screens", payload: { auditorium_label: "Aud 1", seat_count: 200 }, as: NetworkOps, captures: { s_id: "$.data.id" } }
            - { call: "POST /network/features", payload: { title: "Skyline", content_rating: PG13, runtime_minutes: 120, release_date: "2026-08-10" }, as: NetworkOps, captures: { f_id: "$.data.id" } }
            - { call: "POST /network/screens/${s_id}/showtimes", payload: { feature_id: "${f_id}", starts_at: "2026-08-14T19:00:00Z" }, as: NetworkOps, captures: { st_id: "$.data.id" } }
            - { call: "GET /network/showtimes/${st_id}/reel", payload: {}, as: NetworkOps, captures: { r_id: "$.data[0].id", rv: "$.data[0].version" } }
            - { call: "POST /network/advertisers", payload: { name: "AutoCo", advertiser_type: NATIONAL, category: AUTOMOTIVE }, as: SalesManager, captures: { a_id: "$.data.id" } }
            - { call: "POST /network/campaigns", payload: { advertiser_id: "${a_id}", name: "C1", flight_start_date: "2026-08-10", flight_end_date: "2026-08-20", contracted_impressions: 10000, cpm_cents: 2500, budget_cents: 500000 }, as: SalesManager, as_user_id: "sm-1", captures: { c_id: "$.data.id" } }
            - { call: "POST /network/campaigns/${c_id}/submit", payload: {}, as: SalesManager, as_user_id: "sm-1" }
            - { call: "POST /network/campaigns/${c_id}/approve", payload: {}, as: SalesManager, as_user_id: "sm-2" }
          trigger:
            - { call: "POST /network/reels/${r_id}/slots", payload: { campaign_id: "${c_id}", start_offset_seconds: 0, duration_seconds: 60, expected_reel_version: "${rv}" }, as: SalesManager, captures: { sl: "$.data.id", est: "$.data.estimated_cost_cents" } }
            - { call: "POST /network/slots/${sl}/cancel", payload: {}, as: SalesManager }
          assert:
            - "ReelSlot.${sl}.estimated_cost_cents == 330 at creation (round_half_up(132 x 2500 / 1000))"
            - "after create: Campaign.${c_id}.reserved_estimated_cents == 330"
            - "after cancel: reserved_estimated_cents == 0 and budget_cents == 500000 (headroom 500000 identical before the pair and after it)"
