    roles: [FleetAdmin]
    code: 201
    input: [equipment_id, kind, "notes?"]
    output: WorkOrder
    side_effects: ["status=OPEN", "trigger_hours_milli = equipment.engine_hours_milli"]

  - method: GET
    path: "/fleet/work-orders/{id}"
    description: "Get one work order"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/fleet/work-orders"
    description: "List work orders; optional filters (filtered-list reverse reachability)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["equipment_id?", "mechanic_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/fleet/work-orders/{id}/dispatch"
    description: "Dispatch an OPEN work order to a mechanic"
    roles: [FleetAdmin]
    code: 200
    input: [mechanic_id]
    output: WorkOrder
    side_effects: ["status -> DISPATCHED", "mechanic.active_work_order_count incremented and status recomputed"]

  - method: POST
    path: "/fleet/work-orders/{id}/start"
    description: "Mechanic starts a DISPATCHED work order"
    roles: [Mechanic]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> IN_PROGRESS", "equipment.maintenance_status -> IN_SERVICE"]

  - method: POST
    path: "/fleet/work-orders/{id}/complete"
    description: "Mechanic completes an IN_PROGRESS work order; fires repair cascade"
    roles: [Mechanic]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> COMPLETED", "equipment.hours_at_last_service_milli = engine_hours_milli", "maintenance_status -> SERVICE_OK", "REPAIR on DOWN equipment: availability -> IDLE + SUSPENDED-assignment reactivation cascade", "mechanic count decremented"]

  - method: POST
    path: "/fleet/work-orders/{id}/cancel"
    description: "Cancel an OPEN or DISPATCHED work order"
    roles: [FleetAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> CANCELLED", "if was DISPATCHED: mechanic cleared and count decremented; maintenance_status recomputed"]

  # --- Mechanic ---
  - method: POST
    path: "/fleet/mechanics"
    description: "Create a mechanic"
    roles: [FleetAdmin]
    code: 201
    input: [mechanic_code, name, home_project_id]
    output: Mechanic
    side_effects: ["status=AVAILABLE, active_work_order_count=0"]

  - method: GET
    path: "/fleet/mechanics/{id}"
    description: "Get one mechanic"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: []
    output: Mechanic
    side_effects: []

  - method: GET
    path: "/fleet/mechanics"
    description: "List mechanics (filtered-list reverse reachability by home_project_id)"
    roles: [FleetAdmin, ProjectManager, Mechanic, Dispatcher]
    code: 200
    input: ["home_project_id?", "status?", "limit?", "offset?"]
    output: Mechanic[]
    side_effects: []

  - method: POST
    path: "/fleet/mechanics/{id}/off-duty"
