  # ===========================================================================
  # excluded_because stubs — corners already covered by a §1.8 instance
  # ===========================================================================
  - section: state_machines
    instances:
      - name: disenroll_finalize_attendance_transport_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.AttendanceDay.CHECKED_IN_to_CANCELLED
          - entities.TransportLeg.fields.status
        excluded_because:
          difficulty_instance: transitive_cascade / disenroll_finalize_cascade_depth3
          rationale: "The disenrollment-finalize cascade (CarePlan SUPERSEDED, MedicationOrder DISCONTINUED, and attendance/transport cancellation) is exercised by the depth-3 cascade §1.8 instance."

  - section: calculations
    instances:
      - name: capitation_full_month_correct_result
        claim_type: Correct Result
        grounds:
          - calculations.capitation_amount
          - entities.CapitationPayment.fields.total_billed_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / capitation_full_month_vs_daily_diverge
          rationale: "FULL_MONTH dual total 630000 and its component shares are asserted as literals in the named §1.8 dual-variant instance."
      - name: capitation_daily_proration_correct_result
        claim_type: Correct Result
        grounds:
          - calculations.capitation_amount
          - entities.CapitationPayment.fields.covered_days
        excluded_because:
          difficulty_instance: combinatorial_formula / capitation_tiered_mode_dual_factor_combination
          rationale: "DAILY proration covered_days and rounded component shares (non-dual, 10/30) are asserted as literals in the named §1.8 combinatorial instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: disenroll_finalize_occ_stale_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[disenroll-finalize-stale-participant]
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: compensating_invariant / disenroll_approve_then_withdraw_census_conserved
          rationale: "The disenrollment-finalize OCC parent (Participant.version) and its conservation behaviour are exercised via the disenrollment approve/withdraw/finalize §1.8 flows; the stale-version 412 path mirrors the capitation OCC corner instance occ_stale_version_finalize_rejected."

  - section: errors
    instances:
      - name: err_census_full_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CENSUS_FULL]
        excluded_because:
          difficulty_instance: boundary_precision_check / census_full_second_checkin_at_capacity
          rationale: "ERR_CENSUS_FULL is triggered at the occupancy '>=' boundary by the named §1.8 boundary instance."
      - name: err_transport_overlap_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_TRANSPORT_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / transport_leg_vehicle_halfopen_overlap
          rationale: "ERR_TRANSPORT_OVERLAP is triggered by the half-open vehicle-overlap §1.8 instance."
      - name: err_no_coverage_for_month_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_COVERAGE_FOR_MONTH]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / capitation_month_must_intersect_enrollment_window
          rationale: "ERR_NO_COVERAGE_FOR_MONTH is triggered by the required-overlap capitation §1.8 instance."
      - name: err_invalid_state_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / enroll_state_beats_loc_safety
          rationale: "ERR_INVALID_STATE is returned as the winning error of the state-vs-safety priority conflict §1.8 instance."
      - name: err_not_first_of_month_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_FIRST_OF_MONTH]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / enroll_temporal_beats_capacity_constraint
          rationale: "ERR_NOT_FIRST_OF_MONTH is returned as the winning error of the temporal-vs-capacity priority conflict §1.8 instance."
      - name: err_participant_not_enrolled_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PARTICIPANT_NOT_ENROLLED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / checkin_requires_participant_enrolled
          rationale: "ERR_PARTICIPANT_NOT_ENROLLED is triggered by the check-in cross-entity dependency §1.8 instance."
      - name: err_care_plan_not_active_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CARE_PLAN_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / med_order_activate_requires_care_plan_active
          rationale: "ERR_CARE_PLAN_NOT_ACTIVE is triggered by the med-order/care-plan cross-entity dependency §1.8 instance."
