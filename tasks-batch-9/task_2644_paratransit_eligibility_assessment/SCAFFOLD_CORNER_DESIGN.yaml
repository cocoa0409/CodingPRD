        distinguishing_aspect: "The PENDING_VERIFICATION self-loop is the only cyclic edge on the Application: an INSUFFICIENT response terminates that verification and still adds its wait_days to verification_excluded_days, the application does NOT advance, a replacement verification may then be requested, and while one is REQUESTED a further request is ERR_VERIFICATION_PENDING."
