# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Wholesale Marketplace Net-60 Terms & Retailer Credit Underwriting
# Sections/claim_types per references/claim-extraction-guide.md.
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: retailer_created_with_pending_defaults
        claim_type: creation_defaults
        grounds:
          - entities.Retailer.fields.verification_status
          - entities.Retailer.fields.storefront_proof_status
          - entities.Retailer.fields.resale_cert_status
        distinguishing_aspect: "A retailer registered without any verification input starts with verification_status == PENDING, both document sub-states PENDING, verification_resubmission_count == 0, return_rate == 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "New Retail", store_type: "HYBRID", address: "1 Fresh Ave", lat: 30.0, lng: -90.0, storefront_proof_url: "https://proof/n1", resale_certificate_no: "RC-N1" }
              as: Anonymous
              captures: { r_id: $.data.id }
          trigger:
            - call: "GET /wholesale/retailers/${r_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Retailer.${r_id}.verification_status == PENDING"
            - "Retailer.${r_id}.storefront_proof_status == PENDING and resale_cert_status == PENDING"
            - "Retailer.${r_id}.verification_resubmission_count == 0 and return_rate == 0 and version == 1"
      - name: brand_created_in_draft_with_referral_code
        claim_type: creation_defaults
        grounds:
          - entities.Brand.fields.onboarding_status
          - entities.Brand.fields.referral_code
        distinguishing_aspect: "A brand created via POST /brands starts DRAFT with a non-empty server-minted referral_code, payout_balance_cents == 0, abuse_flags == 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /wholesale/brands"
              payload: { name: "Fresh Brand", contact_email: "fb@b.com", min_order_value_cents: 5000, default_case_pack_size: 6, lead_time_days: 3, payout_delay_days: 14 }
              as: Brand
              captures: { b_id: $.data.id, b_ref: $.data.referral_code }
          trigger:
            - call: "GET /wholesale/brands/${b_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Brand.${b_id}.onboarding_status == DRAFT and version == 1"
            - "Brand.${b_id}.referral_code == ${b_ref} (non-empty, stable across reads)"
            - "Brand.${b_id}.payout_balance_cents == 0 and abuse_flags == 0"
      - name: retailer_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "GET on a non-existent retailer UUID returns ERR_NOT_FOUND with HTTP 404 and the error envelope shape."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /wholesale/retailers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP 404 with error_id == ERR_NOT_FOUND inside the §1.0 error envelope (meta + response_type == error)"
      - name: retailer_registration_rejects_bad_enum
        claim_type: required_field_and_type_constraints
        grounds:
          - entities.Retailer.fields.store_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "store_type outside the declared enum (BRICK_AND_MORTAR | ONLINE | HYBRID) is rejected with ERR_INVALID_REQUEST and no retailer is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Bad Enum", store_type: "POP_UP", address: "2 Wrong St", lat: 31.0, lng: -91.0, storefront_proof_url: "https://proof/n2", resale_certificate_no: "RC-N2" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /retailers list remains empty"
      - name: retailers_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints[GET /retailers]
        distinguishing_aspect: "List endpoint honors limit/offset and returns total_count and has_more per the fixed envelope defaults (default limit 10)."
        test_recipe:
          setup: ["two registered retailers"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "List A", store_type: "ONLINE", address: "3A Page St", lat: 32.0, lng: -92.0, storefront_proof_url: "https://proof/pa", resale_certificate_no: "RC-PA" }
              as: Anonymous
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "List B", store_type: "ONLINE", address: "3B Page St", lat: 32.1, lng: -92.1, storefront_proof_url: "https://proof/pb", resale_certificate_no: "RC-PB" }
              as: Anonymous
          trigger:
            - call: "GET /wholesale/retailers"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response contains exactly 1 retailer, total_count == 2, has_more == true"
            - "second page (offset 1) returns the other retailer with has_more == false"
      - name: payment_entity_immutable_no_version
        claim_type: immutability
        grounds:
          - entities.Payment
        distinguishing_aspect: "Payment has common_fields: false — it carries id and created_at only, and there is no update or delete endpoint for it anywhere in §1.5."
        test_recipe:
          setup: ["a VERIFIED retailer with credit account, ACTIVE brand, and one shipped order whose invoice is partially paid"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Pay Immut", store_type: "ONLINE", address: "4 Log Ln", lat: 33.0, lng: -93.0, storefront_proof_url: "https://proof/pi", resale_certificate_no: "RC-PI" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand PI", contact_email: "pi@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 10000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/orders/${o_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/orders/${o_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /wholesale/invoices/${inv_id}/payments"
              payload: { amount_cents: 4000 }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { pay_id: $.data.id }
          assert:
            - "Payment.${pay_id} response carries id, invoice_id, amount_cents == 4000, paid_at — and no version field"
            - "GET /invoices/${inv_id}/payments returns the payment in a length-1 array"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: verify_rejected_when_documents_unconfirmed
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Retailer.PENDING_to_VERIFIED
          - errors[ERR_VERIFICATION_INCOMPLETE]
        distinguishing_aspect: "Overall verify with only the storefront proof confirmed (resale cert still PENDING) is rejected with ERR_VERIFICATION_INCOMPLETE and the retailer stays PENDING."
        test_recipe:
          setup: ["a PENDING retailer with storefront_proof_status CONFIRMED and resale_cert_status PENDING"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Half Verified", store_type: "ONLINE", address: "5 Docs Dr", lat: 34.0, lng: -94.0, storefront_proof_url: "https://proof/hv", resale_certificate_no: "RC-HV" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP 422 with error_id == ERR_VERIFICATION_INCOMPLETE"
            - "Retailer.${r_id}.verification_status remains PENDING"
      - name: terminal_invoice_rejects_payment
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Invoice
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A payment posted against a PAID invoice (terminal) is rejected with ERR_INVALID_STATE even when the amount would otherwise be valid."
        test_recipe:
          setup: ["a VERIFIED retailer with credit account; one shipped order whose invoice was fully paid"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Term Retail", store_type: "ONLINE", address: "6 End Ave", lat: 35.0, lng: -95.0, storefront_proof_url: "https://proof/t1", resale_certificate_no: "RC-T1" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand T", contact_email: "t@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 10000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/orders/${o_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "GET /wholesale/orders/${o_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /wholesale/invoices/${inv_id}/payments"
              payload: { amount_cents: 10000 }
              as: Retailer
              as_user_id: "${r_id}"
          trigger:
            - call: "POST /wholesale/invoices/${inv_id}/payments"
              payload: { amount_cents: 1 }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP 409 with error_id == ERR_INVALID_STATE (terminal PAID lockdown beats the overpayment check)"
            - "Invoice.${inv_id}.paid_amount_cents remains 10000"
      - name: brand_reinstate_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.Brand.SUSPENDED_to_ACTIVE
        distinguishing_aspect: "A brand suspended by 5 RETURN_ABUSE confirms can be reinstated by PlatformAdmin; abuse_flags stays 5 but orders can be placed again."
        test_recipe:
          setup: ["a VERIFIED retailer with credit account; an ACTIVE brand with one PLACED order; the brand pushed to SUSPENDED via 5 confirmed RETURN_ABUSE flags"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Reinstate Retail", store_type: "BRICK_AND_MORTAR", address: "7 Back St", lat: 36.0, lng: -96.0, storefront_proof_url: "https://proof/r1", resale_certificate_no: "RC-R1" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand RS", contact_email: "rs@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 5000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "RETURN_ABUSE", order_id: "${o_id}" }
              as: RiskAnalyst
              captures: { f1: $.data.id }
            - call: "POST /wholesale/fraud-flags/${f1}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "RETURN_ABUSE", order_id: "${o_id}" }
              as: RiskAnalyst
              captures: { f2: $.data.id }
            - call: "POST /wholesale/fraud-flags/${f2}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "RETURN_ABUSE", order_id: "${o_id}" }
              as: RiskAnalyst
              captures: { f3: $.data.id }
            - call: "POST /wholesale/fraud-flags/${f3}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "RETURN_ABUSE", order_id: "${o_id}" }
              as: RiskAnalyst
              captures: { f4: $.data.id }
            - call: "POST /wholesale/fraud-flags/${f4}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "RETURN_ABUSE", order_id: "${o_id}" }
              as: RiskAnalyst
              captures: { f5: $.data.id }
            - call: "POST /wholesale/fraud-flags/${f5}/confirm"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /wholesale/brands/${b_id}/reinstate"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Brand.${b_id}.onboarding_status == ACTIVE after reinstate"
            - "Brand.${b_id}.abuse_flags == 5 (counter is not reset by reinstatement)"
            - "Brand.${b_id}.payout_balance_cents == -25000 (five 5000-cent abuse debits were not reversed)"
      - name: credit_account_close_blocked_by_overdue_invoice
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CreditAccount.FROZEN_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Closing a FROZEN account while one of the retailer's invoices is OVERDUE is rejected; close succeeds only when no overdue invoice remains."
        test_recipe:
          setup: ["a retailer VERIFIED with account; one shipped order unpaid past due (invoice OVERDUE); the account FROZEN via a confirmed CONSUMER_RESELLER flag"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Close Retail", store_type: "ONLINE", address: "8 Shut Ave", lat: 37.0, lng: -97.0, storefront_proof_url: "https://proof/c1", resale_certificate_no: "RC-C1" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /wholesale/brands"
              payload: { name: "Brand CL", contact_email: "cl@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 10000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/orders/${o_id}/ship"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/fraud-flags"
              payload: { retailer_id: "${r_id}", flag_type: "CONSUMER_RESELLER" }
              as: RiskAnalyst
              captures: { ff_id: $.data.id }
            - call: "POST /wholesale/fraud-flags/${ff_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /wholesale/orders/${o_id}/invoice"
              payload: {}
              as: PlatformAdmin
              captures: { inv_status: "$.data[0].status" }
          trigger:
            - call: "POST /wholesale/credit-accounts/${ca_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "invoice is OVERDUE at trigger time (lazy flip on the setup GET)"
            - "trigger rejected with error_id == ERR_INVALID_STATE (HTTP 409)"
            - "CreditAccount.${ca_id}.status remains FROZEN"
      - name: repeat_cancel_rejected_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Order.PLACED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an already-CANCELLED order is rejected with ERR_INVALID_STATE and fires no side effects (idempotency of terminal states)."
        test_recipe:
          setup: ["a VERIFIED retailer with credit account, ACTIVE brand, and one order already CANCELLED by the retailer"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Cancel Retail", store_type: "ONLINE", address: "9 Stop St", lat: 38.0, lng: -98.0, storefront_proof_url: "https://proof/x1", resale_certificate_no: "RC-X1" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
              as: PlatformAdmin
            - call: "POST /wholesale/brands"
              payload: { name: "Brand X", contact_email: "x@b.com", min_order_value_cents: 1000, default_case_pack_size: 1, lead_time_days: 0, payout_delay_days: 7 }
              as: Brand
              captures: { b_id: $.data.id }
            - call: "POST /wholesale/brands/${b_id}/activate"
              payload: {}
              as: Brand
              as_user_id: "${b_id}"
            - call: "POST /wholesale/orders"
              payload: { retailer_id: "${r_id}", brand_id: "${b_id}", lines: [{ sku: "S1", unit_price_cents: 5000, qty: 1 }] }
              as: Retailer
              as_user_id: "${r_id}"
              captures: { o_id: $.data.id }
            - call: "POST /wholesale/orders/${o_id}/cancel"
              payload: {}
              as: Retailer
              as_user_id: "${r_id}"
          trigger:
            - call: "POST /wholesale/orders/${o_id}/cancel"
              payload: {}
              as: Retailer
              as_user_id: "${r_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP 409 with error_id == ERR_INVALID_STATE"
            - "Order.${o_id}.status remains CANCELLED and no Payout exists for the order (cancel by retailer issues no compensation)"
      - name: fraud_flag_dismiss_fires_no_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.FraudFlag.OPEN_to_DISMISSED
        distinguishing_aspect: "Dismissing an OPEN flag changes only the flag: the retailer stays VERIFIED, the account stays ACTIVE, any PLACED order stays PLACED."
        test_recipe:
          setup: ["a VERIFIED retailer with ACTIVE account, one PLACED order, and one OPEN STRAW_STOREFRONT flag"]
          setup_api_calls:
            - call: "POST /wholesale/retailers"
              payload: { legal_name: "Dismiss Retail", store_type: "BRICK_AND_MORTAR", address: "10 Clear Ct", lat: 39.0, lng: -99.0, storefront_proof_url: "https://proof/d1", resale_certificate_no: "RC-D1" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "STOREFRONT_PROOF", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/documents/review"
              payload: { document_type: "RESALE_CERT", decision: "CONFIRM" }
              as: PlatformAdmin
            - call: "POST /wholesale/retailers/${r_id}/verify"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /wholesale/credit-accounts"
              payload: { retailer_id: "${r_id}" }
