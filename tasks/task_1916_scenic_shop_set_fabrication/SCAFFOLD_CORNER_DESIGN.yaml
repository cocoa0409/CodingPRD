  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: request_without_auth_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_UNAUTHENTICATED]'
          - 'validations[priority=1]'
        distinguishing_aspect: "Any endpoint called with missing X-User-Role / X-User-ID headers fails priority-1 auth with ERR_UNAUTHENTICATED (401) before role or existence checks."
        test_recipe:
          setup: ["shop exists"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /scenic/shops/${shop_id}"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "with auth headers omitted the call returns ERR_UNAUTHENTICATED (HTTP 401) in the standard error envelope"

      - name: request_with_invalid_role_returns_401
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_UNAUTHENTICATED]'
          - 'validations[priority=1]'
        distinguishing_aspect: "An X-User-Role value not declared in §1.7 (e.g. 'SuperUser') is an authentication failure: ERR_UNAUTHENTICATED (401), not a 403."
        test_recipe:
          setup: ["shop exists"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
          trigger:
            - call: "GET /scenic/shops/${shop_id}"
              payload: {}
              as: ShopAdmin
              captures: { err: $.data.error_id }
          assert:
            - "with X-User-Role: SuperUser the call returns ERR_UNAUTHENTICATED (HTTP 401)"

      - name: duplicate_stock_item_key_returns_409
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_DUPLICATE_STOCK_ITEM]'
          - 'validations[priority=7]'
        distinguishing_aspect: "(shop_id, material_code, condition_grade) is unique: a second POST with the same triple fails ERR_DUPLICATE_STOCK_ITEM (409); a different grade on the same material succeeds."
        test_recipe:
          setup: ["shop; stock item (LUMBER_4X8, A) exists"]
          setup_api_calls:
            - call: "POST /scenic/shops"
              payload: { name: "Metro Scenic", weekly_crew_hours_capacity: 100, horizon_weeks: 4, bay_count: 2, truck_fleet_size: 6, labor_rate_cents_per_hour: 8000, overtime_multiplier_bp: 15000, overhead_pct_bp: 1000, margin_pct_bp: 2000 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /scenic/stock-items"
              payload: { shop_id: "${shop_id}", material_code: "LUMBER_4X8", condition_grade: "A", quantity_on_hand: 10, replacement_cost_cents: 3000 }
              as: ShopAdmin
          trigger:
            - call: "POST /scenic/stock-items"
              payload: { shop_id: "${shop_id}", material_code: "LUMBER_4X8", condition_grade: "A", quantity_on_hand: 5, replacement_cost_cents: 3100 }
              as: ShopAdmin
              captures: { err: $.data.error_id }
            - call: "POST /scenic/stock-items"
              payload: { shop_id: "${shop_id}", material_code: "LUMBER_4X8", condition_grade: "B", quantity_on_hand: 5, replacement_cost_cents: 5000 }
              as: ShopAdmin
              captures: { si_b: $.data.id }
          assert:
            - "duplicate (LUMBER_4X8, A) fails with ERR_DUPLICATE_STOCK_ITEM (HTTP 409)"
            - "same material at grade B succeeds: StockItem.${si_b}.status == ACTIVE"

      - name: stock_line_over_on_hand_returns_insufficient
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_STOCK_INSUFFICIENT]'
