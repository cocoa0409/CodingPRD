              as: CaseWorker
              captures: { caset: "$.data.id" }
            - call: "POST /child-support/cases/${caset}/paternity-actions"
              payload: { method: "PRESUMED_MARITAL" }
              as: CaseWorker
              captures: { pat: "$.data.id" }
            - call: "POST /child-support/cases/${caset}/orders"
              payload: { order_type: "MEDICAL_SUPPORT", origin_state_code: "MN", effective_date: "2026-05-01", medical_support_monthly_cents: 20000 }
              as: CaseWorker
              captures: { ordm: "$.data.id" }
            - call: "POST /child-support/orders/${ordm}/guideline-calculation"
              payload: {}
              as: CaseWorker
            - call: "POST /child-support/orders/${ordm}/entry"
              payload: {}
