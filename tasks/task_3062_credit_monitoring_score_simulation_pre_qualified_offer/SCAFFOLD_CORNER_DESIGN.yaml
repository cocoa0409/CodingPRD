  # ---------------------------------------------------------------------------
  - section: validations
    instances:

      - name: missing_user_context_header_is_rejected_before_anything_else
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "An unauthenticated request to a consumer-only endpoint fails the priority-1 header rule with 400 rather than reaching the priority-2 role check."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /credit/consumers"
              payload: { full_name: "No Hdr", email: "nohdr@x.com", state_code: "CA", bureau_pin: "6543", dti_pct: 35.0 }
              as: Anonymous
              captures: { err_hdr: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == \"ERR_INVALID_REQUEST\""
            - "no consumer row was created"

      - name: satisfaction_of_the_adverse_selection_gate_allows_rendering
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=6]
          - endpoints.POST_/credit/offers/{offer_id}/render
        distinguishing_aspect: "When every hard criterion matches and the program is ACTIVE the gate passes and rendering proceeds to 200, so the same endpoint that rejects when the gate fails also succeeds when it holds."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. A consumer whose hard criteria all match, with complete content facets and one outstanding consent."]
          setup_api_calls:
            - *k_clock
            - call: "POST /credit/consumers"
              payload: { full_name: "Gate Pass", email: "gatepass@x.com", state_code: "CA", bureau_pin: "7654", dti_pct: 25.0 }
              as: Consumer
              captures: { gp_id: $.data.id }
