            # Trade 2: TB offers pc + 2000 back to TA for pa (counter-trade, restores original assignment and FAAB)
            - call: "POST /trades"
              payload: { league_id: "${l_i_id}", proposing_team_id: "${tb_id}", target_team_id: "${ta_id}", players_offered: ["${pc}"], players_requested: ["${pa}"], faab_offered_cents: 2000 }
              as: TeamOwner
              as_user_id: "${tb_id}"
              captures: { tr2_id: $.data.id, tr2_v: $.data.version }
            - call: "POST /trades/${tr2_id}/accept"
              payload: { expected_trade_version: "${tr2_v}" }
              as: TeamOwner
              as_user_id: "${ta_id}"
              captures: { tr2_v2: $.data.version }
          trigger:
            - call: "POST /leagues/${l_i_id}/finalize-trade/${tr2_id}"
              payload: { expected_trade_version: "${tr2_v2}" }
              as: Commissioner
              as_user_id: "commish_16"
            - call: "GET /teams/${ta_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_16"
              captures: { ta_faab: $.data.faab_balance_cents }
            - call: "GET /teams/${tb_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_16"
              captures: { tb_faab: $.data.faab_balance_cents }
            - call: "GET /teams/${tc_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_16"
              captures: { tc_faab: $.data.faab_balance_cents }
            - call: "GET /teams/${td_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_16"
              captures: { td_faab: $.data.faab_balance_cents }
            - call: "GET /leagues/${l_i_id}"
              payload: {}
              as: Commissioner
              as_user_id: "commish_16"
              captures: { l_faab_pool: $.data.total_faab_pool_cents }
          assert:
            - "ta_faab == 5000 (forward debit of 2000 then reverse credit of 2000)."
            - "tb_faab == 5000 (forward credit then reverse debit)."
            - "tc_faab == 5000 (untouched by either trade)."
            - "td_faab == 5000 (untouched)."
            - "l_faab_pool == 20000 (conserved sum invariant — forward + compensating action together leave the named quantity unchanged)."

      - name: waiver_won_then_released_preserves_player_count_invariant
        grounds:
          - state_machines.WaiverClaim.SUBMITTED_to_WON
          - state_machines.Player.ACTIVE_to_RELEASED
          - entities.Player.fields.current_team_id
        distinguishing_aspect: |
          Conserved quantity: total Player count in the league = teams_owned_count + free_agent_count.
          A free-agent Player is claimed via waiver (team count +1, FA count -1), then immediately
          released back to free agency (team count -1, FA count +1). Sum is invariant. Different
          conserved quantity (player headcount) from instance A (FAAB cents).
        test_recipe:
          setup:
            - "League IN_SEASON; free-agent Player_fa exists; Team A has roster space; total players in league = 9 (8 drafted across 2 teams + 1 FA)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-29T00:00:00Z" }
              as: Commissioner
              as_user_id: "commish_17"
            - call: "POST /leagues"
              payload: { name: "PInv L", draft_type: "SNAKE", roster_size: 4, starter_slot_count: 1, ir_slot_count: 0, faab_budget_cents: 5000, veto_threshold: 1, keeper_limit: 0, playoff_team_count: 2, tiebreak_rule: "STANDARD" }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { l_pi_id: $.data.id, l_pi_v: $.data.version }
            - call: "POST /leagues/${l_pi_id}/teams"
              payload: { display_name: "A", division: "E" }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { ta_id: $.data.id }
            - call: "POST /leagues/${l_pi_id}/teams"
              payload: { display_name: "B", division: "E" }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { tb_id: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pa1", position: "QB", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { pa1: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pa2", position: "RB", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { pa2: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pa3", position: "WR", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { pa3: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pa4", position: "TE", nfl_team: "KC", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { pa4: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb1", position: "QB", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { pb1: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb2", position: "RB", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { pb2: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb3", position: "WR", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
              as: Commissioner
              as_user_id: "commish_17"
              captures: { pb3: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Pb4", position: "TE", nfl_team: "BUF", projected_points: 5.0, replacement_value: 2.0 }
