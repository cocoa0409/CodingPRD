      - name: allocation_at_exact_ordered_tonnage_bubbles_order_to_allocated
        claim_type: bubble_up
        grounds:
          - state_machines.CustomerOrder.transitions.IN_PRODUCTION_to_ALLOCATED
          - state_machines.RollSet.transitions.WRAPPED_to_ALLOCATED
          - calculations.order_allocation_ledger
        distinguishing_aspect: "A single 6.000-ton roll set against a 6.00-ton order hits the INCLUSIVE boundary allocated_tons == ordered_tons, so the order bubbles IN_PRODUCTION -> ALLOCATED directly (skipping PARTIALLY_ALLOCATED) with shortfall_tons == 0.000. An implementation using a strict > comparison would leave the order PARTIALLY_ALLOCATED with shortfall 0.000, which is self-contradictory."
