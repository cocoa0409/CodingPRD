      - call: POST /hub/enrollments
        payload:
          program_id: ${prog_id}
          patient_ref: PAT-PG
          diagnosis_code: C50
        as: CaseManager
      trigger:
      - call: GET /hub/enrollments?limit=0
        as: CaseManager
        captures:
          err_lo: $.data.error_id
      - call: GET /hub/enrollments?limit=101
        as: CaseManager
        captures:
          err_hi: $.data.error_id
      - call: GET /hub/enrollments?limit=100
        as: CaseManager
      assert:
      - ${err_lo} == ERR_VALIDATION and ${err_hi} == ERR_VALIDATION
      - limit=100 returns 200 with total_count == 1 and has_more == false
