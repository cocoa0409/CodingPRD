          edge is NON-strict. Two projects with identical guaranteed maximum prices and settled
          costs one cent apart therefore straddle the boundary: 24980.24 of pool rounds to
          0.0200 and earns the 0.25 tier, 24980.25 rounds to 0.0201 and earns 0.35. An
