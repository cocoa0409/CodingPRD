          - validations.priority_44_ERR_NO_ELIGIBLE_PLANTS
        distinguishing_aspect: |
          The two input-completeness guards that run before the threshold
          calculation ever executes, on the two firms that isolate them: a firm
          whose only ACTIVE plant is missing one lookback year (422), and a firm
          whose sole plant is CLOSED so the eligible set is empty (409) — the
          latter with a fully complete history, proving the eligibility filter is
          applied before the history check has anything to inspect.
        test_recipe:
          setup:
            - "Echo Meats has one ACTIVE CATTLE plant whose annual_head_history omits 2022. Foxtrot Foods has one CLOSED CATTLE plant with a complete five-year history."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Echo Meats", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
