            - "${loan_b_recv} == 2026-08-09T00:00:00Z and ${loan_b_due} == 2026-08-16T00:00:00Z — one day later the windows are disjoint and the identical call succeeds"
            - "GET /ill/loans/${loan_a_id} still shows custody_status AWAITING_PICKUP — L-A was inside the counted set for the whole instance and nothing expired it"
            - "GET /ill/requests?patron_id=${patron_id}&status=IN_TRANSIT returns total_count == 0 after the successful receipt"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancelling_a_committed_request_restores_partner_borrow_payable_without_drift
        grounds:
          - entities.Partner.fields.borrow_payable_cents
          - entities.Partner.fields.borrowed_from_count
          - entities.Partner.fields.net_borrow_imbalance_items
          - entities.IllRequest.fields.committed_fee_cents
          - state_machines.IllRequest.to_CANCELLED
          - endpoints[POST /ill/requests/{id}/cancel]
        distinguishing_aspect: |
          The conserved quantity is money owed to a lender: Partner.borrow_payable_cents. A baseline is
          established with one committed request, a second commitment moves it, and cancelling that
          second commitment must return the field to the byte-identical baseline value — no residue of
          the cancelled fee, and the item counters unwound in step with it.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z throughout."
            - "Patron P-8016 with max_open_requests 5 and max_concurrent_loans 3."
            - "Partner NORTHU listed on two LOAN rotas at different quotes: rota CHEAP quotes 1200 cents / 9 days, rota FAST quotes 2000 cents / 4 days."
            - "Two BibItems with local_holding_status NONE."
            - "Request X is taken in against rota CHEAP with needed_by 2026-08-20 (days_available 19, so landed cost is the bare 1200) and committed first, establishing the baseline."
            - "Request Y is taken in against rota FAST with needed_by 2026-08-09 (days_available 8, so landed cost is the bare 2000) and committed second."
            - "Neither commitment is shipped, so cancellation is available on both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-8016", full_name: "Pia Grad", email: "pia@u.edu", patron_type: "GRAD", department: "PHIL", max_open_requests: 5, max_concurrent_loans: 3, unpaid_balance_cap_cents: 20000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 2000, avg_turnaround_days: 4, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id, payable_0: $.data.borrow_payable_cents, count_0: $.data.borrowed_from_count }
            - call: "POST /ill/rotas"
              payload: { name: "CHEAP rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_cheap_id: $.data.id, rota_cheap_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_cheap_id}", expected_rota_version: "${rota_cheap_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 1200, quoted_turnaround_days: 9, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/rotas"
              payload: { name: "FAST rota", material_type: "LOAN", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_fast_id: $.data.id, rota_fast_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_fast_id}", expected_rota_version: "${rota_fast_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 2000, quoted_turnaround_days: 4, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Phenomenology of Perception", item_type: "BOOK", publication_year: 2009, isbn: "978-0-000-00012-7", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_x_id: $.data.id }
            - call: "POST /ill/bib-items"
              payload: { title: "Being and Nothingness", item_type: "BOOK", publication_year: 2010, isbn: "978-0-000-00013-4", local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 9000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_y_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_x_id}", rota_id: "${rota_cheap_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-20T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_x_id: $.data.id }
            - call: "POST /ill/requests/${req_x_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_x_id: $.data.id }
            - call: "POST /ill/supply-offers/${offer_x_id}/accept"
              payload: {}
              as: PartnerAgent
              as_user_id: "${northu_id}"
            - call: "GET /ill/partners/${northu_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { payable_baseline: $.data.borrow_payable_cents, count_baseline: $.data.borrowed_from_count, imbalance_baseline: $.data.net_borrow_imbalance_items }
          trigger:
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_y_id}", rota_id: "${rota_fast_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_y_id: $.data.id }
            - call: "POST /ill/requests/${req_y_id}/source"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { offer_y_id: $.data.id }
            - call: "POST /ill/supply-offers/${offer_y_id}/accept"
              payload: {}
              as: PartnerAgent
              as_user_id: "${northu_id}"
              captures: { offer_y_status: $.data.status }
            - call: "GET /ill/partners/${northu_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { payable_peak: $.data.borrow_payable_cents, count_peak: $.data.borrowed_from_count, imbalance_peak: $.data.net_borrow_imbalance_items }
            - call: "POST /ill/requests/${req_y_id}/cancel"
              payload: {}
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
              captures: { req_y_status: $.data.status, req_y_fee: $.data.committed_fee_cents, req_y_net: $.data.net_patron_charge_cents }
            - call: "GET /ill/partners/${northu_id}"
              payload: {}
              as: ConsortiumAccountant
              as_user_id: "acct-01"
              captures: { payable_after: $.data.borrow_payable_cents, count_after: $.data.borrowed_from_count, imbalance_after: $.data.net_borrow_imbalance_items }
          assert:
            - "${payable_0} == 0 and ${count_0} == 0 — a freshly created Partner owes nothing"
            - "${payable_baseline} == 1200 and ${count_baseline} == 1 and ${imbalance_baseline} == 1"
            - "${offer_y_status} == ACCEPTED and ${payable_peak} == 3200 and ${count_peak} == 2 and ${imbalance_peak} == 2"
            - "${payable_after} == ${payable_baseline} == 1200 — the conserved quantity returns to exactly its pre-commitment value, not 3200 and not 2000"
            - "${count_after} == 1 and ${imbalance_after} == 1 — the item counters unwind in step with the money"
            - "${req_y_status} == CANCELLED, ${req_y_fee} == 0 and ${req_y_net} == 0, with committed_partner_id null and rush_surcharge_cents, royalty_cents, gross_charge_cents and subsidy_cents all 0"
            - "GET /ill/supply-offers/${offer_y_id} still shows status ACCEPTED — only OFFERED offers are cascaded to CANCELLED, so an already-accepted offer keeps its terminal-side record"
            - "Patron.${patron_id}.open_request_count == 1 and Patron.${patron_id}.pending_charge_cents equals the net charge of request X alone"
            - "IllRequest.${req_x_id}.committed_fee_cents == 1200 — the surviving commitment is untouched by the neighbour's cancellation"

      - name: cancelling_an_article_request_returns_its_contu_free_fill_to_the_journal_pool
        grounds:
          - calculations.copyright_rule_of_five_counter
          - entities.CopyrightClearance.fields.status
          - entities.CopyrightClearance.fields.sequence_in_year
          - endpoints[GET /ill/copyright-usage]
          - endpoints[POST /ill/requests/{id}/cancel]
        distinguishing_aspect: |
          A different conserved quantity from the payable instance: a regulatory allowance rather than
          money. The five free fills for one (issn, calendar_year) form a pool that a cancellation must
          hand back — voiding the fifth clearance drops counted_fill_count from 5 to 4 and lets a
          later request take the freed slot with sequence_in_year 5 again, with no double-issue and no
          silent leak of the returned fill.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, so current_year is 2026 and publication_year 2024 counts."
            - "Patron P-8017 with max_open_requests 10 so the request cap never fires."
            - "Partner NORTHU with supplies_electronic true on a COPY rota quoted 1500 cents / 2 days."
            - "One ARTICLE BibItem with issn 4321-8765 and publication_year 2024."
            - "Six COPY requests taken in for that article, each pages_requested 12 and delivery_mode ELECTRONIC: requests 1 through 5 receive CONTU_FREE clearances numbered 1 through 5 and sit in SOURCING; request 6 receives no clearance and parks in COPYRIGHT_HOLD."
            - "None of the requests is sourced, so cancellation touches only the copyright dimension and no partner money."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/patrons"
              payload: { external_id: "P-8017", full_name: "Quinn Faculty", email: "quinn@u.edu", patron_type: "FACULTY", department: "PHYS", max_open_requests: 10, max_concurrent_loans: 3, unpaid_balance_cap_cents: 20000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { patron_id: $.data.id }
            - call: "POST /ill/partners"
              payload: { code: "NORTHU", name: "North University Library", consortium_code: "MIDWEST", base_lending_fee_cents: 1500, avg_turnaround_days: 2, ships_physical: true, supplies_electronic: true, allows_renewals: true, loan_period_days: 28, max_renewals: 2 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { northu_id: $.data.id }
            - call: "POST /ill/rotas"
              payload: { name: "Article supply rota", material_type: "COPY", selection_policy: "LANDED_COST", max_attempts: 3, auto_escalate_pod: false, offer_response_hours: 48 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { rota_id: $.data.id, rota_v0: $.data.version }
            - call: "POST /ill/rota-entries"
              payload: { rota_id: "${rota_id}", expected_rota_version: "${rota_v0}", partner_id: "${northu_id}", manual_rank: 1, quoted_fee_cents: 1500, quoted_turnaround_days: 2, is_enabled: true }
              as: LibraryAdmin
              as_user_id: "admin-01"
            - call: "POST /ill/bib-items"
              payload: { title: "Superfluid helium transport", item_type: "ARTICLE", issn: "4321-8765", journal_title: "Low Temperature Physics Letters", publication_year: 2024, local_holding_status: "NONE", licensed_access_status: "NONE", list_price_cents: 4000 }
              as: LibraryAdmin
              as_user_id: "admin-01"
              captures: { bib_art_id: $.data.id }
            - call: "POST /ill/requests"
              payload: { patron_id: "${patron_id}", bib_item_id: "${bib_art_id}", rota_id: "${rota_id}", service_type: "COPY", delivery_mode: "ELECTRONIC", needed_by: "2026-08-20T00:00:00Z", max_supply_fee_cents: 5000, pages_requested: 12 }
              as: IllBorrowingStaff
              as_user_id: "ill-staff-01"
