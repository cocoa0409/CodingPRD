            - "after setup: swept_period_count == 1 and ValueReport.${dq_rpt}.status == DELINQUENT"
            - "after setup: Policy.${pol}.status == SUSPENDED and cancellation_reason is null"
            - "after setup: Claim.${clm}.underreporting_factor_bp == 10000 (no ACCEPTED or PENALIZED report covers the loss date)"
            - "after setup: Claim.${clm}.adjustment_status == REPAIR_APPROVED and settlement_amount_cents == 2900000"
            - "trigger[0] HTTP status == 409"
            - "trigger[0] response error_id == ERR_REPORTING_DELINQUENT"
            - "after trigger[0]: Claim.${clm}.adjustment_status == REPAIR_APPROVED (unchanged) and settlement_paid_cents == 0"
            - "after trigger[2]: ValueReport.${dq_rpt}.status == SUPERSEDED and superseded_by_report_id == ${late_rpt}"
            - "after trigger[2]: Policy.${pol}.status == IN_FORCE"
            - "after trigger[3]: ValueReport.${late_rpt}.status == PENALIZED with period_earned_premium_cents 19110 and late_penalty_cents 1911"
            - "after trigger[3]: Claim.${clm}.adjustment_status == CLOSED and settlement_paid_cents == 2900000"
            - "after trigger[3]: CoveragePart.${cp}.aggregate_available_cents == 197100000 and aggregate_paid_net_cents == 2900000"
            - "after trigger[3]: Policy.${pol}.incurred_loss_cents == 2900000 and premium_balance_cents == 201272 (180251 bound written premium + 19110 reporting adjustment + 1911 late penalty)"
            - "the settle call in trigger[3] is byte-identical to the one in trigger[0]; only the state of a sibling ValueReport changed"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: jobsite_floater_closed_interval_adjacency_collides
        grounds:
          - validations[priority=63]
          - errors[ERR_JOBSITE_FLOATER_OVERLAP]
          - calculations.installation_floater_premium
          - entities.InstallationFloater.fields.coverage_start_date
          - entities.Jobsite.fields.active_floater_count
        distinguishing_aspect: |
          The jobsite occupancy interval is CLOSED on both ends, so a second
          floater starting on 2026-12-01 - the exact end date of the first -
          collides with ERR_JOBSITE_FLOATER_OVERLAP 409, while starting one day
          later on 2026-12-02 is accepted with term_days 91 and
          rated_premium_cents 52356; a half-open implementation would admit the
          touching pair.
        test_recipe:
          setup:
            - "One Jobsite J1, T2_URBAN, surveyed with fenced true, lighting true, alarm_monitored true, guarded_24h false, so security_score 3 and security_tier TIER_2, status SURVEYED."
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE INSTALLATION_FLOATER CoveragePart: ACV, aggregate_limit_cents 200000000."
            - "One PENDING InstallationFloater F1 on J1: 2026-09-01 to 2026-12-01, installed_value_limit_cents 20000000, term_days 92, rated_premium_cents 70575."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/jobsites"
              payload: { name: "Harbor Terminal J1", territory_code: "T2_URBAN" }
              as: Underwriter
              captures: { js1: $.data.id }
            - call: "POST /inland-marine/jobsites/${js1}/security-survey"
              payload: { fenced: true, lighting: true, alarm_monitored: true, guarded_24h: false }
              as: Underwriter
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Harborworks Installers", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "INSTALLATION_FLOATER", valuation_basis: "ACV", aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/coverage-parts/${cp}/installation-floaters"
              payload: { jobsite_id: "${js1}", project_name: "Berth 4 conveyor", installed_value_limit_cents: 20000000, coverage_start_date: "2026-09-01", coverage_end_date: "2026-12-01" }
              as: Underwriter
              captures: { flt_1: $.data.id }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/installation-floaters"
              payload: { jobsite_id: "${js1}", project_name: "Berth 4 gantry - touching", installed_value_limit_cents: 15000000, coverage_start_date: "2026-12-01", coverage_end_date: "2027-03-01" }
              as: Underwriter
              captures: { err: $.data.error_id }
            - call: "POST /inland-marine/coverage-parts/${cp}/installation-floaters"
              payload: { jobsite_id: "${js1}", project_name: "Berth 4 gantry - adjacent", installed_value_limit_cents: 15000000, coverage_start_date: "2026-12-02", coverage_end_date: "2027-03-02" }
              as: Underwriter
              captures: { flt_2: $.data.id }
          assert:
            - "after setup: Jobsite.${js1}.security_score == 3 and security_tier == TIER_2 and status == SURVEYED"
            - "after setup: InstallationFloater.${flt_1}.status == PENDING and term_days == 92 and rated_premium_cents == 70575"
            - "trigger[0] HTTP status == 409"
            - "trigger[0] response error_id == ERR_JOBSITE_FLOATER_OVERLAP"
            - "after trigger[0]: GET /inland-marine/installation-floaters?jobsite_id=${js1} returns total_count == 1"
            - "trigger[1] HTTP status == 201"
            - "after trigger[1]: InstallationFloater.${flt_2}.term_days == 91"
            - "after trigger[1]: InstallationFloater.${flt_2}.rated_premium_cents == 52356"
            - "after trigger[1]: InstallationFloater.${flt_2}.status == PENDING and termination_trigger is null"
            - "after trigger[1]: Jobsite.${js1}.active_floater_count == 0 (creation alone does not occupy the jobsite; only activation does)"
            - "the rejected and accepted payloads differ only in the two dates being shifted one day later"

      - name: vehicle_transit_half_open_window_with_turnaround_buffer
        grounds:
          - validations[priority=64]
          - errors[ERR_VEHICLE_WINDOW_CONFLICT]
          - calculations.transit_applicable_limit
          - entities.TransitShipment.fields.departure_at
        distinguishing_aspect: |
          The conveyance booking window is HALF-OPEN on the instant axis but
          extended by a 4-hour trailing turnaround buffer, so a first leg running
          08:00Z to 18:00Z blocks any departure before 22:00Z: 21:59Z is rejected
          with ERR_VEHICLE_WINDOW_CONFLICT 409 while 22:00Z - exactly the buffered
          edge - is accepted, which no unbuffered or fully closed comparison
          reproduces.
        test_recipe:
          setup:
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE TRANSIT CoveragePart: ACV, transit_owned_limit_cents 10000000, transit_hired_limit_cents 0, catastrophe_limit_cents 5000000, aggregate_limit_cents 200000000."
            - "One APPROVED OWNED Vehicle, per_conveyance_limit_cents 5000000, approval_expires_on 2026-12-31."
            - "One PLANNED TransitShipment S1 on that vehicle: T2_URBAN to T3_INLAND, departure_at 2026-08-05T08:00:00Z, arrival_at 2026-08-05T18:00:00Z, declared_value_cents 1000000, so its buffered window closes at 2026-08-05T22:00:00Z."
            - "Logical clock at 2026-08-04T00:00:00Z."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 10000000, transit_hired_limit_cents: 0, catastrophe_limit_cents: 5000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/vehicles"
              payload: { unit_label: "OWNED-12", ownership: "OWNED", per_conveyance_limit_cents: 5000000, approval_expires_on: "2026-12-31" }
              as: Underwriter
              captures: { veh: $.data.id }
            - call: "POST /inland-marine/vehicles/${veh}/approve"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T2_URBAN", destination_territory_code: "T3_INLAND", departure_at: "2026-08-05T08:00:00Z", arrival_at: "2026-08-05T18:00:00Z", declared_value_cents: 1000000 }
              as: Underwriter
              captures: { shp_1: $.data.id }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T3_INLAND", destination_territory_code: "T2_URBAN", departure_at: "2026-08-05T21:59:00Z", arrival_at: "2026-08-06T04:00:00Z", declared_value_cents: 1000000 }
              as: Underwriter
              captures: { err: $.data.error_id }
            - call: "POST /inland-marine/coverage-parts/${cp}/transit-shipments"
              payload: { vehicle_id: "${veh}", origin_territory_code: "T3_INLAND", destination_territory_code: "T2_URBAN", departure_at: "2026-08-05T22:00:00Z", arrival_at: "2026-08-06T04:00:00Z", declared_value_cents: 1000000 }
              as: Underwriter
              captures: { shp_2: $.data.id }
          assert:
            - "after setup: TransitShipment.${shp_1}.catastrophe_zone == false and applicable_limit_cents == 10000000"
            - "trigger[0] HTTP status == 409"
            - "trigger[0] response error_id == ERR_VEHICLE_WINDOW_CONFLICT"
            - "after trigger[0]: GET /inland-marine/transit-shipments?vehicle_id=${veh} returns total_count == 1"
            - "trigger[1] HTTP status == 201"
            - "after trigger[1]: TransitShipment.${shp_2}.status == PLANNED and departure_at == 2026-08-05T22:00:00Z"
            - "after trigger[1]: TransitShipment.${shp_2}.applicable_limit_cents == 10000000"
            - "after trigger[1]: GET /inland-marine/transit-shipments?vehicle_id=${veh} returns total_count == 2"
            - "the two payloads differ by 60 seconds of departure_at and nothing else"
            - "the accepted pair still satisfies priority 65: both shipments depart on 2026-08-05 for a combined 2000000 against the 5000000 per_conveyance_limit_cents"

      - name: vehicle_daily_declared_value_capacity_is_calendar_bucket_not_window
        grounds:
          - validations[priority=65]
          - validations[priority=64]
          - errors[ERR_VEHICLE_CAPACITY_EXCEEDED]
          - entities.Vehicle.fields.per_conveyance_limit_cents
        distinguishing_aspect: |
          Daily conveyance capacity is bucketed by the UTC calendar date of
