              payload: { action: "START_COORDINATION" }
              as: PavementEngineer
            - call: "GET /pavement/utility-coordinations"
              payload: { project_id: "${p1}" }
              as: UtilityCoordinator
              captures: { u0: "$.data[0].id", u1: "$.data[1].id", u2: "$.data[2].id", u3: "$.data[3].id" }
            - call: "POST /pavement/utility-coordinations/${u0}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/utility-coordinations/${u1}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/utility-coordinations/${u2}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
            - call: "POST /pavement/utility-coordinations/${u3}/respond"
              payload: { response: "CLEAR", response_note: "no conflict with the paving window" }
              as: UtilityCoordinator
