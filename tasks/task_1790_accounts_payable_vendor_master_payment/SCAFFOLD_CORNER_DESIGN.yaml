              as: Auditor
              as_user_id: "u-aud-01"
              captures: { err: $.data.error_id }
          assert:
            - "GET /audit-events as Auditor: 200 with the CREATE row for ${v_id}"
            - "POST /vendors as Auditor: ERR_FORBIDDEN_FOR_ROLE (403)"

      - name: tier_role_mismatch_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=2]", "calculations.invoice_approval_routing", "errors[ERR_FORBIDDEN_FOR_ROLE]"]
        distinguishing_aspect: "The tier-to-role map is enforced inside the endpoint: APManager (a valid approver role) naming tier 1 is refused because TIER_ROLE[1] == APSupervisor."
        test_recipe:
          setup: ["GLOBAL [0,500000) t1; ACTIVE vendor; invoice submitted"]
          setup_api_calls:
