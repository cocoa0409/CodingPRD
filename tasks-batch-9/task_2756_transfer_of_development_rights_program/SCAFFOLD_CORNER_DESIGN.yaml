              as: ProgramAdministrator
              captures: { ev2: $.data.id }
            - call: "POST /tdr/evaluations"
              payload: { period_start: "2027-01-01T00:00:00Z", period_end: "2027-12-31T00:00:00Z", equity_weighting: "ACREAGE_WEIGHTED" }
              as: ProgramAdministrator
              captures: { ev3: $.data.id }
          assert:
            - "the first evaluation returns 201 with status COMPUTED, preserved_acres == 0.00, easement_count == 0, issued_units == 0, redeemed_units == 0, retired_units == 0, outstanding_units == 0"
            - "ProgramEvaluation.${ev1}.absorption_pct == 0.00 and equity_index == 0.00 — both denominators are zero and both report zero instead of raising"
            - "ProgramEvaluation.${ev1}.total_cash_cents == 0"
            - "the [2026-06-01, 2027-06-01] evaluation returns 409 ERR_EVALUATION_PERIOD_OVERLAP and creates no row"
            - "the identical [2026-01-01, 2026-12-31] evaluation returns 201 and ProgramEvaluation.${ev1}.status becomes SUPERSEDED while ${ev2}.status == COMPUTED"
            - "ProgramEvaluation.${ev2}.equity_index == 0.00 under PARCEL_COUNT_WEIGHTED as well"
            - "the disjoint [2027-01-01, 2027-12-31] evaluation returns 201 with status COMPUTED and leaves ${ev2} COMPUTED — non-overlapping periods coexist"
            - "GET /tdr/evaluations?status=COMPUTED returns total_count 2 (${ev2} and ${ev3})"

      - name: receiving_side_intake_and_finalization_guards_each_report_their_own_code
        claim_type: violation_to_error
        grounds:
          - validations.priority_27_ERR_RECEIVING_AREA_NOT_ACTIVE
          - validations.priority_40_ERR_BACKING_INSUFFICIENT
          - calculations.receiving_bonus_units
          - errors.ERR_RECEIVING_AREA_NOT_ACTIVE
          - errors.ERR_BACKING_INSUFFICIENT
        distinguishing_aspect: "A DRAFT receiving area accepts no filings at all (409 at priority 27), while an ACTIVE one accepts the filing and defers the backing test to finalization (409 at priority 40) — an unbacked application sits legitimately in DESIGN_APPROVED and only fails when it tries to finalize, with required_backing_units 2 derived from the 0.75 small-site tier factor."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one DEVELOPER party"
            - "ACTIVE RA-CORE (base_density 4.0, max_bonus_pct 0.35, absorption_cap 500, design_review_required false)"
            - "RA-SOUTH created with the same parameters but left in DRAFT"
            - "a 2.50-acre application on RA-CORE requesting 20 bonus units -> base 10, max 2, required 2, provisional 1, status DESIGN_APPROVED with no redemptions"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /tdr/receiving-areas"
              payload: { code: "RA-CORE", name: "Core District", neighborhood_code: "NB-CORE", base_density_units_per_acre: 4.0, max_bonus_pct: 0.35, absorption_cap_units: 500, design_review_required: false }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id }
            - call: "POST /tdr/receiving-areas/${ra_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/receiving-areas"
              payload: { code: "RA-SOUTH", name: "South District", neighborhood_code: "NB-SOUTH", base_density_units_per_acre: 4.0, max_bonus_pct: 0.35, absorption_cap_units: 500, design_review_required: false }
              as: ProgramAdministrator
              captures: { draft_ra: $.data.id }
            - call: "POST /tdr/receiving-site-applications"
              payload: { developer_party_id: "${dev_id}", receiving_area_id: "${ra_id}", site_acres: 2.50, requested_bonus_units: 20 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { rsa_id: $.data.id }
          trigger:
            - call: "POST /tdr/receiving-site-applications"
              payload: { developer_party_id: "${dev_id}", receiving_area_id: "${draft_ra}", site_acres: 2.50, requested_bonus_units: 20 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /tdr/receiving-site-applications/${rsa_id}/finalize"
              payload: { finalization_note: "attempting to finalize with no backing" }
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "the filing against the DRAFT area returns 409 ERR_RECEIVING_AREA_NOT_ACTIVE and creates no ReceivingSiteApplication row"
            - "ReceivingSiteApplication.${rsa_id}.status == DESIGN_APPROVED with base_units == 10, max_bonus_units == 2, required_backing_units == 2, provisional_bonus_units == 1"
            - "ReceivingSiteApplication.${rsa_id}.backed_units == 0 and pending_backed_units == 0"
            - "the finalize returns 409 ERR_BACKING_INSUFFICIENT, not ERR_EASEMENT_NONCOMPLIANT — there are no redemptions for priority 25 to inspect"
            - "ReceivingSiteApplication.${rsa_id}.status is still DESIGN_APPROVED (the refusal does not push it to BACKING_DEFICIENT), finalized_at == null, allocated_bonus_units == 0"
            - "ReceivingArea.${ra_id}.absorbed_units == 0, reserved_units == 0, and status == ACTIVE"
            - "GET /tdr/receiving-site-applications?receiving_area_id=${draft_ra} returns total_count 0"

      - name: a_resubmitted_design_above_the_bonus_ceiling_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_37_ERR_BONUS_EXCEEDS_MAX
          - state_machines.ReceivingSiteApplication.REVISIONS_REQUIRED_to_DESIGN_REVIEW
          - calculations.receiving_bonus_units
          - errors.ERR_BONUS_EXCEEDS_MAX
        distinguishing_aspect: "The bonus ceiling is enforced only on resubmission: intake accepts a 10-unit request under a 16-unit ceiling, and after REQUIRE_REVISIONS a restated request of 17 is refused with 422 ERR_BONUS_EXCEEDS_MAX while 16 — exactly the ceiling — is accepted, because the check is `requested <= max_bonus_units`."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; one DEVELOPER party"
            - "ACTIVE RA-REVIEW (base_density 4.0, max_bonus_pct 0.35, absorption_cap 500, design_review_required true)"
            - "a 12.00-acre application requesting 10 bonus units -> base 48, max 16, required 10, provisional 8, status DESIGN_REVIEW"
            - "the design review board returns it for revisions, so it sits in REVISIONS_REQUIRED at design_review_round 0"
          setup_api_calls:
            - call: "POST /tdr/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /tdr/parties"
              payload: { kind: "DEVELOPER", legal_name: "Core Block Partners", contact_email: "core@example.org", neighborhood_code: "NB-CORE" }
              as: ProgramAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /tdr/receiving-areas"
              payload: { code: "RA-REVIEW", name: "Review District", neighborhood_code: "NB-CORE", base_density_units_per_acre: 4.0, max_bonus_pct: 0.35, absorption_cap_units: 500, design_review_required: true }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id }
            - call: "POST /tdr/receiving-areas/${ra_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /tdr/receiving-site-applications"
              payload: { developer_party_id: "${dev_id}", receiving_area_id: "${ra_id}", site_acres: 12.00, requested_bonus_units: 10 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { rsa_id: $.data.id }
            - call: "POST /tdr/receiving-site-applications/${rsa_id}/design-review-decision"
              payload: { decision: "REQUIRE_REVISIONS", review_note: "massing and setbacks" }
              as: DesignReviewBoard
              as_user_id: "drb-1"
          trigger:
            - call: "POST /tdr/receiving-site-applications/${rsa_id}/resubmit-design"
              payload: { requested_bonus_units: 17, revision_note: "asking for one more than the ceiling" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /tdr/receiving-site-applications/${rsa_id}/resubmit-design"
              payload: { requested_bonus_units: 16, revision_note: "restated to the ceiling" }
              as: Developer
              as_user_id: "${dev_id}"
          assert:
            - "at intake ReceivingSiteApplication.${rsa_id}.status == DESIGN_REVIEW with base_units == 48, max_bonus_units == 16, required_backing_units == 10, provisional_bonus_units == 8"
            - "after REQUIRE_REVISIONS the status is REVISIONS_REQUIRED with design_review_round == 0"
            - "the 17-unit resubmission returns 422 ERR_BONUS_EXCEEDS_MAX (17 > 16) and leaves the status REVISIONS_REQUIRED with design_review_round == 0 and requested_bonus_units == 10"
            - "the 16-unit resubmission returns 200, moves the status to DESIGN_REVIEW, and sets design_review_round == 1"
            - "after the accepted resubmission required_backing_units == 16 and provisional_bonus_units == 8 (floor(16 * 0.5)), while max_bonus_units is unchanged at 16"

      - name: finalization_and_redemption_guards_on_a_partly_frozen_backing_pool
        claim_type: violation_to_error
        grounds:
          - validations.priority_25_ERR_EASEMENT_NONCOMPLIANT
          - validations.priority_28_ERR_SENDING_RECEIVING_PAIR_NOT_ELIGIBLE
          - validations.priority_17_ERR_REDEMPTION_NOT_RELEASABLE
          - calculations.violation_severity_score
          - calculations.easement_restriction_extent
        distinguishing_aspect: "An over-collateralized application (3 units allocated against a required 2) survives the freeze of ONE source easement — its status stays DESIGN_APPROVED because the surviving ALLOCATED backing still meets the requirement — yet finalization is still refused with 409 ERR_EASEMENT_NONCOMPLIANT, because priority 25 inspects HELD_PENDING_COMPLIANCE redemptions too. The same setup also proves the pairing rule (a SA-EAST certificate cannot back a receiving area whose eligible list names only SA-WEST) and the release idempotency guard."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z"
            - "LANDOWNER, DEVELOPER (credited 6000000), MUNICIPAL_BANK parties; NB-EAST appraisal schedule 1234567 / 250 bps -> per-unit base 1265431"
