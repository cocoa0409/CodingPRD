  # ===========================================================================
  - section: rbac
    instances:

      - name: corner_missing_actor_header_is_unauthenticated_everywhere_but_the_clock
        claim_type: exclusive_operation_denied
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority 1]", "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "Authentication is checked before existence, so an absent actor header beats even a nonsense path id; the clock endpoint is the single documented exception."
        test_recipe:
          setup: ["Only the clock is set — deliberately, to prove the clock endpoint itself needs no actor."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" }, captures: { t0: "$.data.current_utc" } }
          trigger:
            - { call: "GET /complaints", as: CareAgent, payload: {}, captures: { e1: "$.data.error_id" } }
            - { call: "GET /complaints/00000000-0000-0000-0000-0000000000ff", as: CareAgent, payload: {}, captures: { e2: "$.data.error_id" } }
            - { call: "POST /consumers", as: CareAgent, payload: { external_ref: "C-NOAUTH", full_name: "No Auth" }, captures: { e3: "$.data.error_id" } }
            - { call: "GET /staff-users", as: SystemAdmin, payload: {}, captures: { e4: "$.data.error_id" } }
          assert:
            - "each of the four calls is issued with NO X-User-ID header at all — that is the point of the instance"
            - "all four return HTTP 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "the second call proves priority 1 outranks priority 4: a non-existent complaint id still yields ERR_UNAUTHENTICATED rather than ERR_COMPLAINT_NOT_FOUND"
            - "the third proves priority 1 outranks priority 7: the missing-required-field check is never reached, even though external_ref alone would not satisfy the body"
            - "the fourth shows the SystemAdmin surface is no exception; only POST /_clock/set_current_utc succeeded without a header"

      - name: corner_unknown_and_deactivated_actors_are_both_rejected
        claim_type: exclusive_operation_denied
        grounds: ["errors[ERR_UNKNOWN_ACTOR]", "validations[priority 2]", entities.StaffUser.is_active]
        distinguishing_aspect: "Priority 2 covers two distinct failures behind one code — an id that resolves to nothing and an id that resolves to a deactivated staff row — and both outrank the role check that would otherwise apply."
        test_recipe:
          setup: ["One active CareAgent, one CareSupervisor created with is_active false, and one consumer id to use as a wrong-entity actor."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUPX", full_name: "Sid Gone", role: CARE_SUPERVISOR, authority_tier: TIER_3, is_active: false }, captures: { supx: "$.data.id", act: "$.data.is_active" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "GET /complaints", as: CareAgent, as_user_id: "00000000-0000-0000-0000-0000000000aa", payload: {}, captures: { e1: "$.data.error_id" } }
            - { call: "GET /complaints", as: CareSupervisor, as_user_id: "${supx}", payload: {}, captures: { e2: "$.data.error_id" } }
            - { call: "POST /trend-signals", as: CareSupervisor, as_user_id: "${supx}", payload: { scope_level: PLANT, plant_id: "${c1}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }, captures: { e3: "$.data.error_id" } }
            - { call: "GET /staff-users", as: SystemAdmin, payload: { is_active: false }, captures: { tc: "$.total_count" } }
          assert:
            - "the unresolvable id returns HTTP 401 with data.error_id == \"ERR_UNKNOWN_ACTOR\""
            - "the deactivated supervisor also returns HTTP 401 \"ERR_UNKNOWN_ACTOR\" even on an endpoint her role is authorised for — is_active false revokes the identity, it does not merely narrow it"
            - "the third call would otherwise fail the role check (priority 3), the plant existence check (priority 5) and the scope-shape check (priority 41); priority 2 outranks all of them, so the answer is still \"ERR_UNKNOWN_ACTOR\""
            - "GET /staff-users?is_active=false has total_count == 1, confirming the deactivated row still exists and is merely unusable as an actor"

      - name: corner_role_exclusive_operations_are_refused_to_every_peer
        claim_type: exclusive_operation_denied
        grounds: [roles, "errors[ERR_UNAUTHORIZED]", "validations[priority 3]"]
        distinguishing_aspect: "One exclusive operation is probed per role by a peer who is a plausible but wrong owner, and each refusal is HTTP 403 before any state or body rule is consulted."
        test_recipe:
          setup: ["One active user in each of the four staff roles, plus a triaged complaint with a DRAFT remedy so the wrong-role decide attempt has a real target."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", as: SystemAdmin, payload: { current_utc: "2026-08-01T00:00:00Z" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "AG1", full_name: "Ada Grant", role: CARE_AGENT }, captures: { ag1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "SUP1", full_name: "Sam Ruiz", role: CARE_SUPERVISOR, authority_tier: TIER_3 }, captures: { sup1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "QL1", full_name: "Quinn Li", role: QUALITY_LEAD, authority_tier: TIER_3 }, captures: { ql1: "$.data.id" } }
            - { call: "POST /staff-users", as: SystemAdmin, payload: { staff_code: "RO1", full_name: "Rae Ohm", role: REGULATORY_OFFICER, authority_tier: TIER_3 }, captures: { ro1: "$.data.id" } }
            - { call: "POST /consumers", as: CareAgent, as_user_id: "${ag1}", payload: { external_ref: "C-1", full_name: "Rin Sato", postal_code: "60601" }, captures: { c1: "$.data.id" } }
            - { call: "POST /plants", as: SystemAdmin, payload: { plant_code: "P-CHI", name: "Chicago Bakery", region: MW }, captures: { pl1: "$.data.id" } }
            - { call: "POST /production-lines", as: SystemAdmin, payload: { plant_id: "${pl1}", line_code: "L-01", nominal_units_per_hour: 12000 }, captures: { ln1: "$.data.id" } }
            - { call: "POST /products", as: SystemAdmin, payload: { sku: "SKU-CRACKER", name: "Sea Salt Crackers", category: SNACK, is_regulated_food: true, unit_retail_price_cents: 2500, units_per_case: 12 }, captures: { pr1: "$.data.id" } }
            - { call: "POST /production-lots", as: SystemAdmin, payload: { product_id: "${pr1}", production_line_id: "${ln1}", batch_code: "A1B-2026-0710", code_date: "2026-07-10T00:00:00Z", units_produced: 200000 }, captures: { lot1: "$.data.id" } }
            - { call: "POST /contacts", as: CareAgent, as_user_id: "${ag1}", payload: { consumer_id: "${c1}", channel: PHONE, received_at: "2026-08-01T00:00:00Z", raw_message: "Stale pack." }, captures: { ct1: "$.data.id" } }
            - { call: "POST /complaints", as: CareAgent, as_user_id: "${ag1}", payload: { contact_id: "${ct1}", complaint_type: QUALITY, reported_batch_code: "A1B20260710" }, captures: { cp1: "$.data.id" } }
            - { call: "POST /complaints/${cp1}/triage", as: CareSupervisor, as_user_id: "${sup1}", payload: { reviewer_note: "Mild." }, captures: { cv: "$.data.version" } }
            - { call: "POST /remedies", as: CareAgent, as_user_id: "${ag1}", payload: { complaint_id: "${cp1}", remedy_type: COUPON, requested_value_cents: 1200, expected_complaint_version: "${cv}" }, captures: { rm: "$.data.id" } }
          trigger:
            - { call: "POST /complaints/${cp1}/quality-hold", as: CareAgent, as_user_id: "${ag1}", payload: { reason: "Not my call." }, captures: { e1: "$.data.error_id" } }
            - { call: "POST /quality-ops-runs", as: CareAgent, as_user_id: "${ag1}", payload: { dry_run: true }, captures: { e2: "$.data.error_id" } }
            - { call: "POST /remedies/${rm}/decide", as: RegulatoryOfficer, as_user_id: "${ro1}", payload: { decision: APPROVE }, captures: { e3: "$.data.error_id" } }
            - { call: "POST /response-templates", as: QualityLead, as_user_id: "${ql1}", payload: { template_code: "T-NO", title: "Nope", body: "Nope.", applies_to_type: ANY, max_band_allowed: S2 }, captures: { e4: "$.data.error_id" } }
            - { call: "POST /trend-signals", as: CareSupervisor, as_user_id: "${sup1}", payload: { scope_level: PLANT, plant_id: "${pl1}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-08-01T00:00:00Z" }, captures: { e5: "$.data.error_id" } }
            - { call: "POST /plants", as: CareSupervisor, as_user_id: "${sup1}", payload: { plant_code: "P-NEW", name: "Rogue Plant", region: MW }, captures: { e6: "$.data.error_id" } }
            - { call: "POST /regulatory-reports", as: QualityLead, as_user_id: "${ql1}", payload: { complaint_id: "${cp1}", report_kind: ADVERSE_EVENT }, captures: { e7: "$.data.error_id" } }
          assert:
            - "all seven attempts return HTTP 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "the decide attempt by a RegulatoryOfficer proves priority 3 outranks priority 18: the remedy is DRAFT, yet the answer is the role error, not ERR_REMEDY_STATE_INVALID"
