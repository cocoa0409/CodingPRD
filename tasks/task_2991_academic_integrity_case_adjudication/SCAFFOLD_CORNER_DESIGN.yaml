        excluded_because:
          difficulty_instance: compensating_invariant / student_points_and_department_open_case_count_return_to_their_pre_operation_values
          rationale: "The undo-restores-everything claim (points and open_case_count return to their pre-operation values with no drift and no double decrement) is the named §1.8 instance."

      - name: report_submit_guarded_by_reporter_training_corner_stub
        claim_type: guarded transitions
        grounds:
