            - "One trust with a 40,000,000.00 original controlling class balance so control_status stays CONTROLLING and every consultation is issued with rights_type CONSENT_RIGHT (only a CONSENT_RIGHT objection can move the plan to OBJECTED)."
            - "One loan transferred to special servicing; one workout plan with a single MODIFICATION alternative."
            - "Three complete objection laps are driven in setup, then a fourth objection is obtained so the trigger is the fourth OBJECTED -> DRAFT attempt."
            - "Logical clock at the default 2026-08-01T00:00:00Z for the whole scenario, well inside every consultation deadline."
