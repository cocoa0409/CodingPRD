scaffold_corner_design:
  # =================================================================
  - section: entities
    instances:
      - name: create_vendor_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Vendor.fields.status]
        distinguishing_aspect: "POST /vendors with name+vendor_type returns 201, status defaults ACTIVE, and system fields id/created_at/version are present."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { name: "Zed Telecom", vendor_type: "TELECOM" }
              as: Sourcing
              captures: { v_status: $.data.status, v_ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "v_status == ACTIVE"
            - "v_ver == 1"

      - name: get_nonexistent_vendor_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_VENDOR_NOT_FOUND]"]
        distinguishing_aspect: "GET /vendors/{id} for an unknown UUID returns ERR_VENDOR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vendors/00000000-0000-4000-8000-000000000000"
              as: Sourcing
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VENDOR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_service_missing_unit_rate_returns_validation
        claim_type: Required Fields
        grounds: ["entities.Service.fields.unit_rate_cents", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /services without unit_rate_cents returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A vendor + contract exist."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", contracted_quantity: 60 }
              as: Sourcing
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: create_contract_default_renewal_term_months
        claim_type: Defaults
        grounds: [entities.Contract.fields.renewal_term_months]
        distinguishing_aspect: "Omitting renewal_term_months on contract create applies default 12."
        test_recipe:
          setup: ["A vendor exists."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { rt: $.data.renewal_term_months }
          assert:
            - "rt == 12"

      - name: service_utilization_computed_on_create
        claim_type: Computed Fields
        grounds: [calculations.service_utilization, entities.Service.fields.utilization_pct]
        distinguishing_aspect: "utilization_pct is computed at create: active_quantity 30 / contracted_quantity 60 -> 50.00."
        test_recipe:
          setup: ["A vendor + contract exist."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 30 }
              as: Sourcing
              captures: { util: $.data.utilization_pct }
          assert:
            - "util == 50.00"

      - name: create_vendor_invalid_type_returns_validation
        claim_type: Type Constraints
        grounds: ["entities.Vendor.fields.vendor_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "vendor_type outside {TELECOM, SAAS} returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "PHONE" }
              as: Sourcing
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

  # =================================================================
  - section: state_machines
    instances:
      - name: pay_before_approve_returns_invoice_not_approved
        claim_type: invalid_transition
        grounds: ["state_machines.Invoice.APPROVED_to_PAID", "errors[ERR_INVOICE_NOT_APPROVED]"]
        distinguishing_aspect: "Paying an invoice still in UNDER_REVIEW is rejected with ERR_INVOICE_NOT_APPROVED (409)."
        test_recipe:
          setup: ["Invoice UNDER_REVIEW under an ACTIVE contract."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: FinanceApprover
              as_user_id: "fa_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVOICE_NOT_APPROVED"

      - name: pay_by_same_approver_returns_segregation_of_duties
        claim_type: guarded transitions
        grounds: ["state_machines.Invoice.APPROVED_to_PAID", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Paying an APPROVED invoice with the same X-User-ID that approved it returns ERR_SEGREGATION_OF_DUTIES (409)."
        test_recipe:
          setup: ["Invoice APPROVED by FinanceApprover fa_1."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
            - call: "POST /invoices/${inv_id}/approve"
              payload: {}
              as: FinanceApprover
              as_user_id: "fa_1"
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: FinanceApprover
              as_user_id: "fa_1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SEGREGATION_OF_DUTIES"

      - name: pay_by_different_approver_succeeds
        claim_type: Valid Transition
        grounds: [state_machines.Invoice.APPROVED_to_PAID]
        distinguishing_aspect: "Paying an APPROVED invoice with a different FinanceApprover (fa_2) succeeds; status PAID, balance_due_cents 0."
        test_recipe:
          setup: ["Invoice APPROVED by fa_1."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
            - call: "POST /invoices/${inv_id}/approve"
              payload: {}
              as: FinanceApprover
              as_user_id: "fa_1"
          trigger:
            - call: "POST /invoices/${inv_id}/pay"
              payload: {}
              as: FinanceApprover
              as_user_id: "fa_2"
              captures: { inv_status: $.data.status, bal: $.data.balance_due_cents }
          assert:
            - "inv_status == PAID"
            - "bal == 0"

      - name: resubmit_beyond_max_rounds_returns_error
        claim_type: cyclic
        grounds: ["state_machines.Dispute.VENDOR_RESPONDED_to_RESUBMITTED", "errors[ERR_MAX_ROUNDS_EXCEEDED]"]
        distinguishing_aspect: "After round_count reaches MAX_DISPUTE_ROUNDS=2, a third resubmit is rejected with ERR_MAX_ROUNDS_EXCEEDED (409)."
        test_recipe:
          setup: ["Dispute cycled to round_count=2 (VENDOR_RESPONDED)."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 100000 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
            - call: "POST /invoice-line-items/${li_id}/disputes"
              payload: { disputed_amount_cents: 9500, claimed_credit_cents: 9500 }
              as: Analyst
              captures: { d_id: $.data.id }
            - call: "POST /disputes/${d_id}/respond"
              payload: { response_type: "PARTIAL", offered_credit_cents: 5000 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /disputes/${d_id}/resubmit"
              payload: { claimed_credit_cents: 9500 }
              as: Analyst
            - call: "POST /disputes/${d_id}/respond"
              payload: { response_type: "PARTIAL", offered_credit_cents: 6000 }
              as: Vendor
              as_user_id: "${v_id}"
            - call: "POST /disputes/${d_id}/resubmit"
              payload: { claimed_credit_cents: 9500 }
              as: Analyst
            - call: "POST /disputes/${d_id}/respond"
              payload: { response_type: "PARTIAL", offered_credit_cents: 7000 }
              as: Vendor
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /disputes/${d_id}/resubmit"
              payload: { claimed_credit_cents: 9500 }
              as: Analyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MAX_ROUNDS_EXCEEDED"

      - name: reject_recommendation_sets_rejected
        claim_type: Valid Transition
        grounds: [state_machines.Recommendation.PROPOSED_to_REJECTED]
        distinguishing_aspect: "POST /recommendations/{id}/reject moves a PROPOSED recommendation to REJECTED."
        test_recipe:
          setup: ["A PROPOSED recommendation exists."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id, s_ver: $.data.version }
            - call: "POST /services/${s_id}/recommendations"
              payload: { rec_type: "DOWNGRADE_SEATS", target_quantity: 45, expected_service_version: "${s_ver}" }
              as: Analyst
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /recommendations/${r_id}/reject"
              payload: {}
              as: FinanceApprover
              as_user_id: "fa_1"
              captures: { r_status: $.data.status }
          assert:
            - "r_status == REJECTED"

      - name: terminate_contract_retires_services
        claim_type: Cascade down
        grounds: [state_machines.Contract.ACTIVE_to_TERMINATED, state_machines.Service.ACTIVE_to_RETIRED]
        distinguishing_aspect: "Terminating an ACTIVE contract cascades its ACTIVE service to RETIRED and recomputes committed cost to 0."
        test_recipe:
          setup: ["ACTIVE contract with one ACTIVE service (committed 120000)."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
          trigger:
            - call: "POST /contracts/${c_id}/terminate"
              payload: {}
              as: Sourcing
              captures: { c_status: $.data.status, committed: $.data.monthly_committed_cost_cents }
          assert:
            - "c_status == TERMINATED"
            - "committed == 0"
            - "Service.${s_id}.status == RETIRED after terminate"

  # =================================================================
  - section: validations
    instances:
      - name: dispute_claim_exceeds_billed_returns_fiscal_error
        claim_type: "Violation -> Error"
        grounds: ["validations[priority=9]", "errors[ERR_CREDIT_EXCEEDS_BILLED]"]
        distinguishing_aspect: "On a reviewed invoice (state OK), opening a dispute with claimed_credit 200000 > billed 100000 returns ERR_CREDIT_EXCEEDS_BILLED (422)."
        test_recipe:
          setup: ["Invoice UNDER_REVIEW with a line billed 100000."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 100000 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
          trigger:
            - call: "POST /invoice-line-items/${li_id}/disputes"
              payload: { disputed_amount_cents: 200000, claimed_credit_cents: 200000 }
              as: Analyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CREDIT_EXCEEDS_BILLED"

      - name: vendor_offer_exceeds_claim_returns_error
        claim_type: "Violation -> Error"
        grounds: ["validations[priority=9]", "errors[ERR_OFFER_EXCEEDS_CLAIM]"]
        distinguishing_aspect: "A vendor response with offered_credit_cents 20000 > claimed 9500 returns ERR_OFFER_EXCEEDS_CLAIM (422)."
        test_recipe:
          setup: ["A SUBMITTED dispute claimed 9500."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 100000 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /invoices/${inv_id}/review"
              payload: {}
              as: Analyst
            - call: "POST /invoice-line-items/${li_id}/disputes"
              payload: { disputed_amount_cents: 9500, claimed_credit_cents: 9500 }
              as: Analyst
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /disputes/${d_id}/respond"
              payload: { response_type: "PARTIAL", offered_credit_cents: 20000 }
              as: Vendor
              as_user_id: "${v_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OFFER_EXCEEDS_CLAIM"

      - name: allocation_weight_sum_not_100_returns_error
        claim_type: "Violation -> Error"
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_WEIGHT_SUM]"]
        distinguishing_aspect: "An allocation set whose weight_pct values sum to 90.00 (not 100.00) returns ERR_INVALID_WEIGHT_SUM (422)."
        test_recipe:
          setup: ["A BILLED line and two cost centers."]
          setup_api_calls:
            - call: "POST /vendors"
              payload: { name: "Zed", vendor_type: "SAAS" }
              as: Sourcing
              captures: { v_id: $.data.id }
            - call: "POST /contracts"
              payload: { vendor_id: "${v_id}", term_start: "2026-01-01T00:00:00Z", term_end: "2026-12-31T00:00:00Z", renewal_notice_days: 60 }
              as: Sourcing
              captures: { c_id: $.data.id }
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: Sourcing
            - call: "POST /services"
              payload: { contract_id: "${c_id}", service_type: "SAAS_SUBSCRIPTION", license_type: "PER_SEAT", unit_rate_cents: 2000, contracted_quantity: 60, active_quantity: 42 }
              as: Sourcing
              captures: { s_id: $.data.id }
            - call: "POST /invoices"
              payload: { contract_id: "${c_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: Analyst
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/line-items"
              payload: { service_id: "${s_id}", billing_period_start: "2026-06-01T00:00:00Z", billing_period_end: "2026-07-01T00:00:00Z", billed_quantity: 60, billed_amount_cents: 90000 }
              as: Analyst
              captures: { li_id: $.data.id }
            - call: "POST /cost-centers"
              payload: { code: "CC-A", gl_account: "6000", owner_user_id: "own_a" }
              as: SystemAdmin
              captures: { cc_a: $.data.id }
            - call: "POST /cost-centers"
              payload: { code: "CC-B", gl_account: "6001", owner_user_id: "own_b" }
              as: SystemAdmin
              captures: { cc_b: $.data.id }
          trigger:
            - call: "POST /invoice-line-items/${li_id}/allocations"
              payload: { allocations: [ { cost_center_id: "${cc_a}", weight_pct: 50.00 }, { cost_center_id: "${cc_b}", weight_pct: 40.00 } ] }
              as: Analyst
              captures: { err: $.data.error_id }
          assert:
