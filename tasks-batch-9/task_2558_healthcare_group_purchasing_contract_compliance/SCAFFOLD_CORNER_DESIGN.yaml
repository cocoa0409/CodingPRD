          trigger:
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-12-01", effective_to: "2027-01-15" }
              as: ContractManager
              captures: { e1: $.data.error_id }
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-12-01", effective_to: "2026-12-31" }
              as: ContractManager
              captures: { a1: $.data.id, as1: $.data.status, ef: $.data.effective_from, et: $.data.effective_to }
            - call: "POST /gpo/price-activations"
              payload: { commitment_id: "${k1}", contract_item_id: "${i1}", activation_type: "TIER_PRICE", effective_from: "2026-12-31", effective_to: "2026-12-01" }
              as: ContractManager
              captures: { e3: $.data.error_id }
