              payload: { vessel_id: "${vessel}", inspection_id: "${insp1}", fee_invoice_id: "${fee1}", expected_vessel_version: "${v_ver_stale}" }
              as: JurisdictionAdmin
              captures: { cert1: "$.data.id" }
            - call: "POST /inspections"
              payload: { vessel_id: "${vessel}", inspector_id: "${insp_a}", inspection_type: "EXTERNAL", scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T11:00:00Z" }
              as: JurisdictionAdmin
              captures: { insp2: "$.data.id" }
            - call: "POST /inspections/${insp2}/result"
              payload: { result: "PASS" }
              as: Inspector
              as_user_id: "${insp_a}"
            - call: "POST /fee-invoices"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp2}" }
              as: JurisdictionAdmin
              captures: { fee2: "$.data.id" }
            - call: "POST /fee-invoices/${fee2}/pay"
              payload: {}
              as: Owner
              as_user_id: "${owner}"
          trigger:
            - call: "POST /certificates"
              payload: { vessel_id: "${vessel}", inspection_id: "${insp2}", fee_invoice_id: "${fee2}", expected_vessel_version: "${v_ver_stale}", supersedes_certificate_id: "${cert1}" }
              as: JurisdictionAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_STALE_VESSEL_VERSION"

