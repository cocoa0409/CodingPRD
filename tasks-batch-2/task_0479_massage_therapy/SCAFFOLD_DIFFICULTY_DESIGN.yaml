  # =========================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: table_overlap_with_turnover_buffer
        grounds:
          - validations[priority=13]
          - entities.Table.fields.turnover_buffer_minutes
          - errors[ERR_TABLE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Table interval semantics INCLUDE a turnover buffer: a second appointment whose start_at is 10
          minutes after the first ends collides because the table needs a 15-minute turnover buffer
          (gap 10 < 15) -> ERR_TABLE_DOUBLE_BOOKED. The buffer-padded interval distinguishes this from the
          therapist rule.
        test_recipe:
          setup:
            - "Table with turnover_buffer_minutes=15. Appointment A occupies 09:00-10:00. A second appointment B starts at 10:10 (only a 10-minute gap < 15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T07:00:00Z" }
              as: PracticeAdmin
            - call: "POST /practice/modalities"
              payload: { name: "Swedish", code: "SWEDISH", base_price_cents: 12000 }
              as: PracticeAdmin
              captures: { mod_sw: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "T13", license_number: "LMT-160001", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t1: $.data.id }
            - call: "POST /practice/therapists"
              payload: { full_name: "T13b", license_number: "LMT-160002", license_expiry: "2027-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { t2: $.data.id }
            - call: "POST /practice/tables"
              payload: { label: "R15-A", room: "R15", turnover_buffer_minutes: 15 }
              as: PracticeAdmin
              captures: { tbl: $.data.id, tbl_v0: $.data.version }
            - call: "POST /practice/clients"
              payload: { full_name: "Client TB", email: "tb@x.com" }
              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tbl}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-02T09:00:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl_v0}" }
              as: FrontDesk
              captures: { apA: $.data.id }
            - call: "GET /practice/tables/${tbl}"
              payload: {}
              as: FrontDesk
              captures: { tbl_v1: $.data.version }
          trigger:
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t2}", table_id: "${tbl}", modality_id: "${mod_sw}", consent_id: "${con}", start_at: "2026-03-02T10:10:00Z", duration_minutes: 60, payer: "CASH", expected_table_version: "${tbl_v1}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TABLE_DOUBLE_BOOKED"
            - "HTTP status == 409"

      - name: therapist_overlap_no_buffer_adjacency_allowed
        grounds:
          - validations[priority=14]
          - errors[ERR_THERAPIST_DOUBLE_BOOKED]
          - entities.Appointment.fields.therapist_id
        distinguishing_aspect: |
          Therapist interval semantics are CLOSED with NO buffer: a back-to-back booking touching exactly
          at 10:00 (A ends 10:00, B starts 10:00) on DIFFERENT tables is ALLOWED, but a true overlap (B
          starts 09:30 while A runs 09:00-10:00) is rejected with ERR_THERAPIST_DOUBLE_BOOKED — distinct
          adjacency treatment from the buffered table rule.
        test_recipe:
          setup:
            - "Therapist T busy 09:00-10:00 on table X. A second booking for the SAME therapist at 09:30 on a DIFFERENT table Y overlaps and is rejected; a touching 10:00 booking would be allowed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T07:00:00Z" }
              as: PracticeAdmin
