            - { call: "POST /equipment-assets", payload: { program_id: "${prog_id}", asset_tag: "RK-0001", kit_type: "RADIO_KIT", unit_value_cents: 8300 }, as: LogisticsOfficer, as_user_id: "log-user-1", captures: { asset2_id: $.data.id } }
