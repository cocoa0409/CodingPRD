      - name: error_privacy_hold_blocks_release_on_the_physician_decision
        claim_type: violation_to_error
        grounds: ["errors[ERR_PRIVACY_HOLD_BLOCKS_RELEASE]", "validations[priority=29]", "calculations.disclosure_redaction_and_package", "entities.Student.fields.privacy_hold"]
        distinguishing_aspect: "A student with privacy_hold true and a non-GUARDIAN requester forces redaction_level FULL, so the APPROVE decision itself is refused with 403 ERR_PRIVACY_HOLD_BLOCKS_RELEASE and the request never reaches APPROVED."
        test_recipe:
          setup:
            - "School CEDAR93 with one ENROLLED student whose privacy_hold is true."
            - "One DisclosureRequest from an EXTERNAL_PROVIDER, submitted and guardian-consented, sitting at AWAITING_DECISION with redaction_level FULL."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Cedar Elementary", building_code: "CDR93", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Cy Almeida", grade_level: 8, date_of_birth: "2012-05-05T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT", privacy_hold: true }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/disclosure-requests"
              payload: { student_id: "${stu_id}", requester_type: "EXTERNAL_PROVIDER", requester_reference: "Cedar Family Practice", scope: ["VISITS", "MEDICATIONS"], purpose_code: "TREATMENT" }
              as: RecordsOfficer
              as_user_id: "rec-off-01"
              captures: { dr_id: $.data.id, red0: $.data.redaction_level }
            - call: "POST /health-office/disclosure-requests/${dr_id}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "rec-off-01"
            - call: "POST /health-office/disclosure-requests/${dr_id}/guardian-consent"
              payload: { decision: "GRANT" }
              as: Guardian
              as_user_id: "${stu_id}"
              captures: { status_awaiting: $.data.status }
          trigger:
            - call: "POST /health-office/disclosure-requests/${dr_id}/decide"
              payload: { decision: "APPROVE" }
              as: SchoolPhysician
              as_user_id: "phys-md-01"
              captures: { err: $.data.error_id }
          assert:
            - "At creation: DisclosureRequest.${dr_id}.redaction_level == FULL"
            - "Before the trigger: DisclosureRequest.${dr_id}.status == AWAITING_DECISION"
            - "HTTP status == 403"
            - "data.error_id == ERR_PRIVACY_HOLD_BLOCKS_RELEASE"
            - "DisclosureRequest.${dr_id}.status == AWAITING_DECISION (unchanged)"
            - "DisclosureRequest.${dr_id}.decided_by_user_id == null"
            - "DisclosureRequest.${dr_id}.release_package_item_count == 0"

      - name: error_disclosure_consent_expired_at_exactly_thirty_days
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISCLOSURE_CONSENT_EXPIRED]", "validations[priority=38]", "entities.DisclosureRequest.fields.expires_at"]
        distinguishing_aspect: "The release window is half-open (clock < expires_at): consent granted at 2026-08-01T00:00:00Z expires at 2026-08-31T00:00:00Z, and a release attempted at exactly that instant is refused with 409 ERR_DISCLOSURE_CONSENT_EXPIRED even though the releasing officer differs from the decider."
        test_recipe:
          setup:
            - "School DAWN94 with one ENROLLED student (privacy_hold false)."
            - "One DisclosureRequest submitted, guardian-consented at the default clock 2026-08-01T00:00:00Z (expires_at 2026-08-31T00:00:00Z) and approved by operator phys-md-01."
            - "Clock then set to exactly 2026-08-31T00:00:00Z with no checkpoint run."
          setup_api_calls:
            - call: "POST /health-office/schools"
              payload: { name: "Dawnbrook Elementary", building_code: "DWN94", cot_capacity: 2, emergency_protocol_enabled: true }
              as: DistrictHealthAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /health-office/students"
              payload: { school_id: "${sch_id}", full_name: "Dov Ellery", grade_level: 6, date_of_birth: "2014-02-02T00:00:00Z", allergy_severity: "NONE", chronic_condition_codes: [], immunization_status: "COMPLIANT", privacy_hold: false }
              as: DistrictHealthAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /health-office/disclosure-requests"
              payload: { student_id: "${stu_id}", requester_type: "EXTERNAL_PROVIDER", requester_reference: "Dawn Pediatrics", scope: ["VISITS"], purpose_code: "TREATMENT" }
              as: RecordsOfficer
              as_user_id: "rec-off-01"
              captures: { dr_id: $.data.id }
            - call: "POST /health-office/disclosure-requests/${dr_id}/submit"
              payload: {}
              as: RecordsOfficer
              as_user_id: "rec-off-01"
            - call: "POST /health-office/disclosure-requests/${dr_id}/guardian-consent"
              payload: { decision: "GRANT" }
              as: Guardian
              as_user_id: "${stu_id}"
              captures: { granted_at: $.data.consent_granted_at, expires: $.data.expires_at }
            - call: "POST /health-office/disclosure-requests/${dr_id}/decide"
              payload: { decision: "APPROVE" }
              as: SchoolPhysician
              as_user_id: "phys-md-01"
              captures: { dr_status: $.data.status }
            - call: "POST /health-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: DistrictHealthAdmin
          trigger:
            - call: "POST /health-office/disclosure-requests/${dr_id}/release"
              payload: {}
              as: RecordsOfficer
              as_user_id: "rec-off-02"
              captures: { err: $.data.error_id }
          assert:
            - "Before the trigger: DisclosureRequest.${dr_id}.consent_granted_at == 2026-08-01T00:00:00.000Z"
            - "Before the trigger: DisclosureRequest.${dr_id}.expires_at == 2026-08-31T00:00:00.000Z"
            - "Before the trigger: DisclosureRequest.${dr_id}.status == APPROVED"
            - "HTTP status == 409"
            - "data.error_id == ERR_DISCLOSURE_CONSENT_EXPIRED"
            - "data.error_id != ERR_SEGREGATION_OF_DUTIES"
            - "DisclosureRequest.${dr_id}.status == APPROVED and released_at == null"
            - "DisclosureRequest.${dr_id}.release_package_item_count == 0"

      - name: error_visit_invalid_state_trigger
