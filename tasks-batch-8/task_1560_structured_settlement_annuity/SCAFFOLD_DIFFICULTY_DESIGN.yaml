              captures: { swept_n: $.data.swept_count, swept_amt: $.data.swept_amount_cents, batch_st: $.data.status }
            - call: "GET /annuity/settlement-agreements/${agr_id}"
              payload: {}
              as: Any
              captures: { t1_out: $.data.outstanding_liability_cents, t1_esch: $.data.escheated_total_cents, t1_paid: $.data.paid_total_cents }
            - call: "POST /annuity/escheatment-batches"
              payload: { state_code: "OR", batch_period: "2027-10" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { batch2_id: $.data.id }
            - call: "POST /annuity/scheduled-payments/${p1_id}/reclaim-escheat"
              payload: {}
              as: OperationsSpecialist
