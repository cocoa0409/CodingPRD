              payload: { farmer_id: "${k_farm_id}", elevator_id: "${k_elev_id}", contract_type: "DEFERRED", quantity_bushels: 100, futures_month: "2027-05", pricing_deadline: "2027-04-15T00:00:00Z", storage_rate_cents_per_bushel_day: 1 }
              as: OriginationMerchandiser
