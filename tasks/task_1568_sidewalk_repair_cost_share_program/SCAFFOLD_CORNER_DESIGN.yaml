        distinguishing_aspect: |
          Below the 90 cap the tiered sum adds exactly: COLLECTOR (+10) with
          SENIOR_65 (+20) on base 50 yields share_pct 80, and the provisional
          award applies it per-component — round_half_up(100 * 1200) * 80/100 =
