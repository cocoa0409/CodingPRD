              as: RemediationOwner
              captures: { err_id: $.data.error_id }
          assert:
            - "cnt3 == 3 (exactly 3 overdue PENDING items at clock 7/21 with due 7/20)"
            - "post3 == FROZEN (>= 3 inclusive, not > 3)"
            - "Document submission under FROZEN returns err_id == ERR_EXAM_POSTURE_FROZEN (boundary side-effect verified)"

      - name: empty_attendees_and_adjacent_exam_interval
        grounds:
          - validations[priority=8]
          - validations[priority=14]
        distinguishing_aspect: |
          Boundary on an EMPTY-SET metric (attendees array must be non-empty) AND a different
          metric (adjacent half-open intervals e1 == s2 is NOT overlap). Different metrics
          (set-emptiness vs interval adjacency), different endpoints.
        test_recipe:
          setup:
            - "One agency; one existing exam [2026-07-06, 2026-07-10]"
          setup_api_calls:
            - call: "POST /regulatory-exams/agencies"
              payload: { agency_code: "FRB4", agency_name: "FRB4", jurisdiction: "FEDERAL", escalation_threshold_days: 30, repeat_finding_multiplier_bp: 20000 }
              as: PlatformAdmin
              captures: { ag12: $.data.id }
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag12}", exam_cycle_code: "A", exam_type: "IT", scheduled_start_date: "2026-07-06T00:00:00Z", scheduled_end_date: "2026-07-10T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex12a: $.data.id }
          trigger:
            # Adjacent: e1 (7/10) == s2 (7/10) — must NOT be treated as overlap
            - call: "POST /regulatory-exams/examinations"
              payload: { agency_id: "${ag12}", exam_cycle_code: "B", exam_type: "COMPLIANCE", scheduled_start_date: "2026-07-10T00:00:00Z", scheduled_end_date: "2026-07-20T00:00:00Z" }
              as: RegulatoryAffairsManager
              captures: { ex12b: $.data.id }
            # Empty attendees on meeting — must fail
            - call: "POST /regulatory-exams/examiner-meetings"
              payload: { examination_id: "${ex12a}", meeting_date: "2026-07-07T10:00:00Z", attendees: [], minutes_summary: "m" }
              as: RegulatoryAffairsManager
              captures: { err_id: $.data.error_id }
          assert:
            - "Adjacent exam creation succeeded: ex12b is a valid id (half-open [s,e) adjacency e1==s2 is NOT overlap)"
            - "err_id == ERR_INVALID_REQUEST for empty attendees array (empty-set boundary)"

