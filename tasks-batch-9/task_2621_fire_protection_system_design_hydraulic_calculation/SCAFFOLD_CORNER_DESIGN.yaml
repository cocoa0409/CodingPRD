              as: FirmAdmin
              captures: { p3: $.data.id }
          trigger:
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "STANDPIPE_CLASS_I", label: "Stairs 1-4 low rise", riser_count: 4 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { sp_a: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p2}", system_type: "STANDPIPE_CLASS_I", label: "Stairs 1-4 at the trigger", riser_count: 4 }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { sp_b: $.data.id }
