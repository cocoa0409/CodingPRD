      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/scorecards
        payload:
          account_id: ${acc}
          service_line: JANITORIAL
          quality_bps: 9800
          response_bps: 9300
        as: GovernanceManager
        captures:
          SC1: $.data.id
      - call: POST /api/discipline-audits
        payload:
          account_id: ${acc}
          discipline: TRANSACTION
          finding: Sampling pending
        as: GovernanceManager
        captures:
          A1: $.data.id
      - call: GET /api/accounts/${acc}
        as: AccountExecutive
        captures:
