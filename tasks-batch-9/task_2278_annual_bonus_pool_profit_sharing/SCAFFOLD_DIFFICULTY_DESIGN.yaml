            - "ParticipantAward.${award_id}.excluded_leave_days == 62"
            - "ParticipantAward.${award_id}.credited_days == 303"
            - "ParticipantAward.${award_id}.prorated_target_cents == 2342465"
            - "ParticipantAward.${award_id}.prorated_target_cents != 2342466"
            - "ParticipantAward.${award_id}.target_bonus_pct == 20.00"
            - "ParticipantAward.${award_id}.eligibility_status == ELIGIBLE"
            - "BusinessUnitPool.${pool_id}.eligible_target_cents == 2342465"
            - "BonusPlan.${plan_id}.total_target_cents == 2342465"

      - name: burden_tier_selected_from_pre_burden_cumulative_not_loaded_total
        grounds:
