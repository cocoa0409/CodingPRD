      - name: p11_invalid_state_beats_p36_no_accruable_lines
        claim_type: priority_ordering
        grounds:
          - validations[priority=11]
          - validations[priority=36]
          - state_machines.PurchaseBatch.normalization
        distinguishing_aspect: |
          One accrue call violates BOTH rules at once: the batch is still RECEIVED
          (so RECEIVED -> ACCRUED is undeclared) and its only line can never
          accrue (unknown key, no candidate item). The state error at priority 11
