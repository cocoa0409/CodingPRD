      - name: publication_publish_requires_snapshot_finalized
        grounds:
          - state_machines.Publication.DRAFT_to_PUBLISHED
          - state_machines.WeightSnapshot.PROVISIONAL_to_FINALIZED
          - errors[ERR_SNAPSHOT_NOT_FINALIZED]
        distinguishing_aspect: |
          Pair Publication x WeightSnapshot (distinct from Wave x Instrument): publish
          against a PROVISIONAL pinned snapshot fails ERR_SNAPSHOT_NOT_FINALIZED; once
          the snapshot finalizes (wave CLOSED -> WEIGHTED as a bubble-up side effect),
          the same publish succeeds and the wave reaches PUBLISHED.
