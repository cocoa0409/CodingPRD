      - name: referential_beats_temporal_when_arbitrating_a_pending_review_after_the_outer_window
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_REVIEW_REQUEST_NOT_DECIDED]
          - errors[ERR_ARBITRATION_WINDOW_CLOSED]
          - calculations.arbitration_window
        distinguishing_aspect: |
          Category pair `business_referential` (priority 10) versus `business_temporal` (priority 11)
          — a different pair from instance one's state/fiscal: the request for review is still
          PENDING (never decided, never swept) and the clock 2027-03-01T00:00:00Z is past its
          arbitration_deadline_at of 2027-02-28T00:00:00Z, so both rules are violated and the answer
          must be ERR_REVIEW_REQUEST_NOT_DECIDED, not ERR_ARBITRATION_WINDOW_CLOSED.
