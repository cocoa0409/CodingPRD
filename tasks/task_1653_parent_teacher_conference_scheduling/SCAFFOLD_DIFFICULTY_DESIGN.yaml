            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id", s1: "$.data[1].id", s2: "$.data[2].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G F", email: "f@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "A", grade_level: 1 }, as: FrontOfficeStaff, captures: { stA: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "B", grade_level: 2 }, as: FrontOfficeStaff, captures: { stB: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "C", grade_level: 3 }, as: FrontOfficeStaff, captures: { stC: $.data.id } }
            - { call: "POST /conf/students/${stA}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${stB}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${stC}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
          trigger:
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${stA}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { bkA: $.data.id } }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s2}", student_id: "${stB}", channel: "VIRTUAL" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { bkB: $.data.id, bkB_status: $.data.status } }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s1}", student_id: "${stC}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { err: $.data.error_id } }
          assert:
            - "VIRTUAL booking at 15:50 after IN_PERSON [15:00-15:20) succeeds: gap 30 == travel_minutes satisfies >= (CONFIRMED)"
            - "IN_PERSON booking at 15:25 rejected with ERR_FAMILY_SCHEDULE_CONFLICT: gap to the VIRTUAL booking is 5 < 30 (mixed channel)"
            - "window.bookings_confirmed_count == 2 after the rejection"

  - rule_id: compensating_invariant
    instances:
      - name: slot_booked_confirmed_pair_conservation
        grounds:
          - state_machines.TimeSlot
          - state_machines.Booking
          - entities.ConferenceWindow.fields.slots_booked_count
        distinguishing_aspect: |
          Conserved quantity 1 (slot/booking pair counts): for the window, invariant
          slots_booked_count == bookings_confirmed_count and slots_total_count == 8 hold
          before, between, and after a book+cancel pair; the cancel compensates the book
          exactly (no drift: open returns to 8).
        test_recipe:
          setup:
            - "Window BOOKING_OPEN; T1 (8 slots); family F student st1 linked to T1"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6, family_conf_cap: 8, cancel_cutoff_hours: 24, waitlist_offer_ttl_hours: 24, no_show_strike_threshold: 3, auto_no_show_grace_hours: 24 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}", as: SchoolAdmin, captures: { pre_open: $.data.slots_open_count, pre_booked: $.data.slots_booked_count, pre_conf: $.data.bookings_confirmed_count, pre_total: $.data.slots_total_count } }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G F", email: "f@x.com" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S1", grade_level: 3 }, as: FrontOfficeStaff, captures: { st1: $.data.id } }
            - { call: "POST /conf/students/${st1}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
          trigger:
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${st1}", channel: "IN_PERSON" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { bk: $.data.id } }
            - { call: "GET /conf/windows/${w}", as: SchoolAdmin, captures: { mid_open: $.data.slots_open_count, mid_booked: $.data.slots_booked_count, mid_conf: $.data.bookings_confirmed_count } }
            - { call: "POST /conf/bookings/${bk}/cancel", payload: {}, as: FamilyGuardian, as_user_id: "${fam}" }
            - { call: "GET /conf/windows/${w}", as: SchoolAdmin, captures: { post_open: $.data.slots_open_count, post_booked: $.data.slots_booked_count, post_conf: $.data.bookings_confirmed_count, post_total: $.data.slots_total_count } }
          assert:
            - "before: slots_open_count == 8, slots_booked_count == 0, bookings_confirmed_count == 0, slots_total_count == 8"
            - "after book: slots_booked_count == 1 == bookings_confirmed_count == 1, slots_open_count == 7 (invariant holds pairwise)"
            - "after cancel: slots_open_count == 8, slots_booked_count == 0 == bookings_confirmed_count == 0, slots_total_count == 8 (book+cancel conserves every counter)"

      - name: interpreter_committed_minutes_round_trip
        grounds:
          - state_machines.InterpreterRequest
          - entities.Interpreter.fields.committed_minutes
          - calculations.interpreter_window_capacity
        distinguishing_aspect: |
          Conserved quantity 2 (interpreter committed minutes, a different quantity from
          slot counts): committed_minutes == sum(assigned_minutes over ASSIGNED|CONFIRMED
          requests) — an assign (+20) followed by its compensating cancel (-20) returns the
          interpreter to exactly the baseline 0 with no drift.
        test_recipe:
          setup:
            - "Window BOOKING_OPEN; T1; interpreter I; family F1 student stA booked on slot 0 with interpreter_language es -> r REQUESTED (assigned_minutes 20)"
          setup_api_calls:
            - { call: "POST /conf/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SchoolAdmin }
            - call: "POST /conf/windows"
              payload: { name: "Fall", term_label: "2026-FALL", format: "ELEMENTARY", slot_length_minutes: 20, buffer_minutes: 5, travel_minutes: 30, day_windows: [{ date: "2026-10-05", start_at: "2026-10-05T15:00:00Z", end_at: "2026-10-05T19:00:00Z" }], booking_open_at: "2026-09-01T00:00:00Z", booking_close_at: "2026-10-01T00:00:00Z", teacher_daily_conf_cap: 6, family_conf_cap: 8, cancel_cutoff_hours: 24, waitlist_offer_ttl_hours: 24, no_show_strike_threshold: 3, auto_no_show_grace_hours: 24 }
              as: SchoolAdmin
              captures: { w: $.data.id, w_v1: $.data.version }
            - { call: "POST /conf/teachers", payload: { full_name: "T1", email: "t1@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t1: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/windows/${w}/slots", as: SchoolAdmin, captures: { s0: "$.data[0].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/interpreters", payload: { full_name: "I One", languages: ["es"], max_consecutive_minutes: 120, base_minutes_per_window: 600, hourly_rate_cents: 6000 }, as: SchoolAdmin, captures: { interp: $.data.id } }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G1", email: "f1@x.com", preferred_language: "es" }, as: FrontOfficeStaff, captures: { f1: $.data.id } }
            - { call: "POST /conf/families/${f1}/students", payload: { full_name: "A", grade_level: 3 }, as: FrontOfficeStaff, captures: { stA: $.data.id } }
            - { call: "POST /conf/students/${stA}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${s0}", student_id: "${stA}", channel: "IN_PERSON", interpreter_language: "es" }, as: FamilyGuardian, as_user_id: "${f1}", captures: { bk: $.data.id } }
            - { call: "GET /conf/interpreter-requests", payload: { booking_id: "${bk}" }, as: FrontOfficeStaff, captures: { r: "$.data[0].id" } }
            - { call: "GET /conf/interpreters/${interp}", as: FrontOfficeStaff, captures: { m0: $.data.committed_minutes } }
          trigger:
            - { call: "POST /conf/interpreter-requests/${r}/assign", payload: { interpreter_id: "${interp}" }, as: FrontOfficeStaff }
            - { call: "GET /conf/interpreters/${interp}", as: FrontOfficeStaff, captures: { m1: $.data.committed_minutes } }
            - { call: "POST /conf/interpreter-requests/${r}/cancel", payload: {}, as: FrontOfficeStaff }
            - { call: "GET /conf/interpreters/${interp}", as: FrontOfficeStaff, captures: { m2: $.data.committed_minutes } }
          assert:
            - "baseline committed_minutes == 0"
            - "after assign: committed_minutes == 20 (== assigned_minutes of the single ASSIGNED request)"
            - "after compensating cancel: committed_minutes == 0 (assign+cancel conserves the total exactly)"
