          - errors[ERR_INVALID_STATE]
          - errors[ERR_INSUFFICIENT_CASH]
        distinguishing_aspect: |
          Re-clearing an already-CLEARED distribution on an account whose cash is now below the amount
          fails both p6 (state, distribution not REQUESTED) and p14 (business_fiscal, insufficient cash);
          the response is ERR_INVALID_STATE because state precedes fiscal. Category pair state vs
          business_fiscal (distinct from instance #1's business_safety vs business_constraint).
        test_recipe:
          setup:
            - "ACTIVE account, cash 60000 from a posted INDIVIDUAL contribution of 60000. Holder requests a 60000 REIMBURSEMENT distribution d; adminA clears d (cash drops to 0, d now CLEARED). A second clear of d is attempted: d is CLEARED (state fail) and cash 0 < 60000 (fiscal fail)."
          setup_api_calls:
