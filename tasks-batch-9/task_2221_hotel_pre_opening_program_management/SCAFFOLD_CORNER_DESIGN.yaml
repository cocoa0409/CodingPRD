  - section: consistency model
    instances:
      - name: every_cascade_is_visible_without_a_second_write_or_a_re_read_delay
        claim_type: immediate
        grounds:
          - "§1.0 consistency_model is immediate, so the response to a write already carries every derived field it touched and the next read sees the full cascade with no settling step; §1.2 Hire ACCEPTED -> ONBOARDED is the deepest such cascade, walking hire -> plan -> program."
        distinguishing_aspect: "A single onboard call must leave hire, plan and program mutually consistent in the very next reads — onboarded_count 1, staffing_ratio 1.0, readiness_flag READY, departments_ready_count 1 — with no settling step anywhere."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One ROOMS plan with headcount_target 1 and wave_start_date 2026-09-10, holding one ACCEPTED hire (2500 cents/hour, 8 hours/day, start_date 2026-09-15) enrolled in a ROOMS session in TR-1 on 2026-09-14 09:00-12:00 that is already COMPLETED, with the clock at 2026-09-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_id}", department: "ROOMS", headcount_target: 1, wave_start_date: "2026-09-10" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { plan_rooms: "$.data.id" }
            - call: "POST /pre-opening/training-sessions"
              payload: { program_id: "${prog_id}", title: "Rooms orientation", training_room_code: "TR-1", starts_at: "2026-09-14T09:00:00Z", ends_at: "2026-09-14T12:00:00Z", capacity: 5, department: "ROOMS" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { sess_orient: "$.data.id" }
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_rooms}", full_name: "A. Keeper", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-15", orientation_session_id: "${sess_orient}" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { hire_1: "$.data.id" }
            - call: "POST /pre-opening/hires/${hire_1}/respond"
              payload: { decision: "ACCEPT" }
              as: TalentManager
              as_user_id: "tm-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/training-sessions/${sess_orient}/complete"
              payload: {}
              as: TalentManager
              as_user_id: "tm-1"
          trigger:
            - call: "POST /pre-opening/hires/${hire_1}/onboard"
              payload: {}
              as: TalentManager
              as_user_id: "tm-1"
            - call: "GET /pre-opening/programs/${prog_id}/hiring-plans?department=ROOMS"
              payload: {}
              as: TalentManager
              as_user_id: "tm-1"
            - call: "GET /pre-opening/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "GET /pre-opening/programs/${prog_id}/readiness"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
          assert:
            - "the onboard response itself returns state 'ONBOARDED' with onboarded_at '2026-09-20T00:00:00Z' — the write's own response already reflects the change"
            - "the immediately following plan read returns onboarded_count 1, accepted_count 1, staffing_ratio 1.0 and readiness_flag 'READY' with no intervening write"
            - "the program read returns hiring_plan_count 1 and departments_ready_count 1 in the same sequence, so the bubble-up is not deferred"
            - "the readiness read reports staffing_ratio 1.0, consistent with the plan roll-up read one call earlier"
            - "repeating any of the three reads returns byte-identical derived values: there is no lag window in which a denormalized field disagrees with its source"
