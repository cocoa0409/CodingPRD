        as: PDCoordinator
      - call: POST /pd/employees
        payload:
          full_name: E03
          email: e03@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
      - call: POST /pd/employees
        payload:
          full_name: E04
          email: e04@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
      - call: POST /pd/employees
        payload:
          full_name: E05
          email: e05@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
      - call: POST /pd/employees
        payload:
          full_name: E06
          email: e06@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
      - call: POST /pd/employees
        payload:
          full_name: E07
          email: e07@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
      - call: POST /pd/employees
        payload:
          full_name: E08
          email: e08@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
      - call: POST /pd/employees
        payload:
          full_name: E09
          email: e09@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
      - call: POST /pd/employees
        payload:
          full_name: E10
          email: e10@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
      - call: POST /pd/employees
        payload:
          full_name: E11
          email: e11@x.com
          employee_kind: TEACHER
          primary_building_id: ${b1}
          base_lane: BA
        as: PDCoordinator
      trigger:
      - call: GET /pd/employees
        payload: {}
        as: PDCoordinator
