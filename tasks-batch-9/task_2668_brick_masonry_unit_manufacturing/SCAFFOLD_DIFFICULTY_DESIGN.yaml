  # =======================================================================
  # RULE 6 - boundary_precision_check
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: absorption_index_exactly_eight_grades_sw_while_eight_point_zero_six_grades_mw
        grounds:
          - calculations.body_blend_chemistry
          - entities.BodyFormulation.fields.absorption_index
          - entities.BodyFormulation.fields.computed_durability_grade
          - endpoints["POST /formulations/{id}/qualify"]
        distinguishing_aspect: |
          The boundary is a two-decimal chemistry THRESHOLD with an inclusive lower
          band: absorption_index 8.00 is severe-weathering SW, and the smallest
          representable step past it, 8.06, drops the body to MW. The step is produced
          by a 0.100 change in a single pit's iron_oxide_pct, which the 1.2 coefficient
          and the 50.00 percent share turn into exactly 0.06 - so an implementation
          that rounds to one decimal, or that uses a strict rather than inclusive
          comparison at 8.00, gets the grade wrong. The other instance in this rule is a
          geometric INTEGER-distance boundary on a completely different calculation.
        test_recipe:
          setup:
            - "Plant P1 ACTIVE with three clay pits: PIT-CLAY-A (CLAY, Fe 7.500, CaO 1.200), PIT-SHALE-B (SHALE, Fe 5.000, CaO 0.800) and PIT-CLAY-C (CLAY, Fe 7.400, CaO 1.200)"
            - "Formulation F1 blends PIT-CLAY-A and PIT-SHALE-B at 50.00 / 50.00"
            - "Formulation F2 blends PIT-CLAY-C and PIT-SHALE-B at 50.00 / 50.00 - identical shares, one pit swapped"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 300, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              captures: { pit_b: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-C", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.400, lime_pct: 1.200 }
              as: PlantAdmin
              captures: { pit_c: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
              captures: { f1_fe: "$.data.blend_iron_oxide_pct", f1_lime: "$.data.blend_lime_pct", f1_shale: "$.data.shale_share_pct", f1_abs: "$.data.absorption_index" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F2", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              captures: { f2: "$.data.id", f2v1: "$.data.version" }
            - call: "POST /formulations/${f2}/components"
              payload: { pit_id: "${pit_c}", share_pct: 50.00, expected_formulation_version: "${f2v1}" }
              as: BodyEngineer
              captures: { f2v2: "$.data.version" }
            - call: "POST /formulations/${f2}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f2v2}" }
              as: BodyEngineer
              captures: { f2_fe: "$.data.blend_iron_oxide_pct", f2_abs: "$.data.absorption_index" }
          trigger:
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
              captures: { f1_grade: "$.data.computed_durability_grade", f1_abs_q: "$.data.absorption_index", f1_status: "$.data.status" }
            - call: "POST /formulations/${f2}/qualify"
              payload: {}
              as: BodyEngineer
              captures: { f2_grade: "$.data.computed_durability_grade", f2_abs_q: "$.data.absorption_index", f2_status: "$.data.status" }
          assert:
            - "${f1_fe} == 6.250, ${f1_lime} == 1.000 and ${f1_shale} == 50.00"
            - "${f1_abs} == ${f1_abs_q} == 8.00 exactly - 18.0 - 1.2*6.250 - 0.08*50.00 + 1.5*1.000, no rounding drift"
            - "${f1_grade} == SW - the SW band is INCLUSIVE at 8.00, so 8.00 must NOT fall through to MW"
            - "${f2_fe} == 6.200 and ${f2_abs} == ${f2_abs_q} == 8.06 - one step past the boundary"
            - "${f2_grade} == MW - 8.06 > 8.00 so the body loses its severe-weathering rating"
            - "${f1_status} == ${f2_status} == QUALIFIED - grading does not block qualification, it only stamps the grade"
            - "A 0.100 iron_oxide_pct difference is the entire cause of the grade split, so truncation to one decimal (8.0 for both) is a detectable failure"

      - name: market_radius_inclusive_at_sixty_miles_and_rejects_sixty_one
        grounds:
          - calculations.plant_assignment_selector
          - entities.Plant.fields.market_radius_miles
          - validations[priority=43]
          - endpoints["POST /orders/{id}/assign-plant"]
        distinguishing_aspect: |
          The boundary is an INTEGER rectilinear distance compared inclusively against
          market_radius_miles: a jobsite at (30,30) is exactly 60 miles out and assigns,
          while (30,31) is 61 miles out and no plant is eligible at all, so the order is
          rejected with ERR_NO_PLANT_IN_MARKET_RADIUS instead of being assigned to a
          plant it cannot economically serve. Unlike the absorption instance this
          boundary carries no decimals - the failure mode is a strict-versus-inclusive
          comparison, not a rounding mode - and it lands on a different calculation and
          a different endpoint.
        test_recipe:
          setup:
            - "Exactly one ACTIVE plant P1 at grid (0,0) with market_radius_miles 60, rate 42 and capacity 40000"
            - "Formulation F1 QUALIFIED at P1 so the plant is genuinely servable"
            - "Order OA for 9600 units to jobsite (30,30) - |30| + |30| == 60 miles"
            - "Order OB for 9600 units to jobsite (30,31) - |30| + |31| == 61 miles"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /plants"
              payload: { plant_code: "P1", name: "Riverbend Brick", grid_x: 0, grid_y: 0, market_radius_miles: 60, freight_rate_cents_per_ton_mile: 42, base_capacity_green_units_per_day: 40000, unloading_equipment_available: ["CUSTOMER_FORKLIFT", "TRUCK_MOUNTED_FORKLIFT", "CRANE"] }
              as: PlantAdmin
              captures: { p1: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-CLAY-A", material_type: "CLAY", proven_reserve_tons: 5000.00, iron_oxide_pct: 7.500, lime_pct: 1.200 }
              as: PlantAdmin
              captures: { pit_a: "$.data.id" }
            - call: "POST /plants/${p1}/clay-pits"
              payload: { pit_name: "PIT-SHALE-B", material_type: "SHALE", proven_reserve_tons: 5000.00, iron_oxide_pct: 5.000, lime_pct: 0.800 }
              as: PlantAdmin
              captures: { pit_b: "$.data.id" }
            - call: "POST /formulations"
              payload: { plant_id: "${p1}", formulation_code: "F1", target_color_family: "RED", target_cdi: 20.00, target_soak_hours: 3.0, clay_tons_per_thousand_units: 3.20 }
              as: BodyEngineer
              captures: { f1: "$.data.id", f1v1: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_a}", share_pct: 50.00, expected_formulation_version: "${f1v1}" }
              as: BodyEngineer
              captures: { f1v2: "$.data.version" }
            - call: "POST /formulations/${f1}/components"
              payload: { pit_id: "${pit_b}", share_pct: 50.00, expected_formulation_version: "${f1v2}" }
              as: BodyEngineer
            - call: "POST /formulations/${f1}/qualify"
              payload: {}
              as: BodyEngineer
            - call: "POST /orders"
              payload: { order_code: "OA", jobsite_grid_x: 30, jobsite_grid_y: 30, requested_units: 9600, color_family: "RED", texture: "WIRE_CUT", durability_grade: "SW", unloading_equipment_required: "TRUCK_MOUNTED_FORKLIFT", banding_type: "STEEL" }
              as: SalesRep
              as_user_id: "sales-001"
              captures: { oa: "$.data.id" }
            - call: "POST /orders"
              payload: { order_code: "OB", jobsite_grid_x: 30, jobsite_grid_y: 31, requested_units: 9600, color_family: "RED", texture: "WIRE_CUT", durability_grade: "SW", unloading_equipment_required: "TRUCK_MOUNTED_FORKLIFT", banding_type: "STEEL" }
              as: SalesRep
              as_user_id: "sales-001"
              captures: { ob: "$.data.id" }
          trigger:
            - call: "POST /orders/${oa}/assign-plant"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { oa_plant: "$.data.plant_id", oa_dist: "$.data.distance_miles", oa_status: "$.data.fulfillment_status", oa_freight: "$.data.freight_status", oa_est: "$.data.estimated_freight_cents" }
            - call: "POST /orders/${ob}/assign-plant"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { ob_err: "$.data.error_id" }
            - call: "GET /orders/${ob}"
              payload: {}
              as: SalesRep
              as_user_id: "sales-001"
              captures: { ob_status: "$.data.fulfillment_status", ob_plant: "$.data.plant_id" }
          assert:
            - "${oa_plant} == ${p1} and ${oa_dist} == 60 - a jobsite exactly at market_radius_miles is INSIDE the radius"
            - "${oa_status} == ASSIGNED, ${oa_freight} == ESTIMATED and ${oa_est} == 56881 (21.60 tons, base 54432, 4.5 percent surcharge 2449)"
            - "${ob_err} == ERR_NO_PLANT_IN_MARKET_RADIUS with HTTP 422 - 61 > 60 leaves the eligible set empty"
