      - name: redress_points_average_fixed_point_excludes_redress_race_and_dnc
        mode: "(c) circular-looking dependency resolved by a pinned evaluation order"
        grounds:
          - calculations.redress_points_average
          - calculations.race_points_and_places
          - calculations.series_standing
          - entities.RaceResult.fields.finish_status
          - entities.Race.fields.rescore_count
        distinguishing_aspect: |
          The redress score looks circular - it is the mean of the target entry OTHER race points, while
          the series totals and discard set it feeds depend on that very score - and the pinned order
          (step 2 filter, step 3 mean, step 5 re-run, step 6 no recompute) is the only reading that
          produces 4.2. Entry A holds 4.4 in race 1 (FINISHED, tie), 4.0 in race 2 (DNF), 5.7 in race 3
          (the redress race) and 5.0 in race 4 (DNC minted by scoring). Step 2 drops race 3 as R* and
          drops the DNC row, so the mean is (4.4 + 4.0) / 2 = 4.2. Including the DNC gives
          (4.4 + 4.0 + 5.0) / 3 = 4.4667 -> 4.5, and including R* itself gives
          (4.4 + 4.0 + 5.7) / 3 = 4.7, so all three readings are numerically distinguishable. Step 6 is
          checked by the gross: A ends on 4.4 + 4.0 + 4.2 + 5.0 = 17.6, which no second iteration of the
          average could leave unchanged.
        test_recipe:
          setup:
            - "Ten club members and three ISSUED TOD_PHRF certificates: A 171.3, B 218.8, D 200.9."
            - "A BONUS_POINT / NONE-discard regatta racing on 2026-08-05, division A CONFIRMED with the three entries ACCEPTED, a SEATED jury panel whose chair did not measure any certificate, status RACING, three CONFIRMED whole-regatta duties."
            - "Four races at 14:00, 15:00, 16:00 and 17:00 over 6.0 nm, all STARTED and all scored FINAL with the logical clock at 2026-08-05T18:00:00Z: race 1 is a tie between A and B (4.4 each) behind D, race 2 has A DNF (4.0), race 3 has A third on 4100.0 (5.7), race 4 has no A result at all so scoring mints a DNC (5.0)."
            - "A protest by A against B over the race 3 incident at 16:20 is FILED, carries one piece of evidence, is bound to the seated panel with hearing_utc 2026-08-05T19:00:00Z, and has been HEARD with the clock advanced to 19:00."
