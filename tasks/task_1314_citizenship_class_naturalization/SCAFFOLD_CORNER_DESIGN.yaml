              as: ProgramAdmin
              captures: { vol_id: $.data.id }
          trigger:
            - call: "POST /naturalization/fee-waiver-requests/${fwr_id}/decide"
              payload: { decision: APPROVED, documented_income_cents: 1000000, documented_benefit: false }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, http 403; waiver remains SUBMITTED"

      - name: coordinator_cannot_conclude_ceremony
