            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 20000000 }, as: Borrower, as_user_id: "${b_id}", captures: { os_id: $.data.id } }
