              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /apportionment/fuel-tax-returns"
              payload: { carrier_id: "${c1_id}", filing_year: 2026, filing_quarter: 2 }
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { ret1_id: $.data.id }
            - call: "GET /apportionment/carriers/${c1_id}"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
              captures: { c1_v: $.data.version }
            - call: "POST /apportionment/fuel-tax-returns/${ret1_id}/prepare"
              payload: { expected_carrier_version: "${c1_v}" }
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "POST /apportionment/audit-selections"
              payload: { carrier_id: "${c1_id}", selection_year: 2026, selection_quarter: 2, late_filing_count: 0, retention_deficiency_count: 0 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { aud1_id: $.data.id }
          trigger:
            - call: "POST /apportionment/audit-selections/${aud1_id}/retention-review"
              payload: { expected_records_count: 20, records_missing_count: 5 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP 409 and body.data.error_id == 'ERR_AUDIT_SELECTION_NOT_SELECTED'"
            - "AuditSelection.${aud1_id}.selection_status == NOT_SELECTED and risk_score == 0"
            - "AuditSelection.${aud1_id}.retention_deficiency_ratio == null and post_review_risk_score == 0"
            - "FuelTaxReturn.${ret1_id}.return_status == PREPARED — no AUDIT_BASIS re-settlement happened"
            - "Carrier.${c1_id}.ifta_license_status == ACTIVE and suspension_count == 0"

      - name: deletion_approval_cascade_down_to_credentials
        claim_type: cascade_down
        grounds:
          - state_machines.Vehicle.state_dimensions.vehicle_status.transitions.ACTIVE_to_DELETED
          - state_machines.Credential.transitions.DISTRIBUTED_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / deletion_approval_cascades_through_vehicle_and_credentials
          rationale: "That §1.8 instance walks the full three-level DELETION cascade (change request -> vehicle -> credentials) and asserts every voided_reason_code and the re-derived vehicle credential_status."

      - name: reversal_compensates_the_apportioned_fee
        claim_type: compensation
        grounds:
          - state_machines.FleetChangeRequest.transitions.APPROVED_to_REVERSED
        excluded_because:
          difficulty_instance: compensating_invariant / application_total_apportioned_fee_restored_exactly_by_approve_reverse
          rationale: "Approve-then-reverse restoration of total_apportioned_fee, apportioned_vehicle_count and the vehicle dimension is the whole subject of that §1.8 instance."

      - name: revocation_cascade_deactivates_the_carriers_drivers
        claim_type: cross_entity
        grounds:
          - state_machines.Driver.transitions.ACTIVE_to_INACTIVE
          - state_machines.Carrier.state_dimensions.irp_account_status
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / credential_distribution_blocked_when_driver_deactivated_by_revocation
          rationale: "The retention-review revocation chain that drives ifta_license_status to REVOKED, irp_account_status to SUSPENDED and the carrier's drivers to INACTIVE is asserted end-to-end there."

      - name: reconstruction_rejection_loops_the_trip_back
        claim_type: cyclic
        grounds:
          - state_machines.TripRecord.transitions.RECONSTRUCTED_to_GAP_FLAGGED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / trip_reconstruction_rejection_cycles_back_to_gap_flagged
          rationale: "The cyclic GAP_FLAGGED -> RECONSTRUCTED -> GAP_FLAGGED loop and its per-lap side effects are exactly that §1.8 instance."

      - name: vehicle_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines.Vehicle.state_dimensions
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / vehicle_status_and_credential_status_dimensions_move_independently
          rationale: "Independence of the vehicle_status and derived credential_status dimensions is the stated subject of that §1.8 instance."

  # =====================================================================
  # SECTION 3 — CALCULATIONS (claim-extraction-guide Table 3)
  # =====================================================================
  - section: calculations
    instances:

      - name: fleet_mpg_exactly_at_the_industry_baseline_contributes_zero_to_the_risk_score
        claim_type: constants_applied
        grounds:
          - calculations.quarterly_fuel_tax_settlement.constants
          - calculations.audit_risk_score.constants
          - endpoints[POST /apportionment/audit-selections]
        distinguishing_aspect: "650.0 miles over 100.000 gallons is a fleet_mpg of exactly 6.50, the declared industry baseline, so the MPG-deviation component of the risk score is exactly 0 and with zero late filings and zero deficiencies the score is 0 — the constant is read as a signed deviation, not an absolute penalty."
