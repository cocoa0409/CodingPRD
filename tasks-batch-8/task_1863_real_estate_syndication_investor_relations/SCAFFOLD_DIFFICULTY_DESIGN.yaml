              as: Investor
              as_user_id: "${inv_a}"
              captures: { da_sub: $.data.id }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_a}/documents"
              payload: { doc_type: "W9", file_uri: "s3://ba/w9" }
              as: Investor
              as_user_id: "${inv_a}"
              captures: { da_w9: $.data.id }
            - call: "POST /syndications/${syn_id}/offerings/${off_id}/subscriptions/${sub_a}/documents"
              payload: { doc_type: "SUITABILITY_QUESTIONNAIRE", file_uri: "s3://ba/suit" }
