              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /franchise/clubs/${c1_id}"
              payload: {}
              as: BrandAdministrator
              captures: { c1_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m1_id}", home_club_id: "${c1_id}", plan_template_id: "${pt_id}", expected_club_version: "${c1_v}", signed_on: "2026-08-01", multi_club_access: false }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { ag1_id: $.data.id }
            - call: "POST /franchise/billing-events"
              payload: { agreement_id: "${ag1_id}", event_type: "DUES_POSTED", amount_cents: 9000, occurred_on: "2026-08-01", due_on: "2026-09-05" }
              as: BillingPartner
            - call: "POST /franchise/billing-events"
              payload: { agreement_id: "${ag1_id}", event_type: "PAYMENT_RECEIVED", amount_cents: 100, occurred_on: "2026-08-02" }
              as: BillingPartner
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-03T00:00:00Z" }
              as: BrandAdministrator
            - call: "POST /franchise/billing-events"
              payload: { agreement_id: "${ag1_id}", event_type: "PAYMENT_FAILED", amount_cents: 0, occurred_on: "2026-11-03" }
              as: BillingPartner
