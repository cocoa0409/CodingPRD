            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
