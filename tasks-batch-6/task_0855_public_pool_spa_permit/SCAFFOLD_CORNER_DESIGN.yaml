            - "Permit.${permit_id}.status is still UNDER_REVIEW and assessed_fee_cents == 0 after the refusal"
            - "The admin-1 attempt succeeds: Permit.${permit_id}.status == ISSUED with issued_by_user_id == admin-1"

  - section: errors
    instances:

      - name: vgb_noncompliance_blocks_issuance_after_the_enforcement_date
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_VGB_NONCOMPLIANT]", calculations.vgb_compliance_evaluation]
        distinguishing_aspect: "The VGB gate is inert before 2026-06-01 and binding on or after it: with the clock at 2026-06-15 a single-drain venue with no certification cannot be issued a permit, and ERR_VGB_NONCOMPLIANT (409) is returned."
        test_recipe:
          setup: ["The clock has been set to 2026-06-15T00:00:00Z, past VGB_ENFORCEMENT_START_DATE, and a single-drain pool has an application in UNDER_REVIEW."]
          setup_api_calls:
