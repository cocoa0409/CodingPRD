            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:31:00Z" }, as: Any }
          trigger:
            - { call: "POST /disqualifications/${dq_a}/confirm", payload: {}, as: MeetReferee, as_user_id: "${off_ref}" }
            - { call: "GET /entries/${en_a}", payload: {}, as: Any, captures: { en_a_st: "$.data.status" } }
