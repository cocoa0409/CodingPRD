scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: estimate_vs_final_patient_responsibility
        grounds:
          - calculations.estimate_patient_responsibility
          - calculations.final_patient_responsibility
          - entities.EligibilityCheck.fields.estimated_patient_responsibility_cents
          - entities.Claim.fields.patient_responsibility_cents
        distinguishing_aspect: |
          The forward-looking estimate (EligibilityCheck domain) uses billed charges
          (300000) yielding 140000, while the chronological final (Claim domain) uses
          the payer-allowed amount (200000) yielding 120000 — same encounter, two
          different entity domains, two different patient numbers.
        test_recipe:
          setup:
            - "Payer COMMERCIAL active; Patient INSURED; InsurancePolicy ACTIVE with deductible_cents=100000, coinsurance_pct=0.20, oop_max_cents=500000, plan_year 2026; BenefitAccumulator at deductible_met_cents=0, oop_met_cents=0."
            - "Encounter REGISTERED with one POSTED charge totalling 300000 cents, then ELIGIBILITY_VERIFIED so the EligibilityCheck estimate is computed against billed=300000."
            - "Encounter then driven to CODED and a claim SUBMITTED; adjudicated with allowed_amount_cents=200000."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 30, active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01", financial_class: "INSURED" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-001", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
              captures: { elig_id: $.data.id, est: $.data.estimated_patient_responsibility_cents }
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10", "E78.5"] }
              as: Coder
              captures: { coding_id: $.data.id }
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_id}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${encounter_id}"
              payload: {}
              as: BillingSpecialist
              captures: { enc_v: $.data.version }
            - call: "POST /encounters/${encounter_id}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${enc_v}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { allowed_amount_cents: 200000, claim_lines: [ { cpt_code: "99285", line_allowed_cents: 200000 } ] }
              as: BillingSpecialist
              captures: { final_pr: $.data.patient_responsibility_cents }
          assert:
            - "EligibilityCheck.${elig_id}.estimated_patient_responsibility_cents == 140000"
            - "Claim.${claim_id}.patient_responsibility_cents == 120000"
            - "EligibilityCheck.${elig_id}.estimated_patient_responsibility_cents != Claim.${claim_id}.patient_responsibility_cents"

      - name: denial_full_charges_vs_adjudication_billing
        grounds:
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.SUBMITTED_to_PARTIALLY_PAID
          - calculations.final_patient_responsibility
          - entities.Encounter.fields.patient_responsibility_cents
        distinguishing_aspect: |
          On the Claim/PatientStatement billing domain, a DENIED claim bills the patient
          the full billed charges (300000) while a PARTIALLY_PAID adjudication of the same
          coded encounter bills only the computed deductible+coinsurance (120000) — two
          valid billing approaches on the encounter account yield different patient amounts.
        test_recipe:
          setup:
            - "Two independent coded encounters (A and B) for the same ACTIVE policy (deductible 100000, coinsurance 0.20, oop_max 500000, accumulators 0), each with billed charges 300000 and a SUBMITTED claim."
            - "Claim A is DENIED (NOT_COVERED); Claim B is adjudicated with allowed_amount_cents=200000."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 30, active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01", financial_class: "INSURED" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-001", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            # ----- Encounter A (will be denied) -----
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { enc_a: $.data.id }
            - call: "POST /encounters/${enc_a}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${enc_a}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${enc_a}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${enc_a}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10", "E78.5"] }
              as: Coder
              captures: { coding_a: $.data.id }
            - call: "POST /coding-assignments/${coding_a}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_a}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${enc_a}"
              payload: {}
              as: BillingSpecialist
              captures: { enc_a_v: $.data.version }
            - call: "POST /encounters/${enc_a}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${enc_a_v}" }
              as: BillingSpecialist
              captures: { claim_a: $.data.id }
            # ----- Encounter B (will be partially paid) -----
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-02T09:00:00Z" }
              as: Registrar
              captures: { enc_b: $.data.id }
            - call: "POST /encounters/${enc_b}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${enc_b}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${enc_b}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${enc_b}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10", "E78.5"] }
              as: Coder
              captures: { coding_b: $.data.id }
            - call: "POST /coding-assignments/${coding_b}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_b}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${enc_b}"
              payload: {}
              as: BillingSpecialist
              captures: { enc_b_v: $.data.version }
            - call: "POST /encounters/${enc_b}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${enc_b_v}" }
              as: BillingSpecialist
              captures: { claim_b: $.data.id }
          trigger:
            - call: "POST /claims/${claim_a}/deny"
              payload: { denial_reason: "NOT_COVERED" }
              as: BillingSpecialist
            - call: "POST /claims/${claim_b}/adjudicate"
              payload: { allowed_amount_cents: 200000, claim_lines: [ { cpt_code: "99285", line_allowed_cents: 200000 } ] }
              as: BillingSpecialist
          assert:
            - "Encounter.${enc_a}.patient_responsibility_cents == 300000"
            - "Encounter.${enc_b}.patient_responsibility_cents == 120000"
            - "Encounter.${enc_a}.patient_responsibility_cents != Encounter.${enc_b}.patient_responsibility_cents"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: oop_cap_clips_summed_deductible_plus_coinsurance
        grounds:
          - calculations.final_patient_responsibility
          - entities.Claim.fields.patient_responsibility_cents
          - entities.BenefitAccumulator.fields.oop_met_cents
        distinguishing_aspect: |
          Mode (c) pinned-evaluation-order: deductible_applied then coinsurance_raw are
          summed FIRST, then the OOP-remaining cap clips the sum (min applied last). With
          allowed=200005, deductible 100000, coinsurance 0.20, oop_max 120000 the raw sum
          is 120001 but the result is clipped to exactly 120000 — order of cap vs sum matters.
        test_recipe:
          setup:
            - "ACTIVE policy deductible_cents=100000, coinsurance_pct=0.20, oop_max_cents=120000; accumulators 0. Coded encounter with a SUBMITTED claim; adjudicate with allowed_amount_cents=200005."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 30, active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01", financial_class: "INSURED" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-002", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 120000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 250000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10"] }
              as: Coder
              captures: { coding_id: $.data.id }
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_id}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${encounter_id}"
              payload: {}
              as: BillingSpecialist
              captures: { enc_v: $.data.version }
            - call: "POST /encounters/${encounter_id}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${enc_v}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { allowed_amount_cents: 200005, claim_lines: [ { cpt_code: "99285", line_allowed_cents: 200005 } ] }
              as: BillingSpecialist
          assert:
            - "Claim.${claim_id}.patient_responsibility_cents == 120000"
            - "BenefitAccumulator for ${policy_id} has oop_met_cents == 120000"
            - "BenefitAccumulator for ${policy_id} has deductible_met_cents == 100000"

      - name: coding_risk_three_factor_nonlinear_score
        grounds:
          - calculations.coding_compliance_risk
          - entities.CodingAssignment.fields.compliance_risk_score
          - state_machines.CodingAssignment.DRAFT_to_AUDIT_HOLD
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear interaction: the score sums three weighted factors
          (unspecified-principal flag W=40, per-secondary-over-free W=10*(count-3), and a
          charge-to-code-mismatch flag W=35) evaluated in fixed order; with principal 'R69'
          (no decimal -> unspecified=40) and 4 secondaries (1 over free -> 10) the score is
          exactly 50, hitting the >= AUDIT_THRESHOLD boundary.
        test_recipe:
          setup:
            - "Coded-ready encounter (CHARGES_CAPTURED) with one POSTED charge (one distinct CPT) and a DRAFT coding assignment whose principal_icd10='R69' and four secondary codes."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-003", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/coding-assignment"
              payload: { principal_icd10: "R69", secondary_icd10: ["I10", "E78.5", "Z79.4", "F17.210"] }
              as: Coder
              captures: { coding_id: $.data.id }
          trigger:
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
              captures: { score: $.data.compliance_risk_score, st: $.data.status }
          assert:
            - "CodingAssignment.${coding_id}.compliance_risk_score == 50"
            - "CodingAssignment.${coding_id}.status == AUDIT_HOLD"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_denied_corrected_readjudicated_cycle
        grounds:
          - state_machines.Claim.SUBMITTED_to_DENIED
          - state_machines.Claim.DENIED_to_CORRECTED
          - state_machines.Claim.SUBMITTED_to_PARTIALLY_PAID
        distinguishing_aspect: |
          The Claim machine is cyclic: SUBMITTED -> DENIED(CODING_ERROR) -> CORRECTED ->
          adjudicate -> PARTIALLY_PAID re-enters the adjudicable set, a loop no linear
          pipeline allows; this is on the Claim entity.
        test_recipe:
          setup:
            - "Coded encounter with a SUBMITTED claim (policy deductible 100000, coinsurance 0.20, oop_max 500000, accumulators 0; billed 300000)."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-004", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10"] }
              as: Coder
              captures: { coding_id: $.data.id }
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_id}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${encounter_id}"
              payload: {}
              as: BillingSpecialist
              captures: { enc_v: $.data.version }
            - call: "POST /encounters/${encounter_id}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${enc_v}" }
              as: BillingSpecialist
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/deny"
              payload: { denial_reason: "CODING_ERROR" }
              as: BillingSpecialist
            - call: "POST /claims/${claim_id}/correct"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: { allowed_amount_cents: 200000, claim_lines: [ { cpt_code: "99285", line_allowed_cents: 200000 } ] }
              as: BillingSpecialist
              captures: { st: $.data.status }
          assert:
            - "Claim.${claim_id}.status == PARTIALLY_PAID"
            - "Claim.${claim_id}.patient_responsibility_cents == 120000"

      - name: coding_audit_hold_recode_loop
        grounds:
          - state_machines.CodingAssignment.DRAFT_to_AUDIT_HOLD
          - state_machines.CodingAssignment.AUDIT_HOLD_to_DRAFT
          - state_machines.CodingAssignment.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          The CodingAssignment machine has a revision loop DRAFT -> AUDIT_HOLD ->
          return-for-recode -> DRAFT -> FINALIZED, a cycle on a different entity than
          Claim; the second finalize succeeds because the risk drops below threshold.
        test_recipe:
          setup:
            - "CHARGES_CAPTURED encounter with a DRAFT coding assignment whose first finalize scores 50 (R69 + 4 secondaries) and routes to AUDIT_HOLD."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-005", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/coding-assignment"
              payload: { principal_icd10: "R69", secondary_icd10: ["I10", "E78.5", "Z79.4", "F17.210"] }
              as: Coder
              captures: { coding_id: $.data.id }
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_id}/return-for-recode"
              payload: {}
              as: Coder
          trigger:
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
              captures: { st: $.data.status }
          assert:
            - "CodingAssignment.${coding_id}.status == AUDIT_HOLD"
            - "CodingAssignment.${coding_id}.compliance_risk_score == 50"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: adjudication_cascade_depth3_accumulator_balance
        grounds:
          - state_machines.Claim.SUBMITTED_to_PARTIALLY_PAID
          - state_machines.Encounter.CODED_to_BILLED
          - calculations.final_patient_responsibility
          - calculations.account_balance
          - entities.BenefitAccumulator.fields.oop_met_cents
        distinguishing_aspect: |
          Adjudicate (claim PARTIALLY_PAID) causes the accumulator advance, which is itself
          followed by encounter CODED->BILLED setting patient_responsibility_cents, which is
          itself followed by account_balance reconciliation and PatientStatement issuance —
          a depth-3 chain each link caused by the prior link, triggered by adjudicate.
        test_recipe:
          setup:
            - "Coded encounter with SUBMITTED claim; policy deductible 100000, coinsurance 0.20, oop_max 500000, accumulators 0; billed 300000."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
