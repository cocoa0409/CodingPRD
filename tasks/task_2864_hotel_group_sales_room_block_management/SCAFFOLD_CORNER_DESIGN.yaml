    claim_type: dual_variant_calculation
    grounds:
    - calculations.displacement_cost
    - entities.DisplacementAnalysis.fields.analysis_variant
    excluded_because:
      difficulty_instance: dual_variant_calc / displacement_forecast_series_versus_historical_series
      rationale: The named §1.8 instance runs the same lead under both analysis_variant values on one
        inventory series and asserts the diverging displaced room nights, displacement cost and verdict,
