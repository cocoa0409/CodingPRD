  - rule_id: resource_temporal_overlap
    instances:
      - name: arena_performance_half_open_adjacency_allowed
        grounds: ["validations[priority=14]", "errors[ERR_PERFORMANCE_OVERLAP]", entities.Performance.fields.starts_at]
        distinguishing_aspect: "Half-open [starts_at, ends_at) semantics on the arena resource: a 16:00 start touching an existing 14:00-16:00 performance is accepted (adjacent, no shared instant), while a 15:00-17:00 request is rejected with ERR_PERFORMANCE_OVERLAP."
        test_recipe:
          setup: ["Rodeo exists; no performances yet"]
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "Twin Falls Rodeo", city: "Twin Falls", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Matinee", arena: "Main", starts_at: "2026-08-14T14:00:00Z", ends_at: "2026-08-14T16:00:00Z", arena_capacity: 300 }, as: CommitteeAdmin, captures: { p_a: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Evening", arena: "Main", starts_at: "2026-08-14T16:00:00Z", ends_at: "2026-08-14T18:00:00Z", arena_capacity: 300 }, as: CommitteeAdmin, captures: { p_b: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Overlap", arena: "Main", starts_at: "2026-08-14T15:00:00Z", ends_at: "2026-08-14T17:00:00Z", arena_capacity: 300 }, as: CommitteeAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "SecondArena", arena: "Warmup", starts_at: "2026-08-14T15:00:00Z", ends_at: "2026-08-14T17:00:00Z", arena_capacity: 100 }, as: CommitteeAdmin, captures: { p_c: $.data.id } }
          assert:
            - "Performance ${p_b} created 201: 16:00 start equals existing 16:00 end — half-open adjacency is allowed"
            - "Overlapping request returns ERR_PERFORMANCE_OVERLAP (409)"
            - "Same time window on arena 'Warmup' (${p_c}) succeeds — the resource key is (rodeo, arena)"

      - name: judge_buffered_travel_interval_blocks_adjacent_gigs
        grounds: ["validations[priority=15]", "errors[ERR_JUDGE_CONFLICT]", "endpoints.POST_/api/judge-assignments"]
        distinguishing_aspect: "Buffered-interval semantics on the judge resource, differing from the arena's half-open rule: a 16:00-18:00 assignment conflicts with an existing 14:00-16:00 assignment because the 45-minute travel buffers ([13:15,16:45) vs [15:15,18:45)) intersect even though the raw intervals only touch; an 18:00-20:00 assignment is clear."
        test_recipe:
          setup:
            - "Rodeo with three back-to-back performances on arena Main: 14:00-16:00, 16:00-18:00, 18:00-20:00 (all legal under half-open arena rules)"
            - "Judge J registered"
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "Moab Rodeo", city: "Moab", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "P1", arena: "Main", starts_at: "2026-08-14T14:00:00Z", ends_at: "2026-08-14T16:00:00Z", arena_capacity: 300 }, as: CommitteeAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "P2", arena: "Main", starts_at: "2026-08-14T16:00:00Z", ends_at: "2026-08-14T18:00:00Z", arena_capacity: 300 }, as: CommitteeAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "P3", arena: "Main", starts_at: "2026-08-14T18:00:00Z", ends_at: "2026-08-14T20:00:00Z", arena_capacity: 300 }, as: CommitteeAdmin, captures: { p3: $.data.id } }
            - { call: "POST /api/judges", payload: { card_number: "J-14", full_name: "Judge Quatorze", certification: PRCA_GOLD }, as: CommitteeAdmin, captures: { j_id: $.data.id } }
          trigger:
            - { call: "POST /api/judge-assignments", payload: { judge_id: "${j_id}", performance_id: "${p1}", position: ARENA_1 }, as: CommitteeAdmin, captures: { ja1: $.data.id } }
            - { call: "POST /api/judge-assignments", payload: { judge_id: "${j_id}", performance_id: "${p2}", position: ARENA_1 }, as: CommitteeAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/judge-assignments", payload: { judge_id: "${j_id}", performance_id: "${p3}", position: TIMER }, as: CommitteeAdmin, captures: { ja3: $.data.id } }
          assert:
            - "Assignment to P1 succeeds (${ja1})"
            - "Assignment to P2 (adjacent, touching at 16:00) returns ERR_JUDGE_CONFLICT — buffered intervals [13:15,16:45) and [15:15,18:45) intersect"
            - "Assignment to P3 (18:00-20:00) succeeds (${ja3}): buffered [17:15,20:45) is disjoint from [13:15,16:45)"

  - rule_id: compensating_invariant
    instances:
      - name: entry_create_then_cancel_leaves_purse_unchanged
        grounds: [calculations.purse_and_places, state_machines.Entry.ENTERED_to_CANCELLED, entities.Entry.fields.refunded_contribution_cents]
        distinguishing_aspect: "Money conservation: purse_cents == added_money_cents + sum(contribution_charges_cents - refunded_contribution_cents). The forward action (entry create, +1160) paired with its compensating action (CANCEL_ENTRY, refund 1160 of purse contribution) leaves the event purse exactly at its 51160-cent baseline."
        test_recipe:
          setup:
            - "Rodeo ENTRIES_OPEN, one BULL_RIDING event (fee=2000, added=50000, places=1); contestant C1 already entered (baseline purse 51160)"
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "St Paul Rodeo", city: "St Paul", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/rodeo-events", payload: { rodeo_id: "${r_id}", event_code: BULL_RIDING, go_rounds: 1, entry_fee_cents: 2000, added_money_cents: 50000, per_performance_slots: 10, payout_places: 1 }, as: CommitteeAdmin, captures: { ev_id: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Friday", arena: "Main", starts_at: "2026-08-14T19:00:00Z", ends_at: "2026-08-14T22:00:00Z", arena_capacity: 300 }, as: CommitteeAdmin }
            - { call: "POST /api/rodeos/${r_id}/transition", payload: { action: OPEN_ENTRIES }, as: CommitteeAdmin }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-151", full_name: "Rider V" }, as: EntryOffice, captures: { c1: $.data.id } }
            - { call: "POST /api/contestants", payload: { card_number: "PRCA-152", full_name: "Rider W" }, as: EntryOffice, captures: { c2: $.data.id } }
            - { call: "POST /api/entries", payload: { contestant_id: "${c1}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e1: $.data.id } }
            - { call: "POST /api/payouts/compute", payload: { rodeo_event_id: "${ev_id}", variant: PROVISIONAL }, as: CommitteeAdmin, captures: { purse_base: $.data.purse_cents } }
          trigger:
            - { call: "POST /api/entries", payload: { contestant_id: "${c2}", rodeo_event_id: "${ev_id}" }, as: EntryOffice, captures: { e2: $.data.id } }
            - { call: "POST /api/payouts/compute", payload: { rodeo_event_id: "${ev_id}", variant: PROVISIONAL }, as: CommitteeAdmin, captures: { purse_mid: $.data.purse_cents } }
            - { call: "POST /api/entries/${e2}/transition", payload: { action: CANCEL_ENTRY }, as: EntryOffice }
            - { call: "POST /api/payouts/compute", payload: { rodeo_event_id: "${ev_id}", variant: PROVISIONAL }, as: CommitteeAdmin, captures: { purse_end: $.data.purse_cents } }
            - { call: "GET /api/entries/${e2}", payload: {}, as: CommitteeAdmin }
          assert:
            - "purse_base == 51160; purse_mid == 52320 (+1160 contribution); purse_end == 51160 exactly — forward + compensating pair leaves the conserved money quantity unchanged"
            - "Entry ${e2}: status == CANCELLED, refunded_cents == 1400 (contribution 1160 + retention 240; sanction 600 kept), refunded_contribution_cents == 1160"

      - name: ticket_purchase_then_refund_restores_exact_seat_inventory
        grounds: [calculations.ticket_capacity_check, state_machines.TicketOrder.PAID_to_REFUNDED, entities.Performance.fields.sold_tickets]
        distinguishing_aspect: "Seat-inventory conservation (a different conserved quantity than purse money): sold_tickets == sum of quantity over PAID orders, so purchase (60, then 40) followed by the refund of the 60-seat order restores sold_tickets to exactly 40."
        test_recipe:
          setup: ["Rodeo with one performance, arena_capacity 100, sold_tickets 0"]
          setup_api_calls:
            - { call: "POST /api/rodeos", payload: { name: "Sisters Rodeo", city: "Sisters", entries_close_at: "2026-08-10T00:00:00Z" }, as: CommitteeAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/performances", payload: { rodeo_id: "${r_id}", label: "Saturday", arena: "Main", starts_at: "2026-08-15T14:00:00Z", ends_at: "2026-08-15T17:00:00Z", arena_capacity: 100 }, as: CommitteeAdmin, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /api/ticket-orders", payload: { performance_id: "${p_id}", section: "GA", quantity: 60, unit_price_cents: 2500 }, as: BoxOffice, captures: { t1: $.data.id } }
            - { call: "POST /api/ticket-orders", payload: { performance_id: "${p_id}", section: "GA", quantity: 40, unit_price_cents: 2500 }, as: BoxOffice, captures: { t2: $.data.id } }
            - { call: "POST /api/ticket-orders/${t1}/transition", payload: { action: REFUND }, as: BoxOffice }
            - { call: "GET /api/performances/${p_id}", payload: {}, as: BoxOffice }
          assert:
            - "sold_tickets progression: 60 after first order, 100 after second, 40 after refunding ${t1}"
            - "TicketOrder ${t1}.status == REFUNDED; ${t2}.status == PAID"
            - "Invariant holds: sold_tickets (40) == sum of quantity over PAID orders (40); the purchase+refund pair left inventory unchanged at its pre-purchase level relative to the surviving order"
