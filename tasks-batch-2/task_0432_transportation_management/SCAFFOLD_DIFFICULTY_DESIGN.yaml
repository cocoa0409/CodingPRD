  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_appointment_overlap_halfopen_per_door
        grounds:
          - validations[priority=10]
          - entities.DockAppointment.fields.dock_door
          - entities.DockAppointment.fields.start_minute
          - entities.DockAppointment.fields.end_minute
        distinguishing_aspect: |
          DockAppointment uses HALF-OPEN [start,end) per-door overlap: a new
          [30,90) appointment on door D1 overlaps an existing [0,60) on D1
          (they share [30,60)) -> ERR_DOCK_DOUBLE_BOOKED. Interval arithmetic:
          overlap iff new.start < existing.end AND existing.start < new.end.
        test_recipe:
          setup:
            - "Door D1 has a SCHEDULED appointment [0,60) for a load on carrier A."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load1_id: $.data.id }
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load2_id: $.data.id }
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load1_id}", dock_door: "D1", start_minute: 0, end_minute: 60 }
              as: DockOps
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /tms/dock-appointments"
              payload: { load_id: "${load2_id}", dock_door: "D1", start_minute: 30, end_minute: 90 }
              as: DockOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_DOCK_DOUBLE_BOOKED"
            - "response.http_status == 409"

      - name: contract_rate_window_overlap_closed_per_lane
        grounds:
          - validations[priority=16]
          - entities.ContractRate.fields.effective_start_minute
          - entities.ContractRate.fields.effective_end_minute
        distinguishing_aspect: |
          ContractRate uses CLOSED [start,end] per-lane overlap (a different
          interval semantics and resource than DockAppointment): a new rate with
          window [60,120] on the same (carrier,TL,Z1,Z2) lane overlaps an
          existing [0,60] because they SHARE the boundary minute 60 (closed) ->
          ERR_RATE_WINDOW_OVERLAP. Under half-open semantics this would be
          allowed; closed semantics reject it.
        test_recipe:
          setup:
            - "Carrier A (TL) has one ACTIVE rate on lane Z1->Z2 with window [0,60]."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 60 }
              as: CarrierOps
              captures: { rate1_id: $.data.id }
          trigger:
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 300, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 60, effective_end_minute: 120 }
              as: CarrierOps
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RATE_WINDOW_OVERLAP"
            - "response.http_status == 409"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: load_weight_conservation_add_then_cancel_detach
        grounds:
          - calculations.load_consolidation
          - state_machines.Load.BUILDING_to_DISPATCHED
          - state_machines.Shipment.execution_status=PENDING_to_execution_status=CANCELLED
          - entities.Load.fields.consolidated_weight_lbs
        distinguishing_aspect: |
          Conserved quantity = Load.consolidated_weight_lbs (pounds). Adding a
          6000-lb shipment raises it 0 -> 6000; cancelling that shipment detaches
          it and recomputes consolidated_weight_lbs back to 0. Forward action
          (add) + compensating action (cancel-detach) leaves the named quantity
          exactly at its pre-add value (0), no drift.
        test_recipe:
          setup:
            - "Load (capacity 10000, BUILDING) with one 6000-lb BOOKED shipment consolidated (consolidated 6000)."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 6000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
            - call: "POST /tms/loads"
              payload: { carrier_id: "${carrier_a_id}", planned_capacity_lbs: 10000 }
              as: DockOps
              captures: { load_id: $.data.id, load_v: $.data.version }
            - call: "POST /tms/loads/${load_id}/shipments"
              payload: { shipment_id: "${ship_id}", expected_load_version: "${load_v}" }
              as: DockOps
          trigger:
            - call: "POST /tms/shipments/${ship_id}/cancel"
              payload: {}
              as: ShipperOps
          assert:
            - "Shipment.${ship_id}.execution_status == CANCELLED"
            - "Shipment.${ship_id}.load_id == null"
            - "Load.${load_id}.consolidated_weight_lbs == 0"

      - name: carrier_assignment_conservation_book_then_cancel_clears
        grounds:
          - state_machines.Shipment.tender_status=TENDERED_to_tender_status=BOOKED
          - state_machines.Shipment.execution_status=PENDING_to_execution_status=CANCELLED
          - entities.Shipment.fields.assigned_carrier_id
          - entities.Shipment.fields.quoted_cost_cents
        distinguishing_aspect: |
          Conserved quantity = the shipment's carrier-assignment bundle
          (assigned_carrier_id, contract_rate_id, quoted_cost_cents — a
          DIFFERENT conserved quantity than load weight). Accepting a tender
          sets assigned_carrier_id and quoted_cost_cents=91250; cancelling the
          shipment clears all three back to null and reverts tender_status to
          UNTENDERED, leaving zero residual carrier exposure.
        test_recipe:
          setup:
            - "Shipment BOOKED on carrier A with quoted_cost_cents=91250, execution_status PENDING (not on a load)."
          setup_api_calls:
            - call: "POST /tms/carriers"
              payload: { name: "Acme TL", scac: "ACME", mode: "TL" }
              as: CarrierOps
              captures: { carrier_a_id: $.data.id }
            - call: "POST /tms/contract-rates"
              payload: { carrier_id: "${carrier_a_id}", mode: "TL", origin_zone: "Z1", dest_zone: "Z2", base_rate_per_mile_cents: 250, min_charge_cents: 50000, fuel_surcharge_pct: 0.15, effective_start_minute: 0, effective_end_minute: 1000 }
              as: CarrierOps
            - call: "POST /tms/orders"
              payload: { customer_ref: "C1", origin_zone: "Z1", dest_zone: "Z2", weight_lbs: 10000, declared_value_cents: 200000 }
              as: ShipperOps
              captures: { order_id: $.data.id }
            - call: "POST /tms/shipments"
              payload: { order_id: "${order_id}", mode: "TL", distance_miles: 300, weight_lbs: 6000, promised_eta_minute: 500 }
              as: ShipperOps
              captures: { ship_id: $.data.id }
            - call: "POST /tms/shipments/${ship_id}/tenders"
              payload: { tender_minute: 100 }
              as: ShipperOps
              captures: { tender_id: $.data.id }
            - call: "POST /tms/tenders/${tender_id}/accept"
              payload: {}
              as: CarrierOps
          trigger:
            - call: "POST /tms/shipments/${ship_id}/cancel"
              payload: {}
              as: ShipperOps
          assert:
            - "Shipment.${ship_id}.assigned_carrier_id == null"
            - "Shipment.${ship_id}.contract_rate_id == null"
            - "Shipment.${ship_id}.quoted_cost_cents == null"
            - "Shipment.${ship_id}.tender_status == UNTENDERED"
