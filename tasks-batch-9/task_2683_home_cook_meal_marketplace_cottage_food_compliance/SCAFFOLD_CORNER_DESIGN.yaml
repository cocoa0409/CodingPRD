          assert:
            - "${e_window} == ERR_INVALID_WINDOW_TRANSITION with HTTP 409: OPEN -> CLOSED is not a declared edge, so the clock gates on the intermediate edges are never even consulted"
            - "${st_status} == DRAFT: statement creation itself is legal on an OPEN window - only finalization needs a CLOSED one"
            - "${e_statement} == ERR_INVALID_STATEMENT_TRANSITION with HTTP 409: DRAFT -> PAID skips FINALIZED"
