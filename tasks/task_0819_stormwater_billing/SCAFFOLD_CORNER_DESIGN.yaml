scaffold_corner_design:

  # =========================================================================
  # section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: account_create_returns_all_fields
        claim_type: creation
        grounds: [entities.Account.fields.owner_name, entities.Account.fields.billing_method]
        distinguishing_aspect: "POST /accounts with required fields returns 201 and echoes owner_name plus system id/created_at/version."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
          assert:
            - "response code == 201"
            - "Account.${acct}.owner_name == Rivera"
            - "Account.${acct}.version == 1 and outstanding_balance_cents == 0"

      - name: account_billing_method_default_applied
        claim_type: defaults
        grounds: [entities.Account.fields.billing_method]
        distinguishing_aspect: "Omitting billing_method applies the declared default UTILITY_BILL."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
          assert:
            - "Account.${acct}.billing_method == UTILITY_BILL"

      - name: account_missing_owner_name_returns_missing_field
        claim_type: required_fields
        grounds: [entities.Account.fields.owner_name, "errors[ERR_MISSING_FIELD]"]
        distinguishing_aspect: "POST /accounts without owner_name returns ERR_MISSING_FIELD (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { contact_email: "r@x.com" }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MISSING_FIELD"

      - name: parcel_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Parcel, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /parcels/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /parcels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: parcel_billable_eru_computed_from_measurement
        claim_type: computed_fields
        grounds: [entities.Parcel.fields.billable_eru, entities.Parcel.fields.current_fee_cents, calculations.eru_assessment]
        distinguishing_aspect: "A 9000 sqft ACTIVE measurement yields Parcel.billable_eru==3.0 and current_fee_cents==11500."
        test_recipe:
          setup: ["Account + parcel."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CN1", land_use: "RESIDENTIAL_SF" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 9000, method: "AERIAL", expected_parcel_version: "${pv0}" }
              as: Assessor
          assert:
            - "Parcel.${parcel}.status == ACTIVE"
            - "Parcel.${parcel}.billable_eru == 3.0"
            - "Parcel.${parcel}.current_fee_cents == 11500"

      - name: eru_rounding_applies_exemption_to_area_first
        claim_type: computed_fields
        grounds: [calculations.eru_assessment, entities.Parcel.fields.exempt_pct, entities.Parcel.fields.billable_eru]
        distinguishing_aspect: "13650 sqft with a GRANTED 0.20 exemption gives billable_eru==3.6 (area-first: round(10920/3000,1)), not 3.7 (eru-first)."
        test_recipe:
          setup: ["Parcel measured 13650 sqft; exemption granted at 0.20."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CN2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 13650, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /exemptions"
              payload: { parcel_id: "${parcel}", category: "LOW_IMPACT", requested_pct: 0.20 }
              as: Assessor
              captures: { exemption: $.data.id }
          trigger:
            - call: "POST /exemptions/${exemption}/decision"
              payload: { outcome: "GRANT", granted_pct: 0.20 }
              as: Assessor
          assert:
            - "Parcel.${parcel}.exempt_pct == 0.20"
            - "Parcel.${parcel}.billable_eru == 3.6"
            - "Parcel.${parcel}.current_fee_cents == 13600"

  # =========================================================================
  # section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: measurement_supersede_marks_prior_superseded
        claim_type: side_effect_execution
        grounds: [state_machines.ImperviousMeasurement.ACTIVE_to_SUPERSEDED, "concurrency_rules[measurement-create-stale-parcel]"]
        distinguishing_aspect: "Recording a second measurement (with the CURRENT parcel version) moves the first to SUPERSEDED and the second to ACTIVE."
        test_recipe:
          setup: ["Parcel with one ACTIVE measurement (9000 sqft)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-SM3", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 9000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
              captures: { m1: $.data.id }
            - call: "GET /parcels/${parcel}"
              payload: {}
              as: Assessor
              captures: { pv1: $.data.version }
          trigger:
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 12000, method: "FIELD_SURVEY", expected_parcel_version: "${pv1}" }
              as: Assessor
              captures: { m2: $.data.id }
          assert:
            - "ImperviousMeasurement.${m1}.status == SUPERSEDED"
            - "ImperviousMeasurement.${m2}.status == ACTIVE"
            - "Parcel.${parcel}.impervious_area_sqft == 12000 and billable_eru == 4.0"

      - name: void_already_void_bill_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.StormwaterBill.ISSUED_to_VOID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Voiding a bill that is already VOID returns ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["Parcel (eru 2.0) with a bill that has been VOIDED."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-SM4", land_use: "RESIDENTIAL_MF" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 6000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /bills/${bill}/void"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /bills/${bill}/void"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: appeal_decide_from_submitted_returns_not_reviewable
        claim_type: invalid_transition
        grounds: [state_machines.Appeal.UNDER_REVIEW_to_UPHELD, "errors[ERR_APPEAL_NOT_REVIEWABLE]"]
        distinguishing_aspect: "Deciding an appeal still in SUBMITTED (never reviewed) returns ERR_APPEAL_NOT_REVIEWABLE."
        test_recipe:
          setup: ["Parcel (ACTIVE) with a SUBMITTED appeal."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-SM5", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 9000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /appeals"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", grounds: "LAND_USE_ERROR", narrative: "wrong class" }
              as: StormwaterAdmin
              captures: { appeal: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal}/decide"
              payload: { outcome: "UPHELD" }
              as: StormwaterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPEAL_NOT_REVIEWABLE"

      - name: appeal_remeasure_on_non_measurement_grounds_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Appeal.UNDER_REVIEW_to_NEEDS_REMEASURE, "errors[ERR_APPEAL_NOT_REVIEWABLE]"]
        distinguishing_aspect: "Requesting remeasure on a LAND_USE_ERROR appeal (grounds != MEASUREMENT_ERROR) returns ERR_APPEAL_NOT_REVIEWABLE."
        test_recipe:
          setup: ["A LAND_USE_ERROR appeal moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-SM6", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 9000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /appeals"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", grounds: "LAND_USE_ERROR", narrative: "wrong class" }
              as: StormwaterAdmin
              captures: { appeal: $.data.id }
            - call: "POST /appeals/${appeal}/review"
              payload: {}
              as: StormwaterAdmin
          trigger:
            - call: "POST /appeals/${appeal}/remeasure"
              payload: {}
              as: StormwaterAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPEAL_NOT_REVIEWABLE"

  # =========================================================================
  # section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: exemption_partial_reduces_marginal_fee
        claim_type: constants_applied
        grounds: [calculations.eru_assessment, calculations.stormwater_fee, entities.Parcel.fields.current_fee_cents]
        distinguishing_aspect: "18000 sqft with a GRANTED 0.25 exemption gives billable_eru==4.5 and current_fee_cents==16750."
        test_recipe:
          setup: ["Parcel measured 18000 sqft; exemption granted 0.25."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CA1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /exemptions"
              payload: { parcel_id: "${parcel}", category: "AGRICULTURAL", requested_pct: 0.25 }
              as: Assessor
              captures: { exemption: $.data.id }
          trigger:
            - call: "POST /exemptions/${exemption}/decision"
              payload: { outcome: "GRANT", granted_pct: 0.25 }
              as: Assessor
          assert:
            - "Parcel.${parcel}.billable_eru == 4.5"
            - "Parcel.${parcel}.current_fee_cents == 16750"

      - name: credit_amount_applied_to_creditable_base_on_bill
        claim_type: correct_result
        grounds: [calculations.bmp_credit_amount, entities.StormwaterBill.fields.credit_amount_cents, entities.StormwaterBill.fields.net_fee_cents]
        distinguishing_aspect: "A MARGINAL bill (eru 6.0) with an ACTIVE provisional credit (self 90, pct 0.50) has credit_amount_cents==10500 and net_fee_cents==11000 (credit hits base only, not the 500 fixed charge)."
        test_recipe:
          setup: ["Parcel (eru 6.0) with an ACTIVE credit self_reported 90; then a MARGINAL bill issued."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CA2", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bmp-credits"
              payload: { parcel_id: "${parcel}", bmp_type: "PERMEABLE_PAVEMENT", self_reported_score: 90, effective_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z" }
              as: Assessor
              captures: { credit: $.data.id }
          trigger:
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z", fee_variant: "MARGINAL" }
              as: BillingClerk
              captures: { bill: $.data.id }
          assert:
            - "StormwaterBill.${bill}.credit_amount_cents == 10500"
            - "StormwaterBill.${bill}.net_fee_cents == 11000"

      - name: fund_allocation_thirty_percent_split
        claim_type: correct_result
        grounds: [calculations.fund_allocation, entities.FundLedgerEntry.fields.amount_cents]
        distinguishing_aspect: "A 10000-cent payment allocates CAPITAL 3000 and OPERATING 7000 (30% capital target, exact)."
        test_recipe:
          setup: ["Parcel (eru 6.0) with an ISSUED bill assessed 21500."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CA3", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { bill_id: "${bill}", account_id: "${acct}", amount_cents: 10000, method: "ACH" }
              as: BillingClerk
              captures: { pay: $.data.id }
          assert:
            - "the CAPITAL ALLOCATION FundLedgerEntry for ${pay} has amount_cents == 3000"
            - "the OPERATING ALLOCATION FundLedgerEntry for ${pay} has amount_cents == 7000"

      - name: zero_impervious_yields_zero_eru_fixed_charge_only
        claim_type: correct_result
        grounds: [calculations.eru_assessment, calculations.stormwater_fee]
        distinguishing_aspect: "A 0 sqft measurement gives billable_eru==0.0; fee-quote base_fee_marginal_cents==0 and marginal_assessed_cents==500 (fixed charge only)."
        test_recipe:
          setup: ["Parcel with a 0 sqft ACTIVE measurement (undeveloped)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-CA4", land_use: "UNDEVELOPED" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 0, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
          trigger:
            - call: "GET /parcels/${parcel}/fee-quote"
              payload: {}
              as: BillingClerk
              captures: { eru: $.data.billable_eru }
          assert:
            - "fee-quote billable_eru == 0.0"
            - "fee-quote base_fee_marginal_cents == 0"
            - "fee-quote marginal_assessed_cents == 500"

  # =========================================================================
  # section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: overpayment_on_payable_bill_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_OVERPAYMENT]"]
        distinguishing_aspect: "Paying 30000 on a payable bill whose outstanding is 21500 returns ERR_OVERPAYMENT (422)."
        test_recipe:
          setup: ["Parcel (eru 6.0) with an ISSUED bill assessed 21500."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-VA1", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 18000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acct}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { bill: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { bill_id: "${bill}", account_id: "${acct}", amount_cents: 30000, method: "ACH" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OVERPAYMENT"

      - name: duplicate_parcel_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DUPLICATE_PARCEL]"]
        distinguishing_aspect: "A second parcel reusing an existing parcel_number returns ERR_DUPLICATE_PARCEL (409)."
        test_recipe:
          setup: ["An account and one parcel with parcel_number P-DUP."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-DUP", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id }
          trigger:
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-DUP", land_use: "INDUSTRIAL" }
              as: Assessor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_PARCEL"

      - name: bill_account_parcel_mismatch_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=9]", "errors[ERR_ACCOUNT_PARCEL_MISMATCH]"]
        distinguishing_aspect: "Issuing a bill whose account_id differs from parcel.account_id returns ERR_ACCOUNT_PARCEL_MISMATCH (422)."
        test_recipe:
          setup: ["Two accounts A and B; a parcel (ACTIVE) owned by A."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "A", contact_email: "a@x.com" }
              as: Assessor
              captures: { acctA: $.data.id }
            - call: "POST /accounts"
              payload: { owner_name: "B", contact_email: "b@x.com" }
              as: Assessor
              captures: { acctB: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acctA}", parcel_number: "P-VA3", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
              payload: { parcel_id: "${parcel}", measured_sqft: 9000, method: "GIS", expected_parcel_version: "${pv0}" }
              as: Assessor
          trigger:
            - call: "POST /bills"
              payload: { parcel_id: "${parcel}", account_id: "${acctB}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", due_date: "2026-04-30T00:00:00Z" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_PARCEL_MISMATCH"

      - name: bill_inverted_period_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_PERIOD]"]
        distinguishing_aspect: "A bill with period_start after period_end returns ERR_INVALID_PERIOD (422)."
        test_recipe:
          setup: ["Parcel (ACTIVE)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { owner_name: "Rivera", contact_email: "r@x.com" }
              as: Assessor
              captures: { acct: $.data.id }
            - call: "POST /parcels"
              payload: { account_id: "${acct}", parcel_number: "P-VA4", land_use: "COMMERCIAL" }
              as: Assessor
              captures: { parcel: $.data.id, pv0: $.data.version }
            - call: "POST /impervious-measurements"
