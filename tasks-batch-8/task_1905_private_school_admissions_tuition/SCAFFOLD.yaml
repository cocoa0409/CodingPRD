# =============================================================================
# Task 1905 — Private School Admissions & Tuition Assistance (NAIS independent school)
# Scaffold seed tables (§1.0–§1.7). Difficulty/corner designs live in sibling files.
# =============================================================================

scenario: |
  1905. Private School Admissions & Tuition Assistance (NAIS independent school):
  inquiry-to-application funnel & deadline rounds, entrance testing/interview &
  committee ranking, sibling/legacy preference & class composition targets,
  financial-aid application with income verification & award formula, enrollment
  contract & deposit deadlines, waitlist movement & summer melt, re-enrollment &
  tuition increase notification, aid budget pacing & appeal

domain_name: private-school-admissions
api_prefix: /admissions

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation          # finite grade seats + finite aid budget, competed for
  secondary_archetype: workflow_orchestration  # inquiry -> application -> evaluation -> decision -> contract -> enrollment
  complexity_layers:
    - optimistic_concurrency                   # OCC on Student.version (reenrollment re-issue) and EntranceEvaluation.version (reschedule)
    - cascading_side_effects                   # lapse/melt/decline -> award release -> budget uncommit -> seat free -> waitlist promotion
    - dual_variant_calculation                 # provisional vs verified aid award; estimated vs final deposit
    - ops_run_checkpoint                       # close-round decision sweep + run-sweep (offer expiry, contract lapse, waitlist promotion, melt)
  entity_topology: flat                        # peer collections under /admissions, FK references in bodies/filters, no URL nesting
  state_machine_shape: branching               # Application decision fork {OFFERED, WAITLISTED, DENIED} with waitlist->OFFERED join; AidApplication carries two parallel cyclic dimensions
  relationship_patterns:
    - one_to_many                              # cycle -> sections/applications; application -> evaluations/aid/contract
    - cross_aggregate                          # Student (current enrollment) referenced by sibling-preference verification and re-enrollment offers
  role_model: segregation_of_duties            # the FinancialAidOfficer user who verifies income may not finalize or revise that award
  consistency_model: immediate                 # every mutation is atomic in its request; derived counters recomputed in-request

# Logical clock: all deadline/expiry/lapse comparisons read the server logical clock.
# The clock starts at exactly 2026-08-01T00:00:00Z on every server boot (never wall-clock)
# and moves only via POST /_clock/set_current_utc (see §1.5).

# =============================================================================
# §1.1 Entity-Relationship Table
# (all ids are server-minted UUIDs with no type prefix; ids are identity-only and
#  never participate in ranking/selection/tie-break decisions — created_at ASC is
#  the only sanctioned fallback ordering)
# =============================================================================
entities:
  - name: AdmissionCycle
    parent: null
    common_fields: true
    fields:
      - { name: academic_year, type: string, source: input, description: "Academic year label the cycle admits into, e.g. '2027-2028'" }
      - { name: early_deadline_at, type: datetime, source: input, description: "Last instant (inclusive) for EARLY round submission" }
      - { name: regular_deadline_at, type: datetime, source: input, description: "Last instant (inclusive) for REGULAR round submission" }
      - { name: reenroll_response_deadline_at, type: datetime, source: input, description: "Last instant (inclusive) for families to respond to re-enrollment offers targeting this cycle" }
      - { name: melt_deadline_at, type: datetime, source: input, description: "After this instant the waitlist is expired and no further promotions occur (summer melt boundary)" }
      - { name: aid_budget_total_cents, type: integer, source: input, description: "Total financial-aid budget for the cycle, cents, >= 0" }
      - { name: aid_committed_cents, type: integer, source: computed, default: 0, description: "Sum of final_award_cents over AidApplications in this cycle whose award_status == ACCEPTED" }
      - { name: pacing_cap_cents, type: integer, source: computed, description: "Current aid commitment ceiling per aid_pacing_cap calculation: OPEN -> 40% of budget, EARLY_CLOSED -> 75%, CLOSED/ARCHIVED -> 100%" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | EARLY_CLOSED | CLOSED | ARCHIVED" }

  - name: GradeSection
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> AdmissionCycle.id; cycle this section belongs to" }
      - { name: grade_level, type: enum, source: input, description: "K | G1 | G2 | G3 | G4 | G5 | G6 | G7 | G8 | G9 | G10 | G11 | G12" }
      - { name: capacity, type: integer, source: input, description: "Total new-enrollment seats for this grade in this cycle, >= 1" }
      - { name: tuition_cents, type: integer, source: input, description: "Gross annual tuition for this grade in this cycle, >= 0" }
      - { name: max_aid_seat_pct, type: number, source: input, description: "Class composition target: maximum share of capacity that may be held by aid-seeking admits, 0..1" }
      - { name: seats_held, type: integer, source: computed, default: 0, description: "Count of Applications in this section with status in {OFFERED, CONTRACT_ISSUED, ENROLLED}" }
      - { name: aid_seats_held, type: integer, source: computed, default: 0, description: "Count of seats_held Applications that have a linked AidApplication with award_status != RELEASED" }
      - { name: seats_available, type: integer, source: computed, description: "= capacity - seats_held; never negative" }

  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "Family account identifier; when created by a Parent caller it MUST equal the caller's X-User-ID" }
      - { name: first_name, type: string, source: input, description: "Applicant first name" }
      - { name: last_name, type: string, source: input, description: "Applicant last name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD" }
      - { name: legacy_parent, type: boolean, source: input, default: false, description: "True if a parent is an alumnus (legacy preference flag)" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "Family account identifier this student belongs to" }
      - { name: first_name, type: string, source: input, description: "Student first name" }
      - { name: last_name, type: string, source: input, description: "Student last name" }
      - { name: current_grade_section_id, type: string, source: input, description: "FK -> GradeSection.id; section the student is currently enrolled in" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE (soft-deactivated by summer melt; rows are never deleted)" }
      - { name: source, type: enum, source: system, description: "DIRECT (admin-created) | ADMISSION (created by enrollment cascade)" }
      - { name: re_enrolled_for_cycle_id, type: string, source: system, description: "FK -> AdmissionCycle.id; set when family accepts a re-enrollment offer; null otherwise" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; child applying" }
      - { name: cycle_id, type: string, source: input, description: "FK -> AdmissionCycle.id; admission cycle applied to" }
      - { name: grade_section_id, type: string, source: input, description: "FK -> GradeSection.id; grade+section applied for; section's cycle MUST equal cycle_id" }
      - { name: round, type: enum, source: input, description: "EARLY | REGULAR" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | EVALUATION_COMPLETE | OFFERED | CONTRACT_ISSUED | WAITLISTED | ENROLLED | DENIED | DECLINED | WITHDRAWN | EXPIRED | MELTED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submission; null until submitted" }
      - { name: composite_score, type: number, source: computed, description: "Committee composite per composite_score calculation; null until both evaluations are SCORED" }
      - { name: preference_points, type: integer, source: computed, default: 0, description: "Sibling (10 if verified) + legacy (5 if flagged) points folded into composite_score" }
      - { name: sibling_verified, type: boolean, source: computed, default: false, description: "True at scoring time iff an ACTIVE Student exists with the same family_id as the applicant" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Offer deadline: round-close offers get close clock + 21 days; waitlist promotions get promotion clock + 7 days; null unless OFFERED" }
      - { name: promoted_from_waitlist, type: boolean, source: system, default: false, description: "True if the current offer resulted from a waitlist promotion" }
      - { name: estimated_deposit_cents, type: integer, source: computed, description: "Deposit estimate shown on the offer letter; deposit_amount calculation in its provisional variant; null unless OFFERED/CONTRACT_ISSUED/ENROLLED" }

  - name: EntranceEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application being evaluated" }
      - { name: kind, type: enum, source: input, description: "TEST | INTERVIEW" }
      - { name: scheduled_start, type: datetime, source: input, description: "Start of the scheduled evaluation window" }
      - { name: scheduled_end, type: datetime, source: input, description: "End of the scheduled evaluation window; must be > scheduled_start" }
      - { name: interviewer_id, type: string, source: input, description: "Staff interviewer identifier; REQUIRED iff kind == INTERVIEW, forbidden otherwise" }
      - { name: test_session_id, type: string, source: input, description: "FK -> TestSession.id; REQUIRED iff kind == TEST, forbidden otherwise" }
      - { name: score, type: integer, source: input, description: "0..100, recorded by the scoring transition; null until SCORED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | SCORED | CANCELLED" }

  - name: TestSession
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> AdmissionCycle.id; cycle the test session serves" }
      - { name: session_start, type: datetime, source: input, description: "Session window start" }
      - { name: session_end, type: datetime, source: input, description: "Session window end; must be > session_start" }
      - { name: room_capacity, type: integer, source: input, description: "Maximum number of non-CANCELLED TEST evaluations in this session, >= 1" }
      - { name: booked_count, type: integer, source: computed, default: 0, description: "Count of TEST EntranceEvaluations referencing this session with status != CANCELLED" }

  - name: AidApplication
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; the admission application this aid request rides on (one aid application per admission application, ever)" }
      - { name: reported_annual_income_cents, type: integer, source: input, description: "Family-reported annual income, cents, >= 0" }
      - { name: household_size, type: integer, source: input, description: "Household member count, >= 1" }
      - { name: verified_annual_income_cents, type: integer, source: system, description: "Income after officer verification; null until first verification" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifying FinancialAidOfficer; drives segregation-of-duties checks; null until verified" }
      - { name: verification_status, type: enum, source: system, description: "SUBMITTED | VERIFIED (cyclic: resubmit-income moves VERIFIED -> SUBMITTED)" }
      - { name: provisional_award_cents, type: integer, source: computed, description: "aid_award_amount in its provisional variant (reported income); recomputed on every income submission" }
      - { name: final_award_cents, type: integer, source: computed, description: "aid_award_amount in its final variant (verified income) at finalize, or the officer-revised amount after an appeal; null while award_status == PROVISIONAL" }
      - { name: award_status, type: enum, source: system, description: "PROVISIONAL | OFFERED | ACCEPTED | APPEALED | RELEASED (cyclic OFFERED <-> APPEALED via appeal/revise)" }
      - { name: appeal_reason, type: string, source: input, description: "Family's appeal text; null unless an appeal was filed" }

  - name: EnrollmentContract
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> Application.id; application this contract enrolls (exactly one non-CANCELLED/LAPSED contract per application)" }
      - { name: tuition_cents, type: integer, source: system, description: "Grade section tuition snapshot at issuance" }
      - { name: award_cents, type: integer, source: system, description: "Accepted final award snapshot at issuance (0 when no aid)" }
      - { name: net_tuition_cents, type: integer, source: computed, description: "= tuition_cents - award_cents" }
      - { name: deposit_amount_cents, type: integer, source: computed, description: "deposit_amount calculation, final variant: max(50000, round_half_up(0.10 * net_tuition_cents))" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative deposit payments received" }
      - { name: response_due_at, type: datetime, source: system, description: "Issuance clock + 14 days; contract lapses if not ENROLLED past this instant" }
      - { name: created_student_id, type: string, source: system, description: "FK -> Student.id; student row created by the enrollment cascade; null until ENROLLED" }
      - { name: status, type: enum, source: system, description: "ISSUED | SIGNED | ENROLLED | LAPSED | CANCELLED | MELTED" }

  - name: ReenrollmentOffer
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id; currently enrolled student invited to re-enroll" }
      - { name: cycle_id, type: string, source: input, description: "FK -> AdmissionCycle.id; TARGET (upcoming-year) cycle the offer enrolls into" }
      - { name: prior_tuition_cents, type: integer, source: computed, description: "Tuition of the student's current grade section (increase notification baseline)" }
      - { name: new_tuition_cents, type: integer, source: computed, description: "Tuition of the student's next-grade section in the target cycle" }
      - { name: sibling_discount_cents, type: integer, source: computed, description: "0 for the family's senior ACTIVE student (created_at ASC); round_half_up(0.10 * new_tuition_cents) per line for each additional sibling" }
      - { name: discounted_tuition_cents, type: integer, source: computed, description: "= new_tuition_cents - sibling_discount_cents; family totals sum these per-line-rounded values (see reenrollment_family_total)" }
      - { name: response_deadline_at, type: datetime, source: computed, description: "Copied from target cycle reenroll_response_deadline_at at issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACCEPTED | DECLINED | LAPSED | SUPERSEDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AdmissionCycle
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /admissions/cycles/{cycleId}/open"
        actor: AdmissionDirector
        preconditions:
          - "Cycle has at least one GradeSection (ERR_CYCLE_HAS_NO_SECTIONS)"
        side_effects:
          - "pacing_cap_cents recomputed (OPEN phase -> 40% of aid_budget_total_cents)"

      - from: OPEN
        to: EARLY_CLOSED
        trigger: "POST /admissions/cycles/{cycleId}/close-round with round=EARLY"
        actor: AdmissionDirector
        preconditions:
          - "Payload round == EARLY (ERR_CYCLE_INVALID_STATE)"
          - "Logical clock > early_deadline_at (ERR_ROUND_STILL_OPEN)"
        side_effects:
          - "Run committee_rank_assignment over the EARLY pool (see calculation): each candidate -> OFFERED / WAITLISTED / DENIED"
          - "Each new OFFERED application sets offer_expires_at = clock + 21 days and estimated_deposit_cents (provisional deposit variant)"
          - "seats_held / aid_seats_held recomputed per affected GradeSection"
          - "pacing_cap_cents recomputed (EARLY_CLOSED phase -> 75%)"

      - from: EARLY_CLOSED
        to: CLOSED
        trigger: "POST /admissions/cycles/{cycleId}/close-round with round=REGULAR"
        actor: AdmissionDirector
        preconditions:
          - "Payload round == REGULAR (ERR_CYCLE_INVALID_STATE)"
          - "Logical clock > regular_deadline_at (ERR_ROUND_STILL_OPEN)"
        side_effects:
          - "Run committee_rank_assignment over the REGULAR pool (EARLY-waitlisted applications are NOT reconsidered)"
          - "Each new OFFERED application sets offer_expires_at = clock + 21 days and estimated_deposit_cents"
          - "seats_held / aid_seats_held recomputed per affected GradeSection"
          - "pacing_cap_cents recomputed (CLOSED phase -> 100%)"

      - from: CLOSED
        to: ARCHIVED
        trigger: "POST /admissions/cycles/{cycleId}/archive"
        actor: AdmissionDirector
        preconditions:
          - "Cycle in CLOSED (ERR_CYCLE_INVALID_STATE)"
        side_effects: []

  - entity: Application
    initial_state: DRAFT
    terminal_states: [DENIED, DECLINED, WITHDRAWN, EXPIRED, MELTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /admissions/applications/{applicationId}/submit"
        actor: Parent | AdmissionOfficer
        preconditions:
          - "Application in DRAFT (ERR_APPLICATION_NOT_DRAFT)"
          - "Cycle state allows the round: EARLY requires cycle OPEN; REGULAR requires cycle OPEN or EARLY_CLOSED (ERR_CYCLE_NOT_OPEN)"
          - "Logical clock <= the round's deadline (early_deadline_at for EARLY, regular_deadline_at for REGULAR) (ERR_ROUND_DEADLINE_PASSED)"
        side_effects:
          - "submitted_at = logical clock"

      - from: SUBMITTED
        to: EVALUATION_COMPLETE
        trigger: "system (automatic when the second of the application's TEST and INTERVIEW evaluations reaches SCORED)"
        actor: system
        preconditions:
          - "Both kinds (TEST, INTERVIEW) exist with status SCORED"
        side_effects:
          - "composite_score and preference_points computed per composite_score calculation (sibling_verified evaluated at this instant)"

      - from: EVALUATION_COMPLETE
        to: OFFERED
        trigger: "system (close-round decision sweep: candidate admitted)"
        actor: system
        preconditions:
          - "Candidate's rank position within seats_open and, for aid-seekers, within the aid-seat composition cap"
        side_effects:
          - "offer_expires_at = clock + 21 days; promoted_from_waitlist = false"
          - "estimated_deposit_cents computed (deposit provisional variant using provisional award, 0 if none)"
          - "GradeSection seats_held += 1; aid_seats_held += 1 when aid-seeking"

      - from: EVALUATION_COMPLETE
        to: WAITLISTED
        trigger: "system (close-round decision sweep: candidate past seat availability or past aid-seat cap, within waitlist band)"
        actor: system
        preconditions: []
        side_effects: []

      - from: EVALUATION_COMPLETE
        to: DENIED
        trigger: "system (close-round decision sweep: candidate past seats + waitlist band)"
        actor: system
        preconditions: []
        side_effects: []

      - from: WAITLISTED
        to: OFFERED
        trigger: "system (run-sweep waitlist promotion after a seat frees, before melt_deadline_at)"
        actor: system
        preconditions:
          - "seats_available > 0 for the grade section and this application is first by waitlist_promotion_selector"
        side_effects:
          - "offer_expires_at = promotion clock + 7 days; promoted_from_waitlist = true"
          - "estimated_deposit_cents recomputed (provisional variant)"
          - "GradeSection seats_held += 1; aid_seats_held += 1 when aid-seeking"

      - from: WAITLISTED
        to: EXPIRED
        trigger: "system (run-sweep when logical clock > melt_deadline_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OFFERED
        to: CONTRACT_ISSUED
        trigger: "POST /admissions/applications/{applicationId}/issue-contract"
        actor: AdmissionOfficer
        preconditions:
          - "Application in OFFERED (ERR_APPLICATION_NOT_OFFERED)"
          - "Logical clock <= offer_expires_at (ERR_OFFER_EXPIRED) — belt check that applies when run-sweep has not yet expired the offer"
          - "If an AidApplication exists for this application, its award_status MUST be ACCEPTED (ERR_AID_NOT_FINALIZED)"
        side_effects:
          - "Create EnrollmentContract: tuition snapshot, award snapshot, net, deposit_amount_cents (final variant), response_due_at = clock + 14 days"
          - "seats_held unchanged (already held by OFFERED)"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /admissions/applications/{applicationId}/decline"
        actor: Parent
        preconditions:
          - "Application in OFFERED (ERR_APPLICATION_NOT_OFFERED)"
        side_effects:
          - "Linked AidApplication (if any) award_status -> RELEASED; if it was ACCEPTED, cycle aid_committed_cents -= final_award_cents"
          - "GradeSection seats_held -= 1; aid_seats_held -= 1 when aid-seeking (seat freed for next run-sweep promotion)"

      - from: OFFERED
        to: EXPIRED
        trigger: "system (run-sweep when logical clock > offer_expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked AidApplication (if any) award_status -> RELEASED; if ACCEPTED, aid_committed_cents -= final_award_cents"
          - "GradeSection seats_held -= 1; aid_seats_held -= 1 when aid-seeking"

      - from: CONTRACT_ISSUED
        to: ENROLLED
        trigger: "system (automatic when the linked EnrollmentContract reaches ENROLLED)"
        actor: system
        preconditions: []
        side_effects:
          - "Student row created (source=ADMISSION, family_id from applicant, current_grade_section_id = application.grade_section_id, status ACTIVE); stored on contract.created_student_id"

      - from: CONTRACT_ISSUED
        to: EXPIRED
        trigger: "system (run-sweep when the linked EnrollmentContract lapses: clock > response_due_at while ISSUED or SIGNED)"
        actor: system
        preconditions: []
        side_effects:
          - "Linked AidApplication award_status -> RELEASED; if ACCEPTED, aid_committed_cents -= final_award_cents"
          - "GradeSection seats_held -= 1; aid_seats_held -= 1 when aid-seeking"

      - from: ENROLLED
        to: MELTED
        trigger: "POST /admissions/applications/{applicationId}/withdraw while ENROLLED (summer melt)"
        actor: Parent
        preconditions: []
        side_effects:
          - "Linked EnrollmentContract -> MELTED; deposit forfeited (paid_cents retained by school, no refund ledger entry)"
          - "Linked AidApplication award_status -> RELEASED; aid_committed_cents -= final_award_cents (award is always ACCEPTED at enrollment)"
          - "Student row referenced by contract.created_student_id -> INACTIVE"
          - "GradeSection seats_held -= 1; aid_seats_held -= 1 when aid-seeking (promotion only if clock <= melt_deadline_at)"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /admissions/applications/{applicationId}/withdraw"
        actor: Parent
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /admissions/applications/{applicationId}/withdraw"
        actor: Parent
        preconditions: []
        side_effects:
          - "Linked AidApplication (if any) award_status -> RELEASED (no budget impact: never ACCEPTED this early)"

      - from: EVALUATION_COMPLETE
        to: WITHDRAWN
        trigger: "POST /admissions/applications/{applicationId}/withdraw"
        actor: Parent
        preconditions: []
        side_effects:
          - "Linked AidApplication (if any) award_status -> RELEASED"

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /admissions/applications/{applicationId}/withdraw"
        actor: Parent
        preconditions: []
        side_effects:
          - "Linked AidApplication (if any) award_status -> RELEASED"

      - from: CONTRACT_ISSUED
        to: WITHDRAWN
        trigger: "POST /admissions/applications/{applicationId}/withdraw"
        actor: Parent
        preconditions: []
        side_effects:
          - "Linked EnrollmentContract (ISSUED or SIGNED) -> CANCELLED; paid_cents refunded out of scope (no ledger entry)"
          - "Linked AidApplication award_status -> RELEASED; if ACCEPTED, aid_committed_cents -= final_award_cents"
          - "GradeSection seats_held -= 1; aid_seats_held -= 1 when aid-seeking"

  - entity: EntranceEvaluation
    initial_state: SCHEDULED
    terminal_states: [SCORED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: SCORED
        trigger: "POST /admissions/evaluations/{evaluationId}/score"
        actor: AdmissionOfficer
        preconditions:
          - "Evaluation in SCHEDULED (ERR_EVALUATION_NOT_SCHEDULED)"
          - "score integer 0..100 (ERR_VALIDATION)"
        side_effects:
          - "If the sibling evaluation (same application, other kind) is already SCORED: compute composite_score and move Application SUBMITTED -> EVALUATION_COMPLETE"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /admissions/evaluations/{evaluationId}/cancel"
        actor: AdmissionOfficer
        preconditions:
          - "Evaluation in SCHEDULED (ERR_EVALUATION_NOT_SCHEDULED)"
        side_effects:
          - "If kind == TEST: TestSession.booked_count -= 1"

  - entity: AidApplication
    field: verification_status
    initial_state: SUBMITTED
    terminal_states: []
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /admissions/aid-applications/{aidApplicationId}/verify"
        actor: FinancialAidOfficer
        preconditions:
          - "verification_status == SUBMITTED (ERR_AID_NOT_SUBMITTED)"
        side_effects:
          - "verified_annual_income_cents set from payload; verified_by_user_id = X-User-ID"
          - "provisional_award_cents and any final_award_cents are NOT changed by verification itself"

      - from: VERIFIED
        to: SUBMITTED
        trigger: "POST /admissions/aid-applications/{aidApplicationId}/resubmit-income"
        actor: Parent
        preconditions:
          - "award_status NOT in {ACCEPTED, RELEASED} (ERR_AWARD_LOCKED)"
        side_effects:
          - "reported_annual_income_cents and household_size replaced; provisional_award_cents recomputed (provisional variant)"
          - "award_status is UNCHANGED (an OFFERED award stays OFFERED but is now stale: acceptance requires verification_status == VERIFIED)"

      - from: SUBMITTED
        to: SUBMITTED
        trigger: "POST /admissions/aid-applications/{aidApplicationId}/resubmit-income"
        actor: Parent
        preconditions:
          - "award_status NOT in {ACCEPTED, RELEASED} (ERR_AWARD_LOCKED)"
        side_effects:
          - "reported values replaced; provisional_award_cents recomputed"

  - entity: AidApplication
    field: award_status
    initial_state: PROVISIONAL
    terminal_states: [RELEASED]
    transitions:
      - from: PROVISIONAL
        to: OFFERED
        trigger: "POST /admissions/aid-applications/{aidApplicationId}/finalize-award"
        actor: FinancialAidOfficer
        preconditions:
          - "verification_status == VERIFIED (ERR_AID_NOT_VERIFIED)"
          - "award_status == PROVISIONAL (ERR_AWARD_LOCKED)"
          - "Segregation of duties: X-User-ID != verified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "final_award_cents computed (final variant over verified_annual_income_cents)"

      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /admissions/aid-applications/{aidApplicationId}/accept-award"
        actor: Parent
        preconditions:
          - "award_status == OFFERED (ERR_AWARD_NOT_OFFERED)"
          - "verification_status == VERIFIED (ERR_AWARD_STALE_VERIFICATION — family resubmitted income after finalize)"
          - "cycle.aid_committed_cents + final_award_cents <= cycle.pacing_cap_cents (ERR_AID_PACING_CAP_EXCEEDED)"
        side_effects:
          - "cycle.aid_committed_cents += final_award_cents"

      - from: OFFERED
        to: APPEALED
        trigger: "POST /admissions/aid-applications/{aidApplicationId}/appeal-award"
        actor: Parent
        preconditions:
          - "award_status == OFFERED (ERR_AWARD_NOT_APPEALABLE)"
        side_effects:
          - "appeal_reason stored"

      - from: APPEALED
        to: OFFERED
        trigger: "POST /admissions/aid-applications/{aidApplicationId}/revise-award"
        actor: FinancialAidOfficer
        preconditions:
          - "award_status == APPEALED (ERR_AWARD_NOT_APPEALED)"
          - "Segregation of duties: X-User-ID != verified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "0 <= revised_final_amount_cents <= round_half_up(0.90 * application tuition_cents) (ERR_VALIDATION)"
        side_effects:
          - "final_award_cents = revised_final_amount_cents"

      - from: PROVISIONAL
        to: RELEASED
        trigger: "system (cascade: application withdrawn/declined/expired/lapsed/melted)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OFFERED
        to: RELEASED
        trigger: "system (cascade: application withdrawn/declined/expired/lapsed/melted)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPEALED
        to: RELEASED
        trigger: "system (cascade: application withdrawn/declined/expired/lapsed/melted)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: RELEASED
        trigger: "system (cascade: application declined/withdrawn/contract lapsed/melted)"
        actor: system
        preconditions: []
        side_effects:
          - "cycle.aid_committed_cents -= final_award_cents (compensating release)"

  - entity: EnrollmentContract
    initial_state: ISSUED
    terminal_states: [LAPSED, CANCELLED, MELTED]
    transitions:
      - from: ISSUED
        to: SIGNED
        trigger: "POST /admissions/contracts/{contractId}/sign"
        actor: Parent
        preconditions:
          - "Contract in ISSUED (ERR_CONTRACT_NOT_ISSUED)"
        side_effects: []

      - from: SIGNED
        to: ENROLLED
        trigger: "system (automatic inside POST /admissions/contracts/{contractId}/deposit-payments when paid_cents >= deposit_amount_cents)"
        actor: system
        preconditions:
          - "Contract in SIGNED (payments require SIGNED: ERR_CONTRACT_NOT_SIGNED)"
        side_effects:
          - "Application CONTRACT_ISSUED -> ENROLLED"
          - "Student row created (source=ADMISSION; stored in created_student_id)"
          - "GradeSection seats_held unchanged (already held); no budget movement (award already ACCEPTED before issuance)"

      - from: ISSUED
        to: LAPSED
        trigger: "system (run-sweep when logical clock > response_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Application CONTRACT_ISSUED -> EXPIRED (cascade hop 1)"
          - "That application's AidApplication award_status -> RELEASED; if ACCEPTED, cycle aid_committed_cents -= final_award_cents (hop 2 -> 3)"
          - "GradeSection seats_held -= 1; aid_seats_held -= 1 when aid-seeking; freed seat feeds this sweep's waitlist promotion (hop 4)"

      - from: SIGNED
        to: LAPSED
        trigger: "system (run-sweep when logical clock > response_due_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Same cascade as ISSUED -> LAPSED"

      - from: ISSUED
        to: CANCELLED
        trigger: "system (cascade: family withdraws the application before enrollment)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SIGNED
        to: CANCELLED
        trigger: "system (cascade: family withdraws the application before enrollment)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ENROLLED
        to: MELTED
        trigger: "system (cascade: application withdraw while ENROLLED — summer melt)"
        actor: system
        preconditions: []
        side_effects:
          - "Deposit forfeited; Student (created_student_id) -> INACTIVE; seat freed"

  - entity: ReenrollmentOffer
    initial_state: ISSUED
    terminal_states: [ACCEPTED, DECLINED, LAPSED, SUPERSEDED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /admissions/reenrollment-offers/{offerId}/respond with decision=ACCEPTED"
        actor: Parent
        preconditions:
          - "Offer in ISSUED (ERR_REENROLL_NOT_ISSUED)"
          - "Logical clock <= response_deadline_at (ERR_REENROLL_WINDOW_CLOSED) — belt check when run-sweep has not lapsed it"
        side_effects:
          - "Student.re_enrolled_for_cycle_id = offer.cycle_id"

      - from: ISSUED
        to: DECLINED
        trigger: "POST /admissions/reenrollment-offers/{offerId}/respond with decision=DECLINED"
        actor: Parent
        preconditions:
          - "Offer in ISSUED (ERR_REENROLL_NOT_ISSUED)"
          - "Logical clock <= response_deadline_at (ERR_REENROLL_WINDOW_CLOSED)"
        side_effects: []

      - from: ISSUED
        to: LAPSED
        trigger: "system (run-sweep on the TARGET cycle when logical clock > response_deadline_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (a new ReenrollmentOffer is created for the same student_id + cycle_id)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true create-with-supersede / in-place-update races only,
# resolved exclusively by OCC on the parent entity's version)
# =============================================================================
concurrency_rules:
  - rule_id: reenrollment-offer-stale-student
    parent_entity: Student
    write_endpoint: "POST /admissions/reenrollment-offers"
    occ_field: expected_student_version
    description: |
      Creating a ReenrollmentOffer against a Student whose version has advanced since
      the client last observed it is rejected. The product semantics legitimately allow
      a fresh offer to supersede the prior ISSUED one for the same student+cycle, so a
      second well-formed create would otherwise succeed on a stale view of the student
      (e.g., it would miss that a prior offer was just issued or responded to).
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: evaluation-reschedule-stale-version
    parent_entity: EntranceEvaluation
    write_endpoint: "PATCH /admissions/evaluations/{evaluationId}"
    occ_field: expected_evaluation_version
    description: |
      Rescheduling an EntranceEvaluation whose version has advanced since the client
      last read it is rejected. A reschedule leaves the evaluation in SCHEDULED, so a
      second sequential reschedule observes an identical state field and would itself
      legitimately succeed; only the stale version distinguishes the lost update.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: composite_score
    trigger: "The moment an Application's second EntranceEvaluation kind reaches SCORED"
    algorithm: weighted_scoring
    formula: |
      weighted = round_half_up(0.6 * test_score + 0.4 * interview_score, 2 decimal places)
      sibling_verified = EXISTS Student s WHERE s.family_id == applicant.family_id AND s.status == ACTIVE
      preference_points = (sibling_verified ? SIBLING_POINTS : 0) + (applicant.legacy_parent ? LEGACY_POINTS : 0)
      composite_score = weighted + preference_points
      test_score / interview_score = the SCORED evaluation scores of kind TEST / INTERVIEW for this application.
    input_set: "Exactly one SCORED TEST and one SCORED INTERVIEW evaluation of the application; sibling set = ACTIVE Students sharing the applicant's family_id"
    constants:
      TEST_WEIGHT: 0.6
      INTERVIEW_WEIGHT: 0.4
      SIBLING_POINTS: 10
      LEGACY_POINTS: 5
    precision: "weighted component rounded to 2 decimals, round_half_up; preference points are integers added after rounding"

  - name: committee_rank_assignment
    trigger: "POST /admissions/cycles/{cycleId}/close-round (once per round)"
    algorithm: threshold
    formula: |
      pool = Applications with cycle_id == this cycle AND round == payload round AND status == EVALUATION_COMPLETE
      order = composite_score DESC, then submitted_at ASC, then created_at ASC   (ids never consulted)
      For each grade section, walking the ordered pool restricted to that section:
        seats_open = section.capacity - section.seats_held           (held counts OFFERED + CONTRACT_ISSUED + ENROLLED across ALL rounds)
        aid_cap    = floor(section.capacity * section.max_aid_seat_pct)
        has_aid(a) = EXISTS AidApplication for a with award_status != RELEASED
        admitted = 0; waitlisted = 0
        for a in ordered pool of this section:
          if admitted < seats_open AND (NOT has_aid(a) OR aid_seats_added < aid_cap):
              a -> OFFERED; admitted += 1; if has_aid(a): aid_seats_added += 1
          elif waitlisted < section.capacity:        # WAITLIST_MAX_PER_GRADE = section.capacity
              a -> WAITLISTED; waitlisted += 1
          else:
              a -> DENIED
      An aid-seeking candidate skipped by the composition cap does NOT consume a seat;
      the pass continues to lower-ranked candidates.
    input_set: "EVALUATION_COMPLETE applications of the closing round only; earlier-round WAITLISTED applications are not reconsidered"
    constants:
      OFFER_EXPIRY_DAYS: 21
    precision: "integer seats; aid_cap via floor"
    variants: []

  - name: aid_award_amount
    trigger: "provisional variant: aid application create and every resubmit-income; final variant: finalize-award"
    algorithm: tiered_pricing
    formula: |
      allowance_cents = HOUSEHOLD_BASE_ALLOWANCE_CENTS + HOUSEHOLD_PER_MEMBER_CENTS * household_size
      discretionary   = max(0, income_cents - allowance_cents)
      efc_cents       = round_half_up(0.12 * min(discretionary, TIER1_WIDTH_CENTS))
                      + round_half_up(0.22 * min(max(0, discretionary - TIER1_WIDTH_CENTS), TIER2_WIDTH_CENTS))
                      + round_half_up(0.30 * max(0, discretionary - TIER1_WIDTH_CENTS - TIER2_WIDTH_CENTS))
      demonstrated_need = max(0, tuition_cents - efc_cents)
      award_cents       = min(demonstrated_need, round_half_up(MAX_AWARD_PCT * tuition_cents))
      tuition_cents = the application's grade section tuition_cents.
      Evaluation order is fixed: allowance -> discretionary -> tiered EFC (each tier rounded
      to whole cents before summing) -> need -> cap. income_cents is reported income in the
      provisional variant and verified income in the final variant.
    input_set: "Single AidApplication's income/household and its application's grade tuition"
    constants:
      HOUSEHOLD_BASE_ALLOWANCE_CENTS: 2500000
      HOUSEHOLD_PER_MEMBER_CENTS: 750000
      TIER1_WIDTH_CENTS: 2500000
      TIER2_WIDTH_CENTS: 5000000
      TIER1_RATE: 0.12
      TIER2_RATE: 0.22
      TIER3_RATE: 0.30
      MAX_AWARD_PCT: 0.90
    precision: "whole cents; each tier's contribution rounded round_half_up BEFORE summing"
    variants:
      - name: provisional
        when: "On aid application creation and on every resubmit-income"
        difference: "Uses reported_annual_income_cents; result stored in provisional_award_cents"
      - name: final
        when: "On finalize-award (and the officer override on revise-award replaces it)"
        difference: "Uses verified_annual_income_cents; result stored in final_award_cents. Identical inputs to the provisional variant yield a different award whenever verified != reported income."

  - name: deposit_amount
    trigger: "provisional (estimated) variant: when an application becomes OFFERED; final variant: EnrollmentContract issuance"
    algorithm: threshold
    formula: |
      net_cents     = tuition_cents - award_cents
      deposit_cents = max(MIN_DEPOSIT_CENTS, round_half_up(DEPOSIT_PCT * net_cents))
      Estimated variant (stored on Application.estimated_deposit_cents): award_cents = linked
      AidApplication.provisional_award_cents, or 0 when no aid application exists.
      Final variant (stored on EnrollmentContract.deposit_amount_cents): award_cents = the
      ACCEPTED final_award_cents snapshot (0 when no aid), tuition snapshotted at issuance.
    input_set: "Application's grade section tuition and the linked aid award"
    constants:
      DEPOSIT_PCT: 0.10
      MIN_DEPOSIT_CENTS: 50000
    precision: "whole cents, round_half_up"
    variants:
      - name: estimated
        when: "Offer (round close or waitlist promotion)"
        difference: "Provisional award basis -> a different deposit than the contract's whenever verified income diverged from reported income"
      - name: final
        when: "Contract issuance"
        difference: "Accepted final award basis; this is the collectible deposit"

  - name: aid_pacing_cap
    trigger: "Recomputed on every AdmissionCycle status change; consulted by accept-award"
    algorithm: threshold
    formula: |
      phase(cycle.status):
        DRAFT         -> cap = round_half_up(EARLY_PACING_PCT * aid_budget_total_cents)   # no accepts possible yet
        OPEN          -> cap = round_half_up(EARLY_PACING_PCT * aid_budget_total_cents)
        EARLY_CLOSED  -> cap = round_half_up(MID_PACING_PCT  * aid_budget_total_cents)
        CLOSED        -> cap = aid_budget_total_cents
        ARCHIVED      -> cap = aid_budget_total_cents
      accept-award requires: aid_committed_cents + final_award_cents <= cap   (equality is allowed)
    input_set: "The cycle row only"
    constants:
      EARLY_PACING_PCT: 0.40
      MID_PACING_PCT: 0.75
    precision: "whole cents, round_half_up"

  - name: reenrollment_family_total
    trigger: "ReenrollmentOffer issuance computes its own line; family totals are derived by summing lines"
    algorithm: aggregation
    formula: |
      Family's ACTIVE students ordered by created_at ASC (seniority order; no id tie-break needed
      as created_at is millisecond-stamped sequentially).
      For the student at seniority index i (0-based):
        line_tuition_cents   = next-grade section tuition in the target cycle (new_tuition_cents)
        sibling_discount     = (i == 0) ? 0 : round_half_up(SIBLING_DISCOUNT_PCT * line_tuition_cents)
        discounted_line      = line_tuition_cents - sibling_discount
      family_total = SUM(discounted_line over the family's offers for the target cycle)
      ROUNDING ORDER IS PINNED: each line's discount is rounded to whole cents FIRST, then the
      per-line totals are summed. (Summing raw tuitions and rounding one 10% of the aggregate
      afterwards produces different cents and is NOT the rule.)
    input_set: "ACTIVE Students sharing family_id; GradeSections of the target cycle for each student's next grade"
    constants:
      SIBLING_DISCOUNT_PCT: 0.10
    precision: "whole cents, round_half_up per line before summation"

  - name: seat_ledger
    trigger: "Any Application transition into or out of {OFFERED, CONTRACT_ISSUED, ENROLLED}"
    algorithm: aggregation
    formula: |
      section.seats_held      = count(applications of this section with status in {OFFERED, CONTRACT_ISSUED, ENROLLED})
      section.aid_seats_held  = count(those applications with a linked AidApplication whose award_status != RELEASED)
      section.seats_available = section.capacity - section.seats_held
      Invariant: seats_held is always exactly that count; the offer/decline and
      enroll/melt forward+compensating pairs leave it unchanged.
    input_set: "Applications of the grade section in the three holding states"
    precision: "integer counts"

  - name: waitlist_promotion_selector
    trigger: "run-sweep, after offer expirations and contract lapses have freed seats"
    algorithm: waterfall_allocation
    formula: |
      Runs only when cycle.status in {EARLY_CLOSED, CLOSED} and logical clock <= melt_deadline_at
      (past the melt deadline every WAITLISTED application -> EXPIRED instead).
      For each grade section of the cycle, while seats_available > 0:
        candidate set = Applications of the section with status == WAITLISTED
        rank order    = composite_score DESC, submitted_at ASC, created_at ASC
        promote the first candidate -> OFFERED (offer_expires_at = clock + PROMOTED_OFFER_EXPIRY_DAYS,
        promoted_from_waitlist = true, estimated_deposit_cents recomputed on the provisional variant)
      Empty candidate set: nothing happens (no error). The aid-seat composition cap does NOT
      apply to promotions (it gates round-close admits only); aid budget pressure is enforced
      separately at award acceptance.
    input_set: "WAITLISTED applications per section; freed seats from expirations/lapses/declines/melts processed earlier in the same sweep"
    constants:
      PROMOTED_OFFER_EXPIRY_DAYS: 7
    precision: "integer seats; strictly deterministic ordering"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failing check wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 2.5
    category: auth
    check: "Family scope: a Parent caller may only touch resources whose ownership chain ends at an Applicant/Student with family_id == X-User-ID (application.applicant.family_id for applications/evaluations/aid/contracts; student.family_id for re-enrollment offers). Staff roles are unscoped."
    error_id: ERR_FAMILY_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints that accept the Parent role"

  - priority: 2.6
    category: auth
    check: "Segregation of duties: on finalize-award and revise-award, X-User-ID must differ from the aid application's verified_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /admissions/aid-applications/{id}/finalize-award, POST /admissions/aid-applications/{id}/revise-award"

  - priority: 2.7
    category: existence
    check: "Request body is well-formed and contains all required fields; unknown fields are rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 2.8
    category: existence
    check: "Field formats/ranges/enums valid (enum membership, integer ranges, datetime ordering, kind-specific field presence: INTERVIEW requires interviewer_id and forbids test_session_id; TEST requires test_session_id and forbids interviewer_id; cycle deadline ordering early < regular < reenroll <= melt)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 3.1
    category: existence
    check: "Body foreign-key references exist (applicant_id, cycle_id, grade_section_id, application_id, test_session_id, student_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "creation endpoints with body FKs"

  - priority: 3.5
    category: concurrency
    check: "expected_<parent>_version (when the endpoint declares one) equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /admissions/reenrollment-offers, PATCH /admissions/evaluations/{id}"

  - priority: 4
    category: state
    check: "Target resource's own state precondition for the invoked transition (per §1.2): ERR_APPLICATION_NOT_DRAFT / ERR_APPLICATION_TERMINAL / ERR_APPLICATION_NOT_OFFERED / ERR_CYCLE_INVALID_STATE / ERR_CYCLE_HAS_NO_SECTIONS / ERR_CONTRACT_NOT_ISSUED / ERR_CONTRACT_NOT_SIGNED / ERR_AWARD_NOT_OFFERED / ERR_AWARD_NOT_APPEALABLE / ERR_AWARD_NOT_APPEALED / ERR_AWARD_LOCKED / ERR_AID_NOT_SUBMITTED / ERR_AID_NOT_VERIFIED / ERR_EVALUATION_NOT_SCHEDULED / ERR_REENROLL_NOT_ISSUED"
    error_id: "ERR_* state codes (see §1.6)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_temporal
    check: "Deadline checks against the logical clock: submit before round deadline (ERR_ROUND_DEADLINE_PASSED), close-round only after that round's deadline (ERR_ROUND_STILL_OPEN), issue-contract while offer unexpired (ERR_OFFER_EXPIRED), re-enrollment respond before response deadline (ERR_REENROLL_WINDOW_CLOSED)"
    error_id: "ERR_ROUND_DEADLINE_PASSED | ERR_ROUND_STILL_OPEN | ERR_OFFER_EXPIRED | ERR_REENROLL_WINDOW_CLOSED"
    http_status: 422
    applies_to: "submit, close-round, issue-contract, respond"

  - priority: 6
    category: business_constraint
    check: "Uniqueness/capacity/overlap: one live Application per (applicant, cycle) (ERR_DUPLICATE_APPLICATION); one AidApplication per application (ERR_DUPLICATE_AID_APPLICATION); one non-CANCELLED evaluation per (application, kind) (ERR_DUPLICATE_EVALUATION_KIND); interviewer half-open interval conflict (ERR_INTERVIEWER_SCHEDULE_CONFLICT); test session aggregate capacity (ERR_TEST_SESSION_FULL); TEST evaluation window inside its session window (ERR_EVALUATION_OUTSIDE_SESSION); application grade section belongs to the given cycle (ERR_GRADE_CYCLE_MISMATCH); re-enrollment requires a next-grade section in the target cycle (ERR_NO_NEXT_GRADE); re-enrollment create blocked while an ACCEPTED offer exists for the same student+cycle (ERR_REENROLL_ALREADY_ACCEPTED)"
    error_id: "ERR_* constraint codes (see §1.6)"
    http_status: 409
    applies_to: "creation and reschedule endpoints"

  - priority: 7
    category: business_referential
    check: "Cross-entity state: application create/evaluate/aid-create require the cycle in an admitting status (ERR_CYCLE_NOT_OPEN); evaluation creation requires the application SUBMITTED or EVALUATION_COMPLETE and non-terminal (ERR_APPLICATION_TERMINAL / ERR_APPLICATION_NOT_SUBMITTED); aid creation requires the application past DRAFT and pre-terminal (ERR_APPLICATION_TERMINAL / ERR_APPLICATION_NOT_SUBMITTED); issue-contract requires any linked award ACCEPTED (ERR_AID_NOT_FINALIZED); accept-award requires verification_status == VERIFIED (ERR_AWARD_STALE_VERIFICATION)"
    error_id: "ERR_CYCLE_NOT_OPEN | ERR_APPLICATION_TERMINAL | ERR_APPLICATION_NOT_SUBMITTED | ERR_AID_NOT_FINALIZED | ERR_AWARD_STALE_VERIFICATION"
    http_status: 409
    applies_to: "application create, submit, evaluation create, aid create, issue-contract, accept-award"

  - priority: 8
    category: business_fiscal
    check: "Money gates last: accept-award within pacing cap (ERR_AID_PACING_CAP_EXCEEDED); deposit payment within remaining balance (ERR_PAYMENT_EXCEEDS_BALANCE)"
    error_id: "ERR_AID_PACING_CAP_EXCEEDED | ERR_PAYMENT_EXCEEDS_BALANCE"
    http_status: 402
    applies_to: "accept-award (402), deposit-payments (422 for ERR_PAYMENT_EXCEEDS_BALANCE)"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. The clock starts at exactly 2026-08-01T00:00:00Z on every boot and NEVER falls back to wall-clock; all deadline/expiry/lapse/melt rules read this clock."
    roles: [AdmissionDirector]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["No entity mutation; subsequent sweeps and deadline checks observe the new clock"]

  # --- Admission cycles ---
  - method: POST
    path: "/admissions/cycles"
    description: "Create an admission cycle (status DRAFT, aid_committed_cents 0)"
    roles: [AdmissionDirector]
    code: 201
    input: [academic_year, early_deadline_at, regular_deadline_at, reenroll_response_deadline_at, melt_deadline_at, aid_budget_total_cents]
    output: AdmissionCycle
    side_effects: []

  - method: GET
    path: "/admissions/cycles"
    description: "List admission cycles"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: ["status?"]
    output: "AdmissionCycle[]"
    side_effects: []

  - method: GET
    path: "/admissions/cycles/{cycleId}"
    description: "Get one cycle (includes computed aid_committed_cents and pacing_cap_cents)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: []
    output: AdmissionCycle
    side_effects: []

  - method: POST
    path: "/admissions/cycles/{cycleId}/open"
    description: "Open a DRAFT cycle (requires >= 1 grade section)"
    roles: [AdmissionDirector]
    code: 200
    input: []
    output: AdmissionCycle
    side_effects: ["status -> OPEN", "pacing_cap_cents -> 40% phase"]

  - method: POST
    path: "/admissions/cycles/{cycleId}/close-round"
    description: "Close the named round and run the committee_rank_assignment decision sweep over that round's EVALUATION_COMPLETE pool"
    roles: [AdmissionDirector]
    code: 200
    input: [round]
    output: AdmissionCycle
    side_effects: ["OPEN->EARLY_CLOSED (round=EARLY) or EARLY_CLOSED->CLOSED (round=REGULAR)", "decision sweep per committee_rank_assignment", "pacing_cap_cents recomputed"]

  - method: POST
    path: "/admissions/cycles/{cycleId}/run-sweep"
    description: "Ops-run checkpoint at the current logical clock: expire due offers, lapse due contracts, lapse due re-enrollment offers (target cycle = this cycle), expire the waitlist past melt_deadline_at, then run waitlist promotions per waitlist_promotion_selector"
    roles: [AdmissionDirector]
    code: 200
    input: []
    output: { expired_offer_count: integer, lapsed_contract_count: integer, promoted_application_ids: array, expired_waitlist_count: integer, lapsed_reenrollment_count: integer }
    side_effects: ["Offer/contract/waitlist/reenrollment expirations with full cascades", "waitlist promotions"]

  - method: POST
    path: "/admissions/cycles/{cycleId}/archive"
    description: "Archive a CLOSED cycle"
    roles: [AdmissionDirector]
    code: 200
    input: []
    output: AdmissionCycle
    side_effects: ["status -> ARCHIVED"]

  # --- Grade sections ---
  - method: POST
    path: "/admissions/grade-sections"
    description: "Create a grade section for a cycle (cycle must be DRAFT: ERR_CYCLE_INVALID_STATE)"
    roles: [AdmissionDirector]
    code: 201
    input: [cycle_id, grade_level, capacity, tuition_cents, max_aid_seat_pct]
    output: GradeSection
    side_effects: []

  - method: GET
    path: "/admissions/grade-sections"
    description: "List grade sections"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: ["cycle_id?", "grade_level?"]
    output: "GradeSection[]"
    side_effects: []

  - method: GET
    path: "/admissions/grade-sections/{sectionId}"
    description: "Get one grade section (includes computed seats_held / aid_seats_held / seats_available)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: []
    output: GradeSection
    side_effects: []

  # --- Applicants ---
  - method: POST
    path: "/admissions/applicants"
    description: "Register an applicant child; a Parent caller's family_id must equal X-User-ID (ERR_FAMILY_SCOPE_VIOLATION)"
    roles: [Parent, AdmissionOfficer]
    code: 201
    input: [family_id, first_name, last_name, date_of_birth, "legacy_parent?"]
    output: Applicant
    side_effects: []

  - method: GET
    path: "/admissions/applicants"
    description: "List applicants; Parent callers are auto-scoped to family_id == X-User-ID"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: ["family_id?"]
    output: "Applicant[]"
    side_effects: []

  - method: GET
    path: "/admissions/applicants/{applicantId}"
    description: "Get one applicant (Parent scoped)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # --- Students (currently enrolled) ---
  - method: POST
    path: "/admissions/students"
    description: "Register a currently enrolled student (source=DIRECT); enrollment-created students arrive via the enrollment cascade instead"
    roles: [AdmissionDirector]
    code: 201
    input: [family_id, first_name, last_name, current_grade_section_id]
    output: Student
    side_effects: ["status=ACTIVE, source=DIRECT"]

  - method: GET
    path: "/admissions/students"
    description: "List students; Parent auto-scoped to own family"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: ["family_id?", "current_grade_section_id?", "status?", "re_enrolled_for_cycle_id?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/admissions/students/{studentId}"
    description: "Get one student (Parent scoped)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: []
    output: Student
    side_effects: []

  # --- Applications ---
  - method: POST
    path: "/admissions/applications"
    description: "Create an application (status DRAFT). Cycle must be OPEN; grade section must belong to the cycle; one live application per (applicant, cycle)"
    roles: [Parent, AdmissionOfficer]
    code: 201
    input: [applicant_id, cycle_id, grade_section_id, round]
    output: Application
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/admissions/applications"
    description: "List applications with filters; Parent auto-scoped to own family"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: ["cycle_id?", "grade_section_id?", "applicant_id?", "status?", "family_id?"]
    output: "Application[]"
    side_effects: []

  - method: GET
    path: "/admissions/applications/{applicationId}"
    description: "Get one application (Parent scoped)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/admissions/applications/{applicationId}/submit"
    description: "Submit a DRAFT application before its round deadline"
    roles: [Parent, AdmissionOfficer]
    code: 200
    input: []
    output: Application
    side_effects: ["DRAFT -> SUBMITTED", "submitted_at = logical clock"]

  - method: POST
    path: "/admissions/applications/{applicationId}/issue-contract"
    description: "Issue an enrollment contract for an OFFERED application; requires any linked aid award to be ACCEPTED"
    roles: [AdmissionOfficer]
    code: 201
    input: []
    output: EnrollmentContract
    side_effects: ["Application OFFERED -> CONTRACT_ISSUED", "EnrollmentContract created (deposit final variant, response_due_at = clock + 14 days)"]

  - method: POST
    path: "/admissions/applications/{applicationId}/decline"
    description: "Family declines an OFFERED seat"
    roles: [Parent]
    code: 200
    input: []
    output: Application
    side_effects: ["OFFERED -> DECLINED", "award release cascade", "seat freed"]

  - method: POST
    path: "/admissions/applications/{applicationId}/withdraw"
    description: "Family withdraws: pre-enrollment states -> WITHDRAWN; ENROLLED -> MELTED (deposit forfeited, student deactivated, award released)"
    roles: [Parent]
    code: 200
    input: []
    output: Application
    side_effects: ["state-dependent cascades per §1.2"]

  # --- Entrance evaluations ---
  - method: POST
    path: "/admissions/evaluations"
    description: "Schedule a TEST or INTERVIEW evaluation for a submitted application"
    roles: [AdmissionOfficer]
    code: 201
    input: [application_id, kind, scheduled_start, scheduled_end, "interviewer_id?", "test_session_id?"]
    output: EntranceEvaluation
    side_effects: ["status=SCHEDULED", "TEST: TestSession.booked_count += 1"]

  - method: PATCH
    path: "/admissions/evaluations/{evaluationId}"
    description: "Reschedule a SCHEDULED evaluation (OCC on the evaluation's version); overlap and session-window rules re-applied excluding self"
    roles: [AdmissionOfficer]
    code: 200
    input: [expected_evaluation_version, "scheduled_start?", "scheduled_end?", "interviewer_id?", "test_session_id?"]
    output: EntranceEvaluation
    side_effects: ["increments EntranceEvaluation.version by 1"]

  - method: POST
    path: "/admissions/evaluations/{evaluationId}/score"
    description: "Record the score (0..100) for a SCHEDULED evaluation"
    roles: [AdmissionOfficer]
    code: 200
    input: [score]
    output: EntranceEvaluation
    side_effects: ["SCHEDULED -> SCORED", "when both kinds SCORED: composite_score computed, Application -> EVALUATION_COMPLETE"]

  - method: POST
    path: "/admissions/evaluations/{evaluationId}/cancel"
    description: "Cancel a SCHEDULED evaluation (frees its test-session seat when TEST)"
    roles: [AdmissionOfficer]
    code: 200
    input: []
    output: EntranceEvaluation
    side_effects: ["SCHEDULED -> CANCELLED", "TEST: booked_count -= 1"]

  - method: GET
    path: "/admissions/evaluations"
    description: "List evaluations (staff only; evaluation data is hidden from families)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer]
    code: 200
    input: ["application_id?", "interviewer_id?", "test_session_id?", "kind?", "status?"]
    output: "EntranceEvaluation[]"
    side_effects: []

  - method: GET
    path: "/admissions/evaluations/{evaluationId}"
    description: "Get one evaluation (staff only)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer]
    code: 200
    input: []
    output: EntranceEvaluation
    side_effects: []

  # --- Test sessions ---
  - method: POST
    path: "/admissions/test-sessions"
    description: "Create a group test session with an aggregate room capacity"
    roles: [AdmissionDirector, AdmissionOfficer]
    code: 201
    input: [cycle_id, session_start, session_end, room_capacity]
    output: TestSession
    side_effects: []

  - method: GET
    path: "/admissions/test-sessions"
    description: "List test sessions"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer]
    code: 200
    input: ["cycle_id?"]
    output: "TestSession[]"
    side_effects: []

  - method: GET
    path: "/admissions/test-sessions/{sessionId}"
    description: "Get one test session (includes booked_count)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer]
    code: 200
    input: []
    output: TestSession
    side_effects: []

  # --- Financial aid ---
  - method: POST
    path: "/admissions/aid-applications"
    description: "File a financial-aid application for a submitted, non-terminal admission application; provisional award computed immediately"
    roles: [Parent, FinancialAidOfficer]
    code: 201
    input: [application_id, reported_annual_income_cents, household_size]
    output: AidApplication
    side_effects: ["verification_status=SUBMITTED", "award_status=PROVISIONAL", "provisional_award_cents computed (provisional variant)"]

  - method: GET
    path: "/admissions/aid-applications"
    description: "List aid applications; Parent auto-scoped to own family"
    roles: [AdmissionDirector, FinancialAidOfficer, Parent]
    code: 200
    input: ["application_id?", "award_status?", "verification_status?"]
    output: "AidApplication[]"
    side_effects: []

  - method: GET
    path: "/admissions/aid-applications/{aidApplicationId}"
    description: "Get one aid application (Parent scoped)"
    roles: [AdmissionDirector, FinancialAidOfficer, Parent]
    code: 200
    input: []
    output: AidApplication
    side_effects: []

  - method: POST
    path: "/admissions/aid-applications/{aidApplicationId}/verify"
    description: "Verify reported income against documentation"
    roles: [FinancialAidOfficer]
    code: 200
    input: [verified_annual_income_cents]
    output: AidApplication
    side_effects: ["verification_status SUBMITTED -> VERIFIED", "verified_by_user_id = X-User-ID"]

  - method: POST
    path: "/admissions/aid-applications/{aidApplicationId}/resubmit-income"
    description: "Family resubmits corrected income; recomputes the provisional award and makes any OFFERED award stale until re-verified"
    roles: [Parent]
    code: 200
    input: [reported_annual_income_cents, household_size]
    output: AidApplication
    side_effects: ["verification_status -> SUBMITTED", "provisional_award_cents recomputed"]

  - method: POST
    path: "/admissions/aid-applications/{aidApplicationId}/finalize-award"
    description: "Compute and offer the final award (segregated from the verifier)"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AidApplication
    side_effects: ["final_award_cents computed (final variant)", "award_status PROVISIONAL -> OFFERED"]

  - method: POST
    path: "/admissions/aid-applications/{aidApplicationId}/accept-award"
    description: "Family accepts the offered award; commits aid budget under the pacing cap"
    roles: [Parent]
    code: 200
    input: []
    output: AidApplication
    side_effects: ["award_status OFFERED -> ACCEPTED", "cycle.aid_committed_cents += final_award_cents"]

  - method: POST
    path: "/admissions/aid-applications/{aidApplicationId}/appeal-award"
    description: "Family appeals the offered award"
    roles: [Parent]
    code: 200
    input: [appeal_reason]
    output: AidApplication
    side_effects: ["award_status OFFERED -> APPEALED"]

  - method: POST
    path: "/admissions/aid-applications/{aidApplicationId}/revise-award"
    description: "Officer revises an appealed award (segregated from the verifier); returns it to OFFERED"
    roles: [FinancialAidOfficer]
    code: 200
    input: [revised_final_amount_cents]
    output: AidApplication
    side_effects: ["final_award_cents = revised_final_amount_cents", "award_status APPEALED -> OFFERED"]

  # --- Enrollment contracts ---
  - method: GET
    path: "/admissions/contracts"
    description: "List enrollment contracts; Parent auto-scoped to own family"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: ["application_id?", "status?", "created_student_id?"]
    output: "EnrollmentContract[]"
    side_effects: []

  - method: GET
    path: "/admissions/contracts/{contractId}"
    description: "Get one contract (Parent scoped)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: []
    output: EnrollmentContract
    side_effects: []

  - method: POST
    path: "/admissions/contracts/{contractId}/sign"
    description: "Family signs an ISSUED contract"
    roles: [Parent]
    code: 200
    input: []
    output: EnrollmentContract
    side_effects: ["ISSUED -> SIGNED"]

  - method: POST
    path: "/admissions/contracts/{contractId}/deposit-payments"
    description: "Make a deposit payment on a SIGNED contract; reaching deposit_amount_cents enrolls the student"
    roles: [Parent]
    code: 200
    input: [amount_cents]
    output: EnrollmentContract
    side_effects: ["paid_cents += amount_cents", "when paid_cents >= deposit_amount_cents: ENROLLED cascade (Application -> ENROLLED, Student created)"]

  # --- Re-enrollment offers ---
  - method: POST
    path: "/admissions/reenrollment-offers"
    description: "Issue a re-enrollment offer (with tuition-increase figures and per-line sibling discount) for an ACTIVE student into a target cycle; supersedes any ISSUED offer for the same student+cycle; OCC on the student version"
    roles: [AdmissionDirector]
    code: 201
    input: [student_id, cycle_id, expected_student_version]
    output: ReenrollmentOffer
    side_effects: ["prior ISSUED offer for same student+cycle -> SUPERSEDED", "increments Student.version by 1"]

  - method: GET
    path: "/admissions/reenrollment-offers"
    description: "List re-enrollment offers; Parent auto-scoped to own family"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: ["student_id?", "cycle_id?", "family_id?", "status?"]
    output: "ReenrollmentOffer[]"
    side_effects: []

  - method: GET
    path: "/admissions/reenrollment-offers/{offerId}"
    description: "Get one re-enrollment offer (Parent scoped)"
    roles: [AdmissionDirector, AdmissionOfficer, FinancialAidOfficer, Parent]
    code: 200
    input: []
    output: ReenrollmentOffer
    side_effects: []

  - method: POST
    path: "/admissions/reenrollment-offers/{offerId}/respond"
    description: "Family accepts or declines a re-enrollment offer before its response deadline"
    roles: [Parent]
    code: 200
    input: [decision]
    output: ReenrollmentOffer
    side_effects: ["ISSUED -> ACCEPTED (sets student.re_enrolled_for_cycle_id) | DECLINED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / request shape ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, or unknown field present" }
  - { id: ERR_VALIDATION, http: 422, condition: "Enum/range/format violation, datetime ordering, kind-specific field violation, cycle deadline ordering violation, or revise-award amount outside [0, 90% of tuition]" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's role list" }
  - { id: ERR_FAMILY_SCOPE_VIOLATION, http: 403, condition: "Parent caller acts on a resource outside their family_id scope" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "finalize-award / revise-award attempted by the same user who verified the income" }
  # --- Existence ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body foreign-key reference does not exist" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  # --- Cycle state ---
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "Referenced cycle not in an admitting status for this operation (application create requires OPEN; submit/evaluation require OPEN or EARLY_CLOSED; EARLY submit requires OPEN)" }
  - { id: ERR_CYCLE_INVALID_STATE, http: 409, condition: "Cycle's own transition invalid: open from non-DRAFT, close-round with the wrong round for current status, archive from non-CLOSED, or grade-section create outside DRAFT" }
  - { id: ERR_CYCLE_HAS_NO_SECTIONS, http: 409, condition: "Opening a cycle with zero grade sections" }
  # --- Application state ---
  - { id: ERR_APPLICATION_NOT_DRAFT, http: 409, condition: "submit requires the application to be DRAFT" }
  - { id: ERR_APPLICATION_TERMINAL, http: 409, condition: "Operation on an application in a terminal state (DENIED, DECLINED, WITHDRAWN, EXPIRED, MELTED)" }
  - { id: ERR_APPLICATION_NOT_OFFERED, http: 409, condition: "issue-contract / decline requires the application to be OFFERED" }
  - { id: ERR_APPLICATION_NOT_SUBMITTED, http: 409, condition: "Referenced application not past the submission gate for this operation (evaluation requires SUBMITTED or EVALUATION_COMPLETE; aid creation requires SUBMITTED through CONTRACT_ISSUED)" }
  # --- Contract state ---
  - { id: ERR_CONTRACT_NOT_ISSUED, http: 409, condition: "sign requires contract ISSUED" }
  - { id: ERR_CONTRACT_NOT_SIGNED, http: 409, condition: "deposit payment requires contract SIGNED" }
  # --- Aid state ---
  - { id: ERR_AWARD_NOT_OFFERED, http: 409, condition: "accept-award requires award_status OFFERED" }
  - { id: ERR_AWARD_NOT_APPEALABLE, http: 409, condition: "appeal-award requires award_status OFFERED" }
  - { id: ERR_AWARD_NOT_APPEALED, http: 409, condition: "revise-award requires award_status APPEALED" }
  - { id: ERR_AWARD_LOCKED, http: 409, condition: "resubmit-income blocked while award ACCEPTED or RELEASED; finalize-award blocked unless award PROVISIONAL" }
  - { id: ERR_AID_NOT_SUBMITTED, http: 409, condition: "verify requires verification_status SUBMITTED" }
  - { id: ERR_AID_NOT_VERIFIED, http: 409, condition: "finalize-award requires verification_status VERIFIED" }
  # --- Evaluation / re-enrollment state ---
  - { id: ERR_EVALUATION_NOT_SCHEDULED, http: 409, condition: "score / cancel / reschedule requires the evaluation SCHEDULED" }
  - { id: ERR_REENROLL_NOT_ISSUED, http: 409, condition: "respond requires the re-enrollment offer ISSUED" }
  - { id: ERR_REENROLL_ALREADY_ACCEPTED, http: 409, condition: "A re-enrollment offer for this student+cycle is already ACCEPTED; no further offers may be created" }
  # --- Temporal ---
  - { id: ERR_ROUND_DEADLINE_PASSED, http: 422, condition: "Submission after the application's round deadline" }
  - { id: ERR_ROUND_STILL_OPEN, http: 422, condition: "close-round invoked at or before that round's deadline" }
  - { id: ERR_OFFER_EXPIRED, http: 422, condition: "issue-contract when the logical clock is past offer_expires_at (belt check before the sweep expires it)" }
  - { id: ERR_REENROLL_WINDOW_CLOSED, http: 422, condition: "respond when the logical clock is past response_deadline_at (belt check before the sweep lapses it)" }
  # --- Constraint ---
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "A non-terminal application already exists for this applicant in this cycle" }
  - { id: ERR_DUPLICATE_AID_APPLICATION, http: 409, condition: "An aid application already exists for this admission application" }
  - { id: ERR_DUPLICATE_EVALUATION_KIND, http: 409, condition: "A non-CANCELLED evaluation of this kind already exists for the application" }
  - { id: ERR_INTERVIEWER_SCHEDULE_CONFLICT, http: 409, condition: "Half-open interval overlap [start, end) with another non-CANCELLED INTERVIEW for the same interviewer; adjacency (end == start) is allowed" }
  - { id: ERR_TEST_SESSION_FULL, http: 409, condition: "Test session already holds room_capacity non-CANCELLED TEST evaluations (aggregate capacity; interval overlap among them is irrelevant)" }
  - { id: ERR_EVALUATION_OUTSIDE_SESSION, http: 409, condition: "TEST evaluation window not contained in its session's [session_start, session_end]" }
  - { id: ERR_GRADE_CYCLE_MISMATCH, http: 409, condition: "Application's grade section belongs to a different cycle than cycle_id" }
  - { id: ERR_NO_NEXT_GRADE, http: 409, condition: "No grade section for the student's next grade exists in the target cycle (G12 students graduate)" }
  # --- Referential / fiscal ---
  - { id: ERR_AID_NOT_FINALIZED, http: 409, condition: "issue-contract while a linked AidApplication exists whose award_status != ACCEPTED" }
  - { id: ERR_AWARD_STALE_VERIFICATION, http: 409, condition: "accept-award while verification_status != VERIFIED (income was resubmitted after finalize)" }
  - { id: ERR_AID_PACING_CAP_EXCEEDED, http: 402, condition: "accept-award would push aid_committed_cents above the cycle's current pacing_cap_cents" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 422, condition: "Deposit payment exceeds the remaining deposit balance (deposit_amount_cents - paid_cents)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AdmissionDirector
    description: "Head of admissions; owns cycle configuration, round closes, ops sweeps, student registry, and re-enrollment offers"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /admissions/cycles; POST /admissions/cycles/{id}/open|close-round|run-sweep|archive"
      - "POST /admissions/grade-sections"
      - "POST /admissions/students"
      - "POST /admissions/reenrollment-offers"
    shared_operations:
      - "All GET list/detail endpoints"
      - "POST /admissions/test-sessions (with AdmissionOfficer)"

  - name: AdmissionOfficer
    description: "Admissions officer; runs the funnel day-to-day: applications, evaluations, contracts"
    identity: opaque
    exclusive_operations:
      - "POST /admissions/evaluations; PATCH /admissions/evaluations/{id}; POST .../score; POST .../cancel"
      - "POST /admissions/applications/{id}/issue-contract"
    shared_operations:
      - "POST /admissions/applicants; POST /admissions/applications; POST .../submit (with Parent)"
      - "POST /admissions/test-sessions (with AdmissionDirector)"
      - "GET endpoints (except aid list/detail, which excludes this role)"

  - name: FinancialAidOfficer
    description: "Aid officer; verifies income and finalizes/revises awards. Segregation of duties: the verifying user may not finalize or revise the same aid application (ERR_SEGREGATION_OF_DUTIES)"
    identity: opaque
    exclusive_operations:
      - "POST /admissions/aid-applications/{id}/verify"
      - "POST /admissions/aid-applications/{id}/finalize-award"
      - "POST /admissions/aid-applications/{id}/revise-award"
    shared_operations:
      - "POST /admissions/aid-applications (with Parent)"
      - "GET endpoints (except applications? no: cycles/sections/applicants/students/applications/evaluations/test-sessions/aid/contracts/reenrollment lists and details)"

  - name: Parent
    description: "Family account holder. X-User-ID IS the family identifier: every applicant/student the family owns carries family_id == X-User-ID; any access outside that scope is ERR_FAMILY_SCOPE_VIOLATION. List endpoints auto-filter to the caller's family."
    identity: opaque
    exclusive_operations:
      - "POST /admissions/applications/{id}/decline; POST /admissions/applications/{id}/withdraw"
      - "POST /admissions/aid-applications/{id}/resubmit-income|accept-award|appeal-award"
      - "POST /admissions/contracts/{id}/sign; POST /admissions/contracts/{id}/deposit-payments"
      - "POST /admissions/reenrollment-offers/{id}/respond"
    shared_operations:
      - "POST /admissions/applicants; POST /admissions/applications; POST .../submit (with AdmissionOfficer)"
      - "POST /admissions/aid-applications (with FinancialAidOfficer)"
      - "GET endpoints (evaluations and test-sessions excluded — staff-only)"
