      - name: arrive_by_unassigned_technician_returns_scope_violation
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RoadServiceCall.DISPATCHED_to_ON_SITE
          - validations.priority_5_auth
          - errors.ERR_TECHNICIAN_SCOPE_VIOLATION
        distinguishing_aspect: "The ON_SITE transition's precondition X-User-ID == RoadServiceCall.technician_id is enforced per-user, not merely per-role: a second, equally certified TireTechnician at the same location is refused with 403."
        test_recipe:
          setup: ["one location with two technicians; a call dispatched to technician one"]
          setup_api_calls:
            - call: "POST /service-locations"
              payload: { name: "Assign Commercial", location_code: "ASC", state_code: "OH", road_service_response_minutes_committed: 120, scrap_permit_number: "OH-SCRAP-4014", scrap_permit_expires_on: "2027-06-30" }
              as: DealerAdmin
              captures: { loc_id: $.data.id }
