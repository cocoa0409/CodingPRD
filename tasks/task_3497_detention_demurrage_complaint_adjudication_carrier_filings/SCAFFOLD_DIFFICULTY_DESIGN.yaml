# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3497_detention_demurrage_complaint_adjudication_carrier_filings
#
# Depth probe: 9 Difficulty Rules x 2 instances = 18 instances. Every instance
# grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from empty-DB via the
# declared endpoints. All formula-derived asserts are pre-computed literals.
# Logical-clock default at server startup: 2026-09-01T00:00:00Z (pinned by the
# /_clock/set_current_utc endpoint contract); recipes set the clock explicitly
# anyway so execution order never matters.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: invoice_charge_calendar_vs_working_day_variants
        grounds:
          - calculations.invoice_charge_amount
          - entities.DemurrageDetentionInvoice.fields.billable_days
          - entities.TariffPublication.fields.accrual_method
        distinguishing_aspect: |
          Same availability/return dates, free time, and rate billed under two
          tariffs that differ ONLY in accrual_method: CALENDAR charges 7 days
          (ceil of the 6.5-day window), WORKING_DAY charges 4 (Sep 9, 10, 11,
          14 are the only weekdays strictly after 2026-09-08 up to 2026-09-14)
          — a dual-variant calculation on the invoice-billing domain.
        test_recipe:
          setup:
            - "VOCC carrier with two PUBLISHED tariffs, identical except accrual_method (CALENDAR vs WORKING_DAY): free_time_days 4, per_diem_rate_cents 15000."
            - "One shipper. Logical clock moved to 2026-09-15T00:00:00Z for issuance."
          setup_api_calls:
            - &d_clock_start
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CommissionAdmin
            - &d_mk_carrier
              call: "POST /fmc/carriers"
              payload: { org_name: "Twin Tariff Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - &d_mk_shipper
              call: "POST /fmc/shippers"
              payload: { company_name: "Harborline Imports", contact_email: "ops@harborline.example" }
              as: CommissionAdmin
              captures: { shipper_id: $.data.id }
            - &d_mk_tariff_cal
              call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-CAL-01", charge_scope: "DETENTION", free_time_days: 4, per_diem_rate_cents: 15000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_cal: $.data.id }
            - call: "GET /fmc/carriers/${carrier_id}"
              payload: {}
              as: CommissionDocket
              captures: { carrier_v2: $.data.version }
            - &d_mk_tariff_wd
              call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-WD-01", charge_scope: "DETENTION", free_time_days: 4, per_diem_rate_cents: 15000, accrual_method: "WORKING_DAY", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v2}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_wd: $.data.id }
            - &d_clock_sep03
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: CommissionAdmin
            - &d_pub_cal
              call: "POST /fmc/tariff-publications/${t_cal}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - &d_pub_wd
              call: "POST /fmc/tariff-publications/${t_wd}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - &d_clock_sep15
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: CommissionAdmin
          trigger:
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-CAL-1", charge_basis: "TARIFF", tariff_id: "${t_cal}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU1000001", port_code: "USLAX", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-14T12:00:00Z", last_accrual_date: "2026-09-14T12:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_cal: $.data.id, cal_days: $.data.billable_days, cal_amount: $.data.amount_cents }
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-WD-1", charge_basis: "TARIFF", tariff_id: "${t_wd}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU1000002", port_code: "USLAX", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-14T12:00:00Z", last_accrual_date: "2026-09-14T12:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_wd: $.data.id, wd_days: $.data.billable_days, wd_amount: $.data.amount_cents }
          assert:
            - "Invoice.${inv_cal}.billable_days == 7 and Invoice.${inv_cal}.amount_cents == 105000 (CALENDAR: ceil(6.5 days) = 7 x 15000)"
            - "Invoice.${inv_wd}.billable_days == 4 and Invoice.${inv_wd}.amount_cents == 60000 (WORKING_DAY: weekdays 2026-09-09, 10, 11, 14 only)"
            - "identical inputs produce different charges solely via accrual_method: 105000 != 60000"
            - "both invoices carry invoice_status == ISSUED and free_time_days == 4 copied from the governing tariff"

      - name: reparation_out_of_pocket_vs_fluidity_weighted_variants
        grounds:
          - calculations.reparation_award
          - calculations.incentive_principle_score
          - entities.Complaint.fields.reparation_method
        distinguishing_aspect: |
          Two complaints over the same invoice population (one PAID 105000-cent
          invoice, one unpaid 75000-cent invoice): the clean complaint scores
          75 and pays OUT_OF_POCKET 110250 (paid invoice + 5% interest, unpaid
          invoice excluded); the hold/congestion-burdened complaint scores 10
          and pays FLUIDITY_WEIGHTED 200000 (both invoices at 125% = 225000,
          capped at reparations_claimed_cents) — a dual-variant calculation on
          the adjudication-remedy domain, distinct from the invoice-billing
          variant pair.
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED CALENDAR tariff (free 4 days, 15000/day). Shipper with invoice INV-OOP-1 (105000 cents, PAID) and INV-FLU-2 (75000 cents, ISSUED; 2 government-hold days, 1 appointment-unavailable day)."
            - "Port USLAX week 2026-08-31 reports across four terminals summing to 572 berth-hours (ratio 572/672 = 0.8512 >= 0.85)."
            - "Both complaints filed 2026-09-20T00:00:00Z and adjudicated without ombuds."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Delta Bay Carriers", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-STD-1", charge_scope: "DEMURRAGE", free_time_days: 4, per_diem_rate_cents: 15000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_cal: $.data.id }
            - *d_clock_sep03
            - *d_pub_cal
            - *d_clock_sep15
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-OOP-1", charge_basis: "TARIFF", tariff_id: "${t_cal}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU1000011", port_code: "USLAX", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-14T12:00:00Z", last_accrual_date: "2026-09-14T12:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_paid: $.data.id }
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-FLU-2", charge_basis: "TARIFF", tariff_id: "${t_cal}", billed_party_shipper_id: "${shipper_id}", container_number: "MSKU1000012", port_code: "USLAX", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-12T12:00:00Z", last_accrual_date: "2026-09-12T12:00:00Z", government_hold_days: 2, appointment_unavailable_days: 1 }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_unpaid: $.data.id }
            - call: "POST /fmc/invoices/${inv_paid}/mark-paid"
              payload: {}
              as: ShipperRep
              as_user_id: "${shipper_id}"
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USLAX", terminal_code: "TERM-A", week_start: "2026-08-31T00:00:00Z", berth_occupancy_hours: 168, gate_closures_hours: 10, vessel_dwell_hours_avg: 96.5 }
              as: CommissionDocket
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USLAX", terminal_code: "TERM-B", week_start: "2026-08-31T00:00:00Z", berth_occupancy_hours: 168, gate_closures_hours: 4, vessel_dwell_hours_avg: 90.0 }
              as: CommissionDocket
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USLAX", terminal_code: "TERM-C", week_start: "2026-08-31T00:00:00Z", berth_occupancy_hours: 168, gate_closures_hours: 0, vessel_dwell_hours_avg: 88.0 }
              as: CommissionDocket
            - call: "POST /fmc/port-congestion-reports"
              payload: { port_code: "USLAX", terminal_code: "TERM-D", week_start: "2026-08-31T00:00:00Z", berth_occupancy_hours: 68, gate_closures_hours: 0, vessel_dwell_hours_avg: 80.0 }
              as: CommissionDocket
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_paid}"], reparations_claimed_cents: 200000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_clean: $.data.id, score_clean: $.data.incentive_principle_score }
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_paid}", "${inv_unpaid}"], reparations_claimed_cents: 200000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_burdened: $.data.id, score_burdened: $.data.incentive_principle_score }
            - call: "POST /fmc/complaints/${comp_clean}/open-adjudication"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
            - call: "POST /fmc/complaints/${comp_burdened}/open-adjudication"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
          trigger:
            - call: "POST /fmc/complaints/${comp_clean}/decide"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
              captures: { award_clean: $.data.reparations_awarded_cents, method_clean: $.data.reparation_method }
            - call: "POST /fmc/complaints/${comp_burdened}/decide"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
              captures: { award_burdened: $.data.reparations_awarded_cents, method_burdened: $.data.reparation_method }
          assert:
            - "Complaint.${comp_clean}.incentive_principle_score == 75 (only the 0.8512-occupancy congestion deduction of 25 applies to its sole invoice)"
            - "Complaint.${comp_clean}.reparation_method == OUT_OF_POCKET and reparations_awarded_cents == 110250 (105000 + round_half_up(105000 x 0.05) = 105000 + 5250; unpaid invoice excluded)"
            - "Complaint.${comp_burdened}.incentive_principle_score == 10 (100 - 25 congestion on INV-OOP-1 - 25 congestion on INV-FLU-2 - 15x2 holds - 10x1 appointments)"
            - "Complaint.${comp_burdened}.reparation_method == FLUIDITY_WEIGHTED and reparations_awarded_cents == 200000 (raw 131250 + 93750 = 225000 capped at reparations_claimed_cents)"
            - "ShipperAccount.${shipper_id}.total_recovery_cents == 310250 after both decisions"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: civil_penalty_stacks_willful_repeat_and_cap_inputs
        grounds:
          - calculations.civil_penalty_assessment
          - calculations.compliance_score_adjustment
          - entities.EnforcementProceeding.fields.penalty_cents
        distinguishing_aspect: |
          Mode (a) combinatorial formula with four interacting inputs
          (violation_count, willful flag, repeat_offender flag, per-proceeding
          cap): the first determination yields 5 x 1000000 = 5000000 (no
          multipliers, repeat_offender false); the second — 30 willful
          violations by a repeat offender — yields 30 x 1000000 x 2 x 1.5 =
          90000000, under the 100000000 cap but only because all three factors
          compound in the pinned order.
        test_recipe:
          setup:
            - "One VOCC carrier, compliance_score 1000, no prior proceedings."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Penalty Probe Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id }
          trigger:
            - call: "POST /fmc/enforcement-proceedings"
              payload: { target_carrier_id: "${carrier_id}", basis: "TARIFF_VIOLATION" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { p1: $.data.id }
            - call: "POST /fmc/enforcement-proceedings/${p1}/determine"
              payload: { determination: "VIOLATION_FOUND", violation_count: 5, willful: false }
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
              captures: { p1_pen: $.data.penalty_cents, p1_repeat: $.data.repeat_offender }
            - call: "POST /fmc/enforcement-proceedings"
              payload: { target_carrier_id: "${carrier_id}", basis: "TARIFF_VIOLATION" }
              as: EnforcementCounsel
              as_user_id: "ec-1"
              captures: { p2: $.data.id }
            - call: "POST /fmc/enforcement-proceedings/${p2}/determine"
              payload: { determination: "VIOLATION_FOUND", violation_count: 30, willful: true }
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
              captures: { p2_pen: $.data.penalty_cents, p2_repeat: $.data.repeat_offender }
          assert:
            - "EnforcementProceeding.${p1}.penalty_cents == 5000000 and repeat_offender == false (first determination)"
            - "EnforcementProceeding.${p2}.penalty_cents == 90000000 and repeat_offender == true (30 x 1000000 x 2 willful x 1.5 repeat, below the 100000000 cap)"
            - "EnforcementProceeding.${p2}.score_delta == -250 (non-UNREASONABLE_PRACTICE basis: min(50 x 30, 250))"
            - "GET /fmc/carriers/${carrier_id} shows cumulative_civil_penalties_cents == 95000000, compliance_score == 500, status == SUSPENDED (500 < 600 threshold crossed by the second delta)"

      - name: monitoring_hhi_nested_rounding_order_pinned
        grounds:
          - calculations.monitoring_hhi
          - entities.CarrierAgreement.fields.market_concentration_hhi
        distinguishing_aspect: |
          Mode (b) nested rounding: volumes [1, 2] of a 3-TEU market yield
          shares 33.3333% and 66.6667% (rounded to 4dp first), whose rounded
          squares sum to 1111.11 + 4444.49 = 5555.60 — while summing raw
          unrounded squares gives 5555.56. The pinned round-share-then-square-
          then-sum order is observable in the stored HHI.
        test_recipe:
          setup:
            - "Two VOCC carriers; a VESSEL_SHARING agreement filed by the first."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Alpha Voyager Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /fmc/carriers"
              payload: { org_name: "Beta Voyager Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /fmc/carrier-agreements"
              payload: { agreement_number: "AG-2026-01", agreement_type: "VESSEL_SHARING", member_carrier_ids: ["${ca_id}", "${cb_id}"] }
              as: CarrierRep
              as_user_id: "${ca_id}"
              captures: { ag_id: $.data.id }
          trigger:
            - call: "POST /fmc/carrier-agreements/${ag_id}/monitoring-reports"
              payload: { reporting_period_start: "2026-01-01T00:00:00Z", reporting_period_end: "2026-04-01T00:00:00Z", total_market_teus: 3, member_volumes: [{ carrier_id: "${ca_id}", carried_teus: 1 }, { carrier_id: "${cb_id}", carried_teus: 2 }] }
              as: CarrierRep
              as_user_id: "${ca_id}"
              captures: { hhi: $.data.market_concentration_hhi, flag: $.data.competitive_concern_flag }
          assert:
            - "CarrierAgreement.${ag_id}.market_concentration_hhi == 5555.6 (i.e. 5555.60: round(33.3333^2, 2) + round(66.6667^2, 2) = 1111.11 + 4444.49)"
            - "the stored HHI is NOT 5555.56, the value that summing raw squares (100/3)^2 + (200/3)^2 = 5555.5556 would produce"
            - "CarrierAgreement.${ag_id}.competitive_concern_flag == true (5555.60 >= 2500)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: complaint_ombuds_cycle_with_round_limit
        grounds:
          - state_machines.Complaint.DOCKETED_to_OMBUDS
          - state_machines.Complaint.OMBUDS_to_DOCKETED
          - entities.Complaint.fields.ombuds_rounds
        distinguishing_aspect: |
          Complaint is a cyclic machine: DOCKETED -> OMBUDS -> (FAILED) ->
          DOCKETED -> OMBUDS -> (FAILED) -> DOCKETED, and the third referral
          is rejected with ERR_OMBUDS_ROUND_LIMIT_EXCEEDED because
          ombuds_rounds reached OMBUDS_MAX_ROUNDS (2) — the cycle terminates
          on a counter, not on a wall-clock event.
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED tariff (free 2 days, 5000/day); one ISSUED 10000-cent invoice; one DOCKETED complaint (score 100) claiming 50000."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Cycle Lines", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-CYC-1", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_cyc: $.data.id }
            - *d_clock_sep03
            - call: "POST /fmc/tariff-publications/${t_cyc}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-CYC-1", charge_basis: "TARIFF", tariff_id: "${t_cyc}", billed_party_shipper_id: "${shipper_id}", container_number: "TCLU2000002", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_cyc: $.data.id }
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_cyc}"], reparations_claimed_cents: 50000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /fmc/complaints/${comp_id}/refer-ombuds"
              payload: { ombuds_officer_id: "om-1" }
              as: CommissionDocket
            - call: "POST /fmc/complaints/${comp_id}/close-ombuds"
              payload: { outcome: "FAILED" }
              as: OmbudsOfficer
              as_user_id: "om-1"
            - call: "POST /fmc/complaints/${comp_id}/refer-ombuds"
              payload: { ombuds_officer_id: "om-2" }
              as: CommissionDocket
            - call: "POST /fmc/complaints/${comp_id}/close-ombuds"
              payload: { outcome: "FAILED" }
              as: OmbudsOfficer
              as_user_id: "om-2"
              captures: { rounds_after_two: $.data.ombuds_rounds }
          trigger:
            - call: "POST /fmc/complaints/${comp_id}/refer-ombuds"
              payload: { ombuds_officer_id: "om-3" }
              as: CommissionDocket
              captures: { error_id: $.data.error_id }
          assert:
            - "the two completed FAILED rounds cycle the complaint OMBUDS -> DOCKETED each time, and ombuds_rounds == 2"
            - "the third refer-ombuds is rejected: status 409 and error_id == ERR_OMBUDS_ROUND_LIMIT_EXCEEDED"
            - "Complaint.${comp_id}.complaint_status == DOCKETED after the rejection (no state drift)"
            - "Complaint.${comp_id}.ombuds_officer_id == \"om-2\" (the most recent round's officer is retained for the segregation check)"

      - name: invoice_dispute_deny_reissue_cycle
        grounds:
          - state_machines.DemurrageDetentionInvoice.ISSUED_to_DISPUTED
          - state_machines.InvoiceDispute.PENDING_to_DENIED
        distinguishing_aspect: |
          DemurrageDetentionInvoice is a cyclic machine distinct from
          Complaint: ISSUED -> DISPUTED -> (timely DENY) -> ISSUED -> a fresh
          dispute returns it to DISPUTED, with the second dispute's
          response_due_at recomputed from its own filed_at (2026-09-10T00:00:00Z
          + 30 days = 2026-10-10T00:00:00Z).
        test_recipe:
          setup:
            - "VOCC carrier with PUBLISHED tariff (free 2 days, 5000/day); one ISSUED 10000-cent invoice billed to the shipper."
          setup_api_calls:
            - *d_clock_start
            - call: "POST /fmc/carriers"
              payload: { org_name: "Reissue Carriers", org_type: "VOCC" }
              as: CommissionAdmin
              captures: { carrier_id: $.data.id, carrier_v: $.data.version }
            - *d_mk_shipper
            - call: "POST /fmc/carriers/${carrier_id}/tariff-publications"
              payload: { tariff_code: "DD-CYC-2", charge_scope: "DEMURRAGE", free_time_days: 2, per_diem_rate_cents: 5000, accrual_method: "CALENDAR", change_type: "NEW", effective_date: "2026-09-02T00:00:00Z", expected_carrier_version: "${carrier_v}" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { t_cyc2: $.data.id }
            - *d_clock_sep03
            - call: "POST /fmc/tariff-publications/${t_cyc2}/publish"
              payload: {}
              as: CarrierRep
              as_user_id: "${carrier_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/carriers/${carrier_id}/invoices"
              payload: { invoice_number: "INV-CYC-2", charge_basis: "TARIFF", tariff_id: "${t_cyc2}", billed_party_shipper_id: "${shipper_id}", container_number: "TCLU2000009", port_code: "USNYC", availability_date: "2026-09-04T00:00:00Z", return_date: "2026-09-08T00:00:00Z", last_accrual_date: "2026-09-08T00:00:00Z" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { inv_cyc2: $.data.id }
            - call: "POST /fmc/invoices/${inv_cyc2}/disputes"
              payload: { dispute_reason: "CHARGE_EXCEEDS_PUBLISHED" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { d1: $.data.id, d1_due: $.data.response_due_at }
            - call: "POST /fmc/invoice-disputes/${d1}/respond"
              payload: { resolution: "DENY", denial_justification: "Charge matches published tariff DD-CYC-2" }
              as: CarrierRep
              as_user_id: "${carrier_id}"
              captures: { d1_res: $.data.resolution }
          trigger:
            - call: "POST /fmc/invoices/${inv_cyc2}/disputes"
              payload: { dispute_reason: "OTHER" }
              as: ShipperRep
              as_user_id: "${shipper_id}"
