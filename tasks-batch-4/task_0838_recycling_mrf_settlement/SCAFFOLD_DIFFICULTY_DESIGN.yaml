              as: SortManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COMMODITY_NOT_IN_LOAD"
            - "http_status == 422"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: contamination_clean_threshold_inclusive_boundary
        grounds:
          - calculations.contamination_adjustment
          - entities.InboundLoad.fields.provisional_adjustment_cents
          - state_machines.InboundLoad.RECEIVED_to_AUDITED
        distinguishing_aspect: |
          Numeric threshold boundary on audit: contamination exactly == CLEAN_THRESHOLD_PCT (5.0)
          is inclusive (<=), yielding the full rebate +6000 for net_tons=20; 5.01 would yield 0.
        test_recipe:
          setup:
            - "Load net_tons=20 in RECEIVED."
          setup_api_calls:
            - call: "POST /mrf/municipalities"
              payload: { name: "City A", revenue_share_pct: 0.50 }
              as: SettlementClerk
              captures: { m_id: $.data.id }
            - call: "POST /mrf/sort-lines"
              payload: { name: "Line 1", rated_tph: 10 }
