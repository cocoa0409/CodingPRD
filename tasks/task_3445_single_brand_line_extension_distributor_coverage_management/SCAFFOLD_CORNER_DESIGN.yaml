              as: BrandManager
              captures: { consumed_after: $.data.dilution_consumed_bps, identity_after: $.data.core_identity_share_bps }
          assert:
            - "after launch, dilution_consumed_bps == 750 (frozen at brand-review approval)"
            - "after discontinue, status == DISCONTINUED and dilution_consumed_bps == 375 (floor(750 / 2))"
            - "core_identity_share_bps == 9625 (10000 - 375)"

  # ===========================================================================
  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_400
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
        distinguishing_aspect: "A request sent without the X-User-ID and X-User-Role headers fails priority-1 authentication with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /brand-ops/brands"
              payload: { name: "No Headers", legal_entity_name: "No Headers Co" }
              as: BrandManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the test sends this request with neither X-User-ID nor X-User-Role; the response is 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "no brand row is persisted"

      - name: consumer_cannot_create_distributor_returns_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors.ERR_FORBIDDEN_FOR_ROLE
          - roles.ChannelManager
        distinguishing_aspect: "Distributor creation is exclusive to ChannelManager; a Consumer caller gets 403 ERR_FORBIDDEN_FOR_ROLE even with a well-formed body and an existing market."
        test_recipe:
          setup:
            - "Market US exists."
          setup_api_calls:
            - *k_market
          trigger:
            - call: "POST /brand-ops/distributors"
              payload: { legal_name: "Consumer Corp", home_market_id: "${market_id}", channels_served: ["MASS"], credit_limit_cents: 1000 }
              as: Consumer
              as_user_id: "consumer-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_FOR_ROLE"

      - name: grant_create_with_unknown_formulation_reference_returns_422
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_REFERENCE
        distinguishing_aspect: "A body-referenced formulation id that does not exist yields 422 ERR_INVALID_REFERENCE (priority 5), distinct from a path 404."
        test_recipe:
          setup:
            - "Brand exists; mfr1 QUALIFIED."
          setup_api_calls:
            - *k_brand
            - *k_mfr1
            - *k_mfr1q
          trigger:
            - call: "POST /brand-ops/confidentiality-grants"
              payload: { manufacturer_id: "${mfr1_id}", formulation_id: "00000000-0000-4000-8000-000000000000", component_scope: ["C1"], expires_on: "2027-12-31T00:00:00Z", grant_reason: "PRODUCTION" }
              as: TradeSecretOfficer
              as_user_id: "tso-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_INVALID_REFERENCE"

      - name: existence_check_precedes_state_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=8]
        distinguishing_aspect: "Approving a promotion id that does not exist returns 404 ERR_NOT_FOUND; the state-machine error would have been 409, but existence at priority 3 wins over state at priority 8."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /brand-ops/promotions/00000000-0000-4000-8000-000000000000/approve"
              payload: {}
              as: MarketingManager
              as_user_id: "mm-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND, not a 409 state error"

      - name: strict_market_rejects_standard_voc_formulation
        claim_type: violation_to_error
        grounds:
          - errors.ERR_VOC_REGIME_MISMATCH
          - entities.Market.fields.voc_regime
          - entities.Formulation.fields.voc_class
        distinguishing_aspect: "A STRICT market accepts only LOW_VOC formulations; registering a STANDARD formulation there fails 422 ERR_VOC_REGIME_MISMATCH."
        test_recipe:
          setup:
            - "Brand with PILOT core line; SEALED STANDARD formulation; market DE with voc_regime STRICT."
          setup_api_calls:
            - *k_brand
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_review
            - call: "POST /brand-ops/markets"
              payload: { country_code: "DE", name: "Germany", registration_required: true, voc_regime: "STRICT", allowed_channels: ["HARDWARE"] }
              as: RegulatoryAffairs
              captures: { market_de_id: $.data.id }
          trigger:
            - call: "POST /brand-ops/market-registrations"
              payload: { market_id: "${market_de_id}", product_line_id: "${line_id}", formulation_id: "${form_id}", expires_on: "2027-01-01T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_VOC_REGIME_MISMATCH"
            - "no registration row is persisted for (DE, ${line_id})"

      - name: price_list_map_above_list_rejected
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MAP_ABOVE_LIST
          - entities.ChannelPriceList.fields.map_price_cents
        distinguishing_aspect: "map_price_cents may equal but never exceed list_price_cents: map 600 on list 499 fails 422; map 499 on list 499 is accepted."
        test_recipe:
          setup:
            - "Brand with PILOT core line; pack TOOLED."
          setup_api_calls:
            - *k_brand
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_review
            - *k_pack
            - *k_tool
          trigger:
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 499, map_price_cents: 600, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_pack_format_version: "${pack_v2}" }
              as: PricingAnalyst
              captures: { error_id: $.data.error_id }
            - call: "POST /brand-ops/pack-formats/${pack_id}/price-lists"
              payload: { channel: "HARDWARE", list_price_cents: 499, map_price_cents: 499, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z", expected_pack_format_version: "${pack_v2}" }
              as: PricingAnalyst
              captures: { pl_eq_id: $.data.id }
          assert:
            - "map 600 > list 499: 422 with error_id == ERR_MAP_ABOVE_LIST, and the pack version is unchanged"
            - "map 499 == list 499: 201 (equality allowed), so the second create reuses the same expected version successfully"

      - name: promo_selling_price_below_map_rejected_at_approve
        claim_type: violation_to_error
        grounds:
