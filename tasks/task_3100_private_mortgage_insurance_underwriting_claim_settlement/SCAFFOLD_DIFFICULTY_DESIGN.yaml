            - call: "POST /mortgage-insurance/lenders"
              payload: { lender_name: "Cascade Mortgage", delegated_underwriting: true, policy_exposure_cap_cents: 200000000 }
              as: MasterPolicyAdmin
              captures: { lender_id: $.data.id }
            - call: "POST /mortgage-insurance/servicers"
