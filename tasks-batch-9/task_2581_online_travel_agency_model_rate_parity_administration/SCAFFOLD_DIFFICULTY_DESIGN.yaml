# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Domain: ota-model-rate-parity (task 2581). Every instance grounds only in SCAFFOLD.yaml §1.1-§1.7.
# YAML anchors below share the canonical bootstrap chain across instances; each alias expands to a
# byte-identical call, so every instance remains independently executable from an empty database.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: supplier_composite_score_provisional_vs_final_diverge
        grounds:
          - calculations.supplier_composite_score
          - state_machines.SupplierScorecard.PROVISIONAL_to_FINAL
          - state_machines.ParityCase.OPEN_to_RESOLVED_COMPLIANT
          - entities.SupplierScorecard.fields.composite_score
          - entities.SupplierScorecard.fields.cases_counted
          - validations[priority=17]
        distinguishing_aspect: |
          The PROVISIONAL variant counts the still-open MAJOR parity case at weight 2 plus one projected
          escalation point (penalty 4 -> parity_component 68 -> composite 85.60) while the FINAL variant
          drops that non-terminal case entirely (penalty 1 -> parity_component 92 -> composite 92.80),
          so the identical period data yields two different composite scores on the SupplierScorecard entity.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; market EU-PAR with paid_slot_capacity 3."
            - "Supplier Hotel Lutetia CERTIFIED with content_score 88 and connectivity_score 91, visibility_status ACTIVE."
            - "One ACTIVE AGENCY ModelAgreement 2026-08-01..2026-12-31 with base_commission_pct 0.15."
            - "One ACTIVE rate plan (FLEX, cutoff 48h, tax_fee_pct 0.01) carrying two LIVE offers: 2026-09-20 and 2026-09-21, both net 24000 so both display_total_cents are 24240."
            - "ParityCase A on 2026-09-20 opened at 100 bps (MINOR) and already closed RESOLVED_COMPLIANT."
            - "ParityCase B on 2026-09-21 opened at 306 bps (MAJOR) and still SUPPLIER_NOTIFIED."
            - "No DisputeCase rows exist, so dispute_component is 100 under both variants."
          setup_api_calls:
            - &k_clock_0805
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - &k_market
              call: "POST /markets"
              payload: { market_code: "EU-PAR", name: "Paris", paid_slot_capacity: 3, price_display_mode: "TOTAL_UPFRONT", ranking_disclosure_required: true }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { mkt_id: $.data.id }
            - &k_sup_h
              call: "POST /suppliers"
              payload: { legal_name: "Hotel Lutetia SA", supplier_type: "HOTEL", home_market_id: "${mkt_id}", contact_email: "ops@lutetia.example", conversion_index: 50 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { sup_h: $.data.id }
            - &k_cert_h_sub
              call: "POST /suppliers/${sup_h}/certifications"
              payload: { content_score_claimed: 90, connectivity_protocol: "JSON_V2", sample_payload_ref: "s3://cert/lutetia.json" }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { cert_h: $.data.id }
            - &k_cert_h_rev
              call: "POST /certifications/${cert_h}/start-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &k_cert_h_dec
              call: "POST /certifications/${cert_h}/decide"
              payload: { decision: "CERTIFY", content_score: 88, connectivity_score: 91 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &k_ma_h
              call: "POST /suppliers/${sup_h}/model-agreements"
              payload: { model: "AGENCY", effective_from: "2026-08-01", effective_to: "2026-12-31", base_commission_pct: 0.15, chargeback_liability_pct_marketplace: 0.60, fraud_liability_cap_cents: 50000, settlement_terms_days: 30 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ma_h: $.data.id }
            - &k_ma_h_act
              call: "POST /model-agreements/${ma_h}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &k_rp_h
              call: "POST /suppliers/${sup_h}/rate-plans"
              payload: { market_id: "${mkt_id}", name: "Flex BAR", currency: "EUR", cancellation_policy_code: "FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.01, parity_monitored: true }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { rp_h: $.data.id, rp_h_v: $.data.version }
            - &k_off_h
              call: "POST /rate-plans/${rp_h}/offers"
              payload: { travel_date: "2026-09-20", net_rate_cents: 24000, allotment_total: 3, expected_rate_plan_version: "${rp_h_v}" }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { off_h: $.data.id }
            - &k_off_h_pub
              call: "POST /offers/${off_h}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_h}"
            - call: "GET /rate-plans/${rp_h}"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { rp_h_v2: $.data.version }
            - call: "POST /rate-plans/${rp_h}/offers"
              payload: { travel_date: "2026-09-21", net_rate_cents: 24000, allotment_total: 3, expected_rate_plan_version: "${rp_h_v2}" }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { off_h2: $.data.id }
            - call: "POST /offers/${off_h2}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_h}"
            - call: "POST /rate-plans/${rp_h}/parity-observations"
              payload: { travel_date: "2026-09-20", channel: "SUPPLIER_WEB", observed_at: "2026-08-06T09:00:00Z", direct_total_cents: 24000 }
              as: ParityAnalyst
              as_user_id: "pa-2"
              captures: { obs_a: $.data.id, case_a: $.data.parity_case_id }
            - call: "POST /parity-cases/${case_a}/close"
              payload: { outcome: "COMPLIANT", note: "supplier corrected within the hour" }
              as: ParityAnalyst
              as_user_id: "pa-2"
            - call: "POST /rate-plans/${rp_h}/parity-observations"
              payload: { travel_date: "2026-09-21", channel: "SUPPLIER_APP", observed_at: "2026-08-07T09:00:00Z", direct_total_cents: 23520 }
              as: ParityAnalyst
              as_user_id: "pa-2"
              captures: { obs_b: $.data.id, case_b: $.data.parity_case_id }
            - call: "POST /parity-cases/${case_b}/notify-supplier"
              payload: {}
              as: ParityAnalyst
              as_user_id: "pa-2"
          trigger:
            - call: "POST /suppliers/${sup_h}/scorecards"
              payload: { period_start: "2026-08-01", period_end: "2026-09-30" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { sc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /scorecards/${sc}/finalize"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
          assert:
            - "DirectRateObservation.${obs_a}.breach_bps == 100 and DirectRateObservation.${obs_a}.severity == MINOR"
            - "DirectRateObservation.${obs_b}.breach_bps == 306 and DirectRateObservation.${obs_b}.severity == MAJOR"
            - "the PROVISIONAL response has SupplierScorecard.${sc}.variant == PROVISIONAL, parity_penalty_points == 4, parity_component == 68, content_component == 88, connectivity_component == 91, dispute_component == 100, cases_counted == 2 and composite_score == 85.60"
            - "the finalize response has SupplierScorecard.${sc}.variant == FINAL, parity_penalty_points == 1, parity_component == 92, cases_counted == 1 and composite_score == 92.80"
            - "92.80 != 85.60: the two variants diverge on identical period data"
            - "SupplierScorecard.${sc}.finalized_by_user_id == co-2 and SupplierScorecard.${sc}.version == 2"

      - name: dispute_liability_preliminary_vs_binding_diverge
        grounds:
          - calculations.dispute_liability_split
          - calculations.dispute_settlement_total
          - state_machines.DisputeCase.FILED_to_RESOLVED
          - entities.DisputeCase.fields.preliminary_marketplace_cents
          - entities.DisputeCase.fields.binding_marketplace_cents
          - entities.DisputeCase.fields.uncapped_marketplace_cents
        distinguishing_aspect: |
          PRELIMINARY reads the MERCHANT agreement covering the 2026-10-05 filing date (0.25 -> marketplace
          51859) while BINDING reads the AGENCY agreement covering the 2026-09-20 booked travel date (0.60 ->
          uncapped 124462) and then clamps it at fraud_liability_cap_cents 50000, so the same 207437
          settlement total splits 51859/155578 preliminarily and 50000/157437 bindingly on the DisputeCase
          entity - a different entity domain from the SupplierScorecard instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z at ingestion, advanced to 2026-10-05T00:00:00Z before filing."
            - "Supplier Hotel Lutetia CERTIFIED with two non-overlapping agreements: A1 AGENCY 2026-08-01..2026-09-30 (chargeback_liability_pct_marketplace 0.60, fraud_liability_cap_cents 50000) and A2 MERCHANT 2026-10-01..2027-03-31 (0.25, cap 900000), both ACTIVE."
            - "Rate plan with tax_fee_pct 0.07; LIVE offer for 2026-09-20 at net 185053 so display_total_cents is 198007."
            - "One booking on that offer, payment_status CAPTURED, refunded_cents 0."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - call: "POST /suppliers/${sup_h}/model-agreements"
              payload: { model: "AGENCY", effective_from: "2026-08-01", effective_to: "2026-09-30", base_commission_pct: 0.15, chargeback_liability_pct_marketplace: 0.60, fraud_liability_cap_cents: 50000, settlement_terms_days: 30 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ma_a1: $.data.id }
            - call: "POST /model-agreements/${ma_a1}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /suppliers/${sup_h}/rate-plans"
              payload: { market_id: "${mkt_id}", name: "Flex Tax7", currency: "EUR", cancellation_policy_code: "FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.07, parity_monitored: false }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { rp_t7: $.data.id, rp_t7_v: $.data.version }
            - call: "POST /rate-plans/${rp_t7}/offers"
              payload: { travel_date: "2026-09-20", net_rate_cents: 185053, allotment_total: 2, expected_rate_plan_version: "${rp_t7_v}" }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { off_t7: $.data.id }
            - call: "POST /offers/${off_t7}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_h}"
            - call: "POST /bookings"
              payload: { offer_id: "${off_t7}", traveler_reference: "PNR-A1", quoted_total_cents: 198007, payment_token: "tok_live_1" }
              as: BookingAgent
              as_user_id: "ba-1"
              captures: { bk_t7: $.data.id }
            - call: "POST /bookings/${bk_t7}/capture"
              payload: {}
              as: BookingAgent
              as_user_id: "ba-1"
            - call: "POST /suppliers/${sup_h}/model-agreements"
              payload: { model: "MERCHANT", effective_from: "2026-10-01", effective_to: "2027-03-31", base_markup_pct: 0.12, chargeback_liability_pct_marketplace: 0.25, fraud_liability_cap_cents: 900000, settlement_terms_days: 45 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ma_a2: $.data.id }
            - call: "POST /model-agreements/${ma_a2}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${bk_t7}/dispute-cases"
              payload: { dispute_type: "FRAUD", claim_cents: 198007, narrative: "card-not-present fraud claim from the issuer" }
              as: ComplianceOfficer
              as_user_id: "co-3"
              captures: { dsp: $.data.id }
            - call: "POST /dispute-cases/${dsp}/resolve"
              payload: { outcome: "SPLIT", note: "shared liability per the travel-date agreement" }
              as: ComplianceOfficer
              as_user_id: "co-4"
          assert:
            - "Offer.${off_t7}.gross_cents == 185053, taxes_fees_cents == 12954, display_total_cents == 198007, marketplace_margin_cents == 27758 and supplier_payable_cents == 157295"
            - "DisputeCase.${dsp}.refund_due_cents == 198007, mediation_fee_pct == 0.035, mediation_fee_cents == 9430 and settlement_total_cents == 207437"
            - "DisputeCase.${dsp}.filing_agreement_id == ${ma_a2} and DisputeCase.${dsp}.binding_agreement_id == ${ma_a1}"
            - "DisputeCase.${dsp}.preliminary_marketplace_cents == 51859 and preliminary_supplier_cents == 155578"
            - "DisputeCase.${dsp}.uncapped_marketplace_cents == 124462, binding_marketplace_cents == 50000 and binding_supplier_cents == 157437"
            - "binding_marketplace_cents 50000 != preliminary_marketplace_cents 51859: the two variants diverge on the same settlement total"

  - rule_id: combinatorial_formula
    instances:
      - name: package_discount_floor_then_largest_remainder_allocation
        grounds:
          - calculations.package_pricing_and_allocation
          - concurrency_rules[package-price-stale-package]
          - state_machines.Package.DRAFT_to_PRICED
          - entities.PackageComponent.fields.discount_alloc_cents
          - entities.PackageComponent.fields.allocated_cents
          - validations[priority=21]
        distinguishing_aspect: |
          The 30700-cent package discount is floored at package level, then floored per component
          (17820 + 12879 = 30699) and the single remaining cent goes to the largest fractional part
          (hotel 0.63 beats air 0.54), producing 17821/12879 - a two-stage floor-plus-largest-remainder
          mode that no single rounding of the raw shares reproduces.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; market EU-PAR."
            - "Hotel supplier CERTIFIED on an AGENCY agreement (0.15) with a tax_fee_pct 0.07 plan; LIVE offer for 2026-09-20 at net 185053 so display_total_cents is 198007."
            - "Air supplier CERTIFIED on a MERCHANT agreement (base_markup_pct 0.12) with a tax_fee_pct 0.05 plan; LIVE offer for 2026-09-20 at net 119936 so gross_cents is 136291 and display_total_cents is 143106."
            - "The hotel offer was created before the air offer, so Offer.created_at ASC orders hotel first."
            - "An opaque DRAFT package for market EU-PAR and 2026-09-20 holding both offers as HOTEL and AIR components."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - &k_rp_t7
              call: "POST /suppliers/${sup_h}/rate-plans"
              payload: { market_id: "${mkt_id}", name: "Flex Tax7", currency: "EUR", cancellation_policy_code: "FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.07, parity_monitored: false }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { rp_t7: $.data.id, rp_t7_v: $.data.version }
            - &k_off_t7
              call: "POST /rate-plans/${rp_t7}/offers"
              payload: { travel_date: "2026-09-20", net_rate_cents: 185053, allotment_total: 2, expected_rate_plan_version: "${rp_t7_v}" }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { off_t7: $.data.id }
            - &k_off_t7_pub
              call: "POST /offers/${off_t7}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_h}"
            - &k_sup_a
              call: "POST /suppliers"
              payload: { legal_name: "Aero Bleu SA", supplier_type: "AIR", home_market_id: "${mkt_id}", contact_email: "dist@aerobleu.example", conversion_index: 45 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { sup_a: $.data.id }
            - &k_cert_a_sub
              call: "POST /suppliers/${sup_a}/certifications"
              payload: { content_score_claimed: 82, connectivity_protocol: "GDS_EDIFACT", sample_payload_ref: "s3://cert/aerobleu.xml" }
              as: SupplierUser
              as_user_id: "${sup_a}"
              captures: { cert_a: $.data.id }
            - &k_cert_a_rev
              call: "POST /certifications/${cert_a}/start-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &k_cert_a_dec
              call: "POST /certifications/${cert_a}/decide"
              payload: { decision: "CERTIFY", content_score: 80, connectivity_score: 95 }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &k_ma_a
              call: "POST /suppliers/${sup_a}/model-agreements"
              payload: { model: "MERCHANT", effective_from: "2026-08-01", effective_to: "2026-12-31", base_markup_pct: 0.12, chargeback_liability_pct_marketplace: 0.35, fraud_liability_cap_cents: 120000, settlement_terms_days: 21 }
              as: CommercialManager
              as_user_id: "cm-1"
              captures: { ma_a: $.data.id }
            - &k_ma_a_act
              call: "POST /model-agreements/${ma_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - &k_rp_a
              call: "POST /suppliers/${sup_a}/rate-plans"
              payload: { market_id: "${mkt_id}", name: "Air Semi-Flex", currency: "EUR", cancellation_policy_code: "MODERATE", free_cancel_cutoff_hours: 72, tax_fee_pct: 0.05, parity_monitored: false }
              as: SupplierUser
              as_user_id: "${sup_a}"
              captures: { rp_a: $.data.id, rp_a_v: $.data.version }
            - &k_off_a
              call: "POST /rate-plans/${rp_a}/offers"
              payload: { travel_date: "2026-09-20", net_rate_cents: 119936, allotment_total: 4, expected_rate_plan_version: "${rp_a_v}" }
              as: SupplierUser
              as_user_id: "${sup_a}"
              captures: { off_a: $.data.id }
            - &k_off_a_pub
              call: "POST /offers/${off_a}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_a}"
            - &k_pkg
              call: "POST /packages"
              payload: { market_id: "${mkt_id}", travel_date: "2026-09-20", name: "Paris Opaque Weekend", opaque: true }
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { pkg: $.data.id }
            - &k_pkg_cmp_h
              call: "POST /packages/${pkg}/components"
              payload: { offer_id: "${off_t7}", component_type: "HOTEL" }
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { cmp_h: $.data.id }
            - &k_pkg_cmp_a
              call: "POST /packages/${pkg}/components"
              payload: { offer_id: "${off_a}", component_type: "AIR" }
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { cmp_a: $.data.id }
            - &k_pkg_read
              call: "GET /packages/${pkg}"
              payload: {}
              as: CommercialManager
              as_user_id: "cm-2"
              captures: { pkg_v: $.data.version }
          trigger:
            - call: "POST /packages/${pkg}/price"
              payload: { expected_package_version: "${pkg_v}" }
              as: CommercialManager
              as_user_id: "cm-2"
          assert:
            - "Offer.${off_a}.gross_cents == 136291, taxes_fees_cents == 6815, display_total_cents == 143106, marketplace_margin_cents == 16355 and supplier_payable_cents == 119936"
            - "Package.${pkg}.components_subtotal_cents == 341113, discount_pct == 0.09, discount_cents == 30700 and package_total_cents == 310413"
            - "PackageComponent.${cmp_h}.display_total_snapshot_cents == 198007, discount_alloc_cents == 17821 and allocated_cents == 180186"
            - "PackageComponent.${cmp_a}.display_total_snapshot_cents == 143106, discount_alloc_cents == 12879 and allocated_cents == 130227"
            - "17821 + 12879 == 30700 and 180186 + 130227 == 310413: both allocation identities close exactly"
            - "Package.${pkg}.status == PRICED and Package.${pkg}.component_count == 2"

      - name: dispute_fee_tier_keyed_on_availability_clamped_refund_due
        grounds:
          - calculations.dispute_settlement_total
          - calculations.refund_passthrough_due
          - entities.DisputeCase.fields.refund_due_cents
          - entities.DisputeCase.fields.mediation_fee_pct
          - validations[priority=33]
        distinguishing_aspect: |
          claim_cents 999999 exceeds what is left on the booking, so min() takes the availability branch
          (200000 - 100000 = 100000); the fee tier is then keyed on that clamped 100000 and selects 0.035,
          whereas keying it on claim_cents would select 0.050 and produce fee 7500 instead of 6000 - a
          clamp-then-tier evaluation-order mode, not a rounding-allocation one.
        test_recipe:
          setup:
            - "Logical clock advanced to 2026-09-18T16:00:00Z, which is 47 hours before the 2026-09-20T15:00:00Z arrival."
            - "Hotel supplier CERTIFIED on the AGENCY 0.15 agreement with a FLEX plan whose free_cancel_cutoff_hours is 48 and tax_fee_pct is 0.00; LIVE offer at net 200000 so display_total_cents is 200000."
            - "One booking on that offer, CAPTURED then CANCELLED inside the cutoff, so cancellation_refund_pct is 0.50 and refunded_cents is 100000."
          setup_api_calls:
            - *k_clock_0805
            - *k_market
            - *k_sup_h
            - *k_cert_h_sub
            - *k_cert_h_rev
            - *k_cert_h_dec
            - *k_ma_h
            - *k_ma_h_act
            - &k_rp_t0
              call: "POST /suppliers/${sup_h}/rate-plans"
              payload: { market_id: "${mkt_id}", name: "Flex NoTax", currency: "EUR", cancellation_policy_code: "FLEX", free_cancel_cutoff_hours: 48, tax_fee_pct: 0.00, parity_monitored: false }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { rp_t0: $.data.id, rp_t0_v: $.data.version }
            - &k_off_t0
              call: "POST /rate-plans/${rp_t0}/offers"
              payload: { travel_date: "2026-09-20", net_rate_cents: 200000, allotment_total: 2, expected_rate_plan_version: "${rp_t0_v}" }
              as: SupplierUser
              as_user_id: "${sup_h}"
              captures: { off_t0: $.data.id }
            - &k_off_t0_pub
              call: "POST /offers/${off_t0}/publish"
              payload: {}
              as: SupplierUser
              as_user_id: "${sup_h}"
            - &k_bk_t0
              call: "POST /bookings"
              payload: { offer_id: "${off_t0}", traveler_reference: "PNR-B2", quoted_total_cents: 200000, payment_token: "tok_live_2" }
              as: BookingAgent
              as_user_id: "ba-1"
              captures: { bk_t0: $.data.id }
            - &k_bk_t0_cap
              call: "POST /bookings/${bk_t0}/capture"
