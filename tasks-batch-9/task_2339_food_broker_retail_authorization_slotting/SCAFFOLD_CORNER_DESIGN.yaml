          One deal re-quoted three times drives all five constants: the volume
          credit is capped at VOLUME_CREDIT_CAP_BPS of GROSS (not of net, and not
          uncapped), and the admin tier is keyed on net_before_admin_cents with
          ADMIN_TIER_1_MAX_CENTS INCLUSIVE — the counter lands net on exactly
          5000000, where keying the tier on quoted_fee_cents (5125000 > 5000000)
          would silently switch to 150 bps and produce 5076875.
