            - { call: "GET /api/rentals/${r}", payload: {}, as: PremiumSalesRep, captures: { rst: $.data.status, rfee: $.data.cancel_fee_cents } }
            - { call: "GET /api/invoices", payload: { rental_id: "${r}" }, as: FinanceController, captures: { ist: "$.data[0].status" } }
            - { call: "GET /api/accounts/${ac}", payload: {}, as: FinanceController, captures: { bal: $.data.balance_due_cents } }
