          - state_machines.Receipt.RECONCILED_to_DISPUTED
        distinguishing_aspect: "The metric's numerator is the sum over receipts in the inclusion set only, so flipping one receipt to DISPUTED removes it from the numerator even though the guest count is unchanged."
        test_recipe:
