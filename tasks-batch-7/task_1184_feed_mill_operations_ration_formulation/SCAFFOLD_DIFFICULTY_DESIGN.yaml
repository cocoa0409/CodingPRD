  - rule_id: priority_pair_validation_conflict
    instances:
      - name: start_cancelled_batch_with_flush_due_state_beats_safety
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Batch.transitions
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FLUSH_REQUIRED]
        distinguishing_aspect: |
          Category pair state vs business_safety: the batch is CANCELLED (state precondition fails)
          AND the line needs a flush (safety gate fails). Priority 6 < 7, so ERR_INVALID_STATE wins
          and ERR_FLUSH_REQUIRED must not leak. Different category pair from the permit/credit instance.
        test_recipe:
          setup:
