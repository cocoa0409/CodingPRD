              as: FinanceAnalyst
            - call: "GET /agreements/${agr_e}/installments"
              payload: { limit: 100 }
              as: FinanceAnalyst
          assert:
            - "precondition: ${e_af0} == 502000, ${e_fc0} == 37650, ${e_top0} == 539650, ${end_1_status} == 'PENDING' and ${end_1_signed} == 50000 (ADDITIONAL_PREMIUM is signed positive)"
            - "${end_1_declined} == 'DECLINED' — the only PENDING endorsement leaves that status, and nothing else in the system changes"
            - "${blocked_error} == 'ERR_NO_PENDING_ENDORSEMENTS' with HTTP 422 even though the OCC token was correct, so this is the cross-entity gate and not a concurrency failure"
            - "${pol_endorsed_before} == 0 and ${pol_financed_before} == 600000 — the declined endorsement never enters the financed premium"
            - "${end_2_status} == 'PENDING'; a single new child in the right status unblocks the parent recomputation"
            - "${e_status} == 'ACTIVE', ${e_total} == 650000, ${e_af1} == 552000, ${e_fc1} == 41400 (round_half_up(552000 * 1500 * 6 / 120000)) and ${e_top1} == 593400"
            - "${e_principal} == 552000 and ${e_unpaid_fc} == 41400 — the deltas are exactly +50000 principal and +3750 finance charge"
            - "${pol_endorsed_after} == 50000 and ${pol_financed_after} == 650000 — the visible result of the gate lands on the endorsement's own parent policy"
            - "GET /policies/${pol_e}/endorsements returns total_count == 2 with one DECLINED (financed_at null) and one FINANCED (financed_at stamped)"
            - "GET /agreements/${agr_e}/installments returns total_count == 6, every amount_cents == 98900 with finance_charge_component_cents == 6900 and principal_component_cents == 92000, summing to 593400 and 41400"
            - "${ver_now} > ${ver_before} — creating the second endorsement did not bump the agreement, but the declined-endorsement attempt is required to leave the version alone, so a stale ${ver_before} replayed after the successful financing must now return ERR_STALE_AGREEMENT_VERSION with HTTP 412"

  - rule_id: compensating_invariant
    instances:

      - name: total_receivable_invariant_across_reversal_and_waiver
        grounds:
          - calculations.payment_waterfall_allocation.compensation_invariant
          - endpoints.POST_payments_payment_id_reverse
          - endpoints.POST_late_fees_late_fee_id_waive
          - state_machines.LateFeeAssessment.OUTSTANDING_to_PAID
          - state_machines.LateFeeAssessment.PAID_to_OUTSTANDING
          - state_machines.LateFeeAssessment.OUTSTANDING_to_WAIVED
          - state_machines.Payment.POSTED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: total_receivable_cents == principal_balance_cents +
          unpaid_finance_charge_cents + late_fee_balance_cents - unapplied_credit_cents. Two opposite
          compensations are run against the same note: a payment REVERSAL, which must restore the
          quantity exactly (a round trip with zero drift across four balance fields, five installment
          rows and one late-fee row), and a fee WAIVER, which must reduce it by exactly the fee. The
          probe is late_fee_count, which is deliberately NOT part of the conserved quantity and is NOT
