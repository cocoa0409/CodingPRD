  # ===========================================================================
  # Section 4 — Validations
  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A call without X-User-Role / X-User-ID to an endpoint that does not list Anonymous is rejected with ERR_UNAUTHENTICATED (401) before any role check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /library-network/stewards", payload: {}, captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id == ERR_UNAUTHENTICATED (captured ${err}), HTTP 401"

      - name: steward_role_denied_for_module_management
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED_ROLE]", "roles"]
        distinguishing_aspect: "The Steward role is not in the roles list of POST /training-modules or POST /map/sweeps; both attempts return ERR_UNAUTHORIZED_ROLE (403)."
        test_recipe:
