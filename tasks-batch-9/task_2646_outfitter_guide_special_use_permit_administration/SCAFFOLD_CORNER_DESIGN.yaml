              as: AuthorizedOfficer
              as_user_id: "officer-1"
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
              payload: { severity: "MINOR", action_type: "WARNING", cited_provision: "36 CFR 251.56(a)", cure_deadline_date: "2027-03-01" }
              as: AuthorizedOfficer
              as_user_id: "officer-1"
            - call: "POST /osup/permits/${p_id}/noncompliance-actions"
