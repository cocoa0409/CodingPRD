    roles: [Member, LocationManager]
    code: 200
    input: [plan_id, expected_subscription_version]
    output: Subscription
    side_effects:
      - "Compute subscription_upgrade_charge BEFORE re-anchoring; append Invoice{kind=UPGRADE_PRORATION, status=PAID}"
      - "Subscription.plan_id -> new plan; cycle re-anchored to clock; granted_credits_remaining set to new plan.monthly_credit_grant"
