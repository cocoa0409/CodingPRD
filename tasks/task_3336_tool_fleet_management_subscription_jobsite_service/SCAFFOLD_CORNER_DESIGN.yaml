      - name: loaner_selector_picks_oldest_available
        claim_type: selector_determinism
        grounds: [calculations.loaner_allocation]
        distinguishing_aspect: "Two AVAILABLE units of the same model: the one with the earliest created_at is dispatched; the newer stays AVAILABLE."
        test_recipe:
          setup: ["ticket in IN_SHOP (loaner_requested=true); two AVAILABLE loaners LN-OLD then LN-NEW of the asset's model"]
          setup_api_calls:
            - call: "POST /fleet/accounts"
              payload: { company_name: "Zulu GC", tax_id: "EIN-SM4", credit_limit_cents: 100000000 }
              as: FleetAdmin
              captures: { acct: $.data.id }
