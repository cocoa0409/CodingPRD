# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# (task 1364). Breadth walk over SCAFFOLD.yaml §1.1–§1.7 per
# references/claim-extraction-guide.md. 46 non-stub instances + 12
# excluded_because stubs. Names are unique across BOTH design files.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: program_creation_computed_defaults
        claim_type: creation
        grounds: [entities.ResidencyProgram.fields.accreditation_status]
        distinguishing_aspect: "Creating a program returns server-minted id, version 1, and the computed accreditation_status already initialized to CONTINUED."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1001" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id", pv: "$.data.version", pst: "$.data.accreditation_status" } }
          assert:
            - "Response is 201 with envelope keys meta.api_request_id, meta.api_request_timestamp, response_type == object, data present"
            - "ResidencyProgram.version == 1 and accreditation_status == CONTINUED (computed default applied at creation)"
            - "id is a server-minted UUID; created_at/updated_at are ISO 8601 with three fractional digits"

      - name: year_creation_generates_thirteen_blocks
        claim_type: system_fields
        grounds: [entities.ScheduleBlock, state_machines.ScheduleBlock]
        distinguishing_aspect: "Year create side effect materializes the full block diagram: exactly 13 CURRENT blocks; block 1 starts at year start_date; block 13 ends exactly at year end_date; each block spans 28 days."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1002" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
          trigger:
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id", yst: "$.data.status" } }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr}" }, as: ProgramCoordinator, captures: { b1: "$.data[0].id", b13start: "$.data[12].start_date" } }
          assert:
            - "AcademicYear status == PLANNING (initial state)"
            - "GET schedule-blocks?academic_year_id returns total_count == 13, all status CURRENT"
            - "data[0].block_index == 1 with start_date == 2026-07-01; data[12].block_index == 13 with end_date == 2027-06-30 (each block exactly 28 days, half-open)"

      - name: year_invalid_span_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_YEAR_SPAN]
        distinguishing_aspect: "A 363-day span (end 2027-06-29) violates the exactly-364-days structural rule and is rejected 422."
        test_recipe:
          setup: ["Program exists"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1003" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
          trigger:
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-29" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id ERR_INVALID_YEAR_SPAN (422); no AcademicYear row and no ScheduleBlocks are created"

      - name: resident_create_missing_required_email
        claim_type: required_fields
        grounds:
          - entities.Resident.fields.email
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting the required input field email is a 400 ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup: ["Program, year, APPROVED complement exist"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1004" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
          trigger:
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id ERR_INVALID_REQUEST (400); no Resident row created"

      - name: evaluation_immutable_common_fields_absent
        claim_type: immutability
        grounds: [entities.MilestoneEvaluation]
        distinguishing_aspect: "MilestoneEvaluation is common_fields: false — an append-only event carrying id + created_at only; no version/updated_at appear and no update/delete endpoint exists."
        test_recipe:
          setup: ["Program, ACTIVE year, APPROVED complement, ACTIVE resident"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1005" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
          trigger:
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: FacultyEvaluator, as_user_id: "ev-1", captures: { ev: "$.data.id", er: "$.data.evaluator_role" } }
          assert:
            - "Response contains id and created_at but NO version and NO updated_at keys (common_fields: false)"
            - "evaluator_id == ev-1 and evaluator_role == FACULTY (stamped from headers, not the payload)"
            - "No PUT/PATCH/DELETE endpoint exists for milestone-evaluations in the API table (immutability by surface)"

      - name: resident_create_without_approved_complement_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=10]
          - errors[ERR_NO_APPROVED_COMPLEMENT]
        distinguishing_aspect: "Resident enrollment requires an APPROVED or LOCKED complement for the exact (program, entry year, pgy_level) triple; a merely SUBMITTED complement does not satisfy it."
        test_recipe:
          setup: ["Program, year, complement in SUBMITTED (not yet approved) status"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1006" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
          trigger:
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id ERR_NO_APPROVED_COMPLEMENT (409); no Resident row created"

      - name: get_resident_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Reading a random UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["One program exists"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1007" }, as: DesignatedInstitutionalOfficial }
          trigger:
            - { call: "GET /residency-programs/residents/00000000-0000-0000-0000-000000000000", payload: {}, as: ProgramDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404 and error envelope shape {meta, response_type: error, data.{error_id, message}}"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: year_double_activate_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.AcademicYear
          - errors[ERR_ACADEMIC_YEAR_NOT_PLANNING]
        distinguishing_aspect: "Activating an already-ACTIVE year is an invalid-from transition: ERR_ACADEMIC_YEAR_NOT_PLANNING, no version bump."
        test_recipe:
          setup: ["Program and ACTIVE year"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1008" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator, captures: { v2: "$.data.version" } }
          trigger:
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "Second activate fails with error_id ERR_ACADEMIC_YEAR_NOT_PLANNING (409)"
            - "AcademicYear.${yr}.version == 2 (failed transition did not mutate)"

      - name: graduated_resident_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Resident
          - errors[ERR_RESIDENT_NOT_ACTIVE]
        distinguishing_aspect: "GRADUATED is terminal: place-on-leave afterwards is rejected with ERR_RESIDENT_NOT_ACTIVE."
        test_recipe:
          setup:
            - "Full graduation path executed: program, ACTIVE year, APPROVED complement, resident ACTIVE, CaseRequirement MAJOR_SURGERY (1, 0) satisfied by one VERIFIED SURGEON log, FINALIZED CCC review (3 evaluations, SATISFACTORY), graduate succeeded"
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro Surgery", specialty: "GENERAL_SURGERY", acgme_program_code: "440-00-1009" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog}", name: "General Surgery", min_pgy_level: 1, max_residents_per_block: 5 }, as: ProgramCoordinator, captures: { rot: "$.data.id" } }
            - { call: "POST /residency-programs/case-requirements", payload: { program_id: "${prog}", procedure_category: "MAJOR_SURGERY", required_count: 1, required_primary_count: 0 }, as: ProgramDirector }
            - { call: "POST /residency-programs/procedure-case-logs", payload: { resident_id: "${res}", rotation_id: "${rot}", procedure_category: "MAJOR_SURGERY", performed_date: "2026-08-03", role: "SURGEON" }, as: Resident, as_user_id: "${res}", captures: { cl: "$.data.id" } }
            - { call: "POST /residency-programs/procedure-case-logs/${cl}/verify", payload: {}, as: FacultyEvaluator, as_user_id: "ev-1" }
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: FacultyEvaluator, as_user_id: "ev-1" }
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: FacultyEvaluator, as_user_id: "ev-2" }
            - { call: "POST /residency-programs/milestone-evaluations", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1", competency_ratings: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: FacultyEvaluator, as_user_id: "ev-3" }
            - { call: "POST /residency-programs/ccc-reviews", payload: { resident_id: "${res}", academic_year_id: "${yr}", reporting_period: "H1" }, as: CCCChair, as_user_id: "chair-1", captures: { ccc: "$.data.id" } }
            - { call: "POST /residency-programs/ccc-reviews/${ccc}/begin-deliberation", payload: {}, as: CCCChair, as_user_id: "chair-1" }
            - { call: "POST /residency-programs/ccc-reviews/${ccc}/finalize", payload: { outcome: "SATISFACTORY", milestone_levels: [ { competency: "PATIENT_CARE", level: 3 }, { competency: "MEDICAL_KNOWLEDGE", level: 3 }, { competency: "PROFESSIONALISM", level: 3 }, { competency: "COMMUNICATION", level: 3 }, { competency: "PRACTICE_BASED_LEARNING", level: 3 }, { competency: "SYSTEMS_BASED_PRACTICE", level: 3 } ] }, as: CCCChair, as_user_id: "chair-1" }
            - { call: "POST /residency-programs/residents/${res}/graduate", payload: {}, as: ProgramDirector, captures: { g: "$.data.lifecycle_status" } }
          trigger:
            - { call: "POST /residency-programs/residents/${res}/place-on-leave", payload: {}, as: ProgramDirector, captures: { err: "$.data.error_id" } }
          assert:
            - "Graduation succeeded: lifecycle_status == GRADUATED"
            - "place-on-leave from GRADUATED fails with error_id ERR_RESIDENT_NOT_ACTIVE (terminal lockdown)"
            - "transfer and graduate from GRADUATED likewise fail (terminal states accept no transitions)"

      - name: locked_complement_rejects_submit_and_edit
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ComplementApproval
          - errors[ERR_COMPLEMENT_NOT_SUBMITTABLE]
          - errors[ERR_COMPLEMENT_NOT_EDITABLE]
        distinguishing_aspect: "LOCKED is terminal for edits: submit and the OCC-guarded PUT are both rejected; the PUT carries the CORRECT current version, proving the rejection is the state rule and not OCC."
        test_recipe:
          setup: ["Program, year, complement driven DRAFT -> SUBMITTED -> APPROVED -> LOCKED"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1010" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/complement-approvals/${comp}/lock", payload: {}, as: DesignatedInstitutionalOfficial, captures: { vlock: "$.data.version" } }
          trigger:
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector, captures: { err1: "$.data.error_id" } }
            - { call: "PUT /residency-programs/complement-approvals/${comp}", payload: { approved_positions: 9, expected_complement_approval_version: "${vlock}" }, as: ProgramDirector, captures: { err2: "$.data.error_id" } }
          assert:
            - "submit from LOCKED fails with error_id ERR_COMPLEMENT_NOT_SUBMITTABLE (409)"
            - "PUT with the CORRECT version ${vlock} still fails with error_id ERR_COMPLEMENT_NOT_EDITABLE (409) — state lock, not staleness"
            - "ComplementApproval.${comp} remains LOCKED with version unchanged"

      - name: citation_invalid_transition_errors
        claim_type: invalid_transition
        grounds:
          - state_machines.AccreditationCitation
          - errors[ERR_CITATION_RESPONSE_NOT_DRAFTED]
          - errors[ERR_CITATION_NOT_RESOLVABLE]
          - errors[ERR_CITATION_NOT_ESCALATABLE]
          - errors[ERR_CITATION_NOT_DRAFTABLE]
        distinguishing_aspect: "From OPEN, submit-response/resolve/escalate are each invalid-from transitions with their specific error; from RESPONSE_DRAFTED a second draft-response is rejected."
        test_recipe:
          setup: ["Program with one OPEN citation"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1011" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/accreditation-citations", payload: { program_id: "${prog}", citation_code: "IV.A.2", severity: "WARNING", area_code: "EVALUATION", due_date: "2026-12-01" }, as: DesignatedInstitutionalOfficial, captures: { cit: "$.data.id" } }
          trigger:
            - { call: "POST /residency-programs/accreditation-citations/${cit}/submit-response", payload: {}, as: ProgramDirector, captures: { e1: "$.data.error_id" } }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/resolve", payload: { resolution_note: "premature" }, as: DesignatedInstitutionalOfficial, captures: { e2: "$.data.error_id" } }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/escalate", payload: { escalation_reason: "premature" }, as: DesignatedInstitutionalOfficial, captures: { e3: "$.data.error_id" } }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/draft-response", payload: { response_text: "First draft." }, as: ProgramDirector }
            - { call: "POST /residency-programs/accreditation-citations/${cit}/draft-response", payload: { response_text: "Second draft." }, as: ProgramDirector, captures: { e4: "$.data.error_id" } }
          assert:
            - "submit-response from OPEN: ERR_CITATION_RESPONSE_NOT_DRAFTED; resolve from OPEN: ERR_CITATION_NOT_RESOLVABLE; escalate from OPEN: ERR_CITATION_NOT_ESCALATABLE"
            - "draft-response succeeds (OPEN -> RESPONSE_DRAFTED); a second draft-response from RESPONSE_DRAFTED fails with ERR_CITATION_NOT_DRAFTABLE"
            - "Citation status is RESPONSE_DRAFTED at the end (exactly one successful transition)"

      - name: probation_lift_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ProbationCase
          - errors[ERR_PROBATION_NOT_ACTIVE]
        distinguishing_aspect: "Repeating lift on a LIFTED (terminal) probation case fails with ERR_PROBATION_NOT_ACTIVE; the first lift's standing recompute is not replayed."
        test_recipe:
          setup: ["Program, ACTIVE year, APPROVED complement, ACTIVE resident with an ACTIVE probation case"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1012" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
