  # ===========================================================================
  # RULE 9 — compensating_invariant  (3 instances; three DIFFERENT conserved
  #          quantities: reviewer load ledger, format capacity ledger,
  #          CME minute pool)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: reviewer_load_returns_to_zero_after_assign_decline_reassign_submit
        grounds:
          - calculations.reviewer_load_ledger
          - calculations.reviewer_selection_by_expertise
          - entities.CommitteeMember.fields.current_review_load
          - entities.Review.fields.status
          - endpoints.POST./reviews/{reviewId}/decline
        distinguishing_aspect: |
          The conserved quantity is the reviewer load ledger. A full round trip -
          explicit assignment to Rui, decline with auto_reassign, automatic
          reassignment to Nadia, submission by Nadia - must return BOTH members'
          current_review_load to the starting value 0, and the sum across the
          committee must equal the count of ASSIGNED reviews (zero) at the end.
          An implementation that decrements on decline but forgets to decrement on
          submission, or that leaves the declined row counted, drifts.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 at REVIEW_OPEN."
            - "Category EDU with min_reviews_required 2, so one submitted review is not enough to score the abstract."
            - "Ada's abstract has keywords [oncology, immunotherapy] and no reviews yet."
            - "Reviewer Rui has expertise [oncology, imaging] (Dice 0.5000 against the abstract) and Nadia has [oncology, immunotherapy] (Dice 1.0000); both are ACTIVE with COI declared and current_review_load 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "EDU", name: "Education Research", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], requires_structured_body: false, min_reviews_required: 2, discrepancy_threshold: 4.00, cme_eligible: false }
              as: ConferenceAdmin
              captures: { cat_edu_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Rui Alvarez", email: "rui@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "imaging"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r1_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r1_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_r1_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Nadia Lund", email: "nadia@panel.example", member_role: "REVIEWER", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_r3_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_r3_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
