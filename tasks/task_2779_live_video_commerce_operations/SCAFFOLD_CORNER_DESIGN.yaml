          - errors[ERR_VIEWER_MUTED]
          - entities.Viewer.fields.muted_until
        distinguishing_aspect: "Two blocked chats reach MUTE_STRIKE_THRESHOLD and mute the viewer until 18:25Z; a chat at 18:10Z returns 403 ERR_VIEWER_MUTED, and a chat at exactly 18:25Z is accepted because the auto-unmute condition is muted_until <= logical now."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z. Viewer 1 submits two chats and a moderator BLOCKs both, taking strike_count to 2."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "first bad message" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { chM1: $.data.id }
            - call: "POST /interactions/${chM1}/moderate"
              payload: { action: "BLOCK", blocked_reason: "ABUSE" }
              as: Moderator
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "second bad message" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { chM2: $.data.id }
            - call: "POST /interactions/${chM2}/moderate"
              payload: { action: "BLOCK", blocked_reason: "ABUSE" }
              as: Moderator
          trigger:
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "let me back in" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { err_muted: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T18:25:00Z" }
              as: PlatformAdmin
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "back on air" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { chM3: $.data.id }
          assert:
            - "After the two blocks: Viewer.${v1}.strike_count == 2, chat_status == MUTED, muted_until == 2026-08-10T18:25:00Z (block instant + 15 minutes)"
            - "The 18:10Z chat returns 403 with ${err_muted} == ERR_VIEWER_MUTED and creates no Interaction row"
            - "The 18:25Z chat returns 201 with Interaction.${chM3}.state == PENDING_MODERATION"
            - "Viewer.${v1}.chat_status == ACTIVE after the accepted call, with strike_count still 2 and muted_until cleared"

      - name: go_live_one_minute_before_the_early_window_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=17]
          - errors[ERR_GO_LIVE_WINDOW_CLOSED]
        distinguishing_aspect: "The go-live window opens exactly 30 minutes before scheduled_start_at: 17:29Z returns 409 ERR_GO_LIVE_WINDOW_CLOSED for a show starting at 18:00Z, while 17:30Z is accepted and stamps went_live_at at that instant."
        test_recipe:
          setup:
            - "READY show scheduled 18:00Z-20:00Z with readiness index 100."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T17:29:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /shows/${sh1}/go-live"
              payload: {}
              as: ShowProducer
              captures: { err_glw: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T17:30:00Z" }
              as: PlatformAdmin
            - call: "POST /shows/${sh1}/go-live"
              payload: {}
              as: ShowProducer
          assert:
            - "First go-live: HTTP 409 with ${err_glw} == ERR_GO_LIVE_WINDOW_CLOSED; Show.${sh1}.status == READY and went_live_at == null"
            - "Second go-live: HTTP 200; Show.${sh1}.status == LIVE and went_live_at == 2026-08-10T17:30:00Z"
            - "StreamChannel.${ch1}.status == LIVE (PROVISIONED->LIVE cascade) only after the accepted call"

      - name: offer_activate_at_the_window_end_accepted_one_second_later_rejected
        claim_type: priority_ordering
        grounds:
          - validations[priority=16]
          - errors[ERR_OFFER_WINDOW_CLOSED]
          - state_machines.FlashOffer.SCHEDULED_to_ACTIVE
        distinguishing_aspect: "The activation window is a closed interval: activating at exactly window_end_at 19:00:00Z succeeds, and one second later the sibling offer with the identical window is refused with 409 ERR_OFFER_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Show LIVE (went live 17:50Z, scheduled to 20:00Z) with two SCHEDULED offers on two products, both windowed 18:00Z-19:00Z."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_product3
            - *k_substantiate3
            - *k_slot2
            - call: "POST /flash-offers"
              payload: { lineup_slot_id: "${sl2}", offer_price_cents: 3000, window_start_at: "2026-08-10T18:00:00Z", window_end_at: "2026-08-10T19:00:00Z", max_qty: 10, expected_lineup_slot_version: "${sl2_v}" }
              as: MerchandisingManager
              captures: { oW2: $.data.id }
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T19:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /flash-offers/${oW2}/activate"
              payload: {}
              as: MerchandisingManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T19:00:01Z" }
              as: PlatformAdmin
            - call: "POST /flash-offers/${o1}/activate"
              payload: {}
              as: MerchandisingManager
              captures: { err_win: $.data.error_id }
          assert:
            - "First activate: HTTP 200; FlashOffer.${oW2}.status == ACTIVE with activated_at == 2026-08-10T19:00:00Z"
            - "Second activate: HTTP 409 with ${err_win} == ERR_OFFER_WINDOW_CLOSED; FlashOffer.${o1}.status stays SCHEDULED and activated_at == null"
            - "The show is LIVE for both calls, so priority 9 passes and priority 16 is the deciding rule"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: inventory_adjustment_revises_cost_and_rejects_negative_available
        claim_type: standard_crud
        grounds:
          - endpoints[POST /products/{product_id}/inventory-adjustments]
          - validations[priority=31]
          - errors[ERR_INSUFFICIENT_INVENTORY]
        distinguishing_aspect: "The adjustment endpoint carries two independent side effects: it replaces unit_cost_cents without touching LineupSlot.unit_cost_snapshot_cents, and it refuses any delta that would drive available_qty negative."
        test_recipe:
          setup:
            - "One product with 50 units at 1500 cents, merchandised by one lineup slot whose cost snapshot was taken at slot creation."
          setup_api_calls:
            - *k_clock_t0
            - *k_product
            - *k_show
            - *k_slot
          trigger:
            - call: "POST /products/${p1}/inventory-adjustments"
              payload: { reason: "CYCLE_COUNT", on_hand_delta: 5, unit_cost_cents: 1700 }
              as: MerchandisingManager
            - call: "POST /products/${p1}/inventory-adjustments"
              payload: { reason: "SHRINKAGE", on_hand_delta: -60 }
              as: MerchandisingManager
              captures: { err_adj: $.data.error_id }
          assert:
            - "First adjustment: HTTP 200; Product.${p1}.on_hand_qty == 55, available_qty == 55, unit_cost_cents == 1700"
            - "LineupSlot.${sl1}.unit_cost_snapshot_cents == 1500 — the snapshot is deliberately NOT revised (this is what makes the FINAL margin variant diverge)"
            - "Second adjustment: HTTP 422 with ${err_adj} == ERR_INSUFFICIENT_INVENTORY; on_hand_qty stays 55 and available_qty stays 55"

      - name: order_cancel_from_authorized_voids_and_restocks_the_exhausted_offer
        claim_type: conditional_action
        grounds:
          - endpoints[POST /orders/{order_id}/cancel]
          - state_machines.Order.AUTHORIZED_to_VOIDED
          - calculations.inventory_pool_reconciliation
        distinguishing_aspect: "The cancel endpoint branches on payment_state: from AUTHORIZED it VOIDs with refunded_cents 0, moves fulfillment PENDING->CANCELLED, releases the COMMITTED lines and lifts the offer back from EXHAUSTED to ACTIVE, while Show.gross_merchandise_cents stays 0 because the order was never captured."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z; viewer 1 commits the offer's entire allotment of 10 units, so the offer is EXHAUSTED and one AUTHORIZED order exists."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_confirm
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_activate
            - *k_cart1
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 10 }
              as: Viewer
              as_user_id: "${v1}"
              captures: { itV: $.data.id }
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
            - call: "POST /carts/${ct1}/checkout"
              payload: { expected_cart_version: "${ct1_v}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ordV: $.data.id }
          trigger:
            - call: "POST /orders/${ordV}/cancel"
              payload: { cancel_reason: "VIEWER_REMORSE" }
              as: MerchandisingManager
          assert:
            - "Before the cancel: Order.${ordV} has payment_state AUTHORIZED, fulfillment_state PENDING, merchandise_cents 31500, tax_cents 2756, shipping_cents 0, total_cents 34256; FlashOffer.${o1}.status == EXHAUSTED with sold_qty 10"
            - "HTTP 200; Order.${ordV}: payment_state == VOIDED, fulfillment_state == CANCELLED, refunded_cents == 0, cancelled_at == 2026-08-10T18:10:00Z, cancel_reason == 'VIEWER_REMORSE'"
            - "CartItem.${itV}.state == RELEASED with released_reason == ORDER_CANCELLED"
            - "FlashOffer.${o1}: sold_qty == 0, held_qty == 0, remaining_qty == 10, status == ACTIVE (EXHAUSTED->ACTIVE restock)"
            - "Product.${p1}: committed_qty == 0, reserved_qty == 0, available_qty == 50; Show.${sh1}.gross_merchandise_cents == 0"

      - name: show_analytics_computed_read
        claim_type: computed_read
        excluded_because:
          difficulty_instance: show_margin_provisional_vs_final_diverge
          rationale: "§1.8 drives GET /shows/{show_id}/analytics for both variants and asserts every monetary field of the response as well as the margin_provisional_cents stamp."

      - name: host_performance_computed_read
        claim_type: computed_read
        excluded_because:
          difficulty_instance: host_score_live_window_vs_attributed_72h
          rationale: "§1.8 drives GET /hosts/{host_id}/performance for both variants over one dataset and asserts every component of the weighted score."

      - name: health_report_action_endpoint
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: simulcast_index_three_input_nonlinear
          rationale: "§1.8 posts health reports across three channels and asserts the recomputation of every channel's readiness_index plus the show-level min(), which subsumes a plain action-endpoint check."

  # ===========================================================================
  - section: errors
    instances:

      - name: every_path_id_not_found_error_is_triggerable
        claim_type: error_triggerable
        grounds:
          - validations[priority=4]
          - errors[ERR_HOST_NOT_FOUND]
          - errors[ERR_PRODUCT_NOT_FOUND]
          - errors[ERR_VIEWER_NOT_FOUND]
          - errors[ERR_SHOW_NOT_FOUND]
          - errors[ERR_STREAM_CHANNEL_NOT_FOUND]
          - errors[ERR_HOST_BOOKING_NOT_FOUND]
          - errors[ERR_LINEUP_SLOT_NOT_FOUND]
          - errors[ERR_DISCLOSURE_RECORD_NOT_FOUND]
          - errors[ERR_CART_NOT_FOUND]
          - errors[ERR_CART_ITEM_NOT_FOUND]
          - errors[ERR_ORDER_NOT_FOUND]
          - errors[ERR_INTERACTION_NOT_FOUND]
        distinguishing_aspect: "Each entity family returns its OWN 404 error_id for an unknown path id — twelve distinct codes from twelve reads on an empty database, none of them a generic ERR_NOT_FOUND (the flash-offer code is covered separately by flash_offer_unknown_id_returns_not_found)."
        test_recipe:
          setup:
            - "Empty database with the clock pinned; no rows of any kind exist."
          setup_api_calls:
            - *k_clock_t0
          trigger:
            - call: "GET /hosts/00000000-0000-4000-8000-000000000101"
              payload: {}
              as: PlatformAdmin
              captures: { e_host: $.data.error_id }
            - call: "GET /products/00000000-0000-4000-8000-000000000102"
              payload: {}
              as: PlatformAdmin
              captures: { e_prod: $.data.error_id }
            - call: "GET /viewers/00000000-0000-4000-8000-000000000103"
              payload: {}
              as: PlatformAdmin
              captures: { e_view: $.data.error_id }
            - call: "GET /shows/00000000-0000-4000-8000-000000000104"
              payload: {}
              as: PlatformAdmin
              captures: { e_show: $.data.error_id }
            - call: "GET /stream-channels/00000000-0000-4000-8000-000000000105"
              payload: {}
              as: PlatformAdmin
              captures: { e_chan: $.data.error_id }
            - call: "GET /host-bookings/00000000-0000-4000-8000-000000000106"
              payload: {}
              as: PlatformAdmin
              captures: { e_book: $.data.error_id }
            - call: "GET /lineup-slots/00000000-0000-4000-8000-000000000107"
              payload: {}
              as: PlatformAdmin
              captures: { e_slot: $.data.error_id }
            - call: "GET /disclosure-records/00000000-0000-4000-8000-000000000108"
              payload: {}
              as: PlatformAdmin
              captures: { e_disc: $.data.error_id }
            - call: "GET /carts/00000000-0000-4000-8000-000000000109"
              payload: {}
              as: PlatformAdmin
              captures: { e_cart: $.data.error_id }
            - call: "GET /cart-items/00000000-0000-4000-8000-00000000010a"
              payload: {}
              as: PlatformAdmin
              captures: { e_item: $.data.error_id }
            - call: "GET /orders/00000000-0000-4000-8000-00000000010b"
              payload: {}
              as: PlatformAdmin
              captures: { e_order: $.data.error_id }
            - call: "GET /interactions/00000000-0000-4000-8000-00000000010c"
              payload: {}
              as: PlatformAdmin
              captures: { e_inter: $.data.error_id }
          assert:
            - "All twelve calls return HTTP 404 with response_type == error"
            - "${e_host} == ERR_HOST_NOT_FOUND, ${e_prod} == ERR_PRODUCT_NOT_FOUND, ${e_view} == ERR_VIEWER_NOT_FOUND, ${e_show} == ERR_SHOW_NOT_FOUND"
            - "${e_chan} == ERR_STREAM_CHANNEL_NOT_FOUND, ${e_book} == ERR_HOST_BOOKING_NOT_FOUND, ${e_slot} == ERR_LINEUP_SLOT_NOT_FOUND, ${e_disc} == ERR_DISCLOSURE_RECORD_NOT_FOUND"
            - "${e_cart} == ERR_CART_NOT_FOUND, ${e_item} == ERR_CART_ITEM_NOT_FOUND, ${e_order} == ERR_ORDER_NOT_FOUND, ${e_inter} == ERR_INTERACTION_NOT_FOUND"

      - name: repeating_a_transition_returns_that_entity_s_own_state_error
          # priority 8 (own state) is checked before priority 9 (related-entity state),
          # so each replay surfaces the entity-specific 409 rather than a show-state error
        claim_type: error_triggerable
        grounds:
          - validations[priority=8]
          - errors[ERR_INVALID_CHANNEL_STATE]
          - errors[ERR_INVALID_DISCLOSURE_STATE]
          - errors[ERR_INVALID_OFFER_STATE]
          - errors[ERR_INVALID_CART_STATE]
          - errors[ERR_INVALID_ORDER_STATE]
          - errors[ERR_INVALID_INTERACTION_STATE]
        distinguishing_aspect: "Six different entity families each answer a replayed trigger with their own 409 code, never a shared one: channel, disclosure, offer, cart, order and interaction."
        test_recipe:
          setup:
            - "Show LIVE at 18:10Z with: a LIVE channel, an ACKNOWLEDGED disclosure, an ACTIVE offer, a CHECKED_OUT cart, a CAPTURED order and an APPROVED chat."
          setup_api_calls:
            - *k_clock_t0
            - *k_host
            - *k_cert
            - *k_viewer1
            - *k_product
            - *k_substantiate
            - *k_show
            - *k_booking
            - *k_disclosure
            - *k_confirm
            - *k_ack
            - *k_slot
            - *k_offer
            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_activate
            - *k_cart1
            - call: "POST /carts/${ct1}/items"
              payload: { flash_offer_id: "${o1}", qty: 1 }
              as: Viewer
              as_user_id: "${v1}"
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
            - call: "POST /carts/${ct1}/checkout"
              payload: { expected_cart_version: "${ct1_v}" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { ordS: $.data.id }
            - call: "POST /orders/${ordS}/capture"
              payload: {}
              as: MerchandisingManager
            - call: "POST /interactions"
              payload: { show_id: "${sh1}", kind: "CHAT", body: "hello" }
              as: Viewer
              as_user_id: "${v1}"
              captures: { chS: $.data.id }
            - call: "POST /interactions/${chS}/moderate"
              payload: { action: "APPROVE" }
              as: Moderator
          trigger:
            - call: "POST /stream-channels/${ch1}/provision"
              payload: {}
              as: ShowProducer
              captures: { s_chan: $.data.error_id }
            - call: "POST /disclosure-records/${d1}/acknowledge"
              payload: { script_code_spoken: "SCRIPT-PAID-01" }
              as: Host
              as_user_id: "${h1}"
              captures: { s_disc: $.data.error_id }
            - call: "POST /flash-offers/${o1}/activate"
              payload: {}
              as: MerchandisingManager
