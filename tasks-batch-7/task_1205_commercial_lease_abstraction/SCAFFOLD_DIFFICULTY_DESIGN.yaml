            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: PortfolioManager
              captures: { lv: $.data.version }
          trigger:
            - call: "POST /lease-admin/amendments/${amend_id}/approve"
              payload: { expected_lease_version: "${lv}" }
              as: PortfolioManager
              captures: { approve_err: $.data.error_id, approve_status: $.data.status }
          assert:
            - "approve_err == ERR_LEASE_NOT_ACTIVE  # approve precondition is Lease.status == ACTIVE"
            - "approve_status == null"

  # ==========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rent_schedule_line_half_open_overlap
        grounds:
          - validations[priority=9]
          - errors[ERR_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Resource: RentScheduleLine on a Lease. Interval semantics: half-open
          [period_start, period_end) — adjacent intervals (touching at endpoint) do
          NOT conflict. Strict overlap if new.start < existing.end AND new.end > existing.start.
        test_recipe:
          setup:
            - "DRAFT Lease with existing line [2027-03-01, 2027-09-01)"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: GROSS, pro_rata_share_bps: 0, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-03-01", period_end: "2027-09-01", base_rent_cents: 600000 }
              as: PortfolioManager
          trigger:
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-09-01", period_end: "2028-01-01", base_rent_cents: 400000 }
              as: PortfolioManager
              captures: { ok_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-08-31", period_end: "2027-10-01", base_rent_cents: 100 }
              as: PortfolioManager
              captures: { err: $.data.error_id }
          assert:
            - "ok_id != null                # adjacency (end == start) is allowed"
            - "err == ERR_SCHEDULE_OVERLAP  # 1-day overlap rejected"

      - name: compliance_doc_coverage_overlap_accepted_only
        grounds:
          - validations[priority=10]
          - errors[ERR_COVERAGE_OVERLAP]
        distinguishing_aspect: |
          Resource: ComplianceDoc ACCEPTED coverage for (lease_id, kind). Interval
          semantics: overlap check applies ONLY against ACCEPTED-status docs (not
          SUBMITTED/UNDER_REVIEW/REJECTED), so a REJECTED doc with the same window
          does NOT block a new ACCEPTED doc, but a second ACCEPTED doc with even
          1-day overlap DOES. Different resource and different interval semantics
          (status-filtered) from RentScheduleLine.
        test_recipe:
          setup:
            - "ACTIVE Lease; INSURANCE_CERT doc A ACCEPTED for [2027-01-01, 2028-01-01)"
            - "INSURANCE_CERT doc B REJECTED for the same window (history)"
            - "INSURANCE_CERT doc C UNDER_REVIEW for [2027-06-01, 2028-06-01) — overlaps A"
            - "INSURANCE_CERT doc D UNDER_REVIEW for [2028-01-01, 2029-01-01) — adjacent to A"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2029-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: GROSS, pro_rata_share_bps: 0, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/compliance-docs"
              payload: { kind: INSURANCE_CERT, period_start: "2027-01-01", period_end: "2028-01-01" }
              as: PropertyManager
              captures: { doc_a: $.data.id }
            - call: "POST /lease-admin/compliance-docs/${doc_a}/start-review"
              payload: {}
              as: PropertyManager
            - call: "POST /lease-admin/compliance-docs/${doc_a}/accept"
              payload: {}
              as: PropertyManager
            - call: "POST /lease-admin/leases/${lease_id}/compliance-docs"
              payload: { kind: INSURANCE_CERT, period_start: "2027-01-01", period_end: "2028-01-01" }
              as: PropertyManager
              captures: { doc_b: $.data.id }
            - call: "POST /lease-admin/compliance-docs/${doc_b}/start-review"
              payload: {}
              as: PropertyManager
            - call: "POST /lease-admin/compliance-docs/${doc_b}/reject"
              payload: { rejection_reason: "insufficient coverage limit" }
              as: PropertyManager
            - call: "POST /lease-admin/leases/${lease_id}/compliance-docs"
              payload: { kind: INSURANCE_CERT, period_start: "2027-06-01", period_end: "2028-06-01" }
              as: PropertyManager
              captures: { doc_c: $.data.id }
            - call: "POST /lease-admin/compliance-docs/${doc_c}/start-review"
              payload: {}
              as: PropertyManager
            - call: "POST /lease-admin/leases/${lease_id}/compliance-docs"
              payload: { kind: INSURANCE_CERT, period_start: "2028-01-01", period_end: "2029-01-01" }
              as: PropertyManager
              captures: { doc_d: $.data.id }
            - call: "POST /lease-admin/compliance-docs/${doc_d}/start-review"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /lease-admin/compliance-docs/${doc_c}/accept"
              payload: {}
              as: PropertyManager
              captures: { err_c: $.data.error_id }
            - call: "POST /lease-admin/compliance-docs/${doc_d}/accept"
              payload: {}
              as: PropertyManager
              captures: { status_d: $.data.status }
          assert:
            - "err_c == ERR_COVERAGE_OVERLAP   # overlaps existing ACCEPTED doc A"
            - "status_d == ACCEPTED             # adjacency (start == A.end) allowed"
            - "Doc B (REJECTED) did not block — only ACCEPTED status participates"

  # ==========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: recovery_billing_issue_void_invariant
        grounds:
          - state_machines.RecoveryBilling.DRAFT_to_ISSUED
          - state_machines.RecoveryBilling.ISSUED_to_VOID
          - entities.Lease.fields.cached_recovery_ytd_cents
        distinguishing_aspect: |
          Conserved quantity: Lease.cached_recovery_ytd_cents. Forward action ISSUE
          adds estimate_cents; compensating action VOID subtracts the same estimate_cents.
          After ISSUE then VOID, cached_recovery_ytd_cents MUST equal its initial value.
        test_recipe:
          setup:
            - "ACTIVE Lease L1 with one DRAFT RecoveryBilling (estimate computed as 500000)"
            - "Lease.cached_recovery_ytd_cents == 0 before issue"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 12000000, gross_up_floor_pct_bps: 9500 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b1: $.data.id, b1_est: $.data.estimate_cents }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 2 }
              as: LeaseAccountant
              captures: { b2: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b2}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: LeaseAccountant
              captures: { ytd_initial: $.data.cached_recovery_ytd_cents }
          trigger:
            - call: "POST /lease-admin/recovery-billings/${b1}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: LeaseAccountant
              captures: { ytd_after_issue: $.data.cached_recovery_ytd_cents }
            - call: "POST /lease-admin/recovery-billings/${b1}/void"
              payload: {}
              as: LeaseAccountant
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: LeaseAccountant
              captures: { ytd_after_void: $.data.cached_recovery_ytd_cents }
          assert:
            - "b1_est == 400000   # 12000000 * 4000/10000 / 12"
            - "ytd_initial == 400000   # only b2 was ISSUED before activation"
            - "ytd_after_issue == 800000   # b1 + b2 both issued"
            - "ytd_after_void == ytd_initial   # INVARIANT: issue+void conserves ytd"
            - "ytd_after_void == 400000"

      - name: amendment_apply_reject_invariant_on_lease_version
        grounds:
          - state_machines.Amendment.PROPOSED_to_APPROVED
          - state_machines.Amendment.APPROVED_to_REJECTED
          - concurrency_rules[amendment-approve-stale-lease]
          - entities.Lease.fields.version
        distinguishing_aspect: |
          Conserved quantity: Lease.leased_sf (a business field, distinct from the
          ytd cents of instance 1). Forward action APPROVE holds; compensating action
          REJECT rolls the Amendment back without touching leased_sf. After
          PROPOSED->APPROVED->REJECTED, leased_sf and base_rent_annual_cents MUST
          be unchanged; only Lease.version has advanced.
        test_recipe:
          setup:
            - "ACTIVE Lease L1 with leased_sf=4000, base_rent_annual_cents=1200000"
            - "Amendment kind=EXPANSION proposed with new_leased_sf=5000"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b_id: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b_id}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: PortfolioManager
              captures: { sf_pre: $.data.leased_sf, rent_pre: $.data.base_rent_annual_cents, v_pre: $.data.version }
            - call: "POST /lease-admin/leases/${lease_id}/amendments"
              payload: { kind: EXPANSION, effective_date: "2027-06-01", new_leased_sf: 5000 }
              as: PortfolioManager
              captures: { amend_id: $.data.id }
          trigger:
            - call: "POST /lease-admin/amendments/${amend_id}/approve"
              payload: { expected_lease_version: "${v_pre}" }
              as: PortfolioManager
            - call: "POST /lease-admin/amendments/${amend_id}/reject"
              payload: {}
              as: PortfolioManager
              captures: { amend_status: $.data.status }
            - call: "GET /lease-admin/leases/${lease_id}"
              payload: {}
              as: PortfolioManager
              captures: { sf_post: $.data.leased_sf, rent_post: $.data.base_rent_annual_cents, v_post: $.data.version }
          assert:
            - "amend_status == REJECTED"
            - "sf_post == sf_pre        # INVARIANT: leased_sf conserved"
            - "sf_post == 4000"
            - "rent_post == rent_pre    # INVARIANT: rent conserved"
            - "rent_post == 1200000"
            - "v_post == v_pre + 1      # version advanced by approve; reject does not bump Lease"
