  - name: clock_checkpoint_counts_only_the_rows_it_actually_transitioned
    claim_type: scheduled_actions
    grounds:
    - complexity_profile.complexity_layers[ops_run_checkpoint]
    - endpoints[POST /_clock/set_current_utc]
    - state_machines.Guard.VERIFIED_to_EXPIRED
    - roles.SystemOperator.exclusive_operations
    distinguishing_aspect: |
      The clock endpoint is the scaffold's only scheduled-action carrier, and its declared output is a CHECKPOINT report (expired_guard_count, voided_assignment_count) rather than an entity — so the claim is about the counts, not the transitions: an advance with nothing due must report zeros, the advance that crosses an expiry must report exactly one, and a FURTHER advance must report zero again because already-EXPIRED rows are no longer VERIFIED. An implementation that recomputes 'guards whose credential is in the past' rather than 'guards this sweep transitioned' reports 1 forever.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - one VERIFIED EMPLOYEE Guard GC-7001 at credential_level 1 with credential_expires_on 2026-12-31T00:00:00Z, holding no assignments
