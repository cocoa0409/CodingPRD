scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_case_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Case, endpoints]
        distinguishing_aspect: "POST /cases with all required fields returns 201; status defaults DRAFT, stay_posture NONE, means_test_result NOT_RUN, version 1."
        test_recipe:
          setup: ["A registered debtor exists."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Create Debtor", email: "create@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "CA", household_size: 2 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
          assert:
            - "POST /cases .status == 201"
            - "Case.${case_id}.status == DRAFT"
            - "Case.${case_id}.stay_posture == NONE"
            - "Case.${case_id}.means_test_result == NOT_RUN"
            - "Case.${case_id}.version == 1"

      - name: get_case_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Case, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /cases/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No case with the queried id exists."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "NF Debtor", email: "nf@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
          trigger:
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "GET /cases/00000000-0000-0000-0000-000000000000 .status == 404"
            - "GET /cases/00000000-0000-0000-0000-000000000000 .data.error_id == ERR_NOT_FOUND"

      - name: create_case_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Case, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cases omitting required filed_chapter returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A registered debtor exists."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Missing Debtor", email: "missing@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /cases .status == 422"
            - "POST /cases .data.error_id == ERR_INVALID_REQUEST"

      - name: create_case_invalid_chapter_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Case.fields.filed_chapter, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /cases with filed_chapter='CHAPTER_11' (out of enum domain {CHAPTER_7,CHAPTER_13}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A registered debtor exists."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Enum Debtor", email: "enum@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_11", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /cases .status == 422"
            - "POST /cases .data.error_id == ERR_INVALID_REQUEST"

      - name: create_debtor_default_prior_discharge_false
        claim_type: Defaults
        grounds: [entities.Debtor.fields.prior_discharge_within_8y]
        distinguishing_aspect: "Omitting prior_discharge_within_8y on POST /debtors applies the default false."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /debtors"
              payload: { full_name: "Default Debtor", email: "default@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
          assert:
            - "POST /debtors .status == 201"
            - "Debtor.${dbtr_id}.prior_discharge_within_8y == false"

      - name: case_fk_debtor_not_found_returns_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Case.fields.debtor_id, "errors[ERR_FK_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "POST /cases with a debtor_id that does not exist returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup: ["No debtor with the supplied id exists."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Real Debtor", email: "real@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
          trigger:
            - call: "POST /cases"
              payload: { debtor_id: "11111111-1111-1111-1111-111111111111", filed_chapter: "CHAPTER_7", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /cases .status == 404"
            - "POST /cases .data.error_id == ERR_FK_NOT_FOUND"

      - name: computed_means_test_inputs_drive_result_not_client
        claim_type: Computed Fields
        grounds: [entities.MeansTest.fields.result, entities.MeansTest.fields.annualized_cmi_cents]
        excluded_because:
          difficulty_instance: dual_variant_calc / means_test_at_median_vs_above_median_variant
          rationale: "Computed annualized_cmi_cents/disposable/result correctness on POST /means-tests is already asserted as the trigger of the named §1.8 instance."

      - name: flat_fk_debt_filtered_by_case_reverse_reachability
        claim_type: Foreign key references validated
        grounds: [entities.Debt.fields.case_id, endpoints]
        distinguishing_aspect: "GET /debts?case_id=<case> returns only that case's debts as Debt[] (flat-topology reverse-reachability for Debt.case_id)."
        test_recipe:
          setup: ["A case with two scheduled debts."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "List Debtor", email: "listd@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr list" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "UNSECURED", scheduled_amount_cents: 10000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "PRIORITY", scheduled_amount_cents: 20000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
          trigger:
            - call: "GET /debts?case_id=${case_id}"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
          assert:
            - "GET /debts?case_id=${case_id} .status == 200"
            - "GET /debts?case_id=${case_id} returns total_count == 2"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: petition_from_draft_sets_filed_and_active_stay
        claim_type: Valid Transition
        grounds: [state_machines.Case.DRAFT_to_FILED, entities.Case.fields.stay_posture]
        distinguishing_aspect: "POST /cases/{id}/petition on a complete DRAFT case sets status FILED, petition_date, stay_posture ACTIVE."
        test_recipe:
          setup: ["A DRAFT Chapter 13 case with means test, Schedule I and J."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Pet Debtor", email: "pet@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
          trigger:
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
          assert:
            - "Case.${case_id}.status == FILED"
            - "Case.${case_id}.stay_posture == ACTIVE"

      - name: petition_missing_schedule_j_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds: [state_machines.Case.DRAFT_to_FILED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DRAFT case with Schedule I but no Schedule J fails the petition precondition with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A DRAFT Chapter 13 case with means test and Schedule I but NO Schedule J."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "NoJ Debtor", email: "noj@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
          trigger:
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /cases/${case_id}/petition .status == 409"
            - "POST /cases/${case_id}/petition .data.error_id == ERR_INVALID_STATE"

      - name: confirm_case_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Case.MEETING_HELD_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /cases/{id}/confirm on a DRAFT case (the confirm transition is only defined from MEETING_HELD) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A brand-new DRAFT case (never petitioned)."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Inv Debtor", email: "invst@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-inv" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/confirm"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /cases/${case_id}/confirm .status == 409"
            - "POST /cases/${case_id}/confirm .data.error_id == ERR_INVALID_STATE"

      - name: dismiss_from_discharged_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Case.MEETING_HELD_to_DISMISSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DISCHARGED (terminal) case cannot be dismissed; the dismiss transition has no DISCHARGED source, so POST /cases/{id}/dismiss returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A Chapter 7 case that has been DISCHARGED."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Term Debtor", email: "term@x.com", prior_discharge_within_8y: false }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-term" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_7", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /meetings"
              payload: { case_id: "${case_id}", trustee_id: "${tr_id}", room_code: "R-term", scheduled_start: "2026-09-01T09:00:00Z", scheduled_end: "2026-09-01T10:00:00Z" }
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { mtg_id: $.data.id }
            - call: "POST /meetings/${mtg_id}/hold"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
            - call: "POST /cases/${case_id}/discharge"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "POST /cases/${case_id}/dismiss"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /cases/${case_id}/dismiss .status == 409"
            - "POST /cases/${case_id}/dismiss .data.error_id == ERR_INVALID_STATE"

      - name: meeting_hold_bubbles_case_to_meeting_held
        claim_type: Bubble up
        grounds: [state_machines.Meeting341.SCHEDULED_to_HELD, state_machines.Case.FILED_to_MEETING_HELD]
        excluded_because:
          difficulty_instance: transitive_cascade / claim_allow_cascade_to_debt_ledger_then_distribution_depth3
          rationale: "Meeting hold bubbling FILED->MEETING_HELD is exercised in the setup chains of multiple §1.8 instances; the bubble-up itself is asserted via Case.status reaching MEETING_HELD there. Explicitly covered by case_branch_chapter7_vs_chapter13_after_meeting which reaches MEETING_HELD then discharges."

      - name: claim_allow_idempotency_second_allow_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.ClaimRecord.FILED_to_ALLOWED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Allowing an already-ALLOWED claim a second time returns ERR_INVALID_STATE (409); allowed_amount unchanged."
        test_recipe:
          setup: ["A case at MEETING_HELD with a claim that has already been ALLOWED."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Idem Debtor", email: "idem@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-idem" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr idem" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "UNSECURED", scheduled_amount_cents: 50000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /claims"
              payload: { case_id: "${case_id}", debt_id: "${debt_id}", filed_by_creditor_id: "${cr_id}", claimed_amount_cents: 50000 }
              as: Creditor
              as_user_id: "${cr_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /meetings"
              payload: { case_id: "${case_id}", trustee_id: "${tr_id}", room_code: "R-idem", scheduled_start: "2026-09-02T09:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { mtg_id: $.data.id }
            - call: "POST /meetings/${mtg_id}/hold"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
            - call: "POST /claims/${claim_id}/allow"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          trigger:
            - call: "POST /claims/${claim_id}/allow"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /claims/${claim_id}/allow .status == 409"
            - "POST /claims/${claim_id}/allow .data.error_id == ERR_INVALID_STATE"
            - "ClaimRecord.${claim_id}.allowed_amount_cents == 50000"

      - name: stay_relief_grant_sets_lifted_partial_compound_posture
        claim_type: Cross-entity
        grounds: [state_machines.StayReliefMotion.PENDING_to_GRANTED, entities.Case.fields.stay_posture]
        distinguishing_aspect: "Granting a PENDING motion on a SECURED debt sets motion GRANTED and Case.stay_posture LIFTED_PARTIAL."
        test_recipe:
          setup: ["A FILED case with stay ACTIVE and a PENDING relief motion on a SECURED debt."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Grant Debtor", email: "grant@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-grant" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr grant" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "SECURED", scheduled_amount_cents: 300000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { s_debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /stay-relief-motions"
              payload: { case_id: "${case_id}", movant_creditor_id: "${cr_id}", target_debt_id: "${s_debt_id}" }
              as: Creditor
              as_user_id: "${cr_id}"
              captures: { motion_id: $.data.id }
          trigger:
            - call: "POST /stay-relief-motions/${motion_id}/grant"
              payload: {}
              as: Trustee
              as_user_id: "${tr_id}"
          assert:
            - "StayReliefMotion.${motion_id}.status == GRANTED"
            - "Case.${case_id}.stay_posture == LIFTED_PARTIAL"

      - name: chapter13_plan_completed_on_discharge_compensation
        claim_type: Compensation
        grounds: [state_machines.Case.CONFIRMED_to_DISCHARGED, state_machines.Plan.CONFIRMED_to_COMPLETED]
        distinguishing_aspect: "Chapter 13 discharge after full payment sets the active Plan COMPLETED and unsecured debts allowed_amount to 0."
        test_recipe:
          setup: ["A CONFIRMED Chapter 13 case whose active plan has paid_to_date == total_committed; one UNSECURED debt of 60000."]
          setup_api_calls:
            - call: "POST /debtors"
              payload: { full_name: "Comp Debtor", email: "comp@x.com" }
              as: Debtor
              captures: { dbtr_id: $.data.id }
            - call: "POST /trustees"
              payload: { name: "T-comp" }
              as: Trustee
              captures: { tr_id: $.data.id }
            - call: "POST /creditors"
              payload: { name: "Cr comp" }
              as: Creditor
              captures: { cr_id: $.data.id }
            - call: "POST /cases"
              payload: { debtor_id: "${dbtr_id}", filed_chapter: "CHAPTER_13", state_code: "CA", household_size: 1 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { case_id: $.data.id }
            - call: "POST /means-tests"
              payload: { case_id: "${case_id}", cmi_monthly_cents: 400000, monthly_expenses_cents: 300000, median_annual_income_cents: 6000000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "I", description: "wages" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "UNSECURED", scheduled_amount_cents: 60000 }
              as: Debtor
