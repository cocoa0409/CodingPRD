  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_requires_foa_open
        grounds:
          - state_machines.FundingOpportunity.OPEN_to_CLOSED
          - state_machines.Application.DRAFT_to_SUBMITTED
          - errors[ERR_FOA_NOT_FOUND]
        distinguishing_aspect: |
          Entity pair Application -> FundingOpportunity: the submit transition is gated on the
          parent-side FOA still being OPEN; once the FOA is CLOSED the same submission is rejected
          with ERR_FOA_NOT_OPEN and the application remains DRAFT.
        test_recipe:
          setup:
            - "FOA created (OPEN) then closed; one draft application against it"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/funding-opportunities", payload: { pa_number: "PA-26-114", title: "R01 Closed FOA", activity_code: "R01", research_strategy_page_limit: 12, min_direct_cents_per_year: 1000000, max_direct_cents_per_year: 25000000, max_years: 5, open_date: "2026-08-01T00:00:00Z", receipt_deadline: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, captures: { foa_id: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI A", email: "pia@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi_a: $.data.id } }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "Closed FOA app", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi_a}", captures: { app_a: $.data.id } }
            - { call: "POST /grants/funding-opportunities/${foa_id}/close", payload: {}, as: ProgramOfficer }
          trigger:
            - { call: "POST /grants/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: "${pi_a}", captures: { err: $.data.error_id } }
            - { call: "GET /grants/applications/${app_a}", payload: {}, as: ProgramOfficer, captures: { app_st: $.data.status } }
          assert:
            - "submit fails with error_id == ERR_FOA_NOT_OPEN (http 409)"
            - "Application.${app_a}.status == DRAFT"

      - name: assignment_requires_section_recruiting
        grounds:
          - state_machines.StudySection.RECRUITING_to_MEETING_HELD
          - validations[priority=6]
          - errors[ERR_SECTION_NOT_RECRUITING]
        distinguishing_aspect: |
          Entity pair Assignment -> StudySection: assignment creation is gated on the application's
          study section still RECRUITING; after convene flips the section to MEETING_HELD the same
          assignment create is rejected with ERR_SECTION_NOT_RECRUITING.
        test_recipe:
          setup:
            - "Application REFERRED then UNDER_REVIEW (one live assignment); section convened (MEETING_HELD); a second ACTIVE reviewer available"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/institutions", payload: { name: "Other College" }, as: ProgramOfficer, captures: { inst2_id: $.data.id } }
            - { call: "POST /grants/institutes", payload: { name: "National Test Institute", appropriation_cents: 100000000, reserve_cents: 0, indirect_cost_rate: 0.5, select_pay_cap_pct: 0.10, select_pay_extension_percentile: 5.0 }, as: ProgramOfficer, captures: { insti_id: $.data.id } }
            - { call: "POST /grants/funding-opportunities", payload: { pa_number: "PA-26-115", title: "R01 Section Gate FOA", activity_code: "R01", research_strategy_page_limit: 12, min_direct_cents_per_year: 1000000, max_direct_cents_per_year: 25000000, max_years: 5, open_date: "2026-08-01T00:00:00Z", receipt_deadline: "2026-12-01T00:00:00Z" }, as: ProgramOfficer, captures: { foa_id: $.data.id } }
            - { call: "POST /grants/study-sections", payload: { name: "Section SG", meeting_date: "2027-03-01T00:00:00Z", application_quota: 10 }, as: ScientificReviewOfficer, captures: { sec_id: $.data.id } }
            - { call: "POST /grants/applicants", payload: { full_name: "PI A", email: "pia@x.edu", career_stage: "ESTABLISHED_INVESTIGATOR" }, as: ProgramOfficer, captures: { pi_a: $.data.id } }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "Section gate app", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi_a}", captures: { app_a: $.data.id } }
            - { call: "POST /grants/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: "${pi_a}", captures: { app_a_v: $.data.version } }
            - { call: "POST /grants/applications/${app_a}/referral", payload: { study_section_id: "${sec_id}", institute_id: "${insti_id}", expected_application_version: "${app_a_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 1", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r1: $.data.id } }
            - { call: "POST /grants/reviewers/${r1}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r1}" }
            - { call: "POST /grants/reviewers", payload: { full_name: "Rev 2", institution_id: "${inst2_id}", expertise_keywords: ["neuro"] }, as: ScientificReviewOfficer, captures: { r2: $.data.id } }
            - { call: "POST /grants/reviewers/${r2}/respond", payload: { decision: "ACCEPT" }, as: Reviewer, as_user_id: "${r2}" }
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r1}", role: "PRIMARY" }, as: ScientificReviewOfficer, captures: { a_1: $.data.id } }
            - { call: "POST /grants/study-sections/${sec_id}/convene", payload: {}, as: ScientificReviewOfficer }
          trigger:
            - { call: "POST /grants/assignments", payload: { application_id: "${app_a}", reviewer_id: "${r2}", role: "SECONDARY" }, as: ScientificReviewOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /grants/assignments", payload: { application_id: "${app_a}" }, as: ScientificReviewOfficer, captures: { n: "$.data[0].id" } }
          assert:
            - "assignment create fails with error_id == ERR_SECTION_NOT_RECRUITING (http 409)"
            - "the application still has exactly one assignment (no partial creation)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: reviewer_meeting_proximity_inclusive_buffer
        grounds:
          - calculations.meeting_proximity_check
        distinguishing_aspect: |
          Interval semantics: closed buffer windows [meeting - 7d, meeting + 7d] on the Reviewer
          resource — a live assignment at section A (meeting 2027-03-01) conflicts with a section B
          meeting exactly 7 days later (2027-03-08, inclusive boundary rejected), while a section C
          meeting 8 days later (2027-03-09) is accepted.
        test_recipe:
          setup:
            - "Three RECRUITING sections A (2027-03-01), B (2027-03-08), C (2027-03-09); one referred application per section; reviewer R ACTIVE with a live ASSIGNED assignment to the section-A application"
          setup_api_calls:
            - { call: "POST /grants/institutions", payload: { name: "State University" }, as: ProgramOfficer, captures: { inst_id: $.data.id } }
            - { call: "POST /grants/institutions", payload: { name: "Other College" }, as: ProgramOfficer, captures: { inst2_id: $.data.id } }
