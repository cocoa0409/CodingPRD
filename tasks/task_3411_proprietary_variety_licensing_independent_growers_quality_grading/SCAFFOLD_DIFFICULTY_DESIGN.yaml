            - "HarvestLot.${h2_id}.lot_gross_final_cents == 374678 (raw 374677.52 rounded per-lot)"
            - "HarvestLot.${h3_id}.lot_gross_final_cents == 936693 — raw 936693.80 rounds to 936694, then absorbs the -1 remainder as the largest-weighted lot (2000 wkg > 1322.5 > 800)"
            - "sum of per-lot rounded grosses before remainder == 1930761 != pool_distributable_cents == 1930760"
            - "after remainder allocation: 619389 + 374678 + 936693 == 1930760 == pool_distributable_cents exactly"
