        excluded_because:
          difficulty_instance: resource_temporal_overlap / deployment_window_cooldown_buffer_rejects_overlap_but_admits_adjacency
          rationale: "The named §1.8 instance triggers ERR_DEPLOYMENT_WINDOW_CONFLICT at 04:15 and admits the adjacent 04:30 window."

