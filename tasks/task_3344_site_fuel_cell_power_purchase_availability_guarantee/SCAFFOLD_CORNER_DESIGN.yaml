# ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: create_delivery_with_a_stale_site_version_returns_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[delivery-create-stale-site]
          - validations[priority=28]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST_/power/sites/{id}/fuel-deliveries
        distinguishing_aspect: "A delivery create carrying the site version observed before an intervening create is rejected with ERR_STALE_VERSION (412), while the same create carrying the freshly read version succeeds — two strictly sequential requests, no parallelism."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site observed at version 1."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Boonville Feed Store", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id, stale_v: $.data.version }
            - call: "POST /power/sites/${site_id}/fuel-deliveries"
              payload: { sourcing_mode: "FIXED_PRICE_BLEND", volume_therms: 2000, fixed_price_cents_per_therm: 4.40, hedged_fraction: 1.0, delivered_at: "2026-03-12T00:00:00Z", confirm_after_iso8601: "2026-03-13T00:00:00Z", expected_site_version: "${stale_v}" }
              as: FuelCoordinator
              captures: { site_v: $.data.version }
          trigger:
            - call: "POST /power/sites/${site_id}/fuel-deliveries"
              payload: { sourcing_mode: "FIXED_PRICE_BLEND", volume_therms: 3000, fixed_price_cents_per_therm: 4.40, hedged_fraction: 1.0, delivered_at: "2026-03-14T00:00:00Z", confirm_after_iso8601: "2026-03-15T00:00:00Z", expected_site_version: "${stale_v}" }
              as: FuelCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and data.error_id == ERR_STALE_VERSION"
            - "GET /power/sites/${site_id}/fuel-deliveries returns exactly one row"
            - "re-sending the same create with expected_site_version ${site_v} returns 201"

