        grounds:
          - state_machines.CommissionClaim.DENIED_to_SUBMITTED
          - errors[ERR_CLAIM_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_deny_resubmit_cycle_blocked_at_third_round
          rationale: "That §1.8 instance walks SUBMITTED -> DENIED -> SUBMITTED twice and asserts the third resubmission fails with ERR_CLAIM_ROUND_LIMIT, which is exactly this cyclic-shape corner."

      - name: corner_cancellation_cascades_down_to_supplier_and_advisors
