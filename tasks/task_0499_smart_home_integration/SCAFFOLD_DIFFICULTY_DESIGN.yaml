              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /projects/${proj_id}/start-provisioning"
              payload: {}
              as: ProjectManager
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "C4-NET", category: "ACCESSORY", rack_units: 2 }
              as: LowVoltageTech
              captures: { dev1: $.data.id }
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "C4-NET", category: "ACCESSORY", rack_units: 2 }
              as: LowVoltageTech
              captures: { dev2: $.data.id }
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "C4-NET", category: "ACCESSORY", rack_units: 2 }
