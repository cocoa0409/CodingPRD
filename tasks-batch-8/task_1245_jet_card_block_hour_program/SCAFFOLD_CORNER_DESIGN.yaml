              as: Ops
              captures: { c_sm3: $.data.id, c_sm3_status: $.data.card_status }
          assert:
            - "c_sm3_status == PENDING_PAYMENT"

      - name: side_effect_trip_dispatch_creates_legs
        claim_type: side_effect_execution
        grounds: [state_machines.TripRequest.CONFIRMED_to_DISPATCHED]
        distinguishing_aspect: "POST /trips/{id}/dispatch on ROUND_TRIP creates exactly 2 TripLeg records in PLANNED status."
        test_recipe:
          setup: ["Round-trip CONFIRMED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "SM4"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 18
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog_sm4: $.data.id }
            - call: "POST /members"
              payload:
                email: "sm4@x.com"
                full_name: "SM Four"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m_sm4: $.data.id }
            - call: "POST /members/${m_sm4}/cards"
              payload: { program_id: "${prog_sm4}" }
              as: Ops
              captures: { c_sm4: $.data.id }
            - call: "POST /cards/${c_sm4}/activate"
              payload: {}
              as: Ops
            - call: "POST /aircraft"
              payload:
                tail_number: "N222LT"
                category: "LIGHT"
                home_base_icao: "KTEB"
                seats: 6
                reposition_rate_cents_per_nm: 80
              as: Ops
              captures: { ac_sm4: $.data.id }
            - call: "POST /cards/${c_sm4}/trips"
              payload:
                trip_kind: "ROUND_TRIP"
                departure_icao: "KTEB"
                arrival_icao: "KPBI"
                requested_departure_utc: "2026-01-15T15:00:00Z"
                requested_return_utc: "2026-01-17T15:00:00Z"
                pax_count: 4
                requested_category: "LIGHT"
              as: Member
              as_user_id: "${m_sm4}"
              captures: { t_sm4: $.data.id }
            - call: "POST /trips/${t_sm4}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_sm4}"
          trigger:
            - call: "POST /trips/${t_sm4}/dispatch"
              payload: { dispatched_aircraft_id: "${ac_sm4}" }
              as: Ops
            - call: "GET /trips/${t_sm4}/legs"
              payload: {}
              as: Ops
              captures: { leg1_id: "$.data[0].id", leg2_id: "$.data[1].id" }
          assert:
            - "Two TripLeg records exist (leg1_id and leg2_id captured)"
            - "All TripLeg.leg_status == PLANNED"
            - "Aircraft.${ac_sm4}.aircraft_status == IN_SERVICE"

  # ---------------------------------------------------------------------------
  # Section: calculations
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: billable_hours_taxi_addition_correct
        claim_type: correct_result
        grounds: [calculations.billable_hours_per_leg]
        distinguishing_aspect: "Taxi minutes added to actual block time; e.g. block=108 + taxi=12 = 120 min = 2.00 hours."
        test_recipe:
          setup: ["Trip with block_minutes=108"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "CALC1"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 18
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
