  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invite_wave_not_fielding_and_pool_insufficient_returns_409_state_error
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_WAVE_NOT_FIELDING]
          - errors[ERR_INCENTIVE_POOL_INSUFFICIENT]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): one dispatch violates both — wave is
          ARMED not FIELDING (state, priority 6) and pool available 0 < base 1000
          (fiscal, priority 10); the state error ERR_WAVE_NOT_FIELDING must win.
        test_recipe:
          setup:
            - "Cell target 5; P1 ACTIVE; locked instrument; wave ARMED (never fielded) with pool total 0 and base 1000"
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 5 }, as: PanelManager, captures: { c1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists", payload: { external_ref: "p1@x", full_name: "P One", age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", preferred_locale: "en" }, as: PanelManager, captures: { p1_id: $.data.id } }
            - { call: "POST /feedback-panel/panelists/${p1_id}/enroll", payload: {}, as: PanelManager }
            - { call: "POST /feedback-panel/instruments", payload: { title: "S", question_count: 5, required_locales: ["en"], base_locale: "en" }, as: SurveyDesigner, captures: { instr_id: $.data.id } }
            - { call: "POST /feedback-panel/instruments/${instr_id}/submit-review", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/translations", payload: { instrument_id: "${instr_id}", locale: "en", translator_ref: "tr-1" }, as: SurveyDesigner, captures: { tr_en: $.data.id } }
            - { call: "POST /feedback-panel/translations/${tr_en}/certify", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/approve", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/instruments/${instr_id}/lock", payload: {}, as: SurveyDesigner }
            - { call: "POST /feedback-panel/survey-waves", payload: { wave_code: "W1", instrument_id: "${instr_id}", opens_at: "2026-08-02T00:00:00Z", closes_at: "2026-08-10T00:00:00Z", min_response_rate: 0.5, incentive_pool_total_cents: 0, base_incentive_cents: 1000 }, as: PanelManager, captures: { wave_id: $.data.id } }
            - { call: "POST /feedback-panel/survey-waves/${wave_id}/arm", payload: {}, as: PanelManager }
          trigger:
            - { call: "POST /feedback-panel/invitations", payload: { wave_id: "${wave_id}", panelist_id: "${p1_id}" }, as: PanelManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_WAVE_NOT_FIELDING"
            - "GET /feedback-panel/invitations?wave_id=${wave_id} returns total_count == 0 (no invitation persisted)"

      - name: invite_privacy_hold_and_duplicate_returns_403_safety_error
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_PRIVACY_HOLD_ACTIVE]
          - errors[ERR_DUPLICATE_INVITATION]
        distinguishing_aspect: |
          Category pair (business_safety, business_constraint/referential): a second
          dispatch to a panelist who already holds a SENT invitation AND has an ACTIVE
          NO_CONTACT hold violates both rules; the safety error ERR_PRIVACY_HOLD_ACTIVE
          (priority 7) must beat ERR_DUPLICATE_INVITATION (priority 9).
        test_recipe:
          setup:
            - "Cell target 10; P1 ACTIVE; locked instrument; wave FIELDING, clock 2026-08-03"
            - "inv1 SENT for P1 on this wave; ACTIVE NO_CONTACT PrivacyHold on P1 (scope NO_CONTACT suspends nothing and suppresses nothing, so the duplicate SENT invitation is still live)"
          setup_api_calls:
            - { call: "POST /feedback-panel/panel-cells", payload: { age_band: "AGE_18_29", district: "D1", tenure_bucket: "RENTER", target_size: 10 }, as: PanelManager, captures: { c1_id: $.data.id } }
