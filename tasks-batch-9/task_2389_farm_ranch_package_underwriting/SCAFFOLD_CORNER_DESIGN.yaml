# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_2389_farm_ranch_package_underwriting
#
# Breadth probe. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; nothing outside that taxonomy is used.
# Instance names are unique across this file AND SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Bootstrap chains are shared through YAML anchors defined on first use.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_agent_creation_returns_envelope_and_all_fields
        claim_type: creation
        grounds: ["entities.Agent", "endpoints.POST_/agents", "response_envelope"]
        distinguishing_aspect: "POST /agents with every input field returns 201 and echoes agency_name, license_state, appointment_status and authority_limit_cents inside the standard success envelope."
        test_recipe:
          setup:
            - "empty database, logical clock parked at 2026-08-15T00:00:00Z"
          setup_api_calls:
            - &k_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agents"
              payload: { agency_name: "Prairie Risk Partners", license_state: "KS", appointment_status: "ACTIVE", authority_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { new_ag: $.data.id }
          assert:
            - "HTTP 201 with response_type == 'object'"
            - "data.agency_name == 'Prairie Risk Partners', data.license_state == 'KS', data.appointment_status == 'ACTIVE', data.authority_limit_cents == 5000000"
            - "meta.api_request_id and meta.api_request_timestamp are present on the response"
            - "Agent.${new_ag}.version == 1"

      - name: corner_farm_policy_retrieval_returns_stored_row
        claim_type: retrieval
        grounds: ["entities.FarmPolicy", "endpoints.GET_/farm-policies/{id}"]
        distinguishing_aspect: "GET /farm-policies/{id} returns exactly what POST /farm-policies persisted, including the DRAFT / NOT_INSPECTED status pair and the all-zero premium block."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent, one FarmAccount in zone ZN-1, one DRAFT FarmPolicy"
          setup_api_calls:
            - *k_clock
            - &k_agent
              call: "POST /agents"
              payload: { agency_name: "Prairie Risk Partners", license_state: "KS", appointment_status: "ACTIVE", authority_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - &k_acct
              call: "POST /farm-accounts"
              payload: { legal_name: "Kestrel Creek Farms", state_code: "KS", county_name: "Reno", cat_zone_code: "ZN-1", acreage: 1200, operation_type: "MIXED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct_id: $.data.id }
            - &k_policy
              call: "POST /farm-policies"
              payload: { account_id: "${acct_id}", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { got_status: $.data.uw_status }
          assert:
            - "data.id == ${pol_id} and data.account_id == ${acct_id}"
            - "data.term_start_date == '2026-09-01', data.term_end_date == '2027-08-31', data.deductible_cents == 500000"
            - "data.uw_status == 'DRAFT' and data.compliance_status == 'NOT_INSPECTED'"
            - "property_premium_cents, livestock_premium_cents, liability_premium_cents, endorsement_premium_cents, base_premium_cents, cat_load_cents, total_premium_cents and exposed_tiv_cents are all 0"
            - "rating_valuation_date, quote_expires_at, bound_at and closure_reason are all null"

      - name: corner_cat_pool_listing_paginates_and_filters_by_zone
        claim_type: listing
        grounds: ["endpoints.GET_/cat-capacity-pools", "response_envelope.pagination_fields"]
        distinguishing_aspect: "GET /cat-capacity-pools?zone_code=ZN-1&limit=2&offset=0 returns 2 of the 3 ZN-1 pools with total_count 3 and has_more true, and the ZN-9 pool is excluded by the filter."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z; three OPEN pools in zone ZN-1 (HAIL / WIND / WILDFIRE, 200000000 each) and one OPEN HAIL pool in zone ZN-9"
          setup_api_calls:
            - *k_clock
            - &k_pool_hail
              call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-1", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { pool_hail: $.data.id }
            - &k_pool_wind
              call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-1", peril: "WIND", participation_pct: 0.30, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { pool_wind: $.data.id }
            - &k_pool_fire
              call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-1", peril: "WILDFIRE", participation_pct: 0.20, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { pool_fire: $.data.id }
            - call: "POST /cat-capacity-pools"
              payload: { zone_code: "ZN-9", peril: "HAIL", participation_pct: 0.50, total_capacity_cents: 200000000, status: "OPEN" }
              as: PlatformAdmin
              captures: { pool_other: $.data.id }
          trigger:
            - call: "GET /cat-capacity-pools"
              payload: { zone_code: "ZN-1", limit: 2, offset: 0 }
              as: Underwriter
              captures: { first_pool: "$.data[0].id" }
            - call: "GET /cat-capacity-pools"
              payload: { zone_code: "ZN-1", limit: 2, offset: 2 }
              as: Underwriter
              captures: { third_pool: "$.data[0].id" }
          assert:
            - "the first page returns 2 rows with total_count == 3, limit == 2, offset == 0 and has_more == true"
            - "the second page returns 1 row with total_count == 3, offset == 2 and has_more == false"
            - "${pool_other} appears on neither page — the zone_code filter excludes it"
            - "response_type == 'array' on both calls"
            - "every returned row has zone_code == 'ZN-1' and available_cents == 200000000"

      - name: corner_reference_data_not_found_on_agent_inspector_pool_routes
        claim_type: not_found
        grounds: ["errors.ERR_AGENT_NOT_FOUND", "errors.ERR_INSPECTOR_NOT_FOUND", "errors.ERR_CAT_POOL_NOT_FOUND", "validations[priority=4]"]
        distinguishing_aspect: "Each reference-data GET resolves its own 404 error_id: /agents/{id} -> ERR_AGENT_NOT_FOUND, /inspectors/{id} -> ERR_INSPECTOR_NOT_FOUND, /cat-capacity-pools/{id} -> ERR_CAT_POOL_NOT_FOUND."
        test_recipe:
          setup:
            - "empty database apart from the logical clock"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /agents/00000000-0000-4000-8000-000000000001"
              as: PlatformAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /inspectors/00000000-0000-4000-8000-000000000002"
              as: PlatformAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /cat-capacity-pools/00000000-0000-4000-8000-000000000003"
              as: PlatformAdmin
              captures: { e3: $.data.error_id }
          assert:
            - "call 1 returns HTTP 404 with error_id == ERR_AGENT_NOT_FOUND"
            - "call 2 returns HTTP 404 with error_id == ERR_INSPECTOR_NOT_FOUND"
            - "call 3 returns HTTP 404 with error_id == ERR_CAT_POOL_NOT_FOUND"
            - "every response uses response_type == 'error' with a non-empty data.message"

      - name: corner_policy_child_not_found_on_item_labor_endorsement_routes
        claim_type: not_found
        grounds: ["errors.ERR_SCHEDULED_ITEM_NOT_FOUND", "errors.ERR_LABOR_PROFILE_NOT_FOUND", "errors.ERR_ENDORSEMENT_NOT_FOUND", "errors.ERR_FARM_ACCOUNT_NOT_FOUND"]
        distinguishing_aspect: "The policy-child routes each resolve their own 404: /scheduled-items/{id}, /labor-profiles/{id}, /endorsements/{id} and /farm-accounts/{id} never collapse into a single generic not-found code."
        test_recipe:
          setup:
            - "empty database apart from the logical clock"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /scheduled-items/00000000-0000-4000-8000-000000000011"
              as: Underwriter
              captures: { e1: $.data.error_id }
            - call: "GET /labor-profiles/00000000-0000-4000-8000-000000000012"
              as: Underwriter
              captures: { e2: $.data.error_id }
            - call: "GET /endorsements/00000000-0000-4000-8000-000000000013"
              as: Underwriter
              captures: { e3: $.data.error_id }
            - call: "GET /farm-accounts/00000000-0000-4000-8000-000000000014"
              as: Underwriter
              captures: { e4: $.data.error_id }
          assert:
            - "the four calls return ERR_SCHEDULED_ITEM_NOT_FOUND, ERR_LABOR_PROFILE_NOT_FOUND, ERR_ENDORSEMENT_NOT_FOUND and ERR_FARM_ACCOUNT_NOT_FOUND respectively"
            - "all four responses carry HTTP 404"

      - name: corner_inspection_chain_not_found_on_inspection_rec_reservation_routes
        claim_type: not_found
        grounds: ["errors.ERR_INSPECTION_NOT_FOUND", "errors.ERR_RECOMMENDATION_NOT_FOUND", "errors.ERR_CAT_RESERVATION_NOT_FOUND", "errors.ERR_FARM_POLICY_NOT_FOUND"]
        distinguishing_aspect: "The inspection / recommendation / reservation / policy GETs each resolve their own 404 error_id for an unknown id."
        test_recipe:
          setup:
            - "empty database apart from the logical clock"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /inspections/00000000-0000-4000-8000-000000000021"
              as: ComplianceOfficer
              captures: { e1: $.data.error_id }
            - call: "GET /recommendations/00000000-0000-4000-8000-000000000022"
              as: ComplianceOfficer
              captures: { e2: $.data.error_id }
            - call: "GET /cat-reservations/00000000-0000-4000-8000-000000000023"
              as: ComplianceOfficer
              captures: { e3: $.data.error_id }
            - call: "GET /farm-policies/00000000-0000-4000-8000-000000000024"
              as: ComplianceOfficer
              captures: { e4: $.data.error_id }
          assert:
            - "the four calls return ERR_INSPECTION_NOT_FOUND, ERR_RECOMMENDATION_NOT_FOUND, ERR_CAT_RESERVATION_NOT_FOUND and ERR_FARM_POLICY_NOT_FOUND respectively"
            - "all four responses carry HTTP 404 and leave the database untouched"

      - name: corner_farm_policy_creation_missing_deductible_rejected
        claim_type: required_fields
        grounds: ["entities.FarmPolicy.fields.deductible_cents", "validations[priority=3]", "errors.ERR_INVALID_REQUEST"]
        distinguishing_aspect: "deductible_cents has source input and no default, so omitting it is ERR_INVALID_REQUEST (400) and no FarmPolicy row is created."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent, one FarmAccount"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
          trigger:
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_id}", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { err_missing: $.data.error_id }
          assert:
            - "HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /farm-policies filtered on account_id == ${acct_id} returns 0 rows"
            - "the missing-required-field check is reported before any type or enum check per the priority-3 order note"

      - name: corner_agent_and_inspector_defaults_applied_on_omission
        claim_type: defaults
        grounds: ["entities.Agent.fields.appointment_status", "entities.Agent.fields.authority_limit_cents", "entities.Inspector.fields.status", "entities.Inspector.fields.daily_capacity_minutes"]
        distinguishing_aspect: "Omitting the optional fields yields appointment_status ACTIVE with authority_limit_cents 5000000 on Agent and status ACTIVE with daily_capacity_minutes 480 on Inspector — the declared §1.1 defaults, not nulls."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, empty reference data"
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /agents"
              payload: { agency_name: "Default Producer LLC", license_state: "NE" }
              as: PlatformAdmin
              captures: { ag_def: $.data.id, ag_status: $.data.appointment_status, ag_limit: $.data.authority_limit_cents }
            - call: "POST /inspectors"
              payload: { full_name: "Sam Ortiz", region_code: "NE-WEST" }
              as: PlatformAdmin
              captures: { insp_def: $.data.id, insp_status: $.data.status, insp_cap: $.data.daily_capacity_minutes }
          assert:
            - "Agent.${ag_def}.appointment_status == 'ACTIVE' and authority_limit_cents == 5000000"
            - "Inspector.${insp_def}.status == 'ACTIVE' and daily_capacity_minutes == 480"
            - "both rows report version == 1"

      - name: corner_scheduled_item_computed_insured_value_on_acv_row
        claim_type: computed_fields
        grounds: ["entities.ScheduledItem.fields.insured_value_cents", "entities.ScheduledItem.fields.valued_at", "calculations.scheduled_item_insured_value"]
        distinguishing_aspect: "insured_value_cents is source computed: an ACV FARM_STRUCTURE stated at 12000000 with age 18 and grade C is stored at 5280000 (12000000 * 0.55 * 0.80) and valued_at is stamped with the clock instant; the client never supplies either field."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent, one FarmAccount, one DRAFT policy"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
          trigger:
            - call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "FARM_STRUCTURE", description: "Machine shed", valuation_basis: "ACV", stated_value_cents: 12000000, age_years: 18, condition_grade: "C" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_fs: $.data.id, iv: $.data.insured_value_cents }
          assert:
            - "ScheduledItem.${it_fs}.insured_value_cents == 5280000"
            - "ScheduledItem.${it_fs}.valued_at == 2026-08-15T00:00:00Z"
            - "ScheduledItem.${it_fs}.status == 'ACTIVE' (the §1.1 default) and stated_value_cents is still 12000000"
            - "dep_pct is min(0.60, 0.025 * 18) == 0.45 and the 2400000 salvage floor does not bind"

      - name: corner_system_fields_generated_on_farm_account_create
        claim_type: system_fields
        grounds: ["entities.FarmAccount.fields.agent_id", "entities.FarmAccount", "response_envelope"]
        distinguishing_aspect: "id, created_at, updated_at and version are generated server-side on POST /farm-accounts, and agent_id is taken from the caller's X-User-ID rather than from the body."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent"
          setup_api_calls:
            - *k_clock
            - *k_agent
          trigger:
            - call: "POST /farm-accounts"
              payload: { legal_name: "Willow Bend Dairy", state_code: "KS", county_name: "Sedgwick", cat_zone_code: "ZN-1", acreage: 640, operation_type: "DAIRY" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { acct_new: $.data.id, acct_agent: $.data.agent_id, acct_v: $.data.version }
          assert:
            - "data.id is a server-generated identifier that was not supplied in the body"
            - "data.agent_id == ${ag_id} — derived from X-User-ID, never from the request body"
            - "data.created_at == data.updated_at == 2026-08-15T00:00:00Z and data.version == 1"
            - "data.acreage == 640 and data.cat_zone_code == 'ZN-1'"

      - name: corner_livestock_group_invalid_species_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.LivestockGroup.fields.species", "validations[priority=3]", "errors.ERR_INVALID_REQUEST"]
        distinguishing_aspect: "species is constrained to {CATTLE, SWINE, POULTRY, SHEEP, EQUINE}; 'ALPACA' is rejected with ERR_INVALID_REQUEST (400) and head_count 0 violates the >= 1 range on the same priority."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent, one FarmAccount, one DRAFT policy"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
          trigger:
            - call: "POST /farm-policies/${pol_id}/livestock-groups"
              payload: { species: "ALPACA", head_count: 40, per_head_value_cents: 150000, limit_basis: "PER_HEAD", peril_scope: "FULL_PERIL" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/livestock-groups"
              payload: { species: "CATTLE", head_count: 0, per_head_value_cents: 150000, limit_basis: "PER_HEAD", peril_scope: "FULL_PERIL" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { err_range: $.data.error_id }
          assert:
            - "both calls return HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /farm-policies/${pol_id}/livestock-groups returns 0 rows"
            - "FarmPolicy.${pol_id}.uw_status is still DRAFT and version is unchanged — a rejected exposure write triggers no RATED->DRAFT cascade"

      - name: corner_invalid_term_dates_rejected_on_short_and_reversed_terms
        claim_type: type_constraints
        grounds: ["validations[priority=3]", "errors.ERR_INVALID_TERM_DATES"]
        distinguishing_aspect: "A reversed term (end before start) and a 60-day term both fail the dedicated ERR_INVALID_TERM_DATES check (400), which is evaluated after the field-level schema checks of the same priority."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent, one FarmAccount"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
          trigger:
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_id}", term_start_date: "2027-08-31", term_end_date: "2026-09-01", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { err_rev: $.data.error_id }
            - call: "POST /farm-policies"
              payload: { account_id: "${acct_id}", term_start_date: "2026-09-01", term_end_date: "2026-10-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { err_short: $.data.error_id }
          assert:
            - "both calls return HTTP 400 with error_id == ERR_INVALID_TERM_DATES"
            - "the 60-day term is rejected even though end is strictly after start — the 90-day minimum span binds"
            - "GET /farm-policies filtered on account_id == ${acct_id} returns 0 rows"

      - name: corner_premium_transaction_is_append_only_ledger
        claim_type: immutability
        grounds: ["entities.PremiumTransaction", "entities.PremiumTransaction.fields.sequence_no", "endpoints.GET_/farm-policies/{id}/premium-transactions"]
        distinguishing_aspect: "PremiumTransaction declares common_fields false: the rows are reachable only through GET /farm-policies/{id}/premium-transactions, carry no version / updated_at field and no PATCH or DELETE route exists, so history is corrected by appending a REVERSAL rather than by editing."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one Agent, one FarmAccount, one policy with a single RC DWELLING item, rated to total_premium_cents 269200"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - &k_item
              call: "POST /farm-policies/${pol_id}/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { it_dw: $.data.id }
            - &k_rate_get
              call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - &k_rate
              call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
          trigger:
            - call: "GET /farm-policies/${pol_id}/premium-transactions"
              as: Agent
              as_user_id: "${ag_id}"
              captures: { first_txn: "$.data[0].sequence_no", first_type: "$.data[0].txn_type" }
          assert:
            - "exactly 2 rows are returned with sequence_no 1 and 2 and txn_type BASE_PROPERTY and CAT_LOAD"
            - "amount_cents are 144000 and 125200 and reason_code is RATING on both"
            - "no row carries a version or updated_at field — PremiumTransaction declares common_fields false"
            - "no BASE_LIVESTOCK or BASE_LIABILITY row exists: zero-value components are not written"
            - "sum(amount_cents) == 269200 == FarmPolicy.${pol_id}.total_premium_cents"

      - name: corner_scheduled_item_requires_existing_parent_policy
        claim_type: parent_relationships
        grounds: ["entities.ScheduledItem.fields.policy_id", "validations[priority=4]", "errors.ERR_FARM_POLICY_NOT_FOUND"]
        distinguishing_aspect: "The nested create route resolves its path parent first: POST /farm-policies/{unknown}/scheduled-items is ERR_FARM_POLICY_NOT_FOUND (404) even though the body itself is perfectly valid."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent (no policies at all)"
          setup_api_calls:
            - *k_clock
            - *k_agent
          trigger:
            - call: "POST /farm-policies/00000000-0000-4000-8000-000000000031/scheduled-items"
              payload: { item_class: "DWELLING", description: "Ranch house", valuation_basis: "RC", stated_value_cents: 40000000, age_years: 22, condition_grade: "B" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { err_parent: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_FARM_POLICY_NOT_FOUND"
            - "the path id is resolved before the body is validated (priority 4 outranks the schema checks of priority 3 only for path ids; here the body is valid anyway)"
            - "no ScheduledItem row is created"

      - name: corner_flat_topology_policy_rejects_unknown_account_id
        claim_type: parent_relationships
        grounds: ["entities.FarmPolicy.fields.account_id", "validations[priority=5]", "errors.ERR_FARM_ACCOUNT_NOT_FOUND", "complexity_profile.entity_topology"]
        distinguishing_aspect: "Flat topology means body-borne foreign keys are validated too: POST /farm-policies with an unknown account_id fails the priority-5 body-existence check with ERR_FARM_ACCOUNT_NOT_FOUND (404), and POST /inspections with an unknown inspector_id likewise fails with ERR_INSPECTOR_NOT_FOUND."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent, one FarmAccount, one DRAFT policy"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
          trigger:
            - call: "POST /farm-policies"
              payload: { account_id: "00000000-0000-4000-8000-000000000041", term_start_date: "2026-09-01", term_end_date: "2027-08-31", deductible_cents: 500000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { err_acct: $.data.error_id }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "00000000-0000-4000-8000-000000000042", inspection_type: "INITIAL", scheduled_for: "2026-08-16T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { err_insp: $.data.error_id }
          assert:
            - "the first call returns HTTP 404 with error_id == ERR_FARM_ACCOUNT_NOT_FOUND"
            - "the second call returns HTTP 404 with error_id == ERR_INSPECTOR_NOT_FOUND — body ids are checked in §1.5 input order, so policy_id resolves first"
            - "no FarmPolicy and no Inspection row is created"

  - section: state_machines
    instances:

      - name: corner_initial_states_of_every_machine_on_creation
        claim_type: initial_state
        grounds: ["state_machines.FarmPolicy.uw_status.initial_state", "state_machines.FarmPolicy.compliance_status.initial_state", "state_machines.Endorsement.initial_state", "state_machines.Inspection.initial_state", "state_machines.LaborProfile.initial_state", "state_machines.CatReservation.initial_state"]
        distinguishing_aspect: "Every machine starts where §1.2 says: policy DRAFT / NOT_INSPECTED, LaborProfile NOT_REQUIRED at (0,0,0), CatReservation RESERVED, Endorsement REQUESTED with premium 0, Inspection SCHEDULED with hazard_score 0."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one Agent, one FarmAccount, one policy with a single RC DWELLING item at 40000000, an all-zero labor profile, one Inspector, rated to 269200"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - &k_labor_zero
              call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 0, seasonal_count: 0, migrant_h2a_count: 0 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { lab_id: $.data.id, lab_status: $.data.coordination_status }
            - &k_inspector
              call: "POST /inspectors"
              payload: { full_name: "Dana Reyes", region_code: "KS-CENTRAL", status: "ACTIVE", daily_capacity_minutes: 480 }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - *k_rate_get
            - *k_rate
          trigger:
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${pol_v2}", form_code: "POLLUTION_BUYBACK", sublimit_cents: 10000000, requested_effective_date: "2026-09-01" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { end_id: $.data.id, end_status: $.data.status }
            - call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-16T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { ins_id: $.data.id, ins_status: $.data.status }
            - call: "GET /cat-reservations"
              payload: { policy_id: "${pol_id}" }
              as: Underwriter
              captures: { res1_status: "$.data[0].status" }
          assert:
            - "LaborProfile.${lab_id}.coordination_status == NOT_REQUIRED with labor_exposure_units 0.00 and wc_required false"
            - "Endorsement.${end_id}.status == REQUESTED with premium_cents == 0 and requires_inspection == true (POLLUTION_BUYBACK)"
            - "Inspection.${ins_id}.status == SCHEDULED with hazard_score == 0, recommendation_count == 0 and completed_at null"
            - "all three CatReservation rows of the policy have status == RESERVED"
            - "the endorsement creation did NOT bump FarmPolicy.version — it is still ${pol_v2}"

      - name: corner_rate_draft_to_rated_writes_quote_and_reservations
        claim_type: valid_transition
        grounds: ["state_machines.FarmPolicy.uw_status[DRAFT->RATED]", "calculations.cat_load", "calculations.quote_expiry", "endpoints.POST_/farm-policies/{id}/rate"]
        distinguishing_aspect: "The happy-path rating: uw_status DRAFT -> RATED, rating_valuation_date stamped from the clock, quote_expires_at at +30 days, three RESERVED reservations in the pinned peril order and two ledger rows."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio (200000000 each, participation 0.50 / 0.30 / 0.20), one policy with a single RC DWELLING item at 40000000, deductible 500000"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_rate_get
          trigger:
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { rated_status: $.data.uw_status, rated_total: $.data.total_premium_cents }
          assert:
            - "FarmPolicy.${pol_id}.uw_status == RATED and compliance_status is still NOT_INSPECTED"
            - "rating_valuation_date == 2026-08-15T00:00:00Z and quote_expires_at == 2026-09-14T00:00:00Z"
            - "referred_at, referred_by_user_id and referral_reason_code are all null"
            - "property_premium_cents == 144000, livestock == 0, liability == 0, endorsement == 0, base == 144000, cat_load_cents == 125200, total_premium_cents == 269200, exposed_tiv_cents == 40000000"
            - "GET /cat-reservations?policy_id=${pol_id} returns 3 RESERVED rows in the order HAIL, WIND, WILDFIRE with amount_cents 20000000 / 12000000 / 8000000, utilization_at_rating 0.100000 / 0.060000 / 0.040000, scarcity_factor 1.00 on all three and load_cents 64000 / 25200 / 36000"
            - "each of the three pools now reports reserved_cents equal to its reservation amount, available_cents = 200000000 - reserved_cents, committed_cents 0 and version 2"
            - "the ledger holds exactly BASE_PROPERTY 144000 at sequence_no 1 and CAT_LOAD 125200 at sequence_no 2 — no BASE_LIVESTOCK or BASE_LIABILITY row is written for a zero component"
            - "FarmPolicy.${pol_id}.version == 2"

      - name: corner_rerating_releases_prior_reservations_before_reserving_again
        claim_type: side_effect_execution
        grounds: ["state_machines.FarmPolicy.uw_status[RATED->DRAFT]", "state_machines.CatReservation[RESERVED->RELEASED]", "calculations.premium_ledger_projection", "endpoints.PATCH_/scheduled-items/{id}"]
        distinguishing_aspect: "A PATCH on a RATED policy fires the revert cascade (release + full ledger reversal + zeroing) and the re-rating then reserves fresh capacity, so the pool is never double-counted."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with a single RC DWELLING item at 40000000, already rated to 269200"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_rate_get
            - *k_rate
          trigger:
            - call: "PATCH /scheduled-items/${it_dw}"
              payload: { stated_value_cents: 50000000 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { patched_iv: $.data.insured_value_cents }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v3: $.data.version }
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v3}" }
              as: Underwriter
              captures: { total2: $.data.total_premium_cents }
          assert:
            - "immediately after the PATCH the policy was back in DRAFT with every premium field and exposed_tiv_cents at 0 and quote_expires_at / rating_valuation_date null"
            - "the re-rating produces property_premium_cents == 180000, cat_load_cents == 156500 (loads 80000 / 31500 / 45000) and total_premium_cents == 336500 on exposed_tiv_cents 50000000"
            - "the policy has 6 CatReservation rows: the first three are RELEASED with their original amount_cents 20000000 / 12000000 / 8000000 retained, the second three are RESERVED with 25000000 / 15000000 / 10000000"
            - "the ledger holds 6 rows: 144000, 125200, then REVERSAL -144000 and -125200 with reverses_sequence_no 1 and 2 and reason_code RATING_REVERT, then BASE_PROPERTY 180000 and CAT_LOAD 156500 — sum 336500 == total_premium_cents"
            - "the HAIL pool reports reserved_cents 25000000, committed_cents 0, available_cents 175000000 and version 4: +1 at the first rating, +1 at the revert release, +1 at the re-reservation; the re-rating's own release step touches no pool because the policy held no RESERVED row at that moment"
            - "FarmPolicy.${pol_id}.version == 4"

      - name: corner_rate_twice_rejected_policy_not_in_draft
        claim_type: idempotency
        grounds: ["validations[priority=9]", "errors.ERR_POLICY_NOT_IN_DRAFT", "state_machines.FarmPolicy.uw_status[DRAFT->RATED]"]
        distinguishing_aspect: "Rating is not idempotent: the second rate call carries the CURRENT policy version so the OCC check at priority 8 passes, and the priority-9 state check returns ERR_POLICY_NOT_IN_DRAFT (409) instead."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with a single RC DWELLING item, already rated"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_rate_get
            - *k_rate
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v2b: $.data.version }
          trigger:
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v2b}" }
              as: Underwriter
              captures: { err_rate2: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_POLICY_NOT_IN_DRAFT"
            - "FarmPolicy.${pol_id}.version is still ${pol_v2b} and total_premium_cents is still 269200"
            - "the policy still has exactly 3 CatReservation rows, all RESERVED, and the ledger still holds exactly 2 rows"
            - "the three pools still report version 2 — a rejected rating applies no side effect at all"

      - name: corner_invalid_triggers_rejected_from_draft_state
        claim_type: invalid_transitions
        grounds: ["validations[priority=9]", "errors.ERR_POLICY_NOT_RATED", "errors.ERR_POLICY_NOT_BOUND", "errors.ERR_POLICY_NOT_REFERRED"]
        distinguishing_aspect: "From DRAFT every trigger that is not `rate`, an exposure write or `decline` is rejected, and each one names the state it needed: bind and endorsement-create -> ERR_POLICY_NOT_RATED, cancel -> ERR_POLICY_NOT_BOUND, referral-decisions -> ERR_POLICY_NOT_REFERRED."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent, one FarmAccount, one DRAFT policy at version 1 with one item and an all-zero labor profile"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
            - *k_policy
            - *k_item
            - *k_labor_zero
            - *k_rate_get
          trigger:
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { e_bind: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${pol_v1}", closure_reason: "not wanted" }
              as: Underwriter
              captures: { e_cancel: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/referral-decisions"
              payload: { decision: "APPROVE" }
              as: SeniorUnderwriter
              captures: { e_ref: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/endorsements"
              payload: { expected_policy_version: "${pol_v1}", form_code: "PEAK_SEASON_INCREASE", sublimit_cents: 12000000, requested_effective_date: "2026-09-01" }
              as: Underwriter
              captures: { e_end: $.data.error_id }
          assert:
            - "bind returns HTTP 409 ERR_POLICY_NOT_RATED; cancel returns HTTP 409 ERR_POLICY_NOT_BOUND; referral-decisions returns HTTP 409 ERR_POLICY_NOT_REFERRED; endorsement creation returns HTTP 409 ERR_POLICY_NOT_RATED"
            - "each call passed its priority-8 OCC check (the version supplied was current), so the 409 comes from priority 9 and not from a stale-version guard"
            - "FarmPolicy.${pol_id}.version is still 1, uw_status is still DRAFT and no Endorsement row exists"

      - name: corner_referral_decision_on_rated_policy_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.FarmPolicy.uw_status[REFERRED->RATED]", "validations[priority=9]", "errors.ERR_POLICY_NOT_REFERRED"]
        distinguishing_aspect: "A referral decision needs uw_status == REFERRED; on a plainly RATED policy the SeniorUnderwriter gets ERR_POLICY_NOT_REFERRED (409) even though the role is right and the body is valid."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with a single RC DWELLING item, rated (no referral trigger matched)"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_rate_get
            - *k_rate
          trigger:
            - call: "POST /farm-policies/${pol_id}/referral-decisions"
              payload: { decision: "RETURN", decision_note: "send it back" }
              as: SeniorUnderwriter
              captures: { e_notref: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_POLICY_NOT_REFERRED"
            - "FarmPolicy.${pol_id}.uw_status is still RATED with quote_expires_at 2026-09-14T00:00:00Z and version 2"
            - "no reservation was released and the ledger is unchanged at 2 rows"

      - name: corner_referral_approve_by_second_senior_restores_quote_expiry
        claim_type: valid_transition
        grounds: ["state_machines.FarmPolicy.uw_status[DRAFT->REFERRED]", "state_machines.FarmPolicy.uw_status[REFERRED->RATED]", "calculations.referral_trigger_evaluation", "calculations.quote_expiry"]
        distinguishing_aspect: "An AGRITOURISM exposure with 2500 visitors refers the policy (trigger 2) with quote_expires_at left null, and the APPROVE decision re-derives the expiry from the ORIGINAL rating_valuation_date rather than from the decision instant."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with a RC DWELLING item at 40000000 and an AGRITOURISM exposure (receipts 4000000, 2500 visitors -> exposure_premium_cents 316000)"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - &k_agri
              call: "POST /farm-policies/${pol_id}/liability-exposures"
              payload: { exposure_type: "AGRITOURISM", annual_receipts_cents: 4000000, annual_visitor_count: 2500 }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { agri_id: $.data.id, agri_prem: $.data.exposure_premium_cents }
            - *k_rate_get
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { ref_status: $.data.uw_status, ref_reason: $.data.referral_reason_code }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: SeniorUnderwriter
          trigger:
            - call: "POST /farm-policies/${pol_id}/referral-decisions"
              payload: { decision: "APPROVE", decision_note: "acceptable agritourism controls" }
              as: SeniorUnderwriter
              captures: { app_status: $.data.uw_status, app_expiry: $.data.quote_expires_at }
          assert:
            - "the rating produced uw_status REFERRED with referral_reason_code AGRITOURISM_VISITORS, referred_at 2026-08-15T00:00:00Z, referred_by_user_id set to the rating underwriter and quote_expires_at null"
            - "the rating still wrote every money figure: property 144000, liability 316000, base 460000, cat_load 125200, total 585200, and ledger rows BASE_PROPERTY / BASE_LIABILITY / CAT_LOAD at sequence_no 1..3 summing to 585200"
            - "after APPROVE the policy is RATED with quote_expires_at == 2026-09-14T00:00:00Z — derived from rating_valuation_date 2026-08-15, NOT from the 2026-08-20 decision instant"
            - "referred_at, referred_by_user_id and referral_reason_code are cleared"
            - "premiums, the 3 RESERVED reservations and the 3 ledger rows are untouched by the decision; FarmPolicy.version == 3"

      - name: corner_referral_return_reverses_ledger_and_releases_capacity
        claim_type: side_effect_execution
        grounds: ["state_machines.FarmPolicy.uw_status[REFERRED->DRAFT]", "state_machines.CatReservation[RESERVED->RELEASED]", "calculations.premium_ledger_projection"]
        distinguishing_aspect: "RETURN runs the same release / reversal / zeroing cascade as a RATED->DRAFT revert, so a referred policy can be reworked with the pool left exactly as it was before rating."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, the AGRITOURISM 2500-visitor policy referred at total 585200"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_agri
            - *k_rate_get
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { ref2_status: $.data.uw_status }
          trigger:
            - call: "POST /farm-policies/${pol_id}/referral-decisions"
              payload: { decision: "RETURN", decision_note: "reduce the visitor exposure" }
              as: SeniorUnderwriter
              captures: { ret_status: $.data.uw_status }
          assert:
            - "FarmPolicy.${pol_id}.uw_status == DRAFT with every premium field and exposed_tiv_cents 0, quote_expires_at null and rating_valuation_date null"
            - "referred_at, referred_by_user_id and referral_reason_code are cleared"
            - "all three CatReservation rows are RELEASED with their amount_cents retained"
            - "the three pools report reserved_cents 0, committed_cents 0, available_cents 200000000 and version 3"
            - "the ledger holds 6 rows: the three RATING rows plus three REVERSAL rows with amounts -144000, -316000, -125200 and reverses_sequence_no 1, 2, 3 — the ledger sums to 0 == total_premium_cents"
            - "the ScheduledItem and the LiabilityExposure rows survive untouched: exposure_premium_cents is still 316000"

      - name: corner_bind_commits_reserved_capacity_without_moving_premium
        claim_type: valid_transition
        grounds: ["state_machines.FarmPolicy.uw_status[RATED->BOUND]", "state_machines.CatReservation[RESERVED->COMMITTED]", "endpoints.POST_/farm-policies/{id}/bind"]
        distinguishing_aspect: "Bind moves reserved capacity to committed with available_cents unchanged and stamps bound_at / bound_by_user_id, while every premium figure and every ledger row stays exactly as the rating left them."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with a single RC DWELLING item and an all-zero labor profile, rated to 269200"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_labor_zero
            - *k_rate_get
            - *k_rate
            - &k_bind_get
              call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v_bind: $.data.version }
          trigger:
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_bind}" }
              as: Underwriter
              captures: { bound_status: $.data.uw_status, bound_when: $.data.bound_at }
          assert:
            - "FarmPolicy.${pol_id}.uw_status == BOUND with bound_at == 2026-08-15T00:00:00Z and bound_by_user_id == the binding underwriter"
            - "all three CatReservation rows are COMMITTED with unchanged amount_cents, utilization_at_rating, scarcity_factor and load_cents"
            - "the HAIL pool reports reserved_cents 0, committed_cents 20000000, available_cents 180000000 and version 3 — available_cents did not move on the bind"
            - "total_premium_cents is still 269200 and the ledger still holds exactly 2 rows summing to 269200"
            - "FarmPolicy.${pol_id}.version == 3 and compliance_status is still NOT_INSPECTED"

      - name: corner_cancel_needs_bound_and_decline_refuses_bound
        claim_type: precondition_enforcement
        grounds: ["state_machines.FarmPolicy.uw_status[BOUND->CANCELLED]", "validations[priority=9]", "errors.ERR_POLICY_NOT_BOUND"]
        distinguishing_aspect: "ERR_POLICY_NOT_BOUND guards both directions of the same boundary: cancel is refused before the bind and decline is refused after it."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with a single RC DWELLING item and an all-zero labor profile, rated to 269200"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_labor_zero
            - *k_rate_get
            - *k_rate
            - *k_bind_get
          trigger:
            - call: "POST /farm-policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${pol_v_bind}", closure_reason: "too early" }
              as: Underwriter
              captures: { e_cancel_rated: $.data.error_id }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_bind}" }
              as: Underwriter
              captures: { now_bound: $.data.uw_status }
            - call: "POST /farm-policies/${pol_id}/decline"
              payload: { closure_reason: "changed our minds" }
              as: Underwriter
              captures: { e_decline_bound: $.data.error_id }
          assert:
            - "the cancel attempt on the RATED policy returns HTTP 409 ERR_POLICY_NOT_BOUND and leaves version at ${pol_v_bind}"
            - "the bind succeeds and moves the policy to BOUND"
            - "the decline attempt on the BOUND policy returns HTTP 409 ERR_POLICY_NOT_BOUND"
            - "after the two rejections the policy is still BOUND with closure_reason null, total_premium_cents 269200, three COMMITTED reservations and version 3"

      - name: corner_declined_policy_locks_itself_and_all_children
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.FarmPolicy.uw_status.terminal_states", "state_machines.Inspection[SCHEDULED->CANCELLED]", "validations[priority=9]", "errors.ERR_POLICY_TERMINAL"]
        distinguishing_aspect: "DECLINED is terminal: it cancels the SCHEDULED inspection on the way out and then every mutating call — rate, exposure write, PATCH item, labor upsert, inspection scheduling, a second decline — returns ERR_POLICY_TERMINAL (409) rather than the state-specific 409 each route would otherwise use."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one DRAFT policy with one RC DWELLING item, one Inspector and one SCHEDULED inspection"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_inspector
            - &k_inspection
              call: "POST /inspections"
              payload: { policy_id: "${pol_id}", inspector_id: "${insp_id}", inspection_type: "INITIAL", scheduled_for: "2026-08-16T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { ins_id2: $.data.id }
            - *k_rate_get
          trigger:
            - call: "POST /farm-policies/${pol_id}/decline"
              payload: { closure_reason: "unacceptable wildfire exposure" }
              as: SeniorUnderwriter
              captures: { dec_status: $.data.uw_status }
            - call: "POST /farm-policies/${pol_id}/rate"
