          trigger:
            - { call: "POST /sample-kits/${k1}/custody-events", as: CareAgent, as_user_id: "${ag1}", payload: { event_type: LAB_RECEIVED, occurred_at: "2026-08-02T00:00:00Z", actor_label: "Lab intake", seal_id_observed: "SEAL-902", expected_sample_kit_version: "${kv2}" }, captures: { e1: "$.data.error_id" } }
            - { call: "POST /sample-kits/${k1}/custody-events", as: CareAgent, as_user_id: "${ag1}", payload: { event_type: KIT_ISSUED, occurred_at: "2026-08-02T00:00:00Z", actor_label: "Ada Grant", expected_sample_kit_version: "${kv2}" }, captures: { e2: "$.data.error_id" } }
