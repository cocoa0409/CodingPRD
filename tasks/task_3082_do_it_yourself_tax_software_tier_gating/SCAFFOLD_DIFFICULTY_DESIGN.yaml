      - name: upgrade_ack_required_masks_free_file_ineligibility
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: |
          Pair business_safety(p8) vs business_safety(p9) — a different
          error-category pair from instance 1 (state vs business_safety):
          with the account ACTIVE, a submit-review violating both the
          pending-prompt gate and the free-file gate must surface
          ERR_UPGRADE_ACK_REQUIRED first.
        test_recipe:
          setup:
            - "Account A (AGI 1000000c, ACTIVE) with return R holding ACTIVE F1040 + SCH_D; current_tier == FREE, free_file_eligible == false, and a PENDING UpgradePrompt is outstanding"
            - "Catalog seeded per header"
          setup_api_calls:
