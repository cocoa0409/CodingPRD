            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Billing service", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { a1_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Regression suite", evidence_uri: "s3://ev/2", outcome_mappings: [{ learning_outcome_id: "${oc2_id}", alignment: "SUPPORTING" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_status: "$.data.status", pf_artifacts: "$.data.artifact_count" }
          trigger:
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
              captures: { c_status: "$.data.assessment_status", c_fee: "$.data.fee_status", c_cov: "$.data.provisional_coverage_bp" }
          assert:
            - "the trigger response itself already shows assessment_status SUBMITTED, fee_status INVOICED and provisional_coverage_bp 9000 — 8000 for the PRIMARY OC1 mapping plus 1000 for the SUPPORTING OC2 mapping at 5000 bp of its 2000 bp weight"
            - "the same response already shows submitted_at 2026-08-01T00:00:00Z and priority_tier STANDARD; no field is null pending a later settle"
            - "GET /fee-invoices?claim_id=${claim_id} issued immediately after the trigger returns exactly 1 invoice with subtotal_cents 30000, discount_bp 1000, discount_cents 3000, total_cents 27000 and balance_due_cents 27000 — the invoice is fully computed, not a stub"
            - "GET /students/${stu_id} issued immediately after the trigger already shows pla_credits_reserved 6, and GET /students/${stu_id}/graduation-audit already shows pla_cap_remaining_reserved_inclusive 24 while pla_cap_remaining_posted_only is still 30"
            - "the portfolio was locked in the same request: Portfolio.${pf_id}.status is LOCKED and locked_at is 2026-08-01T00:00:00Z"
            - "repeating GET /pla-claims/${claim_id} three times with no intervening write returns identical provisional_coverage_bp, fee_status and version each time — derived values do not converge over reads"
            - "after a subsequent award, the award response body itself carries credits_awarded 6 and assessment_status AWARDED, and the very next GET /students/${stu_id} already shows pla_credits_reserved 0 with pla_credits_awarded 6 — the ledger move is not deferred"
            - "after transcript-posting, the posting response carries credit_status POSTED and posted_credits 6, and the graduation audit read in the next call already counts them in pla_credits_posted"
