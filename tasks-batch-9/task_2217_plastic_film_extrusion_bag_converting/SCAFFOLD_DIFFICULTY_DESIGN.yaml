            - "before revocation: BagLot.${bl1}.packed_case_count == 45, partial_case_bag_count == 0, pallet_count == 2"
            - "after revocation: BagLot.${bl1}.bag_count_unpacked == 46000, packed_bag_count == 0, packed_case_count == 0, partial_case_bag_count == 0, pallet_count == 0"
