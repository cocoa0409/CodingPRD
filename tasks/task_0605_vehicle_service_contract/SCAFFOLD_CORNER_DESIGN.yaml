              as: ContractAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdmin
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 40000, claim_date: "2026-02-01T00:00:00Z", complaint: "c1" }
              as: ClaimsAdjuster
              captures: { claim1_id: $.data.id }
            - call: "POST /claims/${claim1_id}/lines"
              payload: { line_type: "PART", part_number: "O-1", requested_amount_cents: 50000, covered: true }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim1_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim1_id}/approve"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /claims/${claim1_id}/authorize"
              payload: {}
              as: ClaimsAdjuster
              captures: { auth1_id: $.data.id }
            - call: "POST /claims"
              payload: { contract_id: "${contract_id}", repair_facility_id: "${fac_id}", odometer_at_claim: 45000, claim_date: "2026-03-01T00:00:00Z", complaint: "c2" }
              as: ClaimsAdjuster
