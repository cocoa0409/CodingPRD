# =============================================================================
# task_0474_musical_instrument_store — §1.9 Scaffold Corner Design
# Breadth probe over claim-extraction-guide taxonomy. All literals pre-computed.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Customer, endpoints]
        distinguishing_aspect: "POST /customers with full_name,email,credit_score -> 201; store_credit_cents=0, version=1, server-minted id/created_at."
        test_recipe:
          setup: ["No customers exist."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Anna", email: "anna@x.com", credit_score: 710 }
              as: SalesAssociate
              captures: { cid: $.data.id, sc: $.data.store_credit_cents, ver: $.data.version }
          assert:
            - "Customer.${cid}.store_credit_cents == 0"
            - "Customer.${cid}.version == 1"

      - name: create_unit_missing_required_serial_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.InventoryUnit.fields.serial_number, "validations[priority=14]"]
        distinguishing_aspect: "POST /units omitting serial_number -> ERR_INVALID_REQUEST (400); no unit created."
        test_recipe:
          setup: ["Authenticated SalesAssociate."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { model_name: "Oboe", category: "BAND", condition: "NEW", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: create_unit_invalid_condition_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.InventoryUnit.fields.condition, "validations[priority=14]"]
        distinguishing_aspect: "condition='ANTIQUE' (not in {NEW,USED,VINTAGE}) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Authenticated SalesAssociate."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { model_name: "Oboe2", category: "BAND", condition: "ANTIQUE", serial_number: "S-EN-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"

      - name: get_unit_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.InventoryUnit, "validations[priority=3]"]
        distinguishing_aspect: "GET /units/{random uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No unit with the queried id."]
          setup_api_calls: []
          trigger:
            - call: "GET /units/11111111-1111-4111-8111-111111111111"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"

      - name: duplicate_serial_same_model_returns_conflict
        claim_type: Type Constraints
        grounds: [entities.InventoryUnit.fields.serial_number, "validations[priority=13]", "errors[ERR_DUPLICATE_SERIAL]"]
        distinguishing_aspect: "Second POST /units with the same (model_name, serial_number) -> ERR_DUPLICATE_SERIAL (409)."
        test_recipe:
          setup: ["A unit 'Yamaha P-45' serial 'DUP-1' already exists."]
          setup_api_calls:
            - call: "POST /units"
              payload: { model_name: "Yamaha P-45", category: "KEYBOARD", condition: "NEW", serial_number: "DUP-1", acquisition_cost_cents: 40000, list_price_cents: 80000, monthly_rent_cents: 7000 }
              as: SalesAssociate
          trigger:
            - call: "POST /units"
              payload: { model_name: "Yamaha P-45", category: "KEYBOARD", condition: "NEW", serial_number: "DUP-1", acquisition_cost_cents: 40000, list_price_cents: 80000, monthly_rent_cents: 7000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_DUPLICATE_SERIAL"

      - name: same_serial_different_model_is_allowed
        claim_type: Creation
        grounds: [entities.InventoryUnit.fields.serial_number, "validations[priority=13]"]
        distinguishing_aspect: "serial 'SHARED-1' is unique only within a model_name; two units with same serial but different model_name both succeed (201)."
        test_recipe:
          setup: ["A unit 'Model A' serial 'SHARED-1' exists."]
          setup_api_calls:
            - call: "POST /units"
              payload: { model_name: "Model A", category: "GUITAR", condition: "NEW", serial_number: "SHARED-1", acquisition_cost_cents: 10000, list_price_cents: 20000, monthly_rent_cents: 2000 }
              as: SalesAssociate
          trigger:
            - call: "POST /units"
              payload: { model_name: "Model B", category: "GUITAR", condition: "NEW", serial_number: "SHARED-1", acquisition_cost_cents: 10000, list_price_cents: 20000, monthly_rent_cents: 2000 }
              as: SalesAssociate
              captures: { u2: $.data.id }
          assert:
            - "InventoryUnit.${u2}.status == AVAILABLE"

      - name: unit_default_source_kind_is_store_purchase
        claim_type: Defaults
        grounds: [entities.InventoryUnit.fields.source_kind]
        distinguishing_aspect: "Omitting source_kind on POST /units yields source_kind=STORE_PURCHASE."
        test_recipe:
          setup: ["Authenticated SalesAssociate."]
          setup_api_calls: []
          trigger:
            - call: "POST /units"
              payload: { model_name: "Default Sax", category: "BAND", condition: "NEW", serial_number: "S-DEF-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u: $.data.id, sk: $.data.source_kind }
          assert:
            - "InventoryUnit.${u}.source_kind == STORE_PURCHASE"

      - name: list_units_paginated_envelope
        claim_type: Listing
        grounds: [endpoints, entities.InventoryUnit]
        distinguishing_aspect: "GET /units returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["At least one unit exists."]
          setup_api_calls:
            - call: "POST /units"
              payload: { model_name: "List Unit", category: "OTHER", condition: "NEW", serial_number: "S-LU-1", acquisition_cost_cents: 1000, list_price_cents: 2000, monthly_rent_cents: 200 }
              as: SalesAssociate
          trigger:
            - call: "GET /units"
              payload: { limit: 10, offset: 0 }
              as: SalesAssociate
          assert:
            - "response.response_type == array"
            - "response.meta has total_count and has_more"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_layaway_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.LayawayPlan.OPEN_to_CANCELLED]
        distinguishing_aspect: "A second cancel on an already CANCELLED LayawayPlan -> ERR_INVALID_STATE (409); no further side effects."
        test_recipe:
          setup: ["Customer C, unit U reserved, LayawayPlan LP cancelled."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C St1", email: "cst1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /units"
              payload: { model_name: "St1 Guitar", category: "GUITAR", condition: "NEW", serial_number: "S-ST1-1", acquisition_cost_cents: 20000, list_price_cents: 40000, monthly_rent_cents: 4000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c}", expected_inventory_unit_version: "${uv}" }
              as: SalesAssociate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${c}", inventory_unit_id: "${u}", deposit_cents: 5000 }
              as: SalesAssociate
              captures: { lp: $.data.id }
            - call: "POST /layaway-plans/${lp}/cancel"
              as: SalesAssociate
          trigger:
            - call: "POST /layaway-plans/${lp}/cancel"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "LayawayPlan.${lp}.status == CANCELLED"

      - name: complete_unpaid_layaway_returns_layaway_not_paid
        claim_type: Precondition Enforcement
        grounds: [state_machines.LayawayPlan.OPEN_to_COMPLETED, "validations[priority=11]", "errors[ERR_LAYAWAY_NOT_PAID]"]
        distinguishing_aspect: "Completing an OPEN layaway with remaining_cents>0 -> ERR_LAYAWAY_NOT_PAID (422); plan stays OPEN, unit stays ON_LAYAWAY."
        test_recipe:
          setup: ["Customer C, unit U (list 60000) reserved, LayawayPlan LP open with deposit 10000 (remaining 50000)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C St2", email: "cst2@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /units"
              payload: { model_name: "St2 Cello", category: "ORCHESTRA", condition: "NEW", serial_number: "S-ST2-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c}", expected_inventory_unit_version: "${uv}" }
              as: SalesAssociate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${c}", inventory_unit_id: "${u}", deposit_cents: 10000 }
              as: SalesAssociate
              captures: { lp: $.data.id }
          trigger:
            - call: "POST /layaway-plans/${lp}/complete"
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_LAYAWAY_NOT_PAID"
            - "LayawayPlan.${lp}.status == OPEN"
            - "InventoryUnit.${u}.status == ON_LAYAWAY"

      - name: buyout_on_plain_rental_returns_plan_not_rent_to_own
        claim_type: Precondition Enforcement
        grounds: [state_machines.RentalAgreement.ACTIVE_to_BOUGHT_OUT, "validations[priority=7]", "errors[ERR_PLAN_NOT_RENT_TO_OWN]"]
        distinguishing_aspect: "Buyout on a plan=RENTAL agreement -> ERR_PLAN_NOT_RENT_TO_OWN (409); agreement stays ACTIVE."
        test_recipe:
          setup: ["Customer C, unit U reserved, RentalAgreement A (RENTAL) ACTIVE."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C St3", email: "cst3@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /units"
              payload: { model_name: "St3 Viola", category: "ORCHESTRA", condition: "NEW", serial_number: "S-ST3-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c}", expected_inventory_unit_version: "${uv}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c}", inventory_unit_id: "${u}", plan: "RENTAL" }
              as: SalesAssociate
              captures: { a: $.data.id }
            - call: "GET /rental-agreements/${a}"
              as: SalesAssociate
              captures: { av: $.data.version }
          trigger:
            - call: "POST /rental-agreements/${a}/buyout"
              payload: { amount_cents: 65000, expected_agreement_version: "${av}" }
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PLAN_NOT_RENT_TO_OWN"
            - "RentalAgreement.${a}.status == ACTIVE"

      - name: return_with_outstanding_late_fees_blocked
        claim_type: Precondition Enforcement
        grounds: [state_machines.RentalAgreement.ACTIVE_to_RETURNED, "validations[priority=8]", "errors[ERR_OUTSTANDING_LATE_FEES]"]
        distinguishing_aspect: "Return blocked while late_fee_balance_cents>0 (one missed advance -> 1500) -> ERR_OUTSTANDING_LATE_FEES (409); stays ACTIVE."
        test_recipe:
          setup: ["Customer C, RENT_TO_OWN agreement A on unit U, one unpaid advance posted (late_fee_balance 1500, still ACTIVE)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C St4", email: "cst4@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /units"
              payload: { model_name: "St4 Sax", category: "BAND", condition: "NEW", serial_number: "S-ST4-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c}", expected_inventory_unit_version: "${uv}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c}", inventory_unit_id: "${u}", plan: "RENT_TO_OWN", equity_rate_pct: 0.50 }
              as: SalesAssociate
              captures: { a: $.data.id }
            - call: "POST /rental-agreements/${a}/advance-cycle"
              payload: { billing_cycle_index: 1 }
              as: StoreManager
          trigger:
            - call: "POST /rental-agreements/${a}/return"
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_OUTSTANDING_LATE_FEES"
            - "RentalAgreement.${a}.status == ACTIVE"

      - name: initial_states_on_create
        claim_type: Initial State
        grounds: [state_machines.RepairTicket, state_machines.SpecialOrder, state_machines.TradeIn]
        distinguishing_aspect: "New RepairTicket is INTAKE, new SpecialOrder is QUOTED, new TradeIn is OFFERED."
        test_recipe:
          setup: ["Customer C exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C St5", email: "cst5@x.com", credit_score: 700 }
              as: StoreManager
              captures: { c: $.data.id }
          trigger:
            - call: "POST /trade-ins"
              payload: { customer_id: "${c}", model_name: "Init Horn", condition: "USED", appraised_value_cents: 10000 }
              as: StoreManager
              captures: { t: $.data.id, st: $.data.status }
          assert:
            - "TradeIn.${t}.status == OFFERED"

      - name: terminal_state_lockdown_bought_out_cannot_return
        claim_type: Terminal State Lockdown
        grounds: [state_machines.RentalAgreement.ACTIVE_to_RETURNED, state_machines.RentalAgreement.ACTIVE_to_BOUGHT_OUT]
        distinguishing_aspect: "After BOUGHT_OUT (terminal), POST .../return -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["RENT_TO_OWN agreement A bought out (3 months paid, payoff 110000), now BOUGHT_OUT."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C St6", email: "cst6@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /units"
              payload: { model_name: "St6 Guitar", category: "GUITAR", condition: "NEW", serial_number: "S-ST6-1", acquisition_cost_cents: 60000, list_price_cents: 120000, monthly_rent_cents: 10000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c}", expected_inventory_unit_version: "${uv}" }
              as: SalesAssociate
            - call: "POST /rental-agreements"
              payload: { customer_id: "${c}", inventory_unit_id: "${u}", plan: "RENT_TO_OWN", equity_rate_pct: 0.50 }
              as: SalesAssociate
              captures: { a: $.data.id }
            - call: "POST /rental-agreements/${a}/payments"
              payload: { billing_cycle_index: 1 }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /rental-agreements/${a}/payments"
              payload: { billing_cycle_index: 2 }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /rental-agreements/${a}/payments"
              payload: { billing_cycle_index: 3 }
              as: Customer
              as_user_id: "${c}"
            - call: "GET /rental-agreements/${a}"
              as: Customer
              as_user_id: "${c}"
              captures: { av: $.data.version }
            - call: "POST /rental-agreements/${a}/buyout"
              payload: { amount_cents: 110000, expected_agreement_version: "${av}" }
              as: Customer
              as_user_id: "${c}"
          trigger:
            - call: "POST /rental-agreements/${a}/return"
              as: Customer
              as_user_id: "${c}"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "RentalAgreement.${a}.status == BOUGHT_OUT"

      - name: consignment_withdraw_retires_unit_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.ConsignmentListing.LISTED_to_WITHDRAWN, state_machines.InventoryUnit.CONSIGNED_to_RETIRED]
        distinguishing_aspect: "Withdrawing a LISTED consignment cascades the linked unit CONSIGNED -> RETIRED."
        test_recipe:
          setup: ["Consignor C, ConsignmentListing CL LISTED with its CONSIGNED unit."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C St7", email: "cst7@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /consignment-listings"
              payload: { consignor_id: "${c}", model_name: "Wd Guitar", ask_price_cents: 80000 }
              as: SalesAssociate
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /consignment-listings/${cl}/withdraw"
              as: SalesAssociate
          assert:
            - "ConsignmentListing.${cl}.status == WITHDRAWN"

      - name: trade_in_accept_mints_unit_and_credits
        claim_type: Side Effect Execution
        grounds: [state_machines.TradeIn.OFFERED_to_ACCEPTED, entities.TradeIn.fields.resulting_unit_id, calculations.tradein_offer]
        distinguishing_aspect: "Accepting a VINTAGE trade-in (appraised 200000) credits 140000 and sets resulting_unit_id to a new AVAILABLE unit."
        test_recipe:
          setup: ["Customer C, TradeIn T (VINTAGE, appraised 200000) OFFERED (offer 140000)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C St8", email: "cst8@x.com", credit_score: 700 }
              as: StoreManager
              captures: { c: $.data.id }
            - call: "POST /trade-ins"
              payload: { customer_id: "${c}", model_name: "1959 Bassman", condition: "VINTAGE", appraised_value_cents: 200000 }
              as: StoreManager
              captures: { t: $.data.id }
          trigger:
            - call: "POST /trade-ins/${t}/accept"
              as: StoreManager
              captures: { ruid: $.data.resulting_unit_id }
          assert:
            - "TradeIn.${t}.status == ACCEPTED"
            - "TradeIn.${t}.offer_cents == 140000"
            - "Customer.${c}.store_credit_cents == 140000"

      - name: special_order_full_lifecycle_to_fulfilled
        claim_type: Valid Transition
        grounds: [state_machines.SpecialOrder.ARRIVED_to_FULFILLED, state_machines.InventoryUnit, entities.SpecialOrder.fields.fulfilled_unit_id]
        distinguishing_aspect: "QUOTED->DEPOSITED->ORDERED->ARRIVED (mints RESERVED unit)->FULFILLED cascades the unit RESERVED -> SOLD."
        test_recipe:
          setup: ["Customer C, SpecialOrder SO (quoted 200000) deposited, placed, received (ARRIVED with reserved unit)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C St9", email: "cst9@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${c}", model_name: "Spec Order Bass", quoted_price_cents: 200000, deposit_pct: 0.25 }
              as: SalesAssociate
              captures: { so: $.data.id }
            - call: "POST /special-orders/${so}/pay-deposit"
              payload: { amount_cents: 50000 }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /special-orders/${so}/place"
              as: SalesAssociate
            - call: "POST /special-orders/${so}/receive"
              payload: { serial_number: "SO-SERIAL-1", category: "GUITAR" }
              as: SalesAssociate
              captures: { fuid: $.data.fulfilled_unit_id }
          trigger:
            - call: "POST /special-orders/${so}/fulfill"
              as: SalesAssociate
          assert:
            - "SpecialOrder.${so}.status == FULFILLED"

      - name: cancel_already_cancelled_layaway_excluded
        claim_type: Idempotency
        grounds: [state_machines.LayawayPlan.OPEN_to_CANCELLED]
        excluded_because:
          difficulty_instance: compensating_invariant / layaway_cancel_conserves_money_into_store_credit
          rationale: "Layaway cancel happy-path and its money conservation are exercised by the named §1.8 instance; the invalid second-cancel is covered by cancel_already_cancelled_layaway_returns_invalid_state above."

  # ===========================================================================
  - section: calculations
    instances:
      - name: repair_invoice_min_bench_floor_applies
        claim_type: Constants Applied
        grounds: [calculations.repair_invoice, entities.RepairTicket.fields.quoted_total_cents]
        distinguishing_aspect: "labor 0.5h@5000=2500 is floored to MIN_BENCH_CENTS=4000; no parts, no rush -> quoted_total_cents=4000."
        test_recipe:
          setup: ["Customer C exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Ca1", email: "cca1@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
          trigger:
            - call: "POST /repair-tickets"
              payload: { customer_id: "${c}", labor_hours: 0.5, labor_rate_cents: 5000 }
              as: SalesAssociate
              captures: { rt: $.data.id, tot: $.data.quoted_total_cents }
          assert:
            - "RepairTicket.${rt}.quoted_total_cents == 4000"

      - name: tradein_offer_new_condition_tier
        claim_type: Correct Result
        grounds: [calculations.tradein_offer, entities.TradeIn.fields.offer_cents]
        distinguishing_aspect: "NEW condition trade-in appraised 100000 -> floor(100000*0.60)=60000."
        test_recipe:
          setup: ["Customer C exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Ca2", email: "cca2@x.com", credit_score: 700 }
              as: StoreManager
              captures: { c: $.data.id }
          trigger:
            - call: "POST /trade-ins"
              payload: { customer_id: "${c}", model_name: "New Horn", condition: "NEW", appraised_value_cents: 100000 }
              as: StoreManager
              captures: { t: $.data.id, off: $.data.offer_cents }
          assert:
            - "TradeIn.${t}.offer_cents == 60000"

      - name: financing_subprime_tier_amortization
        claim_type: Correct Result
        grounds: [calculations.financing_terms, entities.FinancingApplication.fields.monthly_payment_cents]
        distinguishing_aspect: "score 600 -> APR 0.2299; principal 240000, term 24 -> monthly_payment_cents=12568."
        test_recipe:
          setup: ["Customer C with credit_score=600, FinancingApplication F (principal 240000, term 24) SUBMITTED."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Ca3", email: "cca3@x.com", credit_score: 600 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /financing-applications"
              payload: { customer_id: "${c}", principal_cents: 240000, term_months: 24 }
              as: SalesAssociate
              captures: { f: $.data.id }
          trigger:
            - call: "POST /financing-applications/${f}/approve"
              as: StoreManager
              captures: { apr: $.data.apr_pct, pay: $.data.monthly_payment_cents }
          assert:
            - "FinancingApplication.${f}.apr_pct == 0.2299"
            - "FinancingApplication.${f}.monthly_payment_cents == 12568"

      - name: layaway_paid_remaining_aggregation
        claim_type: Correct Result
        grounds: [calculations.layaway_paid, entities.LayawayPlan.fields.remaining_cents]
        distinguishing_aspect: "deposit 20000 + two 20000 installments on a 60000 plan -> paid 60000, remaining 0."
        test_recipe:
          setup: ["Customer C, unit U (list 60000) reserved, LayawayPlan LP (deposit 20000), two 20000 installments posted."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Ca4", email: "cca4@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
            - call: "POST /units"
              payload: { model_name: "Ca4 Drum", category: "OTHER", condition: "NEW", serial_number: "S-CA4-1", acquisition_cost_cents: 30000, list_price_cents: 60000, monthly_rent_cents: 5000 }
              as: SalesAssociate
              captures: { u: $.data.id, uv: $.data.version }
            - call: "POST /units/${u}/reserve"
              payload: { customer_id: "${c}", expected_inventory_unit_version: "${uv}" }
              as: SalesAssociate
            - call: "POST /layaway-plans"
              payload: { customer_id: "${c}", inventory_unit_id: "${u}", deposit_cents: 20000 }
              as: SalesAssociate
              captures: { lp: $.data.id }
            - call: "POST /layaway-plans/${lp}/payments"
              payload: { amount_cents: 20000 }
              as: Customer
              as_user_id: "${c}"
            - call: "POST /layaway-plans/${lp}/payments"
              payload: { amount_cents: 20000 }
              as: Customer
              as_user_id: "${c}"
          trigger:
            - call: "GET /layaway-plans/${lp}"
              as: Customer
              as_user_id: "${c}"
              captures: { paid: $.data.paid_cents, rem: $.data.remaining_cents }
          assert:
            - "LayawayPlan.${lp}.paid_cents == 60000"
            - "LayawayPlan.${lp}.remaining_cents == 0"

      - name: special_order_deposit_ceil_rounding
        claim_type: Precision
        grounds: [calculations.special_order_deposit, entities.SpecialOrder.fields.required_deposit_cents]
        distinguishing_aspect: "quoted 99999 @ 0.25 -> ceil(24999.75)=25000 (ceil, not round)."
        test_recipe:
          setup: ["Customer C exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "C Ca5", email: "cca5@x.com", credit_score: 700 }
              as: SalesAssociate
              captures: { c: $.data.id }
          trigger:
            - call: "POST /special-orders"
              payload: { customer_id: "${c}", model_name: "Ca5 Order", quoted_price_cents: 99999, deposit_pct: 0.25 }
              as: SalesAssociate
              captures: { so: $.data.id, dep: $.data.required_deposit_cents }
          assert:
            - "SpecialOrder.${so}.required_deposit_cents == 25000"

      - name: rto_equity_payoff_divergence_excluded
        claim_type: Variant Divergence
        grounds: [calculations.equity_accrual, calculations.buyout_payoff]
        excluded_because:
          difficulty_instance: dual_variant_calc / rto_equity_vs_payoff_diverge_on_agreement
          rationale: "Variant divergence between equity and payoff is the core assertion of the named §1.8 instance."

