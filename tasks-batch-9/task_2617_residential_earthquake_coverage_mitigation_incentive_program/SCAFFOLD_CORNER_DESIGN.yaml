            - call: "POST /eqp/retrofit-grants"
              payload: { dwelling_id: "${dw_id}", grant_cycle_id: "${gc_id}", income_tier: "TIER_LOW", project_cost_estimate_cents: 200000, requested_scope: "CRIPPLE_WALL_BRACING" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { gr_id: $.data.id }
            - call: "POST /eqp/retrofit-grants/${gr_id}/begin-review"
