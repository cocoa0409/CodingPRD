            - "the response error_id == ERR_INVALID_STATE_TRANSITION with http_status 409"
            - "ConflictCase.${case_sp_id}.status == OPEN, conflict_type == PARTNER_VS_DIRECT, resolved_by_user_id == null"
            - "DealRegistration.${rw_sp_id}.status == APPROVED with protection_days == 30 and exclusivity_end_at == 2026-05-01T00:00:00.000Z (no halving happened)"
            - "DealRegistration.${rw_sp_id}.closure_reason == DIRECT_PURSUIT_CONTESTED (written by CASCADE D hop 2, unchanged by the refusal)"
            - "Account.${acc_sp_id}.coverage_state == CHANNEL_PROTECTED with protected_until == 2026-05-01T00:00:00.000Z"

      - name: certification_expiry_sweep_fires_on_review_preparation
        claim_type: side_effect_execution
        grounds:
          - state_machines.CertificationRecord.ACTIVE_to_EXPIRED
          - calculations.certification_credit_rollup
          - calculations.partner_tier_scoring
          - calculations.portal_entitlement
        distinguishing_aspect: "Preparing a PerformanceReview is the only producer of CertificationRecord.EXPIRED: a TECH_EXPERT record whose expires_at 2026-01-15 has passed flips to EXPIRED inside POST /performance-reviews, dropping cert_credit_total 4 -> 0 and scoring the review with provisional_cert_credit 0."
        test_recipe:
          setup:
            - "One RESELLER partner with marketing_commitment_cents 0 and a single TECH_EXPERT certification (4 credits) issued 2025-06-01 and expiring 2026-01-15T00:00:00.000Z, created while the clock read 2026-01-05T00:00:00.000Z."
            - "The clock then advances to 2026-02-01T00:00:00.000Z, past that expiry."
            - "PROVISIONAL scoring after the sweep: cert_component 0, revenue_component 0, marketing_component 1.0 -> score = round_half_up(40*0 + 35*0 + 25*1.0, 2) = 25.0 -> recommended_tier REGISTERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_sw_id: $.data.id }
            - call: "POST /partners/${p_sw_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2026-01-15T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { cert_sw_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "POST /performance-reviews"
              payload: { partner_id: "${p_sw_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-01-31T23:59:59.999Z", findings_count: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { rev_sw_id: $.data.id }
          assert:
            - "before the trigger Partner.${p_sw_id}.cert_credit_total == 4 and CertificationRecord.${cert_sw_id}.status == ACTIVE"
            - "CASCADE E hop 1 - CertificationRecord.${cert_sw_id}.status == EXPIRED after the trigger"
            - "Partner.${p_sw_id}.cert_credit_total == 0"
            - "PerformanceReview.${rev_sw_id}.provisional_cert_credit == 0, provisional_revenue_cents == 0, provisional_score == 25.0, recommended_tier == REGISTERED"
            - "PerformanceReview.${rev_sw_id}.status == PREPARED and remediation_due_at == null (findings_count 0 keeps the initial state observable)"
            - "Partner.${p_sw_id}.portal_entitlement_level == BASIC (CERT_FLOOR_BY_TIER[REGISTERED] is 0, so the lapse costs no demotion at the entry tier)"

      - name: registration_convert_requires_an_invoiced_order
        claim_type: precondition_enforcement
        grounds:
          - state_machines.DealRegistration.APPROVED_to_CONVERTED
          - endpoints[POST /deal-registrations/{id}/convert]
          - calculations.channel_margin_resolution
        distinguishing_aspect: "APPROVED -> CONVERTED requires at least one OrderInvoice of the registration in {INVOICED, CREDITED}: the convert call fails with ERR_INVALID_STATE_TRANSITION while the only linked order is PENDING and succeeds after that order is invoiced."
        test_recipe:
          setup:
            - "Clock 2026-04-01T00:00:00.000Z; one RESELLER partner with one TECH_ASSOCIATE certification; one account."
            - "The registration is APPROVED (window [2026-04-01T00:00:00.000Z, 2026-05-01T00:00:00.000Z), uplift 0.06)."
            - "One DROP_SHIP order of list 4,000,000 linked to it: prelim margin 0.10 + 0.06 = 0.16, prelim_net 3,360,000 -> NONE band, margin_pct 0.1600, invoice_amount 3,360,000, still PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_cv_id: $.data.id }
            - call: "POST /partners/${p_cv_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_cv_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_cv_id}", account_id: "${acc_cv_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 4000000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_cv_id}"
              captures: { r_cv_id: $.data.id }
            - call: "POST /deal-registrations/${r_cv_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p_cv_id}"
            - call: "POST /deal-registrations/${r_cv_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${r_cv_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_cv_id}", order_type: "DROP_SHIP", list_amount_cents: 4000000, registration_id: "${r_cv_id}" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_cv_id: $.data.id }
          trigger:
            - call: "POST /deal-registrations/${r_cv_id}/convert"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /order-invoices/${inv_cv_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${r_cv_id}/convert"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "OrderInvoice.${inv_cv_id}.margin_pct == 0.1600, invoice_amount_cents == 3360000, margin_value_cents == 640000, status == PENDING before the first convert"
            - "the first convert returns error_id == ERR_INVALID_STATE_TRANSITION with http_status 409 and DealRegistration.${r_cv_id}.status stays APPROVED"
            - "OrderInvoice.${inv_cv_id}.status == INVOICED with invoiced_at == 2026-04-01T00:00:00.000Z after the invoice call"
            - "Partner.${p_cv_id}.trailing_revenue_cents == 3360000 after the invoice call"
            - "the second convert succeeds: DealRegistration.${r_cv_id}.status == CONVERTED with closure_reason == CONVERTED"
            - "DealRegistration.${r_cv_id}.exclusivity_end_at == 2026-05-01T00:00:00.000Z is unchanged by the conversion"

      - name: account_direct_locked_is_terminal_for_further_pursuit
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Account.terminal_states
          - state_machines.ConflictCase.OPEN_to_RESOLVED_DIRECT
          - errors[ERR_INVALID_STATE_TRANSITION]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / registration_submit_depends_on_account_direct_locked_state
          rationale: "That instance drives the account into DIRECT_LOCKED and asserts the lockdown from the registration side (submit refused, protected_* cleared, incumbent REJECTED); the terminal-state claim is its core assertion."

      - name: deal_registration_revision_loop_capped_at_two_rounds
        claim_type: cyclic
        grounds:
          - state_machines.DealRegistration.CHANGES_REQUESTED_to_SUBMITTED
          - calculations.exclusivity_window.constants.MAX_REVISION_ROUNDS
        excluded_because:
          difficulty_instance: non_linear_state_machine / deal_registration_revision_cycle_caps_at_two_rounds
          rationale: "That instance walks the loop twice and asserts the third resubmission is refused with revision_round frozen at 2."

      - name: mdf_claim_parallel_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.MdfClaim.settlement_state_UNPAID_to_APPROVED_FOR_PAYMENT
          - state_machines.MdfClaim.settlement_state_APPROVED_FOR_PAYMENT_to_PAID
        excluded_because:
          difficulty_instance: non_linear_state_machine / mdf_claim_settlement_dimension_advances_independently_of_validation
          rationale: "That instance advances settlement_state through both hops while validation_state stays VALIDATED and asserts the four allocation buckets after each hop."

      - name: registration_approval_cascades_down_to_rival_registrations
        claim_type: cascade_down
        grounds:
          - state_machines.DealRegistration.SUBMITTED_to_CONFLICT_HELD
          - state_machines.Account.OPEN_CHANNEL_to_CHANNEL_PROTECTED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_registration_approval_to_partner_probation_depth_four
          rationale: "That instance asserts all four hops of CASCADE A including which rival registrations are held and which are left alone."

  # =========================================================================
  # Table 3 - Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: certification_credit_rollup_sums_the_track_weights
        claim_type: correct_result
        grounds:
          - calculations.certification_credit_rollup
          - entities.Partner.cert_credit_total
        distinguishing_aspect: "cert_credit_total is a full recompute over ACTIVE records using CERT_CREDIT_WEIGHT, so SALES_PRO + TECH_ASSOCIATE + TECH_EXPERT on one partner yields exactly 1 + 2 + 4 = 7 credits."
        test_recipe:
          setup:
            - "One RESELLER partner at clock 2026-03-01T00:00:00.000Z, no certifications yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_cc_id: $.data.id }
          trigger:
            - call: "POST /partners/${p_cc_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "SALES_PRO", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { c_sp_id: $.data.id }
            - call: "POST /partners/${p_cc_id}/certifications"
              payload: { engineer_name: "Jae Kim", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p_cc_id}/certifications"
              payload: { engineer_name: "Kit Vance", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "CertificationRecord.${c_sp_id}.credit_weight == 1 and status == ACTIVE"
            - "Partner.${p_cc_id}.cert_credit_total == 1 after the first call, 3 after the second, 7 after the third"
            - "Partner.${p_cc_id}.tier == REGISTERED and portal_entitlement_level == BASIC (credits alone never promote a partner)"

      - name: revenue_rollup_excludes_pending_orders
        claim_type: input_set_filtering
        grounds:
          - calculations.partner_revenue_rollup
          - state_machines.OrderInvoice.PENDING_to_INVOICED
          - calculations.channel_margin_resolution
        distinguishing_aspect: "trailing_revenue_cents sums only OrderInvoice rows in {INVOICED, CREDITED}: a second identical order left PENDING contributes nothing even though its invoice_amount_cents is already computed and stored."
        test_recipe:
          setup:
            - "One REGISTERED RESELLER partner at clock 2026-03-01T00:00:00.000Z with no registration, so every order resolves at BASE_MARGIN_PCT[REGISTERED] = 0.10."
            - "list 1,000,000 -> prelim_margin 0.1000, prelim_net 900,000 -> NONE band -> margin_pct 0.1000, invoice_amount 900,000, margin_value 100,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_rr_id: $.data.id }
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_rr_id}", order_type: "DROP_SHIP", list_amount_cents: 1000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_a_id: $.data.id }
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_rr_id}", order_type: "DROP_SHIP", list_amount_cents: 1000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_b_id: $.data.id }
          trigger:
            - call: "POST /order-invoices/${inv_a_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "OrderInvoice.${inv_a_id}.margin_pct == 0.1000, invoice_amount_cents == 900000, margin_value_cents == 100000, volume_band == NONE"
            - "OrderInvoice.${inv_b_id}.invoice_amount_cents == 900000 with status PENDING"
            - "Partner.${p_rr_id}.trailing_revenue_cents == 900000 (the PENDING twin is excluded, not 1800000)"
            - "OrderInvoice.${inv_a_id}.status == INVOICED with invoiced_at == 2026-03-01T00:00:00.000Z"

      - name: marketing_attainment_zero_commitment_is_vacuously_compliant
        claim_type: correct_result
        grounds:
          - calculations.marketing_attainment
          - endpoints[PATCH /partners/{id}]
        distinguishing_aspect: "A commitment of 0 short-circuits to marketing_attainment_pct 1.0000 rather than a division by zero, and raising the commitment by PATCH while qualified spend is 0 drops the figure to exactly 0.0000."
        test_recipe:
          setup:
            - "One RESELLER partner created with marketing_commitment_cents 0 at clock 2026-03-01T00:00:00.000Z; no MDF claims exist, so marketing_qualified_spend_cents is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_ma_id: $.data.id }
          trigger:
            - call: "PATCH /partners/${p_ma_id}"
              payload: { marketing_commitment_cents: 800000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "before the trigger Partner.${p_ma_id}.marketing_qualified_spend_cents == 0 and marketing_attainment_pct == 1.0000"
            - "after the trigger Partner.${p_ma_id}.marketing_commitment_cents == 800000 and marketing_attainment_pct == 0.0000"
            - "Partner.${p_ma_id}.marketing_qualified_spend_cents is still 0 (the PATCH moves the denominator only)"
            - "Partner.${p_ma_id}.tier_status == COMPLIANT and portal_entitlement_level == BASIC (attainment below MARKETING_COMPLIANCE_MIN_PCT does not by itself change standing outside a review)"

      - name: tier_score_rounds_once_after_weighting
        claim_type: precision
        grounds:
          - calculations.partner_tier_scoring
          - calculations.partner_tier_scoring.precision
        distinguishing_aspect: "cert_credit_basis 5 of CERT_CREDIT_TARGET 12 gives the non-terminating component 5/12, and the weighted sum must be rounded once to 41.67 - rounding the component to 0.42 first would print 41.80."
        test_recipe:
          setup:
            - "One RESELLER partner with marketing_commitment_cents 0 (attainment 1.0000), one TECH_EXPERT (4) and one SALES_PRO (1) certification, both expiring 2028-06-01, and no orders at all."
            - "PROVISIONAL: cert_component 5/12, revenue_component 0, marketing_component 1.0 -> round_half_up(40*5/12 + 0 + 25, 2) = round_half_up(41.6666..., 2) = 41.67."
            - "FINAL is identical here (both certs clear period_end + 90 days and there are no PENDING orders), so final_score == provisional_score == 41.67 and both tiers are REGISTERED (41.67 < SILVER_SCORE_MIN 45)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_ws_id: $.data.id }
            - call: "POST /partners/${p_ws_id}/certifications"
              payload: { engineer_name: "Kit Vance", track: "TECH_EXPERT", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /partners/${p_ws_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "SALES_PRO", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /performance-reviews"
              payload: { partner_id: "${p_ws_id}", period_start: "2026-01-01T00:00:00.000Z", period_end: "2026-01-31T23:59:59.999Z", findings_count: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { rev_ws_id: $.data.id }
            - call: "POST /performance-reviews/${rev_ws_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
          assert:
            - "PerformanceReview.${rev_ws_id}.provisional_cert_credit == 5 and provisional_score == 41.67 (not 41.8 and not 41.66)"
            - "PerformanceReview.${rev_ws_id}.recommended_tier == REGISTERED"
            - "PerformanceReview.${rev_ws_id}.final_cert_credit == 5, final_revenue_cents == 0, final_score == 41.67, approved_tier == REGISTERED"
            - "Partner.${p_ws_id}.tier == REGISTERED, cert_credit_total == 5, tier_status == COMPLIANT"

      - name: volume_band_mid_minimum_boundary_one_cent_apart
        claim_type: threshold
        grounds:
          - calculations.channel_margin_resolution
          - calculations.channel_margin_resolution.constants.VOLUME_BAND_MID_MIN_CENTS
        distinguishing_aspect: "Two orders one cent apart in list price straddle VOLUME_BAND_MID_MIN_CENTS: list 5,681,818 rounds its preliminary net to exactly 5,000,000 and earns the MID uplift, while 5,681,817 rounds to 4,999,999 and earns nothing."
        test_recipe:
          setup:
            - "One REGISTERED DISTRIBUTOR partner at clock 2026-03-01T00:00:00.000Z, no registration, both orders STOCKING so prelim_margin = 0.10 + 0.02 = 0.12."
            - "list 5,681,818: prelim_net = round_half_up(5,681,818 * 0.88) = 5,000,000 -> MID -> margin_pct = 0.1350 (ceiling 0.18 not binding) -> invoice_amount = round_half_up(5,681,818 * 0.865) = 4,914,773 -> margin_value 767,045."
            - "list 5,681,817: prelim_net = round_half_up(5,681,817 * 0.88) = 4,999,999 -> NONE -> margin_pct = 0.1200 -> invoice_amount = 4,999,999 -> margin_value 681,818."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Northwind Distribution", partner_type: "DISTRIBUTOR" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_vb_id: $.data.id }
          trigger:
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_vb_id}", order_type: "STOCKING", list_amount_cents: 5681818 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_mid_id: $.data.id }
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_vb_id}", order_type: "STOCKING", list_amount_cents: 5681817 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_none_id: $.data.id }
          assert:
            - "OrderInvoice.${inv_mid_id}.volume_band == MID, margin_pct == 0.1350, invoice_amount_cents == 4914773, margin_value_cents == 767045"
            - "OrderInvoice.${inv_none_id}.volume_band == NONE, margin_pct == 0.1200, invoice_amount_cents == 4999999, margin_value_cents == 681818"
            - "the cheaper order therefore invoices for MORE than the dearer one (4,999,999 > 4,914,773), which is the observable signature of the band boundary"
            - "both rows have list_amount_cents - invoice_amount_cents == margin_value_cents exactly (no cent created or destroyed)"

      - name: registered_tier_accrues_no_mdf_budget_at_all
        claim_type: constants_applied
        grounds:
          - calculations.mdf_allocation_sizing
          - validations[priority=50]
          - errors[ERR_MDF_ALLOCATION_INSUFFICIENT]
        distinguishing_aspect: "MDF_ACCRUAL_RATE[REGISTERED] 0.0 and MDF_BASE_GRANT_CENTS[REGISTERED] 0 make an entry-tier allocation exactly 0 despite real invoiced revenue, so the very first claim of 1,000 cents fails the priority-50 budget check."
        test_recipe:
          setup:
            - "One REGISTERED RESELLER partner; one DROP_SHIP order of list 1,000,000 invoiced at 2026-03-01T00:00:00.000Z (invoice_amount 900,000)."
            - "The clock then reads 2026-04-01T00:00:00.000Z and the allocation period is [2026-04-01T00:00:00.000Z, 2026-06-30T23:59:59.999Z], so the 900,000 basis is strictly before period_start."
            - "accrued = round_half_up(900,000 * 0.0) = 0; allocated = MIN(0, 0) + 0 = 0; the annual cap check at priority 51 passes because 0 <= 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
