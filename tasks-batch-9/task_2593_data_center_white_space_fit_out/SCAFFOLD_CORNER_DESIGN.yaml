            - "second_tenant_with_same_code_rejected -> 409, error_id == ERR_DUPLICATE_CODE"
            - "second_busway_same_name_same_pdu_rejected -> 409, error_id == ERR_DUPLICATE_CODE"
            - "second_zone_same_label_same_hall_rejected -> 409, error_id == ERR_DUPLICATE_CODE"
            - "second_cage_same_label_same_hall_rejected -> 409, error_id == ERR_DUPLICATE_CODE"
            - "second_device_same_label_same_cage_rejected -> 409, error_id == ERR_DUPLICATE_CODE"
            - "same_busway_name_under_other_pdu_succeeds -> 201, name == BW-A1, pdu_id == ${pdu_b}, feed_side == B (copied from PDU-B1)"
            - "same_device_label_in_other_cage_succeeds -> 201, label == CAM-1, cage_id == ${cage_2}"
