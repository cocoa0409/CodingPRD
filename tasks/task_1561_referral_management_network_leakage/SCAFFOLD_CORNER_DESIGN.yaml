              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TARGET_MISMATCH, HTTP 422"

      - name: specialty_mismatch_on_assign
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SPECIALTY_MISMATCH]"]
        distinguishing_aspect: "Assigning an ORTHOPEDICS specialist to a CARDIOLOGY referral fails with ERR_SPECIALTY_MISMATCH (422)."
        test_recipe:
          setup: ["plan; S_ORTHO ORTHOPEDICS specialist; provider; patient; CARDIOLOGY referral accepted"]
          setup_api_calls:
            - { call: "POST /insurance-plans", payload: { plan_code: "PPO-1", payer_name: "PayerOne", payer_mix_factor: 1.0 }, as: NetworkAdmin, captures: { plan1: $.data.id } }
