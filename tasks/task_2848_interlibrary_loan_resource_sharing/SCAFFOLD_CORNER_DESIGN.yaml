            - call: "POST /ill/requests"
              payload: { patron_id: "${admity_id}", bib_item_id: "${bib_id}", rota_id: "${rota_id}", service_type: "LOAN", delivery_mode: "PICKUP", needed_by: "2026-08-09T00:00:00Z", max_supply_fee_cents: 5000 }
              as: IllBorrowingStaff
