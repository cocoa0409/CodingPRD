          setup: ["Exhibition OPEN_FOR_ENTRIES configured allowed_media_categories [PAINTING, PHOTOGRAPHY], eligible_state_codes [CA], max_dimension_cm 200, max_weight_kg 40, max_works_per_entry 2, max_entries_per_artist 1; artist a1 in CA with two attached works; artist a2 in NV with one imaged work."]
