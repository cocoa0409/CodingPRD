# =============================================================================
# SCAFFOLD — task_2292_post_election_audit_recount_administration
# §1.0–§1.7. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2292. Post-Election Audit & Recount Administration (state elections division): audit type determination across risk-limiting, fixed-percentage and comparison audits with contest selection, random seed generation, batch selection and ballot retrieval from secure storage, manual tally procedures with bipartisan teams, discrepancy documentation and escalation to full hand count, recount triggers by margin thresholds and candidate-requested recounts with cost deposits, ballot interpretation standards for voter intent with canvassing board adjudication, timeline management against certification deadlines and legal contest windows, chain of custody, observer access and public reporting of results, equipment and process corrective actions from findings

domain_name: post-election-audit-recount
# Flat topology: every entity is addressed at its own root-level collection
# (`/contests/{id}`, `/audit-batches/{id}`, …) and linked by explicit foreign
# keys in request bodies. There is no shared URL prefix segment.
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity sits at its own root collection; parentage is expressed only
  # through FK fields, never through nested URL paths (the two sub-resource
  # GETs exist purely as reverse-reachability read channels for append-only
  # children).

  state_machine_shape: cyclic
  # Audit loops SAMPLING→TALLYING→DISCREPANCY_REVIEW→SAMPLING across rounds;
  # ManualTally loops SUBMITTED→DRAFT (reopen) and SUBMITTED→
  # PENDING_ADJUDICATION→SUBMITTED (board adjudication); BallotBatch loops
  # SEALED→CHECKED_OUT→RESEALED→CHECKED_OUT across retrieval cycles; Recount
  # carries two independent state dimensions on one row (status ×
  # deposit_status); Election is compound (state derived from its contests,
  # audits and recounts).

  relationship_patterns:
    - one_to_many          # Election→Contest, Contest→BallotBatch, Audit→AuditRound
    - self_referential     # AuditRound.previous_round_id -> AuditRound.id
    - cross_aggregate      # ManualTally spans AuditBatch (audit aggregate) and TallyTeam (election aggregate)
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # A user id that sits on the tally team which produced a tally may not cast a
  # canvassing-board vote on that tally's ballot interpretations, and the user
  # who completes a corrective action may not verify it.

  consistency_model: immediate
  # Every cascade (discrepancy roll-up, round/audit escalation, election risk
  # flag, contest re-canvass after recount) is applied inside the triggering
  # request; no read-time reconciliation.

  difficulty_level: expert_plus
  # 14 entities, 70 endpoints, 13 state machines, 9 calculations, 48 ordered
  # validation rules, 80 error codes, 3 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Election
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_code
        type: string
        source: input
        description: State/jurisdiction identifier for the election
        constraints: 1-16 chars, non-empty
      - name: election_name
        type: string
        source: input
        description: Human label of the election
        constraints: 1-120 chars
      - name: election_date
        type: string
        source: input
        description: Calendar date the election was held (YYYY-MM-DD)
        constraints: ISO calendar date, no time component
      - name: certification_deadline_at
        type: datetime
        source: input
        description: Statutory certification deadline (ISO 8601 UTC)
        constraints: must be strictly after election_date T00:00:00Z
      - name: effective_certification_deadline_at
        type: datetime
        source: computed
        description: certification_deadline_at plus the largest extension_days_granted across all Audits of this election's Contests (see calculations.certification_timeline_projection)
      - name: contest_window_ends_at
        type: datetime
        source: computed
        description: effective_certification_deadline_at + LEGAL_CONTEST_WINDOW_DAYS (10) days
      - name: status
        type: enum
        source: computed
        description: Lifecycle of the election; OPEN→CANVASSED is auto-derived from its Contests, CANVASSED→CERTIFIED is operator-triggered
        default: OPEN
        constraints: "OPEN | CANVASSED | CERTIFIED"
      - name: timeline_status
        type: enum
        source: computed
        description: Worst timeline_status across all Audits of this election's Contests; ON_TRACK when no audit exists
        default: ON_TRACK
        constraints: "ON_TRACK | AT_RISK | BREACHED"
      - name: certification_risk_flag
        type: boolean
        source: computed
        description: True while any Audit of this election is in DISCREPANCY_REVIEW or ESCALATED_FULL_HAND_COUNT, or any Audit.timeline_status == BREACHED
        default: false
      - name: open_audit_count
        type: integer
        source: computed
        description: Count of Audits on this election's Contests whose status is not in {COMPLETE, TERMINATED}
        default: 0
      - name: open_recount_count
        type: integer
        source: computed
        description: Count of Recounts on this election's Contests whose status is not in {COMPLETED, WITHDRAWN, DENIED}
        default: 0
      - name: certified_at
        type: datetime
        source: system
        description: Logical-clock instant at which certification succeeded; null until CERTIFIED
        default: null

  - name: Contest
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; the election this contest belongs to
      - name: contest_label
        type: string
        source: input
        description: Short contest code, unique within the election
        constraints: 1-32 chars, unique per election_id
      - name: office_name
        type: string
        source: input
        description: Office or measure title
      - name: contest_type
        type: enum
        source: input
        description: Whether the contest elects a candidate or decides a measure
        constraints: "CANDIDATE | MEASURE"
      - name: candidate_names
        type: array
        source: input
        description: Ordered list of candidate (or YES/NO option) names appearing on the contest
        constraints: 2-10 unique non-empty strings
      - name: ballots_cast
        type: integer
        source: input
        description: Total ballots cast in the contest as reported by tabulation
        constraints: ">= 1"
      - name: cvr_available
        type: boolean
        source: input
        description: Whether cast-vote records exist (required for COMPARISON audits)
        default: false
      - name: reported_votes
        type: object
        source: input
        description: "Map candidate_name -> integer votes; set by POST /contests/{id}/canvass-results and overwritten by recount completion"
        default: null
        constraints: keys must equal candidate_names exactly; values >= 0; sum <= ballots_cast
      - name: winner_name
        type: string
        source: computed
        description: Candidate ranked first by (reported_votes DESC, candidate_names ASC); null before canvass
        default: null
      - name: runner_up_name
        type: string
        source: computed
        description: Candidate ranked second by (reported_votes DESC, candidate_names ASC); null before canvass
        default: null
      - name: margin_votes
        type: integer
        source: computed
        description: reported_votes[winner_name] - reported_votes[runner_up_name]; 0 on a tie
        default: null
      - name: margin_pct
        type: number
        source: computed
        description: margin_votes / ballots_cast * 100, 4 decimal places round_half_up
        default: null
      - name: automatic_recount_required
        type: boolean
        source: computed
        description: True when margin_pct <= AUTOMATIC_RECOUNT_THRESHOLD_PCT (0.5) per calculations.recount_trigger_evaluation
        default: false
      - name: recount_request_deadline_at
        type: datetime
        source: computed
        description: canvassed_at + RECOUNT_REQUEST_WINDOW_DAYS (5) days; candidate-requested recounts are refused at/after this instant
        default: null
      - name: canvassed_at
        type: datetime
        source: system
        description: Logical-clock instant at which canvass results were recorded
        default: null
      - name: status
        type: enum
        source: computed
        description: PENDING_CANVASS until results recorded, CANVASSED after, CERTIFIED when the election certifies
        default: PENDING_CANVASS
        constraints: "PENDING_CANVASS | CANVASSED | CERTIFIED"
      - name: open_recount_count
        type: integer
        source: computed
        description: Count of Recounts on this contest whose status is not in {COMPLETED, WITHDRAWN, DENIED}
        default: 0

  - name: BallotBatch
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; election the batch was cast in
      - name: contest_id
        type: string
        source: input
        description: FK -> Contest.id; tabulation batch belongs to exactly one contest
      - name: batch_label
        type: string
        source: input
        description: Storage label of the batch, unique within the contest and used as the canonical sort key for batch selection
        constraints: 1-32 chars, unique per contest_id
      - name: storage_location_code
        type: string
        source: input
        description: Secure storage location identifier
      - name: ballot_count
        type: integer
        source: input
        description: Number of ballots physically in the batch
        constraints: ">= 1"
      - name: machine_votes
        type: object
        source: input
        description: "Map candidate_name -> machine-tabulated votes for this batch; keys must equal Contest.candidate_names"
        constraints: values >= 0; sum <= ballot_count
      - name: current_seal_number
        type: string
        source: input
        description: Seal number presently on the container
      - name: custody_status
        type: enum
        source: computed
        description: Chain-of-custody position of the physical batch
        default: SEALED
        constraints: "SEALED | CHECKED_OUT | RESEALED | QUARANTINED"
      - name: retrieval_authorized_at
        type: datetime
        source: computed
        description: Logical-clock instant at which an AuditBatch selection authorized retrieval; null means retrieval is not authorized
        default: null
      - name: open_checkout_count
        type: integer
        source: computed
        description: count(CustodyEvent CHECK_OUT) - count(CustodyEvent CHECK_IN) for this batch; invariant 0 or 1
        default: 0
      - name: checkout_cycle_count
        type: integer
        source: computed
        description: Number of completed CHECK_OUT→CHECK_IN cycles
        default: 0
      - name: last_checked_out_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent CHECK_OUT event
        default: null
      - name: last_resealed_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent CHECK_IN (reseal) event
        default: null
      - name: quarantine_reason
        type: string
        source: computed
        description: Reason recorded when the batch was quarantined
        default: null

  - name: CustodyEvent
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted identifier of the append-only event row; declared explicitly because this entity carries no updated_at and no version
      - name: sequence_no
        type: integer
        source: system
        description: Monotonic per-batch append sequence starting at 1; the deterministic sort key for the custody log because a frozen logical clock makes occurred_at values tie
      - name: ballot_batch_id
        type: string
        source: input
        description: FK -> BallotBatch.id; batch whose custody changed
      - name: event_type
        type: enum
        source: computed
        description: Custody action recorded; every entry is appended by a side effect, never by a direct client write
        constraints: "INTAKE | AUTHORIZED | CHECK_OUT | CHECK_IN | QUARANTINE"
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose request produced the event
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of the actor whose request produced the event
      - name: seal_number_before
        type: string
        source: computed
        description: BallotBatch.current_seal_number before the event
        default: null
      - name: seal_number_after
        type: string
        source: computed
        description: BallotBatch.current_seal_number after the event
        default: null
      - name: occurred_at
        type: datetime
        source: system
        description: Logical-clock instant of the event
      - name: note
        type: string
        source: computed
        description: Free-text context copied from the triggering request (reason / reseal note)
        default: null

  - name: Audit
    parent: null
    common_fields: true
    fields:
      - name: contest_id
        type: string
        source: input
        description: FK -> Contest.id; audited contest
      - name: audit_type
        type: enum
        source: input
        description: Audit methodology; drives sample sizing and the discrepancy measure variant
        constraints: "RISK_LIMITING | FIXED_PERCENTAGE | COMPARISON"
      - name: risk_limit_alpha
        type: number
        source: input
        description: Risk limit for RISK_LIMITING and COMPARISON audits; must be one of the three supported values
        default: null
        constraints: "one of 0.10 | 0.05 | 0.01; required for RISK_LIMITING and COMPARISON, must be null for FIXED_PERCENTAGE"
      - name: fixed_percentage_pct
        type: number
        source: input
        description: Percentage of batches to audit for FIXED_PERCENTAGE audits
        default: null
        constraints: "> 0 and <= 100; required for FIXED_PERCENTAGE, must be null otherwise"
      - name: prior_error_rate
        type: number
        source: input
        description: Assumed prior error inflation for COMPARISON sample sizing
        default: 0.10
        constraints: ">= 0 and <= 1"
      - name: measure_variant
        type: enum
        source: computed
        description: NET_MARGIN_SHIFT for RISK_LIMITING and FIXED_PERCENTAGE audits, MAX_RELATIVE_OVERSTATEMENT for COMPARISON audits
        constraints: "NET_MARGIN_SHIFT | MAX_RELATIVE_OVERSTATEMENT"
      - name: random_seed
        type: string
        source: input
        description: Public seed digits recorded at the seed ceremony; parsed as a base-10 integer for batch selection
        default: null
        constraints: exactly 10 characters, digits only
      - name: seed_published_at
        type: datetime
        source: system
        description: Logical-clock instant the seed was published
        default: null
      - name: status
        type: enum
        source: computed
        description: Audit lifecycle; loops SAMPLING→TALLYING→DISCREPANCY_REVIEW→SAMPLING once per escalation round
        default: PLANNED
        constraints: "PLANNED | SEEDED | SAMPLING | TALLYING | DISCREPANCY_REVIEW | ESCALATED_FULL_HAND_COUNT | COMPLETE | TERMINATED"
      - name: escalation_level
        type: integer
        source: computed
        description: Number of discrepancy escalations applied to this audit
        default: 0
      - name: planned_sample_size
        type: integer
        source: computed
        description: Round-1 sample size in batches per calculations.audit_sample_size
        default: null
      - name: sample_size_stale
        type: boolean
        source: computed
        description: True when the contest margin changed after this audit was planned and the recomputed planned_sample_size differs from the value stored at planning time
        default: false
      - name: cumulative_sampled_batches
        type: integer
        source: computed
        description: Count of AuditBatch rows across all non-SUPERSEDED rounds of this audit
        default: 0
      - name: counted_ballots
        type: integer
        source: computed
        description: Sum of BallotBatch.ballot_count over AuditBatches whose ManualTally.status is in {SUBMITTED, CERTIFIED}
        default: 0
      - name: cumulative_net_error_votes
        type: integer
        source: computed
        description: Sum of ManualTally.net_error_votes over tallies with status in {SUBMITTED, CERTIFIED}
        default: 0
      - name: discrepancy_measure
        type: number
        source: computed
        description: Audit-level discrepancy measure per calculations.tally_discrepancy_measure, selected by measure_variant; 4 decimal places round_half_up
        default: 0.0
      - name: projected_completion_at
        type: datetime
        source: computed
        description: Clock now + remaining_work_hours per calculations.certification_timeline_projection
        default: null
      - name: slack_hours
        type: number
        source: computed
        description: Hours between projected_completion_at and Election.certification_deadline_at before any extension, 2 decimals round_half_up, negative when late
        default: null
      - name: extension_days_granted
        type: integer
        source: computed
        description: Deadline extension in whole days granted by the timeline review
        default: 0
      - name: effective_slack_hours
        type: number
        source: computed
        description: Hours between projected_completion_at and effective_certification_deadline_at, 2 decimals round_half_up
        default: null
      - name: effective_certification_deadline_at
        type: datetime
        source: computed
        description: Election.certification_deadline_at + extension_days_granted days
        default: null
      - name: timeline_status
        type: enum
        source: computed
        description: BREACHED when effective_slack_hours < 0, AT_RISK when 0 <= effective_slack_hours <= 72, else ON_TRACK
        default: ON_TRACK
        constraints: "ON_TRACK | AT_RISK | BREACHED"
      - name: public_report_published
        type: boolean
        source: computed
        description: True once the audit is closed or terminated; gates Observer access to the public report
        default: false
      - name: terminated_reason
        type: string
        source: computed
        description: Reason recorded when the audit was terminated
        default: null

  - name: AuditRound
    parent: null
    common_fields: true
    fields:
      - name: audit_id
        type: string
        source: input
        description: FK -> Audit.id; audit this round belongs to
      - name: previous_round_id
        type: string
        source: computed
        description: FK -> AuditRound.id; the round this round escalates from, null for round 1
        default: null
      - name: round_number
        type: integer
        source: computed
        description: 1-based sequence number within the audit
      - name: is_full_hand_count
        type: boolean
        source: input
        description: When true the round samples every remaining unsampled batch of the contest
        default: false
      - name: sample_size_batches
        type: integer
        source: computed
        description: Number of batches drawn in this round per calculations.audit_sample_size
      - name: selection_sequence
        type: array
        source: computed
        description: BallotBatch.batch_label values in draw order per calculations.batch_selection_sequence
      - name: counted_ballots
        type: integer
        source: computed
        description: Sum of AuditBatch.ballot_count for this round whose ManualTally.status is in {SUBMITTED, CERTIFIED}
        default: 0
      - name: discrepancy_count
        type: integer
        source: computed
        description: Count of Discrepancy rows in status {OPEN, DOCUMENTED, ESCALATED, RESOLVED} attached to this round's tallies
        default: 0
      - name: cumulative_net_error_votes
        type: integer
        source: computed
        description: Sum of net_error_votes over this round's tallies with status in {SUBMITTED, CERTIFIED}
        default: 0
      - name: round_measure
        type: number
        source: computed
        description: Round-scoped discrepancy measure per calculations.tally_discrepancy_measure, 4 decimals round_half_up
        default: 0.0
      - name: status
        type: enum
        source: computed
        description: Round lifecycle
        default: SELECTED
        constraints: "SELECTED | TALLYING | REVIEW_REQUIRED | COMPLETE | SUPERSEDED"

  - name: AuditBatch
    parent: null
    common_fields: true
    fields:
      - name: audit_round_id
        type: string
        source: input
        description: FK -> AuditRound.id; round that drew this batch
      - name: ballot_batch_id
        type: string
        source: input
        description: FK -> BallotBatch.id; physical batch drawn
      - name: selection_index
        type: integer
        source: computed
        description: 0-based position of the batch in the round's selection_sequence
      - name: ballot_count
        type: integer
        source: computed
        description: Copy of BallotBatch.ballot_count at selection time
      - name: retrieval_status
        type: enum
        source: computed
        description: Retrieval position of this drawn batch
        default: PENDING_RETRIEVAL
        constraints: "PENDING_RETRIEVAL | RETRIEVED | RETURNED"
      - name: tally_status
        type: enum
        source: computed
        description: Manual tally progress for this drawn batch
        default: NOT_STARTED
        constraints: "NOT_STARTED | IN_PROGRESS | COUNTED | VOIDED"

  - name: TallyTeam
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; election the team serves
      - name: team_label
        type: string
        source: input
        description: Team code, unique within the election
        constraints: 1-32 chars, unique per election_id
      - name: room_code
        type: string
        source: input
        description: Default counting room assigned to the team
      - name: members
        type: array
        source: computed
        description: "Array of objects { user_id, party, seat_role } appended by POST /tally-teams/{id}/members"
        default: []
        constraints: "party in {DEM, REP, UNAFFILIATED}; seat_role in {LEAD, COUNTER, LIAISON}; user_id unique within the team; max 6 members"
      - name: party_counts
        type: object
        source: computed
        description: "Map party -> member count derived from members"
        default: {}
      - name: is_bipartisan
        type: boolean
        source: computed
        description: True when party_counts.DEM >= 1 and party_counts.REP >= 1
        default: false
      - name: status
        type: enum
        source: computed
        description: FORMING until bipartisan, READY once bipartisan, DISBANDED when stood down
        default: FORMING
        constraints: "FORMING | READY | DISBANDED"

  - name: ManualTally
    parent: null
    common_fields: true
    fields:
      - name: audit_batch_id
        type: string
        source: input
        description: FK -> AuditBatch.id; drawn batch being hand counted
      - name: tally_team_id
        type: string
        source: input
        description: FK -> TallyTeam.id; bipartisan team performing the count
      - name: session_start_at
        type: datetime
        source: input
        description: Scheduled start of the counting session (inclusive)
      - name: session_end_at
        type: datetime
        source: input
        description: Scheduled end of the counting session (exclusive)
      - name: room_code
        type: string
        source: input
        description: "Counting room used for the session; when the request omits it the server copies TallyTeam.room_code of the tallying team"
        default: null
      - name: counted_votes
        type: object
        source: input
        description: "Map candidate_name -> hand-counted votes; keys must equal Contest.candidate_names"
        default: null
      - name: ambiguous_ballot_count
        type: integer
        source: input
        description: Ballots set aside for voter-intent adjudication
        default: 0
      - name: no_vote_count
        type: integer
        source: input
        description: Ballots counted as containing no valid vote for this contest
        default: 0
      - name: machine_margin_votes
        type: integer
        source: computed
        description: machine_votes[Contest.winner_name] - machine_votes[Contest.runner_up_name] for this batch
        default: null
      - name: manual_margin_votes
        type: integer
        source: computed
        description: counted_votes[Contest.winner_name] - counted_votes[Contest.runner_up_name]
        default: null
      - name: net_error_votes
        type: integer
        source: computed
        description: machine_margin_votes - manual_margin_votes; positive means the machine overstated the winner's margin
        default: null
      - name: relative_taint
        type: number
        source: computed
        description: net_error_votes * Contest.margin_votes / (2 * AuditBatch.ballot_count), 4 decimals round_half_up
        default: null
      - name: status
        type: enum
        source: computed
        description: Tally lifecycle; loops back to DRAFT on reopen and to SUBMITTED once adjudication finishes
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | PENDING_ADJUDICATION | CERTIFIED | VOIDED"
      - name: reopen_count
        type: integer
        source: computed
        description: Number of times the tally has been reopened from SUBMITTED
        default: 0
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submit
        default: null
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the tally team lead who submitted (opaque team identifier)
        default: null

  - name: Discrepancy
    parent: null
    common_fields: true
    fields:
      - name: manual_tally_id
        type: string
        source: input
        description: FK -> ManualTally.id; tally whose submission produced the finding
      - name: discrepancy_type
        type: enum
        source: computed
        description: OVERSTATEMENT when net_error_votes > 0, UNDERSTATEMENT when < 0, BALLOT_COUNT_MISMATCH when net_error_votes == 0 but hand-counted valid votes differ from machine valid votes
        constraints: "OVERSTATEMENT | UNDERSTATEMENT | BALLOT_COUNT_MISMATCH"
      - name: magnitude_votes
        type: integer
        source: computed
        description: abs(net_error_votes) when non-zero, else abs(sum(counted_votes) - sum(machine_votes))
      - name: relative_taint
        type: number
        source: computed
        description: Copy of ManualTally.relative_taint at documentation time, 4 decimals round_half_up
      - name: status
        type: enum
        source: computed
        description: Finding lifecycle; created OPEN by the tally submission cascade, DOCUMENTED once the canvassing board records the documentation note, VOIDED when the underlying tally is reopened
        default: OPEN
        constraints: "OPEN | DOCUMENTED | ESCALATED | RESOLVED | VOIDED"
      - name: documentation_note
        type: string
        source: computed
        description: Narrative recorded by the canvassing board when the finding is documented
        default: null
      - name: escalation_reason
        type: string
        source: computed
        description: Reason recorded when the finding was escalated to a full hand count
        default: null
      - name: resolution_note
        type: string
        source: computed
        description: Note recorded when the finding was resolved
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of resolution
        default: null

  - name: BallotInterpretation
    parent: null
    common_fields: true
    fields:
      - name: manual_tally_id
        type: string
        source: input
        description: FK -> ManualTally.id; tally that set the ballot aside
      - name: ballot_ref
        type: string
        source: input
        description: Physical ballot reference within the batch, unique per tally
        constraints: 1-32 chars, unique per manual_tally_id
      - name: ambiguity_type
        type: enum
        source: input
        description: Voter-intent standard category invoked
        constraints: "OVERVOTE | STRAY_MARK | WRITE_IN_INTENT | DAMAGED | PARTIAL_MARK"
      - name: proposed_determination
        type: string
        source: input
        description: Candidate name proposed by the tally team, or the literal NO_VOTE
        constraints: must be a Contest.candidate_names member or the literal "NO_VOTE"
      - name: board_votes
        type: array
        source: computed
        description: "Array of objects { member_user_id, party, vote } appended by POST /ballot-interpretations/{id}/votes"
        default: []
        constraints: "party in {DEM, REP, UNAFFILIATED}; vote in {ACCEPT, REJECT, ABSTAIN}; member_user_id unique within the interpretation"
      - name: votes_cast
        type: integer
        source: computed
        description: Length of board_votes
        default: 0
      - name: accept_count
        type: integer
        source: computed
        description: Count of board_votes with vote == ACCEPT
        default: 0
      - name: reject_count
        type: integer
        source: computed
        description: Count of board_votes with vote == REJECT
        default: 0
      - name: quorum_met
        type: boolean
        source: computed
        description: True when votes_cast >= 3 and board_votes contain at least one DEM and at least one REP
        default: false
      - name: final_determination
        type: string
        source: computed
        description: proposed_determination when the board accepts, "NO_VOTE" when it rejects, null while PENDING or DEADLOCKED
        default: null
      - name: status
        type: enum
        source: computed
        description: PENDING until quorum, ADJUDICATED on a majority, DEADLOCKED when accept_count == reject_count at quorum
        default: PENDING
        constraints: "PENDING | ADJUDICATED | DEADLOCKED"

  - name: Recount
    parent: null
    common_fields: true
    fields:
      - name: contest_id
        type: string
        source: input
        description: FK -> Contest.id; contest being recounted
      - name: audit_id
        type: string
        source: input
        description: FK -> Audit.id; audit that escalated into this recount, null for margin-triggered and candidate-requested recounts
        default: null
      - name: trigger_type
        type: enum
        source: input
        description: Legal basis for the recount
        constraints: "AUTOMATIC_MARGIN | CANDIDATE_REQUESTED | AUDIT_ESCALATION"
      - name: requested_by_candidate_name
        type: string
        source: input
        description: Candidate on whose behalf the recount was requested; required for CANDIDATE_REQUESTED
        default: null
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the requester (opaque operator identifier, never an entity id)
      - name: scope
        type: enum
        source: input
        description: Whether the whole contest or a listed set of batches is recounted
        constraints: "FULL_CONTEST | PARTIAL_BATCHES"
      - name: scope_batch_ids
        type: array
        source: input
        description: BallotBatch ids in scope; required and non-empty for PARTIAL_BATCHES, must be null for FULL_CONTEST
        default: null
      - name: ballots_in_scope
        type: integer
        source: computed
        description: Contest.ballots_cast for FULL_CONTEST, else the sum of BallotBatch.ballot_count over scope_batch_ids
      - name: required_deposit_cents
        type: integer
        source: computed
        description: Deposit per calculations.recount_deposit_assessment; 0 for AUTOMATIC_MARGIN and AUDIT_ESCALATION
      - name: deposit_paid_cents
        type: integer
        source: computed
        description: Cents actually received from the requester
        default: 0
      - name: refunded_cents
        type: integer
        source: computed
        description: Cents returned to the requester
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: Cents applied to actual recount cost
        default: 0
      - name: admin_retained_cents
        type: integer
        source: computed
        description: Cents retained as the administrative fee on withdrawal
        default: 0
      - name: actual_cost_cents
        type: integer
        source: computed
        description: Per-batch cost lines plus team labour per calculations.recount_cost_and_refund
        default: 0
      - name: team_hours
        type: number
        source: input
        description: Team hours consumed by the recount, supplied at completion
        default: null
        constraints: ">= 0, at most 2 decimals"
      - name: refund_variant
        type: enum
        source: computed
        description: Which refund algorithm settled the deposit
        default: NONE
        constraints: "NONE | STATUTORY_REFUND | PRORATED_COST_RECOVERY | WITHDRAWAL_RETENTION"
      - name: deposit_status
        type: enum
        source: computed
        description: Deposit dimension, evolving independently of status
        default: PENDING
        constraints: "NOT_REQUIRED | PENDING | HELD | REFUNDED_FULL | PARTIALLY_REFUNDED | FORFEITED"
      - name: status
        type: enum
        source: computed
        description: Workflow dimension, evolving independently of deposit_status
        default: REQUESTED
        constraints: "REQUESTED | DEPOSIT_HELD | IN_PROGRESS | COMPLETED | WITHDRAWN | DENIED"
      - name: final_votes
        type: object
        source: input
        description: "Map candidate_name -> recounted votes within scope, supplied at completion"
        default: null
      - name: final_margin_votes
        type: integer
        source: computed
        description: Contest-level margin after folding final_votes into the contest totals
        default: null
      - name: margin_change_votes
        type: integer
        source: computed
        description: final_margin_votes - Contest.margin_votes measured before this recount completed (signed)
        default: null
      - name: outcome_changed
        type: boolean
        source: computed
        description: True when the post-recount winner differs from Contest.winner_name measured before completion
        default: false
      - name: denial_reason
        type: string
        source: computed
        description: Reason recorded when the request was denied
        default: null

  - name: CorrectiveAction
    parent: null
    common_fields: true
    fields:
      - name: discrepancy_id
        type: string
        source: input
        description: FK -> Discrepancy.id; finding that justified the action
      - name: category
        type: enum
        source: input
        description: Corrective action family
        constraints: "EQUIPMENT | PROCESS | TRAINING"
      - name: description
        type: string
        source: input
        description: What must be corrected
        constraints: 1-500 chars
      - name: due_at
        type: datetime
        source: input
        description: Deadline for completing the action
      - name: status
        type: enum
        source: computed
        description: Action lifecycle; EQUIPMENT actions must reach VERIFIED or CANCELLED before certification
        default: OPEN
        constraints: "OPEN | IN_PROGRESS | COMPLETED | VERIFIED | CANCELLED"
      - name: completed_by_user_id
        type: string
        source: system
        description: X-User-ID that marked the action COMPLETED (opaque operator identifier)
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: X-User-ID that verified the action; must differ from completed_by_user_id
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: Logical-clock instant of completion
        default: null
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant of verification
        default: null

  - name: ObserverCredential
    parent: null
    common_fields: true
    fields:
      - name: election_id
        type: string
        source: input
        description: FK -> Election.id; election the credential grants access to
      - name: organization_name
        type: string
        source: input
        description: Observing organization
      - name: party_affiliation
        type: enum
        source: input
        description: Party or press affiliation of the observer
        constraints: "DEM | REP | UNAFFILIATED | PRESS"
      - name: room_code
        type: string
        source: input
        description: Room the credential admits the observer to
      - name: access_start_at
        type: datetime
        source: input
        description: Start of the access window (inclusive)
      - name: access_end_at
        type: datetime
        source: input
        description: End of the access window (exclusive)
      - name: status
        type: enum
        source: computed
        description: ACTIVE on issue, REVOKED when withdrawn by the elections director
        default: ACTIVE
        constraints: "ACTIVE | REVOKED"
      - name: revoked_reason
        type: string
        source: computed
        description: Reason recorded on revocation
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Election
    initial_state: OPEN
    terminal_states: [CERTIFIED]
    transitions:
      - from: OPEN
        to: CANVASSED
        trigger: "system: last Contest of the election reaches status CANVASSED (cascade from POST /contests/{id}/canvass-results)"
        actor: system
        preconditions:
          - "every Contest with election_id == Election.id has status == CANVASSED"
          - "at least one Contest exists for the election"
        side_effects:
          - "Election.status = CANVASSED"
          - "recompute Election.timeline_status and Election.certification_risk_flag"
          - "increments Election.version by 1"
      - from: CANVASSED
        to: CERTIFIED
        trigger: "POST /elections/{id}/certify"
        actor: ElectionsDirector
        preconditions:
          - "Election.status == CANVASSED"
          - "every Contest of the election has status == CANVASSED"
          - "every Audit whose contest_id belongs to the election has status in {COMPLETE, TERMINATED}"
          - "every Recount whose contest_id belongs to the election has status in {COMPLETED, WITHDRAWN, DENIED}"
          - "no Discrepancy attached to the election's audits has status in {OPEN, ESCALATED}"
          - "every CorrectiveAction with category == EQUIPMENT attached to those discrepancies has status in {VERIFIED, CANCELLED}"
          - "clock now < Election.effective_certification_deadline_at"
        side_effects:
          - "Election.status = CERTIFIED; Election.certified_at = clock now"
          - "every Contest of the election transitions CANVASSED -> CERTIFIED"
          - "Election.certification_risk_flag = false"
          - "Election.contest_window_ends_at = effective_certification_deadline_at + 10 days"
          - "increments Election.version by 1"

  - entity: Contest
    initial_state: PENDING_CANVASS
    terminal_states: [CERTIFIED]
    transitions:
      - from: PENDING_CANVASS
        to: CANVASSED
        trigger: "POST /contests/{id}/canvass-results"
        actor: ElectionsDirector
        preconditions:
          - "Contest.status == PENDING_CANVASS"
          - "Election.status == OPEN"
          - "reported_votes keys equal Contest.candidate_names and sum(reported_votes) <= ballots_cast"
        side_effects:
          - "recompute winner_name, runner_up_name, margin_votes, margin_pct (calculations.contest_margin_canvass)"
          - "recompute automatic_recount_required (calculations.recount_trigger_evaluation)"
          - "Contest.canvassed_at = clock now; recount_request_deadline_at = canvassed_at + 5 days"
          - "Contest.status = CANVASSED; increments Contest.version by 1"
          - "then, if every Contest of the election is CANVASSED, Election OPEN -> CANVASSED"
      - from: CANVASSED
        to: CANVASSED
        trigger: "system: POST /recounts/{id}/complete folds recounted votes back into the contest"
        actor: system
        preconditions:
          - "Recount.status transitions IN_PROGRESS -> COMPLETED"
          - "Contest.status == CANVASSED"
        side_effects:
          - "Contest.reported_votes replaced by the post-recount totals (calculations.recount_cost_and_refund step 2)"
          - "recompute winner_name, runner_up_name, margin_votes, margin_pct, automatic_recount_required"
          - "Contest.open_recount_count decremented by 1; increments Contest.version by 1"
          - "then, every Audit on this contest with status in {PLANNED, SEEDED} recomputes planned_sample_size and sets sample_size_stale = true when the value changed"
        note: "Self-transition: status is unchanged but the derived margin fields and every downstream audit sizing are re-derived."
      - from: CANVASSED
        to: CERTIFIED
        trigger: "system: cascade from POST /elections/{id}/certify"
        actor: system
        preconditions: ["Election.status transitions CANVASSED -> CERTIFIED"]
        side_effects: ["Contest.status = CERTIFIED", "increments Contest.version by 1"]

  - entity: BallotBatch
    initial_state: SEALED
    terminal_states: [QUARANTINED]
    transitions:
      - from: SEALED
        to: CHECKED_OUT
        trigger: "POST /audit-batches/{id}/retrieve"
        actor: CustodyOfficer
        preconditions:
          - "BallotBatch.custody_status in {SEALED, RESEALED}"
          - "BallotBatch.retrieval_authorized_at is not null"
          - "observed_seal_number == BallotBatch.current_seal_number"
          - "expected_ballot_batch_version == BallotBatch.version (concurrency_rules[batch-retrieve-stale-ballot-batch])"
          - "AuditBatch.retrieval_status == PENDING_RETRIEVAL"
        side_effects:
          - "BallotBatch.custody_status = CHECKED_OUT; last_checked_out_at = clock now; open_checkout_count += 1"
          - "append CustodyEvent(event_type = CHECK_OUT, seal_number_before = current_seal_number, seal_number_after = null)"
          - "AuditBatch.retrieval_status = PENDING_RETRIEVAL -> RETRIEVED"
          - "increments BallotBatch.version by 1"
      - from: CHECKED_OUT
        to: RESEALED
        trigger: "POST /audit-batches/{id}/return"
        actor: CustodyOfficer
        preconditions:
          - "BallotBatch.custody_status == CHECKED_OUT"
          - "AuditBatch.retrieval_status == RETRIEVED"
          - "the AuditBatch has no ManualTally in status {DRAFT, PENDING_ADJUDICATION}"
          - "reseal_number != BallotBatch.current_seal_number"
        side_effects:
          - "BallotBatch.current_seal_number = reseal_number; custody_status = RESEALED; last_resealed_at = clock now"
          - "open_checkout_count -= 1; checkout_cycle_count += 1"
          - "append CustodyEvent(event_type = CHECK_IN, seal_number_before = old seal, seal_number_after = reseal_number)"
          - "AuditBatch.retrieval_status = RETRIEVED -> RETURNED"
          - "increments BallotBatch.version by 1"
      - from: RESEALED
        to: CHECKED_OUT
        trigger: "POST /audit-batches/{id}/retrieve for a different AuditBatch drawing the same physical batch"
        actor: CustodyOfficer
        preconditions:
          - "BallotBatch.custody_status == RESEALED"
          - "observed_seal_number == BallotBatch.current_seal_number (the reseal number)"
          - "expected_ballot_batch_version == BallotBatch.version"
        side_effects:
          - "same side effects as SEALED -> CHECKED_OUT (second custody cycle)"
        note: "Cycle: a physical batch may be drawn by more than one audit of the same contest and is retrieved once per drawing."
      - from: SEALED
        to: QUARANTINED
        trigger: "POST /ballot-batches/{id}/quarantine"
        actor: CustodyOfficer
        preconditions: ["BallotBatch.custody_status in {SEALED, RESEALED, CHECKED_OUT}"]
        side_effects:
          - "BallotBatch.custody_status = QUARANTINED; quarantine_reason = reason"
          - "append CustodyEvent(event_type = QUARANTINE)"
          - "every ManualTally in status DRAFT whose AuditBatch references this batch transitions DRAFT -> VOIDED"
          - "then, every AuditBatch referencing this batch with tally_status in {NOT_STARTED, IN_PROGRESS} sets tally_status = VOIDED"
          - "increments BallotBatch.version by 1"
      - from: RESEALED
        to: QUARANTINED
        trigger: "POST /ballot-batches/{id}/quarantine"
        actor: CustodyOfficer
        preconditions: ["BallotBatch.custody_status == RESEALED"]
        side_effects: ["same as SEALED -> QUARANTINED"]
      - from: CHECKED_OUT
        to: QUARANTINED
        trigger: "POST /ballot-batches/{id}/quarantine"
        actor: CustodyOfficer
        preconditions: ["BallotBatch.custody_status == CHECKED_OUT"]
        side_effects:
          - "same as SEALED -> QUARANTINED, plus open_checkout_count is left unchanged (the batch never returns to storage)"

  - entity: Audit
    initial_state: PLANNED
    terminal_states: [COMPLETE, TERMINATED]
    transitions:
      - from: PLANNED
        to: SEEDED
        trigger: "POST /audits/{id}/seed"
        actor: AuditManager
        preconditions:
          - "Audit.status == PLANNED"
          - "random_seed is exactly 10 digits"
          - "Contest.status == CANVASSED"
        side_effects:
          - "Audit.random_seed = random_seed; seed_published_at = clock now; status = SEEDED"
          - "recompute planned_sample_size (calculations.audit_sample_size)"
          - "increments Audit.version by 1"
      - from: SEEDED
        to: SAMPLING
        trigger: "POST /audits/{id}/rounds (round 1)"
        actor: AuditManager
        preconditions:
          - "Audit.status == SEEDED"
          - "expected_audit_version == Audit.version (concurrency_rules[round-create-stale-audit])"
          - "at least one unsampled BallotBatch exists for the contest"
        side_effects:
          - "create AuditRound(round_number = 1, previous_round_id = null, status = SELECTED)"
          - "then, that round creates one AuditBatch per drawn batch (calculations.batch_selection_sequence)"
          - "then, each AuditBatch sets BallotBatch.retrieval_authorized_at = clock now and appends CustodyEvent(event_type = AUTHORIZED)"
          - "Audit.status = SAMPLING; cumulative_sampled_batches recomputed"
          - "increments Audit.version by 1"
      - from: SAMPLING
        to: TALLYING
        trigger: "system: first ManualTally created against any AuditBatch of the current round (POST /manual-tallies)"
        actor: system
        preconditions: ["Audit.status == SAMPLING"]
        side_effects:
          - "Audit.status = TALLYING; current AuditRound SELECTED -> TALLYING"
          - "increments Audit.version by 1"
      - from: TALLYING
        to: DISCREPANCY_REVIEW
        trigger: "system: current AuditRound reaches REVIEW_REQUIRED (cascade from POST /manual-tallies/{id}/submit)"
        actor: system
        preconditions: ["Audit.status == TALLYING", "AuditRound.status transitions TALLYING -> REVIEW_REQUIRED"]
        side_effects:
          - "Audit.status = DISCREPANCY_REVIEW; recompute discrepancy_measure"
          - "then, Election.certification_risk_flag = true"
          - "increments Audit.version by 1"
      - from: DISCREPANCY_REVIEW
        to: TALLYING
        trigger: "system: current AuditRound falls back to TALLYING (cascade from POST /manual-tallies/{id}/reopen)"
        actor: system
        preconditions: ["Audit.status == DISCREPANCY_REVIEW", "AuditRound.status transitions REVIEW_REQUIRED -> TALLYING"]
        side_effects:
          - "Audit.status = TALLYING; recompute cumulative_net_error_votes, counted_ballots, discrepancy_measure"
          - "then, Election.certification_risk_flag recomputed (false when no other audit is under review and no audit is BREACHED)"
          - "increments Audit.version by 1"
      - from: DISCREPANCY_REVIEW
        to: SAMPLING
        trigger: "POST /audits/{id}/rounds (escalation round with is_full_hand_count = false)"
        actor: AuditManager
        preconditions:
          - "Audit.status == DISCREPANCY_REVIEW"
          - "expected_audit_version == Audit.version"
          - "at least one unsampled BallotBatch exists for the contest"
        side_effects:
          - "previous AuditRound REVIEW_REQUIRED -> SUPERSEDED"
          - "create AuditRound(round_number = previous + 1, previous_round_id = previous round id)"
          - "then, the new round creates AuditBatch rows and authorizes retrieval as in SEEDED -> SAMPLING"
          - "Audit.status = SAMPLING; increments Audit.version by 1"
        note: "Cycle SAMPLING -> TALLYING -> DISCREPANCY_REVIEW -> SAMPLING, once per escalation round."
      - from: DISCREPANCY_REVIEW
        to: ESCALATED_FULL_HAND_COUNT
        trigger: "system: cascade from POST /discrepancies/{id}/escalate"
        actor: system
        preconditions:
          - "Audit.status in {TALLYING, DISCREPANCY_REVIEW}"
          - "Discrepancy.status transitions DOCUMENTED -> ESCALATED"
          - "at least one unsampled BallotBatch exists for the contest"
        side_effects:
          - "Audit.status = ESCALATED_FULL_HAND_COUNT; escalation_level += 1"
          - "then, create AuditRound(is_full_hand_count = true, previous_round_id = current round) covering every unsampled batch"
          - "then, that round creates one AuditBatch per unsampled batch, each authorizing retrieval and appending CustodyEvent(AUTHORIZED)"
          - "previous AuditRound -> SUPERSEDED"
          - "recompute projected_completion_at, slack_hours, effective_slack_hours, timeline_status"
          - "then, Election.certification_risk_flag = true and Election.timeline_status recomputed"
          - "increments Audit.version by 1"
      - from: TALLYING
        to: ESCALATED_FULL_HAND_COUNT
        trigger: "system: cascade from POST /discrepancies/{id}/escalate while the round measure is still below threshold"
        actor: system
        preconditions: ["Audit.status == TALLYING", "Discrepancy.status transitions DOCUMENTED -> ESCALATED"]
        side_effects: ["same as DISCREPANCY_REVIEW -> ESCALATED_FULL_HAND_COUNT"]
      - from: TALLYING
        to: COMPLETE
        trigger: "POST /audits/{id}/close"
        actor: AuditManager
        preconditions:
          - "Audit.status in {TALLYING, DISCREPANCY_REVIEW, ESCALATED_FULL_HAND_COUNT}"
          - "every AuditBatch of every non-SUPERSEDED round has tally_status == COUNTED"
          - "every BallotBatch drawn by those AuditBatches has custody_status == RESEALED"
          - "no BallotInterpretation of those tallies has status in {PENDING, DEADLOCKED}"
          - "no Discrepancy of those tallies has status in {OPEN, ESCALATED}"
        side_effects:
          - "Audit.status = COMPLETE; public_report_published = true"
          - "every non-SUPERSEDED AuditRound -> COMPLETE; every ManualTally SUBMITTED -> CERTIFIED"
          - "recompute discrepancy_measure, counted_ballots, timeline fields"
          - "then, Election.open_audit_count decremented and Election.certification_risk_flag recomputed"
          - "increments Audit.version by 1"
      - from: DISCREPANCY_REVIEW
        to: COMPLETE
        trigger: "POST /audits/{id}/close"
        actor: AuditManager
        preconditions: ["same as TALLYING -> COMPLETE"]
        side_effects: ["same as TALLYING -> COMPLETE"]
      - from: ESCALATED_FULL_HAND_COUNT
        to: COMPLETE
        trigger: "POST /audits/{id}/close"
        actor: AuditManager
        preconditions: ["same as TALLYING -> COMPLETE"]
        side_effects: ["same as TALLYING -> COMPLETE"]
      - from: PLANNED
        to: TERMINATED
        trigger: "POST /audits/{id}/terminate, or system cascade from POST /recounts/{id}/complete with scope == FULL_CONTEST"
        actor: ElectionsDirector | system
        preconditions:
          - "Audit.status not in {COMPLETE, TERMINATED}"
          - "no ManualTally of this audit is in status {DRAFT, PENDING_ADJUDICATION}"
        side_effects:
          - "Audit.status = TERMINATED; terminated_reason recorded; public_report_published = true"
          - "every non-terminal AuditRound -> SUPERSEDED"
          - "revokes retrieval authorization: for every AuditBatch of this audit still in retrieval_status PENDING_RETRIEVAL, BallotBatch.retrieval_authorized_at = null, unless some Audit outside {COMPLETE, TERMINATED} still holds a PENDING_RETRIEVAL AuditBatch on the same physical batch"
          - "then, Election.open_audit_count decremented and certification_risk_flag recomputed"
          - "increments Audit.version by 1"
      - from: SEEDED
        to: TERMINATED
        trigger: "POST /audits/{id}/terminate, or system cascade from POST /recounts/{id}/complete with scope == FULL_CONTEST"
        actor: ElectionsDirector | system
        preconditions: ["same as PLANNED -> TERMINATED"]
        side_effects: ["same as PLANNED -> TERMINATED"]
      - from: SAMPLING
        to: TERMINATED
        trigger: "POST /audits/{id}/terminate, or system cascade from POST /recounts/{id}/complete with scope == FULL_CONTEST"
        actor: ElectionsDirector | system
        preconditions: ["same as PLANNED -> TERMINATED"]
        side_effects: ["same as PLANNED -> TERMINATED"]
      - from: TALLYING
        to: TERMINATED
        trigger: "POST /audits/{id}/terminate, or system cascade from POST /recounts/{id}/complete with scope == FULL_CONTEST"
        actor: ElectionsDirector | system
        preconditions: ["same as PLANNED -> TERMINATED"]
        side_effects: ["same as PLANNED -> TERMINATED"]
      - from: DISCREPANCY_REVIEW
        to: TERMINATED
        trigger: "POST /audits/{id}/terminate, or system cascade from POST /recounts/{id}/complete with scope == FULL_CONTEST"
        actor: ElectionsDirector | system
        preconditions: ["same as PLANNED -> TERMINATED"]
        side_effects: ["same as PLANNED -> TERMINATED"]
      - from: ESCALATED_FULL_HAND_COUNT
        to: TERMINATED
        trigger: "POST /audits/{id}/terminate, or system cascade from POST /recounts/{id}/complete with scope == FULL_CONTEST"
        actor: ElectionsDirector | system
        preconditions: ["same as PLANNED -> TERMINATED"]
        side_effects: ["same as PLANNED -> TERMINATED"]

  - entity: AuditRound
    initial_state: SELECTED
    terminal_states: [COMPLETE, SUPERSEDED]
    transitions:
      - from: SELECTED
        to: TALLYING
        trigger: "system: first ManualTally created against one of the round's AuditBatches"
        actor: system
        preconditions: ["AuditRound.status == SELECTED"]
        side_effects: ["AuditRound.status = TALLYING", "increments AuditRound.version by 1"]
      - from: TALLYING
        to: REVIEW_REQUIRED
        trigger: "system: round_measure reaches the escalation threshold after a Discrepancy is recorded (cascade from POST /manual-tallies/{id}/submit)"
        actor: system
        preconditions:
          - "AuditRound.status == TALLYING"
          - "a Discrepancy row was just created for one of the round's tallies"
          - "round_measure >= NET_SHIFT_ESCALATION_THRESHOLD (0.0050) for NET_MARGIN_SHIFT audits, or >= MACRO_ESCALATION_THRESHOLD (1.0000) for MAX_RELATIVE_OVERSTATEMENT audits"
        side_effects:
          - "AuditRound.status = REVIEW_REQUIRED"
          - "then, Audit TALLYING -> DISCREPANCY_REVIEW"
          - "increments AuditRound.version by 1"
      - from: REVIEW_REQUIRED
        to: TALLYING
        trigger: "system: round_measure falls back below threshold after tally counters are reversed (cascade from POST /manual-tallies/{id}/reopen)"
        actor: system
        preconditions: ["AuditRound.status == REVIEW_REQUIRED", "recomputed round_measure < the applicable escalation threshold"]
        side_effects:
          - "AuditRound.status = TALLYING; discrepancy_count, cumulative_net_error_votes, counted_ballots recomputed"
          - "then, Audit DISCREPANCY_REVIEW -> TALLYING"
          - "increments AuditRound.version by 1"
      - from: SELECTED
        to: SUPERSEDED
        trigger: "system: cascade from POST /audits/{id}/terminate (a round whose batches were never tallied)"
        actor: system
        preconditions: ["the owning Audit transitions to TERMINATED"]
        side_effects: ["AuditRound.status = SUPERSEDED", "increments AuditRound.version by 1"]
      - from: TALLYING
        to: SUPERSEDED
        trigger: "system: a later round is created for the same audit, or cascade from POST /audits/{id}/terminate"
        actor: system
        preconditions: ["a new AuditRound with previous_round_id == this round is created, or the owning Audit transitions to TERMINATED"]
        side_effects: ["AuditRound.status = SUPERSEDED", "increments AuditRound.version by 1"]
      - from: REVIEW_REQUIRED
        to: SUPERSEDED
        trigger: "system: a later round is created for the same audit, or cascade from POST /audits/{id}/terminate"
        actor: system
        preconditions: ["a new AuditRound with previous_round_id == this round is created, or the owning Audit transitions to TERMINATED"]
        side_effects: ["AuditRound.status = SUPERSEDED", "increments AuditRound.version by 1"]
      - from: TALLYING
        to: COMPLETE
        trigger: "system: cascade from POST /audits/{id}/close"
        actor: system
        preconditions: ["Audit transitions to COMPLETE"]
        side_effects: ["AuditRound.status = COMPLETE", "increments AuditRound.version by 1"]
      - from: REVIEW_REQUIRED
        to: COMPLETE
        trigger: "system: cascade from POST /audits/{id}/close"
        actor: system
        preconditions: ["Audit transitions to COMPLETE"]
        side_effects: ["AuditRound.status = COMPLETE", "increments AuditRound.version by 1"]

  - entity: AuditBatch
    initial_state: PENDING_RETRIEVAL
    terminal_states: [RETURNED]
    transitions:
      - from: PENDING_RETRIEVAL
        to: RETRIEVED
        trigger: "POST /audit-batches/{id}/retrieve"
        actor: CustodyOfficer
        preconditions:
          - "AuditBatch.retrieval_status == PENDING_RETRIEVAL"
          - "BallotBatch custody preconditions of BallotBatch SEALED/RESEALED -> CHECKED_OUT hold"
        side_effects:
          - "AuditBatch.retrieval_status = RETRIEVED"
          - "increments AuditBatch.version by 1"
      - from: RETRIEVED
        to: RETURNED
        trigger: "POST /audit-batches/{id}/return"
        actor: CustodyOfficer
        preconditions:
          - "AuditBatch.retrieval_status == RETRIEVED"
          - "AuditBatch.tally_status in {COUNTED, VOIDED, NOT_STARTED}"
        side_effects:
          - "AuditBatch.retrieval_status = RETURNED"
          - "increments AuditBatch.version by 1"
        note: "tally_status is a second, independent dimension on the same row driven by ManualTally transitions: NOT_STARTED -> IN_PROGRESS on tally create, IN_PROGRESS -> COUNTED on submit, COUNTED -> IN_PROGRESS on reopen, any -> VOIDED on batch quarantine."

  - entity: TallyTeam
    initial_state: FORMING
    terminal_states: [DISBANDED]
    transitions:
      - from: FORMING
        to: READY
        trigger: "system: POST /tally-teams/{id}/members makes the team bipartisan"
        actor: system
        preconditions: ["party_counts.DEM >= 1 and party_counts.REP >= 1"]
        side_effects: ["TallyTeam.is_bipartisan = true; status = READY", "increments TallyTeam.version by 1"]
      - from: READY
        to: FORMING
        trigger: "POST /tally-teams/{id}/members with a replacement roster that is no longer bipartisan"
        actor: ElectionsDirector
        preconditions: ["TallyTeam.status == READY", "the supplied roster has party_counts.DEM == 0 or party_counts.REP == 0"]
        side_effects:
          - "members and party_counts replaced by the supplied roster; is_bipartisan = false; status = FORMING"
          - "live ManualTally rows of the team are NOT touched: they stay DRAFT and are refused at submit by validations[priority=24]"
          - "increments TallyTeam.version by 1"
      - from: READY
        to: DISBANDED
        trigger: "POST /tally-teams/{id}/disband"
        actor: ElectionsDirector
        preconditions: ["no ManualTally with tally_team_id == this team has status in {DRAFT, PENDING_ADJUDICATION}"]
        side_effects: ["TallyTeam.status = DISBANDED", "increments TallyTeam.version by 1"]
      - from: FORMING
        to: DISBANDED
        trigger: "POST /tally-teams/{id}/disband"
        actor: ElectionsDirector
        preconditions: ["no ManualTally references the team"]
        side_effects: ["TallyTeam.status = DISBANDED", "increments TallyTeam.version by 1"]

  - entity: ManualTally
    initial_state: DRAFT
    terminal_states: [CERTIFIED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /manual-tallies/{id}/submit"
        actor: TallyTeamLead
        preconditions:
          - "ManualTally.status == DRAFT and counted_votes is not null"
          - "sum(counted_votes) + ambiguous_ballot_count + no_vote_count == AuditBatch.ballot_count"
          - "BallotBatch.custody_status == CHECKED_OUT"
          - "TallyTeam.is_bipartisan == true and TallyTeam.status == READY"
        side_effects:
          - "compute machine_margin_votes, manual_margin_votes, net_error_votes, relative_taint"
          - "ManualTally.status = SUBMITTED; submitted_at = clock now; submitted_by_user_id = X-User-ID"
          - "AuditBatch.tally_status = IN_PROGRESS -> COUNTED"
          - "then, when net_error_votes != 0 or sum(counted_votes) != sum(machine_votes), create Discrepancy(status = OPEN, type and magnitude per §1.1)"
          - "then, that Discrepancy increments AuditRound.discrepancy_count, adds net_error_votes to AuditRound.cumulative_net_error_votes, adds ballot_count to AuditRound.counted_ballots and re-derives round_measure"
          - "then, when round_measure reaches the escalation threshold, AuditRound TALLYING -> REVIEW_REQUIRED"
          - "then, that round transition drives Audit TALLYING -> DISCREPANCY_REVIEW and Audit.discrepancy_measure/timeline recompute"
          - "then, that audit transition sets Election.certification_risk_flag = true"
          - "increments ManualTally.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /manual-tallies/{id}/reopen"
        actor: TallyTeamLead
        preconditions:
          - "ManualTally.status == SUBMITTED"
          - "reopen_count < MAX_TALLY_REOPENS (2)"
          - "Audit.status not in {COMPLETE, TERMINATED}"
          - "no Discrepancy of this tally has status in {ESCALATED, RESOLVED}"
        side_effects:
          - "ManualTally.status = DRAFT; reopen_count += 1; net_error_votes/relative_taint reset to null"
          - "AuditBatch.tally_status = COUNTED -> IN_PROGRESS"
          - "then, every Discrepancy of this tally in status {OPEN, DOCUMENTED} -> VOIDED"
          - "then, each voided Discrepancy decrements AuditRound.discrepancy_count, subtracts the tally's net_error_votes from AuditRound.cumulative_net_error_votes, subtracts ballot_count from AuditRound.counted_ballots and re-derives round_measure"
          - "then, when round_measure drops below threshold, AuditRound REVIEW_REQUIRED -> TALLYING, which drives Audit DISCREPANCY_REVIEW -> TALLYING and Election.certification_risk_flag recompute"
          - "increments ManualTally.version by 1"
        note: "Cycle DRAFT -> SUBMITTED -> DRAFT; the reverse leg is the compensating action for the submit cascade and must leave the audit error ledger at its pre-submit values."
      - from: SUBMITTED
        to: PENDING_ADJUDICATION
        trigger: "POST /ballot-interpretations (first PENDING interpretation on a submitted tally)"
        actor: TallyTeamLead
        preconditions:
          - "ManualTally.status == SUBMITTED"
          - "ManualTally.ambiguous_ballot_count > count of BallotInterpretation rows already attached with status == PENDING"
        side_effects:
          - "ManualTally.status = PENDING_ADJUDICATION"
          - "increments ManualTally.version by 1"
      - from: PENDING_ADJUDICATION
        to: SUBMITTED
        trigger: "system: last PENDING BallotInterpretation of the tally reaches ADJUDICATED or DEADLOCKED (cascade from POST /ballot-interpretations/{id}/votes)"
        actor: system
        preconditions: ["no BallotInterpretation of this tally has status == PENDING"]
        side_effects:
          - "ManualTally.status = SUBMITTED"
          - "recompute manual_margin_votes, net_error_votes, relative_taint from the adjudicated counts"
          - "then, the tally's Discrepancy is created, updated or voided to match the recomputed net_error_votes, which re-derives AuditRound counters and the Audit measure"
          - "increments ManualTally.version by 1"
        note: "Cycle SUBMITTED -> PENDING_ADJUDICATION -> SUBMITTED, once per adjudication batch."
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "system: cascade from POST /audits/{id}/close"
        actor: system
        preconditions: ["Audit transitions to COMPLETE"]
        side_effects: ["ManualTally.status = CERTIFIED", "increments ManualTally.version by 1"]
      - from: DRAFT
        to: VOIDED
        trigger: "system: cascade from POST /ballot-batches/{id}/quarantine"
        actor: system
        preconditions: ["BallotBatch transitions to QUARANTINED", "ManualTally.status == DRAFT"]
        side_effects:
          - "ManualTally.status = VOIDED"
          - "then, AuditBatch.tally_status = VOIDED"
          - "increments ManualTally.version by 1"

  - entity: Discrepancy
    initial_state: OPEN
    terminal_states: [RESOLVED, VOIDED]
    transitions:
      - from: OPEN
        to: DOCUMENTED
        trigger: "POST /discrepancies/{id}/document"
        actor: CanvassingBoardMember
        preconditions: ["Discrepancy.status == OPEN", "Audit.status not in {COMPLETE, TERMINATED}"]
        side_effects: ["Discrepancy.status = DOCUMENTED; documentation_note recorded", "increments Discrepancy.version by 1"]
      - from: DOCUMENTED
        to: ESCALATED
        trigger: "POST /discrepancies/{id}/escalate"
        actor: CanvassingBoardMember
        preconditions:
          - "Discrepancy.status == DOCUMENTED"
          - "Audit.status in {TALLYING, DISCREPANCY_REVIEW}"
          - "at least one unsampled BallotBatch exists for the contest"
        side_effects:
          - "Discrepancy.status = ESCALATED; escalation_reason recorded"
          - "then, Audit -> ESCALATED_FULL_HAND_COUNT with escalation_level += 1"
          - "then, that audit transition creates the full-hand-count AuditRound covering every unsampled batch"
          - "then, that round creates one AuditBatch per unsampled batch, each setting BallotBatch.retrieval_authorized_at and appending CustodyEvent(AUTHORIZED)"
          - "increments Discrepancy.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /discrepancies/{id}/resolve"
        actor: CanvassingBoardMember
        preconditions:
          - "Discrepancy.status in {DOCUMENTED, ESCALATED}"
          - "every CorrectiveAction of this discrepancy with category == EQUIPMENT has status in {VERIFIED, CANCELLED}"
        side_effects:
          - "Discrepancy.status = RESOLVED; resolution_note recorded; resolved_at = clock now"
          - "increments Discrepancy.version by 1"
      - from: DOCUMENTED
        to: RESOLVED
        trigger: "POST /discrepancies/{id}/resolve"
        actor: CanvassingBoardMember
        preconditions: ["same as ESCALATED -> RESOLVED"]
        side_effects: ["same as ESCALATED -> RESOLVED"]
      - from: OPEN
        to: VOIDED
        trigger: "system: cascade from POST /manual-tallies/{id}/reopen"
        actor: system
        preconditions: ["ManualTally transitions SUBMITTED -> DRAFT", "Discrepancy.status in {OPEN, DOCUMENTED}"]
        side_effects:
          - "Discrepancy.status = VOIDED"
          - "then, AuditRound counters are reversed as described in ManualTally SUBMITTED -> DRAFT"
          - "increments Discrepancy.version by 1"
      - from: DOCUMENTED
        to: VOIDED
        trigger: "system: cascade from POST /manual-tallies/{id}/reopen"
        actor: system
        preconditions: ["ManualTally transitions SUBMITTED -> DRAFT", "Discrepancy.status in {OPEN, DOCUMENTED}"]
        side_effects: ["same as OPEN -> VOIDED"]

  - entity: BallotInterpretation
    initial_state: PENDING
    terminal_states: [ADJUDICATED, DEADLOCKED]
    transitions:
      - from: PENDING
        to: ADJUDICATED
        trigger: "POST /ballot-interpretations/{id}/votes (the vote that meets quorum with a majority)"
        actor: CanvassingBoardMember
        preconditions:
          - "BallotInterpretation.status == PENDING"
          - "quorum_met becomes true (votes_cast >= 3 with at least one DEM and one REP vote)"
          - "accept_count != reject_count"
          - "voter X-User-ID is not a member of the tally's TallyTeam"
        side_effects:
          - "final_determination = proposed_determination when accept_count > reject_count, else \"NO_VOTE\"; status = ADJUDICATED"
          - "then, ManualTally.ambiguous_ballot_count -= 1 and either counted_votes[final_determination] += 1 or no_vote_count += 1"
          - "then, ManualTally recomputes manual_margin_votes/net_error_votes/relative_taint, which re-derives its Discrepancy and the AuditRound and Audit measures"
          - "then, when no PENDING interpretation remains, ManualTally PENDING_ADJUDICATION -> SUBMITTED"
          - "increments BallotInterpretation.version by 1"
      - from: PENDING
        to: DEADLOCKED
        trigger: "POST /ballot-interpretations/{id}/votes (the vote that meets quorum with an even split)"
        actor: CanvassingBoardMember
        preconditions:
          - "BallotInterpretation.status == PENDING"
          - "quorum_met becomes true and accept_count == reject_count"
        side_effects:
          - "status = DEADLOCKED; final_determination stays null; the ballot remains in ManualTally.ambiguous_ballot_count"
          - "then, when no PENDING interpretation remains, ManualTally PENDING_ADJUDICATION -> SUBMITTED"
          - "increments BallotInterpretation.version by 1"
        note: "A DEADLOCKED interpretation blocks POST /audits/{id}/close until the canvassing board records additional votes on a fresh interpretation for the same ballot_ref suffix."

  - entity: Recount
    initial_state: REQUESTED
    terminal_states: [COMPLETED, WITHDRAWN, DENIED]
    transitions:
      - from: REQUESTED
        to: DEPOSIT_HELD
        trigger: "POST /recounts/{id}/deposit"
        actor: CandidateRepresentative
        preconditions:
          - "Recount.status == REQUESTED and deposit_status == PENDING"
          - "X-User-ID == Recount.requested_by_user_id"
          - "amount_cents == required_deposit_cents"
        side_effects:
          - "deposit_paid_cents = amount_cents; deposit_status = PENDING -> HELD; status = DEPOSIT_HELD"
          - "increments Recount.version by 1"
      - from: DEPOSIT_HELD
        to: IN_PROGRESS
        trigger: "POST /recounts/{id}/start"
        actor: ElectionsDirector
        preconditions:
          - "Recount.status == DEPOSIT_HELD, or status == REQUESTED with deposit_status == NOT_REQUIRED"
          - "Election.status == CANVASSED"
          - "no Audit on the contest has status outside {COMPLETE, TERMINATED}"
        side_effects: ["Recount.status = IN_PROGRESS", "increments Recount.version by 1"]
      - from: REQUESTED
        to: IN_PROGRESS
        trigger: "POST /recounts/{id}/start (automatic or audit-escalated recount with no deposit)"
        actor: ElectionsDirector
        preconditions: ["Recount.status == REQUESTED and deposit_status == NOT_REQUIRED", "Election.status == CANVASSED", "no Audit on the contest has status outside {COMPLETE, TERMINATED}"]
        side_effects: ["Recount.status = IN_PROGRESS", "increments Recount.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /recounts/{id}/complete"
        actor: ElectionsDirector
        preconditions:
          - "Recount.status == IN_PROGRESS"
          - "final_votes keys equal Contest.candidate_names"
          - "sum(final_votes) <= ballots_in_scope"
        side_effects:
          - "compute actual_cost_cents, refund_variant, refunded_cents, forfeited_cents (calculations.recount_cost_and_refund)"
          - "deposit_status = HELD -> REFUNDED_FULL | PARTIALLY_REFUNDED | FORFEITED (NOT_REQUIRED is left unchanged)"
          - "Recount.status = COMPLETED"
          - "then, Contest CANVASSED -> CANVASSED re-derives reported_votes, margin fields and automatic_recount_required"
          - "then, every Audit on the contest with status in {PLANNED, SEEDED} recomputes planned_sample_size and flags sample_size_stale; when scope == FULL_CONTEST every non-terminal Audit -> TERMINATED"
          - "then, Election.open_recount_count and certification_risk_flag recomputed"
          - "increments Recount.version by 1"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /recounts/{id}/withdraw"
        actor: CandidateRepresentative
        preconditions:
          - "Recount.status in {REQUESTED, DEPOSIT_HELD}"
          - "X-User-ID == Recount.requested_by_user_id"
        side_effects:
          - "when deposit_status == HELD: admin_retained_cents = round_half_up(deposit_paid_cents * 0.25), refunded_cents = deposit_paid_cents - admin_retained_cents, deposit_status = PARTIALLY_REFUNDED, refund_variant = WITHDRAWAL_RETENTION"
          - "when deposit_status == PENDING: nothing is charged and deposit_status stays PENDING"
          - "Recount.status = WITHDRAWN; Contest.open_recount_count -= 1"
          - "increments Recount.version by 1"
      - from: DEPOSIT_HELD
        to: WITHDRAWN
        trigger: "POST /recounts/{id}/withdraw"
        actor: CandidateRepresentative
        preconditions: ["same as REQUESTED -> WITHDRAWN"]
        side_effects: ["same as REQUESTED -> WITHDRAWN"]
        note: "Compensating leg of the deposit ledger: deposit_paid_cents == refunded_cents + forfeited_cents + admin_retained_cents + (deposit_status == HELD ? deposit_paid_cents : 0) must hold after the transition."
      - from: REQUESTED
        to: DENIED
        trigger: "POST /recounts/{id}/deny"
        actor: ElectionsDirector
        preconditions: ["Recount.status in {REQUESTED, DEPOSIT_HELD}"]
        side_effects:
          - "when deposit_status == HELD: refunded_cents = deposit_paid_cents, deposit_status = REFUNDED_FULL, refund_variant = STATUTORY_REFUND"
          - "Recount.status = DENIED; denial_reason recorded; Contest.open_recount_count -= 1"
          - "increments Recount.version by 1"
      - from: DEPOSIT_HELD
        to: DENIED
        trigger: "POST /recounts/{id}/deny"
        actor: ElectionsDirector
        preconditions: ["same as REQUESTED -> DENIED"]
        side_effects: ["same as REQUESTED -> DENIED"]
    note: "Two independent state dimensions live on one Recount row: the workflow dimension (status) and the money dimension (deposit_status). deposit_status advances PENDING -> HELD on POST /recounts/{id}/deposit without moving status past DEPOSIT_HELD, and HELD -> REFUNDED_FULL | PARTIALLY_REFUNDED | FORFEITED on completion, denial or withdrawal; NOT_REQUIRED is the initial money state for AUTOMATIC_MARGIN and AUDIT_ESCALATION recounts and never changes."

  - entity: CorrectiveAction
    initial_state: OPEN
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /corrective-actions/{id}/transition with to_status = IN_PROGRESS"
        actor: CanvassingBoardMember
        preconditions: ["CorrectiveAction.status == OPEN"]
        side_effects: ["status = IN_PROGRESS", "increments CorrectiveAction.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /corrective-actions/{id}/transition with to_status = COMPLETED"
        actor: CanvassingBoardMember
        preconditions: ["CorrectiveAction.status == IN_PROGRESS"]
        side_effects:
          - "status = COMPLETED; completed_by_user_id = X-User-ID; completed_at = clock now"
          - "increments CorrectiveAction.version by 1"
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /corrective-actions/{id}/transition with to_status = VERIFIED"
        actor: CanvassingBoardMember
        preconditions:
          - "CorrectiveAction.status == COMPLETED"
          - "X-User-ID != CorrectiveAction.completed_by_user_id (segregation of duties)"
        side_effects:
          - "status = VERIFIED; verified_by_user_id = X-User-ID; verified_at = clock now"
          - "increments CorrectiveAction.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /corrective-actions/{id}/transition with to_status = CANCELLED"
        actor: CanvassingBoardMember
        preconditions: ["CorrectiveAction.status in {OPEN, IN_PROGRESS}"]
        side_effects: ["status = CANCELLED", "increments CorrectiveAction.version by 1"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /corrective-actions/{id}/transition with to_status = CANCELLED"
        actor: CanvassingBoardMember
        preconditions: ["CorrectiveAction.status in {OPEN, IN_PROGRESS}"]
        side_effects: ["status = CANCELLED", "increments CorrectiveAction.version by 1"]

  - entity: ObserverCredential
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /observer-credentials/{id}/revoke"
        actor: ElectionsDirector
        preconditions: ["ObserverCredential.status == ACTIVE"]
        side_effects:
          - "status = REVOKED; revoked_reason recorded"
          - "the room-capacity slot held by this credential is released for the overlapping window"
          - "increments ObserverCredential.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: recount-create-stale-contest
    parent_entity: Contest
    write_endpoint: "POST /recounts"
    occ_field: "expected_contest_version"
    description: |
      Creating a Recount against a Contest whose version has advanced since the
      client last observed it is rejected. A contest legitimately supports more
      than one recount as long as the batch scopes do not overlap, so the
      request is otherwise valid; the stale version means the requester priced
      the deposit and judged the margin from superseded canvass totals (an
      earlier recount completion re-derived reported_votes and margin_votes).
    error_id: ERR_STALE_CONTEST_VERSION
    http_status: 412

  - rule_id: round-create-stale-audit
    parent_entity: Audit
    write_endpoint: "POST /audits/{id}/rounds"
    occ_field: "expected_audit_version"
    description: |
      Creating an AuditRound against an Audit whose version has advanced since
      the client last observed it is rejected. Rounds legitimately repeat — each
      escalation round supersedes the previous one — so a fresh round request is
      valid on its own; the stale version means the audit has already advanced
      (a round was created, a discrepancy escalated, or a timeline review
      granted an extension) and the sample the client is asking for was sized
      against a superseded audit state.
    error_id: ERR_STALE_AUDIT_VERSION
    http_status: 412

  - rule_id: batch-retrieve-stale-ballot-batch
    parent_entity: BallotBatch
    write_endpoint: "POST /audit-batches/{id}/retrieve"
    occ_field: "expected_ballot_batch_version"
    description: |
      Retrieving a drawn batch from secure storage against a BallotBatch whose
      version has advanced since the client last observed it is rejected. A
      physical batch is legitimately retrieved more than once (once per audit
      that draws it, after each reseal), so a repeat retrieval is valid on its
      own; the stale version means the custody record moved underneath the
      officer — the seal number, custody_status or authorization changed — and
      the observed seal the officer is attesting to was read from a superseded
      custody record.
    error_id: ERR_STALE_BALLOT_BATCH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contest_margin_canvass
    description: |
      Derives the winner, runner-up and margin of a contest from the canvassed
      vote totals. Re-runs whenever a recount folds new totals back into the
      contest, so every downstream audit sizing and recount eligibility test is
      recomputed from the latest canvass.
    trigger: "POST /contests/{id}/canvass-results; re-run on POST /recounts/{id}/complete"
    inputs: [Contest.reported_votes, Contest.ballots_cast, Contest.candidate_names]
    algorithm: aggregation
    formula: |
      ranked = candidate_names sorted by (reported_votes[name] DESC, name ASC)
      winner_name    = ranked[0]
      runner_up_name = ranked[1]                       # null when only one candidate
      margin_votes   = reported_votes[winner_name] - reported_votes[runner_up_name]
      margin_pct     = round_half_up(margin_votes / ballots_cast * 100, 4)
      # ties: reported_votes equal for the top two → margin_votes = 0 and the
      # lexicographically smaller name is reported as winner_name; the contest is
      # still CANVASSED and automatic_recount_required becomes true.
    constants: {}
    precision: "margin_pct 4 decimal places, round_half_up; margin_votes is an integer"

  - name: recount_trigger_evaluation
    description: |
      Decides whether a recount is mandatory for a contest and whether a
      candidate-requested recount may still be filed. The automatic threshold
      differs by contest_type, and the request window closes a fixed number of
      days after canvass.
    trigger: "POST /contests/{id}/canvass-results, re-run on POST /recounts/{id}/complete; read on POST /recounts"
    inputs: [Contest.margin_pct, Contest.contest_type, Contest.canvassed_at, clock now]
    algorithm: threshold
    formula: |
      automatic_threshold_pct = (contest_type == "CANDIDATE") ? 0.5000 : 0.2500
      automatic_recount_required = margin_pct <= automatic_threshold_pct
      recount_request_deadline_at = canvassed_at + REQUEST_WINDOW_DAYS days
      request_eligible = margin_pct <= REQUEST_ELIGIBLE_MARGIN_PCT
                         AND clock now <= recount_request_deadline_at
      # request_eligible == false with margin_pct above the ceiling →
      # ERR_MARGIN_NOT_RECOUNT_ELIGIBLE; false only because of the date →
      # ERR_RECOUNT_REQUEST_WINDOW_CLOSED
    constants:
      AUTOMATIC_RECOUNT_MARGIN_PCT_CANDIDATE: 0.5000
      AUTOMATIC_RECOUNT_MARGIN_PCT_MEASURE: 0.2500
      REQUEST_ELIGIBLE_MARGIN_PCT: 10.0000
      REQUEST_WINDOW_DAYS: 5
    precision: "comparisons on margin_pct at 4 decimal places; both bounds are inclusive"

  - name: audit_sample_size
    description: |
      Round-1 sample size in whole batches. Three audit types compute the raw
      ballot or batch requirement by different formulas from the same contest
      margin, then the same floor/ceiling clamp is applied. The escalation
      multiplier reuses the clamped value to size later rounds.
    trigger: "POST /audits (planned_sample_size preview), POST /audits/{id}/seed, POST /audits/{id}/rounds; re-run on POST /recounts/{id}/complete for PLANNED and SEEDED audits"
    inputs: [Audit.audit_type, Audit.risk_limit_alpha, Audit.fixed_percentage_pct, Audit.prior_error_rate, Contest.margin_votes, Contest.ballots_cast, count of BallotBatch for the contest]
    algorithm: threshold
    formula: |
      total_batches   = count of BallotBatch rows with contest_id == Audit.contest_id
      margin_fraction = margin_votes / ballots_cast
      avg_batch       = ceil(ballots_cast / total_batches)

      # --- mode (a): the raw requirement is derived by a different formula per audit_type
      if audit_type == "RISK_LIMITING":
          raw_ballots = ceil(2 * ALPHA_FACTOR[risk_limit_alpha] / margin_fraction^2)
          raw_batches = ceil(raw_ballots / avg_batch)
      elif audit_type == "COMPARISON":
          raw_ballots = ceil(ALPHA_FACTOR[risk_limit_alpha] * (1 + prior_error_rate)
                             / (GAMMA * margin_fraction))
          raw_batches = ceil(raw_ballots / avg_batch)
      else:  # FIXED_PERCENTAGE — no ballot term at all, batches straight from the percentage
          raw_ballots = null
          raw_batches = ceil(total_batches * fixed_percentage_pct / 100)

      planned_sample_size = min(total_batches, max(MIN_SAMPLE_BATCHES, raw_batches))

      # later rounds
      escalation_target    = ceil(planned_sample_size * ESCALATION_MULTIPLIER)
      additional_batches   = escalation_target - cumulative_sampled_batches
      # is_full_hand_count round → every unsampled batch of the contest is drawn,
      # regardless of escalation_target
    constants:
      ALPHA_FACTOR: { 0.10: 2.303, 0.05: 2.996, 0.01: 4.605 }
      GAMMA: 1.2
      MIN_SAMPLE_BATCHES: 2
      ESCALATION_MULTIPLIER: 2.0
    variants:
      - name: risk_limiting_sizing
        when: "audit_type == RISK_LIMITING"
        difference: "inverse-square margin term: raw_ballots = ceil(2*alpha_factor/margin_fraction^2)"
      - name: comparison_sizing
        when: "audit_type == COMPARISON"
        difference: "inverse-linear margin term inflated by the prior error rate and deflated by GAMMA"
      - name: fixed_percentage_sizing
        when: "audit_type == FIXED_PERCENTAGE"
        difference: "ignores the margin entirely; batches = ceil(total_batches * pct/100)"
    precision: "all intermediate ceilings on whole ballots/batches; planned_sample_size is an integer"

  - name: batch_selection_sequence
    description: |
      Deterministic pseudo-random batch draw from the published seed. Identical
      seed, round number and eligible pool always produce the identical ordered
      selection, so the sample is publicly reproducible by observers.
    trigger: "POST /audits/{id}/rounds; also on the system-created full-hand-count round"
    inputs: [Audit.random_seed, AuditRound.round_number, eligible BallotBatch pool, sample_size_batches]
    algorithm: deterministic_sampling
    formula: |
      pool = BallotBatch rows with contest_id == Audit.contest_id
             AND custody_status != "QUARANTINED"
             AND not already drawn by a non-SUPERSEDED AuditBatch of this audit,
             sorted by batch_label ASC
      x = (int(random_seed) + (round_number - 1) * ROUND_STRIDE) mod MODULUS
      remaining = pool
      for i in 0 .. sample_size_batches - 1:
          x   = (MULTIPLIER * x + INCREMENT) mod MODULUS     # advance first, then draw
          idx = x mod len(remaining)
          selected[i] = remaining.pop(idx)                   # sampling without replacement
      selection_sequence = [batch_label of selected[0], selected[1], ...]
      AuditBatch.selection_index = i (0-based, in draw order)
      # is_full_hand_count round: the whole pool is drawn in batch_label ASC order
      # and selection_sequence is the sorted pool, with no LCG draw at all.
    constants:
      MULTIPLIER: 1103515245
      INCREMENT: 12345
      MODULUS: 2147483648
      ROUND_STRIDE: 7919
    precision: "integer arithmetic only; no rounding"

  - name: tally_discrepancy_measure
    description: |
      Turns one hand tally into an error measure and rolls it up into the round
      and audit measures. Two variants are in play: ballot-polling style audits
      measure the net margin shift per counted ballot, comparison audits measure
      the worst single-batch relative overstatement.
    trigger: "POST /manual-tallies/{id}/submit, POST /ballot-interpretations/{id}/votes, POST /manual-tallies/{id}/reopen"
    inputs: [ManualTally.counted_votes, BallotBatch.machine_votes, AuditBatch.ballot_count, Contest.winner_name, Contest.runner_up_name, Contest.margin_votes, Audit.measure_variant]
    algorithm: aggregation
    formula: |
      machine_margin_votes = machine_votes[winner_name] - machine_votes[runner_up_name]
      manual_margin_votes  = counted_votes[winner_name] - counted_votes[runner_up_name]
      net_error_votes      = machine_margin_votes - manual_margin_votes
      relative_taint       = round_half_up(net_error_votes * Contest.margin_votes
                                           / (2 * AuditBatch.ballot_count), 4)

      # roll-up over tallies of the round with status in {SUBMITTED, CERTIFIED}
      AuditRound.cumulative_net_error_votes = sum(net_error_votes)
      AuditRound.counted_ballots            = sum(AuditBatch.ballot_count)

      if measure_variant == "NET_MARGIN_SHIFT":
          round_measure = round_half_up(abs(cumulative_net_error_votes)
                                        / counted_ballots, 4)
          escalates     = round_measure >= NET_SHIFT_ESCALATION_THRESHOLD
      else:  # MAX_RELATIVE_OVERSTATEMENT
          round_measure = round_half_up(max(0, max(relative_taint over those tallies)), 4)
          escalates     = round_measure >= MACRO_ESCALATION_THRESHOLD

      Audit.discrepancy_measure = same formula over every non-SUPERSEDED round of the audit
      # counted_ballots == 0 → round_measure = 0.0 and escalates = false
    constants:
      NET_SHIFT_ESCALATION_THRESHOLD: 0.0050
      MACRO_ESCALATION_THRESHOLD: 1.0000
    variants:
      - name: NET_MARGIN_SHIFT
        when: "Audit.audit_type in {RISK_LIMITING, FIXED_PERCENTAGE}"
        difference: "measure is |net error| per counted ballot across the whole round; compared against 0.0050"
      - name: MAX_RELATIVE_OVERSTATEMENT
        when: "Audit.audit_type == COMPARISON"
        difference: "measure is the single worst batch taint net_error*contest_margin/(2*batch_ballots), never negative; compared against 1.0000"
    precision: "measures and taints 4 decimal places, round_half_up; vote counts are integers; threshold comparisons are inclusive (>=)"

  - name: recount_deposit_assessment
    description: |
      Prices the cost deposit a candidate must post to obtain a requested
      recount. The per-ballot rate depends on the scope, and the assessed amount
      is clamped between a statutory floor and cap. Automatic and
      audit-escalated recounts are free.
    trigger: "POST /recounts"
    inputs: [Recount.trigger_type, Recount.scope, Recount.scope_batch_ids, BallotBatch.ballot_count, Contest.ballots_cast]
    algorithm: tiered_pricing
    formula: |
      if scope == "FULL_CONTEST":
          ballots_in_scope = sum(ballot_count) over every BallotBatch of the contest
          rate_cents       = RATE_FULL_CENTS_PER_BALLOT
      else:  # PARTIAL_BATCHES
          ballots_in_scope = sum(ballot_count) over BallotBatch rows in scope_batch_ids
          rate_cents       = RATE_PARTIAL_CENTS_PER_BALLOT

      if trigger_type in {"AUTOMATIC_MARGIN", "AUDIT_ESCALATION"}:
          required_deposit_cents = 0
          deposit_status         = "NOT_REQUIRED"
      else:  # CANDIDATE_REQUESTED
          raw = FILING_FEE_CENTS + rate_cents * ballots_in_scope
          required_deposit_cents = min(DEPOSIT_CAP_CENTS, max(DEPOSIT_FLOOR_CENTS, raw))
          deposit_status         = "PENDING"
    constants:
      FILING_FEE_CENTS: 50000
      RATE_FULL_CENTS_PER_BALLOT: 25
      RATE_PARTIAL_CENTS_PER_BALLOT: 40
      DEPOSIT_FLOOR_CENTS: 100000
      DEPOSIT_CAP_CENTS: 2000000
    precision: "integer cents throughout; the floor is applied before the cap"

  - name: recount_cost_and_refund
    description: |
      Settles the money side of a recount. The ballot handling cost is billed
      per batch line at a fractional per-ballot rate, each line rounded to whole
      cents before the lines are summed (so the total differs from rounding the
      sum). The refund then follows one of three variants depending on how the
      recount ended.
    trigger: "POST /recounts/{id}/complete, POST /recounts/{id}/withdraw, POST /recounts/{id}/deny"
    inputs: [Recount.scope, Recount.scope_batch_ids, BallotBatch.ballot_count, Recount.team_hours, Recount.deposit_paid_cents, Recount.final_votes, Contest.reported_votes, Contest.winner_name]
    algorithm: aggregation
    formula: |
      # --- step 1: cost, mode (b) nested rounding — per-line first, then sum
      for each BallotBatch b in scope (batch_label ASC):
          line_cents = round_half_up(RECOUNT_RATE_CENTS_PER_BALLOT * b.ballot_count)
      ballot_cost_cents = sum(line_cents)
      labor_cost_cents  = round_half_up(team_hours * LABOR_RATE_CENTS_PER_HOUR)
      actual_cost_cents = ballot_cost_cents + labor_cost_cents

      # --- step 2: outcome, from the recounted totals
      final_margin_votes  = final_votes[new winner] - final_votes[new runner-up]
                            (ranked by votes DESC, name ASC, as in contest_margin_canvass)
      margin_change_votes = final_margin_votes - Contest.margin_votes
      outcome_changed     = (new winner name != Contest.winner_name)

      # --- step 3: refund variant
      if outcome_changed OR abs(margin_change_votes) >= MATERIAL_MARGIN_CHANGE_VOTES:
          refund_variant  = "STATUTORY_REFUND"
          refunded_cents  = deposit_paid_cents
          forfeited_cents = 0
          deposit_status  = "REFUNDED_FULL"
      else:
          refund_variant  = "PRORATED_COST_RECOVERY"
          forfeited_cents = min(deposit_paid_cents, actual_cost_cents)
          refunded_cents  = deposit_paid_cents - forfeited_cents
          deposit_status  = (refunded_cents == 0) ? "FORFEITED" : "PARTIALLY_REFUNDED"

      # --- withdrawal leg (POST /recounts/{id}/withdraw with deposit_status == HELD)
      # step 1 is SKIPPED on this leg: no ballots were counted and team_hours is
      # null, so actual_cost_cents stays 0 and the retention replaces the cost.
      refund_variant      = "WITHDRAWAL_RETENTION"
      actual_cost_cents    = 0
      admin_retained_cents = round_half_up(deposit_paid_cents * WITHDRAWAL_RETENTION_PCT)
      refunded_cents       = deposit_paid_cents - admin_retained_cents
      forfeited_cents      = 0
      deposit_status       = "PARTIALLY_REFUNDED"

      # --- denial leg (POST /recounts/{id}/deny with deposit_status == HELD)
      # step 1 is SKIPPED here too: actual_cost_cents stays 0.
      refund_variant = "STATUTORY_REFUND"; actual_cost_cents = 0
      refunded_cents = deposit_paid_cents; forfeited_cents = 0
      deposit_status = "REFUNDED_FULL"

      # --- conservation invariant, checked after every money-moving transition
      deposit_paid_cents == refunded_cents + forfeited_cents + admin_retained_cents
                            + (deposit_status == "HELD" ? deposit_paid_cents : 0)
    constants:
      RECOUNT_RATE_CENTS_PER_BALLOT: 12.5
      LABOR_RATE_CENTS_PER_HOUR: 4800
      MATERIAL_MARGIN_CHANGE_VOTES: 100
      WITHDRAWAL_RETENTION_PCT: 0.25
    variants:
      - name: STATUTORY_REFUND
        when: "the recount changed the outcome, or moved the margin by at least 100 votes, or the request was denied"
        difference: "the entire deposit is returned; forfeited_cents stays 0 regardless of actual_cost_cents"
      - name: PRORATED_COST_RECOVERY
        when: "the recount completed without changing the outcome and moved the margin by fewer than 100 votes"
        difference: "actual_cost_cents is forfeited (capped at the deposit) and only the remainder is refunded"
      - name: WITHDRAWAL_RETENTION
        when: "the requester withdraws while the deposit is HELD"
        difference: "a flat 25% administrative retention is kept instead of the measured cost; forfeited_cents stays 0"
    precision: "integer cents; each per-batch line is rounded round_half_up before summing, never after"

  - name: certification_timeline_projection
    description: |
      Projects when an audit will finish and compares it against the statutory
      certification deadline, granting an automatic extension when the audit
      cannot finish in time. The nine steps below run in exactly this order —
      the extension is derived from the pre-extension slack, and the reported
      timeline status is derived from the post-extension slack.
    trigger: "every AuditRound creation, every ManualTally submit/reopen, every Audit status change, POST /audits/{id}/timeline-review, PATCH /elections/{id} when certification_deadline_at changes, and POST /_clock/set_current_utc"
    inputs: [pending AuditRound rows, AuditBatch.tally_status, BallotBatch.ballot_count, Election.certification_deadline_at, clock now]
    algorithm: forward_looking
    formula: |
      1. pending_rounds = AuditRound rows of the audit with status in
                          {SELECTED, TALLYING, REVIEW_REQUIRED}
      2. hand_count_ballots = sum(BallotBatch.ballot_count) over AuditBatch rows of
                              pending_rounds where AuditRound.is_full_hand_count == true
                              AND AuditBatch.tally_status != "COUNTED"
      3. ballot_hours = ceil(hand_count_ballots * FULL_HAND_COUNT_HOURS_PER_1000 / 1000)
      4. round_hours  = PER_ROUND_HOURS * count(pending_rounds)
      5. remaining_work_hours = ballot_hours + round_hours
      6. projected_completion_at = clock now + remaining_work_hours hours
      7. slack_hours = round_half_up((Election.certification_deadline_at
                                      - projected_completion_at) / 3600 seconds, 2)
      8. extension_days_granted = (slack_hours >= 0) ? 0
                                  : min(EXTENSION_MAX_DAYS, ceil(-slack_hours / 24))
         effective_certification_deadline_at = Election.certification_deadline_at
                                               + extension_days_granted days
      9. effective_slack_hours = round_half_up((effective_certification_deadline_at
                                      - projected_completion_at) / 3600 seconds, 2)
         timeline_status = effective_slack_hours <  0        -> "BREACHED"
                           effective_slack_hours <= AT_RISK_HOURS -> "AT_RISK"
                           otherwise                          -> "ON_TRACK"

      # election roll-up
      Election.effective_certification_deadline_at = certification_deadline_at
          + max(extension_days_granted over all Audits of the election's Contests) days
      Election.contest_window_ends_at = Election.effective_certification_deadline_at
          + LEGAL_CONTEST_WINDOW_DAYS days
      Election.timeline_status = worst of {ON_TRACK < AT_RISK < BREACHED} over those Audits
    constants:
      PER_ROUND_HOURS: 48
      FULL_HAND_COUNT_HOURS_PER_1000: 6
      AT_RISK_HOURS: 72
      EXTENSION_MAX_DAYS: 5
      LEGAL_CONTEST_WINDOW_DAYS: 10
    precision: "hours 2 decimal places, round_half_up; ballot_hours and extension_days_granted are whole numbers (ceiling)"

  - name: board_quorum_adjudication
    description: |
      Applies the canvassing board's voter-intent determination to an ambiguous
      ballot. A determination only lands once quorum is met with both major
      parties represented; an even split deadlocks instead of deciding.
    trigger: "POST /ballot-interpretations/{id}/votes"
    inputs: [BallotInterpretation.board_votes, BallotInterpretation.proposed_determination, ManualTally.ambiguous_ballot_count]
    algorithm: threshold
    formula: |
      votes_cast   = count(board_votes)
      accept_count = count(board_votes where vote == "ACCEPT")
      reject_count = count(board_votes where vote == "REJECT")
      parties      = distinct board_votes[].party
      quorum_met   = votes_cast >= QUORUM_MIN_VOTES
                     AND "DEM" in parties AND "REP" in parties

      if not quorum_met:                       status stays PENDING
      elif accept_count == reject_count:       status = "DEADLOCKED"; final_determination = null
      elif accept_count > reject_count:        status = "ADJUDICATED"; final_determination = proposed_determination
      else:                                    status = "ADJUDICATED"; final_determination = "NO_VOTE"

      on ADJUDICATED: ManualTally.ambiguous_ballot_count -= 1 and
          final_determination == "NO_VOTE" ? no_vote_count += 1
                                           : counted_votes[final_determination] += 1
      # the ballot-accounting invariant
      #   sum(counted_votes) + ambiguous_ballot_count + no_vote_count == AuditBatch.ballot_count
      # therefore holds across every adjudication.
    constants:
      QUORUM_MIN_VOTES: 3
    precision: "integer counts; a board member may cast at most one vote per interpretation"

# =============================================================================
# §1.4 Validation Rules Table — evaluated in ascending `priority` order.
# The first rule whose condition is violated determines the response; no later
# rule is evaluated. Priorities are globally unique so that every pair of rules
# has a defined winner.
# =============================================================================
validations:
  # --- authentication / authorization -----------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role header is present and names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Missing, empty or unrecognised X-User-Role. Also raised when X-User-ID is missing on an endpoint whose authorized role is entity_backed."

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's authorized_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Recognised role attempting an operation it does not hold, e.g. CustodyOfficer calling POST /audits/{id}/seed."

  # --- schema -----------------------------------------------------------------
  - priority: 3
    category: validation
    check: "request body parses, required fields present, types/enums/ranges/lengths respected, pagination limit in [1,100] and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all"
    description: "Pure shape validation with no database read: unknown enum member, negative ballot_count, non-integer cents, random_seed not exactly 10 digits, limit=0, limit=101."

  # --- existence --------------------------------------------------------------
  - priority: 4
    category: existence
    check: "every {id} path parameter resolves to a stored row"
    error_id: "ERR_ELECTION_NOT_FOUND | ERR_CONTEST_NOT_FOUND | ERR_BALLOT_BATCH_NOT_FOUND | ERR_CUSTODY_EVENT_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_AUDIT_ROUND_NOT_FOUND | ERR_AUDIT_BATCH_NOT_FOUND | ERR_TALLY_TEAM_NOT_FOUND | ERR_MANUAL_TALLY_NOT_FOUND | ERR_DISCREPANCY_NOT_FOUND | ERR_BALLOT_INTERPRETATION_NOT_FOUND | ERR_RECOUNT_NOT_FOUND | ERR_CORRECTIVE_ACTION_NOT_FOUND | ERR_OBSERVER_CREDENTIAL_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
    description: "The error id names the entity that owns the collection segment in the path."

  - priority: 5
    category: existence
    check: "every foreign key supplied in the request body resolves to a stored row"
    error_id: "ERR_ELECTION_NOT_FOUND | ERR_CONTEST_NOT_FOUND | ERR_BALLOT_BATCH_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_AUDIT_BATCH_NOT_FOUND | ERR_TALLY_TEAM_NOT_FOUND | ERR_MANUAL_TALLY_NOT_FOUND | ERR_DISCREPANCY_NOT_FOUND"
    http_status: 404
    applies_to: "POST /contests, POST /ballot-batches, POST /ballot-batches/bulk, POST /audits, POST /tally-teams, POST /manual-tallies, POST /ballot-interpretations, POST /recounts, POST /corrective-actions, POST /observer-credentials"
    description: "Body FKs are resolved after path parameters and before any ownership or state test."

  # --- identity / ownership ---------------------------------------------------
  - priority: 6
    category: auth
    check: "for the entity_backed role TallyTeamLead, X-User-ID resolves to a TallyTeam and that team owns the tally being acted on"
    error_id: ERR_TALLY_TEAM_MISMATCH
    http_status: 403
    applies_to: "POST /manual-tallies, PATCH /manual-tallies/{id}, POST /manual-tallies/{id}/submit, POST /manual-tallies/{id}/reopen, POST /ballot-interpretations"
    description: "TallyTeamLead identity is the TallyTeam id: X-User-ID must equal the tally_team_id of the ManualTally (or of the body on create)."

  - priority: 7
    category: auth
    check: "for the entity_backed role Observer, X-User-ID resolves to an ObserverCredential"
    error_id: ERR_OBSERVER_CREDENTIAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /audits/{id}/public-report"
    description: "Observer identity is the ObserverCredential id."

  - priority: 8
    category: auth
    check: "the Observer's credential is ACTIVE"
    error_id: ERR_OBSERVER_CREDENTIAL_REVOKED
    http_status: 403
    applies_to: "GET /audits/{id}/public-report"
    description: "A revoked credential loses report access even inside its stated access window."

  - priority: 9
    category: business_temporal
    check: "clock now is within [access_start_at, access_end_at) of the Observer's credential"
    error_id: ERR_OBSERVER_ACCESS_WINDOW_CLOSED
    http_status: 403
    applies_to: "GET /audits/{id}/public-report"
    description: "Half-open window: access_end_at itself is outside the window."

  - priority: 10
    category: auth
    check: "X-User-ID equals Recount.requested_by_user_id"
    error_id: ERR_NOT_REQUESTING_PARTY
    http_status: 403
    applies_to: "POST /recounts/{id}/deposit, POST /recounts/{id}/withdraw"
    description: "Only the candidate representative who filed the recount may fund or withdraw it; another CandidateRepresentative is rejected."

  # --- optimistic concurrency -------------------------------------------------
  - priority: 11
    category: concurrency
    check: "expected_contest_version equals Contest.version"
    error_id: ERR_STALE_CONTEST_VERSION
    http_status: 412
    applies_to: "POST /recounts"
    description: "§1.2.1 recount-create-stale-contest."

  - priority: 12
    category: concurrency
    check: "expected_audit_version equals Audit.version"
    error_id: ERR_STALE_AUDIT_VERSION
    http_status: 412
    applies_to: "POST /audits/{id}/rounds"
    description: "§1.2.1 round-create-stale-audit."

  - priority: 13
    category: concurrency
    check: "expected_ballot_batch_version equals BallotBatch.version"
    error_id: ERR_STALE_BALLOT_BATCH_VERSION
    http_status: 412
    applies_to: "POST /audit-batches/{id}/retrieve"
    description: "§1.2.1 batch-retrieve-stale-ballot-batch. Evaluated before every safety test on the batch, including quarantine."

  # --- target-entity state ----------------------------------------------------
  - priority: 14
    category: state
    check: "the entity addressed by the path is in a state from which the requested transition exists in §1.2, and where that transition carries a precondition on a dependent row's own state, the dependent row satisfies it too"
    error_id: "ERR_INVALID_ELECTION_STATE | ERR_INVALID_CONTEST_STATE | ERR_INVALID_BATCH_STATE | ERR_INVALID_AUDIT_STATE | ERR_INVALID_AUDIT_BATCH_STATE | ERR_INVALID_TALLY_STATE | ERR_INVALID_DISCREPANCY_STATE | ERR_INVALID_INTERPRETATION_STATE | ERR_INVALID_RECOUNT_STATE | ERR_INVALID_CORRECTIVE_ACTION_STATE | ERR_INVALID_TEAM_STATE | ERR_INVALID_CREDENTIAL_STATE | ERR_PUBLIC_REPORT_NOT_PUBLISHED"
    http_status: 409
    applies_to: "every action endpoint, plus GET /audits/{id}/public-report"
    description: "Covers terminal-state lockdown and repeat-trigger idempotency failures (second POST /audits/{id}/seed, escalating an OPEN discrepancy, funding an already-funded recount). On GET /audits/{id}/public-report the state test is Audit.public_report_published == true, reported as ERR_PUBLIC_REPORT_NOT_PUBLISHED. On POST /tally-teams/{id}/disband the dependent-row clause bites: a READY team may still not disband while any ManualTally of the team is in DRAFT or PENDING_ADJUDICATION, and a FORMING team may not disband while any ManualTally references it at all; either failure is reported against the blocking tally as ERR_INVALID_TALLY_STATE (ERR_INVALID_TEAM_STATE is reserved for disbanding an already DISBANDED team)."

  # --- cross-entity state -----------------------------------------------------
  - priority: 15
    category: state
    check: "the parent Contest is CANVASSED"
    error_id: ERR_CONTEST_NOT_CANVASSED
    http_status: 409
    applies_to: "POST /audits/{id}/seed, POST /recounts"
    description: "Sampling and recounts require canvassed totals; a PENDING_CANVASS contest has no margin to size against."

  - priority: 16
    category: state
    check: "the Election is in the state the operation requires (CANVASSED for certify and recount start; not CERTIFIED for every other write)"
    error_id: "ERR_ELECTION_NOT_CANVASSED | ERR_ELECTION_ALREADY_CERTIFIED"
    http_status: 409
    applies_to: "POST /recounts/{id}/start, POST /contests, POST /ballot-batches, POST /audits, POST /recounts, POST /manual-tallies"
    description: "A CERTIFIED election is frozen: no new contests, batches, audits, recounts or tallies. ERR_ELECTION_NOT_CANVASSED belongs to POST /recounts/{id}/start, where the path entity (the Recount) is in a legal state and only the election lags; certifying an OPEN election is instead the path entity's own illegal transition and is reported at priority 14 as ERR_INVALID_ELECTION_STATE. Certifying an already CERTIFIED election is likewise ERR_INVALID_ELECTION_STATE at priority 14, while ERR_ELECTION_ALREADY_CERTIFIED is what every other write of a frozen election returns."

  - priority: 17
    category: state
    check: "no Audit of the contest is outside {COMPLETE, TERMINATED} when a recount starts; every Audit and Recount of the election is terminal when the election certifies"
    error_id: "ERR_AUDIT_NOT_TERMINAL | ERR_RECOUNT_NOT_TERMINAL"
    http_status: 409
    applies_to: "POST /recounts/{id}/start, POST /elections/{id}/certify"
    description: "Recount and audit work on one contest never overlap, and certification waits for both."

  - priority: 18
    category: state
    check: "the TallyTeam is READY (and therefore bipartisan) and not DISBANDED"
    error_id: ERR_TALLY_TEAM_NOT_READY
    http_status: 409
    applies_to: "POST /manual-tallies"
    description: "A FORMING or DISBANDED team may not be assigned a batch. Submission is NOT covered by this rule: a team that lost bipartisan composition after the session opened is caught by priority 24 instead, so the two errors never shadow each other."

  # --- chain of custody safety ------------------------------------------------
  - priority: 19
    category: business_safety
    check: "the BallotBatch is not QUARANTINED"
    error_id: ERR_BATCH_QUARANTINED
    http_status: 409
    applies_to: "POST /audit-batches/{id}/retrieve, POST /audit-batches/{id}/return, POST /manual-tallies, POST /manual-tallies/{id}/submit, POST /recounts"
    description: "A quarantined batch is evidence: it can neither be retrieved nor counted, and it cannot be placed in a recount scope."

  - priority: 20
    category: business_safety
    check: "BallotBatch.retrieval_authorized_at is not null"
    error_id: ERR_RETRIEVAL_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /audit-batches/{id}/retrieve"
    description: "Only a batch drawn by a round (which stamps the authorization) may leave secure storage."

  - priority: 21
    category: business_safety
    check: "observed_seal_number equals BallotBatch.current_seal_number; reseal_number differs from it on return"
    error_id: ERR_SEAL_NUMBER_MISMATCH
    http_status: 409
    applies_to: "POST /audit-batches/{id}/retrieve, POST /audit-batches/{id}/return"
    description: "Seal attestation failure on check-out, or reuse of the same seal number on check-in."

  - priority: 22
    category: business_safety
    check: "BallotBatch.custody_status == CHECKED_OUT while a hand tally of it is created, edited or submitted"
    error_id: ERR_BATCH_NOT_CHECKED_OUT
    http_status: 409
    applies_to: "POST /manual-tallies, PATCH /manual-tallies/{id}, POST /manual-tallies/{id}/submit"
    description: "Ballots cannot be counted while sealed in storage or after they have been resealed."

  - priority: 23
    category: business_safety
    check: "the acting X-User-ID is not a member of the TallyTeam that produced the tally under adjudication, and the verifier of a corrective action is not its completer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /ballot-interpretations/{id}/votes, POST /corrective-actions/{id}/transition"
    description: "Segregation of duties: counters may not adjudicate their own ambiguous ballots, and a corrective action may not be self-verified."

  - priority: 24
    category: business_safety
    check: "the TallyTeam has at least one DEM and at least one REP member"
    error_id: ERR_TEAM_NOT_BIPARTISAN
    http_status: 409
    applies_to: "POST /manual-tallies/{id}/submit"
    description: "Bipartisan composition is required at submission time, not only when the session opens: a roster replacement that drops the last REP (or last DEM) member of the counting team invalidates the count."

  # --- referential coherence --------------------------------------------------
  - priority: 25
    category: business_referential
    check: "all referenced rows belong to the same Election"
    error_id: ERR_CROSS_ELECTION_REFERENCE
    http_status: 422
    applies_to: "POST /ballot-batches, POST /ballot-batches/bulk, POST /manual-tallies, POST /observer-credentials"
    description: "A tally may not pair an AuditBatch from one election with a TallyTeam from another; a batch's contest_id must belong to its election_id."

  - priority: 26
    category: business_referential
    check: "every batch id in Recount.scope_batch_ids belongs to Recount's contest"
    error_id: ERR_BATCH_NOT_IN_CONTEST
    http_status: 422
    applies_to: "POST /recounts"
    description: "Partial recount scopes may only name batches of the recounted contest."

  - priority: 27
    category: business_referential
    check: "vote-map keys equal Contest.candidate_names exactly"
    error_id: ERR_CANDIDATE_NAME_UNKNOWN
    http_status: 422
    applies_to: "POST /contests/{id}/canvass-results, POST /ballot-batches, POST /ballot-batches/bulk, PATCH /manual-tallies/{id}, POST /recounts/{id}/complete"
    description: "Missing candidate keys, unknown keys, and a proposed_determination that names no candidate and is not NO_VOTE."

  # --- temporal ---------------------------------------------------------------
  - priority: 28
    category: business_temporal
    check: "session_start_at < session_end_at, access_start_at < access_end_at, certification_deadline_at after the election date, due_at after clock now"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /manual-tallies, POST /observer-credentials, POST /elections, PATCH /elections/{id}, POST /corrective-actions"
    description: "Window sanity, checked before any overlap test."

  - priority: 29
    category: business_temporal
    check: "clock now <= Contest.recount_request_deadline_at"
    error_id: ERR_RECOUNT_REQUEST_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /recounts"
    description: "Candidate-requested recounts close 5 days after canvass; automatic and audit-escalated recounts are exempt."

  - priority: 30
    category: business_temporal
    check: "clock now < Election.effective_certification_deadline_at"
    error_id: ERR_CERTIFICATION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /elections/{id}/certify"
    description: "Certification after the effective (extension-adjusted) deadline is refused."

  - priority: 31
    category: business_temporal
    check: "the tally session does not overlap another live session of the same TallyTeam"
    error_id: ERR_TEAM_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /manual-tallies"
    description: "Half-open [session_start_at, session_end_at) comparison against tallies of the same team in status {DRAFT, SUBMITTED, PENDING_ADJUDICATION}; back-to-back sessions that touch at a single instant are allowed."

  - priority: 32
    category: business_temporal
    check: "the tally session does not fall inside the reseal buffer of another live session on the same physical BallotBatch"
    error_id: ERR_BATCH_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /manual-tallies"
    description: "Closed intervals widened by RESEAL_BUFFER_MINUTES (30) on both sides: conflict iff new.start < other.end + 30m AND other.start < new.end + 30m, so a session may start exactly 30 minutes after another ends."

  - priority: 33
    category: business_temporal
    check: "granting the credential keeps the count of ACTIVE credentials overlapping in the same room at or below OBSERVER_ROOM_CAPACITY (2)"
    error_id: ERR_OBSERVER_ROOM_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /observer-credentials"
    description: "Aggregate capacity over half-open [access_start_at, access_end_at) windows per room_code; each individual credential is legal on its own."

  # --- business constraints ---------------------------------------------------
  - priority: 34
    category: business_constraint
    check: "audit configuration matches audit_type: risk_limit_alpha in {0.10,0.05,0.01} and fixed_percentage_pct null for RISK_LIMITING/COMPARISON; fixed_percentage_pct in (0,100] and risk_limit_alpha null for FIXED_PERCENTAGE"
    error_id: ERR_AUDIT_CONFIG_INVALID
    http_status: 422
    applies_to: "POST /audits"
    description: "Cross-field configuration test that requires no database read beyond the audit body."

  - priority: 35
    category: business_constraint
    check: "contest_label unique per election; batch_label unique per contest; team_label unique per election"
    error_id: "ERR_DUPLICATE_CONTEST_LABEL | ERR_DUPLICATE_BATCH_LABEL | ERR_DUPLICATE_TEAM_LABEL"
    http_status: 409
    applies_to: "POST /contests, POST /ballot-batches, POST /ballot-batches/bulk, POST /tally-teams"
    description: "Label uniqueness inside the owning scope; the bulk create also rejects duplicates inside its own payload."

  - priority: 36
    category: business_constraint
    check: "sum(reported_votes) <= Contest.ballots_cast and sum of BallotBatch.ballot_count over a contest <= Contest.ballots_cast"
    error_id: ERR_BALLOT_ACCOUNTING_EXCEEDED
    http_status: 422
    applies_to: "POST /contests/{id}/canvass-results, POST /ballot-batches, POST /ballot-batches/bulk, POST /recounts/{id}/complete"
    description: "Neither reported nor batched ballots may exceed the ballots cast in the contest."

  - priority: 37
    category: business_constraint
    check: "the eligible pool is non-empty and large enough for the requested round"
    error_id: ERR_NO_UNSAMPLED_BATCHES
    http_status: 409
    applies_to: "POST /audits/{id}/rounds, POST /discrepancies/{id}/escalate"
    description: "Every batch of the contest is already drawn (or quarantined), so no further round and no full hand count can be constructed."

  - priority: 38
    category: business_constraint
    check: "at most one live ManualTally per AuditBatch"
    error_id: ERR_DUPLICATE_TALLY
    http_status: 409
    applies_to: "POST /manual-tallies"
    description: "A second tally is refused while one in {DRAFT, SUBMITTED, PENDING_ADJUDICATION, CERTIFIED} exists for the same audit_batch_id."

  - priority: 39
    category: business_constraint
    check: "sum(counted_votes) + ambiguous_ballot_count + no_vote_count == AuditBatch.ballot_count"
    error_id: ERR_TALLY_BALLOT_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /manual-tallies/{id}/submit"
    description: "Ballot accounting must close exactly against the batch size before a tally may be submitted."

  - priority: 40
    category: business_constraint
    check: "ManualTally.reopen_count < MAX_TALLY_REOPENS (2)"
    error_id: ERR_REOPEN_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /manual-tallies/{id}/reopen"
    description: "Bounds the SUBMITTED -> DRAFT cycle so the compensating leg cannot be repeated indefinitely."

  - priority: 41
    category: business_constraint
    check: "PENDING interpretations of a tally do not exceed ManualTally.ambiguous_ballot_count, and ballot_ref is unique per tally"
    error_id: "ERR_INTERPRETATION_LIMIT_EXCEEDED | ERR_DUPLICATE_BALLOT_REF"
    http_status: 409
    applies_to: "POST /ballot-interpretations"
    description: "The board cannot adjudicate more ambiguous ballots than the team recorded, nor the same ballot twice."

  - priority: 42
    category: business_constraint
    check: "a board member casts at most one vote per interpretation"
    error_id: ERR_DUPLICATE_BOARD_VOTE
    http_status: 409
    applies_to: "POST /ballot-interpretations/{id}/votes"
    description: "member_user_id already present in board_votes."

  - priority: 43
    category: business_constraint
    check: "closing an audit requires every AuditBatch COUNTED, every batch RESEALED, no PENDING/DEADLOCKED interpretation and no OPEN/ESCALATED discrepancy"
    error_id: "ERR_TALLY_INCOMPLETE | ERR_BATCH_NOT_RETURNED | ERR_DEADLOCKED_INTERPRETATION_PENDING | ERR_UNRESOLVED_DISCREPANCY"
    http_status: 409
    applies_to: "POST /audits/{id}/close, POST /elections/{id}/certify"
    description: "Evaluated in the listed order so the earliest incomplete stage is reported."

  - priority: 44
    category: business_constraint
    check: "every EQUIPMENT CorrectiveAction of the discrepancy is VERIFIED or CANCELLED"
    error_id: ERR_EQUIPMENT_ACTION_UNVERIFIED
    http_status: 409
    applies_to: "POST /discrepancies/{id}/resolve, POST /elections/{id}/certify"
    description: "Equipment findings must be fixed and independently verified before the finding closes."

  - priority: 45
    category: business_constraint
    check: "Contest.margin_pct <= REQUEST_ELIGIBLE_MARGIN_PCT (10.0000) for CANDIDATE_REQUESTED recounts"
    error_id: ERR_MARGIN_NOT_RECOUNT_ELIGIBLE
    http_status: 409
    applies_to: "POST /recounts"
    description: "Landslide contests are not recountable on request."

  - priority: 46
    category: business_constraint
    check: "the requested recount scope does not overlap the scope of a live Recount on the same contest"
    error_id: ERR_RECOUNT_SCOPE_OVERLAP
    http_status: 409
    applies_to: "POST /recounts"
    description: "Set overlap over scope_batch_ids against Recounts in {REQUESTED, DEPOSIT_HELD, IN_PROGRESS}; FULL_CONTEST overlaps every scope."

  # --- fiscal -----------------------------------------------------------------
  - priority: 47
    category: business_fiscal
    check: "the recount actually requires a deposit (deposit_status == PENDING) before it may be funded"
    error_id: ERR_DEPOSIT_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /recounts/{id}/deposit"
    description: "AUTOMATIC_MARGIN and AUDIT_ESCALATION recounts carry deposit_status NOT_REQUIRED and cannot be funded; their money dimension never leaves NOT_REQUIRED."
  - priority: 48
    category: business_fiscal
    check: "amount_cents equals Recount.required_deposit_cents"
    error_id: ERR_DEPOSIT_INSUFFICIENT
    http_status: 402
    applies_to: "POST /recounts/{id}/deposit"
    description: "Under- and over-payment are both refused; the deposit must be posted in full and exactly."

# =============================================================================
# §1.5 API Endpoint Table
# `input` lists request-body / query fields; a trailing `?` marks it optional.
# Every list endpoint additionally honours the pagination fields declared in
# response_envelope.
# =============================================================================
endpoints:
  # --- logical clock ----------------------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    description: "Sets the server's logical clock. Default value before any call is 2026-08-01T00:00:00Z. Recomputes every audit timeline projection and election roll-up."
    roles: [ElectionsDirector]
    input: [current_utc]
    output: "{ current_utc: string }"
    success_code: 200
    side_effects:
      - "re-runs calculations.certification_timeline_projection for every Audit not in {COMPLETE, TERMINATED}"
      - "re-derives Election.timeline_status, effective_certification_deadline_at and contest_window_ends_at"

  # --- Election ---------------------------------------------------------------
  - method: POST
    path: /elections
    description: "Registers an election with its statutory certification deadline."
    roles: [ElectionsDirector]
    input: [jurisdiction_code, election_name, election_date, certification_deadline_at]
    output: Election
    success_code: 201
    side_effects: ["effective_certification_deadline_at = certification_deadline_at", "contest_window_ends_at = deadline + 10 days"]
  - method: GET
    path: /elections
    description: "Lists elections."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["jurisdiction_code?", "status?", "limit?", "offset?"]
    output: Election[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /elections/{id}
    description: "Reads one election with its derived roll-up fields."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: Election
    success_code: 200
    side_effects: []
  - method: PATCH
    path: /elections/{id}
    description: "Amends the election label or statutory deadline while the election is not CERTIFIED."
    roles: [ElectionsDirector]
    input: ["election_name?", "certification_deadline_at?"]
    output: Election
    success_code: 200
    side_effects: ["re-runs the timeline projection for every audit of the election"]
  - method: POST
    path: /elections/{id}/certify
    description: "Certifies the election once every contest, audit, recount, discrepancy and equipment corrective action has closed."
    roles: [ElectionsDirector]
    input: []
    output: Election
    success_code: 200
    side_effects:
      - "Election CANVASSED -> CERTIFIED"
      - "every Contest CANVASSED -> CERTIFIED"
      - "certification_risk_flag = false; contest_window_ends_at re-derived"

  # --- Contest ----------------------------------------------------------------
  - method: POST
    path: /contests
    description: "Adds a contest to an election."
    roles: [ElectionsDirector]
    input: ["election_id", "contest_label", "office_name", "contest_type", "candidate_names", "ballots_cast", "cvr_available?"]
    output: Contest
    success_code: 201
    side_effects: ["status = PENDING_CANVASS"]
  - method: GET
    path: /contests
    description: "Lists contests, filterable by election. Rows are ordered by contest_label ASC."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["election_id?", "status?", "contest_type?", "limit?", "offset?"]
    output: Contest[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /contests/{id}
    description: "Reads one contest with its derived margin fields."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: Contest
    success_code: 200
    side_effects: []
  - method: POST
    path: /contests/{id}/canvass-results
    description: "Records the canvassed vote totals and derives winner, margin and recount eligibility."
    roles: [ElectionsDirector]
    input: [reported_votes]
    output: Contest
    success_code: 200
    side_effects:
      - "calculations.contest_margin_canvass and calculations.recount_trigger_evaluation"
      - "Contest PENDING_CANVASS -> CANVASSED"
      - "when every contest of the election is canvassed, Election OPEN -> CANVASSED"

  # --- BallotBatch / CustodyEvent --------------------------------------------
  - method: POST
    path: /ballot-batches
    description: "Registers one sealed ballot batch with its machine tabulation totals."
    roles: [CustodyOfficer]
    input: [election_id, contest_id, batch_label, storage_location_code, ballot_count, machine_votes, current_seal_number]
    output: BallotBatch
    success_code: 201
    side_effects: ["custody_status = SEALED", "append CustodyEvent(event_type = INTAKE)"]
  - method: POST
    path: /ballot-batches/bulk
    description: "Registers many sealed batches for one contest in a single all-or-nothing call."
    roles: [CustodyOfficer]
    input: [election_id, contest_id, batches]
    output: "{ created_count: integer, batch_labels: string[], batch_ids: string[] }"
    success_code: 201
    side_effects:
      - "all-or-nothing: any invalid or duplicate label in `batches` rejects the whole call and creates nothing"
      - "one CustodyEvent(event_type = INTAKE) per created batch"
  - method: GET
    path: /ballot-batches
    description: "Lists ballot batches, filterable by election, contest and custody status. Rows are ordered by batch_label ASC."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["election_id?", "contest_id?", "custody_status?", "limit?", "offset?"]
    output: BallotBatch[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /ballot-batches/{id}
    description: "Reads one ballot batch with its live custody state."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: BallotBatch
    success_code: 200
    side_effects: []
  - method: POST
    path: /ballot-batches/{id}/quarantine
    description: "Quarantines a batch as evidence, voiding any draft hand tally of it."
    roles: [CustodyOfficer]
    input: [reason]
    output: BallotBatch
    success_code: 200
    side_effects:
      - "custody_status -> QUARANTINED (terminal)"
      - "every ManualTally in DRAFT on this batch -> VOIDED and its AuditBatch.tally_status -> VOIDED"
      - "append CustodyEvent(event_type = QUARANTINE)"
  - method: GET
    path: /ballot-batches/{id}/custody-events
    description: "Chain-of-custody log of one batch. Rows are ordered by sequence_no ASC (occurred_at values tie under a frozen logical clock)."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["event_type?", "limit?", "offset?"]
    output: CustodyEvent[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /custody-events
    description: "Lists custody events across batches. Rows are ordered by ballot_batch_id ASC, then sequence_no ASC."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, CandidateRepresentative]
    input: ["ballot_batch_id?", "event_type?", "limit?", "offset?"]
    output: CustodyEvent[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /custody-events/{id}
    description: "Reads one append-only custody event."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, CandidateRepresentative]
    input: []
    output: CustodyEvent
    success_code: 200
    side_effects: []

  # --- Audit ------------------------------------------------------------------
  - method: POST
    path: /audits
    description: "Plans an audit of a contest and previews its sample size."
    roles: [AuditManager]
    input: ["contest_id", "audit_type", "risk_limit_alpha?", "fixed_percentage_pct?", "prior_error_rate?"]
    output: Audit
    success_code: 201
    side_effects:
      - "measure_variant derived from audit_type"
      - "planned_sample_size derived when the contest is already CANVASSED (calculations.audit_sample_size)"
      - "Election.open_audit_count += 1"
  - method: GET
    path: /audits
    description: "Lists audits, filterable by contest, type and status. Rows are ordered by created_at ASC."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["contest_id?", "audit_type?", "status?", "timeline_status?", "limit?", "offset?"]
    output: Audit[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /audits/{id}
    description: "Reads one audit with its error ledger and timeline projection."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: Audit
    success_code: 200
    side_effects: []
  - method: POST
    path: /audits/{id}/seed
    description: "Publishes the random seed at the seed ceremony and fixes the sample size."
    roles: [AuditManager]
    input: [random_seed]
    output: Audit
    success_code: 200
    side_effects:
      - "Audit PLANNED -> SEEDED; seed_published_at stamped"
      - "planned_sample_size recomputed (calculations.audit_sample_size)"
  - method: POST
    path: /audits/{id}/rounds
    description: "Draws the next round of batches from the seed and authorizes their retrieval."
    roles: [AuditManager]
    input: ["expected_audit_version", "sample_size_batches?"]
    output: AuditRound
    success_code: 201
    side_effects:
      - "OCC on Audit.version (§1.2.1 round-create-stale-audit)"
      - "calculations.batch_selection_sequence draws the batches; one AuditBatch per draw"
      - "each drawn BallotBatch gets retrieval_authorized_at and a CustodyEvent(AUTHORIZED)"
      - "previous round -> SUPERSEDED; Audit -> SAMPLING; timeline projection re-run"
      - "increments Audit.version by 1"
  - method: POST
    path: /audits/{id}/close
    description: "Closes a fully counted audit and publishes its public report."
    roles: [AuditManager]
    input: []
    output: Audit
    success_code: 200
    side_effects:
      - "Audit -> COMPLETE; every live AuditRound -> COMPLETE; every SUBMITTED ManualTally -> CERTIFIED"
      - "public_report_published = true; Election.open_audit_count -= 1; certification_risk_flag re-derived"
  - method: POST
    path: /audits/{id}/terminate
    description: "Terminates an audit superseded by a full-contest recount or an administrative order."
    roles: [ElectionsDirector]
    input: [terminated_reason]
    output: Audit
    success_code: 200
    side_effects:
      - "Audit -> TERMINATED; live rounds -> SUPERSEDED; public_report_published = true"
      - "retrieval authorization revoked on the physical batches whose only PENDING_RETRIEVAL AuditBatch belonged to this audit"
      - "Election.open_audit_count -= 1; certification_risk_flag re-derived"
  - method: POST
    path: /audits/{id}/timeline-review
    description: "Re-runs the certification timeline projection and grants the automatic deadline extension."
    roles: [AuditManager]
    input: []
    output: Audit
    success_code: 200
    side_effects:
      - "calculations.certification_timeline_projection steps 1-9"
      - "Election.effective_certification_deadline_at, contest_window_ends_at and timeline_status re-derived"
  - method: GET
    path: /audits/{id}/public-report
    description: "Public audit report; readable by Observers holding an active credential inside their access window once the audit is published."
    roles: [ElectionsDirector, AuditManager, CandidateRepresentative, Observer]
    input: []
    output: "{ audit_id: string, contest_label: string, audit_type: string, status: string, random_seed: string, selection_sequence: string[], counted_ballots: integer, cumulative_net_error_votes: integer, discrepancy_measure: number, discrepancy_count: integer, escalation_level: integer, timeline_status: string, published: boolean }"
    success_code: 200
    side_effects: []

  # --- AuditRound / AuditBatch -----------------------------------------------
  - method: GET
    path: /audit-rounds
    description: "Lists audit rounds, filterable by audit and predecessor round. Rows are ordered by round_number ASC."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["audit_id?", "previous_round_id?", "status?", "limit?", "offset?"]
    output: AuditRound[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /audit-rounds/{id}
    description: "Reads one round with its reproducible selection sequence and error ledger."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: AuditRound
    success_code: 200
    side_effects: []
  - method: GET
    path: /audit-batches
    description: "Lists drawn batches, filterable by round and physical batch. Rows are ordered by AuditBatch.selection_index ASC."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["audit_round_id?", "ballot_batch_id?", "retrieval_status?", "tally_status?", "limit?", "offset?"]
    output: AuditBatch[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /audit-batches/{id}
    description: "Reads one drawn batch with its retrieval and tally dimensions."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: AuditBatch
    success_code: 200
    side_effects: []
  - method: POST
    path: /audit-batches/{id}/retrieve
    description: "Retrieves a drawn batch from secure storage against a seal attestation."
    roles: [CustodyOfficer]
    input: ["expected_ballot_batch_version", "observed_seal_number", "note?"]
    output: AuditBatch
    success_code: 200
    side_effects:
      - "OCC on BallotBatch.version (§1.2.1 batch-retrieve-stale-ballot-batch)"
      - "BallotBatch -> CHECKED_OUT; open_checkout_count += 1; CustodyEvent(CHECK_OUT)"
      - "AuditBatch.retrieval_status PENDING_RETRIEVAL -> RETRIEVED"
      - "increments BallotBatch.version by 1"
  - method: POST
    path: /audit-batches/{id}/return
    description: "Returns a counted batch to storage under a new seal."
    roles: [CustodyOfficer]
    input: ["reseal_number", "note?"]
    output: AuditBatch
    success_code: 200
    side_effects:
      - "BallotBatch -> RESEALED with the new seal; checkout_cycle_count += 1; CustodyEvent(CHECK_IN)"
      - "AuditBatch.retrieval_status RETRIEVED -> RETURNED"
      - "increments BallotBatch.version by 1"

  # --- TallyTeam --------------------------------------------------------------
  - method: POST
    path: /tally-teams
    description: "Forms a hand-count team for an election."
    roles: [ElectionsDirector]
    input: [election_id, team_label, room_code]
    output: TallyTeam
    success_code: 201
    side_effects: ["status = FORMING; is_bipartisan = false; members = []"]
  - method: GET
    path: /tally-teams
    description: "Lists tally teams, filterable by election. Rows are ordered by team_label ASC."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember]
    input: ["election_id?", "status?", "room_code?", "limit?", "offset?"]
    output: TallyTeam[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /tally-teams/{id}
    description: "Reads one team with its party composition."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember]
    input: []
    output: TallyTeam
    success_code: 200
    side_effects: []
  - method: POST
    path: /tally-teams/{id}/members
    description: "Replaces the roster of a team with the supplied member list; the team becomes READY when both major parties are represented and falls back to FORMING when they are not."
    roles: [ElectionsDirector]
    input: [members]
    output: TallyTeam
    success_code: 200
    side_effects:
      - "members and party_counts re-derived from the supplied list (the previous roster is discarded)"
      - "FORMING -> READY once DEM >= 1 and REP >= 1; READY -> FORMING when the replacement roster is no longer bipartisan"
  - method: POST
    path: /tally-teams/{id}/disband
    description: "Disbands a team that holds no live tally."
    roles: [ElectionsDirector]
    input: []
    output: TallyTeam
    success_code: 200
    side_effects: ["status -> DISBANDED (terminal)"]

  # --- ManualTally ------------------------------------------------------------
  - method: POST
    path: /manual-tallies
    description: "Opens a hand-count session for a retrieved batch."
    roles: [TallyTeamLead]
    input: ["audit_batch_id", "tally_team_id", "session_start_at", "session_end_at", "room_code?", "counted_votes?", "ambiguous_ballot_count?", "no_vote_count?"]
    output: ManualTally
    success_code: 201
    side_effects:
      - "AuditBatch.tally_status NOT_STARTED -> IN_PROGRESS"
      - "AuditRound SELECTED -> TALLYING and Audit SAMPLING -> TALLYING on the round's first tally"
      - "machine_margin_votes snapshotted from the batch"
  - method: GET
    path: /manual-tallies
    description: "Lists hand tallies, filterable by drawn batch and team. Rows are ordered by created_at ASC."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["audit_batch_id?", "tally_team_id?", "status?", "limit?", "offset?"]
    output: ManualTally[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /manual-tallies/{id}
    description: "Reads one hand tally with its error measures."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: ManualTally
    success_code: 200
    side_effects: []
  - method: PATCH
    path: /manual-tallies/{id}
    description: "Records or corrects the hand counts while the tally is DRAFT."
    roles: [TallyTeamLead]
    input: ["counted_votes?", "ambiguous_ballot_count?", "no_vote_count?"]
    output: ManualTally
    success_code: 200
    side_effects: []
  - method: POST
    path: /manual-tallies/{id}/submit
    description: "Submits the hand count, closing ballot accounting and recording any discrepancy."
    roles: [TallyTeamLead]
    input: []
    output: ManualTally
    success_code: 200
    side_effects:
      - "calculations.tally_discrepancy_measure"
      - "DRAFT -> SUBMITTED; AuditBatch.tally_status -> COUNTED"
      - "cascade: Discrepancy(OPEN) -> AuditRound ledger -> AuditRound REVIEW_REQUIRED -> Audit DISCREPANCY_REVIEW -> Election.certification_risk_flag"
  - method: POST
    path: /manual-tallies/{id}/reopen
    description: "Reopens a submitted tally, reversing every ledger effect of the submission."
    roles: [TallyTeamLead]
    input: [reason]
    output: ManualTally
    success_code: 200
    side_effects:
      - "SUBMITTED -> DRAFT; reopen_count += 1; AuditBatch.tally_status -> IN_PROGRESS"
      - "compensation: Discrepancies -> VOIDED, AuditRound ledger restored, Audit -> TALLYING, risk flag re-derived"

  # --- Discrepancy / CorrectiveAction ---------------------------------------
  - method: GET
    path: /discrepancies
    description: "Lists discrepancies, filterable by tally and status. Rows are ordered by created_at ASC."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: ["manual_tally_id?", "status?", "discrepancy_type?", "limit?", "offset?"]
    output: Discrepancy[]
    success_code: 200
    side_effects: []
  - method: GET
    path: /discrepancies/{id}
    description: "Reads one discrepancy."
    roles: [ElectionsDirector, AuditManager, CustodyOfficer, TallyTeamLead, CanvassingBoardMember, CandidateRepresentative]
    input: []
    output: Discrepancy
    success_code: 200
    side_effects: []
  - method: POST
    path: /discrepancies/{id}/document
    description: "Records the canvassing board's documentation of a finding."
    roles: [CanvassingBoardMember]
