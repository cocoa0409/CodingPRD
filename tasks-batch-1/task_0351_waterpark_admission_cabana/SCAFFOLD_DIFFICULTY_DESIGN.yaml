              as: ParkManager
              captures: { window_id: $.data.id, window_v: $.data.version }
            - call: "POST /parks/${park_id}/cabanas"
              payload: { label: "C-9", tier: "PREMIUM", daily_rate_cents: 12000, turnover_buffer_minutes: 30 }
              as: ParkManager
              captures: { cabana_id: $.data.id }
            - call: "POST /guests"
