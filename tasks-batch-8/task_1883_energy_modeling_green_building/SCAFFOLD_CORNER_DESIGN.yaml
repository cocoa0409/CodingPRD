            - { call: "POST /certification-projects/${p_id}/submit-phase", payload: { phase: "DESIGN" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_p}/begin-review", as: CertificationReviewer }
            - { call: "POST /credit-attempts/${a_p}/award", payload: { raw_points_earned: 40 }, as: CertificationReviewer }
            - { call: "POST /commissioning-tasks", payload: { project_id: "${p_id}", task_type: "FUNCTIONAL_TESTING", agent_id: "${m_cx}", scheduled_start: "2026-09-01T09:00:00Z", scheduled_end: "2026-09-01T12:00:00Z", is_prerequisite_linked: true }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { t_cx: $.data.id } }
            - { call: "POST /commissioning-tasks/${t_cx}/start", as: CommissioningAgent, as_user_id: "${m_cx}" }
            - { call: "POST /commissioning-tasks/${t_cx}/complete", payload: { outcome: "PASSED" }, as: CommissioningAgent, as_user_id: "${m_cx}" }
            - { call: "POST /credit-attempts/${a_c}/mark-ready", as: DocumentationSpecialist, as_user_id: "${m_spec}" }
            - { call: "POST /certification-projects/${p_id}/submit-phase", payload: { phase: "CONSTRUCTION" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_c}/begin-review", as: CertificationReviewer }
            - { call: "POST /credit-attempts/${a_c}/award", payload: { raw_points_earned: 0 }, as: CertificationReviewer }
            - { call: "POST /certification-projects/${p_id}/issue-decision", payload: { decision: "CERTIFY" }, as: CertificationReviewer }
            - { call: "POST /cost-premium-analyses", payload: { project_id: "${p_id}", incremental_construction_cost_cents: 60000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { an_id: $.data.id, total0: $.data.incentive_total_cents } }
            - { call: "POST /incentive-programs", payload: { program_name: "State Green Grant", incentive_type: "GRANT", benefit_amount_cents: 8000000, minimum_certification_level: "CERTIFIED", is_combinable: true }, as: ProgramAdmin, captures: { g1: $.data.id } }
            - { call: "POST /incentive-programs", payload: { program_name: "Federal Tax Credit", incentive_type: "TAX_CREDIT", benefit_amount_cents: 10000000, minimum_certification_level: "CERTIFIED", is_combinable: false }, as: ProgramAdmin, captures: { t1: $.data.id } }
            - { call: "POST /incentive-programs", payload: { program_name: "State Tax Credit", incentive_type: "TAX_CREDIT", benefit_amount_cents: 12000000, minimum_certification_level: "CERTIFIED", is_combinable: false }, as: ProgramAdmin, captures: { t2: $.data.id } }
            - { call: "POST /project-incentives", payload: { project_id: "${p_id}", incentive_program_id: "${g1}" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { pi_g1: $.data.id } }
            - { call: "POST /project-incentives", payload: { project_id: "${p_id}", incentive_program_id: "${t1}" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { pi_t1: $.data.id } }
            - { call: "POST /project-incentives", payload: { project_id: "${p_id}", incentive_program_id: "${t2}" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { pi_t2: $.data.id } }
            - { call: "POST /project-incentives/${pi_g1}/approve", as: ProgramAdmin }
            - { call: "POST /project-incentives/${pi_t1}/approve", as: ProgramAdmin }
            - { call: "POST /project-incentives/${pi_t2}/approve", as: ProgramAdmin }
          trigger:
            - { call: "POST /cost-premium-analyses/${an_id}/recalculate", as: ProjectAdministrator, as_user_id: "${m_admin}" }
          assert:
            - "Captured total0 == 0 (analysis predates the approvals)"
            - "CostPremiumAnalysis.${an_id}.incentive_total_cents == 20000000 (8000000 combinable + max(10000000,12000000) per-type non-combinable; cap 24000000 not binding)"
            - "CostPremiumAnalysis.${an_id}.net_cost_premium_cents == 40000000"
            - "CostPremiumAnalysis.${an_id}.simple_payback_years == 66.7 (round_half_up(40000000/600000, 1dp))"
            - "CostPremiumAnalysis.${an_id}.analysis_version == 2"

      - name: cascading_side_effects_covered
        claim_type: cascading_side_effects
        grounds: ["state_machines.EnergyModel.DRAFT_to_LOCKED", "state_machines.CreditAttempt.UNDER_REVIEW_to_AWARDED"]
        excluded_because:
          difficulty_instance: model_lock_supersede_cascade
          rationale: "N-level cascade verified end-to-end in §1.8 instances model_lock_supersede_cascade and award_bubble_up_cascade."

  - section: consistency_model
    instances:
      - name: immediate_consistency_on_award
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "calculations.credit_points_rounding"]
        distinguishing_aspect: "Immediate consistency: the award response itself carries points_awarded, and an immediate follow-up GET on the project already reflects the recomputed totals — no delay or reconciliation lag."
        test_recipe:
          setup: ["2-point DESIGN attempt UNDER_REVIEW in a submitted package"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
            - { call: "POST /team-members", payload: { full_name: "Dana Docs", email: "dana@x.com", specialty: "DOCUMENTATION" }, as: ProgramAdmin, captures: { m_spec: $.data.id } }
            - { call: "POST /credit-library-entries", payload: { credit_code: "WEc2", title: "Water metering", category: "WATER", points_possible: 2, is_prerequisite: false, phase_eligibility: "DESIGN", requires_energy_model: false }, as: ProgramAdmin, captures: { e_d: $.data.id } }
            - { call: "POST /certification-projects", payload: { project_name: "Immediate Tower", rating_system: "LEED_BD_C", compliance_path: "PRESCRIPTIVE", gross_floor_area_sqft: 120000, target_level: "CERTIFIED", fee_budget_cents: 5000000 }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { p_id: $.data.id } }
            - { call: "POST /credit-attempts", payload: { project_id: "${p_id}", credit_library_entry_id: "${e_d}", phase: "DESIGN", documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}", captures: { a_d: $.data.id } }
            - { call: "GET /certification-projects/${p_id}", as: Any, captures: { p_v: $.data.version } }
            - { call: "POST /certification-projects/${p_id}/lock-strategy", payload: { expected_project_version: "${p_v}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_d}/assign-owner", payload: { documentation_owner_id: "${m_spec}" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_d}/mark-ready", as: DocumentationSpecialist, as_user_id: "${m_spec}" }
            - { call: "POST /certification-projects/${p_id}/submit-phase", payload: { phase: "DESIGN" }, as: ProjectAdministrator, as_user_id: "${m_admin}" }
            - { call: "POST /credit-attempts/${a_d}/begin-review", as: CertificationReviewer }
          trigger:
            - { call: "POST /credit-attempts/${a_d}/award", payload: { raw_points_earned: 2 }, as: CertificationReviewer, captures: { awarded_pts: $.data.points_awarded, awarded_status: $.data.status } }
            - { call: "GET /certification-projects/${p_id}", as: Any, captures: { proj_total: $.data.points_awarded_total, proj_status: $.data.status } }
          assert:
            - "Award response: captured awarded_status == AWARDED and awarded_pts == 2 (mutation visible in the same response)"
            - "Immediate GET: captured proj_total == 2 and proj_status == DESIGN_REVIEWED (derived totals and bubble-up already applied)"
