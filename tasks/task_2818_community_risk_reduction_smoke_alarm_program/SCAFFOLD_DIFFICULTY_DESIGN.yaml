            - "HomeSafetyVisit.${v1_id}.install_status == INSTALL_COMPLETE"
            - "HomeSafetyVisit.${v1_id}.education_status == DELIVERED"
            - "HomeSafetyVisit.${v1_id}.visit_status == COMPLETED"
            - "HomeSafetyVisit.${v2_id}.install_status == INSTALL_COMPLETE"
            - "HomeSafetyVisit.${v2_id}.education_status == DECLINED"
            - "HomeSafetyVisit.${v2_id}.visit_status == COMPLETED"
            - "HomeSafetyVisit.${v1_id}.completed_at == 2026-08-01T00:00:00Z"
