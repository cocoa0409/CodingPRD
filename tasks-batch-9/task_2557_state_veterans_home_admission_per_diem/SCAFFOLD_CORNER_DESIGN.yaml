# §1.9 Scaffold Corner Design — breadth probe over SCAFFOLD.yaml §1.1-§1.7
# Domain: state-veterans-home-admission-per-diem (task_2557)
# `section:` values and `claim_type:` values are taken verbatim from the nine sections and
# per-section rows of references/claim-extraction-guide.md. Corners already asserted by a
# §1.8 instance carry an `excluded_because:` stub and no test_recipe.

scaffold_corner_design:
  - section: entities
    instances:
      - name: entity_veterans_home_creation_returns_declared_fields
        claim_type: creation
        grounds:
          - entities.VeteransHome
          - endpoints.POST_/svh/veterans-homes
          - response_envelope.success
        distinguishing_aspect: |
          A create with only the three required inputs must answer 201 with every declared
          VeteransHome field populated (not just the echoed inputs): active_resident_count 0,
          decertified_unit_count 0, last_survey_date null, recognition_suspended_reason null and
          version 1 inside the fixed envelope's data object.
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
          trigger:
            - call: "POST /svh/veterans-homes"
              payload: { name: "Alpine State Veterans Home", state_code: "CO", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id", home_v: "$.data.version" }
          assert:
            - "HTTP status == 201"
            - "response_type == object"
            - "VeteransHome.${home_id}.name == Alpine State Veterans Home"
            - "VeteransHome.${home_id}.state_code == CO"
            - "VeteransHome.${home_id}.recognition_effective_date == 2026-07-01"
            - "VeteransHome.${home_id}.recognition_status == RECOGNIZED"
            - "VeteransHome.${home_id}.recognition_suspended_reason == null"
            - "VeteransHome.${home_id}.active_resident_count == 0"
            - "VeteransHome.${home_id}.decertified_unit_count == 0"
            - "VeteransHome.${home_id}.last_survey_date == null"
            - "home_v == 1"

      - name: entity_care_unit_retrieval_matches_stored_row
        claim_type: retrieval
        grounds:
          - entities.CareUnit
          - endpoints.GET_/svh/care-units/{id}
        distinguishing_aspect: |
          GET on a freshly created unit must return the identical stored row, including the derived
          bed counts at their initial values (occupied 0, held 0, available 4 for licensed 5 minus
          out_of_service 1) and posture OPEN — proving the read is not recomputing from stale zeros.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with one NURSING CareUnit, licensed_bed_count 5, out_of_service_bed_count 1."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Bluff View State Veterans Home", state_code: "IA", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing One", care_level: "NURSING", licensed_bed_count: 5, out_of_service_bed_count: 1 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
          trigger:
            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: StateProgramAdmin
              captures: { got_name: "$.data.unit_name", got_avail: "$.data.available_bed_count", got_posture: "$.data.operational_posture", got_rate: "$.data.per_diem_rate_cents" }
          assert:
            - "HTTP status == 200"
            - "got_name == Nursing One"
            - "got_avail == 4"
            - "got_posture == OPEN"
            - "got_rate == 11857"
            - "CareUnit.${nu_id}.veterans_home_id == ${home_id}"
            - "CareUnit.${nu_id}.occupied_bed_count == 0"
            - "CareUnit.${nu_id}.held_bed_count == 0"
            - "CareUnit.${nu_id}.certification_status == CERTIFIED"
            - "CareUnit.${nu_id}.waitlist_active_count == 0"

      - name: entity_veterans_homes_listing_paginates_and_filters
        claim_type: listing
        grounds:
          - endpoints.GET_/svh/veterans-homes
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three homes exist across two states; a filtered page with state_code MN, limit 2, offset 0
          must return exactly 2 rows with total_count 2 and has_more false, while offset 2 on the
          same filter returns 0 rows with total_count still 2 — the filter must be applied before
          the window, not after.
        test_recipe:
          setup:
            - "Three VeteransHome rows: two with state_code MN and one with state_code WI."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Cascade State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { h1_id: "$.data.id" }
            - call: "POST /svh/veterans-homes"
              payload: { name: "Dovetail State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-02" }
              as: StateProgramAdmin
              captures: { h2_id: "$.data.id" }
            - call: "POST /svh/veterans-homes"
              payload: { name: "Evergreen State Veterans Home", state_code: "WI", recognition_effective_date: "2026-07-03" }
              as: StateProgramAdmin
              captures: { h3_id: "$.data.id" }
          trigger:
            - call: "GET /svh/veterans-homes"
              payload: { state_code: "MN", limit: 2, offset: 0 }
              as: StateProgramAdmin
              captures: { p1_first_state: "$.data[0].state_code", p1_second_state: "$.data[1].state_code" }
            - call: "GET /svh/veterans-homes"
              payload: { state_code: "MN", limit: 2, offset: 2 }
              as: StateProgramAdmin
          assert:
            - "first page returns exactly 2 elements in data"
            - "first page meta pagination total_count == 2"
            - "first page has_more == false"
            - "p1_first_state == MN"
            - "p1_second_state == MN"
            - "second page returns exactly 0 elements in data"
            - "second page total_count == 2"
            - "second page has_more == false"

      - name: entity_resident_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints.GET_/svh/residents/{id}
          - validations[priority=40]
          - errors.ERR_RESIDENT_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid but unknown resident id must answer 404 with
          data.error_id ERR_RESIDENT_NOT_FOUND, not 200 with a null data payload and not 422.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
          trigger:
            - call: "GET /svh/residents/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: BusinessOfficeManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 404"
            - "response_type == error"
            - "err == ERR_RESIDENT_NOT_FOUND"

      - name: entity_applicant_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_/svh/applicants
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          discharge_character has no default and is required; omitting it must answer 422
          ERR_INVALID_REQUEST before any FK existence check runs, and no Applicant row may be
          created (the home's applicant list stays empty).
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with no applicants."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Foxglove State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
          trigger:
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "No Discharge Field", date_of_birth: "1950-01-01", service_days: 900, wartime_service: true, service_connected_disability_pct: 10, nursing_care_for_service_connected: false, state_residency_years: 5, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { err: "$.data.error_id" }
            - call: "GET /svh/veterans-homes/${home_id}/applicants"
              payload: {}
              as: AdmissionsCoordinator
          assert:
            - "HTTP status == 422"
            - "err == ERR_INVALID_REQUEST"
            - "the applicants list for the home returns exactly 0 elements"

      - name: entity_veterans_home_optional_inputs_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.VeteransHome.fields.personal_needs_allowance_monthly_cents
          - entities.VeteransHome.fields.recognition_status
          - endpoints.POST_/svh/veterans-homes
        distinguishing_aspect: |
          Omitting both optional inputs must yield personal_needs_allowance_monthly_cents 9000 and
          recognition_status RECOGNIZED, while a second home that supplies PROVISIONAL and 12500
          must store those instead — the default must be a fallback, not an override.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
          trigger:
            - call: "POST /svh/veterans-homes"
              payload: { name: "Gladstone State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { d_id: "$.data.id", d_pna: "$.data.personal_needs_allowance_monthly_cents", d_status: "$.data.recognition_status" }
            - call: "POST /svh/veterans-homes"
              payload: { name: "Harborview State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01", recognition_status: "PROVISIONAL", personal_needs_allowance_monthly_cents: 12500 }
              as: StateProgramAdmin
              captures: { e_id: "$.data.id", e_pna: "$.data.personal_needs_allowance_monthly_cents", e_status: "$.data.recognition_status" }
          assert:
            - "d_pna == 9000"
            - "d_status == RECOGNIZED"
            - "e_pna == 12500"
            - "e_status == PROVISIONAL"
            - "VeteransHome.${d_id}.personal_needs_allowance_monthly_cents == 9000"
            - "VeteransHome.${e_id}.recognition_status == PROVISIONAL"

      - name: entity_care_unit_per_diem_rate_computed_from_care_level
        claim_type: computed_fields
        grounds:
          - entities.CareUnit.fields.per_diem_rate_cents
          - entities.CareUnit.fields.available_bed_count
          - calculations.care_unit_bed_availability
        distinguishing_aspect: |
          per_diem_rate_cents is computed, not supplied: three units created under one home with
          care_level NURSING, DOMICILIARY and ADULT_DAY_HEALTH must carry 11857, 5502 and 4230
          respectively, and each unit's available_bed_count must equal licensed minus out_of_service
          at creation.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with no units yet."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Ironwood State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
          trigger:
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing N", care_level: "NURSING", licensed_bed_count: 6, out_of_service_bed_count: 2 }
              as: StateProgramAdmin
              captures: { n_id: "$.data.id", n_rate: "$.data.per_diem_rate_cents", n_avail: "$.data.available_bed_count" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Domiciliary D", care_level: "DOMICILIARY", licensed_bed_count: 4, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { d_id: "$.data.id", d_rate: "$.data.per_diem_rate_cents", d_avail: "$.data.available_bed_count" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Adult Day A", care_level: "ADULT_DAY_HEALTH", licensed_bed_count: 3, out_of_service_bed_count: 1 }
              as: StateProgramAdmin
              captures: { a_id: "$.data.id", a_rate: "$.data.per_diem_rate_cents", a_avail: "$.data.available_bed_count" }
          assert:
            - "n_rate == 11857"
            - "d_rate == 5502"
            - "a_rate == 4230"
            - "n_avail == 4"
            - "d_avail == 4"
            - "a_avail == 2"
            - "CareUnit.${n_id}.certification_status == CERTIFIED"
            - "CareUnit.${d_id}.operational_posture == OPEN"
            - "CareUnit.${a_id}.veterans_home_id == ${home_id}"

      - name: entity_system_fields_supplied_on_create_input_ignored
        claim_type: system_fields
        grounds:
          - entities.VeteransHome.common_fields
          - endpoints.POST_/svh/veterans-homes
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-sourced: a create that also sends them
          must ignore the supplied values, minting a fresh id and version 1 rather than honouring
          the client's version 99 or its 1999 created_at.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
          trigger:
            - call: "POST /svh/veterans-homes"
              payload: { name: "Juniper State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01", id: "00000000-0000-4000-8000-00000000dead", version: 99, created_at: "1999-01-01T00:00:00Z" }
              as: StateProgramAdmin
              captures: { got_id: "$.data.id", got_v: "$.data.version" }
          assert:
            - "HTTP status == 201"
            - "got_v == 1"
            - "got_id != 00000000-0000-4000-8000-00000000dead"
            - "VeteransHome.${got_id}.created_at == 2026-08-01T00:00:00Z"
            - "VeteransHome.${got_id}.updated_at == 2026-08-01T00:00:00Z"

      - name: entity_care_unit_invalid_care_level_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.CareUnit.fields.care_level
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          care_level is a closed enum of three values; SKILLED_NURSING is not one of them and must
          answer 422 ERR_INVALID_REQUEST with no unit created, and a negative licensed_bed_count
          must be rejected by the same rule.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with no units."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Kestrel State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
          trigger:
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Bad Level", care_level: "SKILLED_NURSING", licensed_bed_count: 4 }
              as: StateProgramAdmin
              captures: { err1: "$.data.error_id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Bad Beds", care_level: "NURSING", licensed_bed_count: -3 }
              as: StateProgramAdmin
              captures: { err2: "$.data.error_id" }
            - call: "GET /svh/veterans-homes/${home_id}/care-units"
              payload: {}
              as: StateProgramAdmin
          assert:
            - "first call returns HTTP 422 and err1 == ERR_INVALID_REQUEST"
            - "second call returns HTTP 422 and err2 == ERR_INVALID_REQUEST"
            - "the care-units list for the home returns exactly 0 elements"

      - name: entity_income_record_zero_amount_rejected
        claim_type: type_constraints
        grounds:
          - entities.IncomeRecord.fields.monthly_amount_cents
          - validations[priority=30]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          monthly_amount_cents is a positive integer of cents; 0 and -100 must both answer 422
          ERR_INVALID_REQUEST, and effective_month must be a YYYY-MM string, so "2026-8" is also
          rejected by the same priority-30 rule rather than being silently normalised.
        test_recipe:
          setup:
            - "One Resident admitted 2026-08-01 into a CERTIFIED NURSING unit of a RECOGNIZED home."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Lupine State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Ada Winslow", date_of_birth: "1948-04-04", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${nu_id}" }
              as: AdmissionsCoordinator
              captures: { wl_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/clinical-assessments"
              payload: { assessed_care_level: "NURSING", adl_dependency_count: 4, cognitive_impairment: true, behavioral_risk_flag: false, skilled_nursing_hours_per_day: 3.00, assessment_date: "2026-08-01" }
              as: ClinicalAssessor
              as_user_id: "assessor-1"
              captures: { asmt_id: "$.data.id" }
            - call: "POST /svh/clinical-assessments/${asmt_id}/submit"
              payload: {}
              as: ClinicalAssessor
              as_user_id: "assessor-1"
            - call: "GET /svh/care-units/${nu_id}"
              payload: {}
              as: AdmissionsCoordinator
              captures: { nu_v: "$.data.version" }
            - call: "POST /svh/applicants/${app_id}/admission-decision"
              payload: { decision: "APPROVED", care_unit_id: "${nu_id}", clinical_assessment_id: "${asmt_id}", expected_care_unit_version: "${nu_v}", admission_date: "2026-08-01" }
              as: AdmissionsCoordinator
              as_user_id: "coordinator-1"
              captures: { res_id: "$.data.id" }
          trigger:
            - call: "POST /svh/residents/${res_id}/income-records"
              payload: { income_type: "SSA", monthly_amount_cents: 0, effective_month: "2026-08" }
              as: BusinessOfficeManager
              captures: { err1: "$.data.error_id" }
            - call: "POST /svh/residents/${res_id}/income-records"
              payload: { income_type: "SSA", monthly_amount_cents: -100, effective_month: "2026-08" }
              as: BusinessOfficeManager
              captures: { err2: "$.data.error_id" }
            - call: "POST /svh/residents/${res_id}/income-records"
              payload: { income_type: "SSA", monthly_amount_cents: 120000, effective_month: "2026-8" }
              as: BusinessOfficeManager
              captures: { err3: "$.data.error_id" }
            - call: "GET /svh/residents/${res_id}/income-records"
              payload: {}
              as: BusinessOfficeManager
          assert:
            - "err1 == ERR_INVALID_REQUEST"
            - "err2 == ERR_INVALID_REQUEST"
            - "err3 == ERR_INVALID_REQUEST"
            - "all three calls return HTTP 422"
            - "the income-records list for the resident returns exactly 0 elements"

      - name: entity_cost_share_determination_is_immutable
        claim_type: immutability
        grounds:
          - entities.CostShareDetermination.common_fields
          - endpoints.GET_/svh/residents/{id}/cost-share-determinations
          - endpoints.POST_/svh/residents/{id}/cost-share-determinations
        distinguishing_aspect: |
          CostShareDetermination is declared common_fields false, so its rows carry no version and
          no updated_at and §1.5 exposes no update or delete route for them. A correction is
          expressed as a SECOND immutable row for the same effective_month, leaving the first row
          byte-identical while the resident's governing figure moves to the newer row.
        test_recipe:
          setup:
            - "One Resident admitted 2026-08-01 with one VERIFIED SSA IncomeRecord of 114000 cents for 2026-08 and 31 RESIDENT_DAY census rows; PNA 9000, so net_before_medical is 105000 (TIER_2) and the PROVISIONAL tiered share is 40000 + 2750 = 42750 with 31/31 proration."
          setup_api_calls:
            - call: "POST /svh/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StateProgramAdmin
            - call: "POST /svh/veterans-homes"
              payload: { name: "Meadowlark State Veterans Home", state_code: "MN", recognition_effective_date: "2026-07-01" }
              as: StateProgramAdmin
              captures: { home_id: "$.data.id" }
            - call: "POST /svh/veterans-homes/${home_id}/care-units"
              payload: { unit_name: "Nursing A", care_level: "NURSING", licensed_bed_count: 2, out_of_service_bed_count: 0 }
              as: StateProgramAdmin
              captures: { nu_id: "$.data.id" }
            - call: "POST /svh/applicants"
              payload: { veterans_home_id: "${home_id}", full_name: "Bram Talley", date_of_birth: "1947-07-17", service_days: 900, discharge_character: "HONORABLE", wartime_service: true, service_connected_disability_pct: 80, nursing_care_for_service_connected: false, state_residency_years: 6, requested_care_level: "NURSING", application_received_date: "2026-08-01" }
              as: AdmissionsCoordinator
              captures: { app_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/eligibility-determination"
              payload: {}
              as: AdmissionsCoordinator
            - call: "POST /svh/waitlist-entries"
              payload: { applicant_id: "${app_id}", care_unit_id: "${nu_id}" }
              as: AdmissionsCoordinator
              captures: { wl_id: "$.data.id" }
            - call: "POST /svh/applicants/${app_id}/clinical-assessments"
