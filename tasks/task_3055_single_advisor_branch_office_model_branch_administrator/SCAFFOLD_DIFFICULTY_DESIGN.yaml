  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_on_declined_transfer_counter
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NEGOTIATION_TURN]
        distinguishing_aspect: |
          Category pair state vs business_safety: a counter-offer on a DECLINED
          transfer by the party who made the last offer violates BOTH the
          state rule (DECLINED is terminal — ERR_INVALID_STATE, priority 4)
          and the strict-alternation safety rule (ERR_NEGOTIATION_TURN,
          priority 6); the state error wins. A counter on a NEGOTIATING
          transfer by the last offerer isolates ERR_NEGOTIATION_TURN.
        test_recipe:
          setup:
            - "Branch with RETIRING advisor; INTERNAL transfer created (OFFERED, initial offer implicitly by retiring advisor) with escrow 200000"
            - "Successor counters (NEGOTIATING, last offer by successor), then retiring advisor declines -> DECLINED (terminal)"
            - "The successor (who made the last offer) now attempts another counter — violating both state (DECLINED terminal) and alternation (own-offer follow-up)"
          setup_api_calls:
            - call: "POST /branch-office/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: HomeOfficeAdmin
