  - section: cross_cutting
    instances:
      - name: engagement_amend_occ_stale_and_fresh
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[engagement-amend-stale-version]", "errors[ERR_STALE_ENGAGEMENT_VERSION]"]
        distinguishing_aspect: "OCC on Engagement.version: amend with the observed version succeeds and bumps it; replaying the same observed version is rejected with 412; the fresh version succeeds again."
        test_recipe:
          setup: ["engagement E1 created (version 1)"]
          setup_api_calls:
            - call: "POST /v1/engagements"
              payload: { title: "OCC", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id", eng_v: "$.data.version" }
          trigger:
            - call: "POST /v1/engagements/${e1_id}/amendments"
              payload: { expected_engagement_version: "${eng_v}", budget_cents: 1500000 }
              as: HiringManager
              captures: { eng_v2: "$.data.version" }
            - call: "POST /v1/engagements/${e1_id}/amendments"
              payload: { expected_engagement_version: "${eng_v}", budget_cents: 2000000 }
              as: HiringManager
              captures: { err: "$.data.error_id" }
            - call: "POST /v1/engagements/${e1_id}/amendments"
              payload: { expected_engagement_version: "${eng_v2}", budget_cents: 2000000 }
              as: HiringManager
              captures: { eng_v3: "$.data.version" }
          assert:
            - "first amend (expected == observed v1) succeeds: budget_cents == 1500000, version advanced to 2"
            - "second amend replaying the stale v1 -> ERR_STALE_ENGAGEMENT_VERSION (412); budget stays 1500000"
            - "third amend with the fresh v2 succeeds: budget_cents == 2000000, version == 3"

      - name: rate_card_revision_occ_stale
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rate-card-revision-stale-version]", "errors[ERR_STALE_RATE_CARD_VERSION]"]
        distinguishing_aspect: "OCC on RateCard.version: the revisions endpoint bumps the source card's version, so a second revision carrying the originally observed version is rejected with 412."
        test_recipe:
          setup: ["rate card C1 created (version 1)"]
          setup_api_calls:
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-05-01", effective_to: "2026-08-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id", rc_v: "$.data.version" }
          trigger:
            - call: "POST /v1/rate-cards/${rc_id}/revisions"
              payload: { expected_rate_card_version: "${rc_v}", bill_rate_ceiling_cents: 11500 }
              as: ProgramAdmin
              captures: { rev1_id: "$.data.id", rev1_sup: "$.data.supersedes_id" }
            - call: "POST /v1/rate-cards/${rc_id}/revisions"
              payload: { expected_rate_card_version: "${rc_v}", bill_rate_ceiling_cents: 11000 }
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "first revision succeeds: new DRAFT card ${rev1_id} with supersedes_id == ${rc_id}; source card version advanced to 2"
            - "second revision replaying stale v1 -> ERR_STALE_RATE_CARD_VERSION (412); no third card created (GET /v1/rate-cards?supersedes_id=${rc_id} returns total_count == 1)"

      - name: expire_sweep_only_expires_past_due
        claim_type: ops_run_checkpoint
        grounds: ["state_machines.DistributionOffer.OFFERED_to_EXPIRED", "endpoints.POST /v1/distribution-offers/expire-sweep"]
        distinguishing_aspect: "Ops-run checkpoint: the sweep expires only offers whose response_due_at is strictly before the logical clock; offers inside their window are untouched."
        test_recipe:
          setup:
            - "suppliers S1 PREFERRED, S2 APPROVED; E1 distributed at clock 2026-05-01 (due 2026-05-08T00:00:00Z); E2 distributed at clock 2026-05-05 (due 2026-05-12T00:00:00Z)"
