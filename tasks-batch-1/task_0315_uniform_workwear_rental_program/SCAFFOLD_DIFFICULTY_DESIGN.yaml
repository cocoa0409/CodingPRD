              as: AccountManager
            - call: "POST /assignments"
              payload: { garment_id: "${g2}", wearer_id: "${wr}" }
              as: AccountManager
            - call: "POST /assignments"
              payload: { garment_id: "${g3}", wearer_id: "${wr}" }
