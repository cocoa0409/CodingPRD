          A different category pair on a different endpoint: business_temporal (priority 44, the order's
          365-day recovery window has closed) against business_fiscal (priority 47, the fund sits exactly
          at the 500000-cent reserve floor). Both hold on the first disbursement, which must answer
          ERR_CLAIM_WINDOW_CLOSED; rewinding the clock inside the window leaves only the fiscal
