        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: cross_cutting / occ_stale_version_rejected
          rationale: "ERR_STALE_VERSION trigger asserted by the OCC layer instance."

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: anonymous_cannot_create_plans
        claim_type: role_denied
        grounds:
          - roles.Anonymous
          - roles.PlatformAdmin
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Anonymous calling POST /streaming/plans returns 403 ERR_UNAUTHORIZED (plan creation is PlatformAdmin-exclusive)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /streaming/plans"
              payload: { plan_code: "X", plan_kind: "STANDALONE", service_scope: ["DPLUS"], ad_tier: "AD_SUPPORTED", monthly_price_cents: 799, allow_app_store_billing: true, allow_distributor_billing: true }
