          assert:
            - "Pending declaration: ${err} == ERR_DG_NOT_ACCEPTED"
            - "After acceptance: assign succeeds, ${tw} == 50"

      - name: duplicate_uld_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_ULD_CODE]"]
        distinguishing_aspect: "uld_code is globally unique: the second registration of AKE00117CA fails with ERR_DUPLICATE_ULD_CODE and creates nothing."
        test_recipe:
          setup: ["ULDType AKE; ULD AKE00117CA already registered"]
          setup_api_calls:
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00117CA", uld_type_id: "${t_id}" }
              as: RampOperator
          trigger:
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00117CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { err: $.data.error_id }
            - call: "GET /cargo/ulds"
              as: RampOperator
          assert:
            - "${err} == ERR_DUPLICATE_ULD_CODE"
            - "GET /cargo/ulds returns exactly 1 row (total_count 1) — no duplicate persisted"

      - name: second_pending_dg_declaration_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_DG_CHECK_ALREADY_PENDING]"]
        distinguishing_aspect: "At most one PENDING_CHECK declaration per booking: a second filing while the first awaits check fails with ERR_DG_CHECK_ALREADY_PENDING."
        test_recipe:
          setup: ["Flight CA332; DG booking REQUESTED; declaration D1 PENDING_CHECK"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA332", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-DG3", commodity_code: "DG", pieces: 1, gross_weight_kg: 50, volume_m3: 1, is_dangerous_goods: true }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/dg-declarations"
              payload: { un_number: "UN1263", dg_class: "3", packing_group: "II", declaration_doc_ref: "DGD-1" }
              as: ForwarderAgent
              as_user_id: fwd-1
          trigger:
            - call: "POST /cargo/bookings/${b_id}/dg-declarations"
              payload: { un_number: "UN1845", dg_class: "9", packing_group: "III", declaration_doc_ref: "DGD-2" }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DG_CHECK_ALREADY_PENDING"

      - name: plan_create_with_assigned_uld_rejected
        claim_type: violation_to_error
        grounds: [state_machines.ULD.SERVICEABLE_to_ASSIGNED, "errors[ERR_ULD_NOT_SERVICEABLE]"]
        distinguishing_aspect: "A ULD already ASSIGNED to a plan on one flight cannot start a plan on another flight (ERR_ULD_NOT_SERVICEABLE) — asset state gates cross-flight reuse."
        test_recipe:
          setup: ["Flights CA333 and CA334 OPEN_FOR_BOOKING; ULD AKE00118CA ASSIGNED to a DRAFT plan on CA333"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA333", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f1: $.data.id }
            - call: "POST /cargo/flights/${f1}/open"
              as: CapacityController
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA334", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-11T08:00:00Z", scheduled_arrival: "2026-08-13T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f2: $.data.id }
            - call: "POST /cargo/flights/${f2}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00118CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "GET /cargo/flights/${f1}"
              as: RampOperator
              captures: { f1_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f1}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f1_v}" }
              as: RampOperator
          trigger:
            - call: "GET /cargo/flights/${f2}"
              as: RampOperator
              captures: { f2_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f2}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f2_v}" }
              as: RampOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_ULD_NOT_SERVICEABLE"

      - name: return_serviceable_uld_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ULD.DISPATCHED_to_RETURNED, "errors[ERR_ULD_INVALID_STATE]"]
        distinguishing_aspect: "return is defined only from DISPATCHED; on a SERVICEABLE unit it fails with ERR_ULD_INVALID_STATE and creates no charge."
        test_recipe:
          setup: ["ULDType AKE; ULD AKE00119CA SERVICEABLE"]
          setup_api_calls:
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00119CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /cargo/ulds/${u_id}/return"
              as: RampOperator
              captures: { err: $.data.error_id }
            - call: "GET /cargo/ulds/${u_id}/charges"
              as: RampOperator
          assert:
            - "${err} == ERR_ULD_INVALID_STATE"
            - "GET /cargo/ulds/${u_id}/charges returns an empty array (no charge minted by the failed transition)"

      - name: rebook_accepted_booking_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Booking.OFFLOADED_to_ACCEPTED, "errors[ERR_BOOKING_INVALID_STATE]"]
        distinguishing_aspect: "rebook is defined only from OFFLOADED; an ACCEPTED booking cannot rebook (ERR_BOOKING_INVALID_STATE) — the cycle edge has a strict entry state."
        test_recipe:
          setup: ["Flights CA335 and CA336 OPEN_FOR_BOOKING; booking ACCEPTED on CA335"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA335", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f1: $.data.id }
            - call: "POST /cargo/flights/${f1}/open"
              as: CapacityController
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA336", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-11T08:00:00Z", scheduled_arrival: "2026-08-13T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f2: $.data.id }
            - call: "POST /cargo/flights/${f2}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f1}", shipper_ref: "SHP-R2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
          trigger:
            - call: "POST /cargo/bookings/${b_id}/rebook"
              payload: { flight_id: "${f2}" }
              as: CapacityController
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BOOKING_INVALID_STATE"

      - name: cancel_departed_plan_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BuildUpPlan, "errors[ERR_PLAN_NOT_CANCELLABLE]"]
        distinguishing_aspect: "DEPARTED is terminal: cancelling a departed plan fails with ERR_PLAN_NOT_CANCELLABLE; the plan, its ULD, and its booking are untouched."
        test_recipe:
          setup: ["Flight CA337 DEPARTED with plan DEPARTED (booking LOADED, ULD DISPATCHED)"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA337", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00120CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-DP", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
          trigger:
            - call: "POST /cargo/build-up-plans/${p_id}/cancel"
              as: RampOperator
              captures: { err: $.data.error_id }
            - call: "GET /cargo/build-up-plans/${p_id}"
              as: RampOperator
              captures: { st: $.data.status }
          assert:
            - "${err} == ERR_PLAN_NOT_CANCELLABLE and ${st} == DEPARTED"

      - name: settle_submitted_claim_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Claim.APPROVED_to_SETTLED, "errors[ERR_CLAIM_NOT_APPROVED]"]
        distinguishing_aspect: "settle requires APPROVED; on a SUBMITTED claim it fails with ERR_CLAIM_NOT_APPROVED — the fork branch (approve vs reject) must be taken first."
        test_recipe:
          setup: ["Booking LOADED on departed flight CA338; claim SUBMITTED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA338", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00121CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-ST", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "POST /cargo/claims"
              payload: { booking_id: "${b_id}", claim_type: "LOSS", claimed_amount: 500, items: [{ weight_kg: 5 }] }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /cargo/claims/${c_id}/settle"
              payload: { settlement_ref: "PAY-2002" }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CLAIM_NOT_APPROVED"

      - name: accept_on_scheduled_flight_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Booking.REQUESTED_to_ACCEPTED, "errors[ERR_FLIGHT_NOT_OPEN]"]
        distinguishing_aspect: "Acceptance requires the flight OPEN_FOR_BOOKING; on a SCHEDULED flight it fails with ERR_FLIGHT_NOT_OPEN and no allocation is debited."
        test_recipe:
          setup: ["Flight CA339 SCHEDULED (never opened); booking REQUESTED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA339", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-SC", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
              captures: { err: $.data.error_id }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { aw: $.data.allocated_weight_kg }
          assert:
            - "${err} == ERR_FLIGHT_NOT_OPEN and ${aw} == 0 (no debit on failure)"

      - name: request_missing_header_context_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-ID/X-User-Role headers fails with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /cargo/flights"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (request sent with no X-User-ID / X-User-Role headers)"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: forwarder_cannot_accept_booking
        claim_type: role_exclusive_denied
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "accept is exclusive to CapacityController; a ForwarderAgent (even the booking's owner) gets ERR_FORBIDDEN."
        test_recipe:
          setup: ["Flight CA340 OPEN_FOR_BOOKING; booking by fwd-1 REQUESTED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA340", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-RB", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN (403); booking remains REQUESTED"

      - name: claims_adjuster_cannot_place_customs_hold
        claim_type: role_exclusive_denied
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "Customs holds are exclusive to CustomsOfficer; ClaimsAdjuster gets ERR_FORBIDDEN even though both are operational roles."
        test_recipe:
          setup: ["Flight CA341; booking REQUESTED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA341", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 5000, max_volume_m3: 50, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-RB2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b_id}/customs-holds"
              payload: { reason_code: "DOC_CHECK" }
              as: ClaimsAdjuster
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN (403)"

      - name: dg_inspector_cannot_create_uld
        claim_type: role_exclusive_denied
        grounds: [roles, "validations[priority=2]"]
        distinguishing_aspect: "ULD management is exclusive to RampOperator; DGInspector gets ERR_FORBIDDEN on POST /cargo/ulds."
        test_recipe:
          setup: ["ULDType AKE exists"]
          setup_api_calls:
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00122CA", uld_type_id: "${t_id}" }
              as: DGInspector
              as_user_id: dg-9
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FORBIDDEN (403)"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: weight_restriction_above_allocation_offloads_nothing
        claim_type: selector_policy
        grounds: [calculations.offload_selection, entities.Flight.fields.weight_restriction_kg]
        distinguishing_aspect: "When restricted_payload_kg >= allocated_weight_kg the selector's candidate loop never fires: zero bookings offloaded, and the restriction is still recorded on the flight."
        test_recipe:
          setup: ["Flight CA342 cap 1200 OPEN_FOR_BOOKING; B1 300kg + B2 400kg ACCEPTED (allocated 700)"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA342", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1200, max_volume_m3: 100, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-NO1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 300, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-NO2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 400, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
          trigger:
            - call: "POST /cargo/flights/${f_id}/weight-restriction"
              payload: { restricted_payload_kg: 1200 }
              as: CapacityController
              captures: { wr: $.data.weight_restriction_kg }
            - call: "GET /cargo/bookings/${b1}"
              as: CapacityController
              captures: { s1: $.data.status }
            - call: "GET /cargo/bookings/${b2}"
              as: CapacityController
              captures: { s2: $.data.status }
          assert:
            - "${wr} == 1200 (restriction recorded) and ${s1} == ACCEPTED and ${s2} == ACCEPTED (required_reduction <= 0 -> empty offload set)"

      - name: offload_priority_order_newest_first
        claim_type: selector_policy
        grounds: [calculations.offload_selection]
        excluded_because:
          difficulty_instance: weight_restriction_offload_cascade
          rationale: "The §1.8 cascade instance pins the newest-first ranking: B3 (500kg, latest created) is offloaded while older B1/B2 remain ACCEPTED."

      - name: provisional_demurrage_amount_at_dispatch
        claim_type: correct_result
        grounds: [calculations.demurrage_calculation]
        excluded_because:
          difficulty_instance: demurrage_provisional_vs_final_diverge
          rationale: "The §1.8 instance asserts the PROVISIONAL charge (50.00, tier1 1, tier2 0) immediately after departure."

      - name: error_customs_hold_active_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMS_HOLD_ACTIVE]"]
        excluded_because:
          difficulty_instance: assign_blocked_by_active_customs_hold
          rationale: "The §1.8 cross-entity instance asserts ERR_CUSTOMS_HOLD_ACTIVE as its negative leg."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: effects_visible_immediately_in_same_response
        claim_type: immediate_visibility
        grounds: [complexity_profile, entities.Flight.fields.allocated_weight_kg]
        distinguishing_aspect: "Immediate consistency: the accept response itself shows status ACCEPTED, and the very next GET of the flight shows the debited allocation — no read-repair or lag."
        test_recipe:
          setup: ["Flight CA343 cap 1000 OPEN_FOR_BOOKING; booking 250kg REQUESTED"]
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA343", origin: "LAX", destination: "HKG", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 100, uld_position_count: 4, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-IM", commodity_code: "GEN", pieces: 1, gross_weight_kg: 250, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
              captures: { st: $.data.status }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { aw: $.data.allocated_weight_kg, av: $.data.allocated_volume_m3 }
          assert:
            - "${st} == ACCEPTED (mutation visible in the same response)"
            - "${aw} == 250 and ${av} == 1 (cross-entity derived fields consistent on the immediately-following read)"
