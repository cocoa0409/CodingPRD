scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: buying_power_reg_t_vs_pma_divergence
        grounds:
          - calculations.buying_power
          - entities.Account.fields.buying_power_cents
          - state_machines.MarginUpgrade.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Two accounts with identical equity_cents=20000000 and no positions yield Account.buying_power_cents=40000000 under REG_T but 133333333 under PMA — divergence lives on the Account margin domain."
        test_recipe:
          setup:
            - "Account A opened, activated, equity 20000000 (cash 20000000, no positions), upgraded to REG_T."
            - "Account B opened, activated, equity 20000000, upgraded to PMA."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 20000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /margin-upgrades"
              payload: { account_id: "${acct_a}", requested_margin_type: "REG_T" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { mu_a: $.data.id }
            - call: "POST /margin-upgrades/${mu_a}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /accounts/${acct_a}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { ver_a: $.data.version }
            - call: "POST /margin-upgrades/${mu_a}/approve"
              payload: { expected_account_version: "${ver_a}" }
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_b", legal_name: "B Holder", tax_id: "222-22-2222", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 20000000 }
              as: AccountHolder
              as_user_id: "h_b"
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_b}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /margin-upgrades"
              payload: { account_id: "${acct_b}", requested_margin_type: "PMA" }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { mu_b: $.data.id }
            - call: "POST /margin-upgrades/${mu_b}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "GET /accounts/${acct_b}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { ver_b: $.data.version }
            - call: "POST /margin-upgrades/${mu_b}/approve"
              payload: { expected_account_version: "${ver_b}" }
              as: ComplianceOfficer
              as_user_id: "co_2"
          trigger:
            - call: "GET /accounts/${acct_a}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { bp_a: $.data.buying_power_cents }
            - call: "GET /accounts/${acct_b}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
              captures: { bp_b: $.data.buying_power_cents }
          assert:
            - "Account.${acct_a}.buying_power_cents == 40000000"
            - "Account.${acct_b}.buying_power_cents == 133333333"
            - "Account.${acct_a}.buying_power_cents != Account.${acct_b}.buying_power_cents"

      - name: order_notional_sell_to_close_vs_open_exposure
        grounds:
          - calculations.order_notional
          - entities.Order.fields.notional_cents
          - state_machines.Order.DRAFT_to_ACCEPTED
        distinguishing_aspect: "A SELL LIMIT order over an existing OPEN long Position reserves notional_cents=0, whereas the same SELL with no matching long Position reserves 500000 — divergence lives on the Order/Position domain, not the Account margin domain."
        test_recipe:
          setup:
            - "Account A active, CASH, cash 1000000."
            - "Account A holds one OPEN long EQUITY Position symbol ACME quantity 10."
            - "Account B active, CASH, cash 1000000, no positions."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /positions"
              payload: { account_id: "${acct_a}", symbol: "ACME", instrument_type: "EQUITY", quantity: 10, market_value_cents: 500000 }
              as: AccountHolder
              as_user_id: "h_a"
            - call: "POST /orders"
              payload: { account_id: "${acct_a}", symbol: "ACME", instrument_type: "EQUITY", side: "SELL", order_type: "LIMIT", quantity: 10, limit_price_cents: 50000, trade_date: "2026-06-01" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { ord_close: $.data.id }
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_b", legal_name: "B Holder", tax_id: "222-22-2222", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_b"
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_b}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /orders"
              payload: { account_id: "${acct_b}", symbol: "ACME", instrument_type: "EQUITY", side: "SELL", order_type: "LIMIT", quantity: 10, limit_price_cents: 50000, trade_date: "2026-06-01" }
              as: AccountHolder
              as_user_id: "h_b"
              captures: { ord_open: $.data.id }
          trigger:
            - call: "POST /orders/${ord_close}/accept"
              payload: {}
              as: AccountHolder
              as_user_id: "h_a"
            - call: "POST /orders/${ord_open}/accept"
              payload: {}
              as: AccountHolder
              as_user_id: "h_b"
          assert:
            - "Order.${ord_close}.notional_cents == 0"
            - "Order.${ord_open}.notional_cents == 500000"
            - "Order.${ord_close}.notional_cents != Order.${ord_open}.notional_cents"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: maintenance_margin_round_per_position_then_sum
        grounds:
          - calculations.maintenance_margin_requirement
          - entities.Account.fields.maintenance_margin_cents
          - state_machines.Position.OPEN_to_CLOSED
        distinguishing_aspect: "Mode (b) nested rounding: two OPEN EQUITY positions with market_value 6 and 6 give floor(6*0.25)=1 each summed to 2 (round-per-position-then-sum), NOT floor((6+6)*0.25)=3 (sum-then-round) — the scaffold pins per-position floor, so the answer is 2 not 3."
        test_recipe:
          setup:
            - "Account active, CASH, two OPEN EQUITY positions with market_value_cents 6 and 6."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /positions"
              payload: { account_id: "${acct_a}", symbol: "AAA", instrument_type: "EQUITY", quantity: 1, market_value_cents: 6 }
              as: AccountHolder
              as_user_id: "h_a"
            - call: "POST /positions"
              payload: { account_id: "${acct_a}", symbol: "BBB", instrument_type: "EQUITY", quantity: 1, market_value_cents: 6 }
              as: AccountHolder
              as_user_id: "h_a"
          trigger:
            - call: "GET /accounts/${acct_a}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { mm: $.data.maintenance_margin_cents }
          assert:
            - "Account.${acct_a}.maintenance_margin_cents == 2"

      - name: take_profit_notional_worst_case_leg_with_option_multiplier
        grounds:
          - calculations.order_notional
          - calculations.trigger_eligibility
          - entities.Order.fields.notional_cents
        distinguishing_aspect: "Mode (a) ≥3-input non-linear: notional = quantity * max(limit_price_cents, stop_price_cents) * (100 if OPTION else 1); a TAKE_PROFIT OPTION with qty 2, limit 30000, stop 40000 selects the 40000 leg then applies x100 = 8000000, combining order_type branch, max selection, and instrument multiplier."
        test_recipe:
          setup:
            - "Account active, options_level 1 (granted via one approval), CASH, cash 100000000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 100000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals"
              payload: { account_id: "${acct_a}", requested_level: 1 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { oa1: $.data.id }
            - call: "POST /options-approvals/${oa1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals/${oa1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "POST /orders"
              payload: { account_id: "${acct_a}", symbol: "OPT", instrument_type: "OPTION", side: "BUY", order_type: "TAKE_PROFIT", quantity: 2, limit_price_cents: 30000, stop_price_cents: 40000, trade_date: "2026-06-01" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { ord_tp: $.data.id }
          trigger:
            - call: "POST /orders/${ord_tp}/accept"
              payload: {}
              as: AccountHolder
              as_user_id: "h_a"
              captures: { notional: $.data.notional_cents }
          assert:
            - "Order.${ord_tp}.notional_cents == 8000000"
            - "Order.${ord_tp}.status == ACCEPTED"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: options_approval_branching_approve_vs_reject
        grounds:
          - state_machines.OptionsApproval.SUBMITTED_to_APPROVED
          - state_machines.OptionsApproval.SUBMITTED_to_REJECTED
          - entities.Account.fields.options_level
        distinguishing_aspect: "OptionsApproval forks from SUBMITTED to APPROVED (side-effect: Account.options_level=requested_level) or REJECTED (no level change) — divergent side-effect sets per branch on the OptionsApproval entity."
        test_recipe:
          setup:
            - "Account active; one approval submitted and approved (level 1); a second approval submitted and rejected (would have been level 2)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals"
              payload: { account_id: "${acct_a}", requested_level: 1 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { oa1: $.data.id }
            - call: "POST /options-approvals/${oa1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals/${oa1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "POST /options-approvals"
              payload: { account_id: "${acct_a}", requested_level: 2 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { oa2: $.data.id }
            - call: "POST /options-approvals/${oa2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /options-approvals/${oa2}/reject"
              payload: { rejection_reason: "documentation incomplete" }
              as: ComplianceOfficer
              as_user_id: "co_2"
          assert:
            - "OptionsApproval.${oa1}.status == APPROVED"
            - "OptionsApproval.${oa2}.status == REJECTED"
            - "Account.${acct_a}.options_level == 1"

      - name: acat_transfer_branching_settle_vs_reject_vs_cancel
        grounds:
          - state_machines.AcatTransfer.REQUESTED_to_VALIDATED
          - state_machines.AcatTransfer.VALIDATED_to_SETTLED
          - state_machines.AcatTransfer.REQUESTED_to_REJECTED
        distinguishing_aspect: "AcatTransfer forks from REQUESTED to VALIDATED→SETTLED (side-effect: Account.cash_balance_cents adjusted) versus REJECTED (no balance change) — divergent side-effect sets per branch on the AcatTransfer entity, distinct from OptionsApproval."
        test_recipe:
          setup:
            - "Account active, CASH, cash 0. Transfer T1 IN value 500000 settled; transfer T2 IN value 999999 rejected."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /acat-transfers"
              payload: { account_id: "${acct_a}", direction: "IN", counterparty_dtc: "0226", transfer_value_cents: 500000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { t1: $.data.id }
            - call: "POST /acat-transfers/${t1}/validate"
              payload: {}
              as: Custodian
              as_user_id: "cust_1"
            - call: "POST /acat-transfers/${t1}/settle"
              payload: {}
              as: Custodian
              as_user_id: "cust_1"
            - call: "POST /acat-transfers"
              payload: { account_id: "${acct_a}", direction: "IN", counterparty_dtc: "0226", transfer_value_cents: 999999 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /acat-transfers/${t2}/reject"
              payload: { reject_code: "SSN_MISMATCH" }
              as: Custodian
              as_user_id: "cust_1"
          assert:
            - "AcatTransfer.${t1}.status == SETTLED"
            - "AcatTransfer.${t2}.status == REJECTED"
            - "Account.${acct_a}.cash_balance_cents == 500000"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: restrict_cancels_order_releases_notional_recomputes_buying_power
        grounds:
          - state_machines.Account.ACTIVE_to_RESTRICTED
          - state_machines.Order.ACCEPTED_to_CANCELLED
          - calculations.buying_power
        distinguishing_aspect: "Depth-3 chain: restrict(Account) -> Order ACCEPTED->CANCELLED -> reserved notional released -> Account.buying_power_cents recomputed back to 1000000; each hop caused by the prior, originating from the Account restrict transition."
        test_recipe:
          setup:
            - "Account active, CASH, cash 1000000; one ACCEPTED LIMIT order reserving notional 600000 (buying_power 400000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /orders"
              payload: { account_id: "${acct_a}", symbol: "ACME", instrument_type: "EQUITY", side: "BUY", order_type: "LIMIT", quantity: 6, limit_price_cents: 100000, trade_date: "2026-06-01" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/accept"
              payload: {}
              as: AccountHolder
              as_user_id: "h_a"
          trigger:
            - call: "POST /accounts/${acct_a}/restrict"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "Account.${acct_a}.status == RESTRICTED"
            - "Order.${ord}.status == CANCELLED"
            - "Account.${acct_a}.buying_power_cents == 1000000"

      - name: acat_settle_in_raises_cash_recomputes_buying_power
        grounds:
          - state_machines.AcatTransfer.VALIDATED_to_SETTLED
          - calculations.buying_power
          - entities.Account.fields.cash_balance_cents
        distinguishing_aspect: "Depth-2 chain originating from AcatTransfer settle (distinct trigger from the restrict cascade): settle(IN) -> Account.cash_balance_cents += 500000 -> Account.buying_power_cents recomputed to 500000."
        test_recipe:
          setup:
            - "Account active, CASH, cash 0, buying_power 0; one VALIDATED IN transfer value 500000."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 30000000, annual_income_cents: 30000000, investment_experience: "GOOD" }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /acat-transfers"
              payload: { account_id: "${acct_a}", direction: "IN", counterparty_dtc: "0226", transfer_value_cents: 500000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { t1: $.data.id }
            - call: "POST /acat-transfers/${t1}/validate"
              payload: {}
              as: Custodian
              as_user_id: "cust_1"
          trigger:
            - call: "POST /acat-transfers/${t1}/settle"
              payload: {}
              as: Custodian
              as_user_id: "cust_1"
          assert:
            - "AcatTransfer.${t1}.status == SETTLED"
            - "Account.${acct_a}.cash_balance_cents == 500000"
            - "Account.${acct_a}.buying_power_cents == 500000"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: segregation_beats_suitability_on_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.OptionsApproval.SUBMITTED_to_APPROVED
        distinguishing_aspect: "When the submitter (whose investment_experience=GOOD also fails the level-4 suitability gate) approves their own level-4 application, ERR_SEGREGATION_OF_DUTIES (priority 5, business_referential) is returned, NOT ERR_SUITABILITY_NOT_MET (priority 7, business_safety)."
        test_recipe:
          setup:
            - "Account active at options_level 3 (combined 12000000 passes L1-L3; experience GOOD fails L4 exp_rank). A level-4 approval submitted by co_1."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { account_holder_user_id: "h_a", legal_name: "A Holder", tax_id: "111-11-1111", date_of_birth: "1980-01-01", w9_certified: true, liquid_net_worth_cents: 6000000, annual_income_cents: 6000000, investment_experience: "GOOD", cash_balance_cents: 1000000 }
              as: AccountHolder
              as_user_id: "h_a"
              captures: { acct_a: $.data.id }
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals"
              payload: { account_id: "${acct_a}", requested_level: 1 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { oa1: $.data.id }
            - call: "POST /options-approvals/${oa1}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals/${oa1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "POST /options-approvals"
              payload: { account_id: "${acct_a}", requested_level: 2 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { oa2: $.data.id }
            - call: "POST /options-approvals/${oa2}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals/${oa2}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "POST /options-approvals"
              payload: { account_id: "${acct_a}", requested_level: 3 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { oa3: $.data.id }
            - call: "POST /options-approvals/${oa3}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
            - call: "POST /options-approvals/${oa3}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_2"
            - call: "POST /options-approvals"
              payload: { account_id: "${acct_a}", requested_level: 4 }
              as: ComplianceOfficer
              as_user_id: "co_1"
              captures: { oa4: $.data.id }
            - call: "POST /options-approvals/${oa4}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          trigger:
            - call: "POST /options-approvals/${oa4}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co_1"
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: invalid_state_beats_buying_power_on_accept
        grounds:
