              payload: { name: "Eastshore Insurance Group" }
              as: BureauAdmin
              captures: { es_client_v_fresh: "$.data.version" }
          trigger:
            - call: "POST /bureau/presort-batches/${es_batch_id}/seal"
              payload: { expected_client_version: "${es_client_v_stale}" }
              as: PostageController
              as_user_id: "postage-1"
