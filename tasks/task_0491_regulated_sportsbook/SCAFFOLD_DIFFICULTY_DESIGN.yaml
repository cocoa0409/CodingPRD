              as: Bettor
              as_user_id: "${acct}"
            - call: "POST /events"
              payload: { sport: "NBA", home_team: "H", away_team: "A", starts_at: "2026-02-01T18:00:00Z" }
              as: TradingOps
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/markets"
              payload: { market_type: "MONEYLINE", liability_cap_cents: 90000000 }
              as: TradingOps
              captures: { mkt: $.data.id }
            - call: "POST /markets/${mkt}/selections"
              payload: { name: "HOME", american_odds: -150 }
