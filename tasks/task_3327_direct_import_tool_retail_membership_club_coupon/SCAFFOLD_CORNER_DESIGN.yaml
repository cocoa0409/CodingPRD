# =============================================================================
# SCAFFOLD_CORNER_DESIGN (§1.9) — breadth coverage of claims not in §1.8
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: item_creation_required_fields_and_defaults
        claim_type: creation
        grounds: [entities.Item]
        distinguishing_aspect: "POST /items with all required fields returns 201, lifecycle_status defaults to DRAFT, open_recall_count 0, current_landed_unit_cost_cents null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "E1", name: "Hammer", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1200, member_price_cents: 1100, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /items/${item_id}"
              payload: {}
              as: PurchasingManager
          assert:
            - "Item.${item_id}.lifecycle_status == DRAFT"
            - "Item.${item_id}.open_recall_count == 0"
            - "Item.${item_id}.current_landed_unit_cost_cents == null"
            - "Item.${item_id}.version == 1"

      - name: item_member_price_above_retail_rejected
        claim_type: violation_to_error
        grounds: [entities.Item.fields.member_price_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "member_price_cents > unit_retail_cents violates the domain constraint at creation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /items"
              payload: { sku: "E2", name: "Bad", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1500, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: item_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PurchasingManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: small_format_assortment_cap
        claim_type: violation_to_error
        grounds: [entities.Store.fields.format, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "SMALL_FORMAT store created with > 8 assortment entries (9 supplied) is rejected; the cap is format-conditional (STANDARD is unbounded)."
        test_recipe:
          setup: ["one ACTIVE item (referenced 2001 times in the assortment list)"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "E3", name: "Nail", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 100, member_price_cents: 100, floor_margin_pct: 0.01, lead_time_days: 15, unit_weight_kg: 0.01 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /stores"
              payload: { store_code: "ST-SF", name: "Small", format: "SMALL_FORMAT", market_tier: "SECONDARY", receiving_capacity_units: 100, assortment_item_ids: ["${item_id}", "${item_id}", "${item_id}", "${item_id}", "${item_id}", "${item_id}", "${item_id}", "${item_id}", "${item_id}"] }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: membership_unique_per_customer
        claim_type: violation_to_error
        grounds: [entities.Membership.fields.customer_id, "errors[ERR_MEMBERSHIP_EXISTS]"]
        distinguishing_aspect: "A second membership enrollment for the same customer is rejected with ERR_MEMBERSHIP_EXISTS."
        test_recipe:
          setup: ["customer with an ACTIVE CLUB membership"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "e5@x.com", full_name: "Cust Five" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/membership"
              payload: { tier: "CLUB" }
              as: StoreClerk
          trigger:
            - call: "POST /customers/${cust_id}/membership"
              payload: { tier: "CLUB_PLUS" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MEMBERSHIP_EXISTS"

      - name: warranty_line_requires_covered_item_on_same_sale
        claim_type: violation_to_error
        grounds: [entities.SaleLine.fields.covered_item_id, "errors[ERR_INVALID_REFERENCE]"]
        distinguishing_aspect: "A warranty line whose covered_item_id is not one of the sale's merchandise line items is rejected (referential integrity within the sale aggregate)."
        test_recipe:
          setup: ["items I1 and I2 ACTIVE; store carries both; customer; OPEN sale with a merchandise line of I1 only"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "E6A", name: "Drill", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 5000, member_price_cents: 4500, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 2.0 }
              as: PurchasingManager
              captures: { i1: $.data.id }
            - call: "POST /items/${i1}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /items"
              payload: { sku: "E6B", name: "Saw", brand_tier: "MID", origin_country: "CN", unit_retail_cents: 7000, member_price_cents: 6500, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 3.0 }
              as: PurchasingManager
              captures: { i2: $.data.id }
            - call: "POST /items/${i2}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST-E6", name: "Store E6", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${i1}", "${i2}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e6@x.com", full_name: "Cust Six" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${i1}", quantity: 1 }
              as: StoreClerk
          trigger:
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${i1}", quantity: 1, is_warranty_line: true, covered_item_id: "${i2}", warranty_price_cents: 900 }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REFERENCE (I2 is not a merchandise line on THIS sale)"

      - name: container_line_item_must_be_on_po
        claim_type: violation_to_error
        grounds: [entities.Container.fields.lines, "errors[ERR_INVALID_REFERENCE]"]
        distinguishing_aspect: "Booking a container line for an item absent from the PO's lines is rejected."
        test_recipe:
          setup: ["items A and B ACTIVE; PO issued with only A"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "E7A", name: "A", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { ia: $.data.id }
            - call: "POST /items/${ia}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /items"
              payload: { sku: "E7B", name: "B", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { ib: $.data.id }
            - call: "POST /items/${ib}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-E7"
                lines: [ { item_id: "${ia}", quantity: 2, unit_cost_cents: 500 } ]
                estimated_duty_cents: 0
                estimated_freight_cents: 0
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
          trigger:
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-E7"
                lines: [ { item_id: "${ib}", quantity: 1 } ]
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REFERENCE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: item_terminal_discontinued_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Item]
        distinguishing_aspect: "From DISCONTINUED no transitions exist: activate is rejected."
        test_recipe:
          setup: ["item DISCONTINUED"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SM1", name: "X", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /items/${item_id}/discontinue"
              payload: {}
              as: PurchasingManager
          trigger:
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: po_cancel_with_shipped_container_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PurchaseOrder.ISSUED_to_CANCELLED, "errors[ERR_PO_HAS_SHIPPED_CONTAINERS]"]
        distinguishing_aspect: "PO cancel after a container has DEPARTED is rejected; the same cancel succeeds while the container is still BOOKED (then cascades container cancel)."
        test_recipe:
          setup: ["item ACTIVE; PO1 issued with container departed; PO2 issued with container still booked"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SM2", name: "Y", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-SM2A"
                lines: [ { item_id: "${item_id}", quantity: 2, unit_cost_cents: 500 } ]
                estimated_duty_cents: 0
                estimated_freight_cents: 0
              as: PurchasingManager
              captures: { po1: $.data.id }
            - call: "POST /purchase-orders/${po1}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po1}"
                container_number: "C-SM2A"
                lines: [ { item_id: "${item_id}", quantity: 2 } ]
              as: LogisticsCoordinator
              captures: { c1: $.data.id }
            - call: "POST /containers/${c1}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-SM2B"
                lines: [ { item_id: "${item_id}", quantity: 1, unit_cost_cents: 500 } ]
                estimated_duty_cents: 0
                estimated_freight_cents: 0
              as: PurchasingManager
              captures: { po2: $.data.id }
            - call: "POST /purchase-orders/${po2}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po2}"
                container_number: "C-SM2B"
                lines: [ { item_id: "${item_id}", quantity: 1 } ]
              as: LogisticsCoordinator
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /purchase-orders/${po1}/cancel"
              payload: {}
              as: PurchasingManager
              captures: { err: $.data.error_id }
            - call: "POST /purchase-orders/${po2}/cancel"
              payload: {}
              as: PurchasingManager
          assert:
            - "err == ERR_PO_HAS_SHIPPED_CONTAINERS"
            - "PurchaseOrder.${po2}.status == CANCELLED"
            - "Container.${c2}.status == CANCELLED (cascade)"

      - name: coupon_terminal_exhausted_no_reactivate
        claim_type: terminal_lockdown
        grounds: [state_machines.Coupon]
        distinguishing_aspect: "EXHAUSTED is terminal: activating an exhausted coupon is rejected."
        test_recipe:
          setup: ["item ACTIVE; store; customer; coupon budget 100, FIXED_AMOUNT_OFF_BASKET 100; one completed sale spends the full budget -> EXHAUSTED"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SM3", name: "Z", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST-SM3", name: "S", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "sm3@x.com", full_name: "C" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /coupons"
              payload: { code: "EXH1", channel: "APP", audience: "ALL", discount_type: "FIXED_AMOUNT_OFF_BASKET", discount_value: 100, per_customer_limit: 9, budget_cents: 100, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: MarketingManager
              captures: { coupon_id: $.data.id }
            - call: "POST /coupons/${coupon_id}/activate"
              payload: {}
              as: MarketingManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${sale_id}/apply-coupon"
              payload: { coupon_code: "EXH1" }
              as: StoreClerk
            - call: "POST /sales/${sale_id}/complete"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /coupons/${coupon_id}/activate"
              payload: {}
              as: MarketingManager
              captures: { err: $.data.error_id }
          assert:
            - "Coupon.${coupon_id}.status == EXHAUSTED (budget_spent 100 >= budget 100)"
            - "err == ERR_INVALID_STATE"

      - name: membership_lapse_and_grace_renewal
        claim_type: valid_transition
        grounds: [state_machines.Membership.ACTIVE_to_LAPSED, state_machines.Membership.LAPSED_to_ACTIVE]
        distinguishing_aspect: "Clock past expires_at lapses the membership (lazy); renewal within 30-day grace reactivates and extends expires_at from the ORIGINAL expiry (max rule) + 365 days."
        test_recipe:
          setup: ["customer enrolled at clock 2026-09-01 (expires 2027-09-01); clock advanced to 2027-09-10 (within grace)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /customers"
              payload: { email: "sm4@x.com", full_name: "C4" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/membership"
              payload: { tier: "CLUB" }
              as: StoreClerk
              captures: { memb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-10T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "GET /memberships/${memb_id}"
              payload: {}
              as: StoreClerk
            - call: "POST /memberships/${memb_id}/renew"
              payload: {}
              as: StoreClerk
          assert:
            - "GET observed status LAPSED before renewal"
            - "after renew: Membership.${memb_id}.status == ACTIVE"
            - "Membership.${memb_id}.expires_at == 2028-09-09 (max(2027-09-01, 2027-09-10) + 365d = 2027-09-10 + 365d)"
        note: "assert uses the max() rule: expires 2027-09-01 vs now 2027-09-10 -> base is 2027-09-10, +365 days"

      - name: membership_renewal_after_grace_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.Membership.LAPSED_to_ACTIVE, "errors[ERR_RENEWAL_WINDOW_CLOSED]"]
        distinguishing_aspect: "Renewal at or beyond expires_at + 30 days is rejected; the boundary (29 days after expiry OK, 30 days after expiry rejected) is pinned."
        test_recipe:
          setup: ["customer enrolled at 2026-09-01; clock advanced to 2027-10-01 (30 days after 2027-09-01 expiry)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /customers"
              payload: { email: "sm5@x.com", full_name: "C5" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/membership"
              payload: { tier: "CLUB" }
              as: StoreClerk
              captures: { memb_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /memberships/${memb_id}/renew"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RENEWAL_WINDOW_CLOSED"

      - name: sale_void_from_completed_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Sale]
        distinguishing_aspect: "VOID is only from OPEN; voiding a COMPLETED sale is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["item ACTIVE; store; customer; completed sale"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "SM6", name: "V", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.05, lead_time_days: 30, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST-SM6", name: "S6", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "sm6@x.com", full_name: "C6" }
              as: StoreClerk
              captures: { cust_id: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust_id}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${sale_id}/complete"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /sales/${sale_id}/void"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: renewal_fee_tier_boundary_inclusive
        claim_type: constants_applied
        grounds: [calculations.renewal_fee_tier]
        distinguishing_aspect: "Tier boundary is INCLUSIVE: settled savings exactly 5000 yields FEE_MID 2999; savings 4999 yields FEE_HIGH 3999. CLUB_PLUS ignores savings entirely (6999)."
        test_recipe:
          setup:
            - "item ACTIVE retail 5500 member 500 (savings 5000 per unit)"
            - "customer C1 with CLUB membership and one completed 1-unit member sale (settled savings exactly 5000)"
            - "customer C2 with CLUB membership and no sales (savings 0)"
            - "customer C3 enrolls as CLUB_PLUS"
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "CALC1", name: "Gen", brand_tier: "MID", origin_country: "CN", unit_retail_cents: 5500, member_price_cents: 500, floor_margin_pct: 0.01, lead_time_days: 30, unit_weight_kg: 10.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST-C1", name: "SC1", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 500, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "calc1@x.com", full_name: "C1" }
              as: StoreClerk
              captures: { c1: $.data.id }
            - call: "POST /customers/${c1}/membership"
              payload: { tier: "CLUB" }
              as: StoreClerk
              captures: { m1: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${c1}" }
              as: StoreClerk
              captures: { s1: $.data.id }
            - call: "POST /sales/${s1}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${s1}/complete"
              payload: {}
              as: StoreClerk
            - call: "POST /customers"
              payload: { email: "calc2@x.com", full_name: "C2" }
              as: StoreClerk
              captures: { c2: $.data.id }
            - call: "POST /customers/${c2}/membership"
              payload: { tier: "CLUB" }
              as: StoreClerk
              captures: { m2: $.data.id }
            - call: "POST /customers"
              payload: { email: "calc3@x.com", full_name: "C3" }
              as: StoreClerk
              captures: { c3: $.data.id }
          trigger:
            - call: "POST /memberships/${m1}/renew"
              payload: {}
              as: StoreClerk
            - call: "POST /memberships/${m2}/renew"
              payload: {}
              as: StoreClerk
            - call: "POST /customers/${c3}/membership"
              payload: { tier: "CLUB_PLUS" }
              as: StoreClerk
              captures: { m3_fee: $.data.renewal_fee_cents }
          assert:
            - "Membership.${m1}.settled_savings_cents == 5000 (exactly TIER_MID)"
            - "Membership.${m1}.renewal_fee_cents == 2999 (inclusive boundary -> FEE_MID)"
            - "Membership.${m2}.renewal_fee_cents == 3999 (savings 0 -> FEE_HIGH)"
            - "m3_fee == 6999 (CLUB_PLUS flat)"

