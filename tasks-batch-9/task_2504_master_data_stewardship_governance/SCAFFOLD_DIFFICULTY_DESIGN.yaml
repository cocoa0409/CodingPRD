            - "${cra_count} == 2 and ${cra_lead} == 10 and ${cra_earliest} == 2026-08-15T00:00:00Z"
            - "${cra_status_sched} == SCHEDULED and ${cra_fw_start} == 2026-08-14T00:00:00Z and ${cra_fw_end} == 2026-08-17T00:00:00Z"
