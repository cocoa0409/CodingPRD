            - "The logical clock sits at 2027-07-08T09:00:00Z, before the party window and before every shift, so all three closure preconditions (end_iso > clock) hold."
            - "The season's reserve counters both start at 0: no membership has reached PAID and no manual contribution has been booked."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-08T09:00:00Z" }
              as: SystemOperator
