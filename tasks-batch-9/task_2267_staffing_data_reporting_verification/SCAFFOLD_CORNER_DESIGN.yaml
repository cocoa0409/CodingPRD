            - "QuarterlySubmission.${sub}.status is still DRAFT with validated_by_worker_id == null"
            - "GET /submissions/${sub}/findings returns total_count == 0 because no finding rows were created"

      - name: submission_accept_side_effects_store_audit_score_and_accepted_at
        claim_type: side_effect_execution
