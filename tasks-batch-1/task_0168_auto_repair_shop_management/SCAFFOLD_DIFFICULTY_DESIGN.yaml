              payload: {}
              as: ShopManager
              captures: { eff: $.data.efficiency_pct, act: $.data.banked_actual_hours }
          assert:
            - "Technician.${tech_id}.banked_actual_hours == 0"
            - "Technician.${tech_id}.efficiency_pct == null"

