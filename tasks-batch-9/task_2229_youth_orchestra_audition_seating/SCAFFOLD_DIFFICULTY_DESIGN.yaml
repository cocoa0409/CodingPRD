  - rule_id: boundary_precision_check
    instances:
      - name: attendance_index_exactly_80_vs_79_17
        grounds:
          - calculations.attendance_eligibility_index
          - entities.EventParticipation.fields.attendance_index
          - entities.EventParticipation.fields.performance_eligibility
          - entities.EventParticipation.fields.ineligibility_reason
          - state_machines.EventParticipation.UNREVIEWED_to_ELIGIBLE
          - state_machines.EventParticipation.UNREVIEWED_to_INELIGIBLE
        distinguishing_aspect: |
          Metric: attendance_index, a 2-decimal weighted percentage compared with
          >= against ATTENDANCE_ELIGIBILITY_THRESHOLD 80.00, exercised on POST
          /event-participations/{participationId}/eligibility-review. Concert A
          lands on exactly 80.00 (4 PRESENT + 1 UNEXCUSED_ABSENT over 5 counted
          rows) and must be ELIGIBLE because the comparison is inclusive;
          Concert B adds one EXCUSED_ABSENT (weight 0.75) and lands on 79.17
          (exact 79.1666..., round_half_up to 2 dp) and must be INELIGIBLE. A
          truncating implementation, an exclusive >, or a 1-decimal rounding all
          break on this pair.
        test_recipe:
          setup:
            - "One season at IN_SEASON with one seated PHILHARMONIC violinist."
            - "Six REHEARSAL events on 2026-10-02, 10-09, 10-16, 10-23, 10-30 and 11-06, each 19:00-21:00, all with participation rows for the member."
            - "Two CONCERT events, A on 2026-11-05 and B on 2026-11-20, both with eligibility_window_start 2026-10-01T00:00:00Z and soloist_selection_mode NONE, each with a participation row for the member."
            - "Attendance recorded through 2026-10-30: PRESENT, PRESENT, PRESENT, PRESENT, UNEXCUSED_ABSENT. The 2026-11-06 rehearsal is still NOT_RECORDED when Concert A is reviewed."
