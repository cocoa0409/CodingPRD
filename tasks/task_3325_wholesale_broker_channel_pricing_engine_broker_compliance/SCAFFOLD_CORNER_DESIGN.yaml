            - "GET /wholesale-channel/loan-submissions/${l}/quality-control-reviews returns 0 rows"

      - name: segregation_of_duties_blocks_self_review_of_own_decision
        claim_type: RBAC denial
        grounds:
          - roles.QualityControlAnalyst.description
          - validations[priority=32]
          - errors.ERR_SEGREGATION_OF_DUTIES_VIOLATION
        distinguishing_aspect: "The same user may not both decide the loan and review its file, so the QC creation is refused when X-User-ID equals the underwriter named on the loan's most recent final decision."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Broker B approved with a funded loan whose decisions were all recorded by uw-dana."
          setup_api_calls:
