            - "the follow-up 1-package scan returns ERR_TRAILER_CUBE_EXCEEDED with HTTP 422 (402.34 + 0.34 = 402.68 > 402.34)"
            - "after the refused scan cube_used_cuft is still 402.34, package_count is still 1201 and cube_utilization_pct is still 100.00"
            - "SortCenter.${center_id}.wip_package_count == 1799 and DestinationLane.${lane1_id}.sorted_package_count == 1201 (the refused scan moved nothing)"

