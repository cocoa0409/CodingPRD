      - name: walkthrough_drill_day_conflict
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_WALKTHROUGH_DRILL_CONFLICT]"]
        distinguishing_aspect: "Whole-day mutual exclusion: a walkthrough may not share a calendar date with a SCHEDULED drill at the site; the adjacent day is fine (different semantics than the half-open drill overlap rule)."
        test_recipe:
          setup: ["site with FIRE requirement; drill SCHEDULED 2026-09-15"]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Maplewood K-8", enrollment_count: 850, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
