              captures: { oc_during: $.data.status }
            - call: "POST /body-art/violations/${v1_id}/correction-decision"
              payload: { decision: "VERIFY" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { v_final: $.data.status }
          assert:
            - "${oc_before} == 0 and ${risk_before} == 25"
            - "${oc_after_issue} == 1"
            - "${risk_after_issue} == 30"
            - "${oc_during} == CORRECTION_SUBMITTED"
