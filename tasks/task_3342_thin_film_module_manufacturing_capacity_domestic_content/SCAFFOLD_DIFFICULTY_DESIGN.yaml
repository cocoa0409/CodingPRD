              as: ContractsOfficer
          assert:
            - "activate while line COMMISSIONING: response.http_status == 409"
            - "activate while line COMMISSIONING: response.error_id == ERR_INVALID_STATE"
            - "reservation unchanged after failed activate: CapacityReservation.${res_id}.status == DEPOSIT_HELD"
            - "activate after commission: CapacityReservation.${res_id}.status == ACTIVE"

      - name: confirm_requires_active_reservation
        grounds:
          - state_machines.Delivery.SCHEDULED_to_DELIVERED
          - validations[priority=16]
        distinguishing_aspect: |
          Entity pair = Delivery -> CapacityReservation (different pair than
          CapacityReservation -> ProductionLine): confirm requires the
          RESERVATION to be ACTIVE; with the reservation forced CONSTRAINED (line
          suspended) and the clock inside the window, confirm is rejected with
          ERR_RESERVATION_CONSTRAINED and the delivery stays SCHEDULED.
        test_recipe:
          setup:
            - "Customer C (TIER_A) with ACTIVE reservation R; delivery D SCHEDULED with VERIFIED lot, window 2027-03-01..2027-04-01"
            - "Line suspended after D scheduled (reservation cascaded to CONSTRAINED); logical clock set inside D's window"
          setup_api_calls:
