# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3436_frozen_potato_processing_foodservice_specification_supply
# 9 Difficulty Rules x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1-§1.7 and is replayable from empty-DB via §1.5 calls only.
# Logical clock default 2026-09-01T00:00:00Z; every recipe sets it explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: lot_settlement_provisional_vs_storage_adjusted_final
        grounds:
          - calculations.lot_provisional_payment
          - calculations.contract_final_settlement
          - calculations.storage_loss_pct
          - state_machines.CropContract.ACTIVE_to_SHORTFALL_DECLARED
        distinguishing_aspect: |
          Same lot, same contract: the provisional variant pays on receiving-time
          grade A and full net weight (2700000 cents), while the final variant
          first deducts WATCH-posture storage shrinkage (30 days x 0.02 x 1.5 = 0.9%)
          and pays 991.0 cwt at grade A (2675700 cents) — a 24300-cent divergence
          produced only by the settlement variant.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower GR-100; facility CELL-1 (50000 cwt); ACTIVE contract 100 acres x 400 cwt/acre @2500c, window 2026-09-01..2026-10-15; one grade-A lot of 1000.0 net cwt; facility posture WATCH via 2026-09-02 reading; clock advanced 30 days to 2026-10-01T00:00:00Z."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_grower
              call: "POST /potato-ops/growers"
              payload: { grower_code: "GR-100", legal_name: "Columbia Basin Farms LLC", region: "COLUMBIA_BASIN" }
              as: GrowerRelationsManager
              captures: { grower_id: $.data.id }
            - &d_facility
              call: "POST /potato-ops/storage-facilities"
              payload: { facility_code: "CELL-1", capacity_cwt: 50000, target_temp_f: 38.0, target_co2_pct: 3.0 }
              as: PlatformAdmin
              captures: { facility_id: $.data.id }
            - &d_contract
              call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "RUSSET_BURBANK", contracted_acres: 100, expected_yield_cwt_per_acre: 400, base_price_per_cwt_cents: 2500, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-10-15T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { contract_id: $.data.id }
            - &d_activate
              call: "POST /potato-ops/crop-contracts/${contract_id}/activate"
              payload: {}
              as: GrowerRelationsManager
            - &d_lot_a
              call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { lot_id: $.data.id, lot_prov: $.data.provisional_payment_cents }
            - &d_reading_watch
              call: "POST /potato-ops/storage-facilities/${facility_id}/readings"
              payload: { recorded_at: "2026-09-02T00:00:00Z", temperature_f: 38.5, humidity_pct: 90.0, co2_pct: 3.1, sprout_index: 2.5, disease_incidence_pct: 1.0 }
              as: StorageOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /potato-ops/crop-contracts/${contract_id}/declare-shortfall"
              payload: {}
              as: GrowerRelationsManager
              captures: { settled_amt: $.data.settlement_amount_cents }
            - call: "GET /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}" }
              as: GrowerRelationsManager
              captures: { lot_final: "$.data[0].final_payment_cents" }
          assert:
            - "PotatoLot.${lot_id}.provisional_payment_cents == 2700000 at receiving (1000.0 cwt x 2500 x 1.08 grade A)"
            - "CropContract.${contract_id}.settlement_amount_cents == 2675700 (991.0 cwt after 9.0 cwt shrinkage x 2500 x 1.08)"
            - "PotatoLot.${lot_id}.final_payment_cents == 2675700"
            - "settlement_amount_cents != provisional_payment_cents (divergence 24300 cents)"
            - "CropContract.${contract_id}.status == SHORTFALL_DECLARED"

      - name: shortage_allocation_pro_rata_vs_priority_waterfall
        grounds:
          - calculations.shortage_allocation
          - state_machines.ShortageEvent.OPEN_to_EXECUTED
          - entities.SupplyAgreement.fields.current_week_allocation_cases
        distinguishing_aspect: |
          Identical participants (TIER_1 agreement 600/wk, TIER_2 agreement 600/wk)
          and identical 1000-case pool: PRO_RATA splits 500/500 (tier-blind floor
          division), PRIORITY_WATERFALL fills TIER_1 to 600 first and leaves 400
          for TIER_2 — the two variants produce different per-agreement
          allocations in the SupplyAgreement domain, a different entity domain
          from the lot-payment instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; chains CH-ALPHA (TIER_1_STRATEGIC) and CH-BETA (TIER_2_PREFERRED), each with a VALIDATED spec and an ACTIVE agreement of 600 cases/week (A @305c, B @310c)."
          setup_api_calls:
            - *d_clock
            - &d_chain_a
              call: "POST /potato-ops/customer-chains"
              payload: { chain_code: "CH-ALPHA", legal_name: "Alpha Burger Co", priority_tier: "TIER_1_STRATEGIC" }
              as: AccountManager
              captures: { chain_a_id: $.data.id }
            - &d_chain_b
              call: "POST /potato-ops/customer-chains"
              payload: { chain_code: "CH-BETA", legal_name: "Beta Diner Group", priority_tier: "TIER_2_PREFERRED" }
              as: AccountManager
              captures: { chain_b_id: $.data.id }
            - &d_spec_a
              call: "POST /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_a_id}", spec_code: "SP-A-1", cut_family: "STRAIGHT", cut_size_mm: 9.5, coating_type: "CLEAR", target_color_units: 2.5, max_cook_time_sec: 195 }
              as: ChainCustomer
              as_user_id: "${chain_a_id}"
              captures: { spec_a_id: $.data.id }
            - &d_validate_a
              call: "POST /potato-ops/cut-specifications/${spec_a_id}/validate"
              payload: { panel_score: 8.0 }
              as: QualityAssuranceLead
            - &d_spec_b
              call: "POST /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_b_id}", spec_code: "SP-B-1", cut_family: "CRINKLE", cut_size_mm: 10.0, coating_type: "SEASONED", target_color_units: 2.0, max_cook_time_sec: 210 }
              as: ChainCustomer
              as_user_id: "${chain_b_id}"
              captures: { spec_b_id: $.data.id }
            - &d_validate_b
              call: "POST /potato-ops/cut-specifications/${spec_b_id}/validate"
              payload: { panel_score: 7.5 }
              as: QualityAssuranceLead
            - &d_agr_a
              call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 600, price_per_case_cents: 305, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_a_id: $.data.id }
            - &d_agr_a_act
              call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - &d_agr_b
              call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_b_id}", spec_id: "${spec_b_id}", weekly_contracted_cases: 600, price_per_case_cents: 310, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_b_id: $.data.id }
            - &d_agr_b_act
              call: "POST /potato-ops/supply-agreements/${agr_b_id}/activate"
              payload: {}
              as: AccountManager
            - &d_event_pr
              call: "POST /potato-ops/shortage-events"
              payload: { scope_variety: "RUSSET_BURBANK", declared_deficit_cwt: 5000, available_week_cases: 1000, response_mode: "PRO_RATA" }
              as: GrowerRelationsManager
              captures: { event_pr_id: $.data.id }
          trigger:
            - call: "POST /potato-ops/shortage-events/${event_pr_id}/execute-allocation"
              payload: {}
              as: GrowerRelationsManager
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}" }
              as: AccountManager
              captures: { alloc_a_pr: "$.data[0].current_week_allocation_cases" }
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_b_id}" }
              as: AccountManager
              captures: { alloc_b_pr: "$.data[0].current_week_allocation_cases" }
            - call: "POST /potato-ops/shortage-events"
              payload: { scope_variety: "RUSSET_BURBANK", declared_deficit_cwt: 5000, available_week_cases: 1000, response_mode: "PRIORITY_WATERFALL" }
              as: GrowerRelationsManager
              captures: { event_wf_id: $.data.id }
            - call: "POST /potato-ops/shortage-events/${event_wf_id}/execute-allocation"
              payload: {}
              as: GrowerRelationsManager
              captures: { wf_results: $.data.allocation_results }
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}" }
              as: AccountManager
              captures: { alloc_a_wf: "$.data[0].current_week_allocation_cases" }
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_b_id}" }
              as: AccountManager
              captures: { alloc_b_wf: "$.data[0].current_week_allocation_cases" }
          assert:
            - "PRO_RATA: agreement ${agr_a_id}.current_week_allocation_cases == 500 (floor(1000 x 600/1200))"
            - "PRO_RATA: agreement ${agr_b_id}.current_week_allocation_cases == 500"
            - "PRIORITY_WATERFALL: agreement ${agr_a_id}.current_week_allocation_cases == 600 (TIER_1 filled first)"
            - "PRIORITY_WATERFALL: agreement ${agr_b_id}.current_week_allocation_cases == 400 (remainder)"
            - "alloc_a_pr (500) != alloc_a_wf (600) for identical pool and participants"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: quality_grade_worst_of_three_metrics_with_reject_override
        grounds:
          - calculations.lot_quality_grade
          - entities.PotatoLot.fields.grade
        distinguishing_aspect: |
          Mode (a): three interacting inputs with conditional branches — a lot
          graded A on gravity (1.085) but B on defect (4.0) and C on sugar (3.5)
          resolves to C by worst-of composition (provisional 2200000 cents),
          while a second lot at defect 8.0 is REJECT despite A-grade gravity and
          sugar (provisional 0) — the override branch dominates tier composition.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower, facility, ACTIVE contract (100x400 @2500c, window 2026-09-01..2026-10-15)."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 4.0, specific_gravity: 1.085, sugar_end_rating: 3.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { lot_c_id: $.data.id, lot_c_grade: $.data.grade, lot_c_prov: $.data.provisional_payment_cents }
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 8.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { lot_r_id: $.data.id, lot_r_grade: $.data.grade, lot_r_prov: $.data.provisional_payment_cents }
          assert:
            - "PotatoLot.${lot_c_id}.grade == C (worst of defect B / gravity A / sugar C)"
            - "PotatoLot.${lot_c_id}.provisional_payment_cents == 2200000 (1000.0 x 2500 x 0.88)"
            - "PotatoLot.${lot_r_id}.grade == REJECT (defect_pct 8.0 >= REJECT_DEFECT_PCT despite A/A metrics)"
            - "PotatoLot.${lot_r_id}.provisional_payment_cents == 0"

      - name: shipment_credit_memo_per_line_round_then_sum
        grounds:
          - calculations.shipment_invoice_and_credit
          - state_machines.Shipment.IN_TRANSIT_to_REJECTED_ON_ARRIVAL
        distinguishing_aspect: |
          Mode (b): rounding order is pinned per shipment line then summed — a
          rejected shipment with lines of 3 and 2 cases at 299 cents credits
          round(762.45)=762 + round(508.3)=508 = 1270, NOT the sum-then-round
          value round(1270.75)=1271; a one-cent divergence that only the pinned
          order produces and that no float-boundary ambiguity can flip.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower/facility/ACTIVE contract with two grade-A lots of 1000.0 net cwt; chain CH-ALPHA with LOCKED STRAIGHT spec and ACTIVE agreement @305c; line LINE-1; runs R1 (2026-09-02 08:00-10:00) and R2 (same family, adjacent 10:00-11:00) both RELEASED with 620 actual cases each; agreement price 299 cents per case."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - *d_lot_a
            - &d_lot_b
              call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { lot_b_id: $.data.id }
            - &d_line
              call: "POST /potato-ops/processing-lines"
              payload: { line_code: "LINE-1", supported_cut_families: ["STRAIGHT", "CRINKLE"], rated_throughput_cases_per_hour: 5000 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - &d_agr_10k
              call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 10000, price_per_case_cents: 299, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_a_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - &d_run1
              call: "POST /potato-ops/production-runs"
              payload: { line_id: "${line_id}", spec_id: "${spec_a_id}", agreement_id: "${agr_a_id}", input_lot_ids: ["${lot_id}"], scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: ProductionPlanner
              captures: { run1_id: $.data.id }
            - &d_run1_adv_1
              call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run1_adv_2
              call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run1_adv_3
              call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run1_adv_4
              call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run1_adv_5
              call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run1_release
              call: "POST /potato-ops/production-runs/${run1_id}/qa-release"
              payload: { measured_color_units: 2.5 }
              as: QualityAssuranceLead
            - &d_run2
              call: "POST /potato-ops/production-runs"
              payload: { line_id: "${line_id}", spec_id: "${spec_a_id}", agreement_id: "${agr_a_id}", input_lot_ids: ["${lot_b_id}"], scheduled_start: "2026-09-02T10:00:00Z", scheduled_end: "2026-09-02T11:00:00Z" }
              as: ProductionPlanner
              captures: { run2_id: $.data.id }
            - &d_run2_adv_1
              call: "POST /potato-ops/production-runs/${run2_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run2_adv_2
              call: "POST /potato-ops/production-runs/${run2_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run2_adv_3
              call: "POST /potato-ops/production-runs/${run2_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run2_adv_4
              call: "POST /potato-ops/production-runs/${run2_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run2_adv_5
              call: "POST /potato-ops/production-runs/${run2_id}/advance"
              payload: {}
              as: ProductionPlanner
            - &d_run2_release
              call: "POST /potato-ops/production-runs/${run2_id}/qa-release"
              payload: { measured_color_units: 2.5 }
              as: QualityAssuranceLead
            - &d_ship_32
              call: "POST /potato-ops/shipments"
              payload: { agreement_id: "${agr_a_id}", carrier_name: "FrostLine Logistics", trailer_setpoint_f: -5.0, route_type: "DIRECT_CHAIN", lines: [{ run_id: "${run1_id}", cases: 3 }, { run_id: "${run2_id}", cases: 2 }] }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /potato-ops/shipments/${ship_id}/reject-on-arrival"
              payload: {}
              as: LogisticsCoordinator
              captures: { credit: $.data.credit_memo_cents }
          assert:
            - "Shipment.${ship_id}.credit_memo_cents == 1270 (round(3x299x0.85)=762 + round(2x299x0.85)=508)"
            - "credit_memo_cents != 1271 (the sum-then-round value round(5x299x0.85)=round(1270.75))"
            - "Shipment.${ship_id}.status == REJECTED_ON_ARRIVAL"

      - name: final_settlement_pinned_evaluation_order_shrink_then_downgrade
        grounds:
          - calculations.contract_final_settlement
          - calculations.storage_loss_pct
        distinguishing_aspect: |
          Mode (c): the circle loss-rate<->grade is broken by the pinned order
          (shrinkage from raw values FIRST, tier downgrade when loss > 10%, price
          LAST): a QUARANTINED-stored grade-A lot at 12.0% loss pays 880.0 cwt
          at downgraded grade B = 2266000 cents — neither the provisional
          2700000 nor the un-downgraded 2376000.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower, facility, ACTIVE contract (100x400 @2500c); one grade-A lot of 1000.0 net cwt; facility QUARANTINED via 2026-09-02 reading (disease 7.0); clock advanced 200 days to 2027-03-20T00:00:00Z."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - *d_lot_a
            - call: "POST /potato-ops/storage-facilities/${facility_id}/readings"
              payload: { recorded_at: "2026-09-02T00:00:00Z", temperature_f: 41.0, humidity_pct: 94.0, co2_pct: 4.0, sprout_index: 3.5, disease_incidence_pct: 7.0 }
              as: StorageOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /potato-ops/crop-contracts/${contract_id}/declare-shortfall"
              payload: {}
              as: GrowerRelationsManager
              captures: { settled_amt: $.data.settlement_amount_cents }
            - call: "GET /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}" }
              as: GrowerRelationsManager
              captures: { lot_final: "$.data[0].final_payment_cents" }
          assert:
            - "storage_loss_pct == 12.0 (200 days x 0.02 x QUARANTINED 3.0, under the 15.0 cap)"
            - "CropContract.${contract_id}.settlement_amount_cents == 2266000 (880.0 cwt x 2500 x grade-B 1.03 after the >10% downgrade)"
            - "PotatoLot.${lot_id}.final_payment_cents == 2266000"
            - "settlement_amount_cents != 2376000 (the value if pricing skipped the downgrade) and != 2700000 (provisional)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: production_run_rework_loop_recomputes_cases_with_loss
        grounds:
          - state_machines.ProductionRun.QA_HOLD_to_REWORK
          - state_machines.ProductionRun.REWORK_to_COATING
          - calculations.run_actual_cases
        distinguishing_aspect: |
          Cyclic machine on ProductionRun: QA_HOLD -> REWORK -> COATING -> ...
          -> QA_HOLD is a true loop back into the pipeline, and the second
          QA_HOLD entry recomputes actual_cases as floor(620 x 0.96) = 595 —
          the cycle is observable in both status history and output volume.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower/facility/ACTIVE contract with one grade-A lot (1000.0 cwt); chain CH-ALPHA, LOCKED STRAIGHT spec, ACTIVE 10000-case agreement @305c; line LINE-1; run R1 SCHEDULED 2026-09-02 08:00-10:00."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - *d_lot_a
            - *d_line
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - *d_agr_10k
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - *d_run1
            - *d_run1_adv_1
            - *d_run1_adv_2
            - *d_run1_adv_3
            - *d_run1_adv_4
            - *d_run1_adv_5
          trigger:
            - call: "POST /potato-ops/production-runs/${run1_id}/rework"
              payload: {}
              as: QualityAssuranceLead
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
            - call: "POST /potato-ops/production-runs/${run1_id}/advance"
              payload: {}
              as: ProductionPlanner
              captures: { run_status: $.data.status, run_cases: $.data.actual_cases, run_reworks: $.data.rework_count }
            - call: "POST /potato-ops/production-runs/${run1_id}/qa-release"
              payload: { measured_color_units: 2.5 }
              as: QualityAssuranceLead
          assert:
            - "after the first FREEZING advance the run reached QA_HOLD with actual_cases == 620 (floor(1000.0 x 0.62))"
            - "after rework + three advances the run is back at QA_HOLD with rework_count == 1"
            - "ProductionRun.${run1_id}.actual_cases == 595 (floor(620 x 0.96)) on the second QA_HOLD entry"
            - "final qa-release succeeds: ProductionRun.${run1_id}.status == RELEASED"
            - "PotatoLot.${lot_id}.status == CONSUMED after release"

      - name: cut_spec_revision_cycle_flags_and_reacks_agreement
        grounds:
          - state_machines.CutSpecification.LOCKED_to_REVISION_REQUESTED
          - state_machines.CutSpecification.REVISION_REQUESTED_to_LOCKED
          - state_machines.SupplyAgreement.ACTIVE_to_ACTIVE
          - entities.SupplyAgreement.fields.pinned_spec_version
        distinguishing_aspect: |
          Cyclic machine on CutSpecification (LOCKED -> REVISION_REQUESTED ->
          LOCKED via ever_locked) with cross-entity pinning: the revision flags
          the ACTIVE agreement spec_stale=true, and only the re-ack self-loop
          re-pins pinned_spec_version from 3 to the post-revision version 5.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; chain CH-ALPHA; spec SP-A-1 created (v1), validated (v2); agreement created and activated (agreement v2; spec LOCKED v3, pinned_spec_version 3)."
          setup_api_calls:
            - *d_clock
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - *d_agr_10k
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /potato-ops/cut-specifications/${spec_a_id}/request-revision"
              payload: {}
              as: ChainCustomer
              as_user_id: "${chain_a_id}"
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}" }
              as: AccountManager
              captures: { agr_stale: "$.data[0].spec_stale", agr_pin_mid: "$.data[0].pinned_spec_version" }
            - call: "POST /potato-ops/cut-specifications/${spec_a_id}/validate"
              payload: { panel_score: 8.5 }
              as: QualityAssuranceLead
              captures: { spec_status: $.data.status, spec_v: $.data.version }
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
              captures: { agr_stale_after: $.data.spec_stale, agr_pin_after: $.data.pinned_spec_version }
          assert:
            - "spec cycles SUBMITTED(1) -> VALIDATED(2) -> LOCKED(3) -> REVISION_REQUESTED(4) -> LOCKED(5) because ever_locked is true"
            - "request-revision from LOCKED sets SupplyAgreement.${agr_a_id}.spec_stale == true while pinned_spec_version stays 3"
            - "re-ack activate self-loop: spec_stale == false and pinned_spec_version == 5"
            - "SupplyAgreement.${agr_a_id}.status remains ACTIVE throughout (the cycle never leaves ACTIVE)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: credit_hold_cascade_suspends_agreement_cancels_run_releases_lot
        grounds:
          - state_machines.CustomerChain.GOOD_STANDING_to_ON_HOLD
          - state_machines.SupplyAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ProductionRun.SCHEDULED_to_CANCELLED
          - state_machines.PotatoLot.ALLOCATED_to_IN_STORAGE
        distinguishing_aspect: |
          Depth-4 transitive chain from the credit trigger: chain ON_HOLD causes
          agreement SUSPENDED, which itself causes run CANCELLED, which itself
          causes lot ALLOCATED -> IN_STORAGE with stock restoration — each link
          is caused by the previous mutation, not by the original call, and the
          released weekly capacity is provably reusable by another agreement.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower/facility/ACTIVE contract with one lot (1000.0 cwt, stock 1000.0); chain CH-ALPHA with LOCKED spec and ACTIVE 10000-case agreement; run R1 SCHEDULED (lot ALLOCATED, stock 0.0); second chain CH-GAMMA with its own VALIDATED spec."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - *d_lot_a
            - *d_line
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - *d_agr_10k
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - *d_run1
            - &d_chain_g
              call: "POST /potato-ops/customer-chains"
              payload: { chain_code: "CH-GAMMA", legal_name: "Gamma QSR Holdings", priority_tier: "TIER_3_STANDARD" }
              as: AccountManager
              captures: { chain_g_id: $.data.id }
            - &d_spec_g
              call: "POST /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_g_id}", spec_code: "SP-G-1", cut_family: "WEDGE", cut_size_mm: 12.0, coating_type: "NONE", target_color_units: 3.0, max_cook_time_sec: 240 }
              as: ChainCustomer
              as_user_id: "${chain_g_id}"
              captures: { spec_g_id: $.data.id }
            - &d_validate_g
              call: "POST /potato-ops/cut-specifications/${spec_g_id}/validate"
              payload: { panel_score: 9.0 }
              as: QualityAssuranceLead
          trigger:
            - call: "POST /potato-ops/customer-chains/${chain_a_id}/set-credit-status"
              payload: { credit_status: "ON_HOLD" }
              as: AccountManager
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}" }
              as: AccountManager
              captures: { agr_status: "$.data[0].status" }
            - call: "GET /potato-ops/production-runs"
              payload: { agreement_id: "${agr_a_id}" }
              as: ProductionPlanner
              captures: { run_status: "$.data[0].status" }
            - call: "GET /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}" }
              as: GrowerRelationsManager
              captures: { lot_status: "$.data[0].status" }
            - call: "GET /potato-ops/storage-facilities/${facility_id}"
              payload: {}
              as: StorageOperator
              captures: { fac_stock: $.data.current_stock_cwt }
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_g_id}", spec_id: "${spec_g_id}", weekly_contracted_cases: 100000, price_per_case_cents: 290, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_g_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_g_id}/activate"
              payload: {}
              as: AccountManager
          assert:
            - "CustomerChain.${chain_a_id}.credit_status == ON_HOLD"
            - "SupplyAgreement.${agr_a_id}.status == SUSPENDED (link 1)"
            - "ProductionRun.${run1_id}.status == CANCELLED (link 2, caused by the suspension)"
            - "PotatoLot.${lot_id}.status == IN_STORAGE (link 3, caused by the cancellation)"
            - "StorageFacility.${facility_id}.current_stock_cwt == 1000.0 (stock restored)"
            - "pool release is real: the new 100000-case agreement ${agr_g_id} activates successfully while A is SUSPENDED"

      - name: shipment_rejection_fill_rate_drop_flags_agreements_under_sla_review
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_REJECTED_ON_ARRIVAL
          - calculations.fill_rate_pct
          - entities.SupplyAgreement.fields.under_sla_review
        distinguishing_aspect: |
          Depth-2 transitive chain from the rejection trigger: the shipment's
          REJECTED_ON_ARRIVAL mutation causes the chain's fill_rate_pct
          recompute (0.0), which itself causes every ACTIVE agreement of the
          chain to gain under_sla_review=true — and that flag then gates new
          shipment creation with ERR_AGREEMENT_UNDER_SLA_REVIEW.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; full released-run fixture (two grade-A lots, runs R1/R2 RELEASED with 620 cases each); agreement @305c ACTIVE; shipment S1 of 500 cases IN_TRANSIT."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - *d_lot_a
            - *d_lot_b
            - *d_line
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - *d_agr_10k
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - *d_run1
            - *d_run1_adv_1
            - *d_run1_adv_2
            - *d_run1_adv_3
            - *d_run1_adv_4
            - *d_run1_adv_5
            - *d_run1_release
            - &d_ship_500
              call: "POST /potato-ops/shipments"
              payload: { agreement_id: "${agr_a_id}", carrier_name: "FrostLine Logistics", trailer_setpoint_f: -5.0, route_type: "DIRECT_CHAIN", lines: [{ run_id: "${run1_id}", cases: 500 }] }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /potato-ops/shipments/${ship_id}/reject-on-arrival"
              payload: {}
              as: LogisticsCoordinator
              captures: { credit: $.data.credit_memo_cents }
            - call: "GET /potato-ops/customer-chains/${chain_a_id}"
              payload: {}
              as: AccountManager
              captures: { fill: $.data.fill_rate_pct }
            - call: "GET /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}" }
              as: AccountManager
              captures: { sla_flag: "$.data[0].under_sla_review" }
            - call: "POST /potato-ops/shipments"
              payload: { agreement_id: "${agr_a_id}", carrier_name: "FrostLine Logistics", trailer_setpoint_f: -5.0, route_type: "DIRECT_CHAIN", lines: [{ run_id: "${run1_id}", cases: 100 }] }
              as: LogisticsCoordinator
              captures: { blocked_err: $.data.error_id }
          assert:
            - "Shipment.${ship_id}.status == REJECTED_ON_ARRIVAL and credit_memo_cents == 127075 (round(500 x 299 x 0.85))"
            - "CustomerChain.${chain_a_id}.fill_rate_pct == 0.0 (0 delivered / 500 terminal)"
            - "SupplyAgreement.${agr_a_id}.under_sla_review == true (link 2, caused by the fill-rate recompute crossing below 85.0)"
            - "the next shipment creation is rejected with ERR_AGREEMENT_UNDER_SLA_REVIEW (the cascade's gating consequence)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: lot_create_draft_contract_and_overcapacity_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors.ERR_CONTRACT_NOT_ACTIVE
          - errors.ERR_FACILITY_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Pair state vs business_fiscal: one lot creation violates both the
          state gate (contract still DRAFT) and the fiscal gate (1000.0 cwt into
          a 500-cwt facility); the priority-6 state error
          ERR_CONTRACT_NOT_ACTIVE must win over ERR_FACILITY_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower GR-100; facility CELL-TINY with capacity 500 cwt; contract created but never activated (DRAFT)."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - call: "POST /potato-ops/storage-facilities"
              payload: { facility_code: "CELL-TINY", capacity_cwt: 500, target_temp_f: 38.0, target_co2_pct: 3.0 }
              as: PlatformAdmin
              captures: { facility_id: $.data.id }
            - *d_contract
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CONTRACT_NOT_ACTIVE (state priority 6)"
            - "error_id != ERR_FACILITY_CAPACITY_EXCEEDED (fiscal priority 10 would have fired on 1000.0 > 500 free)"
            - "GET /potato-ops/potato-lots?contract_id=${contract_id} returns 0 rows"

      - name: lot_create_quarantined_and_outside_window_safety_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors.ERR_FACILITY_QUARANTINED
          - errors.ERR_OUTSIDE_DELIVERY_WINDOW
        distinguishing_aspect: |
          Pair business_safety vs business_temporal: one lot creation violates
          both quarantine isolation (facility QUARANTINED by a disease reading)
          and the delivery window (clock 2026-11-01, past the 2026-10-15 window
          end); the priority-7 safety error ERR_FACILITY_QUARANTINED must win
          over ERR_OUTSIDE_DELIVERY_WINDOW.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower, facility, ACTIVE contract (window ends 2026-10-15); facility driven QUARANTINED by a 2026-09-03 reading (disease 8.0); clock advanced to 2026-11-01T00:00:00Z."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - call: "POST /potato-ops/storage-facilities/${facility_id}/readings"
              payload: { recorded_at: "2026-09-03T00:00:00Z", temperature_f: 42.0, humidity_pct: 95.0, co2_pct: 4.5, sprout_index: 4.2, disease_incidence_pct: 8.0 }
              as: StorageOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FACILITY_QUARANTINED (safety priority 7)"
            - "error_id != ERR_OUTSIDE_DELIVERY_WINDOW (temporal priority 9 would have fired on 2026-11-01 > 2026-10-15)"
            - "GET /potato-ops/potato-lots?facility_id=${facility_id} returns 0 rows"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: defect_pct_exactly_at_reject_threshold_rejects
        grounds:
          - calculations.lot_quality_grade
          - entities.PotatoLot.fields.defect_pct
        distinguishing_aspect: |
          Metric defect_pct on POST /potato-ops/potato-lots: the REJECT
          threshold is inclusive (>= 8.0) — 7.99 lands in the C tier and pays
          2200000 cents, while exactly 8.0 is REJECT and pays 0; one
          hundredth of a percent flips the outcome.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower, facility, ACTIVE contract (100x400 @2500c)."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
          trigger:
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 7.99, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { lot_below: $.data.id, grade_below: $.data.grade, prov_below: $.data.provisional_payment_cents }
            - call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 8.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { lot_at: $.data.id, grade_at: $.data.grade, prov_at: $.data.provisional_payment_cents }
          assert:
            - "defect_pct 7.99 -> grade == C and provisional_payment_cents == 2200000"
            - "defect_pct 8.0 -> grade == REJECT and provisional_payment_cents == 0"
            - "the boundary is >= : exactly 8.0 rejects, 7.99 does not"

      - name: weekly_capacity_reservation_exactly_at_pool_limit_succeeds
        grounds:
          - calculations.weekly_capacity_reservation
          - errors.ERR_WEEK_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Metric reserved weekly cases on POST /supply-agreements/{id}/activate:
          reserving the 100000-case pool down to exactly 0 succeeds (60000 then
          40000), while one additional case (weekly 1) is rejected with
          ERR_WEEK_CAPACITY_EXCEEDED — the boundary is >= 0 remaining, not > 0.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; chain CH-ALPHA with a VALIDATED spec; agreements A1 (60000/wk), A2 (40000/wk), A3 (1/wk) all DRAFT on the same spec."
          setup_api_calls:
            - *d_clock
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 60000, price_per_case_cents: 305, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr1_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 40000, price_per_case_cents: 305, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr2_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 1, price_per_case_cents: 305, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr3_id: $.data.id }
          trigger:
            - call: "POST /potato-ops/supply-agreements/${agr1_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /potato-ops/supply-agreements/${agr2_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /potato-ops/supply-agreements/${agr3_id}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "A1 activation succeeds (reserved 60000, pool 40000)"
            - "A2 activation succeeds (reserved 100000, pool exactly 0 — the boundary accepts equality)"
            - "A3 activation fails: 422 and error_id == ERR_WEEK_CAPACITY_EXCEEDED (1 case over an empty pool)"
            - "SupplyAgreement.${agr3_id}.status remains DRAFT"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: run_create_requires_spec_locked_not_just_validated
        grounds:
          - state_machines.CutSpecification
          - state_machines.SupplyAgreement.DRAFT_to_ACTIVE
          - errors.ERR_SPEC_NOT_LOCKED
          - endpoints.POST_/potato-ops/production-runs
        distinguishing_aspect: |
          Pair ProductionRun x CutSpecification: a VALIDATED spec is not enough
          — run creation demands LOCKED, which only the first agreement
          activation produces. With the spec VALIDATED and the agreement still
          DRAFT, run creation fails with ERR_SPEC_NOT_LOCKED (the spec check
          precedes the agreement-state check in endpoint input order).
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower/facility/ACTIVE contract with lot L1 IN_STORAGE; line LINE-1; chain CH-ALPHA; spec SP-A-1 VALIDATED; agreement DRAFT (never activated, so the spec never locked)."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - *d_lot_a
            - *d_line
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - *d_agr_10k
          trigger:
            - call: "POST /potato-ops/production-runs"
              payload: { line_id: "${line_id}", spec_id: "${spec_a_id}", agreement_id: "${agr_a_id}", input_lot_ids: ["${lot_id}"], scheduled_start: "2026-09-02T08:00:00Z", scheduled_end: "2026-09-02T10:00:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_SPEC_NOT_LOCKED"
            - "error_id != ERR_AGREEMENT_NOT_ACTIVE (the spec lock check fires first)"
            - "GET /potato-ops/production-runs?agreement_id=${agr_a_id} returns 0 rows"

      - name: run_create_blocked_by_quarantined_source_facility
        grounds:
          - state_machines.StorageFacility
          - state_machines.PotatoLot.IN_STORAGE_to_ALLOCATED
          - errors.ERR_FACILITY_QUARANTINED
          - endpoints.POST_/potato-ops/production-runs
        distinguishing_aspect: |
          Pair ProductionRun x StorageFacility (via PotatoLot.facility_id): the
          run's own fields are all valid, but a disease reading pushed the
          lot's facility to QUARANTINED, so the allocation gate rejects with
          ERR_FACILITY_QUARANTINED — the run's feasibility depends on a
          different entity's derived posture.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; full fixture through an ACTIVE agreement (spec LOCKED); lot L1 IN_STORAGE in CELL-1; CELL-1 driven QUARANTINED by a 2026-09-02T06:00 reading (sprout 4.2)."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - *d_lot_a
            - *d_line
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - *d_agr_10k
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /potato-ops/storage-facilities/${facility_id}/readings"
              payload: { recorded_at: "2026-09-02T06:00:00Z", temperature_f: 41.0, humidity_pct: 93.0, co2_pct: 4.2, sprout_index: 4.2, disease_incidence_pct: 2.0 }
              as: StorageOperator
          trigger:
            - call: "POST /potato-ops/production-runs"
              payload: { line_id: "${line_id}", spec_id: "${spec_a_id}", agreement_id: "${agr_a_id}", input_lot_ids: ["${lot_id}"], scheduled_start: "2026-09-03T08:00:00Z", scheduled_end: "2026-09-03T10:00:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_FACILITY_QUARANTINED (sprout_index 4.2 >= 4.0 quarantines the facility)"
            - "PotatoLot.${lot_id}.status remains IN_STORAGE (no allocation happened)"
            - "GET /potato-ops/production-runs?line_id=${line_id} returns 0 rows"

      - name: shipment_create_blocked_when_agreement_suspended_by_credit_hold
        grounds:
          - state_machines.SupplyAgreement.ACTIVE_to_SUSPENDED
          - state_machines.CustomerChain.GOOD_STANDING_to_ON_HOLD
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - endpoints.POST_/potato-ops/shipments
        distinguishing_aspect: |
          Pair Shipment x SupplyAgreement: a shipment against a SUSPENDED
          agreement fails with ERR_AGREEMENT_NOT_ACTIVE even though 620 cases
          stand released and ready — the agreement's credit-driven state, not
          inventory, gates the shipment.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; full fixture: run R1 RELEASED with 620 cases for agreement A; then the chain is put ON_HOLD, suspending A."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - *d_lot_a
            - *d_line
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - *d_agr_10k
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - *d_run1
            - *d_run1_adv_1
            - *d_run1_adv_2
            - *d_run1_adv_3
            - *d_run1_adv_4
            - *d_run1_adv_5
            - *d_run1_release
            - call: "POST /potato-ops/customer-chains/${chain_a_id}/set-credit-status"
              payload: { credit_status: "ON_HOLD" }
              as: AccountManager
          trigger:
            - call: "POST /potato-ops/shipments"
              payload: { agreement_id: "${agr_a_id}", carrier_name: "FrostLine Logistics", trailer_setpoint_f: -5.0, route_type: "DISTRIBUTOR", lines: [{ run_id: "${run1_id}", cases: 100 }] }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_AGREEMENT_NOT_ACTIVE (A is SUSPENDED)"
            - "error_id != ERR_UNRELEASED_CASES_EXCEEDED (620 released cases were available; state, not inventory, blocked it)"
            - "GET /potato-ops/shipments?agreement_id=${agr_a_id} returns 0 rows"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_delivery_window_overlap_half_open_adjacency_allowed
        grounds:
          - calculations.delivery_window_overlap
          - errors.ERR_DELIVERY_WINDOW_OVERLAP
          - entities.CropContract.fields.delivery_window_start
        distinguishing_aspect: |
          Resource Grower, half-open [start, end) semantics: back-to-back
          seasons (c2.start == c1.end) merge cleanly and are accepted, an
          interior overlap (c3.start < c1.end) is rejected, and the same
          window under a different variety does not even participate.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower GR-100; contract C1 RUSSET_BURBANK [2026-09-01, 2026-10-15]."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_contract
          trigger:
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "RUSSET_BURBANK", contracted_acres: 50, expected_yield_cwt_per_acre: 380, base_price_per_cwt_cents: 2400, delivery_window_start: "2026-10-15T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { contract2_id: $.data.id }
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "RUSSET_BURBANK", contracted_acres: 40, expected_yield_cwt_per_acre: 380, base_price_per_cwt_cents: 2400, delivery_window_start: "2026-10-14T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { err_overlap: $.data.error_id }
            - call: "POST /potato-ops/crop-contracts"
              payload: { grower_id: "${grower_id}", variety: "RANGER_RUSSET", contracted_acres: 30, expected_yield_cwt_per_acre: 350, base_price_per_cwt_cents: 2300, delivery_window_start: "2026-09-15T00:00:00Z", delivery_window_end: "2026-11-01T00:00:00Z" }
              as: GrowerRelationsManager
              captures: { contract4_id: $.data.id }
          assert:
            - "C2 [2026-10-15, 2026-12-01] is created 201: adjacency with C1's end is not overlap (half-open intervals)"
            - "C3 [2026-10-14, 2026-12-01] fails: 409 and error_id == ERR_DELIVERY_WINDOW_OVERLAP (one day into C1's window)"
            - "C4 same grower but RANGER_RUSSET over [2026-09-15, 2026-11-01] is created 201: the overlap set is scoped by variety"
            - "GET /potato-ops/crop-contracts?grower_id=${grower_id} returns exactly 3 rows"

      - name: line_schedule_cut_family_changeover_buffer
        grounds:
          - calculations.line_schedule_conflict
          - errors.ERR_LINE_SCHEDULE_CONFLICT
          - entities.ProductionRun.fields.scheduled_start
        distinguishing_aspect: |
          Resource ProcessingLine, changeover-buffer semantics: strict overlap
          always conflicts; exact adjacency is allowed only within one cut
          family; a family change at the boundary needs a 60-minute buffer, so
          CRINKLE at 10:00 after STRAIGHT ending 10:00 conflicts while 11:00
          passes — a different geometric rule from the grower-window instance.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower/facility/ACTIVE contract with three grade-A lots; chain CH-ALPHA with two LOCKED specs (SP-A-1 STRAIGHT, SP-A-2 CRINKLE) and two ACTIVE agreements; line LINE-1 supporting both families; run R1 STRAIGHT SCHEDULED 2026-09-02 08:00-10:00."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
            - *d_lot_a
            - *d_lot_b
            - &d_lot_c
              call: "POST /potato-ops/potato-lots"
              payload: { contract_id: "${contract_id}", facility_id: "${facility_id}", variety: "RUSSET_BURBANK", gross_weight_cwt: 1050.0, tare_weight_cwt: 50.0, defect_pct: 2.0, specific_gravity: 1.085, sugar_end_rating: 1.5 }
              as: Grower
              as_user_id: "${grower_id}"
              captures: { lot_c_id: $.data.id }
            - *d_line
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - &d_spec_a2
              call: "POST /potato-ops/cut-specifications"
              payload: { customer_id: "${chain_a_id}", spec_code: "SP-A-2", cut_family: "CRINKLE", cut_size_mm: 10.0, coating_type: "CLEAR", target_color_units: 2.5, max_cook_time_sec: 200 }
              as: ChainCustomer
              as_user_id: "${chain_a_id}"
              captures: { spec_a2_id: $.data.id }
            - call: "POST /potato-ops/cut-specifications/${spec_a2_id}/validate"
              payload: { panel_score: 8.0 }
              as: QualityAssuranceLead
            - *d_agr_10k
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - &d_agr_a2
              call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a2_id}", weekly_contracted_cases: 5000, price_per_case_cents: 320, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_a2_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements/${agr_a2_id}/activate"
              payload: {}
              as: AccountManager
            - *d_run1
          trigger:
            - call: "POST /potato-ops/production-runs"
              payload: { line_id: "${line_id}", spec_id: "${spec_a2_id}", agreement_id: "${agr_a2_id}", input_lot_ids: ["${lot_b_id}"], scheduled_start: "2026-09-02T10:00:00Z", scheduled_end: "2026-09-02T11:00:00Z" }
              as: ProductionPlanner
              captures: { err_conflict: $.data.error_id }
            - call: "POST /potato-ops/production-runs"
              payload: { line_id: "${line_id}", spec_id: "${spec_a2_id}", agreement_id: "${agr_a2_id}", input_lot_ids: ["${lot_b_id}"], scheduled_start: "2026-09-02T11:00:00Z", scheduled_end: "2026-09-02T12:00:00Z" }
              as: ProductionPlanner
              captures: { run2_id: $.data.id }
            - call: "POST /potato-ops/production-runs"
              payload: { line_id: "${line_id}", spec_id: "${spec_a2_id}", agreement_id: "${agr_a2_id}", input_lot_ids: ["${lot_c_id}"], scheduled_start: "2026-09-02T12:00:00Z", scheduled_end: "2026-09-02T12:30:00Z" }
              as: ProductionPlanner
              captures: { run3_id: $.data.id }
          assert:
            - "CRINKLE run at 10:00 (adjacent, family change) fails: 409 ERR_LINE_SCHEDULE_CONFLICT — 0 minutes < 60-minute changeover buffer"
            - "CRINKLE run at 11:00 succeeds 201 (exactly the 60-minute buffer; >= is inclusive)"
            - "CRINKLE run at 12:00 adjacent to the 11:00 CRINKLE run succeeds 201 (same family, no buffer needed)"
            - "GET /potato-ops/production-runs?line_id=${line_id} returns exactly 3 rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: facility_stock_store_then_dispose_restores_baseline
        grounds:
          - entities.StorageFacility.fields.current_stock_cwt
          - state_machines.PotatoLot.IN_STORAGE_to_DISPOSED
          - endpoints.POST_/potato-ops/potato-lots
          - endpoints.POST_/potato-ops/potato-lots/{id}/dispose
        distinguishing_aspect: |
          Conserved quantity is facility stock mass (cwt):
          current_stock_cwt == sum of net_weight_cwt over IN_STORAGE lots, so
          intake (+1000.0) followed by disposal (-1000.0) returns the facility
          to its exact baseline of 0.0 — the compensating pair leaves no drift,
          and the diverted mass reappears as a 900000-cent cattle-feed batch.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; grower, facility CELL-1 (50000 cwt, stock 0.0), ACTIVE contract."
          setup_api_calls:
            - *d_clock
            - *d_grower
            - *d_facility
            - *d_contract
            - *d_activate
          trigger:
            - *d_lot_a
            - call: "GET /potato-ops/storage-facilities/${facility_id}"
              payload: {}
              as: StorageOperator
              captures: { stock_mid: $.data.current_stock_cwt }
            - call: "POST /potato-ops/potato-lots/${lot_id}/dispose"
              payload: { disposition: "CATTLE_FEED" }
              as: QualityAssuranceLead
            - call: "GET /potato-ops/storage-facilities/${facility_id}"
              payload: {}
              as: StorageOperator
              captures: { stock_end: $.data.current_stock_cwt }
            - call: "GET /potato-ops/byproduct-batches"
              payload: { source_lot_id: "${lot_id}" }
              as: QualityAssuranceLead
              captures: { batch_weight: "$.data[0].weight_cwt", batch_revenue: "$.data[0].total_revenue_cents", batch_routing: "$.data[0].routing" }
          assert:
            - "baseline StorageFacility.${facility_id}.current_stock_cwt == 0.0 before intake"
            - "after intake stock_mid == 1000.0"
            - "after dispose stock_end == 0.0 == baseline (store + dispose conserve the stock quantity)"
            - "ByproductBatch for the lot: weight_cwt == 1000.0, routing == CATTLE_FEED, total_revenue_cents == 900000 (1000.0 x 900)"
            - "PotatoLot.${lot_id}.status == DISPOSED with disposition CATTLE_FEED"

      - name: weekly_capacity_reserve_then_credit_suspend_restores_pool
        grounds:
          - calculations.weekly_capacity_reservation
          - state_machines.SupplyAgreement.ACTIVE_to_SUSPENDED
          - errors.ERR_WEEK_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Conserved quantity is plant weekly case capacity: reserved(ACTIVE
          agreements) + free_pool == 100000 at every step, so activating A
          (60000) then suspending it via credit hold releases exactly its
          reservation — proven operationally when a previously rejected
          40000-case agreement of another chain activates only after the hold.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; chain CH-ALPHA with VALIDATED spec and DRAFT agreement A (60000/wk); chain CH-BETA with VALIDATED spec and DRAFT agreements B1 (40000/wk) and B2 (40000/wk)."
          setup_api_calls:
            - *d_clock
            - *d_chain_a
            - *d_spec_a
            - *d_validate_a
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_a_id}", spec_id: "${spec_a_id}", weekly_contracted_cases: 60000, price_per_case_cents: 305, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_a_id: $.data.id }
            - *d_chain_b
            - *d_spec_b
            - *d_validate_b
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_b_id}", spec_id: "${spec_b_id}", weekly_contracted_cases: 40000, price_per_case_cents: 310, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_b1_id: $.data.id }
            - call: "POST /potato-ops/supply-agreements"
              payload: { customer_id: "${chain_b_id}", spec_id: "${spec_b_id}", weekly_contracted_cases: 40000, price_per_case_cents: 310, term_start: "2026-09-01T00:00:00Z", term_end: "2027-03-01T00:00:00Z" }
              as: AccountManager
              captures: { agr_b2_id: $.data.id }
          trigger:
            - call: "POST /potato-ops/supply-agreements/${agr_a_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /potato-ops/supply-agreements/${agr_b1_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /potato-ops/supply-agreements/${agr_b2_id}/activate"
              payload: {}
              as: AccountManager
              captures: { err_full: $.data.error_id }
            - call: "POST /potato-ops/customer-chains/${chain_a_id}/set-credit-status"
              payload: { credit_status: "ON_HOLD" }
              as: AccountManager
            - call: "POST /potato-ops/supply-agreements/${agr_b2_id}/activate"
              payload: {}
              as: AccountManager
              captures: { b2_status: $.data.status }
          assert:
            - "A (60000) and B1 (40000) activate: pool reaches exactly 0"
            - "B2 first activation fails: 422 ERR_WEEK_CAPACITY_EXCEEDED (nothing left)"
            - "credit hold on CH-ALPHA suspends A and releases exactly 60000 back to the pool"
            - "B2 second activation succeeds: SupplyAgreement.${agr_b2_id}.status == ACTIVE — the reserve/suspend pair conserved the 100000-case pool"
