# =============================================================================
# §1.9 Scaffold Corner Design — task_0122_grant_management
# Breadth/coverage index. Walks references/claim-extraction-guide.md section by
# section against SCAFFOLD.yaml §1.1–§1.7. Complements (never repeats) the depth
# instances in SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Every instance grounds in
# declared scaffold elements; every test_recipe is reachable from empty-DB using
# only §1.5 endpoints; OCC version inputs always reference a ${var}.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities (creation / retrieval / listing / not-found /
  # required-fields / defaults / computed / system / type-constraints /
  # immutability / FK integrity)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_application_returns_201_with_defaults_and_draft_status
        claim_type: Creation
        grounds:
          - endpoints.POST_/applications
          - entities.NofoApplication.fields.status
          - entities.NofoApplication.fields.federal_share_pct
        distinguishing_aspect: |
          POST /applications with all required fields returns 201; status defaults to DRAFT,
          federal_share_pct defaults to 0.80 when omitted, supersedes_application_id defaults to null,
          and the server mints id/created_at/version=1.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C1", applicant_org_name: "Corner Org 1", requested_amount_cents: 30000000, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c1_app_id: $.data.id, c1_status: $.data.status, c1_fsp: $.data.federal_share_pct, c1_ver: $.data.version }
          assert:
            - "NofoApplication.${c1_app_id}.status == DRAFT"
            - "NofoApplication.${c1_app_id}.federal_share_pct == 0.80"
            - "NofoApplication.${c1_app_id}.supersedes_application_id == null"
            - "NofoApplication.${c1_app_id}.version == 1"

      - name: get_application_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/applications/{id}
          - entities.NofoApplication.fields.nofo_number
        distinguishing_aspect: |
          GET /applications/{id} returns the exact stored NofoApplication: the response's nofo_number
          and applicant_org_name equal the values supplied at creation.
        test_recipe:
          setup:
            - "One DRAFT application exists."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C2", applicant_org_name: "Corner Org 2", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c2_app_id: $.data.id }
          trigger:
            - call: "GET /applications/${c2_app_id}"
              payload: {}
              as: GrantWriter
              captures: { c2_nofo: $.data.nofo_number }
          assert:
            - "NofoApplication.${c2_app_id}.nofo_number == NOFO-2026-C2"
            - "NofoApplication.${c2_app_id}.applicant_org_name == Corner Org 2"

      - name: list_applications_paginated_envelope_total_count_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/applications
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /applications?limit=1 over two created applications returns a single-element data array
          with total_count == 2 and has_more == true; response_type == array.
        test_recipe:
          setup:
            - "Two DRAFT applications exist."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C3a", applicant_org_name: "Corner Org 3a", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C3b", applicant_org_name: "Corner Org 3b", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
          trigger:
            - call: "GET /applications?limit=1&offset=0"
              payload: {}
              as: GrantWriter
          assert:
            - "response meta.total_count == 2"
            - "response has_more == true"
            - "response data is an array of length 1"
            - "response response_type == array"

      - name: get_application_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/applications/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET /applications/{id} with a well-formed but non-existent UUID returns ERR_NOT_FOUND (404).
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /applications/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GrantWriter
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_application_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/applications
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /applications omitting the required requested_amount_cents returns ERR_INVALID_REQUEST (400);
          no application is created.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C5", applicant_org_name: "Corner Org 5", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: indirect_rate_de_minimis_ignores_negotiated_rate_field
        claim_type: Computed Fields
        grounds:
          - calculations.indirect_cost_recovery
          - entities.IndirectCostRate.fields.rate_type
          - entities.IndirectCostRate.fields.negotiated_rate
          - entities.FinancialReport.fields.indirect_cost_cents
        distinguishing_aspect: |
          With a DE_MINIMIS rate the indirect_cost_cents is computed at the 0.10 constant and any supplied
          negotiated_rate is ignored: an MTDC-eligible base of 10000000 yields 1000000, regardless of a
          negotiated_rate field set to 0.50 on the (DE_MINIMIS) rate record.
        test_recipe:
          setup:
            - "ACTIVE Award; a DE_MINIMIS ACTIVE rate created with negotiated_rate 0.50 supplied (to be ignored)."
            - "A DRAFT INTERIM report with a single PERSONNEL line 10000000 (fully MTDC-eligible)."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C6", applicant_org_name: "Corner Org 6", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c6_app_id: $.data.id }
            - call: "POST /applications/${c6_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c6_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c6_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c6_award_id: $.data.id, c6_award_v: $.data.version }
            - call: "POST /indirect-cost-rates"
              payload: { award_id: "${c6_award_id}", rate_type: "DE_MINIMIS", negotiated_rate: 0.50, base_type: "MTDC", expected_award_version: "${c6_award_v}" }
              as: FinanceOfficer
            - call: "POST /financial-reports"
              payload: { award_id: "${c6_award_id}", period_label: "FY2026-Q1", report_basis: "INTERIM", direct_cost_lines: [ { category: "PERSONNEL", amount_cents: 10000000 } ] }
              as: FinanceOfficer
              captures: { c6_fr_id: $.data.id }
            - call: "POST /financial-reports/${c6_fr_id}/certify"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /financial-reports/${c6_fr_id}/accept"
              payload: {}
              as: AgencyOfficer
              captures: { c6_indirect: $.data.indirect_cost_cents }
          assert:
            - "FinancialReport.${c6_fr_id}.indirect_cost_cents == 1000000"
            - "FinancialReport.${c6_fr_id}.approved_direct_cents == 10000000"

      - name: award_system_fields_copied_from_application_not_client_supplied
        claim_type: System Fields
        grounds:
          - state_machines.NofoApplication.UNDER_REVIEW_to_AWARDED
          - entities.Award.fields.total_award_cents
          - entities.Award.fields.federal_share_pct
          - entities.Award.fields.federal_ceiling_cents
        distinguishing_aspect: |
          Award is system-minted on award: total_award_cents and federal_share_pct are copied from the
          source application (30000000 / 0.80), federal_ceiling_cents is computed = 24000000, federal_drawn_cents
          starts at 0 — none of these are client-supplied on the award endpoint (its input is empty).
        test_recipe:
          setup:
            - "An application requested_amount_cents 30000000, federal_share_pct 0.80, taken to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C7", applicant_org_name: "Corner Org 7", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c7_app_id: $.data.id }
            - call: "POST /applications/${c7_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c7_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
          trigger:
            - call: "POST /applications/${c7_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c7_award_id: $.data.id }
          assert:
            - "Award.${c7_award_id}.total_award_cents == 30000000"
            - "Award.${c7_award_id}.federal_share_pct == 0.80"
            - "Award.${c7_award_id}.federal_ceiling_cents == 24000000"
            - "Award.${c7_award_id}.federal_drawn_cents == 0"
            - "Award.${c7_award_id}.status == ACTIVE"

      - name: create_subaward_invalid_risk_tier_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/subawards
          - entities.Subaward.fields.risk_tier
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /subawards with risk_tier "CRITICAL" (not in {LOW, MEDIUM, HIGH}) returns ERR_INVALID_REQUEST (400);
          no subaward is created.
        test_recipe:
          setup:
            - "An ACTIVE Award exists."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C8", applicant_org_name: "Corner Org 8", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c8_app_id: $.data.id }
            - call: "POST /applications/${c8_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c8_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c8_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c8_award_id: $.data.id }
          trigger:
            - call: "POST /subawards"
              payload: { award_id: "${c8_award_id}", subrecipient_name: "Sub C8", subaward_amount_cents: 1000000, risk_tier: "CRITICAL" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: fund_allocation_immutable_no_version_field_common_fields_false
        claim_type: Immutability
        grounds:
          - entities.FundAllocation
          - endpoints.GET_/drawdowns/{id}/allocations
        distinguishing_aspect: |
          FundAllocation has common_fields:false — it carries only id and created_at (no version, no
          update endpoint). The only way to observe one is the reverse-reachability GET; a disbursed
          drawdown's allocation line exposes id and created_at but no version field.
        test_recipe:
          setup:
            - "ACTIVE Award; one fund budget 10000000; a drawdown 5000000 DISBURSED producing one FundAllocation."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C9", applicant_org_name: "Corner Org 9", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c9_app_id: $.data.id }
            - call: "POST /applications/${c9_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c9_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c9_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c9_award_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c9_award_id}", category: "PERSONNEL", budgeted_cents: 10000000, priority_order: 1 }
              as: FinanceOfficer
              captures: { c9_rf_id: $.data.id }
            - call: "POST /drawdowns"
              payload: { award_id: "${c9_award_id}", amount_cents: 5000000, allocation_plan: [ { restricted_fund_id: "${c9_rf_id}", amount_cents: 5000000 } ] }
              as: FinanceOfficer
              as_user_id: "officer_draw_c9"
              captures: { c9_dd_id: $.data.id }
            - call: "POST /drawdowns/${c9_dd_id}/disburse"
              payload: {}
              as: FinanceOfficer
              as_user_id: "officer_draw_c9"
          trigger:
            - call: "GET /drawdowns/${c9_dd_id}/allocations"
              payload: {}
              as: FinanceOfficer
          assert:
            - "GET /drawdowns/${c9_dd_id}/allocations returns exactly 1 FundAllocation row"
            - "the allocation row has amount_cents == 5000000 and no version field"

      - name: create_subaward_nonexistent_award_fk_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - endpoints.POST_/subawards
          - entities.Subaward.fields.award_id
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          POST /subawards whose award_id FK points at a non-existent Award returns ERR_NOT_FOUND (404)
          (FK existence is validated before any business rule).
        test_recipe:
          setup:
            - "Empty DB (no awards)."
          setup_api_calls: []
          trigger:
            - call: "POST /subawards"
              payload: { award_id: "00000000-0000-4000-8000-000000000000", subrecipient_name: "Sub C10", subaward_amount_cents: 1000000, risk_tier: "LOW" }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: filtered_list_restricted_funds_by_award_id_fk_integrity
        claim_type: Creation
        grounds:
          - endpoints.GET_/restricted-funds
          - entities.RestrictedFund.fields.award_id
        distinguishing_aspect: |
          Flat-topology FK integrity (entity_topology: flat): GET /restricted-funds?award_id=<A> returns
          only funds whose award_id == A; a fund created under a different award is excluded. Two funds on
          award A, one on award B -> filtered list for A returns total_count 2.
        test_recipe:
          setup:
            - "Two ACTIVE Awards A and B; two RestrictedFunds under A and one under B."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C11A", applicant_org_name: "Corner Org 11A", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c11a_app_id: $.data.id }
            - call: "POST /applications/${c11a_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c11a_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c11a_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c11a_award_id: $.data.id }
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C11B", applicant_org_name: "Corner Org 11B", requested_amount_cents: 50000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c11b_app_id: $.data.id }
            - call: "POST /applications/${c11b_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c11b_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c11b_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c11b_award_id: $.data.id }
            - call: "POST /restricted-funds"
              payload: { award_id: "${c11a_award_id}", category: "PERSONNEL", budgeted_cents: 5000000, priority_order: 1 }
              as: FinanceOfficer
            - call: "POST /restricted-funds"
              payload: { award_id: "${c11a_award_id}", category: "TRAVEL", budgeted_cents: 3000000, priority_order: 2 }
              as: FinanceOfficer
            - call: "POST /restricted-funds"
              payload: { award_id: "${c11b_award_id}", category: "PERSONNEL", budgeted_cents: 4000000, priority_order: 1 }
              as: FinanceOfficer
          trigger:
            - call: "GET /restricted-funds?award_id=${c11a_award_id}"
              payload: {}
              as: FinanceOfficer
          assert:
            - "response meta.total_count == 2"
            - "every returned RestrictedFund has award_id == ${c11a_award_id}"

  # ===========================================================================
  # SECTION 2 — State Machines (valid transition / precondition / side-effect /
  # invalid-from / initial-state / terminal-lockdown / idempotency /
  # shape-specific / side-effect patterns)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: subaward_full_lifecycle_proposed_approved_active_terminated
        claim_type: Valid Transition
        grounds:
          - state_machines.Subaward.PROPOSED_to_APPROVED
          - state_machines.Subaward.APPROVED_to_ACTIVE
          - state_machines.Subaward.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          The full Subaward forward path PROPOSED -> APPROVED -> ACTIVE -> TERMINATED each succeeds while
          the parent Award is ACTIVE; final status is TERMINATED.
        test_recipe:
          setup:
            - "An ACTIVE Award with a PROPOSED LOW-risk subaward."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C12", applicant_org_name: "Corner Org 12", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c12_app_id: $.data.id }
            - call: "POST /applications/${c12_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c12_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c12_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c12_award_id: $.data.id }
            - call: "POST /subawards"
              payload: { award_id: "${c12_award_id}", subrecipient_name: "Sub C12", subaward_amount_cents: 2000000, risk_tier: "LOW" }
              as: ProgramManager
              captures: { c12_sub_id: $.data.id }
            - call: "POST /subawards/${c12_sub_id}/approve"
              payload: {}
              as: ProgramManager
            - call: "POST /subawards/${c12_sub_id}/activate"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /subawards/${c12_sub_id}/terminate"
              payload: {}
              as: ProgramManager
          assert:
            - "Subaward.${c12_sub_id}.status == TERMINATED"

      - name: begin_review_on_draft_application_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.NofoApplication.SUBMITTED_to_UNDER_REVIEW
          - validations[priority=4]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          begin-review is defined only from SUBMITTED; invoking it on a DRAFT application (a state with no
          begin-review transition) returns ERR_INVALID_STATE (409); status stays DRAFT.
        test_recipe:
          setup:
            - "A DRAFT application (never submitted)."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C13", applicant_org_name: "Corner Org 13", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c13_app_id: $.data.id }
          trigger:
            - call: "POST /applications/${c13_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "NofoApplication.${c13_app_id}.status == DRAFT"

      - name: award_terminal_closed_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Award.PENDING_CLOSEOUT_to_CLOSED
          - state_machines.Award.ACTIVE_to_SUSPENDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          CLOSED is terminal for Award: suspending a CLOSED award returns ERR_INVALID_STATE (409) — no
          transition is defined out of CLOSED. Award stays CLOSED.
        test_recipe:
          setup:
            - "An award driven to CLOSED with no open obligations (no funds, no subawards, no reports, no audits)."
          setup_api_calls:
            - call: "POST /applications"
              payload: { nofo_number: "NOFO-2026-C14", applicant_org_name: "Corner Org 14", requested_amount_cents: 30000000, federal_share_pct: 0.80, period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-12-31T00:00:00Z" }
              as: GrantWriter
              captures: { c14_app_id: $.data.id }
            - call: "POST /applications/${c14_app_id}/submit"
              payload: {}
              as: GrantWriter
            - call: "POST /applications/${c14_app_id}/begin-review"
              payload: {}
              as: AgencyOfficer
            - call: "POST /applications/${c14_app_id}/award"
              payload: {}
              as: AgencyOfficer
              captures: { c14_award_id: $.data.id, c14_v_active: $.data.version }
            - call: "POST /awards/${c14_award_id}/initiate-closeout"
              payload: { expected_award_version: "${c14_v_active}" }
              as: AgencyOfficer
