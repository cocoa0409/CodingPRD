          assert:
            - "response status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "data.error_id != ERR_INSPECTION_FREQUENCY_INVALID"
            - "GET /tsdf/storage-units?facility_id=${fac_id} returns total_count == 0"

      - name: container_create_with_unknown_manifest_line_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_REFERENCE_NOT_FOUND]
          - endpoints[POST /tsdf/containers]
        distinguishing_aspect: |
          manifest_line_id is a body foreign key, not a path segment, so an unknown value yields
          priority 6's ERR_REFERENCE_NOT_FOUND (404) rather than any of the entity-specific 404s of
          priority 5, and the referenced storage unit's figures stay untouched.
        test_recipe:
          setup:
            - "Facility with assurance and one empty CONTAINER_AREA unit"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
