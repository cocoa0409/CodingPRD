# =============================================================================
# Task 1167: County Fair Livestock Show & Premium Auction — §1.9 Corner Design
# Breadth coverage of every §1.1–§1.7 claim not already covered by §1.8.
# excluded_because stubs cite the covering §1.8 instance by name.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: fair_created_with_defaults_and_setup_posture
        claim_type: creation
        grounds: [entities.Fair.fields.posture, entities.Fair.fields.available_premium_pool_cents, entities.Fair.fields.large_class_min_entries]
        distinguishing_aspect: "Omitting optional config applies defaults (large_class_min_entries=8, large_class_bonus_rate=0.10); new fair starts at posture SETUP with available_premium_pool_cents == premium_budget_cents."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair C1", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id, posture: $.data.posture, pool: $.data.available_premium_pool_cents, lcm: $.data.large_class_min_entries, lcb: $.data.large_class_bonus_rate } }
          trigger:
            - { call: "GET /v1/fairs/${fair_id}", as: FairBoardAdmin, captures: { posture2: $.data.posture, ver: $.data.version } }
          assert:
            - "Fair.posture == SETUP and version == 1"
            - "Fair.available_premium_pool_cents == 100000 (initialized to budget)"
            - "large_class_min_entries == 8 and large_class_bonus_rate == 0.10 (defaults applied)"
      - name: entry_create_missing_required_species
        claim_type: required_fields
        grounds: [entities.AnimalEntry.fields.species, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /v1/entries without the required species field is rejected with ERR_INVALID_REQUEST (400) and nothing is persisted."
        test_recipe:
          setup: ["Fair in ENTRIES_OPEN with one exhibitor"]
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair C2", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_OPEN }, as: FairBoardAdmin }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ann A", organization: FFA }, as: FairBoardAdmin, captures: { exh_a: $.data.id } }
          trigger:
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", tag_number: "S-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
      - name: entry_create_invalid_enum_species
        claim_type: type_constraints
        grounds: [entities.AnimalEntry.fields.species, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A species value outside the declared enum (PIGEON) is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Fair in ENTRIES_OPEN with one exhibitor"]
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair C3", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_OPEN }, as: FairBoardAdmin }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ann A", organization: FFA }, as: FairBoardAdmin, captures: { exh_a: $.data.id } }
          trigger:
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: PIGEON, tag_number: "S-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
      - name: entry_system_and_computed_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.AnimalEntry.fields.status, entities.AnimalEntry.fields.official_weight_lbs, entities.AnimalEntry.fields.class_id]
        distinguishing_aspect: "Client-supplied status / official_weight_lbs / class_id in the create body are ignored: the entry is created ENTERED with null weight and null class."
        test_recipe:
          setup: ["Fair in ENTRIES_OPEN with one exhibitor"]
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair C4", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_OPEN }, as: FairBoardAdmin }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ann A", organization: FFA }, as: FairBoardAdmin, captures: { exh_a: $.data.id } }
          trigger:
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_STEER, tag_number: "S-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z", status: SHOWN, official_weight_lbs: 999, state_fair_qualified: true }, as: Exhibitor, as_user_id: "${exh_a}", captures: { st: $.data.status, wt: $.data.official_weight_lbs, qual: $.data.state_fair_qualified } }
          assert:
            - "status == ENTERED, official_weight_lbs == null, state_fair_qualified == false (client values ignored)"
      - name: bidder_number_computed_in_created_at_order
        claim_type: computed_fields
        grounds: [entities.Buyer.fields.bidder_number]
        distinguishing_aspect: "bidder_number is server-computed per fair in created_at order: first buyer B-001, second B-002; input cannot set it."
        test_recipe:
          setup: ["Fair created"]
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair C5", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
          trigger:
            - { call: "POST /v1/buyers", payload: { fair_id: "${fair_id}", business_name: "Alpha Meats", credit_limit_cents: 500000 }, as: FairBoardAdmin, captures: { b1: $.data.bidder_number } }
            - { call: "POST /v1/buyers", payload: { fair_id: "${fair_id}", business_name: "Beta Foods", credit_limit_cents: 500000 }, as: FairBoardAdmin, captures: { b2: $.data.bidder_number } }
          assert:
            - "first buyer bidder_number == B-001; second == B-002"
      - name: get_nonexistent_exhibitor_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/exhibitors/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: FairBoardAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND"
      - name: entries_filtered_list_by_exhibitor_fk
        claim_type: parent_relationships
        grounds: [entities.AnimalEntry.fields.exhibitor_id, endpoints]
        distinguishing_aspect: "GET /v1/entries?exhibitor_id=X returns exactly that exhibitor's entries (FK reverse-reachability); a second exhibitor's entries are excluded."
        test_recipe:
          setup: ["Fair in ENTRIES_OPEN; exhibitor A with 2 entries, exhibitor B with 1"]
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair C7", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_OPEN }, as: FairBoardAdmin }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ann A", organization: FFA }, as: FairBoardAdmin, captures: { exh_a: $.data.id } }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ben B", organization: FOUR_H }, as: FairBoardAdmin, captures: { exh_b: $.data.id } }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_STEER, tag_number: "S-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}" }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_LAMB, tag_number: "L-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}" }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_b}", species: MARKET_GOAT, tag_number: "G-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_b}" }
          trigger:
            - { call: "GET /v1/entries?exhibitor_id=${exh_a}", as: FairBoardAdmin, captures: { n_a: $.meta.total_count } }
            - { call: "GET /v1/entries?exhibitor_id=${exh_b}", as: FairBoardAdmin, captures: { n_b: $.meta.total_count } }
          assert:
            - "entries of exhibitor A: total_count == 2; exhibitor B: total_count == 1"
      - name: entries_list_pagination_defaults_and_has_more
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor limit/offset with total_count and has_more; limit=2 over 3 rows returns 2 rows, total_count 3, has_more true."
        test_recipe:
          setup: ["Fair in ENTRIES_OPEN; one exhibitor with 3 entries"]
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair C8", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: ENTRIES_OPEN }, as: FairBoardAdmin }
            - { call: "POST /v1/exhibitors", payload: { fair_id: "${fair_id}", full_name: "Ann A", organization: FFA }, as: FairBoardAdmin, captures: { exh_a: $.data.id } }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_STEER, tag_number: "S-001", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}" }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_STEER, tag_number: "S-002", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}" }
            - { call: "POST /v1/entries", payload: { fair_id: "${fair_id}", exhibitor_id: "${exh_a}", species: MARKET_STEER, tag_number: "S-003", ownership_acquired_at: "2026-04-01T00:00:00Z", possession_start_at: "2026-05-01T00:00:00Z" }, as: Exhibitor, as_user_id: "${exh_a}" }
          trigger:
            - { call: "GET /v1/entries?fair_id=${fair_id}&limit=2&offset=0", as: FairBoardAdmin, captures: { total: $.meta.total_count, more: $.meta.has_more } }
            - { call: "GET /v1/entries?fair_id=${fair_id}&limit=2&offset=2", as: FairBoardAdmin, captures: { more2: $.meta.has_more } }
          assert:
            - "page 1: total_count == 3 and has_more == true"
            - "page 2 (offset 2): has_more == false"
  - section: state_machines
    instances:
      - name: fair_advance_skipping_steps_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Fair, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "advance-posture is strictly one step: SETUP -> WEIGH_IN is rejected with ERR_INVALID_STATE and posture stays SETUP."
        test_recipe:
          setup: ["Fair created (posture SETUP)"]
          setup_api_calls:
            - { call: "POST /v1/fairs", payload: { name: "Fair S1", ownership_deadline_at: "2026-06-01T00:00:00Z", possession_deadline_at: "2026-06-15T00:00:00Z", premium_budget_cents: 100000, commission_rate: 0.05, buyer_premium_rate: 0.03, yardage_fee_cents: 1500, premium_cap_cents: 60000, premium_schedule: { MARKET_STEER: { grand_champion_cents: 50000, reserve_champion_cents: 30000, rank_1_cents: 12000, rank_2_cents: 10000, rank_3_cents: 8000, other_rank_cents: 4000 }, MARKET_SWINE: { grand_champion_cents: 40000, reserve_champion_cents: 24000, rank_1_cents: 10000, rank_2_cents: 8000, rank_3_cents: 6000, other_rank_cents: 3000 }, MARKET_LAMB: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 }, MARKET_GOAT: { grand_champion_cents: 30000, reserve_champion_cents: 20000, rank_1_cents: 9000, rank_2_cents: 7000, rank_3_cents: 5000, other_rank_cents: 2500 } }, state_qualify_rank: { MARKET_STEER: 2, MARKET_SWINE: 2, MARKET_LAMB: 2, MARKET_GOAT: 2 }, sale_rank_threshold: { MARKET_STEER: 3, MARKET_SWINE: 3, MARKET_LAMB: 3, MARKET_GOAT: 3 }, species_sale_order: [MARKET_STEER, MARKET_SWINE, MARKET_LAMB, MARKET_GOAT] }, as: FairBoardAdmin, captures: { fair_id: $.data.id } }
          trigger:
            - { call: "POST /v1/fairs/${fair_id}/advance-posture", payload: { to_posture: WEIGH_IN }, as: FairBoardAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /v1/fairs/${fair_id}", as: FairBoardAdmin, captures: { posture: $.data.posture } }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Fair.posture remains SETUP"
      - name: fair_reopen_entries_cycle_then_blocked_after_weigh
        claim_type: valid_transition
        grounds: [state_machines.Fair.ENTRIES_LOCKED_to_ENTRIES_OPEN]
