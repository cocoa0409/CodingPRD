  - rule_id: transitive_cascade
    instances:
      - name: wholesale_event_four_hop_cascade
        grounds:
          - state_machines.Vehicle.inventory_state.IN_INVENTORY_to_WHOLESALED
          - state_machines.Certification.ACTIVE_to_DECERTIFIED
          - state_machines.Listing.SYNDICATED_to_WITHDRAWN
          - state_machines.Complaint.REINSPECTION_ORDERED_to_DISMISSED
          - state_machines.Inspection.IN_PROGRESS_to_VOIDED
          - entities.Listing.fields.removal_due_at
          - entities.Inspection.fields.failure_reason
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: |
          A single WHOLESALED history event propagates four hops that each depend on the previous one:
          inventory_state -> certification DECERTIFIED -> listing WITHDRAWN plus complaint DISMISSED
          plus vehicle cpo_state DECERTIFIED -> the complaint's open re-inspection VOIDED with
          failure_reason COMPLAINT_DISMISSED. Hop 4 is reachable only through the complaint dismissed
          in hop 3, and the fee is deliberately NOT credited, which is the opposite of the audit-fail
          cascade's ledger behaviour.
        test_recipe:
          setup:
            - "One dealer, technicians T1 (initial inspection) and T2 (re-inspection), the published MPI-172 template."
            - "Vehicle V1 is CERTIFIED under ACTIVE certification C1 (fee 120400 billed) with listing L1 SYNDICATED to OEM_SITE."
