        excluded_because:
          difficulty_instance: combinatorial_formula / gas_balance_style_temperature_band_and_bore_each_swap_one_constant
          rationale: "Propagation to a fixed point (restriction vs equilibrium selecting required_applied_psi, then the CO2 clamp at 40.0/100.0) is asserted by the named §1.8 instance."

