  - rule_id: boundary_precision_check
    instances:
      - name: cooling_load_at_exact_capacity_is_admitted_one_step_beyond_is_refused
        grounds:
          - validations.priority_25_ERR_COOLING_CAPACITY_EXCEEDED
          - calculations.circuit_allocated_kw
          - calculations.row_capacity_and_posture.constants.COOLING_ALERT_RATIO
          - entities.FloorRow.fields.cooling_load_kw
          - entities.FloorRow.fields.stranded_nameplate_kw
        distinguishing_aspect: |
          The row's cooling_capacity_kw is set to exactly 21.120, the sum of a 50A and a 60A
          derated feed (9.600 + 11.520). The second energization lands ON the ceiling and is
          ADMITTED because the gate is <=, it also trips the 0.90 alert ratio
          (21.120 >= 19.008) so row_status becomes COOLING_CONSTRAINED, and stranded_nameplate_kw
          settles on exactly 0.000. A third 25A feed pushes the projection to 25.920 and is
          refused, so > and >= cannot be swapped anywhere in the chain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Row HC/R1: design_density_kw_per_cabinet 25.0, max_row_power_kw 200.0, cooling_capacity_kw 21.120 — chosen to equal 9.600 + 11.520 exactly."
            - "Contract ACTIVE with power_commit_kw 30.0 (over-provision ceiling 33.000)."
            - "Cabinet C01 rated 25.0 kW INSTALLED (breaker ceiling 31.250), carrying three APPROVED PRIMARY circuits: 50A/240V (derated 9.600), 60A/240V (derated 11.520) and 25A/240V (derated 4.800)."
          setup_api_calls:
            - call: "POST /colocation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FacilityManager
            - call: "POST /colocation/customers"
              payload: { legal_name: "Solstice Grid", account_code: "SOL" }
              as: FacilityManager
              captures: { cust_id: $.data.id }
            - call: "POST /colocation/rows"
              payload: { hall_code: "HC", row_code: "R1", cabinet_slot_count: 8, design_density_kw_per_cabinet: 25.0, max_row_power_kw: 200.0, cooling_capacity_kw: 21.120, escort_slot_count: 1, decommission_flag: false }
              as: FacilityManager
              captures: { row_id: $.data.id }
            - call: "POST /colocation/contracts"
              payload: { customer_id: "${cust_id}", contract_number: "C-9012", billing_mode: "COMMITTED_ONLY", committed_cabinet_count: 1, power_commit_kw: 30.0, committed_bandwidth_mbps: 1000, cross_connect_cap: 4, term_start_date: "2026-07-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", committed_cage_sqft: 0, redundancy_requirement: "N", cross_connect_allowance: 0, remote_hands_included_minutes: 0 }
              as: BillingOperator
              captures: { ctr_id: $.data.id }
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "PENDING_ACTIVATION" }
              as: FacilityManager
            - call: "POST /colocation/cabinets"
              payload: { row_id: "${row_id}", cabinet_code: "C01", rated_power_kw: 25.0, footprint_type: "CABINET", u_height: 42 }
              as: FacilityManager
              captures: { cab_id: $.data.id }
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "RESERVED", contract_id: "${ctr_id}" }
              as: FacilityManager
            - call: "POST /colocation/contracts/${ctr_id}/state"
              payload: { to_state: "ACTIVE" }
              as: FacilityManager
            - call: "POST /colocation/cabinets/${cab_id}/state"
              payload: { to_state: "INSTALLED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-1", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 50, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir1_id: $.data.id }
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-2", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 60, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir2_id: $.data.id }
            - call: "POST /colocation/power-circuits"
              payload: { cabinet_id: "${cab_id}", circuit_code: "A-3", feed_side: "A", redundancy_role: "PRIMARY", breaker_amps: 25, volts: 240, phase: "SINGLE" }
              as: ProvisioningEngineer
              captures: { cir3_id: $.data.id }
            - call: "POST /colocation/power-circuits/${cir1_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits/${cir2_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
            - call: "POST /colocation/power-circuits/${cir3_id}/state"
              payload: { to_state: "APPROVED" }
              as: FacilityManager
          trigger:
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv1: $.data.version }
            - call: "POST /colocation/power-circuits/${cir1_id}/energize"
              payload: { expected_row_version: "${rv1}" }
              as: ProvisioningEngineer
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv2: $.data.version }
            - call: "POST /colocation/power-circuits/${cir2_id}/energize"
              payload: { expected_row_version: "${rv2}" }
              as: ProvisioningEngineer
            - call: "GET /colocation/rows/${row_id}"
              as: FacilityManager
              captures: { rv3: $.data.version }
            - call: "POST /colocation/power-circuits/${cir3_id}/energize"
              payload: { expected_row_version: "${rv3}" }
              as: ProvisioningEngineer
          assert:
            - "After energization 1: FloorRow.${row_id}.cooling_load_kw == 9.600, allocated_power_kw == 9.600, row_status == OPEN because 9.600 < 19.008"
            - "Energization 2 returns 200 at exact equality: FloorRow.${row_id}.cooling_load_kw == 21.120 == cooling_capacity_kw"
            - "PowerCircuit.${cir2_id}.status == ENERGIZED, allocated_kw == 11.520, cooling_contribution_kw == 11.520"
            - "FloorRow.${row_id}.allocated_power_kw == 21.120, density_ceiling_kw == 25.000, effective_ceiling_kw == 21.120, stranded_nameplate_kw == 0.000"
            - "FloorRow.${row_id}.row_status == COOLING_CONSTRAINED because 21.120 >= 19.008"
            - "Energization 3 returns 422 ERR_COOLING_CAPACITY_EXCEEDED because the projection is 25.920 > 21.120"
            - "After the refusal PowerCircuit.${cir3_id}.status == APPROVED, allocated_kw == 0.000 and FloorRow.${row_id}.cooling_load_kw is still 21.120"
            - "Contract.${ctr_id}.provisioned_power_kw == 21.120, stranded_commit_kw == 8.880, commit_utilization_pct == 70.4"

