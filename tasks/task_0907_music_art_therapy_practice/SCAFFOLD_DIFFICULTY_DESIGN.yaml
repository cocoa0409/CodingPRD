# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Music & Art Therapy Practice. 9 rules x 2 instances = 18 instances.
# All literals precomputed against SCAFFOLD.yaml §1.3 constants.
# =============================================================================
scaffold_difficulty_design:

  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: superbill_estimated_vs_final_patient_responsibility
        grounds:
          - calculations.superbill_patient_responsibility
          - entities.Superbill.fields.patient_responsibility_cents
          - state_machines.Superbill.SUBMITTED_to_ADJUDICATED
        distinguishing_aspect: |
          Same INSURANCE Superbill: ESTIMATED patient_responsibility (2501, from billed
          12503 * 0.20) diverges from FINAL (2000, from remittance allowed 10000 * 0.20) —
          dual-variant on the Superbill entity domain (billing).
        test_recipe:
          setup:
            - "Insurance client (coinsurance 0.20, contracted 12503, 5 visits), plan ACTIVE, goal, room."
            - "One INDIVIDUAL session (no material) COMPLETED with the client attended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T Dual", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Ins Client", dob: "2015-04-01", payer_type: "INSURANCE", insurance_payer_name: "BlueCo", insurance_coinsurance_pct: 0.20, insurance_contracted_rate_cents: 12503, insurance_visits_authorized: 5 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${client_id}", referral_source: "School", reason: "anxiety", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 40 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${client_id}/treatment-plans"
              payload: { referral_id: "${ref_id}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${plan_id}/goals"
              payload: { description: "Reduce anxiety", target_sessions: 4, weight: 1.0 }
              as: ClinicalDirector
              captures: { goal_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room A", capacity: 4 }
              as: IntakeCoordinator
              captures: { room_id: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room_id}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/enrollments"
              payload: { client_id: "${client_id}" }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:30:00Z" }
              as: IntakeCoordinator
            - call: "POST /sessions/${sess_id}/complete"
              payload: { attended_client_ids: ["${client_id}"] }
              as: Therapist
              as_user_id: "${ther_id}"
          trigger:
            - call: "POST /superbills"
              payload: { session_id: "${sess_id}", client_id: "${client_id}" }
              as: BillingSpecialist
              captures: { sb_id: $.data.id, est_pr: $.data.patient_responsibility_cents }
            - call: "POST /superbills/${sb_id}/adjudicate"
              payload: { allowed_amount_cents: 10000 }
              as: BillingSpecialist
          assert:
            - "Superbill.${sb_id}.patient_responsibility_cents == 2501 immediately after create (ESTIMATED)"
            - "Superbill.${sb_id}.patient_responsibility_cents == 2000 after adjudicate (FINAL)"
            - "Superbill.${sb_id}.adjustment_cents == 2503 after adjudicate"
            - "Superbill.${sb_id}.plan_paid_cents == 8000 after adjudicate"

      - name: goal_progress_attendance_vs_rubric_divergence
        grounds:
          - calculations.goal_progress
          - entities.Goal.fields.progress_attendance
          - entities.Goal.fields.progress_rubric
        distinguishing_aspect: |
          Same Goal, same session history: attendance variant = 0.50 (2 completed of
          target 4) while rubric variant = 0.60 (mean of signed rubric 40,80 / 100) —
          dual-variant on the Goal entity domain (clinical outcome), a different entity
          domain than the Superbill dual-variant above.
        test_recipe:
          setup:
            - "Insurance client, plan ACTIVE, one goal target_sessions=4."
            - "Two INDIVIDUAL sessions on the goal, both COMPLETED with the client attended."
            - "One signed progress note per session with rubric 40 and 80."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T Prog", discipline: "ART", credential: "ATR-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Prog Client", dob: "2016-01-01", payer_type: "INSURANCE", insurance_payer_name: "BlueCo", insurance_coinsurance_pct: 0.20, insurance_contracted_rate_cents: 12503, insurance_visits_authorized: 5 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${client_id}", referral_source: "Physician", reason: "coping", referred_discipline: "ART" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 30 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${client_id}/treatment-plans"
              payload: { referral_id: "${ref_id}", discipline: "ART", weekly_frequency: 2, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${plan_id}/goals"
              payload: { description: "Improve coping", target_sessions: 4, weight: 1.0 }
              as: ClinicalDirector
              captures: { goal_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Studio", capacity: 4 }
              as: IntakeCoordinator
              captures: { room_id: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room_id}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/enrollments"
              payload: { client_id: "${client_id}" }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { e1: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room_id}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T11:00:00Z", end_utc: "2026-06-01T12:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { s2: $.data.id }
            - call: "POST /sessions/${s2}/enrollments"
              payload: { client_id: "${client_id}" }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { e2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T13:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /sessions/${s1}/complete"
              payload: { attended_client_ids: ["${client_id}"] }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /sessions/${s2}/complete"
              payload: { attended_client_ids: ["${client_id}"] }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /enrollments/${e1}/progress-notes"
              payload: { narrative: "Session 1", rubric_score: 40, outcome_rating: "IMPROVED" }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { n1: $.data.id }
            - call: "POST /progress-notes/${n1}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /enrollments/${e2}/progress-notes"
              payload: { narrative: "Session 2", rubric_score: 80, outcome_rating: "IMPROVED" }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { n2: $.data.id }
          trigger:
            - call: "POST /progress-notes/${n2}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${ther_id}"
          assert:
            - "Goal.${goal_id}.progress_attendance == 0.50"
            - "Goal.${goal_id}.progress_rubric == 0.60"
            - "Goal.${goal_id}.status == OPEN (0.50 attendance < 1.0, not auto-MET)"

  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sliding_scale_fee_tiered_fpl_bands
        grounds:
          - calculations.sliding_scale_fee
          - entities.Superbill.fields.patient_responsibility_cents
          - entities.Client.fields.household_income_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (household_income_cents 3000000, household_size 2, modality
          INDIVIDUAL) with tiered band selection + nested max/min cap. ratio =
          3000000 / (1560000 + 550000) = 1.4218 -> band <=1.50 -> discount 0.75 ->
          fee = round(12503*0.25) = 3126.
        test_recipe:
          setup:
            - "Self-pay client household_income_cents=3000000, household_size=2."
            - "Plan ACTIVE, goal; one INDIVIDUAL session COMPLETED with the client attended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T Slide", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "SP Client", dob: "2014-02-02", payer_type: "SELF_PAY", household_income_cents: 3000000, household_size: 2 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${client_id}", referral_source: "Self", reason: "wellness", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 55 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${client_id}/treatment-plans"
              payload: { referral_id: "${ref_id}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${plan_id}/goals"
              payload: { description: "Wellbeing", target_sessions: 6, weight: 1.0 }
              as: ClinicalDirector
              captures: { goal_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room B", capacity: 3 }
              as: IntakeCoordinator
              captures: { room_id: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room_id}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/enrollments"
              payload: { client_id: "${client_id}" }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:30:00Z" }
              as: IntakeCoordinator
            - call: "POST /sessions/${sess_id}/complete"
              payload: { attended_client_ids: ["${client_id}"] }
              as: Therapist
              as_user_id: "${ther_id}"
          trigger:
            - call: "POST /superbills"
              payload: { session_id: "${sess_id}", client_id: "${client_id}" }
              as: BillingSpecialist
              captures: { sb_id: $.data.id }
          assert:
            - "Superbill.${sb_id}.patient_responsibility_cents == 3126"
            - "Superbill.${sb_id}.plan_paid_cents == 0"
            - "Superbill.${sb_id}.adjustment_cents == 9377 (billed 12503 - fee 3126)"

      - name: superbill_multicomponent_round_then_sum
        grounds:
          - calculations.superbill_patient_responsibility
          - entities.Superbill.fields.materials_charge_cents
          - entities.MaterialItem.fields.unit_charge_cents
        distinguishing_aspect: |
          Mode (b): patient_responsibility rounds EACH component then sums —
          round(12503*0.20)=2501 plus round(1253*0.20)=251 -> 2752. The forbidden
          sum-then-round path (round(13756*0.20)=2751) differs by 1 cent; the scaffold
          pins round-per-component-then-sum. Different mode than the tiered sliding-scale (a).
        test_recipe:
          setup:
            - "Insurance client coinsurance 0.20; material unit_charge_cents=1253 on_hand>=1."
            - "One INDIVIDUAL session with material_qty=1 COMPLETED with the client attended."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T Round", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Round Client", dob: "2013-03-03", payer_type: "INSURANCE", insurance_payer_name: "BlueCo", insurance_coinsurance_pct: 0.20, insurance_contracted_rate_cents: 13756, insurance_visits_authorized: 5 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${client_id}", referral_source: "School", reason: "focus", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 45 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${client_id}/treatment-plans"
              payload: { referral_id: "${ref_id}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${plan_id}/goals"
              payload: { description: "Focus", target_sessions: 6, weight: 1.0 }
              as: ClinicalDirector
              captures: { goal_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room C", capacity: 3 }
              as: IntakeCoordinator
              captures: { room_id: $.data.id }
            - call: "POST /materials"
              payload: { name: "Djembe", category: "INSTRUMENT", on_hand_quantity: 4, unit_charge_cents: 1253 }
              as: IntakeCoordinator
              captures: { mat_id: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room_id}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1, material_item_id: "${mat_id}", material_qty: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/enrollments"
              payload: { client_id: "${client_id}" }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:30:00Z" }
              as: IntakeCoordinator
            - call: "POST /sessions/${sess_id}/complete"
              payload: { attended_client_ids: ["${client_id}"] }
              as: Therapist
              as_user_id: "${ther_id}"
          trigger:
            - call: "POST /superbills"
              payload: { session_id: "${sess_id}", client_id: "${client_id}" }
              as: BillingSpecialist
              captures: { sb_id: $.data.id }
          assert:
            - "Superbill.${sb_id}.therapy_charge_cents == 12503"
            - "Superbill.${sb_id}.materials_charge_cents == 1253"
            - "Superbill.${sb_id}.billed_amount_cents == 13756"
            - "Superbill.${sb_id}.patient_responsibility_cents == 2752 (2501 + 251, NOT 2751)"

  # ==========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: treatment_plan_revision_cycle
        grounds:
          - state_machines.TreatmentPlan.ACTIVE_to_UNDER_REVISION
          - state_machines.TreatmentPlan.UNDER_REVISION_to_ACTIVE
          - entities.TreatmentPlan.fields.revision_count
        distinguishing_aspect: |
          Cyclic shape on TreatmentPlan: DRAFT->ACTIVE->UNDER_REVISION->ACTIVE returns to
          ACTIVE with revision_count incremented to 1 — a loop, not a linear pipeline.
        test_recipe:
          setup:
            - "A DRAFT treatment plan for an insurance client (referral ASSESSED+recommended)."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "T Cyc", discipline: "MUSIC", credential: "MT-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Cyc Client", dob: "2012-05-05", payer_type: "INSURANCE", insurance_payer_name: "BlueCo", insurance_visits_authorized: 5 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${client_id}", referral_source: "School", reason: "speech", referred_discipline: "MUSIC" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 50 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${client_id}/treatment-plans"
              payload: { referral_id: "${ref_id}", discipline: "MUSIC", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${plan_id}/revise"
              payload: { revision_note: "Adjust goals" }
              as: ClinicalDirector
          trigger:
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
              captures: { final_status: $.data.status, rc: $.data.revision_count }
          assert:
            - "TreatmentPlan.${plan_id}.status == ACTIVE after the second activate"
            - "TreatmentPlan.${plan_id}.revision_count == 1"

      - name: session_parallel_scheduling_billing_axes
        grounds:
          - entities.Session.fields.scheduling_status
          - entities.Session.fields.billing_status
          - state_machines.Session.UNBILLED_to_BILLED
          - state_machines.Session.BILLED_to_ADJUDICATED
        distinguishing_aspect: |
          Parallel dimensions on one Session: scheduling_status stays COMPLETED unchanged
          while billing_status independently advances UNBILLED->BILLED->ADJUDICATED across
          two calls — two axes evolving independently on the same row.
        test_recipe:
          setup:
            - "Insurance client, plan ACTIVE, goal, room; one INDIVIDUAL session COMPLETED (client attended)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: IntakeCoordinator
            - call: "POST /therapists"
              payload: { full_name: "T Par", discipline: "ART", credential: "ATR-BC" }
              as: IntakeCoordinator
              captures: { ther_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Par Client", dob: "2011-06-06", payer_type: "INSURANCE", insurance_payer_name: "BlueCo", insurance_coinsurance_pct: 0.20, insurance_contracted_rate_cents: 12503, insurance_visits_authorized: 5 }
              as: IntakeCoordinator
              captures: { client_id: $.data.id, cv0: $.data.version }
            - call: "POST /referrals"
              payload: { client_id: "${client_id}", referral_source: "Physician", reason: "trauma", referred_discipline: "ART" }
              as: IntakeCoordinator
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/assess"
              payload: { recommendation: "THERAPY_RECOMMENDED", baseline_score: 35 }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /clients/${client_id}/treatment-plans"
              payload: { referral_id: "${ref_id}", discipline: "ART", weekly_frequency: 1, expected_client_version: "${cv0}" }
              as: ClinicalDirector
              captures: { plan_id: $.data.id }
            - call: "POST /treatment-plans/${plan_id}/activate"
              payload: {}
              as: ClinicalDirector
            - call: "POST /treatment-plans/${plan_id}/goals"
              payload: { description: "Process trauma", target_sessions: 8, weight: 1.0 }
              as: ClinicalDirector
              captures: { goal_id: $.data.id }
            - call: "POST /rooms"
              payload: { name: "Room D", capacity: 3 }
              as: IntakeCoordinator
              captures: { room_id: $.data.id }
            - call: "POST /sessions"
              payload: { therapist_id: "${ther_id}", room_id: "${room_id}", plan_id: "${plan_id}", goal_id: "${goal_id}", modality: "INDIVIDUAL", start_utc: "2026-06-01T09:00:00Z", end_utc: "2026-06-01T10:00:00Z", capacity: 1 }
              as: Therapist
              as_user_id: "${ther_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/enrollments"
              payload: { client_id: "${client_id}" }
              as: Therapist
              as_user_id: "${ther_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:30:00Z" }
              as: IntakeCoordinator
            - call: "POST /sessions/${sess_id}/complete"
              payload: { attended_client_ids: ["${client_id}"] }
              as: Therapist
              as_user_id: "${ther_id}"
          trigger:
            - call: "POST /superbills"
