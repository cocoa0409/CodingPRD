              as_user_id: "fin-1"
              captures: { pool_id: $.data.id }
            - call: "POST /public-art/artworks"
              payload: { accession_number: "2024.030", title: "Total Loss Figure", artist_id: "${artist_id}", site_id: "${site_id}", material_class: "BRONZE", significance_tier: "LANDMARK", footprint_units: 6, insured_value_cents: 40000000, acquisition_date: "2014-06-01", acquisition_document_ref: "DEED-2014-030" }
              as: CollectionsRegistrar
