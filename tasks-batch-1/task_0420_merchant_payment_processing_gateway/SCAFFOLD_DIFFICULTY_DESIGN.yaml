              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /settlement-batches/${batch_id}/fund"
              payload: {}
              as: PlatformOperator
            - call: "POST /merchants/${m_id}/payouts"
              payload: { amount_cents: 5000, scheduled_for: "2026-01-05" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { payout_id: $.data.id }
          trigger:
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformOperator
              captures: { avail_after_request: $.data.available_balance_cents }
            - call: "POST /payouts/${payout_id}/return"
              payload: {}
              as: PlatformOperator
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformOperator
              captures: { avail_after_return: $.data.available_balance_cents }
          assert:
            - "available_balance_cents after request == 4680 (9680 - 5000)"
            - "available_balance_cents after return == 9680 (restored exactly; conserved)"

      - name: reserve_hold_then_release_conserves_total_balance_across_accounts
        grounds:
          - state_machines.SettlementBatch.OPEN_to_SETTLED
          - state_machines.ReserveEntry.HELD_to_RELEASED
          - calculations.merchant_balance_recompute
        distinguishing_aspect: "Conserved quantity = (available_balance_cents + reserved_balance_cents) total across the two accounts. Reserve hold moves +R into RESERVE; reserve release posts -R from RESERVE and +R to AVAILABLE, so the across-account total is unchanged by the release — a different conserved quantity (cross-account total) than the single-account available balance above."
        test_recipe:
          setup:
