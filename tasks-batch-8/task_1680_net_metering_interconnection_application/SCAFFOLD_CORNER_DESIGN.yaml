            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-OC1", service_class: COMMERCIAL, prior_annual_usage_wh: 100000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 20000, estimated_annual_production_wh: 30000000 }, as: Applicant, as_user_id: "${cust}", captures: { app: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc2: $.data.id } }
            - { call: "POST /documents/${doc1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app}" }, as: DistributionEngineer }
            - { call: "POST /supplemental-reviews", payload: { application_id: "${app}", review_type: FACILITIES_STUDY }, as: DistributionEngineer, captures: { rev: $.data.id } }
            - { call: "POST /supplemental-reviews/${rev}/complete", payload: { outcome: UPGRADES_REQUIRED }, as: DistributionEngineer }
            - { call: "GET /applications/${app}", as: ProgramAdministrator, captures: { app_v: $.data.version } }
          trigger:
            - { call: "POST /cost-estimates", payload: { application_id: "${app}", supplemental_review_id: "${rev}", expected_application_version: "${app_v}", items: [{ description: "first", amount_cents: 50000 }], contingency_pct: 10 }, as: DistributionEngineer, captures: { est1: $.data.id } }
            - { call: "POST /cost-estimates", payload: { application_id: "${app}", supplemental_review_id: "${rev}", expected_application_version: "${app_v}", items: [{ description: "stale", amount_cents: 60000 }], contingency_pct: 10 }, as: DistributionEngineer, captures: { err: $.data.error_id } }
            - { call: "GET /applications/${app}", as: ProgramAdministrator, captures: { app_v2: $.data.version } }
            - { call: "POST /cost-estimates", payload: { application_id: "${app}", supplemental_review_id: "${rev}", expected_application_version: "${app_v2}", items: [{ description: "fresh", amount_cents: 70000 }], contingency_pct: 10 }, as: DistributionEngineer, captures: { est3: $.data.id } }
          assert:
            - "err == ERR_STALE_APPLICATION_VERSION with HTTP 412"
            - "UpgradeCostEstimate.${est1}.estimate_status == SUPERSEDED after the fresh create"
            - "UpgradeCostEstimate.${est3}.estimate_status == ISSUED and total_cents == 77000"
            - "GET /cost-estimates?application_id=${app} returns exactly 2 estimates (the 412 created nothing)"

