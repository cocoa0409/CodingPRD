          - endpoints[POST /neighborhood-safety/video-requests/{id}/withdraw]
        distinguishing_aspect: "Two counters on the same row move differently under the same events: open_request_count is a live gauge that rises on submit and falls on withdrawal, while requests_submitted_count is a lifetime meter that only ever rises — so after two submits and one withdrawal the pair reads (1, 2), not (1, 1) or (2, 2)."
