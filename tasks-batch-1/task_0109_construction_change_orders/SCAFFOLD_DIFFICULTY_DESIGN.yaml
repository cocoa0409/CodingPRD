            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "001", description: "Foundation", scheduled_value_cents: 600000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov1: $.data.id }
            - call: "POST /sov-lines"
              payload: { project_id: "${proj}", item_no: "002", description: "Framing", scheduled_value_cents: 400000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sov2: $.data.id }
            - call: "POST /subcontractor-commitments"
              payload: { project_id: "${proj}", subcontractor_name: "Acme Steel", committed_amount_cents: 100000 }
              as: Contractor
              as_user_id: "gc-1"
              captures: { sc: $.data.id }
            - call: "POST /pay-applications"
              payload: { project_id: "${proj}", application_number: 1, period_from: "2026-01-01T00:00:00.000Z", period_to: "2026-01-31T00:00:00.000Z", expected_project_version: "${pv1}" }
              as: Contractor
              as_user_id: "gc-1"
              captures: { app1: $.data.id }
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov1}", work_completed_this_period_cents: 300000, materials_stored_cents: 0 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-app-lines"
              payload: { pay_app_id: "${app1}", sov_line_id: "${sov2}", work_completed_this_period_cents: 100000, materials_stored_cents: 50000 }
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/submit"
              payload: {}
              as: Contractor
              as_user_id: "gc-1"
            - call: "POST /pay-applications/${app1}/certify"
              payload: {}
              as: Architect
              as_user_id: "arch-1"
