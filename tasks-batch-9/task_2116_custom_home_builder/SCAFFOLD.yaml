scenario: "desgin task harder than expert level.!!!! 2116. Custom Home Builder Project Management (custom home builder): allowance budget & selections schedule, cost-plus vs fixed price contract accounting, change order pricing & client approval workflow, subcontractor scheduling & lead-time-driven sequencing, draw request from construction lender & lien waiver collection, jobsite photo documentation & client portal updates, punch list & final walkthrough, warranty period & callback service"

domain_name: "custom-home-builder"
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert_plus
  notes: |
    Ledger reconciliation is the spine: the SAME cost and change-order data yields
    two different owner-billable figures depending on Project.contract_type
    (FIXED_PRICE vs COST_PLUS), and the same allowance line yields a provisional
    variance at selection time and a final variance at reconciliation time.
    Multi-party negotiation layers on top: a change order shuttles between
    Estimator (pricing), ProjectManager (submission) and Client (approve /
    request-revision / reject) in a revision cycle, and a draw request shuttles
    between Controller, Lender and Subcontractors (lien waivers) on two
    independent state axes. Segregation of duties forbids the same StaffMember
    from both pricing and submitting a change order, and from both approving a
    cost entry and submitting the draw that contains it.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Homeowner's legal name as it appears on the construction contract."
      - name: email
        type: string
        source: input
        description: "Contact address used for client-portal notifications."
      - name: portal_enabled
        type: boolean
        source: input
        default: true
        description: "When false the client portal hides published photo documents from this client."

  - name: Lender
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Construction lender institution name."
      - name: retainage_pct
        type: number
        source: input
        description: "Fraction of each approved cost line the lender withholds as retainage on every draw."
        constraints: "0 <= retainage_pct <= 0.20; exactly 4 decimal places accepted"
      - name: max_cumulative_draw_pct
        type: number
        source: input
        description: "Ceiling on cumulative funded + pending draw dollars, expressed as a fraction of Project.contract_sum_current."
        constraints: "0 < max_cumulative_draw_pct <= 1"
      - name: review_window_days
        type: integer
        source: input
        description: "Whole days the lender has to decide a submitted draw before the decision window closes."
        constraints: ">= 1"

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Builder-side employee name."
      - name: staff_function
        type: enum
        source: input
        description: "Which builder role this employee may act as."
        constraints: "one of PROJECT_MANAGER, ESTIMATOR, CONTROLLER"

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Trade contractor company name."
      - name: trade
        type: enum
        source: input
        description: "Trade discipline; PLUMBING, ELECTRICAL and HVAC receive the extended systems warranty term."
        constraints: "one of SITEWORK, CONCRETE, FRAMING, PLUMBING, ELECTRICAL, HVAC, DRYWALL, FINISH_CARPENTRY, PAINT, LANDSCAPE"
      - name: lead_time_days
        type: integer
        source: input
        description: "Whole days this trade needs between mobilization notice and first day on site."
        constraints: ">= 0"
      - name: crew_capacity
        type: integer
        source: input
        description: "How many ScheduleTask intervals this subcontractor can occupy at once; drives the crew overlap rule."
        constraints: ">= 1"
      - name: waiver_required
        type: boolean
        source: input
        default: true
        description: "When true, every draw that includes this subcontractor's cost entries auto-generates a LienWaiver row."

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: client_id
        type: string
        source: input
        description: "FK -> Client.id; the homeowner who signs the construction contract."
      - name: lender_id
        type: string
        source: input
        default: null
        description: "FK -> Lender.id; null when the build is owner-financed and no draw requests are possible."
      - name: address
        type: string
        source: input
        description: "Jobsite street address."
      - name: contract_type
        type: enum
        source: input
        description: "Accounting basis for owner billing; selects the contract-position calculation variant."
        constraints: "one of FIXED_PRICE, COST_PLUS"
      - name: base_contract_amount
        type: number
        source: input
        description: "Signed contract value before any change orders or allowance variance."
        constraints: "> 0, 2 decimal places"
      - name: builder_fee_pct
        type: number
        source: input
        default: null
        description: "Builder's fee as a fraction of actual cost; required when contract_type == COST_PLUS, ignored for FIXED_PRICE."
        constraints: "0 <= builder_fee_pct <= 0.50 when present"
      - name: gmp_cap
        type: number
        source: input
        default: null
        description: "Guaranteed maximum price ceiling; null means no ceiling. Compared strictly (>) against contract_sum_current."
        constraints: ">= base_contract_amount when present"
      - name: target_substantial_completion_date
        type: datetime
        source: input
        description: "Contractual substantial-completion target, ISO 8601 UTC with three fractional digits."
      - name: status
        type: enum
        source: system
        default: PLANNING
        description: "Lifecycle state."
        constraints: "one of PLANNING, UNDER_CONSTRUCTION, SUBSTANTIAL_COMPLETION, FINAL_ACCEPTED"
      - name: budget_posture
        type: enum
        source: computed
        default: WITHIN_BUDGET
        description: "Derived budget posture recomputed by calculations.project_budget_posture after every ledger mutation; OVER_GMP freezes OPEN allowance items."
        constraints: "one of WITHIN_BUDGET, ALLOWANCE_OVERRUN, OVER_GMP"
      - name: approved_change_order_total
        type: number
        source: computed
        default: 0
        description: "Sum of ChangeOrder.priced_amount for this project's change orders whose status == APPROVED."
      - name: allowance_variance_total
        type: number
        source: computed
        default: 0
        description: "Sum of allowance variance across this project's allowance items; RECONCILED items contribute final_variance_amount, SELECTED and LOCKED items contribute provisional_variance_amount, all other statuses contribute 0."
      - name: contract_sum_current
        type: number
        source: computed
        description: "base_contract_amount + approved_change_order_total + allowance_variance_total."
      - name: cost_to_date
        type: number
        source: computed
        default: 0
        description: "Sum of CostEntry.amount for this project whose status is in {APPROVED, INCLUDED_IN_DRAW, PAID}."
      - name: eligible_cost_pool
        type: number
        source: computed
        default: 0
        description: "Sum of CostEntry.amount for this project whose status is in {APPROVED, INCLUDED_IN_DRAW}; the draw-conservation quantity."
      - name: pending_draw_amount
        type: number
        source: computed
        default: 0
        description: "Sum of DrawRequest.requested_amount for this project whose status is in {LENDER_REVIEW, CONDITIONALLY_APPROVED}."
      - name: funded_to_date
        type: number
        source: computed
        default: 0
        description: "Sum of DrawRequest.net_funding_amount for this project whose status == FUNDED."
      - name: retainage_held
        type: number
        source: computed
        default: 0
        description: "Sum of DrawRequest.retainage_amount for this project whose status == FUNDED."
      - name: construction_started_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the project entered UNDER_CONSTRUCTION."
      - name: substantial_completion_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which substantial completion was declared."
      - name: final_accepted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the client signed off the final walkthrough."
      - name: warranty_starts_at
        type: datetime
        source: computed
        default: null
        description: "Equals substantial_completion_at; anchors the whole-house warranty variant."
      - name: warranty_expires_at
        type: datetime
        source: computed
        default: null
        description: "warranty_starts_at + WARRANTY_BASE_DAYS; end of the whole-house warranty window."

  - name: AllowanceItem
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the build this allowance line belongs to."
      - name: category
        type: enum
        source: input
        description: "Allowance budget category."
        constraints: "one of FLOORING, CABINETRY, APPLIANCES, PLUMBING_FIXTURES, LIGHTING, COUNTERTOPS, LANDSCAPE"
      - name: allowance_amount
        type: number
        source: input
        description: "Dollars carried in the contract for this category."
        constraints: "> 0, 2 decimal places"
      - name: selection_deadline
        type: datetime
        source: input
        description: "Last logical-clock instant at which a Selection may be proposed against this item (inclusive)."
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Selection lifecycle state."
        constraints: "one of OPEN, FROZEN, SELECTED, LOCKED, RECONCILED"
      - name: selected_selection_id
        type: string
        source: computed
        default: null
        description: "FK -> Selection.id; the Selection accepted for this item, null until acceptance."
      - name: provisional_variance_amount
        type: number
        source: computed
        default: 0
        description: "accepted Selection.selection_total - allowance_amount; the estimate-side variance."
      - name: final_variance_amount
        type: number
        source: computed
        default: null
        description: "reconciled_amount - allowance_amount; the actual-cost-side variance, null until RECONCILED."
      - name: reconciled_amount
        type: number
        source: computed
        default: null
        description: "Sum of ALLOWANCE_ACTUAL CostEntry.amount charged against this item in status {APPROVED, INCLUDED_IN_DRAW, PAID}."
      - name: material_lead_time_days
        type: integer
        source: computed
        default: null
        description: "Copied from the accepted Selection.lead_time_days at LOCK time."
      - name: locked_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the Controller locked the buy-out price."
      - name: frozen_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which an OVER_GMP posture froze this item; cleared when the posture leaves OVER_GMP."
      - name: reconciled_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of reconciliation."

  - name: Selection
    parent: AllowanceItem
    common_fields: true
    fields:
      - name: allowance_item_id
        type: string
        source: input
        description: "FK -> AllowanceItem.id; the allowance line this selection prices."
      - name: vendor_name
        type: string
        source: input
        description: "Supplier the client picked."
      - name: vendor_quote_amount
        type: number
        source: input
        description: "Quoted material price."
        constraints: ">= 0, 2 decimal places"
      - name: freight_amount
        type: number
        source: input
        default: 0
        description: "Freight and delivery cost."
        constraints: ">= 0"
      - name: install_amount
        type: number
        source: input
        default: 0
        description: "Installation labor cost."
        constraints: ">= 0"
      - name: lead_time_days
        type: integer
        source: input
        description: "Whole days from buy-out to material on site."
        constraints: ">= 0"
      - name: selection_total
        type: number
        source: computed
        description: "vendor_quote_amount + freight_amount + install_amount."
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: "Client proposal lifecycle."
        constraints: "one of PROPOSED, ACCEPTED, REJECTED, SUPERSEDED"
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the ProjectManager decision."
      - name: superseded_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which a newer proposal superseded this one."

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the build being changed."
      - name: source_allowance_item_id
        type: string
        source: input
        default: null
        description: "FK -> AllowanceItem.id; set only when origin == ALLOWANCE_OVERAGE, identifying the overrun line."
      - name: priced_by_staff_id
        type: string
        source: system
        default: null
        description: "FK -> StaffMember.id; stamped from X-User-ID on the pricing transition, read back by the segregation-of-duties check."
      - name: submitted_by_staff_id
        type: string
        source: system
        default: null
        description: "FK -> StaffMember.id; stamped from X-User-ID on the submit transition."
      - name: origin
        type: enum
        source: input
        description: "Why the change order exists."
        constraints: "one of CLIENT_REQUEST, FIELD_CONDITION, ALLOWANCE_OVERAGE"
      - name: scope_description
        type: string
        source: input
        description: "Narrative of the added or deleted scope."
      - name: direct_cost
        type: number
        source: input
        description: "Hard cost of the changed scope before markup, general conditions and contingency."
        constraints: ">= 0, 2 decimal places"
      - name: schedule_impact_days
        type: integer
        source: input
        default: 0
        description: "Whole calendar days the change pushes the schedule; priced at GENERAL_CONDITIONS_DAY_RATE."
        constraints: ">= 0"
      - name: markup_rate_applied
        type: number
        source: computed
        default: null
        description: "Markup tier selected from direct_cost by calculations.change_order_priced_amount."
      - name: contingency_rate_applied
        type: number
        source: computed
        default: null
        description: "Contingency tier selected from the pre-contingency subtotal, never from priced_amount."
      - name: priced_amount
        type: number
        source: computed
        default: null
        description: "Owner-facing change order price produced by calculations.change_order_priced_amount."
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Pricing and client-approval lifecycle; supports a revision cycle."
        constraints: "one of DRAFT, PRICED, SUBMITTED, REVISION_REQUESTED, APPROVED, REJECTED, VOIDED"
      - name: revision_count
        type: integer
        source: system
        default: 0
        description: "How many times the client sent the change order back and it was repriced."
      - name: revision_note
        type: string
        source: input
        default: null
        description: "Client's note attached to a REQUEST_REVISION decision."
      - name: void_reason
        type: string
        source: input
        default: null
        description: "Client's reason for descoping an already-approved change order."
      - name: priced_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent pricing."
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent submission to the client."
      - name: client_response_due_at
        type: datetime
        source: computed
        default: null
        description: "submitted_at + CLIENT_RESPONSE_DAYS."
      - name: decided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the client's terminal decision (approve / reject) or of the void."

  - name: ScheduleTask
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the build this activity belongs to."
      - name: subcontractor_id
        type: string
        source: input
        description: "FK -> Subcontractor.id; the trade crew that occupies the interval."
      - name: predecessor_task_id
        type: string
        source: input
        default: null
        description: "FK -> ScheduleTask.id; null for schedule roots, otherwise the task that must be COMPLETE first."
      - name: driving_allowance_item_id
        type: string
        source: input
        default: null
        description: "FK -> AllowanceItem.id; null when the task consumes no allowance material, otherwise the item whose lock date drives material readiness."
      - name: task_name
        type: string
        source: input
        description: "Activity label."
      - name: planned_start
        type: datetime
        source: input
        description: "Planned interval start, inclusive."
      - name: planned_finish
        type: datetime
        source: input
        description: "Planned interval finish; exclusive for crew-capacity overlap, inclusive for jobsite exclusive-use overlap."
        constraints: "planned_finish > planned_start"
      - name: lag_days
        type: integer
        source: input
        default: 0
        description: "Whole days of required lag after the predecessor's actual finish."
        constraints: ">= 0"
      - name: exclusive_use
        type: boolean
        source: input
        default: false
        description: "When true this activity occupies the whole jobsite and obeys the closed-plus-buffer overlap rule."
      - name: status
        type: enum
        source: system
        default: PLANNED
        description: "Field progress state."
        constraints: "one of PLANNED, RELEASED, IN_PROGRESS, COMPLETE"
      - name: material_ready_at
        type: datetime
        source: computed
        default: null
        description: "AllowanceItem.locked_at + (accepted Selection.lead_time_days + FABRICATION_BUFFER_DAYS) days; null when driving_allowance_item_id is null."
      - name: actual_start
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the crew started."
      - name: actual_finish
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the crew finished."
      - name: delay_days
        type: integer
        source: computed
        default: 0
        description: "max(0, whole days between planned_finish and actual_finish); drives the successor shift."
      - name: float_days
        type: integer
        source: computed
        default: null
        description: "Whole days between this task's planned_start and (predecessor.actual_finish + lag_days); null while the predecessor is not COMPLETE."
      - name: released_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant the ProjectManager released the task to the field."

  - name: CostEntry
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the build the cost lands on."
      - name: subcontractor_id
        type: string
        source: input
        default: null
        description: "FK -> Subcontractor.id; null for owner-direct material purchases with no lien exposure."
      - name: source_allowance_item_id
        type: string
        source: input
        default: null
        description: "FK -> AllowanceItem.id; required when entry_type == ALLOWANCE_ACTUAL, null otherwise."
      - name: draw_request_id
        type: string
        source: system
        default: null
        description: "FK -> DrawRequest.id; set when the entry is pulled into a draw, cleared when the draw is returned or voided."
      - name: approved_by_staff_id
        type: string
        source: system
        default: null
        description: "FK -> StaffMember.id; stamped from X-User-ID at approval and read back by the draw segregation-of-duties check."
      - name: entry_type
        type: enum
        source: input
        description: "Kind of cost."
        constraints: "one of SUBCONTRACT_INVOICE, MATERIAL, LABOR, ALLOWANCE_ACTUAL, CHANGE_ORDER_WORK"
      - name: cost_code
        type: string
        source: input
        description: "Job cost code the amount is charged to."
      - name: amount
        type: number
        source: input
        description: "Dollars incurred."
        constraints: "> 0, 2 decimal places"
      - name: incurred_at
        type: datetime
        source: input
        description: "When the cost was incurred; decides draw-period eligibility and the per-line retainage ordering."
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Approval and draw disposition."
        constraints: "one of PENDING, APPROVED, REJECTED, INCLUDED_IN_DRAW, PAID"
      - name: approved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of Controller approval."
      - name: paid_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the funding draw closed."

  - name: DrawRequest
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the build being drawn against."
      - name: submitted_by_staff_id
        type: string
        source: system
        default: null
        description: "FK -> StaffMember.id; stamped from X-User-ID on submit and compared against every included entry's approved_by_staff_id."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive lower bound of the billing period."
      - name: period_end
        type: datetime
        source: input
        description: "Inclusive upper bound of the billing period."
        constraints: "period_end > period_start"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Funding axis of the draw; evolves independently of waiver_compliance."
        constraints: "one of DRAFT, LENDER_REVIEW, CONDITIONALLY_APPROVED, RETURNED, FUNDED, VOIDED"
      - name: waiver_compliance
        type: enum
        source: computed
        default: PENDING
        description: "Lien-waiver axis of the draw; evolves independently of status and gates the auto-funding transition."
        constraints: "one of PENDING, PARTIAL, COMPLETE"
      - name: requested_amount
        type: number
        source: computed
        default: 0
        description: "Sum of included CostEntry.amount, produced by calculations.draw_funding_amounts."
      - name: retainage_amount
        type: number
        source: computed
        default: 0
        description: "Sum of per-line rounded retainage, produced by calculations.draw_funding_amounts."
      - name: net_funding_amount
        type: number
        source: computed
        default: 0
        description: "requested_amount - retainage_amount."
      - name: included_cost_entry_count
        type: integer
        source: computed
        default: 0
        description: "How many CostEntry rows the draw pulled in at submit time."
      - name: required_waiver_count
        type: integer
        source: computed
        default: 0
        description: "Number of LienWaiver rows auto-created at submit time (one per distinct subcontractor with waiver_required == true)."
      - name: verified_waiver_count
        type: integer
        source: computed
        default: 0
        description: "Number of this draw's LienWaiver rows in status VERIFIED."
      - name: lender_decision_due_at
        type: datetime
        source: computed
        default: null
        description: "submitted_at + Lender.review_window_days; a lender decision strictly after this instant is refused."
      - name: condition_note
        type: string
        source: input
        default: null
        description: "Lender's note attached to a conditional approval or a return."
      - name: void_reason
        type: string
        source: input
        default: null
        description: "Controller's reason for withdrawing the draw."
      - name: submitted_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of submission to the lender."
      - name: conditionally_approved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the lender's conditional approval."
      - name: returned_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the lender's return."
      - name: funded_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the draw auto-funded."
      - name: voided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the draw was withdrawn or superseded."

  - name: LienWaiver
    parent: DrawRequest
    common_fields: true
    fields:
      - name: draw_request_id
        type: string
        source: system
        description: "FK -> DrawRequest.id; the draw whose funding this waiver conditions."
      - name: subcontractor_id
        type: string
        source: system
        description: "FK -> Subcontractor.id; the trade signing the waiver."
      - name: required_waiver_type
        type: enum
        source: computed
        description: "Waiver form the draw demands: CONDITIONAL_PROGRESS while the project is UNDER_CONSTRUCTION, UNCONDITIONAL_FINAL once it is SUBSTANTIAL_COMPLETION."
        constraints: "one of CONDITIONAL_PROGRESS, UNCONDITIONAL_PROGRESS, CONDITIONAL_FINAL, UNCONDITIONAL_FINAL"
      - name: required_amount
        type: number
        source: computed
        description: "Sum of this subcontractor's CostEntry.amount included in the draw."
      - name: waiver_type
        type: enum
        source: input
        default: null
        description: "Waiver form the subcontractor actually signed; must equal required_waiver_type to verify."
        constraints: "one of CONDITIONAL_PROGRESS, UNCONDITIONAL_PROGRESS, CONDITIONAL_FINAL, UNCONDITIONAL_FINAL"
      - name: through_date
        type: datetime
        source: input
        default: null
        description: "Date through which the signed waiver releases lien rights."
      - name: amount_covered
        type: number
        source: input
        default: null
        description: "Dollars the signed waiver releases; must be >= required_amount to verify."
      - name: signed_document_ref
        type: string
        source: input
        default: null
        description: "Opaque reference to the scanned signed waiver."
      - name: status
        type: enum
        source: system
        default: REQUESTED
        description: "Collection lifecycle; REJECTED can cycle back to RECEIVED on resubmission."
        constraints: "one of REQUESTED, RECEIVED, VERIFIED, REJECTED, VOIDED"
      - name: resubmit_count
        type: integer
        source: system
        default: 0
        description: "How many times the subcontractor re-signed after a rejection."
      - name: received_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent signed submission."
      - name: verified_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of Controller verification."
      - name: rejected_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent rejection."
      - name: voided_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the parent draw's return or void killed this waiver."

  - name: DefectTicket
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the build the defect was found on."
      - name: responsible_subcontractor_id
        type: string
        source: input
        default: null
        description: "FK -> Subcontractor.id; assigned at triage, null while the ticket is OPEN."
      - name: source_schedule_task_id
        type: string
        source: input
        default: null
        description: "FK -> ScheduleTask.id; when present the warranty window is anchored on that task's actual_finish instead of the whole-house anchor."
      - name: phase
        type: enum
        source: input
        description: "PUNCH tickets are pre-acceptance walkthrough defects; WARRANTY tickets are post-acceptance callbacks."
        constraints: "one of PUNCH, WARRANTY"
      - name: room
        type: string
        source: input
        description: "Where in the house the defect is."
      - name: description
        type: string
        source: input
        description: "Narrative of the defect."
      - name: severity
        type: enum
        source: input
        description: "Drives both the final-walkthrough blocking rule and the callback response clock."
        constraints: "one of COSMETIC, FUNCTIONAL, LIFE_SAFETY"
      - name: category
        type: enum
        source: input
        description: "Cause classification; HOMEOWNER_DAMAGE and NORMAL_WEAR are warranty exclusions."
        constraints: "one of WORKMANSHIP, MATERIAL_DEFECT, SYSTEMS, HOMEOWNER_DAMAGE, NORMAL_WEAR"
      - name: reported_at
        type: datetime
        source: system
        description: "Logical-clock instant at creation; compared against coverage_end_at."
      - name: coverage_anchor
        type: enum
        source: computed
        default: NONE
        description: "Which warranty variant was applied; NONE for PUNCH tickets."
        constraints: "one of NONE, WHOLE_HOUSE, TRADE"
      - name: coverage_end_at
        type: datetime
        source: computed
        default: null
        description: "Inclusive last instant of warranty coverage under the selected anchor; null for PUNCH tickets."
      - name: coverage_result
        type: enum
        source: computed
        default: NOT_APPLICABLE
        description: "Coverage verdict produced by calculations.warranty_coverage_determination; NOT_APPLICABLE for PUNCH tickets."
        constraints: "one of NOT_APPLICABLE, COVERED, OUT_OF_COVERAGE, EXCLUDED"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "Remediation lifecycle; REJECTED cycles back to ASSIGNED."
        constraints: "one of OPEN, ASSIGNED, READY_FOR_REVIEW, VERIFIED, REJECTED, DENIED, WAIVED"
      - name: rework_count
        type: integer
        source: system
        default: 0
        description: "How many times the client rejected the remediation and the ticket was re-assigned."
      - name: response_due_at
        type: datetime
        source: computed
        default: null
        description: "assigned_at + DEFECT_RESPONSE_DAYS[severity]; set at triage."
      - name: completion_note
        type: string
        source: input
        default: null
        description: "Subcontractor's note when handing the ticket back for review."
      - name: assigned_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of the most recent assignment."
      - name: resolved_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant at which the ticket reached VERIFIED, DENIED or WAIVED."

  - name: PhotoDocument
    parent: Project
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the build documented."
      - name: captured_at
        type: datetime
        source: input
        description: "When the photo was taken."
      - name: caption
        type: string
        source: input
        description: "Field note attached to the photo."
      - name: visibility
        type: enum
        source: system
        default: INTERNAL
        description: "INTERNAL until published; CLIENT_PORTAL after publication makes it visible on the client portal."
        constraints: "one of INTERNAL, CLIENT_PORTAL"
      - name: published_at
        type: datetime
        source: system
        default: null
        description: "Logical-clock instant of publication to the client portal."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Project
    initial_state: PLANNING
    terminal_states: [FINAL_ACCEPTED]
    transitions:
      - from: PLANNING
        to: UNDER_CONSTRUCTION
        trigger: "POST /projects/{id}/advance with action == START_CONSTRUCTION"
        actor: ProjectManager
        preconditions:
          - "project.status == PLANNING"
          - "at least one AllowanceItem exists with allowance_item.project_id == project.id"
          - "at least one ScheduleTask exists with schedule_task.project_id == project.id and status == PLANNED"
        side_effects:
          - "sets Project.construction_started_at to the logical clock now"
          - "recomputes Project.contract_sum_current via calculations.project_contract_position"
          - "recomputes Project.budget_posture via calculations.project_budget_posture"
          - "increments Project.version by 1"

      - from: UNDER_CONSTRUCTION
        to: SUBSTANTIAL_COMPLETION
        trigger: "POST /projects/{id}/advance with action == DECLARE_SUBSTANTIAL_COMPLETION"
        actor: ProjectManager
        preconditions:
          - "project.status == UNDER_CONSTRUCTION"
          - "every ScheduleTask with schedule_task.project_id == project.id has status == COMPLETE"
          - "no ChangeOrder with change_order.project_id == project.id has status in {DRAFT, PRICED, SUBMITTED, REVISION_REQUESTED}"
        side_effects:
          - "sets Project.substantial_completion_at to the logical clock now"
          - "sets Project.warranty_starts_at = Project.substantial_completion_at"
          - "sets Project.warranty_expires_at = Project.warranty_starts_at + WARRANTY_BASE_DAYS days"
          - "every subsequently submitted DrawRequest demands UNCONDITIONAL_FINAL lien waivers instead of CONDITIONAL_PROGRESS"
          - "increments Project.version by 1"

      - from: SUBSTANTIAL_COMPLETION
        to: FINAL_ACCEPTED
        trigger: "POST /projects/{id}/final-walkthrough"
        actor: Client
        preconditions:
          - "project.status == SUBSTANTIAL_COMPLETION"
          - "X-User-ID == project.client_id"
          - "zero DefectTicket with defect_ticket.project_id == project.id and phase == PUNCH and severity in {FUNCTIONAL, LIFE_SAFETY} and status in {OPEN, ASSIGNED, READY_FOR_REVIEW, REJECTED}"
          - "request field acknowledged_open_cosmetic_count equals the count of DefectTicket with defect_ticket.project_id == project.id and phase == PUNCH and severity == COSMETIC and status in {OPEN, ASSIGNED, READY_FOR_REVIEW, REJECTED}"
          - "no DrawRequest with draw_request.project_id == project.id has status in {LENDER_REVIEW, CONDITIONALLY_APPROVED}"
        side_effects:
          - "sets Project.final_accepted_at to the logical clock now"
          - "every DefectTicket with defect_ticket.project_id == project.id and phase == PUNCH and severity == COSMETIC and status == OPEN transitions to WAIVED with resolved_at stamped (conditional cascade; ASSIGNED / READY_FOR_REVIEW / REJECTED cosmetic tickets are left untouched)"
          - "increments Project.version by 1"
        note: "FINAL_ACCEPTED is terminal for the Project row; warranty callbacks continue as DefectTicket rows with phase == WARRANTY."

  - entity: AllowanceItem
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: SELECTED
        trigger: "system side effect of POST /selections/{id}/decision with decision == APPROVE"
        actor: system
        preconditions:
          - "allowance_item.status == OPEN"
          - "the decided Selection has selection.allowance_item_id == allowance_item.id and status == PROPOSED"
        side_effects:
          - "sets AllowanceItem.selected_selection_id to the accepted Selection.id"
          - "sets AllowanceItem.provisional_variance_amount via calculations.allowance_variance (provisional variant)"
          - "recomputes Project.allowance_variance_total, Project.contract_sum_current and Project.budget_posture"
          - "increments AllowanceItem.version by 1"

      - from: OPEN
        to: FROZEN
        trigger: "system cascade when Project.budget_posture becomes OVER_GMP"
        actor: system
        preconditions:
          - "allowance_item.status == OPEN"
          - "project.budget_posture transitioned to OVER_GMP during the current request"
        side_effects:
          - "sets AllowanceItem.frozen_at to the logical clock now"
          - "blocks POST /selections against this item until the posture leaves OVER_GMP"
          - "increments AllowanceItem.version by 1"

      - from: FROZEN
        to: OPEN
        trigger: "system cascade when Project.budget_posture leaves OVER_GMP"
        actor: system
        preconditions:
          - "allowance_item.status == FROZEN"
          - "project.budget_posture transitioned away from OVER_GMP during the current request"
        side_effects:
          - "clears AllowanceItem.frozen_at to null"
          - "increments AllowanceItem.version by 1"

      - from: SELECTED
        to: LOCKED
        trigger: "POST /allowance-items/{id}/settle with action == LOCK"
        actor: Controller
        preconditions:
          - "allowance_item.status == SELECTED"
          - "project.status == UNDER_CONSTRUCTION"
        side_effects:
          - "sets AllowanceItem.locked_at to the logical clock now and material_lead_time_days to the accepted Selection.lead_time_days"
          - "sets ScheduleTask.material_ready_at via calculations.schedule_material_readiness for every ScheduleTask whose driving_allowance_item_id == allowance_item.id"
          - "when provisional_variance_amount > 0, creates a ChangeOrder in status DRAFT with origin == ALLOWANCE_OVERAGE, source_allowance_item_id == allowance_item.id, direct_cost == provisional_variance_amount and schedule_impact_days == 0"
          - "increments AllowanceItem.version by 1"

      - from: LOCKED
        to: RECONCILED
        trigger: "POST /allowance-items/{id}/settle with action == RECONCILE"
        actor: Controller
        preconditions:
          - "allowance_item.status == LOCKED"
          - "at least one CostEntry exists with cost_entry.source_allowance_item_id == allowance_item.id, entry_type == ALLOWANCE_ACTUAL and status in {APPROVED, INCLUDED_IN_DRAW, PAID}"
        side_effects:
          - "sets AllowanceItem.reconciled_amount and final_variance_amount via calculations.allowance_variance (final variant)"
          - "sets AllowanceItem.reconciled_at to the logical clock now"
          - "recomputes Project.allowance_variance_total using final_variance_amount in place of provisional_variance_amount, then Project.contract_sum_current, then Project.budget_posture"
          - "increments AllowanceItem.version by 1"

  - entity: Selection
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /selections/{id}/decision with decision == APPROVE"
        actor: ProjectManager
        preconditions:
          - "selection.status == PROPOSED"
          - "the parent AllowanceItem (selection.allowance_item_id) has status == OPEN"
          - "project.budget_posture != OVER_GMP"
        side_effects:
          - "sets Selection.decided_at to the logical clock now"
          - "cascades AllowanceItem OPEN -> SELECTED"

      - from: PROPOSED
        to: REJECTED
        trigger: "POST /selections/{id}/decision with decision == REJECT"
        actor: ProjectManager
        preconditions:
          - "selection.status == PROPOSED"
        side_effects:
          - "sets Selection.decided_at to the logical clock now"
          - "leaves the parent AllowanceItem in OPEN so the client may propose again"

      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system side effect of POST /selections creating a newer proposal for the same allowance_item_id"
        actor: system
        preconditions:
          - "selection.status == PROPOSED"
          - "a newer Selection is being created with the same allowance_item_id"
        side_effects:
          - "sets Selection.superseded_at to the logical clock now"

  - entity: ChangeOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: DRAFT
        to: PRICED
        trigger: "POST /change-orders/{id}/price"
        actor: Estimator
        preconditions:
          - "change_order.status == DRAFT"
          - "project.status == UNDER_CONSTRUCTION"
        side_effects:
          - "sets direct_cost and schedule_impact_days from the request when supplied"
          - "sets markup_rate_applied, contingency_rate_applied and priced_amount via calculations.change_order_priced_amount"
          - "sets priced_by_staff_id to the acting X-User-ID and priced_at to the logical clock now"

      - from: REVISION_REQUESTED
        to: PRICED
        trigger: "POST /change-orders/{id}/price"
        actor: Estimator
        preconditions:
          - "change_order.status == REVISION_REQUESTED"
          - "project.status == UNDER_CONSTRUCTION"
        side_effects:
          - "increments ChangeOrder.revision_count by 1"
          - "recomputes markup_rate_applied, contingency_rate_applied and priced_amount via calculations.change_order_priced_amount using the new direct_cost / schedule_impact_days"
          - "sets priced_by_staff_id to the acting X-User-ID and priced_at to the logical clock now"
        note: "This edge closes the negotiation cycle PRICED -> SUBMITTED -> REVISION_REQUESTED -> PRICED."

      - from: PRICED
        to: SUBMITTED
        trigger: "POST /change-orders/{id}/submit"
        actor: ProjectManager
        preconditions:
          - "change_order.status == PRICED"
          - "the acting X-User-ID != change_order.priced_by_staff_id (segregation of duties)"
          - "change_order.revision_count <= MAX_REVISION_ROUNDS"
        side_effects:
          - "sets submitted_by_staff_id to the acting X-User-ID and submitted_at to the logical clock now"
          - "sets client_response_due_at = submitted_at + CLIENT_RESPONSE_DAYS days"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /change-orders/{id}/client-decision with decision == APPROVE"
        actor: Client
        preconditions:
          - "change_order.status == SUBMITTED"
          - "X-User-ID == project.client_id"
          - "project.status == UNDER_CONSTRUCTION"
        side_effects:
          - "sets decided_at to the logical clock now"
          - "link 1 -> link 2: Project.approved_change_order_total is recomputed to include this change order's priced_amount, which forces Project.contract_sum_current to be recomputed"
          - "link 2 -> link 3: because Project.contract_sum_current changed, Project.budget_posture is recomputed by calculations.project_budget_posture and may become OVER_GMP"
          - "link 3 -> link 4: because Project.budget_posture became OVER_GMP, every AllowanceItem of this project in status OPEN cascades OPEN -> FROZEN"
          - "when schedule_impact_days > 0, every ScheduleTask of this project in status {PLANNED, RELEASED} has planned_start and planned_finish shifted later by schedule_impact_days days, processed in (planned_start ASC, created_at ASC) order"
          - "increments Project.version by 1"

      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /change-orders/{id}/client-decision with decision == REQUEST_REVISION"
        actor: Client
        preconditions:
          - "change_order.status == SUBMITTED"
          - "X-User-ID == project.client_id"
          - "change_order.revision_count < MAX_REVISION_ROUNDS"
        side_effects:
          - "stores revision_note from the request"
          - "leaves priced_amount at its last value until the estimator reprices"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /change-orders/{id}/client-decision with decision == REJECT"
        actor: Client
        preconditions:
          - "change_order.status == SUBMITTED"
          - "X-User-ID == project.client_id"
        side_effects:
          - "sets decided_at to the logical clock now"
          - "leaves Project.approved_change_order_total and Project.contract_sum_current unchanged"

      - from: APPROVED
        to: VOIDED
        trigger: "POST /change-orders/{id}/void"
        actor: Client
        preconditions:
          - "change_order.status == APPROVED"
          - "X-User-ID == project.client_id"
          - "project.status == UNDER_CONSTRUCTION"
        side_effects:
          - "sets void_reason and decided_at"
          - "compensating link 1 -> link 2: Project.approved_change_order_total is recomputed without this change order's priced_amount, forcing Project.contract_sum_current to be recomputed"
          - "compensating link 2 -> link 3: Project.budget_posture is recomputed and may leave OVER_GMP"
          - "compensating link 3 -> link 4: every AllowanceItem of this project in status FROZEN cascades FROZEN -> OPEN when the posture left OVER_GMP"
          - "when schedule_impact_days > 0, every ScheduleTask of this project still in status {PLANNED, RELEASED} has planned_start and planned_finish shifted earlier by schedule_impact_days days"
          - "increments Project.version by 1"
        note: "Forward/compensating pair for the contract-sum conservation invariant."

  - entity: ScheduleTask
    initial_state: PLANNED
    terminal_states: [COMPLETE]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /schedule-tasks/{id}/release"
        actor: ProjectManager
        preconditions:
          - "schedule_task.status == PLANNED"
          - "project.status == UNDER_CONSTRUCTION"
          - "schedule_task.driving_allowance_item_id is null OR the referenced AllowanceItem has status in {LOCKED, RECONCILED}"
          - "schedule_task.material_ready_at is null OR material_ready_at <= schedule_task.planned_start"
          - "schedule_task.predecessor_task_id is null OR the referenced ScheduleTask has status == COMPLETE"
        side_effects:
          - "sets released_at to the logical clock now"
          - "sets float_days via calculations.schedule_delay_propagation when a predecessor exists"

      - from: RELEASED
        to: IN_PROGRESS
        trigger: "POST /schedule-tasks/{id}/progress with action == START"
        actor: Subcontractor
        preconditions:
          - "schedule_task.status == RELEASED"
          - "X-User-ID == schedule_task.subcontractor_id"
          - "schedule_task.material_ready_at is null OR the logical clock now >= material_ready_at"
        side_effects:
          - "sets actual_start to the logical clock now"

      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /schedule-tasks/{id}/progress with action == COMPLETE"
        actor: Subcontractor
        preconditions:
          - "schedule_task.status == IN_PROGRESS"
          - "X-User-ID == schedule_task.subcontractor_id"
        side_effects:
          - "sets actual_finish to the logical clock now and delay_days via calculations.schedule_delay_propagation"
          - "when delay_days > 0, every successor ScheduleTask (predecessor_task_id == this task's id) in status {PLANNED, RELEASED} has planned_start and planned_finish shifted later by delay_days days, processed in (planned_start ASC, created_at ASC) order"
          - "each shifted successor's float_days is recomputed from the new planned_start"

  - entity: CostEntry
    initial_state: PENDING
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /cost-entries/{id}/review with decision == APPROVE"
        actor: Controller
        preconditions:
          - "cost_entry.status == PENDING"
          - "project.status in {UNDER_CONSTRUCTION, SUBSTANTIAL_COMPLETION}"
        side_effects:
          - "sets approved_by_staff_id to the acting X-User-ID and approved_at to the logical clock now"
          - "recomputes Project.cost_to_date and Project.eligible_cost_pool"
          - "recomputes Project.budget_posture"

      - from: PENDING
        to: REJECTED
        trigger: "POST /cost-entries/{id}/review with decision == REJECT"
        actor: Controller
        preconditions:
          - "cost_entry.status == PENDING"
        side_effects:
          - "leaves Project.cost_to_date and Project.eligible_cost_pool unchanged"

      - from: APPROVED
        to: INCLUDED_IN_DRAW
        trigger: "system side effect of POST /draw-requests/{id}/submit"
        actor: system
        preconditions:
          - "cost_entry.status == APPROVED"
          - "cost_entry.incurred_at is within [draw.period_start, draw.period_end] inclusive on both ends"
        side_effects:
          - "sets draw_request_id to the submitted draw's id"
          - "leaves Project.eligible_cost_pool unchanged (both APPROVED and INCLUDED_IN_DRAW count toward it)"

      - from: INCLUDED_IN_DRAW
        to: APPROVED
        trigger: "system side effect of POST /draw-requests/{id}/lender-decision with decision == RETURN, or of POST /draw-requests/{id}/void"
        actor: system
        preconditions:
          - "cost_entry.status == INCLUDED_IN_DRAW"
        side_effects:
          - "clears draw_request_id to null"
          - "leaves Project.eligible_cost_pool and Project.cost_to_date unchanged"

      - from: INCLUDED_IN_DRAW
        to: PAID
        trigger: "system side effect of the DrawRequest CONDITIONALLY_APPROVED -> FUNDED auto-transition"
        actor: system
        preconditions:
          - "cost_entry.status == INCLUDED_IN_DRAW"
          - "the parent draw reached status FUNDED"
        side_effects:
          - "sets paid_at to the logical clock now"
          - "removes the amount from Project.eligible_cost_pool while leaving Project.cost_to_date unchanged"

  - entity: DrawRequest
    initial_state: DRAFT
    terminal_states: [FUNDED, VOIDED]
    transitions:
      - from: DRAFT
        to: LENDER_REVIEW
        trigger: "POST /draw-requests/{id}/submit"
        actor: Controller
        preconditions:
          - "draw_request.status == DRAFT"
          - "project.status in {UNDER_CONSTRUCTION, SUBSTANTIAL_COMPLETION}"
          - "project.lender_id is not null"
          - "the acting X-User-ID does not equal approved_by_staff_id of any eligible CostEntry (segregation of duties)"
          - "at least one CostEntry with cost_entry.project_id == project.id, status == APPROVED and incurred_at within [period_start, period_end] inclusive"
          - "project.funded_to_date + project.pending_draw_amount + requested_amount <= round_half_up(lender.max_cumulative_draw_pct * project.contract_sum_current, 2)"
        side_effects:
          - "computes requested_amount, retainage_amount, net_funding_amount via calculations.draw_funding_amounts and sets included_cost_entry_count"
          - "every eligible CostEntry transitions APPROVED -> INCLUDED_IN_DRAW"
          - "creates one LienWaiver in status REQUESTED for each distinct subcontractor_id among the included entries whose Subcontractor.waiver_required == true, with required_waiver_type == CONDITIONAL_PROGRESS when project.status == UNDER_CONSTRUCTION and UNCONDITIONAL_FINAL when project.status == SUBSTANTIAL_COMPLETION, and required_amount == that subcontractor's included total; sets required_waiver_count"
          - "sets waiver_compliance to COMPLETE when required_waiver_count == 0, otherwise PENDING"
          - "sets submitted_by_staff_id, submitted_at and lender_decision_due_at = submitted_at + lender.review_window_days days"
          - "recomputes Project.pending_draw_amount"

      - from: LENDER_REVIEW
        to: CONDITIONALLY_APPROVED
        trigger: "POST /draw-requests/{id}/lender-decision with decision == CONDITIONALLY_APPROVE"
        actor: Lender
        preconditions:
          - "draw_request.status == LENDER_REVIEW"
          - "X-User-ID == project.lender_id"
          - "the logical clock now <= draw_request.lender_decision_due_at"
        side_effects:
          - "sets conditionally_approved_at and condition_note"
          - "when waiver_compliance == COMPLETE, immediately auto-transitions CONDITIONALLY_APPROVED -> FUNDED"

      - from: LENDER_REVIEW
        to: RETURNED
        trigger: "POST /draw-requests/{id}/lender-decision with decision == RETURN"
        actor: Lender
        preconditions:
          - "draw_request.status == LENDER_REVIEW"
          - "X-User-ID == project.lender_id"
          - "the logical clock now <= draw_request.lender_decision_due_at"
        side_effects:
          - "sets returned_at and condition_note"
          - "every CostEntry with draw_request_id == this draw and status == INCLUDED_IN_DRAW transitions back to APPROVED"
          - "every LienWaiver of this draw in status {REQUESTED, RECEIVED, REJECTED} transitions to VOIDED"
          - "recomputes Project.pending_draw_amount"

      - from: CONDITIONALLY_APPROVED
        to: FUNDED
        trigger: "system auto-transition when DrawRequest.waiver_compliance becomes COMPLETE"
        actor: system
        preconditions:
          - "draw_request.status == CONDITIONALLY_APPROVED"
          - "draw_request.waiver_compliance == COMPLETE"
        side_effects:
          - "sets funded_at to the logical clock now"
          - "recomputes Project.funded_to_date and Project.retainage_held"
          - "every CostEntry with draw_request_id == this draw and status == INCLUDED_IN_DRAW transitions to PAID"
          - "recomputes Project.pending_draw_amount and Project.eligible_cost_pool"

      - from: DRAFT
        to: VOIDED
        trigger: "POST /draw-requests/{id}/void, or system supersede when a newer DrawRequest is created for the same project"
        actor: Controller
        preconditions:
          - "draw_request.status == DRAFT"
        side_effects:
          - "sets voided_at and void_reason (void_reason is 'SUPERSEDED_BY_NEWER_DRAFT' on the system supersede path)"
          - "no CostEntry disposition changes because a DRAFT draw holds none"

      - from: LENDER_REVIEW
        to: VOIDED
        trigger: "POST /draw-requests/{id}/void"
        actor: Controller
        preconditions:
          - "draw_request.status == LENDER_REVIEW"
        side_effects:
          - "sets voided_at and void_reason"
          - "every CostEntry with draw_request_id == this draw and status == INCLUDED_IN_DRAW transitions back to APPROVED"
          - "every LienWaiver of this draw in status {REQUESTED, RECEIVED, REJECTED} transitions to VOIDED"
          - "recomputes Project.pending_draw_amount back to its pre-submit value"
        note: "Compensating action for the draw-ledger conservation invariant."

      - from: RETURNED
        to: VOIDED
        trigger: "POST /draw-requests/{id}/void"
        actor: Controller
        preconditions:
          - "draw_request.status == RETURNED"
        side_effects:
          - "sets voided_at and void_reason"

  - entity: DrawRequest
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: PARTIAL
        trigger: "system recomputation after POST /lien-waivers/{id}/review with decision == VERIFY"
        actor: system
        preconditions:
          - "draw_request.waiver_compliance == PENDING"
          - "0 < verified_waiver_count < required_waiver_count"
        side_effects:
          - "sets DrawRequest.verified_waiver_count"
          - "does NOT touch DrawRequest.status"
        note: "Second, independent state dimension on DrawRequest: waiver_compliance evolves without regard to the funding axis."

      - from: PARTIAL
        to: COMPLETE
        trigger: "system recomputation after POST /lien-waivers/{id}/review with decision == VERIFY"
        actor: system
        preconditions:
          - "draw_request.waiver_compliance == PARTIAL"
          - "verified_waiver_count == required_waiver_count"
        side_effects:
          - "sets DrawRequest.verified_waiver_count"
          - "when DrawRequest.status == CONDITIONALLY_APPROVED, triggers the CONDITIONALLY_APPROVED -> FUNDED auto-transition on the funding axis"

      - from: PENDING
        to: COMPLETE
        trigger: "system recomputation after POST /lien-waivers/{id}/review with decision == VERIFY, or at submit when required_waiver_count == 0"
        actor: system
        preconditions:
          - "draw_request.waiver_compliance == PENDING"
          - "verified_waiver_count == required_waiver_count"
        side_effects:
          - "sets DrawRequest.verified_waiver_count"
          - "when DrawRequest.status == CONDITIONALLY_APPROVED, triggers the CONDITIONALLY_APPROVED -> FUNDED auto-transition on the funding axis"

  - entity: LienWaiver
    initial_state: REQUESTED
    terminal_states: [VERIFIED, VOIDED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /lien-waivers/{id}/receive"
        actor: Subcontractor
        preconditions:
          - "lien_waiver.status == REQUESTED"
          - "X-User-ID == lien_waiver.subcontractor_id"
          - "the parent DrawRequest has status in {LENDER_REVIEW, CONDITIONALLY_APPROVED}"
        side_effects:
          - "stores waiver_type, through_date, amount_covered and signed_document_ref from the request"
          - "sets received_at to the logical clock now"

      - from: REJECTED
        to: RECEIVED
        trigger: "POST /lien-waivers/{id}/receive"
        actor: Subcontractor
        preconditions:
          - "lien_waiver.status == REJECTED"
          - "X-User-ID == lien_waiver.subcontractor_id"
          - "the parent DrawRequest has status in {LENDER_REVIEW, CONDITIONALLY_APPROVED}"
        side_effects:
          - "increments resubmit_count by 1"
          - "overwrites waiver_type, through_date, amount_covered and signed_document_ref and stamps received_at"
        note: "Rejection/resubmission cycle REQUESTED -> RECEIVED -> REJECTED -> RECEIVED."

      - from: RECEIVED
        to: VERIFIED
        trigger: "POST /lien-waivers/{id}/review with decision == VERIFY"
        actor: Controller
        preconditions:
          - "lien_waiver.status == RECEIVED"
          - "lien_waiver.waiver_type == lien_waiver.required_waiver_type"
          - "lien_waiver.amount_covered >= lien_waiver.required_amount"
        side_effects:
          - "sets verified_at to the logical clock now"
          - "link 1 -> link 2: because this waiver became VERIFIED, the parent DrawRequest recomputes verified_waiver_count and advances waiver_compliance toward PARTIAL or COMPLETE"
          - "link 2 -> link 3: because waiver_compliance became COMPLETE while status == CONDITIONALLY_APPROVED, the parent DrawRequest auto-transitions to FUNDED and Project.funded_to_date / retainage_held / pending_draw_amount are recomputed"
          - "link 3 -> link 4: because the draw reached FUNDED, every CostEntry with draw_request_id == that draw and status == INCLUDED_IN_DRAW transitions to PAID and leaves Project.eligible_cost_pool"

      - from: RECEIVED
        to: REJECTED
        trigger: "POST /lien-waivers/{id}/review with decision == REJECT"
        actor: Controller
        preconditions:
          - "lien_waiver.status == RECEIVED"
        side_effects:
          - "sets rejected_at to the logical clock now"
          - "leaves the parent DrawRequest.waiver_compliance unchanged"

      - from: REQUESTED
        to: VOIDED
        trigger: "system cascade when the parent DrawRequest reaches RETURNED or VOIDED"
        actor: system
        preconditions:
          - "lien_waiver.status in {REQUESTED, RECEIVED, REJECTED}"
        side_effects:
          - "sets voided_at to the logical clock now"

  - entity: DefectTicket
    initial_state: OPEN
    terminal_states: [VERIFIED, DENIED, WAIVED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /defect-tickets/{id}/triage with decision == ASSIGN"
        actor: ProjectManager
        preconditions:
          - "defect_ticket.status == OPEN"
          - "request supplies responsible_subcontractor_id"
          - "defect_ticket.phase == PUNCH OR defect_ticket.coverage_result == COVERED"
        side_effects:
          - "sets responsible_subcontractor_id and assigned_at"
          - "sets response_due_at = assigned_at + DEFECT_RESPONSE_DAYS[severity] days"

      - from: REJECTED
        to: ASSIGNED
        trigger: "POST /defect-tickets/{id}/triage with decision == ASSIGN"
        actor: ProjectManager
        preconditions:
          - "defect_ticket.status == REJECTED"
        side_effects:
          - "increments rework_count by 1"
          - "resets response_due_at = the logical clock now + DEFECT_RESPONSE_DAYS[severity] days"
        note: "Rework cycle ASSIGNED -> READY_FOR_REVIEW -> REJECTED -> ASSIGNED."

      - from: OPEN
        to: DENIED
        trigger: "POST /defect-tickets/{id}/triage with decision == DENY"
        actor: ProjectManager
        preconditions:
          - "defect_ticket.status == OPEN"
          - "defect_ticket.phase == WARRANTY"
          - "defect_ticket.coverage_result in {OUT_OF_COVERAGE, EXCLUDED}"
        side_effects:
          - "sets resolved_at to the logical clock now"
          - "no subcontractor is assigned and no response clock starts"
        note: "Divergent branch from OPEN: DENY leaves responsible_subcontractor_id and response_due_at null, whereas ASSIGN sets both."

      - from: ASSIGNED
        to: READY_FOR_REVIEW
        trigger: "POST /defect-tickets/{id}/submit-for-review"
        actor: Subcontractor
        preconditions:
          - "defect_ticket.status == ASSIGNED"
          - "X-User-ID == defect_ticket.responsible_subcontractor_id"
        side_effects:
          - "stores completion_note"

      - from: READY_FOR_REVIEW
        to: VERIFIED
        trigger: "POST /defect-tickets/{id}/client-review with decision == VERIFY"
        actor: Client
        preconditions:
          - "defect_ticket.status == READY_FOR_REVIEW"
          - "X-User-ID == project.client_id"
        side_effects:
          - "sets resolved_at to the logical clock now"

      - from: READY_FOR_REVIEW
        to: REJECTED
        trigger: "POST /defect-tickets/{id}/client-review with decision == REJECT"
        actor: Client
        preconditions:
          - "defect_ticket.status == READY_FOR_REVIEW"
          - "X-User-ID == project.client_id"
        side_effects:
          - "leaves resolved_at null and keeps the ticket blocking for FUNCTIONAL and LIFE_SAFETY severities"

      - from: OPEN
        to: WAIVED
        trigger: "POST /defect-tickets/{id}/client-review with decision == WAIVE, or system cascade of POST /projects/{id}/final-walkthrough"
        actor: Client
        preconditions:
          - "defect_ticket.status == OPEN"
          - "defect_ticket.phase == PUNCH"
          - "defect_ticket.severity == COSMETIC"
        side_effects:
          - "sets resolved_at to the logical clock now"
        note: "Third divergent branch from OPEN, reachable only for cosmetic punch items."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version)
# =============================================================================
concurrency_rules:
  - rule_id: selection-create-stale-allowance
    parent_entity: AllowanceItem
    write_endpoint: "POST /selections"
    occ_field: "expected_allowance_item_version"
    description: |
      Creating a Selection against an AllowanceItem whose version has advanced
      since the client last read it is rejected. This captures the case where a
      newer proposal has already been written against the same allowance line
      and legitimately superseded the prior PROPOSED selection, so the current
      writer's view of the allowance line is stale.
    error_id: ERR_STALE_ALLOWANCE_VERSION
    http_status: 412

  - rule_id: draw-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /draw-requests"
    occ_field: "expected_project_version"
    description: |
      Creating a DrawRequest against a Project whose version has advanced since
      the controller last read it is rejected. Creating a draw legitimately
      supersedes any existing DRAFT draw on the same project, so a controller
      working from a stale project view would silently discard a draft another
      writer had just built.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: change_order_priced_amount
    trigger: "ChangeOrder DRAFT -> PRICED and REVISION_REQUESTED -> PRICED (POST /change-orders/{id}/price)"
    algorithm: tiered_pricing
    formula: |
      base = change_order.direct_cost

      # step 1 - markup tier keyed on the raw direct cost
      markup_rate = 0.20  if base < MARKUP_TIER_1_CEILING            # base < 5000
                  = 0.15  if MARKUP_TIER_1_CEILING <= base < MARKUP_TIER_2_CEILING
                  = 0.10  if base >= MARKUP_TIER_2_CEILING
      markup = round_half_up(base * markup_rate, 2)

      # step 2 - general conditions for the schedule impact
      gc_fee = round_half_up(change_order.schedule_impact_days * GENERAL_CONDITIONS_DAY_RATE, 2)

      # step 3 - pre-contingency subtotal
      subtotal = base + markup + gc_fee

      # step 4 - CIRCULAR-LOOKING DEPENDENCY, EVALUATION ORDER PINNED HERE:
      #   the contingency tier is selected from `subtotal` (the PRE-contingency
      #   figure) and NEVER from `priced_amount`. Solving the fixed point
      #   priced_amount = subtotal + rate(priced_amount) * subtotal is WRONG.
      contingency_rate = 0.00  if subtotal <= CONTINGENCY_TIER_1_CEILING          # <= 10000
                       = 0.03  if CONTINGENCY_TIER_1_CEILING < subtotal <= CONTINGENCY_TIER_2_CEILING
                       = 0.05  if subtotal > CONTINGENCY_TIER_2_CEILING           # > 50000
      contingency = round_half_up(subtotal * contingency_rate, 2)

      # step 5
      priced_amount = round_half_up(subtotal + contingency, 2)
      markup_rate_applied = markup_rate
      contingency_rate_applied = contingency_rate
    input_set: "Only the change order's own direct_cost and schedule_impact_days; no sibling change orders and no project ledger fields participate."
    constants:
      MARKUP_TIER_1_CEILING: 5000.00
      MARKUP_TIER_2_CEILING: 25000.00
      CONTINGENCY_TIER_1_CEILING: 10000.00
      CONTINGENCY_TIER_2_CEILING: 50000.00
      GENERAL_CONDITIONS_DAY_RATE: 485.00
    precision: "2 decimal places, round_half_up, applied at each of markup, gc_fee, contingency and the final sum"
    variants: []
    note: "direct_cost = 40000.00 with schedule_impact_days = 10 yields markup 4000.00, gc_fee 4850.00, subtotal 48850.00, contingency_rate 0.03, contingency 1465.50, priced_amount 50315.50 - even though 50315.50 sits above CONTINGENCY_TIER_2_CEILING."

  - name: draw_funding_amounts
    trigger: "DrawRequest DRAFT -> LENDER_REVIEW (POST /draw-requests/{id}/submit)"
    algorithm: aggregation
    formula: |
      included = CostEntry rows where cost_entry.project_id == draw.project_id
                 AND cost_entry.status == APPROVED
                 AND draw.period_start <= cost_entry.incurred_at <= draw.period_end
                 ordered by (incurred_at ASC, created_at ASC)

      requested_amount = round_half_up(sum(e.amount for e in included), 2)

      # ROUNDING ORDER PINNED: retainage is rounded PER LINE ITEM first and the
      # already-rounded per-line values are then summed. "Sum the amounts then
      # apply the rate once" is explicitly NOT the rule and yields different cents.
      retainage_amount = sum( round_half_up(e.amount * lender.retainage_pct, 2) for e in included )

      net_funding_amount = round_half_up(requested_amount - retainage_amount, 2)
      included_cost_entry_count = count(included)
    input_set: "Only CostEntry rows in status APPROVED whose incurred_at falls inside the closed period [period_start, period_end]; PENDING, REJECTED, INCLUDED_IN_DRAW and PAID entries are excluded."
    constants: {}
    precision: "2 decimal places, round_half_up; the per-line rounding happens before summation"
    variants: []
    note: "With lender.retainage_pct = 0.05 and amounts 10000.10, 15000.10, 20000.10 the pinned order gives retainage_amount 2250.03, while sum-then-round would give 2250.02."

  - name: project_contract_position
    trigger: "GET /projects/{id}/contract-position, and after every mutation that changes approved_change_order_total, allowance_variance_total or cost_to_date"
    algorithm: forward_looking
    formula: |
      approved_change_order_total = sum(co.priced_amount
          for co in ChangeOrder where co.project_id == project.id and co.status == APPROVED)

      allowance_variance_total = sum over AllowanceItem ai where ai.project_id == project.id of:
            ai.final_variance_amount        if ai.status == RECONCILED
            ai.provisional_variance_amount  if ai.status in {SELECTED, LOCKED}
            0                               otherwise (OPEN, FROZEN)

      contract_sum_current = round_half_up(
          project.base_contract_amount + approved_change_order_total + allowance_variance_total, 2)

      cost_to_date = round_half_up(sum(ce.amount for ce in CostEntry
          where ce.project_id == project.id and ce.status in {APPROVED, INCLUDED_IN_DRAW, PAID}), 2)

      gmp_headroom = round_half_up(project.gmp_cap - contract_sum_current, 2) if project.gmp_cap is not null else null
    input_set: "APPROVED change orders only (DRAFT / PRICED / SUBMITTED / REVISION_REQUESTED / REJECTED / VOIDED excluded); allowance items contribute per the status map above; cost entries in {APPROVED, INCLUDED_IN_DRAW, PAID} only."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: fixed_price_position
        when: "project.contract_type == FIXED_PRICE"
        difference: |
          owner_billable_amount = contract_sum_current
          builder_margin_amount = round_half_up(contract_sum_current - cost_to_date, 2)
          variant_applied = "FIXED_PRICE"
          The owner owes the contract sum regardless of what the build actually cost;
          gmp_cap does not clamp the billable figure, it only feeds budget_posture.
      - name: cost_plus_position
        when: "project.contract_type == COST_PLUS"
        difference: |
          raw = round_half_up(cost_to_date * (1 + project.builder_fee_pct), 2)
          owner_billable_amount = min(raw, project.gmp_cap) if project.gmp_cap is not null else raw
          builder_margin_amount = round_half_up(owner_billable_amount - cost_to_date, 2)
          variant_applied = "COST_PLUS"
          The owner owes actual cost plus the builder fee, clamped by the GMP ceiling;
          contract_sum_current is still reported but is NOT the billable figure.
    note: "Identical ledger data (base 900000.00, no change orders, no allowance variance, cost_to_date 45000.30) yields owner_billable_amount 900000.00 under FIXED_PRICE and 53100.35 under COST_PLUS with builder_fee_pct 0.18."

  - name: warranty_coverage_determination
    trigger: "POST /defect-tickets when phase == WARRANTY (computes coverage_anchor, coverage_end_at and coverage_result)"
    algorithm: threshold
    formula: |
      if defect_ticket.phase == PUNCH:
          coverage_anchor = NONE ; coverage_end_at = null ; coverage_result = NOT_APPLICABLE
          stop

      # EXCLUSION CHECK RUNS FIRST - pinned order
      if defect_ticket.category in EXCLUDED_CATEGORIES:
          coverage_anchor = NONE ; coverage_end_at = null ; coverage_result = EXCLUDED
          stop

      # anchor selection
      if defect_ticket.source_schedule_task_id is null:
          coverage_anchor = WHOLE_HOUSE
          coverage_end_at = project.warranty_starts_at + WARRANTY_BASE_DAYS days
      else:
          coverage_anchor = TRADE
          task = ScheduleTask[defect_ticket.source_schedule_task_id]
          trade_days = SYSTEMS_TRADE_DAYS if Subcontractor[task.subcontractor_id].trade in SYSTEMS_TRADES
                       else WARRANTY_BASE_DAYS
          coverage_end_at = task.actual_finish + trade_days days

      # INCLUSIVE upper boundary - reported_at exactly equal to coverage_end_at is COVERED
      coverage_result = COVERED if defect_ticket.reported_at <= coverage_end_at else OUT_OF_COVERAGE
    input_set: "The ticket's own category and source_schedule_task_id, the project's warranty_starts_at, and (for the trade anchor) the source task's actual_finish plus its subcontractor's trade."
    constants:
      WARRANTY_BASE_DAYS: 365
      SYSTEMS_TRADE_DAYS: 730
      SYSTEMS_TRADES: "PLUMBING, ELECTRICAL, HVAC"
      EXCLUDED_CATEGORIES: "HOMEOWNER_DAMAGE, NORMAL_WEAR"
    precision: "whole days; timestamps compared at millisecond resolution"
    variants:
      - name: whole_house_anchor
        when: "source_schedule_task_id is null"
        difference: "Window runs from project.warranty_starts_at for WARRANTY_BASE_DAYS days regardless of which trade caused the defect."
      - name: trade_anchor
        when: "source_schedule_task_id is not null"
        difference: "Window runs from the source task's actual_finish for SYSTEMS_TRADE_DAYS days when the trade is PLUMBING / ELECTRICAL / HVAC, otherwise WARRANTY_BASE_DAYS days. A defect the whole-house anchor calls OUT_OF_COVERAGE the trade anchor can call COVERED."

  - name: allowance_variance
    trigger: "AllowanceItem OPEN -> SELECTED (provisional variant) and LOCKED -> RECONCILED (final variant)"
    algorithm: aggregation
    formula: |
      # provisional variant
      selection = Selection[allowance_item.selected_selection_id]
      selection_total = round_half_up(
          selection.vendor_quote_amount + selection.freight_amount + selection.install_amount, 2)
      provisional_variance_amount = round_half_up(selection_total - allowance_item.allowance_amount, 2)

      # final variant
      reconciled_amount = round_half_up(sum(ce.amount for ce in CostEntry
          where ce.source_allowance_item_id == allowance_item.id
            and ce.entry_type == ALLOWANCE_ACTUAL
            and ce.status in {APPROVED, INCLUDED_IN_DRAW, PAID}), 2)
      final_variance_amount = round_half_up(reconciled_amount - allowance_item.allowance_amount, 2)
    input_set: "Provisional: only the accepted Selection. Final: only ALLOWANCE_ACTUAL cost entries pointing at this item in status {APPROVED, INCLUDED_IN_DRAW, PAID}; PENDING and REJECTED entries are excluded."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_variance
        when: "allowance_item.status in {SELECTED, LOCKED}"
        difference: "Variance is quoted from the accepted Selection and feeds Project.allowance_variance_total as an estimate."
      - name: final_variance
        when: "allowance_item.status == RECONCILED"
        difference: "Variance is recomputed from posted ALLOWANCE_ACTUAL cost entries and replaces the provisional figure in Project.allowance_variance_total."

  - name: project_budget_posture
    trigger: "after every mutation that changes Project.contract_sum_current, Project.allowance_variance_total or Project.cost_to_date"
    algorithm: threshold
    formula: |
      # STRICT greater-than at the GMP boundary: contract_sum_current exactly equal
      # to gmp_cap is NOT over the cap.
      if project.gmp_cap is not null and project.contract_sum_current > project.gmp_cap:
          budget_posture = OVER_GMP
      elif project.allowance_variance_total > round_half_up(project.base_contract_amount * ALLOWANCE_OVERRUN_PCT, 2):
          budget_posture = ALLOWANCE_OVERRUN
      else:
          budget_posture = WITHIN_BUDGET
    input_set: "Project.contract_sum_current, Project.gmp_cap, Project.allowance_variance_total and Project.base_contract_amount only."
    constants:
      ALLOWANCE_OVERRUN_PCT: 0.02
    precision: "2 decimal places, round_half_up on the overrun threshold"
    variants: []

  - name: schedule_material_readiness
    trigger: "AllowanceItem SELECTED -> LOCKED, for every ScheduleTask whose driving_allowance_item_id is that item"
    algorithm: interval_merge
    formula: |
      material_ready_at = allowance_item.locked_at
                        + (accepted_selection.lead_time_days + FABRICATION_BUFFER_DAYS) days
    input_set: "The locking allowance item and its accepted Selection; the subcontractor's own lead_time_days does NOT enter this formula."
    constants:
      FABRICATION_BUFFER_DAYS: 3
    precision: "whole days added to a millisecond-resolution timestamp"
    variants: []

  - name: schedule_delay_propagation
    trigger: "ScheduleTask IN_PROGRESS -> COMPLETE, and ScheduleTask PLANNED -> RELEASED (float only)"
    algorithm: constraint_propagation
    formula: |
      delay_days = max(0, whole_days(task.actual_finish - task.planned_finish))

      successors = ScheduleTask where predecessor_task_id == task.id
                   and status in {PLANNED, RELEASED}
                   ordered by (planned_start ASC, created_at ASC)
      for s in successors:
          s.planned_start  = s.planned_start  + delay_days days
          s.planned_finish = s.planned_finish + delay_days days
          s.float_days     = whole_days(s.planned_start - (task.actual_finish + s.lag_days days))
    input_set: "Only direct successors (one hop) in status PLANNED or RELEASED; IN_PROGRESS and COMPLETE successors are never shifted."
    constants: {}
    precision: "whole days, truncated toward zero"
    variants: []

  - name: draw_cumulative_cap
    trigger: "DrawRequest DRAFT -> LENDER_REVIEW (POST /draw-requests/{id}/submit)"
    algorithm: threshold
    formula: |
      cap = round_half_up(lender.max_cumulative_draw_pct * project.contract_sum_current, 2)
      cumulative_after = round_half_up(
          project.funded_to_date + project.pending_draw_amount + draw.requested_amount, 2)
      # STRICT greater-than: cumulative_after exactly equal to cap is allowed
      reject with ERR_DRAW_EXCEEDS_LENDER_CAP when cumulative_after > cap
    input_set: "Project.funded_to_date (FUNDED draws), Project.pending_draw_amount (LENDER_REVIEW and CONDITIONALLY_APPROVED draws) and this draw's freshly computed requested_amount."
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: defect_response_due
    trigger: "DefectTicket OPEN -> ASSIGNED and REJECTED -> ASSIGNED"
    algorithm: threshold
    formula: |
      response_due_at = assigned_at + DEFECT_RESPONSE_DAYS[defect_ticket.severity] days
    input_set: "The ticket's own severity and the logical clock at assignment."
    constants:
      DEFECT_RESPONSE_DAYS_LIFE_SAFETY: 1
      DEFECT_RESPONSE_DAYS_FUNCTIONAL: 7
      DEFECT_RESPONSE_DAYS_COSMETIC: 30
    precision: "whole days"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID request headers are present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "X-User-Role names one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 30
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 40
    category: existence
    check: "every resource named by a path segment exists, validated left to right"
    error_id: "ERR_PROJECT_NOT_FOUND | ERR_ALLOWANCE_ITEM_NOT_FOUND | ERR_SELECTION_NOT_FOUND | ERR_CHANGE_ORDER_NOT_FOUND | ERR_SCHEDULE_TASK_NOT_FOUND | ERR_COST_ENTRY_NOT_FOUND | ERR_DRAW_REQUEST_NOT_FOUND | ERR_LIEN_WAIVER_NOT_FOUND | ERR_DEFECT_TICKET_NOT_FOUND | ERR_PHOTO_NOT_FOUND"
    http_status: 404
    applies_to: "every path-parameterised endpoint"

  - priority: 50
    category: business_constraint
    check: "request body shape: every required field present, every enum value a declared member, every money field >= 0 with at most 2 decimals, planned_finish > planned_start, period_end > period_start, limit within [1,100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 60
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_CLIENT_NOT_FOUND | ERR_LENDER_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_SUBCONTRACTOR_NOT_FOUND | ERR_PROJECT_NOT_FOUND | ERR_ALLOWANCE_ITEM_NOT_FOUND | ERR_SCHEDULE_TASK_NOT_FOUND"
    http_status: 404
    applies_to: "every create endpoint and POST /defect-tickets/{id}/triage"

  - priority: 65
    category: auth
    check: "for staff-backed roles the X-User-ID resolves to a StaffMember whose staff_function matches the acting role (ProjectManager -> PROJECT_MANAGER, Estimator -> ESTIMATOR, Controller -> CONTROLLER)"
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "every endpoint whose roles include ProjectManager, Estimator or Controller"

  - priority: 70
    category: auth
    check: "the acting entity-backed principal owns the target: Client X-User-ID == project.client_id, Lender X-User-ID == project.lender_id, Subcontractor X-User-ID == schedule_task.subcontractor_id / lien_waiver.subcontractor_id / defect_ticket.responsible_subcontractor_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every endpoint acted on by Client, Lender or Subcontractor"

  - priority: 80
    category: business_constraint
    check: "contract terms coherent at project creation: contract_type == COST_PLUS requires builder_fee_pct, and gmp_cap when supplied must be >= base_contract_amount"
    error_id: ERR_CONTRACT_TERMS_INVALID
    http_status: 422
    applies_to: "POST /projects"

  - priority: 90
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_PROJECT_INVALID_STATE | ERR_ALLOWANCE_INVALID_STATE | ERR_SELECTION_NOT_PENDING | ERR_CHANGE_ORDER_INVALID_STATE | ERR_TASK_INVALID_STATE | ERR_COST_ENTRY_INVALID_STATE | ERR_DRAW_NOT_IN_DRAFT | ERR_DRAW_INVALID_STATE | ERR_WAIVER_INVALID_STATE | ERR_DEFECT_INVALID_STATE | ERR_PHOTO_ALREADY_PUBLISHED"
    http_status: 409
    applies_to: "every transition endpoint"

  - priority: 95
    category: state
    check: "the parent project is in a state that admits the operation: selections and change-order pricing require UNDER_CONSTRUCTION; photo publication requires status != PLANNING"
    error_id: "ERR_PROJECT_NOT_UNDER_CONSTRUCTION | ERR_PROJECT_NOT_ACCEPTING_PHOTOS"
    http_status: 409
    applies_to: "POST /selections, POST /change-orders/{id}/price, POST /allowance-items/{id}/settle, POST /schedule-tasks/{id}/release, POST /photo-documents/{id}/publish"

  - priority: 96
    category: state
    check: "a Selection may only be proposed against an AllowanceItem whose status == OPEN and whose project's budget_posture != OVER_GMP"
    error_id: ERR_ALLOWANCE_FROZEN
    http_status: 409
    applies_to: "POST /selections"

  - priority: 100
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version"
    error_id: "ERR_STALE_ALLOWANCE_VERSION | ERR_STALE_PROJECT_VERSION"
    http_status: 412
    applies_to: "POST /selections, POST /draw-requests"

  - priority: 104
    category: business_constraint
    check: "START_CONSTRUCTION requires at least one AllowanceItem and at least one PLANNED ScheduleTask on the project"
    error_id: ERR_PROJECT_NOT_READY_TO_START
    http_status: 409
    applies_to: "POST /projects/{id}/advance with action == START_CONSTRUCTION"

  - priority: 105
    category: business_constraint
    check: "DECLARE_SUBSTANTIAL_COMPLETION requires every ScheduleTask of the project to be COMPLETE and no ChangeOrder of the project in {DRAFT, PRICED, SUBMITTED, REVISION_REQUESTED}; the task check runs before the change-order check"
    error_id: "ERR_PROJECT_TASKS_INCOMPLETE | ERR_CHANGE_ORDER_PENDING"
    http_status: 409
    applies_to: "POST /projects/{id}/advance with action == DECLARE_SUBSTANTIAL_COMPLETION"

  - priority: 110
    category: business_safety
    check: "no PUNCH DefectTicket of severity FUNCTIONAL or LIFE_SAFETY remains in {OPEN, ASSIGNED, READY_FOR_REVIEW, REJECTED} at final walkthrough"
    error_id: ERR_BLOCKING_PUNCH_ITEMS
    http_status: 409
    applies_to: "POST /projects/{id}/final-walkthrough"

  - priority: 112
    category: business_constraint
    check: "acknowledged_open_cosmetic_count equals the count of PUNCH DefectTickets of severity COSMETIC on the project in status {OPEN, ASSIGNED, READY_FOR_REVIEW, REJECTED}"
    error_id: ERR_PUNCH_ACK_COUNT_MISMATCH
    http_status: 422
    applies_to: "POST /projects/{id}/final-walkthrough"

  - priority: 115
    category: business_safety
    check: "a WARRANTY ticket may only be assigned to a subcontractor when coverage_result == COVERED"
    error_id: ERR_DEFECT_NOT_COVERED
    http_status: 422
    applies_to: "POST /defect-tickets/{id}/triage"

  - priority: 118
    category: business_safety
    check: "a DENY triage decision is only legal for phase == WARRANTY tickets whose coverage_result is OUT_OF_COVERAGE or EXCLUDED; a WAIVE client-review decision is only legal for phase == PUNCH tickets of severity COSMETIC"
    error_id: ERR_DEFECT_PHASE_MISMATCH
    http_status: 422
    applies_to: "POST /defect-tickets/{id}/triage, POST /defect-tickets/{id}/client-review"

  - priority: 120
    category: business_constraint
    check: "segregation of duties: the change-order submitter must differ from priced_by_staff_id, and the draw submitter must differ from approved_by_staff_id of every eligible cost entry"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /change-orders/{id}/submit, POST /draw-requests/{id}/submit"

  - priority: 130
    category: business_referential
    check: "predecessor_task_id, when supplied, names a ScheduleTask belonging to the same project as the new task"
    error_id: ERR_PREDECESSOR_CROSS_PROJECT
    http_status: 422
    applies_to: "POST /schedule-tasks"

  - priority: 135
    category: business_referential
    check: "driving_allowance_item_id, when supplied, names an AllowanceItem belonging to the same project as the new task; source_allowance_item_id on a cost entry or change order likewise belongs to the same project"
    error_id: ERR_ALLOWANCE_PROJECT_MISMATCH
    http_status: 422
    applies_to: "POST /schedule-tasks, POST /cost-entries, POST /change-orders"

  - priority: 140
    category: business_referential
    check: "the signed waiver_type equals the draw's required_waiver_type for that subcontractor"
    error_id: ERR_WAIVER_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /lien-waivers/{id}/review"

  - priority: 150
    category: business_constraint
    check: "cross-entity release gate: the driving allowance item is LOCKED or RECONCILED, material_ready_at <= planned_start, and the predecessor task is COMPLETE"
    error_id: "ERR_ALLOWANCE_NOT_LOCKED | ERR_MATERIAL_NOT_READY | ERR_PREDECESSOR_INCOMPLETE"
    http_status: 409
    applies_to: "POST /schedule-tasks/{id}/release"

  - priority: 155
    category: business_constraint
    check: "an allowance item may only be RECONCILED once at least one ALLOWANCE_ACTUAL cost entry in {APPROVED, INCLUDED_IN_DRAW, PAID} points at it"
    error_id: ERR_ALLOWANCE_ACTUAL_MISSING
    http_status: 409
    applies_to: "POST /allowance-items/{id}/settle with action == RECONCILE"

  - priority: 160
    category: business_temporal
    check: "crew overlap: counting existing ScheduleTask rows for the same subcontractor_id in status {PLANNED, RELEASED, IN_PROGRESS} whose HALF-OPEN interval [planned_start, planned_finish) intersects the new task's half-open interval, the count must be < Subcontractor.crew_capacity. Touching intervals (previous finish == new start) do NOT intersect."
    error_id: ERR_CREW_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /schedule-tasks"

  - priority: 165
    category: business_temporal
    check: "jobsite exclusive-use overlap: when exclusive_use == true, the occupied interval is the CLOSED interval [planned_start, planned_finish + JOBSITE_CURE_BUFFER_DAYS days] on both ends; the new task is rejected when this closed buffered interval intersects that of any existing exclusive_use ScheduleTask on the same project in status {PLANNED, RELEASED, IN_PROGRESS}. Touching endpoints DO intersect."
    error_id: ERR_JOBSITE_EXCLUSIVE_CONFLICT
    http_status: 409
    applies_to: "POST /schedule-tasks"

  - priority: 170
    category: business_temporal
    check: "a Selection may only be proposed while the logical clock now <= allowance_item.selection_deadline (inclusive)"
    error_id: ERR_SELECTION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /selections"

  - priority: 175
    category: business_temporal
    check: "a lender decision must arrive while the logical clock now <= draw_request.lender_decision_due_at (inclusive)"
    error_id: ERR_LENDER_DECISION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /draw-requests/{id}/lender-decision"

  - priority: 180
    category: business_constraint
    check: "change-order revision rounds: REQUEST_REVISION requires revision_count < MAX_REVISION_ROUNDS and submit requires revision_count <= MAX_REVISION_ROUNDS"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /change-orders/{id}/client-decision, POST /change-orders/{id}/submit"

  - priority: 185
    category: business_constraint
    check: "a draw must pull in at least one eligible CostEntry (status APPROVED, incurred_at inside the closed period)"
    error_id: ERR_DRAW_NO_ELIGIBLE_COSTS
    http_status: 422
    applies_to: "POST /draw-requests/{id}/submit"

  - priority: 190
    category: business_constraint
    check: "the signed amount_covered is >= the waiver's required_amount"
    error_id: ERR_WAIVER_AMOUNT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /lien-waivers/{id}/review"

  - priority: 200
    category: business_fiscal
    check: "cumulative draw exposure after this submission does not exceed lender.max_cumulative_draw_pct * project.contract_sum_current (strict >)"
    error_id: ERR_DRAW_EXCEEDS_LENDER_CAP
    http_status: 422
    applies_to: "POST /draw-requests/{id}/submit"

  - priority: 210
    category: business_fiscal
    check: "a project with lender_id == null cannot open or submit draw requests"
    error_id: ERR_PROJECT_HAS_NO_LENDER
    http_status: 422
    applies_to: "POST /draw-requests, POST /draw-requests/{id}/submit"

# =============================================================================
# §1.5 API Endpoint Table (paths are absolute; api_prefix is empty)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Repositions the server's logical UTC clock. Before the first call in a process the logical clock reads exactly 2026-08-01T00:00:00.000Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["all subsequent system and computed timestamps are stamped from the new logical clock value"]

  - method: POST
    path: "/clients"
    description: "Registers a homeowner."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "email", "portal_enabled?"]
    output: Client
    side_effects: []

  - method: POST
    path: "/lenders"
    description: "Registers a construction lender with its retainage and draw-cap terms."
    roles: [PlatformAdmin]
    code: 201
    input: [name, retainage_pct, max_cumulative_draw_pct, review_window_days]
    output: Lender
    side_effects: []

  - method: POST
    path: "/staff-members"
    description: "Registers a builder-side employee and the role they may act as."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, staff_function]
    output: StaffMember
    side_effects: []

  - method: POST
    path: "/subcontractors"
    description: "Registers a trade contractor with lead time, crew capacity and waiver policy."
    roles: [PlatformAdmin]
    code: 201
    input: ["company_name", "trade", "lead_time_days", "crew_capacity", "waiver_required?"]
    output: Subcontractor
    side_effects: []

  - method: POST
    path: "/projects"
    description: "Opens a custom home build in PLANNING."
    roles: [PlatformAdmin]
    code: 201
    input: ["client_id", "lender_id?", "address", "contract_type", "base_contract_amount", "builder_fee_pct?", "gmp_cap?", "target_substantial_completion_date"]
    output: Project
    side_effects: ["initialises contract_sum_current to base_contract_amount and budget_posture to WITHIN_BUDGET"]

  - method: GET
    path: "/projects/{id}"
    description: "Reads one project including every derived ledger field."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client, Lender, Subcontractor]
    code: 200
    input: []
    output: Project
    side_effects: []

  - method: GET
    path: "/projects"
    description: "Lists projects, filterable by client, lender and status."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client, Lender, Subcontractor]
    code: 200
    input: ["client_id?", "lender_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []

  - method: GET
    path: "/projects/{id}/contract-position"
    description: "Computed read: runs calculations.project_contract_position and returns the variant-specific owner-billable position."
    roles: [PlatformAdmin, ProjectManager, Controller, Client, Lender]
    code: 200
    input: []
    output: { contract_type: string, variant_applied: string, contract_sum_current: number, approved_change_order_total: number, allowance_variance_total: number, cost_to_date: number, owner_billable_amount: number, builder_margin_amount: number, gmp_headroom: number }
    side_effects: []

  - method: POST
    path: "/projects/{id}/advance"
    description: "Advances the project lifecycle forward one step."
    roles: [ProjectManager]
    code: 200
    input: [action]
    output: Project
    side_effects: ["START_CONSTRUCTION stamps construction_started_at; DECLARE_SUBSTANTIAL_COMPLETION stamps substantial_completion_at, warranty_starts_at and warranty_expires_at", "increments Project.version by 1"]

  - method: POST
    path: "/projects/{id}/final-walkthrough"
    description: "Client signs off the final walkthrough and accepts the home."
    roles: [Client]
    code: 200
    input: [acknowledged_open_cosmetic_count]
    output: Project
    side_effects: ["auto-waives every OPEN cosmetic punch ticket", "stamps final_accepted_at", "increments Project.version by 1"]

  - method: POST
    path: "/projects/{id}/photo-documents"
    description: "Uploads a jobsite photo record; it starts INTERNAL and is invisible on the client portal."
    roles: [ProjectManager]
    code: 201
    input: [captured_at, caption]
    output: PhotoDocument
    side_effects: []

  - method: GET
    path: "/projects/{id}/photo-documents"
    description: "Lists a project's photo documents; the Client role only ever sees rows with visibility == CLIENT_PORTAL."
    roles: [PlatformAdmin, ProjectManager, Controller, Client]
    code: 200
    input: ["visibility?", "limit?", "offset?"]
    output: PhotoDocument[]
    side_effects: []

  - method: POST
    path: "/photo-documents/{id}/publish"
    description: "Publishes a photo document to the client portal."
    roles: [ProjectManager]
    code: 200
    input: []
    output: PhotoDocument
    side_effects: ["sets visibility to CLIENT_PORTAL and stamps published_at"]

  - method: POST
    path: "/allowance-items"
    description: "Adds an allowance budget line to a project."
    roles: [ProjectManager]
    code: 201
    input: [project_id, category, allowance_amount, selection_deadline]
    output: AllowanceItem
    side_effects: []

  - method: GET
    path: "/allowance-items/{id}"
    description: "Reads one allowance item including provisional and final variance."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client, Lender]
    code: 200
    input: []
    output: AllowanceItem
    side_effects: []

  - method: GET
    path: "/allowance-items"
    description: "Lists allowance items, filterable by project, status and accepted selection."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client, Lender]
    code: 200
    input: ["project_id?", "status?", "selected_selection_id?", "limit?", "offset?"]
    output: AllowanceItem[]
    side_effects: []

  - method: POST
    path: "/allowance-items/{id}/settle"
    description: "Controller locks the buy-out price (LOCK) or reconciles the line against actual cost (RECONCILE)."
    roles: [Controller]
    code: 200
    input: [action]
    output: AllowanceItem
    side_effects: ["LOCK stamps locked_at, computes material_ready_at on driven schedule tasks and auto-creates a DRAFT ALLOWANCE_OVERAGE change order when provisional_variance_amount > 0", "RECONCILE recomputes final_variance_amount and the project ledger", "increments AllowanceItem.version by 1"]

  - method: POST
    path: "/selections"
    description: "Client proposes a selection against an allowance line; a newer proposal supersedes the prior PROPOSED one on the same line."
    roles: [Client]
    code: 201
    input: ["allowance_item_id", "vendor_name", "vendor_quote_amount", "freight_amount?", "install_amount?", "lead_time_days", "expected_allowance_item_version"]
    output: Selection
    side_effects: ["any existing PROPOSED Selection on the same allowance_item_id transitions to SUPERSEDED", "increments AllowanceItem.version by 1"]

  - method: GET
    path: "/selections/{id}"
    description: "Reads one selection."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client]
    code: 200
    input: []
    output: Selection
    side_effects: []

  - method: GET
    path: "/allowance-items/{id}/selections"
    description: "Lists every selection proposed against an allowance line, newest first."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Selection[]
    side_effects: []

  - method: POST
    path: "/selections/{id}/decision"
    description: "ProjectManager accepts or rejects a client's selection proposal."
    roles: [ProjectManager]
    code: 200
    input: [decision]
    output: Selection
    side_effects: ["APPROVE cascades the parent AllowanceItem OPEN -> SELECTED, sets provisional_variance_amount and recomputes the project ledger and posture"]

  - method: POST
    path: "/change-orders"
    description: "Opens a change order in DRAFT."
    roles: [ProjectManager]
    code: 201
    input: ["project_id", "origin", "scope_description", "direct_cost", "schedule_impact_days?", "source_allowance_item_id?"]
    output: ChangeOrder
    side_effects: []

  - method: GET
    path: "/change-orders/{id}"
    description: "Reads one change order including the applied markup and contingency tiers."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: GET
    path: "/change-orders"
    description: "Lists change orders, filterable by project, source allowance line, pricing staff, submitting staff and status."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client]
    code: 200
    input: ["project_id?", "source_allowance_item_id?", "priced_by_staff_id?", "submitted_by_staff_id?", "status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []

  - method: POST
    path: "/change-orders/{id}/price"
    description: "Prices (or reprices) a change order and stamps the pricing staff member."
    roles: [Estimator, ProjectManager]
    code: 200
    input: ["direct_cost?", "schedule_impact_days?"]
    output: ChangeOrder
    side_effects: ["runs calculations.change_order_priced_amount", "on the REVISION_REQUESTED -> PRICED edge increments revision_count by 1"]

  - method: POST
    path: "/change-orders/{id}/submit"
    description: "Submits a priced change order to the client for approval; the submitter must not be the pricer."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["stamps submitted_by_staff_id, submitted_at and client_response_due_at"]

  - method: POST
    path: "/change-orders/{id}/client-decision"
    description: "Client approves, requests a revision on, or rejects a submitted change order."
    roles: [Client]
    code: 200
    input: ["decision", "revision_note?"]
    output: ChangeOrder
    side_effects: ["APPROVE recomputes approved_change_order_total -> contract_sum_current -> budget_posture -> freezes OPEN allowance items, and shifts PLANNED/RELEASED tasks by schedule_impact_days", "increments Project.version by 1 on APPROVE"]

  - method: POST
    path: "/change-orders/{id}/void"
    description: "Client descopes an already-approved change order, reversing every ledger and schedule side effect."
    roles: [Client]
    code: 200
    input: [void_reason]
    output: ChangeOrder
    side_effects: ["reverses approved_change_order_total, contract_sum_current, budget_posture, allowance freezes and the schedule shift", "increments Project.version by 1"]

  - method: POST
    path: "/schedule-tasks"
    description: "Adds a construction activity to the schedule, subject to crew-capacity and jobsite exclusive-use overlap rules."
    roles: [ProjectManager]
    code: 201
    input: ["project_id", "subcontractor_id", "task_name", "planned_start", "planned_finish", "predecessor_task_id?", "driving_allowance_item_id?", "lag_days?", "exclusive_use?"]
    output: ScheduleTask
    side_effects: []

  - method: GET
    path: "/schedule-tasks/{id}"
    description: "Reads one schedule task including material readiness and float."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client, Subcontractor]
    code: 200
    input: []
    output: ScheduleTask
    side_effects: []

  - method: GET
    path: "/schedule-tasks"
    description: "Lists schedule tasks, filterable by project, subcontractor, predecessor, driving allowance line and status."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client, Subcontractor]
    code: 200
    input: ["project_id?", "subcontractor_id?", "predecessor_task_id?", "driving_allowance_item_id?", "status?", "limit?", "offset?"]
    output: ScheduleTask[]
    side_effects: []

  - method: POST
    path: "/schedule-tasks/{id}/release"
    description: "Releases a planned task to the field once material and predecessor gates clear."
    roles: [ProjectManager]
    code: 200
    input: []
    output: ScheduleTask
    side_effects: ["stamps released_at and computes float_days when a predecessor exists"]

  - method: POST
    path: "/schedule-tasks/{id}/progress"
    description: "Subcontractor starts or completes its own task."
    roles: [Subcontractor]
    code: 200
    input: [action]
    output: ScheduleTask
    side_effects: ["COMPLETE stamps actual_finish, computes delay_days and shifts direct successors in {PLANNED, RELEASED}"]

  - method: POST
    path: "/cost-entries"
    description: "Posts a cost against the job in PENDING."
    roles: [ProjectManager]
    code: 201
    input: ["project_id", "entry_type", "cost_code", "amount", "incurred_at", "subcontractor_id?", "source_allowance_item_id?"]
    output: CostEntry
    side_effects: []

  - method: GET
    path: "/cost-entries/{id}"
    description: "Reads one cost entry."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client, Lender]
    code: 200
    input: []
    output: CostEntry
    side_effects: []

  - method: GET
    path: "/cost-entries"
    description: "Lists cost entries, filterable by project, subcontractor, allowance line, draw, approving staff and status."
    roles: [PlatformAdmin, ProjectManager, Estimator, Controller, Client, Lender]
    code: 200
    input: ["project_id?", "subcontractor_id?", "source_allowance_item_id?", "draw_request_id?", "approved_by_staff_id?", "status?", "limit?", "offset?"]
    output: CostEntry[]
    side_effects: []

  - method: POST
    path: "/cost-entries/{id}/review"
    description: "Controller approves or rejects a posted cost."
    roles: [Controller]
    code: 200
    input: [decision]
    output: CostEntry
    side_effects: ["APPROVE stamps approved_by_staff_id and recomputes Project.cost_to_date, eligible_cost_pool and budget_posture"]

  - method: POST
    path: "/draw-requests"
    description: "Opens a DRAFT draw for a billing period; supersedes any existing DRAFT draw on the same project."
    roles: [Controller]
    code: 201
    input: [project_id, period_start, period_end, expected_project_version]
    output: DrawRequest
    side_effects: ["voids any existing DRAFT DrawRequest on the project with void_reason SUPERSEDED_BY_NEWER_DRAFT", "increments Project.version by 1"]

  - method: GET
    path: "/draw-requests/{id}"
    description: "Reads one draw request including both state axes and the funding arithmetic."
    roles: [PlatformAdmin, ProjectManager, Controller, Client, Lender, Subcontractor]
    code: 200
    input: []
    output: DrawRequest
    side_effects: []

  - method: GET
    path: "/draw-requests"
    description: "Lists draw requests, filterable by project, submitting staff and status."
    roles: [PlatformAdmin, ProjectManager, Controller, Client, Lender, Subcontractor]
    code: 200
    input: ["project_id?", "submitted_by_staff_id?", "status?", "limit?", "offset?"]
    output: DrawRequest[]
    side_effects: []

  - method: POST
    path: "/draw-requests/{id}/submit"
    description: "Controller submits the draw to the lender, pulling in eligible cost entries and generating lien waiver requests."
    roles: [Controller]
    code: 200
    input: []
    output: DrawRequest
    side_effects: ["runs calculations.draw_funding_amounts and calculations.draw_cumulative_cap", "moves eligible cost entries APPROVED -> INCLUDED_IN_DRAW", "creates LienWaiver rows in REQUESTED", "recomputes Project.pending_draw_amount"]

  - method: POST
    path: "/draw-requests/{id}/lender-decision"
    description: "Lender conditionally approves or returns the draw."
    roles: [Lender]
    code: 200
    input: ["decision", "condition_note?"]
    output: DrawRequest
    side_effects: ["CONDITIONALLY_APPROVE auto-funds when waiver_compliance is already COMPLETE", "RETURN releases cost entries back to APPROVED and voids outstanding waivers"]

  - method: POST
    path: "/draw-requests/{id}/void"
    description: "Controller withdraws a draw, reversing every disposition the submission made."
    roles: [Controller]
    code: 200
    input: [void_reason]
    output: DrawRequest
    side_effects: ["returns INCLUDED_IN_DRAW cost entries to APPROVED, voids outstanding waivers and restores Project.pending_draw_amount"]

  - method: GET
    path: "/lien-waivers/{id}"
    description: "Reads one lien waiver including the required form and required amount."
    roles: [PlatformAdmin, ProjectManager, Controller, Lender, Subcontractor]
    code: 200
    input: []
    output: LienWaiver
    side_effects: []

  - method: GET
    path: "/lien-waivers"
    description: "Lists lien waivers, filterable by draw and subcontractor."
    roles: [PlatformAdmin, ProjectManager, Controller, Lender, Subcontractor]
    code: 200
    input: ["draw_request_id?", "subcontractor_id?", "status?", "limit?", "offset?"]
    output: LienWaiver[]
    side_effects: []

  - method: POST
    path: "/lien-waivers/{id}/receive"
    description: "Subcontractor returns the signed waiver; also used to resubmit after a rejection."
    roles: [Subcontractor]
    code: 200
    input: ["waiver_type", "through_date", "amount_covered", "signed_document_ref?"]
    output: LienWaiver
    side_effects: ["stamps received_at; on the REJECTED -> RECEIVED edge increments resubmit_count"]

  - method: POST
    path: "/lien-waivers/{id}/review"
    description: "Controller verifies or rejects a received waiver; verification can cascade the draw to FUNDED."
    roles: [Controller]
    code: 200
    input: [decision]
    output: LienWaiver
    side_effects: ["VERIFY recomputes the parent draw's waiver_compliance and may auto-fund it, paying its cost entries"]

  - method: POST
    path: "/defect-tickets"
    description: "Opens a punch-list item (phase PUNCH) or a warranty callback (phase WARRANTY); warranty coverage is computed at creation."
    roles: [Client, ProjectManager]
    code: 201
    input: ["project_id", "phase", "room", "description", "severity", "category", "source_schedule_task_id?"]
    output: DefectTicket
    side_effects: ["runs calculations.warranty_coverage_determination and stamps reported_at, coverage_anchor, coverage_end_at and coverage_result"]

  - method: GET
    path: "/defect-tickets/{id}"
    description: "Reads one defect ticket including its coverage verdict."
    roles: [PlatformAdmin, ProjectManager, Controller, Client, Subcontractor]
    code: 200
    input: []
    output: DefectTicket
    side_effects: []

  - method: GET
    path: "/defect-tickets"
    description: "Lists defect tickets, filterable by project, responsible subcontractor, source task, phase and status."
    roles: [PlatformAdmin, ProjectManager, Controller, Client, Subcontractor]
    code: 200
    input: ["project_id?", "responsible_subcontractor_id?", "source_schedule_task_id?", "phase?", "status?", "limit?", "offset?"]
    output: DefectTicket[]
    side_effects: []

  - method: POST
    path: "/defect-tickets/{id}/triage"
    description: "ProjectManager assigns a defect to a trade or denies an out-of-coverage warranty callback."
    roles: [ProjectManager]
    code: 200
    input: ["decision", "responsible_subcontractor_id?"]
    output: DefectTicket
    side_effects: ["ASSIGN stamps assigned_at and response_due_at; on the REJECTED -> ASSIGNED edge increments rework_count", "DENY stamps resolved_at and leaves responsible_subcontractor_id and response_due_at null"]

  - method: POST
    path: "/defect-tickets/{id}/submit-for-review"
    description: "Subcontractor hands remediation back for client review."
    roles: [Subcontractor]
    code: 200
    input: ["completion_note?"]
    output: DefectTicket
    side_effects: []

  - method: POST
    path: "/defect-tickets/{id}/client-review"
    description: "Client verifies or rejects remediation, or waives a cosmetic punch item outright."
    roles: [Client]
    code: 200
    input: [decision]
    output: DefectTicket
    side_effects: ["VERIFY and WAIVE stamp resolved_at; REJECT leaves the ticket blocking for FUNCTIONAL and LIFE_SAFETY severities"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming an unknown role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role is not listed in the endpoint's roles"
  - id: ERR_ROLE_IDENTITY_MISMATCH
    http: 403
    condition: "X-User-ID for a staff-backed role does not resolve to a StaffMember whose staff_function matches the acting role"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Client, Lender or Subcontractor principal acts on a resource it does not own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "change-order submitter equals priced_by_staff_id, or draw submitter equals approved_by_staff_id of an included cost entry"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "referenced project id does not exist"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "referenced client id does not exist"
  - id: ERR_LENDER_NOT_FOUND
    http: 404
    condition: "referenced lender id does not exist"
  - id: ERR_STAFF_NOT_FOUND
    http: 404
    condition: "referenced staff member id does not exist"
  - id: ERR_SUBCONTRACTOR_NOT_FOUND
    http: 404
    condition: "referenced subcontractor id does not exist"
  - id: ERR_ALLOWANCE_ITEM_NOT_FOUND
    http: 404
    condition: "referenced allowance item id does not exist"
  - id: ERR_SELECTION_NOT_FOUND
    http: 404
    condition: "referenced selection id does not exist"
  - id: ERR_CHANGE_ORDER_NOT_FOUND
    http: 404
    condition: "referenced change order id does not exist"
  - id: ERR_SCHEDULE_TASK_NOT_FOUND
    http: 404
    condition: "referenced schedule task id does not exist"
  - id: ERR_COST_ENTRY_NOT_FOUND
    http: 404
    condition: "referenced cost entry id does not exist"
  - id: ERR_DRAW_REQUEST_NOT_FOUND
    http: 404
    condition: "referenced draw request id does not exist"
  - id: ERR_LIEN_WAIVER_NOT_FOUND
    http: 404
    condition: "referenced lien waiver id does not exist"
  - id: ERR_DEFECT_TICKET_NOT_FOUND
    http: 404
    condition: "referenced defect ticket id does not exist"
  - id: ERR_PHOTO_NOT_FOUND
    http: 404
    condition: "referenced photo document id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown enum member, negative or over-precise money value, non-positive interval, or out-of-range pagination parameter"
  - id: ERR_CONTRACT_TERMS_INVALID
    http: 422
    condition: "COST_PLUS project created without builder_fee_pct, or gmp_cap below base_contract_amount"
  - id: ERR_PROJECT_INVALID_STATE
    http: 409
    condition: "project lifecycle action requested from a state that does not declare it"
  - id: ERR_PROJECT_NOT_UNDER_CONSTRUCTION
    http: 409
    condition: "operation requires project.status == UNDER_CONSTRUCTION"
  - id: ERR_PROJECT_NOT_READY_TO_START
    http: 409
    condition: "START_CONSTRUCTION attempted with no allowance item or no planned schedule task"
  - id: ERR_PROJECT_TASKS_INCOMPLETE
    http: 409
    condition: "DECLARE_SUBSTANTIAL_COMPLETION attempted while at least one ScheduleTask is not COMPLETE"
  - id: ERR_CHANGE_ORDER_PENDING
    http: 409
    condition: "DECLARE_SUBSTANTIAL_COMPLETION attempted while a change order is still in DRAFT, PRICED, SUBMITTED or REVISION_REQUESTED"
  - id: ERR_PROJECT_NOT_ACCEPTING_PHOTOS
    http: 409
    condition: "photo publication attempted while project.status == PLANNING"
  - id: ERR_PHOTO_ALREADY_PUBLISHED
    http: 409
    condition: "publish requested for a photo document whose visibility is already CLIENT_PORTAL"
  - id: ERR_ALLOWANCE_INVALID_STATE
    http: 409
    condition: "settle action requested from an allowance status that does not declare it"
  - id: ERR_ALLOWANCE_FROZEN
    http: 409
    condition: "selection proposed against an allowance item in FROZEN, or while project.budget_posture == OVER_GMP"
  - id: ERR_ALLOWANCE_ACTUAL_MISSING
    http: 409
    condition: "RECONCILE requested with no qualifying ALLOWANCE_ACTUAL cost entry"
  - id: ERR_ALLOWANCE_PROJECT_MISMATCH
    http: 422
    condition: "referenced allowance item belongs to a different project than the row being created"
  - id: ERR_SELECTION_NOT_PENDING
    http: 409
    condition: "decision requested on a selection whose status is not PROPOSED"
  - id: ERR_SELECTION_DEADLINE_PASSED
    http: 422
    condition: "selection proposed after the allowance item's selection_deadline"
  - id: ERR_STALE_ALLOWANCE_VERSION
    http: 412
    condition: "expected_allowance_item_version does not match the allowance item's current version"
  - id: ERR_STALE_PROJECT_VERSION
    http: 412
    condition: "expected_project_version does not match the project's current version"
  - id: ERR_CHANGE_ORDER_INVALID_STATE
    http: 409
    condition: "pricing, submission, client decision or void requested from a change-order status that does not declare it"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "revision requested or submitted beyond MAX_REVISION_ROUNDS"
  - id: ERR_TASK_INVALID_STATE
    http: 409
    condition: "release or progress requested from a schedule-task status that does not declare it"
  - id: ERR_PREDECESSOR_INCOMPLETE
    http: 409
    condition: "release requested while the predecessor task is not COMPLETE"
  - id: ERR_PREDECESSOR_CROSS_PROJECT
    http: 422
    condition: "predecessor_task_id names a task in a different project"
  - id: ERR_ALLOWANCE_NOT_LOCKED
    http: 409
    condition: "release requested while the driving allowance item is not LOCKED or RECONCILED"
  - id: ERR_MATERIAL_NOT_READY
    http: 409
    condition: "release requested while material_ready_at is later than planned_start, or start requested before material_ready_at"
  - id: ERR_CREW_CAPACITY_CONFLICT
    http: 409
    condition: "new task's half-open interval collides with at least crew_capacity existing non-terminal tasks for the same subcontractor"
  - id: ERR_JOBSITE_EXCLUSIVE_CONFLICT
    http: 409
    condition: "new exclusive-use task's closed buffered interval collides with an existing exclusive-use task on the same project"
  - id: ERR_COST_ENTRY_INVALID_STATE
    http: 409
    condition: "review requested on a cost entry whose status is not PENDING"
  - id: ERR_DRAW_NOT_IN_DRAFT
    http: 409
    condition: "submit requested on a draw whose status is not DRAFT"
  - id: ERR_DRAW_INVALID_STATE
    http: 409
    condition: "lender decision or void requested from a draw status that does not declare it"
  - id: ERR_DRAW_NO_ELIGIBLE_COSTS
    http: 422
    condition: "submit found zero APPROVED cost entries inside the closed billing period"
  - id: ERR_DRAW_EXCEEDS_LENDER_CAP
    http: 422
    condition: "funded + pending + requested exceeds max_cumulative_draw_pct * contract_sum_current"
  - id: ERR_PROJECT_HAS_NO_LENDER
    http: 422
    condition: "draw operation attempted on a project whose lender_id is null"
  - id: ERR_LENDER_DECISION_WINDOW_EXPIRED
    http: 409
    condition: "lender decision arrives after lender_decision_due_at"
  - id: ERR_WAIVER_INVALID_STATE
    http: 409
    condition: "receive or review requested from a lien-waiver status that does not declare it"
  - id: ERR_WAIVER_TYPE_MISMATCH
    http: 422
    condition: "signed waiver_type differs from required_waiver_type"
  - id: ERR_WAIVER_AMOUNT_INSUFFICIENT
    http: 422
    condition: "signed amount_covered is below required_amount"
  - id: ERR_DEFECT_INVALID_STATE
    http: 409
    condition: "triage, submit-for-review or client-review requested from a defect status that does not declare it"
  - id: ERR_DEFECT_NOT_COVERED
    http: 422
    condition: "warranty ticket assignment attempted while coverage_result is not COVERED"
  - id: ERR_DEFECT_PHASE_MISMATCH
    http: 422
    condition: "DENY used on a punch ticket, WAIVE used on a non-cosmetic or warranty ticket"
  - id: ERR_BLOCKING_PUNCH_ITEMS
    http: 409
    condition: "final walkthrough attempted with unresolved FUNCTIONAL or LIFE_SAFETY punch items"
  - id: ERR_PUNCH_ACK_COUNT_MISMATCH
    http: 422
    condition: "acknowledged_open_cosmetic_count does not equal the actual count of unresolved cosmetic punch items"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Back-office operator who seeds reference data and controls the logical clock; owns no business decision."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /clients"
      - "POST /lenders"
      - "POST /staff-members"
      - "POST /subcontractors"
      - "POST /projects"
    shared_operations:
      - "every GET read endpoint except GET /projects/{id}/contract-position is shared with the business roles"

  - name: ProjectManager
    description: "Builder-side PM who runs the schedule, the allowance book, cost capture and the punch/warranty triage."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /projects/{id}/advance"
      - "POST /allowance-items"
      - "POST /selections/{id}/decision"
      - "POST /change-orders"
      - "POST /change-orders/{id}/submit"
      - "POST /schedule-tasks"
      - "POST /schedule-tasks/{id}/release"
      - "POST /cost-entries"
      - "POST /defect-tickets/{id}/triage"
      - "POST /projects/{id}/photo-documents"
      - "POST /photo-documents/{id}/publish"
    shared_operations:
      - "POST /change-orders/{id}/price (shared with Estimator; pricing as PM is what makes the segregation-of-duties rule reachable)"
      - "POST /defect-tickets (shared with Client)"
      - "read endpoints"
    note: "X-User-ID must be a StaffMember whose staff_function == PROJECT_MANAGER."

  - name: Estimator
    description: "Builder-side estimator who prices and reprices change orders but may never submit one."
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "POST /change-orders/{id}/price (shared with ProjectManager)"
      - "read endpoints"
    note: "X-User-ID must be a StaffMember whose staff_function == ESTIMATOR."

  - name: Controller
    description: "Builder-side accountant who approves costs, locks and reconciles allowances, and drives draws and waivers."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /allowance-items/{id}/settle"
      - "POST /cost-entries/{id}/review"
      - "POST /draw-requests"
      - "POST /draw-requests/{id}/submit"
      - "POST /draw-requests/{id}/void"
      - "POST /lien-waivers/{id}/review"
    shared_operations:
      - "read endpoints"
    note: "X-User-ID must be a StaffMember whose staff_function == CONTROLLER. Segregation of duties forbids the same controller from approving a cost entry and submitting the draw that carries it."

  - name: Client
    description: "Homeowner who proposes selections, decides change orders, signs off the walkthrough and reviews defect remediation."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /selections"
      - "POST /change-orders/{id}/client-decision"
      - "POST /change-orders/{id}/void"
      - "POST /projects/{id}/final-walkthrough"
      - "POST /defect-tickets/{id}/client-review"
    shared_operations:
      - "POST /defect-tickets (shared with ProjectManager)"
      - "read endpoints, with photo documents filtered to visibility == CLIENT_PORTAL"
    note: "X-User-ID must equal Project.client_id for every project-scoped operation."

  - name: Lender
    description: "Construction lender who conditionally approves or returns draw requests."
    identity: "entity_backed:Lender"
    exclusive_operations:
      - "POST /draw-requests/{id}/lender-decision"
    shared_operations:
      - "read endpoints"
    note: "X-User-ID must equal Project.lender_id for the draw's project."

  - name: Subcontractor
    description: "Trade contractor who starts and completes its own tasks, returns signed lien waivers and hands defect remediation back for review."
    identity: "entity_backed:Subcontractor"
    exclusive_operations:
      - "POST /schedule-tasks/{id}/progress"
      - "POST /lien-waivers/{id}/receive"
      - "POST /defect-tickets/{id}/submit-for-review"
    shared_operations:
      - "read endpoints"
    note: "X-User-ID must equal the target row's subcontractor_id / responsible_subcontractor_id."
