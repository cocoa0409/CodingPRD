  - rule_id: resource_temporal_overlap
    instances:

      - name: player_assignment_windows_require_three_day_transfer_gap_on_closed_intervals
        grounds:
          - calculations.assignment_window_conflict
          - "validations[priority=66]"
          - entities.PlayerAssignment.fields.effective_date
          - entities.PlayerAssignment.fields.end_date
          - errors[ERR_ASSIGNMENT_WINDOW_CONFLICT]
        distinguishing_aspect: |
          This instance tests CLOSED player-assignment intervals with a
          positive minimum separation: a two-day gap after the prior end_date
          is rejected because TRANSFER_BUFFER_DAYS is 2 and the comparison is
          0 < gap <= 2, while a three-day gap is admitted. The blocking prior
          row is only PENDING_CLEARANCE, so the buffer does not need an active
          assignment.
        test_recipe:
          setup:
            - "The logical clock is moved to 2026-04-01T00:00:00Z."
            - "A DOUBLE_A affiliate with an ACTIVE agreement (minimum_active_players 0)."
            - "A cleared player with one LEVEL assignment over the closed interval 2026-04-01..2026-04-30 in status PENDING_CLEARANCE."
            - "Player.version is re-read from GET /players/{id} before every POST /assignments, because each accepted assignment bumps the player row."
