      - name: age_eligibility_exclusive_upper_bound
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_AGE_INELIGIBLE
        distinguishing_aspect: "Upper bound is EXCLUSIVE: a patient exactly max_age_months old at submission (DOB 2010-09-01, program max 192, clock 2026-09-01 -> exactly 192 months) is rejected ERR_AGE_INELIGIBLE, while one month younger (DOB 2010-10-01 -> 191 months) is accepted into SUBMITTED."
