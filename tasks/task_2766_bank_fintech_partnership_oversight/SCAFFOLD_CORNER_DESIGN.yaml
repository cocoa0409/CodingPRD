        distinguishing_aspect: "Two root-cause codes each appear once, so the tie-break decides: the FIRST-created complaint carries VENDOR_ERROR and the second carries KYC_FRICTION, and the tie-break is (earliest created_at, then code) — so the answer is VENDOR_ERROR even though KYC_FRICTION is lexicographically smaller. A third RECEIVED complaint with a null root cause and a fourth WITHDRAWN one must both stay out of the pool."
