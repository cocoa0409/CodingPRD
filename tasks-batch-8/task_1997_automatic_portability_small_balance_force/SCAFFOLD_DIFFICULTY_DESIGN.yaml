            - { call: "POST /sweeps/run", payload: {}, as: ProviderOps }
            - { call: "POST /distribution-batches/${b_x}/execute", payload: {}, as: ProviderOps, as_user_id: "ops_exec_1" }
            - { call: "POST /checks", payload: { distribution_case_id: "${c_a}" }, as: ProviderOps, captures: { chk: $.data.id } }
