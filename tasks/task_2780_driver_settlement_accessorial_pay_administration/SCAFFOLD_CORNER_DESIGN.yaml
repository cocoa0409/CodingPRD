      - name: settlement_periods_are_half_open_and_only_non_voided_ones_block
        claim_type: temporal_validation
        grounds:
          - validations[priority=41]
          - errors[ERR_SETTLEMENT_PERIOD_OVERLAP]
          - entities.Settlement.fields.period_end
          - state_machines.Settlement.DRAFT_to_VOIDED
        distinguishing_aspect: |
          Priority 41 compares half-open windows against non-VOIDED siblings, which makes three distinct
          outcomes on one driver: [08-09, 08-16) genuinely overlaps [08-03, 08-10) and is rejected with 409;
          [08-10, 08-17) merely touches the exclusive upper bound and is accepted; and after STL_OVA is voided
          the fully-contained [08-05, 08-08) is also accepted, because a VOIDED period no longer occupies the
          calendar. An inclusive comparison would reject the touching window.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z moved to 2026-08-10T09:00Z"
            - "driver DRV_OV ACTIVE on a LEASED_OPERATOR package"
