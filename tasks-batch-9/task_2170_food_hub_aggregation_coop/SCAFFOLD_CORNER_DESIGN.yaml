      - Product.${pr1_id}.quantity_committed == 60
      - Product.${pr1_id}.quantity_available == 40
  - name: buyer_type_invalid_enum_value_is_rejected
    claim_type: type_constraints
    grounds:
    - validations[priority=6]
    - errors[ERR_INVALID_REQUEST]
    - entities.Buyer.fields.buyer_type
    distinguishing_aspect: buyer_type is constrained to SCHOOL_DISTRICT | HOSPITAL | UNIVERSITY | CORRECTIONS, so the value MUNICIPALITY must be rejected with HTTP 400 ERR_INVALID_REQUEST.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /buyers
        payload:
          legal_name: Riverside Council
          buyer_type: MUNICIPALITY
          dock_zone_code: Z9
          payment_terms_days: 30
          credit_limit_cents: 100000
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 400
      - ${err_id} == ERR_INVALID_REQUEST
  - name: order_line_creation_under_unknown_parent_order_returns_not_found
    claim_type: parent_relationships
    grounds:
    - validations[priority=4]
    - errors[ERR_ORDER_NOT_FOUND]
    - endpoints[POST /buyer-orders/{id}/lines]
    distinguishing_aspect: An OrderLine may only be created under an existing BuyerOrder; a POST under an unknown order id must return HTTP 404 ERR_ORDER_NOT_FOUND before any body validation runs.
    test_recipe:
      setup:
      - Buyer B1 exists but owns no orders.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /buyers
        payload:
          legal_name: Metro School District
          buyer_type: SCHOOL_DISTRICT
          dock_zone_code: Z1
          payment_terms_days: 30
          credit_limit_cents: 5000000
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          b1_id: $.data.id
      trigger:
      - call: POST /buyer-orders/00000000-0000-4000-8000-000000000000/lines
        payload:
          commodity_code: CARROT_LOOSE
          storage_class: CHILL
          unit_of_measure: CASE
          quantity_requested: 10
          max_unit_price_cents: 2500
        as: Buyer
        as_user_id: ${b1_id}
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 404
      - ${err_id} == ERR_ORDER_NOT_FOUND
  - name: allocation_junction_links_one_order_line_to_two_products
    claim_type: graph_topology
    grounds:
    - entities.Allocation
    - endpoints[GET /allocations]
    - calculations.line_allocation_waterfall
    distinguishing_aspect: 'Allocation is the many-to-many junction of the graph topology: one OrderLine fans out to two Products of two different producers, and both directions are reachable by GET /allocations
      filtered on order_line_id and on product_id.'
    test_recipe:
      setup:
      - Producers P1 and P2 are both ACTIVE and compliant.
      - P1 owns PR1 LISTED at 1800 cents with quantity_offered 10; P2 owns PR2 LISTED at 1700 cents with quantity_offered 10.
      - Buyer B1's order O1 has one line L1 for 15 CASE of CARROT_LOOSE at max_unit_price_cents 2500, still DRAFT.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: HubAdmin
        as_user_id: hub-admin-1
      - call: POST /producers
        payload:
          legal_name: Green Acres Farm
          region_code: NEV
          contact_email: ga@example.org
        as: HubAdmin
        as_user_id: hub-admin-1
        captures:
          p1_id: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: GAP_AUDIT
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
