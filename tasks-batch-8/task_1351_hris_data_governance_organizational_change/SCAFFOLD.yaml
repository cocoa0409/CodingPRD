# =============================================================================
# Task 1351 — HRIS Data Governance & Organizational Change Management
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design
# (§1.9) live in sibling files.
# =============================================================================

scenario: |
  HRIS Data Governance & Organizational Change Management (HRIS operations team): data dictionary & field ownership, position/reporting hierarchy change effective dating, mass change (reorg) processing & validation, downstream integration monitoring & error queue, data quality rules & exception reporting, historical record correction vs new record decision, security role provisioning & segregation of duties, audit of sensitive field changes

domain_name: hris-data-governance
api_prefix: /hris

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - ops_run_checkpoint
    - bulk_operations
  entity_topology: flat            # peer entities joined by FK references; Position is self-referential
  state_machine_shape: cyclic      # batch rework loop + integration retry loop + waiver expiry loop
  relationship_patterns:
    - one_to_many
    - self_referential             # Position.parent_position_id
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Eight scenario pillars are wired into 12 tightly-coupled entities. The core
    coupling: ChangeRequest (effective dating + correction-vs-new-record policy)
    drives PositionAssignment interval mutation, which emits IntegrationEvents
    (error queue with retry budget), which dead-letter into ExceptionRecords;
    MassChangeBatch composes the same apply machinery in bulk with
    validate-at-submit vs re-validate-at-execute drift; SecurityRoleAssignment
    gates approval authority and enforces segregation of duties; AuditEntry
    replays corrections for AS_WAS vs AS_IS divergence. A logical clock
    (default 2026-08-01T00:00:00Z) sweeps time-driven transitions.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DataField
    parent: null
    common_fields: true
    fields:
      - { name: field_key, type: string, source: input, description: "Governed attribute key; must name a governable attribute: assignment.position_id | assignment.salary_cents | assignment.pay_grade | assignment.location_code | position.parent_position_id | position.title | position.department", constraints: "unique across DataField" }
      - { name: display_name, type: string, source: input, description: "Human-readable field name" }
      - { name: sensitivity, type: enum, source: input, description: "PUBLIC | INTERNAL | CONFIDENTIAL | RESTRICTED; RESTRICTED forces dual approval" }
      - { name: history_policy, type: enum, source: input, description: "CORRECTABLE | APPEND_ONLY; APPEND_ONLY forbids correction_mode=CORRECT_HISTORY" }
      - { name: downstream_channels, type: array, source: input, default: "[]", description: "Subset of [PAYROLL, BENEFITS, IDENTITY]; one IntegrationEvent per channel on apply" }
      - { name: owner_team, type: string, source: input, description: "Data steward team owning this dictionary entry" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DEPRECATED" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Position title" }
      - { name: department, type: string, source: input, description: "Owning department" }
      - { name: parent_position_id, type: string, source: input, description: "FK -> Position.id; null = root of reporting tree", constraints: "nullable" }
      - { name: headcount_budget, type: integer, source: input, description: "Budgeted seats for BUDGETED_CAPACITY rollups", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED" }

  - name: Worker
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Worker legal name" }
      - { name: worker_number, type: string, source: input, description: "External worker number", constraints: "unique" }
      - { name: hire_date, type: string, source: input, description: "ISO date; start of the initial assignment row created at worker creation" }
      - { name: initial_position_id, type: string, source: input, description: "FK -> Position.id; seeds the first PositionAssignment row" }
      - { name: initial_salary_cents, type: integer, source: input, description: "Seeds salary_cents on the initial assignment row", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED" }
      - { name: termination_date, type: string, source: system, description: "ISO date, set by terminate", constraints: "null until terminated" }

  - name: PositionAssignment
    parent: null
    common_fields: true
    fields:
      - { name: worker_id, type: string, source: system, description: "FK -> Worker.id" }
      - { name: change_request_id, type: string, source: system, description: "FK -> ChangeRequest.id; null for the initial row created with the Worker", constraints: "nullable" }
      - { name: position_id, type: string, source: system, description: "FK -> Position.id" }
      - { name: salary_cents, type: integer, source: system, description: "Governed salary value carried by this effective-dated row" }
      - { name: pay_grade, type: string, source: system, description: "Governed pay grade" }
      - { name: location_code, type: string, source: system, description: "Governed work location" }
      - { name: effective_start_date, type: string, source: system, description: "ISO date; half-open interval start (inclusive)" }
      - { name: effective_end_date, type: string, source: system, description: "ISO date; half-open interval end (exclusive); null = open-ended", constraints: "nullable" }
      - { name: row_status, type: enum, source: system, description: "FUTURE | ACTIVE | HISTORY | VOIDED; FUTURE/ACTIVE/HISTORY derived from logical clock vs interval; VOIDED by termination cascade or change-request void" }

  - name: ChangeRequest
    parent: null
    common_fields: true
    fields:
      - { name: target_type, type: enum, source: input, description: "WORKER_FIELD | POSITION_FIELD | POSITION_HIERARCHY" }
      - { name: target_worker_id, type: string, source: system, description: "FK -> Worker.id; set for WORKER_FIELD targets (from nested path)", constraints: "nullable" }
      - { name: target_position_id, type: string, source: system, description: "FK -> Position.id; set for POSITION_FIELD/POSITION_HIERARCHY targets (from nested path)", constraints: "nullable" }
      - { name: target_field_id, type: string, source: input, description: "FK -> DataField.id; the governed field being changed" }
      - { name: new_value, type: string, source: input, description: "Replacement value as string; interpreted per DataField.field_key (integer cents, position id, or free string; batch salary lines also accept '+P%' percent form)" }
      - { name: effective_date, type: string, source: input, description: "ISO date; required for NEW_RECORD, ignored for CORRECT_HISTORY", constraints: "nullable" }
      - { name: correction_mode, type: enum, source: input, default: "NEW_RECORD", description: "NEW_RECORD (insert effective-dated row, truncate covering row) | CORRECT_HISTORY (rewrite target row in place)" }
      - { name: target_row_id, type: string, source: input, description: "FK -> PositionAssignment.id; required when correction_mode=CORRECT_HISTORY", constraints: "nullable" }
      - { name: propagate_correction, type: boolean, source: input, default: false, description: "CORRECT_HISTORY only: when true, emits CORRECTION_PROPAGATED IntegrationEvents" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | PARTIALLY_APPROVED | APPROVED | REJECTED | SUPERSEDED | APPLIED | VOIDED" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the creator (segregation-of-duties anchor)" }
      - { name: approver_1_id, type: string, source: system, description: "First approver X-User-ID", constraints: "nullable" }
      - { name: approver_2_id, type: string, source: system, description: "Second approver X-User-ID (RESTRICTED dual approval)", constraints: "nullable" }
      - { name: prior_value, type: string, source: system, description: "Snapshot of overwritten value (CORRECT_HISTORY) for void compensation", constraints: "nullable" }
      - { name: prior_row_end, type: string, source: system, description: "Snapshot of truncated row's original effective_end_date (NEW_RECORD) for void compensation", constraints: "nullable" }

  - name: MassChangeBatch
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Batch label (e.g. reorg name)" }
      - { name: status, type: enum, source: system, description: "DRAFT | VALIDATED | VALIDATION_FAILED | SCHEDULED | COMPLETED | COMPLETED_WITH_ERRORS | ROLLED_BACK" }
      - { name: scheduled_effective_date, type: string, source: system, description: "ISO date set by schedule; clock sweep at/after this date auto-executes", constraints: "nullable" }
      - { name: total_lines, type: integer, source: computed, description: "Count of BatchLine rows in batch" }
      - { name: applied_lines, type: integer, source: computed, description: "Lines currently APPLIED" }
      - { name: failed_lines, type: integer, source: computed, description: "Lines currently FAILED" }
      - { name: total_delta_cents, type: integer, source: computed, description: "Sum of resolved_delta_cents over APPLIED salary lines; per-line rounding (see batch_total_delta_cents calc)" }

  - name: BatchLine
    parent: null
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> MassChangeBatch.id (from nested path)" }
      - { name: line_index, type: integer, source: input, description: "Processing order within batch; ascending, ties broken by created_at ASC", constraints: ">= 0, unique within batch" }
      - { name: target_worker_id, type: string, source: input, description: "FK -> Worker.id" }
      - { name: target_field_id, type: string, source: input, description: "FK -> DataField.id; RESTRICTED fields are forbidden in batches" }
      - { name: new_value, type: string, source: input, description: "Absolute value or '+P%' percent form for assignment.salary_cents" }
      - { name: effective_date, type: string, source: input, description: "ISO date; lines are always NEW_RECORD mode semantics" }
      - { name: status, type: enum, source: system, description: "PENDING | VALIDATED | FAILED | APPLIED | ROLLED_BACK" }
      - { name: error_id, type: string, source: system, description: "Validation/apply error captured at line level", constraints: "nullable" }
      - { name: resolved_delta_cents, type: integer, source: computed, description: "For salary lines: resolved new salary minus prior row salary; null for non-salary lines", constraints: "nullable" }

  - name: IntegrationEvent
    parent: null
    common_fields: true
    fields:
      - { name: event_type, type: enum, source: system, description: "CHANGE_APPLIED | CORRECTION_PROPAGATED | REVERSAL" }
      - { name: channel, type: enum, source: system, description: "PAYROLL | BENEFITS | IDENTITY" }
      - { name: worker_id, type: string, source: system, description: "FK -> Worker.id" }
      - { name: change_request_id, type: string, source: system, description: "FK -> ChangeRequest.id; null for batch-originated events", constraints: "nullable" }
      - { name: batch_id, type: string, source: system, description: "FK -> MassChangeBatch.id; null for single-change events", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "QUEUED | DISPATCHED | ACKNOWLEDGED | FAILED | DEAD_LETTERED | RESOLVED | CANCELLED" }
      - { name: retry_count, type: integer, source: system, default: 0, description: "Increments on each FAILED dispatch; >= MAX_RETRY(3) dead-letters" }
      - { name: resolution_note, type: string, source: input, description: "Operator note recorded at resolve", constraints: "nullable" }

  - name: DataQualityRule
    parent: null
    common_fields: true
    fields:
      - { name: target_field_id, type: string, source: input, description: "FK -> DataField.id" }
      - { name: rule_type, type: enum, source: input, description: "RANGE (integer within [param_min, param_max], bounds inclusive) | REQUIRED (non-empty) | REGEX (param_pattern match)" }
      - { name: severity, type: enum, source: input, description: "WARNING (apply succeeds, ExceptionRecord opened) | CRITICAL (apply rejected)" }
      - { name: param_min, type: integer, source: input, description: "RANGE lower bound (inclusive)", constraints: "nullable" }
      - { name: param_max, type: integer, source: input, description: "RANGE upper bound (inclusive)", constraints: "nullable" }
      - { name: param_pattern, type: string, source: input, description: "REGEX pattern", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISABLED; DISABLED rules are skipped during evaluation" }

  - name: ExceptionRecord
    parent: null
    common_fields: true
    fields:
      - { name: rule_id, type: string, source: system, description: "FK -> DataQualityRule.id; null for dead-letter-originated exceptions", constraints: "nullable" }
      - { name: change_request_id, type: string, source: system, description: "FK -> ChangeRequest.id; null when batch/event originated", constraints: "nullable" }
      - { name: batch_id, type: string, source: system, description: "FK -> MassChangeBatch.id; null when single-change originated", constraints: "nullable" }
      - { name: integration_event_id, type: string, source: system, description: "FK -> IntegrationEvent.id; set only for dead-letter-originated exceptions", constraints: "nullable" }
      - { name: worker_id, type: string, source: system, description: "FK -> Worker.id" }
      - { name: field_id, type: string, source: system, description: "FK -> DataField.id; null for dead-letter-originated exceptions", constraints: "nullable" }
      - { name: observed_value, type: string, source: system, description: "Offending value snapshot" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED | WAIVED; WAIVED auto-reopens to OPEN when clock passes waiver_expiry_date" }
      - { name: priority_score, type: integer, source: computed, description: "exception_priority_score; recomputed on every logical-clock advance" }
      - { name: waiver_expiry_date, type: string, source: input, description: "ISO date; required for waive, <= logical clock + 90 days", constraints: "nullable" }
      - { name: resolution_note, type: string, source: input, description: "Operator note at resolve/waive", constraints: "nullable" }

  - name: SecurityRoleAssignment
    parent: null
    common_fields: true
    fields:
      - { name: user_id, type: string, source: input, description: "Opaque operator identifier the grant is issued to (equals X-User-ID when acting)" }
      - { name: role_code, type: enum, source: input, description: "HRIS_ANALYST | DATA_STEWARD | CHANGE_APPROVER | INTEGRATION_OPERATOR | SECURITY_ADMIN" }
      - { name: scope_department, type: string, source: input, default: "GLOBAL", description: "Department scope or GLOBAL" }
      - { name: valid_from, type: string, source: input, description: "ISO date; closed-interval grant window start (inclusive)" }
      - { name: valid_until, type: string, source: input, description: "ISO date; closed-interval grant window end (inclusive)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | PROVISIONED | REVOKED | EXPIRED" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of approving SecurityAdmin", constraints: "nullable" }

  - name: AuditEntry
    parent: null
    common_fields: false   # append-only log: id + created_at only; immutable, no version
    fields:
      - { name: actor_id, type: string, source: system, description: "X-User-ID (or 'system') that caused the entry" }
      - { name: action, type: enum, source: system, description: "APPLY | CORRECT | VOID | BATCH_APPLY | BATCH_VOID | GRANT_APPROVE | GRANT_REVOKE" }
      - { name: worker_id, type: string, source: system, description: "FK -> Worker.id", constraints: "nullable" }
      - { name: field_id, type: string, source: system, description: "FK -> DataField.id", constraints: "nullable" }
      - { name: change_request_id, type: string, source: system, description: "FK -> ChangeRequest.id", constraints: "nullable" }
      - { name: batch_id, type: string, source: system, description: "FK -> MassChangeBatch.id", constraints: "nullable" }
      - { name: old_value, type: string, source: system, description: "Value before the change (null for pure inserts)", constraints: "nullable" }
      - { name: new_value, type: string, source: system, description: "Value after the change", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: DataField
    initial_state: DRAFT
    terminal_states: [DEPRECATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /hris/data-fields/{dataFieldId}/activate"
        actor: DataSteward
        preconditions:
          - "status == DRAFT (else ERR_FIELD_NOT_ACTIVE)"
        side_effects: []
      - from: ACTIVE
        to: DEPRECATED
        trigger: "POST /hris/data-fields/{dataFieldId}/deprecate"
        actor: DataSteward
        preconditions:
          - "status == ACTIVE (else ERR_FIELD_NOT_ACTIVE)"
        side_effects:
          - "New change requests / batch lines referencing this field are rejected (ERR_FIELD_NOT_ACTIVE); existing PENDING_APPROVAL/PARTIALLY_APPROVED/APPROVED requests are unaffected"

  - entity: Position
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /hris/positions/{positionId}/close"
        actor: HrisAnalyst
        preconditions:
          - "status == ACTIVE (else ERR_POSITION_NOT_ACTIVE)"
          - "subtree_headcount(position, FILLED_ONLY) == 0 — no worker may hold an assignment row whose interval covers the logical clock date anywhere in the subtree, self included (else ERR_POSITION_SUBTREE_OCCUPIED)"
        side_effects: []

  - entity: Worker
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /hris/workers/{workerId}/terminate"
        actor: HrisAnalyst
        preconditions:
          - "status == ACTIVE (else ERR_WORKER_NOT_ACTIVE)"
          - "termination_date >= hire_date (else ERR_INVALID_REQUEST)"
        side_effects:
          - "PositionAssignment row covering termination_date: effective_end_date := termination_date (truncated; row re-derives row_status on next clock sweep)"
          - "All assignment rows with effective_start_date > termination_date: row_status := VOIDED"
          - "Worker.version incremented by 1"

  - entity: PositionAssignment
    initial_state: FUTURE   # or ACTIVE when effective_start_date <= logical clock date
    terminal_states: [HISTORY, VOIDED]
    transitions:
      - from: FUTURE
        to: ACTIVE
        trigger: "system (POST /_clock/set_current_utc sweep: effective_start_date <= clock date AND (effective_end_date is null OR clock date < effective_end_date))"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: HISTORY
        trigger: "system (POST /_clock/set_current_utc sweep: effective_end_date is not null AND clock date >= effective_end_date)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FUTURE
        to: HISTORY
        trigger: "system (clock sweep past a fully elapsed future interval)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [FUTURE, ACTIVE]
        to: VOIDED
        trigger: "system (worker termination cascade, or change-request void removing the inserted row)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ChangeRequest
    initial_state: PENDING_APPROVAL
    terminal_states: [REJECTED, SUPERSEDED, VOIDED]
    transitions:
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /hris/change-requests/{changeRequestId}/approve"
        actor: ChangeApprover
        preconditions:
          - "status == PENDING_APPROVAL or PARTIALLY_APPROVED (else ERR_REQUEST_INVALID_STATE)"
          - "caller holds a PROVISIONED SecurityRoleAssignment with role_code=CHANGE_APPROVER for X-User-ID (else ERR_GRANT_NOT_PROVISIONED)"
          - "caller X-User-ID != created_by (else ERR_SELF_APPROVAL_FORBIDDEN)"
          - "non-RESTRICTED field: single approval suffices"
        side_effects:
          - "approver_1_id := X-User-ID"
      - from: PENDING_APPROVAL
        to: PARTIALLY_APPROVED
        trigger: "POST /hris/change-requests/{changeRequestId}/approve (field sensitivity == RESTRICTED)"
        actor: ChangeApprover
        preconditions:
          - "same grant and self-approval preconditions as approve"
        side_effects:
          - "approver_1_id := X-User-ID"
      - from: PARTIALLY_APPROVED
        to: APPROVED
        trigger: "POST /hris/change-requests/{changeRequestId}/approve (second, distinct approver)"
        actor: ChangeApprover
        preconditions:
          - "status == PARTIALLY_APPROVED (else ERR_REQUEST_INVALID_STATE)"
          - "caller holds PROVISIONED CHANGE_APPROVER grant (else ERR_GRANT_NOT_PROVISIONED)"
          - "caller X-User-ID != created_by AND != approver_1_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
        side_effects:
          - "approver_2_id := X-User-ID"
      - from: [PENDING_APPROVAL, PARTIALLY_APPROVED]
        to: REJECTED
        trigger: "POST /hris/change-requests/{changeRequestId}/reject"
        actor: ChangeApprover
        preconditions:
          - "status in {PENDING_APPROVAL, PARTIALLY_APPROVED} (else ERR_REQUEST_INVALID_STATE)"
        side_effects: []
      - from: [PENDING_APPROVAL, PARTIALLY_APPROVED]
        to: SUPERSEDED
        trigger: "system (a new ChangeRequest is created for the same (target_worker_id|target_position_id, target_field_id) pair)"
        actor: system
        preconditions: []
        side_effects:
          - "AuditEntry is NOT written for supersession"
      - from: APPROVED
        to: APPLIED
        trigger: "POST /hris/change-requests/{changeRequestId}/apply, or system clock sweep for position-targeted requests once clock date >= effective_date"
        actor: HrisAnalyst
        preconditions:
          - "status == APPROVED (else ERR_REQUEST_INVALID_STATE)"
          - "WORKER_FIELD: target worker status == ACTIVE (else ERR_WORKER_NOT_ACTIVE)"
          - "target DataField status == ACTIVE (else ERR_FIELD_NOT_ACTIVE)"
          - "correction_mode allowed by DataField.history_policy (APPEND_ONLY forbids CORRECT_HISTORY: ERR_CORRECTION_MODE_NOT_ALLOWED)"
          - "NEW_RECORD: no existing assignment row has effective_start_date == effective_date (ERR_EFFECTIVE_PERIOD_OVERLAP)"
          - "NEW_RECORD: effective_date within [clock-730d, clock+365d] (ERR_EFFECTIVE_DATE_OUT_OF_WINDOW)"
          - "POSITION_HIERARCHY: new parent exists, is ACTIVE (ERR_POSITION_NOT_ACTIVE), creates no cycle (ERR_HIERARCHY_CYCLE), and keeps max depth <= 10 (ERR_HIERARCHY_DEPTH_EXCEEDED); effective_date must be >= clock date (ERR_EFFECTIVE_DATE_OUT_OF_WINDOW)"
          - "All ACTIVE CRITICAL DataQualityRules on the target field pass against new_value (else ERR_DQ_CRITICAL_VIOLATION)"
        side_effects:
          - "CORRECT_HISTORY: target_row's governed attribute := new_value; prior_value snapshot recorded; AuditEntry(action=CORRECT) always written; IntegrationEvents only when propagate_correction == true (event_type=CORRECTION_PROPAGATED)"
          - "NEW_RECORD WORKER_FIELD: covering row truncated (effective_end_date := effective_date; prior_row_end snapshot); new row inserted [effective_date, truncated row's old end) carrying new_value; AuditEntry(action=APPLY) written when field sensitivity in {CONFIDENTIAL, RESTRICTED}; one IntegrationEvent (CHANGE_APPLIED, QUEUED) per channel in DataField.downstream_channels; Worker.version incremented by 1"
          - "NEW_RECORD POSITION_FIELD / POSITION_HIERARCHY: applied to the Position at apply time; AuditEntry(action=APPLY) for CONFIDENTIAL/RESTRICTED fields; Position.version incremented by 1; no IntegrationEvents (position changes are internal)"
          - "WARNING DataQualityRule failures: ExceptionRecord(status=OPEN) created after the apply succeeds"
      - from: APPLIED
        to: VOIDED
        trigger: "POST /hris/change-requests/{changeRequestId}/void"
        actor: HrisAnalyst
        preconditions:
          - "status == APPLIED (else ERR_REQUEST_INVALID_STATE)"
          - "no other APPLIED ChangeRequest exists for the same (target, field) with a later created_at (else ERR_REQUEST_INVALID_STATE)"
        side_effects:
          - "NEW_RECORD: inserted row -> VOIDED; truncated row's effective_end_date restored from prior_row_end"
          - "CORRECT_HISTORY: target row's attribute restored from prior_value"
          - "AuditEntry(action=VOID) written"
          - "One REVERSAL IntegrationEvent (QUEUED) per channel that received the original event"
          - "Target Worker/Position version incremented by 1"

  - entity: MassChangeBatch
    initial_state: DRAFT
    terminal_states: [COMPLETED, ROLLED_BACK]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /hris/mass-change-batches/{batchId}/submit"
        actor: HrisAnalyst
        preconditions:
          - "status == DRAFT (else ERR_BATCH_NOT_DRAFT)"
          - "expected_batch_version == current version (else ERR_STALE_BATCH_VERSION)"
          - "every line validates: target worker exists+ACTIVE, field exists+ACTIVE, field not RESTRICTED (ERR_RESTRICTED_FIELD_IN_BATCH at line level), effective window, correction policy, overlap check against current rows; zero FAILED lines required for this target"
        side_effects:
          - "Each line: PENDING -> VALIDATED or FAILED (line.error_id set on failure)"
          - "Batch.version incremented by 1"
      - from: DRAFT
        to: VALIDATION_FAILED
        trigger: "POST /hris/mass-change-batches/{batchId}/submit (with >= 1 FAILED line)"
        actor: HrisAnalyst
        preconditions:
          - "status == DRAFT; expected_batch_version matches"
        side_effects:
          - "Per-line outcomes recorded; Batch.version incremented by 1"
      - from: VALIDATION_FAILED
        to: DRAFT
        trigger: "POST /hris/mass-change-batches/{batchId}/reopen"
        actor: HrisAnalyst
        preconditions:
          - "status == VALIDATION_FAILED (else ERR_BATCH_NOT_REOPENABLE)"
        side_effects:
          - "ALL lines reset to PENDING and error_id cleared (full re-validation on next submit)"
          - "Batch.version incremented by 1"
      - from: VALIDATED
        to: SCHEDULED
        trigger: "POST /hris/mass-change-batches/{batchId}/schedule"
        actor: HrisAnalyst
        preconditions:
          - "status == VALIDATED (else ERR_BATCH_NOT_EXECUTABLE)"
          - "scheduled_effective_date >= logical clock date (else ERR_EFFECTIVE_DATE_OUT_OF_WINDOW)"
        side_effects:
          - "scheduled_effective_date set; Batch.version incremented by 1"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /hris/mass-change-batches/{batchId}/execute, or system clock sweep when clock date >= scheduled_effective_date"
        actor: HrisAnalyst
        preconditions:
          - "status == SCHEDULED (else ERR_BATCH_NOT_EXECUTABLE)"
        side_effects:
          - "Lines re-validated and applied sequentially in line_index ASC (tie: created_at ASC); each line VALIDATED -> APPLIED or FAILED (state drift between submit and execute surfaces here)"
          - "Per APPLIED line: same row truncation/insert machinery as ChangeRequest NEW_RECORD apply; AuditEntry(action=BATCH_APPLY) per sensitive line; IntegrationEvents (batch_id set) per channel"
          - "WARNING DQ failures open ExceptionRecords (batch_id set)"
          - "Recompute total_lines / applied_lines / failed_lines / total_delta_cents; Batch.version incremented by 1"
      - from: SCHEDULED
        to: COMPLETED_WITH_ERRORS
        trigger: "same as COMPLETED, when >= 1 line FAILED at execute"
        actor: HrisAnalyst
        preconditions: []
        side_effects:
          - "Partial application stands (bulk best-effort); applied lines keep their effects"
      - from: COMPLETED_WITH_ERRORS
        to: ROLLED_BACK
        trigger: "POST /hris/mass-change-batches/{batchId}/rollback"
        actor: HrisAnalyst
        preconditions:
          - "status == COMPLETED_WITH_ERRORS (else ERR_BATCH_NOT_ROLLBACKABLE)"
        side_effects:
          - "Each APPLIED line compensated in reverse line_index order: inserted rows VOIDED, truncated rows' ends restored, AuditEntry(action=BATCH_VOID) per line, REVERSAL IntegrationEvents per emitted channel"
          - "Original batch events still QUEUED -> CANCELLED"
          - "Lines: APPLIED -> ROLLED_BACK; FAILED unchanged; applied_lines recomputed to 0; Batch.version incremented by 1"

  - entity: BatchLine
    initial_state: PENDING
    terminal_states: [ROLLED_BACK]
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "system (batch submit, line passes validation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PENDING
        to: FAILED
        trigger: "system (batch submit, line fails validation; error_id recorded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [VALIDATED, FAILED]
        to: PENDING
        trigger: "system (batch reopen resets all lines)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: APPLIED
        trigger: "system (batch execute applies line)"
        actor: system
        preconditions: []
        side_effects: ["assignment row insert/truncate", "events emitted", "audit entry when sensitive"]
      - from: VALIDATED
        to: FAILED
        trigger: "system (batch execute re-validation fails — e.g. worker terminated or field deprecated between submit and execute)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPLIED
        to: ROLLED_BACK
        trigger: "system (batch rollback compensates line)"
        actor: system
        preconditions: []
        side_effects: ["inserted row VOIDED; truncated row end restored; REVERSAL events"]

  - entity: IntegrationEvent
    initial_state: QUEUED
    terminal_states: [ACKNOWLEDGED, RESOLVED, CANCELLED]
    transitions:
      - from: QUEUED
        to: DISPATCHED
        trigger: "POST /hris/integration-events/{eventId}/dispatch"
        actor: IntegrationOperator
        preconditions:
          - "status == QUEUED (else ERR_EVENT_INVALID_STATE)"
        side_effects:
          - "Immediately resolves per outcome input: ACKNOWLEDGED or FAILED"
      - from: DISPATCHED
        to: ACKNOWLEDGED
        trigger: "system (dispatch outcome == ACKNOWLEDGED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: FAILED
        trigger: "system (dispatch outcome == FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "retry_count += 1"
          - "if retry_count >= MAX_RETRY(3): status := DEAD_LETTERED instead, and an ExceptionRecord(OPEN, integration_event_id set) is opened"
      - from: FAILED
        to: QUEUED
        trigger: "POST /hris/integration-events/{eventId}/retry"
        actor: IntegrationOperator
        preconditions:
          - "status == FAILED and retry_count < MAX_RETRY(3) (else ERR_EVENT_INVALID_STATE)"
        side_effects: []
      - from: DEAD_LETTERED
        to: RESOLVED
        trigger: "POST /hris/integration-events/{eventId}/resolve"
        actor: IntegrationOperator
        preconditions:
          - "status == DEAD_LETTERED (else ERR_EVENT_INVALID_STATE)"
        side_effects: []
      - from: QUEUED
        to: CANCELLED
        trigger: "system (owning batch rolled back before dispatch)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DataQualityRule
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: DISABLED
        trigger: "PATCH /hris/data-quality-rules/{ruleId} (status=DISABLED)"
        actor: DataSteward
        preconditions: []
        side_effects: ["DISABLED rules are skipped by DQ evaluation"]
      - from: DISABLED
        to: ACTIVE
        trigger: "PATCH /hris/data-quality-rules/{ruleId} (status=ACTIVE)"
        actor: DataSteward
        preconditions: []
        side_effects: []

  - entity: ExceptionRecord
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /hris/exception-records/{exceptionId}/resolve"
        actor: DataSteward
        preconditions:
          - "status == OPEN (else ERR_EXCEPTION_NOT_OPEN)"
        side_effects: []
      - from: OPEN
        to: WAIVED
        trigger: "POST /hris/exception-records/{exceptionId}/waive"
        actor: DataSteward
        preconditions:
          - "status == OPEN (else ERR_EXCEPTION_NOT_OPEN)"
          - "waiver_expiry_date <= logical clock date + 90 days (else ERR_WAIVER_WINDOW_EXCEEDED)"
        side_effects: []
      - from: WAIVED
        to: OPEN
        trigger: "system (clock sweep: clock date > waiver_expiry_date)"
        actor: system
        preconditions: []
        side_effects: ["waiver_expiry_date cleared"]

  - entity: SecurityRoleAssignment
    initial_state: REQUESTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /hris/security-role-assignments/{grantId}/approve"
        actor: SecurityAdmin
        preconditions:
          - "status == REQUESTED (else ERR_GRANT_INVALID_STATE)"
          - "caller X-User-ID != grant user_id (else ERR_SELF_APPROVAL_FORBIDDEN)"
          - "no APPROVED/PROVISIONED grant for same user_id holds a conflicting role_code per SOD matrix {(HRIS_ANALYST,CHANGE_APPROVER),(DATA_STEWARD,CHANGE_APPROVER)} (else ERR_SOD_CONFLICT)"
          - "no APPROVED/PROVISIONED grant for same (user_id, role_code) has a closed-interval window overlapping [valid_from, valid_until] (touching endpoints count as overlap; else ERR_GRANT_WINDOW_OVERLAP)"
          - "valid_until >= valid_from (else ERR_INVALID_REQUEST)"
        side_effects:
          - "approved_by := X-User-ID; AuditEntry(action=GRANT_APPROVE)"
          - "if logical clock date >= valid_from: immediately PROVISIONED"
      - from: APPROVED
        to: PROVISIONED
        trigger: "system (clock sweep: clock date >= valid_from and <= valid_until)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROVISIONED
        to: REVOKED
        trigger: "POST /hris/security-role-assignments/{grantId}/revoke"
        actor: SecurityAdmin
        preconditions:
          - "status in {APPROVED, PROVISIONED} (else ERR_GRANT_INVALID_STATE)"
        side_effects: ["AuditEntry(action=GRANT_REVOKE)"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /hris/security-role-assignments/{grantId}/revoke"
        actor: SecurityAdmin
        preconditions:
          - "status in {APPROVED, PROVISIONED}"
        side_effects: ["AuditEntry(action=GRANT_REVOKE)"]
      - from: [APPROVED, PROVISIONED]
        to: EXPIRED
        trigger: "system (clock sweep: clock date > valid_until)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: change-create-stale-worker
    parent_entity: Worker
    write_endpoint: "POST /hris/workers/{workerId}/change-requests"
    occ_field: expected_worker_version
    description: |
      Creating a worker-targeted ChangeRequest against a Worker whose version
      has advanced since the client last observed it is rejected. The new
      request legitimately supersedes same-field pending requests and the
      worker's version advances on every applied mutation, so a client working
      from a stale snapshot must re-read before proposing.
    error_id: ERR_STALE_WORKER_VERSION
    http_status: 412
  - rule_id: position-change-stale-position
    parent_entity: Position
    write_endpoint: "POST /hris/positions/{positionId}/change-requests"
    occ_field: expected_position_version
    description: |
      Creating a position-targeted ChangeRequest against a Position whose
      version has advanced since the client last observed it is rejected;
      hierarchy/attribute proposals must be based on the current tree shape.
    error_id: ERR_STALE_POSITION_VERSION
    http_status: 412
  - rule_id: batch-submit-stale-batch
    parent_entity: MassChangeBatch
    write_endpoint: "POST /hris/mass-change-batches/{batchId}/submit"
    occ_field: expected_batch_version
    description: |
      Submitting a batch whose version has advanced since the client last
      observed it (e.g. another writer added lines, changing what submit would
      validate) is rejected; submission must cover the line set the client
      actually reviewed.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: field_value_as_of
    trigger: "GET /hris/workers/{workerId}/field-history"
    algorithm: projection
    formula: |
      Input: field_id, as_of_date, mode.
      Base row R = the non-VOIDED PositionAssignment row of the worker whose
      half-open interval [effective_start_date, effective_end_date) covers
      as_of_date (effective_end_date null counts as +infinity). If no row
      covers as_of_date, value = null.
      AS_IS: value = R's current stored attribute for the field's field_key.
      AS_WAS: replay AuditEntry rows with action=CORRECT for (worker_id,
      field_id) that targeted R (matched via change_request_id -> ChangeRequest
      .target_row_id == R.id), in created_at ASC order: value = old_value of
      the EARLIEST such audit entry; if none, value = AS_IS value.
      The variants diverge iff >= 1 CORRECT audit entry exists for (R, field).
    input_set: "non-VOIDED PositionAssignment rows of the worker; AuditEntry action=CORRECT for (worker, field)"
    precision: "integer cents / raw string; no rounding"
    variants:
      - name: AS_IS
        when: "mode=AS_IS"
        difference: "current corrected view of history (corrections overwrite)"
      - name: AS_WAS
        when: "mode=AS_WAS"
        difference: "audit-replayed original value (first-recorded value before any correction)"
    constants: {}

  - name: subtree_headcount
    trigger: "GET /hris/positions/{positionId}/subtree-metrics; Position close precondition"
    algorithm: aggregation
    formula: |
      Subtree S = position plus all transitive descendants over
      parent_position_id edges (cycle-free by construction).
      FILLED_ONLY: count of DISTINCT workers holding a PositionAssignment row
      with row_status in {FUTURE-excluded} whose interval covers the logical
      clock date (row_status == ACTIVE) and whose position_id is in S.
      BUDGETED_CAPACITY: sum of headcount_budget over positions in S with
      status == ACTIVE (CLOSED positions contribute 0).
    input_set: "Position subtree; PositionAssignment rows with row_status == ACTIVE"
    precision: "integer"
    variants:
      - name: FILLED_ONLY
        when: "mode=FILLED_ONLY"
        difference: "counts actual workers currently assigned into the subtree"
      - name: BUDGETED_CAPACITY
        when: "mode=BUDGETED_CAPACITY"
        difference: "sums budgeted seats of ACTIVE positions; ignores actual assignments"
    constants: {}

  - name: exception_priority_score
    trigger: "ExceptionRecord creation and every logical-clock advance (age grows)"
    algorithm: weighted_scoring
    formula: |
      age_days = calendar days between exception created_at date and logical
      clock date (0 when same date).
      age_bonus = 0 if age_days < 7; 50 if 7 <= age_days < 30; 150 if age_days >= 30.
      base = SEVERITY_BASE[rule.severity] (WARNING=100, CRITICAL=300); for
      dead-letter-originated exceptions (rule_id null) base = 300.
      mult = SENSITIVITY_MULT[field.sensitivity] (PUBLIC=1, INTERNAL=1,
      CONFIDENTIAL=2, RESTRICTED=3); when field_id null, mult = 1.
      priority_score = min(1000, base * mult + age_bonus).
    input_set: "single ExceptionRecord + linked DataQualityRule + DataField"
    constants:
      WARNING_BASE: 100
      CRITICAL_BASE: 300
      DEAD_LETTER_BASE: 300
      AGE_TIER1_DAYS: 7
      AGE_TIER1_BONUS: 50
      AGE_TIER2_DAYS: 30
      AGE_TIER2_BONUS: 150
      SCORE_CAP: 1000
    precision: "integer"

  - name: batch_total_delta_cents
    trigger: "MassChangeBatch execute (resolved per line, summed for batch)"
    algorithm: aggregation
    formula: |
      Per APPLIED salary line (field_key == assignment.salary_cents):
        if new_value matches '+P%': pct = P / 100;
          new_salary = round_half_up(prior_row_salary_cents * (1 + pct)) to integer cents
        else: new_salary = integer parse of new_value
        resolved_delta_cents = new_salary - prior_row_salary_cents
        where prior_row_salary_cents = salary of the worker's row covering the
        line's effective_date BEFORE this batch's execution.
      PINNED ROUNDING ORDER: round each line individually to integer cents,
      THEN sum the per-line deltas into total_delta_cents. (Sum-then-round is
      forbidden; the two orders diverge, e.g. two 10010-cent salaries at +2.5%
      give 10260 each and total 500 per-line vs 501 sum-then-round.)
    input_set: "APPLIED BatchLines of the batch with salary field_key"
    constants: {}
    precision: "integer cents, round_half_up per line"

  - name: effective_interval_placement
    trigger: "ChangeRequest apply (NEW_RECORD) and batch line application"
    algorithm: interval_merge
    formula: |
      Worker timeline = set of non-VOIDED PositionAssignment rows, half-open
      [effective_start_date, effective_end_date), pairwise non-overlapping.
      For new row at effective_date D:
        1. If any existing row has effective_start_date == D -> reject
           ERR_EFFECTIVE_PERIOD_OVERLAP (exact-start collision; use
           CORRECT_HISTORY or pick another date).
        2. If a row R covers D (R.start < D < (R.end or +inf)): truncate
           R.end := D, insert new row [D, R's old end). Snapshot R's old end
           onto the ChangeRequest (prior_row_end).
        3. If D falls in a gap (no covering row): insert new row
           [D, next row's start or null if none).
        4. Adjacency is legal: an existing row ending exactly at D and a new
           row starting at D do not overlap (half-open semantics).
      Row attribute inheritance: the new row copies the covering row's current
      attribute values, then overwrites the governed attribute with new_value.
      If D is in a gap, non-governed attributes copy from the chronologically
      latest row with effective_start_date < D (created_at ASC tie-break
      cannot occur: starts are unique per rule 1); if none exists, reject
      ERR_INVALID_REQUEST (no baseline).
    input_set: "non-VOIDED PositionAssignment rows of the target worker"
    constants: {}
    precision: "ISO dates, day granularity"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is permitted to call this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist left-to-right; body FK ids (target_field_id, target_row_id, initial_position_id, parent_position_id, rule/field references) exist"
    error_id: "ERR_DATA_FIELD_NOT_FOUND | ERR_POSITION_NOT_FOUND | ERR_WORKER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_CHANGE_REQUEST_NOT_FOUND | ERR_BATCH_NOT_FOUND | ERR_BATCH_LINE_NOT_FOUND | ERR_INTEGRATION_EVENT_NOT_FOUND | ERR_DQ_RULE_NOT_FOUND | ERR_EXCEPTION_NOT_FOUND | ERR_GRANT_NOT_FOUND | ERR_AUDIT_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with resource ids
  - priority: 4
    category: existence
    check: "Malformed body: missing required fields, unparseable enum/date/integer, unknown field_key (not a governable attribute), duplicate worker_number / field_key, termination_date < hire_date, valid_until < valid_from"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST/PATCH endpoints
  - priority: 5
    category: state
    check: "OCC: expected_worker_version / expected_position_version / expected_batch_version equals the parent's current version"
    error_id: "ERR_STALE_WORKER_VERSION | ERR_STALE_POSITION_VERSION | ERR_STALE_BATCH_VERSION"
    http_status: 412
    applies_to: "POST /hris/workers/{id}/change-requests, POST /hris/positions/{id}/change-requests, POST /hris/mass-change-batches/{id}/submit"
  - priority: 6
    category: state
    check: "Resource state precondition for the operation (change-request status, batch status, event status, exception OPEN, grant REQUESTED/APPROVED/PROVISIONED, field ACTIVE, worker ACTIVE, position ACTIVE)"
    error_id: "ERR_REQUEST_INVALID_STATE | ERR_BATCH_NOT_DRAFT | ERR_BATCH_NOT_REOPENABLE | ERR_BATCH_NOT_EXECUTABLE | ERR_BATCH_NOT_ROLLBACKABLE | ERR_EVENT_INVALID_STATE | ERR_EXCEPTION_NOT_OPEN | ERR_GRANT_INVALID_STATE | ERR_FIELD_NOT_ACTIVE | ERR_WORKER_NOT_ACTIVE | ERR_POSITION_NOT_ACTIVE"
    http_status: 409
    applies_to: action endpoints
  - priority: 7
    category: business_safety
    check: "Approval authority: caller holds PROVISIONED CHANGE_APPROVER grant (change approve); caller != created_by and != approver_1_id; grant SoD matrix conflict on grant approve"
    error_id: "ERR_GRANT_NOT_PROVISIONED | ERR_SELF_APPROVAL_FORBIDDEN | ERR_SOD_CONFLICT"
    http_status: 403
    applies_to: "approve endpoints (change requests, grants)"
    note: "ERR_SOD_CONFLICT is http 409; priority group shared: grant provisioned -> self-approval -> SoD ordering within the group"
  - priority: 8
    category: business_safety
    check: "CRITICAL data-quality rules (status ACTIVE) on the target field pass against new_value"
    error_id: ERR_DQ_CRITICAL_VIOLATION
    http_status: 422
    applies_to: "change-request apply, batch submit (line-level), batch execute (line-level)"
  - priority: 9
    category: business_constraint
    check: "Correction-mode policy (APPEND_ONLY forbids CORRECT_HISTORY); interval overlap incl. exact-start collision; grant closed-window overlap; hierarchy cycle; depth <= 10; subtree occupied on close; RESTRICTED field forbidden in batch lines"
    error_id: "ERR_CORRECTION_MODE_NOT_ALLOWED | ERR_EFFECTIVE_PERIOD_OVERLAP | ERR_GRANT_WINDOW_OVERLAP | ERR_HIERARCHY_CYCLE | ERR_HIERARCHY_DEPTH_EXCEEDED | ERR_POSITION_SUBTREE_OCCUPIED | ERR_RESTRICTED_FIELD_IN_BATCH"
    http_status: 409
    applies_to: "apply, grant approve, position create/close/change, batch line add/submit"
    note: "ERR_CORRECTION_MODE_NOT_ALLOWED, ERR_HIERARCHY_DEPTH_EXCEEDED and ERR_RESTRICTED_FIELD_IN_BATCH are http 422"
  - priority: 10
    category: business_temporal
    check: "effective_date within [clock-730d, clock+365d]; position-targeted effective_date >= clock date; waiver_expiry_date <= clock date + 90d; scheduled_effective_date >= clock date"
    error_id: "ERR_EFFECTIVE_DATE_OUT_OF_WINDOW | ERR_WAIVER_WINDOW_EXCEEDED"
    http_status: 422
    applies_to: "apply, position change create, exception waive, batch schedule"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- DataField / dictionary ---
  - method: POST
    path: "/hris/data-fields"
    description: "Create a data-dictionary entry (DRAFT)"
    roles: [DataSteward]
    code: 201
    input: [field_key, display_name, sensitivity, history_policy, "downstream_channels?", owner_team]
    output: DataField
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/hris/data-fields"
    description: "List data fields"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["status?", "sensitivity?", "limit?", "offset?"]
    output: "DataField[]"
    side_effects: []
  - method: GET
    path: "/hris/data-fields/{dataFieldId}"
    description: "Get one data field"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: DataField
    side_effects: []
  - method: POST
    path: "/hris/data-fields/{dataFieldId}/activate"
    description: "Activate a DRAFT data field"
    roles: [DataSteward]
    code: 200
    input: []
    output: DataField
    side_effects: ["status DRAFT -> ACTIVE"]
  - method: POST
    path: "/hris/data-fields/{dataFieldId}/deprecate"
    description: "Deprecate an ACTIVE data field; new references rejected"
    roles: [DataSteward]
    code: 200
    input: []
    output: DataField
    side_effects: ["status ACTIVE -> DEPRECATED"]
  - method: GET
    path: "/hris/data-fields/{dataFieldId}/data-quality-rules"
    description: "List DQ rules for a field (reverse reachability)"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "DataQualityRule[]"
    side_effects: []

  # --- DataQualityRule ---
  - method: POST
    path: "/hris/data-quality-rules"
    description: "Create a DQ rule on an ACTIVE data field"
    roles: [DataSteward]
    code: 201
    input: [target_field_id, rule_type, severity, "param_min?", "param_max?", "param_pattern?"]
    output: DataQualityRule
    side_effects: ["status = ACTIVE"]
  - method: PATCH
    path: "/hris/data-quality-rules/{ruleId}"
    description: "Enable/disable a rule or adjust params"
    roles: [DataSteward]
    code: 200
    input: ["status?", "param_min?", "param_max?", "param_pattern?"]
    output: DataQualityRule
    side_effects: ["status toggle ACTIVE <-> DISABLED"]

  # --- Position ---
  - method: POST
    path: "/hris/positions"
    description: "Create a position; parent must be ACTIVE; resulting depth <= 10"
    roles: [HrisAnalyst]
    code: 201
    input: [title, department, "parent_position_id?", headcount_budget]
    output: Position
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/hris/positions"
    description: "List positions"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["parent_position_id?", "status?", "limit?", "offset?"]
    output: "Position[]"
    side_effects: []
  - method: GET
    path: "/hris/positions/{positionId}"
    description: "Get one position"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: Position
    side_effects: []
  - method: POST
    path: "/hris/positions/{positionId}/close"
    description: "Close a position with empty filled subtree"
    roles: [HrisAnalyst]
    code: 200
    input: []
    output: Position
    side_effects: ["status ACTIVE -> CLOSED"]
  - method: GET
    path: "/hris/positions/{positionId}/subtree-metrics"
    description: "Computed subtree rollup per subtree_headcount calculation"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: [mode]
    output: { mode: string, headcount: integer }
    side_effects: []

  # --- Worker ---
  - method: POST
    path: "/hris/workers"
    description: "Hire a worker; creates the initial PositionAssignment row [hire_date, null)"
    roles: [HrisAnalyst]
    code: 201
    input: [legal_name, worker_number, hire_date, initial_position_id, initial_salary_cents, "initial_pay_grade?", "initial_location_code?"]
    output: Worker
    side_effects:
      - "Initial PositionAssignment row created (change_request_id null); row_status ACTIVE if hire_date <= logical clock date else FUTURE"
      - "status = ACTIVE; version = 1"
  - method: GET
    path: "/hris/workers"
    description: "List workers"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Worker[]"
    side_effects: []
  - method: GET
    path: "/hris/workers/{workerId}"
    description: "Get one worker"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: Worker
    side_effects: []
  - method: POST
    path: "/hris/workers/{workerId}/terminate"
    description: "Terminate a worker; truncates covering row, voids later rows"
    roles: [HrisAnalyst]
    code: 200
    input: [termination_date]
    output: Worker
    side_effects:
      - "status ACTIVE -> TERMINATED; termination_date set; Worker.version incremented by 1"
      - "assignment row covering termination_date truncated; rows starting later VOIDED"
  - method: GET
    path: "/hris/workers/{workerId}/field-history"
    description: "Computed AS_IS / AS_WAS value of a governed field on a date"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: [field_id, as_of_date, mode]
    output: { value: string, row_id: string, mode: string }
    side_effects: []

  # --- PositionAssignment (read-only; mutated via ChangeRequest/terminate) ---
  - method: GET
    path: "/hris/position-assignments"
    description: "List assignment rows"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["worker_id?", "position_id?", "change_request_id?", "row_status?", "limit?", "offset?"]
    output: "PositionAssignment[]"
    side_effects: []
  - method: GET
    path: "/hris/position-assignments/{assignmentId}"
    description: "Get one assignment row"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: PositionAssignment
    side_effects: []

  # --- ChangeRequest ---
  - method: POST
    path: "/hris/workers/{workerId}/change-requests"
    description: "Propose a worker-field change (OCC on worker version); supersedes same-field pending requests"
    roles: [HrisAnalyst]
    code: 201
    input: [target_type, target_field_id, new_value, "effective_date?", "correction_mode?", "target_row_id?", "propagate_correction?", expected_worker_version]
    output: ChangeRequest
    side_effects:
      - "status = PENDING_APPROVAL; created_by := X-User-ID"
      - "same-(worker, field) requests in PENDING_APPROVAL/PARTIALLY_APPROVED -> SUPERSEDED"
      - "increments Worker.version by 1"
  - method: POST
    path: "/hris/positions/{positionId}/change-requests"
    description: "Propose a position field/hierarchy change (OCC on position version)"
    roles: [HrisAnalyst]
    code: 201
    input: [target_type, target_field_id, new_value, effective_date, expected_position_version]
    output: ChangeRequest
    side_effects:
      - "status = PENDING_APPROVAL; created_by := X-User-ID"
      - "same-(position, field) pending requests -> SUPERSEDED"
      - "increments Position.version by 1"
  - method: GET
    path: "/hris/change-requests"
    description: "List change requests"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["target_worker_id?", "target_position_id?", "target_field_id?", "target_row_id?", "status?", "limit?", "offset?"]
    output: "ChangeRequest[]"
    side_effects: []
  - method: GET
    path: "/hris/change-requests/{changeRequestId}"
    description: "Get one change request"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: []
  - method: POST
    path: "/hris/change-requests/{changeRequestId}/approve"
    description: "Approve (dual approval when field sensitivity == RESTRICTED)"
    roles: [ChangeApprover]
    code: 200
    input: []
    output: ChangeRequest
    side_effects: ["PENDING_APPROVAL -> APPROVED, or PENDING_APPROVAL -> PARTIALLY_APPROVED -> APPROVED for RESTRICTED"]
  - method: POST
    path: "/hris/change-requests/{changeRequestId}/reject"
    description: "Reject a pending request"
    roles: [ChangeApprover]
    code: 200
    input: ["reason?"]
    output: ChangeRequest
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/hris/change-requests/{changeRequestId}/apply"
    description: "Apply an APPROVED request: interval machinery + audit + integration events + DQ evaluation"
    roles: [HrisAnalyst]
    code: 200
    input: []
    output: ChangeRequest
    side_effects:
      - "status -> APPLIED; row truncate/insert or in-place correction per correction_mode"
      - "AuditEntry per audit rules; IntegrationEvents per downstream channel; WARNING DQ opens ExceptionRecords"
  - method: POST
    path: "/hris/change-requests/{changeRequestId}/void"
    description: "Compensate an APPLIED request; restores prior row/value, emits REVERSAL events"
    roles: [HrisAnalyst]
    code: 200
    input: ["reason?"]
    output: ChangeRequest
    side_effects: ["status -> VOIDED; inserted row VOIDED + truncated row end restored (NEW_RECORD) or value restored (CORRECT_HISTORY)"]

  # --- MassChangeBatch / BatchLine ---
  - method: POST
    path: "/hris/mass-change-batches"
    description: "Create an empty reorg batch (DRAFT)"
    roles: [HrisAnalyst]
    code: 201
    input: [name]
    output: MassChangeBatch
    side_effects: ["status = DRAFT; counters zero"]
  - method: GET
    path: "/hris/mass-change-batches/{batchId}"
    description: "Get one batch (with computed counters and total_delta_cents)"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: MassChangeBatch
    side_effects: []
  - method: POST
    path: "/hris/mass-change-batches/{batchId}/lines"
    description: "Add a line to a DRAFT batch"
    roles: [HrisAnalyst]
    code: 201
    input: [line_index, target_worker_id, target_field_id, new_value, effective_date, "correction_mode?"]
    output: BatchLine
    side_effects: ["line status = PENDING", "increments MassChangeBatch.version by 1", "total_lines recomputed"]
  - method: GET
    path: "/hris/mass-change-batches/{batchId}/lines"
    description: "List lines of a batch"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "BatchLine[]"
    side_effects: []
  - method: GET
    path: "/hris/batch-lines"
    description: "List batch lines across batches"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["batch_id?", "target_worker_id?", "target_field_id?", "status?", "limit?", "offset?"]
    output: "BatchLine[]"
    side_effects: []
  - method: GET
    path: "/hris/batch-lines/{lineId}"
    description: "Get one batch line"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: BatchLine
    side_effects: []
  - method: POST
    path: "/hris/mass-change-batches/{batchId}/submit"
    description: "Validate all lines (OCC on batch version); batch -> VALIDATED or VALIDATION_FAILED"
    roles: [HrisAnalyst]
    code: 200
    input: [expected_batch_version]
    output: MassChangeBatch
    side_effects: ["per-line PENDING -> VALIDATED/FAILED", "increments MassChangeBatch.version by 1"]
  - method: POST
    path: "/hris/mass-change-batches/{batchId}/reopen"
    description: "Reopen a VALIDATION_FAILED batch; all lines reset to PENDING"
    roles: [HrisAnalyst]
    code: 200
    input: []
    output: MassChangeBatch
    side_effects: ["status -> DRAFT", "lines -> PENDING", "increments MassChangeBatch.version by 1"]
  - method: POST
    path: "/hris/mass-change-batches/{batchId}/schedule"
    description: "Schedule a VALIDATED batch for an effective date"
    roles: [HrisAnalyst]
    code: 200
    input: [scheduled_effective_date]
    output: MassChangeBatch
    side_effects: ["status -> SCHEDULED", "increments MassChangeBatch.version by 1"]
  - method: POST
    path: "/hris/mass-change-batches/{batchId}/execute"
    description: "Execute a SCHEDULED batch: sequential line re-validation + application"
    roles: [HrisAnalyst]
    code: 200
    input: []
    output: MassChangeBatch
    side_effects: ["lines VALIDATED -> APPLIED/FAILED", "batch -> COMPLETED or COMPLETED_WITH_ERRORS", "events/audit/exceptions emitted", "increments MassChangeBatch.version by 1"]
  - method: POST
    path: "/hris/mass-change-batches/{batchId}/rollback"
    description: "Compensate all APPLIED lines of a COMPLETED_WITH_ERRORS batch"
    roles: [HrisAnalyst]
    code: 200
    input: []
    output: MassChangeBatch
    side_effects: ["APPLIED lines -> ROLLED_BACK", "QUEUED events -> CANCELLED", "REVERSAL events emitted", "increments MassChangeBatch.version by 1"]

  # --- IntegrationEvent ---
  - method: GET
    path: "/hris/integration-events"
    description: "List integration events (error queue)"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["worker_id?", "change_request_id?", "batch_id?", "channel?", "status?", "limit?", "offset?"]
    output: "IntegrationEvent[]"
    side_effects: []
  - method: GET
    path: "/hris/integration-events/{eventId}"
    description: "Get one integration event"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: IntegrationEvent
    side_effects: []
  - method: POST
    path: "/hris/integration-events/{eventId}/dispatch"
    description: "Dispatch a QUEUED event; outcome input deterministically settles ACKNOWLEDGED or FAILED (3rd failure dead-letters)"
    roles: [IntegrationOperator]
    code: 200
    input: [outcome]
    output: IntegrationEvent
    side_effects: ["QUEUED -> DISPATCHED -> ACKNOWLEDGED | FAILED | DEAD_LETTERED", "DEAD_LETTERED opens an ExceptionRecord"]
  - method: POST
    path: "/hris/integration-events/{eventId}/retry"
    description: "Requeue a FAILED event while retry_count < 3"
    roles: [IntegrationOperator]
    code: 200
    input: []
    output: IntegrationEvent
    side_effects: ["FAILED -> QUEUED"]
  - method: POST
    path: "/hris/integration-events/{eventId}/resolve"
    description: "Manually resolve a DEAD_LETTERED event"
    roles: [IntegrationOperator]
    code: 200
    input: [resolution_note]
    output: IntegrationEvent
    side_effects: ["DEAD_LETTERED -> RESOLVED"]

  # --- ExceptionRecord ---
  - method: GET
    path: "/hris/exception-records"
    description: "List data-quality / dead-letter exceptions"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["rule_id?", "change_request_id?", "batch_id?", "worker_id?", "field_id?", "status?", "limit?", "offset?"]
    output: "ExceptionRecord[]"
    side_effects: []
  - method: GET
    path: "/hris/exception-records/{exceptionId}"
    description: "Get one exception record"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: ExceptionRecord
    side_effects: []
  - method: POST
    path: "/hris/exception-records/{exceptionId}/resolve"
    description: "Resolve an OPEN exception"
    roles: [DataSteward]
    code: 200
    input: [resolution_note]
    output: ExceptionRecord
    side_effects: ["OPEN -> RESOLVED"]
  - method: POST
    path: "/hris/exception-records/{exceptionId}/waive"
    description: "Waive an OPEN exception until an expiry date (<= clock + 90d)"
    roles: [DataSteward]
    code: 200
    input: [waiver_expiry_date, "resolution_note?"]
    output: ExceptionRecord
    side_effects: ["OPEN -> WAIVED"]

  # --- SecurityRoleAssignment ---
  - method: POST
    path: "/hris/security-role-assignments"
    description: "Request a security role grant for an operator"
    roles: [SecurityAdmin]
    code: 201
    input: [user_id, role_code, "scope_department?", valid_from, valid_until]
    output: SecurityRoleAssignment
    side_effects: ["status = REQUESTED"]
  - method: GET
    path: "/hris/security-role-assignments"
    description: "List role grants"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["user_id?", "role_code?", "status?", "limit?", "offset?"]
    output: "SecurityRoleAssignment[]"
    side_effects: []
  - method: POST
    path: "/hris/security-role-assignments/{grantId}/approve"
    description: "Approve a grant (SoD + window-overlap + self-approval checks); PROVISIONED at once when valid_from reached"
    roles: [SecurityAdmin]
    code: 200
    input: []
    output: SecurityRoleAssignment
    side_effects: ["REQUESTED -> APPROVED (-> PROVISIONED when clock >= valid_from)", "AuditEntry(GRANT_APPROVE)"]
  - method: POST
    path: "/hris/security-role-assignments/{grantId}/revoke"
    description: "Revoke an APPROVED/PROVISIONED grant"
    roles: [SecurityAdmin]
    code: 200
    input: ["reason?"]
    output: SecurityRoleAssignment
    side_effects: ["-> REVOKED", "AuditEntry(GRANT_REVOKE)"]

  # --- AuditEntry (append-only) ---
  - method: GET
    path: "/hris/audit-entries"
    description: "List audit entries"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: ["worker_id?", "field_id?", "change_request_id?", "batch_id?", "limit?", "offset?"]
    output: "AuditEntry[]"
    side_effects: []
  - method: GET
    path: "/hris/audit-entries/{auditEntryId}"
    description: "Get one audit entry"
    roles: [HrisAnalyst, DataSteward, ChangeApprover, IntegrationOperator, SecurityAdmin]
    code: 200
    input: []
    output: AuditEntry
    side_effects: []

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any call the clock reads this default and never the wall clock. Each set sweeps time-driven transitions: assignment row_status derivation, grant APPROVED->PROVISIONED / *->EXPIRED, waiver expiry reopen, scheduled batch auto-execute, scheduled position-change application, exception priority_score recompute."
    roles: [SecurityAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all time-driven transitions in §1.2 re-evaluated"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed enum/date/integer, unknown field_key, duplicate worker_number/field_key, termination_date < hire_date, valid_until < valid_from" }
  - { id: ERR_DATA_FIELD_NOT_FOUND, http: 404, condition: "DataField id does not exist" }
  - { id: ERR_POSITION_NOT_FOUND, http: 404, condition: "Position id does not exist" }
  - { id: ERR_WORKER_NOT_FOUND, http: 404, condition: "Worker id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "PositionAssignment id does not exist (incl. target_row_id references)" }
  - { id: ERR_CHANGE_REQUEST_NOT_FOUND, http: 404, condition: "ChangeRequest id does not exist" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "MassChangeBatch id does not exist" }
  - { id: ERR_BATCH_LINE_NOT_FOUND, http: 404, condition: "BatchLine id does not exist" }
  - { id: ERR_INTEGRATION_EVENT_NOT_FOUND, http: 404, condition: "IntegrationEvent id does not exist" }
  - { id: ERR_DQ_RULE_NOT_FOUND, http: 404, condition: "DataQualityRule id does not exist" }
  - { id: ERR_EXCEPTION_NOT_FOUND, http: 404, condition: "ExceptionRecord id does not exist" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "SecurityRoleAssignment id does not exist" }
  - { id: ERR_AUDIT_ENTRY_NOT_FOUND, http: 404, condition: "AuditEntry id does not exist" }
  - { id: ERR_STALE_WORKER_VERSION, http: 412, condition: "expected_worker_version != Worker.version" }
  - { id: ERR_STALE_POSITION_VERSION, http: 412, condition: "expected_position_version != Position.version" }
  - { id: ERR_STALE_BATCH_VERSION, http: 412, condition: "expected_batch_version != MassChangeBatch.version" }
  - { id: ERR_FIELD_NOT_ACTIVE, http: 409, condition: "DataField not in required state (activate/deprecate from wrong state; reference to non-ACTIVE field on create/apply)" }
  - { id: ERR_WORKER_NOT_ACTIVE, http: 409, condition: "Worker not ACTIVE for terminate/apply/batch-line validation" }
  - { id: ERR_POSITION_NOT_ACTIVE, http: 409, condition: "Position not ACTIVE (close from CLOSED; parent/inheritance target CLOSED)" }
  - { id: ERR_REQUEST_INVALID_STATE, http: 409, condition: "ChangeRequest not in a status permitting approve/reject/apply/void, or a later APPLIED change blocks void" }
  - { id: ERR_BATCH_NOT_DRAFT, http: 409, condition: "Line add or submit requires batch DRAFT" }
  - { id: ERR_BATCH_NOT_REOPENABLE, http: 409, condition: "Reopen requires VALIDATION_FAILED" }
  - { id: ERR_BATCH_NOT_EXECUTABLE, http: 409, condition: "Schedule requires VALIDATED; execute requires SCHEDULED" }
  - { id: ERR_BATCH_NOT_ROLLBACKABLE, http: 409, condition: "Rollback requires COMPLETED_WITH_ERRORS" }
  - { id: ERR_EVENT_INVALID_STATE, http: 409, condition: "Dispatch requires QUEUED; retry requires FAILED with retry_count < 3; resolve requires DEAD_LETTERED" }
  - { id: ERR_EXCEPTION_NOT_OPEN, http: 409, condition: "Resolve/waive requires OPEN" }
  - { id: ERR_GRANT_INVALID_STATE, http: 409, condition: "Approve requires REQUESTED; revoke requires APPROVED/PROVISIONED" }
  - { id: ERR_GRANT_NOT_PROVISIONED, http: 403, condition: "Change-request approve without a PROVISIONED CHANGE_APPROVER grant for X-User-ID" }
  - { id: ERR_SELF_APPROVAL_FORBIDDEN, http: 403, condition: "Approver equals created_by / approver_1_id (dual), or grant approver equals grant user_id" }
  - { id: ERR_SOD_CONFLICT, http: 409, condition: "Grant would give one user both roles of a conflicting pair {(HRIS_ANALYST,CHANGE_APPROVER),(DATA_STEWARD,CHANGE_APPROVER)}" }
  - { id: ERR_GRANT_WINDOW_OVERLAP, http: 409, condition: "Same (user_id, role_code) grant with closed-interval window overlap; touching endpoints count as overlap" }
  - { id: ERR_EFFECTIVE_PERIOD_OVERLAP, http: 409, condition: "New effective-dated row collides with an existing row start (exact-start equality)" }
  - { id: ERR_CORRECTION_MODE_NOT_ALLOWED, http: 422, condition: "DataField.history_policy == APPEND_ONLY and correction_mode == CORRECT_HISTORY (or CORRECT_HISTORY requested without target_row_id)" }
  - { id: ERR_HIERARCHY_CYCLE, http: 409, condition: "Position hierarchy change would create a cycle (new parent is self or a descendant)" }
  - { id: ERR_HIERARCHY_DEPTH_EXCEEDED, http: 422, condition: "Create/move would produce a reporting chain deeper than 10 levels" }
  - { id: ERR_POSITION_SUBTREE_OCCUPIED, http: 409, condition: "Close attempted while FILLED_ONLY subtree headcount > 0" }
  - { id: ERR_DQ_CRITICAL_VIOLATION, http: 422, condition: "An ACTIVE CRITICAL data-quality rule rejects new_value" }
  - { id: ERR_EFFECTIVE_DATE_OUT_OF_WINDOW, http: 422, condition: "effective_date outside [clock-730d, clock+365d]; or position change effective_date < clock date; or scheduled_effective_date < clock date" }
  - { id: ERR_WAIVER_WINDOW_EXCEEDED, http: 422, condition: "waiver_expiry_date > logical clock date + 90 days" }
  - { id: ERR_RESTRICTED_FIELD_IN_BATCH, http: 422, condition: "Batch line references a RESTRICTED-sensitivity field (dual approval cannot be bypassed via mass change)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HrisAnalyst
    description: "HRIS operations analyst; drafts changes, manages org structure and reorg batches"
    identity: opaque
    exclusive_operations:
      - "POST /hris/positions, POST /hris/positions/{id}/close"
      - "POST /hris/workers, POST /hris/workers/{id}/terminate"
      - "POST /hris/workers/{id}/change-requests, POST /hris/positions/{id}/change-requests"
      - "POST /hris/change-requests/{id}/apply, POST /hris/change-requests/{id}/void"
      - "All /hris/mass-change-batches and /hris/batch-lines write endpoints"
    shared_operations: ["All GET endpoints"]
  - name: DataSteward
    description: "Owns data dictionary, DQ rules, and exception handling"
    identity: opaque
    exclusive_operations:
      - "POST /hris/data-fields, activate, deprecate"
      - "POST /hris/data-quality-rules, PATCH /hris/data-quality-rules/{id}"
      - "POST /hris/exception-records/{id}/resolve, waive"
    shared_operations: ["All GET endpoints"]
  - name: ChangeApprover
    description: "Approves/rejects change requests; must also hold a PROVISIONED CHANGE_APPROVER grant (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /hris/change-requests/{id}/approve"
      - "POST /hris/change-requests/{id}/reject"
    shared_operations: ["All GET endpoints"]
  - name: IntegrationOperator
    description: "Runs the downstream integration error queue"
    identity: opaque
    exclusive_operations:
      - "POST /hris/integration-events/{id}/dispatch"
      - "POST /hris/integration-events/{id}/retry"
      - "POST /hris/integration-events/{id}/resolve"
    shared_operations: ["All GET endpoints"]
  - name: SecurityAdmin
    description: "Provisions security role grants and operates the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /hris/security-role-assignments, approve, revoke"
      - "POST /_clock/set_current_utc"
    shared_operations: ["All GET endpoints"]
