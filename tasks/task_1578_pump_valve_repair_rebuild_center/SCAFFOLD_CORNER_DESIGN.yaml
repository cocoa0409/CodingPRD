            - "at 31 days: error_id == ERR_WARRANTY_NOT_ELIGIBLE (planned [09-20, 09-25] avoids the closed-interval overlap with RO2 so the warranty rule is what fires)"
            - "same late window but different asset (P-2802): error_id == ERR_WARRANTY_NOT_ELIGIBLE"

