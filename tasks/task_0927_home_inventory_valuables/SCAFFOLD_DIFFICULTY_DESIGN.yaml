  - rule_id: cross_entity_state_dependency
    instances:
      - name: item_asset_upload_gated_by_subscription_status_but_claim_intake_is_not
        grounds:
          - validations[priority=10]
          - state_machines.Subscription.status.PAST_DUE_to_LAPSED
          - state_machines.Subscription.status.LAPSED_to_ACTIVE
          - state_machines.Household.write_gate_state.READ_ONLY_to_OPEN
          - errors[ERR_VAULT_READ_ONLY]
        distinguishing_aspect: |
          Cross-entity pair Item -> Subscription: an Item mutation is legal only while
          the household's Subscription is not LAPSED, yet POST /vault/claims sits on
          WRITE_GATE_EXCLUSION_LIST and stays legal in exactly the same state, so the
          gate is proven to be endpoint-selective rather than a blanket freeze.
        test_recipe:
          setup:
            - "A PLUS household with rooms A and B and one CATALOGED item in room A."
            - "A GENERATED package created while the subscription was ACTIVE."
            - "The subscription is driven ACTIVE -> PAST_DUE -> LAPSED, so write_gate_state is READ_ONLY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
