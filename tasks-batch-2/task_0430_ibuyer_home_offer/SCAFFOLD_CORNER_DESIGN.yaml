  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_offers_for_property_returns_current_and_superseded
        claim_type: Computed read
        grounds:
          - endpoints[GET /properties/{id}/offers]
          - state_machines.Offer.ISSUED_to_SUPERSEDED
        distinguishing_aspect: "After one re-issue, GET /properties/{id}/offers returns 2 offers (one SUPERSEDED, one ISSUED) as an array."
        test_recipe:
          setup:
            - "Property with one offer, then a re-issue (2 offers total)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "c20@x.com", full_name: "C Twenty" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "119 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: PricingAnalyst
              captures: { prop_v: $.data.version }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05, expected_property_version: "${prop_v}" }
              as: PricingAnalyst
          trigger:
            - call: "GET /properties/${prop_id}/offers"
              payload: {}
              as: PricingAnalyst
          assert:
            - "response is an array of length 2"
            - "exactly one offer has status==SUPERSEDED and one has status==ISSUED"

      - name: list_properties_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /properties]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /properties?limit=1&offset=0 with 2 properties returns 1 item plus pagination meta total_count=2, has_more=true."
        test_recipe:
          setup:
            - "Two properties exist for one seller."
          setup_api_calls:
            - call: "POST /sellers"
              payload: { email: "c21@x.com", full_name: "C Twentyone" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "120 Oak", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000 }
              as: PricingAnalyst
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "121 Oak", zip_code: "90001", bedrooms: 2, living_area_sqft: 1200, comp_median_value: 300000 }
              as: PricingAnalyst
          trigger:
            - call: "GET /properties"
              payload: { seller_id: "${seller_id}", limit: 1, offset: 0 }
              as: PricingAnalyst
          assert:
            - "response data array length == 1"
            - "pagination total_count == 2"
            - "pagination has_more == true"

