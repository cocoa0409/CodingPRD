            - call: "POST /work-orders"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_a}", bay_id: "${bay_id}", package_id: "${pkg_id}", odometer_in: 8000 }
              as: ServiceAdvisor
              captures: { wo_a: $.data.id }
            - call: "POST /queue-tickets"
              payload: { shop_id: "${shop_id}", vehicle_id: "${veh_b}", requested_package_id: "${pkg_id}" }
              as: ServiceAdvisor
              captures: { tkt_b: $.data.id }
            - call: "POST /work-orders/${wo_a}/claim"
              payload: { technician_id: "${tech_id}" }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/mark-ready"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/authorize"
              payload: { payment_method: "CASH" }
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_a}/capture-payment"
              payload: {}
              as: ServiceAdvisor
          trigger:
            - call: "POST /work-orders/${wo_a}/complete"
              payload: {}
              as: ServiceAdvisor
            - call: "GET /queue-tickets/${tkt_b}"
              payload: {}
              as: ServiceAdvisor
