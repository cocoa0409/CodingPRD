            - "first call returns HTTP 422 with ${err_both} == ERR_ANTITRUST_NEGOTIATION_PROHIBITED (priority 9 business_safety, checked before every other business rule)"
            - "${err_both} != ERR_POLICY_NOT_PUBLISHED (the lower-priority business_referential defect must not be reported)"
            - "second call returns ${err_control} == ERR_POLICY_NOT_PUBLISHED (priority 10), confirming that defect was present during the first call too"
            - "Violation.${v_id}.status == DETECTED and Violation.${v_id}.assessed_points == null"
            - "Reseller.${rs_id}.violation_points_total == 0 and Reseller.${rs_id}.version == ${rs_v} (both rejections are side-effect free)"
            - "GET /enforcement-notices with reseller_id=${rs_id} returns total_count == 0"

      - name: stale_distributor_version_outranks_chargeback_cap_rejected
        grounds:
          - validations[priority=8]
          - validations[priority=13]
