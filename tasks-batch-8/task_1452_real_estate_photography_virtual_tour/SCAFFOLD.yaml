scenario: |
  Real Estate Photography & Virtual Tour Production (real estate media company): shoot booking with property readiness checklist, photographer assignment by market & equipment package, weather/reschedule policy, editing turnaround & delivery of asset bundle, twilight/drone add-ons & airspace authorization, virtual tour hosting & branded/unbranded versions, licensing terms & post-sale usage, revision requests & quality guarantee

domain_name: real-estate-media
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: market_code, type: string, source: input, description: "Unique short code, e.g. 'ATX', 'DEN'", constraints: "unique across Markets; uppercase alphanumeric + dash, 2–12 chars" }
      - { name: display_name, type: string, source: input, description: "Human-readable market name" }
      - { name: pricing_multiplier_bps, type: integer, source: input, description: "Market pricing multiplier in basis points applied to base rate card, e.g. 12500 = 1.25x", constraints: "5000..30000" }
      - { name: standard_turnaround_hours, type: integer, source: input, description: "Base editing turnaround in whole hours for this market", constraints: "12..120" }
      - { name: twilight_slot_minutes, type: integer, source: input, description: "Length of a single twilight shoot slot in this market", default: 60, constraints: "30..120, multiple of 15" }
      - { name: travel_buffer_minutes, type: integer, source: input, description: "Minimum gap between back-to-back shoots for the same photographer in this market", default: 45, constraints: "0..180" }
      - { name: weather_reschedule_credit_bps, type: integer, source: input, description: "Credit granted on weather reschedule, basis points of the booking's provisional_quote_cents", default: 1000, constraints: "0..5000" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "new Markets start ACTIVE" }

  - name: Photographer
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; photographer's home market" }
      - { name: full_name, type: string, source: input, description: "Photographer display name" }
      - { name: email, type: string, source: input, description: "Login / contact email", constraints: "unique across Photographers" }
      - { name: equipment_packages, type: array, source: input, description: "Equipment packages this photographer can shoot; subset of {STANDARD, PREMIUM, LUXURY}; drone work additionally requires drone_certified=true", constraints: "non-empty array of enum" }
      - { name: drone_certified, type: boolean, source: input, default: false, description: "Whether photographer holds Part 107 certification required for any drone add-on" }
      - { name: max_shoot_minutes_per_day, type: integer, source: input, default: 480, description: "Hard cap on committed shoot minutes per UTC calendar day", constraints: "60..720" }
      - { name: committed_minutes_by_day, type: object, source: computed, description: "Map of 'YYYY-MM-DD' -> total committed (non-cancelled) shoot minutes for that day; recomputed on every assignment change" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", constraints: "new Photographers start ACTIVE; INACTIVE photographers refuse new assignments" }

  - name: ShootBooking
    parent: null
    common_fields: true
    fields:
      - { name: order_ref, type: string, source: input, description: "Client-facing order reference", constraints: "unique across ShootBookings" }
      - { name: client_agent_id, type: string, source: input, description: "FK -> ClientAgent.id; the ordering agent" }
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; market where the property sits" }
      - { name: property_address, type: string, source: input, description: "Street address of the property" }
      - { name: equipment_package, type: enum, source: input, description: "STANDARD | PREMIUM | LUXURY; drives base rate and required photographer equipment" }
      - { name: photo_count, type: integer, source: input, description: "Contracted edited-photo count", constraints: "10..100" }
      - { name: wants_virtual_tour, type: boolean, source: input, default: false, description: "Whether a hosted virtual tour is part of the order" }
      - { name: tour_variant, type: enum, source: input, default: null, description: "BRANDED | UNBRANDED; required iff wants_virtual_tour=true; UNBRANDED requires the booking's license_tier to be MLS_COMPLIANT at acceptance time (gate enforced on accept, not on create or deliver)" }
      - { name: license_tier, type: enum, source: input, default: "MLS_COMPLIANT", description: "MLS_COMPLIANT | STANDARD_MARKETING | EXTENDED; chosen at booking, upgradeable until delivery acceptance" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Committed shoot start instant (UTC). Must land on a quarter-hour boundary." }
      - { name: scheduled_end_utc, type: datetime, source: computed, description: "scheduled_start_utc + shoot_duration_minutes + add-on minutes; recomputed whenever add-ons change" }
      - { name: shoot_duration_minutes, type: integer, source: computed, description: "Base shoot length derived from equipment_package + photo_count via shoot_duration rule" }
      - { name: is_twilight, type: boolean, source: input, default: false, description: "Whether the shoot is booked into the market's twilight window; twilight bookings occupy exactly one twilight_slot_minutes slot" }
      - { name: state, type: enum, source: system, description: "DRAFT | AWAITING_READINESS | READY | ASSIGNED | AUTHORIZATION_PENDING | CONFIRMED | SHOT | IN_EDIT | DELIVERED | REVISION_REQUESTED | ACCEPTED | CANCELLED_BY_CLIENT | CANCELLED_WEATHER | EXPIRED" }
      - { name: assigned_photographer_id, type: string, source: system, description: "FK -> Photographer.id; set when state enters ASSIGNED, cleared back to null if assignment is revoked" , default: null }
      - { name: provisional_quote_cents, type: integer, source: computed, description: "Quote computed at booking time from market rate card; locked when state leaves DRAFT" }
      - { name: final_invoice_cents, type: integer, source: computed, description: "Final invoice computed at delivery acceptance; null until then", default: null }
      - { name: weather_credit_cents, type: integer, source: computed, description: "Accumulated weather-reschedule credits; applied against final invoice", default: 0 }
      - { name: reschedule_count, type: integer, source: computed, description: "Number of weather/client reschedules consumed; hard cap 3", default: 0 }
      - { name: delivery_due_utc, type: datetime, source: computed, description: "Deadline for the AssetBundle delivery; recomputed from turnaround rule whenever shoot completes or a weather reschedule lands" , default: null }
      - { name: delivered_at_utc, type: datetime, source: system, description: "Instant the AssetBundle transitioned to DELIVERED; null until first delivery", default: null }
      - { name: revision_window_closes_utc, type: datetime, source: computed, description: "delivered_at_utc + 72h; null until first delivery; revisions received strictly before this instant are accepted", default: null }
      - { name: revisions_used, type: integer, source: computed, description: "Count of consumed revision rounds; quality guarantee grants 2 free rounds", default: 0 }
      - { name: version, type: integer, source: system, description: "OCC field — incremented on every ShootBooking mutation" }

  - name: ClientAgent
    parent: null
    common_fields: true
    fields:
      - { name: brokerage_name, type: string, source: input, description: "Brokerage the agent belongs to" }
      - { name: full_name, type: string, source: input, description: "Agent display name" }
      - { name: email, type: string, source: input, description: "Agent contact email", constraints: "unique across ClientAgents" }
      - { name: home_market_id, type: string, source: input, description: "FK -> Market.id" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Prepaid credit ledger; weather credits and refunds accrue here when refund_destination=CREDIT", default: 0 }

  - name: ReadinessChecklistItem
    parent: ShootBooking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> ShootBooking.id" }
      - { name: item_key, type: string, source: input, description: "Stable key, e.g. 'DECLUTTER_MAIN', 'UTILITIES_ON', 'PETS_SECURED', 'ACCESS_CODES'" }
      - { name: required, type: boolean, source: input, default: true, description: "Required items must all be checked before booking can leave AWAITING_READINESS" }
      - { name: checked, type: boolean, source: input, default: false, description: "Set true by the ClientAgent when the property condition is met" }
      - { name: checked_at_utc, type: datetime, source: system, description: "Server-stamped when checked flips false -> true; cleared on reset", default: null }

  - name: AddOn
    parent: ShootBooking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> ShootBooking.id" }
      - { name: kind, type: enum, source: input, description: "TWILIGHT_UPGRADE | DRONE_STILLS | DRONE_VIDEO | RUSH_EDIT | VIRTUAL_STAGING" }
      - { name: state, type: enum, source: system, description: "PENDING | ACTIVE | CANCELLED | REFUSED", constraints: "PENDING on create; ACTIVE after pricing/authorization; CANCELLED on cascade; REFUSED when authorization denied" }
      - { name: price_cents, type: integer, source: computed, description: "Add-on price resolved from rate card at activation" }
      - { name: extra_minutes, type: integer, source: computed, description: "Additional scheduled minutes this add-on contributes to the shoot window (0 for RUSH_EDIT and VIRTUAL_STAGING)" }

  - name: AirspaceAuthorization
    parent: ShootBooking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> ShootBooking.id" }
      - { name: addon_id, type: string, source: input, description: "FK -> AddOn.id; the drone add-on this authorization covers" }
      - { name: window_start_utc, type: datetime, source: computed, description: "Copied from booking.scheduled_start_utc at submission; re-stamped on resubmit" }
      - { name: window_end_utc, type: datetime, source: computed, description: "Copied from booking.scheduled_end_utc at submission; re-stamped on resubmit" }
      - { name: state, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | EXPIRED | CANCELLED" }
      - { name: attempt_number, type: integer, source: computed, description: "1 for initial submission; +1 per resubmit; hard cap 3", default: 1 }
      - { name: decided_at_utc, type: datetime, source: system, description: "Server timestamp of last decision", default: null }

  - name: AssetBundle
    parent: ShootBooking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> ShootBooking.id" }
      - { name: state, type: enum, source: system, description: "EDITING | DELIVERED | SUPERSEDED | FINALIZED" }
      - { name: photo_asset_count, type: integer, source: input, description: "Number of edited photos in this bundle; must be >= booking.photo_count to deliver (quality guarantee)" }
      - { name: tour_asset_url, type: string, source: input, default: null, description: "URL of the rendered tour; required iff booking.wants_virtual_tour=true at delivery" }
      - { name: delivered_at_utc, type: datetime, source: system, description: "Server timestamp of transition to DELIVERED", default: null }
      - { name: round_number, type: integer, source: computed, description: "1 for initial delivery; +1 for each revision redelivery", default: 1 }

  - name: RevisionRequest
    parent: ShootBooking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> ShootBooking.id" }
      - { name: bundle_id, type: string, source: input, description: "FK -> AssetBundle.id; the bundle being revised" }
      - { name: notes, type: string, source: input, description: "Client revision instructions" }
      - { name: state, type: enum, source: system, description: "OPEN | IN_PROGRESS | RESOLVED | REJECTED_LATE | REJECTED_EXHAUSTED" }
      - { name: is_free, type: boolean, source: computed, description: "True while revisions_used < 2 at the time the revision is opened; paid revisions beyond that are priced via paid_revision_fee_cents" }
      - { name: fee_cents, type: integer, source: computed, description: "0 when is_free; otherwise paid revision fee from rate card", default: 0 }

  - name: VirtualTour
    parent: ShootBooking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> ShootBooking.id" }
      - { name: variant, type: enum, source: system, description: "BRANDED | UNBRANDED — copied from booking.tour_variant at creation" }
      - { name: state, type: enum, source: system, description: "HOSTED | PUBLISHED | SUSPENDED | UNPUBLISHED" }
      - { name: hosted_url, type: string, source: system, description: "Public hosting URL minted at creation" }
      - { name: published_at_utc, type: datetime, source: system, description: "Null until PUBLISHED", default: null }

  - name: LicenseGrant
    parent: ShootBooking
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> ShootBooking.id" }
      - { name: tier, type: enum, source: system, description: "MLS_COMPLIANT | STANDARD_MARKETING | EXTENDED — copied from booking.license_tier at activation" }
      - { name: state, type: enum, source: system, description: "DORMANT | ACTIVE | SUSPENDED | REVOKED" }
      - { name: activated_at_utc, type: datetime, source: system, description: "Set when state enters ACTIVE (on delivery acceptance)", default: null }
      - { name: fee_cents, type: integer, source: computed, description: "License fee resolved at activation from tier + tour_variant; UNBRANDED tours carry an unbranded_surcharge" }

  - name: RescheduleEvent
    parent: ShootBooking
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> ShootBooking.id" }
      - { name: kind, type: enum, source: input, description: "WEATHER | CLIENT" }
      - { name: old_start_utc, type: datetime, source: system, description: "Previous scheduled_start_utc" }
      - { name: new_start_utc, type: datetime, source: input, description: "Replacement scheduled_start_utc (quarter-hour aligned, future)" }
      - { name: reason_code, type: enum, source: input, description: "WEATHER: PRECIPITATION | WIND | LOW_LIGHT; CLIENT: SELLER_DELAY | ACCESS_ISSUE | STAGING_DELAY" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Weather credit applied on this event (0 for CLIENT kind)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ShootBooking
    initial_state: DRAFT
    terminal_states: [ACCEPTED, CANCELLED_BY_CLIENT, CANCELLED_WEATHER, EXPIRED]
    transitions:
      - from: DRAFT
        to: AWAITING_READINESS
        trigger: "POST /shoot-bookings/{id}/submit"
        actor: ClientAgent
        preconditions:
          - "Booking must be in DRAFT (ERR_BOOKING_NOT_IN_DRAFT)"
          - "Owning ClientAgent must match X-User-ID (ERR_FORBIDDEN)"
          - "Market must be ACTIVE (ERR_MARKET_SUSPENDED)"
          - "scheduled_start_utc must be >= now + 24h (ERR_SLOT_TOO_SOON)"
        side_effects:
          - "provisional_quote_cents locked via provisional_quote calculation"
          - "Server creates the five default ReadinessChecklistItems (DECLUTTER_MAIN, UTILITIES_ON, PETS_SECURED, ACCESS_CODES, EXTERIOR_CLEAR), all required=true, checked=false"
          - "Increments ShootBooking.version"

      - from: AWAITING_READINESS
        to: READY
        trigger: "system (automatic when every required ReadinessChecklistItem on the booking has checked=true)"
        actor: system
        preconditions:
          - "All ReadinessChecklistItems with required=true on this booking have checked=true"
        side_effects:
          - "Increments ShootBooking.version"

      - from: READY
        to: ASSIGNED
        trigger: "POST /shoot-bookings/{id}/assign"
        actor: Coordinator
        preconditions:
          - "Booking must be READY (ERR_BOOKING_NOT_READY)"
          - "Body photographer_id must reference an ACTIVE Photographer in booking.market_id (ERR_PHOTOGRAPHER_NOT_ELIGIBLE)"
          - "Photographer.equipment_packages must contain booking.equipment_package (ERR_EQUIPMENT_MISMATCH)"
          - "If any ACTIVE drone AddOn exists (DRONE_STILLS | DRONE_VIDEO), photographer.drone_certified must be true (ERR_DRONE_CERT_REQUIRED)"
          - "Photographer temporal overlap check passes for [scheduled_start_utc, scheduled_end_utc) with market.travel_buffer_minutes on both sides (ERR_PHOTOGRAPHER_DOUBLE_BOOKED)"
          - "Photographer committed minutes for the scheduled UTC day + (scheduled_end_utc - scheduled_start_utc) <= photographer.max_shoot_minutes_per_day (ERR_DAY_CAPACITY_EXCEEDED)"
        side_effects:
          - "assigned_photographer_id set; Photographer.committed_minutes_by_day for the day increased by shoot minutes"
          - "If any AddOn in {DRONE_STILLS, DRONE_VIDEO} is ACTIVE on the booking: server creates AirspaceAuthorization (state PENDING, attempt_number=1, window = scheduled window) and booking transitions implicitly through AUTHORIZATION_PENDING — see AUTHORIZATION_PENDING state"
          - "Increments ShootBooking.version and Photographer.version"

      - from: ASSIGNED
        to: AUTHORIZATION_PENDING
        trigger: "system (automatic when an ACTIVE drone AddOn exists at assign time or is added while ASSIGNED)"
        actor: system
        preconditions: []
        side_effects:
          - "AirspaceAuthorization created in PENDING with window = booking window"

      - from: CONFIRMED
        to: AUTHORIZATION_PENDING
        trigger: "system (automatic when a drone AddOn is activated while the booking is CONFIRMED)"
        actor: system
        preconditions: []
        side_effects:
          - "AirspaceAuthorization created in PENDING with window = booking window"

      - from: AUTHORIZATION_PENDING
        to: CONFIRMED
        trigger: "system (automatic when every AirspaceAuthorization on the booking is APPROVED and no PENDING remains) OR POST /shoot-bookings/{id}/confirm when no drone AddOn exists"
        actor: system
        preconditions:
          - "All AirspaceAuthorizations for drone AddOns are APPROVED (none PENDING or REJECTED unresolved)"
        side_effects:
          - "Increments ShootBooking.version"

      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /shoot-bookings/{id}/confirm"
        actor: Coordinator
        preconditions:
          - "Booking must be ASSIGNED (ERR_BOOKING_NOT_ASSIGNED)"
          - "No ACTIVE drone AddOn exists on the booking (otherwise booking must route through AUTHORIZATION_PENDING; ERR_AUTHORIZATION_PENDING)"
        side_effects:
          - "Increments ShootBooking.version"

      - from: CONFIRMED
        to: SHOT
        trigger: "POST /shoot-bookings/{id}/mark-shot"
        actor: Photographer
        preconditions:
          - "Booking must be CONFIRMED (ERR_BOOKING_NOT_CONFIRMED)"
          - "X-User-ID must equal assigned_photographer_id (ERR_FORBIDDEN)"
          - "now must be within [scheduled_start_utc - 2h, scheduled_end_utc + 24h] (ERR_OUTSIDE_SHOOT_WINDOW)"
        side_effects:
          - "AssetBundle created in EDITING with round_number=1"
          - "delivery_due_utc computed via turnaround_deadline calculation (weather-adjusted variant if booking has consumed a weather reschedule)"
          - "Increments ShootBooking.version"

      - from: SHOT
        to: IN_EDIT
        trigger: "system (automatic on AssetBundle creation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_EDIT
        to: DELIVERED
        trigger: "POST /shoot-bookings/{id}/deliver"
        actor: Photographer
        preconditions:
          - "Booking must be IN_EDIT or REVISION_REQUESTED (ERR_BOOKING_NOT_IN_EDIT)"
          - "Bundle photo_asset_count >= booking.photo_count (ERR_QUALITY_GUARANTEE_SHORTFALL)"
          - "If booking.wants_virtual_tour: bundle.tour_asset_url must be non-null (ERR_TOUR_ASSET_MISSING)"
          - "X-User-ID must equal assigned_photographer_id (ERR_FORBIDDEN)"
        side_effects:
          - "Current AssetBundle (round N) -> DELIVERED with delivered_at_utc=now; booking.delivered_at_utc=now; revision_window_closes_utc = now + 72h"
          - "If wants_virtual_tour: VirtualTour created (HOSTED) on first delivery only"
          - "LicenseGrant created in DORMANT on first delivery only"
          - "Increments ShootBooking.version"

      - from: DELIVERED
        to: REVISION_REQUESTED
        trigger: "POST /shoot-bookings/{id}/revisions"
        actor: ClientAgent
        preconditions:
          - "Booking must be DELIVERED (ERR_BOOKING_NOT_DELIVERED)"
          - "Owning ClientAgent must match X-User-ID (ERR_FORBIDDEN)"
          - "now < revision_window_closes_utc (strictly before; ERR_REVISION_WINDOW_CLOSED)"
          - "revisions_used < 4 (2 free + 2 paid hard cap; ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "RevisionRequest created OPEN; is_free computed from revisions_used; fee_cents via paid_revision_fee rule; booking.revisions_used += 1"
          - "Increments ShootBooking.version"

      - from: REVISION_REQUESTED
        to: DELIVERED
        trigger: "POST /shoot-bookings/{id}/deliver (revision redelivery)"
        actor: Photographer
        preconditions:
          - "Booking must be REVISION_REQUESTED (ERR_BOOKING_NOT_IN_EDIT)"
          - "All OPEN/IN_PROGRESS RevisionRequests on the current bundle are addressed by the new bundle"
          - "Same quality + tour gates as initial deliver"
        side_effects:
          - "Prior AssetBundle -> SUPERSEDED; new AssetBundle created round_number=prior+1 then -> DELIVERED"
          - "RevisionRequests on prior bundle -> RESOLVED"
          - "revision_window_closes_utc NOT extended by revision redeliveries (fixed from first delivery)"
          - "Increments ShootBooking.version"

      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /shoot-bookings/{id}/accept"
        actor: ClientAgent
        preconditions:
          - "Booking must be DELIVERED (ERR_BOOKING_NOT_DELIVERED)"
          - "Owning ClientAgent must match X-User-ID (ERR_FORBIDDEN)"
          - "No RevisionRequest on the booking is in OPEN or IN_PROGRESS (ERR_OPEN_REVISIONS_EXIST)"
          - "If tour_variant == UNBRANDED: booking.license_tier must be MLS_COMPLIANT (ERR_UNBRANDED_REQUIRES_MLS_TIER)"
        side_effects:
          - "final_invoice_cents computed via final_invoice calculation"
          - "LicenseGrant DORMANT -> ACTIVE, activated_at_utc=now, tier copied, fee_cents resolved"
          - "If VirtualTour exists: HOSTED -> PUBLISHED"
          - "Weather credit ledger: booking.weather_credit_cents zeroed into ClientAgent.credit_balance_cents when refund_destination semantics apply (see final_invoice)"
          - "Increments ShootBooking.version"

      - from: DRAFT
        to: CANCELLED_BY_CLIENT
        trigger: "POST /shoot-bookings/{id}/cancel"
        actor: ClientAgent
        preconditions:
          - "Booking in {DRAFT, AWAITING_READINESS, READY, ASSIGNED, AUTHORIZATION_PENDING, CONFIRMED} (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects:
          - "Non-terminal AddOns -> CANCELLED; AirspaceAuthorizations -> CANCELLED"
          - "If assigned: Photographer.committed_minutes_by_day decremented; assigned_photographer_id=null"
          - "Increments ShootBooking.version"

      - from: AWAITING_READINESS
        to: CANCELLED_BY_CLIENT
        trigger: "POST /shoot-bookings/{id}/cancel"
        actor: ClientAgent
        preconditions: ["Same as DRAFT cancel"]
        side_effects: ["Same cascade as DRAFT cancel"]

      - from: READY
        to: CANCELLED_BY_CLIENT
        trigger: "POST /shoot-bookings/{id}/cancel"
        actor: ClientAgent
        preconditions: ["Same as DRAFT cancel"]
        side_effects: ["Same cascade as DRAFT cancel"]

      - from: ASSIGNED
        to: CANCELLED_BY_CLIENT
        trigger: "POST /shoot-bookings/{id}/cancel"
        actor: ClientAgent
        preconditions: ["Same as DRAFT cancel"]
        side_effects: ["Same cascade as DRAFT cancel"]

      - from: AUTHORIZATION_PENDING
        to: CANCELLED_BY_CLIENT
        trigger: "POST /shoot-bookings/{id}/cancel"
        actor: ClientAgent
        preconditions: ["Same as DRAFT cancel"]
        side_effects: ["Same cascade as DRAFT cancel"]

      - from: CONFIRMED
        to: CANCELLED_BY_CLIENT
        trigger: "POST /shoot-bookings/{id}/cancel"
        actor: ClientAgent
        preconditions:
          - "Booking must be CONFIRMED (ERR_BOOKING_NOT_CANCELLABLE)"
          - "now must be < scheduled_start_utc - 12h (ERR_INSIDE_CANCELLATION_CUTOFF)"
        side_effects: ["Same cascade as DRAFT cancel"]

      - from: CONFIRMED
        to: CANCELLED_WEATHER
        trigger: "POST /shoot-bookings/{id}/reschedule with kind=WEATHER when reschedule_count == 3 (cap already reached)"
        actor: ClientAgent
        preconditions:
          - "Booking must be in {ASSIGNED, AUTHORIZATION_PENDING, CONFIRMED}"
          - "reschedule_count == 3 (cap reached): kind=WEATHER succeeds with code 200 and transitions to CANCELLED_WEATHER; kind=CLIENT at the cap instead fails with ERR_RESCHEDULE_CAP_EXCEEDED"
          - "reason_code must be a WEATHER reason (ERR_INVALID_REASON_CODE otherwise)"
        side_effects:
          - "Same release cascade as cancel (AddOns CANCELLED, AirspaceAuthorizations CANCELLED, photographer minutes released)"
          - "No additional weather credit accrues (weather_reschedule_credit only applies to successful in-cap reschedules); a final weather cancellation credit equal to one weather_reschedule_credit application IS granted to ClientAgent.credit_balance_cents"
          - "Increments ShootBooking.version"

      - from: AWAITING_READINESS
        to: DRAFT
        trigger: "system (automatic when a required checklist item flips checked true -> false, i.e. readiness regresses before READY was ever reached)"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_quote_cents remains locked (not recomputed)"

      - from: READY
        to: DRAFT
        trigger: "system (automatic when a checked required checklist item is unchecked while the booking is READY)"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_quote_cents remains locked (not recomputed)"

      - from: ASSIGNED
        to: READY
        trigger: "system (automatic when assignment is revoked by Coordinator via POST /shoot-bookings/{id}/unassign)"
        actor: Coordinator
        preconditions:
          - "Booking must be ASSIGNED or AUTHORIZATION_PENDING (ERR_BOOKING_NOT_ASSIGNED)"
          - "No AirspaceAuthorization in APPROVED state may exist — approved authorizations must first be obviated by a reschedule (ERR_AUTHORIZATION_STILL_VALID)"
        side_effects:
          - "Photographer.committed_minutes_by_day decremented by released minutes; assigned_photographer_id=null"
          - "Any PENDING/REJECTED AirspaceAuthorization -> CANCELLED"
          - "Increments ShootBooking.version and Photographer.version"

      - from: AUTHORIZATION_PENDING
        to: READY
        trigger: "system (cascade of unassign)"
        actor: Coordinator
        preconditions: []
        side_effects: ["Same release cascade as ASSIGNED -> READY"]

      - from: DRAFT
        to: EXPIRED
        trigger: "system (automatic when now >= scheduled_start_utc and booking still in DRAFT)"
        actor: system
        preconditions: []
        side_effects: ["Checklist items frozen"]

      - from: AWAITING_READINESS
        to: EXPIRED
        trigger: "system (automatic when now >= scheduled_start_utc and booking still in AWAITING_READINESS or READY)"
        actor: system
        preconditions: []
        side_effects: []

      - from: READY
        to: EXPIRED
        trigger: "system (automatic when now >= scheduled_start_utc and booking still READY)"
        actor: system
        preconditions: []
        side_effects: []

      # --- weather / client reschedule (cyclic loop back into ASSIGNED/READY) ---
      - from: CONFIRMED
        to: ASSIGNED
        trigger: "POST /shoot-bookings/{id}/reschedule"
        actor: ClientAgent
        preconditions:
          - "Booking must be in {ASSIGNED, AUTHORIZATION_PENDING, CONFIRMED} (ERR_BOOKING_NOT_RESCHEDULABLE)"
          - "reschedule_count < 3 (at cap: kind=CLIENT fails with ERR_RESCHEDULE_CAP_EXCEEDED; kind=WEATHER instead takes the CANCELLED_WEATHER transition)"
          - "new_start_utc >= now + 24h and quarter-hour aligned (ERR_SLOT_TOO_SOON / ERR_INVALID_SLOT_ALIGNMENT)"
          - "For kind=WEATHER: reason_code must be in {PRECIPITATION, WIND, LOW_LIGHT}; for kind=CLIENT: in {SELLER_DELAY, ACCESS_ISSUE, STAGING_DELAY} (ERR_INVALID_REASON_CODE)"
        side_effects:
          - "RescheduleEvent appended (immutable); reschedule_count += 1"
          - "If kind=WEATHER: weather_credit via weather_reschedule_credit rule accumulated into booking.weather_credit_cents"
          - "scheduled_start_utc = new_start_utc; scheduled_end_utc recomputed; delivery_due_utc cleared (recomputed at mark-shot)"
          - "All ReadinessChecklistItems: checked=false, checked_at_utc=null (property readiness must be re-attested) — booking readiness regresses handled by keeping booking in ASSIGNED but gate at confirm re-checked"
          - "Photographer temporal overlap + day-capacity re-validated for the SAME photographer on the new window; on failure, assigned_photographer_id=null and booking falls back to READY (assignment forfeited), committed minutes released"
          - "All AirspaceAuthorizations in APPROVED state whose window no longer matches the new scheduled window -> EXPIRED; new PENDING AirspaceAuthorization created with attempt_number = max(prior attempts)+1 capped at 3 — if cap would be exceeded, the drone AddOn -> REFUSED and booking proceeds without it"
          - "Increments ShootBooking.version"

      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /shoot-bookings/{id}/reschedule"
        actor: ClientAgent
        preconditions: ["Same as CONFIRMED reschedule"]
        side_effects: ["Same cascade as CONFIRMED reschedule"]

      - from: AUTHORIZATION_PENDING
        to: ASSIGNED
        trigger: "POST /shoot-bookings/{id}/reschedule"
        actor: ClientAgent
        preconditions: ["Same as CONFIRMED reschedule"]
        side_effects: ["Same cascade as CONFIRMED reschedule; pending authorizations cancelled and re-created"]

  - entity: AirspaceAuthorization
    initial_state: PENDING
    terminal_states: [APPROVED, CANCELLED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /shoot-bookings/{id}/airspace-authorizations/{authId}/approve (ops console)"
        actor: OpsAdmin
        preconditions:
          - "Authorization must be PENDING (ERR_AUTHORIZATION_NOT_PENDING)"
          - "window_end_utc must be > now (ERR_AUTHORIZATION_WINDOW_LAPSED)"
        side_effects:
          - "decided_at_utc=now"
          - "If no other PENDING AirspaceAuthorization remains on the booking and booking.state == AUTHORIZATION_PENDING: booking AUTHORIZATION_PENDING -> CONFIRMED"

      - from: PENDING
        to: REJECTED
        trigger: "POST /shoot-bookings/{id}/airspace-authorizations/{authId}/reject"
        actor: OpsAdmin
        preconditions:
          - "Authorization must be PENDING (ERR_AUTHORIZATION_NOT_PENDING)"
        side_effects:
          - "decided_at_utc=now"
          - "Booking stays AUTHORIZATION_PENDING awaiting resubmit; if attempt_number == 3, the covered drone AddOn -> REFUSED, and if no drone AddOn remains ACTIVE the booking returns AUTHORIZATION_PENDING -> CONFIRMED"

      - from: REJECTED
        to: PENDING
        trigger: "POST /shoot-bookings/{id}/airspace-authorizations/{authId}/resubmit"
        actor: Coordinator
        preconditions:
          - "Authorization must be REJECTED (ERR_AUTHORIZATION_NOT_REJECTED)"
          - "attempt_number < 3 (ERR_AUTHORIZATION_ATTEMPTS_EXHAUSTED)"
          - "Booking still in AUTHORIZATION_PENDING (ERR_BOOKING_NOT_RESCHEDULABLE)"
        side_effects:
          - "attempt_number += 1; window re-stamped to current booking window; decided_at_utc=null"

      - from: PENDING
        to: CANCELLED
        trigger: "system (cascade: booking cancel / unassign / drone AddOn cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: EXPIRED
        trigger: "system (cascade: booking reschedule moves window) or system clock reaching window_end_utc while booking not yet SHOT"
        actor: system
        preconditions: []
        side_effects:
          - "If booking still needs the drone add-on: replacement PENDING created per reschedule cascade"

  - entity: AddOn
    initial_state: PENDING
    terminal_states: [ACTIVE, CANCELLED, REFUSED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system (on creation, once price resolved) — creation endpoint POST /shoot-bookings/{id}/addons"
        actor: ClientAgent
        preconditions:
          - "Booking in {DRAFT, AWAITING_READINESS, READY, ASSIGNED, AUTHORIZATION_PENDING, CONFIRMED} (ERR_BOOKING_NOT_CANCELLABLE)"
          - "TWILIGHT_UPGRADE requires booking.is_twilight == false at creation (ERR_TWILIGHT_CONFLICT) and requires the market twilight slot to be free for the assigned/new photographer (ERR_PHOTOGRAPHER_DOUBLE_BOOKED)"
          - "DRONE_* requires booking not already carrying an ACTIVE drone AddOn (ERR_DUPLICATE_DRONE_ADDON)"
        side_effects:
          - "price_cents resolved from rate card via addon_pricing rule; extra_minutes added; booking.scheduled_end_utc recomputed"
          - "DRONE_* while booking ASSIGNED or CONFIRMED: triggers AirspaceAuthorization creation (booking -> AUTHORIZATION_PENDING if previously CONFIRMED... CONFIRMED regresses to AUTHORIZATION_PENDING)"
          - "TWILIGHT_UPGRADE sets booking.is_twilight=true and re-bases scheduled window onto the market twilight slot"

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /shoot-bookings/{id}/addons/{addonId}/cancel"
        actor: ClientAgent
        preconditions:
          - "AddOn must be ACTIVE (ERR_ADDON_NOT_CANCELLABLE)"
          - "Booking not yet SHOT (ERR_BOOKING_NOT_RESCHEDULABLE)"
        side_effects:
          - "booking.scheduled_end_utc recomputed without extra_minutes"
          - "DRONE_*: linked AirspaceAuthorization -> CANCELLED; if booking AUTHORIZATION_PENDING and no pending remains: -> CONFIRMED"
          - "TWILIGHT_UPGRADE: booking.is_twilight=false"

      - from: ACTIVE
        to: REFUSED
        trigger: "system (airspace authorization attempt cap exhausted)"
        actor: system
        preconditions: []
        side_effects: ["price_cents credited back against provisional quote at invoice time"]

      - from: PENDING
        to: CANCELLED
        trigger: "system (cascade from booking cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CANCELLED
        trigger: "system (cascade from booking cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AssetBundle
    initial_state: EDITING
    terminal_states: [SUPERSEDED, FINALIZED]
    transitions:
      - from: EDITING
        to: DELIVERED
        trigger: "POST /shoot-bookings/{id}/deliver"
        actor: Photographer
        preconditions: ["See ShootBooking IN_EDIT -> DELIVERED"]
        side_effects: ["delivered_at_utc=now"]
      - from: DELIVERED
        to: SUPERSEDED
        trigger: "system (revision redelivery)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: FINALIZED
        trigger: "system (booking accepted)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RevisionRequest
    initial_state: OPEN
    terminal_states: [RESOLVED, REJECTED_LATE, REJECTED_EXHAUSTED]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: "POST /shoot-bookings/{id}/revisions/{revisionId}/claim"
        actor: Photographer
        preconditions:
          - "Revision must be OPEN (ERR_REVISION_NOT_OPEN)"
          - "X-User-ID must equal booking.assigned_photographer_id (ERR_FORBIDDEN)"
        side_effects: []
      - from: OPEN
        to: RESOLVED
        trigger: "system (bundle redelivery)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: RESOLVED
        trigger: "system (bundle redelivery)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: REJECTED_LATE
        trigger: "system (revision window closes while revision still OPEN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: REJECTED_EXHAUSTED
        trigger: "system (client accept while OPEN is blocked; only reachable via admin override POST /shoot-bookings/{id}/revisions/{revisionId}/dismiss)"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

  - entity: VirtualTour
    initial_state: HOSTED
    terminal_states: [UNPUBLISHED]
    transitions:
      - from: HOSTED
        to: PUBLISHED
        trigger: "system (booking acceptance)"
        actor: system
        preconditions: ["LicenseGrant must transition to ACTIVE in the same acceptance transaction (ERR_LICENSE_NOT_ACTIVE otherwise — acceptance is atomic)"]
        side_effects: ["published_at_utc=now"]
      - from: PUBLISHED
        to: SUSPENDED
        trigger: "POST /shoot-bookings/{id}/virtual-tour/suspend"
        actor: OpsAdmin
        preconditions: ["Tour must be PUBLISHED (ERR_TOUR_NOT_PUBLISHED)"]
        side_effects: []
      - from: SUSPENDED
        to: PUBLISHED
        trigger: "POST /shoot-bookings/{id}/virtual-tour/resume"
        actor: OpsAdmin
        preconditions:
          - "Tour must be SUSPENDED (ERR_TOUR_NOT_SUSPENDED)"
          - "Booking must be ACCEPTED and LicenseGrant ACTIVE (ERR_LICENSE_NOT_ACTIVE)"
        side_effects: []
      - from: PUBLISHED
        to: UNPUBLISHED
        trigger: "POST /shoot-bookings/{id}/virtual-tour/unpublish"
        actor: OpsAdmin
        preconditions: ["Tour must be PUBLISHED or SUSPENDED (ERR_TOUR_NOT_PUBLISHED)"]
        side_effects: []
      - from: SUSPENDED
        to: UNPUBLISHED
        trigger: "POST /shoot-bookings/{id}/virtual-tour/unpublish"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

  - entity: LicenseGrant
    initial_state: DORMANT
    terminal_states: [REVOKED]
    transitions:
      - from: DORMANT
        to: ACTIVE
        trigger: "system (booking acceptance)"
        actor: system
        preconditions:
          - "Booking acceptance transaction succeeds"
          - "If booking.tour_variant == UNBRANDED: tier must be MLS_COMPLIANT at acceptance (ERR_UNBRANDED_REQUIRES_MLS_TIER)"
        side_effects:
          - "activated_at_utc=now; tier copied from booking.license_tier; fee_cents resolved via license_fee rule"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /shoot-bookings/{id}/license/suspend"
        actor: OpsAdmin
        preconditions: ["License must be ACTIVE (ERR_LICENSE_NOT_ACTIVE)"]
        side_effects: ["If VirtualTour PUBLISHED: tour -> SUSPENDED (cascade)"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /shoot-bookings/{id}/license/reinstate"
        actor: OpsAdmin
        preconditions: ["License must be SUSPENDED (ERR_LICENSE_NOT_SUSPENDED)"]
        side_effects: ["VirtualTour stays SUSPENDED until separately resumed (no auto-resume)"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /shoot-bookings/{id}/license/revoke"
        actor: OpsAdmin
        preconditions: ["License must be ACTIVE or SUSPENDED (ERR_LICENSE_NOT_ACTIVE)"]
        side_effects: ["VirtualTour -> UNPUBLISHED if not already"]
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /shoot-bookings/{id}/license/revoke"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["VirtualTour -> UNPUBLISHED if not already"]

  - entity: Market
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /markets/{marketId}"
        actor: OpsAdmin
        preconditions: []
        side_effects: ["No new booking submissions accepted for the market; existing bookings unaffected"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /markets/{marketId}"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

  - entity: Photographer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "PATCH /photographers/{photographerId}"
        actor: OpsAdmin
        preconditions:
          - "Photographer must have zero bookings in {ASSIGNED, AUTHORIZATION_PENDING, CONFIRMED} (ERR_PHOTOGRAPHER_HAS_OPEN_COMMITMENTS)"
        side_effects: []
      - from: INACTIVE
        to: ACTIVE
        trigger: "PATCH /photographers/{photographerId}"
        actor: OpsAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: booking-update-stale-version
    parent_entity: ShootBooking
    write_endpoint: "PATCH /shoot-bookings/{id}"
    occ_field: "expected_booking_version"
    description: |
      Updating mutable booking fields (equipment_package, photo_count, tour_variant,
      license_tier, scheduled_start_utc) while in DRAFT is rejected when the client's
      last-observed ShootBooking.version no longer matches the server's. This captures
      the case where another writer legitimately mutated the booking after the client
      read it (e.g. submitted it, changing state and locking the quote).
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: booking-reschedule-stale-version
    parent_entity: ShootBooking
    write_endpoint: "POST /shoot-bookings/{id}/reschedule"
    occ_field: "expected_booking_version"
    description: |
      A reschedule request carries expected_booking_version. When another writer has
      since mutated the booking (e.g. an add-on was activated, which recomputed
      scheduled_end_utc and changed version), the reschedule is rejected so the
      client re-reads the new window before moving it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: shoot_duration
    trigger: "booking create / equipment_package or photo_count patch / TWILIGHT_UPGRADE activation"
    algorithm: aggregation
    formula: |
      base_minutes = BASE_BY_PACKAGE[equipment_package]              # STANDARD 60, PREMIUM 90, LUXURY 120
      photo_overage = max(0, photo_count - INCLUDED_PHOTOS[package]) # included: 25 / 40 / 60
      extra_minutes = ceil(photo_overage / 5) * 10                   # +10 min per 5 extra photos
      if is_twilight: shoot_duration_minutes = market.twilight_slot_minutes (overrides base+extra entirely)
      else: shoot_duration_minutes = base_minutes + extra_minutes
    constants:
      BASE_STANDARD: 60
      BASE_PREMIUM: 90
      BASE_LUXURY: 120
      INCLUDED_STANDARD: 25
      INCLUDED_PREMIUM: 40
      INCLUDED_LUXURY: 60
      OVERAGE_STEP_PHOTOS: 5
      OVERAGE_STEP_MINUTES: 10
    precision: "integer minutes"
    input_set: "single booking row + its Market"

  - name: provisional_quote
    trigger: "POST /shoot-bookings/{id}/submit (locks quote)"
    algorithm: tiered_pricing
    formula: |
      # Order of operations is PINNED: compute each line, round HALF_UP to whole cents per line, then sum.
      base_cents        = round_half_up(BASE_RATE_CENTS[equipment_package] * market.pricing_multiplier_bps / 10000)
      photo_overage     = max(0, photo_count - INCLUDED_PHOTOS[package])
      overage_cents     = round_half_up(photo_overage * OVERAGE_RATE_CENTS_PER_PHOTO * market.pricing_multiplier_bps / 10000)
      tour_line_cents   = 0
      if wants_virtual_tour:
          tour_line_cents = round_half_up(TOUR_RATE_CENTS[tour_variant] * market.pricing_multiplier_bps / 10000)
      twilight_cents    = 0
      if is_twilight:
          twilight_cents = round_half_up(base_cents * TWILIGHT_PREMIUM_BPS / 10000)   # 25% of base, stacked AFTER market multiplier
      addon_lines       = sum of addon_pricing.price_cents for each AddOn ACTIVE at submit time (each line individually rounded)
      volume_discount   = 0
      if addon_lines >= VOLUME_DISCOUNT_FLOOR_CENTS:                                  # >= 50000 cents of add-ons
          volume_discount = round_half_up(addon_lines * VOLUME_DISCOUNT_BPS / 10000)  # 10% off add-ons only, never off base/overage/tour
      provisional_quote_cents = base_cents + overage_cents + tour_line_cents + twilight_cents + addon_lines - volume_discount
    constants:
      BASE_RATE_STANDARD_CENTS: 15000
      BASE_RATE_PREMIUM_CENTS: 25000
      BASE_RATE_LUXURY_CENTS: 40000
      OVERAGE_RATE_CENTS_PER_PHOTO: 300
      TOUR_RATE_BRANDED_CENTS: 12000
      TOUR_RATE_UNBRANDED_CENTS: 14000
      TWILIGHT_PREMIUM_BPS: 2500
      VOLUME_DISCOUNT_FLOOR_CENTS: 50000
      VOLUME_DISCOUNT_BPS: 1000
    precision: "whole cents; round HALF_UP per line item before summing (nested rounding order pinned: per-line then sum)"
    input_set: "booking fields + Market.pricing_multiplier_bps + ACTIVE AddOns at submit time"
    variants:
      - name: with_market_multiplier
        when: "market.pricing_multiplier_bps != 10000"
        difference: "every money line is multiplied by the market factor before line-level rounding"

  - name: addon_pricing
    trigger: "AddOn creation (PENDING -> ACTIVE)"
    algorithm: tiered_pricing
    formula: |
      raw = ADDON_RATE_CENTS[kind]                       # DRONE_STILLS 20000, DRONE_VIDEO 35000, RUSH_EDIT 15000, VIRTUAL_STAGING 10000, TWILIGHT_UPGRADE = 0 (twilight priced inside quote)
      if kind == TWILIGHT_UPGRADE: price_cents = 0       # twilight premium is captured in provisional_quote; the add-on row exists for scheduling only
      else: price_cents = round_half_up(raw * market.pricing_multiplier_bps / 10000)
      extra_minutes = ADDON_EXTRA_MINUTES[kind]          # DRONE_STILLS 30, DRONE_VIDEO 45, RUSH_EDIT 0, VIRTUAL_STAGING 0, TWILIGHT_UPGRADE 0
    constants:
      ADDON_DRONE_STILLS_CENTS: 20000
      ADDON_DRONE_VIDEO_CENTS: 35000
      ADDON_RUSH_EDIT_CENTS: 15000
      ADDON_VIRTUAL_STAGING_CENTS: 10000
      ADDON_EXTRA_DRONE_STILLS_MIN: 30
      ADDON_EXTRA_DRONE_VIDEO_MIN: 45
    precision: "whole cents HALF_UP"
    input_set: "single AddOn + booking's Market"

  - name: turnaround_deadline
    trigger: "mark-shot (delivery_due_utc set), and re-derived after weather reschedule at next mark-shot"
    algorithm: forward_looking
    formula: |
      base_hours = market.standard_turnaround_hours
      if any ACTIVE AddOn of kind RUSH_EDIT exists: base_hours = ceil(base_hours / 2)
      if any ACTIVE AddOn of kind VIRTUAL_STAGING exists: base_hours = base_hours + 12
      # weather variant: every consumed WEATHER reschedule adds WEATHER_SLA_EXTENSION_HOURS to the deadline
      # but only for the FIRST two weather reschedules; third weather reschedule grants no further slack.
      weather_events = count of RescheduleEvent on booking with kind=WEATHER
      weather_extension_hours = min(weather_events, 2) * WEATHER_SLA_EXTENSION_HOURS
      delivery_due_utc = shot_marked_at_utc + (base_hours + weather_extension_hours) hours
    constants:
      WEATHER_SLA_EXTENSION_HOURS: 24
    precision: "whole seconds; addition over ISO8601"
    input_set: "booking's Market, ACTIVE AddOns at mark-shot time, RescheduleEvents"
    variants:
      - name: standard_clock
        when: "no weather reschedules consumed"
        difference: "delivery_due_utc = marked_at + adjusted base_hours"
      - name: weather_extended_clock
        when: ">=1 weather reschedule consumed"
        difference: "adds min(weather_events,2)*24h; a booking with 3 weather reschedules gets only 48h extension, not 72h"

  - name: final_invoice
    trigger: "booking acceptance (DELIVERED -> ACCEPTED)"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is PINNED to break the circular-looking dependency:
      # 1. Recompute quote lines from CURRENT booking state (equipment/package unchanged since submit;
      #    photo_count may have been patched pre-submit only — quote base lines are taken from the
      #    LOCKED provisional_quote decomposition, not recomputed).
      # 2. addons_now = sum of addon_pricing.price_cents over AddOns currently ACTIVE
      #    (add-ons added or cancelled between submit and accept are re-delta'd here).
      # 3. rush_fee interacts with delivery timeliness, not the other direction:
      #    rush_discount = 0
      #    if RUSH_EDIT ACTIVE and delivered_at_utc > delivery_due_utc:
      #        rush_discount = addon price of RUSH_EDIT (rush fee refunded in full on late rush delivery)
      # 4. revision_fees = sum of RevisionRequest.fee_cents over RESOLVED paid revisions
      # 5. late_penalty = 0
      #    if delivered_at_utc > delivery_due_utc:
      #        late_penalty = round_half_up(provisional_quote_cents * LATE_DELIVERY_PENALTY_BPS / 10000)  # 15% of quote
      # 6. weather_credit = booking.weather_credit_cents (accumulated, capped at 30% of provisional_quote)
      # 7. license_fee = LicenseGrant.fee_cents resolved at activation (see license_fee rule)
      # final_invoice_cents = max(0,
      #     provisional_quote_cents
      #     + (addons_now - addons_at_submit)          # add-on delta vs locked quote
      #     - rush_discount
      #     + revision_fees
      #     - late_penalty
      #     - weather_credit
      #     + license_fee )
      # NOTE: provisional_quote_cents already included addons_at_submit + volume_discount computed at submit;
      # the delta approach keeps the locked base stable while letting add-on set drift.
    constants:
      LATE_DELIVERY_PENALTY_BPS: 1500
      WEATHER_CREDIT_CAP_BPS: 3000
    precision: "whole cents HALF_UP; final max(0,...) floor"
    input_set: "booking + AddOns + RevisionRequests + LicenseGrant at acceptance"
    variants:
      - name: on_time_delivery
        when: "delivered_at_utc <= delivery_due_utc"
        difference: "late_penalty = 0 and rush_discount = 0"
      - name: late_delivery
        when: "delivered_at_utc > delivery_due_utc"
        difference: "late_penalty applies; if RUSH_EDIT ACTIVE its full price is also refunded (double relief by design)"

  - name: weather_reschedule_credit
    trigger: "POST /shoot-bookings/{id}/reschedule with kind=WEATHER"
    algorithm: threshold
    formula: |
      raw = round_half_up(booking.provisional_quote_cents * market.weather_reschedule_credit_bps / 10000)
      accumulated = booking.weather_credit_cents + raw
      cap = round_half_up(booking.provisional_quote_cents * WEATHER_CREDIT_CAP_BPS / 10000)   # 30% of quote
      applied = min(accumulated, cap) - booking.weather_credit_cents                          # marginal credit this event
      booking.weather_credit_cents = min(accumulated, cap)
      RescheduleEvent.credit_applied_cents = applied
    constants:
      WEATHER_CREDIT_CAP_BPS: 3000
    precision: "whole cents HALF_UP"
    input_set: "booking + market + existing weather_credit_cents"

  - name: license_fee
    trigger: "LicenseGrant activation (booking acceptance)"
    algorithm: threshold
    formula: |
      base = LICENSE_FEE_CENTS[tier]                    # MLS_COMPLIANT 0, STANDARD_MARKETING 5000, EXTENDED 15000
      surcharge = 0
      if booking.tour_variant == UNBRANDED: surcharge = UNBRANDED_SURCHARGE_CENTS   # 4000
      if booking.tour_variant == UNBRANDED and tier != MLS_COMPLIANT: rejected upstream (ERR_UNBRANDED_REQUIRES_MLS_TIER)
      fee_cents = base + surcharge
    constants:
      LICENSE_MLS_COMPLIANT_CENTS: 0
      LICENSE_STANDARD_MARKETING_CENTS: 5000
      LICENSE_EXTENDED_CENTS: 15000
      UNBRANDED_SURCHARGE_CENTS: 4000
    precision: "whole cents"
    input_set: "booking.license_tier + booking.tour_variant at acceptance"

  - name: photographer_overlap_check
    trigger: "assign, reschedule, TWILIGHT_UPGRADE activation"
    algorithm: interval_merge
    formula: |
      For candidate photographer P and candidate window [s, e) on UTC day D:
        buffer = market.travel_buffer_minutes
        For every other booking B' assigned to P in state {ASSIGNED, AUTHORIZATION_PENDING, CONFIRMED}:
            conflict if [s - buffer, e + buffer) intersects [B'.scheduled_start_utc, B'.scheduled_end_utc)
            # adjacency is allowed ONLY when gap >= buffer on both sides; touching endpoints (gap == buffer exactly) is allowed
            # i.e. intersection test is on OPEN intervals after buffer expansion
        day_minutes = sum over those B' of (B'.scheduled_end_utc - B'.scheduled_start_utc) restricted to day D + (e - s)
        reject if day_minutes > P.max_shoot_minutes_per_day            # strictly greater allowed-to-equal boundary
    constants: {}
    precision: "whole minutes"
    input_set: "photographer's non-terminal assigned bookings"
    variants:
      - name: twilight_slot_semantics
        when: "candidate booking.is_twilight == true"
        difference: "twilight bookings occupy EXACTLY [slot_start, slot_start + market.twilight_slot_minutes) — a second twilight booking in the same market on the same evening ALWAYS conflicts regardless of buffer (twilight slots are exclusive per photographer per evening; overlapping is tested on the slot interval before buffer expansion)"

  - name: readiness_aggregate
    trigger: "any checklist item PATCH"
    algorithm: aggregation
    formula: |
      required_items = items on booking with required == true
      complete = count(required_items where checked == true) == count(required_items)   # equality, not >=
      if complete and booking.state == AWAITING_READINESS: booking -> READY
      if not complete and booking.state == READY and a checked item was unchecked: booking -> DRAFT (regression handled by state machine)
    constants: {}
    precision: "exact integer equality"
    input_set: "all ReadinessChecklistItems of the booking"

  - name: paid_revision_fee
    trigger: "RevisionRequest creation"
    algorithm: threshold
    formula: |
      free_quota = FREE_REVISION_ROUNDS                          # 2
      if booking.revisions_used < free_quota at open time: is_free = true, fee_cents = 0
      else: is_free = false, fee_cents = round_half_up(PAID_REVISION_BASE_CENTS * market.pricing_multiplier_bps / 10000)
    constants:
      FREE_REVISION_ROUNDS: 2
      PAID_REVISION_BASE_CENTS: 7500
    precision: "whole cents HALF_UP"
    input_set: "booking.revisions_used at open time"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role in {ClientAgent, Photographer, Coordinator, OpsAdmin}"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role is permitted for the endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist and FK parents chain correctly (booking->market, addon->booking, auth->booking, revision->booking, bundle->booking)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all nested endpoints
  - priority: 4
    category: state
    check: "Target entity in a legal state for the operation (per state machine preconditions; e.g. submit requires DRAFT, deliver requires IN_EDIT|REVISION_REQUESTED, accept requires DELIVERED)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all action endpoints
  - priority: 5
    category: business_temporal
    check: "Time-window preconditions: slot >= now+24h on submit/reschedule; quarter-hour alignment; mark-shot inside shoot window; cancel outside 12h cutoff; revision strictly before revision_window_closes_utc"
    error_id: ERR_SLOT_TOO_SOON
    http_status: 422
    applies_to: "submit, reschedule, mark-shot, cancel, create revision"
  - priority: 6
    category: business_safety
    check: "Airspace safety: drone AddOn requires drone_certified photographer; authorization attempts < 3; authorization window not lapsed at approve; UNBRANDED tour requires MLS_COMPLIANT tier at acceptance"
    error_id: ERR_DRONE_CERT_REQUIRED
    http_status: 422
    applies_to: "assign, addon create, authorization approve, accept"
  - priority: 7
    category: business_constraint
    check: "Resource constraints: photographer temporal overlap (with travel buffer; twilight exclusivity); day capacity minutes; equipment package match; no duplicate ACTIVE drone add-on; reschedule_count < 3; revisions_used < 4; readiness aggregate complete for READY"
    error_id: ERR_PHOTOGRAPHER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "assign, reschedule, addon create, revision create"
  - priority: 8
    category: business_referential
    check: "Cross-entity referential gates: no OPEN/IN_PROGRESS revisions at accept; bundle.photo_asset_count >= booking.photo_count; tour_asset_url present when wants_virtual_tour; photographer has no open commitments before INACTIVE"
    error_id: ERR_OPEN_REVISIONS_EXIST
    http_status: 409
    applies_to: "accept, deliver, photographer patch"
  - priority: 9
    category: business_fiscal
    check: "Invoice sanity: final_invoice_cents floor at 0; weather credit cap; license/tier consistency"
    error_id: ERR_INVOICE_INCONSISTENT
    http_status: 422
    applies_to: "accept"

