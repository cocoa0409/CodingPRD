# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; registers applicators and drives the logical clock"
    identity: opaque
    exclusive_operations: ["POST /coating/applicators", "POST /coating/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: TechnicalServiceEngineer
    description: "Manufacturer technical service; owns coating systems, programs, certification decisions, substitution review, testing waivers, and failure adjudication"
    identity: opaque
    exclusive_operations: ["coating-system write endpoints", "qualification-program creation", "certify/suspend/reinstate/revoke", "substitution start-review/request-info/decide", "waive-testing", "warranty void", "investigation begin-evidence/adjudicate"]
    shared_operations: ["all GET endpoints"]
  - name: ProjectEngineer
    description: "Owner-side engineer; creates projects, specifications, work orders, and issues warranties"
    identity: opaque
    exclusive_operations: ["project create/complete/cancel", "specification create/issue/withdraw", "work-order create/complete/cancel", "warranty issuance"]
    shared_operations: ["all GET endpoints"]
  - name: OwnerRepresentative
    description: "Asset owner delegate; files substitution requests and warranty claims"
    identity: opaque
    exclusive_operations: ["substitution-request create/resubmit", "warranty claim"]
    shared_operations: ["most GET endpoints"]
  - name: ApplicatorRep
    description: "Representative of an applicator company; X-User-ID equals the Applicator.id the rep belongs to"
    identity: entity_backed:Applicator
    exclusive_operations: ["qualification enrollment", "begin-prep-inspection", "coating application creation", "mark-cured"]
    shared_operations: ["applicator/qualification/work-order GET endpoints"]
  - name: Inspector
    description: "Independent coating inspector; must never act on a work order where X-User-ID equals the applicator's id (segregation of duties)"
    identity: opaque
    exclusive_operations: ["prep-inspection filing", "inspection-report filing"]
    shared_operations: ["inspection-related GET endpoints"]
  - name: ComplianceOfficer
    description: "Environmental compliance administrator; owns VOC regulation windows"
    identity: opaque
    exclusive_operations: ["voc-regulation create/supersede"]
    shared_operations: ["all GET endpoints"]
