      - name: stale_stand_version_outranks_the_tonnage_capacity_check
        claim_type: cascading_validation
        grounds:
          - "concurrency_rules[harvest-block-create-stale-stand]"
          - "validations[priority=48 ERR_STALE_STAND_VERSION]"
          - "validations[priority=80 ERR_INSUFFICIENT_AVAILABLE_TONS]"
          - "endpoints[POST /timberland/harvest-blocks]"
        distinguishing_aspect: |
          A single request violates both the version guard at 48 and the tonnage guard at 80. The
          version check must run FIRST: with a stale version the answer is 412
          ERR_STALE_STAND_VERSION even though the tonnage is also impossible, because the caller's
          view of available_tons is by definition untrustworthy. Only after the version is refreshed
          does the 422 ERR_INSUFFICIENT_AVAILABLE_TONS surface. Evaluating tonnage first reports a
          business error for what is actually a lost-update collision.
