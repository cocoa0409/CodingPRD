# =============================================================================
# task_0131_it_asset_license — SCAFFOLD_DIFFICULTY_DESIGN.yaml  (§1.8)
# Test Targeting Index — 9 Difficulty Rules × 2 instances = 18 instances.
# Every grounds[] resolves into SCAFFOLD.yaml §1.1–§1.7. All formula-derived
# asserts are pre-computed literals (see worklog calculations).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: depreciation_book_vs_disposal_divergence
        grounds:
          - calculations.asset_depreciation
          - entities.HardwareAsset.fields.accumulated_depreciation_cents
          - entities.HardwareAsset.fields.net_book_value_cents
          - entities.HardwareAsset.fields.disposal_gain_loss_cents
          - state_machines.HardwareAsset.RETIRED_to_DISPOSED
        distinguishing_aspect: |
          Identical asset inputs yield net_book_value_cents=180000 under the provisional
          (book, whole-month floor) variant but 170000 under the disposal-final (partial-month
          ceil) variant — divergence sits on the HardwareAsset entity domain.
        test_recipe:
          setup:
            - "Vendor (HARDWARE) and one HardwareAsset purchase_cost_cents=360000, salvage=0, useful_life_months=36, in_service_date=2024-01-01."
            - "Server clock at 2025-07-15 (18 whole months elapsed)."
            - "Asset retired via approved disposal, then completed at the same clock (final depreciation books month 19 = ceil)."
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-07-15T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-001", category: "LAPTOP", purchase_cost_cents: 360000, in_service_date: "2024-01-01T00:00:00.000Z", useful_life_months: 36, salvage_value_cents: 0 }
              as: AssetManager
              captures: { aid: $.data.id, nbv_prov: $.data.net_book_value_cents, acc_prov: $.data.accumulated_depreciation_cents }
            - call: "POST /assets/disposal-requests"
              payload: { hardware_asset_id: "${aid}", reason: "END_OF_LIFE", proposed_proceeds_cents: 150000 }
              as: AssetManager
              as_user_id: "mgr-1"
              captures: { dr: $.data.id }
            - call: "POST /assets/disposal-requests/${dr}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /assets/disposal-requests/${dr}/complete"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /assets/hardware/${aid}"
              payload: {}
              as: ComplianceOfficer
              captures: { nbv_final: $.data.net_book_value_cents, gl: $.data.disposal_gain_loss_cents }
          assert:
            - "HardwareAsset.${aid}.accumulated_depreciation_cents == 190000  # final variant (19 months, ceil)"
            - "HardwareAsset.${aid}.net_book_value_cents == 170000           # 360000 - 190000"
            - "provisional net_book_value at create (nbv_prov) == 180000 and differs from 170000 by 10000"
            - "HardwareAsset.${aid}.disposal_gain_loss_cents == -20000        # 150000 proceeds - 170000 nbv"
            - "HardwareAsset.${aid}.status == DISPOSED"

      - name: trueup_live_vs_audit_position_divergence
        grounds:
          - calculations.true_up_position
          - entities.TrueUpReconciliation.fields.position_units
          - entities.TrueUpReconciliation.fields.verdict
          - state_machines.TrueUpReconciliation.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          Same product, same entitlement (entitled=5) and same 4 ACTIVE + 2 PENDING installs yield
          position_units=+1 / COMPLIANT under LIVE but -1 / OVER_DEPLOYED under AUDIT (PENDING installs
          included) — divergence sits on the SoftwareProduct/LicenseEntitlement domain, distinct from
          the HardwareAsset depreciation dual-variant.
        test_recipe:
          setup:
            - "PER_SEAT product; one ACTIVE entitlement entitled_units=5 covering as_of; 4 ACTIVE installs + 2 PENDING installs on it."
            - "Two true-ups created for the product: one LIVE, one AUDIT."
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z", grace_days: 10 }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-SW", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            # 4 installs activated (consume 4), 2 installs left PENDING
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { i1: $.data.id }
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev_a: $.data.version }
            - call: "POST /assets/installations/${i1}/activate"
              payload: {}
              as: AssetManager
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev_a}" }
              as: AssetManager
              captures: { i2: $.data.id }
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev_b: $.data.version }
            - call: "POST /assets/installations/${i2}/activate"
              payload: {}
              as: AssetManager
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev_b}" }
              as: AssetManager
              captures: { i3: $.data.id }
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev_c: $.data.version }
            - call: "POST /assets/installations/${i3}/activate"
              payload: {}
              as: AssetManager
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev_c}" }
              as: AssetManager
              captures: { i4: $.data.id }
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: AssetManager
              captures: { ev_d: $.data.version }
            - call: "POST /assets/installations/${i4}/activate"
              payload: {}
              as: AssetManager
            # 2 PENDING installs (created, not activated)
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev_d}" }
              as: AssetManager
              captures: { i5: $.data.id, ev_e: $.data.version }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev_e}" }
              as: AssetManager
              captures: { i6: $.data.id }
            - call: "POST /assets/true-ups"
              payload: { software_product_id: "${pid}", variant: "LIVE", as_of: "2025-03-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { tu_live: $.data.id }
            - call: "POST /assets/true-ups"
              payload: { software_product_id: "${pid}", variant: "AUDIT", as_of: "2025-03-01T00:00:00.000Z" }
              as: ComplianceOfficer
              captures: { tu_audit: $.data.id }
          trigger:
            - call: "POST /assets/true-ups/${tu_live}/finalize"
              payload: {}
              as: ComplianceOfficer
              captures: { pos_live: $.data.position_units, v_live: $.data.verdict }
            - call: "POST /assets/true-ups/${tu_audit}/finalize"
              payload: {}
              as: ComplianceOfficer
              captures: { pos_audit: $.data.position_units, v_audit: $.data.verdict }
          assert:
            - "TrueUpReconciliation.${tu_live}.position_units == 1"
            - "TrueUpReconciliation.${tu_live}.verdict == COMPLIANT"
            - "TrueUpReconciliation.${tu_audit}.position_units == -1"
            - "TrueUpReconciliation.${tu_audit}.verdict == OVER_DEPLOYED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_core_required_units_nested_max_ceil   # mode (a)
        grounds:
          - calculations.required_core_units
          - entities.InstallationRecord.fields.required_core_units
          - entities.SoftwareProduct.fields.core_factor
          - entities.SoftwareProduct.fields.min_core_units
          - entities.HardwareAsset.fields.physical_cores
        distinguishing_aspect: |
          Mode (a): non-linear formula with 3 interacting inputs — required_core_units =
          max(min_core_units=4, ceil(physical_cores=10 * core_factor=0.5)) = max(4, 5) = 5, where the
          ceil/multiply result (5) wins over the floor (4); a sibling case with cores=6 has the floor win.
        test_recipe:
          setup:
            - "PER_CORE product core_factor=0.5, min_core_units=4; asset physical_cores=10; one install created."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "CoreDB", license_model: "PER_CORE", core_factor: 0.5, min_core_units: 4 }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 50, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "SRV-10C", category: "SERVER", physical_cores: 10, purchase_cost_cents: 500000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { iid: $.data.id, ru: $.data.required_core_units }
          assert:
            - "InstallationRecord.${iid}.required_core_units == 5   # max(4, ceil(10*0.5)) = max(4,5)"

      - name: renewal_cost_round_then_sum_order   # mode (b)
        grounds:
          - calculations.renewal_cost
          - entities.RenewalOrder.fields.quoted_cost_cents
          - state_machines.RenewalOrder.QUOTED_to_COMPLETED
          - entities.LicenseEntitlement.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (b): rounding order matters — round EACH line item to cents then sum gives
          quoted_cost_cents = round(6996.5)=6997 + round(2998.5)=2999 = 9996, whereas sum-then-round
          would give round(9995.0)=9995; the scaffold pins round-then-sum, so 9996 is correct.
        test_recipe:
          setup:
            - "ACTIVE entitlement entitled_units=7, unit_price_cents=1999; renewal order added_units=3, extend_months=6 (half year)."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 7, unit_price_cents: 1999, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/renewal-orders"
              payload: { target_type: "ENTITLEMENT", license_entitlement_id: "${eid}", extend_months: 6, added_units: 3 }
              as: ComplianceOfficer
              captures: { ro: $.data.id }
          trigger:
            - call: "POST /assets/renewal-orders/${ro}/complete"
              payload: { expected_entitlement_version: "${ev}" }
              as: ComplianceOfficer
              captures: { qc: $.data.quoted_cost_cents }
          assert:
            - "RenewalOrder.${ro}.quoted_cost_cents == 9996   # round(6996.5)+round(2998.5), NOT round(9995.0)=9995"
            - "RenewalOrder.${ro}.status == COMPLETED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: hardware_cyclic_checkout_return_repair_loop
        grounds:
          - state_machines.HardwareAsset.IN_STOCK_to_ASSIGNED
          - state_machines.HardwareAsset.ASSIGNED_to_IN_STOCK
          - state_machines.HardwareAsset.IN_STOCK_to_IN_REPAIR
          - state_machines.HardwareAsset.IN_REPAIR_to_IN_STOCK
        distinguishing_aspect: |
          HardwareAsset is cyclic on the HardwareAsset entity: IN_STOCK→ASSIGNED→IN_STOCK and
          IN_STOCK→IN_REPAIR→IN_STOCK both return to the same state, not a linear pipeline.
        test_recipe:
          setup:
            - "One ACTIVE employee and one IN_STOCK asset."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/employees"
              payload: { full_name: "Alice", email: "alice@x.com", department: "ENG" }
              as: AssetManager
              captures: { emp: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-CYC", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/hardware/${aid}/checkout"
              payload: { employee_id: "${emp}", checkout_at: "2025-02-01T00:00:00.000Z", expected_return_at: "2025-02-10T00:00:00.000Z" }
              as: AssetManager
              captures: { co: $.data.id }
            - call: "POST /assets/checkouts/${co}/return"
              payload: {}
              as: AssetManager
          trigger:
            - call: "POST /assets/hardware/${aid}/transition"
              payload: { to_status: "IN_REPAIR" }
              as: AssetManager
            - call: "POST /assets/hardware/${aid}/transition"
              payload: { to_status: "IN_STOCK" }
              as: AssetManager
              captures: { st: $.data.status }
          assert:
            - "HardwareAsset.${aid}.status == IN_STOCK   # returned to IN_STOCK after full cycle"

      - name: entitlement_cyclic_suspend_resume_renew_loop
        grounds:
          - state_machines.LicenseEntitlement.ACTIVE_to_SUSPENDED
          - state_machines.LicenseEntitlement.SUSPENDED_to_ACTIVE
          - state_machines.LicenseEntitlement.ACTIVE_to_RENEWED
        distinguishing_aspect: |
          LicenseEntitlement is cyclic on a different entity than HardwareAsset: ACTIVE→SUSPENDED→ACTIVE
          (revert) and ACTIVE→RENEWED→ACTIVE (renewal lands back on ACTIVE), both loop.
        test_recipe:
          setup:
            - "ACTIVE entitlement; suspended then resumed; then renewed (extend_months=6) landing back on ACTIVE."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
            - call: "POST /assets/entitlements/${eid}/transition"
              payload: { to_status: "SUSPENDED" }
              as: ComplianceOfficer
            - call: "POST /assets/entitlements/${eid}/transition"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { ev: $.data.version }
            - call: "POST /assets/renewal-orders"
              payload: { target_type: "ENTITLEMENT", license_entitlement_id: "${eid}", extend_months: 6 }
              as: ComplianceOfficer
              captures: { ro: $.data.id }
          trigger:
            - call: "POST /assets/renewal-orders/${ro}/complete"
              payload: { expected_entitlement_version: "${ev}" }
              as: ComplianceOfficer
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "LicenseEntitlement.${eid}.status == ACTIVE   # back to ACTIVE after suspend/resume + renewal cycle"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disposal_complete_cascade_depth3
        grounds:
          - state_machines.DisposalRequest.APPROVED_to_COMPLETED
          - state_machines.HardwareAsset.RETIRED_to_DISPOSED
          - state_machines.InstallationRecord.ACTIVE_to_UNINSTALLED
          - entities.LicenseEntitlement.fields.consumed_units
        distinguishing_aspect: |
          Depth-3 chain: complete disposal → HardwareAsset RETIRED→DISPOSED → that disposal mutates each
          ACTIVE InstallationRecord on the asset to UNINSTALLED → each uninstall decrements
          LicenseEntitlement.consumed_units. Each hop is caused by the prior hop, not by the trigger.
        test_recipe:
          setup:
            - "Asset with 1 ACTIVE install charged to entitlement (entitled=5, consumed=1); asset IN_STOCK; disposal SUBMITTED then APPROVED (asset RETIRED)."
          setup_api_calls:
            - call: "POST /assets/_clock/set_current_utc"
              payload: { to_iso8601: "2025-03-01T00:00:00.000Z" }
              as: AssetManager
            - call: "POST /assets/vendors"
              payload: { name: "Mixed", vendor_type: "BOTH", support_email: "s@m.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-DISP", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { iid: $.data.id }
            - call: "POST /assets/installations/${iid}/activate"
              payload: {}
              as: AssetManager
            - call: "POST /assets/disposal-requests"
              payload: { hardware_asset_id: "${aid}", reason: "END_OF_LIFE" }
              as: AssetManager
              as_user_id: "mgr-1"
              captures: { dr: $.data.id }
            - call: "POST /assets/disposal-requests/${dr}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /assets/disposal-requests/${dr}/complete"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /assets/installations/${iid}"
              payload: {}
              as: ComplianceOfficer
              captures: { ist: $.data.status }
            - call: "GET /assets/entitlements/${eid}"
              payload: {}
              as: ComplianceOfficer
              captures: { cu: $.data.consumed_units }
          assert:
            - "HardwareAsset.${aid}.status == DISPOSED"
            - "InstallationRecord.${iid}.status == UNINSTALLED   # hop 2 caused by hop 1 (DISPOSED)"
            - "LicenseEntitlement.${eid}.consumed_units == 0      # hop 3 caused by hop 2 (UNINSTALLED)"

      - name: renewal_complete_cascade_depth2
        grounds:
          - state_machines.RenewalOrder.QUOTED_to_COMPLETED
          - state_machines.LicenseEntitlement.ACTIVE_to_RENEWED
          - entities.LicenseEntitlement.fields.entitled_units
          - entities.LicenseEntitlement.fields.available_units
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (renewal completion, not disposal): complete RenewalOrder
          → LicenseEntitlement gains added_units and extended term (entitled_units 5→8). Distinct propagation
          pattern from the depth-3 disposal cascade.
        test_recipe:
          setup:
            - "ACTIVE entitlement entitled_units=5; renewal order added_units=3, extend_months=12 QUOTED."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 5, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/renewal-orders"
              payload: { target_type: "ENTITLEMENT", license_entitlement_id: "${eid}", extend_months: 12, added_units: 3 }
