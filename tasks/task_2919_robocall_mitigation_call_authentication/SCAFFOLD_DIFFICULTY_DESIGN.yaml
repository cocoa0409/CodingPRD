            - call: "POST /rmd/call-attestations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025550111", called_number: "+12025550999", origination_time: "2026-08-12T00:00:01Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 409, error_id: ERR_SIGNING_SUSPENDED }
          assert:
            - "IllegalTrafficNotice.${not1_id}.state == EXPIRED_UNMITIGATED"
            - "IllegalTrafficNotice.${not2_id}.state == EXPIRED_UNMITIGATED"
            - "Provider.${prov_id}.penalty_points == 10"
            - "Provider.${prov_id}.auth_posture == SIGNING_SUSPENDED"
            - "Provider.${prov_id}.rmd_filing_status == COMPLETE"
            - "Provider.${prov_id}.active_certificate_id == ${cert_id}"
            - "Certificate.${cert_id}.status == ACTIVE"
            - "Customer.${cust_id}.kyc_state == VERIFIED and Customer.${cust_id}.origination_state == ENABLED"
            - "Attestation attempt: HTTP 409 with error.code == ERR_SIGNING_SUSPENDED; no CallAttestation row was created"

      - name: report_certification_blocked_by_operative_plan_state
        grounds:
          - validations[priority=13]
          - state_machines.EffectivenessReport.GENERATED_to_SIGNED_OFF
          - state_machines.MitigationPlan.DEFICIENT_to_SUBMITTED
          - entities.MitigationPlan.fields.filing_state
        distinguishing_aspect: |
          A different entity pair (MitigationPlan -> EffectivenessReport): the report
          row itself is in the only state certify accepts (GENERATED) and the actor
          satisfies segregation of duties, yet certification is refused because the
          provider's operative plan sits in DEFICIENT. Re-submitting and accepting the
          plan — touching no field of the report — makes the identical certify call
          succeed and flips the report's variant to CERTIFIED.
        test_recipe:
          setup:
            - "Provider whose plan was submitted by officer-1 and returned DEFICIENT (deficiency_count 1, penalty_points 2, rmd_filing_status PARTIAL)"
            - "Logical clock at 2026-09-01T00:00:00Z; a PROVISIONAL report generated by officer-2 for the elapsed period [2026-08-01, 2026-09-01) with no underlying rows"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Windrow Telecom LLC", provider_type: "NON_FACILITIES_RESELLER" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v0: $.data.version }
            - call: "POST /rmd/mitigation-plans"
              payload: { provider_id: "${prov_id}", prevention_practices: ["KYC_ONBOARDING", "TRACEBACK_COOPERATION", "CONTRACT_TERMS_PROHIBITION"], expected_provider_version: "${prov_v0}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /rmd/mitigation-plans/${plan_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/mitigation-plans/${plan_id}/decision"
              payload: { decision: "DEFICIENT", deficiency_reasons: ["Traceback contact point not staffed"] }
              as: Regulator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Regulator
            - call: "GET /rmd/providers/${prov_id}"
              payload: {}
              as: Regulator
              captures: { prov_v1: $.data.version }
            - call: "POST /rmd/effectiveness-reports"
              payload: { provider_id: "${prov_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", variant: "PROVISIONAL", expected_provider_version: "${prov_v1}" }
              as: ComplianceOfficer
              as_user_id: "officer-2"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /rmd/effectiveness-reports/${rep_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
              expect: { status: 409, error_id: ERR_PLAN_STATE_INVALID }
            - call: "POST /rmd/mitigation-plans/${plan_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/mitigation-plans/${plan_id}/decision"
              payload: { decision: "ACCEPT" }
              as: Regulator
            - call: "POST /rmd/effectiveness-reports/${rep_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-2"
          assert:
            - "First certify: HTTP 409 with error.code == ERR_PLAN_STATE_INVALID and EffectivenessReport.${rep_id}.state stays GENERATED"
            - "MitigationPlan.${plan_id}.deficiency_count == 1 and MitigationPlan.${plan_id}.revision_count == 1"
            - "MitigationPlan.${plan_id}.filing_state == ACCEPTED after the re-decision"
            - "Provider.${prov_id}.rmd_filing_status == COMPLETE"
            - "Provider.${prov_id}.penalty_points == 2"
            - "EffectivenessReport.${rep_id}.state == SIGNED_OFF"
            - "EffectivenessReport.${rep_id}.variant == CERTIFIED"
            - "EffectivenessReport.${rep_id}.effectiveness_score == 0.6000"
            - "EffectivenessReport.${rep_id}.signed_off_by_user_id == officer-2"

  - rule_id: resource_temporal_overlap
    instances:
      - name: number_assignment_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=31]
          - entities.NumberAssignment.fields.effective_from
          - entities.NumberAssignment.fields.effective_to
          - "endpoints[POST /rmd/number-assignments]"
        distinguishing_aspect: |
          Half-open interval semantics on the shared resource "telephone_number under
          one provider": the second assignment starting exactly where the first ends
          (2026-08-10T00:00:00Z) MUST be accepted, while a third assignment starting
          one second before the second one ends MUST be rejected with
          ERR_NUMBER_INTERVAL_OVERLAP — and an open-ended (effective_to null)
          assignment overlaps everything after its start.
        test_recipe:
          setup:
            - "One provider with two kyc-VERIFIED, origination-ENABLED customers A and B"
            - "Assignment A1 gives +12025550111 to customer A over [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z)"
            - "Logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Quill Voice Networks", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Orchard Outreach A", contact_email: "a@orchard.example", kyc_evidence_level: "BUSINESS_REGISTRY_VERIFIED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_a_id: $.data.id }
            - call: "POST /rmd/customers/${cust_a_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_a_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_a_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Orchard Outreach B", contact_email: "b@orchard.example", kyc_evidence_level: "BUSINESS_REGISTRY_VERIFIED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_b_id: $.data.id }
            - call: "POST /rmd/customers/${cust_b_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_b_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_b_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_a_id}", telephone_number: "+12025550111", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-08-10T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg1_id: $.data.id }
          trigger:
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_b_id}", telephone_number: "+12025550111", ownership_evidence: "PORTED_IN", effective_from: "2026-08-10T00:00:00Z", effective_to: "2026-08-20T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg2_id: $.data.id }
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_a_id}", telephone_number: "+12025550111", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-19T23:59:59Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 409, error_id: ERR_NUMBER_INTERVAL_OVERLAP }
          assert:
            - "Adjacent assignment: HTTP 201, NumberAssignment.${asg2_id}.status == ACTIVE"
            - "NumberAssignment.${asg2_id}.effective_from == 2026-08-10T00:00:00Z"
            - "Overlapping open-ended assignment: HTTP 409 with error.code == ERR_NUMBER_INTERVAL_OVERLAP"
            - "NumberAssignment.${asg1_id}.status == ACTIVE"
            - "Provider.${prov_id}.active_assigned_number_count == 2"

      - name: observation_closed_window_touching_endpoint_collides
        grounds:
          - validations[priority=32]
          - calculations.customer_traffic_risk_index
          - entities.TrafficObservation.fields.window_start
          - "endpoints[POST /rmd/traffic-observations]"
        distinguishing_aspect: |
          The opposite interval semantics on a different resource (a customer's
          monitoring timeline): TrafficObservation windows are CLOSED, so a window
          starting exactly at the previous window_end collides — the mirror image of
          the half-open number-assignment rule. Shifting the start by one second is
          accepted, and the resulting two-window index renormalizes to 0.2000 rather
          than the un-renormalized 0.1600.
        test_recipe:
          setup:
            - "One provider with a kyc-VERIFIED, origination-ENABLED customer"
            - "Observation 1 over the closed window [2026-07-01T00:00:00Z, 2026-07-02T00:00:00Z] with 1000/500/500/0 -> window_subscore 0.40, index 0.4000 (risk_tier ELEVATED)"
            - "Logical clock at the 2026-08-01T00:00:00Z default"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Alder Voice Services", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Rill Marketing Co", contact_email: "ops@rill.example", kyc_evidence_level: "CONTRACT_ONLY" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/traffic-observations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z", total_call_count: 1000, short_duration_call_count: 500, unanswered_call_count: 500, complaint_count: 0 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { obs1_id: $.data.id }
          trigger:
            - call: "POST /rmd/traffic-observations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", window_start: "2026-07-02T00:00:00Z", window_end: "2026-07-03T00:00:00Z", total_call_count: 1000, short_duration_call_count: 100, unanswered_call_count: 100, complaint_count: 0 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 409, error_id: ERR_OBSERVATION_WINDOW_OVERLAP }
            - call: "POST /rmd/traffic-observations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", window_start: "2026-07-02T00:00:01Z", window_end: "2026-07-03T00:00:00Z", total_call_count: 1000, short_duration_call_count: 100, unanswered_call_count: 100, complaint_count: 0 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { obs2_id: $.data.id }
          assert:
            - "Touching window: HTTP 409 with error.code == ERR_OBSERVATION_WINDOW_OVERLAP"
            - "TrafficObservation.${obs1_id}.window_subscore == 0.40"
            - "Shifted window: HTTP 201, TrafficObservation.${obs2_id}.window_subscore == 0.08"
            - "TrafficObservation.${obs2_id}.resulting_risk_index == 0.2000"
            - "Customer.${cust_id}.traffic_risk_index == 0.2000"
            - "Customer.${cust_id}.traffic_risk_index != 0.1600"
            - "Customer.${cust_id}.risk_tier == LOW"

  - rule_id: compensating_invariant
    instances:
      - name: outstanding_forfeiture_conserved_across_dismissal_and_payment
        grounds:
          - calculations.provider_outstanding_forfeiture
          - state_machines.EnforcementAction.CONTESTED_to_DISMISSED
          - state_machines.EnforcementAction.SUSTAINED_to_PAID
          - validations[priority=37]
        distinguishing_aspect: |
          Conserved quantity: MONEY. Provider.outstanding_forfeiture_cents must equal
          the sum of total_forfeiture_cents over actions in {PROPOSED, CONTESTED,
          SUSTAINED} at every step. Two different exits (DISMISSED and PAID) each
          remove their amount while the row's own total_forfeiture_cents is never
          rewritten, and a rejected payment (wrong amount) moves nothing at all:
          2500000 -> 2500000 (contest) -> 1500000 (dismissal) -> 1500000 (rejected
          payment) -> 0 (exact payment), with 2500000 still recorded in the rows.
        test_recipe:
          setup:
            - "Provider with no signed-off effectiveness report, so score_band is NONE and both credits are 0"
            - "Action A1: CONTINUING_DAILY over 6 violation_days -> base 1500000, TIER_1, total 1500000"
            - "Action A2: PER_VIOLATION over 1 violation_count -> base 1000000, TIER_1, total 1000000"
            - "Provider.outstanding_forfeiture_cents == 2500000 before the trigger"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Tamarack Voice LLC", provider_type: "GATEWAY" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/enforcement-actions"
              payload: { provider_id: "${prov_id}", basis: "LATE_TRACEBACK", violation_count: 1, violation_days: 6, assessment_basis: "CONTINUING_DAILY" }
              as: Regulator
              captures: { a1_id: $.data.id }
            - call: "POST /rmd/enforcement-actions"
              payload: { provider_id: "${prov_id}", basis: "FALSE_ATTESTATION", violation_count: 1, violation_days: 6, assessment_basis: "PER_VIOLATION" }
              as: Regulator
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /rmd/enforcement-actions/${a2_id}/contest"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /rmd/enforcement-actions/${a2_id}/adjudicate"
              payload: { outcome: "DISMISS" }
              as: Regulator
            - call: "POST /rmd/enforcement-actions/${a1_id}/pay"
              payload: { amount_cents: 1000000 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 422, error_id: ERR_PAYMENT_AMOUNT_MISMATCH }
            - call: "POST /rmd/enforcement-actions/${a1_id}/pay"
              payload: { amount_cents: 1500000 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          assert:
            - "EnforcementAction.${a1_id}.total_forfeiture_cents == 1500000 and EnforcementAction.${a1_id}.assessment_tier == TIER_1"
            - "EnforcementAction.${a2_id}.total_forfeiture_cents == 1000000"
            - "EnforcementAction.${a2_id}.status == DISMISSED"
            - "Underpayment attempt: HTTP 422 with error.code == ERR_PAYMENT_AMOUNT_MISMATCH and EnforcementAction.${a1_id}.status still PROPOSED"
            - "EnforcementAction.${a1_id}.status == PAID and EnforcementAction.${a1_id}.paid_amount_cents == 1500000"
            - "Provider.${prov_id}.outstanding_forfeiture_cents == 0"
            - "Sum of total_forfeiture_cents over both rows is still 2500000 (dismissal and payment never rewrote the assessed amounts)"

      - name: active_number_inventory_conserved_across_risk_suspension_and_restore
        grounds:
          - calculations.provider_assignment_and_blocking_metrics
          - state_machines.NumberAssignment.SUSPENDED_BY_CUSTOMER_to_REVOKED
          - state_machines.Customer.origination_state.SUSPENDED_to_ENABLED
          - validations[priority=26]
        distinguishing_aspect: |
          A different conserved quantity: NUMBER INVENTORY. Every assignment ever
          created stays accounted for in exactly one partition, and
          Provider.active_assigned_number_count always equals the ACTIVE partition:
          3 (all active) -> 0 (risk suspension moves all three to
          SUSPENDED_BY_CUSTOMER) -> 0 (one is revoked out of the suspended partition)
          -> 2 (regulator restore returns only the two still-suspended ones). The
          refused ProviderAdmin restore proves the count never moves on a rejected
          call, and the revoked number never comes back.
        test_recipe:
          setup:
            - "Provider with one kyc-VERIFIED, origination-ENABLED customer holding three ACTIVE assignments (+12025550111, +12025550222, +12025550333)"
            - "An observation over [2026-07-01T00:00:00Z, 2026-07-02T00:00:00Z] with 100/100/100/1 drives traffic_risk_index to exactly 0.9000, auto-suspending origination with cause TRAFFIC_RISK_THRESHOLD"
            - "Assignment 3 is then revoked out of the SUSPENDED_BY_CUSTOMER partition"
            - "Before the trigger: active_assigned_number_count == 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /rmd/providers"
              payload: { legal_name: "Hollyhock Voice Inc", provider_type: "FACILITIES_BASED" }
              as: Regulator
              captures: { prov_id: $.data.id }
            - call: "POST /rmd/customers"
              payload: { provider_id: "${prov_id}", legal_name: "Pike Street Callers", contact_email: "ops@pike.example", kyc_evidence_level: "BUSINESS_REGISTRY_VERIFIED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cust_id: $.data.id }
            - call: "POST /rmd/customers/${cust_id}/kyc-submit"
              payload: {}
              as: KycAnalyst
              as_user_id: "kyc-1"
            - call: "POST /rmd/customers/${cust_id}/kyc-decision"
              payload: { decision: "VERIFY" }
              as: KycAnalyst
              as_user_id: "kyc-2"
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550111", ownership_evidence: "DIRECT_ALLOCATION", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg1_id: $.data.id }
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550222", ownership_evidence: "PORTED_IN", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg2_id: $.data.id }
            - call: "POST /rmd/number-assignments"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", telephone_number: "+12025550333", ownership_evidence: "LEASED_FROM_CARRIER", effective_from: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { asg3_id: $.data.id }
            - call: "POST /rmd/traffic-observations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z", total_call_count: 100, short_duration_call_count: 100, unanswered_call_count: 100, complaint_count: 1 }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { obs_id: $.data.id }
            - call: "POST /rmd/number-assignments/${asg3_id}/revoke"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "RESTORE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              expect: { status: 403, error_id: ERR_SUSPENSION_CAUSE_NOT_SELF_CLEARABLE }
            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "RESTORE" }
              as: Regulator
          assert:
            - "TrafficObservation.${obs_id}.resulting_risk_index == 0.9000 and TrafficObservation.${obs_id}.triggered_suspension == true"
            - "ProviderAdmin restore: HTTP 403 with error.code == ERR_SUSPENSION_CAUSE_NOT_SELF_CLEARABLE and Provider.${prov_id}.active_assigned_number_count still 0"
            - "Customer.${cust_id}.origination_state == ENABLED after the regulator restore"
            - "Customer.${cust_id}.suspension_cause == null"
            - "NumberAssignment.${asg1_id}.status == ACTIVE"
            - "NumberAssignment.${asg2_id}.status == ACTIVE"
            - "NumberAssignment.${asg3_id}.status == REVOKED"
            - "Provider.${prov_id}.active_assigned_number_count == 2"
            - "Partition sum is conserved: 2 ACTIVE + 0 SUSPENDED_BY_CUSTOMER + 1 REVOKED == 3 assignments ever created"
