            - call: "GET /job-profiles/${jpL_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { ledger_committed: $.data.committed_accommodation_cost_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-03T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /_ops/daily-sweep"
              payload: {}
              as: ComplianceAuditor
            - call: "GET /accommodation-requests/${reqL_id}"
              payload: {}
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
              captures: { reqL_v: $.data.version }
          trigger:
            - call: "POST /accommodation-requests/${reqL_id}/renewal-review"
              payload: { outcome: "CLOSE", expected_request_version: "${reqL_v}" }
              as: AccommodationCoordinator
              as_user_id: "COORD-1"
            - call: "GET /job-profiles/${jpL_id}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "FIN-1"
              captures: { ledger_after: $.data.committed_accommodation_cost_cents }
          assert:
            - "Before the grant: JobProfile.${jpL_id}.committed_accommodation_cost_cents == 0"
            - "After the grant: JobProfile.${jpL_id}.committed_accommodation_cost_cents == 29600 and AccommodationOption.${optL_id}.committed_cost_cents == 29600"
            - "AccommodationRequest.${reqL_id}.review_cadence_days == 365 and review_due_date == 2027-08-03"
            - "The sweep moved AccommodationRequest.${reqL_id}.stage to RENEWAL_DUE"
            - "After the renewal close: JobProfile.${jpL_id}.committed_accommodation_cost_cents == 0, exactly the pre-grant value"
            - "AccommodationOption.${optL_id}.committed_cost_cents == 0 and AccommodationOption.${optL_id}.status == IMPLEMENTED"
            - "AccommodationRequest.${reqL_id}.stage == CLOSED, review_cycle_index == 1, and Employee.${empL_id}.open_case_count == 0"
