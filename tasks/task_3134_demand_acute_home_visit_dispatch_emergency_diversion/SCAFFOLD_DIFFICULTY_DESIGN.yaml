          - state_machines.Claim.ADJUDICATED_DENIED_to_APPEALED
          - state_machines.Claim.APPEALED_to_SUBMITTED
        distinguishing_aspect: |
          Claim has a cycle SUBMITTED → ADJUDICATED_DENIED → APPEALED →
          SUBMITTED (at most 2 appeal rounds). This is a true cycle, distinct
          from the DiagnosticOrder RESULTED → AMENDED → RESULTED cycle.
