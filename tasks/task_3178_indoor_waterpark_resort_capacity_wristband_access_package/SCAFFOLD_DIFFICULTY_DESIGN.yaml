              as: AquaticsManager
              captures: { sh18a_id: "$.data.id" }
            - call: "POST /resorts/${r18_id}/lifeguard-shifts/${sh18a_id}/start"
              payload: {}
              as: AquaticsManager
            - call: "POST /resorts/${r18_id}/lifeguard-shifts/${sh18a_id}/complete"
              payload: {}
              as: AquaticsManager
          trigger:
            - call: "POST /resorts/${r18_id}/lifeguard-shifts"
              payload: { attraction_id: "${att18_id}", staffer_name: "Iris", certification_code: "LIFEGUARD", shift_date: "2026-09-03", start_minute: 600, end_minute: 720, rotation_minutes: 60 }
              as: AquaticsManager
              captures: { err18: "$.data.error_id" }
          assert:
            - "${err18} == ERR_ATTRACTION_NOT_OPEN"
            - "Attraction.${att18_id}.attraction_status == LIMITED"

      - name: cabana_booking_window_overlap_rejected
        grounds:
          - state_machines.Cabana.transitions.AVAILABLE_to_HELD
          - validations[priority=9]
        distinguishing_aspect: |
          A different interval arithmetic on a different resource: the cabana gate tests
          genuine intersection of [start_minute, end_minute) windows rather than a staffer
          rotation buffer, so an intersecting request is rejected while an abutting one
          would be accepted.
        test_recipe:
          setup:
