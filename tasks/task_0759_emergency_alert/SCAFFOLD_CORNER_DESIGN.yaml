# =============================================================================
# Task 0759 — §1.9 Scaffold Corner Design (breadth coverage of testable claims
# not already exercised by §1.8). claim_type values come from
# references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ---- Entities -----------------------------------------------------------
  - section: entities
    instances:
      - name: contact_creation_returns_active
        claim_type: Creation
        grounds: [entities.Contact.fields.status]
        distinguishing_aspect: "POST /contacts with required fields returns 201 and status=ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /contacts", payload: { full_name: "Nia", primary_language: "EN" }, as: ContactAdmin, captures: { st: "$.data.status" } }
          assert:
            - "POST /contacts -> HTTP 201, data.status == ACTIVE"

      - name: contact_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Contact, "errors[ERR_CONTACT_NOT_FOUND]"]
        distinguishing_aspect: "GET /contacts/{unknown-uuid} -> ERR_CONTACT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /contacts/00000000-0000-0000-0000-000000000000", payload: {}, as: ContactAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "GET -> HTTP 404, data.error_id == ERR_CONTACT_NOT_FOUND"

      - name: contact_missing_full_name_returns_validation
        claim_type: Required Fields
        grounds: [entities.Contact.fields.full_name, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /contacts without required full_name -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /contacts", payload: { primary_language: "EN" }, as: ContactAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "POST -> HTTP 400, data.error_id == ERR_VALIDATION"

      - name: contact_primary_language_default_en
        claim_type: Defaults
        grounds: [entities.Contact.fields.primary_language]
        distinguishing_aspect: "Omitting primary_language applies default EN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /contacts", payload: { full_name: "Omar" }, as: ContactAdmin, captures: { lang: "$.data.primary_language" } }
          assert:
            - "POST /contacts -> data.primary_language == EN"

      - name: alert_invalid_severity_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Alert.fields.severity, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /alerts with severity 'SEVERE' (not in enum) -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /alerts", payload: { title: "X", severity: "SEVERE", channels: ["SMS"], target_type: "GEO", center_lat: 0.0, center_lon: 0.0, radius_m: 1000, effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { err: "$.data.error_id" } }
          assert:
            - "POST /alerts -> HTTP 400, data.error_id == ERR_VALIDATION"

      - name: channel_reverse_reachable_from_contact
        claim_type: Parent Relationships
        grounds: [entities.ContactChannel.fields.contact_id]
        distinguishing_aspect: "GET /contacts/{id}/channels returns the contact's channel (FK reverse-reachability array form)."
        test_recipe:
          setup: ["Contact c1 with one SMS channel ch1."]
          setup_api_calls:
            - { call: "POST /contacts", payload: { full_name: "Pia", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550040" }, as: ContactAdmin, captures: { ch1: "$.data.id" } }
          trigger:
            - { call: "GET /contacts/${c1}/channels", payload: {}, as: ContactAdmin, captures: { first_id: "$.data[0].id" } }
          assert:
            - "GET /contacts/${c1}/channels -> response_type array, data[0].id == ${ch1}"

  # ---- State Machines -----------------------------------------------------
  - section: state_machines
    instances:
      - name: confirm_channel_wrong_token_returns_invalid_token
        claim_type: Precondition Enforcement
        grounds: [state_machines.ContactChannel.PENDING_to_CONFIRMED, "errors[ERR_INVALID_TOKEN]"]
        distinguishing_aspect: "POST /channels/{id}/confirm with a token that does not match -> ERR_INVALID_TOKEN (422); channel stays PENDING."
        test_recipe:
          setup: ["Contact c1 with a PENDING SMS channel ch1."]
          setup_api_calls:
            - { call: "POST /contacts", payload: { full_name: "Quinn", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550041" }, as: ContactAdmin, captures: { ch1: "$.data.id" } }
          trigger:
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "WRONG-TOKEN" }, as: Contact, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "confirm -> HTTP 422, data.error_id == ERR_INVALID_TOKEN"

      - name: approve_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Alert.PENDING_APPROVAL_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /alerts/{id}/approve while the alert is still DRAFT (never submitted) -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Alert a1 (GEO) in DRAFT with one localization."]
          setup_api_calls:
            - { call: "POST /alerts", payload: { title: "D", severity: "WARNING", channels: ["SMS"], target_type: "GEO", center_lat: 0.0, center_lon: 0.0, radius_m: 1000, effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Draft." }, as: Dispatcher, as_user_id: "disp1" }
          trigger:
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { err: "$.data.error_id" } }
          assert:
            - "approve -> HTTP 409, data.error_id == ERR_INVALID_STATE"

      - name: drill_auto_completes_on_tick_when_due
        claim_type: Valid Transition
        grounds: [state_machines.Drill.SCHEDULED_to_COMPLETED, entities.Drill.fields.scheduled_end]
        distinguishing_aspect: "A SCHEDULED drill whose scheduled_end has passed transitions to COMPLETED on the next POST /_tick/run (system transition)."
        test_recipe:
          setup: ["Clock 2026-03-12T09:00:00Z; group g1 with a drill d1 [10:00,11:00]."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-12T09:00:00Z" }, as: Integrator }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /drills", payload: { group_id: "${g1}", scheduled_start: "2026-03-12T10:00:00Z", scheduled_end: "2026-03-12T11:00:00Z" }, as: ContactAdmin, captures: { d1: "$.data.id" } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-12T12:00:00Z" }, as: Integrator }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /drills/${d1}", payload: {}, as: ContactAdmin, captures: { st: "$.data.status" } }
          assert:
            - "GET /drills/${d1} -> data.status == COMPLETED"

      - name: acknowledge_sets_receipt_and_delivers
        claim_type: Side Effect Execution
        grounds: [state_machines.Notification.NONE_to_ACKNOWLEDGED, state_machines.Notification.SENT_to_DELIVERED, entities.Notification.fields.receipt_status]
        distinguishing_aspect: "POST /notifications/{id}/acknowledge on a SENT notification sets receipt_status=ACKNOWLEDGED (parallel dimension) and also advances delivery_status SENT->DELIVERED."
        test_recipe:
          setup: ["Clock 2026-03-10T14:00:00Z; alert a1 dispatched to c1, ticked so notification n1 is SENT."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "Rex", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550042" }, as: ContactAdmin, captures: { ch1: "$.data.id", tok1: "$.data.confirmation_token" } }
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "${tok1}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /_tick/run", payload: {}, as: Integrator }
            - { call: "GET /notifications", payload: { alert_id: "${a1}" }, as: Dispatcher, as_user_id: "disp1", captures: { n1: "$.data[0].id" } }
          trigger:
            - { call: "POST /notifications/${n1}/acknowledge", payload: {}, as: Contact, as_user_id: "${c1}", captures: { rec: "$.data.receipt_status", dst: "$.data.delivery_status" } }
          assert:
            - "Notification.${n1}.receipt_status == ACKNOWLEDGED"
            - "Notification.${n1}.delivery_status == DELIVERED"

      - name: subscription_cancel_updates_member_count
        claim_type: Valid Transition
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, entities.Group.fields.member_count]
        distinguishing_aspect: "A GROUP subscription bumps Group.member_count to 1; cancelling it drops member_count back to 0."
        test_recipe:
          setup: ["Contact c1 subscribed (GROUP) to group g1 (member_count 1)."]
          setup_api_calls:
            - { call: "POST /contacts", payload: { full_name: "Sy", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin, captures: { s1: "$.data.id" } }
            - { call: "GET /groups/${g1}", payload: {}, as: ContactAdmin, captures: { mc_before: "$.data.member_count" } }
          trigger:
            - { call: "POST /subscriptions/${s1}/cancel", payload: {}, as: ContactAdmin }
            - { call: "GET /groups/${g1}", payload: {}, as: ContactAdmin, captures: { mc_after: "$.data.member_count" } }
          assert:
            - "before cancel, Group.${g1}.member_count == 1"
            - "after cancel, Group.${g1}.member_count == 0"

  # ---- Endpoints ----------------------------------------------------------
  - section: endpoints
    instances:
      - name: alerts_list_pagination
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /alerts?limit=1 returns an array of 1 with pagination meta has_more=true and total_count=2 when two alerts exist."
        test_recipe:
          setup: ["Two GEO alerts exist."]
          setup_api_calls:
            - { call: "POST /alerts", payload: { title: "A", severity: "WARNING", channels: ["SMS"], target_type: "GEO", center_lat: 0.0, center_lon: 0.0, radius_m: 1000, effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts", payload: { title: "B", severity: "WARNING", channels: ["SMS"], target_type: "GEO", center_lat: 0.0, center_lon: 0.0, radius_m: 1000, effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1" }
          trigger:
            - { call: "GET /alerts", payload: { limit: 1, offset: 0 }, as: Dispatcher, as_user_id: "disp1" }
          assert:
            - "GET /alerts?limit=1&offset=0 -> response_type array, len(data)==1, meta.total_count == 2, meta.has_more == true"

      - name: integration_ingest_creates_draft_alert
        claim_type: Computed read
        grounds: [endpoints, entities.Alert.fields.source_incident_ref, entities.Alert.fields.status]
        distinguishing_aspect: "POST /_integration/ingest_incident creates a DRAFT GEO Alert with source_incident_ref set from the external ref (CAD/weather integration)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /_integration/ingest_incident", payload: { source: "CAD", external_ref: "INC-1", severity: "WARNING", center_lat: 0.0, center_lon: 0.0, radius_m: 1000, channels: ["SMS"] }, as: Integrator, captures: { st: "$.data.status", ref: "$.data.source_incident_ref" } }
          assert:
            - "ingest -> HTTP 201, data.status == DRAFT, data.source_incident_ref == INC-1"

  # ---- RBAC ---------------------------------------------------------------
  - section: rbac
    instances:
      - name: contact_role_cannot_compose_alert
        claim_type: Cannot perform other roles' exclusive_operations
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Contact calling POST /alerts (a Dispatcher-exclusive op) -> ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Contact c1 exists."]
          setup_api_calls:
            - { call: "POST /contacts", payload: { full_name: "Tay", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /alerts", payload: { title: "X", severity: "WARNING", channels: ["SMS"], target_type: "GEO", center_lat: 0.0, center_lon: 0.0, radius_m: 1000, effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Contact, as_user_id: "${c1}", captures: { err: "$.data.error_id" } }
          assert:
            - "POST /alerts -> HTTP 403, data.error_id == ERR_UNAUTHORIZED"

      - name: author_cannot_approve_own_alert_segregation
        claim_type: Segregation of duties
        grounds: [state_machines.Alert.PENDING_APPROVAL_to_APPROVED, "errors[ERR_SEGREGATION_OF_DUTIES]", entities.Alert.fields.author_user_id]
        distinguishing_aspect: "An Approver whose X-User-ID equals the alert's author_user_id (disp1) -> ERR_SEGREGATION_OF_DUTIES (409)."
        test_recipe:
          setup: ["Alert a1 authored by disp1, submitted to PENDING_APPROVAL."]
          setup_api_calls:
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
          trigger:
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "disp1", captures: { err: "$.data.error_id" } }
          assert:
            - "approve by author -> HTTP 409, data.error_id == ERR_SEGREGATION_OF_DUTIES"

      - name: unknown_role_returns_unauthenticated
        claim_type: Cannot perform other roles' exclusive_operations
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unrecognized X-User-Role -> ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /contacts", payload: { full_name: "Uma" }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "POST /contacts with unknown role -> HTTP 401, data.error_id == ERR_UNAUTHENTICATED"

  # ---- Errors (uncovered triggers) ---------------------------------------
  - section: errors
    instances:
      - name: duplicate_group_subscription_rejected
        claim_type: Violation → Error
        grounds: ["errors[ERR_DUPLICATE_SUBSCRIPTION]", "validations[priority=7]"]
        distinguishing_aspect: "A second ACTIVE GROUP subscription for the same (contact, group) -> ERR_DUPLICATE_SUBSCRIPTION (409)."
        test_recipe:
          setup: ["Contact c1 already has an ACTIVE GROUP subscription to g1."]
          setup_api_calls:
            - { call: "POST /contacts", payload: { full_name: "Val", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
          trigger:
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "second subscribe -> HTTP 409, data.error_id == ERR_DUPLICATE_SUBSCRIPTION"

      - name: invalid_window_on_submit
        claim_type: Violation → Error
        grounds: ["errors[ERR_INVALID_WINDOW]", "validations[priority=7]"]
        distinguishing_aspect: "Submitting an alert whose effective_from == effective_until -> ERR_INVALID_WINDOW (409)."
        test_recipe:
          setup: ["Alert a1 (GEO) with effective_from == effective_until and one localization."]
          setup_api_calls:
            - { call: "POST /alerts", payload: { title: "W", severity: "WARNING", channels: ["SMS"], target_type: "GEO", center_lat: 0.0, center_lon: 0.0, radius_m: 1000, effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-10T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "W." }, as: Dispatcher, as_user_id: "disp1" }
          trigger:
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { err: "$.data.error_id" } }
          assert:
            - "submit -> HTTP 409, data.error_id == ERR_INVALID_WINDOW"

      - name: target_required_on_submit_geo_missing_circle
        claim_type: Violation → Error
        grounds: ["errors[ERR_TARGET_REQUIRED]", state_machines.Alert.DRAFT_to_PENDING_APPROVAL]
        distinguishing_aspect: "Submitting a GEO alert with no center_lat/center_lon/radius_m -> ERR_TARGET_REQUIRED (422)."
        test_recipe:
          setup: ["Alert a1 target_type=GEO with no circle fields, one localization."]
          setup_api_calls:
            - { call: "POST /alerts", payload: { title: "G", severity: "WARNING", channels: ["SMS"], target_type: "GEO", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "G." }, as: Dispatcher, as_user_id: "disp1" }
          trigger:
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1", captures: { err: "$.data.error_id" } }
          assert:
            - "submit -> HTTP 422, data.error_id == ERR_TARGET_REQUIRED"

      - name: no_recipients_on_empty_group_dispatch
        claim_type: Violation → Error
        grounds: ["errors[ERR_NO_RECIPIENTS]", "validations[priority=11]"]
        distinguishing_aspect: "Dispatching an APPROVED alert targeting a group with zero eligible recipients -> ERR_NO_RECIPIENTS (422) (empty-set edge)."
        test_recipe:
          setup: ["Clock 2026-03-10T14:00:00Z; SMS gateway; empty group g1; alert a1 (GROUP=g1) approved."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
          trigger:
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1}" }, as: Dispatcher, as_user_id: "disp1", captures: { err: "$.data.error_id" } }
          assert:
            - "dispatch -> HTTP 422, data.error_id == ERR_NO_RECIPIENTS"

  # ---- Cross-Cutting Complexity Layers -----------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: dispatch_stale_expected_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dispatch-stale-alert]", "errors[ERR_STALE_VERSION]", entities.Alert.fields.version]
        distinguishing_aspect: "Dispatching with expected_alert_version one less than the current Alert.version -> ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Clock 2026-03-10T14:00:00Z; alert a1 approved with contact c1 CONFIRMED SMS in g1; av1 captured from approve."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T14:00:00Z" }, as: Integrator }
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin }
            - { call: "POST /contacts", payload: { full_name: "Wes", primary_language: "EN" }, as: ContactAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /contacts/${c1}/channels", payload: { channel_type: "SMS", address: "+15550043" }, as: ContactAdmin, captures: { ch1: "$.data.id", tok1: "$.data.confirmation_token" } }
            - { call: "POST /channels/${ch1}/confirm", payload: { confirmation_token: "${tok1}" }, as: Contact, as_user_id: "${c1}" }
            - { call: "POST /groups", payload: { name: "G1" }, as: ContactAdmin, captures: { g1: "$.data.id" } }
            - { call: "POST /subscriptions", payload: { contact_id: "${c1}", subscription_type: "GROUP", group_id: "${g1}" }, as: ContactAdmin }
            - { call: "POST /alerts", payload: { title: "Warn", severity: "WARNING", channels: ["SMS"], target_type: "GROUP", target_group_id: "${g1}", effective_from: "2026-03-10T00:00:00Z", effective_until: "2026-03-11T00:00:00Z" }, as: Dispatcher, as_user_id: "disp1", captures: { a1: "$.data.id" } }
            - { call: "POST /alerts/${a1}/localizations", payload: { language: "EN", message_text: "Warning." }, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/submit", payload: {}, as: Dispatcher, as_user_id: "disp1" }
            - { call: "POST /alerts/${a1}/approve", payload: {}, as: Approver, as_user_id: "appr1", captures: { av1: "$.data.version" } }
          trigger:
            - { call: "POST /alerts/${a1}/dispatch", payload: { expected_alert_version: "${av1} - 1" }, as: Dispatcher, as_user_id: "disp1", captures: { err: "$.data.error_id" } }
          assert:
            - "dispatch with stale version -> HTTP 412, data.error_id == ERR_STALE_VERSION"

  # ---- Consistency Model --------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_created_gateway
        claim_type: immediate
        grounds: [entities.Gateway.fields.window_count]
        distinguishing_aspect: "A freshly created gateway is immediately readable with window_count == 0 in the same session (immediate consistency)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /gateways", payload: { name: "SMS-GW", channel_type: "SMS", capacity_per_window: 100 }, as: ContactAdmin, captures: { gw1: "$.data.id" } }
          trigger:
            - { call: "GET /gateways/${gw1}", payload: {}, as: ContactAdmin, captures: { wc: "$.data.window_count" } }
          assert:
            - "GET /gateways/${gw1} -> data.window_count == 0"

  # ---- excluded_because stubs (already exercised by §1.8) -----------------
  - section: errors
    instances:
      - name: error_throttle_exceeded_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_THROTTLE_EXCEEDED]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / throttle_capacity_count_boundary_on_dispatch
          rationale: "ERR_THROTTLE_EXCEEDED is the reject side of the throttle count-boundary §1.8 instance."

      - name: error_accessibility_unmet_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_ACCESSIBILITY_UNMET]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / safety_beats_temporal_on_tty_expired_dispatch
          rationale: "ERR_ACCESSIBILITY_UNMET is asserted as the winning error of that priority-conflict §1.8 instance."

      - name: error_template_not_published_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_TEMPLATE_NOT_PUBLISHED]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / alert_submit_requires_published_template
          rationale: "ERR_TEMPLATE_NOT_PUBLISHED is the failure path of that cross-entity §1.8 instance."

      - name: error_group_not_open_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_GROUP_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / subscription_requires_open_group
          rationale: "ERR_GROUP_NOT_OPEN is the failure path of that cross-entity §1.8 instance."

      - name: error_window_overlap_stub
        claim_type: Violation → Error
        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / gateway_maintenance_halfopen_overlap
          rationale: "ERR_WINDOW_OVERLAP is asserted by both temporal-overlap §1.8 instances."

  - section: state_machines
    instances:
      - name: cascade_optout_suppression_stub
        claim_type: Side Effect Execution
        grounds: [state_machines.ContactChannel.CONFIRMED_to_OPTED_OUT]
        excluded_because:
          difficulty_instance: transitive_cascade / optout_suppresses_notification_then_autocloses_alert
          rationale: "The opt-out suppression cascade is fully exercised by that §1.8 depth-3 instance."

      - name: dispatch_invalid_state_stub
        claim_type: Invalid Transitions
        grounds: [state_machines.Alert.APPROVED_to_DISPATCHING]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_unapproved_throttled_dispatch
          rationale: "Dispatching a non-APPROVED alert returning ERR_INVALID_STATE is exercised by that §1.8 instance."
