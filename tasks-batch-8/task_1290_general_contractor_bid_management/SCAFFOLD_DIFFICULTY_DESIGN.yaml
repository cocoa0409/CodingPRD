              as: LeadEstimator
            - call: "POST /prequal-applications/${app_w}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: LeadEstimator
          trigger:
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_w}", declared_annual_revenue_cents: 3500000000, declared_emr: 0.75, declared_bonding_capacity_cents: 1800000000 }
              as: Subcontractor
              as_user_id: "${sub_w}"
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-03T00:00:00Z" }
              as: LeadEstimator
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_w}", declared_annual_revenue_cents: 3500000000, declared_emr: 0.75, declared_bonding_capacity_cents: 1800000000 }
              as: Subcontractor
              as_user_id: "${sub_w}"
              captures: { app_w2: $.data.id }
          assert:
            - "At 2026-08-10 (inside window): HTTP 409, error_id == ERR_PREQUAL_WINDOW_OVERLAP"
            - "At 2027-08-03 (window closed at 2027-08-02): HTTP 201, new application ${app_w2} SUBMITTED"
            - "GET /prequal-applications/${app_w}: status == EXPIRED (lazy expiry at read)"
            - "Subcontractor.${sub_w}.current_prequal_status == SUBMITTED"

  - rule_id: compensating_invariant
    instances:
      - name: leveling_adjustment_add_delete_conserves_leveled_total
        grounds:
          - calculations.leveled_bid_amount
        distinguishing_aspect: |
          Conserved quantity is the money total leveled_amount_cents
          (= base_bid_cents + sum of resolved non-EXCLUDED adjustments):
          adding a 50000 GC_ALLOWANCE adjustment then deleting it returns the
          leveling sheet to exactly the pre-add value, no drift.
        test_recipe:
          setup:
            - "Package BIDDING_CLOSED; bid SUBMITTED base 1000000 (bond 50000); no adjustments yet"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Level LLC", contact_email: "l@x.com", license_number: "LIC-L-1101" }
              as: Anonymous
              captures: { sub_l: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_l}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_l}"
              captures: { app_l: $.data.id }
            - call: "POST /prequal-applications/${app_l}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Leveling Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_l}" }
              as: LeadEstimator
              captures: { inv_l: $.data.id }
            - call: "POST /invitations/${inv_l}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_l}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_l}"
              captures: { bid_l: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T15:00:00Z" }
              as: LeadEstimator
            - call: "POST /bid-packages/${pkg}/close-bidding"
              as: LeadEstimator
            - call: "GET /bids/${bid_l}/leveling-sheet"
              as: LeadEstimator
          trigger:
            - call: "POST /leveling-adjustments"
              payload: { bid_id: "${bid_l}", description: "temp bracing allowance", treatment: "GC_ALLOWANCE", amount_cents: 50000 }
              as: LeadEstimator
              captures: { adj: $.data.id }
            - call: "GET /bids/${bid_l}/leveling-sheet"
              as: LeadEstimator
            - call: "DELETE /leveling-adjustments/${adj}"
              as: LeadEstimator
            - call: "GET /bids/${bid_l}/leveling-sheet"
              as: LeadEstimator
          assert:
            - "Baseline sheet: leveled_amount_cents == 1000000"
            - "After add: leveled_amount_cents == 1050000"
            - "After delete (compensating action): leveled_amount_cents == 1000000 exactly (invariant: base + SUM(resolved) unchanged by add+delete pair)"
            - "GET /bids/${bid_l}/leveling-adjustments returns 0 rows after delete"

      - name: bid_submit_withdraw_conserves_submitted_count
        grounds:
          - state_machines.Bid.null_to_SUBMITTED
          - state_machines.Bid.SUBMITTED_to_WITHDRAWN
          - entities.BidPackage.fields.submitted_bid_count
        distinguishing_aspect: |
          Conserved quantity is the count submitted_bid_count (different
          quantity type than the money invariant): submission increments it,
          withdrawal decrements it, and the pair leaves the package counter
          exactly at its pre-submission value.
        test_recipe:
          setup:
            - "Package PUBLISHED (submitted_bid_count == 0); sub prequalified, BIDDING"
          setup_api_calls:
            - call: "POST /subcontractors"
              payload: { legal_name: "Counter LLC", contact_email: "c@x.com", license_number: "LIC-C-1102" }
              as: Anonymous
              captures: { sub_c: $.data.id }
            - call: "POST /prequal-applications"
              payload: { subcontractor_id: "${sub_c}", declared_annual_revenue_cents: 3000000000, declared_emr: 0.80, declared_bonding_capacity_cents: 1500000000 }
              as: Subcontractor
              as_user_id: "${sub_c}"
              captures: { app_c: $.data.id }
            - call: "POST /prequal-applications/${app_c}/decision"
              payload: { decision: "APPROVED", verified_annual_revenue_cents: 4000000000, verified_emr: 0.80, verified_bonding_capacity_cents: 2000000000 }
              as: PrequalReviewer
            - call: "POST /bid-packages"
              payload: { name: "Counter Package", trade_code: "051200", bid_due_at: "2026-08-10T14:00:00Z" }
              as: LeadEstimator
              captures: { pkg: $.data.id }
            - call: "POST /invitations"
              payload: { bid_package_id: "${pkg}", subcontractor_id: "${sub_c}" }
              as: LeadEstimator
              captures: { inv_c: $.data.id }
            - call: "POST /invitations/${inv_c}/respond"
              payload: { intent: "BIDDING" }
              as: Subcontractor
              as_user_id: "${sub_c}"
            - call: "POST /bid-packages/${pkg}/publish"
              as: LeadEstimator
          trigger:
            - call: "POST /bids"
              payload: { bid_package_id: "${pkg}", base_bid_cents: 1000000, bond_amount_cents: 50000 }
              as: Subcontractor
              as_user_id: "${sub_c}"
              captures: { bid_c: $.data.id }
            - call: "GET /bid-packages/${pkg}"
              as: LeadEstimator
            - call: "POST /bids/${bid_c}/withdraw"
              as: Subcontractor
              as_user_id: "${sub_c}"
            - call: "GET /bid-packages/${pkg}"
              as: LeadEstimator
          assert:
            - "After submission: BidPackage.${pkg}.submitted_bid_count == 1"
            - "After withdrawal: BidPackage.${pkg}.submitted_bid_count == 0 (exactly the pre-submission value)"
            - "Bid.${bid_c}.status == WITHDRAWN"
