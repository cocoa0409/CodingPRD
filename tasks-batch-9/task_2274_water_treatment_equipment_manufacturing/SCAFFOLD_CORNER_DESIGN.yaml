      - name: mech_complete_after_rework_lifts_the_package_hold_before_readiness_is_recomputed
        claim_type: action_endpoint
        grounds:
          - state_machines.Skid.HYDROTEST_PASSED_to_MECH_COMPLETE
          - calculations.skid_fat_readiness
          - calculations.project_delivery_posture
        distinguishing_aspect: |
          The milestone endpoint's side effects are ordered: the MECH_COMPLETE write first returns
          the parent package REWORK_HOLD -> RELEASED_FOR_FAB and only then recomputes
          fat_readiness, which is why readiness lands on READY rather than NOT_READY. Posture is
          recomputed in the same request and settles on AT_RISK, not ON_TRACK, because the FAILED
          FatRun is still on the record even though the hold is lifted; rework_count stays 1.
        test_recipe:
          setup:
            - 'the project''s only skid failed FAT round 1, so mechanical_status is REWORK, rework_count 1, fat_readiness BLOCKED'
            - 'the parent package sits in REWORK_HOLD and Project.delivery_posture is HELD'
