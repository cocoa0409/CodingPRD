              as: StoreManager
            - call: "POST /stations"
              payload: { store_id: "${store14}", station_type: "DRESS", capacity: 2 }
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /parties"
              payload: { store_id: "${store14}", customer_id: "${cust14}", party_start: "2026-10-06T18:00:00Z", duration_minutes: 120, guest_count: 6, package_tier: "BASIC", staffing_mode: "SELF_GUIDED" }
              as: Customer
              as_user_id: "${cust14}"
              captures: { party14: $.data.id }
            - call: "POST /parties/${party14}/pay-deposit"
              payload: { payment_amount_cents: 10000 }
              as: Customer
              as_user_id: "${cust14}"
            - call: "POST /party-guests"
              payload: { party_reservation_id: "${party14}", guest_name: "Open Guest" }
              as: Customer
              as_user_id: "${cust14}"
              captures: { g14: $.data.id }
            - call: "POST /party-guests/${g14}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust14}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T20:00:00Z" }
              as: StoreManager
            - call: "GET /parties/${party14}/guests"
              payload: {}
              as: Customer
              as_user_id: "${cust14}"
              captures: { g14s: "$.data[0].workshop_session_id" }
          trigger:
            - call: "POST /parties/${party14}/finalize"
              payload: {}
              as: StoreManager
              captures: { err6: $.data.error_id }
            - call: "POST /workshops/${g14s}/abandon"
              payload: {}
              as: WorkshopAssociate
            - call: "POST /parties/${party14}/finalize"
              payload: {}
              as: StoreManager
              captures: { final14: $.data }
          assert:
            - "err6 == ERR_INVALID_STATE (a CONFIRMED guest's session still SELECT — PartyReservation finalize gated on child PartyGuest/session states)"
            - "final14.status == COMPLETED (after the session's abandonment flipped the guest to NO_SHOW)"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: two overlap rules with DIFFERENT
  # interval semantics on different resources.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: party_host_overlap_with_touching_endpoints_allowed
        grounds:
          - calculations.party_host_selector
          - state_machines.PartyReservation.QUOTED_to_DEPOSIT_PAID
        distinguishing_aspect: |
          Resource: StaffMember (host). Semantics: half-open [start, end)
          intervals where TOUCHING endpoints do not conflict. Host H booked
          10:00-12:00; a second STAFF_HOSTED party at 12:00-14:00 succeeds with
          the SAME host, while one at 11:00-13:00 fails with
          ERR_HOST_UNAVAILABLE.
        test_recipe:
          setup:
            - "Store S15 (4 rooms); Customers C15a, C15b, C15c; one PARTY_HOST H15"
            - "Party A STAFF_HOSTED 10:00-12:00 deposit paid (host reserved); clock 2026-10-01"
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Host Store", party_room_count: 4 }
              as: StoreManager
              captures: { store15: $.data.id }
            - call: "POST /staff"
              payload: { store_id: "${store15}", display_name: "Host Solo", role_title: "PARTY_HOST" }
              as: StoreManager
              captures: { host15: $.data.id }
            - call: "POST /customers"
              payload: { email: "c15a@example.com", full_name: "HA" }
              as: Customer
              captures: { c15a: $.data.id }
            - call: "POST /customers"
              payload: { email: "c15b@example.com", full_name: "HB" }
              as: Customer
              captures: { c15b: $.data.id }
            - call: "POST /customers"
              payload: { email: "c15c@example.com", full_name: "HC" }
              as: Customer
              captures: { c15c: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /parties"
              payload: { store_id: "${store15}", customer_id: "${c15a}", party_start: "2026-10-10T10:00:00Z", duration_minutes: 120, guest_count: 6, package_tier: "BASIC", staffing_mode: "STAFF_HOSTED" }
              as: Customer
              as_user_id: "${c15a}"
              captures: { pa15: $.data.id }
            - call: "POST /parties/${pa15}/pay-deposit"
              payload: { payment_amount_cents: 10000 }
              as: Customer
              as_user_id: "${c15a}"
            - call: "POST /parties"
              payload: { store_id: "${store15}", customer_id: "${c15b}", party_start: "2026-10-10T12:00:00Z", duration_minutes: 120, guest_count: 6, package_tier: "BASIC", staffing_mode: "STAFF_HOSTED" }
              as: Customer
              as_user_id: "${c15b}"
              captures: { pb15: $.data.id }
            - call: "POST /parties"
              payload: { store_id: "${store15}", customer_id: "${c15c}", party_start: "2026-10-10T11:00:00Z", duration_minutes: 120, guest_count: 6, package_tier: "BASIC", staffing_mode: "STAFF_HOSTED" }
              as: Customer
              as_user_id: "${c15c}"
              captures: { pc15: $.data.id }
          trigger:
            - call: "POST /parties/${pb15}/pay-deposit"
              payload: { payment_amount_cents: 10000 }
              as: Customer
              as_user_id: "${c15b}"
              captures: { pb15_after: $.data }
            - call: "POST /parties/${pc15}/pay-deposit"
              payload: { payment_amount_cents: 10000 }
              as: Customer
              as_user_id: "${c15c}"
              captures: { err7: $.data.error_id }
          assert:
            - "pb15_after.status == DEPOSIT_PAID (touching endpoint 12:00 == existing block_end is NOT an overlap)"
            - "err7 == ERR_HOST_UNAVAILABLE (11:00-13:00 strictly overlaps 10:00-12:00)"

      - name: station_buffer_window_overlap_vs_half_open_room_semantics
        grounds:
          - calculations.walkin_capacity_occupancy
          - calculations.party_host_selector
          - "validations[priority=8]"
        distinguishing_aspect: |
          Resource: Station (distinct from StaffMember). Semantics differ from
          the host rule: a station's occupancy interval includes setup/teardown
          buffers — [start-15min, start+45+15min) — so a session starting 30
          minutes after another still collides (buffered overlap), whereas the
          party-room rule treats raw touching intervals as non-overlapping.
          With capacity 1, back-to-back walk-ins 30 minutes apart are rejected.
        test_recipe:
          setup:
            - "Store S16; Customers C16a, C16b; non-licensed model; STUFF station capacity 1 (others capacity 1)"
            - "Consumables provisioned; clock 2026-10-01T10:00:00Z"
          setup_api_calls:
