  - rule_id: combinatorial_formula
    instances:

      - name: volunteer_capacity_nested_minima_with_fatigue_step_mode_a
        grounds:
          - calculations.volunteer_assembly_throughput
          - entities.VolunteerEvent.fields.planned_kit_capacity
          - entities.CollectionSite.fields.bin_capacity
          - entities.DistributionEvent.fields.seat_capacity
        distinguishing_aspect: |
          MODE (a): a five-input non-linear formula — volunteer_count, exact duration,
          the event_type rate branch, a stepped fatigue factor and two nested minima
          against station capacity and open kit demand — where 8 volunteers over 6.5
          hours give floor(8*6*6.5*0.85) = 265, below station capacity 480 and demand
          400, so planned_kit_capacity is 265 and not 312 (the fatigue-free value).
        test_recipe:
          setup:
            - "Cycle 'Back-to-School 2026' is COLLECTING; Lincoln Elementary is ACTIVE with max_concurrent_seats 500."
            - "A DRAFT distribution event with seat_capacity 400 leaves 400 kits of open demand."
            - "Collection site 'Civic Center' has bin_capacity 40 and operational_status ACTIVE."
          setup_api_calls:
            - call: "POST /schools"
              payload: { name: "Lincoln Elementary", district_code: "D7", title_i_pct: 0.80, enrollment_count: 900, max_concurrent_seats: 500 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { school_id: $.data.id }
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "MOU_PENDING" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "PATCH /schools/${school_id}/partnership-status"
              payload: { target_status: "ACTIVE" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /drive-cycles"
