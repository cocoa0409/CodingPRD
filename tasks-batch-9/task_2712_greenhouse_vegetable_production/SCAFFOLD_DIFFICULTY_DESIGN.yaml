  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: ipm_lock_outranks_harvest_too_early_on_lot_registration
        grounds:
          - validations[priority=13]
          - validations[priority=31]
          - calculations.pest_threshold_status
          - calculations.zone_posture_derivation
          - errors[ERR_ZONE_IPM_LOCKED]
          - errors[ERR_HARVEST_TOO_EARLY]
        distinguishing_aspect: |
          Error-category pair is business_safety (priority 13, ERR_ZONE_IPM_LOCKED) versus
          business_temporal (priority 31, ERR_HARVEST_TOO_EARLY). A single POST /harvest-lots violates
          both at once - the zone is IPM LOCKED and the harvest_date is four days before
          first_harvest_allowed_date - and the safety error must win.
        test_recipe:
          setup:
            - "Clock at 2026-08-24T06:00:00Z, one zone, one crop cycle in PRODUCTION with first_harvest_allowed_date 2026-08-24."
            - "One SCOUT worker and one HARVEST worker."
            - "Two above-threshold scouting observations on that zone, so open_pest_alert_count is 2 and zone.ipm_posture is LOCKED with reentry_clear_at still null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZA-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zone_a: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { var_tom: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zone_a}", variety_id: "${var_tom}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cyc_a: $.data.id, first_ok: $.data.first_harvest_allowed_date }
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T06:00:00Z" }
              as: GrowerManager
            - call: "POST /crop-cycles/${cyc_a}/transitions"
              payload: { to_status: "PRODUCTION" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Sera Vos", skill: "SCOUT", hourly_rate_usd: 21.00, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_scout: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Hana Ito", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.05, status: "ACTIVE" }
              as: GrowerManager
              captures: { w_harv: $.data.id }
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", observed_at: "2026-08-24T05:00:00Z", pest_code: "WHITEFLY", plants_inspected: 60, pest_count_per_plant: 0.800 }
              as: IPMScout
              as_user_id: "${w_scout}"
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zone_a}", crop_cycle_id: "${cyc_a}", observed_at: "2026-08-24T05:30:00Z", pest_code: "THRIPS", plants_inspected: 60, pest_count_per_plant: 0.900 }
              as: IPMScout
              as_user_id: "${w_scout}"
            - call: "GET /zones/${zone_a}"
              as: GrowerManager
              captures: { posture_before_trigger: $.data.ipm_posture, alerts_before_trigger: $.data.open_pest_alert_count, reentry_before_trigger: $.data.reentry_clear_at }
          trigger:
            - call: "POST /harvest-lots"
              payload: { crop_cycle_id: "${cyc_a}", harvest_date: "2026-08-20", gross_weight_lbs: 2000.00 }
              as: HarvestSupervisor
              as_user_id: "${w_harv}"
              captures: { err_lot: $.data.error_id }
          assert:
            - "${first_ok} == 2026-08-24"
            - "${posture_before_trigger} == LOCKED"
            - "${alerts_before_trigger} == 2"
            - "${reentry_before_trigger} == null"
            - "${err_lot} == ERR_ZONE_IPM_LOCKED"
            - "the trigger returns HTTP 409 and NOT ERR_HARVEST_TOO_EARLY, because priority 13 outranks priority 31"
            - "CropCycle.${cyc_a}.cumulative_harvested_lbs == 0.00"
            - "no HarvestLot row exists for CropCycle ${cyc_a}"

      - name: terminal_cold_chain_outranks_mass_balance_on_regrade
