# =============================================================================
# Employer Group Health Renewal & Underwriting — Scaffold Seed Tables
# =============================================================================

scenario: |
  Employer Group Health Renewal & Underwriting (health insurer underwriting):
  census & claims experience gathering, manual vs experience rating & credibility
  blending, benefit plan design change modeling & contribution strategy, quote
  generation & alternate funding (level-funded) options, renewal rate action &
  negotiation, stop-loss quoting for self-funded, enrollment change impact & rate
  guarantee, broker commission & disclosure

domain_name: employer-group-health-renewal-underwriting
api_prefix: /underwriting-cases

complexity_profile:
  primary_archetype: pricing-engine
  secondary_archetype: multi-party-negotiation
  complexity_layers:
    - dual-variant-calculation
    - cascading-side-effects
    - rate-threshold-triggers
    - derived-field-reconciliation

  entity_topology: hierarchical
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: UnderwritingCase
    parent: null
    common_fields: true
    fields:
      - { name: group_name, type: string, source: input, description: "Employer group legal name" }
      - { name: group_size, type: integer, source: input, description: "Total eligible employees (used for credibility and rating-band checks)" }
      - { name: sic_code, type: string, source: input, description: "4-digit SIC industry code" }
      - { name: state_code, type: string, source: input, description: "2-letter US state of situs" }
      - { name: effective_date, type: datetime, source: input, description: "Renewal effective date (ISO 8601)" }
      - { name: current_premium_annual, type: integer, source: input, description: "Current in-force annual premium in cents" }
      - { name: current_renewal_date, type: datetime, source: input, description: "Current contract renewal date" }
      - { name: funding_type, type: enum, source: input, description: "FULLY_INSURED | LEVEL_FUNDED | SELF_FUNDED" }
      - { name: status, type: enum, source: system, description: "INTAKE -> CENSUS_PENDING -> CENSUS_RECEIVED -> CLAIMS_PENDING -> RATING_IN_PROGRESS -> QUOTED -> NEGOTIATING -> APPROVED / DECLINED / WITHDRAWN" }
      - { name: assigned_underwriter_id, type: string, source: system, description: "X-User-ID of the creating Underwriter" }
      - { name: broker_id, type: string, source: input, description: "FK -> Broker.id; the broker of record" }
      - { name: credibility_factor, type: number, source: computed, default: 0, description: "Credibility weight Z in [0,1], derived from group_size and claims months" }
      - { name: blended_rate_cents, type: integer, source: computed, default: 0, description: "Final blended PEPM rate after credibility mixing" }
      - { name: manual_rate_cents, type: integer, source: computed, default: 0, description: "Pure manual-book rate PEPM" }
      - { name: experience_rate_cents, type: integer, source: computed, default: 0, description: "Pure experience-based rate PEPM" }
      - { name: rate_cap_pct, type: number, source: computed, default: 0, description: "Maximum allowable renewal increase as decimal (e.g. 0.15 for 15%)" }
      - { name: is_rate_cap_applied, type: boolean, source: computed, default: false, description: "True when the blended rate was capped by rate_cap_pct" }

  - name: Broker
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Brokerage firm name" }
      - { name: license_number, type: string, source: input, description: "State insurance license number" }
      - { name: state_code, type: string, source: input, description: "2-letter US state of licensure" }
      - { name: commission_pct, type: number, source: input, description: "Standard commission percentage as decimal (e.g. 0.04)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: CensusSnapshot
    parent: UnderwritingCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> UnderwritingCase.id; parent case" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of census submission" }
      - { name: total_employees, type: integer, source: input, description: "Headcount from census file" }
      - { name: enrolled_employees, type: integer, source: input, description: "Currently enrolled headcount" }
      - { name: dependent_count, type: integer, source: input, description: "Total covered dependents" }
      - { name: average_age, type: number, source: computed, description: "Weighted average age of enrolled members" }
      - { name: gender_ratio, type: number, source: computed, description: "Female-to-total ratio among enrolled members" }
      - { name: tier_distribution, type: object, source: input, description: "Breakdown { EE: n, ES: n, EC: n, EF: n } — employee-only, employee+spouse, employee+children, family" }
      - { name: status, type: enum, source: system, description: "PENDING -> VALIDATED / REJECTED" }

  - name: ClaimsExperience
    parent: UnderwritingCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> UnderwritingCase.id; parent case" }
      - { name: experience_period_start, type: datetime, source: input, description: "Start of claims experience period" }
      - { name: experience_period_end, type: datetime, source: input, description: "End of claims experience period" }
      - { name: months_of_experience, type: integer, source: computed, description: "Whole months between start and end (inclusive)" }
      - { name: total_paid_claims_cents, type: integer, source: input, description: "Aggregate paid claims in cents for the period" }
      - { name: total_enrollment_months, type: integer, source: input, description: "Sum of monthly enrollment counts across the period" }
      - { name: large_claim_count, type: integer, source: input, description: "Number of claims exceeding pooling threshold" }
      - { name: pooling_threshold_cents, type: integer, source: input, description: "Claims above this are capped (pooled away) for experience rating" }
      - { name: pooled_claims_cents, type: integer, source: computed, description: "Portion of claims above pooling threshold" }
      - { name: experience_claim_cost_cents, type: integer, source: computed, description: "Net claim cost used in experience rating = total_paid - pooled" }
      - { name: completion_ratio, type: number, source: computed, description: "IBNR completion factor applied to raw paid claims" }
      - { name: status, type: enum, source: system, description: "PENDING -> SUBMITTED -> REVIEWED / REJECTED" }

  - name: BenefitPlanDesign
    parent: UnderwritingCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> UnderwritingCase.id; parent case" }
      - { name: plan_name, type: string, source: input, description: "Plan marketing name" }
      - { name: deductible_individual, type: integer, source: input, description: "Individual deductible in cents" }
      - { name: deductible_family, type: integer, source: input, description: "Family deductible in cents" }
      - { name: oop_max_individual, type: integer, source: input, description: "Individual out-of-pocket max in cents" }
      - { name: oop_max_family, type: integer, source: input, description: "Family out-of-pocket max in cents" }
      - { name: coinsurance_pct, type: number, source: input, description: "Plan coinsurance as decimal (plan pays this share after deductible)" }
      - { name: copay_primary, type: integer, source: input, description: "Primary care copay in cents" }
      - { name: copay_specialist, type: integer, source: input, description: "Specialist copay in cents" }
      - { name: actuarial_value, type: number, source: computed, description: "Computed AV as decimal (0-1)" }
      - { name: relativity_factor, type: number, source: computed, description: "Pricing relativity vs. reference plan (1.0 = reference)" }
      - { name: employer_contribution_pct, type: number, source: input, description: "Employer contribution share as decimal (0-1)" }
      - { name: contribution_strategy, type: enum, source: input, description: "FLAT_DOLLAR | PERCENTAGE | TIERED" }
      - { name: is_reference_plan, type: boolean, source: input, default: false, description: "True if this is the anchor/reference plan for relativity" }
      - { name: status, type: enum, source: system, description: "DRAFT -> MODELED -> SELECTED / REJECTED" }

  - name: Quote
    parent: UnderwritingCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> UnderwritingCase.id; parent case" }
      - { name: plan_design_id, type: string, source: input, description: "FK -> BenefitPlanDesign.id; the plan being quoted" }
      - { name: quote_number, type: integer, source: system, description: "Sequential quote number within case (1,2,3...)" }
      - { name: funding_type, type: enum, source: input, description: "FULLY_INSURED | LEVEL_FUNDED" }
      - { name: pepm_rate_cents, type: integer, source: computed, description: "Per-employee-per-month quoted rate in cents" }
      - { name: annual_premium_cents, type: integer, source: computed, description: "Total annual premium = pepm_rate * 12 * enrolled_employees" }
      - { name: renewal_increase_pct, type: number, source: computed, description: "Renewal increase as decimal vs. current premium" }
      - { name: claims_fund_cents, type: integer, source: computed, description: "Level-funded claims fund component (level-funded only)" }
      - { name: admin_fee_cents, type: integer, source: computed, description: "Admin fee component PEPM" }
      - { name: stop_loss_premium_cents, type: integer, source: computed, description: "Stop-loss premium component (level-funded only)" }
      - { name: broker_commission_cents, type: integer, source: computed, description: "Total annual broker commission in cents" }
      - { name: commission_disclosure_required, type: boolean, source: computed, description: "True when commission exceeds disclosure threshold" }
      - { name: rate_guarantee_months, type: integer, source: input, description: "Number of months the rate is guaranteed (12, 18, or 24)" }
      - { name: enrollment_change_threshold, type: number, source: input, description: "Max allowed enrollment change decimal before guarantee voids (e.g. 0.10)" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROPOSED -> COUNTERED -> ACCEPTED / REJECTED / EXPIRED / SUPERSEDED" }
      - { name: negotiation_round, type: integer, source: system, default: 0, description: "Current negotiation round (0 = initial)" }
      - { name: parent_quote_id, type: string, source: system, required: false, description: "FK -> Quote.id; prior quote this supersedes" }

  - name: StopLossQuote
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; parent quote" }
      - { name: case_id, type: string, source: system, description: "FK -> UnderwritingCase.id; grandparent case" }
      - { name: specific_deductible_cents, type: integer, source: input, description: "Individual stop-loss deductible per claimant per year in cents" }
      - { name: aggregate_attachment_pct, type: number, source: input, description: "Aggregate stop-loss attachment point as decimal of expected claims (e.g. 1.25)" }
      - { name: expected_annual_claims_cents, type: integer, source: computed, description: "Projected annual claims from experience or manual" }
      - { name: aggregate_attachment_cents, type: integer, source: computed, description: "= expected_annual_claims * aggregate_attachment_pct" }
      - { name: specific_premium_cents, type: integer, source: computed, description: "Annual specific stop-loss premium" }
      - { name: aggregate_premium_cents, type: integer, source: computed, description: "Annual aggregate stop-loss premium" }
      - { name: total_stop_loss_premium_cents, type: integer, source: computed, description: "= specific + aggregate" }
      - { name: laser_claimant_ids, type: array, source: input, required: false, description: "List of claimant IDs with individual lasers (higher specific deductible)" }
      - { name: laser_deductible_cents, type: integer, source: input, required: false, description: "Elevated specific deductible for laser claimants" }
      - { name: status, type: enum, source: system, description: "DRAFT -> QUOTED -> BOUND / DECLINED" }

  - name: NegotiationRound
    parent: Quote
    common_fields: true
    fields:
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; the quote being negotiated" }
      - { name: case_id, type: string, source: system, description: "FK -> UnderwritingCase.id; grandparent case" }
      - { name: round_number, type: integer, source: system, description: "Sequential round within this quote (1,2,3...)" }
      - { name: proposed_by, type: enum, source: system, description: "UNDERWRITER | BROKER" }
      - { name: proposed_pepm_cents, type: integer, source: input, description: "Proposed PEPM rate in cents" }
      - { name: proposed_contribution_pct, type: number, source: input, description: "Proposed employer contribution share" }
      - { name: proposed_deductible_individual, type: integer, source: input, required: false, description: "Proposed plan deductible change" }
      - { name: justification, type: string, source: input, description: "Rationale for the proposal (>= 20 chars)" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACCEPTED / REJECTED / WITHDRAWN" }

  - name: EnrollmentChangeEvent
    parent: UnderwritingCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> UnderwritingCase.id; parent case" }
      - { name: quote_id, type: string, source: input, description: "FK -> Quote.id; the quote this change impacts" }
      - { name: event_type, type: enum, source: input, description: "NEW_HIRE | TERMINATION | COBRA_ELECTION | PLAN_MIGRATION" }
      - { name: change_count, type: integer, source: input, description: "Number of enrollees affected (positive=add, negative=remove)" }
      - { name: effective_date, type: datetime, source: input, description: "When the change takes effect" }
      - { name: revised_enrollment, type: integer, source: computed, description: "Enrollment after applying this event" }
      - { name: enrollment_change_pct, type: number, source: computed, description: "Change as decimal vs. census enrolled_employees" }
      - { name: guarantee_voided, type: boolean, source: computed, description: "True when |enrollment_change_pct| > quote.enrollment_change_threshold" }
      - { name: rate_adjustment_factor, type: number, source: computed, description: "Multiplier applied to quoted rate when guarantee voided" }
      - { name: status, type: enum, source: system, description: "REPORTED -> PROCESSED / VOIDED_GUARANTEE" }

  - name: CommissionDisclosure
    parent: UnderwritingCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> UnderwritingCase.id; parent case" }
      - { name: quote_id, type: string, source: system, description: "FK -> Quote.id; the accepted quote" }
      - { name: broker_id, type: string, source: system, description: "FK -> Broker.id; the broker receiving commission" }
      - { name: total_commission_cents, type: integer, source: computed, description: "Total annual commission amount" }
      - { name: commission_pct, type: number, source: computed, description: "Effective commission percentage" }
      - { name: per_enrollee_cents, type: integer, source: computed, description: "Commission per enrolled member per year" }
      - { name: disclosure_threshold_cents, type: integer, source: system, description: "Regulatory threshold for mandatory disclosure" }
      - { name: requires_disclosure, type: boolean, source: computed, description: "True when total_commission >= disclosure_threshold" }
      - { name: disclosed_at, type: datetime, source: system, required: false, description: "Timestamp when disclosure was provided to group" }
      - { name: status, type: enum, source: system, description: "PENDING -> DISCLOSED -> ACKNOWLEDGED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: UnderwritingCase
    initial_state: INTAKE
    terminal_states: [APPROVED, DECLINED, WITHDRAWN]
    transitions:
      - from: INTAKE
        to: CENSUS_PENDING
        trigger: POST /underwriting-cases/{caseId}/submit-for-census
        actor: Underwriter
        preconditions:
          - "Case must be in INTAKE (ERR_CASE_NOT_IN_INTAKE)"
          - "Broker must be ACTIVE (ERR_BROKER_NOT_ACTIVE)"
        side_effects:
          - "status -> CENSUS_PENDING"

      - from: CENSUS_PENDING
        to: CENSUS_RECEIVED
        trigger: "system (automatic when a CensusSnapshot transitions to VALIDATED)"
        actor: system
        preconditions:
          - "At least one CensusSnapshot with status=VALIDATED exists for this case"
        side_effects:
          - "status -> CENSUS_RECEIVED"
          - "Compute credibility_factor from census group_size"
          - "Compute manual_rate_cents from manual rating formula"

      - from: CENSUS_RECEIVED
        to: CLAIMS_PENDING
        trigger: POST /underwriting-cases/{caseId}/request-claims
        actor: Underwriter
        preconditions:
          - "Case must be in CENSUS_RECEIVED (ERR_CASE_NOT_IN_CENSUS_RECEIVED)"
          - "group_size >= 25 for experience rating to be available (ERR_GROUP_TOO_SMALL_EXPERIENCE)"
        side_effects:
          - "status -> CLAIMS_PENDING"

      - from: CLAIMS_PENDING
        to: RATING_IN_PROGRESS
        trigger: "system (automatic when a ClaimsExperience transitions to REVIEWED)"
        actor: system
        preconditions:
          - "At least one ClaimsExperience with status=REVIEWED exists"
        side_effects:
          - "status -> RATING_IN_PROGRESS"
          - "Compute experience_rate_cents"
          - "Compute credibility_factor (blended from census + claims months)"
          - "Compute blended_rate_cents"
          - "Apply rate_cap_pct if blended exceeds cap"

      - from: RATING_IN_PROGRESS
        to: QUOTED
        trigger: POST /underwriting-cases/{caseId}/quotes (creates first quote)
        actor: Underwriter
        preconditions:
          - "Case must be in RATING_IN_PROGRESS (ERR_CASE_NOT_IN_RATING)"
          - "At least one BenefitPlanDesign with status=MODELED exists (ERR_NO_MODELED_PLAN)"
        side_effects:
          - "status -> QUOTED"

      - from: QUOTED
        to: NEGOTIATING
        trigger: POST /quotes/{quoteId}/counter (broker submits counter-proposal)
        actor: Broker
        preconditions:
          - "Quote must be in PROPOSED status (ERR_QUOTE_NOT_PROPOSED)"
          - "Broker must own this case (ERR_NOT_BROKER_OF_RECORD)"
        side_effects:
          - "status -> NEGOTIATING"

      - from: NEGOTIATING
        to: QUOTED
        trigger: POST /quotes/{quoteId}/counter (underwriter responds with new quote)
        actor: Underwriter
        preconditions:
          - "Case must be in NEGOTIATING (ERR_CASE_NOT_NEGOTIATING)"
        side_effects:
          - "status -> QUOTED (new round quote created, prior quote -> SUPERSEDED)"

      - from: QUOTED
        to: APPROVED
        trigger: POST /quotes/{quoteId}/accept
        actor: Broker
        preconditions:
          - "Quote must be in PROPOSED status (ERR_QUOTE_NOT_PROPOSED)"
          - "Broker must be ACTIVE (ERR_BROKER_NOT_ACTIVE)"
        side_effects:
          - "status -> APPROVED"
          - "Create CommissionDisclosure entity"
          - "All other non-terminal quotes -> SUPERSEDED"

      - from: NEGOTIATING
        to: APPROVED
        trigger: POST /quotes/{quoteId}/accept
        actor: Broker
        preconditions:
          - "Quote must be in PROPOSED status"
          - "Broker must be ACTIVE"
        side_effects:
          - "status -> APPROVED"
          - "Create CommissionDisclosure entity"
          - "All other non-terminal quotes -> SUPERSEDED"

      - from: QUOTED
        to: DECLINED
        trigger: POST /underwriting-cases/{caseId}/decline
        actor: Underwriter
        preconditions:
          - "Case must be in QUOTED or NEGOTIATING (ERR_CASE_NOT_DECLINABLE)"
        side_effects:
          - "status -> DECLINED"

      - from: NEGOTIATING
        to: DECLINED
        trigger: POST /underwriting-cases/{caseId}/decline
        actor: Underwriter
        preconditions:
          - "Case must be in QUOTED or NEGOTIATING"
        side_effects:
          - "status -> DECLINED"

      - from: INTAKE
        to: WITHDRAWN
        trigger: POST /underwriting-cases/{caseId}/withdraw
        actor: Underwriter | Broker
        preconditions: []
        side_effects:
          - "status -> WITHDRAWN"

      - from: CENSUS_PENDING
        to: WITHDRAWN
        trigger: POST /underwriting-cases/{caseId}/withdraw
        actor: Underwriter | Broker
        preconditions: []
        side_effects: []

      - from: CENSUS_RECEIVED
        to: WITHDRAWN
        trigger: POST /underwriting-cases/{caseId}/withdraw
        actor: Underwriter | Broker
        preconditions: []
        side_effects: []

      - from: CLAIMS_PENDING
        to: WITHDRAWN
        trigger: POST /underwriting-cases/{caseId}/withdraw
        actor: Underwriter | Broker
        preconditions: []
        side_effects: []

      - from: RATING_IN_PROGRESS
        to: WITHDRAWN
        trigger: POST /underwriting-cases/{caseId}/withdraw
        actor: Underwriter | Broker
        preconditions: []
        side_effects: []

      - from: QUOTED
        to: WITHDRAWN
        trigger: POST /underwriting-cases/{caseId}/withdraw
        actor: Underwriter | Broker
        preconditions: []
        side_effects: []

      - from: NEGOTIATING
        to: WITHDRAWN
        trigger: POST /underwriting-cases/{caseId}/withdraw
        actor: Underwriter | Broker
        preconditions: []
        side_effects: []

  - entity: CensusSnapshot
    initial_state: PENDING
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: POST /census-snapshots/{censusId}/validate
        actor: Underwriter
        preconditions:
          - "Census must be in PENDING (ERR_CENSUS_NOT_PENDING)"
          - "total_employees must equal group_size on parent case (ERR_CENSUS_COUNT_MISMATCH)"
          - "enrolled_employees must be > 0 (ERR_EMPTY_ENROLLMENT)"
          - "tier_distribution values must sum to enrolled_employees (ERR_TIER_SUM_MISMATCH)"
        side_effects:
          - "status -> VALIDATED"
          - "Parent case: if CENSUS_PENDING -> CENSUS_RECEIVED"

      - from: PENDING
        to: REJECTED
        trigger: POST /census-snapshots/{censusId}/reject
        actor: Underwriter
        preconditions:
          - "Census must be in PENDING (ERR_CENSUS_NOT_PENDING)"
        side_effects:
          - "status -> REJECTED"

  - entity: ClaimsExperience
    initial_state: PENDING
    terminal_states: [REVIEWED, REJECTED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: POST /claims-experiences/{claimsId}/submit
        actor: Underwriter
        preconditions:
          - "Claims must be in PENDING (ERR_CLAIMS_NOT_PENDING)"
          - "experience_period_end > experience_period_start (ERR_INVALID_EXPERIENCE_PERIOD)"
          - "months_of_experience >= 12 (ERR_INSUFFICIENT_EXPERIENCE_MONTHS)"
        side_effects:
          - "status -> SUBMITTED"
          - "Compute months_of_experience"
          - "Compute pooled_claims_cents"
          - "Compute experience_claim_cost_cents"

      - from: SUBMITTED
        to: REVIEWED
        trigger: POST /claims-experiences/{claimsId}/review
        actor: SeniorUnderwriter
        preconditions:
          - "Claims must be in SUBMITTED (ERR_CLAIMS_NOT_SUBMITTED)"
          - "Reviewer must not be the submitter (ERR_SAME_REVIEWER_AS_SUBMITTER — segregation of duties)"
        side_effects:
          - "status -> REVIEWED"
          - "Compute completion_ratio"
          - "Parent case: if CLAIMS_PENDING -> RATING_IN_PROGRESS"

      - from: PENDING
        to: REJECTED
        trigger: POST /claims-experiences/{claimsId}/reject
        actor: SeniorUnderwriter
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /claims-experiences/{claimsId}/reject
        actor: SeniorUnderwriter
        preconditions: []
        side_effects: []

  - entity: BenefitPlanDesign
    initial_state: DRAFT
    terminal_states: [SELECTED, REJECTED]
    transitions:
      - from: DRAFT
        to: MODELED
        trigger: POST /plan-designs/{planId}/model
        actor: Underwriter
        preconditions:
          - "Plan must be in DRAFT (ERR_PLAN_NOT_DRAFT)"
          - "Parent case must be in CENSUS_RECEIVED or later (ERR_CASE_NOT_READY_FOR_MODELING)"
        side_effects:
          - "status -> MODELED"
          - "Compute actuarial_value"
          - "Compute relativity_factor"

      - from: MODELED
        to: SELECTED
        trigger: "system (automatic when a Quote referencing this plan transitions to ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SELECTED"

      - from: MODELED
        to: REJECTED
        trigger: POST /plan-designs/{planId}/reject
        actor: Underwriter
        preconditions:
          - "No Quote in PROPOSED or COUNTERED status references this plan (ERR_PLAN_HAS_ACTIVE_QUOTES)"
        side_effects:
          - "status -> REJECTED"

      - from: DRAFT
        to: REJECTED
        trigger: POST /plan-designs/{planId}/reject
        actor: Underwriter
        preconditions: []
        side_effects: []

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, EXPIRED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: POST /quotes/{quoteId}/propose
        actor: Underwriter
        preconditions:
          - "Quote must be in DRAFT (ERR_QUOTE_NOT_DRAFT)"
          - "Parent case must be in RATING_IN_PROGRESS or QUOTED or NEGOTIATING (ERR_CASE_NOT_QUOTABLE)"
        side_effects:
          - "status -> PROPOSED"
          - "Compute pepm_rate_cents from blended_rate and plan relativity"
          - "Compute annual_premium_cents"
          - "Compute renewal_increase_pct"
          - "Compute broker_commission_cents"
          - "Parent case: if RATING_IN_PROGRESS -> QUOTED"

      - from: PROPOSED
        to: COUNTERED
        trigger: POST /quotes/{quoteId}/counter
        actor: Broker
        preconditions:
          - "Quote must be in PROPOSED (ERR_QUOTE_NOT_PROPOSED)"
        side_effects:
          - "status -> COUNTERED"
          - "Create NegotiationRound entity"
          - "Parent case: QUOTED -> NEGOTIATING"

      - from: COUNTERED
        to: PROPOSED
        trigger: POST /quotes/{quoteId}/respond
        actor: Underwriter
        preconditions:
          - "Quote must be in COUNTERED (ERR_QUOTE_NOT_COUNTERED)"
        side_effects:
          - "status -> PROPOSED"
          - "Create NegotiationRound entity"
          - "Parent case: NEGOTIATING -> QUOTED"

      - from: PROPOSED
        to: ACCEPTED
        trigger: POST /quotes/{quoteId}/accept
        actor: Broker
        preconditions:
          - "Quote must be in PROPOSED (ERR_QUOTE_NOT_PROPOSED)"
          - "Broker must be ACTIVE"
        side_effects:
          - "status -> ACCEPTED"
          - "Referenced plan design -> SELECTED"
          - "Create CommissionDisclosure"
          - "All other non-terminal quotes on this case -> SUPERSEDED"
          - "Parent case -> APPROVED"

      - from: PROPOSED
        to: REJECTED
        trigger: POST /quotes/{quoteId}/reject-quote
        actor: Broker | Underwriter
        preconditions:
          - "Quote must be in PROPOSED (ERR_QUOTE_NOT_PROPOSED)"
        side_effects:
          - "status -> REJECTED"

      - from: COUNTERED
        to: REJECTED
        trigger: POST /quotes/{quoteId}/reject-quote
        actor: Broker | Underwriter
        preconditions:
          - "Quote must be in COUNTERED"
        side_effects:
          - "status -> REJECTED"

      - from: PROPOSED
        to: EXPIRED
        trigger: "system (automatic when current_utc > effective_date - 30 days and quote still PROPOSED)"
        actor: system
        preconditions:
          - "Quote in PROPOSED and effective_date - 30 days has passed"
        side_effects:
          - "status -> EXPIRED"

      - from: COUNTERED
        to: EXPIRED
        trigger: "system (automatic when current_utc > effective_date - 30 days)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> EXPIRED"

      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system (automatic when a newer Quote on the same case transitions to PROPOSED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> SUPERSEDED"

  - entity: StopLossQuote
    initial_state: DRAFT
    terminal_states: [BOUND, DECLINED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: POST /stop-loss-quotes/{slqId}/quote
        actor: Underwriter
        preconditions:
          - "Stop-loss must be in DRAFT (ERR_STOP_LOSS_NOT_DRAFT)"
          - "Parent quote must be in PROPOSED or COUNTERED (ERR_QUOTE_NOT_ACTIVE)"
          - "Parent quote funding_type must be LEVEL_FUNDED (ERR_NOT_LEVEL_FUNDED)"
        side_effects:
          - "status -> QUOTED"
          - "Compute expected_annual_claims_cents"
          - "Compute aggregate_attachment_cents"
          - "Compute specific_premium_cents"
          - "Compute aggregate_premium_cents"
          - "Compute total_stop_loss_premium_cents"

      - from: QUOTED
        to: BOUND
        trigger: POST /stop-loss-quotes/{slqId}/bind
        actor: Underwriter
        preconditions:
          - "Stop-loss must be in QUOTED (ERR_STOP_LOSS_NOT_QUOTED)"
          - "Parent quote must be ACCEPTED (ERR_QUOTE_NOT_ACCEPTED)"
        side_effects:
          - "status -> BOUND"

      - from: QUOTED
        to: DECLINED
        trigger: POST /stop-loss-quotes/{slqId}/decline-slq
        actor: Underwriter
        preconditions:
          - "Stop-loss must be in QUOTED (ERR_STOP_LOSS_NOT_QUOTED)"
        side_effects:
          - "status -> DECLINED"

  - entity: NegotiationRound
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "system (automatic when parent Quote transitions to ACCEPTED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> ACCEPTED"

      - from: PROPOSED
        to: REJECTED
        trigger: "system (automatic when parent Quote transitions to REJECTED or SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> REJECTED"

      - from: PROPOSED
        to: WITHDRAWN
        trigger: POST /negotiation-rounds/{roundId}/withdraw-round
        actor: Underwriter | Broker
        preconditions:
          - "Only the party who proposed this round can withdraw (ERR_NOT_ROUND_PROPOSER)"
          - "Round must be in PROPOSED (ERR_ROUND_NOT_PROPOSED)"
        side_effects:
          - "status -> WITHDRAWN"

  - entity: EnrollmentChangeEvent
    initial_state: REPORTED
    terminal_states: [PROCESSED, VOIDED_GUARANTEE]
    transitions:
      - from: REPORTED
        to: PROCESSED
        trigger: POST /enrollment-changes/{eventId}/process
        actor: Underwriter
        preconditions:
          - "Event must be in REPORTED (ERR_ENROLLMENT_NOT_REPORTED)"
          - "Parent case must be APPROVED (ERR_CASE_NOT_APPROVED)"
        side_effects:
          - "Compute revised_enrollment"
          - "Compute enrollment_change_pct"
          - "If |enrollment_change_pct| <= quote.enrollment_change_threshold: status -> PROCESSED"

      - from: REPORTED
        to: VOIDED_GUARANTEE
        trigger: POST /enrollment-changes/{eventId}/process
        actor: Underwriter
        preconditions:
          - "Event must be in REPORTED"
          - "Parent case must be APPROVED"
          - "|enrollment_change_pct| > quote.enrollment_change_threshold"
        side_effects:
          - "Compute rate_adjustment_factor"
          - "status -> VOIDED_GUARANTEE"
          - "Parent quote rate adjusted by rate_adjustment_factor"

  - entity: CommissionDisclosure
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: DISCLOSED
        trigger: POST /commission-disclosures/{discId}/disclose
        actor: Underwriter
        preconditions:
          - "Disclosure must be in PENDING (ERR_DISCLOSURE_NOT_PENDING)"
          - "requires_disclosure must be true (ERR_DISCLOSURE_NOT_REQUIRED)"
        side_effects:
          - "status -> DISCLOSED"
          - "disclosed_at = current timestamp"

      - from: DISCLOSED
        to: ACKNOWLEDGED
        trigger: POST /commission-disclosures/{discId}/acknowledge
        actor: Broker
        preconditions:
          - "Disclosure must be in DISCLOSED (ERR_DISCLOSURE_NOT_DISCLOSED)"
        side_effects:
          - "status -> ACKNOWLEDGED"

# =============================================================================
# Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-case
    parent_entity: UnderwritingCase
    write_endpoint: "POST /underwriting-cases/{caseId}/quotes"
    occ_field: "expected_case_version"
    description: |
      Creating a Quote against an UnderwritingCase whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another underwriter has just created a quote (which advances the
      case state and version) and the current writer's view of the case is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: credibility_factor
    trigger: "census validation, claims review"
    algorithm: threshold
    formula: |
      Credibility Z = min(1.0, group_size_factor * months_factor)

      group_size_factor:
        group_size < 25:    0.0  (too small for any credibility)
        25 <= size < 100:   size / 100
        100 <= size < 500:  1.0 * (size / 500)
        size >= 500:        1.0

      months_factor:
        months_of_experience < 12: 0.0
        12 <= months < 24:         months / 24
        months >= 24:              1.0

      Z = min(group_size_factor, months_factor)
      Final credibility_factor = round(Z, 4)
    constants:
      MIN_GROUP_SIZE: 25
      FULL_CREDIBILITY_SIZE: 500
      MIN_EXPERIENCE_MONTHS: 12
      FULL_EXPERIENCE_MONTHS: 24
    precision: "4 decimal places, round_half_up"

  - name: manual_rate
    trigger: "census validation"
    algorithm: weighted_scoring
    formula: |
      base_rate = 45000  # $450.00 PEPM in cents (reference manual rate)

      age_factor:
        average_age < 30:  0.85
        30 <= age < 40:    1.00
        40 <= age < 50:    1.15
        50 <= age < 60:    1.35
        age >= 60:         1.60

      gender_factor:
        gender_ratio < 0.40: 0.95
        0.40 <= ratio <= 0.60: 1.00
        ratio > 0.60: 1.08

      industry_factor (from sic_code first 2 digits):
        01-09 (agriculture): 0.90
        10-14 (mining): 1.10
        15-17 (construction): 1.05
        20-39 (manufacturing): 1.00
        40-49 (transportation): 1.02
        50-59 (wholesale/retail): 0.98
        60-67 (finance): 0.95
        70-89 (services): 1.00
        91-97 (public admin): 0.97
        else: 1.00

      tier_load:
        Composite tier factor = sum over tiers of (tier_share * tier_factor)
        EE: 1.00, ES: 2.00, EC: 1.80, EF: 2.90

      manual_rate = base_rate * age_factor * gender_factor * industry_factor
      manual_rate = round(manual_rate, 0)  # to whole cents
    constants:
      BASE_MANUAL_RATE_CENTS: 45000
    precision: "0 decimal places (whole cents), round_half_up"

  - name: experience_rate
    trigger: "claims review"
    algorithm: forward_looking
    formula: |
      Step 1: net_claim_cost = experience_claim_cost_cents (already pooled)

      Step 2: apply completion for IBNR:
        adjusted_claims = net_claim_cost / completion_ratio

      Step 3: apply trend (2 years of trend from mid-experience to mid-renewal):
        trended_claims = adjusted_claims * (1 + ANNUAL_TREND)^2

      Step 4: convert to PEPM:
        claims_pepm = trended_claims / total_enrollment_months

      Step 5: add retention (admin + risk + profit):
        retention_pct = 0.15  # 15% retention
        experience_rate = claims_pepm / (1 - retention_pct)

      experience_rate = round(experience_rate, 0)  # whole cents
    constants:
      ANNUAL_TREND: 0.065  # 6.5% medical trend
      RETENTION_PCT: 0.15
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: conservative_experience
        when: "SeniorUnderwriter reviews and applies credibility < 0.5"
        difference: "Adds a 10% margin load: experience_rate *= 1.10 before rounding"

  - name: blended_rate
    trigger: "claims review (when experience available), census validation (manual-only)"
    algorithm: weighted_scoring
    formula: |
      # Credibility blending: Z * experience + (1 - Z) * manual
      blended = credibility_factor * experience_rate_cents +
                (1 - credibility_factor) * manual_rate_cents

      # Apply rate cap if applicable:
      max_rate = current_premium_annual / 12 / enrolled_employees * (1 + rate_cap_pct)
      if blended > max_rate:
        blended = max_rate
        is_rate_cap_applied = true
      else:
        is_rate_cap_applied = false

      blended_rate = round(blended, 0)  # whole cents
    constants:
      DEFAULT_RATE_CAP_PCT: 0.15  # 15% max renewal increase
    precision: "0 decimal places (whole cents), round_half_up"
    variants:
      - name: uncapped_blend
        when: "SeniorUnderwriter overrides the rate cap"
        difference: "Skip the rate cap; blended rate = raw Z-weighted average"

  - name: quote_pepm_rate
    trigger: "quote proposal"
    algorithm: multiplication
    formula: |
      pepm_rate = blended_rate_cents * plan_design.relativity_factor

      # Level-funded split:
      if funding_type == LEVEL_FUNDED:
        claims_fund = pepm_rate * 0.82  # 82% claims fund
        admin_fee = pepm_rate * 0.12    # 12% admin
        stop_loss_premium = pepm_rate * 0.06  # 6% stop-loss
        # Total must equal pepm_rate
        assert claims_fund + admin_fee + stop_loss_premium == pepm_rate

      pepm_rate = round(pepm_rate, 0)
    precision: "0 decimal places (whole cents), round_half_up"

  - name: annual_premium
    trigger: "quote proposal"
    algorithm: multiplication
    formula: |
      annual_premium = pepm_rate_cents * 12 * census.enrolled_employees
      # Note: enrolled from validated census snapshot
    precision: "0 decimal places (whole cents), round_half_up"

  - name: renewal_increase
    trigger: "quote proposal"
    algorithm: ratio
    formula: |
      current_pepm = current_premium_annual / 12 / enrolled_employees
      renewal_increase_pct = (annual_premium_cents - current_premium_annual) / current_premium_annual
      renewal_increase_pct = round(renewal_increase_pct, 4)
    precision: "4 decimal places, round_half_up"

  - name: broker_commission
    trigger: "quote proposal, acceptance"
    algorithm: multiplication
    formula: |
      broker_commission_cents = annual_premium_cents * broker.commission_pct
      broker_commission_cents = round(broker_commission_cents, 0)

      # Disclosure threshold: $50 per enrollee per year
      per_enrollee = broker_commission_cents / enrolled_employees
      commission_disclosure_required = (per_enrollee >= 5000)  # 5000 cents = $50
    constants:
      DISCLOSURE_THRESHOLD_PER_ENROLLEE_CENTS: 5000
    precision: "0 decimal places (whole cents), round_half_up"

  - name: stop_loss_pricing
    trigger: "stop-loss quoting"
    algorithm: tiered_pricing
    formula: |
      expected_annual_claims = experience_rate_cents * 12 * enrolled_employees * 0.82
      # (0.82 = claims fund portion; if no experience, use manual_rate)

      aggregate_attachment = expected_annual_claims * aggregate_attachment_pct
      aggregate_attachment = round(aggregate_attachment, 0)

      # Specific premium: tiered by specific deductible
      specific_deductible <= 2500000:    rate_per_1000 = 850   # $8.50 per $1000
      2500000 < ded <= 5000000:          rate_per_1000 = 620
      5000000 < ded <= 10000000:         rate_per_1000 = 410
      ded > 10000000:                    rate_per_1000 = 280

      specific_premium = (specific_deductible / 1000) * rate_per_1000 * enrolled_employees / 100
      specific_premium = round(specific_premium, 0)

      # Aggregate premium: flat rate on attachment
      aggregate_premium = aggregate_attachment * 0.02  # 2% of attachment
      aggregate_premium = round(aggregate_premium, 0)

      total_stop_loss = specific_premium + aggregate_premium

      # Laser loading: if laser claimants exist, add 25% to specific premium
      if laser_claimant_ids is not empty:
        specific_premium = round(specific_premium * 1.25, 0)
        total_stop_loss = specific_premium + aggregate_premium
    constants:
      CLAIMS_FUND_SHARE: 0.82
      AGGREGATE_RATE: 0.02
      LASER_LOAD_PCT: 0.25
    precision: "0 decimal places (whole cents), round_half_up"

  - name: enrollment_impact
    trigger: "enrollment change event processing"
    algorithm: threshold
    formula: |
      revised_enrollment = census.enrolled_employees + change_count
      enrollment_change_pct = change_count / census.enrolled_employees
      enrollment_change_pct = round(enrollment_change_pct, 4)

      if abs(enrollment_change_pct) > quote.enrollment_change_threshold:
        guarantee_voided = true
        # Rate adjustment: 2% per 5% enrollment change beyond threshold
        excess_pct = abs(enrollment_change_pct) - quote.enrollment_change_threshold
        rate_adjustment_factor = 1.0 + ceil(excess_pct / 0.05) * 0.02
      else:
        guarantee_voided = false
        rate_adjustment_factor = 1.0
    precision: "4 decimal places, round_half_up"

  - name: actuarial_value
    trigger: "plan modeling"
    algorithm: weighted_scoring
    formula: |
      # Simplified AV model based on cost-sharing parameters
      av = 1.0

      # Deductible impact: each $500 of individual deductible reduces AV by 0.02
      deductible_impact = (deductible_individual / 50000) * 0.02
      av -= deductible_impact

      # Coinsurance impact: plan pays coinsurance_pct, so lower coinsurance = lower AV
      av = av * (0.60 + 0.40 * coinsurance_pct)

      # OOP max impact: each $1000 above $2000 individual OOP reduces AV by 0.005
      oop_excess = max(0, (oop_max_individual - 200000) / 100000)
      av -= oop_excess * 0.005

      # Copay impact: higher copays reduce AV
      copay_impact = (copay_primary + copay_specialist) / 100000 * 0.01
      av -= copay_impact

      av = max(0.50, min(1.00, av))  # clamp to [0.50, 1.00]
      av = round(av, 4)
    precision: "4 decimal places, round_half_up"

  - name: plan_relativity
    trigger: "plan modeling"
    algorithm: ratio
    formula: |
      # Relativity to reference plan (is_reference_plan=true has relativity=1.0)
      # If this IS the reference plan: relativity = 1.0
      # Otherwise: relativity = this_plan.AV / reference_plan.AV
      if is_reference_plan:
        relativity_factor = 1.0
      else:
        reference_plan = (the BenefitPlanDesign on the same case with is_reference_plan=true)
        if reference_plan is null:
          relativity_factor = 1.0  # no reference, treat as base
        else:
          relativity_factor = actuarial_value / reference_plan.actuarial_value
      relativity_factor = round(relativity_factor, 4)
    precision: "4 decimal places, round_half_up"

  - name: completion_ratio
    trigger: "claims review"
    algorithm: threshold
    formula: |
      # IBNR completion factor based on months of experience
      months_of_experience >= 24: completion_ratio = 1.00
      18 <= months < 24:          completion_ratio = 0.98
      12 <= months < 18:          completion_ratio = 0.95
      months < 12:                completion_ratio = 0.85  # but claims rejected if < 12 months
    precision: "2 decimal places, exact lookup"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must have permission for this endpoint"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 3.5
    category: existence
    check: "Version check (when expected_case_version provided) must match current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /underwriting-cases/{caseId}/quotes"
    note: "OCC check is performed BEFORE any business logic validation"

  - priority: 4
    category: state
    check: "Parent case must be in the correct state for the requested operation"
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    applies_to: "all case-scoped mutation endpoints"

  - priority: 5
    category: state
    check: "Entity must be in the correct status for the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: business_referential
    check: "Broker must be ACTIVE to submit-for-census, counter, or accept"
    error_id: ERR_BROKER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST submit-for-census, POST counter, POST accept"

  - priority: 7
    category: business_constraint
    check: "group_size >= 25 for experience rating path"
    error_id: ERR_GROUP_TOO_SMALL_EXPERIENCE
    http_status: 409
    applies_to: "POST request-claims"

  - priority: 8
    category: business_constraint
    check: "Census total_employees must match case group_size"
    error_id: ERR_CENSUS_COUNT_MISMATCH
    http_status: 409
    applies_to: "POST validate census"

  - priority: 9
    category: business_constraint
    check: "Tier distribution must sum to enrolled_employees"
    error_id: ERR_TIER_SUM_MISMATCH
    http_status: 409
    applies_to: "POST validate census"

  - priority: 10
    category: business_constraint
    check: "Enrolled employees must be > 0"
    error_id: ERR_EMPTY_ENROLLMENT
    http_status: 409
    applies_to: "POST validate census"

  - priority: 11
    category: business_temporal
    check: "Claims experience period must be valid (end > start, >= 12 months)"
    error_id: ERR_INSUFFICIENT_EXPERIENCE_MONTHS
    http_status: 409
    applies_to: "POST submit claims"

  - priority: 12
    category: business_safety
    check: "Claims reviewer must not be the submitter (segregation of duties)"
    error_id: ERR_SAME_REVIEWER_AS_SUBMITTER
    http_status: 403
    applies_to: "POST review claims"

  - priority: 13
    category: business_constraint
    check: "At least one MODELED plan design must exist before quoting"
    error_id: ERR_NO_MODELED_PLAN
    http_status: 409
    applies_to: "POST /underwriting-cases/{caseId}/quotes"

  - priority: 14
    category: business_fiscal
    check: "Quote funding_type LEVEL_FUNDED requires group_size >= 10"
    error_id: ERR_GROUP_TOO_SMALL_LEVEL_FUNDED
    http_status: 409
    applies_to: "POST /underwriting-cases/{caseId}/quotes"

  - priority: 15
    category: business_referential
    check: "Only the proposing party can withdraw a negotiation round"
    error_id: ERR_NOT_ROUND_PROPOSER
    http_status: 403
    applies_to: "POST withdraw-round"

  - priority: 16
    category: business_constraint
    check: "Enrollment change cannot be processed on non-approved case"
    error_id: ERR_CASE_NOT_APPROVED
    http_status: 409
    applies_to: "POST process enrollment change"

  - priority: 17
    category: business_constraint
    check: "Stop-loss quoting requires LEVEL_FUNDED quote"
    error_id: ERR_NOT_LEVEL_FUNDED
    http_status: 409
    applies_to: "POST stop-loss quote"

  - priority: 18
    category: business_constraint
    check: "Commission disclosure requires requires_disclosure=true"
    error_id: ERR_DISCLOSURE_NOT_REQUIRED
    http_status: 409
    applies_to: "POST disclose"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Underwriting Cases ---
  - method: POST
    path: "/underwriting-cases"
    description: "Create a new underwriting case"
    roles: [Underwriter]
    code: 201
    input: [group_name, group_size, sic_code, state_code, effective_date, current_premium_annual, current_renewal_date, funding_type, broker_id]
    output: UnderwritingCase
    side_effects: ["status = INTAKE", "assigned_underwriter_id = X-User-ID"]

  - method: GET
    path: "/underwriting-cases"
    description: "List underwriting cases"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: ["status?", "funding_type?", "broker_id?", "limit?", "offset?"]
    output: "UnderwritingCase[]"
    side_effects: []

  - method: GET
    path: "/underwriting-cases/{caseId}"
    description: "Get a specific underwriting case"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: UnderwritingCase
    side_effects: []

  - method: POST
    path: "/underwriting-cases/{caseId}/submit-for-census"
    description: "Submit case for census collection"
    roles: [Underwriter]
    code: 200
    input: []
    output: UnderwritingCase
    side_effects: ["status -> CENSUS_PENDING"]

  - method: POST
    path: "/underwriting-cases/{caseId}/request-claims"
    description: "Request claims experience data"
    roles: [Underwriter]
    code: 200
    input: []
    output: UnderwritingCase
    side_effects: ["status -> CLAIMS_PENDING"]

  - method: POST
    path: "/underwriting-cases/{caseId}/decline"
    description: "Decline the underwriting case"
    roles: [Underwriter, SeniorUnderwriter]
    code: 200
    input: []
    output: UnderwritingCase
    side_effects: ["status -> DECLINED"]

  - method: POST
    path: "/underwriting-cases/{caseId}/withdraw"
    description: "Withdraw the underwriting case"
    roles: [Underwriter, Broker]
    code: 200
    input: []
    output: UnderwritingCase
    side_effects: ["status -> WITHDRAWN"]

  # --- Brokers ---
  - method: POST
    path: "/brokers"
    description: "Register a broker"
    roles: [Underwriter]
    code: 201
    input: [firm_name, license_number, state_code, commission_pct]
    output: Broker
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/brokers"
    description: "List brokers"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Broker[]"
    side_effects: []

  - method: GET
    path: "/brokers/{brokerId}"
    description: "Get a specific broker"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: Broker
    side_effects: []

  - method: PUT
    path: "/brokers/{brokerId}"
    description: "Update broker status"
    roles: [SeniorUnderwriter]
    code: 200
    input: [status]
    output: Broker
    side_effects: []

  # --- Census Snapshots ---
  - method: POST
    path: "/underwriting-cases/{caseId}/census-snapshots"
    description: "Submit a census snapshot"
    roles: [Underwriter]
    code: 201
    input: [total_employees, enrolled_employees, dependent_count, tier_distribution]
    output: CensusSnapshot
    side_effects: ["status = PENDING", "Compute average_age, gender_ratio"]

  - method: GET
    path: "/underwriting-cases/{caseId}/census-snapshots"
    description: "List census snapshots for a case"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: "CensusSnapshot[]"
    side_effects: []

  - method: GET
    path: "/census-snapshots/{censusId}"
    description: "Get a specific census snapshot"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: CensusSnapshot
    side_effects: []

  - method: POST
    path: "/census-snapshots/{censusId}/validate"
    description: "Validate a census snapshot"
    roles: [Underwriter]
    code: 200
    input: []
    output: CensusSnapshot
    side_effects:
      - "status -> VALIDATED"
      - "Parent case: CENSUS_PENDING -> CENSUS_RECEIVED"
      - "Compute credibility_factor, manual_rate_cents"

  - method: POST
    path: "/census-snapshots/{censusId}/reject"
    description: "Reject a census snapshot"
    roles: [Underwriter]
    code: 200
    input: []
    output: CensusSnapshot
    side_effects: ["status -> REJECTED"]

  # --- Claims Experience ---
  - method: POST
    path: "/underwriting-cases/{caseId}/claims-experiences"
    description: "Create a claims experience record"
    roles: [Underwriter]
    code: 201
    input: [experience_period_start, experience_period_end, total_paid_claims_cents, total_enrollment_months, large_claim_count, pooling_threshold_cents]
    output: ClaimsExperience
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/underwriting-cases/{caseId}/claims-experiences"
    description: "List claims experiences for a case"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: "ClaimsExperience[]"
    side_effects: []

  - method: GET
    path: "/claims-experiences/{claimsId}"
    description: "Get a specific claims experience"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: ClaimsExperience
    side_effects: []

  - method: POST
    path: "/claims-experiences/{claimsId}/submit"
    description: "Submit claims for review"
    roles: [Underwriter]
    code: 200
    input: []
    output: ClaimsExperience
    side_effects:
      - "status -> SUBMITTED"
      - "Compute months_of_experience, pooled_claims_cents, experience_claim_cost_cents"

  - method: POST
    path: "/claims-experiences/{claimsId}/review"
    description: "Review submitted claims (Senior Underwriter only)"
    roles: [SeniorUnderwriter]
    code: 200
    input: []
    output: ClaimsExperience
    side_effects:
      - "status -> REVIEWED"
      - "Compute completion_ratio"
      - "Parent case: CLAIMS_PENDING -> RATING_IN_PROGRESS"
      - "Compute experience_rate_cents, credibility_factor, blended_rate_cents"

  - method: POST
    path: "/claims-experiences/{claimsId}/reject"
    description: "Reject claims experience"
    roles: [SeniorUnderwriter]
    code: 200
    input: []
    output: ClaimsExperience
    side_effects: ["status -> REJECTED"]

  # --- Benefit Plan Designs ---
  - method: POST
    path: "/underwriting-cases/{caseId}/plan-designs"
    description: "Create a benefit plan design"
    roles: [Underwriter]
    code: 201
    input: [plan_name, deductible_individual, deductible_family, oop_max_individual, oop_max_family, coinsurance_pct, copay_primary, copay_specialist, employer_contribution_pct, contribution_strategy, "is_reference_plan?"]
    output: BenefitPlanDesign
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/underwriting-cases/{caseId}/plan-designs"
    description: "List plan designs for a case"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: "BenefitPlanDesign[]"
    side_effects: []

  - method: GET
    path: "/plan-designs/{planId}"
    description: "Get a specific plan design"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: BenefitPlanDesign
    side_effects: []

  - method: POST
    path: "/plan-designs/{planId}/model"
    description: "Model a plan design (compute AV and relativity)"
    roles: [Underwriter]
    code: 200
    input: []
    output: BenefitPlanDesign
    side_effects:
      - "status -> MODELED"
      - "Compute actuarial_value, relativity_factor"

  - method: POST
    path: "/plan-designs/{planId}/reject"
    description: "Reject a plan design"
    roles: [Underwriter]
    code: 200
    input: []
    output: BenefitPlanDesign
    side_effects: ["status -> REJECTED"]

  # --- Quotes ---
  - method: POST
    path: "/underwriting-cases/{caseId}/quotes"
    description: "Create a quote for a plan design"
    roles: [Underwriter]
    code: 201
    input: [plan_design_id, funding_type, rate_guarantee_months, enrollment_change_threshold, expected_case_version]
    output: Quote
    side_effects:
      - "status = DRAFT"
      - "quote_number = next sequential"
      - "Increments UnderwritingCase.version by 1"

  - method: GET
    path: "/underwriting-cases/{caseId}/quotes"
    description: "List quotes for a case"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: "Quote[]"
    side_effects: []

  - method: GET
    path: "/quotes/{quoteId}"
    description: "Get a specific quote"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/quotes/{quoteId}/propose"
    description: "Propose a quote (compute all rates)"
    roles: [Underwriter]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "status -> PROPOSED"
      - "Compute pepm_rate_cents, annual_premium_cents, renewal_increase_pct"
      - "Compute broker_commission_cents, commission_disclosure_required"
      - "Parent case: RATING_IN_PROGRESS -> QUOTED"

  - method: POST
    path: "/quotes/{quoteId}/counter"
    description: "Broker counters a proposed quote"
    roles: [Broker]
    code: 200
    input: [proposed_pepm_cents, proposed_contribution_pct, justification]
    output: Quote
    side_effects:
      - "status -> COUNTERED"
      - "Create NegotiationRound"
      - "Parent case: QUOTED -> NEGOTIATING"

  - method: POST
    path: "/quotes/{quoteId}/respond"
    description: "Underwriter responds to counter-proposal"
    roles: [Underwriter]
    code: 200
    input: [proposed_pepm_cents, proposed_contribution_pct, justification]
    output: Quote
    side_effects:
      - "status -> PROPOSED"
      - "Create NegotiationRound"
      - "Parent case: NEGOTIATING -> QUOTED"

  - method: POST
    path: "/quotes/{quoteId}/accept"
    description: "Accept a proposed quote"
    roles: [Broker]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "status -> ACCEPTED"
      - "Plan design -> SELECTED"
      - "Create CommissionDisclosure"
      - "Other quotes -> SUPERSEDED"
      - "Parent case -> APPROVED"

  - method: POST
    path: "/quotes/{quoteId}/reject-quote"
    description: "Reject a proposed or countered quote"
    roles: [Broker, Underwriter]
    code: 200
    input: []
    output: Quote
    side_effects: ["status -> REJECTED"]

  # --- Stop-Loss Quotes ---
  - method: POST
    path: "/quotes/{quoteId}/stop-loss-quotes"
    description: "Create a stop-loss quote for a level-funded quote"
    roles: [Underwriter]
    code: 201
    input: [specific_deductible_cents, aggregate_attachment_pct, "laser_claimant_ids?", "laser_deductible_cents?"]
    output: StopLossQuote
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/quotes/{quoteId}/stop-loss-quotes"
    description: "List stop-loss quotes for a quote"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: "StopLossQuote[]"
    side_effects: []

  - method: GET
    path: "/stop-loss-quotes/{slqId}"
    description: "Get a specific stop-loss quote"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: StopLossQuote
    side_effects: []

  - method: POST
    path: "/stop-loss-quotes/{slqId}/quote"
    description: "Quote a stop-loss (compute premiums)"
    roles: [Underwriter]
    code: 200
    input: []
    output: StopLossQuote
    side_effects:
      - "status -> QUOTED"
      - "Compute expected_annual_claims_cents, aggregate_attachment_cents"
      - "Compute specific_premium_cents, aggregate_premium_cents, total_stop_loss_premium_cents"

  - method: POST
    path: "/stop-loss-quotes/{slqId}/bind"
    description: "Bind a stop-loss quote"
    roles: [Underwriter]
    code: 200
    input: []
    output: StopLossQuote
    side_effects: ["status -> BOUND"]

  - method: POST
    path: "/stop-loss-quotes/{slqId}/decline-slq"
    description: "Decline a stop-loss quote"
    roles: [Underwriter]
    code: 200
    input: []
    output: StopLossQuote
    side_effects: ["status -> DECLINED"]

  # --- Negotiation Rounds ---
  - method: GET
    path: "/quotes/{quoteId}/negotiation-rounds"
    description: "List negotiation rounds for a quote"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: "NegotiationRound[]"
    side_effects: []

  - method: GET
    path: "/negotiation-rounds/{roundId}"
    description: "Get a specific negotiation round"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: NegotiationRound
    side_effects: []

  - method: POST
    path: "/negotiation-rounds/{roundId}/withdraw-round"
    description: "Withdraw a negotiation round"
    roles: [Underwriter, Broker]
    code: 200
    input: []
    output: NegotiationRound
    side_effects: ["status -> WITHDRAWN"]

  # --- Enrollment Change Events ---
  - method: POST
    path: "/underwriting-cases/{caseId}/enrollment-changes"
    description: "Report an enrollment change event"
    roles: [Underwriter, Broker]
    code: 201
    input: [quote_id, event_type, change_count, effective_date]
    output: EnrollmentChangeEvent
    side_effects: ["status = REPORTED"]

  - method: GET
    path: "/underwriting-cases/{caseId}/enrollment-changes"
    description: "List enrollment change events for a case"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: "EnrollmentChangeEvent[]"
    side_effects: []

  - method: GET
    path: "/enrollment-changes/{eventId}"
    description: "Get a specific enrollment change event"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: EnrollmentChangeEvent
    side_effects: []

  - method: POST
    path: "/enrollment-changes/{eventId}/process"
    description: "Process an enrollment change event"
    roles: [Underwriter]
    code: 200
    input: []
    output: EnrollmentChangeEvent
    side_effects:
      - "Compute revised_enrollment, enrollment_change_pct"
      - "If threshold exceeded: status -> VOIDED_GUARANTEE, compute rate_adjustment_factor"
      - "Else: status -> PROCESSED"

  # --- Commission Disclosures ---
  - method: GET
    path: "/underwriting-cases/{caseId}/commission-disclosures"
    description: "List commission disclosures for a case"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: "CommissionDisclosure[]"
    side_effects: []

  - method: GET
    path: "/commission-disclosures/{discId}"
    description: "Get a specific commission disclosure"
    roles: [Underwriter, SeniorUnderwriter, Broker, ComplianceOfficer]
    code: 200
    input: []
    output: CommissionDisclosure
    side_effects: []

  - method: POST
    path: "/commission-disclosures/{discId}/disclose"
    description: "Provide commission disclosure to group"
    roles: [Underwriter]
    code: 200
    input: []
    output: CommissionDisclosure
    side_effects: ["status -> DISCLOSED", "disclosed_at = current timestamp"]

  - method: POST
    path: "/commission-disclosures/{discId}/acknowledge"
    description: "Acknowledge receipt of commission disclosure"
    roles: [Broker]
    code: 200
    input: []
    output: CommissionDisclosure
    side_effects: ["status -> ACKNOWLEDGED"]

  # --- Clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default startup time is 2026-08-01T00:00:00Z. Before any set_current_utc call, the logical clock reads exactly this default."
    roles: [Underwriter]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Sets the logical clock for all time-dependent operations"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Current role does not have permission for this operation"

  # --- Not Found ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist"

  # --- OCC ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_case_version does not match current UnderwritingCase.version"

  # --- Case State ---
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "Case is not in the required state for this operation"

  - id: ERR_CASE_NOT_IN_INTAKE
    http: 409
    condition: "Case must be in INTAKE to submit for census"

  - id: ERR_CASE_NOT_IN_CENSUS_RECEIVED
    http: 409
    condition: "Case must be in CENSUS_RECEIVED to request claims"

  - id: ERR_CASE_NOT_IN_RATING
    http: 409
    condition: "Case must be in RATING_IN_PROGRESS to create a quote"

  - id: ERR_CASE_NOT_NEGOTIATING
    http: 409
    condition: "Case must be in NEGOTIATING for underwriter counter-response"

  - id: ERR_CASE_NOT_QUOTABLE
    http: 409
    condition: "Case must be in RATING_IN_PROGRESS, QUOTED, or NEGOTIATING to propose"

  - id: ERR_CASE_NOT_DECLINABLE
    http: 409
    condition: "Case must be in QUOTED or NEGOTIATING to decline"

  - id: ERR_CASE_NOT_APPROVED
    http: 409
    condition: "Case must be APPROVED to process enrollment changes"

  - id: ERR_CASE_NOT_READY_FOR_MODELING
    http: 409
    condition: "Case must be in CENSUS_RECEIVED or later for plan modeling"

  # --- Broker ---
  - id: ERR_BROKER_NOT_ACTIVE
    http: 409
    condition: "Broker must be in ACTIVE status"

  - id: ERR_NOT_BROKER_OF_RECORD
    http: 403
    condition: "Acting broker is not the broker of record on this case"

  # --- Census ---
  - id: ERR_CENSUS_NOT_PENDING
    http: 409
    condition: "Census snapshot must be in PENDING status"

  - id: ERR_CENSUS_COUNT_MISMATCH
    http: 409
    condition: "Census total_employees does not match case group_size"

  - id: ERR_EMPTY_ENROLLMENT
    http: 409
    condition: "Enrolled employees must be greater than zero"

  - id: ERR_TIER_SUM_MISMATCH
    http: 409
    condition: "Tier distribution values must sum to enrolled_employees"

  # --- Claims ---
  - id: ERR_CLAIMS_NOT_PENDING
    http: 409
    condition: "Claims experience must be in PENDING status"

  - id: ERR_CLAIMS_NOT_SUBMITTED
    http: 409
    condition: "Claims experience must be in SUBMITTED status"

  - id: ERR_INVALID_EXPERIENCE_PERIOD
    http: 400
    condition: "experience_period_end must be after experience_period_start"

  - id: ERR_INSUFFICIENT_EXPERIENCE_MONTHS
    http: 409
    condition: "Claims experience must cover at least 12 months"

  - id: ERR_SAME_REVIEWER_AS_SUBMITTER
    http: 403
    condition: "Claims reviewer must not be the same user who submitted (segregation of duties)"

  # --- Plan Design ---
  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "Plan design must be in DRAFT status to model"

  - id: ERR_PLAN_HAS_ACTIVE_QUOTES
    http: 409
    condition: "Cannot reject plan with active (PROPOSED/COUNTERED) quotes"

  - id: ERR_NO_MODELED_PLAN
    http: 409
    condition: "At least one MODELED plan design is required to create a quote"

  # --- Quote ---
  - id: ERR_QUOTE_NOT_DRAFT
    http: 409
    condition: "Quote must be in DRAFT to propose"

  - id: ERR_QUOTE_NOT_PROPOSED
    http: 409
    condition: "Quote must be in PROPOSED status"

  - id: ERR_QUOTE_NOT_COUNTERED
    http: 409
    condition: "Quote must be in COUNTERED status for underwriter response"

  - id: ERR_QUOTE_NOT_ACTIVE
    http: 409
    condition: "Quote must be in PROPOSED or COUNTERED for stop-loss quoting"

  - id: ERR_QUOTE_NOT_ACCEPTED
    http: 409
    condition: "Quote must be ACCEPTED to bind stop-loss"

  - id: ERR_GROUP_TOO_SMALL_EXPERIENCE
    http: 409
    condition: "Group size must be >= 25 for experience rating"

  - id: ERR_GROUP_TOO_SMALL_LEVEL_FUNDED
    http: 409
    condition: "Group size must be >= 10 for level-funded quotes"

  # --- Stop Loss ---
  - id: ERR_STOP_LOSS_NOT_DRAFT
    http: 409
    condition: "Stop-loss quote must be in DRAFT to quote"

  - id: ERR_STOP_LOSS_NOT_QUOTED
    http: 409
    condition: "Stop-loss quote must be in QUOTED status"

  - id: ERR_NOT_LEVEL_FUNDED
    http: 409
    condition: "Stop-loss quoting requires LEVEL_FUNDED funding type"

  # --- Negotiation ---
  - id: ERR_ROUND_NOT_PROPOSED
    http: 409
    condition: "Negotiation round must be in PROPOSED status"

  - id: ERR_NOT_ROUND_PROPOSER
    http: 403
    condition: "Only the party who proposed this round can withdraw it"

  # --- Enrollment ---
  - id: ERR_ENROLLMENT_NOT_REPORTED
    http: 409
    condition: "Enrollment change must be in REPORTED status"

  # --- Disclosure ---
  - id: ERR_DISCLOSURE_NOT_PENDING
    http: 409
    condition: "Commission disclosure must be in PENDING status"

  - id: ERR_DISCLOSURE_NOT_DISCLOSED
    http: 409
    condition: "Commission disclosure must be in DISCLOSED status"

  - id: ERR_DISCLOSURE_NOT_REQUIRED
    http: 409
    condition: "Commission disclosure is not required (below threshold)"

  # --- General ---
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The requested state transition is not valid from the current state"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request, missing required fields, or type mismatch"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Underwriter
    description: "Health insurance underwriter; creates cases, manages census, claims, plan designs, quotes, and stop-loss"
    identity: opaque
    exclusive_operations:
      - "POST /underwriting-cases — Create case"
      - "POST /underwriting-cases/{id}/submit-for-census — Submit for census"
      - "POST /underwriting-cases/{id}/request-claims — Request claims"
      - "POST /underwriting-cases/{id}/decline — Decline case"
      - "POST /underwriting-cases/{id}/withdraw — Withdraw case"
      - "POST /brokers — Register broker"
      - "POST /underwriting-cases/{id}/census-snapshots — Submit census"
      - "POST /census-snapshots/{id}/validate — Validate census"
      - "POST /census-snapshots/{id}/reject — Reject census"
      - "POST /underwriting-cases/{id}/claims-experiences — Create claims"
      - "POST /claims-experiences/{id}/submit — Submit claims"
      - "POST /underwriting-cases/{id}/plan-designs — Create plan design"
      - "POST /plan-designs/{id}/model — Model plan"
      - "POST /plan-designs/{id}/reject — Reject plan"
      - "POST /underwriting-cases/{id}/quotes — Create quote"
      - "POST /quotes/{id}/propose — Propose quote"
      - "POST /quotes/{id}/respond — Respond to counter"
      - "POST /quotes/{id}/reject-quote — Reject quote"
      - "POST /quotes/{id}/stop-loss-quotes — Create stop-loss"
      - "POST /stop-loss-quotes/{id}/quote — Quote stop-loss"
      - "POST /stop-loss-quotes/{id}/bind — Bind stop-loss"
      - "POST /stop-loss-quotes/{id}/decline-slq — Decline stop-loss"
      - "POST /negotiation-rounds/{id}/withdraw-round — Withdraw round"
      - "POST /underwriting-cases/{id}/enrollment-changes — Report enrollment change"
      - "POST /enrollment-changes/{id}/process — Process enrollment change"
      - "POST /commission-disclosures/{id}/disclose — Disclose commission"
      - "POST /_clock/set_current_utc — Set clock"

  - name: SeniorUnderwriter
    description: "Senior underwriter with review authority; reviews claims, manages broker status"
    identity: opaque
    exclusive_operations:
      - "POST /claims-experiences/{id}/review — Review claims"
      - "POST /claims-experiences/{id}/reject — Reject claims"
      - "PUT /brokers/{id} — Update broker status"
    shared_operations:
      - "POST /underwriting-cases/{id}/decline — Decline case"

  - name: Broker
    description: "External insurance broker; counters and accepts quotes, reports enrollment changes, acknowledges disclosures"
    identity: entity_backed:Broker
    exclusive_operations:
      - "POST /quotes/{id}/counter — Counter-propose quote"
      - "POST /quotes/{id}/accept — Accept quote"
      - "POST /commission-disclosures/{id}/acknowledge — Acknowledge disclosure"
    shared_operations:
      - "POST /underwriting-cases/{id}/withdraw — Withdraw case"
      - "POST /quotes/{id}/reject-quote — Reject quote"
      - "POST /negotiation-rounds/{id}/withdraw-round — Withdraw round"
      - "POST /underwriting-cases/{id}/enrollment-changes — Report enrollment change"

  - name: ComplianceOfficer
    description: "Read-only compliance oversight; can view all entities"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /underwriting-cases — List cases"
      - "GET /underwriting-cases/{id} — Get case"
      - "GET /brokers — List brokers"
      - "GET /brokers/{id} — Get broker"
      - "GET /underwriting-cases/{id}/census-snapshots — List census"
      - "GET /census-snapshots/{id} — Get census"
