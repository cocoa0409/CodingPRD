          assert:
            - "after the two setup bookings Sailing.${sail_f}.lower_berths_sold == 4 and occupancy_pct == 100.00, so inventory_posture == FROZEN on the inclusive floor"
            - "SailingInventory.${inv_f}.booked_cabins == 2 and available_cabins == 3 - physical cabins are NOT the binding constraint here"
            - "the allow_waitlist false booking returns HTTP 422 with data.error_id == ERR_POSTURE_FROZEN, not ERR_CATEGORY_SOLD_OUT, because priority 18 runs before priority 19"
            - "the allow_waitlist true booking returns HTTP 201 with booking_status == WAITLISTED and payment_status == AWAITING_DEPOSIT"
            - "Booking.${bk_cy} is still fully priced: net_ticket_cents == 100000, deposit_due_cents == 50000, projected_onboard_gross_cents == 72000, and fare_rule_id is pinned"
            - "SailingInventory.${inv_f}.waitlisted_bookings_count == 1, booked_cabins == 2 and available_cabins is still 3 - a waitlisted booking consumes no cabin"
            - "Sailing.${sail_f}.lower_berths_sold is still 4, occupancy_pct still 100.00, gross_ticket_revenue_cents == 200000 and projected_onboard_revenue_cents == 144000 - the waitlisted booking is outside every aggregate set"
            - "Sailing.${sail_f}.ralbd_gross_cents == 21500 and ralbd_net_cents == 21500 (344000 / 16) with revenue_alert == false"
            - "Guest.${g_cy}.bookings_count == 1 - only the accepted call counted"

      - name: an_upgrade_bid_links_its_booking_to_a_target_category
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /bookings/{id}/upgrade-bids]
          - validations[priority=17].ERR_UPGRADE_PATH_INVALID
          - validations[priority=5].ERR_BOOKING_NOT_FOUND
          - validations[priority=6].ERR_CABIN_CATEGORY_NOT_FOUND
          - calculations.upgrade_bid_floor
        distinguishing_aspect: |
          The bid is the only entity that joins a Booking to a second CabinCategory, and the link is
          legal only along the upgrade hierarchy: a category that exists and is on the sailing but
          is not reachable from the booking's assigned category is refused at priority 17, while a
          category that does not exist at all is a body-FK 404 and a missing booking is a path 404
          resolved first. The successful link derives its floor from BOTH ends of the join.
        test_recipe:
          setup:
            - "Clock at 2026-11-26T17:00:00Z and embark 2027-01-10T17:00:00Z, so days_to_sail is exactly 45 - inside the 3..60 bidding window."
            - "Sailing LNK-2701 (nights 7, total_lower_berths 200) is OPEN_FOR_SALE with three allotments and a 730..0 fare window each: IA (guarantee, tier 1, upgrade_to OV, base 189995, onboard upper 6000), OV (tier 2, base 289995, onboard upper 7000) and SPA (tier 3, base 249995), where SPA is NOT on IA's upgrade chain."
            - "One booking of two adults sits on IA with assigned_cabin_category_id == IA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-26T17:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
