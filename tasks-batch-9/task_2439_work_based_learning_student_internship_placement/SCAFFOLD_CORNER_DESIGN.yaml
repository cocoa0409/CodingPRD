              captures: { tp_id: $.data.id }
            - call: "POST /wbl/learning-objectives"
              payload: { training_plan_id: "${tp_id}", competency_code: "AG-1", description: "Stack and rotate feed inventory", aligned_course_code: "AGR-160", assessment_method: "SUPERVISOR_RATING" }
              as: WblCoordinator
            - call: "POST /wbl/learning-objectives"
              payload: { training_plan_id: "${tp_id}", competency_code: "AG-2", description: "Advise a customer on seed selection", aligned_course_code: "AGR-160", assessment_method: "REFLECTION" }
              as: WblCoordinator
            - call: "POST /wbl/learning-objectives"
              payload: { training_plan_id: "${tp_id}", competency_code: "AG-3", description: "Apply safe lifting procedure", aligned_course_code: "AGR-160", assessment_method: "PORTFOLIO" }
              as: WblCoordinator
            - call: "POST /wbl/training-plans/${tp_id}/submit"
              payload: {}
              as: WblCoordinator
            - call: "POST /wbl/training-plans/${tp_id}/approve"
              payload: {}
              as: WblCoordinator
              as_user_id: "coord-approver-3"
          trigger:
            - call: "POST /wbl/training-plans"
              payload: { placement_id: "${pl_id}", course_code: "AGR-161", credit_hours_target: 70.00, expected_placement_version: "${pl_v1}" }
              as: WblCoordinator
          assert:
            - "response status == 412"
            - "response error.code == ERR_STALE_PLACEMENT_VERSION"
            - "TrainingPlan.${tp_id}.status == APPROVED"
            - "Placement.${pl_id}.lifecycle_status == ACTIVE"
            - "Placement.${pl_id}.compliance_status == CLEARED"
            - "Placement.${pl_id}.version == ${pl_v1} + 1, i.e. the approval bumped it exactly once and the rejected write did not bump it again"
            - "GET /wbl/placements/${pl_id}/training-plans returns exactly one row"

      - name: placement_create_against_a_stale_worksite_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[placement-create-stale-worksite]
          - validations[priority=9]
          - errors[ERR_STALE_WORKSITE_VERSION]
        distinguishing_aspect: |
          The OCC gate sits at priority 9, ahead of every state and business rule on this endpoint: a
          placement request built on the pre-decision worksite version must return 412
          ERR_STALE_WORKSITE_VERSION even though the agreement is still PENDING_EMPLOYER and the student
          holds no issued permit — the stale read is reported first, and no slot is committed.
        test_recipe:
          setup:
            - "logical clock at 2026-09-07T08:00:00Z"
            - "worksite read at version 1 and then decided APPROVED, so its version is now 2"
            - "supervisor, a drafted (still PENDING_EMPLOYER) agreement and an eligible student all exist"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Brambleton Garden Centre", naics_code: "444230", industry_sector: "RETAIL", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10281", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /wbl/worksites"
              payload: { employer_partner_id: "${emp_id}", site_name: "Brambleton Nursery Yard", address_line: "40 Brambleton Rd", hazard_class: "NON_HAZARDOUS", has_power_machinery: false, displaces_paid_employee: false, max_concurrent_students: 2 }
              as: WblCoordinator
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /wbl/safety-reviews"
              payload: { worksite_id: "${ws_id}", machinery_guarding_ok: true, hazard_findings_count: 0, orientation_documented: true, emergency_plan_on_file: true, expected_worksite_version: "${ws_v1}" }
              as: SafetyReviewer
              captures: { rev_id: $.data.id }
            - call: "POST /wbl/safety-reviews/${rev_id}/decision"
              payload: { decision: "APPROVED" }
              as: SafetyReviewer
            - call: "POST /wbl/supervisors"
              payload: { worksite_id: "${ws_id}", full_name: "Cy Ferraro", email: "cy@brambleton.example", training_completed_on: "2026-07-28", max_student_load: 2 }
              as: WblCoordinator
              captures: { sup_id: $.data.id }
            - call: "POST /wbl/agreements"
              payload: { employer_partner_id: "${emp_id}", worksite_id: "${ws_id}", employer_signer_supervisor_id: "${sup_id}", effective_on: "2026-09-01", expires_on: "2027-06-30", insurance_rider: true }
              as: WblCoordinator
              as_user_id: "coord-drafter-1"
              captures: { agr_id: $.data.id }
            - call: "POST /wbl/students"
              payload: { full_name: "Dara Okoro", birth_date: "2009-10-10", grade_level: 11, gpa: 3.10, attendance_rate: 0.93, student_learner_certificate: true, guardian_consent_on_file: true }
              as: WblCoordinator
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /wbl/placements"
              payload: { student_id: "${stu_id}", worksite_id: "${ws_id}", agreement_id: "${agr_id}", supervisor_id: "${sup_id}", pay_classification: "PAID", hourly_wage_cents: 1600, scheduled_weekly_hours: 12.00, start_on: "2026-09-07", end_on: "2026-12-18", credit_target_credits: 0.50, credit_award_mode: "HOURS_BASED", transportation_mode: "DISTRICT_BUS", expected_worksite_version: "${ws_v1}" }
              as: WblCoordinator
          assert:
            - "response status == 412"
            - "response error.code == ERR_STALE_WORKSITE_VERSION"
            - "the response is not 409 ERR_AGREEMENT_NOT_EXECUTED and not 422 ERR_WORK_PERMIT_INVALID"
            - "Worksite.${ws_id}.version == 2"
            - "Worksite.${ws_id}.slots_committed == 0"
            - "no Placement row was created"

      - name: three_level_incident_cascade_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: transitive_cascade / critical_incident_finding_cascades_worksite_partner_placement_and_cycle
          rationale: "The depth-4 chain and each hop's ordering are asserted there; the agreement-termination cascade instance covers the second chain."

      - name: dual_variant_wage_layer_end_to_end
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: dual_variant_calc / wage_provisional_vs_final_diverge_on_placement_money
          rationale: "Both variants, the delta and the settlement switch are asserted there."

      - name: cumulative_hour_threshold_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: boundary_precision_check / weekly_hour_cap_accepts_exactly_18_00_then_rejects_18_25
          rationale: "The cumulative weekly threshold is tested at the cap and one step past it, and the void-and-reload reset is covered by the compensating-invariant instance."

  - section: consistency model
    instances:
      - name: cross_aggregate_score_is_visible_on_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.employer_safety_score_posture
        distinguishing_aspect: |
          The model is immediate, so the partner's denormalised safety_score and posture — written as a
          side effect of a decision on a different aggregate — must already be correct on the next read
          with no sweep, no re-read delay and no clock advance: 90 and ELIGIBLE straight after the
          CONDITIONAL decision.
        test_recipe:
          setup:
            - "logical clock at 2026-09-07T08:00:00Z"
            - "partner at score 100 / PROSPECT whose only worksite has just been decided CONDITIONAL"
          setup_api_calls:
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/employer-partners"
              payload: { legal_name: "Alder Gate Recycling", naics_code: "562920", industry_sector: "MANUFACTURING", workers_comp_carrier: "Statewide Mutual", workers_comp_policy_no: "WC-10271", workers_comp_expires_on: "2027-06-30" }
              as: WblCoordinator
              captures: { emp_id: $.data.id }
            - call: "POST /wbl/worksites"
              payload: { employer_partner_id: "${emp_id}", site_name: "Alder Gate Sort Line", address_line: "31 Alder Gate", hazard_class: "LIMITED_HAZARD", has_power_machinery: true, displaces_paid_employee: false, max_concurrent_students: 1 }
              as: WblCoordinator
              captures: { ws_id: $.data.id, ws_v1: $.data.version }
            - call: "POST /wbl/safety-reviews"
              payload: { worksite_id: "${ws_id}", machinery_guarding_ok: true, hazard_findings_count: 3, orientation_documented: true, emergency_plan_on_file: true, expected_worksite_version: "${ws_v1}" }
              as: SafetyReviewer
              captures: { rev_id: $.data.id }
            - call: "POST /wbl/safety-reviews/${rev_id}/decision"
              payload: { decision: "CONDITIONAL" }
              as: SafetyReviewer
          trigger:
            - call: "GET /wbl/employer-partners/${emp_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "response status == 200"
            - "response data.safety_score == 90"
            - "response data.posture == ELIGIBLE"
            - "response data.substantiated_minor_count == 0"
            - "GET /wbl/worksites/${ws_id} in the same test shows safety_status CONDITIONAL and version 2"

