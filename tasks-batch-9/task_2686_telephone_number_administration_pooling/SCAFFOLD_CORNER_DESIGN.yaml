        distinguishing_aspect: "The approver may name an explicit granted_block_count, and priority 34 measures it against the composed growth_grant_size entitlement of 1 - min(3 requested, 6 demand, 1 tier_cap, 5 pool) - so 3 is refused even though the forecast and the pool would both support 3."
        test_recipe:
          setup: ["Carrier A licensed and VERIFIED. NPA 614 / rate center COLUMBUS (NON_POOLED) holds five pristine unassigned blocks 614-555-0..4. A submitted 2026-H1 filing reads 65.00 (blocks_held 2, assigned 1300) with forecast 3000/3000/0/0, so demand_blocks is ceil(6000/1000) = 6, monthly demand is 1000 and months_to_exhaust is 5000 / 1000 = 5.00 - inside the 6-month ceiling. A PENDING_REVIEW GROWTH request asks for 3 blocks."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
