      - name: settlement_rounds_half_up_per_item_and_the_air_tolerance_boundary_is_inclusive
        claim_type: Precision
        grounds: "§1.3 spot_credit_settlement (per_spot_rate_cents = rate_cents_total / ordered_spots kept as an exact rational; AIRED_FULL iff PLAYED and measured >= unit - AIR_TOLERANCE_SECONDS(1); raw_credit = per_spot * (unit - measured) / unit for SHORT_AIR; 'ROUNDING ORDER IS PINNED: round EACH per-item credit with ROUND_HALF_UP first, THEN sum'); §1.1 SpotOrder status preconditions"
        distinguishing_aspect: "The order rate is deliberately not divisible by the spot count (3650 / 3), so per_spot_rate_cents is a non-terminating rational and each short-air credit lands on exactly 36.5 cents. Half-up gives 37 + 37 = 74; banker's rounding gives 36 + 36 = 72; summing the exact rationals and rounding once gives 73; rounding per_spot_rate_cents to 1217 up front gives 37 + 37 = 74 but the wrong FINAL figures elsewhere. One item airs at exactly unit - 1 seconds and must be AIRED_FULL with zero credit."
