              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "TEMPORARY_STORAGE", sublimit_cents: 20000000 }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/named-insured-interests"
              payload: { policy_id: "${pl1}", party_name: "Cedar Mills Owner LLC", party_role: "OWNER", insurable_interest_pct: 100, loss_payee_priority: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { int1: $.data.id }
            - call: "POST /builders-risk/named-insured-interests/${int1}/acknowledge"
              payload: {}
