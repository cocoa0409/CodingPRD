            - "Before the posting: SlottingDeal.${deal} has accepted_fee_cents 5125000 == recovered_cents 0 + unamortized_balance_cents 5125000 + written_off_cents 0, and Principal.${prin}.open_slotting_liability_cents == 5125000 with liability_ratio_bps == 2562"
