          setup:
            - "Study ACTIVE; site ACTIVE; lot LOT-CAS-1 range [2,8] budget 600 with exactly two kits K-D1/K-D2, both AVAILABLE (released)"
            - "One out-of-range datalogger reading (9.0 C at default clock) quarantines both kits"
          setup_api_calls:
            - { call: "POST /api/studies", payload: { protocol_number: "P-CAS-1", title: "Cascade Study", phase: "PHASE_II", blinding_model: "DOUBLE_BLIND", max_dose_per_visit_mg: 200, unblinding_suspension_threshold_pct: 10 }, as: SponsorAdmin, captures: { study: $.data.id, study_v1: $.data.version } }
