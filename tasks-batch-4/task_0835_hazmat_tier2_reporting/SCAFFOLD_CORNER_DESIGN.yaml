              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { rel_id: $.data.id }
            - call: "POST /epcra/lepc-notices"
              payload: { release_id: "${rel_id}", notice_type: "VERBAL", recipient: "SERC" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /epcra/lepc-notices/${notice_id}/acknowledge"
              payload: {}
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: sds_create_stale_facility_version_returns_412
        claim_type: optimistic_concurrency
        grounds: "[\"concurrency_rules[sds-create-stale-facility]\", \"errors[ERR_STALE_FACILITY_VERSION]\"]"
        distinguishing_aspect: "A second SDS create carrying the pre-first-create expected_facility_version is rejected with ERR_STALE_FACILITY_VERSION (412) after the first create advanced Facility.version."
        test_recipe:
          setup: ["Facility (version 1) and a chemical; one SDS already created (facility now version 2)."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "OccF", epa_facility_id: "CN-0031", state_code: "TX", county: "Harris", operator_name: "OccOp" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-31", name: "Formaldehyde", is_ehs: true, tpq_lbs: 500, rq_lbs: 100, hazard_weight: 0.3, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://v1", revision_date: "2025-01-01T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://v2", revision_date: "2025-06-01T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_FACILITY_VERSION"
            - "HTTP status == 412"

      - name: sds_create_increments_facility_version
        claim_type: optimistic_concurrency
        grounds: "[\"concurrency_rules[sds-create-stale-facility]\", entities.Facility.fields.version]"
        distinguishing_aspect: "A successful SDS create increments Facility.version from 1 to 2."
        test_recipe:
          setup: ["Facility (version 1) and a chemical."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "VerF", epa_facility_id: "CN-0032", state_code: "TX", county: "Harris", operator_name: "VerOp" }
              as: Regulator
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-32", name: "Vinyl Chloride", is_ehs: true, tpq_lbs: 500, rq_lbs: 100, hazard_weight: 0.3, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/sds"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", document_ref: "sds://v1", revision_date: "2025-01-01T00:00:00Z", expected_facility_version: "${fac_v}" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
          trigger:
            - call: "GET /epcra/facilities/${fac_id}"
              payload: {}
              as: Regulator
              captures: { ver: $.data.version }
          assert:
            - "Facility.${fac_id}.version == 2"

      - name: permit_reinstated_on_enforcement_case_resolve
        claim_type: cascading_side_effects
        grounds: [state_machines.ComplianceCase.UNDER_REVIEW_to_RESOLVED, state_machines.Permit.SUSPENDED_to_ACTIVE, entities.Facility.fields.compliance_posture]
        distinguishing_aspect: "Resolving the facility's only enforcement case (posture leaves ENFORCEMENT) reinstates the SUSPENDED permit to ACTIVE — compensating cascade."
        test_recipe:
          setup: ["Facility with an ACTIVE permit and a PASSED inspection; an RQ release put it in ENFORCEMENT (permit SUSPENDED); the auto RELEASE_RQ_EXCEEDED case is moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /epcra/facilities"
              payload: { name: "ReinF", epa_facility_id: "CN-0033", state_code: "TX", county: "Harris", operator_name: "ReinOp" }
              as: Regulator
              captures: { fac_id: $.data.id }
            - call: "POST /epcra/permits"
              payload: { facility_id: "${fac_id}", permit_type: "OPERATING", issued_date: "2026-01-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", fee_cents: 25000 }
              as: Regulator
              captures: { permit_id: $.data.id }
            - call: "POST /epcra/inspections"
              payload: { facility_id: "${fac_id}", inspector_id: "INSP-C9", scheduled_date: "2026-02-01T09:00:00Z" }
              as: Regulator
              captures: { insp_id: $.data.id }
            - call: "POST /epcra/inspections/${insp_id}/start"
              payload: {}
              as: Regulator
            - call: "POST /epcra/inspections/${insp_id}/complete"
              payload: { result: "PASS" }
              as: Regulator
            - call: "POST /epcra/chemicals"
              payload: { cas_number: "CN-33", name: "Sulfur Dioxide", is_ehs: true, tpq_lbs: 500, rq_lbs: 50, hazard_weight: 0.4, physical_state: "GAS" }
              as: Regulator
              captures: { chem_id: $.data.id }
            - call: "POST /epcra/release-notifications"
              payload: { facility_id: "${fac_id}", chemical_id: "${chem_id}", release_datetime: "2026-02-20T00:00:00Z", quantity_released_lbs: 100, medium: "AIR" }
              as: FacilityOperator
              as_user_id: "${fac_id}"
            - call: "GET /epcra/facilities/${fac_id}/compliance-cases"
              payload: {}
              as: Regulator
              captures: { case_id: "$.data[0].id" }
            - call: "POST /epcra/compliance-cases/${case_id}/review"
              payload: {}
              as: Regulator
          trigger:
            - call: "POST /epcra/compliance-cases/${case_id}/resolve"
              payload: { penalty_cents: 5000 }
              as: Regulator
            - call: "GET /epcra/facilities/${fac_id}"
              payload: {}
              as: Regulator
              captures: { posture: $.data.compliance_posture }
            - call: "GET /epcra/facilities/${fac_id}/permits"
              payload: {}
              as: Regulator
              captures: { permit_status_0: "$.data[0].status" }
          assert:
            - "Facility.${fac_id}.compliance_posture == COMPLIANT"
            - "Permit.${permit_id}.status == ACTIVE"

      - name: error_release_enforcement_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Permit.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / release_rq_to_case_to_enforcement_to_permit_suspend
          rationale: "The forward release->case->enforcement->suspend cascade is asserted by the named §1.8 instance."

      - name: error_hazard_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds: [entities.Facility.fields.hazard_index]
        excluded_because:
          difficulty_instance: compensating_invariant / hazard_index_add_retire_conserves
          rationale: "Hazard_index derived reconciliation across add/retire is asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_computed_fields_on_inventory_create
        claim_type: immediate
        grounds: [entities.ChemicalInventory.fields.is_reportable, entities.ChemicalInventory.fields.applicable_threshold_lbs]
        excluded_because:
          difficulty_instance: dual_variant_calc / inventory_max_vs_average_amount
          rationale: "Computed fields are visible in the same create response, as asserted by the named §1.8 instance."
