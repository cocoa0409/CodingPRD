      - name: certify_safety_beats_temporal
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_CREW_NOT_CLEARED]
          - errors[ERR_CERTIFICATION_WINDOW_CLOSED]
