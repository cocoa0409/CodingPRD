            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MUNICIPAL_OPERATIONS", measurable_goal_target: 20, weight: 1, salt_storage_covered: true, fleet_wash_recycle: true }
              as: StormwaterProgramManager
            - call: "POST /stormwater/control-measures"
              payload: { permit_term_id: "${term_id}", measure_code: "MONITORING", measurable_goal_target: 4, weight: 1 }
              as: StormwaterProgramManager
            - call: "POST /stormwater/permit-terms/${term_id}/activate"
              payload: {}
              as: StormwaterProgramManager
            - call: "POST /stormwater/construction-sites"
              payload: { permit_term_id: "${term_id}", site_name: "SITE-G", operator_name: "Greenfield Homes", disturbed_acres: 1.20 }
              as: ConstructionInspector
              as_user_id: "insp-01"
              captures: { site_g_id: $.data.id }
            - call: "POST /stormwater/construction-sites/${site_g_id}/submit-esc-plan"
              payload: { esc_plan_reference: "ESC-G-1" }
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/construction-sites/${site_g_id}/esc-review"
              payload: { decision: "APPROVE" }
              as: ConstructionInspector
              as_user_id: "insp-01"
            - call: "POST /stormwater/post-construction-facilities"
              payload: { construction_site_id: "${site_g_id}", facility_type: "BIORETENTION", ownership: "PRIVATE", design_capacity_cf: 4200, service_area_acres: 1.20 }
              as: ConstructionInspector
              as_user_id: "insp-01"
              captures: { fac_g_id: $.data.id }
            - call: "POST /stormwater/accounts"
              payload: { permit_term_id: "${term_id}", parcel_id: "P-9020", owner_name: "Harborline Retail LLC", parcel_class: "COMMERCIAL", impervious_area_sqft: 9020 }
              as: UtilityBillingClerk
              captures: { acct_a_id: $.data.id, acct_v1: $.data.version }
            - call: "POST /stormwater/fee-credit-applications"
              payload: { stormwater_account_id: "${acct_a_id}", requested_credit_pct: 0.2245, bmp_description: "Bioretention basin serving the parcel", expected_stormwater_account_version: "${acct_v1}", post_construction_facility_id: "${fac_g_id}" }
              as: UtilityBillingClerk
