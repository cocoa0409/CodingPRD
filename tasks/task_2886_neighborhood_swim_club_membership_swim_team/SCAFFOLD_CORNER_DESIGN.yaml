            - "the 2-guest visit is HTTP 201 with ${v_a_passes} == 2 and ${v_a_fee} == 0: the envelope's boundary is inclusive and RESTRICTED is not a shutdown"
            - "${err_restricted_zone} == ERR_FACILITY_RESTRICTED: WHOLE_FACILITY is outside the envelope no matter how small the party is"
