scenario: |
  Cheese Plant & Aging Program (Wisconsin cheese plant): vat scheduling & make procedure by variety, culture/coagulant inventory & lot, yield from milk components & whey stream valorization, aging room inventory & turn schedule, quality grading & release decision, private-label vs branded allocation, cut-and-wrap conversion & waste, export certificate & regulatory listing

domain_name: cheese-plant-aging
api_prefix: /plant

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Plant
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Plant name" }
      - { name: license_number, type: string, source: input, description: "WI dairy plant license number" }
      - { name: export_listed, type: boolean, source: input, default: false, description: "Whether plant appears on the federal export-eligible regulatory listing" }
      - { name: total_aging_capacity_wheels, type: integer, source: computed, description: "Sum of capacity_wheels over all AgingRoom rows with status != DECOMMISSIONED" }

  - name: MilkIntake
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: hauler_ticket, type: string, source: input, description: "External hauler manifest reference" }
      - { name: received_at, type: datetime, source: input, description: "Timestamp milk was received at the plant" }
      - { name: volume_liters, type: number, source: input, description: "Raw milk volume received, liters" }
      - { name: fat_pct, type: number, source: input, description: "Butterfat percentage from lab (e.g. 3.85)" }
      - { name: protein_pct, type: number, source: input, description: "True protein percentage from lab (e.g. 3.10)" }
      - { name: somatic_cell_count, type: integer, source: input, description: "SCC per mL; regulatory threshold 400000" }
      - { name: antibiotics_detected, type: boolean, source: input, default: false, description: "Rapid antibiotic screen result" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> ACCEPTED | REJECTED -> CONSUMED" }
      - { name: consumed_liters, type: number, source: computed, default: 0, description: "Liters committed to MakeSheets" }

  - name: Vat
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: code, type: string, source: input, description: "Vat identifier, unique per plant (e.g. VAT-3)" }
      - { name: capacity_liters, type: integer, source: input, description: "Maximum fill volume in liters" }
      - { name: cip_clean, type: boolean, source: system, default: true, description: "Clean-in-place status; a vat must be CIP-clean to accept a MakeSheet" }
      - { name: status, type: enum, source: system, description: "IDLE -> BOOKED -> IN_MAKE -> CLEANING -> IDLE; DECOMMISSIONED terminal" }

  - name: MakeSheet
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: vat_id, type: string, source: input, description: "FK -> Vat.id; booked vat" }
      - { name: milk_intake_id, type: string, source: input, description: "FK -> MilkIntake.id; milk source for this make" }
      - { name: variety, type: enum, source: input, description: "CHEDDAR | COLBY | BRICK | MUENSTER" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned make start (vat booking interval start)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned make end (vat booking interval end)" }
      - { name: liters_committed, type: number, source: input, description: "Liters of milk committed from the intake" }
      - { name: culture_lot_id, type: string, source: input, description: "FK -> AdditiveLot.id; culture lot to consume" }
      - { name: coagulant_lot_id, type: string, source: input, description: "FK -> AdditiveLot.id; coagulant lot to consume" }
      - { name: culture_units_planned, type: number, source: input, description: "Culture units required by the variety's make procedure" }
      - { name: coagulant_ml_planned, type: number, source: input, description: "Coagulant mL required by the variety's make procedure" }
      - { name: make_steps_completed, type: integer, source: system, default: 0, description: "Number of variety make-procedure steps signed off" }
      - { name: make_steps_required, type: integer, source: computed, description: "Step count pinned by variety (CHEDDAR 8, COLBY 6, BRICK 5, MUENSTER 5)" }
      - { name: step_signer_ids, type: array, source: system, description: "Ordered list of X-User-ID values that signed each make step; drives segregation-of-duties checks" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> CURD_READY -> COMPLETED | CANCELLED" }

  - name: AdditiveLot
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: kind, type: enum, source: input, description: "CULTURE | COAGULANT" }
      - { name: supplier_lot_no, type: string, source: input, description: "Supplier lot number; unique per (plant, kind)" }
      - { name: expires_at, type: datetime, source: input, description: "Lot expiration timestamp" }
      - { name: quantity_on_hand, type: number, source: computed, description: "Remaining quantity (units for CULTURE, mL for COAGULANT)" }
      - { name: quantity_initial, type: number, source: input, description: "Received quantity" }
      - { name: status, type: enum, source: system, description: "QUARANTINE -> RELEASED -> DEPLETED | EXPIRED | RECALLED" }

  - name: CheeseBatch
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: make_sheet_id, type: string, source: system, description: "FK -> MakeSheet.id; originating make" }
      - { name: variety, type: enum, source: system, description: "Copied from MakeSheet.variety" }
      - { name: green_weight_kg, type: number, source: input, description: "Actual hooped weight recorded at COMPLETED" }
      - { name: yield_provisional_pct, type: number, source: computed, description: "Provisional yield from milk components at batch creation" }
      - { name: yield_actual_pct, type: number, source: computed, description: "Final yield = green_weight_kg / liters_committed * 100, recorded at COMPLETED" }
      - { name: wheels_produced, type: integer, source: input, description: "Wheel count pressed from this batch" }
      - { name: wheels_placed, type: integer, source: computed, default: 0, description: "Wheels placed into aging rooms" }
      - { name: moisture_pct, type: number, source: computed, description: "Latest grading moisture reading" }
      - { name: fat_dry_basis_pct, type: number, source: computed, description: "Latest grading fat-in-dry-matter reading" }
      - { name: current_grade, type: enum, source: system, description: "UNGRADED | GRADE_A | GRADE_B | DOWNGRADE | CONDEMNED" }
      - { name: release_decision, type: enum, source: system, description: "PENDING | RELEASED | REJECTED" }
      - { name: min_age_days, type: integer, source: computed, description: "Variety minimum age (CHEDDAR 60, COLBY 0, BRICK 30, MUENSTER 21)" }
      - { name: status, type: enum, source: system, description: "GREEN -> AGING -> GRADED -> RELEASED -> ALLOCATED | CONDEMNED" }

  - name: WheyStream
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: make_sheet_id, type: string, source: system, description: "FK -> MakeSheet.id; originating make" }
      - { name: total_whey_kg, type: number, source: computed, description: "liters_committed - green_weight_kg (kg approx)" }
      - { name: valorized_kg, type: number, source: input, description: "Kg of whey sold/valorized (WPC, feed)" }
      - { name: disposed_kg, type: number, source: computed, description: "= total_whey_kg - valorized_kg; must be >= 0" }
      - { name: valorization_rate_pct, type: number, source: computed, description: "= valorized_kg / total_whey_kg * 100" }

  - name: AgingRoom
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: code, type: string, source: input, description: "Room code, unique per plant" }
      - { name: capacity_wheels, type: integer, source: input, description: "Maximum wheel positions" }
      - { name: wheels_present, type: integer, source: computed, default: 0, description: "Current wheel count (sum of AgingUnit wheels where unit.status = IN_ROOM)" }
      - { name: temp_c, type: number, source: input, description: "Room temperature Celsius" }
      - { name: humidity_pct, type: number, source: input, description: "Relative humidity percent" }
      - { name: posture, type: enum, source: computed, description: "AVAILABLE | FULL | DEVIATION — FULL when wheels_present == capacity_wheels; DEVIATION when temp/humidity out of band" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> DECOMMISSIONED (terminal)" }

  - name: AgingUnit
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: cheese_batch_id, type: string, source: input, description: "FK -> CheeseBatch.id; batch these wheels belong to" }
      - { name: aging_room_id, type: string, source: system, description: "FK -> AgingRoom.id; current room" }
      - { name: wheel_count, type: integer, source: input, description: "Wheels in this placement unit" }
      - { name: entered_at, type: datetime, source: system, description: "When wheels entered the aging room (clock time)" }
      - { name: age_days, type: integer, source: computed, description: "floor((now - entered_at) / 86400) using logical clock" }
      - { name: last_turned_at, type: datetime, source: system, description: "Last turn timestamp" }
      - { name: turns_due, type: boolean, source: computed, description: "True when age in days since last_turned_at >= variety turn interval" }
      - { name: status, type: enum, source: system, description: "IN_ROOM -> MOVED -> IN_ROOM | REMOVED" }

  - name: GradingEvent
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: cheese_batch_id, type: string, source: input, description: "FK -> CheeseBatch.id; batch under inspection" }
      - { name: grader_user_id, type: string, source: system, description: "X-User-ID of the QAGrader performing the grading (segregation of duties anchor)" }
      - { name: moisture_pct, type: number, source: input, description: "Measured moisture percent" }
      - { name: fat_dry_basis_pct, type: number, source: input, description: "Fat-in-dry-matter percent" }
      - { name: body_score, type: integer, source: input, description: "Body/texture score 1-10" }
      - { name: flavor_score, type: integer, source: input, description: "Flavor score 1-10" }
      - { name: assigned_grade, type: enum, source: computed, description: "GRADE_A | GRADE_B | DOWNGRADE | CONDEMNED per grading rules" }
      - { name: graded_at, type: datetime, source: system, description: "Logical-clock timestamp of grading" }
      - { name: supersedes_grading_event_id, type: string, source: system, description: "FK -> GradingEvent.id; prior grading this re-grade replaces" }

  - name: AllocationOrder
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: cheese_batch_id, type: string, source: input, description: "FK -> CheeseBatch.id; batch being allocated" }
      - { name: channel, type: enum, source: input, description: "PRIVATE_LABEL | BRANDED" }
      - { name: customer_name, type: string, source: input, description: "Customer account name" }
      - { name: wheels_requested, type: integer, source: input, description: "Wheels committed to this order" }
      - { name: wheels_cut, type: integer, source: computed, default: 0, description: "Wheels consumed by CutWrapRuns against this order" }
      - { name: priority, type: integer, source: input, description: "Lower = earlier allocation; tie-break created_at ASC" }
      - { name: status, type: enum, source: system, description: "OPEN -> PARTIALLY_FILLED -> FILLED | CANCELLED" }

  - name: CutWrapRun
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: allocation_order_id, type: string, source: input, description: "FK -> AllocationOrder.id; order this run services" }
      - { name: wheels_in, type: integer, source: input, description: "Whole wheels fed to the cutter" }
      - { name: finished_case_weight_kg, type: number, source: input, description: "Saleable cut-and-wrapped case weight" }
      - { name: trim_waste_kg, type: number, source: input, description: "Rind and trim waste kg" }
      - { name: input_weight_kg, type: number, source: computed, description: "wheels_in * standard wheel weight (CHEDDAR 18.0, COLBY 12.0, BRICK 2.5, MUENSTER 3.0)" }
      - { name: reconciliation_gap_kg, type: number, source: computed, description: "= input_weight_kg - finished_case_weight_kg - trim_waste_kg; must be >= 0 and <= 2% of input" }
      - { name: status, type: enum, source: system, description: "DRAFT -> RECONCILED | VOIDED" }

  - name: ExportCertificate
    parent: Plant
    common_fields: true
    fields:
      - { name: plant_id, type: string, source: system, description: "FK -> Plant.id; owning plant" }
      - { name: cut_wrap_run_id, type: string, source: input, description: "FK -> CutWrapRun.id; reconciled run being certified" }
      - { name: destination_country, type: string, source: input, description: "Importing country code" }
      - { name: consignee, type: string, source: input, description: "Foreign consignee name" }
      - { name: certificate_number, type: string, source: system, description: "Server-minted certificate number" }
      - { name: issued_at, type: datetime, source: system, description: "Issuance timestamp from logical clock" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> ISSUED | DENIED | REVOKED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MilkIntake
    initial_state: RECEIVED
    terminal_states: [REJECTED, CONSUMED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /plant/milk-intakes/{milkIntakeId}/accept"
        actor: MilkReceiver
        preconditions:
          - "somatic_cell_count <= 400000 (ERR_SCC_LIMIT)"
          - "antibiotics_detected == false (ERR_ANTIBIOTIC_POSITIVE)"
        side_effects: []
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /plant/milk-intakes/{milkIntakeId}/reject"
        actor: MilkReceiver
        preconditions: []
        side_effects:
          - "Intake becomes ineligible for MakeSheet commitment"
      - from: ACCEPTED
        to: CONSUMED
        trigger: "system (automatic when consumed_liters == volume_liters after a MakeSheet commit)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Vat
    initial_state: IDLE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: IDLE
        to: BOOKED
        trigger: "POST /plant/make-sheets (first active MakeSheet booked against this vat)"
        actor: MakePlanner
        preconditions:
          - "cip_clean == true (ERR_VAT_NOT_CLEAN)"
          - "No MakeSheet on the same vat with status in {SCHEDULED, IN_PROGRESS, CURD_READY} whose half-open interval [scheduled_start, scheduled_end) intersects the requested interval; back-to-back adjacency (request.start == existing.end or request.end == existing.start) is NON-overlapping (ERR_VAT_OVERLAP)"
          - "liters_committed <= capacity_liters (ERR_VAT_CAPACITY)"
        side_effects:
          - "vat.status = BOOKED"
      - from: BOOKED
        to: BOOKED
        trigger: "POST /plant/make-sheets (additional non-overlapping booking queued on the same vat — a booking queue)"
        actor: MakePlanner
        preconditions:
          - "Same overlap / capacity / cip_clean preconditions as IDLE -> BOOKED (a vat with an active booking queue still accepts later non-overlapping slots)"
        side_effects:
          - "vat.status stays BOOKED; vat.version increments by 1"
        note: "Multiple SCHEDULED makes form the vat's booking queue; the vat returns to IDLE only when its last active make completes or is cancelled"
      - from: BOOKED
        to: IN_MAKE
        trigger: "POST /plant/make-sheets/{makeSheetId}/start"
        actor: Cheesemaker
        preconditions:
          - "make_sheet.status == SCHEDULED"
          - "culture lot status == RELEASED and expires_at > logical now (ERR_ADDITIVE_LOT_UNUSABLE)"
          - "coagulant lot status == RELEASED and expires_at > logical now (ERR_ADDITIVE_LOT_UNUSABLE)"
          - "culture_lot.quantity_on_hand >= culture_units_planned (ERR_ADDITIVE_INSUFFICIENT)"
          - "coagulant_lot.quantity_on_hand >= coagulant_ml_planned (ERR_ADDITIVE_INSUFFICIENT)"
        side_effects:
          - "culture_lot.quantity_on_hand -= culture_units_planned (lot CONSUMPTION, ledger sync)"
          - "coagulant_lot.quantity_on_hand -= coagulant_ml_planned"
          - "if culture_lot.quantity_on_hand hits 0 -> culture_lot.status = DEPLETED (cascade depth 2)"
          - "if coagulant_lot.quantity_on_hand hits 0 -> coagulant_lot.status = DEPLETED"
          - "make_sheet.status = IN_PROGRESS"
      - from: IN_MAKE
        to: IDLE
        trigger: "POST /plant/make-sheets/{makeSheetId}/cancel (from IN_PROGRESS) when no other active booking remains on the vat"
        actor: MakePlanner
        preconditions:
          - "make_sheet.status in {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "If make was IN_PROGRESS: refund culture_lot.quantity_on_hand += culture_units_planned and coagulant_lot.quantity_on_hand += coagulant_ml_planned; a DEPLETED lot returns to RELEASED when refunded quantity > 0 (compensation)"
          - "make_sheet.status = CANCELLED"
          - "vat.status = IDLE only when no other MakeSheet on this vat is in {SCHEDULED, IN_PROGRESS, CURD_READY}; otherwise vat.status = BOOKED"
      - from: BOOKED
        to: IDLE
        trigger: "POST /plant/make-sheets/{makeSheetId}/cancel (from SCHEDULED) when it is the vat's last active booking"
        actor: MakePlanner
        preconditions: []
        side_effects:
          - "make_sheet.status = CANCELLED"
          - "vat.status = IDLE only when no other active booking remains; otherwise stays BOOKED"
      - from: IN_MAKE
        to: CLEANING
        trigger: "POST /plant/make-sheets/{makeSheetId}/complete"
        actor: Cheesemaker
        preconditions:
          - "make_sheet.status == CURD_READY (all make_steps_completed == make_steps_required)"
        side_effects:
          - "Creates CheeseBatch (status GREEN) with yield_actual_pct computed"
          - "Creates WheyStream with total_whey_kg computed"
          - "cip_clean = false; vat.status = CLEANING"
          - "milk_intake.consumed_liters += liters_committed; if consumed_liters == volume_liters, milk_intake -> CONSUMED (cascade depth 3: complete -> CheeseBatch/WheyStream create + intake consumed)"
      - from: CLEANING
        to: IDLE
        trigger: "POST /plant/vats/{vatId}/cip"
        actor: Cheesemaker
        preconditions:
          - "vat.status == CLEANING"
        side_effects:
          - "cip_clean = true"
      - from: IDLE
        to: DECOMMISSIONED
        trigger: "POST /plant/vats/{vatId}/decommission"
        actor: PlantAdmin
        preconditions:
          - "vat.status == IDLE"
          - "No MakeSheet on this vat with status in {SCHEDULED, IN_PROGRESS, CURD_READY}"
        side_effects: []

  - entity: MakeSheet
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /plant/make-sheets/{makeSheetId}/start"
        actor: Cheesemaker
        preconditions:
          - "See Vat BOOKED->IN_MAKE preconditions (additive lot usability + sufficiency)"
          - "milk_intake.status == ACCEPTED (ERR_MILK_NOT_ACCEPTED)"
          - "milk_intake.volume_liters - milk_intake.consumed_liters >= liters_committed (ERR_MILK_SHORTFALL)"
        side_effects:
          - "milk_intake.consumed_liters += liters_committed at COMMIT time (start), not at schedule time"
      - from: IN_PROGRESS
        to: CURD_READY
        trigger: "POST /plant/make-sheets/{makeSheetId}/steps/{stepNo}/sign-off (when make_steps_completed reaches make_steps_required)"
        actor: Cheesemaker
        preconditions:
          - "Sign-offs must be strictly sequential: sign-off for stepNo is accepted only when make_steps_completed == stepNo - 1 (ERR_STEP_OUT_OF_ORDER)"
          - "Same Cheesemaker may not sign off two consecutive steps (segregation of duties within procedure, ERR_STEP_SOLE_OPERATOR)"
        side_effects: []
      - from: CURD_READY
        to: COMPLETED
        trigger: "POST /plant/make-sheets/{makeSheetId}/complete"
        actor: Cheesemaker
        preconditions:
          - "green_weight_kg > 0 (ERR_INVALID_REQUEST)"
          - "green_weight_kg <= liters_committed (yield_actual_pct <= 100; ERR_YIELD_IMPOSSIBLE)"
          - "wheels_produced >= 1"
        side_effects:
          - "Create CheeseBatch(status=GREEN, current_grade=UNGRADED, release_decision=PENDING) with yield_actual_pct = green_weight_kg/liters_committed*100 rounded to 2dp half-up"
          - "Create WheyStream with total_whey_kg = liters_committed - green_weight_kg"
          - "vat.status = CLEANING, vat.cip_clean = false"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /plant/make-sheets/{makeSheetId}/cancel"
        actor: MakePlanner
        preconditions: []
        side_effects:
          - "vat.status = IDLE"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /plant/make-sheets/{makeSheetId}/cancel"
        actor: MakePlanner
        preconditions: []
        side_effects:
          - "Refund additive lots (see Vat IN_MAKE->IDLE compensation)"
          - "milk_intake.consumed_liters -= liters_committed (compensating reversal)"
          - "vat.status = IDLE"

  - entity: AdditiveLot
    initial_state: QUARANTINE
    terminal_states: [DEPLETED, EXPIRED, RECALLED]
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /plant/additive-lots/{additiveLotId}/release"
        actor: QAGrader
        preconditions: []
        side_effects: []
      - from: QUARANTINE
        to: RECALLED
        trigger: "POST /plant/additive-lots/{additiveLotId}/recall"
        actor: QAGrader
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: RECALLED
        trigger: "POST /plant/additive-lots/{additiveLotId}/recall"
        actor: QAGrader
        preconditions: []
        side_effects:
          - "Any MakeSheet in SCHEDULED that references this lot is NOT auto-cancelled but will fail start with ERR_ADDITIVE_LOT_UNUSABLE (cross-entity gate)"
      - from: RELEASED
        to: DEPLETED
        trigger: "system (automatic when quantity_on_hand reaches 0 after MakeSheet start consumption)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLETED
        to: RELEASED
        trigger: "system (automatic when a MakeSheet cancel refunds quantity, making quantity_on_hand > 0)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RELEASED
        to: EXPIRED
        trigger: "system (automatic on logical clock advance when expires_at <= now, checked by POST /plant/_clock/set_current_utc sweep)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CheeseBatch
    initial_state: GREEN
    terminal_states: [CONDEMNED, ALLOCATED]
    transitions:
      - from: GREEN
        to: AGING
        trigger: "POST /plant/aging-units (first placement of wheels from this batch into an AgingRoom)"
        actor: AgingRoomOperator
        preconditions:
          - "aging_room.status == ACTIVE (ERR_ROOM_DECOMMISSIONED)"
          - "aging_room.posture != FULL — wheels_present + wheel_count <= capacity_wheels (ERR_ROOM_FULL)"
          - "aging_room.posture != DEVIATION (ERR_ROOM_DEVIATION)"
          - "wheel_count <= cheese_batch.wheels_produced - cheese_batch.wheels_placed (ERR_WHEELS_EXHAUSTED)"
        side_effects:
          - "aging_unit.status = IN_ROOM; entered_at = logical now; last_turned_at = logical now"
          - "cheese_batch.wheels_placed += wheel_count"
          - "aging_room.wheels_present += wheel_count (ledger sync); posture re-derived"
          - "plant.total_aging_capacity_wheels unchanged (capacity), occupancy changes only"
      - from: AGING
        to: GRADED
        trigger: "POST /plant/grading-events (a grading assigns a non-CONDEMNED grade)"
        actor: QAGrader
        preconditions:
          - "cheese_batch.wheels_placed == cheese_batch.wheels_produced (all wheels must be in aging before grading; ERR_WHEELS_UNPLACED)"
          - "min over the batch's IN_ROOM aging units of age_days >= cheese_batch.min_age_days (ERR_AGE_MINIMUM_NOT_MET) — boundary: age_days == min_age_days passes (>=)"
          - "grader_user_id (X-User-ID) not in make_sheet.step_signer_ids (segregation of duties, ERR_SOLE_OPERATOR)"
        side_effects:
          - "cheese_batch.moisture_pct, fat_dry_basis_pct = grading readings"
          - "cheese_batch.current_grade = assigned_grade"
      - from: GRADED
        to: GRADED
        trigger: "POST /plant/grading-events (re-grade of an already-graded, non-terminal batch)"
        actor: QAGrader
        preconditions:
          - "grader_user_id not in make_sheet.step_signer_ids (ERR_SOLE_OPERATOR)"
          - "batch.release_decision == PENDING (a RELEASED batch may not be re-graded; ERR_INVALID_STATE)"
        side_effects:
          - "new GradingEvent.supersedes_grading_event_id = prior latest GradingEvent.id (self-referential re-grade chain)"
          - "cheese_batch.moisture_pct/fat_dry_basis_pct/current_grade updated to latest readings"
          - "if assigned_grade == CONDEMNED: batch -> CONDEMNED instead (see GRADED -> CONDEMNED)"
      - from: GRADED
        to: RELEASED
        trigger: "POST /plant/cheese-batches/{cheeseBatchId}/release"
        actor: QAGrader
        preconditions:
          - "cheese_batch.current_grade in {GRADE_A, GRADE_B} (ERR_GRADE_NOT_RELEASABLE)"
          - "release_decision == PENDING"
        side_effects:
          - "release_decision = RELEASED"
      - from: GRADED
        to: CONDEMNED
        trigger: "system (automatic when a re-grade assigns CONDEMNED)"
        actor: system
        preconditions: []
        side_effects:
          - "release_decision = REJECTED"
          - "Any OPEN/PARTIALLY_FILLED AllocationOrder against this batch -> CANCELLED (conditional cascade down; FILLED orders retained for traceability)"
      - from: RELEASED
        to: ALLOCATED
        trigger: "system (automatic when an AllocationOrder referencing this batch reaches FILLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AgingUnit
    initial_state: IN_ROOM
    terminal_states: [REMOVED]
    transitions:
      - from: IN_ROOM
        to: MOVED
        trigger: "POST /plant/aging-units/{agingUnitId}/move"
        actor: AgingRoomOperator
        preconditions:
          - "Destination room posture != FULL and != DEVIATION after adding wheel_count"
          - "Destination room != current room (ERR_INVALID_REQUEST)"
        side_effects:
          - "source_room.wheels_present -= wheel_count; dest_room.wheels_present += wheel_count; both postures re-derived"
      - from: MOVED
        to: IN_ROOM
        trigger: "system (immediate re-entry after move commits; aging_room_id updated, entered_at preserved)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_ROOM
        to: REMOVED
        trigger: "POST /plant/aging-units/{agingUnitId}/remove"
        actor: AgingRoomOperator
        preconditions:
          - "cheese_batch.status in {RELEASED, CONDEMNED} — wheels may only leave aging for allocation (RELEASED) or destruction (CONDEMNED) (ERR_INVALID_STATE)"
        side_effects:
          - "aging_room.wheels_present -= wheel_count; posture re-derived"

  - entity: AgingRoom
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /plant/aging-rooms/{agingRoomId}/decommission"
        actor: PlantAdmin
        preconditions:
          - "wheels_present == 0 (ERR_ROOM_NOT_EMPTY)"
        side_effects:
          - "plant.total_aging_capacity_wheels -= capacity_wheels (ledger sync up)"

  - entity: AllocationOrder
    initial_state: OPEN
    terminal_states: [FILLED, CANCELLED]
    transitions:
      - from: OPEN
        to: PARTIALLY_FILLED
        trigger: "system (automatic when a RECONCILED CutWrapRun with wheels_cut > 0 posts against this order but wheels_cut < wheels_requested)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: FILLED
        trigger: "system (automatic when cumulative wheels_cut == wheels_requested)"
        actor: system
        preconditions: []
        side_effects:
          - "cheese_batch.status -> ALLOCATED (bubble up, cross-entity)"
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "system (automatic when cumulative wheels_cut == wheels_requested)"
        actor: system
        preconditions: []
        side_effects:
          - "cheese_batch.status -> ALLOCATED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /plant/allocation-orders/{allocationOrderId}/cancel"
        actor: SalesPlanner
        preconditions:
          - "wheels_cut == 0 (ERR_ORDER_HAS_CUTS)"
        side_effects: []

  - entity: CutWrapRun
    initial_state: DRAFT
    terminal_states: [RECONCILED, VOIDED]
    transitions:
      - from: DRAFT
        to: RECONCILED
        trigger: "POST /plant/cut-wrap-runs/{cutWrapRunId}/reconcile"
        actor: CutWrapOperator
        preconditions:
          - "allocation_order.status in {OPEN, PARTIALLY_FILLED} (ERR_INVALID_STATE)"
          - "cheese_batch.release_decision == RELEASED (ERR_BATCH_NOT_RELEASED)"
          - "wheels_cut + wheels_in <= wheels_requested (order over-fill guard, ERR_ORDER_OVERFILL)"
          - "reconciliation_gap_kg >= 0 (ERR_WASTE_NEGATIVE)"
          - "reconciliation_gap_kg <= 0.02 * input_weight_kg (waste tolerance, ERR_WASTE_TOLERANCE) — boundary: gap exactly == 2.000% of input passes (<=)"
        side_effects:
          - "allocation_order.wheels_cut += wheels_in; order status re-derived (OPEN->PARTIALLY_FILLED/FILLED)"
          - "on FILLED: cheese_batch.status = ALLOCATED (cascade depth 3: reconcile -> order FILLED -> batch ALLOCATED)"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /plant/cut-wrap-runs/{cutWrapRunId}/void"
        actor: CutWrapOperator
        preconditions: []
        side_effects: []

  - entity: ExportCertificate
    initial_state: REQUESTED
    terminal_states: [ISSUED, DENIED, REVOKED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /plant/export-certificates/{exportCertificateId}/issue"
        actor: ComplianceOfficer
        preconditions:
          - "plant.export_listed == true (regulatory listing gate, ERR_PLANT_NOT_EXPORT_LISTED)"
          - "cut_wrap_run.status == RECONCILED (ERR_RUN_NOT_RECONCILED)"
        side_effects:
          - "certificate_number minted; issued_at = logical now"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /plant/export-certificates/{exportCertificateId}/deny"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: REVOKED
        trigger: "POST /plant/export-certificates/{exportCertificateId}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: make-sheet-create-stale-vat
    parent_entity: Vat
    write_endpoint: "POST /plant/make-sheets"
    occ_field: "expected_vat_version"
    description: |
      Creating a MakeSheet against a Vat whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      planner has just booked or cancelled a make on the same vat (which bumps
      vat.version) and the current planner's view of the vat's booking state is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: aging-unit-create-stale-room
    parent_entity: AgingRoom
    write_endpoint: "POST /plant/aging-units"
    occ_field: "expected_aging_room_version"
    description: |
      Placing wheels into an AgingRoom whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      operator has just placed or removed wheels (which bumps
      aging_room.version and possibly flips posture) and the current operator's
      view of free capacity is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_yield_from_components
    trigger: "CheeseBatch creation (MakeSheet complete) — PROVISIONAL variant"
    algorithm: weighted_scoring
    formula: |
      # Van Slyke-style component yield, PROVISIONAL variant uses theoretical
      # recovery constants; FINAL variant uses observed green weight.
      fat_kg     = liters_committed * milk_intake.fat_pct / 100 * 1.0       # density ~1 kg/L
      protein_kg = liters_committed * milk_intake.protein_pct / 100 * 1.0
      recovered_fat_kg     = fat_kg * FAT_RECOVERY[variety]
      recovered_protein_kg = protein_kg * PROTEIN_RECOVERY[variety]
      solids = recovered_fat_kg + recovered_protein_kg + OTHER_SOLIDS_FACTOR * liters_committed / 100
      provisional_cheese_kg = solids / (1 - TARGET_MOISTURE[variety])
      yield_provisional_pct = provisional_cheese_kg / liters_committed * 100
      round to 2 decimal places, round_half_up
    input_set: "MilkIntake (status ACCEPTED or CONSUMED) referenced by the MakeSheet; variety constants"
    constants:
      FAT_RECOVERY: { CHEDDAR: 0.93, COLBY: 0.92, BRICK: 0.91, MUENSTER: 0.90 }
      PROTEIN_RECOVERY: { CHEDDAR: 0.78, COLBY: 0.77, BRICK: 0.76, MUENSTER: 0.75 }
      OTHER_SOLIDS_FACTOR: 5.7
      TARGET_MOISTURE: { CHEDDAR: 0.39, COLBY: 0.40, BRICK: 0.42, MUENSTER: 0.44 }
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "At CheeseBatch creation; stored on yield_provisional_pct"
        difference: "Component-model estimate from milk fat/protein and recovery constants"
      - name: final
        when: "Same creation event; stored on yield_actual_pct"
        difference: "yield_actual_pct = green_weight_kg / liters_committed * 100 — observed, not modeled; for identical inputs the two values diverge whenever actual press/hoop losses differ from theoretical recovery"

  - name: whey_valorization_split
    trigger: "WheyStream update (PUT valorized_kg) or creation"
    algorithm: constraint_propagation
    formula: |
      total_whey_kg   = liters_committed - green_weight_kg          # fixed at creation
      disposed_kg     = total_whey_kg - valorized_kg                # derived; reject if < 0
      valorization_rate_pct = valorized_kg / total_whey_kg * 100    # when total_whey_kg == 0, rate = 0.00
      Evaluation order is pinned: total_whey_kg (fixed) -> disposed_kg -> valorization_rate_pct.
      Round each stored field to 2 decimal places, round_half_up, in that order.
    input_set: "The WheyStream row and its parent MakeSheet/CheeseBatch"
    constants:
      MAX_VALORIZATION_PCT: 100.0
    precision: "2 decimal places, round_half_up"

  - name: cut_wrap_waste_reconciliation
    trigger: "CutWrapRun reconcile"
    algorithm: threshold
    formula: |
      input_weight_kg = wheels_in * WHEEL_WEIGHT[variety]
      # rounding order pinned: compute per-run input first (integer wheels * exact
      # wheel weight, no rounding), then the gap, then compare to tolerance.
      reconciliation_gap_kg = input_weight_kg - finished_case_weight_kg - trim_waste_kg
      tolerance_kg = 0.02 * input_weight_kg
      reject when reconciliation_gap_kg < 0            -> ERR_WASTE_NEGATIVE
      reject when reconciliation_gap_kg > tolerance_kg -> ERR_WASTE_TOLERANCE
      (gap exactly == tolerance_kg passes: <= semantics)
      store both reconciliation_gap_kg and input_weight_kg at 2 decimal places, round_half_up
    input_set: "CutWrapRun row + variety of the CheeseBatch reached via allocation_order.cheese_batch_id"
    constants:
      WHEEL_WEIGHT: { CHEDDAR: 18.0, COLBY: 12.0, BRICK: 2.5, MUENSTER: 3.0 }
      WASTE_TOLERANCE_PCT: 0.02
    precision: "2 decimal places, round_half_up"

  - name: grade_assignment
    trigger: "GradingEvent creation"
    algorithm: threshold
    formula: |
      # Grade ladder evaluated top-down; first matching rung wins.
      if body_score <= 2 or flavor_score <= 2:                      assigned_grade = CONDEMNED
      else if moisture_pct > VARIETY_MOISTURE_MAX[variety]:         assigned_grade = DOWNGRADE
      else if fat_dry_basis_pct < VARIETY_FDB_MIN[variety]:         assigned_grade = DOWNGRADE
      else if body_score >= 8 and flavor_score >= 8
              and moisture_pct <= VARIETY_MOISTURE_GRADE_A_MAX[variety]:
                                                                    assigned_grade = GRADE_A
      else:                                                         assigned_grade = GRADE_B
      # Boundary precision: moisture AT the max passes that check (>), scores AT 8 count (>=).
    input_set: "GradingEvent readings + CheeseBatch.variety"
    constants:
      VARIETY_MOISTURE_MAX: { CHEDDAR: 39.0, COLBY: 40.0, BRICK: 44.0, MUENSTER: 46.0 }
      VARIETY_MOISTURE_GRADE_A_MAX: { CHEDDAR: 37.0, COLBY: 38.0, BRICK: 42.0, MUENSTER: 44.0 }
      VARIETY_FDB_MIN: { CHEDDAR: 50.0, COLBY: 50.0, BRICK: 50.0, MUENSTER: 48.0 }
    precision: "1 decimal place inputs, comparisons exact"

  - name: aging_room_posture
    trigger: "any change to wheels_present or capacity_wheels, or temp/humidity update"
    algorithm: threshold
    formula: |
      if room.status == DECOMMISSIONED: posture unchanged (terminal)
      else if temp_c < 7.0 or temp_c > 13.0 or humidity_pct < 80.0 or humidity_pct > 90.0:
          posture = DEVIATION          # out-of-band environment gates ALL placements
      else if wheels_present == capacity_wheels:
          posture = FULL               # == boundary: exactly-at-capacity is FULL
      else:
          posture = AVAILABLE
      Evaluation order pinned: DEVIATION checked BEFORE FULL (environment outranks capacity).
    input_set: "AgingRoom row only"
    constants:
      TEMP_MIN_C: 7.0
      TEMP_MAX_C: 13.0
      HUMIDITY_MIN_PCT: 80.0
      HUMIDITY_MAX_PCT: 90.0
    precision: "1 decimal place comparisons"

  - name: age_days_and_turn_due
    trigger: "logical clock advance (POST /plant/_clock/set_current_utc) and on read"
    algorithm: projection
    formula: |
      age_days = floor((now - entered_at) / 86400 seconds)          # floor, never rounded up
      turn interval TURN_INTERVAL_DAYS[variety]: CHEDDAR 7, COLBY 5, BRICK 3, MUENSTER 3
      days_since_turn = floor((now - last_turned_at) / 86400)
      turns_due = (days_since_turn >= TURN_INTERVAL_DAYS[variety])  # >= boundary: exactly at interval is DUE
    input_set: "AgingUnit rows with status IN_ROOM"
    constants:
      TURN_INTERVAL_DAYS: { CHEDDAR: 7, COLBY: 5, BRICK: 3, MUENSTER: 3 }
    precision: "integer days, floor"

  - name: allocation_priority_order
    trigger: "when multiple OPEN AllocationOrders compete for the same CheeseBatch (used by GET /plant/cheese-batches/{id}/allocation-preview)"
    algorithm: waterfall_allocation
    formula: |
      candidate set: AllocationOrder rows with cheese_batch_id == batch and status in {OPEN, PARTIALLY_FILLED}
      ranking: priority ASC (lower number first)
      tie-break: created_at ASC (earliest order first); never id
      allocation: each order's remaining need = wheels_requested - wheels_cut,
      filled from batch wheels available (wheels_produced - wheels_placed - sum over open orders'
      committed cuts) in ranking order; empty candidate set -> empty preview, not an error
    input_set: "AllocationOrder rows in {OPEN, PARTIALLY_FILLED} for the batch"
    precision: "integer wheels"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All referenced ids (path and body FKs) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "OCC expected_*_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /plant/make-sheets, POST /plant/aging-units"
  - priority: 5
    category: state
    check: "Target resource in correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Milk safety gates: SCC <= 400000 and antibiotics negative before accept"
    error_id: "ERR_SCC_LIMIT / ERR_ANTIBIOTIC_POSITIVE"
    http_status: 422
    applies_to: "POST /plant/milk-intakes/{id}/accept"
  - priority: 7
    category: business_safety
    check: "Additive lot usable (RELEASED, unexpired) and segregation-of-duties (grader is not a make-step cheesemaker; no consecutive same-operator step sign-offs)"
    error_id: "ERR_ADDITIVE_LOT_UNUSABLE / ERR_SOLE_OPERATOR / ERR_STEP_SOLE_OPERATOR"
    http_status: 422
    applies_to: "make-sheet start, step sign-off, grading-event create"
  - priority: 8
    category: business_referential
    check: "Cross-entity state gates: milk ACCEPTED, batch wheels fully placed before grading, batch RELEASED before allocation-order create and cut-wrap reconcile, plant export_listed before certificate issue"
    error_id: "ERR_MILK_NOT_ACCEPTED / ERR_WHEELS_UNPLACED / ERR_BATCH_NOT_RELEASED / ERR_PLANT_NOT_EXPORT_LISTED"
    http_status: 409
    applies_to: "make-sheet start, grading-event create, allocation-order create, cut-wrap reconcile, certificate issue"
  - priority: 9
    category: business_constraint
    check: "Vat booking interval overlap (half-open [start,end), adjacency allowed), additive sufficiency, step order, wheel counts within produced/placed, certificate uniqueness per run"
    error_id: "ERR_VAT_OVERLAP / ERR_ADDITIVE_INSUFFICIENT / ERR_STEP_OUT_OF_ORDER / ERR_WHEELS_EXHAUSTED / ERR_CERT_ALREADY_EXISTS"
    http_status: 409
    applies_to: "make-sheet create, make-sheet start, step sign-off, aging-unit create, certificate create"
  - priority: 10
    category: business_temporal
    check: "Age minimum met at grading (age_days >= min_age_days); lot expiry vs logical now"
    error_id: "ERR_AGE_MINIMUM_NOT_MET / ERR_ADDITIVE_LOT_UNUSABLE"
    http_status: 422
    applies_to: "grading-event create, make-sheet start"
  - priority: 11
    category: business_constraint
    check: "Capacity gates: vat capacity, room FULL / DEVIATION posture, room not decommissioned"
    error_id: "ERR_VAT_CAPACITY / ERR_ROOM_FULL / ERR_ROOM_DEVIATION / ERR_ROOM_DECOMMISSIONED"
    http_status: 409
    applies_to: "make-sheet create, aging-unit create/move"
  - priority: 12
    category: business_fiscal
    check: "Yield plausibility and waste tolerance: green_weight <= liters, reconciliation gap within [0, 2%] of input, order over-fill guard"
    error_id: "ERR_YIELD_IMPOSSIBLE / ERR_WASTE_NEGATIVE / ERR_WASTE_TOLERANCE / ERR_ORDER_OVERFILL"
    http_status: 422
    applies_to: "make-sheet complete, cut-wrap reconcile"
  - priority: 13
    category: business_fiscal
    check: "Whey valorization cannot exceed total whey (disposed >= 0)"
    error_id: "ERR_WHEY_OVER_VALORIZED"
    http_status: 422
    applies_to: "PUT /plant/whey-streams/{id}"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/plant/_clock/set_current_utc"
    description: "Set the logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Advancing the clock triggers the AdditiveLot expiry sweep and recomputes age_days/turns_due."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { now: string, expired_lot_ids: "string[]" }
    side_effects: ["AdditiveLot RELEASED -> EXPIRED where expires_at <= now", "recompute age_days / turns_due on all IN_ROOM AgingUnits"]

  # --- Plant ---
  - method: POST
    path: "/plant/plants"
    description: "Create a plant"
    roles: [PlantAdmin]
    code: 201
    input: [name, license_number, "export_listed?"]
    output: Plant
    side_effects: ["total_aging_capacity_wheels = 0"]
  - method: GET
    path: "/plant/plants/{plantId}"
    description: "Get a plant"
    roles: [PlantAdmin, MakePlanner, Cheesemaker, MilkReceiver, QAGrader, AgingRoomOperator, CutWrapOperator, SalesPlanner, ComplianceOfficer]
    code: 200
    input: []
    output: Plant
    side_effects: []
  - method: PATCH
    path: "/plant/plants/{plantId}"
    description: "Update plant flags (e.g. export_listed)"
    roles: [PlantAdmin]
    code: 200
    input: ["export_listed?"]
    output: Plant
    side_effects: ["increments Plant.version by 1"]

  # --- MilkIntake ---
  - method: POST
    path: "/plant/plants/{plantId}/milk-intakes"
    description: "Record a milk intake receipt"
    roles: [MilkReceiver]
    code: 201
    input: [hauler_ticket, received_at, volume_liters, fat_pct, protein_pct, somatic_cell_count, "antibiotics_detected?"]
    output: MilkIntake
    side_effects: ["status=RECEIVED", "consumed_liters=0"]
  - method: GET
    path: "/plant/milk-intakes/{milkIntakeId}"
    description: "Get a milk intake"
    roles: [PlantAdmin, MakePlanner, Cheesemaker, MilkReceiver, QAGrader]
    code: 200
    input: []
    output: MilkIntake
    side_effects: []
  - method: GET
    path: "/plant/milk-intakes"
    description: "List milk intakes (filtered list form)"
    roles: [PlantAdmin, MakePlanner, Cheesemaker, MilkReceiver, QAGrader]
    code: 200
    input: ["plant_id?", "status?", "limit?", "offset?"]
    output: MilkIntake[]
    side_effects: []
  - method: POST
    path: "/plant/milk-intakes/{milkIntakeId}/accept"
    description: "Accept an intake after safety gates"
    roles: [MilkReceiver]
    code: 200
    input: []
    output: MilkIntake
    side_effects: ["status RECEIVED -> ACCEPTED"]
  - method: POST
    path: "/plant/milk-intakes/{milkIntakeId}/reject"
    description: "Reject an intake"
    roles: [MilkReceiver]
    code: 200
    input: []
    output: MilkIntake
    side_effects: ["status RECEIVED -> REJECTED"]

  # --- Vat ---
  - method: POST
    path: "/plant/plants/{plantId}/vats"
    description: "Create a vat"
    roles: [PlantAdmin]
    code: 201
    input: [code, capacity_liters]
    output: Vat
    side_effects: ["status=IDLE", "cip_clean=true"]
  - method: GET
    path: "/plant/vats/{vatId}"
    description: "Get a vat"
    roles: [PlantAdmin, MakePlanner, Cheesemaker]
    code: 200
    input: []
    output: Vat
    side_effects: []
  - method: GET
    path: "/plant/vats"
    description: "List vats (filtered list form)"
    roles: [PlantAdmin, MakePlanner, Cheesemaker]
    code: 200
    input: ["plant_id?", "status?", "limit?", "offset?"]
    output: Vat[]
    side_effects: []
  - method: POST
    path: "/plant/vats/{vatId}/cip"
    description: "Complete CIP cleaning on a vat"
    roles: [Cheesemaker]
    code: 200
    input: []
    output: Vat
    side_effects: ["status CLEANING -> IDLE", "cip_clean = true"]
  - method: POST
    path: "/plant/vats/{vatId}/decommission"
    description: "Decommission an idle vat"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: Vat
    side_effects: ["status -> DECOMMISSIONED"]

  # --- AdditiveLot ---
  - method: POST
    path: "/plant/plants/{plantId}/additive-lots"
    description: "Receive an additive lot (culture or coagulant)"
    roles: [PlantAdmin]
    code: 201
    input: [kind, supplier_lot_no, expires_at, quantity_initial]
    output: AdditiveLot
    side_effects: ["status=QUARANTINE", "quantity_on_hand=quantity_initial"]
  - method: GET
    path: "/plant/additive-lots/{additiveLotId}"
    description: "Get an additive lot"
    roles: [PlantAdmin, Cheesemaker, QAGrader, MakePlanner]
    code: 200
    input: []
    output: AdditiveLot
    side_effects: []
  - method: GET
    path: "/plant/additive-lots"
    description: "List additive lots (filtered list form)"
    roles: [PlantAdmin, Cheesemaker, QAGrader, MakePlanner]
    code: 200
    input: ["plant_id?", "kind?", "status?", "limit?", "offset?"]
    output: AdditiveLot[]
    side_effects: []
  - method: POST
    path: "/plant/additive-lots/{additiveLotId}/release"
    description: "Release a lot from quarantine"
    roles: [QAGrader]
    code: 200
    input: []
    output: AdditiveLot
    side_effects: ["status QUARANTINE -> RELEASED"]
  - method: POST
    path: "/plant/additive-lots/{additiveLotId}/recall"
    description: "Recall a lot"
    roles: [QAGrader]
    code: 200
    input: []
    output: AdditiveLot
    side_effects: ["status -> RECALLED"]

  # --- MakeSheet ---
  - method: POST
    path: "/plant/make-sheets"
    description: "Book a vat and create a MakeSheet (OCC on Vat)"
    roles: [MakePlanner]
    code: 201
    input: [vat_id, milk_intake_id, variety, scheduled_start, scheduled_end, liters_committed, culture_lot_id, coagulant_lot_id, culture_units_planned, coagulant_ml_planned, expected_vat_version]
    output: MakeSheet
    side_effects: ["vat.status IDLE -> BOOKED", "increments Vat.version by 1", "make_steps_required set from variety", "status=SCHEDULED"]
  - method: GET
    path: "/plant/make-sheets/{makeSheetId}"
    description: "Get a make sheet"
    roles: [PlantAdmin, MakePlanner, Cheesemaker, QAGrader]
    code: 200
    input: []
    output: MakeSheet
    side_effects: []
  - method: GET
    path: "/plant/make-sheets"
    description: "List make sheets (filtered list form; multi-FK collapse)"
    roles: [PlantAdmin, MakePlanner, Cheesemaker, QAGrader]
    code: 200
    input: ["plant_id?", "vat_id?", "milk_intake_id?", "culture_lot_id?", "coagulant_lot_id?", "status?", "limit?", "offset?"]
    output: MakeSheet[]
    side_effects: []
  - method: POST
    path: "/plant/make-sheets/{makeSheetId}/start"
    description: "Start the make; consumes additive lots and commits milk"
    roles: [Cheesemaker]
    code: 200
    input: []
    output: MakeSheet
    side_effects: ["status SCHEDULED -> IN_PROGRESS", "additive lot consumption", "milk_intake.consumed_liters += liters_committed", "vat BOOKED -> IN_MAKE"]
  - method: POST
    path: "/plant/make-sheets/{makeSheetId}/steps/{stepNo}/sign-off"
    description: "Sign off a make-procedure step (strictly sequential; no consecutive same-operator)"
    roles: [Cheesemaker]
    code: 200
    input: []
    output: MakeSheet
    side_effects: ["make_steps_completed += 1", "on reaching make_steps_required: status -> CURD_READY"]
  - method: POST
    path: "/plant/make-sheets/{makeSheetId}/complete"
    description: "Complete the make; creates CheeseBatch and WheyStream"
    roles: [Cheesemaker]
    code: 200
    input: [green_weight_kg, wheels_produced]
    output: MakeSheet
    side_effects: ["status CURD_READY -> COMPLETED", "create CheeseBatch (GREEN)", "create WheyStream", "vat IN_MAKE -> CLEANING, cip_clean=false", "milk_intake possibly -> CONSUMED"]
  - method: POST
    path: "/plant/make-sheets/{makeSheetId}/cancel"
    description: "Cancel a make; refunds lots and milk commitment when in progress"
    roles: [MakePlanner]
    code: 200
    input: []
    output: MakeSheet
    side_effects: ["status -> CANCELLED", "additive refund when IN_PROGRESS", "milk un-commit when IN_PROGRESS", "vat -> IDLE"]

  # --- CheeseBatch ---
  - method: GET
    path: "/plant/cheese-batches/{cheeseBatchId}"
    description: "Get a cheese batch"
    roles: [PlantAdmin, MakePlanner, Cheesemaker, QAGrader, AgingRoomOperator, SalesPlanner, CutWrapOperator, ComplianceOfficer]
    code: 200
    input: []
    output: CheeseBatch
    side_effects: []
  - method: GET
    path: "/plant/cheese-batches"
    description: "List cheese batches (filtered list form)"
    roles: [PlantAdmin, MakePlanner, Cheesemaker, QAGrader, AgingRoomOperator, SalesPlanner, CutWrapOperator, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "make_sheet_id?", "variety?", "status?", "current_grade?", "limit?", "offset?"]
    output: CheeseBatch[]
    side_effects: []
  - method: POST
    path: "/plant/cheese-batches/{cheeseBatchId}/release"
    description: "Release a graded batch for allocation"
    roles: [QAGrader]
    code: 200
    input: []
    output: CheeseBatch
    side_effects: ["status GRADED -> RELEASED", "release_decision = RELEASED"]
  - method: GET
    path: "/plant/cheese-batches/{cheeseBatchId}/allocation-preview"
    description: "Preview waterfall allocation of open orders against this batch"
    roles: [PlantAdmin, SalesPlanner, QAGrader]
    code: 200
    input: []
    output: "{ order_sequence: string[], wheels_allocated: integer[] }"
    side_effects: []

  # --- WheyStream ---
  - method: GET
    path: "/plant/whey-streams/{wheyStreamId}"
    description: "Get a whey stream"
    roles: [PlantAdmin, Cheesemaker, QAGrader]
    code: 200
    input: []
    output: WheyStream
    side_effects: []
  - method: GET
    path: "/plant/whey-streams"
    description: "List whey streams (filtered list form)"
    roles: [PlantAdmin, Cheesemaker, QAGrader]
    code: 200
    input: ["plant_id?", "make_sheet_id?", "limit?", "offset?"]
    output: WheyStream[]
    side_effects: []
  - method: PUT
    path: "/plant/whey-streams/{wheyStreamId}"
    description: "Record whey valorization amount"
    roles: [Cheesemaker]
    code: 200
    input: [valorized_kg]
    output: WheyStream
    side_effects: ["recompute disposed_kg and valorization_rate_pct (pinned evaluation order)"]

  # --- AgingRoom ---
  - method: POST
    path: "/plant/plants/{plantId}/aging-rooms"
    description: "Create an aging room"
    roles: [PlantAdmin]
    code: 201
    input: [code, capacity_wheels, temp_c, humidity_pct]
    output: AgingRoom
    side_effects: ["status=ACTIVE", "wheels_present=0", "posture derived", "plant.total_aging_capacity_wheels += capacity_wheels"]
  - method: GET
    path: "/plant/aging-rooms/{agingRoomId}"
    description: "Get an aging room"
    roles: [PlantAdmin, AgingRoomOperator, QAGrader]
    code: 200
    input: []
    output: AgingRoom
    side_effects: []
  - method: GET
    path: "/plant/aging-rooms"
    description: "List aging rooms (filtered list form)"
    roles: [PlantAdmin, AgingRoomOperator, QAGrader]
    code: 200
    input: ["plant_id?", "status?", "posture?", "limit?", "offset?"]
    output: AgingRoom[]
    side_effects: []
  - method: PATCH
    path: "/plant/aging-rooms/{agingRoomId}"
    description: "Update room environment readings"
    roles: [AgingRoomOperator]
    code: 200
    input: ["temp_c?", "humidity_pct?"]
    output: AgingRoom
    side_effects: ["posture re-derived (DEVIATION check precedes FULL)", "increments AgingRoom.version by 1"]
  - method: POST
    path: "/plant/aging-rooms/{agingRoomId}/decommission"
    description: "Decommission an empty room"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: AgingRoom
    side_effects: ["status -> DECOMMISSIONED", "plant.total_aging_capacity_wheels -= capacity_wheels"]

  # --- AgingUnit ---
  - method: POST
    path: "/plant/aging-units"
    description: "Place wheels from a batch into an aging room (OCC on AgingRoom)"
    roles: [AgingRoomOperator]
    code: 201
    input: [cheese_batch_id, aging_room_id, wheel_count, expected_aging_room_version]
    output: AgingUnit
    side_effects: ["status=IN_ROOM", "entered_at/last_turned_at = logical now", "batch.wheels_placed += wheel_count", "batch GREEN -> AGING on first placement", "room.wheels_present += wheel_count", "posture re-derived", "increments AgingRoom.version by 1"]
  - method: GET
    path: "/plant/aging-units/{agingUnitId}"
    description: "Get an aging unit"
    roles: [PlantAdmin, AgingRoomOperator, QAGrader]
    code: 200
    input: []
    output: AgingUnit
    side_effects: []
  - method: GET
    path: "/plant/aging-units"
    description: "List aging units (filtered list form; multi-FK collapse)"
    roles: [PlantAdmin, AgingRoomOperator, QAGrader]
    code: 200
    input: ["plant_id?", "cheese_batch_id?", "aging_room_id?", "status?", "turns_due?", "limit?", "offset?"]
    output: AgingUnit[]
    side_effects: []
  - method: POST
    path: "/plant/aging-units/{agingUnitId}/turn"
    description: "Record a turn (flip/brushing) of the wheels"
    roles: [AgingRoomOperator]
    code: 200
    input: []
    output: AgingUnit
    side_effects: ["last_turned_at = logical now", "turns_due recomputed"]
  - method: POST
    path: "/plant/aging-units/{agingUnitId}/move"
    description: "Move a unit to a different room"
    roles: [AgingRoomOperator]
    code: 200
    input: [destination_aging_room_id]
    output: AgingUnit
    side_effects: ["source/dest wheels_present adjusted", "both postures re-derived", "status IN_ROOM -> MOVED -> IN_ROOM"]
  - method: POST
    path: "/plant/aging-units/{agingUnitId}/remove"
    description: "Remove wheels from aging (release for allocation or destruction)"
    roles: [AgingRoomOperator]
    code: 200
    input: []
    output: AgingUnit
    side_effects: ["status -> REMOVED", "room.wheels_present -= wheel_count", "posture re-derived"]

  # --- GradingEvent ---
  - method: POST
    path: "/plant/grading-events"
    description: "Record a grading event for a batch (may re-grade; supersedes prior event)"
    roles: [QAGrader]
    code: 201
    input: [cheese_batch_id, moisture_pct, fat_dry_basis_pct, body_score, flavor_score]
    output: GradingEvent
    side_effects: ["assigned_grade computed", "grader_user_id = X-User-ID", "graded_at = logical now", "batch AGING -> GRADED (or re-grade while GRADED)", "batch.moisture_pct/fat_dry_basis_pct/current_grade updated", "on CONDEMNED: batch -> CONDEMNED, open orders CANCELLED"]
  - method: GET
    path: "/plant/grading-events/{gradingEventId}"
    description: "Get a grading event"
    roles: [PlantAdmin, QAGrader]
    code: 200
    input: []
    output: GradingEvent
    side_effects: []
  - method: GET
    path: "/plant/grading-events"
    description: "List grading events (filtered list form)"
    roles: [PlantAdmin, QAGrader]
    code: 200
    input: ["plant_id?", "cheese_batch_id?", "supersedes_grading_event_id?", "limit?", "offset?"]
    output: GradingEvent[]
    side_effects: []

  # --- AllocationOrder ---
  - method: POST
    path: "/plant/allocation-orders"
    description: "Create an allocation order against a batch"
    roles: [SalesPlanner]
    code: 201
    input: [cheese_batch_id, channel, customer_name, wheels_requested, priority]
    output: AllocationOrder
    side_effects: ["status=OPEN", "precondition: batch.status == RELEASED (ERR_BATCH_NOT_RELEASED)"]
  - method: GET
    path: "/plant/allocation-orders/{allocationOrderId}"
    description: "Get an allocation order"
    roles: [PlantAdmin, SalesPlanner, CutWrapOperator, QAGrader]
    code: 200
    input: []
    output: AllocationOrder
    side_effects: []
  - method: GET
    path: "/plant/allocation-orders"
    description: "List allocation orders (filtered list form)"
    roles: [PlantAdmin, SalesPlanner, CutWrapOperator, QAGrader]
    code: 200
    input: ["plant_id?", "cheese_batch_id?", "channel?", "status?", "limit?", "offset?"]
    output: AllocationOrder[]
    side_effects: []
  - method: POST
    path: "/plant/allocation-orders/{allocationOrderId}/cancel"
    description: "Cancel an uncut order"
    roles: [SalesPlanner]
    code: 200
    input: []
    output: AllocationOrder
    side_effects: ["status -> CANCELLED (only when wheels_cut == 0)"]

  # --- CutWrapRun ---
  - method: POST
    path: "/plant/cut-wrap-runs"
    description: "Create a draft cut-and-wrap run against an order"
    roles: [CutWrapOperator]
    code: 201
    input: [allocation_order_id, wheels_in, finished_case_weight_kg, trim_waste_kg]
    output: CutWrapRun
    side_effects: ["status=DRAFT", "input_weight_kg and reconciliation_gap_kg computed"]
  - method: GET
    path: "/plant/cut-wrap-runs/{cutWrapRunId}"
    description: "Get a cut-wrap run"
    roles: [PlantAdmin, CutWrapOperator, ComplianceOfficer, SalesPlanner]
    code: 200
    input: []
    output: CutWrapRun
    side_effects: []
  - method: GET
    path: "/plant/cut-wrap-runs"
    description: "List cut-wrap runs (filtered list form)"
    roles: [PlantAdmin, CutWrapOperator, ComplianceOfficer, SalesPlanner]
    code: 200
    input: ["plant_id?", "allocation_order_id?", "status?", "limit?", "offset?"]
    output: CutWrapRun[]
    side_effects: []
  - method: POST
    path: "/plant/cut-wrap-runs/{cutWrapRunId}/reconcile"
    description: "Reconcile a run: waste tolerance gate, posts wheels to the order"
    roles: [CutWrapOperator]
    code: 200
    input: []
    output: CutWrapRun
    side_effects: ["status DRAFT -> RECONCILED", "order.wheels_cut += wheels_in", "order status re-derived", "on FILLED: batch -> ALLOCATED"]
  - method: POST
    path: "/plant/cut-wrap-runs/{cutWrapRunId}/void"
    description: "Void a draft run"
    roles: [CutWrapOperator]
    code: 200
    input: []
    output: CutWrapRun
    side_effects: ["status DRAFT -> VOIDED"]

  # --- ExportCertificate ---
  - method: POST
    path: "/plant/export-certificates"
    description: "Request an export certificate for a reconciled run"
    roles: [ComplianceOfficer]
    code: 201
    input: [cut_wrap_run_id, destination_country, consignee]
    output: ExportCertificate
    side_effects: ["status=REQUESTED", "precondition: no other ExportCertificate in {REQUESTED, ISSUED} for the same cut_wrap_run_id (uniqueness, ERR_CERT_ALREADY_EXISTS)"]
  - method: GET
    path: "/plant/export-certificates/{exportCertificateId}"
    description: "Get an export certificate"
    roles: [PlantAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: ExportCertificate
    side_effects: []
  - method: GET
    path: "/plant/export-certificates"
    description: "List export certificates (filtered list form)"
    roles: [PlantAdmin, ComplianceOfficer]
    code: 200
    input: ["plant_id?", "cut_wrap_run_id?", "status?", "limit?", "offset?"]
    output: ExportCertificate[]
    side_effects: []
  - method: POST
    path: "/plant/export-certificates/{exportCertificateId}/issue"
    description: "Issue the certificate (plant export-listing gate)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExportCertificate
    side_effects: ["status REQUESTED -> ISSUED", "certificate_number minted", "issued_at = logical now"]
  - method: POST
    path: "/plant/export-certificates/{exportCertificateId}/deny"
    description: "Deny a requested certificate"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExportCertificate
    side_effects: ["status REQUESTED -> DENIED"]
  - method: POST
    path: "/plant/export-certificates/{exportCertificateId}/revoke"
    description: "Revoke an issued certificate"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExportCertificate
    side_effects: ["status ISSUED -> REVOKED"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload, invalid enum, non-positive quantity, or end <= start on intervals" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state that permits the requested transition" }
  - { id: ERR_SCC_LIMIT, http: 422, condition: "somatic_cell_count > 400000 on milk accept (boundary: exactly 400000 passes)" }
  - { id: ERR_ANTIBIOTIC_POSITIVE, http: 422, condition: "antibiotics_detected == true on milk accept" }
  - { id: ERR_MILK_NOT_ACCEPTED, http: 409, condition: "MakeSheet start references an intake not in ACCEPTED" }
  - { id: ERR_MILK_SHORTFALL, http: 422, condition: "liters_committed exceeds intake's unconsumed volume" }
  - { id: ERR_VAT_OVERLAP, http: 409, condition: "Requested make interval overlaps an existing active booking on the vat (half-open [start,end) intersection; adjacency allowed)" }
  - { id: ERR_VAT_CAPACITY, http: 409, condition: "liters_committed exceeds vat capacity_liters" }
  - { id: ERR_VAT_NOT_CLEAN, http: 409, condition: "Vat cip_clean == false at booking time" }
  - { id: ERR_ADDITIVE_LOT_UNUSABLE, http: 422, condition: "Referenced additive lot not RELEASED or expired at make start" }
  - { id: ERR_ADDITIVE_INSUFFICIENT, http: 422, condition: "Lot quantity_on_hand below planned consumption" }
  - { id: ERR_STEP_OUT_OF_ORDER, http: 409, condition: "Step sign-off attempted out of strict sequence" }
  - { id: ERR_STEP_SOLE_OPERATOR, http: 422, condition: "Same cheesemaker signing two consecutive make steps" }
  - { id: ERR_YIELD_IMPOSSIBLE, http: 422, condition: "green_weight_kg > liters_committed (yield > 100%)" }
  - { id: ERR_WHEY_OVER_VALORIZED, http: 422, condition: "valorized_kg > total_whey_kg (disposed_kg would be negative)" }
  - { id: ERR_ROOM_FULL, http: 409, condition: "Placement would exceed room capacity (wheels_present + wheel_count > capacity_wheels)" }
  - { id: ERR_ROOM_DEVIATION, http: 409, condition: "Room posture DEVIATION blocks placement/move" }
  - { id: ERR_ROOM_DECOMMISSIONED, http: 409, condition: "Target room DECOMMISSIONED" }
  - { id: ERR_ROOM_NOT_EMPTY, http: 409, condition: "Decommission attempted with wheels_present > 0" }
  - { id: ERR_WHEELS_EXHAUSTED, http: 409, condition: "wheel_count exceeds batch wheels not yet placed" }
  - { id: ERR_WHEELS_UNPLACED, http: 409, condition: "Grading attempted before all produced wheels are placed in aging" }
  - { id: ERR_AGE_MINIMUM_NOT_MET, http: 422, condition: "age_days < min_age_days at grading (boundary: == passes)" }
  - { id: ERR_SOLE_OPERATOR, http: 422, condition: "Grader is a cheesemaker who signed a make step on the originating MakeSheet (segregation of duties)" }
  - { id: ERR_GRADE_NOT_RELEASABLE, http: 409, condition: "Release attempted with current_grade DOWNGRADE/CONDEMNED/UNGRADED" }
  - { id: ERR_BATCH_NOT_RELEASED, http: 409, condition: "Allocation/cut-wrap action requires release_decision == RELEASED" }
  - { id: ERR_ORDER_OVERFILL, http: 422, condition: "Reconcile would push wheels_cut beyond wheels_requested" }
  - { id: ERR_ORDER_HAS_CUTS, http: 409, condition: "Cancel attempted on an order with wheels_cut > 0" }
  - { id: ERR_WASTE_NEGATIVE, http: 422, condition: "reconciliation_gap_kg < 0 (outputs exceed inputs)" }
  - { id: ERR_WASTE_TOLERANCE, http: 422, condition: "reconciliation_gap_kg > 2% of input_weight_kg (boundary: exactly 2% passes)" }
  - { id: ERR_PLANT_NOT_EXPORT_LISTED, http: 409, condition: "Certificate issue attempted while plant.export_listed == false" }
  - { id: ERR_RUN_NOT_RECONCILED, http: 409, condition: "Certificate issue requires CutWrapRun RECONCILED" }
  - { id: ERR_CERT_ALREADY_EXISTS, http: 409, condition: "An active (REQUESTED/ISSUED) certificate already exists for the run" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant administrator; owns configuration resources (plant, vats, rooms, additive lots receipt) and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /plant/plants; PATCH /plant/plants/{id}"
      - "POST /plant/plants/{id}/vats; POST /plant/vats/{id}/decommission"
      - "POST /plant/plants/{id}/aging-rooms; POST /plant/aging-rooms/{id}/decommission"
      - "POST /plant/plants/{id}/additive-lots"
      - "POST /plant/_clock/set_current_utc"
    shared_operations: ["GET endpoints across all resources"]
  - name: MilkReceiver
    description: "Intake operator; records and accepts/rejects raw milk"
    identity: opaque
    exclusive_operations:
      - "POST /plant/plants/{id}/milk-intakes"
      - "POST /plant/milk-intakes/{id}/accept"
      - "POST /plant/milk-intakes/{id}/reject"
    shared_operations: ["GET milk intakes, vats, make sheets, plant"]
  - name: MakePlanner
    description: "Production planner; books vats and cancels makes"
    identity: opaque
    exclusive_operations:
      - "POST /plant/make-sheets"
      - "POST /plant/make-sheets/{id}/cancel"
    shared_operations: ["GET milk intakes, vats, make sheets, batches, additive lots, plant"]
  - name: Cheesemaker
    description: "Licensed cheesemaker; executes make steps and completes makes; identity tracked on step sign-offs for segregation of duties"
    identity: opaque
    exclusive_operations:
      - "POST /plant/make-sheets/{id}/start"
      - "POST /plant/make-sheets/{id}/steps/{stepNo}/sign-off"
      - "POST /plant/make-sheets/{id}/complete"
      - "POST /plant/vats/{id}/cip"
      - "PUT /plant/whey-streams/{id}"
    shared_operations: ["GET vats, make sheets, batches, whey streams, additive lots, milk intakes, plant"]
  - name: QAGrader
    description: "QA grader; releases additive lots, grades batches, releases batches; MUST NOT grade a batch whose make steps the same user signed"
    identity: opaque
    exclusive_operations:
      - "POST /plant/additive-lots/{id}/release"
      - "POST /plant/additive-lots/{id}/recall"
      - "POST /plant/grading-events"
      - "POST /plant/cheese-batches/{id}/release"
    shared_operations: ["GET batches, grading events, aging units/rooms, allocation orders, milk intakes, plant"]
  - name: AgingRoomOperator
    description: "Aging cellar operator; places, turns, moves, and removes wheel units"
    identity: opaque
    exclusive_operations:
      - "POST /plant/aging-units"
      - "POST /plant/aging-units/{id}/turn"
      - "POST /plant/aging-units/{id}/move"
      - "POST /plant/aging-units/{id}/remove"
      - "PATCH /plant/aging-rooms/{id}"
    shared_operations: ["GET aging rooms/units, batches, plant"]
  - name: SalesPlanner
    description: "Sales/allocations planner; creates and cancels private-label and branded orders"
    identity: opaque
    exclusive_operations:
      - "POST /plant/allocation-orders"
      - "POST /plant/allocation-orders/{id}/cancel"
    shared_operations: ["GET batches, allocation orders, allocation-preview, plant"]
  - name: CutWrapOperator
    description: "Cut-and-wrap room operator; creates, reconciles, and voids conversion runs"
    identity: opaque
    exclusive_operations:
      - "POST /plant/cut-wrap-runs"
      - "POST /plant/cut-wrap-runs/{id}/reconcile"
      - "POST /plant/cut-wrap-runs/{id}/void"
    shared_operations: ["GET cut-wrap runs, allocation orders, batches, plant"]
  - name: ComplianceOfficer
    description: "Export compliance officer; requests, issues, denies, and revokes export certificates"
    identity: opaque
