  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_execution_conserves_season_net_currency
        grounds:
          - state_machines.RefundRequest.APPROVED_to_EXECUTED
          - entities.EconomyLedgerEntry.fields.reversal_of_entry_id
          - entities.Season.fields.gross_sink_minor
          - entities.CurrencyAccount.fields.balance_minor
          - calculations.player_rolling_spend_minor
        distinguishing_aspect: |
          Executing a refund on a wholly unconsumed purchase appends REFUND_REVERSAL sinks equal
          to every PURCHASE_GRANT faucet, so Season.gross_faucet_minor - Season.gross_sink_minor
          and the HARD_GEM balance both return to their exact pre-settlement values (0), while
          the audit trail grows rather than being rewritten.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE with gross_faucet_minor 0 and gross_sink_minor 0."
            - "Offer STARTER_5K (LIMITED_TIME, T1, list 5000, one line granting 5000 HARD_GEM) is APPROVED and LIVE."
            - "Player p7 (NA, adult) holds ONLY a HARD_GEM account, so the refund's goodwill credit resolves to 0."
            - "Purchase settled at 5000 with granted_total_minor 5000 and granted_consumed_minor 0; refund request SUBMITTED then APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /players"
              payload: { handle: "tide_p7", region_code: "NA", active_season_id: "${season_id}" }
              as: LiveOpsCommander
              captures: { p7_id: $.data.id }
            - call: "POST /players/${p7_id}/currency-accounts"
              payload: { currency_code: "HARD_GEM" }
              as: LiveOpsCommander
              captures: { p7_gem_id: $.data.id }
            - call: "POST /offers"
              payload: { season_id: "${season_id}", offer_type: "LIMITED_TIME", sku: "STARTER_5K", price_tier: "T1", list_price_minor: 5000, line_items: [{ sku: "STARTER_PACK", base_price_minor: 5000, declared_value_minor: 6000, granted_currency_code: "HARD_GEM", granted_amount_minor: 5000 }], personalization_discount_bp: 0, minor_purchasable: false, window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { starter_id: $.data.id }
            - call: "POST /offers/${starter_id}/submit"
              payload: {}
              as: EconomyDesigner
              as_user_id: "u_designer_1"
            - call: "POST /offers/${starter_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
            - call: "GET /seasons/${season_id}"
              payload: {}
              as: LiveOpsCommander
              captures: { season_v1: $.data.version }
            - call: "POST /offers/${starter_id}/publish"
              payload: { expected_season_version: "${season_v1}" }
              as: EconomyDesigner
              as_user_id: "u_designer_1"
              captures: { starter_v1: $.data.version }
            - call: "POST /purchases"
              payload: { player_id: "${p7_id}", offer_id: "${starter_id}", expected_offer_version: "${starter_v1}" }
              as: Player
              as_user_id: "${p7_id}"
              captures: { pur7_id: $.data.id }
            - call: "POST /purchases/${pur7_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: LiveOpsCommander
            - call: "POST /refund-requests"
              payload: { purchase_id: "${pur7_id}", reason_code: "TECHNICAL_FAILURE" }
              as: Player
              as_user_id: "${p7_id}"
              captures: { rr7_id: $.data.id }
            - call: "POST /refund-requests/${rr7_id}/decision"
              payload: { decision: "APPROVE", decision_note: "Entitlement never delivered" }
              as: ComplianceOfficer
              as_user_id: "u_compliance_1"
          trigger:
            - call: "POST /refund-requests/${rr7_id}/execute"
              payload: {}
              as: LiveOpsCommander
          assert:
            - "RefundRequest.${rr7_id}.status == EXECUTED"
            - "RefundRequest.${rr7_id}.refund_base_minor == 5000"
            - "RefundRequest.${rr7_id}.restock_fee_minor == 500"
            - "RefundRequest.${rr7_id}.refund_amount_minor == 4500"
            - "RefundRequest.${rr7_id}.goodwill_credit_minor == 0"
            - "Purchase.${pur7_id}.status == REFUNDED"
            - "CurrencyAccount.${p7_gem_id}.lifetime_faucet_minor == 5000"
            - "CurrencyAccount.${p7_gem_id}.lifetime_sink_minor == 5000"
            - "CurrencyAccount.${p7_gem_id}.balance_minor == 0"
            - "Season.${season_id}.gross_faucet_minor == 5000"
            - "Season.${season_id}.gross_sink_minor == 5000"
            - "Season.${season_id}.settled_revenue_minor == 0"
            - "Player.${p7_id}.spend_30d_minor == 500"
            - "Player.${p7_id}.lifetime_spend_minor == 5000"
            - "Player.${p7_id}.spend_state == UNRESTRICTED"

      - name: live_event_rollback_conserves_cluster_reserved_ccu
        grounds:
          - state_machines.LiveEvent.APPROVED_to_ROLLED_BACK
          - entities.LiveEvent.fields.reserved_ccu_at_approval
          - entities.CapacityCluster.fields.reserved_ccu
          - calculations.cluster_ccu_overlap_load
        distinguishing_aspect: |
          Rolling back an APPROVED event releases exactly reserved_ccu_at_approval, returning
          CapacityCluster.reserved_ccu to its pre-approval 0 — proven not by the counter alone
          but by a follow-up 10000-CCU event on the same overlapping window being admitted, in
          a different entity domain than the refund ledger invariant.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; season S7 LIVE."
            - "CapacityCluster NA-1 ACTIVE, ccu_capacity 10000, maintenance_buffer_minutes 30, reserved_ccu 0."
            - "LiveEvent A (2026-08-05T00:00:00Z -> 2026-08-05T02:00:00Z, forecast 6000) is APPROVED, so reserved_ccu is 6000."
            - "LiveEvent D (2026-08-05T01:00:00Z -> 2026-08-05T03:00:00Z, forecast 10000) is PLANNED and overlaps A's window; while A holds its reservation D could not fit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LiveOpsCommander
            - call: "POST /seasons"
              payload: { code: "S7", title: "Season 7 Tidebreak", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-10-30T00:00:00Z", planned_episode_count: 6, target_xp_total: 9000, pass_price_minor: 1000 }
              as: ContentProducer
              captures: { season_id: $.data.id }
            - call: "POST /seasons/${season_id}/status"
              payload: { to_status: "LIVE" }
              as: ContentProducer
            - call: "POST /capacity-clusters"
              payload: { name: "NA-1", region_code: "NA", ccu_capacity: 10000, maintenance_buffer_minutes: 30 }
              as: LiveOpsCommander
              captures: { cluster_id: $.data.id }
            - call: "POST /live-events"
              payload: { season_id: "${season_id}", capacity_cluster_id: "${cluster_id}", code: "EVT_A", window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-05T02:00:00Z", forecast_ccu: 6000 }
              as: ContentProducer
              captures: { evt_a_id: $.data.id }
            - call: "POST /live-events/${evt_a_id}/approve"
              payload: {}
              as: LiveOpsCommander
            - call: "POST /live-events"
              payload: { season_id: "${season_id}", capacity_cluster_id: "${cluster_id}", code: "EVT_D", window_start: "2026-08-05T01:00:00Z", window_end: "2026-08-05T03:00:00Z", forecast_ccu: 10000 }
              as: ContentProducer
              captures: { evt_d_id: $.data.id }
          trigger:
            - call: "POST /live-events/${evt_a_id}/rollback"
              payload: { reason: "Sponsor pulled out of the showcase" }
              as: LiveOpsCommander
            - call: "POST /live-events/${evt_d_id}/approve"
              payload: {}
              as: LiveOpsCommander
          assert:
            - "LiveEvent.${evt_a_id}.status == ROLLED_BACK"
            - "LiveEvent.${evt_a_id}.reserved_ccu_at_approval == 0"
            - "LiveEvent.${evt_a_id}.rollback_reason == Sponsor pulled out of the showcase"
            - "CapacityCluster.${cluster_id}.reserved_ccu == 0 immediately after the rollback"
            - "LiveEvent.${evt_d_id}.status == APPROVED"
            - "LiveEvent.${evt_d_id}.reserved_ccu_at_approval == 10000"
            - "CapacityCluster.${cluster_id}.reserved_ccu == 10000"
