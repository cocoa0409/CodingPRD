              captures: { r_s3_final_status: $.data.status }
          assert:
            - "ANCHOR — ${r_anchor_status} == ACCEPTED and Show.${r_s1_id}.show_status == CONFIRMED; the artist's routing set is now {2026-10-10T02:00:00Z}"
            - "EXACTLY +36H — ${r_plus36_status} == ACCEPTED: 2026-10-11T14:00:00Z minus 2026-10-10T02:00:00Z is exactly 36h and the check is >=, so equality is permitted"
            - "EXACTLY -36H (SYMMETRY) — ${r_minus36_status} == ACCEPTED: 2026-10-08T14:00:00Z is exactly 36h BEFORE the anchor, so abs() must be taken; a signed or forward-only comparison either wrongly rejects this or wrongly accepts the 25h case below"
            - "TOO CLOSE — ${r_too_close_error} == ERR_ARTIST_ROUTING_CONFLICT with HTTP 409: S3's 2026-10-09T01:00:00Z is 25h before the anchor and 11h after S4, both under 36h"
            - "TOO CLOSE — nothing was written: Offer.${r_o3_id}.status == SUBMITTED, Show.${r_s3_id}.show_status == PLANNED, Show.${r_s3_id}.committed_guarantee_cents == 0"
            - "S5 FIRST ATTEMPT — ${r_s5_first_error} == ERR_ARTIST_ROUTING_CONFLICT: S5's 2026-10-12T02:00:00Z is 12h after S2, while it is 48h from the anchor and 84h from S4, so S2 is the sole blocker"
            - "POSTPONED STILL OCCUPIES — after CancellationEvent.${r_ce_postpone_id}, Show.${r_s2_id}.show_status == POSTPONED, yet ${r_s5_second_error} == ERR_ARTIST_ROUTING_CONFLICT again, because the routing set is {CONFIRMED, ON_SALE, PERFORMED, POSTPONED} — postponement frees the venue but not the artist"
            - "CANCELLED RELEASES — after CancellationEvent.${r_ce_cancel1_id} and CancellationEvent.${r_ce_cancel4_id}, Show.${r_s1_id}.show_status == CANCELLED and Show.${r_s4_id}.show_status == CANCELLED, and both leave the routing set"
            - "CANCELLED RELEASES — ${r_s3_final_status} == ACCEPTED on the byte-identical retry: S3 is now 61h from S2 (the only remaining occupant) and S5 is still PLANNED, so the same call that returned 409 twice now returns 200"
            - "EXPOSURE LEDGER — Market.${r_mk_id}.committed_guarantee_cents == 1000000 after the final acceptance: S1 and S4 were cancelled and S2 left the exposure set on postponement, so S3 is the only show still counted; exposure_utilization_pct == 5.00 and risk_posture == OPEN"
            - "ROUTING VS EXPOSURE ARE DIFFERENT SETS — this is the crux: S2 is counted by the ARTIST ROUTING set (which includes POSTPONED) but NOT by the MARKET EXPOSURE set (which is {CONFIRMED, ON_SALE, PERFORMED}), so an implementation sharing one predicate between the two rules cannot satisfy both asserts above"

  # =====================================================================
  # RULE 9 — compensating_invariant
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: market_guarantee_exposure_returns_to_its_exact_prior_value_after_cancellation
        grounds:
          - "calculations.market_guarantee_exposure"
          - "state_machines.Show.CONFIRMED_to_CANCELLED"
          - "state_machines.Show.PLANNED_to_CONFIRMED"
          - "entities.Market.fields.committed_guarantee_cents"
          - "entities.Market.fields.at_risk_guarantee_cents"
          - "entities.Market.fields.exposure_utilization_pct"
        distinguishing_aspect: |
          CONSERVED QUANTITY: the Market's guarantee-exposure ledger — committed_guarantee_cents,
          at_risk_guarantee_cents, exposure_utilization_pct and the risk_posture band derived from
          them. Cancellation is the compensating transition, and it must reverse EVERY effect of the
          acceptance that preceded it: the guarantee leaves committed, the show leaves at-risk, AND
          the recognised deductible expense that had inflated breakeven_cents disappears with the
          VOIDed BudgetLines. The test drives the ledger to 5000000 committed / 5400000 at-risk,
          cancels the show carrying the 400000 of expense, and books a replacement with the same
          3000000 guarantee: committed must return to exactly 5000000 and at-risk to exactly
          5000000 — not 5400000. An implementation that decrements committed but forgets that VOID
          lines leave the recognition base, or that subtracts the guarantee without re-deriving
          at-risk from breakeven, leaves 400000 of phantom exposure behind.
        test_recipe:
          setup:
            - "One Market with guarantee_exposure_limit_cents 5000000, committed 0, at_risk 0, utilization 0.00, posture OPEN."
            - "Two Venues V1 and V2 in that market (capacity 1200, zero facility fee, zero ticket tax) and two Artists AR_A and AR_B."
            - "Show A at V1 for AR_A, event 2026-10-10T02:00:00Z, RENTAL, rental_fee 100000, with an ACCEPTED FLAT_GUARANTEE offer of 3000000 (deposit 0, expense_cap_cents 3000000)."
            - "Show B at V2 for AR_B, event 2026-10-18T02:00:00Z, RENTAL, rental_fee 100000, with an ACCEPTED FLAT_GUARANTEE offer of 2000000 (deposit 0, expense_cap_cents 2000000)."
            - "Show C at V1 for AR_A, event 2026-11-14T02:00:00Z, RENTAL, rental_fee 100000, with a SUBMITTED FLAT_GUARANTEE offer of 3000000 (deposit 0, expense_cap_cents 3000000) — the replacement booking, not yet accepted."
            - "No tickets are ever sold, so adjusted_gross_cents is 0 on every show and at-risk is driven purely by breakeven_cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
