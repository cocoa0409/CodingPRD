# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1939: Hazardous Waste Generator & Manifest Management
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB using only §1.5 endpoints. Clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: biennial_fee_provisional_vs_final
        grounds:
          - calculations.biennial_report_fee_cents
          - entities.BiennialReport.fields.provisional_fee_cents
          - entities.BiennialReport.fields.final_fee_cents
        distinguishing_aspect: |
          Same stored site data, two fee variants produce different results:
          the provisional variant counts the in-period IN_TRANSIT manifest
          (1000 kg, fee 260500) while the final variant at submission counts
          RETURNED manifests only (none yet, fee 250000) — a fiscal calculation
          on BiennialReport, distinct from the container-deadline domain.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-10T00:00:00Z"
            - "Site is LQG (one 1000 kg central container in Jan 2027)"
            - "Transporter and TSDF APPROVED with audit coverage [2025-01-01, 2028-01-01)"
            - "One manifest (line 1000.0 kg, tonnage_fee_cents 10500) is IN_TRANSIT, shipped 2027-01-10"
            - "BiennialReport for 2027 exists in DRAFT"
          setup_api_calls:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2027-01-10T00:00:00Z" }, as: EHSManager }
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TRANSPORTER", name: "HaulCo", epa_id_number: "EPA-TR-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { transp_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/audits", payload: { coverage_from: "2025-01-01T00:00:00Z", coverage_to: "2028-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2025-01-01T00:00:00Z", coverage_to: "2028-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 10, quantity_kg: 1000.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2027-01-10T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${cont_id}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
            - { call: "POST /hazwaste/containers/${cont_id}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-100", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${cont_id}", quantity_kg: 1000.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_id: "$.data.id" } }
            - { call: "POST /hazwaste/manifests/${man_id}/ldr-notifications", payload: { treatment_standard_codes: ["TLV-01"], certification_statement: "I certify the waste meets treatment standards" }, as: EHSManager }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-generator", as: EHSManager, as_user_id: "mgr-9" }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-transporter", as: TransporterAgent, as_user_id: "${transp_id}" }
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_id}", report_year: 2027 }, as: EHSManager, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/biennial-reports/${rep_id}/submit", as: EHSManager }
          assert:
            - "BiennialReport.${rep_id}.provisional_shipped_kg == 1000.0 (IN_TRANSIT manifest counted provisionally)"
            - "BiennialReport.${rep_id}.provisional_fee_cents == 260500 (250000 LQG base + 10500 tonnage)"
            - "BiennialReport.${rep_id}.final_shipped_kg == 0.0 (no RETURNED manifests at submission)"
            - "BiennialReport.${rep_id}.final_fee_cents == 250000 (base only; no late penalty)"
            - "BiennialReport.${rep_id}.is_late == false"
            - "Manifest.${man_id}.status == IN_TRANSIT (unchanged by report submission)"

      - name: accumulation_deadline_category_at_start_vs_current
        grounds:
          - calculations.accumulation_deadline_at
          - entities.Container.fields.deadline_days
          - entities.Container.fields.is_accumulation_overdue
        distinguishing_aspect: |
          Same stored container, two deadline variants diverge: pinned
          category_at_start freezes container A's allowance at 180 days (SQG at
          accumulation start), while the rejected current_category variant would
          shorten it to 90 days once the site flips to LQG — at 2026-12-01 the
          pinned variant reports is_accumulation_overdue == false where the
          alternative reports true. Container-compliance domain, distinct from
          the BiennialReport fee domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z (default)"
            - "Site with ACTIVE stream and CENTRAL_90DAY area"
            - "Container A (500 kg) entered central accumulation at 2026-08-01 while site was SQG (month total 500)"
            - "Container B (500 kg) pushed August to 1000.0 kg -> LQG for August"
            - "Clock advanced to 2026-10-01 (month rollover reset), then container C (1000 kg) makes October LQG again"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "paint sludge", waste_codes: ["F003"], physical_state: "SLUDGE" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["F003"], ldr_treatment_standard: "TLV-02", flash_point_c: 61.0, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 20, quantity_kg: 500.0 }, as: WasteCoordinator, captures: { cont_a: "$.data.id" } }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 20, quantity_kg: 500.0 }, as: WasteCoordinator, captures: { cont_b: "$.data.id" } }
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: EHSManager }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 20, quantity_kg: 1000.0 }, as: WasteCoordinator, captures: { cont_c: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: EHSManager }
            - { call: "GET /hazwaste/containers/${cont_a}", as: EHSManager }
            - { call: "GET /hazwaste/generator-sites/${site_id}", as: EHSManager }
          assert:
            - "Container.${cont_a}.deadline_days == 180 (snapshotted at 2026-08-01 while SQG)"
            - "Container.${cont_a}.accumulation_deadline_at == 2027-01-28T00:00:00Z"
            - "Container.${cont_a}.is_accumulation_overdue == false at 2026-10-31 (the current_category variant would shorten the deadline to 2026-10-30 and report true)"
            - "GeneratorSite.${site_id}.generator_category == LQG at evaluation time (October total 1000.0 kg)"
            - "Container.${cont_c}.deadline_days == 90 (entered central accumulation during an LQG month)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: manifest_tonnage_fee_per_line_rounding
        grounds:
          - calculations.manifest_tonnage_fee_cents
          - entities.Manifest.fields.tonnage_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum, so
          two 1.0 kg lines at 10.5 cents/kg yield 11 + 11 = 22 cents; the rejected
          sum-then-round order would yield round_half_up(21.0) = 21 cents.
        test_recipe:
          setup:
            - "Logical clock at 2027-01-10T00:00:00Z"
            - "Site with ACTIVE stream, CENTRAL_90DAY area, APPROVED + audit-current transporter and TSDF"
            - "Two containers of 1.0 kg each, both labeled, inspected, STAGED_FOR_SHIPMENT"
          setup_api_calls:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2027-01-10T00:00:00Z" }, as: EHSManager }
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "lab packs", waste_codes: ["D002"], physical_state: "SOLID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D002"], ldr_treatment_standard: "TLV-01", flash_point_c: 80.0, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TRANSPORTER", name: "HaulCo", epa_id_number: "EPA-TR-1", permitted_waste_codes: ["D002"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { transp_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/audits", payload: { coverage_from: "2025-01-01T00:00:00Z", coverage_to: "2028-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D002"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2025-01-01T00:00:00Z", coverage_to: "2028-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 1, quantity_kg: 1.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { c1: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${c1}/label", payload: { label_text: "Hazardous Waste — D002", label_accumulation_start_marked: "2027-01-10T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${c1}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
            - { call: "POST /hazwaste/containers/${c1}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 1, quantity_kg: 1.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { c2: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${c2}/label", payload: { label_text: "Hazardous Waste — D002", label_accumulation_start_marked: "2027-01-10T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${c2}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
            - { call: "POST /hazwaste/containers/${c2}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
          trigger:
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-200", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${c1}", quantity_kg: 1.0 }, { waste_stream_id: "${stream_id}", container_id: "${c2}", quantity_kg: 1.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_id: "$.data.id", fee: "$.data.tonnage_fee_cents" } }
          assert:
            - "Manifest.${man_id}.tonnage_fee_cents == 22 (round_half_up(1.0 * 10.5) = 11 per line, then 11 + 11)"
            - "Manifest.${man_id}.tonnage_fee_cents != 21 (the sum-then-round order is rejected)"
            - "Manifest.${man_id}.total_quantity_kg == 2.0"

      - name: biennial_fee_tiered_base_plus_capped_late
        grounds:
          - calculations.biennial_report_fee_cents
          - entities.BiennialReport.fields.days_late
        distinguishing_aspect: |
          Mode (a) >=3 inputs with non-linear interaction: tiered base selection
          (category_snapshot VSQG -> 25000) + aggregated tonnage (21000) + a
          conditional late branch with nested min() cap (153 days * 5000 = 765000,
          capped to 150000) — evaluation order pinned category -> manifest set ->
          late branch; distinct mode from the per-line-rounding instance.
        test_recipe:
          setup:
            - "Manifest for 2000.0 kg shipped 2025-06-01 (site was LQG that month), later returned late"
            - "Logical clock advanced to 2026-08-01T00:00:00Z; month rollover reset the site to VSQG"
            - "Report year 2025: due_at 2026-03-01T00:00:00Z, so submission is 153 days late"
          setup_api_calls:
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2025-06-01T00:00:00Z" }, as: EHSManager }
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
            - { call: "POST /hazwaste/accumulation-areas", payload: { site_id: "${site_id}", name: "Central A", area_type: "CENTRAL_90DAY" }, as: WasteCoordinator, captures: { area_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TRANSPORTER", name: "HaulCo", epa_id_number: "EPA-TR-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { transp_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${transp_id}/audits", payload: { coverage_from: "2025-01-01T00:00:00Z", coverage_to: "2028-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/waste-partners", payload: { partner_type: "TSDF", name: "DispCo", epa_id_number: "EPA-TS-1", permitted_waste_codes: ["D001"] }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { tsdf_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/status", payload: { to_status: "APPROVED" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /hazwaste/waste-partners/${tsdf_id}/audits", payload: { coverage_from: "2025-01-01T00:00:00Z", coverage_to: "2028-01-01T00:00:00Z", outcome: "PASS" }, as: ComplianceAuditor }
            - { call: "POST /hazwaste/containers", payload: { waste_stream_id: "${stream_id}", accumulation_area_id: "${area_id}", quantity_gallons: 40, quantity_kg: 2000.0 }, as: WasteCoordinator, as_user_id: "wc-1", captures: { cont_id: "$.data.id" } }
            - { call: "POST /hazwaste/containers/${cont_id}/label", payload: { label_text: "Hazardous Waste — D001", label_accumulation_start_marked: "2025-06-01T00:00:00Z" }, as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/containers/${cont_id}/inspections", payload: { result: "PASS" }, as: WasteCoordinator, as_user_id: "wc-2" }
            - { call: "POST /hazwaste/containers/${cont_id}/stage", as: WasteCoordinator, as_user_id: "wc-1" }
            - { call: "POST /hazwaste/manifests", payload: { site_id: "${site_id}", transporter_id: "${transp_id}", tsdf_id: "${tsdf_id}", manifest_tracking_number: "MT-300", line_items: [{ waste_stream_id: "${stream_id}", container_id: "${cont_id}", quantity_kg: 2000.0 }] }, as: WasteCoordinator, as_user_id: "wc-1", captures: { man_id: "$.data.id" } }
            - { call: "POST /hazwaste/manifests/${man_id}/ldr-notifications", payload: { treatment_standard_codes: ["TLV-01"], certification_statement: "certified" }, as: EHSManager }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-generator", as: EHSManager, as_user_id: "mgr-9" }
            - { call: "POST /hazwaste/manifests/${man_id}/sign-transporter", as: TransporterAgent, as_user_id: "${transp_id}" }
            - { call: "POST /hazwaste/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: EHSManager }
            - { call: "POST /hazwaste/manifests/${man_id}/confirm-return", as: EHSManager }
            - { call: "POST /hazwaste/biennial-reports", payload: { site_id: "${site_id}", report_year: 2025 }, as: EHSManager, captures: { rep_id: "$.data.id" } }
          trigger:
            - { call: "POST /hazwaste/biennial-reports/${rep_id}/submit", as: EHSManager }
          assert:
            - "BiennialReport.${rep_id}.category_snapshot == VSQG (category at computation time; the Jun-2025 LQG month has rolled away)"
            - "BiennialReport.${rep_id}.provisional_fee_cents == 46000 (25000 VSQG base + 21000 tonnage, no late branch)"
            - "BiennialReport.${rep_id}.is_late == true"
            - "BiennialReport.${rep_id}.days_late == 153 (2026-03-01 -> 2026-08-01)"
            - "BiennialReport.${rep_id}.final_shipped_kg == 2000.0"
            - "BiennialReport.${rep_id}.final_fee_cents == 196000 (25000 + 21000 + min(150000, 5000*153)=150000)"
            - "Manifest.${man_id}.is_return_late == true"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: wastestream_recharacterization_cycle
        grounds:
          - state_machines.WasteStream.ACTIVE_to_CHARACTERIZED
          - state_machines.WasteStream.CHARACTERIZED_to_ACTIVE
        distinguishing_aspect: |
          WasteStream loops ACTIVE -> CHARACTERIZED -> ACTIVE (recharacterization
          cycle), not a linear pipeline; each loop burns a version and a
          characterization_version. Distinct entity from the Manifest loop.
        test_recipe:
          setup:
            - "Site with one stream already characterized once and activated (version 3)"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v1: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v1}" }, as: WasteCoordinator }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager, captures: { stream_v3: "$.data.version" } }
          trigger:
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001", "F003"], ldr_treatment_standard: "TLV-09", flash_point_c: 25.0, expected_waste_stream_version: "${stream_v3}" }, as: WasteCoordinator, captures: { stream_v4: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/activate", as: EHSManager }
          assert:
            - "After recharacterization: WasteStream.${stream_id}.status == CHARACTERIZED and characterization_version == 2"
            - "WasteStream.${stream_id}.version == 4 after the loop-back characterize"
            - "After re-activation: status == ACTIVE, version == 5, ldr_treatment_standard == TLV-09"

      - name: manifest_discrepancy_cycle
        grounds:
          - state_machines.Manifest.DELIVERED_to_DISCREPANCY_RAISED
          - state_machines.Manifest.DISCREPANCY_RAISED_to_DELIVERED
        distinguishing_aspect: |
          Manifest loops DELIVERED -> DISCREPANCY_RAISED -> DELIVERED before
          RETURNED, with the site discrepancy counter incremented and decremented
          per lap — a branching cycle on a different entity than WasteStream.
        test_recipe:
          setup:
            - "Default clock 2026-08-01T00:00:00Z"
            - "Full shipment chain complete through TSDF receipt: manifest DELIVERED, container EMPTIED"
          setup_api_calls:
            - { call: "POST /hazwaste/generator-sites", payload: { name: "Site A", epa_id_number: "EPA-SITE-A" }, as: EHSManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /hazwaste/waste-streams", payload: { site_id: "${site_id}", name: "spent solvent", waste_codes: ["D001"], physical_state: "LIQUID" }, as: WasteCoordinator, captures: { stream_id: "$.data.id", stream_v: "$.data.version" } }
            - { call: "POST /hazwaste/waste-streams/${stream_id}/characterize", payload: { is_hazardous: true, waste_codes: ["D001"], ldr_treatment_standard: "TLV-01", flash_point_c: 21.5, expected_waste_stream_version: "${stream_v}" }, as: WasteCoordinator }
