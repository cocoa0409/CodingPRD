            - "${e_seq} == ERR_MILESTONE_OUT_OF_SEQUENCE (409) — SUBSTANTIAL_COMPLETION cannot be claimed from PRECONSTRUCTION, and the priority-8 guard answers before the missing-test check"
            - "${ms1} == MC_CLAIMED with ${claimer} == u-pm-1, then ${ms2} == MC_CERTIFIED (decided by the different user u-oe-2)"
            - "${e_test} == ERR_REQUIRED_TEST_NOT_PASSED (422) — the substation IS energized, so priority 10 clears and priority 24 answers for the missing PASSED CAPACITY test"
