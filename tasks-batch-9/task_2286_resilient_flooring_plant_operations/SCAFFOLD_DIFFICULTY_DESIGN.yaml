# =============================================================================
# §1.8 Scaffold Difficulty Design — Resilient Flooring Plant Operations (2286)
#
# Depth probe: 9 §0.5 difficulty rules x >=2 instances. Every instance grounds
# only in elements declared by SCAFFOLD.yaml §1.1-§1.7. Every numeric assert is
# a literal produced by executing the relevant §1.3 formula against the pinned
# fixtures below (no round(...) expressions, no estimates).
#
# Shared setup fragments are declared once as YAML anchors on their first use and
# aliased thereafter, so every ${var} in every instance is bound by a `captures:`
# on an earlier line of that same instance.
#
# Canonical fixture values reused across instances:
#   RM-RESIN   VINYL_RESIN  cost 180  ind 90  thermal 85  migration  5  max_phr 100
#   RM-STAB    STABILIZER   cost 900  ind 60  thermal 96  migration  2  max_phr   5
#   RM-PLAST   PLASTICIZER  cost 240  ind 35  thermal 40  migration 62  max_phr  60
#   RM-FILLER  FILLER       cost  45  ind 96  thermal 92  migration  1  max_phr 400
#   F-MIN  = resin 100 + stab 3   -> total_phr 103  cost 201  score 89.28  CLASS_34_43
#   F-STD  = resin 100 + plast 22 + filler 240 + stab 3 -> 365  cost 101  score 87.15
#   F-LOW  = resin 100 + plast 44 + filler 330 + stab 1 -> 475  cost  93  score 68.73
#   SKU-A  GLUE_DOWN wear 12 thk 2.5 basis 2100 margin 3500 -> std 1157  list 1562
#   SKU-A20 = SKU-A with wear 20                            -> std 1185  (delta 28)
#   SKU-B  CLICK_LOCK_SPC waterproof IXPE wear 20 thk 5.0   -> std 1372  list 1921
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: sku_standard_cost_live_versus_pinned_material_basis
        grounds:
          - calculations.sku_standard_cost
          - calculations.formulation_blend_metrics
          - entities.ProductSku.fields.standard_cost_cents_per_sqm
          - entities.ProductSku.fields.list_price_cents_per_sqm
          - entities.FormulationComponent.fields.material_cost_snapshot_cents
          - entities.Formulation.fields.cost_basis
          - state_machines.Formulation.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The two variants of sku_standard_cost read the SAME recipe through two
          different cost bases: PINNED_BASIS prices the core compound from the
          FormulationComponent.material_cost_snapshot_cents written at approval,
          LIVE_BASIS re-blends it from the current RawMaterial.cost_per_kg_cents.
          Revaluing RM-RESIN from 180 to 260 after certification therefore leaves
          the pinned variant at exactly 1157 while the live variant moves to
          exactly 1527 — a basis_delta_cents_per_sqm of exactly 370.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "RM-RESIN (VINYL_RESIN, 180 c/kg) and RM-STAB (STABILIZER, 900 c/kg) exist and are ACTIVE"
            - "Formulation F-MIN = resin 100 phr + stabiliser 3 phr, APPROVED, cost_basis PINNED, blended_cost_per_kg_cents 201"
            - "DesignLicense LIC-OAK ACTIVE, royalty_rate_bps 500, term_volume_cap_sqm 2000.00"
            - "PrintFilm PF-OAK-1200 AVAILABLE, repeat 1200 x 180 mm"
            - "ProductSku SKU-A CERTIFIED with standard_cost_cents_per_sqm 1157 and list_price_cents_per_sqm 1562 stamped from the PINNED_BASIS variant"
            - "RM-RESIN then revalued to 260 c/kg, which does not touch the pinned snapshots"
          setup_api_calls:
            - &clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "pa-001"
            - &rmResin
              call: "POST /raw-materials"
              payload: { material_code: "RM-RESIN", name: "Suspension PVC K67", category: "VINYL_RESIN", cost_per_kg_cents: 180, indentation_index: 90, thermal_stability_index: 85, plasticizer_migration_index: 5, max_phr: 100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_resin_id: $.data.id }
            - &rmStab
              call: "POST /raw-materials"
              payload: { material_code: "RM-STAB", name: "Ca-Zn stabiliser", category: "STABILIZER", cost_per_kg_cents: 900, indentation_index: 60, thermal_stability_index: 96, plasticizer_migration_index: 2, max_phr: 5 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_stab_id: $.data.id }
            - &fmin
              call: "POST /formulations"
              payload: { formulation_code: "F-MIN" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_min_id: $.data.id }
            - &fminC1
              call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
              captures: { fmin_c_resin_id: $.data.id }
            - &fminC2
              call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "${rm_stab_id}", phr: 3 }
              as: Formulator
              as_user_id: "form-001"
              captures: { fmin_c_stab_id: $.data.id }
            - &fminSubmit
              call: "POST /formulations/${f_min_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
            - &fminApprove
              call: "POST /formulations/${f_min_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "blend within spec" }
              as: TechnicalDirector
              as_user_id: "td-001"
            - &lic
              call: "POST /design-licenses"
              payload: { license_code: "LIC-OAK", licensor_name: "Nordic Decor AB", license_type: "NON_EXCLUSIVE", royalty_rate_bps: 500, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", term_volume_cap_sqm: 2000.00, territory_codes: ["US", "CA"] }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { lic_id: $.data.id }
            - &pf1
              call: "POST /print-films"
              payload: { design_code: "PF-OAK-1200", license_id: "${lic_id}", pattern_repeat_mm_length: 1200.0, pattern_repeat_mm_width: 180.0, registration_tolerance_mm: 0.25, emboss_plate_code: "EMB-OAK-A", emboss_alignment_offset_mm: 0.10, master_roll_sets: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf1_id: $.data.id }
            - &skuA
              call: "POST /product-skus"
              payload: { sku_code: "SKU-A", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: "GLUE_DOWN", wear_layer_mil: 12, overall_thickness_mm: 2.5, waterproof_rated: false, attached_underlayment_type: "NONE", profile_family: "NONE", royalty_basis_price_cents_per_sqm: 2100, target_margin_bps: 3500 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { sku_a_id: $.data.id }
            - &skuABegin
              call: "POST /product-skus/${sku_a_id}/begin-testing"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpA1
              call: "POST /test-panels"
              payload: { panel_code: "TP-A1", sku_id: "${sku_a_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_a1_id: $.data.id }
            - &tpA1Start
              call: "POST /test-panels/${tp_a1_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpA1Ind
              call: "POST /test-panels/${tp_a1_id}/results"
              payload: { test_type: "RESIDUAL_INDENTATION", measured_value: 0.08 }
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpA1Dim
              call: "POST /test-panels/${tp_a1_id}/results"
              payload: { test_type: "DIMENSIONAL_STABILITY_HEAT", measured_value: 0.12 }
              as: QaTechnician
              as_user_id: "qa-001"
            - &skuACertify
              call: "POST /product-skus/${sku_a_id}/certify"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
            - call: "POST /raw-materials/${rm_resin_id}/cost"
              payload: { cost_per_kg_cents: 260 }
              as: PlantAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "GET /product-skus/${sku_a_id}/cost-summary"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { live_std: $.data.live_basis_standard_cost_cents_per_sqm, pinned_std: $.data.pinned_basis_standard_cost_cents_per_sqm, basis_delta: $.data.basis_delta_cents_per_sqm }
          assert:
            - "response data.pinned_basis_blended_cost_per_kg_cents == 201"
            - "response data.live_basis_blended_cost_per_kg_cents == 279"
            - "response data.pinned_basis_core_cost_cents == 955"
            - "response data.live_basis_core_cost_cents == 1325"
            - "response data.wear_layer_cost_cents == 42"
            - "response data.print_film_cost_cents == 20"
            - "response data.underlayment_cost_cents == 0"
            - "response data.waterproof_cost_cents == 0"
            - "response data.conversion_cost_cents == 35"
            - "response data.royalty_cost_cents == 105"
            - "response data.pinned_basis_standard_cost_cents_per_sqm == 1157"
            - "response data.live_basis_standard_cost_cents_per_sqm == 1527"
            - "response data.basis_delta_cents_per_sqm == 370"
            - "response data.pinned_basis_list_price_cents_per_sqm == 1562"
            - "response data.live_basis_list_price_cents_per_sqm == 2061"
            - "ProductSku.${sku_a_id}.standard_cost_cents_per_sqm == 1157 (the stamped value is unchanged by the revaluation)"
            - "ProductSku.${sku_a_id}.list_price_cents_per_sqm == 1562"
            - "Formulation.${f_min_id}.blended_cost_per_kg_cents == 201 and Formulation.${f_min_id}.cost_basis == PINNED"
            - "RawMaterial.${rm_resin_id}.cost_per_kg_cents == 260"

      - name: warranty_settlement_prorated_versus_stepped_variant_divergence
        grounds:
          - calculations.warranty_settlement_amount
          - entities.WarrantyClaim.fields.settlement_variant
          - entities.WarrantyClaim.fields.elapsed_months
          - entities.WarrantyClaim.fields.replacement_value_cents
          - entities.WarrantyClaim.fields.labor_allowance_cents
          - calculations.sku_warranty_terms
          - state_machines.WarrantyClaim.ADJUDICATION_READY_to_APPROVED
        distinguishing_aspect: |
          Two WarrantyClaims against the SAME Batch with identical claimed_area_sqm
          60.00, installed_on 2021-03-10 and reported_on 2026-08-20 differ ONLY in
          claim_type, which selects the variant: WEAR_LAYER_WEARTHROUGH decays
          straight-line by month (175/240 -> 91875 + 21000 = 112875) while
          DELAMINATION decays in whole-year steps (60% -> 75600 + 21000 = 96600),
          a divergence of exactly 16275 cents on identical inputs.
        test_recipe:
          setup:
            - "SKU-A CERTIFIED with warranty_years 20 (240 coverage months) and royalty_basis_price_cents_per_sqm 2100"
            - "press line PL-1 AVAILABLE, ProductionRun RUN-A1 COMPLETED with actual_quantity_sqm 1200.00 and wear_layer_measured_mil 12.0"
            - "Batch minted from RUN-A1 is IN_STOCK with wear_layer_measured_mil 12.0, so the manufacturing-defect override does NOT fire (12.0 is not below 12 - 0.5)"
            - "Distributor D-100 exists with certified_installer_program true"
            - "logical clock advanced to 2026-08-25T00:00:00Z before the claims are filed"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - &pl1
              call: "POST /press-lines"
              payload: { line_code: "PL-1", line_type: "CALENDER", min_thickness_mm: 1.5, max_thickness_mm: 8.0, changeover_minutes: 60, curl_control_index: 92 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pl1_id: $.data.id }
            - &runA1
              call: "POST /production-runs"
              payload: { run_code: "RUN-A1", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T09:00:00Z", planned_quantity_sqm: 1200.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_a1_id: $.data.id }
            - &runA1Setup
              call: "POST /production-runs/${run_a1_id}/setup"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
            - &runA1Start
              call: "POST /production-runs/${run_a1_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
            - &runA1Complete
              call: "POST /production-runs/${run_a1_id}/complete"
              payload: { actual_quantity_sqm: 1200.00, registration_drift_mm: 0.10, curl_deviation_mm: 0.05, emboss_alignment_offset_mm: 0.15, wear_layer_measured_mil: 12.0 }
              as: ProductionPlanner
              as_user_id: "pp-001"
            - &runA1Qc
              call: "POST /production-runs/${run_a1_id}/qc-disposition"
              payload: { to_disposition: "RELEASED" }
              as: QaTechnician
              as_user_id: "qa-001"
            - &getBatchA1
              call: "GET /batches"
              payload: { production_run_id: "${run_a1_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { batch_a1_id: "$.data[0].id" }
            - &dist
              call: "POST /distributors"
              payload: { account_code: "D-100", name: "Northern Floors", territory_code: "US", certified_installer_program: true }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { dist_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "pa-001"
          trigger:
            - call: "POST /warranty-claims"
              payload: { claim_code: "WC-WEAR", batch_id: "${batch_a1_id}", distributor_id: "${dist_id}", claim_type: "WEAR_LAYER_WEARTHROUGH", claimed_area_sqm: 60.00, installed_on: "2021-03-10T00:00:00Z", reported_on: "2026-08-20T00:00:00Z", installed_by_certified_installer: true }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { claim_w_id: $.data.id }
            - call: "POST /warranty-claims/${claim_w_id}/triage"
              payload: {}
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${claim_w_id}/reviews"
              payload: { review_kind: "FIELD", outcome: "DEFECT_CONFIRMED", note: "wear-through to print film" }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${claim_w_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: WarrantyAdjuster
              as_user_id: "adj-002"
              captures: { wear_settlement: $.data.settlement_amount_cents }
            - call: "POST /warranty-claims"
              payload: { claim_code: "WC-DELAM", batch_id: "${batch_a1_id}", distributor_id: "${dist_id}", claim_type: "DELAMINATION", claimed_area_sqm: 60.00, installed_on: "2021-03-10T00:00:00Z", reported_on: "2026-08-20T00:00:00Z", installed_by_certified_installer: true }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { claim_d_id: $.data.id }
            - call: "POST /warranty-claims/${claim_d_id}/triage"
              payload: {}
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${claim_d_id}/reviews"
              payload: { review_kind: "MATERIALS", outcome: "DEFECT_CONFIRMED", note: "adhesive failure at core interface" }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${claim_d_id}/reviews"
              payload: { review_kind: "FIELD", outcome: "DEFECT_CONFIRMED", note: "visible layer separation" }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${claim_d_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: WarrantyAdjuster
              as_user_id: "adj-002"
              captures: { delam_settlement: $.data.settlement_amount_cents }
          assert:
            - "ProductSku.${sku_a_id}.warranty_years == 20"
            - "ProductSku.${sku_a_id}.light_commercial_warranty_years == 10"
            - "WarrantyClaim.${claim_w_id}.required_reviews == ['FIELD']"
            - "WarrantyClaim.${claim_w_id}.elapsed_months == 65"
            - "WarrantyClaim.${claim_w_id}.settlement_variant == PRORATED_STRAIGHT_LINE"
            - "WarrantyClaim.${claim_w_id}.replacement_value_cents == 126000"
            - "WarrantyClaim.${claim_w_id}.labor_allowance_cents == 21000"
            - "WarrantyClaim.${claim_w_id}.settlement_amount_cents == 112875"
            - "WarrantyClaim.${claim_w_id}.status == APPROVED"
            - "WarrantyClaim.${claim_d_id}.required_reviews == ['MATERIALS', 'FIELD']"
            - "WarrantyClaim.${claim_d_id}.elapsed_months == 65"
            - "WarrantyClaim.${claim_d_id}.settlement_variant == STEPPED_SCHEDULE"
            - "WarrantyClaim.${claim_d_id}.replacement_value_cents == 126000"
            - "WarrantyClaim.${claim_d_id}.labor_allowance_cents == 21000"
            - "WarrantyClaim.${claim_d_id}.settlement_amount_cents == 96600"
            - "${wear_settlement} - ${delam_settlement} == 16275"

      - name: license_volume_ledger_reserved_versus_actual_basis
        grounds:
          - calculations.license_volume_ledger
          - entities.DesignLicense.fields.reserved_volume_sqm
          - entities.DesignLicense.fields.consumed_volume_sqm
          - validations[V-FISC-1]
          - state_machines.ProductionRun.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          license_volume_ledger admits a run on RESERVED_VOLUME_BASIS (consumed +
          reserved + planned) but settles it on ACTUAL_VOLUME_BASIS (reserved
          released, actual consumed). With cap 2000.00 a second run of 900.00 is
          rejected while RUN-A1's 1200.00 is only RESERVED, yet after RUN-A1
          completes at actual 1300.00 a 700.00 run is admitted at exactly the cap
          — proof the two bases are read at different moments, not one number.
        test_recipe:
          setup:
            - "DesignLicense LIC-OAK has term_volume_cap_sqm 2000.00, reserved 0.00, consumed 0.00"
            - "SKU-A is CERTIFIED and press line PL-1 is AVAILABLE"
            - "ProductionRun RUN-A1 is PLANNED for 1200.00 sqm, so reserved_volume_sqm == 1200.00 and consumed_volume_sqm == 0.00"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *pl1
            - *runA1
          trigger:
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { reserved_before: $.data.reserved_volume_sqm, projected_before: $.data.projected_volume_sqm }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-A2-REJECT", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T12:00:00Z", planned_end_utc: "2026-08-01T16:00:00Z", planned_quantity_sqm: 900.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { cap_error: $.data.error_id }
            - call: "POST /production-runs/${run_a1_id}/setup"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
            - call: "POST /production-runs/${run_a1_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
            - call: "POST /production-runs/${run_a1_id}/complete"
              payload: { actual_quantity_sqm: 1300.00, registration_drift_mm: 0.10, curl_deviation_mm: 0.05, emboss_alignment_offset_mm: 0.15, wear_layer_measured_mil: 12.0 }
              as: ProductionPlanner
              as_user_id: "pp-001"
            - call: "POST /production-runs"
              payload: { run_code: "RUN-A3", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T12:00:00Z", planned_end_utc: "2026-08-01T16:00:00Z", planned_quantity_sqm: 700.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_a3_id: $.data.id }
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
          assert:
            - "${reserved_before} == 1200.00 and ${projected_before} == 1200.00 (RESERVED_VOLUME_BASIS before any completion)"
            - "the RUN-A2-REJECT attempt returns 422 with ${cap_error} == ERR_LICENSE_VOLUME_CAP_EXCEEDED because 0.00 + 1200.00 + 900.00 == 2100.00 > 2000.00"
            - "ProductionRun.${run_a1_id}.actual_quantity_sqm == 1300.00"
            - "ProductionRun.${run_a1_id}.royalty_accrued_cents == 136500"
            - "ProductionRun.${run_a1_id}.pattern_waste_sqm == 9.10"
            - "DesignLicense.${lic_id}.reserved_volume_sqm == 700.00 after RUN-A3 is created (RUN-A1's 1200.00 reservation was released on completion)"
            - "DesignLicense.${lic_id}.consumed_volume_sqm == 1300.00"
            - "DesignLicense.${lic_id}.accrued_royalty_cents == 136500"
            - "the RUN-A3 creation returns 201 because 1300.00 + 0.00 + 700.00 == 2000.00 == term_volume_cap_sqm and equality is admitted"
            - "final GET /design-licenses/${lic_id}/utilization returns data.projected_volume_sqm == 2000.00 and data.remaining_volume_sqm == 0.00 and data.contributing_run_count == 1"

  # ===========================================================================
  # RULE 2 — combinatorial_formula (modes a / b / c each represented)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: formulation_blend_metrics_nested_penalty_ladders_mode_a
        grounds:
          - calculations.formulation_blend_metrics
          - entities.Formulation.fields.performance_score
          - entities.Formulation.fields.indentation_resistance_class
          - entities.Formulation.fields.blended_cost_per_kg_cents
          - entities.RawMaterial.fields.indentation_index
          - entities.RawMaterial.fields.plasticizer_migration_index
        distinguishing_aspect: |
          MODE A — nested conditionals plus a MIN/MAX clamp: three six-decimal
          phr-weighted blends feed a weighted sum (0.40/0.35/0.25) from which TWO
          independent conditional penalty ladders (softness on plasticizer_ratio,
          brittleness on filler_ratio) are subtracted before a SINGLE final
          clamp-and-round. F-STD lands on brittleness tier 3 with zero softness
          (87.15) while F-LOW lands on BOTH top tiers, 12 + 8 (68.73); both share
          the same class CLASS_34_43, proving the class is read off
          blended_indentation and never off performance_score.
        test_recipe:
          setup:
            - "RM-RESIN, RM-STAB, RM-PLAST (240 c/kg, ind 35, thermal 40, migration 62, max_phr 60) and RM-FILLER (45 c/kg, ind 96, thermal 92, migration 1, max_phr 400) all ACTIVE"
            - "Formulation F-STD in DRAFT with resin 100 + plasticiser 22 + filler 240 + stabiliser 3 phr (plasticizer_ratio 0.2200, filler_ratio 2.4000)"
            - "Formulation F-LOW in DRAFT with resin 100 + plasticiser 44 + filler 330 + stabiliser 1 phr (plasticizer_ratio 0.4400, filler_ratio 3.3000)"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - &rmPlast
              call: "POST /raw-materials"
              payload: { material_code: "RM-PLAST", name: "DINP plasticiser", category: "PLASTICIZER", cost_per_kg_cents: 240, indentation_index: 35, thermal_stability_index: 40, plasticizer_migration_index: 62, max_phr: 60 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_plast_id: $.data.id }
            - &rmFiller
              call: "POST /raw-materials"
              payload: { material_code: "RM-FILLER", name: "Ground calcium carbonate", category: "FILLER", cost_per_kg_cents: 45, indentation_index: 96, thermal_stability_index: 92, plasticizer_migration_index: 1, max_phr: 400 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_filler_id: $.data.id }
            - &fstd
              call: "POST /formulations"
              payload: { formulation_code: "F-STD" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_std_id: $.data.id }
            - &fstdC1
              call: "POST /formulations/${f_std_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
            - &fstdC2
              call: "POST /formulations/${f_std_id}/components"
              payload: { raw_material_id: "${rm_plast_id}", phr: 22 }
              as: Formulator
              as_user_id: "form-001"
            - &fstdC3
              call: "POST /formulations/${f_std_id}/components"
              payload: { raw_material_id: "${rm_filler_id}", phr: 240 }
              as: Formulator
              as_user_id: "form-001"
            - &fstdC4
              call: "POST /formulations/${f_std_id}/components"
              payload: { raw_material_id: "${rm_stab_id}", phr: 3 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations"
              payload: { formulation_code: "F-LOW" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_low_id: $.data.id }
            - call: "POST /formulations/${f_low_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_low_id}/components"
              payload: { raw_material_id: "${rm_plast_id}", phr: 44 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_low_id}/components"
              payload: { raw_material_id: "${rm_filler_id}", phr: 330 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_low_id}/components"
              payload: { raw_material_id: "${rm_stab_id}", phr: 1 }
              as: Formulator
              as_user_id: "form-001"
          trigger:
            - call: "GET /formulations/${f_std_id}"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { std_score: $.data.performance_score, std_class: $.data.indentation_resistance_class }
            - call: "GET /formulations/${f_low_id}"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { low_score: $.data.performance_score, low_class: $.data.indentation_resistance_class }
          assert:
            - "Formulation.${f_std_id}.total_phr == 365.00"
            - "Formulation.${f_std_id}.resin_phr == 100.00"
            - "Formulation.${f_std_id}.plasticizer_phr == 22.00"
            - "Formulation.${f_std_id}.filler_phr == 240.00"
            - "Formulation.${f_std_id}.stabilizer_phr == 3.00"
            - "Formulation.${f_std_id}.blended_cost_per_kg_cents == 101"
            - "${std_score} == 87.15 (raw 90.151507 minus brittleness 3 and softness 0)"
            - "${std_class} == CLASS_34_43 (blended_indentation 90.383562)"
            - "Formulation.${f_low_id}.total_phr == 475.00"
            - "Formulation.${f_low_id}.blended_cost_per_kg_cents == 93"
            - "${low_score} == 68.73 (raw 88.731789 minus softness 12 and brittleness 8)"
            - "${low_class} == CLASS_34_43 (blended_indentation 89.010526) — same class as F-STD despite an 18.42-point score gap"
            - "both formulations remain in status DRAFT with cost_basis LIVE"

      - name: license_royalty_accrual_round_per_run_then_sum_mode_b
        grounds:
          - calculations.license_royalty_accrual
          - calculations.run_quality_metrics
          - entities.ProductionRun.fields.royalty_accrued_cents
          - entities.DesignLicense.fields.accrued_royalty_cents
          - state_machines.ProductionRun.RUNNING_to_COMPLETED
        distinguishing_aspect: |
          MODE B — ROUNDING ORDER: each run's royalty is rounded to whole cents on
          its own and only then added to the licence ledger. Two runs of exactly
          10.10 sqm at 105 c/sqm each land on 1060.50, so ROUND_PER_RUN_THEN_SUM
          yields exactly 2122 while the SUM_THEN_ROUND ordering would yield 2121 —
          a one-cent-per-run discriminator that no other instance exercises.
        test_recipe:
          setup:
            - "SKU-A CERTIFIED with royalty_basis_price_cents_per_sqm 2100 under LIC-OAK at royalty_rate_bps 500, i.e. exactly 105 cents per sqm"
            - "press line PL-1 AVAILABLE with changeover_minutes 60"
            - "two ProductionRuns on PL-1 in disjoint windows [01:00,03:00) and [05:00,07:00), 120 minutes apart, well above the 30-minute same-formulation changeover requirement"
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
