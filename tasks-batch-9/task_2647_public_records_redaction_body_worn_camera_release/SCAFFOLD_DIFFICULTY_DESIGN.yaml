            - call: "POST /records/redaction-tasks/${task2_id}/submit-qa"
              payload: { logged_labor_minutes: 5, qa_reviewer_id: "${reviewer_id}", qa_window_start_at: "2026-08-01T15:00:00Z", qa_window_end_at: "2026-08-01T16:00:00Z" }
              as: RedactionTechnician
