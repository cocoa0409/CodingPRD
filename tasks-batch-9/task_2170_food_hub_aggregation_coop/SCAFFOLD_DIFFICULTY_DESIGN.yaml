          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_gap: $.data.id
      - call: POST /producers/${p1_id}/documents
        payload:
          doc_type: LIABILITY_INSURANCE
          issued_on: '2026-01-01T00:00:00Z'
          expires_on: '2027-01-01T00:00:00Z'
        as: Producer
        as_user_id: ${p1_id}
        captures:
          p1_ins: $.data.id
      - call: POST /producers/${p1_id}/documents
