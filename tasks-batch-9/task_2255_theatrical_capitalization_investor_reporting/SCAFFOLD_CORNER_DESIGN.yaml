    grounds:
    - validations[priority 13]
    - errors[ERR_THEATRE_ENGAGEMENT_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / theatre_engagement_buffered_closed_interval_collision
      rationale: That §1.8 instance probes the buffered closed interval on both sides of the changeover boundary.
  - name: weekly_wrap_week_overlap_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority 13]
    - errors[ERR_WRAP_WEEK_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / weekly_wrap_half_open_week_adjacency_versus_overlap
      rationale: That §1.8 instance contrasts an adjacent week (accepted) with an intersecting week (refused).
