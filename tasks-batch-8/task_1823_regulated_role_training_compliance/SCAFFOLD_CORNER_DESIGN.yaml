          - "state_machines.AttestationException"
        distinguishing_aspect: "Closing a campaign with an EXCEPTION_PENDING attestation expires the attestation and auto-denies the REQUESTED exception with decision_note AUTO_DENIED_AT_CLOSE; a later attest fails."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-AC; curriculum CUR-AC ACTIVE; roles R-ACM (manager M), R-AC (SOFT req due 30); employee E-AC; campaign CMP-AC OPEN; attestation ATT with a REQUESTED exception (EXCEPTION_PENDING)"]
          setup_api_calls:
