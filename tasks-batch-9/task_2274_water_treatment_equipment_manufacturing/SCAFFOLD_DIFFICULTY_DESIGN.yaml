              payload: { skid_id: "${skid_f_id}", test_bay_id: "${bay1_id}", scheduled_start_at: "2026-08-11T08:00:00.000Z", scheduled_end_at: "2026-08-11T16:00:00.000Z", expected_skid_version: "${skid_f_v2}" }
