            - "One VERIFIED BANK_ACCOUNT finding worth 10000000 cents."
            - "Levy 1 served 2026-08-01 (interval [2026-08-01, 2026-11-29), hold 5335411, leaving available 4664589)."
            - "Levy 2 drafted and its writ requested on 2026-08-01, then the clock advanced to 2026-11-29."
