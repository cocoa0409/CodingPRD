          - entities.Plan.fields.vesting_schedule
          - entities.Participant.fields.vested_employer_balance_cents
        distinguishing_aspect: |
          Different metric (years_of_service, integer count) on a different
          endpoint (POST /contribution-periods/{id}/close drives the
          recomputation). yos=2 -> vested_pct=0 -> vested_employer_balance=0;
          yos=3 -> vested_pct=10000 -> vested_employer_balance=full
