            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a1_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a1_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StationManager
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG", condition_score: 95, service_interval_cycles: 25, cycles_since_service: 0 }
              as: StationManager
              captures: { g1_id: $.data.id }
            - call: "POST /flight-banks/${fb_id}/lifecycle"
              payload: { action: "PUBLISH" }
              as: DutyOfficer
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "SUBMIT" }
              as: DutyOfficer
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v}" }
              as: DutyOfficer
            - call: "GET /turns/${t1_id}"
              payload: {}
              as: DutyOfficer
              captures: { t1_v2: $.data.version }
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "GSE", gse_unit_id: "${g1_id}", window_start: "2026-04-10T05:55:00Z", window_end: "2026-04-10T06:25:00Z", expected_turn_version: "${t1_v2}" }
              as: DutyOfficer
              captures: { t_status_after_cover: $.data.status }
          trigger:
            - call: "POST /turns/${t1_id}/lifecycle"
              payload: { action: "START", actual_in: "2026-04-10T06:00:00Z" }
              as: DutyOfficer
              captures: { err_staffing: $.data.error_id }
            - call: "POST /flight-banks/${fb_id}/staffing-transitions"
              payload: { action: "APPROVE" }
              as: StationManager
              as_user_id: "sm-01"
            - call: "POST /turns/${t1_id}/lifecycle"
              payload: { action: "START", actual_in: "2026-04-10T06:00:00Z" }
              as: DutyOfficer
              captures: { started_status: $.data.status }
          assert:
