scaffold_difficulty_design:

  # =======================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =======================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pickup_request_provisional_vs_final_invoice
        grounds:
          - calculations.final_invoice
          - calculations.item_fee_quote
          - state_machines.PickupRequest.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Dual variants on the PickupRequest entity domain: the forward-looking
          scheduled quote assumes compliant set-out, while the chronological/
          actual final invoice adds driver-observed contamination penalties —
          identical request contents yield final_total == provisional on a clean
          complete but final_total == provisional + 3000 per flagged item on a
          contaminated complete, so the two variants produce different totals for
          the same quoted request shape.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T00:00:00Z"
            - "Households H1 (clean path) and H2 (contaminated path), both ZONE_NORTH, ACTIVE, annual_allowance_items=4"
            - "RouteDay R ZONE_NORTH 2026-08-10, max_load_units=40, max_stops=25, OPEN"
            - "Each household has a request with one APPLIANCE_WITH_REFRIGERANT oversize item, submitted and scheduled onto R; scheduled quote per request: within allowance -> base 0; refrigerant 4500 + oversize 1500 = 6000; surcharge round_half_up(6000*0.085)=510; provisional_total_cents=6510"
            - "Clock advanced to 2026-08-10T07:00:00Z and R dispatched"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "1 Elm St", service_zone: "ZONE_NORTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh1: $.data.id }
            - call: "POST /curbside/households"
              payload: { street_address: "2 Elm St", service_zone: "ZONE_NORTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh2: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh1}" }
              as: Resident
              as_user_id: "${hh1}"
              captures: { req1: $.data.id }
            - call: "POST /curbside/pickup-requests/${req1}/items"
              payload: { sequence_no: 1, category: "APPLIANCE_WITH_REFRIGERANT", is_oversize: true, preparation_ack: true }
              as: Resident
              as_user_id: "${hh1}"
              captures: { it1: $.data.id }
            - call: "POST /curbside/pickup-requests/${req1}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh1}"
            - call: "POST /curbside/pickup-requests/${req1}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh1}"
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { rd_v2: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh2}" }
              as: Resident
              as_user_id: "${hh2}"
              captures: { req2: $.data.id }
            - call: "POST /curbside/pickup-requests/${req2}/items"
              payload: { sequence_no: 1, category: "APPLIANCE_WITH_REFRIGERANT", is_oversize: true, preparation_ack: true }
              as: Resident
              as_user_id: "${hh2}"
              captures: { it2: $.data.id }
            - call: "POST /curbside/pickup-requests/${req2}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh2}"
            - call: "POST /curbside/pickup-requests/${req2}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v2}" }
              as: Resident
              as_user_id: "${hh2}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /curbside/pickup-requests/${req1}/complete"
              payload: {}
              as: Driver
              captures: { clean_final: $.data.final_total_cents, clean_prov: $.data.provisional_total_cents }
            - call: "POST /curbside/pickup-requests/${req2}/complete"
              payload: { improper_preparation_item_ids: ["${it2}"] }
              as: Driver
              captures: { dirty_final: $.data.final_total_cents, dirty_prov: $.data.provisional_total_cents }
          assert:
            - "PickupRequest.${req1}.provisional_total_cents == 6510 and final_total_cents == 6510 (clean complete: forward-looking variant basis confirmed, no delta)"
            - "PickupRequest.${req2}.provisional_total_cents == 6510 and final_total_cents == 9510 (6510 + 3000 contamination penalty: actual variant diverges)"
            - "FeeAssessment kind=FINAL_INVOICE for ${req2} has amount_cents == 9510 and status == PENDING"
            - "PickupRequest.${req2}.final_total_cents > PickupRequest.${req2}.provisional_total_cents (variant divergence is strict)"
      - name: routeday_projected_vs_committed_fullness
        grounds:
          - calculations.route_fullness
          - entities.RouteDay.fields.committed_load_units
          - state_machines.PickupRequest.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          Dual variants on the RouteDay entity domain (different domain from the
          PickupRequest invoice pair): projected fullness counts only SCHEDULED
          stops while committed_load_units counts SCHEDULED+COMPLETED — after one
          of two identical-load stops completes, projected drops while committed
          stays, so the two valid readings of route fullness diverge.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T00:00:00Z; two households A and B in ZONE_EAST, ACTIVE, allowance 4"
            - "RouteDay R ZONE_EAST 2026-08-10, max_load_units=40, max_stops=25, OPEN"
            - "Each household has a SCHEDULED request with one STANDARD_FURNITURE item (load 2 each; committed_load_units=4, committed_stops=2)"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "10 Oak Ave", service_zone: "ZONE_EAST", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_a: $.data.id }
            - call: "POST /curbside/households"
              payload: { street_address: "12 Oak Ave", service_zone: "ZONE_EAST", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_b: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_EAST", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_a}" }
              as: Resident
              as_user_id: "${hh_a}"
              captures: { req_a: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_a}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_a}"
            - call: "POST /curbside/pickup-requests/${req_a}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_a}"
            - call: "POST /curbside/pickup-requests/${req_a}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_a}"
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { rd_v2: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_b}" }
              as: Resident
              as_user_id: "${hh_b}"
              captures: { req_b: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_b}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_b}"
            - call: "POST /curbside/pickup-requests/${req_b}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_b}"
            - call: "POST /curbside/pickup-requests/${req_b}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v2}" }
              as: Resident
              as_user_id: "${hh_b}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /curbside/pickup-requests/${req_a}/complete"
              payload: {}
              as: Driver
          trigger:
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { committed: $.data.committed_load_units, committed_st: $.data.committed_stops, proj: $.data.projected_load_units, proj_pct: $.data.projected_fullness_pct }
          assert:
            - "RouteDay.${rd_id}.committed_load_units == 4 (COMPLETED stop still occupies capacity)"
            - "RouteDay.${rd_id}.committed_stops == 2"
            - "RouteDay.${rd_id}.projected_load_units == 2 and projected_fullness_pct == 5 — diverges from committed_load_units == 4 (committed fullness 10 pct)"

  # =======================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) vs (b))
  # =======================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_item_fee_multi_branch_mode_a
        grounds:
          - calculations.item_fee_quote
          - entities.PickupItem.fields.item_fee_cents
        distinguishing_aspect: |
          Mode (a) formula: per-item fee combines >= 4 inputs (allowance flag,
          refrigerant category, oversize flag, mattress category, amnesty freeze)
          with nested conditional branches on entity state — the fridge+oversize
          over-allowance item prices 8500 pre-surcharge while an identical
          in-allowance item prices 6000, proving branch interaction.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H allowance 4 with items_consumed already 4 for 2026 (four STANDARD_FURNITURE items scheduled+completed earlier in the year)"
            - "RouteDay R ZONE_SOUTH 2026-08-20 OPEN cap 40/25"
            - "New request with: item1 MATTRESS (not oversize), item2 APPLIANCE_WITH_REFRIGERANT oversize; both over-allowance"
            - "Pinned arithmetic: item1 = 2500+1200 = 3700, surcharge round_half_up(3700*0.085)=315 -> 4015; item2 = 2500+4500+1500 = 8500, surcharge round_half_up(8500*0.085)=723 -> 9223"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "7 Pine Rd", service_zone: "ZONE_SOUTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_SOUTH", route_date: "2026-01-12", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_jan: $.data.id, rd_jan_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_jan: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_jan}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_jan}/items"
              payload: { sequence_no: 2, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_jan}/items"
              payload: { sequence_no: 3, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_jan}/items"
              payload: { sequence_no: 4, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_jan}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_jan}/schedule"
              payload: { route_day_id: "${rd_jan}", expected_route_day_version: "${rd_jan_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_SOUTH", route_date: "2026-08-20", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_aug: $.data.id, rd_aug_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_aug: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_aug}/items"
              payload: { sequence_no: 1, category: "MATTRESS", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_aug}/items"
              payload: { sequence_no: 2, category: "APPLIANCE_WITH_REFRIGERANT", is_oversize: true, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_aug}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /curbside/pickup-requests/${req_aug}/schedule"
              payload: { route_day_id: "${rd_aug}", expected_route_day_version: "${rd_aug_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { total: $.data.provisional_total_cents }
          assert:
            - "PickupRequest.${req_aug}.provisional_total_cents == 13238 (4015 + 9223)"
            - "PickupItem sequence_no=1 item_fee_cents == 4015 and within_allowance == false"
            - "PickupItem sequence_no=2 item_fee_cents == 9223 and within_allowance == false"
            - "HouseholdAllowance(2026).items_consumed == 4 and over_allowance_items == 2"
      - name: per_line_vs_sum_rounding_mode_b
        grounds:
          - calculations.item_fee_quote
        distinguishing_aspect: |
          Mode (b) nested rounding: the surcharge is rounded half-up per item and
          THEN summed; applying the rate to the summed subtotal would give 1037
          instead of 1038 on the pinned two-item fixture (85.00/37.00 pre-surcharge
          at 8.5%) — a one-cent divergence that pins the rounding order.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H allowance 1 in ZONE_WEST with items_consumed already 1 for 2026"
            - "RouteDay R ZONE_WEST 2026-08-21 OPEN cap 40/25"
            - "Request: item1 APPLIANCE_WITH_REFRIGERANT oversize (over-allowance): 2500+4500+1500=8500, surcharge 723 -> 9223; item2 MATTRESS (over-allowance): 2500+1200=3700, surcharge 315 -> 4015"
            - "Per-item-then-sum total: 13238. Sum-then-round would give 8500+3700=12200, round_half_up(12200*0.085)=1037, total 13237 — pinned order yields 13238"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "3 Birch Ln", service_zone: "ZONE_WEST", annual_allowance_items: 1 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_WEST", route_date: "2026-08-14", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_first: $.data.id, rd_first_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_first: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_first}/items"
              payload: { sequence_no: 1, category: "TIRES", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_first}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_first}/schedule"
              payload: { route_day_id: "${rd_first}", expected_route_day_version: "${rd_first_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_WEST", route_date: "2026-08-21", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "APPLIANCE_WITH_REFRIGERANT", is_oversize: true, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 2, category: "MATTRESS", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { total: $.data.provisional_total_cents }
          assert:
            - "PickupRequest.${req_id}.provisional_total_cents == 13238 (per-item rounding pinned; sum-then-round would give 13237)"
            - "PickupItem sequence_no=1 item_fee_cents == 9223"
            - "PickupItem sequence_no=2 item_fee_cents == 4015"

  # =======================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =======================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: pickup_request_refusal_reschedule_cycle
        grounds:
          - state_machines.PickupRequest.SCHEDULED_to_REFUSED
          - state_machines.PickupRequest.REFUSED_to_SCHEDULED
        distinguishing_aspect: |
          Cyclic machine on PickupRequest: SCHEDULED -> REFUSED -> SCHEDULED is a
          loop (not a pipeline) and the loop must be allowance-idempotent — the
          re-schedule consumes NO additional allowance slots because refusal never
          released them.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_NORTH allowance 4, fresh"
            - "RouteDays R1 (2026-08-10) and R2 (2026-08-17), ZONE_NORTH, OPEN, cap 40/25"
            - "Request with 2 STANDARD_FURNITURE items, submitted, scheduled onto R1 (items_consumed=2)"
            - "R1 dispatched on 2026-08-10 and the stop REFUSED with IMPROPER_PREPARATION"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "9 Cedar Ct", service_zone: "ZONE_NORTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd1: $.data.id, rd1_v: $.data.version }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-17", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd2: $.data.id, rd2_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 2, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd1}", expected_route_day_version: "${rd1_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days/${rd1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /curbside/pickup-requests/${req_id}/refuse"
              payload: { refusal_reason_code: "IMPROPER_PREPARATION" }
              as: Driver
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd2}", expected_route_day_version: "${rd2_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { st: $.data.status }
          assert:
            - "PickupRequest.${req_id}.status == SCHEDULED (cycle completed REFUSED -> SCHEDULED)"
            - "HouseholdAllowance(2026).items_consumed == 2 (re-schedule consumed zero additional slots)"
            - "HouseholdAllowance(2026).items_released == 0 (refusal never released allowance)"
            - "RouteDay.${rd1}.committed_load_units == 0 and RouteDay.${rd2}.committed_load_units == 4"
            - "Notification kind=REFUSAL_NOTICE exists with reason_code == IMPROPER_PREPARATION"
      - name: household_suspension_reinstatement_cycle
        grounds:
          - state_machines.Household.ACTIVE_to_SUSPENDED
          - state_machines.Household.SUSPENDED_to_ACTIVE
          - state_machines.DumpingReport.OPEN_to_DETERMINED_ILLEGAL
        distinguishing_aspect: |
          Cyclic machine on Household (different entity from PickupRequest):
          ACTIVE -> SUSPENDED -> ACTIVE loops, and the loop-back edge is gated by
          a cross-entity fiscal condition (all linked ILLEGAL_DUMPING_FINE
          assessments SETTLED/WAIVED) evaluated at reinstate time.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_EAST ACTIVE"
            - "DumpingReport filed against H with no linked request"
            - "Inspector determines ILLEGAL_DUMPING -> fine 25000 created, H SUSPENDED"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "44 Maple Dr", service_zone: "ZONE_EAST", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/dumping-reports"
              payload: { household_id: "${hh_id}" }
              as: Inspector
              captures: { dr_id: $.data.id }
            - call: "POST /curbside/dumping-reports/${dr_id}/determine"
              payload: { determination: "ILLEGAL_DUMPING", determination_notes: "no scheduled pickup on file" }
              as: Inspector
          trigger:
            - call: "GET /curbside/households/${hh_id}/fee-assessments"
              as: Inspector
              captures: { fine_id: $.data.0.id }
            - call: "POST /curbside/fee-assessments/${fine_id}/waive"
              payload: {}
              as: Dispatcher
            - call: "POST /curbside/households/${hh_id}/reinstate"
              payload: {}
              as: Inspector
              captures: { hh_status: $.data.status }
          assert:
            - "FeeAssessment ILLEGAL_DUMPING_FINE amount_cents == 25000 with pickup_request_id == null and household_id == ${hh_id}"
            - "Household.${hh_id}.status == SUSPENDED between determination and reinstatement (cycle edge observed)"
            - "Household.${hh_id}.status == ACTIVE after reinstate"
            - "Household.${hh_id}.suspension_reason == null after reinstate"

  # =======================================================================
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # =======================================================================
  - rule_id: transitive_cascade
    instances:
      - name: illegal_dumping_cascade_depth3
        grounds:
          - state_machines.DumpingReport.OPEN_to_DETERMINED_ILLEGAL
          - state_machines.Household.ACTIVE_to_SUSPENDED
          - calculations.illegal_dumping_fine
        distinguishing_aspect: |
          Depth-3 cascade from the determine trigger: determine(ILLEGAL) mutates
          DumpingReport; that mutation creates FeeAssessment(ILLEGAL_DUMPING_FINE)
          whose amount depends on prior-illegal count (25000 for first offense);
          the same determination then flips Household to SUSPENDED, and the
          suspension itself (a downstream state change caused by the previous
          link) gates a subsequent schedule attempt with ERR_HOUSEHOLD_SUSPENDED.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_NORTH ACTIVE, allowance 4"
            - "RouteDay R ZONE_NORTH 2026-08-10 OPEN cap 40/25"
            - "H has a SUBMITTED request with 1 STANDARD_FURNITURE item (not yet scheduled)"
            - "DumpingReport against H (no linked request)"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "5 Walnut Way", service_zone: "ZONE_NORTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/dumping-reports"
              payload: { household_id: "${hh_id}" }
              as: Inspector
              captures: { dr_id: $.data.id }
          trigger:
            - call: "POST /curbside/dumping-reports/${dr_id}/determine"
              payload: { determination: "ILLEGAL_DUMPING", determination_notes: "unclaimed set-out" }
              as: Inspector
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "DumpingReport.${dr_id}.status == DETERMINED_ILLEGAL"
            - "FeeAssessment kind=ILLEGAL_DUMPING_FINE exists with amount_cents == 25000 (2 ** 0 priors) and household_id == ${hh_id}"
            - "Household.${hh_id}.status == SUSPENDED with suspension_reason == ILLEGAL_DUMPING"
            - "schedule attempt after the cascade fails with error_id == ERR_HOUSEHOLD_SUSPENDED (suspension gates the next transition)"
      - name: completion_cascade_depth2
        grounds:
          - state_machines.PickupRequest.SCHEDULED_to_COMPLETED
          - state_machines.FeeAssessment.PENDING_to_WAIVED
          - calculations.disposition_routing
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (complete, not determine):
          complete -> creates FINAL_INVOICE assessment; the same transition's
          supersession itself waives the PENDING PROVISIONAL_QUOTE assessment
          (a mutation on FeeAssessment caused by the invoice creation, not by the
          original call), and each PickupItem gains a disposition_route.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_SOUTH allowance 4, fresh"
            - "RouteDay R ZONE_SOUTH 2026-08-10 OPEN cap 40/25"
            - "Request with item1 MATTRESS and item2 APPLIANCE_NO_REFRIGERANT, submitted and scheduled (both within allowance -> provisional_total_cents == round-based fees: mattress 1200+surcharge 102 = 1302; appliance 0 -> total 1302)"
            - "Route dispatched day-of"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "21 Spruce St", service_zone: "ZONE_SOUTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_SOUTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "MATTRESS", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 2, category: "APPLIANCE_NO_REFRIGERANT", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/complete"
              payload: {}
              as: Driver
            - call: "GET /curbside/pickup-requests/${req_id}/fee-assessments"
              as: Inspector
              captures: { quote_status: $.data.0.status }
            - call: "GET /curbside/pickup-requests/${req_id}/items"
              as: Inspector
              captures: { it1_route: $.data.0.disposition_route, it2_route: $.data.1.disposition_route }
          assert:
            - "FeeAssessment kind=FINAL_INVOICE amount_cents == 1302 status == PENDING"
            - "FeeAssessment kind=PROVISIONAL_QUOTE status == WAIVED (supersession cascade)"
            - "PickupItem sequence_no=1 disposition_route == MATTRESS_RECYCLING"
            - "PickupItem sequence_no=2 disposition_route == METAL_RECYCLING"
            - "PickupRequest.${req_id}.status == COMPLETED"

  # =======================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_submit
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PROHIBITED_ITEM]
        distinguishing_aspect: |
          Category pair state vs business_safety: the request is DRAFT and holds
          a PROHIBITED item, then the resident calls schedule — schedule is not a
          valid trigger from DRAFT (state, priority 4) while the prohibited item
          would also trip business_safety (priority 6) had the request been
          submittable; the dual-failure must surface ERR_INVALID_STATE, never
          ERR_PROHIBITED_ITEM.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_NORTH ACTIVE"
            - "DRAFT request containing one PROHIBITED item (item-add is allowed in DRAFT; the prohibition only bars submit)"
            - "RouteDay R ZONE_NORTH 2026-08-10 OPEN with capacity available"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "8 Ash Blvd", service_zone: "ZONE_NORTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "PROHIBITED", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state, priority 4) and NOT ERR_PROHIBITED_ITEM (business_safety, priority 6)"
            - "PickupRequest.${req_id}.status == DRAFT (unchanged)"
      - name: business_temporal_vs_business_fiscal_on_schedule
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_TEMPORAL_CONFLICT]
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal (different pair from
          state-vs-safety): scheduling into a past route_date that is ALSO
          capacity-exhausted violates both priority-9 (temporal) and priority-11
          (fiscal) — temporal wins, so the error is ERR_TEMPORAL_CONFLICT, not
          ERR_ROUTE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_EAST ACTIVE, allowance 4"
            - "RouteDay R ZONE_EAST route_date 2026-08-03 (in the past relative to clock), max_load_units=2, max_stops=1, OPEN"
            - "Request with one STANDARD_FURNITURE item (load 2), SUBMITTED; route already holds a SCHEDULED 2-unit stop from another household so committed_load_units == 2 == max"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "30 Poplar Pl", service_zone: "ZONE_EAST", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_other: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_EAST", route_date: "2026-08-03", max_load_units: 2, max_stops: 1 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_other}" }
              as: Resident
              as_user_id: "${hh_other}"
              captures: { req_other: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_other}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_other}"
            - call: "POST /curbside/pickup-requests/${req_other}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_other}"
            - call: "POST /curbside/pickup-requests/${req_other}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_other}"
            - call: "POST /curbside/households"
              payload: { street_address: "32 Poplar Pl", service_zone: "ZONE_EAST", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { rd_v2: $.data.version }
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v2}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TEMPORAL_CONFLICT (business_temporal, priority 9) and NOT ERR_ROUTE_CAPACITY_EXCEEDED (business_fiscal, priority 11)"
            - "RouteDay.${rd_id}.committed_stops == 1 (unchanged)"

  # =======================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: route_capacity_equality_boundary
        grounds:
          - validations[priority=11]
          - calculations.request_load_units
        distinguishing_aspect: |
          Numeric threshold metric: committed_load_units + new load <= max is an
          INCLUSIVE boundary — filling a route to exactly max_load_units succeeds
          while one unit over fails; reachable only through the schedule endpoint.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Households H1, H2 ZONE_WEST, allowance 4"
            - "RouteDay R ZONE_WEST 2026-08-10, max_load_units=5, max_stops=10, OPEN"
            - "H1 request with one APPLIANCE_WITH_REFRIGERANT item (load 5) scheduled -> committed_load_units == 5 == max"
            - "H2 request with one TIRES item (load 1) SUBMITTED"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "1 Hickory Hts", service_zone: "ZONE_WEST", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh1: $.data.id }
            - call: "POST /curbside/households"
              payload: { street_address: "2 Hickory Hts", service_zone: "ZONE_WEST", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh2: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_WEST", route_date: "2026-08-10", max_load_units: 5, max_stops: 10 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh1}" }
              as: Resident
              as_user_id: "${hh1}"
              captures: { req1: $.data.id }
            - call: "POST /curbside/pickup-requests/${req1}/items"
              payload: { sequence_no: 1, category: "APPLIANCE_WITH_REFRIGERANT", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh1}"
            - call: "POST /curbside/pickup-requests/${req1}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh1}"
            - call: "POST /curbside/pickup-requests/${req1}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh1}"
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh2}" }
              as: Resident
              as_user_id: "${hh2}"
              captures: { req2: $.data.id }
            - call: "POST /curbside/pickup-requests/${req2}/items"
              payload: { sequence_no: 1, category: "TIRES", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh2}"
            - call: "POST /curbside/pickup-requests/${req2}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh2}"
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { rd_v2: $.data.version }
          trigger:
            - call: "POST /curbside/pickup-requests/${req2}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v2}" }
              as: Resident
              as_user_id: "${hh2}"
              captures: { err: $.data.error_id }
          assert:
            - "First schedule SUCCEEDED with committed_load_units == 5 == max_load_units (equality admitted)"
            - "Second schedule fails with error_id == ERR_ROUTE_CAPACITY_EXCEEDED (5 + 1 > 5)"
      - name: allowance_zero_remaining_boundary
        grounds:
          - calculations.allowance_ledger
          - validations[priority=11]
        distinguishing_aspect: |
          Different metric (allowance item count, not route load units) reached
          through a different surface (item scheduling repricing, observed on the
          pickup-requests GET): the item that moves items_consumed from
          allowance-1 to allowance is free (remaining >= 1 admits), and the very
          next item on the same request is fee-bearing at 2500+surcharge.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_NORTH annual_allowance_items=1, items_consumed=0"
            - "RouteDay R ZONE_NORTH 2026-08-10 OPEN cap 40/25"
            - "Request with item1 STANDARD_FURNITURE and item2 STANDARD_FURNITURE, submitted"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "15 Juniper Way", service_zone: "ZONE_NORTH", annual_allowance_items: 1 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 2, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "GET /curbside/pickup-requests/${req_id}/items"
              as: Resident
              as_user_id: "${hh_id}"
              captures: { it1_free: $.data.0.within_allowance, it2_free: $.data.1.within_allowance, it2_fee: $.data.1.item_fee_cents }
          assert:
            - "PickupItem sequence_no=1 within_allowance == true and item_fee_cents == 0 (the boundary item taking consumption to exactly the allowance is free)"
            - "PickupItem sequence_no=2 within_allowance == false and item_fee_cents == 2713 (2500 + round_half_up(2500*0.085)=213)"
            - "HouseholdAllowance(2026).items_consumed == 1 and over_allowance_items == 1"

  # =======================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =======================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: completion_gated_by_routeday_dispatched
        grounds:
          - state_machines.PickupRequest.SCHEDULED_to_COMPLETED
          - state_machines.RouteDay.OPEN_to_DISPATCHED
        distinguishing_aspect: |
          Pair PickupRequest -> RouteDay: a request cannot complete while its
          RouteDay is still OPEN — the valid transition set of the request depends
          on the parent route's state, not on anything in the request row.
        test_recipe:
          setup:
            - "Clock 2026-08-10 (route day); Household H ZONE_SOUTH; request scheduled on RouteDay R ZONE_SOUTH 2026-08-10 which is still OPEN (not dispatched)"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "61 Alder Aly", service_zone: "ZONE_SOUTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_SOUTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/complete"
              payload: {}
              as: Driver
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (RouteDay.status == OPEN blocks completion even though request is SCHEDULED and clock is day-of)"
            - "PickupRequest.${req_id}.status == SCHEDULED"
      - name: schedule_gated_by_household_active
        grounds:
          - state_machines.Household.ACTIVE_to_SUSPENDED
          - validations[priority=7]
          - errors[ERR_HOUSEHOLD_SUSPENDED]
        distinguishing_aspect: |
          Pair PickupRequest -> Household (different pair from
          PickupRequest->RouteDay): schedule is blocked because the OWNING
          household flipped to SUSPENDED after the request was submitted — a
          cross-aggregate gate the request row itself cannot observe.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_EAST; request SUBMITTED with 1 item"
            - "DumpingReport against H determined ILLEGAL -> H SUSPENDED"
            - "RouteDay R ZONE_EAST 2026-08-10 OPEN"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "77 Sycamore St", service_zone: "ZONE_EAST", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_EAST", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "ELECTRONICS", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/dumping-reports"
              payload: { household_id: "${hh_id}" }
              as: Inspector
              captures: { dr_id: $.data.id }
            - call: "POST /curbside/dumping-reports/${dr_id}/determine"
              payload: { determination: "ILLEGAL_DUMPING" }
              as: Inspector
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_HOUSEHOLD_SUSPENDED"
            - "PickupRequest.${req_id}.status == SUBMITTED (unchanged)"
            - "RouteDay.${rd_id}.committed_stops == 0"

  # =======================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =======================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: amnesty_window_half_open_overlap
        grounds:
          - validations[priority=9]
          - entities.AmnestyWindow.fields.starts_at
        distinguishing_aspect: |
          Half-open interval semantics on the AmnestyWindow resource: a new window
          [2026-09-14, 2026-09-20) touching an existing [2026-09-07, 2026-09-14)
          at the endpoint is ALLOWED (adjacency is not intersection), while one
          starting one hour earlier intersects and is rejected.
        test_recipe:
          setup:
            - "Clock 2026-08-05; ACTIVE window W1 [2026-09-07T00:00:00Z, 2026-09-14T00:00:00Z)"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/amnesty-windows"
              payload: { label: "Fall week 1", starts_at: "2026-09-07T00:00:00Z", ends_at: "2026-09-14T00:00:00Z" }
              as: Dispatcher
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /curbside/amnesty-windows"
              payload: { label: "Fall week 2 touching", starts_at: "2026-09-14T00:00:00Z", ends_at: "2026-09-21T00:00:00Z" }
              as: Dispatcher
              captures: { w2: $.data.id }
            - call: "POST /curbside/amnesty-windows"
              payload: { label: "Overlapping", starts_at: "2026-09-13T23:00:00Z", ends_at: "2026-09-22T00:00:00Z" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Touching window W2 created successfully (201) — half-open adjacency allowed"
            - "Overlapping window fails with error_id == ERR_TEMPORAL_CONFLICT"
      - name: same_household_same_date_point_equality
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_PICKUP_DATE]
        distinguishing_aspect: |
          Different semantics on a different resource: household-date booking uses
          POINT-EQUALITY on the calendar date (not half-open interval
          intersection) — a second SCHEDULED request on the same route_date is
          rejected even though adjacent dates are fine, and a MISSED request (not
          SCHEDULED) does not block rebooking the same date.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_NORTH allowance 10"
            - "RouteDays R1 and R2 both ZONE_NORTH 2026-08-10, OPEN, cap 40/25"
            - "Request A scheduled on R1; Request B (SUBMITTED, 1 item) attempts R2 same date"
            - "RouteDay R3 ZONE_NORTH 2026-08-11 OPEN (adjacent date control)"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "90 Chestnut Cir", service_zone: "ZONE_NORTH", annual_allowance_items: 10 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd1: $.data.id, rd1_v: $.data.version }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd2: $.data.id, rd2_v: $.data.version }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-11", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd3: $.data.id, rd3_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_a: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_a}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_a}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_a}/schedule"
              payload: { route_day_id: "${rd1}", expected_route_day_version: "${rd1_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_b: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_b}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_b}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
          trigger:
            - call: "POST /curbside/pickup-requests/${req_b}/schedule"
              payload: { route_day_id: "${rd2}", expected_route_day_version: "${rd2_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { err: $.data.error_id }
            - call: "POST /curbside/pickup-requests/${req_b}/schedule"
              payload: { route_day_id: "${rd3}", expected_route_day_version: "${rd3_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { st: $.data.status }
          assert:
            - "Same-date schedule to R2 fails with error_id == ERR_DUPLICATE_PICKUP_DATE"
            - "Adjacent-date schedule to R3 (2026-08-11) succeeds with status == SCHEDULED"

  # =======================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =======================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allowance_conservation_under_cancel
        grounds:
          - calculations.allowance_ledger
          - state_machines.PickupRequest.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: household-year allowance ledger. Invariant:
          items_consumed(after cancel) == items_consumed(before schedule) for the
          within-allowance portion, and items_consumed + items_released grows by
          exactly the released count — forward schedule and compensating cancel
          leave the free-pool arithmetic exactly reversible.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_WEST allowance 4, ledger 2026 at zeros"
            - "RouteDay R ZONE_WEST 2026-08-10 OPEN cap 40/25"
            - "Request with 3 STANDARD_FURNITURE items, submitted, scheduled (items_consumed == 3)"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "12 Redwood Rd", service_zone: "ZONE_WEST", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_WEST", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 2, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 3, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_v: $.data.version }
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/cancel"
              payload: { expected_request_version: "${req_v}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "GET /curbside/households/${hh_id}/allowances"
              as: Inspector
              captures: { consumed: $.data.0.items_consumed, released: $.data.0.items_released }
          assert:
            - "HouseholdAllowance(2026).items_consumed == 0 (exactly reversed)"
            - "HouseholdAllowance(2026).items_released == 3 (audit counter grew by exactly the released count)"
            - "invariant items_consumed + items_released == 3 == items that had consumed slots"
            - "every PickupItem of ${req_id} has within_allowance == false after release"
      - name: route_capacity_conservation_under_refusal
        grounds:
          - state_machines.PickupRequest.SCHEDULED_to_REFUSED
          - entities.RouteDay.fields.committed_load_units
        distinguishing_aspect: |
          Different conserved quantity (route load units, not allowance items) and
          different compensating pair (schedule vs refuse, not schedule vs cancel):
          committed_load_units after refusal == committed_load_units before
          scheduling, even though the allowance ledger deliberately does NOT
          reverse — proving the two invariants are independent.
        test_recipe:
          setup:
            - "Clock 2026-08-05; Household H ZONE_NORTH allowance 4"
            - "RouteDay R ZONE_NORTH 2026-08-10 max_load_units=40 max_stops=25; one OTHER household request already scheduled (committed_load_units == 5 via one APPLIANCE_WITH_REFRIGERANT item)"
            - "H request with 2 STANDARD_FURNITURE items (load 4) scheduled -> committed_load_units == 9"
          setup_api_calls:
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/households"
              payload: { street_address: "3 Magnolia Mews", service_zone: "ZONE_NORTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_other: $.data.id }
            - call: "POST /curbside/households"
              payload: { street_address: "4 Magnolia Mews", service_zone: "ZONE_NORTH", annual_allowance_items: 4 }
              as: Dispatcher
              captures: { hh_id: $.data.id }
            - call: "POST /curbside/route-days"
              payload: { service_zone: "ZONE_NORTH", route_date: "2026-08-10", max_load_units: 40, max_stops: 25 }
              as: Dispatcher
              captures: { rd_id: $.data.id, rd_v: $.data.version }
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_other}" }
              as: Resident
              as_user_id: "${hh_other}"
              captures: { req_o: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_o}/items"
              payload: { sequence_no: 1, category: "APPLIANCE_WITH_REFRIGERANT", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_other}"
            - call: "POST /curbside/pickup-requests/${req_o}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_other}"
            - call: "POST /curbside/pickup-requests/${req_o}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v}" }
              as: Resident
              as_user_id: "${hh_other}"
            - call: "POST /curbside/pickup-requests"
              payload: { household_id: "${hh_id}" }
              as: Resident
              as_user_id: "${hh_id}"
              captures: { req_id: $.data.id }
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 1, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/items"
              payload: { sequence_no: 2, category: "STANDARD_FURNITURE", is_oversize: false, preparation_ack: true }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/pickup-requests/${req_id}/submit"
              payload: {}
              as: Resident
              as_user_id: "${hh_id}"
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { rd_v2: $.data.version }
            - call: "POST /curbside/pickup-requests/${req_id}/schedule"
              payload: { route_day_id: "${rd_id}", expected_route_day_version: "${rd_v2}" }
              as: Resident
              as_user_id: "${hh_id}"
            - call: "POST /curbside/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T07:00:00Z" }
              as: Dispatcher
            - call: "POST /curbside/route-days/${rd_id}/dispatch"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /curbside/pickup-requests/${req_id}/refuse"
              payload: { refusal_reason_code: "BLOCKED_ACCESS" }
              as: Driver
            - call: "GET /curbside/route-days/${rd_id}"
              as: Dispatcher
              captures: { load_after: $.data.committed_load_units }
            - call: "GET /curbside/households/${hh_id}/allowances"
              as: Inspector
              captures: { consumed_after: $.data.0.items_consumed }
          assert:
            - "RouteDay.${rd_id}.committed_load_units == 5 (exactly restored to pre-schedule value)"
            - "RouteDay.${rd_id}.committed_stops == 1"
            - "HouseholdAllowance(2026) for ${hh_id}.items_consumed == 2 (allowance NOT released by refusal — the two invariants are independent)"
