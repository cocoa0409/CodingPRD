        distinguishing_aspect: "The conflicting pair is business_referential (priority 10, ERR_BACKED_OUT_REFERENCE) against existence (priority 3/4): a reinstate request naming both a nonexistent route and a contractor whose route was already terminated by a market withdrawal must surface the referential error first, because the backed-out check runs ahead of the not-found check for the dependent resource."
