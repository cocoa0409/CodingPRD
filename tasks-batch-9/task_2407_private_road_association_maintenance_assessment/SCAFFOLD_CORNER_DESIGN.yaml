              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { seg_id: $.data.id }
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "GRADING", window_start_date: "2026-08-05", window_end_date: "2026-08-08" }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { proj_a: $.data.id, proj_a_v: $.data.version }
            - call: "POST /maintenance-projects/${proj_a}/contractor-bids"
              payload: { contractor_name: "Basin Grading LLC", amount_cents: 1000000, bond_on_file: true, expected_project_version: "${proj_a_v}" }
              as: Contractor
              as_user_id: "c-1"
              captures: { bid_low: $.data.id }
            - call: "GET /maintenance-projects/${proj_a}"
              payload: {}
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { proj_a_v2: $.data.version }
            - call: "POST /maintenance-projects/${proj_a}/contractor-bids"
              payload: { contractor_name: "Highline Roadworks", amount_cents: 1200000, bond_on_file: true, expected_project_version: "${proj_a_v2}" }
              as: Contractor
              as_user_id: "c-2"
              captures: { bid_mid: $.data.id }
          trigger:
            - call: "POST /maintenance-projects/${proj_a}/award"
              payload: { bid_id: "${bid_low}" }
              as: RoadCommissioner
              as_user_id: "rc-2"
              captures: { err_insufficient: $.data.error_id }
            - call: "GET /maintenance-projects/${proj_a}"
              payload: {}
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { proj_a_v3: $.data.version }
            - call: "POST /maintenance-projects/${proj_a}/contractor-bids"
              payload: { contractor_name: "Cascade Earthworks", amount_cents: 1500000, bond_on_file: true, expected_project_version: "${proj_a_v3}" }
              as: Contractor
              as_user_id: "c-3"
              captures: { bid_high: $.data.id }
            - call: "POST /maintenance-projects/${proj_a}/award"
              payload: { bid_id: "${bid_low}" }
              as: RoadCommissioner
              as_user_id: "rc-2"
            - call: "POST /maintenance-projects"
              payload: { road_segment_id: "${seg_id}", category: "GRADING", window_start_date: "2026-08-20", window_end_date: "2026-08-23" }
              as: RoadCommissioner
              as_user_id: "rc-1"
              captures: { proj_b: $.data.id, proj_b_v: $.data.version }
            - call: "POST /maintenance-projects/${proj_b}/contractor-bids"
              payload: { contractor_name: "Basin Grading LLC", amount_cents: 999999, bond_on_file: true, expected_project_version: "${proj_b_v}" }
              as: Contractor
              as_user_id: "c-1"
              captures: { bid_b: $.data.id }
            - call: "POST /maintenance-projects/${proj_b}/award"
              payload: { bid_id: "${bid_b}" }
              as: RoadCommissioner
              as_user_id: "rc-2"
          assert:
            - "the first award of the 1,000,000-cent bid returns HTTP 409 with error_id ERR_INSUFFICIENT_BIDS while only two responsive bids exist, and project A stays BID_SOLICITATION with awarded_bid_id null"
            - "after the third bonded bid is added the identical award returns HTTP 200 with status AWARDED, awarded_amount_cents 1000000 and reserve_draw_cents 0"
            - "bid_low reads AWARDED while bid_mid and bid_high both read REJECTED"
            - "project B's award of the 999,999-cent bid returns HTTP 200 with status AWARDED even though it is the only responsive bid, because 999999 < 1000000"
            - "the association still reads reserve_balance_cents 0: GRADING awards draw nothing, so the ERR_INSUFFICIENT_RESERVE gate is satisfied at a zero draw"

