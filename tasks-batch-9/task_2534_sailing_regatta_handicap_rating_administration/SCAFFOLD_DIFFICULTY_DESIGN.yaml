  # =========================================================================
  # RULE 6 of 9 -- boundary_precision_check (3 instances)
  # Metric 1: draft_m at DEEP_DRAFT_THRESHOLD_M, strict > , endpoint POST /rating-certificates.
  # Metric 2: completed-race COUNT at the ONE_PER_FIVE discard trigger, an integer
  #           set-size edge, endpoint GET /entries/{id}/series-standing.
  # Metric 3: band_key_spm exactly equal to rating_band_high, an exclusive upper
  #           endpoint, endpoint POST /entries/{id}/assign-division.
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: deep_draft_penalty_strict_greater_than_2_20
        boundary: "draft_m against DEEP_DRAFT_THRESHOLD_M 2.20 with a STRICT greater-than; 2.20 itself is clean, 2.21 is penalised"
        grounds:
          - calculations.certificate_rating_value
          - calculations.certificate_rating_value.constants.DEEP_DRAFT_THRESHOLD_M
          - calculations.certificate_rating_value.constants.DEEP_DRAFT_PENALTY
          - entities.RatingCertificate.fields.raw_speed_index
          - endpoints.POST_rating_certificates
        distinguishing_aspect: |
          A continuous numeric threshold on a measured input, read through the certificate-minting
          endpoint. Three boats carry identical sail area, hull length, displacement and type and differ
          ONLY in draft: 2.19, 2.20 and 2.21 metres. The comparison is strict, so 2.19 and 2.20 both
          produce raw_speed_index 0.5945 and rating 194.1, while 2.21 crosses into the 3 percent penalty
          and produces 0.5767 and rating 200.9 -- a 6.8 spm cliff for a 1 cm difference. An
          implementation coded with >= at the threshold gives boat P2 rating 200.9 instead of 194.1.
        test_recipe:
          setup:
            - "One licensed measurer and three owners, each owning one MONOHULL."
            - "No regatta, no division and no entry are needed: the boundary is entirely inside the minting formula."
          setup_api_calls:
            - { call: "POST /regatta-ops/club-members", payload: { full_name: "Mara Vance", email: "mara.vance@yc.test", measurer_license_id: "M-101" }, as: ClubAdmin, as_user_id: "ops-desk-1", captures: { m_mea: $.data.id } }
