# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3023_convenience_store_franchise_gross_profit_split_store
#
# Breadth probe. Every testable claim the §1.1-§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: franchisee_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.Franchisee
          - endpoints.POST_/franchise/franchisees
        distinguishing_aspect: "A franchisee created with four input fields comes back 201 with status ACTIVE, version 1, a non-null server-minted UUID id, and derived draw_outstanding_cents 0, open_shrink_charge_cents 0 and audit_adjusted_net_worth_cents equal to the stated figure — status and the derived fields are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Anchor Point Retail LLC", owner_name: "Priya Deshmukh", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { fr_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Franchisee.${fr_id}.legal_name == \"Anchor Point Retail LLC\" and owner_name == \"Priya Deshmukh\""
            - "Franchisee.${fr_id}.status == ACTIVE and Franchisee.${fr_id}.risk_band == A"
            - "Franchisee.${fr_id}.version == 1"
            - "Franchisee.${fr_id}.draw_outstanding_cents == 0 and Franchisee.${fr_id}.open_shrink_charge_cents == 0"
            - "Franchisee.${fr_id}.audit_adjusted_net_worth_cents == 30000000"
            - "the id is a canonical UUID with no type prefix and created_at / updated_at are both stamped"

      - name: store_get_returns_lease_and_equipment_ownership_as_franchisor_held
        claim_type: Retrieval
        grounds:
          - entities.Store
          - entities.Store.fields.lease_owner
          - entities.Store.fields.equipment_owner
          - endpoints.GET_/franchise/stores/{id}
        distinguishing_aspect: "Store.lease_owner and Store.equipment_owner are system fields with the single enum member FRANCHISOR, so a GET round-trips both as FRANCHISOR regardless of the request body — the franchisor-held lease and equipment that drive the exit-rights precondition."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One franchisee and one store opened in URBAN format."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harbor Line LLC", owner_name: "Ken Adeyemi", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frA_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frA_id}", store_number: "TX-1001", state_code: "TX", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stA_id: $.data.id }
          trigger:
            - call: "GET /franchise/stores/${stA_id}"
              payload: {}
              as: FranchisorAdmin
          assert:
            - "the response status is 200 and Store.${stA_id}.lease_owner == FRANCHISOR and equipment_owner == FRANCHISOR"
            - "Store.${stA_id}.status == ACTIVE and Store.${stA_id}.transfer_status == NONE"
            - "Store.${stA_id}.store_number == \"TX-1001\" and state_code == \"TX\" and format == URBAN"
            - "Store.${stA_id}.franchisee_id == ${frA_id}"
            - "Store.${stA_id}.monthly_rent_cents is non-null and derived from the URBAN format band, not supplied"

      - name: settlements_list_filters_by_franchisee_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/franchise/settlements
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three settlements on file and a franchisee_id filter matching two of them, limit=1&offset=0 returns 1 row with total_count 2 and has_more true, while offset=1 returns the second with has_more false — total_count counts the whole filtered set, not the returned page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two franchisees, two ACTIVE stores and two ACTIVE agreements, so that franchisee FR1 owns two settlements and franchisee FR2 owns one."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Northgate Operator LLC", owner_name: "Ivy Sandoval", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frB_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Southgate Operator LLC", owner_name: "Theo Marsh", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frC_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frB_id}", store_number: "TX-2001", state_code: "TX", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stB_id: $.data.id, stB_v: $.data.version }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frC_id}", store_number: "TX-2002", state_code: "TX", format: "RURAL", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stC_id: $.data.id, stC_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frB_id}", store_id: "${stB_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agB_id: $.data.id }
            - call: "POST /franchise/agreements/${agB_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frC_id}", store_id: "${stC_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agC_id: $.data.id }
            - call: "POST /franchise/agreements/${agC_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stB_id}", franchisee_id: "${frB_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stB_v}" }
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stB_id}", franchisee_id: "${frB_id}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-15T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stB_v}" }
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stC_id}", franchisee_id: "${frC_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stC_v}" }
              as: FranchisorAdmin
          trigger:
            - call: "GET /franchise/settlements"
              payload: { franchisee_id: "${frB_id}", limit: 1, offset: 0 }
              as: FranchisorAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "the response returns exactly 1 row with total_count == 2 and has_more == true"
            - "GET /franchise/settlements?franchisee_id=${frB_id}&limit=1&offset=1 returns exactly 1 row with total_count == 2 and has_more == false"
            - "GET /franchise/settlements returns 3 rows with limit defaulting to 10 and offset to 0"
            - "GET /franchise/settlements?status=OPEN returns 3 rows"

      - name: store_get_with_an_unknown_id_returns_store_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/franchise/stores/{id}
          - errors[ERR_STORE_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on a path segment produces the entity-specific 404 ERR_RESOURCE_NOT_FOUND from the path-id rule at priority 5, not a 400 and not a 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No store has been created."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
          trigger:
            - call: "GET /franchise/stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FranchisorAdmin
              captures: { err_store: $.data.error_id }
          assert:
            - "the response status is 404 and err_store == ERR_RESOURCE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: settlement_create_missing_trailing_average_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Settlement.fields.trailing_avg_gross_profit_cents
          - validations[priority=36]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST_/franchise/settlements
        distinguishing_aspect: "trailing_avg_gross_profit_cents is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the required-field check rather than a settlement created with a zero trailing average that would silently collapse the provisional variant."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One franchisee, one ACTIVE store and one ACTIVE agreement."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Ridgetop Retail LLC", owner_name: "Gia Moreau", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frD_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frD_id}", store_number: "TX-3001", state_code: "TX", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stD_id: $.data.id, stD_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frD_id}", store_id: "${stD_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agD_id: $.data.id }
            - call: "POST /franchise/agreements/${agD_id}/activate"
              payload: {}
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stD_id}", franchisee_id: "${frD_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", expected_store_version: "${stD_v}" }
              as: FranchisorAdmin
              captures: { err_req: $.data.error_id }
          assert:
            - "the response status is 400 and err_req == ERR_INVALID_REQUEST"
            - "GET /franchise/settlements?store_id=${stD_id} returns 0 rows"
            - "Store.${stD_id}.version is unchanged from the value observed before the rejected call"

      - name: franchisee_create_omitting_entity_type_defaults_it_to_llc
        claim_type: Defaults
        grounds:
          - entities.Franchisee.fields.entity_type
          - validations[priority=36]
          - endpoints.POST_/franchise/franchisees
        distinguishing_aspect: "entity_type is an enum declaring a default of LLC, so omitting it stores LLC rather than null and rather than INDIVIDUAL, and the row is otherwise indistinguishable from an explicit LLC registration."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Plainview Operator LLC", owner_name: "Bo Carmichael", stated_net_worth_cents: 8000000 }
              as: FranchisorAdmin
              captures: { frE_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Franchisee.${frE_id}.entity_type == LLC"
            - "Franchisee.${frE_id}.entity_type != INDIVIDUAL"
            - "Franchisee.${frE_id}.risk_band == B because 8000000 is >= 5000000 and < 15000000"
            - "GET /franchise/franchisees?entity_type=LLC returns exactly 1 row"

      - name: settlement_create_computed_split_fields_are_ignored_input
        claim_type: Computed Fields
        grounds:
          - entities.Settlement.fields.franchisee_split_cents
          - entities.Settlement.fields.gross_profit_cents
          - entities.Settlement.fields.provisional
          - endpoints.POST_/franchise/settlements
        distinguishing_aspect: "A client that sends the computed split fields on create has them ignored: the settlement opens with provisional true, gross_profit_cents 0 and franchisee_split_cents 0, and only the reconcile calls write those fields."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One franchisee, one ACTIVE store and one ACTIVE agreement."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Bellwether Stores LLC", owner_name: "Ada Pruitt", entity_type: "LLC", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frF_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frF_id}", store_number: "TX-4001", state_code: "TX", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stF_id: $.data.id, stF_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frF_id}", store_id: "${stF_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agF_id: $.data.id }
            - call: "POST /franchise/agreements/${agF_id}/activate"
              payload: {}
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stF_id}", franchisee_id: "${frF_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-08T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stF_v}", gross_profit_cents: 99999999, franchisee_split_cents: 88888888 }
              as: FranchisorAdmin
              captures: { setF_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Settlement.${setF_id}.status == OPEN and Settlement.${setF_id}.provisional == true"
            - "Settlement.${setF_id}.gross_profit_cents == 0 and Settlement.${setF_id}.franchisee_split_cents == 0"
            - "Settlement.${setF_id}.gross_profit_cents != 99999999 and Settlement.${setF_id}.franchisee_split_cents != 88888888"
            - "Settlement.${setF_id}.version == 1"

      - name: store_create_duplicate_store_number_returns_store_number_duplicate
        claim_type: Type Constraints
        grounds:
          - entities.Store.fields.store_number
          - validations[priority=40]
          - errors[ERR_STORE_NUMBER_DUPLICATE]
          - endpoints.POST_/franchise/stores
        distinguishing_aspect: "store_number is unique across all stores, so a second store presented with an already-allocated number is rejected at priority 40 with ERR_STORE_NUMBER_DUPLICATE even when it names a different franchisee — uniqueness is global, not per-franchisee."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two franchisees and one store numbered TX-5001 under the first."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Kestrel Operator LLC", owner_name: "Nils Bergstrom", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frG_id: $.data.id }
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Peregrine Operator LLC", owner_name: "Alma Reyes", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frH_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frG_id}", store_number: "TX-5001", state_code: "TX", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stG_id: $.data.id }
          trigger:
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frH_id}", store_number: "TX-5001", state_code: "TX", format: "RURAL", opened_on: "2026-09-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { err_dup: $.data.error_id }
          assert:
            - "the response status is 409 and err_dup == ERR_STORE_NUMBER_DUPLICATE"
            - "GET /franchise/stores?franchisee_id=${frH_id} returns 0 rows"
            - "the duplicate was rejected even though the requesting franchisee is different from the incumbent"
            - "GET /franchise/stores returns exactly 1 row"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: settlement_finalize_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Settlement.OPEN_to_DRAW_PAID
          - state_machines.Settlement.DRAW_PAID_to_RECONCILED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /settlements/{id}/finalize drives only RECONCILED→FINALIZED, so calling it on an OPEN settlement is rejected by the priority-6 state rule with ERR_INVALID_STATE, not by the cooling-off rule — the state check precedes every fiscal and temporal rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-20T00:00:00Z, far past any cooling-off period. One franchisee, one ACTIVE store, one ACTIVE agreement and one OPEN settlement with a single revenue line."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Olentangy Retail LLC", owner_name: "Cass Whitmore", stated_net_worth_cents: 30000000 }
              as: FranchisorAdmin
              captures: { frI_id: $.data.id }
            - call: "POST /franchise/stores"
              payload: { franchisee_id: "${frI_id}", store_number: "OH-6001", state_code: "OH", format: "URBAN", opened_on: "2022-01-01T00:00:00Z", cold_chain_certified: true }
              as: FranchisorAdmin
              captures: { stI_id: $.data.id, stI_v: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { franchisee_id: "${frI_id}", store_id: "${stI_id}", split_pct: 0.50, waste_share_pct: 0.50, shrink_responsibility_pct: 0.50, rebate_pass_pct: 1.0, minimum_net_worth_cents: 10000000, term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", renewal_window_days: 90 }
              as: FranchisorAdmin
              captures: { agI_id: $.data.id }
            - call: "POST /franchise/agreements/${agI_id}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise/settlements"
              payload: { store_id: "${stI_id}", franchisee_id: "${frI_id}", period_start: "2026-09-08T00:00:00Z", period_end: "2026-09-15T00:00:00Z", trailing_avg_gross_profit_cents: 1000000, expected_store_version: "${stI_v}" }
              as: FranchisorAdmin
              captures: { setI_id: $.data.id, setI_v1: $.data.version }
            - call: "POST /franchise/settlements/${setI_id}/revenue-lines"
              payload: { category: "MERCHANDISE", gross_sales_cents: 3000000, cost_of_goods_cents: 2000000, expected_settlement_version: "${setI_v1}" }
              as: FranchisorAdmin
          trigger:
            - call: "POST /franchise/settlements/${setI_id}/finalize"
              payload: {}
              as: FranchisorAdmin
              captures: { err_state: $.data.error_id }
          assert:
            - "the response status is 409 and err_state == ERR_INVALID_STATE"
            - "Settlement.${setI_id}.status is still OPEN"
            - "the settlement was on the second step of its lifecycle, so the OPEN→FINALIZED system transition does not apply"
            - "no DrawAdvance was recovered — GET /franchise/draws?franchisee_id=${frI_id} returns 0 rows"

      - name: shrink_audit_finalize_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ShrinkAudit.SCHEDULED_to_COUNTED
          - state_machines.ShrinkAudit.COUNTED_to_FINALIZED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A second invalid-transition claim on a different entity and a different from-state: POST /shrink-audits/{id}/finalize on a SCHEDULED audit with no physical count is rejected 409 ERR_INVALID_STATE, because count and finalize are separate transitions and finalize reads a COUNTED row only."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-20T00:00:00Z, past the audit's period_end so only the state is wrong. One franchisee, one ACTIVE store, one ACTIVE agreement and one SCHEDULED shrink audit."
          setup_api_calls:
            - call: "POST /franchise/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: FranchisorAdmin
            - call: "POST /franchise/franchisees"
