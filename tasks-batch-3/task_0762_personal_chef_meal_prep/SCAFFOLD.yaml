# =============================================================================
# Personal-Chef Weekly Meal-Prep Service — seed tables (Expert)
# SCAFFOLD.yaml  §1.0–§1.7
# =============================================================================

scenario: |
  Personal-Chef Weekly Meal-Prep Service: client profile & dietary plan, weekly
  menu & grocery cost/markup, recurring in-home cook schedule, container/leftover
  & labeling, billing (per-week/per-meal), substitution & feedback, vacation/skip,
  kitchen/equipment

domain_name: personal-chef-meal-prep
api_prefix: "/"

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat            # peer entities linked by FK fields; no nesting in URL paths
  state_machine_shape: cyclic      # WeeklyMenu PROPOSED<->DRAFT revision loop; CookSession branches
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles           # Chef owns menus/meals/sessions; Client owns plan/approvals; PlatformAdmin operational
  consistency_model: immediate

  # informational counts
  entity_count: 8
  endpoint_count: 32   # 6 creates, 12 reads (single + filtered-list), 13 actions, 1 clock
  error_code_count: 29
  calculation_count: 6
  state_machine_count: 6

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true    # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Client display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: household_size, type: integer, source: input, description: "Number of people fed; drives PER_WEEK household surcharge", constraints: ">= 1" }
      - { name: billing_mode, type: enum, source: input, description: "PER_WEEK | PER_MEAL — pricing model snapshotted onto each menu at approval" }
      - { name: weekly_base_fee_cents, type: integer, source: input, description: "Flat weekly service fee in cents (PER_WEEK); also the credit granted when a week is skipped or a cook is a no-show", constraints: ">= 0" }
      - { name: per_meal_fee_cents, type: integer, source: input, description: "Flat service fee added per cooked meal in cents (PER_MEAL)", constraints: ">= 0" }
      - { name: weekly_grocery_budget_cents, type: integer, source: input, description: "Maximum allowed grocery_cost_cents for any of this client's menus at approval", constraints: ">= 0" }
      - { name: available_equipment, type: array, source: input, default: "[]", description: "Enum members from {OVEN, STOVETOP, BLENDER, GRILL, SOUS_VIDE} present in the client's kitchen" }
      - { name: kitchen_open_hour, type: integer, source: input, description: "Earliest UTC hour (0-23) a cook session may start in this kitchen", constraints: "0..23" }
      - { name: kitchen_close_hour, type: integer, source: input, description: "Latest UTC hour (0-23) a cook session may end in this kitchen", constraints: "0..24, > kitchen_open_hour" }
      - { name: wallet_credit_cents, type: integer, source: computed, default: 0, description: "Ledger: SUM(weekly_base_fee_cents granted by SKIPPED menus and NO_SHOW sessions) - SUM(credit_applied_cents on PAID invoices). Never negative." }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED" }

  - name: Chef
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Chef display name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Labor rate in cents per hour used for session payout", constraints: ">= 0" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of NO_SHOW sessions attributed to this chef; at STRIKE_LIMIT the chef auto-suspends" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: DietaryPlan
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the owning client" }
      - { name: restriction_tags, type: array, source: input, description: "Enum members from {VEGAN, VEGETARIAN, GLUTEN_FREE, KETO, PALEO, OMNIVORE}" }
      - { name: allergen_tags, type: array, source: input, description: "Enum members from {NUTS, DAIRY, SHELLFISH, EGGS, SOY, GLUTEN} the client must never be exposed to" }
      - { name: daily_calorie_target, type: integer, source: input, description: "Target kcal/day", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED — creating a newer plan for the same client supersedes the prior ACTIVE one" }

  - name: WeeklyMenu
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client this menu feeds" }
      - { name: dietary_plan_id, type: string, source: input, description: "FK -> DietaryPlan.id; the plan the menu is built against" }
      - { name: chef_id, type: string, source: input, description: "FK -> Chef.id; the chef who authored and owns the menu" }
      - { name: week_start_date, type: datetime, source: input, description: "ISO8601 UTC start instant of the service week; skip/resume are only allowed while the logical clock is strictly before this" }
      - { name: grocery_cost_cents, type: integer, source: computed, default: 0, description: "SUM over MenuMeals in {PLANNED, COOKED} of meal_grocery_cost_cents; recomputed on meal create and ingredient substitution" }
      - { name: pinned_plan_version, type: integer, source: computed, description: "DietaryPlan.version captured at approval; null until APPROVED" }
      - { name: billing_mode_snapshot, type: enum, source: computed, description: "Client.billing_mode captured at approval: PER_WEEK | PER_MEAL" }
      - { name: markup_pct_snapshot, type: integer, source: computed, description: "Grocery markup tier percent selected from grocery_cost_cents at approval (PER_WEEK only): 15 | 12 | 10; null otherwise" }
      - { name: billed_amount_cents, type: integer, source: computed, description: "Final invoice gross copied here when the menu reaches COOKED; null until then" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | APPROVED | SKIPPED | COOKED | CANCELLED" }

  - name: MenuMeal
    parent: WeeklyMenu
    common_fields: true
    fields:
      - { name: weekly_menu_id, type: string, source: input, description: "FK -> WeeklyMenu.id; the owning menu" }
      - { name: meal_name, type: string, source: input, description: "Dish name" }
      - { name: meal_slot, type: enum, source: input, description: "BREAKFAST | LUNCH | DINNER" }
      - { name: servings, type: integer, source: input, description: "Portions produced; drives container portion_count", constraints: ">= 1" }
      - { name: is_perishable, type: boolean, source: input, default: true, description: "True → 3-day use-by; False → 5-day use-by on the produced container" }
      - { name: required_equipment, type: array, source: input, default: "[]", description: "Enum members from {OVEN, STOVETOP, BLENDER, GRILL, SOUS_VIDE} that must all be in Client.available_equipment for the menu to approve" }
      - { name: ingredients, type: array, source: input, description: "Array of objects {name, quantity, unit, unit_cost_cents, allergen_tags[], status}; status in {INCLUDED, ADDED, SUBSTITUTED_OUT}. Input ingredients start INCLUDED." }
      - { name: meal_grocery_cost_cents, type: integer, source: computed, description: "SUM over ingredients in {INCLUDED, ADDED} of quantity * unit_cost_cents" }
      - { name: client_rating, type: integer, source: computed, description: "1..5 rating set via feedback after the meal is COOKED; null until rated" }
      - { name: status, type: enum, source: system, description: "PLANNED | COOKED | CANCELLED" }

  - name: CookSession
    parent: WeeklyMenu
    common_fields: true
    fields:
      - { name: weekly_menu_id, type: string, source: input, description: "FK -> WeeklyMenu.id; the menu cooked in this session" }
      - { name: chef_id, type: string, source: input, description: "FK -> Chef.id; the assigned chef" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO8601 UTC planned start" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO8601 UTC planned end; must be strictly after scheduled_start" }
      - { name: actual_start, type: datetime, source: system, description: "Logical clock at start(); null until IN_PROGRESS" }
      - { name: actual_end, type: datetime, source: system, description: "Logical clock at complete(); null until COMPLETED" }
      - { name: provisional_payout_cents, type: integer, source: computed, description: "round_half_up(scheduled_hours * Chef.hourly_rate_cents) fixed at scheduling" }
      - { name: final_payout_cents, type: integer, source: computed, description: "round_half_up(actual_hours * Chef.hourly_rate_cents) set at completion; null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | NO_SHOW | CANCELLED" }

  - name: Container
    parent: MenuMeal
    common_fields: true
    fields:
      - { name: menu_meal_id, type: string, source: input, description: "FK -> MenuMeal.id; the meal portioned into this container. Containers are synthesized by the cook-session completion cascade, never created directly." }
      - { name: label_prep_date, type: datetime, source: system, description: "Logical clock at the moment the producing session completed" }
      - { name: label_use_by_date, type: datetime, source: computed, description: "label_prep_date + (3 days if MenuMeal.is_perishable else 5 days)" }
      - { name: portion_count, type: integer, source: computed, description: "Copied from MenuMeal.servings at production" }
      - { name: label_text, type: string, source: computed, description: "Human label: '<meal_name> — prep <label_prep_date> — use by <label_use_by_date>'" }
      - { name: status, type: enum, source: system, description: "FILLED (the only state; container is a produced artifact)" }

  - name: BillingInvoice
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; who is billed. Invoices are synthesized by the cook-session completion cascade, never created directly." }
      - { name: weekly_menu_id, type: string, source: input, description: "FK -> WeeklyMenu.id; the menu billed" }
      - { name: billing_mode, type: enum, source: computed, description: "Copied from WeeklyMenu.billing_mode_snapshot: PER_WEEK | PER_MEAL" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "invoice_billed_amount output (PER_WEEK or PER_MEAL variant) at issuance" }
      - { name: credit_applied_cents, type: integer, source: computed, default: 0, description: "min(Client.wallet_credit_cents at pay time, gross_amount_cents); set at pay()" }
      - { name: net_amount_cents, type: integer, source: computed, description: "gross_amount_cents - credit_applied_cents; set at pay()" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /clients/{id}/cancel"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "CASCADE link 1: every WeeklyMenu of this client whose status is in {DRAFT, PROPOSED, APPROVED, SKIPPED} -> CANCELLED"
          - "If a menu was SKIPPED, its previously-granted skip credit is reversed from wallet_credit_cents (see resume compensation)"

  - entity: Chef
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (no-show cascade raises no_show_strikes to STRIKE_LIMIT)"
        actor: system
        preconditions:
          - "no_show_strikes >= STRIKE_LIMIT (3)"
        side_effects:
          - "Chef can no longer be scheduled or start sessions (ERR_CHEF_SUSPENDED)"

  - entity: DietaryPlan
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer DietaryPlan is created for the same client via POST /dietary-plans)"
        actor: system
        preconditions: []
        side_effects:
          - "The prior ACTIVE plan for the client -> SUPERSEDED; menus that pinned it keep their pinned_plan_version"

  - entity: WeeklyMenu
    field: status
    initial_state: DRAFT
    terminal_states: [COOKED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /weekly-menus/{id}/propose"
        actor: Chef
        preconditions:
          - "At least one MenuMeal exists on the menu (else ERR_MENU_HAS_NO_MEALS)"
        side_effects: []
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /weekly-menus/{id}/reject"
        actor: Client
        preconditions: []
        side_effects:
          - "Menu returns to the chef for revision (cyclic: DRAFT->PROPOSED->DRAFT->PROPOSED...)"
        note: "Revision loop — this back-edge makes the WeeklyMenu machine cyclic (non-linear)."
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /weekly-menus/{id}/approve"
        actor: Client
        preconditions:
          - "DietaryPlan referenced by dietary_plan_id is in status ACTIVE (cross-entity; else ERR_DIETARY_PLAN_NOT_ACTIVE)"
          - "No meal ingredient carries an allergen in the plan's allergen_tags (else ERR_ALLERGEN_CONFLICT)"
          - "Every meal's required_equipment is a subset of Client.available_equipment (else ERR_EQUIPMENT_UNAVAILABLE)"
          - "grocery_cost_cents <= Client.weekly_grocery_budget_cents (else ERR_GROCERY_BUDGET_EXCEEDED)"
        side_effects:
          - "grocery_cost_cents recomputed and frozen"
          - "pinned_plan_version = DietaryPlan.version"
          - "billing_mode_snapshot = Client.billing_mode"
          - "markup_pct_snapshot = grocery markup tier for grocery_cost_cents (PER_WEEK only; null for PER_MEAL)"
      - from: APPROVED
        to: SKIPPED
        trigger: "POST /weekly-menus/{id}/skip"
        actor: Client
        preconditions:
          - "Logical clock is strictly before week_start_date (else ERR_WEEK_ALREADY_STARTED)"
        side_effects:
          - "Client.wallet_credit_cents += Client.weekly_base_fee_cents  (INVARIANT wallet_credit: forward)"
      - from: SKIPPED
        to: APPROVED
        trigger: "POST /weekly-menus/{id}/resume"
        actor: Client
        preconditions:
          - "Logical clock is strictly before week_start_date (else ERR_WEEK_ALREADY_STARTED)"
        side_effects:
          - "Client.wallet_credit_cents -= Client.weekly_base_fee_cents  (INVARIANT wallet_credit: compensating)"
      - from: APPROVED
        to: COOKED
        trigger: "system (CookSession complete cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link 2: every MenuMeal in PLANNED -> COOKED"
          - "For each now-COOKED meal a Container is synthesized (label_prep_date = clock, use-by computed)"
          - "CASCADE link 3: a BillingInvoice is synthesized in ISSUED with gross_amount_cents = invoice_billed_amount"
          - "billed_amount_cents = invoice.gross_amount_cents"
      - from: [DRAFT, PROPOSED, APPROVED, SKIPPED]
        to: CANCELLED
        trigger: "system (Client cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Non-terminal CookSessions of this menu -> CANCELLED (see CookSession cancel)"

  - entity: MenuMeal
    field: status
    initial_state: PLANNED
    terminal_states: [COOKED, CANCELLED]
    transitions:
      - from: PLANNED
        to: COOKED
        trigger: "system (parent WeeklyMenu -> COOKED)"
        actor: system
        preconditions: []
        side_effects:
          - "A Container is produced for this meal"
      - from: PLANNED
        to: CANCELLED
        trigger: "system (parent WeeklyMenu -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CookSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /cook-sessions/{id}/start"
        actor: Chef
        preconditions:
          - "Parent WeeklyMenu is in status APPROVED (cross-entity; else ERR_MENU_NOT_APPROVED)"
          - "Chef is in status ACTIVE (else ERR_CHEF_SUSPENDED)"
        side_effects:
          - "actual_start = logical clock"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cook-sessions/{id}/complete"
        actor: Chef
        preconditions: []
        side_effects:
          - "actual_end = logical clock; final_payout_cents = round_half_up(actual_hours * Chef.hourly_rate_cents)"
          - "CASCADE (depth 3): parent WeeklyMenu -> COOKED -> meals COOKED + Containers produced -> BillingInvoice ISSUED"
        note: "Branch A of the SCHEDULED fork: the productive path."
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /cook-sessions/{id}/no-show"
        actor: Client
        preconditions: []
        side_effects:
          - "Client.wallet_credit_cents += Client.weekly_base_fee_cents (missed-cook compensation)"
          - "Chef.no_show_strikes += 1; if it reaches STRIKE_LIMIT (3) the Chef -> SUSPENDED"
        note: "Branch B of the SCHEDULED fork: divergent side-effects (client credit + chef strike/suspend), no menu progression."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (parent WeeklyMenu -> CANCELLED)"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_payout_cents no longer owed; the chef schedule slot and kitchen slot are freed"
        note: "Branch C of the SCHEDULED fork: cascade cancellation."

  - entity: BillingInvoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /billing-invoices/{id}/pay"
        actor: Client
        preconditions: []
        side_effects:
          - "credit_applied_cents = min(Client.wallet_credit_cents, gross_amount_cents)"
          - "Client.wallet_credit_cents -= credit_applied_cents"
          - "net_amount_cents = gross_amount_cents - credit_applied_cents"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: dietary-plan-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /dietary-plans"
    occ_field: "expected_client_version"
    description: |
      Creating a DietaryPlan carries the client version the author last observed.
      Because a successful create supersedes the client's prior ACTIVE plan and
      advances Client.version, a second create that still carries the earlier
      client version is rejected as stale — the author's view of the client (and
      of which plan is ACTIVE) predates the plan that already superseded it.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: meal_grocery_cost_cents
    trigger: "MenuMeal create; ingredient substitution"
    algorithm: aggregation
    formula: |
      meal_grocery_cost_cents = SUM over ingredients where status in {INCLUDED, ADDED}
                                of (quantity * unit_cost_cents)
      # ingredients with status SUBSTITUTED_OUT are excluded.
    input_set: "ingredients of this meal in {INCLUDED, ADDED}"
    precision: "integer cents; each quantity*unit_cost_cents is exact"

  - name: grocery_cost_cents
    trigger: "MenuMeal create; ingredient substitution; WeeklyMenu approve (freeze)"
    algorithm: aggregation
    formula: |
      grocery_cost_cents = SUM over MenuMeals where status in {PLANNED, COOKED}
                           of meal_grocery_cost_cents
    input_set: "MenuMeals of this menu in {PLANNED, COOKED}; CANCELLED meals excluded"
    precision: "integer cents"
    note: "Conserved quantity for the grocery-cost compensating invariant: substitute then reverse-substitute leaves this equal to the sum of active ingredient line items."

  - name: invoice_billed_amount
    trigger: "system — CookSession complete (BillingInvoice issuance)"
    algorithm: tiered_pricing
    formula: |
      # Dispatched on WeeklyMenu.billing_mode_snapshot. Two valid algorithms over
      # the SAME cooked menu produce DIFFERENT totals.
      gross_amount_cents = variant(billing_mode_snapshot)
    input_set: "the menu's COOKED meals and their frozen grocery costs"
    constants:
      TIER1_MAX_EXCL: 15000      # grocery_cost_cents < 15000 -> 15%
      TIER2_MAX_EXCL: 30000      # 15000 <= grocery_cost_cents < 30000 -> 12%
      TIER1_PCT: 15
      TIER2_PCT: 12
      TIER3_PCT: 10              # grocery_cost_cents >= 30000 -> 10%
      PER_HEAD_SURCHARGE_CENTS: 500   # per household member above 2
      SURCHARGE_FREE_HEADS: 2
      PER_MEAL_MARKUP_PCT: 20
    precision: "round_half_up to whole cents at each pinned rounding point"
    variants:
      - name: PER_WEEK
        when: "billing_mode_snapshot == PER_WEEK"
        difference: |
          markup_pct = TIER1_PCT if grocery_cost_cents < 15000
                       else TIER2_PCT if grocery_cost_cents < 30000
                       else TIER3_PCT          # boundary is >= (15000 selects 12%, 14999 selects 15%)
          grocery_markup   = round_half_up(grocery_cost_cents * markup_pct / 100)
          household_surch  = max(0, household_size - SURCHARGE_FREE_HEADS) * PER_HEAD_SURCHARGE_CENTS
          gross_amount_cents = weekly_base_fee_cents + grocery_markup + household_surch
      - name: PER_MEAL
        when: "billing_mode_snapshot == PER_MEAL"
        difference: |
          # PINNED ORDER: round EACH meal's marked-up grocery to whole cents, THEN sum.
          # (sum-then-round is explicitly NOT used and yields a different total.)
          for each COOKED meal:
            meal_charge = round_half_up(meal_grocery_cost_cents * (100 + PER_MEAL_MARKUP_PCT) / 100)
                          + per_meal_fee_cents
          gross_amount_cents = SUM(meal_charge over COOKED meals)   # 0 when there are no cooked meals

  - name: chef_session_payout_cents
    trigger: "CookSession schedule (provisional); CookSession complete (final)"
    algorithm: dual_variant
    formula: |
      hours(a, b) = (b - a) total_seconds / 3600      # may be fractional
      payout = round_half_up(hours * Chef.hourly_rate_cents)
    input_set: "one CookSession and its Chef.hourly_rate_cents"
    precision: "round_half_up to whole cents"
    variants:
      - name: PROVISIONAL
        when: "at scheduling (status SCHEDULED)"
        difference: "hours = hours(scheduled_start, scheduled_end); stored in provisional_payout_cents"
      - name: FINAL
        when: "at completion (IN_PROGRESS -> COMPLETED)"
        difference: "hours = hours(actual_start, actual_end); stored in final_payout_cents; diverges from PROVISIONAL when the cook runs shorter/longer than scheduled"

  - name: wallet_credit_cents
    trigger: "menu skip/resume; session no-show; invoice pay"
    algorithm: aggregation
    formula: |
      wallet_credit_cents = SUM(weekly_base_fee_cents granted by SKIPPED menus and NO_SHOW sessions)
                          - SUM(credit_applied_cents on PAID invoices)
      # resume subtracts the credit its skip added; client cancel reverses any live skip credit.
    input_set: "credit-granting events (SKIPPED menus, NO_SHOW sessions) minus credit consumed by PAID invoices"
    precision: "integer cents; floored at 0"
    note: "Conserved quantity for the wallet compensating invariant."

  - name: container_use_by_date
    trigger: "system — Container synthesis at cook completion"
    algorithm: threshold
    formula: |
      shelf_days = 3 if MenuMeal.is_perishable else 5
      label_use_by_date = label_prep_date + shelf_days days
    input_set: "one produced Container and its MenuMeal.is_perishable"
    constants:
      PERISHABLE_SHELF_DAYS: 3
      SHELF_STABLE_SHELF_DAYS: 5
    precision: "whole-day offset on the ISO8601 instant"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is permitted to invoke this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "For entity_backed roles, X-User-ID owns the target resource (Client owns its menus/plans/invoices/meals-via-menu; Chef owns its menus/meals/sessions)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped writes"

  - priority: 4
    category: existence
    check: "All path/body resource ids exist, validated left-to-right"
    error_id: "ERR_CLIENT_NOT_FOUND / ERR_CHEF_NOT_FOUND / ERR_DIETARY_PLAN_NOT_FOUND / ERR_WEEKLY_MENU_NOT_FOUND / ERR_MENU_MEAL_NOT_FOUND / ERR_COOK_SESSION_NOT_FOUND / ERR_CONTAINER_NOT_FOUND / ERR_INVOICE_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "expected_client_version matches Client.version (OCC on dietary-plan create)"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /dietary-plans"

  - priority: 6
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, quantities/cents >= 0, scheduled_end > scheduled_start, kitchen_close_hour > kitchen_open_hour; feedback rating in 1..5"
    error_id: "ERR_VALIDATION / ERR_INVALID_RATING"
    http_status: 400
    applies_to: all writes

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is legal (menu propose/reject/approve/skip/resume; session start/complete/no-show; invoice pay; propose requires >=1 meal; skip/resume require clock < week_start_date; feedback requires meal COOKED)"
    error_id: "ERR_INVALID_MENU_STATE / ERR_INVALID_SESSION_STATE / ERR_INVALID_INVOICE_STATE / ERR_MENU_HAS_NO_MEALS / ERR_WEEK_ALREADY_STARTED / ERR_MEAL_NOT_COOKED"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 8
    category: state
    check: "WeeklyMenu.approve: referenced DietaryPlan is ACTIVE (cross-entity state dependency)"
    error_id: ERR_DIETARY_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /weekly-menus/{id}/approve"

  - priority: 9
    category: state
    check: "CookSession.start: parent WeeklyMenu is APPROVED (cross-entity state dependency)"
    error_id: ERR_MENU_NOT_APPROVED
    http_status: 409
    applies_to: "POST /cook-sessions/{id}/start"

  - priority: 10
    category: state
    check: "CookSession schedule/start: assigned Chef is ACTIVE (cross-entity state dependency)"
    error_id: ERR_CHEF_SUSPENDED
    http_status: 409
    applies_to: "POST /cook-sessions, POST /cook-sessions/{id}/start"

  - priority: 11
    category: business_safety
    check: "WeeklyMenu.approve / MenuMeal.substitute: no active ingredient carries an allergen listed in the client's DietaryPlan.allergen_tags"
    error_id: ERR_ALLERGEN_CONFLICT
    http_status: 422
    applies_to: "POST /weekly-menus/{id}/approve, POST /menu-meals/{id}/substitute"

  - priority: 12
    category: business_constraint
    check: "WeeklyMenu.approve: every meal's required_equipment is a subset of Client.available_equipment"
    error_id: ERR_EQUIPMENT_UNAVAILABLE
    http_status: 422
    applies_to: "POST /weekly-menus/{id}/approve"

  - priority: 13
    category: business_temporal
    check: "CookSession schedule: the new [scheduled_start, scheduled_end) must not overlap another non-terminal session of the SAME chef, AND must be separated from every such session by >= CHEF_BUFFER_MINUTES (60). Adjacency (exactly 60 min gap) is allowed."
    error_id: ERR_CHEF_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /cook-sessions"

  - priority: 14
    category: business_temporal
    check: "CookSession schedule: the new [scheduled_start, scheduled_end) must not overlap another non-terminal session at the SAME client's kitchen. Back-to-back sessions that merely touch (gap == 0) ARE allowed; no buffer is required."
    error_id: ERR_CLIENT_KITCHEN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /cook-sessions"

  - priority: 15
    category: business_temporal
    check: "CookSession schedule: UTC hour of scheduled_start >= Client.kitchen_open_hour and UTC hour of scheduled_end <= Client.kitchen_close_hour"
    error_id: ERR_OUTSIDE_KITCHEN_HOURS
    http_status: 422
    applies_to: "POST /cook-sessions"

  - priority: 16
    category: business_fiscal
    check: "WeeklyMenu.approve: grocery_cost_cents <= Client.weekly_grocery_budget_cents"
    error_id: ERR_GROCERY_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /weekly-menus/{id}/approve"

# =============================================================================
# §1.5 API Endpoint Table (32 endpoints)
# =============================================================================
endpoints:
  # ---- Client ----
  - method: POST
    path: "/clients"
    description: "Create a client profile"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, household_size, billing_mode, weekly_base_fee_cents, per_meal_fee_cents, weekly_grocery_budget_cents, "available_equipment?", kitchen_open_hour, kitchen_close_hour]
    output: Client
    side_effects: ["status=ACTIVE, wallet_credit_cents=0, version=1"]

  - method: GET
    path: "/clients/{id}"
    description: "Fetch a client (wallet_credit_cents, status, version)"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{id}/cancel"
    description: "Cancel a client and cascade-cancel their live menus and sessions"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Client
    side_effects:
      - "status -> CANCELLED"
      - "CASCADE: live WeeklyMenus -> CANCELLED -> their non-terminal CookSessions -> CANCELLED; live skip credits reversed"

  # ---- Chef ----
  - method: POST
    path: "/chefs"
    description: "Create a chef"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, hourly_rate_cents]
    output: Chef
    side_effects: ["status=ACTIVE, no_show_strikes=0"]

  # ---- DietaryPlan ----
  - method: POST
    path: "/dietary-plans"
    description: "Create a dietary plan for a client; supersedes the prior ACTIVE plan (OCC on client version)"
    roles: [Client]
    code: 201
    input: [client_id, restriction_tags, allergen_tags, daily_calorie_target, expected_client_version]
    output: DietaryPlan
    side_effects:
      - "status=ACTIVE; prior ACTIVE plan of the client -> SUPERSEDED"
      - "increments Client.version by 1"

  - method: GET
    path: "/dietary-plans/{id}"
    description: "Fetch a dietary plan"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: []
    output: DietaryPlan
    side_effects: []

  - method: GET
    path: "/dietary-plans"
    description: "List dietary plans, filterable by client"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: "DietaryPlan[]"
    side_effects: []

  # ---- WeeklyMenu ----
  - method: POST
    path: "/weekly-menus"
    description: "Chef drafts a weekly menu for a client and plan"
    roles: [Chef]
    code: 201
    input: [client_id, dietary_plan_id, chef_id, week_start_date]
    output: WeeklyMenu
    side_effects: ["status=DRAFT, grocery_cost_cents=0"]

  - method: GET
    path: "/weekly-menus/{id}"
    description: "Fetch a weekly menu (grocery_cost_cents, snapshots, billed_amount_cents)"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: []
    output: WeeklyMenu
    side_effects: []

  - method: GET
    path: "/weekly-menus"
    description: "List weekly menus, filterable by client, plan, or chef"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: ["client_id?", "dietary_plan_id?", "chef_id?", "limit?", "offset?"]
    output: "WeeklyMenu[]"
    side_effects: []

  - method: POST
    path: "/weekly-menus/{id}/propose"
    description: "Chef proposes the drafted menu to the client"
    roles: [Chef]
    code: 200
    input: []
    output: WeeklyMenu
    side_effects: ["status DRAFT -> PROPOSED"]

  - method: POST
    path: "/weekly-menus/{id}/reject"
    description: "Client rejects a proposed menu, returning it to the chef for revision"
    roles: [Client]
    code: 200
    input: []
    output: WeeklyMenu
    side_effects: ["status PROPOSED -> DRAFT"]

  - method: POST
    path: "/weekly-menus/{id}/approve"
    description: "Client approves a proposed menu; freezes cost, pins plan version and billing snapshot"
    roles: [Client]
    code: 200
    input: []
    output: WeeklyMenu
    side_effects:
      - "status PROPOSED -> APPROVED"
      - "grocery_cost_cents frozen; pinned_plan_version, billing_mode_snapshot, markup_pct_snapshot set"

  - method: POST
    path: "/weekly-menus/{id}/skip"
    description: "Client skips (vacations) the approved week; grants a wallet credit"
    roles: [Client]
    code: 200
    input: []
    output: WeeklyMenu
    side_effects: ["status APPROVED -> SKIPPED", "Client.wallet_credit_cents += weekly_base_fee_cents"]

  - method: POST
    path: "/weekly-menus/{id}/resume"
    description: "Client resumes a previously-skipped week; reverses the skip credit"
    roles: [Client]
    code: 200
    input: []
    output: WeeklyMenu
    side_effects: ["status SKIPPED -> APPROVED", "Client.wallet_credit_cents -= weekly_base_fee_cents"]

  # ---- MenuMeal ----
  - method: POST
    path: "/menu-meals"
    description: "Chef adds a meal (with ingredients) to a DRAFT menu"
    roles: [Chef]
    code: 201
    input: [weekly_menu_id, meal_name, meal_slot, servings, "is_perishable?", "required_equipment?", ingredients]
    output: MenuMeal
    side_effects: ["status=PLANNED; meal_grocery_cost_cents computed; parent menu grocery_cost_cents recomputed"]

  - method: GET
    path: "/menu-meals/{id}"
    description: "Fetch a menu meal (ingredients, meal_grocery_cost_cents, client_rating, status)"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: []
    output: MenuMeal
    side_effects: []

  - method: GET
    path: "/menu-meals"
    description: "List meals, filterable by menu"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: ["weekly_menu_id?", "limit?", "offset?"]
    output: "MenuMeal[]"
    side_effects: []

  - method: POST
    path: "/menu-meals/{id}/substitute"
    description: "Chef substitutes one ingredient for another; safety-checked and cost-recomputed"
    roles: [Chef]
    code: 200
    input: [target_ingredient_name, replacement_name, replacement_quantity, replacement_unit, replacement_unit_cost_cents, "replacement_allergen_tags?"]
    output: MenuMeal
    side_effects:
      - "matching INCLUDED/ADDED ingredient named target_ingredient_name -> SUBSTITUTED_OUT"
      - "replacement appended with status ADDED"
      - "meal_grocery_cost_cents and parent menu grocery_cost_cents recomputed"

  - method: POST
    path: "/menu-meals/{id}/feedback"
    description: "Client rates a cooked meal"
    roles: [Client]
    code: 200
    input: [rating, "comment?"]
    output: MenuMeal
    side_effects: ["client_rating set (requires meal COOKED)"]

  # ---- CookSession ----
  - method: POST
    path: "/cook-sessions"
    description: "Chef schedules an in-home cook session for a menu"
    roles: [Chef]
    code: 201
    input: [weekly_menu_id, chef_id, scheduled_start, scheduled_end]
    output: CookSession
    side_effects: ["status=SCHEDULED; provisional_payout_cents computed; chef-overlap, kitchen-overlap, kitchen-hours, chef-active checks"]

  - method: GET
    path: "/cook-sessions/{id}"
    description: "Fetch a cook session (payouts, actual_start/end, status)"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: []
    output: CookSession
    side_effects: []

  - method: GET
    path: "/cook-sessions"
    description: "List cook sessions, filterable by menu or chef"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: ["weekly_menu_id?", "chef_id?", "limit?", "offset?"]
    output: "CookSession[]"
    side_effects: []

  - method: POST
    path: "/cook-sessions/{id}/start"
    description: "Chef starts a scheduled session"
    roles: [Chef]
    code: 200
    input: []
    output: CookSession
    side_effects: ["status SCHEDULED -> IN_PROGRESS; actual_start = clock"]

  - method: POST
    path: "/cook-sessions/{id}/complete"
    description: "Chef completes a session; drives the cook cascade (menu COOKED, containers, invoice)"
    roles: [Chef]
    code: 200
    input: []
    output: CookSession
    side_effects:
      - "status IN_PROGRESS -> COMPLETED; actual_end = clock; final_payout_cents computed"
      - "CASCADE: WeeklyMenu -> COOKED -> meals COOKED + Containers produced -> BillingInvoice ISSUED"

  - method: POST
    path: "/cook-sessions/{id}/no-show"
    description: "Report a chef no-show for a scheduled session"
    roles: [Client, PlatformAdmin]
    code: 200
    input: []
    output: CookSession
    side_effects:
      - "status SCHEDULED -> NO_SHOW"
      - "Client.wallet_credit_cents += weekly_base_fee_cents; Chef.no_show_strikes += 1 (auto-suspend at 3)"

  # ---- Container (cascade-created; discovered via reverse-reachability) ----
  - method: GET
    path: "/containers/{id}"
    description: "Fetch a produced container (labels, use-by, portion_count)"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: []
    output: Container
    side_effects: []

  - method: GET
    path: "/containers"
    description: "List containers, filterable by meal"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: ["menu_meal_id?", "limit?", "offset?"]
    output: "Container[]"
    side_effects: []

  # ---- BillingInvoice (cascade-created; discovered via reverse-reachability) ----
  - method: GET
    path: "/billing-invoices/{id}"
    description: "Fetch an invoice (gross/credit/net, status)"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: []
    output: BillingInvoice
    side_effects: []

  - method: GET
    path: "/billing-invoices"
    description: "List invoices, filterable by client or menu"
    roles: [PlatformAdmin, Client, Chef]
    code: 200
    input: ["client_id?", "weekly_menu_id?", "limit?", "offset?"]
    output: "BillingInvoice[]"
    side_effects: []

  - method: POST
    path: "/billing-invoices/{id}/pay"
    description: "Client pays an issued invoice; applies available wallet credit"
    roles: [Client]
    code: 200
    input: []
    output: BillingInvoice
    side_effects:
      - "status ISSUED -> PAID"
      - "credit_applied_cents = min(wallet_credit_cents, gross_amount_cents); wallet_credit_cents decremented; net_amount_cents set"

  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "null"
    side_effects: ["logical clock set to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog (29)
# =============================================================================
errors:
  - { id: ERR_MISSING_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "entity_backed caller does not own the target resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum, negative amount, scheduled_end <= scheduled_start, kitchen_close_hour <= kitchen_open_hour" }
  - { id: ERR_INVALID_RATING, http: 422, condition: "feedback rating not in 1..5" }
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id does not exist" }
  - { id: ERR_CHEF_NOT_FOUND, http: 404, condition: "Chef id does not exist" }
  - { id: ERR_DIETARY_PLAN_NOT_FOUND, http: 404, condition: "DietaryPlan id does not exist" }
  - { id: ERR_WEEKLY_MENU_NOT_FOUND, http: 404, condition: "WeeklyMenu id does not exist" }
  - { id: ERR_MENU_MEAL_NOT_FOUND, http: 404, condition: "MenuMeal id does not exist" }
  - { id: ERR_COOK_SESSION_NOT_FOUND, http: 404, condition: "CookSession id does not exist" }
  - { id: ERR_CONTAINER_NOT_FOUND, http: 404, condition: "Container id does not exist" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "BillingInvoice id does not exist" }
  - { id: ERR_STALE_CLIENT_VERSION, http: 412, condition: "expected_client_version != Client.version on dietary-plan create" }
  - { id: ERR_INVALID_MENU_STATE, http: 409, condition: "WeeklyMenu not in a legal state for the requested transition" }
  - { id: ERR_INVALID_SESSION_STATE, http: 409, condition: "CookSession not in a legal state for the requested transition" }
  - { id: ERR_INVALID_INVOICE_STATE, http: 409, condition: "BillingInvoice not ISSUED when pay is requested" }
  - { id: ERR_MENU_HAS_NO_MEALS, http: 409, condition: "propose attempted on a menu with zero meals" }
  - { id: ERR_WEEK_ALREADY_STARTED, http: 409, condition: "skip/resume attempted when logical clock >= week_start_date" }
  - { id: ERR_MEAL_NOT_COOKED, http: 409, condition: "feedback attempted before the meal is COOKED" }
  - { id: ERR_DIETARY_PLAN_NOT_ACTIVE, http: 409, condition: "approve attempted while the referenced dietary plan is SUPERSEDED" }
  - { id: ERR_MENU_NOT_APPROVED, http: 409, condition: "session start attempted while parent menu is not APPROVED" }
  - { id: ERR_CHEF_SUSPENDED, http: 409, condition: "schedule/start attempted with a SUSPENDED chef" }
  - { id: ERR_ALLERGEN_CONFLICT, http: 422, condition: "an active ingredient carries an allergen in the client's dietary plan allergen_tags" }
  - { id: ERR_EQUIPMENT_UNAVAILABLE, http: 422, condition: "a meal's required_equipment is not a subset of the client's available_equipment" }
  - { id: ERR_CHEF_SCHEDULE_CONFLICT, http: 409, condition: "session overlaps or is within 60 min of another non-terminal session of the same chef" }
  - { id: ERR_CLIENT_KITCHEN_DOUBLE_BOOKED, http: 409, condition: "session overlaps another non-terminal session at the same client's kitchen" }
  - { id: ERR_OUTSIDE_KITCHEN_HOURS, http: 422, condition: "session times fall outside the client's kitchen_open_hour..kitchen_close_hour window" }
  - { id: ERR_GROCERY_BUDGET_EXCEEDED, http: 402, condition: "grocery_cost_cents exceeds the client's weekly_grocery_budget_cents at approval" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational staff; onboards clients and chefs, cancels clients, reports no-shows, drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients — create client"
      - "POST /chefs — create chef"
      - "POST /clients/{id}/cancel — cancel client (cascade)"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /cook-sessions/{id}/no-show — report no-show (shared with Client)"
      - "GET endpoints"

  - name: Client
    description: "The household being served; owns its dietary plan, menu approvals, feedback, and invoices"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /dietary-plans — create/supersede own dietary plan"
      - "POST /weekly-menus/{id}/reject — reject own proposed menu"
      - "POST /weekly-menus/{id}/approve — approve own proposed menu"
      - "POST /weekly-menus/{id}/skip — skip own approved week"
      - "POST /weekly-menus/{id}/resume — resume own skipped week"
      - "POST /menu-meals/{id}/feedback — rate own cooked meal"
      - "POST /billing-invoices/{id}/pay — pay own invoice"
    shared_operations:
      - "POST /cook-sessions/{id}/no-show — report no-show (shared with PlatformAdmin)"
      - "GET endpoints"

  - name: Chef
    description: "The cook; authors menus and meals, substitutes ingredients, schedules and runs cook sessions"
    identity: "entity_backed:Chef"
    exclusive_operations:
      - "POST /weekly-menus — draft a menu (as owning chef)"
      - "POST /weekly-menus/{id}/propose — propose own menu"
      - "POST /menu-meals — add meal to own menu"
      - "POST /menu-meals/{id}/substitute — substitute ingredient on own menu's meal"
      - "POST /cook-sessions — schedule own session"
      - "POST /cook-sessions/{id}/start — start own session"
      - "POST /cook-sessions/{id}/complete — complete own session"
    shared_operations:
      - "GET endpoints"
