            - call: "POST /recruitment/applications/${a1_id}/documents"
              payload: { doc_type: "TRANSCRIPT", content_hash: "hash-transcript-4001", issuer_name: "Regional Board", declared_signals: ["ISSUER_UNVERIFIED", "TRANSCRIPT_ANOMALY", "TRANSLATION_MISMATCH"] }
              as: AgencyOwner
