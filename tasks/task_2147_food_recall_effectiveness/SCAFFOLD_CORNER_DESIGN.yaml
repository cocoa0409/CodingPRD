        distinguishing_aspect: "A checkpoint run while a PENDING report exists mints nothing; after that report is submitted and ACCEPTED, the next checkpoint at 2026-09-10T00:00:00Z mints period_index 2 with period_start 2026-09-10T00:00:00.000Z and due_at 2026-09-17T00:00:00.000Z."
