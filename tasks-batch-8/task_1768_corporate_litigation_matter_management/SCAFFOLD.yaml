scenario: 'Corporate Litigation Matter Management (in-house litigation team): matter intake & risk/exposure assessment, outside counsel selection & staffing approval, budget & accrual reporting to finance,
  litigation hold coordination & discovery vendor management, settlement authority & approval hierarchy, key deadline & hearing calendar, judgment/settlement payment processing, portfolio reporting & outcome
  analytics

  '
domain_name: corporate-litigation-matters
api_prefix: /litigation
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
  - one_to_many
  - many_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Matter
  parent: null
  common_fields: true
  fields:
  - name: matter_number
    type: string
    source: system
    description: Server-minted sequential display number, format 'MTR-<YYYY>-<6-digit sequence in creation order>'; identity only, never used in ranking or allocation.
  - name: title
    type: string
    source: input
    description: Short matter caption.
  - name: matter_type
    type: enum
    source: input
    description: Classification driving downstream rules.
    constraints: one of {COMMERCIAL, EMPLOYMENT, IP, REGULATORY, PRODUCT_LIABILITY, CLASS_ACTION}
  - name: adverse_party
    type: string
    source: input
    description: Name of opposing party.
  - name: jurisdiction
    type: string
    source: input
    description: Court or forum identifier, free text.
  - name: filing_date
    type: datetime
    source: input
    description: Date the complaint was filed or threatened; ISO 8601 date.
  - name: status
    type: enum
    source: system
    description: Lifecycle state of the matter.
    default: INTAKE
    constraints: one of {INTAKE, ASSESSMENT, STAFFING, ACTIVE, SETTLEMENT_PENDING, RESOLVED, CLOSED, REOPENED}; REOPENED re-enters at ASSESSMENT-equivalent privileges but remains distinguishable for reporting
  - name: exposure_low_cents
    type: integer
    source: input
    description: Low end of estimated exposure range, USD cents, >= 0. Editable only while status in {INTAKE, ASSESSMENT}.
  - name: exposure_high_cents
    type: integer
    source: input
    description: High end of estimated exposure range, USD cents; MUST be >= exposure_low_cents.
  - name: probability_of_loss_pct
    type: integer
    source: input
    description: Estimated probability of an adverse outcome, integer percent 0..100 inclusive.
  - name: exposure_tier
    type: enum
    source: computed
    description: Derived classification from calc exposure_tier_classification; drives approval routing.
    constraints: one of {TIER_1, TIER_2, TIER_3, TIER_4}
  - name: reserve_amount_cents
    type: integer
    source: computed
    description: Derived accounting reserve from calc reserve_recognition; recomputed on exposure edits, accrual postings, and resolution.
  - name: accrued_to_date_cents
    type: integer
    source: computed
    description: Sum of POSTED AccrualEntry amounts for this matter (calc matter_accrual_rollup).
    default: 0
  - name: posture
    type: enum
    source: computed
    description: Derived gate from calc matter_posture; gates child operations (holds, work orders, settlements, payments).
    constraints: one of {OPEN, RESTRICTED, FROZEN}
  - name: resolution_type
    type: enum
    source: system
    description: How the matter resolved; set by resolve transition.
    constraints: null until RESOLVED; then one of {SETTLEMENT, JUDGMENT, DISMISSAL, SUMMARY_JUDGMENT}
  - name: resolved_at
    type: datetime
    source: system
    description: Timestamp of resolution; null until RESOLVED.
  - name: owning_counsel_id
    type: string
    source: input
    description: FK -> StaffUser.id; the in-house LitigationCounsel who owns day-to-day conduct. Only that user may perform owner-gated operations on this matter.
  - name: close_checklist_ack
    type: boolean
    source: input
    description: Required true on the close call; acknowledgement that holds are released and vendors demobilized.
    default: false
- name: StaffUser
  parent: null
  common_fields: true
  fields:
  - name: full_name
    type: string
    source: input
    description: Display name of the in-house legal or finance staff member.
  - name: email
    type: string
    source: input
    description: Corporate email; unique across StaffUser.
  - name: job_family
    type: enum
    source: input
    description: Functional family; constrains which X-User-Role values this user may legitimately act under.
    constraints: one of {LEGAL, FINANCE, OPERATIONS, EXECUTIVE}
  - name: is_active
    type: boolean
    source: input
    description: Soft activation flag; inactive users may not own new matters or act as custodians.
    default: true
- name: CounselFirm
  parent: null
  common_fields: true
  fields:
  - name: firm_name
    type: string
    source: input
    description: Legal name of the outside counsel firm.
  - name: panel_status
    type: enum
    source: system
    description: Whether the firm is on the approved panel.
    default: PENDING
    constraints: one of {PENDING, APPROVED, SUSPENDED, TERMINATED}
  - name: conflict_check_status
    type: enum
    source: system
    description: Result of conflict-of-interest screening; must be CLEARED before staffing.
    default: UNCHECKED
    constraints: one of {UNCHECKED, CLEARED, WAIVED, FLAGGED}
  - name: blended_rate_cap_cents
    type: integer
    source: input
    description: Maximum blended hourly rate the firm may bill, USD cents/hour, > 0.
  - name: is_active
    type: boolean
    source: input
    description: Panel firms may be deactivated instead of terminated for soft-delete semantics.
    default: true
- name: Engagement
  parent: Matter
  common_fields: true
  fields:
  - name: matter_id
    type: string
    source: input
    description: FK -> Matter.id; the matter the firm is staffed on.
  - name: firm_id
    type: string
    source: input
    description: FK -> CounselFirm.id; the firm being engaged.
  - name: role_type
    type: enum
    source: input
    description: Scope of the engagement.
    constraints: one of {LEAD_COUNSEL, CO_COUNSEL, LOCAL_COUNSEL, SPECIALIST}
  - name: status
    type: enum
    source: system
    description: Approval lifecycle of the staffing request.
    default: PROPOSED
    constraints: one of {PROPOSED, APPROVED, REJECTED, ACTIVE, SUSPENDED, TERMINATED}
  - name: fee_arrangement
    type: enum
    source: input
    description: Billing model; HOURLY engagements accrue via blended rate, FLAT_FEE via milestone, CONTINGENCY via outcome percentage.
    constraints: one of {HOURLY, FLAT_FEE, CONTINGENCY, HYBRID}
  - name: proposed_rate_cents
    type: integer
    source: input
    description: Proposed blended hourly rate in cents; required for HOURLY/HYBRID, MUST be <= firm blended_rate_cap_cents.
  - name: contingency_pct
    type: integer
    source: input
    description: Contingency percentage 1..40; required for CONTINGENCY/HYBRID.
  - name: approved_by_user_id
    type: string
    source: system
    description: FK -> StaffUser.id; the approver who executed the approve transition (segregation-of-duties audit field).
  - name: engagement_letter_executed
    type: boolean
    source: input
    description: Whether the engagement letter is countersigned; required true to reach ACTIVE.
    default: false
  - name: supersedes_engagement_id
    type: string
    source: input
    description: FK -> Engagement.id; when replacing counsel, points at the engagement this one supersedes (self-referential). Null otherwise.
- name: Budget
  parent: Matter
  common_fields: true
  fields:
  - name: matter_id
    type: string
    source: input
    description: FK -> Matter.id; exactly one ACTIVE Budget per matter at any time.
  - name: fiscal_year
    type: integer
    source: input
    description: Budget fiscal year, e.g. 2026.
  - name: lifecycle_budget_cents
    type: integer
    source: input
    description: Total authorized spend over the life of the matter, USD cents, > 0.
  - name: fy_budget_cents
    type: integer
    source: input
    description: Authorized spend within fiscal_year, USD cents, > 0; MUST be <= lifecycle_budget_cents.
  - name: status
    type: enum
    source: system
    description: Budget lifecycle.
    default: DRAFT
    constraints: one of {DRAFT, SUBMITTED, APPROVED, SUPERSEDED, REJECTED}
  - name: submitted_by_user_id
    type: string
    source: system
    description: 'FK -> StaffUser.id; who submitted (SoD audit: submitter cannot approve).'
  - name: approved_by_user_id
    type: string
    source: system
    description: FK -> StaffUser.id; who approved; null until APPROVED.
  - name: utilization_pct
    type: number
    source: computed
    description: 'Derived: accrued_to_date_cents of the matter / fy_budget_cents * 100, per calc budget_utilization.'
    default: 0
  - name: prior_version_id
    type: string
    source: input
    description: FK -> Budget.id; when a revised budget supersedes an earlier one (self-referential chain head = original).
- name: AccrualEntry
  parent: Matter
  common_fields: false
  fields:
  - name: matter_id
    type: string
    source: input
    description: FK -> Matter.id.
  - name: engagement_id
    type: string
    source: input
    description: FK -> Engagement.id; accrual is reported against a specific engagement.
  - name: period
    type: string
    source: input
    description: Accrual period, format 'YYYY-MM'. One POSTED entry per (engagement_id, period) — duplicates rejected.
  - name: entry_kind
    type: enum
    source: input
    description: ACCRUAL estimates unbilled fees; INVOICE records billed fees; ADJUSTMENT reverses a prior entry.
    constraints: one of {ACCRUAL, INVOICE, ADJUSTMENT}
  - name: amount_cents
    type: integer
    source: input
    description: Signed amount in cents; ACCRUAL/INVOICE must be > 0, ADJUSTMENT must be < 0.
  - name: status
    type: enum
    source: system
    description: DRAFT until submitted; POSTED once finance acknowledges; VOID if reversed.
    default: DRAFT
    constraints: one of {DRAFT, SUBMITTED, POSTED, VOID}
  - name: submitted_at
    type: datetime
    source: system
    description: Timestamp of submission; null until SUBMITTED.
  - name: reverses_entry_id
    type: string
    source: input
    description: FK -> AccrualEntry.id; required for ADJUSTMENT entries (self-referential), points at the entry being reversed.
- name: LitigationHold
  parent: Matter
  common_fields: true
  fields:
  - name: matter_id
    type: string
    source: input
    description: FK -> Matter.id.
  - name: scope_description
    type: string
    source: input
    description: Description of documents/data subject to preservation.
  - name: status
    type: enum
    source: system
    description: Hold lifecycle.
    default: DRAFT
    constraints: one of {DRAFT, ISSUED, ACKNOWLEDGED, RELEASED}
  - name: issued_at
    type: datetime
    source: system
    description: Timestamp of issuance; null until ISSUED.
  - name: released_at
    type: datetime
    source: system
    description: Timestamp of release; null until RELEASED.
  - name: release_reason
    type: enum
    source: input
    description: Why released; required on release call.
    constraints: one of {MATTER_RESOLVED, SCOPE_NARROWED, COURT_ORDER, ERROR}
- name: HoldCustodian
  parent: LitigationHold
  common_fields: true
  fields:
  - name: hold_id
    type: string
    source: input
    description: FK -> LitigationHold.id.
  - name: staff_user_id
    type: string
    source: input
    description: FK -> StaffUser.id; the custodian (employee whose data is preserved). Unique per hold.
  - name: status
    type: enum
    source: system
    description: Custodian acknowledgement lifecycle.
    default: NOTICED
    constraints: one of {NOTICED, ACKNOWLEDGED, ESCALATED, EXEMPTED, RELEASED}
  - name: noticed_at
    type: datetime
    source: system
    description: Timestamp the notice was sent (set at add).
  - name: acknowledged_at
    type: datetime
    source: system
    description: Timestamp of acknowledgement; null until ACKNOWLEDGED.
  - name: escalation_count
    type: integer
    source: system
    description: Number of escalation notices sent; increments on escalate transition.
    default: 0
  - name: exemption_reason
    type: string
    source: input
    description: Required when exempting a custodian.
- name: DiscoveryVendor
  parent: null
  common_fields: true
  fields:
  - name: vendor_name
    type: string
    source: input
    description: E-discovery vendor name.
  - name: security_clearance_level
    type: enum
    source: input
    description: Data-handling clearance; gates assignment to matters by matter_type sensitivity.
    constraints: one of {STANDARD, ENHANCED, RESTRICTED}
  - name: capacity_gb
    type: integer
    source: input
    description: Total monthly processing capacity in GB, > 0.
  - name: committed_gb
    type: integer
    source: computed
    description: Sum of estimated_gb over non-terminal VendorWorkOrders for this vendor (calc vendor_capacity_rollup).
    default: 0
  - name: is_active
    type: boolean
    source: input
    description: Soft-delete flag; inactive vendors cannot receive new work orders.
    default: true
- name: VendorWorkOrder
  parent: Matter
  common_fields: true
  fields:
  - name: matter_id
    type: string
    source: input
    description: FK -> Matter.id.
  - name: vendor_id
    type: string
    source: input
    description: FK -> DiscoveryVendor.id.
  - name: hold_id
    type: string
    source: input
    description: FK -> LitigationHold.id; the hold whose custodians' data is collected. MUST reference an ISSUED or ACKNOWLEDGED hold of the same matter.
  - name: service_type
    type: enum
    source: input
    description: Phase of discovery work.
    constraints: one of {COLLECTION, PROCESSING, HOSTING, REVIEW, PRODUCTION}
  - name: status
    type: enum
    source: system
    description: Work order lifecycle.
    default: DRAFT
    constraints: one of {DRAFT, AUTHORIZED, IN_PROGRESS, COMPLETED, CANCELLED}
  - name: estimated_gb
    type: integer
    source: input
    description: Estimated data volume GB, > 0; debits vendor capacity while non-terminal.
  - name: actual_gb
    type: integer
    source: input
    description: Actual processed volume, set at completion; >= 0.
  - name: rate_per_gb_cents
    type: integer
    source: input
    description: Negotiated per-GB rate, cents, > 0.
  - name: scheduled_start
    type: datetime
    source: input
    description: Planned collection/processing start; ISO 8601.
  - name: scheduled_end
    type: datetime
    source: input
    description: Planned end; MUST be strictly after scheduled_start.
  - name: estimated_cost_cents
    type: integer
    source: computed
    description: 'Derived: estimated_gb * rate_per_gb_cents (calc work_order_cost).'
- name: Deadline
  parent: Matter
  common_fields: true
  fields:
  - name: matter_id
    type: string
    source: input
    description: FK -> Matter.id.
  - name: deadline_type
    type: enum
    source: input
    description: Kind of calendar entry.
    constraints: one of {COURT_DEADLINE, HEARING, DISCOVERY_CUTOFF, FILING, INTERNAL_REVIEW, LIMITATION_EXPIRY}
  - name: title
    type: string
    source: input
    description: Short label.
  - name: due_at
    type: datetime
    source: input
    description: When the deadline falls; ISO 8601.
  - name: status
    type: enum
    source: system
    description: Calendar entry lifecycle.
    default: SCHEDULED
    constraints: one of {SCHEDULED, MET, MISSED, VACATED, EXPIRED}
  - name: is_jurisdictional
    type: boolean
    source: input
    description: Jurisdictional deadlines cannot be vacated by counsel — only by the system on matter resolution; missing one escalates the matter.
    default: false
  - name: completed_at
    type: datetime
    source: system
    description: When marked MET.
  - name: reminder_days
    type: integer
    source: input
    description: Days before due_at to flag at-risk; >= 0.
    default: 7
- name: SettlementAuthorityPolicy
  parent: null
  common_fields: true
  fields:
  - name: tier
    type: enum
    source: input
    description: Exposure tier this policy row governs.
    constraints: one of {TIER_1, TIER_2, TIER_3, TIER_4}; unique per tier
  - name: approver_role
    type: enum
    source: input
    description: Role whose sign-off is required to settle a matter of this tier.
    constraints: one of {DeputyGeneralCounsel, GeneralCounsel, ChiefFinancialOfficer, BoardCommittee}
  - name: max_single_amount_cents
    type: integer
    source: input
    description: Largest settlement this role may approve for this tier in a single action, cents; > 0. Above this, dual approval is required.
  - name: dual_approval_required_over_cents
    type: integer
    source: input
    description: Amount over which a second approver (the next role up) is also required; >= max_single_amount_cents.
  - name: is_active
    type: boolean
    source: input
    description: Only active policy rows are consulted.
    default: true
- name: SettlementRequest
  parent: Matter
  common_fields: true
  fields:
  - name: matter_id
    type: string
    source: input
    description: FK -> Matter.id.
  - name: proposed_amount_cents
    type: integer
    source: input
    description: Settlement amount, cents, > 0.
  - name: settlement_kind
    type: enum
    source: input
    description: PAY_OUT = company pays plaintiff; PAY_IN = company receives; NON_MONETARY.
    constraints: one of {PAY_OUT, PAY_IN, NON_MONETARY}
  - name: status
    type: enum
    source: system
    description: Approval lifecycle with negotiation cycle.
    default: DRAFT
    constraints: one of {DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, COUNTERED, EXECUTED, WITHDRAWN, EXPIRED}
  - name: counter_amount_cents
    type: integer
    source: system
    description: Amount set by the counter transition; null unless status COUNTERED.
  - name: requested_by_user_id
    type: string
    source: system
    description: 'FK -> StaffUser.id; the requesting counsel (SoD: requester cannot approve).'
  - name: approved_by_user_ids
    type: array
    source: system
    description: Ordered list of approver StaffUser ids recorded by approve calls; length 1 or 2 depending on dual-approval rules.
  - name: authority_tier_at_submission
    type: enum
    source: system
    description: Snapshot of Matter.exposure_tier at submission time; approval routing uses this snapshot, NOT the live tier (version-pinning).
  - name: terms_summary
    type: string
    source: input
    description: Non-monetary terms, free text.
  - name: expires_at
    type: datetime
    source: input
    description: Offer expiry; system auto-transitions SUBMITTED/UNDER_REVIEW/COUNTERED requests past expires_at to EXPIRED.
- name: PaymentRequest
  parent: Matter
  common_fields: true
  fields:
  - name: matter_id
    type: string
    source: input
    description: FK -> Matter.id.
  - name: settlement_request_id
    type: string
    source: input
    description: FK -> SettlementRequest.id; required when payment_kind == SETTLEMENT.
  - name: payment_kind
    type: enum
    source: input
    description: SETTLEMENT = pays an EXECUTED settlement; JUDGMENT = pays an adverse judgment; COST_AWARD = statutory costs.
    constraints: one of {SETTLEMENT, JUDGMENT, COST_AWARD}
  - name: amount_cents
    type: integer
    source: input
    description: Payment amount, cents, > 0. For SETTLEMENT, MUST equal the settlement's executed amount.
  - name: payee_name
    type: string
    source: input
    description: Payee.
  - name: status
    type: enum
    source: system
    description: Payment lifecycle.
    default: DRAFT
    constraints: one of {DRAFT, SUBMITTED, FINANCE_APPROVED, DISBURSED, REJECTED, CANCELLED}
  - name: payment_status
    type: enum
    source: system
    description: 'Parallel dimension: disbursement rail state, independent of approval status.'
    default: NOT_SENT
    constraints: one of {NOT_SENT, SENT, CONFIRMED, RETURNED}
  - name: submitted_by_user_id
    type: string
    source: system
    description: 'FK -> StaffUser.id; SoD: submitter cannot finance-approve.'
  - name: approved_by_user_id
    type: string
    source: system
    description: FK -> StaffUser.id; finance approver.
  - name: disbursed_at
    type: datetime
    source: system
    description: Timestamp of disbursement.
state_machines:
- entity: Matter
  initial_state: INTAKE
  terminal_states:
  - CLOSED
  transitions:
  - from: INTAKE
    to: ASSESSMENT
    trigger: POST /litigation/matters/{id}/submit-assessment
    actor: LitigationCounsel
    preconditions:
    - Matter.status == INTAKE
    - exposure_low_cents, exposure_high_cents, probability_of_loss_pct are all set (non-null)
    - exposure_high_cents >= exposure_low_cents
    - acting user's X-User-ID == Matter.owning_counsel_id
    side_effects:
    - recompute exposure_tier (calc exposure_tier_classification)
    - recompute reserve_amount_cents (calc reserve_recognition)
    - recompute posture (calc matter_posture)
    - increments Matter.version by 1
  - from: ASSESSMENT
    to: STAFFING
    trigger: POST /litigation/matters/{id}/advance-to-staffing
    actor: LitigationCounsel
    preconditions:
    - Matter.status == ASSESSMENT
    - at least one Deadline exists for the matter (initial calendar seeded)
    - acting user's X-User-ID == Matter.owning_counsel_id
    side_effects:
    - recompute posture (calc matter_posture)
    - increments Matter.version by 1
  - from: STAFFING
    to: ACTIVE
    trigger: POST /litigation/matters/{id}/activate
    actor: LitigationCounsel
    preconditions:
    - Matter.status == STAFFING
    - at least one Engagement for this matter has status == ACTIVE
    - an APPROVED Budget exists for this matter
    - acting user's X-User-ID == Matter.owning_counsel_id
    side_effects:
    - recompute posture (calc matter_posture)
    - increments Matter.version by 1
  - from: ACTIVE
    to: SETTLEMENT_PENDING
    trigger: 'system: a SettlementRequest for this matter reaches status APPROVED'
    actor: system
    preconditions:
    - Matter.status == ACTIVE or REOPENED
    side_effects:
    - suspends every Engagement of this matter in status ACTIVE -> SUSPENDED (conditional cascade; each suspension increments that Engagement.version by 1)
    - recompute posture (calc matter_posture)
    - increments Matter.version by 1
    note: 'Branching side-effect set differs by branch: this auto-transition suspends engagements, whereas manual resolve does not.'
  - from: SETTLEMENT_PENDING
    to: RESOLVED
    trigger: 'system: the linked SettlementRequest reaches EXECUTED (POST /litigation/settlement-requests/{id}/execute)'
    actor: system
    preconditions:
    - Matter.status == SETTLEMENT_PENDING
    side_effects:
    - sets Matter.resolution_type = SETTLEMENT and resolved_at
    - 'cascade: every LitigationHold of this matter in {DRAFT, ISSUED, ACKNOWLEDGED} -> RELEASED with release_reason = MATTER_RESOLVED'
    - 'cascade: every HoldCustodian of each released hold in {NOTICED, ACKNOWLEDGED, ESCALATED} -> RELEASED'
    - 'cascade: every VendorWorkOrder of this matter in {DRAFT, AUTHORIZED, IN_PROGRESS} -> CANCELLED, and each cancellation triggers vendor capacity release (calc vendor_capacity_rollup on the linked DiscoveryVendor)'
    - recompute reserve_amount_cents (calc reserve_recognition, post-resolution variant)
    - recompute posture (calc matter_posture)
    - increments Matter.version by 1
    note: 'Cascade order within the resolution is pinned: (1) VendorWorkOrders cancel first (releasing the hold pin and vendor capacity), (2) LitigationHolds release second, (3) HoldCustodians release third.
      This ordering makes the hold-release pin check vacuous during system-driven resolution.'
  - from: ACTIVE
    to: RESOLVED
    trigger: POST /litigation/matters/{id}/resolve
    actor: LitigationCounsel
    preconditions:
    - Matter.status in {ACTIVE, REOPENED}
    - resolution_type in {JUDGMENT, DISMISSAL, SUMMARY_JUDGMENT} (SETTLEMENT resolution flows only via the SETTLEMENT_PENDING auto-transition)
    - no Deadline of this matter has status == SCHEDULED with deadline_type == LIMITATION_EXPIRY (open limitation exposure must be vacated first)
    - acting user's X-User-ID == Matter.owning_counsel_id
    side_effects:
    - sets Matter.resolution_type and resolved_at
    - 'cascade: every LitigationHold in {DRAFT, ISSUED, ACKNOWLEDGED} -> RELEASED with release_reason = MATTER_RESOLVED'
    - 'cascade: every HoldCustodian under those holds in {NOTICED, ACKNOWLEDGED, ESCALATED} -> RELEASED'
    - 'cascade: every VendorWorkOrder in {DRAFT, AUTHORIZED, IN_PROGRESS} -> CANCELLED, releasing vendor capacity (calc vendor_capacity_rollup)'
    - 'cascade: every Deadline in SCHEDULED -> VACATED'
    - recompute reserve_amount_cents (post-resolution variant of calc reserve_recognition)
    - recompute posture (calc matter_posture)
    - increments Matter.version by 1
    note: 'Cascade order pinned identically to the settlement path: work orders cancel first (releasing hold pins and vendor capacity), then holds release, then custodians release, then SCHEDULED deadlines
      vacate.'
  - from: RESOLVED
    to: REOPENED
    trigger: POST /litigation/matters/{id}/reopen
    actor: DeputyGeneralCounsel
    preconditions:
    - Matter.status == RESOLVED
    - reopen_reason provided (non-empty string)
    - no PaymentRequest for this matter is in status DISBURSED with payment_status == CONFIRMED (a confirmed disbursed payment makes reopening impossible)
    side_effects:
    - clears resolved_at (null); resolution_type retained for audit
    - 'recompute reserve_amount_cents (calc reserve_recognition, reopened variant: reserve restored to full expected-loss value)'
    - recompute posture (calc matter_posture)
    - increments Matter.version by 1
    note: Cyclic transition RESOLVED -> REOPENED -> (assessment privileges) -> RESOLVED.
  - from: REOPENED
    to: ACTIVE
    trigger: POST /litigation/matters/{id}/activate
    actor: LitigationCounsel
    preconditions:
    - Matter.status == REOPENED
    - at least one Engagement has status in {ACTIVE, SUSPENDED}
    - acting user's X-User-ID == Matter.owning_counsel_id
    side_effects:
    - recompute posture (calc matter_posture)
    - increments Matter.version by 1
  - from: RESOLVED
    to: CLOSED
    trigger: POST /litigation/matters/{id}/close
    actor: LegalOperationsAnalyst
    preconditions:
    - Matter.status == RESOLVED
    - every LitigationHold of this matter has status == RELEASED
    - every VendorWorkOrder of this matter has status in {COMPLETED, CANCELLED}
    - every PaymentRequest of this matter has status in {DISBURSED, REJECTED, CANCELLED}
    - close_checklist_ack == true in the request payload
    side_effects:
    - increments Matter.version by 1
  - from: INTAKE
    to: CLOSED
    trigger: POST /litigation/matters/{id}/close
    actor: LegalOperationsAnalyst
    preconditions:
    - Matter.status == INTAKE
    - no Engagement, LitigationHold, VendorWorkOrder, SettlementRequest, or PaymentRequest exists for the matter
    - close_checklist_ack == true
    side_effects:
    - increments Matter.version by 1
    note: Early-exit branch for mistaken intake.
- entity: Engagement
  initial_state: PROPOSED
  terminal_states:
  - REJECTED
  - TERMINATED
  transitions:
  - from: PROPOSED
    to: APPROVED
    trigger: POST /litigation/engagements/{id}/approve
    actor: DeputyGeneralCounsel
    preconditions:
    - Engagement.status == PROPOSED
    - linked CounselFirm.panel_status == APPROVED
    - linked CounselFirm.conflict_check_status in {CLEARED, WAIVED}
    - linked Matter.status in {STAFFING, ACTIVE, REOPENED}
    - 'if fee_arrangement in {HOURLY, HYBRID}: proposed_rate_cents <= CounselFirm.blended_rate_cap_cents'
    - 'segregation of duties: approver X-User-ID != Engagement created-by (the owning counsel of the matter is considered the proposer; approver MUST NOT equal Matter.owning_counsel_id when engagement role_type
      == LEAD_COUNSEL)'
    side_effects:
    - sets approved_by_user_id
    - 'if supersedes_engagement_id is set: that Engagement transitions SUSPENDED-or-ACTIVE -> TERMINATED (compensation: prior engagement ends)'
    - increments Engagement.version by 1
  - from: APPROVED
    to: ACTIVE
    trigger: POST /litigation/engagements/{id}/activate
    actor: LitigationCounsel
    preconditions:
    - Engagement.status == APPROVED
    - engagement_letter_executed == true (set via PATCH before this call)
    - linked Matter.status in {STAFFING, ACTIVE, REOPENED}
    side_effects:
    - increments Engagement.version by 1
  - from: PROPOSED
    to: REJECTED
    trigger: POST /litigation/engagements/{id}/reject
    actor: DeputyGeneralCounsel
    preconditions:
    - Engagement.status == PROPOSED
    side_effects:
    - increments Engagement.version by 1
  - from: ACTIVE
    to: SUSPENDED
    trigger: 'system: Matter auto-transition to SETTLEMENT_PENDING; OR POST /litigation/engagements/{id}/suspend'
    actor: LitigationCounsel
    preconditions:
    - Engagement.status == ACTIVE
    side_effects:
    - increments Engagement.version by 1
  - from: SUSPENDED
    to: ACTIVE
    trigger: POST /litigation/engagements/{id}/reinstate
    actor: LitigationCounsel
    preconditions:
    - Engagement.status == SUSPENDED
    - linked Matter.status in {ACTIVE, REOPENED} (cannot reinstate while SETTLEMENT_PENDING)
    side_effects:
    - increments Engagement.version by 1
  - from: ACTIVE
    to: TERMINATED
    trigger: POST /litigation/engagements/{id}/terminate
    actor: DeputyGeneralCounsel
    preconditions:
    - Engagement.status in {ACTIVE, SUSPENDED}
    side_effects:
    - increments Engagement.version by 1
  - from: SUSPENDED
    to: TERMINATED
    trigger: POST /litigation/engagements/{id}/terminate
    actor: DeputyGeneralCounsel
    preconditions:
    - Engagement.status in {ACTIVE, SUSPENDED}
    side_effects:
    - increments Engagement.version by 1
  note: 'Branching machine: PROPOSED forks to APPROVED/REJECTED; ACTIVE <-> SUSPENDED is a cycle; TERMINATED reachable from two states.'
- entity: Budget
  initial_state: DRAFT
  terminal_states:
  - APPROVED
  - SUPERSEDED
  - REJECTED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /litigation/budgets/{id}/submit
    actor: LitigationCounsel
    preconditions:
    - Budget.status == DRAFT
    - linked Matter.status in {ASSESSMENT, STAFFING, ACTIVE, REOPENED}
    side_effects:
    - sets submitted_by_user_id
    - increments Budget.version by 1
  - from: SUBMITTED
    to: APPROVED
    trigger: POST /litigation/budgets/{id}/approve
    actor: FinanceBusinessPartner
    preconditions:
    - Budget.status == SUBMITTED
    - 'segregation of duties: approver X-User-ID != submitted_by_user_id'
    - no other Budget for the same matter is already APPROVED (unique-active invariant)
    - fy_budget_cents >= matter.accrued_to_date_cents (cannot approve a budget already exceeded by posted accruals)
    side_effects:
    - sets approved_by_user_id
    - 'if prior_version_id set: that Budget transitions APPROVED -> SUPERSEDED (cascade)'
    - increments Budget.version by 1
    - recompute Budget.utilization_pct from current matter accrued (calc budget_utilization)
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /litigation/budgets/{id}/reject
    actor: FinanceBusinessPartner
    preconditions:
    - Budget.status == SUBMITTED
    side_effects:
    - increments Budget.version by 1
  - from: APPROVED
    to: SUPERSEDED
    trigger: 'system: a new Budget with prior_version_id pointing here is approved'
    actor: system
    preconditions:
    - Budget.status == APPROVED
    side_effects:
    - increments Budget.version by 1
  note: Chain-of-supersession via self-FK gives a linear chain with auto-supersede cascade.
- entity: AccrualEntry
  initial_state: DRAFT
  terminal_states:
  - POSTED
  - VOID
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /litigation/accrual-entries/{id}/submit
    actor: LitigationCounsel
    preconditions:
    - AccrualEntry.status == DRAFT
    - linked Matter.status in {STAFFING, ACTIVE, REOPENED, SETTLEMENT_PENDING}
    - linked Engagement.status in {ACTIVE, SUSPENDED}
    - linked Matter.posture != FROZEN
    side_effects:
    - sets submitted_at
  - from: SUBMITTED
    to: POSTED
    trigger: POST /litigation/accrual-entries/{id}/post
    actor: FinanceBusinessPartner
    preconditions:
    - AccrualEntry.status == SUBMITTED
    - 'for entry_kind in {ACCRUAL, INVOICE}: no other POSTED entry exists for the same (engagement_id, period, entry_kind)'
    - 'for entry_kind == ADJUSTMENT: reverses_entry_id references a POSTED entry and |amount_cents| <= reversed entry amount_cents'
    side_effects:
    - 'ledger sync: Matter.accrued_to_date_cents += amount_cents (calc matter_accrual_rollup)'
    - 'if an APPROVED Budget exists for the matter: recompute Budget.utilization_pct (calc budget_utilization)'
    - 'if the matter''s APPROVED Budget utilization_pct crosses >= 90 on this posting: Matter.posture recompute (calc matter_posture) which may flip OPEN -> RESTRICTED (threshold trigger)'
  - from: SUBMITTED
    to: VOID
    trigger: POST /litigation/accrual-entries/{id}/void
    actor: FinanceBusinessPartner
    preconditions:
    - AccrualEntry.status == SUBMITTED
    side_effects: []
  - from: POSTED
    to: VOID
    trigger: 'system: an ADJUSTMENT entry reversing this entry posts'
    actor: system
    preconditions:
    - AccrualEntry.status == POSTED
    side_effects:
    - Matter.accrued_to_date_cents -= original amount_cents (compensating invariant with the ADJUSTMENT's credit)
  note: Append-only ledger entity with reversal (compensating) semantics.
- entity: LitigationHold
  initial_state: DRAFT
  terminal_states:
  - RELEASED
  transitions:
  - from: DRAFT
    to: ISSUED
    trigger: POST /litigation/holds/{id}/issue
    actor: LitigationCounsel
    preconditions:
    - LitigationHold.status == DRAFT
    - linked Matter.status in {ASSESSMENT, STAFFING, ACTIVE, REOPENED}
    - at least one HoldCustodian exists under this hold
    - Matter.posture != FROZEN
    side_effects:
    - sets issued_at
    - 'cascade: every HoldCustodian under this hold in NOTICED stays NOTICED with noticed_at refreshed'
    - increments LitigationHold.version by 1
  - from: ISSUED
    to: ACKNOWLEDGED
    trigger: 'system: every HoldCustodian under this hold is in {ACKNOWLEDGED, EXEMPTED} (bubble-up auto-transition)'
    actor: system
    preconditions:
    - LitigationHold.status == ISSUED
    - count of HoldCustodian in {NOTICED, ESCALATED} == 0
    - at least one HoldCustodian in ACKNOWLEDGED exists (an all-exempted hold cannot auto-acknowledge)
    side_effects:
    - increments LitigationHold.version by 1
    note: 'Compound/aggregate: parent state is a function of children states.'
  - from: ISSUED
    to: RELEASED
    trigger: POST /litigation/holds/{id}/release OR system on Matter resolution
    actor: LitigationCounsel
    preconditions:
    - LitigationHold.status in {ISSUED, ACKNOWLEDGED, DRAFT}
    - 'for manual release: release_reason provided'
    - no VendorWorkOrder references this hold with status in {AUTHORIZED, IN_PROGRESS} (work orders pin the hold)
    side_effects:
    - sets released_at, release_reason
    - 'cascade: every HoldCustodian in {NOTICED, ACKNOWLEDGED, ESCALATED} -> RELEASED'
    - increments LitigationHold.version by 1
  - from: ACKNOWLEDGED
    to: RELEASED
    trigger: POST /litigation/holds/{id}/release OR system on Matter resolution
    actor: LitigationCounsel
    preconditions:
    - LitigationHold.status in {ISSUED, ACKNOWLEDGED, DRAFT}
    - 'for manual release: release_reason provided'
    - no VendorWorkOrder references this hold with status in {AUTHORIZED, IN_PROGRESS}
    side_effects:
    - sets released_at, release_reason
    - 'cascade: every HoldCustodian in {NOTICED, ACKNOWLEDGED, ESCALATED} -> RELEASED'
    - increments LitigationHold.version by 1
  - from: DRAFT
    to: RELEASED
    trigger: POST /litigation/holds/{id}/release OR system on Matter resolution
    actor: LitigationCounsel
    preconditions:
    - LitigationHold.status in {ISSUED, ACKNOWLEDGED, DRAFT}
    - 'for manual release: release_reason provided'
    side_effects:
    - sets released_at, release_reason
    - increments LitigationHold.version by 1
- entity: HoldCustodian
  initial_state: NOTICED
  terminal_states:
  - RELEASED
  - EXEMPTED
  transitions:
  - from: NOTICED
    to: ACKNOWLEDGED
    trigger: POST /litigation/hold-custodians/{id}/acknowledge
    actor: StaffUser
    preconditions:
    - HoldCustodian.status == NOTICED
    - acting user's X-User-ID == HoldCustodian.staff_user_id (custodian acknowledges for self)
    - parent LitigationHold.status in {DRAFT, ISSUED}
    side_effects:
    - sets acknowledged_at
    - 'bubble-up: if this leaves zero custodians in {NOTICED, ESCALATED} and >= 1 in ACKNOWLEDGED, parent hold auto-transitions ISSUED -> ACKNOWLEDGED'
    - increments HoldCustodian.version by 1
  - from: ESCALATED
    to: ACKNOWLEDGED
    trigger: POST /litigation/hold-custodians/{id}/acknowledge
    actor: StaffUser
    preconditions:
    - HoldCustodian.status == ESCALATED
    - acting user's X-User-ID == HoldCustodian.staff_user_id
    - parent LitigationHold.status in {DRAFT, ISSUED}
    side_effects:
    - sets acknowledged_at
    - 'bubble-up: parent hold may auto-acknowledge per the same rule'
    - increments HoldCustodian.version by 1
  - from: NOTICED
    to: ESCALATED
    trigger: POST /litigation/hold-custodians/{id}/escalate
    actor: LitigationCounsel
    preconditions:
    - HoldCustodian.status == NOTICED
    - parent LitigationHold.status == ISSUED
    - current logical clock time >= noticed_at + 5 days (escalation cooling period)
    side_effects:
    - escalation_count += 1
    - increments HoldCustodian.version by 1
  - from: NOTICED
    to: EXEMPTED
    trigger: POST /litigation/hold-custodians/{id}/exempt
    actor: LitigationCounsel
    preconditions:
    - HoldCustodian.status in {NOTICED, ESCALATED}
    - exemption_reason provided
    side_effects:
    - 'bubble-up: parent hold may auto-acknowledge if this clears the last non-exempted pending custodian AND at least one ACKNOWLEDGED custodian exists; if all custodians are EXEMPTED, hold remains ISSUED
      (never auto-acknowledges)'
    - increments HoldCustodian.version by 1
  - from: ESCALATED
    to: EXEMPTED
    trigger: POST /litigation/hold-custodians/{id}/exempt
    actor: LitigationCounsel
    preconditions:
    - HoldCustodian.status in {NOTICED, ESCALATED}
    - exemption_reason provided
    side_effects:
    - increments HoldCustodian.version by 1
  note: Custodian sub-machine feeds the hold's compound state; ESCALATED is a re-notice loop NOTICED -> ESCALATED -> ACKNOWLEDGED.
- entity: VendorWorkOrder
  initial_state: DRAFT
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: DRAFT
    to: AUTHORIZED
    trigger: POST /litigation/work-orders/{id}/authorize
    actor: LegalOperationsAnalyst
    preconditions:
    - VendorWorkOrder.status == DRAFT
    - linked Matter.status in {ACTIVE, REOPENED}
    - Matter.posture == OPEN (RESTRICTED or FROZEN blocks new spend authorization — posture-driven gating)
    - linked LitigationHold.status in {ISSUED, ACKNOWLEDGED}
    - linked DiscoveryVendor.is_active == true
    - 'vendor clearance gate: if Matter.matter_type == CLASS_ACTION or REGULATORY, DiscoveryVendor.security_clearance_level == RESTRICTED; if EMPLOYMENT or IP, clearance in {ENHANCED, RESTRICTED}; COMMERCIAL
      and PRODUCT_LIABILITY accept any'
    - 'capacity gate: DiscoveryVendor.committed_gb + estimated_gb <= DiscoveryVendor.capacity_gb'
    - 'temporal conflict gate: no other VendorWorkOrder for the same vendor with status in {AUTHORIZED, IN_PROGRESS} has [scheduled_start, scheduled_end) overlapping this order''s window (half-open intervals;
      adjacency permitted)'
    side_effects:
    - 'ledger sync: DiscoveryVendor.committed_gb += estimated_gb (calc vendor_capacity_rollup)'
    - recompute estimated_cost_cents (calc work_order_cost)
    - increments VendorWorkOrder.version by 1
  - from: AUTHORIZED
    to: IN_PROGRESS
    trigger: POST /litigation/work-orders/{id}/start
    actor: LegalOperationsAnalyst
    preconditions:
    - VendorWorkOrder.status == AUTHORIZED
    - current logical clock time >= scheduled_start (cannot start early)
    - Matter.posture != FROZEN
    side_effects:
    - increments VendorWorkOrder.version by 1
  - from: IN_PROGRESS
    to: COMPLETED
    trigger: POST /litigation/work-orders/{id}/complete
    actor: LegalOperationsAnalyst
    preconditions:
    - VendorWorkOrder.status == IN_PROGRESS
    - actual_gb provided and >= 0
    side_effects:
    - 'ledger sync: DiscoveryVendor.committed_gb -= estimated_gb (release estimate)'
    - 'if actual_gb > 0: synthesis of an AccrualEntry is NOT automatic; cost flows through invoices only'
    - recompute estimated_cost_cents (final variant uses actual_gb when actual_gb > 0)
    - increments VendorWorkOrder.version by 1
  - from: DRAFT
    to: CANCELLED
    trigger: POST /litigation/work-orders/{id}/cancel OR system on Matter resolution
    actor: LegalOperationsAnalyst
    preconditions:
    - VendorWorkOrder.status in {DRAFT, AUTHORIZED, IN_PROGRESS}
    side_effects:
    - 'if previously AUTHORIZED or IN_PROGRESS: DiscoveryVendor.committed_gb -= estimated_gb (capacity release)'
    - increments VendorWorkOrder.version by 1
  - from: AUTHORIZED
    to: CANCELLED
    trigger: POST /litigation/work-orders/{id}/cancel OR system on Matter resolution
    actor: LegalOperationsAnalyst
    preconditions:
    - VendorWorkOrder.status in {DRAFT, AUTHORIZED, IN_PROGRESS}
    side_effects:
    - DiscoveryVendor.committed_gb -= estimated_gb
    - increments VendorWorkOrder.version by 1
  - from: IN_PROGRESS
    to: CANCELLED
    trigger: POST /litigation/work-orders/{id}/cancel OR system on Matter resolution
    actor: LegalOperationsAnalyst
    preconditions:
    - VendorWorkOrder.status in {DRAFT, AUTHORIZED, IN_PROGRESS}
    side_effects:
    - DiscoveryVendor.committed_gb -= estimated_gb
    - increments VendorWorkOrder.version by 1
- entity: SettlementRequest
  initial_state: DRAFT
  terminal_states:
  - EXECUTED
  - REJECTED
  - WITHDRAWN
  - EXPIRED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /litigation/settlement-requests/{id}/submit
    actor: LitigationCounsel
    preconditions:
    - SettlementRequest.status == DRAFT
    - linked Matter.status in {ACTIVE, REOPENED}
    - Matter.posture != FROZEN
    - acting user's X-User-ID == Matter.owning_counsel_id
    - settlement_kind != NON_MONETARY OR proposed_amount_cents == 1 (non-monetary settlements carry a nominal 1-cent amount)
    side_effects:
    - sets requested_by_user_id
    - snapshots authority_tier_at_submission = Matter.exposure_tier (version-pinning on approval)
    - increments SettlementRequest.version by 1
  - from: SUBMITTED
    to: UNDER_REVIEW
    trigger: POST /litigation/settlement-requests/{id}/begin-review
    actor: DeputyGeneralCounsel
    preconditions:
    - SettlementRequest.status == SUBMITTED
    side_effects:
    - increments SettlementRequest.version by 1
  - from: UNDER_REVIEW
    to: APPROVED
    trigger: POST /litigation/settlement-requests/{id}/approve
    actor: GeneralCounsel
    preconditions:
    - SettlementRequest.status == UNDER_REVIEW
    - 'authority routing: the active SettlementAuthorityPolicy row for authority_tier_at_submission names the approver_role; acting X-User-Role MUST equal that approver_role'
    - 'amount gate: proposed_amount_cents <= policy.max_single_amount_cents for single approval; if proposed_amount_cents > max_single_amount_cents, the call succeeds only when dual_approval_required_over_cents
      >= proposed_amount_cents and this is the FIRST of two approvals (approved_by_user_ids length goes 0 -> 1 and status stays UNDER_REVIEW)'
    - 'segregation of duties: acting X-User-ID NOT IN requested_by_user_id and NOT IN approved_by_user_ids'
    side_effects:
    - appends acting user id to approved_by_user_ids
    - 'when the required approval count is reached (1 for single-approval amounts, 2 for dual): status -> APPROVED and the linked Matter auto-transitions ACTIVE/REOPENED -> SETTLEMENT_PENDING with its engagement-suspension
      cascade'
    - increments SettlementRequest.version by 1
    note: First approval of a dual-approval request is a self-loop at the API level (status remains UNDER_REVIEW); modeled as the approve transition with a branch on approval count.
  - from: UNDER_REVIEW
    to: COUNTERED
    trigger: POST /litigation/settlement-requests/{id}/counter
    actor: DeputyGeneralCounsel
    preconditions:
    - SettlementRequest.status == UNDER_REVIEW
    - counter_amount_cents > 0 and counter_amount_cents != proposed_amount_cents
    side_effects:
    - sets counter_amount_cents
    - clears approved_by_user_ids to [] (approval chain resets on counter — negotiation round resets prior partial approvals)
    - increments SettlementRequest.version by 1
  - from: COUNTERED
    to: UNDER_REVIEW
    trigger: POST /litigation/settlement-requests/{id}/accept-counter
    actor: LitigationCounsel
    preconditions:
    - SettlementRequest.status == COUNTERED
    - acting user's X-User-ID == requested_by_user_id (the requesting counsel accepts the counter)
    side_effects:
    - proposed_amount_cents := counter_amount_cents (counter replaces the ask)
    - re-snapshots authority_tier_at_submission = current Matter.exposure_tier (re-pin after amount change)
    - increments SettlementRequest.version by 1
    note: 'Negotiation cycle: UNDER_REVIEW -> COUNTERED -> UNDER_REVIEW, repeatable.'
  - from: APPROVED
    to: EXECUTED
    trigger: POST /litigation/settlement-requests/{id}/execute
    actor: GeneralCounsel
    preconditions:
    - SettlementRequest.status == APPROVED
    - linked Matter.status == SETTLEMENT_PENDING
    - a PaymentRequest for this settlement_request_id exists with status == FINANCE_APPROVED (payment must be staged before execution)
    side_effects:
    - linked Matter auto-transitions SETTLEMENT_PENDING -> RESOLVED with its full cascade (holds release, custodians release, work orders cancel + vendor capacity release, reserve recompute)
    - increments SettlementRequest.version by 1
  - from: UNDER_REVIEW
    to: REJECTED
    trigger: POST /litigation/settlement-requests/{id}/reject
    actor: GeneralCounsel
    preconditions:
    - SettlementRequest.status in {UNDER_REVIEW, COUNTERED}
    side_effects:
    - increments SettlementRequest.version by 1
  - from: COUNTERED
    to: REJECTED
    trigger: POST /litigation/settlement-requests/{id}/reject
    actor: GeneralCounsel
    preconditions:
    - SettlementRequest.status in {UNDER_REVIEW, COUNTERED}
    side_effects:
    - increments SettlementRequest.version by 1
  - from: DRAFT
    to: WITHDRAWN
    trigger: POST /litigation/settlement-requests/{id}/withdraw
    actor: LitigationCounsel
    preconditions:
    - SettlementRequest.status in {DRAFT, SUBMITTED, UNDER_REVIEW, COUNTERED}
    - acting user's X-User-ID == requested_by_user_id OR status == DRAFT
    side_effects:
    - increments SettlementRequest.version by 1
  - from: SUBMITTED
    to: WITHDRAWN
    trigger: POST /litigation/settlement-requests/{id}/withdraw
    actor: LitigationCounsel
    preconditions:
    - SettlementRequest.status in {DRAFT, SUBMITTED, UNDER_REVIEW, COUNTERED}
    - acting user's X-User-ID == requested_by_user_id
    side_effects:
    - increments SettlementRequest.version by 1
  - from: UNDER_REVIEW
    to: WITHDRAWN
    trigger: POST /litigation/settlement-requests/{id}/withdraw
    actor: LitigationCounsel
    preconditions:
    - SettlementRequest.status in {DRAFT, SUBMITTED, UNDER_REVIEW, COUNTERED}
    - acting user's X-User-ID == requested_by_user_id
    side_effects:
    - increments SettlementRequest.version by 1
  - from: COUNTERED
    to: WITHDRAWN
    trigger: POST /litigation/settlement-requests/{id}/withdraw
    actor: LitigationCounsel
    preconditions:
    - SettlementRequest.status in {DRAFT, SUBMITTED, UNDER_REVIEW, COUNTERED}
    - acting user's X-User-ID == requested_by_user_id
    side_effects:
    - increments SettlementRequest.version by 1
  - from: SUBMITTED
    to: EXPIRED
    trigger: 'system: logical clock passes expires_at while status in {SUBMITTED, UNDER_REVIEW, COUNTERED}'
    actor: system
    preconditions:
    - SettlementRequest.status in {SUBMITTED, UNDER_REVIEW, COUNTERED}
    - current logical clock time > expires_at
    side_effects:
    - clears approved_by_user_ids to []
    - increments SettlementRequest.version by 1
  - from: UNDER_REVIEW
    to: EXPIRED
    trigger: 'system: logical clock passes expires_at'
    actor: system
    preconditions:
    - SettlementRequest.status in {SUBMITTED, UNDER_REVIEW, COUNTERED}
    - current logical clock time > expires_at
    side_effects:
    - clears approved_by_user_ids to []
    - increments SettlementRequest.version by 1
  - from: COUNTERED
    to: EXPIRED
    trigger: 'system: logical clock passes expires_at'
    actor: system
    preconditions:
    - SettlementRequest.status in {SUBMITTED, UNDER_REVIEW, COUNTERED}
    - current logical clock time > expires_at
    side_effects:
    - clears approved_by_user_ids to []
    - increments SettlementRequest.version by 1
  note: 'Heavily non-linear: negotiation cycle, dual-approval self-loop, withdraw from 4 states, system expiry from 3 states.'
- entity: PaymentRequest
  initial_state: DRAFT
  terminal_states:
  - DISBURSED
  - REJECTED
  - CANCELLED
  transitions:
  - from: DRAFT
    to: SUBMITTED
    trigger: POST /litigation/payment-requests/{id}/submit
    actor: LitigationCounsel
    preconditions:
    - PaymentRequest.status == DRAFT
    - linked Matter.status in {SETTLEMENT_PENDING, RESOLVED, ACTIVE, REOPENED}
    - 'if payment_kind == SETTLEMENT: linked SettlementRequest.status == APPROVED and amount_cents == SettlementRequest.proposed_amount_cents'
    - 'if payment_kind == JUDGMENT: Matter.status == RESOLVED and Matter.resolution_type == JUDGMENT'
    side_effects:
    - sets submitted_by_user_id
    - increments PaymentRequest.version by 1
  - from: SUBMITTED
    to: FINANCE_APPROVED
    trigger: POST /litigation/payment-requests/{id}/finance-approve
    actor: FinanceBusinessPartner
    preconditions:
    - PaymentRequest.status == SUBMITTED
    - 'segregation of duties: approver X-User-ID != submitted_by_user_id'
    - 'fiscal gate: amount_cents <= (matter APPROVED Budget.fy_budget_cents - Matter.accrued_to_date_cents) when an APPROVED Budget exists; if no APPROVED Budget exists the payment is rejected with ERR_NO_APPROVED_BUDGET'
    side_effects:
    - sets approved_by_user_id
    - increments PaymentRequest.version by 1
  - from: FINANCE_APPROVED
    to: DISBURSED
    trigger: POST /litigation/payment-requests/{id}/disburse
    actor: FinanceBusinessPartner
    preconditions:
    - PaymentRequest.status == FINANCE_APPROVED
    - payment_status == NOT_SENT (parallel dimension gate)
    side_effects:
    - sets disbursed_at; payment_status NOT_SENT -> SENT
    - 'ledger sync: Matter.accrued_to_date_cents += amount_cents (payments count as accrued spend)'
    - recompute Matter.reserve_amount_cents (post-payment reserve burn-down, calc reserve_recognition)
    - 'if payment_kind == SETTLEMENT: linked SettlementRequest remains APPROVED until execute; disbursement does not execute the settlement'
    - increments PaymentRequest.version by 1
  - from: SUBMITTED
    to: REJECTED
    trigger: POST /litigation/payment-requests/{id}/reject
    actor: FinanceBusinessPartner
    preconditions:
    - PaymentRequest.status == SUBMITTED
    side_effects:
    - increments PaymentRequest.version by 1
  - from: DRAFT
    to: CANCELLED
    trigger: POST /litigation/payment-requests/{id}/cancel
    actor: LitigationCounsel
    preconditions:
    - PaymentRequest.status in {DRAFT, SUBMITTED}
    - acting user's X-User-ID == submitted_by_user_id OR status == DRAFT
    side_effects:
    - increments PaymentRequest.version by 1
  - from: SUBMITTED
    to: CANCELLED
    trigger: POST /litigation/payment-requests/{id}/cancel
    actor: LitigationCounsel
    preconditions:
    - PaymentRequest.status in {DRAFT, SUBMITTED}
    - acting user's X-User-ID == submitted_by_user_id
    side_effects:
    - increments PaymentRequest.version by 1
  note: 'Parallel state dimensions: approval status (DRAFT..DISBURSED) x payment_status rail (NOT_SENT->SENT->CONFIRMED / RETURNED). Rail transitions below.'
- entity: PaymentRequest
  initial_state: NOT_SENT
  terminal_states:
  - CONFIRMED
  transitions:
  - from: NOT_SENT
    to: SENT
    trigger: 'system: disburse transition of the owning PaymentRequest'
    actor: system
    preconditions:
    - owning PaymentRequest.status transitions to DISBURSED
    side_effects:
    - increments owning PaymentRequest.version by 1
  - from: SENT
    to: CONFIRMED
    trigger: POST /litigation/payment-requests/{id}/confirm-receipt
    actor: FinanceBusinessPartner
    preconditions:
    - payment_status == SENT
    side_effects:
    - increments owning PaymentRequest.version by 1
  - from: SENT
    to: RETURNED
    trigger: POST /litigation/payment-requests/{id}/mark-returned
    actor: FinanceBusinessPartner
    preconditions:
    - payment_status == SENT
    side_effects:
    - 'compensation: Matter.accrued_to_date_cents -= amount_cents (returned payments unwind accrued spend)'
    - recompute Matter.reserve_amount_cents
    - increments owning PaymentRequest.version by 1
  - from: RETURNED
    to: SENT
    trigger: POST /litigation/payment-requests/{id}/redisburse
    actor: FinanceBusinessPartner
    preconditions:
    - payment_status == RETURNED
    - owning PaymentRequest.status == DISBURSED
    side_effects:
    - Matter.accrued_to_date_cents += amount_cents (re-accrue)
    - increments owning PaymentRequest.version by 1
  note: Parallel state dimension of PaymentRequest (payment_status rail), independent of the approval-status machine above. SENT<->RETURNED loop with accrual unwind/re-accrue is a compensating invariant.
  dimension: payment_status
- entity: Deadline
  initial_state: SCHEDULED
  terminal_states:
  - MET
  - VACATED
  - EXPIRED
  transitions:
  - from: SCHEDULED
    to: MET
    trigger: POST /litigation/deadlines/{id}/mark-met
    actor: LitigationCounsel
    preconditions:
    - Deadline.status == SCHEDULED
    - current logical clock time <= due_at (cannot mark met after the deadline passes — use miss flow)
    side_effects:
    - sets completed_at
    - increments Deadline.version by 1
  - from: SCHEDULED
    to: MISSED
    trigger: POST /litigation/deadlines/{id}/mark-missed OR system sweep when clock passes due_at
    actor: LitigationCounsel
    preconditions:
    - Deadline.status == SCHEDULED
    - current logical clock time > due_at for system sweep; manual mark-missed allowed any time (declaration of intent)
    side_effects:
    - 'if is_jurisdictional == true: Matter.posture flips to FROZEN (jurisdictional miss freeze; calc matter_posture) and remains FROZEN until the deadline is vacated with a court-order note'
    - increments Deadline.version by 1
  - from: MISSED
    to: VACATED
    trigger: POST /litigation/deadlines/{id}/vacate
    actor: DeputyGeneralCounsel
    preconditions:
    - Deadline.status in {SCHEDULED, MISSED}
    - 'if is_jurisdictional == true: caller MUST supply court_order_reference (non-empty)'
    side_effects:
    - 'if this deadline was the cause of a jurisdictional FROZEN posture: recompute Matter.posture (calc matter_posture) which may unfreeze'
    - increments Deadline.version by 1
  - from: SCHEDULED
    to: VACATED
    trigger: POST /litigation/deadlines/{id}/vacate OR system on Matter resolve
    actor: LitigationCounsel
    preconditions:
    - Deadline.status in {SCHEDULED, MISSED}
    - 'if is_jurisdictional == true: court_order_reference required (manual vacate only; system cascade on resolution bypasses it)'
    side_effects:
    - increments Deadline.version by 1
  - from: MISSED
    to: EXPIRED
    trigger: 'system: clock passes due_at + 30 days while still MISSED'
    actor: system
    preconditions:
    - Deadline.status == MISSED
    - current logical clock time > due_at + 30 days
    side_effects: []
- entity: CounselFirm
  initial_state: PENDING
  terminal_states:
  - TERMINATED
  transitions:
  - from: PENDING
    to: APPROVED
    trigger: POST /litigation/counsel-firms/{id}/approve-panel
    actor: GeneralCounsel
    preconditions:
    - CounselFirm.panel_status == PENDING
    - conflict_check_status == CLEARED or WAIVED (set via POST /litigation/counsel-firms/{id}/conflict-check)
    side_effects:
    - increments CounselFirm.version by 1
  - from: APPROVED
    to: SUSPENDED
    trigger: POST /litigation/counsel-firms/{id}/suspend
    actor: GeneralCounsel
    preconditions:
    - CounselFirm.panel_status == APPROVED
    side_effects:
    - 'conditional cascade: every Engagement referencing this firm in status ACTIVE -> SUSPENDED (firm suspension propagates to engagements)'
    - increments CounselFirm.version by 1
  - from: SUSPENDED
    to: APPROVED
    trigger: POST /litigation/counsel-firms/{id}/reinstate
    actor: GeneralCounsel
    preconditions:
    - CounselFirm.panel_status == SUSPENDED
    side_effects:
    - increments CounselFirm.version by 1
    note: Cycle APPROVED -> SUSPENDED -> APPROVED. Engagements suspended by the cascade do NOT auto-reinstate; each must be reinstated individually.
  - from: APPROVED
    to: TERMINATED
    trigger: POST /litigation/counsel-firms/{id}/terminate
    actor: GeneralCounsel
    preconditions:
    - CounselFirm.panel_status in {APPROVED, SUSPENDED}
    - no Engagement referencing this firm is in status ACTIVE or APPROVED (must terminate engagements first)
    side_effects:
    - increments CounselFirm.version by 1
  - from: SUSPENDED
    to: TERMINATED
    trigger: POST /litigation/counsel-firms/{id}/terminate
    actor: GeneralCounsel
    preconditions:
    - CounselFirm.panel_status in {APPROVED, SUSPENDED}
    - no Engagement referencing this firm is in status ACTIVE or APPROVED
    side_effects:
    - increments CounselFirm.version by 1
concurrency_rules:
- rule_id: budget-create-stale-matter
  parent_entity: Matter
  write_endpoint: POST /litigation/matters/{id}/budgets
  occ_field: expected_matter_version
  description: 'Creating a revised Budget (one carrying prior_version_id) against a

    Matter whose version has advanced since the client last observed it is

    rejected: another writer may have legitimately had a budget approved in

    the interim (which supersedes the client''s assumed head-of-chain), so

    the client''s view of the budget chain is stale.

    '
  error_id: ERR_STALE_MATTER_VERSION
  http_status: 412
- rule_id: settlement-create-stale-matter
  parent_entity: Matter
  write_endpoint: POST /litigation/matters/{id}/settlement-requests
  occ_field: expected_matter_version
  description: 'Creating a SettlementRequest against a Matter whose version has advanced

    since the client last observed it is rejected: another writer may have

    legitimately submitted a settlement (which snapshots the exposure tier

    and re-pins authority), so the client''s view of the matter is stale.

    '
  error_id: ERR_STALE_MATTER_VERSION
  http_status: 412
calculations:
- name: exposure_tier_classification
  trigger: on Matter create; on any update to exposure_low_cents / exposure_high_cents / probability_of_loss_pct; on reopen
  algorithm: threshold
  formula: 'expected_loss = (exposure_low_cents + exposure_high_cents) / 2 * (probability_of_loss_pct / 100)

    # integer math: expected_loss_cents = ((low + high) * prob) / 200  (floor division on integer cents)

    if expected_loss_cents < TIER1_MAX: tier = TIER_1

    elif expected_loss_cents < TIER2_MAX: tier = TIER_2

    elif expected_loss_cents < TIER3_MAX: tier = TIER_3

    else: tier = TIER_4

    '
  input_set: the single Matter row
  constants:
    TIER1_MAX: 25000000
    TIER2_MAX: 100000000
    TIER3_MAX: 500000000
  precision: integer cents; midpoint uses floor division; boundary uses strict less-than so expected_loss exactly == TIER1_MAX lands in TIER_2
  variants:
  - name: conservative
    when: matter_type == CLASS_ACTION or REGULATORY
    difference: 'uses exposure_high_cents alone (not the midpoint): expected_loss_cents = exposure_high_cents * prob / 100; a CLASS_ACTION matter therefore tiers higher than a COMMERCIAL matter with identical
      numbers'
- name: reserve_recognition
  trigger: on exposure_tier_classification recompute; on every AccrualEntry POSTED/VOID; on Matter resolve and reopen
  algorithm: forward_looking
  formula: '# Evaluation order is pinned: (1) base from tier table, (2) probability scale,

    # (3) subtract accrued, (4) floor at zero, (5) apply variant adjustment LAST.

    base = { TIER_1: 500000, TIER_2: 2500000, TIER_3: 10000000, TIER_4: 50000000 }[exposure_tier]

    scaled = base * probability_of_loss_pct / 100     # floor division, integer cents

    provisional_reserve = max(0, scaled - accrued_to_date_cents)

    '
  input_set: the single Matter row plus its POSTED AccrualEntry sum
  constants:
    TIER_1_BASE: 500000
    TIER_2_BASE: 2500000
    TIER_3_BASE: 10000000
    TIER_4_BASE: 50000000
  precision: integer cents; floor division; max() floor at zero
  variants:
  - name: post_resolution
    when: Matter.status == RESOLVED
    difference: reserve = max(0, staged_payments_cents - accrued_to_date_cents) where staged_payments_cents = sum(amount_cents over the matter's PaymentRequests with status == FINANCE_APPROVED); a resolved
      matter carries reserve only for staged-but-undisbursed payments
  - name: reopened
    when: Matter.status == REOPENED
    difference: the accrued subtraction is skipped (reserve = scaled, full restoration) because historical spend is treated as sunk after reopen
- name: matter_accrual_rollup
  trigger: on AccrualEntry transitions to POSTED and on VOID of a POSTED entry; on PaymentRequest disburse and mark-returned/redisburse
  algorithm: aggregation
  formula: "accrued_to_date_cents =\n    sum(amount_cents over AccrualEntry where matter_id == matter.id and status == POSTED)\n  + sum(amount_cents over PaymentRequest where matter_id == matter.id and\
    \ status == DISBURSED and payment_status in {SENT, CONFIRMED})\n"
  input_set: POSTED AccrualEntry rows (DRAFT/SUBMITTED/VOID excluded) + DISBURSED PaymentRequests whose payment_status is SENT or CONFIRMED (RETURNED excluded — returned payments unwind)
  constants: {}
  precision: integer cents; exact
  variants: []
- name: budget_utilization
  trigger: on matter_accrual_rollup recompute while an APPROVED Budget exists; on Budget approval
  algorithm: threshold
  formula: 'utilization_pct = floor(accrued_to_date_cents * 100 / fy_budget_cents)

    # floor toward zero; 89999/100000 -> 89 not 90

    '
  input_set: the matter's single APPROVED Budget and Matter.accrued_to_date_cents
  constants:
    UTILIZATION_RESTRICT_THRESHOLD: 90
    UTILIZATION_FROZEN_THRESHOLD: 100
  precision: integer percent, floor division; crossing boundary is >= (utilization exactly 90 triggers RESTRICTED)
  variants: []
- name: matter_posture
  trigger: on every Matter state transition; on budget_utilization crossing; on jurisdictional Deadline MISS/VACATE
  algorithm: constraint_propagation
  formula: '# Evaluation order pinned top-to-bottom; first match wins (precedence ladder).

    if any Deadline of the matter has is_jurisdictional == true and status == MISSED: posture = FROZEN

    elif Matter.status in {RESOLVED, CLOSED}: posture = FROZEN

    elif Matter.status in {INTAKE, ASSESSMENT, SETTLEMENT_PENDING}: posture = RESTRICTED

    elif an APPROVED Budget exists and utilization_pct >= UTILIZATION_FROZEN_THRESHOLD: posture = FROZEN

    elif an APPROVED Budget exists and utilization_pct >= UTILIZATION_RESTRICT_THRESHOLD: posture = RESTRICTED

    else: posture = OPEN

    '
  input_set: Matter row, its Deadline rows (is_jurisdictional+status), its APPROVED Budget utilization
  constants:
    UTILIZATION_RESTRICT_THRESHOLD: 90
    UTILIZATION_FROZEN_THRESHOLD: 100
  precision: deterministic precedence ladder; jurisdictional freeze beats budget freeze beats status restriction
  variants: []
- name: vendor_capacity_rollup
  trigger: on VendorWorkOrder authorize, complete, cancel
  algorithm: aggregation
  formula: "committed_gb = sum(estimated_gb over VendorWorkOrder where vendor_id == vendor.id\n                   and status in {AUTHORIZED, IN_PROGRESS})\n"
  input_set: VendorWorkOrders in {AUTHORIZED, IN_PROGRESS} only (DRAFT, COMPLETED, CANCELLED excluded)
  constants: {}
  precision: integer GB; exact
  variants: []
- name: work_order_cost
  trigger: on VendorWorkOrder create (provisional) and complete (final)
  algorithm: tiered_pricing
  formula: "# Tiered per-GB rate: first TIER_A_GB at full rate, next (TIER_B_GB - TIER_A_GB) at DISCOUNT_B, beyond at DISCOUNT_C.\n# Marginal rate allocation, integer cents, per-tier floor division in order\
    \ tier A -> B -> C.\nprovisional_cost(v_gb, rate):\n  a = min(v_gb, TIER_A_GB);           cost = a * rate\n  b = min(max(v_gb - TIER_A_GB, 0), TIER_B_GB - TIER_A_GB); cost += floor(b * rate * DISCOUNT_B_PCT\
    \ / 100)\n  c = max(v_gb - TIER_B_GB, 0);       cost += floor(c * rate * DISCOUNT_C_PCT / 100)\n  return cost\nestimated_cost_cents = provisional_cost(estimated_gb, rate_per_gb_cents)\n"
  input_set: the single VendorWorkOrder row
  constants:
    TIER_A_GB: 100
    TIER_B_GB: 500
    DISCOUNT_B_PCT: 80
    DISCOUNT_C_PCT: 60
  precision: 'integer cents; floor division applied per tier BEFORE summing (pinned rounding order: round-per-tier then sum)'
  variants:
  - name: final
    when: on completion with actual_gb > 0
    difference: uses actual_gb instead of estimated_gb; when actual_gb == 0 the estimate stands (no cost basis)
- name: settlement_authority_routing
  trigger: on SettlementRequest approve call
  algorithm: topological
  formula: 'role_rank = { LitigationCounsel: 0, DeputyGeneralCounsel: 1, GeneralCounsel: 2, ChiefFinancialOfficer: 3, BoardCommittee: 4 }

    policy = active SettlementAuthorityPolicy where tier == authority_tier_at_submission

    required_approvals = 1 if proposed_amount_cents <= policy.max_single_amount_cents else 2

    # For dual approval the second approver MUST have role_rank strictly greater than the first approver''s rank.

    # Tie-break / determinism: approval order is the order of successful approve calls; duplicate approver rejected by SoD.

    '
  input_set: the SettlementRequest, the active SettlementAuthorityPolicy for its snapshot tier
  constants: {}
  precision: 'amount boundary: proposed_amount_cents exactly == max_single_amount_cents requires only ONE approval (<= boundary); one cent over requires two'
  variants: []
- name: portfolio_outcome_analytics
  trigger: on GET /litigation/reports/portfolio
  algorithm: aggregation
  formula: "For each matter cohort (grouped by exposure_tier, filtered by optional query params):\n  resolved_count = count(Matter status in {RESOLVED, CLOSED})\n  total_accrued_cents = sum(accrued_to_date_cents\
    \ over cohort)\n  avg_exposure_cents = floor(mean of (exposure_low_cents + exposure_high_cents)/2 over cohort)\n  outcome_favorability_pct = floor(100 * count(resolution_type in {DISMISSAL, SUMMARY_JUDGMENT})\
    \ / resolved_count) when resolved_count > 0 else 0\nPortfolio totals: open_exposure_cents = sum over matters with status in {STAFFING, ACTIVE, REOPENED, SETTLEMENT_PENDING} of exposure_high_cents\n"
  input_set: all Matters; cohort filter from query params matter_type? and exposure_tier?; RESOLVED includes CLOSED
  constants: {}
  precision: integer cents and integer percent; floor division; empty cohort returns zeros, not nulls
  variants: []
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and names a declared role; X-User-ID header present and well-formed
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all endpoints
- priority: 2
  category: auth
  check: acting role is permitted for this endpoint per §1.5 roles list
  error_id: ERR_FORBIDDEN_ROLE
  http_status: 403
  applies_to: all endpoints
- priority: 3
  category: existence
  check: path-templated resources exist, validated left-to-right (matter, then child); non-existent id -> not found
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path ids
- priority: 4
  category: existence
  check: body-referenced FK targets exist (firm_id, vendor_id, hold_id, settlement_request_id, staff ids, supersedes/prior/reverses ids)
  error_id: ERR_REFERENCE_NOT_FOUND
  http_status: 404
  applies_to: create/update endpoints carrying FK body fields
- priority: 5
  category: state
  check: target resource is in a state from which the invoked transition exists in §1.2 (invalid-from rejection)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  category: state
  check: 'owner-gated matter operations: acting X-User-ID == Matter.owning_counsel_id where required by the transition'
  error_id: ERR_NOT_MATTER_OWNER
  http_status: 403
  applies_to: matter submit-assessment, advance-to-staffing, activate, resolve; settlement submit
- priority: 7
  category: auth
  check: 'segregation of duties on approval endpoints: the acting X-User-ID MUST differ from the record''s submitter/requester (budget submitted_by_user_id, payment submitted_by_user_id, settlement requested_by_user_id
    and prior approvers) and, for LEAD_COUNSEL engagement approvals, from the matter''s owning_counsel_id'
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: budget approve, payment finance-approve, settlement approve, engagement approve
- priority: 8
  category: business_safety
  check: 'litigation-hold compliance: operations that create/modify discovery or deadline data on a matter with an unacknowledged ISSUED hold still proceed, but releasing a hold or resolving a matter checks
    hold/custodian/payment pins (release blocked by active work orders; close blocked by unreleased holds)'
  error_id: ERR_HOLD_COMPLIANCE_BLOCK
  http_status: 409
  applies_to: hold release, matter resolve, matter close
- priority: 9
  category: business_safety
  check: 'posture gate: Matter.posture == FROZEN blocks accrual submit, work-order start, hold issue, settlement submit; posture in {RESTRICTED, FROZEN} blocks work-order authorize'
  error_id: ERR_MATTER_POSTURE_FROZEN
  http_status: 409
  applies_to: accrual submit, work-order authorize/start, hold issue, settlement submit
- priority: 10
  category: business_safety
  check: 'vendor clearance gate: DiscoveryVendor.security_clearance_level sufficient for Matter.matter_type per the work-order authorize transition''s clearance matrix'
  error_id: ERR_VENDOR_CLEARANCE_INSUFFICIENT
  http_status: 422
  applies_to: POST /litigation/work-orders/{id}/authorize
- priority: 11
  category: business_constraint
  check: 'field-shape constraints: enums in declared sets; exposure_high_cents >= exposure_low_cents; probability 0..100; scheduled_end strictly after scheduled_start; fy_budget_cents <= lifecycle_budget_cents;
    contingency_pct 1..40; positive amount fields > 0'
  error_id: ERR_FIELD_CONSTRAINT
  http_status: 422
  applies_to: create/update endpoints
- priority: 12
  category: business_constraint
  check: 'uniqueness: StaffUser.email unique; SettlementAuthorityPolicy.tier unique among is_active rows; at most one POSTED AccrualEntry per (engagement_id, period, entry_kind); HoldCustodian unique per
    (hold_id, staff_user_id)'
  error_id: ERR_DUPLICATE
  http_status: 409
  applies_to: create endpoints for those entities; accrual post
- priority: 13
  category: business_temporal
  check: 'work-order authorize temporal conflict: no overlapping [scheduled_start, scheduled_end) among AUTHORIZED/IN_PROGRESS orders of the same vendor (half-open; adjacency allowed); start not before
    scheduled_start; escalation cooling period of 5 days after noticed_at'
  error_id: ERR_SCHEDULE_CONFLICT
  http_status: 409
  applies_to: work-order authorize, work-order start, custodian escalate
- priority: 14
  category: business_temporal
  check: 'deadline timing: mark-met requires clock <= due_at; system MISS sweep fires only when clock > due_at; EXPIRED sweep only when clock > due_at + 30 days; settlement expiry sweep when clock > expires_at'
  error_id: ERR_DEADLINE_TIMING
  http_status: 409
  applies_to: deadline mark-met; (documented for sweep semantics)
- priority: 15
  category: business_referential
  check: 'cross-entity referential integrity: work-order hold_id must reference a hold OF THE SAME MATTER in {ISSUED, ACKNOWLEDGED}; payment settlement_request_id must belong to the same matter; budget
    prior_version_id must reference a budget OF THE SAME MATTER; engagement supersedes_engagement_id must reference an engagement OF THE SAME MATTER'
  error_id: ERR_CROSS_REFERENCE_MISMATCH
  http_status: 422
  applies_to: create endpoints carrying those FKs; work-order authorize
- priority: 16
  category: business_referential
  check: 'clearance/panel state references: engagement approve requires firm panel_status APPROVED and conflict_check_status in {CLEARED, WAIVED}; firm terminate requires no ACTIVE/APPROVED engagements'
  error_id: ERR_REFERENCE_STATE_INVALID
  http_status: 409
  applies_to: engagement approve; firm terminate
- priority: 17
  category: business_fiscal
  check: 'rate cap: HOURLY/HYBRID engagement proposed_rate_cents <= firm blended_rate_cap_cents'
  error_id: ERR_RATE_CAP_EXCEEDED
  http_status: 422
  applies_to: engagement create/approve
- priority: 18
  category: business_fiscal
  check: 'vendor capacity: committed_gb + estimated_gb <= capacity_gb on work-order authorize'
  error_id: ERR_VENDOR_CAPACITY_EXCEEDED
  http_status: 422
  applies_to: work-order authorize
- priority: 19
  category: business_fiscal
  check: 'settlement authority: approver role matches policy for snapshot tier; amount within max_single_amount_cents or dual path engaged'
  error_id: ERR_SETTLEMENT_AUTHORITY
  http_status: 403
  applies_to: settlement approve
- priority: 20
  category: business_fiscal
  check: 'budget fiscal gates: budget approve requires fy_budget_cents >= matter.accrued_to_date_cents and no other APPROVED budget for the matter; payment finance-approve requires amount <= fy_budget_cents
    - accrued_to_date_cents and an APPROVED budget to exist'
  error_id: ERR_BUDGET_EXCEEDED
  http_status: 422
  applies_to: budget approve; payment finance-approve
- priority: 21
  category: business_fiscal
  check: no APPROVED Budget exists when one is required (matter activate, payment finance-approve)
  error_id: ERR_NO_APPROVED_BUDGET
  http_status: 409
  applies_to: matter activate; payment finance-approve
- priority: 22
  category: state
  check: 'OCC: expected_matter_version matches Matter.version on version-guarded create endpoints'
  error_id: ERR_STALE_MATTER_VERSION
  http_status: 412
  applies_to: POST /litigation/matters/{id}/budgets, POST /litigation/matters/{id}/settlement-requests
- priority: 23
  category: business_constraint
  check: 'request shape: missing required field, empty-string where non-empty required, undeclared field in the body (fields not in the endpoint''s §1.5 input list — including computed/system fields like
    posture, exposure_tier, accrued_to_date_cents, id, version — are rejected), or malformed scalar type'
  error_id: ERR_INVALID_REQUEST
  http_status: 400
  applies_to: all endpoints
- priority: 24
  category: state
  check: engagement activate requires engagement_letter_executed == true
  error_id: ERR_ENGAGEMENT_LETTER_REQUIRED
  http_status: 409
  applies_to: POST /litigation/engagements/{id}/activate
- priority: 25
  category: state
  check: matter activate requires at least one ACTIVE engagement (STAFFING path) or ACTIVE/SUSPENDED (REOPENED path)
  error_id: ERR_NO_ACTIVE_ENGAGEMENT
  http_status: 409
  applies_to: POST /litigation/matters/{id}/activate
- priority: 26
  category: state
  check: matter resolve blocked while a LIMITATION_EXPIRY deadline is SCHEDULED
  error_id: ERR_OPEN_LIMITATION_EXPOSURE
  http_status: 409
  applies_to: POST /litigation/matters/{id}/resolve
- priority: 27
  category: state
  check: hold-custodian acknowledge requires acting X-User-ID == custodian staff_user_id
  error_id: ERR_CUSTODIAN_SELF_ACK_REQUIRED
  http_status: 403
  applies_to: POST /litigation/hold-custodians/{id}/acknowledge
- priority: 28
  category: state
  check: matter reopen blocked while a DISBURSED payment with payment_status CONFIRMED exists
  error_id: ERR_REOPEN_BLOCKED_BY_CONFIRMED_PAYMENT
  http_status: 409
  applies_to: POST /litigation/matters/{id}/reopen
- priority: 29
  category: state
  check: payment rail transition invalid from current payment_status
  error_id: ERR_PAYMENT_RAIL_STATE
  http_status: 409
  applies_to: payment confirm-receipt, mark-returned, redisburse
