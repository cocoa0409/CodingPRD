          assert:
            - "captured sale_st == RETURNED"
            - "captured cl_st == DENIED (open-claim cascade; denied_at stamped at the return clock)"
            - "captured a_comm == 0 (committed units restored to the allocation reservation)"
            - "captured ch_ar == 0.0 (denominator excludes RETURNED sales; empty denominator yields 0.0000)"

