# =============================================================================
# Truancy & Attendance-Intervention Program — seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  895. Truancy & Attendance-Intervention Program: attendance-threshold trigger &
  referral, intervention tier & conference, attendance contract & plan,
  court/citation escalation, service referral (mentor/counseling), compliance
  monitoring, re-engagement, reporting

domain_name: truancy-attendance-intervention
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - dual_variant_calculation
  entity_topology: hybrid
  # Student and Case are aggregate roots; attendance records nest under student;
  # conferences/contracts/referrals/citations/compliance-checks nest under case.
  state_machine_shape: parallel
  # TruancyCase carries two independent dimensions (tier × status); Contract is
  # cyclic (BREACHED→ACTIVE cure loop).
  relationship_patterns:
    - one_to_many
    - cross_aggregate      # Case.assigned_staff_id crosses into the Staff aggregate
  role_model: hierarchical_override
  # Administrator is a superset; AttendanceClerk / CaseManager / CourtOfficer own
  # disjoint operation sets below it.
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: School
    parent: null
    common_fields: true            # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "School / district office name" }
      - { name: tier1_unexcused_threshold, type: integer, source: input, description: "Unexcused-absence count that opens a case at TIER_1", default: 3 }
      - { name: tier2_unexcused_threshold, type: integer, source: input, description: "Unexcused-absence count for TIER_2", default: 6 }
      - { name: tier3_unexcused_threshold, type: integer, source: input, description: "Unexcused-absence count for TIER_3", default: 10 }
      - { name: court_unexcused_threshold, type: integer, source: input, description: "Unexcused-absence count for COURT_REFERRED tier", default: 15 }
      - { name: required_instructional_days, type: integer, source: input, description: "Denominator for the official (enrolled-days) attendance rate", default: 180 }
      - { name: chronic_absence_pct_threshold, type: number, source: input, description: "Absence-percentage at/above which a student is chronically absent", default: 10.0 }

  - name: Staff
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id" }
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: role_type, type: enum, source: input, description: "CASE_MANAGER | OFFICER | COUNSELOR", constraints: "one of CASE_MANAGER, OFFICER, COUNSELOR" }
      - { name: max_caseload, type: integer, source: input, description: "Maximum number of non-terminal cases assignable to this staff", default: 25 }
      - { name: active_caseload, type: integer, source: computed, description: "Count of TruancyCase with assigned_staff_id==this.id AND status IN {OPEN, MONITORING}" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: grade_level, type: integer, source: input, description: "Grade 0-12; grade_level<=5 is ELEMENTARY band, else SECONDARY", constraints: "0..12" }
      - { name: enrollment_status, type: enum, source: system, description: "ENROLLED | WITHDRAWN | GRADUATED; starts ENROLLED", constraints: "one of ENROLLED, WITHDRAWN, GRADUATED" }
      - { name: present_count, type: integer, source: computed, description: "Count of AttendanceRecord with status==PRESENT (VOIDED excluded)" }
      - { name: tardy_count, type: integer, source: computed, description: "Count of AttendanceRecord with status==TARDY" }
      - { name: excused_count, type: integer, source: computed, description: "Count of AttendanceRecord with status==EXCUSED" }
      - { name: unexcused_count, type: integer, source: computed, description: "Count of AttendanceRecord with status==UNEXCUSED (drives tier thresholds)" }
      - { name: attendance_rate_recorded, type: number, source: computed, description: "Recorded-basis attendance %; null when no non-voided records exist (see calc student_attendance_rate)" }
      - { name: attendance_rate_official, type: number, source: computed, description: "Enrolled-days-basis attendance % over required_instructional_days (see calc student_attendance_rate)" }
      - { name: chronic_absent, type: boolean, source: computed, description: "True when absence % over required_instructional_days >= school.chronic_absence_pct_threshold" }

  - name: AttendanceRecord
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id" }
      - { name: attendance_date, type: string, source: input, description: "ISO date (YYYY-MM-DD); unique per student", constraints: "unique (student_id, attendance_date)" }
      - { name: status, type: enum, source: input, description: "PRESENT | TARDY | EXCUSED | UNEXCUSED | VOIDED; VOIDED reachable only via reclassify", constraints: "input one of PRESENT, TARDY, EXCUSED, UNEXCUSED" }

  - name: TruancyCase
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: assigned_staff_id, type: string, source: system, description: "FK -> Staff.id; null until assigned" }
      - { name: tier, type: enum, source: system, description: "NONE | TIER_1 | TIER_2 | TIER_3 | COURT_REFERRED; monotonically non-decreasing", constraints: "one of NONE, TIER_1, TIER_2, TIER_3, COURT_REFERRED" }
      - { name: status, type: enum, source: system, description: "OPEN | MONITORING | RESOLVED | CLOSED (independent dimension from tier)", constraints: "one of OPEN, MONITORING, RESOLVED, CLOSED" }
      - { name: unexcused_at_open, type: integer, source: system, description: "Snapshot of student.unexcused_count when the case opened" }
      - { name: breach_count, type: integer, source: computed, description: "Count of AttendanceContract under this case that have entered BREACHED at least once", default: 0 }

  - name: Conference
    parent: TruancyCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> TruancyCase.id" }
      - { name: scheduled_start, type: string, source: input, description: "ISO 8601 UTC start of the intervention conference" }
      - { name: scheduled_end, type: string, source: input, description: "ISO 8601 UTC end; must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | NO_SHOW | CANCELLED; starts SCHEDULED", constraints: "one of SCHEDULED, HELD, NO_SHOW, CANCELLED" }
      - { name: outcome, type: string, source: input, description: "Free-text outcome note captured on HELD/NO_SHOW", default: null }

  - name: AttendanceContract
    parent: TruancyCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> TruancyCase.id" }
      - { name: start_date, type: string, source: input, description: "ISO date the plan takes effect" }
      - { name: end_date, type: string, source: input, description: "ISO date the plan ends; must be > start_date" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | BREACHED | FULFILLED | CANCELLED; starts PROPOSED", constraints: "one of PROPOSED, ACTIVE, BREACHED, FULFILLED, CANCELLED" }
      - { name: goals, type: array, source: input, description: "Array of goal objects {goal_id(system), description, weight(int>0), target_value(number>0), met_value(number, default 0)}" }
      - { name: compliance_score_actual, type: number, source: computed, description: "Actual weighted compliance % (see calc contract_compliance_score); null when goals empty" }
      - { name: compliance_score_projected, type: number, source: computed, description: "Projected weighted compliance %, unmet goals assumed fully met (see calc contract_compliance_score)" }

  - name: ServiceReferral
    parent: TruancyCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> TruancyCase.id" }
      - { name: service_type, type: enum, source: input, description: "MENTOR | COUNSELING | HEALTH | OTHER", constraints: "one of MENTOR, COUNSELING, HEALTH, OTHER" }
      - { name: provider_name, type: string, source: input, description: "Referred provider name", default: "UNASSIGNED" }
      - { name: status, type: enum, source: system, description: "REFERRED | ACCEPTED | IN_PROGRESS | COMPLETED | NO_SHOW | DECLINED; starts REFERRED", constraints: "one of REFERRED, ACCEPTED, IN_PROGRESS, COMPLETED, NO_SHOW, DECLINED" }
      - { name: auto_created, type: boolean, source: system, description: "True when synthesized by the TIER_2 escalation cascade", default: false }

  - name: CourtCitation
    parent: TruancyCase
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> TruancyCase.id" }
      - { name: courtroom_id, type: string, source: input, description: "Client-supplied courtroom code; overlap resource grouping key (NOT a foreign key)" }
      - { name: hearing_start, type: string, source: input, description: "ISO 8601 UTC hearing start" }
      - { name: hearing_end, type: string, source: input, description: "ISO 8601 UTC hearing end; must be > hearing_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HEARD | DISMISSED | WITHDRAWN; starts SCHEDULED", constraints: "one of SCHEDULED, HEARD, DISMISSED, WITHDRAWN" }
      - { name: disposition, type: string, source: input, description: "Hearing disposition text, required on HEARD", default: null }

  - name: ComplianceCheck
    parent: TruancyCase
    common_fields: false           # append-only event: id, created_at only
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> TruancyCase.id" }
      - { name: check_date, type: string, source: input, description: "ISO date the monitoring review occurred" }
      - { name: result, type: enum, source: input, description: "COMPLIANT | NON_COMPLIANT", constraints: "one of COMPLIANT, NON_COMPLIANT" }
      - { name: notes, type: string, source: input, description: "Reviewer notes", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Student
    initial_state: ENROLLED
    terminal_states: [GRADUATED]
    transitions:
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /students/{id}/enrollment {to_status: WITHDRAWN}"
        actor: Administrator
        preconditions: []
        side_effects: ["attendance/case mutating ops now rejected with ERR_STUDENT_NOT_ENROLLED"]
      - from: WITHDRAWN
        to: ENROLLED
        trigger: "POST /students/{id}/enrollment {to_status: ENROLLED}"
        actor: Administrator
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: GRADUATED
        trigger: "POST /students/{id}/enrollment {to_status: GRADUATED}"
        actor: Administrator
        preconditions: []
        side_effects: []

  - entity: AttendanceRecord
    initial_state: "(created status: PRESENT | TARDY | EXCUSED | UNEXCUSED)"
    terminal_states: [VOIDED]
    transitions:
      - from: UNEXCUSED
        to: EXCUSED
        trigger: "POST /students/{id}/attendance-records/{recordId}/reclassify"
        actor: AttendanceClerk
        preconditions: ["record.status != VOIDED"]
        side_effects:
          - "student.unexcused_count recomputed (-1); student.excused_count recomputed (+1)"
          - "student attendance rates and chronic_absent recomputed"
        note: "Compensating half of the unexcused-tally invariant; tier never regresses."
      - from: EXCUSED
        to: UNEXCUSED
        trigger: "POST /students/{id}/attendance-records/{recordId}/reclassify"
        actor: AttendanceClerk
        preconditions: ["record.status != VOIDED"]
        side_effects:
          - "student.unexcused_count recomputed (+1); student.excused_count recomputed (-1)"
          - "may raise the student's open TruancyCase.tier (monotonic)"
      - from: UNEXCUSED
        to: VOIDED
        trigger: "POST /students/{id}/attendance-records/{recordId}/reclassify"
        actor: AttendanceClerk
        preconditions: ["record.status != VOIDED"]
        side_effects: ["student counters recomputed with this record excluded"]
      - from: PRESENT
        to: UNEXCUSED
        trigger: "POST /students/{id}/attendance-records/{recordId}/reclassify"
        actor: AttendanceClerk
        preconditions: ["record.status != VOIDED"]
        side_effects: ["student.present_count (-1), student.unexcused_count (+1); tier may rise"]

  - entity: TruancyCase
    initial_state: "tier=NONE, status=OPEN"
    terminal_states: [CLOSED]      # CLOSED is the status terminal; COURT_REFERRED is the tier terminal
    transitions:
      # --- tier dimension (monotonic; auto or manual) ---
      - from: "tier:NONE"
        to: "tier:TIER_1|TIER_2|TIER_3|COURT_REFERRED"
        trigger: "auto on POST /students/{id}/attendance-records (UNEXCUSED) OR POST /cases/{id}/transition {to_tier}"
        actor: system
        preconditions:
          - "computed tier (calc case_tier_determination) > current tier (ERR_TIER_REGRESSION if to_tier < current)"
        side_effects:
          - "case.tier set to max(current_tier, computed_tier)"
          - "on entering TIER_2 (from a lower tier): auto-create one ServiceReferral (service_type=MENTOR, auto_created=true) IF no ServiceReferral for the case is in {REFERRED, ACCEPTED, IN_PROGRESS}"
        note: "dimension: tier. Depth-3 cascade origin (record -> student counter -> case tier -> referral)."
      - from: "tier:TIER_1|TIER_2|TIER_3"
        to: "tier:(one step higher)"
        trigger: "auto on AttendanceContract BREACHED OR POST /cases/{id}/transition {to_tier}"
        actor: system
        preconditions: ["to_tier is exactly one enum step above current tier (else ERR_TIER_REGRESSION)"]
        side_effects:
          - "case.tier advanced one step"
          - "on entering TIER_2: auto ServiceReferral per the conditional cascade above"
      # --- status dimension ---
      - from: "status:OPEN"
        to: "status:MONITORING"
        trigger: "POST /cases/{id}/transition {to_status: MONITORING}"
        actor: CaseManager
        preconditions:
          - "case has a Conference in status HELD (ERR_NO_CONFERENCE_HELD)"
        side_effects: []
      - from: "status:MONITORING"
        to: "status:RESOLVED"
        trigger: "POST /cases/{id}/transition {to_status: RESOLVED}"
        actor: CaseManager
        preconditions:
          - "no CourtCitation for the case in status SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "all ServiceReferral in {REFERRED, ACCEPTED, IN_PROGRESS} for the case -> COMPLETED"
        note: "re-engagement: student judged back on track."
      - from: "status:RESOLVED"
        to: "status:OPEN"
        trigger: "auto on POST /students/{id}/attendance-records (UNEXCUSED) that raises tier"
        actor: system
        preconditions: ["case.status == RESOLVED and a new UNEXCUSED record arrives"]
        side_effects: ["case.status -> OPEN (relapse)"]
      - from: "status:MONITORING|RESOLVED"
        to: "status:CLOSED"
        trigger: "POST /cases/{id}/transition {to_status: CLOSED}"
        actor: CaseManager
        preconditions:
          - "no AttendanceContract in {PROPOSED, ACTIVE, BREACHED} (ERR_INVALID_STATE)"
          - "no CourtCitation in status SCHEDULED (ERR_INVALID_STATE)"
        side_effects:
          - "assigned staff active_caseload recomputed (-1) — case leaves the OPEN/MONITORING set"

  - entity: Conference
    initial_state: SCHEDULED
    terminal_states: [HELD, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /cases/{id}/conferences/{conferenceId}/transition {to_status: HELD}"
        actor: CaseManager
        preconditions: []
        side_effects: ["outcome stored; unlocks OPEN->MONITORING and contract activation for the case"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /cases/{id}/conferences/{conferenceId}/transition {to_status: NO_SHOW}"
        actor: CaseManager
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cases/{id}/conferences/{conferenceId}/transition {to_status: CANCELLED}"
        actor: CaseManager
        preconditions: []
        side_effects: ["frees the facilitator time slot (excluded from future overlap checks)"]

  - entity: AttendanceContract
    initial_state: PROPOSED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /cases/{id}/contracts/{contractId}/transition {to_status: ACTIVE}"
        actor: CaseManager
        preconditions:
          - "case has a Conference in status HELD (ERR_NO_CONFERENCE_HELD)"
        side_effects: ["case.status may move OPEN->MONITORING when triggered separately"]
      - from: ACTIVE
        to: BREACHED
        trigger: "auto on POST /cases/{id}/compliance-checks {result: NON_COMPLIANT} OR POST .../contracts/{contractId}/transition {to_status: BREACHED}"
        actor: system
        preconditions: []
        side_effects:
          - "case.breach_count recomputed (+1)"
          - "case.tier advanced one step (calc case_tier_determination cap at COURT_REFERRED) — depth-2 cascade"
        note: "Depth-2 cascade origin (compliance-check -> contract BREACHED -> case tier)."
      - from: BREACHED
        to: ACTIVE
        trigger: "POST /cases/{id}/contracts/{contractId}/transition {to_status: ACTIVE}"
        actor: CaseManager
        preconditions: []
        side_effects: ["cure loop; no tier change"]
        note: "dimension cycle: BREACHED->ACTIVE makes the contract machine non-linear."
      - from: ACTIVE
        to: FULFILLED
        trigger: "POST /cases/{id}/contracts/{contractId}/transition {to_status: FULFILLED}"
        actor: CaseManager
        preconditions:
          - "compliance_score_actual >= 80.00 (ERR_INVALID_STATE otherwise)"
        side_effects: []
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /cases/{id}/contracts/{contractId}/transition {to_status: CANCELLED}"
        actor: CaseManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /cases/{id}/contracts/{contractId}/transition {to_status: CANCELLED}"
        actor: CaseManager
        preconditions: []
        side_effects: []

  - entity: ServiceReferral
    initial_state: REFERRED
    terminal_states: [COMPLETED, NO_SHOW, DECLINED]
    transitions:
      - from: REFERRED
        to: ACCEPTED
        trigger: "POST /cases/{id}/service-referrals/{referralId}/transition {to_status: ACCEPTED}"
        actor: CaseManager
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: IN_PROGRESS
        trigger: "POST /cases/{id}/service-referrals/{referralId}/transition {to_status: IN_PROGRESS}"
        actor: CaseManager
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /cases/{id}/service-referrals/{referralId}/transition {to_status: COMPLETED}"
        actor: CaseManager
        preconditions: []
        side_effects: []
      - from: REFERRED
        to: DECLINED
        trigger: "POST /cases/{id}/service-referrals/{referralId}/transition {to_status: DECLINED}"
        actor: CaseManager
        preconditions: []
        side_effects: []
      - from: "ACCEPTED|IN_PROGRESS"
        to: NO_SHOW
        trigger: "POST /cases/{id}/service-referrals/{referralId}/transition {to_status: NO_SHOW}"
        actor: CaseManager
        preconditions: []
        side_effects: []

  - entity: CourtCitation
    initial_state: SCHEDULED
    terminal_states: [HEARD, DISMISSED, WITHDRAWN]
    transitions:
      - from: SCHEDULED
        to: HEARD
        trigger: "POST /cases/{id}/court-citations/{citationId}/transition {to_status: HEARD, disposition}"
        actor: CourtOfficer
        preconditions: ["disposition present (ERR_VALIDATION)"]
        side_effects: []
      - from: SCHEDULED
        to: DISMISSED
        trigger: "POST /cases/{id}/court-citations/{citationId}/transition {to_status: DISMISSED}"
        actor: CourtOfficer
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /cases/{id}/court-citations/{citationId}/transition {to_status: WITHDRAWN}"
        actor: CourtOfficer
        preconditions: []
        side_effects: ["frees the courtroom slot (excluded from future hearing-overlap checks)"]

# --- Concurrency (§1.2.1) ---
concurrency_rules:
  - rule_id: contract-create-stale-case
    parent_entity: TruancyCase
    write_endpoint: "POST /cases/{id}/contracts"
    occ_field: "expected_case_version"
    description: |
      Creating an AttendanceContract against a TruancyCase whose version has
      advanced since the client last observed it is rejected. A case admits at
      most one non-terminal contract; a freshly created contract legitimately
      supersedes any prior one, so a second create carrying the pre-supersede
      version is operating on a stale view of the case and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: student_attendance_rate
    trigger: "read of Student; recomputed after any AttendanceRecord create/reclassify"
    algorithm: aggregation
    formula: |
      attended = present_count + tardy_count
      absent   = excused_count + unexcused_count
      # variant RECORDED:
      if (attended + absent) == 0: attendance_rate_recorded = null
      else: attendance_rate_recorded = round(attended / (attended + absent) * 100, 2)
      # variant OFFICIAL:
      remaining = required_instructional_days - excused_count - unexcused_count
      attendance_rate_official = round(max(remaining, 0) / required_instructional_days * 100, 2)
    input_set: "AttendanceRecord with status != VOIDED for the student"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants:
      - name: recorded
        when: "denominator is only days actually recorded"
        difference: "excludes never-recorded required days; undefined (null) when no records exist"
      - name: official
        when: "denominator is school.required_instructional_days"
        difference: "counts every un-attended required day as absent; diverges from recorded whenever recorded_days < required_instructional_days"

  - name: case_tier_determination
    trigger: "POST attendance-records (UNEXCUSED); AttendanceContract BREACHED; POST /cases/{id}/transition {to_tier}"
    algorithm: threshold
    formula: |
      band = "ELEMENTARY" if student.grade_level <= 5 else "SECONDARY"
      adj  = 1 if band == "ELEMENTARY" else 0    # elementary escalates one absence sooner
      prior = count(TruancyCase for student with status == CLOSED)
      u = student.unexcused_count
      order = [NONE, TIER_1, TIER_2, TIER_3, COURT_REFERRED]
      if   u >= (school.court_unexcused_threshold  - adj): base = COURT_REFERRED
      elif u >= (school.tier3_unexcused_threshold  - adj): base = TIER_3
      elif u >= (school.tier2_unexcused_threshold  - adj): base = TIER_2
      elif u >= (school.tier1_unexcused_threshold  - adj): base = TIER_1
      else: base = NONE
      idx = order.index(base)
      if prior >= 1 and base != NONE: idx = min(idx + 1, 4)   # repeat-offender bump
      computed_tier = order[idx]
      case.tier = order[max(order.index(case.tier), idx)]     # monotonic
    input_set: "student.unexcused_count, grade band, prior CLOSED case count, school thresholds"
    constants: {}
    precision: "integer tier index"

  - name: contract_compliance_score
    trigger: "read of AttendanceContract; recomputed after goal progress update or BREACHED"
    algorithm: weighted_scoring
    formula: |
      if goals is empty: compliance_score_actual = null; compliance_score_projected = null; return
      sum_w = sum(g.weight for g in goals)
      # PINNED rounding order: round-per-line-item-THEN-sum. For each goal compute
      # its weighted percentage contribution and round THAT to 2 dp; then SUM the
      # rounded per-goal contributions. (The naive "sum then round once" order
      # produces different cents — e.g. three equal fully-met goals give 99.99
      # under this order vs 100.00 under sum-then-round.)
      for g in goals:
        r_actual_g    = min(g.met_value / g.target_value, 1.0)
        r_projected_g = 1.0 if g.met_value == 0 else r_actual_g
        line_actual_g    = round( r_actual_g    * (g.weight / sum_w) * 100, 2)
        line_projected_g = round( r_projected_g * (g.weight / sum_w) * 100, 2)
      compliance_score_actual    = round( sum(line_actual_g    for g), 2)
      compliance_score_projected = round( sum(line_projected_g for g), 2)
    input_set: "embedded goals array of the contract"
    constants: { FULFILL_THRESHOLD: 80.0 }
    precision: "each weighted per-goal line rounded to 2 dp then summed, round_half_up"
    variants:
      - name: actual
        when: "grading elapsed progress"
        difference: "uses real met_value/target_value per goal"
      - name: projected
        when: "forecasting if the plan is completed"
        difference: "treats every not-yet-started goal (met_value==0) as fully met (ratio 1.0)"

  - name: staff_active_caseload
    trigger: "case assign / reassign / status change to/from OPEN,MONITORING"
    algorithm: aggregation
    formula: |
      staff.active_caseload = count(TruancyCase c where c.assigned_staff_id == staff.id
                                    and c.status in {OPEN, MONITORING})
      # Conserved invariant: sum(active_caseload over all staff)
      #   == count(TruancyCase with assigned_staff_id != null and status in {OPEN, MONITORING})
    input_set: "TruancyCase rows referencing the staff"
    constants: {}
    precision: "integer"

  - name: student_unexcused_tally
    trigger: "AttendanceRecord create / reclassify / void"
    algorithm: aggregation
    formula: |
      student.unexcused_count = count(AttendanceRecord r where r.student_id == student.id
                                      and r.status == UNEXCUSED)
      # Conserved invariant: unexcused_count always equals the number of
      # non-voided UNEXCUSED records; reclassify UNEXCUSED->EXCUSED/VOIDED is the
      # compensating action that leaves the tally consistent.
    input_set: "AttendanceRecord rows for the student"
    constants: {}
    precision: "integer"

  - name: conference_overlap_check
    trigger: "POST /cases/{id}/conferences"
    algorithm: interval_merge
    formula: |
      resource = case.assigned_staff_id
      new = [scheduled_start, scheduled_end)          # half-open
      reject (ERR_CONFERENCE_OVERLAP) if any Conference x with status==SCHEDULED
        whose case.assigned_staff_id == resource satisfies
        new.start < x.end AND x.start < new.end       # touching endpoints (adjacency) allowed
    input_set: "SCHEDULED conferences of cases sharing the assigned staff"
    constants: {}
    precision: "second-resolution timestamps"

  - name: hearing_overlap_check
    trigger: "POST /cases/{id}/court-citations"
    algorithm: interval_merge
    formula: |
      resource = courtroom_id
      BUFFER = 30 minutes applied to BOTH sides of each existing hearing
      reject (ERR_HEARING_OVERLAP) if any CourtCitation x with status==SCHEDULED
        and x.courtroom_id == courtroom_id satisfies
        hearing_start < (x.hearing_end + BUFFER) AND (x.hearing_start - BUFFER) < hearing_end
      # buffered semantics: two hearings 20 min apart in the same courtroom collide;
      # exactly 30 min apart is allowed (strict inequality at the buffer edge)
    input_set: "SCHEDULED citations sharing courtroom_id"
    constants: { HEARING_BUFFER_MINUTES: 30 }
    precision: "minute-resolution buffer, second-resolution timestamps"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body well-formed: required fields present, correct scalar types, pagination limit/offset in range"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating + list endpoints"

  - priority: 4
    category: business_constraint
    check: "Enum fields carry a declared member (role_type, status, service_type, result, to_status, to_tier)"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "endpoints with enum inputs"

  - priority: 5
    category: existence
    check: "Every path id resolves (validated left-to-right); embedded goal_id resolves for progress"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_case_version equals current TruancyCase.version on contract create"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /cases/{id}/contracts"

  - priority: 7
    category: state
    check: "Target resource is in a state that admits the requested transition (tier monotonicity: ERR_TIER_REGRESSION)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 8
    category: business_referential
    check: "Cross-entity state gates: CourtCitation create requires case.tier==COURT_REFERRED; Contract->ACTIVE requires a HELD Conference"
    error_id: "ERR_CASE_NOT_COURT_ELIGIBLE / ERR_NO_CONFERENCE_HELD"
    http_status: 409
    applies_to: "POST court-citations; contract ACTIVE transition"

  - priority: 9
    category: business_constraint
    check: "Domain constraints: one non-terminal case per student; assigned staff has role_type==CASE_MANAGER; student ENROLLED; unique (student_id, attendance_date)"
    error_id: "ERR_CASE_ALREADY_OPEN / ERR_INVALID_STAFF_ROLE / ERR_STUDENT_NOT_ENROLLED / ERR_DUPLICATE_ATTENDANCE"
    http_status: 409
    applies_to: "POST cases; assign; attendance-records"

  - priority: 10
    category: business_temporal
    check: "Resource temporal overlaps: conference half-open overlap on assigned staff; hearing 30-min-buffered overlap on courtroom"
    error_id: "ERR_CONFERENCE_OVERLAP / ERR_HEARING_OVERLAP"
    http_status: 409
    applies_to: "POST conferences; POST court-citations"

  - priority: 11
    category: business_fiscal
    check: "Assigning a case must not push staff.active_caseload above max_caseload"
    error_id: ERR_CASELOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /cases/{id}/assign"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- School ---
  - method: POST
    path: "/schools"
    description: "Create a School (holds tier thresholds + attendance policy constants)"
    roles: [Administrator]
    code: 201
    input: [name, "tier1_unexcused_threshold?", "tier2_unexcused_threshold?", "tier3_unexcused_threshold?", "court_unexcused_threshold?", "required_instructional_days?", "chronic_absence_pct_threshold?"]
    output: School
    side_effects: []

  - method: GET
    path: "/schools/{id}"
    description: "Fetch a School"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: GET
    path: "/schools/{id}/students"
    description: "List students of a school (reverse-reachability for Student.school_id)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Student[]
    side_effects: []

  - method: GET
    path: "/schools/{id}/staff"
    description: "List staff of a school (reverse-reachability for Staff.school_id)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: ["role_type?", "limit?", "offset?"]
    output: Staff[]
    side_effects: []

  - method: GET
    path: "/schools/{id}/report"
    description: "Attendance-intervention report: counts of cases by tier/status, chronic-absence roster, open-citation count"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: []
    output: "{ total_students: integer, chronic_absent_count: integer, cases_by_tier: object, cases_by_status: object, open_citation_count: integer }"
    side_effects: []

  # --- Staff ---
  - method: POST
    path: "/staff"
    description: "Create a Staff member"
    roles: [Administrator]
    code: 201
    input: [school_id, full_name, role_type, "max_caseload?"]
    output: Staff
    side_effects: ["active_caseload initialized to 0"]

  - method: GET
    path: "/staff/{staffId}"
    description: "Fetch a Staff member (active_caseload computed)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: []
    output: Staff
    side_effects: []

  # --- Student ---
  - method: POST
    path: "/students"
    description: "Create a Student (enrollment_status=ENROLLED)"
    roles: [Administrator]
    code: 201
    input: [school_id, full_name, grade_level]
    output: Student
    side_effects: ["all counters 0; rates recomputed (recorded=null)"]

  - method: GET
    path: "/students/{id}"
    description: "Fetch a Student with computed counters, dual-variant rates, chronic_absent"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: []
    output: Student
    side_effects: []

  - method: POST
    path: "/students/{id}/enrollment"
    description: "Change a student's enrollment_status (ENROLLED / WITHDRAWN / GRADUATED)"
    roles: [Administrator]
    code: 200
    input: [to_status]
    output: Student
    side_effects: ["enrollment_status transition per Student state machine"]

  - method: POST
    path: "/students/{id}/attendance-records"
    description: "Record a day's attendance; UNEXCUSED drives the threshold cascade"
    roles: [Administrator, AttendanceClerk]
    code: 201
    input: [attendance_date, status]
    output: AttendanceRecord
    side_effects:
      - "student counters + rates + chronic_absent recomputed"
      - "if UNEXCUSED pushes unexcused_count >= tier1 threshold and no non-terminal case exists: auto-open TruancyCase (tier per calc case_tier_determination, unexcused_at_open snapshot)"
      - "if a non-terminal case exists: raise case.tier per calc (monotonic); TIER_2 entry auto-creates a MENTOR ServiceReferral (conditional)"
      - "if case.status==RESOLVED and tier rises: case.status -> OPEN (relapse)"

  - method: GET
    path: "/students/{id}/attendance-records"
    description: "List a student's attendance records (reverse-reachability for AttendanceRecord.student_id)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AttendanceRecord[]
    side_effects: []

  - method: POST
    path: "/students/{id}/attendance-records/{recordId}/reclassify"
    description: "Reclassify a record's status (compensating action for the unexcused tally)"
    roles: [Administrator, AttendanceClerk]
    code: 200
    input: [to_status]
    output: AttendanceRecord
    side_effects: ["student counters + rates recomputed; open case tier may rise (never regress)"]

  # --- TruancyCase ---
  - method: POST
    path: "/cases"
    description: "Manually open a TruancyCase for a student"
    roles: [Administrator, CaseManager]
    code: 201
    input: [student_id]
    output: TruancyCase
    side_effects: ["tier per calc case_tier_determination; status=OPEN; unexcused_at_open snapshot"]

  - method: GET
    path: "/cases/{id}"
    description: "Fetch a TruancyCase"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: []
    output: TruancyCase
    side_effects: []

  - method: GET
    path: "/cases"
    description: "List/filter cases (reverse-reachability for TruancyCase.student_id and assigned_staff_id)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: ["student_id?", "assigned_staff_id?", "tier?", "status?", "limit?", "offset?"]
    output: TruancyCase[]
    side_effects: []

  - method: POST
    path: "/cases/{id}/assign"
    description: "Assign/reassign a case to a CASE_MANAGER staff member"
    roles: [Administrator, CaseManager]
    code: 200
    input: [staff_id]
    output: TruancyCase
    side_effects:
      - "prior assignee active_caseload recomputed (-1) on reassign; new assignee active_caseload recomputed (+1)"
      - "rejected if new assignee already at max_caseload (ERR_CASELOAD_EXCEEDED)"

  - method: POST
    path: "/cases/{id}/transition"
    description: "Advance case status and/or tier (parallel dimensions)"
    roles: [Administrator, CaseManager]
    code: 200
    input: ["to_status?", "to_tier?"]
    output: TruancyCase
    side_effects: ["status/tier transition per case state machine, including RESOLVED referral sweep and CLOSED caseload decrement"]

  # --- Conference ---
  - method: POST
    path: "/cases/{id}/conferences"
    description: "Schedule an intervention conference (overlap-checked on the case's assigned staff)"
    roles: [Administrator, CaseManager]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: Conference
    side_effects: ["status=SCHEDULED; ERR_CONFERENCE_OVERLAP on assigned-staff time collision"]

  - method: GET
    path: "/cases/{id}/conferences"
    description: "List conferences of a case (reverse-reachability for Conference.case_id)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Conference[]
    side_effects: []

  - method: POST
    path: "/cases/{id}/conferences/{conferenceId}/transition"
    description: "Transition a conference (HELD / NO_SHOW / CANCELLED)"
    roles: [Administrator, CaseManager]
    code: 200
    input: [to_status, "outcome?"]
    output: Conference
    side_effects: ["per conference state machine"]

  # --- AttendanceContract ---
  - method: POST
    path: "/cases/{id}/contracts"
    description: "Create an attendance contract & plan (OCC on case.version; supersedes prior non-terminal contract)"
    roles: [Administrator, CaseManager]
    code: 201
    input: [start_date, end_date, goals, expected_case_version]
    output: AttendanceContract
    side_effects:
      - "status=PROPOSED; goal_ids minted; compliance scores computed"
      - "increments TruancyCase.version by 1"
      - "any prior non-terminal contract on the case -> CANCELLED (supersede)"

  - method: GET
    path: "/cases/{id}/contracts"
    description: "List contracts of a case (reverse-reachability for AttendanceContract.case_id)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AttendanceContract[]
    side_effects: []

  - method: POST
    path: "/cases/{id}/contracts/{contractId}/goals/{goalId}/progress"
    description: "Record progress on an embedded plan goal (recomputes compliance scores)"
    roles: [Administrator, CaseManager]
    code: 200
    input: [met_value]
    output: AttendanceContract
    side_effects: ["goal met_value updated; compliance_score_actual/projected recomputed"]

  - method: POST
    path: "/cases/{id}/contracts/{contractId}/transition"
    description: "Transition a contract (ACTIVE / BREACHED / FULFILLED / CANCELLED; cyclic cure)"
    roles: [Administrator, CaseManager]
    code: 200
    input: [to_status]
    output: AttendanceContract
    side_effects: ["per contract state machine; BREACHED advances case tier (cascade)"]

  # --- ServiceReferral ---
  - method: POST
    path: "/cases/{id}/service-referrals"
    description: "Create a service referral (mentor / counseling / health)"
    roles: [Administrator, CaseManager]
    code: 201
    input: [service_type, "provider_name?"]
    output: ServiceReferral
    side_effects: ["status=REFERRED; auto_created=false"]

  - method: GET
    path: "/cases/{id}/service-referrals"
    description: "List service referrals of a case (reverse-reachability for ServiceReferral.case_id)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: ["status?", "service_type?", "limit?", "offset?"]
    output: ServiceReferral[]
    side_effects: []

  - method: POST
    path: "/cases/{id}/service-referrals/{referralId}/transition"
    description: "Transition a referral (ACCEPTED / IN_PROGRESS / COMPLETED / NO_SHOW / DECLINED)"
    roles: [Administrator, CaseManager]
    code: 200
    input: [to_status]
    output: ServiceReferral
    side_effects: ["per referral state machine"]

  # --- CourtCitation ---
  - method: POST
    path: "/cases/{id}/court-citations"
    description: "File a court citation with a hearing (requires case.tier==COURT_REFERRED; overlap-checked on courtroom)"
    roles: [Administrator, CourtOfficer]
    code: 201
    input: [courtroom_id, hearing_start, hearing_end]
    output: CourtCitation
    side_effects: ["status=SCHEDULED; ERR_CASE_NOT_COURT_ELIGIBLE / ERR_HEARING_OVERLAP as applicable"]

  - method: GET
    path: "/cases/{id}/court-citations"
    description: "List citations of a case (reverse-reachability for CourtCitation.case_id)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: ["status?", "courtroom_id?", "limit?", "offset?"]
    output: CourtCitation[]
    side_effects: []

  - method: POST
    path: "/cases/{id}/court-citations/{citationId}/transition"
    description: "Transition a citation (HEARD / DISMISSED / WITHDRAWN)"
    roles: [Administrator, CourtOfficer]
    code: 200
    input: [to_status, "disposition?"]
    output: CourtCitation
    side_effects: ["per citation state machine; WITHDRAWN frees courtroom slot"]

  # --- ComplianceCheck ---
  - method: POST
    path: "/cases/{id}/compliance-checks"
    description: "Record a compliance-monitoring review; NON_COMPLIANT auto-breaches the active contract"
    roles: [Administrator, CaseManager]
    code: 201
    input: [check_date, result, "notes?"]
    output: ComplianceCheck
    side_effects:
      - "append-only event stored"
      - "if result==NON_COMPLIANT and the case has an ACTIVE contract: contract -> BREACHED (cascade: breach_count +1, case tier advances one step)"

  - method: GET
    path: "/cases/{id}/compliance-checks"
    description: "List compliance checks of a case (reverse-reachability for ComplianceCheck.case_id)"
    roles: [Administrator, AttendanceClerk, CaseManager, CourtOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ComplianceCheck[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers (X-User-Role, X-User-ID)" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type, bad pagination, missing disposition on HEARD" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a non-member value" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id (or embedded goal_id) does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match current TruancyCase.version on contract create" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not admissible from current state" }
  - { id: ERR_TIER_REGRESSION, http: 409, condition: "to_tier is lower than the case's current tier (tier is monotonic)" }
  - { id: ERR_CASE_ALREADY_OPEN, http: 409, condition: "Student already has a TruancyCase in status OPEN or MONITORING" }
  - { id: ERR_CASE_NOT_COURT_ELIGIBLE, http: 409, condition: "CourtCitation filed while case.tier != COURT_REFERRED" }
  - { id: ERR_NO_CONFERENCE_HELD, http: 409, condition: "Contract->ACTIVE or OPEN->MONITORING attempted without a HELD Conference" }
  - { id: ERR_INVALID_STAFF_ROLE, http: 409, condition: "Assigned staff does not have role_type CASE_MANAGER" }
  - { id: ERR_CASELOAD_EXCEEDED, http: 409, condition: "Assignment would push staff.active_caseload above max_caseload" }
  - { id: ERR_CONFERENCE_OVERLAP, http: 409, condition: "Conference collides with another SCHEDULED conference on the same assigned staff" }
  - { id: ERR_HEARING_OVERLAP, http: 409, condition: "Hearing falls within the 30-minute buffer of another SCHEDULED hearing in the same courtroom" }
  - { id: ERR_GOAL_NOT_FOUND, http: 404, condition: "Progress update targets a goal_id not embedded in the contract" }
  - { id: ERR_STUDENT_NOT_ENROLLED, http: 409, condition: "Attendance/case operation on a student whose enrollment_status != ENROLLED" }
  - { id: ERR_DUPLICATE_ATTENDANCE, http: 409, condition: "A non-voided AttendanceRecord already exists for (student_id, attendance_date)" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset outside [min,max] bounds" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Administrator
    description: "District superuser; superset of every operation (hierarchical override)."
    identity: opaque
    exclusive_operations:
      - "POST /schools"
      - "POST /staff"
      - "POST /students"
    shared_operations:
      - "Every AttendanceClerk, CaseManager and CourtOfficer operation"
      - "All GET endpoints"

  - name: AttendanceClerk
    description: "Front-office clerk; records and reclassifies daily attendance."
    identity: opaque
    exclusive_operations:
      - "POST /students/{id}/attendance-records"
      - "POST /students/{id}/attendance-records/{recordId}/reclassify"
    shared_operations:
      - "All GET endpoints"

  - name: CaseManager
    description: "Owns truancy cases: opens, assigns, conferences, contracts, referrals, compliance checks, status/tier transitions."
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /cases"
      - "POST /cases/{id}/assign"
      - "POST /cases/{id}/transition"
      - "POST /cases/{id}/conferences (+ transition)"
      - "POST /cases/{id}/contracts (+ goals/progress + transition)"
      - "POST /cases/{id}/service-referrals (+ transition)"
      - "POST /cases/{id}/compliance-checks"
    shared_operations:
      - "All GET endpoints"

  - name: CourtOfficer
    description: "Handles court escalation: files citations, schedules hearings, records dispositions."
    identity: "entity_backed:Staff"
    exclusive_operations:
      - "POST /cases/{id}/court-citations"
      - "POST /cases/{id}/court-citations/{citationId}/transition"
    shared_operations:
      - "All GET endpoints"
