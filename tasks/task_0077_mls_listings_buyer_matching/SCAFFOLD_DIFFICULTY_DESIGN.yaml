  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: showing_confirm_requires_lockbox_installed
        grounds:
          - state_machines.ShowingAppointment.transitions.REQUESTED_to_CONFIRMED
          - state_machines.Lockbox.transitions.INSTALLED_to_DISABLED
          - errors[ERR_LOCKBOX_DISABLED]
        distinguishing_aspect: |
          ShowingAppointment's REQUESTED->CONFIRMED is gated on the sibling Lockbox entity being INSTALLED:
          confirming a REQUESTED showing whose lockbox was DISABLED (after the showing was requested) returns
          ERR_LOCKBOX_DISABLED — a ShowingAppointment<-Lockbox pair. The listing stays ACTIVE via a second lockbox.
        test_recipe:
          setup:
            - "ACTIVE listing (kept active by lockbox lb_b). Lockbox lb_a is DISABLED, then a showing is REQUESTED directly on lb_a."
          setup_api_calls:
