              captures: { b4_id: $.data.id }
          assert:
            - "MeltBatch.${b2_id} was created (HTTP 201): [12:00,14:00) touches [10:00,12:00) — half-open adjacency is allowed"
            - "${err} == ERR_FURNACE_WINDOW_OVERLAP (HTTP 409) for [11:00,13:00) on FURNACE_A"
