# =============================================================================
# §1.9 Scaffold Corner Design — chain-restaurant menu labeling & allergen
# disclosure compliance
#
# Breadth probe over the surface declared in SCAFFOLD.yaml §1.1-§1.7. The nine
# `section:` values and their `claim_type:` values are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by an instance
# in SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub and no
# test_recipe.
#
# Conventions shared by every recipe below:
#   * the logical clock is pinned with POST /_clock/set_current_utc before any
#     other call; the default position is 2026-08-01T00:00:00Z
#   * ${var} appears only for server-minted values bound by an earlier
#     `captures:` block; everything else is a literal
#   * unknown-id probes use the fixed literal UUID
#     00000000-0000-4000-8000-0000000000ff
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: brand_creation_seeds_derived_coverage_and_posture_defaults
        claim_type: creation
        grounds:
          - endpoints[POST /brands]
          - entities.Brand.coverage_status
          - entities.Brand.coverage_reason
          - entities.Brand.compliance_posture
        distinguishing_aspect: "POST /brands returns 201 and seeds every computed field of a brand with no units and no items: coverage_status NOT_COVERED, coverage_reason NO_STANDARD_MENU_ITEMS, compliance_posture EXEMPT, all four counters 0 and has_published_disclosure_packet false."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
          assert:
            - "trigger[0] response HTTP status == 201 and response_type == object with meta.api_request_id and meta.api_request_timestamp present"
            - "data.legal_name == Golden Grill Holdings LLC and data.doing_business_as == Golden Grill"
            - "data.coverage_status == NOT_COVERED and data.coverage_reason == NO_STANDARD_MENU_ITEMS"
            - "data.counted_unit_count == 0 and data.standard_item_count == 0"
            - "data.compliance_posture == EXEMPT"
            - "data.open_reprint_obligation_count == 0 and data.overdue_board_count == 0 and data.open_enforcement_escalated_count == 0"
            - "data.has_published_disclosure_packet == false"
            - "data.version == 1 and data.created_at == 2026-08-01T00:00:00Z and data.updated_at == 2026-08-01T00:00:00Z"

      - name: brand_creation_system_and_computed_body_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Brand.coverage_status
          - entities.Brand.compliance_posture
          - endpoints[POST /brands]
        distinguishing_aspect: "id, created_at, version, coverage_status and compliance_posture supplied in the request body are ignored rather than honoured: the server mints its own id and writes coverage_status NOT_COVERED and compliance_posture EXEMPT even though the body asked for COVERED and COMPLIANT."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /brands"
              payload: { legal_name: "Silver Spoon Group LLC", doing_business_as: "Silver Spoon", id: "00000000-0000-4000-8000-0000000000ff", created_at: "2020-01-01T00:00:00Z", version: 99, coverage_status: "COVERED", compliance_posture: "COMPLIANT", counted_unit_count: 500 }
              as: PlatformAdmin
              captures: { brand: $.data.id }
          assert:
            - "trigger[0] response HTTP status == 201"
            - "data.id != 00000000-0000-4000-8000-0000000000ff"
            - "data.created_at == 2026-08-01T00:00:00Z and data.version == 1"
            - "data.coverage_status == NOT_COVERED and data.compliance_posture == EXEMPT and data.counted_unit_count == 0"

      - name: jurisdiction_optional_field_defaults_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.Jurisdiction.extra_requirement
          - entities.Jurisdiction.enforcement_tier
          - entities.Jurisdiction.sodium_warning_threshold_mg
          - entities.Jurisdiction.required_succinct_statement_variant
          - endpoints[POST /jurisdictions]
        distinguishing_aspect: "Omitting all five optional inputs yields extra_requirement NONE, enforcement_tier FEDERAL_ALIGNED, sodium_warning_threshold_mg 2300, required_succinct_statement_variant FEDERAL_DEFAULT and the derived reprint_grace_days 30."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
          assert:
            - "trigger[0] response HTTP status == 201 and data.preemption_mode == PREEMPTED"
            - "data.extra_requirement == NONE and data.enforcement_tier == FEDERAL_ALIGNED"
            - "data.sodium_warning_threshold_mg == 2300 and data.required_succinct_statement_variant == FEDERAL_DEFAULT"
            - "data.reprint_grace_days == 30 and data.assessed_penalty_cents_total == 0"

      - name: jurisdiction_reprint_grace_days_computed_from_extra_requirement
        claim_type: computed_fields
        grounds:
          - entities.Jurisdiction.reprint_grace_days
          - calculations.reprint_obligation_and_deadline
          - endpoints[POST /jurisdictions]
        distinguishing_aspect: "reprint_grace_days is derived, not supplied: a jurisdiction with extra_requirement SODIUM_WARNING gets 14 while the otherwise identical jurisdiction with extra_requirement NONE gets 30."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "NY-SOD", name: "New York", preemption_mode: "VARIANCE_ALLOWED", extra_requirement: "SODIUM_WARNING", enforcement_tier: "ENHANCED", sodium_warning_threshold_mg: 900 }
              as: PlatformAdmin
              captures: { juris_sod: $.data.id }
            - call: "POST /jurisdictions"
              payload: { code: "ID-PLAIN", name: "Idaho", preemption_mode: "VARIANCE_ALLOWED", extra_requirement: "NONE", enforcement_tier: "ENHANCED", sodium_warning_threshold_mg: 900 }
              as: PlatformAdmin
              captures: { juris_plain: $.data.id }
          assert:
            - "trigger[0] data.reprint_grace_days == 14 and data.sodium_warning_threshold_mg == 900"
            - "trigger[1] data.reprint_grace_days == 30"
            - "GET /jurisdictions/${juris_sod} returns reprint_grace_days == 14 and GET /jurisdictions/${juris_plain} returns reprint_grace_days == 30"

      - name: establishment_defaults_planned_status_and_brand_name_flag
        claim_type: defaults
        grounds:
          - entities.Establishment.unit_status
          - entities.Establishment.operates_under_brand_name
          - state_machines.Establishment.initial_state
        distinguishing_aspect: "Omitting unit_status and operates_under_brand_name creates the unit in the declared initial_state PLANNED with operates_under_brand_name true, and a PLANNED unit does not raise Brand.counted_unit_count."
        test_recipe:
          setup:
            - "One Jurisdiction and one Brand exist; the clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
          trigger:
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0001" }
              as: PlatformAdmin
              captures: { est: $.data.id }
          assert:
            - "trigger[0] response HTTP status == 201 and data.unit_status == PLANNED and data.operates_under_brand_name == true"
            - "data.outstanding_penalty_cents == 0 and data.board_count == 0"
            - "Brand.${brand}.counted_unit_count == 0 and Brand.${brand}.coverage_status == NOT_COVERED"

      - name: establishment_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /establishments/{id}]
          - entities.Establishment.unit_label
        distinguishing_aspect: "GET /establishments/{id} returns exactly the row POST /establishments persisted - same id, brand_id, jurisdiction_id, unit_label, unit_status - inside a response_type object envelope."
        test_recipe:
          setup:
            - "One OPERATING establishment of one brand in one jurisdiction."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0001", unit_status: "OPERATING", operates_under_brand_name: true }
              as: PlatformAdmin
              captures: { est: $.data.id }
          trigger:
            - call: "GET /establishments/${est}"
              payload: {}
              as: StateRegulator
              as_user_id: "${juris}"
          assert:
            - "trigger[0] response HTTP status == 200 and response_type == object"
            - "data.id == ${est} and data.brand_id == ${brand} and data.jurisdiction_id == ${juris}"
            - "data.unit_label == ID-0001 and data.unit_status == OPERATING and data.version == 1"

      - name: establishment_listing_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /establishments]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /establishments filtered by brand_id with limit 2 returns 2 rows, total_count 3 and has_more true; the same call at offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "One brand with exactly three establishments in one jurisdiction, created in a known order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0001", unit_status: "OPERATING" }
              as: PlatformAdmin
              captures: { est1: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0002", unit_status: "OPERATING" }
              as: PlatformAdmin
              captures: { est2: $.data.id }
            - call: "POST /establishments"
              payload: { brand_id: "${brand}", jurisdiction_id: "${juris}", unit_label: "ID-0003", unit_status: "TEMPORARILY_CLOSED" }
              as: PlatformAdmin
              captures: { est3: $.data.id }
          trigger:
            - call: "GET /establishments"
              payload: { brand_id: "${brand}", limit: 2, offset: 0 }
              as: PlatformAdmin
            - call: "GET /establishments"
              payload: { brand_id: "${brand}", limit: 2, offset: 2 }
              as: PlatformAdmin
            - call: "GET /establishments"
              payload: { brand_id: "${brand}", unit_status: "OPERATING" }
              as: PlatformAdmin
          assert:
            - "trigger[0] response HTTP status == 200, response_type == array, len(data) == 2, meta/total_count == 3 and has_more == true"
            - "trigger[1] len(data) == 1, total_count == 3 and has_more == false"
            - "trigger[2] returns exactly 2 rows - ${est1} and ${est2} - and total_count == 2, so the unit_status filter narrows total_count as well as the page"

      - name: menu_board_unknown_path_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=7]
          - errors[ERR_MENU_BOARD_NOT_FOUND]
          - endpoints[GET /menu-boards/{id}]
        distinguishing_aspect: "A GET against a well-formed but unknown MenuBoard id returns ERR_MENU_BOARD_NOT_FOUND with HTTP 404 and response_type error, not an empty object with 200."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned at 2026-08-01T00:00:00Z; no MenuBoard has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /menu-boards/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response HTTP status == 404, response_type == error and data.error_id == ERR_MENU_BOARD_NOT_FOUND"
            - "data.message is a non-empty string and meta.api_request_id is present on the error envelope"

      - name: menu_item_creation_missing_required_first_offered_on_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - endpoints[POST /menu-items]
        distinguishing_aspect: "first_offered_on carries no default, so omitting it returns ERR_VALIDATION with HTTP 400 and no MenuItem row is created - Brand.standard_item_count stays 0."
        test_recipe:
          setup:
            - "One brand exists; no menu items."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
          trigger:
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response HTTP status == 400 and data.error_id == ERR_VALIDATION"
            - "GET /menu-items with brand_id ${brand} returns total_count == 0"
            - "Brand.${brand}.standard_item_count == 0 and Brand.${brand}.version == 1"

      - name: menu_item_creation_invalid_enum_item_class_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_VALIDATION]
          - entities.MenuItem.item_class
        distinguishing_aspect: "item_class outside {STANDARD, TEMPORARY, TEST_MARKET, DAILY_SPECIAL, CUSTOM_ORDER, SELF_SERVICE} returns ERR_VALIDATION (400), and so does a negative grams value on a recipe component - the same well-formedness rule covers both enum domain and non-negativity."
        test_recipe:
          setup:
            - "One brand with one STANDARD menu item and one DRAFT recipe, so a component payload can be probed too."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Initial specification" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Seasonal Wrap", item_class: "SEASONAL", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Negative filler", role: "BASE", grams: -10, calories_per_100g: 100, sodium_mg_per_100g: 50 }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { err_neg: $.data.error_id }
          assert:
            - "trigger[0] response HTTP status == 400 and data.error_id == ERR_VALIDATION"
            - "trigger[1] response HTTP status == 400 and data.error_id == ERR_VALIDATION"
            - "Recipe.${r1}.component_count == 0 and Recipe.${r1}.computed_base_calories == 0 after both rejections"

      - name: recipe_component_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.RecipeComponent
          - endpoints[POST /recipes/{id}/components]
          - endpoints[GET /recipes/{id}/components]
        distinguishing_aspect: "RecipeComponent is declared common_fields false, so its response carries id and the two computed nutrition fields but no version and no updated_at, and §1.5 exposes no PUT, PATCH or DELETE for it - a correction is made by adding a new Recipe version, never by editing a stored component."
        test_recipe:
          setup:
            - "One brand, one STANDARD menu item and one DRAFT recipe."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
            - call: "POST /menu-items/${item}/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Initial specification" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /recipes/${r1}/components"
              payload: { component_name: "Grilled chicken breast", role: "BASE", grams: 140, calories_per_100g: 140, sodium_mg_per_100g: 240, added_sugar_g_per_100g: 0, allergen_group: "NONE", cross_contact_risk: "NONE" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { comp: $.data.id }
          assert:
            - "trigger[0] response HTTP status == 201 with data.id present, data.recipe_id == ${r1}, data.component_calories == 196.00 and data.component_sodium_mg == 336.00"
            - "the component response contains no version field and no updated_at field"
            - "added_sugar_g_per_100g defaults are respected: data.added_sugar_g_per_100g == 0, data.choice_group == null, data.selection_mode == null, data.selection_limit == null"
            - "GET /recipes/${r1}/components returns exactly 1 row whose id == ${comp}, and §1.5 declares no PUT, PATCH or DELETE endpoint for RecipeComponent"
            - "Recipe.${r1}.component_count == 1 and Recipe.${r1}.computed_base_calories == 196.00"

      - name: recipe_creation_for_unknown_parent_menu_item_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=7]
          - errors[ERR_MENU_ITEM_NOT_FOUND]
          - endpoints[POST /menu-items/{id}/recipes]
        distinguishing_aspect: "A child Recipe cannot be created under an unknown parent: the unknown templated MenuItem id returns ERR_MENU_ITEM_NOT_FOUND (404), and that existence check runs before the optimistic-concurrency comparison so no 412 is returned."
        test_recipe:
          setup:
            - "One brand with one real STANDARD menu item, so a valid observed version is available to send."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id, item_v1: $.data.version }
          trigger:
            - call: "POST /menu-items/00000000-0000-4000-8000-0000000000ff/recipes"
              payload: { expected_menu_item_version: "${item_v1}", change_note: "Recipe for a nonexistent item" }
              as: NutritionAnalyst
              as_user_id: "analyst-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response HTTP status == 404 and data.error_id == ERR_MENU_ITEM_NOT_FOUND"
            - "GET /recipes with menu_item_id ${item} returns total_count == 0"

      - name: menu_item_creation_with_unknown_body_brand_id_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=8]
          - errors[ERR_BRAND_NOT_FOUND]
          - endpoints[POST /menu-items]
        distinguishing_aspect: "A foreign key supplied in the request body is resolved exactly like a templated path id: an unknown brand_id on POST /menu-items returns ERR_BRAND_NOT_FOUND (404), which is a different failure from the ownership check that returns ERR_FORBIDDEN_SCOPE for a real but foreign brand."
        test_recipe:
          setup:
            - "Empty database beyond the pinned clock; no Brand row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /menu-items"
              payload: { brand_id: "00000000-0000-4000-8000-0000000000ff", name: "Grill Sandwich", item_class: "STANDARD", variable_type: "NONE", first_offered_on: "2026-01-05" }
              as: BrandComplianceOfficer
              as_user_id: "00000000-0000-4000-8000-0000000000ff"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response HTTP status == 404 and data.error_id == ERR_BRAND_NOT_FOUND"

      - name: menu_board_listing_junction_links_board_and_item
        claim_type: graph
        grounds:
          - entities.MenuBoardListing.menu_board_id
          - entities.MenuBoardListing.menu_item_id
          - endpoints[POST /menu-boards/{id}/listings]
          - endpoints[GET /menu-items/{id}/listings]
          - endpoints[GET /menu-boards/{id}/listings]
        distinguishing_aspect: "MenuBoardListing is the many-to-many junction of the graph topology: one listing row is reachable from both sides - GET /menu-boards/{id}/listings and GET /menu-items/{id}/listings each return the same listing id - and a second board may list the same item without tripping the per-board uniqueness rule."
        test_recipe:
          setup:
            - "One brand, one OPERATING unit, one STANDARD menu item and two DRAFT boards of different board_type on that unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
