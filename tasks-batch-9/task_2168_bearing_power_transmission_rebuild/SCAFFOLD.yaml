# =============================================================================
# PRD Benchmark Seed Tables — Bearing & Power-Transmission Rebuild
# Sections §1.0 – §1.7. (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#  §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2168. Bearing & Power-Transmission Rebuild (Motion Industries service shop): inspection & remaining-life grading, reman spec & clearance standard, exchange-core credit valuation, OEM vs aftermarket approval, vibration analysis linkage & failure cause coding, expedited emergency rebuild, in-service tracking by asset, warranty pro-rata

domain_name: bearing-power-transmission-rebuild
api_prefix: /shop

# =============================================================================
# §0.1–§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # CoreUnit, CustomerAsset, RebuildOrder and Installation form a many-to-many
  # web (an Installation is the junction of a CoreUnit, a CustomerAsset and the
  # RebuildOrder that produced it); CoreUnit is additionally self-referential
  # through `replacement_core_unit_id`; Inspection reaches sideways into
  # VibrationReading across the asset aggregate boundary.

  state_machine_shape: parallel
  # RebuildOrder carries two independent state dimensions on one row:
  # `work_status` (driven by shop actions) and `approval_status` (derived from
  # the aggregate of its PartLine children). CoreUnit is branching+cyclic,
  # Inspection and PartLine are cyclic, Installation has a self-loop.

  relationship_patterns:
    - one_to_many          # Customer -> CustomerAsset, RebuildOrder -> PartLine
    - many_to_many         # Installation joins CoreUnit x CustomerAsset x RebuildOrder
    - self_referential     # CoreUnit.replacement_core_unit_id -> CoreUnit.id
    - cross_aggregate      # Inspection.linked_vibration_reading_id -> VibrationReading (asset aggregate)

  role_model: segregation_of_duties
  # The Inspector who submits an Inspection may not be the user who accepts it;
  # engineering return authority sits with a different role than acceptance.

  consistency_model: immediate

  difficulty_level: beyond_expert
  # 14 entities / 50 endpoints / 47 error codes / 8 calculations / 7 state
  # machines / 3 OCC rules. Density, not volume: every calculation reads at
  # least two entities, and the credit ledger closes a four-hop cascade.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Legal name of the plant / account the shop bills.
      - name: account_code
        type: string
        source: input
        description: Short account code; unique across all Customers.
        constraints: "unique; 1-32 chars"
      - name: contact_email
        type: string
        source: input
        description: Reliability contact for approval notices.
        default: null
      - name: core_credit_balance_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this customer's CreditNote rows with kind == CORE_EXCHANGE and status == POSTED. See calculations.customer_credit_balances."
        default: 0
      - name: warranty_credit_balance_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this customer's CreditNote rows with kind == WARRANTY_PRORATA and status == POSTED."
        default: 0
      - name: manual_credit_balance_cents
        type: integer
        source: computed
        description: "Sum of amount_cents over this customer's CreditNote rows with kind == MANUAL_ADJUSTMENT and status == POSTED."
        default: 0
      - name: total_credit_balance_cents
        type: integer
        source: computed
        description: "core_credit_balance_cents + warranty_credit_balance_cents + manual_credit_balance_cents. Conserved quantity of the credit-ledger invariant."
        default: 0

  - name: CustomerAsset
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the account that owns the driven machine."
      - name: asset_tag
        type: string
        source: input
        description: Plant tag of the driven machine (e.g. CONV-04-GBX).
        constraints: "unique within customer_id"
      - name: criticality
        type: enum
        source: input
        description: "Reliability class of the asset. CRITICAL selects the conservative life-grading variant and forbids un-waivered AFTERMARKET part lines."
        constraints: "one of {CRITICAL, STANDARD}"
      - name: duty_class
        type: enum
        source: input
        description: Duty cycle of the machine; carried for reporting only.
        constraints: "one of {CONTINUOUS, INTERMITTENT, STANDBY}"
      - name: site_code
        type: string
        source: input
        description: Plant site identifier.
        default: "MAIN"

  - name: ClearanceStandard
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: Bearing / gearbox model this reman spec governs.
        constraints: "unique across ClearanceStandard"
      - name: base_core_value_cents
        type: integer
        source: input
        description: Undamaged exchange-core reference value in cents; the base of every core-credit line.
        constraints: ">= 0"
      - name: max_rebuild_count
        type: integer
        source: input
        description: Maximum number of prior rebuilds a core may carry and still be re-manufactured.
        constraints: ">= 0"
      - name: warranty_hours
        type: integer
        source: input
        description: Warranted run hours for a unit rebuilt to this spec.
        constraints: "> 0"
      - name: warranty_months
        type: integer
        source: input
        description: Warranted calendar months (a month is exactly 30 days for pro-rata purposes).
        constraints: "> 0"
      - name: cleanroom_required
        type: boolean
        source: input
        description: Whether rebuilds of this model must occupy a cleanroom bench.
        default: false
      - name: required_feature_codes
        type: array
        source: input
        description: "Feature codes that MUST each carry at least one Measurement before an Inspection may be submitted."
        constraints: "non-empty array of strings, each present in feature_bands"
      - name: feature_bands
        type: array
        source: input
        description: >-
          Array of objects {feature_code, min_um, max_um, rework_extension_um,
          deduction_pct, weight}. min_um/max_um are the inclusive in-spec band;
          rework_extension_um widens it on both sides into the REWORKABLE zone;
          deduction_pct is the fraction of base_core_value_cents deducted for an
          OUT_OF_SPEC result on that feature; weight is the composite life-score
          weight.
        constraints: "non-empty; feature_code unique within the array; max_um > min_um; 0 <= deduction_pct <= 1; weight > 0"

  - name: Bench
    parent: null
    common_fields: true
    fields:
      - name: bench_code
        type: string
        source: input
        description: Shop bench identifier.
        constraints: "unique across Bench"
      - name: parallel_slots
        type: integer
        source: input
        description: How many reservations may occupy the bench at the same instant.
        constraints: ">= 1"
      - name: cleanroom
        type: boolean
        source: input
        description: Whether this bench satisfies cleanroom_required models.
        default: false
      - name: committed_minutes
        type: integer
        source: computed
        description: "Sum of window_minutes over this bench's BenchReservation rows with status IN {HELD, CONFIRMED}. See calculations.bench_committed_minutes."
        default: 0

  - name: CoreUnit
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the account whose exchange core this is."
      - name: clearance_standard_id
        type: string
        source: input
        description: "FK -> ClearanceStandard.id; the reman spec that governs this core's bands, warranty and base value."
      - name: serial_no
        type: string
        source: input
        description: Manufacturer serial stamped on the core.
        constraints: "unique within (customer_id, serial_no)"
      - name: model_code
        type: string
        source: computed
        description: Copied from the referenced ClearanceStandard.model_code at creation; never client-supplied.
      - name: rebuild_count
        type: integer
        source: input
        description: Number of prior rebuilds already on this core at receipt.
        default: 0
        constraints: ">= 0"
      - name: declared_condition_grade
        type: enum
        source: input
        description: Grade declared by the customer at drop-off; drives the provisional core credit only.
        constraints: "one of {GRADE_A, GRADE_B, GRADE_C, GRADE_D, SCRAP}"
      - name: condition_grade
        type: enum
        source: computed
        description: Bench-verified grade copied from the accepted Inspection's remaining_life_grade; null until grading.
        default: null
        constraints: "null or one of {GRADE_A, GRADE_B, GRADE_C, GRADE_D, SCRAP}"
      - name: status
        type: enum
        source: system
        description: Core lifecycle state.
        default: RECEIVED
        constraints: "one of {RECEIVED, INSPECTING, GRADED, REBUILDING, REBUILT, SHIPPED, SCRAPPED, RETURNED_AS_IS}"
      - name: provisional_core_credit_cents
        type: integer
        source: computed
        description: Exchange-core credit computed at receipt from declared_condition_grade. See calculations.core_credit_valuation variant provisional_core_credit.
      - name: final_core_credit_cents
        type: integer
        source: computed
        description: Exchange-core credit recomputed when the Inspection is accepted; null until then.
        default: null
      - name: replacement_core_unit_id
        type: string
        source: input
        description: "FK -> CoreUnit.id; set when this core is scrapped and another received core takes its place. Null otherwise."
        default: null

  - name: RebuildOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the paying account."
      - name: core_unit_id
        type: string
        source: input
        description: "FK -> CoreUnit.id; the physical core being re-manufactured."
      - name: customer_asset_id
        type: string
        source: input
        description: "FK -> CustomerAsset.id; the machine the rebuilt unit is destined for. Its criticality drives life-grading variant selection and aftermarket policy."
      - name: labor_hours
        type: number
        source: input
        description: Estimated bench labor hours for the rebuild.
        constraints: "> 0"
      - name: work_status
        type: enum
        source: system
        description: Shop-driven state dimension.
        default: DRAFT
        constraints: "one of {DRAFT, QUOTED, SCHEDULED, IN_PROGRESS, COMPLETED, DELIVERED, CANCELLED}"
      - name: approval_status
        type: enum
        source: computed
        description: Customer-driven state dimension, derived from the aggregate of this order's PartLine rows. See calculations.order_approval_rollup.
        default: PENDING
        constraints: "one of {PENDING, PARTIAL, APPROVED, REJECTED}"
      - name: expedited
        type: boolean
        source: system
        description: Set true by the expedite endpoint; drives the emergency surcharge tier.
        default: false
      - name: expedite_reason
        type: string
        source: system
        description: Free text recorded when the order is expedited.
        default: null
      - name: emergency_ref
        type: string
        source: system
        description: Customer's emergency work authorization reference, recorded at expedite time.
        default: null
      - name: part_revision_counter
        type: integer
        source: system
        description: Incremented by 1 on every PartLine create, decide and revise under this order. Used to detect a stale quote.
        default: 0
      - name: quoted_part_revision
        type: integer
        source: computed
        description: Snapshot of part_revision_counter taken at the last QUOTE action; null before the first quote.
        default: null
      - name: parts_subtotal_cents
        type: integer
        source: computed
        description: Sum of line_total_cents over this order's APPROVED PartLine rows, at quote time.
        default: null
      - name: labor_cents
        type: integer
        source: computed
        description: round_half_up(labor_hours * LABOR_RATE_CENTS_PER_HOUR).
        default: null
      - name: pre_credit_subtotal_cents
        type: integer
        source: computed
        description: parts_subtotal_cents + labor_cents.
        default: null
      - name: expedite_surcharge_cents
        type: integer
        source: computed
        description: Tiered emergency surcharge plus flat callout; 0 when expedited is false.
        default: null
      - name: gross_total_cents
        type: integer
        source: computed
        description: pre_credit_subtotal_cents + expedite_surcharge_cents.
        default: null
      - name: core_credit_applied_cents
        type: integer
        source: computed
        description: Exchange-core credit drawn against this order, capped at CORE_CREDIT_CAP_PCT of gross_total_cents and by the customer's posted credit balance.
        default: null
      - name: quote_total_cents
        type: integer
        source: computed
        description: gross_total_cents - core_credit_applied_cents.
        default: null
      - name: covered_base_cents
        type: integer
        source: computed
        description: Warranty-covered base (labor plus source-class-weighted approved parts) snapshotted at quote time; the multiplicand of the warranty pro-rata credit.
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded when the order is cancelled.
        default: null

  - name: Inspection
    parent: RebuildOrder
    common_fields: true
    fields:
      - name: rebuild_order_id
        type: string
        source: input
        description: "FK -> RebuildOrder.id; the order this bench inspection belongs to."
      - name: linked_vibration_reading_id
        type: string
        source: input
        description: "FK -> VibrationReading.id; the field reading used for failure-cause coding. Optional at creation, mandatory at SUBMIT."
        default: null
      - name: status
        type: enum
        source: system
        description: Inspection lifecycle state.
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, RETURNED}"
      - name: inspector_note
        type: string
        source: input
        description: Free-text bench note.
        default: null
      - name: cause_code_override
        type: enum
        source: input
        description: Engineering-asserted failure cause that pre-empts the derived coding ladder.
        default: null
        constraints: "null or one of {OUTER_RACE_SPALL, INNER_RACE_SPALL, MISALIGNMENT, LOOSE_FIT, LUBRICATION_FAILURE, NORMAL_WEAR, WORKMANSHIP, UNDETERMINED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that performed the SUBMIT action.
        default: null
      - name: accepted_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that performed the ACCEPT action.
        default: null
      - name: revision_count
        type: integer
        source: system
        description: Incremented by 1 on every REOPEN action (RETURNED -> DRAFT).
        default: 0
      - name: life_score_variant
        type: enum
        source: computed
        description: Which remaining-life variant governed this inspection; CONSERVATIVE when the order's asset is CRITICAL, otherwise COMPOSITE.
        default: null
        constraints: "null or one of {COMPOSITE, CONSERVATIVE}"
      - name: remaining_life_score
        type: integer
        source: computed
        description: 0-100 remaining-life score computed at SUBMIT. See calculations.remaining_life_score.
        default: null
      - name: remaining_life_grade
        type: enum
        source: computed
        description: Grade banded from remaining_life_score.
        default: null
        constraints: "null or one of {GRADE_A, GRADE_B, GRADE_C, GRADE_D, SCRAP}"
      - name: failure_cause_code
        type: enum
        source: computed
        description: Failure cause derived at SUBMIT from the linked VibrationReading plus the governing measurements. See calculations.failure_cause_coding.
        default: null
        constraints: "null or one of {OUTER_RACE_SPALL, INNER_RACE_SPALL, MISALIGNMENT, LOOSE_FIT, LUBRICATION_FAILURE, NORMAL_WEAR, WORKMANSHIP, UNDETERMINED}"
      - name: cause_confidence
        type: enum
        source: computed
        description: Confidence tier of the derived cause code.
        default: null
        constraints: "null or one of {ASSERTED, HIGH, MEDIUM, LOW}"
      - name: return_reason
        type: string
        source: system
        description: Reason recorded when engineering returns the inspection.
        default: null

  - name: Measurement
    parent: Inspection
    common_fields: false
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection this metrology reading belongs to."
      - name: feature_code
        type: string
        source: input
        description: Feature measured; must appear in the governing ClearanceStandard.feature_bands.
      - name: measured_um
        type: integer
        source: input
        description: Measured value in micrometres.
      - name: sequence_no
        type: integer
        source: system
        description: Monotonic per-inspection sequence starting at 1; breaks created_at ties when selecting the governing measurement for a feature.
      - name: band_result
        type: enum
        source: computed
        description: Band verdict against the governing ClearanceStandard. See calculations.clearance_band_evaluation.
        constraints: "one of {IN_SPEC, REWORKABLE, OUT_OF_SPEC}"
      - name: deviation_ratio
        type: number
        source: computed
        description: Fraction of the band width by which the reading falls outside the band, clamped to 1.0; 0 when IN_SPEC. Six decimal places.
      - name: feature_score
        type: number
        source: computed
        description: 100 * (1 - deviation_ratio); the per-feature input to remaining-life scoring.

  - name: PartLine
    parent: RebuildOrder
    common_fields: true
    fields:
      - name: rebuild_order_id
        type: string
        source: input
        description: "FK -> RebuildOrder.id; the order this reman part line belongs to."
      - name: part_no
        type: string
        source: input
        description: Manufacturer or aftermarket part number.
      - name: source_class
        type: enum
        source: input
        description: Whether this line is an OEM part or an aftermarket substitution.
        constraints: "one of {OEM, AFTERMARKET}"
      - name: qty
        type: integer
        source: input
        description: Quantity on the line.
        constraints: ">= 1"
      - name: unit_cost_cents
        type: integer
        source: input
        description: Unit cost in cents.
        constraints: ">= 0"
      - name: engineering_waiver_ref
        type: string
        source: input
        description: Engineering waiver reference that permits an AFTERMARKET line on a CRITICAL asset.
        default: null
      - name: approval_status
        type: enum
        source: system
        description: OEM-vs-aftermarket approval state.
        default: PROPOSED
        constraints: "one of {PROPOSED, SUBMITTED, APPROVED, REJECTED}"
      - name: revision_count
        type: integer
        source: system
        description: Incremented by 1 on every REVISE action (REJECTED -> PROPOSED).
        default: 0
      - name: decision_note
        type: string
        source: system
        description: Customer's note recorded at decide time.
        default: null
      - name: line_total_cents
        type: integer
        source: computed
        description: qty * unit_cost_cents.

  - name: VibrationReading
    parent: CustomerAsset
    common_fields: false
    fields:
      - name: customer_asset_id
        type: string
        source: input
        description: "FK -> CustomerAsset.id; the machine the route data was collected on."
      - name: reading_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the route reading was taken.
      - name: overall_velocity_mm_s
        type: number
        source: input
        description: Overall vibration velocity in mm/s RMS; drives the ISO severity zone.
        constraints: ">= 0"
      - name: bpfo_amplitude_g
        type: number
        source: input
        description: Ball-pass frequency outer-race amplitude in g.
        constraints: ">= 0"
      - name: bpfi_amplitude_g
        type: number
        source: input
        description: Ball-pass frequency inner-race amplitude in g.
        constraints: ">= 0"
      - name: baseline_amplitude_g
        type: number
        source: input
        description: Healthy-baseline amplitude in g; denominator of the defect ratios.
        constraints: "> 0"
      - name: iso_zone
        type: enum
        source: computed
        description: ISO severity zone banded from overall_velocity_mm_s. See calculations.vibration_zone_classification.
        constraints: "one of {A, B, C, D}"
      - name: defect_ratio_outer
        type: number
        source: computed
        description: bpfo_amplitude_g / baseline_amplitude_g, six decimal places.
      - name: defect_ratio_inner
        type: number
        source: computed
        description: bpfi_amplitude_g / baseline_amplitude_g, six decimal places.

  - name: BenchReservation
    parent: null
    common_fields: true
    fields:
      - name: rebuild_order_id
        type: string
        source: input
        description: "FK -> RebuildOrder.id; the order this bench window is held for."
      - name: bench_id
        type: string
        source: input
        description: "FK -> Bench.id; the bench being occupied."
      - name: window_start_at
        type: datetime
        source: input
        description: ISO 8601 UTC start of the occupation window (inclusive).
      - name: window_end_at
        type: datetime
        source: input
        description: ISO 8601 UTC end of the occupation window (exclusive).
        constraints: "strictly after window_start_at"
      - name: queue_if_full
        type: boolean
        source: input
        description: When true, a full bench yields a QUEUED reservation instead of a rejection.
        default: false
      - name: status
        type: enum
        source: system
        description: Reservation lifecycle state.
        default: HELD
        constraints: "one of {QUEUED, HELD, CONFIRMED, CONSUMED, RELEASED}"
      - name: window_minutes
        type: integer
        source: computed
        description: Whole minutes between window_start_at and window_end_at.
      - name: promoted_at
        type: datetime
        source: system
        description: Logical-clock instant at which a QUEUED reservation was promoted to HELD.
        default: null

  - name: Installation
    parent: null
    common_fields: true
    fields:
      - name: core_unit_id
        type: string
        source: input
        description: "FK -> CoreUnit.id; the rebuilt unit put into service."
      - name: customer_asset_id
        type: string
        source: input
        description: "FK -> CustomerAsset.id; the machine it was installed on."
      - name: rebuild_order_id
        type: string
        source: input
        description: "FK -> RebuildOrder.id; the order that produced the rebuilt unit and whose covered base the warranty pro-rata uses."
      - name: in_service_start_at
        type: datetime
        source: system
        description: Logical-clock instant at which the installation record was created.
      - name: run_hours
        type: number
        source: system
        description: Cumulative run hours logged against this installation.
        default: 0
      - name: status
        type: enum
        source: system
        description: In-service lifecycle state.
        default: INSTALLED
        constraints: "one of {INSTALLED, RUNNING, REMOVED_PLANNED, FAILED_IN_SERVICE}"
      - name: removed_at
        type: datetime
        source: system
        description: Logical-clock instant of a planned removal.
        default: null
      - name: failed_at
        type: datetime
        source: system
        description: Logical-clock instant of an in-service failure.
        default: null
      - name: warranty_hours_snapshot
        type: integer
        source: computed
        description: ClearanceStandard.warranty_hours of the core's spec, snapshotted at installation.
      - name: warranty_months_snapshot
        type: integer
        source: computed
        description: ClearanceStandard.warranty_months of the core's spec, snapshotted at installation.
      - name: covered_base_cents_snapshot
        type: integer
        source: computed
        description: RebuildOrder.covered_base_cents snapshotted at installation; the multiplicand of the pro-rata credit.

  - name: WarrantyClaim
    parent: Installation
    common_fields: true
    fields:
      - name: installation_id
        type: string
        source: input
        description: "FK -> Installation.id; the failed in-service unit being claimed."
      - name: claimed_reason
        type: string
        source: input
        description: Customer's description of the failure.
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED, DENIED, CREDITED}"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant the claim was filed.
      - name: elapsed_days
        type: integer
        source: computed
        description: Whole days between the installation's in_service_start_at and failed_at.
      - name: hours_consumed_fraction
        type: number
        source: computed
        description: min(1, run_hours / warranty_hours_snapshot), six decimal places.
      - name: calendar_consumed_fraction
        type: number
        source: computed
        description: min(1, elapsed_days / (warranty_months_snapshot * 30)), six decimal places.
      - name: governing_basis
        type: enum
        source: computed
        description: Which basis governed the pro-rata; GOODWILL when the order's accepted Inspection coded WORKMANSHIP.
        constraints: "one of {HOURS, CALENDAR, GOODWILL}"
      - name: remaining_fraction
        type: number
        source: computed
        description: 1 - max(hours_consumed_fraction, calendar_consumed_fraction), or 1.0 under GOODWILL. Six decimal places.
      - name: pro_rata_credit_cents
        type: integer
        source: computed
        description: round_half_up(covered_base_cents_snapshot * remaining_fraction). See calculations.warranty_pro_rata_credit.
      - name: adjudication_note
        type: string
        source: system
        description: Note recorded at adjudication.
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the adjudicating caller.
        default: null
      - name: info_note
        type: string
        source: system
        description: Note recorded on the last REQUEST_INFO or RESUBMIT action.
        default: null

  - name: CreditNote
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the account credited."
      - name: kind
        type: enum
        source: system
        description: Which ledger stream this note belongs to.
        constraints: "one of {CORE_EXCHANGE, WARRANTY_PRORATA, MANUAL_ADJUSTMENT}"
      - name: amount_cents
        type: integer
        source: input
        description: Credit amount in cents. Client-supplied only for MANUAL_ADJUSTMENT notes; system-computed for CORE_EXCHANGE and WARRANTY_PRORATA.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Whether the note counts toward the customer's balances.
        default: POSTED
        constraints: "one of {POSTED, VOID}"
      - name: core_unit_id
        type: string
        source: system
        description: "FK -> CoreUnit.id; set on CORE_EXCHANGE notes, null otherwise."
        default: null
      - name: warranty_claim_id
        type: string
        source: system
        description: "FK -> WarrantyClaim.id; set on WARRANTY_PRORATA notes, null otherwise."
        default: null
      - name: memo
        type: string
        source: input
        description: Ledger memo. Client-supplied for MANUAL_ADJUSTMENT; system-written otherwise.
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: Logical-clock instant the note was voided.
        default: null
      - name: void_reason
        type: string
        source: system
        description: Reason recorded at void time.
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # CoreUnit — branching out of GRADED with divergent side-effect sets, plus the
  # GRADED -> INSPECTING re-inspection cycle.
  # ---------------------------------------------------------------------------
  - entity: CoreUnit
    state_field: status
    initial_state: RECEIVED
    terminal_states: [SHIPPED, SCRAPPED, RETURNED_AS_IS]
    transitions:
      - from: RECEIVED
        to: INSPECTING
        trigger: "POST /shop/inspections"
        actor: Inspector
        preconditions:
          - "core_unit.status == RECEIVED"
          - "the referenced RebuildOrder.core_unit_id == this core's id"
          - "RebuildOrder.work_status IN {DRAFT, QUOTED}"
        side_effects:
          - "A new Inspection row is created with status = DRAFT and revision_count = 0."
          - "CoreUnit.status := INSPECTING; CoreUnit.updated_at refreshed; CoreUnit.version += 1."
        note: "Creating a second Inspection while the core is already INSPECTING leaves status unchanged (no transition fires)."

      - from: INSPECTING
        to: GRADED
        trigger: "POST /shop/inspections/{id}/advance with action = ACCEPT"
        actor: Inspector
        preconditions:
          - "inspection.status == SUBMITTED"
          - "X-User-ID != inspection.submitted_by_user_id (segregation of duties)"
          - "no other Inspection under the same rebuild_order_id has status == ACCEPTED"
        side_effects:
          - "CASCADE A hop 1 — Inspection.status := ACCEPTED, accepted_by_user_id := X-User-ID."
          - "CASCADE A hop 2 (caused by hop 1) — CoreUnit.condition_grade := inspection.remaining_life_grade; CoreUnit.status := GRADED; CoreUnit.final_core_credit_cents := calculations.core_credit_valuation variant final_core_credit."
          - "CASCADE A hop 3 (caused by hop 2) — the CoreUnit's POSTED CreditNote with kind == CORE_EXCHANGE (at most one; if several exist take the latest by created_at DESC, then version DESC) transitions to status = VOID with void_reason = 'superseded by bench grading', and a new CreditNote is created with kind = CORE_EXCHANGE, status = POSTED, amount_cents = CoreUnit.final_core_credit_cents, core_unit_id = this core, memo = 'final exchange-core credit'."
          - "CASCADE A hop 4 (caused by hop 3) — Customer.core_credit_balance_cents and Customer.total_credit_balance_cents are recomputed by calculations.customer_credit_balances; Customer.version += 1."
          - "CASCADE A hop 5 (caused by hop 4) — every RebuildOrder of that customer with work_status == QUOTED recomputes core_credit_applied_cents and quote_total_cents via calculations.order_quote_total steps 6-7 only (parts_subtotal_cents, labor_cents, expedite_surcharge_cents and quoted_part_revision are NOT re-snapshotted); each such order's version += 1."

      - from: GRADED
        to: INSPECTING
        trigger: "POST /shop/core-units/{id}/advance with action = REINSPECT"
        actor: Inspector
        preconditions:
          - "core_unit.status == GRADED"
          - "no RebuildOrder referencing this core has work_status IN {IN_PROGRESS, COMPLETED, DELIVERED}"
        side_effects:
          - "The ACCEPTED Inspection under the core's order transitions to RETURNED with return_reason = 'core re-inspection ordered'."
          - "CoreUnit.condition_grade := null; CoreUnit.final_core_credit_cents := null; CoreUnit.status := INSPECTING."
          - "The CoreUnit's POSTED CORE_EXCHANGE CreditNote transitions to VOID; Customer balances recomputed; QUOTED orders of that customer recompute core_credit_applied_cents and quote_total_cents."

      - from: GRADED
        to: REBUILDING
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = START"
        actor: Planner
        preconditions:
          - "core_unit.status == GRADED"
          - "core_unit.condition_grade != SCRAP"
          - "rebuild_order.work_status == SCHEDULED"
        side_effects:
          - "CoreUnit.status := REBUILDING; RebuildOrder.work_status := IN_PROGRESS."

      - from: REBUILDING
        to: GRADED
        trigger: "POST /shop/rebuild-orders/{id}/cancel"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == IN_PROGRESS"
        side_effects:
          - "Compensation — CoreUnit.status reverts to GRADED; CoreUnit.rebuild_count is NOT incremented (it is only incremented at COMPLETE)."

      - from: REBUILDING
        to: REBUILT
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = COMPLETE"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == IN_PROGRESS"
        side_effects:
          - "CoreUnit.status := REBUILT; CoreUnit.rebuild_count += 1."
          - "CASCADE C hop 1 — every BenchReservation of this order with status == CONFIRMED transitions to CONSUMED."
          - "CASCADE C hop 2 (caused by hop 1) — Bench.committed_minutes recomputed by calculations.bench_committed_minutes."
          - "CASCADE C hop 3 (caused by hop 2) — bench queue promotion runs per calculations.bench_queue_promotion."

      - from: REBUILT
        to: SHIPPED
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = DELIVER"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == COMPLETED"
        side_effects:
          - "CoreUnit.status := SHIPPED; RebuildOrder.work_status := DELIVERED."

      - from: GRADED
        to: SCRAPPED
        trigger: "POST /shop/core-units/{id}/advance with action = SCRAP"
        actor: ShopAdmin
        preconditions:
          - "core_unit.status == GRADED"
          - "core_unit.condition_grade == SCRAP OR the request supplies a non-empty override_reason"
          - "when replacement_core_unit_id is supplied: the referenced CoreUnit exists, has status == RECEIVED, the same customer_id and the same clearance_standard_id"
        side_effects:
          - "CoreUnit.status := SCRAPPED; CoreUnit.replacement_core_unit_id := supplied value or null."
          - "The CoreUnit's POSTED CORE_EXCHANGE CreditNote transitions to VOID with void_reason = 'core scrapped'; Customer balances recomputed; QUOTED orders of that customer recompute core_credit_applied_cents and quote_total_cents."
          - "Every RebuildOrder referencing this core with work_status IN {DRAFT, QUOTED, SCHEDULED} transitions to CANCELLED with cancel_reason = 'core scrapped'; each such order's HELD/CONFIRMED BenchReservations transition to RELEASED; Bench.committed_minutes recomputed; bench queue promotion runs."

      - from: RECEIVED
        to: RETURNED_AS_IS
        trigger: "POST /shop/core-units/{id}/advance with action = RETURN_AS_IS"
        actor: ShopAdmin
        preconditions:
          - "core_unit.status == RECEIVED"
        side_effects:
          - "CoreUnit.status := RETURNED_AS_IS; the POSTED CORE_EXCHANGE CreditNote transitions to VOID with void_reason = 'core returned as-is'; Customer balances recomputed."

      - from: GRADED
        to: RETURNED_AS_IS
        trigger: "POST /shop/core-units/{id}/advance with action = RETURN_AS_IS"
        actor: ShopAdmin
        preconditions:
          - "core_unit.status == GRADED"
        side_effects:
          - "CoreUnit.status := RETURNED_AS_IS; the POSTED CORE_EXCHANGE CreditNote transitions to VOID; Customer balances recomputed; QUOTED orders recompute core_credit_applied_cents and quote_total_cents."

  # ---------------------------------------------------------------------------
  # RebuildOrder — dimension 1 of 2 (shop-driven). Runs independently of the
  # approval_status dimension below on the very same row.
  # ---------------------------------------------------------------------------
  - entity: RebuildOrder
    state_field: work_status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = QUOTE"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == DRAFT"
        side_effects:
          - "calculations.order_quote_total runs end to end (steps 1-8); parts_subtotal_cents, labor_cents, pre_credit_subtotal_cents, expedite_surcharge_cents, gross_total_cents, core_credit_applied_cents, quote_total_cents and covered_base_cents are written."
          - "quoted_part_revision := part_revision_counter."

      - from: QUOTED
        to: QUOTED
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = QUOTE (re-quote cycle)"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == QUOTED"
        side_effects:
          - "All eight quote fields are recomputed from current data and quoted_part_revision := part_revision_counter, clearing any ERR_QUOTE_STALE condition."

      - from: DRAFT
        to: DRAFT
        trigger: "POST /shop/rebuild-orders/{id}/expedite"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status IN {DRAFT, QUOTED}"
          - "rebuild_order.expedited == false"
        side_effects:
          - "expedited := true; expedite_reason and emergency_ref recorded. No quote fields are written while work_status == DRAFT."

      - from: QUOTED
        to: QUOTED
        trigger: "POST /shop/rebuild-orders/{id}/expedite"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == QUOTED"
          - "rebuild_order.expedited == false"
        side_effects:
          - "expedited := true; expedite_reason and emergency_ref recorded; calculations.order_quote_total re-runs end to end so expedite_surcharge_cents, gross_total_cents, core_credit_applied_cents and quote_total_cents all move; quoted_part_revision := part_revision_counter."

      - from: QUOTED
        to: SCHEDULED
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = SCHEDULE"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == QUOTED"
          - "rebuild_order.approval_status == APPROVED"
          - "rebuild_order.quoted_part_revision == rebuild_order.part_revision_counter"
          - "at least one BenchReservation of this order has status == CONFIRMED"
        side_effects:
          - "work_status := SCHEDULED."

      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = START"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == SCHEDULED"
          - "the order's CoreUnit.status == GRADED"
          - "the order's CoreUnit.condition_grade != SCRAP"
          - "no Measurement under the order's ACCEPTED Inspection has band_result == OUT_OF_SPEC"
        side_effects:
          - "work_status := IN_PROGRESS; the order's CoreUnit transitions GRADED -> REBUILDING."

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = COMPLETE"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == IN_PROGRESS"
        side_effects:
          - "work_status := COMPLETED; CoreUnit REBUILDING -> REBUILT and CoreUnit.rebuild_count += 1; CASCADE C (reservations CONSUMED -> bench minutes recomputed -> queue promotion) fires."

      - from: COMPLETED
        to: DELIVERED
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = DELIVER"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == COMPLETED"
        side_effects:
          - "work_status := DELIVERED; CoreUnit REBUILT -> SHIPPED."

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /shop/rebuild-orders/{id}/cancel"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status IN {DRAFT, QUOTED, SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "CASCADE B hop 1 — work_status := CANCELLED, cancel_reason recorded; every BenchReservation of this order with status IN {QUEUED, HELD, CONFIRMED} transitions to RELEASED."
          - "CASCADE B hop 2 (caused by hop 1) — for each bench touched, Bench.committed_minutes is recomputed by calculations.bench_committed_minutes."
          - "CASCADE B hop 3 (caused by hop 2) — calculations.bench_queue_promotion runs on each such bench: the earliest QUEUED reservation whose window now fits under parallel_slots transitions QUEUED -> HELD and promoted_at is stamped."
          - "CASCADE B hop 4 (caused by hop 3) — Bench.committed_minutes is recomputed again to include the promoted reservation's window_minutes."

      - from: QUOTED
        to: CANCELLED
        trigger: "POST /shop/rebuild-orders/{id}/cancel"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == QUOTED"
        side_effects:
          - "Same CASCADE B chain as from DRAFT."

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shop/rebuild-orders/{id}/cancel"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == SCHEDULED"
        side_effects:
          - "Same CASCADE B chain as from DRAFT."

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /shop/rebuild-orders/{id}/cancel"
        actor: Planner
        preconditions:
          - "rebuild_order.work_status == IN_PROGRESS"
        side_effects:
          - "Same CASCADE B chain as from DRAFT, plus the compensation CoreUnit REBUILDING -> GRADED."

  # ---------------------------------------------------------------------------
  # RebuildOrder — dimension 2 of 2 (customer-driven, derived from PartLine
  # children). Evolves independently of work_status on the same row.
  # ---------------------------------------------------------------------------
  - entity: RebuildOrder
    state_field: approval_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: PARTIAL
        trigger: "POST /shop/part-lines/{id}/decide (system re-derivation)"
        actor: system
        preconditions:
          - "after the decision at least one PartLine of the order is APPROVED or REJECTED and at least one is still PROPOSED or SUBMITTED"
        side_effects:
          - "approval_status := PARTIAL per calculations.order_approval_rollup; RebuildOrder.part_revision_counter += 1; RebuildOrder.version += 1."

      - from: PENDING
        to: APPROVED
        trigger: "POST /shop/part-lines/{id}/decide (system re-derivation)"
        actor: system
        preconditions:
          - "after the decision every PartLine of the order has approval_status == APPROVED and there is at least one"
        side_effects:
          - "approval_status := APPROVED; part_revision_counter += 1."

      - from: PARTIAL
        to: APPROVED
        trigger: "POST /shop/part-lines/{id}/decide (system re-derivation)"
        actor: system
        preconditions:
          - "after the decision every PartLine of the order has approval_status == APPROVED"
        side_effects:
          - "approval_status := APPROVED; part_revision_counter += 1."

      - from: PARTIAL
        to: REJECTED
        trigger: "POST /shop/part-lines/{id}/decide (system re-derivation)"
        actor: system
        preconditions:
          - "after the decision at least one PartLine is REJECTED and none is PROPOSED or SUBMITTED"
        side_effects:
          - "approval_status := REJECTED; part_revision_counter += 1."

      - from: PENDING
        to: REJECTED
        trigger: "POST /shop/part-lines/{id}/decide (system re-derivation)"
        actor: system
        preconditions:
          - "the order has exactly one PartLine and it is REJECTED"
        side_effects:
          - "approval_status := REJECTED; part_revision_counter += 1."

      - from: APPROVED
        to: PARTIAL
        trigger: "POST /shop/rebuild-orders/{id}/part-lines (system re-derivation)"
        actor: system
        preconditions:
          - "a new PartLine is created in PROPOSED while existing lines are APPROVED"
        side_effects:
          - "approval_status := PARTIAL; part_revision_counter += 1. work_status is untouched, so a SCHEDULE attempt now fails on the approval gate even though the order is still QUOTED."

      - from: REJECTED
        to: PARTIAL
        trigger: "POST /shop/part-lines/{id}/advance with action = REVISE (system re-derivation)"
        actor: system
        preconditions:
          - "a REJECTED PartLine returns to PROPOSED while at least one sibling is APPROVED or REJECTED"
        side_effects:
          - "approval_status := PARTIAL; part_revision_counter += 1."

      - from: REJECTED
        to: PENDING
        trigger: "POST /shop/part-lines/{id}/advance with action = REVISE (system re-derivation)"
        actor: system
        preconditions:
          - "after the revision every PartLine of the order is PROPOSED or SUBMITTED"
        side_effects:
          - "approval_status := PENDING; part_revision_counter += 1."

  # ---------------------------------------------------------------------------
  # Inspection — cyclic (RETURNED -> DRAFT revision loop).
  # ---------------------------------------------------------------------------
  - entity: Inspection
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /shop/inspections/{id}/advance with action = SUBMIT"
        actor: Inspector
        preconditions:
          - "inspection.status == DRAFT"
          - "inspection.linked_vibration_reading_id is not null (may be supplied on this call)"
          - "for every feature_code in the governing ClearanceStandard.required_feature_codes there is at least one Measurement on this inspection"
        side_effects:
          - "submitted_by_user_id := X-User-ID."
          - "calculations.remaining_life_score runs, writing life_score_variant, remaining_life_score and remaining_life_grade."
          - "calculations.failure_cause_coding runs, writing failure_cause_code and cause_confidence."
          - "status := SUBMITTED."

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /shop/inspections/{id}/advance with action = ACCEPT"
        actor: Inspector
        preconditions:
          - "inspection.status == SUBMITTED"
          - "X-User-ID != inspection.submitted_by_user_id"
          - "no sibling Inspection under the same rebuild_order_id has status == ACCEPTED"
        side_effects:
          - "Fires CASCADE A hops 1-5 (see CoreUnit INSPECTING -> GRADED)."

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /shop/inspections/{id}/advance with action = RETURN"
        actor: ReliabilityEngineer
        preconditions:
          - "inspection.status == SUBMITTED"
        side_effects:
          - "status := RETURNED; return_reason recorded. No core grading, no credit note, no balance movement."

      - from: RETURNED
        to: DRAFT
        trigger: "POST /shop/inspections/{id}/advance with action = REOPEN"
        actor: Inspector
        preconditions:
          - "inspection.status == RETURNED"
        side_effects:
          - "status := DRAFT; revision_count += 1; submitted_by_user_id := null; remaining_life_score, remaining_life_grade, life_score_variant, failure_cause_code and cause_confidence are all cleared to null so the next SUBMIT recomputes them."

  # ---------------------------------------------------------------------------
  # PartLine — cyclic (REJECTED -> PROPOSED revision loop).
  # ---------------------------------------------------------------------------
  - entity: PartLine
    state_field: approval_status
    initial_state: PROPOSED
    terminal_states: [APPROVED]
    transitions:
      - from: PROPOSED
        to: SUBMITTED
        trigger: "POST /shop/part-lines/{id}/advance with action = SUBMIT"
        actor: Planner
        preconditions:
          - "part_line.approval_status == PROPOSED"
          - "the parent RebuildOrder.work_status IN {DRAFT, QUOTED}"
        side_effects:
          - "approval_status := SUBMITTED; RebuildOrder.part_revision_counter += 1; RebuildOrder.approval_status re-derived."

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /shop/part-lines/{id}/decide with decision = APPROVE"
        actor: Customer
        preconditions:
          - "part_line.approval_status == SUBMITTED"
          - "X-User-ID == the parent RebuildOrder.customer_id"
        side_effects:
          - "approval_status := APPROVED; decision_note recorded; RebuildOrder.part_revision_counter += 1; RebuildOrder.approval_status re-derived by calculations.order_approval_rollup."

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /shop/part-lines/{id}/decide with decision = REJECT"
        actor: Customer
        preconditions:
          - "part_line.approval_status == SUBMITTED"
          - "X-User-ID == the parent RebuildOrder.customer_id"
        side_effects:
          - "approval_status := REJECTED; decision_note recorded; RebuildOrder.part_revision_counter += 1; RebuildOrder.approval_status re-derived."

      - from: REJECTED
        to: PROPOSED
        trigger: "POST /shop/part-lines/{id}/advance with action = REVISE"
        actor: Planner
        preconditions:
          - "part_line.approval_status == REJECTED"
          - "the parent RebuildOrder.work_status IN {DRAFT, QUOTED}"
          - "if the revision sets source_class = AFTERMARKET on a CRITICAL asset, engineering_waiver_ref must be non-empty"
        side_effects:
          - "Any of part_no, source_class, qty, unit_cost_cents and engineering_waiver_ref supplied on the call overwrite the line; line_total_cents recomputed; revision_count += 1; approval_status := PROPOSED; RebuildOrder.part_revision_counter += 1; RebuildOrder.approval_status re-derived."

  # ---------------------------------------------------------------------------
  # BenchReservation — QUEUED admission plus RELEASE compensation.
  # ---------------------------------------------------------------------------
  - entity: BenchReservation
    state_field: status
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: HELD
        to: QUEUED
        trigger: "POST /shop/bench-reservations with queue_if_full = true on a full window"
        actor: Planner
        preconditions:
          - "the count of overlapping BenchReservation rows on the same bench with status IN {HELD, CONFIRMED} reaches parallel_slots at some instant of the requested window"
          - "queue_if_full == true"
        side_effects:
          - "The row is created with status = QUEUED instead of HELD; it does NOT contribute to Bench.committed_minutes."
        note: "Admission-time branch, not a post-creation transition: creation lands directly in QUEUED."

      - from: QUEUED
        to: HELD
        trigger: "system promotion during CASCADE B hop 3 or CASCADE C hop 3"
        actor: system
        preconditions:
          - "capacity was just freed on the bench by a RELEASED or CONSUMED sibling"
          - "this row is the winner of calculations.bench_queue_promotion"
        side_effects:
          - "status := HELD; promoted_at := logical clock; Bench.committed_minutes recomputed."

      - from: HELD
        to: CONFIRMED
        trigger: "POST /shop/bench-reservations/{id}/advance with action = CONFIRM"
        actor: Planner
        preconditions:
          - "reservation.status == HELD"
        side_effects:
          - "status := CONFIRMED; Bench.committed_minutes unchanged (HELD and CONFIRMED both count)."

      - from: CONFIRMED
        to: CONSUMED
        trigger: "POST /shop/rebuild-orders/{id}/advance with action = COMPLETE"
        actor: system
        preconditions:
          - "the parent RebuildOrder.work_status transitions IN_PROGRESS -> COMPLETED"
        side_effects:
          - "status := CONSUMED; Bench.committed_minutes recomputed; bench queue promotion runs."

      - from: HELD
        to: RELEASED
        trigger: "POST /shop/bench-reservations/{id}/advance with action = RELEASE, or CASCADE B hop 1"
        actor: Planner
        preconditions:
          - "reservation.status IN {QUEUED, HELD, CONFIRMED}"
        side_effects:
          - "status := RELEASED; Bench.committed_minutes recomputed (drops by window_minutes when the row was HELD or CONFIRMED); bench queue promotion runs."

      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /shop/bench-reservations/{id}/advance with action = RELEASE, or CASCADE B hop 1"
        actor: Planner
        preconditions:
          - "reservation.status == CONFIRMED"
          - "the parent RebuildOrder.work_status != IN_PROGRESS, unless the release is a consequence of CASCADE B (order cancellation)"
        side_effects:
          - "status := RELEASED; Bench.committed_minutes recomputed; bench queue promotion runs."

      - from: QUEUED
        to: RELEASED
        trigger: "POST /shop/bench-reservations/{id}/advance with action = RELEASE, or CASCADE B hop 1"
        actor: Planner
        preconditions:
          - "reservation.status == QUEUED"
        side_effects:
          - "status := RELEASED; Bench.committed_minutes unchanged (a QUEUED row never contributed)."

  # ---------------------------------------------------------------------------
  # Installation — RUNNING self-loop plus branch to planned removal / failure.
  # ---------------------------------------------------------------------------
  - entity: Installation
    state_field: status
    initial_state: INSTALLED
    terminal_states: [REMOVED_PLANNED, FAILED_IN_SERVICE]
    transitions:
      - from: INSTALLED
        to: RUNNING
        trigger: "POST /shop/installations/{id}/advance with action = RECORD_HOURS"
        actor: ShopAdmin
        preconditions:
          - "installation.status == INSTALLED"
          - "run_hours_delta > 0"
        side_effects:
          - "run_hours += run_hours_delta; status := RUNNING."

      - from: RUNNING
        to: RUNNING
        trigger: "POST /shop/installations/{id}/advance with action = RECORD_HOURS (self-loop)"
        actor: ShopAdmin
        preconditions:
          - "installation.status == RUNNING"
          - "run_hours_delta > 0"
        side_effects:
          - "run_hours += run_hours_delta; status unchanged."

      - from: RUNNING
        to: FAILED_IN_SERVICE
        trigger: "POST /shop/installations/{id}/advance with action = FAIL"
        actor: ShopAdmin
        preconditions:
          - "installation.status IN {INSTALLED, RUNNING}"
        side_effects:
          - "status := FAILED_IN_SERVICE; failed_at := the logical clock; the CustomerAsset is freed for a new installation subject to the changeover buffer."

      - from: INSTALLED
        to: FAILED_IN_SERVICE
        trigger: "POST /shop/installations/{id}/advance with action = FAIL"
        actor: ShopAdmin
        preconditions:
          - "installation.status == INSTALLED"
        side_effects:
          - "status := FAILED_IN_SERVICE; failed_at := the logical clock."

      - from: RUNNING
        to: REMOVED_PLANNED
        trigger: "POST /shop/installations/{id}/advance with action = REMOVE"
        actor: ShopAdmin
        preconditions:
          - "installation.status IN {INSTALLED, RUNNING}"
        side_effects:
          - "status := REMOVED_PLANNED; removed_at := the logical clock; the CustomerAsset is freed subject to the 24-hour changeover buffer measured from removed_at."

      - from: INSTALLED
        to: REMOVED_PLANNED
        trigger: "POST /shop/installations/{id}/advance with action = REMOVE"
        actor: ShopAdmin
        preconditions:
          - "installation.status == INSTALLED"
        side_effects:
          - "status := REMOVED_PLANNED; removed_at := the logical clock."

  # ---------------------------------------------------------------------------
  # WarrantyClaim — cyclic (INFO_REQUESTED -> UNDER_REVIEW) then branch.
  # ---------------------------------------------------------------------------
  - entity: WarrantyClaim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, CREDITED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /shop/warranty-claims/{id}/advance with action = REVIEW"
        actor: ShopAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "status := UNDER_REVIEW."

      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /shop/warranty-claims/{id}/advance with action = REQUEST_INFO"
        actor: ShopAdmin
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects:
          - "status := INFO_REQUESTED; info_note recorded."

      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /shop/warranty-claims/{id}/advance with action = RESUBMIT"
        actor: Customer
        preconditions:
          - "claim.status == INFO_REQUESTED"
          - "X-User-ID == the claim's installation's RebuildOrder.customer_id"
        side_effects:
          - "status := UNDER_REVIEW; info_note overwritten with the customer's note."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /shop/warranty-claims/{id}/adjudicate with decision = APPROVE"
        actor: ShopAdmin
        preconditions:
          - "claim.status == UNDER_REVIEW"
          - "X-User-ID != the accepted Inspection's accepted_by_user_id of the claim's rebuild order (segregation of duties)"
        side_effects:
          - "status := APPROVED; adjudicated_by_user_id and adjudication_note recorded; pro_rata_credit_cents is re-affirmed from the values snapshotted at claim creation (it is NOT recomputed against later run-hour logs)."

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /shop/warranty-claims/{id}/adjudicate with decision = DENY"
        actor: ShopAdmin
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects:
          - "status := DENIED; adjudicated_by_user_id and adjudication_note recorded; no CreditNote is created and the customer's balances are unchanged."

      - from: APPROVED
        to: CREDITED
        trigger: "POST /shop/warranty-claims/{id}/advance with action = ISSUE_CREDIT"
        actor: ShopAdmin
        preconditions:
          - "claim.status == APPROVED"
        side_effects:
          - "CASCADE D hop 1 — status := CREDITED."
          - "CASCADE D hop 2 (caused by hop 1) — a CreditNote is created with kind = WARRANTY_PRORATA, status = POSTED, amount_cents = claim.pro_rata_credit_cents, warranty_claim_id = this claim, memo = 'warranty pro-rata credit'."
          - "CASCADE D hop 3 (caused by hop 2) — Customer.warranty_credit_balance_cents and Customer.total_credit_balance_cents recomputed; Customer.version += 1."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: part-line-create-stale-order
    parent_entity: RebuildOrder
    write_endpoint: "POST /shop/rebuild-orders/{id}/part-lines"
    occ_field: "expected_order_version"
    description: |
      Adding a PartLine to a RebuildOrder whose version has advanced since the
      client last read it is rejected. A part-line creation legitimately
      supersedes the order's approval rollup and part_revision_counter, so a
      writer working from a stale view of the order would silently reopen an
      approval gate the previous writer had just closed. The check is a stale
      version comparison, not a timing question.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: credit-note-issue-stale-customer
    parent_entity: Customer
    write_endpoint: "POST /shop/customers/{id}/credit-notes"
    occ_field: "expected_customer_version"
    description: |
      Posting a manual adjustment against a Customer whose version has advanced
      since the client last read it is rejected. Every cascade that voids or
      posts an exchange-core or warranty note moves the customer's balances and
      bumps its version, so an adjustment computed against a stale balance would
      over- or under-credit the account.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: installation-create-stale-asset
    parent_entity: CustomerAsset
    write_endpoint: "POST /shop/installations"
    occ_field: "expected_asset_version"
    description: |
      Creating an Installation against a CustomerAsset whose version has
      advanced since the client last read it is rejected. A prior installation
      on the same asset legitimately supersedes the writer's view of what is
      mounted, and the changeover-buffer arithmetic depends on that view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- 1 -------------------------------------------------------------------
  - name: clearance_band_evaluation
    trigger: "POST /shop/inspections/{id}/measurements — runs once per Measurement at creation"
    algorithm: threshold
    formula: |
      band  = the object in ClearanceStandard.feature_bands whose feature_code
              equals Measurement.feature_code, where the standard is
              RebuildOrder(inspection.rebuild_order_id).core_unit.clearance_standard.
      lo    = band.min_um            hi  = band.max_um
      ext   = band.rework_extension_um
      width = hi - lo                                 # width > 0 is guaranteed

      # Inclusive on BOTH edges. lo and hi themselves are IN_SPEC.
      if lo <= measured_um <= hi:
          band_result     = "IN_SPEC"
          deviation_ratio = 0.000000
      else:
          excess = (measured_um - hi) if measured_um > hi else (lo - measured_um)
          # The REWORKABLE shoulder is inclusive of its far edge:
          # hi + ext is REWORKABLE, hi + ext + 1 is OUT_OF_SPEC.
          if excess <= ext:
              band_result = "REWORKABLE"
          else:
              band_result = "OUT_OF_SPEC"
          deviation_ratio = round_half_up(min(1.0, excess / width), 6)

      feature_score = round_half_up(100 * (1 - deviation_ratio), 6)
    input_set: "Exactly one Measurement row; the band is resolved through inspection -> rebuild_order -> core_unit -> clearance_standard."
    constants: {}
    precision: "deviation_ratio and feature_score to 6 decimal places, round_half_up"

  # ---- 2 -------------------------------------------------------------------
  - name: vibration_zone_classification
    trigger: "POST /shop/vibration-readings — runs once at creation"
    algorithm: threshold
    formula: |
      v = overall_velocity_mm_s
      if   v <  ZONE_B_FLOOR:  iso_zone = "A"     # v < 1.40
      elif v <  ZONE_C_FLOOR:  iso_zone = "B"     # 1.40 <= v < 2.80
      elif v <  ZONE_D_FLOOR:  iso_zone = "C"     # 2.80 <= v < 4.50
      else:                    iso_zone = "D"     # v >= 4.50

      defect_ratio_outer = round_half_up(bpfo_amplitude_g / baseline_amplitude_g, 6)
      defect_ratio_inner = round_half_up(bpfi_amplitude_g / baseline_amplitude_g, 6)
    input_set: "One VibrationReading row; baseline_amplitude_g must be > 0 (enforced by ERR_INVALID_REQUEST)."
    constants:
      ZONE_B_FLOOR: 1.40
      ZONE_C_FLOOR: 2.80
      ZONE_D_FLOOR: 4.50
    precision: "ratios to 6 decimal places, round_half_up; zone floors are inclusive (>=)"

  # ---- 3 -------------------------------------------------------------------
  - name: remaining_life_score
    trigger: "POST /shop/inspections/{id}/advance with action = SUBMIT (DRAFT -> SUBMITTED)"
    algorithm: weighted_scoring
    formula: |
      # Step 1 — governing measurement per feature.
      # For each distinct feature_code that has at least one Measurement on this
      # inspection, the GOVERNING measurement is the one with the greatest
      # created_at; ties are broken by the greater sequence_no. `id` is never
      # consulted.
      governing = { feature_code -> Measurement }

      # Step 2 — two competing aggregations over the SAME governing set.
      w(f)          = ClearanceStandard.feature_bands[f].weight
      composite_raw = sum( w(f) * governing[f].feature_score ) / sum( w(f) )
      conservative_raw = min( governing[f].feature_score )

      # Step 3 — variant selection is pinned by asset criticality.
      if RebuildOrder.customer_asset.criticality == "CRITICAL":
          life_score_variant = "CONSERVATIVE";  base_raw = conservative_raw
      else:
          life_score_variant = "COMPOSITE";     base_raw = composite_raw

      # Step 4 — penalties. base_raw is rounded to a whole number FIRST, then
      # the two integer penalties are subtracted (rounding order is pinned).
      vib_penalty     = ZONE_PENALTY[ linked VibrationReading.iso_zone ]
      rebuild_penalty = REBUILD_PENALTY_PER_CYCLE * CoreUnit.rebuild_count
      remaining_life_score = clamp(0, 100,
                                   round_half_up(base_raw, 0)
                                   - vib_penalty - rebuild_penalty)

      # Step 5 — band the score. Every floor is inclusive.
      remaining_life_grade =
          "GRADE_A" if remaining_life_score >= 80 else
          "GRADE_B" if remaining_life_score >= 60 else
          "GRADE_C" if remaining_life_score >= 35 else
          "GRADE_D" if remaining_life_score >= 15 else
          "SCRAP"
    input_set: >-
      All Measurement rows of this Inspection (governing row per feature_code),
      the linked VibrationReading's iso_zone, and the CoreUnit's rebuild_count.
      Measurements belonging to sibling inspections are excluded.
    constants:
      ZONE_PENALTY: { A: 0, B: 5, C: 15, D: 30 }
      REBUILD_PENALTY_PER_CYCLE: 6
      GRADE_A_FLOOR: 80
      GRADE_B_FLOOR: 60
      GRADE_C_FLOOR: 35
      GRADE_D_FLOOR: 15
    precision: "composite_raw and conservative_raw carried at full precision; rounded to an integer once, before penalties"
    variants:
      - name: composite_grade
        when: "RebuildOrder.customer_asset.criticality == STANDARD"
        difference: "Weight-averages every governing feature score, so a single bad feature is diluted by healthy siblings."
      - name: conservative_grade
        when: "RebuildOrder.customer_asset.criticality == CRITICAL"
        difference: "Takes the minimum governing feature score, so the worst feature alone governs. On identical metrology this yields a strictly lower or equal score, and can drop the grade a whole band."

  # ---- 4 -------------------------------------------------------------------
  - name: failure_cause_coding
    trigger: "POST /shop/inspections/{id}/advance with action = SUBMIT (DRAFT -> SUBMITTED)"
    algorithm: constraint_propagation
    formula: |
      r = the Inspection's linked VibrationReading
      # Evaluated top to bottom; the FIRST matching clause wins.
      1. if Inspection.cause_code_override is not null:
             code = cause_code_override                    ; confidence = "ASSERTED"
      2. elif r.defect_ratio_outer >= DEFECT_RATIO_FLOOR
              and r.defect_ratio_outer >= r.defect_ratio_inner:
             code = "OUTER_RACE_SPALL"                     ; confidence = "HIGH"
      3. elif r.defect_ratio_inner >= DEFECT_RATIO_FLOOR:
             code = "INNER_RACE_SPALL"                     ; confidence = "HIGH"
      4. elif r.iso_zone == "D":
             code = "MISALIGNMENT"                         ; confidence = "MEDIUM"
      5. elif the governing Measurement for feature_code "HOUSING_FIT" exists
              and its band_result != "IN_SPEC":
             code = "LOOSE_FIT"                            ; confidence = "MEDIUM"
      6. elif r.iso_zone == "C":
             code = "LUBRICATION_FAILURE"                  ; confidence = "MEDIUM"
      7. elif CoreUnit.rebuild_count >= NORMAL_WEAR_REBUILD_FLOOR:
             code = "NORMAL_WEAR"                          ; confidence = "LOW"
      8. else:
             code = "UNDETERMINED"                         ; confidence = "LOW"
      # Clause 2 before clause 3 is the pinned tie-break: when the two defect
      # ratios are exactly equal and both clear the floor, OUTER_RACE_SPALL wins.
    input_set: "The linked VibrationReading, the governing HOUSING_FIT Measurement of this Inspection (if any), CoreUnit.rebuild_count and the Inspection's own cause_code_override."
    constants:
      DEFECT_RATIO_FLOOR: 3.0
      NORMAL_WEAR_REBUILD_FLOOR: 2
    precision: "comparisons on the 6-decimal defect ratios written by vibration_zone_classification"

  # ---- 5 -------------------------------------------------------------------
  - name: core_credit_valuation
    trigger: >-
      Variant provisional_core_credit runs on POST /shop/core-units (receipt).
      Variant final_core_credit runs inside CASCADE A hop 2, i.e. on
      POST /shop/inspections/{id}/advance with action = ACCEPT.
    algorithm: tiered_pricing
    formula: |
      base = ClearanceStandard.base_core_value_cents
      # --- tier ---------------------------------------------------------
      tiered_cents = round_half_up( base * TIER_MULTIPLIER[grade_in_use] , 0 )
      # --- rebuild decay ------------------------------------------------
      decay_cents  = round_half_up( base * REBUILD_DECAY_PCT * CoreUnit.rebuild_count , 0 )
      # --- deficiency deductions (NESTED ROUNDING — order is pinned) -----
      # Each deduction line is rounded to whole cents INDIVIDUALLY and the
      # rounded lines are then summed. Summing first and rounding once is
      # explicitly NOT the rule and yields different cents.
      deduction_cents = 0
      for each governing Measurement m of the accepted Inspection (one per
          feature_code, chosen exactly as in remaining_life_score step 1):
          pct = ClearanceStandard.feature_bands[m.feature_code].deduction_pct
          if   m.band_result == "OUT_OF_SPEC":
               line = round_half_up( base * pct , 0 )
          elif m.band_result == "REWORKABLE":
               line = round_half_up( base * pct * REWORKABLE_DEDUCTION_FACTOR , 0 )
          else:
               line = 0
          deduction_cents += line          # sum of ALREADY-rounded lines
      # --- assemble ------------------------------------------------------
      credit_cents = max( 0 , min( base , tiered_cents - decay_cents - deduction_cents ) )
    input_set: >-
      For provisional_core_credit: the CoreUnit's declared_condition_grade and
      rebuild_count only; the deduction loop runs over an empty set because no
      Inspection exists yet. For final_core_credit: the bench-verified
      remaining_life_grade of the ACCEPTED Inspection and every governing
      Measurement of that inspection.
    constants:
      TIER_MULTIPLIER: { GRADE_A: 1.00, GRADE_B: 0.75, GRADE_C: 0.45, GRADE_D: 0.20, SCRAP: 0.00 }
      REBUILD_DECAY_PCT: 0.08
      REWORKABLE_DEDUCTION_FACTOR: 0.5
    precision: "whole cents; every intermediate (tier product, decay product, each deduction line) is rounded half-up to cents before it is combined"
    variants:
      - name: provisional_core_credit
        when: "At core receipt, written to CoreUnit.provisional_core_credit_cents."
        difference: "grade_in_use = declared_condition_grade; the deduction loop is empty. Posted immediately as a CORE_EXCHANGE CreditNote."
      - name: final_core_credit
        when: "At inspection acceptance, written to CoreUnit.final_core_credit_cents."
        difference: "grade_in_use = the accepted Inspection's remaining_life_grade and every governing Measurement contributes a rounded deduction line. The provisional CreditNote is VOIDed and replaced, so the customer's balance moves by (final - provisional), which may be negative."

  # ---- 6 -------------------------------------------------------------------
  - name: order_approval_rollup
    trigger: "Any PartLine mutation under the order: POST /shop/rebuild-orders/{id}/part-lines, POST /shop/part-lines/{id}/advance, POST /shop/part-lines/{id}/decide"
    algorithm: aggregation
    formula: |
      L = every PartLine with rebuild_order_id == this order (no status filter;
          PartLine has no soft-deleted or archived state).
      pending  = { l in L : l.approval_status IN {PROPOSED, SUBMITTED} }
      approved = { l in L : l.approval_status == APPROVED }
      rejected = { l in L : l.approval_status == REJECTED }

      if   len(L) == 0:                       approval_status = "PENDING"
      elif len(pending) == len(L):            approval_status = "PENDING"
      elif len(approved) == len(L):           approval_status = "APPROVED"
      elif len(pending) == 0 and len(rejected) >= 1:
                                              approval_status = "REJECTED"
      else:                                   approval_status = "PARTIAL"

      # Always paired with: RebuildOrder.part_revision_counter += 1
    input_set: "All PartLine rows of the order, whatever their approval_status."
    constants: {}
    precision: "n/a — enum result"

  # ---- 7 -------------------------------------------------------------------
  - name: order_quote_total
    trigger: >-
      Steps 1-8 run on POST /shop/rebuild-orders/{id}/advance action = QUOTE and
      on POST /shop/rebuild-orders/{id}/expedite when work_status == QUOTED.
      Steps 6-7 ALONE re-run inside CASCADE A hop 5 and inside every other
      cascade that moves the customer's credit balance while the order is QUOTED.
    algorithm: waterfall_allocation
    formula: |
      # The dependency LOOKS circular — the credit cap is a percentage of a
      # total that itself contains a surcharge whose tier is chosen from a
      # subtotal — so the evaluation order below is PINNED and normative.

      # 1. Approved parts only, per-line product then sum.
      parts_subtotal_cents = sum( l.qty * l.unit_cost_cents
                                  for l in PartLine where rebuild_order_id == order
                                  and l.approval_status == "APPROVED" )
      # 2. Labor.
      labor_cents = round_half_up( labor_hours * LABOR_RATE_CENTS_PER_HOUR , 0 )
      # 3. Pre-credit subtotal.
      pre_credit_subtotal_cents = parts_subtotal_cents + labor_cents
      # 4. Emergency surcharge — the TIER IS CHOSEN ON pre_credit_subtotal_cents,
      #    never on gross_total_cents and never on quote_total_cents. Floors are
      #    inclusive, so a subtotal of exactly 100000 uses 0.22, and 99999 uses
      #    0.30 (the surcharge is deliberately non-monotonic across that edge).
      if order.expedited == false:
          expedite_surcharge_cents = 0
      else:
          pct = EXPEDITE_PCT_LOW  if pre_credit_subtotal_cents <  EXPEDITE_TIER_1_FLOOR else
                EXPEDITE_PCT_MID  if pre_credit_subtotal_cents <  EXPEDITE_TIER_2_FLOOR else
                EXPEDITE_PCT_HIGH
          expedite_surcharge_cents = round_half_up( pre_credit_subtotal_cents * pct , 0 )
                                     + EXPEDITE_CALLOUT_CENTS
      # 5. Gross.
      gross_total_cents = pre_credit_subtotal_cents + expedite_surcharge_cents
      # 6. Credit cap — FLOOR division, not round_half_up.
      credit_cap_cents = floor( gross_total_cents * CORE_CREDIT_CAP_PCT )
      # 7. Draw-down against the customer's POSTED ledger balance.
      core_credit_applied_cents = min( Customer.total_credit_balance_cents ,
                                       credit_cap_cents )
      quote_total_cents = gross_total_cents - core_credit_applied_cents
      # 8. Warranty coverage base — per-line rounding, OEM in full, aftermarket
      #    at half. Snapshotted here and copied onto any Installation.
      covered_base_cents = labor_cents + sum(
            round_half_up( l.qty * l.unit_cost_cents *
                           (1.0 if l.source_class == "OEM"
                                else AFTERMARKET_COVERAGE_PCT) , 0 )
            for l in PartLine where rebuild_order_id == order
            and l.approval_status == "APPROVED" )
    input_set: "APPROVED PartLine rows of this order only; the order's own labor_hours and expedited flag; the owning Customer's total_credit_balance_cents at the instant of evaluation."
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 14500
      EXPEDITE_TIER_1_FLOOR: 100000
      EXPEDITE_TIER_2_FLOOR: 500000
      EXPEDITE_PCT_LOW: 0.30
      EXPEDITE_PCT_MID: 0.22
      EXPEDITE_PCT_HIGH: 0.15
      EXPEDITE_CALLOUT_CENTS: 25000
      CORE_CREDIT_CAP_PCT: 0.40
      AFTERMARKET_COVERAGE_PCT: 0.50
    precision: "whole cents; step 6 uses floor, every other rounding is round_half_up"

  # ---- 8 -------------------------------------------------------------------
  - name: warranty_pro_rata_credit
    trigger: "POST /shop/warranty-claims (claim creation) — the result is frozen onto the claim and re-affirmed, not recomputed, at adjudication"
    algorithm: decay_function
    formula: |
      inst = the claim's Installation
      elapsed_days = floor( (inst.failed_at - inst.in_service_start_at)
                            / 86400 seconds )

      hours_consumed_fraction    = round_half_up(
            min(1.0, inst.run_hours / inst.warranty_hours_snapshot) , 6 )
      calendar_consumed_fraction = round_half_up(
            min(1.0, elapsed_days /
                     (inst.warranty_months_snapshot * DAYS_PER_WARRANTY_MONTH)) , 6 )

      # GOODWILL pre-empts both bases.
      insp = the Inspection with rebuild_order_id == inst.rebuild_order_id and
             status == "ACCEPTED" (at most one exists by construction)
      if insp is not null and insp.failure_cause_code == "WORKMANSHIP":
          governing_basis    = "GOODWILL"
          remaining_fraction = 1.000000
      else:
          # The basis that consumed MORE warranty governs — the customer is
          # credited on whichever clock ran out faster.
          if hours_consumed_fraction >= calendar_consumed_fraction:
              governing_basis = "HOURS"
          else:
              governing_basis = "CALENDAR"
          remaining_fraction = round_half_up(
                1.0 - max(hours_consumed_fraction,
                          calendar_consumed_fraction) , 6 )

      pro_rata_credit_cents = round_half_up(
            inst.covered_base_cents_snapshot * remaining_fraction , 0 )
    input_set: "One Installation (run_hours at claim time, in_service_start_at, failed_at, and the three snapshot fields) plus the ACCEPTED Inspection of its rebuild order."
    constants:
      DAYS_PER_WARRANTY_MONTH: 30
    precision: "fractions to 6 decimal places round_half_up, then a single round_half_up to whole cents"
    variants:
      - name: hours_basis
        when: "hours_consumed_fraction >= calendar_consumed_fraction (ties go to HOURS)"
        difference: "Pro-rates on metered run hours against warranty_hours_snapshot."
      - name: calendar_basis
        when: "calendar_consumed_fraction > hours_consumed_fraction"
        difference: "Pro-rates on elapsed 30-day months against warranty_months_snapshot. On identical inputs the two bases yield different credits; the scaffold pins max-consumption (min-remaining) as governing, so the customer is never credited on the more generous clock."
      - name: goodwill_full
        when: "the rebuild order's ACCEPTED Inspection coded failure_cause_code == WORKMANSHIP"
        difference: "remaining_fraction is forced to 1.000000 and the entire covered base is credited regardless of hours or calendar consumption."

  # ---- 9 -------------------------------------------------------------------
  - name: customer_credit_balances
    trigger: "Every CreditNote creation and every CreditNote void, including those fired inside CASCADE A, CASCADE D and the core scrap / return-as-is / re-inspect side effects"
    algorithm: aggregation
    formula: |
      N = { CreditNote : customer_id == C and status == "POSTED" }
      core_credit_balance_cents     = sum(n.amount_cents for n in N
                                          if n.kind == "CORE_EXCHANGE")
      warranty_credit_balance_cents = sum(n.amount_cents for n in N
                                          if n.kind == "WARRANTY_PRORATA")
      manual_credit_balance_cents   = sum(n.amount_cents for n in N
                                          if n.kind == "MANUAL_ADJUSTMENT")
      total_credit_balance_cents    = core_credit_balance_cents
                                    + warranty_credit_balance_cents
                                    + manual_credit_balance_cents
      # Full recompute from the ledger, never an incremental delta. VOID rows
      # are excluded, which is what makes issue+void exactly conservative.
    input_set: "All CreditNote rows of the customer with status == POSTED; VOID rows are excluded from every stream."
    constants:
      CUSTOMER_CREDIT_CEILING_CENTS: 2000000
    precision: "whole cents, exact integer arithmetic"

  # ---- 10 ------------------------------------------------------------------
  - name: bench_committed_minutes
    trigger: "Every BenchReservation creation and every status transition (promotion, confirm, consume, release), including the cascaded ones"
    algorithm: aggregation
    formula: |
      window_minutes(r) = floor( (r.window_end_at - r.window_start_at)
                                 / 60 seconds )
      Bench.committed_minutes = sum( window_minutes(r)
                                     for r in BenchReservation
                                     where r.bench_id == B
                                     and r.status IN {"HELD", "CONFIRMED"} )
      # QUEUED, CONSUMED and RELEASED rows contribute zero. Full recompute from
      # the reservation table, never an incremental delta.
    input_set: "BenchReservation rows of the bench whose status is HELD or CONFIRMED; every other status is excluded."
    constants: {}
    precision: "whole minutes, floor"

  # ---- 11 ------------------------------------------------------------------
  - name: bench_window_overlap_admission
    trigger: "POST /shop/bench-reservations"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics: [window_start_at, window_end_at).
      # Two reservations A and B overlap iff
      #     A.window_start_at < B.window_end_at
      # and B.window_start_at < A.window_end_at.
      # Therefore A.window_end_at == B.window_start_at (exact adjacency) does
      # NOT overlap and is always admissible.
      occupants(t) = count of BenchReservation r on this bench with
                     status IN {"HELD", "CONFIRMED"} and
                     r.window_start_at <= t < r.window_end_at
      peak = max over the requested window of occupants(t)
             (equivalently: the maximum number of pairwise-overlapping existing
              HELD/CONFIRMED reservations that also overlap the request)

      if peak < Bench.parallel_slots:
          the new row is created with status = HELD
      elif queue_if_full == true:
          the new row is created with status = QUEUED
      else:
          reject with ERR_BENCH_WINDOW_CONFLICT (409)
    input_set: "HELD and CONFIRMED reservations on the target bench only; QUEUED, CONSUMED and RELEASED rows are invisible to the capacity count."
    constants: {}
    precision: "instant comparison at second resolution; boundaries are half-open"

  # ---- 12 ------------------------------------------------------------------
  - name: bench_queue_promotion
    trigger: "CASCADE B hop 3 and CASCADE C hop 3 — whenever a reservation on a bench leaves HELD or CONFIRMED"
    algorithm: chronological
    formula: |
      candidates = { r on this bench : r.status == "QUEUED" and admitting r
                     would keep peak occupancy strictly below
                     Bench.parallel_slots per bench_window_overlap_admission }
      if candidates is empty: no promotion occurs and nothing else changes.
      else:
          winner = the candidate with the earliest created_at;
                   ties broken by the earliest window_start_at;
                   further ties broken by the smaller window_minutes.
                   `id` is never consulted.
          winner.status := "HELD"; winner.promoted_at := logical clock.
      # Exactly one promotion per freed slot; the routine does not loop.
    input_set: "QUEUED reservations on the affected bench only."
    constants: {}
    precision: "n/a — selection rule"

  # ---- 13 ------------------------------------------------------------------
  - name: installation_changeover_admission
    trigger: "POST /shop/installations"
    algorithm: interval_merge
    formula: |
      # CLOSED-interval, capacity-1 semantics with a mandatory buffer — a
      # deliberately different geometry from the half-open, multi-slot bench rule.
      A = the target CustomerAsset

      # STEP 1 (validations priority 13, business_temporal) — changeover buffer.
      past = { i in Installation : i.customer_asset_id == A.id and
               i.status IN {"REMOVED_PLANNED", "FAILED_IN_SERVICE"} }
      if past is non-empty:
          last_off = max over past of coalesce(i.removed_at, i.failed_at)
                     (ties broken by the greater created_at)
          now = the logical clock, which also becomes in_service_start_at
          # The buffer edge is INCLUSIVE: now == last_off + 24h is admissible.
          if now < last_off + CHANGEOVER_BUFFER_HOURS hours:
              reject with ERR_INSTALL_BUFFER_VIOLATION (409)

      # STEP 2 (validations priority 14, business_constraint) — occupancy.
      # Deliberately AFTER the buffer check: when an asset both still carries a
      # live unit and sits inside the changeover window of an earlier removal,
      # the temporal error wins.
      live = { i in Installation : i.customer_asset_id == A.id and
               i.status IN {"INSTALLED", "RUNNING"} }
      if live is non-empty:
          reject with ERR_ASSET_OCCUPIED (409)
    input_set: "All Installation rows on the target asset; live rows drive occupancy, terminal rows drive the buffer."
    constants:
      CHANGEOVER_BUFFER_HOURS: 24
    precision: "second resolution; the buffer edge is inclusive (>=)"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#      the FIRST rule that fails determines the response error_id)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty, and X-User-Role is one of the five declared roles."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The caller's X-User-Role appears in the target endpoint's declared roles list."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: >-
      For endpoints that carry an `action` or `decision` discriminator, the
      supplied value is permitted for the caller's role by this map:
      rebuild-orders/advance {QUOTE, SCHEDULE, START, COMPLETE, DELIVER} -> {Planner, ShopAdmin};
      inspections/advance SUBMIT -> {Inspector}, ACCEPT -> {Inspector, ShopAdmin},
      RETURN -> {ReliabilityEngineer, ShopAdmin}, REOPEN -> {Inspector};
      part-lines/advance {SUBMIT, REVISE} -> {Planner, ShopAdmin};
      core-units/advance REINSPECT -> {Inspector, ShopAdmin}, {SCRAP, RETURN_AS_IS} -> {ShopAdmin};
      bench-reservations/advance {CONFIRM, RELEASE} -> {Planner, ShopAdmin};
      installations/advance {RECORD_HOURS, FAIL} -> {ShopAdmin, Customer}, REMOVE -> {ShopAdmin};
      warranty-claims/advance {REVIEW, REQUEST_INFO, ISSUE_CREDIT} -> {ShopAdmin},
      RESUBMIT -> {Customer, ShopAdmin}.
    error_id: ERR_ACTION_NOT_PERMITTED_FOR_ROLE
    http_status: 403
    applies_to: "POST /shop/rebuild-orders/{id}/advance, POST /shop/inspections/{id}/advance, POST /shop/part-lines/{id}/advance, POST /shop/core-units/{id}/advance, POST /shop/bench-reservations/{id}/advance, POST /shop/installations/{id}/advance, POST /shop/warranty-claims/{id}/advance"

  - priority: 4
    category: existence
    check: "Every id embedded in the request path exists, validated left to right."
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/customers/{id}, GET /shop/customers/{id}/assets, POST /shop/customers/{id}/assets, POST /shop/customers/{id}/credit-notes"

  - priority: 4
    category: existence
    check: "The asset id in the path exists."
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/assets/{id}, GET /shop/assets/{id}/vibration-readings"

  - priority: 4
    category: existence
    check: "The clearance standard id in the path exists."
    error_id: ERR_STANDARD_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/clearance-standards/{id}"

  - priority: 4
    category: existence
    check: "The bench id in the path exists."
    error_id: ERR_BENCH_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/benches/{id}, GET /shop/benches/{id}/reservations"

  - priority: 4
    category: existence
    check: "The core unit id in the path exists."
    error_id: ERR_CORE_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/core-units/{id}, POST /shop/core-units/{id}/advance"

  - priority: 4
    category: existence
    check: "The rebuild order id in the path exists."
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/rebuild-orders/{id}, GET /shop/rebuild-orders/{id}/part-lines, GET /shop/rebuild-orders/{id}/bench-reservations, GET /shop/rebuild-orders/{id}/quote, POST /shop/rebuild-orders/{id}/advance, POST /shop/rebuild-orders/{id}/cancel, POST /shop/rebuild-orders/{id}/expedite, POST /shop/rebuild-orders/{id}/part-lines"

  - priority: 4
    category: existence
    check: "The inspection id in the path exists."
    error_id: ERR_INSPECTION_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/inspections/{id}, GET /shop/inspections/{id}/measurements, POST /shop/inspections/{id}/measurements, POST /shop/inspections/{id}/advance"

  - priority: 4
    category: existence
    check: "The part line id in the path exists."
    error_id: ERR_PART_LINE_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/part-lines/{id}/advance, POST /shop/part-lines/{id}/decide"

  - priority: 4
    category: existence
    check: "The bench reservation id in the path exists."
    error_id: ERR_RESERVATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/bench-reservations/{id}/advance"

  - priority: 4
    category: existence
    check: "The installation id in the path exists."
    error_id: ERR_INSTALLATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/installations/{id}, GET /shop/installations/{id}/warranty-claims, POST /shop/installations/{id}/advance"

  - priority: 4
    category: existence
    check: "The warranty claim id in the path exists."
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/warranty-claims/{id}, POST /shop/warranty-claims/{id}/advance, POST /shop/warranty-claims/{id}/adjudicate"

  - priority: 4
    category: existence
    check: "The credit note id in the path exists."
    error_id: ERR_CREDIT_NOTE_NOT_FOUND
    http_status: 404
    applies_to: "GET /shop/credit-notes/{id}, POST /shop/credit-notes/{id}/void"

  - priority: 5
    category: business_constraint
    check: >-
      Request body shape: every required field present; enums within their
      declared value sets; numeric ranges honored (qty >= 1, unit_cost_cents >= 0,
      labor_hours > 0, run_hours_delta > 0, parallel_slots >= 1,
      baseline_amplitude_g > 0, amount_cents >= 0, max_um > min_um,
      window_end_at strictly after window_start_at, required_feature_codes
      non-empty and each present in feature_bands, feature_code present in the
      governing standard's feature_bands, limit within 1..100, offset >= 0).
      Unknown body fields and client attempts to set `source: computed` or
      `source: system` fields are ignored, not rejected.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and every paginated list endpoint"

  - priority: 6
    category: existence
    check: "Every foreign key supplied in the request BODY resolves to an existing row, validated in the field order declared by the endpoint's input list."
    error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/core-units (customer_id), POST /shop/rebuild-orders (customer_id)"

  - priority: 6
    category: existence
    check: "Body clearance_standard_id resolves."
    error_id: ERR_STANDARD_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/core-units (clearance_standard_id)"

  - priority: 6
    category: existence
    check: "Body core_unit_id resolves; on core-units/advance the replacement_core_unit_id also resolves."
    error_id: ERR_CORE_UNIT_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/rebuild-orders (core_unit_id), POST /shop/installations (core_unit_id), POST /shop/core-units/{id}/advance (replacement_core_unit_id)"

  - priority: 6
    category: existence
    check: "Body customer_asset_id resolves."
    error_id: ERR_ASSET_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/rebuild-orders (customer_asset_id), POST /shop/vibration-readings (customer_asset_id), POST /shop/installations (customer_asset_id)"

  - priority: 6
    category: existence
    check: "Body rebuild_order_id resolves."
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/inspections (rebuild_order_id), POST /shop/bench-reservations (rebuild_order_id), POST /shop/installations (rebuild_order_id)"

  - priority: 6
    category: existence
    check: "Body bench_id resolves."
    error_id: ERR_BENCH_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/bench-reservations (bench_id)"

  - priority: 6
    category: existence
    check: "Body linked_vibration_reading_id resolves."
    error_id: ERR_READING_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/inspections (linked_vibration_reading_id), POST /shop/inspections/{id}/advance (linked_vibration_reading_id)"

  - priority: 6
    category: existence
    check: "Body installation_id resolves."
    error_id: ERR_INSTALLATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /shop/warranty-claims (installation_id)"

  - priority: 7
    category: auth
    check: >-
      When X-User-Role == Customer, X-User-ID must equal the Customer id that
      owns the target resource: the part line's order's customer_id, the claim's
      installation's rebuild order's customer_id, the installation's rebuild
      order's customer_id, or the customer_id of the resource being read.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /shop/part-lines/{id}/decide, POST /shop/warranty-claims, POST /shop/warranty-claims/{id}/advance, POST /shop/installations/{id}/advance, and every GET when the caller's role is Customer"

  - priority: 8
    category: state
    check: "expected_order_version / expected_customer_version / expected_asset_version equals the current `version` of the named parent row."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /shop/rebuild-orders/{id}/part-lines, POST /shop/customers/{id}/credit-notes, POST /shop/installations"

  - priority: 9
    category: state
    check: "The RebuildOrder's work_status admits the requested action per the work_status state machine (QUOTE from DRAFT/QUOTED, SCHEDULE from QUOTED, START from SCHEDULED, COMPLETE from IN_PROGRESS, DELIVER from COMPLETED, cancel from any non-terminal, part-line creation from DRAFT/QUOTED)."
    error_id: ERR_ORDER_INVALID_STATE
    http_status: 409
    applies_to: "POST /shop/rebuild-orders/{id}/advance, POST /shop/rebuild-orders/{id}/cancel, POST /shop/rebuild-orders/{id}/part-lines"

  - priority: 9
    category: state
    check: "The CoreUnit's status admits the requested action (REINSPECT from GRADED, SCRAP from GRADED, RETURN_AS_IS from RECEIVED or GRADED)."
    error_id: ERR_CORE_UNIT_INVALID_STATE
    http_status: 409
    applies_to: "POST /shop/core-units/{id}/advance"

  - priority: 9
    category: state
    check: "The Inspection's status admits the requested action (SUBMIT from DRAFT, ACCEPT and RETURN from SUBMITTED, REOPEN from RETURNED) and measurements may only be added while the inspection is DRAFT."
    error_id: ERR_INSPECTION_INVALID_STATE
    http_status: 409
    applies_to: "POST /shop/inspections/{id}/advance, POST /shop/inspections/{id}/measurements"

  - priority: 9
    category: state
    check: "The PartLine's approval_status admits the requested action (SUBMIT from PROPOSED, REVISE from REJECTED, decide from SUBMITTED)."
    error_id: ERR_PART_LINE_INVALID_STATE
    http_status: 409
    applies_to: "POST /shop/part-lines/{id}/advance, POST /shop/part-lines/{id}/decide"

  - priority: 9
    category: state
    check: "The BenchReservation's status admits the requested action (CONFIRM from HELD, RELEASE from QUEUED/HELD/CONFIRMED)."
    error_id: ERR_RESERVATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /shop/bench-reservations/{id}/advance"

  - priority: 9
    category: state
    check: "The Installation's status admits the requested action (RECORD_HOURS from INSTALLED/RUNNING, FAIL and REMOVE from INSTALLED/RUNNING); terminal installations reject every action."
    error_id: ERR_INSTALLATION_INVALID_STATE
    http_status: 409
    applies_to: "POST /shop/installations/{id}/advance"

  - priority: 9
    category: state
    check: "The WarrantyClaim's status admits the requested action (REVIEW from SUBMITTED, REQUEST_INFO from UNDER_REVIEW, RESUBMIT from INFO_REQUESTED, ISSUE_CREDIT from APPROVED, adjudicate from UNDER_REVIEW)."
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "POST /shop/warranty-claims/{id}/advance, POST /shop/warranty-claims/{id}/adjudicate"

  - priority: 9
    category: state
    check: "The CreditNote's status is POSTED; voiding an already-VOID note is rejected."
    error_id: ERR_CREDIT_NOTE_INVALID_STATE
    http_status: 409
    applies_to: "POST /shop/credit-notes/{id}/void"

  - priority: 10
    category: business_safety
    check: >-
      Segregation of duties. On inspections/advance action = ACCEPT, X-User-ID
      must differ from the inspection's submitted_by_user_id. On
      warranty-claims/adjudicate, X-User-ID must differ from the
      accepted_by_user_id of the ACCEPTED Inspection of the claim's rebuild order.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /shop/inspections/{id}/advance (ACCEPT), POST /shop/warranty-claims/{id}/adjudicate"

  - priority: 11
    category: business_referential
    check: "On inspections/advance action = ACCEPT, no sibling Inspection under the same rebuild_order_id already has status == ACCEPTED."
    error_id: ERR_INSPECTION_ALREADY_ACCEPTED
    http_status: 409
    applies_to: "POST /shop/inspections/{id}/advance (ACCEPT)"

  - priority: 11
    category: business_referential
    check: "On inspection creation and on inspections/advance when linked_vibration_reading_id is supplied, the reading's customer_asset_id equals the rebuild order's customer_asset_id."
    error_id: ERR_VIBRATION_ASSET_MISMATCH
    http_status: 409
    applies_to: "POST /shop/inspections, POST /shop/inspections/{id}/advance"

  - priority: 11
    category: business_referential
    check: "On rebuild-orders/advance action = START, the order's CoreUnit.status == GRADED."
    error_id: ERR_CORE_NOT_GRADED
    http_status: 409
    applies_to: "POST /shop/rebuild-orders/{id}/advance (START)"

  - priority: 11
    category: business_referential
    check: "On rebuild-orders/advance action = START, the order's CoreUnit.condition_grade != SCRAP and CoreUnit.status != SCRAPPED."
    error_id: ERR_CORE_SCRAPPED
    http_status: 409
    applies_to: "POST /shop/rebuild-orders/{id}/advance (START), POST /shop/installations"

  - priority: 11
    category: business_referential
    check: "On rebuild-orders/advance action = SCHEDULE, the order's approval_status == APPROVED."
    error_id: ERR_PART_APPROVAL_PENDING
    http_status: 409
    applies_to: "POST /shop/rebuild-orders/{id}/advance (SCHEDULE)"

  - priority: 11
    category: business_referential
    check: "On rebuild-orders/advance action = SCHEDULE, at least one BenchReservation of the order has status == CONFIRMED."
    error_id: ERR_NO_CONFIRMED_BENCH
    http_status: 409
    applies_to: "POST /shop/rebuild-orders/{id}/advance (SCHEDULE)"

  - priority: 11
    category: business_referential
    check: "On warranty claim creation, the Installation.status == FAILED_IN_SERVICE."
    error_id: ERR_WARRANTY_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /shop/warranty-claims"

  - priority: 11
    category: business_referential
    check: "On installation creation, the CoreUnit.status == SHIPPED and the rebuild order's work_status == DELIVERED and the order's core_unit_id and customer_asset_id match the body."
    error_id: ERR_UNIT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /shop/installations"

  - priority: 12
    category: business_safety
    check: "On inspections/advance action = SUBMIT, linked_vibration_reading_id is non-null after applying any value supplied on this call."
    error_id: ERR_VIBRATION_LINK_REQUIRED
    http_status: 422
    applies_to: "POST /shop/inspections/{id}/advance (SUBMIT)"

  - priority: 12
    category: business_safety
    check: "On inspections/advance action = SUBMIT, every feature_code in the governing ClearanceStandard.required_feature_codes has at least one Measurement on this inspection."
    error_id: ERR_MEASUREMENTS_INCOMPLETE
    http_status: 422
    applies_to: "POST /shop/inspections/{id}/advance (SUBMIT)"

  - priority: 12
    category: business_safety
    check: "On rebuild-orders/advance action = START, no governing Measurement of the order's ACCEPTED Inspection has band_result == OUT_OF_SPEC."
    error_id: ERR_CLEARANCE_OUT_OF_SPEC
    http_status: 422
    applies_to: "POST /shop/rebuild-orders/{id}/advance (START)"

  - priority: 12
    category: business_safety
    check: "On rebuild order creation, the referenced CoreUnit.rebuild_count is strictly less than the governing ClearanceStandard.max_rebuild_count."
    error_id: ERR_REBUILD_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /shop/rebuild-orders"

  - priority: 12
    category: business_safety
    check: "A PartLine with source_class == AFTERMARKET on an order whose CustomerAsset.criticality == CRITICAL requires a non-empty engineering_waiver_ref."
    error_id: ERR_AFTERMARKET_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /shop/rebuild-orders/{id}/part-lines, POST /shop/part-lines/{id}/advance (REVISE)"

  - priority: 12
    category: business_safety
    check: "A bench reservation for an order whose governing ClearanceStandard.cleanroom_required is true must target a Bench with cleanroom == true."
    error_id: ERR_CLEANROOM_BENCH_REQUIRED
    http_status: 422
    applies_to: "POST /shop/bench-reservations"

  - priority: 13
    category: business_temporal
    check: "Bench capacity per calculations.bench_window_overlap_admission; rejected only when queue_if_full is false."
    error_id: ERR_BENCH_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /shop/bench-reservations"

  - priority: 13
    category: business_temporal
    check: "The 24-hour changeover buffer from the asset's most recent removal or failure, per calculations.installation_changeover_admission step 1. Checked BEFORE the occupancy rule at priority 14."
    error_id: ERR_INSTALL_BUFFER_VIOLATION
    http_status: 409
    applies_to: "POST /shop/installations"

  - priority: 13
    category: business_temporal
    check: "On warranty claim creation, neither warranty clock has fully expired: run_hours < warranty_hours_snapshot AND elapsed_days < warranty_months_snapshot * 30. Both edges are exclusive, so exactly 8000 hours on an 8000-hour warranty is expired."
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /shop/warranty-claims"

  - priority: 14
    category: business_constraint
    check: "Uniqueness of Customer.account_code, ClearanceStandard.model_code, Bench.bench_code, and CustomerAsset.asset_tag within its customer."
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /shop/customers, POST /shop/clearance-standards, POST /shop/benches, POST /shop/customers/{id}/assets"

  - priority: 14
    category: business_constraint
    check: "CoreUnit.serial_no is unique within its customer_id."
    error_id: ERR_DUPLICATE_SERIAL
    http_status: 409
    applies_to: "POST /shop/core-units"

  - priority: 14
    category: business_constraint
    check: "No sibling WarrantyClaim on the same installation has status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, APPROVED}."
    error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    applies_to: "POST /shop/warranty-claims"

  - priority: 14
    category: business_constraint
    check: "The target CustomerAsset carries no Installation with status IN {INSTALLED, RUNNING}, per calculations.installation_changeover_admission step 2."
    error_id: ERR_ASSET_OCCUPIED
    http_status: 409
    applies_to: "POST /shop/installations"

  - priority: 14
    category: business_constraint
    check: "On rebuild-orders/advance action = SCHEDULE, quoted_part_revision equals part_revision_counter; any part-line mutation since the last quote makes the quote stale."
    error_id: ERR_QUOTE_STALE
    http_status: 409
    applies_to: "POST /shop/rebuild-orders/{id}/advance (SCHEDULE)"

  - priority: 14
    category: business_constraint
    check: "Expedite is only available while work_status IN {DRAFT, QUOTED} and only once per order (expedited must still be false)."
    error_id: ERR_EXPEDITE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /shop/rebuild-orders/{id}/expedite"

  - priority: 15
    category: business_fiscal
    check: "A manual credit note may not drive Customer.total_credit_balance_cents above CUSTOMER_CREDIT_CEILING_CENTS (2000000). The projected balance is the post-posting total."
    error_id: ERR_CREDIT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /shop/customers/{id}/credit-notes"

# =============================================================================
# §1.5 API Endpoint Table   (every path is prefixed with /shop except the
#      test-driving logical clock under /_clock)
# =============================================================================
endpoints:

  # ---------------------------- Customer ------------------------------------
  - method: POST
    path: "/shop/customers"
    description: "Open a service account."
    roles: [ShopAdmin]
    code: 201
    input: [name, account_code, "contact_email?"]
    output: Customer
    side_effects:
      - "All four balance fields initialise to 0; version starts at 1."

  - method: GET
    path: "/shop/customers/{id}"
    description: "Read one account including its four ledger balances."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: POST
    path: "/shop/customers/{id}/assets"
    description: "Register a driven machine under the account."
    roles: [ShopAdmin]
    code: 201
    input: [asset_tag, criticality, duty_class, "site_code?"]
    output: CustomerAsset
    side_effects:
      - "customer_id is taken from the path, never from the body."

  - method: GET
    path: "/shop/customers/{id}/assets"
    description: "List the account's assets (FK reverse-reachability for CustomerAsset.customer_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: CustomerAsset[]
    side_effects: []

  - method: GET
    path: "/shop/assets/{id}"
    description: "Read one asset."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: CustomerAsset
    side_effects: []

  - method: POST
    path: "/shop/customers/{id}/credit-notes"
    description: "Post a manual ledger adjustment against the account. OCC-guarded."
    roles: [ShopAdmin]
    code: 201
    input: [amount_cents, memo, expected_customer_version]
    output: CreditNote
    side_effects:
      - "Creates a CreditNote with kind = MANUAL_ADJUSTMENT and status = POSTED."
      - "Recomputes the customer's four balances via calculations.customer_credit_balances."
      - "Increments Customer.version by 1."

  # ------------------------- ClearanceStandard ------------------------------
  - method: POST
    path: "/shop/clearance-standards"
    description: "Publish a reman spec: clearance bands, warranty terms, base core value and rebuild ceiling."
    roles: [ShopAdmin]
    code: 201
    input: [model_code, base_core_value_cents, max_rebuild_count, warranty_hours, warranty_months, "cleanroom_required?", required_feature_codes, feature_bands]
    output: ClearanceStandard
    side_effects: []

  - method: GET
    path: "/shop/clearance-standards/{id}"
    description: "Read one reman spec including its feature bands."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: ClearanceStandard
    side_effects: []

  # -------------------------------- Bench -----------------------------------
  - method: POST
    path: "/shop/benches"
    description: "Register a rebuild bench with its parallel-slot capacity."
    roles: [ShopAdmin]
    code: 201
    input: [bench_code, parallel_slots, "cleanroom?"]
    output: Bench
    side_effects:
      - "committed_minutes initialises to 0."

  - method: GET
    path: "/shop/benches/{id}"
    description: "Read one bench including its live committed_minutes."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: Bench
    side_effects: []

  - method: GET
    path: "/shop/benches/{id}/reservations"
    description: "List the bench's reservations (FK reverse-reachability for BenchReservation.bench_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BenchReservation[]
    side_effects: []

  # ------------------------------ CoreUnit ----------------------------------
  - method: POST
    path: "/shop/core-units"
    description: "Receive an exchange core across the counter and value it provisionally."
    roles: [ShopAdmin]
    code: 201
    input: [customer_id, clearance_standard_id, serial_no, "rebuild_count?", declared_condition_grade]
    output: CoreUnit
    side_effects:
      - "model_code is copied from the referenced ClearanceStandard."
      - "provisional_core_credit_cents is computed by calculations.core_credit_valuation variant provisional_core_credit."
      - "A CreditNote is created with kind = CORE_EXCHANGE, status = POSTED, amount_cents = provisional_core_credit_cents, core_unit_id = this core."
      - "The customer's balances are recomputed; Customer.version += 1."
      - "status initialises to RECEIVED."

  - method: GET
    path: "/shop/core-units/{id}"
    description: "Read one core including both credit valuations."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: CoreUnit
    side_effects: []

  - method: GET
    path: "/shop/core-units"
    description: "Filtered core list (FK reverse-reachability for CoreUnit.customer_id, CoreUnit.clearance_standard_id and the self-referential CoreUnit.replacement_core_unit_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["customer_id?", "clearance_standard_id?", "replacement_core_unit_id?", "status?", "limit?", "offset?"]
    output: CoreUnit[]
    side_effects: []

  - method: POST
    path: "/shop/core-units/{id}/advance"
    description: "Drive the core's own lifecycle: REINSPECT (GRADED -> INSPECTING), SCRAP, RETURN_AS_IS."
    roles: [ShopAdmin, Inspector]
    code: 200
    input: [action, "override_reason?", "replacement_core_unit_id?"]
    output: CoreUnit
    side_effects:
      - "REINSPECT returns the ACCEPTED inspection, clears condition_grade and final_core_credit_cents, voids the CORE_EXCHANGE note and recomputes balances and QUOTED order quotes."
      - "SCRAP voids the CORE_EXCHANGE note, cancels every non-terminal RebuildOrder on the core and releases their bench reservations."
      - "RETURN_AS_IS voids the CORE_EXCHANGE note and recomputes balances."

  # ---------------------------- RebuildOrder --------------------------------
  - method: POST
    path: "/shop/rebuild-orders"
    description: "Open a rebuild work order against a received core and a destination asset."
    roles: [Planner, ShopAdmin]
    code: 201
    input: [customer_id, core_unit_id, customer_asset_id, labor_hours]
    output: RebuildOrder
    side_effects:
      - "work_status initialises to DRAFT, approval_status to PENDING, part_revision_counter to 0; every quote field is null."
      - "Rejected with ERR_REBUILD_LIMIT_REACHED when the core's rebuild_count has reached the standard's max_rebuild_count."

  - method: GET
    path: "/shop/rebuild-orders/{id}"
    description: "Read one order with both state dimensions and every quote field."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: RebuildOrder
    side_effects: []

  - method: GET
    path: "/shop/rebuild-orders"
    description: "Filtered order list (FK reverse-reachability for RebuildOrder.customer_id, core_unit_id and customer_asset_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["customer_id?", "core_unit_id?", "customer_asset_id?", "work_status?", "approval_status?", "limit?", "offset?"]
    output: RebuildOrder[]
    side_effects: []

  - method: GET
    path: "/shop/rebuild-orders/{id}/quote"
    description: "Computed read of the order's pricing chain plus a live staleness flag."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: "{ work_status: string, approval_status: string, parts_subtotal_cents: integer, labor_cents: integer, pre_credit_subtotal_cents: integer, expedite_surcharge_cents: integer, gross_total_cents: integer, credit_cap_cents: integer, core_credit_applied_cents: integer, quote_total_cents: integer, covered_base_cents: integer, quoted_part_revision: integer, part_revision_counter: integer, quote_stale: boolean }"
    side_effects: []

  - method: POST
    path: "/shop/rebuild-orders/{id}/advance"
    description: "Drive the order's work_status dimension. action is one of QUOTE, SCHEDULE, START, COMPLETE, DELIVER."
    roles: [Planner, ShopAdmin]
    code: 200
    input: [action]
    output: RebuildOrder
    side_effects:
      - "QUOTE runs calculations.order_quote_total steps 1-8 and snapshots quoted_part_revision."
      - "START transitions the CoreUnit GRADED -> REBUILDING."
      - "COMPLETE transitions the CoreUnit REBUILDING -> REBUILT, increments rebuild_count and fires CASCADE C on the bench."
      - "DELIVER transitions the CoreUnit REBUILT -> SHIPPED."

  - method: POST
    path: "/shop/rebuild-orders/{id}/cancel"
    description: "Cancel a non-terminal order and unwind its bench and core side effects (CASCADE B)."
    roles: [Planner, ShopAdmin]
    code: 200
    input: [cancel_reason]
    output: RebuildOrder
    side_effects:
      - "CASCADE B hops 1-4: reservations RELEASED, Bench.committed_minutes recomputed, queue promotion, recompute again."
      - "From IN_PROGRESS the CoreUnit is compensated REBUILDING -> GRADED."

  - method: POST
    path: "/shop/rebuild-orders/{id}/expedite"
    description: "Flag the order as an emergency rebuild; applies the tiered surcharge when the order is already QUOTED."
    roles: [Planner, ShopAdmin]
    code: 200
    input: [expedite_reason, "emergency_ref?"]
    output: RebuildOrder
    side_effects:
      - "expedited := true."
      - "When work_status == QUOTED the full quote chain re-runs so expedite_surcharge_cents, gross_total_cents, core_credit_applied_cents and quote_total_cents move together; quoted_part_revision is re-snapshotted."

  # ------------------------------ PartLine ----------------------------------
  - method: POST
    path: "/shop/rebuild-orders/{id}/part-lines"
    description: "Add a reman part line to the order. OCC-guarded on the order's version."
    roles: [Planner, ShopAdmin]
    code: 201
    input: [part_no, source_class, qty, unit_cost_cents, "engineering_waiver_ref?", expected_order_version]
    output: PartLine
    side_effects:
      - "line_total_cents = qty * unit_cost_cents."
      - "RebuildOrder.part_revision_counter += 1 and approval_status is re-derived by calculations.order_approval_rollup."
      - "Increments RebuildOrder.version by 1."

  - method: GET
    path: "/shop/rebuild-orders/{id}/part-lines"
    description: "List the order's part lines (FK reverse-reachability for PartLine.rebuild_order_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["approval_status?", "limit?", "offset?"]
    output: PartLine[]
    side_effects: []

  - method: POST
    path: "/shop/part-lines/{id}/advance"
    description: "Planner-side part-line actions: SUBMIT (PROPOSED -> SUBMITTED) and REVISE (REJECTED -> PROPOSED, optionally rewriting the line)."
    roles: [Planner, ShopAdmin]
    code: 200
    input: [action, "part_no?", "source_class?", "qty?", "unit_cost_cents?", "engineering_waiver_ref?"]
    output: PartLine
    side_effects:
      - "RebuildOrder.part_revision_counter += 1 and approval_status re-derived on both actions."
      - "REVISE increments revision_count and recomputes line_total_cents."

  - method: POST
    path: "/shop/part-lines/{id}/decide"
    description: "Customer OEM-vs-aftermarket decision on a submitted line."
    roles: [Customer]
    code: 200
    input: [decision, "decision_note?"]
    output: PartLine
    side_effects:
      - "approval_status := APPROVED or REJECTED; decision_note recorded."
      - "RebuildOrder.part_revision_counter += 1 and approval_status re-derived, which may move the order's approval dimension without touching work_status."

  # ------------------------- VibrationReading -------------------------------
  - method: POST
    path: "/shop/vibration-readings"
    description: "File a route vibration reading against an asset and classify its ISO zone."
    roles: [ReliabilityEngineer, ShopAdmin]
    code: 201
    input: [customer_asset_id, reading_at, overall_velocity_mm_s, bpfo_amplitude_g, bpfi_amplitude_g, baseline_amplitude_g]
    output: VibrationReading
    side_effects:
      - "iso_zone, defect_ratio_outer and defect_ratio_inner are computed by calculations.vibration_zone_classification."

  - method: GET
    path: "/shop/assets/{id}/vibration-readings"
    description: "List an asset's readings (FK reverse-reachability for VibrationReading.customer_asset_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["iso_zone?", "limit?", "offset?"]
    output: VibrationReading[]
    side_effects: []

  # ----------------------------- Inspection ---------------------------------
  - method: POST
    path: "/shop/inspections"
    description: "Open a bench inspection on an order; moves the core RECEIVED -> INSPECTING."
    roles: [Inspector, ShopAdmin]
    code: 201
    input: [rebuild_order_id, "linked_vibration_reading_id?", "inspector_note?", "cause_code_override?"]
    output: Inspection
    side_effects:
      - "status initialises to DRAFT; the order's CoreUnit transitions RECEIVED -> INSPECTING."

  - method: GET
    path: "/shop/inspections/{id}"
    description: "Read one inspection including its grading and cause-coding outputs."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: Inspection
    side_effects: []

  - method: GET
    path: "/shop/inspections"
    description: "Filtered inspection list (FK reverse-reachability for Inspection.rebuild_order_id and Inspection.linked_vibration_reading_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["rebuild_order_id?", "linked_vibration_reading_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []

  - method: POST
    path: "/shop/inspections/{id}/measurements"
    description: "Record one metrology reading and band it against the reman spec."
    roles: [Inspector, ShopAdmin]
    code: 201
    input: [feature_code, measured_um]
    output: Measurement
    side_effects:
      - "sequence_no is assigned as the next integer for this inspection starting at 1."
      - "band_result, deviation_ratio and feature_score are computed by calculations.clearance_band_evaluation."

  - method: GET
    path: "/shop/inspections/{id}/measurements"
    description: "List an inspection's measurements (FK reverse-reachability for Measurement.inspection_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["feature_code?", "limit?", "offset?"]
    output: Measurement[]
    side_effects: []

  - method: POST
    path: "/shop/inspections/{id}/advance"
    description: "Drive the inspection cycle. action is one of SUBMIT, ACCEPT, RETURN, REOPEN."
    roles: [Inspector, ReliabilityEngineer, ShopAdmin]
    code: 200
    input: [action, "linked_vibration_reading_id?", "return_reason?"]
    output: Inspection
    side_effects:
      - "SUBMIT runs calculations.remaining_life_score and calculations.failure_cause_coding and stamps submitted_by_user_id."
      - "ACCEPT fires CASCADE A hops 1-5 (core graded, credit note replaced, balances recomputed, QUOTED orders re-priced)."
      - "REOPEN clears every computed grading field and increments revision_count."

  # -------------------------- BenchReservation ------------------------------
  - method: POST
    path: "/shop/bench-reservations"
    description: "Hold a bench window for an order under half-open, multi-slot capacity semantics."
    roles: [Planner, ShopAdmin]
    code: 201
    input: [rebuild_order_id, bench_id, window_start_at, window_end_at, "queue_if_full?"]
    output: BenchReservation
    side_effects:
      - "window_minutes is computed."
      - "Admission runs calculations.bench_window_overlap_admission: HELD when capacity allows, QUEUED when full and queue_if_full is true, otherwise ERR_BENCH_WINDOW_CONFLICT."
      - "Bench.committed_minutes is recomputed when the row lands in HELD."

  - method: GET
    path: "/shop/rebuild-orders/{id}/bench-reservations"
    description: "List an order's reservations (FK reverse-reachability for BenchReservation.rebuild_order_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BenchReservation[]
    side_effects: []

  - method: POST
    path: "/shop/bench-reservations/{id}/advance"
    description: "CONFIRM a held window or RELEASE it back to the bench."
    roles: [Planner, ShopAdmin]
    code: 200
    input: [action]
    output: BenchReservation
    side_effects:
      - "RELEASE recomputes Bench.committed_minutes and runs calculations.bench_queue_promotion."

  # ---------------------------- Installation --------------------------------
  - method: POST
    path: "/shop/installations"
    description: "Put a shipped rebuilt unit into service on an asset. OCC-guarded on the asset's version."
    roles: [ShopAdmin]
    code: 201
    input: [core_unit_id, customer_asset_id, rebuild_order_id, expected_asset_version]
    output: Installation
    side_effects:
      - "in_service_start_at := the logical clock; status := INSTALLED; run_hours := 0."
      - "warranty_hours_snapshot, warranty_months_snapshot and covered_base_cents_snapshot are copied from the core's standard and the order."
      - "Admission runs calculations.installation_changeover_admission (buffer first, then occupancy)."
      - "Increments CustomerAsset.version by 1."

  - method: GET
    path: "/shop/installations/{id}"
    description: "Read one in-service record."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: Installation
    side_effects: []

  - method: GET
    path: "/shop/installations"
    description: "Filtered installation list (FK reverse-reachability for Installation.core_unit_id, customer_asset_id and rebuild_order_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["core_unit_id?", "customer_asset_id?", "rebuild_order_id?", "status?", "limit?", "offset?"]
    output: Installation[]
    side_effects: []

  - method: POST
    path: "/shop/installations/{id}/advance"
    description: "In-service tracking by asset: RECORD_HOURS, FAIL, REMOVE."
    roles: [ShopAdmin, Customer]
    code: 200
    input: [action, "run_hours_delta?"]
    output: Installation
    side_effects:
      - "RECORD_HOURS adds run_hours_delta and moves INSTALLED -> RUNNING on the first log."
      - "FAIL stamps failed_at from the logical clock; REMOVE stamps removed_at."

  # --------------------------- WarrantyClaim --------------------------------
  - method: POST
    path: "/shop/warranty-claims"
    description: "File a warranty claim on a failed in-service unit; the pro-rata credit is computed and frozen here."
    roles: [Customer, ShopAdmin]
    code: 201
    input: [installation_id, claimed_reason]
    output: WarrantyClaim
    side_effects:
      - "submitted_at := the logical clock; status := SUBMITTED."
      - "calculations.warranty_pro_rata_credit writes elapsed_days, both consumed fractions, governing_basis, remaining_fraction and pro_rata_credit_cents."

  - method: GET
    path: "/shop/installations/{id}/warranty-claims"
    description: "List an installation's claims (FK reverse-reachability for WarrantyClaim.installation_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: GET
    path: "/shop/warranty-claims/{id}"
    description: "Read one claim with its full pro-rata working."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/shop/warranty-claims/{id}/advance"
    description: "Claim workflow actions: REVIEW, REQUEST_INFO, RESUBMIT, ISSUE_CREDIT."
    roles: [ShopAdmin, Customer]
    code: 200
    input: [action, "info_note?"]
    output: WarrantyClaim
    side_effects:
      - "ISSUE_CREDIT fires CASCADE D: status CREDITED, a WARRANTY_PRORATA CreditNote is posted, the customer's balances are recomputed and Customer.version += 1."

  - method: POST
    path: "/shop/warranty-claims/{id}/adjudicate"
    description: "Approve or deny a claim under review. Segregation of duties applies against the inspection acceptor."
    roles: [ShopAdmin]
    code: 200
    input: [decision, "adjudication_note?"]
    output: WarrantyClaim
    side_effects:
      - "APPROVE moves UNDER_REVIEW -> APPROVED and re-affirms pro_rata_credit_cents; DENY moves UNDER_REVIEW -> DENIED and leaves the ledger untouched."

  # ----------------------------- CreditNote ---------------------------------
  - method: GET
    path: "/shop/credit-notes/{id}"
    description: "Read one ledger note."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: []
    output: CreditNote
    side_effects: []

  - method: GET
    path: "/shop/credit-notes"
    description: "Filtered ledger list (FK reverse-reachability for CreditNote.customer_id, core_unit_id and warranty_claim_id)."
    roles: [ShopAdmin, Planner, Inspector, ReliabilityEngineer, Customer]
    code: 200
    input: ["customer_id?", "core_unit_id?", "warranty_claim_id?", "kind?", "status?", "limit?", "offset?"]
    output: CreditNote[]
    side_effects: []

  - method: POST
    path: "/shop/credit-notes/{id}/void"
    description: "Void a posted ledger note; the compensating half of the credit-conservation invariant."
    roles: [ShopAdmin]
    code: 200
    input: [void_reason]
    output: CreditNote
    side_effects:
      - "status := VOID; voided_at := the logical clock."
      - "The customer's four balances are recomputed from the surviving POSTED notes; Customer.version += 1."
      - "Every RebuildOrder of that customer with work_status == QUOTED recomputes core_credit_applied_cents and quote_total_cents."

  # ------------------------- test-driving clock -----------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock to any instant, forward OR backward. The startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every in_service_start_at, removed_at, failed_at, submitted_at, voided_at and promoted_at is stamped from this clock."
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "No entity is mutated; only the logical clock moves."

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing/empty, or X-User-Role is not one of the five declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not in the endpoint's declared roles list."
  - id: ERR_ACTION_NOT_PERMITTED_FOR_ROLE
    http: 403
    condition: "The role may call the endpoint but not with this particular action value (validations priority 3 map)."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Customer-role caller's X-User-ID does not match the customer that owns the target resource."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acceptor equals the submitter of the inspection, or the adjudicator equals the acceptor of the claim's inspection."

  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id in the path or body does not resolve."
  - id: ERR_ASSET_NOT_FOUND
    http: 404
    condition: "customer_asset_id in the path or body does not resolve."
  - id: ERR_STANDARD_NOT_FOUND
    http: 404
    condition: "clearance_standard_id in the path or body does not resolve."
  - id: ERR_BENCH_NOT_FOUND
    http: 404
    condition: "bench_id in the path or body does not resolve."
  - id: ERR_CORE_UNIT_NOT_FOUND
    http: 404
    condition: "core_unit_id or replacement_core_unit_id does not resolve."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "rebuild_order_id in the path or body does not resolve."
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "inspection id in the path does not resolve."
  - id: ERR_READING_NOT_FOUND
    http: 404
    condition: "linked_vibration_reading_id does not resolve."
  - id: ERR_PART_LINE_NOT_FOUND
    http: 404
    condition: "part line id in the path does not resolve."
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "bench reservation id in the path does not resolve."
  - id: ERR_INSTALLATION_NOT_FOUND
    http: 404
    condition: "installation_id in the path or body does not resolve."
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "warranty claim id in the path does not resolve."
  - id: ERR_CREDIT_NOTE_NOT_FOUND
    http: 404
    condition: "credit note id in the path does not resolve."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required body field, enum outside its declared set, numeric range violated, window_end_at not strictly after window_start_at, feature_code absent from the governing standard's feature_bands, or a pagination parameter outside 1..100 / offset < 0."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_order_version, expected_customer_version or expected_asset_version does not equal the parent row's current version."

  - id: ERR_ORDER_INVALID_STATE
    http: 409
    condition: "The rebuild order's work_status does not admit the requested action."
  - id: ERR_CORE_UNIT_INVALID_STATE
    http: 409
    condition: "The core unit's status does not admit the requested action."
  - id: ERR_INSPECTION_INVALID_STATE
    http: 409
    condition: "The inspection's status does not admit the requested action, or a measurement is added to a non-DRAFT inspection."
  - id: ERR_PART_LINE_INVALID_STATE
    http: 409
    condition: "The part line's approval_status does not admit the requested action or decision."
  - id: ERR_RESERVATION_INVALID_STATE
    http: 409
    condition: "The reservation's status does not admit CONFIRM or RELEASE."
  - id: ERR_INSTALLATION_INVALID_STATE
    http: 409
    condition: "The installation is terminal, or the action is not admitted from its current status."
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "The warranty claim's status does not admit the requested action or adjudication."
  - id: ERR_CREDIT_NOTE_INVALID_STATE
    http: 409
    condition: "Voiding a credit note whose status is already VOID."

  - id: ERR_INSPECTION_ALREADY_ACCEPTED
    http: 409
    condition: "A sibling inspection under the same rebuild order already has status ACCEPTED."
  - id: ERR_VIBRATION_ASSET_MISMATCH
    http: 409
    condition: "The linked vibration reading was taken on a different CustomerAsset than the order's."
  - id: ERR_CORE_NOT_GRADED
    http: 409
    condition: "START attempted while the order's core unit is not in status GRADED."
  - id: ERR_CORE_SCRAPPED
    http: 409
    condition: "The order's core unit is SCRAPPED or graded SCRAP."
  - id: ERR_PART_APPROVAL_PENDING
    http: 409
    condition: "SCHEDULE attempted while the order's approval_status is not APPROVED."
  - id: ERR_NO_CONFIRMED_BENCH
    http: 409
    condition: "SCHEDULE attempted with no CONFIRMED bench reservation on the order."
  - id: ERR_WARRANTY_NOT_ELIGIBLE
    http: 409
    condition: "A warranty claim is filed against an installation that is not FAILED_IN_SERVICE."
  - id: ERR_UNIT_NOT_DELIVERED
    http: 409
    condition: "Installation attempted before the core unit is SHIPPED and its rebuild order DELIVERED, or the body's core/asset do not match the order's."

  - id: ERR_VIBRATION_LINK_REQUIRED
    http: 422
    condition: "SUBMIT attempted with no linked vibration reading on the inspection."
  - id: ERR_MEASUREMENTS_INCOMPLETE
    http: 422
    condition: "SUBMIT attempted with at least one required feature_code carrying no measurement (including the zero-measurement case)."
  - id: ERR_CLEARANCE_OUT_OF_SPEC
    http: 422
    condition: "START attempted while a governing measurement of the accepted inspection is OUT_OF_SPEC."
  - id: ERR_REBUILD_LIMIT_REACHED
    http: 422
    condition: "Order creation on a core whose rebuild_count has reached the standard's max_rebuild_count."
  - id: ERR_AFTERMARKET_NOT_PERMITTED
    http: 422
    condition: "An AFTERMARKET part line on a CRITICAL asset without an engineering_waiver_ref."
  - id: ERR_CLEANROOM_BENCH_REQUIRED
    http: 422
    condition: "A reservation on a non-cleanroom bench for a model whose standard sets cleanroom_required."

  - id: ERR_BENCH_WINDOW_CONFLICT
    http: 409
    condition: "The requested window would push the bench past parallel_slots and queue_if_full is false."
  - id: ERR_INSTALL_BUFFER_VIOLATION
    http: 409
    condition: "Installation attempted less than 24 hours after the asset's most recent removal or failure."
  - id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "Claim filed after run_hours reached warranty_hours_snapshot or elapsed_days reached warranty_months_snapshot * 30."

  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Duplicate Customer.account_code, ClearanceStandard.model_code, Bench.bench_code, or CustomerAsset.asset_tag within its customer."
  - id: ERR_DUPLICATE_SERIAL
    http: 409
    condition: "A core with the same serial_no already exists for that customer."
  - id: ERR_DUPLICATE_CLAIM
    http: 409
    condition: "An open warranty claim already exists on that installation."
  - id: ERR_ASSET_OCCUPIED
    http: 409
    condition: "The target asset already carries an INSTALLED or RUNNING installation."
  - id: ERR_QUOTE_STALE
    http: 409
    condition: "SCHEDULE attempted while quoted_part_revision != part_revision_counter."
  - id: ERR_EXPEDITE_NOT_AVAILABLE
    http: 409
    condition: "Expedite attempted outside work_status DRAFT/QUOTED, or on an order already expedited."

  - id: ERR_CREDIT_CAP_EXCEEDED
    http: 422
    condition: "A manual credit note would push total_credit_balance_cents above 2000000."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Service-centre manager. Owns reference data, core receipt, the ledger, installations and warranty adjudication."
    identity: "opaque"
    exclusive_operations:
      - "POST /shop/customers"
      - "POST /shop/customers/{id}/assets"
      - "POST /shop/clearance-standards"
      - "POST /shop/benches"
      - "POST /shop/core-units"
      - "POST /shop/customers/{id}/credit-notes"
      - "POST /shop/credit-notes/{id}/void"
      - "POST /shop/installations"
      - "POST /shop/warranty-claims/{id}/adjudicate"
      - "POST /shop/core-units/{id}/advance with action SCRAP or RETURN_AS_IS"
      - "POST /shop/installations/{id}/advance with action REMOVE"
      - "POST /shop/warranty-claims/{id}/advance with action REVIEW, REQUEST_INFO or ISSUE_CREDIT"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /shop/rebuild-orders and every rebuild-order action (with Planner)"
      - "POST /shop/inspections and inspection actions (with Inspector and ReliabilityEngineer)"
      - "POST /shop/vibration-readings (with ReliabilityEngineer)"
      - "POST /shop/bench-reservations and reservation actions (with Planner)"
      - "POST /shop/warranty-claims (with Customer)"
      - "POST /shop/installations/{id}/advance with action RECORD_HOURS or FAIL (with Customer)"

  - name: Planner
    description: "Shop planner. Owns work orders, part-line proposals, bench scheduling and the emergency lane."
    identity: "opaque"
    exclusive_operations:
      - "POST /shop/rebuild-orders/{id}/cancel"
      - "POST /shop/rebuild-orders/{id}/expedite"
      - "POST /shop/rebuild-orders/{id}/part-lines"
      - "POST /shop/part-lines/{id}/advance"
    shared_operations:
      - "All GET endpoints"
      - "POST /shop/rebuild-orders and POST /shop/rebuild-orders/{id}/advance (with ShopAdmin)"
      - "POST /shop/bench-reservations and POST /shop/bench-reservations/{id}/advance (with ShopAdmin)"

  - name: Inspector
    description: "Bench inspector. Owns metrology capture, inspection submission and the four-eyes acceptance of a peer's inspection."
    identity: "opaque"
    exclusive_operations:
      - "POST /shop/inspections/{id}/advance with action SUBMIT or REOPEN"
    shared_operations:
      - "All GET endpoints"
      - "POST /shop/inspections and POST /shop/inspections/{id}/measurements (with ShopAdmin)"
      - "POST /shop/inspections/{id}/advance with action ACCEPT (with ShopAdmin), subject to segregation of duties"
      - "POST /shop/core-units/{id}/advance with action REINSPECT (with ShopAdmin)"

  - name: ReliabilityEngineer
    description: "Condition-monitoring engineer. Files route vibration data and holds the authority to return a submitted inspection to the bench."
    identity: "opaque"
    exclusive_operations:
      - "POST /shop/inspections/{id}/advance with action RETURN"
    shared_operations:
      - "All GET endpoints"
      - "POST /shop/vibration-readings (with ShopAdmin)"

  - name: Customer
    description: "Plant reliability contact acting as the account. Decides OEM-vs-aftermarket substitutions, logs run hours and files warranty claims on its own resources only."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /shop/part-lines/{id}/decide"
    shared_operations:
      - "All GET endpoints, restricted to resources whose owning customer_id equals X-User-ID"
      - "POST /shop/warranty-claims (with ShopAdmin)"
      - "POST /shop/warranty-claims/{id}/advance with action RESUBMIT (with ShopAdmin)"
      - "POST /shop/installations/{id}/advance with action RECORD_HOURS or FAIL (with ShopAdmin)"
