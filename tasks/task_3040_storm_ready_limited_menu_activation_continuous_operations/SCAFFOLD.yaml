      - "POST /allocations, /ops/allocations/{id}/dispatch|return|cancel"
    shared_operations:
      - "GET /ops/storm-events*, /ops/units/{id}, /ops/units/{id}/condition-reports, /ops/assets*, /ops/allocations*"

