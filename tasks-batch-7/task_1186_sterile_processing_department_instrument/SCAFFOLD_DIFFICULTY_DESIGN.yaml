  - rule_id: resource_temporal_overlap
    instances:
      - name: sterilizer_window_half_open_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_STERILIZER_WINDOW_CONFLICT]
          - entities.SterilizationLoad.fields.planned_start_at
        distinguishing_aspect: |
          Half-open interval semantics on the Sterilizer resource: windows are
          [planned_start_at, planned_start_at + cycle_minutes), so a load planned
          exactly at another load's window end (11:00 == 10:00+60min) is allowed,
          while one intruding 30 minutes into the window is rejected with
          ERR_STERILIZER_WINDOW_CONFLICT — adjacency allowed, no buffer.
        test_recipe:
          setup:
            - "Technician A; sterilizer SG (STEAM_GRAVITY, cycle 60min, cap 4); no loads exist"
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "SG", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { sg: "$.data.id" } }
          trigger:
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T10:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { wa: "$.data.id", wa_st: "$.data.status" } }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T11:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { wb: "$.data.id", wb_st: "$.data.status" } }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T10:30:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { err: "$.data.error_id" } }
            - { call: "GET /spd/sterilization-loads?sterilizer_id=${sg}", as: Any }
          assert:
            - "Load A [10:00, 11:00) created: wa_st == LOADING"
            - "Load B planned 11:00 (== A's window end, half-open adjacency) created: wb_st == LOADING"
            - "Load C planned 10:30 (intrudes into [10:00, 11:00)) rejected: err == ERR_STERILIZER_WINDOW_CONFLICT"
            - "Exactly 2 loads exist on SG afterwards (list response total_count == 2)"

      - name: tray_reservation_buffered_gap_45
        grounds:
          - validations[priority=8]
          - errors[ERR_TRAY_RESERVATION_TIME_CONFLICT]
          - entities.TrayReservation.fields.status
        distinguishing_aspect: |
          Buffered interval semantics on the Tray resource — different resource
          and different interval geometry than the sterilizer half-open rule: each
          case window is expanded by TURNOVER_BUFFER_MINUTES=45 on BOTH sides and
          strict inequalities apply, so a gap of exactly 45 minutes is allowed
          while 44 minutes conflicts with ERR_TRAY_RESERVATION_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Template, technicians A and S, sterilizer; tray tr STERILE (expiry 2026-05-31T03:00:00Z)"
            - "Cases CA (2026-05-10T09:00-12:00), CB (2026-05-10T12:45-14:00), CC (2026-05-10T12:44-14:00) created, versions captured"
