              as: FleetOpsAgent
              captures: { v_id: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${v_id}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id, a_v0: $.data.version }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
            - call: "POST /program/weeks"
              payload: { agreement_id: "${a_id}", expected_agreement_version: "${a_v0}" }
              as: FleetOpsAgent
              captures: { w1: $.data.id }
            - call: "POST /program/weeks/${w1}/settle"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
              captures: { at_deadline: $.data.current_utc }
          assert:
            - "after the clock reaches 2026-09-08T00:00:00Z exactly, RentalWeek.${w1}.week_status == GRACE"
            - "after the clock reaches 2026-09-11T00:00:00Z exactly, the week is still GRACE because delinquency requires the explicit grace-lapse call"
            - "RentalAgreement.${a_id}.compliance_posture == OPEN while no week is DELINQUENT"

      - name: post_swaps_reflect_in_driver_summary_immediately
        claim_type: immediate_consistency
        grounds:
          - consistency_model.immediate
          - endpoints.POST /program/agreements/{id}/swap
          - endpoints.GET /program/drivers/{id}/summary
        distinguishing_aspect: |
          The computed driver summary reflects a swap in the same request cycle, so
          assigned_vehicle_id equals the new unit with no intervening read or settle step.
        test_recipe:
          setup: ["one ACTIVE agreement on unit A with unit B available"]
          setup_api_calls:
            - call: "POST /program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /program/drivers"
              payload: { full_name: "Ada Vance", email: "ada@example.com", platform_driver_id: "PLT-8K2M4QX9", platform_activity_score: 95, driving_record_points: 2, license_class: "FOR_HIRE", program_driver_tier: "TIER_1" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /program/enrollments"
              payload: { driver_id: "${d_id}", program_tier: "TIER_1" }
              as: ComplianceOfficer
              captures: { e_id: $.data.id }
            - call: "POST /program/enrollments/${e_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /program/vehicles"
              payload: { vin: "1HGCM82633A004352", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 40000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { vA: $.data.id }
            - call: "POST /program/vehicles"
              payload: { vin: "2HGES16575H606231", model_name: "Civic", model_year: 2022, vehicle_class: "STANDARD", odometer_miles: 61000, region_code: "CA" }
              as: FleetOpsAgent
              captures: { vB: $.data.id }
            - call: "POST /program/agreements"
              payload: { enrollment_id: "${e_id}", driver_id: "${d_id}", vehicle_id: "${vA}", weekly_rate_cents: 35000, insurance_premium_cents: 4000, unlimited_mileage: true, maintenance_allowance_miles: 200, period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T00:00:00Z" }
              as: FleetOpsAgent
              captures: { a_id: $.data.id }
            - call: "POST /program/agreements/${a_id}/activate"
              payload: {}
              as: FleetOpsAgent
          trigger:
            - call: "POST /program/agreements/${a_id}/swap"
              payload: { new_vehicle_id: "${vB}" }
              as: FleetOpsAgent
            - call: "GET /program/drivers/${d_id}/summary"
              payload: {}
              as: ComplianceOfficer
              captures: { veh: $.data.assigned_vehicle_id }
          assert:
            - "the summary returned in the same cycle carries assigned_vehicle_id ${vB}"
            - "GET /program/vehicles for assigned_driver_id ${d_id} returns exactly one row, unit ${vB}"
            - "ProgramVehicle.${vA}.vehicle_status == AVAILABLE"

  - section: state_machines
    instances:
