  # ===========================================================================
  # From Table 6 (Errors) — §1.6: every code in the catalog must be triggerable
  # ===========================================================================
  - section: errors
    instances:

      - name: vendor_operator_acting_for_another_vendor_is_forbidden
        claim_type: error_triggerability
        grounds:
          - errors.ERR_VENDOR_SCOPE_VIOLATION
          - validations[priority 3]
          - roles.VendorOperator
        distinguishing_aspect: |
          The VendorOperator scope rule keys on both the body's vendor_id and the
          addressed resource's owning vendor, and it sits at priority 3 — ahead of the
          FK-existence sweep — so a cross-vendor request is refused with 403 even when
          the referenced food item does not exist at all.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z"
            - "Two vendors v1 and v2, one MILK item, one OPEN cycle 2026Q3"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
            - call: "POST /price-cycles"
              payload: { cycle_code: "2026Q3", submission_open_at: "2026-08-01T00:00:00Z", submission_due_at: "2026-09-01T00:00:00Z" }
              as: VendorUnitSupervisor
              captures: { cycle_q3: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
            - call: "POST /vendors"
              payload: { store_name: "Bravo Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 7000000 }
              as: VendorUnitAnalyst
              captures: { v2: $.data.id }
          trigger:
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v2}", food_item_id: "${item_milk}", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
            - call: "POST /price-submissions"
              payload: { vendor_id: "${v2}", food_item_id: "00000000-0000-0000-0000-0000000000ff", price_cycle_id: "${cycle_q3}", shelf_price_cents: 320 }
              as: VendorOperator
              as_user_id: "${v1}"
            - call: "GET /vendors/${v2}"
              payload: {}
              as: VendorOperator
              as_user_id: "${v1}"
            - call: "GET /vendors/${v1}"
              payload: {}
              as: VendorOperator
              as_user_id: "${v1}"
          assert:
            - "First trigger call: HTTP 403 with error.id == ERR_VENDOR_SCOPE_VIOLATION — X-User-ID ${v1} does not match the body's vendor_id ${v2}"
            - "Second trigger call: HTTP 403 ERR_VENDOR_SCOPE_VIOLATION as well, not 404 ERR_FOOD_ITEM_NOT_FOUND, because rule 3 precedes the body-FK sweep at rule 6"
            - "Third trigger call (a read of another vendor): HTTP 403 ERR_VENDOR_SCOPE_VIOLATION — the rule applies to the addressed resource, not only to request bodies"
            - "Fourth trigger call: HTTP 200 with id == ${v1} — the operator's own record is readable, so the role itself is not the problem"
            - "GET /price-submissions?vendor_id=${v2} as VendorUnitAnalyst returns meta.total_count == 0"

      - name: missing_or_unknown_role_header_returns_unauthenticated
        claim_type: error_triggerability
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_FORBIDDEN_ROLE
          - validations[priority 1]
          - validations[priority 2]
        distinguishing_aspect: |
          Rule 1 covers three distinct header defects — absent X-User-Role, absent
          X-User-ID, and a syntactically fine but undeclared role name — all of which
          yield 401 ERR_UNAUTHENTICATED; only a declared role that is missing from the
          endpoint's roles list produces 403 ERR_FORBIDDEN_ROLE.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one vendor v1 so the target resource exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /vendors"
              payload: { store_name: "Alpha Market", store_type: "SUPERMARKET", reported_monthly_redemption_cents: 6000000 }
              as: VendorUnitAnalyst
              captures: { v1: $.data.id }
          trigger:
            - call: "GET /vendors/${v1}"
              payload: {}
              as: ABSENT
              as_user_id: "analyst-001"
            - call: "GET /vendors/${v1}"
              payload: {}
              as: VendorUnitAnalyst
              as_user_id: ABSENT
            - call: "GET /vendors/${v1}"
              payload: {}
              as: PublicAuditor
              as_user_id: "auditor-001"
            - call: "GET /vendors/${v1}"
              payload: {}
              as: SystemOperator
              as_user_id: "sys-001"
          assert:
            - "First trigger call (no X-User-Role header at all): HTTP 401 with error.id == ERR_UNAUTHENTICATED"
            - "Second trigger call (X-User-Role present, X-User-ID absent): HTTP 401 ERR_UNAUTHENTICATED — both headers are required by rule 1"
            - "Third trigger call (X-User-Role: PublicAuditor, a role that is not in §1.7): HTTP 401 ERR_UNAUTHENTICATED, not 403 — an unknown role fails authentication before authorization"
            - "Fourth trigger call (SystemOperator, a declared role absent from this endpoint's roles): HTTP 403 with error.id == ERR_FORBIDDEN_ROLE — this is the only one of the four that reaches rule 2"

      - name: duplicate_natural_keys_rejected_and_upc_uniqueness_is_active_scoped
        claim_type: error_triggerability
        grounds:
          - errors.ERR_DUPLICATE_PEER_GROUP_CODE
          - errors.ERR_DUPLICATE_FOOD_CATEGORY_CODE
          - errors.ERR_DUPLICATE_UPC
          - validations[priority 8]
          - validations[priority 9]
          - validations[priority 10]
        distinguishing_aspect: |
          PeerGroup.code and FoodCategory.code are unique across all rows regardless of
          store_type or is_formula, but AuthorizedFoodItem.upc is unique only among
          ACTIVE items — so the same UPC can be re-registered after a delist, and both
          rows then coexist under that UPC.
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z"
            - "PG-SUPER-A peer group, MILK category, ITEM_MILK upc 00011122233"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "SUPERMARKET", min_monthly_redemption_cents: 5000000, max_monthly_redemption_cents: 20000000, mar_method: "PEER_MEDIAN", competitive_allowance_pct: 0.05, min_submissions_for_ceiling: 3, min_stock_multiplier: 1.5 }
              as: VendorUnitSupervisor
              captures: { pg_a: $.data.id }
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk gallon", is_formula: false, formula_restriction_level: "NONE", min_stock_units: 4, min_variety_count: 2, max_units_per_transaction: 6, stock_required: true }
              as: VendorUnitSupervisor
              captures: { cat_milk: $.data.id }
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Statewide Dairy", container_size_oz: 128, contract_brand: false, required_for_authorization: true }
              as: VendorUnitSupervisor
              captures: { item_milk: $.data.id }
          trigger:
            - call: "POST /peer-groups"
              payload: { code: "PG-SUPER-A", store_type: "PHARMACY", min_monthly_redemption_cents: 0, max_monthly_redemption_cents: 100000, mar_method: "PEER_PERCENTILE_75", competitive_allowance_pct: 0.10, min_stock_multiplier: 0.5 }
              as: VendorUnitSupervisor
            - call: "POST /food-categories"
              payload: { code: "MILK", name: "Milk quart", is_formula: true, formula_restriction_level: "MEDICAL_DOC_REQUIRED", min_stock_units: 1, min_variety_count: 1, max_units_per_transaction: 2, stock_required: false }
              as: VendorUnitSupervisor
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Rival Dairy", container_size_oz: 64, contract_brand: true, required_for_authorization: false }
              as: VendorUnitSupervisor
            - call: "POST /authorized-food-items/${item_milk}/delist"
              payload: { delist_reason: "MANUFACTURER_DISCONTINUED" }
              as: VendorUnitSupervisor
            - call: "POST /authorized-food-items"
              payload: { food_category_id: "${cat_milk}", upc: "00011122233", brand: "Rival Dairy", container_size_oz: 64, contract_brand: true, required_for_authorization: false }
              as: VendorUnitSupervisor
              captures: { item_milk_reissued: $.data.id }
          assert:
            - "First trigger call: HTTP 409 with error.id == ERR_DUPLICATE_PEER_GROUP_CODE — the code collides even though store_type and the whole band differ"
            - "Second trigger call: HTTP 409 with error.id == ERR_DUPLICATE_FOOD_CATEGORY_CODE — the code collides even though is_formula differs"
            - "Third trigger call: HTTP 409 with error.id == ERR_DUPLICATE_UPC while ${item_milk} is ACTIVE"
            - "Fourth trigger call: HTTP 200 with status == DELISTED and delisted_at == 2026-08-01T00:00:00.000Z"
            - "Fifth trigger call, byte-identical to the third: HTTP 201 — uniqueness is scoped to ACTIVE rows, so a delisted UPC is reusable"
            - "GET /authorized-food-items?upc=00011122233 returns meta.total_count == 2; filtering &status=ACTIVE returns exactly 1 whose id == ${item_milk_reissued}"

      - name: close_cmp_case_with_payment_one_cent_short_rejected
        claim_type: error_triggerability
        grounds:
          - errors.ERR_CMP_UNDERPAID
