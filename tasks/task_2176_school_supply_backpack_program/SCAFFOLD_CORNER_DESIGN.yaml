            - "DriveCycle.${cycle_id}.cash_allocated_cents == 0"
            - "DriveCycle.${cycle_id}.unrestricted_gross_cents == 50000"
            - "DriveCycle.${cycle_id}.supplemental_cap_cents == 7500"
            - "GET /cash-donations with drive_cycle_id=${cycle_id} returns exactly 2 gifts"

  - section: endpoints
    instances:

      - name: impact_summary_computed_read_matches_stored_school_fields
