  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: calc_water_usage_shower_cap_and_laundry
        claim_type: correct_result
        grounds:
          - "calculations.water_usage"
          - "entities.TravelCenterSite.fields.water_usage_gallons"
        distinguishing_aspect: "Shower water is capped at 45 minutes: a 120-minute session bills 112.5 gal (45 x 2.5), not 300; laundry 12 lbs uses 24.0 gal; site accumulator reads 136.5 after both."
        test_recipe:
          setup: ["Site (1 shower, 1 laundry), register, OPEN shift; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site C1", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "SHOWER", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { t1: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "LAUNDRY", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { t2: "$.data.id" } }
            - { call: "POST /sites/${site_id}/service-queue/call", payload: { service_type: "SHOWER" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /service-tickets/${t1}/start", payload: {}, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /sites/${site_id}/service-queue/call", payload: { service_type: "LAUNDRY" }, as: Cashier, as_user_id: "cash-1" }
            - { call: "POST /service-tickets/${t2}/start", payload: {}, as: Cashier, as_user_id: "cash-1" }
          trigger:
            - { call: "POST /service-tickets/${t1}/complete", payload: { shower_minutes: 120 }, as: Cashier, as_user_id: "cash-1", captures: { w1: "$.data.water_gallons" } }
            - { call: "POST /service-tickets/${t2}/complete", payload: { laundry_lbs: 12 }, as: Cashier, as_user_id: "cash-1", captures: { w2: "$.data.water_gallons" } }
            - { call: "GET /sites/${site_id}", payload: {}, as: GeneralManager, captures: { site_water: "$.data.water_usage_gallons" } }
          assert:
            - "shower ticket water_gallons == 112.5 (min(120, 45) x 2.5)"
            - "laundry ticket water_gallons == 24.0 (12 x 2.0)"
            - "site water_usage_gallons == 136.5"

      - name: calc_reorder_suggestions_three_products
        claim_type: correct_result
        grounds:
          - "calculations.bulk_reorder_suggestion"
        distinguishing_aspect: "Forward-looking projection per product with the packaged variant rounding UP to case packs: diesel 14800 gal, DEF 271 gal, oil 68 gal (= 17 cases x 4 gal, not the raw 68 rounded down); only tanks at/below threshold are emitted."
        test_recipe:
          setup: ["Site with three tanks - DIESEL (cap 20000, cur 8500, threshold 9000, safety 1500, daily 950, lead 4), DEF (cap 550, cur 320, threshold 400, safety 60, daily 18, lead 2), OIL (cap 120, cur 54, threshold 60, safety 10, daily 2, lead 2) - and a PACKAGED_OIL stock item with case_pack_gallons 4"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site C2", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DIESEL", capacity_gallons: 20000, reorder_threshold_gallons: 9000, safety_stock_gallons: 1500, daily_usage_gallons: 950, lead_time_days: 4, initial_gallons: 8500, rack_price_cents_per_gallon_4dp: 2.7000 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DEF", capacity_gallons: 550, reorder_threshold_gallons: 400, safety_stock_gallons: 60, daily_usage_gallons: 18, lead_time_days: 2, initial_gallons: 320 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "OIL", capacity_gallons: 120, reorder_threshold_gallons: 60, safety_stock_gallons: 10, daily_usage_gallons: 2, lead_time_days: 2, initial_gallons: 54 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "OIL-5W30", name: "5W30 case", category: "PACKAGED_OIL", unit: "case", unit_price_cents: 2400, reorder_point: 3, initial_on_hand_quantity: 12, case_pack_gallons: 4 }, as: GeneralManager }
          trigger:
            - { call: "GET /sites/${site_id}/reorder-suggestions", payload: {}, as: FuelDeskLead }
          assert:
            - "DIESEL suggestion 14800.0 gal (target 18000 - projected 4700 + safety 1500)"
            - "DEF suggestion 271.0 gal (495 - 284 + 60)"
            - "OIL suggestion 68.0 gal as exactly 17 case packs of 4 (ceil(68/4) - packaged variant rounds up)"
            - "exactly 3 suggestions emitted (all three tanks are at/below their thresholds)"

      - name: calc_contract_quote_tier_table
        claim_type: constants_applied
        grounds:
          - "calculations.contract_quote_cents_per_gallon"
        distinguishing_aspect: "The tiered rate table is exercised at all three tiers against identical rack 2.7000 / freight 0.1500: T1 -> 283, T2 -> 280, T3 -> 276 cents per gallon."
        test_recipe:
          setup: ["Site with diesel tank (rack 2.7000), three pumps, register, OPEN shift; fleet with three ACTIVE contracts at tiers T1/T2/T3, discount 0.00; clock 2026-08-12T10:00:00Z"]
