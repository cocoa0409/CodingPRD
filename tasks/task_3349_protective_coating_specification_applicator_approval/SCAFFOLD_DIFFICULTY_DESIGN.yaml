  # =========================================================================
  # Rule 7 — cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: work_order_gated_by_qualification_state
        grounds:
          - "validations[priority=12]"
          - state_machines.ApplicatorQualification.CANDIDATE_to_CERTIFIED
          - entities.WorkOrder.fields.applicator_id
        distinguishing_aspect: |
          Entity pair WorkOrder x ApplicatorQualification: creating a
          WorkOrder is gated by a DIFFERENT entity's state — the named
          applicator's qualification for the spec's coating system must be
          CERTIFIED; while it is CANDIDATE creation fails with
          ERR_QUALIFICATION_NOT_CERTIFIED, and the identical payload succeeds
          once certification lands. Different entity pair from the sibling's
          InspectionReport x CoatingApplication.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-09-01T00:00:00Z."
            - "VocRegulation US-FED/SPRAY_AIRLESS limit 340 ACTIVE on [2026-01-01, 2027-01-01)."
            - "CoatingSystem SW-GATE-100 ACTIVE; program QP-GATE (min score 300, streak 0) bound to it."
            - "Applicator enrolled with the qualification still CANDIDATE (certify deliberately withheld)."
            - "STRUCTURAL_STEEL project with an ISSUED spec on the system."
