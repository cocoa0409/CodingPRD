      - name: ep_clock_set_current_utc_returns_the_four_declared_cascade_counters
        claim_type: Action endpoint
        grounds:
          - "endpoints.POST_/_clock/set_current_utc"
          - "endpoints.GET_/_clock/current_utc"
          - state_machines.ResinLot.AVAILABLE_to_EXPIRED
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
        distinguishing_aspect: |
          The clock endpoint's own response schema is the assertion target:
          advancing to exactly the lot's expires_on leaves all four counters at
          0 because expiry is STRICTLY before the new clock date, and advancing
          one day further returns expired_resin_lot_count 1,
          released_resin_charge_count 1, aborted_molding_cycle_count 1 and
          blocked_production_order_count 1 in a single response.
        test_recipe:
          setup:
            - "Base plant of the discovery instance, except that the only resin lot is LOT-CD-EXP with expires_on 2026-08-05 — so nothing else can qualify PO-CD-1 once it expires."
            - "PO-CD-1 released and one MoldingCycle SCHEDULED on arm 1 holding one RESERVED ResinCharge of 24.000 kg."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - call: "POST /resin-lots"
              payload: { lot_code: "LOT-CD-EXP", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 500.000, expires_on: "2026-08-05" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot: $.data.id, lot_v: $.data.version }
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /_clock/current_utc"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the 2026-08-05T00:00:00Z response returns status 200 with current_utc '2026-08-05T00:00:00Z', default_utc '2026-08-01T00:00:00Z', expired_resin_lot_count 0, released_resin_charge_count 0, aborted_molding_cycle_count 0 and blocked_production_order_count 0"
            - "ResinLot.${lot}.status is still AVAILABLE after the 2026-08-05 set and ResinCharge.${chg}.status is still RESERVED"
            - "the 2026-08-06T00:00:00Z response returns expired_resin_lot_count 1, released_resin_charge_count 1, aborted_molding_cycle_count 1 and blocked_production_order_count 1"
            - "ResinLot.${lot}.status == 'EXPIRED' with available_kg 500.000, reserved_kg 0.000 and consumed_kg 0.000"
            - "ResinCharge.${chg}.status == 'RELEASED' with released_reason 'LOT_EXPIRED'"
            - "MoldingCycle.${cyc}.status == 'ABORTED' with abort_reason 'LOT_EXPIRED'"
            - "ProductionOrder.${po}.status == 'BLOCKED_RESIN' with blocked_reason 'NO_QUALIFIED_RESIN_LOT'"
            - "GET /_clock/current_utc returns current_utc '2026-08-06T00:00:00Z'"

      - name: ep_mold_service_hold_aborts_its_cycle_then_complete_service_resets_the_counter
        claim_type: Action endpoint
        grounds:
          - "endpoints.POST_/molds/{mold_id}/service-hold"
          - "endpoints.POST_/molds/{mold_id}/complete-service"
          - state_machines.Mold.AVAILABLE_to_MAINTENANCE
          - state_machines.Mold.MAINTENANCE_to_AVAILABLE
          - calculations.resin_mass_ledger
        distinguishing_aspect: |
          Both declared side effects of the manual service pair are asserted on
          one mould: the hold aborts the mould's SCHEDULED cycle with
          abort_reason MOLD_SERVICE_DUE and returns its reserved mass, and
          complete-service performs a FULL reset of cycles_since_service to 0
          rather than a decrement — while the order it belonged to stays
          IN_PRODUCTION, because no declared link walks the order backwards.
        test_recipe:
          setup:
            - "Base plant of the discovery instance. PO-CD-1 released and one MoldingCycle SCHEDULED on MLD-CD-1 holding a RESERVED 24.000 kg charge from LOT-CD-1; the mould is still AVAILABLE because the oven has not started."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
          trigger:
            - call: "POST /molds/${mold}/service-hold"
              payload: { hold_note: "cavity liner inspection" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds/${mold}/complete-service"
              payload: { service_note: "liner replaced" }
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the service-hold response status is 200 with Mold.${mold}.status == 'MAINTENANCE' and Mold.${mold}.version == 2"
            - "MoldingCycle.${cyc}.status == 'ABORTED' with abort_reason 'MOLD_SERVICE_DUE'"
            - "ResinCharge.${chg}.status == 'RELEASED' with released_reason 'MOLD_SERVICE_DUE'"
            - "ResinLot.${lot}.available_kg == 500.000, reserved_kg == 0.000 and consumed_kg == 0.000"
            - "ProductionOrder.${po}.status is still 'IN_PRODUCTION' — the abort does not walk the order back to READY_TO_SCHEDULE"
            - "the complete-service response returns Mold.${mold}.status == 'AVAILABLE', cycles_since_service == 0 and version == 3"

      - name: ep_oven_station_mark_down_aborts_only_the_scheduled_cycle_on_that_station
        claim_type: Conditional action
        grounds:
          - "endpoints.POST_/oven-stations/{oven_station_id}/mark-down"
          - state_machines.OvenStation.OPERATIONAL_to_DOWN
          - calculations.oven_arm_window_check
          - calculations.resin_mass_ledger
        distinguishing_aspect: |
          One mark-down call meets two cycles on the same station in different
          statuses and treats them differently: the SCHEDULED cycle on arm 2 is
          aborted with abort_reason STATION_DOWN and its reserved mass returns
          to the lot, while the OVEN_RUNNING cycle on arm 1 is left untouched
          and its CONSUMED mass is not reversed.
        test_recipe:
          setup:
            - "Base plant of the discovery instance plus a second mould MLD-CD-2 for the same model, so two coincident cycles can each hold a mould."
            - "ProductionOrder PO-CD-4 (ordered_qty 4, no demand_bucket_id) released, giving an overbuild ceiling of floor(4 * 1.20) = 4 units, i.e. room for both two-cavity cycles."
            - "Cycle A on arm 1 with a 24.000 kg charge, started so it is OVEN_RUNNING and its charge is CONSUMED; cycle B on arm 2 over the identical window with its own 24.000 kg RESERVED charge, still SCHEDULED."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - &cd2_mold2
              call: "POST /molds"
              payload: { mold_code: "MLD-CD-2", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold2: $.data.id }
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - &cd2_po4
              call: "POST /production-orders"
              payload: { order_code: "PO-CD-4", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 4 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - &cd2_po4rel
              call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - *cd2_cyc
            - *cd2_chg
            - call: "GET /production-orders/${po}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v2: $.data.version }
            - &cd2_cycb
              call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 2, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v2}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cycb: $.data.id }
            - call: "GET /resin-lots/${lot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_v2: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cycb}", resin_lot_id: "${lot}", charge_kg: 24.000, regrind_kg: 2.400, expected_resin_lot_version: "${lot_v2}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { chgb: $.data.id }
            - *cd2_clk0900
            - *cd2_start
          trigger:
            - call: "POST /oven-stations/${station}/mark-down"
              payload: { down_reason: "burner fault" }
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "the response status is 200 with OvenStation.${station}.status == 'DOWN' and version == 2"
            - "MoldingCycle.${cyc}.status is still 'OVEN_RUNNING' and its abort_reason is null"
            - "MoldingCycle.${cycb}.status == 'ABORTED' with abort_reason 'STATION_DOWN'"
            - "ResinCharge.${chg}.status is still 'CONSUMED' — consumed mass is never reversed"
            - "ResinCharge.${chgb}.status == 'RELEASED' with released_reason 'STATION_DOWN'"
            - "ResinLot.${lot}.available_kg == 476.000, reserved_kg == 0.000 and consumed_kg == 24.000, so available + reserved + consumed == 500.000"
            - "ProductionOrder.${po}.status is still 'IN_PRODUCTION' and blocked_reason is null, because LOT-CD-1 never went DEPLETED"
            - "Mold.${mold}.status is still 'IN_CYCLE' and Mold.${mold2}.status is back to 'AVAILABLE' with cycles_since_service 0"

