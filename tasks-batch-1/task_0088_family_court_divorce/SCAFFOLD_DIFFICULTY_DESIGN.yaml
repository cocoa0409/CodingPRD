  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      # ----- Instance 1: Mediator sessions — CLOSED intervals (adjacency collides) -----
      - name: mediator_double_booking_closed_interval_adjacency
        grounds:
          - validations[priority=8]
          - errors[ERR_MEDIATOR_DOUBLE_BOOKED]
          - entities.MediationSession.fields.scheduled_start
        distinguishing_aspect: |
          MediationSession overlap uses CLOSED intervals: a second session for the same
          mediator starting exactly when the first ends (11:00 == 11:00) is REJECTED —
          touching endpoints collide because of the mandatory clearance buffer.
        test_recipe:
          setup:
            - "Case(CA) in MEDIATION (mediator u-med); one SCHEDULED session 09:00-11:00 on 2026-07-01."
          setup_api_calls:
            - call: "POST /api/guideline-schedules"
              payload: { state_code: "CA", basic_obligation_tiers: [ { min_combined_monthly_cents: 0, max_combined_monthly_cents: 99999999, base_cents_one_child: 100000, marginal_pct_per_extra_child: 0.50 } ], spousal_payor_pct: 0.40, spousal_payee_offset_pct: 0.50, shared_custody_threshold_pct: 0.40, long_marriage_months: 120 }
