            - "mh2_ok == \"HELD\" (inclusive: holding on the meeting date is allowed)"

      - name: report_not_required_complaint_rejected
        claim_type: violation_to_error
        grounds: [state_machines.CustomerComplaint, "errors[ERR_REPORT_NOT_REQUIRED]"]
        distinguishing_aspect: "Regulatory-axis state gate: reporting a complaint whose regulatory_status is NOT_REQUIRED is rejected."
        test_recipe:
