              as: BeachCaptain
          trigger:
            - call: "POST /beach-ops/zones/${zone_id}/flag"
              payload: { flag_status: "GREEN" }
              as: BeachCaptain
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RIP_CURRENT_UNSAFE"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: bacteria_104_closure_inclusive_boundary
        grounds:
          - calculations.bacteria_exceedance_assessment
          - entities.Advisory.fields.level
        distinguishing_aspect: |
          Enterococci exactly 104 trips CLOSURE (>=104) while 103 stays ADVISORY — inclusive
          numeric boundary on the bacteria metric, reached through the advisories endpoint.
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; one beach; zoneA with a single sample MPN 104; zoneB with a single sample MPN 103."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "Zone A", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zoneA_id: $.data.id, zvA: $.data.version }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "Zone B", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zoneB_id: $.data.id, zvB: $.data.version }
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zoneA_id}", enterococci_mpn: 104, sampled_at: "2026-07-15T08:00:00Z", lab_ref: "LA", technician: "T" }
              as: WaterQualityInspector
            - call: "POST /beach-ops/water-quality-samples"
              payload: { zone_id: "${zoneB_id}", enterococci_mpn: 103, sampled_at: "2026-07-15T08:00:00Z", lab_ref: "LB", technician: "T" }
              as: WaterQualityInspector
          trigger:
            - call: "POST /beach-ops/zones/${zoneA_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zvA}" }
              as: WaterQualityInspector
              captures: { a_level: $.data.level }
            - call: "POST /beach-ops/zones/${zoneB_id}/advisories"
              payload: { basis: "SINGLE_SAMPLE", expected_zone_version: "${zvB}" }
              as: WaterQualityInspector
              captures: { b_level: $.data.level }
          assert:
            - "Advisory(zoneA, mpn=104).level == CLOSURE"
            - "Advisory(zoneB, mpn=103).level == ADVISORY"

      - name: lot_full_zero_space_boundary
        grounds:
          - validations[priority=19]
          - entities.ParkingLot.fields.available_spaces
          - calculations.available_spaces
        distinguishing_aspect: |
          The pass at available_spaces==1 succeeds (drops to 0) but the next at available_spaces==0
          is ERR_LOT_FULL — a zero-count edge on lot capacity via the parking-passes endpoint,
          a distinct metric and endpoint from the bacteria boundary.
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; one beach; one lot total_spaces=1 (available=1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/parking-lots"
              payload: { beach_id: "${beach_id}", name: "Lot A", total_spaces: 1, daily_rate_cents: 1000 }
              as: ParkingClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/parking-passes"
              payload: { lot_id: "${lot_id}", plate: "P1", vehicle_type: "CAR", pass_type: "DAILY" }
              as: ParkingClerk
              captures: { p1_status: $.data.status }
            - call: "POST /beach-ops/parking-passes"
              payload: { lot_id: "${lot_id}", plate: "P2", vehicle_type: "CAR", pass_type: "DAILY" }
              as: ParkingClerk
              captures: { err: $.data.error_id }
          assert:
            - "ParkingPass(P1).status == ACTIVE"
            - "second issue response.data.error_id == ERR_LOT_FULL"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shift_clockin_requires_tower_open
        grounds:
          - state_machines.Shift.SCHEDULED_to_ON_DUTY
          - entities.Tower.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          Shift SCHEDULED->ON_DUTY is gated on the Tower's status==OPEN; an OFFLINE tower blocks
          CLOCK_IN with ERR_TOWER_OFFLINE — cross-entity dependency on the Shift->Tower pair.
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; beach/zone/tower/lifeguard; one SCHEDULED shift; tower then set OFFLINE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T17:00:00Z" }
              as: BeachCaptain
              captures: { shift_id: $.data.id }
            - call: "POST /beach-ops/towers/${tower_id}/status"
              payload: { status: "OFFLINE" }
              as: BeachCaptain
          trigger:
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_IN" }
              as: Lifeguard
              as_user_id: "${lg_id}"
              captures: { err: $.data.error_id }
          assert:
            - "clock-in response.data.error_id == ERR_TOWER_OFFLINE"

      - name: zone_green_requires_guards_from_shifts
        grounds:
          - state_machines.Zone.RED_to_GREEN
          - state_machines.Shift.SCHEDULED_to_ON_DUTY
          - entities.Zone.fields.on_duty_guard_count
          - validations[priority=17]
        distinguishing_aspect: |
          Zone RED->GREEN is gated on on_duty_guard_count, derived from sibling Shift ON_DUTY/ON_BREAK
          states; with 0 on-duty shifts it fails ERR_ZONE_UNDERSTAFFED and only after a Shift CLOCK_IN
          does GREEN succeed — cross-entity dependency on the Zone->Shift pair (distinct from Shift->Tower).
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; beach/zone(min1)/tower/lifeguard; one SCHEDULED shift, no guard on duty (count=0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T17:00:00Z" }
              as: BeachCaptain
              captures: { shift_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/zones/${zone_id}/flag"
              payload: { flag_status: "GREEN" }
              as: BeachCaptain
              captures: { err1: $.data.error_id }
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_IN" }
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "POST /beach-ops/zones/${zone_id}/flag"
              payload: { flag_status: "GREEN" }
              as: BeachCaptain
              captures: { flag_ok: $.data.flag_status }
          assert:
            - "first GREEN attempt response.data.error_id == ERR_ZONE_UNDERSTAFFED"
            - "Zone.flag_status after CLOCK_IN then GREEN == GREEN"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: lifeguard_double_book_halfopen_adjacency
        grounds:
          - validations[priority=15]
          - entities.Shift.fields.scheduled_start
          - entities.Shift.fields.scheduled_end
        distinguishing_aspect: |
          For the same Lifeguard, [11:00,13:00) overlaps [09:00,12:00) and is rejected, but adjacent
          [12:00,14:00) sharing only endpoint 12:00 is allowed — half-open single-occupancy interval
          semantics on the Lifeguard resource.
        test_recipe:
          setup:
            - "Clock 2026-07-15T08:00:00Z; beach/zone; one tower max_concurrent_guards=5; one lifeguard with a 09:00–12:00 shift."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T08:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 5 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T12:00:00Z" }
              as: BeachCaptain
          trigger:
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T11:00:00Z", scheduled_end: "2026-07-15T13:00:00Z" }
              as: BeachCaptain
              captures: { err: $.data.error_id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T12:00:00Z", scheduled_end: "2026-07-15T14:00:00Z" }
              as: BeachCaptain
              captures: { s3_status: $.data.status }
          assert:
            - "overlapping shift response.data.error_id == ERR_LIFEGUARD_DOUBLE_BOOKED"
            - "adjacent shift Shift.status == SCHEDULED"

      - name: tower_capacity_aggregate_overlap
        grounds:
          - validations[priority=16]
          - entities.Tower.fields.max_concurrent_guards
        distinguishing_aspect: |
          A Tower with max_concurrent_guards=1 rejects a second guard whose [10:00,11:00) overlaps
          an existing shift (2 concurrent > 1) but accepts an adjacent [12:00,13:00) — aggregate-capacity
          interval semantics on the Tower resource, distinct from the Lifeguard single-occupancy rule.
        test_recipe:
          setup:
            - "Clock 2026-07-15T08:00:00Z; beach/zone; one tower max_concurrent_guards=1; two lifeguards; lg1 has a 09:00–12:00 shift on the tower."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T08:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 1 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg1_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Bo", certification_level: "SENIOR", employee_ref: "E2" }
              as: BeachCaptain
              captures: { lg2_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg1_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T12:00:00Z" }
              as: BeachCaptain
          trigger:
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg2_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T10:00:00Z", scheduled_end: "2026-07-15T11:00:00Z" }
              as: BeachCaptain
              captures: { err: $.data.error_id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg2_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T12:00:00Z", scheduled_end: "2026-07-15T13:00:00Z" }
              as: BeachCaptain
              captures: { s3_status: $.data.status }
          assert:
            - "over-capacity shift response.data.error_id == ERR_TOWER_CAPACITY_EXCEEDED"
            - "adjacent shift Shift.status == SCHEDULED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: parking_spaces_conserved_issue_then_revoke
        grounds:
          - calculations.available_spaces
          - entities.ParkingLot.fields.available_spaces
          - state_machines.ParkingPass.none_to_ACTIVE
          - state_machines.ParkingPass.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          available_spaces = total_spaces - count(ACTIVE passes); issuing a pass (10->9) then revoking
          it (9->10) leaves available_spaces at 10 unchanged — conserved quantity is physical parking spaces.
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; one beach; one lot total_spaces=10 (available=10)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/parking-lots"
              payload: { beach_id: "${beach_id}", name: "Lot A", total_spaces: 10, daily_rate_cents: 1000 }
              as: ParkingClerk
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/parking-passes"
              payload: { lot_id: "${lot_id}", plate: "P1", vehicle_type: "CAR", pass_type: "DAILY" }
              as: ParkingClerk
              captures: { pass_id: $.data.id }
            - call: "GET /beach-ops/parking-lots/${lot_id}"
              as: ParkingClerk
              captures: { avail_mid: $.data.available_spaces }
            - call: "POST /beach-ops/parking-passes/${pass_id}/revoke"
              payload: {}
              as: ParkingClerk
            - call: "GET /beach-ops/parking-lots/${lot_id}"
              as: ParkingClerk
              captures: { avail_after: $.data.available_spaces }
          assert:
            - "ParkingLot.available_spaces after issue == 9"
            - "ParkingLot.available_spaces after revoke == 10"

      - name: staffing_headcount_conserved_clockin_then_clockout
        grounds:
          - calculations.on_duty_guard_count
          - entities.Zone.fields.on_duty_guard_count
          - state_machines.Shift.SCHEDULED_to_ON_DUTY
          - state_machines.Shift.ON_DUTY_to_OFF_DUTY
        distinguishing_aspect: |
          on_duty_guard_count = count(Shift in {ON_DUTY,ON_BREAK}); CLOCK_IN (0->1) then CLOCK_OUT (1->0)
          returns the count to 0 unchanged — conserved quantity is staffing headcount, a different type
          from parking spaces.
        test_recipe:
          setup:
            - "Clock 2026-07-15T09:00:00Z; beach/zone(min1)/tower/lifeguard; one SCHEDULED shift (count=0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-15T09:00:00Z" }
              as: BeachCaptain
            - call: "POST /beach-ops/beaches"
              payload: { name: "Ocean Park", town_code: "OP", season_start_date: "2026-05-23", season_end_date: "2026-09-07" }
              as: BeachCaptain
              captures: { beach_id: $.data.id }
            - call: "POST /beach-ops/zones"
              payload: { beach_id: "${beach_id}", name: "North Cove", min_guards_required: 1 }
              as: BeachCaptain
              captures: { zone_id: $.data.id }
            - call: "POST /beach-ops/towers"
              payload: { zone_id: "${zone_id}", label: "T4", max_concurrent_guards: 2 }
              as: BeachCaptain
              captures: { tower_id: $.data.id }
            - call: "POST /beach-ops/lifeguards"
              payload: { beach_id: "${beach_id}", name: "Ana", certification_level: "SENIOR", employee_ref: "E1" }
              as: BeachCaptain
              captures: { lg_id: $.data.id }
            - call: "POST /beach-ops/shifts"
              payload: { lifeguard_id: "${lg_id}", tower_id: "${tower_id}", scheduled_start: "2026-07-15T09:00:00Z", scheduled_end: "2026-07-15T17:00:00Z" }
              as: BeachCaptain
              captures: { shift_id: $.data.id }
          trigger:
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_IN" }
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "GET /beach-ops/zones/${zone_id}"
              as: BeachCaptain
              captures: { count_mid: $.data.on_duty_guard_count }
            - call: "POST /beach-ops/shifts/${shift_id}/transitions"
              payload: { action: "CLOCK_OUT" }
              as: Lifeguard
              as_user_id: "${lg_id}"
            - call: "GET /beach-ops/zones/${zone_id}"
              as: BeachCaptain
              captures: { count_after: $.data.on_duty_guard_count }
          assert:
            - "Zone.on_duty_guard_count after CLOCK_IN == 1"
            - "Zone.on_duty_guard_count after CLOCK_OUT == 0"
