              payload: {}
              as: QualityInspector
              captures: { err1: $.data.error_id }
            - { call: "POST /api/contamination-events/${ev_id}/confirm", payload: {}, as: QualityInspector }
            - call: "POST /api/contamination-events/${ev_id}/confirm"
              payload: {}
              as: QualityInspector
              captures: { err2: $.data.error_id }
          assert:
            - "remediate while REPORTED: err1 == ERR_EVENT_INVALID_STATE"
            - "First confirm succeeds: ContaminationEvent.${ev_id}.status == CONFIRMED (severity 1 -> room WATCH)"
            - "Second confirm: err2 == ERR_EVENT_INVALID_STATE (no self-transition)"

