# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Task: task_0706_virtual_receptionist_answering  (Expert tier)
# Enumerates testable claims from SCAFFOLD.yaml §1.1–§1.7 NOT already covered by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). section:/claim_type: values come from
# references/claim-extraction-guide.md. excluded_because: stubs cite the §1.8
# instance (by name) that already exercises the corner.
# Every grounds[]/call/error_id/state/calculation resolves verbatim into
# SCAFFOLD.yaml. Common preamble: clock default 2026-03-01T00:00:00Z; account
# creation opens BillingPeriod 0; calls need a PUBLISHED script.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      # ---- ServicePlan creation + immutability (common_fields: false)
      - name: service_plan_create_returns_201_and_fields
        claim_type: Creation
        grounds:
          - entities.ServicePlan
          - endpoints.POST_/va/service-plans
        distinguishing_aspect: "POST /va/service-plans with all required fields -> 201 and response echoes name, billing_model, base_fee_cents."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /va/service-plans"
              payload: { name: "Basic", billing_model: "PER_MINUTE", base_fee_cents: 1000, overage_rate_cents: 100, overage_tier2_rate_cents: 300, hard_cap_overage_cents: 50000, included_minutes: 60, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "response status == 201"
            - "ServicePlan.${plan_id}.billing_model == \"PER_MINUTE\""
            - "ServicePlan.${plan_id}.base_fee_cents == 1000"
            - "response.data has id and created_at (no version field; common_fields false)"

      - name: service_plan_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.ServicePlan
        distinguishing_aspect: "ServicePlan has common_fields: false -> only id + created_at; no version field and no update/delete endpoint exists in §1.5."
        test_recipe:
          setup:
            - "One created plan."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "Basic", billing_model: "PER_CALL", base_fee_cents: 1000, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 50000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "GET /va/service-plans/${plan_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET response.data contains id and created_at"
            - "GET response.data contains NO version field"

      - name: plan_misconfigured_per_minute_with_included_calls
        claim_type: Type Constraints
        grounds:
          - errors[ERR_PLAN_MISCONFIGURED]
          - entities.ServicePlan.fields.billing_model
        distinguishing_aspect: "PER_MINUTE plan with included_calls > 0 -> ERR_PLAN_MISCONFIGURED (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /va/service-plans"
              payload: { name: "Bad", billing_model: "PER_MINUTE", base_fee_cents: 1000, overage_rate_cents: 100, overage_tier2_rate_cents: 300, hard_cap_overage_cents: 50000, included_minutes: 60, included_calls: 5, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == \"ERR_PLAN_MISCONFIGURED\""

      - name: account_create_opens_first_billing_period
        claim_type: Computed Fields
        grounds:
          - entities.ClientAccount.fields.current_period_id
          - entities.ClientAccount.fields.status
          - entities.BillingPeriod.fields.period_index
          - endpoints.POST_/va/accounts
        distinguishing_aspect: "POST /va/accounts -> status ACTIVE, current_period_id set, and the referenced BillingPeriod has period_index 0 with included_units pinned from plan."
        test_recipe:
          setup:
            - "One PER_MINUTE plan included_minutes=60."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "P60", billing_model: "PER_MINUTE", base_fee_cents: 0, overage_rate_cents: 100, overage_tier2_rate_cents: 300, hard_cap_overage_cents: 50000, included_minutes: 60, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /va/accounts"
              payload: { business_name: "Acme", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id, period_id: $.data.current_period_id }
          assert:
            - "ClientAccount.${acct_id}.status == \"ACTIVE\""
            - "ClientAccount.${acct_id}.current_period_id is non-null"
            - "BillingPeriod.${period_id}.period_index == 0"
            - "BillingPeriod.${period_id}.included_units == 60"
            - "BillingPeriod.${period_id}.status == \"OPEN\""

      - name: account_default_language_defaults_to_en
        claim_type: Defaults
        grounds:
          - entities.ClientAccount.fields.default_language
        distinguishing_aspect: "Omitting default_language on account create applies default \"EN\"."
        test_recipe:
          setup:
            - "One plan."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "Pd", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 50000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /va/accounts"
              payload: { business_name: "Defaulty", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "ClientAccount.${acct_id}.default_language == \"EN\""

      - name: account_get_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/va/accounts/{accountId}
        distinguishing_aspect: "GET /va/accounts/{accountId} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /va/accounts/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == \"ERR_NOT_FOUND\""

      - name: call_script_missing_required_field
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.CallScript.fields.greeting_en
        distinguishing_aspect: "POST /va/call-scripts omitting required greeting_en -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One account."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "Ps", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 50000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Sigma", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", business_open_minute: 540, business_close_minute: 1020 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == \"ERR_INVALID_REQUEST\""

      - name: receptionist_languages_enum_constraint
        claim_type: Type Constraints
        grounds:
          - entities.Receptionist.fields.languages
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /va/receptionists with a language not in {EN,ES} -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /va/receptionists"
              payload: { display_name: "Bad", languages: ["FR"], max_concurrent_calls: 1 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == \"ERR_INVALID_REQUEST\""

      - name: calendar_slot_window_end_must_exceed_start
        claim_type: Type Constraints
        grounds:
          - entities.CalendarSlot.fields.window_end
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "CalendarSlot with window_end <= window_start -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "One account."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "Pc", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 50000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Tau", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T17:00:00Z", window_end: "2026-03-02T09:00:00Z", capacity: 1 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "error_id == \"ERR_INVALID_REQUEST\""

      - name: calendar_slot_computed_available_count
        claim_type: Computed Fields
        grounds:
          - entities.CalendarSlot.fields.booked_count
          - entities.CalendarSlot.fields.available_count
        distinguishing_aspect: "On create, CalendarSlot.booked_count == 0 and available_count == capacity (computed, input ignored)."
        test_recipe:
          setup:
            - "One account."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "Pv", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 50000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Ups", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T17:00:00Z", capacity: 3 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id }
          assert:
            - "CalendarSlot.${slot_id}.booked_count == 0"
            - "CalendarSlot.${slot_id}.available_count == 3"
            - "CalendarSlot.${slot_id}.status == \"OPEN\""

      # ---- flat topology: FK integrity (claim from entity_topology=flat)
      - name: call_script_unknown_account_fk_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.CallScript.fields.account_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Flat topology FK integrity: POST /va/call-scripts with a non-existent account_id FK -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB (no account)."
          setup_api_calls: []
          trigger:
            - call: "POST /va/call-scripts"
              payload: { account_id: "00000000-0000-0000-0000-000000000000", greeting_en: "hi", business_open_minute: 540, business_close_minute: 1020 }
              as: AccountOwner
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "error_id == \"ERR_NOT_FOUND\""

      # ---- listing + pagination envelope
      - name: list_service_plans_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/va/service-plans
        distinguishing_aspect: "GET /va/service-plans returns response_type array with pagination fields limit/offset/total_count/has_more."
        test_recipe:
          setup:
            - "Two plans created."
          setup_api_calls:
            - call: "POST /va/service-plans"
              payload: { name: "L1", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 50000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "L2", billing_model: "PER_MINUTE", base_fee_cents: 0, overage_rate_cents: 100, overage_tier2_rate_cents: 300, hard_cap_overage_cents: 50000, included_minutes: 60, overage_tier2_threshold: 100 }
              as: PlatformAdmin
          trigger:
            - call: "GET /va/service-plans?limit=1&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response.response_type == \"array\""
            - "response.data.total_count == 2"
            - "response.data.has_more == true (limit 1 < total 2)"
            - "response.data array length == 1 (limit 1)"

  # ===========================================================================
  - section: state_machines
    instances:
      # ---- RINGING -> SCREENED_OUT via blocked area code (spam intake path)
      - name: intake_blocked_area_code_screens_out
        claim_type: Valid Transition
        grounds:
          - state_machines.Call.handling_status.RINGING_to_SCREENED_OUT
          - entities.SpamRule.fields.blocked_area_codes
          - entities.Call.fields.handling_status
        distinguishing_aspect: "Inbound call whose caller_id area code is in an ACTIVE SpamRule.blocked_area_codes -> handling_status SCREENED_OUT at intake; never billed."
        test_recipe:
          setup:
            - "Account with PUBLISHED 24h script and ACTIVE SpamRule blocked_area_codes=[\"900\"]. Inbound caller_id 9005551234."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Psc", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Spammy", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/spam-rules"
              payload: { account_id: "${acct_id}", blocked_area_codes: ["900"], spam_score_threshold: 70, anonymous_penalty: 40 }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "9005551234", requested_language: "EN" }
              as: PlatformAdmin
              captures: { call_id: $.data.id, h: $.data.handling_status }
          assert:
            - "Call.${call_id}.handling_status == \"SCREENED_OUT\""
            - "Call.${call_id}.billing_status == \"UNBILLED\""
            - "ClientAccount.${acct_id}.open_call_count == 0 (screened call does not open)"

      # ---- RINGING -> ABANDONED
      - name: ringing_call_abandoned_decrements_open_count
        claim_type: Valid Transition
        grounds:
          - state_machines.Call.handling_status.RINGING_to_ABANDONED
          - entities.ClientAccount.fields.open_call_count
        distinguishing_aspect: "POST /va/calls/{callId}/abandon on a RINGING call -> ABANDONED and ClientAccount.open_call_count decrements by 1."
        test_recipe:
          setup:
            - "Account with PUBLISHED 24h script; one RINGING call (open_call_count 1)."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pab", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Aband", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: PlatformAdmin
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /va/calls/${call_id}/abandon"
              payload: {}
              as: PlatformAdmin
              captures: { h: $.data.handling_status }
          assert:
            - "Call.${call_id}.handling_status == \"ABANDONED\""
            - "ClientAccount.${acct_id}.open_call_count == 0"

      # ---- initial state
      - name: new_appointment_starts_requested
        claim_type: Initial State
        grounds:
          - state_machines.Appointment.status
          - entities.Appointment.fields.status
        distinguishing_aspect: "A newly booked Appointment starts in initial_state REQUESTED."
        test_recipe:
          setup:
            - "Account with OPEN slot capacity 1."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pin", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Init", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T17:00:00Z", capacity: 1 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
          trigger:
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { appt_id: $.data.id, st: $.data.status }
          assert:
            - "Appointment.${appt_id}.status == \"REQUESTED\""
            - "CalendarSlot.${slot_id}.booked_count == 1"

      # ---- invalid transition: confirm an already-CANCELLED appointment
      - name: confirm_cancelled_appointment_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Confirming an appointment already in terminal CANCELLED -> ERR_INVALID_STATE (409); no transition defined from CANCELLED."
        test_recipe:
          setup:
            - "Account with OPEN slot; one REQUESTED appointment then CANCELLED."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pcn", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Term", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/calendar-slots"
              payload: { account_id: "${acct_id}", window_start: "2026-03-02T09:00:00Z", window_end: "2026-03-02T17:00:00Z", capacity: 1 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /va/appointments"
              payload: { account_id: "${acct_id}", slot_id: "${slot_id}", start_at: "2026-03-02T10:00:00Z", end_at: "2026-03-02T10:30:00Z", expected_slot_version: "${slot_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /va/appointments/${appt_id}/cancel"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /va/appointments/${appt_id}/confirm"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Appointment.${appt_id}.status == \"CANCELLED\" before trigger"
            - "response status == 409"
            - "error_id == \"ERR_INVALID_STATE\""

      # ---- terminal lockdown: re-abandon a SCREENED_OUT/ABANDONED call
      - name: abandon_already_abandoned_call_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Call.handling_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Calling abandon a second time on an ABANDONED (terminal) call -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Account with PUBLISHED 24h script; one RINGING call abandoned once."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pte", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Lock", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
