              captures: { pkt_id: $.data.id, closes_at: $.data.review_closes_at }
            - { call: "POST /api/evidence-packets/${pkt_id}/attach-report", payload: { investigative_report_summary: "Narrative" }, as: Investigator, as_user_id: "${inv_id}" }
            - { call: "POST /api/evidence-packets/${pkt_id}/release", as: Investigator, as_user_id: "${inv_id}" }
