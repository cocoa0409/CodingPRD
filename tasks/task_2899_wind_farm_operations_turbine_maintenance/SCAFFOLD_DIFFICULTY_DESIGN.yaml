            - "rung C returns HTTP 422 with ${err_rung_c} == ERR_MINIMUM_PAYMENT_ABOVE_CAP, because 99900000 exceeds 100000000 minus the 240000 already posted to landowner_payable_cents; the same figure would pass a naive check against the raw cap"
