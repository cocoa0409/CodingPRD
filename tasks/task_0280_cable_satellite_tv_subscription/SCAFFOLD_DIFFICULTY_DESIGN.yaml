  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_constraint_on_addon_attach
        grounds:
          - validations[priority=8]
          - validations[priority=13]
        distinguishing_aspect: |
          On add-on attach, a SUSPENDED account (category state, priority 8 ERR_ACCOUNT_NOT_ACTIVE)
          attaching a too-high-rank premium (category business_constraint, priority 13
          ERR_ADDON_RANK_TOO_HIGH) returns the state error — state beats business_constraint.
        test_recipe:
          setup:
            - "Catalog: BASIC (rank1 fee3000). PREMIER-only premium SPORTS (fee2000 min_rank3). Account BASIC, then SUSPENDED."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "BASIC", name: "Basic", monthly_fee_cents: 3000, channel_count: 60, rank: 1, active: true }
              as: BillingAdmin
              captures: { basic_id: $.data.id }
            - call: "POST /premium-channels"
              payload: { code: "SPORTS", name: "Sports", kind: "ADD_ON", monthly_fee_cents: 2000, min_package_rank: 3, active: true }
              as: BillingAdmin
              captures: { sports_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Pri", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${basic_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/suspend"
              payload: {}
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/add-ons"
              payload: { premium_channel_id: "${sports_id}" }
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_NOT_ACTIVE"

      - name: visit_window_safety_beats_temporal_overlap
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: |
          On visit schedule, a window with window_start >= window_end (category business_safety,
          priority 10 ERR_INVALID_VISIT_WINDOW) that also collides with an existing technician
          booking (category business_temporal, priority 11 ERR_TECHNICIAN_DOUBLE_BOOKED) returns the
          safety error — business_safety beats business_temporal.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00Z. Technician TECH1. Account ACTIVE (PLUS) with an existing SCHEDULED visit 2026-06-02T09:00-10:00 on TECH1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech One", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech1: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Safe", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T10:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-02T09:30:00Z", window_end: "2026-06-02T09:30:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_VISIT_WINDOW"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: etf_remaining_exactly_12_lands_in_max_tier
        grounds:
          - calculations.early_termination_fee
          - entities.BillingStatement.fields.etf_charge_cents
        distinguishing_aspect: |
          ETF tier boundary: contract_term_months 12, tenure 0 -> remaining 12 lands in the
          remaining>=12 MAX tier (24000c), not the mid tier; the >= breakpoint is exact.
        test_recipe:
          setup:
            - "Account PLUS ACTIVE, contract_term_months 12, tenure 0 (no advance-cycle). Then cancel and issue cycle-0 statement."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
