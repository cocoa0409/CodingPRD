scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: parcel_quote_vs_final_fee_divergence
        grounds:
          - calculations.shipping_fee_quote
          - calculations.shipping_fee_final
          - entities.Parcel.fields.quoted_fee
          - entities.Parcel.fields.final_fee
        distinguishing_aspect: |
          The two calculations both operate on the Parcel domain (fee field) but use different
          algorithms — shipping_fee_quote is forward_looking (assumes one successful attempt,
          no appointments, no return) while shipping_fee_final is chronological (replays every
          DeliveryAttempt and ACCEPTED Appointment in time order). They MUST produce different
          values for the same parcel whenever any reattempt, appointment, or return occurs.
        test_recipe:
          setup:
            - "Create Customer C1 with driver_release_authorized=true; Address A1 residential=true at (lat=34.05,lon=-118.25)"
            - "Create TransitCenter H1 with code=LAX, serviced_postal_prefixes=[902], hazmat_certified=false at coords near 902xx (lat=33.94,lon=-118.40)"
            - "Create Driver D1 home_center_id=H1, hazmat_endorsement=false"
            - "Induct Parcel P1: customer_id=C1, destination=A1, origin_center=H1, weight_kg=3.0, declared_value=100.00, signature_required=false, hazmat_class=NONE, time_window=[T+2h, T+10h]"
          trigger:
            - "GET /parcels/{P1.id} immediately after induction -> read quoted_fee"
            - "Walk P1 INDUCTED -> IN_TRANSIT_HUB -> SORTED -> assign to Route R1 -> dispatch -> attempt outcome=NO_ONE_HOME"
            - "POST /parcels/{P1.id}/reattempt; re-sort; re-assign to Route R2; dispatch; advance clock into window; attempt outcome=DELIVERED_SIGNED"
            - "GET /parcels/{P1.id} -> read final_fee"
          assert:
            - "Parcel.quoted_fee == 10.50  # BASE 5.00 + weight 1.50 + distance ~3.00 + residential 1.00"
            - "Parcel.final_fee == 13.50   # quoted_fee + REATTEMPT_FEE 3.00 for the NO_ONE_HOME attempt"
            - "Parcel.final_fee != Parcel.quoted_fee  # divergence is the load-bearing assertion"

      - name: customer_rolling_redelivery_vs_parcel_redelivery_counter
        grounds:
          - calculations.customer_redelivery_rolling_count
          - entities.Customer.fields.redelivery_attempts_used_30d
          - entities.Parcel.fields.redelivery_attempts
        distinguishing_aspect: |
          Two distinct entity domains report a redelivery count: Parcel.redelivery_attempts is a
          per-parcel monotonically increasing integer scoped to one parcel's lifecycle (forward-looking
          counter on the parcel entity), while Customer.redelivery_attempts_used_30d is a
          chronological aggregation across all of the customer's parcels in a rolling 30-day window
          on the Customer entity. After clock advances past 30 days they MUST diverge — Customer's
          count drops while Parcel's count remains.
        test_recipe:
          setup:
            - "Create Customer C1 + Address + TransitCenter + Driver as above"
            - "Induct 2 parcels P1, P2 for C1 at clock T0"
            - "Run P1 through one NO_ONE_HOME attempt at T0, then reattempt & deliver"
            - "Advance clock to T0 + 31 days"
            - "Induct parcel P3 for C1, run one NO_ONE_HOME attempt at T0+31d, reattempt & deliver"
          trigger:
            - "GET /customers/{C1.id} after T0+31d"
            - "GET /parcels/{P1.id} after T0+31d"
          assert:
            - "Customer.redelivery_attempts_used_30d == 1  # only the P3 NO_ONE_HOME within rolling 30d"
            - "Parcel(P1).redelivery_attempts == 1  # P1's count remains, immune to rolling window"
            - "Customer.redelivery_attempts_used_30d != Parcel(P1).redelivery_attempts + Parcel(P3).redelivery_attempts"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: quoted_fee_multi_surcharge_nonlinear
        grounds:
          - calculations.shipping_fee_quote
          - entities.Parcel.fields.hazmat_class
          - entities.Parcel.fields.signature_required
          - entities.Address.fields.residential
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and non-linear interaction. shipping_fee_quote combines
          weight (bucketed via ceil), distance (bucketed via ceil), and three boolean surcharges
          (hazmat, signature, residential). The ceil-bucketing on weight and distance makes the
          formula non-linear: weight 1.01kg yields the same weight_fee as weight 2.00kg (one bucket),
          but weight 2.01kg jumps to two buckets. Distance behaves analogously at 25km steps.
        test_recipe:
          setup:
            - "Create Customer + residential Address + hazmat-certified TransitCenter H1"
            - "Induct Parcel P with weight_kg=3.0, residential=true, signature_required=true, hazmat_class=CLASS_3, distance_to_destination=50km"
          trigger:
            - "GET /parcels/{P.id}"
          assert:
            - "Parcel.quoted_fee == 25.00  # 5.00 + ceil(2.0)*0.75=1.50 + ceil(50/25)*1.50=3.00 + 12.00 hazmat + 2.50 signature + 1.00 residential"

      - name: final_fee_rounding_order_pinned
        grounds:
          - calculations.shipping_fee_final
          - calculations.shipping_fee_quote
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins "sum then round once at
          the end" for both quote and final calculations. If an implementation rounds each surcharge
          to 2 decimals before summing (per-line-item rounding), a parcel with one accepted
          appointment + one reattempt would compute different cents under the wrong order when
          combined with other half-cent-prone inputs. The pinned literal value protects against
          this drift.
        test_recipe:
          setup:
            - "Create Customer C1 + residential Address + non-hazmat-certified TransitCenter H1 (postal prefix 902, coords (33.94,-118.40))"
            - "Address coords (34.05,-118.25) gives haversine distance bucket=2 -> distance_fee=3.00"
            - "Induct Parcel P, weight_kg=3.0, signature_required=false, hazmat_class=NONE, residential=true, time_window=[T+2h, T+10h]"
            - "Sort, route, attempt outcome=NO_ONE_HOME at T+3h"
            - "Reattempt; customer files Appointment new window [T+5h, T+8h]; Dispatcher accepts"
            - "Re-route, dispatch, attempt outcome=DELIVERED_SIGNED within new window"
          trigger:
            - "GET /parcels/{P.id} after terminal DELIVERED"
          assert:
            - "Parcel.final_fee == 18.00  # quoted 10.50 + REATTEMPT_FEE 3.00 + APPOINTMENT_CHANGE_FEE 4.50, rounded once"
            - "Parcel.final_fee != 10.50  # sanity that order of effects is reflected"

      - name: route_distance_sequence_dependent
        grounds:
          - calculations.route_distance_total
          - entities.RouteStop.fields.sequence
        distinguishing_aspect: |
          Mode (c): circular-looking dependency where evaluation order is pinned. RouteStop.sequence
          is assigned by the optimizer (constraint_propagation) and Route.total_distance_km depends
          on the sequence ordering, while planned_arrival_assignment depends on total distance plus
          windows. The scaffold pins: stops are processed in sequence ASC, distance accumulates leg
          by leg with no return-to-hub leg, and the optimizer assigns sequence by appending in
          insertion order (test fixtures rely on this pin).
        test_recipe:
          setup:
            - "Create TransitCenter H1 at (lat=33.94,lon=-118.40)"
            - "Create 3 addresses A,B,C at successive coordinates such that leg(H1->A)=20km, leg(A->B)=15km, leg(B->C)=10km, leg(H1->C)=25km"
            - "Induct parcels Pa,Pb,Pc with destination=A,B,C; sort each"
            - "Create Route R; POST stops in order Pa,Pb,Pc"
          trigger:
            - "GET /routes/{R.id}"
          assert:
            - "Route.total_distance_km == 45.00  # 20 + 15 + 10, no return leg; pinned by sequence ASC"
            - "Route.stop_count == 3"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: parcel_redelivery_cycle
        grounds:
          - state_machines.Parcel.OUT_FOR_DELIVERY_to_EXCEPTION
          - state_machines.Parcel.EXCEPTION_to_SORTED
          - state_machines.Parcel.SORTED_to_ON_VEHICLE
        distinguishing_aspect: |
          Cyclic state machine on Parcel: SORTED -> ON_VEHICLE -> OUT_FOR_DELIVERY -> EXCEPTION ->
          SORTED is a documented revision loop that can run up to MAX_REDELIVERY_ATTEMPTS times.
          This makes Parcel's machine non-linear in the strict cycle sense.
        test_recipe:
          setup:
            - "Induct Parcel P1 and walk to OUT_FOR_DELIVERY"
          trigger:
            - "Attempt outcome=NO_ONE_HOME -> EXCEPTION"
            - "POST /parcels/{P1.id}/reattempt -> SORTED"
            - "POST /routes/{R.id}/stops body parcel_id=P1 -> ON_VEHICLE"
          assert:
            - "Parcel.status == ON_VEHICLE after the cycle"
            - "Parcel.redelivery_attempts == 1"

      - name: route_branching_terminals
        grounds:
          - state_machines.Route.PLANNED_to_CANCELLED
          - state_machines.Route.PLANNED_to_DISPATCHED
          - state_machines.Route.IN_PROGRESS_to_CLOSED
        distinguishing_aspect: |
          Branching on Route (different entity from Parcel): from PLANNED a route forks to either
          DISPATCHED (forward path leading to CLOSED with terminal Driver.RETURNED) or to CANCELLED
          (terminal with cascading side effects reverting all RouteStops). The two branches have
          divergent side-effect sets, satisfying the branching fork-join clause on a second entity.
        test_recipe:
          setup:
            - "Create Route R_a with 2 stops, status PLANNED"
            - "Create Route R_b with 2 stops, status PLANNED"
          trigger:
            - "POST /routes/{R_a.id}/cancel"
            - "POST /routes/{R_b.id}/dispatch"
          assert:
            - "Route(R_a).status == CANCELLED and Route(R_a).stop_count == 0  # cascade deleted stops"
            - "Route(R_b).status == IN_PROGRESS  # DISPATCHED auto-advances to IN_PROGRESS"
            - "All parcels of R_a are back in SORTED; all parcels of R_b are in OUT_FOR_DELIVERY"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: dispatch_cascade_depth_3
        grounds:
          - state_machines.Route.PLANNED_to_DISPATCHED
          - state_machines.Driver.ON_DUTY_to_ON_ROUTE
          - state_machines.Parcel.ON_VEHICLE_to_OUT_FOR_DELIVERY
        distinguishing_aspect: |
          Trigger: POST /routes/{id}/dispatch. Chain of depth >= 3 where each link is caused by the
          previous link, not by the original action:
            (1) Route PLANNED -> DISPATCHED causes (2) auto-transition Route DISPATCHED -> IN_PROGRESS
            which causes (3) Driver ON_DUTY -> ON_ROUTE AND every Parcel on that route
            ON_VEHICLE -> OUT_FOR_DELIVERY. Hop (2) is caused by hop (1)'s side_effects, not by the
            dispatch API call directly. Hop (3) is caused by hop (2)'s side_effects.
        test_recipe:
          setup:
            - "Create Driver D1 ON_DUTY"
            - "Create Route R1 PLANNED with 2 parcel stops in ON_VEHICLE"
          trigger:
            - "POST /routes/{R1.id}/dispatch"
          assert:
            - "Route(R1).status == IN_PROGRESS  # depth-2 hop"
            - "Driver(D1).status == ON_ROUTE  # depth-3 hop from IN_PROGRESS"
            - "All parcels on R1 status == OUT_FOR_DELIVERY"

      - name: reattempt_cascade_depth_2
        grounds:
          - state_machines.Parcel.EXCEPTION_to_SORTED
          - state_machines.Appointment.PENDING_to_SUPERSEDED
        distinguishing_aspect: |
          Trigger: POST /parcels/{id}/reattempt (different originating transition). Chain of depth
          >= 2: (1) Parcel EXCEPTION -> SORTED causes (2) any PENDING Appointment for that parcel
          to SUPERSEDED via system-issued auto-transition. The Appointment supersede is caused by
          the parcel re-entering SORTED, not by the dispatcher's reattempt call directly.
        test_recipe:
          setup:
            - "Induct Parcel P1, route, dispatch, attempt outcome=NO_ONE_HOME -> EXCEPTION"
            - "Customer files Appointment A1 for P1 with valid window -> A1.status=PENDING"
          trigger:
            - "POST /parcels/{P1.id}/reattempt"
          assert:
            - "Parcel(P1).status == SORTED  # depth-1 hop"
            - "Appointment(A1).status == SUPERSEDED  # depth-2 hop caused by P1 re-entering SORTED"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_attempt
        grounds:
          - validations[priority=5]
          - validations[priority=8]
        distinguishing_aspect: |
          Categories: state (priority 5) vs business_safety (priority 8). A driver attempts
          DRIVER_RELEASED on a parcel whose status is still SORTED (not yet OUT_FOR_DELIVERY) AND
          customer.driver_release_authorized=false. Both checks would fail. Priority pins ERR_INVALID_STATE
          (state) over ERR_DRIVER_RELEASE_NOT_AUTHORIZED (business_safety).
        test_recipe:
          setup:
            - "Induct Parcel P1 for Customer C1 with driver_release_authorized=false; do NOT sort or route"
            - "P1.status remains INDUCTED"
          trigger:
            - "POST /parcels/{P1.id}/attempts with outcome=DRIVER_RELEASED (also missing release_location, but that's a downstream check)"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE  # state check (priority 5) wins over business_safety (priority 8)"

      - name: business_safety_vs_business_referential_on_sort
        grounds:
          - validations[priority=6]
          - validations[priority=10]
        distinguishing_aspect: |
          Categories: business_safety (priority 6, hazmat hub certification) vs business_referential
          (priority 10, postal prefix routing). A hazmat parcel at a hub that is BOTH non-hazmat-certified
          AND does not service the destination postal prefix. Priority pins ERR_HAZMAT_HUB_NOT_CERTIFIED
          (safety) over ERR_HUB_NOT_SERVICING_POSTAL (referential).
        test_recipe:
          setup:
            - "Create TransitCenter H1 with hazmat_certified=false and serviced_postal_prefixes=[100]"
            - "Create Address A1 with postal_code=90210 (prefix 902, NOT serviced)"
            - "Induct Parcel P1: hazmat_class=CLASS_3, destination=A1, origin_center=H1"
            - "Walk P1 to IN_TRANSIT_HUB"
          trigger:
            - "POST /parcels/{P1.id}/sort"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_HAZMAT_HUB_NOT_CERTIFIED  # business_safety (6) wins over business_referential (10)"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: parcel_weight_upper_bound
        grounds:
          - validations[priority=18]
          - entities.Parcel.fields.weight_kg
          - errors[ERR_PARCEL_WEIGHT_OUT_OF_RANGE]
        distinguishing_aspect: |
          Numeric threshold on Parcel.weight_kg: 70.0 inclusive (accepted), 70.01 rejected.
          Reachable via POST /parcels. Distinct metric (weight) on distinct endpoint from the
          empty-collection edge below.
        test_recipe:
          setup:
            - "Create Customer + Address + TransitCenter; clock at T0"
          trigger:
            - "POST /parcels with weight_kg=70.0 -> expect 201"
            - "POST /parcels with weight_kg=70.01 -> expect 422"
          assert:
            - "First request returns 201 with Parcel.weight_kg == 70.0"
            - "Second request returns 422 with error_id == ERR_PARCEL_WEIGHT_OUT_OF_RANGE"

      - name: route_close_with_zero_stops_pending
        grounds:
          - validations[priority=5]
          - state_machines.Route.IN_PROGRESS_to_CLOSED
          - entities.Route.fields.stop_count
        distinguishing_aspect: |
          Empty-set boundary: a Route in IN_PROGRESS with zero remaining non-terminal stops (every
          stop already COMPLETED, FAILED, or SKIPPED) MUST close cleanly. Distinct endpoint
          (POST /routes/{id}/close) and distinct metric (collection size of non-terminal stops)
          from the numeric weight bound. The boundary is "all stops terminal" — exactly zero
          non-terminal stops.
        test_recipe:
          setup:
            - "Create Route R1 with 1 stop, dispatch, complete the only attempt successfully"
          trigger:
            - "POST /routes/{R1.id}/close"
          assert:
            - "response.status == 200"
            - "Route(R1).status == CLOSED  # empty set of non-terminal stops cleanly permits close"
            - "Driver.status == RETURNED  # cascaded side effect"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: route_dispatch_depends_on_driver_status
        grounds:
          - state_machines.Route.PLANNED_to_DISPATCHED
          - state_machines.Driver.OFF_DUTY_to_ON_DUTY
          - entities.Driver.fields.status
        distinguishing_aspect: |
          Entity pair (Route, Driver): Route.PLANNED -> DISPATCHED requires Driver.status == ON_DUTY.
          If the assigned Driver is still OFF_DUTY, dispatch is rejected. This crosses Route's
          state to Driver's state.
        test_recipe:
          setup:
            - "Create Driver D1 with status=OFF_DUTY (no check-in)"
            - "Create Route R1 driver_id=D1 with at least one stop"
          trigger:
            - "POST /routes/{R1.id}/dispatch"
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE  # Driver not ON_DUTY"
            - "Route(R1).status == PLANNED unchanged"

      - name: parcel_sort_depends_on_transit_center_certification
        grounds:
          - state_machines.Parcel.IN_TRANSIT_HUB_to_SORTED
          - entities.TransitCenter.fields.hazmat_certified
          - validations[priority=6]
        distinguishing_aspect: |
          Different entity pair (Parcel, TransitCenter): Parcel.IN_TRANSIT_HUB -> SORTED requires
          origin_center.hazmat_certified == true when parcel.hazmat_class != NONE. The dependency
          is on a configuration field of a different entity (TransitCenter) than the dependency in
          the first instance (Driver).
        test_recipe:
          setup:
            - "Create TransitCenter H1 with hazmat_certified=false, serviced_postal_prefixes covering destination"
            - "Induct Parcel P1 with hazmat_class=CLASS_3 at H1; walk to IN_TRANSIT_HUB"
          trigger:
            - "POST /parcels/{P1.id}/sort"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_HAZMAT_HUB_NOT_CERTIFIED"
            - "Parcel(P1).status == IN_TRANSIT_HUB unchanged"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: parcel_time_window_infeasibility_on_routestop
        grounds:
          - calculations.planned_arrival_assignment
          - entities.Parcel.fields.time_window_start
          - entities.Parcel.fields.time_window_end
          - entities.RouteStop.fields.planned_arrival
          - errors[ERR_TIME_WINDOW_INFEASIBLE]
        distinguishing_aspect: |
          Interval semantics: closed inclusive lower bound, exclusive upper bound check on
          planned_arrival vs parcel.time_window_end -- planned_arrival_assignment rejects when
          cursor > parcel.time_window_end (strict). The resource here is the route timeline; the
          overlap detected is between the cumulative cursor and the parcel's window upper edge.
          Different resource (route timeline) and different interval treatment (point-vs-interval
          upper-bound exceedance) than the appointment-vs-route-day overlap below.
        test_recipe:
          setup:
            - "Create Route R1 at H1 with planned_date=2026-05-20; depart hour 08:00 local"
            - "Stop 1: parcel Pa with time_window=[08:00, 09:00]; address very far so planned_arrival=09:30"
            - "Try to POST stop 1"
          trigger:
            - "POST /routes/{R1.id}/stops with parcel_id=Pa"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_TIME_WINDOW_INFEASIBLE  # strict > check on upper bound"

      - name: appointment_window_minimum_length
        grounds:
          - validations[priority=12]
          - entities.Appointment.fields.requested_window_start
          - entities.Appointment.fields.requested_window_end
          - errors[ERR_APPOINTMENT_WINDOW_INVALID]
        distinguishing_aspect: |
          Different resource (Appointment requested window) and different interval semantics:
          half-open length test where (end - start) >= MIN_APPT_WINDOW_HOURS (2h) is required.
          Length boundary is on duration of an interval, not on a single-point upper-bound check.
          Distinct entity from RouteStop's timeline and distinct semantic (interval-length
          arithmetic vs point-exceedance arithmetic).
        test_recipe:
          setup:
            - "Induct Parcel P1 in a non-terminal state"
          trigger:
            - "POST /appointments with parcel_id=P1, requested_window_start=T+5h, requested_window_end=T+6h59m (length 1h59m < 2h)"
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_APPOINTMENT_WINDOW_INVALID"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: route_cancel_restores_parcel_belt_state
        grounds:
          - state_machines.Route.PLANNED_to_CANCELLED
          - state_machines.Parcel.SORTED_to_ON_VEHICLE
          - entities.Parcel.fields.status
          - entities.Route.fields.stop_count
        distinguishing_aspect: |
          Conserved quantity (set-cardinality invariant):
            INV1 = count(Parcel where status==SORTED) + count(Parcel where status==ON_VEHICLE)
          When the forward action POST /routes/{id}/stops moves a parcel SORTED -> ON_VEHICLE and
          the compensating action POST /routes/{id}/cancel moves it ON_VEHICLE -> SORTED, INV1
          MUST equal its baseline. The invariant is over a CARDINALITY (count of parcels in a
          status set), not over a monetary quantity.
        test_recipe:
          setup:
            - "Create 3 Parcels in SORTED state at H1; baseline INV1 = SORTED_count + ON_VEHICLE_count"
            - "Record baseline_sorted = 3, baseline_on_vehicle = 0"
            - "Create Route R1 PLANNED; POST /routes/{R1.id}/stops three times to attach all 3 parcels"
          trigger:
            - "After all 3 stops added, observe Parcel statuses (all ON_VEHICLE)"
            - "POST /routes/{R1.id}/cancel"
            - "Observe Parcel statuses again"
          assert:
            - "After cancel: count(Parcel.status==SORTED) == 3 and count(Parcel.status==ON_VEHICLE) == 0"
            - "INV1 after cancel == INV1 baseline (3); no drift in either status set"
            - "Route(R1).stop_count == 0 and Route(R1).status == CANCELLED"

      - name: appointment_reattempt_keeps_active_appointment_count_pinned
        grounds:
          - state_machines.Appointment.PENDING_to_SUPERSEDED
          - state_machines.Parcel.EXCEPTION_to_SORTED
          - entities.Appointment.fields.status
        distinguishing_aspect: |
          Different conserved quantity: count of NON-PENDING Appointments per parcel after a
          reattempt cycle. The forward action POST /appointments (creating PENDING) plus the
          compensating action (reattempt auto-superseding PENDING) MUST leave
            INV2 = count(Appointment where status in {ACCEPTED, REJECTED, SUPERSEDED}, parcel_id=P)
          equal to its pre-cycle value plus exactly one (the just-superseded row), with zero
          PENDING rows remaining for that parcel. The invariant is over a multi-status SET COUNT,
          a different conserved quantity than INV1's binary partition above.
        test_recipe:
          setup:
            - "Induct Parcel P1, route, dispatch, attempt NO_ONE_HOME -> P1 in EXCEPTION"
            - "Record baseline: count(Appointment.status in {ACCEPTED,REJECTED,SUPERSEDED}, parcel=P1) = 0"
            - "POST /appointments parcel_id=P1, valid window -> Appointment A1 PENDING (no terminal yet)"
          trigger:
            - "POST /parcels/{P1.id}/reattempt"
          assert:
            - "Appointment(A1).status == SUPERSEDED"
            - "count(Appointment.status==PENDING, parcel=P1) == 0  # zero PENDING after compensation"
            - "count(Appointment.status in {ACCEPTED,REJECTED,SUPERSEDED}, parcel=P1) == 1  # baseline + 1 exactly, no drift"
