          trigger:
            - { call: "POST /bundles/${bd2}/items", payload: { item_id: "${it}" }, as: CatalogManager, captures: { err_id: "$.data.error_id" } }
            - { call: "DELETE /bundles/${bd1}/items/${it}", payload: {}, as: CatalogManager }
            - { call: "POST /bundles/${bd2}/items", payload: { item_id: "${it}" }, as: CatalogManager, captures: { fmv2: "$.data.bundle_fmv_cents" } }
          assert:
            - "second attach while bundled -> error_id == ERR_ITEM_ALREADY_BUNDLED"
            - "after detach: attach to bd2 succeeds, bd2.bundle_fmv_cents == 30000"

      - name: payment_on_paid_invoice_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.Invoice.payment_status"
          - "errors[ERR_INVOICE_NOT_PAYABLE]"
        distinguishing_aspect: "A fully PAID invoice accepts no further payments: ERR_INVOICE_NOT_PAYABLE (409), distinct from the overpayment fiscal check which only applies while payable."
