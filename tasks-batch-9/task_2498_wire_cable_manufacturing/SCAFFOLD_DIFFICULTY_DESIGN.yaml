        grounds:
          - validations.priority_80_ERR_CREDIT_LIMIT_EXCEEDED
          - calculations.customer_credit_exposure
          - endpoints.POST_/shipments
          - endpoints.PATCH_/customers/{id}
        depends_on: "Customer.status == ACTIVE and Customer.credit_exposure_usd + Reel.deposit_usd <= Customer.credit_limit_usd"
        distinguishing_aspect: |
          A third entity pair where the gating state is not an enum set by a
          workflow but a ledger-derived one: Customer.status is recomputed from
          credit_exposure_usd every time AR or the deposit balance moves, so the
          same PATCH /customers/{id} that lowers the limit flips the account into
          CREDIT_HOLD and blocks an otherwise perfect shipment. The instance walks
