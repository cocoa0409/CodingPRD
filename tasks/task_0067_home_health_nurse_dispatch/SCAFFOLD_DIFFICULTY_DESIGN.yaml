scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_pdgm_diverge_on_episode
        grounds:
          - calculations.provisional_pdgm_estimate
          - calculations.final_pdgm_settlement
          - entities.Episode.fields.provisional_payment
          - entities.Episode.fields.final_payment
          - state_machines.Episode.ACTIVE_to_DISCHARGED
        distinguishing_aspect: |
          For one Episode whose plan orders 6 visits (>= lupa_threshold 5) the forward-looking
          provisional_payment is FULL PDGM 4452.00, but only 3 visits are COMPLETED so the
          chronological final_payment is LUPA 495.00 — same episode, two algorithms, different numbers.
        test_recipe:
          setup:
            - "Clock at 2026-02-01. WOUND PdgmRateConfig active: base 2000, fw_high 1.05, lupa_threshold 5."
            - "Patient with home coords; one HIGH/WOUND SOC OASIS with comorbidity_count 2."
            - "Episode ACTIVE, cert_start 2026-02-01, with an ACTIVE plan ordering 6 RN visits (provisional 4452.00)."
            - "3 of the scheduled RN visits are CONFIRMED then COMPLETED; the rest are CANCELLED, so n_completed=3 < 5."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN One", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat A", medicare_id: "MED-A-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ep_v: $.data.version }
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 6, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 0, expected_episode_version: "${ep_v}" }
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/visits"
              payload: { clinician_id: "${rn_id}", discipline: "RN", scheduled_start: "2026-02-03T09:00:00Z", scheduled_end: "2026-02-03T10:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /episodes/${ep_id}/visits"
              payload: { clinician_id: "${rn_id}", discipline: "RN", scheduled_start: "2026-02-04T09:00:00Z", scheduled_end: "2026-02-04T10:00:00Z" }
              as: Scheduler
              captures: { v2: $.data.id }
            - call: "POST /episodes/${ep_id}/visits"
              payload: { clinician_id: "${rn_id}", discipline: "RN", scheduled_start: "2026-02-05T09:00:00Z", scheduled_end: "2026-02-05T10:00:00Z" }
              as: Scheduler
              captures: { v3: $.data.id }
            - call: "POST /visits/${v1}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /visits/${v2}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /visits/${v3}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-06T08:00:00Z" }
              as: BillingManager
            - call: "POST /visits/${v1}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /visits/${v2}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /visits/${v3}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
          trigger:
            - call: "POST /episodes/${ep_id}/finalize"
              payload: {}
              as: BillingManager
              captures: { final_pay: $.data.final_payment, prov_pay: $.data.provisional_payment }
          assert:
            - "Episode.${ep_id}.provisional_payment == 4452.00"
            - "Episode.${ep_id}.final_payment == 495.00"
            - "Episode.${ep_id}.status == DISCHARGED"

      - name: mileage_reimbursement_vs_companion_offset_distinct_domains
        grounds:
          - calculations.mileage_reimbursement_tiered
          - calculations.companion_cost_offset
          - entities.MileageClaim.fields.reimbursement
          - entities.Episode.fields.companion_hours_used
        distinguishing_aspect: |
          The MileageClaim domain computes a tiered straight-line reimbursement (10.05 for a 20-mile claim),
          while the CompanionShift domain computes a per-shift-rounded hourly offset (24.04 for two 0.5h shifts);
          the two dual computations live on different entities and produce unrelated dollar figures.
        test_recipe:
          setup:
            - "Clock at 2026-02-01. WOUND config active (lupa_threshold 5)."
            - "Patient home (40.0,-75.2); RN clinician base (40.0,-75.0); HHA clinician for companion."
            - "Episode ACTIVE with plan authorizing 2 companion hours."
            - "One RN visit COMPLETED with a mileage claim for 20 miles (computed round-trip ~21.16)."
            - "Two 0.5h companion shifts DELIVERED (companion offset 24.04)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN One", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "HHA One", discipline: "HHA", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { hha_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat B", medicare_id: "MED-B-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ep_v: $.data.version }
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 1, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 2, expected_episode_version: "${ep_v}" }
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/visits"
              payload: { clinician_id: "${rn_id}", discipline: "RN", scheduled_start: "2026-02-03T09:00:00Z", scheduled_end: "2026-02-03T10:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-03T11:00:00Z" }
              as: BillingManager
            - call: "POST /visits/${v1}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /visits/${v1}/mileage-claims"
              payload: { claimed_miles: 20.0 }
              as: Scheduler
              captures: { mc_id: $.data.id }
            - call: "POST /episodes/${ep_id}/companion-shifts"
              payload: { clinician_id: "${hha_id}", shift_start: "2026-02-03T13:00:00Z", shift_end: "2026-02-03T13:30:00Z" }
              as: Scheduler
              captures: { cs1: $.data.id }
            - call: "POST /episodes/${ep_id}/companion-shifts"
              payload: { clinician_id: "${hha_id}", shift_start: "2026-02-03T14:00:00Z", shift_end: "2026-02-03T14:30:00Z" }
              as: Scheduler
              captures: { cs2: $.data.id }
            - call: "POST /companion-shifts/${cs1}/deliver"
              payload: {}
              as: Scheduler
            - call: "POST /companion-shifts/${cs2}/deliver"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /mileage-claims/${mc_id}/approve"
              payload: {}
              as: BillingManager
              captures: { reimb: $.data.reimbursement }
          assert:
            - "MileageClaim.${mc_id}.reimbursement == 10.05"
            - "MileageClaim.${mc_id}.status == APPROVED"
            - "Episode.${ep_id}.total_mileage_reimbursed == 10.05"
            - "Episode.${ep_id}.companion_hours_used == 1.0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: mileage_tiered_min_cap_free_tier_mode_a
        grounds:
          - calculations.mileage_reimbursement_tiered
          - entities.MileageClaim.fields.reimbursable_miles
          - entities.MileageClaim.fields.reimbursement
        distinguishing_aspect: |
          Mode (a): reimbursement nests min(claimed, computed*1.10), a free-tier subtraction, and a two-tier
          marginal-rate selection — >=3 interacting inputs producing 10.05 for a 20-mile claim against a 21.16-mile computed trip.
        test_recipe:
          setup:
            - "Clock 2026-02-01; WOUND config active."
            - "RN base (40.0,-75.0); patient home (40.0,-75.2) -> computed round-trip ~21.16, cap*1.10=23.28."
            - "Episode ACTIVE; one RN visit COMPLETED; mileage claim for 20 miles (under cap, billable=15 all in tier1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN One", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat C", medicare_id: "MED-C-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ep_v: $.data.version }
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 1, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 0, expected_episode_version: "${ep_v}" }
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/visits"
              payload: { clinician_id: "${rn_id}", discipline: "RN", scheduled_start: "2026-02-03T09:00:00Z", scheduled_end: "2026-02-03T10:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-03T11:00:00Z" }
              as: BillingManager
            - call: "POST /visits/${v1}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /visits/${v1}/mileage-claims"
              payload: { claimed_miles: 20.0 }
              as: Scheduler
              captures: { mc_id: $.data.id }
          trigger:
            - call: "POST /mileage-claims/${mc_id}/approve"
              payload: {}
              as: BillingManager
              captures: { reimb: $.data.reimbursement, rm: $.data.reimbursable_miles }
          assert:
            - "MileageClaim.${mc_id}.reimbursable_miles == 15.0"
            - "MileageClaim.${mc_id}.reimbursement == 10.05"

      - name: companion_offset_round_per_shift_then_sum_mode_b
        grounds:
          - calculations.companion_cost_offset
          - entities.CompanionShift.fields.hours
          - state_machines.CompanionShift.BOOKED_to_DELIVERED
        distinguishing_aspect: |
          Mode (b): two 0.5h shifts at $24.05/h. Round-per-shift-then-sum gives 12.03+12.03=24.06;
          sum-hours-then-multiply gives round(1.0*24.05)=24.05. The scaffold pins per-shift rounding so the offset is 24.06.
        test_recipe:
          setup:
            - "Clock 2026-02-01; WOUND config active (lupa_threshold 1 so a single RN visit yields FULL PDGM)."
            - "HHA clinician; Episode ACTIVE with plan authorizing 2 companion hours; 1 RN visit COMPLETED."
            - "Two 0.5h companion shifts DELIVERED (per-shift offset 12.03 each -> 24.06)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "MMTA_OTHER", base_30day_rate: 1500.00, functional_weight_low: 1.00, functional_weight_medium: 1.00, functional_weight_high: 1.00, lupa_threshold: 1, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN Two", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /clinicians"
              payload: { full_name: "HHA Two", discipline: "HHA", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { hha_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat D", medicare_id: "MED-D-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "MMTA_OTHER", functional_level: "LOW", comorbidity_count: 0 }
              as: IntakeCoordinator
              captures: { oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${oasis_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ep_v: $.data.version }
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 1, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 2, expected_episode_version: "${ep_v}" }
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/visits"
              payload: { clinician_id: "${rn_id}", discipline: "RN", scheduled_start: "2026-02-03T09:00:00Z", scheduled_end: "2026-02-03T10:00:00Z" }
              as: Scheduler
              captures: { v1: $.data.id }
            - call: "POST /visits/${v1}/confirm"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-03T11:00:00Z" }
              as: BillingManager
            - call: "POST /visits/${v1}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${rn_id}"
            - call: "POST /episodes/${ep_id}/companion-shifts"
              payload: { clinician_id: "${hha_id}", shift_start: "2026-02-03T13:00:00Z", shift_end: "2026-02-03T13:30:00Z" }
              as: Scheduler
              captures: { cs1: $.data.id }
            - call: "POST /episodes/${ep_id}/companion-shifts"
              payload: { clinician_id: "${hha_id}", shift_start: "2026-02-03T14:00:00Z", shift_end: "2026-02-03T14:30:00Z" }
              as: Scheduler
              captures: { cs2: $.data.id }
            - call: "POST /companion-shifts/${cs1}/deliver"
              payload: {}
              as: Scheduler
            - call: "POST /companion-shifts/${cs2}/deliver"
              payload: {}
              as: Scheduler
          trigger:
            - call: "POST /episodes/${ep_id}/finalize"
              payload: {}
              as: BillingManager
              captures: { fin: $.data.final_payment }
          assert:
            - "PaymentLedger row for Episode.${ep_id} has companion_offset == 24.06"
            - "Episode.${ep_id}.final_payment == 3024.06"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: recert_request_revision_cycle
        grounds:
          - state_machines.RecertRequest.SUBMITTED_to_RETURNED
          - state_machines.RecertRequest.RETURNED_to_SUBMITTED
          - entities.RecertRequest.fields.revision_count
        distinguishing_aspect: |
          RecertRequest cycles SUBMITTED -> RETURNED -> SUBMITTED (a true revision loop), incrementing
          revision_count on each resubmit — a cyclic shape, not a linear pipeline.
        test_recipe:
          setup:
            - "Clock at 2026-03-25 (within 14 days of cert_end 2026-04-01 for a 2026-02-01 SOC episode)."
            - "Episode ACTIVE; a RECERTIFICATION OASIS recorded; a RecertRequest SUBMITTED (episode RECERT_PENDING)."
            - "ComplianceOfficer RETURNs the request; IntakeCoordinator resubmits it once."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
              payload: { clinical_group: "WOUND", base_30day_rate: 2000.00, functional_weight_low: 0.95, functional_weight_medium: 1.00, functional_weight_high: 1.05, lupa_threshold: 5, active: true }
              as: BillingManager
            - call: "POST /clinicians"
              payload: { full_name: "RN R", discipline: "RN", license_active: true, base_lat: 40.0, base_lon: -75.0, weekly_visit_cap: 40 }
              as: Scheduler
              captures: { rn_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat E", medicare_id: "MED-E-1", home_zip: "19100", home_lat: 40.0, home_lon: -75.2 }
              as: IntakeCoordinator
              captures: { pat_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "START_OF_CARE", assessment_date: "2026-02-01T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { soc_id: $.data.id }
            - call: "POST /oasis-assessments"
              payload: { patient_id: "${pat_id}", clinician_id: "${rn_id}", assessment_type: "RECERTIFICATION", assessment_date: "2026-03-25T08:00:00Z", clinical_group: "WOUND", functional_level: "HIGH", comorbidity_count: 2 }
              as: IntakeCoordinator
              captures: { recert_oasis_id: $.data.id }
            - call: "POST /episodes"
              payload: { patient_id: "${pat_id}", soc_oasis_id: "${soc_id}" }
              as: IntakeCoordinator
              captures: { ep_id: $.data.id, ep_v: $.data.version }
            - call: "POST /episodes/${ep_id}/plans-of-care"
              payload: { planned_rn_visits: 6, planned_pt_visits: 0, planned_ot_visits: 0, planned_slp_visits: 0, companion_hours_authorized: 0, expected_episode_version: "${ep_v}" }
              as: IntakeCoordinator
            - call: "POST /episodes/${ep_id}/activate"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-03-25T08:00:00Z" }
              as: BillingManager
            - call: "POST /episodes/${ep_id}/recert-requests"
              payload: { recert_oasis_id: "${recert_oasis_id}" }
              as: IntakeCoordinator
              captures: { rr_id: $.data.id }
            - call: "POST /recert-requests/${rr_id}/return"
              payload: { review_note: "Need updated wound measurements" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /recert-requests/${rr_id}/resubmit"
              payload: {}
              as: IntakeCoordinator
              captures: { rc: $.data.revision_count, st: $.data.status }
          assert:
            - "RecertRequest.${rr_id}.status == SUBMITTED"
            - "RecertRequest.${rr_id}.revision_count == 1"

      - name: visit_fork_join_completed_vs_missed
        grounds:
          - state_machines.Visit.CONFIRMED_to_COMPLETED
          - state_machines.Visit.CONFIRMED_to_MISSED
          - entities.Visit.fields.billable
        distinguishing_aspect: |
          Visit branches CONFIRMED -> {COMPLETED, MISSED} with divergent side-effect sets: COMPLETED sets
