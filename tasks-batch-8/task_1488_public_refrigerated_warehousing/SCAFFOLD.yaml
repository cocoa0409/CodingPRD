  # --- inbound receipts ---
  - method: POST
    path: "/api/inbound-receipts"
    description: "Schedule an inbound receipt with arrival window and pre-assigned zone"
    roles: [CustomerAdmin]
    code: 201
    input: [customer_id, zone_id, product_code, lot_code, production_date, temp_class, expected_pallets, window_start, window_end]
    output: InboundReceipt
    side_effects:
      - "customer must be ACTIVE (ERR_CUSTOMER_SUSPENDED)"
      - "temp_class must equal zone.temp_class (ERR_TEMP_CLASS_MISMATCH)"
      - "dock-door aggregate overlap check: count of receipts for same zone with status in {SCHEDULED, ARRIVED} whose [window_start, window_end) strictly overlaps the new window must be < zone.dock_doors (ERR_DOCK_CAPACITY_EXCEEDED); adjacency (end == start) does NOT overlap"
  - method: GET
    path: "/api/inbound-receipts/{id}"
    description: "Get receipt"
    roles: [CustomerAdmin, WarehouseOperator, QualityManager, ClaimsAdjuster, BillingAdmin]
    code: 200
    input: []
    output: InboundReceipt
    side_effects: []
  - method: GET
    path: "/api/inbound-receipts"
    description: "List receipts (filtered)"
    roles: [CustomerAdmin, WarehouseOperator, QualityManager, ClaimsAdjuster, BillingAdmin]
    code: 200
    input: ["customer_id?", "zone_id?", "lot_id?", "status?", "limit?", "offset?"]
    output: InboundReceipt[]
    side_effects: []
  - method: POST
    path: "/api/inbound-receipts/{id}/arrive"
    description: "Mark truck arrived; reserves zone capacity"
    roles: [WarehouseOperator]
    code: 200
    input: []
    output: InboundReceipt
    side_effects: ["zone.reserved_pallets += expected_pallets; posture recomputed; FULL posture -> ERR_ZONE_FULL"]
  - method: POST
    path: "/api/inbound-receipts/{id}/complete"
    description: "Complete putaway: releases reservation, creates pallets, charges handling-in"
    roles: [WarehouseOperator]
    code: 200
    input: [actual_pallets]
    output: InboundReceipt
    side_effects:
      - "zone.reserved_pallets -= expected_pallets (released before capacity check)"
      - "require actual_pallets <= capacity - in_use - reserved (ERR_ZONE_CAPACITY_EXCEEDED)"
      - "lot upsert; production-date continuity check (ERR_LOT_PRODUCTION_DATE_MISMATCH)"
      - "actual_pallets Pallets created (STORED/OK, received_at=now)"
      - "zone.in_use_pallets += actual_pallets; posture recomputed"
      - "OPEN invoice.handling_in_cents += actual_pallets * handling_in rate"
  - method: POST
    path: "/api/inbound-receipts/{id}/cancel"
    description: "Cancel a scheduled (not yet arrived) receipt"
    roles: [CustomerAdmin, WarehouseOperator]
    code: 200
    input: []
    output: InboundReceipt
    side_effects: []

