              as: DealerAdmin
            - call: "POST /service-locations/${loc_id}/retread-lines"
              payload: { line_code: "L1", cure_cooldown_minutes: 30 }
              as: DealerAdmin
              captures: { line_id: $.data.id }
            - call: "POST /casings"
              payload: { fleet_account_id: "${fleet_id}", casing_serial: "CS-3001", brand: "Bridgestone", casing_spec_code: "ANY", intended_position: "DRIVE", scrap_weight_lbs: 125 }
              as: DealerAdmin
              captures: { casing_id: $.data.id }
            - call: "POST /casings/${casing_id}/collect"
              payload: { collected_at_location_id: "${loc_id}" }
              as: TireTechnician
              captures: { casing_v: $.data.version }
            - call: "POST /casings/${casing_id}/inspect"
              payload: { grade: "A", expected_casing_version: "${casing_v}" }
              as: CasingInspector
              as_user_id: "inspector-1"
            - call: "POST /retread-jobs"
              payload: { casing_id: "${casing_id}", retread_line_id: "${line_id}", tread_design_code: "TD-1", scheduled_start_at: "2026-09-01T08:00:00Z", scheduled_end_at: "2026-09-01T12:00:00Z" }
              as: PlantScheduler
              captures: { job1_id: $.data.id }
          trigger:
            - call: "POST /retread-jobs/${job1_id}/cancel"
              payload: { reason: "Fleet withdrew the casing from the retread program" }
              as: PlantScheduler
            - call: "POST /retread-jobs"
