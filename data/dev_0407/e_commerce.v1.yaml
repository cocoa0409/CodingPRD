# =============================================================================
# E-Commerce Marketplace Benchmark Seed Tables (v1)
#
# A complex e-commerce marketplace system with promotional pricing,
# inventory reservation, parallel order state machines, and seller settlement.
# =============================================================================

scenario: |
  E-commerce marketplace platform. Manages the full order lifecycle across
  multiple seller shops: product catalog with inventory reservation, promotional
  discount stacking (percentage-first vs fixed-first yield different totals),
  parallel payment and fulfillment tracking on orders, partial refund with
  proportional discount distribution, and seller settlement with tiered
  commission rates based on cumulative monthly GMV. Roles: Customer places
  orders, Seller manages shop/products/promotions and fulfills orders,
  PlatformAdmin handles disputes and settlement approvals.

domain_name: e-commerce-marketplace
api_prefix: /shops

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  # hybrid: Shop → Product/Promotion is hierarchical; Order is top-level
  # with cross-aggregate references to Shop and Product

  state_machine_shape: parallel
  # parallel: Order has independent payment_status × fulfillment_status axes
  # plus compound order_status derived from both

  relationship_patterns:
    - one_to_many       # Shop has many Products, Order has many OrderItems
    - many_to_many      # Promotion applies to many Products via category match
    - cross_aggregate   # OrderItem references Product across aggregate boundary

  role_model: hierarchical_override
  # Customer < Seller < PlatformAdmin
  # Each level can do everything below + more

  consistency_model: saga
  # Order placement = reserve inventory → create order items → apply promotions
  # Compensation on failure: release reserved inventory

# =============================================================================
# Table 1: Entity-Relationship Table (8 entities)
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: shop_name, type: string, source: input, description: "Shop display name" }
      - { name: owner_id, type: string, source: input, description: "Seller user ID who owns this shop" }
      - { name: description, type: string, source: input, required: false, description: "Shop description" }
      - { name: discount_strategy, type: enum, source: input, default: "PERCENTAGE_FIRST", description: "PERCENTAGE_FIRST | FIXED_FIRST — determines promotional stacking order at checkout" }
      - { name: monthly_gmv, type: number, source: computed, description: "Cumulative gross merchandise value for current calendar month, resets on 1st of each month" }
      - { name: settlement_balance, type: number, source: computed, description: "Unsettled earnings (order revenue minus commission), increases on order completion, decreases on settlement" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW → ACTIVE → SUSPENDED → CLOSED" }

  - name: Product
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "Owning shop ID" }
      - { name: product_name, type: string, source: input, description: "Product display name" }
      - { name: category, type: string, source: input, description: "Product category (used for promotion matching)" }
      - { name: base_price, type: number, source: input, description: "Unit price before discounts, must be > 0" }
      - { name: inventory_count, type: integer, source: input, description: "Total inventory units (can be updated by seller)" }
      - { name: reserved_count, type: integer, source: computed, description: "Units reserved by unpaid orders, initial = 0" }
      - { name: available_count, type: integer, source: computed, description: "= inventory_count - reserved_count, must be >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT → LISTED → DELISTED → ARCHIVED" }

  - name: Promotion
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "Owning shop ID" }
      - { name: promo_name, type: string, source: input, description: "Promotion display name" }
      - { name: promo_type, type: enum, source: input, description: "PERCENTAGE | FIXED_AMOUNT | BUY_X_GET_Y_FREE" }
      - { name: promo_value, type: number, source: input, description: "Discount value: percentage (0-100) for PERCENTAGE, fixed amount for FIXED_AMOUNT, Y for BUY_X_GET_Y_FREE" }
      - { name: promo_threshold, type: integer, source: input, default: 0, description: "Min quantity (X for BUY_X_GET_Y_FREE) or min order subtotal for activation" }
      - { name: max_discount_cap, type: number, source: input, required: false, description: "Maximum discount amount (caps PERCENTAGE type), null = no cap" }
      - { name: stackable, type: boolean, source: input, default: false, description: "Whether this promotion can stack with other promotions" }
      - { name: priority, type: integer, source: input, description: "Application order when stacking (lower = applied first), must be unique within shop's active promotions" }
      - { name: applicable_categories, type: array, source: input, description: "Product categories this promotion applies to; empty array = all categories" }
      - { name: start_time, type: datetime, source: input, description: "Promotion start time (inclusive)" }
      - { name: end_time, type: datetime, source: input, description: "Promotion end time (exclusive)" }
      - { name: usage_count, type: integer, source: computed, description: "Number of orders that have used this promotion" }
      - { name: max_usage, type: integer, source: input, required: false, description: "Maximum number of times this promotion can be used, null = unlimited" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → PAUSED → EXPIRED → CANCELLED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: input, description: "Shop this order is placed with (cross-aggregate reference)" }
      - { name: customer_id, type: string, source: system, description: "Customer user ID from X-User-ID header" }
      - { name: shipping_address, type: string, source: input, description: "Delivery address" }
      - { name: subtotal, type: number, source: computed, description: "Sum of all order items' line_total (before discounts)" }
      - { name: discount_amount, type: number, source: computed, description: "Total discount applied via promotions" }
      - { name: total_amount, type: number, source: computed, description: "= subtotal - discount_amount, floor at 0.01" }
      - { name: applied_promotions, type: array, source: computed, description: "List of {promotion_id, promo_type, discount_contribution} applied to this order" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID → PAYING → PAID → PARTIAL_REFUND → FULL_REFUND" }
      - { name: fulfillment_status, type: enum, source: system, description: "PENDING → PROCESSING → SHIPPED → DELIVERED" }
      - { name: order_status, type: enum, source: computed, description: "CREATED → CONFIRMED → COMPLETED → CANCELLED — derived from payment_status + fulfillment_status" }
      - { name: reservation_expires_at, type: datetime, source: computed, description: "Inventory reservation expiry time = created_at + RESERVATION_TIMEOUT" }
      - { name: commission_rate, type: number, source: computed, description: "Effective commission rate at time of completion, based on shop's cumulative monthly GMV tier" }
      - { name: commission_amount, type: number, source: computed, description: "= total_amount * commission_rate, calculated at order completion" }

  - name: OrderItem
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "Parent order ID" }
      - { name: product_id, type: string, source: input, description: "Referenced product ID (cross-aggregate)" }
      - { name: product_snapshot, type: object, source: computed, description: "Snapshot of product_name, base_price, category at order time" }
      - { name: quantity, type: integer, source: input, description: "Number of units ordered, must be >= 1" }
      - { name: unit_price, type: number, source: computed, description: "= product.base_price at order creation time" }
      - { name: line_total, type: number, source: computed, description: "= unit_price * quantity" }
      - { name: discount_share, type: number, source: computed, description: "Proportional share of order discount allocated to this item" }
      - { name: final_price, type: number, source: computed, description: "= line_total - discount_share" }

  - name: Payment
    parent: Order
    common_fields: false  # append-only event log: id + created_at only
    fields:
      - { name: order_id, type: string, source: system, description: "Parent order ID" }
      - { name: payment_method, type: enum, source: input, description: "CREDIT_CARD | DEBIT_CARD | WALLET | BANK_TRANSFER" }
      - { name: amount, type: number, source: computed, description: "= order.total_amount" }
      - { name: transaction_ref, type: string, source: input, description: "External payment gateway reference" }
      - { name: payment_type, type: enum, source: system, description: "CHARGE | REFUND — indicates direction of money flow" }
      - { name: status, type: enum, source: system, description: "PENDING → SUCCESS | FAILED" }

  - name: Refund
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "Parent order ID" }
      - { name: reason, type: string, source: input, description: "Refund reason" }
      - { name: refund_type, type: enum, source: input, description: "FULL | PARTIAL" }
      - { name: refund_items, type: array, source: input, description: "For PARTIAL: list of {order_item_id, quantity} to refund" }
      - { name: refund_subtotal, type: number, source: computed, description: "Sum of refunded items' proportional value (before discount redistribution)" }
      - { name: refund_discount_share, type: number, source: computed, description: "Proportional discount that was applied to refunded items" }
      - { name: refund_amount, type: number, source: computed, description: "Actual refund = refund_subtotal - refund_discount_share" }
      - { name: inventory_restored, type: boolean, source: computed, description: "Whether inventory was restored for refunded items" }
      - { name: status, type: enum, source: system, description: "REQUESTED → APPROVED → PROCESSED → REJECTED" }

  - name: Settlement
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "Shop being settled" }
      - { name: period_start, type: datetime, source: input, description: "Settlement period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Settlement period end (exclusive)" }
      - { name: gross_amount, type: number, source: computed, description: "Total order revenue in period" }
      - { name: total_commission, type: number, source: computed, description: "Sum of commissions deducted" }
      - { name: total_refunds, type: number, source: computed, description: "Sum of refunds processed in period" }
      - { name: net_amount, type: number, source: computed, description: "= gross_amount - total_commission - total_refunds" }
      - { name: status, type: enum, source: system, description: "DRAFT → PENDING_APPROVAL → APPROVED → PAID → DISPUTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Shop
    initial_state: PENDING_REVIEW
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: POST /shops/{shopId}/approve
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "monthly_gmv initialized to 0"
          - "settlement_balance initialized to 0"

      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /shops/{shopId}/suspend
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "All LISTED products → DELISTED"
          - "All ACTIVE promotions → PAUSED"
        note: "Suspended shops cannot receive new orders but existing orders continue processing"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /shops/{shopId}/reinstate
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
        note: "Products and promotions remain DELISTED/PAUSED — seller must manually re-list"

      - from: ACTIVE
        to: CLOSED
        trigger: POST /shops/{shopId}/close
        actor: PlatformAdmin
        preconditions:
          - "No orders in non-terminal states (CREATED or CONFIRMED)"
          - "settlement_balance must be 0 (all earnings settled)"
        side_effects:
          - "All LISTED products → ARCHIVED"
          - "All ACTIVE/PAUSED promotions → CANCELLED"

      - from: SUSPENDED
        to: CLOSED
        trigger: POST /shops/{shopId}/close
        actor: PlatformAdmin
        preconditions:
          - "No orders in non-terminal states"
          - "settlement_balance must be 0"
        side_effects:
          - "All non-ARCHIVED products → ARCHIVED"
          - "All non-terminal promotions → CANCELLED"

  - entity: Product
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: LISTED
        trigger: POST /shops/{shopId}/products/{productId}/list
        actor: Seller
        preconditions:
          - "Shop must be ACTIVE"
          - "base_price must be > 0"
          - "inventory_count must be >= 0"
        side_effects: []

      - from: LISTED
        to: DELISTED
        trigger: POST /shops/{shopId}/products/{productId}/delist
        actor: Seller
        preconditions: []
        side_effects: []
        note: "Existing orders with reserved inventory are unaffected"

      - from: DELISTED
        to: LISTED
        trigger: POST /shops/{shopId}/products/{productId}/list
        actor: Seller
        preconditions:
          - "Shop must be ACTIVE"
        side_effects: []

      - from: LISTED
        to: ARCHIVED
        trigger: "system (cascade from shop close/suspension) or POST .../archive"
        actor: Seller | system
        preconditions:
          - "reserved_count must be 0 (no pending reservations)"
        side_effects: []

      - from: DELISTED
        to: ARCHIVED
        trigger: "system (cascade from shop close) or POST .../archive"
        actor: Seller | system
        preconditions:
          - "reserved_count must be 0"
        side_effects: []

  - entity: Promotion
    initial_state: DRAFT
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /shops/{shopId}/promotions/{promotionId}/activate
        actor: Seller
        preconditions:
          - "Shop must be ACTIVE"
          - "end_time must be in the future"
          - "priority must be unique among shop's ACTIVE promotions"
        side_effects: []

      - from: ACTIVE
        to: PAUSED
        trigger: POST /shops/{shopId}/promotions/{promotionId}/pause
        actor: Seller
        preconditions: []
        side_effects: []

      - from: PAUSED
        to: ACTIVE
        trigger: POST /shops/{shopId}/promotions/{promotionId}/activate
        actor: Seller
        preconditions:
          - "Shop must be ACTIVE"
          - "end_time must be in the future"
          - "priority must be unique among shop's ACTIVE promotions"
        side_effects: []

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when current_time >= end_time)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CANCELLED
        trigger: POST /shops/{shopId}/promotions/{promotionId}/cancel
        actor: Seller
        preconditions: []
        side_effects: []
        note: "Already-placed orders that used this promotion are unaffected"

      - from: PAUSED
        to: CANCELLED
        trigger: POST /shops/{shopId}/promotions/{promotionId}/cancel
        actor: Seller
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: POST /shops/{shopId}/promotions/{promotionId}/cancel
        actor: Seller
        preconditions: []
        side_effects: []

  - entity: Order
    note: "Order has TWO independent state dimensions (payment_status, fulfillment_status) plus a derived order_status"
    dimensions:
      - dimension: payment_status
        initial_state: UNPAID
        terminal_states: [FULL_REFUND]
        transitions:
          - from: UNPAID
            to: PAYING
            trigger: POST /orders/{orderId}/pay
            actor: Customer
            preconditions:
              - "reservation_expires_at must not have passed"
            side_effects: []

          - from: PAYING
            to: PAID
            trigger: POST /orders/{orderId}/confirm-payment
            actor: system
            preconditions:
              - "Payment record with status SUCCESS must exist"
            side_effects:
              - "Convert reserved inventory to committed (reserved_count decremented for each product)"
              - "Promotion usage_count incremented for each applied promotion"

          - from: PAYING
            to: UNPAID
            trigger: POST /orders/{orderId}/payment-failed
            actor: system
            preconditions:
              - "Payment record with status FAILED must exist"
            side_effects: []
            note: "Customer can retry payment if reservation hasn't expired"

          - from: PAID
            to: PARTIAL_REFUND
            trigger: "system (automatic when a PARTIAL refund is PROCESSED)"
            actor: system
            preconditions: []
            side_effects: []

          - from: PAID
            to: FULL_REFUND
            trigger: "system (automatic when a FULL refund is PROCESSED)"
            actor: system
            preconditions: []
            side_effects:
              - "Restore inventory for all order items"
              - "Reverse commission: settlement_balance -= (total_amount - commission_amount)"
              - "Reverse monthly_gmv -= total_amount"

          - from: PARTIAL_REFUND
            to: FULL_REFUND
            trigger: "system (automatic when cumulative refunds equal total_amount)"
            actor: system
            preconditions: []
            side_effects:
              - "Same as PAID → FULL_REFUND"

      - dimension: fulfillment_status
        initial_state: PENDING
        terminal_states: [DELIVERED]
        transitions:
          - from: PENDING
            to: PROCESSING
            trigger: POST /orders/{orderId}/start-processing
            actor: Seller
            preconditions:
              - "payment_status must be PAID or PARTIAL_REFUND"
            side_effects: []

          - from: PROCESSING
            to: SHIPPED
            trigger: POST /orders/{orderId}/ship
            actor: Seller
            preconditions: []
            side_effects: []

          - from: SHIPPED
            to: DELIVERED
            trigger: POST /orders/{orderId}/deliver
            actor: Seller
            preconditions: []
            side_effects:
              - "Calculate commission_rate and commission_amount based on shop's current monthly_gmv tier"
              - "shop.monthly_gmv += order.total_amount"
              - "shop.settlement_balance += (order.total_amount - order.commission_amount)"
              - "order_status → COMPLETED"

    derived_order_status:
      rule: |
        CANCELLED: reservation expired while UNPAID, or explicitly cancelled while UNPAID
        CREATED: payment_status is UNPAID or PAYING
        CONFIRMED: payment_status is PAID and fulfillment_status is PENDING or PROCESSING or SHIPPED
        COMPLETED: fulfillment_status is DELIVERED and payment_status is PAID/PARTIAL_REFUND/FULL_REFUND
        CANCELLED cannot transition to any other state.
      transitions:
        - from: CREATED
          to: CANCELLED
          trigger: "POST /orders/{orderId}/cancel OR system (reservation timeout)"
          actor: Customer | system
          preconditions:
            - "payment_status must be UNPAID"
          side_effects:
            - "Release all reserved inventory (product.reserved_count decremented per item)"

  - entity: Payment
    initial_state: PENDING
    terminal_states: [SUCCESS, FAILED]
    transitions:
      - from: PENDING
        to: SUCCESS
        trigger: POST /orders/{orderId}/confirm-payment
        actor: system
        preconditions: []
        side_effects:
          - "Order.payment_status → PAID"

      - from: PENDING
        to: FAILED
        trigger: POST /orders/{orderId}/payment-failed
        actor: system
        preconditions: []
        side_effects:
          - "Order.payment_status → UNPAID"

  - entity: Refund
    initial_state: REQUESTED
    terminal_states: [PROCESSED, REJECTED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: POST /orders/{orderId}/refunds/{refundId}/approve
        actor: Seller
        preconditions:
          - "Order.payment_status must be PAID or PARTIAL_REFUND"
          - "Refund items quantity must not exceed remaining (original - already refunded) per item"
        side_effects: []

      - from: REQUESTED
        to: REJECTED
        trigger: POST /orders/{orderId}/refunds/{refundId}/reject
        actor: Seller
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: PROCESSED
        trigger: POST /orders/{orderId}/refunds/{refundId}/process
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Create Payment record with payment_type=REFUND"
          - "Update refund_amount based on proportional discount allocation"
          - "If refund_type=FULL: order.payment_status → FULL_REFUND"
          - "If refund_type=PARTIAL: order.payment_status → PARTIAL_REFUND (or FULL_REFUND if cumulative refunds = total_amount)"
          - "Restore inventory for refunded items (product.inventory_count += refund quantity)"
          - "inventory_restored = true"
          - "Reverse proportional commission from settlement_balance"
          - "Reverse proportional amount from monthly_gmv"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID, DISPUTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: POST /shops/{shopId}/settlements/{settlementId}/submit
        actor: Seller
        preconditions:
          - "net_amount must be > 0"
        side_effects: []

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: POST /shops/{shopId}/settlements/{settlementId}/approve
        actor: PlatformAdmin
        preconditions:
          - "Verify computed amounts match: gross - commission - refunds = net"
        side_effects: []

      - from: APPROVED
        to: PAID
        trigger: POST /shops/{shopId}/settlements/{settlementId}/mark-paid
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "shop.settlement_balance -= net_amount"

      - from: PENDING_APPROVAL
        to: DISPUTED
        trigger: POST /shops/{shopId}/settlements/{settlementId}/dispute
        actor: Seller
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: PENDING_APPROVAL
        trigger: POST /shops/{shopId}/settlements/{settlementId}/resolve-dispute
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Recalculate settlement amounts"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: promotional_discount
    trigger: "order creation"
    algorithm: tiered_pricing
    formula: |
      1. Collect all ACTIVE promotions for the shop where:
         - current_time >= start_time AND current_time < end_time
         - applicable_categories is empty OR intersects with order item categories
         - usage_count < max_usage (or max_usage is null)
         - promo_threshold met (quantity >= threshold for BUY_X_GET_Y_FREE, subtotal >= threshold for others)
      2. Filter to applicable promotions:
         - Non-stackable: only the highest-priority (lowest number) applicable promotion
         - Stackable: all stackable promotions + at most one non-stackable (highest priority)
      3. Sort selected promotions by priority (ascending)
      4. Apply in order based on shop.discount_strategy:
         PERCENTAGE_FIRST:
           - Sort: all PERCENTAGE promos first (by priority), then FIXED_AMOUNT (by priority), then BUY_X_GET_Y_FREE
           - Apply each in sorted order to the running_total
         FIXED_FIRST:
           - Sort: all FIXED_AMOUNT promos first (by priority), then PERCENTAGE (by priority), then BUY_X_GET_Y_FREE
           - Apply each in sorted order to the running_total
      5. For each promotion application:
         PERCENTAGE: discount = running_total * (promo_value / 100), capped at max_discount_cap
         FIXED_AMOUNT: discount = min(promo_value, running_total)
         BUY_X_GET_Y_FREE: discount = Y cheapest items' unit_price * quantity (up to Y free units per X bought)
         running_total = running_total - discount (floor at 0.01)
      6. total_discount = subtotal - running_total
    input_set: "All ACTIVE promotions for the shop matching order items' categories"
    precision: "2 decimal places, round_half_up per promotion step"
    variants:
      - name: percentage_first
        when: "shop.discount_strategy = PERCENTAGE_FIRST"
        difference: "Percentage discounts reduce the base before fixed discounts apply, yielding a smaller total discount when both types exist"
      - name: fixed_first
        when: "shop.discount_strategy = FIXED_FIRST"
        difference: "Fixed discounts reduce the base before percentage discounts apply, yielding a larger total discount when both types exist"
    key_insight: |
      Two shops with identical products and identical promotions but different
      discount_strategy will produce different order totals. This is the core
      dual-variant challenge. Example: subtotal=$100, 20% off + $10 off.
      PERCENTAGE_FIRST: $100 * 0.8 = $80, then $80 - $10 = $70 (discount = $30)
      FIXED_FIRST: $100 - $10 = $90, then $90 * 0.8 = $72 (discount = $28)

  - name: discount_share_allocation
    trigger: "order creation (after promotional_discount)"
    algorithm: waterfall_allocation
    formula: |
      Distribute total discount_amount proportionally across order items:
      for each item except the last (sorted by order_item_id ascending):
        item.discount_share = round(discount_amount * (item.line_total / subtotal), 2)
      last_item.discount_share = discount_amount - sum(other items' discount_shares)
      item.final_price = item.line_total - item.discount_share
    input_set: "All order items in the order"
    precision: "2 decimal places, round_half_up; remainder allocated to last item"
    key_insight: |
      The last-item remainder allocation means the order of items matters for
      individual item prices (though order total is the same). This affects
      partial refund calculations — refunding different items yields different
      refund amounts even when items have equal line_total.

  - name: inventory_reservation
    trigger: "order creation, payment confirmation, cancellation, reservation timeout"
    algorithm: aggregation
    formula: |
      Order creation:
        for each order item:
          product.reserved_count += item.quantity
          product.available_count = product.inventory_count - product.reserved_count
          if product.available_count < 0: ROLLBACK all reservations, reject order
        order.reservation_expires_at = current_time + RESERVATION_TIMEOUT
      Payment confirmed:
        for each order item:
          product.reserved_count -= item.quantity  # reservation converted to committed sale
      Cancel / Timeout:
        for each order item:
          product.reserved_count -= item.quantity  # release reservation
    constants:
      RESERVATION_TIMEOUT: 30  # minutes
    note: "Reservation is atomic: if any product has insufficient available_count, NO items are reserved"

  - name: refund_amount_calculation
    trigger: "refund processing"
    algorithm: waterfall_allocation
    formula: |
      FULL refund:
        refund_amount = order.total_amount - sum(previously_processed_refunds)
      PARTIAL refund:
        refund_subtotal = sum(refund_item.quantity * order_item.unit_price for each refund_item)
        refund_discount_share = sum(
          for each refund_item:
            proportion = (refund_item.quantity * order_item.unit_price) / order.subtotal
            round(order.discount_amount * proportion, 2)
        )
        # Remainder adjustment on last refund item
        expected_total_discount_share = round(order.discount_amount * (refund_subtotal / order.subtotal), 2)
        adjust last item's share so sum = expected_total_discount_share
        refund_amount = refund_subtotal - refund_discount_share
    precision: "2 decimal places, round_half_up; remainder on last refund item"
    key_insight: |
      Partial refund on a discounted order: the discount must be proportionally
      distributed. Because of rounding, refunding item A then item B may yield
      a different total refund than refunding B then A. The system must track
      cumulative refunded amounts to ensure total refunds never exceed total_amount.

  - name: commission_calculation
    trigger: "order completion (delivery)"
    algorithm: tiered_pricing
    formula: |
      current_gmv = shop.monthly_gmv (before this order)
      order_amount = order.total_amount
      commission = 0
      remaining = order_amount
      for each tier in TIERS (ascending by threshold):
        tier_capacity = tier.upper - max(tier.lower, current_gmv)
        if tier_capacity <= 0: continue  # already past this tier
        taxable_in_tier = min(remaining, max(0, tier_capacity))
        commission += taxable_in_tier * tier.rate
        remaining -= taxable_in_tier
        if remaining <= 0: break
      order.commission_rate = commission / order_amount  # effective blended rate
      order.commission_amount = round(commission, 2)
    constants:
      TIERS:
        - { lower: 0, upper: 10000, rate: 0.08 }       # 8% for first 10,000
        - { lower: 10000, upper: 50000, rate: 0.05 }    # 5% for 10,001 - 50,000
        - { lower: 50000, upper: Infinity, rate: 0.03 }  # 3% above 50,000
    precision: "2 decimal places, round_half_up"
    variants:
      - name: within_tier
        when: "current_gmv + order_amount stays within one tier"
        difference: "Simple: commission = order_amount * single_tier_rate"
      - name: cross_tier
        when: "current_gmv + order_amount crosses a tier boundary"
        difference: "Split: part of the order at one rate, remainder at the next tier's rate"
    key_insight: |
      The marginal tier system means the commission rate depends on the shop's
      cumulative GMV at the moment of delivery. Two identical orders delivered
      at different times may have different commission rates if GMV crossed a
      tier boundary between them. Boundary precision: an order that pushes GMV
      from exactly 10000 to 10100 pays 0% at the first tier (already full) and
      5% on the full 100 in the second tier.

  - name: settlement_reconciliation
    trigger: "settlement creation"
    algorithm: aggregation
    formula: |
      For the given period [period_start, period_end):
        gross_amount = sum(order.total_amount for COMPLETED orders delivered in period)
        total_commission = sum(order.commission_amount for same orders)
        total_refunds = sum(refund.refund_amount for PROCESSED refunds in period)
        net_amount = gross_amount - total_commission - total_refunds
    input_set: "COMPLETED orders and PROCESSED refunds within the settlement period"
    precision: "2 decimal places, round_half_up"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  # --- Authentication ---
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_AUTH_HEADER_MISSING
    http_status: 400
    applies_to: all endpoints

  # --- Authorization ---
  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 2.1
    category: auth
    check: "Seller can only manage their own shop (shop.owner_id must match X-User-ID)"
    error_id: ERR_NOT_SHOP_OWNER
    http_status: 403
    applies_to: "all Seller-only shop management endpoints"

  - priority: 2.2
    category: auth
    check: "Customer can only manage their own orders (order.customer_id must match X-User-ID)"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "Customer order endpoints (cancel, pay, request refund)"

  # --- Existence ---
  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all nested resource endpoints
    note: "Validate shopId first, then productId/orderId, then nested resource IDs"

  # --- State Preconditions ---
  - priority: 4
    category: state
    check: "Shop must be in ACTIVE state for order placement, product listing, promotion activation"
    error_id: ERR_SHOP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /orders, POST .../products/{id}/list, POST .../promotions/{id}/activate"

  - priority: 4.1
    category: state
    check: "Product must be in LISTED state to be included in an order"
    error_id: ERR_PRODUCT_NOT_LISTED
    http_status: 409
    applies_to: "POST /orders"

  - priority: 4.2
    category: state
    check: "Target resource must be in the correct state for the requested transition"
    error_id: "varies (ERR_ORDER_NOT_UNPAID, ERR_REFUND_NOT_APPROVED, etc.)"
    http_status: 409
    applies_to: "all state transition endpoints"

  # --- Business Rules: Inventory / Availability ---
  - priority: 5
    category: business_constraint
    check: "Product must have sufficient available_count (>= requested quantity) for each order item"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /orders"
    note: "Checked atomically across all items — if any fails, no reservations are made"

  # --- Business Rules: Temporal ---
  - priority: 5.1
    category: business_temporal
    check: "Order reservation must not have expired (current_time < reservation_expires_at)"
    error_id: ERR_RESERVATION_EXPIRED
    http_status: 409
    applies_to: "POST /orders/{orderId}/pay"

  - priority: 5.2
    category: business_temporal
    check: "Promotion end_time must be in the future for activation"
    error_id: ERR_PROMOTION_EXPIRED
    http_status: 409
    applies_to: "POST .../promotions/{id}/activate"

  # --- Business Rules: Constraint Satisfaction ---
  - priority: 6
    category: business_constraint
    check: "All order items must belong to the same shop"
    error_id: ERR_CROSS_SHOP_ORDER
    http_status: 400
    applies_to: "POST /orders"

  - priority: 6.1
    category: business_constraint
    check: "Promotion priority must be unique among shop's ACTIVE promotions"
    error_id: ERR_DUPLICATE_PROMOTION_PRIORITY
    http_status: 409
    applies_to: "POST .../promotions/{id}/activate"

  - priority: 6.2
    category: business_constraint
    check: "Refund item quantities must not exceed remaining unreunded quantity per order item"
    error_id: ERR_REFUND_EXCEEDS_REMAINING
    http_status: 409
    applies_to: "POST /orders/{orderId}/refunds/{refundId}/approve"

  - priority: 6.3
    category: business_constraint
    check: "Cumulative refund amount must not exceed order.total_amount"
    error_id: ERR_REFUND_EXCEEDS_ORDER_TOTAL
    http_status: 409
    applies_to: "POST /orders/{orderId}/refunds/{refundId}/process"

  - priority: 6.4
    category: business_constraint
    check: "Settlement period must not overlap with existing non-terminal settlements for the same shop"
    error_id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /shops/{shopId}/settlements"

  # --- Business Rules: Fiscal ---
  - priority: 7
    category: business_fiscal
    check: "Settlement net_amount must be > 0"
    error_id: ERR_SETTLEMENT_ZERO_AMOUNT
    http_status: 422
    applies_to: "POST .../settlements/{id}/submit"

  - priority: 7.1
    category: business_fiscal
    check: "Settlement computed amounts must reconcile (gross - commission - refunds = net)"
    error_id: ERR_SETTLEMENT_RECONCILIATION_MISMATCH
    http_status: 422
    applies_to: "POST .../settlements/{id}/approve"

  # --- Business Rules: Referential Integrity ---
  - priority: 8
    category: business_referential
    check: "Cannot close shop with non-terminal orders or unsettled balance"
    error_id: ERR_SHOP_HAS_PENDING_ORDERS
    http_status: 409
    applies_to: "POST /shops/{shopId}/close"

  - priority: 8.1
    category: business_referential
    check: "Cannot archive product with reserved_count > 0"
    error_id: ERR_PRODUCT_HAS_RESERVATIONS
    http_status: 409
    applies_to: "POST .../products/{id}/archive"

# =============================================================================
# Table 5: API Endpoint Table (38 endpoints)
# =============================================================================
endpoints:
  # --- Shop Management ---
  - method: POST
    path: "/shops"
    description: "Register a new shop"
    roles: [Seller]
    code: 201
    input: [shop_name, owner_id, description?, discount_strategy?]
    output: Shop
    side_effects: ["status = PENDING_REVIEW"]

  - method: GET
    path: "/shops"
    description: "List all shops"
    roles: [Any]
    code: 200
    input: ["status?, limit?, offset?"]
    output: "Shop[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}"
    description: "Get shop details"
    roles: [Any]
    code: 200
    input: []
    output: Shop
    side_effects: []

  - method: PUT
    path: "/shops/{shopId}"
    description: "Update shop details (name, description, discount_strategy)"
    roles: [Seller]
    code: 200
    input: ["shop_name?, description?, discount_strategy?, version?"]
    output: Shop
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/approve"
    description: "Approve a shop for operation"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Shop
    side_effects: ["status → ACTIVE, initialize monthly_gmv and settlement_balance to 0"]

  - method: POST
    path: "/shops/{shopId}/suspend"
    description: "Suspend a shop"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Shop
    side_effects: ["status → SUSPENDED, cascade delist products and pause promotions"]

  - method: POST
    path: "/shops/{shopId}/reinstate"
    description: "Reinstate a suspended shop"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Shop
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/shops/{shopId}/close"
    description: "Permanently close a shop"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Shop
    side_effects: ["status → CLOSED, cascade archive products and cancel promotions"]

  # --- Product Management ---
  - method: POST
    path: "/shops/{shopId}/products"
    description: "Create a new product"
    roles: [Seller]
    code: 201
    input: [product_name, category, base_price, inventory_count]
    output: Product
    side_effects: ["reserved_count = 0, available_count = inventory_count, status = DRAFT"]

  - method: GET
    path: "/shops/{shopId}/products"
    description: "List products for a shop"
    roles: [Any]
    code: 200
    input: ["status?, category?, limit?, offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/products/{productId}"
    description: "Get product details"
    roles: [Any]
    code: 200
    input: []
    output: Product
    side_effects: []

  - method: PUT
    path: "/shops/{shopId}/products/{productId}"
    description: "Update product (name, category, base_price, inventory_count)"
    roles: [Seller]
    code: 200
    input: ["product_name?, category?, base_price?, inventory_count?, version?"]
    output: Product
    side_effects: ["available_count recalculated if inventory_count changed"]

  - method: POST
    path: "/shops/{shopId}/products/{productId}/list"
    description: "List a product for sale (DRAFT/DELISTED → LISTED)"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Product
    side_effects: ["status → LISTED"]

  - method: POST
    path: "/shops/{shopId}/products/{productId}/delist"
    description: "Remove product from listing"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Product
    side_effects: ["status → DELISTED"]

  - method: POST
    path: "/shops/{shopId}/products/{productId}/archive"
    description: "Archive a product permanently"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Product
    side_effects: ["status → ARCHIVED"]

  # --- Promotion Management ---
  - method: POST
    path: "/shops/{shopId}/promotions"
    description: "Create a new promotion"
    roles: [Seller]
    code: 201
    input: [promo_name, promo_type, promo_value, promo_threshold?, max_discount_cap?, stackable?, priority, applicable_categories, start_time, end_time, max_usage?]
    output: Promotion
    side_effects: ["status = DRAFT, usage_count = 0"]

  - method: GET
    path: "/shops/{shopId}/promotions"
    description: "List promotions for a shop"
    roles: [Any]
    code: 200
    input: ["status?, limit?, offset?"]
    output: "Promotion[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/promotions/{promotionId}"
    description: "Get promotion details"
    roles: [Any]
    code: 200
    input: []
    output: Promotion
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/promotions/{promotionId}/activate"
    description: "Activate a promotion"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Promotion
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/shops/{shopId}/promotions/{promotionId}/pause"
    description: "Pause an active promotion"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Promotion
    side_effects: ["status → PAUSED"]

  - method: POST
    path: "/shops/{shopId}/promotions/{promotionId}/cancel"
    description: "Cancel a promotion"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Promotion
    side_effects: ["status → CANCELLED"]

  # --- Order Lifecycle ---
  - method: POST
    path: "/orders"
    description: "Place a new order"
    roles: [Customer]
    code: 201
    input: ["shop_id, shipping_address, items: [{product_id, quantity}]"]
    output: Order
    side_effects:
      - "Reserve inventory for all items (atomic)"
      - "Snapshot product details into order items"
      - "Calculate promotional discounts based on shop's discount_strategy"
      - "Allocate discount_share to each order item"
      - "Set reservation_expires_at"

  - method: GET
    path: "/orders"
    description: "List orders (filtered by customer_id for Customer role, by shop_id for Seller)"
    roles: [Any]
    code: 200
    input: ["shop_id?, order_status?, payment_status?, fulfillment_status?, limit?, offset?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/orders/{orderId}"
    description: "Get order details including items"
    roles: [Any]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/cancel"
    description: "Cancel an unpaid order"
    roles: [Customer]
    code: 200
    input: ["version?"]
    output: Order
    side_effects:
      - "order_status → CANCELLED"
      - "Release reserved inventory for all items"

  - method: POST
    path: "/orders/{orderId}/pay"
    description: "Initiate payment for an order"
    roles: [Customer]
    code: 200
    input: ["payment_method, transaction_ref, version?"]
    output: Order
    side_effects:
      - "payment_status → PAYING"
      - "Create Payment record with status PENDING"

  - method: POST
    path: "/orders/{orderId}/confirm-payment"
    description: "Confirm payment success (called by payment gateway callback)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Order
    side_effects:
      - "payment_status → PAID"
      - "order_status → CONFIRMED"
      - "Convert reserved inventory to committed"
      - "Increment promotion usage_counts"

  - method: POST
    path: "/orders/{orderId}/payment-failed"
    description: "Mark payment as failed"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Order
    side_effects:
      - "payment_status → UNPAID"
      - "Payment record status → FAILED"

  - method: POST
    path: "/orders/{orderId}/start-processing"
    description: "Seller starts processing the order"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Order
    side_effects: ["fulfillment_status → PROCESSING"]

  - method: POST
    path: "/orders/{orderId}/ship"
    description: "Mark order as shipped"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Order
    side_effects: ["fulfillment_status → SHIPPED"]

  - method: POST
    path: "/orders/{orderId}/deliver"
    description: "Mark order as delivered"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Order
    side_effects:
      - "fulfillment_status → DELIVERED"
      - "order_status → COMPLETED"
      - "Calculate commission (tiered by monthly GMV)"
      - "Update shop.monthly_gmv and shop.settlement_balance"

  # --- Refund Management ---
  - method: POST
    path: "/orders/{orderId}/refunds"
    description: "Request a refund"
    roles: [Customer]
    code: 201
    input: ["reason, refund_type, refund_items? (for PARTIAL)"]
    output: Refund
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/orders/{orderId}/refunds"
    description: "List refunds for an order"
    roles: [Any]
    code: 200
    input: ["status?, limit?, offset?"]
    output: "Refund[]"
    side_effects: []

  - method: GET
    path: "/orders/{orderId}/refunds/{refundId}"
    description: "Get refund details"
    roles: [Any]
    code: 200
    input: []
    output: Refund
    side_effects: []

  - method: POST
    path: "/orders/{orderId}/refunds/{refundId}/approve"
    description: "Approve a refund request"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Refund
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/orders/{orderId}/refunds/{refundId}/reject"
    description: "Reject a refund request"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Refund
    side_effects: ["status → REJECTED"]

  - method: POST
    path: "/orders/{orderId}/refunds/{refundId}/process"
    description: "Process an approved refund (disburse funds)"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Refund
    side_effects:
      - "status → PROCESSED"
      - "Calculate refund_amount with proportional discount allocation"
      - "Create Payment record (type=REFUND)"
      - "Update order.payment_status"
      - "Restore inventory"
      - "Reverse proportional commission and GMV"

  # --- Settlement Management ---
  - method: POST
    path: "/shops/{shopId}/settlements"
    description: "Create a settlement record for a period"
    roles: [Seller]
    code: 201
    input: [period_start, period_end]
    output: Settlement
    side_effects: ["Calculate gross_amount, total_commission, total_refunds, net_amount"]

  - method: GET
    path: "/shops/{shopId}/settlements"
    description: "List settlements for a shop"
    roles: [Seller, PlatformAdmin]
    code: 200
    input: ["status?, limit?, offset?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/shops/{shopId}/settlements/{settlementId}"
    description: "Get settlement details"
    roles: [Seller, PlatformAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/shops/{shopId}/settlements/{settlementId}/submit"
    description: "Submit settlement for approval"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Settlement
    side_effects: ["status → PENDING_APPROVAL"]

  - method: POST
    path: "/shops/{shopId}/settlements/{settlementId}/approve"
    description: "Approve a settlement"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Settlement
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/shops/{shopId}/settlements/{settlementId}/mark-paid"
    description: "Mark settlement as paid"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Settlement
    side_effects: ["status → PAID, shop.settlement_balance -= net_amount"]

  - method: POST
    path: "/shops/{shopId}/settlements/{settlementId}/dispute"
    description: "Dispute a pending settlement"
    roles: [Seller]
    code: 200
    input: ["version?"]
    output: Settlement
    side_effects: ["status → DISPUTED"]

  - method: POST
    path: "/shops/{shopId}/settlements/{settlementId}/resolve-dispute"
    description: "Resolve a disputed settlement"
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Settlement
    side_effects: ["Recalculate amounts, status → PENDING_APPROVAL"]

# =============================================================================
# Table 6: Error Code Catalog (38 error codes)
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ERR_AUTH_HEADER_MISSING
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Current role does not have permission for this operation"

  - id: ERR_NOT_SHOP_OWNER
    http: 403
    condition: "Seller attempting to manage a shop they do not own"

  - id: ERR_NOT_ORDER_OWNER
    http: 403
    condition: "Customer attempting to manage an order they did not place"

  # --- Resource Not Found ---
  - id: ERR_SHOP_NOT_FOUND
    http: 404
    condition: "Shop with given shopId does not exist"

  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "Product with given productId does not exist"

  - id: ERR_PROMOTION_NOT_FOUND
    http: 404
    condition: "Promotion with given promotionId does not exist"

  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "Order with given orderId does not exist"

  - id: ERR_REFUND_NOT_FOUND
    http: 404
    condition: "Refund with given refundId does not exist"

  - id: ERR_SETTLEMENT_NOT_FOUND
    http: 404
    condition: "Settlement with given settlementId does not exist"

  - id: ERR_ORDER_ITEM_NOT_FOUND
    http: 404
    condition: "OrderItem referenced in refund does not belong to this order"

  # --- State Constraints ---
  - id: ERR_SHOP_NOT_ACTIVE
    http: 409
    condition: "Operation requires shop to be in ACTIVE state"

  - id: ERR_SHOP_NOT_PENDING_REVIEW
    http: 409
    condition: "Approve requires shop to be in PENDING_REVIEW state"

  - id: ERR_PRODUCT_NOT_LISTED
    http: 409
    condition: "Product must be in LISTED state to be ordered"

  - id: ERR_PRODUCT_NOT_DRAFT_OR_DELISTED
    http: 409
    condition: "List action requires product to be in DRAFT or DELISTED state"

  - id: ERR_PRODUCT_NOT_LISTED_FOR_DELIST
    http: 409
    condition: "Delist action requires product to be in LISTED state"

  - id: ERR_PROMOTION_NOT_DRAFT_OR_PAUSED
    http: 409
    condition: "Activate requires promotion to be in DRAFT or PAUSED state"

  - id: ERR_PROMOTION_NOT_ACTIVE
    http: 409
    condition: "Pause requires promotion to be in ACTIVE state"

  - id: ERR_ORDER_NOT_UNPAID
    http: 409
    condition: "Cancel or pay requires order payment_status to be UNPAID"

  - id: ERR_ORDER_NOT_PAYING
    http: 409
    condition: "Confirm-payment or payment-failed requires payment_status to be PAYING"

  - id: ERR_ORDER_NOT_PAID
    http: 409
    condition: "Fulfillment actions require payment_status to be PAID or PARTIAL_REFUND"

  - id: ERR_ORDER_NOT_CONFIRMED
    http: 409
    condition: "Start-processing requires order_status to be CONFIRMED"

  - id: ERR_FULFILLMENT_NOT_PROCESSING
    http: 409
    condition: "Ship requires fulfillment_status to be PROCESSING"

  - id: ERR_FULFILLMENT_NOT_SHIPPED
    http: 409
    condition: "Deliver requires fulfillment_status to be SHIPPED"

  - id: ERR_REFUND_NOT_REQUESTED
    http: 409
    condition: "Approve/reject requires refund to be in REQUESTED state"

  - id: ERR_REFUND_NOT_APPROVED
    http: 409
    condition: "Process requires refund to be in APPROVED state"

  - id: ERR_SETTLEMENT_NOT_DRAFT
    http: 409
    condition: "Submit requires settlement to be in DRAFT state"

  - id: ERR_SETTLEMENT_NOT_PENDING
    http: 409
    condition: "Approve requires settlement to be in PENDING_APPROVAL state"

  - id: ERR_SETTLEMENT_NOT_APPROVED
    http: 409
    condition: "Mark-paid requires settlement to be in APPROVED state"

  - id: ERR_SETTLEMENT_NOT_DISPUTED_STATE
    http: 409
    condition: "Resolve-dispute requires settlement to be in DISPUTED state"

  # --- Business Validation ---
  - id: ERR_INSUFFICIENT_INVENTORY
    http: 409
    condition: "Product available_count < requested quantity (checked atomically for all items)"

  - id: ERR_RESERVATION_EXPIRED
    http: 409
    condition: "Order reservation has expired (current_time >= reservation_expires_at)"

  - id: ERR_PROMOTION_EXPIRED
    http: 409
    condition: "Promotion end_time is in the past"

  - id: ERR_CROSS_SHOP_ORDER
    http: 400
    condition: "Order items reference products from different shops"

  - id: ERR_DUPLICATE_PROMOTION_PRIORITY
    http: 409
    condition: "Another ACTIVE promotion in the same shop already has this priority"

  - id: ERR_REFUND_EXCEEDS_REMAINING
    http: 409
    condition: "Refund item quantity exceeds remaining unrefunded quantity for that order item"

  - id: ERR_REFUND_EXCEEDS_ORDER_TOTAL
    http: 409
    condition: "Cumulative refund amount would exceed order total_amount"

  - id: ERR_SETTLEMENT_PERIOD_OVERLAP
    http: 409
    condition: "Settlement period overlaps with an existing non-terminal settlement for this shop"

  - id: ERR_SETTLEMENT_ZERO_AMOUNT
    http: 422
    condition: "Settlement net_amount is <= 0"

  - id: ERR_SETTLEMENT_RECONCILIATION_MISMATCH
    http: 422
    condition: "Settlement computed amounts do not reconcile (gross - commission - refunds != net)"

  - id: ERR_SHOP_HAS_PENDING_ORDERS
    http: 409
    condition: "Cannot close shop with non-terminal orders or unsettled balance > 0"

  - id: ERR_PRODUCT_HAS_RESERVATIONS
    http: 409
    condition: "Cannot archive product while reserved_count > 0"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "General request format error (missing required fields, type mismatch, invalid values)"

  - id: ERR_PROMOTION_USAGE_EXHAUSTED
    http: 409
    condition: "Promotion has reached max_usage limit"

  # --- Concurrency Control ---
  - id: ERR_STALE_DATA
    http: 409
    condition: "Request version does not match server's current version (optimistic concurrency control)"

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End user who places orders and requests refunds"
    exclusive_operations:
      - "POST /orders — Place a new order"
      - "POST /orders/{id}/cancel — Cancel an unpaid order"
      - "POST /orders/{id}/pay — Initiate payment"
      - "POST /orders/{id}/refunds — Request a refund"

  - name: Seller
    description: "Shop owner who manages products, promotions, fulfillment, and settlements"
    exclusive_operations:
      - "POST /shops — Register a new shop"
      - "PUT /shops/{id} — Update shop details"
      - "POST /shops/{id}/products — Create product"
      - "PUT /shops/{id}/products/{id} — Update product"
      - "POST .../products/{id}/list — List product for sale"
      - "POST .../products/{id}/delist — Remove product from listing"
      - "POST .../products/{id}/archive — Archive product"
      - "POST .../promotions — Create promotion"
      - "POST .../promotions/{id}/activate — Activate promotion"
      - "POST .../promotions/{id}/pause — Pause promotion"
      - "POST .../promotions/{id}/cancel — Cancel promotion"
      - "POST /orders/{id}/start-processing — Begin fulfillment"
      - "POST /orders/{id}/ship — Ship order"
      - "POST /orders/{id}/deliver — Mark delivered"
      - "POST /orders/{id}/refunds/{id}/approve — Approve refund"
      - "POST /orders/{id}/refunds/{id}/reject — Reject refund"
      - "POST .../settlements — Create settlement"
      - "POST .../settlements/{id}/submit — Submit for approval"
      - "POST .../settlements/{id}/dispute — Dispute settlement"

  - name: PlatformAdmin
    description: "Platform operator who manages shop approvals, payment confirmations, refund processing, and settlements"
    exclusive_operations:
      - "POST /shops/{id}/approve — Approve shop"
      - "POST /shops/{id}/suspend — Suspend shop"
      - "POST /shops/{id}/reinstate — Reinstate shop"
      - "POST /shops/{id}/close — Close shop"
      - "POST /orders/{id}/confirm-payment — Confirm payment"
      - "POST /orders/{id}/payment-failed — Mark payment failed"
      - "POST /orders/{id}/refunds/{id}/process — Process refund"
      - "POST .../settlements/{id}/approve — Approve settlement"
      - "POST .../settlements/{id}/mark-paid — Mark settlement paid"
      - "POST .../settlements/{id}/resolve-dispute — Resolve dispute"

  - name: Any
    description: "Shared across all authenticated roles"
    shared_operations:
      - "GET /shops — List shops"
      - "GET /shops/{id} — Get shop details"
      - "GET .../products — List products"
      - "GET .../products/{id} — Get product details"
      - "GET .../promotions — List promotions"
      - "GET .../promotions/{id} — Get promotion details"
      - "GET /orders — List orders (filtered by role)"
      - "GET /orders/{id} — Get order details"
      - "GET .../refunds — List refunds"
      - "GET .../refunds/{id} — Get refund details"
      - "GET .../settlements — List settlements"
      - "GET .../settlements/{id} — Get settlement details"
