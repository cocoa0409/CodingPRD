            - call: "POST /fleet/consignments/${cns_r}/withdraw"
              payload: {}
              as: RemarketingManager
              as_user_id: "u-rmk-a"
              captures: { second_withdraw_error: $.data.error_id }
          assert:
            - "immediately before the trigger, Consignment.${cns_r}.recondition_loaded_cents == 48913 (round_half_up of 45500 * 1.075 = 48912.5, so a truncating implementation reports 48912 and fails here)"
            - "immediately before the trigger, GET /fleet/vehicles/${veh_r} -> data.total_recondition_cents == 48913, data.fleet_status == \"HELD_FOR_SALE\", data.condition_status == \"RECONDITIONED\", data.net_book_value_at_hold_cents == 1900000"
            - "immediately before the trigger, Consignment.${cns_r}.floor_price_cents == 1425000 (round_half_up of 1900000 * 0.75) and GET /fleet/markets/${mkt_atl} -> data.in_service_unit_count == 0"
            - "immediately before the trigger, GET /fleet/vehicles/${veh_r}/ledger-entries reports total_count 5: CAPITALIZATION +2800000, PREP_COST +14000, PREP_COST +9000, PREP_COST +21000, RECONDITION_COST +48913"
            - "the first trigger call returns HTTP 200 with data.status == \"WITHDRAWN\""
            - "after the withdrawal GET /fleet/vehicles/${veh_r}/ledger-entries reports total_count 6, so the RECONDITION_COST row was NOT deleted - a sixth row was appended"
            - "the appended row has entry_type RECONDITION_REVERSAL, amount_cents == -48913 and source_entity_type == \"Consignment\", and the signed sum of the two recondition rows is exactly 0"
            - "after the withdrawal GET /fleet/vehicles/${veh_r} -> data.total_recondition_cents == 0"
            - "after the withdrawal GET /fleet/vehicles/${veh_r} -> data.fleet_status == \"IN_SERVICE\", data.condition_status == \"SOUND\", data.held_for_sale_at == null and data.net_book_value_at_hold_cents == null"
            - "after the withdrawal GET /fleet/markets/${mkt_atl} -> data.in_service_unit_count == 1, exactly the pre-consignment census"
            - "the valuation is untouched by the reversal: GET /fleet/vehicles/${veh_r}/valuation -> data.net_book_value_cents == 1900000, the same figure as before the consignment"
            - "the second trigger call returns HTTP 409 with error_id ERR_CONSIGNMENT_INVALID_STATE because WITHDRAWN is terminal"
            - "after that refusal the ledger is still 6 rows and total_recondition_cents is still 0, so the compensation is applied exactly once and never overshoots to -48913"

      - name: market_in_service_census_restored_after_transit_cancellation
        grounds:
          - state_machines.RedistributionOrder[IN_TRANSIT -> CANCELLED]
          - state_machines.Vehicle[IN_TRANSIT -> IN_SERVICE]
          - entities.Market.fields.in_service_unit_count
          - endpoints[POST /fleet/redistribution-orders/{order_id}/cancel]
        distinguishing_aspect: |
          The conserved quantity here is a DENORMALISED COUNTER PAIR spread over two
          different Market rows, not a money total on one entity, and it is conserved by
          NOT posting the forward ledger row at all: cancelling an IN_TRANSIT haul restores
          the origin census and leaves the vehicle's current_market_id at the origin, with
          zero TRANSPORT_COST rows. The follow-on completed haul then shows the same census
          sum of 1 migrating to the destination, proving the abort left no drift behind.
        test_recipe:
          setup:
            - "Markets ATL (origin) and DFW (destination) are both ACTIVE."
            - "Vehicle VT is IN_SERVICE at ATL, so in_service_unit_count is 1 at ATL and 0 at DFW; the pair sums to 1 and must sum to 1 after every step."
            - "Its opening ledger is four rows (CAPITALIZATION + three PREP_COST) with no TRANSPORT_COST row."
            - "Order OA covers [2026-03-01, 2026-03-05) over 200 km, priced at 61500 cents, and is driven all the way to IN_TRANSIT before it is aborted."
            - "Order OB covers a later, disjoint window [2026-03-10, 2026-03-14) over the same 200 km and is driven to RECEIVED."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
              payload: { code: "ATL", name: "Atlanta", region: "EAST", transport_hub_distance_km: 23, transfer_cost_per_km_cents: 250, storage_cost_per_day_cents: 800, prep_capacity_per_day: 2, registration_lead_days: 3 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_atl: $.data.id }
            - call: "POST /fleet/markets"
              payload: { code: "DFW", name: "Dallas", region: "CENTRAL", transport_hub_distance_km: 35, transfer_cost_per_km_cents: 300, storage_cost_per_day_cents: 700, prep_capacity_per_day: 4, registration_lead_days: 2 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { mkt_dfw: $.data.id }
            - call: "POST /fleet/vehicle-segments"
              payload: { code: "MIDSIZE", name: "Midsize sedan", baseline_daily_rate_cents: 5500, target_utilization_pct: 0.80, target_revenue_per_unit_month_cents: 132000, mileage_band_soft_limit_km: 40000, mileage_band_hard_limit_km: 60000, recondition_cap_cents: 90000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { seg_mid: $.data.id }
            - call: "POST /fleet/manufacturer-programs"
              payload: { manufacturer_name: "Northstar", program_year: 2026, program_type: "PROGRAM", repurchase_guarantee_pct: 0.82, min_holding_days: 180, max_holding_days: 365, max_eligible_mileage_km: 45000, excess_mileage_charge_cents_per_km: 30, damage_deduction_cap_cents: 150000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { prg_pgm: $.data.id }
            - call: "POST /fleet/fleet-plans"
              payload: { market_id: "${mkt_atl}", season: "PEAK", plan_year: 2026, planned_unit_count: 10, revenue_per_unit_target_cents: 132000, utilization_target_pct: 0.80 }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { plan_atl: $.data.id }
            - call: "POST /fleet/fleet-plans/${plan_atl}/lock"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { plan_v1: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_pgm}", segment_id: "${seg_mid}", unit_count: 4, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_pgm: $.data.id }
            - call: "POST /fleet/purchase-allocations/${alloc_pgm}/vehicles"
              payload: { vin: "NS26PGMATL000042", current_market_id: "${mkt_atl}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { veh_t: $.data.id }
            - call: "POST /fleet/vehicles/${veh_t}/in-fleet"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_t}/in-fleeting-tasks"
              payload: { task_type: "REGISTRATION", cost_cents: 14000, window_start: "2026-01-05T08:00:00Z", window_end: "2026-01-05T09:00:00Z" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { t_t_reg: $.data.id }
            - call: "POST /fleet/in-fleeting-tasks/${t_t_reg}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_t}/in-fleeting-tasks"
              payload: { task_type: "LICENSING", cost_cents: 9000, window_start: "2026-01-06T08:00:00Z", window_end: "2026-01-06T09:00:00Z" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { t_t_lic: $.data.id }
            - call: "POST /fleet/in-fleeting-tasks/${t_t_lic}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_t}/in-fleeting-tasks"
              payload: { task_type: "PREPARATION", cost_cents: 21000, window_start: "2026-01-07T08:00:00Z", window_end: "2026-01-07T10:00:00Z", bay_code: "B1" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { t_t_prep: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/in-fleeting-tasks/${t_t_prep}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/redistribution-orders"
              payload: { vehicle_id: "${veh_t}", destination_market_id: "${mkt_dfw}", distance_km: 200, planned_depart_at: "2026-03-01T00:00:00Z", planned_receive_at: "2026-03-05T00:00:00Z" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { ord_a: $.data.id }
            - call: "POST /fleet/redistribution-orders/${ord_a}/propose"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
            - call: "POST /fleet/redistribution-orders/${ord_a}/authorize"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T06:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/redistribution-orders/${ord_a}/depart"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T06:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /fleet/redistribution-orders/${ord_a}/cancel"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-b"
              captures: { ord_a_status: $.data.status }
            - call: "POST /fleet/redistribution-orders"
              payload: { vehicle_id: "${veh_t}", destination_market_id: "${mkt_dfw}", distance_km: 200, planned_depart_at: "2026-03-10T00:00:00Z", planned_receive_at: "2026-03-14T00:00:00Z" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { ord_b: $.data.id }
            - call: "POST /fleet/redistribution-orders/${ord_b}/propose"
              payload: {}
              as: FleetPlanner
              as_user_id: "u-plan-1"
            - call: "POST /fleet/redistribution-orders/${ord_b}/authorize"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T06:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/redistribution-orders/${ord_b}/depart"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-03-13T18:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/redistribution-orders/${ord_b}/receive"
              payload: { actual_transport_cost_cents: 61500, odometer_km: 12000 }
              as: MarketOperator
              as_user_id: "${mkt_dfw}"
          assert:
            - "immediately before the trigger, the haul is in flight: RedistributionOrder.${ord_a}.status == \"IN_TRANSIT\" with depart_at 2026-03-01T06:00:00.000Z, GET /fleet/vehicles/${veh_t} -> data.fleet_status == \"IN_TRANSIT\", GET /fleet/markets/${mkt_atl} -> data.in_service_unit_count == 0 and GET /fleet/markets/${mkt_dfw} -> data.in_service_unit_count == 0"
            - "RedistributionOrder.${ord_a}.estimated_transport_cost_cents == 61500 (base haul 200 * 250 = 50000, surcharge tier 0.08 -> 4000, plus 7500 handling)"
            - "the first trigger call returns HTTP 200 with data.status == \"CANCELLED\""
            - "after the cancellation GET /fleet/markets/${mkt_atl} -> data.in_service_unit_count == 1 - exactly restored, not 0 and not 2"
            - "after the cancellation GET /fleet/markets/${mkt_dfw} -> data.in_service_unit_count == 0, so the destination counter was never touched by the aborted haul"
            - "after the cancellation GET /fleet/vehicles/${veh_t} -> data.fleet_status == \"IN_SERVICE\", data.current_market_id == \"${mkt_atl}\" and data.odometer_km == 0: the vehicle never left home"
            - "after the cancellation GET /fleet/vehicles/${veh_t}/ledger-entries reports total_count 4 with no row of entry_type TRANSPORT_COST, so the abort posted no cost and reversed none"
            - "RedistributionOrder.${ord_a}.receive_at == null and actual_transport_cost_cents == null after the cancellation"
            - "the completed follow-on haul then moves the census pair rather than duplicating it: GET /fleet/markets/${mkt_atl} -> data.in_service_unit_count == 0 and GET /fleet/markets/${mkt_dfw} -> data.in_service_unit_count == 1"
            - "the census pair sums to 1 at every one of the five observation points (before depart, in transit, after cancel, in transit again, after receive)"
            - "only the completed haul bills: GET /fleet/vehicles/${veh_t}/ledger-entries reports total_count 5 with exactly one TRANSPORT_COST row of amount_cents +61500"
            - "GET /fleet/vehicles/${veh_t} -> data.current_market_id == \"${mkt_dfw}\" and data.odometer_km == 12000 after ${ord_b} is received"
