        distinguishing_aspect: |
          CLOSED-interval semantics on Enrollment: activating a second enrollment whose [coverage_start, coverage_end]
          shares even its endpoint date with an existing ACTIVE enrollment of the same household → ERR_COVERAGE_OVERLAP.
          Closed-closed point-touch is a collision (different interval arithmetic than the half-open redetermination window).
        test_recipe:
          setup:
            - "Household with one ACTIVE enrollment covering 2026-01-01..2026-06-30 (closed), and a second PENDING enrollment for 2026-06-30..2026-12-31 (shares the endpoint date 2026-06-30)."
