  - rule_id: resource_temporal_overlap
    instances:
      - name: ceremony_windows_are_closed_intervals_with_a_sixty_minute_buffer
        grounds:
          - calculations.ceremony_window_occupation
          - validations[priority=91]
          - errors.ERR_CEREMONY_WINDOW_CONFLICT
          - entities.KeyCeremony.fields.window_start
        distinguishing_aspect: |
          Resource entity: HsmPartition. Interval semantics: CLOSED intervals with a
          mandatory 60-minute separation buffer, so ADJACENCY IS A CONFLICT - a gap of
          exactly 60 minutes is rejected and 60 minutes plus one second is accepted. Only
          SCHEDULED, WITNESSED and ATTESTED ceremonies occupy the resource, so aborting a
          ceremony immediately frees its window for a booking inside it.
        test_recipe:
          setup:
            - "One OPERATIONAL partition with ceremony K1 booked over the closed interval [2026-08-01T00:00:00Z, 2026-08-01T02:00:00Z]."
          setup_api_calls:
            - call: "POST /ca/hsm-partitions"
              payload: { label: "part-a", serial: "HSM-0001" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { part_id: $.data.id }
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z", attestation_valid_days: 60 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer1_id: $.data.id }
          trigger:
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-01T03:00:00Z", window_end: "2026-08-01T04:00:00Z", attestation_valid_days: 60 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { err1: $.data.error_id }
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-01T03:00:01Z", window_end: "2026-08-01T04:00:00Z", attestation_valid_days: 60 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer3_id: $.data.id }
            - call: "POST /ca/key-ceremonies/${cer1_id}/abort"
              payload: { reason: "the second key custodian was unavailable" }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-01T00:30:00Z", window_end: "2026-08-01T01:00:00Z", attestation_valid_days: 60 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer4_id: $.data.id }
          assert:
            - "a gap of exactly 60 minutes (K1 ends 02:00, new window starts 03:00): HTTP 409 with error_id ERR_CEREMONY_WINDOW_CONFLICT - adjacency plus the buffer is a conflict because the comparison is <="
            - "a gap of 60 minutes and one second: HTTP 201, KeyCeremony.${cer3_id}.state == SCHEDULED"
            - "after aborting K1: KeyCeremony.${cer1_id}.state == ABORTED and HsmPartition.${part_id}.state is still OPERATIONAL"
            - "a window INSIDE K1's freed interval is accepted (HTTP 201, ${cer4_id}) because ABORTED ceremonies no longer occupy the resource"
            - "${cer4_id}'s window also keeps more than 60 minutes of clearance from ${cer3_id} (01:00 + 60 min < 03:00:01), so the accepted booking is not merely unchecked"
            - "HsmPartition.${part_id}.attested_ceremony_count == 0 throughout (scheduling never attests)"
      - name: crl_series_windows_are_half_open_and_must_overlap
        grounds:
          - calculations.crl_window_coverage
          - validations[priority=94]
          - validations[priority=93]
          - validations[priority=95]
          - entities.CertificateProfile.fields.last_crl_this_update
        distinguishing_aspect: |
          Resource entity: CertificateProfile, with the exact OPPOSITE interval semantics to
          the ceremony rule. CRL windows are HALF-OPEN [this_update, next_update) and overlap
          is MANDATORY rather than forbidden: a window nested inside the previous one is
          rejected for not advancing the series, a window that starts after the previous
          next_update is rejected as a coverage gap, and only a window that both overlaps
          and advances is accepted. Only the most recent publication constrains the next one.
        test_recipe:
          setup:
            - "An ACTIVE DV profile with max_crl_validity_hours 24."
            - "CRL number 1 published over the half-open window [2026-08-01T00:00:00Z, 2026-08-01T12:00:00Z)."
          setup_api_calls:
            - call: "POST /ca/certificate-profiles"
              payload: { name: "dv-crl-2", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 2, org_vetting_reuse_days: 30, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 8000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { prof_id: $.data.id }
            - call: "POST /ca/certificate-profiles/${prof_id}/activate"
              payload: {}
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "GET /ca/certificate-profiles/${prof_id}"
              payload: {}
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { pv1: $.data.version }
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T00:00:00Z", next_update: "2026-08-01T12:00:00Z", expected_profile_version: "${pv1}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
            - call: "GET /ca/certificate-profiles/${prof_id}"
              payload: {}
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T06:00:00Z", next_update: "2026-08-01T11:00:00Z", expected_profile_version: "${pv2}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { err1: $.data.error_id }
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T13:00:00Z", next_update: "2026-08-02T01:00:00Z", expected_profile_version: "${pv2}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { err2: $.data.error_id }
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T11:00:00Z", next_update: "2026-08-02T12:00:00Z", expected_profile_version: "${pv2}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
              captures: { err3: $.data.error_id }
            - call: "POST /ca/certificate-profiles/${prof_id}/crl-publications"
              payload: { this_update: "2026-08-01T11:00:00Z", next_update: "2026-08-01T23:00:00Z", expected_profile_version: "${pv2}" }
              as: REVOCATION_OFFICER
              as_user_id: "u_rev_1"
          assert:
            - "nested window [06:00, 11:00) overlaps generously but does not advance: HTTP 409 with error_id ERR_CRL_WINDOW_NOT_ADVANCING"
            - "window starting after the previous next_update [13:00, 2026-08-02T01:00): HTTP 409 with error_id ERR_CRL_COVERAGE_GAP (the series would leave status service uncovered)"
            - "window [11:00, 2026-08-02T12:00) overlaps by 60 minutes and advances, but spans 25 hours against max_crl_validity_hours 24: HTTP 422 with error_id ERR_CRL_VALIDITY_TOO_LONG, so a legal overlap does not excuse an over-long window"
            - "window [11:00, 23:00) overlaps by 60 minutes, advances past 12:00 and spans 12 hours: HTTP 201 with crl_number == 2"
            - "CertificateProfile.${prof_id}.last_crl_this_update == 2026-08-01T11:00:00Z and last_crl_next_update == 2026-08-01T23:00:00Z"
            - "all three rejections left CertificateProfile.${prof_id}.version untouched, so the single captured ${pv2} satisfies the OCC guard on every attempt"
