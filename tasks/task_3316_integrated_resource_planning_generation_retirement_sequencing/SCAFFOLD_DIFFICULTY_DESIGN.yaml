  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_margin_exact_zero_passes
        grounds:
          - calculations.capacity_margin
          - endpoints.POST_/portfolios/{portfolioId}/snapshots
        distinguishing_aspect: |
          Numeric-threshold boundary on capacity_margin_mw: margin EXACTLY 0.00 meets
          the reliability requirement (>= semantics); with 1150 MW SOLAR (accredited
          460.00) against load 400.00 the margin is 0.00 and meets_requirement == true,
          while load 400.01 flips it to false.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Plan P DRAFT; BASE forecast 2030 with residential 400 only (effective load 400.00); portfolio PF; ACTIVE SOLAR fleet unit 1150 MW (in_service 2020)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Zero", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 400, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2031, residential_mw: 400.01, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-Z", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "SOL-ZERO", resource_type: "SOLAR", nameplate_mw: 1150, in_service_year: 2020, fuel_type: "SUN" }
              as: UtilityPlanner
          trigger:
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
              captures: { m0: $.data.capacity_margin_mw, ok0: $.data.meets_requirement }
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_7: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2031, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pfv_7}" }
              as: UtilityPlanner
              captures: { m1: $.data.capacity_margin_mw, ok1: $.data.meets_requirement }
          assert:
            - "2030 snapshot: capacity_margin_mw == 0.00 and meets_requirement == true (>= boundary inclusive)"
            - "2031 snapshot: capacity_margin_mw == -0.01 and meets_requirement == false"

      - name: comment_window_closes_on_inclusive
        grounds:
          - validations[priority=5]
          - entities.ResourcePlan.fields.comment_window_closes_on
          - endpoints.POST_/plans/{planId}/comments
        distinguishing_aspect: |
          DIFFERENT metric AND endpoint — a DATE-interval boundary instead of a numeric
          threshold: a comment filed with the clock date exactly equal to
          comment_window_closes_on is ACCEPTED (inclusive end), while one day later is
          ERR_COMMENT_WINDOW_CLOSED; and submit-for-review ON closes_on (not after)
          succeeds, pinning >= on the gate.
        test_recipe:
          setup:
            - "Clock 2026-08-01. Plan P1 OPEN_FOR_COMMENT (window [2026-08-01, 2026-08-31]); second identical plan P2 also OPEN_FOR_COMMENT in the same window."
