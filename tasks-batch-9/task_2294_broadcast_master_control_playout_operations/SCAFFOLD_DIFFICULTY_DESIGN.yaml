              captures: { rep39_id: "$.data.id", rep39_score: "$.data.technical_score", rep39_verdict: "$.data.verdict" }
          trigger:
            - call: "POST /assets/${asset_w40_id}/qc-waivers"
              payload: { waived_by_operator_id: "${pd_id}", waiver_justification: "Only usable master available; black frames trimmed in master control." }
              as: ProgramDirector
              as_user_id: "${pd_id}"
            - call: "POST /assets/${asset_w39_id}/qc-waivers"
              payload: { waived_by_operator_id: "${pd_id}", waiver_justification: "Only usable master available; black frames trimmed in master control." }
              as: ProgramDirector
              as_user_id: "${pd_id}"
          assert:
            - "${rep40_score} == 40 and ${rep40_verdict} == FAIL"
            - "${rep39_score} == 39 and ${rep39_verdict} == FAIL"
            - "QCReport.${rep40_id}.defect_penalty_points == 18 and QCReport.${rep40_id}.duration_penalty_points == 30 and QCReport.${rep40_id}.loudness_penalty_points == 12"
            - "QCReport.${rep39_id}.defect_penalty_points == 40 and QCReport.${rep39_id}.duration_penalty_points == 9 and QCReport.${rep39_id}.loudness_penalty_points == 12"
            - "The first trigger call returns HTTP 200 and Asset.${asset_w40_id}.status == QC_WAIVED"
            - "Asset.${asset_w40_id}.waived_by_operator_id == ${pd_id}"
            - "Asset.${asset_w40_id}.technical_score_ingest == 40"
            - "The second trigger call returns HTTP 409 with error_id == ERR_QC_WAIVER_SCORE_TOO_LOW"
            - "Asset.${asset_w39_id}.status == QC_FAILED"
            - "Asset.${asset_w39_id}.waived_by_operator_id == null and Asset.${asset_w39_id}.waiver_justification == null"

  # ===========================================================================
  # RULE 7 — Cross-entity state dependencies
  # Two different entity pairs: (PlaylistItem, Asset) and
  # (Transmitter, TechnicalFault).
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cue_refused_because_the_referenced_asset_was_retracted
        grounds:
          - state_machines.PlaylistItem.SCHEDULED_to_CUED
          - validations[priority=31]
          - errors[ERR_UNCLEARED_CONTENT_ON_AIR]
          - state_machines.Asset.QC_PASSED_to_RETRACTED
          - entities.PlaylistItem.fields.clearance_status
        distinguishing_aspect: |
          Entity pair (PlaylistItem, Asset): whether a PlaylistItem may advance on
          its own playout axis SCHEDULED -> CUED depends entirely on the status of
          a different row — the Asset it points at. Nothing about the item itself
          changes when the asset is retracted, yet the cue must be refused with
          ERR_UNCLEARED_CONTENT_ON_AIR, and substituting a QC_PASSED replacement
          asset (again a change on the Asset side, not the item's playout axis)
          must make the identical cue succeed.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER, MUX-A (total 20000, pilot 500), ACTIVE channel 12.1 (SD_480I, floor 2000, requested 6000, priority_rank 1), air_status ON_AIR, posture NORMAL."
            - "Three QC_PASSED assets, each scored 100: A (expected 900 s), B (expected 900 s) and R (expected 900 s, never placed in any playlist)."
            - "Playlist for 2026-08-01, schedule_start_utc 12:00:00Z, window 1800 s: seq 1 PROGRAM asset A 900 s at 12:00:00Z, seq 2 PROGRAM asset B 900 s at 12:15:00Z; status ON_AIR, both items SCHEDULED and CLEARED."
            - "Asset B has then been retracted, so item seq 2 has clearance_status BLOCKED while its playout_status is still SCHEDULED and Playlist.blocked_item_count == 1."
