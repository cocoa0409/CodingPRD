# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Model Risk Management & Validation.
# Breadth probe: every testable claim §1.1–§1.7 declares that §1.8 does not
# already cover. Sections and claim_types follow references/claim-extraction-guide.md.
# Clock default before any set_current_utc call: 2026-08-01T00:00:00Z.
# User ids (opaque role identities): u_own_a / u_own_b (ModelOwner),
# u_val / u_val_b (ModelValidator), u_cro (ModelRiskOfficer),
# u_rep (RegulatoryReporter), u_admin (PlatformAdmin).
# =============================================================================

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: model_registration_computed_defaults
        claim_type: creation
        grounds:
          - entities.Model
        distinguishing_aspect: "A fully-specified registration returns 201 with server-set owner_user_id, status REGISTERED, DEV_DECLARED risk_score/risk_tier, monitoring_posture NORMAL, open_findings_count 0, version 1."
        test_recipe:
          setup:
            - "Empty DB; clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Reg M", business_unit: "Treasury", declared_complexity: "MEDIUM", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
          assert:
            - "Model.${m_id}.owner_user_id == u_own_a (stamped from X-User-ID)"
            - "Model.${m_id}.status == REGISTERED (initial state)"
            - "Model.${m_id}.risk_score == 50 (20*2 + 10*0 + 10*1) and risk_tier == TIER_2"
            - "Model.${m_id}.monitoring_posture == NORMAL and open_findings_count == 0"
            - "Model.${m_id}.version == 1 and assessed_complexity == null and last_validated_at == null and replaced_by_model_id == null"

      - name: model_is_vendor_model_default_false
        claim_type: defaults
        grounds:
          - entities.Model.fields.is_vendor_model
        distinguishing_aspect: "Omitting optional is_vendor_model at registration applies the declared default false; a subsequent vendor-assessment creation is then rejected with ERR_NOT_A_VENDOR_MODEL."
        test_recipe:
          setup:
            - "Empty DB; clock at default"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Default M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id, m_vendor: $.data.is_vendor_model }
          trigger:
            - call: "POST /mrm/models/${m_id}/vendor-assessments"
              payload: { completeness_score: 80, valid_months: 6 }
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { err: $.data.error_id }
          assert:
            - "captured ${m_vendor} == false (default applied when the field is omitted)"
            - "captured ${err} == ERR_NOT_A_VENDOR_MODEL"

      - name: model_get_returns_stored_entity
        claim_type: retrieval
        grounds:
          - entities.Model
          - endpoints[GET /mrm/models/{id}]
        distinguishing_aspect: "GET by id returns the exact stored fields of the created model."
        test_recipe:
          setup:
            - "Model M registered by u_own_a"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Gettable M", business_unit: "Finance", declared_complexity: "LOW", usage_scope: "ENTERPRISE", exposure_amount: 20000000, is_vendor_model: false }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelValidator
              as_user_id: u_val
              captures: { g_name: $.data.name, g_score: $.data.risk_score, g_tier: $.data.risk_tier }
          assert:
            - "captured ${g_name} == Gettable M"
            - "captured ${g_score} == 70 (20*1 + 10*2 + 10*3) and captured ${g_tier} == TIER_1"

      - name: model_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - endpoints[GET /mrm/models]
        distinguishing_aspect: "List endpoint honors limit/offset and returns pagination fields total_count and has_more per the fixed response envelope."
        test_recipe:
          setup:
            - "Three models registered by u_own_a"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Page M1", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
            - call: "POST /mrm/models"
              payload: { name: "Page M2", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
            - call: "POST /mrm/models"
              payload: { name: "Page M3", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
          trigger:
            - call: "GET /mrm/models?limit=2&offset=0"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
          assert:
            - "response data is an array of length 2"
            - "response meta/envelope carries total_count == 3 and has_more == true"
            - "a second call GET /mrm/models?limit=2&offset=2 returns 1 row and has_more == false"

      - name: model_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "GET on a well-formed but non-existent model id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Exists M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
          trigger:
            - call: "GET /mrm/models/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: model_registration_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=1.5]"
        distinguishing_aspect: "POST /mrm/models without required exposure_amount is rejected with ERR_INVALID_REQUEST before any role/business check."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /mrm/models"
              payload: { name: "NoExposure M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: model_registration_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Model.fields.declared_complexity
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "declared_complexity outside {LOW, MEDIUM, HIGH} fails the enum range check."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /mrm/models"
              payload: { name: "BadEnum M", business_unit: "Risk", declared_complexity: "EXTREME", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: model_exposure_zero_is_valid
        claim_type: type_constraints
        grounds:
          - entities.Model.fields.exposure_amount
        distinguishing_aspect: "exposure_amount == 0 satisfies the >= 0 constraint and maps to the lowest exposure band (1 point)."
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "ZeroExp M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 0 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_score: $.data.risk_score, m_tier: $.data.risk_tier }
          trigger:
            - call: "GET /mrm/models"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
          assert:
            - "captured ${m_score} == 30 (20*1 + 10*0 + 10*1: exposure 0 < 1000000 → 1 point)"
            - "captured ${m_tier} == TIER_3"

      - name: documentation_creation_stamps_submitter_and_status
        claim_type: creation
        grounds:
          - entities.ModelDocumentation
        distinguishing_aspect: "Documentation creation stamps submitted_by_user_id from X-User-ID and starts in SUBMITTED."
        test_recipe:
          setup:
            - "Model M registered by u_own_a"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Doc M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "2.1", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { d_status: $.data.status, d_submitter: $.data.submitted_by_user_id, d_version: $.data.version }
          assert:
            - "captured ${d_status} == SUBMITTED (initial state)"
            - "captured ${d_submitter} == u_own_a"
            - "captured ${d_version} == 1"

      - name: documentation_missing_evidence_flag_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DOCUMENTATION_INCOMPLETE]"
          - "validations[priority=10]"
        distinguishing_aspect: "A documentation package with has_data_lineage false is rejected ERR_DOCUMENTATION_INCOMPLETE; no row is persisted."
        test_recipe:
          setup:
            - "Model M registered by u_own_a"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "DocInc M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: false }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { err: $.data.error_id }
          assert:
            - "captured ${err} == ERR_DOCUMENTATION_INCOMPLETE"
            - "GET /mrm/models/${m_id}/documentations afterwards returns an empty list"

      - name: change_request_creation_stamps_submitter
        claim_type: creation
        grounds:
          - entities.ChangeRequest
          - "concurrency_rules[change-request-stale-model]"
        distinguishing_aspect: "Change-request creation with a fresh expected_model_version succeeds: status SUBMITTED, submitted_by_user_id stamped, Model.version incremented by 1."
        test_recipe:
          setup:
            - "Model M registered by u_own_a; version observed from the create response"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "CR M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id, m_v: $.data.version }
          trigger:
            - call: "POST /mrm/models/${m_id}/change-requests"
              payload: { change_type: "MINOR", description: "retune cutoff", expected_model_version: "${m_v}" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { cr_status: $.data.status, cr_sub: $.data.submitted_by_user_id }
            - call: "GET /mrm/models/${m_id}"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_v_after: $.data.version }
          assert:
            - "captured ${cr_status} == SUBMITTED (initial state)"
            - "captured ${cr_sub} == u_own_a"
            - "captured ${m_v_after} == ${m_v} + 1 (creation increments Model.version)"

      - name: engagement_creation_stamps_validator_and_testing
        claim_type: creation
        grounds:
          - entities.ValidationEngagement
        distinguishing_aspect: "Engagement creation stamps validator_user_id from X-User-ID, starts in TESTING, with completed_at null and outcome null."
        test_recipe:
          setup:
            - "Model M registered by u_own_a with APPROVED documentation"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Eng M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
          trigger:
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: false, period_start: "2026-08-02T00:00:00Z", period_end: "2026-08-09T00:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { e_status: $.data.status, e_val: $.data.validator_user_id, e_completed: $.data.completed_at, e_outcome: $.data.outcome }
          assert:
            - "captured ${e_status} == TESTING (initial state)"
            - "captured ${e_val} == u_val"
            - "captured ${e_completed} == null and captured ${e_outcome} == null"

      - name: finding_creation_sets_source_validation
        claim_type: system_fields
        grounds:
          - entities.Finding.fields.source
        distinguishing_aspect: "A manually raised finding has source VALIDATION and raised_by_user_id stamped from X-User-ID (the literal 'system' is reserved for auto-raised findings)."
        test_recipe:
          setup:
            - "Model M registered by u_own_a"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Find M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /mrm/models/${m_id}/findings"
              payload: { severity: "LOW", title: "manual finding" }
              as: ModelValidator
              as_user_id: u_val
              captures: { f_source: $.data.source, f_raiser: $.data.raised_by_user_id, f_status: $.data.status, f_esc: $.data.escalated_at, f_closed: $.data.closed_at }
          assert:
            - "captured ${f_source} == VALIDATION"
            - "captured ${f_raiser} == u_val"
            - "captured ${f_status} == OPEN (initial state)"
            - "captured ${f_esc} == null and captured ${f_closed} == null"

      - name: metric_creation_initial_state
        claim_type: creation
        grounds:
          - entities.MonitoringMetric
        distinguishing_aspect: "Metric creation on an APPROVED_FOR_USE model starts ACTIVE with consecutive_breach_count 0."
        test_recipe:
          setup:
            - "Model M approved for use (LOW/SINGLE_DESK/100, standard approve chain)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Met M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
          trigger:
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "auc", direction: "BELOW_IS_BREACH", threshold_value: 0.7 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_status: $.data.status, met_cbc: $.data.consecutive_breach_count, met_model: $.data.model_id }
          assert:
            - "captured ${met_status} == ACTIVE (initial state)"
            - "captured ${met_cbc} == 0"
            - "captured ${met_model} == ${m_id} (FK set from path)"

      - name: metric_reading_immutable_no_version_field
        claim_type: immutability
        grounds:
          - entities.MetricReading
        distinguishing_aspect: "MetricReading is common_fields: false — the response carries id and created_at but no version field, and no update endpoint exists for it."
        test_recipe:
          setup:
            - "Approved model M with ACTIVE metric psi (ABOVE 0.25)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "Imm M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "psi", direction: "ABOVE_IS_BREACH", threshold_value: 0.25 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_id: $.data.id }
          trigger:
            - call: "POST /mrm/monitoring-metrics/${met_id}/readings"
              payload: { value: 0.10, observed_at: "2026-08-02T00:00:00Z" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { r_id: $.data.id, r_created: $.data.created_at, r_is_breach: $.data.is_breach }
          assert:
            - "captured ${r_id} is non-null and ${r_created} is non-null"
            - "the response data has no 'version' and no 'updated_at' key (common_fields: false)"
            - "captured ${r_is_breach} == false"

      - name: breach_event_created_with_snapshot_fields
        claim_type: system_fields
        grounds:
          - entities.BreachEvent
        distinguishing_aspect: "A breaching reading creates a BreachEvent whose metric_name is a snapshot of the metric's name and whose breach_value equals the breaching reading's value; status starts OPEN."
        test_recipe:
          setup:
            - "Approved model M with ACTIVE metric psi (ABOVE 0.25)"
          setup_api_calls:
            - call: "POST /mrm/models"
              payload: { name: "BE M", business_unit: "Risk", declared_complexity: "LOW", usage_scope: "SINGLE_DESK", exposure_amount: 100 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { m_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations"
              payload: { version_label: "1.0", has_development_evidence: true, has_testing_evidence: true, has_data_lineage: true }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { doc_id: $.data.id }
            - call: "POST /mrm/models/${m_id}/documentations/${doc_id}/decide"
              payload: { decision: "APPROVE" }
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/validation-engagements"
              payload: { scope_conceptual_soundness: true, scope_outcomes_analysis: true, period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-01T06:00:00Z" }
              as: ModelValidator
              as_user_id: u_val
              captures: { eng_id: $.data.id }
            - call: "POST /mrm/validation-engagements/${eng_id}/complete"
              payload: { outcome: "EFFECTIVE", assessed_complexity: "LOW" }
              as: ModelValidator
              as_user_id: u_val
            - call: "POST /mrm/models/${m_id}/approve"
              payload: {}
              as: ModelRiskOfficer
              as_user_id: u_cro
            - call: "POST /mrm/models/${m_id}/monitoring-metrics"
              payload: { metric_name: "psi", direction: "ABOVE_IS_BREACH", threshold_value: 0.25 }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { met_id: $.data.id }
          trigger:
            - call: "POST /mrm/monitoring-metrics/${met_id}/readings"
              payload: { value: 0.30, observed_at: "2026-08-02T00:00:00Z" }
              as: ModelOwner
              as_user_id: u_own_a
              captures: { r_id: $.data.id }
            - call: "GET /mrm/monitoring-metrics/${met_id}/breach-events"
              payload: {}
              as: ModelOwner
              as_user_id: u_own_a
          assert:
            - "GET breach-events returns exactly 1 row"
            - "row.status == OPEN and row.metric_name == psi (snapshot) and row.breach_value == 0.30"
            - "row.reading_id == captured ${r_id}"
            - "row.metric_id == ${met_id}"

      - name: vendor_assessment_valid_until_computed
        claim_type: computed_fields
        grounds:
          - entities.VendorTransparencyAssessment.fields.valid_until
        distinguishing_aspect: "valid_until = assessed_at + valid_months computed by the system; status starts CURRENT."
        test_recipe:
          setup:
