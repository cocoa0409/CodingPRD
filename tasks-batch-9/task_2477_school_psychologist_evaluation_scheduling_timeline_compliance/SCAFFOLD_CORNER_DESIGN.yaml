          assert:
            - "Before the trigger Psychologist.${pa}.open_case_points == 11 and pressure_index_assigned_basis == 0.55"
            - "Evaluation.${evala}.assessment_status == CANCELLED, compliance_status == WAIVED, and psychologist_id is STILL ${pa} (retained for audit)"
            - "Psychologist.${pa}.open_case_points == 6 — only ${evalb} is in an open status"
            - "Psychologist.${pa}.pressure_index_assigned_basis == 0.30 and pressure_index_clock_weighted == 0.30 (the WAIVED row contributes nothing despite its psychologist_id)"
            - "GET /psych-services/evaluations?psychologist_id=${pa} still returns total_count == 2 — the filter is on the calculation, not on the listing"

      - name: breach_severity_bands_at_five_and_six_days
        claim_type: threshold
        grounds:
          - calculations.compensatory_minutes
          - calculations.compensatory_minutes.constants
          - endpoints["POST /psych-services/compliance-runs"]
        distinguishing_aspect: "One compliance run detects two breaches straddling MINOR_MAX_DAYS: 5 days scores 150/150 with multiplier 1.0, while 6 days jumps to multiplier 1.25 and the two bases diverge (225 vs 190, the latter proving round5 of 187.5 goes UP)."
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; one School; two INITIAL 1-domain referrals, both left in PENDING_ASSIGNMENT (no psychologist needed to breach)."
            - "Referral X consented effective 2026-06-01 (base_due_date 2026-07-31); Referral Y consented effective 2026-05-31 via a clock set to 2026-05-31 first (base_due_date 2026-07-30)."
            - "The clock is then advanced to 2026-08-05T00:00:00Z: X is 65 elapsed days (days_remaining -5), Y is 66 (days_remaining -6)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-31T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
