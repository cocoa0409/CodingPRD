              as: StateReviewer
              as_user_id: "state-1"
              captures: { al1: $.data.id }
            - call: "POST /planning/venues"
              payload: { name: "Eastside Community Center", seated_capacity: 120, turnover_buffer_minutes: 0, ada_accessible: true, transit_served: true }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { ven: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu1}", activity_type: "WORKSHOP", title: "Eastside workshop", start_at: "2026-09-10T18:00:00Z", end_at: "2026-09-10T20:00:00Z", venue_id: "${ven}" }
              as: PlanningStaff
              as_user_id: "staff-1"
              captures: { act1: $.data.id }
            - call: "POST /planning/engagement-activities"
              payload: { plan_update_id: "${pu1}", activity_type: "SURVEY", title: "Citywide survey", start_at: "2026-09-15T00:00:00Z", end_at: "2026-09-30T00:00:00Z" }
              as: PlanningStaff
