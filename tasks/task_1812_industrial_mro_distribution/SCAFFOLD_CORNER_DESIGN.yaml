  # ---------------------------------------------------------------------------
  - section: roles
    instances:
      - name: buyer_cannot_create_item_returns_forbidden
        claim_type: role_exclusive_denied
        grounds: [roles.DistributionAdmin, roles.CustomerBuyer, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Catalog writes are DistributionAdmin-exclusive: CustomerBuyer POST /mro/items fails with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A customer account exists (buyer identity)"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "RB-1", display_name: "Buyer Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /mro/items"
              payload: { sku: "RB-1", description: "Forbidden", item_class: "STOCKED", list_price_cents: 100 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: approver_cannot_create_cart_returns_forbidden
        claim_type: role_exclusive_denied
        grounds: [roles.CustomerApprover, roles.CustomerBuyer, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Cart creation is CustomerBuyer-exclusive: the approver role cannot create carts (peer-role separation in the punch-out chain)."
        test_recipe:
          setup: ["A customer account exists"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "RB-2", display_name: "Approver Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /mro/items"
              payload: { sku: "RB-2", description: "Part", item_class: "STOCKED", list_price_cents: 100 }
              as: DistributionAdmin
