            - "GET /fresh/lots/${lot_long}/markdown-quote returns HTTP 422 with data.error_id == 'ERR_RUNG_NOT_REACHED' (days_remaining 9 exceeds every rung)"

      - name: order_feedback_input_set_excludes_sampling_shrink
        claim_type: input_set_filtering
        grounds:
          - calculations.shrink_history_order_feedback
          - entities.ShrinkEvent.fields.cause_code
          - endpoints[POST /fresh/order-recommendations]
        distinguishing_aspect: |
          Of 6 verified shrink units on a 24-unit lot, only the 2 SPOILAGE units enter the
          feedback loop — the 4 SAMPLING units are a merchandising cost, so shrink_rate_pct is
          8.33 and recommended_order_units 37, not the 25.00 / 27 an unfiltered sum produces.
        test_recipe:
          setup:
            - "The MEAT base chain, but the item allows sampling and forecasts 20.00 units a day."
            - "One 24-unit lot created 2026-08-10; a 2-unit SPOILAGE event and a 4-unit SAMPLING event both recorded by u-clerk-1 and verified by u-mgr-1, leaving 18 units on hand."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:00:00.000Z" }
              as: StoreOperationsAdmin
            - call: "POST /fresh/stores"
              payload: { store_number: "0412", name: "Fresh Market 0412", region_code: "MID-ATL" }
              as: StoreOperationsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /fresh/markdown-ladders"
              payload: { name: "MEAT-STD-2026", department_code: "MEAT", rungs: [{ days_remaining_max: 3, discount_pct: 15, requires_manager_approval: false }, { days_remaining_max: 1, discount_pct: 50, requires_manager_approval: true }] }
              as: StoreOperationsAdmin
              captures: { ladder_id: $.data.id }
