            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 0 }, as: JobberFinance, as_user_id: "fin-1", captures: { s0: "$.data.id", g0: "$.data.gross_scanned_sales_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /settlement-statements", payload: { store_agreement_id: "${agr}", period_index: 1 }, as: JobberFinance, as_user_id: "fin-1", captures: { s1: "$.data.id", g1: "$.data.gross_scanned_sales_cents" } }
          assert:
            - "g0 == 200 (only the 2026-08-07T23:59:59Z scan is inside [2026-08-01, 2026-08-08))"
            - "g1 == 400 (the scan at exactly period_end falls into period 1)"
            - "SettlementStatement.${s0}: period_start == '2026-08-01', period_end == '2026-08-08'"

  # ============================ VALIDATIONS ============================
  - section: validations
    instances:
      - name: auth_missing_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_AUTH_CONTEXT]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails at priority 1 before anything else."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
          trigger:
            - { call: "POST /programs", payload: { name: "NoAuth" }, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MISSING_AUTH_CONTEXT (http 400) — sent with both auth headers stripped"

      - name: price_below_floor_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=22]", "errors[ERR_PRICE_BELOW_FLOOR]"]
        distinguishing_aspect: "Retail price maintenance: a directive at 140 under a 150 floor is rejected (price maintenance)."
        test_recipe:
          setup: ["ACTIVE agreement; product min_retail_cents 150"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "FloorCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "FloorStore", store_code: "FLR", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "FLR-001", name: "Floor Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
          trigger:
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 140, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_PRICE_BELOW_FLOOR (http 422)"

      - name: product_not_in_program_rejected
        claim_type: cross_entity_validation
        grounds: ["validations[priority=23]", "errors[ERR_PRODUCT_NOT_IN_PROGRAM]"]
        distinguishing_aspect: "A directive cannot bind a product owned by a different program than the agreement's."
        test_recipe:
          setup: ["programs A and B; ACTIVE agreement on A; product on B"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "Prog A" }, as: JobberAdmin, captures: { progA: "$.data.id" } }
            - { call: "POST /programs", payload: { name: "Prog B" }, as: JobberAdmin, captures: { progB: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "XStore", store_code: "XS1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${progA}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${progB}", sku: "XB-001", name: "Other Program Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prodB: "$.data.id" } }
          trigger:
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prodB}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_PRODUCT_NOT_IN_PROGRAM (http 422)"

      - name: markdown_cap_exceeded_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=31]", "errors[ERR_MARKDOWN_CAP_EXCEEDED]"]
        distinguishing_aspect: "Markdown credit 100 exceeds the 80-cent cap (0.08 of 1000 current-period gross) at apply."
        test_recipe:
          setup: ["ACTIVE agreement (SHARED 0.5, cap 0.08); directive 200; 5 scans -> gross 1000; MARKDOWN auth units 2 at price 100 approved"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "MdCap" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "MdStore", store_code: "MD1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000, markdown_liability: "SHARED", markdown_jobber_share_pct: 0.5, markdown_cap_pct_of_gross: 0.08 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "MD-001", name: "Markdown Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 5, scanned_at: "2026-08-01T09:00:00Z", client_event_id: "md-1" }, as: RetailerManager, as_user_id: "${store}" }
            - { call: "POST /markdown-authorizations", payload: { store_agreement_id: "${agr}", product_id: "${prod}", auth_type: "MARKDOWN", units: 2, markdown_price_cents: 100 }, as: JobberAdmin, captures: { md: "$.data.id" } }
            - { call: "POST /markdown-authorizations/${md}/approve", payload: {}, as: RetailerManager, as_user_id: "${store}" }
          trigger:
            - { call: "POST /markdown-authorizations/${md}/apply", payload: {}, as: JobberAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_MARKDOWN_CAP_EXCEEDED — raw credit round((200-100)*2*0.5) == 100 > round(0.08*1000) == 80; auth remains APPROVED"

      - name: duplicate_scan_event_rejected
        claim_type: idempotency
        grounds: ["validations[priority=19]", "errors[ERR_DUPLICATE_SCAN_EVENT]"]
        distinguishing_aspect: "client_event_id is an idempotency key per agreement — replaying it is a 409, not a double-counted sale."
        test_recipe:
          setup: ["ACTIVE agreement; directive 200; one scan ingested with client_event_id dup-1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "DupScan" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "DSStore", store_code: "DS1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
            - { call: "POST /agreements/${agr}/accept", payload: {}, as: RetailerManager, as_user_id: "${store}", captures: { agr_v: "$.data.version" } }
            - { call: "POST /products", payload: { program_id: "${prog}", sku: "DS-001", name: "Dup Item", jobber_cost_cents: 100, min_retail_cents: 150, units_per_facing: 12 }, as: JobberAdmin, captures: { prod: "$.data.id" } }
            - { call: "POST /price-directives", payload: { store_agreement_id: "${agr}", product_id: "${prod}", price_cents: 200, effective_from: "2026-08-01T00:00:00Z", expected_store_agreement_version: "${agr_v}" }, as: JobberAdmin }
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 1, scanned_at: "2026-08-01T09:00:00Z", client_event_id: "dup-1" }, as: RetailerManager, as_user_id: "${store}" }
          trigger:
            - { call: "POST /scan-events", payload: { store_agreement_id: "${agr}", product_id: "${prod}", event_type: "SALE", quantity: 1, scanned_at: "2026-08-01T09:00:00Z", client_event_id: "dup-1" }, as: RetailerManager, as_user_id: "${store}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_DUPLICATE_SCAN_EVENT (http 409); balance lifetime_scanned_units stays 1 (no double count)"

      - name: window_inverted_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_WINDOW_INVALID]"]
        distinguishing_aspect: "window_start_date 2026-09-01 >= window_end_date 2026-08-01 fails the half-open order rule."
        test_recipe:
          setup: ["ACTIVE agreement"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "WinCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "WinStore", store_code: "WN1", total_facings: 50 }, as: JobberAdmin, captures: { store: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${store}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agr: "$.data.id" } }
            - { call: "POST /agreements/${agr}/submit", payload: {}, as: JobberAdmin }
