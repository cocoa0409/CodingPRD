            - { call: "POST /api/safety-configurations", payload: { show_event_id: "${show_id}", geofence_radius_m: 200, altitude_hard_ceiling_ft: 300, lost_link_action: "RETURN_TO_HOME", geofence_breach_action: "IMMEDIATE_LAND", battery_rtl_threshold_pct: 30, expected_show_event_version: "${v2}" }, as: ProductionPlanner, as_user_id: "planner-1", captures: { config_id: $.data.id } }
