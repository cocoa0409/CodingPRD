      - name: accuracy_reimbursement_cap_boundary
        claim_type: constants_applied
        grounds: [calculations.accuracy_reimbursement]
        distinguishing_aspect: "Guarantee cap is inclusive: reviewed == claimed == 150000c reimburses exactly the 100000c cap; reviewed == claimed == 100000c also reimburses exactly 100000c (no off-by-one at the cap)."
        test_recipe:
          setup: ["Catalog seeded; account A with ACCEPTED return; claim C1 (150000c) adjudicated at 150000c; claim C2 (100000c) adjudicated at 100000c"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "calc2@x.com", full_name: "Calc Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-1", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa1: $.data.id }
            - call: "POST /tax/_authority/filing-callback"
              payload: { filing_attempt_id: "${fa1}", outcome: "ACCEPTED" }
              as: PlatformOperator
            - call: "POST /tax/returns/${ret_id}/claims"
              payload: { claimed_error_amount_cents: 150000 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { claim1: $.data.id }
            - call: "POST /tax/claims/${claim1}/start-review"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /tax/returns/${ret_id}/claims"
              payload: { claimed_error_amount_cents: 100000 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { claim2: $.data.id }
            - call: "POST /tax/claims/${claim2}/start-review"
              payload: {}
              as: ClaimsAdjuster
          trigger:
            - call: "POST /tax/claims/${claim1}/adjudicate"
              payload: { reviewed_error_amount_cents: 150000 }
              as: ClaimsAdjuster
            - call: "POST /tax/claims/${claim2}/adjudicate"
              payload: { reviewed_error_amount_cents: 100000 }
              as: ClaimsAdjuster
          assert:
            - "AccuracyClaim.${claim1}.status == APPROVED"
            - "AccuracyClaim.${claim1}.reimbursement_cents == 100000 (cap bites: min(150000, 100000))"
            - "AccuracyClaim.${claim2}.status == APPROVED"
            - "AccuracyClaim.${claim2}.reimbursement_cents == 100000 (exactly at the cap, no off-by-one)"

      - name: federal_refund_aggregation_excludes_removed_forms
        claim_type: input_set_filtering
