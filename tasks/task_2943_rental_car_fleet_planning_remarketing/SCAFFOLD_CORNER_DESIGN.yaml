              captures: { plan_v1: $.data.version }
            - call: "POST /fleet/fleet-plans/${plan_atl}/allocations"
              payload: { program_id: "${prg_rsk}", segment_id: "${seg_mid}", unit_count: 1, capitalized_cost_per_unit_cents: 2800000, expected_plan_version: "${plan_v1}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { alloc_i: $.data.id }
            - call: "POST /fleet/purchase-allocations/${alloc_i}/vehicles"
              payload: { vin: "CA26RSKATL001401", current_market_id: "${mkt_atl}" }
              as: FleetPlanner
              as_user_id: "u-plan-1"
              captures: { veh_i: $.data.id }
            - call: "POST /fleet/vehicles/${veh_i}/in-fleet"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_i}/in-fleeting-tasks"
              payload: { task_type: "REGISTRATION", cost_cents: 14000, window_start: "2026-01-05T08:00:00Z", window_end: "2026-01-05T09:00:00Z" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { ti_reg: $.data.id }
            - call: "POST /fleet/in-fleeting-tasks/${ti_reg}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_i}/in-fleeting-tasks"
              payload: { task_type: "LICENSING", cost_cents: 9000, window_start: "2026-01-06T08:00:00Z", window_end: "2026-01-06T09:00:00Z" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { ti_lic: $.data.id }
            - call: "POST /fleet/in-fleeting-tasks/${ti_lic}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "POST /fleet/vehicles/${veh_i}/in-fleeting-tasks"
              payload: { task_type: "PREPARATION", cost_cents: 21000, window_start: "2026-01-07T08:00:00Z", window_end: "2026-01-07T10:00:00Z", bay_code: "B1" }
              as: MarketOperator
              as_user_id: "${mkt_atl}"
              captures: { ti_prep: $.data.id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-15T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "GET /fleet/markets/${mkt_atl}"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
              captures: { mkt_before: $.data.in_service_unit_count }
          trigger:
            - call: "POST /fleet/in-fleeting-tasks/${ti_prep}/complete"
              payload: {}
              as: MarketOperator
              as_user_id: "${mkt_atl}"
            - call: "GET /fleet/vehicles/${veh_i}"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "GET /fleet/purchase-allocations/${alloc_i}"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "GET /fleet/fleet-plans/${plan_atl}"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "GET /fleet/markets/${mkt_atl}"
              payload: {}
              as: FleetController
              as_user_id: "u-ctl-a"
            - call: "GET /fleet/vehicles/${veh_i}/ledger-entries"
              payload: { entry_type: "PREP_COST", limit: 50, offset: 0 }
              as: FleetController
              as_user_id: "u-ctl-a"
          assert:
            - "${mkt_before} == 0 before the trigger"
            - "the completing task's own 200 response already reports status \"COMPLETED\" with a completed_at of \"2026-01-15T00:00:00.000Z\""
            - "the FIRST read of the vehicle reports fleet_status \"IN_SERVICE\" with in_service_at \"2026-01-15T00:00:00.000Z\""
            - "the FIRST read of the allocation reports in_fleeted_count 1 and status \"INFLEETED\""
            - "the FIRST read of the plan reports in_fleeted_unit_count 1 and allocated_unit_count 1"
            - "the FIRST read of the market reports in_service_unit_count 1, one greater than ${mkt_before}"
            - "the PREP_COST ledger listing reports total_count 1 with amount_cents 21000, so the money side is immediate too"
            - "no re-read, retry or reconciliation call was needed anywhere: every derived value was correct on first observation"
