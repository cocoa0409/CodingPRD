  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusive_avail_accepts_touching_windows_rejects_one_second_overlap
        grounds:
          - validations[priority 38]
          - errors.ERR_EXCLUSIVE_AVAIL_CONFLICT
          - entities.InventoryForecast.fields.exclusivity_mode
          - entities.InventoryForecast.fields.available_impressions
          - endpoints[POST /upfront/buys/{buyId}/units]
        distinguishing_aspect: |
          Three unit lines are added to one EXCLUSIVE avail. A window starting exactly at
          another buy's air_window_end is accepted because the interval is half-open, a
          window starting one second before that end instant is refused with
          ERR_EXCLUSIVE_AVAIL_CONFLICT, and the refusal takes no inventory hold - the avail
          ends at 6,000,000 of 20,000,000 impressions, not 2,000,000. A closed-interval
          implementation rejects the first and third calls too.
