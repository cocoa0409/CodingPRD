      - name: density_bracket_threshold_boundary_covered_by_difficulty
        claim_type: threshold
        grounds:
          - calculations.line_class_resolution
          - entities.TariffVersion.fields.density_breaks
        excluded_because:
          difficulty_instance: density_bracket_boundary_15_00_versus_14_99
          rationale: "The inclusive lower bound is tested at exactly 15.00 pcf and at 14.99 pcf in that instance, including the resulting class and charge on both sides; a separate threshold corner would repeat it."

      - name: weight_break_tier_boundary_covered_by_difficulty
        claim_type: tiered_pricing
        grounds:
          - calculations.shipment_charge.constants.WEIGHT_BREAK_FACTORS
        excluded_because:
          difficulty_instance: weight_break_boundary_2000_versus_1999_pounds
          rationale: "The 2000 lb break is tested at the boundary and one pound below it there, with both charges pinned; the marginal-versus-average question is settled by the same pair."

      - name: credit_waterfall_bucket_order_covered_by_difficulty
        claim_type: waterfall_allocation
        grounds:
          - calculations.credit_allocation_waterfall
        excluded_because:
          difficulty_instance: overturn_cascade_dispute_notice_memo_shipment_customer
          rationale: "Bucket order (freight, then fee, then capped interest) and the fact that interest sits outside the ledger identity are both asserted in that cascade, on a fixture whose freight and fee credits are pinned to literals."

      - name: liability_index_decay_covered_by_difficulty
        claim_type: decay_function
        grounds:
          - calculations.shipper_liability_index
        excluded_because:
          difficulty_instance: liability_index_rolling_versus_lifetime_divergence
          rationale: "Per-day decay, the 0.25 floor, the 90-day window filter and the tier read taken only from the rolling variant are all exercised there at a fixed later clock instant."

      - name: notice_variant_divergence_covered_by_difficulty
        claim_type: Variant Divergence
        grounds:
          - calculations.correction_notice_delta.variants
        excluded_because:
          difficulty_instance: notice_provisional_versus_audit_final_delta_divergence
          rationale: "That instance stores both variants on one notice from identical data and pins the divergent literals plus their delta, which is exactly this claim."

      - name: notice_variant_reconciliation_covered_by_difficulty
        claim_type: Reconciliation
        grounds:
          - entities.CorrectionNotice.fields.applied_delta_cents
          - calculations.correction_notice_delta
        excluded_because:
          difficulty_instance: notice_provisional_versus_audit_final_delta_divergence
          rationale: "The same instance shows which variant reaches the ledger at issuance (applied_delta_cents freezes the AUDIT_FINAL figure, never the provisional one) and asserts the resulting assessed_total_cents."

      - name: class_resolution_propagation_covered_by_difficulty
        claim_type: constraint_propagation
        grounds:
          - calculations.line_class_resolution
        excluded_because:
          difficulty_instance: capture_cascade_terminal_line_shipment_notice
          rationale: "Propagation from a measurement through cube, density, bracket, floor, line charge and shipment aggregates to a fired notice is that instance's whole subject, and it reaches a fixed point in one pass."

      - name: deadline_extension_interval_covered_by_difficulty
        claim_type: interval_merge
        grounds:
          - calculations.dispute_window_deadline
        excluded_because:
          difficulty_instance: dispute_supplement_cycle_bounded_by_max_rounds
          rationale: "Each supplement request's 7-day extension of dispute_deadline_at is asserted lap by lap there, with the extension cap reached on the same lap that hits the round cap."

