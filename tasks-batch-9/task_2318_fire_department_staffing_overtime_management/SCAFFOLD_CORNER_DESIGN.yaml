            - "HOP 3: a new Vacancy exists with driver == \"INJURY\", driver_source_id == ${ff131b}, status \"OPEN\" (GET /fire-ops/vacancies?duty_shift_id=${sh131}&driver=INJURY → total_count == 1)"
            - "HOP 4: DutyShift.${sh131}.status == \"HIRING\", open_vacancy_count == 1, assigned_headcount == 1, staffing_gap == 0, staffing_posture == \"FULLY_STAFFED\" — an open backfill seat coexists with a zero headcount gap"
            - "HOP 5: WorkPeriod.${wp131b}.scheduled_hours == 0 and flsa_premium_cents == 0"
            - "HOP 6: the academy signal reports open_vacancy_seats == 1, injury_headcount == 1, raw_need == 3, recommended_recruit_count == 1, signal_tier == \"MONITOR\""
            - "Station.${st131}.ot_committed_cents == 0 throughout — no premium was on either seat"

      - name: third_declined_offer_passes_the_member_and_empties_the_candidate_pool
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.offer_expiry_sweep.constants.OT_PASS_LIMIT
          - state_machines.Vacancy.OFFERING_to_OPEN
          - calculations.hiring_order_selector
          - errors[ERR_NO_ELIGIBLE_CANDIDATE]
        distinguishing_aspect: "Two declines leave the member AVAILABLE with ot_pass_count 2; the third decline reaches OT_PASS_LIMIT and flips roster_standing to PASSED, after which the only remaining vacancy cannot be offered at all and returns ERR_NO_ELIGIBLE_CANDIDATE — and the declined hours are still charged each time."
        test_recipe:
          setup:
            - "Station 132 with floor 1, budget 900000, one company ENGINE-132 (crew 4, no required certifications) and a VOLUNTARY_OT roster scoped NONE."
            - "The only member ff132 (platoon D, Kelly 1, rate 4000) starts with voluntary_ot_hours_charged 0, ot_pass_count 0 and roster_standing AVAILABLE."
            - "The 2026-08-11 shift (platoon C) is published, minting four OPEN vacancies requiring NONE."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 132", battalion_code: "G5", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 900000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st132: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st132}", unit_designation: "ENGINE-132", apparatus_type: "ENGINE", minimum_crew_size: 4, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng132: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st132}", full_name: "W Wender", rank: "FIREFIGHTER", platoon: "D", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff132: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st132}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
              captures: { r132: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st132}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh132: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh132}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh132}", status: "OPEN" }
              as: StaffingOfficer
              captures: { v132a: "$.data[0].id", v132b: "$.data[1].id", v132c: "$.data[2].id", v132d: "$.data[3].id" }
          trigger:
            - call: "POST /fire-ops/vacancies/${v132a}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { o132a: "$.data.id" }
            - call: "POST /fire-ops/overtime-offers/${o132a}/response"
              payload: { response: "DECLINE" }
              as: Firefighter
              as_user_id: "${ff132}"
            - call: "POST /fire-ops/vacancies/${v132b}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { o132b: "$.data.id" }
            - call: "POST /fire-ops/overtime-offers/${o132b}/response"
              payload: { response: "DECLINE" }
              as: Firefighter
              as_user_id: "${ff132}"
            - call: "POST /fire-ops/vacancies/${v132c}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { o132c: "$.data.id" }
            - call: "POST /fire-ops/overtime-offers/${o132c}/response"
              payload: { response: "DECLINE" }
              as: Firefighter
              as_user_id: "${ff132}"
            - call: "POST /fire-ops/vacancies/${v132d}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { err132: "$.data.error_id" }
          assert:
            - "AFTER DECLINE 1: OvertimeOffer.${o132a}.status == \"DECLINED\", Vacancy.${v132a}.status == \"OPEN\", Firefighter.${ff132}.ot_pass_count == 1, voluntary_ot_hours_charged == 24, roster_standing == \"AVAILABLE\""
            - "AFTER DECLINE 2: ot_pass_count == 2, voluntary_ot_hours_charged == 48, roster_standing still \"AVAILABLE\" — the limit is 3, so two passes do not trip it"
            - "AFTER DECLINE 3: ot_pass_count == 3, voluntary_ot_hours_charged == 72, roster_standing == \"PASSED\""
            - "FOURTH OFFER: HTTP 422 and ${err132} == \"ERR_NO_ELIGIBLE_CANDIDATE\" — the only member is excluded from the VOLUNTARY pool"
            - "Vacancy.${v132d}.status == \"OPEN\" and HiringRoster.${r132}.dispatch_count == 3 — the refused dispatch is not counted"
            - "Station.${st132}.ot_committed_cents == 0 and budget_posture == \"WITHIN\" — every declined encumbrance was credited back"
            - "DutyShift.${sh132}.open_vacancy_count == 4 and status == \"HIRING\""

      - name: hiring_order_tie_breaks_on_seniority_then_yields_to_fewest_charged_hours
        claim_type: selector_policy
        grounds:
          - calculations.hiring_order_selector
          - entities.Firefighter.fields.voluntary_ot_hours_charged
          - endpoints["POST /fire-ops/vacancies/{vacancy_id}/offer"]
        distinguishing_aspect: "With both members on zero charged hours the selector breaks the tie on seniority (the senior member is offered first), but once the senior member carries 24 charged hours against the junior member's 4, the next shift's offer goes to the junior member — fairness hours dominate seniority, which only breaks ties."
        test_recipe:
          setup:
            - "Station 133 with floor 1, budget 900000, one company ENGINE-133 (crew 2, no required certifications) and a VOLUNTARY_OT roster scoped NONE."
            - "Members ff133a (seniority 1) and ff133b (seniority 2), both platoon D, Kelly 1, rate 4000, both with zero charged hours."
            - "Two shifts are published: 2026-08-11 (platoon C) with two OPEN vacancies and 2026-08-12 (platoon D) with two OPEN vacancies."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 133", battalion_code: "G5", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 900000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st133: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st133}", unit_designation: "ENGINE-133", apparatus_type: "ENGINE", minimum_crew_size: 2, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng133: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st133}", full_name: "X Xiong", rank: "FIREFIGHTER", platoon: "D", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff133a: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st133}", full_name: "Y Yerby", rank: "FIREFIGHTER", platoon: "D", seniority_rank: 2, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff133b: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st133}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st133}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh133a: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh133a}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh133a}", status: "OPEN" }
              as: StaffingOfficer
              captures: { v133a1: "$.data[0].id", v133a2: "$.data[1].id" }
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st133}", shift_date: "2026-08-12", platoon: "D" }
              as: StaffingOfficer
              captures: { sh133b: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh133b}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh133b}", status: "OPEN" }
              as: StaffingOfficer
              captures: { v133b1: "$.data[0].id" }
          trigger:
            - call: "POST /fire-ops/vacancies/${v133a1}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { o133a: "$.data.id", o133a_ff: "$.data.firefighter_id" }
            - call: "POST /fire-ops/overtime-offers/${o133a}/response"
              payload: { response: "ACCEPT" }
              as: Firefighter
              as_user_id: "${ff133a}"
            - call: "POST /fire-ops/vacancies/${v133a2}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 4 }
              as: StaffingOfficer
              captures: { o133b: "$.data.id", o133b_ff: "$.data.firefighter_id" }
            - call: "POST /fire-ops/overtime-offers/${o133b}/response"
              payload: { response: "ACCEPT" }
              as: Firefighter
              as_user_id: "${ff133b}"
            - call: "POST /fire-ops/vacancies/${v133b1}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { o133c: "$.data.id", o133c_ff: "$.data.firefighter_id" }
          assert:
            - "TIE ON ZERO HOURS: ${o133a_ff} == ${ff133a} — seniority 1 breaks the tie; projected_cost_cents == 144000"
            - "SECOND SEAT ON THE SAME SHIFT: ${o133b_ff} == ${ff133b} — ${ff133a} now holds a SCHEDULED seat on that shift and is filtered out; projected_cost_cents == 24000 (4000 * 4 * 1.5, the VOLUNTARY mode minimum being 0)"
            - "AFTER BOTH ACCEPTS: Firefighter.${ff133a}.voluntary_ot_hours_charged == 24 and Firefighter.${ff133b}.voluntary_ot_hours_charged == 4"
            - "NEXT SHIFT: ${o133c_ff} == ${ff133b} — 4 charged hours outrank seniority 1's 24, so the junior member is offered first"
            - "NEXT SHIFT: OvertimeOffer.${o133c}.projected_cost_cents == 144000 — no fatigue premium, because his 4-hour tour on 2026-08-11 ended at 12:00 and leaves a gap before 2026-08-12"
            - "Station.${st133}.ot_committed_cents == 312000 (144000 + 24000 + 144000) and budget_posture == \"WITHIN\""

      - name: corner_dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.station_overtime_forecast.variants
          - calculations.flsa_work_period_overtime.variants
        excluded_because:
          difficulty_instance: forecast_variant_divergence_on_station_fiscal_projection
          rationale: "Both dual-variant calculations are covered by dedicated §1.8 instances (the named one for the forecast and flsa_period_priced_on_scheduled_versus_worked_basis for the work period), each asserting both variants and the delta."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: every_derived_field_is_visible_in_the_same_request_that_causes_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Vacancy.OFFERING_to_FILLED
          - calculations.ot_committed_ledger
          - calculations.staffing_posture
        distinguishing_aspect: "No sweep, staffing-run or second write is interposed: the acceptance response itself reports ACCEPTED, and the immediately following reads already show the seat, the FILLED vacancy, the STAFFED shift, the re-priced work period and the station ledger — nothing lags behind a reconciliation pass."
        test_recipe:
          setup:
            - "Station 134 with floor 1, budget 900000, one company ENGINE-134 (crew 1, no required certifications) and a VOLUNTARY_OT roster scoped NONE."
            - "Member ff134 (platoon D, Kelly 1, rate 4000) holds an OFFERED VOLUNTARY 24-hour offer on the published 2026-08-11 shift; ot_committed_cents is 144000 and the shift is HIRING."
          setup_api_calls:
            - call: "POST /fire-ops/stations"
              payload: { name: "Station 134", battalion_code: "G6", minimum_staffing_floor: 1, fiscal_ot_budget_cents: 900000, fiscal_period_start_date: "2026-08-01", fiscal_period_end_date: "2026-08-31" }
              as: StaffingOfficer
              captures: { st134: "$.data.id" }
            - call: "POST /fire-ops/apparatus"
              payload: { station_id: "${st134}", unit_designation: "ENGINE-134", apparatus_type: "ENGINE", minimum_crew_size: 1, required_certifications: [], closure_priority: 10 }
              as: StaffingOfficer
              captures: { eng134: "$.data.id" }
            - call: "POST /fire-ops/firefighters"
              payload: { station_id: "${st134}", full_name: "Z Zorn", rank: "FIREFIGHTER", platoon: "D", seniority_rank: 1, kelly_day_cycle_position: 1, certifications: [], hourly_rate_cents: 4000 }
              as: StaffingOfficer
              captures: { ff134: "$.data.id" }
            - call: "POST /fire-ops/hiring-rosters"
              payload: { station_id: "${st134}", roster_type: "VOLUNTARY_OT", certification_scope: "NONE" }
              as: StaffingOfficer
            - call: "POST /fire-ops/duty-shifts"
              payload: { station_id: "${st134}", shift_date: "2026-08-11", platoon: "C" }
              as: StaffingOfficer
              captures: { sh134: "$.data.id" }
            - call: "POST /fire-ops/duty-shifts/${sh134}/publish"
              payload: {}
              as: StaffingOfficer
            - call: "GET /fire-ops/vacancies"
              payload: { duty_shift_id: "${sh134}", status: "OPEN" }
              as: StaffingOfficer
              captures: { vac134: "$.data[0].id" }
            - call: "POST /fire-ops/vacancies/${vac134}/offer"
              payload: { hiring_mode: "VOLUNTARY", offer_hours: 24 }
              as: StaffingOfficer
              captures: { off134: "$.data.id" }
            - call: "GET /fire-ops/work-periods"
              payload: { firefighter_id: "${ff134}" }
              as: PayrollAnalyst
              captures: { wp134: "$.data[0].id" }
          trigger:
            - call: "POST /fire-ops/overtime-offers/${off134}/response"
              payload: { response: "ACCEPT" }
              as: Firefighter
