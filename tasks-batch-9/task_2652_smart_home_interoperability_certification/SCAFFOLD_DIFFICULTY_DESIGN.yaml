            - call: "POST /listings/${listing_id}/firmware-revisions"
              payload: { firmware_version: "1.2.0", changed_feature_codes: ["CORE_ONOFF", "CORE_DIM", "OPT_SCENE"], security_change: false, expected_listing_version: "${listing_v2}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { listing_v3: $.data.version }
            - call: "POST /listings/${listing_id}/firmware-revisions"
              payload: { firmware_version: "1.3.0", changed_feature_codes: [], security_change: true, expected_listing_version: "${listing_v3}" }
              as: Member
              as_user_id: "${m1_id}"
          assert:
            - "CertificationListing.${listing_id}.declared_features == [\"CORE_DIM\", \"CORE_ONOFF\", \"OPT_COLOR\", \"OPT_SCENE\"] (feature_code ASC)"
            - "Revision 1 (overlap of EXACTLY 2 == FULL_RECERT_FEATURE_DELTA_THRESHOLD): recert_classification == DELTA, recert_trigger_reason == FIRMWARE_FEATURE_DELTA, recertification_due_at == \"2026-12-09T00:00:00Z\" (2026-09-10 + 90 days)"
            - "Revision 1 leaves the rest alone: publication_status == PUBLISHED, CertificationSubmission.${sub_id}.dac_state == ISSUED, latest_firmware_version == \"1.1.0\", firmware_revision_count == 1"
            - "Revision 2 (overlap of 3, one more than the threshold): recert_classification == FULL, recert_trigger_reason == FIRMWARE_SECURITY_CHANGE, recertification_due_at == \"2026-10-10T00:00:00Z\" (2026-09-10 + 30 days)"
            - "Revision 2 side effects: CertificationListing.${listing_id}.publication_status == SUPPRESSED and CertificationSubmission.${sub_id}.dac_state == REVOKED, while compliance_status stays COMPLIANT"
            - "Revision 3 (empty overlap, security_change true, but the specification is SB1 so R1 does not fire): recert_classification == NONE and recertification_due_at is STILL \"2026-10-10T00:00:00Z\" - a NONE classification never rewrites the deadline"
            - "Revision 3 always-applied effects: latest_firmware_version == \"1.3.0\" and firmware_revision_count == 3"
            - "recert_trigger_reason is still FIRMWARE_SECURITY_CHANGE after revision 3 (unchanged, exactly like the deadline)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: session_start_refused_while_its_laboratory_sits_suspended
        grounds:
          - state_machines[TestSession#state].transitions[SCHEDULED->IN_PROGRESS].preconditions
          - state_machines[TestLaboratory#accreditation_status]
          - validations[priority=15]
          - errors[ERR_INVALID_LABORATORY_STATE]
        distinguishing_aspect: |
          ENTITY PAIR 1 - (TestSession, TestLaboratory). The session's own state is a perfectly legal
          SCHEDULED and its parent TestPlan is a perfectly legal ISSUED; the ONLY thing standing in the
          way is a sibling entity's accreditation_status. Suspending the laboratory freezes an
          already-booked session without touching it (reserved_bench_minutes stays put and the session
          stays SCHEDULED), and reinstating the laboratory unfreezes the very same session with no
          re-booking. Both the refusal and the later success are exercised on ONE session row.
        test_recipe:
          setup:
            - "One RATIFIED SB1 specification with LIGHTING feature sets CORE_ONOFF (MANDATORY 20) and CORE_DIM (MANDATORY 10)."
            - "One Member in good standing with 1000000 cents; one IN_REVIEW CertificationSubmission with an ISSUED TestPlan."
            - "One AUTHORIZED TestLaboratory with bench_capacity 2 (ceiling 1200 minutes)."
            - "One SCHEDULED TestSession on bench 1 over 2026-09-02T09:00:00Z..13:00:00Z, so reserved_minutes is 240 and the laboratory holds 240."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /specifications"
