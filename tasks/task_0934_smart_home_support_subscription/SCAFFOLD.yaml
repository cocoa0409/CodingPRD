scenario: "934. Smart-Home Support Subscription: device inventory & onboarding, remote troubleshooting & ticket, install visit & scheduling, subscription tier & SLA, firmware/security update, add-on device sale, warranty/RMA routing, satisfaction"
domain_name: "smart-home-support-subscription"
api_prefix: "/smart-home-support"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Devices, Tickets, Visits, Rollouts, RmaCases and ServiceCredits form a
  # many-to-many reference web anchored on Household; RmaCase is self-referential
  # (supersedes_rma_id), and Ticket references both Device and HouseholdMember.

  state_machine_shape: parallel
  # Ticket carries three independent axes (workflow_status x sla_status x
  # dispatch_status); Device carries two (lifecycle_status x firmware_status).
  # Several axes are cyclic (AWAITING_CUSTOMER <-> REMOTE_DIAG,
  # RESOLVED -> REOPENED -> REMOTE_DIAG, ROLLED_BACK -> PENDING,
  # SUSPENDED -> ACTIVE) and Visit / RmaCase are fork-join branching.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic

  role_model: peer_roles
  # Household-scoped roles (Owner / Member / BillingAdmin) own household rows;
  # SupportAgent owns ticket + remote-session rows; Technician owns slot + visit
  # rows; PlatformAdmin owns catalog / plan / campaign / clock rows.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# Domain constants — every named constant used anywhere in this scaffold has an
# explicit value here. No constant is referenced by name without a value.
# ---------------------------------------------------------------------------
domain_constants:
  CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"

  # --- coverage window (SLA clock) ---
  BUSINESS_HOURS_START_UTC_MINUTE: 540          # 09:00 UTC, inclusive
  BUSINESS_HOURS_END_UTC_MINUTE: 1020           # 17:00 UTC, exclusive
  BUSINESS_HOURS_APPLY_ON_WEEKENDS: true        # coverage window applies every calendar day; no weekday exclusion
  SLA_AT_RISK_PCT: 0.80                         # counted >= 0.80 * target and < target => AT_RISK

  # --- SLA breach credit ---
  SLA_BREACH_TIER_MINOR_MAX_RATIO: 0.25         # ratio <= 0.25 => MINOR
  SLA_BREACH_TIER_MAJOR_MAX_RATIO: 1.00         # 0.25 < ratio <= 1.00 => MAJOR; > 1.00 => SEVERE
  SLA_CREDIT_PCT_MINOR: 0.05
  SLA_CREDIT_PCT_MAJOR: 0.15
  SLA_CREDIT_PCT_SEVERE: 0.30
  CREDIT_CAP_PCT_OF_MONTHLY_FEE: 0.50           # cap = floor(monthly_fee_cents * 0.50) per billing cycle

  # --- satisfaction survey ---
  CSAT_SURVEY_WINDOW_HOURS: 72
  CSAT_LOW_SCORE_MAX: 2                         # score <= 2 is "low"
  CSAT_BREACH_COMPOUNDED_CREDIT_PCT: 0.10
  CSAT_GOODWILL_CREDIT_PCT: 0.05                # PRO tier only, no SLA breach

  # --- device onboarding ---
  ACTIVATION_TOKEN_TTL_MINUTES: 1440
  ACTIVATION_MAX_ATTEMPTS: 3

  # --- remote troubleshooting escalation ---
  REMOTE_FAILURE_ESCALATION_COUNT: 3            # the 3rd FAILED session auto-escalates

  # --- visit scheduling ---
  TRAVEL_BUFFER_MINUTES: 45
  LATE_CANCEL_CUTOFF_HOURS: 24
  LATE_CANCEL_FEE_CENTS: 4500
  NO_SHOW_FEE_CENTS: 9000

  # --- firmware campaigns ---
  FIRMWARE_DEFAULT_HALT_FAILURE_RATE_PCT: 0.20  # ring failure rate >= this halts the campaign
  FIRMWARE_MAX_RETRY_COUNT: 2
  FIRMWARE_DEFER_MAX_DAYS: 14

  # --- add-on sale / billing ---
  BILLING_CYCLE_DAYS: 30
  PRORATION_MIN_DAYS: 5                         # days_remaining >= 5 => MID_CYCLE_PRORATED, else NEXT_CYCLE_FULL
  BUNDLE_DISCOUNT_TIER1_MIN_SUBTOTAL_CENTS: 20000
  BUNDLE_DISCOUNT_TIER1_PCT: 0.10
  BUNDLE_DISCOUNT_TIER2_MIN_SUBTOTAL_CENTS: 50000
  BUNDLE_DISCOUNT_TIER2_PCT: 0.15
  INSTALL_VISIT_FEE_CENTS: 12900                # charged per install-requiring unit not covered by an install credit
  ADDON_ORDER_MAX_LINES: 5

  # --- warranty / RMA ---
  ADVANCE_REPLACEMENT_HOLD_PCT_OF_MSRP: 0.60
  ADVANCE_REPLACEMENT_MIN_WARRANTY_DAYS: 30     # CAMERA / LOCK advance-replacement eligibility floor
  RMA_RETURN_WINDOW_DAYS: 14

  # --- ticket lifecycle ---
  TICKET_REOPEN_WINDOW_HOURS: 168

  # --- rounding ---
  MONEY_ROUNDING_MODE: "round_half_up"
  MONEY_ROUNDING_UNIT: "integer cents"

# ---------------------------------------------------------------------------
# Ordered write gates. Evaluated top-to-bottom AFTER auth/authz/existence and
# BEFORE any state-machine `from:` check or business rule. The first gate whose
# condition holds wins; lower gates and all downstream state errors are never
# reported for that request.
# ---------------------------------------------------------------------------
gate_precedence:
  - order: 1
    gate_id: account_suspended
    condition: "Household.account_status == SUSPENDED for the household that scopes the target row"
    error_id: ERR_ACCOUNT_SUSPENDED
    applies_to: "every mutating endpoint whose target row resolves to a Household, except POST /households/{id}/account-status"
  - order: 2
    gate_id: device_decommissioned
    condition: "the resolved Device.lifecycle_status == DECOMMISSIONED"
    error_id: ERR_DEVICE_DECOMMISSIONED
    applies_to: "every mutating endpoint whose target row resolves to a Device (device actions, ticket creation with device_id, RMA open, rollout actions)"
  - order: 3
    gate_id: ticket_closed
    condition: "the resolved Ticket.workflow_status == CLOSED"
    error_id: ERR_TICKET_CLOSED
    applies_to: "every mutating endpoint whose target row resolves to a Ticket, except POST /tickets/{id}/survey"
  - order: 4
    gate_id: subscription_cancelled
    condition: "the household's Subscription.status == CANCELLED"
    error_id: ERR_SUBSCRIPTION_CANCELLED
    applies_to: "every mutating endpoint whose target row resolves to a Household, except POST /households/{id}/account-status and POST /subscriptions"

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Household display name."
        constraints: "1-120 characters"
      - name: region_code
        type: string
        source: input
        description: "Dispatch region; a Visit may only be booked into a VisitSlot whose region_code equals this value."
        constraints: "exactly 3 uppercase letters, e.g. NW1 is invalid, NWA is valid"
      - name: billing_email
        type: string
        source: input
        description: "Billing contact email."
      - name: account_status
        type: enum
        source: system
        description: "Global write gate 1 axis."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | CLOSED"
      - name: suspended_at
        type: datetime
        source: system
        description: "Logical-clock instant at which account_status last became SUSPENDED; null when never suspended."
      - name: entitled_device_count
        type: integer
        source: computed
        description: "Count of Device rows with household_id == this.id and lifecycle_status IN {CLAIMED, ACTIVE, SERVICE_HOLD, SUSPENDED_RMA, TRANSFER_PENDING}. This is the count the tier entitlement cap is measured against."
        default: 0
      - name: active_device_count
        type: integer
        source: computed
        description: "Count of Device rows with household_id == this.id and lifecycle_status IN {ACTIVE, SERVICE_HOLD, SUSPENDED_RMA}."
        default: 0

  - name: HouseholdMember
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this member acts inside. Row-scope for Owner / Member / BillingAdmin is this value."
      - name: full_name
        type: string
        source: input
        description: "Member display name."
      - name: email
        type: string
        source: input
        description: "Member email."
      - name: member_role
        type: enum
        source: input
        description: "Which household role this member holds; must equal the X-User-Role header value the member authenticates with."
        constraints: "OWNER | MEMBER | BILLING_ADMIN"
      - name: is_active
        type: boolean
        source: system
        description: "False once the member row is deactivated; deactivated members fail row-scope checks."
        default: true

  - name: SubscriptionPlan
    parent: null
    common_fields: false
    fields:
      - name: tier
        type: enum
        source: input
        description: "Subscription tier this plan defines."
        constraints: "BASIC | PLUS | PRO"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring monthly fee in integer cents; the base for every SLA/CSAT credit percentage."
        constraints: ">= 0"
      - name: included_device_count
        type: integer
        source: input
        description: "Number of devices covered before overage applies."
        constraints: ">= 1"
      - name: overage_fee_cents_per_device
        type: integer
        source: input
        description: "Monthly fee per device beyond included_device_count."
        constraints: ">= 0"
      - name: coverage_mode
        type: enum
        source: input
        description: "Which wall-clock minutes count toward SLA targets."
        constraints: "BUSINESS_HOURS | TWENTY_FOUR_SEVEN"
      - name: first_response_minutes_p1
        type: integer
        source: input
        description: "First-response SLA target in counted minutes for severity P1."
        constraints: ">= 1"
      - name: first_response_minutes_p2
        type: integer
        source: input
        description: "First-response SLA target in counted minutes for severity P2."
        constraints: ">= 1"
      - name: first_response_minutes_p3
        type: integer
        source: input
        description: "First-response SLA target in counted minutes for severity P3."
        constraints: ">= 1"
      - name: onsite_resolution_hours_p1
        type: integer
        source: input
        description: "Onsite-resolution SLA target in counted hours for severity P1."
        constraints: ">= 1"
      - name: onsite_resolution_hours_p2
        type: integer
        source: input
        description: "Onsite-resolution SLA target in counted hours for severity P2."
        constraints: ">= 1"
      - name: onsite_resolution_hours_p3
        type: integer
        source: input
        description: "Onsite-resolution SLA target in counted hours for severity P3."
        constraints: ">= 1"
      - name: warranty_extension_months
        type: integer
        source: input
        description: "Months added to a device's base warranty term while this plan is the household's active plan at claim time."
        constraints: ">= 0"
      - name: included_install_credits
        type: integer
        source: input
        description: "Install credits granted at subscription creation and re-granted at every close-cycle."
        constraints: ">= 0"
      - name: advance_replacement_eligible
        type: boolean
        source: input
        description: "Whether households on this plan may be routed to ADVANCE_REPLACEMENT on an RMA."

  - name: Subscription
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; exactly one non-CANCELLED Subscription per household."
      - name: plan_id
        type: string
        source: input
        description: "FK -> SubscriptionPlan.id; the plan currently in force."
      - name: pending_tier_plan_id
        type: string
        source: system
        description: "FK -> SubscriptionPlan.id; plan scheduled to take effect at the next close-cycle for a deferred downgrade. Null when no downgrade is pending."
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle axis."
        default: ACTIVE
        constraints: "ACTIVE | PAST_DUE | SUSPENDED | CANCEL_PENDING | CANCELLED"
      - name: allow_overage
        type: boolean
        source: input
        description: "Plan flag: when true a device claim beyond included_device_count converts to a per-device overage charge; when false it is rejected."
        default: false
      - name: cycle_index
        type: integer
        source: system
        description: "1-based billing cycle counter; incremented by POST /subscriptions/{id}/close-cycle."
        default: 1
      - name: cycle_start_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the current billing cycle began."
      - name: cycle_end_at
        type: datetime
        source: computed
        description: "cycle_start_at + BILLING_CYCLE_DAYS (30) days."
      - name: monthly_fee_cents
        type: integer
        source: computed
        description: "Copied from the in-force SubscriptionPlan.monthly_fee_cents at creation and re-pinned on every tier change that takes effect immediately."
      - name: install_credits_granted
        type: integer
        source: computed
        description: "Cumulative install credits granted across all cycles of this subscription."
        default: 0
      - name: install_credits_consumed
        type: integer
        source: computed
        description: "Cumulative install credits consumed by add-on orders."
        default: 0
      - name: install_credits_remaining
        type: integer
        source: computed
        description: "install_credits_granted - install_credits_consumed; never negative."
        default: 0
      - name: overage_device_count
        type: integer
        source: computed
        description: "Count of Device rows for this household with is_overage == true and lifecycle_status IN {CLAIMED, ACTIVE, SERVICE_HOLD, SUSPENDED_RMA, TRANSFER_PENDING}."
        default: 0
      - name: overage_charges_cents_this_cycle
        type: integer
        source: computed
        description: "Sum of overage charges booked in the current cycle_index; reset to 0 by close-cycle."
        default: 0
      - name: credits_issued_cents_this_cycle
        type: integer
        source: computed
        description: "Sum of ServiceCredit.amount_cents rows with this subscription_id and cycle_index == this.cycle_index; reset to 0 by close-cycle."
        default: 0
      - name: next_invoice_credit_cents
        type: integer
        source: computed
        description: "Credits accrued in the current cycle that will be applied to the next invoice."
        default: 0
      - name: next_invoice_adjustment_cents
        type: integer
        source: computed
        description: "Sum of chargeable adjustments booked in the current cycle: overage charges, add-on order totals, late-cancel and no-show fees, and charged advance-replacement holds."
        default: 0

  - name: DeviceCatalogEntry
    parent: null
    common_fields: false
    fields:
      - name: model_code
        type: string
        source: input
        description: "Catalog model code; globally unique."
        constraints: "1-40 characters, unique across all DeviceCatalogEntry rows"
      - name: display_name
        type: string
        source: input
        description: "Human-readable model name."
      - name: device_class
        type: enum
        source: input
        description: "Device class; one of the three inputs to RMA routing."
        constraints: "HUB | CAMERA | SENSOR | THERMOSTAT | LOCK"
      - name: serial_prefix
        type: string
        source: input
        description: "Every claimed serial_number for this model must start with this literal prefix."
        constraints: "2-8 uppercase alphanumeric characters"
      - name: base_warranty_months
        type: integer
        source: input
        description: "Base warranty term in whole months measured from Device.purchase_date."
        constraints: ">= 0"
      - name: requires_install
        type: boolean
        source: input
        description: "Whether a unit of this model consumes an install credit (or an install charge) when sold as an add-on."
      - name: manufacturer_service_only
        type: boolean
        source: input
        description: "When true, an in-warranty RMA that is not advance-replacement eligible routes to MANUFACTURER instead of IN_HOUSE_DEPOT."
      - name: msrp_cents
        type: integer
        source: input
        description: "List price in integer cents; the base for bundle subtotal and for the advance-replacement hold."
        constraints: ">= 0"
      - name: current_firmware_version
        type: string
        source: input
        description: "Firmware version stamped on a newly activated device of this model."

  - name: Device
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household that currently owns this device."
      - name: catalog_entry_id
        type: string
        source: input
        description: "FK -> DeviceCatalogEntry.id; the model this unit is."
      - name: transfer_target_household_id
        type: string
        source: system
        description: "FK -> Household.id; set while lifecycle_status == TRANSFER_PENDING, cleared on accept. Null otherwise."
      - name: serial_number
        type: string
        source: input
        description: "Manufacturer serial; globally unique across all Device rows regardless of lifecycle_status."
        constraints: "6-32 uppercase alphanumeric characters, must start with the catalog entry's serial_prefix"
      - name: purchase_date
        type: string
        source: input
        description: "Date of purchase in YYYY-MM-DD form; the anchor for warranty arithmetic."
      - name: lifecycle_status
        type: enum
        source: system
        description: "Ownership / service axis (independent of firmware_status)."
        default: CLAIMED
        constraints: "CLAIMED | ACTIVE | RECLAIMABLE | SERVICE_HOLD | SUSPENDED_RMA | TRANSFER_PENDING | DECOMMISSIONED"
      - name: firmware_status
        type: enum
        source: system
        description: "Firmware axis, advanced independently of lifecycle_status by campaign endpoints."
        default: CURRENT
        constraints: "CURRENT | UPDATE_PENDING | ROLLED_BACK | DEFERRED | BLOCKED"
      - name: firmware_version
        type: string
        source: computed
        description: "Set to the catalog entry's current_firmware_version on activation; set to the campaign's target_firmware_version when a rollout is APPLIED; unchanged on rollback."
      - name: activation_token
        type: string
        source: system
        description: "Single-use activation token minted at claim and re-minted at reclaim; the value POST /devices/{id}/activate must echo."
      - name: activation_expires_at
        type: datetime
        source: system
        description: "Claim instant + ACTIVATION_TOKEN_TTL_MINUTES (1440) minutes; activation at or after this instant fails."
      - name: activation_attempts
        type: integer
        source: system
        description: "Count of failed activation attempts against the current token; reset to 0 on reclaim."
        default: 0
      - name: activated_at
        type: datetime
        source: system
        description: "Logical-clock instant of successful activation; null until then."
      - name: warranty_expires_at
        type: datetime
        source: computed
        description: "Pinned at claim time from purchase_date plus base term plus (when applicable) the tier extension."
      - name: warranty_basis
        type: enum
        source: computed
        description: "Which warranty variant produced warranty_expires_at."
        default: BASE_ONLY
        constraints: "BASE_ONLY | TIER_EXTENDED"
      - name: is_overage
        type: boolean
        source: computed
        description: "True when this device pushed the household's entitled_device_count above the plan's included_device_count at claim time."
        default: false

  - name: Ticket
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household the ticket belongs to."
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; the device under support. Null for account-level tickets."
      - name: opened_by_member_id
        type: string
        source: input
        description: "FK -> HouseholdMember.id; the member who filed the ticket. Null when a SupportAgent opened it."
      - name: severity
        type: enum
        source: input
        description: "Severity, the second input to SLA target selection."
        constraints: "P1 | P2 | P3"
      - name: summary
        type: string
        source: input
        description: "Short problem description."
        constraints: "1-200 characters"
      - name: workflow_status
        type: enum
        source: system
        description: "Axis 1 of 3 on Ticket."
        default: NEW
        constraints: "NEW | TRIAGED | REMOTE_DIAG | AWAITING_CUSTOMER | DISPATCH_PENDING | ONSITE | RESOLVED | REOPENED | CLOSED"
      - name: sla_status
        type: enum
        source: system
        description: "Axis 2 of 3 on Ticket; advanced by clock evaluation and by pause/resume, never by workflow transitions alone."
        default: WITHIN
        constraints: "WITHIN | AT_RISK | PAUSED | BREACHED_FIRST_RESPONSE | BREACHED_ONSITE | MET | CREDITED"
      - name: dispatch_status
        type: enum
        source: system
        description: "Axis 3 of 3 on Ticket; tracks the onsite-visit sub-workflow."
        default: NOT_REQUIRED
        constraints: "NOT_REQUIRED | REQUIRED | SCHEDULED | RESCHEDULING | NO_SHOW | COMPLETED"
      - name: first_response_at
        type: datetime
        source: system
        description: "Logical-clock instant of the first agent response; null until then."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant the ticket entered RESOLVED (latest occurrence); null until then."
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the ticket entered CLOSED; null until then."
      - name: pause_started_at
        type: datetime
        source: system
        description: "Logical-clock instant the SLA clock was paused by await-customer; null while the clock runs."
      - name: sla_paused_minutes
        type: integer
        source: computed
        description: "Whole minutes accumulated inside closed AWAITING_CUSTOMER segments, plus the open segment measured to the evaluation instant."
        default: 0
      - name: sla_uncovered_minutes
        type: integer
        source: computed
        description: "Whole minutes between created_at and the evaluation instant that fall outside the plan's coverage window AND outside every pause segment."
        default: 0
      - name: sla_counted_minutes
        type: integer
        source: computed
        description: "total_elapsed_minutes - sla_paused_minutes - sla_uncovered_minutes; the only clock the SLA targets are compared against."
        default: 0
      - name: first_response_target_minutes
        type: integer
        source: computed
        description: "Selected from the in-force plan by severity at ticket creation and pinned on the row."
      - name: onsite_resolution_target_minutes
        type: integer
        source: computed
        description: "Selected from the in-force plan by severity at ticket creation, converted hours -> minutes (x 60), and pinned on the row."
      - name: remote_session_failure_count
        type: integer
        source: computed
        description: "Count of RemoteSession rows for this ticket with outcome == FAILED."
        default: 0
      - name: escalation_reason
        type: enum
        source: system
        description: "Why dispatch_status became REQUIRED; null while dispatch_status == NOT_REQUIRED."
        constraints: "FAILURE_THRESHOLD | HARDWARE_FAULT"
      - name: survey_solicited_at
        type: datetime
        source: system
        description: "Logical-clock instant the ticket first entered RESOLVED; the CSAT window anchor. Not overwritten by later re-resolutions."

  - name: RemoteSession
    parent: Ticket
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket this remote troubleshooting session belongs to."
      - name: agent_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the SupportAgent who opened the session."
      - name: session_index
        type: integer
        source: computed
        description: "1-based ordinal of this session within its ticket, assigned by created_at ascending."
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant the session opened."
      - name: ended_at
        type: datetime
        source: system
        description: "Logical-clock instant the session was completed; null while IN_PROGRESS."
      - name: status
        type: enum
        source: system
        description: "Session lifecycle."
        default: IN_PROGRESS
        constraints: "IN_PROGRESS | COMPLETED"
      - name: outcome
        type: enum
        source: system
        description: "Set by POST /remote-sessions/{id}/complete; null while IN_PROGRESS."
        constraints: "RESOLVED | FAILED | HARDWARE_FAULT"
      - name: diagnostic_notes
        type: string
        source: input
        description: "Free-text notes recorded at completion."

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Technician display name."
      - name: region_code
        type: string
        source: input
        description: "The single dispatch region this technician serves; copied onto every VisitSlot they publish."
        constraints: "exactly 3 uppercase letters"
      - name: skills
        type: array
        source: input
        description: "Array of device_class strings this technician can service."
        constraints: "non-empty; each element in {HUB, CAMERA, SENSOR, THERMOSTAT, LOCK}"
      - name: total_slot_count
        type: integer
        source: computed
        description: "Count of VisitSlot rows with technician_id == this.id."
        default: 0
      - name: open_slot_count
        type: integer
        source: computed
        description: "Count of VisitSlot rows with technician_id == this.id and status == OPEN."
        default: 0
      - name: booked_slot_count
        type: integer
        source: computed
        description: "Count of VisitSlot rows with technician_id == this.id and status == BOOKED."
        default: 0
      - name: blocked_slot_count
        type: integer
        source: computed
        description: "Count of VisitSlot rows with technician_id == this.id and status == BLOCKED."
        default: 0

  - name: VisitSlot
    parent: Technician
    common_fields: true
    fields:
      - name: technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the technician offering this slot."
      - name: region_code
        type: string
        source: computed
        description: "Copied from the owning Technician.region_code at slot creation; input value ignored."
      - name: start_at
        type: datetime
        source: input
        description: "Slot start, inclusive. Whole-minute precision."
      - name: end_at
        type: datetime
        source: input
        description: "Slot end, exclusive. Whole-minute precision; must be strictly after start_at."
      - name: status
        type: enum
        source: system
        description: "Capacity axis; open + booked + blocked == total for a technician at all times."
        default: OPEN
        constraints: "OPEN | BOOKED | BLOCKED"

  - name: Visit
    parent: Ticket
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket this onsite visit serves."
      - name: slot_id
        type: string
        source: input
        description: "FK -> VisitSlot.id; the slot the visit occupies."
      - name: status
        type: enum
        source: system
        description: "Visit lifecycle; three-way fork at SCHEDULED into COMPLETED / CANCELLED / NO_SHOW."
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | CANCELLED | NO_SHOW"
      - name: scheduled_start_at
        type: datetime
        source: computed
        description: "Copied from the occupied VisitSlot.start_at at booking and re-copied on reschedule."
      - name: scheduled_end_at
        type: datetime
        source: computed
        description: "Copied from the occupied VisitSlot.end_at at booking and re-copied on reschedule."
      - name: cancelled_at
        type: datetime
        source: system
        description: "Logical-clock instant of cancellation; null unless status == CANCELLED."
      - name: fee_kind
        type: enum
        source: computed
        description: "Which fee variant was selected."
        default: NONE
        constraints: "NONE | LATE_CANCEL | NO_SHOW"
      - name: fee_cents
        type: integer
        source: computed
        description: "Fee booked onto Subscription.next_invoice_adjustment_cents; 0 when fee_kind == NONE or when fee_waived == true."
        default: 0
      - name: fee_waived
        type: boolean
        source: computed
        description: "True when a LATE_CANCEL fee was suppressed because the household's in-force plan tier is PRO."
        default: false
      - name: completion_notes
        type: string
        source: input
        description: "Notes recorded by the technician at completion."

  - name: FirmwareCampaign
    parent: DeviceCatalogEntry
    common_fields: true
    fields:
      - name: catalog_entry_id
        type: string
        source: input
        description: "FK -> DeviceCatalogEntry.id; only devices of this model are eligible."
      - name: kind
        type: enum
        source: input
        description: "Mandatory security patch vs optional feature firmware; drives deferability and open-ticket blocking."
        constraints: "SECURITY_MANDATORY | FEATURE_OPTIONAL"
      - name: target_firmware_version
        type: string
        source: input
        description: "Version stamped on Device.firmware_version when a rollout is APPLIED."
      - name: halt_failure_rate_pct
        type: number
        source: input
        description: "Ring failure-rate threshold; the campaign HALTS when ring_failure_rate >= this value."
        default: 0.20
        constraints: "0 < value <= 1"
      - name: status
        type: enum
        source: system
        description: "Campaign lifecycle; HALTED is re-enterable via resume."
        default: DRAFT
        constraints: "DRAFT | RING_ACTIVE | HALTED | COMPLETED"
      - name: current_ring_index
        type: integer
        source: system
        description: "1-based index of the ring most recently launched; 0 while DRAFT."
        default: 0
      - name: ring_window_start_at
        type: datetime
        source: system
        description: "Start of the current ring's rollout window, inclusive. Null while DRAFT."
      - name: ring_window_end_at
        type: datetime
        source: system
        description: "End of the current ring's rollout window, INCLUSIVE (closed interval). Null while DRAFT."
      - name: ring_device_count
        type: integer
        source: computed
        description: "Count of FirmwareRollout rows for this campaign with ring_index == current_ring_index."
        default: 0
      - name: ring_failed_count
        type: integer
        source: computed
        description: "Count of FirmwareRollout rows for this campaign with ring_index == current_ring_index and status == ROLLED_BACK."
        default: 0
      - name: ring_failure_rate
        type: number
        source: computed
        description: "ring_failed_count / ring_device_count, or 0 when ring_device_count == 0. Rounded to 4 decimal places, round_half_up, before the halt comparison."
        default: 0

  - name: FirmwareRollout
    parent: FirmwareCampaign
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> FirmwareCampaign.id; the campaign that created this rollout."
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; the device this rollout targets."
      - name: ring_index
        type: integer
        source: computed
        description: "Copied from the campaign's current_ring_index at launch."
      - name: window_start_at
        type: datetime
        source: computed
        description: "Copied from FirmwareCampaign.ring_window_start_at at launch; inclusive."
      - name: window_end_at
        type: datetime
        source: computed
        description: "Copied from FirmwareCampaign.ring_window_end_at at launch; INCLUSIVE."
      - name: status
        type: enum
        source: system
        description: "Rollout lifecycle; ROLLED_BACK and DEFERRED both return to PENDING."
        default: PENDING
        constraints: "PENDING | APPLIED | ROLLED_BACK | DEFERRED | BLOCKED_BY_HALT | BLOCKED_BY_SERVICE"
      - name: last_result
        type: enum
        source: system
        description: "Most recent reported result; null until a result is reported."
        constraints: "SUCCESS | FAILURE"
      - name: retry_count
        type: integer
        source: computed
        description: "Number of times this rollout has been returned to PENDING by POST /firmware-rollouts/{id}/retry; capped at FIRMWARE_MAX_RETRY_COUNT (2)."
        default: 0
      - name: deferred_until
        type: datetime
        source: system
        description: "Customer-chosen deferral instant; null unless status == DEFERRED."
      - name: result_reported_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent report-result call; null until then."

  - name: AddOnOrder
    parent: Household
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the buying household."
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription whose credits and invoice this order touches."
      - name: lines
        type: array
        source: input
        description: "Ordered array of line objects, each of shape {catalog_entry_id: string, quantity: integer}. Line order in the request is the pinned evaluation order for both the entitlement waterfall and the install-credit waterfall."
        constraints: "1 to ADDON_ORDER_MAX_LINES (5) entries; each quantity is an integer >= 1; each catalog_entry_id must reference an existing DeviceCatalogEntry"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle."
        default: PLACED
        constraints: "PLACED | FULFILLED"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Sum over lines of DeviceCatalogEntry.msrp_cents * quantity."
        default: 0
      - name: bundle_discount_pct
        type: number
        source: computed
        description: "Tier selected from subtotal_cents alone, before any install charge or proration is added."
        default: 0
      - name: bundle_discount_cents
        type: integer
        source: computed
        description: "round_half_up(subtotal_cents * bundle_discount_pct)."
        default: 0
      - name: discounted_subtotal_cents
        type: integer
        source: computed
        description: "subtotal_cents - bundle_discount_cents."
        default: 0
      - name: install_credits_applied
        type: integer
        source: computed
        description: "Install credits consumed by this order (1 per install-requiring unit, allocated by the pinned waterfall)."
        default: 0
      - name: install_charge_cents
        type: integer
        source: computed
        description: "INSTALL_VISIT_FEE_CENTS (12900) times the number of install-requiring units left uncovered after the credit waterfall."
        default: 0
      - name: monthly_delta_cents
        type: integer
        source: computed
        description: "SubscriptionPlan.overage_fee_cents_per_device times the number of units in this order that push entitled_device_count above included_device_count."
        default: 0
      - name: proration_mode
        type: enum
        source: computed
        description: "Which proration variant was applied."
        default: NEXT_CYCLE_FULL
        constraints: "MID_CYCLE_PRORATED | NEXT_CYCLE_FULL"
      - name: proration_cents
        type: integer
        source: computed
        description: "Sum over lines of the per-line prorated delta, each line rounded before summing. 0 when proration_mode == NEXT_CYCLE_FULL."
        default: 0
      - name: order_total_cents
        type: integer
        source: computed
        description: "discounted_subtotal_cents + install_charge_cents + proration_cents."
        default: 0
      - name: fulfilled_device_ids
        type: array
        source: computed
        description: "Array of Device.id strings created by POST /addon-orders/{id}/fulfill; empty while status == PLACED."

  - name: RmaCase
    parent: Device
    common_fields: true
    fields:
      - name: device_id
        type: string
        source: input
        description: "FK -> Device.id; the faulty unit."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket that surfaced the fault. Null for a walk-up RMA."
      - name: supersedes_rma_id
        type: string
        source: system
        description: "FK -> RmaCase.id; the prior non-terminal RmaCase on the same device that this case superseded at creation. Null when none existed."
      - name: warranty_state
        type: enum
        source: computed
        description: "Evaluated at case creation against the logical clock."
        constraints: "IN_WARRANTY | EXPIRED"
      - name: routing_target
        type: enum
        source: computed
        description: "Selected at case creation from warranty_state x device_class x plan advance-replacement eligibility."
        constraints: "MANUFACTURER | IN_HOUSE_DEPOT | ADVANCE_REPLACEMENT | CUSTOMER_PAID_DEPOT"
      - name: status
        type: enum
        source: system
        description: "RMA lifecycle; branches on routing_target."
        default: OPEN
        constraints: "OPEN | ROUTED | ADVANCE_SHIPPED | AWAITING_RETURN | RETURN_RECEIVED | RETURN_WINDOW_EXPIRED | CHARGED | CLOSED | SUPERSEDED"
      - name: hold_amount_cents
        type: integer
        source: computed
        description: "round_half_up(DeviceCatalogEntry.msrp_cents * ADVANCE_REPLACEMENT_HOLD_PCT_OF_MSRP (0.60)); 0 unless routing_target == ADVANCE_REPLACEMENT."
        default: 0
      - name: hold_state
        type: enum
        source: computed
        description: "Lifecycle of the advance-replacement hold."
        default: NONE
        constraints: "NONE | HELD | RELEASED | CHARGED"
      - name: shipped_at
        type: datetime
        source: system
        description: "Logical-clock instant the advance replacement shipped; null until then."
      - name: return_deadline_at
        type: datetime
        source: computed
        description: "shipped_at + RMA_RETURN_WINDOW_DAYS (14) days; null until shipped."
      - name: returned_at
        type: datetime
        source: system
        description: "Logical-clock instant the faulty unit was received back; null until then."

  - name: SatisfactionSurvey
    parent: Ticket
    common_fields: true
    fields:
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; at most one survey row per ticket."
      - name: score
        type: integer
        source: input
        description: "CSAT score."
        constraints: "integer 1..5 inclusive"
      - name: comment
        type: string
        source: input
        description: "Optional free-text comment."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of submission."
      - name: window_closes_at
        type: datetime
        source: computed
        description: "Ticket.survey_solicited_at + CSAT_SURVEY_WINDOW_HOURS (72) hours; submission at or after this instant is rejected."
      - name: credit_variant
        type: enum
        source: computed
        description: "Which CSAT credit variant fired."
        default: NONE
        constraints: "NONE | BREACH_COMPOUNDED | GOODWILL"
      - name: credit_cents
        type: integer
        source: computed
        description: "Amount of the ServiceCredit this survey produced after the per-cycle cap was applied; 0 when credit_variant == NONE."
        default: 0

  - name: ServiceCredit
    parent: Subscription
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the credited household."
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription the credit lands on."
      - name: ticket_id
        type: string
        source: input
        description: "FK -> Ticket.id; the ticket that produced the credit."
      - name: reason
        type: enum
        source: computed
        description: "Why the credit was issued."
        constraints: "SLA_FIRST_RESPONSE_BREACH | SLA_ONSITE_BREACH | CSAT_BREACH_COMPOUNDED | CSAT_GOODWILL"
      - name: breach_tier
        type: enum
        source: computed
        description: "Breach severity tier when reason is an SLA breach; null for CSAT reasons."
        constraints: "MINOR | MAJOR | SEVERE"
      - name: uncapped_amount_cents
        type: integer
        source: computed
        description: "The credit the formula produced before the per-cycle cap was applied."
        default: 0
      - name: amount_cents
        type: integer
        source: computed
        description: "min(uncapped_amount_cents, cap_remaining_cents); the amount actually credited."
        default: 0
      - name: cycle_index
        type: integer
        source: computed
        description: "Subscription.cycle_index at issuance; the cap is scoped to this value."
      - name: applied_to_cycle_index
        type: integer
        source: computed
        description: "cycle_index + 1; credits are applied to the NEXT invoice, never the current one."

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# Ticket carries three independent axes and Device two; each axis is listed as
# its own machine with an explicit `state_field:`.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Household
    axis: account
    state_field: account_status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /households/{id}/account-status with account_status=SUSPENDED"
        actor: PlatformAdmin
        preconditions: ["Household.account_status == ACTIVE"]
        side_effects:
          - "sets Household.suspended_at to the logical-clock instant"
          - "increments Household.version by 1"
          - "activates gate_precedence order 1 for every subsequent mutating request scoped to this household"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /households/{id}/account-status with account_status=ACTIVE"
        actor: PlatformAdmin
        preconditions: ["Household.account_status == SUSPENDED"]
        side_effects:
          - "clears Household.suspended_at to null"
          - "increments Household.version by 1"
        note: "Re-entry into ACTIVE makes the account gate cyclic."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /households/{id}/account-status with account_status=CLOSED"
        actor: PlatformAdmin
        preconditions:
          - "Household.account_status == ACTIVE"
          - "the household's Subscription.status == CANCELLED"
        side_effects:
          - "increments Household.version by 1"

  - entity: Subscription
    axis: lifecycle
    state_field: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAST_DUE
        trigger: "POST /subscriptions/{id}/close-cycle with payment_outcome=FAILED"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects:
          - "increments Subscription.cycle_index by 1 and advances cycle_start_at to the prior cycle_end_at"
          - "recomputes Subscription.cycle_end_at"
          - "resets Subscription.credits_issued_cents_this_cycle and overage_charges_cents_this_cycle to 0"
          - "increments Subscription.version by 1"
      - from: PAST_DUE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/close-cycle with payment_outcome=SUCCEEDED"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == PAST_DUE"]
        side_effects:
          - "increments Subscription.cycle_index by 1 and advances cycle_start_at to the prior cycle_end_at"
          - "grants SubscriptionPlan.included_install_credits fresh install credits (install_credits_granted += included_install_credits)"
          - "resets credits_issued_cents_this_cycle and overage_charges_cents_this_cycle to 0"
          - "increments Subscription.version by 1"
        note: "PAST_DUE -> ACTIVE re-entry makes this axis cyclic."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/close-cycle with payment_outcome=SUCCEEDED"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects:
          - "increments Subscription.cycle_index by 1 and advances cycle_start_at to the prior cycle_end_at"
          - "grants SubscriptionPlan.included_install_credits fresh install credits"
          - "when pending_tier_plan_id is not null: sets plan_id = pending_tier_plan_id, re-pins monthly_fee_cents from the new plan, clears pending_tier_plan_id"
          - "resets credits_issued_cents_this_cycle and overage_charges_cents_this_cycle to 0"
          - "increments Subscription.version by 1"
      - from: PAST_DUE
        to: SUSPENDED
        trigger: "POST /subscriptions/{id}/close-cycle with payment_outcome=FAILED"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == PAST_DUE"]
        side_effects:
          - "sets the owning Household.account_status to SUSPENDED and stamps Household.suspended_at (cascade hop 2)"
          - "increments Household.version by 1"
          - "increments Subscription.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/close-cycle with payment_outcome=SUCCEEDED"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == SUSPENDED"]
        side_effects:
          - "sets the owning Household.account_status to ACTIVE and clears suspended_at (cascade hop 2)"
          - "increments Subscription.cycle_index by 1"
          - "increments Household.version and Subscription.version by 1 each"
      - from: ACTIVE
        to: CANCEL_PENDING
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Owner
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects:
          - "sets pending_tier_plan_id to null"
          - "increments Subscription.version by 1"
      - from: PAST_DUE
        to: CANCEL_PENDING
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Owner
        preconditions: ["Subscription.status == PAST_DUE"]
        side_effects:
          - "sets pending_tier_plan_id to null"
          - "increments Subscription.version by 1"
      - from: CANCEL_PENDING
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/close-cycle (any payment_outcome)"
        actor: PlatformAdmin
        preconditions: ["Subscription.status == CANCEL_PENDING"]
        side_effects:
          - "activates gate_precedence order 4 for every subsequent household-scoped mutating request"
          - "increments Subscription.version by 1"

  - entity: Device
    axis: lifecycle
    state_field: lifecycle_status
    shape: cyclic
    initial_state: CLAIMED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: CLAIMED
        to: ACTIVE
        trigger: "POST /devices/{id}/activate with a matching activation_code"
        actor: Owner
        preconditions:
          - "Device.lifecycle_status == CLAIMED"
          - "logical clock < Device.activation_expires_at"
          - "activation_code equals Device.activation_token"
        side_effects:
          - "sets Device.activated_at to the logical-clock instant"
          - "sets Device.firmware_version to the catalog entry's current_firmware_version"
          - "clears Device.activation_token to null"
          - "recomputes Household.active_device_count"
          - "increments Device.version by 1"
      - from: CLAIMED
        to: RECLAIMABLE
        trigger: "POST /devices/{id}/activate whose failure raises activation_attempts to ACTIVATION_MAX_ATTEMPTS (3), or whose call instant is at/after activation_expires_at"
        actor: Owner
        preconditions: ["Device.lifecycle_status == CLAIMED"]
        side_effects:
          - "sets Device.activation_attempts to 3 on the attempts path; leaves it unchanged on the expiry path"
          - "clears Device.activation_token to null"
          - "increments Device.version by 1"
        note: "This is the branch-asymmetric write: the 1st and 2nd bad code leave lifecycle_status == CLAIMED and only bump activation_attempts; the 3rd also moves the row."
      - from: RECLAIMABLE
        to: CLAIMED
        trigger: "POST /devices/{id}/reclaim"
        actor: SupportAgent
        preconditions: ["Device.lifecycle_status == RECLAIMABLE"]
        side_effects:
          - "mints a fresh Device.activation_token"
          - "sets Device.activation_expires_at to the logical-clock instant + 1440 minutes"
          - "resets Device.activation_attempts to 0"
          - "increments Device.version by 1"
        note: "Closes the onboarding loop CLAIMED -> RECLAIMABLE -> CLAIMED."
      - from: ACTIVE
        to: SERVICE_HOLD
        trigger: "system: the ticket referencing this device entered DISPATCH_PENDING (cascade hop 3)"
        actor: system
        preconditions:
          - "Device.lifecycle_status == ACTIVE"
          - "the escalating Ticket.device_id == Device.id"
        side_effects:
          - "for every FirmwareRollout with device_id == Device.id and status == PENDING: sets status to BLOCKED_BY_SERVICE (cascade hop 4)"
          - "sets Device.firmware_status to BLOCKED when it was UPDATE_PENDING (cascade hop 4)"
          - "increments Device.version by 1"
      - from: SERVICE_HOLD
        to: ACTIVE
        trigger: "POST /visits/{id}/complete for the visit serving that ticket"
        actor: Technician
        preconditions: ["Device.lifecycle_status == SERVICE_HOLD"]
        side_effects:
          - "for every FirmwareRollout with device_id == Device.id and status == BLOCKED_BY_SERVICE whose campaign.status == RING_ACTIVE: sets status back to PENDING and Device.firmware_status back to UPDATE_PENDING"
          - "increments Device.version by 1"
      - from: ACTIVE
        to: SUSPENDED_RMA
        trigger: "POST /rma-cases/{id}/ship-advance-replacement"
        actor: SupportAgent
        preconditions:
          - "Device.lifecycle_status == ACTIVE"
          - "RmaCase.routing_target == ADVANCE_REPLACEMENT"
        side_effects:
          - "increments Device.version by 1"
      - from: SUSPENDED_RMA
        to: ACTIVE
        trigger: "POST /rma-cases/{id}/receive-return or POST /rma-cases/{id}/close-return-window"
        actor: SupportAgent
        preconditions: ["Device.lifecycle_status == SUSPENDED_RMA"]
        side_effects:
          - "increments Device.version by 1"
      - from: ACTIVE
        to: TRANSFER_PENDING
        trigger: "POST /devices/{id}/transfer"
        actor: Owner
        preconditions:
          - "Device.lifecycle_status == ACTIVE"
          - "target Household.account_status == ACTIVE"
          - "no RmaCase for this device with status IN {OPEN, ROUTED, ADVANCE_SHIPPED, AWAITING_RETURN}"
        side_effects:
          - "sets Device.transfer_target_household_id to the target household"
          - "increments Device.version by 1"
      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /devices/{id}/accept-transfer"
        actor: Owner
        preconditions:
          - "Device.lifecycle_status == TRANSFER_PENDING"
          - "the acting member's household_id == Device.transfer_target_household_id"
          - "the target household's post-transfer entitled_device_count would not exceed the target plan's included_device_count unless the target subscription's allow_overage is true"
        side_effects:
          - "sets Device.household_id to transfer_target_household_id and clears transfer_target_household_id"
          - "recomputes entitled_device_count and active_device_count on BOTH the source and the target Household"
          - "recomputes Device.is_overage against the target plan"
          - "increments Device.version by 1"
      - from: CLAIMED
        to: DECOMMISSIONED
        trigger: "POST /devices/{id}/decommission"
        actor: Owner
        preconditions: ["Device.lifecycle_status == CLAIMED"]
        side_effects:
          - "recomputes Household.entitled_device_count"
          - "increments Device.version by 1"
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /devices/{id}/decommission"
        actor: Owner
        preconditions:
          - "Device.lifecycle_status == ACTIVE"
          - "no RmaCase for this device with status IN {OPEN, ROUTED, ADVANCE_SHIPPED, AWAITING_RETURN}"
        side_effects:
          - "recomputes Household.entitled_device_count and active_device_count"
          - "recomputes Subscription.overage_device_count"
          - "for every FirmwareRollout with device_id == Device.id and status == PENDING: sets status to BLOCKED_BY_SERVICE"
          - "increments Device.version by 1"
      - from: RECLAIMABLE
        to: DECOMMISSIONED
        trigger: "POST /devices/{id}/decommission"
        actor: Owner
        preconditions: ["Device.lifecycle_status == RECLAIMABLE"]
        side_effects:
          - "recomputes Household.entitled_device_count"
          - "increments Device.version by 1"

  - entity: Device
    axis: firmware
    state_field: firmware_status
    shape: cyclic
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: UPDATE_PENDING
        trigger: "POST /firmware-campaigns/{id}/launch-ring listing this device"
        actor: PlatformAdmin
        preconditions:
          - "Device.firmware_status IN {CURRENT, ROLLED_BACK}"
          - "Device.lifecycle_status == ACTIVE"
        side_effects:
          - "creates a FirmwareRollout row in PENDING for this device"
          - "increments Device.version by 1"
        note: "A device already in UPDATE_PENDING may still be enrolled in a second campaign whose window does not collide; in that case no firmware-axis transition fires and only the new PENDING rollout row is created."
      - from: ROLLED_BACK
        to: UPDATE_PENDING
        trigger: "POST /firmware-rollouts/{id}/retry"
        actor: PlatformAdmin
        preconditions:
          - "FirmwareRollout.status == ROLLED_BACK"
          - "FirmwareRollout.retry_count < FIRMWARE_MAX_RETRY_COUNT (2)"
          - "FirmwareCampaign.status == RING_ACTIVE"
        side_effects:
          - "increments FirmwareRollout.retry_count by 1"
          - "increments Device.version by 1"
        note: "Retry loop ROLLED_BACK -> UPDATE_PENDING -> ROLLED_BACK, capped at 2 retries."
      - from: UPDATE_PENDING
        to: CURRENT
        trigger: "POST /firmware-rollouts/{id}/report-result with result=SUCCESS"
        actor: Technician
        preconditions: ["FirmwareRollout.status == PENDING"]
        side_effects:
          - "sets Device.firmware_version to FirmwareCampaign.target_firmware_version"
          - "increments Device.version by 1"
      - from: UPDATE_PENDING
        to: ROLLED_BACK
        trigger: "POST /firmware-rollouts/{id}/report-result with result=FAILURE"
        actor: Technician
        preconditions: ["FirmwareRollout.status == PENDING"]
        side_effects:
          - "leaves Device.firmware_version unchanged (the rollback restores the prior image)"
          - "increments Device.version by 1"
      - from: UPDATE_PENDING
        to: DEFERRED
        trigger: "POST /firmware-rollouts/{id}/defer"
        actor: Owner
        preconditions:
          - "FirmwareCampaign.kind == FEATURE_OPTIONAL"
          - "FirmwareRollout.status == PENDING"
        side_effects:
          - "increments Device.version by 1"
      - from: DEFERRED
        to: UPDATE_PENDING
        trigger: "POST /firmware-rollouts/{id}/retry"
        actor: PlatformAdmin
        preconditions:
          - "FirmwareRollout.status == DEFERRED"
          - "FirmwareRollout.retry_count < FIRMWARE_MAX_RETRY_COUNT (2)"
          - "FirmwareCampaign.status == RING_ACTIVE"
        side_effects:
          - "increments FirmwareRollout.retry_count by 1"
          - "clears FirmwareRollout.deferred_until to null"
          - "increments Device.version by 1"
      - from: UPDATE_PENDING
        to: BLOCKED
        trigger: "system: the device entered SERVICE_HOLD (cascade hop 4), was decommissioned, or its campaign HALTED"
        actor: system
        preconditions: ["Device.firmware_status == UPDATE_PENDING"]
        side_effects:
          - "increments Device.version by 1"
      - from: BLOCKED
        to: UPDATE_PENDING
        trigger: "system: the device returned to ACTIVE from SERVICE_HOLD, or POST /firmware-campaigns/{id}/resume re-activated the campaign"
        actor: system
        preconditions:
          - "Device.firmware_status == BLOCKED"
          - "the owning FirmwareCampaign.status == RING_ACTIVE"
        side_effects:
          - "sets the corresponding FirmwareRollout.status back to PENDING"
          - "increments Device.version by 1"

  - entity: Ticket
    axis: workflow
    state_field: workflow_status
    shape: cyclic
    initial_state: NEW
    terminal_states: [CLOSED]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /tickets/{id}/first-response"
        actor: SupportAgent
        preconditions:
          - "Ticket.workflow_status == NEW"
          - "Ticket.first_response_at is null"
        side_effects:
          - "sets Ticket.first_response_at to the logical-clock instant"
          - "recomputes sla_counted_minutes, sla_paused_minutes and sla_uncovered_minutes to that instant"
          - "advances the sla axis to BREACHED_FIRST_RESPONSE and issues a ServiceCredit when sla_counted_minutes > first_response_target_minutes; otherwise leaves the sla axis at WITHIN"
          - "increments Ticket.version by 1"
      - from: TRIAGED
        to: REMOTE_DIAG
        trigger: "POST /tickets/{id}/remote-sessions"
        actor: SupportAgent
        preconditions: ["Ticket.workflow_status IN {TRIAGED, REOPENED}"]
        side_effects:
          - "creates a RemoteSession row in IN_PROGRESS with session_index = count of prior sessions + 1"
          - "increments Ticket.version by 1"
      - from: REOPENED
        to: REMOTE_DIAG
        trigger: "POST /tickets/{id}/remote-sessions"
        actor: SupportAgent
        preconditions: ["Ticket.workflow_status == REOPENED"]
        side_effects:
          - "creates a RemoteSession row in IN_PROGRESS"
          - "increments Ticket.version by 1"
      - from: REMOTE_DIAG
        to: REMOTE_DIAG
        trigger: "POST /tickets/{id}/remote-sessions"
        actor: SupportAgent
        preconditions:
          - "Ticket.workflow_status == REMOTE_DIAG"
          - "no RemoteSession of this ticket has status == IN_PROGRESS"
        side_effects:
          - "creates the next RemoteSession row in IN_PROGRESS with session_index = prior session count + 1"
          - "increments Ticket.version by 1"
        note: "Self-loop: successive troubleshooting attempts stay in REMOTE_DIAG until the 3rd failure escalates the ticket."
      - from: REMOTE_DIAG
        to: AWAITING_CUSTOMER
        trigger: "POST /tickets/{id}/await-customer"
        actor: SupportAgent
        preconditions:
          - "Ticket.workflow_status == REMOTE_DIAG"
          - "Ticket.pause_started_at is null"
        side_effects:
          - "sets Ticket.pause_started_at to the logical-clock instant"
          - "moves the sla axis to PAUSED"
          - "increments Ticket.version by 1"
      - from: AWAITING_CUSTOMER
        to: REMOTE_DIAG
        trigger: "POST /tickets/{id}/customer-reply"
        actor: Member
        preconditions:
          - "Ticket.workflow_status == AWAITING_CUSTOMER"
          - "Ticket.pause_started_at is not null"
        side_effects:
          - "adds floor((now - pause_started_at) / 60 seconds) whole minutes to Ticket.sla_paused_minutes"
          - "clears Ticket.pause_started_at to null"
          - "moves the sla axis back to WITHIN"
          - "increments Ticket.version by 1"
        note: "REMOTE_DIAG <-> AWAITING_CUSTOMER is the pause loop; it may repeat any number of times."
      - from: REMOTE_DIAG
        to: RESOLVED
        trigger: "POST /remote-sessions/{id}/complete with outcome=RESOLVED"
        actor: SupportAgent
        preconditions: ["Ticket.workflow_status == REMOTE_DIAG"]
        side_effects:
          - "sets Ticket.resolved_at to the logical-clock instant and, on the first resolution only, Ticket.survey_solicited_at to the same instant"
          - "recomputes the SLA clock and moves the sla axis to MET when sla_status IN {WITHIN, AT_RISK} and sla_counted_minutes <= onsite_resolution_target_minutes"
          - "increments Ticket.version by 1"
      - from: REMOTE_DIAG
        to: DISPATCH_PENDING
        trigger: "POST /remote-sessions/{id}/complete with outcome=FAILED raising remote_session_failure_count to REMOTE_FAILURE_ESCALATION_COUNT (3), or with outcome=HARDWARE_FAULT at any count"
        actor: SupportAgent
        preconditions: ["Ticket.workflow_status == REMOTE_DIAG"]
        side_effects:
          - "sets Ticket.escalation_reason to FAILURE_THRESHOLD (threshold path) or HARDWARE_FAULT (verdict path)"
          - "moves the dispatch axis NOT_REQUIRED -> REQUIRED"
          - "when Ticket.device_id is not null and that Device.lifecycle_status == ACTIVE: moves the device to SERVICE_HOLD (cascade hop 3)"
          - "increments Ticket.version by 1"
        note: "Branch asymmetry: a FAILED completion at count 1 or 2 leaves workflow_status == REMOTE_DIAG and only bumps remote_session_failure_count."
      - from: DISPATCH_PENDING
        to: ONSITE
        trigger: "POST /visits"
        actor: SupportAgent
        preconditions:
          - "Ticket.workflow_status == DISPATCH_PENDING"
          - "Ticket.dispatch_status IN {REQUIRED, RESCHEDULING, NO_SHOW}"
        side_effects:
          - "moves the dispatch axis to SCHEDULED"
          - "sets the occupied VisitSlot.status to BOOKED"
          - "increments Ticket.version by 1"
      - from: ONSITE
        to: DISPATCH_PENDING
        trigger: "POST /visits/{id}/cancel or POST /visits/{id}/no-show"
        actor: SupportAgent
        preconditions: ["Ticket.workflow_status == ONSITE"]
        side_effects:
          - "moves the dispatch axis to RESCHEDULING (cancel) or NO_SHOW (no-show)"
          - "increments Ticket.version by 1"
      - from: ONSITE
        to: RESOLVED
        trigger: "POST /visits/{id}/complete"
        actor: Technician
        preconditions: ["Ticket.workflow_status == ONSITE"]
        side_effects:
          - "sets Ticket.resolved_at and, on the first resolution only, Ticket.survey_solicited_at"
          - "moves the dispatch axis to COMPLETED"
          - "returns the device from SERVICE_HOLD to ACTIVE"
          - "recomputes the SLA clock and moves the sla axis to MET when sla_status IN {WITHIN, AT_RISK} and sla_counted_minutes <= onsite_resolution_target_minutes"
          - "increments Ticket.version by 1"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /tickets/{id}/close"
        actor: SupportAgent
        preconditions: ["Ticket.workflow_status == RESOLVED"]
        side_effects:
          - "sets Ticket.closed_at to the logical-clock instant"
          - "activates gate_precedence order 3 for every subsequent ticket-scoped mutating request except POST /tickets/{id}/survey"
          - "increments Ticket.version by 1"
      - from: RESOLVED
        to: REOPENED
        trigger: "POST /tickets/{id}/reopen"
        actor: Member
        preconditions:
          - "Ticket.workflow_status == RESOLVED"
          - "logical clock < Ticket.resolved_at + TICKET_REOPEN_WINDOW_HOURS (168) hours"
        side_effects:
          - "clears Ticket.resolved_at to null but LEAVES survey_solicited_at unchanged"
          - "moves the sla axis from MET back to WITHIN"
          - "increments Ticket.version by 1"
        note: "RESOLVED -> REOPENED -> REMOTE_DIAG closes the ticket's outer loop."

  - entity: Ticket
    axis: sla
    state_field: sla_status
    shape: cyclic
    initial_state: WITHIN
    terminal_states: []
    transitions:
      - from: WITHIN
        to: AT_RISK
        trigger: "POST /tickets/{id}/sla-evaluate"
        actor: SupportAgent
        preconditions:
          - "Ticket.sla_status == WITHIN"
          - "sla_counted_minutes >= SLA_AT_RISK_PCT (0.80) * active_target_minutes AND sla_counted_minutes <= active_target_minutes"
        side_effects:
          - "recomputes sla_counted_minutes, sla_paused_minutes, sla_uncovered_minutes"
          - "increments Ticket.version by 1"
        note: "active_target_minutes is first_response_target_minutes while first_response_at is null, otherwise onsite_resolution_target_minutes."
      - from: WITHIN
        to: PAUSED
        trigger: "POST /tickets/{id}/await-customer"
        actor: SupportAgent
        preconditions: ["Ticket.sla_status IN {WITHIN, AT_RISK}"]
        side_effects: ["sets Ticket.pause_started_at", "increments Ticket.version by 1"]
      - from: AT_RISK
        to: PAUSED
        trigger: "POST /tickets/{id}/await-customer"
        actor: SupportAgent
        preconditions: ["Ticket.sla_status == AT_RISK"]
        side_effects: ["sets Ticket.pause_started_at", "increments Ticket.version by 1"]
      - from: PAUSED
        to: WITHIN
        trigger: "POST /tickets/{id}/customer-reply"
        actor: Member
        preconditions: ["Ticket.sla_status == PAUSED"]
        side_effects:
          - "accumulates the closed pause segment into sla_paused_minutes"
          - "increments Ticket.version by 1"
        note: "WITHIN -> PAUSED -> WITHIN is the SLA clock loop; counted minutes are frozen for the duration."
      - from: WITHIN
        to: BREACHED_FIRST_RESPONSE
        trigger: "POST /tickets/{id}/first-response or POST /tickets/{id}/sla-evaluate"
        actor: SupportAgent
        preconditions:
          - "Ticket.first_response_at is null at the moment of evaluation, or is being set by this very call"
          - "sla_counted_minutes > first_response_target_minutes"
        side_effects:
          - "computes the breach tier and the FIRST_RESPONSE_BREACH credit"
          - "creates a ServiceCredit row with reason SLA_FIRST_RESPONSE_BREACH when the capped amount is > 0"
          - "adds the credit to Subscription.credits_issued_cents_this_cycle and next_invoice_credit_cents"
          - "increments Ticket.version by 1"
      - from: AT_RISK
        to: BREACHED_FIRST_RESPONSE
        trigger: "POST /tickets/{id}/sla-evaluate"
        actor: SupportAgent
        preconditions:
          - "Ticket.sla_status == AT_RISK"
          - "Ticket.first_response_at is null"
          - "sla_counted_minutes > first_response_target_minutes"
        side_effects:
          - "creates a ServiceCredit row with reason SLA_FIRST_RESPONSE_BREACH when the capped amount is > 0"
          - "increments Ticket.version by 1"
      - from: BREACHED_FIRST_RESPONSE
        to: CREDITED
        trigger: "system: the ServiceCredit row for this breach was created with amount_cents > 0"
        actor: system
        preconditions: ["a ServiceCredit row exists for this ticket with reason SLA_FIRST_RESPONSE_BREACH and amount_cents > 0"]
        side_effects: ["increments Ticket.version by 1"]
      - from: WITHIN
        to: BREACHED_ONSITE
        trigger: "POST /tickets/{id}/sla-evaluate"
        actor: SupportAgent
        preconditions:
          - "Ticket.first_response_at is not null AND Ticket.resolved_at is null"
          - "sla_counted_minutes > onsite_resolution_target_minutes"
        side_effects:
          - "computes the breach tier and the ONSITE_RESOLUTION_BREACH credit on the widened base"
          - "creates a ServiceCredit row with reason SLA_ONSITE_BREACH when the capped amount is > 0"
          - "increments Ticket.version by 1"
      - from: AT_RISK
        to: BREACHED_ONSITE
        trigger: "POST /tickets/{id}/sla-evaluate"
        actor: SupportAgent
        preconditions:
          - "Ticket.sla_status == AT_RISK"
          - "Ticket.first_response_at is not null AND Ticket.resolved_at is null"
          - "sla_counted_minutes > onsite_resolution_target_minutes"
        side_effects:
          - "creates a ServiceCredit row with reason SLA_ONSITE_BREACH when the capped amount is > 0"
          - "increments Ticket.version by 1"
      - from: CREDITED
        to: BREACHED_ONSITE
        trigger: "POST /tickets/{id}/sla-evaluate"
        actor: SupportAgent
        preconditions:
          - "Ticket.sla_status == CREDITED"
          - "sla_counted_minutes > onsite_resolution_target_minutes"
        side_effects:
          - "creates a second ServiceCredit row with reason SLA_ONSITE_BREACH when cap room remains"
          - "increments Ticket.version by 1"
        note: "A first-response breach that was already credited can still breach the onsite target later."
      - from: BREACHED_ONSITE
        to: CREDITED
        trigger: "system: the ServiceCredit row for this breach was created with amount_cents > 0"
        actor: system
        preconditions: ["a ServiceCredit row exists for this ticket with reason SLA_ONSITE_BREACH and amount_cents > 0"]
        side_effects: ["increments Ticket.version by 1"]
      - from: WITHIN
        to: MET
        trigger: "POST /remote-sessions/{id}/complete with outcome=RESOLVED, or POST /visits/{id}/complete"
        actor: SupportAgent
        preconditions:
          - "Ticket.sla_status IN {WITHIN, AT_RISK}"
          - "sla_counted_minutes <= onsite_resolution_target_minutes"
        side_effects: ["increments Ticket.version by 1"]
      - from: AT_RISK
        to: MET
        trigger: "POST /remote-sessions/{id}/complete with outcome=RESOLVED, or POST /visits/{id}/complete"
        actor: SupportAgent
        preconditions:
          - "Ticket.sla_status == AT_RISK"
          - "sla_counted_minutes <= onsite_resolution_target_minutes"
        side_effects: ["increments Ticket.version by 1"]
      - from: MET
        to: WITHIN
        trigger: "POST /tickets/{id}/reopen"
        actor: Member
        preconditions: ["Ticket.sla_status == MET"]
        side_effects: ["increments Ticket.version by 1"]

  - entity: Ticket
    axis: dispatch
    state_field: dispatch_status
    shape: cyclic
    initial_state: NOT_REQUIRED
    terminal_states: []
    transitions:
      - from: NOT_REQUIRED
        to: REQUIRED
        trigger: "system: the ticket escalated to DISPATCH_PENDING"
        actor: system
        preconditions: ["Ticket.dispatch_status == NOT_REQUIRED"]
        side_effects: ["sets Ticket.escalation_reason", "increments Ticket.version by 1"]
      - from: REQUIRED
        to: SCHEDULED
        trigger: "POST /visits"
        actor: SupportAgent
        preconditions:
          - "Ticket.dispatch_status == REQUIRED"
          - "the chosen VisitSlot.status == OPEN"
        side_effects:
          - "creates a Visit row in SCHEDULED"
          - "sets VisitSlot.status to BOOKED and recomputes the technician's open_slot_count / booked_slot_count"
          - "increments Ticket.version by 1"
      - from: SCHEDULED
        to: RESCHEDULING
        trigger: "POST /visits/{id}/cancel"
        actor: SupportAgent
        preconditions: ["Ticket.dispatch_status == SCHEDULED"]
        side_effects:
          - "sets the occupied VisitSlot.status to OPEN when the cancellation instant is at or before scheduled_start_at - LATE_CANCEL_CUTOFF_HOURS (24) hours, and to BLOCKED otherwise"
          - "increments Ticket.version by 1"
      - from: RESCHEDULING
        to: SCHEDULED
        trigger: "POST /visits"
        actor: SupportAgent
        preconditions: ["Ticket.dispatch_status == RESCHEDULING"]
        side_effects: ["creates a new Visit row", "sets the new VisitSlot.status to BOOKED", "increments Ticket.version by 1"]
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /visits/{id}/no-show"
        actor: Technician
        preconditions:
          - "Ticket.dispatch_status == SCHEDULED"
          - "logical clock >= Visit.scheduled_start_at"
        side_effects:
          - "sets the occupied VisitSlot.status to BLOCKED"
          - "books NO_SHOW_FEE_CENTS (9000) onto Subscription.next_invoice_adjustment_cents"
          - "increments Ticket.version by 1"
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /visits"
        actor: SupportAgent
        preconditions: ["Ticket.dispatch_status == NO_SHOW"]
        side_effects: ["creates a new Visit row", "sets the new VisitSlot.status to BOOKED", "increments Ticket.version by 1"]
        note: "NO_SHOW -> SCHEDULED re-entry makes the dispatch axis cyclic."
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: Technician
        preconditions:
          - "Ticket.dispatch_status == SCHEDULED"
          - "Visit.status == SCHEDULED"
        side_effects:
          - "leaves the occupied VisitSlot.status at BOOKED"
          - "increments Ticket.version by 1"

  - entity: RemoteSession
    axis: lifecycle
    state_field: status
    shape: linear
    initial_state: IN_PROGRESS
    terminal_states: [COMPLETED]
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /remote-sessions/{id}/complete"
        actor: SupportAgent
        preconditions:
          - "RemoteSession.status == IN_PROGRESS"
          - "the owning Ticket.workflow_status == REMOTE_DIAG"
        side_effects:
          - "sets RemoteSession.outcome and ended_at (cascade hop 1)"
          - "when outcome == FAILED: increments the owning Ticket.remote_session_failure_count by 1 (cascade hop 2)"
          - "when the incremented count reaches 3, or outcome == HARDWARE_FAULT: moves the ticket to DISPATCH_PENDING / dispatch REQUIRED (cascade hop 2)"
          - "when outcome == RESOLVED: moves the ticket to RESOLVED"
          - "increments RemoteSession.version by 1"

  - entity: VisitSlot
    axis: capacity
    state_field: status
    shape: cyclic
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: "POST /visits"
        actor: SupportAgent
        preconditions:
          - "VisitSlot.status == OPEN"
          - "VisitSlot.region_code == the ticket household's region_code"
          - "no other VisitSlot of the same technician with status == BOOKED buffer-overlaps this slot"
        side_effects:
          - "decrements Technician.open_slot_count by 1 and increments booked_slot_count by 1"
          - "increments VisitSlot.version by 1"
      - from: BOOKED
        to: OPEN
        trigger: "POST /visits/{id}/cancel at or before scheduled_start_at - 24 hours"
        actor: SupportAgent
        preconditions:
          - "VisitSlot.status == BOOKED"
          - "logical clock <= Visit.scheduled_start_at - LATE_CANCEL_CUTOFF_HOURS (24) hours"
        side_effects:
          - "increments Technician.open_slot_count by 1 and decrements booked_slot_count by 1"
          - "increments VisitSlot.version by 1"
        note: "BOOKED -> OPEN restores capacity, closing the slot loop."
      - from: BOOKED
        to: BLOCKED
        trigger: "POST /visits/{id}/cancel strictly after scheduled_start_at - 24 hours, or POST /visits/{id}/no-show"
        actor: SupportAgent
        preconditions: ["VisitSlot.status == BOOKED"]
        side_effects:
          - "decrements Technician.booked_slot_count by 1 and increments blocked_slot_count by 1"
          - "increments VisitSlot.version by 1"
        note: "The technician's time is consumed and cannot be resold; total = open + booked + blocked is preserved."
      - from: BOOKED
        to: OPEN
        trigger: "POST /visits/{id}/reschedule (the vacated slot)"
        actor: SupportAgent
        preconditions:
          - "VisitSlot.status == BOOKED"
          - "logical clock <= Visit.scheduled_start_at - LATE_CANCEL_CUTOFF_HOURS (24) hours"
        side_effects:
          - "increments Technician.open_slot_count by 1 and decrements booked_slot_count by 1"
          - "increments VisitSlot.version by 1"

  - entity: Visit
    axis: lifecycle
    state_field: status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: Technician
        preconditions:
          - "Visit.status == SCHEDULED"
          - "the acting technician's id == the occupied VisitSlot.technician_id"
          - "logical clock >= Visit.scheduled_start_at"
        side_effects:
          - "moves the ticket ONSITE -> RESOLVED and the dispatch axis SCHEDULED -> COMPLETED"
          - "returns the device from SERVICE_HOLD to ACTIVE, which un-blocks its BLOCKED_BY_SERVICE rollouts"
          - "leaves fee_kind at NONE and fee_cents at 0"
          - "increments Visit.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: SupportAgent
        preconditions: ["Visit.status == SCHEDULED"]
        side_effects:
          - "sets Visit.cancelled_at"
          - "when the cancellation instant is strictly after scheduled_start_at - 24 hours: sets fee_kind = LATE_CANCEL and fee_cents = 4500, unless the household's in-force plan tier is PRO in which case fee_waived = true and fee_cents = 0"
          - "when the cancellation instant is at or before scheduled_start_at - 24 hours: fee_kind stays NONE and fee_cents stays 0"
          - "books fee_cents onto Subscription.next_invoice_adjustment_cents"
          - "releases the slot to OPEN (early) or BLOCKED (late)"
          - "moves the ticket ONSITE -> DISPATCH_PENDING and dispatch SCHEDULED -> RESCHEDULING"
          - "increments Visit.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /visits/{id}/no-show"
        actor: Technician
        preconditions:
          - "Visit.status == SCHEDULED"
          - "logical clock >= Visit.scheduled_start_at"
          - "the acting technician's id == the occupied VisitSlot.technician_id"
        side_effects:
          - "sets fee_kind = NO_SHOW and fee_cents = 9000; the PRO waiver does NOT apply to no-shows"
          - "books 9000 onto Subscription.next_invoice_adjustment_cents"
          - "sets the occupied VisitSlot.status to BLOCKED"
          - "moves the ticket ONSITE -> DISPATCH_PENDING and dispatch SCHEDULED -> NO_SHOW"
          - "increments Visit.version by 1"

  - entity: FirmwareCampaign
    axis: lifecycle
    state_field: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: RING_ACTIVE
        trigger: "POST /firmware-campaigns/{id}/launch-ring"
        actor: PlatformAdmin
        preconditions:
          - "FirmwareCampaign.status == DRAFT"
          - "every device_id in the request is ACTIVE, is of the campaign's model, and has firmware_status NOT IN {BLOCKED, DEFERRED}"
          - "no listed device already has a PENDING rollout whose closed window collides with the requested window (a device may be enrolled in a later, non-colliding window of a second campaign)"
        side_effects:
          - "sets current_ring_index to the requested ring_index, ring_window_start_at and ring_window_end_at"
          - "creates one FirmwareRollout row in PENDING per listed device and moves each device's firmware axis to UPDATE_PENDING"
          - "recomputes ring_device_count, ring_failed_count and ring_failure_rate"
          - "increments FirmwareCampaign.version by 1"
      - from: RING_ACTIVE
        to: RING_ACTIVE
        trigger: "POST /firmware-campaigns/{id}/launch-ring for the next ring_index"
        actor: PlatformAdmin
        preconditions:
          - "FirmwareCampaign.status == RING_ACTIVE"
          - "no FirmwareRollout of the current ring is still PENDING"
          - "requested ring_index == current_ring_index + 1"
        side_effects:
          - "advances current_ring_index and the ring window; creates the next wave of PENDING rollouts"
          - "recomputes ring_device_count, ring_failed_count and ring_failure_rate for the new ring"
          - "increments FirmwareCampaign.version by 1"
      - from: RING_ACTIVE
        to: HALTED
        trigger: "system: a POST /firmware-rollouts/{id}/report-result with result=FAILURE pushed ring_failure_rate to or above halt_failure_rate_pct"
        actor: system
        preconditions: ["FirmwareCampaign.status == RING_ACTIVE", "ring_failure_rate >= halt_failure_rate_pct"]
        side_effects:
          - "sets every FirmwareRollout of the current ring with status == PENDING to BLOCKED_BY_HALT and each such device's firmware_status to BLOCKED"
          - "increments FirmwareCampaign.version by 1"
      - from: HALTED
        to: RING_ACTIVE
        trigger: "POST /firmware-campaigns/{id}/resume"
        actor: PlatformAdmin
        preconditions: ["FirmwareCampaign.status == HALTED"]
        side_effects:
          - "sets every FirmwareRollout of the current ring with status == BLOCKED_BY_HALT back to PENDING and each such device's firmware_status back to UPDATE_PENDING"
          - "increments FirmwareCampaign.version by 1"
        note: "HALTED -> RING_ACTIVE re-entry makes the campaign axis cyclic."
      - from: RING_ACTIVE
        to: COMPLETED
        trigger: "system: the last PENDING rollout of the current ring left PENDING while ring_failure_rate < halt_failure_rate_pct"
        actor: system
        preconditions:
          - "FirmwareCampaign.status == RING_ACTIVE"
          - "no FirmwareRollout of the current ring has status == PENDING"
          - "ring_failure_rate < halt_failure_rate_pct"
        side_effects:
          - "increments FirmwareCampaign.version by 1"
        note: "Cascade hop 5: reached when a rollout is blocked by a device entering SERVICE_HOLD as well as when it is applied."

  - entity: FirmwareRollout
    axis: lifecycle
    state_field: status
    shape: cyclic
    initial_state: PENDING
    terminal_states: [APPLIED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /firmware-rollouts/{id}/report-result with result=SUCCESS"
        actor: Technician
        preconditions:
          - "FirmwareRollout.status == PENDING"
          - "FirmwareCampaign.status == RING_ACTIVE"
        side_effects:
          - "sets last_result = SUCCESS and result_reported_at"
          - "moves the device firmware axis UPDATE_PENDING -> CURRENT and stamps target_firmware_version"
          - "recomputes the campaign's ring counters; completes the campaign when this was the last PENDING rollout of the ring"
          - "increments FirmwareRollout.version by 1"
      - from: PENDING
        to: ROLLED_BACK
        trigger: "POST /firmware-rollouts/{id}/report-result with result=FAILURE"
        actor: Technician
        preconditions:
          - "FirmwareRollout.status == PENDING"
          - "FirmwareCampaign.status == RING_ACTIVE"
        side_effects:
          - "sets last_result = FAILURE and result_reported_at"
          - "moves the device firmware axis UPDATE_PENDING -> ROLLED_BACK, leaving firmware_version unchanged"
          - "recomputes ring_failed_count and ring_failure_rate; halts the campaign when the rate reaches halt_failure_rate_pct"
          - "increments FirmwareRollout.version by 1"
      - from: ROLLED_BACK
        to: PENDING
        trigger: "POST /firmware-rollouts/{id}/retry"
        actor: PlatformAdmin
        preconditions:
          - "FirmwareRollout.status IN {ROLLED_BACK, DEFERRED}"
          - "FirmwareRollout.retry_count < FIRMWARE_MAX_RETRY_COUNT (2)"
          - "FirmwareCampaign.status == RING_ACTIVE"
        side_effects:
          - "increments retry_count by 1 and moves the device firmware axis back to UPDATE_PENDING"
          - "recomputes ring_failed_count and ring_failure_rate"
          - "increments FirmwareRollout.version by 1"
        note: "Capped retry loop PENDING -> ROLLED_BACK -> PENDING; the third retry is refused."
      - from: PENDING
        to: DEFERRED
        trigger: "POST /firmware-rollouts/{id}/defer"
        actor: Owner
        preconditions:
          - "FirmwareRollout.status == PENDING"
          - "FirmwareCampaign.kind == FEATURE_OPTIONAL"
          - "requested defer_until <= logical clock + FIRMWARE_DEFER_MAX_DAYS (14) days"
        side_effects:
          - "sets deferred_until and moves the device firmware axis to DEFERRED"
          - "increments FirmwareRollout.version by 1"
      - from: DEFERRED
        to: PENDING
        trigger: "POST /firmware-rollouts/{id}/retry"
        actor: PlatformAdmin
        preconditions:
          - "FirmwareRollout.status == DEFERRED"
          - "FirmwareRollout.retry_count < FIRMWARE_MAX_RETRY_COUNT (2)"
        side_effects:
          - "clears deferred_until and moves the device firmware axis back to UPDATE_PENDING"
          - "increments FirmwareRollout.version by 1"
      - from: PENDING
        to: BLOCKED_BY_HALT
        trigger: "system: the owning campaign HALTED"
        actor: system
        preconditions: ["FirmwareRollout.status == PENDING", "FirmwareCampaign.status transitioned to HALTED in this request"]
        side_effects:
          - "moves the device firmware axis to BLOCKED"
          - "increments FirmwareRollout.version by 1"
      - from: BLOCKED_BY_HALT
        to: PENDING
        trigger: "POST /firmware-campaigns/{id}/resume"
        actor: PlatformAdmin
        preconditions: ["FirmwareRollout.status == BLOCKED_BY_HALT", "FirmwareCampaign.status == HALTED at request entry"]
        side_effects:
          - "moves the device firmware axis back to UPDATE_PENDING"
          - "increments FirmwareRollout.version by 1"
      - from: PENDING
        to: BLOCKED_BY_SERVICE
        trigger: "system: the target device entered SERVICE_HOLD (cascade hop 4) or was decommissioned"
        actor: system
        preconditions: ["FirmwareRollout.status == PENDING"]
        side_effects:
          - "moves the device firmware axis UPDATE_PENDING -> BLOCKED"
          - "recomputes the campaign's ring counters, which may complete the ring (cascade hop 5)"
          - "increments FirmwareRollout.version by 1"
      - from: BLOCKED_BY_SERVICE
        to: PENDING
        trigger: "system: the target device returned from SERVICE_HOLD to ACTIVE while the campaign is RING_ACTIVE"
        actor: system
        preconditions: ["FirmwareRollout.status == BLOCKED_BY_SERVICE", "FirmwareCampaign.status == RING_ACTIVE"]
        side_effects:
          - "moves the device firmware axis back to UPDATE_PENDING"
          - "increments FirmwareRollout.version by 1"

  - entity: RmaCase
    axis: lifecycle
    state_field: status
    shape: branching
    initial_state: OPEN
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: ROUTED
        trigger: "POST /rma-cases (same request as creation)"
        actor: SupportAgent
        preconditions: ["the routing calculation produced a routing_target"]
        side_effects:
          - "sets warranty_state, routing_target and hold_amount_cents"
          - "when routing_target == ADVANCE_REPLACEMENT: sets hold_state = HELD"
          - "increments RmaCase.version by 1"
      - from: ROUTED
        to: ADVANCE_SHIPPED
        trigger: "POST /rma-cases/{id}/ship-advance-replacement"
        actor: SupportAgent
        preconditions:
          - "RmaCase.status == ROUTED"
          - "RmaCase.routing_target == ADVANCE_REPLACEMENT"
        side_effects:
          - "sets shipped_at and return_deadline_at = shipped_at + 14 days"
          - "moves the device lifecycle axis ACTIVE -> SUSPENDED_RMA"
          - "increments RmaCase.version by 1"
      - from: ADVANCE_SHIPPED
        to: AWAITING_RETURN
        trigger: "POST /rma-cases/{id}/ship-advance-replacement (same request as shipping)"
        actor: SupportAgent
        preconditions: ["RmaCase.shipped_at is not null"]
        side_effects: ["increments RmaCase.version by 1"]
      - from: AWAITING_RETURN
        to: RETURN_RECEIVED
        trigger: "POST /rma-cases/{id}/receive-return"
        actor: SupportAgent
        preconditions:
          - "RmaCase.status == AWAITING_RETURN"
          - "logical clock <= RmaCase.return_deadline_at"
        side_effects:
          - "sets returned_at and hold_state = RELEASED, leaving next_invoice_adjustment_cents untouched"
          - "moves the device lifecycle axis SUSPENDED_RMA -> ACTIVE"
          - "increments RmaCase.version by 1"
      - from: AWAITING_RETURN
        to: RETURN_WINDOW_EXPIRED
        trigger: "POST /rma-cases/{id}/close-return-window"
        actor: SupportAgent
        preconditions:
          - "RmaCase.status == AWAITING_RETURN"
          - "logical clock > RmaCase.return_deadline_at"
        side_effects: ["increments RmaCase.version by 1"]
      - from: RETURN_WINDOW_EXPIRED
        to: CHARGED
        trigger: "POST /rma-cases/{id}/close-return-window (same request)"
        actor: SupportAgent
        preconditions: ["RmaCase.hold_state == HELD"]
        side_effects:
          - "sets hold_state = CHARGED and adds hold_amount_cents to Subscription.next_invoice_adjustment_cents"
          - "moves the device lifecycle axis SUSPENDED_RMA -> ACTIVE"
          - "increments RmaCase.version and Subscription.version by 1 each"
      - from: ROUTED
        to: CLOSED
        trigger: "POST /rma-cases/{id}/receive-return"
        actor: SupportAgent
        preconditions:
          - "RmaCase.status == ROUTED"
          - "RmaCase.routing_target IN {MANUFACTURER, IN_HOUSE_DEPOT, CUSTOMER_PAID_DEPOT}"
        side_effects:
          - "sets returned_at and hold_state stays NONE"
          - "increments RmaCase.version by 1"
        note: "The depot / manufacturer branch never ships an advance unit, so it skips the hold sub-path entirely."
      - from: RETURN_RECEIVED
        to: CLOSED
        trigger: "POST /rma-cases/{id}/close-return-window"
        actor: SupportAgent
        preconditions: ["RmaCase.status == RETURN_RECEIVED"]
        side_effects: ["increments RmaCase.version by 1"]
      - from: CHARGED
        to: CLOSED
        trigger: "POST /rma-cases/{id}/close-return-window (same request as the charge)"
        actor: SupportAgent
        preconditions: ["RmaCase.hold_state == CHARGED"]
        side_effects: ["increments RmaCase.version by 1"]
      - from: ROUTED
        to: SUPERSEDED
        trigger: "POST /rma-cases creating a newer case for the same device"
        actor: SupportAgent
        preconditions: ["RmaCase.status IN {OPEN, ROUTED}"]
        side_effects:
          - "sets the new case's supersedes_rma_id to this case's id"
          - "increments RmaCase.version by 1"
        note: "This is the legitimate supersede that makes POST /rma-cases a true OCC race on Device.version."

  - entity: AddOnOrder
    axis: lifecycle
    state_field: status
    shape: linear
    initial_state: PLACED
    terminal_states: [FULFILLED]
    transitions:
      - from: PLACED
        to: FULFILLED
        trigger: "POST /addon-orders/{id}/fulfill"
        actor: BillingAdmin
        preconditions:
          - "AddOnOrder.status == PLACED"
          - "the household's Subscription.status IN {ACTIVE, PAST_DUE}"
        side_effects:
          - "creates one Device row in CLAIMED per ordered unit and records their ids in fulfilled_device_ids"
          - "recomputes Household.entitled_device_count"
          - "recomputes Subscription.overage_device_count"
          - "increments AddOnOrder.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: rma-open-stale-device
    parent_entity: Device
    write_endpoint: "POST /rma-cases"
    occ_field: "expected_device_version"
    description: |
      Opening an RmaCase against a Device whose version has advanced since the
      client last observed it is rejected. A newer RmaCase legitimately
      supersedes any prior OPEN/ROUTED case on the same device (the prior case
      moves to SUPERSEDED), so the second create would otherwise succeed on its
      own product semantics; the stale-version check is what makes the caller's
      out-of-date view of the device observable.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: tier-change-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscriptions/{id}/change-tier"
    occ_field: "expected_subscription_version"
    description: |
      A tier change legitimately supersedes any pending downgrade already
      recorded on the subscription, so a later change request is valid product
      behaviour rather than an invalid state transition. The stale-version check
      rejects a change issued from a view of the subscription that predates the
      superseding write.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: addon-order-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /addon-orders"
    occ_field: "expected_subscription_version"
    description: |
      Placing an add-on order consumes install credits and books proration
      against the subscription. A second order is perfectly legal product
      behaviour, so the only way to reject a caller who priced their basket
      against an out-of-date install_credits_remaining is the stale-version
      check on Subscription.version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: sla_clock_partition
    trigger: "On POST /tickets/{id}/first-response, POST /tickets/{id}/customer-reply, POST /tickets/{id}/sla-evaluate, GET /tickets/{id}/sla, POST /remote-sessions/{id}/complete and POST /visits/{id}/complete; recomputes Ticket.sla_counted_minutes, sla_paused_minutes and sla_uncovered_minutes."
    algorithm: interval_merge
    formula: |
      eval_at        = min(logical_clock_now, Ticket.resolved_at or logical_clock_now)
      total_minutes  = floor((eval_at - Ticket.created_at) / 60 seconds)

      # Every whole minute m in [Ticket.created_at, eval_at) is classified ONCE,
      # in this fixed precedence:
      #   1. PAUSED    -- m lies inside a closed AWAITING_CUSTOMER segment
      #                   [pause_started_at, resume_at); the currently open
      #                   segment (pause_started_at not null) runs to eval_at.
      #   2. UNCOVERED -- not paused, and the plan's coverage window does not
      #                   contain m.
      #   3. COUNTED   -- everything else.
      sla_paused_minutes    = count of minutes classified PAUSED
      sla_uncovered_minutes = count of minutes classified UNCOVERED
      sla_counted_minutes   = total_minutes - sla_paused_minutes - sla_uncovered_minutes
    input_set: "All AWAITING_CUSTOMER segments of the ticket, closed and open, from created_at to the evaluation instant. Segments are half-open [pause_started_at, resume_at)."
    constants:
      BUSINESS_HOURS_START_UTC_MINUTE: 540
      BUSINESS_HOURS_END_UTC_MINUTE: 1020
      BUSINESS_HOURS_APPLY_ON_WEEKENDS: true
    precision: "whole minutes, floor; never negative"
    variants:
      - name: coverage_twenty_four_seven
        when: "the household's in-force SubscriptionPlan.coverage_mode == TWENTY_FOUR_SEVEN"
        difference: "Every minute is covered, so sla_uncovered_minutes is always 0 and sla_counted_minutes = total_minutes - sla_paused_minutes."
      - name: coverage_business_hours
        when: "the household's in-force SubscriptionPlan.coverage_mode == BUSINESS_HOURS"
        difference: "A minute m counts only when its UTC minute-of-day is in [540, 1020); the same wall-clock span therefore yields strictly fewer counted minutes than the 24x7 variant whenever the span crosses 17:00-09:00 UTC."

  - name: sla_target_selection
    trigger: "On POST /tickets; pins Ticket.first_response_target_minutes and Ticket.onsite_resolution_target_minutes."
    algorithm: tiered_pricing
    formula: |
      plan = the SubscriptionPlan referenced by the household's Subscription.plan_id
      first_response_target_minutes =
          plan.first_response_minutes_p1  if Ticket.severity == "P1"
          plan.first_response_minutes_p2  if Ticket.severity == "P2"
          plan.first_response_minutes_p3  if Ticket.severity == "P3"
      onsite_resolution_target_minutes =
          60 * (plan.onsite_resolution_hours_p1 if severity == "P1" else
                plan.onsite_resolution_hours_p2 if severity == "P2" else
                plan.onsite_resolution_hours_p3)
      # The active target used by every downstream comparison:
      active_target_minutes =
          first_response_target_minutes    if Ticket.first_response_at is null
          onsite_resolution_target_minutes otherwise
    input_set: "The single SubscriptionPlan in force on the household at ticket-creation time; later tier changes do NOT re-pin an existing ticket's targets."
    constants: {}
    precision: "integer minutes"

  - name: sla_breach_ratio_and_tier
    trigger: "Whenever a breach is detected by POST /tickets/{id}/first-response or POST /tickets/{id}/sla-evaluate."
    algorithm: threshold
    formula: |
      overage_ratio = (sla_counted_minutes - active_target_minutes) / active_target_minutes
      breach_tier =
          "MINOR"  if overage_ratio <= SLA_BREACH_TIER_MINOR_MAX_RATIO        # <= 0.25
          "MAJOR"  if overage_ratio <= SLA_BREACH_TIER_MAJOR_MAX_RATIO        # <= 1.00
          "SEVERE" otherwise
      credit_pct =
          SLA_CREDIT_PCT_MINOR  (0.05) if breach_tier == "MINOR"
          SLA_CREDIT_PCT_MAJOR  (0.15) if breach_tier == "MAJOR"
          SLA_CREDIT_PCT_SEVERE (0.30) if breach_tier == "SEVERE"
    input_set: "The single ticket under evaluation; a breach requires sla_counted_minutes STRICTLY greater than active_target_minutes (equality is not a breach)."
    constants:
      SLA_BREACH_TIER_MINOR_MAX_RATIO: 0.25
      SLA_BREACH_TIER_MAJOR_MAX_RATIO: 1.00
      SLA_CREDIT_PCT_MINOR: 0.05
      SLA_CREDIT_PCT_MAJOR: 0.15
      SLA_CREDIT_PCT_SEVERE: 0.30
    precision: "overage_ratio is a real number compared without rounding; tier boundaries are inclusive on the upper side"

  - name: sla_breach_credit_cents
    trigger: "On the sla-axis transition into BREACHED_FIRST_RESPONSE or BREACHED_ONSITE; produces ServiceCredit.uncapped_amount_cents and amount_cents."
    algorithm: weighted_scoring
    formula: |
      credit_pct            = from sla_breach_ratio_and_tier
      uncapped_amount_cents = round_half_up(credit_base_cents * credit_pct)
      cap_remaining_cents   = from credit_cap_remaining_cents
      amount_cents          = min(uncapped_amount_cents, cap_remaining_cents)
      # A ServiceCredit row is created only when amount_cents > 0.
    input_set: "The breaching ticket and the household's Subscription at the moment of the breach."
    constants: {}
    precision: "integer cents, round_half_up"
    variants:
      - name: first_response_breach_base
        when: "the breach is on the first-response target (reason SLA_FIRST_RESPONSE_BREACH)"
        difference: "credit_base_cents = Subscription.monthly_fee_cents only."
      - name: onsite_resolution_breach_base
        when: "the breach is on the onsite-resolution target (reason SLA_ONSITE_BREACH)"
        difference: "credit_base_cents = Subscription.monthly_fee_cents + Subscription.overage_charges_cents_this_cycle, so the identical breach tier yields a strictly larger credit whenever the household has booked overage this cycle."

  - name: credit_cap_remaining_cents
    trigger: "Before every ServiceCredit is written (SLA breach credits and CSAT credits alike)."
    algorithm: aggregation
    formula: |
      cycle_cap_cents     = floor(Subscription.monthly_fee_cents * CREDIT_CAP_PCT_OF_MONTHLY_FEE)
      issued_cents        = sum of ServiceCredit.amount_cents over rows with
                            subscription_id == Subscription.id
                            AND cycle_index == Subscription.cycle_index
      cap_remaining_cents = max(0, cycle_cap_cents - issued_cents)
    input_set: "ServiceCredit rows of the current cycle_index only; rows from earlier cycles never count against the current cap. Ordering is irrelevant because the aggregate is a plain sum."
    constants:
      CREDIT_CAP_PCT_OF_MONTHLY_FEE: 0.50
    precision: "integer cents; the cap itself uses floor, the credit uses round_half_up"

  - name: csat_credit_cents
    trigger: "On POST /tickets/{id}/survey; produces SatisfactionSurvey.credit_variant and credit_cents."
    algorithm: threshold
    formula: |
      low = (SatisfactionSurvey.score <= CSAT_LOW_SCORE_MAX)          # score <= 2
      breached = Ticket.sla_status IN {BREACHED_FIRST_RESPONSE, BREACHED_ONSITE, CREDITED}
      if not low:
          credit_variant = "NONE";  uncapped = 0
      elif breached:
          credit_variant = "BREACH_COMPOUNDED"
          uncapped = round_half_up(Subscription.monthly_fee_cents * CSAT_BREACH_COMPOUNDED_CREDIT_PCT)
      elif in-force SubscriptionPlan.tier == "PRO":
          credit_variant = "GOODWILL"
          uncapped = round_half_up(Subscription.monthly_fee_cents * CSAT_GOODWILL_CREDIT_PCT)
      else:
          credit_variant = "NONE";  uncapped = 0
      credit_cents = min(uncapped, cap_remaining_cents)
    input_set: "The one survey row and its ticket; the SLA axis is read at submission time, not at resolution time."
    constants:
      CSAT_LOW_SCORE_MAX: 2
      CSAT_BREACH_COMPOUNDED_CREDIT_PCT: 0.10
      CSAT_GOODWILL_CREDIT_PCT: 0.05
    precision: "integer cents, round_half_up"
    variants:
      - name: csat_breach_compounded
        when: "score <= 2 AND the ticket's sla axis is in a breached or credited state"
        difference: "Pays 10% of the monthly fee on top of any SLA breach credit already issued this cycle, so the cap is what limits the stack."
      - name: csat_goodwill
        when: "score <= 2, no SLA breach on the ticket, and the in-force plan tier is PRO"
        difference: "Pays 5% of the monthly fee; BASIC and PLUS households in the same situation receive nothing, so identical survey inputs diverge on tier alone."

  - name: device_entitlement_evaluation
    trigger: "On POST /devices/claim, POST /devices/{id}/accept-transfer and POST /addon-orders (projection only)."
    algorithm: threshold
    formula: |
      included = in-force SubscriptionPlan.included_device_count
      before   = Household.entitled_device_count
      after    = before + 1
      if after <= included:
          is_overage = false
      elif Subscription.allow_overage == true:
          is_overage = true
      else:
          reject with ERR_DEVICE_CAP_EXCEEDED
    input_set: "Device rows of the household with lifecycle_status IN {CLAIMED, ACTIVE, SERVICE_HOLD, SUSPENDED_RMA, TRANSFER_PENDING}; DECOMMISSIONED and RECLAIMABLE rows are excluded."
    constants: {}
    precision: "integer counts; the boundary is `after <= included` (claiming the device that makes the count exactly equal to included is free)"

  - name: device_overage_charge_cents
    trigger: "On POST /devices/claim when device_entitlement_evaluation returned is_overage == true."
    algorithm: threshold
    formula: |
      days_remaining = max(0, min(BILLING_CYCLE_DAYS,
                                  floor((Subscription.cycle_end_at - now) / 86400 seconds)))
      if days_remaining >= PRORATION_MIN_DAYS:
          charge = round_half_up(plan.overage_fee_cents_per_device * days_remaining / BILLING_CYCLE_DAYS)
      else:
          charge = 0
      Subscription.overage_charges_cents_this_cycle += charge
      Subscription.next_invoice_adjustment_cents    += charge
    input_set: "The one device being claimed and the subscription's current cycle window."
    constants:
      BILLING_CYCLE_DAYS: 30
      PRORATION_MIN_DAYS: 5
    precision: "integer cents, round_half_up"
    variants:
      - name: overage_prorated
        when: "days_remaining >= 5"
        difference: "Charges the fraction days_remaining/30 of the per-device fee in the current cycle."
      - name: overage_next_cycle_full
        when: "days_remaining < 5"
        difference: "Charges 0 now; the device still sets is_overage = true so the full per-device fee appears from the next cycle onward. Identical device, identical plan, different cents."

  - name: warranty_expiry
    trigger: "On POST /devices/claim and on POST /addon-orders/{id}/fulfill for each created device; pins Device.warranty_expires_at and Device.warranty_basis."
    algorithm: projection
    formula: |
      base_months = DeviceCatalogEntry.base_warranty_months
      if Subscription.status IN {ACTIVE, PAST_DUE} AND plan.warranty_extension_months > 0:
          total_months   = base_months + plan.warranty_extension_months
          warranty_basis = "TIER_EXTENDED"
      else:
          total_months   = base_months
          warranty_basis = "BASE_ONLY"
      # add whole months to purchase_date; if the target month has no such day,
      # clamp to the last day of that month.
      warranty_expires_at = midnight-UTC of (Device.purchase_date + total_months months)
    input_set: "The catalog entry and the plan in force at claim time; a later tier change never re-pins an existing device's warranty."
    constants: {}
    precision: "ISO 8601 UTC with three fractional digits, always at 00:00:00.000Z"
    variants:
      - name: warranty_base_only
        when: "the in-force plan grants 0 extension months, or the subscription is CANCEL_PENDING / CANCELLED / SUSPENDED at claim time"
        difference: "Expiry is purchase_date + base_warranty_months."
      - name: warranty_tier_extended
        when: "the subscription is ACTIVE or PAST_DUE and the plan grants a positive extension"
        difference: "Expiry is purchase_date + base_warranty_months + warranty_extension_months, which can flip an RMA opened on the same date from EXPIRED to IN_WARRANTY."

  - name: warranty_state_evaluation
    trigger: "On POST /rma-cases; sets RmaCase.warranty_state."
    algorithm: threshold
    formula: |
      warranty_state = "IN_WARRANTY" if logical_clock_now < Device.warranty_expires_at else "EXPIRED"
      warranty_remaining_days = max(0, floor((Device.warranty_expires_at - now) / 86400 seconds))
    input_set: "The single device row."
    constants: {}
    precision: "strict `<`: an RMA opened at exactly warranty_expires_at is EXPIRED"

  - name: rma_routing_target
    trigger: "On POST /rma-cases; sets RmaCase.routing_target."
    algorithm: constraint_propagation
    formula: |
      if warranty_state == "EXPIRED":
          target = "CUSTOMER_PAID_DEPOT"
      elif plan.advance_replacement_eligible == true and device_class == "HUB":
          target = "ADVANCE_REPLACEMENT"
      elif plan.advance_replacement_eligible == true
           and device_class in {"CAMERA", "LOCK"}
           and warranty_remaining_days >= ADVANCE_REPLACEMENT_MIN_WARRANTY_DAYS:
          target = "ADVANCE_REPLACEMENT"
      elif DeviceCatalogEntry.manufacturer_service_only == true:
          target = "MANUFACTURER"
      else:
          target = "IN_HOUSE_DEPOT"
    input_set: "warranty_state x DeviceCatalogEntry.device_class x the in-force plan's advance_replacement_eligible flag, evaluated in exactly the order above."
    constants:
      ADVANCE_REPLACEMENT_MIN_WARRANTY_DAYS: 30
    precision: "first matching branch wins; the ordering is normative"

  - name: advance_replacement_hold_cents
    trigger: "On POST /rma-cases when routing_target == ADVANCE_REPLACEMENT; sets RmaCase.hold_amount_cents and hold_state = HELD."
    algorithm: aggregation
    formula: |
      hold_amount_cents = round_half_up(DeviceCatalogEntry.msrp_cents
                                        * ADVANCE_REPLACEMENT_HOLD_PCT_OF_MSRP)
    input_set: "The catalog entry of the faulty device."
    constants:
      ADVANCE_REPLACEMENT_HOLD_PCT_OF_MSRP: 0.60
    precision: "integer cents, round_half_up"

  - name: addon_bundle_pricing
    trigger: "On POST /addon-orders; sets subtotal_cents, bundle_discount_pct, bundle_discount_cents and discounted_subtotal_cents."
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER -- steps run exactly in this sequence:
      # (1) subtotal, (2) discount tier keyed on the subtotal ALONE,
      # (3) install-credit waterfall, (4) install charge, (5) proration,
      # (6) order total. The discount tier is deliberately NOT recomputed after
      # the install charge or the proration is added, even though both raise the
      # amount the customer pays.
      subtotal_cents = sum over lines of (DeviceCatalogEntry.msrp_cents * line.quantity)
      bundle_discount_pct =
          BUNDLE_DISCOUNT_TIER2_PCT (0.15) if subtotal_cents >= 50000
          BUNDLE_DISCOUNT_TIER1_PCT (0.10) if subtotal_cents >= 20000
          0                                 otherwise
      bundle_discount_cents     = round_half_up(subtotal_cents * bundle_discount_pct)
      discounted_subtotal_cents = subtotal_cents - bundle_discount_cents
    input_set: "All lines of the one order, in request order."
    constants:
      BUNDLE_DISCOUNT_TIER1_MIN_SUBTOTAL_CENTS: 20000
      BUNDLE_DISCOUNT_TIER1_PCT: 0.10
      BUNDLE_DISCOUNT_TIER2_MIN_SUBTOTAL_CENTS: 50000
      BUNDLE_DISCOUNT_TIER2_PCT: 0.15
    precision: "integer cents, round_half_up; tier boundaries are inclusive (a subtotal of exactly 20000 gets 10%)"

  - name: addon_install_credit_waterfall
    trigger: "On POST /addon-orders, step (3) of addon_bundle_pricing's pinned order; sets install_credits_applied and install_charge_cents."
    algorithm: waterfall_allocation
    formula: |
      credits = Subscription.install_credits_remaining
      units   = the install-requiring units of the order, expanded one row per
                unit and ordered by: DeviceCatalogEntry.msrp_cents DESC,
                tie-break line position in the request ASC,
                tie-break unit index within the line ASC.
      applied = 0
      for u in units:
          if credits > 0:
              credits -= 1;  applied += 1
      install_credits_applied = applied
      uncovered               = count(units) - applied
      install_charge_cents    = uncovered * INSTALL_VISIT_FEE_CENTS
      Subscription.install_credits_consumed  += applied
      Subscription.install_credits_remaining  = install_credits_granted - install_credits_consumed
    input_set: "Only units whose DeviceCatalogEntry.requires_install == true; units of non-install models are skipped entirely and never consume a credit."
    constants:
      INSTALL_VISIT_FEE_CENTS: 12900
    precision: "integer credits and integer cents; install_credits_remaining is never negative"

  - name: addon_proration_cents
    trigger: "On POST /addon-orders, step (5) of the pinned order; sets monthly_delta_cents, proration_mode and proration_cents."
    algorithm: chronological
    formula: |
      days_remaining = max(0, min(BILLING_CYCLE_DAYS,
                                  floor((Subscription.cycle_end_at - now) / 86400 seconds)))
      included = plan.included_device_count
      running  = Household.entitled_device_count
      # walk lines in REQUEST ORDER, then units within a line, counting which
      # units push the household past `included`
      for each line in request order:
          extra_units_in_line = 0
          for each unit in line (quantity times):
              running += 1
              if running > included: extra_units_in_line += 1
          line_extra[line] = extra_units_in_line
      monthly_delta_cents = plan.overage_fee_cents_per_device * sum(line_extra)

      if days_remaining >= PRORATION_MIN_DAYS:
          proration_mode = "MID_CYCLE_PRORATED"
          # PINNED ROUNDING ORDER: round EACH LINE, then sum the rounded values.
          proration_cents = sum over lines of
              round_half_up(plan.overage_fee_cents_per_device * line_extra[line]
                            * days_remaining / BILLING_CYCLE_DAYS)
      else:
          proration_mode  = "NEXT_CYCLE_FULL"
          proration_cents = 0
    input_set: "The order's lines in request order plus the household's entitled_device_count immediately before the order."
    constants:
      BILLING_CYCLE_DAYS: 30
      PRORATION_MIN_DAYS: 5
    precision: "integer cents, round_half_up, ROUNDED PER LINE THEN SUMMED -- summing first and rounding once is a different (wrong) number"
    variants:
      - name: proration_mid_cycle
        when: "days_remaining >= 5"
        difference: "Bills the per-line prorated delta immediately onto next_invoice_adjustment_cents."
      - name: proration_next_cycle_full
        when: "days_remaining < 5"
        difference: "Bills 0 proration now; monthly_delta_cents is still recorded on the order and takes effect from the next cycle. Same basket, same plan, different order_total_cents."

  - name: addon_order_total_cents
    trigger: "On POST /addon-orders, step (6) of the pinned order."
    algorithm: aggregation
    formula: |
      order_total_cents = discounted_subtotal_cents + install_charge_cents + proration_cents
      Subscription.next_invoice_adjustment_cents += order_total_cents
    input_set: "The three components produced by steps (2), (4) and (5) of the pinned order."
    constants: {}
    precision: "integer cents; no further rounding is applied at this step"

  - name: visit_buffer_overlap
    trigger: "On POST /visits and POST /visits/{id}/reschedule, before the slot is booked."
    algorithm: interval_merge
    formula: |
      # Slots are HALF-OPEN intervals [start_at, end_at).
      # A candidate slot C conflicts with an already-BOOKED slot B of the SAME
      # technician when the buffer-expanded windows strictly overlap:
      conflict = (B.start_at - TRAVEL_BUFFER_MINUTES minutes) < C.end_at
                 AND C.start_at < (B.end_at + TRAVEL_BUFFER_MINUTES minutes)
      # Consequence: if B ends at 10:00 and the buffer is 45 minutes, a
      # candidate starting at exactly 10:45 is ACCEPTED (10:45 < 10:45 is false)
      # while 10:44 is REJECTED.
    input_set: "VisitSlot rows with the same technician_id and status == BOOKED; OPEN and BLOCKED slots never conflict."
    constants:
      TRAVEL_BUFFER_MINUTES: 45
    precision: "whole minutes; strict `<` on both sides, so exact buffer adjacency is legal"

  - name: rollout_window_overlap
    trigger: "On POST /firmware-campaigns/{id}/launch-ring, per listed device."
    algorithm: interval_merge
    formula: |
      # Rollout windows are CLOSED intervals [window_start_at, window_end_at]
      # and there is NO buffer. Touching endpoints DO conflict.
      conflict = R.window_start_at <= C.window_end_at
                 AND C.window_start_at <= R.window_end_at
      # Consequence: an existing PENDING rollout ending at 12:00 conflicts with
      # a new window starting at exactly 12:00 -- the opposite adjacency rule
      # from visit_buffer_overlap.
    input_set: "FirmwareRollout rows for the same device_id with status == PENDING; APPLIED, ROLLED_BACK, DEFERRED and BLOCKED_* rows never conflict."
    constants: {}
    precision: "whole minutes; inclusive `<=` on both sides"

  - name: visit_fee_cents
    trigger: "On POST /visits/{id}/cancel and POST /visits/{id}/no-show."
    algorithm: threshold
    formula: |
      cutoff_at = Visit.scheduled_start_at - LATE_CANCEL_CUTOFF_HOURS hours
      # cancel path
      if now <= cutoff_at:  fee_kind = "NONE";        fee_cents = 0;    fee_waived = false
      else:                 fee_kind = "LATE_CANCEL"; base = LATE_CANCEL_FEE_CENTS
      # no-show path (no cutoff test at all)
      #                     fee_kind = "NO_SHOW";     base = NO_SHOW_FEE_CENTS
      if fee_kind == "LATE_CANCEL" and in-force plan tier == "PRO":
          fee_waived = true;  fee_cents = 0
      else:
          fee_waived = false; fee_cents = base
      Subscription.next_invoice_adjustment_cents += fee_cents
    input_set: "The one visit and the household's in-force plan tier."
    constants:
      LATE_CANCEL_CUTOFF_HOURS: 24
      LATE_CANCEL_FEE_CENTS: 4500
      NO_SHOW_FEE_CENTS: 9000
    precision: "integer cents; the cutoff comparison is `now <= cutoff_at` so cancelling at exactly 24h before start is free"
    variants:
      - name: fee_late_cancel
        when: "the visit was cancelled strictly inside the 24-hour cutoff"
        difference: "Charges 4500, and the charge is fully waived for PRO households."
      - name: fee_no_show
        when: "the technician reported a no-show"
        difference: "Charges 9000 and the PRO waiver does NOT apply, so a PRO household pays 0 for a late cancel and 9000 for a no-show on the same slot."

  - name: ring_failure_rate_and_halt
    trigger: "On POST /firmware-rollouts/{id}/report-result and POST /firmware-rollouts/{id}/retry."
    algorithm: aggregation
    formula: |
      ring_device_count = count of FirmwareRollout rows with campaign_id == C.id
                          AND ring_index == C.current_ring_index
      ring_failed_count = count of those rows with status == ROLLED_BACK
      ring_failure_rate = 0 if ring_device_count == 0
                          else round_half_up(ring_failed_count / ring_device_count, 4)
      halt = (ring_failure_rate >= FirmwareCampaign.halt_failure_rate_pct)
    input_set: "Only rollouts of the campaign's CURRENT ring; earlier rings never re-enter the rate."
    constants:
      FIRMWARE_DEFAULT_HALT_FAILURE_RATE_PCT: 0.20
    precision: "rate rounded to 4 decimals before the comparison; the comparison is `>=`, so 1 failure out of 5 (0.2000) halts while 1 out of 6 (0.1667) does not"

  - name: remote_escalation_threshold
    trigger: "On POST /remote-sessions/{id}/complete."
    algorithm: threshold
    formula: |
      if outcome == "FAILED":
          Ticket.remote_session_failure_count += 1
          escalate = (Ticket.remote_session_failure_count >= REMOTE_FAILURE_ESCALATION_COUNT)
          reason   = "FAILURE_THRESHOLD"
      elif outcome == "HARDWARE_FAULT":
          escalate = true
          reason   = "HARDWARE_FAULT"
      else:            # RESOLVED
          escalate = false
    input_set: "RemoteSession rows of the ticket with outcome == FAILED; sessions of other tickets never count."
    constants:
      REMOTE_FAILURE_ESCALATION_COUNT: 3
    precision: "integer count; the comparison is `>=` on the post-increment value, so the 3rd FAILED completion escalates and the 2nd does not"

  - name: tier_change_proration
    trigger: "On POST /subscriptions/{id}/change-tier."
    algorithm: threshold
    formula: |
      days_remaining = max(0, min(BILLING_CYCLE_DAYS,
                                  floor((Subscription.cycle_end_at - now) / 86400 seconds)))
      old_fee = Subscription.monthly_fee_cents
      new_fee = target SubscriptionPlan.monthly_fee_cents
      if new_fee > old_fee:
          mode   = "UPGRADE_IMMEDIATE"
          charge = round_half_up((new_fee - old_fee) * days_remaining / BILLING_CYCLE_DAYS)
          Subscription.plan_id            = target plan id
          Subscription.monthly_fee_cents  = new_fee
          Subscription.pending_tier_plan_id = null
          Subscription.next_invoice_adjustment_cents += charge
      else:
          mode   = "DOWNGRADE_DEFERRED"
          charge = 0
          Subscription.pending_tier_plan_id = target plan id
          # plan_id and monthly_fee_cents are NOT touched until close-cycle
    input_set: "The subscription's current cycle window and the two plans."
    constants:
      BILLING_CYCLE_DAYS: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: tier_upgrade_immediate
        when: "the target plan's monthly_fee_cents is strictly greater than the current monthly_fee_cents"
        difference: "Switches plan_id now and bills the prorated fee delta immediately; every SLA target pinned on tickets created afterwards uses the new plan."
      - name: tier_downgrade_deferred
        when: "the target plan's monthly_fee_cents is less than or equal to the current monthly_fee_cents"
        difference: "Bills nothing and leaves plan_id untouched; only pending_tier_plan_id moves, and the switch happens at the next close-cycle. Same two plans, opposite direction, completely different observable state."

  - name: slot_capacity_counts
    trigger: "On POST /technicians/{id}/visit-slots, POST /visits, POST /visits/{id}/reschedule, POST /visits/{id}/cancel and POST /visits/{id}/no-show."
    algorithm: aggregation
    formula: |
      total_slot_count   = count of VisitSlot rows with technician_id == T.id
      open_slot_count    = count of those with status == OPEN
      booked_slot_count  = count of those with status == BOOKED
      blocked_slot_count = count of those with status == BLOCKED
    input_set: "All VisitSlot rows of the technician regardless of date; there is no time window filter."
    constants: {}
    precision: "integer counts"

# ---------------------------------------------------------------------------
# Conservation invariants (compensating-action pairs must leave these unchanged)
# ---------------------------------------------------------------------------
conservation_invariants:
  - invariant_id: sla_time_partition
    quantity: "wall-clock minutes of a ticket"
    formula: "Ticket.sla_counted_minutes + Ticket.sla_paused_minutes + Ticket.sla_uncovered_minutes == floor((evaluation_instant - Ticket.created_at) / 60 seconds)"
    compensating_pair: "POST /tickets/{id}/await-customer followed by POST /tickets/{id}/customer-reply"
    note: "The pause moves minutes from the counted bucket to the paused bucket; it must never create or destroy minutes."

  - invariant_id: device_count_conservation
    quantity: "entitled device rows across households"
    formula: "sum over all Household rows of Household.entitled_device_count == count of Device rows with lifecycle_status IN {CLAIMED, ACTIVE, SERVICE_HOLD, SUSPENDED_RMA, TRANSFER_PENDING}"
    compensating_pair: "POST /devices/{id}/transfer followed by POST /devices/{id}/accept-transfer"
    note: "A transfer moves one unit from the source household's count to the target's; the global total is invariant. A decommission is the only operation allowed to lower the global total, and it lowers it by exactly one."

  - invariant_id: slot_capacity_conservation
    quantity: "technician slot rows"
    formula: "Technician.open_slot_count + Technician.booked_slot_count + Technician.blocked_slot_count == Technician.total_slot_count"
    compensating_pair: "POST /visits followed by POST /visits/{id}/cancel"
    note: "Booking moves a slot OPEN -> BOOKED; an early cancel moves it back, a late cancel or no-show moves it to BLOCKED. No path may leave a slot uncounted."

  - invariant_id: credit_money_conservation
    quantity: "service-credit cents in a billing cycle"
    formula: "Subscription.credits_issued_cents_this_cycle == sum of ServiceCredit.amount_cents over rows with subscription_id == Subscription.id AND cycle_index == Subscription.cycle_index, AND that sum <= floor(Subscription.monthly_fee_cents * 0.50)"
    compensating_pair: "POST /tickets/{id}/sla-evaluate followed by POST /tickets/{id}/survey (both credit-issuing)"
    note: "Every issued cent is represented by exactly one ServiceCredit row and the per-cycle total can never exceed the cap."

  - invariant_id: install_credit_conservation
    quantity: "install credits"
    formula: "Subscription.install_credits_remaining + Subscription.install_credits_consumed == Subscription.install_credits_granted"
    compensating_pair: "POST /subscriptions/{id}/close-cycle (grants) followed by POST /addon-orders (consumes)"
    note: "Credits are never destroyed; consumption and the remaining balance always reconcile to the cumulative grant."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated strictly in priority order; the first
# failing rung is the reported error and no later rung runs)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and non-blank, and X-User-ID header present and non-blank whenever X-User-Role is one of the entity-backed roles Owner / Member / BillingAdmin / Technician."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is exactly one of Owner, Member, BillingAdmin, SupportAgent, Technician, PlatformAdmin."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "The role is listed in the target endpoint's roles."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: existence
    check: "For an entity-backed household role, X-User-ID resolves to a HouseholdMember row with is_active == true whose member_role matches the header role; for Technician, X-User-ID resolves to a Technician row."
    error_id: ERR_MEMBER_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint whose roles include Owner, Member, BillingAdmin or Technician"
  - priority: 5
    category: existence
    check: "Every Household id in the path or body exists."
    error_id: ERR_HOUSEHOLD_NOT_FOUND
    http_status: 404
    applies_to: "endpoints taking household_id"
  - priority: 6
    category: existence
    check: "Every SubscriptionPlan id in the path or body exists (plan_id, target_plan_id)."
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/change-tier, GET /subscription-plans/{id}"
  - priority: 7
    category: existence
    check: "Every Subscription id in the path or body exists."
    error_id: ERR_SUBSCRIPTION_NOT_FOUND
    http_status: 404
    applies_to: "subscription endpoints, POST /addon-orders"
  - priority: 8
    category: existence
    check: "Every DeviceCatalogEntry id in the path or body exists, including every catalog_entry_id inside AddOnOrder.lines."
    error_id: ERR_CATALOG_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "POST /devices/claim, POST /addon-orders, POST /firmware-campaigns, GET /device-catalog/{id}"
  - priority: 9
    category: existence
    check: "Every Device id in the path or body exists, including every device_id listed in a launch-ring request."
    error_id: ERR_DEVICE_NOT_FOUND
    http_status: 404
    applies_to: "device endpoints, POST /tickets, POST /rma-cases, POST /firmware-campaigns/{id}/launch-ring"
  - priority: 10
    category: existence
    check: "Every Ticket id in the path or body exists."
    error_id: ERR_TICKET_NOT_FOUND
    http_status: 404
    applies_to: "ticket endpoints, POST /visits, POST /rma-cases"
  - priority: 11
    category: existence
    check: "Every RemoteSession id in the path exists."
    error_id: ERR_SESSION_NOT_FOUND
    http_status: 404
    applies_to: "POST /remote-sessions/{id}/complete, GET /remote-sessions/{id}"
  - priority: 12
    category: existence
    check: "Every Technician id in the path exists."
    error_id: ERR_TECHNICIAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /technicians/{id}/visit-slots, GET /technicians/{id}"
  - priority: 13
    category: existence
    check: "Every VisitSlot id in the path or body exists."
    error_id: ERR_SLOT_NOT_FOUND
    http_status: 404
    applies_to: "POST /visits, POST /visits/{id}/reschedule, GET /visit-slots/{id}"
  - priority: 14
    category: existence
    check: "Every Visit id in the path exists."
    error_id: ERR_VISIT_NOT_FOUND
    http_status: 404
    applies_to: "visit action endpoints, GET /visits/{id}"
  - priority: 15
    category: existence
    check: "Every FirmwareCampaign id in the path exists."
    error_id: ERR_CAMPAIGN_NOT_FOUND
    http_status: 404
    applies_to: "campaign endpoints"
  - priority: 16
    category: existence
    check: "Every FirmwareRollout id in the path exists."
    error_id: ERR_ROLLOUT_NOT_FOUND
    http_status: 404
    applies_to: "rollout endpoints"
  - priority: 17
    category: existence
    check: "Every AddOnOrder id in the path exists."
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /addon-orders/{id}/fulfill, GET /addon-orders/{id}"
  - priority: 18
    category: existence
    check: "Every RmaCase id in the path exists."
    error_id: ERR_RMA_NOT_FOUND
    http_status: 404
    applies_to: "RMA action endpoints, GET /rma-cases/{id}"
  - priority: 19
    category: auth
    check: "Row scope. For Owner / Member / BillingAdmin the acting HouseholdMember.household_id must equal the household that owns the target row (Device.household_id, Ticket.household_id, Subscription.household_id, AddOnOrder.household_id, the Device behind an RmaCase or FirmwareRollout, the Ticket behind a Visit). For Technician the acting Technician.id must equal the VisitSlot.technician_id behind the target Visit / VisitSlot / FirmwareRollout report."
    error_id: ERR_ROW_SCOPE_DENIED
    http_status: 403
    applies_to: "every endpoint whose roles include an entity-backed role and whose target row is household- or technician-scoped"
  - priority: 20
    category: business_constraint
    check: "Request body shape: every required field present, correct JSON type, numeric ranges honoured (score 1..5, quantity >= 1, limit 1..100, offset >= 0, lines 1..5 entries, end_at strictly after start_at, region_code exactly 3 uppercase letters)."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 21
    category: business_constraint
    check: |
      Enum membership. This rung fires for EXACTLY these fields and no others:
      SubscriptionPlan.tier, SubscriptionPlan.coverage_mode,
      HouseholdMember.member_role, Household.account_status (request field),
      DeviceCatalogEntry.device_class, Technician.skills[] elements,
      Ticket.severity, RemoteSession completion `outcome`,
      FirmwareCampaign.kind, rollout `result`, close-cycle `payment_outcome`,
      and the list filters lifecycle_status, workflow_status and slot `status`.
      No other field routes here; every other bad value is ERR_INVALID_REQUEST.
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "the endpoints that accept the fields listed above"
  - priority: 22
    category: state
    check: "Optimistic concurrency: expected_device_version / expected_subscription_version equals the current version of the named parent row."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rma-cases, POST /subscriptions/{id}/change-tier, POST /addon-orders"
  - priority: 23
    category: state
    check: "GATE 1 (gate_precedence order 1): the household that scopes the target row has account_status == SUSPENDED."
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 403
    applies_to: "every mutating endpoint except POST /households, POST /households/{id}/account-status and POST /_clock/set_current_utc"
  - priority: 24
    category: state
    check: "GATE 2 (gate_precedence order 2): the resolved Device.lifecycle_status == DECOMMISSIONED."
    error_id: ERR_DEVICE_DECOMMISSIONED
    http_status: 409
    applies_to: "every mutating endpoint whose target row resolves to a Device"
  - priority: 25
    category: state
    check: "GATE 3 (gate_precedence order 3): the resolved Ticket.workflow_status == CLOSED."
    error_id: ERR_TICKET_CLOSED
    http_status: 409
    applies_to: "every mutating endpoint whose target row resolves to a Ticket, except POST /tickets/{id}/survey"
  - priority: 26
    category: state
    check: "GATE 4 (gate_precedence order 4): the household's Subscription.status == CANCELLED."
    error_id: ERR_SUBSCRIPTION_CANCELLED
    http_status: 409
    applies_to: "every mutating household-scoped endpoint except POST /households/{id}/account-status and POST /subscriptions"
  - priority: 27
    category: state
    check: "The target row's state-machine `from:` state permits the requested transition on the relevant axis. EXEMPTION: POST /visits does NOT report this error for a ticket that is simply not dispatch-ready; the dispatch-readiness of a ticket is reported by priority 40 (ERR_DISPATCH_NOT_REQUIRED) instead, so that rung is reachable for tickets still in NEW / TRIAGED / REMOTE_DIAG."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-changing endpoint except the ticket-workflow precondition of POST /visits"
  - priority: 28
    category: business_safety
    check: "The claimed serial_number starts with the catalog entry's serial_prefix."
    error_id: ERR_SERIAL_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /devices/claim"
  - priority: 29
    category: business_constraint
    check: "serial_number is not already used by any Device row, in any lifecycle_status including DECOMMISSIONED."
    error_id: ERR_SERIAL_ALREADY_CLAIMED
    http_status: 409
    applies_to: "POST /devices/claim"
  - priority: 30
    category: business_temporal
    check: "The logical clock is strictly before Device.activation_expires_at."
    error_id: ERR_ACTIVATION_TOKEN_EXPIRED
    http_status: 409
    applies_to: "POST /devices/{id}/activate"
  - priority: 31
    category: business_constraint
    check: "Device.activation_attempts is strictly below ACTIVATION_MAX_ATTEMPTS (3) BEFORE this attempt, and after a mismatching code the post-increment value is still below 3."
    error_id: ERR_ACTIVATION_ATTEMPTS_EXCEEDED
    http_status: 409
    applies_to: "POST /devices/{id}/activate"
  - priority: 32
    category: business_constraint
    check: "activation_code equals Device.activation_token (checked after rungs 30 and 31, so an expired token reports expiry rather than a bad code)."
    error_id: ERR_ACTIVATION_CODE_INVALID
    http_status: 422
    applies_to: "POST /devices/{id}/activate"
  - priority: 33
    category: business_constraint
    check: "Device.lifecycle_status == RECLAIMABLE."
    error_id: ERR_RECLAIM_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /devices/{id}/reclaim"
  - priority: 34
    category: business_referential
    check: "No RmaCase for the device has status IN {OPEN, ROUTED, ADVANCE_SHIPPED, AWAITING_RETURN}."
    error_id: ERR_RMA_IN_FLIGHT
    http_status: 409
    applies_to: "POST /firmware-campaigns/{id}/launch-ring (any kind), POST /devices/{id}/transfer, POST /devices/{id}/decommission"
  - priority: 35
    category: business_referential
    check: "For a FEATURE_OPTIONAL campaign only, no Ticket referencing the device has workflow_status NOT IN {RESOLVED, CLOSED}. SECURITY_MANDATORY campaigns skip this rung entirely."
    error_id: ERR_OPEN_TICKET_BLOCKS_ROLLOUT
    http_status: 409
    applies_to: "POST /firmware-campaigns/{id}/launch-ring"
  - priority: 36
    category: business_temporal
    check: "The requested ring window does not closed-interval overlap an existing PENDING FirmwareRollout window for the same device."
    error_id: ERR_ROLLOUT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /firmware-campaigns/{id}/launch-ring"
  - priority: 37
    category: state
    check: "The owning FirmwareCampaign.status is not HALTED. Only retry can reach this rung: a halt blocks every PENDING rollout of the ring in the same request, so report-result and defer always fail the earlier from-state rung instead, while a ROLLED_BACK rollout survives the halt and is legally retryable on its own axis."
    error_id: ERR_CAMPAIGN_HALTED
    http_status: 409
    applies_to: "POST /firmware-rollouts/{id}/retry"
  - priority: 38
    category: business_constraint
    check: "The owning FirmwareCampaign.kind == FEATURE_OPTIONAL and defer_until is at or before the logical clock + FIRMWARE_DEFER_MAX_DAYS (14) days."
    error_id: ERR_DEFER_NOT_ALLOWED
    http_status: 409
    applies_to: "POST /firmware-rollouts/{id}/defer"
  - priority: 39
    category: business_constraint
    check: "FirmwareRollout.retry_count is strictly below FIRMWARE_MAX_RETRY_COUNT (2)."
    error_id: ERR_RETRY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /firmware-rollouts/{id}/retry"
  - priority: 40
    category: state
    check: "Ticket.dispatch_status IN {REQUIRED, RESCHEDULING, NO_SHOW} — a visit may not be booked for a ticket that never escalated. This rung, not priority 27, is what a ticket in NEW / TRIAGED / REMOTE_DIAG reports."
    error_id: ERR_DISPATCH_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /visits"
  - priority: 41
    category: business_referential
    check: "VisitSlot.region_code equals the ticket household's region_code."
    error_id: ERR_SLOT_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /visits, POST /visits/{id}/reschedule"
  - priority: 42
    category: state
    check: "The chosen VisitSlot.status == OPEN."
    error_id: ERR_SLOT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /visits, POST /visits/{id}/reschedule"
  - priority: 43
    category: business_temporal
    check: "The chosen slot does not buffer-overlap any BOOKED slot of the same technician per visit_buffer_overlap."
    error_id: ERR_SLOT_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /visits, POST /visits/{id}/reschedule"
  - priority: 44
    category: business_temporal
    check: "The logical clock is at or after Visit.scheduled_start_at."
    error_id: ERR_VISIT_NOT_STARTED
    http_status: 409
    applies_to: "POST /visits/{id}/complete, POST /visits/{id}/no-show"
  - priority: 45
    category: business_temporal
    check: "The logical clock is strictly before Ticket.resolved_at + TICKET_REOPEN_WINDOW_HOURS (168) hours."
    error_id: ERR_REOPEN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /tickets/{id}/reopen"
  - priority: 46
    category: business_constraint
    check: "No SatisfactionSurvey row already exists for the ticket."
    error_id: ERR_SURVEY_ALREADY_SUBMITTED
    http_status: 409
    applies_to: "POST /tickets/{id}/survey"
  - priority: 47
    category: business_temporal
    check: "Ticket.survey_solicited_at is not null and the logical clock is strictly before survey_solicited_at + CSAT_SURVEY_WINDOW_HOURS (72) hours."
    error_id: ERR_SURVEY_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /tickets/{id}/survey"
  - priority: 48
    category: business_constraint
    check: "RmaCase.routing_target == ADVANCE_REPLACEMENT."
    error_id: ERR_ADVANCE_REPLACEMENT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /rma-cases/{id}/ship-advance-replacement"
  - priority: 49
    category: business_temporal
    check: "When RmaCase.status == AWAITING_RETURN the logical clock is strictly after RmaCase.return_deadline_at."
    error_id: ERR_RETURN_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /rma-cases/{id}/close-return-window"
  - priority: 50
    category: business_fiscal
    check: "The post-operation entitled_device_count does not exceed the plan's included_device_count unless the subscription's allow_overage is true."
    error_id: ERR_DEVICE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /devices/claim, POST /devices/{id}/accept-transfer, POST /addon-orders"
  - priority: 51
    category: business_fiscal
    check: "credit_cap_remaining_cents > 0 when an explicit SLA evaluation would otherwise issue a credit."
    error_id: ERR_CREDIT_CAP_REACHED
    http_status: 409
    applies_to: "POST /tickets/{id}/sla-evaluate"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table  (every path is relative to api_prefix /smart-home-support)
# ---------------------------------------------------------------------------
endpoints:
  # ---- Household & members -------------------------------------------------
  - method: POST
    path: "/smart-home-support/households"
    description: "Register a household."
    roles: [PlatformAdmin]
    code: 201
    input: [name, region_code, billing_email]
    output: Household
    side_effects: ["creates a Household in ACTIVE with entitled_device_count 0 and active_device_count 0"]

  - method: GET
    path: "/smart-home-support/households/{id}"
    description: "Read one household including its derived device counts."
    roles: [PlatformAdmin, SupportAgent, Owner, Member, BillingAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []

  - method: POST
    path: "/smart-home-support/households/{id}/account-status"
    description: "Suspend, reinstate or close a household account. This endpoint is exempt from gate 1 and gate 4 so a suspended account can be reinstated."
    roles: [PlatformAdmin]
    code: 200
    input: [account_status]
    output: Household
    side_effects:
      - "sets or clears Household.suspended_at"
      - "increments Household.version by 1"
      - "activates or releases gate_precedence order 1 for the whole household"

  - method: POST
    path: "/smart-home-support/households/{id}/members"
    description: "Add a member to a household."
    roles: [PlatformAdmin, Owner]
    code: 201
    input: [full_name, email, member_role]
    output: HouseholdMember
    side_effects: ["creates a HouseholdMember with is_active true"]

  - method: GET
    path: "/smart-home-support/household-members"
    description: "List household members, optionally filtered by household."
    roles: [PlatformAdmin, SupportAgent, Owner, Member, BillingAdmin]
    code: 200
    input: ["household_id?", "limit?", "offset?"]
    output: HouseholdMember[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/household-members/{id}"
    description: "Read one household member."
    roles: [PlatformAdmin, SupportAgent, Owner, Member, BillingAdmin]
    code: 200
    input: []
    output: HouseholdMember
    side_effects: []

  # ---- Plans & subscriptions ----------------------------------------------
  - method: POST
    path: "/smart-home-support/subscription-plans"
    description: "Create a subscription plan (configuration entity, no version field)."
    roles: [PlatformAdmin]
    code: 201
    input: [tier, monthly_fee_cents, included_device_count, overage_fee_cents_per_device, coverage_mode, first_response_minutes_p1, first_response_minutes_p2, first_response_minutes_p3, onsite_resolution_hours_p1, onsite_resolution_hours_p2, onsite_resolution_hours_p3, warranty_extension_months, included_install_credits, advance_replacement_eligible]
    output: SubscriptionPlan
    side_effects: []

  - method: GET
    path: "/smart-home-support/subscription-plans/{id}"
    description: "Read one subscription plan."
    roles: [PlatformAdmin, SupportAgent, Owner, BillingAdmin]
    code: 200
    input: []
    output: SubscriptionPlan
    side_effects: []

  - method: POST
    path: "/smart-home-support/subscriptions"
    description: "Start a subscription for a household. Exempt from gate 4."
    roles: [PlatformAdmin]
    code: 201
    input: [household_id, plan_id, "allow_overage?"]
    output: Subscription
    side_effects:
      - "pins monthly_fee_cents from the plan"
      - "sets cycle_index 1, cycle_start_at to the logical clock and cycle_end_at to cycle_start_at + 30 days"
      - "grants install_credits_granted = plan.included_install_credits and sets install_credits_remaining to the same value"

  - method: GET
    path: "/smart-home-support/subscriptions"
    description: "List subscriptions, filterable by household, in-force plan, or pending downgrade plan."
    roles: [PlatformAdmin, SupportAgent, Owner, BillingAdmin]
    code: 200
    input: ["household_id?", "plan_id?", "pending_tier_plan_id?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/subscriptions/{id}"
    description: "Read one subscription including credit, overage and install-credit ledgers."
    roles: [PlatformAdmin, SupportAgent, Owner, BillingAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: POST
    path: "/smart-home-support/subscriptions/{id}/change-tier"
    description: "Change tier. Upgrades apply immediately with prorated billing; downgrades are deferred to the next close-cycle. OCC-guarded on Subscription.version."
    roles: [BillingAdmin, PlatformAdmin]
    code: 200
    input: [target_plan_id, expected_subscription_version]
    output: Subscription
    side_effects:
      - "runs tier_change_proration"
      - "on an upgrade sets plan_id and monthly_fee_cents and books the prorated delta on next_invoice_adjustment_cents"
      - "on a downgrade sets pending_tier_plan_id only"
      - "increments Subscription.version by 1"

  - method: POST
    path: "/smart-home-support/subscriptions/{id}/set-overage-policy"
    description: "Toggle whether device claims beyond the included count convert to overage or are rejected."
    roles: [BillingAdmin, PlatformAdmin]
    code: 200
    input: [allow_overage]
    output: Subscription
    side_effects: ["increments Subscription.version by 1"]

  - method: POST
    path: "/smart-home-support/subscriptions/{id}/cancel"
    description: "Request cancellation; the subscription moves to CANCEL_PENDING and becomes CANCELLED at the next close-cycle."
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: ["clears pending_tier_plan_id", "increments Subscription.version by 1"]

  - method: POST
    path: "/smart-home-support/subscriptions/{id}/close-cycle"
    description: "Advance the billing cycle and settle the invoice. Grants fresh install credits, resets the per-cycle credit and overage ledgers, and applies any pending downgrade."
    roles: [PlatformAdmin]
    code: 200
    input: [payment_outcome]
    output: Subscription
    side_effects:
      - "increments cycle_index and rolls cycle_start_at / cycle_end_at forward by 30 days"
      - "grants included_install_credits and recomputes install_credits_remaining"
      - "resets credits_issued_cents_this_cycle, overage_charges_cents_this_cycle, next_invoice_credit_cents and next_invoice_adjustment_cents to 0"
      - "applies pending_tier_plan_id when set"
      - "advances the subscription lifecycle axis per payment_outcome, cascading to Household.account_status on the PAST_DUE -> SUSPENDED hop"
      - "increments Subscription.version by 1"

  # ---- Device catalog & devices -------------------------------------------
  - method: POST
    path: "/smart-home-support/device-catalog"
    description: "Create a catalog model (configuration entity, no version field)."
    roles: [PlatformAdmin]
    code: 201
    input: [model_code, display_name, device_class, serial_prefix, base_warranty_months, requires_install, manufacturer_service_only, msrp_cents, current_firmware_version]
    output: DeviceCatalogEntry
    side_effects: []

  - method: GET
    path: "/smart-home-support/device-catalog/{id}"
    description: "Read one catalog model."
    roles: [PlatformAdmin, SupportAgent, Owner, BillingAdmin]
    code: 200
    input: []
    output: DeviceCatalogEntry
    side_effects: []

  - method: POST
    path: "/smart-home-support/devices/claim"
    description: "Claim a device onto a household. Runs the entitlement cap check, pins warranty, and mints the activation token returned in activation_token."
    roles: [Owner, PlatformAdmin]
    code: 201
    input: [household_id, catalog_entry_id, serial_number, purchase_date]
    output: Device
    side_effects:
      - "runs device_entitlement_evaluation and, when it returns is_overage, device_overage_charge_cents"
      - "runs warranty_expiry to pin warranty_expires_at and warranty_basis"
      - "sets activation_token and activation_expires_at = now + 1440 minutes"
      - "recomputes Household.entitled_device_count and Subscription.overage_device_count"

  - method: GET
    path: "/smart-home-support/devices"
    description: "List devices, filterable by household, model, pending transfer target, or lifecycle state."
    roles: [PlatformAdmin, SupportAgent, Owner, Member, BillingAdmin]
    code: 200
    input: ["household_id?", "catalog_entry_id?", "transfer_target_household_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/devices/{id}"
    description: "Read one device including both status axes and the activation token when still unactivated."
    roles: [PlatformAdmin, SupportAgent, Owner, Member, BillingAdmin]
    code: 200
    input: []
    output: Device
    side_effects: []

  - method: POST
    path: "/smart-home-support/devices/{id}/activate"
    description: "Complete the onboarding handshake by echoing the activation token."
    roles: [Owner]
    code: 200
    input: [activation_code]
    output: Device
    side_effects:
      - "on success moves lifecycle CLAIMED -> ACTIVE, stamps activated_at and firmware_version, clears activation_token"
      - "on a wrong code increments activation_attempts and, at the 3rd attempt, moves lifecycle to RECLAIMABLE"
      - "increments Device.version by 1"

  - method: POST
    path: "/smart-home-support/devices/{id}/reclaim"
    description: "Recover a device stuck unactivated: re-mint the token, reset the attempt counter and return it to CLAIMED."
    roles: [SupportAgent, PlatformAdmin]
    code: 200
    input: []
    output: Device
    side_effects: ["mints a fresh activation_token and activation_expires_at", "resets activation_attempts to 0", "increments Device.version by 1"]

  - method: POST
    path: "/smart-home-support/devices/{id}/decommission"
    description: "Permanently retire a device and free its entitlement slot."
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: Device
    side_effects:
      - "recomputes Household.entitled_device_count and active_device_count"
      - "blocks any PENDING FirmwareRollout for the device"
      - "increments Device.version by 1"

  - method: POST
    path: "/smart-home-support/devices/{id}/transfer"
    description: "Offer ownership of a device to another household."
    roles: [Owner]
    code: 200
    input: [target_household_id]
    output: Device
    side_effects: ["sets transfer_target_household_id and moves lifecycle ACTIVE -> TRANSFER_PENDING", "increments Device.version by 1"]

  - method: POST
    path: "/smart-home-support/devices/{id}/accept-transfer"
    description: "Accept an offered device into the acting member's household; runs the target household's entitlement cap check."
    roles: [Owner]
    code: 200
    input: []
    output: Device
    side_effects:
      - "moves household_id to the target and clears transfer_target_household_id"
      - "recomputes entitled_device_count on both households (device_count_conservation)"
      - "recomputes is_overage against the target plan"
      - "increments Device.version by 1"

  # ---- Tickets -------------------------------------------------------------
  - method: POST
    path: "/smart-home-support/tickets"
    description: "Open a support ticket; pins both SLA targets from the in-force plan and the severity."
    roles: [Owner, Member, SupportAgent]
    code: 201
    input: [household_id, severity, summary, "device_id?", "opened_by_member_id?"]
    output: Ticket
    side_effects: ["runs sla_target_selection to pin first_response_target_minutes and onsite_resolution_target_minutes", "starts the SLA clock at created_at"]

  - method: GET
    path: "/smart-home-support/tickets"
    description: "List tickets, filterable by household, device, opening member or workflow state."
    roles: [PlatformAdmin, SupportAgent, Owner, Member, BillingAdmin]
    code: 200
    input: ["household_id?", "device_id?", "opened_by_member_id?", "workflow_status?", "limit?", "offset?"]
    output: Ticket[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/tickets/{id}"
    description: "Read one ticket with all three status axes and the pinned SLA targets."
    roles: [PlatformAdmin, SupportAgent, Owner, Member, BillingAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects: []

  - method: GET
    path: "/smart-home-support/tickets/{id}/sla"
    description: "Read-only projection of the SLA clock partition at the current logical-clock instant; writes nothing."
    roles: [PlatformAdmin, SupportAgent, Owner]
    code: 200
    input: []
    output: { sla_counted_minutes: integer, sla_paused_minutes: integer, sla_uncovered_minutes: integer, total_elapsed_minutes: integer, active_target_minutes: integer, sla_status: string }
    side_effects: []

  - method: POST
    path: "/smart-home-support/tickets/{id}/first-response"
    description: "Record the first agent response and settle the first-response SLA."
    roles: [SupportAgent]
    code: 200
    input: [note]
    output: Ticket
    side_effects:
      - "sets first_response_at and moves workflow NEW -> TRIAGED"
      - "recomputes the SLA clock partition"
      - "on a breach: moves the sla axis to BREACHED_FIRST_RESPONSE, creates a ServiceCredit (reason SLA_FIRST_RESPONSE_BREACH) when cap room remains, then moves the sla axis to CREDITED"
      - "increments Ticket.version by 1"

  - method: POST
    path: "/smart-home-support/tickets/{id}/await-customer"
    description: "Park the ticket on the customer and PAUSE the SLA clock."
    roles: [SupportAgent]
    code: 200
    input: ["note?"]
    output: Ticket
    side_effects: ["sets pause_started_at", "moves workflow REMOTE_DIAG -> AWAITING_CUSTOMER and the sla axis to PAUSED", "increments Ticket.version by 1"]

  - method: POST
    path: "/smart-home-support/tickets/{id}/customer-reply"
    description: "Customer replies; the paused segment is banked and the SLA clock RESUMES."
    roles: [Owner, Member]
    code: 200
    input: [message]
    output: Ticket
    side_effects: ["adds the closed pause segment to sla_paused_minutes and clears pause_started_at", "moves workflow back to REMOTE_DIAG and the sla axis back to WITHIN", "increments Ticket.version by 1"]

  - method: POST
    path: "/smart-home-support/tickets/{id}/remote-sessions"
    description: "Open a remote troubleshooting session on the ticket."
    roles: [SupportAgent]
    code: 201
    input: []
    output: RemoteSession
    side_effects: ["creates a RemoteSession in IN_PROGRESS with session_index = prior session count + 1", "moves workflow TRIAGED/REOPENED -> REMOTE_DIAG", "increments Ticket.version by 1"]

  - method: POST
    path: "/smart-home-support/tickets/{id}/sla-evaluate"
    description: "Evaluate the SLA clock against the active target and advance the sla axis, issuing a breach credit when one is due."
    roles: [SupportAgent, PlatformAdmin]
    code: 200
    input: []
    output: Ticket
    side_effects:
      - "recomputes sla_counted_minutes / sla_paused_minutes / sla_uncovered_minutes"
      - "moves the sla axis to AT_RISK, BREACHED_FIRST_RESPONSE or BREACHED_ONSITE"
      - "creates a ServiceCredit and moves the sla axis to CREDITED when cap room remains; rejects with ERR_CREDIT_CAP_REACHED when a credit is due but the cycle cap is exhausted"
      - "increments Ticket.version by 1"

  - method: POST
    path: "/smart-home-support/tickets/{id}/close"
    description: "Close a resolved ticket. Activates gate 3 for the ticket."
    roles: [SupportAgent]
    code: 200
    input: []
    output: Ticket
    side_effects: ["sets closed_at", "increments Ticket.version by 1"]

  - method: POST
    path: "/smart-home-support/tickets/{id}/reopen"
    description: "Reopen a resolved ticket inside the 168-hour reopen window."
    roles: [Owner, Member]
    code: 200
    input: [reason]
    output: Ticket
    side_effects: ["clears resolved_at but leaves survey_solicited_at untouched", "moves the sla axis MET -> WITHIN", "increments Ticket.version by 1"]

  - method: POST
    path: "/smart-home-support/tickets/{id}/survey"
    description: "Submit the one-and-only CSAT survey for the ticket, inside the 72-hour window. Exempt from gate 3 so a closed ticket can still be surveyed."
    roles: [Owner, Member]
    code: 201
    input: [score, "comment?"]
    output: SatisfactionSurvey
    side_effects:
      - "runs csat_credit_cents"
      - "creates a ServiceCredit (reason CSAT_BREACH_COMPOUNDED or CSAT_GOODWILL) when the capped amount is > 0"
      - "adds the credit to Subscription.credits_issued_cents_this_cycle and next_invoice_credit_cents"

  # ---- Remote sessions -----------------------------------------------------
  - method: GET
    path: "/smart-home-support/remote-sessions"
    description: "List remote sessions, filterable by ticket."
    roles: [PlatformAdmin, SupportAgent, Owner]
    code: 200
    input: ["ticket_id?", "limit?", "offset?"]
    output: RemoteSession[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/remote-sessions/{id}"
    description: "Read one remote session."
    roles: [PlatformAdmin, SupportAgent, Owner]
    code: 200
    input: []
    output: RemoteSession
    side_effects: []

  - method: POST
    path: "/smart-home-support/remote-sessions/{id}/complete"
    description: "Close a remote session with a verdict. The 3rd FAILED verdict (or any HARDWARE_FAULT verdict) automatically escalates the ticket to a dispatched visit, which is the head of the depth-5 cascade."
    roles: [SupportAgent]
    code: 200
    input: [outcome, "diagnostic_notes?"]
    output: RemoteSession
    side_effects:
      - "hop 1: sets outcome, ended_at and status COMPLETED on the session"
      - "hop 2: on FAILED increments Ticket.remote_session_failure_count; at 3 (or on HARDWARE_FAULT) moves workflow REMOTE_DIAG -> DISPATCH_PENDING and dispatch NOT_REQUIRED -> REQUIRED"
      - "hop 3: moves the ticket's Device ACTIVE -> SERVICE_HOLD"
      - "hop 4: sets every PENDING FirmwareRollout of that device to BLOCKED_BY_SERVICE and its firmware axis to BLOCKED"
      - "hop 5: recomputes the owning FirmwareCampaign's ring counters and completes the campaign when the ring has no PENDING rollouts left and the failure rate is below the halt threshold"
      - "on RESOLVED moves workflow to RESOLVED, stamps resolved_at and survey_solicited_at, and settles the sla axis"

  # ---- Technicians, slots, visits -----------------------------------------
  - method: POST
    path: "/smart-home-support/technicians"
    description: "Register a field technician."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, region_code, skills]
    output: Technician
    side_effects: ["initialises all four slot counters to 0"]

  - method: GET
    path: "/smart-home-support/technicians/{id}"
    description: "Read one technician including the four slot counters used by slot_capacity_conservation."
    roles: [PlatformAdmin, SupportAgent, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: POST
    path: "/smart-home-support/technicians/{id}/visit-slots"
    description: "Publish an availability slot. region_code is copied from the technician."
    roles: [Technician, PlatformAdmin]
    code: 201
    input: [start_at, end_at]
    output: VisitSlot
    side_effects: ["increments Technician.total_slot_count and open_slot_count by 1"]

  - method: GET
    path: "/smart-home-support/visit-slots"
    description: "List slots, filterable by technician and capacity state."
    roles: [PlatformAdmin, SupportAgent, Technician, Owner]
    code: 200
    input: ["technician_id?", "status?", "limit?", "offset?"]
    output: VisitSlot[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/visit-slots/{id}"
    description: "Read one slot."
    roles: [PlatformAdmin, SupportAgent, Technician, Owner]
    code: 200
    input: []
    output: VisitSlot
    side_effects: []

  - method: POST
    path: "/smart-home-support/visits"
    description: "Book an onsite visit for an escalated ticket into an OPEN slot, enforcing region match and the travel-buffer overlap rule."
    roles: [SupportAgent]
    code: 201
    input: [ticket_id, slot_id]
    output: Visit
    side_effects:
      - "runs visit_buffer_overlap against the technician's BOOKED slots"
      - "sets the slot to BOOKED and updates the technician's open/booked counters"
      - "moves workflow DISPATCH_PENDING -> ONSITE and dispatch REQUIRED/RESCHEDULING/NO_SHOW -> SCHEDULED"

  - method: GET
    path: "/smart-home-support/visits"
    description: "List visits, filterable by ticket or slot."
    roles: [PlatformAdmin, SupportAgent, Technician, Owner]
    code: 200
    input: ["ticket_id?", "slot_id?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/visits/{id}"
    description: "Read one visit including any fee booked against it."
    roles: [PlatformAdmin, SupportAgent, Technician, Owner]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: POST
    path: "/smart-home-support/visits/{id}/reschedule"
    description: "Move a scheduled visit to a different OPEN slot; the vacated slot returns to OPEN."
    roles: [SupportAgent]
    code: 200
    input: [new_slot_id]
    output: Visit
    side_effects:
      - "releases the old slot to OPEN and books the new slot"
      - "re-copies scheduled_start_at / scheduled_end_at"
      - "recomputes the technician slot counters on both slots' technicians"
      - "increments Visit.version by 1"

  - method: POST
    path: "/smart-home-support/visits/{id}/cancel"
    description: "Cancel a scheduled visit; late cancellations inside the 24-hour cutoff charge a fee and BLOCK the slot."
    roles: [SupportAgent, Owner]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "runs visit_fee_cents (LATE_CANCEL variant, PRO waiver applies)"
      - "books fee_cents onto Subscription.next_invoice_adjustment_cents"
      - "sets the slot to OPEN (early) or BLOCKED (late)"
      - "moves workflow ONSITE -> DISPATCH_PENDING and dispatch SCHEDULED -> RESCHEDULING"
      - "increments Visit.version by 1"

  - method: POST
    path: "/smart-home-support/visits/{id}/complete"
    description: "Technician completes the onsite visit; resolves the ticket and releases the device from SERVICE_HOLD."
    roles: [Technician]
    code: 200
    input: ["completion_notes?"]
    output: Visit
    side_effects:
      - "moves workflow ONSITE -> RESOLVED, dispatch SCHEDULED -> COMPLETED, and stamps resolved_at / survey_solicited_at"
      - "moves the device SERVICE_HOLD -> ACTIVE and returns its BLOCKED_BY_SERVICE rollouts to PENDING"
      - "settles the sla axis to MET when the onsite target was honoured"
      - "increments Visit.version by 1"

  - method: POST
    path: "/smart-home-support/visits/{id}/no-show"
    description: "Technician reports the customer was absent; charges the no-show fee (never waived) and BLOCKS the slot."
    roles: [Technician]
    code: 200
    input: []
    output: Visit
    side_effects:
      - "runs visit_fee_cents (NO_SHOW variant) and books 9000 onto next_invoice_adjustment_cents"
      - "sets the slot to BLOCKED"
      - "moves workflow ONSITE -> DISPATCH_PENDING and dispatch SCHEDULED -> NO_SHOW"
      - "increments Visit.version by 1"

  # ---- Firmware ------------------------------------------------------------
  - method: POST
    path: "/smart-home-support/firmware-campaigns"
    description: "Create a firmware campaign in DRAFT."
    roles: [PlatformAdmin]
    code: 201
    input: [catalog_entry_id, kind, target_firmware_version, "halt_failure_rate_pct?"]
    output: FirmwareCampaign
    side_effects: ["defaults halt_failure_rate_pct to 0.20 when omitted"]

  - method: GET
    path: "/smart-home-support/firmware-campaigns"
    description: "List campaigns, filterable by catalog model."
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: ["catalog_entry_id?", "limit?", "offset?"]
    output: FirmwareCampaign[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/firmware-campaigns/{id}"
    description: "Read one campaign including the ring counters and failure rate."
    roles: [PlatformAdmin, SupportAgent]
    code: 200
    input: []
    output: FirmwareCampaign
    side_effects: []

  - method: POST
    path: "/smart-home-support/firmware-campaigns/{id}/launch-ring"
    description: "Launch a wave of the campaign over an explicit device list. The whole request is refused if any listed device is blocked."
    roles: [PlatformAdmin]
    code: 200
    input: [ring_index, device_ids, window_start_at, window_end_at]
    output: FirmwareCampaign
    side_effects:
      - "creates one PENDING FirmwareRollout per listed device and moves each device firmware axis CURRENT/ROLLED_BACK -> UPDATE_PENDING"
      - "sets current_ring_index and the closed ring window"
      - "recomputes ring_device_count, ring_failed_count and ring_failure_rate"
      - "increments FirmwareCampaign.version by 1"

  - method: POST
    path: "/smart-home-support/firmware-campaigns/{id}/resume"
    description: "Resume a HALTED campaign, returning its BLOCKED_BY_HALT rollouts to PENDING."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FirmwareCampaign
    side_effects: ["moves every BLOCKED_BY_HALT rollout of the current ring back to PENDING and each device firmware axis back to UPDATE_PENDING", "increments FirmwareCampaign.version by 1"]

  - method: GET
    path: "/smart-home-support/firmware-rollouts"
    description: "List rollouts, filterable by campaign or device."
    roles: [PlatformAdmin, SupportAgent, Technician, Owner]
    code: 200
    input: ["campaign_id?", "device_id?", "limit?", "offset?"]
    output: FirmwareRollout[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/firmware-rollouts/{id}"
    description: "Read one rollout."
    roles: [PlatformAdmin, SupportAgent, Technician, Owner]
    code: 200
    input: []
    output: FirmwareRollout
    side_effects: []

  - method: POST
    path: "/smart-home-support/firmware-rollouts/{id}/report-result"
    description: "Report the outcome of a rollout. A FAILURE rolls the device back and may push the ring failure rate over the halt threshold."
    roles: [Technician, PlatformAdmin]
    code: 200
    input: [result]
    output: FirmwareRollout
    side_effects:
      - "sets last_result and result_reported_at"
      - "moves the device firmware axis to CURRENT (SUCCESS, stamping target_firmware_version) or ROLLED_BACK (FAILURE, firmware_version unchanged)"
      - "recomputes ring_failed_count and ring_failure_rate; HALTS the campaign and blocks the remaining PENDING rollouts when the rate reaches halt_failure_rate_pct"
      - "COMPLETES the campaign when this was the last PENDING rollout of the ring and the rate is below the threshold"
      - "increments FirmwareRollout.version by 1"

  - method: POST
    path: "/smart-home-support/firmware-rollouts/{id}/defer"
    description: "Customer defers an optional feature update. Mandatory security campaigns cannot be deferred."
    roles: [Owner]
    code: 200
    input: [defer_until]
    output: FirmwareRollout
    side_effects: ["sets deferred_until and moves the rollout PENDING -> DEFERRED and the device firmware axis to DEFERRED", "increments FirmwareRollout.version by 1"]

  - method: POST
    path: "/smart-home-support/firmware-rollouts/{id}/retry"
    description: "Return a ROLLED_BACK or DEFERRED rollout to PENDING; capped at 2 retries."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FirmwareRollout
    side_effects: ["increments retry_count", "moves the device firmware axis back to UPDATE_PENDING", "recomputes the ring counters", "increments FirmwareRollout.version by 1"]

  # ---- Add-on sales --------------------------------------------------------
  - method: POST
    path: "/smart-home-support/addon-orders"
    description: "Price and place a multi-line add-on device order. OCC-guarded on Subscription.version because the order consumes install credits."
    roles: [BillingAdmin, Owner]
    code: 201
    input: [household_id, subscription_id, lines, expected_subscription_version]
    output: AddOnOrder
    side_effects:
      - "runs addon_bundle_pricing, addon_install_credit_waterfall, addon_proration_cents and addon_order_total_cents in that pinned order"
      - "decrements Subscription.install_credits_remaining and increments install_credits_consumed"
      - "adds order_total_cents to Subscription.next_invoice_adjustment_cents"
      - "increments Subscription.version by 1"

  - method: GET
    path: "/smart-home-support/addon-orders"
    description: "List add-on orders, filterable by household or subscription."
    roles: [PlatformAdmin, BillingAdmin, Owner]
    code: 200
    input: ["household_id?", "subscription_id?", "limit?", "offset?"]
    output: AddOnOrder[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/addon-orders/{id}"
    description: "Read one add-on order with the full price breakdown."
    roles: [PlatformAdmin, BillingAdmin, Owner]
    code: 200
    input: []
    output: AddOnOrder
    side_effects: []

  - method: POST
    path: "/smart-home-support/addon-orders/{id}/fulfill"
    description: "Ship the order: create one CLAIMED Device per ordered unit with the supplied serials."
    roles: [BillingAdmin, PlatformAdmin]
    code: 200
    input: [serial_numbers, purchase_date]
    output: AddOnOrder
    side_effects:
      - "creates one Device in CLAIMED per unit, in the pinned line/unit order, consuming serial_numbers positionally"
      - "runs warranty_expiry on each created device"
      - "records the new ids in fulfilled_device_ids and recomputes Household.entitled_device_count"
      - "increments AddOnOrder.version by 1"

  # ---- Warranty / RMA ------------------------------------------------------
  - method: POST
    path: "/smart-home-support/rma-cases"
    description: "Open an RMA and route it. OCC-guarded on Device.version because a newer case supersedes any prior open case on the same device."
    roles: [SupportAgent]
    code: 201
    input: [device_id, expected_device_version, "ticket_id?"]
    output: RmaCase
    side_effects:
      - "runs warranty_state_evaluation, rma_routing_target and advance_replacement_hold_cents"
      - "moves any prior OPEN/ROUTED case on the device to SUPERSEDED and records supersedes_rma_id"
      - "sets hold_state HELD when routing_target == ADVANCE_REPLACEMENT"
      - "increments Device.version by 1"

  - method: GET
    path: "/smart-home-support/rma-cases"
    description: "List RMA cases, filterable by device, ticket, or the case they superseded."
    roles: [PlatformAdmin, SupportAgent, Owner]
    code: 200
    input: ["device_id?", "ticket_id?", "supersedes_rma_id?", "limit?", "offset?"]
    output: RmaCase[]
    side_effects: []

  - method: GET
    path: "/smart-home-support/rma-cases/{id}"
    description: "Read one RMA case including the hold ledger."
    roles: [PlatformAdmin, SupportAgent, Owner]
    code: 200
    input: []
    output: RmaCase
    side_effects: []

  - method: POST
    path: "/smart-home-support/rma-cases/{id}/ship-advance-replacement"
    description: "Ship the advance replacement unit and start the 14-day return window."
    roles: [SupportAgent]
    code: 200
    input: []
    output: RmaCase
    side_effects:
      - "sets shipped_at and return_deadline_at = shipped_at + 14 days"
      - "moves the case ROUTED -> ADVANCE_SHIPPED -> AWAITING_RETURN"
      - "moves the device ACTIVE -> SUSPENDED_RMA"
      - "increments RmaCase.version and Device.version by 1 each"

  - method: POST
    path: "/smart-home-support/rma-cases/{id}/receive-return"
    description: "Record receipt of the faulty unit; releases the hold when one is held."
    roles: [SupportAgent]
    code: 200
    input: []
    output: RmaCase
    side_effects:
      - "sets returned_at and hold_state RELEASED (advance branch) or leaves hold_state NONE (depot branch)"
      - "moves the device SUSPENDED_RMA -> ACTIVE on the advance branch"
      - "increments RmaCase.version by 1"

  - method: POST
    path: "/smart-home-support/rma-cases/{id}/close-return-window"
    description: "Close the return window. Past the deadline with the unit unreturned, the held amount is CHARGED to the next invoice."
    roles: [SupportAgent]
    code: 200
    input: []
    output: RmaCase
    side_effects:
      - "moves AWAITING_RETURN -> RETURN_WINDOW_EXPIRED -> CHARGED -> CLOSED when the deadline has passed"
      - "adds hold_amount_cents to Subscription.next_invoice_adjustment_cents on the CHARGED hop"
      - "moves RETURN_RECEIVED -> CLOSED without charging"
      - "increments RmaCase.version by 1"

  # ---- Satisfaction & credits ---------------------------------------------
  - method: GET
    path: "/smart-home-support/surveys"
