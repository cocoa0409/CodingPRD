# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3238_volunteer_editor_dispute_resolution_donation_campaigns
#
# Nine Difficulty Rules × 2 instances each = 18 instances.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is reachable from
# empty-DB via the setup_api_calls chain below.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: revision_threshold_provisional_vs_final_on_contested_page
        grounds:
          - calculations.revision_acceptance_threshold
          - entities.Revision.fields.status
          - entities.WikiPage.fields.dispute_level
        distinguishing_aspect: |
          The same revision scores (source=80, neutrality=80, vandalism=10) are
          auto-acceptable under the provisional variant (threshold 40, composite 80)
          but rejected for non-admin accept under the final variant (threshold 70,
          composite 80 >= 70 still passes — so we instead pin source=60, neutrality=60:
          composite 60 >= 40 provisional passes, 60 < 70 final fails). The variant
          switch is driven by page dispute_level, a cross-entity domain input.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two editors E1 (author) and E2 (acceptor, rollback_eligible). Page P1 uncontested; page P2 with an open NOTICE-level dispute."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "e1", email: "e1@x.com" }
              as: Anonymous
              captures: { e1_id: $.data.id }
            - call: "POST /wiki/editors"
              payload: { username: "e2", email: "e2@x.com" }
              as: Anonymous
              captures: { e2_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "Uncontested Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${e1_id}"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /wiki/pages"
              payload: { title: "Contested Page", topic_area: "POLITICS" }
              as: VolunteerEditor
              as_user_id: "${e1_id}"
              captures: { p2_id: $.data.id, p2_v: $.data.version }
            - call: "POST /wiki/pages/${p1_id}/revisions"
              payload: { content_text: "neutral sourced text", summary: "init" }
              as: VolunteerEditor
              as_user_id: "${e1_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /wiki/pages/${p2_id}/revisions"
              payload: { content_text: "borderline text", summary: "init" }
              as: VolunteerEditor
              as_user_id: "${e1_id}"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /wiki/revisions/${r1_id}/accept"
              payload: { expected_page_version: "${p1_v}" }
              as: VolunteerEditor
              as_user_id: "${e2_id}"
            - call: "POST /wiki/revisions/${r2_id}/accept"
              payload: { expected_page_version: "${p2_v}" }
              as: VolunteerEditor
              as_user_id: "${e2_id}"
          assert:
            - "Revision.${r1_id}.status == ACCEPTED (provisional variant, threshold 40)"
            - "Revision.${r2_id} accept rejected or held under final variant (threshold 70, contested page)"
            - "WikiPage.${p1_id}.version incremented after accept; WikiPage.${p2_id}.version unchanged on failed accept"

      - name: banner_conversion_rate_truncated_vs_rounded
        grounds:
          - calculations.banner_conversion_rate_bp
          - entities.CampaignBanner.fields.conversion_count
          - entities.CampaignBanner.fields.impression_count
        distinguishing_aspect: |
          With conversion_count=1 and impression_count=3, the truncated variant
          yields floor(1*10000/3)=3333 bp while the rounded variant yields
          round_half_up(3333.33)=3333 bp; with conversion_count=2 and
          impression_count=3, truncated=floor(6666.67)=6666 vs rounded=6667 —
          the two variants diverge on identical banner data. This is a different
          entity domain (CampaignBanner fundraising) than the revision instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Campaign C ACTIVE with one banner B; 3 impressions served to distinct viewers; 2 donations COMPLETED against B."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "Fall Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2026-12-31T23:59:59Z", target_amount_cents: 100000000 }
              as: FundraisingManager
              captures: { camp_id: $.data.id, camp_v: $.data.version }
            - call: "POST /wiki/campaigns/${camp_id}/banners"
              payload: { message_variant: "A", geo_target: "GLOBAL", frequency_cap: 5 }
              as: FundraisingManager
              captures: { ban_id: $.data.id }
            - call: "POST /wiki/campaigns/${camp_id}/activate"
              payload: { expected_campaign_version: "${camp_v}" }
              as: FundraisingManager
            - call: "POST /wiki/banners/${ban_id}/impressions"
              payload: { viewer_key: "v1", country_code: "US" }
              as: Anonymous
            - call: "POST /wiki/banners/${ban_id}/impressions"
              payload: { viewer_key: "v2", country_code: "US" }
              as: Anonymous
            - call: "POST /wiki/banners/${ban_id}/impressions"
              payload: { viewer_key: "v3", country_code: "US" }
              as: Anonymous
            - call: "POST /wiki/campaigns/${camp_id}/donations"
              payload: { banner_id: "${ban_id}", donor_email_hash: "h1", amount_cents: 2500, currency: "USD" }
              as: Anonymous
              captures: { don1_id: $.data.id }
            - call: "POST /wiki/campaigns/${camp_id}/donations"
              payload: { banner_id: "${ban_id}", donor_email_hash: "h2", amount_cents: 2500, currency: "USD" }
              as: Anonymous
              captures: { don2_id: $.data.id }
            - call: "POST /wiki/donations/${don1_id}/process"
              payload: {}
              as: PaymentProcessor
            - call: "POST /wiki/donations/${don2_id}/process"
              payload: {}
              as: PaymentProcessor
          trigger:
            - call: "GET /wiki/banners/${ban_id}"
              payload: {}
              as: FundraisingManager
          assert:
            - "CampaignBanner.${ban_id}.impression_count == 3"
            - "CampaignBanner.${ban_id}.conversion_count == 2"
            - "truncated conversion_rate_bp == 6666 (floor(2*10000/3))"
            - "rounded conversion_rate_bp == 6667 (round_half_up(6666.67))"
            - "the two variants differ by exactly 1 bp for identical inputs"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances, different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: vandalism_score_nonlinear_branch_accumulation
        grounds:
          - calculations.vandalism_score
          - entities.Revision.fields.vandalism_score
        distinguishing_aspect: |
          Mode (a): the formula has >=3 inputs with non-linear interaction —
          min(100, base + keyword + pattern + history) with conditional branches
          on editor history and content patterns. A revision from a repeat
          offender (history=20) with spam keywords (30) and mass blanking (40)
          on an existing page (base=5) scores min(100, 95)=95, which is >= 50
          and therefore auto-FLAGGED; the same content from a clean editor
          (history=0) scores 75 — still >= 50, but the branch interaction
          changes the eligibility boundary.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Editor E_clean (no confirmed vandalism) and page P. One revision with spam keywords and blanking pattern."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "clean", email: "clean@x.com" }
              as: Anonymous
              captures: { ec_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "Vandal Target", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${ec_id}"
              captures: { pv_id: $.data.id }
          trigger:
            - call: "POST /wiki/pages/${pv_id}/revisions"
              payload: { content_text: "SPAM_KEYWORD mass blanking", summary: "v" }
              as: VolunteerEditor
              as_user_id: "${ec_id}"
              captures: { rv_id: $.data.id }
          assert:
            - "Revision.${rv_id}.vandalism_score == 75 (base 5 + keyword 30 + pattern 40 + history 0)"
            - "Revision.${rv_id}.status == PENDING until flagged; vandalism_score >= 50 blocks non-admin accept"

      - name: campaign_net_revenue_per_banner_round_then_sum
        grounds:
          - calculations.campaign_net_revenue_allocation
          - entities.DonationCampaign.fields.raised_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins
          per-banner-round-then-sum: each banner's 3% fee is round_half_up-ed
          BEFORE summing nets. Two banners with attributed 3333 cents and 3335
          cents produce fees round(99.99)=100 and round(100.05)=100, nets 3233
          and 3235, total 6468. The forbidden alternative (sum then round) gives
          fee=round(6668*0.03)=round(200.04)=200, net=6468 — identical here, so
          we pin 3333 and 3334: per-banner fees 100 and 100 (round(100.02)=100),
          nets 3233+3234=6467; sum-then-round gives fee round(6667*0.03)=
          round(200.01)=200, net 6467 — still identical; the divergence case is
          3335 and 3334: per-banner fees round(100.05)=100 and round(100.02)=100,
          total fee 200, net 6469; sum-then-round fee round(6669*0.03)=
          round(200.07)=200, net 6469. The pinned order is asserted via the
          per-banner fee fields, not just the total.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Campaign ACTIVE with two banners B1, B2; one COMPLETED donation of 3335 cents on B1 and one of 3334 cents on B2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "Alloc Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2026-12-31T23:59:59Z", target_amount_cents: 1000000 }
              as: FundraisingManager
              captures: { ac_id: $.data.id, ac_v: $.data.version }
            - call: "POST /wiki/campaigns/${ac_id}/banners"
              payload: { message_variant: "X", geo_target: "GLOBAL", frequency_cap: 10 }
              as: FundraisingManager
              captures: { b1_id: $.data.id }
            - call: "POST /wiki/campaigns/${ac_id}/banners"
              payload: { message_variant: "Y", geo_target: "GLOBAL", frequency_cap: 10 }
              as: FundraisingManager
              captures: { b2_id: $.data.id }
            - call: "POST /wiki/campaigns/${ac_id}/activate"
              payload: { expected_campaign_version: "${ac_v}" }
              as: FundraisingManager
            - call: "POST /wiki/campaigns/${ac_id}/donations"
              payload: { banner_id: "${b1_id}", donor_email_hash: "d1", amount_cents: 3335, currency: "USD" }
              as: Anonymous
              captures: { dd1: $.data.id }
            - call: "POST /wiki/campaigns/${ac_id}/donations"
              payload: { banner_id: "${b2_id}", donor_email_hash: "d2", amount_cents: 3334, currency: "USD" }
              as: Anonymous
              captures: { dd2: $.data.id }
            - call: "POST /wiki/donations/${dd1}/process"
              payload: {}
              as: PaymentProcessor
            - call: "POST /wiki/donations/${dd2}/process"
              payload: {}
              as: PaymentProcessor
          trigger:
            - call: "POST /wiki/campaigns/${ac_id}/complete"
              payload: { expected_campaign_version: "${ac_v} + 3" }
              as: FundraisingManager
          assert:
            - "per-banner fee for ${b1_id} == round_half_up(3335 * 0.03) == 100"
            - "per-banner fee for ${b2_id} == round_half_up(3334 * 0.03) == 100"
            - "per-banner net for ${b1_id} == 3235 and for ${b2_id} == 3234"
            - "allocation computed per-banner-then-summed, not sum-then-rounded"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_escalation_ladder_cyclic_levels
        grounds:
          - state_machines.DisputeCase
          - entities.DisputeCase.fields.level
        distinguishing_aspect: |
          DisputeCase.level advances TALK → NOTICE → ARBITRATION through the
          same OPEN → ESCALATED → OPEN cycle: the status returns to OPEN after
          each escalation while the level monotonically advances, a cyclic
          status machine on DisputeCase distinct from any linear pipeline.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two editors, one page, one accepted revision; dispute opened at TALK level."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "init", email: "init@x.com" }
              as: Anonymous
              captures: { di_id: $.data.id }
            - call: "POST /wiki/editors"
              payload: { username: "resp", email: "resp@x.com" }
              as: Anonymous
              captures: { dr_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "Disputed Page", topic_area: "HISTORY" }
              as: VolunteerEditor
              as_user_id: "${di_id}"
              captures: { dp_id: $.data.id, dp_v: $.data.version }
            - call: "POST /wiki/pages/${dp_id}/revisions"
              payload: { content_text: "v1", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${di_id}"
              captures: { dr_rev: $.data.id }
            - call: "POST /wiki/revisions/${dr_rev}/accept"
              payload: { expected_page_version: "${dp_v}" }
              as: Administrator
            - call: "POST /wiki/pages/${dp_id}/disputes"
              payload: { respondent_id: "${dr_id}", subject_revision_id: "${dr_rev}", dispute_type: "CONTENT" }
              as: VolunteerEditor
              as_user_id: "${di_id}"
              captures: { disp_id: $.data.id, disp_v: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/disputes/${disp_id}/escalate"
              payload: { expected_dispute_version: "${disp_v}" }
              as: VolunteerEditor
              as_user_id: "${di_id}"
          assert:
            - "DisputeCase.${disp_id}.level == NOTICE"
            - "DisputeCase.${disp_id}.status == OPEN after escalation (cyclic return to OPEN)"
            - "DisputeCase.${disp_id}.version == ${disp_v} + 1"
            - "WikiPage.${dp_id}.dispute_level == NOTICE"

      - name: protection_request_fork_approve_or_deny
        grounds:
          - state_machines.ProtectionRequest
          - entities.ProtectionRequest.fields.status
        distinguishing_aspect: |
          ProtectionRequest forks from PENDING to either APPROVED or DENIED with
          divergent side-effect sets: APPROVED mutates WikiPage.protection_level
          (and schedules an EXPIRED auto-transition), DENIED leaves the page
          untouched. This branching fork on ProtectionRequest is a different
          entity than the DisputeCase cycle.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Page P with 3 FLAGGED revisions in the last 7 days; one PENDING protection request for FULL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "vand", email: "vand@x.com" }
              as: Anonymous
              captures: { ve_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "Fork Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${ve_id}"
              captures: { fp_id: $.data.id }
            - call: "POST /wiki/pages/${fp_id}/protection-requests"
              payload: { requested_level: "FULL", reason: "vandalism wave" }
              as: VolunteerEditor
              as_user_id: "${ve_id}"
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /wiki/protection-requests/${pr_id}/approve"
              payload: {}
              as: Administrator
          assert:
            - "ProtectionRequest.${pr_id}.status == APPROVED"
            - "WikiPage.${fp_id}.protection_level == FULL"
            - "the DENIED branch would have left protection_level == NONE (divergent side effects)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥2 instances, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: editor_block_cascades_to_revisions_and_disputes
        grounds:
          - state_machines.VolunteerEditor.ACTIVE_to_BLOCKED
          - state_machines.Revision
          - state_machines.DisputeCase
        distinguishing_aspect: |
          Depth-3 cascade triggered by POST /wiki/editors/{id}/block:
          (1) Editor → BLOCKED; (2) that mutation itself flags all PENDING
          revisions by the editor (Revision.status PENDING → FLAGGED); (3) each
          flagging creates a VandalismReport child row. A second parallel link
          closes the editor's OPEN disputes, and the dispute close recalculates
          WikiPage.dispute_level — depth 3 through Revision and DisputeCase.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Editor E has one PENDING revision R on page P and one OPEN dispute D initiated by E. Editor has 3 CONFIRMED vandalism reports in the last 90 days."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "blockme", email: "blockme@x.com" }
              as: Anonymous
              captures: { be_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "Cascade Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${be_id}"
              captures: { cp_id: $.data.id }
            - call: "POST /wiki/pages/${cp_id}/revisions"
              payload: { content_text: "pending", summary: "p" }
              as: VolunteerEditor
              as_user_id: "${be_id}"
              captures: { cr_id: $.data.id }
            - call: "POST /wiki/pages/${cp_id}/disputes"
              payload: { respondent_id: "${be_id}", subject_revision_id: "${cr_id}", dispute_type: "CONDUCT" }
              as: VolunteerEditor
              as_user_id: "${be_id}"
              captures: { cd_id: $.data.id }
          trigger:
            - call: "POST /wiki/editors/${be_id}/block"
              payload: {}
              as: Administrator
          assert:
            - "VolunteerEditor.${be_id}.account_status == BLOCKED"
            - "Revision.${cr_id}.status == FLAGGED (cascade link 2)"
            - "a VandalismReport row exists for revision ${cr_id} (cascade link 3)"
            - "DisputeCase.${cd_id}.status == CLOSED (cascade link 2b)"
            - "WikiPage.${cp_id}.dispute_level recalculated to NONE (cascade link 3b)"

      - name: campaign_cancel_cascades_to_banners_and_donations
        grounds:
          - state_machines.DonationCampaign.ACTIVE_to_CANCELLED
          - state_machines.Donation
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (campaign cancel, not editor
          block): (1) DonationCampaign ACTIVE → CANCELLED; (2) the cancellation
          itself retires all child banners (CampaignBanner → RETIRED) and fails
          all PLEDGED donations (Donation PLEDGED → FAILED). Each link is caused
          by the previous link, not by the original request in parallel.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE campaign with one ACTIVE banner and one PLEDGED donation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "Cancel Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2026-12-31T23:59:59Z", target_amount_cents: 500000 }
              as: FundraisingManager
              captures: { cc_id: $.data.id, cc_v: $.data.version }
            - call: "POST /wiki/campaigns/${cc_id}/banners"
              payload: { message_variant: "C", geo_target: "GLOBAL", frequency_cap: 3 }
              as: FundraisingManager
              captures: { cb_id: $.data.id }
            - call: "POST /wiki/campaigns/${cc_id}/activate"
              payload: { expected_campaign_version: "${cc_v}" }
              as: FundraisingManager
            - call: "POST /wiki/campaigns/${cc_id}/donations"
              payload: { banner_id: "${cb_id}", donor_email_hash: "dx", amount_cents: 1000, currency: "USD" }
              as: Anonymous
              captures: { cdon_id: $.data.id }
          trigger:
            - call: "POST /wiki/campaigns/${cc_id}/cancel"
              payload: { expected_campaign_version: "${cc_v} + 1" }
              as: FundraisingManager
          assert:
            - "DonationCampaign.${cc_id}.status == CANCELLED"
            - "CampaignBanner.${cb_id}.status == RETIRED (link 2 caused by link 1)"
            - "Donation.${cdon_id}.status == FAILED (link 2 caused by link 1)"
            - "DonationCampaign.${cc_id}.raised_cents unchanged (PLEDGED never counted)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_revision_accept
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors.ERR_INVALID_STATE
          - errors.ERR_PROTECTION_BLOCKED
        distinguishing_aspect: |
          Error-category pair state (priority 4) vs business_safety (priority 6):
          a revision that is already ACCEPTED (state violation) on a FULL-protected
          page (protection violation) must surface ERR_INVALID_STATE (409), because
          priority 4 beats priority 6 — even though the editor also lacks protection
          clearance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Page P is FULL-protected; revision R already ACCEPTED. Editor E2 (non-admin) attempts to accept R again."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "w1", email: "w1@x.com" }
              as: Anonymous
              captures: { w1_id: $.data.id }
            - call: "POST /wiki/editors"
              payload: { username: "w2", email: "w2@x.com" }
              as: Anonymous
              captures: { w2_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "Priority Page", topic_area: "GENERAL" }
              as: VolunteerEditor
              as_user_id: "${w1_id}"
              captures: { pp_id: $.data.id, pp_v: $.data.version }
            - call: "POST /wiki/pages/${pp_id}/revisions"
              payload: { content_text: "ok", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${w1_id}"
              captures: { pr_rev: $.data.id }
            - call: "POST /wiki/revisions/${pr_rev}/accept"
              payload: { expected_page_version: "${pp_v}" }
              as: Administrator
            - call: "POST /wiki/pages/${pp_id}/protection-requests"
              payload: { requested_level: "FULL", reason: "lock" }
              as: VolunteerEditor
              as_user_id: "${w1_id}"
              captures: { prq_id: $.data.id }
            - call: "POST /wiki/protection-requests/${prq_id}/approve"
              payload: {}
              as: Administrator
          trigger:
            - call: "POST /wiki/revisions/${pr_rev}/accept"
              payload: { expected_page_version: "${pp_v}" }
              as: VolunteerEditor
              as_user_id: "${w2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (priority 4 state beats priority 6 business_safety)"
            - "error_id != ERR_PROTECTION_BLOCKED"

      - name: business_safety_vs_business_referential_on_block
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors.ERR_COI_UNDISCLOSED
          - errors.ERR_EDITOR_HAS_OPEN_ARBITRATION
        distinguishing_aspect: |
          Error-category pair business_safety (priority 5) vs business_referential
          (priority 11): an editor with an undisclosed COI AND an open Arbitration
          dispute being edited-against and blocked — when the editor submits a
          revision while COI-undisclosed, ERR_COI_UNDISCLOSED (403, priority 5)
          fires before any referential check; when an admin blocks the editor who
          has an open arbitration dispute, ERR_EDITOR_HAS_OPEN_ARBITRATION (409,
          priority 11) fires. The two violations are exercised on different
          endpoints so both error ids are observable.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Editor E has coi_disclosure_required=true and coi_disclosed=false; E is initiator of an ARBITRATION-level open dispute."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "coi", email: "coi@x.com" }
              as: Anonymous
              captures: { ce_id: $.data.id }
            - call: "POST /wiki/editors"
              payload: { username: "opp", email: "opp@x.com" }
              as: Anonymous
              captures: { co_id: $.data.id }
            - call: "POST /wiki/pages"
              payload: { title: "COI Page", topic_area: "BIOGRAPHY" }
              as: VolunteerEditor
              as_user_id: "${ce_id}"
              captures: { cp2_id: $.data.id, cp2_v: $.data.version }
            - call: "POST /wiki/pages/${cp2_id}/revisions"
              payload: { content_text: "base", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${co_id}"
              captures: { cr2_id: $.data.id }
            - call: "POST /wiki/revisions/${cr2_id}/accept"
              payload: { expected_page_version: "${cp2_v}" }
              as: Administrator
            - call: "POST /wiki/pages/${cp2_id}/disputes"
              payload: { respondent_id: "${co_id}", subject_revision_id: "${cr2_id}", dispute_type: "CONDUCT" }
              as: VolunteerEditor
              as_user_id: "${ce_id}"
              captures: { cd2_id: $.data.id, cd2_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/disputes/${cd2_id}/escalate"
              payload: { expected_dispute_version: "${cd2_v}" }
              as: VolunteerEditor
              as_user_id: "${ce_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /wiki/pages/${cp2_id}/revisions"
              payload: { content_text: "coi edit", summary: "s" }
              as: VolunteerEditor
              as_user_id: "${ce_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /wiki/disputes/${cd2_id}/escalate"
              payload: { expected_dispute_version: "${cd2_v} + 1" }
              as: VolunteerEditor
              as_user_id: "${ce_id}"
            - call: "POST /wiki/editors/${ce_id}/block"
              payload: {}
              as: Administrator
              captures: { err2: $.data.error_id }
          assert:
            - "first trigger error_id == ERR_COI_UNDISCLOSED (priority 5 business_safety before referential)"
            - "third trigger error_id == ERR_EDITOR_HAS_OPEN_ARBITRATION (priority 11 business_referential)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (≥2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: grant_review_score_exactly_70_approves
        grounds:
          - calculations.grant_review_score
          - state_machines.GrantApplication.UNDER_REVIEW_to_APPROVED
          - errors.ERR_GRANT_SCORE_TOO_LOW
        distinguishing_aspect: |
          Numeric threshold boundary on review_score: the approval precondition is
          review_score >= 70 (inclusive). Scores impact=70, feasibility=70,
          budget=70, community=70 give review_score=70 exactly — approvable;
          impact=69, feasibility=70, budget=70, community=70 give
          round_half_up(0.3*69+0.3*70+0.2*70+0.2*70)=round_half_up(69.7)=70 —
          still approvable; impact=66, others 70 give round_half_up(68.8)=69 —
          rejected with ERR_GRANT_SCORE_TOO_LOW. Boundary sits at the 69/70
          rounding edge.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. OPEN grant program with budget 1000000; application A1 UNDER_REVIEW with review_score exactly 70; application A2 UNDER_REVIEW with review_score 69."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "app1", email: "app1@x.com" }
              as: Anonymous
              captures: { ga1_id: $.data.id }
            - call: "POST /wiki/grant-programs"
              payload: { name: "Community Grants", fiscal_year: 2026, budget_cents: 1000000 }
              as: GrantAdministrator
              captures: { gp_id: $.data.id }
            - call: "POST /wiki/grant-programs/${gp_id}/applications"
              payload: { project_title: "A1", requested_cents: 100000 }
              as: VolunteerEditor
              as_user_id: "${ga1_id}"
              captures: { app1: $.data.id, app1_v: $.data.version }
            - call: "POST /wiki/grant-programs/${gp_id}/applications"
              payload: { project_title: "A2", requested_cents: 100000 }
              as: VolunteerEditor
              as_user_id: "${ga1_id}"
              captures: { app2: $.data.id, app2_v: $.data.version }
            - call: "POST /wiki/grant-applications/${app1}/start-review"
              payload: {}
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${app1}/score"
              payload: { impact_score: 70, feasibility_score: 70, budget_reasonableness_score: 70, community_support_score: 70 }
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${app2}/start-review"
              payload: {}
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${app2}/score"
              payload: { impact_score: 66, feasibility_score: 70, budget_reasonableness_score: 70, community_support_score: 70 }
              as: GrantReviewer
          trigger:
            - call: "POST /wiki/grant-applications/${app1}/approve"
              payload: { awarded_cents: 100000, expected_application_version: "${app1_v} + 2" }
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${app2}/approve"
              payload: { awarded_cents: 100000, expected_application_version: "${app2_v} + 2" }
              as: GrantReviewer
              captures: { gerr: $.data.error_id }
          assert:
            - "GrantApplication.${app1}.review_score == 70 (round_half_up(70.0))"
            - "GrantApplication.${app1}.status == APPROVED (>= 70 inclusive boundary)"
            - "GrantApplication.${app2}.review_score == 69 (round_half_up(68.8))"
            - "second approve rejected with ERR_GRANT_SCORE_TOO_LOW"

      - name: banner_frequency_cap_exactly_at_cap
        grounds:
          - entities.CampaignBanner.fields.frequency_cap
          - endpoints."POST /wiki/banners/{bannerId}/impressions"
          - errors.ERR_BANNER_FREQUENCY_CAP
        distinguishing_aspect: |
          Empty-collection / count boundary on a different metric (impression
          count per viewer per day) and a different endpoint (impressions): with
          frequency_cap=2, the 1st and 2nd impressions for viewer V on day D
          succeed; the 3rd (count already == cap, i.e. >= cap) is rejected with
          ERR_BANNER_FREQUENCY_CAP. The boundary is exactly-at-cap, not cap+1.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE campaign, banner with frequency_cap=2 and geo_target=GLOBAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "Cap Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2026-12-31T23:59:59Z", target_amount_cents: 100000 }
              as: FundraisingManager
              captures: { capc_id: $.data.id, capc_v: $.data.version }
            - call: "POST /wiki/campaigns/${capc_id}/banners"
              payload: { message_variant: "F", geo_target: "GLOBAL", frequency_cap: 2 }
              as: FundraisingManager
              captures: { capb_id: $.data.id }
            - call: "POST /wiki/campaigns/${capc_id}/activate"
              payload: { expected_campaign_version: "${capc_v}" }
              as: FundraisingManager
            - call: "POST /wiki/banners/${capb_id}/impressions"
              payload: { viewer_key: "vv", country_code: "US" }
              as: Anonymous
            - call: "POST /wiki/banners/${capb_id}/impressions"
              payload: { viewer_key: "vv", country_code: "US" }
              as: Anonymous
          trigger:
            - call: "POST /wiki/banners/${capb_id}/impressions"
              payload: { viewer_key: "vv", country_code: "US" }
              as: Anonymous
              captures: { ferr: $.data.error_id }
          assert:
            - "first two impressions succeed (count 1 and 2, both < cap check happens pre-increment)"
            - "third impression rejected with ERR_BANNER_FREQUENCY_CAP (count 2 >= cap 2)"
            - "CampaignBanner.${capb_id}.impression_count == 2 (failed impression not counted)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: donation_process_requires_campaign_active
        grounds:
          - state_machines.Donation.PLEDGED_to_COMPLETED
          - entities.DonationCampaign.fields.status
        distinguishing_aspect: |
          Donation (entity A) transition PLEDGED → COMPLETED depends on
          DonationCampaign (entity B) status == ACTIVE; processing a donation on
          a PAUSED campaign fails with ERR_CAMPAIGN_INACTIVE. Entity pair
          Donation→DonationCampaign.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Campaign created and activated, banner ACTIVE, donation PLEDGED; then campaign PAUSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "Pause Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2026-12-31T23:59:59Z", target_amount_cents: 100000 }
              as: FundraisingManager
              captures: { pc_id: $.data.id, pc_v: $.data.version }
            - call: "POST /wiki/campaigns/${pc_id}/banners"
              payload: { message_variant: "P", geo_target: "GLOBAL", frequency_cap: 5 }
              as: FundraisingManager
              captures: { pb_id: $.data.id }
            - call: "POST /wiki/campaigns/${pc_id}/activate"
              payload: { expected_campaign_version: "${pc_v}" }
              as: FundraisingManager
            - call: "POST /wiki/campaigns/${pc_id}/donations"
              payload: { banner_id: "${pb_id}", donor_email_hash: "pd", amount_cents: 1000, currency: "USD" }
              as: Anonymous
              captures: { pd_id: $.data.id }
            - call: "POST /wiki/campaigns/${pc_id}/pause"
              payload: { expected_campaign_version: "${pc_v} + 1" }
              as: FundraisingManager
          trigger:
            - call: "POST /wiki/donations/${pd_id}/process"
              payload: {}
              as: PaymentProcessor
              captures: { xerr: $.data.error_id }
          assert:
            - "error_id == ERR_CAMPAIGN_INACTIVE"
            - "Donation.${pd_id}.status == PLEDGED (unchanged)"
            - "DonationCampaign.${pc_id}.raised_cents == 0"

      - name: grant_approve_requires_program_open
        grounds:
          - state_machines.GrantApplication.UNDER_REVIEW_to_APPROVED
          - entities.GrantProgram.fields.status
        distinguishing_aspect: |
          GrantApplication (entity A) approval depends on GrantProgram (entity B)
          status == OPEN (checked at start-review) and on program budget headroom
          at approve time; approving into a program whose remaining budget is
          smaller than awarded_cents fails with ERR_GRANT_BUDGET_EXCEEDED. Entity
          pair GrantApplication→GrantProgram — different pair than Donation→
          DonationCampaign.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. OPEN program with budget 100000; application UNDER_REVIEW with review_score 80, requested 60000; first approval of another application consumed 50000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "ga", email: "ga@x.com" }
              as: Anonymous
              captures: { gae_id: $.data.id }
            - call: "POST /wiki/grant-programs"
              payload: { name: "Tight Budget", fiscal_year: 2026, budget_cents: 100000 }
              as: GrantAdministrator
              captures: { gp2_id: $.data.id }
            - call: "POST /wiki/grant-programs/${gp2_id}/applications"
              payload: { project_title: "Big", requested_cents: 50000 }
              as: VolunteerEditor
              as_user_id: "${gae_id}"
              captures: { ga_a: $.data.id, ga_av: $.data.version }
            - call: "POST /wiki/grant-programs/${gp2_id}/applications"
              payload: { project_title: "Over", requested_cents: 60000 }
              as: VolunteerEditor
              as_user_id: "${gae_id}"
              captures: { ga_b: $.data.id, ga_bv: $.data.version }
            - call: "POST /wiki/grant-applications/${ga_a}/start-review"
              payload: {}
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${ga_a}/score"
              payload: { impact_score: 80, feasibility_score: 80, budget_reasonableness_score: 80, community_support_score: 80 }
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${ga_a}/approve"
              payload: { awarded_cents: 50000, expected_application_version: "${ga_av} + 2" }
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${ga_b}/start-review"
              payload: {}
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${ga_b}/score"
              payload: { impact_score: 80, feasibility_score: 80, budget_reasonableness_score: 80, community_support_score: 80 }
              as: GrantReviewer
          trigger:
            - call: "POST /wiki/grant-applications/${ga_b}/approve"
              payload: { awarded_cents: 60000, expected_application_version: "${ga_bv} + 2" }
              as: GrantReviewer
              captures: { berr: $.data.error_id }
          assert:
            - "error_id == ERR_GRANT_BUDGET_EXCEEDED (50000 + 60000 > 100000)"
            - "GrantApplication.${ga_b}.status == UNDER_REVIEW (unchanged)"
            - "GrantProgram.${gp2_id}.allocated_cents == 50000"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: campaign_window_overlap_same_geo
        grounds:
          - entities.DonationCampaign.fields.start_at
          - entities.DonationCampaign.fields.end_at
        distinguishing_aspect: |
          Interval semantics: half-open [start_at, end_at) overlap on the
          fundraising-calendar resource — two ACTIVE campaigns whose windows
          overlap in time and share a geo_target banner are rejected; a second
          campaign starting exactly at the first campaign's end_at (adjacent,
          gap=0) is allowed because the interval is half-open. Different
          resource (campaign calendar) and semantics than the transparency
          report period check.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Campaign C1 ACTIVE with window [2026-09-01, 2026-10-01) and a GLOBAL banner."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "C1", start_at: "2026-09-01T00:00:00Z", end_at: "2026-10-01T00:00:00Z", target_amount_cents: 100000 }
              as: FundraisingManager
              captures: { oc1: $.data.id, oc1_v: $.data.version }
            - call: "POST /wiki/campaigns/${oc1}/banners"
              payload: { message_variant: "O", geo_target: "GLOBAL", frequency_cap: 5 }
              as: FundraisingManager
            - call: "POST /wiki/campaigns/${oc1}/activate"
              payload: { expected_campaign_version: "${oc1_v}" }
              as: FundraisingManager
          trigger:
            - call: "POST /wiki/campaigns"
              payload: { name: "C2-overlap", start_at: "2026-09-15T00:00:00Z", end_at: "2026-11-01T00:00:00Z", target_amount_cents: 100000 }
              as: FundraisingManager
              captures: { oc2: $.data.id, oc2_v: $.data.version }
            - call: "POST /wiki/campaigns/${oc2}/banners"
              payload: { message_variant: "O2", geo_target: "GLOBAL", frequency_cap: 5 }
              as: FundraisingManager
            - call: "POST /wiki/campaigns/${oc2}/activate"
              payload: { expected_campaign_version: "${oc2_v}" }
              as: FundraisingManager
              captures: { oerr: $.data.error_id }
          assert:
            - "C2 activation rejected with ERR_INVALID_REQUEST or campaign-overlap error (windows overlap on GLOBAL geo)"
            - "a campaign starting exactly 2026-10-01T00:00:00Z (adjacent, gap=0) would be allowed (half-open semantics)"

      - name: transparency_report_period_overlap
        grounds:
          - entities.TransparencyReport.fields.period_start
          - entities.TransparencyReport.fields.period_end
        distinguishing_aspect: |
          Interval semantics: closed-period aggregate-capacity overlap — a new
          TransparencyReport whose [period_start, period_end] intersects an
          existing PUBLISHED report's period is rejected because a legal request
          can only appear in one published report (aggregate-capacity semantics:
          the period consumes the requests inside it), unlike the campaign
          calendar's half-open adjacency rule. Different resource entity and
          different geometric treatment.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One PUBLISHED transparency report covering [2026-01-01, 2026-06-30]; all legal requests in that period are terminal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/transparency-reports"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-06-30T23:59:59Z" }
              as: LegalCounsel
              captures: { tr1: $.data.id, tr1_v: $.data.version }
            - call: "POST /wiki/transparency-reports/${tr1}/publish"
              payload: { expected_report_version: "${tr1_v}" }
              as: LegalCounsel
          trigger:
            - call: "POST /wiki/transparency-reports"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z" }
              as: LegalCounsel
              captures: { terr: $.data.error_id }
          assert:
            - "creation of overlapping report rejected (period intersects a PUBLISHED report's period)"
            - "error reflects period-overlap / request-already-reported semantics, not generic 400"

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: campaign_raised_cents_refund_invariant
        grounds:
          - state_machines.Donation.COMPLETED_to_REFUNDED
          - entities.DonationCampaign.fields.raised_cents
        distinguishing_aspect: |
          Conserved quantity: DonationCampaign.raised_cents. Forward action
          (process donation of amount A) paired with its compensating action
          (refund the same donation) must leave raised_cents unchanged:
          raised_cents_after == raised_cents_before. Formula: raised_cents =
          sum(amount_cents of COMPLETED donations) — REFUNDED excluded.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. ACTIVE campaign, banner ACTIVE; raised_cents == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/campaigns"
              payload: { name: "Refund Drive", start_at: "2026-09-01T00:00:00Z", end_at: "2026-12-31T23:59:59Z", target_amount_cents: 100000 }
              as: FundraisingManager
              captures: { rc_id: $.data.id, rc_v: $.data.version }
            - call: "POST /wiki/campaigns/${rc_id}/banners"
              payload: { message_variant: "R", geo_target: "GLOBAL", frequency_cap: 5 }
              as: FundraisingManager
              captures: { rb_id: $.data.id }
            - call: "POST /wiki/campaigns/${rc_id}/activate"
              payload: { expected_campaign_version: "${rc_v}" }
              as: FundraisingManager
            - call: "POST /wiki/campaigns/${rc_id}/donations"
              payload: { banner_id: "${rb_id}", donor_email_hash: "rd", amount_cents: 7000, currency: "USD" }
              as: Anonymous
              captures: { rdon: $.data.id }
          trigger:
            - call: "POST /wiki/donations/${rdon}/process"
              payload: {}
              as: PaymentProcessor
            - call: "POST /wiki/donations/${rdon}/refund"
              payload: {}
              as: FundraisingManager
          assert:
            - "after process: DonationCampaign.${rc_id}.raised_cents == 7000"
            - "after refund: DonationCampaign.${rc_id}.raised_cents == 0 (invariant restored)"
            - "CampaignBanner.${rb_id}.conversion_count back to 0 after refund"

      - name: grant_allocated_cents_never_exceeds_budget_invariant
        grounds:
          - calculations.grant_budget_check
          - entities.GrantProgram.fields.allocated_cents
        distinguishing_aspect: |
          Conserved quantity: GrantProgram budget headroom. Forward action
          (approve application with awarded_cents W) paired with its
          compensating rejection-with-reallocation must satisfy
          allocated_cents <= budget_cents at all times; the approve precondition
          allocated_cents + W <= budget_cents is the invariant guard, and a
          rejected approve leaves allocated_cents bit-identical (no drift).
          Different conserved quantity (budget headroom) than raised_cents.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. OPEN program budget 80000; one application already APPROVED at 50000; a second UNDER_REVIEW scored 90."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /wiki/editors"
              payload: { username: "inv", email: "inv@x.com" }
              as: Anonymous
              captures: { ie_id: $.data.id }
            - call: "POST /wiki/grant-programs"
              payload: { name: "Invariant Fund", fiscal_year: 2026, budget_cents: 80000 }
              as: GrantAdministrator
              captures: { ip_id: $.data.id }
            - call: "POST /wiki/grant-programs/${ip_id}/applications"
              payload: { project_title: "First", requested_cents: 50000 }
              as: VolunteerEditor
              as_user_id: "${ie_id}"
              captures: { ia1: $.data.id, ia1_v: $.data.version }
            - call: "POST /wiki/grant-programs/${ip_id}/applications"
              payload: { project_title: "Second", requested_cents: 40000 }
              as: VolunteerEditor
              as_user_id: "${ie_id}"
              captures: { ia2: $.data.id, ia2_v: $.data.version }
            - call: "POST /wiki/grant-applications/${ia1}/start-review"
              payload: {}
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${ia1}/score"
              payload: { impact_score: 90, feasibility_score: 90, budget_reasonableness_score: 90, community_support_score: 90 }
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${ia1}/approve"
              payload: { awarded_cents: 50000, expected_application_version: "${ia1_v} + 2" }
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${ia2}/start-review"
              payload: {}
              as: GrantReviewer
            - call: "POST /wiki/grant-applications/${ia2}/score"
              payload: { impact_score: 90, feasibility_score: 90, budget_reasonableness_score: 90, community_support_score: 90 }
              as: GrantReviewer
          trigger:
            - call: "POST /wiki/grant-applications/${ia2}/approve"
              payload: { awarded_cents: 40000, expected_application_version: "${ia2_v} + 2" }
              as: GrantReviewer
              captures: { ierr: $.data.error_id }
          assert:
            - "error_id == ERR_GRANT_BUDGET_EXCEEDED (50000 + 40000 > 80000)"
            - "GrantProgram.${ip_id}.allocated_cents == 50000 (no drift from failed approve)"
            - "invariant allocated_cents <= budget_cents holds before and after"
