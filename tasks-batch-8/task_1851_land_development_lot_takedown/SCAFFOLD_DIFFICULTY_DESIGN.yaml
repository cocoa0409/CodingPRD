  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: draw_create_referential_vs_fiscal
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_LOAN_NOT_ACTIVE]
          - errors[ERR_DRAW_EXCEEDS_COMMITMENT]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_fiscal: the draw targets
          a DRAFT loan (ERR_LOAN_NOT_ACTIVE, priority 10) AND its gross exceeds the
          commitment (ERR_DRAW_EXCEEDS_COMMITMENT, priority 11) — the referential error
          must win because it is checked first.
        test_recipe:
          setup:
            - "Parcel P ACQUIRED; loan LN in DRAFT (never activated) with commitment_amount_cents 500000"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "P9", county: "Travis", earnest_money_cents: 500000 }
              as: DeveloperOperator
              captures: { p9: $.data.id }
