  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: publish_script_with_stale_route_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[script-publish-stale-route]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After script ${s1} publishes (route version advances 1 -> 2), publishing script ${s2} with the stale observed version 1 is rejected 412 ERR_STALE_VERSION; ${s1} remains PUBLISHED and ${s2} remains APPROVED."
        test_recipe:
          setup: ["route ${route1} with PUBLISHED script ${s1} (route version now 2) and APPROVED script ${s2}; client holds stale route version ${route1_v} == 1"]
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id, route1_v: $.data.version } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script one", curriculum_standards: [] }, as: Curator, captures: { s1: $.data.id } }
            - { call: "POST /script-versions/${s1}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s1}/review", payload: { decision: "APPROVE", accuracy_score: 88 }, as: Curator }
            - { call: "POST /script-versions/${s1}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin, captures: { s1_st: $.data.status } }
            - { call: "POST /tour-routes/${route1}/script-versions", payload: { content_text: "Script two", curriculum_standards: [] }, as: Curator, captures: { s2: $.data.id, s2_vno: $.data.version_no } }
            - { call: "POST /script-versions/${s2}/submit", payload: {}, as: Curator }
            - { call: "POST /script-versions/${s2}/review", payload: { decision: "APPROVE", accuracy_score: 91 }, as: Curator }
          trigger:
            - { call: "POST /script-versions/${s2}/publish", payload: { expected_route_version: "${route1_v}" }, as: MuseumAdmin }
            - { call: "GET /script-versions/${s1}", payload: {}, as: Curator, captures: { s1_post: $.data.status } }
            - { call: "GET /script-versions/${s2}", payload: {}, as: Curator, captures: { s2_post: $.data.status } }
          assert:
            - "first publish succeeded with matching version (s1_st == PUBLISHED) and s2_vno == 2 (per-route monotonic)"
            - "stale publish: http_status == 412 and error_id == ERR_STALE_VERSION"
            - "ScriptVersion.${s1}.status still == PUBLISHED and ScriptVersion.${s2}.status still == APPROVED (no supersede on failure)"

      - name: reschedule_slot_with_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[slot-reschedule-stale-slot]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A successful reschedule advances TourSlot.version 1 -> 2; replaying the same observed version 1 is rejected 412 ERR_STALE_VERSION and start_at is unchanged."
        test_recipe:
          setup: ["SCHEDULED slot ${slot1} at 2026-09-01T10:00:00Z, observed version ${slot_v} == 1"]
          setup_api_calls:
            - { call: "POST /rooms", payload: { name: "Parlor", floor: 1, capacity_max: 20, safety_max_party: 12, collection_tier: "STANDARD" }, as: MuseumAdmin, captures: { r1: $.data.id } }
            - { call: "POST /tour-routes", payload: { name: "Main Floor", kind: "STANDARD", room_ids: ["${r1}"], duration_minutes: 60, base_price_cents: 1000 }, as: MuseumAdmin, captures: { route1: $.data.id } }
            - { call: "POST /tour-routes/${route1}/activate", payload: {}, as: MuseumAdmin }
            - { call: "POST /tour-slots", payload: { route_id: "${route1}", start_at: "2026-09-01T10:00:00Z" }, as: MuseumAdmin, captures: { slot1: $.data.id, slot_v: $.data.version } }
          trigger:
            - { call: "POST /tour-slots/${slot1}/reschedule", payload: { start_at: "2026-09-05T10:00:00Z", expected_slot_version: "${slot_v}" }, as: MuseumAdmin, captures: { st1: $.data.start_at, v1: $.data.version } }
            - { call: "POST /tour-slots/${slot1}/reschedule", payload: { start_at: "2026-09-06T10:00:00Z", expected_slot_version: "${slot_v}" }, as: MuseumAdmin }
          assert:
            - "first reschedule succeeds: start_at == 2026-09-05T10:00:00Z and version == 2"
            - "second reschedule with stale version: http_status == 412 and error_id == ERR_STALE_VERSION; start_at remains 2026-09-05T10:00:00Z"

      - name: cascade_incident_room_closure_covered
        claim_type: cascade_chain
        grounds: [state_machines.Room.OPEN_to_CLOSED_RESTORATION]
        excluded_because:
          difficulty_instance: "transitive_cascade / critical_incident_cascade"
          rationale: "The incident -> room -> slot -> booking/shift cascade is asserted hop-by-hop with literal refund values in the named §1.8 instance."

      - name: certification_threshold_boundary_covered
        claim_type: threshold_boundary
        grounds: [state_machines.Docent.TRAINEE_to_CERTIFIED]
        excluded_because:
          difficulty_instance: "boundary_precision_check / quiz_threshold_boundary"
          rationale: "The quiz 84/85 certification boundary is asserted in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_covered
        claim_type: immediate_visibility
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: "compensating_invariant / seat_bucket_conservation"
          rationale: "That instance reads the slot immediately after booking create and after cancel and asserts the recomputed seat buckets in the same flow — immediate consistency is exactly what is verified."
