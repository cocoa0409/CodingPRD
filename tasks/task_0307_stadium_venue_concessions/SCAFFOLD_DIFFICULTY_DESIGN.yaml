  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: event_window_closed_interval_boundary_touch_rejected
        grounds:
          - validations[priority=13]
          - errors[ERR_EVENT_WINDOW_OVERLAP]
          - entities.Event.fields.doors_time
          - entities.Event.fields.end_time
        distinguishing_aspect: |
          Resource = Venue operating window; CLOSED-interval semantics. A second
          event whose doors_time equals the first event's end_time
          (2026-06-14T22:00:00Z) is rejected as overlapping — the shared boundary
          instant counts. (Contrast with the half-open shift rule below.)
        test_recipe:
          setup:
            - "Venue with one non-SETTLED event occupying [2026-06-14T18:00:00Z, 2026-06-14T22:00:00Z]."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "OvlVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vov_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vov_id}", name: "EvtA", doors_time: "2026-06-14T18:00:00.000Z", end_time: "2026-06-14T22:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evov_a_id: $.data.id }
          trigger:
            - call: "POST /concessions/events"
              payload: { venue_id: "${vov_id}", name: "EvtB", doors_time: "2026-06-14T22:00:00.000Z", end_time: "2026-06-15T02:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_EVENT_WINDOW_OVERLAP"
            - "response.status == 409"

      - name: staff_shift_half_open_interval_boundary_touch_allowed
        grounds:
          - validations[priority=14]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.StaffShift.fields.shift_start
          - entities.StaffShift.fields.shift_end
        distinguishing_aspect: |
          Resource = worker schedule (different resource entity from Event);
          HALF-OPEN [start,end) semantics. A back-to-back shift whose shift_start
          equals the prior shift's shift_end (2026-06-14T22:00:00Z) is ALLOWED
          (returns 201), the opposite boundary treatment from the closed-interval
          event rule.
        test_recipe:
          setup:
            - "A stand with one scheduled shift for worker 'Mia' over [18:00, 22:00]."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "ShVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vsh_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vsh_id}", name: "EvtSh", doors_time: "2026-06-14T17:00:00.000Z", end_time: "2026-06-15T03:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evsh_id: $.data.id }
            - call: "POST /concessions/stands"
              payload: { event_id: "${evsh_id}", name: "StandSh", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { stsh_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stsh_id}", worker_name: "Mia", shift_start: "2026-06-14T18:00:00.000Z", shift_end: "2026-06-14T22:00:00.000Z" }
              as: ConcessionsManager
              captures: { shsh_a_id: $.data.id }
          trigger:
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stsh_id}", worker_name: "Mia", shift_start: "2026-06-14T22:00:00.000Z", shift_end: "2026-06-15T02:00:00.000Z" }
              as: ConcessionsManager
              captures: { shsh_b_id: $.data.id, shsh_b_status: $.data.status }
          assert:
            - "response.status == 201"
            - "StaffShift.${shsh_b_id}.status == SCHEDULED"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: transfer_cancel_restores_total_on_hand_units
        grounds:
          - state_machines.Transfer.DRAFT_to_IN_TRANSIT
          - state_machines.Transfer.IN_TRANSIT_to_CANCELLED
          - entities.InventoryLot.fields.remaining_qty
          - concurrency_rules[transfer-dispatch-stale-stand]
        distinguishing_aspect: |
          Conserved quantity = total on-hand UNITS of the product across both
          stands. Source starts with 100 units; dispatch debits 30 (source 70),
          cancel re-credits 30 — total on-hand of the product summed over
          from_stand+to_stand returns to exactly 100, no unit drift.
        test_recipe:
          setup:
            - "One event with two stands (A and B); product 'Bun' has a single lot of 100 units @ 30c at stand A, none at stand B; a DRAFT transfer of 30 buns A→B."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "TxVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 0 }
              as: ConcessionsManager
              captures: { vtx_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vtx_id}", sku: "BUN", name: "Bun", base_price_cents: 0, unit_cost_cents: 30, perishable: false }
              as: ConcessionsManager
              captures: { btx_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vtx_id}", name: "EvtTx", doors_time: "2026-06-16T18:00:00.000Z", end_time: "2026-06-16T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evtx_id: $.data.id }
            - call: "POST /concessions/events/${evtx_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evtx_id}", name: "StandA", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { sta_id: $.data.id }
            - call: "POST /concessions/stands"
              payload: { event_id: "${evtx_id}", name: "StandB", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { stb_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${sta_id}", product_id: "${btx_id}", received_qty: 100, unit_cost_cents: 30, par_level: 200, reorder_point: 20 }
              as: StockRunner
            - call: "POST /concessions/transfers"
              payload: { from_stand_id: "${sta_id}", to_stand_id: "${stb_id}", product_id: "${btx_id}", qty: 30 }
              as: StockRunner
              captures: { tx_id: $.data.id }
            - call: "GET /concessions/stands/${sta_id}"
              payload: {}
              as: StockRunner
              captures: { sta_v: $.data.version }
            - call: "POST /concessions/transfers/${tx_id}/dispatch"
              payload: { expected_from_stand_version: "${sta_v}" }
              as: StockRunner
          trigger:
            - call: "POST /concessions/transfers/${tx_id}/cancel"
              payload: {}
              as: StockRunner
              captures: { tx_status: $.data.status }
          assert:
            - "Transfer.${tx_id}.status == CANCELLED"
            - "sum of remaining_qty over ACTIVE InventoryLots of product ${btx_id} at stand ${sta_id} == 100"
            - "sum of remaining_qty over ACTIVE InventoryLots of product ${btx_id} at stand ${stb_id} == 0"

      - name: order_cancel_refund_conserves_money_to_wallet
        grounds:
          - state_machines.Order.fulfillment_PLACED_to_CANCELLED
          - entities.Order.fields.payment_status
          - entities.Order.fields.total_cents
          - entities.Patron.fields.wallet_credit_cents
        distinguishing_aspect: |
          Conserved quantity = MONEY (cents), a different conserved type from
          inventory units. A PAID order of total 220 cancelled refunds exactly
          220 to the patron wallet (payment_status→REFUNDED), so charged minus
          refunded nets to 0 — no money drift.
        test_recipe:
          setup:
            - "Event/stand opened with staff, water (price 100) stocked, an order of qty 2 placed and PAID (total_cents=220 with service_fee_pct=10), patron wallet_credit_cents=0."
          setup_api_calls:
            - call: "POST /concessions/venues"
              payload: { name: "MoVenue", venue_share_pct: 10, share_basis: "GROSS", spoilage_valuation: "FIFO", service_fee_pct: 10 }
              as: ConcessionsManager
              captures: { vmo_id: $.data.id }
            - call: "POST /concessions/products"
              payload: { venue_id: "${vmo_id}", sku: "WATER", name: "Water", base_price_cents: 100, unit_cost_cents: 10, perishable: false }
              as: ConcessionsManager
              captures: { wmo_id: $.data.id }
            - call: "POST /concessions/events"
              payload: { venue_id: "${vmo_id}", name: "EvtMo", doors_time: "2026-06-17T18:00:00.000Z", end_time: "2026-06-17T23:00:00.000Z", event_multiplier_pct: 100 }
              as: ConcessionsManager
              captures: { evmo_id: $.data.id }
            - call: "POST /concessions/events/${evmo_id}/open-doors"
              payload: {}
              as: ConcessionsManager
            - call: "POST /concessions/stands"
              payload: { event_id: "${evmo_id}", name: "StandMo", demand_tier: "MID", expected_orders_per_hour: 40 }
              as: ConcessionsManager
              captures: { stmo_id: $.data.id }
            - call: "POST /concessions/staff-shifts"
              payload: { stand_id: "${stmo_id}", worker_name: "Ned", shift_start: "2026-06-17T18:00:00.000Z", shift_end: "2026-06-17T23:00:00.000Z" }
              as: ConcessionsManager
              captures: { shmo_id: $.data.id }
            - call: "POST /concessions/staff-shifts/${shmo_id}/check-in"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/stands/${stmo_id}/open"
              payload: {}
              as: StandOperator
            - call: "POST /concessions/menu-items"
              payload: { stand_id: "${stmo_id}", product_id: "${wmo_id}", available: true }
              as: ConcessionsManager
              captures: { mimo_id: $.data.id }
            - call: "POST /concessions/inventory-lots"
              payload: { stand_id: "${stmo_id}", product_id: "${wmo_id}", received_qty: 50, unit_cost_cents: 10, par_level: 50, reorder_point: 10 }
              as: StockRunner
            - call: "POST /concessions/patrons"
              payload: { display_name: "PatMo" }
              as: Patron
              captures: { patmo_id: $.data.id }
            - call: "POST /concessions/orders"
              payload: { event_id: "${evmo_id}", stand_id: "${stmo_id}", patron_id: "${patmo_id}" }
              as: Patron
              as_user_id: "${patmo_id}"
              captures: { ormo_id: $.data.id }
            - call: "POST /concessions/orders/${ormo_id}/lines"
              payload: { menu_item_id: "${mimo_id}", qty: 2 }
              as: Patron
              as_user_id: "${patmo_id}"
            - call: "POST /concessions/orders/${ormo_id}/place"
              payload: {}
              as: Patron
              as_user_id: "${patmo_id}"
            - call: "POST /concessions/orders/${ormo_id}/pay"
              payload: {}
              as: Patron
              as_user_id: "${patmo_id}"
          trigger:
            - call: "POST /concessions/orders/${ormo_id}/cancel"
              payload: {}
              as: Patron
              as_user_id: "${patmo_id}"
              captures: { ormo_pay: $.data.payment_status }
          assert:
            - "Order.${ormo_id}.payment_status == REFUNDED"
            - "Order.${ormo_id}.fulfillment_status == CANCELLED"
            - "Patron.${patmo_id}.wallet_credit_cents == 220"
