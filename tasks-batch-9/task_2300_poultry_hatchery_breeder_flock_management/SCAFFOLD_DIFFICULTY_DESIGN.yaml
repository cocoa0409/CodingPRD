        grounds:
          - state_machines.EggLot.IN_STORAGE_to_SANITATION_HOLD
          - state_machines.EggLot.SANITATION_HOLD_to_IN_STORAGE
          - entities.EggLot.fields.sanitation_cycle_count
          - calculations.egg_lot_effective_age_days
        distinguishing_aspect: |
          EggLot re-enters SANITATION_HOLD after returning to IN_STORAGE, and the loop is not free:
          sanitation_cycle_count reaches 2 and effective_age_days rises from 4.50 to 6.00 because
          each completed cycle permanently adds SANITATION_AGE_PENALTY_DAYS 0.75.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z, flock F1 IN_LAY."
