            - "PartnerAgreement.${agreement_id}.round_count == 4"
            - "PartnerAgreement.${agreement_id}.status == MERCHANT_COUNTERED"
            - "PartnerAgreement.${agreement_id}.commission_rate_bps == 1000 and PartnerAgreement.${agreement_id}.employer_revenue_share_bps == 1500, i.e. the refused round left the standing terms at round 4"
            - "GET /perks/agreements/${agreement_id}/negotiation-rounds returns total_count 4 with round_number 1,2,3,4 and proposer_role PROVIDER, MERCHANT, PROVIDER, MERCHANT"
            - "Merchant.${merchant_id}.status == IN_NEGOTIATION"

