            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: OSTOMY, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog: $.data.id } }
            - { call: "POST /api/resupply-programs/${prog}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt}", captures: { ord1: $.data.id } }
            - { call: "POST /api/shipments", payload: { order_id: "${ord1}" }, as: FulfillmentAgent, captures: { shp1: $.data.id } }
            - { call: "POST /api/shipments/${shp1}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp1}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shipments/${shp1}/deliver", payload: {}, as: FulfillmentAgent }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/resupply-programs/${prog}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/resupply-programs/${prog}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt}", captures: { ord2: $.data.id, oful: $.data.fulfillment_status } }
          assert:
            - "at 2026-06-01 (one day before next_eligible_date): error_id == ERR_RESUPPLY_WINDOW_NOT_OPEN"
            - "at 2026-06-02 (exactly next_eligible_date): confirm succeeds with a new SupplyOrder (>= boundary is inclusive)"
            - "SupplyOrder.${ord2}.fulfillment_status == SUBMITTED and origin == PROGRAM_CYCLE"

      - name: hsa_debit_exact_balance_boundary
        grounds:
          - calculations.hsa_balance
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: cents (money), not days. A DEBIT exactly equal to the balance
          succeeds (<= boundary) and leaves 0.00; a further 0.01 debit fails
          with ERR_INSUFFICIENT_HSA. Endpoint: POST /api/hsa-accounts/{id}/debits.
        test_recipe:
          setup:
            - "ACTIVE patient with HSA balance exactly 200000 cents"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Self-Pay HSA", plan_type: CASH_HSA, coinsurance_pct: 1.00, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln_cash: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat HSA", date_of_birth: "1977-01-25", payer_plan_id: "${pln_cash}", hsa_initial_credit_cents: 200000 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "GET /api/patients/${pt}/hsa-accounts", payload: {}, as: BillingSpecialist, captures: { hsa: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/hsa-accounts/${hsa}/debits", payload: { amount_cents: 200000, reason: "full balance debit" }, as: BillingSpecialist, captures: { ent: $.data.id } }
            - { call: "GET /api/hsa-accounts/${hsa}", payload: {}, as: BillingSpecialist, captures: { bal: $.data.balance_cents } }
            - { call: "POST /api/hsa-accounts/${hsa}/debits", payload: { amount_cents: 1, reason: "overdraw attempt" }, as: BillingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "DEBIT of exactly balance (200000) succeeds and HSALedgerEntry.${ent} is POSTED"
            - "HSAAccount.${hsa}.balance_cents == 0 after the exact-balance debit"
            - "subsequent 1-cent debit -> error_id == ERR_INSUFFICIENT_HSA"

  # =================================================================
  # Rule 7 - cross_entity_state_dependency (different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_requires_current_valid_prescription
        grounds:
          - state_machines.SupplyOrder.DRAFT_to_SUBMITTED
          - state_machines.Prescription.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Pair SupplyOrder -> Prescription: the order's DRAFT -> SUBMITTED
          transition depends on the linked Prescription's state; once the
          logical clock passes expiration_date the Rx auto-transitions to
          EXPIRED and submit fails with ERR_NO_VALID_PRESCRIPTION even though
          nothing on the order itself changed. Sibling pair: Shipment ->
          PriorAuthorization.
        test_recipe:
          setup:
            - "MCR plan; ITM_OST covers it; ACTIVE patient with Rx A4419 window [2026-05-01, 2026-06-01) and fit 45MM"
            - "DRAFT order with one line created while clock is 2026-05-15 (Rx valid then)"
            - "Clock advanced to 2026-06-15: Rx is now EXPIRED (lazy)"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln_mcr}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm_ost: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat XE1", date_of_birth: "1968-05-17", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-06-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm_ost}", size_code: "45MM", quantity: 5, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/orders/${ord}/submit", payload: {}, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_VALID_PRESCRIPTION (the covering Rx auto-expired on 2026-06-01)"
            - "SupplyOrder.${ord}.fulfillment_status == DRAFT (unchanged)"

      - name: shipment_release_requires_approved_prior_auth
        grounds:
          - state_machines.Shipment.CREATED_to_READY
          - state_machines.PriorAuthorization.SUBMITTED_to_DENIED
        distinguishing_aspect: |
          Pair Shipment -> PriorAuthorization (different pair from the
          sibling's SupplyOrder -> Prescription): CREATED -> READY is gated on
          an APPROVED PA for (patient, hcpcs); a DENIED PA yields
          ERR_PRIOR_AUTH_REQUIRED at release.
        test_recipe:
          setup:
            - "MCR plan; ITM_WND requires_pa true, covers MCR, stock 100; ACTIVE patient with Rx A6250 monthly 20 and WOUND fit 4X4"
            - "Order with one line qty 5 SUBMITTED; shipment CREATED (fully reserved)"
            - "PA for (patient, A6250) exists but was DENIED"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A6250", name: "Wound dressing", category: WOUND, covered_plan_ids: ["${pln_mcr}"], pack_fee_cents: 999, pack_size: 8, retail_price_cents: 650, max_units_per_cycle: 30, requires_pa: true, size_codes: ["4X4"] }, as: PlatformAdmin, captures: { itm_wnd: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm_wnd}", on_hand_qty: 100 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat XE2", date_of_birth: "1964-02-28", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A6250", prescriber_npi: "1234567890", diagnosis_codes: ["L89.1"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: WOUND, size_code: "4X4", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/prior-authorizations", payload: { patient_id: "${pt}", hcpcs_code: "A6250", approved_units: 45, valid_from: "2026-05-01", valid_to: "2026-08-31" }, as: PriorAuthSpecialist, captures: { pa: $.data.id } }
            - { call: "POST /api/prior-authorizations/${pa}/decision", payload: { outcome: DENIED }, as: PriorAuthSpecialist }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm_wnd}", size_code: "4X4", quantity: 5, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${ord}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ord}" }, as: FulfillmentAgent, captures: { shp: $.data.id } }
          trigger:
            - { call: "POST /api/shipments/${shp}/release", payload: {}, as: FulfillmentAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PRIOR_AUTH_REQUIRED (PA exists but is DENIED, not APPROVED)"
            - "Shipment.${shp}.status == CREATED (unchanged)"

  # =================================================================
  # Rule 8 - resource_temporal_overlap (different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: prescription_half_open_window_overlap
        grounds:
          - validations[priority=6]
          - entities.Prescription.fields.expiration_date
        distinguishing_aspect: |
          Resource: Prescription. Semantics: HALF-OPEN [effective_date,
          expiration_date) - adjacency is allowed, so a new Rx starting exactly
          at the existing Rx's expiration_date (2026-08-01) succeeds, while one
          starting 2026-07-15 fails with ERR_PRESCRIPTION_WINDOW_OVERLAP. The
          sibling rule uses closed intervals where adjacency IS an overlap.
        test_recipe:
          setup:
            - "MCR plan; ACTIVE patient with ACTIVE Rx A4419 [2026-05-01, 2026-08-01)"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat OV1", date_of_birth: "1956-09-09", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-08-01" }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-08-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator, captures: { rx2: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-07-15", expiration_date: "2026-10-01" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "adjacent Rx [2026-08-01, 2026-11-01) succeeds (half-open: start == existing expiration is NOT an overlap); Prescription.${rx2}.status == ACTIVE"
            - "overlapping Rx [2026-07-15, 2026-10-01) -> error_id == ERR_PRESCRIPTION_WINDOW_OVERLAP"

      - name: prior_auth_closed_window_overlap
        grounds:
          - validations[priority=6]
          - entities.PriorAuthorization.fields.valid_to
        distinguishing_aspect: |
          Resource: PriorAuthorization (different resource from the sibling's
          Prescription). Semantics: CLOSED [valid_from, valid_to] - adjacency
          IS an overlap, so a new PA with valid_from == existing valid_to
          (2026-05-31) is rejected with ERR_AUTH_WINDOW_OVERLAP, while
          valid_from 2026-06-01 succeeds. The identical date geometry that
          passes for a half-open Rx fails for a closed PA window.
        test_recipe:
          setup:
            - "MCR plan; ACTIVE patient; PA for (patient, A6250) SUBMITTED with closed window [2026-05-01, 2026-05-31]"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat OV2", date_of_birth: "1961-12-12", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/prior-authorizations", payload: { patient_id: "${pt}", hcpcs_code: "A6250", approved_units: 45, valid_from: "2026-05-01", valid_to: "2026-05-31" }, as: PriorAuthSpecialist }
          trigger:
            - { call: "POST /api/prior-authorizations", payload: { patient_id: "${pt}", hcpcs_code: "A6250", approved_units: 45, valid_from: "2026-05-31", valid_to: "2026-08-31" }, as: PriorAuthSpecialist, captures: { err: $.data.error_id } }
            - { call: "POST /api/prior-authorizations", payload: { patient_id: "${pt}", hcpcs_code: "A6250", approved_units: 45, valid_from: "2026-06-01", valid_to: "2026-08-31" }, as: PriorAuthSpecialist, captures: { pa2: $.data.id } }
          assert:
            - "PA with valid_from == existing valid_to (2026-05-31) -> error_id == ERR_AUTH_WINDOW_OVERLAP (closed interval: adjacency counts)"
            - "PA with valid_from 2026-06-01 (one day after) succeeds; PriorAuthorization.${pa2}.status == SUBMITTED"

  # =================================================================
  # Rule 9 - compensating_invariant (different conserved quantities)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: hsa_debit_reversal_conservation
        grounds:
          - calculations.hsa_balance
          - entities.HSAAccount.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: money (cents). Invariant: balance_cents ==
          initial_credit_cents + sum(CREDIT, REVERSAL) - sum(DEBIT) over POSTED
          entries; a DEBIT of 500 paired with its REVERSAL of 500 leaves
          balance exactly at the pre-action 2000. The sibling conserves stock
          units, a different quantity type.
        test_recipe:
          setup:
            - "ACTIVE patient with HSA balance 2000 (cents)"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Self-Pay HSA", plan_type: CASH_HSA, coinsurance_pct: 1.00, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln_cash: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat INV", date_of_birth: "1979-04-04", payer_plan_id: "${pln_cash}", hsa_initial_credit_cents: 2000 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "GET /api/patients/${pt}/hsa-accounts", payload: {}, as: BillingSpecialist, captures: { hsa: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/hsa-accounts/${hsa}/debits", payload: { amount_cents: 500, reason: "copay" }, as: BillingSpecialist, captures: { deb: $.data.id } }
            - { call: "POST /api/hsa-accounts/${hsa}/credits", payload: { amount_cents: 500, reason: "reversal", reverses_entry_id: "${deb}" }, as: BillingSpecialist }
            - { call: "GET /api/hsa-accounts/${hsa}", payload: {}, as: BillingSpecialist, captures: { bal: $.data.balance_cents } }
          assert:
            - "HSAAccount.${hsa}.balance_cents == 2000 after debit+reversal pair (invariant: initial + credits + reversals - debits)"
            - "HSALedgerEntry count for the account == 2 (append-only; the debit is NOT deleted)"

      - name: stock_reserve_release_conservation
        grounds:
          - calculations.backorder_allocation
          - state_machines.SupplyOrder.IN_FULFILLMENT_to_CANCELLED
          - entities.StockLevel.fields.available_qty
        distinguishing_aspect: |
          Conserved quantity: stock units (not money). Invariant:
          available_qty == on_hand_qty - reserved_qty at all times; a shipment
          reservation of 30 followed by order cancellation restores
          available_qty exactly to the pre-action 100 with reserved_qty == 0.
        test_recipe:
          setup:
            - "MCR plan; ITM_OST covers it, stock on_hand 100; ACTIVE patient with Rx A4419, fit 45MM"
            - "Order qty 30 SUBMITTED; shipment created (reserved 30, available 70)"
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln_mcr: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln_mcr}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm_ost: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm_ost}", on_hand_qty: 100 }, as: PlatformAdmin, captures: { stk: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat STK", date_of_birth: "1973-06-21", payer_plan_id: "${pln_mcr}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm_ost}", size_code: "45MM", quantity: 30, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${ord}/submit", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/shipments", payload: { order_id: "${ord}" }, as: FulfillmentAgent, captures: { shp: $.data.id } }
            - { call: "GET /api/stock-levels/${stk}", payload: {}, as: PlatformAdmin, captures: { avail_mid: $.data.available_qty, res_mid: $.data.reserved_qty } }
          trigger:
            - { call: "POST /api/orders/${ord}/cancel", payload: {}, as: Patient, as_user_id: "${pt}" }
            - { call: "GET /api/stock-levels/${stk}", payload: {}, as: PlatformAdmin, captures: { avail_end: $.data.available_qty, res_end: $.data.reserved_qty } }
          assert:
            - "after shipment creation: available_qty == 70 and reserved_qty == 30 (100 - 30)"
            - "after order cancel: available_qty == 100 and reserved_qty == 0 (reserve+release conserve units)"
            - "Shipment.${shp}.status == CANCELLED (cascade from order cancel)"
