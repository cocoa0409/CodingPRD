              payload: { submitted_cdm_number: "CDM-9999", encounter_id: "ENC-5", payer_code: "BCBS_STATE", service_datetime: "2026-06-06T08:00:00Z", quantity: 2, posted_charge_cents: 77000 }
              as: DepartmentManager
              as_user_id: "u_dm_lab"
              captures: { l5_id: $.data.id }
          trigger:
            - call: "POST /chargemaster/charge-capture-batches/${batch_id}/reconcile"
              payload: {}
              as: RevenueIntegrityAnalyst
              captures: { batch_v: $.data.version }
          assert:
            - "ChargeCaptureBatch.${batch_id}.status == RECONCILING and ChargeCaptureBatch.${batch_id}.reconcile_pass_count == 1"
            - "CapturedCharge.${l1_id}.expected_charge_cents == 128000 and CapturedCharge.${l1_id}.line_variance_bp == 195 and CapturedCharge.${l1_id}.match_status == PRICE_VARIANCE"
            - "CapturedCharge.${l2_id}.expected_charge_cents == 128000 and CapturedCharge.${l2_id}.line_variance_bp == -234 and CapturedCharge.${l2_id}.match_status == PRICE_VARIANCE"
            - "CapturedCharge.${l3_id}.expected_charge_cents == 6400000 and CapturedCharge.${l3_id}.line_variance_bp == 0 and CapturedCharge.${l3_id}.match_status == MATCHED"
            - "CapturedCharge.${l4_id}.expected_charge_cents == 256000 and CapturedCharge.${l4_id}.line_variance_bp == 5 and CapturedCharge.${l4_id}.match_status == MATCHED"
            - "CapturedCharge.${l5_id}.charge_item_id is null and CapturedCharge.${l5_id}.expected_charge_cents is null and CapturedCharge.${l5_id}.line_variance_bp is null and CapturedCharge.${l5_id}.match_status == UNKNOWN_CODE"
            - "ChargeCaptureBatch.${batch_id}.mean_line_variance_bp == -9"
            - "ChargeCaptureBatch.${batch_id}.mean_line_variance_bp != -1 (the aggregate-then-round alternative)"
            - "ChargeCaptureBatch.${batch_id}.total_expected_charge_cents == 6912000"
            - "ChargeCaptureBatch.${batch_id}.total_posted_charge_cents == 6988628"
            - "ChargeCaptureBatch.${batch_id}.line_count == 5 and ChargeCaptureBatch.${batch_id}.matched_line_count == 2 and ChargeCaptureBatch.${batch_id}.exception_line_count == 3"
            - "ChargeCaptureBatch.${batch_id}.open_finding_count == 0 (CDM-3000 has no companion_required_item_id)"

      - name: combinatorial_formula__mode_c_exclusive_snapshot_evaluation_order_on_markup_ratio
        grounds:
          - calculations.markup_compliance_ratio
          - calculations.markup_compliance_ratio.variants.exclusive_snapshot
          - calculations.gross_charge_from_price_rule
          - entities.Facility.fields.aggregate_markup_limit_bp
          - entities.Facility.fields.aggregate_markup_ratio_bp
          - entities.ChangeRequest.fields.projected_markup_ratio_bp
          - entities.ChangeRequest.fields.pinned_charge_item_version
          - validations[priority=54]
          - errors.ERR_AGGREGATE_MARKUP_LIMIT
          - state_machines.ChangeRequest.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          This is mode (c) — the circular-looking dependency (the facility ratio depends
          on the item's gross charge while the item's admissibility depends on the
          facility ratio) resolved by a pinned evaluation order: with
          aggregate_markup_limit_bp = 11000 the exclusive-snapshot order yields
          projected_markup_ratio_bp == 10947 and the APPROVE succeeds, whereas the naive
          add-proposal-onto-the-live-aggregate order would yield 11724 and wrongly raise
          ERR_AGGREGATE_MARKUP_LIMIT.
        test_recipe:
          setup:
            - "Logical clock left at the fixed startup default 2026-08-01T00:00:00Z."
            - "Facility MKP with rounding_mode = NEAREST_CENT and aggregate_markup_limit_bp = 11000."
            - "Department SUPPLY_CHAIN (manager_user_id = u_dm_sc)."
            - "RevenueCode 0250 (SUPPLY) with an ACTIVE FLAT_FEE PriceRule flat_fee_cents = 1000000; RevenueCode 0300 (PROCEDURE) with an ACTIVE COST_PLUS_MARKUP PriceRule using the default tiers. Both rules min_medicare_multiple_bp = 12000, market_cap_multiple_bp = 11000."
            - "Diluting item A (CDM-4001 on 0250): cost_basis_cents = 1000000, medicare_rate_cents = 100, market_p75_cents = 10000000 -> gross_charge_cents = 1000000 (ratio 10000 bp); driven to ACTIVE."
            - "Target item B (CDM-4002 on 0300): cost_basis_cents = 40000, medicare_rate_cents = 10000, market_p75_cents = 900000 -> gross_charge_cents = 128000 (ratio 32000 bp standalone); driven to ACTIVE. Facility aggregate_markup_ratio_bp is then 10846."
            - "A PRICE_CHANGE ChangeRequest on B with proposed_cost_basis_cents = 45000 (projected_gross_charge_cents = 144000), moved SUBMITTED -> UNDER_REVIEW by analyst u_ria_1; submitter u_dm_sc, approver u_pca_1 — three distinct actors."
