  - rule_id: priority_pair_validation_conflict
    instances:

      - name: fund_docs_state_beats_funding_line_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=28]
          - errors[ERR_DOCS_NOT_VERIFIED]
          - errors[ERR_DEALER_FUNDING_LINE_EXCEEDED]
          - entities.Dealer.fields.funding_line_cents
        distinguishing_aspect: |
          Category pair state (priority 8) versus business_fiscal (priority 28): a single
          funding request violates both - the document package is incomplete AND the
          amount would blow the dealer's 1000000-cent funding line - and the state error
          ERR_DOCS_NOT_VERIFIED must win; completing the document package then surfaces
          ERR_DEALER_FUNDING_LINE_EXCEEDED, proving the fiscal rule was violated all along.
        test_recipe:
          setup:
            - "Dealer ACTIVE at clock 2026-08-01 with funding_line_cents 1000000 (deliberately small)."
            - "Contract booked for amount_financed_cents 2801000 with both documents uploaded but only RETAIL_INSTALLMENT_CONTRACT verified, so funding_status is PENDING_DOCS."
          setup_api_calls:
            - call: "POST /lending/_clock/set_current_utc"
