            - { call: "POST /api/offers", payload: { nominee_id: "${n1}", cohort_id: "${coh}" }, as: SelectionOfficer, captures: { o1: $.data.id } }
            - { call: "POST /api/offers", payload: { nominee_id: "${n2}", cohort_id: "${coh}" }, as: SelectionOfficer }
            - { call: "POST /api/offers", payload: { nominee_id: "${n3}", cohort_id: "${coh}" }, as: SelectionOfficer }
            - { call: "POST /api/offers/${o1}/accept", payload: {}, as: Nominee, as_user_id: "${n1}" }
          trigger:
            - { call: "GET /api/cohorts/${coh}", as: ProgramAdmin, captures: { pf_prov: $.data.projected_fill_provisional, pf_fin: $.data.projected_fill_final, committed: $.data.seats_committed, outstanding: $.data.offers_outstanding, cstat: $.data.status } }
          assert:
            - "cohort.projected_fill_provisional == 3 (captured ${pf_prov}: 1 committed + round_half_up(2*7500/10000)=2)"
            - "cohort.projected_fill_final == 1 (captured ${pf_fin}: committed only)"
            - "cohort.seats_committed == 1 AND cohort.offers_outstanding == 2 AND cohort.status == FORMING"
            - "The two variants disagree (3 != 1) on identical ledger state"

      - name: partner_outcomes_census_vs_rolling_divergence
        grounds:
          - calculations.partner_outcome_rates
          - calculations.partner_standing_derivation
          - entities.Scholar.fields.ever_matriculated
        distinguishing_aspect: |
          PartnerCollege-domain dual variant (different entity domain from the
          Cohort fill projection): cohort C1 COMPLETED with scholars {A GRADUATED,
          B WITHDRAWN-post-matriculation, C WITHDRAWN-pre-matriculation} gives
          census retention 5000 bps over S={A,B}; cohort C2 MATRICULATED with
          scholar D matriculated adds D to the rolling set only, giving rolling
          retention 3333 bps over S={A,B,D}. Census and rolling diverge (5000 vs
          3333) on one consistent database; graduation stays 5000 in both because
          D has no terminal outcome yet.
        test_recipe:
          setup:
            - "College Elm with two agreements (cycles 2027 and 2028), cohorts C1 (2027) and C2 (2028), both size 3, tuition 6123460"
            - "C1: A,B fully trained and matriculated; C withdrawn pre-matriculation (0 modules); A later RETAINED then GRADUATED; B later WITHDRAWN post-matriculation -> C1 COMPLETED, college standing recomputed"
            - "C2: D fully trained and matriculated; E,F withdrawn pre-matriculation; C2 stays MATRICULATED (D non-terminal)"
