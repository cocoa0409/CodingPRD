# =============================================================================
# PRD Benchmark Seed Tables
# Task: task_3403_plant_based_protein_extrusion_foodservice_launch_reformulation
# Plant-Based Protein Extrusion, Foodservice Launch & Reformulation
# =============================================================================

scenario: |
  Plant-Based Protein Extrusion, Foodservice Launch & Reformulation (Beyond Meat):
  protein isolate sourcing with supplier qualification and cost volatility affecting
  price parity goals, extrusion process control for fiber structure, moisture and
  texture with line-specific parameters, foodservice partner launch programs with
  limited-time tests, volume commitments and dedicated production runs, product
  reformulation across generations changing nutrition and ingredient statements with
  label and claim updates, co-manufacturing capacity contracts alongside owned plants
  with quality equivalence requirements, retail distribution in refrigerated and
  frozen sets with different shelf life and rotation, sampling and demonstration
  programs to overcome trial barriers, inventory write-down risk when demand
  forecasts miss.

domain_name: plant-protein-extrusion
api_prefix: /protein-ops

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # line capacity, volume commitments, dedicated runs
  secondary_archetype: compliance_audit      # supplier qualification, label claims, equivalence audits
  complexity_layers:
    - optimistic_concurrency                 # OCC on ProductionLine.version and Product.version
    - cascading_side_effects                 # run completion -> lots -> agreement; disqualify -> agreement -> lots
    - dual_variant_calculation               # provisional vs final lot landed cost; provisional vs NRV write-down
    - rate_threshold_triggers                # attainment, redemption, audit scores, parity goal, forecast miss
  entity_topology: hybrid                    # flat peers + self-referential Product generations + multi-FK runs
  state_machine_shape: cyclic                # supplier requalification cycle, label revision cycle, parallel dims on ProductionLine
  relationship_patterns:
    - one_to_many
    - self_referential                       # Product.supersedes_product_id
    - cross_aggregate                        # ProductionRun pins Line x Product x LabelVersion x GrowthProgram
  role_model: segregation_of_duties          # write-down proposer (DemandPlanner) cannot decide (FinanceController)
  consistency_model: immediate
  difficulty_target: beyond_expert           # density-first: every entity gates or feeds at least two others

# =============================================================================
# Named Constants Registry (single source of truth for every literal threshold)
# =============================================================================
constants:
  DEFAULT_CLOCK_START_ISO: "2026-09-01T00:00:00Z"   # logical clock default at server boot, before any set_current_utc
  QUALIFY_MIN_AUDIT_SCORE: 70                       # PENDING_AUDIT -> QUALIFIED requires audit_score >= 70
  REQUALIFY_MIN_AUDIT_SCORE: 80                     # SUSPENDED -> QUALIFIED requires audit_score >= 80 (stricter)
  OVERRECEIPT_TOLERANCE_PCT: 110                    # cumulative non-REJECTED lot kg <= committed_volume_kg * 110%
  FREIGHT_ESTIMATE_CENTS_PER_KG: 40                 # provisional landed cost freight add-on
  KG_PER_CASE: 10                                   # finished-goods case weight
  ISOLATE_KG_PER_FINISHED_KG_PCT: 85                # required_isolate_kg = ceil(actual_quantity_kg * 0.85)
  EXTRUSION_PROCESSING_MARKUP_PCT: 35               # product cost = weighted lot cost * 1.35 + packaging
  PACKAGING_CENTS_PER_KG: 110
  ANIMAL_PROTEIN_REFERENCE_CENTS_PER_KG: 920        # price-parity denominator
  PARITY_GOAL_MAX: 1.05                             # parity_goal_met when price_parity_index <= 1.05
  LAUNCH_MIN_ATTAINMENT_PCT: 85.00                  # LTO CONVERTED requires attainment_pct >= 85.00
  SAMPLING_MIN_REDEMPTION_PCT: 12.00                # SAMPLING CONVERTED requires redemption_rate_pct >= 12.00
  FORECAST_MISS_THRESHOLD_PCT: 20.00                # is_miss when variance_pct <= -20.00
  TEXTURE_EQUIVALENCE_MIN_SCORE: 80                 # audit passes when texture_score >= 80
  MOISTURE_VARIANCE_MAX_PCT: 3.0                    # audit passes when moisture_variance_pct <= 3.0
  CLAIM_HIGH_PROTEIN_MIN_PROTEIN_G: 20              # HIGH_PROTEIN claim requires protein_g >= 20
  CLAIM_LOW_SAT_FAT_MAX_FAT_G: 3                    # LOW_SATURATED_FAT claim requires fat_g <= 3
  SHELF_LIFE_DAYS_FOODSERVICE: 45
  SHELF_LIFE_DAYS_RETAIL_REFRIGERATED: 60
  SHELF_LIFE_DAYS_RETAIL_FROZEN: 270
  SHELF_LIFE_DAYS_SAMPLES: 30
  MIN_PROGRAM_GAP_DAYS: 14                          # same-partner LTO windows need >= 14 day gap
  EXPIRY_RISK_WINDOW_DAYS: 15                       # EXPIRY_RISK write-down requires <= 15 days to expiry (or past)
  NRV_CENTS_PER_CASE_FOODSERVICE: 1000              # net realizable value per case by channel (final write-down)
  NRV_CENTS_PER_CASE_RETAIL_REFRIGERATED: 1200
  NRV_CENTS_PER_CASE_RETAIL_FROZEN: 1500
  NRV_CENTS_PER_CASE_SAMPLES: 0

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: supplier_code, type: string, source: input, description: "Unique supplier code" , constraints: "unique across suppliers -> ERR_UNIQUE_CONSTRAINT" }
      - { name: isolate_type, type: enum, source: input, description: "Protein isolate type: PEA | FABA_BEAN | SOY | MUNG_BEAN" }
      - { name: qualification_status, type: enum, source: system, description: "PENDING_AUDIT | QUALIFIED | SUSPENDED | DISQUALIFIED; initial PENDING_AUDIT" }
      - { name: audit_score, type: integer, source: system, description: "Last audit score 0..100 recorded by a QUALIFICATION transition; null until first qualification" }
      - { name: agreement_status, type: enum, source: system, description: "Supply agreement dimension: DRAFT | ACTIVE | TERMINATED | EXPIRED | COMPLETED; initial DRAFT" }
      - { name: agreement_start_date, type: datetime, source: input, description: "Supply agreement validity start" }
      - { name: agreement_end_date, type: datetime, source: input, description: "Supply agreement validity end; must be after start" }
      - { name: committed_volume_kg, type: integer, source: input, description: "Contracted isolate volume (> 0)" }
      - { name: delivered_volume_kg, type: integer, source: computed, description: "Sum of quantity_kg over this supplier's lots with qc_status IN {RELEASED, DEPLETED}; initial 0" }
      - { name: base_price_per_kg_cents, type: integer, source: input, description: "Agreement base isolate price" }
      - { name: price_floor_cents, type: integer, source: input, description: "Indexed-price floor; must be < base_price_per_kg_cents" }
      - { name: price_cap_cents, type: integer, source: input, description: "Indexed-price cap; must be > base_price_per_kg_cents" }
      - { name: open_lot_count, type: integer, source: computed, description: "Count of lots with qc_status QUARANTINE or RELEASED; initial 0" }

  - name: IngredientLot
    parent: null
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: input, description: "FK -> Supplier.id of the supplying supplier" }
      - { name: lot_code, type: string, source: input, description: "Supplier lot code" }
      - { name: quantity_kg, type: integer, source: input, description: "Received quantity (> 0)" }
      - { name: remaining_kg, type: integer, source: computed, description: "Unconsumed quantity; initialized to quantity_kg; decremented by FIFO consumption at run completion" }
      - { name: received_at, type: datetime, source: input, description: "Receipt timestamp; FIFO consumption ordering key (ASC, tie-break created_at ASC)" }
      - { name: market_index_pct, type: number, source: input, description: "Isolate market volatility index at receipt, e.g. 0.10 = +10%" }
      - { name: moisture_pct, type: number, source: input, description: "Measured moisture percent at QC" }
      - { name: protein_content_pct, type: number, source: input, description: "Measured protein content percent at QC" }
      - { name: provisional_unit_cost_cents, type: integer, source: computed, description: "Provisional landed cost per kg at receipt (calc lot_landed_unit_cost, provisional variant)" }
      - { name: final_unit_cost_cents, type: integer, source: computed, description: "Final landed cost per kg at QC release (calc lot_landed_unit_cost, final variant); null until RELEASED" }
      - { name: qc_status, type: enum, source: system, description: "QUARANTINE | RELEASED | REJECTED | DEPLETED; initial QUARANTINE" }

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line code -> ERR_UNIQUE_CONSTRAINT" }
      - { name: site_type, type: enum, source: input, description: "OWNED | CO_MAN" }
      - { name: coman_partner_name, type: string, source: input, description: "Co-manufacturer name; required iff site_type == CO_MAN, forbidden otherwise" , default: null }
      - { name: monthly_reserved_capacity_kg, type: integer, source: input, description: "Co-man capacity contract: max summed planned kg per calendar month; required iff site_type == CO_MAN, forbidden otherwise", default: null }
      - { name: hourly_capacity_kg, type: integer, source: input, description: "Extrusion throughput (> 0)" }
      - { name: supported_isolate_types, type: array, source: input, description: "Non-empty array of isolate enums the line can extrude" }
      - { name: certification_status, type: enum, source: system, description: "PENDING | CERTIFIED | SUSPENDED; initial CERTIFIED when site_type == OWNED, else PENDING" }
      - { name: operational_status, type: enum, source: system, description: "IDLE | SETUP | RUNNING | CLEANING | DOWN; initial IDLE" }
      - { name: reserved_capacity_kg, type: integer, source: computed, description: "Sum of planned_quantity_kg over this line's runs with status IN {SCHEDULED, IN_PROGRESS}; initial 0" }
      - { name: last_audit_texture_score, type: integer, source: system, description: "Texture score from latest equivalence audit; null until first audit" }
      - { name: last_audit_moisture_variance_pct, type: number, source: system, description: "Moisture variance from latest equivalence audit; null until first audit" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: product_code, type: string, source: input, description: "Unique product code -> ERR_UNIQUE_CONSTRAINT" }
      - { name: generation_number, type: integer, source: input, description: "Reformulation generation (>= 1)" }
      - { name: supersedes_product_id, type: string, source: input, description: "FK -> Product.id of the prior generation this product supersedes; null for first generation", default: null }
      - { name: isolate_type, type: enum, source: input, description: "PEA | FABA_BEAN | SOY | MUNG_BEAN" }
      - { name: status, type: enum, source: system, description: "DEVELOPMENT | PILOT | ACTIVE | SUNSET | DISCONTINUED; initial DEVELOPMENT" }
      - { name: unit_cost_per_kg_cents, type: integer, source: computed, description: "Cost build-up from released isolate lots (calc price_parity_index); null until first computation" }
      - { name: price_parity_index, type: number, source: computed, description: "unit_cost_per_kg_cents / ANIMAL_PROTEIN_REFERENCE_CENTS_PER_KG, 4dp round_half_up; null until first computation" }
      - { name: parity_goal_met, type: boolean, source: computed, description: "price_parity_index <= PARITY_GOAL_MAX; null until first computation" }

  - name: LabelVersion
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id this label belongs to" }
      - { name: version_number, type: integer, source: input, description: "Label version within product; (product_id, version_number) unique -> ERR_UNIQUE_CONSTRAINT" }
      - { name: protein_g, type: number, source: input, description: "Protein grams per serving" }
      - { name: fat_g, type: number, source: input, description: "Total fat grams per serving" }
      - { name: sodium_mg, type: number, source: input, description: "Sodium milligrams per serving" }
      - { name: claims, type: array, source: input, description: "Array of claim enums: HIGH_PROTEIN | LOW_SATURATED_FAT | GLUTEN_FREE | NON_GMO; may be empty" }
      - { name: ingredient_statement, type: string, source: input, description: "Full ingredient statement; must be non-empty" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | SUPERSEDED; initial DRAFT" }

  - name: ProductionRun
    parent: null
    common_fields: true
    fields:
      - { name: production_line_id, type: string, source: input, description: "FK -> ProductionLine.id executing the run" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id being extruded" }
      - { name: label_version_id, type: string, source: input, description: "FK -> LabelVersion.id pinned at creation; must be APPROVED and belong to product_id" }
      - { name: program_id, type: string, source: input, description: "FK -> GrowthProgram.id this run is dedicated to; null for non-dedicated runs", default: null }
      - { name: is_dedicated, type: boolean, source: computed, description: "true iff program_id is non-null" }
      - { name: channel, type: enum, source: input, description: "FOODSERVICE | RETAIL_REFRIGERATED | RETAIL_FROZEN | SAMPLES; determines batch shelf life and program-channel mapping" }
      - { name: planned_quantity_kg, type: integer, source: input, description: "Planned output (> 0); reserves line capacity at creation" }
      - { name: scheduled_start, type: datetime, source: input, description: "Line occupation window start (half-open)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Line occupation window end (half-open; must be after scheduled_start)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | COMPLETED | RELEASED | RECALLED | ABORTED; initial SCHEDULED" }
      - { name: actual_quantity_kg, type: integer, source: input, description: "Actual finished output, supplied on COMPLETED transition; null until then" }
      - { name: required_isolate_kg, type: integer, source: computed, description: "ceil(actual_quantity_kg * ISOLATE_KG_PER_FINISHED_KG_PCT/100); null until COMPLETED" }
      - { name: consumed_lot_ids, type: array, source: system, description: "Ordered list of IngredientLot ids consumed FIFO at completion; [] until COMPLETED" }
      - { name: cases_produced, type: integer, source: computed, description: "floor(actual_quantity_kg / KG_PER_CASE); null until COMPLETED" }
      - { name: unit_cost_cents_per_case, type: integer, source: computed, description: "Blended case cost (calc batch_costing); null until COMPLETED" }

  - name: GrowthProgram
    parent: null
    common_fields: true
    fields:
      - { name: program_code, type: string, source: input, description: "Unique program code -> ERR_UNIQUE_CONSTRAINT" }
      - { name: program_type, type: enum, source: input, description: "FOODSERVICE_LTO | SAMPLING_DEMO" }
      - { name: partner_code, type: string, source: input, description: "Foodservice partner identifier; required iff FOODSERVICE_LTO, must be null for SAMPLING_DEMO", default: null }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id featured by the program" }
      - { name: window_start, type: datetime, source: input, description: "Limited-time test window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Limited-time test window end (inclusive for occupancy; must be after window_start)" }
      - { name: committed_cases, type: integer, source: input, description: "Volume commitment in cases (> 0); required iff FOODSERVICE_LTO, must be null for SAMPLING_DEMO", default: null }
      - { name: dedicated_run_required, type: boolean, source: input, description: "LTO-only flag: volume must come from dedicated runs; default true", default: true }
      - { name: budget_cents, type: integer, source: input, description: "Sampling budget; required iff SAMPLING_DEMO, must be null for FOODSERVICE_LTO", default: null }
      - { name: coupons_issued, type: integer, source: input, description: "Demo coupons issued (>= 0); SAMPLING_DEMO only, default 0", default: 0 }
      - { name: coupons_redeemed, type: integer, source: system, description: "Redeemed coupons reported at window close; initial 0" }
      - { name: delivered_cases, type: integer, source: computed, description: "Sum of quantity_cases over batches whose run is dedicated to this program; initial 0" }
      - { name: attainment_pct, type: number, source: computed, description: "round_half_up(delivered_cases * 100 / committed_cases, 2); null for SAMPLING_DEMO or while committed_cases null" }
      - { name: redemption_rate_pct, type: number, source: computed, description: "round_half_up(coupons_redeemed * 100 / coupons_issued, 2); null unless SAMPLING_DEMO with coupons_issued > 0" }
      - { name: commitment_met, type: boolean, source: computed, description: "delivered_cases >= committed_cases; false for SAMPLING_DEMO" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACTIVE | IN_WINDOW | EVALUATING | CONVERTED | CONCLUDED | TERMINATED; initial PROPOSED" }

  - name: FinishedGoodsBatch
    parent: null
    common_fields: true
    fields:
      - { name: production_run_id, type: string, source: system, description: "FK -> ProductionRun.id that produced this batch" }
      - { name: product_id, type: string, source: system, description: "FK -> Product.id (denormalized from the run)" }
      - { name: channel, type: enum, source: system, description: "Copied from the run: FOODSERVICE | RETAIL_REFRIGERATED | RETAIL_FROZEN | SAMPLES" }
      - { name: quantity_cases, type: integer, source: system, description: "Cases produced (immutable after creation)" }
      - { name: available_cases, type: integer, source: computed, description: "Unreserved, un-written-off cases; initialized to quantity_cases" }
      - { name: reserved_cases, type: integer, source: computed, description: "Cases reserved to a program; initial 0" }
      - { name: written_off_cases, type: integer, source: computed, description: "Cases consumed by POSTED write-downs; initial 0" }
      - { name: reserved_for_program_id, type: string, source: system, description: "FK -> GrowthProgram.id holding the reservation; null when reserved_cases == 0", default: null }
      - { name: produced_at, type: datetime, source: system, description: "Logical clock timestamp at run completion" }
      - { name: expiry_date, type: datetime, source: computed, description: "produced_at + shelf-life days for channel (constants SHELF_LIFE_DAYS_*)" }
      - { name: unit_cost_cents_per_case, type: integer, source: system, description: "Copied from the run's unit_cost_cents_per_case" }
      - { name: recall_flag, type: boolean, source: system, description: "true once the producing run is RECALLED; default false", default: false }
      - { name: derived_status, type: enum, source: computed, description: "WRITTEN_OFF if written_off_cases == quantity_cases; else EXPIRED if clock >= expiry_date; else DEPLETED if available_cases == 0 and reserved_cases == 0; else RESERVED if reserved_cases > 0; else AVAILABLE" }

  - name: DemandForecast
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: input, description: "FK -> Product.id being forecast" }
      - { name: channel, type: enum, source: input, description: "FOODSERVICE | RETAIL_REFRIGERATED | RETAIL_FROZEN | SAMPLES" }
      - { name: week_start, type: datetime, source: input, description: "Week bucket start (00:00:00Z)" }
      - { name: forecast_cases, type: integer, source: input, description: "Forecasted demand (> 0); (product_id, channel, week_start) unique -> ERR_UNIQUE_CONSTRAINT" }
      - { name: actual_cases, type: integer, source: input, description: "Actual demand posted on ACTUALIZED transition (>= 0); null until then" }
      - { name: variance_pct, type: number, source: computed, description: "round_half_up((actual_cases - forecast_cases) * 100 / forecast_cases, 2); null until ACTUALIZED" }
      - { name: is_miss, type: boolean, source: computed, description: "variance_pct <= -FORECAST_MISS_THRESHOLD_PCT; null until ACTUALIZED" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | LOCKED | ACTUALIZED; initial PROVISIONAL" }

  - name: InventoryWriteDown
    parent: null
    common_fields: true
    fields:
      - { name: finished_goods_batch_id, type: string, source: input, description: "FK -> FinishedGoodsBatch.id being written down" }
      - { name: demand_forecast_id, type: string, source: input, description: "FK -> DemandForecast.id evidencing the miss; required iff reason == FORECAST_MISS, else null", default: null }
      - { name: reason, type: enum, source: input, description: "FORECAST_MISS | EXPIRY_RISK | RECALL" }
      - { name: quantity_cases, type: integer, source: input, description: "Cases to write down (> 0, <= batch available_cases)" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the proposing DemandPlanner" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding FinanceController; null until decision" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "quantity_cases * batch.unit_cost_cents_per_case (full-cost exposure at proposal)" }
      - { name: final_amount_cents, type: integer, source: computed, description: "quantity_cases * max(0, batch.unit_cost_cents_per_case - NRV per channel) at POSTED; null until POSTED" }
      - { name: status, type: enum, source: system, description: "PROPOSED | POSTED | REJECTED; initial PROPOSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Supplier
    initial_state: PENDING_AUDIT (qualification_status); DRAFT (agreement_status) — two parallel dimensions mutated via POST /protein-ops/suppliers/{id}/transitions with input dimension = QUALIFICATION | AGREEMENT
    terminal_states: [DISQUALIFIED (qualification); TERMINATED, EXPIRED, COMPLETED (agreement)]
    note: "Terminal lockdown precedence: once qualification_status == DISQUALIFIED, EVERY further transition call (either dimension) fails ERR_INVALID_STATE before any other gate is evaluated."
    transitions:
      - from: PENDING_AUDIT
        to: QUALIFIED
        trigger: "POST /protein-ops/suppliers/{id}/transitions {dimension: QUALIFICATION, target_status: QUALIFIED}"
        actor: ProcurementManager
        preconditions:
          - "qualification_status == PENDING_AUDIT (else ERR_INVALID_STATE)"
          - "audit_score provided and >= QUALIFY_MIN_AUDIT_SCORE (70) (else ERR_SUPPLIER_NOT_QUALIFIABLE)"
        side_effects:
          - "audit_score stored on supplier"
      - from: QUALIFIED
        to: SUSPENDED
        trigger: "POST /protein-ops/suppliers/{id}/transitions {dimension: QUALIFICATION, target_status: SUSPENDED}"
        actor: ProcurementManager
        preconditions:
          - "qualification_status == QUALIFIED (else ERR_INVALID_STATE)"
        side_effects: []
      - from: SUSPENDED
        to: QUALIFIED
        trigger: "POST /protein-ops/suppliers/{id}/transitions {dimension: QUALIFICATION, target_status: QUALIFIED}"
        actor: ProcurementManager
        preconditions:
          - "qualification_status == SUSPENDED (else ERR_INVALID_STATE)"
          - "audit_score provided and >= REQUALIFY_MIN_AUDIT_SCORE (80) — stricter than first qualification (else ERR_SUPPLIER_NOT_QUALIFIABLE)"
        side_effects:
          - "audit_score stored on supplier"
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /protein-ops/suppliers/{id}/transitions {dimension: QUALIFICATION, target_status: DISQUALIFIED}"
        actor: ProcurementManager
        preconditions:
          - "qualification_status IN {QUALIFIED, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects:
          - "cascade link 1: if agreement_status == ACTIVE -> agreement_status becomes TERMINATED (same rules as manual termination)"
          - "cascade link 2 (triggered by link 1): every lot of this supplier with qc_status == QUARANTINE -> REJECTED"
      - from: SUSPENDED
        to: DISQUALIFIED
        trigger: "POST /protein-ops/suppliers/{id}/transitions {dimension: QUALIFICATION, target_status: DISQUALIFIED}"
        actor: ProcurementManager
        preconditions:
          - "qualification_status IN {QUALIFIED, SUSPENDED} (else ERR_INVALID_STATE)"
        side_effects:
          - "cascade link 1: if agreement_status == ACTIVE -> agreement_status becomes TERMINATED"
          - "cascade link 2 (triggered by link 1): every QUARANTINE lot of this supplier -> REJECTED"
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /protein-ops/suppliers/{id}/transitions {dimension: AGREEMENT, target_status: ACTIVE}"
        actor: ProcurementManager
        preconditions:
          - "agreement_status == DRAFT (else ERR_INVALID_STATE)"
          - "qualification_status == QUALIFIED (cross-dimension guard, else ERR_AGREEMENT_REQUIRES_QUALIFIED)"
          - "agreement_end_date > current logical clock (else ERR_INVALID_WINDOW)"
        side_effects: []
      - from: DRAFT
        to: TERMINATED
        trigger: "POST /protein-ops/suppliers/{id}/transitions {dimension: AGREEMENT, target_status: TERMINATED}"
        actor: ProcurementManager
        preconditions:
          - "agreement_status IN {DRAFT, ACTIVE} (else ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /protein-ops/suppliers/{id}/transitions {dimension: AGREEMENT, target_status: TERMINATED}"
        actor: ProcurementManager
        preconditions:
          - "agreement_status IN {DRAFT, ACTIVE} (else ERR_INVALID_STATE)"
        side_effects:
          - "every lot of this supplier with qc_status == QUARANTINE -> REJECTED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep inside POST /_clock/set_current_utc when agreement_end_date <= new clock"
        actor: system
        preconditions:
          - "agreement_status == ACTIVE and agreement_end_date <= new clock value"
        side_effects:
          - "agreement_status becomes EXPIRED (QUARANTINE lots are NOT auto-rejected on expiry; they become unreleasable)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system evaluation after each lot RELEASED transition and each lot DEPLETED transition"
        actor: system
        preconditions:
          - "agreement_status == ACTIVE and delivered_volume_kg >= committed_volume_kg and open_lot_count == 0"
        side_effects:
          - "agreement_status becomes COMPLETED (terminal)"

  - entity: IngredientLot
    initial_state: QUARANTINE
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: QUARANTINE
        to: RELEASED
        trigger: "POST /protein-ops/ingredient-lots/{id}/qc-decision {decision: RELEASED}"
        actor: QualityManager
        preconditions:
          - "qc_status == QUARANTINE (else ERR_INVALID_STATE)"
          - "supplier.agreement_status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
          - "invoiced_unit_cost_cents and actual_freight_cents_per_kg provided (else ERR_INVALID_REQUEST)"
        side_effects:
          - "final_unit_cost_cents computed (lot_landed_unit_cost, final variant)"
          - "supplier.delivered_volume_kg += quantity_kg"
          - "supplier.open_lot_count unchanged (QUARANTINE -> RELEASED keeps lot open)"
          - "supplier agreement completion re-evaluated (ACTIVE -> COMPLETED rule)"
          - "price_parity_index recomputed for every Product with status == ACTIVE whose isolate_type matches the lot's supplier isolate_type"
      - from: QUARANTINE
        to: REJECTED
        trigger: "POST /protein-ops/ingredient-lots/{id}/qc-decision {decision: REJECTED}"
        actor: QualityManager
        preconditions:
          - "qc_status == QUARANTINE (else ERR_INVALID_STATE)"
        side_effects:
          - "supplier.open_lot_count -= 1"
      - from: RELEASED
        to: DEPLETED
        trigger: "system transition when a production run completion drives remaining_kg to 0"
        actor: system
        preconditions:
          - "qc_status == RELEASED and remaining_kg == 0"
        side_effects:
          - "supplier.open_lot_count -= 1"
          - "supplier agreement completion re-evaluated (ACTIVE -> COMPLETED rule)"

  - entity: ProductionLine
    initial_state: "certification_status: CERTIFIED if site_type == OWNED else PENDING; operational_status: IDLE — two parallel dimensions"
    terminal_states: []
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /protein-ops/production-lines/{id}/certification-audits with passing scores"
        actor: QualityManager
        preconditions:
          - "site_type == CO_MAN (else ERR_AUDIT_NOT_APPLICABLE)"
          - "certification_status IN {PENDING, SUSPENDED} (else ERR_INVALID_STATE)"
          - "texture_score >= TEXTURE_EQUIVALENCE_MIN_SCORE (80) AND moisture_variance_pct <= MOISTURE_VARIANCE_MAX_PCT (3.0) — else audit FAILS"
        side_effects:
          - "last_audit_texture_score and last_audit_moisture_variance_pct stored"
      - from: SUSPENDED
        to: CERTIFIED
        trigger: "POST /protein-ops/production-lines/{id}/certification-audits with passing scores"
        actor: QualityManager
        preconditions:
          - "site_type == CO_MAN (else ERR_AUDIT_NOT_APPLICABLE)"
          - "certification_status IN {PENDING, SUSPENDED} (else ERR_INVALID_STATE)"
          - "texture_score >= 80 AND moisture_variance_pct <= 3.0 — else audit FAILS"
        side_effects:
          - "last_audit_texture_score and last_audit_moisture_variance_pct stored"
      - from: CERTIFIED
        to: SUSPENDED
        trigger: "POST /protein-ops/production-lines/{id}/certification-audits with failing scores"
        actor: QualityManager
        preconditions:
          - "site_type == CO_MAN (else ERR_AUDIT_NOT_APPLICABLE)"
          - "certification_status == CERTIFIED (from PENDING a failing audit leaves the line PENDING)"
          - "texture_score < 80 OR moisture_variance_pct > 3.0"
        side_effects:
          - "last_audit_texture_score and last_audit_moisture_variance_pct stored"
      - from: IDLE
        to: SETUP
        trigger: "POST /protein-ops/production-lines/{id}/operational-transitions {target_status: SETUP}"
        actor: PlantManager
        preconditions: ["operational_status == IDLE (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SETUP
        to: RUNNING
        trigger: "POST /protein-ops/production-lines/{id}/operational-transitions {target_status: RUNNING}"
        actor: PlantManager
        preconditions: ["operational_status == SETUP (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: RUNNING
        to: CLEANING
        trigger: "POST /protein-ops/production-lines/{id}/operational-transitions {target_status: CLEANING}"
        actor: PlantManager
        preconditions: ["operational_status == RUNNING (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: CLEANING
        to: IDLE
        trigger: "POST /protein-ops/production-lines/{id}/operational-transitions {target_status: IDLE}"
        actor: PlantManager
        preconditions: ["operational_status == CLEANING (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: ANY_OPERATIONAL
        to: DOWN
        trigger: "POST /protein-ops/production-lines/{id}/operational-transitions {target_status: DOWN}"
        actor: PlantManager
        preconditions: ["operational_status IN {IDLE, SETUP, RUNNING, CLEANING} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: DOWN
        to: IDLE
        trigger: "POST /protein-ops/production-lines/{id}/operational-transitions {target_status: IDLE}"
        actor: PlantManager
        preconditions: ["operational_status == DOWN (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Product
    initial_state: DEVELOPMENT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DEVELOPMENT
        to: PILOT
        trigger: "POST /protein-ops/products/{id}/lifecycle-transitions {target_state: PILOT}"
        actor: ProductManager
        preconditions: ["status == DEVELOPMENT (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: PILOT
        to: ACTIVE
        trigger: "POST /protein-ops/products/{id}/lifecycle-transitions {target_state: ACTIVE}"
        actor: ProductManager
        preconditions:
          - "status == PILOT (else ERR_INVALID_STATE)"
          - "at least one LabelVersion of this product has status == APPROVED (else ERR_LABEL_NOT_APPROVED)"
        side_effects:
          - "price_parity_index, unit_cost_per_kg_cents, parity_goal_met computed (calc price_parity_index)"
          - "if supersedes_product_id is non-null and that product's status IN {PILOT, ACTIVE} -> it becomes SUNSET (auto-sunset of the superseded generation)"
      - from: ACTIVE
        to: SUNSET
        trigger: "POST /protein-ops/products/{id}/lifecycle-transitions {target_state: SUNSET}"
        actor: ProductManager
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUNSET
        to: DISCONTINUED
        trigger: "POST /protein-ops/products/{id}/lifecycle-transitions {target_state: DISCONTINUED}"
        actor: ProductManager
        preconditions: ["status == SUNSET (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: LabelVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /protein-ops/label-versions/{id}/transitions {target_status: SUBMITTED}"
        actor: ProductManager
        preconditions:
          - "status == DRAFT (else ERR_INVALID_STATE)"
          - "claim gates: HIGH_PROTEIN requires protein_g >= CLAIM_HIGH_PROTEIN_MIN_PROTEIN_G (20); LOW_SATURATED_FAT requires fat_g <= CLAIM_LOW_SAT_FAT_MAX_FAT_G (3) (else ERR_LABEL_CLAIM_UNSUPPORTED)"
          - "ingredient_statement non-empty (else ERR_INVALID_REQUEST)"
        side_effects: []
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /protein-ops/label-versions/{id}/transitions {target_status: DRAFT} (return for revision)"
        actor: ProductManager
        preconditions: ["status == SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /protein-ops/label-versions/{id}/transitions {target_status: APPROVED, expected_product_version: <n>}"
        actor: ProductManager
        preconditions:
          - "status == SUBMITTED (else ERR_INVALID_STATE)"
          - "expected_product_version provided (else ERR_INVALID_REQUEST) and == product.version (else ERR_STALE_PRODUCT_VERSION)"
        side_effects:
          - "product.version += 1 (OCC advance)"
          - "any other LabelVersion of the same product with status == APPROVED -> SUPERSEDED"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system cascade when a newer LabelVersion of the same product is APPROVED"
        actor: system
        preconditions: ["a sibling label transitions to APPROVED"]
        side_effects: []

  - entity: ProductionRun
    initial_state: SCHEDULED
    terminal_states: [RELEASED, RECALLED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /protein-ops/production-runs/{id}/transitions {target_status: IN_PROGRESS}"
        actor: PlantManager
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
          - "production line certification_status == CERTIFIED (else ERR_LINE_NOT_CERTIFIED)"
          - "line operational_status IN {IDLE, SETUP} (else ERR_LINE_OPERATIONAL_FORBIDDEN); if is_dedicated, line operational_status must be IDLE exactly (else ERR_LINE_OPERATIONAL_FORBIDDEN)"
        side_effects:
          - "line operational_status -> RUNNING"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /protein-ops/production-runs/{id}/transitions {target_status: COMPLETED, actual_quantity_kg: <n>}"
        actor: PlantManager
        preconditions:
          - "status == IN_PROGRESS (else ERR_INVALID_STATE)"
          - "actual_quantity_kg provided and > 0 (else ERR_INVALID_REQUEST)"
          - "total remaining_kg over RELEASED lots whose supplier.isolate_type == product.isolate_type >= ceil(actual_quantity_kg * 0.85) (else ERR_INSUFFICIENT_ISOLATE)"
        side_effects:
          - "cascade link 1: FIFO consume required_isolate_kg across eligible RELEASED lots ordered by received_at ASC, tie-break created_at ASC; each lot remaining_kg decremented; consumed_lot_ids recorded in consumption order"
          - "cascade link 2 (from link 1): any lot whose remaining_kg hits 0 -> DEPLETED (system transition), supplier.open_lot_count -= 1"
          - "cascade link 3 (from link 2): supplier agreement completion re-evaluated; ACTIVE -> COMPLETED when delivered_volume_kg >= committed_volume_kg and open_lot_count == 0"
          - "FinishedGoodsBatch created: channel from run, quantity_cases = floor(actual_quantity_kg / KG_PER_CASE), unit_cost_cents_per_case per calc batch_costing, produced_at = current clock, expiry_date = produced_at + channel shelf life"
          - "if is_dedicated: GrowthProgram.delivered_cases += cases_produced; attainment_pct and commitment_met recomputed; batch auto-reserved to the program (reserved_cases = quantity_cases, reserved_for_program_id = program)"
          - "line operational_status -> CLEANING; line.reserved_capacity_kg -= planned_quantity_kg"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /protein-ops/production-runs/{id}/transitions {target_status: ABORTED}"
        actor: PlantManager
        preconditions: ["status IN {SCHEDULED, IN_PROGRESS} (else ERR_INVALID_STATE)"]
        side_effects:
          - "line.reserved_capacity_kg -= planned_quantity_kg (capacity release)"
      - from: IN_PROGRESS
        to: ABORTED
        trigger: "POST /protein-ops/production-runs/{id}/transitions {target_status: ABORTED}"
        actor: PlantManager
        preconditions: ["status IN {SCHEDULED, IN_PROGRESS} (else ERR_INVALID_STATE)"]
        side_effects:
          - "line.reserved_capacity_kg -= planned_quantity_kg"
          - "line operational_status -> CLEANING"
      - from: COMPLETED
        to: RELEASED
        trigger: "POST /protein-ops/production-runs/{id}/transitions {target_status: RELEASED}"
        actor: QualityManager
        preconditions: ["status == COMPLETED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: COMPLETED
        to: RECALLED
        trigger: "POST /protein-ops/production-runs/{id}/transitions {target_status: RECALLED}"
        actor: QualityManager
        preconditions: ["status == COMPLETED (else ERR_INVALID_STATE)"]
        side_effects:
          - "every FinishedGoodsBatch of this run gets recall_flag = true"

  - entity: GrowthProgram
    initial_state: PROPOSED
    terminal_states: [CONVERTED, CONCLUDED, TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /protein-ops/programs/{id}/lifecycle {target_status: ACTIVE}"
        actor: ChannelManager
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_STATE)"
          - "product.status IN {PILOT, ACTIVE} (else ERR_PRODUCT_NOT_PRODUCIBLE)"
          - "if program_type == FOODSERVICE_LTO: no other FOODSERVICE_LTO program with the same partner_code and status IN {ACTIVE, IN_WINDOW, EVALUATING} violates the gap rule: violation iff NOT (existing.window_end + 14 days <= new.window_start OR new.window_end + 14 days <= existing.window_start) (else ERR_PROGRAM_WINDOW_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: IN_WINDOW
        trigger: "POST /protein-ops/programs/{id}/lifecycle {target_status: IN_WINDOW}"
        actor: ChannelManager
        preconditions:
          - "status == ACTIVE (else ERR_INVALID_STATE)"
          - "window_start <= current clock <= window_end (else ERR_OUTSIDE_TEST_WINDOW)"
        side_effects: []
      - from: IN_WINDOW
        to: EVALUATING
        trigger: "POST /protein-ops/programs/{id}/lifecycle {target_status: EVALUATING}"
        actor: ChannelManager
        preconditions:
          - "status == IN_WINDOW (else ERR_INVALID_STATE)"
          - "if program_type == SAMPLING_DEMO: final_coupons_redeemed provided (else ERR_INVALID_REQUEST) and <= coupons_issued (else ERR_REDEMPTION_EXCEEDS_ISSUED)"
        side_effects:
          - "SAMPLING_DEMO: coupons_redeemed := final_coupons_redeemed; redemption_rate_pct recomputed"
          - "FOODSERVICE_LTO: attainment_pct recomputed"
      - from: EVALUATING
        to: CONVERTED
        trigger: "POST /protein-ops/programs/{id}/lifecycle {target_status: CONVERTED}"
        actor: ChannelManager
        preconditions:
          - "status == EVALUATING (else ERR_INVALID_STATE)"
          - "FOODSERVICE_LTO: attainment_pct >= LAUNCH_MIN_ATTAINMENT_PCT (85.00); SAMPLING_DEMO: redemption_rate_pct >= SAMPLING_MIN_REDEMPTION_PCT (12.00) (else ERR_PROGRAM_TARGET_NOT_MET)"
        side_effects: []
      - from: EVALUATING
        to: CONCLUDED
        trigger: "POST /protein-ops/programs/{id}/lifecycle {target_status: CONCLUDED}"
        actor: ChannelManager
        preconditions: ["status == EVALUATING (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: ANY_NONTERMINAL
        to: TERMINATED
        trigger: "POST /protein-ops/programs/{id}/lifecycle {target_status: TERMINATED}"
        actor: ChannelManager
        preconditions: ["status IN {PROPOSED, ACTIVE, IN_WINDOW, EVALUATING} (else ERR_INVALID_STATE)"]
        side_effects:
          - "compensating release: every FinishedGoodsBatch with reserved_for_program_id == this program -> reserved_cases added back to available_cases, reserved_cases := 0, reserved_for_program_id := null"

  - entity: DemandForecast
    initial_state: PROVISIONAL
    terminal_states: [ACTUALIZED]
    transitions:
      - from: PROVISIONAL
        to: LOCKED
        trigger: "POST /protein-ops/demand-forecasts/{id}/transitions {target_status: LOCKED}"
        actor: DemandPlanner
        preconditions: ["status == PROVISIONAL (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: LOCKED
        to: ACTUALIZED
        trigger: "POST /protein-ops/demand-forecasts/{id}/transitions {target_status: ACTUALIZED, actual_cases: <n>}"
        actor: DemandPlanner
        preconditions:
          - "status == LOCKED (else ERR_INVALID_STATE)"
          - "actual_cases provided and >= 0 (else ERR_INVALID_REQUEST)"
        side_effects:
          - "variance_pct and is_miss computed"

  - entity: InventoryWriteDown
    initial_state: PROPOSED
    terminal_states: [POSTED, REJECTED]
    transitions:
      - from: PROPOSED
        to: POSTED
        trigger: "POST /protein-ops/inventory-write-downs/{id}/decision {decision: POSTED}"
        actor: FinanceController
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_STATE)"
          - "segregation of duties: X-User-ID != proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "final_amount_cents computed (write_down_amounts, final variant)"
          - "batch.available_cases -= quantity_cases; batch.written_off_cases += quantity_cases; batch derived_status recomputed"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /protein-ops/inventory-write-downs/{id}/decision {decision: REJECTED}"
        actor: FinanceController
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_STATE)"
          - "segregation of duties: X-User-ID != proposed_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: run-create-stale-line
    parent_entity: ProductionLine
    write_endpoint: "POST /protein-ops/production-runs"
    occ_field: expected_line_version
    description: |
      Creating a ProductionRun against a ProductionLine whose version has advanced
      since the client last observed it (for example because another run creation
      has since reserved capacity on the line, or a certification audit changed
      its status) is rejected as stale. Expressed as a strict version comparison,
      never as a wall-clock or ordering rule.
    error_id: ERR_STALE_LINE_VERSION
    http_status: 412
  - rule_id: label-approve-stale-product
    parent_entity: Product
    write_endpoint: "POST /protein-ops/label-versions/{id}/transitions"
    occ_field: expected_product_version
    description: |
      Approving a LabelVersion against a Product whose version has advanced since
      the client last observed it (for example because another label of the same
      product has since been approved, superseding the previous one) is rejected
      as stale. The check applies only when target_status == APPROVED; the field
      is conditionally required for that target.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lot_landed_unit_cost
    trigger: "provisional variant: on POST /protein-ops/ingredient-lots (lot receipt); final variant: on qc-decision RELEASED"
    algorithm: threshold
    formula: |
      provisional_unit_cost_cents =
        clamp( round_half_up(base_price_per_kg_cents * (1 + market_index_pct), 0),
               price_floor_cents, price_cap_cents )
        + FREIGHT_ESTIMATE_CENTS_PER_KG
      final_unit_cost_cents =
        clamp( invoiced_unit_cost_cents, price_floor_cents, price_cap_cents )
        + actual_freight_cents_per_kg
      where clamp(x, lo, hi) = min(hi, max(lo, x)); floor/cap/base from the lot's Supplier agreement fields.
    input_set: "the IngredientLot and its Supplier; base/floor/cap from Supplier agreement fields"
    constants:
      FREIGHT_ESTIMATE_CENTS_PER_KG: 40
    precision: "integer cents, round_half_up applied to the indexed base BEFORE clamping"
    variants:
      - name: provisional
        when: "at lot receipt (create)"
        difference: "uses agreement base price indexed by market_index_pct plus the freight ESTIMATE (40 cents/kg); stored on provisional_unit_cost_cents"
      - name: final
        when: "at QC release (decision RELEASED)"
        difference: "uses the actual invoiced_unit_cost_cents (still clamped to floor/cap) plus the actual freight; stored on final_unit_cost_cents; the two variants differ whenever the indexed estimate differs from the invoice or the freight estimate differs from actual"

  - name: batch_costing
    trigger: "on ProductionRun transition IN_PROGRESS -> COMPLETED"
    algorithm: chronological
    formula: |
      required_isolate_kg = ceil(actual_quantity_kg * ISOLATE_KG_PER_FINISHED_KG_PCT / 100)
      eligible lots = IngredientLot with qc_status == RELEASED and remaining_kg > 0
                      whose Supplier.isolate_type == run.product.isolate_type
      consumption order: received_at ASC, tie-break created_at ASC (FIFO; never id)
      consume lot-by-lot until required_isolate_kg covered; the last lot may be partially consumed.
      total_cost_cents = SUM over consumed lots of round_half_up(lot.final_unit_cost_cents * lot_consumed_kg, 0)
      cases_produced = floor(actual_quantity_kg / KG_PER_CASE)
      unit_cost_cents_per_case = round_half_up(total_cost_cents / cases_produced, 0)   # requires cases_produced > 0
    input_set: "RELEASED lots with remaining_kg > 0 and matching isolate_type only; QUARANTINE/REJECTED/DEPLETED lots excluded"
    constants:
      KG_PER_CASE: 10
      ISOLATE_KG_PER_FINISHED_KG_PCT: 85
    precision: |
      PINNED rounding order: round each lot's consumed cost to integer cents (round_half_up),
      THEN sum, THEN divide by cases_produced and round_half_up to integer cents again.
      Skipping the per-lot round or reordering the divisions is a violation.
    variants: []

  - name: price_parity_index
    trigger: "on Product transition PILOT -> ACTIVE; and on any IngredientLot RELEASED transition whose supplier isolate matches an ACTIVE product's isolate_type (recompute for each such product)"
    algorithm: weighted_scoring
    formula: |
      lots = IngredientLot with qc_status == RELEASED and remaining_kg > 0
             whose Supplier.isolate_type == product.isolate_type
      if no such lots: unit_cost_per_kg_cents, price_parity_index, parity_goal_met are null
      weighted_avg_cost = SUM(final_unit_cost_cents * remaining_kg) / SUM(remaining_kg)   # exact rational
      unit_cost_per_kg_cents = round_half_up(weighted_avg_cost * (1 + EXTRUSION_PROCESSING_MARKUP_PCT/100) + PACKAGING_CENTS_PER_KG, 0)
      price_parity_index = round_half_up(unit_cost_per_kg_cents / ANIMAL_PROTEIN_REFERENCE_CENTS_PER_KG, 4)
      parity_goal_met = price_parity_index <= PARITY_GOAL_MAX
    input_set: "RELEASED, non-depleted (remaining_kg > 0) lots of the matching isolate only"
    constants:
      EXTRUSION_PROCESSING_MARKUP_PCT: 35
      PACKAGING_CENTS_PER_KG: 110
      ANIMAL_PROTEIN_REFERENCE_CENTS_PER_KG: 920
      PARITY_GOAL_MAX: 1.05
    precision: "unit cost integer cents round_half_up; parity index 4 decimal places round_half_up"
    variants: []

  - name: program_attainment
    trigger: "on each dedicated ProductionRun completion linked to the program (delivered_cases updated); and re-read on EVALUATING -> CONVERTED"
    algorithm: aggregation
    formula: |
      delivered_cases = SUM of quantity_cases over FinishedGoodsBatch b
                        where b.production_run.program_id == program.id
                        (all batch statuses count; attainment measures produced volume)
      attainment_pct = round_half_up(delivered_cases * 100 / committed_cases, 2)   # committed_cases > 0
      commitment_met = delivered_cases >= committed_cases
      FOODSERVICE_LTO CONVERTED gate: attainment_pct >= LAUNCH_MIN_ATTAINMENT_PCT
    input_set: "batches of runs dedicated to this program; SAMPLING_DEMO programs have attainment_pct null"
    constants:
      KG_PER_CASE: 10
      LAUNCH_MIN_ATTAINMENT_PCT: 85.00
    precision: "2 decimal places, round_half_up; cases_produced per run is floor(actual/KG_PER_CASE) BEFORE summing (per-run floor then sum — pinned order)"
    variants: []

  - name: sampling_redemption_rate
    trigger: "on GrowthProgram IN_WINDOW -> EVALUATING for SAMPLING_DEMO programs"
    algorithm: threshold
    formula: |
      coupons_redeemed = final_coupons_redeemed (must be <= coupons_issued)
      redemption_rate_pct = round_half_up(coupons_redeemed * 100 / coupons_issued, 2) when coupons_issued > 0 else null
      SAMPLING_DEMO CONVERTED gate: redemption_rate_pct >= SAMPLING_MIN_REDEMPTION_PCT (null rate fails the gate)
    input_set: "the program's own coupon counters"
    constants:
      SAMPLING_MIN_REDEMPTION_PCT: 12.00
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: forecast_variance
    trigger: "on DemandForecast LOCKED -> ACTUALIZED"
    algorithm: threshold
    formula: |
      variance_pct = round_half_up((actual_cases - forecast_cases) * 100 / forecast_cases, 2)
      is_miss = variance_pct <= -FORECAST_MISS_THRESHOLD_PCT
    input_set: "the forecast's own forecast_cases and actual_cases"
    constants:
      FORECAST_MISS_THRESHOLD_PCT: 20.00
    precision: "2 decimal places, round_half_up; boundary: variance exactly -20.00 IS a miss"
    variants: []

  - name: write_down_amounts
    trigger: "provisional variant: on POST /protein-ops/inventory-write-downs; final variant: on decision POSTED"
    algorithm: threshold
    formula: |
      provisional_amount_cents = quantity_cases * batch.unit_cost_cents_per_case
      final_amount_cents = quantity_cases * max(0, batch.unit_cost_cents_per_case - NRV(channel))
      NRV(channel) = NRV_CENTS_PER_CASE_<channel> from constants
    input_set: "the write-down quantity and the referenced FinishedGoodsBatch (unit cost and channel)"
    constants:
      NRV_CENTS_PER_CASE_FOODSERVICE: 1000
      NRV_CENTS_PER_CASE_RETAIL_REFRIGERATED: 1200
      NRV_CENTS_PER_CASE_RETAIL_FROZEN: 1500
      NRV_CENTS_PER_CASE_SAMPLES: 0
    precision: "integer cents; no rounding needed (all inputs integer)"
    variants:
      - name: provisional
        when: "at proposal"
        difference: "values the write-down at FULL cost (no NRV recovery); stored on provisional_amount_cents"
      - name: final
        when: "at POSTED decision"
        difference: "values only the unrecoverable portion (cost minus channel NRV, floored at 0 per case); stored on final_amount_cents; differs from provisional whenever NRV > 0 and unit_cost > 0"

  - name: batch_derived_status
    trigger: "computed on every read and before every batch mutation (reserve, write-down proposal/decision)"
    algorithm: aggregation
    formula: |
      if written_off_cases == quantity_cases: WRITTEN_OFF
      elif current_clock >= expiry_date: EXPIRED
      elif available_cases == 0 and reserved_cases == 0: DEPLETED
      elif reserved_cases > 0: RESERVED
      else: AVAILABLE
      expiry_date = produced_at + SHELF_LIFE_DAYS_<channel> days
      INVARIANT (case accounting): quantity_cases == available_cases + reserved_cases + written_off_cases
    input_set: "the batch's own counters plus the current logical clock"
    constants:
      SHELF_LIFE_DAYS_FOODSERVICE: 45
      SHELF_LIFE_DAYS_RETAIL_REFRIGERATED: 60
      SHELF_LIFE_DAYS_RETAIL_FROZEN: 270
      SHELF_LIFE_DAYS_SAMPLES: 30
    precision: "exact enum; clock comparison is >= on expiry_date"
    variants: []

  - name: equivalence_audit_result
    trigger: "on POST /protein-ops/production-lines/{id}/certification-audits"
    algorithm: threshold
    formula: |
      PASSED iff texture_score >= TEXTURE_EQUIVALENCE_MIN_SCORE AND moisture_variance_pct <= MOISTURE_VARIANCE_MAX_PCT
      PASSED from {PENDING, SUSPENDED} -> certification CERTIFIED; PASSED from CERTIFIED -> stays CERTIFIED
      FAILED from CERTIFIED -> SUSPENDED; FAILED from PENDING -> stays PENDING
    input_set: "the two audit scores supplied in the request"
    constants:
      TEXTURE_EQUIVALENCE_MIN_SCORE: 80
      MOISTURE_VARIANCE_MAX_PCT: 3.0
    precision: "score thresholds inclusive (>=, <=); boundaries pass"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; first matching error wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles; for POST /production-runs/{id}/transitions additionally: targets IN_PROGRESS/COMPLETED/ABORTED require PlantManager, targets RELEASED/RECALLED require QualityManager"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every id referenced by the request exists — path parameters first (left to right), then body FK fields in the endpoint input declaration order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "OCC version check: expected_line_version == line.version on run create; expected_product_version == product.version on label APPROVED"
    error_id: ERR_STALE_LINE_VERSION | ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: ["POST /protein-ops/production-runs", "POST /protein-ops/label-versions/{id}/transitions"]
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition exists (terminal states reject everything)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints
  - priority: 6
    category: business_safety
    check: "compliance gates: audit_score meets the dimension threshold (QUALIFY_MIN 70 / REQUALIFY_MIN 80 -> ERR_SUPPLIER_NOT_QUALIFIABLE); line certification CERTIFIED for run create and run start (ERR_LINE_NOT_CERTIFIED); certification audits only on CO_MAN lines (ERR_AUDIT_NOT_APPLICABLE); label claims supported by nutrition at SUBMITTED (ERR_LABEL_CLAIM_UNSUPPORTED); write-down decision-maker != proposer (ERR_SEGREGATION_OF_DUTIES)"
    error_id: ERR_SUPPLIER_NOT_QUALIFIABLE | ERR_LINE_NOT_CERTIFIED | ERR_AUDIT_NOT_APPLICABLE | ERR_LABEL_CLAIM_UNSUPPORTED | ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: ["POST /protein-ops/suppliers/{id}/transitions", "POST /protein-ops/production-runs", "POST /protein-ops/production-runs/{id}/transitions", "POST /protein-ops/production-lines/{id}/certification-audits", "POST /protein-ops/label-versions/{id}/transitions", "POST /protein-ops/inventory-write-downs/{id}/decision"]
  - priority: 7
    category: business_temporal
    check: "temporal rules: scheduled_end > scheduled_start (ERR_INVALID_WINDOW); agreement_end_date in future at agreement activation (ERR_INVALID_WINDOW); run window free of overlap on the line (ERR_RUN_WINDOW_CONFLICT); dedicated run window inside program window (ERR_RUN_OUTSIDE_PROGRAM_WINDOW); program open-window inside [window_start, window_end] (ERR_OUTSIDE_TEST_WINDOW); same-partner LTO window gap >= 14 days (ERR_PROGRAM_WINDOW_OVERLAP); EXPIRY_RISK reason requires <= 15 days to expiry or past expiry (ERR_NOT_EXPIRY_RISK)"
    error_id: ERR_INVALID_WINDOW | ERR_RUN_WINDOW_CONFLICT | ERR_RUN_OUTSIDE_PROGRAM_WINDOW | ERR_OUTSIDE_TEST_WINDOW | ERR_PROGRAM_WINDOW_OVERLAP | ERR_NOT_EXPIRY_RISK
    http_status: 422
    applies_to: ["POST /protein-ops/production-runs", "POST /protein-ops/programs", "POST /protein-ops/programs/{id}/lifecycle", "POST /protein-ops/suppliers/{id}/transitions", "POST /protein-ops/inventory-write-downs"]
  - priority: 8
    category: business_constraint
    check: "structural rules, evaluated in this order: uniqueness of supplier_code / line_code / product_code / program_code / (product_id, version_number) labels / (product_id, channel, week_start) forecasts (ERR_UNIQUE_CONSTRAINT); write-down batch derived_status not WRITTEN_OFF or DEPLETED (ERR_BATCH_NOT_WRITABLE — precedes the write-down quantity bound); write-down quantity <= available_cases (ERR_WRITEDOWN_EXCEEDS_AVAILABLE); run product isolate in line.supported_isolate_types (ERR_ISOLATE_NOT_SUPPORTED); channel <-> program_type mapping FOODSERVICE_LTO=FOODSERVICE, SAMPLING_DEMO=SAMPLES for dedicated runs and reservations (ERR_CHANNEL_PROGRAM_MISMATCH); batch reserved to at most one program at a time (ERR_BATCH_ALREADY_RESERVED); FEFO: no earlier-expiry available batch of same product+channel when reserving (ERR_FEFO_VIOLATION); reserve quantity <= available_cases (ERR_INSUFFICIENT_AVAILABLE_CASES); reserve product match (ERR_PRODUCT_MISMATCH); line operational preconditions for run start (ERR_LINE_OPERATIONAL_FORBIDDEN)"
    error_id: ERR_UNIQUE_CONSTRAINT | ERR_ISOLATE_NOT_SUPPORTED | ERR_CHANNEL_PROGRAM_MISMATCH | ERR_BATCH_ALREADY_RESERVED | ERR_FEFO_VIOLATION | ERR_INSUFFICIENT_AVAILABLE_CASES | ERR_WRITEDOWN_EXCEEDS_AVAILABLE | ERR_PRODUCT_MISMATCH | ERR_BATCH_NOT_WRITABLE | ERR_LINE_OPERATIONAL_FORBIDDEN
    http_status: 422
    applies_to: ["POST /protein-ops/suppliers", "POST /protein-ops/production-lines", "POST /protein-ops/products", "POST /protein-ops/products/{product_id}/label-versions", "POST /protein-ops/programs", "POST /protein-ops/demand-forecasts", "POST /protein-ops/production-runs", "POST /protein-ops/production-runs/{id}/transitions", "POST /protein-ops/finished-goods-batches/{id}/reserve", "POST /protein-ops/inventory-write-downs"]
  - priority: 9
    category: business_referential
    check: "cross-entity state references: product IN {PILOT, ACTIVE} for run create and program activation (ERR_PRODUCT_NOT_PRODUCIBLE); pinned label APPROVED and belongs to run product (ERR_LABEL_NOT_APPROVED, ERR_LABEL_PRODUCT_MISMATCH); program status IN {ACTIVE, IN_WINDOW} for dedicated runs and reservations (ERR_PROGRAM_NOT_ACCEPTING_RUNS); supplier agreement ACTIVE for lot receipt and release (ERR_AGREEMENT_NOT_ACTIVE); agreement activation requires qualification QUALIFIED (ERR_AGREEMENT_REQUIRES_QUALIFIED); FORECAST_MISS write-down requires forecast ACTUALIZED (ERR_FORECAST_NOT_ACTUALIZED), is_miss true (ERR_FORECAST_NO_MISS), and matching product+channel (ERR_FORECAST_MISMATCH); RECALL write-down requires batch recall_flag (ERR_RUN_NOT_RECALLED)"
    error_id: ERR_PRODUCT_NOT_PRODUCIBLE | ERR_LABEL_NOT_APPROVED | ERR_LABEL_PRODUCT_MISMATCH | ERR_PROGRAM_NOT_ACCEPTING_RUNS | ERR_AGREEMENT_NOT_ACTIVE | ERR_AGREEMENT_REQUIRES_QUALIFIED | ERR_FORECAST_NOT_ACTUALIZED | ERR_FORECAST_NO_MISS | ERR_FORECAST_MISMATCH | ERR_RUN_NOT_RECALLED
    http_status: 422
    applies_to: ["POST /protein-ops/production-runs", "POST /protein-ops/ingredient-lots", "POST /protein-ops/ingredient-lots/{id}/qc-decision", "POST /protein-ops/suppliers/{id}/transitions", "POST /protein-ops/programs/{id}/lifecycle", "POST /protein-ops/finished-goods-batches/{id}/reserve", "POST /protein-ops/inventory-write-downs"]
  - priority: 10
    category: business_fiscal
    check: "capacity/volume limits: CO_MAN line monthly capacity — sum of planned_quantity_kg over runs on the line with status IN {SCHEDULED, IN_PROGRESS, COMPLETED} whose scheduled_start falls in the same calendar month as the new run, plus the new planned_quantity_kg, must be <= monthly_reserved_capacity_kg (ERR_CAPACITY_EXCEEDED); cumulative non-REJECTED lot kg per supplier <= committed_volume_kg * OVERRECEIPT_TOLERANCE_PCT/100 (ERR_VOLUME_TOLERANCE_EXCEEDED); sufficient RELEASED isolate at run completion (ERR_INSUFFICIENT_ISOLATE); final_coupons_redeemed <= coupons_issued (ERR_REDEMPTION_EXCEEDS_ISSUED)"
    error_id: ERR_CAPACITY_EXCEEDED | ERR_VOLUME_TOLERANCE_EXCEEDED | ERR_INSUFFICIENT_ISOLATE | ERR_REDEMPTION_EXCEEDS_ISSUED
    http_status: 422
    applies_to: ["POST /protein-ops/production-runs", "POST /protein-ops/ingredient-lots", "POST /protein-ops/production-runs/{id}/transitions", "POST /protein-ops/programs/{id}/lifecycle"]
  - priority: 11
    category: business_constraint
    check: "request shape and conditional-required fields (evaluated after state gates so state errors win): unknown/invalid enum values, missing required inputs, and type-conditional requirements — audit_score when qualifying; invoiced_unit_cost_cents + actual_freight_cents_per_kg when releasing a lot; actual_quantity_kg when completing a run; actual_cases when actualizing a forecast; expected_product_version when approving a label; partner_code + committed_cases for FOODSERVICE_LTO and their absence for SAMPLING_DEMO; budget_cents + coupons_issued for SAMPLING_DEMO and their absence for FOODSERVICE_LTO; coman_partner_name + monthly_reserved_capacity_kg for CO_MAN lines and their absence for OWNED; demand_forecast_id when reason == FORECAST_MISS; final_coupons_redeemed when closing a SAMPLING_DEMO window"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving endpoint (logical clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z (DEFAULT_CLOCK_START_ISO) and never falls back to wall-clock time. Setting the clock also runs the agreement-expiry sweep (ACTIVE agreements whose agreement_end_date <= new clock become EXPIRED)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["supplier agreement expiry sweep (ACTIVE -> EXPIRED where agreement_end_date <= to_iso8601)"]

  # --- Supplier ---
  - method: POST
    path: "/protein-ops/suppliers"
    description: "Register a protein isolate supplier together with its supply-agreement terms (agreement starts DRAFT; qualification starts PENDING_AUDIT)."
    roles: [ProcurementManager]
    code: 201
    input: [supplier_code, isolate_type, committed_volume_kg, base_price_per_kg_cents, price_floor_cents, price_cap_cents, agreement_start_date, agreement_end_date]
    output: Supplier
    side_effects: ["qualification_status := PENDING_AUDIT", "agreement_status := DRAFT", "delivered_volume_kg := 0", "open_lot_count := 0"]
  - method: GET
    path: "/protein-ops/suppliers"
    description: "List suppliers with optional filters and pagination."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["qualification_status?", "agreement_status?", "isolate_type?", "limit?", "offset?"]
    output: Supplier[]
    side_effects: []
  - method: POST
    path: "/protein-ops/suppliers/{id}/transitions"
    description: "Drive one of the supplier's two parallel state dimensions. dimension=QUALIFICATION: target PENDING_AUDIT|QUALIFIED|SUSPENDED|DISQUALIFIED (audit_score required when target QUALIFIED). dimension=AGREEMENT: target DRAFT|ACTIVE|TERMINATED (EXPIRED/COMPLETED are system-only)."
    roles: [ProcurementManager]
    code: 200
    input: [dimension, target_status, "audit_score?"]
    output: Supplier
    side_effects: ["qualification/agreement cascades per state machine (disqualify cascades to agreement and quarantine lots; terminate rejects quarantine lots)", "increments Supplier.version by 1"]

  # --- IngredientLot ---
  - method: POST
    path: "/protein-ops/ingredient-lots"
    description: "Receive an isolate lot into QUARANTINE. Requires supplier agreement ACTIVE; cumulative non-REJECTED volume must stay within committed_volume_kg * 1.10."
    roles: [ProcurementManager]
    code: 201
    input: [supplier_id, lot_code, quantity_kg, received_at, market_index_pct, moisture_pct, protein_content_pct]
    output: IngredientLot
    side_effects: ["provisional_unit_cost_cents computed (lot_landed_unit_cost provisional)", "supplier.open_lot_count += 1", "remaining_kg := quantity_kg"]
  - method: GET
    path: "/protein-ops/ingredient-lots"
    description: "List lots (reverse-lookup for Supplier via supplier_id)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["supplier_id?", "qc_status?", "limit?", "offset?"]
    output: IngredientLot[]
    side_effects: []
  - method: GET
    path: "/protein-ops/ingredient-lots/{id}"
    description: "Fetch one lot."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: []
    output: IngredientLot
    side_effects: []
  - method: POST
    path: "/protein-ops/ingredient-lots/{id}/qc-decision"
    description: "QC release or reject a quarantined lot. RELEASED requires invoiced_unit_cost_cents and actual_freight_cents_per_kg and supplier agreement ACTIVE."
    roles: [QualityManager]
    code: 200
    input: [decision, "invoiced_unit_cost_cents?", "actual_freight_cents_per_kg?"]
    output: IngredientLot
    side_effects: ["RELEASED: final_unit_cost_cents computed, supplier.delivered_volume_kg += quantity_kg, agreement completion re-evaluated, price_parity_index recomputed for ACTIVE products of matching isolate", "REJECTED: supplier.open_lot_count -= 1", "increments IngredientLot.version by 1"]

  # --- ProductionLine ---
  - method: POST
    path: "/protein-ops/production-lines"
    description: "Register an extrusion line. OWNED lines start CERTIFIED; CO_MAN lines start PENDING and carry the co-man capacity-contract fields."
    roles: [PlantManager]
    code: 201
    input: [line_code, site_type, hourly_capacity_kg, supported_isolate_types, "coman_partner_name?", "monthly_reserved_capacity_kg?"]
    output: ProductionLine
    side_effects: ["certification_status := CERTIFIED (OWNED) or PENDING (CO_MAN)", "operational_status := IDLE", "reserved_capacity_kg := 0"]
  - method: GET
    path: "/protein-ops/production-lines"
    description: "List lines (used to read line.version before OCC-guarded run creation)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["site_type?", "certification_status?", "operational_status?", "limit?", "offset?"]
    output: ProductionLine[]
    side_effects: []
  - method: POST
    path: "/protein-ops/production-lines/{id}/operational-transitions"
    description: "Move the line's operational dimension (IDLE|SETUP|RUNNING|CLEANING|DOWN)."
    roles: [PlantManager]
    code: 200
    input: [target_status]
    output: ProductionLine
    side_effects: ["increments ProductionLine.version by 1"]
  - method: POST
    path: "/protein-ops/production-lines/{id}/certification-audits"
    description: "Record a quality-equivalence audit for a CO_MAN line against owned-plant reference metrics; result (PASSED/FAILED) computed from thresholds and drives the certification dimension."
    roles: [QualityManager]
    code: 201
    input: [texture_score, moisture_variance_pct]
    output: ProductionLine
    side_effects: ["certification transition per equivalence_audit_result", "last_audit_* fields stored", "increments ProductionLine.version by 1"]

  # --- Product ---
  - method: POST
    path: "/protein-ops/products"
    description: "Create a product generation. supersedes_product_id links a reformulation to the prior generation (self-referential)."
    roles: [ProductManager]
    code: 201
    input: [product_code, generation_number, isolate_type, "supersedes_product_id?"]
    output: Product
    side_effects: ["status := DEVELOPMENT"]
  - method: GET
    path: "/protein-ops/products"
    description: "List products (supersedes_product_id filter = reverse-lookup for the self-FK)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["supersedes_product_id?", "status?", "isolate_type?", "limit?", "offset?"]
    output: Product[]
    side_effects: []
  - method: GET
    path: "/protein-ops/products/{id}"
    description: "Fetch one product (used to read product.version before OCC-guarded label approval)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: []
    output: Product
    side_effects: []
  - method: POST
    path: "/protein-ops/products/{id}/lifecycle-transitions"
    description: "Advance the product lifecycle DEVELOPMENT -> PILOT -> ACTIVE -> SUNSET -> DISCONTINUED. Activation requires an APPROVED label, computes price parity, and auto-sunsets the superseded generation."
    roles: [ProductManager]
    code: 200
    input: [target_state]
    output: Product
    side_effects: ["on ACTIVE: price_parity_index computed; superseded product PILOT/ACTIVE -> SUNSET", "increments Product.version by 1"]

  # --- LabelVersion ---
  - method: POST
    path: "/protein-ops/products/{product_id}/label-versions"
    description: "Draft a label/nutrition/claim set for a product generation. Requires product status IN {DEVELOPMENT, PILOT, ACTIVE}."
    roles: [ProductManager]
    code: 201
    input: [version_number, protein_g, fat_g, sodium_mg, claims, ingredient_statement]
    output: LabelVersion
    side_effects: ["status := DRAFT"]
  - method: GET
    path: "/protein-ops/label-versions"
    description: "List label versions (reverse-lookup for Product via product_id)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["product_id?", "status?", "limit?", "offset?"]
    output: LabelVersion[]
    side_effects: []
  - method: GET
    path: "/protein-ops/label-versions/{id}"
    description: "Fetch one label version."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: []
    output: LabelVersion
    side_effects: []
  - method: POST
    path: "/protein-ops/label-versions/{id}/transitions"
    description: "Label workflow: DRAFT -> SUBMITTED (claim gates), SUBMITTED -> DRAFT (return for revision), SUBMITTED -> APPROVED (requires expected_product_version; supersedes the prior APPROVED label of the same product and bumps product.version)."
    roles: [ProductManager]
    code: 200
    input: [target_status, "expected_product_version?"]
    output: LabelVersion
    side_effects: ["APPROVED: product.version += 1; prior APPROVED sibling -> SUPERSEDED", "increments LabelVersion.version by 1"]

  # --- ProductionRun ---
  - method: POST
    path: "/protein-ops/production-runs"
    description: "Schedule a run on a line, pinning product, APPROVED label version, optional dedicated program, channel, and a half-open line occupation window. OCC: expected_line_version must match the line's current version."
    roles: [PlantManager]
    code: 201
    input: [production_line_id, product_id, label_version_id, channel, planned_quantity_kg, scheduled_start, scheduled_end, expected_line_version, "program_id?"]
    output: ProductionRun
    side_effects: ["line.reserved_capacity_kg += planned_quantity_kg", "increments ProductionLine.version by 1", "status := SCHEDULED", "is_dedicated := program_id != null"]
  - method: GET
    path: "/protein-ops/production-runs"
    description: "List runs (multi-FK reverse-lookup: production_line_id, product_id, label_version_id, program_id)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["production_line_id?", "product_id?", "label_version_id?", "program_id?", "status?", "limit?", "offset?"]
    output: ProductionRun[]
    side_effects: []
  - method: GET
    path: "/protein-ops/production-runs/{id}"
    description: "Fetch one run."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: []
    output: ProductionRun
    side_effects: []
  - method: POST
    path: "/protein-ops/production-runs/{id}/transitions"
    description: "Run lifecycle. PlantManager: IN_PROGRESS (line gates + line -> RUNNING), COMPLETED (actual_quantity_kg required; FIFO lot consumption, batch creation, program delivery cascade, line -> CLEANING), ABORTED (capacity release). QualityManager: RELEASED, RECALLED (sets recall_flag on batches)."
    roles: [PlantManager, QualityManager]
    code: 200
    input: [target_status, "actual_quantity_kg?"]
    output: ProductionRun
    side_effects: ["per state machine: lot consumption/depletion, agreement completion, batch creation, program delivered_cases, line capacity release, recall flagging", "increments ProductionRun.version by 1"]

  # --- GrowthProgram ---
  - method: POST
    path: "/protein-ops/programs"
    description: "Create a foodservice limited-time launch program (FOODSERVICE_LTO: partner_code + committed_cases + dedicated runs) or a sampling/demonstration program (SAMPLING_DEMO: budget_cents + coupons_issued)."
    roles: [ChannelManager]
    code: 201
    input: [program_code, program_type, product_id, window_start, window_end, "partner_code?", "committed_cases?", "dedicated_run_required?", "budget_cents?", "coupons_issued?"]
    output: GrowthProgram
    side_effects: ["status := PROPOSED", "delivered_cases := 0", "coupons_redeemed := 0", "commitment_met := false"]
  - method: GET
    path: "/protein-ops/programs"
    description: "List programs (reverse-lookup for Product via product_id)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["product_id?", "program_type?", "partner_code?", "status?", "limit?", "offset?"]
    output: GrowthProgram[]
    side_effects: []
  - method: GET
    path: "/protein-ops/programs/{id}"
    description: "Fetch one program (attainment / redemption reads)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: []
    output: GrowthProgram
    side_effects: []
  - method: POST
    path: "/protein-ops/programs/{id}/lifecycle"
    description: "Program lifecycle: PROPOSED -> ACTIVE (partner window-gap rule for LTO) -> IN_WINDOW (clock inside window) -> EVALUATING (SAMPLING: final_coupons_redeemed) -> CONVERTED (attainment >= 85.00 / redemption >= 12.00) or CONCLUDED; TERMINATED from any non-terminal state (releases batch reservations)."
    roles: [ChannelManager]
    code: 200
    input: [target_status, "final_coupons_redeemed?"]
    output: GrowthProgram
    side_effects: ["close: coupons_redeemed set, rates recomputed", "terminate: batch reservations released (compensating action)", "increments GrowthProgram.version by 1"]

  # --- FinishedGoodsBatch ---
  - method: GET
    path: "/protein-ops/finished-goods-batches"
    description: "List batches (multi-FK reverse-lookup: production_run_id, product_id, reserved_for_program_id)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["production_run_id?", "product_id?", "reserved_for_program_id?", "channel?", "derived_status?", "limit?", "offset?"]
    output: FinishedGoodsBatch[]
    side_effects: []
  - method: GET
    path: "/protein-ops/finished-goods-batches/{id}"
    description: "Fetch one batch (derived_status evaluated against the current clock)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: []
    output: FinishedGoodsBatch
    side_effects: []
  - method: POST
    path: "/protein-ops/finished-goods-batches/{id}/reserve"
    description: "Reserve cases of an available batch to a program (FEFO enforced within product+channel; one program per batch; program-channel mapping enforced)."
    roles: [ChannelManager]
    code: 200
    input: [program_id, quantity_cases]
    output: FinishedGoodsBatch
    side_effects: ["available_cases -= quantity_cases", "reserved_cases += quantity_cases", "reserved_for_program_id := program_id", "increments FinishedGoodsBatch.version by 1"]

  # --- DemandForecast ---
  - method: POST
    path: "/protein-ops/demand-forecasts"
    description: "Create a weekly product/channel demand forecast. (product_id, channel, week_start) unique."
    roles: [DemandPlanner]
    code: 201
    input: [product_id, channel, week_start, forecast_cases]
    output: DemandForecast
    side_effects: ["status := PROVISIONAL"]
  - method: GET
    path: "/protein-ops/demand-forecasts"
    description: "List forecasts (reverse-lookup for Product via product_id)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["product_id?", "channel?", "status?", "limit?", "offset?"]
    output: DemandForecast[]
    side_effects: []
  - method: GET
    path: "/protein-ops/demand-forecasts/{id}"
    description: "Fetch one forecast."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: []
    output: DemandForecast
    side_effects: []
  - method: POST
    path: "/protein-ops/demand-forecasts/{id}/transitions"
    description: "PROVISIONAL -> LOCKED -> ACTUALIZED (actual_cases required for ACTUALIZED; variance_pct and is_miss computed on actualize)."
    roles: [DemandPlanner]
    code: 200
    input: [target_status, "actual_cases?"]
    output: DemandForecast
    side_effects: ["ACTUALIZED: variance_pct, is_miss computed", "increments DemandForecast.version by 1"]

  # --- InventoryWriteDown ---
  - method: POST
    path: "/protein-ops/inventory-write-downs"
    description: "Propose an inventory write-down (FORECAST_MISS needs an ACTUALIZED missing forecast; EXPIRY_RISK needs <= 15 days to expiry or past expiry; RECALL needs recall_flag). Provisional amount at full cost."
    roles: [DemandPlanner]
    code: 201
    input: [finished_goods_batch_id, quantity_cases, reason, "demand_forecast_id?"]
    output: InventoryWriteDown
    side_effects: ["status := PROPOSED", "proposed_by_user_id := X-User-ID", "provisional_amount_cents computed"]
  - method: GET
    path: "/protein-ops/inventory-write-downs"
    description: "List write-downs (multi-FK reverse-lookup: finished_goods_batch_id, demand_forecast_id)."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: ["finished_goods_batch_id?", "demand_forecast_id?", "status?", "limit?", "offset?"]
    output: InventoryWriteDown[]
    side_effects: []
  - method: GET
    path: "/protein-ops/inventory-write-downs/{id}"
    description: "Fetch one write-down."
    roles: [PlatformAdmin, ProcurementManager, QualityManager, PlantManager, ProductManager, ChannelManager, DemandPlanner, FinanceController]
    code: 200
    input: []
    output: InventoryWriteDown
    side_effects: []
  - method: POST
    path: "/protein-ops/inventory-write-downs/{id}/decision"
    description: "FinanceController posts or rejects a proposed write-down. Segregation of duties: decision-maker's X-User-ID must differ from proposed_by_user_id. POSTED computes the NRV-based final amount and decrements batch available_cases."
    roles: [FinanceController]
    code: 200
    input: [decision]
    output: InventoryWriteDown
    side_effects: ["POSTED: final_amount_cents computed; batch.available_cases -= quantity_cases; batch.written_off_cases += quantity_cases", "decided_by_user_id := X-User-ID", "increments InventoryWriteDown.version by 1"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID headers, or unrecognized role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on the endpoint (or not permitted for the requested transition target on POST /production-runs/{id}/transitions)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path or body id does not exist (checked left-to-right: path params, then body FKs in input order)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum/type, or violated type-conditional field requirement (evaluated after state gates)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition exists; includes terminal-state lockdown and reserving a batch whose derived_status is EXPIRED/WRITTEN_OFF/DEPLETED" }
  - { id: ERR_STALE_LINE_VERSION, http: 412, condition: "expected_line_version != current ProductionLine.version on run create (OCC)" }
  - { id: ERR_STALE_PRODUCT_VERSION, http: 412, condition: "expected_product_version != current Product.version on label APPROVED (OCC)" }
  - { id: ERR_SUPPLIER_NOT_QUALIFIABLE, http: 422, condition: "QUALIFIED target with audit_score < 70 from PENDING_AUDIT, or < 80 from SUSPENDED" }
  - { id: ERR_AGREEMENT_REQUIRES_QUALIFIED, http: 422, condition: "Agreement activation while qualification_status != QUALIFIED" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 422, condition: "Lot receipt or release while supplier agreement_status != ACTIVE" }
  - { id: ERR_VOLUME_TOLERANCE_EXCEEDED, http: 422, condition: "Cumulative non-REJECTED lot kg would exceed committed_volume_kg * 1.10" }
  - { id: ERR_LINE_NOT_CERTIFIED, http: 422, condition: "Run create or start while line certification_status != CERTIFIED" }
  - { id: ERR_AUDIT_NOT_APPLICABLE, http: 422, condition: "Certification audit posted to an OWNED line" }
  - { id: ERR_LINE_OPERATIONAL_FORBIDDEN, http: 422, condition: "Run start while line operational_status not IDLE/SETUP; dedicated run start while line not exactly IDLE" }
  - { id: ERR_RUN_WINDOW_CONFLICT, http: 409, condition: "New run's half-open [scheduled_start, scheduled_end) overlaps another SCHEDULED/IN_PROGRESS run on the same line" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "scheduled_end <= scheduled_start; or program window_end <= window_start; or agreement_end_date not in the future at activation" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "CO_MAN line: month-bucketed planned kg total (SCHEDULED/IN_PROGRESS/COMPLETED runs) plus new run would exceed monthly_reserved_capacity_kg" }
  - { id: ERR_PRODUCT_NOT_PRODUCIBLE, http: 422, condition: "Run create or program activation while product status not IN {PILOT, ACTIVE}" }
  - { id: ERR_LABEL_NOT_APPROVED, http: 422, condition: "Run create pins a label that is not APPROVED; or product activation without any APPROVED label" }
  - { id: ERR_LABEL_PRODUCT_MISMATCH, http: 422, condition: "Run's label_version_id belongs to a different product than product_id" }
  - { id: ERR_LABEL_CLAIM_UNSUPPORTED, http: 422, condition: "SUBMITTED with HIGH_PROTEIN and protein_g < 20, or LOW_SATURATED_FAT and fat_g > 3" }
  - { id: ERR_ISOLATE_NOT_SUPPORTED, http: 422, condition: "Run product isolate_type not in line.supported_isolate_types" }
  - { id: ERR_PROGRAM_NOT_ACCEPTING_RUNS, http: 422, condition: "Dedicated run create or batch reservation while program status not IN {ACTIVE, IN_WINDOW}" }
  - { id: ERR_CHANNEL_PROGRAM_MISMATCH, http: 422, condition: "Dedicated run or reservation whose channel does not match the program type mapping (LTO=FOODSERVICE, SAMPLING=SAMPLES)" }
  - { id: ERR_RUN_OUTSIDE_PROGRAM_WINDOW, http: 422, condition: "Dedicated run's window not fully contained in its program's [window_start, window_end]" }
  - { id: ERR_PROGRAM_WINDOW_OVERLAP, http: 409, condition: "Same-partner FOODSERVICE_LTO program activation would leave < 14 days gap (or overlap) against another ACTIVE/IN_WINDOW/EVALUATING program" }
  - { id: ERR_OUTSIDE_TEST_WINDOW, http: 422, condition: "Program open-window while current clock outside [window_start, window_end]" }
  - { id: ERR_PROGRAM_TARGET_NOT_MET, http: 422, condition: "CONVERTED while attainment_pct < 85.00 (LTO) or redemption_rate_pct < 12.00 or null (SAMPLING)" }
  - { id: ERR_REDEMPTION_EXCEEDS_ISSUED, http: 422, condition: "final_coupons_redeemed > coupons_issued at sampling window close" }
  - { id: ERR_INSUFFICIENT_AVAILABLE_CASES, http: 422, condition: "Reservation quantity_cases > batch available_cases" }
  - { id: ERR_FEFO_VIOLATION, http: 409, condition: "Reservation skips a same-product, same-channel batch with strictly earlier expiry_date and available_cases > 0 (FEFO)" }
  - { id: ERR_BATCH_ALREADY_RESERVED, http: 409, condition: "Batch already holds a reservation for a different program" }
  - { id: ERR_PRODUCT_MISMATCH, http: 422, condition: "Reservation program.product_id != batch.product_id" }
  - { id: ERR_FORECAST_NOT_ACTUALIZED, http: 422, condition: "FORECAST_MISS write-down whose forecast is not ACTUALIZED" }
  - { id: ERR_FORECAST_NO_MISS, http: 422, condition: "FORECAST_MISS write-down whose forecast is_miss is false" }
  - { id: ERR_FORECAST_MISMATCH, http: 422, condition: "FORECAST_MISS write-down whose forecast product_id or channel differs from the batch's" }
  - { id: ERR_NOT_EXPIRY_RISK, http: 422, condition: "EXPIRY_RISK write-down with more than 15 days to expiry" }
  - { id: ERR_RUN_NOT_RECALLED, http: 422, condition: "RECALL write-down for a batch whose recall_flag is false" }
  - { id: ERR_BATCH_NOT_WRITABLE, http: 422, condition: "Write-down against a batch whose derived_status is WRITTEN_OFF or DEPLETED" }
  - { id: ERR_WRITEDOWN_EXCEEDS_AVAILABLE, http: 422, condition: "Write-down quantity_cases > batch available_cases" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Write-down decision-maker X-User-ID equals proposed_by_user_id" }
  - { id: ERR_UNIQUE_CONSTRAINT, http: 409, condition: "Duplicate supplier_code / line_code / product_code / program_code / (product_id, version_number) / (product_id, channel, week_start)" }
  - { id: ERR_INSUFFICIENT_ISOLATE, http: 422, condition: "Run completion when RELEASED isolate of matching type totals less than ceil(actual_quantity_kg * 0.85)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; only drives the test-facing logical clock."
    identity: opaque
    exclusive_operations: ["POST /_clock/set_current_utc"]
    shared_operations: ["all GET endpoints"]
  - name: ProcurementManager
    description: "Owns supplier registration, qualification/agreement transitions, and isolate lot receipt."
    identity: opaque
    exclusive_operations: ["POST /protein-ops/suppliers", "POST /protein-ops/suppliers/{id}/transitions", "POST /protein-ops/ingredient-lots"]
    shared_operations: ["all GET endpoints"]
  - name: QualityManager
    description: "Owns lot QC release/reject, co-man equivalence audits, and run QA release/recall."
    identity: opaque
    exclusive_operations: ["POST /protein-ops/ingredient-lots/{id}/qc-decision", "POST /protein-ops/production-lines/{id}/certification-audits", "run transitions to RELEASED/RECALLED"]
    shared_operations: ["all GET endpoints"]
  - name: PlantManager
    description: "Owns line registration, line operational transitions, and run scheduling/execution/abort."
    identity: opaque
    exclusive_operations: ["POST /protein-ops/production-lines", "POST /protein-ops/production-lines/{id}/operational-transitions", "POST /protein-ops/production-runs", "run transitions to IN_PROGRESS/COMPLETED/ABORTED"]
    shared_operations: ["all GET endpoints"]
  - name: ProductManager
    description: "Owns product generations and label versions."
    identity: opaque
    exclusive_operations: ["POST /protein-ops/products", "POST /protein-ops/products/{id}/lifecycle-transitions", "POST /protein-ops/products/{product_id}/label-versions", "POST /protein-ops/label-versions/{id}/transitions"]
    shared_operations: ["all GET endpoints"]
  - name: ChannelManager
    description: "Owns foodservice launch / sampling programs and batch reservations."
    identity: opaque
    exclusive_operations: ["POST /protein-ops/programs", "POST /protein-ops/programs/{id}/lifecycle", "POST /protein-ops/finished-goods-batches/{id}/reserve"]
    shared_operations: ["all GET endpoints"]
  - name: DemandPlanner
    description: "Owns demand forecasts and PROPOSES inventory write-downs; may never decide them."
    identity: opaque
    exclusive_operations: ["POST /protein-ops/demand-forecasts", "POST /protein-ops/demand-forecasts/{id}/transitions", "POST /protein-ops/inventory-write-downs"]
    shared_operations: ["all GET endpoints"]
  - name: FinanceController
    description: "Decides (posts/rejects) inventory write-downs; segregation of duties forbids deciding one's own proposal."
    identity: opaque
    exclusive_operations: ["POST /protein-ops/inventory-write-downs/{id}/decision"]
    shared_operations: ["all GET endpoints"]
