          assert:
            - "the first trigger returns 404 with error_id ERR_PROJECT_NOT_FOUND"
            - "the second trigger returns 404 with error_id ERR_OFFTAKER_NOT_FOUND, not ERR_PROJECT_NOT_FOUND - the error names the entity of the failing field"
            - "the third trigger returns 404 with error_id ERR_PRICING_NODE_NOT_FOUND"
            - "every error body follows the declared envelope: response_type error and data carrying error_id and message"
            - "GET /ppa/deals returns total_count 0 and GET /ppa/projects/${project_id} still reports contracted_mw 0.000, available_mw 100.000 and version 1, so no partial write survived any of the three refusals"

      - name: unknown_path_ids_return_not_found_for_each_owning_entity
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DEAL_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_ROUND_NOT_FOUND]
          - errors[ERR_CREDIT_SUPPORT_NOT_FOUND]
          - errors[ERR_CONDITION_PRECEDENT_NOT_FOUND]
          - errors[ERR_SETTLEMENT_PERIOD_NOT_FOUND]
          - errors[ERR_ATTRIBUTE_BATCH_NOT_FOUND]
          - errors[ERR_RISK_EVENT_NOT_FOUND]
          - validations.priority_4_ERR_<ENTITY>_NOT_FOUND
        distinguishing_aspect: |
          Eight sub-resource families are addressed by their own id at the top level,
          and each must resolve its own 404 before any deeper rule runs. The calls are
          deliberately otherwise-legal - permitted role, complete and well-typed
          payload, and for the credit-support post a genuinely fresh
          expected_deal_version - so the response cannot be blamed on priority 2 or 3,
          and the version being current proves the 404 also precedes the priority-9
          stale-version guard.
