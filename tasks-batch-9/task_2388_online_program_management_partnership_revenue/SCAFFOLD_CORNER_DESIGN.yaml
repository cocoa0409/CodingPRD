              as_user_id: "chair-1"
              captures: { e15: $.data.error_id }
          assert:
            - "response status == 422"
            - "${e15} == ERR_FACULTY_IP_OWNERSHIP_VIOLATION"
            - "Course.${cp_id}.design_status == FACULTY_REVIEW"

      - name: fee_schedule_on_a_revenue_share_partnership_is_rejected
        claim_type: violation_to_error
        grounds:
