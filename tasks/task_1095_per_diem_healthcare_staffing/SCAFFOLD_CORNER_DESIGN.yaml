  # =========================================================================
  # From Table 4 — Validations
  # =========================================================================
  - section: validations
    instances:
      - name: shift_duration_below_minimum_returns_duration_invalid
        claim_type: Violation → Error
        grounds:
          - validations[priority=56]
          - errors[ERR_SHIFT_DURATION_INVALID]
        distinguishing_aspect: "A 3-hour shift is below MIN_SHIFT_DURATION_HOURS (4.0), so creation fails with ERR_SHIFT_DURATION_INVALID (422)."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Sable with an RN rate card and an OPEN order, window 2026-06-08..2026-06-15."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Sable", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 2, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T07:00:00Z", scheduled_end: "2026-06-08T10:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SHIFT_DURATION_INVALID with HTTP 422"
            - "StaffingOrder.${ord_id}.shift_count == 0"

      - name: shift_outside_order_window_returns_error
        claim_type: Temporal validation
        grounds:
          - validations[priority=57]
          - errors[ERR_SHIFT_OUTSIDE_ORDER_WINDOW]
          - entities.StaffingOrder.fields.window_end
        distinguishing_aspect: "A shift ending 2026-06-16T19:00 sits past the order's window_end of 2026-06-15T00:00, so creation fails with ERR_SHIFT_OUTSIDE_ORDER_WINDOW (422) even though the 12-hour duration is legal."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Thistle with an RN rate card and an OPEN order, window 2026-06-08..2026-06-15."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Thistle", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 2, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-16T07:00:00Z", scheduled_end: "2026-06-16T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_SHIFT_OUTSIDE_ORDER_WINDOW with HTTP 422"
            - "StaffingOrder.${ord_id}.shift_count == 0"

      - name: headcount_exceeded_on_second_shift_returns_error
        claim_type: Aggregate validation
        grounds:
          - validations[priority=89]
          - errors[ERR_HEADCOUNT_EXCEEDED]
          - entities.StaffingOrder.fields.headcount
        distinguishing_aspect: "An order authorising headcount 1 already carries one shift, so a second non-overlapping shift is refused with ERR_HEADCOUNT_EXCEEDED (422) rather than ERR_UNIT_CAPACITY_EXCEEDED."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; facility Umber (unit_capacity 2) with an RN rate card and an order of headcount 1 already holding Shift 2026-06-08T07:00..19:00."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/facilities"
              payload: { name: "Umber", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /staffing/facilities/${fac_id}/rate-cards"
              payload: { specialty: "RN", base_pay_rate_cents_per_hour: 7500, effective_from: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /staffing/orders"
              payload: { facility_id: "${fac_id}", specialty: "RN", headcount: 1, urgency: "STANDARD", window_start: "2026-06-08T00:00:00Z", window_end: "2026-06-15T00:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-08T07:00:00Z", scheduled_end: "2026-06-08T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /staffing/orders/${ord_id}/shifts"
              payload: { scheduled_start: "2026-06-09T07:00:00Z", scheduled_end: "2026-06-09T19:00:00Z" }
              as: FacilityScheduler
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_HEADCOUNT_EXCEEDED with HTTP 422"
            - "${err} != ERR_UNIT_CAPACITY_EXCEEDED"
            - "StaffingOrder.${ord_id}.shift_count == 1"

      - name: duplicate_claim_on_same_shift_returns_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=85]
          - errors[ERR_DUPLICATE_CLAIM]
          - entities.Shift.fields.claim_count
        distinguishing_aspect: "A clinician who already holds a PENDING claim on a shift cannot claim it again; the second call returns ERR_DUPLICATE_CLAIM (409) and claim_count stays at 1."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z; clinician Sana Rhodes with a VERIFIED RN_LICENSE holds one PENDING claim on Shift 2026-06-08T07:00..19:00 at facility Vellum."
          setup_api_calls:
            - call: "POST /staffing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
