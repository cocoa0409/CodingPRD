            - call: "POST /eas/service-periods/${per1_id}/report"
              payload: { scheduled_departures: 104, completed_departures: 85, cancelled_carrier_departures: 15, cancelled_weather_departures: 4, seats_offered: 1615, passengers_enplaned: 580 }
              as: Carrier
