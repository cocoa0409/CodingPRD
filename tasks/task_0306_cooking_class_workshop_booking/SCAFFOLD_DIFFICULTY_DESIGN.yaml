  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: substitution_revert_conserves_booking_charge
        grounds:
          - state_machines.SubstitutionRequest.APPROVED_to_REVERTED
          - calculations.substitution_surcharge
          - entities.Booking.fields.charge_cents
        distinguishing_aspect: |
          Conserved quantity = Booking.charge_cents. Approving a substitution adds surcharge 720
          (delta 2400 * 0.05 * 6) lifting charge from 52380 to 53100; reverting subtracts exactly 720,
          returning charge_cents to its pre-approval value 52380. INVARIANT:
          charge_after_revert == charge_before_approve.
        test_recipe:
          setup:
            - "Member holds a CONFIRMED 6-seat ADVANCED booking (charge 52380) on a session with a CONTAINS_DAIRY ingredient line (unit 1850, qty 0.05); an APPROVED substitution (alt 4250) exists"
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef Y", email: "chef.y@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem H", email: "h@x.com" }
              as: StudioAdmin
              captures: { mem_h: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Cream", skill_level: "ADVANCED", base_price_cents: 8500, default_capacity: 6, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "ST14", event_type: "GROUP", start_at: "2026-10-05T14:00:00Z", end_at: "2026-10-05T16:00:00Z", planned_seats: 6 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "cream", qty_per_seat: 0.05, unit_cost_cents: 1850, dietary_tag: "CONTAINS_DAIRY" }
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { line_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_h}", seats_requested: 6 }
              as: Member
              as_user_id: "${mem_h}"
              captures: { bk_h: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_13: $.data.version }
            - call: "POST /culinary/bookings/${bk_h}/confirm"
              payload: { expected_session_version: "${occ_sv_13}" }
              as: Member
              as_user_id: "${mem_h}"
            - call: "POST /culinary/substitutions"
              payload: { booking_id: "${bk_h}", ingredient_line_id: "${line_id}", alternate_unit_cost_cents: 4250 }
              as: Member
              as_user_id: "${mem_h}"
              captures: { sub_id: $.data.id }
            - call: "POST /culinary/substitutions/${sub_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "GET /culinary/bookings/${bk_h}"
              payload: {}
              as: StudioAdmin
              captures: { charge_after_approve: $.data.charge_cents }
          trigger:
            - call: "POST /culinary/substitutions/${sub_id}/revert"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          assert:
            - "Booking.${bk_h}.charge_cents == 53100 after approve (charge_after_approve)"
            - "Booking.${bk_h}.charge_cents == 52380 after revert (conserved, equals pre-approval)"
            - "SubstitutionRequest.${sub_id}.status == REVERTED"

      - name: booking_cancel_conserves_gift_card_plus_wallet_value
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.payment_waterfall
          - calculations.cancellation_refund
          - entities.GiftCard.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity = (GiftCard.balance_cents + Member.wallet_credit_cents) total stored value
          (a different conserved quantity than Booking.charge_cents). A 168h-or-more cancel (100% tier)
          minus the 300 fee: a 9000 booking paid fully from a 9000 gift card, cancelled 200h before,
          refunds 8700 to wallet and reverses 8700 to the gift card balance. Net stored value moves from
          9000 (all in gift card pre-confirm) to 8700 (300 consumed by the fee). INVARIANT:
          gift_card_balance_after + wallet_after == 9000 - 300 == 8700.
        test_recipe:
          setup:
            - "Member owns a 9000 gift card; OPEN session INTERMEDIATE planned_seats=2; a CONFIRMED 1-seat booking (charge 9000) paid fully from the gift card; clock 200h before start"
