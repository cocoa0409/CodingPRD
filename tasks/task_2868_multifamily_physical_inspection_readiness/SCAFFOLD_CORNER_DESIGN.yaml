        excluded_because:
          difficulty_instance: non_linear_state_machine / work_order_rejected_verification_reopens_repair_dimension_then_passes
          rationale: "The REPAIRED/REJECTED -> OPEN/UNVERIFIED loop and its second pass are asserted end-to-end by the named §1.8 instance."

