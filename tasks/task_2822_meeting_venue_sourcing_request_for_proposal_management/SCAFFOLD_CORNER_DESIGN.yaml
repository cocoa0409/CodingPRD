    - name: revise_targets_only_an_open_counter_that_belongs_to_the_proposal
      claim_type: Every error code is triggerable
      grounds:
      - validations[priority=52]
      - validations[priority=10]
      - errors[ERR_COUNTER_NOT_OPEN]
      - errors[ERR_COUNTER_NOT_FOUND]
      - state_machines.NegotiationCounter.OPEN_to_ACCEPTED
      - state_machines.NegotiationCounter.OPEN_to_DECLINED_BY_VENUE
      - entities.NegotiationCounter.fields.resolution
      distinguishing_aspect: 'Rule 52 has two clauses reported under one code: after counter A has been ACCEPTED and a second counter B is open, revising against A returns HTTP 409 ERR_COUNTER_NOT_OPEN while an unknown counter id returns HTTP 404 ERR_COUNTER_NOT_FOUND from the earlier rule 10 - and a declining revise against B still returns 200, resolving it DECLINED_BY_VENUE without touching the quoted terms.'
