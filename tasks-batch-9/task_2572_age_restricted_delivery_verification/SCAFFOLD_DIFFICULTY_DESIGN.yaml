          Order): the pair SUBMITTED <-> REVISION_REQUESTED is traversed three times, and the
          fourth resubmission is refused with ERR_REVISION_LIMIT_REACHED because
          revision_round has reached MAX_REVISION_ROUNDS = 3, so the loop terminates on a
          counter rather than on a state.
