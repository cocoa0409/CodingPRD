      - name: admin_tier_ceiling_strict_less_than
        grounds:
          - calculations.admin_fee_resolution
          - global_constants.ADMIN_TIER_1_CEILING_CENTS
          - global_constants.ADMIN_TIER_1_BPS
          - global_constants.ADMIN_TIER_2_BPS
        distinguishing_aspect: |
          Tier ceilings are compared with a STRICT `<`, so a line whose gross_cents is exactly
          100000 falls into the cheaper tier 2 (fee 9000) while a line one cent smaller at 99999
          stays in tier 1 and pays MORE (fee 12000) — the smaller gross carries the larger fee,
          which no monotonic fee function can produce.
        test_recipe:
          setup:
            - "One EFFECTIVE WORLD/STUDENT schedule with revenue_share_bps 7000, per_subscriber_minimum_cents 500, statutory_floor_per_play_millicents 0, mechanical_share_bps 0 and performance_share_bps 10000, so the whole publishing slice becomes the performance slice."
