          trigger:
            - call: "POST /commission/_clock/set_current_utc"
              payload: { to_iso8601: "2028-08-01T00:00:00Z" }
              as: LicensingAnalyst
            - call: "GET /commission/licensees/${br_id}"
              payload: {}
              as: LicensingAnalyst
            - call: "POST /commission/compliance-sweeps"
              payload: {}
              as: LicensingAnalyst
          assert:
            - "the clock call returns 200 with current_utc == 2028-08-01T00:00:00Z"
            - "the read immediately after returns Licensee.${br_id}.license_status == ACTIVE with license_expires_at == 2028-07-31T00:00:00Z - already past, but not yet expired"
            - "Brokerage.${bkg_id}.supervision_posture is still COMPLIANT and affiliated_licensee_count is still 1 at that point"
            - "the sweep returns expired_licensee_count == 1 and only then is Licensee.${br_id}.license_status == EXPIRED"
            - "the expiry cascades into the posture: Brokerage.${bkg_id}.supervision_posture == FROZEN (the designated broker's license_status is EXPIRED) and affiliated_licensee_count == 0"
      - name: standard_crud_reads_and_writes_on_every_entity_family
        claim_type: standard_crud
        grounds:
          - endpoints["POST /commission/licensees"]
          - endpoints["GET /commission/licensees/{id}"]
          - endpoints["GET /commission/licensees"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / brokerage_activation_gated_on_an_open_escrow_trust_account_of_the_right_type
          rationale: "Creation, retrieval and listing are asserted by the §1.9 entities-section instances (licensee_creation_returns_201_with_a_generated_license_number_and_applicant_defaults, licensee_retrieval_returns_the_stored_row_with_recomputed_read_only_fields, licensee_listing_filters_by_status_and_paginates_with_default_limit_ten), and the named §1.8 instance additionally proves the create-then-read round trip on Brokerage and TrustAccount."
      - name: action_endpoint_preconditions_are_enforced_before_the_transition
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /commission/hearings/{id}/disposition"]
          - endpoints["POST /commission/trust-audits/{id}/disposition"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / trust_audit_remediation_verify_cycle_re_arms_before_manual_escalation_unlocks
          rationale: "The named §1.8 instance walks the audit disposition endpoint through every action, proving each precondition (including the remediation_round >= 2 gate on a manual ESCALATE) before the transition applies."
      - name: cross_reference_link_requires_both_sides_to_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /commission/course-completions"]
          - entities.CourseCompletion
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / course_completion_gated_on_both_provider_and_instructor_approval_states
          rationale: "The junction's three-way FK integrity is asserted by the §1.9 entities instances (child_rows_require_an_existing_parent_and_a_foreign_parent_is_rejected and course_completion_is_the_many_to_many_junction_of_licensee_instructor_and_provider), and the named §1.8 instance proves the instructor/provider pairing rule on the same endpoint."
      - name: computed_read_matches_the_declared_calculation
        claim_type: computed_read
        grounds:
          - endpoints["GET /commission/recovery-fund"]
          - entities.RecoveryFund.fields.balance_cents
        excluded_because:
          difficulty_instance: compensating_invariant / vacatur_restores_the_recovery_fund_identity_while_the_assessment_stays_spent
          rationale: "The named §1.8 instance reads the fund after every channel (appropriation, fine credit, award, assessment, clawback) and asserts the five-counter identity against balance_cents at each step."
      - name: conditional_action_is_allowed_only_under_its_declared_condition
        claim_type: conditional_action
        grounds:
          - endpoints["POST /commission/brokerages/{id}/activation"]
          - validations[priority=28]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / brokerage_activation_gated_on_an_open_escrow_trust_account_of_the_right_type
          rationale: "Activation is refused twice (no account, then a SECURITY_DEPOSIT account) and accepted only once an OPEN ESCROW account exists, in the named §1.8 instance."

  # Every error id in §1.6 is triggered somewhere across the two design files. The 45 error ids
  # already asserted by the §1.9 instances above (entities / state_machines / calculations /
  # validations / endpoints) and by the rbac and cross_cutting_complexity_layers sections below are
  # not restated here. This section carries the 16 error ids whose ONLY trigger site is a §1.8
  # difficulty instance, so that the triggerability sweep of the claim-extraction guide closes.
  - section: errors
    instances:
      - name: err_brokerage_posture_blocked_is_triggerable
        claim_type: error_triggerability
        grounds:
          - errors.ERR_BROKERAGE_POSTURE_BLOCKED
          - validations[priority=16]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / posture_safety_priority16_outranks_supervising_broker_referential_priority22
          rationale: "Raised at 409 by that instance when an affiliation is attempted into a FROZEN brokerage, and proven absent once the posture returns to RESTRICTED."
      - name: err_supervising_broker_ineligible_is_triggerable
