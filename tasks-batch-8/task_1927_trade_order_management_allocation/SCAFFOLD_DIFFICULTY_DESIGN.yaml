          assert:
            - "error_id == ERR_PLAN_NOT_POSTABLE (state, priority 6) — not ERR_COMMISSION_BUDGET_EXCEEDED (fiscal, priority 12)"
            - "AllocationPlan.${plan}.status remains PROPOSED; CommissionBudget.${b1}.accrued_commission_cents remains 0"

      - name: fill_record_safety_beats_temporal
        grounds:
          - validations[priority=8]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair (business_safety, business_temporal): a fill recorded on
          a HALTED security with executed_at before routed_at violates both
          gates; priority 8 safety (ERR_SECURITY_HALTED) must win over
          priority 10 temporal (ERR_FILL_BEFORE_ROUTE).
