  - section: cross_cutting_complexity_layers
    instances:
      - name: appraisal_finalize_stale_bottle_version_returns_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[appraisal-finalize-stale-bottle]", "errors[ERR_STALE_VERSION]", entities.Bottle.fields.version]
        distinguishing_aspect: "After a first finalize bumps Bottle.version 1->2, a second finalize still carrying expected_bottle_version 1 (the pre-bump value) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A STORED bottle (version captured at creation = 1) with two DRAFT appraisals; the first appraisal is finalized (bottle.version -> 2)."]
          setup_api_calls:
            - call: "POST /members"
              payload: { full_name: "Uma Occ", email: "uma@x.com", membership_tier: "PREMIUM" }
              as: CellarManager
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/activate"
              payload: {}
              as: CellarManager
            - call: "POST /lockers"
              payload: { label: "CN-15", size_tier: "MEDIUM", climate_zone: "RED", capacity_bottles: 3 }
              as: CellarManager
              captures: { lk_id: $.data.id }
            - call: "POST /lockers/${lk_id}/assign"
              payload: { member_id: "${m_id}" }
              as: CellarManager
            - call: "POST /bottles"
              payload: { locker_id: "${lk_id}", wine_name: "Version Cru", vintage_year: 2013, varietal: "Cabernet", format_ml: 750, drink_window_start_year: 2018, drink_window_end_year: 2045, provenance_status: "DOCUMENTED" }
              as: CellarMember
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /appraisals"
              payload: { bottle_id: "${b_id}", method: "MARKET_COMPARABLE", base_value_cents: 5000000 }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { ap1_id: $.data.id }
            - call: "POST /appraisals"
              payload: { bottle_id: "${b_id}", method: "REPLACEMENT_COST", base_value_cents: 5000000 }
              as: Appraiser
              as_user_id: "appraiser-alpha"
              captures: { ap2_id: $.data.id }
            - call: "POST /appraisals/${ap1_id}/finalize"
              payload: { expected_bottle_version: "${b_v}" }
              as: Appraiser
              as_user_id: "appraiser-beta"
          trigger:
            - call: "POST /appraisals/${ap2_id}/finalize"
              payload: { expected_bottle_version: "${b_v}" }
              as: Appraiser
              as_user_id: "appraiser-beta"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

