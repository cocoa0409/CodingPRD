            - "SettlementStatement.${st2_id}.due_date == '2026-10-31T00:00:00Z' (per2.end_at 2026-10-01 plus 30 days)"
            - "PartnerAgreement.${agr_id}.deferred_below_minimum_cents == 0 and outstanding_settlement_cents == 3600 after issuing the second statement"

