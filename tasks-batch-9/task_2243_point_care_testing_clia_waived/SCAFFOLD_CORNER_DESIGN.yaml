          - entities.Inspection.fields.issued_weight_total
        distinguishing_aspect: |
          Issuance is once-only and, crucially, NOT additive: the second issue
          call is a 409 and issued_weight_total stays 8.00 rather than doubling to
          16.00 - which would have tipped the site from RESTRICTED to SUSPENDED.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T08:00:00Z."
            - "Covered WAIVED site; one inspection with a single CONDITION_LEVEL finding (weight 8.00), already issued."
