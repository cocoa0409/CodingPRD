          trigger:
            - call: "POST /moves/${mv_id}/provider-mapping"
              payload: { utility_types: ["ELECTRIC"] }
              as: ComplianceOfficer
              captures: { e_map: $.data.error_id }
            - call: "PATCH /utility-providers/${prov_e_id}/status"
              payload: { provider_status: "SUSPENDED" }
              as: MoveOpsAgent
              captures: { e_prov: $.data.error_id }
            - call: "POST /moves/${mv_id}/provider-mapping"
