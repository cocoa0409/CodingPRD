            - "both AlarmPermit rows are still ACTIVE (term_end_at 2027-08-01 is far away) and both AlarmSystem rows are still PERMITTED"
            - "a second nightly run at the same clock leaves every field identical — late_penalty_cents stays 550, not 1100 — so the run is idempotent per clock day"
            - "each mutated invoice's version rose by exactly 1"

      - name: clock_set_moves_time_without_recomputing_any_entity
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/false-alarm-program/_clock/set_current_utc
          - state_machines.AlarmPermit.ACTIVE_to_RENEWAL_DUE
        distinguishing_aspect: "The clock endpoint is the test harness's only time control and it is declared side-effect free on entities: jumping from 2026-08-01 to 2027-08-16 (past term_end_at 2027-08-01, inside the 30-day grace) must leave AlarmPermit.status stored as ACTIVE with its version unchanged until a nightly run performs the transition — a stateful reconciliation hidden in the clock call would make every fixture non-deterministic."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; system 1 permitted, so AP-000001 is ACTIVE with term_end_at 2027-08-01T00:00:00Z and grace_through_at 2027-08-31T00:00:00Z."
