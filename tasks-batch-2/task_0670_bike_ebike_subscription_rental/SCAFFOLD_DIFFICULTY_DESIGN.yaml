  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rental_delivered_requires_delivery_completed
        grounds:
          - state_machines.RentalAgreement.RESERVED_to_DELIVERED
          - entities.Delivery.fields.status
        distinguishing_aspect: |
          RentalAgreement RESERVED->DELIVERED is gated by the linked INITIAL Delivery's status: the
          rental advances only when the Delivery is COMPLETED (Rental↔Delivery pair). Completing the
          delivery is what flips the rental; no other path reaches DELIVERED.
        test_recipe:
          setup:
            - "RESERVED rental with a SCHEDULED INITIAL delivery; rental not yet DELIVERED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 2 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
            - call: "POST /bikes"
              payload: { model_id: "${model_id}", serial_number: "S-1" }
              as: OpsAdmin
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "Sam", email: "sam@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { acct_id: $.data.id }
