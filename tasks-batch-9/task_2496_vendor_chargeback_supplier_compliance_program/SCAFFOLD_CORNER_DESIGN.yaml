      - name: corner_authoring_uniqueness_and_publish_readiness_codes_are_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_VENDOR_CODE_TAKEN
          - errors.ERR_GUIDE_HAS_NO_REQUIREMENTS
          - errors.ERR_REQUIREMENT_CODE_TAKEN
          - validations[priority=22]
          - validations[priority=23]
          - validations[priority=24]
        distinguishing_aspect: "Three authoring-time guards fire on their own rungs: a re-used vendor_code returns 409 ERR_VENDOR_CODE_TAKEN, publishing a requirement-less DRAFT guide returns 422 ERR_GUIDE_HAS_NO_REQUIREMENTS (and leaves the guide DRAFT so a later publish still works), and a requirement_code re-used WITHIN the same guide returns 409 ERR_REQUIREMENT_CODE_TAKEN without creating a second row."
