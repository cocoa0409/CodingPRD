          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "flood", event_date: "2026-09-01", payload_ref: "t2", idempotency_key: "k-t2" }
              as: SourceOperator
              as_user_id: "${src}"
            - call: "GET /vehicles/${veh}"
              as: Any
              captures: { act: $.data.active_record_count, sup: $.data.superseded_record_count, brand: $.data.canonical_brand }
          assert:
