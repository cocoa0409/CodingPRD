            - call: "POST /derail-devices"
              payload: { segment_id: "${seg_id}", device_type: "WHEEL_STOP", location_description: "End of track" }
              as: ShipperFacilityManager
              as_user_id: "shipper-user-1"
              captures: { dev_id: $.data.id }
