# =============================================================================
# Example: urban-renewal benchmark seed tables (v1)
# =============================================================================

scenario: |
  Urban renovation project management system. Manages large-scale renovation projects
  with phases, work orders, crew contracting, and community impact monitoring. Crews
  are contracted to work orders through a lifecycle of proposal, verification, scheduling,
  and completion. Considerations: role-based access (X-User-ID), budget management with
  provisional/final costs, specialization surcharges, hazardous work rate thresholds,
  community disruption index, crew conflict pairings, setup time buffers, certification
  requirements, optimistic concurrency, idempotency, batch operations, and project
  finalization with chronological cost replay.

domain_name: urban-renewal
api_prefix: /projects

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: UrbanRenewalProject
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: project_name, type: string, source: input, description: "Project name" }
      - { name: renovation_budget, type: number, source: input, description: "Total renovation budget" }
      - { name: budget_balance, type: number, source: computed, description: "Remaining budget = renovation_budget - committed_costs - incurred_costs" }
      - { name: community_disruption_index, type: number, source: computed, description: "Disruption score, starts at 0, increases with hazardous assignments" }
      - { name: status, type: enum, source: system, description: "PLANNING → IN_PROGRESS → FINAL_AUDIT_PENDING → READY_FOR_LEASING" }

  - name: RenovationPhase
    parent: UrbanRenewalProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Associated project ID" }
      - { name: name, type: string, source: input, description: "Phase name" }
      - { name: start_hour, type: integer, source: input, description: "Start hour (relative to project start)" }
      - { name: end_hour, type: integer, source: input, description: "End hour (must be > start_hour)" }
      - { name: status, type: enum, source: system, description: "PLANNING → READY_FOR_EXECUTION / COMPLETED / CANCELLED" }

  - name: WorkOrder
    parent: RenovationPhase
    common_fields: true
    fields:
      - { name: phase_id, type: string, source: system, description: "Associated phase ID" }
      - { name: project_id, type: string, source: system, description: "Associated project ID" }
      - { name: task_type, type: string, source: input, description: "Task type description" }
      - { name: required_specialization, type: enum, source: input, default: "GENERAL", description: "PLUMBING | ELECTRICAL | ASBESTOS_REMOVAL | GENERAL" }
      - { name: required_safety_clearance_level, type: integer, source: input, default: 1, description: "Minimum clearance level (>= 1)" }
      - { name: start_hour, type: integer, source: input, description: "Start hour" }
      - { name: end_hour, type: integer, source: input, description: "End hour (must be > start_hour)" }
      - { name: duration_hours, type: integer, source: computed, description: "= end_hour - start_hour" }
      - { name: status, type: enum, source: system, description: "PENDING → AWAITING_CONFIRMATION → CONTRACTED → COMPLETED / CANCELLED" }

  - name: RenovationCrew
    parent: UrbanRenewalProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Associated project ID" }
      - { name: crew_name, type: string, source: input, description: "Crew name" }
      - { name: company_name, type: string, source: input, description: "Company name" }
      - { name: hourly_rate, type: number, source: input, description: "Standard hourly rate" }
      - { name: crew_certifications, type: array, source: system, description: "List of certifications with id, specialization_name, clearance_level" }

  - name: CrewContract
    parent: UrbanRenewalProject
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "Associated project ID" }
      - { name: work_order_id, type: string, source: input, description: "Associated work order ID" }
      - { name: crew_id, type: string, source: input, description: "Associated crew ID" }
      - { name: permit_waiver_used, type: boolean, source: input, default: false, description: "Whether to bypass disruption threshold" }
      - { name: permit_waiver_penalty_applied, type: boolean, source: computed, description: "Whether waiver penalty (+75 points) was applied" }
      - { name: is_hazardous_pay_rate, type: boolean, source: computed, description: "Whether hazardous rate triggered (cumulative > 160 hours)" }
      - { name: provisional_cost, type: number, source: computed, description: "Provisional cost calculated at proposal time" }
      - { name: final_cost, type: number, source: computed, description: "Final cost calculated at finalization (chronological replay)" }
      - { name: status, type: enum, source: system, description: "PROPOSED → SPECIALIZATION_VERIFIED → SCHEDULED → COMPLETED / REJECTED / CANCELLED" }

  - name: CrewConflictPairing
    parent: UrbanRenewalProject
    common_fields: false  # has id + created_at only
    fields:
      - { name: project_id, type: string, source: system, description: "Associated project ID" }
      - { name: crew_id_1, type: string, source: input, description: "First crew in conflict pair" }
      - { name: crew_id_2, type: string, source: input, description: "Second crew in conflict pair" }
      - { name: reason, type: string, source: input, required: false, description: "Reason for conflict pairing" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: UrbanRenewalProject
    initial_state: PLANNING
    terminal_states: [READY_FOR_LEASING]
    transitions:
      - from: PLANNING
        to: IN_PROGRESS
        trigger: POST /projects/{projId}/begin-work
        actor: any
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: FINAL_AUDIT_PENDING
        trigger: POST /projects/{projId}/initiate-final-audit
        actor: any
        preconditions:
          - "No unresolved contracts (PROPOSED or SPECIALIZATION_VERIFIED) exist (ERR_UNRESOLVED_CONTRACTS_EXIST)"
        side_effects: []

      - from: FINAL_AUDIT_PENDING
        to: READY_FOR_LEASING
        trigger: POST /projects/{projId}/finalize-project
        actor: any
        preconditions:
          - "Sum of final_costs must not exceed renovation_budget (ERR_FINALIZATION_EXCEEDS_BUDGET)"
        side_effects:
          - "All SCHEDULED contracts: compute final_cost chronologically → COMPLETED"
          - "Associated work orders → COMPLETED"
          - "Phases with all work orders terminal → COMPLETED"
          - "budget_balance finalized"
          - "community_disruption_index finalized based on final hazard determination"

  - entity: RenovationPhase
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: READY_FOR_EXECUTION
        trigger: PUT /projects/{projId}/phases/{phaseId}
        actor: any
        preconditions:
          - "Project must be IN_PROGRESS"
          - "All work orders must be CONTRACTED (ERR_WORK_ORDERS_NOT_CONTRACTED)"
        side_effects: []

      - from: PLANNING
        to: CANCELLED
        trigger: PUT /projects/{projId}/phases/{phaseId}
        actor: any
        preconditions:
          - "Project must be IN_PROGRESS"
        side_effects:
          - "All work orders → CANCELLED"
          - "All associated non-terminal contracts → cascade cancel with refund"

      - from: READY_FOR_EXECUTION
        to: CANCELLED
        trigger: PUT /projects/{projId}/phases/{phaseId}
        actor: any
        preconditions:
          - "Project must be IN_PROGRESS"
        side_effects:
          - "Same as PLANNING → CANCELLED"

  - entity: WorkOrder
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: AWAITING_CONFIRMATION
        trigger: "system (automatic on contract proposal)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_CONFIRMATION
        to: CONTRACTED
        trigger: "system (automatic on contract schedule)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_CONFIRMATION
        to: PENDING
        trigger: "system (automatic on contract reject/cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONTRACTED
        to: PENDING
        trigger: "system (automatic on SCHEDULED contract cancel)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONTRACTED
        to: COMPLETED
        trigger: "system (automatic during finalize-project)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: "system (phase cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AWAITING_CONFIRMATION
        to: CANCELLED
        trigger: "system (phase cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: CONTRACTED
        to: CANCELLED
        trigger: "system (phase cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CrewContract
    initial_state: PROPOSED
    terminal_states: [COMPLETED, REJECTED, CANCELLED]
    transitions:
      - from: PROPOSED
        to: SPECIALIZATION_VERIFIED
        trigger: POST /projects/{projId}/contracts/{contractId}/specialization-verify
        actor: any
        preconditions: []
        side_effects: []

      - from: PROPOSED
        to: REJECTED
        trigger: POST /projects/{projId}/contracts/{contractId}/reject
        actor: any
        preconditions: []
        side_effects:
          - "Work order reverts to PENDING"
          - "Refund provisional_cost to budget_balance"
          - "Refund disruption_index penalties"

      - from: SPECIALIZATION_VERIFIED
        to: SCHEDULED
        trigger: POST /projects/{projId}/contracts/{contractId}/schedule
        actor: any
        preconditions:
          - "Work order must be AWAITING_CONFIRMATION (ERR_WORK_ORDER_NOT_AWAITING_CONFIRMATION)"
        side_effects:
          - "Work order → CONTRACTED"
          - "Recalculate cost at schedule time (replaces provisional)"
          - "Adjust budget_balance (refund old provisional, debit new)"
          - "is_hazardous_pay_rate and disruption_index may change"

      - from: PROPOSED
        to: CANCELLED
        trigger: POST /projects/{projId}/contracts/{contractId}/cancel
        actor: any
        preconditions: []
        side_effects:
          - "Work order reverts to PENDING"
          - "Refund provisional_cost to budget_balance"
          - "Refund disruption_index penalties"

      - from: SPECIALIZATION_VERIFIED
        to: CANCELLED
        trigger: POST /projects/{projId}/contracts/{contractId}/cancel
        actor: any
        preconditions: []
        side_effects:
          - "Work order reverts to PENDING"
          - "Refund provisional_cost to budget_balance"
          - "Refund disruption_index penalties"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /projects/{projId}/contracts/{contractId}/cancel
        actor: any
        preconditions: []
        side_effects:
          - "Work order reverts from CONTRACTED to PENDING"
          - "Refund provisional_cost to budget_balance"
          - "Refund disruption_index penalties"

      - from: SCHEDULED
        to: COMPLETED
        trigger: "system (automatic during finalize-project)"
        actor: system
        preconditions: []
        side_effects:
          - "Calculate final_cost (chronological order)"
          - "Move from committed to incurred ledger"
          - "Update community_disruption_index based on final hazard"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_hourly_rate
    trigger: "contract proposal and scheduling"
    algorithm: surcharge_stack
    formula: |
      1. Start with crew's hourly_rate
      2. Add specialization surcharge based on required_specialization:
         ASBESTOS_REMOVAL: +80% (multiply by 1.80)
         ELECTRICAL: +30% (multiply by 1.30)
         PLUMBING: +20% (multiply by 1.20)
         GENERAL: no surcharge (multiply by 1.00)
      3. Add safety clearance premium:
         +10% per clearance level above minimum (level 1)
         premium = (required_safety_clearance_level - 1) * 0.10 * base_rate
    note: "Surcharges are applied to the base hourly_rate"

  - name: provisional_cost
    trigger: "contract proposal (creation)"
    algorithm: forward_looking
    formula: |
      1. Calculate effective_hourly_rate with all surcharges
      2. Determine cumulative hours for the crew:
         Include all non-terminal (PROPOSED, SPECIALIZATION_VERIFIED, SCHEDULED) contracts
      3. Check if THRESHOLD exceeded:
         if cumulative_hours > THRESHOLD:
           excess = cumulative_hours - THRESHOLD
           if excess >= duration_hours:
             cost = duration_hours * effective_rate * MULTIPLIER
           else:
             normal_part = duration_hours - excess
             cost = normal_part * effective_rate + excess * effective_rate * MULTIPLIER
         else:
           cost = duration_hours * effective_rate
    constants:
      THRESHOLD: 160    # hours (20 full shifts)
      MULTIPLIER: 1.5   # hazardous duty rate
    precision: "2 decimal places, round_half_up"

  - name: schedule_time_cost
    trigger: "contract scheduling"
    algorithm: forward_looking
    formula: |
      Same as provisional_cost but recalculated at schedule time.
      The crew's cumulative hours at this moment determine the contract's committed cost.
      Replaces the provisional calculation.

  - name: final_cost
    trigger: "project finalization"
    algorithm: chronological
    formula: |
      1. Collect all SCHEDULED contracts for the crew
      2. Sort by work_order.start_hour ascending
      3. Break ties by ascending contract.id
      4. running_total = 0
      5. for each contract in sorted order:
           running_total += duration_hours
           if running_total > THRESHOLD:
             excess = running_total - THRESHOLD
             if excess >= duration_hours:
               final_cost = duration_hours * effective_rate * MULTIPLIER
             else:
               normal_part = duration_hours - excess
               final_cost = normal_part * effective_rate + excess * effective_rate * MULTIPLIER
           else:
             final_cost = duration_hours * effective_rate
    constants:
      THRESHOLD: 160
      MULTIPLIER: 1.5
    precision: "2 decimal places, round_half_up"
    key_insight: |
      Provisional cost (forward-looking, includes all active/pending) and final_cost
      (chronological, only scheduled) may produce different results.
      Tie-breaking by contract.id ensures deterministic ordering.

  - name: budget_balance_update
    trigger: "contract create, schedule, reject, cancel, finalize"
    algorithm: aggregation
    formula: |
      Create contract: budget_balance -= provisional_cost
      Schedule: budget_balance += old_provisional - new_scheduled_cost
      Reject/Cancel: budget_balance += provisional_cost (refund)
      Finalize: budget_balance = renovation_budget - sum(all final_costs)

  - name: community_disruption_index
    trigger: "contract create, schedule, reject, cancel"
    algorithm: aggregation
    formula: |
      Create contract:
        if is_hazardous_pay_rate: disruption_index += DISRUPTION_PENALTY
        if is_hazardous_pay_rate AND disruption_index (after penalty) > EVICTION_NOTICE_THRESHOLD:
          if NOT permit_waiver_used: reject with ERR_DISRUPTION_INDEX_THRESHOLD_BREACHED
          if permit_waiver_used: disruption_index += WAIVER_PENALTY
      Schedule: recalculate hazard status
        if was not hazardous but now is: disruption_index += DISRUPTION_PENALTY
        if was hazardous but now is not: disruption_index -= DISRUPTION_PENALTY
      Reject/Cancel: refund all previously assessed penalties
    constants:
      DISRUPTION_PENALTY: 25
      WAIVER_PENALTY: 75
      EVICTION_NOTICE_THRESHOLD: 100
    note: "Waiver penalty only applied if contract would actually breach the threshold without waiver"

  - name: setup_time_check
    trigger: "contract proposal"
    algorithm: time_gap
    formula: |
      Check against the crew's entire committed schedule
      (committed = PROPOSED, SPECIALIZATION_VERIFIED, SCHEDULED).
      For two work orders of different task_type on the same crew:
        gap = later.start_hour - earlier.end_hour
        if gap < SETUP_GAP:
          reject with ERR_SETUP_TIME_VIOLATION
      Same task_type does not require setup time (but double-booking still checked).
    constants:
      SETUP_GAP: 4  # half-shift = 4 hours

  - name: double_booking_check
    trigger: "contract proposal"
    algorithm: overlap
    formula: |
      Check against the crew's entire committed schedule
      (committed = PROPOSED, SPECIALIZATION_VERIFIED, SCHEDULED).
      A crew cannot be assigned to time-overlapping work orders.
      overlap = orderA.start < orderB.end AND orderB.start < orderA.end

  - name: crew_conflict_check
    trigger: "contract proposal"
    algorithm: pairing
    formula: |
      If two crews are marked as a conflict pairing:
        and one crew already has a non-terminal contract in a phase
        then the other crew cannot be assigned to a work order in the same phase.

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID header must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: all nested resource endpoints
    note: "Validate projId first, then phaseId, then orderId — return on first not found"

  - priority: 3
    category: state
    check: "Parent project must be in IN_PROGRESS state for child resource operations"
    error_id: ERR_PROJECT_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "Create/modify phases, work orders, contracts"

  - priority: 4
    category: concurrency
    check: "If-Match version must match (when provided)"
    error_id: ERR_PRECONDITION_FAILED_VERSION
    http_status: 412
    applies_to: "PUT phases, contract transitions (specialization-verify, schedule, reject, cancel)"

  - priority: 5
    category: state
    check: "Target resource must be in the correct state for the current operation"
    error_id: "varies (ERR_WORK_ORDER_NOT_PENDING, ERR_CONTRACT_NOT_PROPOSED, etc.)"
    http_status: 409
    applies_to: "State transition endpoints"

  - priority: 6
    category: business_certification
    check: "Crew certification must match work order's required_specialization and clearance level"
    error_id: ERR_CERTIFICATION_MISMATCH
    http_status: 400
    applies_to: "POST /contracts (proposal)"

  - priority: 7
    category: business_scheduling
    check: "Crew time conflict: different task_types require >= 4 hour setup gap; same task_type must not have time overlap"
    error_id: ERR_SETUP_TIME_VIOLATION
    http_status: 409
    applies_to: "POST /contracts (proposal)"

  - priority: 8
    category: business_conflict
    check: "Crew conflict pairing check (conflicting crews cannot both be in the same phase)"
    error_id: ERR_CREW_CONFLICT
    http_status: 409
    applies_to: "POST /contracts (proposal)"

  - priority: 9
    category: business_disruption
    check: "Would the disruption penalty cause disruption_index to exceed 100 threshold (and permit_waiver_used is not set)"
    error_id: ERR_DISRUPTION_INDEX_THRESHOLD_BREACHED
    http_status: 403
    applies_to: "POST /contracts (proposal)"

  - priority: 10
    category: business_fiscal
    check: "Budget must be sufficient (provisional_cost <= budget_balance)"
    error_id: ERR_INSUFFICIENT_BUDGET
    http_status: 402
    applies_to: "POST /contracts (proposal)"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: []
  pagination_defaults: {}

# =============================================================================
# Table 5: API Endpoint Table (29 endpoints)
# =============================================================================
endpoints:
  # --- UrbanRenewalProject ---
  - method: POST
    path: "/projects"
    description: "Create a new Urban Renewal Project"
    roles: [Any]
    code: 201
    input: [project_name, renovation_budget]
    output: UrbanRenewalProject
    side_effects: ["budget_balance initialized to renovation_budget, community_disruption_index to 0"]

  - method: GET
    path: "/projects"
    description: "List all Urban Renewal Projects"
    roles: [Any]
    code: 200
    input: ["include?"]
    output: "UrbanRenewalProject[]"
    side_effects: []

  - method: GET
    path: "/projects/{projId}"
    description: "Get a specific Urban Renewal Project"
    roles: [Any]
    code: 200
    input: []
    output: UrbanRenewalProject
    side_effects: []

  - method: POST
    path: "/projects/{projId}/begin-work"
    description: "Activate a project (PLANNING → IN_PROGRESS)"
    roles: [Any]
    code: 200
    input: []
    output: UrbanRenewalProject
    side_effects: ["status → IN_PROGRESS"]

  - method: POST
    path: "/projects/{projId}/initiate-final-audit"
    description: "Move project to FINAL_AUDIT_PENDING"
    roles: [Any]
    code: 200
    input: []
    output: UrbanRenewalProject
    side_effects: ["status → FINAL_AUDIT_PENDING"]

  - method: POST
    path: "/projects/{projId}/finalize-project"
    description: "Finalize costs and complete the project"
    roles: [Any]
    code: 200
    input: []
    output: UrbanRenewalProject
    side_effects:
      - "status → READY_FOR_LEASING"
      - "All SCHEDULED contracts → compute final_cost → COMPLETED"
      - "All CONTRACTED work orders → COMPLETED"
      - "Phases with all terminal work orders → COMPLETED"
      - "budget_balance finalized"
      - "community_disruption_index finalized"

  # --- RenovationPhase ---
  - method: POST
    path: "/projects/{projId}/phases"
    description: "Create a new Renovation Phase"
    roles: [Any]
    code: 201
    input: [name, start_hour, end_hour]
    output: RenovationPhase
    side_effects: []

  - method: GET
    path: "/projects/{projId}/phases"
    description: "List all Renovation Phases for a Project"
    roles: [Any]
    code: 200
    input: ["include?"]
    output: "RenovationPhase[]"
    side_effects: []

  - method: GET
    path: "/projects/{projId}/phases/{phaseId}"
    description: "Get a specific Renovation Phase"
    roles: [Any]
    code: 200
    input: []
    output: RenovationPhase
    side_effects: []

  - method: PUT
    path: "/projects/{projId}/phases/{phaseId}"
    description: "Update a Renovation Phase's status"
    roles: [Any]
    code: 200
    input: ["status"]
    output: RenovationPhase
    side_effects: ["State transition + possible cascade cancellation"]

  # --- WorkOrder ---
  - method: POST
    path: "/projects/{projId}/phases/{phaseId}/work-orders"
    description: "Create a new Work Order for a Phase"
    roles: [Any]
    code: 201
    input: ["task_type, required_specialization?, required_safety_clearance_level?, start_hour, end_hour"]
    output: WorkOrder
    side_effects: ["duration_hours auto-calculated"]

  - method: GET
    path: "/projects/{projId}/phases/{phaseId}/work-orders"
    description: "List all Work Orders for a Phase"
    roles: [Any]
    code: 200
    input: []
    output: "WorkOrder[]"
    side_effects: []

  - method: GET
    path: "/projects/{projId}/phases/{phaseId}/work-orders/{orderId}"
    description: "Get a specific Work Order"
    roles: [Any]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/projects/{projId}/phases/{phaseId}/work-orders/batch"
    description: "Create multiple Work Orders atomically"
    roles: [Any]
    code: 201
    input: ["items[]"]
    output: "WorkOrder[]"
    side_effects: ["Atomic: all succeed or none. ERR_BATCH_REJECTED on any failure."]

  # --- CrewContract ---
  - method: POST
    path: "/projects/{projId}/contracts"
    description: "Propose a new Crew Contract for a Work Order"
    roles: [Any]
    code: 201
    input: [work_order_id, crew_id, "permit_waiver_used?"]
    output: CrewContract
    side_effects:
      - "Calculate provisional_cost"
      - "Debit budget_balance"
      - "Calculate is_hazardous_pay_rate"
      - "Update community_disruption_index"
      - "Work order status → AWAITING_CONFIRMATION"
      - "Trigger full validation chain (certification, setup time, conflict, disruption, budget)"

  - method: GET
    path: "/projects/{projId}/contracts"
    description: "List all Crew Contracts for a Project"
    roles: [Any]
    code: 200
    input: ["include?"]
    output: "CrewContract[]"
    side_effects: []

  - method: GET
    path: "/projects/{projId}/contracts/{contractId}"
    description: "Get a specific Crew Contract"
    roles: [Any]
    code: 200
    input: []
    output: CrewContract
    side_effects: []

  - method: POST
    path: "/projects/{projId}/contracts/{contractId}/specialization-verify"
    description: "Move contract from PROPOSED to SPECIALIZATION_VERIFIED"
    roles: [Any]
    code: 200
    input: []
    output: CrewContract
    side_effects: ["status → SPECIALIZATION_VERIFIED"]

  - method: POST
    path: "/projects/{projId}/contracts/{contractId}/schedule"
    description: "Schedule a SPECIALIZATION_VERIFIED contract"
    roles: [Any]
    code: 200
    input: []
    output: CrewContract
    side_effects:
      - "status → SCHEDULED"
      - "Work order → CONTRACTED"
      - "Recalculate cost at schedule time"
      - "Adjust budget_balance"
      - "is_hazardous_pay_rate and disruption_index may change"

  - method: POST
    path: "/projects/{projId}/contracts/{contractId}/reject"
    description: "Reject a PROPOSED Crew Contract"
    roles: [Any]
    code: 200
    input: []
    output: CrewContract
    side_effects:
      - "status → REJECTED"
      - "Work order reverts to PENDING"
      - "Refund provisional_cost to budget_balance"
      - "Refund disruption_index penalties"

  - method: POST
    path: "/projects/{projId}/contracts/{contractId}/cancel"
    description: "Cancel a Crew Contract"
    roles: [Any]
    code: 200
    input: []
    output: CrewContract
    side_effects:
      - "status → CANCELLED"
      - "Work order reverts to PENDING (from CONTRACTED if SCHEDULED)"
      - "Refund provisional_cost to budget_balance"
      - "Refund disruption_index penalties"

  - method: POST
    path: "/projects/{projId}/contracts/batch"
    description: "Create multiple Crew Contracts atomically"
    roles: [Any]
    code: 201
    input: ["items[]"]
    output: "CrewContract[]"
    side_effects: ["Atomic: all succeed or none. ERR_BATCH_REJECTED on any failure."]

  # --- RenovationCrew ---
  - method: POST
    path: "/projects/{projId}/crews"
    description: "Create a new Renovation Crew profile"
    roles: [Any]
    code: 201
    input: [crew_name, company_name, hourly_rate]
    output: RenovationCrew
    side_effects: ["crew_certifications initialized to empty array"]

  - method: GET
    path: "/projects/{projId}/crews"
    description: "List all Renovation Crews for a Project"
    roles: [Any]
    code: 200
    input: []
    output: "RenovationCrew[]"
    side_effects: []

  - method: GET
    path: "/projects/{projId}/crews/{crewId}"
    description: "Get a specific Renovation Crew profile"
    roles: [Any]
    code: 200
    input: []
    output: RenovationCrew
    side_effects: []

  - method: POST
    path: "/projects/{projId}/crews/{crewId}/certifications"
    description: "Add a certification to a Renovation Crew"
    roles: [Any]
    code: 200
    input: ["specialization_name (PLUMBING | ELECTRICAL | ASBESTOS_REMOVAL | GENERAL), clearance_level"]
    output: RenovationCrew
    side_effects: ["Certification added to crew_certifications array"]

  # --- CrewConflictPairing ---
  - method: POST
    path: "/projects/{projId}/crew-conflict-pairings"
    description: "Create a Crew Conflict Pairing"
    roles: [Any]
    code: 201
    input: ["crew_id_1, crew_id_2, reason?"]
    output: CrewConflictPairing
    side_effects: []

  - method: GET
    path: "/projects/{projId}/crew-conflict-pairings"
    description: "List all Crew Conflict Pairings for a Project"
    roles: [Any]
    code: 200
    input: []
    output: "CrewConflictPairing[]"
    side_effects: []

  - method: GET
    path: "/projects/{projId}/crew-conflict-pairings/{pairId}"
    description: "Get a specific Crew Conflict Pairing"
    roles: [Any]
    code: 200
    input: []
    output: CrewConflictPairing
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalogue (30 error codes)
# =============================================================================
errors:
  # --- Authentication ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID header is missing or invalid"

  # --- Request Validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "General request format error (missing required fields, type mismatch, etc.)"

  - id: ERR_INVALID_PHASE_HOURS
    http: 400
    condition: "Phase time parameters are invalid (non-integer, end <= start, negative, etc.)"

  - id: ERR_INVALID_WORK_ORDER_HOURS
    http: 400
    condition: "Work order time parameters are invalid (non-integer, end <= start, negative, etc.)"

  - id: ERR_SELF_PAIRING
    http: 400
    condition: "Cannot pair a crew with itself (crew_id_1 == crew_id_2)"

  # --- Resource Not Found ---
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "Project with given projId does not exist"

  - id: ERR_PHASE_NOT_FOUND
    http: 404
    condition: "Phase with given phaseId does not exist"

  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "Work order with given orderId does not exist"

  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "Crew with given crewId does not exist"

  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "Contract with given contractId does not exist"

  - id: ERR_PAIRING_NOT_FOUND
    http: 404
    condition: "Crew conflict pairing with given pairId does not exist"

  # --- Certification ---
  - id: ERR_CERTIFICATION_MISMATCH
    http: 400
    condition: "Crew does not hold the certification required by the work order"

  # --- Financial ---
  - id: ERR_INSUFFICIENT_BUDGET
    http: 402
    condition: "provisional_cost exceeds current budget_balance"

  - id: ERR_FINALIZATION_EXCEEDS_BUDGET
    http: 402
    condition: "Sum of all final_costs exceeds renovation_budget at finalization"

  # --- Disruption ---
  - id: ERR_DISRUPTION_INDEX_THRESHOLD_BREACHED
    http: 403
    condition: "New contract would cause community_disruption_index to exceed 100 threshold, and permit_waiver_used is not set"

  # --- State Constraints ---
  - id: ERR_PROJECT_NOT_IN_PLANNING
    http: 409
    condition: "Operation requires project to be in PLANNING state"

  - id: ERR_PROJECT_NOT_IN_PROGRESS
    http: 409
    condition: "Operation requires project to be in IN_PROGRESS state"

  - id: ERR_WORK_ORDER_NOT_PENDING
    http: 409
    condition: "Work order must be in PENDING state to create a contract"

  - id: ERR_SETUP_TIME_VIOLATION
    http: 409
    condition: "Crew time conflict: insufficient setup gap between different types, or same-type time overlap (double-booking)"

  - id: ERR_CREW_CONFLICT
    http: 409
    condition: "Conflicting crews cannot both have non-terminal contracts in the same phase"

  - id: ERR_CONTRACT_NOT_PROPOSED
    http: 409
    condition: "Contract must be in PROPOSED state for specialization-verify or reject"

  - id: ERR_CONTRACT_NOT_SPECIALIZATION_VERIFIED
    http: 409
    condition: "Contract must be in SPECIALIZATION_VERIFIED state for schedule"

  - id: ERR_WORK_ORDER_NOT_AWAITING_CONFIRMATION
    http: 409
    condition: "Work order must be in AWAITING_CONFIRMATION state for contract scheduling"

  - id: ERR_ILLEGAL_PHASE_STATE_TRANSITION
    http: 409
    condition: "Phase state transition is invalid"

  - id: ERR_WORK_ORDERS_NOT_CONTRACTED
    http: 409
    condition: "Not all work orders are CONTRACTED when transitioning phase to READY_FOR_EXECUTION"

  - id: ERR_CONTRACT_NOT_CANCELLABLE
    http: 409
    condition: "Contract must be in a cancellable state (PROPOSED, SPECIALIZATION_VERIFIED, or SCHEDULED)"

  - id: ERR_PROJECT_NOT_READY_FOR_FINALIZATION
    http: 409
    condition: "finalize-project requires project to be in FINAL_AUDIT_PENDING state"

  - id: ERR_UNRESOLVED_CONTRACTS_EXIST
    http: 409
    condition: "Unresolved contracts exist (PROPOSED or SPECIALIZATION_VERIFIED) when initiating final audit"

  # --- Batch ---
  - id: ERR_BATCH_REJECTED
    http: 409
    condition: "Batch operation failed validation; no items created"

  # --- Concurrency ---
  - id: ERR_PRECONDITION_FAILED_VERSION
    http: 412
    condition: "If-Match version does not match server's current version"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Any
    description: "All authenticated users (identified by X-User-ID) can perform all operations"
    shared_operations:
      - "POST /projects — Create project"
      - "GET /projects — List projects"
      - "GET /projects/{projId} — Get project"
      - "POST .../begin-work — Activate project"
      - "POST .../initiate-final-audit — Initiate final audit"
      - "POST .../finalize-project — Finalize project"
      - "POST .../phases — Create phase"
      - "GET .../phases — List phases"
      - "GET .../phases/{phaseId} — Get phase"
      - "PUT .../phases/{phaseId} — Update phase status"
      - "POST .../work-orders — Create work order"
      - "GET .../work-orders — List work orders"
      - "GET .../work-orders/{orderId} — Get work order"
      - "POST .../work-orders/batch — Batch create work orders"
      - "POST .../contracts — Create contract"
      - "GET .../contracts — List contracts"
      - "GET .../contracts/{contractId} — Get contract"
      - "POST .../contracts/{contractId}/specialization-verify — Verify specialization"
      - "POST .../contracts/{contractId}/schedule — Schedule contract"
      - "POST .../contracts/{contractId}/reject — Reject contract"
      - "POST .../contracts/{contractId}/cancel — Cancel contract"
      - "POST .../contracts/batch — Batch create contracts"
      - "POST .../crews — Create crew"
      - "GET .../crews — List crews"
      - "GET .../crews/{crewId} — Get crew"
      - "POST .../crews/{crewId}/certifications — Add certification"
      - "POST .../crew-conflict-pairings — Create pairing"
      - "GET .../crew-conflict-pairings — List pairings"
      - "GET .../crew-conflict-pairings/{pairId} — Get pairing"
