              captures: { e_wo: $.data.error_id }
            - call: "GET /bottling-lines/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { e_line: $.data.error_id }
            - call: "GET /bottling-runs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { e_run: $.data.error_id }
            - call: "GET /dry-goods-items/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { e_item: $.data.error_id }
            - call: "GET /ttb-reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ComplianceOfficer
              as_user_id: "co-alice"
              captures: { e_ttb: $.data.error_id }
            - call: "GET /release-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ComplianceOfficer
