scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:
      - name: create_contract_minimal_required_fields_returns_201
        claim_type: Creation
        grounds: [entities.ServiceContract]
        distinguishing_aspect: "POST /aquatics/contracts with all required fields returns 201, status DRAFT, version 1, account_balance_cents 0, alive_livestock_count 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Acme", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id, st: $.data.status }
          assert:
            - "response code == 201"
            - "ServiceContract.status == DRAFT"
            - "ServiceContract.version == 1"
            - "ServiceContract.account_balance_cents == 0"
            - "ServiceContract.alive_livestock_count == 0"

      - name: create_contract_missing_service_tier_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.ServiceContract.fields.service_tier", "validations[priority=16]"]
        distinguishing_aspect: "Omitting required service_tier on contract create returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Acme", customer_user_id: "owner-1", route_day: "MON" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_contract_bad_service_tier_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.ServiceContract.fields.service_tier", "validations[priority=16]"]
        distinguishing_aspect: "service_tier outside {BASIC,PLUS,PREMIUM} (e.g. GOLD) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Acme", customer_user_id: "owner-1", service_tier: "GOLD", route_day: "MON" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_contract_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["entities.ServiceContract", "validations[priority=4]"]
        distinguishing_aspect: "GET /aquatics/contracts/{id} with a random UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /aquatics/contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: create_system_default_substrate_displacement_zero
        claim_type: Defaults
        grounds: [entities.SystemProfile.fields.substrate_displacement_pct]
        distinguishing_aspect: "Omitting substrate_displacement_pct on system create defaults it to 0.0 and status PROVISIONING, bioload_index 0.0, stocking_posture NORMAL."
        test_recipe:
          setup: ["A DRAFT contract."]
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Acme", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "Tank", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { disp: $.data.substrate_displacement_pct, st: $.data.status }
          assert:
            - "SystemProfile.substrate_displacement_pct == 0.0"
            - "SystemProfile.status == PROVISIONING"
            - "SystemProfile.bioload_index == 0.0"
            - "SystemProfile.stocking_posture == NORMAL"

      - name: system_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.SystemProfile.fields.bioload_index, entities.SystemProfile.fields.stocking_posture]
        distinguishing_aspect: "bioload_index/stocking_posture are computed; client-supplied values in the body are ignored (not declared in input), system stays bioload 0.0 NORMAL with no livestock."
        test_recipe:
          setup: ["A DRAFT contract."]
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "Acme", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "Tank", system_kind: "REEF", nominal_volume_l: 500, substrate_displacement_pct: 0.2 }
              as: AccountManager
              captures: { idx: $.data.bioload_index }
          assert:
            - "SystemProfile.bioload_index == 0.0 (no alive livestock yet)"
            - "SystemProfile.stocking_posture == NORMAL"

      - name: system_create_nonexistent_contract_returns_not_found
        claim_type: Parent Relationships
        grounds: ["entities.SystemProfile.fields.contract_id", "validations[priority=4]"]
        distinguishing_aspect: "Creating a system under a non-existent contract_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /aquatics/systems"
              payload: { contract_id: "00000000-0000-4000-8000-000000000000", label: "T", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: watertest_immutable_entity_no_version_field
        claim_type: Immutability
        grounds: [entities.WaterTest]
        distinguishing_aspect: "WaterTest has common_fields:false — it carries id and created_at but no version field and no update endpoint."
        test_recipe:
          setup: ["An ACTIVE system with an IN_PROGRESS visit."]
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "T" }
              as: Dispatcher
              captures: { tid: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "T", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { sid: $.data.id }
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${sid}/commission"
              payload: {}
              as: AccountManager
              captures: { sv: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${sid}", technician_id: "${tid}", scheduled_start: "2026-02-20T09:00:00Z", scheduled_end: "2026-02-20T10:00:00Z", expected_system_version: "${sv}" }
              as: Dispatcher
              captures: { vid: $.data.id }
            - call: "POST /aquatics/visits/${vid}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/visits/${vid}/water-tests"
              payload: { parameter: "PH", measured_value: 7.0, target_value: 8.0, product_strength_ppm_per_ml: 50 }
              as: FieldTech
              as_user_id: "tech-1"
              captures: { wid: $.data.id }
          assert:
            - "response code == 201 and WaterTest.id present"
            - "WaterTest response carries no version field"

  # =========================================================================
  - section: state_machines
    instances:
      - name: activate_draft_contract_with_no_system_returns_invalid
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ServiceContract.DRAFT_to_ACTIVE", "errors[ERR_NO_SYSTEM_ON_CONTRACT]"]
        distinguishing_aspect: "Activating a DRAFT contract with zero SystemProfiles returns ERR_NO_SYSTEM_ON_CONTRACT (422)."
        test_recipe:
          setup: ["A DRAFT contract with no systems."]
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_SYSTEM_ON_CONTRACT"

      - name: cancel_completed_visit_invalid_transition
        claim_type: Invalid Transitions
        grounds: ["state_machines.ServiceVisit", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED visit (cancel is only defined from SCHEDULED) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A COMPLETED visit."]
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "T" }
              as: Dispatcher
              captures: { tid: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "T", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { sid: $.data.id }
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${sid}/commission"
              payload: {}
              as: AccountManager
              captures: { sv: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${sid}", technician_id: "${tid}", scheduled_start: "2026-02-21T09:00:00Z", scheduled_end: "2026-02-21T10:00:00Z", expected_system_version: "${sv}" }
              as: Dispatcher
              captures: { vid: $.data.id }
            - call: "POST /aquatics/visits/${vid}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/visits/${vid}/complete"
              payload: { labor_minutes: 30 }
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/visits/${vid}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: new_visit_initial_state_scheduled
        claim_type: Initial State
        grounds: [state_machines.ServiceVisit, entities.ServiceVisit.fields.status]
        distinguishing_aspect: "A newly booked visit starts in SCHEDULED with total_cents 0 and invoice_id null."
        test_recipe:
          setup: ["An ACTIVE system and a tech."]
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "T" }
              as: Dispatcher
              captures: { tid: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "T", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { sid: $.data.id }
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${sid}/commission"
              payload: {}
              as: AccountManager
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /aquatics/visits"
              payload: { system_id: "${sid}", technician_id: "${tid}", scheduled_start: "2026-02-22T09:00:00Z", scheduled_end: "2026-02-22T10:00:00Z", expected_system_version: "${sv}" }
              as: Dispatcher
              captures: { st: $.data.status, tc: $.data.total_cents, inv: $.data.invoice_id }
          assert:
            - "ServiceVisit.status == SCHEDULED"
            - "ServiceVisit.total_cents == 0"
            - "ServiceVisit.invoice_id == null"

      - name: terminated_contract_no_further_transitions
        claim_type: Terminal State Lockdown
        grounds: ["state_machines.ServiceContract", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal TERMINATED, suspend/activate are rejected with ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A TERMINATED contract (activated, then terminated)."]
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "T", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { sid: $.data.id }
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/contracts/${cid}/terminate"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /aquatics/contracts/${cid}/suspend"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: commission_blocked_by_open_install
        claim_type: guarded transitions
        grounds: ["state_machines.SystemProfile.PROVISIONING_to_ACTIVE", "errors[ERR_OPEN_INSTALL_BLOCKS_COMMISSION]"]
        distinguishing_aspect: "Commissioning a PROVISIONING system that has a QUOTED InstallProject is rejected with ERR_OPEN_INSTALL_BLOCKS_COMMISSION (409)."
        test_recipe:
          setup: ["An ACTIVE contract; a PROVISIONING system with a QUOTED install."]
          setup_api_calls:
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "PLUS", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "Build", system_kind: "FRESHWATER", nominal_volume_l: 400 }
              as: AccountManager
              captures: { sid: $.data.id }
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/installs"
              payload: { contract_id: "${cid}", system_id: "${sid}", labor_estimate_cents: 40000, equipment_estimate_cents: 120000 }
              as: AccountManager
          trigger:
            - call: "POST /aquatics/systems/${sid}/commission"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OPEN_INSTALL_BLOCKS_COMMISSION"

      - name: reactivate_suspended_with_outstanding_balance_rejected
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ServiceContract.SUSPENDED_to_ACTIVE", "errors[ERR_BALANCE_OUTSTANDING]"]
        distinguishing_aspect: "Reactivating a SUSPENDED contract whose account_balance_cents > 0 is rejected with ERR_BALANCE_OUTSTANDING (422)."
        test_recipe:
          setup: ["A SUSPENDED contract with a positive balance (issued visit invoice, then suspended)."]
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "T" }
              as: Dispatcher
              captures: { tid: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "T", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { sid: $.data.id }
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${sid}/commission"
              payload: {}
              as: AccountManager
              captures: { sv: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${sid}", technician_id: "${tid}", scheduled_start: "2026-02-23T09:00:00Z", scheduled_end: "2026-02-23T10:00:00Z", expected_system_version: "${sv}" }
              as: Dispatcher
              captures: { vid: $.data.id }
            - call: "POST /aquatics/visits/${vid}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/visits/${vid}/complete"
              payload: { labor_minutes: 30 }
              as: FieldTech
              as_user_id: "tech-1"
            - call: "POST /aquatics/contracts/${cid}/suspend"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BALANCE_OUTSTANDING"

      - name: terminate_contract_blocked_by_in_flight_visit
        claim_type: Precondition Enforcement
        grounds: ["state_machines.ServiceContract.ACTIVE_to_TERMINATED", "errors[ERR_VISIT_IN_FLIGHT]"]
        distinguishing_aspect: "Terminating a contract with a SCHEDULED visit on one of its systems is rejected with ERR_VISIT_IN_FLIGHT (409)."
        test_recipe:
          setup: ["An ACTIVE contract with a SCHEDULED visit."]
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "T" }
              as: Dispatcher
              captures: { tid: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "T", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { sid: $.data.id }
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${sid}/commission"
              payload: {}
              as: AccountManager
              captures: { sv: $.data.version }
            - call: "POST /aquatics/visits"
              payload: { system_id: "${sid}", technician_id: "${tid}", scheduled_start: "2026-02-24T09:00:00Z", scheduled_end: "2026-02-24T10:00:00Z", expected_system_version: "${sv}" }
              as: Dispatcher
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /aquatics/contracts/${cid}/terminate"
              payload: {}
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VISIT_IN_FLIGHT"

      - name: cancel_emergency_visit_compensates_call_to_open
        claim_type: Compensation
        grounds: [state_machines.ServiceVisit.SCHEDULED_to_CANCELLED, state_machines.EmergencyCall, entities.EmergencyCall.fields.status]
        distinguishing_aspect: "Cancelling the SCHEDULED EMERGENCY visit reverts the linked EmergencyCall DISPATCHED->OPEN and clears dispatched_visit_id (compensation)."
        test_recipe:
          setup: ["A DISPATCHED emergency with its EMERGENCY visit SCHEDULED."]
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "T" }
              as: Dispatcher
              captures: { tid: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "T", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { sid: $.data.id }
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${sid}/commission"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/emergencies"
              payload: { system_id: "${sid}", severity: "HIGH", reported_at: "2026-02-25T08:00:00Z", trip_fee_cents: 5000 }
              as: Dispatcher
              captures: { eid: $.data.id }
            - call: "POST /aquatics/emergencies/${eid}/dispatch"
              payload: { technician_id: "${tid}", scheduled_start: "2026-02-25T09:00:00Z", scheduled_end: "2026-02-25T10:00:00Z" }
              as: Dispatcher
              captures: { evid: $.data.dispatched_visit_id }
          trigger:
            - call: "POST /aquatics/visits/${evid}/cancel"
              payload: {}
              as: Dispatcher
            - call: "GET /aquatics/emergencies/${eid}"
              payload: {}
              as: Dispatcher
              captures: { est: $.data.status, dv: $.data.dispatched_visit_id }
          assert:
            - "EmergencyCall.${eid}.status == OPEN after visit cancel"
            - "EmergencyCall.${eid}.dispatched_visit_id == null"

      - name: emergency_resolves_when_dispatched_visit_completes
        claim_type: Side Effect Execution
        grounds: [state_machines.ServiceVisit.IN_PROGRESS_to_COMPLETED, state_machines.EmergencyCall.DISPATCHED_to_RESOLVED]
        distinguishing_aspect: "Completing the dispatched EMERGENCY visit auto-transitions the linked EmergencyCall to RESOLVED."
        test_recipe:
          setup: ["A DISPATCHED emergency with its EMERGENCY visit started (IN_PROGRESS)."]
          setup_api_calls:
            - call: "POST /aquatics/technicians"
              payload: { tech_user_id: "tech-1", full_name: "T", certified_for_reef: false }
              as: Dispatcher
              captures: { tid: $.data.id }
            - call: "POST /aquatics/contracts"
              payload: { customer_name: "A", customer_user_id: "owner-1", service_tier: "BASIC", route_day: "MON" }
              as: AccountManager
              captures: { cid: $.data.id }
            - call: "POST /aquatics/systems"
              payload: { contract_id: "${cid}", label: "T", system_kind: "FRESHWATER", nominal_volume_l: 200 }
              as: AccountManager
              captures: { sid: $.data.id }
            - call: "POST /aquatics/contracts/${cid}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/systems/${sid}/commission"
              payload: {}
              as: AccountManager
            - call: "POST /aquatics/emergencies"
              payload: { system_id: "${sid}", severity: "HIGH", reported_at: "2026-02-26T08:00:00Z", trip_fee_cents: 5000 }
              as: Dispatcher
              captures: { eid: $.data.id }
            - call: "POST /aquatics/emergencies/${eid}/dispatch"
              payload: { technician_id: "${tid}", scheduled_start: "2026-02-26T09:00:00Z", scheduled_end: "2026-02-26T10:00:00Z" }
              as: Dispatcher
              captures: { evid: $.data.dispatched_visit_id }
            - call: "POST /aquatics/visits/${evid}/start"
              payload: {}
              as: FieldTech
              as_user_id: "tech-1"
          trigger:
            - call: "POST /aquatics/visits/${evid}/complete"
              payload: { labor_minutes: 40 }
              as: FieldTech
              as_user_id: "tech-1"
            - call: "GET /aquatics/emergencies/${eid}"
              payload: {}
              as: Dispatcher
              captures: { est: $.data.status }
          assert:
            - "EmergencyCall.${eid}.status == RESOLVED"

      - name: repair_diagnose_degrades_equipment_cross_entity
        claim_type: Cross-entity
        grounds: [state_machines.RepairOrder.REPORTED_to_DIAGNOSED, entities.Equipment.fields.status]
        distinguishing_aspect: "Diagnosing a REPORTED repair sets the linked Equipment.status to DEGRADED (cross-entity side effect)."
        test_recipe:
