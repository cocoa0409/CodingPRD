            - "trigger[3]: data.status == 'READY' and data.reschedule_count == 0 — cascade L4 fired"
            - "trigger[4]: HTTP 200 with data.status == 'PLANNED' and data.reschedule_count == 1 — READY cycles back to PLANNED, the machine is not one-way"

      - name: cyclic_reschedule_self_loop_accumulates_reschedule_count
        claim_type: cyclic
        grounds:
          - state_machines.BranchReopening.PLANNED_to_PLANNED
          - entities.BranchReopening.fields.reschedule_count
          - validations[priority=63]
        distinguishing_aspect: "The PLANNED -> PLANNED self-loop can be taken repeatedly: two reschedules leave the row at PLANNED with reschedule_count 2 and the newest window stored, and the row never blocks itself under the overlap screen."
        test_recipe:
          setup:
            - "Institution 61021 exists (no closure needed) with one PLANNED BranchReopening BR-9 for [2026-08-05T09:00:00Z, 2026-08-05T17:00:00Z]."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61021", legal_name: "Reschedule Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { rs_inst_id: $.data.id }
            - call: "POST /institutions/${rs_inst_id}/branch-reopenings"
              payload: { branch_code: "BR-9", reopen_window_start: "2026-08-05T09:00:00Z", reopen_window_end: "2026-08-05T17:00:00Z", staffing_headcount: 8 }
              as: ClosingManager
              captures: { rs_branch_id: $.data.id }
          trigger:
            - call: "POST /branch-reopenings/${rs_branch_id}/reschedule"
              payload: { reopen_window_start: "2026-08-06T09:00:00Z", reopen_window_end: "2026-08-06T17:00:00Z" }
              as: ClosingManager
            - call: "POST /branch-reopenings/${rs_branch_id}/reschedule"
              payload: { reopen_window_start: "2026-08-07T09:00:00Z", reopen_window_end: "2026-08-07T17:00:00Z" }
              as: ClosingManager
          assert:
            - "trigger[0]: HTTP 200 with data.status == 'PLANNED', data.reschedule_count == 1, data.reopen_window_start == '2026-08-06T09:00:00Z'"
            - "trigger[1]: HTTP 200 with data.status == 'PLANNED', data.reschedule_count == 2, data.reopen_window_start == '2026-08-07T09:00:00Z', data.reopen_window_end == '2026-08-07T17:00:00Z'"
            - "trigger[1]: data.reopened_at == null — a reschedule never reopens the branch"

      - name: terminal_state_lockdown_terminated_receivership_refuses_close_and_second_terminate
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Institution.terminal_states
          - validations[priority=41]
          - validations[priority=78]
          - errors[ERR_RECEIVERSHIP_NOT_TERMINABLE]
        distinguishing_aspect: "Once the institution reaches RECEIVERSHIP_TERMINATED no transition is available: close returns ERR_INSTITUTION_ALREADY_CLOSED (409) and a second terminate-receivership returns ERR_RECEIVERSHIP_NOT_TERMINABLE (409) because the status is no longer RESOLUTION_COMPLETE."
        test_recipe:
          setup:
            - "Institution 61022 is walked all the way to RECEIVERSHIP_TERMINATED with no bids at all: evaluate leaves conforming_bid_count 0, so award takes the empty-candidate branch (least_cost_status FAILED_ALL_BIDS, resolution_method DEPOSIT_PAYOFF, status RESOLUTION_COMPLETE) and terminate-receivership then succeeds because no dividend round is DECLARED and no account is HELD."
            - "baseline with no certified determination: insured_share_bps 0, subrogated 0, baseline 0 + 150000 * 1 = 150000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61022", legal_name: "Terminated Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { tt_inst_id: $.data.id }
            - call: "POST /institutions/${tt_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-TT-1", legal_name: "Nadia Rahman", depositor_type: "NATURAL_PERSON", contact_email: "nadia@example.com" }
              as: ClaimsAgent
              captures: { tt_dep_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${tt_inst_id}", primary_depositor_id: "${tt_dep_id}", account_number: "TT-0001", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { tt_acct_id: $.data.id }
            - call: "POST /institutions/${tt_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 1000000 }
              as: ClosingManager
              captures: { tt_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${tt_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${tt_inst_id}/close"
              as: ClosingManager
            - call: "POST /institutions/${tt_inst_id}/franchise-marketing"
              payload: { marketing_action: "OPEN", bid_deadline_at: "2026-08-10T00:00:00Z" }
              as: ResolutionAnalyst
            - call: "POST /institutions/${tt_inst_id}/least-cost-test/evaluate"
              payload: { test_variant: "RETENTION_ADJUSTED" }
              as: ResolutionAnalyst
            - call: "POST /institutions/${tt_inst_id}/least-cost-test/award"
              as: ResolutionAnalyst
            - call: "POST /institutions/${tt_inst_id}/terminate-receivership"
              as: ReceivershipTrustee
          trigger:
            - call: "POST /institutions/${tt_inst_id}/close"
              as: ClosingManager
              captures: { tt_error_id: "$.data.error_id" }
            - call: "POST /institutions/${tt_inst_id}/terminate-receivership"
              as: ReceivershipTrustee
              captures: { tt_error_id2: "$.data.error_id" }
            - call: "GET /institutions/${tt_inst_id}"
              as: ReceivershipTrustee
          assert:
            - "the setup award call returned least_cost_status == 'FAILED_ALL_BIDS', resolution_method == 'DEPOSIT_PAYOFF', conforming_bid_count == 0, liquidation_baseline_cents == 150000"
            - "trigger[0]: HTTP 409 with data.error_id == 'ERR_INSTITUTION_ALREADY_CLOSED'"
            - "trigger[1]: HTTP 409 with data.error_id == 'ERR_RECEIVERSHIP_NOT_TERMINABLE'"
            - "trigger[2]: data.status == 'RECEIVERSHIP_TERMINATED' — neither refused call changed anything"

      - name: guarded_transition_prepare_requires_closed_institution
        claim_type: guarded_transitions
        grounds:
          - state_machines.InsuranceDetermination.DRAFT_to_PREPARED.preconditions
          - validations[priority=46]
        excluded_because:
          difficulty_instance: prepare_blocked_until_institution_closed_in_receivership
          rationale: "The §1.8 cross_entity_state_dependency instance already drives prepare against a RESOLUTION_READY institution, asserts ERR_INSTITUTION_NOT_CLOSED (409), then closes the institution and replays the identical call to a 200, which is exactly this guarded-transition claim."

      - name: cross_entity_release_hold_requires_acknowledged_notice
        claim_type: cross-entity
        grounds:
          - state_machines.DepositAccount.HELD_to_RELEASED.preconditions
          - validations[priority=50]
        excluded_because:
          difficulty_instance: release_hold_blocked_until_depositor_acknowledges_notice
          rationale: "The §1.8 cross_entity_state_dependency instance already asserts ERR_NOTICE_NOT_ACKNOWLEDGED (409) while the depositor is at notice_status SENT and the same release-hold call succeeding after acknowledge-notice, including the certificate surviving untouched."

      - name: parallel_dimensions_of_deposit_account_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.DepositAccount
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: deposit_account_three_parallel_dimensions_advance_independently
          rationale: "The §1.8 non_linear_state_machine instance already walks insurance_status, hold_status and transition_status through their own transitions and asserts every intermediate combined triple, which subsumes the independence claim."

      - name: compensation_supersede_reverses_the_entire_certify_cascade
        claim_type: compensation
        grounds:
          - state_machines.InsuranceDetermination.CERTIFIED_to_SUPERSEDED.side_effects
          - endpoints[POST /insurance-determinations]
        excluded_because:
          difficulty_instance: supersede_determination_restores_insurance_conservation_identity
          rationale: "The §1.8 compensating_invariant instance already asserts C1-C4 in full — SUPERSEDED determination, CANCELLED certificate, released holds, reset notice fields and the restored institution aggregates — with the conservation identity re-checked before and after."

      - name: cyclic_determination_revision_loop_returns_to_prepared
        claim_type: cyclic
        grounds:
          - state_machines.InsuranceDetermination.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.InsuranceDetermination.REVISION_REQUESTED_to_PREPARED
        excluded_because:
          difficulty_instance: determination_two_revision_loops_then_certify_last_prepare_wins
          rationale: "The §1.8 non_linear_state_machine instance already takes the REVISION_REQUESTED loop twice, asserts revision_round after each loop and proves the last prepare's variant is the one certified, which covers the loop-back and the termination condition."

  # ===================================================================================
  - section: calculations
    instances:
      - name: readiness_gate_boundaries_score_9800_and_variance_25_both_pass
        claim_type: threshold
        grounds:
          - calculations.readiness_standardization_score.constants
          - state_machines.ReadinessSubmission.RECEIVED_to_STANDARDIZED.preconditions
        distinguishing_aspect: "Both gates are inclusive at their constant: score exactly 9800 (2 malformed of 100) and variance exactly 25 (2500 cents off a booked 1000000) still standardize, while a variance of 26 (2600 cents off) rejects — proving the comparisons are >= and <=, not > and <."
        test_recipe:
          setup:
            - "Institution 61023 holds one SINGLE account of 1000000 cents; its submission reports 1002500 with record_count 100 and malformed_record_count 2."
            - "score = floor((100 - 2) * 10000 / 100) = 9800, exactly READINESS_SCORE_FLOOR_BPS."
            - "variance = floor(abs(1002500 - 1000000) * 10000 / 1000000) = floor(25.0) = 25, exactly READINESS_VARIANCE_CEILING_BPS."
            - "Institution 61024 is identical except the submission reports 1002600, giving variance = floor(26.0) = 26."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61023", legal_name: "Boundary Pass Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { bp_inst1_id: $.data.id }
            - call: "POST /institutions/${bp_inst1_id}/depositor-records"
              payload: { tin_hash: "TIN-BP-1", legal_name: "Omar Haddad", depositor_type: "NATURAL_PERSON", contact_email: "omar@example.com" }
              as: ClaimsAgent
              captures: { bp_dep1_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${bp_inst1_id}", primary_depositor_id: "${bp_dep1_id}", account_number: "BP-0001", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${bp_inst1_id}/readiness-submissions"
              payload: { file_format: "VENDOR_CSV", record_count: 100, malformed_record_count: 2, reported_deposit_total_cents: 1002500 }
              as: ClosingManager
              captures: { bp_sub1_id: $.data.id }
            - call: "POST /institutions"
              payload: { cert_number: "61024", legal_name: "Boundary Fail Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { bp_inst2_id: $.data.id }
            - call: "POST /institutions/${bp_inst2_id}/depositor-records"
              payload: { tin_hash: "TIN-BP-2", legal_name: "Pia Lindqvist", depositor_type: "NATURAL_PERSON", contact_email: "pia@example.com" }
              as: ClaimsAgent
              captures: { bp_dep2_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${bp_inst2_id}", primary_depositor_id: "${bp_dep2_id}", account_number: "BP-0002", ownership_category: "SINGLE", balance_cents: 1000000, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
            - call: "POST /institutions/${bp_inst2_id}/readiness-submissions"
              payload: { file_format: "VENDOR_CSV", record_count: 100, malformed_record_count: 2, reported_deposit_total_cents: 1002600 }
              as: ClosingManager
              captures: { bp_sub2_id: $.data.id }
          trigger:
            - call: "POST /readiness-submissions/${bp_sub1_id}/standardize"
              as: ClosingManager
            - call: "POST /readiness-submissions/${bp_sub2_id}/standardize"
              as: ClosingManager
          assert:
            - "trigger[0]: data.standardization_score_bps == 9800, data.deposit_total_variance_bps == 25, data.status == 'STANDARDIZED', data.rejection_reason == null"
            - "trigger[1]: data.standardization_score_bps == 9800, data.deposit_total_variance_bps == 26, data.status == 'REJECTED', data.rejection_reason == 'TOTAL_VARIANCE_EXCEEDED'"
            - "GET /institutions/${bp_inst1_id} shows status == 'RESOLUTION_READY'; GET /institutions/${bp_inst2_id} still shows status == 'READINESS_COLLECTION'"

      - name: readiness_variance_branch_when_no_accounts_are_booked
        claim_type: correct_result
        grounds:
          - calculations.readiness_standardization_score
        distinguishing_aspect: "The booked_total == 0 branch is not a division by zero and not an automatic pass: reporting 0 against zero booked accounts gives variance 0 and standardizes, while reporting 1 cent against zero booked accounts gives the sentinel variance 10000 and rejects."
        test_recipe:
          setup:
            - "Institution 61025 has no DepositAccount rows at all and a submission reporting 0."
            - "Institution 61026 has no DepositAccount rows and a submission reporting 1."
            - "Both submissions carry record_count 5 / malformed_record_count 0, so score = floor(5 * 10000 / 5) = 10000 and the score gate never fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61025", legal_name: "Zero Booked Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { zb_inst1_id: $.data.id }
            - call: "POST /institutions/${zb_inst1_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 5, malformed_record_count: 0, reported_deposit_total_cents: 0 }
              as: ClosingManager
              captures: { zb_sub1_id: $.data.id }
            - call: "POST /institutions"
              payload: { cert_number: "61026", legal_name: "Zero Booked Mismatch Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { zb_inst2_id: $.data.id }
            - call: "POST /institutions/${zb_inst2_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 5, malformed_record_count: 0, reported_deposit_total_cents: 1 }
              as: ClosingManager
              captures: { zb_sub2_id: $.data.id }
          trigger:
            - call: "POST /readiness-submissions/${zb_sub1_id}/standardize"
              as: ClosingManager
            - call: "POST /readiness-submissions/${zb_sub2_id}/standardize"
              as: ClosingManager
          assert:
            - "trigger[0]: data.deposit_total_variance_bps == 0, data.status == 'STANDARDIZED' — and no error is raised despite the zero denominator"
            - "trigger[1]: data.deposit_total_variance_bps == 10000, data.status == 'REJECTED', data.rejection_reason == 'TOTAL_VARIANCE_EXCEEDED'"
            - "GET /institutions/${zb_inst1_id} shows readiness_standardized == true with total_deposit_balance_cents == 0 and depositor_record_count == 0"

      - name: joint_share_attribution_rounds_half_up_per_share
        claim_type: precision
        grounds:
          - calculations.depositor_insurance_determination.precision
          - calculations.depositor_insurance_determination.formula
          - validations[priority=62]
        distinguishing_aspect: "On a JOINT account of 1000001 cents split 3333 / 6667 bps the two CO_OWNER shares are rounded half-up independently: 333300.3333 truncates to 333300 while 666700.6667 rounds up to 666701, so the JOINT buckets are 333300 and 666701 rather than a proportional 333300 / 666700 or a pair of 333334 / 666667."
        test_recipe:
          setup:
            - "Institution 61027 is CLOSED_IN_RECEIVERSHIP with one JOINT account JT-0001 of 1000001 cents held by Quill (primary) and Rosa."
            - "Quill: round_half_up(1000001 * 3333 / 10000) = round_half_up(333300.3333) = 333300."
            - "Rosa: round_half_up(1000001 * 6667 / 10000) = round_half_up(666700.6667) = 666701."
            - "Shares sum to exactly 10000 bps so ERR_OWNERSHIP_SHARES_UNBALANCED does not fire; both buckets are far below SMDIA so insured == attributed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61027", legal_name: "Joint Rounding Bank", charter_state: "WA", book_asset_value_cents: 10000000, estimated_liquidation_recovery_cents: 4000000 }
              as: ClosingManager
              captures: { jr_inst_id: $.data.id }
            - call: "POST /institutions/${jr_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-JR-1", legal_name: "Quill Marsden", depositor_type: "NATURAL_PERSON", contact_email: "quill@example.com" }
              as: ClaimsAgent
              captures: { jr_dep1_id: $.data.id }
            - call: "POST /institutions/${jr_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-JR-2", legal_name: "Rosa Marsden", depositor_type: "NATURAL_PERSON", contact_email: "rosa@example.com" }
              as: ClaimsAgent
              captures: { jr_dep2_id: $.data.id }
            - call: "POST /deposit-accounts"
              payload: { institution_id: "${jr_inst_id}", primary_depositor_id: "${jr_dep1_id}", account_number: "JT-0001", ownership_category: "JOINT", balance_cents: 1000001, accrued_interest_cents: 0, opened_at: "2024-03-01T00:00:00Z" }
              as: ClaimsAgent
              captures: { jr_acct_id: $.data.id }
            - call: "POST /deposit-accounts/${jr_acct_id}/ownership-interests"
              payload: { depositor_record_id: "${jr_dep1_id}", interest_role: "CO_OWNER", designated_share_bps: 3333 }
              as: ClaimsAgent
            - call: "POST /deposit-accounts/${jr_acct_id}/ownership-interests"
              payload: { depositor_record_id: "${jr_dep2_id}", interest_role: "CO_OWNER", designated_share_bps: 6667 }
              as: ClaimsAgent
            - call: "POST /institutions/${jr_inst_id}/readiness-submissions"
              payload: { file_format: "FDIC_STANDARD_V2", record_count: 1, malformed_record_count: 0, reported_deposit_total_cents: 1000001 }
              as: ClosingManager
              captures: { jr_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${jr_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${jr_inst_id}/close"
              as: ClosingManager
            - call: "GET /depositor-records/${jr_dep1_id}"
              as: ClaimsAgent
              captures: { jr_dep1_ver: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${jr_dep1_id}", expected_depositor_record_version: "${jr_dep1_ver}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-D"
              captures: { jr_det1_id: $.data.id }
            - call: "GET /depositor-records/${jr_dep2_id}"
              as: ClaimsAgent
              captures: { jr_dep2_ver: $.data.version }
            - call: "POST /insurance-determinations"
              payload: { depositor_record_id: "${jr_dep2_id}", expected_depositor_record_version: "${jr_dep2_ver}" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-D"
              captures: { jr_det2_id: $.data.id }
          trigger:
            - call: "POST /insurance-determinations/${jr_det1_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-D"
            - call: "POST /insurance-determinations/${jr_det2_id}/prepare"
              payload: { method_variant: "AGGREGATE_BY_CATEGORY" }
              as: ClaimsAgent
              as_user_id: "U-AGENT-D"
          assert:
            - "trigger[0]: data.status == 'PREPARED', data.attributed_total_cents == 333300, data.insured_amount_cents == 333300, data.uninsured_amount_cents == 0, and category_breakdown.JOINT.attributed_cents == 333300 with limit_cents == 25000000"
            - "trigger[1]: data.attributed_total_cents == 666701, data.insured_amount_cents == 666701, data.uninsured_amount_cents == 0, category_breakdown.JOINT.attributed_cents == 666701"
            - "the two shares sum to 333300 + 666701 == 1000001, exactly the account's balance — no cent is created or lost"
            - "GET /depositor-records/${jr_dep1_id} shows attributed_total_cents == 333300 and GET /depositor-records/${jr_dep2_id} shows 666701"

      - name: revocable_trust_limit_scales_with_beneficiary_count_and_caps_at_five
        claim_type: constants_applied
        grounds:
          - calculations.depositor_insurance_determination.constants.REVOCABLE_BENEFICIARY_CAP
          - calculations.depositor_insurance_determination.formula
        distinguishing_aspect: "REVOCABLE_BENEFICIARY_CAP truncates the multiplier: six distinct BENEFICIARY rows still buy only min(6, 5) * 25000000 = 125000000 of coverage on a 150000000 trust, and a trust with zero BENEFICIARY rows takes the SMDIA * 1 floor rather than zero coverage."
        test_recipe:
          setup:
            - "Institution 61028 is CLOSED_IN_RECEIVERSHIP with two REVOCABLE_TRUST accounts: RT-0001 of 150000000 cents (grantor Sunil, six distinct beneficiaries at 1000 bps each) and RT-0002 of 30000000 cents (grantor Tanya, no beneficiary rows)."
            - "Sunil: limit = 25000000 * min(6, 5) = 125000000; attributed 150000000; insured 125000000; uninsured 150000000 - 125000000 = 25000000."
            - "Tanya: limit = 25000000 * 1 = 25000000; attributed 30000000; insured 25000000; uninsured 5000000."
            - "booked total = 180000000, reported 180000000, so variance is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ClosingManager
            - call: "POST /institutions"
              payload: { cert_number: "61028", legal_name: "Revocable Trust Bank", charter_state: "WA", book_asset_value_cents: 200000000, estimated_liquidation_recovery_cents: 90000000 }
              as: ClosingManager
              captures: { rt_inst_id: $.data.id }
            - call: "POST /institutions/${rt_inst_id}/depositor-records"
              payload: { tin_hash: "TIN-RT-G1", legal_name: "Sunil Rao", depositor_type: "NATURAL_PERSON", contact_email: "sunil@example.com" }
              as: ClaimsAgent
