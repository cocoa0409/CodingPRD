  # --- Logical Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock to an arbitrary ISO-8601 UTC instant. Server boots with logical clock = 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads exactly this default and MUST NOT fall back to real wall-clock time."
    roles: [ComplianceAuditor]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Logical clock advanced"
      - "On each advance: for every AVAILABLE lot with current_date > expires_on and quantity_on_hand > 0, transition lot to EXPIRED and zero quantity_on_hand; for PUBLIC_VFC lots recompute ProviderSite.accountability_balance_doses"

