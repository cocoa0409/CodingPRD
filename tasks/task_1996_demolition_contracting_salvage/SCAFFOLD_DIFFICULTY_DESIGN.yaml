            - "VERIFY before REPORT_DISCONNECTED rejected: ${err0} == ERR_INVALID_STATE (cross-dimension guard)"
            - "after REPORT_DISCONNECTED: ${d1} == REPORTED_DISCONNECTED and ${v1} == UNVERIFIED (only one dim moved)"
            - "after REJECT_VERIFICATION: ${d2} == REPORTED_DISCONNECTED and ${v2} == VERIFICATION_REJECTED (verification dim cycles, disconnect dim untouched)"
            - "after re-VERIFY + CONFIRM: ${d3} == REPORTED_DISCONNECTED and ${v3} == CONFIRMED"

      - name: project_work_posture_stop_resume_cycle
        grounds:
          - state_machines.Project
          - entities.Project.fields.work_posture
