  - rule_id: transitive_cascade
    instances:
      - name: lot_reject_deshedule_chain
        grounds:
          - state_machines.IngredientLot.RELEASED_to_REJECTED
          - state_machines.ProductionRun.SCHEDULED_to_PLANNED
          - entities.ProductionRun.fields.ingredient_readiness
        distinguishing_aspect: |
          Depth-3 cascade triggered by the lot-reject transition: lot REJECTED (link 1:
          reservation released off the run) -> run.ingredient_readiness recomputed
          READY->BLOCKED (link 2) -> SCHEDULED run auto-de-scheduled to PLANNED with its slot
          RELEASED (link 3) — each link caused by the previous, and a different trigger than
          the revision-approve cascade.
        test_recipe:
          setup:
            - "standard fixture with R1 (WHEY 40 + SYRUP 10, claims []) APPROVED; line L1; AG3 ACTIVE (MOQ 100)"
            - "run created (reserves WL 40kg + SL 10kg, readiness READY) and scheduled 2026-08-06T08:00-10:00Z; changeover NONE auto-VALIDATED; run SCHEDULED"
