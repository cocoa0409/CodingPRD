  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: contract_execute_depends_on_dd_approved
        grounds:
          - state_machines.VendorEngagement.transitions
          - state_machines.DueDiligencePackage.transitions
        distinguishing_aspect: |
          Entity pair = Contract × DueDiligencePackage. Contract execute is
          valid only when the engagement's most recent DD package is APPROVED
          with outcome IN {PASS, CONDITIONAL_PASS}. A DD package in
          UNDER_REVIEW blocks contract execute via engagement.lifecycle_status
