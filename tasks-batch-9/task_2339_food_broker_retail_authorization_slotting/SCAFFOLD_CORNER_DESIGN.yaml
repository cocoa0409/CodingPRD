              as_user_id: "${prin}"
              captures: { r0: $.data.void_rate_bps, p0: $.data.pending_store_count, cf0: $.data.counterfactual_void_rate_bps, lp0: $.data.latest_period_index }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth}", expected_authorization_version: "${av0}", period_index: 1, reported_store_count: 380, distributed_store_count: 340, reported_case_volume: 900 }
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "GET /authorizations/${auth}/voids-report"
              payload: {}
              as: PrincipalPortalUser
              as_user_id: "${prin}"
              captures: { r1: $.data.void_rate_bps, v1: $.data.void_store_count, p1: $.data.pending_store_count, cf1: $.data.counterfactual_void_rate_bps, ar1: $.data.is_at_risk }
            - call: "GET /authorizations/${auth}"
              payload: {}
              as: BrokerAccountManager
              captures: { av1: $.data.version }
            - call: "POST /distribution-snapshots"
              payload: { authorization_id: "${auth}", expected_authorization_version: "${av1}", period_index: 2, reported_store_count: 350, distributed_store_count: 290, reported_case_volume: 700 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { s2: $.data.id }
            - call: "GET /authorizations/${auth}/voids-report"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { r2: $.data.void_rate_bps, p2: $.data.pending_store_count, cf2: $.data.counterfactual_void_rate_bps, ar2: $.data.is_at_risk, lp2: $.data.latest_period_index }
            - call: "POST /distribution-snapshots/${s2}/reverse"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
            - call: "GET /authorizations/${auth}/voids-report"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { r3: $.data.void_rate_bps, p3: $.data.pending_store_count, cf3: $.data.counterfactual_void_rate_bps, ar3: $.data.is_at_risk, lp3: $.data.latest_period_index }
          assert:
            - "Call 1 (no ledger yet): ${lp0} == 0, reported_store_count == 0, distributed_store_count == 0, void_store_count == 0, ${r0} == 0 (REPORTED_BASIS divides by a zero reported count), ${p0} == 400, and ${cf0} == 10000 — the counterfactual STORE_COUNT_BASIS treats all 400 unreported stores as voids"
            - "The report echoes void_rate_basis REPORTED_BASIS, counterfactual_basis STORE_COUNT_BASIS, at_risk_void_rate_bps 1500, upc 011111000001 and retailer_id ${ret}"
            - "Call 3: ${v1} == 40, ${r1} == 1052 == floor(40*10000/380), ${p1} == 20 == 400-340-40, ${cf1} == 1500 == floor(60*10000/400), ${ar1} == false — the counterfactual sits exactly on the threshold while the pinned basis does not"
            - "Call 6: ${lp2} == 2, void_store_count == 60, ${r2} == 1714 == floor(60*10000/350), ${p2} == 50, ${cf2} == 2750 == floor(110*10000/400), ${ar2} == true, and Authorization.${auth}.authorization_state == AT_RISK"
            - "Call 8 after the reversal: ${lp3} == 1, ${r3} == 1052, ${p3} == 20, ${cf3} == 1500, ${ar3} == false and authorization_state is back to AUTHORIZED — the report reads the latest LIVE posting, not the highest period ever posted"
            - "The report never mutates anything: Authorization.${auth}.version is identical before and after every voids-report call"

      - name: clock_endpoint_defaults_to_the_declared_epoch_and_moves_both_ways
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - validations.v-review-submission-window
        distinguishing_aspect: |
          Two claims that no other test can make: the server's clock reads exactly
          2026-08-01T00:00:00Z before any set call (so a deadline of
          2026-08-01T00:00:00Z is already closed while 00:00:01Z is still open —
          a wall-clock implementation fails the second half), and the clock is
          free-running in both directions, so rewinding it re-opens a window that
          had closed.
        test_recipe:
          setup:
            - "NOTHING is set up first — the very first call of the test must be a review creation, so that no clock call has happened when the window is evaluated."
            - "Retailer BIGMART; three reviews in three different categories so the blackout rule never interferes."
          setup_api_calls:
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "FROZEN_SNACKS", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-01T00:00:00Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev_a: $.data.id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "DAIRY", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-01T00:00:01Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev_b: $.data.id }
            - call: "POST /category-reviews"
              payload: { retailer_id: "${ret}", category_code: "BEVERAGE", review_window_start: "2026-09-01", review_window_end: "2026-09-15", submission_deadline: "2026-08-01T00:00:02Z", new_item_slots: 2 }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { rev_c: $.data.id }
          trigger:
            - call: "POST /category-reviews/${rev_a}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e1: $.data.error_id }
            - call: "POST /category-reviews/${rev_b}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { st_b: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:02Z" }
              as: PrincipalPortalUser
              as_user_id: "u_portal_1"
              captures: { now1: $.data.current_utc }
            - call: "POST /category-reviews/${rev_c}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e2: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: BrokerAdmin
              captures: { now2: $.data.current_utc }
            - call: "POST /category-reviews/${rev_c}/open"
              payload: {}
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { st_c: $.data.status }
          assert:
            - "Call 1 returns 422 ERR_REVIEW_SUBMISSION_CLOSED — with no clock call at all, now == 2026-08-01T00:00:00Z is not strictly before the deadline 2026-08-01T00:00:00Z"
            - "Call 2 returns 200 with ${st_b} == OPEN — one second of head-room is enough, which is only true if the startup clock is exactly the declared epoch and not wall-clock time"
            - "Call 3 returns 200 with ${now1} == 2026-08-01T00:00:02Z and is permitted to EVERY role, including PrincipalPortalUser, which is read-only everywhere else"
            - "Call 4 returns 422 ERR_REVIEW_SUBMISSION_CLOSED — now == deadline again; CategoryReview.${rev_c}.status is still SCHEDULED"
            - "Call 5 rewinds the clock to ${now2} == 2026-07-01T00:00:00Z and call 6 then returns 200 with ${st_c} == OPEN — the same request that just failed now succeeds, so every temporal rule reads the logical clock at evaluation time and nothing is cached at creation time"

      - name: concede_settles_a_never_disputed_deduction_and_locks_it
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/deductions/{deductionId}/concede
          - state_machines.Deduction.settlement_state
          - errors.ERR_DEDUCTION_ALREADY_SETTLED
        distinguishing_aspect: |
          Concession is the one settlement path that needs no dispute, no
          substantiation and no audit approval: it is available directly from
          dispute_state NOT_DISPUTED and leaves that dimension untouched while
          moving the money dimension to CONCEDED. Once settled, EVERY other
          settlement verb — dispute, concede again, approve, deny — is refused
          with the same 409, and the principal's open liability drops.
        test_recipe:
          setup:
            - "Retailer BIGMART; principal NWF with slotting_budget_cents 1000000; two SHORTAGE deductions of 800000 and 100000 dated 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 1000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 800000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { d1: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 100000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { d2: $.data.id }
            - call: "GET /principals/${prin}"
              payload: {}
              as: BrokerAdmin
              captures: { post0: $.data.credit_posture, ratio0: $.data.liability_ratio_bps }
          trigger:
            - call: "POST /deductions/${d1}/concede"
              payload: {}
              as: BrokerAccountManager
              as_user_id: "u_am_1"
              captures: { ss1: $.data.settlement_state, ds1: $.data.dispute_state, con1: $.data.conceded_cents, open1: $.data.open_cents, rec1: $.data.recovered_cents }
            - call: "GET /principals/${prin}"
              payload: {}
              as: BrokerAdmin
              captures: { post1: $.data.credit_posture, ratio1: $.data.liability_ratio_bps, od1: $.data.open_deduction_cents }
            - call: "POST /deductions/${d1}/concede"
              payload: {}
              as: BrokerAccountManager
              as_user_id: "u_am_1"
              captures: { e1: $.data.error_id }
            - call: "POST /deductions/${d1}/dispute"
              payload: { claim_amount_cents: 800000 }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
              captures: { e2: $.data.error_id }
            - call: "POST /deductions/${d1}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { e3: $.data.error_id }
            - call: "POST /deductions/${d1}/deny-recovery"
              payload: { denial_reason: "late" }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { e4: $.data.error_id }
            - call: "GET /deductions"
              payload: { principal_id: "${prin}", settlement_state: "CONCEDED" }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { c_first: "$.data[0].id" }
          assert:
            - "Before the concession ${post0} == RESTRICTED and ${ratio0} == 9000 == floor(900000*10000/1000000) — both deductions are open against a 1,000,000 budget"
            - "Call 1 returns 200 with ${ss1} == CONCEDED, ${con1} == 800000, ${rec1} == 0, ${open1} == 0 and ${ds1} == NOT_DISPUTED — the dispute dimension is untouched, so conceding is NOT a shortcut through the dispute state machine"
            - "Call 2: ${od1} == 100000 (only ${d2} is still open), ${ratio1} == 1000 and ${post1} == NORMAL — settling re-derives the principal's posture immediately"
            - "Calls 3-6 all return 409 ERR_DEDUCTION_ALREADY_SETTLED — concede, dispute, approve-recovery and deny-recovery share the settlement_state == OPEN precondition, and the settled deduction is inert; ${d1}'s conceded_cents stays 800000 after all four"
            - "Call 7 returns exactly one row with ${c_first} == ${d1} — the settlement_state filter reflects the new state immediately"

      - name: retailer_and_principal_crud_round_trip_with_patch_semantics
        claim_type: standard_crud
        grounds:
          - endpoints.POST_/retailers
          - endpoints.GET_/retailers/{retailerId}
          - endpoints.PATCH_/principals/{principalId}
          - entities.Principal
        distinguishing_aspect: |
          PATCH is a partial update: an omitted key must leave the stored value
          alone rather than nulling it, every accepted PATCH bumps version by
          exactly one, and because slotting_budget_cents is the denominator of
          liability_ratio_bps the PATCH must re-derive credit_posture in the same
          response. Neither entity has a delete endpoint, so nothing in this
          domain is ever removed.
        test_recipe:
          setup:
            - "Retailer BIGMART created with two non-default policy fields; principal NWF with slotting_budget_cents 1000000 and one open SHORTAGE deduction of 500000 (liability_ratio_bps 5000 → WATCH)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200, at_risk_void_rate_bps: 900, max_concurrent_demos: 1 }
              as: BrokerAdmin
              captures: { ret: $.data.id, rv0: $.data.version }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 1000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id, pv0: $.data.version }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 500000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { ded: $.data.id }
          trigger:
            - call: "GET /retailers/${ret}"
              payload: {}
              as: BrokerAccountManager
              captures: { rname: $.data.name, rthr: $.data.at_risk_void_rate_bps, rdemo: $.data.max_concurrent_demos, rwin: $.data.deduction_dispute_window_days, rv1: $.data.version }
            - call: "GET /retailers"
              payload: { chain_code: "BIGMART" }
              as: BrokerAccountManager
              captures: { l0: "$.data[0].id" }
            - call: "GET /principals/${prin}"
              payload: {}
              as: PrincipalPortalUser
              as_user_id: "${prin}"
              captures: { p_post: $.data.credit_posture, p_ratio: $.data.liability_ratio_bps, pv1: $.data.version }
            - call: "PATCH /principals/${prin}"
              payload: { name: "Northwind Foods Inc" }
              as: BrokerAdmin
              captures: { pn2: $.data.name, pb2: $.data.slotting_budget_cents, pv2: $.data.version, post2: $.data.credit_posture }
            - call: "PATCH /principals/${prin}"
              payload: { slotting_budget_cents: 500000 }
              as: BrokerAdmin
              captures: { pn3: $.data.name, pb3: $.data.slotting_budget_cents, pv3: $.data.version, post3: $.data.credit_posture, ratio3: $.data.liability_ratio_bps }
            - call: "GET /principals/${prin}"
              payload: {}
              as: BrokerAdmin
              captures: { pn4: $.data.name, pb4: $.data.slotting_budget_cents, pv4: $.data.version, post4: $.data.credit_posture }
          assert:
            - "Call 1 returns the stored row unchanged: ${rname} == Bigmart, ${rthr} == 900, ${rdemo} == 1, ${rwin} == 90 (the untouched default) and ${rv1} == ${rv0} == 1 — reads never bump the version"
            - "Call 2 returns exactly one row with ${l0} == ${ret}"
            - "Call 3: ${p_ratio} == 5000 and ${p_post} == WATCH; PrincipalPortalUser can read its own principal"
            - "Call 4 (name only): ${pn2} == 'Northwind Foods Inc', ${pb2} == 1000000 (the omitted key is NOT nulled), ${post2} == WATCH, ${pv2} == ${pv1} + 1"
            - "Call 5 (budget only): ${pn3} == 'Northwind Foods Inc' (still), ${pb3} == 500000, ${ratio3} == 10000 == floor(500000*10000/500000), ${post3} == RESTRICTED and ${pv3} == ${pv2} + 1 — halving the budget re-derives the posture in the PATCH response itself"
            - "Call 6 confirms persistence: ${pn4} == ${pn3}, ${pb4} == 500000, ${post4} == RESTRICTED, ${pv4} == ${pv3}"
            - "§1.5 declares no DELETE endpoint for any of the 12 entities, so neither retailer nor principal can be removed; deactivation happens only through POST /principals/{principalId}/status"

      - name: deduction_link_targets_must_exist_before_link_validity_is_judged
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/deductions
          - validations.v-path-existence
          - validations.v-deduction-links
          - errors.ERR_PROMOTION_NOT_FOUND
          - errors.ERR_DEDUCTION_NOT_FOUND
        distinguishing_aspect: |
          promotion_event_id and original_deduction_id are optional BODY foreign
          keys, so their existence check lives at priority 4 while the semantic
          link check lives at priority 10: an unknown id must yield 404, and only
          an existing-but-wrong target yields 422. The duplicate link is also
          scoped — same retailer AND same principal AND equal amount — so an
          equal-amount deduction of another principal is a 422, not a match.
        test_recipe:
          setup:
            - "Retailer BIGMART; principals NWF and SGF; deduction D1 = SHORTAGE 60000 for (BIGMART, NWF); deduction DX = SHORTAGE 60000 for (BIGMART, SGF)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p1: $.data.id }
            - call: "POST /principals"
              payload: { name: "Sunglow Frozen", code: "SGF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { p2: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${p1}", reason_code: "SHORTAGE", amount_cents: 60000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { d1: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${p2}", reason_code: "SHORTAGE", amount_cents: 60000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { dx: $.data.id }
          trigger:
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${p1}", reason_code: "PROMO_BILLBACK", amount_cents: 60000, deduction_date: "2026-08-01", promotion_event_id: "00000000-0000-4000-8000-000000000000" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e1: $.data.error_id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${p1}", reason_code: "DUPLICATE_BILLBACK", amount_cents: 60000, deduction_date: "2026-08-01", original_deduction_id: "00000000-0000-4000-8000-000000000000" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e2: $.data.error_id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${p1}", reason_code: "DUPLICATE_BILLBACK", amount_cents: 60000, deduction_date: "2026-08-01", original_deduction_id: "${dx}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { e3: $.data.error_id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${p1}", reason_code: "DUPLICATE_BILLBACK", amount_cents: 60000, deduction_date: "2026-08-01", original_deduction_id: "${d1}" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { d2: $.data.id, link: $.data.original_deduction_id }
            - call: "GET /deductions"
              payload: { original_deduction_id: "${d1}" }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { back: "$.data[0].id" }
            - call: "GET /deductions"
              payload: { principal_id: "${p1}", reason_code: "DUPLICATE_BILLBACK" }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { dup_first: "$.data[0].id" }
          assert:
            - "Call 1 returns 404 ERR_PROMOTION_NOT_FOUND — the unknown optional body FK is resolved at priority 4, before the priority-10 link rule could complain about anything else"
            - "Call 2 returns 404 ERR_DEDUCTION_NOT_FOUND for the unknown original_deduction_id"
            - "Call 3 returns 422 ERR_DUPLICATE_LINK_INVALID — ${dx} exists and has the same retailer and the same amount, but belongs to principal ${p2}; the link is scoped to (retailer_id, principal_id, amount_cents)"
            - "Call 4 returns 201 with ${link} == ${d1}; both deductions now count toward Principal ${p1}.open_deduction_cents (120000)"
            - "Call 5 returns exactly one row, ${back} == ${d2} — the self-referential link is reverse-reachable through the list filter"
            - "Call 6 returns exactly one row, ${dup_first} == ${d2}; ${d1} is a SHORTAGE and is excluded by the reason_code filter"

      - name: decide_is_all_or_nothing_across_the_awarded_item_set
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/category-reviews/{reviewId}/decide
          - validations.v-award-membership
          - state_machines.CategoryReview.LOCKED_to_DECIDED
        distinguishing_aspect: |
          decide is the only multi-entity write in the domain: it awards N items in
          one call, creating N authorizations and moving every presentation of the
          review. Its failure semantics are rollback, not partial success — one bad
          element in authorized_item_ids must leave ZERO authorizations, the review
          in LOCKED with slots_awarded 0, every presentation still SUBMITTED and the
          review version un-bumped, so the caller can retry with the same
          expected_review_version.
        test_recipe:
          setup:
            - "Retailer BIGMART; principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement; items I1 and I2 VALIDATED and listed on submitted presentation P1; item I3 VALIDATED but on no presentation."
            - "Review with new_item_slots 3 (so the slot bound never masks the membership error), locked at 2026-08-20, clock 2026-09-02, no slotting deal."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
