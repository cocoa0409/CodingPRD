  - rule_id: transitive_cascade
    instances:
      - name: delinquency_run_cascades_invoice_to_dues_axis_to_suspension_to_cancellation_to_waitlist_promotion
        grounds:
          - state_machines.DuesInvoice.OPEN_to_PAST_DUE
          - state_machines.Membership.dues_status.CURRENT_to_DELINQUENT
          - state_machines.Membership.membership_status.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.Reservation.WAITLISTED_to_CONFIRMED
          - calculations.dues_late_fee
          - calculations.waitlist_promotion
        distinguishing_aspect: |
          Depth-5 cascade triggered by POST /ops/dues-delinquency-run: the invoice going PAST_DUE is
          what advances dues_status to DELINQUENT, which is what suspends the membership, which is
          what cancels its CONFIRMED stay, which is what frees the single member-pool site, which is
          what promotes the other membership's WAITLISTED stay and debits that membership's ledger.
        test_recipe:
          setup:
            - "Logical clock at the 2026-08-01T00:00:00Z default while the fixtures are built"
            - "One OPEN CLASS_B park with 3 sites and 60% member allocation: exactly 1 member-pool site and 2 transient-pool sites"
            - "A transient public stay occupies one transient site on 2026-11-10..2026-11-12, so member overflow cannot borrow past the 1-site transient floor"
            - "Membership ALFA (PRESIDENT) holds the single member-pool site 2026-11-10 to 2026-11-13 and leaves its 59508-cent invoice unpaid"
            - "Membership BRAVO (PRESIDENT) requested the same nights, was WAITLISTED, and has paid its dues in full"
            - "Logical clock advanced to 2026-10-05, i.e. 35 days past ALFA's 2026-08-31 due date"
