            - "the 412 outranks the state rule: had the program still been UNDER_REVIEW, the stale version would still return ERR_STALE_FEE_PROGRAM_VERSION rather than ERR_FEE_PROGRAM_NOT_PUBLISHED, because priority 11 precedes priority 14"
            - "FeeProgram.${fp1}.version is unchanged at ${fp1_v_fresh} after both the rejected and the accepted profile create — creating a child profile does not write the parent program"

      - name: stale_property_version_on_fee_program_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[fee-program-create-stale-property]
          - validations[priority=10]
          - errors[ERR_STALE_PROPERTY_VERSION]
        excluded_because:
          difficulty_instance: stale_property_version_outranks_property_not_active_on_program_create
          rationale: "That §1.8 instance is exactly this rule's OCC test: it sends expected_property_version one behind the current value on POST /fee-programs, asserts the 412 ERR_STALE_PROPERTY_VERSION, proves the property write that advanced the version, and includes the correct-version control that succeeds."

      - name: require_remediation_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.RegulatorInquiry.RESPONSE_SUBMITTED_to_REMEDIATION_REQUIRED
        excluded_because:
          difficulty_instance: require_remediation_cascades_inquiry_to_profile_to_property_to_bookings
          rationale: "The §1.8 five_level_cascade instance walks the deepest chain in the scaffold in a single call and asserts the state at every level — inquiry, in-scope profiles, property posture and counters, affected bookings, and the recomputed exposure — which is the end-to-end claim this layer asks for."

      - name: substantiation_chain_ordering_is_observable_at_every_level
        claim_type: cascading_side_effects
        grounds:
          - state_machines.GuestComplaint.UNDER_INVESTIGATION_to_SUBSTANTIATED
        excluded_because:
          difficulty_instance: complaint_substantiation_cascades_complaint_to_booking_to_profile_to_property_to_sibling_booking
          rationale: "That §1.8 instance covers the ordering-sensitive half of this layer: the entitlement must be computed before the booking flips, the profile must be rescored before the property posture is re-derived, and a sibling booking on the same profile is shown to move only because of that ordering."

      - name: both_refund_variants_produce_their_declared_results
        claim_type: dual_variant_calculation
        grounds:
          - calculations.complaint_refund_entitlement.variants
        excluded_because:
          difficulty_instance: complaint_refund_full_fee_versus_disclosure_gap_differential
          rationale: "That §1.8 dual_variant_calculation instance runs both variants against the same folio and pins the delta: FULL_FEE_REFUND on the EXEMPT 2600-cent line yields 2600, DISCLOSURE_GAP_DIFFERENTIAL on the 8970-cent RESORT line against a disclosed 8972 yields a floored differential, and the independent tax rounding is what makes refund_B non-proportional to refund_A."

      - name: commission_tier_boundary_is_probed_on_both_sides
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.revenue_impact_roll_in
        excluded_because:
          difficulty_instance: roll_in_commission_tier_keyed_on_post_roll_in_adr_not_baseline
          rationale: "That §1.8 instance is the boundary probe for this layer: it builds a property whose baseline ADR sits in one commission tier and whose post-roll-in ADR crosses into the next, and asserts that the tier is selected from the modelled rate rather than the baseline."

