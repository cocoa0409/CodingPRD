              payload: { purchase_order_id: "${po_id}", quantity_shipped: 2, carrier_tracking_code: "OC-TRK-1", shipped_at: "2026-09-01T06:00:00Z", allocations: [{ listing_id: "${listing_id}", quantity: 2 }] }
