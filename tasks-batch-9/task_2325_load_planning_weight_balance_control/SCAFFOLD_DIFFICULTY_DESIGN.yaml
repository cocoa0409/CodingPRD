              as: LoadControlAdmin
              captures: { ob1: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "OC", kind: "CABIN_ZONE", arm_m: 22.900, max_weight_kg: 8000, running_load_limit_kg_per_m: 2000, length_m: 8.0, seat_capacity: 60 }
              as: LoadControlAdmin
              captures: { oc1: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "H5", kind: "HOLD", arm_m: 28.400, max_weight_kg: 1200, running_load_limit_kg_per_m: 500, length_m: 2.4, seat_capacity: 0 }
              as: LoadControlAdmin
