              payload: {}
              as: Producer
              as_user_id: "${prod_pv}"
          assert:
            - "${err_pv1} == ERR_DATA_ACCESS_DENIED with HTTP 403"
            - "${err_pv2} == ERR_DATA_ACCESS_DENIED with HTTP 403"
            - "The producer's own read returns 200 with data.id == ${an_pv}"
            - "The same read as ProgramAdmin returns 200"
            - "GET /animals?birth_premises_id=${ppv} as StateAnimalHealthOfficial returns 200 with an empty array (unreadable rows are dropped, not errored)"

      - name: stale_expected_premises_version_on_hold_create_returns_412
        claim_type: violation_to_error
        grounds: ["concurrency_rules[hold-order-create-stale-premises]", "validations[priority=9]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential hold creations: the first advances Premises.version, so the second - still carrying the version observed before it - is rejected with ERR_STALE_VERSION (412) even though its window neither overlaps nor sits in a cooldown."
        test_recipe:
          setup:
            - "Premises P is ACTIVE with no holds; the official records its version once and creates one hold, which increments the version."
          setup_api_calls:
            - call: "POST /producers"
              payload: { legal_name: "Occ Co", contact_email: "ops@occ.example", state_code: "MT" }
              as: ProgramAdmin
              as_user_id: "admin-reg"
              captures: { prod_oc: $.data.id }
            - call: "POST /premises"
              payload: { producer_id: "${prod_oc}", pin: "MTO0001", operation_type: "COW_CALF", state_code: "MT", capacity: 10 }
              as: Producer
              as_user_id: "${prod_oc}"
              captures: { poc: $.data.id }
            - call: "POST /premises/${poc}/approve"
              payload: {}
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
              captures: { poc_v: $.data.version }
            - call: "POST /hold-orders"
              payload: { premises_id: "${poc}", effective_from: "2026-08-01T00:00:00Z", effective_until: "2026-08-02T00:00:00Z", expected_premises_version: "${poc_v}" }
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
              captures: { ho_oc: $.data.id }
          trigger:
            - call: "POST /hold-orders"
              payload: { premises_id: "${poc}", effective_from: "2026-08-10T00:00:00Z", effective_until: "2026-08-11T00:00:00Z", expected_premises_version: "${poc_v}" }
              as: StateAnimalHealthOfficial
              as_user_id: "saho-mt-1"
              captures: { err_occ: $.data.error_id }
          assert:
            - "${err_occ} == ERR_STALE_VERSION"
            - "HTTP status is 412"
            - "Premises.${poc}.pending_hold_count == 1"
            - "GET /hold-orders?premises_id=${poc} returns exactly 1 row whose id == ${ho_oc}"

      - name: lot_recalled_state_beats_ain_range
