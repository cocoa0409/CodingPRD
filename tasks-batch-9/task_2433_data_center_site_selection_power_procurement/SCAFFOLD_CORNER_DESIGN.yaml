scaffold_corner_design:
  - section: entities
    instances:
      - name: create_siting_program_returns_computed_load_and_defaults
        claim_type: Creation
        grounds:
          - endpoints[POST /siting-programs]
          - entities.SitingProgram.fields.program_annual_load_mwh
          - entities.SitingProgram.fields.program_status
        distinguishing_aspect: "POST /siting-programs with the four required fields returns 201, the success envelope (meta.api_request_id, response_type \"object\", data), program_annual_load_mwh == 2365200.0 and every money/count rollup at 0."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
          assert:
            - "HTTP 201"
            - "response body has meta.api_request_id and meta.api_request_timestamp, and response_type == \"object\""
            - "SitingProgram.${p_id}.program_annual_load_mwh == 2365200.0"
            - "SitingProgram.${p_id}.program_status == SCREENING"
            - "SitingProgram.${p_id}.committed_load_mw == 0"
            - "SitingProgram.${p_id}.renewable_coverage_pct == 0"
            - "SitingProgram.${p_id}.option_exposure_usd == 0"
            - "SitingProgram.${p_id}.forfeited_premium_usd == 0"
            - "SitingProgram.${p_id}.capitalized_premium_usd == 0"
            - "SitingProgram.${p_id}.premium_committed_total_usd == 0"
            - "SitingProgram.${p_id}.full_land_control_site_count == 0"
            - "SitingProgram.${p_id}.version == 1"

      - name: get_candidate_site_returns_stored_and_derived_fields
        claim_type: Retrieval
        grounds:
          - endpoints[GET /candidate-sites/{id}]
          - entities.CandidateSite.fields.status
          - entities.CandidateSite.fields.land_control_pct
        distinguishing_aspect: "GET /candidate-sites/{id} on a freshly created site returns the seven input fields verbatim plus status DRAFT, land_control_status NONE, screening_score null and version 1."
        test_recipe:
          setup:
            - "One program, utility, water source and one DRAFT candidate site of 300 gross acres."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
          trigger:
            - call: "GET /candidate-sites/${s1_id}"
              payload: {}
              as: SiteScreeningAnalyst
          assert:
            - "HTTP 200"
            - "CandidateSite.${s1_id}.program_id == ${p_id}"
            - "CandidateSite.${s1_id}.utility_id == ${u_id}"
            - "CandidateSite.${s1_id}.water_source_id == ${w_id}"
            - "CandidateSite.${s1_id}.gross_acres == 300"
            - "CandidateSite.${s1_id}.status == DRAFT"
            - "CandidateSite.${s1_id}.screening_score is null"
            - "CandidateSite.${s1_id}.hazard_tier is null"
            - "CandidateSite.${s1_id}.land_control_pct == 0"
            - "CandidateSite.${s1_id}.land_control_status == NONE"
            - "CandidateSite.${s1_id}.energization_risk_tier == ON_TRACK"
            - "CandidateSite.${s1_id}.site_capital_commitment_usd == 0"
            - "CandidateSite.${s1_id}.version == 1"

      - name: list_candidate_sites_filtered_and_paginated
        claim_type: Listing
        grounds:
          - endpoints[GET /candidate-sites]
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /candidate-sites?program_id=<p>&limit=2&offset=0 over three sites of that program returns exactly 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false."
        test_recipe:
          setup:
            - "One program with three DRAFT sites (Site Alpha, Site Bravo, Site Charlie) and a second program with one site that must not appear in the filtered list."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Delta", target_load_mw: 150, required_energization_date: "2030-06-30T00:00:00Z", capital_budget_usd: 20000000 }
              as: PortfolioDirector
              captures: { p2_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Bravo", state_code: "NC", county: "Davie", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s2_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Charlie", state_code: "NC", county: "Iredell", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s3_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p2_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Delta", state_code: "NC", county: "Wake", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s4_id: $.data.id }
          trigger:
            - call: "GET /candidate-sites?program_id=${p_id}&limit=2&offset=0"
              payload: {}
              as: PortfolioDirector
            - call: "GET /candidate-sites?program_id=${p_id}&limit=2&offset=2"
              payload: {}
              as: PortfolioDirector
          assert:
            - "the first trigger returns HTTP 200 with response_type == \"array\", exactly 2 data rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second trigger returns exactly 1 data row, total_count == 3, has_more == false"
            - "${s4_id} appears in neither page (the program_id filter excludes the other program's site)"

      - name: get_candidate_site_unknown_id_returns_site_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_SITE_NOT_FOUND]
          - validations[priority=7]
        distinguishing_aspect: "GET /candidate-sites/{id} for an id that was never minted returns HTTP 404 with error_id ERR_SITE_NOT_FOUND and the error envelope, not an empty 200."
        test_recipe:
          setup:
            - "One program, utility and water source exist; no candidate site has ever been created."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /candidate-sites/site_does_not_exist"
              payload: {}
              as: SiteScreeningAnalyst
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err_id} == ERR_SITE_NOT_FOUND"
            - "response_type == \"error\" and data.message is a non-empty string"

      - name: create_utility_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /utilities]
        distinguishing_aspect: "POST /utilities without energization_lead_days (an input field with no default) returns HTTP 422 ERR_INVALID_REQUEST and creates no Utility row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000 }
              as: PortfolioDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "no Utility row exists afterwards"

      - name: utility_and_option_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Utility.fields.commissioning_buffer_days
          - entities.Utility.fields.queue_policy
          - entities.LandParcelOption.fields.premium_credit_pct
        distinguishing_aspect: "Omitting commissioning_buffer_days and queue_policy yields 90 and FIRST_COME_FIRST_SERVED; omitting premium_credit_pct on a parcel option yields 0.5."
        test_recipe:
          setup:
            - "One program, one water source, one site; the utility is created without the two optional fields and the option without premium_credit_pct."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, energization_lead_days: 540 }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "GET /candidate-sites/${s1_id}"
              payload: {}
              as: SiteScreeningAnalyst
              captures: { s1_v0: $.data.version }
            - call: "POST /parcel-options"
              payload: { site_id: "${s1_id}", parcel_apn: "APN-100", phase_index: 1, acres: 120, option_premium_usd: 500000, purchase_price_usd: 18000000, window_start: "2027-01-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z", expected_site_version: "${s1_v0}" }
              as: SiteScreeningAnalyst
              captures: { o1_id: $.data.id }
          assert:
            - "Utility.${u_id}.commissioning_buffer_days == 90"
            - "Utility.${u_id}.queue_policy == FIRST_COME_FIRST_SERVED"
            - "Utility.${u_id}.reserved_capacity_mw == 0"
            - "Utility.${u_id}.available_capacity_mw == 500.0"
            - "LandParcelOption.${o1_id}.premium_credit_pct == 0.5"
            - "LandParcelOption.${o1_id}.status == OPTIONED"

      - name: computed_and_system_fields_are_server_derived_only
        claim_type: Computed Fields
        grounds:
          - entities.CandidateSite.fields.screening_score
          - entities.CandidateSite.fields.status
          - calculations.site_screening_score
        distinguishing_aspect: "POST /candidate-sites accepts only its seven declared inputs, so every computed field starts at its declared default (screening_score null, land_control_pct 0) and screening_score 83.00 / hazard_tier MODERATE appear only after screen derives them from the ten screen inputs; system fields id, created_at and version are minted by the server."
        test_recipe:
          setup:
            - "One program, utility and water source exist."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /candidate-sites/${s1_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "EVAPORATIVE", annual_water_demand_mgal: 250 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
          assert:
            - "the create returns HTTP 201 with status DRAFT, screening_score null, hazard_tier null, land_control_pct 0"
            - "the create response's id is server-minted, created_at == 2026-08-01T00:00:00Z (the default logical clock) and version == 1"
            - "the screen returns HTTP 200 with CandidateSite.${s1_id}.screening_score == 83.00 derived from the ten screen inputs"
            - "CandidateSite.${s1_id}.hazard_tier == MODERATE (max(0.20, 0.45, 0.30) == 0.45 >= HAZARD_MODERATE_THRESHOLD)"
            - "CandidateSite.${s1_id}.workforce_availability_ratio == 0.8000"
            - "CandidateSite.${s1_id}.screened_by_user_id == user_analyst_1 (system field taken from X-User-ID, not from the body)"
            - "CandidateSite.${s1_id}.version == 2 (one write, one increment)"

      - name: invalid_enum_and_out_of_range_numbers_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - entities.CandidateSite.fields.cooling_type
          - entities.LoadStudy.fields.diversity_factor
        distinguishing_aspect: "A screen call with cooling_type GEOTHERMAL and a screen call with seismic_hazard_index 1.4 both return 422 ERR_INVALID_REQUEST and leave the site DRAFT; the enum/range check precedes every state check."
        test_recipe:
          setup:
            - "One program, utility, water source and one DRAFT site."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /candidate-sites/${s1_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "GEOTHERMAL", annual_water_demand_mgal: 250 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /candidate-sites/${s1_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 1.40, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "EVAPORATIVE", annual_water_demand_mgal: 250 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
              captures: { err_range: $.data.error_id }
          assert:
            - "both triggers return HTTP 422"
            - "${err_enum} == ERR_INVALID_REQUEST"
            - "${err_range} == ERR_INVALID_REQUEST"
            - "CandidateSite.${s1_id}.status == DRAFT"
            - "CandidateSite.${s1_id}.screening_score is null"
            - "CandidateSite.${s1_id}.version == 1"

      - name: load_study_is_append_only_and_carries_no_version
        claim_type: Immutability
        grounds:
          - entities.LoadStudy.fields.study_round
          - endpoints[GET /interconnection-applications/{id}/load-studies]
          - state_machines.InterconnectionApplication.STUDY_COMPLETE_to_STUDY_COMPLETE
        distinguishing_aspect: "LoadStudy is declared common_fields: false — filing a restudy appends a second immutable row (study_round 1 then 2) instead of mutating the first, and neither row exposes a version or updated_at field."
        test_recipe:
          setup:
            - "Utility with total_transmission_capacity_mw 500; Site Alpha screened (hazard_tier MODERATE); its 300 MW application SUBMITTED."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
            - call: "POST /utilities"
              payload: { name: "Piedmont Power", state_code: "NC", balancing_authority: "PJM", total_transmission_capacity_mw: 500, interconnect_study_fee_per_mw_usd: 1200, network_upgrade_rate_usd_per_mw: 85000, commissioning_buffer_days: 90, energization_lead_days: 540, queue_policy: "FIRST_COME_FIRST_SERVED" }
              as: PortfolioDirector
              captures: { u_id: $.data.id }
            - call: "POST /water-sources"
              payload: { name: "Yadkin Basin", basin_code: "YAD-03", state_code: "NC", annual_permitted_mgal: 900 }
              as: PermittingAuthority
              captures: { w_id: $.data.id }
            - call: "POST /candidate-sites"
              payload: { program_id: "${p_id}", utility_id: "${u_id}", water_source_id: "${w_id}", name: "Site Alpha", state_code: "NC", county: "Rowan", gross_acres: 300 }
              as: SiteScreeningAnalyst
              captures: { s1_id: $.data.id }
            - call: "POST /candidate-sites/${s1_id}/screen"
              payload: { transmission_headroom_mw: 240, fiber_route_count: 3, seismic_hazard_index: 0.20, flood_hazard_index: 0.45, wind_hazard_index: 0.30, craft_labor_supply_index: 1600, construction_peak_headcount: 2000, wage_premium_pct: 0.10, cooling_type: "EVAPORATIVE", annual_water_demand_mgal: 250 }
              as: SiteScreeningAnalyst
              as_user_id: "user_analyst_1"
            - call: "POST /interconnection-applications"
              payload: { site_id: "${s1_id}", utility_id: "${u_id}", requested_mw: 300, window_start: "2029-01-01T00:00:00Z", window_end: "2029-12-31T00:00:00Z" }
              as: SiteScreeningAnalyst
              captures: { a1_id: $.data.id }
            - call: "POST /interconnection-applications/${a1_id}/submit"
              payload: {}
              as: SiteScreeningAnalyst
            - call: "POST /interconnection-applications/${a1_id}/load-studies"
              payload: { it_load_mw: 240, cooling_load_mw: 66, ancillary_load_mw: 12, diversity_factor: 0.92 }
              as: UtilityPlanner
              as_user_id: "${u_id}"
              captures: { st1_id: $.data.id }
          trigger:
            - call: "POST /interconnection-applications/${a1_id}/load-studies"
              payload: { it_load_mw: 240, cooling_load_mw: 66, ancillary_load_mw: 12, diversity_factor: 0.60 }
              as: UtilityPlanner
              as_user_id: "${u_id}"
              captures: { st2_id: $.data.id }
            - call: "GET /interconnection-applications/${a1_id}/load-studies"
              payload: {}
              as: SiteScreeningAnalyst
          assert:
            - "the GET returns HTTP 200 with total_count == 2"
            - "LoadStudy.${st1_id}.study_round == 1 and LoadStudy.${st2_id}.study_round == 2"
            - "LoadStudy.${st1_id}.diversity_factor == 0.92 (unchanged by the restudy)"
            - "LoadStudy.${st1_id}.diversified_peak_mw == 293.52 (unchanged by the restudy)"
            - "neither LoadStudy row exposes a version or updated_at field"
            - "LoadStudy.${st1_id}.filed_by_user_id == ${u_id}"

      - name: candidate_site_requires_existing_program_and_water_source
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_PROGRAM_NOT_FOUND]
          - errors[ERR_WATER_SOURCE_NOT_FOUND]
          - validations[priority=8]
        distinguishing_aspect: "A candidate site whose program_id was never minted returns 404 ERR_PROGRAM_NOT_FOUND, and one whose water_source_id was never minted returns 404 ERR_WATER_SOURCE_NOT_FOUND; body-FK existence is checked before any business rule."
        test_recipe:
          setup:
            - "One program, one utility and one water source exist."
          setup_api_calls:
            - call: "POST /siting-programs"
              payload: { name: "Hyperscale Alpha", target_load_mw: 300, required_energization_date: "2029-06-30T00:00:00Z", capital_budget_usd: 60000000 }
              as: PortfolioDirector
              captures: { p_id: $.data.id }
