            - "At creation: Client.${cli}.risk_posture == ELEVATED (a PENDING_DISCLOSURE authorization is an ELEVATED trigger while acuity_score is only 20)"
            - "The first AUTHORIZED attempt returns HTTP 422 with error_id ERR_COI_NOT_ACKNOWLEDGED and leaves ServiceAuthorization.${auth}.auth_status == PROPOSED"
            - "After DISCLOSE: ServiceAuthorization.${auth}.coi_status == DISCLOSED while ServiceAuthorization.${auth}.auth_status is still PROPOSED"
            - "After ACKNOWLEDGE: ServiceAuthorization.${auth}.coi_status == ACKNOWLEDGED, coi_acknowledged_by_contact_id == ${fc_alice}, auth_status still PROPOSED"
            - "After ACKNOWLEDGE: Client.${cli}.risk_posture == ELEVATED (the ACTIVE care plan still has coverage_gap_flag == true)"
            - "After the second AUTHORIZED: ServiceAuthorization.${auth}.auth_status == AUTHORIZED and coi_status is unchanged at ACKNOWLEDGED"
            - "After AUTHORIZED: Client.${cli}.authorized_coverage_hours == 8 and CarePlan.${cp}.coverage_gap_flag == false and Client.${cli}.risk_posture == ROUTINE"
            - "After ACTIVE then SUSPENDED: ServiceAuthorization.${auth}.auth_status == SUSPENDED, suspension_reason == FAMILY_REQUEST, coi_status still ACKNOWLEDGED"
            - "After SUSPENDED: Client.${cli}.authorized_coverage_hours == 0 and CarePlan.${cp}.coverage_gap_flag == true"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: invoice_void_five_hop_release_cascade
        grounds:
          - state_machines.Invoice.ISSUED_to_VOIDED
          - state_machines.TimeEntry.INVOICED_to_APPROVED
          - state_machines.Client.SUSPENDED_NONPAYMENT_to_ACTIVE_CARE
          - state_machines.ServiceAuthorization.SUSPENDED_to_ACTIVE
          - calculations.client_retainer_and_accrual_ledger
          - calculations.client_authorized_coverage_hours
        distinguishing_aspect: |
          Depth-5 cascade triggered by PATCH /care/invoices/{invoiceId}/state to VOIDED, where each
          hop is CAUSED BY the previous one and not by the original call: hop 1 voids the invoice,
          hop 2 releases its INVOICED entries because the invoice left the draw set, hop 3 recomputes
          the client's retainer balance and accrual because those entries moved, hop 4 un-suspends the
          client because the recomputed balance crossed retainer_floor_cents, and hop 5 reactivates
          the NONPAYMENT-suspended authorizations because the client returned to ACTIVE_CARE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Care manager Dana (22500/hr) and supervisor Iris."
            - "Client Eleanor with retainer_floor_cents 50000, billing_increment_min 15, authorized_concurrent_caregivers 2, and exactly 60000 cents of retainer deposits."
            - "Surrogate contact Marcus; ACCEPTED assessment; ACTIVE care plan, so Client.status == ACTIVE_CARE."
            - "Vendor Northgate Home Care (no referral relationship) with a ServiceAuthorization in auth_status ACTIVE covering 8 hours with 1 caregiver."
            - "One OPEN CrisisEpisode and one APPROVED CRISIS_RESPONSE TimeEntry worth 70875 cents on service_date 2026-08-05."
            - "An Invoice for 2026-08-01..2026-08-31 issued so that the 60000 retainer is fully drawn, leaving balance 0 < 50000 with balance_due_cents 15836 > 0, which suspends the client and its ACTIVE authorization."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /care/care-managers"
              payload: { full_name: "Dana Reyes", credential: "CMC", hourly_rate_cents: 22500, is_supervisor: false }
              as: PracticeAdmin
              captures: { cm_dana: $.data.id }
            - call: "POST /care/care-managers"
              payload: { full_name: "Iris Vance", credential: "CCM", hourly_rate_cents: 30000, is_supervisor: true }
              as: PracticeAdmin
              captures: { cm_iris: $.data.id }
            - call: "POST /care/clients"
              payload: { full_name: "Eleanor Whitfield", residence_setting: "PRIVATE_HOME", billing_increment_min: 15, travel_billing_pct: 50, retainer_floor_cents: 50000, authorized_concurrent_caregivers: 2 }
              as: PracticeAdmin
              captures: { cli: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Marcus Whitfield", contact_role: "POA_HEALTHCARE", is_surrogate_decision_maker: true }
              as: PracticeAdmin
              captures: { fc_marcus: $.data.id }
            - call: "POST /care/clients/${cli}/retainer-deposits"
              payload: { amount_cents: 60000, received_at: "2026-08-05T00:05:00Z" }
              as: BillingAdministrator
            - call: "POST /care/vendors"
              payload: { name: "Northgate Home Care", vendor_type: "HOME_CARE", has_referral_relationship: false }
              as: PracticeAdmin
              captures: { vnd: $.data.id }
            - call: "POST /care/assessments"
