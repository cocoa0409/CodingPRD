  # =========================================================================
  # RULE 7 - cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: open_polls_requires_accepted_voter_list
        grounds:
          - validations[priority=13]
          - errors.ERR_VOTER_LIST_NOT_ACCEPTED
          - state_machines.ElectionRound.SCHEDULED_to_POLLS_OPEN
          - state_machines.VoterList.SUBMITTED_to_ACCEPTED
        dependency: "ElectionRound.SCHEDULED -> POLLS_OPEN depends on VoterList.status == ACCEPTED"
        distinguishing_aspect: |
          The gating entity is a sibling aggregate, not a parent: a perfectly graded voter list that
          is merely SUBMITTED and not yet ACCEPTED still blocks the polls. The identical open-polls
          request succeeds once the Board accepts the list, with no change to the round itself.
        test_recipe:
          setup:
            - "petition ELECTION_SET, round 1 SCHEDULED with one poll session 2026-09-01T06:00:00Z to 17:00:00Z"
            - "a voter list with 3 complete entries submitted on time (COMPLIANT) but not yet reviewed"
            - "clock at 2026-09-01T06:00:00Z, so the polls_open_at temporal gate is satisfied"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: LaborRelationsDirector
            - call: "POST /labor-relations/petitions"
              payload: { case_number: "07-RC-330071", petition_type: "RC", union_name: "United Plant Workers Local 812", filed_date: "2026-08-03", proposed_unit_description: "All production and maintenance employees at Plant 1", claimed_employee_count: 120, payroll_period_end: "2026-08-14" }
              as: LaborRelationsDirector
              captures: { pet_id: $.data.id }
            - call: "POST /labor-relations/petitions/${pet_id}/open-scope-analysis"
              payload: {}
              as: LaborRelationsDirector
            - call: "POST /labor-relations/classifications"
              payload: { petition_id: "${pet_id}", code: "PROD", title: "Production Operator", headcount: 60, avg_hourly_wage_cents: 2400, shift_code: "A", work_location: "PLANT_1", supervisory_authority_count: 0, employer_position: "INCLUDE", union_position: "INCLUDE", supervision_overlap: 88, skills_overlap: 90, functional_integration: 92, interchange_rate: 74, work_conditions_overlap: 95 }
              as: LaborRelationsDirector
              captures: { cls_prod_id: $.data.id }
            - call: "POST /labor-relations/classifications"
