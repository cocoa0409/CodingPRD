              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_payer_id: "$.data.id" }
            - call: "POST /research-billing/charges"
              payload: { study_id: "${study_id}", charge_code: "J9999", service_date: "2026-08-01", amount_cents: 40000 }
              as: StudyCoordinator
              as_user_id: "coord_1"
              captures: { charge_sponsor_id: "$.data.id" }
