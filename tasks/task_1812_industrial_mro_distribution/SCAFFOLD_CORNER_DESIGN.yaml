      - name: hazmat_region_restricted_delivery_but_will_call_exempt
        claim_type: conditional_validation
        grounds: ["validations[priority=7]", "errors[ERR_HAZMAT_REGION_RESTRICTED]"]
        distinguishing_aspect: "An item with restricted_states [CA] cannot be delivered to a CA customer (STANDARD fails with ERR_HAZMAT_REGION_RESTRICTED) but WILL_CALL pickup at the branch is exempt and confirms."
        test_recipe:
          setup: ["Customer ship-to CA, credit 1,000,000; item restricted_states [CA] stocked 2 at a CA branch; two orders: STANDARD and WILL_CALL"]
          setup_api_calls:
            - call: "POST /mro/customers"
