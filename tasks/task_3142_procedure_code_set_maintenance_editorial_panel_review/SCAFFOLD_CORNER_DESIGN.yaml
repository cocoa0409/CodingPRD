              captures: { err_un: $.data.error_id }
          assert:
            - "${err_un} == ERR_SPONSOR_REQUIRED"
            - "the returned http status is 422"
            - "CodeChange.${chg_un}.cycle_id is null"

      - name: provider_interpretation_request_not_entitled
        claim_type: violation_to_error
        grounds:
          - validations[priority=26]
          - calculations.assistant_interpretation_entitlement
          - errors[ERR_NOT_ENTITLED]
          - entities.InterpretationRequest.fields.entitlement_status
        distinguishing_aspect: |
          A provider licence is never entitled to a written interpretation, so
          the answer call fails with ERR_NOT_ENTITLED at status 403 while the
          request row records entitlement_status NOT_ENTITLED.
        test_recipe:
          setup:
            - "One DistributionTerritory on the SITE method bound to an active provider licence"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/distribution-territories"
              payload: { territory_code: "US-CAROLINAS", method: "SITE", edi_payer_network: false, metadata_schema_version: "2026.1" }
              as: LicensingOfficer
              captures: { ter_ip: $.data.id }
            - call: "POST /cpt/licensing-agreements"
              payload: { licensee_type: "PROVIDER", licensee_name: "Carolinas Clinic", vendor_worldwide: false, expected_users: 14, sales_unit_count: 9, base_fee_cents: 0, territory_id: "${ter_ip}" }
              as: LicensingOfficer
              captures: { lic_ip: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/licensing-agreements/${lic_ip}/activations"
              payload: {}
              as: LicensingOfficer
              captures: { lic_ip_v1: $.data.version }
            - call: "POST /cpt/interpretation-requests"
              payload: { requesting_licensee_id: "${lic_ip}", code: "00001", question: "Does the parenthetical apply to the family?" }
              as: LicensingOfficer
              captures: { iq_ip: $.data.id }
          trigger:
            - call: "POST /cpt/interpretation-requests/${iq_ip}/answers"
              payload: { answer_text: "Yes, the parenthetical governs the whole family." }
              as: EditorialStaff
              captures: { err_ip: $.data.error_id }
          assert:
            - "${err_ip} == ERR_NOT_ENTITLED"
            - "the returned http status is 403"
            - "InterpretationRequest.${iq_ip}.entitlement_status == NOT_ENTITLED"

      - name: high_priority_error_wins_dual_failure
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CODE_ALREADY_EXISTS]
          - errors[ERR_EVIDENCE_INSUFFICIENT]
        distinguishing_aspect: |
          A filing that both reuses descriptor 00090 and supplies TIER_IV
          evidence for a below-threshold addition fails two checks at once, and
          the priority-5 uniqueness error is the one returned.
        test_recipe:
          setup:
            - "One ACTIVE ChangeApplicant and one existing CodeChange 00090"
            - "Logical clock at 2026-09-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /cpt/applicants"
              payload: { name: "Dual Applicant", applicant_type: "MANUFACTURER", is_entity_member: true, dues_paid_current: true, contact_email: "dual@example.org" }
              as: EditorialStaff
              captures: { app_du: $.data.id }
            - call: "POST /cpt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EditorialStaff
            - call: "POST /cpt/code-changes"
              payload: { code: "00090", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_du}", clinical_evidence_tier: "TIER_I", procedure_volume_threshold: 5000, descriptor_current: "Placeholder descriptor" }
              as: EditorialStaff
              captures: { chg_du: $.data.id }
          trigger:
            - call: "POST /cpt/code-changes"
              payload: { code: "00090", change_type: "ADDITION", category: "CATEGORY_I", code_family: "000", applicant_id: "${app_du}", clinical_evidence_tier: "TIER_IV", procedure_volume_threshold: 30, descriptor_current: "Other placeholder" }
              as: EditorialStaff
              captures: { err_du: $.data.error_id }
          assert:
            - "${err_du} == ERR_CODE_ALREADY_EXISTS"
            - "the returned http status is 409"
            - "the count of CodeChange rows with code 00090 is 1"

