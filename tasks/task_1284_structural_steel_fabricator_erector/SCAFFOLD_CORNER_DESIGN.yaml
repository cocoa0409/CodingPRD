            - { call: "POST /erection-sequences", payload: { job_id: "${jcc}", seq_number: 1 }, as: FOREMAN, captures: { scc: $.data.id } }
            - { call: "POST /erection-sequences/${scc}/release", as: FOREMAN }
            - { call: "POST /mill-orders", payload: { job_id: "${jcc}", material_grade: "A992", ordered_weight_lbs: 100000, unit_price_per_cwt_cents: 4500, billing_mode: "NOMINAL" }, as: FABRICATOR_ADMIN, captures: { mcc: $.data.id } }
            - { call: "POST /mill-orders/${mcc}/receive", payload: { received_weight_lbs: 100000 }, as: FABRICATOR_ADMIN }
            - { call: "POST /pieces", payload: { job_id: "${jcc}", piece_mark: "P1", weight_lbs: 800, drawing_id: "${dcc}", sequence_id: "${scc}" }, as: FOREMAN, captures: { pcc: $.data.id } }
            - { call: "POST /pieces/${pcc}/start", as: FOREMAN }
