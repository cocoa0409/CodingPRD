          - calculations.available_water_af
        distinguishing_aspect: |
          Metric = water volume in acre-feet (different metric than breach percentage);
          endpoint = POST /transfer-orders (different endpoint than snapshot creation).
          quantity_af exactly equal to forward-looking available (40.000 == 40.000)
