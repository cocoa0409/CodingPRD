  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hold_rejected_by_state_before_hold_allowance
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - state_machines.Membership.ACTIVE_to_ON_HOLD
        distinguishing_aspect: |
          Error-category pair state(5) vs business_fiscal(10): a hold request
          on an already-CANCELLED membership that ALSO exceeds the 120-day
          allowance must return ERR_INVALID_STATE (priority 5), not
          ERR_HOLD_ALLOWANCE_EXCEEDED (priority 10) — the state check wins.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Member M holds then resumes (clock advanced to 2026-12-10, so 100 hold-days used), then cancels; a fresh 90-day hold request on the cancelled membership would exceed the 120-day allowance if it reached the fiscal check."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Member", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id }
            - call: "POST /memberships/${mship_id}/hold"
              payload: { hold_until: "2026-12-10" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-10T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /memberships/${mship_id}/resume"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /memberships/${mship_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /memberships/${mship_id}/hold"
              payload: { hold_until: "2027-03-10" }
              as: Member
              as_user_id: "${member_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger request returns HTTP 409 with error_id ERR_INVALID_STATE"
            - "ERR_HOLD_ALLOWANCE_EXCEEDED is NOT returned even though the 100 days already used (2026-09-01..2026-12-10) plus the requested 90 days would total 190 > 120"
            - "Membership.${mship_id}.status remains CANCELLED and no hold window is recorded"

      - name: approve_rejected_by_referential_before_pool_solvency
        grounds:
          - validations[priority=4]
          - validations[priority=10]
          - state_machines.ScholarshipApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Error-category pair business_referential(4) vs business_fiscal(10):
          an approve against an application whose renews_application_id is
          dangling (referential failure at creation) is one half; the testable
          dual-failure here is a membership PATCH with a category_id from a
          DIFFERENT branch plus an OCC-correct version — referential 404 beats
          any fiscal recompute, demonstrating referential(4) outranks fiscal(10).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Two branches DT and UP. Membership M at DT on category DT-ADULT. Category UP-FAMILY exists at UP. Membership version captured."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_dt: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "UP", name: "Uptown", branch_goal_cents: 500000 }
              as: AssociationAdmin
              captures: { branch_up: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_dt}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_dt: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_up}", name: "Family", household_type: "FAMILY", joining_fee_cents: 0, monthly_dues_cents: 12000, max_adults: 2, max_dependents: 6 }
              as: BranchDirector
              captures: { cat_up: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Member", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_dt}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_dt}", category_id: "${cat_dt}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id, mship_v: $.data.version }
          trigger:
            - call: "PATCH /memberships/${mship_id}"
              payload: { category_id: "${cat_up}", expected_membership_version: "${mship_v}" }
              as: BranchDirector
              captures: { err: $.data.error_id }
          assert:
            - "the trigger request returns HTTP 404 with error_id ERR_CATEGORY_NOT_FOUND (cross-branch category is a referential failure)"
            - "no fiscal recompute happens: Membership.${mship_id}.category_id still ${cat_dt} and version still ${mship_v}"
            - "the referential error outranks every business_fiscal check that a dues change would otherwise trigger"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: campaign_attainment_exactly_half_gets_match_tier
        grounds:
          - calculations.campaign_attainment_and_match
          - entities.Campaign.fields.match_pct
        distinguishing_aspect: |
          Numeric threshold boundary on the campaign metric via the donation
          receive endpoint: attainment EXACTLY 0.5000 (50000 of 100000) takes
          the 0.10 tier (>= 0.50), while 49999 (0.4999 after round4) stays at
          match_pct 0 — the >= vs > distinction is observable in matched cents.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Association, branch, ACTIVE campaign goal 100000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 50000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /campaigns"
              payload: { association_id: "${assoc_id}", name: "Annual 2026", goal_cents: 100000 }
              as: AssociationAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/activate"
              payload: {}
              as: AssociationAdmin
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", branch_id: "${branch_id}", amount_cents: 49999, designation: "GENERAL" }
              as: BranchDirector
              captures: { don_a: $.data.id }
            - call: "POST /donations/${don_a}/receive"
              payload: {}
              as: BranchDirector
          trigger:
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: AssociationAdmin
              captures: { match_below: $.data.match_pct, matched_below: $.data.matched_raised_cents }
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", branch_id: "${branch_id}", amount_cents: 1, designation: "GENERAL" }
              as: BranchDirector
              captures: { don_b: $.data.id }
            - call: "POST /donations/${don_b}/receive"
              payload: {}
              as: BranchDirector
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: AssociationAdmin
          assert:
            - "at 49999 raised: match_pct == 0 and matched_raised_cents == 49999 (attainment 0.4999 < 0.50)"
            - "after the 1-cent donation, base_raised_cents == 50000 and attainment rounds to exactly 0.5000"
            - "Campaign.${camp_id}.match_pct == 0.10 (>= boundary is inclusive)"
            - "Campaign.${camp_id}.matched_raised_cents == 55000"

      - name: unstaffed_licensed_childcare_accepts_zero_registrations
        grounds:
          - calculations.licensed_ratio_capacity
          - entities.ProgramSession.fields.staff_member_ids
        distinguishing_aspect: |
          Empty-set boundary on the staff-count metric via the registrations
          endpoint: a licensed childcare session with an EMPTY staff_member_ids
          array has max_children == ratio * 0 == 0, so the very first
          registration must be WAITLISTED even though raw seat capacity is 10 —
          zero-staff is not an error, it is a zero cap.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10. Branch, CHILDCARE_ROOM space, licensed childcare program (ratio 4) with a session (capacity 10) in REG_OPEN and NO staff assigned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /spaces"
              payload: { branch_id: "${branch_id}", name: "Childcare Room", kind: "CHILDCARE_ROOM", capacity: 20, dropin_capacity: 0 }
              as: BranchDirector
              captures: { space_id: $.data.id }
            - call: "POST /programs"
              payload: { branch_id: "${branch_id}", name: "Toddler Care", kind: "CHILDCARE", base_fee_cents: 30000, member_priority_days: 0, is_licensed_childcare: true, licensed_children_per_staff: 4, max_age: 5 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${prog_id}", space_id: "${space_id}", start_on: "2026-09-20", end_on: "2026-09-20", time_start: "08:00", time_end: "12:00", capacity: 10 }
              as: ProgramCoordinator
              captures: { sess_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /members"
              payload: { full_name: "Parent One", email: "p1@x.com", birth_date: "1990-01-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { mem1: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { session_id: "${sess_id}", member_id: "${mem1}", participant_name: "Kid One", participant_birth_date: "2023-03-01" }
              as: Member
              as_user_id: "${mem1}"
              captures: { reg1: $.data.id }
          assert:
            - "Registration.${reg1}.status == WAITLISTED with waitlist_position == 1 (NOT REGISTERED despite 10 raw seats)"
            - "ProgramSession.${sess_id}.enrolled_count == 0 and waitlist_count == 1"
            - "after POST /sessions/${sess_id}/staff with one staff member, the head-of-line promotion flips ${reg1} to REGISTERED (ratio 4 * 1 staff = 4 seats)"

