# =============================================================================
# SCAFFOLD.yaml — Self-Publishing & Print-on-Demand Books (KDP/IngramSpark style)
# Difficulty: Expert
# §1.0–§1.7. The §1.8 (difficulty design) and §1.9 (corner design) tables live in
# their own sibling files and are NOT emitted here.
# =============================================================================

scenario: "782. Self-Publishing & Print-on-Demand Books (KDP/IngramSpark style): manuscript/file upload & validation, metadata/ISBN & category, cover/format (print/ebook/audio), pricing & royalty by channel/territory, distribution & expanded-reach, proof/revision, sales/royalty report & payout, returns reserve"
domain_name: "self-publishing-pod"
api_prefix: "/"

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - temporal_windowing            # price effective windows + statement periods

  entity_topology: flat             # peer entities linked by FK; no deep URL nesting
  state_machine_shape: cyclic       # Format DRAFT<->CONTENT_LOCKED revision loop; DR branching
  relationship_patterns:
    - one_to_many                   # Publisher->Title->Format->{Asset,Proof,Price,DR,SalesLine}
    - cross_aggregate               # SalesLine->Format->Title->Publisher for royalty rollup
  role_model: peer_roles            # Publisher owns content; Reviewer gates distribution; Admin operates
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  - name: Publisher
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "imprint / author account display name" }
      - { name: email, type: string, source: input, description: "contact email" }
      - { name: payout_method, type: enum, source: input, default: "BANK", description: "BANK | PAYPAL", constraints: "one of {BANK, PAYPAL}" }
      - { name: reserve_held_cents, type: integer, source: computed, default: 0, description: "running outstanding returns-reserve = sum over this publisher's SalesLine.reserve_held_cents (SALE positive, RETURN negative). Reconciled on every sales-line ingest. See calc publisher_reserve_balance." }
      - { name: lifetime_paid_cents, type: integer, source: computed, default: 0, description: "sum of net_payable_cents over this publisher's RoyaltyStatement rows in status PAID" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE (only value)", constraints: "one of {ACTIVE}" }

  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; the owning publisher. Must equal X-User-ID when acting as Publisher." }
      - { name: title, type: string, source: input, description: "book title" }
      - { name: subtitle, type: string, source: input, default: null, description: "optional subtitle" }
      - { name: language, type: string, source: input, description: "BCP-47 language code, e.g. en" }
      - { name: bisac_category, type: string, source: input, description: "BISAC subject category code, e.g. FIC000000" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | LIVE | UNLISTED", constraints: "one of {DRAFT, LIVE, UNLISTED}" }

  - name: Format
    parent: null
    common_fields: true
    fields:
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the parent title (supplied via path on create)" }
      - { name: format_type, type: enum, source: input, description: "PRINT | EBOOK | AUDIO", constraints: "one of {PRINT, EBOOK, AUDIO}" }
      - { name: trim_size, type: enum, source: input, default: null, description: "PRINT only trim: one of {5x8, 6x9, 7x10, 8.5x11}. LARGE trim band = {7x10, 8.5x11}." }
      - { name: interior_color, type: enum, source: input, default: null, description: "PRINT only: BW | STANDARD_COLOR | PREMIUM_COLOR", constraints: "one of {BW, STANDARD_COLOR, PREMIUM_COLOR}" }
      - { name: page_count, type: integer, source: input, default: null, description: "PRINT page count; drives print_cost and cover spine width" }
      - { name: file_size_mb, type: number, source: input, default: null, description: "EBOOK/AUDIO delivery file size in MB; drives ebook delivery fee" }
      - { name: isbn_id, type: string, source: system, default: null, description: "denormalized id of the ASSIGNED Isbn (canonical FK is Isbn.assigned_format_id); null until POST assign-isbn, cleared by release-isbn. NOT a foreign key declaration." }
      - { name: print_cost_cents, type: integer, source: computed, default: null, description: "per-unit manufacturing cost for PRINT; null for EBOOK/AUDIO. See calc print_cost_per_unit." }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | CONTENT_LOCKED | PUBLISHED | UNLISTED", constraints: "one of {DRAFT, CONTENT_LOCKED, PUBLISHED, UNLISTED}" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: format_id, type: string, source: input, description: "FK -> Format.id; the format this file belongs to (via path on create)" }
      - { name: asset_type, type: enum, source: input, description: "INTERIOR (manuscript) | COVER", constraints: "one of {INTERIOR, COVER}" }
      - { name: file_ref, type: string, source: input, description: "opaque storage reference of the uploaded file" }
      - { name: file_format, type: enum, source: input, description: "PDF | EPUB | DOCX | AAX | JPG | TIFF", constraints: "one of {PDF, EPUB, DOCX, AAX, JPG, TIFF}" }
      - { name: declared_page_count, type: integer, source: input, default: null, description: "INTERIOR: page count declared in the upload; validated against MIN_PAGE_COUNT" }
      - { name: paper_type, type: enum, source: input, default: null, description: "WHITE | CREAM | COLOR; drives cover spine caliper", constraints: "one of {WHITE, CREAM, COLOR}" }
      - { name: declared_spine_mm, type: number, source: input, default: null, description: "COVER: spine width in mm baked into the uploaded cover artwork; compared to computed spine_width_mm" }
      - { name: spine_width_mm, type: number, source: computed, default: null, description: "COVER only: required spine width computed from the parent Format.page_count and this asset's paper_type. See calc cover_spine_width." }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | VALIDATED | REJECTED", constraints: "one of {PENDING, VALIDATED, REJECTED}" }
      - { name: rejection_reason, type: string, source: system, default: null, description: "error_id captured when validation moved the asset to REJECTED" }

  - name: Isbn
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; the pool owner (via path on create)" }
      - { name: isbn_13, type: string, source: input, description: "the 13-digit ISBN string" }
      - { name: assigned_format_id, type: string, source: system, default: null, description: "FK -> Format.id; the format this ISBN is assigned to, null while FREE" }
      - { name: status, type: enum, source: system, default: "FREE", description: "FREE | ASSIGNED | LOCKED", constraints: "one of {FREE, ASSIGNED, LOCKED}" }

  - name: Channel
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "sales channel display name, e.g. AMZ, IGS" }
      - { name: channel_type, type: enum, source: input, description: "RETAIL | LIBRARY | DIRECT", constraints: "one of {RETAIL, LIBRARY, DIRECT}" }
      - { name: supports_formats, type: array, source: input, description: "list of format_type values this channel distributes, subset of {PRINT, EBOOK, AUDIO}" }
      - { name: ebook_high_rate, type: number, source: input, default: null, description: "ebook royalty rate inside the price band, e.g. 0.70" }
      - { name: ebook_low_rate, type: number, source: input, default: null, description: "ebook royalty rate outside the price band, e.g. 0.35" }
      - { name: ebook_rate_low_threshold_cents, type: integer, source: input, default: null, description: "inclusive lower bound of the high-rate band, e.g. 299" }
      - { name: ebook_rate_high_threshold_cents, type: integer, source: input, default: null, description: "inclusive upper bound of the high-rate band, e.g. 999" }
      - { name: delivery_fee_per_mb_cents, type: integer, source: input, default: 0, description: "ebook per-MB delivery fee applied only inside the high-rate band" }
      - { name: distribution_discount_standard, type: number, source: input, description: "print wholesale/channel discount at standard reach, e.g. 0.40" }
      - { name: distribution_discount_expanded, type: number, source: input, description: "print wholesale/channel discount at expanded reach, e.g. 0.60" }
      - { name: returns_reserve_pct, type: number, source: input, description: "fraction of SALE royalty withheld as returns reserve, e.g. 0.15" }
      - { name: min_list_price_cents, type: integer, source: input, description: "inclusive minimum list price accepted on this channel" }
      - { name: max_list_price_cents, type: integer, source: input, description: "inclusive maximum list price accepted on this channel" }

  - name: ChannelPrice
    parent: null
    common_fields: true
    fields:
      - { name: format_id, type: string, source: input, description: "FK -> Format.id; the priced format (via path on create)" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; the channel this price applies to" }
      - { name: territory, type: enum, source: input, description: "US | UK | EU | ROW", constraints: "one of {US, UK, EU, ROW}" }
      - { name: list_price_cents, type: integer, source: input, description: "consumer list price in the territory currency, minor units" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO-4217 currency code" }
      - { name: effective_from, type: datetime, source: input, description: "half-open window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, default: null, description: "half-open window end (exclusive); null = open-ended default price" }
      - { name: expanded_reach, type: boolean, source: input, default: false, description: "true => use the channel's expanded distribution discount for print royalty" }
      - { name: royalty_per_unit_cents, type: integer, source: computed, default: null, description: "per-unit royalty snapshot computed at create from list_price + channel rates + Format.print_cost_cents. See calc royalty_per_unit." }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUPERSEDED", constraints: "one of {ACTIVE, SUPERSEDED}" }

  - name: Proof
    parent: null
    common_fields: true
    fields:
      - { name: format_id, type: string, source: input, description: "FK -> Format.id; the format under proof (via path on create)" }
      - { name: round_number, type: integer, source: system, description: "1-based proof round; increments each time a new proof is ordered for the format" }
      - { name: revision_notes, type: string, source: input, default: null, description: "notes captured when a proof is sent back for revision" }
      - { name: status, type: enum, source: system, default: "ORDERED", description: "ORDERED | APPROVED | REVISION_REQUESTED", constraints: "one of {ORDERED, APPROVED, REVISION_REQUESTED}" }

  - name: DistributionRequest
    parent: null
    common_fields: true
    fields:
      - { name: format_id, type: string, source: input, description: "FK -> Format.id; the format to distribute (via path on create)" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; the target channel" }
      - { name: territory, type: enum, source: input, description: "US | UK | EU | ROW", constraints: "one of {US, UK, EU, ROW}" }
      - { name: expanded_reach, type: boolean, source: input, default: false, description: "request expanded-reach distribution (broader retailer network)" }
      - { name: reason, type: string, source: input, default: null, description: "reviewer's note captured on rejection" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | LIVE | REJECTED | WITHDRAWN", constraints: "one of {REQUESTED, APPROVED, LIVE, REJECTED, WITHDRAWN}" }

  - name: SalesLine
    parent: null
    common_fields: true
    fields:
      - { name: format_id, type: string, source: input, description: "FK -> Format.id; the sold format" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; the selling channel" }
      - { name: territory, type: enum, source: input, description: "US | UK | EU | ROW", constraints: "one of {US, UK, EU, ROW}" }
      - { name: units, type: integer, source: input, description: "positive unit count for this line" }
      - { name: line_type, type: enum, source: input, description: "SALE | RETURN", constraints: "one of {SALE, RETURN}" }
      - { name: sale_date, type: datetime, source: input, description: "date the sale/return posted; must fall inside a statement period to be swept" }
      - { name: royalty_per_unit_cents, type: integer, source: computed, description: "snapshot of the ACTIVE ChannelPrice.royalty_per_unit_cents selected for (format,channel,territory) at sale_date" }
      - { name: gross_royalty_cents, type: integer, source: computed, description: "royalty_per_unit_cents * units for SALE; negated for RETURN. See calc sales_line_amounts." }
      - { name: reserve_held_cents, type: integer, source: computed, description: "per-line returns reserve = round_half_up(abs(gross)*channel.returns_reserve_pct), negated for RETURN. See calc sales_line_amounts." }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | STATEMENTED", constraints: "one of {PENDING, STATEMENTED}" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: publisher_id, type: string, source: input, description: "FK -> Publisher.id; the payee (via path on create)" }
      - { name: period_start, type: datetime, source: input, description: "closed-inclusive period start" }
      - { name: period_end, type: datetime, source: input, description: "closed-inclusive period end" }
      - { name: gross_royalty_cents, type: integer, source: computed, default: 0, description: "sum of swept SalesLine.gross_royalty_cents in the period. See calc statement_rollup." }
      - { name: reserve_held_cents, type: integer, source: computed, default: 0, description: "sum of swept SalesLine.reserve_held_cents in the period (per-line-rounded then summed). See calc statement_rollup." }
      - { name: reserve_released_cents, type: integer, source: computed, default: 0, description: "reserve maturing this period = reserve_held_cents of the immediately-prior ISSUED statement (by period_start) for this publisher, else 0. See calc statement_rollup (final variant)." }
      - { name: provisional_net_cents, type: integer, source: computed, default: 0, description: "forward-looking estimate available while ACCRUING = gross_royalty_cents - reserve_held_cents (ignores releases). See calc statement_rollup (provisional variant)." }
      - { name: net_payable_cents, type: integer, source: computed, default: 0, description: "final payout locked at issue = gross_royalty_cents - reserve_held_cents + reserve_released_cents." }
      - { name: status, type: enum, source: system, default: "ACCRUING", description: "ACCRUING | ISSUED | PAID", constraints: "one of {ACCRUING, ISSUED, PAID}" }

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:
  - entity: Asset
    initial_state: PENDING
    terminal_states: [VALIDATED, REJECTED]
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "POST /assets/{id}/validate"
        actor: PlatformAdmin
        preconditions:
          - "asset.status == PENDING"
          - "INTERIOR: file_format in {PDF, EPUB, DOCX} AND declared_page_count >= MIN_PAGE_COUNT(24)"
          - "COVER: file_format in {JPG, TIFF, PDF} AND abs(declared_spine_mm - spine_width_mm) <= SPINE_TOLERANCE_MM(0.5)"
        side_effects:
          - "for COVER, (re)computes spine_width_mm from Format.page_count and paper_type before the tolerance check"
        note: "spine_width_mm is computed at upload and refreshed here."
      - from: PENDING
        to: REJECTED
        trigger: "POST /assets/{id}/validate (checks fail)"
        actor: PlatformAdmin
        preconditions:
          - "asset.status == PENDING"
          - "INTERIOR: declared_page_count < MIN_PAGE_COUNT -> rejection_reason = ERR_PAGE_COUNT_TOO_LOW"
          - "COVER: abs(declared_spine_mm - spine_width_mm) > SPINE_TOLERANCE_MM -> rejection_reason = ERR_SPINE_MISMATCH"
        side_effects:
          - "sets rejection_reason to the triggering error_id"

  - entity: Format
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: CONTENT_LOCKED
        trigger: "POST /formats/{id}/lock"
        actor: Publisher
        preconditions:
          - "format.status == DRAFT"
          - "exists Asset A with A.format_id == format.id AND A.asset_type == INTERIOR AND A.status == VALIDATED  [cross-entity Format->Asset]"
          - "if format.format_type == PRINT: exists Asset C with C.format_id == format.id AND C.asset_type == COVER AND C.status == VALIDATED"
        side_effects:
          - "increments Format.version by 1"
      - from: CONTENT_LOCKED
        to: PUBLISHED
        trigger: "POST /formats/{id}/publish"
        actor: Publisher
        preconditions:
          - "format.status == CONTENT_LOCKED"
          - "exists Proof P with P.format_id == format.id AND P.status == APPROVED  [state, cross-entity]"
          - "format.isbn_id != null  [business_referential: ERR_ISBN_NOT_ASSIGNED]"
        side_effects:
          - "CASCADE A link1: Format -> PUBLISHED"
          - "link2 (caused by link1): the assigned Isbn (assigned_format_id == format.id) transitions ASSIGNED -> LOCKED"
          - "link2 (caused by link1): every DistributionRequest DR with DR.format_id == format.id AND DR.status == APPROVED transitions APPROVED -> LIVE"
          - "CASCADE A link3 (caused by each DR -> LIVE): the parent Title (title_id) transitions DRAFT -> LIVE if not already LIVE"
          - "increments Format.version by 1"
      - from: CONTENT_LOCKED
        to: DRAFT
        trigger: "system, caused by POST /proofs/{id}/request-revision on a proof of this format"
        actor: system
        preconditions:
          - "a Proof of this format transitions ORDERED -> REVISION_REQUESTED while format.status == CONTENT_LOCKED"
        side_effects:
          - "unlocks content so the interior/cover can be re-uploaded; increments Format.version by 1"
        note: "This edge closes the revision CYCLE DRAFT -> CONTENT_LOCKED -> DRAFT."
      - from: PUBLISHED
        to: UNLISTED
        trigger: "system, caused by POST /distribution-requests/{id}/withdraw (last LIVE request withdrawn)"
        actor: system
        preconditions:
          - "no remaining DistributionRequest with format_id == format.id AND status == LIVE"
        side_effects:
          - "CASCADE B link2: Format -> UNLISTED"
          - "link3 (caused by link2): if every Format with title_id == format.title_id is UNLISTED, the Title transitions LIVE -> UNLISTED"
          - "increments Format.version by 1"

  - entity: Isbn
    initial_state: FREE
    terminal_states: [LOCKED]
    transitions:
      - from: FREE
        to: ASSIGNED
        trigger: "POST /formats/{id}/assign-isbn"
        actor: Publisher
        preconditions:
          - "isbn.status == FREE"
          - "isbn.publisher_id == the acting publisher AND == the format's title's publisher_id  [business_referential: ERR_ISBN_NOT_AVAILABLE]"
        side_effects:
          - "sets isbn.assigned_format_id = format.id and Format.isbn_id = isbn.id"
          - "increments Format.version by 1"
      - from: ASSIGNED
        to: FREE
        trigger: "POST /formats/{id}/release-isbn"
        actor: Publisher
        preconditions:
          - "isbn.status == ASSIGNED AND isbn.assigned_format_id == format.id"
        side_effects:
          - "clears isbn.assigned_format_id and Format.isbn_id (compensation; restores pool FREE count)"
          - "increments Format.version by 1"
      - from: ASSIGNED
        to: LOCKED
        trigger: "system, caused by POST /formats/{id}/publish (CASCADE A link2)"
        actor: system
        preconditions:
          - "the format the ISBN is assigned to transitions CONTENT_LOCKED -> PUBLISHED"
        side_effects:
          - "the ISBN is permanently bound to the published format (terminal)"

  - entity: Proof
    initial_state: ORDERED
    terminal_states: [APPROVED, REVISION_REQUESTED]
    transitions:
      - from: ORDERED
        to: APPROVED
        trigger: "POST /proofs/{id}/approve"
        actor: Publisher
        preconditions:
          - "proof.status == ORDERED"
        side_effects:
          - "marks the format proof-approved so it may be published"
      - from: ORDERED
        to: REVISION_REQUESTED
        trigger: "POST /proofs/{id}/request-revision"
        actor: Publisher
        preconditions:
          - "proof.status == ORDERED"
        side_effects:
          - "captures revision_notes"
          - "CASCADE: if the parent Format is CONTENT_LOCKED it transitions CONTENT_LOCKED -> DRAFT (revision cycle)"

  - entity: DistributionRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /distribution-requests/{id}/approve"
        actor: Reviewer
        preconditions:
          - "dr.status == REQUESTED"
        side_effects:
          - "BRANCH-APPROVED side-effect set: if the Format (format_id) is already PUBLISHED, the request immediately transitions APPROVED -> LIVE (see below); otherwise it waits in APPROVED for the format to publish (CASCADE A link2)"
      - from: APPROVED
        to: LIVE
        trigger: "POST /distribution-requests/{id}/approve when Format PUBLISHED, OR system on Format publish"
        actor: Reviewer | system
        preconditions:
          - "dr.status == APPROVED"
          - "Format (format_id).status == PUBLISHED  [cross-entity DistributionRequest->Format]"
        side_effects:
          - "CASCADE A link3: parent Title transitions DRAFT -> LIVE if not already LIVE"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /distribution-requests/{id}/reject"
        actor: Reviewer
        preconditions:
          - "dr.status == REQUESTED"
        side_effects:
          - "BRANCH-REJECTED side-effect set (divergent from APPROVED): captures reason; Format and Title states are untouched; no LIVE transition ever reachable"
      - from: LIVE
        to: WITHDRAWN
        trigger: "POST /distribution-requests/{id}/withdraw"
        actor: Publisher
        preconditions:
          - "dr.status == LIVE"
        side_effects:
          - "CASCADE B link1: DistributionRequest -> WITHDRAWN"
          - "link2 (caused by link1): if no remaining LIVE DistributionRequest for the Format, Format transitions PUBLISHED -> UNLISTED"

  - entity: RoyaltyStatement
    initial_state: ACCRUING
    terminal_states: [PAID]
    transitions:
      - from: ACCRUING
        to: ISSUED
        trigger: "POST /royalty-statements/{id}/issue"
        actor: PlatformAdmin
        preconditions:
          - "statement.status == ACCRUING"
          - "statement.period_end <= clock.now  [business_temporal: ERR_PERIOD_NOT_ENDED]"
          - "exists >= 1 PENDING SalesLine swept into this period  [business_referential: ERR_NO_SALES_IN_PERIOD]"
        side_effects:
          - "sweeps every PENDING SalesLine of this publisher whose sale_date in [period_start, period_end]: sets its status PENDING -> STATEMENTED"
          - "computes gross_royalty_cents, reserve_held_cents (per-line-rounded sum), reserve_released_cents (final variant), net_payable_cents"
          - "increments Publisher.reserve_held_cents is NOT re-run here (already maintained on ingest); statement only reports"
      - from: ISSUED
        to: PAID
        trigger: "POST /royalty-statements/{id}/pay"
        actor: PlatformAdmin
        preconditions:
          - "statement.status == ISSUED"
        side_effects:
          - "increments Publisher.lifetime_paid_cents by net_payable_cents"

  - entity: Title
    initial_state: DRAFT
    terminal_states: [UNLISTED]
    transitions:
      - from: DRAFT
        to: LIVE
        trigger: "system, caused by a DistributionRequest of one of the title's formats reaching LIVE (CASCADE A link3)"
        actor: system
        preconditions:
          - "at least one DistributionRequest of a Format under this Title is LIVE"
        side_effects: []
      - from: LIVE
        to: UNLISTED
        trigger: "system, caused by every Format of the title reaching UNLISTED (CASCADE B link3)"
        actor: system
        preconditions:
          - "every Format with title_id == title.id is UNLISTED"
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on parent Format.version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: price-create-stale-format
    parent_entity: Format
    write_endpoint: "POST /formats/{id}/prices"
    occ_field: "expected_format_version"
    description: |
      Creating a new open-ended ChannelPrice for a (format, channel, territory)
      supersedes the prior open-ended default for that key (closing it). A create
      whose expected_format_version no longer matches the Format's current version
      is rejected: the client's view of the format is stale because another writer
      has already created (and thereby superseded with) a newer default price,
      advancing Format.version. The write is refused rather than silently stacking
      a second supersede on an out-of-date base.
    error_id: ERR_STALE_FORMAT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:
  - name: print_cost_per_unit
    trigger: "on Format create (PRINT) and whenever page_count/interior_color/trim_size change; recomputed on POST /titles/{id}/formats"
    algorithm: threshold          # tiered per-page rate + trim-band surcharge (>=3 inputs, non-linear)
    formula: |
      # Format.print_cost_cents. Applies only when format_type == PRINT (else null).
      base_rate = PER_PAGE_RATE_CENTS[interior_color]          # tier selection
      trim_band = "LARGE" if trim_size in {"7x10","8.5x11"} else "STANDARD"
      surcharge = LARGE_TRIM_SURCHARGE_CENTS_PER_PAGE if trim_band == "LARGE" else 0
      print_cost_cents = round_half_up(PRINT_FIXED_CHARGE_CENTS
                                       + page_count * base_rate
                                       + page_count * surcharge)
    input_set: "the single Format row (page_count, interior_color, trim_size)"
    constants:
      PRINT_FIXED_CHARGE_CENTS: 85
      PER_PAGE_RATE_CENTS: { BW: 1.2, STANDARD_COLOR: 7.0, PREMIUM_COLOR: 10.0 }
      LARGE_TRIM_SURCHARGE_CENTS_PER_PAGE: 0.5
      MIN_PAGE_COUNT: 24
    precision: "integer cents, round_half_up"
    variants: []

  - name: cover_spine_width
    trigger: "on COVER Asset create and re-evaluated at POST /assets/{id}/validate"
    algorithm: weighted_scoring
    formula: |
      # Asset.spine_width_mm (COVER only). Reads the parent Format.page_count (cross-entity).
      caliper = PAPER_CALIPER_MM[paper_type]
      spine_width_mm = round_half_up_2dp(Format.page_count * caliper)
      # validation passes iff abs(declared_spine_mm - spine_width_mm) <= SPINE_TOLERANCE_MM
    input_set: "this COVER Asset + the Format it belongs to (Format.page_count)"
    constants:
      PAPER_CALIPER_MM: { WHITE: 0.0572, CREAM: 0.0635, COLOR: 0.0572 }
      SPINE_TOLERANCE_MM: 0.5
    precision: "2 decimal places (mm), round_half_up"
    variants: []

  - name: royalty_per_unit
    trigger: "on POST /formats/{id}/prices (ChannelPrice create); snapshot stored on ChannelPrice.royalty_per_unit_cents"
    algorithm: tiered_pricing     # dual variant by format_type; ebook uses a price-band threshold
    formula: |
      # ChannelPrice.royalty_per_unit_cents. Evaluation order is fixed:
      #  1. resolve Format.format_type and Format.print_cost_cents (already computed)
      #  2. select variant by format_type
      #  3. apply rounding once, at the end (round_half_up to integer cents)
      # PRINT variant depends on distribution discount (expanded vs standard).
    input_set: "one ChannelPrice (list_price_cents, expanded_reach) + its Channel (rates) + its Format (format_type, print_cost_cents, file_size_mb)"
    constants: {}
    precision: "integer cents, round_half_up (single final rounding except the ebook delivery-fee which is pre-rounded)"
    variants:
      - name: print_royalty
        when: "Format.format_type == PRINT"
        difference: |
          disc = channel.distribution_discount_expanded if expanded_reach
                 else channel.distribution_discount_standard
          royalty_per_unit_cents = round_half_up(list_price_cents * (1 - disc)
                                                  - Format.print_cost_cents)
      - name: ebook_royalty
        when: "Format.format_type == EBOOK"
        difference: |
          # price-band threshold selection (Rule 6 boundary, inclusive both ends)
          if channel.ebook_rate_low_threshold_cents <= list_price_cents
             <= channel.ebook_rate_high_threshold_cents:
              rate = channel.ebook_high_rate
              delivery_fee = round_half_up(Format.file_size_mb
                                           * channel.delivery_fee_per_mb_cents)
          else:
              rate = channel.ebook_low_rate
              delivery_fee = 0        # delivery fee applies only inside the high band
          royalty_per_unit_cents = round_half_up(list_price_cents * rate - delivery_fee)

  - name: sales_line_amounts
    trigger: "on POST /sales-lines (ingest)"
    algorithm: aggregation
    formula: |
      # Selector: pick the ACTIVE ChannelPrice for (format_id, channel_id, territory)
      # whose window contains sale_date: effective_from <= sale_date AND
      # (effective_to is null OR sale_date < effective_to). If several qualify
      # (should not, given the overlap rule), tie-break by effective_from DESC then
      # created_at ASC. Empty candidate set -> ERR_NO_VALID_PRICE.
      royalty_per_unit_cents = selected_price.royalty_per_unit_cents
      magnitude = royalty_per_unit_cents * units
      if line_type == "SALE":
          gross_royalty_cents = magnitude
          reserve_held_cents  = round_half_up(magnitude * channel.returns_reserve_pct)
      else:  # RETURN
          gross_royalty_cents = -magnitude
          reserve_held_cents  = -round_half_up(magnitude * channel.returns_reserve_pct)
    input_set: "one SalesLine + selected ChannelPrice + its Channel (returns_reserve_pct)"
    constants: {}
    precision: "integer cents, round_half_up on the magnitude before sign application"
    variants: []

  - name: publisher_reserve_balance
    trigger: "on every POST /sales-lines (side effect); reconciles Publisher.reserve_held_cents"
    algorithm: aggregation
    formula: |
      # Conserved quantity (Rule 9): outstanding returns reserve.
      Publisher.reserve_held_cents = sum(SalesLine.reserve_held_cents
                                         for every SalesLine whose Format's Title
                                         has publisher_id == Publisher.id)
      # SALE lines add a positive reserve; a matching RETURN of identical
      # (royalty_per_unit_cents, units, channel) adds the exact negative, so a
      # sale fully returned leaves Publisher.reserve_held_cents unchanged.
    input_set: "all SalesLine rows belonging (via Format->Title) to the publisher"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: statement_rollup
    trigger: "provisional_net_cents maintained while ACCRUING; gross/reserve/released/net locked at POST /royalty-statements/{id}/issue"
    algorithm: chronological      # release depends on the publisher's prior-period statement, in period order
    formula: |
      swept = [ L for L in PENDING SalesLines of this publisher
                where period_start <= L.sale_date <= period_end ]     # closed inclusive
      gross_royalty_cents  = sum(L.gross_royalty_cents for L in swept)
      # ROUNDING ORDER IS PINNED: each L.reserve_held_cents was already rounded
      # per line at ingest; the statement SUMS the per-line rounded values
      # (round-per-line-then-sum), it does NOT re-round gross*pct.
      reserve_held_cents   = sum(L.reserve_held_cents for L in swept)
    input_set: "the PENDING SalesLines swept into [period_start, period_end] + the immediately-prior ISSUED statement of this publisher"
    constants:
      RESERVE_RELEASE_AFTER_PERIODS: 1
    precision: "integer cents; per-line reserve rounded at ingest, summed here"
    variants:
      - name: provisional_forward
        when: "read while status == ACCRUING (forward-looking estimate)"
        difference: |
          provisional_net_cents = gross_royalty_cents - reserve_held_cents
          # ignores any maturing release; reserve_released_cents treated as 0
      - name: final_chronological
        when: "locked at issue (status ACCRUING -> ISSUED)"
        difference: |
          prior = the ISSUED RoyaltyStatement of this publisher whose period_start
                  is the greatest that is strictly less than this.period_start
                  (i.e. the immediately-prior period; RESERVE_RELEASE_AFTER_PERIODS == 1).
                  Tie-break not required: statement periods never overlap (see §1.4).
          reserve_released_cents = prior.reserve_held_cents if prior exists else 0
          net_payable_cents = gross_royalty_cents - reserve_held_cents
                              + reserve_released_cents

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lower priority number wins)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for the endpoint per §1.7; for Publisher mutations the acting X-User-ID must own the target (title.publisher_id / format's title's publisher_id == X-User-ID)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all non-anonymous endpoints"
  - priority: 3
    category: existence
    check: "every id in the path and every FK in the body resolves to an existing row, validated left-to-right"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"
  - priority: 4
    category: state
    check: "target resource is in the required state for the transition (Asset PENDING; Format DRAFT/CONTENT_LOCKED/PUBLISHED per action; Proof ORDERED; DistributionRequest REQUESTED/LIVE; RoyaltyStatement ACCRUING/ISSUED)"
    error_id: ERR_*_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_temporal
    check: "POST issue: statement.period_end <= clock.now; POST prices: effective_to is null OR effective_to > effective_from"
    error_id: ERR_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /royalty-statements/{id}/issue, POST /formats/{id}/prices"
  - priority: 6
    category: business_referential
    check: "publish: format.isbn_id != null (ERR_ISBN_NOT_ASSIGNED); lock: an INTERIOR Asset is VALIDATED (ERR_MANUSCRIPT_NOT_VALIDATED); issue: >=1 PENDING SalesLine swept into the period (ERR_NO_SALES_IN_PERIOD); assign-isbn: the Isbn is FREE and belongs to the same publisher (ERR_ISBN_NOT_AVAILABLE); DistributionRequest->LIVE requires Format PUBLISHED (ERR_FORMAT_NOT_PUBLISHED)"
    error_id: ERR_ISBN_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST publish/lock/issue/assign-isbn, DistributionRequest activation"
  - priority: 7
    category: business_constraint
    check: "price window overlap on (format,channel,territory) half-open [from,to) with touching allowed (ERR_PRICE_WINDOW_OVERLAP); statement period overlap on publisher closed-inclusive [start,end] with touching REJECTED (ERR_STATEMENT_PERIOD_OVERLAP); channel supports format_type (ERR_CHANNEL_FORMAT_UNSUPPORTED); print interior page_count >= MIN_PAGE_COUNT (ERR_PAGE_COUNT_TOO_LOW); cover spine within tolerance (ERR_SPINE_MISMATCH); PRINT lock requires COVER VALIDATED (ERR_COVER_NOT_APPROVED)"
    error_id: ERR_PRICE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST prices, create statement, create distribution-request, validate asset, lock"
  - priority: 8
    category: business_fiscal
    check: "list_price_cents within [channel.min_list_price_cents, channel.max_list_price_cents] (ERR_PRICE_OUT_OF_BOUNDS); create distribution-request requires an ACTIVE ChannelPrice for (format,channel,territory) with list_price in bounds, else ERR_NO_VALID_PRICE"
    error_id: ERR_PRICE_OUT_OF_BOUNDS
    http_status: 422
    applies_to: "POST /formats/{id}/prices, POST /formats/{id}/distribution-requests"
  - priority: 9
    category: business_constraint
    check: "OCC: expected_format_version == Format.version on price create, else stale"
    error_id: ERR_STALE_FORMAT_VERSION
    http_status: 412
    applies_to: "POST /formats/{id}/prices"
  - priority: 10
    category: business_constraint
    check: "request body shape: required fields present, enum members valid, units > 0, prices > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all POST endpoints"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:
  # ---- Publisher ----
  - { method: POST, path: "/publishers", description: "create a publisher account", roles: [PlatformAdmin], code: 201, input: [name, email, "payout_method?"], output: Publisher, side_effects: [] }
  - { method: GET,  path: "/publishers/{id}", description: "read a publisher (with reserve balance)", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: Publisher, side_effects: [] }
  - { method: POST, path: "/publishers/{id}/isbns", description: "add an ISBN to the publisher's pool", roles: [PlatformAdmin], code: 201, input: [isbn_13], output: Isbn, side_effects: ["Isbn created FREE"] }
  - { method: POST, path: "/publishers/{id}/royalty-statements", description: "open an ACCRUING statement for a period", roles: [PlatformAdmin], code: 201, input: [period_start, period_end], output: RoyaltyStatement, side_effects: ["validates no period overlap (closed-inclusive) with existing statements"] }

  # ---- Title ----
  - { method: POST, path: "/titles", description: "create a title (metadata + category)", roles: [Publisher], code: 201, input: [publisher_id, title, "subtitle?", language, bisac_category], output: Title, side_effects: [] }
  - { method: GET,  path: "/titles/{id}", description: "read a title", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: Title, side_effects: [] }
  - { method: GET,  path: "/titles", description: "list titles, filterable by publisher (FK reverse for Title.publisher_id)", roles: [Publisher, PlatformAdmin], code: 200, input: ["publisher_id?", "limit?", "offset?"], output: "Title[]", side_effects: [] }

  # ---- Format ----
  - { method: POST, path: "/titles/{id}/formats", description: "create a format (print/ebook/audio) under a title", roles: [Publisher], code: 201, input: [format_type, "trim_size?", "interior_color?", "page_count?", "file_size_mb?"], output: Format, side_effects: ["computes print_cost_cents for PRINT (calc print_cost_per_unit)"] }
  - { method: GET,  path: "/formats/{id}", description: "read a format", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: Format, side_effects: [] }
  - { method: GET,  path: "/formats", description: "list formats, filterable by title (FK reverse for Format.title_id)", roles: [Publisher, PlatformAdmin], code: 200, input: ["title_id?", "limit?", "offset?"], output: "Format[]", side_effects: [] }
  - { method: POST, path: "/formats/{id}/lock", description: "DRAFT -> CONTENT_LOCKED", roles: [Publisher], code: 200, input: [], output: Format, side_effects: ["increments Format.version"] }
  - { method: POST, path: "/formats/{id}/publish", description: "CONTENT_LOCKED -> PUBLISHED (CASCADE A)", roles: [Publisher], code: 200, input: [], output: Format, side_effects: ["Isbn ASSIGNED->LOCKED", "APPROVED DistributionRequests -> LIVE", "Title DRAFT->LIVE", "increments Format.version"] }
  - { method: POST, path: "/formats/{id}/assign-isbn", description: "assign a FREE pool Isbn to the format", roles: [Publisher], code: 200, input: [isbn_id], output: Format, side_effects: ["Isbn FREE->ASSIGNED, assigned_format_id set", "Format.isbn_id set", "increments Format.version"] }
  - { method: POST, path: "/formats/{id}/release-isbn", description: "release the assigned Isbn back to FREE (compensation)", roles: [Publisher], code: 200, input: [], output: Format, side_effects: ["Isbn ASSIGNED->FREE, assigned_format_id cleared", "Format.isbn_id cleared", "increments Format.version"] }
  - { method: POST, path: "/formats/{id}/prices", description: "create a ChannelPrice (OCC on Format.version; supersede + overlap rules)", roles: [Publisher], code: 201, input: [expected_format_version, channel_id, territory, list_price_cents, "currency?", effective_from, "effective_to?", "expanded_reach?"], output: ChannelPrice, side_effects: ["computes royalty_per_unit_cents (calc royalty_per_unit)", "supersedes prior open-ended ACTIVE price for the key (status SUPERSEDED, effective_to set)", "increments Format.version by 1"] }
  - { method: POST, path: "/formats/{id}/proofs", description: "order a proof copy (round_number auto-increments)", roles: [Publisher], code: 201, input: [], output: Proof, side_effects: ["Proof ORDERED with next round_number"] }
  - { method: POST, path: "/formats/{id}/distribution-requests", description: "request distribution to a channel/territory (optional expanded reach)", roles: [Publisher], code: 201, input: [channel_id, territory, "expanded_reach?"], output: DistributionRequest, side_effects: [] }

  # ---- Asset ----
  - { method: POST, path: "/formats/{id}/assets", description: "upload an interior or cover asset (COVER computes spine_width_mm)", roles: [Publisher], code: 201, input: [asset_type, file_ref, file_format, "declared_page_count?", "paper_type?", "declared_spine_mm?"], output: Asset, side_effects: ["COVER: computes spine_width_mm from Format.page_count (calc cover_spine_width)"] }
  - { method: POST, path: "/assets/{id}/validate", description: "PENDING -> VALIDATED or REJECTED", roles: [PlatformAdmin], code: 200, input: [], output: Asset, side_effects: ["COVER: recomputes spine_width_mm and checks tolerance", "sets rejection_reason on failure"] }
  - { method: GET,  path: "/assets/{id}", description: "read an asset", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: Asset, side_effects: [] }
  - { method: GET,  path: "/assets", description: "list assets, filterable by format (FK reverse for Asset.format_id)", roles: [Publisher, PlatformAdmin], code: 200, input: ["format_id?", "limit?", "offset?"], output: "Asset[]", side_effects: [] }

  # ---- Isbn ----
  - { method: GET,  path: "/isbns/{id}", description: "read an ISBN", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: Isbn, side_effects: [] }
  - { method: GET,  path: "/isbns", description: "list ISBNs, filterable by publisher or assigned format (FK reverse for Isbn.publisher_id and Isbn.assigned_format_id)", roles: [Publisher, PlatformAdmin], code: 200, input: ["publisher_id?", "assigned_format_id?", "limit?", "offset?"], output: "Isbn[]", side_effects: [] }

  # ---- Channel ----
  - { method: POST, path: "/channels", description: "create a sales channel (config: rates, discounts, reserve, price bounds)", roles: [PlatformAdmin], code: 201, input: [name, channel_type, supports_formats, "ebook_high_rate?", "ebook_low_rate?", "ebook_rate_low_threshold_cents?", "ebook_rate_high_threshold_cents?", "delivery_fee_per_mb_cents?", distribution_discount_standard, distribution_discount_expanded, returns_reserve_pct, min_list_price_cents, max_list_price_cents], output: Channel, side_effects: [] }
  - { method: GET,  path: "/channels/{id}", description: "read a channel config", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: Channel, side_effects: [] }

  # ---- ChannelPrice ----
  - { method: GET,  path: "/prices/{id}", description: "read a channel price", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: ChannelPrice, side_effects: [] }
  - { method: GET,  path: "/prices", description: "list prices, filterable by format and/or channel (FK reverse for ChannelPrice.format_id and ChannelPrice.channel_id)", roles: [Publisher, PlatformAdmin], code: 200, input: ["format_id?", "channel_id?", "limit?", "offset?"], output: "ChannelPrice[]", side_effects: [] }

  # ---- Proof ----
  - { method: POST, path: "/proofs/{id}/approve", description: "ORDERED -> APPROVED", roles: [Publisher], code: 200, input: [], output: Proof, side_effects: [] }
  - { method: POST, path: "/proofs/{id}/request-revision", description: "ORDERED -> REVISION_REQUESTED (unlocks format: revision cycle)", roles: [Publisher], code: 200, input: ["revision_notes?"], output: Proof, side_effects: ["Format CONTENT_LOCKED -> DRAFT if locked"] }
  - { method: GET,  path: "/proofs/{id}", description: "read a proof", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: Proof, side_effects: [] }
  - { method: GET,  path: "/proofs", description: "list proofs, filterable by format (FK reverse for Proof.format_id)", roles: [Publisher, PlatformAdmin], code: 200, input: ["format_id?", "limit?", "offset?"], output: "Proof[]", side_effects: [] }

  # ---- DistributionRequest ----
  - { method: POST, path: "/distribution-requests/{id}/approve", description: "REQUESTED -> APPROVED (-> LIVE if format PUBLISHED)", roles: [Reviewer], code: 200, input: [], output: DistributionRequest, side_effects: ["if Format PUBLISHED: -> LIVE, Title DRAFT->LIVE"] }
  - { method: POST, path: "/distribution-requests/{id}/reject", description: "REQUESTED -> REJECTED (divergent branch)", roles: [Reviewer], code: 200, input: ["reason?"], output: DistributionRequest, side_effects: ["captures reason"] }
  - { method: POST, path: "/distribution-requests/{id}/withdraw", description: "LIVE -> WITHDRAWN (CASCADE B)", roles: [Publisher], code: 200, input: [], output: DistributionRequest, side_effects: ["Format PUBLISHED->UNLISTED if no LIVE requests remain", "Title LIVE->UNLISTED if all formats UNLISTED"] }
  - { method: GET,  path: "/distribution-requests/{id}", description: "read a distribution request", roles: [Publisher, PlatformAdmin, Reviewer], code: 200, input: [], output: DistributionRequest, side_effects: [] }
  - { method: GET,  path: "/distribution-requests", description: "list distribution requests, filterable by format and/or channel (FK reverse for DistributionRequest.format_id and DistributionRequest.channel_id)", roles: [Publisher, PlatformAdmin, Reviewer], code: 200, input: ["format_id?", "channel_id?", "limit?", "offset?"], output: "DistributionRequest[]", side_effects: [] }

  # ---- Sales & Royalty ----
  - { method: POST, path: "/sales-lines", description: "ingest a sale/return line (computes royalty + reserve snapshots)", roles: [PlatformAdmin], code: 201, input: [format_id, channel_id, territory, units, line_type, sale_date], output: SalesLine, side_effects: ["computes royalty_per_unit_cents/gross_royalty_cents/reserve_held_cents (calc sales_line_amounts)", "reconciles Publisher.reserve_held_cents (calc publisher_reserve_balance)"] }
  - { method: GET,  path: "/sales-lines/{id}", description: "read a sales line", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: SalesLine, side_effects: [] }
  - { method: GET,  path: "/sales-lines", description: "list sales lines, filterable by format and/or channel (FK reverse for SalesLine.format_id and SalesLine.channel_id)", roles: [Publisher, PlatformAdmin], code: 200, input: ["format_id?", "channel_id?", "limit?", "offset?"], output: "SalesLine[]", side_effects: [] }
  - { method: POST, path: "/royalty-statements/{id}/issue", description: "ACCRUING -> ISSUED (sweeps lines, locks net_payable)", roles: [PlatformAdmin], code: 200, input: [], output: RoyaltyStatement, side_effects: ["sweeps PENDING SalesLines -> STATEMENTED", "computes gross/reserve_held/reserve_released/net_payable (calc statement_rollup)"] }
  - { method: POST, path: "/royalty-statements/{id}/pay", description: "ISSUED -> PAID", roles: [PlatformAdmin], code: 200, input: [], output: RoyaltyStatement, side_effects: ["increments Publisher.lifetime_paid_cents by net_payable_cents"] }
  - { method: GET,  path: "/royalty-statements/{id}", description: "read a royalty statement", roles: [Publisher, PlatformAdmin], code: 200, input: [], output: RoyaltyStatement, side_effects: [] }
  - { method: GET,  path: "/royalty-statements", description: "list statements, filterable by publisher (FK reverse for RoyaltyStatement.publisher_id)", roles: [Publisher, PlatformAdmin], code: 200, input: ["publisher_id?", "limit?", "offset?"], output: "RoyaltyStatement[]", side_effects: [] }

  # ---- Test-driving ----
  - { method: POST, path: "/_clock/set_current_utc", description: "set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["advances logical clock used by temporal validations"] }

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  # auth / shape
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "role not permitted, or Publisher acting on a resource it does not own" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "missing required field, bad enum, non-positive units/price, malformed body" }
  # not-found
  - { id: ERR_PUBLISHER_NOT_FOUND, http: 404, condition: "publisher id does not resolve" }
  - { id: ERR_TITLE_NOT_FOUND, http: 404, condition: "title id does not resolve" }
  - { id: ERR_FORMAT_NOT_FOUND, http: 404, condition: "format id does not resolve" }
  - { id: ERR_ASSET_NOT_FOUND, http: 404, condition: "asset id does not resolve" }
  - { id: ERR_ISBN_NOT_FOUND, http: 404, condition: "isbn id does not resolve" }
  - { id: ERR_CHANNEL_NOT_FOUND, http: 404, condition: "channel id does not resolve" }
  - { id: ERR_PROOF_NOT_FOUND, http: 404, condition: "proof id does not resolve" }
  - { id: ERR_DISTRIBUTION_NOT_FOUND, http: 404, condition: "distribution-request id does not resolve" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "royalty-statement id does not resolve" }
  - { id: ERR_PRICE_NOT_FOUND, http: 404, condition: "channel-price id does not resolve" }
  # state (409)
  - { id: ERR_ASSET_INVALID_STATE, http: 409, condition: "asset is not PENDING when validate is called" }
  - { id: ERR_FORMAT_INVALID_STATE, http: 409, condition: "format not in the required state for lock/publish/distribution-request/price action" }
  - { id: ERR_PROOF_INVALID_STATE, http: 409, condition: "proof not ORDERED when approve/request-revision is called" }
  - { id: ERR_DISTRIBUTION_INVALID_STATE, http: 409, condition: "distribution-request not in the required state for approve/reject/withdraw" }
  - { id: ERR_STATEMENT_INVALID_STATE, http: 409, condition: "statement not ACCRUING for issue, or not ISSUED for pay" }
  # business_referential (409)
  - { id: ERR_MANUSCRIPT_NOT_VALIDATED, http: 409, condition: "lock attempted before an INTERIOR asset is VALIDATED" }
  - { id: ERR_COVER_NOT_APPROVED, http: 409, condition: "PRINT lock attempted before a COVER asset is VALIDATED" }
  - { id: ERR_ISBN_NOT_ASSIGNED, http: 409, condition: "publish attempted with format.isbn_id == null" }
  - { id: ERR_ISBN_NOT_AVAILABLE, http: 409, condition: "assign-isbn on an Isbn that is not FREE or belongs to another publisher" }
  - { id: ERR_FORMAT_NOT_PUBLISHED, http: 409, condition: "distribution-request cannot reach LIVE because its Format is not PUBLISHED" }
  - { id: ERR_NO_SALES_IN_PERIOD, http: 409, condition: "issue attempted with zero PENDING sales lines swept into the period" }
  # business_temporal (409)
  - { id: ERR_PERIOD_NOT_ENDED, http: 409, condition: "issue attempted while period_end > clock.now" }
  - { id: ERR_INVALID_EFFECTIVE_WINDOW, http: 422, condition: "price effective_to <= effective_from" }
  # business_constraint (409)
  - { id: ERR_PRICE_WINDOW_OVERLAP, http: 409, condition: "new price window overlaps an existing ACTIVE price for (format,channel,territory); half-open, touching allowed" }
  - { id: ERR_STATEMENT_PERIOD_OVERLAP, http: 409, condition: "new statement period overlaps an existing period for the publisher; closed-inclusive, touching rejected" }
  - { id: ERR_CHANNEL_FORMAT_UNSUPPORTED, http: 422, condition: "format_type not in channel.supports_formats for a price or distribution-request" }
  - { id: ERR_PAGE_COUNT_TOO_LOW, http: 422, condition: "INTERIOR asset declared_page_count < MIN_PAGE_COUNT (24); surfaced as Asset.rejection_reason on a 200 validate response that moves the asset to REJECTED (not an HTTP error)" }
  - { id: ERR_SPINE_MISMATCH, http: 422, condition: "COVER declared_spine_mm differs from computed spine_width_mm beyond SPINE_TOLERANCE_MM (0.5); surfaced as Asset.rejection_reason on a 200 validate response that moves the asset to REJECTED (not an HTTP error)" }
  # business_fiscal (422/409)
  - { id: ERR_PRICE_OUT_OF_BOUNDS, http: 422, condition: "list_price_cents outside [channel.min_list_price_cents, channel.max_list_price_cents]" }
  - { id: ERR_NO_VALID_PRICE, http: 409, condition: "no ACTIVE in-bounds ChannelPrice exists for (format,channel,territory) when a distribution-request is created or a sale is ingested" }
  # concurrency (412)
  - { id: ERR_STALE_FORMAT_VERSION, http: 412, condition: "expected_format_version != Format.version on price create" }

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: Publisher
    description: "author / imprint; owns titles, formats, assets, proofs, prices, distribution requests; views own ISBNs and statements"
    identity: "entity_backed:Publisher"
    exclusive_operations:
      - "POST /titles (publisher_id must equal X-User-ID)"
      - "POST /titles/{id}/formats"
      - "POST /formats/{id}/assets"
      - "POST /formats/{id}/lock"
      - "POST /formats/{id}/publish"
      - "POST /formats/{id}/assign-isbn"
      - "POST /formats/{id}/release-isbn"
      - "POST /formats/{id}/prices"
      - "POST /formats/{id}/proofs"
      - "POST /proofs/{id}/approve"
      - "POST /proofs/{id}/request-revision"
      - "POST /formats/{id}/distribution-requests"
      - "POST /distribution-requests/{id}/withdraw"
    shared_operations:
      - "GET reads of own publisher, titles, formats, assets, isbns, prices, proofs, distribution-requests, sales-lines, royalty-statements (shared with PlatformAdmin)"
  - name: Reviewer
    description: "distribution reviewer; approves or rejects distribution requests (content/network gate)"
    identity: "opaque"
    exclusive_operations:
      - "POST /distribution-requests/{id}/approve"
      - "POST /distribution-requests/{id}/reject"
    shared_operations:
      - "GET /distribution-requests, GET /distribution-requests/{id}"
  - name: PlatformAdmin
    description: "platform operator; manages channels, ISBN pool, asset validation, sales ingestion, statements, payout, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /publishers"
      - "POST /channels"
      - "POST /publishers/{id}/isbns"
      - "POST /assets/{id}/validate"
      - "POST /sales-lines"
      - "POST /publishers/{id}/royalty-statements"
      - "POST /royalty-statements/{id}/issue"
      - "POST /royalty-statements/{id}/pay"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET reads across every entity (shared with Publisher / Reviewer)"
