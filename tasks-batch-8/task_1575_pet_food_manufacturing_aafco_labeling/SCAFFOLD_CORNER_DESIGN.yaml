              captures: { f_ver: $.data.version, f_status: $.data.status }
            - call: "POST /petfood/formulas/${f_id}/production-batches"
              payload: { planned_kg: 400.0, line_id: "LINE-V1", scheduled_start: "2026-08-26T08:00:00Z", expected_formula_version: "${f_ver}" }
              as: ProductionPlanner
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /petfood/production-batches/${b_id}/release"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
