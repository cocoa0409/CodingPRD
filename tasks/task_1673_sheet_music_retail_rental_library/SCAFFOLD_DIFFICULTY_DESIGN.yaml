              as: LibraryAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /library/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: LibraryAdmin
            - call: "POST /library/rental-orders"
              payload: { account_id: "${acct_id}", rental_set_id: "${set_id}", copies_requested: 1, checkout_date: "2026-08-05", due_date: "2026-09-04" }
              as: LibraryClerk
              captures: { o1: $.data.id }
            - call: "POST /library/rental-orders/${o1}/reserve"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o1}/dispatch"
              payload: {}
              as: LibraryClerk
            - call: "POST /library/rental-orders/${o1}/confirm-receipt"
              payload: {}
              as: Customer
              as_user_id: "${acct_id}"
            - call: "POST /library/rental-orders/${o1}/check-in"
              payload: { line_grades: "C" }
              as: ReturnsClerk
              as_user_id: "rc-shared-1"
            - call: "GET /library/rental-lines"
              payload: { rental_order_id: "${o1}" }
              as: BillingManager
              captures: { line1: "$.data[0].id" }
            - call: "GET /library/condition-reports"
              payload: { rental_line_id: "${line1}" }
              as: BillingManager
              captures: { rep1: "$.data[0].id" }
            - call: "POST /library/damage-invoices"
              payload: { rental_line_id: "${line1}", condition_report_id: "${rep1}" }
              as: BillingManager
              captures: { inv1: $.data.id }
          trigger:
            - call: "POST /library/damage-invoices/${inv1}/issue"
              payload: {}
              as: ReturnsClerk
              as_user_id: "rc-shared-1"
              captures: { err: $.data.error_id }
            - call: "POST /library/damage-invoices/${inv1}/issue"
              payload: {}
