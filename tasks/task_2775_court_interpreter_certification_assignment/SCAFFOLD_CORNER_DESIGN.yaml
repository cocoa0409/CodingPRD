              captures: { a2_status: "$.data.service_status", a2_v2: "$.data.version" }
            - call: "GET /hearings/${h2}"
              payload: {}
              as: SchedulingCoordinator
              captures: { h2_status: "$.data.status" }
            - call: "GET /courthouses/${ch_thrift}"
              payload: {}
              as: FiscalOfficer
              captures: { ch_enc1: "$.data.encumbered_pay_cents", ch_avail1: "$.data.available_pay_cents" }
            - call: "GET /interpreters/${iA}"
              payload: {}
