      - name: role_denial_precedes_project_existence_lookup
        claim_type: priority_ordering
        grounds:
          - validations[priority 2]
          - validations[priority 5]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_PROJECT_NOT_FOUND]
          - roles[TenantOccupant]
          - endpoints[POST /conversion-projects/{id}/engineering-reports]
        distinguishing_aspect: "With BOTH guards violated at once - a forbidden role AND a project id that
          does not exist - priority 2 wins, so the answer is 403 ERR_ROLE_NOT_PERMITTED and NOT 404. The
          second trigger fixes only the role and then gets the 404, proving the existence check is live
          and the ordering is what produced the 403."
        test_recipe:
          setup:
            - "One ConversionProject exists; the id 00000000-0000-0000-0000-000000000000 belongs to no
              project."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
          trigger:
            - call: "POST /conversion-projects/00000000-0000-0000-0000-000000000000/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "tenant-1" }
              as: TenantOccupant
              as_user_id: "tenant-1"
              captures: { err_role: "$.data.error_id" }
            - call: "POST /conversion-projects/00000000-0000-0000-0000-000000000000/engineering-reports"
              payload: { report_label: "ER-1", inspection_date: "2026-07-10T00:00:00Z", submitted_by_user_id: "eng-1" }
              as: LicensedEngineer
              as_user_id: "eng-1"
              captures: { err_missing: "$.data.error_id" }
          assert:
            - "after first trigger: http status == 403"
            - "after first trigger: ${err_role} == \"ERR_ROLE_NOT_PERMITTED\""
            - "after second trigger: http status == 404"
            - "after second trigger: ${err_missing} == \"ERR_PROJECT_NOT_FOUND\""
            - "GET /conversion-projects/${proj_id}/engineering-reports returns total_count == 0"
