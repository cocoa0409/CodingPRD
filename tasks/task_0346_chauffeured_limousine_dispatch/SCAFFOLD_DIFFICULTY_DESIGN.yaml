              payload: { action: "INVOICE" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: priority_existence_beats_temporal_on_reservation_create
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_TIME_WINDOW]
        distinguishing_aspect: "error-category pair existence(3) vs business_temporal(5): a create with a non-existent corporate_account_id AND planned_drop_at before pickup_at violates both; existence is checked first -> ERR_NOT_FOUND, not ERR_INVALID_TIME_WINDOW."
        test_recipe:
          setup:
            - "Valid SEDAN class exists; corporate_account_id points to a non-existent UUID; window is inverted."
          setup_api_calls:
            - call: "POST /vehicle-classes"
              payload: { code: "SEDAN", base_fare_cents: 5000, per_mile_cents: 250, hourly_rate_cents: 12000, wait_per_minute_cents: 200 }
              as: DispatchAdmin
              captures: { sedan: $.data.id }
          trigger:
