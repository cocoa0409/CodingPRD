          setup:
            - "One MitigationProject in DRAFT with one parcel and one ACTIVE DemolitionContractor (max_concurrent_work_orders 1, asbestos_certified true)."
            - "One DemolitionWorkOrder on that parcel with all four required UtilityDisconnection children CONFIRMED, so the work order is READY."
