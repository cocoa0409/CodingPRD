              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_c6}/physicians"
              payload: { npi: "4500000001", full_name: "Dr Reparse", specialty: "FAMILY_MEDICINE" }
              as: NetworkManager
              captures: { p_c6: "$.data.id" }
            - call: "POST /ipa/physicians/${p_c6}/state"
              payload: { to_state: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /ipa/physicians/${p_c6}/state"
              payload: { to_state: "ACTIVE" }
              as: NetworkManager
            - call: "POST /ipa/delegation-agreements/${agr_c6}/enrollees"
              payload: { external_member_id: "C6-0001", age_band: "ADULT", benefit_tier: "HMO", risk_score_bps: 10000, coverage_start_date: "2026-01-01T00:00:00Z" }
              as: IpaAdmin
              captures: { e_c6: "$.data.id", e_c6_v: "$.data.version" }
            - call: "POST /ipa/member-assignments"
              payload: { enrollee_id: "${e_c6}", physician_id: "${p_c6}", effective_date: "2026-01-01T00:00:00Z", assignment_source: "MANUAL", expected_enrollee_version: "${e_c6_v}" }
              as: NetworkManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: IpaAdmin
            - call: "POST /ipa/delegation-agreements/${agr_c6}/enrollment-files"
              payload: { coverage_month: "2026-07", payer_file_reference: "PFR-C6-2026-07" }
              as: IpaAdmin
              captures: { file_c6: "$.data.id" }
            - call: "POST /ipa/enrollment-files/${file_c6}/rows"
              payload: { external_member_id: "C6-0001", physician_npi: "4500000001", row_action: "ADD", claimed_capitation_cents: 20000, effective_date: "2026-07-01T00:00:00Z" }
              as: IpaAdmin
              captures: { row_c6: "$.data.id" }
            - call: "POST /ipa/enrollment-files/${file_c6}/state"
              payload: { to_state: "PARSED" }
              as: IpaAdmin
            - call: "POST /ipa/enrollment-files/${file_c6}/state"
              payload: { to_state: "RECONCILED" }
              as: IpaAdmin
            - call: "GET /ipa/enrollment-files/${file_c6}/remittances"
              payload: { status: "RECONCILED", limit: 10, offset: 0 }
              as: IpaAdmin
              captures: { rem_c6_first: "$.data[0].id", rem_c6_first_expected: "$.data[0].expected_capitation_cents" }
            - call: "POST /ipa/enrollment-files/${file_c6}/state"
              payload: { to_state: "DISPUTED", dispute_reason: "Payer roster excludes C6-0001" }
              as: PayerRepresentative
