            - { call: "POST /conf/teachers", payload: { full_name: "T2", email: "t2@x.edu", grade_band: "ELEMENTARY", subjects: [], supports_in_person: true }, as: SchoolAdmin, captures: { t2: $.data.id } }
            - { call: "POST /conf/windows/${w}/publish", payload: {}, as: SchoolAdmin, captures: { w_v2: $.data.version } }
            - { call: "POST /conf/windows/${w}/generate-slots", payload: { expected_window_version: "${w_v2}" }, as: SchoolAdmin }
            - { call: "GET /conf/teachers/${t1}/slots", payload: { window_id: "${w}" }, as: SchoolAdmin, captures: { t1s0: "$.data[0].id" } }
            - { call: "POST /conf/windows/${w}/open-booking", payload: {}, as: SchoolAdmin }
            - { call: "POST /conf/families", payload: { primary_guardian_name: "G", email: "g@x.com", preferred_language: "es" }, as: FrontOfficeStaff, captures: { fam: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S1", grade_level: 3 }, as: FrontOfficeStaff, captures: { st1: $.data.id } }
            - { call: "POST /conf/families/${fam}/students", payload: { full_name: "S2", grade_level: 4 }, as: FrontOfficeStaff, captures: { st2: $.data.id } }
            - { call: "POST /conf/students/${st1}/teacher-links", payload: { teacher_id: "${t1}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/students/${st2}/teacher-links", payload: { teacher_id: "${t2}", is_homeroom: true }, as: FrontOfficeStaff }
            - { call: "POST /conf/bookings", payload: { slot_id: "${t1s0}", student_id: "${st1}", channel: "IN_PERSON", interpreter_language: "es" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { bk: $.data.id } }
            - { call: "GET /conf/interpreter-requests", payload: { booking_id: "${bk}" }, as: FrontOfficeStaff, captures: { r: "$.data[0].id" } }
            - { call: "POST /conf/waitlist-entries", payload: { window_id: "${w}", student_id: "${st2}", teacher_id: "${t2}", channel_pref: "EITHER" }, as: FamilyGuardian, as_user_id: "${fam}", captures: { e2: $.data.id } }
