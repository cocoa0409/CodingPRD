  - rule_id: combinatorial_formula
    instances:
      - name: evidence_strength_rounds_per_link_then_sums
        grounds:
          - calculations.evidence_strength
          - entities.EvidenceLink.fields.contribution
          - entities.Finding.fields.evidence_strength
        distinguishing_aspect: |
          Mode (b) - nested rounding whose order changes the result: three OBSERVED_BEHAVIOR links on
          a DIARY_STUDY each round 0.85 * 1.10 = 0.935 up to 0.94 BEFORE summing, giving 2.82 / 4.00
          = 0.71, whereas summing the unrounded products (2.805) and rounding afterwards would give
          0.70. The scaffold pins round-per-link-then-sum and the test discriminates 0.71 from 0.70.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "BEHAVIORAL_LONGITUDINAL request triaged APPROVED so approved_method == DIARY_STUDY"
            - "One participant, consented for RECORDING, TRANSCRIPT and PII_QUOTE with retention_days 90"
            - "DIARY_STUDY fielded 2026-08-03..2026-08-21, participant invited, screened in, scheduled, completed"
            - "Three artifacts on that one session: RECORDING, TRANSCRIPT, PII_NOTE"
            - "One DRAFT finding already carrying two OBSERVED_BEHAVIOR links"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Diary of first-run setup", reversibility: "REVERSIBLE", decision_deadline: "2026-11-01T00:00:00Z", impacted_user_count: 3000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
