          setup: ["A lead (version 1) with a COMPLETED inspection; one scope already created, advancing Lead.version to 2."]
          setup_api_calls:
            - { call: "POST /foundation/leads", payload: { customer_name: "Oc Owner", property_address: "28 Oc St", contact_email: "oc@x.com", region_code: "NORTH" }, as: SalesAgent, captures: { lead_id: "$.data.id", lead_v: "$.data.version" } }
