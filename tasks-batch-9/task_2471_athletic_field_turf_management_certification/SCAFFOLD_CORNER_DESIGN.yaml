            - "a second POST /turf/safety-assessments/{id}/void likewise returns 409 ERR_ASSESSMENT_NOT_RECORDED, so non-idempotence is systematic"

      - name: task_completion_credits_outstanding_rest_debt_as_ledger_side_effect
        claim_type: side_effect_execution
        grounds:
