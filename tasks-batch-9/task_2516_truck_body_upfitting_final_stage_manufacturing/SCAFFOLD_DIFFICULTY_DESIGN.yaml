            - "Chassis.${ch}.allocated_upfit_order_id == ${uo}"
            - "UpfitOrder.${uo}.chassis_id == ${ch}"
            - "UpfitOrder.${uo}.build_status == DRAFT — binding a unit does not advance the production dimension"

