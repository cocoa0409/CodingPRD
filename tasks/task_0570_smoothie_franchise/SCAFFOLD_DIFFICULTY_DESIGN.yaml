    instances:
      - name: loyalty_points_conserved_on_pay_then_cancel
        grounds:
          - state_machines.Order.pay
          - state_machines.Order.cancel
          - entities.Customer.fields.points_balance
          - entities.PointsTransaction.fields.delta
        distinguishing_aspect: "Conserved quantity = loyalty points: EARN(+5) at pay then CLAWBACK(-5) at cancel leaves points_balance == 0 == SUM(PointsTransaction.delta); the named global (balance == ledger sum) has zero drift."
        test_recipe:
          setup:
            - "OPEN store with inventory; BRONZE customer (balance 0); a base-500 SMALL order placed."
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
