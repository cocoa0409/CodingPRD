# =============================================================================
# SCAFFOLD.yaml — task_3356_full_time_service_corps_placement_schools_stipend
# §1.0–§1.7 seed tables. Beyond-expert difficulty: 11 entities, 40 endpoints,
# 30 errors, 7 calculations, 3 OCC rules, depth-3 cascades, cyclic machines.
# =============================================================================

scenario: |
  Full-Time Service Corps Placement in Schools & Stipend Administration (City Year): corps member recruitment and selection with age, education and service eligibility requirements, school partnership agreements defining team size, service scope and district cost share, team placement in partner schools with student caseload assignment for tutoring and attendance support, living stipend and education award administration under national service program rules with hour tracking, service hour verification and minimum thresholds required for the education award, corps member training, coaching and mid-year attrition management with team backfill limits, student outcome data sharing agreements with districts and evaluation reporting, site funding from district contributions, philanthropy and federal grants

domain_name: service-corps-placement
api_prefix: /corps

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, derived_field_reconciliation]
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# All dates are ISO calendar dates (YYYY-MM-DD); datetimes are ISO8601 UTC.
# common_fields: true expands to id (server-minted UUID, no type prefix),
# created_at, updated_at (refreshed on every mutation including cascaded side
# effects), version (integer, starts at 1, +1 on every mutation).
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: city, type: string, source: input, description: "City the site serves" }
      - { name: service_year_start, type: string, source: input, description: "Service year start date (YYYY-MM-DD); hour entries may not predate it" }
      - { name: service_year_end, type: string, source: input, description: "Service year end date (YYYY-MM-DD); must be after service_year_start" }
      - { name: annual_stipend_cents, type: integer, source: input, description: "Per-member annual living stipend in cents; > 0" }
      - { name: district_committed_cents, type: integer, source: input, default: 0, description: "Committed district cost-share funding; >= 0" }
      - { name: philanthropy_committed_cents, type: integer, source: input, default: 0, description: "Committed philanthropic funding; >= 0" }
      - { name: federal_committed_cents, type: integer, source: input, default: 0, description: "Committed federal grant funding; >= 0" }
      - { name: district_received_cents, type: integer, source: computed, description: "District funding received to date; starts 0, advanced by funding receive" }
      - { name: philanthropy_received_cents, type: integer, source: computed, description: "Philanthropy received to date; starts 0" }
      - { name: federal_received_cents, type: integer, source: computed, description: "Federal grant received to date; starts 0" }
      - { name: total_received_cents, type: integer, source: computed, description: "= district_received_cents + philanthropy_received_cents + federal_received_cents" }
      - { name: stipend_outlay_cents, type: integer, source: computed, description: "= sum(net_amount_cents over this site's StipendPayments in PAID) - sum(net_amount_cents over CLAWED_BACK); starts 0" }
      - { name: projected_obligations_cents, type: integer, source: computed, description: "= annual_stipend_cents x count of this site's CorpsMembers with stipend_status == ACTIVE" }
      - { name: funding_headroom_cents, type: integer, source: computed, description: "= total_received_cents - stipend_outlay_cents - projected_obligations_cents" }
      - { name: funding_posture, type: enum, source: computed, description: "FUNDED | TIGHT | DEFICIT — derived per calculations.site_funding_posture" }
      - { name: cost_share_installment_1_cents, type: integer, source: computed, description: "Sum over schools (agreement SIGNED/ACTIVE/AMENDMENT_REVIEW/COMPLETED) of per-school rounded installment 1 — calculations.district_cost_share_installments" }
      - { name: cost_share_installment_2_cents, type: integer, source: computed, description: "Sum of per-school installment 2 = annual_cost_share_cents - installment_1" }
      - { name: cost_share_total_cents, type: integer, source: computed, description: "= cost_share_installment_1_cents + cost_share_installment_2_cents" }
      - { name: status, type: enum, source: system, description: "SETUP | ACTIVE | CLOSED" }

  - name: School
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; the operating site" }
      - { name: name, type: string, source: input, description: "School name" }
      - { name: district_name, type: string, source: input, description: "Partner district name (data-sharing agreement counterparty)" }
      - { name: team_size, type: integer, source: input, description: "Contracted team size; >= 3", constraints: ">= 3" }
      - { name: service_scope, type: array, source: input, description: "Non-empty subset of ATTENDANCE_SUPPORT | LITERACY_TUTORING | MATH_TUTORING | WHOLE_SCHOOL_EVENTS" }
      - { name: annual_cost_share_cents, type: integer, source: input, description: "District cost share per year for this school; >= 0", constraints: ">= 0" }
      - { name: agreement_status, type: enum, source: system, description: "DRAFT | SIGNED | ACTIVE | AMENDMENT_REVIEW | SUSPENDED | COMPLETED | TERMINATED" }
      - { name: data_sharing_status, type: enum, source: system, description: "DRAFT | SIGNED | EXPIRED — independent state dimension for student outcome data sharing" }

  - name: CorpsMemberApplication
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; site the applicant applies to" }
      - { name: full_name, type: string, source: input, description: "Applicant full name" }
      - { name: date_of_birth, type: string, source: input, description: "Applicant date of birth (YYYY-MM-DD); age at site.service_year_start must be >= 17 and <= 25" }
      - { name: education_level, type: enum, source: input, description: "LESS_THAN_HS | HS_DIPLOMA | GED | SOME_COLLEGE | ASSOCIATES | BACHELORS_PLUS; LESS_THAN_HS is ineligible" }
      - { name: citizenship_status, type: enum, source: input, description: "US_CITIZEN | US_NATIONAL | PERMANENT_RESIDENT | OTHER; OTHER is ineligible" }
      - { name: prior_service_terms, type: integer, source: input, description: "Prior national service terms; must be < 4", constraints: ">= 0" }
      - { name: prior_full_awards_received, type: integer, source: input, description: "Prior full education awards received; must be < 2", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SCREENED_ELIGIBLE | INTERVIEWED | OFFERED | ACCEPTED | ENROLLED | REJECTED | WITHDRAWN | DECLINED" }
      - { name: rejection_reason, type: enum, source: system, description: "BACKGROUND_CHECK_FAILED | APPLICANT_WITHDREW | OFFER_DECLINED | null; set when status becomes REJECTED/WITHDRAWN/DECLINED" }
      - { name: enrolled_member_id, type: string, source: system, description: "ID of the CorpsMember created when this application reaches ENROLLED; null until then" }

  - name: CorpsMember
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: system, description: "FK -> Site.id; copied from the enrolled application" }
      - { name: full_name, type: string, source: system, description: "Copied from the enrolled application" }
      - { name: service_status, type: enum, source: system, description: "ENROLLED | ACTIVE | SUSPENDED | EXITED_EARLY | COMPLETED — service dimension" }
      - { name: stipend_status, type: enum, source: system, description: "NOT_STARTED | ACTIVE | SUSPENDED | ENDED — stipend dimension, evolves semi-independently" }
      - { name: award_status, type: enum, source: system, description: "NOT_EARNED | EARNED_FULL | EARNED_PARTIAL | FORFEITED | DISBURSED — education award dimension" }
      - { name: verified_hours_total, type: number, source: computed, description: "Sum of hours over this member's ServiceHourEntries in VERIFIED only; starts 0 (calculations.verified_hour_aggregation)" }
      - { name: verified_fundraising_hours, type: number, source: computed, description: "Sum of hours over VERIFIED entries with category FUNDRAISING; starts 0" }
      - { name: projected_hours_total, type: number, source: computed, description: "= verified_hours_total + 8.0 x calendar days from day after logical-clock date through site.service_year_end inclusive (forward-looking; calculations.education_award)" }
      - { name: award_projected_cents, type: integer, source: computed, description: "Projection variant of the education award on projected_hours_total; 739500 if projected >= 120, pro-rata if >= 24, else 0" }
      - { name: award_amount_cents, type: integer, source: system, description: "Certified award set at exit; null until exit" }
      - { name: exit_type, type: enum, source: system, description: "COMPLETED_TERM | COMPELLING_CIRCUMSTANCE | FOR_CAUSE | NON_COMPELLING | null" }
      - { name: exit_date, type: string, source: system, description: "Date of exit; null until exit" }
      - { name: net_stipend_received_cents, type: integer, source: computed, description: "= sum(net over own PAID payments) - sum(net over own CLAWED_BACK payments); starts 0" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of own TeamAssignments with status ACTIVE; starts 0" }
      - { name: active_caseload_count, type: integer, source: computed, description: "Count of Students with assigned_member_id == this member AND caseload_status == ASSIGNED; starts 0" }

  - name: Team
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; placement school" }
      - { name: name, type: string, source: input, description: "Team name" }
      - { name: team_size_snapshot, type: integer, source: system, description: "school.team_size copied at creation; FROZEN — later school amendments do not retro-update existing teams" }
      - { name: min_active_members, type: integer, source: computed, description: "= team_size_snapshot - 2" }
      - { name: backfill_limit, type: integer, source: input, default: 2, description: "Max number of post-DEPLOYED (backfill) assignments ever allowed on this team; >= 0" }
      - { name: backfill_deadline, type: string, source: input, description: "Last date (YYYY-MM-DD) on which a backfill assignment may be created" }
      - { name: backfill_count, type: integer, source: computed, description: "Number of assignments created while team status was DEPLOYED or UNDERSTAFFED; starts 0" }
      - { name: active_assignment_count, type: integer, source: computed, description: "Count of TeamAssignments on this team with status ACTIVE; starts 0" }
      - { name: status, type: enum, source: system, description: "FORMING | DEPLOYED | UNDERSTAFFED | COMPLETED | DISSOLVED" }

  - name: TeamAssignment
    parent: null
    common_fields: true
    fields:
      - { name: team_id, type: string, source: system, description: "FK -> Team.id; taken from the creation path" }
      - { name: corps_member_id, type: string, source: input, description: "FK -> CorpsMember.id; the placed member" }
      - { name: role, type: enum, source: input, default: "CORPS_MEMBER", description: "CORPS_MEMBER | TEAM_LEADER" }
      - { name: start_date, type: string, source: input, description: "First covered date (YYYY-MM-DD); assignment occupies the half-open interval [start_date, end_date)" }
      - { name: end_date, type: string, source: system, description: "First uncovered date (exclusive); null while open-ended" }
      - { name: is_backfill, type: boolean, source: computed, description: "True iff the team was DEPLOYED or UNDERSTAFFED at creation time" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ENDED" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; focus-list school" }
      - { name: external_student_ref, type: string, source: input, description: "District-issued student reference (opaque)" }
      - { name: grade_level, type: integer, source: input, description: "Grade 0-12", constraints: "0 <= g <= 12" }
      - { name: focus_list_type, type: enum, source: input, description: "ATTENDANCE | LITERACY | MATH" }
      - { name: baseline_attendance_pct, type: number, source: input, description: "Baseline attendance percentage 0..100 (one decimal)" }
      - { name: current_attendance_pct, type: number, source: system, description: "Most recent attendance percentage posted via the metrics endpoint; null until first post" }
      - { name: enrollment_status, type: enum, source: system, description: "ACTIVE | EXITED" }
      - { name: caseload_status, type: enum, source: system, description: "UNASSIGNED | ASSIGNED — cyclic: re-ASSIGN after UNASSIGN is allowed" }
      - { name: assigned_member_id, type: string, source: system, description: "FK -> CorpsMember.id; member currently holding this student on caseload; null when UNASSIGNED" }
      - { name: assigned_start_date, type: string, source: system, description: "Date the current (or most recent) caseload assignment began" }
      - { name: assigned_end_date, type: string, source: system, description: "Date the most recent caseload assignment ended; null while ASSIGNED or never assigned" }

  - name: ServiceHourEntry
    parent: null
    common_fields: false
    fields:
      - { name: corps_member_id, type: string, source: input, description: "FK -> CorpsMember.id; must equal X-User-ID when created by a CorpsMember" }
      - { name: service_date, type: string, source: input, description: "Date served (YYYY-MM-DD); >= site.service_year_start and <= logical-clock date" }
      - { name: hours, type: number, source: input, description: "Hours served; > 0, <= 12, and an exact multiple of 0.25" }
      - { name: category, type: enum, source: input, description: "DIRECT_SERVICE | TRAINING | FUNDRAISING" }
      - { name: description, type: string, source: input, description: "Free-text note", default: "" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED | VOIDED" }
      - { name: review_reason, type: string, source: system, description: "Reason recorded on REJECT or VOID; null otherwise" }
      - { name: reviewed_by, type: string, source: system, description: "X-User-ID of the reviewing ProgramManager; null while PENDING" }

  - name: StipendPayment
    parent: null
    common_fields: true
    fields:
      - { name: corps_member_id, type: string, source: system, description: "FK -> CorpsMember.id; taken from the creation path" }
      - { name: period_start, type: string, source: input, description: "First day of the pay period (inclusive); unique per member" }
      - { name: period_end, type: string, source: input, description: "Last day of the pay period (inclusive); >= period_start" }
      - { name: period_days, type: integer, source: computed, description: "= (period_end - period_start) + 1 calendar days" }
      - { name: base_amount_cents, type: integer, source: computed, description: "Provisional variant: round_half_up(site.annual_stipend_cents / 26); set at creation" }
      - { name: final_gross_cents, type: integer, source: computed, description: "Final variant: round_half_up(base_amount_cents x period_days / 14); set at APPROVED, null before" }
      - { name: deduction_cents, type: integer, source: input, default: 0, description: "Deductions applied at approval; >= 0" }
      - { name: net_amount_cents, type: integer, source: computed, description: "= max(0, final_gross_cents - deduction_cents); set at APPROVED, null before" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | APPROVED | PAID | FORFEITED | CLAWED_BACK" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the StipendAdministrator who created the payment" }
      - { name: approved_by, type: string, source: system, description: "X-User-ID of the approver; null until APPROVED" }
      - { name: decision_reason, type: string, source: system, description: "Reason recorded on FORFEIT or CLAWBACK; null otherwise" }

  - name: EvaluationReport
    parent: null
    common_fields: true
    fields:
      - { name: school_id, type: string, source: input, description: "FK -> School.id; reported school" }
      - { name: period_start, type: string, source: input, description: "Reporting period first day (inclusive)" }
      - { name: period_end, type: string, source: input, description: "Reporting period last day (inclusive); >= period_start" }
      - { name: eligible_student_count, type: integer, source: computed, description: "Students of the school with enrollment_status in {ACTIVE, EXITED} whose caseload interval overlaps [period_start, period_end] (calculations.evaluation_metrics)" }
      - { name: improved_student_count, type: integer, source: computed, description: "Eligible students with current_attendance_pct not null and current - baseline >= 5.0" }
      - { name: pct_improved, type: number, source: computed, description: "round_half_up(100.0 x improved / eligible, 1 decimal); 0.0 when eligible == 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | ACCEPTED" }
      - { name: return_reason, type: string, source: system, description: "Reason recorded when RETURNED; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Site
    field: status
    initial_state: SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: SETUP
        to: ACTIVE
        trigger: "POST /corps/sites/{id}/state with to_status=ACTIVE"
        actor: SiteDirector
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /corps/sites/{id}/state with to_status=CLOSED"
        actor: SiteDirector
        preconditions:
          - "No CorpsMember of this site with service_status in {ENROLLED, ACTIVE, SUSPENDED} (else ERR_INVALID_STATE)"
          - "No Team of this site's schools with status in {FORMING, DEPLOYED, UNDERSTAFFED} (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: School
    field: agreement_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /corps/schools/{id}/state with dimension=AGREEMENT, to_status=SIGNED"
        actor: SchoolLiaison
        preconditions:
          - "X-User-ID == this School.id (else ERR_NOT_ENTITY_OWNER)"
        side_effects: []
      - from: SIGNED
        to: ACTIVE
        trigger: "POST /corps/schools/{id}/state with dimension=AGREEMENT, to_status=ACTIVE"
        actor: SiteDirector
        preconditions:
          - "data_sharing_status == SIGNED (else ERR_DATA_SHARING_NOT_SIGNED)"
          - "site.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Recompute site cost_share_* fields (school enters the calculations.district_cost_share_installments input set)"
      - from: ACTIVE
        to: AMENDMENT_REVIEW
        trigger: "POST /corps/schools/{id}/amend (OCC: expected_school_version)"
        actor: SiteDirector
        preconditions:
          - "expected_school_version == school.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Amended fields (team_size, annual_cost_share_cents, service_scope) take effect immediately"
          - "school.version increments by 1"
          - "Recompute site cost_share_* fields with the amended annual_cost_share_cents"
      - from: AMENDMENT_REVIEW
        to: ACTIVE
        trigger: "POST /corps/schools/{id}/state with dimension=AGREEMENT, to_status=ACTIVE"
        actor: SchoolLiaison
        preconditions:
          - "X-User-ID == this School.id (else ERR_NOT_ENTITY_OWNER)"
          - "data_sharing_status == SIGNED (else ERR_DATA_SHARING_NOT_SIGNED)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /corps/schools/{id}/state with dimension=AGREEMENT, to_status=SUSPENDED, or automatic when data_sharing_status becomes EXPIRED"
        actor: "SiteDirector | system"
        preconditions: []
        side_effects:
          - "Suspension blocks team creation/deployment and report submission until resumed"
      - from: AMENDMENT_REVIEW
        to: SUSPENDED
        trigger: "automatic when data_sharing_status becomes EXPIRED"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /corps/schools/{id}/state with dimension=AGREEMENT, to_status=ACTIVE"
        actor: SiteDirector
        preconditions:
          - "data_sharing_status == SIGNED (else ERR_DATA_SHARING_NOT_SIGNED)"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /corps/schools/{id}/state with dimension=AGREEMENT, to_status=COMPLETED"
        actor: SiteDirector
        preconditions:
          - "logical-clock date >= site.service_year_end (else ERR_INVALID_STATE)"
        side_effects:
          - "Teams at this school in {DEPLOYED, UNDERSTAFFED} auto-transition to COMPLETED; their ACTIVE TeamAssignments are ENDED with end_date = clock date"
          - "Recompute site cost_share_* fields (COMPLETED remains in the input set)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /corps/schools/{id}/state with dimension=AGREEMENT, to_status=TERMINATED"
        actor: SiteDirector
        preconditions: []
        side_effects:
          - "LINK 1: every Team with school_id == this school in {FORMING, DEPLOYED, UNDERSTAFFED} -> DISSOLVED"
          - "LINK 2 (caused by LINK 1): each dissolved team's ACTIVE TeamAssignments -> ENDED with end_date = clock date"
          - "LINK 3 (caused by LINK 2): for each member whose last ACTIVE assignment ends here (active_assignment_count becomes 0) and whose service_status == ACTIVE: stipend_status ACTIVE -> SUSPENDED, and that member's StipendPayments in SCHEDULED -> FORFEITED with decision_reason TEAM_DISSOLVED"
          - "Students of this school with enrollment_status ACTIVE -> EXITED; caseload_status ASSIGNED -> UNASSIGNED with assigned_end_date = clock date and assigned_member_id = null"
          - "Recompute site cost_share_* fields (TERMINATED leaves the input set)"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /corps/schools/{id}/state with dimension=AGREEMENT, to_status=TERMINATED"
        actor: SiteDirector
        preconditions: []
        side_effects:
          - "Same LINK 1..3 cascade as ACTIVE -> TERMINATED"
          - "Recompute site cost_share_* fields"

  - entity: School
    field: data_sharing_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /corps/schools/{id}/state with dimension=DATA_SHARING, to_status=SIGNED"
        actor: SchoolLiaison
        preconditions:
          - "X-User-ID == this School.id (else ERR_NOT_ENTITY_OWNER)"
        side_effects: []
      - from: SIGNED
        to: EXPIRED
        trigger: "POST /corps/schools/{id}/state with dimension=DATA_SHARING, to_status=EXPIRED"
        actor: "SchoolLiaison | SiteDirector"
        preconditions: []
        side_effects:
          - "If agreement_status is ACTIVE or AMENDMENT_REVIEW, agreement auto-transitions to SUSPENDED (conditional cascade)"
      - from: EXPIRED
        to: SIGNED
        trigger: "POST /corps/schools/{id}/state with dimension=DATA_SHARING, to_status=SIGNED"
        actor: SchoolLiaison
        preconditions:
          - "X-User-ID == this School.id (else ERR_NOT_ENTITY_OWNER)"
        side_effects:
          - "agreement_status stays SUSPENDED; a SiteDirector must resume it explicitly"

  - entity: CorpsMemberApplication
    field: status
    initial_state: SUBMITTED
    terminal_states: [ENROLLED, REJECTED, WITHDRAWN, DECLINED]
    transitions:
      - from: SUBMITTED
        to: SCREENED_ELIGIBLE
        trigger: "POST /corps/applications/{id}/state with to_status=SCREEN (soft screening passes)"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /corps/applications/{id}/state with to_status=SCREEN (soft screening fails)"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "rejection_reason = BACKGROUND_CHECK_FAILED (screening outcome recorded on the entity; hard eligibility failures are instead rejected at creation with ERR_AGE_INELIGIBLE / ERR_EDUCATION_INELIGIBLE / ERR_SERVICE_INELIGIBLE)"
        note: "The SCREEN trigger is a soft evaluation: it always succeeds (200) and lands the application in SCREENED_ELIGIBLE or REJECTED. SCREENING pass/fail input: the request may carry rejection_reason=BACKGROUND_CHECK_FAILED to force the REJECTED branch; otherwise the SCREENED_ELIGIBLE branch is taken."
      - from: SCREENED_ELIGIBLE
        to: INTERVIEWED
        trigger: "POST /corps/applications/{id}/state with to_status=INTERVIEWED"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: INTERVIEWED
        to: OFFERED
        trigger: "POST /corps/applications/{id}/state with to_status=OFFERED"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: INTERVIEWED
        to: REJECTED
        trigger: "POST /corps/applications/{id}/state with to_status=REJECTED, rejection_reason=BACKGROUND_CHECK_FAILED"
        actor: ProgramManager
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /corps/applications/{id}/state with to_status=ACCEPTED"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: OFFERED
        to: DECLINED
        trigger: "POST /corps/applications/{id}/state with to_status=DECLINED"
        actor: Applicant
        preconditions: []
        side_effects:
          - "rejection_reason = OFFER_DECLINED"
      - from: ACCEPTED
        to: ENROLLED
        trigger: "POST /corps/applications/{id}/state with to_status=ENROLLED"
        actor: ProgramManager
        preconditions:
          - "site.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Create CorpsMember (site_id and full_name copied; service_status ENROLLED, stipend_status NOT_STARTED, award_status NOT_EARNED, all computed counters 0)"
          - "enrolled_member_id set to the new CorpsMember id"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /corps/applications/{id}/state with to_status=WITHDRAWN"
        actor: "Applicant | ProgramManager"
        preconditions: []
        side_effects: [{ "rejection_reason": "APPLICANT_WITHDREW" }]
      - from: SCREENED_ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /corps/applications/{id}/state with to_status=WITHDRAWN"
        actor: "Applicant | ProgramManager"
        preconditions: []
        side_effects: [{ "rejection_reason": "APPLICANT_WITHDREW" }]
      - from: INTERVIEWED
        to: WITHDRAWN
        trigger: "POST /corps/applications/{id}/state with to_status=WITHDRAWN"
        actor: "Applicant | ProgramManager"
        preconditions: []
        side_effects: [{ "rejection_reason": "APPLICANT_WITHDREW" }]
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /corps/applications/{id}/state with to_status=WITHDRAWN"
        actor: "Applicant | ProgramManager"
        preconditions: []
        side_effects: [{ "rejection_reason": "APPLICANT_WITHDREW" }]
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /corps/applications/{id}/state with to_status=WITHDRAWN"
        actor: "Applicant | ProgramManager"
        preconditions: []
        side_effects: [{ "rejection_reason": "APPLICANT_WITHDREW" }]

  - entity: CorpsMember
    field: service_status
    initial_state: ENROLLED
    terminal_states: [COMPLETED, EXITED_EARLY]
    transitions:
      - from: ENROLLED
        to: ACTIVE
        trigger: "POST /corps/members/{id}/state with dimension=SERVICE, to_status=ACTIVE"
        actor: ProgramManager
        preconditions:
          - "site.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "stipend_status NOT_STARTED -> ACTIVE (intra-entity cascade)"
          - "Recompute site projected_obligations_cents and funding_posture (calculations.site_funding_posture)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /corps/members/{id}/state with dimension=SERVICE, to_status=SUSPENDED"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "stipend_status ACTIVE -> SUSPENDED (conditional: only if currently ACTIVE)"
          - "Recompute site projected_obligations_cents and funding_posture"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /corps/members/{id}/state with dimension=SERVICE, to_status=ACTIVE"
        actor: ProgramManager
        preconditions: []
        side_effects:
          - "stipend_status SUSPENDED -> ACTIVE (unconditional documented cascade)"
          - "Recompute site projected_obligations_cents and funding_posture"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /corps/members/{id}/exit with exit_type=COMPLETED_TERM (OCC)"
        actor: ProgramManager
        preconditions:
          - "expected_member_version == member.version (else ERR_STALE_VERSION)"
          - "verified_hours_total >= 120 (else ERR_COMPLETION_HOURS_NOT_MET)"
        side_effects:
          - "member.version increments by 1; exit_date = exit_date input or clock date"
          - "award certified per calculations.education_award (certification variant): award_status = EARNED_FULL, award_amount_cents = 739500"
          - "Shared exit cascade (see EXITED_EARLY transition): assignments ended, teams re-evaluated, caseloads released, payments forfeited, stipend_status -> ENDED"
      - from: ACTIVE
        to: EXITED_EARLY
        trigger: "POST /corps/members/{id}/exit with exit_type in {COMPELLING_CIRCUMSTANCE, FOR_CAUSE, NON_COMPELLING} (OCC)"
        actor: ProgramManager
        preconditions:
          - "expected_member_version == member.version (else ERR_STALE_VERSION)"
        side_effects:
          - "member.version increments by 1; exit_date = exit_date input or clock date"
          - "award certification: COMPELLING_CIRCUMSTANCE and verified_hours_total >= 24 -> EARNED_PARTIAL with award_amount_cents = round_half_up(739500 x verified_hours_total / 120); COMPELLING with < 24 hours or FOR_CAUSE / NON_COMPELLING -> FORFEITED, award_amount_cents = 0"
          - "LINK 1: member's ACTIVE TeamAssignments -> ENDED with end_date = exit_date"
          - "LINK 2 (caused by LINK 1): each affected team recomputes active_assignment_count; a DEPLOYED team dropping below min_active_members auto-transitions to UNDERSTAFFED"
          - "Students with assigned_member_id == member and caseload_status ASSIGNED -> UNASSIGNED (assigned_end_date = exit_date, assigned_member_id = null); member.active_caseload_count recomputed"
          - "StipendPayments in {SCHEDULED, APPROVED} -> FORFEITED with decision_reason MEMBER_EXITED; stipend_status -> ENDED"
      - from: SUSPENDED
        to: EXITED_EARLY
        trigger: "POST /corps/members/{id}/exit (OCC)"
        actor: ProgramManager
        preconditions:
          - "expected_member_version == member.version (else ERR_STALE_VERSION)"
        side_effects:
          - "Same award certification and exit cascade as ACTIVE -> EXITED_EARLY"
      - from: ENROLLED
        to: EXITED_EARLY
        trigger: "POST /corps/members/{id}/exit (OCC)"
        actor: ProgramManager
        preconditions:
          - "expected_member_version == member.version (else ERR_STALE_VERSION)"
        side_effects:
          - "award_status -> FORFEITED, award_amount_cents = 0; stipend_status -> ENDED"

  - entity: CorpsMember
    field: stipend_status
    initial_state: NOT_STARTED
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /corps/members/{id}/state with dimension=STIPEND, to_status=SUSPENDED (manual hold)"
        actor: StipendAdministrator
        preconditions: []
        side_effects:
          - "Recompute site projected_obligations_cents and funding_posture"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /corps/members/{id}/state with dimension=STIPEND, to_status=ACTIVE"
        actor: StipendAdministrator
        preconditions:
          - "service_status == ACTIVE (cross-dimension guard; else ERR_MEMBER_NOT_ACTIVE)"
        side_effects:
          - "Recompute site projected_obligations_cents and funding_posture"

  - entity: CorpsMember
    field: award_status
    initial_state: NOT_EARNED
    terminal_states: [DISBURSED, FORFEITED]
    transitions:
      - from: EARNED_FULL
        to: DISBURSED
        trigger: "POST /corps/members/{id}/state with dimension=AWARD, to_status=DISBURSED"
        actor: StipendAdministrator
        preconditions: []
        side_effects: []
      - from: EARNED_PARTIAL
        to: DISBURSED
        trigger: "POST /corps/members/{id}/state with dimension=AWARD, to_status=DISBURSED"
        actor: StipendAdministrator
        preconditions: []
        side_effects: []

  - entity: Team
    field: status
    initial_state: FORMING
    terminal_states: [COMPLETED, DISSOLVED]
    transitions:
      - from: FORMING
        to: DEPLOYED
        trigger: "POST /corps/teams/{id}/state with to_status=DEPLOYED"
        actor: SiteDirector
        preconditions:
          - "active_assignment_count >= min_active_members (else ERR_TEAM_STAFFING_BELOW_MINIMUM)"
          - "school.agreement_status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
        side_effects: []
      - from: DEPLOYED
        to: UNDERSTAFFED
        trigger: "automatic when an ACTIVE TeamAssignment ends (manual end, member exit cascade, or dissolution cascade) and active_assignment_count drops below min_active_members"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDERSTAFFED
        to: DEPLOYED
        trigger: "automatic when a backfill assignment is created and active_assignment_count >= min_active_members again"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEPLOYED
        to: COMPLETED
        trigger: "POST /corps/teams/{id}/state with to_status=COMPLETED, or automatic on school COMPLETED"
        actor: "SiteDirector | system"
        preconditions:
          - "manual: logical-clock date >= site.service_year_end (else ERR_INVALID_STATE)"
        side_effects:
          - "ACTIVE TeamAssignments -> ENDED with end_date = clock date"
      - from: UNDERSTAFFED
        to: COMPLETED
        trigger: "POST /corps/teams/{id}/state with to_status=COMPLETED, or automatic on school COMPLETED"
        actor: "SiteDirector | system"
        preconditions:
          - "manual: logical-clock date >= site.service_year_end (else ERR_INVALID_STATE)"
        side_effects:
          - "ACTIVE TeamAssignments -> ENDED with end_date = clock date"
      - from: FORMING
        to: DISSOLVED
        trigger: "POST /corps/teams/{id}/state with to_status=DISSOLVED, or automatic on school TERMINATED"
        actor: "SiteDirector | system"
        preconditions: []
        side_effects:
          - "ACTIVE TeamAssignments -> ENDED with end_date = clock date; each ended assignment triggers the LINK 3 member cascade (stipend suspension + SCHEDULED payment forfeiture)"
      - from: DEPLOYED
        to: DISSOLVED
        trigger: "POST /corps/teams/{id}/state with to_status=DISSOLVED, or automatic on school TERMINATED"
        actor: "SiteDirector | system"
        preconditions: []
        side_effects:
          - "Same assignment-ending cascade as FORMING -> DISSOLVED"
      - from: UNDERSTAFFED
        to: DISSOLVED
        trigger: "POST /corps/teams/{id}/state with to_status=DISSOLVED, or automatic on school TERMINATED"
        actor: "SiteDirector | system"
        preconditions: []
        side_effects:
          - "Same assignment-ending cascade as FORMING -> DISSOLVED"

  - entity: Student
    field: enrollment_status
    initial_state: ACTIVE
    terminal_states: [EXITED]
    transitions:
      - from: ACTIVE
        to: EXITED
        trigger: "POST /corps/students/{id}/state with to_status=EXITED, or automatic on school TERMINATED"
        actor: "ProgramManager | system"
        preconditions: []
        side_effects:
          - "If caseload_status == ASSIGNED: caseload_status -> UNASSIGNED, assigned_end_date = clock date, assigned_member_id = null, and the member's active_caseload_count recomputed"

  - entity: Student
    field: caseload_status
    initial_state: UNASSIGNED
    terminal_states: []
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /corps/students/{id}/caseload with action=ASSIGN"
        actor: ProgramManager
        preconditions:
          - "enrollment_status == ACTIVE (else ERR_INVALID_STATE)"
          - "target member service_status == ACTIVE (else ERR_MEMBER_NOT_ACTIVE)"
          - "target member holds an ACTIVE TeamAssignment whose team's school_id == student.school_id and whose team status is in {DEPLOYED, UNDERSTAFFED} (else ERR_MEMBER_NOT_PLACED)"
          - "member.active_caseload_count < 12 (else ERR_CASELOAD_FULL)"
        side_effects:
          - "assigned_member_id = corps_member_id input; assigned_start_date = clock date; assigned_end_date = null"
          - "member.active_caseload_count increments by 1"
      - from: ASSIGNED
        to: UNASSIGNED
        trigger: "POST /corps/students/{id}/caseload with action=UNASSIGN, or automatic on member exit or school termination"
        actor: "ProgramManager | system"
        preconditions: []
        side_effects:
          - "assigned_end_date = clock date; assigned_member_id = null"
          - "member.active_caseload_count decrements by 1"
          - "Re-ASSIGN after UNASSIGN is allowed (cycle) — a new assigned_start_date replaces the old interval"

  - entity: ServiceHourEntry
    field: status
    initial_state: PENDING
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /corps/hour-entries/{id}/review with decision=VERIFY"
        actor: ProgramManager
        preconditions:
          - "verification window: (clock date - service_date) <= 30 days (else ERR_VERIFICATION_WINDOW_EXPIRED)"
          - "daily cap: sum of hours over this member's entries on the same service_date with status in {PENDING, VERIFIED} <= 12.0 including this entry (else ERR_DAILY_HOUR_CAP_EXCEEDED)"
          - "fundraising cap when category == FUNDRAISING, per calculations.fundraising_cap_check (else ERR_FUNDRAISING_CAP_EXCEEDED)"
        side_effects:
          - "reviewed_by = X-User-ID; recompute member.verified_hours_total and verified_fundraising_hours (calculations.verified_hour_aggregation)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /corps/hour-entries/{id}/review with decision=REJECT"
        actor: ProgramManager
        preconditions:
          - "reason is required (else ERR_INVALID_REQUEST)"
        side_effects:
          - "review_reason = reason; reviewed_by = X-User-ID"
      - from: VERIFIED
        to: VOIDED
        trigger: "POST /corps/hour-entries/{id}/review with decision=VOID"
        actor: ProgramManager
        preconditions:
          - "reason is required (else ERR_INVALID_REQUEST)"
        side_effects:
          - "review_reason = reason; recompute member.verified_hours_total and verified_fundraising_hours (compensating ledger action)"

  - entity: StipendPayment
    field: status
    initial_state: SCHEDULED
    terminal_states: [FORFEITED, CLAWED_BACK]
    transitions:
      - from: SCHEDULED
        to: APPROVED
        trigger: "POST /corps/stipend-payments/{id}/state with to_status=APPROVED"
        actor: StipendAdministrator
        preconditions:
          - "X-User-ID != created_by (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
          - "member.stipend_status == ACTIVE (else ERR_MEMBER_NOT_ACTIVE)"
        side_effects:
          - "Compute final variant (calculations.stipend_amounts): final_gross_cents = round_half_up(base_amount_cents x period_days / 14); net_amount_cents = max(0, final_gross_cents - deduction_cents)"
          - "approved_by = X-User-ID"
      - from: APPROVED
        to: PAID
        trigger: "POST /corps/stipend-payments/{id}/state with to_status=PAID"
        actor: StipendAdministrator
        preconditions:
          - "site.funding_headroom_cents >= net_amount_cents (fiscal gate; else ERR_SITE_FUNDING_DEFICIT)"
        side_effects:
          - "site.stipend_outlay_cents += net_amount_cents; member.net_stipend_received_cents += net_amount_cents"
          - "Recompute site funding_headroom_cents and funding_posture (calculations.site_funding_posture)"
      - from: PAID
        to: CLAWED_BACK
        trigger: "POST /corps/stipend-payments/{id}/state with to_status=CLAWED_BACK, reason required"
        actor: StipendAdministrator
        preconditions:
          - "reason is required (else ERR_INVALID_REQUEST)"
        side_effects:
          - "site.stipend_outlay_cents -= net_amount_cents; member.net_stipend_received_cents -= net_amount_cents (compensating action; conserved quantity per invariant I-CASH)"
          - "Recompute site funding_headroom_cents and funding_posture"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "POST /corps/stipend-payments/{id}/state with to_status=FORFEITED, reason required; or automatic on member exit / team-dissolution cascade"
        actor: "StipendAdministrator | system"
        preconditions:
          - "manual: reason is required (else ERR_INVALID_REQUEST)"
        side_effects:
          - "decision_reason = reason"
      - from: APPROVED
        to: FORFEITED
        trigger: "POST /corps/stipend-payments/{id}/state with to_status=FORFEITED, reason required; or automatic on member exit"
        actor: "StipendAdministrator | system"
        preconditions:
          - "manual: reason is required (else ERR_INVALID_REQUEST)"
        side_effects:
          - "decision_reason = reason"

  - entity: EvaluationReport
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /corps/evaluation-reports/{id}/state with to_status=SUBMITTED"
        actor: ProgramManager
        preconditions:
          - "school.data_sharing_status == SIGNED (else ERR_DATA_SHARING_NOT_SIGNED)"
          - "clock date <= period_end + 45 days (else ERR_REPORT_WINDOW_CLOSED)"
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /corps/evaluation-reports/{id}/state with to_status=SUBMITTED (revision loop)"
        actor: ProgramManager
        preconditions:
          - "school.data_sharing_status == SIGNED (else ERR_DATA_SHARING_NOT_SIGNED)"
          - "clock date <= period_end + 45 days (else ERR_REPORT_WINDOW_CLOSED)"
        side_effects:
          - "return_reason cleared to null"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /corps/evaluation-reports/{id}/state with to_status=ACCEPTED"
        actor: SchoolLiaison
        preconditions:
          - "X-User-ID == report's school_id (else ERR_NOT_ENTITY_OWNER)"
        side_effects: []
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /corps/evaluation-reports/{id}/state with to_status=RETURNED, return_reason required"
        actor: SchoolLiaison
        preconditions:
          - "X-User-ID == report's school_id (else ERR_NOT_ENTITY_OWNER)"
          - "return_reason is required (else ERR_INVALID_REQUEST)"
        side_effects:
          - "return_reason recorded"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: school-amend-stale-version
    parent_entity: School
    write_endpoint: "POST /corps/schools/{id}/amend"
    occ_field: expected_school_version
    description: |
      Amending a School whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just amended or transitioned the agreement and the current writer's view
      of the agreement terms is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: member-exit-stale-version
    parent_entity: CorpsMember
    write_endpoint: "POST /corps/members/{id}/exit"
    occ_field: expected_member_version
    description: |
      Exiting a CorpsMember whose version has advanced since the client last
      observed it is rejected; the client's picture of verified hours and
      placement state is stale and the award certification would be computed
      against superseded data.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: team-assign-stale-version
    parent_entity: Team
    write_endpoint: "POST /corps/teams/{id}/assignments"
    occ_field: expected_team_version
    description: |
      Creating a TeamAssignment against a Team whose version has advanced
      since the client last observed it is rejected; roster capacity and
      backfill accounting must be evaluated against the current roster.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: stipend_amounts
    trigger: "StipendPayment creation (provisional variant) and the SCHEDULED -> APPROVED transition (final variant)"
    algorithm: aggregation
    formula: |
      PROVISIONAL (at creation):
        period_days = (period_end - period_start).days + 1
        base_amount_cents = round_half_up(site.annual_stipend_cents / STIPEND_PERIODS_PER_YEAR)
        # base is independent of period length — it assumes a standard 14-day period
      FINAL (at approval):
        final_gross_cents = round_half_up(base_amount_cents * period_days / STIPEND_PERIOD_DAYS)
        net_amount_cents = max(0, final_gross_cents - deduction_cents)
    input_set: "The StipendPayment being created/approved and its member's Site"
    constants:
      STIPEND_PERIODS_PER_YEAR: 26
      STIPEND_PERIOD_DAYS: 14
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "At creation; ignores period length and deductions"
        difference: "base_amount_cents = round_half_up(annual_stipend_cents / 26) regardless of period_days; net_amount_cents stays null"
      - name: final
        when: "At approval"
        difference: "Prorates by actual period_days and subtracts deduction_cents; for a non-14-day period or nonzero deduction the final values differ from the provisional base on identical period data"

  - name: education_award
    trigger: "Projection variant: recomputed whenever verified_hours_total changes or the logical clock advances (observed on CorpsMember reads). Certification variant: computed once at member exit."
    algorithm: forward_looking
    formula: |
      PROJECTION (forward_looking; while member is serving):
        remaining_days = calendar days from (clock date + 1) through site.service_year_end inclusive; 0 if clock date >= service_year_end
        projected_hours_total = verified_hours_total + remaining_days * PROJECTED_DAILY_HOURS
        award_projected_cents =
            EDUCATION_AWARD_FULL_CENTS                          if projected_hours_total >= FULL_TERM_HOURS
            round_half_up(EDUCATION_AWARD_FULL_CENTS * projected_hours_total / FULL_TERM_HOURS)
                                                                if MIN_PARTIAL_AWARD_HOURS <= projected_hours_total < FULL_TERM_HOURS
            0                                                   otherwise
      CERTIFICATION (chronological; at exit — VERIFIED entries only, projected future hours excluded):
        if exit_type == COMPLETED_TERM: requires verified_hours_total >= FULL_TERM_HOURS
            -> award_status = EARNED_FULL, award_amount_cents = EDUCATION_AWARD_FULL_CENTS
        elif exit_type == COMPELLING_CIRCUMSTANCE and verified_hours_total >= MIN_PARTIAL_AWARD_HOURS:
            -> EARNED_PARTIAL, award_amount_cents = round_half_up(EDUCATION_AWARD_FULL_CENTS * verified_hours_total / FULL_TERM_HOURS)
        else: -> FORFEITED, award_amount_cents = 0
    input_set: "Projection: member.verified_hours_total + calendar remaining in service year. Certification: only the member's ServiceHourEntries with status VERIFIED (PENDING, REJECTED, VOIDED excluded) at exit time."
    constants:
      FULL_TERM_HOURS: 120
      MIN_PARTIAL_AWARD_HOURS: 24
      EDUCATION_AWARD_FULL_CENTS: 739500
      PROJECTED_DAILY_HOURS: 8.0
    precision: "integer cents, round_half_up; hours to 2 decimals"
    variants:
      - name: projection
        when: "While the member serves; includes not-yet-served future days at 8.0 hours/day"
        difference: "For identical verified data the projection can certify a full award (739500) while the exit certification yields a smaller pro-rata amount, because projected future hours are excluded at certification"
      - name: certification
        when: "At exit"
        difference: "Uses only VERIFIED entries; never includes future days"

  - name: fundraising_cap_check
    trigger: "POST /corps/hour-entries/{id}/review with decision=VERIFY on an entry with category FUNDRAISING"
    algorithm: threshold
    formula: |
      # Order-pinned circular-looking dependency: the cap is a fraction of the
      # total hours AFTER the candidate entry, and the candidate is itself
      # fundraising. Evaluation order MUST be:
      #   (1) T_new = member.verified_hours_total + candidate.hours
      #   (2) cap_hours = floor(T_new * FUNDRAISING_CAP_FRACTION * 4) / 4
      #   (3) accept iff member.verified_fundraising_hours + candidate.hours <= cap_hours
      # Reversing (1) and (2) (capping against the pre-verification total)
      # yields a strictly smaller cap and rejects entries this order accepts.
    input_set: "The candidate entry plus the member's VERIFIED entries (all categories) at review time"
    constants:
      FUNDRAISING_CAP_FRACTION: 0.10
    precision: "hours floored to the 0.25 quantum"

  - name: district_cost_share_installments
    trigger: "School creation, agreement transitions (SIGNED/ACTIVE/AMENDMENT_REVIEW/COMPLETED/TERMINATED), and agreement amendments"
    algorithm: aggregation
    formula: |
      # Rounding order is PINNED: round per school first, then sum.
      # Sum-then-round is FORBIDDEN — it produces different cents.
      for each School s of the site with agreement_status in {SIGNED, ACTIVE, AMENDMENT_REVIEW, COMPLETED}:
          i1(s) = round_half_up(s.annual_cost_share_cents * 0.5)
          i2(s) = s.annual_cost_share_cents - i1(s)
      site.cost_share_installment_1_cents = sum(i1(s))
      site.cost_share_installment_2_cents = sum(i2(s))
      site.cost_share_total_cents        = cost_share_installment_1_cents + cost_share_installment_2_cents
    input_set: "Schools of the site with agreement_status in {SIGNED, ACTIVE, AMENDMENT_REVIEW, COMPLETED}; DRAFT and TERMINATED schools are excluded"
    constants:
      INSTALLMENT_1_FRACTION: 0.5
    precision: "integer cents, round_half_up per school BEFORE summing"

  - name: site_funding_posture
    trigger: "Funding receipt, stipend payment PAID/CLAWED_BACK, and any member stipend_status change (projected obligations move)"
    algorithm: threshold
    formula: |
      total_received_cents = district_received + philanthropy_received + federal_received
      projected_obligations_cents = site.annual_stipend_cents * count(members of site with stipend_status == ACTIVE)
      funding_headroom_cents = total_received_cents - stipend_outlay_cents - projected_obligations_cents
      funding_posture = DEFICIT if funding_headroom_cents < 0
                        TIGHT   if 0 <= funding_headroom_cents < TIGHT_HEADROOM_CENTS
                        FUNDED  otherwise
      Fiscal gate on stipend PAID: reject when funding_headroom_cents < payment.net_amount_cents (ERR_SITE_FUNDING_DEFICIT)
    input_set: "Site funding ledger fields, all StipendPayments of the site's members in PAID/CLAWED_BACK, and all members' stipend_status"
    constants:
      TIGHT_HEADROOM_CENTS: 500000
    precision: "integer cents"

  - name: verified_hour_aggregation
    trigger: "ServiceHourEntry VERIFY (adds) and VOID (subtracts)"
    algorithm: aggregation
    formula: |
      member.verified_hours_total = sum(hours over member's entries with status == VERIFIED)
      member.verified_fundraising_hours = sum(hours over member's VERIFIED entries with category == FUNDRAISING)
      PENDING, REJECTED and VOIDED entries are excluded. The ledger is
      self-reconciling: verify then void of the same hours returns both totals
      to their prior values (invariant I-HOURS).
    input_set: "The member's ServiceHourEntries with status == VERIFIED only"
    constants:
      DAILY_HOUR_CAP: 12.0
      HOUR_QUANTUM: 0.25
    precision: "hours to 2 decimals"

  - name: evaluation_metrics
    trigger: "EvaluationReport creation (metrics snapshot at DRAFT)"
    algorithm: aggregation
    formula: |
      eligible = students of report.school_id with enrollment_status in {ACTIVE, EXITED}
                 AND assigned_start_date is not null
                 AND assigned_start_date <= period_end
                 AND (assigned_end_date is null OR assigned_end_date >= period_start)
      improved = eligible students with current_attendance_pct is not null
                 AND (current_attendance_pct - baseline_attendance_pct) >= 5.0
      eligible_student_count = |eligible|
      improved_student_count = |improved|
      pct_improved = round_half_up(100.0 * improved_student_count / eligible_student_count, 1 decimal)
                     or 0.0 when eligible_student_count == 0
    input_set: "Students of the school filtered by the overlap predicate above; students never assigned in the window are excluded"
    constants:
      IMPROVEMENT_THRESHOLD_PCT: 5.0
    precision: "pct_improved to 1 decimal, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; a request failing several
# checks returns the error of the LOWEST-numbered matching priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Entity-backed ownership: CorpsMember role may only act on/read the member whose id == X-User-ID; SchoolLiaison role may only sign/review for the school whose id == X-User-ID", error_id: ERR_NOT_ENTITY_OWNER, http_status: 403, applies_to: "member-self endpoints and liaison school-scoped writes" }
  - { priority: 4, category: auth, check: "Segregation of duties: stipend approver must differ from the payment's created_by", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /corps/stipend-payments/{id}/state with to_status=APPROVED" }
  - { priority: 5, category: existence, check: "Request body shape: required fields present, enums in range, dates well-formed, hours a positive multiple of 0.25 not exceeding 12, non-negative integer cents, period_end >= period_start", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: existence, check: "Path identifiers exist, validated left-to-right through the path", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 7, category: state, check: "OCC: expected_<parent>_version equals the parent's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /corps/schools/{id}/amend; POST /corps/members/{id}/exit; POST /corps/teams/{id}/assignments" }
  - { priority: 8, category: state, check: "Target resource's current state permits the requested transition per §1.2", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all state/action endpoints" }
  - { priority: 9, category: business_safety, check: "Applicant age at site.service_year_start is >= 17 and <= 25 (computed from date_of_birth; a birthday exactly on service_year_start counts)", error_id: ERR_AGE_INELIGIBLE, http_status: 422, applies_to: "POST /corps/applications" }
  - { priority: 10, category: business_safety, check: "education_level != LESS_THAN_HS", error_id: ERR_EDUCATION_INELIGIBLE, http_status: 422, applies_to: "POST /corps/applications" }
  - { priority: 11, category: business_safety, check: "citizenship_status != OTHER AND prior_service_terms < 4 AND prior_full_awards_received < 2", error_id: ERR_SERVICE_INELIGIBLE, http_status: 422, applies_to: "POST /corps/applications" }
  - { priority: 12, category: business_temporal, check: "service_date >= site.service_year_start AND service_date <= logical-clock date", error_id: ERR_SERVICE_DATE_INVALID, http_status: 422, applies_to: "POST /corps/hour-entries" }
  - { priority: 13, category: business_temporal, check: "Verification window: (clock date - service_date) <= 30 days", error_id: ERR_VERIFICATION_WINDOW_EXPIRED, http_status: 422, applies_to: "POST /corps/hour-entries/{id}/review with decision=VERIFY" }
  - { priority: 14, category: business_temporal, check: "Backfill window: clock date <= team.backfill_deadline for backfill assignments", error_id: ERR_BACKFILL_WINDOW_CLOSED, http_status: 422, applies_to: "POST /corps/teams/{id}/assignments when team DEPLOYED/UNDERSTAFFED" }
  - { priority: 15, category: business_temporal, check: "Report submission window: clock date <= period_end + 45 days", error_id: ERR_REPORT_WINDOW_CLOSED, http_status: 422, applies_to: "POST /corps/evaluation-reports/{id}/state with to_status=SUBMITTED" }
  - { priority: 16, category: business_referential, check: "school.agreement_status == ACTIVE where required (team create, team deploy, student create, report create)", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /corps/teams; POST /corps/teams/{id}/state DEPLOYED; POST /corps/students; POST /corps/evaluation-reports (COMPLETED also accepted for report create)" }
  - { priority: 17, category: business_referential, check: "school.data_sharing_status == SIGNED where required (agreement activation, amendment confirmation, report submission)", error_id: ERR_DATA_SHARING_NOT_SIGNED, http_status: 409, applies_to: "schools state to ACTIVE; evaluation-reports state to SUBMITTED" }
  - { priority: 18, category: business_referential, check: "member.service_status == ACTIVE where required (hour entry create, caseload ASSIGN, team assignment create, stipend payment create/approve via stipend_status)", error_id: ERR_MEMBER_NOT_ACTIVE, http_status: 409, applies_to: "POST /corps/hour-entries; POST /corps/students/{id}/caseload; POST /corps/teams/{id}/assignments; POST /corps/members/{id}/stipend-payments; stipend approve; members state STIPEND resume guard" }
  - { priority: 19, category: business_referential, check: "Caseload ASSIGN: member holds an ACTIVE TeamAssignment to a team at the student's school with team status in {DEPLOYED, UNDERSTAFFED}", error_id: ERR_MEMBER_NOT_PLACED, http_status: 422, applies_to: "POST /corps/students/{id}/caseload with action=ASSIGN" }
  - { priority: 20, category: business_referential, check: "Award disburse requires award_status in {EARNED_FULL, EARNED_PARTIAL}", error_id: ERR_AWARD_NOT_EARNED, http_status: 409, applies_to: "POST /corps/members/{id}/state with dimension=AWARD" }
  - { priority: 21, category: business_constraint, check: "Daily hour cap at verification: member's same-day entries in {PENDING, VERIFIED} sum <= 12.0 including the candidate", error_id: ERR_DAILY_HOUR_CAP_EXCEEDED, http_status: 422, applies_to: "POST /corps/hour-entries/{id}/review with decision=VERIFY" }
  - { priority: 22, category: business_constraint, check: "Fundraising cap per calculations.fundraising_cap_check", error_id: ERR_FUNDRAISING_CAP_EXCEEDED, http_status: 422, applies_to: "POST /corps/hour-entries/{id}/review with decision=VERIFY on FUNDRAISING entries" }
  - { priority: 23, category: business_constraint, check: "Member active caseload size < 12 before adding another (12th succeeds, 13th rejected)", error_id: ERR_CASELOAD_FULL, http_status: 422, applies_to: "POST /corps/students/{id}/caseload with action=ASSIGN" }
  - { priority: 24, category: business_constraint, check: "Student not already ASSIGNED", error_id: ERR_STUDENT_CASELOAD_CONFLICT, http_status: 409, applies_to: "POST /corps/students/{id}/caseload with action=ASSIGN" }
  - { priority: 25, category: business_constraint, check: "Member assignment intervals [start_date, end_date) are pairwise non-overlapping (half-open: an existing assignment whose end_date == new start_date does NOT overlap; open-ended existing assignments overlap any later start)", error_id: ERR_ASSIGNMENT_OVERLAP, http_status: 409, applies_to: "POST /corps/teams/{id}/assignments" }
  - { priority: 26, category: business_constraint, check: "Team aggregate capacity: for every date covered by the new assignment, the count of team assignments covering that date stays <= team_size_snapshot", error_id: ERR_TEAM_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /corps/teams/{id}/assignments" }
  - { priority: 27, category: business_constraint, check: "Backfill budget: team.backfill_count < team.backfill_limit for backfill assignments", error_id: ERR_BACKFILL_LIMIT_REACHED, http_status: 422, applies_to: "POST /corps/teams/{id}/assignments when team DEPLOYED/UNDERSTAFFED" }
  - { priority: 28, category: business_constraint, check: "Deploy staffing: team.active_assignment_count >= team.min_active_members", error_id: ERR_TEAM_STAFFING_BELOW_MINIMUM, http_status: 422, applies_to: "POST /corps/teams/{id}/state with to_status=DEPLOYED" }
  - { priority: 29, category: business_constraint, check: "No existing StipendPayment for the same member with the same period_start", error_id: ERR_DUPLICATE_PAYMENT_PERIOD, http_status: 409, applies_to: "POST /corps/members/{id}/stipend-payments" }
  - { priority: 30, category: business_constraint, check: "Completion exit requires verified_hours_total >= 120", error_id: ERR_COMPLETION_HOURS_NOT_MET, http_status: 422, applies_to: "POST /corps/members/{id}/exit with exit_type=COMPLETED_TERM" }
  - { priority: 31, category: business_fiscal, check: "Site funding headroom >= payment net_amount_cents", error_id: ERR_SITE_FUNDING_DEFICIT, http_status: 422, applies_to: "POST /corps/stipend-payments/{id}/state with to_status=PAID" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/corps/_clock/set_current_utc"
    description: "Test-driving logical clock. Sets the server's current UTC instant. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. All date comparisons (windows, deadlines, projections) use this clock's date part."
    roles: [SiteDirector]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Recompute clock-dependent projections (member.projected_hours_total, award_projected_cents) lazily on next read"]

  - method: POST
    path: "/corps/sites"
    description: "Create a Site in SETUP"
    roles: [SiteDirector]
    code: 201
    input: [name, city, service_year_start, service_year_end, annual_stipend_cents, "district_committed_cents?", "philanthropy_committed_cents?", "federal_committed_cents?"]
    output: Site
    side_effects: ["received/outlay/cost-share computed fields initialize to 0; funding_posture = TIGHT (headroom 0)"]

  - method: GET
    path: "/corps/sites/{id}"
    description: "Get a Site with all computed funding and cost-share fields"
    roles: [SiteDirector, ProgramManager, StipendAdministrator]
    code: 200
    input: []
    output: Site
    side_effects: []

  - method: POST
    path: "/corps/sites/{id}/state"
    description: "Transition Site status (ACTIVE, CLOSED)"
    roles: [SiteDirector]
    code: 200
    input: [to_status]
    output: Site
    side_effects: ["State transition per Site state machine; increments site.version by 1"]

  - method: POST
    path: "/corps/sites/{id}/funding/receive"
    description: "Record receipt of funds against one funding channel"
    roles: [SiteDirector]
    code: 200
    input: [funding_type, amount_cents]
    output: Site
    side_effects: ["<funding_type>_received_cents += amount_cents; recompute total_received_cents, funding_headroom_cents, funding_posture (calculations.site_funding_posture); increments site.version by 1"]

  - method: POST
    path: "/corps/schools"
    description: "Create a School partnership agreement in DRAFT (data_sharing_status DRAFT)"
    roles: [SiteDirector]
    code: 201
    input: [site_id, name, district_name, team_size, service_scope, annual_cost_share_cents]
    output: School
    side_effects: ["agreement_status=DRAFT, data_sharing_status=DRAFT; DRAFT schools are excluded from site cost-share totals"]

  - method: GET
    path: "/corps/schools/{id}"
    description: "Get a School"
    roles: [SiteDirector, ProgramManager, SchoolLiaison]
    code: 200
    input: []
    output: School
    side_effects: []

  - method: POST
    path: "/corps/schools/{id}/amend"
    description: "Amend an ACTIVE agreement (OCC-guarded); agreement moves to AMENDMENT_REVIEW and amended fields take effect immediately"
    roles: [SiteDirector]
    code: 200
    input: [expected_school_version, "team_size?", "annual_cost_share_cents?", "service_scope?"]
    output: School
    side_effects: ["agreement_status ACTIVE -> AMENDMENT_REVIEW; increments school.version by 1; recompute site cost_share_* with amended values"]

  - method: POST
    path: "/corps/schools/{id}/state"
    description: "Transition a School dimension: dimension=AGREEMENT (default) drives agreement_status; dimension=DATA_SHARING drives data_sharing_status"
    roles: [SiteDirector, SchoolLiaison]
    code: 200
    input: [to_status, "dimension?"]
    output: School
    side_effects: ["State transition per School state machines (incl. termination cascade LINK 1..3 and data-sharing expiry auto-suspension); increments school.version by 1"]

  - method: POST
    path: "/corps/applications"
    description: "Submit a corps member application; hard eligibility checks (age, education, service) run at creation"
    roles: [Applicant]
    code: 201
    input: [site_id, full_name, date_of_birth, education_level, citizenship_status, prior_service_terms, prior_full_awards_received]
    output: CorpsMemberApplication
    side_effects: ["status=SUBMITTED"]

  - method: POST
    path: "/corps/applications/{id}/state"
    description: "Advance the recruitment pipeline; to_status=SCREEN runs soft screening (SCREENED_ELIGIBLE or REJECTED); ENROLLED creates the CorpsMember"
    roles: [ProgramManager, Applicant]
    code: 200
    input: [to_status, "rejection_reason?"]
    output: CorpsMemberApplication
    side_effects: ["State transition per application state machine; ENROLLED creates CorpsMember and sets enrolled_member_id; increments application.version by 1"]

  - method: GET
    path: "/corps/members/{id}"
    description: "Get a CorpsMember with computed hour totals, projections, award and counter fields (CorpsMember role restricted to own id)"
    roles: [SiteDirector, ProgramManager, StipendAdministrator, CorpsMember]
    code: 200
    input: []
    output: CorpsMember
    side_effects: []

  - method: POST
    path: "/corps/members/{id}/state"
    description: "Transition one member dimension: dimension=SERVICE (default, ProgramManager) drives service_status; dimension=STIPEND (StipendAdministrator) drives stipend_status hold/resume; dimension=AWARD (StipendAdministrator) disburses an earned award"
    roles: [ProgramManager, StipendAdministrator]
    code: 200
    input: [to_status, "dimension?"]
    output: CorpsMember
    side_effects: ["State transitions per CorpsMember dimension machines incl. intra-entity stipend cascades and site posture recompute; increments member.version by 1"]

  - method: POST
    path: "/corps/members/{id}/exit"
    description: "Exit a member (OCC-guarded); certifies the education award and runs the exit cascade"
    roles: [ProgramManager]
    code: 200
    input: [expected_member_version, exit_type, "exit_date?"]
    output: CorpsMember
    side_effects: ["Award certification (calculations.education_award certification variant); LINK 1 assignments ENDED; LINK 2 teams re-evaluated to UNDERSTAFFED; caseloads released; SCHEDULED/APPROVED payments FORFEITED; stipend_status -> ENDED; increments member.version by 1"]

  - method: POST
    path: "/corps/teams"
    description: "Create a Team at a school (FORMING); snapshots school.team_size"
    roles: [SiteDirector]
    code: 201
    input: [school_id, name, backfill_deadline, "backfill_limit?"]
    output: Team
    side_effects: ["Requires site ACTIVE and school agreement ACTIVE; team_size_snapshot and min_active_members frozen"]

  - method: GET
    path: "/corps/teams/{id}"
    description: "Get a Team with roster counters"
    roles: [SiteDirector, ProgramManager]
    code: 200
    input: []
    output: Team
    side_effects: []

  - method: POST
    path: "/corps/teams/{id}/state"
    description: "Transition Team status (DEPLOYED, COMPLETED, DISSOLVED)"
    roles: [SiteDirector]
    code: 200
    input: [to_status]
    output: Team
    side_effects: ["State transition per Team state machine incl. assignment-ending cascades; increments team.version by 1"]

  - method: POST
    path: "/corps/teams/{id}/assignments"
    description: "Create a TeamAssignment (OCC-guarded on team version); post-DEPLOYED creations count as backfill"
    roles: [ProgramManager]
    code: 201
    input: [corps_member_id, start_date, expected_team_version, "role?"]
    output: TeamAssignment
    side_effects: ["Checks member ACTIVE, member interval overlap (half-open), team aggregate capacity, backfill budget/deadline; team.active_assignment_count += 1; backfill_count += 1 when is_backfill; UNDERSTAFFED team auto-returns to DEPLOYED at min staffing; increments team.version by 1"]

  - method: POST
    path: "/corps/team-assignments/{id}/end"
    description: "End an ACTIVE TeamAssignment early"
    roles: [ProgramManager]
    code: 200
    input: ["end_date?"]
    output: TeamAssignment
    side_effects: ["end_date = input or clock date (must be >= start_date, else ERR_INVALID_REQUEST); status -> ENDED; team.active_assignment_count -= 1; DEPLOYED team below min auto-transitions to UNDERSTAFFED; member.active_assignment_count recomputed; increments team.version by 1"]

  - method: POST
    path: "/corps/students"
    description: "Create a focus-list Student at a school (school agreement must be ACTIVE)"
    roles: [ProgramManager]
    code: 201
    input: [school_id, external_student_ref, grade_level, focus_list_type, baseline_attendance_pct]
    output: Student
    side_effects: ["enrollment_status=ACTIVE, caseload_status=UNASSIGNED"]

  - method: POST
    path: "/corps/students/{id}/state"
    description: "Transition Student enrollment (EXITED)"
    roles: [ProgramManager]
    code: 200
    input: [to_status]
    output: Student
    side_effects: ["State transition per Student enrollment machine incl. caseload release; increments student.version by 1"]

  - method: POST
    path: "/corps/students/{id}/caseload"
    description: "Assign or unassign the student's caseload (action=ASSIGN requires corps_member_id; action=UNASSIGN takes no member)"
    roles: [ProgramManager]
    code: 200
    input: [action, "corps_member_id?"]
    output: Student
    side_effects: ["State transition per Student caseload machine incl. member active_caseload_count recompute; increments student.version by 1"]

  - method: POST
    path: "/corps/students/{id}/metrics"
    description: "Post the student's current attendance percentage"
    roles: [ProgramManager]
    code: 200
    input: [current_attendance_pct]
    output: Student
    side_effects: ["current_attendance_pct updated; increments student.version by 1"]

  - method: POST
    path: "/corps/hour-entries"
    description: "Corps member logs a ServiceHourEntry (PENDING); corps_member_id must equal X-User-ID"
    roles: [CorpsMember]
    code: 201
    input: [corps_member_id, service_date, hours, category, "description?"]
    output: ServiceHourEntry
    side_effects: ["status=PENDING"]

  - method: POST
    path: "/corps/hour-entries/{id}/review"
    description: "Verify, reject, or void an hour entry (VERIFY/REJECT from PENDING; VOID from VERIFIED; reason required for REJECT/VOID)"
    roles: [ProgramManager]
    code: 200
    input: [decision, "reason?"]
    output: ServiceHourEntry
    side_effects: ["State transition per ServiceHourEntry machine; VERIFY/VOID recompute member hour totals (calculations.verified_hour_aggregation) and bump member.version"]

  - method: POST
    path: "/corps/members/{id}/stipend-payments"
    description: "Schedule a stipend payment for a member (provisional amount computed; member stipend_status must be ACTIVE; period_start unique per member)"
    roles: [StipendAdministrator]
    code: 201
    input: [period_start, period_end]
    output: StipendPayment
    side_effects: ["base_amount_cents = provisional variant (calculations.stipend_amounts); created_by = X-User-ID; status=SCHEDULED"]

  - method: POST
    path: "/corps/stipend-payments/{id}/state"
    description: "Transition a stipend payment: APPROVED (computes final variant; segregation of duties), PAID (fiscal gate), FORFEITED or CLAWED_BACK (reason required)"
    roles: [StipendAdministrator]
    code: 200
    input: [to_status, "deduction_cents?", "reason?"]
    output: StipendPayment
    side_effects: ["State transition per StipendPayment machine incl. final-amount computation, site outlay and member net ledger updates, posture recompute; increments payment.version by 1"]

  - method: POST
    path: "/corps/evaluation-reports"
    description: "Create an EvaluationReport (DRAFT) for a school; metrics snapshot computed at creation (school agreement must be ACTIVE or COMPLETED)"
    roles: [ProgramManager]
    code: 201
    input: [school_id, period_start, period_end]
    output: EvaluationReport
    side_effects: ["eligible_student_count, improved_student_count, pct_improved computed per calculations.evaluation_metrics"]

  - method: POST
    path: "/corps/evaluation-reports/{id}/state"
    description: "Transition a report: SUBMITTED (ProgramManager; data-sharing and window gates), ACCEPTED or RETURNED (SchoolLiaison of the report's school; RETURNED requires return_reason and loops back to SUBMITTED)"
    roles: [ProgramManager, SchoolLiaison]
    code: 200
    input: [to_status, "return_reason?"]
    output: EvaluationReport
    side_effects: ["State transition per EvaluationReport machine; increments report.version by 1"]

  # --- Reverse-reachability reads (one per FK; all return arrays with limit/offset pagination) ---
  - method: GET
    path: "/corps/sites/{id}/schools"
    description: "List Schools of a Site"
    roles: [SiteDirector, ProgramManager, SchoolLiaison]
