# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2898 — Sports Remote Production Operations
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's §1.1–§1.7.
# Shared fixture conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   logical clock startup default   2026-08-01T00:00:00Z (so untouched created_at values read
#                                   2026-08-01T00:00:00.000Z)
#   operator ids                    pm-001, td-001, lo-001, us-001
#   canonical TIER_3 production     2026-08-15T18:00:00Z .. 22:00:00Z, curfew 2026-08-16T06:00:00Z,
#                                   venue power 400 A, labor budget 2000000 cents
#   TIER_3 gate counts              required_crew_positions = 2, required_validated_preps = 1
# Instances whose corner is already asserted by a §1.8 instance carry `excluded_because:` and no
# test_recipe, as required by §1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: production_creation_returns_declared_defaults_and_zeroed_derived_fields
        claim_type: creation
        grounds:
          - entities.Production
          - endpoints[POST /broadcast-ops/productions]
          - response_envelope.success
        distinguishing_aspect: |
          A single POST with only the nine declared input fields must come back with every system and
          computed field materialised: status PLANNED, version 1, labor_available_cents equal to the
          whole budget, both readiness variants 0.00, and the tier-derived gate counts already
          resolved to 2 and 1 - none of which the caller supplied.
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, status: $.data.status, version: $.data.version }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "Production.${prod_id}.status == PLANNED, version == 1, created_at == 2026-08-01T00:00:00.000Z"
            - "Production.${prod_id}.truck_id == null, wrapped_by_user_id == null"
            - "Production.${prod_id}.labor_committed_cents == 0 and labor_available_cents == 2000000"
            - "Production.${prod_id}.readiness_score_preflight == 0.00 and readiness_score_certified == 0.00"
            - "Production.${prod_id}.required_crew_positions == 2 and required_validated_preps == 1"
            - "Production.${prod_id}.settlement_total_cents == 0, overrun_fee_cents == 0, labor_variance_cents == 0"

      - name: truck_listing_filters_by_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /broadcast-ops/trucks]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three trucks exist; a limit-2 page must report total_count 3 and has_more true while
          returning exactly 2 rows, and the tier_rating filter must narrow the same collection to 1.
          An implementation that reports total_count as the page length fails on the first assert.
        test_recipe:
          setup:
            - "Three AVAILABLE trucks: two TIER_3 and one TIER_1."
          setup_api_calls:
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-01", tier_rating: "TIER_3", camera_channel_capacity: 4, power_draw_amps: 60, home_base_code: "SEA", engine_hours_since_service: 100, service_interval_hours: 500 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck1_id: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-02", tier_rating: "TIER_3", camera_channel_capacity: 6, power_draw_amps: 80, home_base_code: "SEA", engine_hours_since_service: 10, service_interval_hours: 500 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck2_id: $.data.id }
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-03", tier_rating: "TIER_1", camera_channel_capacity: 24, power_draw_amps: 200, home_base_code: "ATL", engine_hours_since_service: 0, service_interval_hours: 500 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck3_id: $.data.id }
          trigger:
            - call: "GET /broadcast-ops/trucks"
              payload: { status: "AVAILABLE", limit: 2, offset: 0 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { first_code: "$.data[0].truck_code" }
            - call: "GET /broadcast-ops/trucks"
              payload: { tier_rating: "TIER_1" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { only_code: "$.data[0].truck_code" }
          assert:
            - "First call: response_type == array, exactly 2 rows, meta/pagination reports total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: exactly 1 row with truck_code == TRK-03 and total_count == 1, has_more == false"
            - "A bare GET /broadcast-ops/trucks applies the declared defaults limit == 10 and offset == 0 and returns 3 rows with has_more == false"

      - name: crew_member_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=9]
          - errors[ERR_CREW_MEMBER_NOT_FOUND]
          - endpoints[GET /broadcast-ops/crew-members/{id}]
        distinguishing_aspect: |
          A syntactically valid UUID that matches no row must return 404 ERR_CREW_MEMBER_NOT_FOUND
          with the error envelope, not an empty 200 object and not a 500.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /broadcast-ops/crew-members/00000000-0000-4000-8000-000000000123"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_CREW_MEMBER_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: crew_call_missing_required_call_time_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /broadcast-ops/crew-calls]
        distinguishing_aspect: |
          call_time_utc has no default and is declared in the endpoint's input, so omitting it must be
          refused at the shape rung (priority 3) - before the production is even resolved, and
          certainly before turnaround or budget arithmetic.
        test_recipe:
          setup:
            - "One TIER_3 production and one STAFF member certified TIER_3."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/crew-members"
              payload: { full_name: "Dana Reyes", position: "TD", employment_type: "STAFF", union_local: "L600", certified_tiers: ["TIER_3"], hourly_rate_cents: 9000, home_base_code: "SEA" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { cm1_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/crew-calls"
              payload: { production_id: "${prod_id}", crew_member_id: "${cm1_id}", scheduled_release_utc: "2026-08-16T02:00:00Z", expected_production_version: "${pv1}" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "GET /broadcast-ops/crew-calls?production_id=${prod_id} returns total_count == 0"
            - "Production.${prod_id}.version is still ${pv1} (a shape rejection performs no write)"

      - name: truck_optional_engine_hour_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.ProductionTruck.fields.engine_hours_since_service
          - entities.ProductionTruck.fields.service_interval_hours
          - entities.ProductionTruck.fields.hours_to_service
        distinguishing_aspect: |
          Both engine-hour inputs are optional with declared defaults 0 and 500; omitting them must
          yield hours_to_service 500 and last_service_completed_at null, not nulls that later break
          the maintenance threshold arithmetic.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /broadcast-ops/trucks"
              payload: { truck_code: "TRK-09", tier_rating: "TIER_2", camera_channel_capacity: 8, power_draw_amps: 90, home_base_code: "DEN" }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { truck_id: $.data.id, hours: $.data.engine_hours_since_service }
          assert:
            - "ProductionTruck.${truck_id}.engine_hours_since_service == 0"
            - "ProductionTruck.${truck_id}.service_interval_hours == 500"
            - "ProductionTruck.${truck_id}.hours_to_service == 500"
            - "ProductionTruck.${truck_id}.status == AVAILABLE and last_service_completed_at == null"

      - name: camera_position_computed_fields_ignore_client_supplied_values
        claim_type: computed_fields
        grounds:
          - entities.CameraPosition.fields.signal_loss_db
          - entities.CameraPosition.fields.requires_operator
          - calculations.survey_signal_loss_budget
        distinguishing_aspect: |
          signal_loss_db and requires_operator are computed and are NOT in the endpoint's input list,
          so a body that smuggles them must be ignored (or refused at the shape rung) while the server
          still derives 2.03 dB and requires_operator true from cable_run_feet 150 and position_type
          HARD. A ROBO position at the same length derives the same dB but requires_operator false.
        test_recipe:
          setup:
            - "One TIER_3 production with a DRAFT survey."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
          trigger:
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pos1_id: $.data.id, loss1: $.data.signal_loss_db, op1: $.data.requires_operator }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "CENTER_FIELD", position_type: "ROBO", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pos2_id: $.data.id, op2: $.data.requires_operator }
          assert:
            - "CameraPosition.${pos1_id}.signal_loss_db == 2.03 and requires_operator == true"
            - "CameraPosition.${pos2_id}.signal_loss_db == 2.03 and requires_operator == false"
            - "VenueSurvey.${survey_id}.camera_position_count == 2, total_cable_run_feet == 300, total_signal_loss_db == 4.06, total_power_draw_amps == 40, power_headroom_amps == 360"

      - name: venue_survey_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.VenueSurvey.fields.revision
          - entities.VenueSurvey.fields.submitted_by_user_id
          - entities.VenueSurvey.fields.status
        distinguishing_aspect: |
          revision, status, submitted_by_user_id and reviewed_by_user_id are system-sourced: a fresh
          survey must read revision 1 / status DRAFT / both operator ids null, and submitted_by_user_id
          must be taken from the submit request's X-User-ID header rather than from any body field.
        test_recipe:
          setup:
            - "One TIER_3 production and a DRAFT survey with one 150 ft position."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id, rev: $.data.revision, st: $.data.status, sub: $.data.submitted_by_user_id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
          trigger:
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/submit"
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { st2: $.data.status, sub2: $.data.submitted_by_user_id, ver: $.data.version }
          assert:
            - "At creation: VenueSurvey.${survey_id}.revision == 1, status == DRAFT, submitted_by_user_id == null, reviewed_by_user_id == null, version == 1"
            - "After submit: status == SUBMITTED, submitted_by_user_id == td-001, reviewed_by_user_id == null"
            - "VenueSurvey.${survey_id}.version has increased and updated_at is no earlier than created_at"

      - name: production_enum_and_curfew_order_constraints_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Production.fields.venue_roof_type
          - entities.Production.fields.venue_curfew_utc
        distinguishing_aspect: |
          Two different shape violations on the same endpoint: an out-of-enum venue_roof_type, and a
          venue_curfew_utc that is not after scheduled_end_utc. Both must land on ERR_INVALID_REQUEST
          at priority 3 rather than on the temporal rung at 18 or the curfew rung at 45.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "GLASS", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err1: $.data.error_id }
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-15T21:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { err2: $.data.error_id }
          assert:
            - "Bad enum: HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "Curfew at or before scheduled_end_utc: HTTP 422 with error_id == ERR_INVALID_REQUEST (not ERR_VENUE_CURFEW_EXCEEDED)"
            - "GET /broadcast-ops/productions returns total_count == 0 - neither request created a row"

      - name: camera_position_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.CameraPosition
          - entities.Incident
          - endpoints[GET /broadcast-ops/venue-surveys/{id}/camera-positions]
        distinguishing_aspect: |
          CameraPosition and Incident are declared common_fields: false, so their rows expose id and
          created_at only - no version, no updated_at - and §1.5 offers no update or delete endpoint
          for either. The camera plot is revised by adding rows (which re-opens the survey), never by
          editing one.
        test_recipe:
          setup:
            - "One TIER_3 production with a DRAFT survey carrying one 150 ft HARD position."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys"
              payload: { production_id: "${prod_id}", surveyor_name: "R. Ito", fiber_drops_required: 2 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { survey_id: $.data.id }
            - call: "POST /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { label: "HIGH_HOME", position_type: "HARD", cable_run_feet: 150, power_draw_amps: 20 }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { pos1_id: $.data.id, created: $.data.created_at }
          trigger:
            - call: "GET /broadcast-ops/venue-surveys/${survey_id}/camera-positions"
              payload: { position_type: "HARD" }
              as: LeagueOperations
              as_user_id: "lo-001"
              captures: { row0_id: "$.data[0].id", row0_label: "$.data[0].label" }
          assert:
            - "The camera-position row exposes id, created_at, survey_id, label, position_type, cable_run_feet, power_draw_amps, signal_loss_db, requires_operator and no version or updated_at field"
            - "CameraPosition.${pos1_id}.created_at == 2026-08-01T00:00:00.000Z"
            - "The filtered sub-resource listing returns total_count == 1 and data[0].id == ${pos1_id}"
            - "§1.5 declares no PATCH, PUT or DELETE for /broadcast-ops/venue-surveys/{id}/camera-positions"

      - name: incident_creation_under_unknown_show_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=14]
          - errors[ERR_SHOW_NOT_FOUND]
          - entities.Incident.fields.show_execution_id
        distinguishing_aspect: |
          Incident's show_execution_id is taken from the path, never from the body, so an unknown
          parent must fail with 404 ERR_SHOW_NOT_FOUND at the existence rung - before the air-status
          rung at 27 that would otherwise complain about the show's dimension.
        test_recipe:
          setup:
            - "Empty database (no show executions at all)."
          setup_api_calls: []
          trigger:
            - call: "POST /broadcast-ops/show-executions/00000000-0000-4000-8000-000000000777/incidents"
              payload: { kind: "WEATHER_HOLD", started_at_utc: "2026-08-15T18:10:00Z", duration_minutes: 8, severity: "MINOR" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_SHOW_NOT_FOUND"
            - "error_id != ERR_SHOW_STATE_INVALID"

      - name: path_booking_foreign_key_references_are_validated
        claim_type: foreign_key_integrity
        grounds:
          - entities.PathBooking.fields.path_id
          - validations[priority=7]
          - errors[ERR_PATH_NOT_FOUND]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / path_not_found_outranks_stale_production_version
          rationale: "That instance sends an unresolvable path_id on POST /broadcast-ops/path-bookings and asserts the 404 ERR_PATH_NOT_FOUND plus the absence of any created booking row, which is exactly this flat-topology FK-integrity claim."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: path_booking_retest_loop_bounded_by_max_test_attempts
        claim_type: cyclic_loop_termination
        grounds:
          - state_machines.PathBooking[TEST_FAILED -> TEST_SCHEDULED]
          - validations[priority=33]
          - errors[ERR_TEST_ATTEMPT_LIMIT]
        distinguishing_aspect: |
          The TEST_SCHEDULED <-> TEST_FAILED cycle must be walked three times and then refuse a fourth
          entry: test_attempt_count reads 1, 2, 3 and the fourth schedule-test returns
          ERR_TEST_ATTEMPT_LIMIT while the booking stays in TEST_FAILED (it is not released and not
          confirmed). An implementation that counts test-results instead of schedule-tests, or that
          resets the counter when the booking re-enters TEST_SCHEDULED, admits a fourth attempt.
        test_recipe:
          setup:
            - "One TIER_3 production plus a FIBER, PRIMARY_ELIGIBLE path of 300 Mbps, and one PRIMARY booking of 200 Mbps over 2026-08-15T12:00Z .. 2026-08-16T02:00Z."
          setup_api_calls:
            - call: "POST /broadcast-ops/productions"
              payload: { event_tier: "TIER_3", league_code: "NBL", venue_name: "Riverside Arena", venue_power_capacity_amps: 400, venue_roof_type: "OPEN", venue_curfew_utc: "2026-08-16T06:00:00Z", scheduled_start_utc: "2026-08-15T18:00:00Z", scheduled_end_utc: "2026-08-15T22:00:00Z", labor_budget_total_cents: 2000000 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { prod_id: $.data.id, pv1: $.data.version }
            - call: "POST /broadcast-ops/transmission-paths"
              payload: { path_code: "FIB-01", path_type: "FIBER", carrier_code: "LUMEN", capacity_mbps: 300, redundancy_class: "PRIMARY_ELIGIBLE" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { path_id: $.data.id }
            - call: "POST /broadcast-ops/path-bookings"
              payload: { production_id: "${prod_id}", path_id: "${path_id}", booking_role: "PRIMARY", window_start_utc: "2026-08-15T12:00:00Z", window_end_utc: "2026-08-16T02:00:00Z", requested_mbps: 200, expected_production_version: "${pv1}" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { booking_id: $.data.id, bstat: $.data.status }
          trigger:
            - call: "POST /broadcast-ops/path-bookings/${booking_id}/schedule-test"
              payload: { test_window_start_utc: "2026-08-15T12:00:00Z", test_window_end_utc: "2026-08-15T13:00:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { c1: $.data.test_attempt_count }
            - call: "POST /broadcast-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T12:30:00Z" }
              as: TechnicalDirector
              as_user_id: "td-001"
