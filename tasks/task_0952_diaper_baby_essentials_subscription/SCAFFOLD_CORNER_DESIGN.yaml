        claim_type: invalid_transition
        grounds: ["state_machines.Cycle.CUTOFF_LOCKED_to_DISPATCHED", "validations[priority=24]", "errors[ERR_CYCLE_STATE_INVALID]"]
        distinguishing_aspect: "Dispatch declares from-state CUTOFF_LOCKED only; calling it on an ALLOCATED cycle returns ERR_CYCLE_STATE_INVALID (409) and creates no Shipment."
        test_recipe:
