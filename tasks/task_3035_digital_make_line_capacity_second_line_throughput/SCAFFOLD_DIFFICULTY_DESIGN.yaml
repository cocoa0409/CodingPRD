  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: throttle_engages_at_exactly_ceil_threshold
        grounds:
          - calculations.throttle_band
          - entities.Store.fields.throttle_state
        distinguishing_aspect: |
          Numeric threshold metric on POST /orders: with capacity 10 and
          threshold 0.8, T == ceil(8.0) == 8. Load 7 keeps the store OPEN;
          the order that takes load to exactly 8 flips it to THROTTLED (>= not
          >). The boundary value 8 itself is the crossing.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store digital capacity 10, threshold 0.8, window with room, BOWL in stock."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S11", name: "Store Eleven", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 50, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 50000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 100000 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Chicken Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_bowl: $.data.id }
            - call: "POST /api/v1/menu-items/${item_bowl}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:30:00Z", interval_end: "2026-09-01T10:45:00Z" }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "FIRST_PARTY_DIGITAL", lines: [{ menu_item_id: "${item_bowl}", quantity: 7, customizations: [] }] }
              as: StoreManager
              captures: { order7: $.data.id }
          trigger:
            - call: "GET /api/v1/stores/${store_id}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
              captures: { state_at_7: $.data.throttle_state }
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "FIRST_PARTY_DIGITAL", lines: [{ menu_item_id: "${item_bowl}", quantity: 1, customizations: [] }] }
              as: StoreManager
              captures: { order8: $.data.id }
            - call: "GET /api/v1/stores/${store_id}"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
              captures: { state_at_8: $.data.throttle_state }
          assert:
            - "after 7 entrees, Store.throttle_state == OPEN (current window load 7 < ceil(0.8*10)=8)"
            - "the 8th order is accepted (a second OPEN window 10:30-10:45 exists, so slotting overflows rather than rejects) and takes the current window's load to 8"
            - "after the 8th entree, Store.throttle_state == THROTTLED (8 >= 8)"

      - name: zero_gram_batch_boundary_and_full_waste
        grounds:
          - state_machines.IngredientBatch
          - entities.IngredientBatch.fields.grams_remaining
          - errors.ERR_WASTE_EXCEEDS_BATCH
        distinguishing_aspect: |
          Zero-quantity / empty-collection metric on POST /waste-events and batch
          lifecycle (a different endpoint from order placement): a full-batch
          waste (grams == grams_remaining) transitions the batch to WASTED and
          leaves grams_remaining at exactly 0; a further 1-gram waste against the
          same batch must fail ERR_WASTE_EXCEEDS_BATCH because 1 > 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store S12. Chicken ingredient with one 500g batch."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "S12", name: "Store Twelve", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 50, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 500 }
              as: StoreManager
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /api/v1/stores/${store_id}/waste-events"
              payload: { ingredient_batch_id: "${batch_id}", grams: 500, reason: "CONTAMINATION" }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { waste_id: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/waste-events"
              payload: { ingredient_batch_id: "${batch_id}", grams: 1, reason: "CONTAMINATION" }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "the first waste (500 == grams_remaining) succeeds and IngredientBatch.${batch_id}.status == WASTED"
            - "IngredientBatch.${batch_id}.grams_remaining == 0"
            - "WasteEvent.${waste_id}.cost_cents == 1050 (500 * 2.1)"
            - "the second 1g waste fails 422 ERR_WASTE_EXCEEDS_BATCH (1 > 0 remaining)"
            - "Ingredient.${ing_chicken}.on_hand_grams == 0"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
