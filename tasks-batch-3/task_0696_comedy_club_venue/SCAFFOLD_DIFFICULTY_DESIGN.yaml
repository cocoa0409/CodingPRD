        distinguishing_aspect: "Conserved quantity = SeatTable availability (a different conserved resource than GA headcount): assign-table holds T1 and a no-show releases it back to AVAILABLE so the table is reusable; assigned_server_id stays set so the server's assigned_table_count is unchanged at 1 (server load conserved, table freed)."
        test_recipe:
