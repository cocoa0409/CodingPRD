# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_0705_podcast_production_editing — EXPERT tier
# Cross-references SCAFFOLD.yaml §1.1–§1.7 only. Deleting this file leaves the
# scaffold's declared behavior identical; it only drives test coverage.
#
# Identity conventions (from §1.7):
#   ShowOwner  = entity_backed:Show     -> X-User-ID == owning Show.id
#   ProducerEng= entity_backed:Engineer -> X-User-ID == Engineer.id on its sessions
#   PlatformAdmin / AdOps = opaque (as_user_id omitted unless an audit id is pinned)
# Clock default (§1.5): 2026-03-01T00:00:00Z before any /_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: turnaround_provisional_vs_final_diverge_on_episode
        grounds:
          - calculations.turnaround_due
          - state_machines.Episode.RECORDING_to_EDITING
          - state_machines.Episode.REVIEW_to_MASTERED
          - entities.Episode.fields.turnaround_due_utc
          - entities.Episode.fields.planned_track_count
          - entities.Episode.fields.raw_track_count
        distinguishing_aspect: |
          Domain = Episode. Provisional turnaround anchors on recording_ended_at
          with planned_track_count (PRIORITY planned=2 -> +48h ->
          2026-03-04T00:00:00Z); the final variant anchors on assets_complete_at
          with the locked raw_track_count (raw=5 -> +66h from the later anchor ->
          2026-03-05T00:00:00Z), so the two variants yield a different
          turnaround_due_utc for the same episode.
        test_recipe:
          setup:
            - "Show S (PER_EPISODE billing) with one ACTIVE PRIORITY/PER_EPISODE contract; posture ACTIVE."
            - "Episode E created planned_track_count=2, transcript_requested=false."
            - "Recording session completed at 2026-03-02T00:00:00Z (provisional anchor); episode now EDITING with provisional turnaround_due_utc=2026-03-04T00:00:00Z."
            - "Assets locked at 2026-03-02T06:00:00Z with raw_track_count=5 (final anchor)."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Pod S", format: "INTERVIEW", billing_model: "PER_EPISODE", target_loudness_lufs: -16.0 }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "PRIORITY", engagement_type: "PER_EPISODE" }
              as: PlatformAdmin
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /engineers"
              payload: { name: "Eng A" }
              as: PlatformAdmin
              captures: { eng_id: $.data.id }
            - call: "POST /episodes"
              payload: { show_id: "${show_id}", contract_id: "${contract_id}", title: "Ep E", planned_track_count: 2, transcript_requested: false }
              as: ShowOwner
              as_user_id: "${show_id}"
              captures: { ep_id: $.data.id }
            - call: "POST /sessions"
              payload: { episode_id: "${ep_id}", engineer_id: "${eng_id}", capture_mode: "STUDIO", scheduled_start_utc: "2026-03-01T08:00:00Z", scheduled_end_utc: "2026-03-01T10:00:00Z" }
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/start"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /sessions/${sess_id}/complete"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T06:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /episodes/${ep_id}"
              payload: {}
              as: ProducerEng
              as_user_id: "${eng_id}"
              captures: { prov_due: $.data.turnaround_due_utc }
            - call: "POST /episodes/${ep_id}/lock-assets"
              payload: { raw_track_count: 5 }
              as: ProducerEng
              as_user_id: "${eng_id}"
          assert:
            - "Episode.${ep_id}.turnaround_due_utc == '2026-03-04T00:00:00Z' immediately after RECORDING->EDITING (provisional variant, planned_track_count=2, anchor recording_ended_at=2026-03-02T00:00:00Z, PRIORITY SLA 48h)."
            - "After approve-edit the finalized Episode.${ep_id}.turnaround_due_utc == '2026-03-05T00:00:00Z' (final variant, raw_track_count=5 -> 48 + max(0,5-2)*6 = 66h, anchor assets_complete_at=2026-03-02T06:00:00Z)."
            - "provisional turnaround_due_utc != final turnaround_due_utc for this same Episode."

      - name: retainer_reconciliation_projection_vs_close_diverge_on_cycle
        grounds:
          - calculations.retainer_reconciliation
          - state_machines.RetainerCycle.OPEN_to_CLOSED
          - entities.RetainerCycle.fields.included_consumed
          - entities.RetainerCycle.fields.overage_episode_count
          - endpoints."GET /retainer-cycles/{id}/projection"
        distinguishing_aspect: |
          Domain = RetainerCycle (distinct from the Episode domain of the other
          dual-variant instance). The provisional projection counts episodes with
          status IN {SCHEDULED, PUBLISHED} (over-counts: overage_episode_count=1)
          while the final close counts only PUBLISHED with published_at in window
          (overage_episode_count=0), so projection and close diverge on the same
          cycle.
        test_recipe:
          setup:
            - "Show S with ACTIVE STANDARD/RETAINER contract, monthly_included_episodes=2."
            - "RetainerCycle C OPEN over [2026-03-01T00:00:00Z, 2026-04-01T00:00:00Z)."
            - "Two episodes PUBLISHED in window (published_at set); one episode SCHEDULED (not yet published)."
          setup_api_calls:
            - call: "POST /shows"
              payload: { title: "Retainer S", format: "SOLO", billing_model: "RETAINER" }
              as: PlatformAdmin
              captures: { show_id: $.data.id }
            - call: "POST /contracts"
              payload: { show_id: "${show_id}", tier: "STANDARD", engagement_type: "RETAINER", monthly_included_episodes: 2 }
              as: PlatformAdmin
