    input: ["override?"]
    output: ReclassRequest
    side_effects: ["status=APPROVED", "Position.grade_id=target", "recompute Position.planned_cost_cents and CostCenter budget if FUNDED", "increments Position.version by 1"]

  - method: POST
    path: "/reclass-requests/{reclassId}/reject"
    description: "Reject an UNDER_REVIEW reclass"
    roles: [HRDirector]
    code: 200
    input: []
    output: ReclassRequest
    side_effects: ["status=REJECTED"]

  # --- ForecastPeriod ---
  - method: POST
    path: "/cost-centers/{costCenterId}/forecast-periods"
    description: "Create a DRAFT forecast period for a CostCenter"
    roles: [FinanceController]
    code: 201
    input: [fiscal_label, planned_fte]
    output: ForecastPeriod
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/cost-centers/{costCenterId}/forecast-periods"
    description: "List forecast periods on a CostCenter (reverse-reachability for ForecastPeriod.cost_center_id)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ForecastPeriod[]
    side_effects: []

  - method: GET
    path: "/forecast-periods/{forecastPeriodId}"
    description: "Get a ForecastPeriod"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: []
    output: ForecastPeriod
    side_effects: []

  - method: GET
    path: "/forecast-periods"
    description: "List ForecastPeriods (filter by cost_center_id) — reverse-reachability for ForecastPeriod.cost_center_id"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["cost_center_id?", "status?", "limit?", "offset?"]
    output: ForecastPeriod[]
    side_effects: []

  - method: POST
    path: "/forecast-periods/{forecastPeriodId}/snapshot"
    description: "Snapshot actual filled FTE into the forecast period and compute variance (OCC-guarded; expected_cost_center_version required)"
    roles: [FinanceController]
    code: 200
    input: ["expected_cost_center_version?"]
    output: ForecastPeriod
    side_effects: ["actual_fte=CostCenter.filled_fte", "variance_fte=actual_fte-planned_fte", "status=SNAPSHOTTED", "increments CostCenter.version by 1", "increments ForecastPeriod.version by 1"]

  # --- BudgetAdjustment (append-only budget event) ---
  - method: POST
    path: "/cost-centers/{costCenterId}/budget-adjustments"
    description: "Apply a signed budget adjustment to a CostCenter (append-only); recomputes adjusted/available budget"
    roles: [FinanceController]
    code: 201
    input: [amount_cents, memo]
    output: BudgetAdjustment
    side_effects: ["status=APPLIED", "recompute CostCenter.adjusted_budget_cents and available_budget_cents", "increments CostCenter.version by 1"]

  - method: GET
    path: "/cost-centers/{costCenterId}/budget-adjustments"
    description: "List BudgetAdjustments on a CostCenter (reverse-reachability for BudgetAdjustment.cost_center_id)"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["limit?", "offset?"]
    output: BudgetAdjustment[]
    side_effects: []

  - method: GET
    path: "/budget-adjustments/{budgetAdjustmentId}"
    description: "Get a BudgetAdjustment"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: []
    output: BudgetAdjustment
    side_effects: []

  - method: GET
    path: "/budget-adjustments"
    description: "List BudgetAdjustments (filter by cost_center_id) — reverse-reachability for BudgetAdjustment.cost_center_id"
    roles: [HRBP, HRDirector, FinanceController, CompensationAnalyst]
    code: 200
    input: ["cost_center_id?", "limit?", "offset?"]
    output: BudgetAdjustment[]
    side_effects: []

  # --- Test-driving clock endpoint ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: set the server's current UTC instant (drives FreezeOrder window posture)"
    roles: [FinanceController]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["recompute posture of all cost centers against the new clock instant; cascade freeze/unfreeze as windows open/close"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a recognised role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Malformed body: missing required field, bad enum, fte out of (0,1], negative integer" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_COST_CENTER_FROZEN, http: 409, condition: "Owning CostCenter posture is FROZEN; funding/filling/approval blocked" }
  - { id: ERR_SPAN_LIMIT_EXCEEDED, http: 409, condition: "Manager would exceed MAX_SPAN_OF_CONTROL non-ABOLISHED direct reports" }
  - { id: ERR_HAS_DIRECT_REPORTS, http: 409, condition: "Cannot abolish a position that still has non-ABOLISHED direct reports" }
  - { id: ERR_POSITION_NOT_FUNDED, http: 409, condition: "Operation requires the position to be FUNDED" }
  - { id: ERR_POSITION_ALREADY_FILLED, http: 409, condition: "Position occupancy_status is already FILLED" }
  - { id: ERR_POSITION_NOT_FILLED, http: 409, condition: "Operation requires the position to be FILLED" }
  - { id: ERR_EMPLOYEE_UNAVAILABLE, http: 409, condition: "Employee status is not AVAILABLE" }
  - { id: ERR_SALARY_OUT_OF_BAND, http: 409, condition: "Employee salary outside the grade's [band_min, band_max] inclusive" }
  - { id: ERR_INCUMBENCY_OVERLAP, http: 409, condition: "New incumbency interval overlaps an existing incumbency interval on the position" }
  - { id: ERR_FREEZE_WINDOW_OVERLAP, http: 409, condition: "FreezeOrder window overlaps another ACTIVE FreezeOrder on the cost center (half-open; touching boundaries allowed)" }
  - { id: ERR_FTE_CAP_EXCEEDED, http: 409, condition: "committed_fte + delta_fte would exceed fte_cap" }
  - { id: ERR_BUDGET_EXCEEDED, http: 409, condition: "committed_cost_cents + delta_cost would exceed annual_budget_cents and override not set" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: HRBP
    description: "HR Business Partner: drafts positions, requisitions, fills/vacates incumbents, repoints org chart."
    identity: "opaque"
    exclusive_operations:
      - "POST /positions — create position"
      - "PATCH /positions/{id} — edit position / repoint manager"
      - "POST /positions/{id}/lifecycle action=REQUISITION"
      - "POST /positions/{id}/incumbents — fill"
      - "POST /incumbents/{id}/vacate — vacate"
      - "POST /positions/{id}/requisitions — open requisition"
      - "POST /requisitions/{id}/close — close requisition"
      - "POST /requisitions/{id}/cancel — cancel requisition"
    shared_operations:
      - "POST /employees (with HRDirector)"
      - "All GET reads"

  - name: FinanceController
    description: "Finance Controller: owns cost-center budgets, funds positions, freezes/lifts, approves requisitions, snapshots forecasts."
    identity: "opaque"
    exclusive_operations:
      - "POST /cost-centers — create cost center"
      - "POST /positions/{id}/lifecycle action=FUND"
      - "POST /cost-centers/{id}/freeze-orders — open freeze"
      - "POST /freeze-orders/{id}/lift — lift freeze"
      - "POST /requisitions/{id}/approve — approve requisition"
      - "POST /cost-centers/{id}/forecast-periods — create forecast period"
      - "POST /forecast-periods/{id}/snapshot — snapshot forecast"
      - "POST /cost-centers/{id}/budget-adjustments — apply budget adjustment"
      - "POST /_clock/set_current_utc — test clock"
    shared_operations:
      - "All GET reads"

  - name: CompensationAnalyst
    description: "Compensation Analyst: owns grade bands and reclassification submissions/reviews."
    identity: "opaque"
    exclusive_operations:
      - "POST /grades — create grade"
      - "POST /positions/{id}/reclass-requests — submit reclass"
      - "POST /reclass-requests/{id}/review — to UNDER_REVIEW"
      - "POST /reclass-requests/{id}/return — back to SUBMITTED"
    shared_operations:
      - "All GET reads"

  - name: HRDirector
    description: "HR Director: final approver for reclassification and position abolishment."
    identity: "opaque"
    exclusive_operations:
      - "POST /positions/{id}/lifecycle action=ABOLISH"
      - "POST /reclass-requests/{id}/approve — approve reclass"
      - "POST /reclass-requests/{id}/reject — reject reclass"
    shared_operations:
      - "POST /employees (with HRBP)"
      - "All GET reads"
