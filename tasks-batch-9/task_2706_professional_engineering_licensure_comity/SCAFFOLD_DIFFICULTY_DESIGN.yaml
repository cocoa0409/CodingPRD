            - call: "POST /experience-records/${er_t1}/references"
              payload: { referee_engineer_id: "${eng_iris}", relationship: "DIRECT_SUPERVISOR" }
              as: Applicant
              as_user_id: "${eng_tomas}"
              captures: { ref_t1: $.data.id }
            - call: "POST /applications/${app_tomas}/payments"
              payload: { amount_cents: 30000 }
              as: Applicant
              as_user_id: "${eng_tomas}"
            - call: "POST /applications/${app_tomas}/submit"
              payload: {}
