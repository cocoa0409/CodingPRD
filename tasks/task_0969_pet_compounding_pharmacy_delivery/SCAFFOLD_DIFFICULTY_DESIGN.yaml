            - { call: "POST /compounding-benches", payload: { bench_code: "BN-X1", supports_controlled: true }, as: PharmacyAdmin, captures: { bench: $.data.id } }
          trigger:
            - { call: "POST /prescriptions/${rx}/compound-orders", payload: { is_refill: false, expected_prescription_version: "${rxv}" }, as: PharmacyTech, captures: { err: $.data.error_id } }
