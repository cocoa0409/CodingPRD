              captures: { run_id: "$.data.id", organ_v1: "$.data.version" }
          trigger:
            - call: "POST /offers"
              payload: { donor_organ_id: "${organ_id}", candidate_id: "${cand_id}", match_run_id: "${run_id}", expected_donor_organ_version: "${organ_v0}" }
              as: OrganProcurementOrg
              as_user_id: "${opo_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "Offer issuance with stale ${organ_v0} returns HTTP 412 ERR_STALE_ORGAN_VERSION"

      - name: corner_occ_offer_accept_cascade_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Offer.OFFERED_to_ACCEPTED
        excluded_because:
          difficulty_instance: tc_offer_accept_depth4_chain
          rationale: "The end-to-end accept cascade (organ ALLOCATED, candidate TRANSPLANTED, registration WITHDRAWN) is asserted by the depth-4 difficulty instance."

