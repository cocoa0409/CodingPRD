      - name: stale_parent_cut_version_on_derive_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[derive-cut-stale-parent]
          - errors[ERR_STALE_CUT_VERSION]
          - validations[priority=13]
          - entities.Cut.fields.derived_cut_count
        distinguishing_aspect: |
          Deriving a cut bumps the PARENT cut's version through derived_cut_count, so a second derive replaying the originally observed parent version is refused with ERR_STALE_CUT_VERSION 412; re-reading the parent and resending succeeds and the parent ends with derived_cut_count 2.
