    roles: [DeviceCoordinator]
    code: 201
    input: [serial_number, model, "battery_pct?"]
    output: Device
    side_effects: ["assignment_status = UNASSIGNED; dock_status = DOCKED; health_status = HEALTHY; battery_pct = input or 100"]

  - method: GET
    path: "/agencies/{agencyId}/devices/{deviceId}"
