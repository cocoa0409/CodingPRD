scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: allocation_score_standard_vs_conservative_velocity_window
        grounds:
          - calculations.allocation_priority_score
          - entities.Allocation.fields.allocation_score
        distinguishing_aspect: |
          Same club and region inputs: a REGULAR item scores velocity over a
          7-day trailing window while a TREASURE_HUNT item scores over a 3-day
          window, so two otherwise identical allocations produce different
          allocation_score values (34.05 vs 19.8625) — a dual variant on the
          Allocation/allocation domain.
        test_recipe:
          setup:
            - "Clock at 2026-09-08T09:05:00Z"
            - "Region (income 9000000), Vendor, Depot (09:00-17:00, 30-min slots), Club (member_base 100000, capacity 40)"
            - "REGULAR item and TREASURE_HUNT item, both ACTIVE, pallet_qty 480, footprint 40x40 (pallets_per_slot 1)"
            - "Member purchased 10 units of each item on 2026-09-03 (inside 7-day, outside 3-day window) and 4 units of each on 2026-09-07 (inside both)"
            - "Appointment 2026-09-08 CHECKED_IN; one pallet of each item RECEIVED on 2026-09-08; run for 2026-09-08 OPEN"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "West", code: "WEST", avg_member_income_cents: 9000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Acme Foods", vendor_code: "V100001" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/clubs"
              payload: { region_id: "${region_id}", name: "Club One", club_number: 101, floor_slot_capacity: 40, member_base: 100000 }
              as: RegionalOps
              captures: { club_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "Depot One", dock_count: 2, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "1000001", description: "Regular beans", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_reg_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "1000002", description: "Treasure chair", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "TREASURE_HUNT", exit_window_date: "2026-09-30" }
              as: CategoryManager
              captures: { item_th_id: $.data.id }
            - call: "POST /wcd/items/${item_reg_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/items/${item_th_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/members"
              payload: { club_id: "${club_id}", membership_number: "M000000001", tier: "GOLD_STAR" }
              as: MembershipDesk
              captures: { member_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T12:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/purchases"
              payload: { member_id: "${member_id}", club_id: "${club_id}", item_id: "${item_reg_id}", unit_qty: 10 }
              as: MembershipDesk
            - call: "POST /wcd/purchases"
              payload: { member_id: "${member_id}", club_id: "${club_id}", item_id: "${item_th_id}", unit_qty: 10 }
              as: MembershipDesk
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-07T12:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/purchases"
              payload: { member_id: "${member_id}", club_id: "${club_id}", item_id: "${item_reg_id}", unit_qty: 4 }
              as: MembershipDesk
            - call: "POST /wcd/purchases"
              payload: { member_id: "${member_id}", club_id: "${club_id}", item_id: "${item_th_id}", unit_qty: 4 }
              as: MembershipDesk
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-08", start_time: "09:00", end_time: "09:30", pallet_count: 2 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T09:05:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_reg_id}", unit_qty: 480 }
              as: DepotManager
              captures: { pallet_reg_id: $.data.id }
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_th_id}", unit_qty: 480 }
              as: DepotManager
              captures: { pallet_th_id: $.data.id }
            - call: "POST /wcd/cross-dock-runs"
              payload: { depot_id: "${depot_id}", run_date: "2026-09-08", cutoff_time: "16:00" }
              as: DepotPlanner
              captures: { run_id: $.data.id, run_v: $.data.version }
          trigger:
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${pallet_reg_id}", club_id: "${club_id}", expected_cross_dock_run_version: "${run_v}" }
              as: DepotPlanner
              captures: { score_reg: $.data.allocation_score }
            - call: "POST /wcd/cross-dock-runs/${run_id}/allocations"
              payload: { pallet_id: "${pallet_th_id}", club_id: "${club_id}", expected_cross_dock_run_version: "${run_v} + 1" }
              as: DepotPlanner
              captures: { score_th: $.data.allocation_score }
          assert:
            - "score_reg == 34.05 (velocity 14 over the 7-day window: (14+10) * 1.25 * 1.135)"
            - "score_th == 19.8625 (velocity 4 over the 3-day window: (4+10) * 1.25 * 1.135)"
            - "score_reg != score_th despite identical club, region, and item dimensions"

      - name: chargeback_provisional_vs_final_over_pallet
        grounds:
          - calculations.chargeback_amount
          - entities.Chargeback.fields.amount_cents
        distinguishing_aspect: |
          Same OVER_PALLET_COUNT violation: the provisional variant counts
          received pallets mid-unload (1 received against a booked count of 1
          -> no per-pallet penalty -> 25000 cents), while the final variant
          assessed at completion counts all 3 received pallets (25000 + 2 *
          6000 = 37000 cents) — a dual variant on the Chargeback/fiscal
          domain, distinct from the allocation-scoring domain of the sibling.
        test_recipe:
          setup:
            - "Clock 2026-09-02T09:05:00Z; Region, Vendor, Depot, ACTIVE REGULAR item (pallet_qty 480)"
            - "Appointment A1 for 2026-09-02 09:00-09:30 with pallet_count=1, CHECKED_IN on time at 09:05"
            - "3 pallets of the item received under A1 (2 over the booked count)"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "East", code: "EAST", avg_member_income_cents: 5000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
            - call: "POST /wcd/vendors"
              payload: { name: "Beta Goods", vendor_code: "V200002" }
              as: RegionalOps
              captures: { vendor_id: $.data.id }
            - call: "POST /wcd/depots"
              payload: { region_id: "${region_id}", name: "Depot East", dock_count: 1, dock_hours_open: "09:00", dock_hours_close: "17:00", slot_length_minutes: 30 }
              as: DepotManager
              captures: { depot_id: $.data.id }
            - call: "POST /wcd/items"
              payload: { vendor_id: "${vendor_id}", sku: "2000001", description: "Paper towels", case_pack_qty: 24, pallet_length_in: 40, pallet_width_in: 40, cases_per_layer: 5, max_layers: 4, item_type: "REGULAR" }
              as: CategoryManager
              captures: { item_id: $.data.id }
            - call: "POST /wcd/items/${item_id}/activate"
              payload: {}
              as: CategoryManager
            - call: "POST /wcd/appointments"
              payload: { depot_id: "${depot_id}", vendor_id: "${vendor_id}", delivery_date: "2026-09-02", start_time: "09:00", end_time: "09:30", pallet_count: 1 }
              as: VendorRep
              as_user_id: "${vendor_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:05:00Z" }
              as: RegionalOps
            - call: "POST /wcd/appointments/${appt_id}/check-in"
              payload: {}
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_id}", unit_qty: 480 }
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_id}", unit_qty: 480 }
              as: DepotManager
            - call: "POST /wcd/pallets"
              payload: { appointment_id: "${appt_id}", item_id: "${item_id}", unit_qty: 480 }
              as: DepotManager
          trigger:
            - call: "POST /wcd/appointments/${appt_id}/complete"
              payload: {}
              as: DepotManager
              captures: { appt_status: $.data.status, appt_cb: $.data.chargeback_cents }
            - call: "GET /wcd/chargebacks"
              payload: { appointment_id: "${appt_id}" }
              as: DepotManager
              captures: { cb_amount: "$.data[0].amount_cents", cb_reason: "$.data[0].reason" }
          assert:
            - "cb_reason == OVER_PALLET_COUNT"
            - "cb_amount == 37000 (base 25000 + 2 extra pallets * 6000, repeat multiplier 1.0 for first offense)"
            - "A provisional mid-unload reading at 1 received pallet would have been 25000; the final assessment at completion is 37000"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: unload_fee_tier_crossing_with_repeat_offender_chargeback
        grounds:
          - calculations.unload_fee_assessment
          - calculations.chargeback_amount
          - entities.Appointment.fields.unload_fee_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order:
          chargeback amount depends on prior CONFIRMED chargebacks (repeat
          multiplier evaluated after base + per-pallet penalty), while the
          unload fee tiers on booked pallet_count (tier lookup before
          multiplier). Same vendor history yields unload_fee 152100 for a
          26-pallet completion and a NO_SHOW chargeback of 112500.
        test_recipe:
          setup:
            - "Vendor with exactly 2 CONFIRMED NO_SHOW chargebacks assessed 2026-09-01 (repeat multiplier 1.5)"
            - "Appointment A_big (pallet_count 26) checked in 2026-09-04 08:05 with 26 pallets received"
            - "Appointment A_ns (pallet_count 1) booked for 2026-09-05, never checked in"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
            - call: "POST /wcd/regions"
              payload: { name: "Central", code: "CENT", avg_member_income_cents: 5000000 }
              as: RegionalOps
              captures: { region_id: $.data.id }
