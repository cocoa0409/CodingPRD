          Depth-3 cascade triggered by the final written decision: FWD issuance
          mutates the Proceeding (DECIDED, estoppel attached); that mutation
          recomputes the Patent ledger (-> FULLY_CANCELLED); the patent flip
          itself force-stays the ACTIVE district-court matter with
