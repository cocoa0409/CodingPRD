            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-07T16:00:00Z" }, as: ShopManager }
            - { call: "POST /mro/work-orders/${wo}/test-results", payload: { result: "PASS", atp_reference: "ATP-1" }, as: Inspector, as_user_id: "insp-9" }
            - { call: "POST /mro/work-orders/${wo}/release", payload: {}, as: Inspector, as_user_id: "insp-9" }
          trigger:
            - { call: "POST /mro/work-orders/${wo}/invoice", payload: {}, as: CustomerServiceRep, captures: { pen: $.data.penalty_credit_cents, tot: $.data.total_cents } }
          assert:
            - "pen == 0 (adjusted 160-60 == 100h == guarantee; boundary is strict-greater on excess, not >=)"
            - "tot == 2975000 (2000000 + 575000 + 400000, no penalty credit)"
      - name: warranty_cycle_claim_exactly_at_limit_eligible
        grounds:
          - calculations.warranty_credit_calc
          - validations[priority=21.5]
        distinguishing_aspect: |
          Metric: claim_cycles_used vs warranty_cycle_limit, via POST /mro/warranty-claims
          (third distinct metric/endpoint). The limit is INCLUSIVE: 500 cycles on a 500-cycle
          limit is accepted; the out-of-limit sibling (501) is covered in the corner design.
        test_recipe:
          setup:
