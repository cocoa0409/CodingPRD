      - name: recovery_per_year_rounding_covered_by_the_difficulty_design
        claim_type: aggregation
        grounds:
          - calculations.recovery_assessment_total
        excluded_because:
          difficulty_instance: recovery_assessment_rounds_per_year_before_summing
          rationale: "That instance already pins the round-then-sum order across a multi-year improper interval and asserts back_tax_cents, penalty_cents, interest_cents and total_assessed_cents separately, including the penalty being derived from the already-rounded per-year back tax. A corner probe of the same aggregation would only re-assert the same four literals."

      - name: refund_variant_divergence_covered_by_the_difficulty_design
        claim_type: variant_divergence
        grounds:
          - calculations.retroactive_refund_amount.variants
        excluded_because:
          difficulty_instance: refund_gross_provisional_versus_net_final_on_retroactive_claim
          rationale: "The GROSS_PROVISIONAL versus NET_FINAL divergence is the entire subject of that instance: it files a claim, reads gross_refund_cents, then approves it with an outstanding recovery balance and asserts the strictly smaller net principal plus the interest computed on un-offset remainders only."

      - name: refund_offset_reconciliation_covered_by_the_difficulty_design
        claim_type: reconciliation
        grounds:
          - calculations.retroactive_refund_amount
          - entities.RetroactiveClaim.fields.offset_applied_cents
        excluded_because:
          difficulty_instance: refund_gross_provisional_versus_net_final_on_retroactive_claim
          rationale: "Reconciliation between the two variants — gross minus offset_applied_cents equals net_refund_cents, and the offset is credited against the outstanding FraudCase balance oldest-year-first — is asserted there on both sides of the ledger in the same instance."

      - name: risk_variant_selection_covered_by_the_difficulty_design
        claim_type: variant_selection
        grounds:
          - calculations.fraud_risk_score.variants
        excluded_because:
          difficulty_instance: fraud_risk_screening_snapshot_versus_adjudication_replay
          rationale: "Which variant runs at which endpoint (SCREENING_SNAPSHOT at POST /fraud-cases, ADJUDICATION_REPLAY at POST /fraud-cases/{id}/decide) is exactly what that instance discriminates, using one VerificationCheck log that yields two different scores."

      - name: risk_weighting_covered_by_the_difficulty_design
        claim_type: weighted_scoring
        grounds:
          - calculations.fraud_risk_score
        excluded_because:
          difficulty_instance: fraud_risk_screening_snapshot_versus_adjudication_replay
          rationale: "The basis-point weights of the four factors and the single round_half_up on the weighted sum are pinned there by asserting both the snapshot and the replay integer scores from a known factor vector; re-deriving the same weights here would add no new observable."

