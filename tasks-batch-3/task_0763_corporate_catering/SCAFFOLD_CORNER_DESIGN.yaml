# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide sections. Full test_recipe on
# active corners; excluded_because stubs where §1.8 already covers the claim.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_client_site_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.ClientSite.fields.status, entities.ClientSite.fields.cost_status]
        distinguishing_aspect: "POST /api/client-sites with required fields -> 201; status=ACTIVE, cost_status=ON_TARGET, version=1, counters 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id", st: "$.data.status", ver: "$.data.version" }
          assert:
            - "response code == 201"
            - "ClientSite.${site_id}.status == ACTIVE"
            - "ClientSite.${site_id}.cost_status == ON_TARGET"
            - "ClientSite.${site_id}.version == 1"

      - name: get_client_site_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET /api/client-sites/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /api/client-sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: SiteAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_employee_missing_badge_id_returns_validation
        claim_type: Required Fields
        grounds: [entities.Employee.fields.badge_id, "errors[ERR_VALIDATION]", "validations[priority=3]"]
        distinguishing_aspect: "POST /api/employees omitting required badge_id -> ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A site exists."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
          trigger:
            - call: "POST /api/employees"
              payload: { client_site_id: "${site_id}", full_name: "No Badge" }
              as: SiteAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response code == 400"
            - "response error_id == ERR_VALIDATION"

      - name: create_employee_bad_site_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Employee.fields.client_site_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /api/employees whose client_site_id references no ClientSite -> ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/employees"
              payload: { client_site_id: "00000000-0000-0000-0000-000000000000", badge_id: "B1", full_name: "Ghost" }
              as: SiteAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_NOT_FOUND"

      - name: duplicate_badge_at_site_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_DUPLICATE_BADGE]", "validations[priority=9]"]
        distinguishing_aspect: "Second employee with the same badge_id at the same site -> ERR_DUPLICATE_BADGE (409)."
        test_recipe:
          setup: ["A site with employee badge B1."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/employees"
              payload: { client_site_id: "${site_id}", badge_id: "B1", full_name: "First" }
              as: SiteAdmin
          trigger:
            - call: "POST /api/employees"
              payload: { client_site_id: "${site_id}", badge_id: "B1", full_name: "Second" }
              as: SiteAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_DUPLICATE_BADGE"

      - name: system_fields_server_minted_on_create
        claim_type: System Fields
        grounds: [entities.ClientSite.fields.status]
        distinguishing_aspect: "id/created_at/version are server-minted; version starts at 1 and id is a bare UUID (no type prefix)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /api/vendors"
              payload: { name: "FreshCo", category: "PRODUCE" }
              as: SiteAdmin
              captures: { vid: "$.data.id", vver: "$.data.version" }
          assert:
            - "Vendor.${vid}.version == 1"
            - "Vendor.${vid}.id is a UUID with no type prefix"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: publish_empty_menu_cycle_returns_error
        claim_type: Precondition Enforcement
        grounds: [state_machines.MenuCycle.DRAFT_to_PUBLISHED, "errors[ERR_EMPTY_MENU_CYCLE]"]
        distinguishing_aspect: "Publishing a DRAFT cycle with zero MenuItems -> ERR_EMPTY_MENU_CYCLE (409)."
        test_recipe:
          setup: ["A DRAFT cycle with no items."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: "$.data.id" }
          trigger:
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_EMPTY_MENU_CYCLE"
            - "MenuCycle.${cyc_id}.status == DRAFT (unchanged)"

      - name: open_session_unpublished_cycle_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ServiceSession.FORECAST_LOCKED_to_IN_SERVICE, "errors[ERR_MENU_CYCLE_NOT_PUBLISHED]"]
        distinguishing_aspect: "Opening a FORECAST_LOCKED session whose MenuCycle is still DRAFT -> ERR_MENU_CYCLE_NOT_PUBLISHED (cross-entity guard)."
        test_recipe:
          setup: ["Session FORECAST_LOCKED under a DRAFT (unpublished) cycle that nonetheless has an item."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: "$.data.id" }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "LUNCH", window_start: "2026-03-02T11:00:00Z", window_end: "2026-03-02T12:00:00Z", forecast_headcount: 50 }
              as: CafeteriaManager
              captures: { sess_id: "$.data.id" }
            - call: "POST /api/service-sessions/${sess_id}/lock-forecast"
              payload: {}
              as: CafeteriaManager
          trigger:
            - call: "POST /api/service-sessions/${sess_id}/open"
              payload: {}
              as: CafeteriaManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_MENU_CYCLE_NOT_PUBLISHED"

      - name: pay_unmatched_invoice_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.VendorInvoice.APPROVED_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying a RECEIVED (not APPROVED) invoice -> ERR_INVALID_STATE; PAID is only reachable from APPROVED."
        test_recipe:
          setup: ["An invoice in RECEIVED against a RECEIVED PO."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/vendors"
              payload: { name: "FreshCo", category: "DRY_GOODS" }
              as: SiteAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /api/purchase-orders"
              payload: { vendor_id: "${vendor_id}", client_site_id: "${site_id}", lines: [ { ingredient: "FLOUR", qty: 10, unit_cost_cents: 200 } ] }
              as: CafeteriaManager
              captures: { po_id: "$.data.id" }
            - call: "POST /api/vendor-invoices"
              payload: { vendor_id: "${vendor_id}", purchase_order_id: "${po_id}", invoiced_amount_cents: 2000 }
              as: FinanceController
              captures: { inv_id: "$.data.id" }
          trigger:
            - call: "POST /api/vendor-invoices/${inv_id}/pay"
              payload: {}
              as: FinanceController
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: match_paid_invoice_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.VendorInvoice.RECEIVED_to_MATCHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From terminal PAID no transition is possible: re-matching a PAID invoice -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["A PAID invoice: PO received, matched (variance 0), approved, paid."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/vendors"
              payload: { name: "FreshCo", category: "DRY_GOODS" }
              as: SiteAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /api/purchase-orders"
              payload: { vendor_id: "${vendor_id}", client_site_id: "${site_id}", lines: [ { ingredient: "FLOUR", qty: 10, unit_cost_cents: 200 } ] }
              as: CafeteriaManager
              captures: { po_id: "$.data.id" }
            - call: "POST /api/purchase-orders/${po_id}/issue"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/purchase-orders/${po_id}/receive"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/vendor-invoices"
              payload: { vendor_id: "${vendor_id}", purchase_order_id: "${po_id}", invoiced_amount_cents: 2000 }
              as: FinanceController
              captures: { inv_id: "$.data.id" }
            - call: "POST /api/vendor-invoices/${inv_id}/match"
              payload: {}
              as: FinanceController
            - call: "POST /api/vendor-invoices/${inv_id}/resolve"
              payload: { resolution: "APPROVE" }
              as: FinanceController
            - call: "POST /api/vendor-invoices/${inv_id}/pay"
              payload: {}
              as: FinanceController
          trigger:
            - call: "POST /api/vendor-invoices/${inv_id}/match"
              payload: {}
              as: FinanceController
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "VendorInvoice.${inv_id}.status == PAID"

      - name: cancel_session_with_sales_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ServiceSession.IN_SERVICE_to_CANCELLED, "errors[ERR_SESSION_HAS_SALES]"]
        distinguishing_aspect: "Cancelling an IN_SERVICE session that has a COMPLETED transaction -> ERR_SESSION_HAS_SALES."
        test_recipe:
          setup: ["IN_SERVICE session with one COMPLETED txn."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/employees"
              payload: { client_site_id: "${site_id}", badge_id: "B1", full_name: "Dee Iner" }
              as: SiteAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: "$.data.id" }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { wrap_id: "$.data.id" }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "LUNCH", window_start: "2026-03-02T11:00:00Z", window_end: "2026-03-02T12:00:00Z", forecast_headcount: 50 }
              as: CafeteriaManager
              captures: { sess_id: "$.data.id" }
            - call: "POST /api/service-sessions/${sess_id}/lock-forecast"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions/${sess_id}/open"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/badge-transactions"
              payload: { employee_id: "${emp_id}", service_session_id: "${sess_id}", lines: [ { menu_item_id: "${wrap_id}", qty: 1 } ], payment_method: "BADGE_PAYROLL" }
              as: Diner
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /api/service-sessions/${sess_id}/cancel"
              payload: {}
              as: CafeteriaManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_SESSION_HAS_SALES"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: invoice_variance_too_large_on_approve
        claim_type: Violation to Error
        grounds: [calculations.invoice_three_way_match, "errors[ERR_VARIANCE_TOO_LARGE]", "validations[priority=10]"]
        distinguishing_aspect: "Approving a MATCHED invoice whose |variance| (1000) exceeds MATCH_TOLERANCE_CENTS (500) -> ERR_VARIANCE_TOO_LARGE."
        test_recipe:
          setup: ["Invoice MATCHED with variance 1000 (PO total 2000, invoiced 3000)."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/vendors"
              payload: { name: "FreshCo", category: "DRY_GOODS" }
              as: SiteAdmin
              captures: { vendor_id: "$.data.id" }
            - call: "POST /api/purchase-orders"
              payload: { vendor_id: "${vendor_id}", client_site_id: "${site_id}", lines: [ { ingredient: "FLOUR", qty: 10, unit_cost_cents: 200 } ] }
              as: CafeteriaManager
              captures: { po_id: "$.data.id" }
            - call: "POST /api/purchase-orders/${po_id}/issue"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/purchase-orders/${po_id}/receive"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/vendor-invoices"
              payload: { vendor_id: "${vendor_id}", purchase_order_id: "${po_id}", invoiced_amount_cents: 3000 }
              as: FinanceController
              captures: { inv_id: "$.data.id" }
            - call: "POST /api/vendor-invoices/${inv_id}/match"
              payload: {}
              as: FinanceController
          trigger:
            - call: "POST /api/vendor-invoices/${inv_id}/resolve"
              payload: { resolution: "APPROVE" }
              as: FinanceController
              captures: { err: "$.data.error_id" }
          assert:
            - "VendorInvoice.${inv_id}.matched_variance_cents == 1000"
            - "response error_id == ERR_VARIANCE_TOO_LARGE"

      - name: catering_headcount_exceeds_venue_capacity
        claim_type: Violation to Error
        grounds: ["errors[ERR_VENUE_CAPACITY_EXCEEDED]", state_machines.CateringOrder.DRAFT_to_SUBMITTED, "validations[priority=9]"]
        distinguishing_aspect: "Submitting a catering order with headcount 120 to a venue of capacity 100 -> ERR_VENUE_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["DRAFT order headcount 120 on a venue capacity 100."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: "$.data.id" }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { wrap_id: "$.data.id" }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/catering-venues"
              payload: { client_site_id: "${site_id}", name: "Hall A", capacity: 100 }
              as: SiteAdmin
              captures: { venue_id: "$.data.id" }
            - call: "POST /api/catering-orders"
              payload: { client_site_id: "${site_id}", venue_id: "${venue_id}", event_date: "2026-03-10", event_start: "2026-03-10T10:00:00Z", event_end: "2026-03-10T11:00:00Z", headcount: 120, lines: [ { menu_item_id: "${wrap_id}", qty: 1 } ] }
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { order_id: "$.data.id" }
          trigger:
            - call: "POST /api/catering-orders/${order_id}/submit"
              payload: {}
              as: CateringCoordinator
              as_user_id: "coord-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_VENUE_CAPACITY_EXCEEDED"

      - name: duplicate_session_slot_rejected
        claim_type: Violation to Error
        grounds: ["errors[ERR_DUPLICATE_SESSION_SLOT]", "validations[priority=9]"]
        distinguishing_aspect: "A second session for the same (site, date, meal_period) -> ERR_DUPLICATE_SESSION_SLOT."
        test_recipe:
          setup: ["A LUNCH session exists for site on 2026-03-02."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: "$.data.id" }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "LUNCH", window_start: "2026-03-02T11:00:00Z", window_end: "2026-03-02T12:00:00Z", forecast_headcount: 50 }
              as: CafeteriaManager
          trigger:
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "LUNCH", window_start: "2026-03-02T13:00:00Z", window_end: "2026-03-02T14:00:00Z", forecast_headcount: 40 }
              as: CafeteriaManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response error_id == ERR_DUPLICATE_SESSION_SLOT"

      - name: terminated_employee_pos_rejected
        claim_type: Cross-entity validation
        grounds: [state_machines.Employee.ACTIVE_to_TERMINATED, "errors[ERR_EMPLOYEE_INACTIVE]", "validations[priority=7]"]
        distinguishing_aspect: "A TERMINATED employee attempting a POS purchase -> ERR_EMPLOYEE_INACTIVE."
        test_recipe:
          setup: ["IN_SERVICE session; employee terminated after registration."]
          setup_api_calls:
            - call: "POST /api/client-sites"
              payload: { name: "HQ", client_name: "Acme", employer_subsidy_pct: 0.5, daily_subsidy_cap_cents: 1000, food_cost_target_pct: 0.32 }
              as: SiteAdmin
              captures: { site_id: "$.data.id" }
            - call: "POST /api/employees"
              payload: { client_site_id: "${site_id}", badge_id: "B1", full_name: "Gone Soon" }
              as: SiteAdmin
              captures: { emp_id: "$.data.id" }
            - call: "POST /api/menu-cycles"
              payload: { client_site_id: "${site_id}", name: "Spring", cycle_length_weeks: 4 }
              as: CafeteriaManager
              captures: { cyc_id: "$.data.id" }
            - call: "POST /api/menu-items"
              payload: { menu_cycle_id: "${cyc_id}", name: "Wrap", category: "ENTREE", price_cents: 350, standard_recipe_cost_cents: 120 }
              as: CafeteriaManager
              captures: { wrap_id: "$.data.id" }
            - call: "POST /api/menu-cycles/${cyc_id}/publish"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions"
              payload: { client_site_id: "${site_id}", menu_cycle_id: "${cyc_id}", service_date: "2026-03-02", meal_period: "LUNCH", window_start: "2026-03-02T11:00:00Z", window_end: "2026-03-02T12:00:00Z", forecast_headcount: 50 }
              as: CafeteriaManager
              captures: { sess_id: "$.data.id" }
            - call: "POST /api/service-sessions/${sess_id}/lock-forecast"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/service-sessions/${sess_id}/open"
              payload: {}
              as: CafeteriaManager
            - call: "POST /api/employees/${emp_id}/terminate"
              payload: {}
              as: SiteAdmin
          trigger:
            - call: "POST /api/badge-transactions"
