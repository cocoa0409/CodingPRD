            - call: "POST /distribution/branches"
              payload: { market_area_id: "${ma_id}", branch_code: "RB-101", branch_type: "FULL_SERVICE", tenure_class: "LEASED", deposit_balance_cents: 4800000000, monthly_transaction_count: 5400, digital_adoption_bps: 5400, annual_noninterest_expense_cents: 38000000, annual_revenue_cents: 40000000, fte_count: 9, atm_count: 2, opened_on: "2005-03-01" }
              as: NetworkStrategist
