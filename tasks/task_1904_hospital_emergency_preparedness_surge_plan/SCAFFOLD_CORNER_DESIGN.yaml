- section: validations
  instances:
  - name: unauthenticated_request_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: A request without X-User-Role/X-User-ID headers is rejected
      401 before anything else.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: GET /emergency/incidents/11111111-2222-4333-8444-555555555555
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_UNAUTHENTICATED (HTTP 401)
  - name: unauthenticated_action_beats_not_found_priority
    claim_type: priority_ordering
    grounds:
    - validations[priority=1]
    - validations[priority=3]
    distinguishing_aspect: 'Missing auth (priority 1) outranks a nonexistent path
      id (priority 3): the response is 401, not 404.'
    test_recipe:
      setup:
      - Empty database (id certainly nonexistent)
      setup_api_calls: []
      trigger:
      - call: POST /emergency/incidents/11111111-2222-4333-8444-555555555555/demobilize
        captures:
          err: $.data.error_id
      assert:
      - ${err} == ERR_UNAUTHENTICATED (HTTP 401)
  - name: existence_beats_state_priority
    claim_type: priority_ordering
    grounds:
    - validations[priority=3]
    - validations[priority=8]
    distinguishing_aspect: Discharging a nonexistent patient id returns 404 ERR_NOT_FOUND,
      never a state-machine error.
    test_recipe:
      setup:
      - Empty database
      setup_api_calls: []
      trigger:
      - call: POST /emergency/patient-records/11111111-2222-4333-8444-555555555555/discharge
        as: PlanningChief
        captures:
