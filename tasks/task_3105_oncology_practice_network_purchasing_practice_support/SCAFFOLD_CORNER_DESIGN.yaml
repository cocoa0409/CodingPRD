        distinguishing_aspect: "Priority 1 fires before any resource lookup: a GET whose role header names an unknown role is rejected with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER — not a 404 for the missing resource and not a 403."
        test_recipe:
