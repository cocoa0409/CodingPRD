      - name: response_envelope_object_and_error_shapes
        claim_type: standard_crud
        grounds: [response_envelope, "endpoints.GET /credit/borrowers/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "The fixed envelope wraps every response: success reads expose meta.api_request_id/api_request_timestamp with response_type 'object', and the 404 read exposes response_type 'error' with data.error_id/data.message."
        test_recipe:
          setup: ["Officer rm; one borrower created"]
          setup_api_calls:
            - { call: "POST /credit/bank-officers", payload: { full_name: "Rita RM" }, as: BankAdmin, captures: { rm: $.data.id } }
