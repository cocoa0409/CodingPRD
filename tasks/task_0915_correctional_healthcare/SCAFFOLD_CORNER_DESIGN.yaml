          - state_machines.Grievance.FILED_to_WITHDRAWN
        distinguishing_aspect: "A DECIDED grievance closes to the terminal CLOSED state and a second close returns 409 ERR_INVALID_STATE; a separate FILED grievance withdraws to WITHDRAWN with outcome WITHDRAWN."
        test_recipe:
