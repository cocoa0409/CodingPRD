scenario: "Domain Registrar & Web Hosting (GoDaddy style): domain search/registration & WHOIS privacy, renewal/auto-renew & expiration/redemption grace, transfer (EPP auth) & lock, hosting plan & resource (storage/bandwidth), SSL & email add-on, DNS management, billing & upsell, abuse/suspension"
domain_name: "domain-registrar-hosting"
api_prefix: "/registrar"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - ops_run_checkpoint

  entity_topology: graph
  # Domain, HostingSubscription, AddOn, Invoice and BillingPeriod form a
  # many-to-many web: an AddOn points at BOTH a Domain and a HostingSubscription;
  # a HostingSubscription points at a Domain (primary_domain_id) and a HostingPlan;
  # InvoiceLineItem carries a polymorphic reference_id into Domain / Subscription /
  # AddOn / BillingPeriod. No strict ownership tree exists.

  state_machine_shape: parallel
  # Domain carries TWO independent state dimensions on the same row:
  # lifecycle_status (PENDING_PAYMENT..DELETED, with EXPIRED->ACTIVE and
  # REDEMPTION->ACTIVE revival cycles) and lock_status (LOCKED<->UNLOCKED).
  # TransferRequest is cyclic (INITIATED->PENDING_ACK->REJECTED->INITIATED).
  # AbuseReport is branching (UNDER_REVIEW -> {UPHELD, DISMISSED}).

  relationship_patterns:
    - one_to_many
    - many_to_many
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  # The AbuseAnalyst who moves a report to UNDER_REVIEW (reviewer_user_id) may NOT
  # be the AbuseAnalyst who upholds or dismisses it (decider_user_id).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Billing contact email; unique across accounts
        constraints: "unique; non-empty"
      - name: company_name
        type: string
        source: input
        description: Legal/registrant company name shown in WHOIS when privacy is off
      - name: status
        type: enum
        source: computed
        description: Account posture; SUSPENDED gates every mutating operation by the Registrant
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED | CLOSED"
      - name: payment_method_token
        type: string
        source: input
        description: Opaque card token supplied via POST /accounts/{id}/payment-method; null until set
        default: null
      - name: payment_method_on_file
        type: boolean
        source: computed
        description: True iff payment_method_token is non-null
        default: false
      - name: auto_renew_default
        type: boolean
        source: input
        description: Default value copied into Domain.auto_renew_enabled at registration when the request omits auto_renew
        default: true
      - name: credit_balance_cents
        type: integer
        source: computed
        description: "Store credit, per calculations.account_credit_balance: SUM(LedgerEntry.amount_cents WHERE entry_type IN {CREDIT_GRANT, CREDIT_APPLIED})"
        default: 0
      - name: net_cash_cents
        type: integer
        source: computed
        description: "Conserved cash quantity, per calculations.account_cash_conservation: SUM(LedgerEntry.amount_cents WHERE entry_type IN {PAYMENT, REFUND})"
        default: 0
      - name: risk_score
        type: integer
        source: computed
        description: "Abuse risk 0..100, per calculations.account_risk_score; >= 70 auto-suspends the account"
        default: 0

  - name: Domain
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the registrant account that owns this domain
      - name: domain_name
        type: string
        source: input
        description: Second-level label without the dot (e.g. "example"); lowercase
        constraints: "1..63 chars, [a-z0-9-]"
      - name: tld
        type: enum
        source: input
        description: Top-level domain
        constraints: "com | net | io | xyz"
      - name: fqdn
        type: string
        source: computed
        description: "domain_name + '.' + tld; globally unique across Domains whose lifecycle_status != DELETED and != TRANSFERRED_OUT"
      - name: is_premium
        type: boolean
        source: computed
        description: "True iff len(domain_name) <= 3; premium names are priced at PREMIUM_MULTIPLIER x the TLD base price"
      - name: lifecycle_status
        type: enum
        source: computed
        description: First independent state dimension (see state_machines Domain.lifecycle_status)
        default: PENDING_PAYMENT
        constraints: "PENDING_PAYMENT | ACTIVE | SUSPENDED | EXPIRED | REDEMPTION | PENDING_DELETE | DELETED | TRANSFERRED_OUT"
      - name: lock_status
        type: enum
        source: computed
        description: Second independent state dimension (registrar transfer lock; see state_machines Domain.lock_status)
        default: LOCKED
        constraints: "LOCKED | UNLOCKED"
      - name: suspension_reason
        type: enum
        source: computed
        description: Why lifecycle_status is SUSPENDED; null otherwise
        default: null
        constraints: "ABUSE | null"
      - name: whois_privacy_enabled
        type: boolean
        source: input
        description: When true, GET /domains/{id} as Anonymous masks registrant_name/registrant_email
        default: false
      - name: auto_renew_enabled
        type: boolean
        source: input
        description: When true, the expiry sweep renews the domain for 1 year instead of expiring it
        default: true
      - name: registrant_name
        type: string
        source: input
        description: WHOIS registrant name
      - name: registrant_email
        type: string
        source: input
        description: WHOIS registrant email
      - name: term_years
        type: integer
        source: input
        description: Registration term in years at creation
        constraints: "1..10"
      - name: registered_at
        type: datetime
        source: system
        description: Logical clock value when the registration invoice was paid; null while PENDING_PAYMENT
        default: null
      - name: expires_at
        type: datetime
        source: computed
        description: "Term end; set at activation to registered_at + term_years*365 days; recomputed by calculations.domain_renewal_charge on renew"
        default: null
      - name: epp_auth_code
        type: string
        source: system
        description: Server-minted transfer authorization code, generated at activation; returned only to the owning Registrant / SupportAgent / PlatformAdmin, null in the Anonymous WHOIS projection
        default: null

  - name: DnsRecord
    parent: Domain
    common_fields: true
    fields:
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; the zone this record belongs to
      - name: record_type
        type: enum
        source: input
        description: DNS record type
        constraints: "A | AAAA | CNAME | MX | TXT | NS"
      - name: name
        type: string
        source: input
        description: Record label relative to the zone (e.g. "@", "www", "_acme-challenge")
      - name: value
        type: string
        source: input
        description: Record value (IP, hostname, or TXT payload)
      - name: ttl
        type: integer
        source: input
        description: Time-to-live in seconds
        default: 3600
        constraints: "60..86400"
      - name: priority
        type: integer
        source: input
        description: MX preference; required when record_type == MX, must be null otherwise
        default: null
      - name: serving_enabled
        type: boolean
        source: computed
        description: "False while the parent Domain.lifecycle_status IN {SUSPENDED, EXPIRED, REDEMPTION, PENDING_DELETE, DELETED, TRANSFERRED_OUT}; true otherwise"
        default: true

  - name: HostingPlan
    parent: null
    common_fields: false
    fields:
      - name: plan_code
        type: string
        source: input
        description: Unique plan code
        constraints: "unique"
      - name: tier
        type: enum
        source: input
        description: Marketing tier
        constraints: "STARTER | DELUXE | ULTIMATE"
      - name: storage_quota_mb
        type: integer
        source: input
        description: Hard cap on HostingSubscription.storage_committed_mb
      - name: bandwidth_quota_mb
        type: integer
        source: input
        description: Bandwidth included per billing period before overage applies
      - name: monthly_price_cents
        type: integer
        source: input
        description: Recurring price billed at subscription creation
      - name: included_mailboxes
        type: integer
        source: input
        description: Informational cap on mailbox count (not enforced; storage_quota_mb is the enforced limit)
      - name: included_ssl
        type: boolean
        source: input
        description: When true, SSL_CERT add-ons on this subscription are priced at 0 cents
      - name: overage_rate_cents_per_gb
        type: integer
        source: input
        description: Base bandwidth overage rate used by calculations.hosting_bandwidth_overage

  - name: HostingSubscription
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; owning account
      - name: plan_id
        type: string
        source: input
        description: FK -> HostingPlan.id; the purchased plan
      - name: primary_domain_id
        type: string
        source: input
        description: FK -> Domain.id; the site's primary domain; null when the subscription has no domain bound
        default: null
      - name: status
        type: enum
        source: computed
        description: See state_machines HostingSubscription
        default: PROVISIONING
        constraints: "PROVISIONING | ACTIVE | OVER_QUOTA | SUSPENDED | CANCELLED"
      - name: storage_committed_mb
        type: integer
        source: computed
        description: "Conserved capacity quantity, per calculations.storage_commitment: SUM(AddOn.storage_mb_quota WHERE subscription_id = this AND add_on_type = EMAIL_MAILBOX AND status IN {PENDING_VALIDATION, ACTIVE, SUSPENDED})"
        default: 0
      - name: bandwidth_used_mb
        type: number
        source: computed
        description: "SUM(UsageRecord.amount_mb) over records whose recorded_at falls in the subscription's OPEN BillingPeriod; reset to 0 when that period is closed"
        default: 0
      - name: auto_renew
        type: boolean
        source: input
        description: Informational flag; the plan is billed once at creation in this system
        default: true

  - name: AddOn
    parent: null
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: FK -> HostingSubscription.id; the subscription the add-on is billed against
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; the domain the certificate protects or the mailbox lives on
      - name: add_on_type
        type: enum
        source: input
        description: Add-on kind; drives the conditional creation/cascade behavior
        constraints: "SSL_CERT | EMAIL_MAILBOX"
      - name: status
        type: enum
        source: computed
        description: See state_machines AddOn
        default: PENDING_VALIDATION
        constraints: "PENDING_VALIDATION | ACTIVE | SUSPENDED | EXPIRED | REVOKED | CANCELLED"
      - name: validation_token
        type: string
        source: system
        description: Server-minted DNS-01 challenge token; non-null only when add_on_type == SSL_CERT
        default: null
      - name: mailbox_address
        type: string
        source: input
        description: Local part of the mailbox address; required when add_on_type == EMAIL_MAILBOX, must be null otherwise; unique per (domain_id, mailbox_address) among AddOns with status != CANCELLED
        default: null
      - name: storage_mb_quota
        type: integer
        source: input
        description: Mailbox storage reservation in MB; required when add_on_type == EMAIL_MAILBOX, forced to 0 for SSL_CERT
        default: 0
      - name: term_days
        type: integer
        source: input
        description: Validity length in days
        constraints: "1..730"
      - name: starts_at
        type: datetime
        source: input
        description: Start of the validity interval; defaults to the logical clock at creation
      - name: ends_at
        type: datetime
        source: computed
        description: "starts_at + term_days days"
      - name: unit_price_cents
        type: integer
        source: computed
        description: "SSL_CERT: 0 if plan.included_ssl else SSL_PRICE_CENTS. EMAIL_MAILBOX: MAILBOX_PRICE_CENTS_PER_GB * ceil(storage_mb_quota / 1024)"

  - name: TransferRequest
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the account gaining (IN) or losing (OUT) the domain
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; required for direction OUT (the domain being transferred away); for direction IN it is null until the registry approves, then set to the newly created Domain
        default: null
      - name: direction
        type: enum
        source: input
        description: Transfer direction
        constraints: "IN | OUT"
      - name: domain_name
        type: string
        source: input
        description: Second-level label of the domain being transferred
      - name: tld
        type: enum
        source: input
        description: TLD of the domain being transferred
        constraints: "com | net | io | xyz"
      - name: epp_auth_code
        type: string
        source: input
        description: EPP authorization code supplied by the requester; for OUT it must equal Domain.epp_auth_code
      - name: status
        type: enum
        source: computed
        description: See state_machines TransferRequest
        default: INITIATED
        constraints: "INITIATED | PENDING_ACK | REJECTED | COMPLETED | FAILED"
      - name: attempt_count
        type: integer
        source: computed
        description: Number of submissions made; starts at 0, incremented on each retry
        default: 0
      - name: rejection_reason
        type: string
        source: computed
        description: Reason text supplied by the registry on a REJECTED outcome
        default: null

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> Account.id; the billed account
      - name: billing_period_id
        type: string
        source: input
        description: FK -> BillingPeriod.id; set only on the bandwidth-overage invoice raised at period close; null otherwise
        default: null
      - name: status
        type: enum
        source: computed
        description: See state_machines Invoice
        default: ISSUED
        constraints: "ISSUED | PAID | PARTIALLY_REFUNDED | REFUNDED"
      - name: applied_promo_code
        type: string
        source: computed
        description: PromoCode.code applied via POST /invoices/{id}/apply-promo; null when none; a second apply-promo replaces the previous code
        default: null
      - name: subtotal_cents
        type: integer
        source: computed
        description: "SUM(InvoiceLineItem.line_subtotal_cents) over all line items of this invoice"
      - name: discount_cents
        type: integer
        source: computed
        description: "SUM(InvoiceLineItem.line_discount_cents); see calculations.invoice_promo_and_service_fee"
        default: 0
      - name: service_fee_cents
        type: integer
        source: computed
        description: "Tiered processing fee keyed on (subtotal_cents - discount_cents); see calculations.invoice_promo_and_service_fee"
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "SUM(InvoiceLineItem.line_tax_cents) — per-line rounding, then sum; see calculations.invoice_total"
      - name: total_cents
        type: integer
        source: computed
        description: "subtotal_cents - discount_cents + service_fee_cents + tax_cents"
      - name: amount_paid_cents
        type: integer
        source: computed
        description: Cash + credit actually applied at POST /invoices/{id}/pay
        default: 0
      - name: amount_refunded_cents
        type: integer
        source: computed
        description: Cumulative refunded amount
        default: 0

  - name: InvoiceLineItem
    parent: Invoice
    common_fields: false
    fields:
      - name: invoice_id
        type: string
        source: system
        description: FK -> Invoice.id; the invoice this line belongs to
      - name: item_type
        type: enum
        source: system
        description: What is being billed; also the key PromoCode.applies_to_item_types matches against
        constraints: "DOMAIN_REGISTRATION | DOMAIN_RENEWAL | REDEMPTION_FEE | PRIVACY_FEE | HOSTING_PLAN | SSL_CERT | EMAIL_MAILBOX | BANDWIDTH_OVERAGE"
      - name: reference_id
        type: string
        source: system
        description: "Polymorphic id of the billed subject (Domain.id, HostingSubscription.id, AddOn.id or BillingPeriod.id) resolved by item_type; NOT a declared foreign key"
      - name: description
        type: string
        source: system
        description: Human-readable line description
      - name: quantity
        type: integer
        source: system
        description: Number of units (years for domain lines, 1 otherwise)
      - name: unit_price_cents
        type: integer
        source: system
        description: Price of one unit in cents
      - name: line_subtotal_cents
        type: integer
        source: computed
        description: "quantity * unit_price_cents (exact integer, no rounding)"
      - name: line_discount_cents
        type: integer
        source: computed
        description: "Promo discount allocated to this line; see calculations.invoice_promo_and_service_fee"
        default: 0
      - name: line_tax_cents
        type: integer
        source: computed
        description: "round_half_up((line_subtotal_cents - line_discount_cents) * TAX_RATE) — rounded PER LINE before summing"
      - name: line_total_cents
        type: integer
        source: computed
        description: "line_subtotal_cents - line_discount_cents + line_tax_cents"

  - name: LedgerEntry
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: system
        description: FK -> Account.id; the account whose money moved
      - name: entry_type
        type: enum
        source: system
        description: Kind of money movement
        constraints: "PAYMENT | REFUND | CREDIT_GRANT | CREDIT_APPLIED"
      - name: amount_cents
        type: integer
        source: system
        description: "Signed: PAYMENT > 0 (cash in), REFUND < 0 (cash out), CREDIT_GRANT > 0, CREDIT_APPLIED < 0"
      - name: reference_type
        type: enum
        source: system
        description: Polymorphic reference discriminator
        constraints: "INVOICE | ADJUSTMENT"
      - name: reference_id
        type: string
        source: system
        description: "Polymorphic id: Invoice.id when reference_type == INVOICE, null when ADJUSTMENT; NOT a declared foreign key"
        default: null
      - name: reason
        type: string
        source: input
        description: Free-text reason supplied on credits and refunds
        default: null
      - name: balance_after_cents
        type: integer
        source: computed
        description: Account.credit_balance_cents immediately after this entry was written

  - name: BillingPeriod
    parent: HostingSubscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: FK -> HostingSubscription.id; the metered subscription
      - name: period_start
        type: datetime
        source: input
        description: Inclusive start of the half-open metering interval
      - name: period_end
        type: datetime
        source: input
        description: Exclusive end of the half-open metering interval
      - name: status
        type: enum
        source: computed
        description: OPEN until closed by POST /billing-periods/{id}/close
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: provisional_overage_cents
        type: integer
        source: computed
        description: "PROVISIONAL variant of calculations.hosting_bandwidth_overage; refreshed on every usage record ingest"
        default: 0
      - name: final_overage_cents
        type: integer
        source: computed
        description: "FINAL variant of calculations.hosting_bandwidth_overage; computed once at close; null while OPEN"
        default: null

  - name: UsageRecord
    parent: HostingSubscription
    common_fields: false
    fields:
      - name: subscription_id
        type: string
        source: system
        description: FK -> HostingSubscription.id; the metered subscription
      - name: metric
        type: enum
        source: input
        description: Metered metric
        constraints: "BANDWIDTH_MB"
      - name: amount_mb
        type: number
        source: input
        description: Megabytes consumed by this record
        constraints: ">= 0"
      - name: recorded_at
        type: datetime
        source: input
        description: Logical timestamp the usage is attributed to; may be back-dated (late-arriving usage) but must fall inside an OPEN BillingPeriod of the subscription

  - name: AbuseReport
    parent: null
    common_fields: true
    fields:
      - name: domain_id
        type: string
        source: input
        description: FK -> Domain.id; the reported domain
      - name: category
        type: enum
        source: input
        description: Abuse category
        constraints: "PHISHING | MALWARE | SPAM | COPYRIGHT"
      - name: severity
        type: enum
        source: input
        description: Severity; drives the risk weight in calculations.account_risk_score
        constraints: "LOW | HIGH | CRITICAL"
      - name: status
        type: enum
        source: computed
        description: See state_machines AbuseReport
        default: OPEN
        constraints: "OPEN | UNDER_REVIEW | UPHELD | DISMISSED"
      - name: reporter_email
        type: string
        source: input
        description: Reporter contact
      - name: evidence_url
        type: string
        source: input
        description: Optional evidence link
        default: null
      - name: reviewer_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the AbuseAnalyst who moved the report to UNDER_REVIEW
        default: null
      - name: decider_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the AbuseAnalyst who upheld or dismissed the report; MUST differ from reviewer_user_id (segregation of duties)
        default: null
      - name: decision_note
        type: string
        source: input
        description: Note recorded with the uphold/dismiss decision
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: Logical clock at uphold/dismiss; the decay baseline in calculations.account_risk_score
        default: null

  - name: PromoCode
    parent: null
    common_fields: false
    fields:
      - name: code
        type: string
        source: input
        description: Case-sensitive promo code
        constraints: "unique"
      - name: discount_type
        type: enum
        source: input
        description: Discount shape
        constraints: "PERCENT | FLAT"
      - name: discount_value
        type: number
        source: input
        description: "PERCENT: fraction in (0,1]. FLAT: whole cents."
      - name: applies_to_item_types
        type: array
        source: input
        description: InvoiceLineItem.item_type values this code discounts; a line whose item_type is absent gets zero discount
        constraints: "non-empty array of item_type enum values"
      - name: min_subtotal_cents
        type: integer
        source: input
        description: Minimum Invoice.subtotal_cents (pre-discount, whole invoice) required for the code to apply
        default: 0
      - name: max_discount_cents
        type: integer
        source: input
        description: Hard cap on Invoice.discount_cents

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Domain: dimension 1 of 2 (parallel state dimensions on the same row) ---
  - entity: Domain
    state_field: lifecycle_status
    initial_state: PENDING_PAYMENT
    terminal_states: [DELETED, TRANSFERRED_OUT]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /registrar/invoices/{id}/pay — the invoice carries a DOMAIN_REGISTRATION line whose reference_id is this Domain"
        actor: Registrant
        preconditions:
          - "Invoice.status == ISSUED"
          - "Account.status == ACTIVE"
        side_effects:
          - "Domain.registered_at = logical clock now"
          - "Domain.expires_at = now + term_years * 365 days"
          - "Domain.epp_auth_code = server-minted 16-char code"
          - "Domain.lock_status stays LOCKED (initial value of dimension 2)"
          - "increments Domain.version by 1"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /registrar/domains/{id}/renew"
        actor: Registrant
        preconditions:
          - "Domain.lifecycle_status == ACTIVE"
          - "expected_domain_version == Domain.version"
          - "(expires_at + term_years*365 days) - now <= MAX_TERM_YEARS * 365 days"
        side_effects:
          - "Domain.expires_at = expires_at + term_years * 365 days (ACTIVE branch: extends the existing term)"
          - "creates Invoice (ISSUED) with a DOMAIN_RENEWAL line per calculations.domain_renewal_charge (CHARGED variant)"
          - "increments Domain.version by 1"

      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /registrar/domains/{id}/renew (grace renewal)"
        actor: Registrant
        preconditions:
          - "Domain.lifecycle_status == EXPIRED"
          - "expected_domain_version == Domain.version"
        side_effects:
          - "Domain.expires_at = now + term_years * 365 days (RESET branch: baseline moves to the renewal instant, it does NOT extend the lapsed term)"
          - "creates Invoice (ISSUED) with a DOMAIN_RENEWAL line, no REDEMPTION_FEE line"
          - "DnsRecord.serving_enabled = true for every record of this domain"
          - "increments Domain.version by 1"
        note: "Revival cycle ACTIVE -> EXPIRED -> ACTIVE"

      - from: REDEMPTION
        to: ACTIVE
        trigger: "POST /registrar/domains/{id}/renew (redemption restore)"
        actor: Registrant
        preconditions:
          - "Domain.lifecycle_status == REDEMPTION"
          - "expected_domain_version == Domain.version"
        side_effects:
          - "Domain.expires_at = now + term_years * 365 days (RESET branch)"
          - "creates Invoice (ISSUED) with a DOMAIN_RENEWAL line AND a REDEMPTION_FEE line of REDEMPTION_FEE_CENTS"
          - "DnsRecord.serving_enabled = true for every record of this domain"
          - "increments Domain.version by 1"
        note: "Revival cycle ACTIVE -> EXPIRED -> REDEMPTION -> ACTIVE"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /registrar/_ops/run-expiry-sweep (system)"
        actor: system
        preconditions:
          - "expires_at <= clock now"
          - "NOT (auto_renew_enabled AND Account.status == ACTIVE AND Account.payment_method_on_file)"
        side_effects:
          - "L2 of cascade B: DnsRecord.serving_enabled = false for every record of this domain"
          - "L2 of cascade B: every HostingSubscription whose primary_domain_id == this Domain and whose status IN {ACTIVE, OVER_QUOTA} transitions to SUSPENDED"
          - "L3 of cascade B (caused by the subscription suspension above): every AddOn of that subscription with status == ACTIVE transitions to SUSPENDED"

      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /registrar/_ops/run-expiry-sweep — auto-renew branch (system)"
        actor: system
        preconditions:
          - "expires_at <= clock now"
          - "auto_renew_enabled == true"
          - "Account.status == ACTIVE"
          - "Account.payment_method_on_file == true"
        side_effects:
          - "Domain.expires_at = expires_at + 365 days (1-year auto renewal, ACTIVE extend branch)"
          - "creates Invoice (ISSUED) with a DOMAIN_RENEWAL line for 1 year and immediately settles it as if POST /invoices/{id}/pay had been called (credit-first waterfall, then card)"
          - "increments Domain.version by 1"

      - from: EXPIRED
        to: REDEMPTION
        trigger: "POST /registrar/_ops/run-expiry-sweep (system)"
        actor: system
        preconditions:
          - "expires_at + EXPIRY_GRACE_DAYS days <= clock now"
        side_effects:
          - "no additional cascade beyond the one already fired on ACTIVE -> EXPIRED"

      - from: REDEMPTION
        to: PENDING_DELETE
        trigger: "POST /registrar/_ops/run-expiry-sweep (system)"
        actor: system
        preconditions:
          - "expires_at + (EXPIRY_GRACE_DAYS + REDEMPTION_DAYS) days <= clock now"
        side_effects:
          - "Domain.auto_renew_enabled = false"

      - from: PENDING_DELETE
        to: DELETED
        trigger: "POST /registrar/_ops/run-expiry-sweep (system)"
        actor: system
        preconditions:
          - "expires_at + (EXPIRY_GRACE_DAYS + REDEMPTION_DAYS + PENDING_DELETE_DAYS) days <= clock now"
        side_effects:
          - "every AddOn whose domain_id == this Domain and whose status IN {PENDING_VALIDATION, ACTIVE, SUSPENDED} transitions to CANCELLED"
          - "because those mailbox AddOns left the committed set, every affected HostingSubscription.storage_committed_mb is recomputed per calculations.storage_commitment"
          - "every HostingSubscription whose primary_domain_id == this Domain transitions to CANCELLED"
          - "Domain.fqdn is released and becomes available again for registration"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /registrar/abuse-reports/{id}/uphold (cascade L2)"
        actor: system
        preconditions:
          - "AbuseReport.status transitioned UNDER_REVIEW -> UPHELD in this request"
          - "Domain.lifecycle_status == ACTIVE (conditional cascade: a domain not in ACTIVE is left untouched)"
        side_effects:
          - "Domain.suspension_reason = ABUSE"
          - "L3: DnsRecord.serving_enabled = false for every record of this domain"
          - "L3: every AddOn of this domain with add_on_type == SSL_CERT and status IN {PENDING_VALIDATION, ACTIVE} transitions to REVOKED"
          - "L3: every AddOn of this domain with add_on_type == EMAIL_MAILBOX and status == ACTIVE transitions to SUSPENDED"
          - "L4 (caused by this domain suspension): Account.risk_score is recomputed per calculations.account_risk_score"
          - "L5 (caused by the recomputed score): if Account.risk_score >= AUTO_SUSPEND_THRESHOLD the Account transitions ACTIVE -> SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /registrar/domains/{id}/reinstate"
        actor: SupportAgent
        preconditions:
          - "Domain.lifecycle_status == SUSPENDED"
          - "Account.status == ACTIVE (a domain of a suspended account cannot be reinstated first)"
        side_effects:
          - "Domain.suspension_reason = null"
          - "DnsRecord.serving_enabled = true for every record of this domain"
          - "every AddOn of this domain with status == SUSPENDED transitions to ACTIVE (REVOKED SSL certificates are NOT revived — the compensation is deliberately asymmetric)"

      - from: ACTIVE
        to: TRANSFERRED_OUT
        trigger: "POST /registrar/transfer-requests/{id}/registry-response with outcome == APPROVED on a direction == OUT request"
        actor: PlatformAdmin
        preconditions:
          - "TransferRequest.status == PENDING_ACK"
          - "TransferRequest.direction == OUT"
          - "Domain.lifecycle_status == ACTIVE"
        side_effects:
          - "Domain.auto_renew_enabled = false"
          - "DnsRecord.serving_enabled = false for every record of this domain"
          - "every AddOn of this domain with status IN {PENDING_VALIDATION, ACTIVE, SUSPENDED} transitions to CANCELLED"
          - "every HostingSubscription whose primary_domain_id == this Domain transitions to CANCELLED"

  # --- Domain: dimension 2 of 2 (independent of lifecycle_status) ---
  - entity: Domain
    state_field: lock_status
    initial_state: LOCKED
    terminal_states: []
    transitions:
      - from: LOCKED
        to: UNLOCKED
        trigger: "PATCH /registrar/domains/{id}/settings with locked=false"
        actor: Registrant
        preconditions:
          - "Domain.lifecycle_status == ACTIVE"
          - "clock now >= Domain.registered_at + TRANSFER_LOCK_DAYS days (ICANN 60-day post-registration lock)"
        side_effects:
          - "Domain.lock_status = UNLOCKED; lifecycle_status is unaffected"
      - from: UNLOCKED
        to: LOCKED
        trigger: "PATCH /registrar/domains/{id}/settings with locked=true"
        actor: Registrant
        preconditions:
          - "Domain.lifecycle_status == ACTIVE"
        side_effects:
          - "Domain.lock_status = LOCKED; lifecycle_status is unaffected"
        note: "LOCKED <-> UNLOCKED cycles freely and evolves independently of lifecycle_status; the two dimensions gate different operations."

  - entity: TransferRequest
    state_field: status
    initial_state: INITIATED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: INITIATED
        to: PENDING_ACK
        trigger: "POST /registrar/transfer-requests/{id}/submit"
        actor: Registrant
        preconditions:
          - "TransferRequest.status == INITIATED"
          - "Account.status == ACTIVE"
          - "direction == OUT: the referenced Domain.lifecycle_status == ACTIVE and Domain.suspension_reason is null"
          - "direction == OUT: no AbuseReport on that Domain has status IN {UNDER_REVIEW, UPHELD} (business_safety, checked BEFORE the lock check)"
          - "direction == OUT: Domain.lock_status == UNLOCKED"
          - "direction == OUT: epp_auth_code == Domain.epp_auth_code"
          - "direction == IN: no Domain with the same fqdn and lifecycle_status NOT IN {DELETED, TRANSFERRED_OUT} exists"
        side_effects:
          - "TransferRequest.attempt_count += 1"

      - from: PENDING_ACK
        to: COMPLETED
        trigger: "POST /registrar/transfer-requests/{id}/registry-response with outcome == APPROVED"
        actor: PlatformAdmin
        preconditions:
          - "TransferRequest.status == PENDING_ACK"
        side_effects:
          - "direction == IN: creates a Domain owned by TransferRequest.account_id with lifecycle_status = ACTIVE, lock_status = LOCKED, registered_at = now, expires_at = now + 365 days, a freshly minted epp_auth_code, and sets TransferRequest.domain_id to that Domain"
          - "direction == OUT: the referenced Domain transitions ACTIVE -> TRANSFERRED_OUT with its own cascade"

      - from: PENDING_ACK
        to: REJECTED
        trigger: "POST /registrar/transfer-requests/{id}/registry-response with outcome == REJECTED"
        actor: PlatformAdmin
        preconditions:
          - "TransferRequest.status == PENDING_ACK"
          - "TransferRequest.attempt_count < MAX_TRANSFER_ATTEMPTS"
        side_effects:
          - "TransferRequest.rejection_reason = reason"

      - from: PENDING_ACK
        to: FAILED
        trigger: "POST /registrar/transfer-requests/{id}/registry-response with outcome == REJECTED on the final permitted attempt"
        actor: PlatformAdmin
        preconditions:
          - "TransferRequest.status == PENDING_ACK"
          - "TransferRequest.attempt_count >= MAX_TRANSFER_ATTEMPTS"
        side_effects:
          - "TransferRequest.rejection_reason = reason; the request is terminal and cannot be retried"

      - from: REJECTED
        to: INITIATED
        trigger: "POST /registrar/transfer-requests/{id}/retry"
        actor: Registrant
        preconditions:
          - "TransferRequest.status == REJECTED"
          - "TransferRequest.attempt_count < MAX_TRANSFER_ATTEMPTS"
        side_effects:
          - "TransferRequest.epp_auth_code = the code supplied on retry"
          - "TransferRequest.rejection_reason = null"
        note: "Negotiation cycle INITIATED -> PENDING_ACK -> REJECTED -> INITIATED, bounded by MAX_TRANSFER_ATTEMPTS."

  - entity: HostingSubscription
    state_field: status
    initial_state: PROVISIONING
    terminal_states: [CANCELLED]
    transitions:
      - from: PROVISIONING
        to: ACTIVE
        trigger: "POST /registrar/invoices/{id}/pay — the invoice carries a HOSTING_PLAN line whose reference_id is this subscription"
        actor: Registrant
        preconditions:
          - "Invoice.status == ISSUED"
          - "Account.status == ACTIVE"
        side_effects:
          - "creates the subscription's first BillingPeriod with period_start = now and period_end = now + BILLING_PERIOD_DAYS days, status OPEN"
          - "increments HostingSubscription.version by 1"

      - from: ACTIVE
        to: OVER_QUOTA
        trigger: "POST /registrar/hosting-subscriptions/{id}/usage-records (system, threshold crossing)"
        actor: system
        preconditions:
          - "after ingesting the record, bandwidth_used_mb > HostingPlan.bandwidth_quota_mb (strictly greater; usage exactly equal to the quota keeps the subscription ACTIVE)"
        side_effects:
          - "BillingPeriod.provisional_overage_cents recomputed per calculations.hosting_bandwidth_overage (PROVISIONAL variant)"

      - from: OVER_QUOTA
        to: ACTIVE
        trigger: "POST /registrar/billing-periods/{id}/close"
        actor: BillingAdmin
        preconditions:
          - "BillingPeriod.status == OPEN"
        side_effects:
          - "HostingSubscription.bandwidth_used_mb = 0 (counter reset restarts the quota baseline)"
        note: "Cycle ACTIVE -> OVER_QUOTA -> ACTIVE across billing periods."

      - from: ACTIVE
        to: SUSPENDED
        trigger: "Cascade from Account ACTIVE -> SUSPENDED, or from the primary Domain entering EXPIRED / SUSPENDED"
        actor: system
        preconditions:
          - "the causing entity transitioned in this request"
        side_effects:
          - "every AddOn of this subscription with status == ACTIVE transitions to SUSPENDED"

      - from: OVER_QUOTA
        to: SUSPENDED
        trigger: "Cascade from Account ACTIVE -> SUSPENDED, or from the primary Domain entering EXPIRED / SUSPENDED"
        actor: system
        preconditions:
          - "the causing entity transitioned in this request"
        side_effects:
          - "every AddOn of this subscription with status == ACTIVE transitions to SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /registrar/accounts/{id}/reinstate (cascade)"
        actor: system
        preconditions:
          - "Account.status transitioned SUSPENDED -> ACTIVE in this request"
        side_effects:
          - "every AddOn of this subscription with status == SUSPENDED transitions to ACTIVE"

      - from: ACTIVE
        to: CANCELLED
        trigger: "Cascade from the primary Domain reaching DELETED or TRANSFERRED_OUT"
        actor: system
        preconditions:
          - "Domain.id == HostingSubscription.primary_domain_id and the domain reached DELETED or TRANSFERRED_OUT in this request"
        side_effects:
          - "every AddOn of this subscription with status IN {PENDING_VALIDATION, ACTIVE, SUSPENDED} transitions to CANCELLED"
          - "HostingSubscription.storage_committed_mb recomputed to 0"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "Cascade from the primary Domain reaching DELETED or TRANSFERRED_OUT"
        actor: system
        preconditions:
          - "Domain.id == HostingSubscription.primary_domain_id and the domain reached DELETED or TRANSFERRED_OUT in this request"
        side_effects:
          - "every AddOn of this subscription with status IN {PENDING_VALIDATION, ACTIVE, SUSPENDED} transitions to CANCELLED"

  - entity: AddOn
    state_field: status
    initial_state: PENDING_VALIDATION
    terminal_states: [EXPIRED, REVOKED, CANCELLED]
    transitions:
      - from: PENDING_VALIDATION
        to: ACTIVE
        trigger: "POST /registrar/add-ons (system, immediately at creation) when add_on_type == EMAIL_MAILBOX"
        actor: system
        preconditions:
          - "add_on_type == EMAIL_MAILBOX"
          - "HostingSubscription.storage_committed_mb + storage_mb_quota <= HostingPlan.storage_quota_mb"
        side_effects:
          - "HostingSubscription.storage_committed_mb += storage_mb_quota (conserved capacity)"
        note: "Conditional initial state: SSL_CERT add-ons stay in PENDING_VALIDATION until DNS-01 validation succeeds."

      - from: PENDING_VALIDATION
        to: ACTIVE
        trigger: "POST /registrar/add-ons/{id}/validate"
        actor: Registrant
        preconditions:
          - "add_on_type == SSL_CERT"
          - "AddOn.status == PENDING_VALIDATION"
          - "Domain.lifecycle_status == ACTIVE"
          - "a DnsRecord exists on AddOn.domain_id with record_type == TXT, name == '_acme-challenge' and value == AddOn.validation_token"
        side_effects:
          - "AddOn.status = ACTIVE"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "Cascade from Domain (EXPIRED) or from HostingSubscription (SUSPENDED), or from Domain SUSPENDED when add_on_type == EMAIL_MAILBOX"
        actor: system
        preconditions:
          - "the causing entity transitioned in this request"
        side_effects:
          - "the AddOn remains inside the storage_committed_mb set (a suspended mailbox still reserves its quota)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "Cascade from POST /registrar/domains/{id}/reinstate or POST /registrar/accounts/{id}/reinstate"
        actor: system
        preconditions:
          - "AddOn.status == SUSPENDED"
        side_effects:
          - "no change to storage_committed_mb"

      - from: PENDING_VALIDATION
        to: REVOKED
        trigger: "Cascade from Domain ACTIVE -> SUSPENDED when add_on_type == SSL_CERT"
        actor: system
        preconditions:
          - "add_on_type == SSL_CERT"
        side_effects:
          - "AddOn.validation_token is retained for audit; the certificate can never be revived"

      - from: ACTIVE
        to: REVOKED
        trigger: "Cascade from Domain ACTIVE -> SUSPENDED when add_on_type == SSL_CERT"
        actor: system
        preconditions:
          - "add_on_type == SSL_CERT"
        side_effects:
          - "a reinstated domain does NOT revive a REVOKED certificate (asymmetric compensation)"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /registrar/_ops/run-expiry-sweep (system)"
        actor: system
        preconditions:
          - "AddOn.ends_at <= clock now"
        side_effects:
          - "if add_on_type == EMAIL_MAILBOX: HostingSubscription.storage_committed_mb -= storage_mb_quota (EXPIRED leaves the committed set)"

      - from: PENDING_VALIDATION
        to: CANCELLED
        trigger: "DELETE /registrar/add-ons/{id}"
        actor: Registrant
        preconditions:
          - "AddOn.status IN {PENDING_VALIDATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "if add_on_type == EMAIL_MAILBOX: HostingSubscription.storage_committed_mb -= storage_mb_quota"

      - from: ACTIVE
        to: CANCELLED
        trigger: "DELETE /registrar/add-ons/{id}"
        actor: Registrant
        preconditions:
          - "AddOn.status IN {PENDING_VALIDATION, ACTIVE, SUSPENDED}"
        side_effects:
          - "if add_on_type == EMAIL_MAILBOX: HostingSubscription.storage_committed_mb -= storage_mb_quota (exact compensation of the create-time increment)"

      - from: SUSPENDED
        to: CANCELLED
        trigger: "DELETE /registrar/add-ons/{id}, or cascade from Domain DELETED / TRANSFERRED_OUT, or cascade from HostingSubscription CANCELLED"
        actor: Registrant
        preconditions:
          - "AddOn.status == SUSPENDED"
        side_effects:
          - "if add_on_type == EMAIL_MAILBOX: HostingSubscription.storage_committed_mb -= storage_mb_quota"

  - entity: Invoice
    state_field: status
    initial_state: ISSUED
    terminal_states: [REFUNDED]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /registrar/invoices/{id}/pay"
        actor: Registrant
        preconditions:
          - "Invoice.status == ISSUED"
          - "Account.status == ACTIVE"
          - "if the cash remainder after the credit waterfall is > 0 then Account.payment_method_on_file == true"
        side_effects:
          - "writes a LedgerEntry(CREDIT_APPLIED, -applied_credit_cents) when applied_credit_cents > 0"
          - "writes a LedgerEntry(PAYMENT, +cash_remainder_cents) when cash_remainder_cents > 0"
          - "Invoice.amount_paid_cents = Invoice.total_cents"
          - "activates the billed subject: Domain PENDING_PAYMENT -> ACTIVE, HostingSubscription PROVISIONING -> ACTIVE"

      - from: PAID
        to: PARTIALLY_REFUNDED
        trigger: "POST /registrar/invoices/{id}/refund with amount_cents < amount_paid_cents"
        actor: BillingAdmin
        preconditions:
          - "Invoice.status IN {PAID, PARTIALLY_REFUNDED}"
          - "amount_cents <= amount_paid_cents - amount_refunded_cents"
        side_effects:
          - "destination == CARD: writes LedgerEntry(REFUND, -amount_cents)"
          - "destination == CREDIT: writes LedgerEntry(CREDIT_GRANT, +amount_cents)"
          - "Invoice.amount_refunded_cents += amount_cents"

      - from: PARTIALLY_REFUNDED
        to: PARTIALLY_REFUNDED
        trigger: "POST /registrar/invoices/{id}/refund with a further partial amount"
        actor: BillingAdmin
        preconditions:
          - "amount_cents < amount_paid_cents - amount_refunded_cents"
        side_effects:
          - "Invoice.amount_refunded_cents += amount_cents"

      - from: PAID
        to: REFUNDED
        trigger: "POST /registrar/invoices/{id}/refund with amount_cents == amount_paid_cents"
        actor: BillingAdmin
        preconditions:
          - "Invoice.status == PAID"
        side_effects:
          - "destination == CARD: writes LedgerEntry(REFUND, -amount_cents), restoring Account.net_cash_cents to its pre-payment value"
          - "Invoice.amount_refunded_cents = Invoice.amount_paid_cents"
        note: "Refunds move money only; they never revert the activation side effects of the payment."

      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /registrar/invoices/{id}/refund for the remaining balance"
        actor: BillingAdmin
        preconditions:
          - "amount_cents == amount_paid_cents - amount_refunded_cents"
        side_effects:
          - "Invoice.amount_refunded_cents = Invoice.amount_paid_cents"

  - entity: AbuseReport
    state_field: status
    initial_state: OPEN
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /registrar/abuse-reports/{id}/review"
        actor: AbuseAnalyst
        preconditions:
          - "AbuseReport.status == OPEN"
        side_effects:
          - "AbuseReport.reviewer_user_id = X-User-ID of the caller"

      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /registrar/abuse-reports/{id}/uphold"
        actor: AbuseAnalyst
        preconditions:
          - "AbuseReport.status == UNDER_REVIEW"
          - "X-User-ID != AbuseReport.reviewer_user_id (segregation of duties)"
        side_effects:
          - "AbuseReport.decider_user_id = X-User-ID; AbuseReport.decided_at = clock now"
          - "L2 of cascade A: the reported Domain transitions ACTIVE -> SUSPENDED (suspension_reason = ABUSE)"
          - "L3 (caused by the domain suspension): the domain's DnsRecords stop serving; its SSL_CERT AddOns become REVOKED; its EMAIL_MAILBOX AddOns become SUSPENDED"
          - "L4 (caused by the domain suspension): Account.risk_score recomputed per calculations.account_risk_score"
          - "L5 (caused by the new score): Account transitions ACTIVE -> SUSPENDED when risk_score >= AUTO_SUSPEND_THRESHOLD, which in turn suspends every HostingSubscription of that account"

      - from: UNDER_REVIEW
        to: DISMISSED
        trigger: "POST /registrar/abuse-reports/{id}/dismiss"
        actor: AbuseAnalyst
        preconditions:
          - "AbuseReport.status == UNDER_REVIEW"
          - "X-User-ID != AbuseReport.reviewer_user_id (segregation of duties)"
        side_effects:
          - "AbuseReport.decider_user_id = X-User-ID; AbuseReport.decided_at = clock now"
          - "no domain, account or risk_score change (the branch's side-effect set is deliberately empty)"
        note: "Fork/branch: UNDER_REVIEW -> {UPHELD, DISMISSED} with divergent side-effect sets."

  - entity: Account
    state_field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "Cascade L5 from a domain suspension that pushes risk_score to AUTO_SUSPEND_THRESHOLD or above"
        actor: system
        preconditions:
          - "Account.risk_score >= AUTO_SUSPEND_THRESHOLD (>= 70, not > 70)"
        side_effects:
          - "every HostingSubscription of this account with status IN {ACTIVE, OVER_QUOTA} transitions to SUSPENDED"
          - "every Domain of this account has auto_renew_enabled set to false"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /registrar/accounts/{id}/reinstate"
        actor: SupportAgent
        preconditions:
          - "Account.status == SUSPENDED"
        side_effects:
          - "every HostingSubscription of this account with status == SUSPENDED transitions to ACTIVE"
          - "every AddOn of those subscriptions with status == SUSPENDED transitions to ACTIVE"
          - "Domain suspensions are NOT lifted; each suspended Domain must be reinstated individually"

  - entity: BillingPeriod
    state_field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /registrar/billing-periods/{id}/close"
        actor: BillingAdmin
        preconditions:
          - "BillingPeriod.status == OPEN"
        side_effects:
          - "BillingPeriod.final_overage_cents = calculations.hosting_bandwidth_overage (FINAL variant)"
          - "if final_overage_cents > 0: creates an Invoice (ISSUED) with billing_period_id set and a single BANDWIDTH_OVERAGE line"
          - "HostingSubscription.bandwidth_used_mb = 0"
          - "if HostingSubscription.status == OVER_QUOTA it transitions back to ACTIVE"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version`)
# =============================================================================
concurrency_rules:
  - rule_id: renew-domain-stale-version
    parent_entity: Domain
    write_endpoint: "POST /registrar/domains/{id}/renew"
    occ_field: "expected_domain_version"
    description: |
      Renewing a Domain whose version has advanced since the client last read it
      is rejected with a stale-version error. Renewal is legitimately repeatable
      (a domain may be renewed twice, each time extending the term), so a second
      renew carrying the version observed before the first renew is not caught by
      any state precondition — only the OCC check on Domain.version rejects it.
    error_id: ERR_STALE_DOMAIN_VERSION
    http_status: 412

  - rule_id: apply-promo-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /registrar/invoices/{id}/apply-promo"
    occ_field: "expected_invoice_version"
    description: |
      Applying a promo code to an Invoice whose version has advanced since the
      client last read it is rejected with a stale-version error. Applying a promo
      legitimately supersedes any previously applied code, so a second apply-promo
      would otherwise succeed on its own merits; the OCC check on Invoice.version
      is what rejects a client working from a pre-discount view of the invoice.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: domain_base_price
    trigger: "GET /registrar/domain-search, POST /registrar/domains, GET /registrar/domains/{id}/renewal-quote, POST /registrar/domains/{id}/renew"
    algorithm: threshold
    formula: |
      is_premium      = (len(domain_name) <= 3)
      base_year_price = TLD_BASE_PRICE_CENTS[tld] * (PREMIUM_MULTIPLIER if is_premium else 1)
    input_set: "The requested domain_name/tld pair; no entity state is consulted."
    constants:
      TLD_BASE_PRICE_CENTS: { com: 1199, net: 1499, io: 3999, xyz: 199 }
      PREMIUM_MULTIPLIER: 5
    precision: "integer cents; no rounding required (all inputs are integers)"

  - name: domain_renewal_charge
    trigger: "GET /registrar/domains/{id}/renewal-quote (QUOTED variant) and POST /registrar/domains/{id}/renew (CHARGED variant)"
    algorithm: forward_looking
    formula: |
      # Evaluated against Domain.lifecycle_status AS OBSERVED AT THE INSTANT THIS
      # CALCULATION RUNS. The quote endpoint reads it at quote time; the renew
      # endpoint reads it again at renew time. If the expiry sweep has advanced the
      # domain between the two calls, the two runs return different numbers.
      base_year_price      = calculations.domain_base_price(domain.domain_name, domain.tld)
      renewal_subtotal     = base_year_price * term_years
      redemption_fee_cents = REDEMPTION_FEE_CENTS if domain.lifecycle_status == 'REDEMPTION' else 0
      privacy_fee_cents    = PRIVACY_FEE_CENTS_PER_YEAR * term_years if domain.whois_privacy_enabled else 0
      charge_subtotal      = renewal_subtotal + redemption_fee_cents + privacy_fee_cents

      # New term end (pinned, no leap-day adjustment; a "year" is exactly 365 days):
      if domain.lifecycle_status == 'ACTIVE':
          new_expires_at = domain.expires_at + term_years * 365 days      # EXTEND branch
      elif domain.lifecycle_status in ('EXPIRED', 'REDEMPTION'):
          new_expires_at = clock_now      + term_years * 365 days         # RESET branch
      else:
          reject ERR_DOMAIN_NOT_RENEWABLE
    input_set: "Exactly one Domain, read at call time. lifecycle_status IN {ACTIVE, EXPIRED, REDEMPTION} only; every other lifecycle_status is rejected."
    constants:
      REDEMPTION_FEE_CENTS: 8000
      PRIVACY_FEE_CENTS_PER_YEAR: 999
      MAX_TERM_YEARS: 10
    precision: "integer cents; charge_subtotal feeds invoice_total as line items"
    variants:
      - name: QUOTED
        when: "GET /registrar/domains/{id}/renewal-quote — a read-only projection; nothing is persisted"
        difference: "Reads lifecycle_status at quote time and returns quoted_total_cents = charge_subtotal (pre-tax, pre-service-fee). No Invoice is created."
      - name: CHARGED
        when: "POST /registrar/domains/{id}/renew — the mutating call"
        difference: "Re-reads lifecycle_status at renew time. A domain that was EXPIRED at quote time but has since been swept into REDEMPTION acquires the REDEMPTION_FEE_CENTS line, so the charged subtotal exceeds the quoted total by exactly REDEMPTION_FEE_CENTS."

  - name: hosting_bandwidth_overage
    trigger: "PROVISIONAL: POST /registrar/hosting-subscriptions/{id}/usage-records. FINAL: POST /registrar/billing-periods/{id}/close"
    algorithm: tiered_pricing
    formula: |
      quota_mb = plan.bandwidth_quota_mb
      rate     = plan.overage_rate_cents_per_gb

      # ---------- PROVISIONAL (chronological, flat rate, round PER RECORD) ------
      # Records of the period ordered by recorded_at ASC, tie-break created_at ASC.
      remaining_quota_mb = quota_mb
      provisional_cents  = 0
      for rec in records_of_period_sorted:
          over_mb            = max(0, rec.amount_mb - remaining_quota_mb)
          remaining_quota_mb = max(0, remaining_quota_mb - rec.amount_mb)
          provisional_cents += round_half_up(over_mb / 1024 * rate)   # ROUNDED PER RECORD
      # ---------- FINAL (aggregate, tiered, round ONCE at the end) --------------
      total_mb  = sum(rec.amount_mb for rec in records_of_period)
      excess_gb = max(0, total_mb - quota_mb) / 1024
      t1 = min(excess_gb, OVERAGE_TIER1_GB)                                   # 0..10 GB
      t2 = min(max(excess_gb - OVERAGE_TIER1_GB, 0), OVERAGE_TIER2_GB)        # next 40 GB
      t3 = max(excess_gb - OVERAGE_TIER1_GB - OVERAGE_TIER2_GB, 0)            # beyond 50 GB
      final_cents = round_half_up(t1*rate + t2*rate*OVERAGE_TIER2_FACTOR + t3*rate*OVERAGE_TIER3_FACTOR)
    input_set: "UsageRecord rows whose subscription_id == the subscription AND whose recorded_at falls in [period.period_start, period.period_end). Both variants read exactly the same rows; they differ only in rate curve and rounding order."
    constants:
      OVERAGE_TIER1_GB: 10
      OVERAGE_TIER2_GB: 40
      OVERAGE_TIER2_FACTOR: 0.75
      OVERAGE_TIER3_FACTOR: 0.5
      MB_PER_GB: 1024
      BILLING_PERIOD_DAYS: 30
    precision: "cents, round_half_up; PROVISIONAL rounds once per record then sums, FINAL rounds once over the tiered total"
    variants:
      - name: PROVISIONAL
        when: "Written to BillingPeriod.provisional_overage_cents on every usage-record ingest, while the period is OPEN"
        difference: "Flat rate (no tier discounts) applied to the portion of each record above the running remaining quota, rounded to cents per record and then summed. Over-charges relative to FINAL whenever the excess crosses a tier boundary or the per-record fractions round up."
      - name: FINAL
        when: "Written to BillingPeriod.final_overage_cents at close and billed on the BANDWIDTH_OVERAGE invoice line"
        difference: "Aggregates all records first, applies the tiered rate curve to the total excess, and rounds exactly once. This — not the provisional figure — is what the customer is billed."

  - name: invoice_promo_and_service_fee
    trigger: "POST /registrar/invoices/{id}/apply-promo, and on every invoice creation (with no promo, discount_cents = 0)"
    algorithm: waterfall_allocation
    formula: |
      # EVALUATION ORDER IS PINNED. The service fee is keyed on the POST-discount
      # subtotal, while the promo's min_subtotal gate is keyed on the PRE-discount
      # subtotal, and the service fee never enters the discount base. Evaluating
      # these in any other order changes the answer.
      # (1) pre-discount subtotal over ALL lines
      subtotal_cents = sum(line.line_subtotal_cents for line in lines)
      # (2) eligibility gate
      eligible_lines    = [l for l in lines if l.item_type in promo.applies_to_item_types]
      eligible_subtotal = sum(l.line_subtotal_cents for l in eligible_lines)
      if len(eligible_lines) == 0 or eligible_subtotal == 0: reject ERR_PROMO_NOT_APPLICABLE
      if subtotal_cents < promo.min_subtotal_cents:          reject ERR_PROMO_MIN_NOT_MET
      # (3) raw discount
      if promo.discount_type == 'PERCENT':
          raw_discount = round_half_up(eligible_subtotal * promo.discount_value)
      else:
          raw_discount = min(promo.discount_value, eligible_subtotal)
      # (4) cap
      discount_cents = min(raw_discount, promo.max_discount_cents)
      # (5) allocate across eligible lines, waterfall in created_at ASC order
      remaining = discount_cents
      for l in eligible_lines sorted by created_at ASC:
          l.line_discount_cents = min(remaining, l.line_subtotal_cents)
          remaining -= l.line_discount_cents
      # (6) post-discount subtotal
      subtotal_after_discount = subtotal_cents - discount_cents
      # (7) tiered service fee, keyed on the POST-discount subtotal
      if   subtotal_after_discount <  SERVICE_FEE_TIER1_MAX: service_fee_cents = SERVICE_FEE_T0_CENTS
      elif subtotal_after_discount <  SERVICE_FEE_TIER2_MAX: service_fee_cents = SERVICE_FEE_T1_CENTS
      else:                                                  service_fee_cents = SERVICE_FEE_T2_CENTS
      # (8) hand off to calculations.invoice_total for per-line tax and the total
    input_set: "All InvoiceLineItem rows of the invoice. Only lines whose item_type appears in promo.applies_to_item_types receive discount; the service-fee tier is keyed on the whole invoice's post-discount subtotal."
    constants:
      SERVICE_FEE_TIER1_MAX: 5000
      SERVICE_FEE_TIER2_MAX: 20000
      SERVICE_FEE_T0_CENTS: 0
      SERVICE_FEE_T1_CENTS: 299
      SERVICE_FEE_T2_CENTS: 999
    precision: "integer cents, round_half_up on the percent discount"

  - name: invoice_total
    trigger: "Invoice creation, and re-run after POST /registrar/invoices/{id}/apply-promo"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: tax is rounded PER LINE ITEM and the rounded
      # per-line amounts are then summed. Do NOT compute
      # round_half_up((subtotal - discount) * TAX_RATE) over the whole invoice —
      # the two orders differ by a cent on many inputs.
      for line in lines:
          line.line_tax_cents   = round_half_up((line.line_subtotal_cents - line.line_discount_cents) * TAX_RATE)
          line.line_total_cents = line.line_subtotal_cents - line.line_discount_cents + line.line_tax_cents
      invoice.subtotal_cents    = sum(line.line_subtotal_cents)
      invoice.discount_cents    = sum(line.line_discount_cents)
      invoice.tax_cents         = sum(line.line_tax_cents)          # sum of ROUNDED per-line taxes
      invoice.service_fee_cents = <from calculations.invoice_promo_and_service_fee, NOT taxed>
      invoice.total_cents       = invoice.subtotal_cents - invoice.discount_cents
                                  + invoice.service_fee_cents + invoice.tax_cents
    input_set: "Every InvoiceLineItem of the invoice, in created_at ASC order. The service fee is added after tax and is itself untaxed."
    constants:
      TAX_RATE: 0.0825
    precision: "integer cents; round_half_up applied once per line, never to the invoice-wide tax base"

  - name: account_credit_balance
    trigger: "POST /registrar/accounts/{id}/credits, POST /registrar/invoices/{id}/pay, POST /registrar/invoices/{id}/refund"
    algorithm: aggregation
    formula: |
      credit_balance_cents = SUM(LedgerEntry.amount_cents
                                 WHERE account_id = A
                                   AND entry_type IN ('CREDIT_GRANT', 'CREDIT_APPLIED'))
      # Payment waterfall at POST /invoices/{id}/pay:
      applied_credit_cents = min(credit_balance_cents, invoice.total_cents) if use_credit else 0
      cash_remainder_cents = invoice.total_cents - applied_credit_cents
      # cash_remainder_cents == 0 => no payment method is required (boundary case)
    input_set: "All LedgerEntry rows of the account with entry_type IN {CREDIT_GRANT, CREDIT_APPLIED}, in created_at ASC order."
    constants: {}
    precision: "integer cents; no rounding"

  - name: account_cash_conservation
    trigger: "POST /registrar/invoices/{id}/pay and POST /registrar/invoices/{id}/refund"
    algorithm: aggregation
    formula: |
      net_cash_cents = SUM(LedgerEntry.amount_cents
                           WHERE account_id = A AND entry_type IN ('PAYMENT', 'REFUND'))
      # INVARIANT (compensating action): for any invoice paid entirely in cash and
      # then fully refunded to destination CARD,
      #   net_cash_cents(after) == net_cash_cents(before the payment)
      # and Invoice.amount_paid_cents - Invoice.amount_refunded_cents == 0.
      # A refund to destination CREDIT deliberately does NOT restore net_cash_cents;
      # it converts cash into credit_balance_cents instead.
    input_set: "All LedgerEntry rows of the account with entry_type IN {PAYMENT, REFUND}."
    constants: {}
    precision: "integer cents; no rounding"

  - name: storage_commitment
    trigger: "POST /registrar/add-ons, DELETE /registrar/add-ons/{id}, and every cascade that changes an AddOn's status"
    algorithm: aggregation
    formula: |
      storage_committed_mb = SUM(AddOn.storage_mb_quota
                                 WHERE subscription_id = S
                                   AND add_on_type = 'EMAIL_MAILBOX'
                                   AND status IN ('PENDING_VALIDATION', 'ACTIVE', 'SUSPENDED'))
      # Admission check on POST /add-ons (EMAIL_MAILBOX):
      #   reject ERR_STORAGE_QUOTA_EXCEEDED iff
      #   storage_committed_mb + storage_mb_quota > plan.storage_quota_mb
      #   (strictly greater — landing exactly on the quota is allowed)
      # INVARIANT (compensating action): create-mailbox then delete-mailbox leaves
      # storage_committed_mb exactly at its pre-create value; a SUSPENDED mailbox
      # still holds its reservation, an EXPIRED/CANCELLED/REVOKED one does not.
    input_set: "AddOn rows of the subscription with add_on_type == EMAIL_MAILBOX and status IN {PENDING_VALIDATION, ACTIVE, SUSPENDED}. SSL_CERT add-ons never contribute (storage_mb_quota is forced to 0)."
    constants:
      SSL_PRICE_CENTS: 5999
      MAILBOX_PRICE_CENTS_PER_GB: 399
    precision: "integer MB; no rounding"

  - name: account_risk_score
    trigger: "Recomputed whenever a Domain of the account transitions ACTIVE -> SUSPENDED via an abuse uphold, and on every POST /registrar/_ops/run-expiry-sweep (decay refresh)"
    algorithm: weighted_scoring
    formula: |
      score = 0
      for r in AbuseReport rows WHERE r.status == 'UPHELD'
                                  AND r.domain_id IN (domains owned by account A):
          age_days = floor((clock_now - r.decided_at).total_seconds() / 86400)
          score   += SEVERITY_WEIGHT[r.severity] * (DECAY_FACTOR ** floor(age_days / DECAY_HALFLIFE_DAYS))
      risk_score = min(100, round_half_up(score))
      # AUTO-SUSPEND: Account transitions ACTIVE -> SUSPENDED iff
      #   risk_score >= AUTO_SUSPEND_THRESHOLD   (>= 70, NOT > 70)
    input_set: "AbuseReport rows with status == UPHELD whose domain_id belongs to the account. DISMISSED, OPEN and UNDER_REVIEW reports contribute nothing."
    constants:
      SEVERITY_WEIGHT: { LOW: 10, HIGH: 30, CRITICAL: 60 }
      DECAY_FACTOR: 0.5
      DECAY_HALFLIFE_DAYS: 90
      AUTO_SUSPEND_THRESHOLD: 70
    precision: "integer 0..100, round_half_up after summing the decayed weights"

  - name: domain_expiry_sweep
    trigger: "POST /registrar/_ops/run-expiry-sweep"
    algorithm: chronological
    formula: |
      # Domains are processed in created_at ASC order (never by id).
      # A single sweep advances each domain as far as the clock permits — the
      # ladder below is applied repeatedly to the same domain within one sweep,
      # so a clock far in the future can carry a domain ACTIVE -> DELETED in one call.
      for d in domains sorted by created_at ASC:
          if d.lifecycle_status == 'ACTIVE' and d.expires_at <= now:
              if d.auto_renew_enabled and account.status == 'ACTIVE'
                     and account.payment_method_on_file:
                  auto-renew 1 year (stay ACTIVE, raise + settle an invoice)
              else:
                  d -> EXPIRED  (+ cascade B)
          if d.lifecycle_status == 'EXPIRED'  and now >= d.expires_at + EXPIRY_GRACE_DAYS days:
              d -> REDEMPTION
          if d.lifecycle_status == 'REDEMPTION' and now >= d.expires_at + (EXPIRY_GRACE_DAYS + REDEMPTION_DAYS) days:
              d -> PENDING_DELETE
          if d.lifecycle_status == 'PENDING_DELETE' and now >= d.expires_at + (EXPIRY_GRACE_DAYS + REDEMPTION_DAYS + PENDING_DELETE_DAYS) days:
              d -> DELETED  (+ cascade)
      # AddOns: every AddOn with status == ACTIVE and ends_at <= now -> EXPIRED.
      # Then every affected account's risk_score is refreshed (decay).
    input_set: "All Domain rows with lifecycle_status IN {ACTIVE, EXPIRED, REDEMPTION, PENDING_DELETE}, processed in created_at ASC order. All AddOn rows with status == ACTIVE."
    constants:
      EXPIRY_GRACE_DAYS: 30
      REDEMPTION_DAYS: 30
      PENDING_DELETE_DAYS: 5
      TRANSFER_LOCK_DAYS: 60
      MAX_TRANSFER_ATTEMPTS: 3
    precision: "day-granularity comparisons against the logical clock; all boundaries are inclusive (<=)"

  - name: ssl_interval_conflict
    trigger: "POST /registrar/add-ons with add_on_type == SSL_CERT"
    algorithm: interval_merge
    formula: |
      new_start = starts_at (defaults to clock now)
      new_end   = starts_at + term_days days
      # CLOSED intervals plus a mandatory buffer on both sides: two certificates on
      # the same domain may not touch and must be separated by more than
      # SSL_RENEWAL_BUFFER_DAYS. Adjacency (new_start == existing.ends_at) IS a conflict.
      conflict iff EXISTS AddOn x WHERE x.domain_id == new.domain_id
                                    AND x.add_on_type == 'SSL_CERT'
                                    AND x.status IN ('PENDING_VALIDATION', 'ACTIVE')
                                    AND x.starts_at <= new_end   + SSL_RENEWAL_BUFFER_DAYS days
                                    AND x.ends_at   >= new_start - SSL_RENEWAL_BUFFER_DAYS days
      -> ERR_SSL_INTERVAL_CONFLICT
    input_set: "SSL_CERT AddOns on the same domain_id with status IN {PENDING_VALIDATION, ACTIVE}. EXPIRED, REVOKED and CANCELLED certificates free their interval."
    constants:
      SSL_RENEWAL_BUFFER_DAYS: 1
    precision: "day granularity; closed-interval comparison (<= / >=) on both ends"

  - name: billing_period_overlap
    trigger: "POST /registrar/hosting-subscriptions/{id}/billing-periods"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN intervals [period_start, period_end), no buffer: two periods of the
      # same subscription may abut exactly (new.period_start == existing.period_end
      # is ALLOWED) but may not overlap by even one instant.
      conflict iff EXISTS BillingPeriod p WHERE p.subscription_id == new.subscription_id
                                            AND p.period_start < new.period_end
                                            AND new.period_start < p.period_end
      -> ERR_BILLING_PERIOD_OVERLAP
      # Both OPEN and CLOSED periods occupy the timeline.
    input_set: "All BillingPeriod rows of the subscription regardless of status."
    constants: {}
    precision: "instant granularity; strict `<` on both ends (half-open semantics)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role (X-User-ID may be omitted only for the Anonymous role)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The caller's role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body/query schema: required fields present, enum members valid, integers non-negative, term_years in 1..10, ttl in 60..86400, limit in 1..100, offset >= 0, priority present iff record_type == MX, mailbox_address present iff add_on_type == EMAIL_MAILBOX"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Every resource named in the path exists, validated left to right"
    error_id: ERR_ACCOUNT_NOT_FOUND | ERR_DOMAIN_NOT_FOUND | ERR_DNS_RECORD_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_ADDON_NOT_FOUND | ERR_TRANSFER_REQUEST_NOT_FOUND | ERR_INVOICE_NOT_FOUND | ERR_BILLING_PERIOD_NOT_FOUND | ERR_ABUSE_REPORT_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves (account_id, plan_id, primary_domain_id, subscription_id, domain_id, promo_code)"
    error_id: ERR_ACCOUNT_NOT_FOUND | ERR_HOSTING_PLAN_NOT_FOUND | ERR_DOMAIN_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_PROMO_CODE_NOT_FOUND
    http_status: 404
    applies_to: "POST /domains, POST /hosting-subscriptions, POST /add-ons, POST /transfer-requests, POST /abuse-reports, POST /invoices/{id}/apply-promo"

  - priority: 6
    category: auth
    check: "A Registrant's X-User-ID must equal the Account.id that owns the target resource (Domain.account_id, HostingSubscription.account_id, AddOn -> subscription.account_id, Invoice.account_id, TransferRequest.account_id, DnsRecord -> domain.account_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every Registrant-accessible endpoint that targets an owned resource"

  - priority: 7
    category: auth
    check: "The AbuseAnalyst deciding a report (uphold/dismiss) must not be the analyst who reviewed it: X-User-ID != AbuseReport.reviewer_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /abuse-reports/{id}/uphold, POST /abuse-reports/{id}/dismiss"

  - priority: 8
    category: state
    check: "expected_domain_version == Domain.version (optimistic concurrency)"
    error_id: ERR_STALE_DOMAIN_VERSION
    http_status: 412
    applies_to: "POST /domains/{id}/renew"

  - priority: 9
    category: state
    check: "expected_invoice_version == Invoice.version (optimistic concurrency)"
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412
    applies_to: "POST /invoices/{id}/apply-promo"

  - priority: 10
    category: state
    check: "The acting Registrant's Account.status must be ACTIVE for any mutating request"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 403
    applies_to: "every mutating Registrant endpoint"

  - priority: 20
    category: state
    check: "Domain.lifecycle_status IN {ACTIVE, EXPIRED, REDEMPTION} for a renewal or a renewal quote"
    error_id: ERR_DOMAIN_NOT_RENEWABLE
    http_status: 409
    applies_to: "GET /domains/{id}/renewal-quote, POST /domains/{id}/renew"

  - priority: 21
    category: state
    check: "Domain.lifecycle_status == ACTIVE for lock/unlock, DNS writes, add-on creation, SSL validation and transfer-out submission"
    error_id: ERR_INVALID_DOMAIN_STATE
    http_status: 409
    applies_to: "PATCH /domains/{id}/settings, POST /domains/{id}/dns-records, DELETE /dns-records/{id}, POST /add-ons, POST /add-ons/{id}/validate, POST /transfer-requests/{id}/submit"

  - priority: 22
    category: state
    check: "Domain.lifecycle_status == SUSPENDED for a reinstate"
    error_id: ERR_INVALID_DOMAIN_STATE
    http_status: 409
    applies_to: "POST /domains/{id}/reinstate"

  - priority: 23
    category: state
    check: "AddOn.status == PENDING_VALIDATION and add_on_type == SSL_CERT for a validate call"
    error_id: ERR_ADDON_NOT_PENDING_VALIDATION
    http_status: 409
    applies_to: "POST /add-ons/{id}/validate"

  - priority: 24
    category: state
    check: "TransferRequest.status is the one the transition requires (INITIATED for submit, PENDING_ACK for registry-response, REJECTED for retry)"
    error_id: ERR_TRANSFER_INVALID_STATE
    http_status: 409
    applies_to: "POST /transfer-requests/{id}/submit, POST /transfer-requests/{id}/registry-response, POST /transfer-requests/{id}/retry"

  - priority: 25
    category: state
    check: "Invoice.status == ISSUED to pay; Invoice.status IN {PAID, PARTIALLY_REFUNDED} to refund; Invoice.status == ISSUED to apply a promo"
    error_id: ERR_INVOICE_NOT_PAYABLE | ERR_INVOICE_NOT_REFUNDABLE
    http_status: 409
    applies_to: "POST /invoices/{id}/pay, POST /invoices/{id}/refund, POST /invoices/{id}/apply-promo"

  - priority: 26
    category: state
    check: "BillingPeriod.status == OPEN for a close, and the usage record's recorded_at falls inside an OPEN BillingPeriod of the subscription"
    error_id: ERR_PERIOD_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /billing-periods/{id}/close"

  - priority: 27
    category: state
    check: "AbuseReport.status == OPEN for a review; == UNDER_REVIEW for uphold/dismiss"
    error_id: ERR_ABUSE_REPORT_INVALID_STATE
    http_status: 409
    applies_to: "POST /abuse-reports/{id}/review, POST /abuse-reports/{id}/uphold, POST /abuse-reports/{id}/dismiss"

  - priority: 28
    category: state
    check: "HostingSubscription.status IN {ACTIVE, OVER_QUOTA} before an add-on may be created or usage ingested against it"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /add-ons, POST /hosting-subscriptions/{id}/usage-records, POST /hosting-subscriptions/{id}/billing-periods"

  - priority: 50
    category: business_safety
    check: "A domain with an abuse hold — Domain.suspension_reason == ABUSE, or any AbuseReport on it with status IN {UNDER_REVIEW, UPHELD} — cannot be transferred out. Checked BEFORE the registrar-lock check."
    error_id: ERR_ABUSE_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /transfer-requests/{id}/submit (direction == OUT)"

  - priority: 60
    category: business_referential
    check: "A TXT DnsRecord may not be deleted while an AddOn on the same domain with add_on_type == SSL_CERT and status IN {PENDING_VALIDATION, ACTIVE} has validation_token == the record's value"
    error_id: ERR_DNS_RECORD_IN_USE
    http_status: 409
    applies_to: "DELETE /dns-records/{id}"

  - priority: 62
    category: business_referential
    check: "A DnsRecord with record_type == TXT, name == '_acme-challenge' and value == AddOn.validation_token must exist on AddOn.domain_id before an SSL certificate can be validated"
    error_id: ERR_DNS_VALIDATION_FAILED
    http_status: 409
    applies_to: "POST /add-ons/{id}/validate"

  - priority: 65
    category: business_constraint
    check: "Domain.lock_status == UNLOCKED for an outbound transfer submission"
    error_id: ERR_DOMAIN_LOCKED
    http_status: 409
    applies_to: "POST /transfer-requests/{id}/submit (direction == OUT)"

  - priority: 66
    category: business_temporal
    check: "A domain may not be unlocked (nor transferred out) within TRANSFER_LOCK_DAYS (60) days of Domain.registered_at"
    error_id: ERR_TRANSFER_LOCK_PERIOD
    http_status: 409
    applies_to: "PATCH /domains/{id}/settings with locked=false, POST /transfer-requests/{id}/submit (direction == OUT)"

  - priority: 67
    category: business_constraint
    check: "TransferRequest.epp_auth_code == Domain.epp_auth_code for an outbound transfer submission"
    error_id: ERR_EPP_AUTH_MISMATCH
    http_status: 409
    applies_to: "POST /transfer-requests/{id}/submit (direction == OUT)"

  - priority: 68
    category: business_constraint
    check: "TransferRequest.attempt_count < MAX_TRANSFER_ATTEMPTS (3) on a retry"
    error_id: ERR_TRANSFER_MAX_ATTEMPTS
    http_status: 409
    applies_to: "POST /transfer-requests/{id}/retry"

  - priority: 69
    category: business_constraint
    check: "The requested fqdn is not already held by a Domain whose lifecycle_status NOT IN {DELETED, TRANSFERRED_OUT}"
    error_id: ERR_DOMAIN_UNAVAILABLE
    http_status: 409
    applies_to: "POST /domains, POST /transfer-requests (direction == IN), POST /transfer-requests/{id}/submit (direction == IN)"

  - priority: 70
    category: business_temporal
    check: "A renewal may not push expires_at more than MAX_TERM_YEARS (10) years beyond the logical clock"
    error_id: ERR_MAX_TERM_EXCEEDED
    http_status: 422
    applies_to: "POST /domains/{id}/renew"

  - priority: 71
    category: business_constraint
    check: "(domain_id, mailbox_address) is unique among AddOns with add_on_type == EMAIL_MAILBOX and status != CANCELLED"
    error_id: ERR_MAILBOX_ADDRESS_TAKEN
    http_status: 409
    applies_to: "POST /add-ons"

  - priority: 72
    category: business_temporal
    check: "A new SSL_CERT add-on's [starts_at, ends_at] closed interval, widened by SSL_RENEWAL_BUFFER_DAYS on both sides, must not intersect any PENDING_VALIDATION/ACTIVE SSL_CERT interval on the same domain"
    error_id: ERR_SSL_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /add-ons (add_on_type == SSL_CERT)"

  - priority: 73
    category: business_temporal
    check: "A new BillingPeriod's half-open [period_start, period_end) interval must not overlap any existing period of the same subscription; abutting periods are allowed"
    error_id: ERR_BILLING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /hosting-subscriptions/{id}/billing-periods"

  - priority: 74
    category: business_temporal
    check: "A usage record's recorded_at must fall inside an OPEN BillingPeriod of the subscription"
    error_id: ERR_USAGE_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /hosting-subscriptions/{id}/usage-records"

  - priority: 80
    category: business_constraint
    check: "The promo code has at least one eligible line item with a non-zero subtotal on this invoice"
    error_id: ERR_PROMO_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /invoices/{id}/apply-promo"

  - priority: 81
    category: business_constraint
    check: "Invoice.subtotal_cents (pre-discount) >= PromoCode.min_subtotal_cents"
    error_id: ERR_PROMO_MIN_NOT_MET
    http_status: 422
    applies_to: "POST /invoices/{id}/apply-promo"

  - priority: 85
    category: business_fiscal
    check: "storage_committed_mb + storage_mb_quota <= HostingPlan.storage_quota_mb (strictly greater is rejected; landing exactly on the quota is allowed)"
    error_id: ERR_STORAGE_QUOTA_EXCEEDED
    http_status: 422
    applies_to: "POST /add-ons (add_on_type == EMAIL_MAILBOX)"

  - priority: 90
    category: business_fiscal
    check: "If the cash remainder after the credit waterfall is > 0, Account.payment_method_on_file must be true"
    error_id: ERR_PAYMENT_METHOD_REQUIRED
    http_status: 402
    applies_to: "POST /invoices/{id}/pay"

  - priority: 91
    category: business_fiscal
    check: "Refund amount_cents <= Invoice.amount_paid_cents - Invoice.amount_refunded_cents"
    error_id: ERR_REFUND_EXCEEDS_PAID
    http_status: 422
    applies_to: "POST /invoices/{id}/refund"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Accounts ----
  - method: POST
    path: "/registrar/accounts"
    description: "Open a registrar account."
    roles: [Anonymous]
    code: 201
    input: [email, company_name, "auto_renew_default?"]
    output: Account
    side_effects: ["Account created with status ACTIVE, credit_balance_cents 0, net_cash_cents 0, risk_score 0, payment_method_on_file false"]

  - method: GET
    path: "/registrar/accounts/{id}"
    description: "Read an account, including credit_balance_cents, net_cash_cents and risk_score."
    roles: [Registrant, SupportAgent, BillingAdmin, AbuseAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/registrar/accounts/{id}/payment-method"
    description: "Attach a card token to the account."
    roles: [Registrant, BillingAdmin]
    code: 200
    input: [card_token]
    output: Account
    side_effects: ["payment_method_token set", "payment_method_on_file = true", "increments Account.version by 1"]

  - method: POST
    path: "/registrar/accounts/{id}/credits"
    description: "Grant store credit (goodwill / upsell incentive). Writes a CREDIT_GRANT ledger entry."
    roles: [BillingAdmin]
    code: 201
    input: [amount_cents, reason]
    output: LedgerEntry
    side_effects: ["LedgerEntry(CREDIT_GRANT, +amount_cents, reference_type=ADJUSTMENT) written", "Account.credit_balance_cents recomputed per calculations.account_credit_balance"]

  - method: GET
    path: "/registrar/accounts/{id}/ledger-entries"
    description: "List the account's money movements in created_at ASC order (reverse-reachability for LedgerEntry.account_id)."
    roles: [Registrant, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: POST
    path: "/registrar/accounts/{id}/reinstate"
    description: "Lift an abuse auto-suspension on the account."
    roles: [SupportAgent]
    code: 200
    input: [reason]
    output: Account
    side_effects: ["Account SUSPENDED -> ACTIVE", "cascade: SUSPENDED HostingSubscriptions -> ACTIVE", "cascade: SUSPENDED AddOns of those subscriptions -> ACTIVE", "suspended Domains are NOT reinstated"]

  # ---- Domain search / registration / WHOIS ----
  - method: GET
    path: "/registrar/domain-search"
    description: "Check availability and price of a name. Runs calculations.domain_base_price."
    roles: [Anonymous, Registrant]
    code: 200
    input: [domain_name, tld]
    output: "{ domain_name: string, tld: string, fqdn: string, available: boolean, is_premium: boolean, base_year_price_cents: integer }"
    side_effects: []

  - method: POST
    path: "/registrar/domains"
    description: "Register a domain. Creates the Domain in PENDING_PAYMENT and an ISSUED Invoice with a DOMAIN_REGISTRATION line (plus a PRIVACY_FEE line when whois_privacy is true)."
    roles: [Registrant]
    code: 201
    input: [account_id, domain_name, tld, term_years, registrant_name, registrant_email, "whois_privacy?", "auto_renew?"]
    output: Domain
    side_effects: ["Domain created lifecycle_status=PENDING_PAYMENT, lock_status=LOCKED", "Invoice (ISSUED) created and priced by calculations.invoice_total"]

  - method: GET
    path: "/registrar/domains/{id}"
    description: "Read a domain. Anonymous callers get the WHOIS projection: when whois_privacy_enabled is true, registrant_name is 'REDACTED FOR PRIVACY' and registrant_email is 'privacy@proxy.example'; epp_auth_code is null for every role except the owning Registrant, SupportAgent and PlatformAdmin."
    roles: [Anonymous, Registrant, SupportAgent, AbuseAnalyst, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Domain
    side_effects: []

  - method: GET
    path: "/registrar/domains"
    description: "List domains, created_at ASC (reverse-reachability for Domain.account_id)."
    roles: [Registrant, SupportAgent, AbuseAnalyst, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["account_id?", "lifecycle_status?", "lock_status?", "limit?", "offset?"]
    output: Domain[]
    side_effects: []

  - method: PATCH
    path: "/registrar/domains/{id}/settings"
    description: "Toggle WHOIS privacy, auto-renew and the registrar transfer lock. Enabling privacy raises a new ISSUED Invoice with a PRIVACY_FEE line for the remaining whole years of the term."
    roles: [Registrant]
    code: 200
    input: ["whois_privacy?", "auto_renew?", "locked?"]
    output: Domain
    side_effects: ["lock_status transitions on the second Domain state dimension", "enabling whois_privacy creates an ISSUED Invoice with a PRIVACY_FEE line", "increments Domain.version by 1"]

  - method: GET
    path: "/registrar/domains/{id}/renewal-quote"
    description: "QUOTED variant of calculations.domain_renewal_charge. Read-only; nothing is persisted."
    roles: [Registrant, BillingAdmin]
    code: 200
    input: [term_years]
    output: "{ domain_id: string, term_years: integer, variant: string, lifecycle_status: string, renewal_subtotal_cents: integer, redemption_fee_cents: integer, privacy_fee_cents: integer, quoted_total_cents: integer, quoted_at: string }"
    side_effects: []

  - method: POST
    path: "/registrar/domains/{id}/renew"
    description: "CHARGED variant of calculations.domain_renewal_charge. OCC-guarded on Domain.version."
    roles: [Registrant, BillingAdmin]
    code: 200
    input: [term_years, expected_domain_version]
    output: Domain
    side_effects: ["Domain.expires_at recomputed (EXTEND branch from ACTIVE, RESET branch from EXPIRED/REDEMPTION)", "lifecycle_status returns to ACTIVE from EXPIRED/REDEMPTION", "creates an ISSUED Invoice (DOMAIN_RENEWAL line, plus REDEMPTION_FEE line when the domain was in REDEMPTION)", "increments Domain.version by 1"]

  - method: POST
    path: "/registrar/domains/{id}/reinstate"
    description: "Lift an abuse suspension on a single domain."
    roles: [SupportAgent]
    code: 200
    input: [reason]
    output: Domain
    side_effects: ["Domain SUSPENDED -> ACTIVE, suspension_reason cleared", "DnsRecord.serving_enabled = true", "SUSPENDED AddOns of this domain -> ACTIVE; REVOKED SSL certificates stay REVOKED"]

  # ---- DNS management ----
  - method: POST
    path: "/registrar/domains/{id}/dns-records"
    description: "Create a DNS record in the domain's zone."
    roles: [Registrant]
    code: 201
    input: [record_type, name, value, "ttl?", "priority?"]
    output: DnsRecord
    side_effects: ["serving_enabled derived from the parent domain's lifecycle_status"]

  - method: GET
    path: "/registrar/domains/{id}/dns-records"
    description: "List the zone's records (reverse-reachability for DnsRecord.domain_id)."
    roles: [Registrant, SupportAgent, PlatformAdmin]
    code: 200
    input: ["record_type?", "limit?", "offset?"]
    output: DnsRecord[]
    side_effects: []

  - method: DELETE
    path: "/registrar/dns-records/{id}"
    description: "Delete a DNS record. Rejected while an SSL add-on still depends on the TXT challenge value."
    roles: [Registrant]
    code: 204
    input: []
    output: null
    side_effects: ["record removed"]

  # ---- Transfers (EPP auth) ----
  - method: POST
    path: "/registrar/transfer-requests"
    description: "Open an inbound or outbound transfer request in INITIATED."
    roles: [Registrant]
    code: 201
    input: [account_id, direction, domain_name, tld, epp_auth_code, "domain_id?"]
    output: TransferRequest
    side_effects: ["TransferRequest created with status INITIATED and attempt_count 0"]

  - method: GET
    path: "/registrar/transfer-requests/{id}"
    description: "Read a transfer request."
    roles: [Registrant, SupportAgent, PlatformAdmin]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []

  - method: GET
    path: "/registrar/transfer-requests"
    description: "List transfer requests, created_at ASC (reverse-reachability for TransferRequest.account_id and .domain_id)."
    roles: [Registrant, SupportAgent, PlatformAdmin]
    code: 200
    input: ["account_id?", "domain_id?", "status?", "limit?", "offset?"]
    output: TransferRequest[]
    side_effects: []

  - method: POST
    path: "/registrar/transfer-requests/{id}/submit"
    description: "Submit the request to the registry (INITIATED -> PENDING_ACK). For direction OUT this is where the abuse hold, registrar lock, 60-day lock period and EPP auth code are all checked, in that priority order."
    roles: [Registrant]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["attempt_count += 1"]

  - method: POST
    path: "/registrar/transfer-requests/{id}/registry-response"
    description: "Registry simulator: acknowledge or reject a pending transfer."
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, "reason?"]
    output: TransferRequest
    side_effects: ["APPROVED + direction IN: creates the Domain (ACTIVE, LOCKED, expires_at = now + 365d) and sets TransferRequest.domain_id", "APPROVED + direction OUT: the Domain transitions ACTIVE -> TRANSFERRED_OUT and cascades to its AddOns and HostingSubscriptions", "REJECTED: status REJECTED, or FAILED when attempt_count has already reached MAX_TRANSFER_ATTEMPTS"]

  - method: POST
    path: "/registrar/transfer-requests/{id}/retry"
    description: "Re-arm a REJECTED transfer request with a fresh EPP auth code (REJECTED -> INITIATED)."
    roles: [Registrant]
    code: 200
    input: [epp_auth_code]
    output: TransferRequest
    side_effects: ["epp_auth_code replaced, rejection_reason cleared, status back to INITIATED"]

  # ---- Hosting ----
  - method: POST
    path: "/registrar/hosting-plans"
    description: "Define a hosting plan."
    roles: [BillingAdmin]
    code: 201
    input: [plan_code, tier, storage_quota_mb, bandwidth_quota_mb, monthly_price_cents, included_mailboxes, included_ssl, overage_rate_cents_per_gb]
    output: HostingPlan
    side_effects: []

  - method: POST
    path: "/registrar/hosting-subscriptions"
    description: "Buy a hosting plan. Creates the subscription in PROVISIONING and an ISSUED Invoice with a HOSTING_PLAN line."
    roles: [Registrant]
    code: 201
    input: [account_id, plan_id, "primary_domain_id?"]
    output: HostingSubscription
    side_effects: ["HostingSubscription created (PROVISIONING)", "Invoice (ISSUED) created with a HOSTING_PLAN line priced at plan.monthly_price_cents"]

  - method: GET
    path: "/registrar/hosting-subscriptions/{id}"
    description: "Read a subscription, including storage_committed_mb and bandwidth_used_mb."
    roles: [Registrant, SupportAgent, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: HostingSubscription
    side_effects: []

  - method: GET
    path: "/registrar/hosting-subscriptions"
    description: "List subscriptions, created_at ASC (reverse-reachability for account_id, plan_id and primary_domain_id)."
    roles: [Registrant, SupportAgent, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["account_id?", "plan_id?", "primary_domain_id?", "status?", "limit?", "offset?"]
    output: HostingSubscription[]
    side_effects: []

  - method: POST
    path: "/registrar/hosting-subscriptions/{id}/usage-records"
    description: "Ingest a bandwidth usage record (may be back-dated inside the OPEN period). Refreshes the PROVISIONAL overage and may push the subscription into OVER_QUOTA."
    roles: [PlatformAdmin]
    code: 201
    input: [metric, amount_mb, recorded_at]
    output: UsageRecord
    side_effects: ["HostingSubscription.bandwidth_used_mb recomputed", "BillingPeriod.provisional_overage_cents recomputed (PROVISIONAL variant)", "ACTIVE -> OVER_QUOTA when bandwidth_used_mb > plan.bandwidth_quota_mb"]

  - method: GET
    path: "/registrar/hosting-subscriptions/{id}/usage-records"
    description: "List usage records, created_at ASC (reverse-reachability for UsageRecord.subscription_id)."
    roles: [Registrant, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: UsageRecord[]
    side_effects: []

  - method: POST
    path: "/registrar/hosting-subscriptions/{id}/billing-periods"
    description: "Open an additional metering period. Rejected on half-open overlap with any existing period of the subscription."
    roles: [BillingAdmin]
    code: 201
    input: [period_start, period_end]
    output: BillingPeriod
    side_effects: ["BillingPeriod created OPEN with provisional_overage_cents 0"]

  - method: GET
    path: "/registrar/hosting-subscriptions/{id}/billing-periods"
    description: "List the subscription's metering periods, created_at ASC (reverse-reachability for BillingPeriod.subscription_id)."
    roles: [Registrant, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BillingPeriod[]
    side_effects: []

  - method: POST
    path: "/registrar/billing-periods/{id}/close"
    description: "Close a period: compute the FINAL overage, bill it, reset the bandwidth counter and drop OVER_QUOTA back to ACTIVE."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: BillingPeriod
    side_effects: ["final_overage_cents computed (FINAL variant)", "an ISSUED Invoice with billing_period_id set and a BANDWIDTH_OVERAGE line is created when final_overage_cents > 0", "HostingSubscription.bandwidth_used_mb = 0", "OVER_QUOTA -> ACTIVE"]

  # ---- SSL & email add-ons ----
  - method: POST
    path: "/registrar/add-ons"
    description: "Buy an SSL certificate or an email mailbox. SSL starts PENDING_VALIDATION with a server-minted validation_token; a mailbox goes straight to ACTIVE and commits its storage."
    roles: [Registrant]
    code: 201
    input: [subscription_id, domain_id, add_on_type, term_days, "starts_at?", "mailbox_address?", "storage_mb_quota?"]
    output: AddOn
    side_effects: ["SSL_CERT: validation_token minted, status PENDING_VALIDATION, interval conflict checked", "EMAIL_MAILBOX: status ACTIVE, HostingSubscription.storage_committed_mb += storage_mb_quota", "an ISSUED Invoice with an SSL_CERT / EMAIL_MAILBOX line is created"]

  - method: GET
    path: "/registrar/add-ons/{id}"
    description: "Read an add-on, including validation_token and the [starts_at, ends_at] interval."
    roles: [Registrant, SupportAgent, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: GET
    path: "/registrar/add-ons"
    description: "List add-ons, created_at ASC (reverse-reachability for AddOn.subscription_id and AddOn.domain_id)."
    roles: [Registrant, SupportAgent, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "domain_id?", "add_on_type?", "status?", "limit?", "offset?"]
    output: AddOn[]
    side_effects: []

  - method: POST
    path: "/registrar/add-ons/{id}/validate"
    description: "DNS-01 validation of an SSL certificate: requires a TXT record named '_acme-challenge' on the domain whose value equals the add-on's validation_token."
    roles: [Registrant]
    code: 200
    input: []
    output: AddOn
    side_effects: ["AddOn PENDING_VALIDATION -> ACTIVE"]

  - method: DELETE
    path: "/registrar/add-ons/{id}"
    description: "Cancel an add-on. A mailbox releases its storage reservation exactly."
    roles: [Registrant]
    code: 204
    input: []
    output: null
    side_effects: ["AddOn -> CANCELLED", "EMAIL_MAILBOX: HostingSubscription.storage_committed_mb -= storage_mb_quota"]

  # ---- Billing & upsell ----
  - method: GET
    path: "/registrar/invoices/{id}"
    description: "Read an invoice with its computed money fields."
    roles: [Registrant, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/registrar/invoices"
    description: "List invoices, created_at ASC (reverse-reachability for Invoice.account_id and Invoice.billing_period_id)."
    roles: [Registrant, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["account_id?", "status?", "billing_period_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/registrar/invoices/{id}/line-items"
    description: "List the invoice's line items, created_at ASC (reverse-reachability for InvoiceLineItem.invoice_id)."
    roles: [Registrant, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: InvoiceLineItem[]
    side_effects: []

  - method: POST
    path: "/registrar/invoices/{id}/apply-promo"
    description: "Apply (or replace) a promo code on an ISSUED invoice. Re-runs calculations.invoice_promo_and_service_fee and calculations.invoice_total. OCC-guarded on Invoice.version."
    roles: [Registrant, BillingAdmin]
    code: 200
    input: [promo_code, expected_invoice_version]
    output: Invoice
    side_effects: ["per-line discounts allocated", "service_fee_cents re-tiered on the post-discount subtotal", "tax and total recomputed", "increments Invoice.version by 1"]

  - method: POST
    path: "/registrar/invoices/{id}/pay"
    description: "Pay an ISSUED invoice: store credit is applied first, the cash remainder goes on the card. Activates the billed subject."
    roles: [Registrant, BillingAdmin]
    code: 200
    input: ["use_credit?"]
    output: Invoice
    side_effects: ["LedgerEntry(CREDIT_APPLIED) and/or LedgerEntry(PAYMENT) written", "Invoice -> PAID", "Domain PENDING_PAYMENT -> ACTIVE / HostingSubscription PROVISIONING -> ACTIVE (with its first BillingPeriod)"]

  - method: POST
    path: "/registrar/invoices/{id}/refund"
    description: "Refund a paid invoice to the card or to store credit."
    roles: [BillingAdmin]
    code: 200
    input: [amount_cents, destination, reason]
    output: Invoice
    side_effects: ["destination CARD: LedgerEntry(REFUND, -amount_cents), restoring Account.net_cash_cents", "destination CREDIT: LedgerEntry(CREDIT_GRANT, +amount_cents)", "Invoice -> PARTIALLY_REFUNDED or REFUNDED"]

  - method: POST
    path: "/registrar/promo-codes"
    description: "Create a promo code (upsell lever)."
    roles: [BillingAdmin]
    code: 201
    input: [code, discount_type, discount_value, applies_to_item_types, min_subtotal_cents, max_discount_cents]
    output: PromoCode
    side_effects: []

  # ---- Abuse / suspension ----
  - method: POST
    path: "/registrar/abuse-reports"
    description: "Anyone may report a domain for abuse."
    roles: [Anonymous]
    code: 201
    input: [domain_id, category, severity, reporter_email, "evidence_url?"]
    output: AbuseReport
    side_effects: ["AbuseReport created OPEN"]

  - method: GET
    path: "/registrar/abuse-reports/{id}"
    description: "Read an abuse report."
    roles: [AbuseAnalyst, SupportAgent, PlatformAdmin]
    code: 200
    input: []
    output: AbuseReport
    side_effects: []

  - method: GET
    path: "/registrar/abuse-reports"
    description: "List abuse reports, created_at ASC (reverse-reachability for AbuseReport.domain_id)."
    roles: [AbuseAnalyst, SupportAgent, PlatformAdmin]
    code: 200
    input: ["domain_id?", "status?", "limit?", "offset?"]
    output: AbuseReport[]
    side_effects: []

  - method: POST
    path: "/registrar/abuse-reports/{id}/review"
    description: "Take a report into review; records the caller as reviewer_user_id."
    roles: [AbuseAnalyst]
    code: 200
    input: []
    output: AbuseReport
    side_effects: ["reviewer_user_id = X-User-ID"]

  - method: POST
    path: "/registrar/abuse-reports/{id}/uphold"
    description: "Uphold a report. Must be a different analyst from the reviewer. Fires the five-level suspension cascade."
    roles: [AbuseAnalyst]
    code: 200
    input: [decision_note]
    output: AbuseReport
    side_effects: ["decider_user_id, decided_at set", "Domain ACTIVE -> SUSPENDED", "domain's DNS stops serving; SSL add-ons REVOKED; mailbox add-ons SUSPENDED", "Account.risk_score recomputed", "Account ACTIVE -> SUSPENDED when risk_score >= 70, which suspends the account's HostingSubscriptions"]

  - method: POST
    path: "/registrar/abuse-reports/{id}/dismiss"
    description: "Dismiss a report. Must be a different analyst from the reviewer. No side effects on domains or accounts."
    roles: [AbuseAnalyst]
    code: 200
    input: [decision_note]
    output: AbuseReport
    side_effects: ["decider_user_id, decided_at set", "no domain / account / risk_score change"]

  # ---- System (test-driving surface) ----
  - method: POST
    path: "/registrar/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-05-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock moved; no entity state changes until a sweep runs"]

  - method: POST
    path: "/registrar/_ops/run-expiry-sweep"
    description: "Advance the expiry/redemption ladder, auto-renew eligible domains, expire due add-ons and refresh risk-score decay. Runs calculations.domain_expiry_sweep."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ auto_renewed_count: integer, expired_count: integer, redemption_count: integer, pending_delete_count: integer, deleted_count: integer, addon_expired_count: integer }"
    side_effects: ["Domain lifecycle_status ladder advanced with cascade B", "AddOn ACTIVE -> EXPIRED when ends_at <= now", "Account.risk_score refreshed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role missing/unknown, or X-User-ID missing for a non-Anonymous role"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Registrant acts on a resource whose owning account is not their X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The AbuseAnalyst upholding/dismissing a report is the same analyst who reviewed it"
  - id: ERR_ACCOUNT_SUSPENDED
    http: 403
    condition: "A mutating request is made by a Registrant whose Account.status == SUSPENDED"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, bad enum member, out-of-range number, MX record without priority, mailbox without mailbox_address"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "account_id does not resolve"
  - id: ERR_DOMAIN_NOT_FOUND
    http: 404
    condition: "domain_id does not resolve"
  - id: ERR_DNS_RECORD_NOT_FOUND
    http: 404
    condition: "dns_record_id does not resolve"
  - id: ERR_HOSTING_PLAN_NOT_FOUND
    http: 404
    condition: "plan_id does not resolve"
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscription_id does not resolve"
  - id: ERR_ADDON_NOT_FOUND
    http: 404
    condition: "add_on_id does not resolve"
  - id: ERR_TRANSFER_REQUEST_NOT_FOUND
    http: 404
    condition: "transfer_request_id does not resolve"
  - id: ERR_INVOICE_NOT_FOUND
    http: 404
    condition: "invoice_id does not resolve"
  - id: ERR_BILLING_PERIOD_NOT_FOUND
    http: 404
    condition: "billing_period_id does not resolve"
  - id: ERR_ABUSE_REPORT_NOT_FOUND
    http: 404
    condition: "abuse_report_id does not resolve"
  - id: ERR_PROMO_CODE_NOT_FOUND
    http: 404
    condition: "promo_code does not resolve to a PromoCode"
  - id: ERR_STALE_DOMAIN_VERSION
    http: 412
    condition: "expected_domain_version != Domain.version on renew"
  - id: ERR_STALE_INVOICE_VERSION
    http: 412
    condition: "expected_invoice_version != Invoice.version on apply-promo"
  - id: ERR_DOMAIN_NOT_RENEWABLE
    http: 409
    condition: "Renewal or renewal quote on a domain whose lifecycle_status is not ACTIVE, EXPIRED or REDEMPTION"
  - id: ERR_INVALID_DOMAIN_STATE
    http: 409
    condition: "Domain lifecycle_status is wrong for the requested operation (settings, DNS write, add-on create, SSL validate, transfer-out submit, reinstate)"
  - id: ERR_ADDON_NOT_PENDING_VALIDATION
    http: 409
    condition: "validate called on an add-on that is not an SSL_CERT in PENDING_VALIDATION"
  - id: ERR_TRANSFER_INVALID_STATE
    http: 409
    condition: "submit / registry-response / retry called from the wrong TransferRequest.status"
  - id: ERR_INVOICE_NOT_PAYABLE
    http: 409
    condition: "pay or apply-promo on an invoice whose status is not ISSUED"
  - id: ERR_INVOICE_NOT_REFUNDABLE
    http: 409
    condition: "refund on an invoice whose status is not PAID or PARTIALLY_REFUNDED"
  - id: ERR_PERIOD_ALREADY_CLOSED
    http: 409
    condition: "close called on a BillingPeriod whose status is CLOSED"
  - id: ERR_ABUSE_REPORT_INVALID_STATE
    http: 409
    condition: "review from a non-OPEN report, or uphold/dismiss from a non-UNDER_REVIEW report"
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "Add-on creation, usage ingest or period creation against a subscription whose status is not ACTIVE or OVER_QUOTA"
  - id: ERR_ABUSE_HOLD_ACTIVE
    http: 409
    condition: "Outbound transfer submitted for a domain under an abuse hold (suspension_reason == ABUSE, or an AbuseReport on it in UNDER_REVIEW/UPHELD)"
  - id: ERR_DNS_RECORD_IN_USE
    http: 409
    condition: "Deleting the TXT record an unvalidated/active SSL add-on's validation_token depends on"
  - id: ERR_DNS_VALIDATION_FAILED
    http: 409
    condition: "SSL validate called while no TXT '_acme-challenge' record on the domain carries the add-on's validation_token"
  - id: ERR_DOMAIN_LOCKED
    http: 409
    condition: "Outbound transfer submitted while Domain.lock_status == LOCKED"
  - id: ERR_TRANSFER_LOCK_PERIOD
    http: 409
    condition: "Unlock or outbound transfer attempted within 60 days of Domain.registered_at"
  - id: ERR_EPP_AUTH_MISMATCH
    http: 409
    condition: "Outbound transfer's epp_auth_code does not equal Domain.epp_auth_code"
  - id: ERR_TRANSFER_MAX_ATTEMPTS
    http: 409
    condition: "retry called when attempt_count has already reached MAX_TRANSFER_ATTEMPTS (3)"
  - id: ERR_DOMAIN_UNAVAILABLE
    http: 409
    condition: "The fqdn is already held by a Domain that is not DELETED or TRANSFERRED_OUT"
  - id: ERR_MAILBOX_ADDRESS_TAKEN
    http: 409
    condition: "(domain_id, mailbox_address) already exists on a non-CANCELLED mailbox add-on"
  - id: ERR_SSL_INTERVAL_CONFLICT
    http: 409
    condition: "The new SSL certificate's buffered closed interval intersects another live certificate on the same domain"
  - id: ERR_BILLING_PERIOD_OVERLAP
    http: 409
    condition: "The new half-open metering interval overlaps an existing period of the subscription"
  - id: ERR_MAX_TERM_EXCEEDED
    http: 422
    condition: "The renewal would push expires_at more than 10 years past the logical clock"
  - id: ERR_USAGE_OUTSIDE_PERIOD
    http: 422
    condition: "recorded_at does not fall inside any OPEN BillingPeriod of the subscription"
  - id: ERR_PROMO_NOT_APPLICABLE
    http: 422
    condition: "No line item on the invoice has an item_type in the promo's applies_to_item_types (empty eligible set)"
  - id: ERR_PROMO_MIN_NOT_MET
    http: 422
    condition: "Invoice.subtotal_cents (pre-discount) is below the promo's min_subtotal_cents"
  - id: ERR_STORAGE_QUOTA_EXCEEDED
    http: 422
    condition: "storage_committed_mb + storage_mb_quota would exceed the plan's storage_quota_mb"
  - id: ERR_PAYMENT_METHOD_REQUIRED
    http: 402
    condition: "The cash remainder after the credit waterfall is > 0 but no card is on file"
  - id: ERR_REFUND_EXCEEDS_PAID
    http: 422
    condition: "Refund amount exceeds amount_paid_cents - amount_refunded_cents"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated public: domain search, WHOIS lookup, account signup, abuse reporting."
    identity: "opaque"
    exclusive_operations:
      - "POST /registrar/accounts"
      - "POST /registrar/abuse-reports"
    shared_operations:
      - "GET /registrar/domain-search"
      - "GET /registrar/domains/{id} (WHOIS projection: masked registrant fields, epp_auth_code null)"

  - name: Registrant
    description: "The customer, acting as their own Account. Owns domains, DNS, hosting subscriptions, add-ons and transfer requests."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /registrar/domains"
      - "PATCH /registrar/domains/{id}/settings"
      - "POST /registrar/domains/{id}/dns-records"
      - "DELETE /registrar/dns-records/{id}"
      - "POST /registrar/transfer-requests"
      - "POST /registrar/transfer-requests/{id}/submit"
      - "POST /registrar/transfer-requests/{id}/retry"
      - "POST /registrar/hosting-subscriptions"
      - "POST /registrar/add-ons"
      - "POST /registrar/add-ons/{id}/validate"
      - "DELETE /registrar/add-ons/{id}"
    shared_operations:
      - "GET /registrar/domain-search"
      - "GET /registrar/domains, GET /registrar/domains/{id}, GET /registrar/domains/{id}/dns-records"
      - "GET /registrar/domains/{id}/renewal-quote, POST /registrar/domains/{id}/renew"
      - "POST /registrar/accounts/{id}/payment-method"
      - "GET /registrar/accounts/{id}, GET /registrar/accounts/{id}/ledger-entries"
      - "GET /registrar/hosting-subscriptions*, GET /registrar/add-ons*, GET /registrar/transfer-requests*"
      - "GET /registrar/invoices*, POST /registrar/invoices/{id}/apply-promo, POST /registrar/invoices/{id}/pay"

  - name: SupportAgent
    description: "Customer-support operator: reads everything, lifts suspensions."
    identity: "opaque"
    exclusive_operations:
      - "POST /registrar/domains/{id}/reinstate"
      - "POST /registrar/accounts/{id}/reinstate"
    shared_operations:
      - "GET /registrar/accounts/{id}, GET /registrar/domains*, GET /registrar/hosting-subscriptions*, GET /registrar/add-ons*, GET /registrar/transfer-requests*, GET /registrar/abuse-reports*"

  - name: AbuseAnalyst
    description: "Trust & safety operator. Segregation of duties: the analyst who reviews a report may not decide it."
    identity: "opaque"
    exclusive_operations:
      - "POST /registrar/abuse-reports/{id}/review"
      - "POST /registrar/abuse-reports/{id}/uphold"
      - "POST /registrar/abuse-reports/{id}/dismiss"
    shared_operations:
      - "GET /registrar/abuse-reports, GET /registrar/abuse-reports/{id}"
      - "GET /registrar/accounts/{id}, GET /registrar/domains, GET /registrar/domains/{id}"

  - name: BillingAdmin
    description: "Revenue operator: plans, promo codes, credits, refunds, metering periods."
    identity: "opaque"
    exclusive_operations:
      - "POST /registrar/hosting-plans"
      - "POST /registrar/promo-codes"
      - "POST /registrar/accounts/{id}/credits"
      - "POST /registrar/invoices/{id}/refund"
      - "POST /registrar/hosting-subscriptions/{id}/billing-periods"
      - "POST /registrar/billing-periods/{id}/close"
    shared_operations:
      - "GET /registrar/invoices*, POST /registrar/invoices/{id}/apply-promo, POST /registrar/invoices/{id}/pay"
      - "GET /registrar/accounts/{id}, GET /registrar/accounts/{id}/ledger-entries"
      - "POST /registrar/accounts/{id}/payment-method"
      - "GET /registrar/domains, GET /registrar/domains/{id}, GET /registrar/domains/{id}/renewal-quote, POST /registrar/domains/{id}/renew"
      - "GET /registrar/hosting-subscriptions*, GET /registrar/add-ons*"

  - name: PlatformAdmin
    description: "Registry gateway and system operator: registry responses, usage ingest, logical clock, expiry sweep."
    identity: "opaque"
    exclusive_operations:
      - "POST /registrar/transfer-requests/{id}/registry-response"
      - "POST /registrar/hosting-subscriptions/{id}/usage-records"
      - "POST /registrar/_clock/set_current_utc"
      - "POST /registrar/_ops/run-expiry-sweep"
    shared_operations:
      - "GET /registrar/accounts/{id}, GET /registrar/accounts/{id}/ledger-entries"
      - "GET /registrar/domains*, GET /registrar/hosting-subscriptions*, GET /registrar/add-ons*, GET /registrar/invoices*, GET /registrar/transfer-requests*, GET /registrar/abuse-reports*"
