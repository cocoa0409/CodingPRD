  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_constraint_on_reserve
        grounds:
          - validations[priority=4]
          - validations[priority=13]
        distinguishing_aspect: |
          A reserve against a model with zero available bikes AND a stale model version: priority-5
          OCC (state, 412) is checked before priority-13 ERR_NO_BIKES_AVAILABLE (business_constraint,
          409); a dual-failure request returns the higher-priority error. (state vs business_constraint pair)
        test_recipe:
          setup:
            - "STANDARD model with exactly 1 bike, already reserved by another account (available_count 0)."
            - "A second SUBSCRIBER holding a stale model version observed before the first reservation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /bike-models"
              payload: { name: "Std", model_class: "STANDARD", monthly_fee_cents: 8000, daily_rate_cents: 2000, purchase_price_cents: 90000, deposit_cents: 10000, fleet_size: 1 }
              as: OpsAdmin
              captures: { model_id: $.data.id }
