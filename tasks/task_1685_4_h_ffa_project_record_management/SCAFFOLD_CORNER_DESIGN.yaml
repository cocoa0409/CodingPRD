  # =========================================================================
  # Section: endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: list_clubs_pagination_envelope
        claim_type: listing
        grounds:
          - "endpoints.GET /api/clubs"
          - response_envelope
        distinguishing_aspect: "GET /api/clubs returns a paginated envelope containing total_count, has_more, limit, and offset fields."
        test_recipe:
          setup:
            - "Two clubs exist"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Pg Club 1", county_code: "P1" }
              as: ProgramAdmin
            - call: "POST /api/clubs"
              payload: { name: "Pg Club 2", county_code: "P2" }
              as: ProgramAdmin
          trigger:
            - call: "GET /api/clubs"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response envelope contains pagination fields total_count and has_more"
            - "total_count == 2"

      - name: fair_entry_referential_integrity_project_member_mismatch
        claim_type: violation_to_error
        grounds:
          - "endpoints.POST /api/fair-entries"
          - "errors[ERR_REFERENTIAL_INTEGRITY]"
        distinguishing_aspect: "Creating a FairEntry whose project belongs to a different member returns ERR_REFERENTIAL_INTEGRITY (422)."
        test_recipe:
          setup:
            - "Two ACTIVE members; a project owned by member A"
          setup_api_calls:
            - call: "POST /api/clubs"
              payload: { name: "Ref Club", county_code: "RF" }
              as: ProgramAdmin
              captures: { club_id: $.data.id }
            - call: "POST /api/volunteers"
              payload: { full_name: "Vol Ref", email: "vref@x.com", base_clearance: 50, risk_flags: 0, years_service: 3, club_id: "${club_id}" }
              as: ProgramAdmin
              captures: { vol_id: $.data.id }
            - call: "POST /api/volunteers/${vol_id}/clear"
              payload: {}
              as: ProgramAdmin
            - call: "POST /api/members"
              payload: { full_name: "Mem RA", birth_date: "2009-01-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { memA: $.data.id }
            - call: "POST /api/members/${memA}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/members"
              payload: { full_name: "Mem RB", birth_date: "2009-02-01", club_id: "${club_id}" }
              as: Volunteer
              as_user_id: "${vol_id}"
              captures: { memB: $.data.id }
            - call: "POST /api/members/${memB}/activate"
              payload: {}
              as: Volunteer
              as_user_id: "${vol_id}"
            - call: "POST /api/projects"
              payload: { member_id: "${memA}", project_type: "FOODS", program_year: 2026 }
              as: Member
              as_user_id: "${memA}"
              captures: { projA: $.data.id }
            - call: "POST /api/projects/${projA}/start"
              payload: {}
              as: Member
              as_user_id: "${memA}"
          trigger:
            - call: "POST /api/fair-entries"
              payload: { member_id: "${memB}", project_id: "${projA}", fair_level: "COUNTY" }
              as: Member
              as_user_id: "${memB}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENTIAL_INTEGRITY  # project belongs to a different member"

