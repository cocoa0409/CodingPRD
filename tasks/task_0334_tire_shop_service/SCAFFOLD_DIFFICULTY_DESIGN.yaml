scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: mileage_proration_mileage_vs_tread_basis
        grounds:
          - calculations.mileage_proration
          - state_machines.MileageWarrantyClaim.SUBMITTED_to_APPROVED
          - entities.MileageWarrantyClaim.fields.prorated_credit_cents
        distinguishing_aspect: |
          On the MileageWarrantyClaim domain: mileage_based (1 - miles/warranty_mi) and
          tread_based (1 - used_tread/usable_tread) variants produce different credits for
          identical inputs; the system applies mileage_based. With orig_price=14999,
          warranty=60000, miles=30000, orig_tread=10, measured=2, qty=4 the mileage_based
          credit is 30000 cents while the tread_based credit would be 0 cents.
        test_recipe:
          setup:
            - "A Customer, a Vehicle they own, a TireModel (unit_price 14999, mileage_warranty 60000, original_tread 10), a FitmentRule OE_EXACT linking them."
            - "An APPROVED+PAID WorkOrder with one TIRE line (qty 4), then a MileageWarrantyClaim SUBMITTED on that line (measured_tread 2, miles 30000, qty 4, payout STORE_CREDIT)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One", phone: "555-0001" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "TOYOTA", model: "CAMRY", model_year: 2022, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "PRIMACY", size_token: "235/45R18", load_index: 94, speed_rating: "V", unit_price_cents: 14999, mileage_warranty_miles: 60000, original_tread_32nds: 10, stock_qty: 10 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { line_id: $.data.id, wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_id}/authorize-payment"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_id}/capture-payment"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /mileage-claims"
              payload: { work_order_line_id: "${line_id}", tire_model_id: "${tm_id}", measured_tread_32nds: 2, miles_driven: 30000, payout_method: "STORE_CREDIT", claim_quantity: 4 }
              as: ServiceAdvisor
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /mileage-claims/${claim_id}/approve"
              payload: {}
              as: ServiceAdvisor
              captures: { credit: $.data.prorated_credit_cents }
          assert:
            - "MileageWarrantyClaim.${claim_id}.status == APPROVED"
            - "MileageWarrantyClaim.${claim_id}.prorated_credit_cents == 30000"

      - name: road_hazard_premium_pct_vs_floor_on_workorder
        grounds:
          - calculations.road_hazard_premium
          - calculations.work_order_pricing
          - state_machines.WorkOrder.DRAFT_to_APPROVED
          - entities.WorkOrder.fields.road_hazard_premium_cents
        distinguishing_aspect: |
          On the WorkOrder/RoadHazardWarranty domain (a DIFFERENT entity domain from the
          mileage claim): the premium uses max(pct_of_extended, per_tire_floor). For a low-priced
          TIRE line (unit 8000, qty 1) the floor (1200) wins; for a high-priced line (unit 14999,
          qty 4) the pct term (7200) wins. Same formula, two divergent branches selected by inputs.
        test_recipe:
          setup:
            - "A Customer+Vehicle+FitmentRule for a cheap tire (unit_price 8000) and an APPROVED WorkOrder carrying one opted TIRE line of qty 1."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two", phone: "555-0002" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "HONDA", model: "CIVIC", model_year: 2021, oe_tire_size: "215/55R17", rim_diameter_in: 17, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "GENERIC", model_name: "ECON", size_token: "215/55R17", load_index: 91, speed_rating: "H", unit_price_cents: 8000, mileage_warranty_miles: 0, original_tread_32nds: 9, stock_qty: 4 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "APPROVED_PLUS" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 1, road_hazard_opted: true, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { rh: $.data.road_hazard_premium_cents }
          assert:
            - "WorkOrder.${wo_id}.road_hazard_premium_cents == 1200"
            - "WorkOrder.${wo_id}.parts_subtotal_cents == 8000"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes (a),(b),(c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: work_order_pricing_per_line_round_then_tax_order_mode_b
        grounds:
          - calculations.work_order_pricing
          - state_machines.WorkOrder.DRAFT_to_APPROVED
          - entities.WorkOrder.fields.tax_cents
          - entities.WorkOrder.fields.total_due_cents
        distinguishing_aspect: |
          MODE (b) nested rounding where order matters: the formula pins per-line integer
          extension and a SINGLE round_half_up at the tax step over taxable_base
          (parts+service only; disposal and road-hazard are non-taxable). With parts=59996,
          service=18999, taxable=78995, tax=round_half_up(78995*0.0825)=6517 (NOT
          round(59996*0.0825)+round(18999*0.0825)). disposal=1400, rh=7200, pre_credit=94112.
        test_recipe:
          setup:
            - "Customer with 5000 store_credit, Vehicle, FitmentRule OE_EXACT; DRAFT WorkOrder with store_credit_applied 5000 carrying a TIRE line (unit 14999, qty 4, road-hazard opted), a MOUNT_BALANCE line (qty 4), and an ALIGNMENT line."
            - "Bay alignment_capable exists so the ALIGNMENT line is serviceable; store credit seeded via a prior PAID STORE_CREDIT mileage claim of 5000."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three", phone: "555-0003" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "BMW", model: "M3", model_year: 2023, oe_tire_size: "235/45R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "MICHELIN", model_name: "PSS", size_token: "235/45R18", load_index: 94, speed_rating: "Y", unit_price_cents: 14999, mileage_warranty_miles: 30000, original_tread_32nds: 10, stock_qty: 20 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            # --- seed 5000 store credit via a separate PAID STORE_CREDIT claim ---
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { seed_wo: $.data.id, seed_v0: $.data.version }
            - call: "POST /work-orders/${seed_wo}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 1, road_hazard_opted: false, expected_work_order_version: "${seed_v0}" }
              as: ServiceAdvisor
              captures: { seed_line: $.data.id, seed_v1: $.data.version }
            - call: "POST /work-orders/${seed_wo}/approve"
              payload: { expected_work_order_version: "${seed_v1}" }
              as: ServiceAdvisor
            - call: "POST /mileage-claims"
              payload: { work_order_line_id: "${seed_line}", tire_model_id: "${tm_id}", measured_tread_32nds: 2, miles_driven: 25000, payout_method: "STORE_CREDIT", claim_quantity: 1 }
              as: ServiceAdvisor
              captures: { seed_claim: $.data.id }
            - call: "POST /mileage-claims/${seed_claim}/approve"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /mileage-claims/${seed_claim}/pay"
              payload: {}
              as: ServiceAdvisor
            # seed claim: miles 25000/30000 => remaining 1/6 => per_tire round_half_up(14999*0.16667)=2500 => 2500 credit.
            # That gives 2500, not 5000. Use a SECOND seed claim to reach 5000 total.
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { seed2_wo: $.data.id, seed2_v0: $.data.version }
            - call: "POST /work-orders/${seed2_wo}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 1, road_hazard_opted: false, expected_work_order_version: "${seed2_v0}" }
              as: ServiceAdvisor
              captures: { seed2_line: $.data.id, seed2_v1: $.data.version }
            - call: "POST /work-orders/${seed2_wo}/approve"
              payload: { expected_work_order_version: "${seed2_v1}" }
              as: ServiceAdvisor
            - call: "POST /mileage-claims"
              payload: { work_order_line_id: "${seed2_line}", tire_model_id: "${tm_id}", measured_tread_32nds: 2, miles_driven: 25000, payout_method: "STORE_CREDIT", claim_quantity: 1 }
              as: ServiceAdvisor
              captures: { seed2_claim: $.data.id }
            - call: "POST /mileage-claims/${seed2_claim}/approve"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /mileage-claims/${seed2_claim}/pay"
              payload: {}
              as: ServiceAdvisor
            # store_credit now 5000 (2500 + 2500). Now build the priced order.
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", store_credit_applied_cents: 5000 }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: true, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "MOUNT_BALANCE", quantity: 4, expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "ALIGNMENT", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
              captures: { wo_v3: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v3}" }
              as: ServiceAdvisor
              captures: { tax: $.data.tax_cents, total: $.data.total_due_cents }
          assert:
            - "WorkOrder.${wo_id}.parts_subtotal_cents == 59996"
            - "WorkOrder.${wo_id}.service_subtotal_cents == 18999"
            - "WorkOrder.${wo_id}.disposal_fee_cents == 1400"
            - "WorkOrder.${wo_id}.road_hazard_premium_cents == 7200"
            - "WorkOrder.${wo_id}.tax_cents == 6517"
            - "WorkOrder.${wo_id}.total_due_cents == 89112"

      - name: disposal_fee_marginal_bracket_tiered_mode_a
        grounds:
          - calculations.disposal_fee_total
          - calculations.work_order_pricing
          - state_machines.WorkOrder.DRAFT_to_APPROVED
          - entities.WorkOrder.fields.disposal_fee_cents
        distinguishing_aspect: |
          MODE (a) formula with >=3 inputs and non-linear (marginal-bracket) interaction across
          two TIRE lines totalling 9 tires: disposal = min(9,4)*350 + clamp(9-4,0,4)*250 +
          max(9-8,0)*150 = 1400+1000+150 = 2550, NOT a flat 9*top-bracket. Distinct mode from the
          per-line-rounding (b) instance above.
        test_recipe:
          setup:
            - "Customer+Vehicle+FitmentRule OE_EXACT, two TIRE lines (qty 5 and qty 4) of a tire with stock 20, DRAFT WorkOrder."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four", phone: "555-0004" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "FORD", model: "F150", model_year: 2020, oe_tire_size: "265/70R17", rim_diameter_in: 17, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "GOODYEAR", model_name: "WRANGLER", size_token: "265/70R17", load_index: 115, speed_rating: "T", unit_price_cents: 10000, mileage_warranty_miles: 50000, original_tread_32nds: 12, stock_qty: 20 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 5, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
              captures: { disp: $.data.disposal_fee_cents }
          assert:
            - "WorkOrder.${wo_id}.disposal_fee_cents == 2550"
            - "WorkOrder.${wo_id}.parts_subtotal_cents == 90000"
            - "WorkOrder.${wo_id}.tax_cents == 7425"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: work_order_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.WorkOrder.UNPAID_to_AUTHORIZED
          - state_machines.WorkOrder.APPROVED_to_IN_SERVICE
          - entities.WorkOrder.fields.payment_status
          - entities.WorkOrder.fields.fulfillment_status
        distinguishing_aspect: |
          WorkOrder carries PARALLEL state dimensions: authorize-payment advances payment_status
          UNPAID->AUTHORIZED while fulfillment_status remains APPROVED (the two axes evolve
          independently on the same row). After authorize-payment the order is
          fulfillment_status==APPROVED AND payment_status==AUTHORIZED.
        test_recipe:
          setup:
            - "An APPROVED WorkOrder (one in-stock TIRE line) with payment_status UNPAID."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five", phone: "555-0005" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "MAZDA", model: "CX5", model_year: 2022, oe_tire_size: "225/55R19", rim_diameter_in: 19, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "BRIDGESTONE", model_name: "DUELER", size_token: "225/55R19", load_index: 99, speed_rating: "H", unit_price_cents: 12000, mileage_warranty_miles: 50000, original_tread_32nds: 10, stock_qty: 8 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
          trigger:
            - call: "POST /work-orders/${wo_id}/authorize-payment"
              payload: {}
              as: ServiceAdvisor
              captures: { pay: $.data.payment_status, ful: $.data.fulfillment_status }
          assert:
            - "WorkOrder.${wo_id}.payment_status == AUTHORIZED"
            - "WorkOrder.${wo_id}.fulfillment_status == APPROVED"

      - name: install_appointment_reschedule_revert_cycle
        grounds:
          - state_machines.InstallAppointment.SCHEDULED_to_RESCHEDULE_PENDING
          - state_machines.InstallAppointment.RESCHEDULE_PENDING_to_SCHEDULED
          - entities.InstallAppointment.fields.status
        distinguishing_aspect: |
          On a DIFFERENT entity (InstallAppointment): the machine has a revert CYCLE
          SCHEDULED->RESCHEDULE_PENDING->SCHEDULED. request-reschedule then confirm-reschedule
          returns the appointment to SCHEDULED with a NEW interval, proving the loop is real and
          not a one-way pipeline.
        test_recipe:
          setup:
            - "A SCHEDULED InstallAppointment on an OPEN bay for an APPROVED+AUTHORIZED order."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six", phone: "555-0006" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", make: "AUDI", model: "A4", model_year: 2021, oe_tire_size: "245/40R18", rim_diameter_in: 18, tpms_type: "DIRECT" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /tire-models"
              payload: { brand: "PIRELLI", model_name: "PZERO", size_token: "245/40R18", load_index: 97, speed_rating: "Y", unit_price_cents: 18000, mileage_warranty_miles: 40000, original_tread_32nds: 9, stock_qty: 8 }
              as: InventoryManager
              captures: { tm_id: $.data.id }
            - call: "POST /fitment-rules"
              payload: { vehicle_id: "${veh_id}", tire_model_id: "${tm_id}", fitment_grade: "OE_EXACT" }
              as: InventoryManager
            - call: "POST /service-bays"
              payload: { bay_name: "Bay-A", alignment_capable: false, turnover_buffer_min: 15 }
              as: InventoryManager
              captures: { bay_id: $.data.id, bay_v0: $.data.version }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id, wo_v0: $.data.version }
            - call: "POST /work-orders/${wo_id}/lines"
              payload: { line_type: "TIRE", tire_model_id: "${tm_id}", quantity: 4, road_hazard_opted: false, expected_work_order_version: "${wo_v0}" }
              as: ServiceAdvisor
              captures: { wo_v1: $.data.version }
            - call: "POST /work-orders/${wo_id}/approve"
              payload: { expected_work_order_version: "${wo_v1}" }
              as: ServiceAdvisor
            - call: "POST /work-orders/${wo_id}/authorize-payment"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /appointments"
              payload: { work_order_id: "${wo_id}", service_bay_id: "${bay_id}", scheduled_start: "2026-07-01T09:00:00.000Z", scheduled_end: "2026-07-01T10:00:00.000Z", expected_service_bay_version: "${bay_v0}" }
              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/request-reschedule"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/confirm-reschedule"
              payload: { scheduled_start: "2026-07-02T13:00:00.000Z", scheduled_end: "2026-07-02T14:00:00.000Z" }
              as: ServiceAdvisor
              captures: { st: $.data.status, ns: $.data.scheduled_start }
          assert:
            - "InstallAppointment.${appt_id}.status == SCHEDULED"
            - "InstallAppointment.${appt_id}.scheduled_start == 2026-07-02T13:00:00.000Z"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_approved_order_cascade_depth3
        grounds:
          - state_machines.WorkOrder.APPROVED_to_CANCELLED
          - state_machines.WorkOrderLine.COMMITTED_to_VOID
          - state_machines.RoadHazardWarranty.ACTIVE_to_VOID
          - state_machines.InstallAppointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade triggered by cancel of an APPROVED order: cancel mutates WorkOrder
          (A->CANCELLED) which voids each COMMITTED WorkOrderLine (B); the line being COMMITTED
          is what causes its ACTIVE RoadHazardWarranty to VOID and its debited TireModel.stock_qty
          to be restocked (C); and the order's SCHEDULED InstallAppointment is cancelled. Each hop
          is caused by the previous, not by the original cancel directly issuing four parallel writes.
        test_recipe:
          setup:
            - "APPROVED WorkOrder with one opted TIRE line (qty 4) of a tire that started at stock 10 (now 6 after approval debit), an ACTIVE RoadHazardWarranty, and a SCHEDULED appointment."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "C Seven", phone: "555-0007" }
              as: ServiceAdvisor
