  # ---------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: list_permits_pagination_envelope
        claim_type: listing
        grounds: [endpoints, entities.Permit]
        distinguishing_aspect: "GET /permits returns an array envelope with pagination fields total_count and has_more."
        test_recipe:
          setup: ["A zone exists (list may be empty)."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "EP1", zone_code: "RPZ-EP1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
          trigger:
            - { call: "GET /permits", payload: { zone_id: "${zid}" }, as: PermitSupervisor }
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 0"
            - "response.meta.has_more == false"

      - name: transfer_creates_successor_conserves_count
        claim_type: conditional_action
        grounds: [state_machines.Permit.ACTIVE_to_TRANSFERRED, entities.Permit.fields.transferred_to_permit_id]
        distinguishing_aspect: "Transferring a permit to another ACTIVE vehicle of the same household mints an ACTIVE successor, terminates the predecessor as TRANSFERRED, and leaves Zone.active_permit_count unchanged (1)."
        test_recipe:
          setup: ["Household with an ACTIVE permit on V1 and a second ACTIVE vehicle V2."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "EP2", zone_code: "RPZ-EP2", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id, zv: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "12 A", resident_name: "Tr", contact_email: "tr@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
            - { call: "POST /households/${hid}/vehicles", payload: { license_plate: "EP2-A", make: "A", model: "B" }, as: Resident, as_user_id: "${hid}", captures: { v1: $.data.id } }
            - { call: "POST /households/${hid}/vehicles", payload: { license_plate: "EP2-B", make: "A", model: "C" }, as: Resident, as_user_id: "${hid}", captures: { v2: $.data.id } }
            - { call: "POST /households/${hid}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hid}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${hid}", vehicle_id: "${v1}" }, as: Resident, as_user_id: "${hid}", captures: { aid: $.data.id } }
            - { call: "POST /permit-applications/${aid}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${aid}/approve", payload: { expected_zone_version: "${zv}" }, as: PermitSupervisor, captures: { pid: $.data.id } }
          trigger:
            - { call: "POST /permits/${pid}/transfer", payload: { vehicle_id: "${v2}" }, as: PermitSupervisor, captures: { succ: $.data.id } }
            - { call: "GET /zones/${zid}", payload: {}, as: PermitSupervisor, captures: { cnt: $.data.active_permit_count } }
          assert:
            - "Permit.${pid}.status == TRANSFERRED"
            - "Permit.${pid}.transferred_to_permit_id == ${succ}"
            - "Permit.${succ}.status == ACTIVE"
            - "Zone.${zid}.active_permit_count == 1"

      - name: permits_reverse_lookup_by_household
        claim_type: retrieval
        grounds: [entities.Permit.fields.household_id, endpoints]
        distinguishing_aspect: "GET /permits?household_id returns the household's issued permit (FK reverse-reachability)."
        test_recipe:
          setup: ["Household with one issued ACTIVE permit."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "EP3", zone_code: "RPZ-EP3", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id, zv: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "13 A", resident_name: "Rl", contact_email: "rl@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
            - { call: "POST /households/${hid}/vehicles", payload: { license_plate: "EP3-A", make: "A", model: "B" }, as: Resident, as_user_id: "${hid}", captures: { vid: $.data.id } }
            - { call: "POST /households/${hid}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hid}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zid}", household_id: "${hid}", vehicle_id: "${vid}" }, as: Resident, as_user_id: "${hid}", captures: { aid: $.data.id } }
            - { call: "POST /permit-applications/${aid}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${aid}/approve", payload: { expected_zone_version: "${zv}" }, as: PermitSupervisor, captures: { pid: $.data.id } }
          trigger:
            - { call: "GET /permits", payload: { household_id: "${hid}" }, as: Resident, as_user_id: "${hid}", captures: { first_id: "$.data[0].id" } }
          assert:
            - "response.data[0].id == ${pid}"
            - "response.meta.total_count == 1"

  # ------------------------------------------------------------------- errors
  - section: errors
    instances:
      - name: adjudicate_own_citation_rejected_sod
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.Citation.DISPUTED_to_UPHELD]
        distinguishing_aspect: "The issuing officer adjudicating their own disputed citation returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["A DISPUTED citation issued by officer-1."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "ER1", zone_code: "RPZ-ER1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
            - { call: "POST /households", payload: { zone_id: "${zid}", unit_address: "14 A", resident_name: "Sd", contact_email: "sd@x.com" }, as: Anonymous, captures: { hid: $.data.id } }
            - { call: "POST /citations", payload: { zone_id: "${zid}", license_plate: "SOD1", violation_type: "ZONE_VIOLATION" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { cid: $.data.id } }
            - { call: "POST /citations/${cid}/dispute", payload: {}, as: Resident, as_user_id: "${hid}" }
          trigger:
            - { call: "POST /citations/${cid}/adjudicate", payload: { outcome: "UPHELD" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { err: $.data.error_id } }
          assert:
            - "Citation.${cid}.status == DISPUTED"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "response.status == 403"

      - name: escalate_complaint_without_plate_returns_error
        claim_type: violation_to_error
        grounds: [state_machines.Complaint.OPEN_to_ESCALATED, "errors[ERR_ESCALATION_REQUIRES_PLATE]"]
        distinguishing_aspect: "Escalating a complaint whose target_plate is null returns ERR_ESCALATION_REQUIRES_PLATE (422)."
        test_recipe:
          setup: ["An OPEN complaint with no target_plate."]
          setup_api_calls:
            - { call: "POST /zones", payload: { name: "ER2", zone_code: "RPZ-ER2", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zid: $.data.id } }
            - { call: "POST /complaints", payload: { zone_id: "${zid}", complaint_type: "OTHER", description: "general noise" }, as: Resident, as_user_id: "resident-y", captures: { kid: $.data.id } }
          trigger:
            - { call: "POST /complaints/${kid}/resolve", payload: { outcome: "ESCALATED" }, as: EnforcementOfficer, as_user_id: "officer-1", captures: { err: $.data.error_id } }
          assert:
            - "Complaint.${kid}.status == OPEN"
            - "response.data.error_id == ERR_ESCALATION_REQUIRES_PLATE"
            - "response.status == 422"

