        claim_type: correct_result
        grounds:
          - calculations.outage_seasonality_gate
          - entities.MaintenanceOutage.fields.seasonality_index
        distinguishing_aspect: |
          The index is a twelve-entry table keyed on the month of window_start, not an interpolation:
          January proposals stamp 0.62, April 1.05, July 1.20 and October 0.90, and the stamping happens
          at propose time even though the 0.90 ceiling is only enforced at approve.
        test_recipe:
          setup:
            - "Plant GYP-1 with LINE-1 and no production runs, so at_risk_msf is always 0.000."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
              as: PlantAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /plant-ops/plants/${plant_id}/board-lines"
              payload: { designation: "LINE-1", max_speed_fpm: 500, web_width_in: 54.0 }
              as: PlantAdmin
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /plant-ops/maintenance-outages"
              payload: { line_id: "${line_id}", outage_type: "PLANNED", window_start: "2027-01-11T06:00:00Z", window_end: "2027-01-12T06:00:00Z", scope_note: "january slot" }
              as: MaintenancePlanner
              as_user_id: "u_planner"
              captures: { o_jan: $.data.id }
            - call: "POST /plant-ops/maintenance-outages"
              payload: { line_id: "${line_id}", outage_type: "PLANNED", window_start: "2027-04-12T06:00:00Z", window_end: "2027-04-13T06:00:00Z", scope_note: "april slot" }
              as: MaintenancePlanner
