  - method: GET
    path: "/tmc/unused-ticket-credits"
    description: "List UnusedTicketCredits (reverse-reachability for traveler_id / origin_booking_id / redeemed_by_booking_id / vendor_id)"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: ["traveler_id?", "origin_booking_id?", "redeemed_by_booking_id?", "vendor_id?", "status?"]
    output: "UnusedTicketCredit[]"
