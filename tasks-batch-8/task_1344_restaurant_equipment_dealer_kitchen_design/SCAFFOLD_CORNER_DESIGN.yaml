scaffold_corner_design:
  # =========================================================================
  # Section: entities — creation, retrieval, defaults, immutability, FK
  # =========================================================================
  - section: entities
    instances:
      - name: customer_create_returns_defaults
        claim_type: creation
        grounds: [entities.Customer]
        distinguishing_aspect: "Customer creation applies defaults: status=ACTIVE, outstanding_exposure_cents=0; system stamps id/created_at/updated_at/version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { legal_name: "Default Cust", contact_email: "d@x.test", credit_limit_cents: 1000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id, cstat: $.data.status, cexp: $.data.outstanding_exposure_cents, cver: $.data.version }
          assert:
            - "Customer.status == ACTIVE"
            - "Customer.outstanding_exposure_cents == 0"
            - "Customer.version == 1"
            - "Customer.id is a UUID without any prefix"

      - name: project_create_retainage_pct_default
        claim_type: defaults
        grounds: [entities.Project.fields.retainage_pct]
        distinguishing_aspect: "Omitting retainage_pct applies the 0.10 default; supplying 0.15 overrides it."
        test_recipe:
          setup: ["Customer C exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "DefPct", contact_email: "dp@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "NoPct", site_address: "1 A St", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { p1: $.data.id, pct1: $.data.retainage_pct }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "WithPct", site_address: "2 B St", health_jurisdiction: "CITY_HEALTH", retainage_pct: 0.15 }
              as: ProjectManager
              captures: { p2: $.data.id, pct2: $.data.retainage_pct }
          assert:
            - "Project.${p1}.retainage_pct == 0.10"
            - "Project.${p2}.retainage_pct == 0.15"

      - name: project_get_not_found
        claim_type: not_found
        grounds: [entities.Project, "errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "GET on a non-existent Project UUID returns 404 ERR_PROJECT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /design-build-projects/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROJECT_NOT_FOUND"

      - name: customer_list_pagination_envelope
        claim_type: listing
        grounds: [entities.Customer, response_envelope]
        distinguishing_aspect: "List returns pagination fields (limit, offset, total_count, has_more) per response_envelope; default limit=10."
        test_recipe:
          setup: ["Create 3 Customers"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "C1", contact_email: "c1@x.test", credit_limit_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { legal_name: "C2", contact_email: "c2@x.test", credit_limit_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { legal_name: "C3", contact_email: "c3@x.test", credit_limit_cents: 100000 }
              as: PlatformAdmin
          trigger:
            - call: "GET /customers"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response envelope contains pagination fields limit/offset/total_count/has_more"
            - "response pagination total_count == 3"
            - "response pagination has_more == false"

      - name: layout_hood_required_default_false
        claim_type: defaults
        grounds: [entities.KitchenLayout.fields.hood_required]
        distinguishing_aspect: "Omitting hood_required yields false."
        test_recipe:
          setup: ["Customer + Project"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "HoodDef", contact_email: "hd@x.test", credit_limit_cents: 100000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "HD", site_address: "5 X St", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /design-build-projects/${pid}/layouts"
              payload: { layout_label: "Rev-A", drawing_ref: "DWG-HD" }
              as: KitchenDesigner
              captures: { hood: $.data.hood_required }
          assert:
            - "KitchenLayout.hood_required == false"

      - name: fk_equipment_item_layout_id_reverse_reachable
        claim_type: fk_integrity
        grounds: [entities.EquipmentItem.fields.layout_id]
        distinguishing_aspect: "EquipmentItem.layout_id is a FK; reverse-reachability via GET /design-build-projects/{pid}/layouts/{lid}/equipment-items."
        test_recipe:
          setup: ["Project + Layout + 2 items"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "FKCust", contact_email: "fk@x.test", credit_limit_cents: 100000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "FK", site_address: "7 Y St", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts"
              payload: { layout_label: "Rev-A", drawing_ref: "DWG-FK" }
              as: KitchenDesigner
              captures: { lid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/equipment-items"
              payload: { model_no: "A", item_kind: "STOCK", quantity: 1, unit_price_cents: 100, lead_time_days: 1 }
              as: KitchenDesigner
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/equipment-items"
              payload: { model_no: "B", item_kind: "STOCK", quantity: 1, unit_price_cents: 200, lead_time_days: 1 }
              as: KitchenDesigner
          trigger:
            - call: "GET /design-build-projects/${pid}/layouts/${lid}/equipment-items"
              payload: {}
              as: KitchenDesigner
          assert:
            - "response.total_count == 2"
            - "every returned EquipmentItem.layout_id == ${lid}"

  # =========================================================================
  # Section: state_machines — invalid-from, terminal lockdown, side-effects
  # =========================================================================
  - section: state_machines
    instances:
      - name: layout_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.KitchenLayout]
        distinguishing_aspect: "New KitchenLayout is created in DRAFT."
        test_recipe:
          setup: ["Customer + Project"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Init", contact_email: "i@x.test", credit_limit_cents: 100000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "I", site_address: "9 Z St", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { pid: $.data.id }
          trigger:
            - call: "POST /design-build-projects/${pid}/layouts"
              payload: { layout_label: "Rev-A", drawing_ref: "DWG-I" }
              as: KitchenDesigner
              captures: { st: $.data.status, rev: $.data.revision_no }
          assert:
            - "KitchenLayout.status == DRAFT"
            - "KitchenLayout.revision_no == 1"

      - name: quote_accept_rejected_when_project_already_completed
        claim_type: invalid_transition
        grounds: [state_machines.Quote.PRESENTED_to_ACCEPTED, "errors[ERR_PROJECT_NOT_QUOTED]"]
        distinguishing_aspect: "Quote accept against a Project that has already been cancelled returns ERR_PROJECT_NOT_QUOTED — the state precondition rejects the second accept."
        test_recipe:
          setup:
            - "Customer + Project + APPROVED Layout + Quote presented"
            - "Project cancelled (cascades Quote to SUPERSEDED)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Cxl", contact_email: "cx@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "Cxl", site_address: "11 W St", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts"
              payload: { layout_label: "Rev-A", drawing_ref: "DWG-CXL" }
              as: KitchenDesigner
              captures: { lid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/equipment-items"
              payload: { model_no: "A", item_kind: "STOCK", quantity: 1, unit_price_cents: 1000, lead_time_days: 1 }
              as: KitchenDesigner
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/submit"
              payload: {}
              as: KitchenDesigner
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/approve"
              payload: {}
              as: ProjectManager
            - call: "POST /design-build-projects/${pid}/quotes"
              payload: { layout_id: "${lid}" }
              as: SalesRep
              captures: { qid: $.data.id }
            - call: "POST /design-build-projects/${pid}/quotes/${qid}/present"
              payload: {}
              as: SalesRep
            - call: "POST /design-build-projects/${pid}/cancel"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "GET /design-build-projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { v_pre_101: "$.data.version" }
            - call: "POST /design-build-projects/${pid}/quotes/${qid}/accept"
              payload: { expected_project_version: "${v_pre_101}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id IN {ERR_PROJECT_NOT_QUOTED, ERR_PROJECT_ALREADY_TERMINAL, ERR_QUOTE_NOT_PRESENTED} — the cancelled Project cascaded Quote to SUPERSEDED, so accept must reject"

      - name: delivery_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DeliveryJob, "errors[ERR_JOB_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Once a DeliveryJob is SITE_COMPLETE no further transitions are accepted; cancel attempt returns ERR_JOB_NOT_CANCELLABLE."
        test_recipe:
          setup:
            - "Full chain: Customer, Project, APPROVED Layout, Quote accepted"
            - "DeliveryJob dispatched + mark-site-complete (SITE_COMPLETE)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Term", contact_email: "t@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "Term", site_address: "13 V St", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts"
              payload: { layout_label: "Rev-A", drawing_ref: "DWG-T" }
              as: KitchenDesigner
              captures: { lid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/equipment-items"
              payload: { model_no: "A", item_kind: "STOCK", quantity: 1, unit_price_cents: 1000, lead_time_days: 1 }
              as: KitchenDesigner
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/submit"
              payload: {}
              as: KitchenDesigner
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/approve"
              payload: {}
              as: ProjectManager
            - call: "POST /design-build-projects/${pid}/quotes"
              payload: { layout_id: "${lid}" }
              as: SalesRep
              captures: { qid: $.data.id }
            - call: "POST /design-build-projects/${pid}/quotes/${qid}/present"
              payload: {}
              as: SalesRep
            - call: "GET /design-build-projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { v_pre_102: "$.data.version" }
            - call: "POST /design-build-projects/${pid}/quotes/${qid}/accept"
              payload: { expected_project_version: "${v_pre_102}" }
              as: Customer
              as_user_id: "${cid}"
            - call: "POST /design-build-projects/${pid}/delivery-jobs"
              payload: { scheduled_start: "2026-08-05T08:00:00Z", scheduled_end: "2026-08-05T12:00:00Z", rigging_required: false }
              as: LogisticsCoordinator
              captures: { jid: $.data.id }
            - call: "POST /design-build-projects/${pid}/delivery-jobs/${jid}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /design-build-projects/${pid}/delivery-jobs/${jid}/mark-site-complete"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /design-build-projects/${pid}/delivery-jobs/${jid}/cancel"
              payload: {}
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_JOB_NOT_CANCELLABLE"

      - name: project_cancel_cascade_only_non_terminal
        claim_type: side_effect_execution
        grounds: [state_machines.Project.DESIGN_to_CANCELLED]
        distinguishing_aspect: "Cancelling a Project cascades only non-terminal children; VERIFIED punch items are not flipped to VOID; COMPLETED startup sessions are not voided."
        test_recipe:
          setup:
            - "Project in COMMISSIONED with one VERIFIED punch item and one OPEN COSMETIC punch item"
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "CasTerm", contact_email: "ct@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "CT", site_address: "15 U St", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts"
              payload: { layout_label: "Rev-A", drawing_ref: "DWG-CT" }
              as: KitchenDesigner
              captures: { lid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/equipment-items"
              payload: { model_no: "A", item_kind: "STOCK", quantity: 1, unit_price_cents: 100000, lead_time_days: 5 }
              as: KitchenDesigner
              captures: { item_id: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/submit"
              payload: {}
              as: KitchenDesigner
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/approve"
              payload: {}
              as: ProjectManager
            - call: "POST /design-build-projects/${pid}/quotes"
              payload: { layout_id: "${lid}" }
              as: SalesRep
              captures: { qid: $.data.id }
            - call: "POST /design-build-projects/${pid}/quotes/${qid}/present"
              payload: {}
              as: SalesRep
            - call: "GET /design-build-projects/${pid}"
              payload: {}
              as: ProjectManager
              captures: { v_pre_103: "$.data.version" }
            - call: "POST /design-build-projects/${pid}/quotes/${qid}/accept"
              payload: { expected_project_version: "${v_pre_103}" }
              as: Customer
              as_user_id: "${cid}"
            - call: "POST /design-build-projects/${pid}/delivery-jobs"
              payload: { scheduled_start: "2026-08-05T08:00:00Z", scheduled_end: "2026-08-05T12:00:00Z", rigging_required: false }
              as: LogisticsCoordinator
              captures: { jid: $.data.id }
            - call: "POST /design-build-projects/${pid}/delivery-jobs/${jid}/dispatch"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /design-build-projects/${pid}/delivery-jobs/${jid}/mark-site-complete"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /service-agencies"
              payload: { agency_name: "S", covered_jurisdictions: ["CITY_HEALTH"], capacity: 5 }
              as: ServiceManager
            - call: "POST /design-build-projects/${pid}/startup-sessions"
              payload: { equipment_item_id: "${item_id}", technician_name: "T", demo_minutes: 30 }
              as: StartupTechnician
              captures: { ssid: $.data.id }
            - call: "POST /design-build-projects/${pid}/startup-sessions/${ssid}/complete"
              payload: {}
              as: StartupTechnician
            - call: "POST /design-build-projects/${pid}/punch-list-items"
              payload: { description: "Scratch on door", severity: "COSMETIC" }
              as: ProjectManager
              captures: { p_cos: $.data.id }
            - call: "POST /design-build-projects/${pid}/punch-list-items"
              payload: { description: "Fix valve", severity: "FUNCTIONAL" }
              as: ProjectManager
              captures: { p_fun: $.data.id }
            - call: "POST /design-build-projects/${pid}/punch-list-items/${p_fun}/verify"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /design-build-projects/${pid}/cancel"
              payload: {}
              as: ProjectManager
            - call: "GET /design-build-projects/${pid}/punch-list-items/${p_cos}"
              payload: {}
              as: ProjectManager
              captures: { cos_st: $.data.status }
            - call: "GET /design-build-projects/${pid}/punch-list-items/${p_fun}"
              payload: {}
              as: ProjectManager
              captures: { fun_st: $.data.status }
          assert:
            - "PunchListItem.${p_cos}.status == VOID (OPEN COSMETIC cascaded)"
            - "PunchListItem.${p_fun}.status == VERIFIED (terminal state preserved, not cascaded)"

  # =========================================================================
  # Section: calculations — correct results, input filtering, precision
  # =========================================================================
  - section: calculations
    instances:
      - name: freight_tier_1_only_below_ceiling
        claim_type: correct_result
        grounds: [calculations.freight_tier_calc]
        distinguishing_aspect: "Subtotal below TIER_1_CEILING is charged entirely at 6% with no surcharge when no CUSTOM_FABRICATION items."
        test_recipe:
          setup: ["Customer, Project, Layout APPROVED with one STOCK item qty 1 unit_price 1000000"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "T1", contact_email: "t1@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "T1", site_address: "17 S St", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts"
              payload: { layout_label: "Rev-A", drawing_ref: "DWG-T1" }
              as: KitchenDesigner
              captures: { lid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/equipment-items"
              payload: { model_no: "A", item_kind: "STOCK", quantity: 1, unit_price_cents: 1000000, lead_time_days: 1 }
              as: KitchenDesigner
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/submit"
              payload: {}
              as: KitchenDesigner
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/approve"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /design-build-projects/${pid}/quotes"
              payload: { layout_id: "${lid}" }
              as: SalesRep
              captures: { f: $.data.freight_cents, s: $.data.equipment_subtotal_cents }
          assert:
            - "Quote.equipment_subtotal_cents == 1000000"
            - "Quote.freight_cents == 60000"

      - name: installation_county_uplift_applied
        claim_type: constants_applied
        grounds: [calculations.installation_calc]
        distinguishing_aspect: "COUNTY_HEALTH jurisdiction applies 10% uplift to installation; CITY_HEALTH does not."
        test_recipe:
          setup: ["Two identical projects, one CITY_HEALTH one COUNTY_HEALTH; both with one STOCK item qty 1 unit_price 100000"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "Up", contact_email: "u@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "City", site_address: "A", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { p_city: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "County", site_address: "B", health_jurisdiction: "COUNTY_HEALTH" }
              as: ProjectManager
              captures: { p_cty: $.data.id }
            - call: "POST /design-build-projects/${p_city}/layouts"
              payload: { layout_label: "R", drawing_ref: "D1" }
              as: KitchenDesigner
              captures: { l_city: $.data.id }
            - call: "POST /design-build-projects/${p_cty}/layouts"
              payload: { layout_label: "R", drawing_ref: "D2" }
              as: KitchenDesigner
              captures: { l_cty: $.data.id }
            - call: "POST /design-build-projects/${p_city}/layouts/${l_city}/equipment-items"
              payload: { model_no: "A", item_kind: "STOCK", quantity: 1, unit_price_cents: 100000, lead_time_days: 1 }
              as: KitchenDesigner
            - call: "POST /design-build-projects/${p_cty}/layouts/${l_cty}/equipment-items"
              payload: { model_no: "A", item_kind: "STOCK", quantity: 1, unit_price_cents: 100000, lead_time_days: 1 }
              as: KitchenDesigner
            - call: "POST /design-build-projects/${p_city}/layouts/${l_city}/submit"
              payload: {}
              as: KitchenDesigner
            - call: "POST /design-build-projects/${p_cty}/layouts/${l_cty}/submit"
              payload: {}
              as: KitchenDesigner
            - call: "POST /design-build-projects/${p_city}/layouts/${l_city}/approve"
              payload: {}
              as: ProjectManager
            - call: "POST /design-build-projects/${p_cty}/layouts/${l_cty}/approve"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /design-build-projects/${p_city}/quotes"
              payload: { layout_id: "${l_city}" }
              as: SalesRep
              captures: { i_city: $.data.installation_cents }
            - call: "POST /design-build-projects/${p_cty}/quotes"
              payload: { layout_id: "${l_cty}" }
              as: SalesRep
              captures: { i_cty: $.data.installation_cents }
          assert:
            # Q=1, H=0 -> base = 250000 + 45000 = 295000; county uplift 1.10 -> 324500
            - "Quote(city).installation_cents == 295000"
            - "Quote(county).installation_cents == 324500"

      - name: startup_calc_per_item_scaling
        claim_type: correct_result
        grounds: [calculations.startup_calc]
        distinguishing_aspect: "startup_cents = 180000 + N * 30000 where N = non-CANCELLED EquipmentItems."
        test_recipe:
          setup: ["Layout APPROVED with 3 STOCK items"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { legal_name: "S3", contact_email: "s3@x.test", credit_limit_cents: 100000000 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /design-build-projects"
              payload: { customer_id: "${cid}", project_name: "S3", site_address: "C", health_jurisdiction: "CITY_HEALTH" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts"
              payload: { layout_label: "R", drawing_ref: "D3" }
              as: KitchenDesigner
              captures: { lid: $.data.id }
            - call: "POST /design-build-projects/${pid}/layouts/${lid}/equipment-items"
              payload: { model_no: "A", item_kind: "STOCK", quantity: 1, unit_price_cents: 100000, lead_time_days: 1 }
