            - "after the reversal Member.${m_id}.points_lifetime_earned == 3000 and Member.${m_id}.club_tier == BASE with redeemable_points == 3000 (no retention floor)"
            - "the downgrade is applied on the current lifetime value, so the SILVER floor is no longer subtracted"
            - "Member.${m_id}.points_balance == 3000 after the reversal, matching lifetime exactly because no redemption ever occurred"

      - name: trade_in_credit_boundary_at_and_above_the_penalty_round
        claim_type: precision
