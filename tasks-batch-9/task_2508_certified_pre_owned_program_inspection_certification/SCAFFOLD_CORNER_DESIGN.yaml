            - "trigger call 3 returns 200 with status COMPLETED, actual_cost_cents 50000 and reimbursable_cents 30000"
            - "trigger call 4 returns 200 with status WAIVED, actual_cost_cents null and reimbursable_cents 0"
            - "trigger call 5 shows the two rows closed by different roles, and Inspection.${i1}.total_reimbursable_cents == 30000"

      - name: segregation_of_duties_blocks_the_inspections_own_technician_forbidden
        claim_type: Segregation of duties
        grounds:
          - rbac.role_model.segregation_of_duties
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.ReconditioningItem.REQUIRED_to_COMPLETED
        distinguishing_aspect: |
          Same role, same endpoint, same resolution - only the X-User-ID differs. The technician who
          recorded the failure cannot certify its own repair, so the refusal is a 409 at the transition
          precondition rather than the 403 of a role error, and it must not be short-circuited by the
          fact that the actor holds the right role. The blocked item then keeps the whole submission
          shut, which is how the SoD rule acquires teeth.
        test_recipe:
          setup:
            - "Dealer D1 with technicians T1 and T2; published MPI-172 with P1 and reconditioning-eligible B1; inspection I1 by T1 with B1 failed."
