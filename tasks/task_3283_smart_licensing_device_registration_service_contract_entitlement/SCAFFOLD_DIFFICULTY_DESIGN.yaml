scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_reconciled_consumption_on_pool
        grounds:
          - "calculations.pool_consumed_quantity"
          - "entities.LicensePool.fields.consumed_quantity"
        distinguishing_aspect: "Same pool: before a usage sync the provisional variant counts assignments (3); after an ACCEPTED report line of 5 the reconciled variant reports 5 — identical DB rows, different consumed_quantity by variant."
        test_recipe:
          setup:
            - "Account A ACTIVE with virtual account VA and pool P (PERPETUAL, purchased 10)"
            - "Device D REGISTERED in VA with assignment of 3 units against P; no usage report yet"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A1", display_name: "Acct One" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "LIC-X", license_model: "PERPETUAL", feature_tier: "ESSENTIALS", purchased_quantity: 10 }
              as: PlatformAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-1", product_family: "PF-1" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/license-assignments"
              payload: { device_id: "${dev_id}", license_pool_id: "${pool_id}", quantity: 3 }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/license-pools/${pool_id}"
              payload: {}
              as: PlatformAdmin
              captures: { consumed_before: $.data.consumed_quantity }
            - call: "POST /api/devices/${dev_id}/usage-reports"
              payload: { reported_at: "2026-09-02T00:00:00Z", lines: [ { license_pool_id: "${pool_id}", quantity: 5 } ] }
              as: PlatformAdmin
            - call: "GET /api/license-pools/${pool_id}"
              payload: {}
              as: PlatformAdmin
              captures: { consumed_after: $.data.consumed_quantity }
          assert:
            - "consumed_before == 3"
            - "consumed_after == 5"
      - name: subscription_vs_perpetual_tier_upgrade_proration
        grounds:
          - "calculations.tier_upgrade_proration"
        distinguishing_aspect: "Same upgrade action (ESSENTIALS -> ADVANTAGE): a SUBSCRIPTION pool gains prorated credit units, a PERPETUAL pool gains zero — different entity domains of license_model produce different purchased_quantity deltas."
        test_recipe:
          setup:
            - "Account A ACTIVE, VA1, SUBSCRIPTION pool S purchased 10 created at clock default 2026-09-01T00:00:00Z expiring 2027-09-01T00:00:00Z; PERPETUAL pool P purchased 10"
            - "Clock advanced to 2026-10-01T00:00:00Z (30 days elapsed of 365-day term: days_total=365, days_left=335)"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A2", display_name: "Acct Two" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "SUB-1", license_model: "SUBSCRIPTION", feature_tier: "ESSENTIALS", purchased_quantity: 10, subscription_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_pool_id: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "PER-1", license_model: "PERPETUAL", feature_tier: "ESSENTIALS", purchased_quantity: 10 }
              as: PlatformAdmin
              captures: { per_pool_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/license-pools/${sub_pool_id}/tier-upgrade"
              payload: { new_tier: "ADVANTAGE" }
              as: PlatformAdmin
              captures: { sub_after: $.data.purchased_quantity }
            - call: "POST /api/license-pools/${per_pool_id}/tier-upgrade"
              payload: { new_tier: "ADVANTAGE" }
              as: PlatformAdmin
              captures: { per_after: $.data.purchased_quantity }
          assert:
            - "sub_after == 19  (10 + floor(10 * 335/365) = 10 + 9)"
            - "per_after == 10"
            - "LicensePool.${sub_pool_id}.feature_tier == ADVANTAGE and LicensePool.${per_pool_id}.feature_tier == ADVANTAGE"
  - rule_id: combinatorial_formula
    instances:
      - name: rma_sla_branch_conditional_formula
        grounds:
          - "calculations.rma_ship_by"
          - "state_machines.RmaCase.OPENED_to_REPLACEMENT_SHIPPED"
        distinguishing_aspect: "Mode (a): >=3 inputs (service_level, opened_at, ship time) with conditional branches — ADVANCE_4H yields ship_by opened+4h, ADVANCE_NBD yields opened+24h, DEPOT_RETURN yields null and forbids ship-from-OPENED."
        test_recipe:
          setup:
            - "Account ACTIVE; VA; device D REGISTERED; contract C4 with service_level ADVANCE_4H, support_tier FULL, window 2026-09-01 to 2027-09-01; coverage attached to D"
            - "Clock at 2026-09-10T00:00:00Z when RMA opened -> ship_by must equal 2026-09-10T04:00:00Z"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A3", display_name: "Acct Three" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-3", product_family: "PF-3" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/service-contracts"
              payload: { smart_account_id: "${sa_id}", contract_number: "C-4H", service_level: "ADVANCE_4H", support_tier: "FULL", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contract-coverages"
              payload: { service_contract_id: "${ctr_id}", device_id: "${dev_id}" }
              as: PlatformAdmin
              captures: { cov_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/rma-cases"
              payload: { contract_coverage_id: "${cov_id}", failure_description: "psu dead" }
              as: PlatformAdmin
              captures: { rma_id: $.data.id, ship_by: $.data.ship_by, opened_at: $.data.opened_at }
          assert:
            - "opened_at == 2026-09-10T00:00:00Z"
            - "ship_by == 2026-09-10T04:00:00Z"
            - "RmaCase.${rma_id}.sla_breached == false"
      - name: tier_proration_rounding_order
        grounds:
          - "calculations.tier_upgrade_proration"
        distinguishing_aspect: "Mode (b): nested rounding with pinned order — round DOWN exactly once at the end; e.g. 7 units with days_left/days_total = 100/365 gives floor(7*100/365)=1 (not round(1.917)=2, and not per-step rounding)."
        test_recipe:
          setup:
            - "SUBSCRIPTION pool purchased 7 created at 2026-09-01T00:00:00Z expiring 2027-09-01T00:00:00Z (days_total=365)"
            - "Clock advanced to 2027-05-24T00:00:00Z -> days_left = 100"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A4", display_name: "Acct Four" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "SUB-4", license_model: "SUBSCRIPTION", feature_tier: "ESSENTIALS", purchased_quantity: 7, subscription_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-24T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/license-pools/${pool_id}/tier-upgrade"
              payload: { new_tier: "PREMIER" }
              as: PlatformAdmin
              captures: { after_qty: $.data.purchased_quantity }
          assert:
            - "after_qty == 8  (7 + floor(7 * 100/365) = 7 + floor(1.9178) = 7 + 1)"
  - rule_id: non_linear_state_machine
    instances:
      - name: device_registration_cycle_loop
        grounds:
          - "state_machines.Device.REGISTERED_to_DEREGISTERED"
        distinguishing_aspect: "Device machine is cyclic: REGISTERED -> DEREGISTERED -> REGISTERED again (re-registration), distinct from any linear pipeline; a second activation after deregister succeeds and refreshes registered_at."
        test_recipe:
          setup:
            - "Account ACTIVE, VA ACTIVE, device D in PENDING, clock at 2026-09-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A5", display_name: "Acct Five" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-5", product_family: "PF-5" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { reg1: $.data.registered_at }
            - call: "POST /api/devices/${dev_id}/deregister"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { reg2: $.data.registered_at, state2: $.data.registration_state }
          assert:
            - "reg1 == 2026-09-05T00:00:00Z"
            - "state2 == REGISTERED"
            - "reg2 == 2026-09-06T00:00:00Z"
      - name: rma_branching_fork_by_service_level
        grounds:
          - "state_machines.RmaCase.OPENED_to_DEFECTIVE_RETURNED"
          - "state_machines.RmaCase.OPENED_to_REPLACEMENT_SHIPPED"
        distinguishing_aspect: "RmaCase is a branching fork machine: from OPENED the DEPOT_RETURN branch goes OPENED->DEFECTIVE_RETURNED->REPLACEMENT_SHIPPED while ADVANCE_* goes OPENED->REPLACEMENT_SHIPPED->REPLACEMENT_DELIVERED->DEFECTIVE_RETURNED; the two branches have divergent side-effect sets (ship_by SLA vs depot window SLA)."
        test_recipe:
          setup:
            - "Two devices D1 (contract DEPOT_RETURN) and D2 (contract ADVANCE_NBD), each with ACTIVE coverage; both RMAs opened"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A6", display_name: "Acct Six" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-6A", product_family: "PF-6" }
              as: PlatformAdmin
              captures: { dev1: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-6B", product_family: "PF-6" }
              as: PlatformAdmin
              captures: { dev2: $.data.id }
            - call: "POST /api/devices/${dev1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/devices/${dev2}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/service-contracts"
              payload: { smart_account_id: "${sa_id}", contract_number: "C-DEPOT", service_level: "DEPOT_RETURN", support_tier: "FULL", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/service-contracts"
              payload: { smart_account_id: "${sa_id}", contract_number: "C-NBD", service_level: "ADVANCE_NBD", support_tier: "FULL", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /api/contract-coverages"
              payload: { service_contract_id: "${c1}", device_id: "${dev1}" }
              as: PlatformAdmin
              captures: { cov1: $.data.id }
            - call: "POST /api/contract-coverages"
              payload: { service_contract_id: "${c2}", device_id: "${dev2}" }
              as: PlatformAdmin
              captures: { cov2: $.data.id }
            - call: "POST /api/rma-cases"
              payload: { contract_coverage_id: "${cov1}", failure_description: "dead" }
              as: PlatformAdmin
              captures: { rma1: $.data.id }
            - call: "POST /api/rma-cases"
              payload: { contract_coverage_id: "${cov2}", failure_description: "dead" }
              as: PlatformAdmin
              captures: { rma2: $.data.id }
          trigger:
            - call: "POST /api/rma-cases/${rma1}/receive-defective"
              payload: {}
              as: LogisticsAgent
              captures: { rma1_state: $.data.status }
            - call: "POST /api/rma-cases/${rma2}/ship-replacement"
              payload: {}
              as: LogisticsAgent
              captures: { rma2_state: $.data.status, rma2_ship_by: $.data.ship_by }
          assert:
            - "rma1_state == DEFECTIVE_RETURNED (depot branch: receive first)"
            - "rma2_state == REPLACEMENT_SHIPPED (advance branch: ship first)"
            - "RmaCase.${rma1}.ship_by is null (depot has no advance ship SLA)"
            - "rma2_ship_by == 2026-09-02T00:00:00Z (opened at default clock 2026-09-01T00:00:00Z + 86400s)"
  - rule_id: transitive_cascade
    instances:
      - name: assignment_release_cascades_pool_to_account_posture
        grounds:
          - "state_machines.DeviceLicenseAssignment.ACTIVE_to_RELEASED"
          - "state_machines.LicensePool.IN_GRACE_to_COMPLIANT"
        distinguishing_aspect: "Depth-3 chain: releasing the assignment mutates LicensePool.consumed_quantity; that mutation flips pool compliance IN_GRACE->COMPLIANT (writes ComplianceEvent); that flip recomputes SmartAccount.compliance_posture GRACE->COMPLIANT — each link caused by the previous one."
        test_recipe:
          setup:
            - "Pool purchased 1; assignment A1 quantity 2 makes pool IN_GRACE (consumed 2 > 1); account posture GRACE"
            - "Clock 2026-09-01 default; grace deadline 2026-11-30"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A7", display_name: "Acct Seven" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va_id}", sku: "LIC-7", license_model: "PERPETUAL", feature_tier: "ESSENTIALS", purchased_quantity: 1 }
              as: PlatformAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-7", product_family: "PF-7" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/license-assignments"
              payload: { device_id: "${dev_id}", license_pool_id: "${pool_id}", quantity: 2 }
              as: PlatformAdmin
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /api/license-assignments/${asg_id}/release"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/license-pools/${pool_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pool_state: $.data.compliance_state, pool_consumed: $.data.consumed_quantity }
            - call: "GET /api/smart-accounts/${sa_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acct_posture: $.data.compliance_posture }
          assert:
            - "pool_consumed == 0"
            - "pool_state == COMPLIANT"
            - "acct_posture == COMPLIANT"
            - "LicensePool.${pool_id}.grace_deadline is null"
      - name: account_close_cascades_contract_voids_coverage
        grounds:
          - "state_machines.SmartAccount.ACTIVE_to_CLOSED"
          - "state_machines.ServiceContract.ACTIVE_to_CANCELLED"
          - "state_machines.ContractCoverage.ACTIVE_to_VOIDED"
        distinguishing_aspect: "Depth-3 chain from a different trigger: closing the SmartAccount cancels the ServiceContract; the contract's cancellation itself VOIDs its ACTIVE ContractCoverage rows (each VOID blocking future RMA creation) — contract mutation caused by account mutation, coverage mutation caused by contract mutation."
        test_recipe:
          setup:
            - "Account with VA, DEREGISTERED device (no open RMA, no pending transfers), ACTIVE contract with ACTIVE coverage on the device"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A8", display_name: "Acct Eight" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-8", product_family: "PF-8" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/devices/${dev_id}/deregister"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/service-contracts"
              payload: { smart_account_id: "${sa_id}", contract_number: "C-8", service_level: "ADVANCE_NBD", support_tier: "FULL", start_date: "2026-09-01T00:00:00Z", end_date: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /api/contract-coverages"
              payload: { service_contract_id: "${ctr_id}", device_id: "${dev_id}" }
              as: PlatformAdmin
              captures: { cov_id: $.data.id }
          trigger:
            - call: "POST /api/smart-accounts/${sa_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { acct_status: $.data.status }
            - call: "GET /api/service-contracts/${ctr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ctr_status: $.data.status }
            - call: "GET /api/contract-coverages/${cov_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cov_status: $.data.status }
            - call: "GET /api/virtual-accounts/${va_id}"
              payload: {}
              as: PlatformAdmin
              captures: { va_status: $.data.status }
          assert:
            - "acct_status == CLOSED"
            - "ctr_status == CANCELLED"
            - "cov_status == VOIDED"
            - "va_status == ARCHIVED"
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_device_activate
        grounds:
          - "validations[priority=5]"
          - "validations[priority=8]"
        distinguishing_aspect: "Pair state(5) vs business_safety(8): activating a RETIRED device of an END_OF_LIFE family violates both — the state error ERR_INVALID_STATE (priority 5) MUST win over ERR_PRODUCT_END_OF_LIFE (priority 8)."
        test_recipe:
          setup:
            - "Device D registered, deregistered, then RETIRED; END_OF_LIFE milestone for PF-9 effective 2026-09-01 (in effect)"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A9", display_name: "Acct Nine" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va_id: $.data.id }
            - call: "POST /api/devices"
              payload: { virtual_account_id: "${va_id}", serial_number: "SN-9", product_family: "PF-9" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/devices/${dev_id}/deregister"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/devices/${dev_id}/retire"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/lifecycle-milestones"
              payload: { product_family: "PF-9", milestone_type: "END_OF_LIFE", effective_date: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/devices/${dev_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "err == ERR_INVALID_STATE"
      - name: business_referential_vs_business_temporal_on_usage_report
        grounds:
          - "validations[priority=12]"
          - "validations[priority=13]"
        distinguishing_aspect: "Pair business_referential(12) vs business_temporal(13): a usage report that is BOTH stale (reported_at before last accepted) AND references a foreign virtual account's pool fails both — ERR_REPORT_POOL_MISMATCH (priority 12) MUST win over ERR_STALE_REPORT (priority 13)."
        test_recipe:
          setup:
            - "Device D in VA1 with an accepted report at 2026-09-10; pool PX lives in a DIFFERENT virtual account VA2 of the same account"
          setup_api_calls:
            - call: "POST /api/smart-accounts"
              payload: { account_ref: "A10", display_name: "Acct Ten" }
              as: PlatformAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA1" }
              as: PlatformAdmin
              captures: { va1: $.data.id }
            - call: "POST /api/virtual-accounts"
              payload: { smart_account_id: "${sa_id}", name: "VA2" }
              as: PlatformAdmin
              captures: { va2: $.data.id }
            - call: "POST /api/license-pools"
              payload: { virtual_account_id: "${va1}", sku: "P-IN", license_model: "PERPETUAL", feature_tier: "ESSENTIALS", purchased_quantity: 10 }
              as: PlatformAdmin
