        claim_type: violation_to_error
        grounds:
          - validations[24]
          - errors.ERR_RADIUS_RESTRICTION_CONFLICT
          - entities.Lease.fields.radius_restriction_miles
        distinguishing_aspect: "The incumbent's radius restriction blocks an entrant whose tenant shares its primary_specialty even though the entrant claims no exclusive of its own and the incumbent holds no exclusive_use_specialty — and an entrant of a different specialty executes into the same building unaffected, so the refusal is keyed on specialty identity plus a non-null radius and not on exclusivity."
