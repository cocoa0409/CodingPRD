              payload: { program_id: "${prog_id}", version_label: "v2.0", retention_days: 45, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-2"
              captures: { pol2_id: $.data.id }
