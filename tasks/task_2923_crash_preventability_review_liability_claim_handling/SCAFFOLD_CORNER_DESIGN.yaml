          assert:
            - "${out0} == 2500000 and ${exp0} == 2500000"
            - "${settled} == 925001, ${alae} == 74000 == round_half_up(925,001 * 0.08) (the LOW ALAE tier, since 925,001 < 5,000,000) and ${total} == 999001 with ${dm_status} == SETTLED"
            - "${sd_status} == READY_TO_PURSUE and ${base} == 999001 == indemnity 925,001 + ALAE 74,000, frozen by the cascade"
            - "${max} == 499501 — round_half_up(999,001 * 50 / 100) on the exact half cent 499,500.5; banker's rounding would give 499,500 and truncation 499,500"
            - "${e_recovery} == ERR_RECOVERY_EXCEEDS_BASE with HTTP 422 for 499,502, one cent above the ceiling, and the row stays READY_TO_PURSUE"
            - "${sd_final} == RECOVERED with ${recovered} == 499501 and ${resolved_at} == 2026-08-01T00:00:00Z"
            - "${ind} == 925001, ${alae_paid} == 74000, ${out1} == 1500999 and ${subro} == 499501"
            - "${incurred} == 2000499 == 925,001 + 74,000 + 1,500,999 - 499,501, while ${exp1} == 2500000 is unchanged — a recovery is a receipt, not a change in exposure"

