# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3457_watch_warning_issuance_polygon_definition_dissemination
#
# Breadth probe over the §1.1–§1.7 surface. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: office_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds: [entities.ForecastOffice, endpoints.POST_/alerts/offices]
        distinguishing_aspect: "An office created without area_method gets PLANAR, performance_band SATISFACTORY, version 1, and system-stamped id/created_at/updated_at — the computed band is never client-supplied."
        test_recipe:
          setup: ["Empty database; logical clock at the startup default 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alerts/offices"
              payload: { office_code: "KCRN", name: "Corner Office", region: "WEST" }
              as: PlatformAdmin
              captures: { oc_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "ForecastOffice.${oc_id}.area_method == PLANAR and performance_band == SATISFACTORY and last_statistic_at is null"
            - "ForecastOffice.${oc_id}.version == 1 and id, created_at, updated_at are non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: product_get_roundtrips_stored_fields
        claim_type: Retrieval
        grounds: [entities.Product, "endpoints.GET_/alerts/products/{id}"]
        distinguishing_aspect: "Every stored Product field round-trips through GET: the input zone_ids, the echo of computed resolved_zone_ids, coordination_required false for an own-CWA SEVERE watch, and null supersedes fields."
        test_recipe:
          setup: ["One office, one zone ZR in it, one forecaster; the created product is a zone-based WINTER_STORM watch."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KGET", name: "Get Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { g_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZGT1", name: "Get Zone", office_id: "${g_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "MEDIUM", coastal: false }
              as: PlatformAdmin
              captures: { g_zone: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${g_off}", full_name: "Gina Get", employee_code: "EMP-GT", level: "JOURNEYMAN" }
              as: PlatformAdmin
              captures: { g_fc: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "WINTER_STORM", issuing_office_id: "${g_off}", zone_ids: ["${g_zone}"], effective_from: "2026-09-02T00:00:00Z", expires_at: "2026-09-02T12:00:00Z" }
              as: Forecaster
              as_user_id: "${g_fc}"
              captures: { g_prod: $.data.id }
          trigger:
            - call: "GET /alerts/products/${g_prod}"
              payload: {}
              as: VerificationAnalyst
              as_user_id: "va-1"
          assert:
            - "the response status is 200"
            - "Product.${g_prod}.product_level == WATCH and hazard_type == WINTER_STORM and status == DRAFT and version == 1"
            - "Product.${g_prod}.zone_ids == [${g_zone}] and resolved_zone_ids == [${g_zone}]"
            - "Product.${g_prod}.coordination_required == false and supersedes_product_id is null and issued_at is null"
            - "Product.${g_prod}.damage_threat == NONE and wea_360 == false (no storm linked)"

      - name: products_list_paginates_and_filters
        claim_type: Listing
        grounds: [endpoints.GET_/alerts/products, response_envelope.pagination_defaults]
        distinguishing_aspect: "With three DRAFT products on one office, limit=2 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; hazard_type=WINTER_STORM filters to the two winter watches."
        test_recipe:
          setup: ["One office, one zone, one forecaster; three DRAFT products: two WINTER_STORM watches and one SEVERE_THUNDERSTORM watch."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KLST", name: "List Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { l_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZLS1", name: "List Zone", office_id: "${l_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { l_zone: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${l_off}", full_name: "Liam List", employee_code: "EMP-LS", level: "SENIOR" }
              as: PlatformAdmin
              captures: { l_fc: $.data.id }
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "WINTER_STORM", issuing_office_id: "${l_off}", zone_ids: ["${l_zone}"], effective_from: "2026-09-02T00:00:00Z", expires_at: "2026-09-02T06:00:00Z" }
              as: Forecaster
              as_user_id: "${l_fc}"
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "WINTER_STORM", issuing_office_id: "${l_off}", zone_ids: ["${l_zone}"], effective_from: "2026-09-02T06:00:00Z", expires_at: "2026-09-02T12:00:00Z" }
              as: Forecaster
              as_user_id: "${l_fc}"
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${l_off}", zone_ids: ["${l_zone}"], effective_from: "2026-09-02T00:00:00Z", expires_at: "2026-09-02T06:00:00Z" }
              as: Forecaster
              as_user_id: "${l_fc}"
          trigger:
            - call: "GET /alerts/products"
              payload: { issuing_office_id: "${l_off}", limit: 2, offset: 0 }
              as: Forecaster
              as_user_id: "${l_fc}"
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /alerts/products?issuing_office_id=...&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /alerts/products?issuing_office_id=...&hazard_type=WINTER_STORM returns 2 rows; hazard_type=SEVERE_THUNDERSTORM returns 1 row"
            - "GET /alerts/products?issuing_office_id=...&status=ISSUED returns 0 rows (all three are DRAFT)"
            - "omitting limit and offset applies the envelope defaults limit=10, offset=0"

      - name: product_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["endpoints.GET_/alerts/products/{id}", errors.ERR_PRODUCT_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unallocated UUID produces the entity-specific 404 ERR_PRODUCT_NOT_FOUND, and the error envelope carries error_id plus message under response_type error."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /alerts/products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: VerificationAnalyst
              as_user_id: "va-1"
              captures: { nf_err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PRODUCT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: product_create_missing_expires_at_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Product.fields.expires_at, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "expires_at is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the schema check, before any state or business rule runs."
        test_recipe:
          setup: ["One office, one zone, one forecaster."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KREQ", name: "Req Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { q_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZRQ1", name: "Req Zone", office_id: "${q_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { q_zone: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${q_off}", full_name: "Quinn Req", employee_code: "EMP-RQ", level: "SENIOR" }
              as: PlatformAdmin
              captures: { q_fc: $.data.id }
          trigger:
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "WINTER_STORM", issuing_office_id: "${q_off}", zone_ids: ["${q_zone}"] }
              as: Forecaster
              as_user_id: "${q_fc}"
              captures: { q_err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /alerts/products?issuing_office_id=${q_off} returns 0 rows"

      - name: product_create_computed_field_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Product.fields.status, entities.Product.fields.damage_threat]
        distinguishing_aspect: "Client-supplied status, damage_threat, verified_event_count and resolved_zone_ids are ignored at creation: the product is born DRAFT with damage_threat NONE and verified_event_count 0 regardless of what the payload claimed."
        test_recipe:
          setup: ["One office, one zone, one forecaster."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KCMP", name: "Comp Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { m_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZCM1", name: "Comp Zone", office_id: "${m_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "URBAN", coastal: false }
              as: PlatformAdmin
              captures: { m_zone: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${m_off}", full_name: "Mona Comp", employee_code: "EMP-CM", level: "SENIOR" }
              as: PlatformAdmin
              captures: { m_fc: $.data.id }
          trigger:
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "WINTER_STORM", issuing_office_id: "${m_off}", zone_ids: ["${m_zone}"], expires_at: "2026-09-02T12:00:00Z", status: "ISSUED", damage_threat: "CATASTROPHIC", verified_event_count: 99 }
              as: Forecaster
              as_user_id: "${m_fc}"
              captures: { m_prod: $.data.id }
          assert:
            - "the response status is 201"
            - "Product.${m_prod}.status == DRAFT (client-supplied ISSUED ignored)"
            - "Product.${m_prod}.damage_threat == NONE and wea_360 == false (client-supplied CATASTROPHIC ignored)"
            - "Product.${m_prod}.verified_event_count == 0 and verification_status == UNVERIFIED"

      - name: zone_create_with_unknown_office_returns_office_not_found
        claim_type: Parent Relationships
        grounds: [entities.CountyZone.fields.office_id, errors.ERR_OFFICE_NOT_FOUND]
        distinguishing_aspect: "The office_id foreign key is validated at zone creation: an unallocated office id yields 404 ERR_OFFICE_NOT_FOUND, not a dangling zone row."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZNF1", name: "Nowhere Zone", office_id: "00000000-0000-4000-8000-000000000000", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { z_err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_OFFICE_NOT_FOUND"

      - name: watch_create_with_polygon_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Product.fields.polygon, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "Polygon geometry is forbidden on zone-based levels: a WATCH carrying a polygon is a 400 ERR_INVALID_REQUEST field-combination violation, while a WARNING carrying zone_ids fails the same way."
        test_recipe:
          setup: ["One office, one zone, one forecaster, one SEVERE storm (wind 60) for the warning attempt."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KTYP", name: "Type Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { t_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZTY1", name: "Type Zone", office_id: "${t_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { t_zone: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${t_off}", full_name: "Ty Type", employee_code: "EMP-TY", level: "SENIOR" }
              as: PlatformAdmin
              captures: { t_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${t_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${t_fc}"
              captures: { t_storm: $.data.id }
          trigger:
            - call: "POST /alerts/products"
              payload: { product_level: "WATCH", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${t_off}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 } ] }, expires_at: "2026-09-02T12:00:00Z" }
              as: Forecaster
              as_user_id: "${t_fc}"
              captures: { t_err1: $.data.error_id }
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${t_off}", storm_event_id: "${t_storm}", zone_ids: ["${t_zone}"], expires_at: "2026-09-01T00:45:00Z" }
              as: Forecaster
              as_user_id: "${t_fc}"
              captures: { t_err2: $.data.error_id }
          assert:
            - "the WATCH-with-polygon attempt is 400 ERR_INVALID_REQUEST"
            - "the WARNING-with-zone_ids attempt is 400 ERR_INVALID_REQUEST (WARNING requires polygon)"
            - "GET /alerts/products?issuing_office_id=${t_off} returns 0 rows"

      - name: polygon_area_dual_variant_corner
        claim_type: Computed Fields
        grounds: [calculations.polygon_area_sq_km]
        excluded_because:
          difficulty_instance: polygon_area_planar_vs_geodetic_same_vertices
          rationale: "PLANAR vs GEODETIC area divergence is asserted with exact literals in the named §1.8 instance."

  # ===========================================================================
  - section: state_machines
    instances:
      - name: product_created_in_initial_state_draft
        claim_type: Initial State
        grounds: [state_machines.Product]
        distinguishing_aspect: "A freshly created product is DRAFT with version 1 and no issuance timestamps, regardless of level (here an OUTLOOK with a far-future window)."
        test_recipe:
          setup: ["One office, one zone, one forecaster."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KINT", name: "Init Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { n_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZIN2", name: "Init Zone", office_id: "${n_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
              captures: { n_zone: $.data.id }
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${n_off}", full_name: "Nia Init", employee_code: "EMP-IN", level: "JOURNEYMAN" }
              as: PlatformAdmin
              captures: { n_fc: $.data.id }
          trigger:
            - call: "POST /alerts/products"
              payload: { product_level: "OUTLOOK", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${n_off}", zone_ids: ["${n_zone}"], effective_from: "2026-09-03T00:00:00Z", expires_at: "2026-09-04T00:00:00Z" }
              as: Forecaster
              as_user_id: "${n_fc}"
              captures: { n_prod: $.data.id }
          assert:
            - "Product.${n_prod}.status == DRAFT and version == 1"
            - "issued_at, cancelled_at, superseded_at, expired_at and window_end are all null"
            - "Product.${n_prod}.coordination_required == false (own-CWA zone, non-HURRICANE hazard)"

      - name: cancel_of_cancelled_product_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Product.ISSUED_to_CANCELLED, errors.ERR_INVALID_PRODUCT_STATE]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel is rejected 409 ERR_INVALID_PRODUCT_STATE and cancelled_at keeps its first value."
        test_recipe:
          setup: ["Office, zone, SEVERE storm wind 60; warning issued at 10:00 then cancelled at 10:05."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KTRM", name: "Term Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { x_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZTM1", name: "Term Zone", office_id: "${x_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${x_off}", full_name: "Tess Term", employee_code: "EMP-TM", level: "SENIOR" }
              as: PlatformAdmin
              captures: { x_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${x_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${x_fc}"
              captures: { x_storm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${x_off}", storm_event_id: "${x_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T10:45:00Z" }
              as: Forecaster
              as_user_id: "${x_fc}"
              captures: { x_w: $.data.id, x_wv: $.data.version }
            - call: "POST /alerts/products/${x_w}/issue"
              payload: { expected_product_version: "${x_wv}" }
              as: Forecaster
              as_user_id: "${x_fc}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:05:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products/${x_w}/cancel"
              payload: {}
              as: Forecaster
              as_user_id: "${x_fc}"
          trigger:
            - call: "POST /alerts/products/${x_w}/cancel"
              payload: {}
              as: Forecaster
              as_user_id: "${x_fc}"
              captures: { x_err: $.data.error_id }
          assert:
            - "the second cancel is 409 with error_id == ERR_INVALID_PRODUCT_STATE"
            - "Product.${x_w}.cancelled_at == 2026-09-01T10:05:00Z (first cancel's timestamp is preserved)"

      - name: clock_advance_expires_warning_at_exact_expiry_instant
        claim_type: Side Effect Execution
        grounds: [state_machines.Product.ISSUED_to_EXPIRED, endpoints.POST_/_clock/set_current_utc]
        distinguishing_aspect: "Expiry fires when the clock reaches expires_at exactly (>= semantics): at 09:59:59 the product is still ISSUED, at 10:00:00 it is EXPIRED with expired_at == expires_at and window_end closed."
        test_recipe:
          setup: ["Office, zone, SEVERE storm wind 60; warning issued 09:30 with expires_at 10:00:00."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KEXP", name: "Expiry Office", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { y_off: $.data.id }
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZEX1", name: "Expiry Zone", office_id: "${y_off}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
              as: PlatformAdmin
            - call: "POST /alerts/forecasters"
              payload: { office_id: "${y_off}", full_name: "Yara Exp", employee_code: "EMP-EX", level: "SENIOR" }
              as: PlatformAdmin
              captures: { y_fc: $.data.id }
            - call: "POST /alerts/storm-events"
              payload: { office_id: "${y_off}", hazard_type: "SEVERE_THUNDERSTORM", max_wind_mph: 60 }
              as: Forecaster
              as_user_id: "${y_fc}"
              captures: { y_storm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:30:00Z" }
              as: PlatformAdmin
            - call: "POST /alerts/products"
              payload: { product_level: "WARNING", hazard_type: "SEVERE_THUNDERSTORM", issuing_office_id: "${y_off}", storm_event_id: "${y_storm}", polygon: { vertices: [ { lat: 0.0, lon: 0.0 }, { lat: 0.0, lon: 0.1 }, { lat: 0.1, lon: 0.1 }, { lat: 0.1, lon: 0.0 } ] }, expires_at: "2026-09-01T10:00:00Z" }
              as: Forecaster
              as_user_id: "${y_fc}"
              captures: { y_w: $.data.id, y_wv: $.data.version }
            - call: "POST /alerts/products/${y_w}/issue"
              payload: { expected_product_version: "${y_wv}" }
              as: Forecaster
              as_user_id: "${y_fc}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:59:59Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
          assert:
            - "at 09:59:59 the product is still ISSUED"
            - "at exactly 2026-09-01T10:00:00Z the product is EXPIRED with expired_at == 2026-09-01T10:00:00Z == expires_at"
            - "Product.${y_w}.window_end == 2026-09-01T10:00:00Z"

      - name: coordination_deadline_expiry_reverts_product_and_stamps_deadline
        claim_type: Side Effect Execution
        grounds: [state_machines.CoordinationRequest.REQUESTED_to_EXPIRED, state_machines.Product.PENDING_COORDINATION_to_DRAFT, entities.CoordinationRequest.fields.deadline_at]
        distinguishing_aspect: "A REQUESTED coordination request expires at requested_at + agreement timeout (a literal 15 minutes later); with no requests outstanding and none acknowledged, the product auto-reverts to DRAFT without any forecaster action."
        test_recipe:
          setup: ["Offices A and B with a SEVERE agreement (timeout 15); zones ZA in A and ZB in B; a watch over [ZA, ZB] submitted for coordination at 09:00."]
          setup_api_calls:
            - call: "POST /alerts/offices"
              payload: { office_code: "KDLA", name: "Deadline A", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { dl_off_a: $.data.id }
            - call: "POST /alerts/offices"
              payload: { office_code: "KDLB", name: "Deadline B", region: "WEST", area_method: "PLANAR" }
              as: PlatformAdmin
              captures: { dl_off_b: $.data.id }
            - call: "POST /alerts/neighbor-agreements"
              payload: { office_a_id: "${dl_off_a}", office_b_id: "${dl_off_b}", hazard_types: ["SEVERE_THUNDERSTORM"], coordination_timeout_minutes: 15 }
              as: PlatformAdmin
            - call: "POST /alerts/zones"
              payload: { zone_code: "ZDLA", name: "Deadline Zone A", office_id: "${dl_off_a}", lat_min: 0.0, lat_max: 0.1, lon_min: 0.0, lon_max: 0.1, surveyed_area_sq_km: 123.21, population_tier: "LOW", coastal: false }
