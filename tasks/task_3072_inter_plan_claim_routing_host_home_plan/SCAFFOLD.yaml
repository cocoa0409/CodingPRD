scenario: |
  Generate task much harder than expert level!

  Scenario description:
  Inter-Plan Claim Routing & Host-Home Plan Settlement (Blue Cross Blue Shield Association): member cards identifying a home plan while care is received in a host plan's territory, host plan pricing the claim at its local negotiated rate and routing it to the home plan for benefit determination, access fee and administrative charge computation between plans, provider payment by the host plan with settlement of funds between plans, eligibility and benefit inquiry routing across plan systems, national account arrangements where one plan controls the account across many territories, claim adjustment and recovery propagation across both plans, service area licensing and brand usage rules for independent licensees

domain_name: inter-plan-claim-routing
api_prefix: /v1

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Plan
    parent: null
    common_fields: true
    fields:
      - { name: plan_code, type: string, source: input, description: "Unique licensee plan code (e.g. BCBSTX); unique across all plans" }
      - { name: legal_name, type: string, source: input, description: "Legal name of the independent licensee" }
      - { name: service_area_states, type: array, source: input, description: "US state codes constituting this plan's licensed service area; non-empty" }
      - { name: brand_license_status, type: enum, source: system, description: "PENDING -> LICENSED -> SUSPENDED -> LICENSED, or -> REVOKED (terminal)" , default: PENDING }
      - { name: claims_paid_balance_cents, type: integer, source: computed, description: "Cumulative provider payments made by this plan as HOST minus recoveries applied; starts at 0" }
      - { name: fees_receivable_balance_cents, type: integer, source: computed, description: "Cumulative access fees + admin charges this plan has earned as HOST on routed claims; starts at 0" }
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: home_plan_id, type: string, source: input, description: "FK -> Plan.id; the plan identified on the member card" }
      - { name: national_account_id, type: string, source: input, description: "FK -> NationalAccount.id; null when member is not under a national account", default: null }
      - { name: member_number, type: string, source: input, description: "Member certificate number on the ID card; unique within home_plan_id" }
      - { name: full_name, type: string, source: input, description: "Member full legal name" }
      - { name: eligibility_status, type: enum, source: system, description: "ACTIVE or TERMINATED", default: ACTIVE }
  - name: NationalAccount
    parent: null
    common_fields: true
    fields:
      - { name: controlling_plan_id, type: string, source: input, description: "FK -> Plan.id; the single plan that controls this account across all territories" }
      - { name: account_name, type: string, source: input, description: "Employer group display name" }
      - { name: employer_group_id, type: string, source: input, description: "External employer identifier; combined with territory window for uniqueness" }
      - { name: territory_states, type: array, source: input, description: "States covered by this arrangement; non-empty" }
      - { name: effective_start, type: string, source: input, description: "ISO date, inclusive lower bound of the arrangement window (closed interval)" }
      - { name: effective_end, type: string, source: input, description: "ISO date, inclusive upper bound of the arrangement window (closed interval); must be >= effective_start" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACTIVE -> SUSPENDED -> ACTIVE, or ACTIVE -> TERMINATED (terminal)", default: PROPOSED }
  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> Plan.id; the HOST plan whose local negotiated rate this row records" }
      - { name: provider_npi, type: string, source: input, description: "Rendering provider NPI" }
      - { name: procedure_code, type: string, source: input, description: "Procedure/service code this rate applies to" }
      - { name: negotiated_rate_cents, type: integer, source: input, description: "Host plan negotiated allowed rate in cents; > 0" }
      - { name: effective_start, type: string, source: input, description: "ISO date, inclusive lower bound of the rate window (half-open interval [start, end))" }
      - { name: effective_end, type: string, source: input, description: "ISO date, exclusive upper bound of the rate window (half-open interval [start, end)); must be > effective_start" }
  - name: AccessFeeSchedule
    parent: null
    common_fields: true
    fields:
      - { name: home_plan_id, type: string, source: input, description: "FK -> Plan.id; plan that owes the access fee" }
      - { name: host_plan_id, type: string, source: input, description: "FK -> Plan.id; plan that earns the access fee" }
      - { name: tier1_cap_cents, type: integer, source: input, description: "Allowed-amount ceiling for the flat tier, in cents; > 0" }
      - { name: tier1_fee_cents, type: integer, source: input, description: "Flat access fee when allowed <= tier1_cap_cents (boundary inclusive)" }
      - { name: tier2_rate, type: number, source: input, description: "Percentage rate applied to the full allowed amount when allowed > tier1_cap_cents" }
      - { name: national_account_discount_pct, type: number, source: input, description: "Fraction (0..1] of the fee waived for members of an ACTIVE NationalAccount controlled by the home plan; 0 means no discount", default: 0 }
      - { name: effective_start, type: string, source: input, description: "ISO date, inclusive lower bound (closed interval [start, end])" }
      - { name: effective_end, type: string, source: input, description: "ISO date, inclusive upper bound (closed interval [start, end]); must be >= effective_start" }
  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; member who received care" }
      - { name: host_plan_id, type: string, source: input, description: "FK -> Plan.id; plan in whose territory care was received; must differ from home plan" }
      - { name: home_plan_id, type: string, source: system, description: "FK -> Plan.id; copied from Member.home_plan_id at submission" }
      - { name: national_account_id, type: string, source: system, description: "FK -> NationalAccount.id; copied from Member.national_account_id at submission (may be null)", default: null }
      - { name: provider_npi, type: string, source: input, description: "Rendering provider NPI" }
      - { name: procedure_code, type: string, source: input, description: "Procedure code billed" }
      - { name: service_date, type: string, source: input, description: "ISO date care was rendered" }
      - { name: service_state, type: string, source: input, description: "US state where care was rendered; must lie in host plan's service_area_states" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Provider billed amount in cents; > 0" }
      - { name: provisional_allowed_cents, type: integer, source: computed, description: "Allowed priced with the rate window keyed on service_date (provisional variant)" }
      - { name: priced_allowed_cents, type: integer, source: computed, description: "Allowed priced with the rate window keyed on the pricing date (final variant); populated at pricing" }
      - { name: access_fee_cents, type: integer, source: computed, description: "Access fee owed by home plan to host plan per access_fee_schedule" }
      - { name: admin_charge_cents, type: integer, source: computed, description: "Administrative charge owed by home plan to host plan" }
      - { name: provider_payment_cents, type: integer, source: computed, description: "Amount host plan paid the provider; populated at payment" }
      - { name: current_allowed_cents, type: integer, source: computed, description: "Running allowed amount after applied adjustments; equals priced_allowed_cents until an adjustment applies" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> PRICED -> ROUTED -> BENEFIT_DETERMINED -> PAID -> SETTLED, BENEFIT_DETERMINED -> DENIED, PAID -> ADJUSTMENT_PENDING -> PAID" }
  - name: Adjustment
    parent: null
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: input, description: "FK -> Claim.id; claim under adjustment" }
      - { name: supersedes_adjustment_id, type: string, source: system, description: "FK -> Adjustment.id; prior INITIATED adjustment on the same claim superseded by this creation (null when none)", default: null }
      - { name: reason, type: string, source: input, description: "Free-text reason for the adjustment" }
      - { name: delta_allowed_cents, type: integer, source: input, description: "Signed change to the claim's allowed amount; non-zero" }
      - { name: recovery_amount_cents, type: integer, source: computed, description: "Amount recovered from the home plan when delta reduces an already-paid claim; 0 otherwise" }
      - { name: status, type: enum, source: system, description: "INITIATED -> VALIDATED -> PROPAGATED -> APPLIED, INITIATED|VALIDATED -> REJECTED" }
  - name: SettlementBatch
    parent: null
    common_fields: true
    fields:
      - { name: debtor_plan_id, type: string, source: input, description: "FK -> Plan.id; HOME plan that owes funds" }
      - { name: creditor_plan_id, type: string, source: input, description: "FK -> Plan.id; HOST plan owed funds; must differ from debtor" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive start of the settlement sweep window" }
      - { name: period_end, type: string, source: input, description: "ISO date, inclusive end of the settlement sweep window; >= period_start" }
      - { name: gross_claims_total_cents, type: integer, source: computed, description: "Sum of provider payments on swept claims (gross variant basis)" }
      - { name: fees_total_cents, type: integer, source: computed, description: "Sum of access fees + admin charges on swept claims" }
      - { name: net_settlement_cents, type: integer, source: computed, description: "Amount disbursed: gross minus fees under NET variant; gross under GROSS variant; populated at finalize" }
      - { name: settlement_variant, type: enum, source: input, description: "NET (fees deducted from remittance) or GROSS (full remittance, fees settled separately)", default: NET }
      - { name: status, type: enum, source: system, description: "OPEN -> FINALIZED -> ACKNOWLEDGED -> DISBURSED -> RECONCILED, FINALIZED -> DISPUTED -> FINALIZED" }
  - name: EligibilityInquiry
    parent: null
    common_fields: true
    fields:
      - { name: inquiring_plan_id, type: string, source: input, description: "FK -> Plan.id; host plan asking for eligibility" }
      - { name: home_plan_id, type: string, source: input, description: "FK -> Plan.id; plan identified by the member card prefix" }
      - { name: member_number, type: string, source: input, description: "Member certificate number being verified" }
      - { name: answer_eligibility_status, type: enum, source: computed, description: "ACTIVE or TERMINATED as answered by the home plan; null until answered", default: null }
      - { name: status, type: enum, source: system, description: "ROUTED -> ANSWERED, ROUTED -> REJECTED" }

state_machines:
  - entity: Plan
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: LICENSED
        trigger: "POST /v1/plans/{id}/activate-license"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "Plan.brand_license_status := LICENSED"
      - from: LICENSED
        to: SUSPENDED
        trigger: "POST /v1/plans/{id}/suspend-license"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "Plan.brand_license_status := SUSPENDED; new Claim submissions routed to or hosted by this plan are rejected while SUSPENDED (existing claims continue)"
      - from: SUSPENDED
        to: LICENSED
        trigger: "POST /v1/plans/{id}/reinstate-license"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "Plan.brand_license_status := LICENSED"
      - from: LICENSED
        to: REVOKED
        trigger: "POST /v1/plans/{id}/revoke-license"
        actor: AssociationAdmin
        preconditions:
          - "No Claim hosted or owned by this plan is in a non-terminal state {RECEIVED, PRICED, ROUTED, BENEFIT_DETERMINED, ADJUSTMENT_PENDING}"
        side_effects:
          - "Plan.brand_license_status := REVOKED; all NationalAccounts controlled by this plan auto-transition ACTIVE/SUSPENDED -> TERMINATED"
  - entity: NationalAccount
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /v1/national-accounts/{id}/activate"
        actor: AssociationAdmin
        preconditions:
          - "controlling Plan.brand_license_status == LICENSED"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/national-accounts/{id}/suspend"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "Members of this account lose the national-account access-fee discount while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/national-accounts/{id}/reactivate"
        actor: AssociationAdmin
        preconditions:
          - "controlling Plan.brand_license_status == LICENSED"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /v1/national-accounts/{id}/terminate"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "NationalAccount.status := TERMINATED; Member.national_account_id unchanged (historical link retained)"
  - entity: Claim
    initial_state: RECEIVED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: RECEIVED
        to: PRICED
        trigger: "POST /v1/claims/{id}/price"
        actor: HostPlanOperator
        preconditions:
          - "claim.host_plan_id == acting HostPlanOperator's plan"
          - "a RateSchedule exists for (host_plan_id, provider_npi, procedure_code) whose half-open window covers the pricing date (see claim_pricing)"
        side_effects:
          - "Run claim_pricing: provisional_allowed_cents already set at submission; priced_allowed_cents computed now; current_allowed_cents := priced_allowed_cents"
      - from: PRICED
        to: ROUTED
        trigger: "POST /v1/claims/{id}/route"
        actor: HostPlanOperator
        preconditions:
          - "claim.host_plan_id == acting HostPlanOperator's plan"
          - "an AccessFeeSchedule exists for (home_plan_id, host_plan_id) whose closed window covers service_date (ERR_FEE_SCHEDULE_MISSING otherwise)"
        side_effects:
          - "Run access_fee_computation and admin_charge_computation; Claim.access_fee_cents and Claim.admin_charge_cents populated"
      - from: ROUTED
        to: BENEFIT_DETERMINED
        trigger: "POST /v1/claims/{id}/determine-benefit"
        actor: HomePlanOperator
        preconditions:
          - "claim.home_plan_id == acting HomePlanOperator's plan"
          - "Member.eligibility_status == ACTIVE (ERR_MEMBER_INELIGIBLE otherwise)"
        side_effects: []
      - from: ROUTED
        to: DENIED
        trigger: "POST /v1/claims/{id}/deny"
        actor: HomePlanOperator
        preconditions:
          - "claim.home_plan_id == acting HomePlanOperator's plan"
        side_effects:
          - "Claim.status := DENIED; no provider payment and no settlement line is ever generated for a DENIED claim"
      - from: BENEFIT_DETERMINED
        to: PAID
        trigger: "POST /v1/claims/{id}/pay"
        actor: HostPlanOperator
        preconditions:
          - "claim.host_plan_id == acting HostPlanOperator's plan"
        side_effects:
          - "Claim.provider_payment_cents := current_allowed_cents"
          - "host Plan.claims_paid_balance_cents += provider_payment_cents"
          - "host Plan.fees_receivable_balance_cents += access_fee_cents + admin_charge_cents"
      - from: PAID
        to: ADJUSTMENT_PENDING
        trigger: "POST /v1/claims/{id}/adjustments"
        actor: HostPlanOperator
        preconditions:
          - "claim.host_plan_id == acting HostPlanOperator's plan"
        side_effects:
          - "Adjustment created in INITIATED; any prior INITIATED Adjustment on this claim transitions INITIATED -> REJECTED (superseded) and new Adjustment.supersedes_adjustment_id records it"
      - from: ADJUSTMENT_PENDING
        to: PAID
        trigger: "POST /v1/adjustments/{id}/apply"
        actor: HostPlanOperator
        preconditions:
          - "Adjustment.status == PROPAGATED"
        side_effects:
          - "Adjustment.status := APPLIED; Claim.status := PAID"
          - "Claim.current_allowed_cents += delta_allowed_cents (floor 0)"
          - "Run recovery_computation: recovery_amount_cents := max(0, -(delta_allowed_cents)) when claim was PAID, else 0"
          - "host Plan.claims_paid_balance_cents -= recovery_amount_cents"
      - from: PAID
        to: SETTLED
        trigger: "SettlementBatch RECONCILED"
        actor: system
        preconditions:
          - "claim included in a SettlementBatch that reaches RECONCILED"
        side_effects:
          - "Claim.status := SETTLED"
  - entity: Adjustment
    initial_state: INITIATED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: INITIATED
        to: VALIDATED
        trigger: "POST /v1/adjustments/{id}/validate"
        actor: HostPlanOperator
        preconditions:
          - "parent Claim.status == ADJUSTMENT_PENDING"
        side_effects: []
      - from: VALIDATED
        to: PROPAGATED
        trigger: "POST /v1/adjustments/{id}/propagate"
        actor: HomePlanOperator
        preconditions:
          - "parent Claim.home_plan_id == acting HomePlanOperator's plan"
        side_effects:
          - "Home plan has acknowledged the adjustment; recovery becomes collectable"
      - from: PROPAGATED
        to: APPLIED
        trigger: "POST /v1/adjustments/{id}/apply"
        actor: HostPlanOperator
        preconditions: []
        side_effects:
          - "See Claim ADJUSTMENT_PENDING -> PAID transition; net settlement of the affected batch recomputed when batch is still OPEN"
      - from: INITIATED
        to: REJECTED
        trigger: "POST /v1/adjustments/{id}/reject"
        actor: HomePlanOperator
        preconditions:
          - "parent Claim.home_plan_id == acting HomePlanOperator's plan"
        side_effects:
          - "parent Claim.status reverts ADJUSTMENT_PENDING -> PAID with no balance change"
      - from: VALIDATED
        to: REJECTED
        trigger: "POST /v1/adjustments/{id}/reject"
        actor: HomePlanOperator
        preconditions:
          - "parent Claim.home_plan_id == acting HomePlanOperator's plan"
        side_effects:
          - "parent Claim.status reverts ADJUSTMENT_PENDING -> PAID with no balance change"
  - entity: SettlementBatch
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: "POST /v1/settlement-batches/{id}/finalize"
        actor: HostPlanOperator
        preconditions:
          - "batch.creditor_plan_id == acting HostPlanOperator's plan"
          - "at least one PAID claim exists in scope (ERR_EMPTY_BATCH otherwise)"
        side_effects:
          - "Sweep claims: debtor home plan, creditor host plan, status == PAID, service_date within [period_start, period_end] inclusive"
          - "gross_claims_total_cents := sum(provider_payment_cents); fees_total_cents := sum(access_fee_cents + admin_charge_cents) - sum(recovery_amount_cents of APPLIED adjustments on swept claims)"
          - "net_settlement_cents := gross_claims_total_cents - fees_total_cents when settlement_variant == NET; := gross_claims_total_cents when settlement_variant == GROSS"
      - from: FINALIZED
        to: ACKNOWLEDGED
        trigger: "POST /v1/settlement-batches/{id}/acknowledge"
        actor: HomePlanOperator
        preconditions:
          - "batch.debtor_plan_id == acting HomePlanOperator's plan"
        side_effects: []
      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /v1/settlement-batches/{id}/dispute"
        actor: HomePlanOperator
        preconditions:
          - "batch.debtor_plan_id == acting HomePlanOperator's plan"
        side_effects: []
      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /v1/settlement-batches/{id}/refinalize"
        actor: HostPlanOperator
        preconditions:
          - "batch.creditor_plan_id == acting HostPlanOperator's plan"
        side_effects:
          - "Totals recomputed with the same sweep rule as finalize; batch may cycle FINALIZED -> DISPUTED -> FINALIZED repeatedly until acknowledged"
      - from: ACKNOWLEDGED
        to: DISBURSED
        trigger: "POST /v1/settlement-batches/{id}/disburse"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "debtor Plan.fees_receivable_balance_cents unchanged; creditor Plan.fees_receivable_balance_cents -= fees_total_cents (receivables cleared) under NET variant; creditor Plan.claims_paid_balance_cents unchanged"
      - from: DISBURSED
        to: RECONCILED
        trigger: "POST /v1/settlement-batches/{id}/reconcile"
        actor: AssociationAdmin
        preconditions: []
        side_effects:
          - "Every swept Claim transitions PAID -> SETTLED"
  - entity: EligibilityInquiry
    initial_state: ROUTED
    terminal_states: [ANSWERED, REJECTED]
    transitions:
      - from: ROUTED
        to: ANSWERED
        trigger: "POST /v1/eligibility-inquiries/{id}/answer"
        actor: HomePlanOperator
        preconditions:
          - "inquiry.home_plan_id == acting HomePlanOperator's plan"
          - "a Member with member_number exists under home_plan_id (ERR_MEMBER_NOT_FOUND otherwise -> REJECTED path)"
        side_effects:
          - "answer_eligibility_status := Member.eligibility_status"
      - from: ROUTED
        to: REJECTED
        trigger: "POST /v1/eligibility-inquiries/{id}/reject"
        actor: HomePlanOperator
        preconditions:
          - "inquiry.home_plan_id == acting HomePlanOperator's plan"
        side_effects: []

concurrency_rules:
  - rule_id: adjustment-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /v1/claims/{id}/adjustments"
    occ_field: "expected_claim_version"
    description: |
      Creating an Adjustment against a Claim whose version has advanced since
      the client last observed it is rejected with ERR_STALE_VERSION. This
      captures the case where another writer has just created an adjustment
      (which legitimately supersedes the prior INITIATED one) or applied one
      (advancing PAID again), and the current writer's view of the claim is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: refinalize-stale-batch
    parent_entity: SettlementBatch
    write_endpoint: "POST /v1/settlement-batches/{id}/refinalize"
    occ_field: "expected_settlement_batch_version"
    description: |
      Re-finalizing a SettlementBatch whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. The batch
      may have been re-finalized or moved out of DISPUTED by another writer,
      so the current writer's view of the dispute cycle is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: claim_pricing
    trigger: "Claim submission (provisional) and RECEIVED -> PRICED transition (final)"
    algorithm: forward_looking
    formula: |
      provisional (at submission):
        rate = RateSchedule(host_plan_id, provider_npi, procedure_code)
               where effective_start <= service_date < effective_end   # half-open
        if none: provisional_allowed_cents = billed_amount_cents        # fallback
        else:    provisional_allowed_cents = min(billed_amount_cents, negotiated_rate_cents)
      final (at pricing, pricing_date = current logical clock date):
        rate = RateSchedule(host_plan_id, provider_npi, procedure_code)
               where effective_start <= pricing_date < effective_end   # half-open
        if none: ERR_RATE_SCHEDULE_MISSING (pricing fails)
        else:    priced_allowed_cents = min(billed_amount_cents, negotiated_rate_cents)
    input_set: "RateSchedules of the claim's host plan matching (provider_npi, procedure_code); window keyed on service_date (provisional) or pricing date (final)"
    precision: "integer cents, no rounding"
    variants:
      - name: provisional_service_date_keyed
        when: "At claim submission"
        difference: "Rate window keyed on service_date; falls back to billed_amount_cents when no schedule matches"
      - name: final_pricing_date_keyed
        when: "At the price transition"
        difference: "Rate window keyed on the logical clock date; hard failure ERR_RATE_SCHEDULE_MISSING when no schedule matches"
  - name: access_fee_computation
    trigger: "PRICED -> ROUTED transition"
    algorithm: tiered_pricing
    formula: |
      sched = AccessFeeSchedule(home_plan_id, host_plan_id)
              where effective_start <= service_date <= effective_end   # closed interval
      if current_allowed_cents <= sched.tier1_cap_cents:               # boundary INCLUSIVE
          base_fee = sched.tier1_fee_cents
      else:
          base_fee = round_half_up(current_allowed_cents * sched.tier2_rate)
      if Claim.national_account_id references a NationalAccount whose
         controlling_plan_id == home_plan_id and status == ACTIVE
         and service_date within [effective_start, effective_end] (closed):
          access_fee_cents = round_half_up(base_fee * (1 - sched.national_account_discount_pct))
      else:
          access_fee_cents = base_fee
    input_set: "AccessFeeSchedule for the (home, host) plan pair whose closed window covers service_date; Claim.national_account_id and the referenced NationalAccount status/window"
    precision: "integer cents, round_half_up after percentage application"
  - name: admin_charge_computation
    trigger: "PRICED -> ROUTED transition"
    algorithm: tiered_pricing
    formula: |
      tier brackets on current_allowed_cents (cents), cumulative marginal:
        bracket 1: (0, 10000]        -> 5%
        bracket 2: (10000, 100000]   -> 3%
        bracket 3: (100000, +inf)    -> 1%
      Compute each bracket's charge on its slice, round each bracket slice to
      integer cents with round_half_up FIRST, then sum the rounded slices
      (pinned order: round-per-bracket-then-sum; sum-then-round is forbidden).
    constants:
      BRACKET1_CAP: 10000
      BRACKET2_CAP: 100000
      RATE1: 0.05
      RATE2: 0.03
      RATE3: 0.01
    input_set: "Claim.current_allowed_cents at routing time"
    precision: "integer cents, round_half_up per bracket slice, then sum"
  - name: recovery_computation
    trigger: "Adjustment APPLIED on a claim that has been PAID"
    algorithm: aggregation
    formula: |
      recovery_amount_cents = max(0, -(delta_allowed_cents))  # only downward deltas recover funds
      host Plan.claims_paid_balance_cents -= recovery_amount_cents
      Claim.current_allowed_cents = max(0, current_allowed_cents + delta_allowed_cents)
    input_set: "The single applied Adjustment and its parent Claim"
    precision: "integer cents"
  - name: settlement_sweep
    trigger: "SettlementBatch OPEN -> FINALIZED (and DISPUTED -> FINALIZED re-finalize)"
    algorithm: waterfall_allocation
    formula: |
      scope = Claims where home_plan_id == debtor_plan_id
                        and host_plan_id == creditor_plan_id
                        and status == PAID
                        and period_start <= service_date <= period_end   # closed
      gross_claims_total_cents = sum(provider_payment_cents)
      fees_total_cents = sum(access_fee_cents + admin_charge_cents)
                       - sum(recovery_amount_cents over APPLIED adjustments of swept claims)
      if settlement_variant == NET:   net_settlement_cents = gross_claims_total_cents - fees_total_cents
      if settlement_variant == GROSS: net_settlement_cents = gross_claims_total_cents
      Claim inclusion is deterministic: all claims satisfying the scope predicate
      are swept; sweep order (for audit replay) is service_date ASC, then created_at ASC.
    input_set: "PAID claims for the (debtor home, creditor host) pair with service_date inside the closed batch window"
    precision: "integer cents"
    variants:
      - name: net_variant
        when: "settlement_variant == NET"
        difference: "Fees are deducted from the remitted amount"
      - name: gross_variant
        when: "settlement_variant == GROSS"
        difference: "Full provider-payment gross is remitted; fees settled separately (net_settlement excludes fees)"
  - name: plan_balance_reconciliation
    trigger: "Claim PAID (credit host), Adjustment APPLIED (debit host), SettlementBatch DISBURSED (clear host fee receivables under NET)"
    algorithm: aggregation
    formula: |
      claims_paid_balance_cents = sum(provider_payment_cents over PAID/SETTLED claims hosted)
                                - sum(recovery_amount_cents over APPLIED adjustments hosted)
      fees_receivable_balance_cents = sum(access_fee_cents + admin_charge_cents over PAID claims hosted)
                                    - sum(fees_total_cents over DISBURSED/RECONCILED NET batches where creditor_plan_id == this plan)
      (recoveries do NOT touch the receivables ledger; they debit only claims_paid_balance_cents
       and are netted into fees_total_cents at batch finalize per settlement_sweep)
    input_set: "Claims hosted by the plan in status {PAID, SETTLED}; APPLIED adjustments; DISBURSED or RECONCILED NET batches credited to the plan"
    precision: "integer cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id and every referenced FK in the body exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Home plan and host plan brand_license_status == LICENSED at claim submission and at routing; a SUSPENDED or PENDING plan rejects new claims"
    error_id: ERR_PLAN_LICENSE_SUSPENDED
    http_status: 409
    applies_to: ["POST /v1/claims", "POST /v1/claims/{id}/route"]
  - priority: 6
    category: business_temporal
    check: "Claim.service_state is in the host plan's service_area_states (service area licensing rule)"
    error_id: ERR_OUT_OF_SERVICE_AREA
    http_status: 422
    applies_to: ["POST /v1/claims"]
  - priority: 7
    category: business_temporal
    check: "RateSchedule half-open windows for (plan_id, provider_npi, procedure_code) never overlap; effective_end > effective_start"
    error_id: ERR_RATE_WINDOW_OVERLAP
    http_status: 422
    applies_to: ["POST /v1/rate-schedules"]
  - priority: 8
    category: business_temporal
    check: "AccessFeeSchedule closed windows for (home_plan_id, host_plan_id) never overlap; effective_end >= effective_start; tiers positive"
    error_id: ERR_FEE_WINDOW_OVERLAP
    http_status: 422
    applies_to: ["POST /v1/access-fee-schedules"]
  - priority: 9
    category: business_temporal
    check: "NationalAccount territory windows for the same (controlling_plan_id, employer_group_id) never overlap (closed intervals, adjacency with shared endpoint counts as overlap)"
    error_id: ERR_ACCOUNT_WINDOW_OVERLAP
    http_status: 422
    applies_to: ["POST /v1/national-accounts"]
  - priority: 10
    category: business_referential
    check: "Claim.host_plan_id must differ from the member's home plan; otherwise it is a local claim, not an inter-plan claim"
    error_id: ERR_SAME_PLAN_CLAIM
    http_status: 422
    applies_to: ["POST /v1/claims"]
  - priority: 11
    category: business_constraint
    check: "Member.member_number unique within home_plan_id"
    error_id: ERR_DUPLICATE_MEMBER_NUMBER
    http_status: 409
    applies_to: ["POST /v1/members"]
  - priority: 12
    category: business_fiscal
    check: "billed_amount_cents > 0, negotiated_rate_cents > 0, tier values non-negative, delta_allowed_cents != 0"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: ["POST /v1/claims", "POST /v1/rate-schedules", "POST /v1/access-fee-schedules", "POST /v1/claims/{id}/adjustments"]
  - priority: 13
    category: business_fiscal
    check: "An applied downward adjustment must not drive Claim.current_allowed_cents below 0"
    error_id: ERR_NEGATIVE_ALLOWED
    http_status: 422
    applies_to: ["POST /v1/adjustments/{id}/apply"]
  - priority: 14
    category: business_constraint
    check: "Plan.plan_code unique across all plans"
    error_id: ERR_DUPLICATE_PLAN_CODE
    http_status: 409
    applies_to: ["POST /v1/plans"]

endpoints:
  - method: POST
    path: "/v1/plans"
    description: "Register an independent licensee plan (starts PENDING)"
    roles: [AssociationAdmin]
    code: 201
    input: [plan_code, legal_name, service_area_states]
    output: Plan
    side_effects: []
  - method: GET
    path: "/v1/plans/{id}"
    description: "Read a plan including computed balances"
    roles: [AssociationAdmin, HomePlanOperator, HostPlanOperator]
    code: 200
    input: []
    output: Plan
    side_effects: []
  - method: GET
    path: "/v1/plans"
    description: "List plans; optional brand_license_status filter; paginated"
    roles: [AssociationAdmin, HomePlanOperator, HostPlanOperator]
    code: 200
    input: ["brand_license_status?", "limit?", "offset?"]
    output: Plan[]
    side_effects: []
  - method: POST
    path: "/v1/plans/{id}/activate-license"
    description: "PENDING -> LICENSED"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["Plan.brand_license_status := LICENSED; increments Plan.version"]
  - method: POST
    path: "/v1/plans/{id}/suspend-license"
    description: "LICENSED -> SUSPENDED"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["increments Plan.version"]
  - method: POST
    path: "/v1/plans/{id}/reinstate-license"
    description: "SUSPENDED -> LICENSED"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["increments Plan.version"]
  - method: POST
    path: "/v1/plans/{id}/revoke-license"
    description: "LICENSED -> REVOKED (terminal); cascades controlled NationalAccounts to TERMINATED"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: Plan
    side_effects: ["increments Plan.version", "controlled NationalAccounts ACTIVE/SUSPENDED -> TERMINATED"]
  - method: POST
    path: "/v1/members"
    description: "Register a member under a home plan"
    roles: [HomePlanOperator, AssociationAdmin]
    code: 201
    input: [home_plan_id, member_number, full_name, national_account_id]
    output: Member
    side_effects: []
  - method: GET
    path: "/v1/members/{id}"
    description: "Read a member"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []
  - method: GET
    path: "/v1/members"
    description: "List members; optional home_plan_id, member_number filters; paginated"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: ["home_plan_id?", "member_number?", "national_account_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []
  - method: POST
    path: "/v1/members/{id}/terminate"
    description: "Member eligibility ACTIVE -> TERMINATED"
    roles: [HomePlanOperator]
    code: 200
    input: []
    output: Member
    side_effects: ["increments Member.version"]
  - method: POST
    path: "/v1/national-accounts"
    description: "Create a national account arrangement controlled by one plan"
    roles: [AssociationAdmin]
    code: 201
    input: [controlling_plan_id, account_name, employer_group_id, territory_states, effective_start, effective_end]
    output: NationalAccount
    side_effects: []
  - method: GET
    path: "/v1/national-accounts/{id}"
    description: "Read a national account"
    roles: [AssociationAdmin, HomePlanOperator, HostPlanOperator]
    code: 200
    input: []
    output: NationalAccount
    side_effects: []
  - method: GET
    path: "/v1/national-accounts"
    description: "List national accounts; optional controlling_plan_id, status filters; paginated"
    roles: [AssociationAdmin, HomePlanOperator, HostPlanOperator]
    code: 200
    input: ["controlling_plan_id?", "status?", "limit?", "offset?"]
    output: NationalAccount[]
    side_effects: []
  - method: POST
    path: "/v1/national-accounts/{id}/activate"
    description: "PROPOSED -> ACTIVE"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: NationalAccount
    side_effects: ["increments NationalAccount.version"]
  - method: POST
    path: "/v1/national-accounts/{id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: NationalAccount
    side_effects: ["increments NationalAccount.version"]
  - method: POST
    path: "/v1/national-accounts/{id}/reactivate"
    description: "SUSPENDED -> ACTIVE"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: NationalAccount
    side_effects: ["increments NationalAccount.version"]
  - method: POST
    path: "/v1/national-accounts/{id}/terminate"
    description: "ACTIVE -> TERMINATED"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: NationalAccount
    side_effects: ["increments NationalAccount.version"]
  - method: POST
    path: "/v1/rate-schedules"
    description: "Publish a host plan negotiated rate window (half-open)"
    roles: [HostPlanOperator, AssociationAdmin]
    code: 201
    input: [plan_id, provider_npi, procedure_code, negotiated_rate_cents, effective_start, effective_end]
    output: RateSchedule
    side_effects: []
  - method: GET
    path: "/v1/rate-schedules/{id}"
    description: "Read a rate schedule"
    roles: [AssociationAdmin, HomePlanOperator, HostPlanOperator]
    code: 200
    input: []
    output: RateSchedule
    side_effects: []
  - method: GET
    path: "/v1/rate-schedules"
    description: "List rate schedules; optional plan_id, provider_npi, procedure_code filters; paginated"
    roles: [AssociationAdmin, HomePlanOperator, HostPlanOperator]
    code: 200
    input: ["plan_id?", "provider_npi?", "procedure_code?", "limit?", "offset?"]
    output: RateSchedule[]
    side_effects: []
  - method: POST
    path: "/v1/access-fee-schedules"
    description: "Publish the access-fee tier schedule between a home and host plan (closed window)"
    roles: [AssociationAdmin]
    code: 201
    input: [home_plan_id, host_plan_id, tier1_cap_cents, tier1_fee_cents, tier2_rate, "national_account_discount_pct?", effective_start, effective_end]
    output: AccessFeeSchedule
    side_effects: []
  - method: GET
    path: "/v1/access-fee-schedules/{id}"
    description: "Read an access fee schedule"
    roles: [AssociationAdmin, HomePlanOperator, HostPlanOperator]
    code: 200
    input: []
    output: AccessFeeSchedule
    side_effects: []
  - method: GET
    path: "/v1/access-fee-schedules"
    description: "List fee schedules; optional home_plan_id, host_plan_id filters; paginated"
    roles: [AssociationAdmin, HomePlanOperator, HostPlanOperator]
    code: 200
    input: ["home_plan_id?", "host_plan_id?", "limit?", "offset?"]
    output: AccessFeeSchedule[]
    side_effects: []
  - method: POST
    path: "/v1/claims"
    description: "Submit an inter-plan claim; provisional pricing runs immediately"
    roles: [HostPlanOperator]
    code: 201
    input: [member_id, host_plan_id, provider_npi, procedure_code, service_date, service_state, billed_amount_cents]
    output: Claim
    side_effects: ["claim_pricing provisional variant", "home_plan_id and national_account_id copied from Member"]
  - method: GET
    path: "/v1/claims/{id}"
    description: "Read a claim"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/v1/claims"
    description: "List claims; optional home_plan_id, host_plan_id, member_id, status filters; paginated"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: ["home_plan_id?", "host_plan_id?", "member_id?", "national_account_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/v1/claims/{id}/price"
    description: "RECEIVED -> PRICED; final pricing variant keyed on logical clock date"
    roles: [HostPlanOperator]
    code: 200
    input: []
    output: Claim
    side_effects: ["claim_pricing final variant", "increments Claim.version"]
  - method: POST
    path: "/v1/claims/{id}/route"
    description: "PRICED -> ROUTED; access fee and admin charge computed"
    roles: [HostPlanOperator]
    code: 200
    input: []
    output: Claim
    side_effects: ["access_fee_computation", "admin_charge_computation", "increments Claim.version"]
  - method: POST
    path: "/v1/claims/{id}/determine-benefit"
    description: "ROUTED -> BENEFIT_DETERMINED by home plan"
    roles: [HomePlanOperator]
    code: 200
    input: []
    output: Claim
    side_effects: ["increments Claim.version"]
  - method: POST
    path: "/v1/claims/{id}/deny"
    description: "ROUTED -> DENIED by home plan (terminal)"
    roles: [HomePlanOperator]
    code: 200
    input: []
    output: Claim
    side_effects: ["increments Claim.version"]
  - method: POST
    path: "/v1/claims/{id}/pay"
    description: "BENEFIT_DETERMINED -> PAID; host pays provider; host balances updated"
    roles: [HostPlanOperator]
    code: 200
    input: []
    output: Claim
    side_effects: ["provider_payment_cents := current_allowed_cents", "plan_balance_reconciliation (credit host)", "increments Claim.version"]
  - method: POST
    path: "/v1/claims/{id}/adjustments"
    description: "Create an adjustment on a PAID or ADJUSTMENT_PENDING claim; OCC-guarded; supersedes prior INITIATED adjustment. When the claim is already ADJUSTMENT_PENDING the claim state is unchanged; from PAID the claim moves to ADJUSTMENT_PENDING."
    roles: [HostPlanOperator]
    code: 201
    input: [reason, delta_allowed_cents, expected_claim_version]
    output: Adjustment
    side_effects: ["Claim PAID -> ADJUSTMENT_PENDING (no claim state change when already ADJUSTMENT_PENDING)", "prior INITIATED Adjustment -> REJECTED (superseded), recorded in supersedes_adjustment_id", "increments Claim.version"]
  - method: GET
    path: "/v1/adjustments/{id}"
    description: "Read an adjustment"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: []
    output: Adjustment
    side_effects: []
  - method: GET
    path: "/v1/adjustments"
    description: "List adjustments; optional claim_id, status filters; paginated"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: ["claim_id?", "status?", "supersedes_adjustment_id?", "limit?", "offset?"]
    output: Adjustment[]
    side_effects: []
  - method: POST
    path: "/v1/adjustments/{id}/validate"
    description: "INITIATED -> VALIDATED by host plan"
    roles: [HostPlanOperator]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["increments Adjustment.version"]
  - method: POST
    path: "/v1/adjustments/{id}/propagate"
    description: "VALIDATED -> PROPAGATED by home plan (acknowledges recovery)"
    roles: [HomePlanOperator]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["increments Adjustment.version"]
  - method: POST
    path: "/v1/adjustments/{id}/apply"
    description: "PROPAGATED -> APPLIED by host; claim returns to PAID; recovery computed; host balances adjusted"
    roles: [HostPlanOperator]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["recovery_computation", "plan_balance_reconciliation (debit host)", "Claim ADJUSTMENT_PENDING -> PAID", "increments Adjustment.version"]
  - method: POST
    path: "/v1/adjustments/{id}/reject"
    description: "INITIATED|VALIDATED -> REJECTED by home plan; claim reverts to PAID"
    roles: [HomePlanOperator]
    code: 200
    input: []
    output: Adjustment
    side_effects: ["Claim ADJUSTMENT_PENDING -> PAID with no balance change", "increments Adjustment.version"]
  - method: POST
    path: "/v1/settlement-batches"
    description: "Open a settlement batch between debtor (home) and creditor (host) plan"
    roles: [HostPlanOperator]
    code: 201
    input: [debtor_plan_id, creditor_plan_id, period_start, period_end, "settlement_variant?"]
    output: SettlementBatch
    side_effects: []
  - method: GET
    path: "/v1/settlement-batches/{id}"
    description: "Read a settlement batch"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: []
  - method: GET
    path: "/v1/settlement-batches"
    description: "List batches; optional debtor_plan_id, creditor_plan_id, status filters; paginated"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: ["debtor_plan_id?", "creditor_plan_id?", "status?", "limit?", "offset?"]
    output: SettlementBatch[]
    side_effects: []
  - method: POST
    path: "/v1/settlement-batches/{id}/finalize"
    description: "OPEN -> FINALIZED; settlement sweep computes totals"
    roles: [HostPlanOperator]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["settlement_sweep", "increments SettlementBatch.version"]
  - method: POST
    path: "/v1/settlement-batches/{id}/acknowledge"
    description: "FINALIZED -> ACKNOWLEDGED by debtor home plan"
    roles: [HomePlanOperator]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["increments SettlementBatch.version"]
  - method: POST
    path: "/v1/settlement-batches/{id}/dispute"
    description: "FINALIZED -> DISPUTED by debtor home plan"
    roles: [HomePlanOperator]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["increments SettlementBatch.version"]
  - method: POST
    path: "/v1/settlement-batches/{id}/refinalize"
    description: "DISPUTED -> FINALIZED; re-sweep totals; OCC-guarded"
    roles: [HostPlanOperator]
    code: 200
    input: [expected_settlement_batch_version]
    output: SettlementBatch
    side_effects: ["settlement_sweep", "increments SettlementBatch.version"]
  - method: POST
    path: "/v1/settlement-batches/{id}/disburse"
    description: "ACKNOWLEDGED -> DISBURSED; under NET variant creditor fee receivables are cleared"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["plan_balance_reconciliation (clear creditor fee receivables under NET)", "increments SettlementBatch.version"]
  - method: POST
    path: "/v1/settlement-batches/{id}/reconcile"
    description: "DISBURSED -> RECONCILED; swept claims become SETTLED"
    roles: [AssociationAdmin]
    code: 200
    input: []
    output: SettlementBatch
    side_effects: ["swept Claims PAID -> SETTLED", "increments SettlementBatch.version"]
  - method: POST
    path: "/v1/eligibility-inquiries"
    description: "Host plan routes an eligibility inquiry to the home plan named by the card prefix"
    roles: [HostPlanOperator]
    code: 201
    input: [inquiring_plan_id, home_plan_id, member_number]
    output: EligibilityInquiry
    side_effects: []
  - method: GET
    path: "/v1/eligibility-inquiries/{id}"
    description: "Read an eligibility inquiry"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: []
    output: EligibilityInquiry
    side_effects: []
  - method: GET
    path: "/v1/eligibility-inquiries"
    description: "List inquiries; optional inquiring_plan_id, home_plan_id, status filters; paginated"
    roles: [HomePlanOperator, HostPlanOperator, AssociationAdmin]
    code: 200
    input: ["inquiring_plan_id?", "home_plan_id?", "member_number?", "status?", "limit?", "offset?"]
    output: EligibilityInquiry[]
    side_effects: []
  - method: POST
    path: "/v1/eligibility-inquiries/{id}/answer"
    description: "ROUTED -> ANSWERED; home plan reports member eligibility"
    roles: [HomePlanOperator]
    code: 200
    input: []
    output: EligibilityInquiry
    side_effects: ["answer_eligibility_status := member eligibility", "increments EligibilityInquiry.version"]
  - method: POST
    path: "/v1/eligibility-inquiries/{id}/reject"
    description: "ROUTED -> REJECTED by home plan"
    roles: [HomePlanOperator]
    code: 200
    input: []
    output: EligibilityInquiry
    side_effects: ["increments EligibilityInquiry.version"]
  - method: POST
    path: "/v1/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is 2026-09-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [AssociationAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: "ISO8601" }
    side_effects: []

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted to invoke this endpoint, or plan-scoped role acting on a plan other than its own (X-User-ID != the relevant Plan.id)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist (plan, member, claim, adjustment, batch, inquiry, schedule, account)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC mismatch: expected_*_version does not equal the parent's current version" }
  - { id: ERR_DUPLICATE_PLAN_CODE, http: 409, condition: "plan_code already registered" }
  - { id: ERR_DUPLICATE_MEMBER_NUMBER, http: 409, condition: "member_number already exists under the same home_plan_id" }
  - { id: ERR_PLAN_LICENSE_SUSPENDED, http: 409, condition: "Home or host plan brand_license_status is not LICENSED at claim submission or routing" }
  - { id: ERR_OUT_OF_SERVICE_AREA, http: 422, condition: "service_state is not in the host plan's service_area_states" }
  - { id: ERR_SAME_PLAN_CLAIM, http: 422, condition: "host_plan_id equals the member's home plan — not an inter-plan claim" }
  - { id: ERR_RATE_WINDOW_OVERLAP, http: 422, condition: "New RateSchedule half-open window overlaps an existing window for the same (plan_id, provider_npi, procedure_code)" }
  - { id: ERR_FEE_WINDOW_OVERLAP, http: 422, condition: "New AccessFeeSchedule closed window overlaps an existing window for the same (home_plan_id, host_plan_id)" }
  - { id: ERR_ACCOUNT_WINDOW_OVERLAP, http: 422, condition: "New NationalAccount closed window overlaps an existing window for the same (controlling_plan_id, employer_group_id)" }
  - { id: ERR_RATE_SCHEDULE_MISSING, http: 422, condition: "No RateSchedule window covers the pricing date at final pricing" }
  - { id: ERR_FEE_SCHEDULE_MISSING, http: 422, condition: "No AccessFeeSchedule covers service_date for the (home, host) pair at routing" }
  - { id: ERR_MEMBER_INELIGIBLE, http: 422, condition: "Member eligibility_status is TERMINATED at benefit determination" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "No Member with the inquired member_number exists under the home plan (eligibility answer path)" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "Amount/rate constraint violated (non-positive billed amount or rate, zero delta, negative tier)" }
  - { id: ERR_NEGATIVE_ALLOWED, http: 422, condition: "Applying the adjustment would drive current_allowed_cents below 0" }
  - { id: ERR_EMPTY_BATCH, http: 422, condition: "Finalize requested on a batch whose sweep scope contains no PAID claims" }
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Required field missing, wrong type, or malformed value (generic request-shape error; lowest priority)" }

roles:
  - name: AssociationAdmin
    description: "Blue Cross Blue Shield Association operator: registers licensees, governs brand licensing, opens national accounts, disburses and reconciles settlement batches, drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/plans and all plan license transitions"
      - "POST /v1/national-accounts and all account transitions"
      - "POST /v1/access-fee-schedules"
      - "POST /v1/settlement-batches/{id}/disburse and /reconcile"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "GET on plans, members, national accounts, rate schedules, fee schedules, claims, adjustments, batches, inquiries"
      - "POST /v1/members, POST /v1/rate-schedules"
  - name: HomePlanOperator
    description: "Operator of the member's home plan: registers members, determines benefits, acknowledges or disputes settlement batches, propagates or rejects adjustments, answers eligibility inquiries"
    identity: "entity_backed:Plan"
    exclusive_operations:
      - "POST /v1/members/{id}/terminate"
      - "POST /v1/claims/{id}/determine-benefit and /deny"
      - "POST /v1/adjustments/{id}/propagate and /reject"
      - "POST /v1/settlement-batches/{id}/acknowledge and /dispute"
      - "POST /v1/eligibility-inquiries/{id}/answer and /reject"
    shared_operations:
      - "POST /v1/members"
      - "GET on all resources"
  - name: HostPlanOperator
    description: "Operator of the host plan: submits and prices inter-plan claims, pays providers, initiates/validates/applies adjustments, opens/finalizes/refinalizes settlement batches, files eligibility inquiries"
    identity: "entity_backed:Plan"
    exclusive_operations:
      - "POST /v1/claims and claim /price, /route, /pay"
      - "POST /v1/claims/{id}/adjustments"
      - "POST /v1/adjustments/{id}/validate and /apply"
      - "POST /v1/settlement-batches and /finalize, /refinalize"
      - "POST /v1/eligibility-inquiries"
    shared_operations:
      - "POST /v1/rate-schedules"
      - "GET on all resources"
