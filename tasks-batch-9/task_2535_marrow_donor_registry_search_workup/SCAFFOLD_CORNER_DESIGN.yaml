            - "limit 100 with offset 0 succeeds with 200: 100 is the inclusive upper bound, and the envelope reports total_count 1 with has_more false"
            - "DELETE on a window id that does not exist returns 404 with error_id \"ERR_UNAVAILABILITY_WINDOW_NOT_FOUND\" (the donor in the path DOES exist, so the error is about the sub-resource)"
            - "an ADVERSE_EVENT row with severity_grade 0 returns 422 with error_id \"ERR_ADVERSE_EVENT_GRADE_INVALID\", and so does a DAY_30_CONTACT row with severity_grade 2 - the rule is bidirectional"
