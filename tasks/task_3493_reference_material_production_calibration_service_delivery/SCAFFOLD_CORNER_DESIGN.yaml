  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: customer_cannot_create_program
        claim_type: role_denied
        grounds: [roles, "validations[priority=2]", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "Customer role calling POST /metrology/programs is denied 403 ERR_UNAUTHORIZED_ROLE."
