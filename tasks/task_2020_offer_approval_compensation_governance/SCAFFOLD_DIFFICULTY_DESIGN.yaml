            - "after REFERENCE CLEARED: Offer.status == HIRED, clearance_posture == CLEARED"
            - "Candidate.${cand_id}.status == HIRED"

  # ------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: delegation_grant_half_open_overlap
        grounds:
          - validations[priority=10]
          - entities.DelegationGrant.fields.valid_from
          - errors[ERR_GRANT_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on the DelegationGrant resource: a second
          grant for the same (delegate, scope_role) with interior overlap
          [08-15, 10-01) vs [08-01, 09-01) is rejected, while exact adjacency
          (valid_from == prior valid_until) is allowed, and a same-window grant
          under a different scope_role is also allowed (partitioned resource).
        test_recipe:
          setup:
            - "ACTIVE grant A: delegate dir-9, scope VPPeople, [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z)"
          setup_api_calls:
            - call: "POST /api/delegation-grants"
              payload: { grantor_user_id: vp-1, delegate_user_id: dir-9, scope_role: VPPeople, valid_from: "2026-08-01T00:00:00Z", valid_until: "2026-09-01T00:00:00Z" }
              as: HRAdmin
              as_user_id: admin-1
              captures: { grant_a: $.data.id }
          trigger:
            - call: "POST /api/delegation-grants"
              payload: { grantor_user_id: vp-1, delegate_user_id: dir-9, scope_role: VPPeople, valid_from: "2026-08-15T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: HRAdmin
              as_user_id: admin-1
              captures: { err_overlap: $.data.error_id }
            - call: "POST /api/delegation-grants"
              payload: { grantor_user_id: vp-1, delegate_user_id: dir-9, scope_role: VPPeople, valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: HRAdmin
              as_user_id: admin-1
              captures: { grant_c: $.data.id }
            - call: "POST /api/delegation-grants"
              payload: { grantor_user_id: dir-1, delegate_user_id: dir-9, scope_role: DepartmentDirector, valid_from: "2026-08-15T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: HRAdmin
              as_user_id: admin-1
              captures: { grant_d: $.data.id }
          assert:
            - "interior overlap -> ERR_GRANT_OVERLAP"
            - "adjacent window (valid_from == A.valid_until) succeeds: DelegationGrant.${grant_c}.status == ACTIVE"
            - "same window under scope_role DepartmentDirector succeeds: DelegationGrant.${grant_d}.status == ACTIVE (overlap is partitioned by delegate+scope_role)"

      - name: candidate_single_active_offer_occupation
        grounds:
          - validations[priority=10]
          - state_machines.Offer.LETTER_GENERATED_to_EXTENDED
          - errors[ERR_CANDIDATE_ACTIVE_OFFER_EXISTS]
        distinguishing_aspect: |
          State-occupation semantics (not time-interval arithmetic — the
          differentiator from the grant window rule) on the Candidate resource:
          a candidate carries at most one offer in {EXTENDED, COUNTERED,
          ACCEPTED}; extending a second offer is rejected until the first is
          DECLINED, after which extension succeeds.
        test_recipe:
          setup:
            - "Requisitions R1 and R2 (identical standard params, headcount 1 each) OPEN; three L5/T1 peers"
            - "Offer1 for candidate C on R1: approved, lettered, EXTENDED"
            - "Offer2 for the same candidate C on R2: approved, lettered (LETTER_GENERATED)"
          setup_api_calls:
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng 1", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
              captures: { req1: $.data.id }
            - call: "POST /api/requisitions/${req1}/submit"
              payload: {}
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/requisitions/${req1}/review-decision"
              payload: { decision: APPROVE }
              as: FinanceController
              as_user_id: fin-1
            - call: "POST /api/requisitions/${req1}/review-decision"
              payload: { decision: APPROVE }
              as: CompAnalyst
              as_user_id: ca-1
            - call: "POST /api/requisitions"
              payload: { title: "Sr Eng 2", department: "ENG", role_level: L5, geo_tier: T1, annual_budget_cents: 50000000, salary_min_cents: 15000000, salary_mid_cents: 18000000, salary_max_cents: 21000000, headcount_authorized: 1 }
              as: HiringManager
              as_user_id: hm-1
