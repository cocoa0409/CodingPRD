      - name: settlement_money_rounds_each_ticket_line_on_the_delivered_basis
        claim_type: Precision
        grounds:
          - calculations.tariff_charge
          - calculations.loss_allocation
          - calculations.imbalance_charge
          - entities.ImbalanceSettlement.fields.total_billed_usd
        distinguishing_aspect: |
          A single ticket that injects 30000 bbl and delivers 29900 bbl makes every money field
          checkable at once: the 100.00 bbl of shrinkage is allocated back to the sole shipper, so
          imbalance_bbl is 29900 - 30000 + 100 == 0.00 and the tier is TOLERANCE with a zero charge,
          while the DELIVERED basis bills 29900 * 1.705 == 50979.50 against a SCHEDULED alternative
          of 30000 * 1.705 == 51150.00 for a basis_delta_usd of 170.50. Loss shifts the imbalance,
          it is not billed as one.
        test_recipe:
          setup:
            - "Cycle 2026-09 is PUBLISHED with ALPHA's single 30000 bbl ticket; the ticket has injected 30000 bbl on-spec and delivered 29900 bbl."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TariffAdministrator
