      - name: corner_the_roofer_that_scoped_an_upgrade_may_not_sign_its_completion
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=16]
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.DeckFinding.transitions["UPGRADE_SCOPED -> UPGRADE_COMPLETED"]
        distinguishing_aspect: "The duties are split by Party identity, not by role: the very same X-User-ID that scoped the upgrade is refused with 403 while a different ROOFER party - who is not even attached to this project, because the party-on-project rule does not cover this endpoint - completes the identical request. scoped_by_party_id and completed_by_party_id must therefore end up different."
