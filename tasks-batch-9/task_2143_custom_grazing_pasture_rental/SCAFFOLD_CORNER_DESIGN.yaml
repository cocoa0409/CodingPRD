            - call: "GET /grazing/capacity-assessments"
              payload: { pasture_id: "${p1}" }
              as: Grazier
              as_user_id: "${g1}"
          assert:
            - "${err} == ERR_STALE_PASTURE_VERSION with HTTP 412"
            - "The assessment list returns total_count == 1"
            - "Pasture.${p1}.version == 3"
            - "Pasture.${p1}.effective_assessment_id == ${a1}"
            - "Pasture.${p1}.rated_head_days == 20769"

      - name: stale_expected_contract_version_on_a_settlement_draft_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[settlement-create-stale-contract]
          - errors[ERR_STALE_CONTRACT_VERSION]
          - validations[priority=9]
        distinguishing_aspect: "The contract's version was 1 at creation and the submit and sign cascades advanced it to 3, so drafting a settlement with expected_contract_version 1 returns ERR_STALE_CONTRACT_VERSION (412) and no Settlement row is written."
        test_recipe:
          setup: ["Contract K1 was created at version 1, then submitted and signed, so its version now reads 3; lot L1 is ON_FEED."]
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /grazing/cattle-owners"
              payload: { legal_name: "Sixteen Mile Cattle Co", state_code: "MT", brand_registration: "MT-4471", credit_limit_cents: 5000000 }
              as: PlatformAdmin
              captures: { o1: $.data.id }
            - call: "POST /grazing/range-consultants"
              payload: { full_name: "Dana Reyes", certification_number: "RC-1102", state_code: "MT" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /grazing/pastures"
              payload: { name: "North Bench", acres: 1200, forage_type: "NATIVE_RANGE", water_source_type: "WELL", fence_class: "CLASS_B", prior_season_head_days: 5000 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { p1: $.data.id, p1_v0: $.data.version }
            - call: "POST /grazing/pastures/${p1}/capacity-assessments"
              payload: { expected_pasture_version: "${p1_v0}", method: "DRY_MATTER", forage_dry_matter_lbs_per_acre: 1800, utilization_pct: 25, assessment_date: "2026-07-15" }
              as: RangeConsultant
              as_user_id: "${c1}"
            - call: "POST /grazing/pastures/${p1}/status"
              payload: { to_status: "AVAILABLE" }
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/contracts"
              payload: { cattle_owner_id: "${o1}", pasture_id: "${p1}", billing_mode: "PER_POUND_OF_GAIN", rate_cents: 85, shrink_pct: 3.5, out_shrink_pct: 0, head_count_committed: 150, head_value_cents: 140000, start_date: "2026-08-10", end_date: "2026-11-10", min_days: 60, treatment_cost_split_pct: 33, water_responsibility: "SHARED", fence_responsibility: "GRAZIER", infrastructure_owner_cap_cents: 100000, death_loss_terms: "GRAZIER_SHARE_ABOVE_THRESHOLD", death_loss_threshold_pct: 2.0 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { k1: $.data.id, k1_v0: $.data.version }
            - call: "POST /grazing/contracts/${k1}/submit"
              payload: {}
              as: Grazier
              as_user_id: "${g1}"
            - call: "POST /grazing/contracts/${k1}/sign"
              payload: { signature_ref: "SIG-K1" }
              as: CattleOwner
              as_user_id: "${o1}"
            - call: "POST /grazing/contracts/${k1}/lots"
              payload: { scheduled_head_count: 150, scheduled_delivery_date: "2026-08-10" }
              as: Grazier
              as_user_id: "${g1}"
              captures: { l1: $.data.id }
            - call: "POST /grazing/lots/${l1}/receive"
              payload: { head_count_received: 150, gross_weight_lbs: 63745, scale_ticket_ref: "T-1001", received_at: "2026-08-10T09:00:00Z" }
              as: Grazier
              as_user_id: "${g1}"
          trigger:
            - call: "POST /grazing/settlements"
              payload: { contract_id: "${k1}", lot_id: "${l1}", expected_contract_version: "${k1_v0}" }
              as: Grazier
              as_user_id: "${g1}"
              captures: { err: $.data.error_id }
            - call: "GET /grazing/settlements"
              payload: { contract_id: "${k1}" }
              as: Grazier
              as_user_id: "${g1}"
          assert:
            - "${err} == ERR_STALE_CONTRACT_VERSION with HTTP 412"
            - "${err} != ERR_NO_OUT_WEIGHT (the OCC check at priority 9 precedes the priority 25 out-weight check)"
            - "The settlement list returns total_count == 0"
            - "GrazingContract.${k1}.version == 3"

      - name: pasture_version_increments_by_one_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Pasture.common_fields
          - endpoints[POST /grazing/pastures/{id}/capacity-assessments]
          - endpoints[POST /grazing/pastures/{id}/status]
        distinguishing_aspect: "Pasture.version reads 1 after create, 2 after the assessment and 3 after the activation — one increment per mutating call, with read calls leaving it untouched."
        test_recipe:
          setup: ["One Grazier and one RangeConsultant are registered; no pastures exist."]
          setup_api_calls:
            - call: "POST /grazing/graziers"
              payload: { business_name: "Bitterroot Custom Grazing", state_code: "MT", liability_carrier: "Farm Mutual" }
              as: PlatformAdmin
              captures: { g1: $.data.id }
            - call: "POST /grazing/range-consultants"
              payload: { full_name: "Dana Reyes", certification_number: "RC-1102", state_code: "MT" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /grazing/pastures"
              payload: { name: "North Bench", acres: 1200, forage_type: "NATIVE_RANGE", water_source_type: "WELL", fence_class: "CLASS_B", prior_season_head_days: 5000 }
              as: Grazier
              as_user_id: "${g1}"
              captures: { p1: $.data.id, v1: $.data.version }
            - call: "POST /grazing/pastures/${p1}/capacity-assessments"
              payload: { expected_pasture_version: "${v1}", method: "DRY_MATTER", forage_dry_matter_lbs_per_acre: 1800, utilization_pct: 25, assessment_date: "2026-07-15" }
              as: RangeConsultant
              as_user_id: "${c1}"
            - call: "GET /grazing/pastures/${p1}"
              payload: {}
              as: Grazier
              as_user_id: "${g1}"
              captures: { v2: $.data.version }
            - call: "POST /grazing/pastures/${p1}/status"
              payload: { to_status: "AVAILABLE" }
              as: Grazier
              as_user_id: "${g1}"
              captures: { v3: $.data.version }
          assert:
            - "${v1} == 1"
            - "${v2} == 2"
            - "${v3} == 3"
            - "Pasture.${p1}.version == 3 after the read-only GET"

      - name: cascading_side_effects_layer_is_exercised_end_to_end
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / drought_reading_destock_cascade_reading_to_pasture_to_contract_to_lot
          rationale: "That instance verifies a three-link chain end to end, and two sibling instances cover the other two origins."

      - name: rate_threshold_trigger_layer_is_exercised_at_the_tier_boundary
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: combinatorial_formula / base_charge_adg_tier_selection_and_gain_cap_mode_a
          rationale: "That instance pins the 1.5000 ADG tier boundary and its 1485000-cent consequence."

