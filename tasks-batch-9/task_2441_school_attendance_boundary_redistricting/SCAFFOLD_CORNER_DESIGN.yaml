  - name: projection_variants_diverge_on_the_same_pipeline
    claim_type: variant_divergence
    grounds:
    - calculations.area_enrollment_projection.variants
    - complexity_profile.complexity_layers
    excluded_because:
      difficulty_instance: dual_variant_calc / projection_variant_divergence_cohort_survival_vs_development_weighted
      rationale: Both variants are run against one identical housing pipeline and the per-area and total deltas are asserted numerically by the named §1.8 instance.
  - name: impact_index_variant_is_selected_from_the_scenario_field
    claim_type: variant_selection
    grounds:
    - calculations.demographic_impact_index.variants
    - entities.BoundaryScenario.fields.impact_variant
    excluded_because:
      difficulty_instance: dual_variant_calc / impact_index_variant_divergence_resident_vs_projected
      rationale: The named §1.8 instance builds two scenarios that differ ONLY in impact_variant and asserts each one's frl_dissimilarity_index, which is exactly the variant-selection claim.
  - name: rounding_order_is_per_development_then_summed
    claim_type: precision
    grounds:
    - calculations.area_enrollment_projection.precision
    excluded_because:
      difficulty_instance: combinatorial_formula / projection_rounds_each_development_before_summing
      rationale: The named §1.8 instance pins the rounding ORDER with three identical developments whose per-term rounding differs from rounding the sum once.
  - name: seat_pool_is_recomputed_between_promotions
    claim_type: correct_result
    grounds:
    - calculations.transfer_seat_pool
    - state_machines.TransferRequest.WAITLISTED_to_APPROVED
    excluded_because:
      difficulty_instance: combinatorial_formula / transfer_seat_pool_recomputed_between_batch_promotions
      rationale: The named §1.8 instance walks the activate cascade's waitlist promotions and asserts the pool after each one, which subsumes any single-shot seat-pool result claim.
