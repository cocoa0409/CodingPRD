        excluded_because:
          difficulty_instance: listing_conditions_revision_loop_reenters_submitted_and_caps_at_three
          rationale: "The §1.8 non_linear_state_machine instance already drives CONDITIONS_REQUESTED -> SUBMITTED three times, asserts the revision counter after each re-entry, and asserts ERR_LISTING_REVISION_LIMIT on the capped fourth attempt. A separate corner test would restate the same loop with weaker assertions."

      - name: parallel_site_order_dimensions
        claim_type: parallel
        excluded_because:
          difficulty_instance: site_order_fulfillment_and_commitment_dimensions_move_independently
          rationale: "The §1.8 non_linear_state_machine instance already walks fulfillment_status PENDING -> SCHEDULED -> IN_BUILD -> BUILT -> SHIPPED -> DELIVERED while commitment_status independently visits COMMITTED, AT_RISK and BREACHED, asserting the combined pair after each step."

