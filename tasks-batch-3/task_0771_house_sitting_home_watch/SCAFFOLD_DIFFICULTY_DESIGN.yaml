              as: Coordinator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_PROPERTY_BOOKING_OVERLAP"
            - "Booking.${bk2_id}.status == DRAFT (unchanged)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: key_custody_conservation_checkout_then_return
        grounds:
          - state_machines.KeyAssignment.AT_OFFICE_to_CHECKED_OUT
          - state_machines.KeyAssignment.CHECKED_OUT_to_RETURNED
          - entities.Property.fields.available_key_copies
          - entities.Property.fields.key_copies_total
        distinguishing_aspect: "Conserved quantity = key copies: key_copies_total (2) == available_key_copies + checked_out_count + lost_count throughout; a checkout (available 2→1) followed by its compensating return (available 1→2) leaves available_key_copies back at 2, total unchanged."
        test_recipe:
          setup:
            - "Property with key_copies_total 2 (available 2); one AT_OFFICE KeyAssignment for a sitter/booking."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /home-watch/clients"
              payload: { full_name: "Ada", email: "ada@x.com" }
              as: Coordinator
              captures: { cl_id: $.data.id }
