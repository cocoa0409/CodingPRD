  - rule_id: combinatorial_formula
    instances:
      - name: repair_replace_adjusted_ratio_branching
        grounds:
          - calculations.repair_vs_replace_recommendation
          - entities.RepairOrder.fields.recommended_outcome
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — identical cost inputs
          (actual 50000 / replacement 100000) diverge solely through the
          repair_count branch: repair_count 0 keeps adjusted_ratio at 0.5 -> FIXED,
          while repair_count 1 scales it by (1 + 0.25) to 0.625 which crosses the
          >= 0.6 threshold -> CONDEMNED.
        test_recipe:
          setup:
            - "Technician A exists; instrument I1 (SCALPEL, serial SN-R1, max_cycles 50, usage_cycles 5, replacement 100000 cents, ROUTINE) is IN_SERVICE"
            - "I1 has completed one repair cycle (flag -> send -> receive FIXED at actual_cost 50000): repair_order RO1 closed FIXED, I1.repair_count == 1"
            - "I1 flagged again -> RO2 OPEN, then sent -> SENT"
          setup_api_calls:
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/instruments", payload: { instrument_type: "SCALPEL", serial_number: "SN-R1", max_cycles: 50, usage_cycles: 5, replacement_cost_cents: 100000, criticality: "ROUTINE" }, as: FacilityAdmin, captures: { i1: "$.data.id" } }
            - { call: "POST /spd/instruments/${i1}/flag-for-repair", as: SpdTechnician, as_user_id: "${tech_a}", captures: { ro1: "$.data.id" } }
            - { call: "POST /spd/repair-orders/${ro1}/send", payload: { vendor: "VendorCo", quoted_cost_cents: 50000 }, as: FacilityAdmin }
            - { call: "POST /spd/repair-orders/${ro1}/receive", payload: { actual_cost_cents: 50000, outcome: "FIXED" }, as: FacilityAdmin }
            - { call: "POST /spd/instruments/${i1}/flag-for-repair", as: SpdTechnician, as_user_id: "${tech_a}", captures: { ro2: "$.data.id" } }
            - { call: "POST /spd/repair-orders/${ro2}/send", payload: { vendor: "VendorCo", quoted_cost_cents: 50000 }, as: FacilityAdmin }
          trigger:
            - { call: "POST /spd/repair-orders/${ro2}/receive", payload: { actual_cost_cents: 50000, outcome: "CONDEMNED" }, as: FacilityAdmin, captures: { ro2_rec: "$.data.recommended_outcome", ro2_ovr: "$.data.outcome_overridden" } }
            - { call: "GET /spd/repair-orders/${ro1}", as: Any }
            - { call: "GET /spd/instruments/${i1}", as: Any }
          assert:
            - "RO1.recommended_outcome == FIXED (ratio 0.5, repair_count 0 -> adjusted 0.5 < 0.6) and RO1.outcome_overridden == false"
            - "RO2 recommended_outcome == CONDEMNED (same costs, repair_count 1 -> 0.5 * 1.25 = 0.625 >= 0.6)"
            - "RO2 outcome_overridden == false (outcome CONDEMNED matched the recommendation)"
            - "Instrument I1.status == RETIRED after the CONDEMNED receive"

      - name: load_chargeback_per_tray_rounding_order
        grounds:
          - calculations.load_reprocessing_chargeback
          - entities.SterilizationLoad.fields.total_chargeback_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order rounds each per-tray fee
          half-up before summing — 3 PREVAC trays at raw 1237.5 cents each give
          3 * 1238 = 3714, whereas the forbidden sum-then-round order gives
          round(3712.5) = 3713; a one-cent observable divergence pinned to 3714.
          Different mode than repair_replace_adjusted_ratio_branching (mode a).
        test_recipe:
          setup:
            - "Template; sterilizer ST-P1 (STEAM_PREVAC, cap 4, 45min, level 1); technicians A (operator, PREVAC-certified) and S (supervisor)"
            - "Trays p1,p2,p3 all ASSEMBLED and loaded on load LP; LP RUNNING then COMPLETED; BI recorded NEGATIVE at 2026-05-01T03:00:00Z"
          setup_api_calls:
