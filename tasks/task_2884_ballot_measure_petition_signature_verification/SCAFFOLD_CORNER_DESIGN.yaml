            - "${final_status} == CERTIFIED and ${final_ch} == COURT_AFFIRMED - the determination that was blocked now succeeds unchanged"

      - name: post_substantiation_discipline_rejections
        claim_type: violation_to_error
        grounds:
          - validations[priority 12]
          - validations[priority 13]
          - errors[ERR_FRAUD_SUBSTANTIATED_BATCH]
          - errors[ERR_CIRCULATOR_REINSTATEMENT_BARRED]
          - errors[ERR_CIRCULATOR_REVOKED]
          - calculations.circulator_credibility_score
        distinguishing_aspect: |
          Three refusals that all follow one substantiated referral, deliberately arranged so
          the priority order between them is observable. Reinstating the referral's own batch
          is refused at priority 13 (ERR_FRAUD_SUBSTANTIATED_BATCH) while the circulator is
          only SUSPENDED; reinstating the circulator is refused at priority 12
          (ERR_CIRCULATOR_REINSTATEMENT_BARRED) because its strike count reached
          MISCONDUCT_SUSPENSION_THRESHOLD; and after revocation, reinstating a DIFFERENT,
          unrelated invalidated batch is refused at priority 12 with ERR_CIRCULATOR_REVOKED
          rather than at priority 13 - the revoked-circulator bar outranks the batch-level
          check. The credibility recompute (8000) proves the adjudicated variant took over.
