          setup:
            - "Agency DOH; BudgetCycle 2027 driven to phase EXECUTION with one ADOPTED GENERAL forecast of 10000000000 cents"
            - "GENERAL Appropriation P100 enacted 2000000000 with cash frozen by the controller, so cash_status == FROZEN and pre_freeze_cash_status == UNRELEASED"
