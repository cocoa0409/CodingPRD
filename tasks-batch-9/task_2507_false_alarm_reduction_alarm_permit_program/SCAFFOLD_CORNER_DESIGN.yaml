              captures: { err_no_variance: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_REPORTABLE_VARIANCE"
            - "ComplianceReport.${repA_id}.status is still VARIANCE_FLAGGED with correction_count 0 and its metrics unchanged (variance_pct 3.0000, period_score 0.00)"
            - "changing any single count — e.g. ecv_attempt_count 1 — makes the same call succeed with 200"

      - name: compliance_report_third_correction_is_rejected
        claim_type: Aggregate validation
        grounds:
          - validations.priority_48_business_constraint_ERR_CORRECTION_LIMIT_REACHED
          - endpoints.POST_/false-alarm-program/compliance-reports/{reportId}/correct
          - errors.ERR_CORRECTION_LIMIT_REACHED
        distinguishing_aspect: "MAX_CORRECTIONS is 2 and correction_count is evaluated BEFORE the increment, so the third correction is refused even though its counts genuinely differ (which is what keeps priority 47 from answering first)."
        test_recipe:
          setup:
            - "Guardian's August report is flagged, corrected twice (each correction re-entering review and being flagged again), leaving correction_count 2 in status VARIANCE_FLAGGED."
          setup_api_calls:
            - *k_clock
            - *k_sched
            - *k_sched_on
            - *k_co
            - *k_repA
            - *k_repA_flag
            - &k_repA_corr1
