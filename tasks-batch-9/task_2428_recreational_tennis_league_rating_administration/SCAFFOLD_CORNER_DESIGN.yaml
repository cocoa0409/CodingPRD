            - *a_xb2
            - *a_yb2
            - *a_regb
            - *a_chair
            - &a_strk_rt
              call: "POST /tennis/strikes"
              payload: {player_id: "${pa2_id}", kind: "SCORECARD_FALSIFICATION", reason: "Contested falsification finding"}
              as: LeagueCoordinator
              captures: {strk_rt_id: "$.data.id"}
          trigger:
            - call: "POST /tennis/strikes/${strk_rt_id}/rescind"
              payload: {rescinded_reason: "Committee found the falsification unproven"}
              as: CommitteeChair
              as_user_id: "${chair_id}"
          assert:
            - "HTTP 200"
            - "$.data.status == 'RESCINDED' and $.data.weight is still 3 — the row keeps its weight and stops contributing instead"
            - "GET /tennis/players/${pa2_id} returns $.data.strike_count == 0, exactly its pre-issue value"
            - "the same read returns $.data.status == 'ACTIVE', because the ledger fell below strike_limit 3"
            - "GET /tennis/roster-spots with player_id=${pa2_id} returns one item with status == 'ACTIVE', ineligible_reason == null and source_strike_id == null"
            - "GET /tennis/teams/${tma_id} returns active_roster_size 2, playoff_eligible_roster_size and roster_compliant true — all three back to their pre-issue values"
            - "GET /tennis/leagues/${lg_id} returns $.data.noncompliant_team_count == 0"
            - "GET /tennis/strikes with player_id=${pa2_id} returns total_count 1, and the same list with status=ACTIVE returns total_count 0: the row survives as history"
            - "had the player reached 6 first, the same rescission would return the ledger to 3 while a player read still showed DISQUALIFIED with the spot still INELIGIBLE, and a reinstatement attempt would return 422 with $.data.error_id == 'ERR_PLAYER_DISQUALIFIED_PERMANENT'"

  - section: consistency_model
    instances:
      - name: a_submitted_card_is_visible_everywhere_on_the_very_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /tennis/scorecards
          - calculations.team_standings_points.variants.provisional
        distinguishing_aspect: "The declared model is immediate, so the write's own response is already the authoritative post-write state and the first read that follows — with no delay, no polling and no retry — must agree with it on every derived surface: the card's own fields, the parent match's result_status, the list endpoint that indexes it and the provisional standings basis that recomputes from it per request. There is no field in this API permitted to lag, so any answer that requires a second read to become correct is a defect rather than a timing artefact."
