            - { call: "POST /api/subaward-invoices", payload: { subaward_id: "${sb}", invoice_number: "INV-2", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", current_period_direct_cents: 1000, current_period_f_and_a_cents: 0 }, as: GrantCoordinator, captures: { i2: $.data.id } }
