            - { call: "POST /entries/${e2}/safety-check", payload: { verdict: "APPROVED" }, as: SafetyOfficer }
            - { call: "POST /contestants/${c1}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c1}" }
            - { call: "POST /contestants/${c2}/consents", payload: { scope: "LIVESTREAM", granted: true }, as: Contestant, as_user_id: "${c2}" }
