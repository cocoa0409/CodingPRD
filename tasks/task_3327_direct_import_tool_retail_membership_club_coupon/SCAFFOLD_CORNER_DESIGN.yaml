              as: StoreClerk
          trigger:
            - call: "POST /sales/${sale_id}/returns"
              payload: { sale_line_id: "${line_id}", quantity: 2 }
              as: StoreClerk
            - call: "POST /sales/${sale_id}/returns"
              payload: { sale_line_id: "${line_id}", quantity: 2 }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "second return rejected: err == ERR_RETURN_QUANTITY_EXCEEDED (2 + 2 > 3)"
            - "Sale.${sale_id}.status == RETURNED_PARTIAL"
            - "Customer.${cust}.store_credit_cents == 2000"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: items_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /items?limit=2&offset=1 over 3 items returns response_type array with total_count 3, has_more false, exactly 2 data rows (offset-sliced)."
        test_recipe:
          setup: ["three items created"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "PG1", name: "P1", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.01, lead_time_days: 20, unit_weight_kg: 1.0 }
              as: PurchasingManager
            - call: "POST /items"
              payload: { sku: "PG2", name: "P2", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.01, lead_time_days: 20, unit_weight_kg: 1.0 }
              as: PurchasingManager
            - call: "POST /items"
              payload: { sku: "PG3", name: "P3", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 1000, member_price_cents: 1000, floor_margin_pct: 0.01, lead_time_days: 20, unit_weight_kg: 1.0 }
              as: PurchasingManager
          trigger:
            - call: "GET /items?limit=2&offset=1"
              payload: {}
              as: PurchasingManager
          assert:
            - "response meta.api_request_id present; response_type == array"
            - "data length == 2, total_count == 3, has_more == false"

      - name: sale_complete_empty_rejected
        claim_type: conditional_action
        grounds: ["errors[ERR_EMPTY_SALE]"]
        distinguishing_aspect: "Completing a sale with zero lines is rejected ERR_EMPTY_SALE."
        test_recipe:
          setup: ["store; customer; OPEN sale with no lines"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { store_code: "ST-EP2", name: "SE2", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 100, assortment_item_ids: [] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ep2@x.com", full_name: "EP2" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /sales/${sale_id}/complete"
              payload: {}
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_EMPTY_SALE"

      - name: second_coupon_on_same_sale_rejected
        claim_type: conditional_action
        grounds: ["errors[ERR_COUPON_ALREADY_APPLIED]"]
        distinguishing_aspect: "At most one coupon per sale: applying a second coupon to a sale that already has one is rejected ERR_COUPON_ALREADY_APPLIED."
        test_recipe:
          setup: ["item ACTIVE; store; customer; two ACTIVE coupons A and B; OPEN sale with 1 line and coupon A applied"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "EP3", name: "E3", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 2000, member_price_cents: 2000, floor_margin_pct: 0.01, lead_time_days: 20, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /stores"
              payload: { store_code: "ST-EP3", name: "SE3", format: "STANDARD", market_tier: "PRIMARY", receiving_capacity_units: 100, assortment_item_ids: ["${item_id}"] }
              as: OpsAdmin
              captures: { store_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "ep3@x.com", full_name: "EP3" }
              as: StoreClerk
              captures: { cust: $.data.id }
            - call: "POST /coupons"
              payload: { code: "CPCA", channel: "APP", audience: "ALL", discount_type: "PERCENT_OFF_BASKET", discount_value: 10, per_customer_limit: 9, budget_cents: 100000, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: MarketingManager
              captures: { ca: $.data.id }
            - call: "POST /coupons/${ca}/activate"
              payload: {}
              as: MarketingManager
            - call: "POST /coupons"
              payload: { code: "CPCB", channel: "EMAIL", audience: "ALL", discount_type: "PERCENT_OFF_BASKET", discount_value: 20, per_customer_limit: 9, budget_cents: 100000, window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: MarketingManager
              captures: { cb: $.data.id }
            - call: "POST /coupons/${cb}/activate"
              payload: {}
              as: MarketingManager
            - call: "POST /sales"
              payload: { store_id: "${store_id}", customer_id: "${cust}" }
              as: StoreClerk
              captures: { sale_id: $.data.id }
            - call: "POST /sales/${sale_id}/lines"
              payload: { item_id: "${item_id}", quantity: 1 }
              as: StoreClerk
            - call: "POST /sales/${sale_id}/apply-coupon"
              payload: { coupon_code: "CPCA" }
              as: StoreClerk
          trigger:
            - call: "POST /sales/${sale_id}/apply-coupon"
              payload: { coupon_code: "CPCB" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_COUPON_ALREADY_APPLIED"
            - "Sale.${sale_id}.applied_coupon_id == ${ca} (unchanged)"

      - name: first_receipt_requires_actual_costs
        claim_type: conditional_action
        grounds: ["errors[ERR_PO_ACTUAL_COSTS_REQUIRED]"]
        distinguishing_aspect: "The FIRST container receipt for a PO without actual_duty_cents/actual_freight_cents is rejected; a SECOND receipt of the same PO may omit them (actuals already recorded)."
        test_recipe:
          setup: ["item ACTIVE; PO issued qty 2 split across containers C1 and C2, both CLEARED"]
          setup_api_calls:
            - call: "POST /items"
              payload: { sku: "EP4", name: "E4", brand_tier: "VALUE", origin_country: "CN", unit_retail_cents: 3000, member_price_cents: 3000, floor_margin_pct: 0.01, lead_time_days: 20, unit_weight_kg: 1.0 }
              as: PurchasingManager
              captures: { item_id: $.data.id }
            - call: "POST /items/${item_id}/activate"
              payload: {}
              as: PurchasingManager
            - call: "POST /purchase-orders"
              payload:
                po_number: "PO-EP4"
                lines: [ { item_id: "${item_id}", quantity: 2, unit_cost_cents: 1000 } ]
                estimated_duty_cents: 10
                estimated_freight_cents: 10
              as: PurchasingManager
              captures: { po_id: $.data.id }
            - call: "POST /purchase-orders/${po_id}/issue"
              payload: {}
              as: PurchasingManager
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-EP4-1"
                lines: [ { item_id: "${item_id}", quantity: 1 } ]
              as: LogisticsCoordinator
              captures: { c1: $.data.id }
            - call: "POST /containers"
              payload:
                po_id: "${po_id}"
                container_number: "C-EP4-2"
                lines: [ { item_id: "${item_id}", quantity: 1 } ]
              as: LogisticsCoordinator
              captures: { c2: $.data.id }
            - call: "POST /containers/${c1}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${c1}/arrive-port"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${c1}/clear-customs"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /containers/${c2}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${c2}/arrive-port"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /containers/${c2}/clear-customs"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /containers/${c1}/receive"
              payload: {}
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /containers/${c1}/receive"
              payload: { actual_duty_cents: 50, actual_freight_cents: 50 }
              as: LogisticsCoordinator
            - call: "POST /containers/${c2}/receive"
              payload: {}
              as: LogisticsCoordinator
          assert:
            - "first attempt rejected: err == ERR_PO_ACTUAL_COSTS_REQUIRED"
            - "retry with actuals succeeds: Container.${c1}.status == RECEIVED"
            - "second container receive WITHOUT actuals succeeds: Container.${c2}.status == RECEIVED"
            - "PurchaseOrder.${po_id}.status == RECEIVED"

