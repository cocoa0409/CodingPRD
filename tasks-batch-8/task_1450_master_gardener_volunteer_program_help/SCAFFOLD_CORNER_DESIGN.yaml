      - name: rotation_complete_mints_pending_garden_entry
        claim_type: side_effect_execution
        grounds: [state_machines.RotationAssignment.ASSIGNED_to_COMPLETED]
        distinguishing_aspect: "Completing a rotation week mints a PENDING CreditEntry with activity_type GARDEN, source_type ROTATION, the reported actual_hours, and the cycle derived from the week."
        test_recipe:
          setup: ["cycle 2026 OPEN; volunteer ACTIVE; ASSIGNED assignment on BED-1 for week 2026-09-07; clock advanced past week end"]
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { year_label: "2026", start_date: "2026-01-01", end_date: "2026-12-31", admission_capacity: 5, hour_requirement: 40.0, ce_requirement: 10.0, training_module_count: 5, training_pass_quiz_average: 70.0, training_capacity: 10, recert_opens_at: "2026-11-01T00:00:00Z", priority_counties: [] }, as: ProgramCoordinator, captures: { cyc: $.data.id } }
