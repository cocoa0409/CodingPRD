            - call: "POST /approval-authorities"
              payload: { plan_id: "${plan_id}", authority_type: "DELEGATED_OFFICER", delegate_user_id: "officer-1", per_grant_share_cap: 5000, aggregate_share_cap: 10000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: BoardMember
              as_user_id: "board-1"
              captures: { a_id: $.data.id }
            - call: "POST /participants"
