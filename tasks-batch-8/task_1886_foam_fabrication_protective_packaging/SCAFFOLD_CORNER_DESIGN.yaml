            - { call: "POST /api/drop-tests/${dt_id}/record", payload: { measured_peak_g: 55 }, as: QualityEngineer }
            - { call: "POST /api/package-specs/${spec_id}/approve", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "GET /api/package-specs/${spec_id}", as: DesignEngineer, captures: { spec_v: $.data.version } }
            - { call: "POST /api/cut-programs", payload: { package_spec_id: "${spec_id}", method: "CNC_ROUTE", machine_seconds_per_part: 40, expected_package_spec_version: "${spec_v}" }, as: DesignEngineer, captures: { cp_id: $.data.id } }
            - { call: "POST /api/cut-programs/${cp_id}/nest", payload: {}, as: DesignEngineer }
            - { call: "POST /api/cut-programs/${cp_id}/lock", payload: {}, as: DesignEngineer }
            - { call: "POST /api/inventory-programs", payload: { customer_id: "${cust_id}", package_spec_id: "${spec_id}", pricing_mode: "CURRENT", max_stock_qty: 500, reorder_point_qty: 100, min_release_qty: 50 }, as: SalesEngineer, captures: { prog: $.data.id } }
            - { call: "POST /api/inventory-programs/${prog}/activate", payload: {}, as: SalesEngineer }
            - { call: "POST /api/inventory-programs/${prog}/replenish", payload: { qty: 300 }, as: PlantManager, captures: { rpo: $.data.id } }
            - { call: "POST /api/production-orders/${rpo}/confirm", payload: { machine_id: "CNC-1", window_start: "2026-08-04T08:00:00Z", window_end: "2026-08-04T09:00:00Z" }, as: SalesEngineer }
            - { call: "POST /api/production-orders/${rpo}/start", payload: {}, as: PlantManager }
            - { call: "POST /api/production-orders/${rpo}/complete", payload: {}, as: PlantManager }
            - { call: "POST /api/release-orders", payload: { inventory_program_id: "${prog}", qty: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { rel1: $.data.id } }
