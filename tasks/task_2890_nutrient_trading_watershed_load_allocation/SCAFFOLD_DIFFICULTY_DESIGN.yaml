      - name: adaptive_review_windows_require_one_clear_day_and_adjacency_is_rejected
        grounds:
          - validations[priority=16]
          - errors[ERR_REVIEW_WINDOW_CONFLICT]
          - entities.AdaptiveReview.fields.period_start_date
          - entities.AdaptiveReview.fields.period_end_date
        distinguishing_aspect: |
          The opposite convention from the practice-project instance on purpose: AdaptiveReview
          windows are CLOSED and additionally demand REVIEW_GAP_DAYS = 1 clear calendar day of
          separation, so back-to-back windows that would be legal for practice projects are
          rejected here, in both directions (a window starting the day after an incumbent ends,
          and a window ending the day before an incumbent starts). The gap is also re-evaluated
          against reviews created earlier in the same test, so an implementation that snapshots
          the review list once will wrongly accept the final call.
        test_recipe:
          setup:
            - "Watershed SCR exists (program_status PROVISIONAL is sufficient; review scheduling is not a trading operation)."
            - "AdaptiveReview AR-1 covers the closed window 2026-01-01..2026-06-30 in status OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /watersheds/${w_id}/adaptive-reviews"
              payload: { review_label: "AR-1", period_start_date: "2026-01-01", period_end_date: "2026-06-30" }
              as: ProgramAdministrator
              captures: { ar_1_id: $.data.id }
          trigger:
            - call: "POST /watersheds/${w_id}/adaptive-reviews"
              payload: { review_label: "AR-TOUCH-AFTER", period_start_date: "2026-07-01", period_end_date: "2026-12-31" }
              as: ProgramAdministrator
            - call: "POST /watersheds/${w_id}/adaptive-reviews"
              payload: { review_label: "AR-TOUCH-BEFORE", period_start_date: "2025-07-01", period_end_date: "2025-12-31" }
              as: ProgramAdministrator
            - call: "POST /watersheds/${w_id}/adaptive-reviews"
              payload: { review_label: "AR-BEFORE-OK", period_start_date: "2025-07-01", period_end_date: "2025-12-30" }
              as: ProgramAdministrator
              captures: { ar_before_id: $.data.id }
            - call: "POST /watersheds/${w_id}/adaptive-reviews"
              payload: { review_label: "AR-AFTER-OK", period_start_date: "2026-07-02", period_end_date: "2026-12-31" }
              as: ProgramAdministrator
              captures: { ar_after_id: $.data.id }
            - call: "POST /watersheds/${w_id}/adaptive-reviews"
              payload: { review_label: "AR-TOUCH-NEW", period_start_date: "2027-01-01", period_end_date: "2027-06-30" }
              as: ProgramAdministrator
          assert:
            - "AdaptiveReview.${ar_1_id}.status == OPEN"
            - "trigger call 1 responds 409 with data.error_id == ERR_REVIEW_WINDOW_CONFLICT (2026-07-01 is not strictly after 2026-06-30 + 1 day)"
            - "trigger call 2 responds 409 with data.error_id == ERR_REVIEW_WINDOW_CONFLICT (2025-12-31 + 1 day is not strictly before 2026-01-01)"
            - "trigger call 3 responds 201 (2025-12-30 + 1 day == 2025-12-31 < 2026-01-01)"
            - "AdaptiveReview.${ar_before_id}.period_end_date == 2025-12-30 and status == OPEN"
            - "trigger call 4 responds 201 (2026-07-02 > 2026-07-01)"
            - "AdaptiveReview.${ar_after_id}.period_start_date == 2026-07-02 and status == OPEN"
            - "trigger call 5 responds 409 with data.error_id == ERR_REVIEW_WINDOW_CONFLICT (the conflict is with AR-AFTER-OK, created during this same test, whose window ends 2026-12-31)"
            - "GET /adaptive-reviews?watershed_id=${w_id} returns meta.total_count == 3"

  - rule_id: compensating_invariant
    instances:
      - name: credit_mass_invariant_restored_exactly_by_voiding_a_proposed_and_an_approved_transaction
        grounds:
          - state_machines.CreditTransaction.PROPOSED_to_VOIDED
          - state_machines.CreditTransaction.APPROVED_to_VOIDED
          - state_machines.CreditTransaction.PROPOSED_to_APPROVED
          - entities.CreditBatch.fields.available_lbs
          - entities.CreditBatch.fields.reserved_lbs
          - entities.CreditBatch.fields.retired_lbs
          - entities.Watershed.fields.reserve_pool_lbs
          - calculations.credit_transaction_delivery
        distinguishing_aspect: |
          The invariant `issued_lbs == available_lbs + reserved_lbs + retired_lbs +
          invalidated_lbs` must hold at every one of five intermediate points, and the two void
          paths compensate DIFFERENT buckets: voiding a PROPOSED transaction returns
          requested_gross_lbs from reserved to available and must NOT touch
          Watershed.reserve_pool_lbs, while voiding an APPROVED transaction returns
          settled_gross_lbs from retired to available AND must debit the reserve pool by
          retired_to_reserve_lbs and unwind Permit.credit_applied_lbs. After both voids every
          amount is back to its pre-transaction value with no cent of drift, even though the
          row versions have all advanced.
        test_recipe:
          setup:
            - "Watershed SCR is ACTIVE via an APPROVED TMDL whose PROVISIONAL allocation run left reserve_pool_lbs at 2400.00; retirement_ratio 0.1000, equivalence_ratio 1.0000, uncertainty_ratio 2.0000."
            - "Permit OH0012345 is INTERIM with applicable_limit_lbs_yr 23916.00 and reported_annual_load_lbs 25000.00, so compliance_status is SHORTFALL with compliance_gap_lbs 1084.00 and credit_applied_lbs 0.00."
            - "CreditBatch A (from CERTIFIED PP-A on R_UP, verified_acres 80.00) is LISTED with issued_lbs 520, available_lbs 520.00, reserved_lbs 0.00, retired_lbs 0.00, invalidated_lbs 0.00 and verified_ratio 1.0000."
            - "The delivery path R_UP -> R_MID stops at the buyer's reach R_MID, so delivery_ratio is 0.9000 with path_reach_count 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_UP", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_mid_id}" }
              as: TmdlAnalyst
              captures: { r_up_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_mid_id}", source_name: "City WWTP", source_type: "POINT", existing_load_lbs_yr: 20000.00, controllability_index: 0.8000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_p1_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_out_id}", source_name: "Village WWTP", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Cropland", source_type: "NONPOINT", existing_load_lbs_yr: 30000.00, controllability_index: 0.4000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Pasture", source_type: "NONPOINT", existing_load_lbs_yr: 10000.00, controllability_index: 0.3000, status: "INVENTORIED" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-PROVISIONAL", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "PUBLIC_COMMENT" }
              as: TmdlAnalyst
            - call: "POST /tmdl-assessments/${t_id}/status"
              payload: { target_status: "APPROVED" }
              as: TmdlAnalyst
            - call: "POST /permits"
              payload: { watershed_id: "${w_id}", source_assessment_id: "${sa_p1_id}", permit_number: "OH0012345", permittee_user_id: "user-permittee-1", design_flow_mgd: 5.0000, effective_date: "2026-03-01", current_annual_load_lbs: 30000.00 }
              as: PermitWriter
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/derive-limits"
              payload: {}
              as: PermitWriter
            - call: "POST /permits/${permit_id}/annual-report"
              payload: { reported_annual_load_lbs: 25000.00, reporting_period_year: 2026 }
              as: Permittee
              as_user_id: "user-permittee-1"
            - call: "POST /producers"
              payload: { legal_name: "Bluegrass Farms LLC", county_code: "OH-041", contact_email: "ops@bluegrass.example" }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /practice-projects"
              payload: { producer_id: "${prod_id}", reach_id: "${r_up_id}", tract_code: "T-101", practice_type: "COVER_CROP", enrolled_acres: 100.00, baseline_met: true, pre_load_lbs_yr: 950.50, post_load_lbs_yr: 300.00, effective_start_date: "2026-01-01", effective_end_date: "2027-01-01", vintage_year: 2026 }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pp_a_id: $.data.id }
            - call: "POST /verification-events"
              payload: { practice_project_id: "${pp_a_id}", event_type: "BASELINE", outcome: "PASS", narrative: "Baseline soil sampling complete on tract T-101." }
              as: PracticeVerifier
              as_user_id: "verifier-1"
            - call: "POST /verification-events"
              payload: { practice_project_id: "${pp_a_id}", event_type: "IMPLEMENTATION", outcome: "PASS", narrative: "Cover crop stand confirmed on 80 acres.", verified_acres: 80.00 }
              as: PracticeVerifier
              as_user_id: "verifier-2"
            - call: "POST /practice-projects/${pp_a_id}/certify"
              payload: {}
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { batch_a_id: $.data.id }
            - call: "POST /credit-batches/${batch_a_id}/list"
              payload: {}
              as: RegistryAdministrator
              as_user_id: "registry-1"
            - call: "GET /credit-batches/${batch_a_id}"
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { batch_a_ver1: $.data.version }
          trigger:
            - call: "POST /credit-transactions"
              payload: { credit_batch_id: "${batch_a_id}", permit_id: "${permit_id}", requested_gross_lbs: 500.00, reporting_period_year: 2026, expected_credit_batch_version: "${batch_a_ver1}" }
              as: Permittee
              as_user_id: "user-permittee-1"
              captures: { txn_1_id: $.data.id }
            - call: "POST /credit-transactions/${txn_1_id}/approve"
              payload: {}
              as: RegistryAdministrator
              as_user_id: "registry-1"
            - call: "GET /credit-batches/${batch_a_id}"
              as: RegistryAdministrator
              as_user_id: "registry-1"
              captures: { batch_a_ver2: $.data.version }
            - call: "POST /credit-transactions"
              payload: { credit_batch_id: "${batch_a_id}", permit_id: "${permit_id}", requested_gross_lbs: 20.00, reporting_period_year: 2026, expected_credit_batch_version: "${batch_a_ver2}" }
              as: Permittee
              as_user_id: "user-permittee-1"
              captures: { txn_2_id: $.data.id }
            - call: "POST /credit-transactions/${txn_2_id}/void"
              payload: { reason: "Permittee withdrew the second purchase." }
              as: RegistryAdministrator
              as_user_id: "registry-1"
            - call: "POST /credit-transactions/${txn_1_id}/void"
              payload: { reason: "Registry unwound the settled purchase after an audit." }
              as: RegistryAdministrator
              as_user_id: "registry-1"
          assert:
            - "after trigger call 1: CreditTransaction.${txn_1_id}.status == PROPOSED, delivery_ratio == 0.9000, path_reach_count == 2, retired_to_reserve_lbs == 50.00, tradable_lbs == 450.00, proposed_delivered_lbs == 202.50, permit_gap_at_proposal_lbs == 1084.00, applied_lbs is null"
            - "after trigger call 1: CreditBatch.${batch_a_id}.available_lbs == 20.00, reserved_lbs == 500.00, retired_lbs == 0.00, invalidated_lbs == 0.00 (sum 520.00 == issued_lbs)"
            - "after trigger call 1: Watershed.${w_id}.reserve_pool_lbs == 2400.00 (a PROPOSED transaction never credits the reserve pool)"
            - "after trigger call 2: CreditTransaction.${txn_1_id}.status == APPROVED, settled_gross_lbs == 500.00, settled_delivered_lbs == 202.50, applied_lbs == 202.50"
            - "after trigger call 2: CreditBatch.${batch_a_id}.available_lbs == 20.00, reserved_lbs == 0.00, retired_lbs == 500.00, invalidated_lbs == 0.00 (sum 520.00)"
            - "after trigger call 2: Watershed.${w_id}.reserve_pool_lbs == 2450.00"
            - "after trigger call 2: Permit.${permit_id}.credit_applied_lbs == 202.50, compliance_gap_lbs == 881.50, compliance_status == SHORTFALL (the gap did not close, so no move to RESOLVED)"
            - "after trigger call 4: CreditTransaction.${txn_2_id}.proposed_delivered_lbs == 8.10 and permit_gap_at_proposal_lbs == 881.50"
            - "after trigger call 4: CreditBatch.${batch_a_id}.available_lbs == 0.00, reserved_lbs == 20.00, retired_lbs == 500.00, invalidated_lbs == 0.00 (sum 520.00)"
            - "after trigger call 5: CreditTransaction.${txn_2_id}.status == VOIDED with void_reason == REGISTRY_ACTION and voided_at == 2026-06-15T00:00:00Z"
            - "after trigger call 5: CreditBatch.${batch_a_id}.available_lbs == 20.00, reserved_lbs == 0.00, retired_lbs == 500.00, invalidated_lbs == 0.00 (sum 520.00)"
            - "after trigger call 5: Watershed.${w_id}.reserve_pool_lbs == 2450.00 (unchanged: voiding a PROPOSED transaction must not debit the reserve)"
            - "after trigger call 5: Permit.${permit_id}.credit_applied_lbs == 202.50 and compliance_gap_lbs == 881.50 (untouched)"
            - "after trigger call 6: CreditTransaction.${txn_1_id}.status == VOIDED with void_reason == REGISTRY_ACTION"
            - "after trigger call 6: CreditBatch.${batch_a_id}.available_lbs == 520.00, reserved_lbs == 0.00, retired_lbs == 0.00, invalidated_lbs == 0.00 (sum 520.00 == issued_lbs, fully restored)"
            - "after trigger call 6: Watershed.${w_id}.reserve_pool_lbs == 2400.00 (debited by retired_to_reserve_lbs 50.00, back to the pre-transaction value)"
            - "after trigger call 6: Permit.${permit_id}.credit_applied_lbs == 0.00, compliance_gap_lbs == 1084.00, compliance_status == SHORTFALL, enforcement_flag == false"
            - "after trigger call 6: CreditBatch.${batch_a_id}.issued_lbs == 520 and status == LISTED (mass and lifecycle unchanged by the round trip)"
            - "after trigger call 6: CreditBatch.${batch_a_id}.version > ${batch_a_ver2} (every bucket movement bumped the version even though the amounts returned to their starting values)"

      - name: load_conservation_restored_by_rescinding_an_allocation_run_but_refused_once_a_permit_relies_on_it
        grounds:
          - state_machines.AllocationRun.ACTIVE_to_RESCINDED
          - validations[priority=23]
          - errors[ERR_ALLOCATION_RUN_IN_USE]
          - calculations.wasteload_allocation_run
          - entities.Watershed.fields.reserve_pool_lbs
          - entities.SourceAssessment.fields.allocated_load_lbs_yr
        distinguishing_aspect: |
          A different invariant and a different compensation shape from the credit-mass
          instance: the quantity conserved here is the loading capacity itself
          (margin_of_safety + background + wla_total + la_total + reserve_allocation ==
          loading_capacity), spread across a TmdlAssessment, four SourceAssessment rows and the
          Watershed reserve pool. Rescinding zeroes all five contributions and nulls the
          per-source allocations so the conservation identity degenerates cleanly, a re-run
          rebuilds it to the identical cents, and the compensation is then REFUSED with
          ERR_ALLOCATION_RUN_IN_USE once a Permit has derived interim limits from it — with
          zero partial mutation, which is what makes the invariant safe rather than merely
          reversible.
        test_recipe:
          setup:
            - "Watershed SCR (baseline 120000.00, reserve_pool_lbs 0.00 before any run) with reaches R_OUT (COMPLIANCE_POINT, df 1.0000), R_MID (MAINSTEM, df 0.9000) and R_UP (HEADWATER, df 0.8000)."
            - "TmdlAssessment TMDL-P-2026 in DRAFT: loading capacity 60000.00, margin_of_safety_pct 0.1000, background 6000.00."
            - "Four INVENTORIED sources: City WWTP (POINT, R_MID, 20000.00), Village WWTP (POINT, R_OUT, 5000.00), Upper Cropland (NONPOINT, R_UP, 30000.00), Upper Pasture (NONPOINT, R_UP, 10000.00)."
            - "One ACTIVE PRO_RATA_BY_EXISTING_LOAD run has already allocated: mos 6000.00, allocable 48000.00, point pool 27360.00, nonpoint pool 18240.00, wla_total 27360.00, la_total 18240.00, reserve_allocation 2400.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, interim_target_pct: 25.00, uncertainty_ratio: 2.0000, retirement_ratio: 0.1000, equivalence_ratio: 1.0000, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_MID", trading_zone_code: "Z2", reach_class: "MAINSTEM", delivery_factor: 0.9000, downstream_reach_id: "${r_out_id}" }
              as: TmdlAnalyst
              captures: { r_mid_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_UP", trading_zone_code: "Z1", reach_class: "HEADWATER", delivery_factor: 0.8000, downstream_reach_id: "${r_mid_id}" }
              as: TmdlAnalyst
              captures: { r_up_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_mid_id}", source_name: "City WWTP", source_type: "POINT", existing_load_lbs_yr: 20000.00, controllability_index: 0.8000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_p1_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_out_id}", source_name: "Village WWTP", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_p2_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Cropland", source_type: "NONPOINT", existing_load_lbs_yr: 30000.00, controllability_index: 0.4000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_n1_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_up_id}", source_name: "Upper Pasture", source_type: "NONPOINT", existing_load_lbs_yr: 10000.00, controllability_index: 0.3000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_n2_id: $.data.id }
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-1", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
              captures: { run_1_id: $.data.id }
          trigger:
            - call: "POST /allocation-runs/${run_1_id}/rescind"
              payload: { reason: "Loading capacity re-opened for public comment." }
              as: TmdlAnalyst
            - call: "GET /tmdl-assessments/${t_id}"
              as: TmdlAnalyst
              captures: { t_ver2: $.data.version }
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-2", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver2}" }
              as: TmdlAnalyst
              captures: { run_2_id: $.data.id }
            - call: "POST /permits"
              payload: { watershed_id: "${w_id}", source_assessment_id: "${sa_p1_id}", permit_number: "OH0012345", permittee_user_id: "user-permittee-1", design_flow_mgd: 5.0000, effective_date: "2026-03-01", current_annual_load_lbs: 30000.00 }
              as: PermitWriter
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/derive-limits"
              payload: {}
              as: PermitWriter
            - call: "POST /allocation-runs/${run_2_id}/rescind"
              payload: { reason: "Second attempt to re-open the allocation." }
              as: TmdlAnalyst
          assert:
            - "before trigger call 1: 6000.00 + 6000.00 + 27360.00 + 18240.00 + 2400.00 == 60000.00 (conservation holds against loading_capacity_lbs_yr)"
            - "before trigger call 1: Watershed.${w_id}.reserve_pool_lbs == 2400.00, allocated_wla_total_lbs_yr == 27360.00, allocated_la_total_lbs_yr == 18240.00"
            - "trigger call 1 responds 200 with data.status == RESCINDED and data.rescinded_at == 2026-06-15T00:00:00Z"
            - "after trigger call 1: SourceAssessment.${sa_p1_id}.allocated_load_lbs_yr is null and allocation_run_id is null"
            - "after trigger call 1: SourceAssessment.${sa_p2_id}.allocated_load_lbs_yr is null, SourceAssessment.${sa_n1_id}.allocated_load_lbs_yr is null, SourceAssessment.${sa_n2_id}.allocated_load_lbs_yr is null"
            - "after trigger call 1: TmdlAssessment.${t_id}.margin_of_safety_lbs_yr == 0.00, allocable_load_lbs_yr == 0.00, wla_total_lbs_yr == 0.00, la_total_lbs_yr == 0.00, reserve_allocation_lbs_yr == 0.00, effective_background_lbs_yr is null, allocation_variant is null"
            - "after trigger call 1: Watershed.${w_id}.reserve_pool_lbs == 0.00, allocated_wla_total_lbs_yr == 0.00, allocated_la_total_lbs_yr == 0.00"
            - "after trigger call 3: AllocationRun.${run_2_id}.allocable_load_lbs_yr == 48000.00, point_pool_lbs_yr == 27360.00, nonpoint_pool_lbs_yr == 18240.00, wla_total_lbs_yr == 27360.00, la_total_lbs_yr == 18240.00, reserve_allocation_lbs_yr == 2400.00"
            - "after trigger call 3: SourceAssessment.${sa_p1_id}.allocated_load_lbs_yr == 21888.00, SourceAssessment.${sa_p2_id}.allocated_load_lbs_yr == 5472.00, SourceAssessment.${sa_n1_id}.allocated_load_lbs_yr == 13680.00, SourceAssessment.${sa_n2_id}.allocated_load_lbs_yr == 4560.00"
            - "after trigger call 3: Watershed.${w_id}.reserve_pool_lbs == 2400.00 (rebuilt to the identical cent, not doubled)"
            - "after trigger call 5: Permit.${permit_id}.limit_status == INTERIM and Permit.${permit_id}.wla_lbs_yr == 21888.00"
            - "trigger call 6 responds 409 with data.error_id == ERR_ALLOCATION_RUN_IN_USE"
            - "after trigger call 6: AllocationRun.${run_2_id}.status == ACTIVE and rescinded_at is null"
            - "after trigger call 6: SourceAssessment.${sa_p1_id}.allocated_load_lbs_yr == 21888.00 and allocation_run_id == ${run_2_id} (no partial mutation)"
            - "after trigger call 6: Watershed.${w_id}.reserve_pool_lbs == 2400.00 and TmdlAssessment.${t_id}.reserve_allocation_lbs_yr == 2400.00"
