        claim_type: Violation -> Error
        grounds: ["errors[ERR_PASS_NOT_ACTIVE]", "state_machines.RidePass.ACTIVE_to_REFUNDED", "validations[priority=10]"]
        distinguishing_aspect: |
          REFUNDED is terminal, so the second refund answers ERR_PASS_NOT_ACTIVE 409 and must not overwrite
          refund_amount_cents or refund_basis with a second settlement.
        test_recipe:
          setup:
            - "An INNER pass owned by rider-ann with 4 rides bought for 4000 cents, already refunded on the PRO_RATA basis for 4000 cents."
          setup_api_calls:
            - call: "POST /harbor/ride-passes"
              payload: { zone_tier: "INNER", rides_purchased: 4, purchase_price_cents: 4000, valid_until: "2026-12-31" }
              as: Rider
              as_user_id: "rider-ann"
              captures: { pass_id: $.data.id }
            - call: "POST /harbor/ride-passes/${pass_id}/refund"
              payload: { settlement_basis: "PRO_RATA" }
              as: Rider
              as_user_id: "rider-ann"
          trigger:
            - call: "POST /harbor/ride-passes/${pass_id}/refund"
