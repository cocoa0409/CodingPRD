# =============================================================================
# Task 1224 — Vessel Agency & Port Call Coordination
# Difficulty: HARDER THAN EXPERT (per difficulty parameter in scenario)
# =============================================================================

scenario: |
  generate task hard than expert level! 1224. Vessel Agency & Port Call Coordination (port agency firm): pre-arrival documentation & authority notification, berth booking & pilot/tug ordering, crew change, visa & shore pass arrangement, provisioning/bunker/repair vendor coordination, disbursement account estimate & final accounting, cargo document handling (bill of lading release), husbandry issues (medical/repatriation), port cost dispute resolution

domain_name: vessel-agency-port-calls
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation        # pro-forma DA estimate vs final accounting diverge on identical call data
  secondary_archetype: posture_driven_gating       # PortCall ops posture + funding/docs/safety gates block child and transition ops
  complexity_layers:
    - optimistic_concurrency                       # OCC on PortCall.version for DA supersede-create and ETA patch
    - dual_variant_calculation                     # estimate-vs-final DA accounting; forward-vs-cash principal exposure
    - cascading_side_effects                       # port-call cancel and PO dispute chains of depth >= 3
    - version_pinning_on_approval                  # DA estimate pins tariff version; final accounting uses tariff published at sailing
  entity_topology: flat                            # peer entities linked by foreign keys; no URL nesting
  state_machine_shape: cyclic                      # dispute/resubmission loops dominate (PO, DA, AuthorityNotification, CargoDocument, CrewChange)
  relationship_patterns:
    - one_to_many                                  # PortCall -> notifications/windows/orders/crew/docs/DA
    - cross_aggregate                              # BerthWindow.berth_code and ServiceOrder.resource_unit are shared resources across port calls
    - polymorphic                                  # DALine.source_ref points at ServiceOrder, PurchaseOrder, or Tariff-derived origin
  role_model: hierarchical_override                # AgencyAdmin superset + segregation_of_duties on DA finalize
  consistency_model: immediate                     # every mutation (incl. cascades) atomic within its request

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Principal
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shipping company / operator legal name" }
      - { name: contact_email, type: string, source: input, description: "Primary operations contact email" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Credit ceiling in cents; 0 means unlimited" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; new principals start ACTIVE", default: ACTIVE }

  - name: PortCall
    parent: null
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id; owning customer of this call" }
      - { name: vessel_name, type: string, source: input, description: "Vessel name" }
      - { name: imo_number, type: string, source: input, description: "IMO number, 7 digits as string" }
      - { name: vessel_gt, type: integer, source: input, description: "Gross tonnage; drives port dues tiers; must be > 0" }
      - { name: flag_state, type: string, source: input, description: "Flag state ISO code" }
      - { name: port_code, type: string, source: input, description: "UN/LOCODE of the port, e.g. SINGA" }
      - { name: eta, type: datetime, source: input, description: "Estimated time of arrival (UTC)" }
      - { name: etd, type: datetime, source: input, description: "Estimated time of departure (UTC); must be > eta" }
      - { name: hazmat_flag, type: boolean, source: input, default: false, description: "Whether any hazmat cargo aboard; drives dues surcharge" }
      - { name: cargo_description, type: string, source: input, description: "Free-text cargo summary" }
      - { name: ops_status, type: enum, source: system, description: "NOMINATED | PRE_ARRIVAL_FILED | CLEARED_TO_ENTER | ALONGSIDE | SAILED | CLOSED | CANCELLED", default: NOMINATED }
      - { name: actual_arrival_at, type: datetime, source: system, description: "Set from logical clock by record-arrival; null until then", default: null }
      - { name: actual_sailed_at, type: datetime, source: system, description: "Set from logical clock by record-sailing; null until then", default: null }
      - { name: alongside_days_estimated, type: integer, source: computed, description: "ceil((etd - eta) hours / 24), min 1" }
      - { name: alongside_days_actual, type: integer, source: computed, description: "ceil((actual_sailed_at - actual_arrival_at) hours / 24), min 1; null until sailed", default: null }

  - name: AuthorityNotification
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call this notification serves" }
      - { name: authority_type, type: enum, source: input, description: "PORT_STATE_CONTROL | IMMIGRATION | CUSTOMS | HARBOR_MASTER; unique per port call (ERR_DUPLICATE_NOTIFICATION_TYPE)" }
      - { name: payload_summary, type: string, source: input, description: "Free-text summary of the filing package" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | REJECTED | WITHDRAWN", default: DRAFT }
      - { name: authority_reference, type: string, source: system, description: "Reference number supplied at acknowledge; null until ACKNOWLEDGED", default: null }
      - { name: rejection_reason, type: string, source: system, description: "Reason recorded at reject; null otherwise", default: null }
      - { name: revision_count, type: integer, source: system, description: "Number of resubmissions; increments on each resubmit", default: 0 }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of latest submission", default: null }

  - name: BerthWindow
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call this booking serves" }
      - { name: berth_code, type: string, source: input, description: "Shared berth resource identifier, e.g. BERTH-04; windows on the same code across ALL port calls compete" }
      - { name: start_at, type: datetime, source: input, description: "Window start (UTC); must be < end_at" }
      - { name: end_at, type: datetime, source: input, description: "Window end (UTC); half-open interval [start_at, end_at)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | OCCUPIED | RELEASED | CANCELLED", default: REQUESTED }
      - { name: occupied_at, type: datetime, source: system, description: "Logical-clock timestamp of occupy", default: null }
      - { name: released_at, type: datetime, source: system, description: "Logical-clock timestamp of release", default: null }

  - name: ServiceOrder
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call this order serves" }
      - { name: kind, type: enum, source: input, description: "PILOT | TUG | LINEBOAT | LAUNCH" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; required for TUG/LINEBOAT/LAUNCH, must be omitted for PILOT (pilots are port-authority resources)", default: null }
      - { name: resource_unit, type: string, source: input, description: "Shared physical unit, e.g. PILOT-BOAT-1 or TUG-7; same-unit orders compete with a 45-minute turnaround buffer" }
      - { name: window_start, type: datetime, source: input, description: "Requested service window start (UTC); must be < window_end" }
      - { name: window_end, type: datetime, source: input, description: "Requested service window end (UTC)" }
      - { name: quantity, type: integer, source: input, default: 1, description: "Units ordered (e.g. number of tugs); must be >= 1" }
      - { name: estimated_cents, type: integer, source: input, description: "Quoted cost; feeds DA line estimate; must be >= 0" }
      - { name: actual_cents, type: integer, source: system, description: "Set by complete; null until COMPLETED", default: null }
      - { name: cancellation_fee_cents, type: integer, source: system, description: "25% of estimated_cents when cancelled strictly inside the 2-hour cutoff, else 0", default: 0 }
      - { name: status, type: enum, source: system, description: "ORDERED | CONFIRMED | IN_PROGRESS | COMPLETED | CANCELLED", default: ORDERED }

  - name: CrewChange
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call this movement belongs to" }
      - { name: full_name, type: string, source: input, description: "Crew member full name" }
      - { name: nationality, type: string, source: input, description: "ISO country code of nationality" }
      - { name: passport_no, type: string, source: input, description: "Passport number" }
      - { name: passport_expiry, type: datetime, source: input, description: "Passport expiry date; must be strictly after the port call etd" }
      - { name: direction, type: enum, source: input, description: "ON_SIGNER | OFF_SIGNER" }
      - { name: requires_visa, type: boolean, source: input, description: "Whether a visa is required; selects the DOCS_VERIFIED branch" }
      - { name: status, type: enum, source: system, description: "REQUESTED | DOCS_VERIFIED | VISA_PENDING | VISA_GRANTED | SHORE_PASS_ISSUED | PASS_EXPIRED | COMPLETED | CANCELLED | REPATRIATED", default: REQUESTED }
      - { name: visa_reference, type: string, source: system, description: "Set at grant-visa", default: null }
      - { name: shore_pass_expires_at, type: datetime, source: system, description: "Set at issue-shore-pass; system flips SHORE_PASS_ISSUED -> PASS_EXPIRED when clock passes it", default: null }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor legal name" }
      - { name: categories, type: array, source: input, description: "Non-empty subset of PROVISIONS | BUNKERS | REPAIRS | STORES" }
      - { name: contact_email, type: string, source: input, description: "Vendor contact" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call this order provisions" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; supplier" }
      - { name: category, type: enum, source: input, description: "PROVISIONS | BUNKERS | REPAIRS | STORES; must be in vendor.categories" }
      - { name: estimated_cents, type: integer, source: input, description: "Order estimate; mirrored onto a DA line while DA is editable; must be > 0" }
      - { name: needed_by, type: datetime, source: input, description: "Required delivery time (UTC)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT | ACKNOWLEDGED | DELIVERED | INVOICED | DISPUTED | MATCHED | CANCELLED", default: DRAFT }
      - { name: invoiced_cents, type: integer, source: system, description: "Latest vendor invoice amount; set by invoice/reinvoice", default: null }
      - { name: variance_pct, type: number, source: computed, description: "(invoiced_cents - estimated_cents) / estimated_cents * 100, 2dp half-up; null until invoiced", default: null }
      - { name: da_line_id, type: string, source: system, description: "FK -> DALine.id; the DA line mirroring this PO; null until a DA line exists", default: null }

  - name: CargoDocument
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call this document belongs to" }
      - { name: doc_type, type: enum, source: input, description: "BILL_OF_LADING | CARGO_MANIFEST | DELIVERY_ORDER" }
      - { name: bl_number, type: string, source: input, description: "Document/B/L number; unique per port call (ERR_DUPLICATE_BL_NUMBER)" }
      - { name: consignee_name, type: string, source: input, description: "Consignee legal name" }
      - { name: freight_paid, type: boolean, source: input, default: false, description: "Freight-prepaid flag; gates B/L release" }
      - { name: status, type: enum, source: system, description: "RECEIVED | VERIFIED | ON_HOLD | RELEASED", default: RECEIVED }

  - name: Tariff
    parent: null
    common_fields: true
    fields:
      - { name: port_code, type: string, source: input, description: "UN/LOCODE the tariff applies to" }
      - { name: component, type: enum, source: input, description: "PORT_DUES | BERTH_HIRE | PILOTAGE" }
      - { name: effective_from, type: datetime, source: input, description: "Effective start (UTC), informational" }
      - { name: night_surcharge_pct, type: number, source: input, description: "Fraction added to base when arrival hour is in [18:00, 06:00) UTC; e.g. 0.25" }
      - { name: hazmat_surcharge_pct, type: number, source: input, description: "Fraction added to base for hazmat calls; e.g. 0.40" }
      - { name: gt_tiers, type: array, source: input, description: "Marginal tiers [{gt_up_to: integer|null, rate_cents: number}]; ascending; null gt_up_to = unbounded last tier; rate = cents per GT-day" }
      - { name: status, type: enum, source: system, description: "PUBLISHED | SUPERSEDED; creating a tariff supersedes all PUBLISHED tariffs with same (port_code, component)", default: PUBLISHED }

  - name: DisbursementAccount
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; exactly one non-SUPERSEDED DA per port call" }
      - { name: status, type: enum, source: system, description: "PRO_FORMA | SENT_TO_PRINCIPAL | FUNDED | FINAL | DISPUTED | SETTLED | SUPERSEDED", default: PRO_FORMA }
      - { name: total_estimated_cents, type: integer, source: computed, description: "Sum of estimated_cents over all lines + agency fee estimate; recomputed on every line mutation" }
      - { name: agency_fee_estimated_cents, type: integer, source: computed, description: "2.5% of each non-AGENCY_FEE line estimate, rounded per line half-up, then summed" }
      - { name: advance_required_cents, type: integer, source: computed, description: "round_half_up(0.80 * total_estimated_cents)" }
      - { name: advances_received_cents, type: integer, source: computed, description: "Sum of amount_cents over FundingAdvances in {RECEIVED, APPLIED}", default: 0 }
      - { name: advances_applied_cents, type: integer, source: computed, description: "Sum of applied_cents over all FundingAdvances", default: 0 }
      - { name: advances_refunded_cents, type: integer, source: computed, description: "Sum of refunded_cents over all FundingAdvances", default: 0 }
      - { name: funding_available_cents, type: integer, source: computed, description: "advances_received_cents - advances_applied_cents - advances_refunded_cents", default: 0 }
      - { name: total_final_cents, type: integer, source: computed, description: "Sum of actual_cents over lines + final agency fee; set at finalize/refinalize; null before", default: null }
      - { name: agency_fee_final_cents, type: integer, source: computed, description: "2.5% per-line half-up over actualized line actuals; null before finalize", default: null }
      - { name: balance_due_cents, type: integer, source: computed, description: "total_final_cents - advances_applied_cents; null before finalize", default: null }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; segregation-of-duties reference for finalize" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of latest finalize/refinalize actor", default: null }

  - name: DALine
    parent: null
    common_fields: true
    fields:
      - { name: da_id, type: string, source: input, description: "FK -> DisbursementAccount.id; owning account" }
      - { name: category, type: enum, source: input, description: "PORT_DUES | PILOTAGE | TOWAGE | BERTH_HIRE | PROVISIONS | BUNKERS | REPAIRS | STORES | CREW_COSTS | CANCELLATION_FEE | SUNDRY" }
      - { name: description, type: string, source: input, description: "Free-text line memo" }
      - { name: estimated_cents, type: integer, source: input, description: "Estimated amount; for TARIFF-sourced PORT_DUES lines this is computed and pinned, input ignored; must be >= 0 for MANUAL lines" }
      - { name: actual_cents, type: integer, source: system, description: "Actualized amount; null until source completes or finalize computes it", default: null }
      - { name: status, type: enum, source: system, description: "ESTIMATED | ACTUALIZED | DISPUTED", default: ESTIMATED }
      - { name: source_type, type: enum, source: system, description: "TARIFF | SERVICE_ORDER | PURCHASE_ORDER | MANUAL" }
      - { name: source_ref, type: string, source: system, description: "Polymorphic non-FK reference 'ServiceOrder:<id>' | 'PurchaseOrder:<id>' | null; never used for routing", default: null }
      - { name: tariff_id, type: string, source: system, description: "FK -> Tariff.id; tariff version pinned for the estimate on TARIFF-sourced lines; null otherwise", default: null }

  - name: FundingAdvance
    parent: null
    common_fields: true
    fields:
      - { name: da_id, type: string, source: input, description: "FK -> DisbursementAccount.id; account funded" }
      - { name: amount_cents, type: integer, source: input, description: "Cash received from the principal; must be > 0" }
      - { name: applied_cents, type: integer, source: system, description: "Portion applied against the final account", default: 0 }
      - { name: refunded_cents, type: integer, source: system, description: "Portion refunded to the principal", default: 0 }
      - { name: status, type: enum, source: system, description: "RECEIVED | APPLIED | REFUNDED; RECEIVED->APPLIED when applied_cents==amount_cents; RECEIVED->REFUNDED on refund of remainder", default: RECEIVED }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of receipt" }

  - name: CostDispute
    parent: null
    common_fields: true
    fields:
      - { name: da_id, type: string, source: input, description: "FK -> DisbursementAccount.id; disputed account" }
      - { name: da_line_id, type: string, source: input, description: "FK -> DALine.id; disputed line; null disputes the whole account", default: null }
      - { name: principal_id, type: string, source: system, description: "FK -> Principal.id; raiser, taken from X-User-ID of the PrincipalRep" }
      - { name: amount_cents, type: integer, source: input, description: "Disputed amount; must be > 0" }
      - { name: reason, type: string, source: input, description: "Dispute rationale" }
      - { name: status, type: enum, source: system, description: "RAISED | UNDER_REVIEW | REJECTED | ESCALATED | UPHELD | RESOLVED_ACCEPTED | RESOLVED_REJECTED", default: RAISED }
      - { name: resolution_note, type: string, source: system, description: "Recorded at uphold/reject/resolve", default: null }

  - name: HusbandryCase
    parent: null
    common_fields: true
    fields:
      - { name: port_call_id, type: string, source: input, description: "FK -> PortCall.id; call the case arises under" }
      - { name: crew_change_id, type: string, source: input, description: "FK -> CrewChange.id; linked crew movement for repatriation cases; null otherwise", default: null }
      - { name: case_type, type: enum, source: input, description: "MEDICAL | REPATRIATION | DESERTION | OTHER" }
      - { name: severity, type: enum, source: input, description: "ROUTINE | URGENT | CRITICAL" }
      - { name: summary, type: string, source: input, description: "Case description" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_TREATMENT | CLEARED | REPATRIATED", default: OPEN }
      - { name: departure_waiver_granted, type: boolean, source: system, description: "AgencyAdmin one-case waiver letting record-sailing pass despite an open CRITICAL case", default: false }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PortCall
    initial_state: NOMINATED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: NOMINATED
        to: PRE_ARRIVAL_FILED
        trigger: POST /port-calls/{id}/file-pre-arrival
        actor: AgencyOps
        preconditions:
          - "ops_status == NOMINATED (else ERR_INVALID_STATE)"
          - "current_utc <= eta - 24h (else ERR_PRE_ARRIVAL_DEADLINE_MISSED)"
          - "at least one AuthorityNotification of each type in {PORT_STATE_CONTROL, IMMIGRATION, CUSTOMS, HARBOR_MASTER} exists for this call in status SUBMITTED or ACKNOWLEDGED (else ERR_NOTIFICATIONS_OUTSTANDING)"
        side_effects:
          - "increments PortCall.version by 1"
      - from: PRE_ARRIVAL_FILED
        to: CLEARED_TO_ENTER
        trigger: POST /port-calls/{id}/grant-clearance
        actor: PortAuthority
        preconditions:
          - "ops_status == PRE_ARRIVAL_FILED (else ERR_INVALID_STATE)"
          - "every AuthorityNotification of this call has status == ACKNOWLEDGED and at least one exists per authority_type (else ERR_NOTIFICATIONS_OUTSTANDING)"
        side_effects:
          - "increments PortCall.version by 1"
      - from: CLEARED_TO_ENTER
        to: ALONGSIDE
        trigger: POST /port-calls/{id}/record-arrival
        actor: AgencyOps
        preconditions:
          - "ops_status == CLEARED_TO_ENTER (else ERR_INVALID_STATE)"
          - "payload berth_window_id references a BerthWindow with port_call_id == this call and status == OCCUPIED (else ERR_BERTH_NOT_OCCUPIED)"
        side_effects:
          - "actual_arrival_at = current_utc"
          - "increments PortCall.version by 1"
      - from: ALONGSIDE
        to: SAILED
        trigger: POST /port-calls/{id}/record-sailing
        actor: AgencyOps
        preconditions:
          - "ops_status == ALONGSIDE (else ERR_INVALID_STATE)"
          - "payload berth_window_id references a BerthWindow with port_call_id == this call (else ERR_BERTH_WINDOW_MISMATCH) and status == OCCUPIED (else ERR_BERTH_NOT_OCCUPIED)"
          - "no HusbandryCase of this call with severity == CRITICAL, status in {OPEN, IN_TREATMENT}, departure_waiver_granted == false (else ERR_OPEN_CRITICAL_HUSBANDRY)"
          - "no CrewChange of this call with status in {REQUESTED, DOCS_VERIFIED, VISA_PENDING, VISA_GRANTED, PASS_EXPIRED} (else ERR_OPEN_CREW_CHANGES); SHORE_PASS_ISSUED is allowed"
          - "no CargoDocument of this call with status == ON_HOLD (else ERR_CARGO_DOCS_ON_HOLD)"
          - "a non-SUPERSEDED DisbursementAccount exists with status in {SENT_TO_PRINCIPAL, FUNDED, FINAL, DISPUTED, SETTLED} (else ERR_DA_NOT_SENT) and (advances_received_cents - advances_refunded_cents) >= advance_required_cents (else ERR_FUNDING_SHORTFALL; equality passes)"
        side_effects:
          - "actual_sailed_at = current_utc; alongside_days_actual recomputed"
          - "referenced BerthWindow -> RELEASED with released_at = current_utc (cascade link 1)"
          - "PORT_DUES DALine on the DA actualizes via port_dues_calc FINAL variant using actual times and the tariff PUBLISHED at sailing time; line status -> ACTUALIZED (cascade link 2)"
          - "DA totals recomputed via da_totals_calc; if DA.status == PRO_FORMA the actual is recorded but DA not auto-advanced (cascade link 3)"
          - "increments PortCall.version by 1"
      - from: SAILED
        to: CLOSED
        trigger: POST /port-calls/{id}/close
        actor: AgencyFinance
        preconditions:
          - "ops_status == SAILED (else ERR_INVALID_STATE)"
          - "the non-SUPERSEDED DisbursementAccount has status == SETTLED (else ERR_DA_NOT_SETTLED)"
        side_effects:
          - "increments PortCall.version by 1"
      - from: NOMINATED
        to: CANCELLED
        trigger: POST /port-calls/{id}/cancel
        actor: AgencyOps
        preconditions:
          - "ops_status in {NOMINATED, PRE_ARRIVAL_FILED, CLEARED_TO_ENTER, ALONGSIDE} (else ERR_INVALID_STATE)"
        side_effects:
          - "Cascade link 1: all BerthWindows of this call in {REQUESTED, CONFIRMED} -> CANCELLED; all AuthorityNotifications in {DRAFT, SUBMITTED, REJECTED} -> WITHDRAWN; all CrewChanges in {REQUESTED, DOCS_VERIFIED, VISA_PENDING, VISA_GRANTED, SHORE_PASS_ISSUED, PASS_EXPIRED} -> CANCELLED; all PurchaseOrders in {DRAFT, SENT, ACKNOWLEDGED} -> CANCELLED; all ServiceOrders in {ORDERED, CONFIRMED} -> CANCELLED with cancellation_fee_cents = 0 (port-call cancellation never incurs late fees)"
          - "Cascade link 2: each ServiceOrder/PurchaseOrder cancellation reverses its DALine mirror (line estimated_cents -> 0, status stays ESTIMATED, source_ref retained)"
          - "Cascade link 3: DA totals recomputed via da_totals_calc after all line reversals; DA in {PRO_FORMA, SENT_TO_PRINCIPAL, FUNDED} remains open, funding gates re-derive"
          - "increments PortCall.version by 1"
      - from: PRE_ARRIVAL_FILED
        to: CANCELLED
        trigger: POST /port-calls/{id}/cancel
        actor: AgencyOps
        preconditions: ["as NOMINATED -> CANCELLED"]
        side_effects: ["as NOMINATED -> CANCELLED"]
      - from: CLEARED_TO_ENTER
        to: CANCELLED
        trigger: POST /port-calls/{id}/cancel
        actor: AgencyOps
