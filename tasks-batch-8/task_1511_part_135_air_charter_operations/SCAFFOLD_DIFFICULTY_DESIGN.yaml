            - { call: "POST /charter/crew-assignments/${ca_va}/vet", payload: {}, as: DispatchManager }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust VB", customer_email: "vb@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-11T00:30:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_vb: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_vb}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_vb}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_vb}", crew_member_id: "${crew_v}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_vb: $.data.id } }
          trigger:
            - { call: "POST /charter/crew-assignments/${ca_vb}/vet", payload: {}, as: DispatchManager, captures: { ca_vb_st: $.data.status, ca_vb_rest: $.data.rest_legal, ca_vb_duty: $.data.duty_legal } }
          assert:
            - "HTTP 200 (vet never errors on illegality): CrewAssignment.${ca_vb}.status == FLAGGED_ILLEGAL"
            - "rest_legal == false (570 < 600) while duty_legal == true (120 <= 840)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: payment_conservation_on_cancel
        grounds:
          - calculations.cancellation_refund
          - calculations.payment_posture
          - state_machines.TripRequest.BOOKED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: trip money. Forward actions (deposit + balance)
          collect 2052000; the compensating cancel splits it into refund
          1026000 + retained fee 1026000. refund + fee == collected_before,
          and net collected after == fee. No cent appears or vanishes.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; trip dep 2026-08-04T00:00:00Z, single REV 480, quote 2052000, booked 513000 + balance 1539000 (collected 2052000)"
            - "Clock advanced to 2026-08-02T00:00:00Z (48h before departure -> 50% tier)"
          setup_api_calls:
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust PC", customer_email: "pc@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-04T00:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_pc: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_pc}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 480, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_pc}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_pc}/book", payload: { deposit_cents: 513000 }, as: SalesAgent }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_pc}", payment_type: "BALANCE", amount_cents: 1539000 }, as: SalesAgent }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: OpsAdmin }
          trigger:
            - { call: "POST /charter/trip-requests/${trip_pc}/cancel", payload: { reason: "CUSTOMER" }, as: SalesAgent, captures: { pc_fee: $.data.cancellation_fee_cents, pc_ref: $.data.refund_cents, pc_col: $.data.collected_cents, pc_posture: $.data.payment_posture } }
            - { call: "GET /charter/trip-requests/${trip_pc}/payments", payload: {}, as: OpsAdmin }
          assert:
            - "cancellation_fee_cents == 1026000 and refund_cents == 1026000"
            - "INVARIANT: refund_cents + cancellation_fee_cents == 2052000 == pre-cancel collected_cents"
            - "collected_cents after cancel == 1026000 (2052000 - 1026000 refund)"
            - "Payments: DEPOSIT 513000 + BALANCE 1539000 + REFUND 1026000, all POSTED; payment_posture == REFUNDED_PARTIAL"

      - name: aircraft_release_no_drift
        grounds:
          - state_machines.AircraftAssignment.TENTATIVE_to_CONFIRMED
          - state_machines.AircraftAssignment.CONFIRMED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: aircraft availability and airframe minutes (a
          different quantity than money). Confirm-then-release is a
          forward/compensating pair: after both, the aircraft is AVAILABLE,
          total_airframe_minutes is unchanged, and its version never moved
          because assignment transitions do not mutate the aircraft.
        test_recipe:
          setup:
            - "Owner; aircraft N220ND LIGHT_JET, initial 1000 minutes, due 60000, ops-listed; clock 2026-08-01T00:00:00Z"
            - "Trip dep 2026-08-10T10:00:00Z, leg REV 60, booked 67500; assignment TENTATIVE"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner N", contact_email: "n@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 0 }, as: OpsAdmin, captures: { own_n: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_n}", tail_number: "N220ND", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 1000, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_n: $.data.id, ac_n_v1: $.data.version, ac_n_min1: $.data.total_airframe_minutes } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust N", customer_email: "n2@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_n: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_n}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 60, fuel_stop: false }, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_n}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_n}/book", payload: { deposit_cents: 67500 }, as: SalesAgent, captures: { trip_n_v: $.data.version } }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_n}", aircraft_id: "${ac_n}", expected_trip_request_version: "${trip_n_v}" }, as: DispatchManager, captures: { asg_n: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_n}/confirm", payload: {}, as: DispatchManager }
          trigger:
            - { call: "POST /charter/aircraft-assignments/${asg_n}/release", payload: {}, as: DispatchManager, captures: { asg_n_st: $.data.status } }
            - { call: "GET /charter/aircraft/${ac_n}", payload: {}, as: OpsAdmin, captures: { ac_n_st2: $.data.status, ac_n_min2: $.data.total_airframe_minutes, ac_n_v2: $.data.version } }
          assert:
            - "AircraftAssignment.${asg_n}.status == RELEASED"
            - "INVARIANT: Aircraft.${ac_n}.status == AVAILABLE and total_airframe_minutes == 1000 (unchanged)"
            - "INVARIANT: Aircraft.version after release == version at creation (${ac_n_v1}); assignment transitions never mutate the aircraft row"

      - name: owner_statement_split_conservation
        grounds:
          - calculations.owner_statement
        distinguishing_aspect: |
          Conserved quantity: statement decomposition of gross revenue (a
          third quantity type — a ledger split, not a balance or a status).
          owner_share + operator_retained == gross must hold even in the
          GUARANTEED variant where the retained residual goes negative.
        test_recipe:
          setup:
            - "Owner G (80%, guarantee 4000/min) with aircraft N330GS rate 240000; PIC crew; clock 2026-08-01T00:00:00Z"
            - "Trip legs REV 120 + POS 30; booked/paid/confirmed/vetted/dispatched; actuals 100 + 30 (logged 130 minutes)"
          setup_api_calls:
            - { call: "POST /charter/aircraft-owners", payload: { name: "Owner GS", contact_email: "gs@x.com", revenue_share_pct: 80, guarantee_cents_per_block_min: 4000 }, as: OpsAdmin, captures: { own_gs: $.data.id } }
            - { call: "POST /charter/aircraft", payload: { owner_id: "${own_gs}", tail_number: "N330GS", category: "LIGHT_JET", home_base_icao: "KLAX", seats: 8, hourly_rate_cents: 240000, on_ops_spec: true, initial_airframe_minutes: 0, next_check_due_minutes: 60000 }, as: OpsAdmin, captures: { ac_gs: $.data.id } }
            - { call: "POST /charter/crew-members", payload: { name: "Pic GS", base_icao: "KLAX", qualified_categories: ["LIGHT_JET"] }, as: OpsAdmin, captures: { crew_gs: $.data.id } }
            - { call: "POST /charter/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OpsAdmin }
            - { call: "POST /charter/trip-requests", payload: { customer_name: "Cust GS", customer_email: "gs2@x.com", requested_category: "LIGHT_JET", origin_icao: "KLAX", destination_icao: "KTEB", departure_at: "2026-08-10T10:00:00Z", passenger_count: 0, international: false }, as: SalesAgent, captures: { trip_gs: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_gs}", seq_no: 1, leg_type: "REVENUE", origin_icao: "KLAX", destination_icao: "KTEB", block_minutes: 120, fuel_stop: false }, as: SalesAgent, captures: { leg_gs1: $.data.id } }
            - { call: "POST /charter/quote-legs", payload: { trip_request_id: "${trip_gs}", seq_no: 2, leg_type: "POSITIONING", origin_icao: "KTEB", destination_icao: "KLAX", block_minutes: 30, fuel_stop: false }, as: SalesAgent, captures: { leg_gs2: $.data.id } }
            - { call: "POST /charter/trip-requests/${trip_gs}/quote", payload: {}, as: SalesAgent }
            - { call: "POST /charter/trip-requests/${trip_gs}/book", payload: { deposit_cents: 155250 }, as: SalesAgent, captures: { trip_gs_v: $.data.version } }
            - { call: "POST /charter/payments", payload: { trip_request_id: "${trip_gs}", payment_type: "BALANCE", amount_cents: 465750 }, as: SalesAgent }
            - { call: "POST /charter/aircraft-assignments", payload: { trip_request_id: "${trip_gs}", aircraft_id: "${ac_gs}", expected_trip_request_version: "${trip_gs_v}" }, as: DispatchManager, captures: { asg_gs: $.data.id } }
            - { call: "POST /charter/aircraft-assignments/${asg_gs}/confirm", payload: {}, as: DispatchManager }
            - { call: "POST /charter/crew-assignments", payload: { trip_request_id: "${trip_gs}", crew_member_id: "${crew_gs}", duty_role: "PIC" }, as: DispatchManager, captures: { ca_gs: $.data.id } }
            - { call: "POST /charter/crew-assignments/${ca_gs}/vet", payload: {}, as: DispatchManager }
            - { call: "POST /charter/trip-requests/${trip_gs}/dispatch", payload: {}, as: DispatchManager }
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_gs}", quote_leg_id: "${leg_gs1}", actual_block_minutes: 100, departed_at: "2026-08-10T10:00:00Z", arrived_at: "2026-08-10T11:40:00Z" }, as: CrewMember, as_user_id: "${crew_gs}" }
            - { call: "POST /charter/flight-logs", payload: { trip_request_id: "${trip_gs}", quote_leg_id: "${leg_gs2}", actual_block_minutes: 30, departed_at: "2026-08-10T12:00:00Z", arrived_at: "2026-08-10T12:30:00Z" }, as: CrewMember, as_user_id: "${crew_gs}" }
          trigger:
            - { call: "GET /charter/aircraft-owners/${own_gs}/owner-statements", payload: {}, as: OpsAdmin, captures: { gs_gross: "$.data[0].gross_cents", gs_share: "$.data[0].owner_share_cents", gs_ret: "$.data[0].operator_retained_cents" } }
          assert:
            - "OwnerStatement.gross_cents == 472000 and owner_share_cents == 520000 (guarantee floor 4000 x 130 binds over standard 377600)"
            - "INVARIANT: owner_share_cents + operator_retained_cents == gross_cents (520000 + (-48000) == 472000) even with a negative residual"
