# =============================================================================
# §1.9 Scaffold Corner Design — In Vitro Diagnostic Reagent Manufacturing
# Breadth coverage of every testable claim SCAFFOLD.yaml §1.1-§1.7 declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not already cover. Sections and
# claim_type values are taken verbatim from references/claim-extraction-guide.md.
# Instances that a §1.8 instance already asserts appear as excluded_because stubs
# with no test_recipe.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: material_specification_create_returns_every_declared_field
        claim_type: Creation
        grounds:
          - endpoints.POST_material-specifications
          - entities.MaterialSpecification
        distinguishing_aspect: "A create with every input field supplied returns HTTP 201 and echoes all eleven declared inputs plus the four common fields; nothing is silently dropped."
        test_recipe:
          setup:
            - "Empty database; the logical clock is parked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ENT-1", material_type: "CALIBRATOR_MATERIAL", is_critical: true, potency_min_pct: 95.0, potency_max_pct: 105.0, endotoxin_max_eu_per_ml: 1.5, purity_min_pct: 98.0, required_test_codes: ["POTENCY", "IDENTITY"], acceptance_mode: "WEIGHTED_SCORE", max_retests: 2, retest_window_days: 45 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id, ms_v: $.data.version }
          assert:
            - "HTTP 201 with response_type object and data holding material_code AB-ENT-1, material_type CALIBRATOR_MATERIAL, is_critical true, potency_min_pct 95.0, potency_max_pct 105.0, endotoxin_max_eu_per_ml 1.5, purity_min_pct 98.0, required_test_codes [POTENCY, IDENTITY], acceptance_mode WEIGHTED_SCORE, max_retests 2 and retest_window_days 45"
            - "id is a server-generated non-empty string, version == 1, and created_at == updated_at == 2026-08-01T00:00:00.000Z from the logical clock"
            - "GET /material-specifications/${ms_id} returns byte-identical field values"

      - name: material_specification_omitted_optional_fields_apply_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.MaterialSpecification.fields.is_critical
          - entities.MaterialSpecification.fields.acceptance_mode
          - entities.MaterialSpecification.fields.max_retests
          - entities.MaterialSpecification.fields.retest_window_days
        distinguishing_aspect: "The four fields that declare a default are omitted from the body; the server must materialise false / ALL_PASS / 1 / 30 rather than null."
        test_recipe:
          setup:
            - "Empty database; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ENT-2", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"] }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id, mode: $.data.acceptance_mode }
          assert:
            - "is_critical == false, acceptance_mode == ALL_PASS, max_retests == 1 and retest_window_days == 30"
            - "no defaulted field is null in the response"

      - name: material_lot_create_initialises_the_quantity_ledger_and_qualification_state
        claim_type: Computed Fields
        grounds:
          - entities.MaterialLot.fields.available_quantity_units
          - entities.MaterialLot.fields.consumed_quantity_units
          - entities.MaterialLot.fields.qualification_status
          - calculations.material_quantity_conservation
        distinguishing_aspect: "The two computed quantity fields are derived at create time from received_quantity_units alone, and a client-supplied available_quantity_units is not a declared input, so the ledger opens at 1000.00 / 0.00 with acceptance_score still null."
        test_recipe:
          setup:
            - "One MaterialSpecification EZ-ENT-1; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "EZ-ENT-1", material_type: "ENZYME", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
          trigger:
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-ENT-1", received_quantity_units: 1000.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id, avail: $.data.available_quantity_units }
          assert:
            - "HTTP 201 with available_quantity_units 1000.00 and consumed_quantity_units 0.00, so received_quantity_units 1000.00 == 1000.00 + 0.00"
            - "qualification_status == RECEIVED, the declared initial_state of the MaterialLot machine"
            - "acceptance_score is null, retest_count == 0 and first_oos_at is null before any TestResult exists"
            - "version == 1"

      - name: material_lot_missing_required_expiry_date_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_material-lots
          - validations.priority_30_ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "expiry_date has source input with no default, so omitting it is a 400 rather than a null-valued row; the specification FK in the same body is valid, which proves the 400 is the missing field."
        test_recipe:
          setup:
            - "One MaterialSpecification EZ-ENT-2."
          setup_api_calls:
            - call: "POST /material-specifications"
              payload: { material_code: "EZ-ENT-2", material_type: "ENZYME", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
          trigger:
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-ENT-2", received_quantity_units: 500.0 }
              as: ProductionOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with error_id ERR_INVALID_REQUEST and response_type error"
            - "no MaterialLot row is created: GET /material-lots filtered by material_specification_id returns total_count 0"

      - name: material_specification_undeclared_enum_and_violated_numeric_bound_are_rejected
        claim_type: Type Constraints
        grounds:
          - entities.MaterialSpecification.fields.material_type
          - entities.MaterialLot.fields.received_quantity_units
          - validations.priority_30_ERR_INVALID_REQUEST
        distinguishing_aspect: "Two distinct shapes of the same error: an enum member outside the declared set, and a numeric field violating its declared `> 0` bound. Both must be 400 ERR_INVALID_REQUEST, not a 409 or a coerced value."
        test_recipe:
          setup:
            - "One MaterialSpecification AB-ENT-3 used as the FK target of the second trigger."
          setup_api_calls:
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ENT-3", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
          trigger:
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ENT-4", material_type: "PLASMID", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { err_enum: $.data.error_id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-ENT-3", received_quantity_units: 0.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { err_bound: $.data.error_id }
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ENT-5", material_type: "ANTIBODY", potency_min_pct: 110.0, potency_max_pct: 90.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { err_order: $.data.error_id }
          assert:
            - "material_type PLASMID returns HTTP 400 ERR_INVALID_REQUEST — the declared set is ANTIBODY, ENZYME, CALIBRATOR_MATERIAL, BUFFER"
            - "received_quantity_units 0.0 returns HTTP 400 ERR_INVALID_REQUEST because the declared constraint is > 0 and zero is not admitted"
            - "potency_min_pct 110.0 with potency_max_pct 90.0 returns HTTP 400 ERR_INVALID_REQUEST because the declared constraint is 0 < potency_min_pct < potency_max_pct"
            - "no row is persisted by any of the three rejected calls"

      - name: reagent_lot_system_fields_are_server_assigned_and_client_values_ignored
        claim_type: System Fields
        grounds:
          - entities.ReagentLot.fields.disposition_status
          - entities.ReagentLot.fields.distribution_status
          - endpoints.POST_reagent-lots
        distinguishing_aspect: "The create declares exactly three inputs; the two status dimensions, the unit counters and the four common fields are all server-assigned, so a lot always opens PLANNED + WITHHELD with every counter at 0 regardless of what else the caller sends."
        test_recipe:
          setup:
            - "One ProductSpecification IVD-ENT-1 in clearance_status DESIGN; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-ENT-1", reference_material_code: "REF-E1", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
          trigger:
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-LOT-1", planned_units: 400 }
              as: ProductionOperator
              captures: { rl_id: $.data.id, disp: $.data.disposition_status, dist: $.data.distribution_status }
          assert:
            - "disposition_status == PLANNED and distribution_status == WITHHELD, the two declared initial states of the parallel machine"
            - "filled_units, available_units, allocated_units, shipped_units and quarantined_units are all 0 and filled_units 0 == 0 + 0 + 0 + 0"
            - "fill_completed_at, expiry_date, assigned_shelf_life_months, shelf_life_basis, released_by_user_id and released_at are all null"
            - "bridging_required == false, em_excursion_count == 0, version == 1, and created_at == 2026-08-01T00:00:00.000Z"
            - "a lot may be opened against a product still in clearance_status DESIGN — only release and allocation require CLEARED"

      - name: monitoring_sample_is_an_immutable_event_with_no_version_and_no_write_back
        claim_type: Immutability
        grounds:
          - entities.MonitoringSample
          - endpoints.GET_fill-runs_id_samples
        distinguishing_aspect: "MonitoringSample declares common_fields false and kind event: §1.5 exposes a create and a list but no GET by id, no update and no delete, and the row carries no version field — so the only way to correct a sample is to record another one."
        test_recipe:
          setup:
            - "ProductSpecification IVD-ENT-2, one PLANNED ReagentLot and one SCHEDULED FillRun on LINE-M."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-ENT-2", reference_material_code: "REF-E2", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-LOT-2", planned_units: 400 }
              as: ProductionOperator
              captures: { rl_id: $.data.id }
            - call: "POST /fill-runs"
              payload: { reagent_lot_id: "${rl_id}", line_code: "LINE-M", formulation_batch_code: "BULK-E2", scheduled_start: "2026-08-10T06:00:00Z", scheduled_end: "2026-08-10T10:00:00Z", planned_fill_units: 400 }
              as: ProductionOperator
              captures: { fr_id: $.data.id }
          trigger:
            - call: "POST /fill-runs/${fr_id}/samples"
              payload: { sample_type: "SURFACE", location_code: "BENCH-1", result_value: 4.0, sampled_at: "2026-08-10T07:00:00Z" }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { s_id: $.data.id, s_limit: $.data.limit_value }
            - call: "GET /fill-runs/${fr_id}/samples"
              payload: {}
              as: QCAnalyst
              captures: { first_type: "$.data[0].sample_type" }
          assert:
            - "the create returns HTTP 201 with limit_value 5.0 from LIMIT_SURFACE_CFU, excursion false and excursion_grade NONE because 4.0 <= 5.0"
            - "the response carries id and created_at but NO version and NO updated_at, because the entity declares common_fields false"
            - "§1.5 exposes no PATCH, PUT or DELETE on samples and no GET /monitoring-samples/{id}; the list endpoint is the only read path"
            - "recording a second SURFACE sample at the same location leaves the first row untouched — corrections are additive, and the run's counters recompute from the full set"

      - name: test_result_retrieval_returns_the_stored_measurement_and_its_derived_outcome
        claim_type: Retrieval
        grounds:
          - endpoints.GET_test-results_id
          - entities.TestResult.fields.outcome
          - calculations.test_result_outcome
        distinguishing_aspect: "A GET by id on an immutable event returns the measurement exactly as recorded plus the outcome the server derived, and TestResult carries no version because common_fields is false."
        test_recipe:
          setup:
            - "One MaterialSpecification AB-ENT-6 with potency bounds 90.0-110.0 and one RECEIVED MaterialLot; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ENT-6", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-ENT-6", received_quantity_units: 100.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 90.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
              captures: { tr_id: $.data.id }
          trigger:
            - call: "GET /test-results/${tr_id}"
              payload: {}
              as: QAReleaser
              captures: { outcome: $.data.outcome, value: $.data.measured_value }
          assert:
            - "HTTP 200 with subject_type MATERIAL_LOT, material_lot_id equal to the created lot, test_code POTENCY and measured_value 90.0"
            - "outcome == PASS because every declared bound is inclusive and 90.0 == potency_min_pct"
            - "performed_by_user_id == qc-01 and performed_at == 2026-08-01T00:00:00.000Z, both stamped by the server rather than supplied"
            - "bias_pct and recovery_pct are null for a MATERIAL_LOT subject, and no version field is present"

      - name: reagent_lot_listing_is_paginated_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_reagent-lots
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Twelve rows against a declared default limit of 10 pins every pagination field at once: the first page carries 10 items with total_count 12 and has_more true, the offset page carries the remaining 2 with has_more false, and limit 0 is a 400 because the declared minimum is 1."
        test_recipe:
          setup:
            - "One ProductSpecification IVD-ENT-3 with twelve PLANNED ReagentLots ENT-P-01..ENT-P-12 created in order at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /product-specifications"
              payload: { product_code: "IVD-ENT-3", reference_material_code: "REF-E3", required_material_codes: [], release_test_codes: ["ACTIVITY"], max_reference_bias_pct: 5.0, shelf_life_months_claim: 12, storage_condition: "TWO_TO_EIGHT_C", min_shelf_life_days_at_ship: 90 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ps_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-01", planned_units: 100 }
              as: ProductionOperator
              captures: { rl_first_id: $.data.id }
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-02", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-03", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-04", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-05", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-06", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-07", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-08", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-09", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-10", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-11", planned_units: 100 }
              as: ProductionOperator
            - call: "POST /reagent-lots"
              payload: { product_specification_id: "${ps_id}", lot_code: "ENT-P-12", planned_units: 100 }
              as: ProductionOperator
              captures: { rl_last_id: $.data.id }
          trigger:
            - call: "GET /reagent-lots"
              payload: { product_specification_id: "${ps_id}" }
              as: DistributionPlanner
              captures: { page1_first: "$.data[0].lot_code" }
            - call: "GET /reagent-lots"
              payload: { product_specification_id: "${ps_id}", limit: 10, offset: 10 }
              as: DistributionPlanner
              captures: { page2_first: "$.data[0].lot_code" }
            - call: "GET /reagent-lots"
              payload: { product_specification_id: "${ps_id}", limit: 0 }
              as: DistributionPlanner
              captures: { err_limit: $.data.error_id }
            - call: "GET /reagent-lots"
              payload: { product_specification_id: "${ps_id}", limit: 101 }
              as: DistributionPlanner
              captures: { err_limit_max: $.data.error_id }
          assert:
            - "the unparameterised list returns response_type array with exactly 10 items, total_count 12, limit 10, offset 0 and has_more true"
            - "limit 10 with offset 10 returns exactly 2 items, total_count 12, offset 10 and has_more false"
            - "limit 0 returns HTTP 400 ERR_INVALID_REQUEST because the declared minimum is 1, and limit 101 returns HTTP 400 ERR_INVALID_REQUEST because the declared maximum is 100"
            - "the two pages are disjoint and their union is all twelve lot_codes, so offset paging does not skip or repeat a row"

      - name: lot_component_junction_is_reachable_from_both_of_its_parents
        claim_type: Parent Relationships
        grounds:
          - entities.LotComponent
          - endpoints.GET_reagent-lots_id_components
          - endpoints.GET_material-lots_id_lot-components
          - complexity_profile.entity_topology
        distinguishing_aspect: "LotComponent is the ReagentLot x MaterialLot junction of the declared graph topology, so the same row must be listable from BOTH sides with the same snapshot fields — a one-sided implementation passes the create test and fails here."
        test_recipe:
          setup:
            - "One QUALIFIED MaterialLot of 1000.00 units of AB-ENT-7 and one PLANNED ReagentLot ENT-LOT-3 of product IVD-ENT-4 with one CONSUMED component of 250.00 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /material-specifications"
              payload: { material_code: "AB-ENT-7", material_type: "ANTIBODY", potency_min_pct: 90.0, potency_max_pct: 110.0, endotoxin_max_eu_per_ml: 2.0, purity_min_pct: 95.0, required_test_codes: ["POTENCY"], is_critical: false, acceptance_mode: "ALL_PASS", max_retests: 1, retest_window_days: 30 }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { ms_id: $.data.id }
            - call: "POST /material-lots"
              payload: { material_specification_id: "${ms_id}", vendor_lot_code: "V-ENT-7", received_quantity_units: 1000.0, expiry_date: "2027-12-31T00:00:00Z" }
              as: ProductionOperator
              captures: { ml_id: $.data.id }
            - call: "POST /test-results"
              payload: { subject_type: "MATERIAL_LOT", material_lot_id: "${ml_id}", test_code: "POTENCY", measured_value: 100.0 }
              as: QCAnalyst
              as_user_id: "qc-01"
            - call: "POST /material-lots/${ml_id}/disposition"
              payload: { decision: "QUALIFY" }
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /product-specifications"
