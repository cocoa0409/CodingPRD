            - "${e_resubmit_draft} == ERR_AGENT_NOT_ENGAGED with HTTP 403 for the same reason"
            - "${f_submitted} == SUBMITTED"
            - "${e_double_submit} == ERR_INVALID_STATE_TRANSITION with HTTP 409 — priority 6(a) now passes, so priority 8 is the visible rule"
            - "${e_resubmit_submitted} == ERR_INVALID_STATE_TRANSITION with HTTP 409 — resubmit demands REJECTED"
            - "${f_confirmed} == CONFIRMED and ${e_reject_confirmed} == ERR_INVALID_STATE_TRANSITION with HTTP 409"
            - "${f_final} == CONFIRMED, ${f_attempts} == 1, ${f_receipt} == \"EMMA-2026-000001\" — none of the four refused calls mutated the row"

