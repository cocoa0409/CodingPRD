# =============================================================================
# Community Fridge & Food-Sharing Network — Seed Tables (§1.0–§1.7)
# Difficulty: Expert
# =============================================================================

scenario: |
  Community Fridge & Food-Sharing Network: location/fridge & steward,
  donation/intake log & food-safety (date/temp), real-time stock/need posting,
  volunteer steward schedule & cleaning, surplus-rescue pickup
  (restaurant/grocer), allergen/labeling, usage/impact reporting, sponsor

domain_name: community-fridge
# Flat multi-root topology: entities are peers linked by foreign keys, not nested
# under a single collection. api_prefix is the empty root so every top-level
# collection (/fridges, /stewards, /donors, /grants, /shifts, /offers,
# /donation-batches, /claims, /needs) sits directly under it.
api_prefix: ""

complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
    - scheduled_actions

  entity_topology: flat
  state_machine_shape: branching        # + one cyclic (StewardShift) + one revert (DonationBatch)
  relationship_patterns:
    - one_to_many
    - cross_aggregate                    # Reimbursement debit spans Fridge budget from a StewardShift
    - polymorphic                        # DonationBatch optionally references a SurplusOffer
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Fridge
    parent: null
    common_fields: true            # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Human-readable fridge name" }
      - { name: location_label, type: string, source: input, description: "Street / neighborhood label" }
      - { name: capacity_slots, type: integer, source: input, description: "Total physical storage slots", constraints: "integer >= 1" }
      - { name: current_temp_c, type: number, source: system, default: 4.0, description: "Latest recorded interior temperature in Celsius; updated by POST /fridges/{id}/temperature" }
      - { name: last_cleaned_at, type: datetime, source: system, description: "Timestamp of last COMPLETED CLEANING shift; defaults to created_at" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run-ops" }
      - { name: active_recall_count, type: integer, source: computed, default: 0, description: "Count of DonationBatch in status RECALLED for this fridge" }
      - { name: stock_slots_used, type: integer, source: computed, default: 0, description: "= sum(slot_footprint) over DonationBatch in {STOCKED, HELD, RECALLED} for this fridge" }
      - { name: free_slots, type: integer, source: computed, description: "= capacity_slots - stock_slots_used" }
      - { name: safety_posture, type: enum, source: computed, description: "OPERATIONAL | RESTRICTED | QUARANTINED — derived per calculations.fridge_safety_posture", constraints: "one of OPERATIONAL, RESTRICTED, QUARANTINED" }
      - { name: budget_granted_cents, type: integer, source: computed, default: 0, description: "= sum(amount_cents) over SponsorGrant in status ACTIVE for this fridge" }
      - { name: budget_committed_cents, type: integer, source: computed, default: 0, description: "= sum(reimbursement_amount_cents) over StewardShift in status COMPLETED for this fridge" }
      - { name: budget_available_cents, type: integer, source: computed, description: "= budget_granted_cents - budget_committed_cents" }
      - { name: total_meals_provided, type: integer, source: computed, default: 0, description: "Impact report figure; per calculations.fridge_impact_report (round per-batch then sum)" }

  - name: Steward
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Volunteer name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED", constraints: "one of ACTIVE, SUSPENDED" }
      - { name: missed_count, type: integer, source: system, default: 0, description: "Count of shifts that transitioned SCHEDULED->MISSED via run-ops" }
      - { name: completed_count, type: integer, source: computed, default: 0, description: "= count StewardShift in status COMPLETED for this steward" }
      - { name: reliability_actual, type: number, source: computed, description: "Actual reliability per calculations.steward_reliability_score (variant actual)" }
      - { name: reliability_projected, type: number, source: computed, description: "Projected reliability per calculations.steward_reliability_score (variant projected)" }

  - name: Donor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Business / individual name" }
      - { name: donor_type, type: enum, source: input, description: "RESTAURANT | GROCER | INDIVIDUAL", constraints: "one of RESTAURANT, GROCER, INDIVIDUAL" }
      - { name: contact, type: string, source: input, description: "Contact phone or email" }

  - name: SponsorGrant
    parent: null
    common_fields: true
    fields:
      - { name: fridge_id, type: string, source: system, description: "FK -> Fridge.id; the funded fridge (from path)" }
      - { name: sponsor_name, type: string, source: input, description: "Name of the sponsoring organization" }
      - { name: amount_cents, type: integer, source: input, description: "Grant amount in cents", constraints: "integer >= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | CANCELLED", constraints: "one of ACTIVE, CANCELLED" }

  - name: StewardShift
    parent: null
    common_fields: true
    fields:
      - { name: fridge_id, type: string, source: system, description: "FK -> Fridge.id; the covered fridge (from path)" }
      - { name: steward_id, type: string, source: input, description: "FK -> Steward.id; the assigned volunteer" }
      - { name: kind, type: enum, source: input, description: "COVERAGE | CLEANING", constraints: "one of COVERAGE, CLEANING" }
      - { name: start_at, type: datetime, source: input, description: "Shift window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Shift window end (exclusive)" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | COMPLETED | MISSED", constraints: "one of SCHEDULED, COMPLETED, MISSED" }
      - { name: miles_traveled, type: number, source: input, default: 0, description: "Miles traveled, supplied at completion" }
      - { name: handled_cold_chain, type: boolean, source: input, default: false, description: "Whether the shift handled cold-chain goods, supplied at completion" }
      - { name: reimbursement_amount_cents, type: integer, source: computed, default: 0, description: "Reimbursement per calculations.shift_reimbursement_amount; set on COMPLETE, zeroed on fail-inspection" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time of completion" }

  - name: SurplusOffer
    parent: null
    common_fields: true
    fields:
      - { name: donor_id, type: string, source: system, description: "FK -> Donor.id; the offering donor (from path)" }
      - { name: fridge_id, type: string, source: input, description: "FK -> Fridge.id; the target fridge for the pickup" }
      - { name: description, type: string, source: input, description: "Free-text of the surplus offered" }
      - { name: estimated_quantity_kg, type: number, source: input, description: "Estimated surplus mass in kg", constraints: "number > 0" }
      - { name: pickup_by, type: datetime, source: input, description: "Deadline by which the surplus must be picked up" }
      - { name: status, type: enum, source: system, default: "OFFERED", description: "OFFERED | ACCEPTED | CONVERTED | EXPIRED", constraints: "one of OFFERED, ACCEPTED, CONVERTED, EXPIRED" }

  - name: DonationBatch
    parent: null
    common_fields: true
    fields:
      - { name: fridge_id, type: string, source: system, description: "FK -> Fridge.id; the receiving fridge (from path)" }
      - { name: steward_id, type: string, source: input, description: "FK -> Steward.id; the steward logging intake" }
      - { name: surplus_offer_id, type: string, source: input, default: null, description: "FK -> SurplusOffer.id; optional source offer (null for walk-in donations)" }
      - { name: food_category, type: enum, source: input, description: "PRODUCE | BAKERY | DAIRY | PREPARED | PACKAGED", constraints: "one of PRODUCE, BAKERY, DAIRY, PREPARED, PACKAGED" }
      - { name: storage_type, type: enum, source: input, description: "COLD_CHAIN | AMBIENT", constraints: "one of COLD_CHAIN, AMBIENT" }
      - { name: declared_quantity_kg, type: number, source: input, description: "Declared mass in kg at intake", constraints: "number > 0" }
      - { name: slot_footprint, type: integer, source: input, description: "Physical slots this batch occupies", constraints: "integer >= 1" }
      - { name: intake_temp_c, type: number, source: input, description: "Measured temperature at intake in Celsius" }
      - { name: use_by, type: datetime, source: input, description: "Food-safety use-by timestamp" }
      - { name: allergens, type: array, source: input, default: [], description: "Allergen labels (e.g., ['PEANUT','DAIRY']); required for BAKERY/DAIRY/PREPARED" }
      - { name: status, type: enum, source: system, default: "STOCKED", description: "STOCKED | HELD | RECALLED | EXPIRED | DISCARDED | CLAIMED_OUT", constraints: "one of STOCKED, HELD, RECALLED, EXPIRED, DISCARDED, CLAIMED_OUT" }
      - { name: available_quantity_kg, type: number, source: computed, description: "= declared_quantity_kg - sum(quantity_kg over non-VOIDED Claims)" }
      - { name: realized_quantity_kg, type: number, source: computed, default: 0, description: "Frozen at terminal transition: sum(quantity_kg over Claims with status != VOIDED)" }
      - { name: provisional_meals, type: integer, source: computed, description: "Set at STOCK per calculations.batch_meal_impact (variant provisional)" }
      - { name: realized_meals, type: integer, source: computed, default: 0, description: "Set at terminal per calculations.batch_meal_impact (variant realized)" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: donation_batch_id, type: string, source: system, description: "FK -> DonationBatch.id; the claimed batch (from path)" }
      - { name: fridge_id, type: string, source: system, description: "FK -> Fridge.id; denormalized from the batch" }
      - { name: quantity_kg, type: number, source: input, description: "Claimed mass in kg", constraints: "number > 0" }
      - { name: recipient_label, type: string, source: input, description: "Optional non-identifying recipient tag" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | VOIDED | EXPIRED", constraints: "one of OPEN, VOIDED, EXPIRED" }

  - name: NeedPosting
    parent: null
    common_fields: true
    fields:
      - { name: fridge_id, type: string, source: system, description: "FK -> Fridge.id; the fridge the need is posted at (from path)" }
      - { name: item_description, type: string, source: input, description: "What the community needs" }
      - { name: quantity_needed, type: integer, source: input, description: "How many units needed", constraints: "integer >= 1" }
      - { name: needed_by, type: datetime, source: input, description: "Deadline for the need" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | SUSPENDED | EXPIRED", constraints: "one of OPEN, SUSPENDED, EXPIRED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SurplusOffer
    initial_state: OFFERED
    terminal_states: [CONVERTED, EXPIRED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /offers/{offerId}/accept"
        actor: Steward
        preconditions:
          - "Fridge.safety_posture == OPERATIONAL (ERR_FRIDGE_NOT_OPERATIONAL)"
          - "current_utc < SurplusOffer.pickup_by (else ERR_OFFER_EXPIRED)"
        side_effects: ["status -> ACCEPTED"]
        note: "Branch A of the OFFERED fork."
      - from: OFFERED
        to: EXPIRED
        trigger: "system (run-ops when current_utc >= pickup_by)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]
        note: "Branch B of the OFFERED fork — divergent (no reservation, terminal)."
      - from: ACCEPTED
        to: CONVERTED
        trigger: "system (when a DonationBatch is created citing this offer via surplus_offer_id)"
        actor: system
        preconditions: []
        side_effects: ["status -> CONVERTED"]
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system (run-ops when current_utc >= pickup_by and not yet converted)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]

  - entity: DonationBatch
    initial_state: STOCKED
    terminal_states: [EXPIRED, DISCARDED, CLAIMED_OUT]
    transitions:
      - from: STOCKED
        to: HELD
        trigger: "system (cascade when parent Fridge.safety_posture becomes QUARANTINED)"
        actor: system
        preconditions: []
        side_effects: ["status -> HELD; batch remains counted in stock_slots_used"]
        note: "Revert pair with HELD->STOCKED."
      - from: HELD
        to: STOCKED
        trigger: "system (cascade when parent Fridge.safety_posture returns to OPERATIONAL/RESTRICTED)"
        actor: system
        preconditions: []
        side_effects: ["status -> STOCKED"]
      - from: STOCKED
        to: RECALLED
        trigger: "POST /donation-batches/{batchId}/recall"
        actor: Steward
        preconditions: []
        side_effects:
          - "status -> RECALLED (batch still counts in stock_slots_used)"
          - "All OPEN Claims on this batch -> VOIDED"
          - "Fridge.active_recall_count recomputed (+1) -> Fridge.safety_posture recomputed to QUARANTINED (cascade hop 2)"
          - "Because Fridge became QUARANTINED: every other STOCKED DonationBatch at the fridge -> HELD, and every OPEN NeedPosting -> SUSPENDED (cascade hop 3)"
      - from: HELD
        to: RECALLED
        trigger: "POST /donation-batches/{batchId}/recall"
        actor: Steward
        preconditions: []
        side_effects:
          - "status -> RECALLED"
          - "All OPEN Claims on this batch -> VOIDED"
          - "Fridge.safety_posture recomputed to QUARANTINED"
      - from: RECALLED
        to: DISCARDED
        trigger: "POST /donation-batches/{batchId}/discard"
        actor: Steward
        preconditions: []
        side_effects:
          - "status -> DISCARDED; batch leaves stock_slots_used (frees slots)"
          - "realized_quantity_kg + realized_meals frozen"
          - "Fridge.active_recall_count recomputed; if 0 and no other blockers, safety_posture may leave QUARANTINED (HELD batches -> STOCKED, SUSPENDED needs -> OPEN)"
      - from: STOCKED
        to: DISCARDED
        trigger: "POST /donation-batches/{batchId}/discard"
        actor: Steward
        preconditions: []
        side_effects:
          - "status -> DISCARDED; batch leaves stock_slots_used (frees slots) — compensation for the STOCK slot occupation"
          - "realized_quantity_kg + realized_meals frozen"
      - from: STOCKED
        to: EXPIRED
        trigger: "system (run-ops when current_utc >= use_by)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> EXPIRED; batch leaves stock_slots_used (frees slots)"
          - "realized_quantity_kg + realized_meals frozen"
      - from: HELD
        to: EXPIRED
        trigger: "system (run-ops when current_utc >= use_by)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED; frees slots; realized frozen"]
      - from: STOCKED
        to: CLAIMED_OUT
        trigger: "system (when available_quantity_kg reaches 0 after a Claim)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> CLAIMED_OUT; batch leaves stock_slots_used (frees slots)"
          - "realized_quantity_kg + realized_meals frozen"

  - entity: StewardShift
    initial_state: SCHEDULED
    terminal_states: [MISSED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /shifts/{shiftId}/complete"
        actor: Steward
        preconditions:
          - "Steward.status == ACTIVE (else ERR_STEWARD_SUSPENDED) — cross-entity dependency Shift->Steward"
          - "current_utc >= StewardShift.start_at (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> COMPLETED; completed_at = current_utc"
          - "reimbursement_amount_cents computed (calculations.shift_reimbursement_amount) -> Fridge.budget_committed_cents += reimbursement_amount_cents"
          - "if kind == CLEANING: Fridge.last_cleaned_at = current_utc -> Fridge.safety_posture recomputed (cascade hop 2, may leave RESTRICTED)"
          - "Steward.completed_count recomputed"
      - from: COMPLETED
        to: SCHEDULED
        trigger: "POST /shifts/{shiftId}/fail-inspection"
        actor: NetworkAdmin
        preconditions:
          - "kind == CLEANING (else ERR_INVALID_STATE)"
        side_effects:
          - "status -> SCHEDULED (cyclic revert)"
          - "Fridge.budget_committed_cents -= reimbursement_amount_cents; reimbursement_amount_cents -> 0"
          - "Fridge.last_cleaned_at reverted to prior value -> Fridge.safety_posture recomputed"
      - from: SCHEDULED
        to: MISSED
        trigger: "system (run-ops when current_utc >= end_at and status still SCHEDULED)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> MISSED; Steward.missed_count += 1"

  - entity: SponsorGrant
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /grants/{grantId}/cancel"
        actor: SponsorAgent
        preconditions:
          - "Fridge.budget_available_cents >= amount_cents (else ERR_BUDGET_EXCEEDED — funds already committed cannot be withdrawn)"
        side_effects:
          - "status -> CANCELLED"
          - "Fridge.budget_granted_cents -= amount_cents AND Fridge.budget_available_cents -= amount_cents (compensation preserves granted == available + committed)"

  - entity: Claim
    initial_state: OPEN
    terminal_states: [VOIDED, EXPIRED]
    transitions:
      - from: OPEN
        to: VOIDED
        trigger: "system (cascade when the parent DonationBatch is RECALLED)"
        actor: system
        preconditions: []
        side_effects: ["status -> VOIDED; quantity returns to batch.available_quantity_kg"]
      - from: OPEN
        to: EXPIRED
        trigger: "system (cascade when the parent DonationBatch transitions to EXPIRED)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]

  - entity: NeedPosting
    initial_state: OPEN
    terminal_states: [EXPIRED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "system (cascade when parent Fridge.safety_posture becomes QUARANTINED)"
        actor: system
        preconditions: []
        side_effects: ["status -> SUSPENDED"]
      - from: SUSPENDED
        to: OPEN
        trigger: "system (cascade when parent Fridge.safety_posture returns to non-QUARANTINED)"
        actor: system
        preconditions: []
        side_effects: ["status -> OPEN"]
      - from: OPEN
        to: EXPIRED
        trigger: "system (run-ops when current_utc >= needed_by)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (run-ops when current_utc >= needed_by)"
        actor: system
        preconditions: []
        side_effects: ["status -> EXPIRED"]

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: batch-intake-stale-fridge
    parent_entity: Fridge
    write_endpoint: "POST /fridges/{fridgeId}/donation-batches"
    occ_field: "expected_fridge_version"
    description: |
      Logging a DonationBatch intake against a Fridge whose version has advanced
      since the client last observed it is rejected. Each intake legitimately
      occupies capacity slots and bumps the fridge version; a writer whose view
      of free capacity is stale (another intake or a slot-freeing transition has
      since changed stock_slots_used) is turned away by the stale-version check
      rather than silently over-committing slots.
    error_id: ERR_FRIDGE_VERSION_CONFLICT
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fridge_slot_ledger
    trigger: "any DonationBatch stock/free transition (STOCK create, HELD, RECALLED, DISCARDED, EXPIRED, CLAIMED_OUT)"
    algorithm: aggregation
    formula: |
      stock_slots_used = sum(slot_footprint for DonationBatch where fridge_id == this
                             and status in {STOCKED, HELD, RECALLED})
      free_slots       = capacity_slots - stock_slots_used
    input_set: "DonationBatch rows in {STOCKED, HELD, RECALLED} only (terminal frees the slot)."
    precision: "integer slots, exact"

  - name: fridge_safety_posture
    trigger: "any change to active_recall_count, current_temp_c, or last_cleaned_at"
    algorithm: threshold
    formula: |
      if active_recall_count >= 1:
          posture = QUARANTINED
      elif current_temp_c > WARN_TEMP_C or (current_utc - last_cleaned_at) > CLEAN_INTERVAL_SECONDS:
          posture = RESTRICTED
      else:
          posture = OPERATIONAL
    constants:
      WARN_TEMP_C: 8.0
      CLEAN_INTERVAL_SECONDS: 604800   # 7 days
    precision: "enum"
    note: "QUARANTINED gates intake/accept/claim; RESTRICTED gates intake/accept but triggers hazard reimbursement multiplier."

  - name: fridge_budget_ledger
    trigger: "SponsorGrant create/cancel; StewardShift complete/fail-inspection"
    algorithm: aggregation
    formula: |
      budget_granted_cents   = sum(amount_cents for SponsorGrant where fridge_id == this and status == ACTIVE)
      budget_committed_cents = sum(reimbursement_amount_cents for StewardShift where fridge_id == this and status == COMPLETED)
      budget_available_cents = budget_granted_cents - budget_committed_cents
    input_set: "ACTIVE grants and COMPLETED shifts only."
    precision: "integer cents, exact"

  - name: shift_reimbursement_amount
    trigger: "StewardShift SCHEDULED->COMPLETED (POST /shifts/{id}/complete)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_STIPEND_CENTS[kind]                       # COVERAGE=1500, CLEANING=2000
      m = miles_traveled
      if m <= 5:
          mileage = round_half_up(m * RATE_LOW)
      elif m <= 20:
          mileage = round_half_up(5*RATE_LOW + (m-5)*RATE_MID)
      else:
          mileage = round_half_up(5*RATE_LOW + 15*RATE_MID + (m-20)*RATE_HIGH)
      bonus = COLD_CHAIN_BONUS_CENTS if handled_cold_chain else 0
      factor = HAZARD_MULT if Fridge.safety_posture == RESTRICTED else 1.0   # posture read at completion
      reimbursement_amount_cents = round_half_up((base + mileage + bonus) * factor)
    input_set: "Single shift; posture read from parent Fridge at completion time."
    constants:
      BASE_STIPEND_CENTS: { COVERAGE: 1500, CLEANING: 2000 }
      RATE_LOW: 50      # cents/mile for first 5 miles
      RATE_MID: 30      # cents/mile for miles 5..20
      RATE_HIGH: 20     # cents/mile beyond 20
      COLD_CHAIN_BONUS_CENTS: 500
      HAZARD_MULT: 1.25
    precision: "2 decimal places internally, round_half_up to whole cents"
    note: "Combinatorial mode (a): >=3 inputs (kind base, tiered mileage, cold-chain bonus, posture multiplier) with non-linear interaction."

  - name: batch_meal_impact
    trigger: "DonationBatch STOCK (provisional); DonationBatch terminal EXPIRED/DISCARDED/CLAIMED_OUT (realized)"
    algorithm: forward_looking
    formula: |
      provisional_meals = round_half_up(declared_quantity_kg / KG_PER_MEAL)   # at STOCK, from declared mass
      realized_quantity_kg = sum(quantity_kg for Claim where donation_batch_id == this and status != VOIDED)
      realized_meals = round_half_up(realized_quantity_kg / KG_PER_MEAL)       # frozen at terminal, from actually claimed mass
    input_set: "provisional from declared_quantity_kg; realized from non-VOIDED Claims at terminal."
    constants:
      KG_PER_MEAL: 1.2
    precision: "meals are whole integers, round_half_up"
    variants:
      - name: provisional
        when: "computed at STOCK from declared_quantity_kg"
        difference: "uses the donor's declared mass, ignores claims"
      - name: realized
        when: "frozen at terminal transition"
        difference: "uses summed non-VOIDED claimed mass; diverges from provisional whenever claimed != declared"

  - name: steward_reliability_score
    trigger: "read via GET /stewards/{id} (recomputed on access from current shift states)"
    algorithm: weighted_scoring
    formula: |
      completed = count(StewardShift where steward_id == this and status == COMPLETED)
      missed    = count(StewardShift where steward_id == this and status == MISSED)
      upcoming  = count(StewardShift where steward_id == this and status == SCHEDULED and end_at > current_utc)
      reliability_actual    = round_half_up(completed / (completed + missed), 2)              if (completed+missed) > 0 else 1.00
      reliability_projected = round_half_up((completed + upcoming) / (completed + missed + upcoming), 2) if (completed+missed+upcoming) > 0 else 1.00
    input_set: "COMPLETED and MISSED shifts (actual); plus future SCHEDULED shifts (projected)."
    precision: "2 decimal places, round_half_up"
    variants:
      - name: actual
        when: "resolved shifts only"
        difference: "excludes future SCHEDULED shifts"
      - name: projected
        when: "optimistic projection"
        difference: "counts future SCHEDULED shifts as if they will complete; diverges whenever upcoming > 0"

  - name: fridge_impact_report
    trigger: "read via GET /fridges/{id} (total_meals_provided field)"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round per batch, THEN sum. NOT round_half_up(sum(realized_quantity_kg)/KG_PER_MEAL).
      total_meals_provided = sum( round_half_up(b.realized_quantity_kg / KG_PER_MEAL)
                                  for b in DonationBatch where fridge_id == this
                                  and status in {EXPIRED, DISCARDED, CLAIMED_OUT} )
    input_set: "Terminal DonationBatch rows (EXPIRED, DISCARDED, CLAIMED_OUT) only; STOCKED/HELD/RECALLED excluded."
    constants:
      KG_PER_MEAL: 1.2
    precision: "per-batch round_half_up to whole meal, then integer sum"
    note: "Combinatorial mode (b): nested rounding where order matters; the round-then-sum order is pinned."

  - name: use_by_expiry_check
    trigger: "run-ops (POST /fridges/{id}/run-ops)"
    algorithm: threshold
    formula: |
      for b in DonationBatch where fridge_id == this and status in {STOCKED, HELD}:
          if current_utc >= b.use_by:          # boundary is INCLUSIVE (>=): exactly at use_by => EXPIRED
              b -> EXPIRED
    input_set: "STOCKED/HELD batches at the fridge."
    precision: "timestamp comparison, inclusive lower bound"
    note: "Boundary-precision metric: time (>=)."

  - name: cold_chain_temp_check
    trigger: "DonationBatch intake (POST /fridges/{id}/donation-batches)"
    algorithm: threshold
    formula: |
      if storage_type == COLD_CHAIN and intake_temp_c > MAX_SAFE_TEMP_C:   # strict >: exactly MAX_SAFE_TEMP_C is accepted
          reject ERR_TEMP_UNSAFE
    input_set: "Single batch at intake."
    constants:
      MAX_SAFE_TEMP_C: 5.0
    precision: "one decimal Celsius, strict upper bound (>)"
    note: "Boundary-precision metric: temperature (>), distinct from use_by time boundary."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lower number wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the operation per §1.7; entity_backed ownership (DonorAgent owns Donor, Steward owns own shifts) enforced"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all mutating endpoints"

  - priority: 3
    category: auth
    check: "DonorAgent X-User-ID must equal the donorId in the offer path (ownership)"
    error_id: ERR_DONOR_MISMATCH
    http_status: 403
    applies_to: "POST /donors/{donorId}/offers"

  - priority: 4
    category: existence
    check: "Referenced resources exist (path ids and body FKs), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource in a valid state for the transition (batch STOCKED/HELD for claim/recall/discard; offer OFFERED for accept; grant ACTIVE for cancel; need OPEN)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: state
    check: "Claim target DonationBatch must be STOCKED (not RECALLED/HELD/terminal)"
    error_id: ERR_BATCH_RECALLED
    http_status: 409
    applies_to: "POST /donation-batches/{batchId}/claims"

  - priority: 5
    category: state
    check: "SurplusOffer must not be past pickup_by at accept time"
    error_id: ERR_OFFER_EXPIRED
    http_status: 409
    applies_to: "POST /offers/{offerId}/accept"

  - priority: 6
    category: state
    check: "expected_fridge_version must equal current Fridge.version (OCC)"
    error_id: ERR_FRIDGE_VERSION_CONFLICT
    http_status: 412
    applies_to: "POST /fridges/{fridgeId}/donation-batches"

  - priority: 7
    category: business_safety
    check: "Fridge.safety_posture must be OPERATIONAL for intake and offer-accept"
    error_id: ERR_FRIDGE_NOT_OPERATIONAL
    http_status: 409
    applies_to: "POST /fridges/{fridgeId}/donation-batches, POST /offers/{offerId}/accept"

  - priority: 7
    category: business_safety
    check: "Steward.status must be ACTIVE to complete a shift"
    error_id: ERR_STEWARD_SUSPENDED
    http_status: 409
    applies_to: "POST /shifts/{shiftId}/complete"

  - priority: 8
    category: business_safety
    check: "COLD_CHAIN intake temperature must be <= MAX_SAFE_TEMP_C (5.0)"
    error_id: ERR_TEMP_UNSAFE
    http_status: 422
    applies_to: "POST /fridges/{fridgeId}/donation-batches"

  - priority: 8
    category: business_safety
    check: "allergens must be non-empty when food_category in {BAKERY, DAIRY, PREPARED}"
    error_id: ERR_ALLERGEN_LABEL_REQUIRED
    http_status: 422
    applies_to: "POST /fridges/{fridgeId}/donation-batches"

  - priority: 9
    category: business_safety
    check: "Claim target batch must not be past use_by"
    error_id: ERR_USE_BY_PASSED
    http_status: 422
    applies_to: "POST /donation-batches/{batchId}/claims"

  - priority: 10
    category: business_referential
    check: "When acting as Steward, X-User-ID must equal StewardShift.steward_id; NetworkAdmin may complete any shift"
    error_id: ERR_STEWARD_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /shifts/{shiftId}/complete"

  - priority: 11
    category: business_temporal
    check: "Shift start_at < end_at and pickup windows well-formed"
    error_id: ERR_PICKUP_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /fridges/{fridgeId}/shifts, POST /donors/{donorId}/offers"

  - priority: 12
    category: business_temporal
    check: "New COVERAGE shift must not overlap an existing SCHEDULED/COMPLETED COVERAGE shift on the SAME fridge; half-open [start,end), adjacency allowed"
    error_id: ERR_SHIFT_OVERLAP_FRIDGE
    http_status: 409
    applies_to: "POST /fridges/{fridgeId}/shifts"

  - priority: 13
    category: business_temporal
    check: "New shift must not fall within BUFFER_MIN (30) minutes of another shift for the SAME steward on any fridge; buffer-expanded closed interval"
    error_id: ERR_STEWARD_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /fridges/{fridgeId}/shifts"

  - priority: 14
    category: business_constraint
    check: "Intake slot_footprint must fit free_slots (slot_footprint <= free_slots)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /fridges/{fridgeId}/donation-batches"

  - priority: 15
    category: business_constraint
    check: "Claim quantity_kg must be <= batch.available_quantity_kg and available > 0"
    error_id: ERR_NO_PORTIONS
    http_status: 409
    applies_to: "POST /donation-batches/{batchId}/claims"

  - priority: 16
    category: business_fiscal
    check: "Grant cancel requires budget_available_cents >= amount_cents (cannot withdraw committed funds)"
    error_id: ERR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /grants/{grantId}/cancel"

  - priority: 17
    category: business_constraint
    check: "Request body fields present/typed; enums valid; clock never moves backward"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Fridge (root) ----
  - method: POST
    path: "/fridges"
    description: "Create a fridge location"
    roles: [NetworkAdmin]
    code: 201
    input: [name, location_label, capacity_slots]
    output: Fridge
    side_effects: ["safety_posture=OPERATIONAL; stock_slots_used=0; free_slots=capacity_slots; budgets=0; last_cleaned_at=created_at"]

  - method: GET
    path: "/fridges/{fridgeId}"
    description: "Get a fridge (includes computed posture, slot ledger, budget ledger, total_meals_provided)"
    roles: [NetworkAdmin, Steward, DonorAgent, SponsorAgent, Member]
    code: 200
    input: []
    output: Fridge
    side_effects: []

  - method: POST
    path: "/fridges/{fridgeId}/temperature"
    description: "Record an interior temperature reading; recomputes safety_posture"
    roles: [NetworkAdmin, Steward]
    code: 200
    input: [reading_c]
    output: Fridge
    side_effects: ["current_temp_c = reading_c", "safety_posture recomputed"]

  - method: POST
    path: "/fridges/{fridgeId}/run-ops"
    description: "Operations checkpoint at the current logical clock: expire batches past use_by, offers/needs past deadline, mark missed shifts, recompute posture"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Fridge
    side_effects:
      - "ops_run_index += 1"
      - "STOCKED/HELD batches with current_utc >= use_by -> EXPIRED (frees slots, freezes realized)"
      - "OFFERED/ACCEPTED offers with current_utc >= pickup_by -> EXPIRED"
      - "OPEN/SUSPENDED needs with current_utc >= needed_by -> EXPIRED"
      - "SCHEDULED shifts with current_utc >= end_at -> MISSED (Steward.missed_count += 1)"
      - "safety_posture recomputed"

  # ---- Steward (root) ----
  - method: POST
    path: "/stewards"
    description: "Register a volunteer steward"
    roles: [NetworkAdmin]
    code: 201
    input: [name, email]
    output: Steward
    side_effects: ["status=ACTIVE; missed_count=0"]

  - method: GET
    path: "/stewards/{stewardId}"
    description: "Get a steward (includes computed reliability_actual and reliability_projected)"
    roles: [NetworkAdmin, Steward, Member, DonorAgent, SponsorAgent]
    code: 200
    input: []
    output: Steward
    side_effects: []

  - method: POST
    path: "/stewards/{stewardId}/suspend"
    description: "Suspend a steward"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: Steward
    side_effects: ["status -> SUSPENDED"]

  # ---- Donor (root) ----
  - method: POST
    path: "/donors"
    description: "Register a surplus donor (restaurant/grocer/individual)"
    roles: [NetworkAdmin]
    code: 201
    input: [name, donor_type, contact]
    output: Donor
    side_effects: []

  - method: GET
    path: "/donors/{donorId}"
    description: "Get a donor"
    roles: [NetworkAdmin, DonorAgent, Steward]
    code: 200
    input: []
    output: Donor
    side_effects: []

  # ---- SponsorGrant ----
  - method: POST
    path: "/fridges/{fridgeId}/grants"
    description: "Create a sponsor grant funding a fridge"
    roles: [SponsorAgent, NetworkAdmin]
    code: 201
    input: [sponsor_name, amount_cents]
    output: SponsorGrant
    side_effects: ["status=ACTIVE; Fridge.budget_granted_cents += amount_cents; Fridge.budget_available_cents += amount_cents"]

  - method: GET
    path: "/grants/{grantId}"
    description: "Get a sponsor grant"
    roles: [NetworkAdmin, SponsorAgent, Steward]
    code: 200
    input: []
    output: SponsorGrant
    side_effects: []

  - method: GET
    path: "/grants"
    description: "List sponsor grants, filterable by fridge"
    roles: [NetworkAdmin, SponsorAgent, Steward]
    code: 200
    input: ["fridge_id?", "limit?", "offset?"]
    output: SponsorGrant[]
    side_effects: []

  - method: POST
    path: "/grants/{grantId}/cancel"
    description: "Cancel a grant, withdrawing its uncommitted funds"
    roles: [SponsorAgent, NetworkAdmin]
    code: 200
    input: []
    output: SponsorGrant
    side_effects: ["status -> CANCELLED; Fridge.budget_granted_cents -= amount_cents; Fridge.budget_available_cents -= amount_cents"]

  # ---- StewardShift ----
  - method: POST
    path: "/fridges/{fridgeId}/shifts"
    description: "Schedule a coverage or cleaning shift"
    roles: [Steward, NetworkAdmin]
    code: 201
    input: [steward_id, kind, start_at, end_at]
    output: StewardShift
    side_effects: ["status=SCHEDULED; overlap + double-booking checks applied"]

  - method: GET
    path: "/shifts/{shiftId}"
    description: "Get a steward shift"
    roles: [NetworkAdmin, Steward, Member]
    code: 200
    input: []
    output: StewardShift
    side_effects: []

  - method: GET
    path: "/shifts"
    description: "List shifts, filterable by fridge and/or steward"
    roles: [NetworkAdmin, Steward, Member]
    code: 200
    input: ["fridge_id?", "steward_id?", "limit?", "offset?"]
    output: StewardShift[]
    side_effects: []

  - method: POST
    path: "/shifts/{shiftId}/complete"
    description: "Complete a shift; computes reimbursement and (for CLEANING) updates cleanliness"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: [miles_traveled, handled_cold_chain]
    output: StewardShift
    side_effects:
      - "status -> COMPLETED; completed_at = current_utc"
      - "reimbursement_amount_cents computed -> Fridge.budget_committed_cents += it"
      - "if CLEANING: Fridge.last_cleaned_at = current_utc, posture recomputed"

  - method: POST
    path: "/shifts/{shiftId}/fail-inspection"
    description: "Fail a completed CLEANING shift's inspection; reverts it to SCHEDULED and reverses its reimbursement"
    roles: [NetworkAdmin]
    code: 200
    input: []
    output: StewardShift
    side_effects:
      - "status -> SCHEDULED (cyclic)"
      - "Fridge.budget_committed_cents -= reimbursement_amount_cents; reimbursement_amount_cents=0"
      - "Fridge.last_cleaned_at reverted; posture recomputed"

  # ---- SurplusOffer ----
  - method: POST
    path: "/donors/{donorId}/offers"
    description: "Donor posts a surplus-rescue pickup offer targeting a fridge"
    roles: [DonorAgent, NetworkAdmin]
    code: 201
    input: [fridge_id, description, estimated_quantity_kg, pickup_by]
    output: SurplusOffer
    side_effects: ["status=OFFERED"]

  - method: GET
    path: "/offers/{offerId}"
    description: "Get a surplus offer"
    roles: [NetworkAdmin, DonorAgent, Steward]
    code: 200
    input: []
    output: SurplusOffer
    side_effects: []

  - method: GET
    path: "/offers"
    description: "List surplus offers, filterable by donor and/or fridge"
    roles: [NetworkAdmin, DonorAgent, Steward]
    code: 200
    input: ["donor_id?", "fridge_id?", "limit?", "offset?"]
    output: SurplusOffer[]
    side_effects: []

  - method: POST
    path: "/offers/{offerId}/accept"
    description: "Steward accepts a surplus offer for pickup"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: []
    output: SurplusOffer
    side_effects: ["status -> ACCEPTED"]

  # ---- DonationBatch ----
  - method: POST
    path: "/fridges/{fridgeId}/donation-batches"
    description: "Log a donation intake into a fridge (food-safety checks, slot occupation, OCC on fridge version)"
    roles: [Steward, NetworkAdmin]
    code: 201
    input: [steward_id, food_category, storage_type, declared_quantity_kg, slot_footprint, intake_temp_c, use_by, "allergens?", "surplus_offer_id?", expected_fridge_version]
    output: DonationBatch
    side_effects:
      - "status=STOCKED; provisional_meals computed"
      - "Fridge.stock_slots_used += slot_footprint; free_slots recomputed"
      - "increments Fridge.version by 1"
      - "if surplus_offer_id given and offer ACCEPTED: offer -> CONVERTED"

  - method: GET
    path: "/donation-batches/{batchId}"
    description: "Get a donation batch (includes available_quantity_kg, provisional_meals, realized_meals)"
    roles: [NetworkAdmin, Steward, Member, DonorAgent]
    code: 200
    input: []
    output: DonationBatch
    side_effects: []

  - method: GET
    path: "/donation-batches"
    description: "List donation batches, filterable by fridge, steward, and/or source offer"
    roles: [NetworkAdmin, Steward, Member, DonorAgent]
    code: 200
    input: ["fridge_id?", "steward_id?", "surplus_offer_id?", "limit?", "offset?"]
    output: DonationBatch[]
    side_effects: []

  - method: POST
    path: "/donation-batches/{batchId}/recall"
    description: "Recall a batch (food-safety), cascading into fridge quarantine"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: []
    output: DonationBatch
    side_effects:
      - "status -> RECALLED; OPEN Claims -> VOIDED"
      - "Fridge.active_recall_count recomputed -> safety_posture -> QUARANTINED"
      - "other STOCKED batches -> HELD; OPEN needs -> SUSPENDED"

  - method: POST
    path: "/donation-batches/{batchId}/discard"
    description: "Discard a batch (spoiled/recalled), freeing its slots"
    roles: [Steward, NetworkAdmin]
    code: 200
    input: []
    output: DonationBatch
    side_effects:
      - "status -> DISCARDED; frees slots; realized frozen"
      - "if from RECALLED and active_recall_count reaches 0: fridge may leave QUARANTINED (HELD->STOCKED, SUSPENDED needs->OPEN)"

  # ---- Claim ----
  - method: POST
    path: "/donation-batches/{batchId}/claims"
    description: "Community member claims a portion of a stocked batch"
    roles: [Member, Steward, NetworkAdmin]
    code: 201
    input: [quantity_kg, recipient_label]
    output: Claim
    side_effects:
      - "status=OPEN; batch.available_quantity_kg -= quantity_kg"
      - "if available_quantity_kg reaches 0: batch -> CLAIMED_OUT (frees slots, freezes realized)"

  - method: GET
    path: "/claims/{claimId}"
    description: "Get a claim"
    roles: [NetworkAdmin, Steward, Member]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "List claims, filterable by batch and/or fridge"
    roles: [NetworkAdmin, Steward, Member]
    code: 200
    input: ["donation_batch_id?", "fridge_id?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  # ---- NeedPosting ----
  - method: POST
    path: "/fridges/{fridgeId}/needs"
    description: "Post a community need at a fridge"
    roles: [Member, Steward, NetworkAdmin]
    code: 201
    input: [item_description, quantity_needed, needed_by]
    output: NeedPosting
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/needs/{needId}"
    description: "Get a need posting"
    roles: [NetworkAdmin, Steward, Member]
    code: 200
    input: []
    output: NeedPosting
    side_effects: []

  - method: GET
    path: "/needs"
    description: "List need postings, filterable by fridge"
    roles: [NetworkAdmin, Steward, Member]
    code: 200
    input: ["fridge_id?", "limit?", "offset?"]
    output: NeedPosting[]
    side_effects: []

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (server startup default is 2026-03-01T00:00:00Z; the clock never reads real wall-clock time and must not move backward)"
    roles: [NetworkAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical current_utc = to_iso8601 (must be >= current value else ERR_VALIDATION)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_DONOR_MISMATCH, http: 403, condition: "DonorAgent acting on a donor other than their own X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced fridge/steward/donor/grant/shift/offer/batch/claim/need does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body, missing required field, invalid enum, or clock moved backward" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_BATCH_RECALLED, http: 409, condition: "Claim attempted on a batch not in STOCKED status (RECALLED/HELD/terminal)" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Accepting a surplus offer already past its pickup_by" }
  - { id: ERR_FRIDGE_VERSION_CONFLICT, http: 412, condition: "expected_fridge_version does not match current Fridge.version at intake" }
  - { id: ERR_FRIDGE_NOT_OPERATIONAL, http: 409, condition: "Intake/offer-accept while Fridge.safety_posture != OPERATIONAL" }
  - { id: ERR_TEMP_UNSAFE, http: 422, condition: "COLD_CHAIN intake temperature exceeds MAX_SAFE_TEMP_C (5.0)" }
  - { id: ERR_ALLERGEN_LABEL_REQUIRED, http: 422, condition: "Missing allergen labels for BAKERY/DAIRY/PREPARED food_category" }
  - { id: ERR_USE_BY_PASSED, http: 422, condition: "Claim on a batch already past its use_by" }
  - { id: ERR_STEWARD_SUSPENDED, http: 409, condition: "Completing a shift while the steward is SUSPENDED" }
  - { id: ERR_STEWARD_NOT_ASSIGNED, http: 409, condition: "Steward is not the shift's assigned steward / not assigned to the fridge" }
  - { id: ERR_PICKUP_WINDOW_INVALID, http: 422, condition: "start_at >= end_at or pickup window malformed" }
  - { id: ERR_SHIFT_OVERLAP_FRIDGE, http: 409, condition: "COVERAGE shift overlaps another on the same fridge (half-open interval)" }
  - { id: ERR_STEWARD_DOUBLE_BOOKED, http: 409, condition: "Shift falls within the 30-minute travel buffer of another shift for the same steward" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "Intake slot_footprint exceeds free_slots" }
  - { id: ERR_NO_PORTIONS, http: 409, condition: "Claim quantity exceeds available_quantity_kg or batch has zero available" }
  - { id: ERR_BUDGET_EXCEEDED, http: 402, condition: "Grant cancel would drive budget_available_cents below zero" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Network operator: provisions fridges/stewards/donors, runs ops checkpoints, sets the logical clock, fails inspections, suspends stewards"
    identity: "opaque"
    exclusive_operations:
      - "POST /fridges"
      - "POST /stewards"
      - "POST /donors"
      - "POST /fridges/{fridgeId}/run-ops"
      - "POST /stewards/{stewardId}/suspend"
      - "POST /shifts/{shiftId}/fail-inspection"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /fridges/{fridgeId}/temperature"
      - "POST /fridges/{fridgeId}/grants"
      - "POST /grants/{grantId}/cancel"
      - "POST /fridges/{fridgeId}/shifts"
      - "POST /shifts/{shiftId}/complete"
      - "POST /donors/{donorId}/offers"
      - "POST /offers/{offerId}/accept"
      - "POST /fridges/{fridgeId}/donation-batches"
      - "POST /donation-batches/{batchId}/recall"
      - "POST /donation-batches/{batchId}/discard"
      - "POST /donation-batches/{batchId}/claims"
      - "POST /fridges/{fridgeId}/needs"
      - "all GET reads"

  - name: Steward
    description: "Volunteer who covers/cleans fridges, accepts surplus pickups, logs intake, recalls/discards unsafe food"
    identity: "entity_backed:Steward"
    exclusive_operations:
      - "POST /fridges/{fridgeId}/donation-batches"
      - "POST /donation-batches/{batchId}/recall"
      - "POST /donation-batches/{batchId}/discard"
      - "POST /offers/{offerId}/accept"
    shared_operations:
      - "POST /fridges/{fridgeId}/temperature"
      - "POST /fridges/{fridgeId}/shifts (own steward_id)"
