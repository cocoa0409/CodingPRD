# =============================================================================
# Task 1962 — School District Budget & Bond/Levy Election (district business office)
# PRD Benchmark Scaffold — §1.0–§1.7
# =============================================================================

scenario: |
  1962. School District Budget & Bond/Levy Election (district business office): budget
  development by fund & enrollment projection, staffing allocation formula & position
  control, revenue estimate (state aid/local levy) & tax rate calculation, public hearing
  & adoption deadline, bond project list & bond capacity limit, election calendar, ballot
  language & campaign restriction, bond sale, project accounting & capital-plan amendment

domain_name: school-district-budget-bond-levy
api_prefix: /district

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
    - cascading_side_effects
  entity_topology: flat            # peer entities joined by FK references; nested create endpoints only
  state_machine_shape: cyclic      # revision loops on BudgetVersion / BondProposal / CapitalPlanAmendment; parallel dimensions on ProjectExpenditure
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

conventions: |
  - All list endpoints return items ordered by created_at ASC (stable; no id-based ordering anywhere).
  - Date fields (hearing_date, election_date, sale_date, construction_start/end, start_date, end_date)
    are ISO calendar dates (YYYY-MM-DD). All deadline/window arithmetic is at whole-day granularity in UTC:
    "today" means the calendar date of the server's logical clock (see POST /_clock/set_current_utc).
  - The logical clock's startup default is 2026-08-01T00:00:00Z; it never falls back to wall-clock time.
  - Money fields are decimal numbers; all money math is round_half_up to 2 decimal places.
  - Tax rates are round_half_up to 4 decimal places, per fund, BEFORE any summation.
  - EnrollmentProjection.grade_band values: ELEMENTARY | MIDDLE | HIGH.
  - BudgetLine.fund_code values: EDUCATION | OPERATIONS | TRANSPORTATION | DEBT_SERVICE | CAPITAL_PROJECTS.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (16 entities)
# =============================================================================
entities:
  - name: FiscalYear
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: label, type: string, source: input, description: "Fiscal year label, unique (e.g. FY2028)" }
      - { name: start_date, type: datetime, source: input, description: "First day of fiscal year (e.g. 2027-07-01); adoption must complete strictly before this date" }
      - { name: end_date, type: datetime, source: input, description: "Last day of fiscal year (must be after start_date)" }
      - { name: eav_current, type: number, source: input, description: "Equalized assessed valuation, current tax year (used by CERTIFIED revenue variant and bond capacity)" }
      - { name: eav_prior, type: number, source: input, description: "Equalized assessed valuation, prior tax year (used by PROVISIONAL revenue variant)" }
      - { name: prior_year_extension, type: number, source: input, description: "Prior-year operating tax extension; PTELL cap base" }
      - { name: outstanding_debt_principal, type: number, source: input, description: "Outstanding bonded principal at fiscal year creation; incremented by bond sale close" }
      - { name: fte_ceiling, type: number, source: input, description: "Position-control ceiling: max sum of allocated_fte across staffing allocations of any single budget version" }
      - { name: authorized_fte_total, type: number, source: computed, default: 0, description: "Sum of allocated_fte over StaffingAllocations in AUTHORIZED status belonging to this fiscal year" }
      - { name: open_position_count, type: integer, source: computed, default: 0, description: "Count of Positions in OPEN status belonging (via staffing allocation -> budget version) to this fiscal year" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OPEN -> CLOSED", constraints: "values: DRAFT, OPEN, CLOSED" }

  - name: EnrollmentProjection
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id; set from path at creation" }
      - { name: grade_band, type: enum, source: input, description: "Grade band", constraints: "values: ELEMENTARY, MIDDLE, HIGH; unique per fiscal year" }
      - { name: projected_pupils, type: integer, source: input, description: "Projected enrollment for the band (>= 0)" }
      - { name: actual_pupils, type: integer, source: input, description: "Certified actual enrollment, supplied at certify time; null until CERTIFIED", constraints: "null until certification" }
      - { name: weighted_pupils_projected, type: integer, source: computed, description: "round_half_up(projected_pupils * band_weight, 0); band weights ELEMENTARY 1.00, MIDDLE 1.05, HIGH 1.15" }
      - { name: weighted_pupils_certified, type: integer, source: computed, description: "round_half_up(actual_pupils * band_weight, 0); null until CERTIFIED", constraints: "null until certification" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> CERTIFIED", constraints: "values: PROVISIONAL, CERTIFIED" }

  - name: BudgetVersion
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id; set from path at creation" }
      - { name: version_label, type: string, source: computed, description: "v1, v2, ... per fiscal year, assigned in creation order" }
      - { name: total_appropriations, type: number, source: computed, default: 0, description: "Sum of appropriation_amount over this version's BudgetLines (any status except SUPERSEDED is impossible pre-adoption; DRAFT lines counted)" }
      - { name: hearing_held_date, type: datetime, source: system, description: "Calendar date on which a hearing of this version was HELD (sets HEARING_HELD); null until then", constraints: "null until hearing held" }
      - { name: adopted_at, type: datetime, source: system, description: "Timestamp of adoption; null until ADOPTED", constraints: "null until adopted" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROPOSED -> HEARING_HELD -> ADOPTED -> SUPERSEDED; PROPOSED/HEARING_HELD -> DRAFT (return-to-draft loop)", constraints: "values: DRAFT, PROPOSED, HEARING_HELD, ADOPTED, SUPERSEDED" }

  - name: BudgetLine
    parent: null
    common_fields: true
    fields:
      - { name: budget_version_id, type: string, source: system, description: "FK -> BudgetVersion.id; set from path at creation" }
      - { name: fund_code, type: enum, source: input, description: "Fund", constraints: "values: EDUCATION, OPERATIONS, TRANSPORTATION, DEBT_SERVICE, CAPITAL_PROJECTS" }
      - { name: function_code, type: string, source: input, description: "Function classification code (e.g. 1100 regular instruction)" }
      - { name: object_code, type: string, source: input, description: "Object classification code (e.g. 100 salaries)" }
      - { name: cost_center, type: string, source: input, description: "Cost center label (school or department)" }
      - { name: appropriation_amount, type: number, source: input, description: "Appropriated amount (> 0); mutated by transfers" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ADOPTED -> SUPERSEDED", constraints: "values: DRAFT, ADOPTED, SUPERSEDED" }

  - name: StaffingAllocation
    parent: null
    common_fields: true
    fields:
      - { name: budget_version_id, type: string, source: system, description: "FK -> BudgetVersion.id; set from path at creation" }
      - { name: enrollment_projection_id, type: string, source: input, description: "FK -> EnrollmentProjection.id; projection this allocation is computed from (must belong to same fiscal year as the budget version)" }
      - { name: grade_band, type: enum, source: input, description: "Grade band; must equal the referenced projection's grade_band; unique per budget version", constraints: "values: ELEMENTARY, MIDDLE, HIGH" }
      - { name: required_fte, type: number, source: computed, description: "Formula FTE floor: 1.0 if projected pupils < 40, else ceil((pupils / band_ratio) * 2) / 2 with ratios ELEMENTARY 20, MIDDLE 22, HIGH 25" }
      - { name: allocated_fte, type: number, source: input, description: "Board-allocated FTE for the band; multiple of 0.5, > 0, and <= required_fte" }
      - { name: positions_fte_total, type: number, source: computed, default: 0, description: "Sum of fte over this allocation's Positions with status != ELIMINATED" }
      - { name: cost_estimate_projected, type: number, source: computed, description: "PROJECTED_ALLOCATION variant: allocated_fte * 62000 * 1.34" }
      - { name: cost_estimate_actual, type: number, source: computed, description: "POSITION_ACTUAL variant: sum over Positions (status PROPOSED/OPEN/FILLED) of (FILLED ? incumbent_salary : base_salary) * fte * 1.34" }
      - { name: status, type: enum, source: system, description: "DRAFT -> AUTHORIZED -> SUPERSEDED", constraints: "values: DRAFT, AUTHORIZED, SUPERSEDED" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: staffing_allocation_id, type: string, source: system, description: "FK -> StaffingAllocation.id; set from path at creation" }
      - { name: title, type: string, source: input, description: "Position title (e.g. Grade 4 Teacher)" }
      - { name: fte, type: number, source: input, description: "Position FTE; must be 0.5 or 1.0", constraints: "values: 0.5, 1.0" }
      - { name: base_salary, type: number, source: input, description: "Budgeted salary for the slot (> 0); used by POSITION_ACTUAL variant while unfilled" }
      - { name: incumbent_salary, type: number, source: input, description: "Actual salary set at fill; cleared on vacate; null while not FILLED", constraints: "null unless FILLED" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> OPEN -> FILLED -> OPEN (vacate loop); any non-terminal -> ELIMINATED", constraints: "values: PROPOSED, OPEN, FILLED, ELIMINATED" }

  - name: RevenueEstimate
    parent: null
    common_fields: true
    fields:
      - { name: budget_version_id, type: string, source: system, description: "FK -> BudgetVersion.id; set from path at creation; at most one estimate per budget version" }
      - { name: operating_levy_request, type: number, source: input, description: "Requested operating levy extension (> 0)" }
      - { name: debt_service_levy, type: number, source: input, description: "Debt service levy (>= 0); outside the PTELL cap" }
      - { name: other_revenue, type: number, source: input, description: "Other revenue sources (>= 0)" }
      - { name: cpi_rate, type: number, source: input, description: "CPI used for PTELL cap, decimal (e.g. 0.034); PTELL uses min(cpi_rate, 0.05)" }
      - { name: capped_operating_levy, type: number, source: computed, description: "min(operating_levy_request, prior_year_extension * (1 + min(cpi_rate, 0.05)))" }
      - { name: total_levy, type: number, source: computed, description: "capped_operating_levy + debt_service_levy" }
      - { name: eav_basis, type: enum, source: system, description: "Which EAV the authoritative rates used", constraints: "values: PRIOR, CURRENT; PRIOR while PROVISIONAL, CURRENT after RECERTIFIED" }
      - { name: state_aid, type: number, source: computed, description: "Authoritative state aid: max(0, 7600 * weighted pupils - 0.023 * eav basis); provisional pupils/PRIOR eav while PROVISIONAL, certified pupils/CURRENT eav after RECERTIFIED" }
      - { name: operating_rate, type: number, source: computed, description: "round_half_up(capped_operating_levy / eav basis * 100, 4)" }
      - { name: debt_service_rate, type: number, source: computed, description: "round_half_up(debt_service_levy / eav basis * 100, 4)" }
      - { name: total_tax_rate, type: number, source: computed, description: "operating_rate + debt_service_rate (sum of the two already-rounded per-fund rates; the sum itself is never re-rounded)" }
      - { name: total_revenue, type: number, source: computed, description: "state_aid + total_levy + other_revenue (authoritative variant)" }
      - { name: state_aid_provisional, type: number, source: computed, description: "Provisional-variant state aid, retained after recertification for comparison" }
      - { name: total_revenue_provisional, type: number, source: computed, description: "Provisional-variant total revenue, retained after recertification" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL -> RECERTIFIED", constraints: "values: PROVISIONAL, RECERTIFIED" }

  - name: PublicHearing
    parent: null
    common_fields: true
    fields:
      - { name: budget_version_id, type: string, source: system, description: "FK -> BudgetVersion.id; set from path at creation" }
      - { name: venue, type: string, source: input, description: "Hearing venue label" }
      - { name: hearing_date, type: datetime, source: input, description: "Calendar date of the hearing; must be >= notice_publication_date + 10 days" }
      - { name: notice_publication_date, type: datetime, source: system, description: "Calendar date the notice is published = logical clock date at creation" }
      - { name: status, type: enum, source: system, description: "NOTICE_PUBLISHED -> HELD | CANCELLED", constraints: "values: NOTICE_PUBLISHED, HELD, CANCELLED" }

  - name: Election
    parent: null
    common_fields: true
    fields:
      - { name: election_date, type: datetime, source: input, description: "Must be the first Tuesday of March, June, or November (any year)" }
      - { name: election_type, type: enum, source: input, description: "Election type", constraints: "values: REGULAR, SPECIAL" }
      - { name: canvassed_at, type: datetime, source: system, description: "Timestamp of canvass; null until CANVASSED", constraints: "null until canvassed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> CANVASSED", constraints: "values: SCHEDULED, CANVASSED" }

  - name: BondProposal
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year_id, type: string, source: system, description: "FK -> FiscalYear.id; set from path at creation" }
      - { name: question_title, type: string, source: input, description: "Short title of the bond question" }
      - { name: purpose, type: string, source: input, description: "Statutory purpose statement" }
      - { name: total_amount, type: number, source: input, description: "Voter-authorized par ceiling requested (> 0)" }
      - { name: remaining_authorization, type: number, source: computed, description: "total_amount - sum of par_amount over this proposal's BondSales with status PLANNED or CLOSED" }
      - { name: available_proceeds, type: number, source: computed, default: 0, description: "sum of net_proceeds over CLOSED BondSales - sum of amount over ProjectExpenditures (payment_status != VOIDED) across this proposal's projects" }
      - { name: passed_at, type: datetime, source: system, description: "Timestamp when canvass passed the measure; null until PASSED", constraints: "null until passed" }
      - { name: status, type: enum, source: system, description: "DRAFT -> BOARD_APPROVED -> REFERRED -> PASSED | FAILED -> DRAFT (revise loop)", constraints: "values: DRAFT, BOARD_APPROVED, REFERRED, PASSED, FAILED" }

  - name: BondProject
    parent: null
    common_fields: true
    fields:
      - { name: bond_proposal_id, type: string, source: system, description: "FK -> BondProposal.id; set from path at creation" }
      - { name: name, type: string, source: input, description: "Project name" }
      - { name: site_code, type: string, source: input, description: "Site identifier used for construction-window conflict checks" }
      - { name: estimated_cost, type: number, source: input, description: "Estimated project cost (> 0)" }
      - { name: construction_start, type: datetime, source: input, description: "Construction window start date (inclusive)" }
      - { name: construction_end, type: datetime, source: input, description: "Construction window end date (exclusive); must be after construction_start" }
      - { name: priority_rank, type: integer, source: input, description: "Priority rank; unique among this proposal's non-CANCELLED projects" }
      - { name: authorized_amount, type: number, source: computed, default: 0, description: "0 while PLANNED; set to estimated_cost when the proposal passes; adjusted by approved CapitalPlanAmendments" }
      - { name: spent_amount, type: number, source: computed, default: 0, description: "Sum of amount over this project's ProjectExpenditures with payment_status != VOIDED" }
      - { name: status, type: enum, source: system, description: "PLANNED -> AUTHORIZED -> IN_PROGRESS -> COMPLETED; PLANNED/AUTHORIZED -> CANCELLED", constraints: "values: PLANNED, AUTHORIZED, IN_PROGRESS, COMPLETED, CANCELLED" }

  - name: BallotMeasure
    parent: null
    common_fields: true
    fields:
      - { name: election_id, type: string, source: system, description: "FK -> Election.id; set from path at creation" }
      - { name: bond_proposal_id, type: string, source: input, description: "FK -> BondProposal.id; proposal being referred; at most one measure per proposal per election" }
      - { name: ballot_language, type: string, source: input, description: "Full ballot question text; whitespace-separated word count must be <= 200 at certification" }
      - { name: word_count, type: integer, source: computed, description: "Count of whitespace-separated tokens in ballot_language" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the creator (segregation-of-duties anchor)" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the certifier; null until certified", constraints: "null until certified" }
      - { name: yes_votes, type: integer, source: system, description: "Canvassed yes votes; null until canvass", constraints: "null until canvass" }
      - { name: no_votes, type: integer, source: system, description: "Canvassed no votes; null until canvass", constraints: "null until canvass" }
      - { name: status, type: enum, source: system, description: "LANGUAGE_DRAFT -> LANGUAGE_CERTIFIED -> PASSED | FAILED", constraints: "values: LANGUAGE_DRAFT, LANGUAGE_CERTIFIED, PASSED, FAILED" }

  - name: DistrictPublication
    parent: null
    common_fields: false   # id + created_at only; append-only record
    fields:
      - { name: ballot_measure_id, type: string, source: system, description: "FK -> BallotMeasure.id; set from path at creation" }
      - { name: publication_type, type: enum, source: input, description: "FACTUAL (neutral info) or PROMOTIONAL (advocacy)", constraints: "values: FACTUAL, PROMOTIONAL" }
      - { name: content, type: string, source: input, description: "Publication text" }
      - { name: published_by_user_id, type: string, source: system, description: "X-User-ID of the publisher" }
      - { name: status, type: enum, source: system, description: "Always PUBLISHED on creation", constraints: "values: PUBLISHED" }

  - name: BondSale
    parent: null
    common_fields: true
    fields:
      - { name: bond_proposal_id, type: string, source: system, description: "FK -> BondProposal.id; set from path at creation" }
      - { name: series_label, type: string, source: input, description: "Series label (e.g. 2027-A); unique per proposal" }
      - { name: par_amount, type: number, source: input, description: "Par amount sold (> 0); must be <= proposal remaining_authorization" }
      - { name: premium, type: number, source: input, description: "Sale premium (>= 0)" }
      - { name: issuance_costs, type: number, source: input, description: "Issuance costs (>= 0)" }
      - { name: sale_date, type: datetime, source: input, description: "Scheduled sale date; must be <= passed_at + 36 months; close requires today >= sale_date" }
      - { name: net_proceeds, type: number, source: computed, description: "par_amount + premium - issuance_costs; must be > 0" }
      - { name: status, type: enum, source: system, description: "PLANNED -> CLOSED | CANCELLED", constraints: "values: PLANNED, CLOSED, CANCELLED" }

  - name: ProjectExpenditure
    parent: null
    common_fields: true
    fields:
      - { name: bond_project_id, type: string, source: system, description: "FK -> BondProject.id; set from path at creation" }
      - { name: vendor_name, type: string, source: input, description: "Vendor name" }
      - { name: amount, type: number, source: input, description: "Expenditure amount (> 0)" }
      - { name: description, type: string, source: input, description: "Expenditure description" }
      - { name: retainage_amount, type: number, source: computed, default: 0, description: "round_half_up(amount * 0.10, 2) once disbursed; 0 while UNPAID" }
      - { name: disbursed_amount, type: number, source: computed, default: 0, description: "amount - retainage_amount once disbursed; 0 while UNPAID" }
      - { name: review_status, type: enum, source: system, description: "Parallel dimension 1: PENDING_REVIEW -> REVIEWED | FLAGGED -> REVIEWED", constraints: "values: PENDING_REVIEW, REVIEWED, FLAGGED" }
      - { name: payment_status, type: enum, source: system, description: "Parallel dimension 2: UNPAID -> DISBURSED -> RETAINAGE_RELEASED; UNPAID/DISBURSED -> VOIDED", constraints: "values: UNPAID, DISBURSED, RETAINAGE_RELEASED, VOIDED" }

  - name: CapitalPlanAmendment
    parent: null
    common_fields: true
    fields:
      - { name: bond_proposal_id, type: string, source: system, description: "FK -> BondProposal.id; set from path at creation" }
      - { name: reason, type: string, source: input, description: "Amendment justification" }
      - { name: adjustments, type: array, source: input, description: "Array of { bond_project_id, delta_authorized }; deltas applied to BondProject.authorized_amount on approval" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID recorded at submit (segregation-of-duties anchor); null until SUBMITTED", constraints: "null until submitted" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED | REJECTED -> DRAFT (revise loop)", constraints: "values: DRAFT, SUBMITTED, APPROVED, REJECTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: FiscalYear
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: POST /district/fiscal-years/{fyId}/open
        actor: BusinessManager
        preconditions: []
        side_effects: ["increments FiscalYear.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: POST /district/fiscal-years/{fyId}/close
        actor: BusinessManager
        preconditions:
          - "An ADOPTED BudgetVersion exists for this fiscal year (ERR_NO_ADOPTED_BUDGET_VERSION)"
        side_effects:
          - "increments FiscalYear.version by 1"
          - "Any PublicHearing of any BudgetVersion of this fiscal year still NOTICE_PUBLISHED -> CANCELLED"

  - entity: EnrollmentProjection
    initial_state: PROVISIONAL
    terminal_states: [CERTIFIED]
    transitions:
      - from: PROVISIONAL
        to: CERTIFIED
        trigger: POST /district/enrollment-projections/{epId}/certify
        actor: BusinessManager
        preconditions:
          - "actual_pupils >= 0 supplied (ERR_INVALID_FIELD_VALUE)"
        side_effects:
          - "actual_pupils recorded; weighted_pupils_certified = round_half_up(actual_pupils * band_weight, 0)"
          - "increments EnrollmentProjection.version by 1"

  - entity: BudgetVersion
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: POST /district/budget-versions/{bvId}/propose
        actor: BoardClerk
        preconditions: []
        side_effects: ["increments BudgetVersion.version by 1"]
      - from: PROPOSED
        to: DRAFT
        trigger: POST /district/budget-versions/{bvId}/return-to-draft
        actor: BoardClerk
        preconditions: []
        side_effects:
          - "All NOTICE_PUBLISHED hearings of this version -> CANCELLED"
          - "increments BudgetVersion.version by 1"
      - from: HEARING_HELD
        to: DRAFT
        trigger: POST /district/budget-versions/{bvId}/return-to-draft
        actor: BoardClerk
        preconditions: []
        side_effects:
          - "hearing_held_date cleared to null"
          - "increments BudgetVersion.version by 1"
      - from: PROPOSED
        to: HEARING_HELD
        trigger: "system (a PublicHearing of this version transitions to HELD)"
        actor: system
        preconditions: []
        side_effects:
          - "hearing_held_date = the hearing's hearing_date"
          - "increments BudgetVersion.version by 1"
      - from: HEARING_HELD
        to: ADOPTED
        trigger: POST /district/budget-versions/{bvId}/adopt
        actor: BoardClerk
        preconditions:
          - "today >= hearing_held_date + 7 days (ERR_ADOPTION_TOO_SOON)"
          - "today < fiscal year start_date (ERR_ADOPTION_DEADLINE_PASSED)"
          - "a RevenueEstimate exists for this version (ERR_NO_REVENUE_ESTIMATE)"
          - "total_appropriations <= RevenueEstimate.total_revenue (ERR_BUDGET_NOT_BALANCED)"
        side_effects:
          - "adopted_at = now"
          - "CASCADE A link 1: every StaffingAllocation of this version DRAFT -> AUTHORIZED"
          - "CASCADE A link 2 (caused by each allocation becoming AUTHORIZED): every Position of that allocation PROPOSED -> OPEN"
          - "CASCADE A link 3 (caused by each position becoming OPEN): FiscalYear.authorized_fte_total and FiscalYear.open_position_count recomputed"
          - "CASCADE A fan-out: every BudgetLine of this version DRAFT -> ADOPTED"
          - "Any OTHER BudgetVersion of this fiscal year in ADOPTED -> SUPERSEDED (with its own supersede cascade)"
          - "increments BudgetVersion.version by 1"
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system (a new BudgetVersion is created for the same fiscal year, or another version is adopted)"
        actor: system
        preconditions: []
        side_effects:
          - "SUPERSEDE CASCADE link 1: every StaffingAllocation of this version AUTHORIZED -> SUPERSEDED"
          - "SUPERSEDE CASCADE link 2 (caused by each allocation becoming SUPERSEDED): every Position of that allocation with status PROPOSED, OPEN, or FILLED -> ELIMINATED"
          - "SUPERSEDE CASCADE link 3 (caused by position eliminations): FiscalYear.authorized_fte_total, FiscalYear.open_position_count, and each allocation's positions_fte_total recomputed"
          - "SUPERSEDE CASCADE fan-out: every BudgetLine of this version ADOPTED -> SUPERSEDED"
          - "increments BudgetVersion.version by 1"

  - entity: BudgetLine
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ADOPTED
        trigger: "system (budget version adoption cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ADOPTED
        to: SUPERSEDED
        trigger: "system (budget version supersede cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: StaffingAllocation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: AUTHORIZED
        trigger: "system (budget version adoption cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Every Position of this allocation PROPOSED -> OPEN (cascade link)"
          - "FiscalYear.authorized_fte_total recomputed (cascade link)"
      - from: AUTHORIZED
        to: SUPERSEDED
        trigger: "system (budget version supersede cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Every Position of this allocation PROPOSED/OPEN/FILLED -> ELIMINATED (cascade link)"
          - "FiscalYear.authorized_fte_total recomputed (cascade link)"

  - entity: Position
    initial_state: PROPOSED
    terminal_states: [ELIMINATED]
    transitions:
      - from: PROPOSED
        to: OPEN
        trigger: "system (staffing allocation authorization cascade)"
        actor: system
        preconditions: []
        side_effects: ["FiscalYear.open_position_count recomputed (cascade link)"]
      - from: OPEN
        to: FILLED
        trigger: POST /district/positions/{pId}/fill
        actor: Superintendent
        preconditions:
          - "incumbent_salary > 0 (ERR_INVALID_FIELD_VALUE)"
        side_effects:
          - "incumbent_salary recorded; FiscalYear.open_position_count recomputed"
          - "StaffingAllocation.cost_estimate_actual recomputed (POSITION_ACTUAL variant)"
          - "increments Position.version by 1"
      - from: FILLED
        to: OPEN
        trigger: POST /district/positions/{pId}/vacate
        actor: Superintendent
        preconditions: []
        side_effects:
          - "incumbent_salary cleared to null; FiscalYear.open_position_count recomputed"
          - "StaffingAllocation.cost_estimate_actual recomputed"
          - "increments Position.version by 1"
      - from: PROPOSED
        to: ELIMINATED
        trigger: "system (supersede cascade) or POST /district/positions/{pId}/eliminate"
        actor: "Superintendent | system"
        preconditions: []
        side_effects:
          - "StaffingAllocation.positions_fte_total recomputed"
          - "StaffingAllocation.cost_estimate_actual recomputed"
          - "increments Position.version by 1 (actor-driven)"
      - from: OPEN
        to: ELIMINATED
        trigger: "system (supersede cascade) or POST /district/positions/{pId}/eliminate"
        actor: "Superintendent | system"
        preconditions: []
        side_effects:
          - "StaffingAllocation.positions_fte_total recomputed; FiscalYear.open_position_count recomputed"
          - "StaffingAllocation.cost_estimate_actual recomputed"
      - from: FILLED
        to: ELIMINATED
        trigger: "system (supersede cascade only; actor-driven eliminate of a FILLED position is rejected)"
        actor: system
        preconditions: []
        side_effects:
          - "StaffingAllocation.positions_fte_total recomputed"
          - "StaffingAllocation.cost_estimate_actual recomputed"

  - entity: RevenueEstimate
    initial_state: PROVISIONAL
    terminal_states: [RECERTIFIED]
    transitions:
      - from: PROVISIONAL
        to: RECERTIFIED
        trigger: POST /district/revenue-estimates/{reId}/recertify
        actor: BusinessManager
        preconditions:
          - "Every EnrollmentProjection of the fiscal year is CERTIFIED (ERR_PROJECTIONS_NOT_ALL_CERTIFIED)"
        side_effects:
          - "state_aid_provisional and total_revenue_provisional frozen at current provisional values"
          - "state_aid, operating_rate, debt_service_rate, total_tax_rate, total_revenue recomputed on the CERTIFIED variant (certified weighted pupils, eav_current); eav_basis = CURRENT"
          - "operating_rate re-checked against OPERATING_RATE_CAP 1.8400 (ERR_TAX_RATE_CAP_EXCEEDED)"
          - "increments RevenueEstimate.version by 1"

  - entity: PublicHearing
    initial_state: NOTICE_PUBLISHED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: NOTICE_PUBLISHED
        to: HELD
        trigger: POST /district/public-hearings/{hId}/hold
        actor: BoardClerk
        preconditions:
          - "today == hearing_date (ERR_HEARING_DATE_NOT_TODAY)"
          - "owning BudgetVersion is PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "Owning BudgetVersion PROPOSED -> HEARING_HELD; hearing_held_date set (cross-entity cascade)"
          - "increments PublicHearing.version by 1"
      - from: NOTICE_PUBLISHED
        to: CANCELLED
        trigger: "POST /district/public-hearings/{hId}/cancel, or system (return-to-draft cascade, fiscal-year close cascade)"
        actor: "BoardClerk | system"
        preconditions: []
        side_effects: ["increments PublicHearing.version by 1 (actor-driven)"]

  - entity: Election
    initial_state: SCHEDULED
    terminal_states: [CANVASSED]
    transitions:
      - from: SCHEDULED
        to: CANVASSED
        trigger: POST /district/elections/{eId}/canvass
        actor: BoardClerk
        preconditions:
          - "today > election_date (ERR_CANVASS_BEFORE_ELECTION)"
          - "results cover every LANGUAGE_CERTIFIED BallotMeasure of this election exactly once (ERR_CANVASS_INCOMPLETE)"
        side_effects:
          - "CASCADE B link 1: each covered BallotMeasure -> PASSED if yes_votes > no_votes else FAILED (votes recorded)"
          - "CASCADE B link 2 (caused by a measure becoming PASSED): its BondProposal REFERRED -> PASSED, passed_at = now"
          - "CASCADE B link 3 (caused by a proposal becoming PASSED): each of its BondProjects PLANNED -> AUTHORIZED with authorized_amount = estimated_cost"
          - "canvassed_at = now"
          - "increments Election.version by 1"

  - entity: BondProposal
    initial_state: DRAFT
    terminal_states: []   # FAILED -> DRAFT revision loop; PASSED is absorbing but referenced by later workflows
    transitions:
      - from: DRAFT
        to: BOARD_APPROVED
        trigger: POST /district/bond-proposals/{bpId}/approve-board
        actor: BoardClerk
        preconditions:
          - "At least one PLANNED BondProject exists for this proposal (ERR_EMPTY_PROJECT_LIST)"
          - "Bond capacity: fiscal_year.outstanding_debt_principal + sum of remaining_authorization over this fiscal year's other proposals in BOARD_APPROVED/REFERRED/PASSED + this.total_amount <= 0.069 * fiscal_year.eav_current (ERR_BOND_CAPACITY_EXCEEDED)"
        side_effects: ["increments BondProposal.version by 1"]
      - from: BOARD_APPROVED
        to: REFERRED
        trigger: "system (a BallotMeasure referencing this proposal is certified)"
        actor: system
        preconditions: []
        side_effects: ["increments BondProposal.version by 1"]
      - from: REFERRED
        to: PASSED
        trigger: "system (election canvass: yes_votes > no_votes)"
        actor: system
        preconditions: []
        side_effects:
          - "passed_at = now"
          - "Each BondProject PLANNED -> AUTHORIZED with authorized_amount = estimated_cost (cascade link)"
          - "increments BondProposal.version by 1"
      - from: REFERRED
        to: FAILED
        trigger: "system (election canvass: yes_votes <= no_votes)"
        actor: system
        preconditions: []
        side_effects: ["increments BondProposal.version by 1"]
      - from: FAILED
        to: DRAFT
        trigger: POST /district/bond-proposals/{bpId}/revise
        actor: BoardClerk
        preconditions: []
        side_effects:
          - "increments BondProposal.version by 1"
          - "note: total_amount and project list are now editable again via new projects; capacity re-checked at next approve-board"

  - entity: BondProject
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: AUTHORIZED
        trigger: "system (bond proposal passage cascade)"
        actor: system
        preconditions: []
        side_effects: ["authorized_amount = estimated_cost"]
      - from: AUTHORIZED
        to: IN_PROGRESS
        trigger: POST /district/bond-projects/{prjId}/activate
        actor: Superintendent
        preconditions:
          - "Owning BondProposal has at least one CLOSED BondSale (ERR_NO_CLOSED_BOND_SALE)"
        side_effects: ["increments BondProject.version by 1"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: POST /district/bond-projects/{prjId}/complete
        actor: Superintendent
        preconditions:
          - "No ProjectExpenditure of this project has review_status PENDING_REVIEW or FLAGGED with payment_status != VOIDED (ERR_UNREVIEWED_EXPENDITURES_EXIST)"
        side_effects:
          - "Every ProjectExpenditure of this project with payment_status DISBURSED -> RETAINAGE_RELEASED (retainage paid out)"
          - "increments BondProject.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: POST /district/bond-projects/{prjId}/cancel
        actor: Superintendent
        preconditions: []
        side_effects: ["increments BondProject.version by 1"]
      - from: AUTHORIZED
        to: CANCELLED
        trigger: POST /district/bond-projects/{prjId}/cancel
        actor: Superintendent
        preconditions:
          - "No ProjectExpenditure of this project with payment_status != VOIDED exists (ERR_INVALID_STATE)"
        side_effects:
          - "authorized_amount reset to 0"
          - "increments BondProject.version by 1"

  - entity: BallotMeasure
    initial_state: LANGUAGE_DRAFT
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: LANGUAGE_DRAFT
        to: LANGUAGE_CERTIFIED
        trigger: POST /district/ballot-measures/{bmId}/certify
        actor: BoardClerk
        preconditions:
          - "certifier X-User-ID != drafted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "today <= election_date - 61 days (ERR_CERTIFICATION_DEADLINE_PASSED)"
          - "word_count <= 200 (ERR_BALLOT_LANGUAGE_TOO_LONG)"
        side_effects:
          - "certified_by_user_id = X-User-ID"
          - "Referenced BondProposal BOARD_APPROVED -> REFERRED (cross-entity cascade)"
          - "increments BallotMeasure.version by 1"
      - from: LANGUAGE_CERTIFIED
        to: PASSED
        trigger: "system (election canvass: yes_votes > no_votes)"
        actor: system
        preconditions: []
        side_effects:
          - "yes_votes / no_votes recorded"
          - "Referenced BondProposal REFERRED -> PASSED (cascade link)"
          - "increments BallotMeasure.version by 1"
      - from: LANGUAGE_CERTIFIED
        to: FAILED
        trigger: "system (election canvass: yes_votes <= no_votes)"
        actor: system
        preconditions: []
        side_effects:
          - "yes_votes / no_votes recorded"
          - "Referenced BondProposal REFERRED -> FAILED (cascade link)"
          - "increments BallotMeasure.version by 1"

  - entity: BondSale
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: CLOSED
        trigger: POST /district/bond-sales/{bsId}/close
        actor: DistrictTreasurer
        preconditions:
          - "today >= sale_date (ERR_SALE_NOT_YET_EFFECTIVE)"
        side_effects:
          - "BondProposal.available_proceeds += net_proceeds (ledger sync)"
          - "FiscalYear.outstanding_debt_principal += par_amount (cross-entity ledger sync)"
          - "BondProposal.remaining_authorization recomputed"
          - "increments BondSale.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: POST /district/bond-sales/{bsId}/cancel
        actor: DistrictTreasurer
        preconditions: []
        side_effects:
          - "BondProposal.remaining_authorization recomputed (par released)"
          - "increments BondSale.version by 1"

  - entity: ProjectExpenditure
    initial_state: "review_status=PENDING_REVIEW, payment_status=UNPAID (two parallel dimensions)"
    terminal_states: ["payment_status: RETAINAGE_RELEASED, VOIDED"]
    transitions:
      - from: "review PENDING_REVIEW"
        to: "review REVIEWED"
        trigger: POST /district/project-expenditures/{peId}/review with approved=true
        actor: BusinessManager
        preconditions:
          - "payment_status == UNPAID (ERR_INVALID_STATE)"
        side_effects: ["increments ProjectExpenditure.version by 1"]
      - from: "review PENDING_REVIEW"
        to: "review FLAGGED"
        trigger: POST /district/project-expenditures/{peId}/review with approved=false
        actor: BusinessManager
        preconditions:
          - "payment_status == UNPAID (ERR_INVALID_STATE)"
        side_effects: ["increments ProjectExpenditure.version by 1"]
      - from: "review FLAGGED"
        to: "review REVIEWED"
        trigger: POST /district/project-expenditures/{peId}/review with approved=true
        actor: BusinessManager
        preconditions:
          - "payment_status == UNPAID (ERR_INVALID_STATE)"
        side_effects: ["increments ProjectExpenditure.version by 1"]
      - from: "payment UNPAID"
        to: "payment DISBURSED"
        trigger: POST /district/project-expenditures/{peId}/disburse
        actor: DistrictTreasurer
        preconditions:
          - "review_status == REVIEWED (ERR_EXPENDITURE_NOT_REVIEWED)"
        side_effects:
          - "retainage_amount = round_half_up(amount * 0.10, 2); disbursed_amount = amount - retainage_amount"
          - "increments ProjectExpenditure.version by 1"
      - from: "payment UNPAID"
        to: "payment VOIDED"
        trigger: POST /district/project-expenditures/{peId}/void
        actor: DistrictTreasurer
        preconditions: []
        side_effects:
          - "BondProject.spent_amount -= amount; BondProposal.available_proceeds += amount (compensation)"
          - "increments ProjectExpenditure.version by 1"
      - from: "payment DISBURSED"
        to: "payment VOIDED"
        trigger: POST /district/project-expenditures/{peId}/void
        actor: DistrictTreasurer
        preconditions: []
        side_effects:
          - "BondProject.spent_amount -= amount; BondProposal.available_proceeds += amount (compensation)"
          - "retainage_amount and disbursed_amount reset to 0"
          - "increments ProjectExpenditure.version by 1"
      - from: "payment DISBURSED"
        to: "payment RETAINAGE_RELEASED"
        trigger: "system (project completion releases retainage)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CapitalPlanAmendment
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /district/capital-plan-amendments/{caId}/submit
        actor: BudgetAnalyst
        preconditions: []
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "increments CapitalPlanAmendment.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /district/capital-plan-amendments/{caId}/approve
        actor: Superintendent
        preconditions:
          - "approver X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "Every adjustment references a BondProject of the same proposal (ERR_AMENDMENT_PROJECT_MISMATCH)"
          - "For every adjusted project: authorized_amount + delta >= spent_amount (ERR_AMENDMENT_BELOW_SPENT)"
          - "Sum of authorized_amount over all non-CANCELLED projects of the proposal after applying deltas <= proposal.total_amount (ERR_AMENDMENT_EXCEEDS_AUTHORIZATION)"
        side_effects:
          - "Each adjusted BondProject.authorized_amount += delta_authorized (cross-entity cascade)"
          - "increments CapitalPlanAmendment.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /district/capital-plan-amendments/{caId}/reject
        actor: Superintendent
        preconditions: []
        side_effects: ["increments CapitalPlanAmendment.version by 1"]
      - from: REJECTED
        to: DRAFT
        trigger: POST /district/capital-plan-amendments/{caId}/revise
        actor: BudgetAnalyst
        preconditions: []
        side_effects:
          - "submitted_by_user_id cleared to null"
          - "increments CapitalPlanAmendment.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on the parent entity's version
# =============================================================================
concurrency_rules:
  - rule_id: budget-version-create-stale-fiscal-year
    parent_entity: FiscalYear
    write_endpoint: POST /district/fiscal-years/{id}/budget-versions
    occ_field: expected_fiscal_year_version
    description: |
      Creating a BudgetVersion against a FiscalYear whose version has advanced since the
      client last observed it is rejected. Creating a budget version legitimately supersedes
      the currently-ADOPTED version and bumps the fiscal year's version, so a second create
      carrying a previously-observed expected_fiscal_year_version is operating on a stale
      view of the fiscal year and must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: bond-sale-create-stale-proposal
    parent_entity: BondProposal
    write_endpoint: POST /district/bond-proposals/{id}/bond-sales
    occ_field: expected_bond_proposal_version
    description: |
      Creating a BondSale against a BondProposal whose version has advanced since the client
      last observed it is rejected. Multiple series sales against one passed proposal are
      legitimate, and each sale advances the proposal's version, so a create carrying a
      previously-observed expected_bond_proposal_version is operating on a stale view of
      the proposal's remaining authorization and must be refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (15 rules)
# =============================================================================
calculations:
  - name: weighted_pupil_projection
    trigger: "enrollment projection creation (provisional variant) and certification (certified variant)"
    algorithm: aggregation
    formula: |
      band_weight: ELEMENTARY = 1.00, MIDDLE = 1.05, HIGH = 1.15
      provisional: weighted_pupils_projected = round_half_up(projected_pupils * band_weight, 0)
      certified:   weighted_pupils_certified = round_half_up(actual_pupils * band_weight, 0)
    input_set: "The single EnrollmentProjection row being created or certified"
    constants:
      WEIGHT_ELEMENTARY: 1.00
      WEIGHT_MIDDLE: 1.05
      WEIGHT_HIGH: 1.15
    precision: "integer pupils, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "row created"
        difference: "uses projected_pupils"
      - name: CERTIFIED
        when: "row certified with actual_pupils"
        difference: "uses actual_pupils; provisional value retained alongside"

  - name: staffing_fte_requirement
    trigger: "staffing allocation creation"
    algorithm: threshold
    formula: |
      band_ratio: ELEMENTARY = 20, MIDDLE = 22, HIGH = 25
      pupils = referenced EnrollmentProjection's current pupils
        (actual_pupils if the projection is CERTIFIED, else projected_pupils)
      if pupils < SMALL_BAND_THRESHOLD:            # conditional branch on entity state
        required_fte = 1.0                          # small-band floor
      else:
        required_fte = ceil((pupils / band_ratio) * 2) / 2   # half-FTE granularity
      # nested clamp on the caller-supplied allocated_fte:
      #   valid iff 0 < allocated_fte <= required_fte AND allocated_fte is a multiple of 0.5
    input_set: "The referenced EnrollmentProjection (any status); one StaffingAllocation row being created"
    constants:
      RATIO_ELEMENTARY: 20
      RATIO_MIDDLE: 22
      RATIO_HIGH: 25
      SMALL_BAND_THRESHOLD: 40
      FTE_STEP: 0.5
    precision: "FTE in 0.5 steps; ceil applied at half-step granularity"
    note: "Combinatorial mode (a): conditional branch + nested min/max + ceil interaction"

  - name: staffing_cost_estimate
    trigger: "staffing allocation creation; position create/fill/vacate/eliminate (actual variant)"
    algorithm: aggregation
    formula: |
      BENEFIT_LOAD = 0.34, AVG_SALARY = 62000
      PROJECTED_ALLOCATION variant:
        cost_estimate_projected = allocated_fte * AVG_SALARY * (1 + BENEFIT_LOAD)
      POSITION_ACTUAL variant:
        cost_estimate_actual = sum over Positions p of this allocation with p.status != ELIMINATED:
          salary_basis = p.incumbent_salary if p.status == FILLED else p.base_salary
          term = salary_basis * p.fte * (1 + BENEFIT_LOAD)
    input_set: "PROJECTED: the allocation row only. POSITION_ACTUAL: all Positions of the allocation with status in {PROPOSED, OPEN, FILLED} (ELIMINATED excluded)"
    constants:
      AVG_SALARY: 62000
      BENEFIT_LOAD: 0.34
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROJECTED_ALLOCATION
        when: "always maintained"
        difference: "formula-driven: allocated_fte * district average salary; ignores actual positions"
      - name: POSITION_ACTUAL
        when: "always maintained"
        difference: "position-driven: per-slot salary basis (incumbent when FILLED, base otherwise); differs from PROJECTED_ALLOCATION for identical allocation whenever slot salaries diverge from the district average"

  - name: state_aid_estimate
    trigger: "revenue estimate creation (provisional) and recertification (certified)"
    algorithm: forward_looking
    formula: |
      state_aid = max(0, FOUNDATION_PER_PUPIL * total_weighted_pupils - LOCAL_CAPACITY_RATE * eav_basis)
      where total_weighted_pupils and eav_basis depend on the variant:
        PROVISIONAL: sum of weighted_pupils_projected over ALL EnrollmentProjections of the fiscal year;
                     eav_basis = fiscal_year.eav_prior
        CERTIFIED:   sum of weighted_pupils_certified over ALL EnrollmentProjections of the fiscal year;
                     eav_basis = fiscal_year.eav_current
    input_set: "All EnrollmentProjections of the fiscal year (PROVISIONAL variant counts every row's projected weight; CERTIFIED variant requires every row CERTIFIED and counts certified weights)"
    constants:
      FOUNDATION_PER_PUPIL: 7600
      LOCAL_CAPACITY_RATE: 0.023
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "revenue estimate created"
        difference: "projected weighted pupils and prior-year EAV"
      - name: CERTIFIED
        when: "revenue estimate recertified after all projections certified"
        difference: "certified weighted pupils and current-year EAV; produces different state aid, rates, and total revenue for the same budget whenever actuals or EAV moved"

  - name: ptell_capped_levy
    trigger: "revenue estimate creation"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is PINNED (each step consumes only earlier steps):
        1. raw_request   = operating_levy_request
        2. ptell_cap     = prior_year_extension * (1 + min(cpi_rate, PTELL_CPI_MAX))
        3. capped_operating_levy = min(raw_request, ptell_cap)
        4. rate check: operating_rate = round_half_up(capped_operating_levy / eav_basis * 100, 4);
           reject with ERR_TAX_RATE_CAP_EXCEEDED iff operating_rate > OPERATING_RATE_CAP
        5. total_levy = capped_operating_levy + debt_service_levy   # debt service is PTELL-exempt
    input_set: "The RevenueEstimate being created plus its fiscal year's prior_year_extension and eav_prior"
    constants:
      PTELL_CPI_MAX: 0.05
      OPERATING_RATE_CAP: 1.8400
    precision: "levy 2dp round_half_up; rate 4dp round_half_up computed from the capped levy (never the request)"
    note: "Combinatorial mode (c): cap depends on prior extension, rate check depends on capped value, total depends on both — evaluation order pinned so the value is well-defined"

  - name: tax_extension_rates
    trigger: "revenue estimate creation and recertification"
    algorithm: tiered_pricing
    formula: |
      Per-fund rates are rounded FIRST, then summed (order pinned; the alternative order
      'sum levies then round one rate' yields different hundredths and is FORBIDDEN):
        operating_rate     = round_half_up(capped_operating_levy / eav_basis * 100, 4)
        debt_service_rate  = round_half_up(debt_service_levy   / eav_basis * 100, 4)
        total_tax_rate     = operating_rate + debt_service_rate   # no re-rounding of the sum
      eav_basis = fiscal_year.eav_prior (PROVISIONAL) | fiscal_year.eav_current (RECERTIFIED)
    input_set: "The RevenueEstimate's levy fields and its fiscal year's EAV pair"
    constants:
      RATE_DECIMALS: 4
    precision: "per-fund round_half_up to 4 decimals, then exact decimal sum"
    note: "Combinatorial mode (b): nested rounding order pinned"

  - name: total_revenue_and_balance
    trigger: "revenue estimate creation/recertification; budget version adoption"
    algorithm: aggregation
    formula: |
      total_revenue = state_aid + total_levy + other_revenue
      Budget balance check at adoption:
        total_appropriations = sum of appropriation_amount over all BudgetLines of the version
        adoption requires total_appropriations <= total_revenue (of this version's RevenueEstimate,
        using its current authoritative variant)
    input_set: "All BudgetLines of the BudgetVersion regardless of fund_code; the version's single RevenueEstimate"
    precision: "2 decimal places, round_half_up"

  - name: position_control_ceiling
    trigger: "staffing allocation creation"
    algorithm: threshold
    formula: |
      ceiling_check:
        sum_allocated = sum of allocated_fte over all StaffingAllocations of THIS budget version
                        (including the new one)
        reject with ERR_FTE_CEILING_EXCEEDED iff sum_allocated > fiscal_year.fte_ceiling
      Boundary: sum_allocated == fte_ceiling exactly is ALLOWED (check is strictly-greater)
    input_set: "All StaffingAllocations of the same BudgetVersion (status DRAFT or AUTHORIZED)"
    precision: "FTE in 0.5 steps; exact decimal compare"

  - name: position_headroom
    trigger: "position creation"
    algorithm: threshold
    formula: |
      headroom = staffing_allocation.allocated_fte
                 - sum of fte over the allocation's Positions with status != ELIMINATED
      reject with ERR_POSITION_FTE_EXCEEDED iff new position's fte > headroom
      Boundary: fte == headroom exactly is ALLOWED
    input_set: "All Positions of the StaffingAllocation with status in {PROPOSED, OPEN, FILLED}"
    precision: "FTE in 0.5 steps; exact decimal compare"

  - name: bond_debt_capacity
    trigger: "bond proposal board approval"
    algorithm: threshold
    formula: |
      legal_limit = DEBT_LIMIT_PCT * fiscal_year.eav_current
      consumed    = fiscal_year.outstanding_debt_principal
                    + sum over this fiscal year's OTHER BondProposals p with
                      p.status in {BOARD_APPROVED, REFERRED, PASSED} of p.remaining_authorization
      capacity_ok iff consumed + this.total_amount <= legal_limit
      Boundary: consumed + total_amount == legal_limit exactly is ALLOWED
    input_set: "All BondProposals of the same fiscal year with status BOARD_APPROVED, REFERRED, or PASSED (DRAFT and FAILED excluded), plus the fiscal year's outstanding_debt_principal"
    constants:
      DEBT_LIMIT_PCT: 0.069
    precision: "2 decimal places, round_half_up"

  - name: bond_sale_proceeds
    trigger: "bond sale creation, close, cancel; expenditure post and void"
    algorithm: aggregation
    formula: |
      net_proceeds (computed at creation) = par_amount + premium - issuance_costs
        reject with ERR_NONPOSITIVE_NET_PROCEEDS iff net_proceeds <= 0
      remaining_authorization = total_amount - sum of par_amount over the proposal's BondSales
        with status in {PLANNED, CLOSED}   (CANCELLED excluded)
        sale creation rejects with ERR_SALE_EXCEEDS_REMAINING_AUTHORIZATION iff par_amount > remaining
        Boundary: par_amount == remaining_authorization exactly is ALLOWED
      available_proceeds = sum of net_proceeds over CLOSED sales
        - sum of amount over ProjectExpenditures (payment_status != VOIDED) across the proposal's projects
      expenditure creation rejects with ERR_INSUFFICIENT_PROCEEDS iff amount > available_proceeds
        Boundary: amount == available_proceeds exactly is ALLOWED
    input_set: "All BondSales of the proposal; all ProjectExpenditures of all BondProjects of the proposal with payment_status in {UNPAID, DISBURSED, RETAINAGE_RELEASED}"
    precision: "2 decimal places, round_half_up"

  - name: project_available_budget
    trigger: "expenditure creation; amendment approval"
    algorithm: aggregation
    formula: |
      spent_amount      = sum of amount over the project's ProjectExpenditures with payment_status != VOIDED
      available_budget  = authorized_amount - spent_amount
      expenditure creation rejects with ERR_PROJECT_BUDGET_EXCEEDED iff amount > available_budget
        Boundary: amount == available_budget exactly is ALLOWED
      amendment approval rejects with ERR_AMENDMENT_BELOW_SPENT iff
        (authorized_amount + delta_authorized) < spent_amount for any adjusted project
        Boundary: authorized_amount + delta == spent_amount exactly is ALLOWED
    input_set: "All ProjectExpenditures of the BondProject with payment_status in {UNPAID, DISBURSED, RETAINAGE_RELEASED}"
    precision: "2 decimal places, round_half_up"

  - name: retainage_withholding
    trigger: "expenditure disbursement; project completion"
    algorithm: threshold
    formula: |
      on disburse: retainage_amount = round_half_up(amount * RETAINAGE_PCT, 2)
                   disbursed_amount = amount - retainage_amount
      on project completion: every DISBURSED expenditure -> RETAINAGE_RELEASED
        (retainage paid out; retainage_amount/disbursed_amount fields retained for audit)
    input_set: "The single expenditure being disbursed; at completion, all of the project's expenditures with payment_status == DISBURSED"
    constants:
      RETAINAGE_PCT: 0.10
    precision: "2 decimal places, round_half_up"

  - name: canvass_result_determination
    trigger: "election canvass"
    algorithm: threshold
    formula: |
      For each LANGUAGE_CERTIFIED BallotMeasure on the election:
        PASSED iff yes_votes > no_votes   (strict)
        FAILED iff yes_votes <= no_votes  (a tie FAILS the measure)
      results must cover every LANGUAGE_CERTIFIED measure of the election exactly once
        (ERR_CANVASS_INCOMPLETE otherwise); BallotMeasures still LANGUAGE_DRAFT are ignored
        and remain LANGUAGE_DRAFT
    input_set: "All BallotMeasures of the Election with status LANGUAGE_CERTIFIED"
    precision: "integer vote counts; strict-greater comparison"

  - name: election_calendar_rules
    trigger: "election creation; ballot measure certification; publication creation"
    algorithm: interval_merge
    formula: |
      statutory_date(d): d is the first Tuesday of March, June, or November of its year
        (first Tuesday = first day of month advanced to weekday Tuesday)
      certification_deadline = election.election_date - 61 days
        certification allowed iff today <= certification_deadline (deadline day itself ALLOWED)
      campaign_restriction_window = [election.election_date - 30 days, election.election_date] inclusive
        a FACTUAL DistrictPublication on a LANGUAGE_CERTIFIED measure of that election is
        rejected with ERR_CAMPAIGN_RESTRICTION_WINDOW iff today is inside the window;
        PROMOTIONAL publications are always rejected with ERR_PROHIBITED_CAMPAIGN_ACTIVITY
        regardless of the window
    input_set: "The Election row; the BallotMeasure and its election for certification/publication checks"
    constants:
      CERTIFICATION_LEAD_DAYS: 61
      CAMPAIGN_WINDOW_DAYS: 30
      BALLOT_WORD_LIMIT: 200
    precision: "whole-day granularity, UTC calendar dates"

  - name: site_window_conflict
    trigger: "bond project creation"
    algorithm: interval_merge
    formula: |
      Windows are HALF-OPEN: [construction_start, construction_end).
      For every other BondProject q with q.site_code == new.site_code and
      q.status in {PLANNED, AUTHORIZED, IN_PROGRESS} (CANCELLED and COMPLETED excluded):
        overlap  = (new.start < q.end) AND (q.start < new.end)
        gap      = (new.start - q.end) in whole days   if q.end <= new.start
                 = (q.start - new.end) in whole days   if new.end <= q.start
        reject with ERR_SITE_WINDOW_CONFLICT iff overlap OR gap < SITE_BUFFER_DAYS
      Boundary: gap == SITE_BUFFER_DAYS exactly is ALLOWED; touching windows
      (q.end == new.start) have gap 0 and are REJECTED (buffer dominates adjacency).
    input_set: "All BondProjects sharing the new project's site_code with status in {PLANNED, AUTHORIZED, IN_PROGRESS}"
    constants:
      SITE_BUFFER_DAYS: 14
    precision: "whole-day granularity, UTC calendar dates"

  - name: hearing_adoption_calendar
    trigger: "hearing creation, hearing hold, budget adoption"
    algorithm: interval_merge
    formula: |
      notice rule:      hearing_date >= notice_publication_date + NOTICE_LEAD_DAYS  (creation-time check)
      hold rule:        hold allowed iff today == hearing_date
      adoption timing:  today >= hearing_held_date + ADOPTION_DELAY_DAYS
                        AND today < fiscal_year.start_date
      venue conflict:   no two hearings with status NOTICE_PUBLISHED or HELD may share
                        (venue, hearing_date) — day-equality semantics, no buffer
    input_set: "Hearings of all budget versions with status NOTICE_PUBLISHED or HELD (venue-conflict set is global, not per budget version)"
    constants:
      NOTICE_LEAD_DAYS: 10
      ADOPTION_DELAY_DAYS: 7
    precision: "whole-day granularity, UTC calendar dates; >= comparisons are inclusive"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles (RBAC matrix)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (fiscal year first, then nested resource)"
    error_id: "ERR_FISCAL_YEAR_NOT_FOUND | ERR_ENROLLMENT_PROJECTION_NOT_FOUND | ERR_BUDGET_VERSION_NOT_FOUND | ERR_STAFFING_ALLOCATION_NOT_FOUND | ERR_POSITION_NOT_FOUND | ERR_REVENUE_ESTIMATE_NOT_FOUND | ERR_PUBLIC_HEARING_NOT_FOUND | ERR_ELECTION_NOT_FOUND | ERR_BOND_PROPOSAL_NOT_FOUND | ERR_BOND_PROJECT_NOT_FOUND | ERR_BALLOT_MEASURE_NOT_FOUND | ERR_BOND_SALE_NOT_FOUND | ERR_PROJECT_EXPENDITURE_NOT_FOUND | ERR_CAPITAL_PLAN_AMENDMENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "Request-body shape: required fields present, types correct, enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: existence
    check: "Semantic field values: amounts > 0 where required, fte in {0.5, 1.0}, allocated_fte a multiple of 0.5, construction_end after construction_start, fiscal-year end_date after start_date, pupils >= 0"
    error_id: ERR_INVALID_FIELD_VALUE
    http_status: 422
    applies_to: "all endpoints with a request body"

  - priority: 6
    category: existence
    check: "Body-referenced resource ids exist (enrollment_projection_id, bond_proposal_id, from_line_id, to_line_id, results[].ballot_measure_id, adjustments[].bond_project_id)"
    error_id: "ERR_ENROLLMENT_PROJECTION_NOT_FOUND | ERR_BOND_PROPOSAL_NOT_FOUND | ERR_BUDGET_LINE_NOT_FOUND | ERR_BALLOT_MEASURE_NOT_FOUND | ERR_BOND_PROJECT_NOT_FOUND"
    http_status: 404
    applies_to: "endpoints taking body FK references"

  - priority: 7
    category: state
    check: "OCC: expected_fiscal_year_version == FiscalYear.version (budget-version create); expected_bond_proposal_version == BondProposal.version (bond-sale create)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /district/fiscal-years/{id}/budget-versions; POST /district/bond-proposals/{id}/bond-sales"

  - priority: 8
    category: state
    check: "Target entity's state machine permits the requested transition; child creation requires parent in a mutable state (fiscal year OPEN: ERR_FISCAL_YEAR_NOT_OPEN; budget version DRAFT for lines/transfers/allocations: ERR_BUDGET_VERSION_NOT_DRAFT; budget version PROPOSED for hearing creation; adoption requires HEARING_HELD: ERR_BUDGET_VERSION_NOT_HEARING_HELD; sale create requires proposal PASSED; expenditure create requires project IN_PROGRESS; disburse requires REVIEWED: ERR_EXPENDITURE_NOT_REVIEWED)"
    error_id: "ERR_INVALID_STATE (generic from-state violation) | ERR_FISCAL_YEAR_NOT_OPEN | ERR_BUDGET_VERSION_NOT_DRAFT | ERR_BUDGET_VERSION_NOT_HEARING_HELD | ERR_EXPENDITURE_NOT_REVIEWED"
    http_status: 409
    applies_to: "all mutation endpoints"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: ballot certifier != drafter; amendment approver != submitter. Prohibited activity: PROMOTIONAL district publication always rejected"
    error_id: "ERR_SEGREGATION_OF_DUTIES | ERR_PROHIBITED_CAMPAIGN_ACTIVITY"
    http_status: 403
    applies_to: "POST /district/ballot-measures/{bmId}/certify; POST /district/capital-plan-amendments/{caId}/approve; POST /district/ballot-measures/{bmId}/publications"

  - priority: 10
    category: business_temporal
    check: "Calendar rules: statutory election date; notice window >= 10d; hold on exact hearing date; adoption >= hearing+7d; adoption before fiscal year start; certification <= election-61d; campaign restriction window; canvass after election day; sale_date <= passed_at + 36 months; sale close on/after sale_date"
    error_id: "ERR_STATUTORY_ELECTION_DATE | ERR_NOTICE_WINDOW_TOO_SHORT | ERR_HEARING_DATE_NOT_TODAY | ERR_ADOPTION_TOO_SOON | ERR_ADOPTION_DEADLINE_PASSED | ERR_CERTIFICATION_DEADLINE_PASSED | ERR_CAMPAIGN_RESTRICTION_WINDOW | ERR_CANVASS_BEFORE_ELECTION | ERR_AUTHORIZATION_LAPSED | ERR_SALE_NOT_YET_EFFECTIVE"
    http_status: 409
    applies_to: "calendar-constrained endpoints"

  - priority: 11
    category: business_constraint
    check: "Uniqueness and structural constraints: one projection per band per fiscal year; hearing venue+date uniqueness; one measure per proposal per election; ballot word count <= 200; site construction-window overlap/buffer; unique priority_rank per proposal; one revenue estimate per budget version; sum of project estimated_cost <= proposal total_amount; canvass completeness; series_label unique per proposal. (Per-error http status is authoritative in the error catalog: ERR_BALLOT_LANGUAGE_TOO_LONG, ERR_PROJECT_LIST_EXCEEDS_AMOUNT and ERR_CANVASS_INCOMPLETE return 422.)"
    error_id: "ERR_DUPLICATE_GRADE_BAND | ERR_HEARING_VENUE_DATE_CONFLICT | ERR_DUPLICATE_BALLOT_MEASURE | ERR_BALLOT_LANGUAGE_TOO_LONG | ERR_SITE_WINDOW_CONFLICT | ERR_DUPLICATE_PRIORITY_RANK | ERR_REVENUE_ESTIMATE_EXISTS | ERR_PROJECT_LIST_EXCEEDS_AMOUNT | ERR_CANVASS_INCOMPLETE | ERR_DUPLICATE_SERIES_LABEL"
    http_status: 409
    applies_to: "creation and certification endpoints"

  - priority: 12
    category: business_referential
    check: "Cross-entity consistency: projection's fiscal year == budget version's fiscal year; transfer lines in same budget version; recertify requires all projections CERTIFIED; fiscal year close requires an ADOPTED version; amendment projects belong to the amendment's proposal; project activation requires a CLOSED sale; project completion requires all expenditures reviewed; adoption requires a revenue estimate. (Per-error http status is authoritative in the error catalog: ERR_CROSS_FISCAL_YEAR_REFERENCE, ERR_TRANSFER_LINE_MISMATCH and ERR_AMENDMENT_PROJECT_MISMATCH return 422.)"
    error_id: "ERR_CROSS_FISCAL_YEAR_REFERENCE | ERR_TRANSFER_LINE_MISMATCH | ERR_PROJECTIONS_NOT_ALL_CERTIFIED | ERR_NO_ADOPTED_BUDGET_VERSION | ERR_AMENDMENT_PROJECT_MISMATCH | ERR_NO_CLOSED_BOND_SALE | ERR_UNREVIEWED_EXPENDITURES_EXIST | ERR_NO_REVENUE_ESTIMATE | ERR_EMPTY_PROJECT_LIST"
    http_status: 409
    applies_to: "cross-entity endpoints"

  - priority: 13
    category: business_fiscal
    check: "Fiscal rules (last): allocation <= formula required_fte; FTE ceiling; position headroom; tax rate cap; budget balance at adoption; bond capacity; sale remaining authorization; positive net proceeds; project budget; available proceeds; transfer source sufficiency; amendment floors and ceiling"
    error_id: "ERR_ALLOCATION_EXCEEDS_FORMULA | ERR_FTE_CEILING_EXCEEDED | ERR_POSITION_FTE_EXCEEDED | ERR_TAX_RATE_CAP_EXCEEDED | ERR_BUDGET_NOT_BALANCED | ERR_BOND_CAPACITY_EXCEEDED | ERR_SALE_EXCEEDS_REMAINING_AUTHORIZATION | ERR_NONPOSITIVE_NET_PROCEEDS | ERR_PROJECT_BUDGET_EXCEEDED | ERR_INSUFFICIENT_PROCEEDS | ERR_TRANSFER_EXCEEDS_LINE | ERR_AMENDMENT_BELOW_SPENT | ERR_AMENDMENT_EXCEEDS_AUTHORIZATION"
    http_status: 422
    applies_to: "fiscally constrained endpoints"

# =============================================================================
# Table 5: API Endpoint Table (72 endpoints)
# =============================================================================
endpoints:
  # --- logical clock (test-driving endpoint; default 2026-08-01T00:00:00Z before any set) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["All date-derived rules (windows, deadlines) evaluate against the new clock value"]

  # --- FiscalYear ---
  - method: POST
    path: "/district/fiscal-years"
    description: "Create a fiscal year (starts DRAFT)"
    roles: [BusinessManager]
    code: 201
    input: [label, start_date, end_date, eav_current, eav_prior, prior_year_extension, outstanding_debt_principal, fte_ceiling]
    output: FiscalYear
    side_effects: ["status = DRAFT; authorized_fte_total = 0; open_position_count = 0"]
  - method: GET
    path: "/district/fiscal-years"
    description: "List fiscal years (created_at ASC); supports envelope pagination params"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: ["label?", "status?", "limit?", "offset?"]
    output: "FiscalYear[]"
    side_effects: []
  - method: GET
    path: "/district/fiscal-years/{fyId}"
    description: "Get one fiscal year"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: FiscalYear
    side_effects: []
  - method: POST
    path: "/district/fiscal-years/{fyId}/open"
    description: "Open a fiscal year (DRAFT -> OPEN) for budget development"
    roles: [BusinessManager]
    code: 200
    input: []
    output: FiscalYear
    side_effects: ["status -> OPEN; increments FiscalYear.version by 1"]
  - method: POST
    path: "/district/fiscal-years/{fyId}/close"
    description: "Close a fiscal year (OPEN -> CLOSED); requires an ADOPTED budget version"
    roles: [BusinessManager]
    code: 200
    input: []
    output: FiscalYear
    side_effects: ["status -> CLOSED; cancels NOTICE_PUBLISHED hearings; increments FiscalYear.version by 1"]

  # --- EnrollmentProjection ---
  - method: POST
    path: "/district/fiscal-years/{id}/enrollment-projections"
    description: "Create an enrollment projection for one grade band (PROVISIONAL)"
    roles: [BudgetAnalyst]
    code: 201
    input: [grade_band, projected_pupils]
    output: EnrollmentProjection
    side_effects: ["weighted_pupils_projected computed via weighted_pupil_projection"]
  - method: GET
    path: "/district/fiscal-years/{id}/enrollment-projections"
    description: "List enrollment projections of a fiscal year"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "EnrollmentProjection[]"
    side_effects: []
  - method: GET
    path: "/district/enrollment-projections/{epId}"
    description: "Get one enrollment projection"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: EnrollmentProjection
    side_effects: []
  - method: POST
    path: "/district/enrollment-projections/{epId}/certify"
    description: "Certify a projection with actual pupils (PROVISIONAL -> CERTIFIED)"
    roles: [BusinessManager]
    code: 200
    input: [actual_pupils]
    output: EnrollmentProjection
    side_effects: ["weighted_pupils_certified computed; status -> CERTIFIED; increments EnrollmentProjection.version by 1"]

  # --- BudgetVersion ---
  - method: POST
    path: "/district/fiscal-years/{id}/budget-versions"
    description: "Create a budget version (OCC-guarded; supersedes the currently ADOPTED version with its full supersede cascade)"
    roles: [BudgetAnalyst]
    code: 201
    input: [expected_fiscal_year_version]
    output: BudgetVersion
    side_effects:
      - "OCC check on FiscalYear.version (ERR_STALE_VERSION)"
      - "Any ADOPTED BudgetVersion of this fiscal year -> SUPERSEDED (supersede cascade: allocations SUPERSEDED, positions ELIMINATED, lines SUPERSEDED, FiscalYear aggregates recomputed)"
      - "increments FiscalYear.version by 1"
  - method: GET
    path: "/district/fiscal-years/{id}/budget-versions"
    description: "List budget versions of a fiscal year (created_at ASC)"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "BudgetVersion[]"
    side_effects: []
  - method: GET
    path: "/district/budget-versions/{bvId}"
    description: "Get one budget version"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: BudgetVersion
    side_effects: []
  - method: POST
    path: "/district/budget-versions/{bvId}/propose"
    description: "Propose a draft budget (DRAFT -> PROPOSED)"
    roles: [BoardClerk]
    code: 200
    input: []
    output: BudgetVersion
    side_effects: ["status -> PROPOSED; increments BudgetVersion.version by 1"]
  - method: POST
    path: "/district/budget-versions/{bvId}/return-to-draft"
    description: "Send a proposed/hearing-held budget back to draft (PROPOSED|HEARING_HELD -> DRAFT); cancels unpublished-pending hearings"
    roles: [BoardClerk]
    code: 200
    input: []
    output: BudgetVersion
    side_effects: ["status -> DRAFT; NOTICE_PUBLISHED hearings -> CANCELLED; hearing_held_date cleared; increments BudgetVersion.version by 1"]
  - method: POST
    path: "/district/budget-versions/{bvId}/adopt"
    description: "Adopt the budget (HEARING_HELD -> ADOPTED); fires the adoption cascade"
    roles: [BoardClerk]
    code: 200
    input: []
    output: BudgetVersion
    side_effects:
      - "status -> ADOPTED; adopted_at set"
      - "BudgetLines DRAFT -> ADOPTED; StaffingAllocations DRAFT -> AUTHORIZED; their PROPOSED Positions -> OPEN"
      - "FiscalYear.authorized_fte_total and open_position_count recomputed"
      - "any other ADOPTED version of this fiscal year -> SUPERSEDED (with supersede cascade)"
      - "increments BudgetVersion.version by 1"

  # --- BudgetLine ---
  - method: POST
    path: "/district/budget-versions/{id}/budget-lines"
    description: "Add an appropriation line to a DRAFT budget version"
    roles: [BudgetAnalyst]
    code: 201
    input: [fund_code, function_code, object_code, cost_center, appropriation_amount]
    output: BudgetLine
    side_effects: ["BudgetVersion.total_appropriations recomputed"]
  - method: GET
    path: "/district/budget-versions/{id}/budget-lines"
    description: "List budget lines of a budget version (created_at ASC)"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "BudgetLine[]"
    side_effects: []
  - method: POST
    path: "/district/budget-versions/{id}/transfers"
    description: "Transfer appropriation between two lines of the same DRAFT budget version (conserves the version's total)"
    roles: [BudgetAnalyst]
    code: 201
    input: [from_line_id, to_line_id, amount]
    output: { from_line_id: string, to_line_id: string, amount: number, from_line_appropriation: number, to_line_appropriation: number }
    side_effects:
      - "from_line.appropriation_amount -= amount; to_line.appropriation_amount += amount"
      - "increments both BudgetLines' version by 1; BudgetVersion.total_appropriations unchanged (invariant)"

  # --- StaffingAllocation ---
  - method: POST
    path: "/district/budget-versions/{id}/staffing-allocations"
    description: "Create a staffing allocation for one grade band from an enrollment projection (DRAFT budgets only)"
    roles: [BudgetAnalyst]
    code: 201
    input: [grade_band, enrollment_projection_id, allocated_fte]
    output: StaffingAllocation
    side_effects:
      - "required_fte computed via staffing_fte_requirement"
      - "cost_estimate_projected and cost_estimate_actual initialized via staffing_cost_estimate (actual starts 0 with no positions)"
      - "position_control_ceiling checked"
  - method: GET
    path: "/district/budget-versions/{id}/staffing-allocations"
    description: "List staffing allocations of a budget version"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "StaffingAllocation[]"
    side_effects: []
  - method: GET
    path: "/district/enrollment-projections/{id}/staffing-allocations"
    description: "List staffing allocations computed from an enrollment projection"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "StaffingAllocation[]"
    side_effects: []
  - method: GET
    path: "/district/staffing-allocations/{saId}"
    description: "Get one staffing allocation"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: StaffingAllocation
    side_effects: []

  # --- Position ---
  - method: POST
    path: "/district/staffing-allocations/{id}/positions"
    description: "Create a position slot under an allocation (PROPOSED while allocation DRAFT; OPEN when allocation AUTHORIZED)"
    roles: [BudgetAnalyst]
    code: 201
    input: [title, fte, base_salary]
    output: Position
    side_effects:
      - "position_headroom checked (ERR_POSITION_FTE_EXCEEDED)"
      - "StaffingAllocation.positions_fte_total and cost_estimate_actual recomputed"
      - "if allocation AUTHORIZED: status = OPEN and FiscalYear.open_position_count recomputed"
  - method: GET
    path: "/district/staffing-allocations/{id}/positions"
    description: "List positions of a staffing allocation (created_at ASC)"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "Position[]"
    side_effects: []
  - method: POST
    path: "/district/positions/{pId}/fill"
    description: "Fill an OPEN position with an incumbent salary (OPEN -> FILLED)"
    roles: [Superintendent]
    code: 200
    input: [incumbent_salary]
    output: Position
    side_effects: ["status -> FILLED; FiscalYear.open_position_count recomputed; StaffingAllocation.cost_estimate_actual recomputed; increments Position.version by 1"]
  - method: POST
    path: "/district/positions/{pId}/vacate"
    description: "Vacate a FILLED position (FILLED -> OPEN); incumbent salary cleared"
    roles: [Superintendent]
    code: 200
    input: []
    output: Position
    side_effects: ["status -> OPEN; incumbent_salary = null; FiscalYear.open_position_count recomputed; StaffingAllocation.cost_estimate_actual recomputed; increments Position.version by 1"]
  - method: POST
    path: "/district/positions/{pId}/eliminate"
    description: "Eliminate a PROPOSED or OPEN position (position control)"
    roles: [Superintendent]
    code: 200
    input: []
    output: Position
    side_effects: ["status -> ELIMINATED; StaffingAllocation.positions_fte_total and cost_estimate_actual recomputed; FiscalYear.open_position_count recomputed if it was OPEN; increments Position.version by 1"]

  # --- RevenueEstimate ---
  - method: POST
    path: "/district/budget-versions/{id}/revenue-estimates"
    description: "Create the revenue estimate for a budget version (PROVISIONAL variant; at most one per version)"
    roles: [BusinessManager]
    code: 201
    input: [operating_levy_request, debt_service_levy, other_revenue, cpi_rate]
    output: RevenueEstimate
    side_effects:
      - "ptell_capped_levy evaluated (order pinned); ERR_TAX_RATE_CAP_EXCEEDED possible"
      - "state_aid_estimate PROVISIONAL variant; tax_extension_rates computed (per-fund rounding then sum)"
      - "total_revenue computed"
  - method: GET
    path: "/district/budget-versions/{id}/revenue-estimates"
    description: "List the revenue estimate of a budget version (array of 0 or 1)"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "RevenueEstimate[]"
    side_effects: []
  - method: POST
    path: "/district/revenue-estimates/{reId}/recertify"
    description: "Switch the estimate to the CERTIFIED variant (requires all projections CERTIFIED)"
    roles: [BusinessManager]
    code: 200
    input: []
    output: RevenueEstimate
    side_effects: ["status -> RECERTIFIED; state_aid/rates/total_revenue recomputed on certified pupils and current EAV; provisional values frozen in *_provisional fields; increments RevenueEstimate.version by 1"]

  # --- PublicHearing ---
  - method: POST
    path: "/district/budget-versions/{id}/hearings"
    description: "Publish notice and schedule a public hearing for a PROPOSED budget version"
    roles: [BoardClerk]
    code: 201
    input: [venue, hearing_date]
    output: PublicHearing
    side_effects: ["notice_publication_date = today's clock date; status = NOTICE_PUBLISHED"]
  - method: GET
    path: "/district/budget-versions/{id}/hearings"
    description: "List hearings of a budget version"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "PublicHearing[]"
    side_effects: []
  - method: POST
    path: "/district/public-hearings/{hId}/hold"
    description: "Hold the hearing on its scheduled date (NOTICE_PUBLISHED -> HELD); moves the budget version to HEARING_HELD"
    roles: [BoardClerk]
    code: 200
    input: []
    output: PublicHearing
    side_effects: ["status -> HELD; owning BudgetVersion PROPOSED -> HEARING_HELD with hearing_held_date; increments PublicHearing.version by 1"]
  - method: POST
    path: "/district/public-hearings/{hId}/cancel"
    description: "Cancel a published hearing (NOTICE_PUBLISHED -> CANCELLED)"
    roles: [BoardClerk]
    code: 200
    input: []
    output: PublicHearing
    side_effects: ["status -> CANCELLED; increments PublicHearing.version by 1"]

  # --- Election ---
  - method: POST
    path: "/district/elections"
    description: "Schedule an election on a statutory date (first Tuesday of March/June/November)"
    roles: [BoardClerk]
    code: 201
    input: [election_date, election_type]
    output: Election
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/district/elections"
    description: "List elections (election calendar)"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "Election[]"
    side_effects: []
  - method: GET
    path: "/district/elections/{eId}"
    description: "Get one election"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: Election
    side_effects: []
  - method: POST
    path: "/district/elections/{eId}/canvass"
    description: "Canvass results for all certified measures of the election; fires cascade B"
    roles: [BoardClerk]
    code: 200
    input: [results]
    output: { canvassed_count: integer }
    side_effects:
      - "Each covered BallotMeasure -> PASSED/FAILED with votes recorded"
      - "PASSED measures move their BondProposal REFERRED -> PASSED (passed_at set)"
      - "PASSED proposals move their BondProjects PLANNED -> AUTHORIZED (authorized_amount = estimated_cost)"
      - "Election -> CANVASSED; canvassed_at set; increments Election.version by 1"

  # --- BondProposal ---
  - method: POST
    path: "/district/fiscal-years/{id}/bond-proposals"
    description: "Create a bond proposal (DRAFT)"
    roles: [BoardClerk]
    code: 201
    input: [question_title, purpose, total_amount]
    output: BondProposal
    side_effects: ["remaining_authorization = total_amount; available_proceeds = 0"]
  - method: GET
    path: "/district/fiscal-years/{id}/bond-proposals"
    description: "List bond proposals of a fiscal year"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "BondProposal[]"
    side_effects: []
  - method: GET
    path: "/district/bond-proposals/{bpId}"
    description: "Get one bond proposal"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: BondProposal
    side_effects: []
  - method: POST
    path: "/district/bond-proposals/{bpId}/approve-board"
    description: "Board approves the proposal for referral (DRAFT -> BOARD_APPROVED); bond capacity check"
    roles: [BoardClerk]
    code: 200
    input: []
    output: BondProposal
    side_effects: ["status -> BOARD_APPROVED; increments BondProposal.version by 1"]
  - method: POST
    path: "/district/bond-proposals/{bpId}/revise"
    description: "Return a FAILED proposal to DRAFT for revision (revision loop)"
    roles: [BoardClerk]
    code: 200
    input: []
    output: BondProposal
    side_effects: ["status -> DRAFT; increments BondProposal.version by 1"]

  # --- BondProject ---
  - method: POST
    path: "/district/bond-proposals/{id}/projects"
    description: "Add a project to a DRAFT proposal's bond project list (site-window and aggregate checks)"
    roles: [BoardClerk]
    code: 201
    input: [name, site_code, estimated_cost, construction_start, construction_end, priority_rank]
    output: BondProject
    side_effects: ["authorized_amount = 0; spent_amount = 0; status = PLANNED"]
  - method: GET
    path: "/district/bond-proposals/{id}/projects"
    description: "List projects of a bond proposal (created_at ASC)"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "BondProject[]"
    side_effects: []
  - method: GET
    path: "/district/bond-projects/{prjId}"
    description: "Get one bond project"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: BondProject
    side_effects: []
  - method: POST
    path: "/district/bond-projects/{prjId}/activate"
    description: "Start construction accounting (AUTHORIZED -> IN_PROGRESS); requires a CLOSED sale on the proposal"
    roles: [Superintendent]
    code: 200
    input: []
    output: BondProject
    side_effects: ["status -> IN_PROGRESS; increments BondProject.version by 1"]
  - method: POST
    path: "/district/bond-projects/{prjId}/complete"
    description: "Complete a project; releases retainage on all DISBURSED expenditures"
    roles: [Superintendent]
    code: 200
    input: []
    output: BondProject
    side_effects: ["status -> COMPLETED; DISBURSED expenditures -> RETAINAGE_RELEASED; increments BondProject.version by 1"]
  - method: POST
    path: "/district/bond-projects/{prjId}/cancel"
    description: "Cancel a PLANNED or AUTHORIZED project (AUTHORIZED requires no active expenditures)"
    roles: [Superintendent]
    code: 200
    input: []
    output: BondProject
    side_effects: ["status -> CANCELLED; authorized_amount reset to 0; increments BondProject.version by 1"]

  # --- BallotMeasure ---
  - method: POST
    path: "/district/elections/{id}/ballot-measures"
    description: "Refer a BOARD_APPROVED proposal to this election's ballot with draft language"
    roles: [BoardClerk]
    code: 201
    input: [bond_proposal_id, ballot_language]
    output: BallotMeasure
    side_effects: ["word_count computed; drafted_by_user_id = X-User-ID; status = LANGUAGE_DRAFT"]
  - method: GET
    path: "/district/elections/{id}/ballot-measures"
    description: "List ballot measures of an election"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "BallotMeasure[]"
    side_effects: []
  - method: GET
    path: "/district/bond-proposals/{id}/ballot-measures"
    description: "List ballot measures referencing a bond proposal"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "BallotMeasure[]"
    side_effects: []
  - method: GET
    path: "/district/ballot-measures/{bmId}"
    description: "Get one ballot measure"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: BallotMeasure
    side_effects: []
  - method: POST
    path: "/district/ballot-measures/{bmId}/certify"
    description: "Certify ballot language (SoD: certifier != drafter); moves proposal BOARD_APPROVED -> REFERRED"
    roles: [BoardClerk]
    code: 200
    input: []
    output: BallotMeasure
    side_effects: ["status -> LANGUAGE_CERTIFIED; certified_by_user_id = X-User-ID; BondProposal -> REFERRED; increments BallotMeasure.version by 1"]
  - method: POST
    path: "/district/ballot-measures/{bmId}/publications"
    description: "Publish district material about a measure (campaign restriction enforced)"
    roles: [BoardClerk]
    code: 201
    input: [publication_type, content]
    output: DistrictPublication
    side_effects: ["published_by_user_id = X-User-ID; status = PUBLISHED"]
  - method: GET
    path: "/district/ballot-measures/{id}/publications"
    description: "List publications of a ballot measure"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "DistrictPublication[]"
    side_effects: []

  # --- BondSale ---
  - method: POST
    path: "/district/bond-proposals/{id}/bond-sales"
    description: "Plan a bond sale series against a PASSED proposal (OCC-guarded)"
    roles: [DistrictTreasurer]
    code: 201
    input: [series_label, par_amount, premium, issuance_costs, sale_date, expected_bond_proposal_version]
    output: BondSale
    side_effects:
      - "OCC check on BondProposal.version (ERR_STALE_VERSION)"
      - "net_proceeds computed; remaining_authorization reduced by par_amount"
      - "increments BondProposal.version by 1"
  - method: GET
    path: "/district/bond-proposals/{id}/bond-sales"
    description: "List bond sales of a proposal"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "BondSale[]"
    side_effects: []
  - method: POST
    path: "/district/bond-sales/{bsId}/close"
    description: "Close a planned sale on/after its sale date; delivers proceeds and adds to outstanding debt"
    roles: [DistrictTreasurer]
    code: 200
    input: []
    output: BondSale
    side_effects: ["status -> CLOSED; BondProposal.available_proceeds += net_proceeds; FiscalYear.outstanding_debt_principal += par_amount; increments BondSale.version by 1"]
  - method: POST
    path: "/district/bond-sales/{bsId}/cancel"
    description: "Cancel a planned sale; releases the reserved authorization"
    roles: [DistrictTreasurer]
    code: 200
    input: []
    output: BondSale
    side_effects: ["status -> CANCELLED; BondProposal.remaining_authorization recomputed; increments BondSale.version by 1"]

  # --- ProjectExpenditure ---
  - method: POST
    path: "/district/bond-projects/{id}/expenditures"
    description: "Post an expenditure against an IN_PROGRESS project (budget and proceeds checks)"
    roles: [DistrictTreasurer]
    code: 201
    input: [vendor_name, amount, description]
    output: ProjectExpenditure
    side_effects: ["review_status = PENDING_REVIEW; payment_status = UNPAID; BondProject.spent_amount += amount; BondProposal.available_proceeds -= amount"]
  - method: GET
    path: "/district/bond-projects/{id}/expenditures"
    description: "List expenditures of a project (created_at ASC)"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "ProjectExpenditure[]"
    side_effects: []
  - method: POST
    path: "/district/project-expenditures/{peId}/review"
    description: "Review an unpaid expenditure (PENDING_REVIEW -> REVIEWED|FLAGGED; FLAGGED -> REVIEWED on re-review)"
    roles: [BusinessManager]
    code: 200
    input: [approved]
    output: ProjectExpenditure
    side_effects: ["review_status updated; increments ProjectExpenditure.version by 1"]
  - method: POST
    path: "/district/project-expenditures/{peId}/disburse"
    description: "Disburse a REVIEWED unpaid expenditure; 10% retainage withheld"
    roles: [DistrictTreasurer]
    code: 200
    input: []
    output: ProjectExpenditure
    side_effects: ["payment_status -> DISBURSED; retainage_amount and disbursed_amount computed; increments ProjectExpenditure.version by 1"]
  - method: POST
    path: "/district/project-expenditures/{peId}/void"
    description: "Void an UNPAID or DISBURSED expenditure; restores project budget and proposal proceeds (compensation)"
    roles: [DistrictTreasurer]
    code: 200
    input: []
    output: ProjectExpenditure
    side_effects: ["payment_status -> VOIDED; BondProject.spent_amount -= amount; BondProposal.available_proceeds += amount; retainage/disbursed reset to 0; increments ProjectExpenditure.version by 1"]

  # --- CapitalPlanAmendment ---
  - method: POST
    path: "/district/bond-proposals/{id}/amendments"
    description: "Draft a capital-plan amendment moving authorized amounts between projects of a PASSED proposal"
    roles: [BudgetAnalyst]
    code: 201
    input: [reason, adjustments]
    output: CapitalPlanAmendment
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/district/bond-proposals/{id}/amendments"
    description: "List capital-plan amendments of a proposal"
    roles: [BudgetAnalyst, BusinessManager, BoardClerk, Superintendent, DistrictTreasurer, Auditor]
    code: 200
    input: []
    output: "CapitalPlanAmendment[]"
    side_effects: []
  - method: POST
    path: "/district/capital-plan-amendments/{caId}/submit"
    description: "Submit a draft amendment for approval (DRAFT -> SUBMITTED)"
    roles: [BudgetAnalyst]
    code: 200
    input: []
    output: CapitalPlanAmendment
    side_effects: ["status -> SUBMITTED; submitted_by_user_id = X-User-ID; increments CapitalPlanAmendment.version by 1"]
  - method: POST
    path: "/district/capital-plan-amendments/{caId}/approve"
    description: "Approve a submitted amendment (SoD: approver != submitter); applies deltas to project authorizations"
    roles: [Superintendent]
    code: 200
    input: []
    output: CapitalPlanAmendment
    side_effects: ["status -> APPROVED; each BondProject.authorized_amount += delta_authorized; increments CapitalPlanAmendment.version by 1"]
  - method: POST
    path: "/district/capital-plan-amendments/{caId}/reject"
    description: "Reject a submitted amendment (SUBMITTED -> REJECTED)"
    roles: [Superintendent]
    code: 200
    input: []
    output: CapitalPlanAmendment
    side_effects: ["status -> REJECTED; increments CapitalPlanAmendment.version by 1"]
  - method: POST
    path: "/district/capital-plan-amendments/{caId}/revise"
    description: "Return a rejected amendment to DRAFT for revision (REJECTED -> DRAFT)"
    roles: [BudgetAnalyst]
    code: 200
    input: []
    output: CapitalPlanAmendment
    side_effects: ["status -> DRAFT; submitted_by_user_id cleared; increments CapitalPlanAmendment.version by 1"]

# =============================================================================
# Table 6: Error Code Catalog (68 codes)
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID missing, or role not one of the six declared roles" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's allowed roles" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, wrong type, or unknown enum member" }
  - { id: ERR_INVALID_FIELD_VALUE, http: 422, condition: "Semantically invalid field value: non-positive amount, fte not in {0.5, 1.0}, allocated_fte not a 0.5 multiple, end date not after start date, negative pupils" }
  # --- not found (14) ---
  - { id: ERR_FISCAL_YEAR_NOT_FOUND, http: 404, condition: "No fiscal year with the given id" }
  - { id: ERR_ENROLLMENT_PROJECTION_NOT_FOUND, http: 404, condition: "No enrollment projection with the given id (path or body reference)" }
  - { id: ERR_BUDGET_VERSION_NOT_FOUND, http: 404, condition: "No budget version with the given id" }
  - { id: ERR_BUDGET_LINE_NOT_FOUND, http: 404, condition: "No budget line with the given id (body reference in transfers)" }
  - { id: ERR_STAFFING_ALLOCATION_NOT_FOUND, http: 404, condition: "No staffing allocation with the given id" }
  - { id: ERR_POSITION_NOT_FOUND, http: 404, condition: "No position with the given id" }
  - { id: ERR_REVENUE_ESTIMATE_NOT_FOUND, http: 404, condition: "No revenue estimate with the given id" }
  - { id: ERR_PUBLIC_HEARING_NOT_FOUND, http: 404, condition: "No public hearing with the given id" }
  - { id: ERR_ELECTION_NOT_FOUND, http: 404, condition: "No election with the given id" }
  - { id: ERR_BOND_PROPOSAL_NOT_FOUND, http: 404, condition: "No bond proposal with the given id (path or body reference)" }
  - { id: ERR_BOND_PROJECT_NOT_FOUND, http: 404, condition: "No bond project with the given id (path or adjustments reference)" }
  - { id: ERR_BALLOT_MEASURE_NOT_FOUND, http: 404, condition: "No ballot measure with the given id (path or results reference)" }
  - { id: ERR_BOND_SALE_NOT_FOUND, http: 404, condition: "No bond sale with the given id" }
  - { id: ERR_PROJECT_EXPENDITURE_NOT_FOUND, http: 404, condition: "No project expenditure with the given id" }
  - { id: ERR_CAPITAL_PLAN_AMENDMENT_NOT_FOUND, http: 404, condition: "No capital-plan amendment with the given id" }
  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine violation: trigger not allowed from the entity's current state" }
  - { id: ERR_EXPENDITURE_NOT_REVIEWED, http: 409, condition: "Disburse attempted on an expenditure whose review_status is not REVIEWED" }
  - { id: ERR_FISCAL_YEAR_NOT_OPEN, http: 409, condition: "Child creation (projection, budget version, bond proposal) requires the fiscal year OPEN" }
  - { id: ERR_BUDGET_VERSION_NOT_DRAFT, http: 409, condition: "Budget line / transfer / staffing allocation mutation requires the budget version DRAFT" }
  - { id: ERR_BUDGET_VERSION_NOT_HEARING_HELD, http: 409, condition: "Adoption requires the budget version HEARING_HELD" }
  # --- business safety ---
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempted both steps of a segregated pair (draft/certify ballot language; submit/approve amendment)" }
  - { id: ERR_PROHIBITED_CAMPAIGN_ACTIVITY, http: 403, condition: "PROMOTIONAL district publication about a ballot measure is always prohibited" }
  # --- business temporal ---
  - { id: ERR_STATUTORY_ELECTION_DATE, http: 409, condition: "election_date is not the first Tuesday of March, June, or November" }
  - { id: ERR_NOTICE_WINDOW_TOO_SHORT, http: 409, condition: "hearing_date < notice_publication_date + 10 days" }
  - { id: ERR_HEARING_DATE_NOT_TODAY, http: 409, condition: "hold attempted when today's clock date != hearing_date" }
  - { id: ERR_ADOPTION_TOO_SOON, http: 409, condition: "Adoption attempted before hearing_held_date + 7 days" }
  - { id: ERR_ADOPTION_DEADLINE_PASSED, http: 409, condition: "Adoption attempted on/after the fiscal year's start_date" }
  - { id: ERR_CERTIFICATION_DEADLINE_PASSED, http: 409, condition: "Ballot certification attempted after election_date - 61 days" }
  - { id: ERR_CAMPAIGN_RESTRICTION_WINDOW, http: 409, condition: "FACTUAL publication about a certified measure inside [election_date - 30, election_date]" }
  - { id: ERR_CANVASS_BEFORE_ELECTION, http: 409, condition: "Canvass attempted when today <= election_date" }
  - { id: ERR_AUTHORIZATION_LAPSED, http: 409, condition: "sale_date later than proposal passed_at + 36 months" }
  - { id: ERR_SALE_NOT_YET_EFFECTIVE, http: 409, condition: "Bond sale close attempted before sale_date" }
  # --- business constraint ---
  - { id: ERR_DUPLICATE_GRADE_BAND, http: 409, condition: "An enrollment projection for this grade band already exists in the fiscal year, or an allocation for the band already exists in the budget version" }
  - { id: ERR_HEARING_VENUE_DATE_CONFLICT, http: 409, condition: "Another hearing with status NOTICE_PUBLISHED or HELD already occupies this venue on this date" }
  - { id: ERR_DUPLICATE_BALLOT_MEASURE, http: 409, condition: "The proposal already has a ballot measure on this election" }
  - { id: ERR_BALLOT_LANGUAGE_TOO_LONG, http: 422, condition: "Ballot language word_count > 200 at certification" }
  - { id: ERR_SITE_WINDOW_CONFLICT, http: 409, condition: "Another non-CANCELLED project at the same site has an overlapping construction window or a gap < 14 days" }
  - { id: ERR_DUPLICATE_PRIORITY_RANK, http: 409, condition: "priority_rank already used by another non-CANCELLED project of the proposal" }
  - { id: ERR_REVENUE_ESTIMATE_EXISTS, http: 409, condition: "The budget version already has a revenue estimate" }
  - { id: ERR_PROJECT_LIST_EXCEEDS_AMOUNT, http: 422, condition: "Sum of estimated_cost over the proposal's non-CANCELLED projects would exceed total_amount" }
  - { id: ERR_CANVASS_INCOMPLETE, http: 422, condition: "results do not cover every LANGUAGE_CERTIFIED measure of the election exactly once" }
  - { id: ERR_DUPLICATE_SERIES_LABEL, http: 409, condition: "series_label already used by a non-CANCELLED sale of the proposal" }
  # --- business referential ---
  - { id: ERR_CROSS_FISCAL_YEAR_REFERENCE, http: 422, condition: "enrollment_projection_id belongs to a different fiscal year than the budget version" }
  - { id: ERR_TRANSFER_LINE_MISMATCH, http: 422, condition: "from_line_id / to_line_id are not lines of the same budget version (or are the same line)" }
  - { id: ERR_PROJECTIONS_NOT_ALL_CERTIFIED, http: 409, condition: "Recertification requires every enrollment projection of the fiscal year to be CERTIFIED" }
  - { id: ERR_NO_ADOPTED_BUDGET_VERSION, http: 409, condition: "Fiscal year close requires an ADOPTED budget version" }
  - { id: ERR_AMENDMENT_PROJECT_MISMATCH, http: 422, condition: "An adjustment references a project that does not belong to the amendment's proposal" }
  - { id: ERR_NO_CLOSED_BOND_SALE, http: 409, condition: "Project activation requires at least one CLOSED bond sale on the proposal" }
  - { id: ERR_UNREVIEWED_EXPENDITURES_EXIST, http: 409, condition: "Project completion blocked by expenditures still PENDING_REVIEW or FLAGGED" }
  - { id: ERR_NO_REVENUE_ESTIMATE, http: 409, condition: "Adoption requires a revenue estimate on the budget version" }
  - { id: ERR_EMPTY_PROJECT_LIST, http: 409, condition: "Board approval requires at least one PLANNED project on the proposal" }
  # --- business fiscal ---
  - { id: ERR_ALLOCATION_EXCEEDS_FORMULA, http: 422, condition: "allocated_fte > formula required_fte" }
  - { id: ERR_FTE_CEILING_EXCEEDED, http: 422, condition: "Sum of allocated_fte over the budget version's allocations would exceed the fiscal year's fte_ceiling" }
  - { id: ERR_POSITION_FTE_EXCEEDED, http: 422, condition: "Position fte exceeds the allocation's remaining FTE headroom" }
  - { id: ERR_TAX_RATE_CAP_EXCEEDED, http: 422, condition: "Rounded operating rate would exceed 1.8400" }
  - { id: ERR_BUDGET_NOT_BALANCED, http: 422, condition: "total_appropriations > revenue estimate total_revenue at adoption" }
  - { id: ERR_BOND_CAPACITY_EXCEEDED, http: 422, condition: "Approval would push consumed bond capacity over 6.9% of current EAV" }
  - { id: ERR_SALE_EXCEEDS_REMAINING_AUTHORIZATION, http: 422, condition: "par_amount > proposal remaining_authorization" }
  - { id: ERR_NONPOSITIVE_NET_PROCEEDS, http: 422, condition: "par_amount + premium - issuance_costs <= 0" }
  - { id: ERR_PROJECT_BUDGET_EXCEEDED, http: 422, condition: "Expenditure amount > project available_budget" }
  - { id: ERR_INSUFFICIENT_PROCEEDS, http: 422, condition: "Expenditure amount > proposal available_proceeds" }
  - { id: ERR_TRANSFER_EXCEEDS_LINE, http: 422, condition: "Transfer amount > from-line appropriation_amount" }
  - { id: ERR_AMENDMENT_BELOW_SPENT, http: 422, condition: "Amendment would reduce a project's authorized_amount below its spent_amount" }
  - { id: ERR_AMENDMENT_EXCEEDS_AUTHORIZATION, http: 422, condition: "Amendment would push the sum of authorized amounts over the proposal's total_amount" }

# =============================================================================
# Table 7: RBAC Matrix (6 roles, all opaque operator identities)
# =============================================================================
roles:
  - name: BudgetAnalyst
    description: "District business office analyst: drafts budgets, projections, staffing allocations, positions, and capital-plan amendments"
    identity: opaque
    exclusive_operations:
      - "POST /district/fiscal-years/{id}/enrollment-projections"
      - "POST /district/fiscal-years/{id}/budget-versions"
      - "POST /district/budget-versions/{id}/budget-lines"
      - "POST /district/budget-versions/{id}/transfers"
      - "POST /district/budget-versions/{id}/staffing-allocations"
      - "POST /district/staffing-allocations/{id}/positions"
      - "POST /district/bond-proposals/{id}/amendments"
      - "POST /district/capital-plan-amendments/{caId}/submit"
      - "POST /district/capital-plan-amendments/{caId}/revise"
    shared_operations: ["All GET endpoints", "POST /_clock/set_current_utc"]
  - name: BusinessManager
    description: "Chief business official: owns fiscal years, certifies projections, computes revenue estimates and tax rates, reviews expenditures"
    identity: opaque
    exclusive_operations:
      - "POST /district/fiscal-years"
      - "POST /district/fiscal-years/{fyId}/open"
      - "POST /district/fiscal-years/{fyId}/close"
      - "POST /district/enrollment-projections/{epId}/certify"
      - "POST /district/budget-versions/{id}/revenue-estimates"
      - "POST /district/revenue-estimates/{reId}/recertify"
      - "POST /district/project-expenditures/{peId}/review"
    shared_operations: ["All GET endpoints", "POST /_clock/set_current_utc"]
  - name: BoardClerk
    description: "Secretary to the board: official record of board actions — propose/adopt budgets, hearings, elections, ballot certification, publications, bond proposals and project lists"
    identity: opaque
    exclusive_operations:
      - "POST /district/budget-versions/{bvId}/propose"
      - "POST /district/budget-versions/{bvId}/return-to-draft"
      - "POST /district/budget-versions/{bvId}/adopt"
      - "POST /district/budget-versions/{id}/hearings"
      - "POST /district/public-hearings/{hId}/hold"
      - "POST /district/public-hearings/{hId}/cancel"
      - "POST /district/elections"
      - "POST /district/elections/{eId}/canvass"
      - "POST /district/fiscal-years/{id}/bond-proposals"
      - "POST /district/bond-proposals/{bpId}/approve-board"
      - "POST /district/bond-proposals/{bpId}/revise"
      - "POST /district/bond-proposals/{id}/projects"
      - "POST /district/elections/{id}/ballot-measures"
      - "POST /district/ballot-measures/{bmId}/certify"
      - "POST /district/ballot-measures/{bmId}/publications"
    shared_operations: ["All GET endpoints", "POST /_clock/set_current_utc"]
  - name: Superintendent
    description: "District superintendent: hiring authority (fill/vacate/eliminate positions), construction authority (activate/complete/cancel projects), amendment approver"
    identity: opaque
    exclusive_operations:
      - "POST /district/positions/{pId}/fill"
      - "POST /district/positions/{pId}/vacate"
      - "POST /district/positions/{pId}/eliminate"
      - "POST /district/bond-projects/{prjId}/activate"
      - "POST /district/bond-projects/{prjId}/complete"
      - "POST /district/bond-projects/{prjId}/cancel"
      - "POST /district/capital-plan-amendments/{caId}/approve"
      - "POST /district/capital-plan-amendments/{caId}/reject"
    shared_operations: ["All GET endpoints", "POST /_clock/set_current_utc"]
  - name: DistrictTreasurer
    description: "District treasurer: bond sales and disbursements"
    identity: opaque
    exclusive_operations:
      - "POST /district/bond-proposals/{id}/bond-sales"
      - "POST /district/bond-sales/{bsId}/close"
      - "POST /district/bond-sales/{bsId}/cancel"
      - "POST /district/bond-projects/{id}/expenditures"
      - "POST /district/project-expenditures/{peId}/disburse"
      - "POST /district/project-expenditures/{peId}/void"
    shared_operations: ["All GET endpoints", "POST /_clock/set_current_utc"]
  - name: Auditor
    description: "External auditor: read-only access to every resource; no mutation rights"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints", "POST /_clock/set_current_utc"]
