              as: ProgramCoordinator
              captures: { offer_1: $.data.id }
            - call: "POST /glean/offers"
              payload: { farm_id: "${farm_id}", crop_code: "APPLES", estimated_lbs: 100.0, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-20T00:00:00Z", perishability_class: "LOW", requires_refrigeration: false }
              as: ProgramCoordinator
              captures: { offer_2: $.data.id }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_1}", scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T12:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { ev1: $.data.id }
            - call: "POST /glean/events/${ev1}/publish"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /glean/events/${ev1}/cancel"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_2}", scheduled_start: "2026-08-10T09:00:00Z", scheduled_end: "2026-08-10T13:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { ev2: $.data.id }
            - call: "POST /glean/events/${ev2}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { ev2_st: $.data.status }
            - call: "POST /glean/events"
              payload: { surplus_offer_id: "${offer_2}", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T14:00:00Z", crew_leader_volunteer_id: "${lead_id}", assigned_vehicle_id: "${veh_id}", crew_capacity: 1 }
              as: ProgramCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "ev2_st == OPEN (vehicle free because E1 CANCELLED events do not occupy, despite geometric overlap)"
            - "err_id == ERR_VEHICLE_SCHEDULE_CONFLICT (E3 [10:00,14:00) overlaps E2 [09:00,13:00) and E2 is OPEN — occupying state; rejected at creation)"

      - name: volunteer_double_booking_aggregate_across_events
        grounds:
          - validations[priority=9]
          - state_machines.CrewAssignment.PENDING_to_CONFIRMED
        distinguishing_aspect: |
          Resource: Volunteer time; semantics: aggregate overlap across DISTINCT
          events keyed on the volunteer's CONFIRMED assignments only — PENDING
          assignments never block, and adjacency (one event's end == another's
          start) is permitted. Differs from both prior instances: neither pure
          interval geometry per (farm,crop) nor state-filtered vehicle
          occupation, but per-volunteer transitive lookup through
          CrewAssignment rows.
        test_recipe:
          setup:
