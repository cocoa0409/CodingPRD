            - "invariant holds: signed sum of non-CANCELLED billings for policy ${pol} == -554400 == adjustment_cents of the latest ISSUED result"

      - name: verified_payroll_total_reconciles_after_verify_reject_cycle
        grounds:
          - entities.AuditWorkOrder.fields.total_premium_base_dollars
          - calculations.auditable_payroll
          - state_machines.PayrollAllocation.DRAFT_to_REJECTED
        distinguishing_aspect: |
