  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: project_suspend_resume_close_cycle
        claim_type: valid_transition
        grounds: [state_machines.Project.OPEN_to_SUSPENDED, state_machines.Project.SUSPENDED_to_OPEN, state_machines.Project.OPEN_to_CLOSED]
        distinguishing_aspect: "The cyclic OPEN <-> SUSPENDED pair both succeed, and OPEN -> CLOSED with zero active assignments reaches the terminal state."
        test_recipe:
          setup: ["Project P200 OPEN with no assignments"]
          setup_api_calls:
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-200", name: "P200", equipment_budget_cents: 1000000 }
              as: FleetAdmin
              captures: { p200_id: $.data.id }
          trigger:
            - call: "POST /fleet/projects/${p200_id}/suspend"
              as: FleetAdmin
              captures: { s1: $.data.status }
            - call: "POST /fleet/projects/${p200_id}/resume"
              as: FleetAdmin
              captures: { s2: $.data.status }
            - call: "POST /fleet/projects/${p200_id}/close"
              as: FleetAdmin
              captures: { s3: $.data.status }
          assert:
            - "suspend -> SUSPENDED; resume -> OPEN; close -> CLOSED"
            - "Each transition returns 200 with the new status in the response"

      - name: project_close_blocked_while_assignment_active
        claim_type: precondition_enforcement
        grounds: [state_machines.Project.OPEN_to_CLOSED, entities.Project.fields.active_assignment_count]
        distinguishing_aspect: "close precondition active_assignment_count == 0: with one ACTIVE assignment, close -> 409 ERR_INVALID_STATE; after the assignment closes, project close succeeds."
        test_recipe:
          setup: ["Class, project P201, equipment; assignment ACTIVE on P201"]
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-201", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 250, idle_alert_utilization_bp: 3000, expected_life_hours: 12000, salvage_value_cents: 800000 }
              as: FleetAdmin
              captures: { ec201_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-201", name: "P201", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p201_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-201", class_id: "${ec201_id}", ownership: "OWNED", acquisition_cost_cents: 9000000, acquisition_date: "2026-02-01", useful_life_months: 48 }
              as: FleetAdmin
              captures: { e201_id: $.data.id, e201_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e201_id}", project_id: "${p201_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e201_v}" }
              as: FleetAdmin
              captures: { a201_id: $.data.id }
            - call: "POST /fleet/assignments/${a201_id}/activate"
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/projects/${p201_id}/close"
              as: FleetAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/assignments/${a201_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
            - call: "POST /fleet/projects/${p201_id}/close"
              as: FleetAdmin
              captures: { p201_status: $.data.status }
          assert:
            - "First close: error_id == ERR_INVALID_STATE, http 409 (active_assignment_count == 1)"
            - "After assignment close: project close succeeds -> CLOSED"

      - name: project_resume_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Project.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "resume is only declared from SUSPENDED; calling it on an OPEN project -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["Project P202 OPEN"]
          setup_api_calls:
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-202", name: "P202", equipment_budget_cents: 1000000 }
