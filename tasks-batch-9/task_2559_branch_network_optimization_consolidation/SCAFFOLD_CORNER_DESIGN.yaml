          trigger:
            - call: "POST /distribution/deposit-observations"
              payload: { subject_type: "CONSOLIDATION_CASE", consolidation_case_id: "${case_id}", month_index: 1, observed_deposits_cents: 4562880000 }
              as: NetworkOpsAdmin
              as_user_id: "u_ops_1"
              captures: { obs1_fc: $.data.forecast_deposits_cents, obs1_var: $.data.variance_bps, obs1_breach: $.data.breach }
            - call: "POST /distribution/de-novo-plans/${plan_id}/decision"
              payload: { decision: "APPROVE" }
              as: ConsolidationApprover
              as_user_id: "u_approver_1"
              captures: { err_hold: $.data.error_id }
          assert:
            - "${ma_index} == 13 and ${ma_tier} == UNDER_BRANCHED (own 2 + competitor 30 over 240000 residents rounds to 13, below SATURATED_MIN)"
            - "${plan_score} == 90 and ${plan_status} == SITE_IDENTIFIED (growth 100, income 100, opportunity 100 clamped, competition_factor 52 so the competition term contributes 48)"
            - "${ia_score} == 29 with impact_tier LOW and ${ia_days} == 90 — the UNDER_BRANCHED adjust of +10 is what keeps this case's notice at the base lead"
            - "${obs1_fc} == 4704000000 (4800000000 - 25% of 384000000) and ${obs1_var} == -300 with ${obs1_breach} == true (the breach threshold is inclusive)"
            - "MarketArea.${ma_id}.remediation_case_count == 1 and de_novo_hold == true after the observation, and ConsolidationCase.${case_id}.monitoring_posture == REMEDIATION"
            - "${err_hold} == ERR_MARKET_DE_NOVO_HOLD with HTTP 409 — priorities 37 and 38 are both satisfied, so the hold at priority 39 is the only failing rule"
            - "DeNovoSitePlan.${plan_id}.status is still SITE_IDENTIFIED (not HELD: the cascade only moves APPROVED plans) and its version is unchanged"
            - "MarketArea.${ma_id}.saturation_tier is still UNDER_BRANCHED after HN-201 closes — density falls to 13, it never rises"

      - name: the_case_author_cannot_also_approve_the_case
        claim_type: violation_to_error
        grounds:
          - validations.priority_3_ERR_SEGREGATION_OF_DUTIES
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "Segregation is per-user, not per-role: an approver acting under the same X-User-ID that authored the case is refused at priority 3, above every state and fiscal check."
        excluded_because:
          difficulty_instance: segregation_then_stale_version_then_savings_floor_ladder
          rationale: "That §1.8 instance already fires ERR_SEGREGATION_OF_DUTIES from the authoring user's own approval attempt and then proves that a different approver succeeds on the very next call, which is strictly more than a standalone violation test would show."

      - name: approval_below_the_savings_floor_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_46_ERR_SAVINGS_BELOW_FLOOR
          - errors[ERR_SAVINGS_BELOW_FLOOR]
        distinguishing_aspect: "The floor is evaluated against the recomputed net_annual_savings_cents at decision time, so a case that was legitimately submitted can still be un-approvable once a property disposition's carry has been booked."
        excluded_because:
          difficulty_instance: segregation_then_stale_version_then_savings_floor_ladder
          rationale: "The §1.8 ladder walks the floor three times — refused at 11120000, still refused at 14120000, approved at 18320000 — so it pins both the inclusive comparison and the recomputation trigger that a single violation test would leave open."

      - name: notice_effective_date_inside_the_required_lead_is_refused
        claim_type: temporal_validation
        grounds:
          - validations.priority_21_ERR_NOTICE_PERIOD_INSUFFICIENT
          - errors[ERR_NOTICE_PERIOD_INSUFFICIENT]
        distinguishing_aspect: "The lead requirement is counted in whole days from the filing date (the logical clock) to effective_closure_date against the finalized assessment's notice_required_days, so a 90-day case filed on 2026-08-01 cannot name 2026-10-29."
        excluded_because:
          difficulty_instance: notice_period_insufficient_outranks_market_window_conflict
          rationale: "That §1.8 instance triggers priority 21 while priority 25 is simultaneously violated, proving both the day-count arithmetic and the priority order in one recipe."

      - name: overlapping_regulator_notice_windows_in_one_market_collide
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_25_ERR_NOTICE_WINDOW_CONFLICT
          - errors[ERR_NOTICE_WINDOW_CONFLICT]
        distinguishing_aspect: "The conflict is computed against every other REGULATOR notice in the same MarketArea, so validity depends entirely on rows reached through a sibling case rather than on the request body."
        excluded_because:
          difficulty_instance: notice_window_touching_buffered_end_date_collides
          rationale: "That §1.8 instance sits the second notice exactly on the buffered end date (collides) and then one day past it (accepted), which fixes the inclusive boundary that a plain overlap test would leave ambiguous."

      - name: execute_closure_with_a_proposed_staff_disposition_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_42_ERR_STAFF_DISPOSITIONS_PENDING
          - errors[ERR_STAFF_DISPOSITIONS_PENDING]
        distinguishing_aspect: "case.pending_disposition_count is a derived counter, so the gate reads a rolled-up field rather than the disposition rows themselves; a single PROPOSED row blocks execution even when the notice period has fully elapsed."
        excluded_because:
          difficulty_instance: execute_closure_gated_by_pending_staff_disposition_and_warn_clock
          rationale: "That §1.8 instance blocks execution on the pending counter, clears it through the WARN clock and severance path, and then executes successfully, so it covers both the violation and the release of this gate."

      - name: severance_before_the_warn_period_elapses_is_refused
        claim_type: temporal_validation
        grounds:
          - validations.priority_23_ERR_WARN_PERIOD_NOT_ELAPSED
          - errors[ERR_WARN_PERIOD_NOT_ELAPSED]
        distinguishing_aspect: "The 60-day WARN clock runs from the disposition's own notified_on stamp, not from the case's notice filing, so two dispositions notified on different days become severable on different days."
        excluded_because:
          difficulty_instance: execute_closure_gated_by_pending_staff_disposition_and_warn_clock
          rationale: "That §1.8 instance already severs one day early (refused) and then exactly on notified_on + 60 (accepted), pinning the inclusive boundary of this rule."

      - name: redeployment_to_a_non_active_target_branch_is_refused
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_19_ERR_RECEIVING_BRANCH_NOT_ACTIVE
          - errors[ERR_RECEIVING_BRANCH_NOT_ACTIVE]
        distinguishing_aspect: "Acceptance of a redeployment offer depends on the current status of the target Branch, which a different consolidation case can move out from under the offer between proposal and acceptance."
        excluded_because:
          difficulty_instance: redeployment_accept_gated_by_target_branch_state_owned_by_another_case
          rationale: "That §1.8 instance drags the target branch into UNDER_REVIEW via a second case, fails the acceptance, then rejects that case to restore ACTIVE and accepts — a temporal sequence a single negative test cannot express."

      - name: aggregate_daily_onboarding_load_exceeds_the_receiving_capacity
        claim_type: aggregate_validation
        grounds:
          - validations.priority_30_ERR_ABSORPTION_CAPACITY_EXCEEDED
          - errors[ERR_ABSORPTION_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Each wave is individually within capacity; the violation only exists in the per-day sum over overlapping half-open intervals on the shared receiving branch."
        excluded_because:
          difficulty_instance: campaign_waves_share_receiving_branch_until_aggregate_capacity_breaks
          rationale: "That §1.8 instance admits two overlapping waves whose summed load exactly equals capacity and rejects only the third, which is the aggregate boundary this rule turns on."

  - section: endpoints
    instances:
      - name: opening_an_approved_de_novo_plan_mints_a_ramping_branch_and_resyncs_the_market
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /distribution/de-novo-plans/{planId}/open]
          - state_machines.DeNovoSitePlan.transitions.APPROVED_to_OPENED
          - calculations.market_saturation_tier
        distinguishing_aspect: "One action endpoint performs a state transition, mints a brand-new Branch row with fully system-assigned financials, and resyncs the parent market's density counters — every one of the three declared side effects is observable in the same response plus one GET."
        test_recipe:
          setup:
            - "Harbor North (population 240000, competitor_branch_count 30) has no branches yet."
            - "A de novo plan for that market has been scored 90 and APPROVED; de_novo_hold is false."
          setup_api_calls:
            - call: "POST /distribution/market-areas"
              payload: { name: "Harbor North", region_code: "MD-02", population: 240000, median_household_income_cents: 12000000, deposit_market_total_cents: 900000000000, competitor_branch_count: 30, household_growth_pct_bps: 500, digital_penetration_bps: 4400 }
              as: NetworkStrategist
              as_user_id: "u_strategist_1"
              captures: { ma_id: $.data.id, own0: $.data.own_branch_count, dens0: $.data.branch_density_per_100k }
            - call: "POST /distribution/de-novo-plans"
