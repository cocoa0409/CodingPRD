              payload: { to_iso8601: "2031-08-31T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/qeis/${qei_id}/annual-tests"
              payload: { compliance_year: 5 }
              as: ComplianceReviewer
              as_user_id: "reviewer-annual"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2032-08-30T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/qeis/${qei_id}/annual-tests"
              payload: { compliance_year: 6 }
              as: ComplianceReviewer
              as_user_id: "reviewer-annual"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2033-08-30T00:00:00Z" }
              as: CertifyingAgency
          trigger:
            - call: "POST /nmtc/qeis/${qei_id}/unwind-transactions"
              payload: { call_holder_user_id: "${cde_id}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/qeis/${qei_id}/annual-tests"
