              captures: { comp_id: $.data.id }
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Badge density scale", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: false }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /design-system/contribution-proposals/${prop_id}/submit"
              payload: {}
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { state_submitted: $.data.state }
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
              payload: { stage: "DESIGN_CRITIQUE", verdict: "APPROVE", notes: "density scale reads well" }
              as: DesignCritiqueReviewer
              as_user_id: "critic-1"
              captures: { state_at_eng_gate: $.data.resulting_proposal_state }
          trigger:
            - call: "POST /design-system/contribution-proposals/${prop_id}/reviews"
