          - validations[priority=45]
          - errors[ERR_COMPLETENESS_BELOW_THRESHOLD]
          - calculations.listing_completeness_score
        distinguishing_aspect: "The queue attempt violates two rules at once — certified 82.00 is below the 85.00 gate and slot_count 4 exceeds the capacity of 2 — and the lower priority number wins, so the answer is 422 ERR_COMPLETENESS_BELOW_THRESHOLD, not 409 ERR_FEED_CAPACITY_EXCEEDED."
