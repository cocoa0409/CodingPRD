      - name: commissioning_an_interlocked_cooking_system_requires_the_verified_interlock
        claim_type: guarded_transitions
        grounds:
          - state_machines.AuxiliarySystem.PROPOSED_to_COMMISSIONED
          - validations[priority=19]
          - calculations.auxiliary_system_demand
          - entities.AuxiliarySystem.fields.interlock_required
          - errors.ERR_INTERLOCK_NOT_VERIFIED
        distinguishing_aspect: |
          The guard is a field on the row, not on the request: COOKING derives
          interlock_required true (40.0 + 15.0 x 4 + 60.0 = 160.0 gpm with water wash), so the first
          commission omitting interlock_verified is refused with 409 ERR_INTERLOCK_NOT_VERIFIED while
          the identical window with interlock_verified true is accepted. A STANDPIPE row with the
          same window needs no flag at all.
        test_recipe:
          setup:
            - "Project FP-2601 with one COOKING auxiliary system: 4 appliances, water wash enabled, wet chemical agent"
          setup_api_calls:
            - call: "POST /engineers"
              payload: { full_name: "Dana Ruiz", license_state: "TX", license_number: "PE-77120", license_status: "ACTIVE" }
              as: FirmAdmin
              captures: { e1: $.data.id }
            - call: "POST /ahj-reviewers"
              payload: { full_name: "Marisol Vega", jurisdiction_code: "TX-AUS" }
              as: FirmAdmin
              captures: { r1: $.data.id }
            - call: "POST /projects"
              payload: { project_number: "FP-2601", building_name: "Rio Grande Distribution Center", jurisdiction_code: "TX-AUS", jurisdiction_state: "TX", occupancy_type: "STORAGE", building_height_ft: 42.0, underground_lead_in_loss_psi: 5.0, lead_engineer_id: "${e1}", ahj_reviewer_id: "${r1}" }
              as: FirmAdmin
              captures: { p1: $.data.id }
            - call: "POST /auxiliary-systems"
              payload: { project_id: "${p1}", system_type: "COOKING", label: "Kitchen hood line", appliance_count: 4, water_wash_enabled: true, agent_type: "WET_CHEMICAL" }
              as: DesignEngineer
              as_user_id: "${e1}"
              captures: { aux_cook: $.data.id }
          trigger:
            - call: "POST /auxiliary-systems/${aux_cook}/commission"
              payload: { outage_start_at: "2026-09-05T08:00:00Z", outage_end_at: "2026-09-05T12:00:00Z" }
              as: Contractor
              captures: { err: $.data.error_id }
            - call: "POST /auxiliary-systems/${aux_cook}/commission"
              payload: { outage_start_at: "2026-09-05T08:00:00Z", outage_end_at: "2026-09-05T12:00:00Z", interlock_verified: true }
              as: Contractor
          assert:
            - "AuxiliarySystem.${aux_cook}.demand_gpm == 160.0 and interlock_required == true"
            - "trigger 1: HTTP 409 with error_id == ERR_INTERLOCK_NOT_VERIFIED and status still PROPOSED"
            - "trigger 1: AuxiliarySystem.${aux_cook}.outage_start_at == null - the refused window was not stored"
            - "trigger 2: HTTP 200 with status == COMMISSIONED and interlock_verified == true"
            - "trigger 2: AuxiliarySystem.${aux_cook}.outage_start_at == '2026-09-05T08:00:00Z'"

