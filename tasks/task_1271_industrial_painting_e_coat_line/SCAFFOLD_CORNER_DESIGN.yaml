              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RECHECK_NOT_ALLOWED: cycle ${oc1} already has recheck child ${oc2}"
            - "Note: a recheck of ${oc2} (the failed recheck) WOULD be allowed — the chain advances, never branches"

  # ------------------------------------------------------------ calculations ---
  - section: calculations
    instances:
      - name: titration_boundary_inclusive_bounds
        claim_type: correct_result
        grounds: [calculations.titration_range_check]
        distinguishing_aspect: "Both range bounds are inclusive: 20.0 and 30.0 gpl are in_range; 19.9 is not."
        test_recipe:
          setup: ["line + stage 20.0-30.0 gpl"]
          setup_api_calls:
            - call: "POST /ecoat/paint-lines"
              payload: { name: "L1", current_color_code: "RAL9005", line_speed_fpm: 10.0, hanger_capacity_parts: 60, allocation_policy: "FULL_TO_NEXT_LOT" }
              as: PlantAdmin
              captures: { line1: $.data.id }
            - call: "POST /ecoat/pretreatment-stages"
              payload: { paint_line_id: "${line1}", stage_name: "alkaline_clean", sequence_no: 1, chemical_family: "CLEANER", conc_min_gpl: 20.0, conc_max_gpl: 30.0 }
              as: PlantAdmin
              captures: { st1: $.data.id }
          trigger:
            - call: "POST /ecoat/titration-readings"
              payload: { stage_id: "${st1}", measured_conc_gpl: 20.0 }
              as: ProcessChemist
              captures: { rd_min: $.data.in_range }
            - call: "POST /ecoat/titration-readings"
              payload: { stage_id: "${st1}", measured_conc_gpl: 30.0 }
              as: ProcessChemist
              captures: { rd_max: $.data.in_range }
            - call: "POST /ecoat/titration-readings"
              payload: { stage_id: "${st1}", measured_conc_gpl: 19.9 }
              as: ProcessChemist
              captures: { rd_low: $.data.in_range }
          assert:
            - "rd_min == true (lower bound inclusive); rd_max == true (upper bound inclusive); rd_low == false"
            - "After the third reading the stage is OUT_OF_RANGE (only the last reading drove a transition)"

      - name: cure_verdict_boundary_inclusive
        claim_type: correct_result
        grounds: [calculations.cure_verdict]
        distinguishing_aspect: "Cure thresholds inclusive: exactly 180.0 °C for exactly 20 min PASSes; 179.9 °C FAILs — boundary precision on the cure profile metric."
        test_recipe:
          setup: ["two lots run to CURING (slots on 05-05 and 05-06)"]
          setup_api_calls:
            - call: "POST /ecoat/customers"
