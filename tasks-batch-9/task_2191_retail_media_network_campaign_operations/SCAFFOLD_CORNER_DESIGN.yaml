            - "Campaign.${camp_x_id}.daily_cap_cents == 6000000"
            - "Campaign.${camp_x_id}.delivered_spend_cents == 0"
            - "BudgetPlan.${plan_id}.available_cents == 2000000"

      - name: two_individually_affordable_plans_breach_the_credit_limit_only_in_aggregate
        claim_type: aggregate_validation
        grounds:
          - validations[priority=73]
