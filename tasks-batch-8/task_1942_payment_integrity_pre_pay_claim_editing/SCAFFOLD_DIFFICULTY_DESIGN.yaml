            - { call: "POST /payment-integrity/disputes/${dd6_id}/submit-info", payload: { info_response: "op report attached" }, as: Provider, as_user_id: "${pd6_id}", captures: { st_back: $.data.status } }
            - { call: "POST /payment-integrity/disputes/${dd6_id}/decide", payload: { outcome: UPHELD }, as: DisputeAdjudicator, as_user_id: adj-1, captures: { st_final: $.data.status } }
          assert:
            - "Dispute.${dd6_id} moved UNDER_REVIEW -> AWAITING_PROVIDER_INFO (st_rfi == AWAITING_PROVIDER_INFO)"
            - "Dispute.${dd6_id} returned AWAITING_PROVIDER_INFO -> UNDER_REVIEW (st_back == UNDER_REVIEW): cycle closed"
            - "Dispute.${dd6_id}.status == DECIDED with outcome UPHELD"
            - "EditHit.${hd6_id}.status remains CONFIRMED; Claim.${cd6_id}.allowed_amount_cents == 0 and denied_amount_cents == 25000 (loop touched no dollars)"
  # =========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 4 and 3)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispute_overturn_cascades_to_edit_suspension
        grounds:
          - state_machines.EditHit.CONFIRMED_to_RELEASED_FALSE_POSITIVE
          - state_machines.EditVersion.ACTIVE_to_SUSPENDED
          - state_machines.ReviewTask.PENDING_to_CANCELLED
          - state_machines.Claim.DENIED_to_READY_TO_PAY
          - calculations.false_positive_rate
        distinguishing_aspect: |
          Trigger: dispute decide OVERTURNED. Depth-4 chain, each hop caused by
          the previous: (1) hit -> RELEASED_FALSE_POSITIVE with full release;
          (2) EditVersion fp counters recompute to exactly 1/4 = 0.2500;
          (3) threshold breach auto-suspends the version; (4) suspension
          cancels the still-PENDING task of an unrelated claim c5 and supersedes
          its hit; (5) both claims rebalance and bubble DENIED/PENDED ->
          READY_TO_PAY.
        test_recipe:
          setup:
            - "Provider PC4; edit EC (DENY, PROFESSIONAL) ACTIVE"
            - "Claims c1, c2, c3 (40000 each): hits upheld -> 3 CONFIRMED, fp_rate 0"
            - "Claim c4 (40000): hit upheld -> claim DENIED (allowed 0); dispute opened"
            - "Claim c5 (30000): screened while EC still ACTIVE -> hit FIRED, task PENDING, claim PENDED with allowed 0"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-C4", name: "Cascade Prov" }, as: PlanAdmin, captures: { pc4_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-rules", payload: { edit_code: "CASC-DENY", category: CODING, source: INTERNAL }, as: EditLibrarian, as_user_id: librarian-1, captures: { rc4_id: $.data.id, rc4_v: $.data.version } }
            - { call: "POST /payment-integrity/edit-rules/${rc4_id}/versions", payload: { severity: DENY, applies_to_claim_types: [PROFESSIONAL], logic_expression: "deny line", effective_from: "2026-01-01T00:00:00Z" }, as: EditLibrarian, as_user_id: librarian-1, captures: { evc4_id: $.data.id } }
            - { call: "POST /payment-integrity/edit-versions/${evc4_id}/submit", payload: {}, as: EditLibrarian, as_user_id: librarian-1 }
            - { call: "POST /payment-integrity/edit-versions/${evc4_id}/approve", payload: { expected_edit_rule_version: "${rc4_v}" }, as: EditApprover, as_user_id: approver-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "C41", provider_id: "${pc4_id}", member_id: "M-C41", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pc4_id}", captures: { c41_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${c41_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pc4_id}" }
            - { call: "POST /payment-integrity/claims/${c41_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${c41_id}" }, as: Any, captures: { t41_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${t41_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${t41_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "C42", provider_id: "${pc4_id}", member_id: "M-C42", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pc4_id}", captures: { c42_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${c42_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pc4_id}" }
            - { call: "POST /payment-integrity/claims/${c42_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${c42_id}" }, as: Any, captures: { t42_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${t42_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${t42_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "C43", provider_id: "${pc4_id}", member_id: "M-C43", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pc4_id}", captures: { c43_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${c43_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pc4_id}" }
            - { call: "POST /payment-integrity/claims/${c43_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${c43_id}" }, as: Any, captures: { t43_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${t43_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${t43_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "C44", provider_id: "${pc4_id}", member_id: "M-C44", claim_type: PROFESSIONAL, total_billed_cents: 40000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pc4_id}", captures: { c44_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${c44_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 40000 }, as: Provider, as_user_id: "${pc4_id}" }
            - { call: "POST /payment-integrity/claims/${c44_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/review-tasks", payload: { claim_id: "${c44_id}" }, as: Any, captures: { t44_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/review-tasks/${t44_id}/assign", payload: { reviewer_user_id: "rev-1" }, as: SeniorReviewer, as_user_id: senior-1 }
            - { call: "POST /payment-integrity/review-tasks/${t44_id}/decide", payload: { outcome: UPHOLD }, as: Reviewer, as_user_id: rev-1 }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "C45", provider_id: "${pc4_id}", member_id: "M-C45", claim_type: PROFESSIONAL, total_billed_cents: 30000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${pc4_id}", captures: { c45_id: $.data.id } }
            - { call: "POST /payment-integrity/claims/${c45_id}/lines", payload: { line_number: 1, procedure_code: "99213", billed_cents: 30000 }, as: Provider, as_user_id: "${pc4_id}" }
            - { call: "POST /payment-integrity/claims/${c45_id}/run-edits", payload: {}, as: PlanAdmin }
            - { call: "GET /payment-integrity/claims/${c44_id}", payload: {}, as: Any, captures: { c44_v: $.data.version } }
            - { call: "GET /payment-integrity/claims/${c44_id}/edit-hits", payload: {}, as: Any, captures: { h44_id: "$.data[0].id" } }
            - { call: "POST /payment-integrity/claims/${c44_id}/disputes", payload: { edit_hit_id: "${h44_id}", reason: "false positive", expected_claim_version: "${c44_v}" }, as: Provider, as_user_id: "${pc4_id}", captures: { d44_id: $.data.id } }
            - { call: "POST /payment-integrity/disputes/${d44_id}/start-review", payload: {}, as: DisputeAdjudicator, as_user_id: adj-1 }
          trigger:
            - { call: "POST /payment-integrity/disputes/${d44_id}/decide", payload: { outcome: OVERTURNED }, as: DisputeAdjudicator, as_user_id: adj-1 }
          assert:
            - "EditHit.${h44_id}.status == RELEASED_FALSE_POSITIVE and released_cents == 40000 (hop 1)"
            - "EditVersion.${evc4_id}.fp_rate == 0.2500 with resolved_hits_count == 4 (hop 2)"
            - "EditVersion.${evc4_id}.status == SUSPENDED via auto-suspension (hop 3)"
            - "ReviewTask of claim ${c45_id} is CANCELLED and its EditHit is SUPERSEDED with released_cents == 30000 (hop 4)"
            - "Claim.${c45_id}.status == READY_TO_PAY with allowed_amount_cents == 30000 and denied_amount_cents == 0 (hop 5 rebalance + bubble-up)"
            - "Claim.${c44_id}.status == READY_TO_PAY with allowed_amount_cents == 40000 (DENIED -> READY_TO_PAY compensation)"

      - name: run_edits_high_dollar_ibr_chain
        grounds:
          - state_machines.Claim.RECEIVED_to_PENDED
          - state_machines.ItemizedBillReview.transitions
          - calculations.high_dollar_evaluation
          - entities.ProviderAbrasionProfile.fields.open_ibr_count
        distinguishing_aspect: |
          Trigger: run-edits on a claim billed at exactly the 10000000-cent
          threshold. Depth-3 chain, each hop caused by the previous: (1) claim
          high_dollar_flag computed true and claim pends; (2) the flag
          auto-creates an ItemizedBillReview in REQUESTED with due_at =
          now + 30 days; (3) the new REQUESTED review opens provider audit
          occupancy, incrementing ProviderAbrasionProfile.open_ibr_count to 1.
        test_recipe:
          setup:
            - "Provider PH; claim HD with one line of exactly 10000000 cents; no edit rules"
          setup_api_calls:
            - { call: "POST /payment-integrity/providers", payload: { npi: "NPI-H1", name: "HighDollar Prov" }, as: PlanAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /payment-integrity/claims", payload: { claim_number: "HD1", provider_id: "${ph_id}", member_id: "M-H1", claim_type: PROFESSIONAL, total_billed_cents: 10000000, service_from: "2026-07-10T00:00:00Z", service_to: "2026-07-10T00:00:00Z" }, as: Provider, as_user_id: "${ph_id}", captures: { chd_id: $.data.id } }
