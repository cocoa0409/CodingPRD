            - "captured ${s_past_due} == OVERDUE (one second past)"
            - "captured ${s_at_grace} == OVERDUE (at exactly due + 7d, not yet escalated)"
            - "captured ${s_past_grace} == ESCALATED (one second past the grace boundary)"

