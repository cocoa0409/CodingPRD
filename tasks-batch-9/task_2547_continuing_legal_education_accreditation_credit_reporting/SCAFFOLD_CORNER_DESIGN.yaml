# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2547 — Continuing Legal Education Accreditation & Credit Reporting
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Sections and claim_type values are
# taken verbatim from references/claim-extraction-guide.md; nothing is invented.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs with no test_recipe.
#
# Conventions shared with §1.8:
#   * Logical clock starts at 2026-08-01T00:00:00Z and only moves through
#     POST /_clock/set_current_utc.
#   * `as_user_id` carries X-User-ID; for ProviderAdmin it is the Provider id and
#     for Attorney it is the Attorney id (§1.7 entity_backed identities).
#   * `expect_error: ERR_X` marks a call that must be refused with that error_id.
#   * Unknown-row probes use the reserved id 00000000-0000-4000-8000-00000000dead.
#   * `as: NONE` means the request carries neither X-User-Role nor X-User-ID, and
#     `as: UNKNOWN_ROLE` means X-User-Role carries a string that names none of the
#     five roles of §1.7; both are priority-10 probes, not role probes.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: provider_creation_and_retrieval_return_the_applied_defaults_and_zero_risk
        claim_type: creation
        grounds:
          - entities.Provider
          - endpoints[POST /cle/providers]
          - endpoints[GET /cle/providers/{id}]
          - calculations.provider_risk_score
        distinguishing_aspect: "A brand-new Provider is APPLIED with self_certification_enabled false, version 1, every denormalized counter 0, both term datetimes null, risk_score 0.0 under REVIEWED_WEIGHTING; the immediately following GET returns byte-identical values."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Harborview Bar Academy", provider_type: "COMMERCIAL", annual_fee_cents: 90000 }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
          trigger:
            - call: "GET /cle/providers/${prov_id}"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          assert:
            - "POST returned HTTP 201 and Provider.${prov_id}.accreditation_status == 'APPLIED'"
            - "Provider.${prov_id}.self_certification_enabled == false and version == 1"
            - "Provider.${prov_id}.annual_fee_cents == 90000 (the supplied value, not the 120000 default)"
            - "Provider.${prov_id}.risk_score == 0.0 and risk_score_variant == 'REVIEWED_WEIGHTING' — the declared defaults, because POST /cle/providers is NOT one of the triggers of calculations.provider_risk_score (no staleness term is evaluated yet)"
            - "Provider.${prov_id}.accreditation_term_start is null and accreditation_term_end is null"
            - "courses_total_count == 0, courses_self_certified_count == 0, attendance_reports_total_count == 0, attendance_reports_late_count == 0, substantiated_complaint_count == 0, audit_findings_count == 0, courses_sampled_lifetime == 0, last_audit_closed_at is null"
            - "Provider.${prov_id}.id is a bare 36-character UUID with no type prefix"
            - "The GET returns HTTP 200 with the same field values and version 1 (a read never mutates)"

      - name: course_listing_is_filtered_and_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /cle/courses]
          - response_envelope.pagination_fields
          - entities.Course.fields.status
          - entities.Course.fields.delivery_format
        distinguishing_aspect: "GET /cle/courses returns created_at DESC (newest first) with total_count 3 and has_more true at limit 2; offset 2 returns the last row with has_more false; delivery_format=SELF_STUDY narrows total_count to 1 without changing the sort."
        test_recipe:
          setup:
            - "One ACCREDITED provider whose three courses are therefore APPROVED at creation: L1 and L2 are LIVE_WEBCAST, S1 is SELF_STUDY, created in that order."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Statewide Bar CLE Institute", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Civil Motion Practice", delivery_format: "LIVE_WEBCAST", total_minutes: 120, presented_at: "2026-02-02T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Appellate Brief Workshop", delivery_format: "LIVE_WEBCAST", total_minutes: 180, presented_at: "2026-03-03T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 180 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { l2_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Trust Accounting Basics", delivery_format: "SELF_STUDY", total_minutes: 240, presented_at: "2026-04-04T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 240 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { s1_id: $.data.id }
          trigger:
            - call: "GET /cle/courses?provider_id=${prov_id}&status=APPROVED&limit=2&offset=0"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "GET /cle/courses?provider_id=${prov_id}&status=APPROVED&limit=2&offset=2"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "GET /cle/courses?provider_id=${prov_id}&delivery_format=SELF_STUDY"
              as: ProviderAdmin
              as_user_id: "${prov_id}"
          assert:
            - "First trigger -> HTTP 200, total_count == 3, has_more == true, exactly 2 items"
            - "First trigger -> items[0].id == ${s1_id} and items[1].id == ${l2_id} (created_at DESC)"
            - "Second trigger -> total_count == 3, has_more == false, exactly 1 item whose id == ${l1_id}"
            - "Third trigger -> total_count == 1, has_more == false, items[0].id == ${s1_id}"
            - "All three responses carry response_type == 'array' and meta.api_request_id"

      - name: unknown_ids_on_every_single_resource_read_return_their_own_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority 30 -> ERR_PROVIDER_NOT_FOUND]
          - errors[ERR_PROVIDER_NOT_FOUND]
          - errors[ERR_COURSE_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_ATTORNEY_NOT_FOUND]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_CREDIT_RECORD_NOT_FOUND]
          - errors[ERR_RECIPROCITY_CLAIM_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
          - errors[ERR_COMPLAINT_NOT_FOUND]
          - errors[ERR_FEE_ASSESSMENT_NOT_FOUND]
        distinguishing_aspect: "Each path family maps to its OWN 404 error_id (never a generic ERR_NOT_FOUND), and it does so even though the database is non-empty — the lookup is by id, not by table emptiness."
        test_recipe:
          setup:
            - "One real Provider row exists, so every 404 below is a genuine id miss rather than an empty store."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Northgate CLE Group", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id }
          trigger:
            - call: "GET /cle/providers/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_PROVIDER_NOT_FOUND
            - call: "GET /cle/courses/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_COURSE_NOT_FOUND
            - call: "GET /cle/course-applications/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_APPLICATION_NOT_FOUND
            - call: "GET /cle/attorneys/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_ATTORNEY_NOT_FOUND
            - call: "GET /cle/compliance-cycles/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_CYCLE_NOT_FOUND
            - call: "GET /cle/credit-records/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_CREDIT_RECORD_NOT_FOUND
            - call: "POST /cle/reciprocity-claims/00000000-0000-4000-8000-00000000dead/determination"
              payload: { action: "DENY", determination_reason: "Probe of an unknown claim id." }
              as: BoardAdmin
              expect_error: ERR_RECIPROCITY_CLAIM_NOT_FOUND
            - call: "GET /cle/provider-audits/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_AUDIT_NOT_FOUND
            - call: "GET /cle/complaints/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_COMPLAINT_NOT_FOUND
            - call: "GET /cle/fee-assessments/00000000-0000-4000-8000-00000000dead"
              as: BoardAdmin
              expect_error: ERR_FEE_ASSESSMENT_NOT_FOUND
          assert:
            - "Every trigger returns HTTP 404 with response_type == 'error'"
            - "The ten error_id values are exactly ERR_PROVIDER_NOT_FOUND, ERR_COURSE_NOT_FOUND, ERR_APPLICATION_NOT_FOUND, ERR_ATTORNEY_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_CREDIT_RECORD_NOT_FOUND, ERR_RECIPROCITY_CLAIM_NOT_FOUND, ERR_AUDIT_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_FEE_ASSESSMENT_NOT_FOUND in that order"
            - "GET /cle/providers/${prov_id} still returns HTTP 200, so the store was untouched"

      - name: attorney_creation_without_compliance_group_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /cle/attorneys]
          - entities.Attorney.fields.compliance_group
          - validations[priority 45 -> ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "compliance_group has source input and no default, so omitting it is a 422 ERR_INVALID_REQUEST and no Attorney row is written — it is not silently defaulted to GROUP_1."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1001", full_name: "Priya Raman", admission_date: "2011-09-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_ok: $.data.id }
          trigger:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1002", full_name: "Owen Marsh", admission_date: "2013-09-01T00:00:00Z", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              expect_error: ERR_INVALID_REQUEST
          assert:
            - "Trigger -> HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "No Attorney row with bar_number 'BAR-1002' exists"
            - "Attorney.${att_ok}.compliance_group == 'GROUP_1' (the well-formed sibling call still succeeded)"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Provider.fields.annual_fee_cents
          - entities.ComplianceCycle.fields.carryover_election
          - entities.ComplianceCycle.fields.carryover_in_general_minutes
          - domain_constants.DEFAULT_PROVIDER_ANNUAL_FEE_CENTS
          - state_machines.Provider.APPLIED_to_PROBATIONARY
        distinguishing_aspect: "Omitting annual_fee_cents yields 120000 and the PROVIDER_ANNUAL assessment is raised for exactly that amount; omitting carryover_election yields CARRY_FORWARD and omitting previous_cycle_id yields carryover_in_general_minutes 0 and carryover_in_ethics_minutes 0."
        test_recipe:
          setup:
            - "One provider created without annual_fee_cents and granted probationary accreditation, plus one attorney whose first cycle is opened without carryover_election or previous_cycle_id."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Meridian CLE Partners", provider_type: "GOVERNMENT" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1010", full_name: "Dana Whitlock", admission_date: "2008-04-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "GET /cle/fee-assessments?provider_id=${prov_id}"
              as: BoardAdmin
              captures: { fee_annual: "$.data.items[0].id" }
          assert:
            - "Provider.${prov_id}.annual_fee_cents == 120000 (DEFAULT_PROVIDER_ANNUAL_FEE_CENTS)"
            - "FeeAssessment.${fee_annual}.fee_type == 'PROVIDER_ANNUAL', amount_cents == 120000, status == 'ASSESSED', provider_id == ${prov_id}, attorney_id is null"
            - "ComplianceCycle.${cyc_id}.carryover_election == 'CARRY_FORWARD'"
            - "ComplianceCycle.${cyc_id}.previous_cycle_id is null, carryover_in_general_minutes == 0, carryover_in_ethics_minutes == 0"
            - "ComplianceCycle.${cyc_id}.credit_status == 'OPEN' and administrative_status == 'GOOD_STANDING'"

      - name: course_expires_at_is_computed_per_delivery_format_and_never_supplied
        claim_type: computed_fields
        grounds:
          - entities.Course.fields.expires_at
          - entities.Course.fields.credited_minutes_total
          - entities.Course.fields.approval_pathway
          - domain_constants.APPROVAL_VALID_MONTHS
        distinguishing_aspect: "expires_at uses two different formulas: presented_at + total_minutes for the two LIVE formats, presented_at + 36 months for ON_DEMAND and SELF_STUDY — so a 120-minute webcast expires the same morning while a 300-minute on-demand program lives for three years."
        test_recipe:
          setup:
            - "One ACCREDITED provider sponsoring one LIVE_WEBCAST, one ON_DEMAND and one SELF_STUDY course."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Lakeshore Legal Education", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
          trigger:
            - call: "POST /cle/courses"
              payload: { title: "Deposition Skills Live", delivery_format: "LIVE_WEBCAST", total_minutes: 120, presented_at: "2026-02-02T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { live_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Recorded Evidence Series", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2026-03-03T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 180 }, { category: "ETHICS", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { od_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Written Materials Study", delivery_format: "SELF_STUDY", total_minutes: 240, presented_at: "2026-04-04T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 240 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { ss_id: $.data.id }
          assert:
            - "Course.${live_id}.expires_at == '2026-02-02T11:00:00Z' (presented_at + 120 minutes)"
            - "Course.${od_id}.expires_at == '2029-03-03T09:00:00Z' (presented_at + APPROVAL_VALID_MONTHS 36)"
            - "Course.${ss_id}.expires_at == '2029-04-04T09:00:00Z' (presented_at + APPROVAL_VALID_MONTHS 36)"
            - "Course.${od_id}.credited_minutes_total == 300 and Course.${live_id}.credited_minutes_total == 120"
            - "All three courses have approval_pathway == 'PROVIDER_ACCREDITED' and status == 'APPROVED'"
            - "Provider.${prov_id}.courses_total_count == 3 and courses_self_certified_count == 3"

      - name: course_status_and_attendance_code_are_system_written_so_client_input_is_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Course.fields.attendance_code
          - entities.Course.fields.status
          - endpoints[POST /cle/courses]
        distinguishing_aspect: "attendance_code is minted (six characters) if and only if attendance_verification_method == ATTENDANCE_CODE and is null for every other method; id, created_at, status and expires_at supplied in the request body are discarded rather than honored."
        test_recipe:
          setup:
            - "One ACCREDITED provider."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Riverbend Bar Center", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
          trigger:
            - call: "POST /cle/courses"
              payload: { title: "Coded Attendance Seminar", delivery_format: "LIVE_WEBCAST", total_minutes: 90, presented_at: "2026-05-05T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 90 } ], provider_id: "${prov_id}", id: "00000000-0000-4000-8000-00000000dead", status: "REVOKED", expires_at: "2099-01-01T00:00:00Z", attendance_code: "HACKED" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { coded_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Affirmation Only Study", delivery_format: "SELF_STUDY", total_minutes: 60, presented_at: "2026-05-05T09:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 60 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { plain_id: $.data.id }
          assert:
            - "Course.${coded_id}.id != '00000000-0000-4000-8000-00000000dead' (server-generated id)"
            - "Course.${coded_id}.status == 'APPROVED' (not the supplied REVOKED)"
            - "Course.${coded_id}.expires_at == '2026-05-05T10:30:00Z' (not the supplied 2099 instant)"
            - "Course.${coded_id}.attendance_code is a six-character string and != 'HACKED'"
            - "Course.${plain_id}.attendance_code is null"
            - "Course.${coded_id}.created_at equals the logical clock instant 2026-08-01T00:00:00Z"

      - name: an_unknown_provider_type_and_an_inverted_cycle_period_both_return_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Provider.fields.provider_type
          - entities.ComplianceCycle.fields.period_start
          - validations[priority 45 -> ERR_INVALID_REQUEST]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Enum membership and the period_start < period_end ordering are both priority-45 shape checks, so each returns 422 ERR_INVALID_REQUEST before any state machine or uniqueness rule is consulted."
        test_recipe:
          setup:
            - "One attorney exists so the inverted-period probe reaches shape validation rather than a 404."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1020", full_name: "Karim Aziz", admission_date: "2010-01-01T00:00:00Z", compliance_group: "GROUP_2", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /cle/providers"
              payload: { name: "Unclassified Trainer", provider_type: "NONPROFIT" }
              as: BoardAdmin
              expect_error: ERR_INVALID_REQUEST
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2028-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              expect_error: ERR_INVALID_REQUEST
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z" }
              as: BoardAdmin
              expect_error: ERR_INVALID_REQUEST
          assert:
            - "All three triggers return HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "No Provider row named 'Unclassified Trainer' exists"
            - "GET /cle/compliance-cycles?attorney_id=${att_id} returns total_count == 0 (neither the inverted nor the zero-length period was stored)"

      - name: common_fields_false_entities_expose_no_version_or_updated_at
        claim_type: immutability
        grounds:
          - entities.CreditAllocation
          - entities.Affirmation
          - entities.ReportingSweep
          - endpoints[GET /cle/courses/{id}/credit-allocations]
          - endpoints[GET /cle/compliance-cycles/{id}/affirmations]
        distinguishing_aspect: "CreditAllocation, Affirmation and ReportingSweep are declared common_fields: false — they carry id and created_at but no version and no updated_at, and no endpoint mutates them; the surrounding Course/ComplianceCycle rows do carry version."
        test_recipe:
          setup:
            - "One ACCREDITED provider with a two-allocation course, one attorney with an open cycle carrying one affirmation, and one sweep row."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Cedar Hill CLE", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Ethics And Technology Update", delivery_format: "LIVE_WEBCAST", total_minutes: 180, presented_at: "2026-02-02T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "ETHICS", minutes: 120 }, { category: "TECHNOLOGY", minutes: 60 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { crs_id: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1030", full_name: "Lena Osei", admission_date: "2009-06-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/compliance-cycles/${cyc_id}/affirmations"
              payload: { affirmation_type: "FINAL_COMPLIANCE_AFFIRMATION", statement: "I affirm the credits reported for this compliance period are accurate." }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { aff_id: $.data.id }
            - call: "POST /cle/reporting-sweeps"
              payload: {}
              as: BoardAdmin
              captures: { sweep_id: $.data.id }
          trigger:
            - call: "GET /cle/courses/${crs_id}/credit-allocations"
              as: BoardAdmin
            - call: "GET /cle/compliance-cycles/${cyc_id}/affirmations"
              as: BoardAdmin
          assert:
            - "The credit-allocations response has total_count == 2 and every item exposes id, course_id, category, minutes, created_at and NO version and NO updated_at key"
            - "The affirmations response has total_count == 1, items[0].id == ${aff_id}, items[0].affirmed_at == '2026-08-01T00:00:00Z', and the item exposes NO version and NO updated_at key"
            - "Affirmation.${aff_id}.affirming_user_id == ${att_id} and target_credit_record_id is null"
            - "ReportingSweep.${sweep_id} exposes no version and no updated_at key while Course.${crs_id}.version == 1 and ComplianceCycle.${cyc_id}.version is present"
            - "No endpoint in §1.5 accepts a PATCH or DELETE for credit-allocations, affirmations or reporting-sweeps"

      - name: a_course_naming_an_unknown_provider_id_returns_provider_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Course.fields.provider_id
          - validations[priority 35 -> ERR_PROVIDER_NOT_FOUND]
          - errors[ERR_PROVIDER_NOT_FOUND]
          - endpoints[POST /cle/courses]
        distinguishing_aspect: "provider_id is an optional body FK; when supplied it must resolve, and the 404 is raised at priority 35 before the priority-45 shape pass would notice anything else about the payload."
        test_recipe:
          setup:
            - "One real ACCREDITED provider exists; the probe names a different, non-existent id."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Summit CLE Alliance", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
          trigger:
            - call: "POST /cle/courses"
              payload: { title: "Orphan Course", delivery_format: "LIVE_WEBCAST", total_minutes: 90, presented_at: "2026-06-06T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 90 } ], provider_id: "00000000-0000-4000-8000-00000000dead" }
              as: BoardAdmin
              expect_error: ERR_PROVIDER_NOT_FOUND
          assert:
            - "Trigger -> HTTP 404 with error_id == ERR_PROVIDER_NOT_FOUND"
            - "GET /cle/courses?provider_id=${prov_id} returns total_count == 0 and no Course row named 'Orphan Course' exists anywhere"
            - "Provider.${prov_id}.courses_total_count == 0"

      - name: credit_record_body_foreign_keys_are_validated_in_declared_order_not_found
        claim_type: flat_topology_foreign_keys
        grounds:
          - complexity_profile.entity_topology
          - entities.CreditRecord.fields.attorney_id
          - entities.CreditRecord.fields.course_id
          - validations[priority 35 -> ERR_ATTORNEY_NOT_FOUND]
          - errors[ERR_COURSE_NOT_FOUND]
        distinguishing_aspect: "With both body FKs unresolvable the response is ERR_ATTORNEY_NOT_FOUND (the first-declared input), and only once the attorney resolves does the same request surface ERR_COURSE_NOT_FOUND — the checks are ordered, not merged into one generic 404."
        test_recipe:
          setup:
            - "One attorney with an open cycle; no course is created at all."
          setup_api_calls:
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-1040", full_name: "Tomas Ferreira", admission_date: "2007-02-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "00000000-0000-4000-8000-00000000dead", course_id: "00000000-0000-4000-8000-00000000dead", verification_method: "CERTIFICATE", attended_minutes: 60, completion_date: "2026-03-03T12:00:00Z", certificate_reference: "CERT-9001" }
              as: Attorney
              as_user_id: "00000000-0000-4000-8000-00000000dead"
              expect_error: ERR_ATTORNEY_NOT_FOUND
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "00000000-0000-4000-8000-00000000dead", verification_method: "CERTIFICATE", attended_minutes: 60, completion_date: "2026-03-03T12:00:00Z", certificate_reference: "CERT-9001" }
              as: Attorney
              as_user_id: "${att_id}"
              expect_error: ERR_COURSE_NOT_FOUND
          assert:
            - "First trigger -> HTTP 404 with error_id == ERR_ATTORNEY_NOT_FOUND"
            - "Second trigger -> HTTP 404 with error_id == ERR_COURSE_NOT_FOUND"
            - "GET /cle/credit-records?cycle_id=${cyc_id} returns total_count == 0"
            - "ComplianceCycle.${cyc_id}.earned_countable_minutes == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: grant_probationary_starts_the_term_assesses_the_fee_and_forces_individual_approval
        claim_type: valid_transition
        grounds:
          - state_machines.Provider.APPLIED_to_PROBATIONARY
          - state_machines.Course.initial_state
          - domain_constants.ACCREDITATION_TERM_MONTHS
          - entities.Course.fields.approval_pathway
        distinguishing_aspect: "GRANT_PROBATIONARY stamps a 24-month term and raises the PROVIDER_ANNUAL fee exactly like GRANT_FULL, but leaves self_certification_enabled false — so the very next course lands in PENDING_APPROVAL on the INDIVIDUAL_APPROVAL pathway instead of being self-certified."
        test_recipe:
          setup:
            - "One APPLIED provider, clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Probationary Training Co", provider_type: "COMMERCIAL", annual_fee_cents: 80000 }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
          trigger:
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Contract Drafting Intensive", delivery_format: "LIVE_WEBCAST", total_minutes: 120, presented_at: "2026-09-09T09:00:00Z", attendance_verification_method: "ATTENDANCE_CODE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { crs_id: $.data.id }
            - call: "GET /cle/fee-assessments?provider_id=${prov_id}"
              as: BoardAdmin
              captures: { fee_id: "$.data.items[0].id" }
          assert:
            - "Provider.${prov_id}.accreditation_status == 'PROBATIONARY' and version == 2"
            - "Provider.${prov_id}.accreditation_term_start == '2026-08-01T00:00:00Z' and accreditation_term_end == '2028-08-01T00:00:00Z'"
            - "Provider.${prov_id}.self_certification_enabled == false and risk_score_variant == 'REVIEWED_WEIGHTING' and risk_score == 0.0"
            - "FeeAssessment.${fee_id}.fee_type == 'PROVIDER_ANNUAL' and amount_cents == 80000 and status == 'ASSESSED'"
            - "Course.${crs_id}.status == 'PENDING_APPROVAL' and approval_pathway == 'INDIVIDUAL_APPROVAL'"
            - "Provider.${prov_id}.courses_total_count == 1 while courses_self_certified_count == 0"
            - "GET /cle/courses/${crs_id}/applications returns total_count == 0 (creation does not auto-file an application)"

      - name: grant_full_on_a_commercial_applicant_is_refused_by_its_type_precondition
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Provider.APPLIED_to_ACCREDITED
          - validations[priority 55 -> ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "GRANT_FULL is declared from APPLIED, yet its provider_type gate limits presumptive full grants to BAR_ASSOCIATION, LAW_SCHOOL and GOVERNMENT; a COMMERCIAL applicant is refused with the priority-55 catch-all ERR_INVALID_STATE_TRANSITION (§1.6 declares no dedicated error for a failed transition precondition), stays APPLIED at version 1 and gets no fee assessment, while GRANT_PROBATIONARY on the same row succeeds."
        test_recipe:
          setup:
            - "Two APPLIED providers: one COMMERCIAL, one GOVERNMENT, so the refusal is attributable to provider_type and not to the action."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Vendor CLE LLC", provider_type: "COMMERCIAL" }
              as: BoardAdmin
              captures: { com_id: $.data.id, com_v1: $.data.version }
            - call: "POST /cle/providers"
              payload: { name: "State Judicial Institute", provider_type: "GOVERNMENT" }
              as: BoardAdmin
              captures: { gov_id: $.data.id, gov_v1: $.data.version }
          trigger:
            - call: "POST /cle/providers/${com_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${com_v1}" }
              as: BoardAdmin
              expect_error: ERR_INVALID_STATE_TRANSITION
            - call: "POST /cle/providers/${gov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${gov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/providers/${com_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${com_v1}" }
              as: BoardAdmin
          assert:
            - "First trigger -> HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "After the first trigger Provider.${com_id}.accreditation_status == 'APPLIED', version == 1, accreditation_term_start is null, and GET /cle/fee-assessments?provider_id=${com_id} returns total_count == 0"
            - "Second trigger -> HTTP 200: Provider.${gov_id}.accreditation_status == 'ACCREDITED', self_certification_enabled == true, risk_score_variant == 'SELF_CERTIFIED_WEIGHTING'"
            - "Third trigger -> HTTP 200: Provider.${com_id}.accreditation_status == 'PROBATIONARY' and version == 2 (the version-1 token was never consumed by the refused call)"

      - name: a_denied_provider_is_terminal_so_every_later_accreditation_action_is_refused
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Provider.terminal_states
          - state_machines.Provider.APPLIED_to_DENIED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "DENIED is Provider's only terminal state: no transition is declared out of it, so GRANT_FULL, GRANT_PROBATIONARY and RENEW are all refused even when the expected_provider_version is perfectly fresh."
        test_recipe:
          setup:
            - "One APPLIED provider denied at version 1."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Rejected Seminars Inc", provider_type: "COMMERCIAL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "DENY", expected_provider_version: "${prov_v1}", probation_reason: "Curriculum did not meet minimum standards." }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
          trigger:
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_PROBATIONARY", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
              expect_error: ERR_INVALID_STATE_TRANSITION
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "RENEW", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
              expect_error: ERR_INVALID_STATE_TRANSITION
          assert:
            - "Provider.${prov_id}.accreditation_status == 'DENIED' with probation_reason == 'Curriculum did not meet minimum standards.' and version == 2"
            - "Both triggers -> HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "Provider.${prov_id}.version is still 2 after both refusals and GET /cle/fee-assessments?provider_id=${prov_id} returns total_count == 0"

      - name: substantiate_on_a_received_complaint_is_refused_before_open_review
        claim_type: invalid_transitions
        grounds:
          - state_machines.Complaint.RECEIVED_to_UNDER_REVIEW
          - state_machines.Complaint.UNDER_REVIEW_to_SUBSTANTIATED
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "SUBSTANTIATE is declared only from UNDER_REVIEW, so it is refused on a RECEIVED complaint even with a disposition_reason and a segregated actor; after OPEN_REVIEW the identical call succeeds and drives the provider to PROBATIONARY."
        test_recipe:
          setup:
            - "One ACCREDITED provider and one complaint filed against it by board user U_FILER."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Beacon CLE Society", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/complaints"
              payload: { subject_type: "PROVIDER", subject_id: "${prov_id}", allegation: "Sign-in sheets were pre-filled before the session began.", allegation_category: "ATTENDANCE_FRAUD" }
              as: BoardAdmin
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { cmp_id: $.data.id }
          trigger:
            - call: "POST /cle/complaints/${cmp_id}/disposition"
              payload: { action: "SUBSTANTIATE", disposition_reason: "Investigator confirmed the pre-filled sheets." }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_INVALID_STATE_TRANSITION
            - call: "POST /cle/complaints/${cmp_id}/disposition"
              payload: { action: "OPEN_REVIEW" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
            - call: "POST /cle/complaints/${cmp_id}/disposition"
              payload: { action: "SUBSTANTIATE", disposition_reason: "Investigator confirmed the pre-filled sheets." }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
          assert:
            - "First trigger -> HTTP 409 ERR_INVALID_STATE_TRANSITION with Complaint.${cmp_id}.status still 'RECEIVED' and disposition_reason null"
            - "After the first refusal Provider.${prov_id}.accreditation_status is still 'ACCREDITED' and substantiated_complaint_count == 0"
            - "Second trigger -> HTTP 200 with Complaint.${cmp_id}.status == 'UNDER_REVIEW'"
            - "Third trigger -> HTTP 200 with Complaint.${cmp_id}.status == 'SUBSTANTIATED'"
            - "Provider.${prov_id}.substantiated_complaint_count == 1, accreditation_status == 'PROBATIONARY', self_certification_enabled == false, probation_reason references ${cmp_id}"

      - name: a_second_open_review_on_the_same_complaint_is_refused
        claim_type: idempotency
        grounds:
          - state_machines.Complaint.RECEIVED_to_UNDER_REVIEW
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "The same OPEN_REVIEW body replayed is not idempotent: the second call is a 409 because RECEIVED -> UNDER_REVIEW is only declared from RECEIVED, and the complaint is left exactly as the first call made it."
        test_recipe:
          setup:
            - "One fee-dispute complaint against a still-APPLIED provider, opened for review once (no grant, so nothing can cascade and muddy the claim)."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Disputed Fees Institute", provider_type: "COMMERCIAL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /cle/complaints"
              payload: { subject_type: "PROVIDER", subject_id: "${prov_id}", allegation: "The registration fee charged did not match the published schedule.", allegation_category: "FEE_DISPUTE" }
              as: BoardAdmin
              as_user_id: "11111111-1111-4111-8111-111111111111"
              captures: { cmp_id: $.data.id }
            - call: "POST /cle/complaints/${cmp_id}/disposition"
              payload: { action: "OPEN_REVIEW" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
          trigger:
            - call: "POST /cle/complaints/${cmp_id}/disposition"
              payload: { action: "OPEN_REVIEW" }
              as: BoardAdmin
              as_user_id: "22222222-2222-4222-8222-222222222222"
              expect_error: ERR_INVALID_STATE_TRANSITION
          assert:
            - "Trigger -> HTTP 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "Complaint.${cmp_id}.status == 'UNDER_REVIEW' and escalated == false"
            - "A DISMISS with a disposition_reason from the same non-complainant user afterwards returns HTTP 200 and moves the complaint to 'DISMISSED'"

      - name: provider_suspension_cascades_only_into_self_certified_courses_still_inside_their_window
        claim_type: conditional_cascade
        grounds:
          - state_machines.Provider.ACCREDITED_to_SUSPENDED
          - state_machines.Course.APPROVED_to_SUSPENDED_PENDING_REVIEW
          - state_machines.CreditRecord.PENDING_VERIFICATION_to_REJECTED
          - entities.Course.fields.expires_at
        distinguishing_aspect: "The suspension cascade is guarded by TWO conditions at once — approval_pathway == PROVIDER_ACCREDITED and expires_at > clock_now — so a sibling course whose 36-month self-study window already closed keeps status APPROVED while the in-window on-demand course is suspended and its PENDING_VERIFICATION credit record is rejected with void_reason SPONSOR_NOT_IN_GOOD_STANDING."
        test_recipe:
          setup:
            - "ACCREDITED provider with course CA (ON_DEMAND, presented 2026-05-05, expires 2029-05-05, in window) and course CB (SELF_STUDY, presented 2023-01-01, expires 2026-01-01, window already closed but still APPROVED because no sweep has run)."
            - "One attorney with an open 2026-2028 cycle and a PENDING_VERIFICATION certificate record on CA."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Highpoint CLE Trust", provider_type: "BAR_ASSOCIATION" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
              captures: { prov_v2: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "On Demand Evidence Review", delivery_format: "ON_DEMAND", total_minutes: 300, presented_at: "2026-05-05T00:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 300 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Archived Self Study Packet", delivery_format: "SELF_STUDY", total_minutes: 240, presented_at: "2023-01-01T00:00:00Z", attendance_verification_method: "AFFIRMATION_ONLY", credit_allocations: [ { category: "GENERAL", minutes: 240 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { cb_id: $.data.id }
            - call: "POST /cle/attorneys"
              payload: { bar_number: "BAR-2010", full_name: "Ines Duarte", admission_date: "2006-03-01T00:00:00Z", compliance_group: "GROUP_1", principal_office_jurisdiction: "ST" }
              as: BoardAdmin
              captures: { att_id: $.data.id }
            - call: "POST /cle/attorneys/${att_id}/compliance-cycles"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2028-01-01T00:00:00Z" }
              as: BoardAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /cle/credit-records"
              payload: { attorney_id: "${att_id}", course_id: "${ca_id}", verification_method: "CERTIFICATE", attended_minutes: 300, completion_date: "2026-06-06T00:00:00Z", certificate_reference: "CERT-3001" }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "SUSPEND", expected_provider_version: "${prov_v2}" }
              as: BoardAdmin
              captures: { prov_v3: $.data.version }
          assert:
            - "Provider.${prov_id}.accreditation_status == 'SUSPENDED', self_certification_enabled == false, risk_score_variant == 'REVIEWED_WEIGHTING', risk_score == 0.0, version == 3"
            - "Course.${ca_id}.status == 'SUSPENDED_PENDING_REVIEW' (PROVIDER_ACCREDITED and expires_at 2029-05-05 > clock)"
            - "Course.${cb_id}.status is STILL 'APPROVED' because its expires_at 2026-01-01 is already at or before the clock, so the cascade skipped it"
            - "CreditRecord.${rec_id}.status == 'REJECTED' with void_reason == 'SPONSOR_NOT_IN_GOOD_STANDING' and countable_minutes == 0"
            - "ComplianceCycle.${cyc_id}.earned_countable_minutes == 0 (the rejected record left the PROVISIONAL input set)"
            - "Provider.${prov_id}.courses_total_count == 2 and courses_self_certified_count == 2 (counters are status-independent)"

      - name: provider_reinstatement_restores_the_course_but_never_the_rejected_credit_record
        claim_type: compensation
        grounds:
          - state_machines.Provider.SUSPENDED_to_PROBATIONARY
          - state_machines.Course.SUSPENDED_PENDING_REVIEW_to_APPROVED
          - errors[ERR_DUPLICATE_CREDIT_RECORD]
          - endpoints[POST /cle/credit-records]
        distinguishing_aspect: "REINSTATE is a partial compensation by design: the suspended course returns to APPROVED but the credit record rejected by the suspension stays REJECTED, and because REJECTED is terminal the attorney may re-file the same (attorney, course) pair without hitting ERR_DUPLICATE_CREDIT_RECORD."
        test_recipe:
          setup:
            - "The suspension state of the previous instance: ACCREDITED provider suspended at version 3, its in-window ON_DEMAND course SUSPENDED_PENDING_REVIEW, one REJECTED credit record."
          setup_api_calls:
