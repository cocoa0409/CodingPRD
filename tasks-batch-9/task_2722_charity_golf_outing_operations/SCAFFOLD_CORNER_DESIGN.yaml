            - call: "POST /outing-ops/outings"
              payload: { name: "Naive Timestamp", beneficiary_name: "Northside Youth Fund", format: "SCRAMBLE", start_format: "TEE_TIME", scheduled_date: "2026-09-19T12:00:00", wave_a_start: "2026-09-19T12:00:00Z", wave_a_end: "2026-09-19T16:30:00Z", field_capacity_teams: 4, prize_pool_cents: 0 }
