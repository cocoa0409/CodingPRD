        distinguishing_aspect: "GET /api/visitors with 3 rows: default limit 10 returns all with has_more false; limit=2 returns 2 with has_more true and total_count 3; offset 2 returns the last row."
        test_recipe:
          setup: ["three visitors registered"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T09:00:00Z" }, as: Coordinator }
            - { call: "POST /api/visitors", payload: { full_name: "V One", email: "v1@x.com" }, as: IntakeVolunteer, captures: { v1: $.data.id } }
            - { call: "POST /api/visitors", payload: { full_name: "V Two", email: "v2@x.com" }, as: IntakeVolunteer, captures: { v2: $.data.id } }
            - { call: "POST /api/visitors", payload: { full_name: "V Three", email: "v3@x.com" }, as: IntakeVolunteer, captures: { v3: $.data.id } }
          trigger:
            - { call: "GET /api/visitors", as: Coordinator }
            - { call: "GET /api/visitors?limit=2", as: Coordinator }
            - { call: "GET /api/visitors?limit=2&offset=2", as: Coordinator }
