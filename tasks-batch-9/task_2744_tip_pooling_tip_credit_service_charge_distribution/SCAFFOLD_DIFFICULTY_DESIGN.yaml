            - "hop 1: ShiftTipPool.${pool_id}.contribution_status == REVERSED and distribution_status == REVERSED with reversed_at 2026-08-10T12:00:00Z, and total_contributed_cents, cc_fee_deducted_cents, net_pool_cents and distributed_cents are all 0"
            - "hop 2: GET /pool-allocations?shift_tip_pool_id=${pool_id} returns six rows, three DISTRIBUTION rows still carrying 2508, 2005 and 940 unmutated plus three REVERSAL rows carrying -2508, -2005 and -940"
            - "hop 3: every one of the three shifts has shift_tip_pool_id null and pool_contribution_cents 0, and retained_tips_cents is restored to 34020, 14020 and 0"
            - "hop 4: PayPeriod.${period_id}.status == OPEN with compute_variant null, computed_by_user_id null, total_tip_credit_cents 0 and total_topup_cents 0, and every PayLine of the period has status SUPERSEDED"
            - "hop 5: Location.${loc_id}.pending_pool_cents == 0, and PayPeriod.${period_id}.total_credited_minutes == 1320 and gross_receipts_cents == 180000 recomputed from the three surviving CLOSED shifts"
            - "the three shifts remain time_status CLOSED and declaration_status DECLARED throughout: a pool reversal unwinds money, not timekeeping"

      - name: dispute_adjudication_cascade_supersedes_prior_correction
        grounds:
          - state_machines.Dispute.OPEN_to_UPHELD
          - state_machines.BackWageCorrection.PENDING_to_VOIDED
          - calculations.dispute_adjudication_amount
          - concurrency_rules.correction-create-stale-pay-line
          - entities.BackWageCorrection.fields.supersedes_correction_id
          - entities.PayLine.fields.pending_correction_cents
          - entities.PayPeriod.fields.total_correction_cents
        distinguishing_aspect: >-
          A second, deeper cascade that is not about pools at all: adjudicating a dispute must reach
          sideways into an unrelated audit-issued correction on the same PayLine, void it, point the
          new correction at it through supersedes_correction_id, and leave the line's
          pending_correction_cents at the new 1500 rather than the naive 2500 sum. The rollup two
          levels up, PayPeriod.total_correction_cents, has to agree, and the PayLine version must
          have advanced exactly twice since approval.
        test_recipe:
          setup:
            - "The Texas wage world computed by op_prep_1 and approved by op_comp_1, so the PayLine is FINAL at version 2 with total_gross_cents 7004."
            - "A compliance audit has already issued a PENDING 1000-cent SIDE_WORK_OVERAGE correction against that line using the line's version 2 as the OCC token."
            - "The employee has separately raised an OPEN dispute claiming 1500 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T12:00:00Z" }
              as: PayrollAdmin
            - call: "POST /locations"
              payload: { name: "Dallas Unit", state_code: "TX", state_min_wage_cents: 725, cash_wage_cents: 213, tip_credit_enabled: true, cc_fee_policy: "ACTUAL_ONLY", service_charge_treatment: "WAGES" }
              as: PayrollAdmin
              captures: { loc_id: $.data.id }
            - call: "POST /job-roles"
