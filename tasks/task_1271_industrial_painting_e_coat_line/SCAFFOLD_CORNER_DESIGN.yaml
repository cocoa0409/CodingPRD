        grounds: [calculations.color_change_window_conflict, "errors[ERR_COLOR_CHANGE_CONFLICT]"]
        distinguishing_aspect: "The 30-minute post-purge buffer is part of the interval arithmetic: a slot starting exactly at window_end + 30 min is ALLOWED, while one starting 10 minutes inside the buffer is rejected ERR_COLOR_CHANGE_CONFLICT."
        test_recipe:
          setup: ["master data; lots LA, LB QUEUED; slot A 05-05 09:00-10:00 and slot B 05-05 12:00-13:00 scheduled; permit cap 500.0"]
          setup_api_calls:
