            The §1.8 instance reads the projection endpoint and asserts every field it
            returns (projected_total_minutes, confirmed_only_total_minutes,
            projected_drift_minutes and the per-class breakdown) against hand-computed
            figures, which is the computed-read claim for this endpoint.

      - name: standings_computed_read
        claim_type: computed_read
        grounds:
          - endpoints.GET_/riders/{id}/standings
        excluded_because:
          difficulty_instance: rider_standings_national_scale_vs_regional_scale
          rationale: |
            That instance reads the standings endpoint for two riders and asserts
            national_points_total, regional_points_total, national_class_count and
            regional_capped against the two variant scales, covering the computed read.

      - name: point_eligibility_conditional_action
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/classes/{id}/point-submissions
          - validations.priority_58
        excluded_because:
          difficulty_instance: point_submission_min_entries_boundary
          rationale: |
            The §1.8 instance probes the submission action at confirmed_entry_count
            MIN_ENTRIES_FOR_POINTS - 1 (rejected with ERR_CLASS_NOT_POINT_ELIGIBLE) and
            at the threshold (accepted), which is exactly the conditional-action claim
            for this endpoint.

  - section: errors
