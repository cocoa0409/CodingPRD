      - name: stale_service_night_version_on_route_create_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[route-create-stale-service-night]
          - errors[ERR_STALE_SERVICE_NIGHT_VERSION]
          - validations[priority=10]
        distinguishing_aspect: "The dispatcher plans against version ${n1_v}, another route create bumps the night, and the second create replaying ${n1_v} for a non-overlapping range 103-104 is rejected with HTTP 412 ERR_STALE_SERVICE_NIGHT_VERSION — the range is free, only the observed version is stale."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4 with an ACTIVE contract and two onboarded, classified contractors"
            - "Night 2026-09-01 whose version is captured at creation, then bumped by a first route over 101-102"
