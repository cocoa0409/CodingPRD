  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: erroneous_event_void_cascades_five_levels_from_event_to_railroad_exposure
        grounds:
          - state_machines.CorrectionRequest.CONFIRMED_to_APPLIED
          - state_machines.InterchangeEvent.RECORDED_to_VOID
          - state_machines.ReclaimClaim.ALLOWED_to_DISALLOWED
          - state_machines.SettlementCycle.SETTLED_to_REOPENED
          - calculations.hire_time_component
          - calculations.reclaim_credit_amount
          - calculations.settlement_statement
          - calculations.per_diem_exposure
          - entities.CarHireMovement.fields.bad_order_from
          - entities.HireLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          One POST .../apply on an ERRONEOUS_EVENT_VOID correction propagates through
          five distinct entity kinds: L1 the InterchangeEvent becomes VOID, L2 the
          movement's bad_order_from/bad_order_to are cleared, L3 the movement's money is
          recomputed (reclaim_credit_cents 2843 -> 0, net_hire_cents 8621 -> 11464),
          L4 the ALLOWED ReclaimClaim is force-DISALLOWED with disallow_reason
          'SUPPORTING_EVENT_VOIDED', L5 the already-SETTLED cycle is driven to REOPENED,
          re-nets to 11464 with a re-tiered fee of 57, and BN's per-diem exposure moves
          to 11464. Stopping at any earlier level leaves a detectable inconsistency,
          which the assertions pin one level at a time. The other transitive_cascade
          instance starts from an interchange event instead of a correction and ends in
          a routing-obligation penalty, so the two chains share no intermediate node.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI."
            - "CX-owned car CX 100010 is delivered to BN at 2026-08-24T00:00:00Z (odometer 1000)."
            - "At 2026-08-25T00:00:00Z BN records an INTERCHANGE_REJECTION (CX refused the bad-ordered car back), which stamps bad_order_from on BN's segment; BN releases the car to service at 2026-08-26T00:00:00Z, giving exactly 24.00 bad-order hours."
            - "At 2026-08-28T00:00:00Z the car is delivered back to CX at odometer 1240, closing BN's 96.00-hour segment (chargeable 92.00, 4 days, time 10900, mileage 564, gross 11464)."
            - "BN files a BAD_ORDER reclaim for [2026-08-25T00:00:00Z, 2026-08-26T00:00:00Z) and CX allows it, crediting 2843 and netting the movement to 8621."
            - "The 2026-08 cycle (payer BN, payee CX) is computed, exchanged and settled at 2026-09-01T00:00:00Z with pre_fee_net 8621, fee 43 and net 8578."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100010", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-24T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-24T00:00:00Z", odometer_miles: 1000, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
