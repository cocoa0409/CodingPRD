  - section: cross_cutting_complexity_layers
    instances:

      - name: resort_version_increments_on_every_capacity_write
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[day-pass-create-stale-resort]", "entities.Resort.fields.version"]
        distinguishing_aspect: "Each committed day-pass sale advances Resort.version by exactly one, which is what makes a stale carry deterministically rejectable."
        test_recipe:
          setup: ["One Resort with day_pass_cap_units 20"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Manteca", park_capacity_occupancy_units: 20, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 250 }
              as: platform_ops
              captures: { rl1_id: "$.data.id", rl1_v0: "$.data.version" }
            - call: "POST /resorts/${rl1_id}/day-passes"
              payload: { service_date: "2026-09-03", units_requested: 2, expected_resort_version: "${rl1_v0}" }
              as: FrontDesk
          trigger:
            - call: "GET /resorts/${rl1_id}"
              payload: {}
              as: platform_ops
              captures: { rl1_v1: "$.data.version" }
          assert:
            - "Resort.${rl1_id}.version == 2"
            - "Resort.${rl1_id}.version != ${rl1_v0}"

      - name: activation_after_revoke_denies_access_and_drops_units
        claim_type: cascading_side_effects
        grounds: ["state_machines.Wristband.transitions.ACTIVE_to_REVOKED", "calculations.room_units_reserved"]
        distinguishing_aspect: "Revoking an active band flips room charging off, drops arcade ceiling to zero, and removes the band's reserved units from its service date."
        test_recipe:
          setup: ["One Resort with a checked-in 2-guest booking and an active guest band"]
          setup_api_calls:
            - call: "POST /resorts"
              payload: { name: "Grapevine", park_capacity_occupancy_units: 20, day_pass_cap_units: 10, arcade_credit_rate_cents_per_unit: 300 }
              as: platform_ops
              captures: { rl2_id: "$.data.id" }
            - call: "POST /resorts/${rl2_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T09:00:00Z" }
              as: platform_ops
            - call: "POST /resorts/${rl2_id}/room-types"
              payload: { code: "WOLF", max_occupancy: 8, base_rate_cents: 18900, is_cabana: false }
              as: platform_ops
              captures: { rtl2_id: "$.data.id" }
            - call: "POST /resorts/${rl2_id}/reservations"
              payload: { room_type_id: "${rtl2_id}", guest_count: 2, arrival_date: "2026-09-03", departure_date: "2026-09-05" }
              as: FrontDesk
              captures: { resl2_id: "$.data.id" }
            - call: "POST /resorts/${rl2_id}/reservations/${resl2_id}/check_in"
              payload: {}
              as: FrontDesk
            - call: "POST /resorts/${rl2_id}/wristbands"
              payload: { holder_type: "RESERVATION_GUEST", owner_name: "Ines", reservation_id: "${resl2_id}" }
              as: FrontDesk
              captures: { wbl2_id: "$.data.id" }
            - call: "POST /resorts/${rl2_id}/wristbands/${wbl2_id}/activate"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /resorts/${rl2_id}/wristbands/${wbl2_id}/revoke"
              payload: {}
              as: FrontDesk
          assert:
            - "Wristband.${wbl2_id}.wristband_status == REVOKED"
            - "Wristband.${wbl2_id}.room_charge_enabled == false"
            - "Wristband.${wbl2_id}.arcade_credit_limit_cents == 0"

      - name: arcade_rate_threshold_holds_the_result_staircase
        claim_type: rate_threshold_triggers
        grounds: ["calculations.day_pass_price"]
        distinguishing_aspect: "The volume block only advances on a complete block, so the price staircase is tested at the block boundary and one unit past it."
