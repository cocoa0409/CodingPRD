# =============================================================================
# §1.9 Scaffold Corner Design — Breadth Walk
# Task 2888 — Tourism Improvement District Administration
#
# Walk of references/claim-extraction-guide.md's nine sections against this
# scaffold's §1.1–§1.7. Real instances carry a full test_recipe; corners already
# asserted by a §1.8 instance are emitted as excluded_because: stubs naming that
# instance. Every numeric literal in an `assert:` line was produced by executing
# the relevant §1.3 formula with Decimal ROUND_HALF_UP; none are estimates.
#
# Canonical fixture (anchors &c_* defined at first use, aliased thereafter):
#   clock 2026-08-01T00:00:00Z
#   District "Harbor Bay Tourism Improvement District" (PCT_OF_ROOM_REVENUE)
#     zones [ZONE_CORE, ZONE_PERIMETER], formation 0.6000, renewal 0.6500 /
#     headcount 0.7500, term_years 1, current_fiscal_year 2027
#     formed_on 2026-08-01 -> expiration_date 2027-08-01
#   Roll (prior-year room revenue sums to exactly 100,000,000 cents):
#     b1 Harbor Grand Hotel     ZONE_CORE      FULL_SERVICE       200 rooms  60,000,000
#     b2 Bayside Inn            ZONE_CORE      LIMITED_SERVICE    120 rooms  20,000,000
#     b3 Lighthouse Boutique    ZONE_PERIMETER BOUTIQUE            60 rooms  15,000,000
#     b4 Cove Cottages          ZONE_PERIMETER SHORT_TERM_RENTAL   40 rooms   5,000,000
#   Period FY2027-Q1 [2026-08-01, 2026-11-01), due 2026-11-15, grace 10 days
#     -> grace deadline 2026-11-25T00:00:00Z (strict: sweep needs clock > this)
#   st1 filed 2000 nights / 41,225,000 cents -> 824,500
#   st2 filed  600 nights / 20,000,000 cents -> 340,000
#   Plan FY2027 total 1,000,000 (SM 650,000 / ADMIN 150,000 / CONT 100,000 /
#     EVENTS 100,000); FY2027 forecast 1,164,500 -> funding_ratio 1.1645
#
# Second and third fixtures, used by the calculation-branch corners:
#   &c2_* district "Cove Reach" assessment_method PER_OCCUPIED_ROOM_NIGHT
#   &c3_* district "Summit Ridge" assessment_method TIERED_BY_CLASSIFICATION
#   ${x_*} district "Lien Ridge", built inline by the rate-threshold instance of
#         the cross-cutting section — roll tuned so two swept statements straddle
#         the 1,000,000-cent LIEN_REFERRAL_THRESHOLD_CENTS boundary
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — Entities (claim-extraction-guide Table 1)
  # ===========================================================================
  - section: entities
    instances:

      - name: district_creation_applies_every_declared_default
        claim_type: defaults
        grounds:
          - entities.District.fields.assessment_method
          - entities.District.fields.included_zones
          - entities.District.fields.formation_threshold_pct
          - entities.District.fields.renewal_threshold_pct
          - entities.District.fields.renewal_headcount_threshold_pct
          - entities.District.fields.term_years
          - entities.District.fields.current_fiscal_year
          - entities.District.fields.status
          - endpoints.POST_/districts
        distinguishing_aspect: |
          A district created with `name` alone comes back with every optional input at its
          declared default — PCT_OF_ROOM_REVENUE, [ZONE_CORE, ZONE_PERIMETER], 0.6000 / 0.6500 /
          0.5000, term_years 5, current_fiscal_year 2027 — and with renewal_headcount_threshold_pct
          at 0.5000 rather than the 0.7500 the canonical fixture passes explicitly.
        test_recipe:
          setup:
            - "empty database, logical clock pinned to 2026-08-01T00:00:00Z"
          setup_api_calls:
            - &c_clock_form
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "POST /districts"
              payload: { name: "Default Bay Tourism Improvement District" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { dflt_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "District.${dflt_id}.assessment_method == PCT_OF_ROOM_REVENUE"
            - "District.${dflt_id}.included_zones == [ZONE_CORE, ZONE_PERIMETER]"
            - "District.${dflt_id}.formation_threshold_pct == 0.6000"
            - "District.${dflt_id}.renewal_threshold_pct == 0.6500"
            - "District.${dflt_id}.renewal_headcount_threshold_pct == 0.5000"
            - "District.${dflt_id}.term_years == 5"
            - "District.${dflt_id}.current_fiscal_year == 2027"
            - "District.${dflt_id}.status == PROPOSED"
            - "District.${dflt_id}.transparency_standing == COMPLIANT"
            - "District.${dflt_id}.dmo_agreement_status == NONE"
            - "District.${dflt_id}.dmo_name == null and District.${dflt_id}.formed_on == null and District.${dflt_id}.expiration_date == null"
            - "District.${dflt_id}.collected_to_date_cents == 0 and delinquent_charges_cents == 0 and assessable_basis_cents == 0 and assessable_business_count == 0"
            - "District.${dflt_id}.version == 1"

      - name: lodging_business_creation_defaults_and_rolls_up_the_district_totals
        claim_type: creation
        grounds:
          - entities.LodgingBusiness.fields.exempt_status
          - entities.LodgingBusiness.fields.remittance_frequency
          - entities.LodgingBusiness.fields.status
          - entities.LodgingBusiness.fields.compliance_standing
          - entities.District.fields.assessable_basis_cents
          - entities.District.fields.assessable_business_count
          - endpoints.POST_/lodging-businesses
        distinguishing_aspect: |
          Each of the four canonical properties is created with all six required inputs and no
          optional ones, so every row lands ASSESSABLE / exempt_status NONE / MONTHLY /
          compliance_standing GOOD, and the district's computed roll ends at exactly
          assessable_basis_cents 100000000 and assessable_business_count 4.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z"
            - "canonical district created, still PROPOSED"
          setup_api_calls:
            - *c_clock_form
            - &c_district
              call: "POST /districts"
              payload: { name: "Harbor Bay Tourism Improvement District", assessment_method: "PCT_OF_ROOM_REVENUE", included_zones: ["ZONE_CORE", "ZONE_PERIMETER"], formation_threshold_pct: 0.6000, renewal_threshold_pct: 0.6500, renewal_headcount_threshold_pct: 0.7500, term_years: 1, current_fiscal_year: 2027 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { d_id: "$.data.id" }
          trigger:
            - &c_b1
              call: "POST /lodging-businesses"
              payload: { district_id: "${d_id}", legal_name: "Harbor Grand Hotel", boundary_zone: "ZONE_CORE", classification: "FULL_SERVICE", room_count: 200, prior_year_gross_room_revenue_cents: 60000000, operator_contact_email: "ops@harborgrand.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { b1_id: "$.data.id" }
            - &c_b2
              call: "POST /lodging-businesses"
              payload: { district_id: "${d_id}", legal_name: "Bayside Inn", boundary_zone: "ZONE_CORE", classification: "LIMITED_SERVICE", room_count: 120, prior_year_gross_room_revenue_cents: 20000000, operator_contact_email: "ops@baysideinn.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { b2_id: "$.data.id" }
            - &c_b3
              call: "POST /lodging-businesses"
              payload: { district_id: "${d_id}", legal_name: "Lighthouse Boutique", boundary_zone: "ZONE_PERIMETER", classification: "BOUTIQUE", room_count: 60, prior_year_gross_room_revenue_cents: 15000000, operator_contact_email: "ops@lighthouse.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { b3_id: "$.data.id" }
            - &c_b4
              call: "POST /lodging-businesses"
              payload: { district_id: "${d_id}", legal_name: "Cove Cottages", boundary_zone: "ZONE_PERIMETER", classification: "SHORT_TERM_RENTAL", room_count: 40, prior_year_gross_room_revenue_cents: 5000000, operator_contact_email: "ops@covecottages.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { b4_id: "$.data.id" }
            - call: "GET /districts/${d_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "each of the four create responses has status 201"
            - "LodgingBusiness.${b4_id}.status == ASSESSABLE"
            - "LodgingBusiness.${b4_id}.exempt_status == NONE"
            - "LodgingBusiness.${b4_id}.remittance_frequency == MONTHLY"
            - "LodgingBusiness.${b4_id}.delinquency_strike_count == 0"
            - "LodgingBusiness.${b4_id}.compliance_standing == GOOD"
            - "LodgingBusiness.${b4_id}.version == 1"
            - "District.${d_id}.assessable_basis_cents == 100000000"
            - "District.${d_id}.assessable_business_count == 4"

      - name: public_district_retrieval_returns_the_stored_row_with_no_headers
        claim_type: retrieval
        grounds:
          - endpoints.GET_/districts/{id}
          - roles.PublicViewer
          - validations.priority_10_ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          GET /districts/{id} is one of the ten header-free public reads named in the priority-10
          auth rule, so a request carrying no X-User-Role and no X-User-ID still returns 200 with
          the stored name, assessment_method and included_zones rather than ERR_UNAUTHENTICATED.
        test_recipe:
          setup:
            - "canonical district created with the four-property roll"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
          trigger:
            - call: "GET /districts/${d_id}"
              payload: {}
              as: PublicViewer
          assert:
            - "the response status is 200 and no ERR_UNAUTHENTICATED is returned"
            - "District.${d_id}.name == Harbor Bay Tourism Improvement District"
            - "District.${d_id}.assessment_method == PCT_OF_ROOM_REVENUE"
            - "District.${d_id}.included_zones == [ZONE_CORE, ZONE_PERIMETER]"
            - "District.${d_id}.formation_threshold_pct == 0.6000"
            - "District.${d_id}.term_years == 1"
            - "District.${d_id}.status == PROPOSED"
            - "the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: lodging_business_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/districts/{id}/lodging-businesses
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With four properties on the roll, limit 2 / offset 0 returns exactly 2 rows with
          total_count 4 and has_more true, while limit 2 / offset 2 returns the remaining 2 rows
          with has_more false, and a boundary_zone filter of ZONE_PERIMETER narrows total_count
          to 2 without changing the declared limit default of 10.
        test_recipe:
          setup:
            - "canonical district created with the four-property roll, created in b1, b2, b3, b4 order"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
          trigger:
            - call: "GET /districts/${d_id}/lodging-businesses"
              payload: { limit: 2, offset: 0 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/lodging-businesses"
              payload: { limit: 2, offset: 2 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { page2_first_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/lodging-businesses"
              payload: { boundary_zone: "ZONE_PERIMETER" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { perimeter_first_id: "$.data[0].id" }
          assert:
            - "the limit 2 / offset 0 response carries exactly 2 rows, total_count == 4, limit == 2, offset == 0 and has_more == true"
            - "the limit 2 / offset 2 response carries exactly 2 rows, total_count == 4, offset == 2 and has_more == false"
            - "${page1_first_id} == ${b1_id} and ${page2_first_id} == ${b3_id}"
            - "the boundary_zone ZONE_PERIMETER response carries total_count == 2, limit == 10, offset == 0 and has_more == false"
            - "${perimeter_first_id} == ${b3_id}"
            - "response_type == array on all three responses"

      - name: unknown_assessment_statement_id_returns_not_found
        claim_type: not_found
        grounds:
          - endpoints.GET_/assessment-statements/{id}
          - errors[ERR_ASSESSMENT_STATEMENT_NOT_FOUND]
          - validations.priority_40_existence
        distinguishing_aspect: |
          A well-formed id that names no stored statement returns ERR_ASSESSMENT_STATEMENT_NOT_FOUND
          with HTTP 404 — not 200 with a null payload and not the generic ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "canonical district and roll exist; no assessment statement has ever been generated"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
          trigger:
            - call: "GET /assessment-statements/00000000-0000-4000-8000-00000000dead"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the response status is 404"
            - "data.error_id == ERR_ASSESSMENT_STATEMENT_NOT_FOUND"
            - "response_type == error"

      - name: assessment_filing_missing_the_revenue_field_is_rejected
        claim_type: required_fields
        grounds:
          - endpoints.POST_/assessment-statements/{id}/filings
          - entities.AssessmentStatement.fields.reported_gross_room_revenue_cents
          - validations.priority_30_ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          reported_gross_room_revenue_cents is a non-optional input of the filings endpoint, so a
          filing carrying reported_room_nights alone returns ERR_INVALID_REQUEST with HTTP 400 and
          leaves filing_status at NOT_FILED and provisional_assessment_cents at 0 — the statement is
          not half-filed.
        test_recipe:
          setup:
            - "district ACTIVE with the canonical roll; FY2027-Q1 open; statements generated"
            - "logical clock 2026-08-01T00:00:00Z, inside the filing window"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - &c_drive
              call: "POST /petition-drives"
              payload: { district_id: "${d_id}", drive_type: "FORMATION", closes_at: "2026-09-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { pd_id: "$.data.id" }
            - &c_sign_b1
              call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { sig_b1_id: "$.data.id" }
            - &c_tally
              call: "POST /petition-drives/${pd_id}/tally"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &c_certify
              call: "POST /petition-drives/${pd_id}/certification"
              payload: { certified_on: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &c_activate
              call: "POST /districts/${d_id}/lifecycle-advances"
              payload: { to_status: "ACTIVE", effective_on: "2026-08-01T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - &c_period_q1
              call: "POST /assessment-periods"
              payload: { district_id: "${d_id}", period_label: "FY2027-Q1", period_start: "2026-08-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_date: "2026-11-15T00:00:00Z", grace_days: 10 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { ap_id: "$.data.id" }
            - &c_generate_q1
              call: "POST /assessment-periods/${ap_id}/statement-generation"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { gen_count: "$.data.generated_count" }
            - &c_find_st1
              call: "GET /assessment-periods/${ap_id}/statements"
              payload: { lodging_business_id: "${b1_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st1_id: "$.data[0].id" }
          trigger:
            - call: "POST /assessment-statements/${st1_id}/filings"
              payload: { reported_room_nights: 2000 }
              as: LodgingOperator
              as_user_id: "${b1_id}"
          assert:
            - "the response status is 400"
            - "data.error_id == ERR_INVALID_REQUEST"
            - "AssessmentStatement.${st1_id}.filing_status == NOT_FILED"
            - "AssessmentStatement.${st1_id}.reported_room_nights == null"
            - "AssessmentStatement.${st1_id}.provisional_assessment_cents == 0"
            - "AssessmentStatement.${st1_id}.effective_assessment_cents == 0"
            - "AssessmentStatement.${st1_id}.version == 1"

      - name: petition_signature_weight_basis_is_computed_from_the_signer_roll_row
        claim_type: computed_fields
        grounds:
          - entities.PetitionSignature.fields.weight_basis_revenue_cents
          - entities.PetitionSignature.fields.signed_at
          - entities.PetitionSignature.fields.status
          - endpoints.POST_/petition-drives/{id}/signatures
          - calculations.petition_support
        distinguishing_aspect: |
          The signature endpoint accepts lodging_business_id only, yet the stored row carries
          weight_basis_revenue_cents 15000000 copied from b3's prior_year_gross_room_revenue_cents
          and signed_at stamped from the logical clock 2026-08-01T00:00:00Z; the drive's
          signed_basis_cents rises to exactly that figure.
        test_recipe:
          setup:
            - "canonical district with the four-property roll"
            - "FORMATION drive OPEN, window [2026-08-01, 2026-09-01), no signatures yet"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
          trigger:
            - call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b3_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { sig_b3_id: "$.data.id" }
            - call: "GET /petition-drives/${pd_id}"
              payload: {}
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the signature response status is 201"
            - "PetitionSignature.${sig_b3_id}.weight_basis_revenue_cents == 15000000"
            - "PetitionSignature.${sig_b3_id}.signed_at == 2026-08-01T00:00:00Z"
            - "PetitionSignature.${sig_b3_id}.status == VALID"
            - "PetitionSignature.${sig_b3_id}.disqualification_reason == NONE"
            - "PetitionSignature.${sig_b3_id}.petition_drive_id == ${pd_id} and lodging_business_id == ${b3_id}"
            - "PetitionDrive.${pd_id}.signed_basis_cents == 15000000"
            - "PetitionDrive.${pd_id}.valid_signature_count == 1"
            - "PetitionDrive.${pd_id}.weighted_support_pct == 0.1500"

      - name: dispute_creation_stamps_its_system_fields_and_copies_the_business_id
        claim_type: system_fields
        grounds:
          - entities.AssessmentDispute.fields.lodging_business_id
          - entities.AssessmentDispute.fields.filed_on
          - entities.AssessmentDispute.fields.status
          - entities.AssessmentDispute.fields.granted_adjustment_cents
          - entities.AssessmentDispute.fields.appeal_count
          - endpoints.POST_/assessment-disputes
        distinguishing_aspect: |
          The dispute payload names only assessment_statement_id, dispute_type and
          claimed_adjustment_cents, yet the stored row carries lodging_business_id copied from the
          statement, filed_on stamped from the logical clock, status SUBMITTED, appeal_count 0 and
          granted_adjustment_cents 0 — the claimed 82450 is not silently granted.
        test_recipe:
          setup:
            - "district ACTIVE, FY2027-Q1 open, st1 filed 2000 nights / 41,225,000 cents -> 824,500"
            - "logical clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - &c_file_st1
              call: "POST /assessment-statements/${st1_id}/filings"
              payload: { reported_room_nights: 2000, reported_gross_room_revenue_cents: 41225000 }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { st1_v_filed: "$.data.version" }
          trigger:
            - call: "POST /assessment-disputes"
              payload: { assessment_statement_id: "${st1_id}", dispute_type: "CALCULATION_ERROR", claimed_adjustment_cents: 82450, dispute_note: "resort fee should not sit in the revenue basis" }
              as: LodgingOperator
              as_user_id: "${b1_id}"
              captures: { dsp_id: "$.data.id" }
          assert:
            - "the response status is 201"
            - "AssessmentDispute.${dsp_id}.lodging_business_id == ${b1_id}"
            - "AssessmentDispute.${dsp_id}.assessment_statement_id == ${st1_id}"
            - "AssessmentDispute.${dsp_id}.filed_on == 2026-08-01T00:00:00Z"
            - "AssessmentDispute.${dsp_id}.status == SUBMITTED"
            - "AssessmentDispute.${dsp_id}.claimed_adjustment_cents == 82450"
            - "AssessmentDispute.${dsp_id}.granted_adjustment_cents == 0"
            - "AssessmentDispute.${dsp_id}.appeal_count == 0"
            - "AssessmentDispute.${dsp_id}.resolved_by_user_id == null and resolution_note == null"
            - "AssessmentDispute.${dsp_id}.version == 1"
            - "AssessmentStatement.${st1_id}.effective_assessment_cents is still 824500"

      - name: creation_endpoints_reject_undeclared_enums_negative_cents_and_inverted_intervals
        claim_type: type_constraints
        grounds:
          - entities.District.fields.assessment_method
          - entities.District.fields.included_zones
          - entities.LodgingBusiness.fields.prior_year_gross_room_revenue_cents
          - entities.AssessmentPeriod.fields.period_start
          - validations.priority_30_ERR_INVALID_REQUEST
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Four distinct type-constraint violations on three different endpoints each return
          ERR_INVALID_REQUEST with HTTP 400: an assessment_method outside the declared enum, a
          duplicated member in included_zones, a negative prior_year_gross_room_revenue_cents, and
          an assessment period whose period_start equals its period_end.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; canonical district exists"
          setup_api_calls:
            - *c_clock_form
            - *c_district
          trigger:
            - call: "POST /districts"
              payload: { name: "Bad Method District", assessment_method: "FLAT_FEE_PER_ROOM" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /districts"
              payload: { name: "Duplicate Zone District", included_zones: ["ZONE_CORE", "ZONE_CORE"] }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /lodging-businesses"
              payload: { district_id: "${d_id}", legal_name: "Negative Revenue Inn", boundary_zone: "ZONE_CORE", classification: "LIMITED_SERVICE", room_count: 10, prior_year_gross_room_revenue_cents: -1, operator_contact_email: "ops@negative.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
            - call: "POST /assessment-periods"
              payload: { district_id: "${d_id}", period_label: "FY2027-BAD", period_start: "2026-11-01T00:00:00Z", period_end: "2026-11-01T00:00:00Z", due_date: "2026-11-15T00:00:00Z" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "all four responses have status 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no District row named Bad Method District or Duplicate Zone District exists"
            - "District.${d_id}.assessable_business_count == 0, so the negative-revenue property was not created"
            - "GET /districts/${d_id}/assessment-periods returns total_count == 0"

      - name: lodging_business_under_an_unknown_district_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.LodgingBusiness.fields.district_id
          - endpoints.POST_/lodging-businesses
          - errors[ERR_DISTRICT_NOT_FOUND]
          - validations.priority_40_existence
        distinguishing_aspect: |
          district_id is a body foreign key resolved at priority 40, so a property created against
          an id no district holds returns ERR_DISTRICT_NOT_FOUND with HTTP 404 rather than being
          stored as an orphan, and the request never reaches the boundary or roll logic.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T00:00:00Z; no district has been created"
          setup_api_calls:
            - *c_clock_form
          trigger:
            - call: "POST /lodging-businesses"
              payload: { district_id: "00000000-0000-4000-8000-0000000000d0", legal_name: "Orphan Lodge", boundary_zone: "ZONE_CORE", classification: "FULL_SERVICE", room_count: 50, prior_year_gross_room_revenue_cents: 1000000, operator_contact_email: "ops@orphan.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the response status is 404"
            - "data.error_id == ERR_DISTRICT_NOT_FOUND"
            - "GET /districts returns total_count == 0"

      - name: reversal_naming_another_statements_remittance_returns_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints.POST_/assessment-statements/{id}/remittance-reversals
          - errors[ERR_REMITTANCE_NOT_FOUND]
          - entities.Remittance.fields.assessment_statement_id
          - validations.priority_40_existence
        distinguishing_aspect: |
          The reversal endpoint resolves remittance_id against the statement in the path, so a
          remittance that exists but belongs to st2 is not reversible through st1: the call returns
          ERR_REMITTANCE_NOT_FOUND with HTTP 404 and st2's own buckets are left fully intact.
        test_recipe:
          setup:
            - "district ACTIVE, FY2027-Q1 open, st1 filed 824,500 and st2 filed 340,000"
            - "one APPLIED remittance of 300,000 against st2 only"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - *c_sign_b1
            - *c_tally
            - *c_certify
            - *c_activate
            - *c_period_q1
            - *c_generate_q1
            - *c_find_st1
            - *c_file_st1
            - &c_find_st2
              call: "GET /assessment-periods/${ap_id}/statements"
              payload: { lodging_business_id: "${b2_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { st2_id: "$.data[0].id" }
            - &c_file_st2
              call: "POST /assessment-statements/${st2_id}/filings"
              payload: { reported_room_nights: 600, reported_gross_room_revenue_cents: 20000000 }
              as: LodgingOperator
              as_user_id: "${b2_id}"
            - &c_remit_st2
              call: "POST /assessment-statements/${st2_id}/remittances"
              payload: { amount_cents: 300000, received_on: "2026-08-01T00:00:00Z", method: "ACH" }
              as: LodgingOperator
              as_user_id: "${b2_id}"
              captures: { rem_st2_id: "$.data.id" }
          trigger:
            - call: "POST /assessment-statements/${st1_id}/remittance-reversals"
              payload: { remittance_id: "${rem_st2_id}", reversal_reason: "posted against the wrong statement" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the response status is 404"
            - "data.error_id == ERR_REMITTANCE_NOT_FOUND"
            - "Remittance.${rem_st2_id}.status == APPLIED and reversed_on == null"
            - "AssessmentStatement.${st2_id}.principal_paid_cents == 300000 and total_due_cents == 40000"
            - "AssessmentStatement.${st1_id}.principal_paid_cents == 0 and total_due_cents == 824500"
            - "District.${d_id}.collected_to_date_cents == 300000"

      - name: signature_from_a_business_of_another_district_is_rejected
        claim_type: parent_relationships
        grounds:
          - errors[ERR_BUSINESS_OUTSIDE_BOUNDARY]
          - validations.priority_80_ERR_BUSINESS_OUTSIDE_BOUNDARY
          - endpoints.POST_/petition-drives/{id}/signatures
          - entities.LodgingBusiness.fields.district_id
        distinguishing_aspect: |
          The signer is ASSESSABLE and sits in ZONE_CORE, which is inside the target district's
          included_zones, but its district_id names a different district — the cross-district leg of
          the boundary rule alone returns ERR_BUSINESS_OUTSIDE_BOUNDARY with HTTP 409 and leaves the
          drive's signed_basis_cents at 0.
        test_recipe:
          setup:
            - "canonical district with its four-property roll and an OPEN FORMATION drive"
            - "a second district Cliffside with one ZONE_CORE property of its own"
          setup_api_calls:
            - *c_clock_form
            - *c_district
            - *c_b1
            - *c_b2
            - *c_b3
            - *c_b4
            - *c_drive
            - call: "POST /districts"
              payload: { name: "Cliffside Tourism Improvement District", assessment_method: "PCT_OF_ROOM_REVENUE", included_zones: ["ZONE_CORE", "ZONE_PERIMETER"], term_years: 5, current_fiscal_year: 2027 }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { d9_id: "$.data.id" }
            - call: "POST /lodging-businesses"
              payload: { district_id: "${d9_id}", legal_name: "Cliffside Arms Hotel", boundary_zone: "ZONE_CORE", classification: "FULL_SERVICE", room_count: 80, prior_year_gross_room_revenue_cents: 30000000, operator_contact_email: "ops@cliffsidearms.example" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
              captures: { b9_id: "$.data.id" }
          trigger:
            - call: "POST /petition-drives/${pd_id}/signatures"
              payload: { lodging_business_id: "${b9_id}" }
              as: DistrictAdministrator
              as_user_id: "admin-01"
          assert:
            - "the response status is 409"
            - "data.error_id == ERR_BUSINESS_OUTSIDE_BOUNDARY"
            - "LodgingBusiness.${b9_id}.status is still ASSESSABLE and boundary_zone == ZONE_CORE"
            - "PetitionDrive.${pd_id}.valid_signature_count == 0 and signed_basis_cents == 0"
            - "PetitionDrive.${pd_id}.assessable_basis_snapshot_cents == 100000000, so the foreign property never entered the denominator either"

      - name: room_night_claims_join_program_and_property_and_read_back_from_both_sides
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.RoomNightClaim.fields.marketing_program_id
          - entities.RoomNightClaim.fields.lodging_business_id
          - endpoints.GET_/marketing-programs/{id}/room-night-claims
          - endpoints.GET_/lodging-businesses/{id}/room-night-claims
        distinguishing_aspect: |
          RoomNightClaim is a junction row on MarketingProgram x LodgingBusiness, so the single
          claim created against the program is returned by both GET /marketing-programs/{id}/room-night-claims
          and GET /lodging-businesses/{id}/room-night-claims with the same id — neither side owns it
