  - section: validations
    instances:
      - name: request_missing_x_user_id_header_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 1 ERR_MISSING_AUTH_HEADERS]
        distinguishing_aspect: "Priority 1 fires before any lookup: a GET for an existing Partnership with X-Role present but X-User-ID absent returns 401 ERR_MISSING_AUTH_HEADERS rather than 200."
        test_recipe:
          setup:
            - "One DRAFT Partnership exists."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
          trigger:
            - call: "GET /partnerships/${ps_id}"
              as: UniversityProvost
              as_user_id: null
              captures: { e1: $.data.error_id }
          assert:
            - "response status == 401"
            - "${e1} == ERR_MISSING_AUTH_HEADERS"

      - name: request_with_invalid_role_header_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 2 ERR_UNKNOWN_ROLE]
          - rbac.roles
        distinguishing_aspect: "A syntactically present but unrecognised role REGISTRAR is rejected at priority 2 with 401 ERR_UNKNOWN_ROLE, ahead of the priority 3 permission check that would have produced 403."
        test_recipe:
          setup:
            - "One DRAFT Partnership exists."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
          trigger:
            - call: "GET /partnerships/${ps_id}"
              as: REGISTRAR
              as_user_id: "someone-1"
              captures: { e2: $.data.error_id }
          assert:
            - "response status == 401"
            - "${e2} == ERR_UNKNOWN_ROLE"

      - name: statement_approved_by_its_own_authoring_user_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 16 ERR_SEGREGATION_OF_DUTIES]
          - state_machines.RemittanceStatement.CALCULATED_to_UNIVERSITY_APPROVED
        distinguishing_aspect: "Segregation of duties is enforced on the identity, not the role: the September statement was authored under X-User-ID bursar-1, so an APPROVE carrying the permitted UniversityProvost role but the same X-User-ID bursar-1 is refused with 409 ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup:
            - "A CALCULATED September statement authored by X-User-ID bursar-1 (net_payable_cents 73919)."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
            - *k_enroll
            - *k_clock_sep5
            - *k_pay_full
            - *k_spend_300k
            - *k_clock_oct1
            - *k_get_ps_v
            - *k_stmt_sept
          trigger:
            - call: "POST /remittance-statements/${st_id}/actions"
              payload: { action: "APPROVE" }
              as: UniversityProvost
              as_user_id: "bursar-1"
              captures: { e3: $.data.error_id }
          assert:
            - "response status == 409"
            - "${e3} == ERR_SEGREGATION_OF_DUTIES"
            - "RemittanceStatement.${st_id}.status == CALCULATED"
            - "RemittanceStatement.${st_id}.approved_by_user_id == null"

      - name: second_compliance_review_by_the_same_auditor_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 16 ERR_SEGREGATION_OF_DUTIES]
          - entities.EnrollmentCounselor.fields.last_review_user_id
        distinguishing_aspect: "The second arm of the same rule guards counselor reviews: auditor-1 already approved the plan and is recorded in last_review_user_id, so the ELIGIBLE-to-SUSPENDED edge — otherwise a legal transition — is refused when auditor-1 attempts it again."
        test_recipe:
          setup:
            - "Counselor Rosa Vento with a SALARY_PLUS_QUALITATIVE plan already APPROVEd by auditor-1, so incentive_eligibility is ELIGIBLE and last_review_user_id is auditor-1."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_co_create
            - *k_co_plan
            - *k_co_review
          trigger:
            - call: "POST /enrollment-counselors/${co_id}/compliance-review"
              payload: { decision: "SUSPEND", reviewer_note: "Follow-up spot check." }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { e4: $.data.error_id }
          assert:
            - "response status == 409"
            - "${e4} == ERR_SEGREGATION_OF_DUTIES"
            - "EnrollmentCounselor.${co_id}.incentive_eligibility == ELIGIBLE"
            - "EnrollmentCounselor.${co_id}.last_review_user_id == 'auditor-1'"

      - name: teach_out_certification_with_short_notice_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 30 ERR_TEACH_OUT_NOTICE_TOO_SHORT]
          - calculations.teach_out_obligation_liability.constants
        distinguishing_aspect: "The 90-day notice floor is checked at certification, not at drafting: a plan notifying students on 2026-09-05 for a 2026-10-01 end date is stored, then refused at certify because only 26 whole days separate the two dates."
        test_recipe:
          setup:
            - "LAUNCHED Program moved to TEACH_OUT with no enrollments, and a DRAFT TeachOutPlan whose notice period is 26 days."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_pg_begin_teach_out
            - &k_plan_short_notice
              call: "POST /programs/${pg_id}/teach-out-plans"
              payload: { teach_out_end_date: "2026-10-01", student_notification_date: "2026-09-05", asset_transfer_scope: "NONE" }
              as: UniversityProvost
              as_user_id: "provost-1"
              captures: { tp_short_id: $.data.id }
          trigger:
            - call: "POST /teach-out-plans/${tp_short_id}/certify"
              payload: { asset_transfer_confirmed: true }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { e5: $.data.error_id }
          assert:
            - "response status == 422"
            - "${e5} == ERR_TEACH_OUT_NOTICE_TOO_SHORT"
            - "TeachOutPlan.${tp_short_id}.status == DRAFT"

      - name: program_close_without_a_certified_teach_out_plan_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 31 ERR_TEACH_OUT_OBLIGATIONS_UNMET]
          - state_machines.Program.TEACH_OUT_to_CLOSED
        distinguishing_aspect: "A TEACH_OUT Program with zero active enrollments still cannot CLOSE while no CERTIFIED TeachOutPlan exists — the obligation check is conjunctive, so an empty roster alone is not enough."
        test_recipe:
          setup:
            - "LAUNCHED Program with no Leads, moved to TEACH_OUT; no TeachOutPlan drafted at all."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_pg_begin_teach_out
          trigger:
            - call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "CLOSE" }
              as: UniversityProvost
              as_user_id: "provost-1"
              captures: { e6: $.data.error_id }
          assert:
            - "response status == 422"
            - "${e6} == ERR_TEACH_OUT_OBLIGATIONS_UNMET"
            - "Program.${pg_id}.status == TEACH_OUT"
            - "Program.${pg_id}.active_enrollment_count == 0"

      - name: duplicate_service_domain_assignment_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 32 ERR_DUPLICATE_SERVICE_DOMAIN]
          - endpoints[POST /programs/{id}/service-scope-assignments]
        distinguishing_aspect: "The split of service responsibility is a set, not a list: assigning MARKETING a second time on the same Program is refused even though the second assignment names a different responsible_party."
        test_recipe:
          setup:
            - "DRAFT Program that already has a MARKETING scope assignment to PARTNER."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_scope_marketing
          trigger:
            - call: "POST /programs/${pg_id}/service-scope-assignments"
              payload: { service_domain: "MARKETING", responsible_party: "UNIVERSITY", sla_response_hours: 48, cost_bearer: "UNIVERSITY" }
              as: UniversityProvost
              as_user_id: "provost-1"
              captures: { e7: $.data.error_id }
          assert:
            - "response status == 409"
            - "${e7} == ERR_DUPLICATE_SERVICE_DOMAIN"

      - name: non_delegable_course_design_domain_assigned_to_partner_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 29 ERR_NON_DELEGABLE_SERVICE_DOMAIN]
        distinguishing_aspect: "COURSE_DESIGN is one of the three non-delegable domains, so responsible_party PARTNER is refused with 422 while the same payload with UNIVERSITY would be accepted."
        test_recipe:
