      - name: app_record_listing_and_distribution_independent_dimensions
        grounds:
          - state_machines.AppRecord.LISTED_to_DELISTED
          - state_machines.AppRecord.DELISTED_to_DRAFT
          - state_machines.AppRecord.NOT_DISTRIBUTED_to_PHASED_ROLLOUT
          - state_machines.RolloutPlan.SCHEDULED_to_PHASE_ACTIVE
          - entities.AppRecord.fields.listing_state
          - entities.AppRecord.fields.distribution_state
