              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Nils Aberdene", email: "nils.aberdene@example.com", state_code: "TX", net_worth_cents: 400000000, annual_income_cents: 80000000 }
              as: SponsorOperator
              captures: { inv_id: $.data.id }
            - call: "POST /investors/${inv_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-NILS-2026-08" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_id}", investor_id: "${inv_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 250000 }
              as: SponsorOperator
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /subscriptions/${sub_id}/status"
              payload: { to_status: "RESCINDED", rejection_reason: "changed mind" }
              as: TransferAgent
              captures: { pending_to_rescinded: $.data.error_id }
            - call: "POST /subscriptions/${sub_id}/status"
              payload: { to_status: "REFUNDED" }
