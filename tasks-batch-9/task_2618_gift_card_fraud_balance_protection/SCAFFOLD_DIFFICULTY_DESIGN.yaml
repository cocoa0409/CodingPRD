  # ==========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: redemption_reversal_conserves_card_ledger_signed_sum
        grounds:
          - calculations.card_balance_projection
          - entities.LedgerEvent.fields.type
          - entities.LedgerEvent.fields.signed_amount_cents
          - entities.LedgerEvent.fields.reverses_event_id
          - entities.GiftCard.fields.total_loaded_cents
          - entities.GiftCard.fields.total_redeemed_cents
        distinguishing_aspect: |
          CONSERVED QUANTITY = the signed sum of one card's append-only ledger,
          which must equal current_balance_cents both before and after a
          compensating REDEMPTION_REVERSAL — and the reversal is a NEW row, so
          total_loaded_cents grows to 16666 while total_redeemed_cents returns
          to 0; an implementation that deletes or mutates the original
          redemption balances the card but destroys the audit trail's event
          count.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Two RetailStores — store1 issues, store2 takes the redemption."
            - "One CardRack and one ACTIVE PHYSICAL GiftCard with the deliberately non-round face value 12345 cents."
            - "One redemption of 4321 cents at store2, leaving current_balance_cents 8024."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Prairie Books", region_code: "MW", address_line: "14 Prairie Ln" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Airport News", region_code: "MW", address_line: "2 Terminal C" }
              as: PlatformAdmin
              captures: { store2_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-P1", expected_card_count: 6 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-1401" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 12345, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-14", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 4321, merchant_store_id: "${store2_id}", pos_terminal_id: "T-99", memo: "unauthorized" }
              as: PosAssociate
              captures: { redemption_id: $.data.id, redemption_signed: $.data.signed_amount_cents }
            - call: "GET /gift-cards/${card_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "analyst-1"
              captures: { bal_before: $.data.current_balance_cents, loaded_before: $.data.total_loaded_cents, redeemed_before: $.data.total_redeemed_cents }
          trigger:
            - call: "POST /ledger-events/${redemption_id}/reverse"
              payload: { reversal_reason: "chargeback confirmed, redemption unwound" }
              as: RiskManager
              as_user_id: "risk-1"
              captures: { reversal_id: $.data.id, reversal_signed: $.data.signed_amount_cents, reversal_type: $.data.type }
          assert:
            - "BEFORE — ${bal_before} == 8024 and ${loaded_before} == 12345 and ${redeemed_before} == 4321"
            - "BEFORE — signed sum 12345 + (-4321) == 8024 == ${bal_before}, so the invariant held pre-compensation"
            - "${redemption_signed} == -4321 and ${reversal_signed} == 4321"
            - "${reversal_type} == REDEMPTION_REVERSAL"
            - "LedgerEvent.${reversal_id}.reverses_event_id == ${redemption_id}"
            - "AFTER — GiftCard.${card_id}.current_balance_cents == 12345"
            - "AFTER — signed sum 12345 + (-4321) + 4321 == 12345, invariant restored"
            - "GiftCard.${card_id}.total_loaded_cents == 16666 — the reversal ADDS a load, it does not subtract a redemption"
            - "GiftCard.${card_id}.total_redeemed_cents == 0"
            - "GiftCard.${card_id}.drawdown_ratio == 0.00"
            - "GiftCard.${card_id}.activation_state == ACTIVE"
            - "GET /ledger-events?card_id=${card_id} returns total_count == 3 — the original redemption row still exists"
            - "GET /ledger-events?reverses_event_id=${redemption_id} returns total_count == 1"
            - "GET /ledger-events/${redemption_id} still returns amount_cents == 4321 and signed_amount_cents == -4321 — the original row was never mutated"

      - name: claim_rescind_conserves_net_funded_liability
        grounds:
          - calculations.net_funded_liability_invariant
          - state_machines.VictimClaim.APPROVED_to_RESCINDED
          - state_machines.GiftCard.ACTIVE_to_VOIDED
          - state_machines.GiftCard.CLOSED_to_ACTIVE
          - entities.LiabilityPeriod.fields.unauthorized_writeoff_cents
          - validations[priority=50]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity from the sibling instance — the
          PORTFOLIO-WIDE net funded liability across every card plus the
          period's write-off, not one card's ledger sum: approving the claim
          moves 16910 cents of funding from the original card to a replacement
          and books a 2628-cent write-off, and rescinding must void the
          replacement, revive the original and reverse the write-off so the
          portfolio total is the SAME 16910 at all three checkpoints.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "The four-hop cascade setup: two RetailStores, one CardRack, one ACTIVE PHYSICAL GiftCard with face value 20000 cents drained by three redemptions of 1010, 1030 and 1050 cents at store2, leaving 16910."
            - "One OPEN LiabilityPeriod covering 2026-08-01 through 2026-09-01."
            - "One VictimClaim with disputed_amount_cents 3090 and both evidence refs, APPROVED by risk-7 — which mints the replacement card, closes the original and books the write-off."
            - "The portfolio total is sampled from GET /liability-periods/{id}/exposure-summary both before and after the approval."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Harbor Gifts II", region_code: "NE", address_line: "11 Harbor Way" }
              as: PlatformAdmin
              captures: { store1_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Transit Kiosk II", region_code: "NE", address_line: "3 Transit Plz" }
              as: PlatformAdmin
              captures: { store2_id: $.data.id }
            - call: "POST /card-racks"
              payload: { store_id: "${store1_id}", rack_label: "RACK-H2", expected_card_count: 12 }
              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-1501" }
              as: PosAssociate
              captures: { card_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 20000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${card_id}", pos_terminal_id: "T-15", packaging_seal_intact: true }
              as: PosAssociate
              captures: { ir_id: $.data.id }
            - call: "POST /issuance-requests/${ir_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 1010, merchant_store_id: "${store2_id}", memo: "drain 1" }
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 1030, merchant_store_id: "${store2_id}", memo: "drain 2" }
              as: PosAssociate
            - call: "POST /gift-cards/${card_id}/redemptions"
              payload: { amount_cents: 1050, merchant_store_id: "${store2_id}", memo: "drain 3" }
              as: PosAssociate
            - call: "POST /liability-periods"
              payload: { label: "2026-08-rescind", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: LiabilityAccountant
              captures: { period_id: $.data.id }
            - call: "GET /liability-periods/${period_id}/exposure-summary"
              payload: {}
              as: LiabilityAccountant
              captures: { net_t0: $.data.net_funded_liability_cents, writeoff_t0: $.data.unauthorized_writeoff_cents }
            - call: "POST /victim-claims"
              payload: { card_id: "${card_id}", claimant_name: "Ines Sartori", claimant_contact: "ines@example.com", disputed_amount_cents: 3090, purchased_at: "2026-08-01T00:00:00Z", purchase_receipt_ref: "RCPT-1501", packaging_photo_ref: "PHOTO-1501" }
              as: PosAssociate
              as_user_id: "pos-7"
              captures: { claim_id: $.data.id }
            - call: "POST /victim-claims/${claim_id}/decide"
              payload: { decision: "APPROVE", decision_note: "tampered packaging confirmed" }
              as: RiskManager
              as_user_id: "risk-7"
              captures: { reissue_cents: $.data.reissue_amount_cents, new_card_id: $.data.reissued_card_id }
            - call: "GET /liability-periods/${period_id}/exposure-summary"
              payload: {}
              as: LiabilityAccountant
              captures: { net_t1: $.data.net_funded_liability_cents, writeoff_t1: $.data.unauthorized_writeoff_cents }
          trigger:
            - call: "POST /victim-claims/${claim_id}/rescind"
              payload: { rescind_reason: "claimant admitted the redemptions were made by a household member" }
              as: LiabilityAccountant
              captures: { claim_state: $.data.state, reissue_after: $.data.reissue_amount_cents, reissued_after: $.data.reissued_card_id }
          assert:
            - "CHECKPOINT 0 — ${net_t0} == 16910 and ${writeoff_t0} == 0"
            - "CHECKPOINT 1 (after approval) — ${net_t1} == 16910: the replacement card holds 19538 and the period carries a 2628 write-off, 19538 - 2628 == 16910"
            - "CHECKPOINT 1 — ${writeoff_t1} == 2628 and ${reissue_cents} == 2628"
            - "CHECKPOINT 2 (after rescind) — GET /liability-periods/${period_id}/exposure-summary returns net_funded_liability_cents == 16910"
            - "CHECKPOINT 2 — GET /liability-periods/${period_id}/exposure-summary returns unauthorized_writeoff_cents == 0"
            - "the conserved quantity is identical at all three checkpoints: 16910 == 16910 == 16910"
            - "VictimClaim.${claim_id}.state == RESCINDED"
            - "VictimClaim.${claim_id}.reissue_amount_cents == 2628 — the historical figure is RETAINED, not nulled"
            - "VictimClaim.${claim_id}.reissued_card_id == ${new_card_id} — the audit link survives"
            - "GiftCard.${new_card_id}.activation_state == VOIDED"
            - "GiftCard.${new_card_id}.risk_posture == FROZEN"
            - "GiftCard.${new_card_id}.current_balance_cents == 0"
            - "GiftCard.${card_id}.activation_state == ACTIVE — the original was revived"
            - "GiftCard.${card_id}.current_balance_cents == 16910"
            - "GiftCard.${card_id}.closed_at == null"
            - "LiabilityPeriod.${period_id}.unauthorized_writeoff_cents == 0"
            - "LiabilityPeriod.${period_id}.state == OPEN"
            - "GET /gift-cards?activation_state=VOIDED returns total_count == 1"
