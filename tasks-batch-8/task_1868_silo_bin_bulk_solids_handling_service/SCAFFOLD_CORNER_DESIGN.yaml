      - name: void_would_drive_inventory_negative_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.ReplenishmentOrder.RECEIVED_to_VOIDED"
          - "errors[ERR_INVENTORY_WOULD_GO_NEGATIVE]"
        distinguishing_aspect: "After re-anchor to 10.0 t, voiding a 25.0 t receipt would drive inventory negative and fails with ERR_INVENTORY_WOULD_GO_NEGATIVE; order stays RECEIVED."
