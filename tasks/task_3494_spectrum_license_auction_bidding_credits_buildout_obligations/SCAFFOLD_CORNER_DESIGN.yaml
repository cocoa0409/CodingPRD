      - name: assignment_tie_break_by_created_at
        claim_type: Correct Result
        grounds:
          - calculations.assignment_ranking
        distinguishing_aspect: "Two winners tie at 5,000,000 cents for a supply-2 product; the winner whose AssignmentBid was CREATED EARLIER takes frequency_block_index 0 — the pinned tie-break is created_at ASC, never the resource id."
        test_recipe:
          setup: ["CATEGORY_A@PEA002 supply 2; rural R and no-credit W1 each win qty 1 (each eligible 5,000,000 units via upfront 12,500,000,000); R files the first assignment bid, W1 files the second, both 5,000,000"]
          setup_api_calls:
