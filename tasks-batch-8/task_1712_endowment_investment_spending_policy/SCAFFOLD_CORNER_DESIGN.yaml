            - { call: "POST /endowment/policies/${iu_pol}/adopt", payload: { expected_pool_version: "${iu_pv}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/managers", payload: { pool_id: "${iu_pool}", manager_name: "M IU", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { iu_mgr: $.data.id } }
