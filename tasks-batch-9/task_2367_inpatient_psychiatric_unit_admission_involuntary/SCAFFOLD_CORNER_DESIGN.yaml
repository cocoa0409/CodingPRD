              captures: { rb_err_clock: $.data.error_id }
            - call: "POST /behavioral-health/restraints"
              payload: { admission_id: "00000000-0000-4000-8000-000000000000", intervention_type: "MECHANICAL_RESTRAINT", ordered_duration_minutes: 30, clinical_justification: "Attempted role escalation." }
              as: ChargeNurse
              as_user_id: "${c_rn}"
              captures: { rb_err_restraint: $.data.error_id }
            - call: "POST /behavioral-health/admissions"
              payload: { patient_id: "00000000-0000-4000-8000-000000000000", evaluation_id: "00000000-0000-4000-8000-000000000000", unit_id: "${u_rb}", requested_legal_status: "VOLUNTARY" }
              as: PatientRightsAdvocate
              as_user_id: "${c_adv}"
              captures: { rb_err_admit: $.data.error_id }
            - call: "POST /behavioral-health/admissions/${a_rb}/place"
              payload: { unit_id: "${u_rb}", expected_unit_version: "${u_rb_v}", bed_id: "${b_rb}", posture_override_reason: "Nurse asserts override authority." }
              as: ChargeNurse
              as_user_id: "${c_rn}"
              captures: { rb_err_override: $.data.error_id }
            - call: "POST /behavioral-health/admissions/${a_rb}/place"
              payload: { unit_id: "${u_rb}", expected_unit_version: "${u_rb_v}", bed_id: "${b_rb}" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
          assert:
            - "${rb_err_roster} == \"ERR_UNAUTHORIZED\" with HTTP 403 - roster maintenance is exclusive to ComplianceOfficer"
            - "${rb_err_clock} == \"ERR_UNAUTHORIZED\" with HTTP 403 - the logical clock is exclusive to ComplianceOfficer, so the clock is still at its 2026-08-01T00:00:00Z default afterwards"
            - "${rb_err_restraint} == \"ERR_UNAUTHORIZED\" and not \"ERR_ADMISSION_NOT_FOUND\": priority 2 precedes priority 7 even though the body's admission_id does not exist"
            - "${rb_err_admit} == \"ERR_UNAUTHORIZED\" and not \"ERR_PATIENT_NOT_FOUND\" - PatientRightsAdvocate holds no exclusive_operations at all"
            - "${rb_err_override} == \"ERR_UNAUTHORIZED\": the ChargeNurse is a declared role for place, but posture_override_reason is authorized only for AttendingPsychiatrist, and Admission.${a_rb}.placement_status is still \"PENDING_PLACEMENT\" with Bed.${b_rb}.status still \"AVAILABLE\""
            - "the final identical call without posture_override_reason is HTTP 200: placement_status \"PLACED\", Bed.${b_rb}.status \"OCCUPIED\" - proving only the extra field, not the role, was the defect"

      - name: missing_x_user_headers_returns_unauthenticated
        claim_type: denied
        grounds:
          - validations[priority 1]
          - errors[ERR_UNAUTHENTICATED]
          - roles[ChargeNurse].identity
        distinguishing_aspect: "Priority 1 demands both headers and a role string drawn from the five declared names, so an omitted X-User-ID on an entity_backed role, an omitted X-User-Role, and a plausible-but-undeclared role name all fail with 401 before any authorization, schema or existence check can run."
        test_recipe:
          setup:
            - "Roster: one charge nurse. No other state is needed - authentication is checked first."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Rosa Kim", staff_role: "CHARGE_NURSE", license_number: "LIC-RN-2367-1" }
              as: ComplianceOfficer
              captures: { c_rn: $.data.id }
          trigger:
            - call: "GET /behavioral-health/clinicians/${c_rn}"
              payload: {}
              as: ChargeNurse
              captures: { auth_err_no_user: $.data.error_id }
            - call: "GET /behavioral-health/clinicians/${c_rn}"
              payload: {}
              as: BedManager
              as_user_id: "${c_rn}"
              captures: { auth_err_bad_role: $.data.error_id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "00000000-0000-4000-8000-000000000000", room_number: "9901" }
              as: ""
              captures: { auth_err_no_role: $.data.error_id }
          assert:
            - "the first call - sent with X-User-Role: ChargeNurse but no X-User-ID header - is HTTP 401 with ${auth_err_no_user} == \"ERR_UNAUTHENTICATED\", because ChargeNurse identity is entity_backed:Clinician"
            - "the second call carries X-User-Role: BedManager, which is not one of the five declared roles, and is HTTP 401 with ${auth_err_bad_role} == \"ERR_UNAUTHENTICATED\" rather than 403 - an unknown role is not an unauthorized role"
            - "the third call omits X-User-Role entirely and is HTTP 401 with ${auth_err_no_role} == \"ERR_UNAUTHENTICATED\", not ERR_INVALID_REQUEST for its missing bed_label and bed_type and not ERR_UNIT_NOT_FOUND for its dangling unit_id - priority 1 outranks priorities 3 and 5"
            - "no Bed row is created by the third call"

