# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: unit_rate_vs_tm_invoice_same_inputs
        grounds:
          - calculations.job_invoice_amount
          - calculations.invoice_line_rounding
          - calculations.invoice_volume_discount
          - entities.Job.fields.pricing_mode
        distinguishing_aspect: |
          Dual variant on the JOB/INVOICE domain: two jobs with identical measured
          quantities (4000 gal, 120 ft) and identical crew windows (1 operator + 1
          COMBO unit, 8h each) price to different totals — UNIT_RATE bills measured
          outputs (total 1203110) while TIME_AND_MATERIALS bills crew windows
          (total 297840); the variant is selected by Job.pricing_mode.
        test_recipe:
          setup:
            - "Site with ACTIVE schedule S-A (vacuum 250c/gal, hydro 1800c/ft, labor 14500c/h, equipment 22000c/h, standby 12000c/h, OT 1.5, minimum 75000c)"
            - "Job U: COMBINED, pricing UNIT_RATE, IN_PROGRESS then FIELD_COMPLETE with gallons_removed=4000, feet_cleaned=120, containment verified 0.9500"
            - "Job T: COMBINED, pricing TIME_AND_MATERIALS, identical crew windows (2026-08-02) and identical measured quantities, FIELD_COMPLETE"
            - "Both jobs: 1 COMBO equipment assignment 8h CONFIRMED + 1 operator assignment 8h CONFIRMED; approved JHA with pressure plan 5000 psi"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "COMBO-01", unit_type: "COMBO", max_pressure_psi: 10000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/operators", payload: { full_name: "Ollie Otis", employee_ref: "E-100", hazwoper_expires_on: "2027-01-01", hydroblast_certified: true }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "COMBINED", pricing_mode: "UNIT_RATE", description: "T-101 cleanout + line blast", estimated_gallons: 4000 }, as: ProjectManager, captures: { job_u: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_u}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_u_eq: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_u}", resource_kind: "OPERATOR", operator_id: "${op_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_u_op: $.data.id } }
            - { call: "POST /v1/assignments/${asg_u_eq}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/assignments/${asg_u_op}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_u}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_u}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_u}", confined_space: false, hazards: ["HIGH_PRESSURE_WATER", "CHEMICAL_EXPOSURE"], max_operating_pressure_psi: 5000, planned_water_flow_gpm: 20.0, water_source: "SITE_NONPOTABLE" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_u: $.data.id } }
            - { call: "POST /v1/jhas/${jha_u}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_u}", payload: {}, as: ProjectManager, captures: { job_u_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_u}/approve", payload: { expected_job_version: "${job_u_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_u}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_u}", water_used_gallons: 2000, water_captured_gallons: 1900 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_u: $.data.id } }
            - { call: "POST /v1/containment-records/${cr_u}/verify", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_u}/complete-field-work", payload: { gallons_removed: 4000, feet_cleaned: 120 }, as: ProjectManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "COMBINED", pricing_mode: "TIME_AND_MATERIALS", description: "T-101 cleanout + line blast (T&M twin)", estimated_gallons: 4000 }, as: ProjectManager, captures: { job_t: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_t}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T14:00:00Z" }, as: ProjectManager, captures: { asg_t_eq: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_t}", resource_kind: "OPERATOR", operator_id: "${op_id}", window_start: "2026-08-02T06:00:00Z", window_end: "2026-08-02T14:00:00Z" }, as: ProjectManager, captures: { asg_t_op: $.data.id } }
            - { call: "POST /v1/assignments/${asg_t_eq}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/assignments/${asg_t_op}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_t}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_t}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_t}", confined_space: false, hazards: ["HIGH_PRESSURE_WATER", "CHEMICAL_EXPOSURE"], max_operating_pressure_psi: 5000, planned_water_flow_gpm: 20.0, water_source: "SITE_NONPOTABLE" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_t: $.data.id } }
            - { call: "POST /v1/jhas/${jha_t}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_t}", payload: {}, as: ProjectManager, captures: { job_t_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_t}/approve", payload: { expected_job_version: "${job_t_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_t}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_t}", water_used_gallons: 2000, water_captured_gallons: 1900 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_t: $.data.id } }
            - { call: "POST /v1/containment-records/${cr_t}/verify", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_t}/complete-field-work", payload: { gallons_removed: 4000, feet_cleaned: 120 }, as: ProjectManager }
          trigger:
            - { call: "POST /v1/jobs/${job_u}/generate-invoice", payload: {}, as: ProjectManager, captures: { inv_u_id: $.data.id, inv_u_total: $.data.total_cents } }
            - { call: "POST /v1/jobs/${job_t}/generate-invoice", payload: {}, as: ProjectManager, captures: { inv_t_id: $.data.id, inv_t_total: $.data.total_cents } }
          assert:
            - "Invoice.${inv_u_id}.total_cents == 1203110 (VACUUM 4000*250=1000000 + HYDRO 120*1800=216000 => 1216000; 3% tier discount 36480; net 1179520; env fee round_half_up(1179520*0.02)=23590)"
            - "Invoice.${inv_t_id}.total_cents == 297840 (LABOR_REG 8h*14500=116000 + EQUIPMENT 8h*22000=176000 => 292000; below 500000 tier so discount 0; env fee 5840)"
            - "inv_u_total != inv_t_total — identical inputs price differently per Job.pricing_mode variant"
            - "Invoice.${inv_u_id} has no LABOR_REG/EQUIPMENT lines; Invoice.${inv_t_id} has no VACUUM/HYDRO lines"

      - name: manifest_variance_weight_vs_volume_basis
        grounds:
          - calculations.manifest_variance_pct
          - entities.WasteProfile.fields.variance_basis
          - state_machines.DisposalManifest.IN_TRANSIT_to_RECEIVED
        distinguishing_aspect: |
          Dual variant on the MANIFEST/WASTE domain (distinct from invoicing):
          identical shipment (2750 gal estimated, 11.6 tons received, density
          8.345) yields variance_pct 1.13 under WEIGHT basis (convert gallons to
          tons, 2dp) but 1.09 under VOLUME basis (convert tons to gallons, 1dp) —
          different denominators and rounding order per WasteProfile.variance_basis.
        test_recipe:
          setup:
            - "Site with ACTIVE schedule S-A; disposal facility cap 1000t"
            - "Profile W (variance_basis WEIGHT, density 8.345) and Profile V (variance_basis VOLUME, density 8.345), both APPROVED"
            - "Job IN_PROGRESS (VACUUM, non-confined) with manifest W (est 2750 gal -> W) and manifest V (est 2750 gal -> V), both ISSUED then IN_TRANSIT"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Bayport Terminal" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/disposal-facilities", payload: { name: "Gulf Coast TSDF", epa_id: "TXD0001", total_capacity_tons: 1000 }, as: PlatformAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /v1/waste-profiles", payload: { site_id: "${site_id}", facility_id: "${fac_id}", waste_code: "D008", hazard_class: "HAZ", density_lbs_per_gal: 8.345, disposal_rate_per_ton_cents: 35000, variance_basis: "WEIGHT" }, as: ComplianceOfficer, captures: { prof_w: $.data.id } }
            - { call: "POST /v1/waste-profiles/${prof_w}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /v1/waste-profiles/${prof_w}/approve", payload: {}, as: EnvironmentalApprover, as_user_id: "ea_1" }
            - { call: "POST /v1/waste-profiles", payload: { site_id: "${site_id}", facility_id: "${fac_id}", waste_code: "D008", hazard_class: "HAZ", density_lbs_per_gal: 8.345, disposal_rate_per_ton_cents: 35000, variance_basis: "VOLUME" }, as: ComplianceOfficer, captures: { prof_v: $.data.id } }
            - { call: "POST /v1/waste-profiles/${prof_v}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /v1/waste-profiles/${prof_v}/approve", payload: {}, as: EnvironmentalApprover, as_user_id: "ea_1" }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Sump pump-out" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests", payload: { job_id: "${job_id}", waste_profile_id: "${prof_w}", estimated_gallons: 2750 }, as: ProjectManager, captures: { man_w: $.data.id } }
            - { call: "POST /v1/manifests/${man_w}/issue", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests/${man_w}/depart", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests", payload: { job_id: "${job_id}", waste_profile_id: "${prof_v}", estimated_gallons: 2750 }, as: ProjectManager, captures: { man_v: $.data.id } }
            - { call: "POST /v1/manifests/${man_v}/issue", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests/${man_v}/depart", payload: {}, as: ProjectManager }
          trigger:
            - { call: "POST /v1/manifests/${man_w}/receive", payload: { received_tons: 11.6 }, as: ProjectManager, captures: { man_w_var: $.data.variance_pct, man_w_status: $.data.status } }
            - { call: "POST /v1/manifests/${man_v}/receive", payload: { received_tons: 11.6 }, as: ProjectManager, captures: { man_v_var: $.data.variance_pct, man_v_status: $.data.status } }
          assert:
            - "DisposalManifest.${man_w}.variance_pct == 1.13 (WEIGHT: shipped_tons_est round(2750*8.345/2000,2)=11.47; (11.6-11.47)/11.47*100 = 1.13)"
            - "DisposalManifest.${man_v}.variance_pct == 1.09 (VOLUME: received_gal round(11.6*2000/8.345,1)=2780.1; (2780.1-2750)/2750*100 = 1.09)"
            - "man_w_status == RECEIVED and man_v_status == RECEIVED (both |variance| <= 10.00)"
            - "man_w_var != man_v_var for identical estimated_gallons and received_tons — basis variant decides"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: downtime_grace_cap_block_formula
        grounds:
          - calculations.downtime_billing
          - calculations.job_standby_accrual
          - entities.DowntimeEvent.fields.billable_minutes
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: billable minutes
          branch on cause (grace table), pass through max(0, duration-grace),
          then min() against the remaining daily cap (480 - same-day accrual),
          then ceil() into 15-minute blocks. E1 (100 min CUSTOMER_DELAY) bills 70
          min -> 5 blocks -> 15000c; E2 (460 min CUSTOMER_DELAY same closure_day)
          is capped to 410 min -> 28 blocks -> 84000c.
        test_recipe:
          setup:
            - "VACUUM UNIT_RATE job IN_PROGRESS on schedule S-A (standby 12000c/h); logical clock starts at default 2026-08-01T00:00:00Z"
            - "E1 opened at 00:00, closed at 01:40 (100 min); E2 opened at 01:40, closed at 09:20 (460 min); both closure_day 2026-08-01"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Clarifier pump-out" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/downtime-events", payload: { job_id: "${job_id}", cause: "CUSTOMER_DELAY" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { e1: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:40:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/downtime-events/${e1}/close", payload: {}, as: FieldSupervisor, as_user_id: "fs_1", captures: { e1_bill: $.data.billable_minutes, e1_amt: $.data.billed_amount_cents, e1_blocks: $.data.billed_blocks } }
            - { call: "POST /v1/downtime-events", payload: { job_id: "${job_id}", cause: "CUSTOMER_DELAY" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { e2: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:20:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/downtime-events/${e2}/close", payload: {}, as: FieldSupervisor, as_user_id: "fs_1", captures: { e2_bill: $.data.billable_minutes, e2_amt: $.data.billed_amount_cents, e2_blocks: $.data.billed_blocks } }
          assert:
            - "DowntimeEvent.${e1}: billable_minutes == 70 (max(0, 100-30)), billed_blocks == 5 (ceil(70/15)), billed_amount_cents == 15000 (5 * 12000/4)"
            - "DowntimeEvent.${e2}: billable_minutes == 410 (min(460-30, 480-70)), billed_blocks == 28 (ceil(410/15)), billed_amount_cents == 84000"
            - "Job.${job_id}.standby_accrued_cents == 99000 after both closes"

      - name: tm_invoice_per_line_rounding_beats_sum_rounding
        grounds:
          - calculations.invoice_line_rounding
          - calculations.job_invoice_amount
          - calculations.invoice_volume_discount
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: two LABOR_OT lines of
          1.0h at 12995c/h x 1.5 each carry a fractional .5 cent. Pinned order
          (round_half_up per line, then sum) yields 19493 + 19493 = 38986;
          sum-then-round would yield 38985. Invoice total 251844 is only
          reproducible under the pinned per-line order.
        test_recipe:
          setup:
            - "Schedule S-B: labor 12995c/h, equipment 22000c/h, standby 12000c/h, OT 1.5, minimum 0"
            - "VACUUM T&M job with TWO operators, each one 9h CONFIRMED window (2026-08-01T06:00-15:00); FIELD_COMPLETE"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-B", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 12995, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 0 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/operators", payload: { full_name: "Ann A", employee_ref: "E-201", hazwoper_expires_on: "2027-01-01", hydroblast_certified: false }, as: PlatformAdmin, captures: { op1: $.data.id } }
            - { call: "POST /v1/operators", payload: { full_name: "Bob B", employee_ref: "E-202", hazwoper_expires_on: "2027-01-01", hydroblast_certified: false }, as: PlatformAdmin, captures: { op2: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "TIME_AND_MATERIALS", description: "Pit pump-out T&M" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "OPERATOR", operator_id: "${op1}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T15:00:00Z" }, as: ProjectManager, captures: { a1: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "OPERATOR", operator_id: "${op2}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T15:00:00Z" }, as: ProjectManager, captures: { a2: $.data.id } }
            - { call: "POST /v1/assignments/${a1}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/assignments/${a2}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["SLIP_TRIP"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_id}", water_used_gallons: 1000, water_captured_gallons: 1000 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_id: $.data.id } }
            - { call: "POST /v1/containment-records/${cr_id}/verify", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/complete-field-work", payload: { gallons_removed: 0, feet_cleaned: 0 }, as: ProjectManager }
          trigger:
            - { call: "POST /v1/jobs/${job_id}/generate-invoice", payload: {}, as: ProjectManager, captures: { inv_id: $.data.id, inv_total: $.data.total_cents } }
          assert:
            - "Invoice.${inv_id} has two LABOR_OT lines each amount_cents == 19493 (round_half_up(1.0*12995*1.5)=round_half_up(19492.5))"
            - "Invoice.${inv_id} has two LABOR_REG lines each amount_cents == 103960 (8*12995)"
            - "Invoice.${inv_id}.subtotal_cents == 246906 (per-line order; sum-then-round would give 246905)"
            - "Invoice.${inv_id}.discount_cents == 0 and environmental_fee_cents == 4938 and total_cents == 251844"

      - name: volume_discount_tier_keyed_on_prediscount_subtotal
        grounds:
          - calculations.invoice_volume_discount
          - entities.Invoice.fields.discount_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          the discount tier is selected from the PRE-discount discountable
          subtotal. A UNIT_RATE job of exactly 2000 gal x 250c = 500000 discountable
          hits the >= 500000 tier (boundary inclusive) for 3% => total 494700;
          the post-discount reading (485000 < 500000 => 0%) would give 510000.
        test_recipe:
          setup:
            - "VACUUM UNIT_RATE job on schedule S-A, FIELD_COMPLETE with gallons_removed=2000, feet_cleaned=0, containment verified"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Big sump job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_id}", water_used_gallons: 500, water_captured_gallons: 500 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_id: $.data.id } }
            - { call: "POST /v1/containment-records/${cr_id}/verify", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/complete-field-work", payload: { gallons_removed: 2000, feet_cleaned: 0 }, as: ProjectManager }
          trigger:
            - { call: "POST /v1/jobs/${job_id}/generate-invoice", payload: {}, as: ProjectManager, captures: { inv_id: $.data.id, inv_total: $.data.total_cents } }
          assert:
            - "Invoice.${inv_id}.subtotal_cents == 500000 (single VACUUM line 2000*250; >= 75000 minimum so no ADJUSTMENT line)"
            - "Invoice.${inv_id}.discount_cents == 15000 (tier 3% at exactly 500000 pre-discount discountable subtotal)"
            - "Invoice.${inv_id}.environmental_fee_cents == 9700 (round_half_up((500000-15000)*0.02))"
            - "Invoice.${inv_id}.total_cents == 494700 (post-discount-tier reading would give 510000)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: jha_revision_cycle_and_supersede
        grounds:
          - state_machines.JobHazardAnalysis.REJECTED_to_DRAFT
          - state_machines.JobHazardAnalysis.SUBMITTED_to_APPROVED
          - entities.JobHazardAnalysis.fields.revision_number
        distinguishing_aspect: |
          Cyclic machine on JobHazardAnalysis: DRAFT->SUBMITTED->REJECTED->DRAFT
          revision loop, and approving a newer revision SUPERSEDES the previously
          APPROVED one (single-approved invariant) — a cycle with a lateral
          supersede edge, not a pipeline.
        test_recipe:
          setup:
            - "QUOTED job on a site with ACTIVE schedule S-A"
            - "JHA rev1 submitted by fs_1, rejected by sm_1, revised back to DRAFT, resubmitted, approved (job version re-read before approve)"
            - "JHA rev2 created (revision_number 2), submitted, approved"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Cycle test job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha1: $.data.id, jha1_rev: $.data.revision_number } }
            - { call: "POST /v1/jhas/${jha1}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "POST /v1/jhas/${jha1}/reject", payload: {}, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jhas/${jha1}/revise", payload: {}, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha1_back: $.data.status } }
            - { call: "POST /v1/jhas/${jha1}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v1: $.data.version } }
            - { call: "POST /v1/jhas/${jha1}/approve", payload: { expected_job_version: "${job_v1}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE", "ERGONOMIC"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha2: $.data.id, jha2_rev: $.data.revision_number } }
            - { call: "POST /v1/jhas/${jha2}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v2: $.data.version } }
          trigger:
            - { call: "POST /v1/jhas/${jha2}/approve", payload: { expected_job_version: "${job_v2}" }, as: SafetyManager, as_user_id: "sm_1" }
          assert:
            - "jha1_rev == 1 and jha2_rev == 2 (per-job monotone revision numbering)"
            - "jha1_back == DRAFT after revise (REJECTED -> DRAFT cycle edge)"
            - "JobHazardAnalysis.${jha1}.status == SUPERSEDED after rev2 approval"
            - "JobHazardAnalysis.${jha2}.status == APPROVED (exactly one APPROVED revision per job)"

      - name: job_parallel_dims_stop_work_gate
        grounds:
          - state_machines.Job.CLEAR_to_STOP_WORK
          - state_machines.Job.IN_PROGRESS_to_FIELD_COMPLETE
          - state_machines.Permit.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Parallel state dimensions on Job: a SERIOUS incident flips the
          independent safety_status axis to STOP_WORK (and suspends the ACTIVE
          permit as a cascade) while execution_status stays IN_PROGRESS;
          complete-field-work is rejected with ERR_JOB_STOPPED until the incident
          is CLOSED and resume-work restores CLEAR — then completion succeeds.
        test_recipe:
          setup:
            - "COMBINED job IN_PROGRESS with approved confined-space JHA and ACTIVE CONFINED_SPACE permit (space T-101); containment already VERIFIED (1000/1000)"
            - "Incident SERIOUS reported -> job STOP_WORK, permit SUSPENDED"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "COMBO-01", unit_type: "COMBO", max_pressure_psi: 10000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "COMBINED", pricing_mode: "UNIT_RATE", description: "Tank T-101 confined entry" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: true, hazards: ["CONFINED_SPACE", "HIGH_PRESSURE_WATER"], max_operating_pressure_psi: 5000, planned_water_flow_gpm: 20.0, water_source: "TRUCKED_IN" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/permits", payload: { job_id: "${job_id}", permit_type: "CONFINED_SPACE", space_id: "T-101", valid_from: "2026-07-31T00:00:00Z", valid_until: "2026-08-05T18:00:00Z" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { perm_id: $.data.id } }
            - { call: "POST /v1/permits/${perm_id}/activate", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_id}", water_used_gallons: 1000, water_captured_gallons: 1000 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_id: $.data.id } }
            - { call: "POST /v1/containment-records/${cr_id}/verify", payload: {}, as: ProjectManager }
            - { call: "POST /v1/incidents", payload: { job_id: "${job_id}", severity: "SERIOUS", title: "Hose whip near-miss with injury potential", description: "Hydroblast hose coupling separated under pressure" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { inc_id: $.data.id } }
          trigger:
            - { call: "POST /v1/jobs/${job_id}/complete-field-work", payload: { gallons_removed: 500, feet_cleaned: 40 }, as: ProjectManager, captures: { err_stop: $.data.error_id } }
            - { call: "POST /v1/incidents/${inc_id}/start-review", payload: {}, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/incidents/${inc_id}/close", payload: { osha_recordable: false, corrective_action: "Retrain crew on coupling inspection" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/resume-work", payload: {}, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/complete-field-work", payload: { gallons_removed: 500, feet_cleaned: 40 }, as: ProjectManager }
          assert:
            - "err_stop == ERR_JOB_STOPPED — safety dimension gates the execution transition"
            - "During STOP_WORK: Job.${job_id}.execution_status == IN_PROGRESS (unchanged) and Permit.${perm_id}.status == SUSPENDED (cascade from stop-work)"
            - "After resume-work: Job.${job_id}.safety_status == CLEAR while Permit.${perm_id}.status remains SUSPENDED (permits re-activate explicitly)"
            - "Second complete-field-work succeeds: Job.${job_id}.execution_status == FIELD_COMPLETE"

      - name: permit_active_suspended_cycle
        grounds:
          - state_machines.Permit.ACTIVE_to_SUSPENDED
          - state_machines.Permit.SUSPENDED_to_ACTIVE
          - state_machines.Permit.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Cyclic machine on Permit (a different entity than JHA/Job): ACTIVE ->
          SUSPENDED -> ACTIVE resume loop is legal any number of times while the
          validity window holds, then ACTIVE -> CLOSED terminates.
        test_recipe:
          setup:
            - "MOBILIZED job (HOT_WORK permit needs no JHA match); permit P on space B-201 with window covering the default clock"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-02", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Hot work vac job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/permits", payload: { job_id: "${job_id}", permit_type: "HOT_WORK", space_id: "B-201", valid_from: "2026-07-31T00:00:00Z", valid_until: "2026-08-05T18:00:00Z" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { perm_id: $.data.id } }
          trigger:
            - { call: "POST /v1/permits/${perm_id}/activate", payload: {}, as: FieldSupervisor, as_user_id: "fs_1", captures: { st1: $.data.status } }
            - { call: "POST /v1/permits/${perm_id}/suspend", payload: {}, as: SafetyManager, as_user_id: "sm_1", captures: { st2: $.data.status } }
            - { call: "POST /v1/permits/${perm_id}/activate", payload: {}, as: FieldSupervisor, as_user_id: "fs_1", captures: { st3: $.data.status } }
            - { call: "POST /v1/permits/${perm_id}/close", payload: {}, as: FieldSupervisor, as_user_id: "fs_1", captures: { st4: $.data.status } }
          assert:
            - "st1 == ACTIVE, st2 == SUSPENDED, st3 == ACTIVE (resume cycle), st4 == CLOSED"
            - "Permit.${perm_id}.version == 5 (one increment per mutation: create + 4 transitions)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: profile_suspend_cascade_voids_manifests_releases_reservation
        grounds:
          - state_machines.WasteProfile.APPROVED_to_SUSPENDED
          - state_machines.DisposalManifest.ISSUED_to_VOIDED
          - calculations.facility_reservation_sync
        distinguishing_aspect: |
          Depth-3 cascade from trigger POST /v1/waste-profiles/{id}/suspend:
          (1) profile SUSPENDED voids its DRAFT/ISSUED manifests; (2) each
          ISSUED-voided manifest releases its facility reservation
          (reserved_tons -= estimated_tons); (3) the reservation change recomputes
          facility posture (FULL -> AVAILABLE). Each link is caused by the
          previous link, not by the suspend call directly.
        test_recipe:
          setup:
            - "Facility cap 10.00t; profile P (WEIGHT, density 8.0, rate 35000c/t) APPROVED"
            - "Job IN_PROGRESS; manifest M est 2500 gal ISSUED -> estimated_tons 10.00, reserved_tons 10.00 == capacity -> posture FULL"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Bayport Terminal" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/disposal-facilities", payload: { name: "Gulf Coast TSDF", epa_id: "TXD0001", total_capacity_tons: 10.0 }, as: PlatformAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /v1/waste-profiles", payload: { site_id: "${site_id}", facility_id: "${fac_id}", waste_code: "D008", hazard_class: "HAZ", density_lbs_per_gal: 8.0, disposal_rate_per_ton_cents: 35000, variance_basis: "WEIGHT" }, as: ComplianceOfficer, captures: { prof_id: $.data.id } }
            - { call: "POST /v1/waste-profiles/${prof_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /v1/waste-profiles/${prof_id}/approve", payload: {}, as: EnvironmentalApprover, as_user_id: "ea_1" }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Cascade job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests", payload: { job_id: "${job_id}", waste_profile_id: "${prof_id}", estimated_gallons: 2500 }, as: ProjectManager, captures: { man_id: $.data.id } }
            - { call: "POST /v1/manifests/${man_id}/issue", payload: {}, as: ProjectManager, captures: { man_tons: $.data.estimated_tons } }
            - { call: "GET /v1/disposal-facilities/${fac_id}", payload: {}, as: ProjectManager, captures: { fac_reserved_pre: $.data.reserved_tons, fac_posture_pre: $.data.posture } }
          trigger:
            - { call: "POST /v1/waste-profiles/${prof_id}/suspend", payload: {}, as: EnvironmentalApprover, as_user_id: "ea_1" }
          assert:
            - "Pre-suspend: fac_reserved_pre == 10.0 and fac_posture_pre == FULL (reserved == capacity)"
            - "After suspend: DisposalManifest.${man_id}.status == VOIDED (link 1)"
            - "After suspend: DisposalFacility.${fac_id}.reserved_tons == 0.0 (link 2, release caused by the void)"
            - "After suspend: DisposalFacility.${fac_id}.posture == AVAILABLE (link 3, recompute caused by the release)"
            - "WasteProfile.${prof_id}.status == SUSPENDED"

      - name: invoice_void_cascade_reverts_job_and_unbills_downtime
        grounds:
          - state_machines.Invoice.DRAFT_to_VOID
          - state_machines.Job.INVOICED_to_FIELD_COMPLETE
          - state_machines.DowntimeEvent.BILLED_to_CLOSED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (POST /v1/invoices/{id}/void):
          (1) the voided invoice reverts its Job INVOICED -> FIELD_COMPLETE;
          (2) that job revert un-bills the downtime events the invoice had swept
          (BILLED -> CLOSED, invoice_id cleared) — enabling a later regeneration.
        test_recipe:
          setup:
            - "VACUUM UNIT_RATE job IN_PROGRESS with one CUSTOMER_DELAY downtime event (100 min -> 70 billable -> 15000c) CLOSED"
            - "Job FIELD_COMPLETE (1000 gal) and invoice generated: VACUUM 250000 + STANDBY 15000 => total 270300; event BILLED"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Void cascade job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/downtime-events", payload: { job_id: "${job_id}", cause: "CUSTOMER_DELAY" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { dt_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:40:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/downtime-events/${dt_id}/close", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "POST /v1/containment-records", payload: { job_id: "${job_id}", water_used_gallons: 800, water_captured_gallons: 800 }, as: FieldSupervisor, as_user_id: "fs_1", captures: { cr_id: $.data.id } }
            - { call: "POST /v1/containment-records/${cr_id}/verify", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/complete-field-work", payload: { gallons_removed: 1000, feet_cleaned: 0 }, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/generate-invoice", payload: {}, as: ProjectManager, captures: { inv_id: $.data.id, inv_total: $.data.total_cents } }
          trigger:
            - { call: "POST /v1/invoices/${inv_id}/void", payload: {}, as: AccountManager }
          assert:
            - "Pre-void: inv_total == 270300 (subtotal 265000 = VACUUM 250000 + STANDBY 15000; discount 0; env fee 5300) and DowntimeEvent.${dt_id}.status == BILLED with invoice_id == ${inv_id}"
            - "After void (link 1): Job.${job_id}.execution_status == FIELD_COMPLETE"
            - "After void (link 2): DowntimeEvent.${dt_id}.status == CLOSED and invoice_id is null"
            - "Invoice.${inv_id}.status == VOID"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_safety_error_on_start_work
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_JHA_NOT_APPROVED]
        distinguishing_aspect: |
          Pair (state vs business_safety): start-work on a QUOTED job whose JHA
          is only DRAFT violates both the execution-state precondition and the
          JHA-approval safety gate; priority 6 (state) beats priority 8 (safety)
          so the error is ERR_INVALID_STATE, not ERR_JHA_NOT_APPROVED.
        test_recipe:
          setup:
            - "Job QUOTED (never scheduled); JHA exists only in DRAFT"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Priority test A" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["SLIP_TRIP"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
          trigger:
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (state band priority 6 wins over business_safety priority 8; JHA.${jha_id} DRAFT would otherwise raise ERR_JHA_NOT_APPROVED)"

      - name: safety_error_beats_fiscal_error_on_start_work
        grounds:
          - validations[priority=10]
          - validations[priority=30]
          - errors[ERR_PERMIT_NOT_ACTIVE]
          - errors[ERR_SITE_CREDIT_HOLD]
        distinguishing_aspect: |
          Pair (business_safety vs business_fiscal) — a different category pair
          than state-vs-safety: start-work on a MOBILIZED job with an approved
          confined-space JHA but no ACTIVE permit, while the site is on
          CREDIT_HOLD, must raise ERR_PERMIT_NOT_ACTIVE (priority 10) rather than
          ERR_SITE_CREDIT_HOLD (priority 30).
        test_recipe:
          setup:
            - "COMBINED job MOBILIZED; approved JHA with confined_space=true; NO permit created; site patched to CREDIT_HOLD"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "COMBO-01", unit_type: "COMBO", max_pressure_psi: 10000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "COMBINED", pricing_mode: "UNIT_RATE", description: "Priority test B" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: true, hazards: ["CONFINED_SPACE"], max_operating_pressure_psi: 5000, planned_water_flow_gpm: 20.0, water_source: "TRUCKED_IN" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "PATCH /v1/sites/${site_id}", payload: { credit_status: "CREDIT_HOLD" }, as: AccountManager }
          trigger:
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PERMIT_NOT_ACTIVE (business_safety priority 10 wins over business_fiscal priority 30)"
            - "err != ERR_SITE_CREDIT_HOLD even though the site is on CREDIT_HOLD"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: manifest_variance_exactly_ten_pct_stays_received
        grounds:
          - calculations.manifest_variance_pct
          - state_machines.DisposalManifest.IN_TRANSIT_to_RECEIVED
        distinguishing_aspect: |
          Boundary on the variance_pct metric via POST /manifests/{id}/receive:
          the exception test is strict (>). Shipped 2500 gal at density 8.0 =>
          10.00 est tons; received 11.00 => variance exactly 10.00 => RECEIVED,
          while received 11.01 => 10.10 => EXCEPTION.
        test_recipe:
          setup:
            - "Profile WEIGHT basis, density 8.0, APPROVED; facility cap 1000t; VACUUM job IN_PROGRESS"
            - "Manifest A est 2500 gal ISSUED + IN_TRANSIT; manifest B est 2500 gal ISSUED + IN_TRANSIT"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Bayport Terminal" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/disposal-facilities", payload: { name: "Gulf Coast TSDF", epa_id: "TXD0001", total_capacity_tons: 1000 }, as: PlatformAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /v1/waste-profiles", payload: { site_id: "${site_id}", facility_id: "${fac_id}", waste_code: "D008", hazard_class: "HAZ", density_lbs_per_gal: 8.0, disposal_rate_per_ton_cents: 35000, variance_basis: "WEIGHT" }, as: ComplianceOfficer, captures: { prof_id: $.data.id } }
            - { call: "POST /v1/waste-profiles/${prof_id}/submit", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /v1/waste-profiles/${prof_id}/approve", payload: {}, as: EnvironmentalApprover, as_user_id: "ea_1" }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Boundary job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["CHEMICAL_EXPOSURE"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests", payload: { job_id: "${job_id}", waste_profile_id: "${prof_id}", estimated_gallons: 2500 }, as: ProjectManager, captures: { man_a: $.data.id } }
            - { call: "POST /v1/manifests/${man_a}/issue", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests/${man_a}/depart", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests", payload: { job_id: "${job_id}", waste_profile_id: "${prof_id}", estimated_gallons: 2500 }, as: ProjectManager, captures: { man_b: $.data.id } }
            - { call: "POST /v1/manifests/${man_b}/issue", payload: {}, as: ProjectManager }
            - { call: "POST /v1/manifests/${man_b}/depart", payload: {}, as: ProjectManager }
          trigger:
            - { call: "POST /v1/manifests/${man_a}/receive", payload: { received_tons: 11.0 }, as: ProjectManager, captures: { man_a_status: $.data.status, man_a_var: $.data.variance_pct } }
            - { call: "POST /v1/manifests/${man_b}/receive", payload: { received_tons: 11.01 }, as: ProjectManager, captures: { man_b_status: $.data.status, man_b_var: $.data.variance_pct } }
          assert:
            - "man_a_var == 10.0 and man_a_status == RECEIVED (exactly 10.00 does NOT trigger the > 10.00 exception)"
            - "man_b_var == 10.1 and man_b_status == EXCEPTION (10.10 > 10.00)"

      - name: downtime_duration_equal_to_grace_bills_zero
        grounds:
          - calculations.downtime_billing
          - entities.DowntimeEvent.fields.grace_minutes_applied
        distinguishing_aspect: |
          Boundary on the duration metric via POST /downtime-events/{id}/close
          (a different endpoint and metric than the variance boundary): a
          CUSTOMER_DELAY event of exactly 30 minutes equals the 30-minute grace
          and bills max(0, 30-30) = 0 minutes, 0 blocks, 0 cents — billable only
          when duration strictly exceeds grace.
        test_recipe:
          setup:
            - "VACUUM UNIT_RATE job IN_PROGRESS on schedule S-A; downtime CUSTOMER_DELAY opened at clock 00:00"
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "VAC-01", unit_type: "VAC_TRUCK", max_pressure_psi: 3000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "VACUUM", pricing_mode: "UNIT_RATE", description: "Grace boundary job" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
            - { call: "POST /v1/assignments/${asg_id}/confirm", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/schedule", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jobs/${job_id}/mobilize", payload: {}, as: ProjectManager }
            - { call: "POST /v1/jhas", payload: { job_id: "${job_id}", confined_space: false, hazards: ["SLIP_TRIP"] }, as: FieldSupervisor, as_user_id: "fs_1", captures: { jha_id: $.data.id } }
            - { call: "POST /v1/jhas/${jha_id}/submit", payload: {}, as: FieldSupervisor, as_user_id: "fs_1" }
            - { call: "GET /v1/jobs/${job_id}", payload: {}, as: ProjectManager, captures: { job_v: $.data.version } }
            - { call: "POST /v1/jhas/${jha_id}/approve", payload: { expected_job_version: "${job_v}" }, as: SafetyManager, as_user_id: "sm_1" }
            - { call: "POST /v1/jobs/${job_id}/start-work", payload: {}, as: ProjectManager }
            - { call: "POST /v1/downtime-events", payload: { job_id: "${job_id}", cause: "CUSTOMER_DELAY" }, as: FieldSupervisor, as_user_id: "fs_1", captures: { e1: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:30:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/downtime-events/${e1}/close", payload: {}, as: FieldSupervisor, as_user_id: "fs_1", captures: { dur: $.data.duration_minutes, grace: $.data.grace_minutes_applied, bill: $.data.billable_minutes, amt: $.data.billed_amount_cents } }
          assert:
            - "dur == 30 and grace == 30 (duration exactly equals grace)"
            - "bill == 0 and amt == 0 (strict excess over grace required to bill)"
            - "DowntimeEvent.${e1}.status == CLOSED and Job.${job_id}.standby_accrued_cents == 0"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_work_requires_approved_jha
        grounds:
          - state_machines.Job.MOBILIZED_to_IN_PROGRESS
          - validations[priority=8]
          - errors[ERR_JHA_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair Job -> JobHazardAnalysis: the job's MOBILIZED->IN_PROGRESS
          transition is legal only while a sibling JHA entity sits in APPROVED;
          with the JHA merely SUBMITTED the transition fails.
        test_recipe:
          setup: ["COMBINED job MOBILIZED; JHA SUBMITTED (never approved)"]
          setup_api_calls:
            - { call: "POST /v1/sites", payload: { name: "Acme Refining" }, as: AccountManager, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /v1/rate-schedules", payload: { site_id: "${site_id}", label: "S-A", vacuum_per_gallon_cents: 250, hydroblast_per_foot_cents: 1800, labor_rate_cents_per_hour: 14500, equipment_rate_cents_per_hour: 22000, standby_rate_cents_per_hour: 12000, overtime_multiplier: 1.5, minimum_invoice_cents: 75000 }, as: AccountManager, captures: { sched_id: $.data.id } }
            - { call: "POST /v1/rate-schedules/${sched_id}/activate", payload: { expected_site_version: "${site_v}" }, as: AccountManager }
            - { call: "POST /v1/equipment-units", payload: { unit_code: "COMBO-01", unit_type: "COMBO", max_pressure_psi: 10000, tank_capacity_gal: 5000 }, as: PlatformAdmin, captures: { unit_id: $.data.id } }
            - { call: "POST /v1/jobs", payload: { site_id: "${site_id}", job_type: "COMBINED", pricing_mode: "UNIT_RATE", description: "Cross-entity A" }, as: ProjectManager, captures: { job_id: $.data.id } }
            - { call: "POST /v1/assignments", payload: { job_id: "${job_id}", resource_kind: "EQUIPMENT", equipment_unit_id: "${unit_id}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T14:00:00Z" }, as: ProjectManager, captures: { asg_id: $.data.id } }
