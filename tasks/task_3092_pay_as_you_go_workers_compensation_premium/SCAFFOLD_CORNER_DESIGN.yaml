      - name: stale_version_on_dispute_decide
        claim_type: Triggerability
        grounds: ['errors.ERR_STALE_VERSION', 'concurrency_rules.dispute-decide-stale-policy']
        distinguishing_aspect: "Covered as the winning error of the §1.8 priority-conflict instance."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / dispute_decide_sod_vs_stale_version_priority
          rationale: "That instance triggers ERR_STALE_VERSION on POST /wc/disputes/ID/decide with a deliberately decremented expected_policy_version."

