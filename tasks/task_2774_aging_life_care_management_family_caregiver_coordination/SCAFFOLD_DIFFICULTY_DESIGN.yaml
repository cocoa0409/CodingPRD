              captures: { te: $.data.id }
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "SUBMITTED" }
              as: CareManager
              as_user_id: "${cm_dana}"
            - call: "PATCH /care/time-entries/${te}/state"
              payload: { to_state: "APPROVED" }
              as: PracticeSupervisor
              as_user_id: "${cm_iris}"
            - call: "POST /care/invoices"
              payload: { client_id: "${cli}", period_start: "2026-08-01", period_end: "2026-08-31" }
              as: BillingAdministrator
              captures: { inv: $.data.id }
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "ISSUED" }
              as: BillingAdministrator
              captures: { drawn: $.data.retainer_applied_cents }
          trigger:
            - call: "PATCH /care/invoices/${inv}/state"
              payload: { to_state: "VOIDED", reason: "Billed against the wrong engagement letter." }
              as: BillingAdministrator
          assert:
            - "Before the trigger: Invoice.${inv}.status == ISSUED, total_due_cents == 75836, retainer_applied_cents == 60000, balance_due_cents == 15836"
            - "Before the trigger: Client.${cli}.retainer_balance_cents == 0, Client.${cli}.status == SUSPENDED_NONPAYMENT, Client.${cli}.unbilled_accrual_cents == 0"
            - "Before the trigger: ServiceAuthorization.${auth}.auth_status == SUSPENDED with suspension_reason == NONPAYMENT and Client.${cli}.authorized_coverage_hours == 0"
            - "Hop 1 — Invoice.${inv}.status == VOIDED and Invoice.${inv}.voided_reason == 'Billed against the wrong engagement letter.'"
            - "Hop 2 — TimeEntry.${te}.status == APPROVED and TimeEntry.${te}.invoice_id == null"
            - "Hop 3 — Client.${cli}.retainer_balance_cents == 60000 and Client.${cli}.unbilled_accrual_cents == 70875"
            - "Hop 4 — Client.${cli}.status == ACTIVE_CARE (60000 >= retainer_floor_cents 50000)"
            - "Hop 5 — ServiceAuthorization.${auth}.auth_status == ACTIVE, suspension_reason == NONE, Client.${cli}.authorized_coverage_hours == 8"
            - "Client.${cli}.retainer_deposits_total_cents == 60000 both before and after the trigger"

