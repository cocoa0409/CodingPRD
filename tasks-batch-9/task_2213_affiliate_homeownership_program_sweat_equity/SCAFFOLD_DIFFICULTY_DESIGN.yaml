  - rule_id: boundary_precision_check
    instances:

      - name: subsidy_available_one_cent_below_versus_exactly_equal_to_silent_second
        metric: "AffiliateProgram.subsidy_available_cents measured against MortgageApplication.silent_second_amount_cents (money threshold, >= admits equality)"
        endpoint: "POST /homeownership/mortgage-applications/{id}/approve"
        grounds:
