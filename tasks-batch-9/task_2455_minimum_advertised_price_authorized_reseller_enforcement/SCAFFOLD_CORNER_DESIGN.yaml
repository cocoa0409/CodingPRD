              payload: { decision: "REJECT", decision_reason: "Campaign not funded" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
          assert:
            - "HTTP 200"
            - "PricingException.${exc}.status == REJECTED"
            - "PricingException.${exc}.override_floor_cents == null"
            - "PricingException.${exc}.decision_reason == 'Campaign not funded'"
            - "PricingException.${exc}.approved_by_user_id == 'counsel-1'"
            - "Product.${prod}.open_exception_count == 0"

      - name: exception_approved_to_expired_lowers_open_exception_count
        claim_type: valid_transition
        grounds: ["state_machines.PricingException.transitions.APPROVED_to_EXPIRED"]
        distinguishing_aspect: "Sweeping at 2026-08-25 (exactly ends_at, which satisfies ends_at <= now) expires the exception and returns open_exception_count to 0."
        test_recipe:
          setup: ["APPROVED exception over [2026-08-10, 2026-08-25) with override_floor 13000; open_exception_count 1; clock advanced to 2026-08-25T00:00:00Z."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *EXC13000
            - *EXCAPPROVE
            - &CLK0825
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /enforcement-sweeps"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { expexc: $.data.expired_exceptions }
          assert:
            - "HTTP 200"
            - "${expexc} == 1"
            - "PricingException.${exc}.status == EXPIRED"
            - "Product.${prod}.open_exception_count == 0"

      - name: exception_approved_to_voided_when_product_is_discontinued
        claim_type: valid_transition
        grounds: ["state_machines.PricingException.transitions.to_VOIDED"]
        distinguishing_aspect: "PATCH /products setting lifecycle_status DISCONTINUED voids the APPROVED exception with decision_reason PRODUCT_DISCONTINUED and decrements open_exception_count back to 0."
        test_recipe:
          setup: ["APPROVED exception on product SKU-AUDIO-1 with open_exception_count 1."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *EXC13000
            - *EXCAPPROVE
          trigger:
            - call: "PATCH /products/${prod}"
              payload: { lifecycle_status: "DISCONTINUED" }
              as: BrandChannelManager
              as_user_id: "bcm-1"
          assert:
            - "HTTP 200"
            - "Product.${prod}.lifecycle_status == DISCONTINUED"
            - "PricingException.${exc}.status == VOIDED"
            - "PricingException.${exc}.decision_reason == 'PRODUCT_DISCONTINUED'"
            - "Product.${prod}.open_exception_count == 0"

      # --- SerialUnit (3 transitions) ---------------------------------------
      - name: serial_unit_shipped_to_distributor_to_shipped_to_reseller
        claim_type: valid_transition
        grounds: ["state_machines.SerialUnit.transitions.SHIPPED_TO_DISTRIBUTOR_to_SHIPPED_TO_RESELLER"]
        distinguishing_aspect: "ship-downstream is authorized only for the distributor named on shipped_distributor_id and requires the target reseller's supply_status to be OPEN; it stamps downstream_reseller_id and shipped_downstream_at."
        test_recipe:
          setup: ["Reseller Acme AUTHORIZED / OPEN; serial SN-0002 in SHIPPED_TO_DISTRIBUTOR held by Northwind."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *DISTNW
            - *SU0002
          trigger:
            - *SU0002SHIP
          assert:
            - "HTTP 200"
            - "SerialUnit.${su2}.status == SHIPPED_TO_RESELLER"
            - "SerialUnit.${su2}.downstream_reseller_id == ${res}"
            - "SerialUnit.${su2}.shipped_downstream_at == '2026-08-01T00:00:00.000Z'"
            - "SerialUnit.${su2}.traced_at == null"

      - name: serial_unit_to_traced_unauthorized_flags_downstream_reseller_for_review
        claim_type: valid_transition
        grounds: ["state_machines.SerialUnit.transitions.to_TRACED_UNAUTHORIZED", "calculations.reseller_review_required"]
        distinguishing_aspect: "Confirming a test purchase UNAUTHORIZED traces the unit even from SHIPPED_TO_RESELLER, stamps traced_at, and flips the downstream reseller's review_required to true."
        test_recipe:
          setup: ["Serial SN-0002 SHIPPED_TO_RESELLER to Acme (review_required false); unmatched grey listing with a SERIAL_CAPTURED test purchase naming SN-0002."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *RESACME
            - *AGRNEW
            - *AGRSEND
            - *AGRSIGN
            - *AGRACT
            - *DISTNW
            - *SU0002
            - *SU0002SHIP
            - *CLK0820
            - *OBSGREY
            - &TPNEW
              call: "POST /test-purchases"
              payload: { observation_id: "${obsg}", ordered_at: "2026-08-19T00:00:00Z", purchase_price_cents: 9000 }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { tp: $.data.id }
            - &TPCAP2
              call: "POST /test-purchases/${tp}/serial-capture"
              payload: { serial_number: "SN-0002" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
          trigger:
            - &TPCONF2
              call: "POST /test-purchases/${tp}/confirm-outcome"
              payload: { outcome: "UNAUTHORIZED", outcome_reason: "Storefront is not an authorized reseller" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
          assert:
            - "HTTP 200"
            - "SerialUnit.${su2}.status == TRACED_UNAUTHORIZED"
            - "SerialUnit.${su2}.traced_at == '2026-08-20T00:00:00.000Z'"
            - "Reseller.${res}.review_required == true"
            - "PriceObservation.${obsg}.unauthorized_seller_confirmed == true"

      - name: serial_unit_shipped_to_reseller_to_recalled_on_agreement_termination
        claim_type: valid_transition
        grounds: ["state_machines.SerialUnit.transitions.SHIPPED_TO_RESELLER_to_RECALLED"]
        distinguishing_aspect: "RECALLED is the SerialUnit terminal state and is reached only through the agreement's TERMINATED cascade, four links downstream of the TERMINATION notice."
        test_recipe:
          setup: ["Serial SN-0002 SHIPPED_TO_RESELLER to Acme; ladder driven so a TERMINATION notice can be issued by counsel-1."]
