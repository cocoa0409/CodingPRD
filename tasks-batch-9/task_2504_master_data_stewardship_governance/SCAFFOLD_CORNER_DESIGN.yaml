      - name: survivorship_recency_component_decays_then_floors_at_zero
        claim_type: Correct Result
        grounds:
          - calculations.master_record_survivorship_score
          - calculations.master_record_survivorship_score.constants.RECENCY_DECAY_PER_MONTH
        distinguishing_aspect: "The recency component steps down in whole 30-day buckets (floor), not continuously, and is clamped at 0 instead of going negative: 17 days stale keeps the full 20, exactly 30 days costs 4, and 212 days would cost 28 but stops at 0 - never pushing the total below trust + completeness."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; domain CUSTOMER (expected_attribute_count 5) with an ACTIVE DATA_STEWARD assignment; CERTIFIED source ERP with trust_tier 4; three records each carrying all 5 attributes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
          trigger:
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-CUST-FRESH", attributes: { legal_name: "Fresh Co", tax_id: "TX-1", billing_city: "Ames", contact_email: "f@x.test", duns: "1-1" }, last_verified_at: "2026-07-15T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { fresh_score: $.data.survivorship_score, fresh_comp: $.data.completeness_pct }
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-CUST-30D", attributes: { legal_name: "Thirty Co", tax_id: "TX-2", billing_city: "Boone", contact_email: "t@x.test", duns: "2-2" }, last_verified_at: "2026-07-02T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { thirty_score: $.data.survivorship_score }
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-CUST-STALE", attributes: { legal_name: "Stale Co", tax_id: "TX-3", billing_city: "Clive", contact_email: "s@x.test", duns: "3-3" }, last_verified_at: "2026-01-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { stale_score: $.data.survivorship_score }
          assert:
            - "${fresh_comp} == 100.00 for all three records (5 of 5 expected attributes), so complete_component is round(100.00 * 0.40, 2) == 40.00 and trust_component is 4 * 10 == 40"
            - "${fresh_score} == 100.00 - 17 whole days is floor(17 / 30) == 0 buckets, recency 20"
            - "${thirty_score} == 96.00 - exactly 30 whole days is 1 bucket, recency 20 - 4 == 16"
            - "${stale_score} == 80.00 - 212 whole days is 7 buckets, 20 - 28 == -8 clamped to 0, so the total stops at 40 + 40.00"

      - name: open_finding_weight_recounts_only_the_open_status_set
        claim_type: aggregation
        grounds:
          - calculations.governed_counter_reconciliation
          - entities.Domain.fields.open_finding_weight
          - entities.Steward.fields.open_finding_load
        distinguishing_aspect: "The conserved counters are whole-table recounts under explicit status filters, so two findings born in one run sum to 9.00 in ascending rule_code order regardless of arithmetic order, while Steward.open_finding_load counts only REMEDIATION_PLANNED rows and therefore stays 0 while both findings are merely OPEN."
        test_recipe:
          setup:
            - "DRAFT-STEWARDED domain CUSTOMER with ACTIVE rules QR1 (40 pts, threshold 90.00, HIGH) and QR2 (60 pts, threshold 80.00, LOW); a single PROVISIONAL run breaches both."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "HIGH" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr1_id: $.data.id }
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${std_id}", rule_code: "QR2", dimension: "TIMELINESS", weight_points: 60, threshold_pct: 80.00, severity: "LOW" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr2_id: $.data.id }
          trigger:
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "PROVISIONAL", measurements: [{ rule_code: "QR2", measured_pct: 40.00 }, { rule_code: "QR1", measured_pct: 45.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run_id: $.data.id, run_findings: $.data.findings_created_count, run_score: $.data.weighted_score }
            - call: "GET /mdm/quality-findings?scorecard_run_id=${run_id}&quality_rule_id=${qr1_id}"
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { f1_weight: "$.data[0].severity_weight" }
            - call: "GET /mdm/quality-findings?scorecard_run_id=${run_id}&quality_rule_id=${qr2_id}"
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { f2_weight: "$.data[0].severity_weight" }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_weight: $.data.open_finding_weight }
            - call: "GET /mdm/stewards/${std_id}"
              as: GovernanceAdmin
              captures: { std_load: $.data.open_finding_load }
          assert:
            - "${run_findings} == 2 and ${run_score} == 50.00 (round(40 * 45.00 / 90.00, 2) == 20.00 plus round(60 * 40.00 / 80.00, 2) == 30.00, over weight_total 100)"
            - "${f1_weight} == 8.00 (HIGH) and ${f2_weight} == 1.00 (LOW), both at multiplier 1.00"
            - "${dom_weight} == 9.00 - the sum is taken over the whole OPEN set, and the measurements were supplied out of rule_code order without affecting it"
            - "${std_load} == 0 - the load counter tracks REMEDIATION_PLANNED assignments only, not raw OPEN findings"

      - name: each_basis_writes_only_its_own_score_ledger_field
        claim_type: Reconciliation
        grounds:
