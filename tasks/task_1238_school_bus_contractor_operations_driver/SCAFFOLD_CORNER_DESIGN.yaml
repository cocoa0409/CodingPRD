  # ===========================================================================
  - section: validations
    instances:
      - name: create_contract_missing_header_and_bad_body_returns_400
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: "A request that is BOTH unauthenticated (no headers) and malformed (missing required fields) returns ERR_INVALID_REQUEST 400 — schema/format (priority 1) beats authentication (priority 2)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /busops/contracts", payload: { bid_reference: "BID-BAD" }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST (malformed body wins over missing auth)"
            - "HTTP status 400"
            - "test harness sends this request WITHOUT X-User-Role/X-User-ID headers"
      - name: list_buses_missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A well-formed request with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED 401."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /busops/buses", as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_UNAUTHENTICATED"
            - "HTTP status 401"
            - "test harness omits auth headers for this call"
      - name: create_contract_forbidden_role_driver_returns_403
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - "errors[ERR_FORBIDDEN_ROLE]"
        distinguishing_aspect: "Driver is not in POST /busops/contracts roles -> ERR_FORBIDDEN_ROLE 403 before any existence check on district_id."
        test_recipe:
          setup: ["district exists; driver exists"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-VAL3", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
