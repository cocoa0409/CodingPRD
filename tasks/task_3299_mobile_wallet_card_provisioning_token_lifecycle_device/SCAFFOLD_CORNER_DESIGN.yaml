              as_user_id: "${ch_id}"
              captures: { s2v: $.data.version }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${s2}/tokenize"
              payload: { expected_session_version: "${s2v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { tok2_id: $.data.id }
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Any
              captures: { dv1: $.data.version }
          trigger:
            - call: "POST /devices/${dev_id}/default-card"
              payload: { token_id: "${tok_id}", expected_device_version: "${dv1}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { dv2: $.data.version, def1: $.data.default_card_id }
            - call: "POST /devices/${dev_id}/default-card"
              payload: { token_id: "${tok2_id}", expected_device_version: "${dv2}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { def2: $.data.default_card_id }
          assert:
            - "def1 == ${tok_id}"
            - "def2 == ${tok2_id} — the second set replaced the first"
            - "both tokens remain ACTIVE"

      - name: provisioning_create_replays_on_same_idempotency_key
        claim_type: Computed read
        grounds:
          - validations.priority_7
          - errors.ERR_IDEMPOTENCY_CONFLICT
        distinguishing_aspect: "Same idempotency_key + same artifact returns the ORIGINAL session (201-replay with identical id); same key with a different artifact id is 409 ERR_IDEMPOTENCY_CONFLICT."
        test_recipe:
          setup: ["HEALTHY device, issuer ACTIVE, two artifacts on one account."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - call: "POST /card-artifacts"
              payload: { card_account_id: "${acct_id}", pan_last4: "6666", expiry: "0931", embossing_name: "ADA BYERS" }
              as: IssuerOperator
              captures: { art3_id: $.data.id }
            - *sess
          trigger:
            - call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${art_id}", idempotency_key: "prov-a" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { replay_id: $.data.id }
          assert:
            - "replay_id == ${sess_id} — same key + same payload replays the original session"
            - "note: a different payload under the same key is rejected (tested in errors section)"

      - name: reissue_creates_successor_and_deactivates_old_tokens
        claim_type: Conditional action
        grounds:
          - state_machines.CardAccount.OPEN_to_REISSUED
          - endpoints.POST_/card-accounts/{cardAccountId}/reissue
        distinguishing_aspect: "Reissue is conditional on non-terminal account state and returns the SUCCESSOR (201) with reissue_of_account_id pointing back; the old account is REISSUED and its tokens DEACTIVATED with reason CARD_REISSUE."
        test_recipe:
          setup: ["Standard OPEN account with ACTIVE token."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
          trigger:
            - call: "POST /card-accounts/${acct_id}/reissue"
              payload: {}
              as: IssuerOperator
              captures: { succ_id: $.data.id, succ_status: $.data.status, succ_ref: $.data.reissue_of_account_id }
          assert:
            - "response 201; succ_status == OPEN and succ_ref == ${acct_id}"
            - "GET /card-accounts/${acct_id} shows status REISSUED"
            - "PaymentToken.${tok_id}.status == DEACTIVATED and deactivated_reason == CARD_REISSUE"
            - "reprovisioning on the successor account yields a new ACTIVE token (POST artifact + session + verify x2 + tokenize succeeds)"

      - name: token_events_list_is_append_only_audit_trail
        claim_type: Computed read
        grounds:
          - entities.TokenEvent
          - endpoints.GET_/payment-tokens/{id}/events
        distinguishing_aspect: "The token's event log accumulates one entry per lifecycle action in order: ACTIVATION then AUTHORIZATION_APPROVED then SUSPENSION — events are never reordered or deleted."
        test_recipe:
          setup: ["Standard ACTIVE token."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
          trigger:
            - call: "POST /payment-tokens/${tok_id}/authorizations"
              payload: { cryptogram: "cgm-ev", amount_cents: 1000, currency: "USD", merchant_id: "m-1", merchant_category: "GENERAL", biometric_verified: true }
              as: IssuerOperator
            - call: "POST /devices/${dev_id}/tokens/${tok_id}/suspend"
              payload: {}
              as: Cardholder
              as_user_id: "${ch_id}"
            - call: "GET /payment-tokens/${tok_id}/events"
              payload: {}
              as: Any
          assert:
            - "3 events in order: ACTIVATION, AUTHORIZATION_APPROVED, SUSPENSION"
            - "each event carries payment_token_id == ${tok_id}"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_is_fixed
        claim_type: violation_to_error
        grounds:
          - response_envelope
          - errors.ERR_VALIDATION
        distinguishing_aspect: "Every error response uses the fixed envelope: response_type error, data.error_id, data.message, meta.api_request_id — verified on a trivially-triggered 400."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - *c0
          trigger:
            - call: "POST /cardholders"
              payload: { legal_name: "No Email" }
              as: Any
              captures: { e: $.data.error_id }
          assert:
            - "response 400; response_type == error"
            - "data.error_id == ERR_VALIDATION and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: idempotency_conflict_on_reused_key_with_different_payload
        claim_type: violation_to_error
        grounds:
          - errors.ERR_IDEMPOTENCY_CONFLICT
          - validations.priority_7
        distinguishing_aspect: "Same device + same idempotency_key + different card_artifact_id -> 409 ERR_IDEMPOTENCY_CONFLICT; the original session is untouched."
        test_recipe:
          setup: ["HEALTHY device, issuer ACTIVE, two artifacts; one session created with key prov-a."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - call: "POST /card-artifacts"
              payload: { card_account_id: "${acct_id}", pan_last4: "6666", expiry: "0931", embossing_name: "ADA BYERS" }
              as: IssuerOperator
              captures: { art3_id: $.data.id }
            - *sess
          trigger:
            - call: "POST /devices/${dev_id}/provisioning-sessions"
              payload: { card_artifact_id: "${art3_id}", idempotency_key: "prov-a" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e: $.data.error_id }
          assert:
            - "response 409 and e == ERR_IDEMPOTENCY_CONFLICT"
            - "ProvisioningSession.${sess_id} unchanged (still VERIFICATION_REQUIRED)"

      - name: third_otp_mismatch_fails_session
        claim_type: violation_to_error
        grounds:
          - errors.ERR_OTP_MISMATCH
          - state_machines.ProvisioningSession.VERIFICATION_REQUIRED_to_FAILED
        distinguishing_aspect: "Each wrong code returns 409 ERR_OTP_MISMATCH; the third consecutive mismatch additionally moves the session to FAILED, after which verify returns ERR_INVALID_STATE instead."
        test_recipe:
          setup: ["Standard session in VERIFICATION_REQUIRED."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
          trigger:
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/verify"
              payload: { method: "OTP_TEXT", code: "000000" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e1: $.data.error_id }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/verify"
              payload: { method: "OTP_TEXT", code: "000000" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e2: $.data.error_id }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/verify"
              payload: { method: "OTP_TEXT", code: "000000" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e3: $.data.error_id }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/verify"
              payload: { method: "OTP_TEXT", code: "111111" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e4: $.data.error_id }
          assert:
            - "e1 == ERR_OTP_MISMATCH and e2 == ERR_OTP_MISMATCH and e3 == ERR_OTP_MISMATCH"
            - "after the third mismatch ProvisioningSession.${sess_id}.status == FAILED"
            - "e4 == ERR_INVALID_STATE — even the CORRECT code can no longer verify a FAILED session"

      - name: occ_stale_session_version_rejected_412
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[tokenize-stale-session-version]
          - errors.ERR_VERSION_CONFLICT
        distinguishing_aspect: "OCC: after verify advances the session version, tokenize carrying the pre-verify version fails 412 ERR_VERSION_CONFLICT; retry with the fresh version succeeds."
        test_recipe:
          setup: ["Standard session; version captured BEFORE the second verify."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - call: "GET /provisioning-sessions/${sess_id}"
              payload: {}
              as: Any
              captures: { stale_v: $.data.version }
            - *verB
          trigger:
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/tokenize"
              payload: { expected_session_version: "${stale_v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e: $.data.error_id }
            - call: "POST /devices/${dev_id}/provisioning-sessions/${sess_id}/tokenize"
              payload: { expected_session_version: "${sess_v}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { tok2: $.data.id }
          assert:
            - "first tokenize: 412 and e == ERR_VERSION_CONFLICT"
            - "second tokenize with the fresh version: 201 and a token id"

      - name: occ_stale_device_version_on_default_card_rejected_412
        claim_type: violation_to_error
        grounds:
          - concurrency_rules[device-default-stale-version]
          - errors.ERR_VERSION_CONFLICT
        distinguishing_aspect: "OCC on Device: a set-security between read and default-card bumps Device.version, so the stale expected_device_version fails 412."
        test_recipe:
          setup: ["Standard ACTIVE token; device version captured, then set-security bumps it."]
          setup_api_calls:
            - *c0
            - *ch
            - *iss
            - *agrA
            - *agrA_on
            - *act
            - *devs
            - *devs_sec
            - *acct
            - *art
            - *sess
            - *verA
            - *verB
            - *tokA
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Any
              captures: { dv_stale: $.data.version }
            - call: "POST /devices/${dev_id}/set-security"
              payload: { passcode_enabled: true, biometric_enabled: false }
              as: Cardholder
              as_user_id: "${ch_id}"
          trigger:
            - call: "POST /devices/${dev_id}/default-card"
              payload: { token_id: "${tok_id}", expected_device_version: "${dv_stale}" }
              as: Cardholder
              as_user_id: "${ch_id}"
              captures: { e: $.data.error_id }
          assert:
            - "response 412 and e == ERR_VERSION_CONFLICT"

      - name: every_catalogued_error_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors
        distinguishing_aspect: "Cross-check: every error id in §1.6 is produced by at least one §1.8/§1.9 instance or by a direct replay of its §1.4 row — the catalog has no dead entries."
        test_recipe:
          setup: ["Covered structurally: ERR_VALIDATION (entities/required+enum), ERR_NOT_FOUND family (not-found instance + priority-4 row), ERR_INVALID_STATE (terminal lockdown + double-suspend), ERR_IDEMPOTENCY_CONFLICT, ERR_VERSION_CONFLICT (two OCC instances), ERR_DEVICE_UNSECURED/LOST (priority pair + posture instance), ERR_TOKEN_NOT_ACTIVE (cascade + boundary instances), ERR_CARD_ACCOUNT_RESTRICTED (cross-entity + priority instances), ERR_CARD_HAS_OPEN_DISPUTES, ERR_PROVISIONING_SESSION_EXPIRED (boundary), ERR_OTP_MISMATCH, ERR_ISSUER_NOT_ACTIVE (agreement activation on offboarded issuer), ERR_AGREEMENT_REQUIRED, ERR_AGREEMENT_OVERLAP (1.8 overlap instance), ERR_TERMS_VALIDATION_FAILED (cap < floor), ERR_AUTHENTICATION_REQUIRED (biometric gate), ERR_AUTH_AMOUNT_EXCEEDS_CAP (1.8 fiscal pair), ERR_PROGRAM_AMOUNT_EXCEEDS_CAP, ERR_EXPRESS_TRANSIT_NOT_SUPPORTED, ERR_TRANSIT_NOT_ALLOWED, ERR_PROGRAM_NOT_ACTIVE / ERR_PROGRAM_INELIGIBLE (enrollment gates), ERR_DISPUTE_AMOUNT_MISMATCH, ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, ERR_FORBIDDEN."]
          setup_api_calls:
            - *c0
          trigger:
            - call: "POST /transit-operators"
              payload: { operator_code: "X", name: "x", flat_fare_cents: -1, express_cap_cents: 1000 }
              as: PlatformAdmin
              captures: { e: $.data.error_id }
          assert:
            - "negative flat_fare_cents fails priority-3 schema validation: e == ERR_VALIDATION (400)"

  # ===========================================================================
  - section: rbac
    instances:
