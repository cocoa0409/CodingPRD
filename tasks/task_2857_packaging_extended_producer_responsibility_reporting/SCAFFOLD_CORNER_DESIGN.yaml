      - name: redesign_projection_writes_nothing_and_isolates_the_fee_delta
        claim_type: forward_looking
        grounds:
          - calculations.redesign_fee_projection
          - endpoints.POST /epr/skus/{id}/redesign-projection
        distinguishing_aspect: "At BASELINE_UNITS the 100.00 g NOT_RECYCLABLE baseline prices at 10.000 * 42 * 1.60 = 672 cents and the 60.00 g READILY_RECYCLABLE 30%-PCR candidate at 6.000 * 42 * 0.85 = 214 cents, so fee_delta_cents is -458 while the SKU's version, revision_count and the producer rollup are all unchanged."
        test_recipe:
          setup:
            - "Program CA, one producer with an ACTIVE 100 x 100.00 g NOT_RECYCLABLE PLASTIC SKU, and one DRAFT PLASTIC fee schedule (projection reads rates regardless of schedule status)."
          setup_api_calls:
            - call: "POST /epr/state-programs"
              payload: { state_code: "CA", obligation_basis: "ENTITY_LEVEL", eco_mod_policy: "BONUS_MALUS", fee_rounding_order: "PER_LINE_THEN_SUM", small_producer_revenue_threshold_usd: 1000000, small_producer_tonnage_threshold_kg: 1.000, exempt_product_categories: [], verification_required_threshold_kg: 3000, registration_deadline: "2026-12-31T23:59:59Z" }
