      - name: rolling_load_exactly_at_the_permit_limit_is_watch_not_exceedance
        claim_type: threshold
        grounds:
          - calculations.effluent_rolling_compliance
          - calculations.effluent_rolling_compliance.variants.ratio_exactly_one
          - calculations.effluent_rolling_compliance.constants.WATCH_RATIO
          - entities.EffluentPermit.fields.compliance_posture
        distinguishing_aspect: "The two in-window readings average to exactly 500.000 kg/day against a 500.00 limit, so bod_ratio is exactly 1.00 — the EXCEEDANCE test is strict (>) so the posture must be WATCH. The same reading's flow of 9000.00 sits exactly on flow_limit_m3_per_day, which likewise must NOT count as an exceedance day, so exceedance_day_count stays 0. Two inclusive/exclusive boundaries in one call, both resolved the permissive way."
        test_recipe:
          setup: ["Permit MILL-NPDES-1 with bod_limit 500.00, tss_limit 400.00, flow_limit 9000.00 and a 30-day window, carrying one reading on 2026-07-15 of flow 8000.00 / bod 400.00 / tss 100.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
            - call: "POST /effluent-permits"
              payload: { permit_number: "MILL-NPDES-1", bod_limit_kg_per_day: 500.00, tss_limit_kg_per_day: 400.00, flow_limit_m3_per_day: 9000.00, rolling_window_days: 30 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
              captures: { permit_id: "$.data.id" }
            - call: "POST /effluent-permits/${permit_id}/readings"
              payload: { reading_date: "2026-07-15", flow_m3: 8000.00, bod_kg: 400.00, tss_kg: 100.00 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
          trigger:
            - call: "POST /effluent-permits/${permit_id}/readings"
              payload: { reading_date: "2026-08-01", flow_m3: 9000.00, bod_kg: 600.00, tss_kg: 100.00 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
          assert:
            - "HTTP status is 201"
            - "response.data.voided == false"
            - "response.data.logged_by_user_id == 'env-a'"
            - "GET /effluent-permits/${permit_id} as EnvironmentalOfficer reports rolling_bod_kg_per_day == 500.000, rolling_tss_kg_per_day == 100.000, exceedance_day_count == 0, compliance_posture == 'WATCH'"

      - name: rolling_window_is_inclusive_at_both_ends_and_two_flow_days_force_exceedance
        claim_type: interval_merge
        grounds:
          - calculations.effluent_rolling_compliance
          - calculations.effluent_rolling_compliance.input_set
          - calculations.effluent_rolling_compliance.constants.EXCEEDANCE_DAY_TRIGGER
          - entities.EffluentPermit.fields.exceedance_day_count
        distinguishing_aspect: "Anchored on 2026-08-01 with a 30-day window, d_min is 2026-07-03: the 07-03 reading is INSIDE (inclusive lower bound) and the 07-02 reading with its 480.00 kg BOD load is OUTSIDE. rolling_bod_kg_per_day must therefore be 100.000 with n == 2, not 226.667 with n == 3, and days with no reading must not dilute the denominator. The two in-window flow breaches hit EXCEEDANCE_DAY_TRIGGER exactly, so the posture is EXCEEDANCE even though both load ratios are far below 0.90."
        test_recipe:
          setup: ["Permit MILL-NPDES-1 (limits 500.00 / 400.00 / 9000.00, 30-day window) with readings on 2026-07-02 (flow 9500.00, bod 480.00, tss 300.00) and 2026-07-03 (flow 9500.00, bod 100.00, tss 50.00)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
            - call: "POST /effluent-permits"
              payload: { permit_number: "MILL-NPDES-1", bod_limit_kg_per_day: 500.00, tss_limit_kg_per_day: 400.00, flow_limit_m3_per_day: 9000.00, rolling_window_days: 30 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
              captures: { permit_id: "$.data.id" }
            - call: "POST /effluent-permits/${permit_id}/readings"
              payload: { reading_date: "2026-07-02", flow_m3: 9500.00, bod_kg: 480.00, tss_kg: 300.00 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
              captures: { reading_out_id: "$.data.id" }
            - call: "POST /effluent-permits/${permit_id}/readings"
              payload: { reading_date: "2026-07-03", flow_m3: 9500.00, bod_kg: 100.00, tss_kg: 50.00 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
          trigger:
            - call: "POST /effluent-permits/${permit_id}/readings"
              payload: { reading_date: "2026-08-01", flow_m3: 9600.00, bod_kg: 100.00, tss_kg: 50.00 }
              as: EnvironmentalOfficer
              as_user_id: "env-a"
          assert:
            - "HTTP status is 201"
            - "GET /effluent-permits/${permit_id} as EnvironmentalOfficer reports rolling_bod_kg_per_day == 100.000, rolling_tss_kg_per_day == 50.000, exceedance_day_count == 2, compliance_posture == 'EXCEEDANCE'"
            - "GET /effluent-readings/${reading_out_id} as EnvironmentalOfficer reports voided == false (the out-of-window row still exists; it is excluded by the window, not by voiding)"

      - name: steam_waterfall_curtails_the_lowest_priority_request_to_the_remainder
        claim_type: waterfall_allocation
        grounds:
          - calculations.steam_waterfall_dispatch
          - calculations.steam_waterfall_dispatch.constants.HEADER_CAPACITY_TPH
          - calculations.steam_waterfall_dispatch.constants.MIN_VIABLE_TPH
          - calculations.cogen_credit
        distinguishing_aspect: "Two overlapping grants consume 160.000 of the 180.000 tph header, so the third request for 50.000 must be CURTAILED at exactly the 20.000 tph remainder (which is >= MIN_VIABLE_TPH, so it is not rejected) with curtailed_tph 30.000. Because the header ends up fully committed, export_tph is 0.000 and cogen_credit_usd must be 0.00 — the credit is computed on the export, not on the grant."
        test_recipe:
          setup: ["Two GRANTED steam allocations over 2026-08-01T06:00-12:00: a priority 1 DEINK_PLANT grant of 100.000 tph and a priority 2 EVAPORATOR grant of 60.000 tph."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnergyManager
              as_user_id: "energy-1"
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "DEINK_PLANT", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T12:00:00Z", demand_tph: 100.000, priority_rank: 1 }
              as: EnergyManager
              as_user_id: "energy-1"
              captures: { alloc_a: "$.data.id" }
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T12:00:00Z", demand_tph: 60.000, priority_rank: 2 }
              as: EnergyManager
              as_user_id: "energy-1"
              captures: { alloc_b: "$.data.id" }
          trigger:
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T10:00:00Z", demand_tph: 50.000, priority_rank: 3 }
              as: EnergyManager
              as_user_id: "energy-1"
          assert:
            - "HTTP status is 201"
            - "response.data.status == 'CURTAILED'"
            - "response.data.granted_tph == 20.000"
            - "response.data.curtailed_tph == 30.000"
            - "response.data.cogen_credit_usd == 0.00"
            - "GET /steam-allocations/${alloc_a} as EnergyManager reports granted_tph == 100.000, curtailed_tph == 0.000, status == 'GRANTED'"
            - "GET /steam-allocations/${alloc_b} as EnergyManager reports granted_tph == 60.000, curtailed_tph == 0.000, status == 'GRANTED', cogen_credit_usd == 492.00"

      - name: back_to_back_steam_windows_do_not_contend_because_the_interval_is_half_open
        claim_type: interval_merge
        grounds:
          - calculations.steam_waterfall_dispatch
          - calculations.steam_waterfall_dispatch.variants.half_open_vs_closed
          - calculations.steam_waterfall_dispatch.input_set
          - entities.SteamAllocation.fields.window_end
        distinguishing_aspect: "The header is fully committed to 180.000 tph over 06:00-12:00 and the new request starts exactly at 12:00. With half-open windows the overlap test (start < other.end AND end > other.start) is false, so consumed is 0.000 and the request is GRANTED in full at 50.000 tph with a 5817.00 cogen credit. A closed-interval implementation sees 180.000 consumed, remaining 0.000, and rejects with ERR_STEAM_HEADER_SATURATED — the mirror image of the machine-window rule at priority 63, where the same touching timestamps DO collide."
        test_recipe:
          setup: ["One GRANTED allocation holding the whole 180.000 tph header over 2026-08-01T06:00-12:00 at priority 1."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnergyManager
              as_user_id: "energy-1"
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "DEINK_PLANT", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T12:00:00Z", demand_tph: 180.000, priority_rank: 1 }
              as: EnergyManager
              as_user_id: "energy-1"
              captures: { alloc_a: "$.data.id" }
          trigger:
            - call: "POST /steam-allocations"
              payload: { consumer_kind: "EVAPORATOR", window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T18:00:00Z", demand_tph: 50.000, priority_rank: 2 }
              as: EnergyManager
              as_user_id: "energy-1"
          assert:
            - "HTTP status is 201"
            - "response.data.status == 'GRANTED'"
            - "response.data.granted_tph == 50.000"
            - "response.data.curtailed_tph == 0.000"
            - "response.data.cogen_credit_usd == 5817.00"
            - "GET /steam-allocations/${alloc_a} as EnergyManager reports granted_tph == 180.000 and cogen_credit_usd == 0.00"

      - name: cogen_credit_rounds_each_marginal_tier_to_four_places_before_summing
        claim_type: precision
        grounds:
          - calculations.cogen_credit
          - calculations.cogen_credit.variants.per_tier_then_total
          - calculations.cogen_credit.constants.TIER3_USD_PER_TPH_HOUR
          - entities.SteamAllocation.fields.cogen_credit_usd
        distinguishing_aspect: "A 70-minute window forces duration_hours to the rounded 1.1667 and an export of 65.000 tph straddles all three marginal bands (30 / 30 / 5). Rounding each tier product to 4dp first gives 143.5041 + 236.2568 + 53.6682 = 433.4291 -> 433.43; carrying the exact 7/6 hours and the unrounded products through to a single 2dp round gives 433.42. The cent difference isolates both the duration rounding and the per-tier rounding order."
        test_recipe:
          setup: ["One GRANTED priority 1 allocation of 100.000 tph spanning 2026-08-01T00:00-12:00, so the header has 80.000 tph of headroom during the requested window."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: EnergyManager
              as_user_id: "energy-1"
