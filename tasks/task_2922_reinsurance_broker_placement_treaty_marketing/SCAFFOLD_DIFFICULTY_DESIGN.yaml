            - call: "POST /claim-advocacies/${adv2}/collections"
              payload: { signing_line_id: "${sl_id}", amount_minor: 1000000000 }
              as: BrokerAccountant
              as_user_id: "acct-1"
              captures: { coll2: $.data.id }
          assert:
            - "${ceded1} == 600000000 and ${ceded2} == 1000000000"
            - "${eroded_after_first} == 600000000 and ${used_after_first} == 0"
            - "ClaimAdvocacy.${adv2}.status == COLLECTED  # link 1"
            - "Layer.${layer_id}.limit_eroded_minor == 1600000000  # link 2"
            - "Layer.${layer_id}.reinstatements_used == 1"
            - "ClaimAdvocacy.${adv2}.reinstatement_triggered == true"
            - "GET /fiduciary-transactions?program_id=${prog_id}&txn_type=REINSTATEMENT_PREMIUM returns exactly one row  # link 3"
            - "that row has amount_minor == 58275000, status == PENDING and signing_line_id == ${sl_id}"
            - "Cedent.${ced_id}.outstanding_reinstatement_premium_minor == 58275000  # link 4"
            - "Program.${prog_id}.fiduciary_holding_minor == 0  # PENDING movements never move the balance"

  # ===========================================================================
  # RULE 5 — priority-ordered validation conflicts, three DIFFERENT category pairs
  #   instance 1 : state (26)             vs business_safety (37)
  #   instance 2 : business_constraint (56) vs business_fiscal (67)
  #   instance 3 : business_temporal (46)   vs business_constraint (57)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: declined_quote_on_suspended_market_reports_quote_state_before_market_suspension
        grounds:
          - validations[priority=26]
          - validations[priority=37]
          - errors.ERR_QUOTE_STATE_INVALID
          - errors.ERR_MARKET_SUSPENDED
        distinguishing_aspect: |
          Category pair state (26) vs business_safety (37) on POST /quotes/{quote_id}/firm-order.
          The quote is DECLINED and its market is SUSPENDED, so both checks are live; the
          own-state check outranks the cross-entity safety check and ERR_QUOTE_STATE_INVALID
          must be reported. Instances 2 and 3 use different pairs.
        test_recipe:
          setup:
            - "One cedent, one market Golf Re, one PROPERTY program in placement_status IN_MARKET with one CATASTROPHE layer of limit_minor 1000000000."
            - "Golf Re quotes 50.0000 and then declines its own quote, so Quote.status is DECLINED (a terminal state)."
            - "Compliance then sets Golf Re security_status = SUSPENDED, so validations[priority=37] would also fire on a firm-order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
              as: PlatformAdmin
              captures: { ced_id: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Golf Re", security_rating: "A", capacity_limit_minor: 1000000000, max_line_pct: 50.0000, lead_authorised: true }
              as: PlatformAdmin
              captures: { golf_id: $.data.id }
            - call: "POST /programs"
              payload: { cedent_id: "${ced_id}", program_name: "Northwind Property CAT 2026", line_of_business: "PROPERTY", underwriting_year: 2026, inception_date: "2026-01-01T00:00:00.000Z", expiry_date: "2027-01-01T00:00:00.000Z", estimated_premium_income_minor: 2000000000, brokerage_pct: 2.5000 }
              as: BrokerPlacementLead
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/exposure-submissions"
              payload: { package_label: "NW-CAT-2026-EDP", exposure_records_count: 1000, data_quality_flags_count: 20, historical_years_supplied: 5, cat_model_version: "RMS-23.1", loss_history_completeness_pct: 90.0000, actuarial_report_attached: true }
              as: CedentUnderwriter
              as_user_id: "${ced_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /programs/${prog_id}/layers"
              payload: { layer_label: "PROP CAT 1B xs 2B", layer_type: "CATASTROPHE", attachment_minor: 2000000000, limit_minor: 1000000000, base_rate_pct: 8.0000, subject_premium_base_minor: 1250000000, expected_loss_cost_minor: 60000000, reinstatements_total: 1, reinstatement_premium_pct: 100.0000, sublimit_minor: 0 }
              as: BrokerPlacementLead
              captures: { layer_id: $.data.id }
            - call: "POST /exposure-submissions/${sub_id}/submit-for-review"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /exposure-submissions/${sub_id}/signoff"
              payload: { decision: "SIGNED_OFF" }
              as: BrokerActuary
            - call: "POST /programs/${prog_id}/go-to-market"
              payload: {}
              as: BrokerPlacementLead
            - call: "POST /layers/${layer_id}/market-submissions"
              payload: { reinsurer_id: "${golf_id}", response_deadline: "2026-02-01T00:00:00.000Z" }
              as: BrokerPlacementLead
              captures: { ms_id: $.data.id }
            - call: "POST /market-submissions/${ms_id}/quotes"
              payload: { offered_line_pct: 50.0000, quoted_rate_pct: 8.0000, ceding_commission_pct: 0.0000, reinstatements_offered: 1, sublimit_minor: 0, expires_at: "2026-02-15T00:00:00.000Z", is_lead: true }
              as: ReinsurerUnderwriter
              as_user_id: "${golf_id}"
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/decline"
              payload: { decline_reason: "aggregate full in this zone" }
              as: ReinsurerUnderwriter
              as_user_id: "${golf_id}"
            - call: "POST /reinsurers/${golf_id}/security-status"
              payload: { security_status: "SUSPENDED", reason: "rating downgrade below treaty minimum" }
              as: ComplianceOfficer
              as_user_id: "compl-1"
            - call: "GET /layers/${layer_id}"
              payload: {}
              as: BrokerPlacementLead
              captures: { lv1: $.data.version }
          trigger:
            - call: "POST /quotes/${quote_id}/firm-order"
              payload: { accepted_line_pct: 50.0000, expected_layer_version: "${lv1}" }
              as: BrokerPlacementLead
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and ${err} == ERR_QUOTE_STATE_INVALID"
            - "${err} != ERR_MARKET_SUSPENDED  # priority 26 outranks priority 37"
            - "Quote.${quote_id}.status == DECLINED and Quote.${quote_id}.accepted_line_pct == null"
            - "Reinsurer.${golf_id}.security_status == SUSPENDED"
            - "GET /layers/${layer_id}/signing-lines returns 0 rows"

      - name: oversized_line_on_tiny_market_reports_max_line_before_capacity
        grounds:
          - validations[priority=56]
          - validations[priority=67]
          - errors.ERR_LINE_EXCEEDS_MAX_LINE
          - errors.ERR_CAPACITY_EXCEEDED
          - calculations.reinsurer_aggregate_capacity
        distinguishing_aspect: |
          Category pair business_constraint (56) vs business_fiscal (67) on the same firm-order
          endpoint. Foxtrot Re has max_line_pct 25.0000 and capacity_limit_minor 100000000, so a
          30.0000 line on a 1000000000 layer breaches BOTH the per-layer line cap and the
          aggregate capacity gate (300000000 needed against 100000000 available); the constraint
          check must win. Instances 1 and 3 use different pairs.
        test_recipe:
          setup:
            - "One cedent, one market Foxtrot Re with max_line_pct 25.0000 and capacity_limit_minor 100000000."
            - "One PROPERTY program in placement_status IN_MARKET with a CATASTROPHE layer of limit_minor 1000000000."
            - "Foxtrot Re offers 30.0000 — offers are not capped at quote time — and the broker attempts to firm-order the whole offer, so accepted_line_pct == offered_line_pct and validations[priority=55] stays silent."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /cedents"
              payload: { name: "Northwind Mutual", domicile_code: "USNYC", financial_rating: "A" }
