  - rule_id: compensating_invariant
    instances:
      - name: accrual_reversal_restores_the_accrual_dollar_identity
        conserved_quantity: "accrual dollars — gross_accrued_amount == reversed_accrual_amount + consumed_deduction_amount + accrued_balance"
        grounds:
          - calculations.promotion_accrual_ledger
          - state_machines.AccrualEntry.status
          - calculations.allocation_ledger_rollup
          - endpoints.POST_/trade-marketing/accruals/{accrualId}/reverse
        distinguishing_aspect: |
          Reversing an accrual is a compensating write, not a delete. gross_accrued_amount must
          STAY at 2500.00 while reversed_accrual_amount rises to 2500.00, so accrued_balance
          returns to exactly 0.00 and the allocation's accrued_amount, which is
          gross minus reversed, returns to exactly 0.00 too. Every derived consequence unwinds
          with it: spend_ratio 1.0000 -> 0.0000 and spend_status OVERSPEND_WARNING ->
          WITHIN_BUDGET. Two wrong implementations are separated: one that deletes or mutates the
          original entry leaves gross_accrued_amount at 0.00 and loses the audit trail, and one
          that only appends the REVERSAL row without recomputing leaves accrued_balance at
          2500.00 and the promotion stuck on OVERSPEND_WARNING. Money must be conserved, not
          erased.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03."
            - "One program, brand and customer; one APPROVED allocation with planned_amount 100000.00 and planned_incremental_units 20000."
            - "One CONSUMPTION-basis promotion, window 2026-08-03 -> 2026-08-31, one TPR tactic of 2000 cases at rate_per_case 1.25 so planned_total_spend is 2500.00; APPROVED and LIVE."
            - "One CONSUMPTION volume fact of 2000 cases at period 2026-08-03."
            - "One accrual posted for period 2026-08-03 worth exactly 2500.00, which puts spend_ratio at 1.0000 and spend_status at OVERSPEND_WARNING (the ratio boundary is inclusive at 1.0000, not OVERSPENT)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
