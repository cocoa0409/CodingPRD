  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: suite_term_closed_interval_with_class_turnover_buffer
        grounds:
          - calculations.suite_term_conflict
          - validations[32]
          - validations[36]
          - errors.ERR_SUITE_TERM_CONFLICT
          - errors.ERR_SUITE_NOT_AVAILABLE
          - entities.Suite.fields.suite_class
        distinguishing_aspect: |
          RESOURCE: the Suite. INTERVAL SEMANTICS: CLOSED [term_start, term_end]
          with a symmetric class-dependent turnover buffer expanded around the
          INCUMBENT only — deliberately the opposite convention from the
          half-open shared-space sweep in the sibling instance. Four probes on
          four suites with identical incumbent terms of 2026-09-01 through
          2029-08-31 isolate the buffer: on a PROCEDURE suite (buffer 14) a
          candidate starting exactly 2029-09-14 conflicts because the buffered
          endpoint is inclusive, while one starting 2029-09-15 clears the term
          check and fails later on availability; on a STANDARD_EXAM suite (buffer
          0) the very same 2029-09-01 start is clean while 2029-08-31 conflicts
          because the closed interval includes the incumbent's last day.
        setup_note: |
          Each probe gets its OWN suite because calculations.suite_term_conflict
          counts FMV_CERTIFIED rows, so a rejected candidate left sitting in
          FMV_CERTIFIED on a shared suite would over-determine the next probe.
          Every candidate also needs a SIGNED_LEASE attestation, because priority
          28 is checked before priority 32.
        test_recipe:
          setup:
            - "One 100000 sf Building at 30.00 psf market with four suites: two 4000 sf PROCEDURE (buffer 14) and two 5000 sf STANDARD_EXAM (buffer 0)."
            - "One INDEPENDENT_PRACTICE incumbent tenant with four EXECUTED leases, one per suite, each running 2026-09-01 through 2029-08-31."
            - "One INDEPENDENT_PRACTICE candidate tenant with four leases, one per suite, each driven to FMV_CERTIFIED with SIGNED_LEASE on file and never executed."
