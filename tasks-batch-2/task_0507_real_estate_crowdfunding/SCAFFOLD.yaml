scenario: "507. Real Estate Investment Crowdfunding (Fundrise style): eREIT/fund & share class, investor suitability & limits, subscription & ACH funding, dividend distribution & DRIP, NAV/quarterly valuation, redemption queue & early-withdrawal penalty, K-1/1099-DIV, project-level reporting"
domain_name: real-estate-crowdfunding
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Funds own ShareClasses and Projects (hierarchy); Investor/Holding/Subscription/
  # RedemptionRequest/Distribution/TaxDocument are peer entities joined by FKs that
  # cross the Fund hierarchy (flat references). Hence hybrid.

  state_machine_shape: branching
  # Subscription: fork-join with divergent side-effect sets (SETTLED vs REVERSED vs
  # CANCELLED). RedemptionRequest: queue with branch (FULFILLED vs REJECTED) plus a
  # cyclic DEFERRED->QUEUED re-entry across redemption windows. Valuation drives
  # cross-entity NAV recompute. Not a linear pipeline.

  relationship_patterns:
    - one_to_many        # Fund -> ShareClass, Fund -> Project, Investor -> Holding
    - cross_aggregate    # Subscription references Investor + ShareClass; Distribution
                         # references Fund but allocates across Holdings of other investors
    - polymorphic        # TaxDocument.doc_type spans K-1 (partnership) vs 1099-DIV (REIT)

  role_model: segregation_of_duties
  # FundManager declares valuations/distributions and may NOT also be the
  # ComplianceOfficer who approves an investor's suitability; Investor acts only on
  # own subscriptions/redemptions; Operator (opaque) runs settlement/redemption sweeps.

  consistency_model: immediate
  # All cascades (settlement -> holding + fund derived fields; valuation -> NAV
  # recompute; distribution -> per-holding allocation) are atomic within the
  # triggering request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE
# ============================================================================
entities:
  - name: Fund
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "eREIT / fund display name"
        constraints: "non-empty"
      - name: vehicle_type
        type: enum
        source: input
        description: "Tax vehicle of the fund; determines tax document type generated"
        constraints: "one of {REIT, PARTNERSHIP}; REIT -> 1099-DIV, PARTNERSHIP -> K-1"
      - name: status
        type: enum
        source: system
        description: "Fund lifecycle / posture gating child operations"
        default: OPEN
        constraints: "one of {OPEN, CLOSED_TO_NEW, WINDING_DOWN}; managed by §1.2"
      - name: gross_asset_value_cents
        type: integer
        source: input
        description: "Latest appraised gross asset value in cents; set at create, overwritten by each posted Valuation"
        constraints: ">= 0"
      - name: total_liabilities_cents
        type: integer
        source: input
        description: "Latest total liabilities in cents; set at create, overwritten by each posted Valuation"
        constraints: ">= 0"
      - name: shares_outstanding
        type: number
        source: computed
        description: "Sum of shares_owned across all Holdings of this fund's share classes (4 dp); reconciled on every settle/redeem/DRIP cascade. See calc fund_shares_outstanding."
        default: 0
      - name: nav_per_share_cents
        type: integer
        source: computed
        description: "(gross_asset_value_cents - total_liabilities_cents) / shares_outstanding, round_half_up to whole cents. See calc nav_per_share."
        default: 1000
      - name: total_capital_cents
        type: integer
        source: computed
        description: "Running sum of settled subscription funded amounts minus redeemed gross values; conserved quantity for invariant capital_conservation."
        default: 0
      - name: current_valuation_seq
        type: integer
        source: system
        description: "Sequence number of the most recently posted Valuation; 0 before any valuation"
        default: 0

  - name: ShareClass
    parent: Fund
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id"
      - name: class_code
        type: string
        source: input
        description: "Share class code, unique within a fund"
        constraints: "non-empty; unique per (fund_id, class_code)"
      - name: min_investment_cents
        type: integer
        source: input
        description: "Minimum funded amount in cents for a single subscription against this class"
        constraints: ">= 0"
      - name: mgmt_fee_bps
        type: integer
        source: input
        description: "Annual management fee in basis points (informational; not deducted by this API)"
        constraints: "0..1000"
      - name: accredited_only
        type: boolean
        source: input
        description: "When true, only investors with accredited_status=ACCREDITED may subscribe"
        default: false
      - name: drip_eligible
        type: boolean
        source: input
        description: "When true, holders of this class may elect DRIP on distributions"
        default: true
      - name: status
        type: enum
        source: system
        description: "Share class offering status"
        default: OFFERING
        constraints: "one of {OFFERING, SUSPENDED, CLOSED}; managed by §1.2"

  - name: Project
    parent: Fund
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id"
      - name: name
        type: string
        source: input
        description: "Underlying real-estate project / asset name"
        constraints: "non-empty"
      - name: acquisition_cost_cents
        type: integer
        source: input
        description: "Acquisition cost of the asset in cents"
        constraints: ">= 0"
      - name: appraised_value_cents
        type: integer
        source: input
        description: "Most recent project-level appraised value in cents"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Project lifecycle for project-level reporting"
        default: ACQUIRED
        constraints: "one of {ACQUIRED, STABILIZED, DISPOSED}; managed by §1.2"

  - name: Investor
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Investor email; globally unique"
        constraints: "unique, non-empty"
      - name: full_name
        type: string
        source: input
        description: "Investor legal name"
        constraints: "non-empty"
      - name: accredited_status
        type: enum
        source: input
        description: "Self-declared accreditation at registration"
        default: NON_ACCREDITED
        constraints: "one of {NON_ACCREDITED, ACCREDITED}"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Declared annual income in cents (drives non-accredited annual cap)"
        constraints: ">= 0"
      - name: net_worth_cents
        type: integer
        source: input
        description: "Declared net worth in cents (drives non-accredited annual cap)"
        constraints: ">= 0"
      - name: suitability_status
        type: enum
        source: system
        description: "Compliance review outcome gating subscription"
        default: PENDING
        constraints: "one of {PENDING, APPROVED, REJECTED}; managed by §1.2"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer who approved/rejected suitability; null until reviewed"
      - name: ytd_invested_cents
        type: integer
        source: computed
        description: "Sum of funded_amount_cents over this investor's subscriptions that SETTLED in the current tax year; reset baseline for annual-cap check. See calc ytd_invested."
        default: 0

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id"
      - name: share_class_id
        type: string
        source: input
        description: "FK -> ShareClass.id"
      - name: funded_amount_cents
        type: integer
        source: input
        description: "ACH funding amount in cents the investor commits"
        constraints: ">= share class min_investment_cents"
      - name: drip_elected
        type: boolean
        source: input
        description: "Whether future distributions on the resulting holding reinvest (DRIP)"
        default: false
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle"
        default: PENDING_ACH
        constraints: "one of {PENDING_ACH, SETTLED, REVERSED, CANCELLED}; managed by §1.2"
      - name: provisional_nav_cents
        type: integer
        source: computed
        description: "Fund nav_per_share_cents captured at subscription creation (provisional pricing). See calc subscription_shares variant provisional."
      - name: settled_nav_cents
        type: integer
        source: computed
        description: "Fund nav_per_share_cents at ACH settlement (final pricing); null until SETTLED. See calc subscription_shares variant final."
      - name: shares_allocated
        type: number
        source: computed
        description: "Shares minted at settlement = round_half_up(funded_amount_cents / settled_nav_cents, 4); null until SETTLED."
      - name: ach_fee_cents
        type: integer
        source: computed
        description: "ACH processing fee charged on settlement; may be waived. See calc ach_fee."
        default: 0
      - name: total_charged_cents
        type: integer
        source: computed
        description: "funded_amount_cents + ach_fee_cents (post-waiver); pinned evaluation order in calc ach_fee."
      - name: tax_year
        type: integer
        source: system
        description: "Tax year (UTC year of settlement) the funded amount counts toward; null until SETTLED"
      - name: holding_id
        type: string
        source: computed
        description: "FK -> Holding.id; the Holding this subscription settled into (upserted by investor_id+share_class_id). Null until SETTLED. Exposed in the settle response so the cascade-created Holding is discoverable from the Subscription."

  - name: Holding
    parent: null
    common_fields: true
    fields:
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id"
      - name: share_class_id
        type: string
        source: input
        description: "FK -> ShareClass.id"
      - name: shares_owned
        type: number
        source: computed
        description: "Current share balance (4 dp); increased by settlement and DRIP, decreased by redemption"
        default: 0
      - name: cost_basis_cents
        type: integer
        source: computed
        description: "Cumulative cost basis in cents (funded amounts + DRIP reinvested cash); decreased proportionally on redemption"
        default: 0
      - name: first_acquired_seq
        type: integer
        source: computed
        description: "current_valuation_seq of the fund at the FIRST settlement into this holding; anchors penalty age tier. See calc penalty_age_quarters."
      - name: drip_elected
        type: boolean
        source: computed
        description: "Mirrors the electing subscription's drip_elected; toggleable via PATCH"
        default: false

  - name: Valuation
    parent: Fund
    common_fields: false
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id"
      - name: seq
        type: integer
        source: system
        description: "Monotonic per-fund valuation sequence number, starts at 1, +1 per posted Valuation"
      - name: period_label
        type: string
        source: input
        description: "Quarter label, e.g. 2026-Q1"
        constraints: "non-empty; unique per (fund_id, period_label)"
      - name: gross_asset_value_cents
        type: integer
        source: input
        description: "Appraised gross asset value in cents for this quarter"
        constraints: ">= 0"
      - name: total_liabilities_cents
        type: integer
        source: input
        description: "Total liabilities in cents for this quarter"
        constraints: ">= 0"
      - name: resulting_nav_per_share_cents
        type: integer
        source: computed
        description: "nav_per_share_cents computed and frozen at the moment this Valuation posts. See calc nav_per_share."

  - name: Distribution
    parent: Fund
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id"
      - name: period_label
        type: string
        source: input
        description: "Distribution period label, e.g. 2026-Q1"
        constraints: "non-empty; unique per (fund_id, period_label)"
      - name: dividend_per_share_cents
        type: number
        source: input
        description: "Declared dividend in cents per share, up to 4 dp (e.g. 1.5 means 1.5 cents/share)"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Distribution lifecycle"
        default: DECLARED
        constraints: "one of {DECLARED, PAID, CANCELLED}; managed by §1.2"
      - name: total_paid_cents
        type: integer
        source: computed
        description: "Sum over eligible holdings of per-holding rounded gross dividend (round per holding, then sum). See calc dividend_allocation."
        default: 0
      - name: drip_shares_minted
        type: number
        source: computed
        description: "Total new shares minted via DRIP across electing holdings at PAID time (4 dp)"
        default: 0

  - name: DistributionAllocation
    parent: Distribution
    common_fields: false
    fields:
      - name: distribution_id
        type: string
        source: input
        description: "FK -> Distribution.id"
      - name: holding_id
        type: string
        source: input
        description: "FK -> Holding.id"
      - name: gross_dividend_cents
        type: integer
        source: computed
        description: "round_half_up(holding.shares_owned * distribution.dividend_per_share_cents, 0) — whole cents per holding"
      - name: mode
        type: enum
        source: computed
        description: "How this allocation was paid out"
        constraints: "one of {CASH, DRIP}; DRIP only when holding.drip_elected and share class drip_eligible"
      - name: drip_shares
        type: number
        source: computed
        description: "round_half_up(gross_dividend_cents / nav_per_share_cents, 4) when mode=DRIP, else 0"
        default: 0

  - name: RedemptionRequest
    parent: null
    common_fields: true
    fields:
      - name: holding_id
        type: string
        source: input
        description: "FK -> Holding.id"
      - name: shares_requested
        type: number
        source: input
        description: "Shares the investor wants to redeem (4 dp)"
        constraints: "> 0; <= holding.shares_owned at request time"
      - name: status
        type: enum
        source: system
        description: "Redemption queue lifecycle"
        default: QUEUED
        constraints: "one of {QUEUED, DEFERRED, FULFILLED, REJECTED, CANCELLED}; managed by §1.2"
      - name: queue_seq
        type: integer
        source: system
        description: "Monotonic global enqueue sequence used as FIFO ordering key within a redemption window"
      - name: gross_value_cents
        type: integer
        source: computed
        description: "shares_requested * fund.nav_per_share_cents at fulfillment time; null until FULFILLED"
      - name: penalty_cents
        type: integer
        source: computed
        description: "Early-withdrawal penalty at fulfillment. See calc early_withdrawal_penalty; null until FULFILLED"
      - name: net_proceeds_cents
        type: integer
        source: computed
        description: "gross_value_cents - penalty_cents; null until FULFILLED"
      - name: penalty_tier_rate_bps
        type: integer
        source: computed
        description: "Penalty rate in bps applied at fulfillment (300/200/100/0); null until FULFILLED"

  - name: TaxDocument
    parent: null
    common_fields: false
    fields:
      - name: investor_id
        type: string
        source: input
        description: "FK -> Investor.id"
      - name: fund_id
        type: string
        source: input
        description: "FK -> Fund.id"
      - name: tax_year
        type: integer
        source: input
        description: "Tax year covered"
        constraints: ">= 2000; unique per (investor_id, fund_id, tax_year)"
      - name: doc_type
        type: enum
        source: computed
        description: "Derived from fund.vehicle_type: REIT->FORM_1099_DIV, PARTNERSHIP->FORM_K1"
        constraints: "one of {FORM_1099_DIV, FORM_K1}"
      - name: ordinary_dividends_cents
        type: integer
        source: computed
        description: "Sum of CASH-mode gross_dividend_cents across this investor's holdings in this fund for the tax year. See calc tax_document_totals."
      - name: reinvested_dividends_cents
        type: integer
        source: computed
        description: "Sum of DRIP-mode gross_dividend_cents across this investor's holdings in this fund for the tax year. See calc tax_document_totals."

# ============================================================================
# §1.2 STATE MACHINE TABLE
# ============================================================================
state_machines:
  - entity: Fund
    initial_state: OPEN
    terminal_states: [WINDING_DOWN]
    transitions:
      - from: OPEN
        to: CLOSED_TO_NEW
        trigger: "POST /funds/{id}/close-to-new"
        actor: FundManager
        preconditions: ["fund.status == OPEN"]
        side_effects:
          - "increments Fund.version by 1"
        note: "No NEW subscriptions accepted once CLOSED_TO_NEW; existing PENDING_ACH may still settle."
      - from: OPEN
        to: WINDING_DOWN
        trigger: "POST /funds/{id}/wind-down"
        actor: FundManager
        preconditions: ["fund.status IN {OPEN, CLOSED_TO_NEW}"]
        side_effects:
          - "every ShareClass of this fund with status IN {OFFERING, SUSPENDED} transitions to CLOSED (cascade down)"
          - "every RedemptionRequest of this fund's holdings with status IN {QUEUED, DEFERRED} transitions to REJECTED with error context (cascade down, conditional: only non-terminal)"
          - "increments Fund.version by 1"
        note: "Cascade origin for transitive_cascade wind_down_chain."
      - from: CLOSED_TO_NEW
        to: WINDING_DOWN
        trigger: "POST /funds/{id}/wind-down"
        actor: FundManager
        preconditions: ["fund.status == CLOSED_TO_NEW"]
        side_effects:
          - "every ShareClass of this fund with status IN {OFFERING, SUSPENDED} transitions to CLOSED (cascade down)"
          - "every RedemptionRequest of this fund's holdings with status IN {QUEUED, DEFERRED} transitions to REJECTED (cascade down, conditional)"
          - "increments Fund.version by 1"

  - entity: ShareClass
    initial_state: OFFERING
    terminal_states: [CLOSED]
    transitions:
      - from: OFFERING
        to: SUSPENDED
        trigger: "POST /share-classes/{id}/suspend"
        actor: FundManager
        preconditions: ["share_class.status == OFFERING", "parent fund.status != WINDING_DOWN"]
        side_effects:
          - "increments ShareClass.version by 1"
        note: "SUSPENDED blocks NEW subscriptions but existing PENDING_ACH may settle."
      - from: SUSPENDED
        to: OFFERING
        trigger: "POST /share-classes/{id}/resume"
        actor: FundManager
        preconditions: ["share_class.status == SUSPENDED", "parent fund.status == OPEN"]
        side_effects:
          - "increments ShareClass.version by 1"
        note: "Cycle OFFERING<->SUSPENDED (non-linear)."
      - from: OFFERING
        to: CLOSED
        trigger: "system: fund wind-down cascade"
        actor: system
        preconditions: ["parent fund transitions to WINDING_DOWN"]
        side_effects:
          - "increments ShareClass.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "system: fund wind-down cascade"
        actor: system
        preconditions: ["parent fund transitions to WINDING_DOWN"]
        side_effects:
          - "increments ShareClass.version by 1"

  - entity: Project
    initial_state: ACQUIRED
    terminal_states: [DISPOSED]
    transitions:
      - from: ACQUIRED
        to: STABILIZED
        trigger: "POST /projects/{id}/stabilize"
        actor: FundManager
        preconditions: ["project.status == ACQUIRED"]
        side_effects:
          - "increments Project.version by 1"
      - from: STABILIZED
        to: DISPOSED
        trigger: "POST /projects/{id}/dispose"
        actor: FundManager
        preconditions: ["project.status == STABILIZED"]
        side_effects:
          - "increments Project.version by 1"
      - from: ACQUIRED
        to: DISPOSED
        trigger: "POST /projects/{id}/dispose"
        actor: FundManager
        preconditions: ["project.status == ACQUIRED"]
        side_effects:
          - "increments Project.version by 1"

  - entity: Investor
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /investors/{id}/approve-suitability"
        actor: ComplianceOfficer
        preconditions:
          - "investor.suitability_status == PENDING"
          - "acting ComplianceOfficer X-User-ID is recorded (segregation of duties: must differ from any FundManager who declares valuations — enforced as audit field reviewed_by_user_id)"
        side_effects:
          - "sets investor.suitability_status = APPROVED"
          - "sets investor.reviewed_by_user_id = X-User-ID"
          - "increments Investor.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /investors/{id}/reject-suitability"
        actor: ComplianceOfficer
        preconditions: ["investor.suitability_status == PENDING"]
        side_effects:
          - "sets investor.suitability_status = REJECTED"
          - "sets investor.reviewed_by_user_id = X-User-ID"
          - "increments Investor.version by 1"
      - from: APPROVED
        to: PENDING
        trigger: "POST /investors/{id}/revoke-suitability"
        actor: ComplianceOfficer
        preconditions: ["investor.suitability_status == APPROVED"]
        side_effects:
          - "sets investor.suitability_status = PENDING"
          - "increments Investor.version by 1"
        note: "Cycle APPROVED->PENDING->APPROVED (non-linear revision loop)."

  - entity: Subscription
    initial_state: PENDING_ACH
    terminal_states: [SETTLED, REVERSED, CANCELLED]
    transitions:
      - from: PENDING_ACH
        to: SETTLED
        trigger: "POST /subscriptions/{id}/settle"
        actor: Operator
        preconditions:
          - "subscription.status == PENDING_ACH"
          - "investor.suitability_status == APPROVED (cross-entity: Subscription depends on Investor)"
          - "share class accredited_only=false OR investor.accredited_status == ACCREDITED"
          - "ytd_invested_cents + funded_amount_cents <= annual suitability cap when investor.accredited_status == NON_ACCREDITED (calc suitability_cap)"
        side_effects:
          - "captures settled_nav_cents = fund.nav_per_share_cents (final pricing variant)"
          - "computes shares_allocated = round_half_up(funded_amount_cents / settled_nav_cents, 4)"
          - "computes ach_fee_cents and total_charged_cents (calc ach_fee, pinned order)"
          - "upserts Holding(investor_id, share_class_id): shares_owned += shares_allocated, cost_basis_cents += funded_amount_cents; sets first_acquired_seq = fund.current_valuation_seq on first settlement into the holding (cross-entity cascade)"
          - "sets Subscription.holding_id = the upserted Holding.id (so the cascade-created holding is discoverable from the settle response)"
          - "recomputes Fund.shares_outstanding (calc fund_shares_outstanding) and Fund.nav_per_share_cents (calc nav_per_share)"
          - "increments Fund.total_capital_cents by funded_amount_cents (capital_conservation invariant)"
          - "sets tax_year = UTC year of logical clock"
          - "increments Subscription.version, Holding.version, Fund.version by 1 each"
        note: "Branch SETTLED: positive cascade. Cross-entity guard on Investor + ytd cap."
      - from: PENDING_ACH
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Investor
        preconditions: ["subscription.status == PENDING_ACH", "acting Investor owns the subscription"]
        side_effects:
          - "no holding/fund mutation (subscription never funded)"
          - "increments Subscription.version by 1"
        note: "Branch CANCELLED: no side effects on conserved quantities."
      - from: SETTLED
        to: REVERSED
        trigger: "POST /subscriptions/{id}/reverse"
        actor: Operator
        preconditions:
          - "subscription.status == SETTLED"
          - "holding.shares_owned >= subscription.shares_allocated (cannot reverse shares already redeemed away below the allocated amount)"
        side_effects:
          - "compensation: Holding.shares_owned -= shares_allocated, Holding.cost_basis_cents -= funded_amount_cents"
          - "recomputes Fund.shares_outstanding and Fund.nav_per_share_cents"
          - "decrements Fund.total_capital_cents by funded_amount_cents (restores capital_conservation invariant exactly)"
          - "if Holding.shares_owned becomes 0, first_acquired_seq is cleared to null"
          - "increments Subscription.version, Holding.version, Fund.version by 1 each"
        note: "Compensation branch: exact inverse of SETTLED side effects (compensating_invariant)."

  - entity: Distribution
    initial_state: DECLARED
    terminal_states: [PAID, CANCELLED]
    transitions:
      - from: DECLARED
        to: PAID
        trigger: "POST /distributions/{id}/pay"
        actor: Operator
        preconditions:
          - "distribution.status == DECLARED"
          - "fund.current_valuation_seq >= 1 (a NAV must exist to price DRIP)"
        side_effects:
          - "creates one DistributionAllocation per Holding with shares_owned > 0 in the fund's share classes"
          - "each allocation gross_dividend_cents = round_half_up(holding.shares_owned * dividend_per_share_cents, 0) (calc dividend_allocation; round per holding)"
          - "mode = DRIP when holding.drip_elected AND share class drip_eligible AND fund OPEN, else CASH"
          - "for DRIP allocations: drip_shares = round_half_up(gross_dividend_cents / fund.nav_per_share_cents, 4); Holding.shares_owned += drip_shares; Holding.cost_basis_cents += gross_dividend_cents (cascade)"
          - "Distribution.total_paid_cents = sum of per-holding gross_dividend_cents (round-per-holding-then-sum)"
          - "recomputes Fund.shares_outstanding and Fund.nav_per_share_cents after DRIP minting (cascade)"
          - "increments Distribution.version, affected Holding.version, Fund.version by 1 each"
        note: "Cascade origin for transitive_cascade distribution_drip_chain (Distribution -> Holding -> Fund)."
      - from: DECLARED
        to: CANCELLED
        trigger: "POST /distributions/{id}/cancel"
        actor: FundManager
        preconditions: ["distribution.status == DECLARED"]
        side_effects:
          - "no allocations created; no holding/fund mutation"
          - "increments Distribution.version by 1"

  - entity: RedemptionRequest
    initial_state: QUEUED
    terminal_states: [FULFILLED, REJECTED, CANCELLED]
    transitions:
      - from: QUEUED
        to: FULFILLED
        trigger: "POST /funds/{id}/run-redemption-sweep (Operator) — fulfills eligible queued requests FIFO"
        actor: Operator
        preconditions:
          - "request.status == QUEUED"
          - "fund.status != WINDING_DOWN (cross-entity: RedemptionRequest depends on Fund)"
          - "holding.shares_owned >= request.shares_requested (cross-entity: RedemptionRequest depends on Holding)"
          - "cumulative gross_value of requests fulfilled in this sweep so far + this request's gross_value <= fund quarterly redemption cap (calc redemption_cap)"
        side_effects:
          - "computes penalty_tier_rate_bps from penalty_age_quarters (calc early_withdrawal_penalty)"
          - "gross_value_cents = round to whole cents of shares_requested * fund.nav_per_share_cents"
          - "penalty_cents = round_half_up(gross_value_cents * rate, 0); net_proceeds_cents = gross_value_cents - penalty_cents"
          - "Holding.shares_owned -= shares_requested; Holding.cost_basis_cents reduced proportionally (cascade)"
          - "recomputes Fund.shares_outstanding and Fund.nav_per_share_cents"
          - "decrements Fund.total_capital_cents by gross_value_cents (capital_conservation)"
          - "increments RedemptionRequest.version, Holding.version, Fund.version by 1 each"
        note: "FIFO by queue_seq ASC; cap is the temporal/quota overlap boundary."
      - from: QUEUED
        to: DEFERRED
        trigger: "system: redemption sweep — request eligible but cap reached this window"
        actor: system
        preconditions: ["request.status == QUEUED", "cap would be exceeded by this request in the current sweep"]
        side_effects:
          - "no holding/fund mutation; request retains queue_seq"
          - "increments RedemptionRequest.version by 1"
        note: "DEFERRED rolls to next sweep window (cyclic re-entry to QUEUED)."
      - from: DEFERRED
        to: QUEUED
        trigger: "POST /funds/{id}/open-redemption-window (Operator)"
        actor: Operator
        preconditions: ["request.status == DEFERRED"]
        side_effects:
          - "increments RedemptionRequest.version by 1"
        note: "Cyclic DEFERRED->QUEUED->(sweep)->FULFILLED/DEFERRED."
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /redemption-requests/{id}/cancel"
        actor: Investor
        preconditions: ["request.status == QUEUED", "acting Investor owns the holding"]
        side_effects:
          - "increments RedemptionRequest.version by 1"
      - from: DEFERRED
        to: CANCELLED
        trigger: "POST /redemption-requests/{id}/cancel"
        actor: Investor
        preconditions: ["request.status == DEFERRED", "acting Investor owns the holding"]
        side_effects:
          - "increments RedemptionRequest.version by 1"
      - from: QUEUED
        to: REJECTED
        trigger: "system: fund wind-down cascade"
        actor: system
        preconditions: ["parent fund transitions to WINDING_DOWN"]
        side_effects:
          - "increments RedemptionRequest.version by 1"
      - from: DEFERRED
        to: REJECTED
        trigger: "system: fund wind-down cascade"
        actor: system
        preconditions: ["parent fund transitions to WINDING_DOWN"]
        side_effects:
          - "increments RedemptionRequest.version by 1"

# ----------------------------------------------------------------------------
# §1.2.1 CONCURRENCY RULES
# ----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: subscription-create-stale-fund
    parent_entity: Fund
    write_endpoint: "POST /subscriptions"
    occ_field: "expected_fund_version"
    description: |
      Creating a Subscription against a ShareClass whose parent Fund's version
      has advanced since the client last observed it is rejected. A subscription
      is priced provisionally from the fund's nav_per_share_cents; once another
      writer posts a Valuation or settles a subscription (both bump Fund.version
      and move the NAV), the current writer's view of the fund is stale and the
      provisional price would be wrong, so the create is refused.
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412

  - rule_id: redemption-create-stale-holding
    parent_entity: Holding
    write_endpoint: "POST /redemption-requests"
    occ_field: "expected_holding_version"
    description: |
      Creating a RedemptionRequest against a Holding whose version has advanced
      since the client last observed it is rejected. A redemption is sized against
      shares_owned; once another writer settles a DRIP distribution, reverses a
      subscription, or fulfills a prior redemption (each bumps Holding.version and
      changes shares_owned), the current writer's share-balance view is stale, so
      the create is refused.
    error_id: ERR_STALE_HOLDING_VERSION
    http_status: 412

# ============================================================================
# §1.3 CALCULATION RULES TABLE
# ============================================================================
calculations:
  - name: nav_per_share
    trigger: "On Fund create; on each Valuation post (POST /funds/{id}/valuations); after every settle / reverse / redemption / DRIP cascade"
    algorithm: aggregation
    formula: |
      net_cents = fund.gross_asset_value_cents - fund.total_liabilities_cents
      if fund.shares_outstanding == 0:
          nav_per_share_cents = 1000      # bootstrap $10.00 par before any shares exist
      else:
          nav_per_share_cents = round_half_up(net_cents / fund.shares_outstanding, 0)   # whole cents
    input_set: "Fund's own gross_asset_value_cents, total_liabilities_cents (latest posted Valuation overwrites these), and computed shares_outstanding"
    constants:
      PAR_NAV_CENTS: 1000
    precision: "whole cents, round_half_up; shares_outstanding carried at 4 dp"

  - name: fund_shares_outstanding
    trigger: "After every settle, reverse, redemption fulfillment, and DRIP minting"
    algorithm: aggregation
    formula: |
      shares_outstanding = sum(holding.shares_owned for holding
                               where holding.share_class_id IN this fund's share classes
                               and holding.shares_owned > 0)   # 4 dp
    input_set: "All Holdings whose share class belongs to the fund, with positive balance"
    constants: {}
    precision: "4 decimal places, round_half_up on the accumulated sum"

  - name: subscription_shares
    trigger: "Provisional at POST /subscriptions (capture provisional_nav_cents); final at POST /subscriptions/{id}/settle (capture settled_nav_cents + mint shares)"
    algorithm: forward_looking
    formula: |
      shares = round_half_up(funded_amount_cents / nav_used_cents, 4)
    input_set: "funded_amount_cents and the fund nav_per_share_cents at the relevant instant"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "At subscription creation; nav_used_cents = fund.nav_per_share_cents at create time"
        difference: "Stored in provisional_nav_cents; informational quote, NOT minted"
      - name: final
        when: "At settlement; nav_used_cents = fund.nav_per_share_cents at settle time"
        difference: "Stored in settled_nav_cents; shares_allocated IS minted from this. Diverges from provisional whenever a Valuation posted between create and settle."

  - name: ach_fee
    trigger: "At POST /subscriptions/{id}/settle"
    algorithm: tiered_pricing
    formula: |
      # PINNED EVALUATION ORDER (circular-looking: fee depends on a waiver keyed on total)
      step1 ach_fee_raw = max(ACH_MIN_FEE_CENTS, round_half_up(funded_amount_cents * ACH_RATE, 0))
      step2 prelim_total = funded_amount_cents + ach_fee_raw
      step3 if prelim_total >= LARGE_INVESTOR_THRESHOLD_CENTS:
                ach_fee_cents = 0          # waiver applied AFTER prelim_total computed from the raw fee
            else:
                ach_fee_cents = ach_fee_raw
      step4 total_charged_cents = funded_amount_cents + ach_fee_cents
    input_set: "Subscription.funded_amount_cents only"
    constants:
      ACH_RATE: 0.008
      ACH_MIN_FEE_CENTS: 100
      LARGE_INVESTOR_THRESHOLD_CENTS: 2500000
    precision: "whole cents, round_half_up"

  - name: suitability_cap
    trigger: "Precondition at POST /subscriptions/{id}/settle when investor.accredited_status == NON_ACCREDITED"
    algorithm: threshold
    formula: |
      annual_cap_cents = round_half_up(0.10 * max(investor.annual_income_cents,
                                                   investor.net_worth_cents), 0)
      # settle ALLOWED iff investor.ytd_invested_cents + funded_amount_cents <= annual_cap_cents
    input_set: "investor.annual_income_cents, net_worth_cents, ytd_invested_cents; subscription.funded_amount_cents"
    constants:
      NON_ACCREDITED_RATE: 0.10
    precision: "whole cents, round_half_up; comparison is <= (boundary inclusive)"

  - name: ytd_invested
    trigger: "Recomputed after every subscription SETTLED / REVERSED"
    algorithm: aggregation
    formula: |
      ytd_invested_cents = sum(s.funded_amount_cents for s in investor.subscriptions
                               where s.status == SETTLED and s.tax_year == current_utc_year)
    input_set: "Investor's SETTLED subscriptions in the current tax (UTC) year; REVERSED subscriptions excluded"
    constants: {}
    precision: "whole cents"

  - name: penalty_age_quarters
    trigger: "At redemption fulfillment, to select penalty tier"
    algorithm: threshold
    formula: |
      age_quarters = fund.current_valuation_seq - holding.first_acquired_seq
      # Each posted Valuation advances current_valuation_seq by 1 and represents one quarter.
    input_set: "fund.current_valuation_seq and holding.first_acquired_seq"
    constants: {}
    precision: "integer quarters (>= 0)"

  - name: early_withdrawal_penalty
    trigger: "At RedemptionRequest QUEUED->FULFILLED"
    algorithm: tiered_pricing
    formula: |
      gross_value_cents = round_half_up(shares_requested * fund.nav_per_share_cents, 0)
      age = penalty_age_quarters
      if age < 4:    rate_bps = 300      # < 1 year
      elif age < 8:  rate_bps = 200      # 1–2 years
      elif age < 12: rate_bps = 100      # 2–3 years
      else:          rate_bps = 0        # 3+ years, no penalty
      penalty_cents = round_half_up(gross_value_cents * rate_bps / 10000, 0)
      net_proceeds_cents = gross_value_cents - penalty_cents
    input_set: "shares_requested, fund.nav_per_share_cents, penalty_age_quarters"
    constants:
      TIER1_RATE_BPS: 300
      TIER2_RATE_BPS: 200
      TIER3_RATE_BPS: 100
      TIER4_RATE_BPS: 0
      TIER1_MAX_Q: 4
      TIER2_MAX_Q: 8
      TIER3_MAX_Q: 12
    precision: "whole cents, round_half_up; tier boundaries inclusive of lower bound (age==4 -> tier2)"

  - name: dividend_allocation
    trigger: "At Distribution DECLARED->PAID"
    algorithm: waterfall_allocation
    formula: |
      # PINNED ROUNDING ORDER: round per holding, THEN sum.
      eligible_holdings = [h for h in fund holdings if h.shares_owned > 0]   # ASC by created_at, tie-break id-free
      for h in eligible_holdings (process in created_at ASC, then by holding.id-free created_at):
          gross_dividend_cents = round_half_up(h.shares_owned * distribution.dividend_per_share_cents, 0)
          mode = DRIP if (h.drip_elected and share_class.drip_eligible and fund.status == OPEN) else CASH
          if mode == DRIP:
              drip_shares = round_half_up(gross_dividend_cents / fund.nav_per_share_cents, 4)
      total_paid_cents = sum(gross_dividend_cents over all eligible holdings)   # sum of already-rounded values
    input_set: "Holdings of the fund with shares_owned > 0 at PAID time; distribution.dividend_per_share_cents"
    constants: {}
    precision: "whole cents per holding, round_half_up; total is sum of rounded per-holding amounts (NOT sum-then-round)"

  - name: redemption_cap
    trigger: "During redemption sweep, to bound total fulfilled gross value per window"
    algorithm: threshold
    formula: |
      cap_cents = round_half_up(QUARTERLY_REDEMPTION_CAP_RATE * fund.total_capital_cents, 0)
      # Within a single sweep, accumulate gross_value of fulfilled requests in queue_seq ASC order.
      # A request is FULFILLED iff running_fulfilled_gross + this.gross_value <= cap_cents; otherwise DEFERRED.
    input_set: "fund.total_capital_cents at sweep start; queued requests in queue_seq ASC"
    constants:
      QUARTERLY_REDEMPTION_CAP_RATE: 0.05
    precision: "whole cents, round_half_up; comparison <= (boundary inclusive)"

  - name: tax_document_totals
    trigger: "At POST /investors/{id}/tax-documents (generate document for a tax year)"
    algorithm: aggregation
    formula: |
      ordinary_dividends_cents = sum(alloc.gross_dividend_cents
          for alloc in DistributionAllocations
          where alloc.mode == CASH
            and alloc.holding.investor_id == investor_id
            and alloc.holding.share_class_id IN fund's share classes
            and alloc.distribution.status == PAID
            and alloc.distribution.period_label year == tax_year)
      reinvested_dividends_cents = same sum but where alloc.mode == DRIP
      doc_type = FORM_1099_DIV if fund.vehicle_type == REIT else FORM_K1
    input_set: "PAID DistributionAllocations for the investor's holdings in the fund within the tax year"
    constants: {}
    precision: "whole cents"

# ============================================================================
# §1.4 VALIDATION RULES TABLE (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /investors (registration) and GET endpoints flagged Anonymous"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all role-gated endpoints"

  - priority: 3
    category: auth
    check: "Acting entity_backed user owns the target resource (Investor acting on own subscription/redemption/holding)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /subscriptions/{id}/cancel, POST /redemption-requests/{id}/cancel, POST /subscriptions, POST /redemption-requests"

  - priority: 4
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2 from-state)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded creates (§1.2.1)"
    error_id: ERR_STALE_FUND_VERSION
    http_status: 412
    applies_to: "POST /subscriptions (expected_fund_version)"

  - priority: 6
    category: state
    check: "OCC: expected_holding_version matches the holding's current version on redemption create (§1.2.1)"
    error_id: ERR_STALE_HOLDING_VERSION
    http_status: 412
    applies_to: "POST /redemption-requests (expected_holding_version)"

  - priority: 7
    category: business_referential
    check: "Subscription's share class belongs to a fund whose status accepts NEW subscriptions (fund.status == OPEN AND share_class.status == OFFERING)"
    error_id: ERR_OFFERING_NOT_OPEN
    http_status: 409
    applies_to: "POST /subscriptions"

  - priority: 8
    category: business_safety
    check: "Investor suitability_status == APPROVED before a subscription may settle (compliance gate)"
    error_id: ERR_SUITABILITY_NOT_APPROVED
    http_status: 409
    applies_to: "POST /subscriptions/{id}/settle"

  - priority: 9
    category: business_safety
    check: "If share class accredited_only == true, investor.accredited_status must == ACCREDITED"
    error_id: ERR_ACCREDITATION_REQUIRED
    http_status: 409
    applies_to: "POST /subscriptions/{id}/settle"

  - priority: 10
    category: business_constraint
    check: "funded_amount_cents >= share class min_investment_cents"
    error_id: ERR_BELOW_MIN_INVESTMENT
    http_status: 422
    applies_to: "POST /subscriptions"

  - priority: 11
    category: business_constraint
    check: "shares_requested > 0 and <= holding.shares_owned at request time"
    error_id: ERR_INSUFFICIENT_SHARES
    http_status: 422
    applies_to: "POST /redemption-requests, POST /funds/{id}/run-redemption-sweep"

  - priority: 12
    category: business_temporal
    check: "Redemption sweep / fulfillment forbidden when fund.status == WINDING_DOWN"
    error_id: ERR_FUND_WINDING_DOWN
    http_status: 409
    applies_to: "POST /funds/{id}/run-redemption-sweep, POST /redemption-requests"

  - priority: 13
    category: business_constraint
    check: "Distribution may only be PAID when fund.current_valuation_seq >= 1 (NAV exists for DRIP pricing)"
    error_id: ERR_NO_VALUATION
    http_status: 409
    applies_to: "POST /distributions/{id}/pay"

  - priority: 14
    category: business_constraint
    check: "Valuation period_label unique per fund; Distribution period_label unique per fund; ShareClass class_code unique per fund; Investor email unique; TaxDocument unique per (investor,fund,year)"
    error_id: ERR_DUPLICATE
    http_status: 409
    applies_to: "POST /funds/{id}/valuations, POST /distributions, POST /share-classes, POST /investors, POST /investors/{id}/tax-documents"

  - priority: 15
    category: business_fiscal
    check: "Non-accredited investor annual cap: ytd_invested_cents + funded_amount_cents <= 10% * max(annual_income_cents, net_worth_cents)"
    error_id: ERR_ANNUAL_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /subscriptions/{id}/settle"

  - priority: 16
    category: business_fiscal
    check: "Redemption fulfillment within a sweep: running fulfilled gross + this gross <= quarterly redemption cap; otherwise request is DEFERRED, not an error"
    error_id: ERR_REDEMPTION_CAP_REACHED
    http_status: 409
    applies_to: "POST /redemption-requests/{id}/force-fulfill (explicit single-request fulfill bypassing sweep)"

  - priority: 17
    category: business_constraint
    check: "Request body fields conform to declared types and required-field presence"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

# ============================================================================
# §1.5 API ENDPOINT TABLE
# ============================================================================
endpoints:
  # ---- Funds ----
  - method: POST
    path: "/funds"
    description: "Create an eREIT/fund. NAV bootstraps to $10.00 (1000 cents) par until shares exist."
    roles: [FundManager]
    code: 201
    input: [name, vehicle_type, gross_asset_value_cents, total_liabilities_cents]
    output: Fund
    side_effects: ["initializes status=OPEN, shares_outstanding=0, nav_per_share_cents=1000 (calc nav_per_share bootstrap), total_capital_cents=0, current_valuation_seq=0"]

  - method: GET
    path: "/funds/{id}"
    description: "Retrieve a fund with computed NAV and derived fields"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: []
    output: Fund

  - method: GET
    path: "/funds"
    description: "List funds (paginated)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: Fund[]

  - method: POST
    path: "/funds/{id}/close-to-new"
    description: "Transition fund OPEN -> CLOSED_TO_NEW"
    roles: [FundManager]
    code: 200
    input: []
    output: Fund
    side_effects: ["increments Fund.version"]

  - method: POST
    path: "/funds/{id}/wind-down"
    description: "Transition fund to WINDING_DOWN; cascades to share classes and queued/deferred redemptions"
    roles: [FundManager]
    code: 200
    input: []
    output: Fund
    side_effects:
      - "cascade: ShareClasses {OFFERING,SUSPENDED} -> CLOSED"
      - "cascade: RedemptionRequests {QUEUED,DEFERRED} -> REJECTED"
      - "increments Fund.version"

  - method: GET
    path: "/funds/{id}/report"
    description: "Computed read: fund-level + project-level report (NAV, total_capital, per-project status/values)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: []
    output: Fund

  # ---- Valuations (quarterly NAV) ----
  - method: POST
    path: "/funds/{id}/valuations"
    description: "Post a quarterly Valuation; freezes resulting NAV, advances current_valuation_seq, overwrites fund gross/liabilities, recomputes nav_per_share_cents"
    roles: [FundManager]
    code: 201
    input: [period_label, gross_asset_value_cents, total_liabilities_cents]
    output: Valuation
    side_effects:
      - "seq = previous current_valuation_seq + 1"
      - "fund.gross_asset_value_cents/total_liabilities_cents overwritten"
      - "fund.current_valuation_seq advanced"
      - "recomputes fund.nav_per_share_cents (calc nav_per_share); resulting_nav_per_share_cents frozen on the Valuation"
      - "increments Fund.version"

  - method: GET
    path: "/funds/{id}/valuations"
    description: "List a fund's valuations (FK reverse-reachability for Valuation.fund_id)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: Valuation[]

  # ---- Share classes ----
  - method: POST
    path: "/funds/{id}/share-classes"
    description: "Create a share class under a fund"
    roles: [FundManager]
    code: 201
    input: [class_code, min_investment_cents, mgmt_fee_bps, "accredited_only?", "drip_eligible?"]
    output: ShareClass
    side_effects: ["status=OFFERING"]

  - method: GET
    path: "/funds/{id}/share-classes"
    description: "List share classes of a fund (FK reverse-reachability for ShareClass.fund_id)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: ShareClass[]

  - method: GET
    path: "/share-classes/{id}"
    description: "Retrieve a share class"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: []
    output: ShareClass

  - method: POST
    path: "/share-classes/{id}/suspend"
    description: "Transition share class OFFERING -> SUSPENDED"
    roles: [FundManager]
    code: 200
    input: []
    output: ShareClass
    side_effects: ["increments ShareClass.version"]

  - method: POST
    path: "/share-classes/{id}/resume"
    description: "Transition share class SUSPENDED -> OFFERING"
    roles: [FundManager]
    code: 200
    input: []
    output: ShareClass
    side_effects: ["increments ShareClass.version"]

  # ---- Projects (project-level reporting) ----
  - method: POST
    path: "/funds/{id}/projects"
    description: "Create a project (real-estate asset) under a fund"
    roles: [FundManager]
    code: 201
    input: [name, acquisition_cost_cents, appraised_value_cents]
    output: Project
    side_effects: ["status=ACQUIRED"]

  - method: GET
    path: "/funds/{id}/projects"
    description: "List a fund's projects (FK reverse-reachability for Project.fund_id)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: Project[]

  - method: POST
    path: "/projects/{id}/stabilize"
    description: "Transition project ACQUIRED -> STABILIZED"
    roles: [FundManager]
    code: 200
    input: []
    output: Project
    side_effects: ["increments Project.version"]

  - method: POST
    path: "/projects/{id}/dispose"
    description: "Transition project to DISPOSED"
    roles: [FundManager]
    code: 200
    input: []
    output: Project
    side_effects: ["increments Project.version"]

  # ---- Investors & suitability ----
  - method: POST
    path: "/investors"
    description: "Register an investor (Anonymous). Starts suitability_status=PENDING."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, "accredited_status?", annual_income_cents, net_worth_cents]
    output: Investor
    side_effects: ["suitability_status=PENDING, ytd_invested_cents=0"]

  - method: GET
    path: "/investors/{id}"
    description: "Retrieve an investor"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: []
    output: Investor

  - method: GET
    path: "/investors"
    description: "List investors (paginated)"
    roles: [FundManager, ComplianceOfficer, Operator]
    code: 200
    input: ["limit?", "offset?"]
    output: Investor[]

  - method: POST
    path: "/investors/{id}/approve-suitability"
    description: "ComplianceOfficer approves investor suitability (PENDING -> APPROVED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Investor
    side_effects: ["sets suitability_status=APPROVED, reviewed_by_user_id=X-User-ID, increments Investor.version"]

  - method: POST
    path: "/investors/{id}/reject-suitability"
    description: "ComplianceOfficer rejects investor suitability (PENDING -> REJECTED)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Investor
    side_effects: ["sets suitability_status=REJECTED, reviewed_by_user_id=X-User-ID, increments Investor.version"]

  - method: POST
    path: "/investors/{id}/revoke-suitability"
    description: "ComplianceOfficer revokes approval (APPROVED -> PENDING)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Investor
    side_effects: ["sets suitability_status=PENDING, increments Investor.version"]

  - method: POST
    path: "/investors/{id}/tax-documents"
    description: "Generate a K-1 / 1099-DIV tax document for the investor+fund+year (computed totals)"
    roles: [ComplianceOfficer, Operator]
    code: 201
    input: [fund_id, tax_year]
    output: TaxDocument
    side_effects: ["computes doc_type, ordinary_dividends_cents, reinvested_dividends_cents (calc tax_document_totals)"]

  - method: GET
    path: "/investors/{id}/tax-documents"
    description: "List an investor's tax documents (FK reverse-reachability for TaxDocument.investor_id)"
    roles: [ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["fund_id?", "limit?", "offset?"]
    output: TaxDocument[]

  - method: GET
    path: "/funds/{id}/tax-documents"
    description: "List tax documents issued for a fund (FK reverse-reachability for TaxDocument.fund_id)"
    roles: [ComplianceOfficer, Operator, FundManager]
    code: 200
    input: ["limit?", "offset?"]
    output: TaxDocument[]

  # ---- Subscriptions & ACH ----
  - method: POST
    path: "/subscriptions"
    description: "Investor subscribes to a share class via ACH (PENDING_ACH). OCC-guarded on the parent Fund (expected_fund_version). Captures provisional NAV pricing."
    roles: [Investor]
    code: 201
    input: [investor_id, share_class_id, funded_amount_cents, "drip_elected?", expected_fund_version]
    output: Subscription
    side_effects:
      - "captures provisional_nav_cents from fund.nav_per_share_cents (calc subscription_shares provisional)"
      - "increments Fund.version by 1"

  - method: GET
    path: "/subscriptions/{id}"
    description: "Retrieve a subscription"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: []
    output: Subscription

  - method: GET
    path: "/subscriptions"
    description: "List subscriptions, filterable by investor_id, share_class_id, or holding_id (FK reverse-reachability for all three FKs)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["investor_id?", "share_class_id?", "holding_id?", "limit?", "offset?"]
    output: Subscription[]

  - method: POST
    path: "/subscriptions/{id}/settle"
    description: "Operator settles ACH funding (PENDING_ACH -> SETTLED). Final NAV pricing, share mint, holding upsert, fund recompute, suitability + cap + accreditation gates."
    roles: [Operator]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "captures settled_nav_cents; mints shares_allocated (calc subscription_shares final)"
      - "computes ach_fee_cents, total_charged_cents (calc ach_fee)"
      - "upserts Holding; sets first_acquired_seq on first settlement; sets Subscription.holding_id to the upserted Holding.id"
      - "recomputes fund shares_outstanding + nav_per_share_cents; increments total_capital_cents"
      - "recomputes investor.ytd_invested_cents; sets tax_year"
      - "increments Subscription.version, Holding.version, Fund.version"

  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Investor cancels an unsettled subscription (PENDING_ACH -> CANCELLED)"
    roles: [Investor]
    code: 200
    input: []
    output: Subscription
    side_effects: ["increments Subscription.version"]

  - method: POST
    path: "/subscriptions/{id}/reverse"
    description: "Operator reverses a settled subscription on ACH clawback (SETTLED -> REVERSED). Exact compensation of settle side effects."
    roles: [Operator]
    code: 200
    input: []
    output: Subscription
    side_effects:
      - "compensation: holding shares_owned/cost_basis reduced; fund shares_outstanding/nav/total_capital restored"
      - "recomputes investor.ytd_invested_cents"
      - "increments Subscription.version, Holding.version, Fund.version"

  # ---- Holdings ----
  - method: GET
    path: "/holdings/{id}"
    description: "Retrieve a holding"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: []
    output: Holding

  - method: GET
    path: "/holdings"
    description: "List holdings, filterable by investor_id or share_class_id (FK reverse-reachability for both FKs)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["investor_id?", "share_class_id?", "limit?", "offset?"]
    output: Holding[]

  - method: GET
    path: "/holdings/{id}/allocations"
    description: "List distribution allocations paid to a holding (FK reverse-reachability for DistributionAllocation.holding_id)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: DistributionAllocation[]

  - method: PATCH
    path: "/holdings/{id}"
    description: "Investor toggles drip_elected on own holding"
    roles: [Investor]
    code: 200
    input: [drip_elected]
    output: Holding
    side_effects: ["increments Holding.version"]

  # ---- Distributions & DRIP ----
  - method: POST
    path: "/funds/{id}/distributions"
    description: "FundManager declares a dividend distribution (DECLARED)"
    roles: [FundManager]
    code: 201
    input: [period_label, dividend_per_share_cents]
    output: Distribution
    side_effects: ["status=DECLARED"]

  - method: GET
    path: "/funds/{id}/distributions"
    description: "List a fund's distributions (FK reverse-reachability for Distribution.fund_id)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["limit?", "offset?"]
    output: Distribution[]

  - method: GET
    path: "/distributions/{id}"
    description: "Retrieve a distribution"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: []
    output: Distribution

  - method: POST
    path: "/distributions/{id}/pay"
    description: "Operator pays a distribution (DECLARED -> PAID); allocates per holding, applies DRIP, recomputes fund"
    roles: [Operator]
    code: 200
    input: []
    output: Distribution
    side_effects:
      - "creates DistributionAllocations; round-per-holding-then-sum total_paid_cents (calc dividend_allocation)"
      - "DRIP minting cascades into holdings; recomputes fund shares_outstanding + nav"
      - "increments Distribution.version, affected Holding.version, Fund.version"

  - method: POST
    path: "/distributions/{id}/cancel"
    description: "FundManager cancels a declared distribution (DECLARED -> CANCELLED)"
    roles: [FundManager]
    code: 200
    input: []
    output: Distribution
    side_effects: ["increments Distribution.version"]

  - method: GET
    path: "/distributions/{id}/allocations"
    description: "List allocations of a distribution (FK reverse-reachability for DistributionAllocation.distribution_id)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["holding_id?", "limit?", "offset?"]
    output: DistributionAllocation[]

  # ---- Redemptions ----
  - method: POST
    path: "/redemption-requests"
    description: "Investor requests redemption of shares from a holding (QUEUED). OCC-guarded on the parent Holding (expected_holding_version)."
    roles: [Investor]
    code: 201
    input: [holding_id, shares_requested, expected_holding_version]
    output: RedemptionRequest
    side_effects: ["assigns monotonic queue_seq; status=QUEUED; increments Holding.version by 1"]

  - method: GET
    path: "/redemption-requests/{id}"
    description: "Retrieve a redemption request"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: []
    output: RedemptionRequest

  - method: GET
    path: "/redemption-requests"
    description: "List redemption requests, filterable by holding_id (FK reverse-reachability for RedemptionRequest.holding_id)"
    roles: [FundManager, ComplianceOfficer, Operator, Investor]
    code: 200
    input: ["holding_id?", "limit?", "offset?"]
    output: RedemptionRequest[]

  - method: POST
    path: "/redemption-requests/{id}/cancel"
    description: "Investor cancels own queued/deferred redemption request"
    roles: [Investor]
    code: 200
    input: []
    output: RedemptionRequest
    side_effects: ["increments RedemptionRequest.version"]

  - method: POST
    path: "/redemption-requests/{id}/force-fulfill"
    description: "Operator force-fulfills a single queued request, subject to redemption cap (rejects with ERR_REDEMPTION_CAP_REACHED if cap would be exceeded). Applies penalty + cascades."
    roles: [Operator]
    code: 200
    input: []
    output: RedemptionRequest
    side_effects:
      - "early-withdrawal penalty (calc early_withdrawal_penalty); holding + fund cascade; capital_conservation"
      - "increments RedemptionRequest.version, Holding.version, Fund.version"

  - method: POST
    path: "/funds/{id}/run-redemption-sweep"
    description: "Operator runs a FIFO redemption sweep over QUEUED requests in queue_seq ASC; fulfills up to quarterly cap, defers the rest"
    roles: [Operator]
    code: 200
    input: []
    output: Fund
    side_effects:
      - "fulfills eligible QUEUED requests (penalty + cascades); DEFERS requests beyond cap"
      - "increments versions of affected RedemptionRequests, Holdings, Fund"

  - method: POST
    path: "/funds/{id}/open-redemption-window"
    description: "Operator reopens the redemption window; moves DEFERRED requests back to QUEUED"
    roles: [Operator]
    code: 200
    input: []
    output: Fund
    side_effects: ["DEFERRED -> QUEUED for this fund's requests; increments affected RedemptionRequest.version"]

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock for deterministic tax_year stamping. Server startup default is 2026-01-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Operator, FundManager]
    code: 200
    input: [to_iso8601]
    output: null

# ============================================================================
# §1.6 ERROR CODE CATALOG
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID on an authenticated endpoint"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this operation per §1.7"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Investor acting on a subscription/redemption/holding they do not own"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced fund/share-class/project/investor/subscription/holding/distribution/redemption does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_STALE_FUND_VERSION
    http: 412
    condition: "expected_fund_version does not match the fund's current version on subscription create (OCC)"
  - id: ERR_STALE_HOLDING_VERSION
    http: 412
    condition: "expected_holding_version does not match the holding's current version on redemption create (OCC)"
  - id: ERR_OFFERING_NOT_OPEN
    http: 409
    condition: "New subscription against a fund not OPEN or a share class not OFFERING"
  - id: ERR_SUITABILITY_NOT_APPROVED
    http: 409
    condition: "Settling a subscription for an investor whose suitability_status != APPROVED"
  - id: ERR_ACCREDITATION_REQUIRED
    http: 409
    condition: "Settling against an accredited_only share class for a NON_ACCREDITED investor"
  - id: ERR_BELOW_MIN_INVESTMENT
    http: 422
    condition: "funded_amount_cents below the share class min_investment_cents"
  - id: ERR_INSUFFICIENT_SHARES
    http: 422
    condition: "shares_requested <= 0 or exceeds holding.shares_owned"
  - id: ERR_FUND_WINDING_DOWN
    http: 409
    condition: "Redemption create/fulfillment attempted on a WINDING_DOWN fund"
  - id: ERR_NO_VALUATION
    http: 409
    condition: "Paying a distribution before any Valuation has posted (no NAV for DRIP pricing)"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation (valuation/distribution period_label per fund, class_code per fund, investor email, tax document key)"
  - id: ERR_ANNUAL_CAP_EXCEEDED
    http: 409
    condition: "Non-accredited investor's settled YTD + this funded amount exceeds the annual suitability cap"
  - id: ERR_REDEMPTION_CAP_REACHED
    http: 409
    condition: "force-fulfill would push fulfilled gross above the quarterly redemption cap"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, or invalid enum value"

# ============================================================================
# §1.7 RBAC MATRIX
# ============================================================================
roles:
  - name: FundManager
    description: "Creates funds, share classes, projects, valuations, distributions; manages fund/share-class/project/distribution lifecycle. May NOT review investor suitability (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /funds"
      - "POST /funds/{id}/close-to-new"
      - "POST /funds/{id}/wind-down"
      - "POST /funds/{id}/valuations"
      - "POST /funds/{id}/share-classes"
      - "POST /share-classes/{id}/suspend"
      - "POST /share-classes/{id}/resume"
      - "POST /funds/{id}/projects"
      - "POST /projects/{id}/stabilize"
      - "POST /projects/{id}/dispose"
      - "POST /funds/{id}/distributions"
      - "POST /distributions/{id}/cancel"
    shared_operations:
      - "GET reads on funds/share-classes/projects/valuations/investors/subscriptions/holdings/distributions/redemptions"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Reviews investor suitability (approve/reject/revoke) and issues tax documents. May NOT create valuations/distributions (segregation of duties from FundManager)."
    identity: "opaque"
    exclusive_operations:
      - "POST /investors/{id}/approve-suitability"
      - "POST /investors/{id}/reject-suitability"
      - "POST /investors/{id}/revoke-suitability"
    shared_operations:
      - "POST /investors/{id}/tax-documents"
      - "GET reads (funds, investors, subscriptions, holdings, distributions, redemptions, tax-documents)"

  - name: Operator
    description: "Opaque back-office actor: settles/reverses ACH subscriptions, pays distributions, runs redemption sweeps and windows, force-fulfills redemptions, issues tax documents."
    identity: "opaque"
    exclusive_operations:
      - "POST /subscriptions/{id}/settle"
      - "POST /subscriptions/{id}/reverse"
      - "POST /distributions/{id}/pay"
      - "POST /funds/{id}/run-redemption-sweep"
      - "POST /funds/{id}/open-redemption-window"
      - "POST /redemption-requests/{id}/force-fulfill"
    shared_operations:
      - "POST /investors/{id}/tax-documents"
      - "POST /_clock/set_current_utc"
      - "GET reads (all)"

  - name: Investor
    description: "Self-registering investor (entity-backed). Creates/cancels own subscriptions and redemption requests; toggles own holding DRIP. X-User-ID equals the Investor.id."
    identity: "entity_backed:Investor"
    exclusive_operations:
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/cancel"
      - "POST /redemption-requests"
      - "POST /redemption-requests/{id}/cancel"
      - "PATCH /holdings/{id}"
    shared_operations:
      - "GET reads on own funds/share-classes/subscriptions/holdings/distributions/redemptions/tax-documents"

  - name: Anonymous
    description: "Unauthenticated caller; may only register as an investor."
    identity: "opaque"
    exclusive_operations:
      - "POST /investors"
    shared_operations: []
