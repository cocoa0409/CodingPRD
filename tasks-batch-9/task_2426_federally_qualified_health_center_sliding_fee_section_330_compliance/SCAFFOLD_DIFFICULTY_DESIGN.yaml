          assert:
            - "${enc6_charge} == 10000 and Encounter.${enc6_id}.charge_basis == FULL_CHARGE_UNVERIFIED"
            - "3 seats: ${g3_pct} == 66.67 and ${g3_industry} == 1 and ${g3_nonpatient} == 1 and ${g3_posture} == GOVERNANCE_DEFICIENT  # 1 > floor(1/2) == 0"
            - "4 seats: ${g4_pct} == 50.00 and ${g4_posture} == GOVERNANCE_DEFICIENT  # industry cap now satisfied, majority fails by 1.00 point"
            - "5 seats: ${g5_pct} == 60.00 and ${g5_posture} == GOVERNANCE_COMPLIANT"
            - "HealthCenter.${hc_id}.seated_board_count == 5 and patient_seat_pct == 60.00"
            - "GET /health-centers/${hc_id}/governance-summary returns qualified_patient_seat_count == 3 and healthcare_industry_seat_count == 1"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: encounter_creation_depends_on_service_site_scope_state
        grounds:
          - validations[priority=33]
          - errors.ERR_SITE_NOT_IN_SCOPE
          - state_machines.ServiceSite.IN_SCOPE_to_SUSPENDED
          - state_machines.ServiceSite.SUSPENDED_to_IN_SCOPE
          - entities.HealthCenter.fields.in_scope_site_count
          - endpoints[POST /encounters]
        distinguishing_aspect: |
          ENTITY PAIR (Encounter, ServiceSite). Nothing about the encounter payload changes between
          the rejected and the accepted call: the same patient, service, date, payer and gross charge
          are refused with 409 while the site is SUSPENDED and accepted after a ProjectOfficer
          reinstates it. The gate lives entirely in the other entity's state.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health'"
            - "Patient 'Ada Rivera' is VERIFIED at fpg_percent 100.00 with tier PARTIAL_A"
            - "A ProjectOfficer suspends Main Clinic, so its status is SUSPENDED and in_scope_site_count is 0"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - *s_p1
            - *s_iv1
            - *s_iv1v
            - call: "POST /service-sites/${site_id}/suspend"
              payload: {}
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { site_status_suspended: $.data.status }
          trigger:
            - call: "POST /encounters"
              payload: { patient_id: "${p1_id}", service_site_id: "${site_id}", service_definition_id: "${svc_id}", encounter_date: "2026-03-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 12000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "POST /service-sites/${site_id}/reinstate"
              payload: {}
              as: ProjectOfficer
              as_user_id: "po-1"
              captures: { site_status_reinstated: $.data.status, site_in_scope_since: $.data.in_scope_since }
            - call: "POST /encounters"
              payload: { patient_id: "${p1_id}", service_site_id: "${site_id}", service_definition_id: "${svc_id}", encounter_date: "2026-03-01T00:00:00Z", payer_type: "SELF_PAY", gross_charge_cents: 12000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { enc7_id: $.data.id, enc7_charge: $.data.patient_charge_cents }
          assert:
            - "${site_status_suspended} == SUSPENDED"
            - "first trigger response status == 409 with data.error_id == ERR_SITE_NOT_IN_SCOPE"
            - "${site_status_reinstated} == IN_SCOPE and ${site_in_scope_since} == 2026-08-01T00:00:00Z"
            - "third trigger response status == 201 and ${enc7_charge} == 2500"
            - "Encounter.${enc7_id}.charge_basis == SLIDING_FEE_TIER and pinned_discount_tier_id == ${t2_id}"
            - "HealthCenter.${hc_id}.in_scope_site_count == 1"
            - "Patient.${p1_id}.patient_balance_cents == 2500"

      - name: scope_review_depends_on_board_member_seating_at_the_same_grantee
        grounds:
          - validations[priority=14]
          - errors.ERR_NOT_SEATED_BOARD_MEMBER
          - roles.BoardChair.identity
          - state_machines.ScopeChangeRequest.SUBMITTED_to_UNDER_REVIEW
          - entities.BoardMember.fields.health_center_id
          - endpoints[POST /scope-change-requests/{id}/begin-review]
        distinguishing_aspect: |
          A DIFFERENT entity pair (ScopeChangeRequest, BoardMember) and a subtler dependency than a
          role check: the caller IS a SEATED BoardMember with a valid BoardChair identity — just of
          another grantee. Role-based authorisation alone (p3) passes; only the per-grantee seating
          lookup rejects it, and the grantee's own chair then succeeds on the identical request.
        test_recipe:
          setup:
            - "BOOT_FS for 'Riverbend Community Health', baseline locked, with a PROPOSED 'Eastside Annex' site and a SUBMITTED ADD_SITE ScopeChangeRequest"
            - "A second grantee 'Northgate Health' has its own SEATED NON_PATIENT board seat"
          setup_api_calls:
            - *s_pg25
            - *s_pg26
            - *s_hc
            - *s_site
            - *s_svc
            - *s_chair
            - *s_fs
            - *s_t1
            - *s_t2
            - *s_t3
            - *s_t4
            - *s_t5
            - *s_hcv
            - *s_adopt
            - *s_lock
            - *s_site2
            - *s_scr_add
            - call: "POST /scope-change-requests/${scr_id}/submit"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /health-centers"
              payload: { legal_name: "Northgate Health", grant_number: "H80CS00430", pps_base_rate_cents: 17000, medicare_upper_limit_cents: 15000 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { nhc_id: $.data.id }
            - call: "POST /health-centers/${nhc_id}/board-members"
              payload: { seat_number: 1, seat_type: "NON_PATIENT", expertise_category: "HEALTH_PROFESSION", term_start: "2026-01-01T00:00:00Z", term_end: "2028-12-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-north"
              captures: { nchair_id: $.data.id, nchair_status: $.data.status }
          trigger:
            - call: "POST /scope-change-requests/${scr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "${nchair_id}"
            - call: "POST /scope-change-requests/${scr_id}/begin-review"
              payload: {}
              as: BoardChair
              as_user_id: "${chair_id}"
              captures: { scr_status_after: $.data.status, scr_reviewer: $.data.reviewed_by_user_id }
          assert:
            - "${nchair_status} == SEATED  # the foreign chair is a legitimate SEATED BoardMember"
            - "first trigger response status == 403 with data.error_id == ERR_NOT_SEATED_BOARD_MEMBER"
            - "first trigger response status != 200 and ScopeChangeRequest.${scr_id} was not mutated by it"
            - "second trigger response status == 200 and ${scr_status_after} == UNDER_REVIEW"
            - "${scr_reviewer} == ${chair_id}"
            - "ServiceSite.${site2_id}.status == PROPOSED"

      - name: scope_approval_depends_on_fee_schedule_review_status
        grounds:
          - validations[priority=20]
          - validations[priority=19]
          - errors.ERR_FEE_SCHEDULE_OUT_OF_DATE
          - calculations.fee_schedule_review_status
          - calculations.governance_posture
          - state_machines.ScopeChangeRequest.UNDER_REVIEW_to_APPROVED
          - endpoints[POST /poverty-guidelines]
        distinguishing_aspect: |
          A THIRD entity pair (ScopeChangeRequest, FeeSchedule) whose dependency is created by a
          third, otherwise unrelated entity: publishing a PovertyGuideline for 2027 makes the
          grantee's 2026-based schedule OUT_OF_DATE under precedence rule R1 even though it was
          reviewed days ago, and the pending ADD_SITE approval — untouched, still UNDER_REVIEW, with
          a fully compliant patient-majority board — is refused. Nothing was written to the
          ScopeChangeRequest or the FeeSchedule to cause this.
        test_recipe:
          setup:
            - "BOOT_GOV for 'Riverbend Community Health': 3 seated seats, patient_seat_pct 66.67, governance_posture GOVERNANCE_COMPLIANT"
            - "Baseline locked; a PROPOSED 'Eastside Annex' site has an ADD_SITE ScopeChangeRequest prepared by co-1 and now UNDER_REVIEW with the grantee's own chair as reviewer"
            - "A PovertyGuideline row for 2027 (base 1680000, increment 590000) is then published, so the latest guideline year becomes 2027"
