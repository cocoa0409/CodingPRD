# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/vetpay/_clock/set_current_utc"
    description: "Set the logical clock. Default before any call is exactly 2026-09-01T00:00:00Z; never falls back to wall clock. Advancing the clock fires the waiting-period, rate-filing effectiveness, settlement-delay, and age-band sweeps."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["system sweeps: Policy waiting transitions, TerritoryRateFiling DRAFT->EFFECTIVE n/a (FILED->EFFECTIVE), Claim PAID->SETTLED, Policy age-band premium recalculation"]

  # --- TerritoryRateFiling ---
