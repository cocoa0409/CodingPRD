      - name: customer_axes_move_independently_corner
        claim_type: parallel
        excluded_because:
          difficulty_instance: customer_trading_and_audit_axes_advance_independently
          rationale: |
            That §1.8 instance already drives trading_status and audit_status through four
            interleaved moves on one Customer row and asserts every intermediate pair, which
            is exactly the `parallel` shape claim (independent dimensions change
            independently; the combined state is correct).
        grounds:
          - state_machines.Customer.trading_status
          - state_machines.Customer.audit_status

      - name: promotion_create_needs_an_approved_parent_corner
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: promotion_create_gated_on_budget_allocation_status
          rationale: |
            That §1.8 instance is the cross-entity guard in full: the same create call is
            refused while the BudgetAllocation is DRAFT and succeeds unchanged once the
            allocation is APPROVED, with the allocation's own version pinned across both
            attempts.
        grounds:
          - state_machines.BudgetAllocation.status.DRAFT_to_APPROVED
          - errors[ERR_ALLOCATION_NOT_APPROVED]

      - name: accrual_reversal_undoes_its_side_effects_corner
        claim_type: compensation
        excluded_because:
          difficulty_instance: accrual_reversal_restores_the_accrual_dollar_identity
          rationale: |
            That §1.8 instance reverses a posted accrual and re-checks the whole
            conservation identity plus the spend_status walk back down, which is the
            `compensation` claim (undo transition reverses all original side effects with
            no drift).
        grounds:
          - state_machines.AccrualEntry.POSTED_to_REVERSED
          - calculations.promotion_accrual_ledger

  # ===========================================================================
  # 3. From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: program_rollup_counts_draft_and_approved_allocations_alike
        claim_type: input_set_filtering
        grounds:
          - calculations.program_budget_rollup
          - entities.TradeProgram.fields.allocated_amount
          - entities.TradeProgram.fields.unallocated_amount
        distinguishing_aspect: |
          BudgetAllocation has no void state, so BOTH a DRAFT allocation of 30000.00 and an
          APPROVED one of 20000.00 count: allocated_amount is 50000.00 and
          unallocated_amount 50000.00 against a 100000.00 envelope. Counting only APPROVED
          rows (30000.00 missing) fails this instance.
        test_recipe:
          setup:
            - "One program of 100000.00 with two allocations, one left DRAFT and one approved."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 100000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id, unallocated_at_start: $.data.unallocated_amount }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "SEASONAL", planned_amount: 30000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_draft_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "EVERYDAY", planned_amount: 20000.00, baseline_units: 10000, planned_incremental_units: 5000 }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { alloc_appr_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_appr_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
          trigger:
            - call: "GET /trade-marketing/programs/${prog_id}"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
          assert:
            - "${unallocated_at_start} == 100000.00"
            - "BudgetAllocation.${alloc_draft_id}.status == DRAFT and BudgetAllocation.${alloc_appr_id}.status == APPROVED"
            - "TradeProgram.${prog_id}.allocated_amount == 50000.00"
            - "TradeProgram.${prog_id}.unallocated_amount == 50000.00"
            - "BudgetAllocation.${alloc_draft_id}.available_amount == 30000.00 and .unreserved_units == 20000"

      - name: commitment_coverage_is_vacuously_true_for_a_tpr_only_promotion
