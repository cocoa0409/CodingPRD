  - section: consistency_model
    instances:
      - name: approval_cascade_is_visible_immediately_in_the_same_request
        claim_type: immediate
        grounds: ["state_machines.CoverageReport.SUBMITTED_to_APPROVED", "entities.LiteraryProperty.fields.tracking_tier", "entities.TrackingBoardEntry.fields.heat_score"]
        distinguishing_aspect: "The consistency model is immediate, not eventual: the approve response itself already carries status APPROVED, and a read issued straight afterwards - with no intervening write and no delay - shows the assignment COMPLETED, the submission TRACKED, the board entry minted and the property tier raised."
        test_recipe:
          setup: ["A CLEAR COMEDY property's only submission is covered by Reader R1 (calibration_bias 0.00) with craft scores 9/9/9/9/9 and recommendation STRONG_RECOMMEND; the report is SUBMITTED."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Same Request", material_type: "SPEC_SCRIPT", source_author_name: "C. Duval", genre: "COMEDY", logline: "Everything lands at once." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "CHAIN_OF_TITLE", executed_on: "2026-01-15", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "COPYRIGHT_CERT", executed_on: "2026-01-16", verified: true }
              as: BusinessAffairs
            - call: "POST /literary-properties/${p_id}/rights-documents"
              payload: { doc_type: "WGA_REGISTRATION", executed_on: "2026-01-17", verified: true }
              as: BusinessAffairs
            - call: "POST /readers"
              payload: { display_name: "R1 Solberg", specialty_genre: "COMEDY", weekly_capacity: 2, employment_type: "STAFF" }
              as: SlateAdmin
              captures: { r1_id: "$.data.id" }
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "CAA", submitter_contact_email: "desk@caa.example", submitted_via: "AGENCY" }
              as: Submitter
              captures: { s_id: "$.data.id" }
            - call: "POST /submissions/${s_id}/clear-intake"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-assign-1"
            - call: "POST /submissions/${s_id}/assign-reader"
              payload: { reader_id: "${r1_id}", window_start: "2026-09-01T00:00:00Z", window_due: "2026-09-04T00:00:00Z" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { ca_id: "$.data.id" }
            - call: "GET /coverage-reports"
              payload: { assignment_id: "${ca_id}" }
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { rep_id: "$.data[0].id" }
            - call: "PATCH /coverage-reports/${rep_id}"
              payload: { logline_score: 9, structure_score: 9, character_score: 9, dialogue_score: 9, marketability_score: 9, recommendation: "STRONG_RECOMMEND", synopsis_word_count: 500 }
              as: Reader
              as_user_id: "${r1_id}"
            - call: "POST /coverage-reports/${rep_id}/submit"
              payload: {}
              as: Reader
              as_user_id: "${r1_id}"
          trigger:
            - call: "POST /coverage-reports/${rep_id}/approve"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-approve-1"
            - call: "GET /literary-properties/${p_id}"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-approve-1"
            - call: "GET /tracking-board-entries"
              payload: { property_id: "${p_id}" }
              as: StoryEditor
              as_user_id: "editor-approve-1"
          assert:
            - "the approve response body already reports status == APPROVED and approved_by_user_id == \"editor-approve-1\""
            - "the immediately following GET /literary-properties/${p_id} reports tracking_tier == PRIORITY"
            - "the immediately following GET /tracking-board-entries filtered by property_id == ${p_id} returns total_count 1 with heat_score == 130.00, board_tier == PRIORITY and status LIVE"
            - "CoverageAssignment.${ca_id}.status == COMPLETED"
            - "Submission.${s_id}.status == TRACKED"
            - "Reader.${r1_id}.calibration_bias == 3.50"

  - section: validations
    instances:
      - name: clear_intake_without_executed_release_returns_release_form_required
        claim_type: violation_to_error
        grounds: ["validations[priority=82]", "errors[ERR_RELEASE_FORM_REQUIRED]", "entities.Submission.fields.release_form_required", "state_machines.Submission.RECEIVED_to_INTAKE_CLEARED"]
        distinguishing_aspect: "clear-intake IS declared from RECEIVED, so the priority-70 state check passes and the priority-82 release check is the one that fires: an UNSOLICITED submission with no EXECUTED or WAIVED form is refused 409 ERR_RELEASE_FORM_REQUIRED, not ERR_INVALID_STATE and not ERR_RELEASE_FORM_EXPIRED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A DRAMA property with rights_chain_status UNVERIFIED carries an UNSOLICITED submission, so release_form_required is true and status is RECEIVED."
            - "No ReleaseForm has been opened on that submission at all, so none is EXECUTED, WAIVED or EXPIRED."
            - "A sibling AGENCY submission from CAA on the same property has release_form_required false and clears intake without issue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SlateAdmin
            - call: "POST /literary-properties"
              payload: { title: "Unsigned Release", material_type: "SPEC_SCRIPT", source_author_name: "D. Weisz", genre: "DRAMA", logline: "Nobody ever signed the form." }
              as: StoryEditor
              captures: { p_id: "$.data.id" }
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "CAA", submitter_contact_email: "desk@caa.example", submitted_via: "AGENCY" }
              as: Submitter
              captures: { s_ok_id: "$.data.id" }
            - call: "POST /submissions/${s_ok_id}/clear-intake"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-assign-1"
            - call: "POST /submissions"
              payload: { property_id: "${p_id}", submitting_agency: "Self-submitted", submitter_contact_email: "dw@mail.example", submitted_via: "UNSOLICITED" }
              as: Submitter
              captures: { s_id: "$.data.id" }
          trigger:
            - call: "POST /submissions/${s_id}/clear-intake"
              payload: {}
              as: StoryEditor
              as_user_id: "editor-assign-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_RELEASE_FORM_REQUIRED"
            - "response data.error_id != ERR_INVALID_STATE"
            - "response data.error_id != ERR_RELEASE_FORM_EXPIRED"
            - "Submission.${s_id}.release_form_required == true"
            - "Submission.${s_id}.status == RECEIVED"
            - "Submission.${s_ok_id}.release_form_required == false"
            - "Submission.${s_ok_id}.status == INTAKE_CLEARED"
            - "GET /submissions/${s_id}/release-forms returns total_count 0"
