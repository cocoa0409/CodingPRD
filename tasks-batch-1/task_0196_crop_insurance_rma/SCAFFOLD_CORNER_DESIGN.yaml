  - section: rbac
    instances:
      - name: rbac_agent_cannot_open_program
        claim_type: Cannot perform other roles' exclusive ops
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Agent calling POST /commodity-programs/{id}/open (an RmaAdmin-exclusive op) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A DRAFT program exists; acting as Agent"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Sales Agent", license_number: "C-A28", role_kind: "SELLING" }
              as: RmaAdmin
              captures: { sa_id: $.data.id }
            - call: "POST /commodity-programs"
              payload: { crop_code: "CORN", county_code: "19153", crop_year: 2026, projected_price: 4.00, base_premium_rate: 0.085, pp_coverage_factor: 0.60, final_planting_date: "2026-05-31T00:00:00Z", acreage_reporting_deadline: "2026-07-15T00:00:00Z" }
              as: RmaAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /commodity-programs/${prog_id}/open"
              payload: {}
              as: Agent
              as_user_id: "${sa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 403"
            - "response error_id == ERR_FORBIDDEN"
            - "CommodityProgram.${prog_id}.status == DRAFT"

      - name: rbac_lossadjuster_cannot_create_policy
        claim_type: Cannot perform other roles' exclusive ops
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "LossAdjuster calling POST /policies (an Agent-exclusive op) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["A producer and an adjuster agent exist"]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "Adjuster", license_number: "C-J29", role_kind: "ADJUSTING" }
