  - section: rbac
    instances:
      - name: auditor_write_attempt_forbidden
        claim_type: rbac_denial
        grounds:
          - roles[Auditor]
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_FOR_ROLE]
        distinguishing_aspect: "Auditor is read-only: POST /tax/jurisdictions as Auditor fails 403 ERR_FORBIDDEN_FOR_ROLE while the same principal's GETs succeed."
        test_recipe:
          setup: ["One jurisdiction US-FED exists (created by TaxManager)"]
          setup_api_calls:
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
          trigger:
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-CA", name: "California", level: STATE, statutory_rate_bp: 884, apportionment_pct_bp: 2500, return_due_month: 4, return_due_day: 15 }
              as: Auditor
              captures: { err: $.data.error_id }
            - call: "GET /tax/jurisdictions/${jur_fed}"
              payload: {}
              as: Auditor
              captures: { code: $.data.code }
          assert:
            - "Write as Auditor: HTTP 403, err == ERR_FORBIDDEN_FOR_ROLE, no jurisdiction created"
            - "Read as Auditor: 200, code == 'US-FED'"

      - name: accountant_cannot_approve_allowance_forbidden
        claim_type: rbac_denial
        grounds:
          - roles[TaxAccountant]
          - "endpoints.POST /tax/valuation-allowances/{allowanceId}/approve"
        distinguishing_aspect: "Approve is exclusive to TaxDirector: a TaxAccountant calling it gets ERR_FORBIDDEN_FOR_ROLE even with a fresh SUBMITTED assessment in place."
        test_recipe:
          setup: ["FY2026 OPEN; VA1 DRAFT created by mgr-1 with correct OCC version"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_v0}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - call: "POST /tax/valuation-allowances/${va1}/approve"
              payload: {}
              as: TaxAccountant
              as_user_id: "acct-9"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE (HTTP 403); the allowance stays SUBMITTED"

      - name: preparer_cannot_approve_own_allowance
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=6]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.ValuationAllowance.SUBMITTED_to_APPROVED
        distinguishing_aspect: "Segregation of duties: the same X-User-ID that prepared the assessment cannot approve it even with the TaxDirector role; a different director id succeeds."
        test_recipe:
          setup: ["FY2026 OPEN; VA1 SUBMITTED, prepared_by_user_id == 'mgr-1'"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id, ty_v0: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_v0}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
          trigger:
            - call: "POST /tax/valuation-allowances/${va1}/approve"
              payload: {}
              as: TaxDirector
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
            - call: "POST /tax/valuation-allowances/${va1}/approve"
              payload: {}
              as: TaxDirector
              as_user_id: "dir-2"
              captures: { st: $.data.status, ap: $.data.approved_by_user_id }
          assert:
            - "Same-user approve: err == ERR_SEGREGATION_OF_DUTIES (HTTP 403); stays SUBMITTED"
            - "Different-user approve: status == APPROVED, approved_by_user_id == 'dir-2'"

  - section: cross_cutting_layers
    instances:
      - name: va_create_stale_version_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[va-create-stale-tax-year]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "optimistic_concurrency layer: two valuation-allowance creations carrying the same observed TaxYear version — the first succeeds and bumps the version (superseding nothing), the second is rejected 412 ERR_STALE_VERSION because its view is stale."
        test_recipe:
          setup: ["FY2026 OPEN at version v (captured from a GET); no assessments yet"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_v: $.data.version }
          trigger:
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_v}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: true, projected_taxable_income_cents: 5000000, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_v}" }
              as: TaxManager
              as_user_id: "mgr-2"
              captures: { err: $.data.error_id }
          assert:
            - "First create succeeds (201) at the observed version"
            - "Second create with the same stale expected_tax_year_version: HTTP 412, err == ERR_STALE_VERSION — it would otherwise have superseded an assessment the writer never saw"

      - name: filing_file_stale_version_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[filing-file-stale-tax-year]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "optimistic_concurrency layer on the second write endpoint: two READY filings of one year, one observed version — the first file bumps TaxYear.version, so the second file carrying the stale version is rejected 412 and must re-read before its RTP inputs are trusted."
        test_recipe:
          setup: ["FY2026 PROVISION_LOCKED; FED and CA filings both READY (21,100,000 and 2,200,000); one TaxYear version observed before either filing lands"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-05T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-CA", name: "California", level: STATE, statutory_rate_bp: 884, apportionment_pct_bp: 2500, return_due_month: 4, return_due_day: 15, extension_months: 7 }
              as: TaxManager
              captures: { jur_ca: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil_fed: $.data.id }
            - call: "POST /tax/filings"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_ca}", original_due_date: "2027-04-15" }
              as: TaxAccountant
              captures: { fil_ca: $.data.id }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxManager
              captures: { ty_va_v: $.data.version }
            - call: "POST /tax/valuation-allowances"
              payload: { tax_year_id: "${ty_id}", more_likely_than_not: false, projected_taxable_income_cents: 0, reversing_dtl_cents: 0, expected_tax_year_version: "${ty_va_v}" }
              as: TaxManager
              as_user_id: "mgr-1"
              captures: { va1: $.data.id }
            - { call: "POST /tax/valuation-allowances/${va1}/submit", payload: {}, as: TaxManager, as_user_id: "mgr-1" }
            - { call: "POST /tax/valuation-allowances/${va1}/approve", payload: {}, as: TaxDirector, as_user_id: "dir-1" }
            - { call: "POST /tax/tax-years/${ty_id}/lock-provision", payload: {}, as: TaxDirector }
            - { call: "POST /tax/filings/${fil_fed}/mark-ready", payload: { return_tax_liability_cents: 21100000 }, as: TaxAccountant }
            - { call: "POST /tax/filings/${fil_ca}/mark-ready", payload: { return_tax_liability_cents: 2200000 }, as: TaxAccountant }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: TaxDirector
              captures: { ty_v: $.data.version }
          trigger:
            - { call: "POST /tax/filings/${fil_fed}/file", payload: { expected_tax_year_version: "${ty_v}" }, as: TaxDirector, captures: { st1: $.data.status } }
            - call: "POST /tax/filings/${fil_ca}/file"
              payload: { expected_tax_year_version: "${ty_v}" }
              as: TaxDirector
              captures: { err: $.data.error_id }
          assert:
            - "First file succeeds: status == FILED (TaxYear.version advanced by the RTP cascade)"
            - "Second file with the stale expected_tax_year_version: HTTP 412, err == ERR_STALE_VERSION"
            - "CA filing remains READY; no partial RTP recompute leaked from the rejected call"

      - name: net_deferred_asset_reconciles_after_each_lock
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.deferred_tax_movement
          - entities.TaxYear.fields.net_deferred_asset_cents
        distinguishing_aspect: "derived_field_reconciliation layer: the parent's denormalized net_deferred_asset_cents tracks the children after EVERY lock — 630,000 after the first TEMPORARY lock, 840,000 after the second — never a stale aggregate."
        test_recipe:
          setup: ["FY2026 OPEN; US-FED; two TEMPORARY differences (+3,000,000 and +1,000,000) both REVIEWED"]
          setup_api_calls:
            - call: "POST /tax/tax-years"
              payload: { fiscal_year_label: "FY2026", period_start_date: "2026-01-01", period_end_date: "2026-12-31", enacted_federal_rate_bp: 2100, pretax_book_income_cents: 100000000, prior_year_total_tax_cents: 8000000 }
              as: TaxManager
              captures: { ty_id: $.data.id }
            - call: "POST /tax/jurisdictions"
              payload: { code: "US-FED", name: "United States Federal", level: FEDERAL, statutory_rate_bp: 2100, apportionment_pct_bp: 10000, return_due_month: 4, return_due_day: 15, extension_months: 6 }
              as: TaxManager
              captures: { jur_fed: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "accrued warranty", book_amount_cents: 5000000, tax_amount_cents: 2000000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { d1: $.data.id }
            - call: "POST /tax/book-tax-differences"
              payload: { tax_year_id: "${ty_id}", jurisdiction_id: "${jur_fed}", description: "deferred revenue", book_amount_cents: 3000000, tax_amount_cents: 2000000, difference_type: TEMPORARY }
              as: TaxAccountant
              captures: { d2: $.data.id }
            - { call: "POST /tax/book-tax-differences/${d1}/review", payload: {}, as: TaxManager }
            - { call: "POST /tax/book-tax-differences/${d2}/review", payload: {}, as: TaxManager }
          trigger:
            - { call: "POST /tax/book-tax-differences/${d1}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { nda1: $.data.net_deferred_asset_cents, de1: $.data.deferred_expense_cents }
            - { call: "POST /tax/book-tax-differences/${d2}/lock", payload: {}, as: TaxManager }
            - call: "GET /tax/tax-years/${ty_id}"
              payload: {}
              as: Auditor
              captures: { nda2: $.data.net_deferred_asset_cents, de2: $.data.deferred_expense_cents }
          assert:
            - "After first lock: net_deferred_asset_cents == 630000, deferred_expense_cents == -630000"
            - "After second lock: net_deferred_asset_cents == 840000, deferred_expense_cents == -840000  # +210,000 = round(1,000,000 * 2100/10000)"
