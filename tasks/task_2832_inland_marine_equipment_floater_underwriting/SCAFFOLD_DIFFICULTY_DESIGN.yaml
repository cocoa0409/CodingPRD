  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: total_loss_settlement_four_hop_cascade
        grounds:
          - state_machines.Claim.TOTAL_LOSS_DECLARED_to_SETTLED
          - state_machines.EquipmentItem.ACTIVE_to_TOTALED
          - calculations.endorsement_prorated_premium
          - calculations.coverage_part_equipment_premium
          - calculations.policy_written_premium
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          A single settle call propagates four hops in the CLAIM -> ITEM ->
          PART -> POLICY direction: the loss ledger and the part's conserved
          capacity move first, that move takes the item to TOTALED, the TOTALED
          item drops out of the part premium and mints an ENDORSEMENT_RETURN of
          129632 prorated on the SETTLEMENT clock (273 of 365 days remaining),
          and only then does the policy re-roll to the 100000 minimum with
          premium_balance_cents 50619 - each hop reads state written by the hop
          before it.
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, term_days 365, minimum_premium_cents 100000, written_premium_cents 180251, premium_balance_cents 180251 (one INITIAL_PREMIUM entry)."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart: ACV, SCHEDULED, deductible 100000, per_item_limit 20000000, aggregate_limit 200000000, aggregate_available 200000000, aggregate_paid_net 0, rated_premium_cents 173318."
            - "One ACTIVE EquipmentItem E1: insured_value_cents 8160000, rated_premium_cents 173318."
            - "Logical clock advanced to 2026-11-01T00:00:00Z, leaving 273 days of the 365-day term."
            - "One Claim on E1 with loss_date 2026-11-01, INSPECTED with repair_estimate_cents 7000000 and actual_value_at_loss_cents 8160000 (7000000 >= the 6120000 threshold so REPAIR is barred), adjusted TOTAL_LOSS by adjuster adj-1."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ridgeline Contractors", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E1 excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${item_e1}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-11-01", loss_type: "THEFT", equipment_item_id: "${item_e1}" }
              as: Underwriter
              captures: { clm: $.data.id }
            - call: "POST /inland-marine/claims/${clm}/inspect"
              payload: { repair_estimate_cents: 7000000, actual_value_at_loss_cents: 8160000 }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /inland-marine/claims/${clm}/adjust"
              payload: { adjustment_basis: "TOTAL_LOSS" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          trigger:
            - call: "POST /inland-marine/claims/${clm}/settle"
