            - { call: "POST /reforestation/crop-batches/${b_id}/sow", payload: { actual_sow_date: "2026-09-01", sown_grams: 600 }, as: NurseryManager }
            - { call: "POST /reforestation/crop-batches/${b_id}/lift", payload: { lifted_on: "2027-03-10", lifted_count: 48000 }, as: NurseryManager }
            - { call: "POST /reforestation/crop-batches/${b_id}/grade", payload: { plantable_count: 45000 }, as: NurseryManager }
            - { call: "POST /reforestation/seedling-orders", payload: { landowner_id: "${lo_id}", destination_zone_id: "${z_dst}", species: "DOUGLAS_FIR", quantity: 9000, requested_ship_date: "2027-04-05" }, as: Landowner, as_user_id: "${lo_id}", captures: { o_id: $.data.id } }
