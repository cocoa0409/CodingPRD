              captures: { stmt_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: BillingSpecialist
          trigger:
            - call: "POST /patient-statements/${stmt_id}/send-to-collections"
              payload: {}
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_AGING_NOT_MET"
