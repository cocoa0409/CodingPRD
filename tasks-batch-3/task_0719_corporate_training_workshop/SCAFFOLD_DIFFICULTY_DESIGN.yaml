  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: program_version_design_revision_cycle
        grounds:
          - state_machines.ProgramVersion.DRAFT_to_IN_REVIEW
          - state_machines.ProgramVersion.IN_REVIEW_to_DRAFT
          - state_machines.ProgramVersion.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Cyclic shape on ProgramVersion: DRAFT -> IN_REVIEW -> DRAFT (request-changes) is a true revision loop that
          returns to a prior state, then DRAFT -> IN_REVIEW -> APPROVED — the entity loops back, not a linear pipeline.
        test_recipe:
          setup:
            - "A program exists; a DRAFT ProgramVersion is created with complete PER_SEAT pricing"
          setup_api_calls:
            - call: "POST /training/programs"
              payload: { title: "Loop Prog", category: "LEADERSHIP", delivery_mode: "VIRTUAL" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 6, pricing_model: "PER_SEAT", per_seat_cents: 30000 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
          trigger:
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
              captures: { st1: $.data.status }
            - call: "POST /training/program-versions/${pv_id}/request-changes"
              payload: {}
              as: ProgramDesigner
              captures: { st2: $.data.status }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
              captures: { st3: $.data.status }
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
              captures: { st4: $.data.status }
          assert:
            - "ProgramVersion.status == IN_REVIEW after first submit"
            - "ProgramVersion.status == DRAFT after request-changes (looped back to prior state)"
            - "ProgramVersion.status == IN_REVIEW after second submit"
            - "ProgramVersion.status == APPROVED after approve"

      - name: cohort_open_branches_lock_or_cancel
        grounds:
          - state_machines.Cohort.OPEN_to_LOCKED
          - state_machines.Cohort.OPEN_to_CANCELLED
        distinguishing_aspect: |
          Branching (fork) shape on Cohort: from OPEN the machine forks to either LOCKED (lock, emits PROVISIONAL invoice)
          or CANCELLED (cancel, cascades registrations) — divergent side-effect sets per branch, on a different entity
          than ProgramVersion's cycle.
        test_recipe:
          setup:
