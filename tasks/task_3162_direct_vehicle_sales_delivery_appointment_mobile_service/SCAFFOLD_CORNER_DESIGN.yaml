              payload: { buyer_id: "${byr_id}", configuration_id: "${cfg_id}", jurisdiction_id: "${jur_id}", delivery_center_id: "${ctr_id}", order_fee_cents: 25000 }
              as: PlatformAdmin
              captures: { ord_draft_id: $.data.id }
          trigger:
            - call: "GET /v1/orders"
              payload: { buyer_id: "${byr_id}", status: "DRAFT" }
              as: PlatformAdmin
              captures: { draft_row_id: "$.data[0].id" }
            - call: "GET /v1/orders"
              payload: { buyer_id: "${byr_id}", limit: 1, offset: 0 }
              as: PlatformAdmin
              captures: { page_row_id: "$.data[0].id" }
          assert:
            - "the status=DRAFT filter returns exactly 1 row, order ${ord_draft_id}, reporting total_count 1"
            - "\"${draft_row_id}\" == \"${ord_draft_id}\""
            - "the limit=1 page returns exactly 1 row and reports total_count 2 with has_more true"
            - "the page row \"${page_row_id}\" is the order placed earliest, because the listing orders by created_at ascending"
            - "the status=PLACED filter returns exactly 1 row"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: configuration_change_after_the_lock_deadline_is_refused
        claim_type: Conditional action
        grounds:
          - endpoints.POST_/v1/orders/{id}/configuration-changes
          - errors[ERR_CONFIG_LOCK_DEADLINE_PASSED]
          - validations[priority=7]
        distinguishing_aspect: "The configuration-change action is conditional on the lock window: one second past configuration_lock_deadline the endpoint returns 409 with ERR_CONFIG_LOCK_DEADLINE_PASSED and the order's option list is untouched."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; an order placed so configuration_lock_deadline is 2026-09-15T00:00:00Z; a TOW_HITCH option available."
          setup_api_calls:
            - *c_clock
            - *c_jur
            - *c_enact
            - *c_center
            - *c_cfg
            - call: "POST /v1/vehicle-configurations/${cfg_id}/options"
              payload: { option_sku: "TOW_HITCH", option_category: "TOWING", price_cents: 130000 }
              as: PlatformAdmin
              captures: { opt_tow_id: $.data.id }
            - *c_buyer
            - *c_verify
            - *c_order
            - *c_place
            - call: "POST /v1/_clock/set_current_utc"
