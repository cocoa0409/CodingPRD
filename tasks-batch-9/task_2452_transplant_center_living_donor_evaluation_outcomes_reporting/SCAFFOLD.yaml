scenario: |
  2452. Transplant Center Living Donor Evaluation & Outcomes Reporting (transplant center): recipient
  candidacy evaluation and waitlist registration with status updates, living donor independent advocate
  assignment and informed consent process, donor medical/psychosocial evaluation with exclusion criteria
  and cooling-off period, paired exchange chain participation and logistics, organ offer response and
  cold ischemia planning, donor follow-up data submission at required intervals with completeness
  thresholds, program outcome monitoring against expected survival with flagging and improvement plans,
  insurance coverage of donor costs and lost-wage support programs

domain_name: transplant-living-donor-program
api_prefix: ""            # flat topology: every collection is a top-level path (/donor-candidates, /exchange-chains, ...)

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: graph_constraint
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # Peer top-level collections joined by FKs; ChainSegment is self-referential
  # (predecessor_segment_id) and forms a donor->recipient participation graph that
  # must close into a loop (PAIRED_LOOP) or terminate (NDD_CHAIN).

  state_machine_shape: cyclic
  # DonorCandidate carries three independent state dimensions (advocacy_status x
  # medical_status x psychosocial_status) whose combination drives a compound
  # overall_status; ExchangeChain cycles VALIDATED -> SUSPENDED -> VALIDATED;
  # DonorEvaluation cycles SUBMITTED -> DEFERRED -> SUBMITTED; RecipientCandidate
  # cycles ACTIVE -> INACTIVE_HOLD -> ACTIVE; ChainSegment cycles OFFER_SENT ->
  # DECLINED -> OFFER_SENT.

  relationship_patterns:
    - one_to_many          # TransplantProgram -> StaffMember / RecipientCandidate / DonorCandidate / ExchangeChain / OperatingRoom / ProgramOutcomeReview
    - many_to_many         # ChainSegment junctions DonorCandidate x RecipientCandidate inside an ExchangeChain
    - self_referential     # ChainSegment.predecessor_segment_id -> ChainSegment.id
    - polymorphic          # WaitlistStatusEvent.actor_user_id holds either an opaque operator id or a StaffMember.id
    - cross_aggregate      # ProcedureBooking spans OperatingRoom + ChainSegment + StaffMember(SURGEON)

  role_model: segregation_of_duties
  # The living-donor advocate may not be the coordinator who referred the donor nor
  # the coordinator who approved the paired recipient's candidacy; the psychosocial
  # reviewer may not be the medical reviewer of the same donor; adjudication of donor
  # cost claims sits with a role that cannot create them.

  consistency_model: immediate

difficulty_level: expert_plus
# 14 entities / 54 endpoints (33 writes + 21 reads) / 65 error codes /
# 15 calculation rules of which 3 are dual-variant / 13 state-machine dimensions
# across 11 entities (4 cyclic, 3 parallel dimensions on DonorCandidate plus its
# compound overall_status, 2 branching, 1 posture-driven).
# The surface sits at the top of the Expert band by density, not padding: every
# read either exposes a computed field a test must assert or is the sole reverse
# lookup for an FK, and every write drives at least one declared transition.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TransplantProgram
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Center program display name
      - name: center_code
        type: string
        source: input
        description: Unique center code
        constraints: unique across TransplantProgram
      - name: organ_type
        type: enum
        source: input
        description: Organ program this center runs
        default: KIDNEY
        constraints: "KIDNEY | LIVER"
      - name: cooling_off_days
        type: integer
        source: input
        description: Mandatory days between consent disclosure and advocate attestation
        default: 7
        constraints: ">= 1"
      - name: follow_up_completeness_threshold_pct
        type: number
        source: input
        description: Per-submission completeness percentage at or above which a DonorFollowUp counts complete
        default: 80
        constraints: "0 < value <= 100"
      - name: follow_up_compliance_threshold_pct
        type: number
        source: input
        description: Program-wide follow-up compliance percentage below which compliance_posture degrades to RESTRICTED
        default: 75
        constraints: "0 < value <= 100"
      - name: expected_one_year_survival_rate
        type: number
        source: input
        description: Expected one-year graft survival rate used as the denominator basis for outcome reviews
        default: 0.95
        constraints: "0 < value <= 1"
      - name: donor_fund_pool_cents
        type: integer
        source: input
        description: Total program fund available to reimburse donor costs
        default: 5000000
        constraints: ">= 0"
      - name: lost_wage_daily_cap_cents
        type: integer
        source: input
        description: Per-day cap applied to LOST_WAGES claims
        default: 30000
      - name: lost_wage_weekly_cap_cents
        type: integer
        source: input
        description: Per-week cap applied to LOST_WAGES claims
        default: 150000
      - name: donor_fund_committed_cents
        type: integer
        source: computed
        description: Sum of fund_part_cents over DonorCostClaim rows with status == ADJUDICATED (see calculations.donor_fund_ledger)
        default: 0
      - name: donor_fund_remaining_cents
        type: integer
        source: computed
        description: donor_fund_pool_cents - donor_fund_committed_cents (see calculations.donor_fund_ledger)
      - name: follow_up_compliance_pct
        type: number
        source: computed
        description: Program-wide follow-up compliance percentage (see calculations.program_follow_up_compliance)
        default: 100
      - name: cit_breach_count
        type: integer
        source: computed
        description: Count of ChainSegment rows of this program with cit_breach == true
        default: 0
      - name: compliance_posture
        type: enum
        source: computed
        description: Derived gate over child operations (see calculations.compliance_posture)
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: last_sweep_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent compliance sweep; null before the first sweep

  - name: StaffMember
    parent: TransplantProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> TransplantProgram.id; the program that employs this staff member
      - name: full_name
        type: string
        source: input
        description: Staff display name
      - name: staff_role
        type: enum
        source: input
        description: Credentialed duty of this staff member; gates which RBAC role may act as this id
        constraints: "TRANSPLANT_COORDINATOR | LIVING_DONOR_ADVOCATE | EVALUATION_REVIEWER | QUALITY_OFFICER | SURGEON"
      - name: npi
        type: string
        source: input
        description: National provider identifier string
      - name: is_active
        type: boolean
        source: input
        description: Whether the staff member may be referenced by new assignments
        default: true

  - name: RecipientCandidate
    parent: TransplantProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> TransplantProgram.id; owning program
      - name: mrn
        type: string
        source: input
        description: Medical record number
      - name: abo_blood_type
        type: enum
        source: input
        description: Recipient ABO blood type used for chain compatibility
        constraints: "O | A | B | AB"
      - name: age_years
        type: integer
        source: input
        description: Recipient age in whole years at registration
        constraints: ">= 0"
      - name: cpra
        type: number
        source: input
        description: Calculated panel reactive antibody fraction
        constraints: "0 <= value <= 1"
      - name: dialysis_years
        type: number
        source: input
        description: Years on dialysis, used by the waitlist priority score
        default: 0
      - name: medical_urgency_points
        type: integer
        source: input
        description: Committee-assigned urgency points
        default: 0
      - name: listing_status
        type: enum
        source: system
        description: Waitlist lifecycle state
        default: WORKUP
        constraints: "WORKUP | APPROVED_NOT_LISTED | DECLINED | ACTIVE | INACTIVE_HOLD | TRANSPLANTED | REMOVED"
      - name: candidacy_approved_by_staff_id
        type: string
        source: system
        description: FK -> StaffMember.id; the TRANSPLANT_COORDINATOR whose X-User-ID drove the WORKUP -> APPROVED_NOT_LISTED transition; null before approval
      - name: registered_at
        type: datetime
        source: system
        description: Logical-clock instant of the first APPROVED_NOT_LISTED -> ACTIVE transition; null before waitlist registration
      - name: active_days_total
        type: integer
        source: computed
        description: Whole days spent in listing_status ACTIVE (see calculations.waitlist_active_days)
        default: 0
      - name: waitlist_priority_score
        type: number
        source: computed
        description: Allocation priority score (see calculations.waitlist_priority_score)
        default: 0
      - name: offer_decline_count
        type: integer
        source: computed
        description: Count of ChainSegment rows for this recipient whose status is DECLINED
        default: 0

  - name: WaitlistStatusEvent
    parent: RecipientCandidate
    common_fields: false
    fields:
      - name: recipient_candidate_id
        type: string
        source: system
        description: FK -> RecipientCandidate.id; the candidate whose listing_status changed
      - name: from_status
        type: enum
        source: system
        description: listing_status before the change
        constraints: "WORKUP | APPROVED_NOT_LISTED | ACTIVE | INACTIVE_HOLD"
      - name: to_status
        type: enum
        source: system
        description: listing_status after the change
        constraints: "APPROVED_NOT_LISTED | DECLINED | ACTIVE | INACTIVE_HOLD | TRANSPLANTED | REMOVED"
      - name: reason_code
        type: string
        source: input
        description: Free-form reason code supplied by the caller
      - name: effective_at
        type: datetime
        source: input
        description: Instant the status change takes effect; drives waitlist_active_days interval arithmetic
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the principal that recorded the change - a StaffMember.id for TransplantCoordinator, an opaque operator id for ProgramAdmin; polymorphic, NOT a strict FK

  - name: DonorCandidate
    parent: TransplantProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> TransplantProgram.id; owning program
      - name: intended_recipient_id
        type: string
        source: input
        description: FK -> RecipientCandidate.id; the paired recipient, or null for a non-directed donor
      - name: referred_by_staff_id
        type: string
        source: system
        description: FK -> StaffMember.id; the TRANSPLANT_COORDINATOR (X-User-ID) that created this referral
      - name: advocate_staff_id
        type: string
        source: system
        description: FK -> StaffMember.id; the assigned LIVING_DONOR_ADVOCATE; null while advocacy_status == UNASSIGNED
      - name: mrn
        type: string
        source: input
        description: Donor medical record number
      - name: abo_blood_type
        type: enum
        source: input
        description: Donor ABO blood type used for chain compatibility
        constraints: "O | A | B | AB"
      - name: age_years
        type: integer
        source: input
        description: Donor age in whole years
        constraints: ">= 0"
      - name: advocacy_status
        type: enum
        source: system
        description: Independent living donor advocate dimension; evolves independently of the two clinical dimensions
        default: UNASSIGNED
        constraints: "UNASSIGNED | ASSIGNED | DISCLOSED | ATTESTED | OBJECTED"
      - name: disclosure_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent informed-consent disclosure; null before the first disclosure
      - name: disclosure_sequence
        type: integer
        source: computed
        description: Number of consent disclosures recorded so far; drives the re-disclosure cooling-off formula
        default: 0
      - name: cooling_off_ends_at
        type: datetime
        source: computed
        description: Earliest instant advocate attestation may be recorded (see calculations.cooling_off_window)
      - name: attestation_at
        type: datetime
        source: system
        description: Logical-clock instant of advocate attestation; null unless advocacy_status == ATTESTED
      - name: objection_reason_code
        type: string
        source: system
        description: Reason code recorded with an advocate objection; null unless advocacy_status == OBJECTED
      - name: medical_status
        type: enum
        source: computed
        description: Mirror of the latest determination on this donor's MEDICAL DonorEvaluation
        default: PENDING
        constraints: "PENDING | CLEARED | EXCLUDED | DEFERRED"
      - name: psychosocial_status
        type: enum
        source: computed
        description: Mirror of the latest determination on this donor's PSYCHOSOCIAL DonorEvaluation
        default: PENDING
        constraints: "PENDING | CLEARED | EXCLUDED | DEFERRED"
      - name: medical_risk_points
        type: integer
        source: computed
        description: risk_points of the latest MEDICAL DonorEvaluation with status IN {SUBMITTED, CLEARED, DEFERRED}
        default: 0
      - name: psychosocial_risk_points
        type: integer
        source: computed
        description: risk_points of the latest PSYCHOSOCIAL DonorEvaluation with status IN {SUBMITTED, CLEARED, DEFERRED}
        default: 0
      - name: deferral_count
        type: integer
        source: computed
        description: Number of DEFERRED determinations recorded across this donor's DonorEvaluation rows (cumulative, never decremented)
        default: 0
      - name: screening_risk_index
        type: number
        source: computed
        description: Provisional risk index (see calculations.donor_risk_index variant screening_index)
        default: 0
      - name: final_risk_index
        type: number
        source: computed
        description: Final risk index (see calculations.donor_risk_index variant final_index); null until both clinical dimensions are CLEARED and advocacy_status == ATTESTED
      - name: overall_status
        type: enum
        source: computed
        description: Compound status derived from the three dimensions plus chain participation (see calculations.donor_overall_status)
        default: REFERRED
        constraints: "REFERRED | EVAL_IN_PROGRESS | APPROVED | CONDITIONAL_APPROVED | EXCLUDED | ADVOCATE_BLOCKED | CHAIN_COMMITTED | DONATED"
      - name: donated_at
        type: datetime
        source: system
        description: Logical-clock instant the donor's segment reached TRANSPLANTED; null before donation

  - name: DonorEvaluation
    parent: DonorCandidate
    common_fields: true
    fields:
      - name: donor_candidate_id
        type: string
        source: input
        description: FK -> DonorCandidate.id; donor under evaluation
      - name: reviewer_staff_id
        type: string
        source: system
        description: FK -> StaffMember.id; the EVALUATION_REVIEWER (X-User-ID) that authored this evaluation
      - name: domain
        type: enum
        source: input
        description: Evaluation domain
        constraints: "MEDICAL | PSYCHOSOCIAL"
      - name: status
        type: enum
        source: system
        description: Evaluation lifecycle state
        default: SUBMITTED
        constraints: "SUBMITTED | CLEARED | EXCLUDED | DEFERRED"
      - name: bmi
        type: number
        source: input
        description: Body mass index; required for MEDICAL, null for PSYCHOSOCIAL
      - name: egfr_ml_min
        type: number
        source: input
        description: Estimated GFR in mL/min/1.73m2; required for MEDICAL, null for PSYCHOSOCIAL
      - name: systolic_bp
        type: integer
        source: input
        description: Systolic blood pressure in mmHg; required for MEDICAL, null for PSYCHOSOCIAL
      - name: hba1c
        type: number
        source: input
        description: Hemoglobin A1c percentage; required for MEDICAL, null for PSYCHOSOCIAL
      - name: coercion_flag
        type: boolean
        source: input
        description: Psychosocial finding - suspected coercion or valuable consideration
        default: false
      - name: unmanaged_substance_use
        type: boolean
        source: input
        description: Psychosocial finding - active unmanaged substance use
        default: false
      - name: decisional_capacity_ok
        type: boolean
        source: input
        description: Psychosocial finding - donor retains decisional capacity
        default: true
      - name: financial_hardship_score
        type: integer
        source: input
        description: Psychosocial hardship score 0-10; required for PSYCHOSOCIAL, null for MEDICAL
        constraints: "0 <= value <= 10"
      - name: social_support_score
        type: integer
        source: input
        description: Psychosocial support score 0-10; required for PSYCHOSOCIAL, null for MEDICAL
        constraints: "0 <= value <= 10"
      - name: exclusion_codes
        type: array
        source: computed
        description: Hard exclusion codes raised by this submission (see calculations.donor_exclusion_screen)
      - name: hard_exclusion_count
        type: integer
        source: computed
        description: Length of exclusion_codes
        default: 0
      - name: risk_points
        type: integer
        source: computed
        description: Soft risk points raised by this submission (see calculations.donor_exclusion_screen)
        default: 0
      - name: submission_count
        type: integer
        source: computed
        description: Number of times findings have been submitted on this evaluation row (1 at creation, +1 per resubmission)
        default: 1
      - name: determined_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent determination; null while status == SUBMITTED

  - name: ExchangeChain
    parent: TransplantProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> TransplantProgram.id; owning program
      - name: chain_type
        type: enum
        source: input
        description: PAIRED_LOOP must close on itself; NDD_CHAIN must start at a non-directed donor and must not close
        constraints: "PAIRED_LOOP | NDD_CHAIN"
      - name: status
        type: enum
        source: system
        description: Chain lifecycle state
        default: DRAFT
        constraints: "DRAFT | VALIDATED | SUSPENDED | COMMITTED | EXECUTING | COMPLETED | BROKEN"
      - name: segment_count
        type: integer
        source: computed
        description: Count of ChainSegment rows with status != WITHDRAWN for this chain
        default: 0
      - name: is_closed_loop
        type: boolean
        source: computed
        description: True when the last segment's recipient is paired to the first segment's donor (see calculations.chain_topology)
        default: false
      - name: total_planned_cit_minutes
        type: integer
        source: computed
        description: Sum of planned_cit_minutes over ChainSegment rows with status IN {OFFER_SENT, ACCEPTED, TRANSPLANTED}
        default: 0
      - name: committed_donor_count
        type: integer
        source: computed
        description: Count of distinct donor_candidate_id over this chain's ChainSegment rows with status != WITHDRAWN while chain status IN {COMMITTED, EXECUTING}; 0 otherwise
        default: 0
      - name: validated_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent successful validation; null while never validated
      - name: committed_at
        type: datetime
        source: system
        description: Logical-clock instant of commitment; null before commitment
      - name: break_reason_code
        type: string
        source: system
        description: Reason code recorded when the chain reached BROKEN; null otherwise

  - name: ChainSegment
    parent: ExchangeChain
    common_fields: true
    fields:
      - name: exchange_chain_id
        type: string
        source: input
        description: FK -> ExchangeChain.id; chain this segment belongs to
      - name: position
        type: integer
        source: input
        description: 1-based position within the chain; positions must be contiguous 1..N
        constraints: ">= 1"
      - name: donor_candidate_id
        type: string
        source: input
        description: FK -> DonorCandidate.id; donor giving in this segment
      - name: recipient_candidate_id
        type: string
        source: input
        description: FK -> RecipientCandidate.id; recipient receiving in this segment
      - name: predecessor_segment_id
        type: string
        source: input
        description: FK -> ChainSegment.id; the same chain's segment at position - 1; null when position == 1
      - name: status
        type: enum
        source: system
        description: Segment/offer lifecycle state
        default: PLANNED
        constraints: "PLANNED | OFFER_SENT | ACCEPTED | DECLINED | WITHDRAWN | TRANSPLANTED"
      - name: planned_cross_clamp_at
        type: datetime
        source: system
        description: Planned donor cross-clamp instant recorded with the offer; null while PLANNED
      - name: planned_reperfusion_at
        type: datetime
        source: system
        description: Planned recipient reperfusion instant recorded with the offer; null while PLANNED
      - name: planned_transport_minutes
        type: integer
        source: system
        description: Planned transport minutes recorded with the offer; null while PLANNED
      - name: offer_sent_at
        type: datetime
        source: system
        description: Logical-clock instant the offer was sent; null while PLANNED
      - name: offer_response_deadline_at
        type: datetime
        source: system
        description: Instant after which the offer may no longer be answered; null while PLANNED
      - name: offer_responded_at
        type: datetime
        source: system
        description: Logical-clock instant of the accept/decline response; null before a response
      - name: decline_reason_code
        type: string
        source: system
        description: Reason code recorded on decline; null otherwise
      - name: planned_cit_minutes
        type: integer
        source: computed
        description: Planned cold ischemia minutes (see calculations.cold_ischemia_time variant planned_cit); null while PLANNED
      - name: actual_cross_clamp_at
        type: datetime
        source: system
        description: Actual cross-clamp instant recorded at completion; null before completion
      - name: actual_reperfusion_at
        type: datetime
        source: system
        description: Actual reperfusion instant recorded at completion; null before completion
      - name: actual_cit_minutes
        type: integer
        source: computed
        description: Actual cold ischemia minutes (see calculations.cold_ischemia_time variant actual_cit); null before completion
      - name: cit_breach
        type: boolean
        source: computed
        description: True when actual_cit_minutes > MAX_CIT_MINUTES
        default: false

  - name: OperatingRoom
    parent: TransplantProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> TransplantProgram.id; owning program
      - name: room_code
        type: string
        source: input
        description: Room label, unique within the program
        constraints: unique per program_id
      - name: turnover_buffer_minutes
        type: integer
        source: input
        description: Buffer minutes that must separate two ACTIVE bookings in this room
        default: 45
        constraints: ">= 0"
      - name: reserved_minutes_total
        type: integer
        source: computed
        description: Sum of duration_minutes over ProcedureBooking rows of this room with status IN {ACTIVE, COMPLETED}
        default: 0

  - name: ProcedureBooking
    parent: OperatingRoom
    common_fields: true
    fields:
      - name: operating_room_id
        type: string
        source: input
        description: FK -> OperatingRoom.id; room the case occupies
      - name: chain_segment_id
        type: string
        source: input
        description: FK -> ChainSegment.id; segment this case belongs to
      - name: surgeon_staff_id
        type: string
        source: input
        description: FK -> StaffMember.id; the SURGEON occupied for this interval
      - name: booking_role
        type: enum
        source: input
        description: Which half of the segment this case covers
        constraints: "DONOR_RECOVERY | RECIPIENT_IMPLANT"
      - name: start_at
        type: datetime
        source: input
        description: Interval start (inclusive)
      - name: end_at
        type: datetime
        source: input
        description: Interval end (exclusive for room arithmetic, inclusive for surgeon arithmetic)
      - name: status
        type: enum
        source: system
        description: Booking lifecycle state
        default: ACTIVE
        constraints: "ACTIVE | CANCELLED | COMPLETED"
      - name: duration_minutes
        type: integer
        source: computed
        description: Whole minutes between start_at and end_at
      - name: cancel_reason_code
        type: string
        source: system
        description: Reason code recorded on cancellation; null while ACTIVE or COMPLETED

  - name: DonorFollowUp
    parent: DonorCandidate
    common_fields: true
    fields:
      - name: donor_candidate_id
        type: string
        source: input
        description: FK -> DonorCandidate.id; donor being followed
      - name: interval_code
        type: enum
        source: system
        description: Required post-donation reporting interval
        constraints: "SIX_MONTH | ONE_YEAR | TWO_YEAR"
      - name: due_on
        type: datetime
        source: system
        description: Instant the interval submission becomes due (donated_at + interval offset)
      - name: required_fields_count
        type: integer
        source: computed
        description: Required field count for this interval_code (see calculations.follow_up_completeness constants)
      - name: submitted_field_count
        type: integer
        source: computed
        description: Count of distinct submitted field codes that belong to the interval's required set
        default: 0
      - name: completeness_pct
        type: number
        source: computed
        description: Completeness percentage (see calculations.follow_up_completeness)
        default: 0
      - name: status
        type: enum
        source: system
        description: Follow-up lifecycle state
        default: DUE
        constraints: "DUE | SUBMITTED_COMPLETE | INCOMPLETE | DELINQUENT | WAIVED"
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the most recent submission; null before any submission
      - name: waiver_reason_code
        type: string
        source: system
        description: Reason code recorded when the interval was waived; null unless status == WAIVED

  - name: ProgramOutcomeReview
    parent: TransplantProgram
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: FK -> TransplantProgram.id; program under review
      - name: period_start_on
        type: string
        source: input
        description: Review period start date, YYYY-MM-DD
      - name: period_end_on
        type: string
        source: input
        description: Review period end date, YYYY-MM-DD
      - name: cohort_size
        type: integer
        source: input
        description: Number of transplants in the review cohort
        constraints: ">= 0"
      - name: observed_survivor_count
        type: integer
        source: input
        description: Observed one-year survivors in the cohort
        constraints: ">= 0"
      - name: expected_survival_rate_used
        type: number
        source: computed
        description: Snapshot of program.expected_one_year_survival_rate taken at review creation; later program edits do not change a created review
      - name: expected_survivor_count
        type: number
        source: computed
        description: cohort_size * expected_survival_rate_used, rounded to 2 decimals
      - name: oe_ratio
        type: number
        source: computed
        description: Observed-to-expected survival ratio (see calculations.outcome_oe_ratio)
      - name: flag_level
        type: enum
        source: computed
        description: Outcome flag derived from oe_ratio and cohort_size
        default: NONE
        constraints: "NONE | WATCH | FLAGGED"
      - name: requires_improvement_plan
        type: boolean
        source: computed
        description: True when flag_level == FLAGGED
        default: false
      - name: status
        type: enum
        source: system
        description: Review lifecycle state
        default: DRAFT
        constraints: "DRAFT | FINALIZED"
      - name: finalized_at
        type: datetime
        source: system
        description: Logical-clock instant of finalization; null while DRAFT

  - name: ImprovementPlan
    parent: ProgramOutcomeReview
    common_fields: true
    fields:
      - name: program_outcome_review_id
        type: string
        source: input
        description: FK -> ProgramOutcomeReview.id; the flagged review this plan answers
      - name: title
        type: string
        source: input
        description: Plan title
      - name: milestone_count
        type: integer
        source: input
        description: Number of milestones in the plan
        constraints: ">= 1"
      - name: target_completion_on
        type: string
        source: input
        description: Target completion date, YYYY-MM-DD
      - name: status
        type: enum
        source: system
        description: Plan lifecycle state
        default: SUBMITTED
        constraints: "SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED | CLOSED"
      - name: decision_reason_code
        type: string
        source: system
        description: Reason code recorded with the accept/reject decision; null before a decision
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock instant of the decision; null before a decision
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of closure; null unless status == CLOSED

  - name: DonorCostClaim
    parent: DonorCandidate
    common_fields: true
    fields:
      - name: donor_candidate_id
        type: string
        source: input
        description: FK -> DonorCandidate.id; donor incurring the cost
      - name: claim_type
        type: enum
        source: input
        description: Cost category
        constraints: "MEDICAL | TRAVEL | LOST_WAGES"
      - name: coverage_source
        type: enum
        source: input
        description: Primary coverage source requested by the submitter
        constraints: "RECIPIENT_INSURANCE | NLDAC_GRANT | PROGRAM_FUND"
      - name: submitted_amount_cents
        type: integer
        source: input
        description: Amount the donor claims
        constraints: "> 0"
      - name: lost_wage_days
        type: integer
        source: input
        description: Whole days of lost wages; required when claim_type == LOST_WAGES, null otherwise
      - name: service_from_on
        type: string
        source: input
        description: Service period start date, YYYY-MM-DD
      - name: service_to_on
        type: string
        source: input
        description: Service period end date, YYYY-MM-DD
      - name: estimated_reimbursement_cents
        type: integer
        source: computed
        description: Cap-only estimate (see calculations.donor_cost_reimbursement variant estimated)
      - name: adjudicated_reimbursement_cents
        type: integer
        source: computed
        description: Waterfall-funded amount (see calculations.donor_cost_reimbursement variant adjudicated); null before adjudication
      - name: insurance_part_cents
        type: integer
        source: computed
        description: Portion funded from RECIPIENT_INSURANCE
        default: 0
      - name: grant_part_cents
        type: integer
        source: computed
        description: Portion funded from the NLDAC_GRANT donor pool
        default: 0
      - name: fund_part_cents
        type: integer
        source: computed
        description: Portion funded from the program donor fund; the only portion that commits program fund
        default: 0
      - name: unfunded_cents
        type: integer
        source: computed
        description: Capped need minus adjudicated_reimbursement_cents; null before adjudication
      - name: status
        type: enum
        source: system
        description: Claim lifecycle state
        default: SUBMITTED
        constraints: "SUBMITTED | ADJUDICATED | DENIED | REVERSED"
      - name: adjudicated_at
        type: datetime
        source: system
        description: Logical-clock instant of adjudication; null before adjudication
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the FinanceAdmin that adjudicated; opaque operator id, NOT an FK
      - name: reversal_reason_code
        type: string
        source: system
        description: Reason code recorded on reversal; null unless status == REVERSED

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: TransplantProgram
    dimension: compliance_posture
    initial_state: OPEN
    terminal_states: []
    note: |
      Derived posture (see calculations.compliance_posture). Every transition is a
      system re-derivation fired by one of: outcome review finalization, improvement
      plan decision/closure, compliance sweep, follow-up submission or waiver,
      transplant completion. Posture gates child operations: FROZEN blocks
      POST /donor-candidates and POST /exchange-chains/{id}/commitment;
      RESTRICTED blocks commitment of chains whose segment_count > 2.
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system re-derivation of calculations.compliance_posture"
        actor: system
        preconditions:
          - "follow_up_compliance_pct < program.follow_up_compliance_threshold_pct OR cit_breach_count >= 2 OR a FINALIZED ProgramOutcomeReview with flag_level == WATCH exists"
          - "no FINALIZED ProgramOutcomeReview with flag_level == FLAGGED lacking an ACCEPTED-or-CLOSED ImprovementPlan"
        side_effects:
          - "TransplantProgram.compliance_posture = RESTRICTED"
          - "increments TransplantProgram.version by 1"
      - from: OPEN
        to: FROZEN
        trigger: "system re-derivation of calculations.compliance_posture"
        actor: system
        preconditions:
          - "a FINALIZED ProgramOutcomeReview with flag_level == FLAGGED exists that has no ImprovementPlan with status IN {ACCEPTED, CLOSED}"
        side_effects:
          - "TransplantProgram.compliance_posture = FROZEN"
          - "cascade: every ExchangeChain of this program with status IN {DRAFT, VALIDATED} moves to SUSPENDED (see ExchangeChain VALIDATED_to_SUSPENDED)"
          - "increments TransplantProgram.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system re-derivation of calculations.compliance_posture"
        actor: system
        preconditions:
          - "a FINALIZED ProgramOutcomeReview with flag_level == FLAGGED exists that has no ImprovementPlan with status IN {ACCEPTED, CLOSED}"
        side_effects:
          - "TransplantProgram.compliance_posture = FROZEN"
          - "cascade: every ExchangeChain of this program with status IN {DRAFT, VALIDATED} moves to SUSPENDED"
          - "increments TransplantProgram.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system re-derivation of calculations.compliance_posture"
        actor: system
        preconditions:
          - "every FINALIZED ProgramOutcomeReview with flag_level == FLAGGED has an ImprovementPlan with status IN {ACCEPTED, CLOSED}"
          - "follow_up_compliance_pct < program.follow_up_compliance_threshold_pct OR cit_breach_count >= 2 OR a FINALIZED ProgramOutcomeReview with flag_level == WATCH exists"
        side_effects:
          - "TransplantProgram.compliance_posture = RESTRICTED"
          - "cascade: every ExchangeChain of this program with status == SUSPENDED reverts to VALIDATED (see ExchangeChain SUSPENDED_to_VALIDATED)"
          - "increments TransplantProgram.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "system re-derivation of calculations.compliance_posture"
        actor: system
        preconditions:
          - "every FINALIZED ProgramOutcomeReview with flag_level == FLAGGED has an ImprovementPlan with status IN {ACCEPTED, CLOSED}"
          - "no FINALIZED ProgramOutcomeReview with flag_level == WATCH exists"
          - "follow_up_compliance_pct >= program.follow_up_compliance_threshold_pct"
          - "cit_breach_count < 2"
        side_effects:
          - "TransplantProgram.compliance_posture = OPEN"
          - "cascade: every ExchangeChain of this program with status == SUSPENDED reverts to VALIDATED"
          - "increments TransplantProgram.version by 1"
      - from: RESTRICTED
        to: OPEN
        trigger: "system re-derivation of calculations.compliance_posture"
        actor: system
        preconditions:
          - "follow_up_compliance_pct >= program.follow_up_compliance_threshold_pct"
          - "cit_breach_count < 2"
          - "no FINALIZED ProgramOutcomeReview with flag_level IN {WATCH, FLAGGED} lacking an ACCEPTED-or-CLOSED ImprovementPlan; WATCH reviews clear only when a CLOSED ImprovementPlan references them"
        side_effects:
          - "TransplantProgram.compliance_posture = OPEN"
          - "increments TransplantProgram.version by 1"

  - entity: RecipientCandidate
    dimension: listing_status
    initial_state: WORKUP
    terminal_states: [DECLINED, TRANSPLANTED, REMOVED]
    transitions:
      - from: WORKUP
        to: APPROVED_NOT_LISTED
        trigger: "POST /recipient-candidates/{id}/status-updates with to_status=APPROVED_NOT_LISTED"
        actor: TransplantCoordinator
        preconditions:
          - "effective_at >= the latest WaitlistStatusEvent.effective_at for this candidate (none exists at WORKUP) AND effective_at <= current logical clock"
        side_effects:
          - "RecipientCandidate.candidacy_approved_by_staff_id = X-User-ID"
          - "appends WaitlistStatusEvent{from_status: WORKUP, to_status: APPROVED_NOT_LISTED, actor_user_id: X-User-ID}"
          - "increments RecipientCandidate.version by 1"
      - from: WORKUP
        to: DECLINED
        trigger: "POST /recipient-candidates/{id}/status-updates with to_status=DECLINED"
        actor: TransplantCoordinator
        preconditions:
          - "effective_at <= current logical clock"
        side_effects:
          - "appends WaitlistStatusEvent{from_status: WORKUP, to_status: DECLINED}"
          - "increments RecipientCandidate.version by 1"
      - from: APPROVED_NOT_LISTED
        to: ACTIVE
        trigger: "POST /recipient-candidates/{id}/status-updates with to_status=ACTIVE (waitlist registration)"
        actor: TransplantCoordinator
        preconditions:
          - "effective_at >= latest WaitlistStatusEvent.effective_at AND effective_at <= current logical clock"
        side_effects:
          - "RecipientCandidate.registered_at = effective_at when registered_at is null"
          - "appends WaitlistStatusEvent{from_status: APPROVED_NOT_LISTED, to_status: ACTIVE}"
          - "recomputes RecipientCandidate.active_days_total (calculations.waitlist_active_days)"
          - "recomputes RecipientCandidate.waitlist_priority_score (calculations.waitlist_priority_score)"
          - "increments RecipientCandidate.version by 1"
      - from: ACTIVE
        to: INACTIVE_HOLD
        trigger: "POST /recipient-candidates/{id}/status-updates with to_status=INACTIVE_HOLD"
        actor: TransplantCoordinator
        preconditions:
          - "effective_at >= latest WaitlistStatusEvent.effective_at AND effective_at <= current logical clock"
        side_effects:
          - "appends WaitlistStatusEvent{from_status: ACTIVE, to_status: INACTIVE_HOLD}"
          - "recomputes RecipientCandidate.active_days_total and waitlist_priority_score"
          - "cascade: every ChainSegment of this recipient with status == OFFER_SENT reverts to PLANNED and its planned_cit_minutes / planned_cross_clamp_at / planned_reperfusion_at / planned_transport_minutes / offer_sent_at / offer_response_deadline_at are cleared to null"
          - "increments RecipientCandidate.version by 1"
        note: "Cyclic dimension: a candidate may re-enter ACTIVE any number of times."
      - from: INACTIVE_HOLD
        to: ACTIVE
        trigger: "POST /recipient-candidates/{id}/status-updates with to_status=ACTIVE"
        actor: TransplantCoordinator
        preconditions:
          - "effective_at >= latest WaitlistStatusEvent.effective_at AND effective_at <= current logical clock"
        side_effects:
          - "appends WaitlistStatusEvent{from_status: INACTIVE_HOLD, to_status: ACTIVE}"
          - "recomputes RecipientCandidate.active_days_total and waitlist_priority_score"
          - "increments RecipientCandidate.version by 1"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /recipient-candidates/{id}/status-updates with to_status=REMOVED"
        actor: TransplantCoordinator
        preconditions:
          - "effective_at >= latest WaitlistStatusEvent.effective_at AND effective_at <= current logical clock"
        side_effects:
          - "appends WaitlistStatusEvent{from_status: ACTIVE, to_status: REMOVED}"
          - "recomputes RecipientCandidate.active_days_total and waitlist_priority_score"
          - "cascade hop 1: every ChainSegment of this recipient with status IN {PLANNED, OFFER_SENT, ACCEPTED} moves to WITHDRAWN"
          - "cascade hop 2: because those segments became WITHDRAWN, each parent ExchangeChain with status IN {DRAFT, VALIDATED, SUSPENDED, COMMITTED, EXECUTING} moves to BROKEN with break_reason_code RECIPIENT_REMOVED"
          - "increments RecipientCandidate.version by 1"
      - from: INACTIVE_HOLD
        to: REMOVED
        trigger: "POST /recipient-candidates/{id}/status-updates with to_status=REMOVED"
        actor: TransplantCoordinator
        preconditions:
          - "effective_at >= latest WaitlistStatusEvent.effective_at AND effective_at <= current logical clock"
        side_effects:
          - "appends WaitlistStatusEvent{from_status: INACTIVE_HOLD, to_status: REMOVED}"
          - "cascade: same two hops as ACTIVE -> REMOVED"
          - "increments RecipientCandidate.version by 1"
      - from: ACTIVE
        to: TRANSPLANTED
        trigger: "system, on POST /chain-segments/{id}/transplant-completion"
        actor: system
        preconditions:
          - "the completing ChainSegment.recipient_candidate_id == this candidate"
        side_effects:
          - "appends WaitlistStatusEvent{from_status: ACTIVE, to_status: TRANSPLANTED, reason_code: TRANSPLANT_COMPLETED, effective_at: current logical clock, actor_user_id: X-User-ID of the completing caller}"
          - "recomputes RecipientCandidate.active_days_total and waitlist_priority_score"
          - "increments RecipientCandidate.version by 1"

  - entity: DonorCandidate
    dimension: advocacy_status
    initial_state: UNASSIGNED
    terminal_states: [OBJECTED]
    note: "Independent dimension: advances regardless of medical_status / psychosocial_status. Cyclic through ATTESTED -> DISCLOSED (re-consent)."
    transitions:
      - from: UNASSIGNED
        to: ASSIGNED
        trigger: "POST /donor-candidates/{id}/advocate-assignment"
        actor: ProgramAdmin
        preconditions:
          - "advocate StaffMember exists, is_active == true, staff_role == LIVING_DONOR_ADVOCATE, and StaffMember.program_id == donor.program_id"
          - "when donor.intended_recipient_id is not null, advocate_staff_id is not already the advocate_staff_id of a different DonorCandidate whose intended_recipient_id equals donor.intended_recipient_id"
          - "donor.overall_status NOT IN {EXCLUDED, ADVOCATE_BLOCKED, DONATED}"
        side_effects:
          - "DonorCandidate.advocate_staff_id = advocate_staff_id"
          - "DonorCandidate.advocacy_status = ASSIGNED"
          - "increments DonorCandidate.version by 1"
      - from: ASSIGNED
        to: DISCLOSED
        trigger: "POST /donor-candidates/{id}/consent-disclosure"
        actor: DonorAdvocate
        preconditions:
          - "X-User-ID == donor.advocate_staff_id"
          - "donor.overall_status NOT IN {EXCLUDED, ADVOCATE_BLOCKED, CHAIN_COMMITTED, DONATED}"
        side_effects:
          - "DonorCandidate.disclosure_sequence += 1"
          - "DonorCandidate.disclosure_at = current logical clock"
          - "DonorCandidate.cooling_off_ends_at = calculations.cooling_off_window"
          - "increments DonorCandidate.version by 1"
      - from: ATTESTED
        to: DISCLOSED
        trigger: "POST /donor-candidates/{id}/consent-disclosure (re-consent after a material change)"
        actor: DonorAdvocate
        preconditions:
          - "X-User-ID == donor.advocate_staff_id"
          - "donor.overall_status IN {APPROVED, CONDITIONAL_APPROVED, EVAL_IN_PROGRESS} - a CHAIN_COMMITTED donor may not be re-disclosed"
        side_effects:
          - "DonorCandidate.disclosure_sequence += 1 (>= 2, so the halved cooling-off branch applies)"
          - "DonorCandidate.disclosure_at = current logical clock"
          - "DonorCandidate.cooling_off_ends_at = calculations.cooling_off_window"
          - "DonorCandidate.attestation_at = null"
          - "DonorCandidate.final_risk_index = null"
          - "recomputes DonorCandidate.overall_status -> EVAL_IN_PROGRESS (calculations.donor_overall_status)"
          - "increments DonorCandidate.version by 1"
        note: "Cycle ATTESTED -> DISCLOSED -> ATTESTED; each pass re-derives cooling_off_ends_at and demotes the compound overall_status."
      - from: DISCLOSED
        to: ATTESTED
        trigger: "POST /donor-candidates/{id}/advocacy-determination with outcome=ATTESTED"
        actor: DonorAdvocate
        preconditions:
          - "X-User-ID == donor.advocate_staff_id"
          - "current logical clock >= donor.cooling_off_ends_at (inclusive boundary)"
          - "donor.medical_status == CLEARED AND donor.psychosocial_status == CLEARED"
        side_effects:
          - "DonorCandidate.attestation_at = current logical clock"
          - "DonorCandidate.final_risk_index = calculations.donor_risk_index variant final_index"
          - "recomputes DonorCandidate.overall_status -> APPROVED when final_risk_index < RISK_INDEX_CEILING, else CONDITIONAL_APPROVED"
          - "increments DonorCandidate.version by 1"
      - from: DISCLOSED
        to: OBJECTED
        trigger: "POST /donor-candidates/{id}/advocacy-determination with outcome=OBJECTED"
        actor: DonorAdvocate
        preconditions:
          - "X-User-ID == donor.advocate_staff_id"
          - "objection_reason_code is present"
        side_effects:
          - "DonorCandidate.objection_reason_code = objection_reason_code"
          - "cascade hop 1: DonorCandidate.overall_status = ADVOCATE_BLOCKED"
          - "cascade hop 2: because the donor became ADVOCATE_BLOCKED, every ChainSegment with donor_candidate_id == this donor and status IN {PLANNED, OFFER_SENT, ACCEPTED} moves to WITHDRAWN"
          - "cascade hop 3: because those segments became WITHDRAWN, each parent ExchangeChain with status IN {DRAFT, VALIDATED, SUSPENDED, COMMITTED, EXECUTING} moves to BROKEN with break_reason_code ADVOCATE_OBJECTION, and every remaining non-WITHDRAWN segment of that chain whose donor is CHAIN_COMMITTED releases the donor back to APPROVED or CONDITIONAL_APPROVED (per stored final_risk_index)"
          - "cascade hop 4: because each chain became BROKEN, every ProcedureBooking whose chain_segment_id belongs to that chain and whose status == ACTIVE moves to CANCELLED with cancel_reason_code CHAIN_BROKEN, and each affected OperatingRoom.reserved_minutes_total is decremented by that booking's duration_minutes"
          - "increments DonorCandidate.version by 1"
      - from: ATTESTED
        to: OBJECTED
        trigger: "POST /donor-candidates/{id}/advocacy-determination with outcome=OBJECTED"
        actor: DonorAdvocate
        preconditions:
          - "X-User-ID == donor.advocate_staff_id"
          - "objection_reason_code is present"
        side_effects:
          - "same four cascade hops as DISCLOSED -> OBJECTED"
          - "DonorCandidate.final_risk_index is retained for audit"
          - "increments DonorCandidate.version by 1"

  - entity: DonorCandidate
    dimension: medical_status / psychosocial_status
    initial_state: PENDING
    terminal_states: [EXCLUDED]
    note: |
      Two independent clinical dimensions on the same row, each mirroring the latest
      determination of the DonorEvaluation with the matching domain. medical_status and
      psychosocial_status advance independently; neither blocks the other, and the
      advocacy dimension advances independently of both.
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "system, on POST /donor-evaluations/{id}/determination with outcome=CLEARED"
        actor: system
        preconditions:
          - "the evaluation's hard_exclusion_count == 0"
        side_effects:
          - "DonorCandidate.<domain>_status = CLEARED"
          - "DonorCandidate.<domain>_risk_points = evaluation.risk_points"
          - "recomputes DonorCandidate.screening_risk_index (calculations.donor_risk_index variant screening_index)"
          - "recomputes DonorCandidate.overall_status"
          - "increments DonorCandidate.version by 1"
      - from: PENDING
        to: DEFERRED
        trigger: "system, on POST /donor-evaluations/{id}/determination with outcome=DEFERRED"
        actor: system
        preconditions: []
        side_effects:
          - "DonorCandidate.<domain>_status = DEFERRED"
          - "DonorCandidate.deferral_count += 1"
          - "recomputes DonorCandidate.screening_risk_index"
          - "increments DonorCandidate.version by 1"
      - from: DEFERRED
        to: CLEARED
        trigger: "system, on POST /donor-evaluations/{id}/determination with outcome=CLEARED after a resubmission"
        actor: system
        preconditions:
          - "the evaluation's hard_exclusion_count == 0"
        side_effects:
          - "DonorCandidate.<domain>_status = CLEARED"
          - "DonorCandidate.<domain>_risk_points = evaluation.risk_points"
          - "recomputes screening_risk_index and overall_status"
          - "increments DonorCandidate.version by 1"
        note: "Deferral loop: deferral_count keeps its cumulative value, which surcharges the final_index variant."
      - from: PENDING
        to: EXCLUDED
        trigger: "system, on POST /donor-evaluations/{id}/determination with outcome=EXCLUDED"
        actor: system
        preconditions: []
        side_effects:
          - "DonorCandidate.<domain>_status = EXCLUDED"
          - "cascade hop 1: DonorCandidate.overall_status = EXCLUDED"
          - "cascade hop 2: every ChainSegment of this donor with status IN {PLANNED, OFFER_SENT, ACCEPTED} moves to WITHDRAWN"
          - "cascade hop 3: each affected parent ExchangeChain with status IN {DRAFT, VALIDATED, SUSPENDED, COMMITTED, EXECUTING} moves to BROKEN with break_reason_code DONOR_EXCLUDED"
          - "increments DonorCandidate.version by 1"
      - from: DEFERRED
        to: EXCLUDED
        trigger: "system, on POST /donor-evaluations/{id}/determination with outcome=EXCLUDED"
        actor: system
        preconditions: []
        side_effects:
          - "same cascade as PENDING -> EXCLUDED"
          - "increments DonorCandidate.version by 1"
      - from: CLEARED
        to: DEFERRED
        trigger: "system, on POST /donor-evaluations/{id}/resubmission for an evaluation whose status was DEFERRED, or on a later determination that defers a previously CLEARED domain"
        actor: system
        preconditions:
          - "donor.overall_status != CHAIN_COMMITTED"
        side_effects:
          - "DonorCandidate.<domain>_status = DEFERRED"
          - "DonorCandidate.deferral_count += 1"
          - "recomputes overall_status -> EVAL_IN_PROGRESS"
          - "increments DonorCandidate.version by 1"

  - entity: DonorCandidate
    dimension: overall_status
    initial_state: REFERRED
    terminal_states: [EXCLUDED, ADVOCATE_BLOCKED, DONATED]
    note: "Compound dimension: never set directly by a caller; always re-derived by calculations.donor_overall_status after any change to the three dimensions or to chain participation."
    transitions:
      - from: REFERRED
        to: EVAL_IN_PROGRESS
        trigger: "system, on POST /donor-evaluations (first evaluation row for this donor)"
        actor: system
        preconditions: []
        side_effects:
          - "DonorCandidate.overall_status = EVAL_IN_PROGRESS"
          - "increments DonorCandidate.version by 1"
      - from: EVAL_IN_PROGRESS
        to: APPROVED
        trigger: "system, on the advocacy ATTESTED transition"
        actor: system
        preconditions:
          - "advocacy_status == ATTESTED AND medical_status == CLEARED AND psychosocial_status == CLEARED"
          - "final_risk_index < RISK_INDEX_CEILING"
        side_effects:
          - "DonorCandidate.overall_status = APPROVED"
      - from: EVAL_IN_PROGRESS
        to: CONDITIONAL_APPROVED
        trigger: "system, on the advocacy ATTESTED transition"
        actor: system
        preconditions:
          - "advocacy_status == ATTESTED AND medical_status == CLEARED AND psychosocial_status == CLEARED"
          - "final_risk_index >= RISK_INDEX_CEILING"
        side_effects:
          - "DonorCandidate.overall_status = CONDITIONAL_APPROVED"
        note: "CONDITIONAL_APPROVED donors are rejected by chain validation; the way out is a DonorEvaluation resubmission that lowers risk_points, followed by re-determination and re-attestation."
      - from: APPROVED
        to: CHAIN_COMMITTED
        trigger: "system, on POST /exchange-chains/{id}/commitment"
        actor: system
        preconditions:
          - "the donor holds a non-WITHDRAWN ChainSegment in the committing chain"
        side_effects:
          - "DonorCandidate.overall_status = CHAIN_COMMITTED"
          - "increments DonorCandidate.version by 1"
      - from: CHAIN_COMMITTED
        to: APPROVED
        trigger: "system, on ExchangeChain -> BROKEN (compensating release)"
        actor: system
        preconditions:
          - "donor.final_risk_index < RISK_INDEX_CEILING"
        side_effects:
          - "DonorCandidate.overall_status = APPROVED"
          - "increments DonorCandidate.version by 1"
        note: "Compensating transition that keeps calculations.chain_commitment_conservation balanced."
      - from: CHAIN_COMMITTED
        to: CONDITIONAL_APPROVED
        trigger: "system, on ExchangeChain -> BROKEN (compensating release)"
        actor: system
        preconditions:
          - "donor.final_risk_index >= RISK_INDEX_CEILING"
        side_effects:
          - "DonorCandidate.overall_status = CONDITIONAL_APPROVED"
          - "increments DonorCandidate.version by 1"
      - from: CHAIN_COMMITTED
        to: DONATED
        trigger: "system, on POST /chain-segments/{id}/transplant-completion"
        actor: system
        preconditions:
          - "the completing segment's donor_candidate_id == this donor"
        side_effects:
          - "DonorCandidate.overall_status = DONATED"
          - "DonorCandidate.donated_at = current logical clock"
          - "cascade hop 2: because the donor became DONATED, three DonorFollowUp rows are created with status DUE and due_on = donated_at + 180 / 365 / 730 days for interval_code SIX_MONTH / ONE_YEAR / TWO_YEAR"
          - "cascade hop 3: because those follow-up rows exist, TransplantProgram.follow_up_compliance_pct is recomputed and compliance_posture re-derived"
          - "increments DonorCandidate.version by 1"

  - entity: DonorEvaluation
    initial_state: SUBMITTED
    terminal_states: [EXCLUDED]
    note: "Cyclic: SUBMITTED -> DEFERRED -> SUBMITTED, once per resubmission."
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /donor-evaluations/{id}/determination with outcome=CLEARED"
        actor: EvaluationReviewer
        preconditions:
          - "X-User-ID == evaluation.reviewer_staff_id"
          - "evaluation.hard_exclusion_count == 0"
        side_effects:
          - "DonorEvaluation.status = CLEARED, determined_at = current logical clock"
          - "mirrors into DonorCandidate.<domain>_status = CLEARED and <domain>_risk_points"
          - "recomputes DonorCandidate.screening_risk_index and overall_status"
          - "increments DonorEvaluation.version by 1"
      - from: SUBMITTED
        to: EXCLUDED
        trigger: "POST /donor-evaluations/{id}/determination with outcome=EXCLUDED"
        actor: EvaluationReviewer
        preconditions:
          - "X-User-ID == evaluation.reviewer_staff_id"
        side_effects:
          - "DonorEvaluation.status = EXCLUDED, determined_at = current logical clock"
          - "mirrors into DonorCandidate.<domain>_status = EXCLUDED and fires the donor EXCLUDED cascade"
          - "increments DonorEvaluation.version by 1"
      - from: SUBMITTED
        to: DEFERRED
        trigger: "POST /donor-evaluations/{id}/determination with outcome=DEFERRED"
        actor: EvaluationReviewer
        preconditions:
          - "X-User-ID == evaluation.reviewer_staff_id"
        side_effects:
          - "DonorEvaluation.status = DEFERRED, determined_at = current logical clock"
          - "mirrors into DonorCandidate.<domain>_status = DEFERRED and increments DonorCandidate.deferral_count"
          - "increments DonorEvaluation.version by 1"
      - from: DEFERRED
        to: SUBMITTED
        trigger: "POST /donor-evaluations/{id}/resubmission"
        actor: EvaluationReviewer
        preconditions:
          - "X-User-ID == evaluation.reviewer_staff_id"
          - "donor.overall_status NOT IN {EXCLUDED, ADVOCATE_BLOCKED, CHAIN_COMMITTED, DONATED}"
        side_effects:
          - "DonorEvaluation findings replaced by the resubmitted values; submission_count += 1; determined_at = null"
          - "recomputes DonorEvaluation.exclusion_codes, hard_exclusion_count, risk_points (calculations.donor_exclusion_screen)"
          - "recomputes DonorCandidate.<domain>_risk_points and screening_risk_index"
          - "increments DonorEvaluation.version by 1"

  - entity: ExchangeChain
    initial_state: DRAFT
    terminal_states: [COMPLETED, BROKEN]
    note: "Cyclic: VALIDATED -> SUSPENDED -> VALIDATED, driven by the program posture gate."
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /exchange-chains/{id}/validation"
        actor: TransplantCoordinator
        preconditions:
          - "segment_count >= 2"
          - "positions of non-WITHDRAWN segments are contiguous 1..segment_count and each segment's predecessor_segment_id is the same chain's segment at position - 1 (null at position 1)"
          - "no donor_candidate_id and no recipient_candidate_id appears on more than one non-WITHDRAWN segment"
          - "every segment donor has overall_status == APPROVED (CONDITIONAL_APPROVED is rejected)"
          - "every segment recipient has listing_status == ACTIVE"
          - "every segment satisfies the ABO compatibility table in calculations.chain_topology"
          - "chain_type == PAIRED_LOOP requires is_closed_loop == true; chain_type == NDD_CHAIN requires is_closed_loop == false AND the position-1 segment's donor has intended_recipient_id == null"
        side_effects:
          - "ExchangeChain.status = VALIDATED, validated_at = current logical clock"
          - "recomputes segment_count and is_closed_loop (calculations.chain_topology)"
          - "increments ExchangeChain.version by 1"
      - from: VALIDATED
        to: SUSPENDED
        trigger: "system, on TransplantProgram.compliance_posture entering FROZEN"
        actor: system
        preconditions:
          - "chain.program_id == the frozen program"
        side_effects:
          - "ExchangeChain.status = SUSPENDED"
          - "cascade: every ChainSegment of this chain with status == OFFER_SENT reverts to PLANNED with offer fields cleared to null"
          - "cascade: every ProcedureBooking of ANY segment of this chain with status == ACTIVE moves to CANCELLED with cancel_reason_code POSTURE_FROZEN, decrementing OperatingRoom.reserved_minutes_total"
          - "increments ExchangeChain.version by 1"
      - from: SUSPENDED
        to: VALIDATED
        trigger: "system, on TransplantProgram.compliance_posture leaving FROZEN"
        actor: system
        preconditions:
          - "chain.program_id == the recovering program"
        side_effects:
          - "ExchangeChain.status = VALIDATED"
          - "increments ExchangeChain.version by 1"
        note: "Closes the VALIDATED -> SUSPENDED -> VALIDATED cycle without re-running validation."
      - from: VALIDATED
        to: COMMITTED
        trigger: "POST /exchange-chains/{id}/commitment"
        actor: TransplantCoordinator
        preconditions:
          - "program.compliance_posture != FROZEN"
          - "program.compliance_posture != RESTRICTED OR segment_count <= 2"
          - "every non-WITHDRAWN segment's donor has overall_status == APPROVED"
          - "every non-WITHDRAWN segment's recipient has listing_status == ACTIVE"
          - "total_planned_cit_minutes <= CHAIN_CIT_BUDGET_MINUTES when any segment has already been offered"
        side_effects:
          - "ExchangeChain.status = COMMITTED, committed_at = current logical clock"
          - "every non-WITHDRAWN segment's donor moves APPROVED -> CHAIN_COMMITTED"
          - "ExchangeChain.committed_donor_count = count of distinct donors on non-WITHDRAWN segments"
          - "increments ExchangeChain.version by 1"
      - from: COMMITTED
        to: EXECUTING
        trigger: "system, on the first POST /chain-segments/{id}/transplant-completion of this chain"
        actor: system
        preconditions:
          - "at least one segment reached TRANSPLANTED and at least one non-WITHDRAWN segment has status != TRANSPLANTED"
        side_effects:
          - "ExchangeChain.status = EXECUTING"
          - "increments ExchangeChain.version by 1"
      - from: EXECUTING
        to: COMPLETED
        trigger: "system, when every non-WITHDRAWN ChainSegment of the chain reaches TRANSPLANTED"
        actor: system
        preconditions:
          - "count of non-WITHDRAWN segments with status == TRANSPLANTED == segment_count"
        side_effects:
          - "ExchangeChain.status = COMPLETED"
          - "ExchangeChain.committed_donor_count = 0"
          - "increments ExchangeChain.version by 1"
        note: "Bubble-up: parent state derived from the aggregate state of its segments."
      - from: COMMITTED
        to: BROKEN
        trigger: "POST /exchange-chains/{id}/break, or system cascade from a participant loss"
        actor: TransplantCoordinator | system
        preconditions:
          - "break_reason_code is present when called through the endpoint"
        side_effects:
          - "ExchangeChain.status = BROKEN, break_reason_code recorded"
          - "every non-WITHDRAWN segment with status IN {PLANNED, OFFER_SENT, ACCEPTED} moves to WITHDRAWN"
          - "every donor with overall_status == CHAIN_COMMITTED on this chain is released to APPROVED or CONDITIONAL_APPROVED per its stored final_risk_index"
          - "ExchangeChain.committed_donor_count = 0"
          - "every ProcedureBooking of this chain's segments with status == ACTIVE moves to CANCELLED with cancel_reason_code CHAIN_BROKEN, decrementing OperatingRoom.reserved_minutes_total"
          - "increments ExchangeChain.version by 1"
      - from: EXECUTING
        to: BROKEN
        trigger: "POST /exchange-chains/{id}/break, or system cascade from a participant loss"
        actor: TransplantCoordinator | system
        preconditions:
          - "break_reason_code is present when called through the endpoint"
        side_effects:
          - "same compensating side effects as COMMITTED -> BROKEN; segments already TRANSPLANTED are untouched and their donors stay DONATED"
          - "increments ExchangeChain.version by 1"
      - from: VALIDATED
        to: BROKEN
        trigger: "system cascade from a participant loss (donor excluded / advocate objection / recipient removed)"
        actor: system
        preconditions: []
        side_effects:
          - "ExchangeChain.status = BROKEN with the cascading break_reason_code"
          - "increments ExchangeChain.version by 1"
      - from: DRAFT
        to: BROKEN
        trigger: "system cascade from a participant loss"
        actor: system
        preconditions: []
        side_effects:
          - "ExchangeChain.status = BROKEN with the cascading break_reason_code"
          - "increments ExchangeChain.version by 1"
      - from: SUSPENDED
        to: BROKEN
        trigger: "system cascade from a participant loss"
        actor: system
        preconditions: []
        side_effects:
          - "ExchangeChain.status = BROKEN with the cascading break_reason_code"
          - "increments ExchangeChain.version by 1"

  - entity: ChainSegment
    initial_state: PLANNED
    terminal_states: [WITHDRAWN, TRANSPLANTED]
    note: "Branching at offer-response with divergent side-effect sets, and cyclic through DECLINED -> OFFER_SENT."
    transitions:
      - from: PLANNED
        to: OFFER_SENT
        trigger: "POST /chain-segments/{id}/offer"
        actor: TransplantCoordinator
        preconditions:
          - "parent ExchangeChain.status IN {COMMITTED, EXECUTING}"
          - "segment recipient listing_status == ACTIVE"
          - "segment donor overall_status == CHAIN_COMMITTED"
          - "planned_reperfusion_at > planned_cross_clamp_at"
          - "planned_cit_minutes <= MAX_CIT_MINUTES"
          - "chain total_planned_cit_minutes computed over the OTHER offered segments plus this segment's planned_cit_minutes <= CHAIN_CIT_BUDGET_MINUTES"
          - "when predecessor_segment_id is not null, planned_cross_clamp_at >= predecessor segment's planned_reperfusion_at"
          - "an ACTIVE ProcedureBooking with booking_role == DONOR_RECOVERY exists for this segment whose [start_at, end_at) window contains planned_cross_clamp_at"
        side_effects:
          - "ChainSegment.status = OFFER_SENT; offer_sent_at = current logical clock; offer_response_deadline_at = offer_sent_at + OFFER_RESPONSE_WINDOW_HOURS"
          - "ChainSegment.planned_cit_minutes = calculations.cold_ischemia_time variant planned_cit"
          - "recomputes ExchangeChain.total_planned_cit_minutes"
          - "increments ChainSegment.version by 1"
      - from: DECLINED
        to: OFFER_SENT
        trigger: "POST /chain-segments/{id}/offer (re-offer with a new plan)"
        actor: TransplantCoordinator
        preconditions:
          - "same preconditions as PLANNED -> OFFER_SENT"
          - "parent ExchangeChain.status IN {COMMITTED, EXECUTING} (a chain broken by the decline can no longer be re-offered)"
        side_effects:
          - "same side effects as PLANNED -> OFFER_SENT; decline_reason_code and offer_responded_at are cleared to null"
          - "increments ChainSegment.version by 1"
        note: "Closes the OFFER_SENT -> DECLINED -> OFFER_SENT cycle."
      - from: OFFER_SENT
        to: ACCEPTED
        trigger: "POST /chain-segments/{id}/offer-response with response=ACCEPT"
        actor: TransplantCoordinator
        preconditions:
          - "current logical clock <= offer_response_deadline_at"
        side_effects:
          - "ChainSegment.status = ACCEPTED; offer_responded_at = current logical clock"
          - "increments ChainSegment.version by 1"
      - from: OFFER_SENT
        to: DECLINED
        trigger: "POST /chain-segments/{id}/offer-response with response=DECLINE"
        actor: TransplantCoordinator
        preconditions:
          - "current logical clock <= offer_response_deadline_at"
          - "decline_reason_code is present"
        side_effects:
          - "ChainSegment.status = DECLINED; offer_responded_at = current logical clock; decline_reason_code recorded"
          - "increments RecipientCandidate.offer_decline_count by 1 for this segment's recipient"
          - "recomputes ExchangeChain.total_planned_cit_minutes (this segment leaves the sum)"
          - "branch-specific: when decline_reason_code == DONOR_ORGAN_QUALITY the parent ExchangeChain moves to BROKEN with break_reason_code OFFER_DECLINED_ORGAN_QUALITY and its full compensating cascade runs; for any other decline_reason_code the chain keeps its status and only this segment is affected"
          - "increments ChainSegment.version by 1"
        note: "Branch point: the two responses carry disjoint side-effect sets, and the DECLINE branch itself forks on decline_reason_code."
      - from: ACCEPTED
        to: TRANSPLANTED
        trigger: "POST /chain-segments/{id}/transplant-completion"
        actor: TransplantCoordinator
        preconditions:
          - "actual_reperfusion_at > actual_cross_clamp_at"
          - "parent ExchangeChain.status IN {COMMITTED, EXECUTING}"
          - "an ACTIVE ProcedureBooking with booking_role == RECIPIENT_IMPLANT exists for this segment"
        side_effects:
          - "ChainSegment.status = TRANSPLANTED; actual timestamps recorded; actual_cit_minutes = calculations.cold_ischemia_time variant actual_cit; cit_breach = actual_cit_minutes > MAX_CIT_MINUTES"
          - "every ProcedureBooking of this segment with status == ACTIVE moves to COMPLETED"
          - "cascade hop 1: donor moves CHAIN_COMMITTED -> DONATED (donated_at set)"
          - "cascade hop 2: three DonorFollowUp rows are created DUE for that donor"
          - "cascade hop 3: TransplantProgram.follow_up_compliance_pct recomputed and compliance_posture re-derived"
          - "recipient moves ACTIVE -> TRANSPLANTED and a WaitlistStatusEvent is appended"
          - "when cit_breach == true, TransplantProgram.cit_breach_count += 1 and compliance_posture is re-derived"
          - "parent chain moves COMMITTED -> EXECUTING, or EXECUTING -> COMPLETED when this was the last non-WITHDRAWN segment"
          - "increments ChainSegment.version by 1"
      - from: PLANNED
        to: WITHDRAWN
        trigger: "system cascade from a participant loss or a chain break"
        actor: system
        preconditions: []
        side_effects:
          - "ChainSegment.status = WITHDRAWN"
          - "recomputes ExchangeChain.segment_count and total_planned_cit_minutes"
          - "increments ChainSegment.version by 1"
      - from: OFFER_SENT
        to: WITHDRAWN
        trigger: "system cascade from a participant loss or a chain break"
        actor: system
        preconditions: []
        side_effects:
          - "ChainSegment.status = WITHDRAWN; offer fields retained for audit"
          - "recomputes ExchangeChain.segment_count and total_planned_cit_minutes"
          - "increments ChainSegment.version by 1"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "system cascade from a participant loss or a chain break"
        actor: system
        preconditions: []
        side_effects:
          - "ChainSegment.status = WITHDRAWN"
          - "every ProcedureBooking of this segment with status == ACTIVE moves to CANCELLED, decrementing OperatingRoom.reserved_minutes_total"
          - "increments ChainSegment.version by 1"
      - from: OFFER_SENT
        to: PLANNED
        trigger: "system, on recipient ACTIVE -> INACTIVE_HOLD or on chain VALIDATED -> SUSPENDED"
        actor: system
        preconditions: []
        side_effects:
          - "ChainSegment.status = PLANNED with every offer/planning field cleared to null"
          - "recomputes ExchangeChain.total_planned_cit_minutes"
          - "increments ChainSegment.version by 1"

  - entity: ProcedureBooking
    initial_state: ACTIVE
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /procedure-bookings/{id}/cancellation, or system cascade (chain broken / segment withdrawn / posture frozen)"
        actor: TransplantCoordinator | system
        preconditions:
          - "booking.status == ACTIVE"
          - "the segment has not reached TRANSPLANTED"
        side_effects:
          - "ProcedureBooking.status = CANCELLED with cancel_reason_code recorded"
          - "OperatingRoom.reserved_minutes_total -= booking.duration_minutes (keeps calculations.chain_commitment_conservation balanced)"
          - "increments ProcedureBooking.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system, on POST /chain-segments/{id}/transplant-completion"
        actor: system
        preconditions:
          - "booking.chain_segment_id == the completing segment"
        side_effects:
          - "ProcedureBooking.status = COMPLETED"
          - "OperatingRoom.reserved_minutes_total unchanged (COMPLETED bookings stay in the ledger)"
          - "increments ProcedureBooking.version by 1"

  - entity: DonorFollowUp
    initial_state: DUE
    terminal_states: [WAIVED]
    note: "Cyclic: INCOMPLETE -> SUBMITTED_COMPLETE and DELINQUENT -> SUBMITTED_COMPLETE allow late/repaired submissions."
    transitions:
      - from: DUE
        to: SUBMITTED_COMPLETE
        trigger: "POST /donor-follow-ups/{id}/submission"
        actor: TransplantCoordinator
        preconditions:
          - "current logical clock >= due_on"
          - "completeness_pct >= program.follow_up_completeness_threshold_pct"
        side_effects:
          - "DonorFollowUp.submitted_field_count, completeness_pct recomputed (calculations.follow_up_completeness); submitted_at = current logical clock"
          - "TransplantProgram.follow_up_compliance_pct recomputed and compliance_posture re-derived"
          - "increments DonorFollowUp.version by 1"
      - from: DUE
        to: INCOMPLETE
        trigger: "POST /donor-follow-ups/{id}/submission"
        actor: TransplantCoordinator
        preconditions:
          - "current logical clock >= due_on"
          - "completeness_pct < program.follow_up_completeness_threshold_pct"
        side_effects:
          - "same recomputation side effects as DUE -> SUBMITTED_COMPLETE"
          - "increments DonorFollowUp.version by 1"
      - from: INCOMPLETE
        to: SUBMITTED_COMPLETE
        trigger: "POST /donor-follow-ups/{id}/submission (repaired submission)"
        actor: TransplantCoordinator
        preconditions:
          - "completeness_pct of the new submission >= program.follow_up_completeness_threshold_pct"
        side_effects:
          - "fields replaced by the new submission; recomputation as above"
          - "increments DonorFollowUp.version by 1"
      - from: DELINQUENT
        to: SUBMITTED_COMPLETE
        trigger: "POST /donor-follow-ups/{id}/submission (late submission)"
        actor: TransplantCoordinator
        preconditions:
          - "completeness_pct of the new submission >= program.follow_up_completeness_threshold_pct"
        side_effects:
          - "fields replaced by the new submission; recomputation as above"
          - "increments DonorFollowUp.version by 1"
      - from: DELINQUENT
        to: INCOMPLETE
        trigger: "POST /donor-follow-ups/{id}/submission (late but partial)"
        actor: TransplantCoordinator
        preconditions:
          - "completeness_pct of the new submission < program.follow_up_completeness_threshold_pct"
        side_effects:
          - "fields replaced by the new submission; recomputation as above"
          - "increments DonorFollowUp.version by 1"
      - from: DUE
        to: DELINQUENT
        trigger: "system, on POST /programs/{id}/compliance-sweep"
        actor: system
        preconditions:
          - "current logical clock >= due_on + DELINQUENCY_GRACE_DAYS days"
          - "status == DUE"
        side_effects:
          - "DonorFollowUp.status = DELINQUENT"
          - "TransplantProgram.follow_up_compliance_pct recomputed and compliance_posture re-derived"
          - "increments DonorFollowUp.version by 1"
      - from: INCOMPLETE
        to: DELINQUENT
        trigger: "system, on POST /programs/{id}/compliance-sweep"
        actor: system
        preconditions:
          - "current logical clock >= due_on + DELINQUENCY_GRACE_DAYS days"
          - "status == INCOMPLETE"
        side_effects:
          - "DonorFollowUp.status = DELINQUENT"
          - "TransplantProgram.follow_up_compliance_pct recomputed and compliance_posture re-derived"
          - "increments DonorFollowUp.version by 1"
      - from: DUE
        to: WAIVED
        trigger: "POST /donor-follow-ups/{id}/waiver"
        actor: ProgramAdmin
        preconditions:
          - "waiver_reason_code is present"
        side_effects:
          - "DonorFollowUp.status = WAIVED, waiver_reason_code recorded"
          - "the row leaves BOTH the numerator and the denominator of calculations.program_follow_up_compliance"
          - "TransplantProgram.follow_up_compliance_pct recomputed and compliance_posture re-derived"
          - "increments DonorFollowUp.version by 1"
      - from: INCOMPLETE
        to: WAIVED
        trigger: "POST /donor-follow-ups/{id}/waiver"
        actor: ProgramAdmin
        preconditions:
          - "waiver_reason_code is present"
        side_effects:
          - "same as DUE -> WAIVED"
          - "increments DonorFollowUp.version by 1"
      - from: DELINQUENT
        to: WAIVED
        trigger: "POST /donor-follow-ups/{id}/waiver"
        actor: ProgramAdmin
        preconditions:
          - "waiver_reason_code is present"
        side_effects:
          - "same as DUE -> WAIVED"
          - "increments DonorFollowUp.version by 1"

  - entity: ProgramOutcomeReview
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /outcome-reviews/{id}/finalization"
        actor: QualityOfficer
        preconditions:
          - "no other FINALIZED ProgramOutcomeReview of this program has the same period_start_on and period_end_on"
        side_effects:
          - "ProgramOutcomeReview.status = FINALIZED, finalized_at = current logical clock"
          - "cascade hop 1: requires_improvement_plan stays as computed at creation"
          - "cascade hop 2: because the review is FINALIZED, TransplantProgram.compliance_posture is re-derived - FLAGGED drives FROZEN, WATCH drives RESTRICTED"
          - "cascade hop 3: because posture entered FROZEN, every ExchangeChain of the program with status IN {DRAFT, VALIDATED} moves to SUSPENDED"
          - "cascade hop 4: because those chains became SUSPENDED, each of their OFFER_SENT segments reverts to PLANNED and each ACTIVE ProcedureBooking of ANY of their segments moves to CANCELLED with cancel_reason_code POSTURE_FROZEN, decrementing OperatingRoom.reserved_minutes_total"
          - "increments ProgramOutcomeReview.version by 1"

  - entity: ImprovementPlan
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED, CLOSED]
    note: |
      REJECTED is endpoint-terminal - POST /improvement-plans/{id}/transitions accepts
      no further action on a REJECTED plan (validations priority 8) - but the SYSTEM may
      still move it to SUPERSEDED when a newer plan is filed for the same review.
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /improvement-plans/{id}/transitions with action=ACCEPT"
        actor: ProgramAdmin
        preconditions:
          - "parent ProgramOutcomeReview.status == FINALIZED"
          - "decision_reason_code is present"
        side_effects:
          - "ImprovementPlan.status = ACCEPTED, decided_at = current logical clock"
          - "TransplantProgram.compliance_posture re-derived: the parent review's FLAGGED level no longer forces FROZEN, so posture drops to RESTRICTED or OPEN, and every SUSPENDED chain reverts to VALIDATED"
          - "increments ImprovementPlan.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /improvement-plans/{id}/transitions with action=REJECT"
        actor: ProgramAdmin
        preconditions:
          - "decision_reason_code is present"
        side_effects:
          - "ImprovementPlan.status = REJECTED, decided_at = current logical clock"
          - "TransplantProgram.compliance_posture re-derived (stays FROZEN while the FLAGGED review is unanswered)"
          - "increments ImprovementPlan.version by 1"
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /improvement-plans/{id}/transitions with action=CLOSE"
        actor: ProgramAdmin
        preconditions:
          - "status == ACCEPTED"
        side_effects:
          - "ImprovementPlan.status = CLOSED, closed_at = current logical clock"
          - "TransplantProgram.compliance_posture re-derived; a WATCH review referenced by this plan stops holding posture at RESTRICTED"
          - "increments ImprovementPlan.version by 1"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system, on POST /improvement-plans creating a newer plan for the same ProgramOutcomeReview"
        actor: system
        preconditions:
          - "no ImprovementPlan of this review has status IN {ACCEPTED, CLOSED}"
        side_effects:
          - "ImprovementPlan.status = SUPERSEDED"
          - "increments ImprovementPlan.version by 1"
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system, on POST /improvement-plans creating a newer plan for the same ProgramOutcomeReview"
        actor: system
        preconditions:
          - "no ImprovementPlan of this review has status IN {ACCEPTED, CLOSED}"
        side_effects:
          - "ImprovementPlan.status = SUPERSEDED"
          - "increments ImprovementPlan.version by 1"

  - entity: DonorCostClaim
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVERSED]
    transitions:
      - from: SUBMITTED
        to: ADJUDICATED
        trigger: "POST /donor-cost-claims/{id}/adjudication with decision=APPROVE"
        actor: FinanceAdmin
        preconditions:
          - "claim donor overall_status == DONATED"
          - "donor lifetime remaining > 0 (see calculations.donor_cost_reimbursement)"
        side_effects:
          - "insurance_part_cents / grant_part_cents / fund_part_cents / adjudicated_reimbursement_cents / unfunded_cents computed by calculations.donor_cost_reimbursement variant adjudicated"
          - "TransplantProgram.donor_fund_committed_cents += fund_part_cents and donor_fund_remaining_cents recomputed (calculations.donor_fund_ledger)"
          - "DonorCostClaim.status = ADJUDICATED, adjudicated_at = current logical clock, adjudicated_by_user_id = X-User-ID"
          - "increments DonorCostClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /donor-cost-claims/{id}/adjudication with decision=DENY"
        actor: FinanceAdmin
        preconditions:
          - "decision_reason_code is present"
        side_effects:
          - "DonorCostClaim.status = DENIED; adjudicated_reimbursement_cents = 0; all part fields 0; unfunded_cents = estimated_reimbursement_cents"
          - "program fund untouched"
          - "increments DonorCostClaim.version by 1"
      - from: ADJUDICATED
        to: REVERSED
        trigger: "POST /donor-cost-claims/{id}/reversal"
        actor: FinanceAdmin
        preconditions:
          - "status == ADJUDICATED"
          - "reversal_reason_code is present"
        side_effects:
          - "DonorCostClaim.status = REVERSED, reversal_reason_code recorded"
          - "TransplantProgram.donor_fund_committed_cents -= fund_part_cents; donor_fund_remaining_cents recomputed so calculations.donor_fund_ledger stays balanced"
          - "the claim's amounts are retained for audit but leave every aggregate: donor lifetime consumption and NLDAC pool consumption both drop by this claim's parts"
          - "increments DonorCostClaim.version by 1"
        note: "Compensating action for SUBMITTED -> ADJUDICATED."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version - the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: chain-segment-add-stale-chain
    parent_entity: ExchangeChain
    write_endpoint: "POST /exchange-chains/{id}/segments"
    occ_field: "expected_chain_version"
    description: |
      Adding a segment to a chain whose version has advanced since the client last
      read it is rejected. A segment insertion is only meaningful against a known
      topology (which positions are taken, which donors and recipients already
      participate); once another writer has inserted a segment the chain's topology
      differs from the one the current writer validated its position and predecessor
      against, so the write carries a stale view and is refused.
    error_id: ERR_STALE_CHAIN_VERSION
    http_status: 412
  - rule_id: improvement-plan-create-stale-review
    parent_entity: ProgramOutcomeReview
    write_endpoint: "POST /improvement-plans"
    occ_field: "expected_review_version"
    description: |
      Creating an ImprovementPlan for a review whose version has advanced since the
      client last read it is rejected. A new plan legitimately supersedes any
      SUBMITTED or REJECTED plan of the same review, so nothing in the review's state
      blocks a second creation; the stale-version check is what prevents a writer
      from superseding a plan it never saw.
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: cooling_off_window
    applies_to: DonorCandidate.cooling_off_ends_at
    algorithm_type: threshold
    constants:
      NON_DIRECTED_EXTRA_DAYS: 7
      MIN_RE_DISCLOSURE_DAYS: 2
    formula: |
      base_days = program.cooling_off_days
      if donor.intended_recipient_id is null:            # non-directed / NDD donor
          base_days = base_days + NON_DIRECTED_EXTRA_DAYS
      if donor.disclosure_sequence >= 2:                  # re-consent after a material change
          effective_days = max(MIN_RE_DISCLOSURE_DAYS, ceil(base_days / 2))
      else:
          effective_days = base_days
      cooling_off_ends_at = disclosure_at + effective_days days
    inputs:
      - "TransplantProgram.cooling_off_days"
      - "DonorCandidate.intended_recipient_id (null => non-directed)"
      - "DonorCandidate.disclosure_sequence"
      - "DonorCandidate.disclosure_at (set to the logical clock at disclosure)"
    precision: "whole days added to a UTC instant; no truncation of the time-of-day component"
    boundary_semantics: "attestation is permitted when current logical clock >= cooling_off_ends_at (inclusive); one second earlier is refused"
    examples:
      - "directed donor, program.cooling_off_days = 7, disclosure_at = 2026-08-01T00:00:00Z, disclosure_sequence = 1 -> cooling_off_ends_at = 2026-08-08T00:00:00Z; attestation at exactly 2026-08-08T00:00:00Z succeeds"
      - "same donor, attestation at 2026-08-07T23:59:59Z -> ERR_COOLING_OFF_NOT_ELAPSED"
      - "non-directed donor (intended_recipient_id null), cooling_off_days = 7, disclosure_at = 2026-08-01T00:00:00Z, sequence 1 -> base 14 -> 2026-08-15T00:00:00Z"
      - "directed donor re-disclosed at 2026-08-10T06:00:00Z with disclosure_sequence = 2 -> max(2, ceil(7/2)) = max(2, 4) = 4 -> 2026-08-14T06:00:00Z"
      - "program.cooling_off_days = 3, directed, re-disclosure sequence 2 -> max(2, ceil(3/2)) = max(2, 2) = 2 days"

  - name: donor_exclusion_screen
    applies_to: "DonorEvaluation.exclusion_codes, DonorEvaluation.hard_exclusion_count, DonorEvaluation.risk_points"
    algorithm_type: threshold
    constants:
      BMI_HARD_MAX: 35.0
      BMI_SOFT_MIN: 30.0
      EGFR_HARD_MIN: 80.0
      EGFR_SOFT_MAX: 90.0
      SYSTOLIC_HARD_MIN: 160
      SYSTOLIC_SOFT_MIN: 140
      HBA1C_HARD_MIN: 6.5
      HBA1C_SOFT_MIN: 5.7
      MIN_DONOR_AGE_YEARS: 18
      SENIOR_DONOR_AGE_YEARS: 60
      HARDSHIP_SOFT_MIN: 7
      SUPPORT_SOFT_MAX: 3
    formula: |
      # HARD exclusions - any one of these forces hard_exclusion_count >= 1 and the
      # determination endpoint may then only record EXCLUDED or DEFERRED, never CLEARED.
      MEDICAL domain hard codes:
        EX_BMI_TOO_HIGH        if bmi > 35.0
        EX_RENAL_FUNCTION_LOW  if egfr_ml_min < 80.0
        EX_HYPERTENSION        if systolic_bp >= 160
        EX_DIABETES_RANGE      if hba1c >= 6.5
        EX_UNDERAGE            if donor.age_years < 18
      PSYCHOSOCIAL domain hard codes:
        EX_COERCION_SUSPECTED  if coercion_flag == true
        EX_SUBSTANCE_USE       if unmanaged_substance_use == true
        EX_CAPACITY_ABSENT     if decisional_capacity_ok == false
      hard_exclusion_count = number of hard codes that fired
      # SOFT findings - no exclusion, but they accumulate risk_points
      MEDICAL soft points:
        +2 if 30.0 < bmi <= 35.0
        +3 if 80.0 <= egfr_ml_min < 90.0
        +2 if 140 <= systolic_bp < 160
        +2 if 5.7 <= hba1c < 6.5
        +1 if donor.age_years >= 60
      PSYCHOSOCIAL soft points:
        +3 if financial_hardship_score >= 7
        +2 if social_support_score <= 3
      risk_points = sum of the soft points that fired for THIS evaluation's domain only
      exclusion_codes = sorted list of the hard codes that fired
    inputs:
      - "DonorEvaluation findings for the evaluation's own domain"
      - "DonorCandidate.age_years"
    precision: "risk_points is a non-negative integer; comparisons on bmi/egfr/hba1c use exact decimal values as submitted"
    boundary_semantics: "hard bands are strictly outside the soft band: bmi == 35.0 is soft (+2) not hard; egfr == 80.0 is soft (+3) not hard; systolic == 160 is hard; hba1c == 6.5 is hard"
    examples:
      - "MEDICAL bmi 35.0, egfr 95.0, systolic 130, hba1c 5.2, age 41 -> exclusion_codes [], hard_exclusion_count 0, risk_points 2"
      - "MEDICAL bmi 35.1 -> exclusion_codes [EX_BMI_TOO_HIGH], hard_exclusion_count 1, risk_points 0 (a hard finding contributes no soft points)"
      - "MEDICAL bmi 31.0, egfr 84.0, systolic 145, hba1c 6.0, age 62 -> risk_points 2+3+2+2+1 = 10, hard_exclusion_count 0"
      - "PSYCHOSOCIAL coercion_flag false, unmanaged_substance_use false, decisional_capacity_ok true, financial_hardship_score 8, social_support_score 2 -> risk_points 5, hard_exclusion_count 0"
      - "PSYCHOSOCIAL coercion_flag true, financial_hardship_score 9 -> exclusion_codes [EX_COERCION_SUSPECTED], hard_exclusion_count 1"

  - name: donor_risk_index
    applies_to: "DonorCandidate.screening_risk_index, DonorCandidate.final_risk_index"
    algorithm_type: weighted_scoring
    dual_variant: true
    variants:
      - name: screening_index
        when: "recomputed after every DonorEvaluation determination or resubmission; stored in DonorCandidate.screening_risk_index"
        formula: |
          screening_risk_index = round_half_up(0.6 * medical_risk_points + 0.4 * psychosocial_risk_points, 2)
        note: "Provisional weighting: medicine dominates while the workup is open. Deferrals and non-directed status are NOT surcharged."
      - name: final_index
        when: "computed once at the advocacy DISCLOSED -> ATTESTED transition; stored in DonorCandidate.final_risk_index"
        formula: |
          ndd = 1 if donor.intended_recipient_id is null else 0
          final_risk_index = round_half_up(0.5 * medical_risk_points
                                          + 0.5 * psychosocial_risk_points
                                          + DEFERRAL_SURCHARGE * donor.deferral_count
                                          + NDD_SURCHARGE * ndd, 2)
        note: "Final weighting: the two domains weigh equally, and the evaluation history (deferral_count) plus non-directed status become first-class risk."
    constants:
      DEFERRAL_SURCHARGE: 1.5
      NDD_SURCHARGE: 2.0
      RISK_INDEX_CEILING: 8.0
    selection_rule: "screening_index is written on every evaluation determination/resubmission; final_index is written only at attestation and is the value compared against RISK_INDEX_CEILING to choose APPROVED vs CONDITIONAL_APPROVED"
    precision: "round half up to 2 decimal places, applied once to the whole weighted sum"
    boundary_semantics: "final_risk_index >= RISK_INDEX_CEILING (8.0) yields CONDITIONAL_APPROVED; exactly 7.99 yields APPROVED"
    examples:
      - "directed donor, medical_risk_points 10, psychosocial_risk_points 5, deferral_count 0 -> screening_index round(6.0 + 2.0, 2) = 8.0; final_index round(5.0 + 2.5, 2) = 7.5 -> APPROVED. The two variants differ by 0.5 on identical data."
      - "directed donor, medical_risk_points 10, psychosocial_risk_points 5, deferral_count 1 -> screening_index still 8.0 (deferrals are invisible to the screening variant); final_index round(5.0 + 2.5 + 1.5, 2) = 9.0 -> CONDITIONAL_APPROVED"
      - "non-directed donor, medical_risk_points 4, psychosocial_risk_points 6, deferral_count 0 -> screening_index round(2.4 + 2.4, 2) = 4.8; final_index round(2.0 + 3.0 + 0.0 + 2.0, 2) = 7.0 -> APPROVED"
      - "directed donor, medical_risk_points 3, psychosocial_risk_points 2, deferral_count 2 -> screening_index round(1.8 + 0.8, 2) = 2.6; final_index round(1.5 + 1.0 + 3.0, 2) = 5.5"
      - "rounding: medical_risk_points 5, psychosocial_risk_points 2, deferral_count 1, directed -> final round(2.5 + 1.0 + 1.5, 2) = 5.0"

  - name: donor_overall_status
    applies_to: DonorCandidate.overall_status
    algorithm_type: constraint_propagation
    formula: |
      # Evaluated in this exact order; the first matching clause wins.
      if medical_status == EXCLUDED or psychosocial_status == EXCLUDED:  EXCLUDED
      elif advocacy_status == OBJECTED:                                  ADVOCATE_BLOCKED
      elif donated_at is not null:                                       DONATED
      elif donor holds a non-WITHDRAWN ChainSegment whose ExchangeChain.status IN {COMMITTED, EXECUTING}
           AND that segment's own created_at <= that chain's committed_at
           (a segment inserted AFTER commitment does not retroactively commit its donor):
                                                                        CHAIN_COMMITTED
      elif advocacy_status == ATTESTED
           and medical_status == CLEARED
           and psychosocial_status == CLEARED:
               CONDITIONAL_APPROVED if final_risk_index >= RISK_INDEX_CEILING else APPROVED
      elif at least one DonorEvaluation row exists for this donor:       EVAL_IN_PROGRESS
      else:                                                             REFERRED
    inputs:
      - "the three DonorCandidate state dimensions"
      - "DonorCandidate.final_risk_index"
      - "DonorCandidate.donated_at"
      - "chain participation of this donor's non-WITHDRAWN ChainSegment rows"
    precision: "pure enum derivation; never accepted as caller input"
    boundary_semantics: "EXCLUDED and ADVOCATE_BLOCKED are absorbing: once either clause has fired, later clearances cannot promote the donor"
    examples:
      - "advocacy ASSIGNED, medical CLEARED, psychosocial PENDING, 2 evaluations -> EVAL_IN_PROGRESS"
      - "advocacy ATTESTED, medical CLEARED, psychosocial CLEARED, final_risk_index 7.5 -> APPROVED"
      - "advocacy ATTESTED, medical CLEARED, psychosocial CLEARED, final_risk_index 9.0 -> CONDITIONAL_APPROVED"
      - "advocacy ATTESTED, medical CLEARED, psychosocial EXCLUDED -> EXCLUDED (the EXCLUDED clause precedes the attested clause)"
      - "advocacy OBJECTED, medical CLEARED, psychosocial CLEARED -> ADVOCATE_BLOCKED"

  - name: cold_ischemia_time
    applies_to: "ChainSegment.planned_cit_minutes, ChainSegment.actual_cit_minutes, ChainSegment.cit_breach, ExchangeChain.total_planned_cit_minutes"
    algorithm_type: threshold
    dual_variant: true
    variants:
      - name: planned_cit
        when: "computed at POST /chain-segments/{id}/offer; stored in ChainSegment.planned_cit_minutes"
        formula: |
          planned_cit_minutes = whole_minutes(planned_reperfusion_at - planned_cross_clamp_at)
                                + CROSS_MATCH_HOLD_MINUTES
        note: "The plan must reserve the final cross-match hold, so the planned figure is deliberately more conservative than the realized one."
      - name: actual_cit
        when: "computed at POST /chain-segments/{id}/transplant-completion; stored in ChainSegment.actual_cit_minutes"
        formula: |
          actual_cit_minutes = whole_minutes(actual_reperfusion_at - actual_cross_clamp_at)
        note: "No hold is added: the realized interval already contains whatever hold occurred."
    constants:
      CROSS_MATCH_HOLD_MINUTES: 45
      MAX_CIT_MINUTES: 1080
      CHAIN_CIT_BUDGET_MINUTES: 2400
      OFFER_RESPONSE_WINDOW_HOURS: 6
    selection_rule: "planned_cit gates the offer; actual_cit gates cit_breach at completion. Both are compared against MAX_CIT_MINUTES, so identical clamp-to-reperfusion spans can pass as actual and fail as planned."
    aggregate_rule: |
      ExchangeChain.total_planned_cit_minutes = sum of planned_cit_minutes over the chain's
      segments with status IN {OFFER_SENT, ACCEPTED, TRANSPLANTED}, evaluated in
      position ASC, created_at ASC order. The budget check at offer time is
      SELF-EXCLUDING: it sums the OTHER qualifying segments and adds the candidate
      segment's own freshly computed planned_cit_minutes, so re-offering a segment
      never double-counts it.
    precision: "whole minutes, truncated toward zero (a 59-second remainder does not round up)"
    boundary_semantics: "planned_cit_minutes == MAX_CIT_MINUTES (1080) is accepted; 1081 is ERR_CIT_LIMIT_EXCEEDED. total_planned_cit_minutes == CHAIN_CIT_BUDGET_MINUTES (2400) is accepted; 2401 is ERR_CHAIN_CIT_BUDGET_EXCEEDED."
    examples:
      - "planned_cross_clamp_at 2026-08-01T06:00:00Z, planned_reperfusion_at 2026-08-01T23:15:00Z -> 1035 + 45 = 1080 -> accepted (exactly at the cap)"
      - "planned_cross_clamp_at 2026-08-01T06:00:00Z, planned_reperfusion_at 2026-08-01T23:16:00Z -> 1036 + 45 = 1081 -> ERR_CIT_LIMIT_EXCEEDED"
      - "actual_cross_clamp_at 2026-08-01T06:00:00Z, actual_reperfusion_at 2026-08-01T23:16:00Z -> actual_cit_minutes 1036, cit_breach false (same span the planned variant rejected)"
      - "actual_cross_clamp_at 2026-08-01T06:00:00Z, actual_reperfusion_at 2026-08-02T00:05:30Z -> whole_minutes = 1085 -> actual_cit_minutes 1085, cit_breach true"
      - "three offered segments at 800 + 800 + 800 planned minutes = 2400 -> accepted; a fourth offer at any positive value -> ERR_CHAIN_CIT_BUDGET_EXCEEDED"

  - name: chain_topology
    applies_to: "ExchangeChain.segment_count, ExchangeChain.is_closed_loop, chain validation"
    algorithm_type: topological
    formula: |
      ordered = chain's segments with status != WITHDRAWN, sorted by position ASC
      segment_count = len(ordered)
      # contiguity: positions must be exactly 1..segment_count with no gap or duplicate
      # linkage: ordered[0].predecessor_segment_id is null;
      #          ordered[k].predecessor_segment_id == ordered[k-1].id for k >= 1
      # uniqueness: no donor_candidate_id and no recipient_candidate_id repeats within ordered
      is_closed_loop = (ordered[-1].recipient_candidate_id ==
                        ordered[0].donor_candidate_id's intended_recipient_id)
      # ABO compatibility, applied per segment (donor ABO -> recipient ABO):
      #   O  -> {O, A, B, AB}
      #   A  -> {A, AB}
      #   B  -> {B, AB}
      #   AB -> {AB}
      # chain_type gates:
      #   PAIRED_LOOP requires segment_count >= 2 AND is_closed_loop == true
      #   NDD_CHAIN   requires is_closed_loop == false AND ordered[0].donor.intended_recipient_id is null
    inputs:
      - "ChainSegment.position, predecessor_segment_id, donor_candidate_id, recipient_candidate_id, status"
      - "DonorCandidate.abo_blood_type via the donor row; RecipientCandidate.abo_blood_type"
      - "DonorCandidate.intended_recipient_id"
    precision: "integer positions; set membership for ABO"
    boundary_semantics: "a two-segment PAIRED_LOOP is the minimum valid loop; a single-segment chain always fails ERR_CHAIN_TOO_SHORT regardless of type"
    examples:
      - "positions [1,2] with predecessors [null, seg1], donor1.intended_recipient == recipient2 -> is_closed_loop true, PAIRED_LOOP validates"
      - "positions [1,3] -> ERR_CHAIN_POSITIONS_NOT_CONTIGUOUS"
      - "positions [1,2] but ordered[1].predecessor_segment_id is null -> ERR_CHAIN_LINKAGE_BROKEN"
      - "donor abo A, recipient abo B -> ERR_ABO_INCOMPATIBLE; donor abo O, recipient abo AB -> compatible"
      - "NDD_CHAIN whose position-1 donor has a non-null intended_recipient_id -> ERR_NDD_START_INVALID"

  - name: waitlist_active_days
    applies_to: RecipientCandidate.active_days_total
    algorithm_type: interval_merge
    formula: |
      # Replay the candidate's WaitlistStatusEvent rows in effective_at ASC, created_at ASC order.
      # An ACTIVE interval opens at every event whose to_status == ACTIVE and closes at the next
      # event whose from_status == ACTIVE. An interval still open at evaluation time closes at the
      # current logical clock.
      intervals = half-open [open_at, close_at) windows built by that replay
      merged    = union of overlapping or touching intervals (a zero-length interval contributes nothing)
      total_seconds = sum over merged of (close_at - open_at) in seconds
      active_days_total = floor(total_seconds / 86400)      # floor applied ONCE to the total
    inputs:
      - "WaitlistStatusEvent rows of this candidate"
      - "current logical clock (for a still-open interval)"
    precision: "floor to whole days is applied to the summed total, never per interval"
    boundary_semantics: "an interval that opens and closes at the same instant contributes 0 seconds; adjacent intervals (close_at of one == open_at of the next) merge into one"
    examples:
      - "ACTIVE 2026-06-01T00:00:00Z -> INACTIVE_HOLD 2026-06-11T12:00:00Z, then ACTIVE 2026-07-01T00:00:00Z -> REMOVED 2026-07-11T18:00:00Z: 10.5 d + 10.75 d = 21.25 d -> 21"
      - "two intervals of 12 hours each: 43200 + 43200 = 86400 s -> 1 (per-interval flooring would have given 0)"
      - "still-open interval ACTIVE at 2026-07-01T00:00:00Z with the clock at 2026-08-01T00:00:00Z -> 31"
      - "no ACTIVE event ever recorded -> 0"

  - name: waitlist_priority_score
    applies_to: RecipientCandidate.waitlist_priority_score
    algorithm_type: weighted_scoring
    constants:
      URGENCY_WEIGHT: 2.0
      ACTIVE_DAY_WEIGHT: 0.007
      DIALYSIS_YEAR_WEIGHT: 1.005
      CPRA_TIER_98: 10.0
      CPRA_TIER_80: 4.0
      CPRA_TIER_20: 1.0
      PEDIATRIC_BONUS: 3.0
      PEDIATRIC_AGE_YEARS: 18
    formula: |
      # EACH component is rounded half-up to 2 decimal places BEFORE summation, and the
      # sum itself is NOT re-rounded. Component-then-sum and sum-then-round disagree.
      c_urgency  = round_half_up(medical_urgency_points * 2.0, 2)
      c_waiting  = round_half_up(active_days_total * 0.007, 2)
      c_dialysis = round_half_up(dialysis_years * 1.005, 2)
      c_cpra     = 10.0 if cpra >= 0.98
                   else 4.0 if cpra >= 0.80
                   else 1.0 if cpra >= 0.20
                   else 0.0
      c_pediatric = 3.0 if age_years < 18 else 0.0
      waitlist_priority_score = c_urgency + c_waiting + c_dialysis + c_cpra + c_pediatric
    inputs:
      - "RecipientCandidate.medical_urgency_points, active_days_total, dialysis_years, cpra, age_years"
    precision: "half-up to 2 dp per component; the total keeps whatever decimals the component sum produces"
    boundary_semantics: "cpra tiers are inclusive at their lower bound: 0.98 -> 10.0, 0.9799 -> 4.0, 0.80 -> 4.0, 0.1999 -> 0.0. age_years == 18 earns no pediatric bonus."
    examples:
      - "urgency 7, active_days_total 366, dialysis_years 3.005, cpra 0.85, age 44: c_urgency 14.0, c_waiting round(2.562,2) = 2.56, c_dialysis round(3.020025,2) = 3.02, c_cpra 4.0, c_pediatric 0.0 -> 23.58. Summing first and rounding once would give round(23.572025,2) = 23.57, which is wrong."
      - "urgency 0, active_days_total 0, dialysis_years 0, cpra 0.05, age 9 -> 0.0 + 0.0 + 0.0 + 0.0 + 3.0 = 3.0"
      - "urgency 3, active_days_total 100, dialysis_years 1, cpra 0.98, age 30 -> 6.0 + 0.7 + 1.01 + 10.0 = 17.71"
      - "urgency 1, active_days_total 21, dialysis_years 0, cpra 0.20, age 17 -> 2.0 + round(0.147,2)=0.15 + 0.0 + 1.0 + 3.0 = 6.15"

  - name: follow_up_completeness
    applies_to: "DonorFollowUp.required_fields_count, DonorFollowUp.submitted_field_count, DonorFollowUp.completeness_pct"
    algorithm_type: threshold
    constants:
      REQUIRED_FIELDS_SIX_MONTH: 12
      REQUIRED_FIELDS_ONE_YEAR: 14
      REQUIRED_FIELDS_TWO_YEAR: 10
    formula: |
      required_fields_count = REQUIRED_FIELDS_<interval_code>
      submitted_field_count = number of DISTINCT field names in the submission payload's
                              submitted_fields list that are non-null, non-empty strings
                              (duplicates collapse; a null or "" value does not count)
      completeness_pct = round_half_up(100.0 * submitted_field_count / required_fields_count, 2)
      status = SUBMITTED_COMPLETE if completeness_pct >= program.follow_up_completeness_threshold_pct
               else INCOMPLETE
    inputs:
      - "DonorFollowUp.interval_code"
      - "submitted_fields from POST /donor-follow-ups/{id}/submission"
      - "TransplantProgram.follow_up_completeness_threshold_pct"
    precision: "half-up to 2 decimal places"
    boundary_semantics: "the threshold comparison is >=: exactly 80.00 counts as complete. submitted_field_count is capped at required_fields_count, so completeness_pct never exceeds 100.00."
    examples:
      - "TWO_YEAR, 8 distinct valid fields of 10 -> 80.00 -> SUBMITTED_COMPLETE (exactly at threshold)"
      - "TWO_YEAR, 7 of 10 -> 70.00 -> INCOMPLETE"
      - "SIX_MONTH, 10 of 12 -> round(83.333...,2) = 83.33 -> SUBMITTED_COMPLETE"
      - "ONE_YEAR, 11 of 14 -> round(78.571...,2) = 78.57 -> INCOMPLETE (78.57 < 80)"
      - "SIX_MONTH submission listing 14 names of which 2 are duplicates and 1 is \"\" -> submitted_field_count 11 -> round(91.666...,2) = 91.67"

  - name: program_follow_up_compliance
    applies_to: TransplantProgram.follow_up_compliance_pct
    algorithm_type: aggregation
    constants:
      DELINQUENCY_GRACE_DAYS: 30
      FOLLOW_UP_DUE_OFFSET_DAYS: { SIX_MONTH: 180, ONE_YEAR: 365, TWO_YEAR: 730 }
    formula: |
      denominator = count of DonorFollowUp rows whose donor belongs to this program
                    AND status IN {DUE, SUBMITTED_COMPLETE, INCOMPLETE, DELINQUENT}
                    AND due_on <= current logical clock
      numerator   = count of those same rows whose status == SUBMITTED_COMPLETE
      follow_up_compliance_pct = 100.00 if denominator == 0
                                 else round_half_up(100.0 * numerator / denominator, 2)
    inputs:
      - "DonorFollowUp rows reachable through DonorCandidate.program_id"
      - "current logical clock"
    precision: "half-up to 2 decimal places"
    boundary_semantics: |
      WAIVED rows leave BOTH numerator and denominator - waiving a delinquent row raises
      compliance without ever counting as a submission. A row whose due_on is still in the
      future is not yet countable, so a brand-new program with three DUE-but-future rows
      reports the vacuous 100.00 rather than 0.00.
    examples:
      - "no follow-up row is due yet -> 100.00 (vacuous case)"
      - "4 due rows, 3 SUBMITTED_COMPLETE, 1 DELINQUENT -> 75.00 -> exactly at follow_up_compliance_threshold_pct, so posture does NOT degrade"
      - "4 due rows, 2 SUBMITTED_COMPLETE, 2 DELINQUENT -> 50.00 -> below threshold, posture degrades to RESTRICTED"
      - "3 due rows, 1 SUBMITTED_COMPLETE, 1 INCOMPLETE, 1 WAIVED -> denominator 2, numerator 1 -> 50.00"
      - "1 due row SUBMITTED_COMPLETE and 1 WAIVED row -> denominator 1, numerator 1 -> 100.00"
      - "7 due rows, 5 SUBMITTED_COMPLETE -> round(71.428...,2) = 71.43"

  - name: outcome_oe_ratio
    applies_to: "ProgramOutcomeReview.expected_survival_rate_used, expected_survivor_count, oe_ratio, flag_level, requires_improvement_plan"
    algorithm_type: threshold
    constants:
      MIN_COHORT_SIZE: 10
      FLAG_THRESHOLD: 0.85
      WATCH_THRESHOLD: 0.95
    formula: |
      expected_survival_rate_used = program.expected_one_year_survival_rate   # snapshotted at creation
      expected_survivor_count = round_half_up(cohort_size * expected_survival_rate_used, 2)
      if cohort_size < MIN_COHORT_SIZE:
          oe_ratio = null; flag_level = NONE; requires_improvement_plan = false
      else:
          oe_ratio = round_half_up(observed_survivor_count / expected_survivor_count, 4)
          flag_level = FLAGGED if oe_ratio < 0.85
                       else WATCH if oe_ratio < 0.95
                       else NONE
          requires_improvement_plan = (flag_level == FLAGGED)
    inputs:
      - "ProgramOutcomeReview.cohort_size, observed_survivor_count"
      - "TransplantProgram.expected_one_year_survival_rate at the moment of review creation"
    precision: "expected_survivor_count half-up to 2 dp; oe_ratio half-up to 4 dp"
    boundary_semantics: |
      Both thresholds are strict: oe_ratio == 0.8500 is WATCH (not FLAGGED) and
      oe_ratio == 0.9500 is NONE (not WATCH). The snapshot matters: changing
      program.expected_one_year_survival_rate afterwards never re-rates an existing review.
    examples:
      - "expected rate 0.80, cohort_size 25 -> expected_survivor_count 20.0; observed 17 -> oe_ratio 0.8500 -> WATCH, requires_improvement_plan false"
      - "expected rate 0.80, cohort_size 25, observed 16 -> oe_ratio 0.8000 -> FLAGGED, requires_improvement_plan true"
      - "expected rate 0.80, cohort_size 25, observed 19 -> oe_ratio 0.9500 -> NONE"
      - "expected rate 0.80, cohort_size 25, observed 18 -> oe_ratio 0.9000 -> WATCH"
      - "expected rate 0.95, cohort_size 9, observed 3 -> cohort below MIN_COHORT_SIZE -> oe_ratio null, flag_level NONE even though the raw ratio would be catastrophic"
      - "expected rate 0.95, cohort_size 30 -> expected_survivor_count 28.5; observed 26 -> round(0.912280...,4) = 0.9123 -> WATCH"

  - name: donor_cost_reimbursement
    applies_to: "DonorCostClaim.estimated_reimbursement_cents, adjudicated_reimbursement_cents, insurance_part_cents, grant_part_cents, fund_part_cents, unfunded_cents"
    algorithm_type: waterfall_allocation
    dual_variant: true
    variants:
      - name: estimated
        when: "computed at POST /donor-cost-claims (creation); stored in estimated_reimbursement_cents"
        formula: |
          if claim_type == MEDICAL:     cap = MEDICAL_CAP_CENTS
          elif claim_type == TRAVEL:    cap = TRAVEL_CAP_CENTS
          else:                         # LOST_WAGES - nested min over two caps
            cap = min(lost_wage_days * program.lost_wage_daily_cap_cents,
                      ceil(lost_wage_days / 7) * program.lost_wage_weekly_cap_cents)
          estimated_reimbursement_cents = min(submitted_amount_cents, cap)
        note: "Optimistic: it applies only the per-claim cap and ignores the donor lifetime cap, the coverage buckets and the program fund balance."
      - name: adjudicated
        when: "computed at POST /donor-cost-claims/{id}/adjudication with decision=APPROVE"
        formula: |
          # 1. eligibility ceiling
          prior = sum of adjudicated_reimbursement_cents over this donor's claims with status == ADJUDICATED
          need  = min(estimated_reimbursement_cents, DONOR_LIFETIME_CAP_CENTS - prior)
          # 2. ordered waterfall - each bucket fills as far as it can before the next is touched
          insurance_headroom = INSURANCE_PER_CLAIM_CAP_CENTS if coverage_source == RECIPIENT_INSURANCE else 0
          insurance_part_cents = min(need, insurance_headroom)
          remainder = need - insurance_part_cents
          grant_eligible = claim_type IN {TRAVEL, LOST_WAGES}
          grant_headroom = (NLDAC_PER_DONOR_CAP_CENTS - sum of grant_part_cents over this donor's
                            ADJUDICATED claims) if grant_eligible else 0
          grant_part_cents = min(remainder, max(0, grant_headroom))
          remainder = remainder - grant_part_cents
          fund_part_cents = min(remainder, program.donor_fund_remaining_cents)
          remainder = remainder - fund_part_cents
          adjudicated_reimbursement_cents = insurance_part_cents + grant_part_cents + fund_part_cents
          unfunded_cents = estimated_reimbursement_cents - adjudicated_reimbursement_cents
        note: "Pessimistic: the lifetime cap, the bucket order and the fund balance can all shrink the payout below the estimate. The shortfall is recorded, never silently dropped."
    constants:
      MEDICAL_CAP_CENTS: 1000000
      TRAVEL_CAP_CENTS: 350000
      DONOR_LIFETIME_CAP_CENTS: 1500000
      INSURANCE_PER_CLAIM_CAP_CENTS: 600000
      NLDAC_PER_DONOR_CAP_CENTS: 800000
    selection_rule: "estimated is written once at creation and never revised; adjudicated is written at approval. unfunded_cents is the delta between the two variants and is what the improvement-plan narrative reports."
    precision: "integer cents throughout; ceil() only in the LOST_WAGES week count; no rounding of money"
    boundary_semantics: |
      The nested LOST_WAGES min flips which cap binds around the 5-day mark: at 5 days the
      daily cap (150000) exactly equals the one-week cap (150000); below 5 days the daily cap
      binds, above it the weekly cap binds. A bucket with zero headroom is skipped without
      consuming the remainder, and coverage_source only opens the INSURANCE bucket - a
      PROGRAM_FUND claim never touches insurance even if headroom would exist.
    examples:
      - "MEDICAL, submitted 450000, coverage_source RECIPIENT_INSURANCE, no prior claims -> estimated min(450000, 1000000) = 450000; adjudicated: need 450000, insurance_part 450000, grant_part 0 (MEDICAL is not grant-eligible), fund_part 0, adjudicated 450000, unfunded 0"
      - "MEDICAL, submitted 900000, coverage_source RECIPIENT_INSURANCE, fund_remaining 5000000 -> estimated 900000; insurance_part 600000 (per-claim cap), grant_part 0, fund_part 300000, adjudicated 900000, unfunded 0"
      - "TRAVEL, submitted 500000, coverage_source NLDAC_GRANT -> estimated min(500000, 350000) = 350000; insurance_part 0 (wrong coverage_source), grant_part 350000, fund_part 0, adjudicated 350000, unfunded 0"
      - "LOST_WAGES, lost_wage_days 4, submitted 200000 -> daily 4*30000 = 120000, weekly ceil(4/7)=1 * 150000 = 150000 -> cap min = 120000 -> estimated 120000 (daily binds)"
      - "LOST_WAGES, lost_wage_days 6, submitted 200000 -> daily 180000, weekly 150000 -> cap 150000 -> estimated 150000 (weekly binds)"
      - "LOST_WAGES, lost_wage_days 5, submitted 200000 -> daily 150000, weekly 150000 -> cap 150000 (the crossover point)"
      - "LOST_WAGES, lost_wage_days 10, submitted 400000 -> daily 300000, weekly ceil(10/7)=2 * 150000 = 300000 -> cap 300000 -> estimated 300000"
      - "lifetime squeeze: prior adjudicated 1350000, new MEDICAL claim submitted 800000, coverage_source PROGRAM_FUND, fund_remaining 5000000 -> estimated 800000 but need min(800000, 1500000-1350000) = 150000 -> insurance_part 0, grant_part 0, fund_part 150000, adjudicated 150000, unfunded 650000"
      - "fund exhaustion: TRAVEL submitted 350000, coverage_source PROGRAM_FUND, donor already consumed the full NLDAC pool, fund_remaining 100000 -> grant_headroom 0, fund_part 100000, adjudicated 100000, unfunded 250000"

  - name: donor_fund_ledger
    applies_to: "TransplantProgram.donor_fund_committed_cents, TransplantProgram.donor_fund_remaining_cents"
    algorithm_type: aggregation
    formula: |
      donor_fund_committed_cents = sum of fund_part_cents over every DonorCostClaim whose
                                   donor belongs to this program AND status == ADJUDICATED
      donor_fund_remaining_cents = donor_fund_pool_cents - donor_fund_committed_cents
    invariant: "donor_fund_committed_cents + donor_fund_remaining_cents == donor_fund_pool_cents, and 0 <= donor_fund_remaining_cents <= donor_fund_pool_cents, after EVERY adjudication, denial and reversal"
    inputs:
      - "DonorCostClaim.fund_part_cents and status"
      - "TransplantProgram.donor_fund_pool_cents"
    precision: "integer cents; no rounding"
    boundary_semantics: "a REVERSED claim leaves the sum entirely, restoring the pool exactly - reversal must not leave residue, and a DENIED claim never entered the sum in the first place"
    examples:
      - "pool 5000000; adjudicate a claim with fund_part 300000 -> committed 300000, remaining 4700000 (sum 5000000)"
      - "reverse that claim -> committed 0, remaining 5000000 (sum 5000000, no drift)"
      - "pool 5000000; adjudicate fund_part 300000 then fund_part 200000 -> committed 500000, remaining 4500000; reverse the first -> committed 200000, remaining 4800000"

  - name: chain_commitment_conservation
    applies_to: "ExchangeChain.committed_donor_count, DonorCandidate.overall_status, OperatingRoom.reserved_minutes_total"
    algorithm_type: aggregation
    formula: |
      # per chain
      committed_donor_count = count of DISTINCT donor_candidate_id over the chain's segments
                              with status != WITHDRAWN AND created_at <= chain.committed_at,
                              when chain.status IN {COMMITTED, EXECUTING};
                              0 for every other chain status
      # per operating room
      reserved_minutes_total = sum of duration_minutes over that room's ProcedureBooking rows
                               with status IN {ACTIVE, COMPLETED}
    invariants:
      - "sum of committed_donor_count over all chains of a program == count of that program's DonorCandidate rows with overall_status == CHAIN_COMMITTED"
      - "OperatingRoom.reserved_minutes_total == sum of duration_minutes over its ACTIVE and COMPLETED bookings; a CANCELLED booking must have been subtracted exactly once"
    inputs:
      - "ChainSegment.status and donor_candidate_id; ExchangeChain.status"
      - "ProcedureBooking.duration_minutes and status"
    precision: "integer counts and whole minutes"
    boundary_semantics: "breaking a chain must release every one of its committed donors and zero committed_donor_count in the same request, so the two sides of the invariant never disagree mid-flight; a COMPLETED chain also reports 0"
    examples:
      - "commit a 3-segment chain of distinct donors -> committed_donor_count 3 and exactly 3 donors at CHAIN_COMMITTED"
      - "break that chain -> committed_donor_count 0 and 0 donors at CHAIN_COMMITTED (each released to APPROVED or CONDITIONAL_APPROVED per stored final_risk_index)"
      - "book 240 minutes then 180 minutes in one room -> reserved_minutes_total 420; cancel the 240 booking -> 180"
      - "complete a segment whose 240-minute booking moves ACTIVE -> COMPLETED -> reserved_minutes_total unchanged at 420"

  - name: compliance_posture
    applies_to: TransplantProgram.compliance_posture
    algorithm_type: constraint_propagation
    formula: |
      unanswered_flagged = exists a ProgramOutcomeReview of this program with
                           status == FINALIZED AND flag_level == FLAGGED AND
                           no ImprovementPlan of that review has status IN {ACCEPTED, CLOSED}
      open_watch = exists a ProgramOutcomeReview of this program with
                   status == FINALIZED AND flag_level == WATCH AND
                   no ImprovementPlan of that review has status == CLOSED
      if unanswered_flagged:                                          FROZEN
      elif follow_up_compliance_pct < program.follow_up_compliance_threshold_pct
           or open_watch
           or cit_breach_count >= CIT_BREACH_RESTRICT_COUNT:           RESTRICTED
      else:                                                            OPEN
    constants:
      CIT_BREACH_RESTRICT_COUNT: 2
    gating:
      - "FROZEN blocks POST /donor-candidates (ERR_PROGRAM_FROZEN) and POST /exchange-chains/{id}/commitment (ERR_PROGRAM_FROZEN)"
      - "RESTRICTED blocks commitment of a chain whose segment_count > 2 (ERR_PROGRAM_RESTRICTED) but allows 2-segment chains"
      - "entering FROZEN suspends every DRAFT/VALIDATED chain of the program; leaving FROZEN restores every SUSPENDED chain to VALIDATED"
    inputs:
      - "ProgramOutcomeReview.status, flag_level and its ImprovementPlan rows"
      - "TransplantProgram.follow_up_compliance_pct, follow_up_compliance_threshold_pct, cit_breach_count"
    precision: "enum derivation, recomputed inside the same request as any contributing change"
    boundary_semantics: "the compliance comparison is strict <: exactly 75.00 against a 75 threshold stays OPEN. cit_breach_count == 1 stays OPEN; == 2 degrades to RESTRICTED. FROZEN always wins over RESTRICTED."
    examples:
      - "no finalized review, compliance 100.00, 0 breaches -> OPEN"
      - "compliance 74.99 -> RESTRICTED; compliance 75.00 -> OPEN"
      - "one FINALIZED FLAGGED review with no plan -> FROZEN even when compliance is 100.00"
      - "that review's plan ACCEPTED and compliance 100.00 with 0 breaches -> OPEN, and every SUSPENDED chain returns to VALIDATED"
      - "that review's plan REJECTED -> still FROZEN"
      - "one FINALIZED WATCH review with no CLOSED plan, compliance 100.00 -> RESTRICTED"
      - "2 cit_breach segments, compliance 100.00, no finalized review -> RESTRICTED"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST violated rule determines the response, so a request that breaks
#     several rules always reports the lowest-numbered one)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "both the X-User-ID and X-User-Role headers are present and non-empty on every request"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role names a declared role from §1.7 and that role is listed in the endpoint's roles; for an entity_backed role, X-User-ID must be the id of an is_active StaffMember whose staff_role matches the header's role"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id in the path exists, validated left-to-right: program -> staff member -> recipient -> donor -> evaluation -> chain -> segment -> room -> booking -> follow-up -> review -> plan -> claim"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_STAFF_NOT_FOUND | ERR_RECIPIENT_NOT_FOUND | ERR_DONOR_NOT_FOUND | ERR_EVALUATION_NOT_FOUND | ERR_CHAIN_NOT_FOUND | ERR_SEGMENT_NOT_FOUND | ERR_ROOM_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_FOLLOW_UP_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: business_constraint
    check: |
      Request shape: every field with source input and no default is present; enums hold a
      declared member; integers/numbers are of the right type and inside their declared range;
      cents fields are non-negative integers; datetimes are ISO-8601 UTC; end_at > start_at and
      period_end_on >= period_start_on and service_to_on >= service_from_on; lost_wage_days is
      present and >= 1 exactly when claim_type == LOST_WAGES; reason-code fields required by a
      transition are present (objection_reason_code, decline_reason_code, break_reason_code,
      waiver_reason_code, decision_reason_code, reversal_reason_code); limit is in [1,100] and
      offset is >= 0; observed_survivor_count <= cohort_size
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 5
    category: existence
    check: "every FK supplied in the request body exists (program_id, intended_recipient_id, referred_by_staff_id, advocate_staff_id, donor_candidate_id, recipient_candidate_id, reviewer_staff_id, exchange_chain_id, predecessor_segment_id, operating_room_id, chain_segment_id, surgeon_staff_id, program_outcome_review_id)"
    error_id: "the matching NOT_FOUND code from priority 3"
    http_status: 404
    applies_to: "all write endpoints that accept FK fields"

  - priority: 6
    category: business_constraint
    check: "expected_chain_version equals ExchangeChain.version on POST /exchange-chains/{id}/segments; expected_review_version equals ProgramOutcomeReview.version on POST /improvement-plans. Checked BEFORE any state or business rule, so a stale writer learns its view is out of date rather than being told about a state it may never have seen."
    error_id: "ERR_STALE_CHAIN_VERSION | ERR_STALE_REVIEW_VERSION"
    http_status: 412
    applies_to: "POST /exchange-chains/{id}/segments, POST /improvement-plans"

  - priority: 7
    category: auth
    check: "resource-scoped actor binding: X-User-ID must equal DonorCandidate.advocate_staff_id for consent-disclosure and advocacy-determination, and must equal DonorEvaluation.reviewer_staff_id for determination and resubmission"
    error_id: "ERR_NOT_ASSIGNED_ADVOCATE | ERR_NOT_ASSIGNED_REVIEWER"
    http_status: 403
    applies_to: "POST /donor-candidates/{id}/consent-disclosure, POST /donor-candidates/{id}/advocacy-determination, POST /donor-evaluations/{id}/determination, POST /donor-evaluations/{id}/resubmission"

  - priority: 8
    category: state
    check: "the requested transition exists in §1.2 for the target's current state, and no transition at all is accepted from a terminal state (DECLINED/TRANSPLANTED/REMOVED recipient, EXCLUDED/ADVOCATE_BLOCKED/DONATED donor, EXCLUDED evaluation, COMPLETED/BROKEN chain, WITHDRAWN/TRANSPLANTED segment, FINALIZED review, REJECTED/SUPERSEDED/CLOSED plan). Three endpoints are EXEMPT from this rule because priority 9 declares a domain-specific code for the very same target-state question, and the specific code must win: POST /donor-cost-claims/{id}/reversal (ERR_CLAIM_NOT_ADJUDICATED), POST /procedure-bookings/{id}/cancellation (ERR_BOOKING_NOT_ACTIVE), and POST /donor-follow-ups/{id}/submission and POST /donor-follow-ups/{id}/waiver (ERR_FOLLOW_UP_TERMINAL)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every state-changing endpoint"

  - priority: 9
    category: state
    check: "companion-entity state gates that are about the request's own target: the parent chain of an offered/completed segment is COMMITTED or EXECUTING (ERR_CHAIN_NOT_COMMITTED); the parent review of an improvement-plan decision is FINALIZED (ERR_REVIEW_NOT_FINALIZED); a reversal targets an ADJUDICATED claim (ERR_CLAIM_NOT_ADJUDICATED); a cancellation targets an ACTIVE booking (ERR_BOOKING_NOT_ACTIVE); a submission or waiver targets a follow-up whose status IN {DUE, INCOMPLETE, DELINQUENT} - a follow-up already in WAIVED or SUBMITTED_COMPLETE accepts neither (ERR_FOLLOW_UP_TERMINAL)"
    error_id: "ERR_CHAIN_NOT_COMMITTED | ERR_REVIEW_NOT_FINALIZED | ERR_CLAIM_NOT_ADJUDICATED | ERR_BOOKING_NOT_ACTIVE | ERR_FOLLOW_UP_TERMINAL"
    http_status: 409
    applies_to: "POST /chain-segments/{id}/offer, POST /chain-segments/{id}/transplant-completion, POST /improvement-plans/{id}/transitions, POST /donor-cost-claims/{id}/reversal, POST /procedure-bookings/{id}/cancellation, POST /donor-follow-ups/{id}/submission, POST /donor-follow-ups/{id}/waiver"

  - priority: 10
    category: business_safety
    check: "role-type fitness of a referenced staff member: an assigned advocate must have staff_role LIVING_DONOR_ADVOCATE, an evaluation's reviewer must have staff_role EVALUATION_REVIEWER, a booking's surgeon must have staff_role SURGEON, and in every case is_active must be true"
    error_id: ERR_STAFF_ROLE_INVALID
    http_status: 422
    applies_to: "POST /donor-candidates/{id}/advocate-assignment, POST /donor-evaluations, POST /procedure-bookings"

  - priority: 11
    category: business_safety
    check: "segregation of duties: when the donor has an intended_recipient_id, the proposed advocate may not already be the advocate_staff_id of a different DonorCandidate pointing at that same intended_recipient_id, because one advocate cannot independently represent two donors competing for the same recipient (ERR_ADVOCATE_CONFLICT_OF_INTEREST); the reviewer of a donor's PSYCHOSOCIAL evaluation may not be the reviewer of that donor's MEDICAL evaluation (ERR_REVIEWER_SOD_CONFLICT)"
    error_id: "ERR_ADVOCATE_CONFLICT_OF_INTEREST | ERR_REVIEWER_SOD_CONFLICT"
    http_status: 422
    applies_to: "POST /donor-candidates/{id}/advocate-assignment, POST /donor-evaluations"

  - priority: 12
    category: business_safety
    check: "informed-consent safety: attestation requires current logical clock >= cooling_off_ends_at (ERR_COOLING_OFF_NOT_ELAPSED) and both medical_status and psychosocial_status == CLEARED (ERR_CLEARANCE_INCOMPLETE); a CLEARED determination is refused while the evaluation's hard_exclusion_count > 0 (ERR_HARD_EXCLUSION_PRESENT)"
    error_id: "ERR_COOLING_OFF_NOT_ELAPSED | ERR_CLEARANCE_INCOMPLETE | ERR_HARD_EXCLUSION_PRESENT"
    http_status: 422
    applies_to: "POST /donor-candidates/{id}/advocacy-determination, POST /donor-evaluations/{id}/determination"

  - priority: 13
    category: business_safety
    check: "program compliance posture gate: compliance_posture == FROZEN blocks donor referral and chain commitment (ERR_PROGRAM_FROZEN); compliance_posture == RESTRICTED blocks commitment of a chain whose segment_count > 2 (ERR_PROGRAM_RESTRICTED)"
    error_id: "ERR_PROGRAM_FROZEN | ERR_PROGRAM_RESTRICTED"
    http_status: 409
    applies_to: "POST /donor-candidates, POST /exchange-chains/{id}/commitment"

  - priority: 14
    category: business_referential
    check: "participant eligibility: every segment donor of a chain being validated or committed has overall_status == APPROVED (ERR_DONOR_NOT_APPROVED - CONDITIONAL_APPROVED is explicitly not enough); every segment recipient has listing_status == ACTIVE (ERR_RECIPIENT_NOT_ACTIVE); an offered segment's donor is CHAIN_COMMITTED (ERR_DONOR_NOT_COMMITTED); a cost claim's donor has overall_status == DONATED (ERR_DONOR_NOT_DONATED)"
    error_id: "ERR_DONOR_NOT_APPROVED | ERR_RECIPIENT_NOT_ACTIVE | ERR_DONOR_NOT_COMMITTED | ERR_DONOR_NOT_DONATED"
    http_status: 422
    applies_to: "POST /exchange-chains/{id}/validation, POST /exchange-chains/{id}/commitment, POST /chain-segments/{id}/offer, POST /donor-cost-claims, POST /donor-cost-claims/{id}/adjudication"

  - priority: 15
    category: business_referential
    check: "single-program containment: every FK in one request must resolve to the same TransplantProgram - staff member, recipient, donor, chain, segment, room, review and claim may not be mixed across programs"
    error_id: ERR_CROSS_PROGRAM_REFERENCE
    http_status: 422
    applies_to: "all write endpoints that accept more than one FK"

  - priority: 16
    category: business_constraint
    check: "chain topology (calculations.chain_topology): segment_count >= 2 (ERR_CHAIN_TOO_SHORT); positions are contiguous 1..segment_count (ERR_CHAIN_POSITIONS_NOT_CONTIGUOUS); predecessor linkage is exactly the previous position and the position-1 segment has none (ERR_CHAIN_LINKAGE_BROKEN); no donor and no recipient repeats within the chain (ERR_DUPLICATE_PARTICIPANT); every segment is ABO-compatible (ERR_ABO_INCOMPATIBLE); PAIRED_LOOP closes (ERR_LOOP_NOT_CLOSED); NDD_CHAIN starts with a non-directed donor and does not close (ERR_NDD_START_INVALID)"
    error_id: "ERR_CHAIN_TOO_SHORT | ERR_CHAIN_POSITIONS_NOT_CONTIGUOUS | ERR_CHAIN_LINKAGE_BROKEN | ERR_DUPLICATE_PARTICIPANT | ERR_ABO_INCOMPATIBLE | ERR_LOOP_NOT_CLOSED | ERR_NDD_START_INVALID"
    http_status: 422
    applies_to: "POST /exchange-chains/{id}/validation - the whole topology is judged once, as a set, so segment insertion stays free to build an intermediate shape that is not yet valid"

  - priority: 17
    category: business_constraint
    check: "uniqueness: TransplantProgram.center_code is globally unique (ERR_DUPLICATE_CENTER_CODE); StaffMember.npi is unique within a program (ERR_DUPLICATE_NPI); OperatingRoom.room_code is unique within a program (ERR_DUPLICATE_ROOM_CODE); a chain has at most one non-WITHDRAWN segment per position (ERR_POSITION_TAKEN); a donor has at most one DonorEvaluation per domain in status SUBMITTED (ERR_DUPLICATE_OPEN_EVALUATION); a program has at most one FINALIZED ProgramOutcomeReview per (period_start_on, period_end_on) pair (ERR_DUPLICATE_REVIEW_PERIOD)"
    error_id: "ERR_DUPLICATE_CENTER_CODE | ERR_DUPLICATE_NPI | ERR_DUPLICATE_ROOM_CODE | ERR_POSITION_TAKEN | ERR_DUPLICATE_OPEN_EVALUATION | ERR_DUPLICATE_REVIEW_PERIOD"
    http_status: 409
    applies_to: "POST /programs, POST /staff-members, POST /operating-rooms, POST /exchange-chains/{id}/segments, POST /donor-evaluations, POST /outcome-reviews/{id}/finalization"

  - priority: 18
    category: business_temporal
    check: "operating-room occupancy with turnover buffer, evaluated over that room's ACTIVE bookings only: reject when new.start_at < existing.end_at + turnover_buffer_minutes AND new.end_at + turnover_buffer_minutes > existing.start_at (half-open windows: a booking that starts exactly buffer minutes after another ends is accepted)"
    error_id: ERR_OR_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /procedure-bookings"

  - priority: 19
    category: business_temporal
    check: "surgeon availability, evaluated over that surgeon's ACTIVE bookings in any room with NO buffer and CLOSED intervals: reject when new.start_at <= existing.end_at AND new.end_at >= existing.start_at (touching endpoints collide, unlike the room rule)"
    error_id: ERR_SURGEON_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /procedure-bookings"

  - priority: 20
    category: business_temporal
    check: "cold-ischemia planning: an offered segment needs an ACTIVE DONOR_RECOVERY booking whose [start_at, end_at) window contains planned_cross_clamp_at (ERR_DONOR_BOOKING_MISSING); a completion needs an ACTIVE RECIPIENT_IMPLANT booking (ERR_IMPLANT_BOOKING_MISSING); when predecessor_segment_id is set, planned_cross_clamp_at >= the predecessor's planned_reperfusion_at (ERR_PREDECESSOR_TIMING_INVALID)"
    error_id: "ERR_DONOR_BOOKING_MISSING | ERR_IMPLANT_BOOKING_MISSING | ERR_PREDECESSOR_TIMING_INVALID"
    http_status: 422
    applies_to: "POST /chain-segments/{id}/offer, POST /chain-segments/{id}/transplant-completion"

  - priority: 21
    category: business_temporal
    check: "clock-relative windows: an offer response is refused after offer_response_deadline_at (ERR_OFFER_WINDOW_EXPIRED); a follow-up submission is refused before due_on (ERR_FOLLOW_UP_NOT_DUE); a waitlist status update's effective_at must be >= the candidate's latest WaitlistStatusEvent.effective_at and <= the current logical clock (ERR_EFFECTIVE_AT_OUT_OF_ORDER); POST /_clock/set_current_utc may not move the clock backwards (ERR_CLOCK_NOT_MONOTONIC)"
    error_id: "ERR_OFFER_WINDOW_EXPIRED | ERR_FOLLOW_UP_NOT_DUE | ERR_EFFECTIVE_AT_OUT_OF_ORDER | ERR_CLOCK_NOT_MONOTONIC"
    http_status: 422
    applies_to: "POST /chain-segments/{id}/offer-response, POST /donor-follow-ups/{id}/submission, POST /recipient-candidates/{id}/status-updates, POST /_clock/set_current_utc"

  - priority: 22
    category: business_constraint
    check: "aggregate ischemia budgets (calculations.cold_ischemia_time): this segment's planned_cit_minutes <= MAX_CIT_MINUTES (ERR_CIT_LIMIT_EXCEEDED), then the chain's other offered/accepted/transplanted segments plus this one <= CHAIN_CIT_BUDGET_MINUTES (ERR_CHAIN_CIT_BUDGET_EXCEEDED). The per-segment check runs first, so a single over-long segment reports its own error even when the chain budget is also blown."
    error_id: "ERR_CIT_LIMIT_EXCEEDED | ERR_CHAIN_CIT_BUDGET_EXCEEDED"
    http_status: 422
    applies_to: "POST /chain-segments/{id}/offer"

  - priority: 23
    category: business_constraint
    check: "improvement plans may only be filed against a review that asked for one: the parent ProgramOutcomeReview.flag_level must be WATCH or FLAGGED"
    error_id: ERR_PLAN_NOT_REQUIRED
    http_status: 422
    applies_to: "POST /improvement-plans"

  - priority: 24
    category: business_fiscal
    check: "donor lifetime reimbursement headroom: DONOR_LIFETIME_CAP_CENTS minus the donor's already-ADJUDICATED total must be > 0 at adjudication time; when it is 0 the claim cannot be approved at all (a partially fundable claim is approved with unfunded_cents recording the shortfall - only a zero-headroom claim is an error)"
    error_id: ERR_DONOR_LIFETIME_CAP_REACHED
    http_status: 422
    applies_to: "POST /donor-cost-claims/{id}/adjudication"

# =============================================================================
# 1.5 API Endpoint Table
#   Path convention: flat top-level collections (api_prefix is empty).
#   33 write endpoints + 21 read endpoints. Every read exists either to expose a
#   computed field a test must assert or to satisfy FK reverse-reachability.
# =============================================================================
endpoints:
  # --- program setup -------------------------------------------------------
  - method: POST
    path: "/programs"
    description: "Register a transplant program with its cooling-off, completeness, survival and donor-fund policy configuration"
    roles: [ProgramAdmin]
    code: 201
    input: [name, center_code, "organ_type?", "cooling_off_days?", "follow_up_completeness_threshold_pct?", "follow_up_compliance_threshold_pct?", "expected_one_year_survival_rate?", "donor_fund_pool_cents?", "lost_wage_daily_cap_cents?", "lost_wage_weekly_cap_cents?"]
    output: TransplantProgram
    side_effects:
      - "compliance_posture initialised to OPEN; follow_up_compliance_pct to 100 (vacuous, no follow-up is due)"
      - "donor_fund_committed_cents 0 and donor_fund_remaining_cents = donor_fund_pool_cents (calculations.donor_fund_ledger)"

  - method: POST
    path: "/programs/{id}/compliance-sweep"
    description: "Advance follow-up delinquency and re-derive program compliance figures against the current logical clock"
    roles: [QualityOfficer, ProgramAdmin]
    code: 200
    input: []
    output: TransplantProgram
    side_effects:
      - "every DonorFollowUp of the program in status DUE or INCOMPLETE whose due_on + DELINQUENCY_GRACE_DAYS has passed moves to DELINQUENT"
      - "recomputes follow_up_compliance_pct (calculations.program_follow_up_compliance) and cit_breach_count"
      - "re-derives compliance_posture (calculations.compliance_posture) with its chain suspend/restore cascade"
      - "sets last_sweep_at to the current logical clock and increments version"

  - method: POST
    path: "/staff-members"
    description: "Add a staff member in one of the five center roles"
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, full_name, staff_role, npi, "is_active?"]
    output: StaffMember
    side_effects:
      - "npi uniqueness enforced within the program"

  - method: POST
    path: "/operating-rooms"
    description: "Register an operating room with its turnover buffer"
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, room_code, "turnover_buffer_minutes?"]
    output: OperatingRoom
    side_effects:
      - "reserved_minutes_total initialised to 0"

  # --- recipient candidacy and waitlist ------------------------------------
  - method: POST
    path: "/recipient-candidates"
    description: "Open a recipient candidacy workup"
    roles: [TransplantCoordinator]
    code: 201
    input: [program_id, mrn, abo_blood_type, age_years, cpra, "dialysis_years?", "medical_urgency_points?"]
    output: RecipientCandidate
    side_effects:
      - "listing_status starts at WORKUP; active_days_total 0; waitlist_priority_score computed with zero waiting time (calculations.waitlist_priority_score)"

  - method: POST
    path: "/recipient-candidates/{id}/status-updates"
    description: "Drive the candidacy/waitlist state machine (approval, registration, hold, resumption, decline, removal) and append an immutable waitlist event"
    roles: [TransplantCoordinator]
    code: 200
    input: [to_status, reason_code, effective_at]
    output: RecipientCandidate
    side_effects:
      - "appends an immutable WaitlistStatusEvent with from_status, to_status, reason_code, effective_at and actor_user_id = X-User-ID"
      - "on the first approval, sets candidacy_approved_by_staff_id = X-User-ID"
      - "on the first ACTIVE, sets registered_at"
      - "recomputes active_days_total (calculations.waitlist_active_days) and waitlist_priority_score"
      - "on INACTIVE_HOLD, reverts this candidate's OFFER_SENT segments to PLANNED"
      - "on REMOVED, withdraws this candidate's live segments and breaks their chains with the full compensating cascade"
      - "increments version"

  # --- donor referral, advocacy and consent --------------------------------
  - method: POST
    path: "/donor-candidates"
    description: "Refer a living donor candidate, directed (intended_recipient_id set) or non-directed (null)"
    roles: [TransplantCoordinator]
    code: 201
    input: [program_id, "intended_recipient_id?", mrn, abo_blood_type, age_years]
    output: DonorCandidate
    side_effects:
      - "referred_by_staff_id = X-User-ID (the referring coordinator, recorded for provenance)"
      - "overall_status REFERRED, advocacy_status UNASSIGNED, medical_status and psychosocial_status PENDING"
      - "refused with ERR_PROGRAM_FROZEN while the program's compliance_posture is FROZEN"

  - method: POST
    path: "/donor-candidates/{id}/advocate-assignment"
    description: "Assign the independent living donor advocate, enforcing segregation of duties against the referrer and the paired recipient's approver"
    roles: [ProgramAdmin]
    code: 200
    input: [advocate_staff_id]
    output: DonorCandidate
    side_effects:
      - "sets advocate_staff_id and advocacy_status = ASSIGNED"
      - "increments version"

  - method: POST
    path: "/donor-candidates/{id}/consent-disclosure"
    description: "Record an informed-consent disclosure session, opening (or reopening) the cooling-off window"
    roles: [DonorAdvocate]
    code: 200
    input: []
    output: DonorCandidate
    side_effects:
      - "disclosure_sequence += 1 and disclosure_at = current logical clock"
      - "cooling_off_ends_at recomputed by calculations.cooling_off_window (halved window from the second disclosure onward, extended for non-directed donors)"
      - "a re-disclosure clears attestation_at and final_risk_index and demotes overall_status to EVAL_IN_PROGRESS"
      - "increments version"

  - method: POST
    path: "/donor-candidates/{id}/advocacy-determination"
    description: "The advocate attests to voluntary informed consent, or objects and blocks the donation"
    roles: [DonorAdvocate]
    code: 200
    input: [outcome, "objection_reason_code?"]
    output: DonorCandidate
    side_effects:
      - "ATTESTED: sets attestation_at, computes final_risk_index (calculations.donor_risk_index variant final_index) and derives APPROVED or CONDITIONAL_APPROVED"
      - "OBJECTED: advocacy_status OBJECTED, overall_status ADVOCATE_BLOCKED, then the four-hop cascade withdrawing segments, breaking chains, releasing co-donors and cancelling bookings with OR minutes released"
      - "increments version"

  # --- donor medical / psychosocial evaluation ------------------------------
  - method: POST
    path: "/donor-evaluations"
    description: "Submit a medical or psychosocial donor evaluation; exclusion codes and risk points are screened on submission"
    roles: [EvaluationReviewer]
    code: 201
    input: [donor_candidate_id, domain, bmi, egfr_ml_min, systolic_bp, hba1c, "coercion_flag?", "unmanaged_substance_use?", "decisional_capacity_ok?", financial_hardship_score, social_support_score]
    output: DonorEvaluation
    side_effects:
      - "reviewer_staff_id = X-User-ID; the psychosocial reviewer may not be the same person as this donor's medical reviewer"
      - "computes exclusion_codes, hard_exclusion_count and risk_points (calculations.donor_exclusion_screen)"
      - "the donor's overall_status moves REFERRED -> EVAL_IN_PROGRESS on the first evaluation"

  - method: POST
    path: "/donor-evaluations/{id}/determination"
    description: "Record the reviewer's determination, mirroring it into the donor's matching clinical dimension"
    roles: [EvaluationReviewer]
    code: 200
    input: [outcome]
    output: DonorEvaluation
    side_effects:
      - "CLEARED is refused while hard_exclusion_count > 0"
      - "mirrors CLEARED / DEFERRED / EXCLUDED into DonorCandidate.<domain>_status, and copies risk_points into <domain>_risk_points on CLEARED"
      - "DEFERRED increments DonorCandidate.deferral_count"
      - "recomputes screening_risk_index (calculations.donor_risk_index variant screening_index) and re-derives overall_status"
      - "EXCLUDED fires the donor exclusion cascade over segments and chains"
      - "increments version"

  - method: POST
    path: "/donor-evaluations/{id}/resubmission"
    description: "Resubmit a deferred evaluation with updated findings, reopening it for determination"
    roles: [EvaluationReviewer]
    code: 200
    input: [bmi, egfr_ml_min, systolic_bp, hba1c, "coercion_flag?", "unmanaged_substance_use?", "decisional_capacity_ok?", financial_hardship_score, social_support_score]
    output: DonorEvaluation
    side_effects:
      - "status returns to SUBMITTED, submission_count += 1, determined_at cleared"
      - "re-screens exclusion_codes, hard_exclusion_count and risk_points"
      - "DonorCandidate.deferral_count is NOT reset - it permanently surcharges the final_index variant"
      - "increments version"

  # --- exchange chains ------------------------------------------------------
  - method: POST
    path: "/exchange-chains"
    description: "Open a paired-exchange loop or non-directed donor chain in DRAFT"
    roles: [TransplantCoordinator]
    code: 201
    input: [program_id, chain_type]
    output: ExchangeChain
    side_effects:
      - "segment_count 0, is_closed_loop false, total_planned_cit_minutes 0, committed_donor_count 0"

  - method: POST
    path: "/exchange-chains/{id}/segments"
    description: "Insert a donor->recipient segment at a position in the chain; guarded by optimistic concurrency on the chain's version"
    roles: [TransplantCoordinator]
    code: 201
    input: [expected_chain_version, position, donor_candidate_id, recipient_candidate_id, "predecessor_segment_id?"]
    output: ChainSegment
    side_effects:
      - "expected_chain_version must equal ExchangeChain.version or the write is refused with ERR_STALE_CHAIN_VERSION (412)"
      - "recomputes ExchangeChain.segment_count and is_closed_loop, and increments ExchangeChain.version so any other holder of the old version is now stale"
      - "segment starts in PLANNED"

  - method: POST
    path: "/exchange-chains/{id}/validation"
    description: "Validate the chain's topology, ABO compatibility and participant eligibility"
    roles: [TransplantCoordinator]
    code: 200
    input: []
    output: ExchangeChain
    side_effects:
      - "runs calculations.chain_topology end to end; sets status VALIDATED and validated_at on success"
      - "increments version"

  - method: POST
    path: "/exchange-chains/{id}/commitment"
    description: "Commit a validated chain, locking every participating donor"
    roles: [TransplantCoordinator]
    code: 200
    input: []
    output: ExchangeChain
    side_effects:
      - "gated by calculations.compliance_posture: FROZEN blocks any commitment, RESTRICTED blocks chains with segment_count > 2"
      - "status COMMITTED, committed_at set, committed_donor_count = distinct live donors"
      - "every participating donor moves APPROVED -> CHAIN_COMMITTED (calculations.chain_commitment_conservation)"
      - "increments version"

  - method: POST
    path: "/exchange-chains/{id}/break"
    description: "Break a chain and compensate every commitment it made"
    roles: [TransplantCoordinator]
    code: 200
    input: [break_reason_code]
    output: ExchangeChain
    side_effects:
      - "status BROKEN; live segments WITHDRAWN; committed donors released to APPROVED or CONDITIONAL_APPROVED per stored final_risk_index; committed_donor_count 0"
      - "ACTIVE bookings of the chain's segments CANCELLED with OperatingRoom.reserved_minutes_total decremented"
      - "increments version"

  # --- organ offers and logistics -------------------------------------------
  - method: POST
    path: "/chain-segments/{id}/offer"
    description: "Send the organ offer for a segment together with its cold-ischemia plan"
    roles: [TransplantCoordinator]
    code: 200
    input: [planned_cross_clamp_at, planned_reperfusion_at, planned_transport_minutes]
    output: ChainSegment
    side_effects:
      - "computes planned_cit_minutes (calculations.cold_ischemia_time variant planned_cit) and checks it against MAX_CIT_MINUTES, then the chain-wide CHAIN_CIT_BUDGET_MINUTES self-excluding sum"
      - "requires an ACTIVE DONOR_RECOVERY booking covering planned_cross_clamp_at"
      - "status OFFER_SENT, offer_sent_at set, offer_response_deadline_at = offer_sent_at + OFFER_RESPONSE_WINDOW_HOURS"
      - "recomputes ExchangeChain.total_planned_cit_minutes; increments version"

  - method: POST
    path: "/chain-segments/{id}/offer-response"
    description: "Accept or decline an outstanding organ offer inside the response window"
    roles: [TransplantCoordinator]
    code: 200
    input: [response, "decline_reason_code?"]
    output: ChainSegment
    side_effects:
      - "ACCEPT: status ACCEPTED, offer_responded_at set"
      - "DECLINE: status DECLINED, recipient offer_decline_count += 1, chain total_planned_cit_minutes recomputed; a DONOR_ORGAN_QUALITY decline additionally breaks the whole chain with its compensating cascade"
      - "increments version"

  - method: POST
    path: "/chain-segments/{id}/transplant-completion"
    description: "Record the realized recovery and implant times, closing out the segment"
    roles: [TransplantCoordinator]
    code: 200
    input: [actual_cross_clamp_at, actual_reperfusion_at]
    output: ChainSegment
    side_effects:
      - "computes actual_cit_minutes (calculations.cold_ischemia_time variant actual_cit) and cit_breach; a breach increments TransplantProgram.cit_breach_count and re-derives compliance_posture"
      - "donor CHAIN_COMMITTED -> DONATED with donated_at, which creates the SIX_MONTH / ONE_YEAR / TWO_YEAR DonorFollowUp rows and re-derives program follow-up compliance"
      - "recipient ACTIVE -> TRANSPLANTED with a WaitlistStatusEvent appended"
      - "ACTIVE bookings of this segment move to COMPLETED (OR minutes stay reserved)"
      - "chain COMMITTED -> EXECUTING, or EXECUTING -> COMPLETED when this was the last live segment"
      - "increments version"

  - method: POST
    path: "/procedure-bookings"
    description: "Book an operating room and surgeon for a segment's recovery or implant"
    roles: [TransplantCoordinator]
    code: 201
    input: [operating_room_id, chain_segment_id, surgeon_staff_id, booking_role, start_at, end_at]
    output: ProcedureBooking
    side_effects:
      - "room occupancy checked with half-open windows plus turnover_buffer_minutes on both sides; surgeon availability checked with closed windows and no buffer"
      - "duration_minutes computed; OperatingRoom.reserved_minutes_total incremented"

  - method: POST
    path: "/procedure-bookings/{id}/cancellation"
    description: "Cancel an active booking and release its reserved room minutes"
    roles: [TransplantCoordinator]
    code: 200
    input: [cancel_reason_code]
    output: ProcedureBooking
    side_effects:
      - "status CANCELLED; OperatingRoom.reserved_minutes_total decremented by duration_minutes exactly once (calculations.chain_commitment_conservation)"
      - "increments version"

  # --- donor follow-up ------------------------------------------------------
  - method: POST
    path: "/donor-follow-ups/{id}/submission"
    description: "Submit interval follow-up data for a donor; completeness decides whether the interval counts as met"
    roles: [TransplantCoordinator]
    code: 200
    input: [submitted_fields]
    output: DonorFollowUp
    side_effects:
      - "computes submitted_field_count over distinct non-empty names and completeness_pct (calculations.follow_up_completeness)"
      - "status SUBMITTED_COMPLETE at or above the program threshold, otherwise INCOMPLETE; submitted_at set"
      - "recomputes TransplantProgram.follow_up_compliance_pct and re-derives compliance_posture"
      - "increments version"

  - method: POST
    path: "/donor-follow-ups/{id}/waiver"
    description: "Waive a follow-up interval, removing it from both sides of the compliance ratio"
    roles: [ProgramAdmin]
    code: 200
    input: [waiver_reason_code]
    output: DonorFollowUp
    side_effects:
      - "status WAIVED; the row leaves both numerator and denominator of calculations.program_follow_up_compliance"
      - "recomputes TransplantProgram.follow_up_compliance_pct and re-derives compliance_posture"
      - "increments version"

  # --- outcome monitoring and improvement plans -----------------------------
  - method: POST
    path: "/outcome-reviews"
    description: "Create a program outcome review for a period, rating observed against expected survival"
    roles: [QualityOfficer]
    code: 201
    input: [program_id, period_start_on, period_end_on, cohort_size, observed_survivor_count]
    output: ProgramOutcomeReview
    side_effects:
      - "snapshots expected_survival_rate_used from the program and computes expected_survivor_count, oe_ratio, flag_level and requires_improvement_plan (calculations.outcome_oe_ratio)"
      - "status DRAFT - a draft review does not yet affect compliance_posture"

  - method: POST
    path: "/outcome-reviews/{id}/finalization"
    description: "Finalize a review so its flag level starts gating the program"
    roles: [QualityOfficer]
    code: 200
    input: []
    output: ProgramOutcomeReview
    side_effects:
      - "status FINALIZED, finalized_at set"
      - "re-derives compliance_posture: FLAGGED forces FROZEN, WATCH forces RESTRICTED"
      - "a FROZEN posture suspends DRAFT/VALIDATED chains, reverts their OFFER_SENT segments to PLANNED and cancels those segments' ACTIVE bookings with OR minutes released"
      - "increments version"

  - method: POST
    path: "/improvement-plans"
    description: "File an improvement plan against a flagged or watched review; guarded by optimistic concurrency on the review's version"
    roles: [QualityOfficer]
    code: 201
    input: [program_outcome_review_id, expected_review_version, title, milestone_count, target_completion_on]
    output: ImprovementPlan
    side_effects:
      - "expected_review_version must equal ProgramOutcomeReview.version or the write is refused with ERR_STALE_REVIEW_VERSION (412)"
      - "any SUBMITTED or REJECTED plan of the same review moves to SUPERSEDED"
      - "increments ProgramOutcomeReview.version so a competing writer holding the old version is now stale"

  - method: POST
    path: "/improvement-plans/{id}/transitions"
    description: "Accept, reject or close an improvement plan"
    roles: [ProgramAdmin]
    code: 200
    input: [action, "decision_reason_code?"]
    output: ImprovementPlan
    side_effects:
      - "ACCEPT / REJECT set decided_at and decision_reason_code; CLOSE sets closed_at"
      - "re-derives TransplantProgram.compliance_posture - ACCEPT lifts a FROZEN posture and restores every SUSPENDED chain to VALIDATED; CLOSE additionally clears a WATCH-driven RESTRICTED posture"
      - "increments version"

  # --- donor cost coverage --------------------------------------------------
  - method: POST
    path: "/donor-cost-claims"
    description: "File a donor cost claim (medical, travel or lost wages) with its estimated reimbursement"
    roles: [TransplantCoordinator]
    code: 201
    input: [donor_candidate_id, claim_type, coverage_source, submitted_amount_cents, "lost_wage_days?", service_from_on, service_to_on]
    output: DonorCostClaim
    side_effects:
      - "computes estimated_reimbursement_cents (calculations.donor_cost_reimbursement variant estimated) - LOST_WAGES applies the nested daily/weekly cap min"
      - "the donor must already be DONATED"

  - method: POST
    path: "/donor-cost-claims/{id}/adjudication"
    description: "Approve a claim through the insurance -> grant -> program-fund waterfall, or deny it"
    roles: [FinanceAdmin]
    code: 200
    input: [decision, "decision_reason_code?"]
    output: DonorCostClaim
    side_effects:
      - "APPROVE: fills insurance_part_cents, grant_part_cents and fund_part_cents in order and records unfunded_cents (calculations.donor_cost_reimbursement variant adjudicated)"
      - "APPROVE: TransplantProgram.donor_fund_committed_cents and donor_fund_remaining_cents move by fund_part_cents (calculations.donor_fund_ledger)"
      - "DENY: all parts 0, unfunded_cents = estimated_reimbursement_cents, program fund untouched"
      - "adjudicated_at and adjudicated_by_user_id recorded; increments version"

  - method: POST
    path: "/donor-cost-claims/{id}/reversal"
    description: "Reverse an adjudicated claim, returning its fund draw to the pool"
    roles: [FinanceAdmin]
    code: 200
    input: [reversal_reason_code]
    output: DonorCostClaim
    side_effects:
      - "status REVERSED; the claim leaves every aggregate: program fund, donor lifetime consumption and NLDAC pool consumption all drop by its parts"
      - "increments version"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock, used to elapse cooling-off windows, offer deadlines and follow-up due dates. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. The clock may only move forward."
    roles: [ProgramAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "every subsequent clock-relative rule (cooling_off_ends_at, offer_response_deadline_at, due_on, effective_at bounds) is evaluated against the new instant"
      - "no entity is mutated and no delinquency is swept: POST /programs/{id}/compliance-sweep does that explicitly"

  # --- reads (also the FK reverse-reachability surface) ----------------------
  - method: GET
    path: "/programs/{id}"
    description: "Read a program with its derived fund, compliance and posture figures"
