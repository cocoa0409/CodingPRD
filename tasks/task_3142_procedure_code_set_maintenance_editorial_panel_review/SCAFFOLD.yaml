scenario: "Procedure Code Set Maintenance & Editorial Panel Review (American Medical Association CPT): code change application intake from specialty societies, manufacturers and other stakeholders with clinical evidence requirements, advisory committee review and editorial panel meetings with public comment and voting on additions, revisions and deletions, category assignment across established codes, emerging technology tracking codes and performance measurement codes, code descriptor drafting with guideline and parenthetical instruction changes, annual release cycle with effective dates and errata publication, relative value recommendation process feeding payment systems through a separate committee, licensing of the code set to payers, vendors and providers with distribution restrictions, coding education, assistant publications and interpretation requests"
domain_name: "cpt-code-set-maintenance-editorial-panel"
api_prefix: "/cpt"
complexity_profile:
  primary_archetype: "Multi-party negotiation"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "optimistic_concurrency"
    - "cascading_side_effects"
    - "dual-variant_calculation"
    - "derived_field_reconciliation"
  entity_topology: "hybrid"
  state_machine_shape: "cyclic"
  relationship_patterns:
    - "one_to_many"
    - "self_referential"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: SpecialtySociety
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Medical specialty society legal name; unique across SpecialtySociety"
      - name: specialty_code
        type: string
        source: input
        description: "Society abbreviation such as ACS, ACR or AAN; unique across SpecialtySociety"
      - name: voting_seat_count
        type: integer
        source: input
        description: "Editorial panel voting seats this society holds"
        default: 0
        constraints: "integer >= 0; a value of 0 means the society is advisory only and carries no votes"
      - name: gpci_work
        type: number
        source: input
        description: "Geographic practice cost index applied to work RVUs"
        default: 1.0000
      - name: gpci_pe
        type: number
        source: input
        description: "Geographic practice cost index applied to practice-expense RVUs"
        default: 1.0000
      - name: gpci_mp
        type: number
        source: input
        description: "Geographic practice cost index applied to malpractice RVUs"
        default: 1.0000
      - name: cea_credit_balance
        type: number
        source: computed
        description: "Sum of cea_credits across CodeChange rows owned by this society that reached determination APPROVED; recomputed on every determination change"
      - name: status
        type: enum
        source: input
        description: "Society standing with the editorial panel"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: ChangeApplicant
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Applicant organization or individual name"
      - name: applicant_type
        type: enum
        source: input
        description: "Stakeholder class of the applicant"
        constraints: "PHYSICIAN | SPECIALTY_SOCIETY | MANUFACTURER | PAYER | HIT_VENDOR | OTHER"
      - name: society_id
        type: string
        source: input
        description: "FK -> SpecialtySociety.id; nullable; set when the applicant files on behalf of a seated specialty society"
      - name: is_entity_member
        type: boolean
        source: input
        description: "Whether the applicant holds a current member seat at an editorial panel meeting"
        default: false
      - name: dues_paid_current
        type: boolean
        source: input
        description: "Whether policyholder dues are paid through the current cycle; gates royalty fee eligibility"
        default: false
      - name: contact_email
        type: string
        source: input
        description: "Contact email for panel correspondence"
      - name: status
        type: enum
        source: input
        description: "Applicant standing"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: CodeChange
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Six-character descriptor number such as 99214 or 0X042; unique across CodeChange"
        constraints: "exactly 5 characters"
      - name: change_type
        type: enum
        source: input
        description: "Kind of change requested"
        constraints: "ADDITION | REVISION | DELETION"
      - name: category
        type: enum
        source: input
        description: "Code category assignment"
        constraints: "CATEGORY_I | CATEGORY_II | CATEGORY_III"
      - name: code_family
        type: string
        source: input
        description: "Descriptor prefix grouping related codes, such as 99 or 0X0"
      - name: applicant_id
        type: string
        source: input
        description: "FK -> ChangeApplicant.id; the stakeholder that filed the application"
      - name: society_id
        type: string
        source: input
        description: "FK -> SpecialtySociety.id; nullable; sponsoring society whose CEA credit balance is credited on approval"
      - name: clinical_evidence_tier
        type: enum
        source: input
        description: "Strength tier of the submitted clinical evidence"
        constraints: "TIER_I | TIER_II | TIER_III | TIER_IV"
      - name: evidence_sufficiency_index
        type: number
        source: input
        description: "Numeric sufficiency score derived by the applicant from its evidence packet"
        default: 0
      - name: procedure_volume_threshold
        type: integer
        source: input
        description: "US annual procedure volume relied on to justify the change"
      - name: organ_system_count
        type: integer
        source: input
        description: "Count of organ systems the code addresses; 1 means a single organ system"
        default: 1
      - name: descriptor_current
        type: string
        source: input
        description: "Current code descriptor text"
      - name: descriptor_proposed
        type: string
        source: input
        description: "Proposed replacement descriptor text"
      - name: guidelines
        type: string
        source: input
        description: "Guideline text accompanying the descriptor"
      - name: parenthetical_instructions
        type: string
        source: input
        description: "Parenthetical instruction text accompanying the descriptor"
      - name: cycles_in_process
        type: integer
        source: input
        description: "Editorial panel meetings this change has already been carried forward"
        default: 0
      - name: administrative_review_status
        type: enum
        source: system
        description: "Administrative completeness screening outcome"
        default: UNDER_ADMIN_REVIEW
        constraints: "UNDER_ADMIN_REVIEW | ADMIN_COMPLETE | ADMIN_RETURNED"
      - name: posting_state
        type: enum
        source: system
        description: "Whether the application has been posted and whether its comment window is open"
        default: NOT_POSTED
        constraints: "NOT_POSTED | POSTED | COMMENT_OPEN"
      - name: review_status
        type: enum
        source: system
        description: "Position of the change in the editorial workflow"
        default: DRAFT
        constraints: "DRAFT | WITHDRAWN | POSTED_FOR_COMMENT | ADMIN_REVIEW | AGENDA_SET | PANEL_REVIEW | REFERRED | DETERMINED"
      - name: meeting_id
        type: string
        source: system
        description: "FK -> EditorialPanelMeeting.id; nullable; meeting at which the change is docketed"
      - name: comment_period_open_at
        type: datetime
        source: system
        description: "Instant the public comment period opened"
      - name: comment_period_close_at
        type: datetime
        source: system
        description: "Instant the public comment period closes"
      - name: determination
        type: enum
        source: system
        description: "Panel disposition of the change"
        default: PENDING
        constraints: "PENDING | APPROVED | REFERRED_TO_JUNE_MINUTES | REJECTED | TABLED | WITHDRAWN"
      - name: held_for_full_panel
        type: boolean
        source: system
        description: "Set when the reference committee retained the change for full-panel action"
        default: false
      - name: cea_credits
        type: number
        source: computed
        description: "CEA credits awarded to the sponsoring society when determination becomes APPROVED; 0 for all other determinations"
        default: 0
      - name: verdict_recorded_at
        type: datetime
        source: system
        description: "Instant the panel disposition was recorded"
      - name: cycle_id
        type: string
        source: system
        description: "FK -> ReleaseCycle.id; nullable until the change is included in a release-cycle submission pool"
      - name: effective_date
        type: datetime
        source: system
        description: "January 1 of the target release year; stamped when the change enters a release-cycle pool"

  - name: AdvisoryCommitteeReview
    parent: null
    common_fields: true
    fields:
      - name: change_id
        type: string
        source: input
        description: "FK -> CodeChange.id; the change under advisory review"
      - name: committee_name
        type: enum
        source: input
        description: "Which standing committee is reviewing"
        constraints: "CPT_ADVISOR | CPT_ASSISTANT | HCPAC | RUC_HEALTH_CARE_PROFESSIONALS"
      - name: recommendation
        type: enum
        source: input
        description: "Committee recommendation carried to the panel"
        constraints: "RECOMMEND_APPROVE | RECOMMEND_REJECT | RECOMMEND_MODIFY"
      - name: quorum_met
        type: boolean
        source: input
        description: "Whether the committee achieved quorum"
        default: false
      - name: yes_votes
        type: integer
        source: input
        description: "Committee members voting in favour"
        default: 0
      - name: no_votes
        type: integer
        source: input
        description: "Committee members voting against"
        default: 0
      - name: vote_percent
        type: number
        source: computed
        description: "yes_votes / (yes_votes + no_votes) * 100, rounded half-up to 4 decimals"
      - name: decision
        type: enum
        source: system
        description: "Outcome of the advisory review"
        default: PENDING
        constraints: "PENDING | RECOMMENDED | DEEMED_NOT_RECOMMENDED"
      - name: review_status
        type: enum
        source: system
        description: "Lifecycle of the advisory review record"
        default: OPEN
        constraints: "OPEN | COMPLETE"
      - name: reviewed_at
        type: datetime
        source: system
        description: "Instant the review was completed"

  - name: EditorialPanelMeeting
    parent: null
    common_fields: true
    fields:
      - name: meeting_code
        type: string
        source: input
        description: "Meeting identifier such as FEB2026; unique across EditorialPanelMeeting"
      - name: meeting_month
        type: enum
        source: input
        description: "Month in which the meeting is held"
        constraints: "FEBRUARY | APRIL | JUNE | AUGUST | OCTOBER | DECEMBER"
      - name: meeting_status
        type: enum
        source: system
        description: "Position of the meeting in its own lifecycle"
        default: SCHEDULED
        constraints: "SCHEDULED | PUBLIC_COMMENT_OPEN | OPEN | RECESSED | CLOSED"
      - name: agenda_status
        type: enum
        source: system
        description: "Agenda state of the meeting"
        default: UNSET
        constraints: "UNSET | SET | ADDENDUM_OPEN"
      - name: quorum_present
        type: boolean
        source: system
        description: "Derived: true only while 0001A, 0002A and 0003A all carry state AGENDA_SET"
        default: false
      - name: citation_mode
        type: boolean
        source: input
        description: "Set when the meeting is conducted in citation-only mode"
        default: false
      - name: starts_at
        type: datetime
        source: input
        description: "Scheduled opening instant"
      - name: ends_at
        type: datetime
        source: input
        description: "Scheduled closing instant; must be at least 8 hours after starts_at"
      - name: public_comment_open_at
        type: datetime
        source: system
        description: "Instant the meeting's public comment window opened"
      - name: public_comment_close_at
        type: datetime
        source: system
        description: "Instant the meeting's public comment window closed"
      - name: weighted_yes
        type: number
        source: system
        description: "Sum of votes_carried over carried YES ballots at this meeting"
        default: 0
      - name: weighted_no
        type: number
        source: system
        description: "Sum of votes_carried over carried NO ballots at this meeting"
        default: 0
      - name: weighted_abstain
        type: number
        source: system
        description: "Sum of votes_carried over carried ABSTAIN ballots at this meeting"
        default: 0
      - name: conducted_at
        type: datetime
        source: system
        description: "Instant the meeting was closed and its determinations recorded"

  - name: PublicComment
    parent: null
    common_fields: true
    fields:
      - name: change_id
        type: string
        source: input
        description: "FK -> CodeChange.id; the posted change being commented on"
      - name: commenter_id
        type: string
        source: input
        description: "FK -> ChangeApplicant.id; the stakeholder filing the comment"
      - name: commenter_type
        type: enum
        source: input
        description: "Stakeholder class of the commenter at the time of filing"
        constraints: "SPECIALTY_SOCIETY | PAYER | MANUFACTURER | HIT_VENDOR | INDIVIDUAL"
      - name: citation_submitted
        type: boolean
        source: input
        description: "Whether published literature citations accompany the comment"
        default: false
      - name: body
        type: string
        source: input
        description: "Comment text"
      - name: posted_at
        type: datetime
        source: system
        description: "Instant the comment entered the docket"
      - name: withdrawn_at
        type: datetime
        source: system
        description: "Instant the comment was withdrawn; null while the comment stands"

  - name: EditorialVote
    parent: null
    common_fields: true
    fields:
      - name: change_id
        type: string
        source: input
        description: "FK -> CodeChange.id; the motion being voted on"
      - name: meeting_id
        type: string
        source: input
        description: "FK -> EditorialPanelMeeting.id; the meeting at which the ballot is cast"
      - name: society_id
        type: string
        source: input
        description: "FK -> SpecialtySociety.id; the seated society casting the ballot"
      - name: vote
        type: enum
        source: input
        description: "Ballot position"
        constraints: "YES | NO | ABSTAIN"
      - name: votes_carried
        type: number
        source: computed
        description: "Voting seats carried by the casting society; equal to that society's voting_seat_count as read at cast time"
      - name: cast_at
        type: datetime
        source: system
        description: "Instant the ballot was recorded"

  - name: RUCValueRecommendation
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Descriptor number under valuation"
      - name: code_value_id
        type: string
        source: input
        description: "FK -> CodeValue.id; nullable until the valuation is tied to a released code value"
      - name: work_rvu
        type: number
        source: input
        description: "Physician work RVU proposed by the recommending committee"
      - name: facility_pe_rvu
        type: number
        source: input
        description: "Facility practice-expense RVU"
      - name: nonfacility_pe_rvu
        type: number
        source: input
        description: "Nonfacility practice-expense RVU"
      - name: mp_rvu
        type: number
        source: input
        description: "Malpractice RVU"
      - name: survey_median_minutes
        type: number
        source: input
        description: "Median intraservice time from the specialty survey"
      - name: specialty_id
        type: string
        source: input
        description: "FK -> SpecialtySociety.id; the specialty whose GPCIs are applied"
      - name: conversion_factor_tier
        type: enum
        source: input
        description: "Conversion-factor tier applied by the valuation formula"
        constraints: "AMBULATORY | SURGICAL | DIAGNOSTIC"
      - name: status
        type: enum
        source: system
        description: "Position of the valuation in the recommending committee's own workflow"
        default: BEING_CONVENED
        constraints: "BEING_CONVENED | CONVENED | RECOMMENDED | FORWARDED"
      - name: recommendation_status
        type: enum
        source: system
        description: "Whether the committee reached a recommendation"
        default: PENDING
        constraints: "PENDING | RECOMMENDED | DEEMED_NOT_RECOMMENDED"
      - name: recommended_work_rvu
        type: number
        source: computed
        description: "Work RVU published by the committee; equals work_rvu for a RECOMMENDED valuation and the reference-committee median otherwise"
      - name: forward_status
        type: enum
        source: system
        description: "Whether the valuation has been forwarded to the payment systems"
        default: WITHHELD
        constraints: "WITHHELD | FORWARDED | RETAINED_FOR_RECONSIDERATION"
      - name: payability_status
        type: enum
        source: system
        description: "Whether payment systems may pay the code"
        default: NOT_PAYABLE
        constraints: "NOT_PAYABLE | PAYABLE_LOCKED"
      - name: effective_date
        type: datetime
        source: system
        description: "January 1 on which the valuation becomes payable"
      - name: vote_percent
        type: number
        source: computed
        description: "Committee support percentage, rounded half-up to 4 decimals"

  - name: CodeValue
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Descriptor number the value belongs to"
      - name: change_id
        type: string
        source: input
        description: "FK -> CodeChange.id; nullable when the value is created directly from a valuation"
      - name: release_id
        type: string
        source: input
        description: "FK -> ReleaseCycle.id; nullable until the value is bound to a release cycle"
      - name: work_rvu
        type: number
        source: input
        description: "Work RVU component"
      - name: facility_pe_rvu
        type: number
        source: input
        description: "Facility practice-expense RVU component"
      - name: nonfacility_pe_rvu
        type: number
        source: input
        description: "Nonfacility practice-expense RVU component"
      - name: mp_rvu
        type: number
        source: input
        description: "Malpractice RVU component"
      - name: conversion_factor
        type: number
        source: input
        description: "Dollar conversion factor applied to the summed adjusted RVUs"
        default: 32.99
      - name: specialty_id
        type: string
        source: input
        description: "FK -> SpecialtySociety.id; the specialty whose GPCIs are applied to this value"
      - name: rounding_variant
        type: enum
        source: input
        description: "Which rounding order governs the published totals"
        default: AGGREGATE_ROUNDING
        constraints: "COMPONENT_ROUNDING | AGGREGATE_ROUNDING"
      - name: facility_payment_cents
        type: integer
        source: computed
        description: "Facility total payment in cents under AGGREGATE_ROUNDING"
      - name: nonfacility_payment_cents
        type: integer
        source: computed
        description: "Nonfacility total payment in cents under AGGREGATE_ROUNDING"
      - name: component_round_total_cents
        type: integer
        source: computed
        description: "Facility total in cents when each adjusted-RVU dollar product is rounded before summing"
      - name: aggregate_round_total_cents
        type: integer
        source: computed
        description: "Facility total in cents when the adjusted-RVU sum is rounded once at the end"
      - name: dollar_split_shortfall_cents
        type: integer
        source: computed
        description: "nonfacility adjusted total minus the sum of facility and nonfacility rounded components"
      - name: release_month
        type: integer
        source: computed
        description: "Calendar month used as the proration numerator basis"
      - name: effective_date
        type: datetime
        source: system
        description: "January 1 of the release year"
      - name: value_status
        type: enum
        source: system
        description: "Lifecycle of the value record"
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUPERSEDED | RETAINED"
      - name: superseded_by_code_value_id
        type: string
        source: system
        description: "FK -> CodeValue.id; nullable; the later value row that supersedes this one when value_status is SUPERSEDED"

  - name: ErrataNotice
    parent: null
    common_fields: true
    fields:
      - name: code_value_id
        type: string
        source: input
        description: "FK -> CodeValue.id; the value being corrected"
      - name: errata_effective_date
        type: datetime
        source: input
        description: "Instant the correction takes effect; never earlier than the code value's effective_date"
      - name: prior_facility_payment_cents
        type: integer
        source: input
        description: "Audited facility payment published before the correction"
      - name: corrected_facility_payment_cents
        type: integer
        source: computed
        description: "Prorated facility payment from the errata effective date to the end of the release year"
      - name: proration_numerator_days
        type: integer
        source: computed
        description: "Days from errata_effective_date through the end of the release year, inclusive of both endpoints"
      - name: proration_denominator_days
        type: integer
        source: computed
        description: "Days from the code value's effective_date through the end of the release year, inclusive of both endpoints"
      - name: reason
        type: string
        source: input
        description: "Plain-language reason for the correction"
      - name: status
        type: enum
        source: system
        description: "Publication lifecycle of the notice"
        default: PROPOSED
        constraints: "PROPOSED | PUBLISHED | WITHDRAWN"
      - name: published_at
        type: datetime
        source: system
        description: "Instant the correction was published in the errata"

  - name: ReleaseCycle
    parent: null
    common_fields: true
    fields:
      - name: year
        type: integer
        source: input
        description: "Release year; unique across ReleaseCycle"
      - name: comment_open
        type: datetime
        source: input
        description: "January 1 instant the public comment period opens"
      - name: comment_close
        type: datetime
        source: input
        description: "Instant the public comment period closes; at least 30 days after comment_open"
      - name: addendum_comment_close
        type: datetime
        source: input
        description: "November 15 addendum comment close for the cycle"
      - name: meeting_ids
        type: array
        source: input
        description: "Ordered editorial panel meeting ids bounding the cycle; non-empty"
      - name: code_set_capacity
        type: integer
        source: input
        description: "Number of new descriptors the code set can absorb in this release"
      - name: submission_count
        type: integer
        source: computed
        description: "Count of CodeChange rows with cycle_id equal to this cycle's id"
      - name: editorial_reserved_codes
        type: integer
        source: computed
        description: "floor(code_set_capacity * 0.40) withheld for editorial panel discretion"
      - name: additions_pool_codes
        type: integer
        source: computed
        description: "min(140, floor(code_set_capacity * 0.35)) descriptors available to billable additions"
      - name: catiii_pool_codes
        type: integer
        source: computed
        description: "min(25, floor(code_set_capacity * 0.05)) descriptors available to emerging-technology tracking codes"
      - name: discretionary_codes
        type: integer
        source: computed
        description: "code_set_capacity minus the three pools, in that evaluation order"
      - name: budget_gate_status
        type: enum
        source: system
        description: "Whether the release may be published; EXHAUSTED once discretionary_codes falls below 40"
        default: OPEN
        constraints: "OPEN | EXHAUSTED"
      - name: single_floor_budgeting
        type: boolean
        source: input
        description: "Selects the single-floor pool variant where the three unbounded percentages are summed before flooring"
        default: false
      - name: released_at
        type: datetime
        source: system
        description: "Instant the code set was released"
      - name: errata_deadline
        type: datetime
        source: input
        description: "Latest instant at which an errata notice may take effect for this release"
        default: "2027-06-30"
      - name: cycle_status
        type: enum
        source: system
        description: "Lifecycle of the release cycle"
        default: PLANNING
        constraints: "PLANNING | OPEN | CLOSED | RELEASED"
      - name: effective_date
        type: datetime
        source: system
        description: "January 1 of year+1"
      - name: released_code_values
        type: array
        source: computed
        description: "Ids of CodeValue rows bound to this cycle, ordered by the code field ascending with created_at ascending as tie-break"

  - name: LicensingAgreement
    parent: null
    common_fields: true
    fields:
      - name: licensee_type
        type: enum
        source: input
        description: "Class of licensee"
        constraints: "PAYER | VENDOR | PROVIDER | EDUCATOR"
      - name: licensee_name
        type: string
        source: input
        description: "Licensee legal name"
      - name: payer_revenue_tier
        type: enum
        source: input
        description: "Revenue tier used by the payer royalty schedule"
        constraints: "TIER_1 | TIER_2 | TIER_3"
      - name: vendor_worldwide
        type: boolean
        source: input
        description: "Whether the vendor licence covers worldwide distribution"
        default: false
      - name: expected_users
        type: integer
        source: input
        description: "Count of end users declared by the licensee"
        default: 0
      - name: sales_unit_count
        type: integer
        source: input
        description: "Units subject to the per-unit fee schedule"
        default: 0
      - name: royalty_fee_cents
        type: integer
        source: computed
        description: "Per-unit royalty fee in cents from the published three-band schedule"
      - name: fee_threshold_gate_status
        type: enum
        source: system
        description: "Whether the licensee cleared the 4-unit fee threshold"
        default: PASS
        constraints: "PASS | BELOW_MINIMUM"
      - name: base_fee_cents
        type: integer
        source: input
        description: "Flat annual licence base fee before per-unit royalties"
        default: 0
      - name: territory_id
        type: string
        source: input
        description: "FK -> DistributionTerritory.id; nullable until a territory is assigned"
      - name: distribution_scope
        type: enum
        source: computed
        description: "INTERNAL_ONLY | US_ONLY | WORLDWIDE"
      - name: ancillary_publication_codes
        type: array
        source: computed
        description: "Ancillary item codes bundled with the licence; never entitled to a royalty fee"
      - name: agreement_status
        type: enum
        source: system
        description: "Lifecycle of the licence"
        default: DRAFT
        constraints: "DRAFT | ACTIVE | SUSPENDED | TERMINATED"
      - name: activated_at
        type: datetime
        source: system
        description: "Instant the licence activated"

  - name: DistributionTerritory
    parent: null
    common_fields: true
    fields:
      - name: territory_code
        type: string
        source: input
        description: "Territory identifier such as US-NORTHEAST; unique across DistributionTerritory"
      - name: method
        type: enum
        source: input
        description: "Distribution method requested for the territory"
        constraints: "DISTRIBUTION | SITE | REPRINT"
      - name: edi_payer_network
        type: boolean
        source: input
        description: "Whether the territory is licensed into the EDI payer network"
        default: false
      - name: metadata_schema_version
        type: string
        source: input
        description: "Electronic metadata schema version the territory requires"
        default: "2026.1"
      - name: can_license
        type: boolean
        source: computed
        description: "Method eligibility: true for SITE, false for DISTRIBUTION and REPRINT"
      - name: distribution_channel
        type: enum
        source: computed
        description: "EDI | PRINT_AND_ELECTRONIC | SITE, derived from method and edi_payer_network"
      - name: site_exception
        type: boolean
        source: computed
        description: "True when the SITE method is used, which suppresses EDI format requirements"
      - name: transaction_set_required
        type: boolean
        source: computed
        description: "True only when distribution_channel is EDI"
      - name: reserved_range
        type: object
        source: computed
        description: "{start, end} descriptor range pre-reserved for the territory while its method is ineligible"
      - name: territory_status
        type: enum
        source: system
        description: "Lifecycle of the territory"
        default: OPEN
        constraints: "OPEN | RESERVED | WITHDRAWN"
      - name: reserved_at
        type: datetime
        source: system
        description: "Instant the territory was reserved"
      - name: activation_details
        type: object
        source: computed
        description: "{electronic_format_required, media_required}; BOTH false when site_exception is true"

  - name: ContentDeliveryOrder
    parent: null
    common_fields: true
    fields:
      - name: license_id
        type: string
        source: input
        description: "FK -> LicensingAgreement.id; the licence entitling the delivery"
      - name: distribution_channel
        type: enum
        source: input
        description: "Channel requested for this delivery"
        constraints: "EDI | PRINT_AND_ELECTRONIC | SITE"
      - name: format_params
        type: object
        source: input
        description: "{electronic_format, media, version_qualifier, payer_identifier_qualifier}; version_qualifier is mandatory for EDI"
      - name: payer_identifier
        type: string
        source: input
        description: "Payer identifier required for EDI deliveries"
      - name: delivery_status
        type: enum
        source: system
        description: "Lifecycle position of the delivery order"
        default: PENDING
        constraints: "PENDING | RESERVED | READY | RELEASED | WITHDRAWN"
      - name: reserved_at
        type: datetime
        source: system
        description: "Instant the delivery slot was reserved"
      - name: ready_at
        type: datetime
        source: system
        description: "Instant the delivery became ready"
      - name: released_at
        type: datetime
        source: system
        description: "Instant the delivery was released"
      - name: activation_mode
        type: enum
        source: computed
        description: "ELECTRONIC | MEDIA | SITE, derived from the channel and format parameters"

  - name: CodingEducationActivity
    parent: null
    common_fields: true
    fields:
      - name: licensee_id
        type: string
        source: input
        description: "FK -> LicensingAgreement.id; the licensee delivering the education"
      - name: activity_code
        type: string
        source: input
        description: "Education activity identifier; unique across CodingEducationActivity"
      - name: clock_hours
        type: number
        source: input
        description: "Instructional clock hours delivered"
      - name: assistant_targeted
        type: boolean
        source: input
        description: "Whether the activity is delivered to the CPT Assistant population"
        default: false
      - name: cea_credits_awarded
        type: number
        source: computed
        description: "CEA credits: clock_hours/2 rounded UP to the nearest 1 decimal; 0.5 for any clock_hours at or below 1; capped at 2.0"
      - name: cea_credits_rounded
        type: number
        source: computed
        description: "cea_credits_awarded rounded to the nearest 10 credits, half-up"
      - name: activity_status
        type: enum
        source: system
        description: "Lifecycle of the education activity"
        default: REGISTERED
        constraints: "REGISTERED | COMPLETED"
      - name: completed_at
        type: datetime
        source: system
        description: "Instant the activity was completed"

  - name: InterpretationRequest
    parent: null
    common_fields: true
    fields:
      - name: requesting_licensee_id
        type: string
        source: input
        description: "FK -> LicensingAgreement.id; the licensee requesting an interpretation"
      - name: code
        type: string
        source: input
        description: "Descriptor number the question concerns"
      - name: question
        type: string
        source: input
        description: "Interpretation question text"
      - name: response_status
        type: enum
        source: system
        description: "Whether the request has been answered"
        default: PENDING
        constraints: "PENDING | ANSWERED"
      - name: entitlement_status
        type: enum
        source: system
        description: "Whether the requesting licence class is entitled to a written interpretation"
        default: NOT_ENTITLED
        constraints: "NOT_ENTITLED | ENTITLED"
      - name: answered_at
        type: datetime
        source: system
        description: "Instant the answer was recorded"

  - name: ReviewErratum
    parent: null
    common_fields: true
    fields:
      - name: original_notice_id
        type: string
        source: input
        description: "FK -> ErrataNotice.id; the published notice under review; makes the entity self-referential across the errata family"
      - name: review_outcome
        type: enum
        source: input
        description: "Whether the review upheld or reversed the original notice"
        constraints: "UPHELD | REVERSED"
      - name: corrected_proration_ratio
        type: number
        source: input
        description: "Replacement proration ratio applied when the outcome is REVERSED"
      - name: applied_status
        type: enum
        source: system
        description: "Whether the reversal was applied to the underlying notice"
        default: NONE
        constraints: "NONE | APPLIED | NOT_APPLICABLE"
      - name: review_status
        type: enum
        source: system
        description: "Lifecycle of the review record"
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: reviewed_at
        type: datetime
        source: system
        description: "Instant the review closed"

state_machines:
  - entity: CodeChange
    shape: compound_cyclic
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: WITHDRAWN
        trigger: "DELETE /cpt/code-changes/{id}"
        actor: ChangeApplicant
        preconditions:
          - "CodeChange.administrative_review_status IN {UNDER_ADMIN_REVIEW, ADMIN_COMPLETE}"
          - "CodeChange.cycle_id IS NULL"
        side_effects:
          - "CodeChange.determination set to WITHDRAWN; CodeChange.cea_credits recomputed by cea_credit_award (evaluates to 0)"
          - "cascade hop 2: when CodeChange.society_id IS NOT NULL, SpecialtySociety.cea_credit_balance recomputed by sponsoring_society_credit_balance"
      - from: DRAFT
        to: POSTED_FOR_COMMENT
        trigger: "POST /cpt/code-changes/{id}/postings"
        actor: EditorialStaff
        preconditions:
          - "CodeChange.administrative_review_status != ADMIN_RETURNED"
          - "CodeChange.cycle_id IS NOT NULL"
          - "CodeChange.comment_period_close_at - CodeChange.comment_period_open_at >= 30 days"
        side_effects:
          - "CodeChange.administrative_review_status set to ADMIN_COMPLETE"
          - "CodeChange.posting_state set to POSTED"
          - "CodeChange.comment_period_open_at and CodeChange.comment_period_close_at stamped from the request"
          - "cascade hop 2: CodeChange.posting_state set to COMMENT_OPEN by the posting follow-on, recomputed by comment_period_governance"
          - "ReviewErratum.applied_status remains NONE; no errata recalculation runs on posting"
      - from: POSTED_FOR_COMMENT
        to: WITHDRAWN
        trigger: "DELETE /cpt/code-changes/{id}"
        actor: ChangeApplicant
        preconditions:
          - "CodeChange.cycle_id IS NULL"
        side_effects:
          - "CodeChange.determination set to WITHDRAWN"
          - "All PublicComment rows for this change stamped withdrawn_at"
      - from: POSTED_FOR_COMMENT
        to: DRAFT
        trigger: "POST /cpt/code-changes/{id}/administrative-returns"
        actor: EditorialStaff
        preconditions:
          - "CodeChange.administrative_review_status == ADMIN_COMPLETE"
        side_effects:
          - "CodeChange.administrative_review_status set back to ADMIN_RETURNED"
          - "CodeChange.posting_state set to NOT_POSTED"
          - "Comment-period duration measured by comment_period_governance (evaluates to under 30 days) and stored on CodeChange"
      - from: POSTED_FOR_COMMENT
        to: ADMIN_REVIEW
        trigger: "system event: comment window close instant reached"
        actor: system
        preconditions:
          - "logical clock >= CodeChange.comment_period_close_at"
          - "CodeChange.posting_state == COMMENT_OPEN"
        side_effects:
          - "cascade hop 1: all PublicComment rows for this change stamped withdrawn_at IS NULL remain standing"
          - "cascade hop 2: CodeChange.posting_state set to POSTED by the comment-window closure"
          - "CodeChange.meeting_id set to the earliest meeting id whose EditorialPanelMeeting.meeting_status == SCHEDULED within CodeChange.cycle_id's ReleaseCycle.meeting_ids"
      - from: ADMIN_REVIEW
        to: AGENDA_SET
        trigger: "POST /cpt/meetings/{id}/agenda"
        actor: EditorialStaff
        preconditions:
          - "EditorialPanelMeeting.meeting_status IN {SCHEDULED, PUBLIC_COMMENT_OPEN}"
          - "CodeChange.administrative_review_status IN {UNDER_ADMIN_REVIEW, ADMIN_COMPLETE}"
        side_effects:
          - "CodeChange.meeting_id set to the meeting in the path"
          - "cascade hop 2: EditorialPanelMeeting.agenda_status set to SET by the agenda acceptance"
          - "cascade hop 3: EditorialPanelMeeting.quorum_present recomputed by meeting_quorum_derivation"
      - from: AGENDA_SET
        to: DRAFT
        trigger: "POST /cpt/code-changes/{id}/returns"
        actor: EditorialStaff
        preconditions:
          - "CodeChange.meeting_id IS NOT NULL"
          - "EditorialPanelMeeting.meeting_status IN {SCHEDULED, PUBLIC_COMMENT_OPEN}"
        side_effects:
          - "CodeChange.meeting_id cleared"
          - "EditorialPanelMeeting.agenda_status set back to UNSET"
      - from: AGENDA_SET
        to: PANEL_REVIEW
        trigger: "POST /cpt/meetings/{id}/openings"
        actor: EditorialPanelChair
        preconditions:
          - "EditorialPanelMeeting.agenda_status == SET"
          - "CodeChange.administrative_review_status IN {UNDER_ADMIN_REVIEW, ADMIN_COMPLETE}"
        side_effects:
          - "EditorialPanelMeeting.meeting_status set to OPEN"
          - "every CodeChange whose meeting_id equals this meeting and whose review_status == AGENDA_SET moves to PANEL_REVIEW"
          - "EditorialPanelMeeting.quorum_present recomputed by meeting_quorum_derivation"
      - from: PANEL_REVIEW
        to: REFERRED
        trigger: "POST /cpt/code-changes/{id}/referrals"
        actor: EditorialPanelChair
        preconditions:
          - "CodeChange.held_for_full_panel == false"
          - "AdvisoryCommitteeReview row for this change has review_status == COMPLETE"
        side_effects:
          - "CodeChange.held_for_full_panel set to true"
          - "CodeChange.determination set to REFERRED_TO_JUNE_MINUTES"
          - "cascade hop 2: CodeChange.cea_credits recomputed by cea_credit_award (evaluates to 0)"
          - "cascade hop 3: when CodeChange.society_id IS NOT NULL, SpecialtySociety.cea_credit_balance recomputed by sponsoring_society_credit_balance"
          - "EditorialPanelMeeting.meeting_status set to RECESSED"
      - from: PANEL_REVIEW
        to: DETERMINED
        trigger: "POST /cpt/code-changes/{id}/determinations"
        actor: EditorialPanelChair
        preconditions:
          - "CodeChange.held_for_full_panel == false"
          - "CodeChange.review_status == PANEL_REVIEW"
          - "EditorialPanelMeeting.quorum_present == true"
          - "determination in request IN {APPROVED, REJECTED, TABLED}"
        side_effects:
          - "CodeChange.determination set to the requested value; CodeChange.verdict_recorded_at stamped"
          - "cascade hop 2: CodeChange.cea_credits recomputed by cea_credit_award"
          - "cascade hop 3: when CodeChange.society_id IS NOT NULL, SpecialtySociety.cea_credit_balance recomputed by sponsoring_society_credit_balance"
          - "EditorialPanelMeeting.weighted_yes, weighted_no and weighted_abstain recomputed by panel_weighted_vote_tally"
      - from: REFERRED
        to: POSTED_FOR_COMMENT
        trigger: "POST /cpt/code-changes/{id}/supplementary-reports"
        actor: EditorialStaff
        preconditions:
          - "CodeChange.cycles_in_process <= 2"
          - "CodeChange.held_for_full_panel == true"
        side_effects:
          - "CodeChange.cycles_in_process incremented by 1"
          - "CodeChange.held_for_full_panel set to false"
          - "CodeChange.posting_state set to NOT_POSTED"
          - "cascade hop 2: CodeChange.posting_state set to COMMENT_OPEN by the supplementary posting, recomputed by comment_period_governance"
      - from: REFERRED
        to: DRAFT
        trigger: "POST /cpt/code-changes/{id}/returns"
        actor: EditorialStaff
        preconditions:
          - "CodeChange.cycles_in_process >= 3"
        side_effects:
          - "CodeChange.determination set back to PENDING"
          - "CodeChange.cea_credits recomputed by cea_credit_award (evaluates to 0)"
          - "CodeChange.held_for_full_panel set to false"
      - from: DETERMINED
        to: DRAFT
        trigger: "POST /cpt/code-changes/{id}/revert-to-draft"
        actor: EditorialStaff
        preconditions:
          - "CodeChange.determination IN {REFERRED_TO_JUNE_MINUTES, TABLED}"
          - "when CodeChange.determination == REFERRED_TO_JUNE_MINUTES, the EditorialPanelMeeting named by CodeChange.meeting_id has meeting_month == JUNE"
        side_effects:
          - "CodeChange.cycles_in_process incremented by 1"
          - "CodeChange.determination set to PENDING"
          - "cascade hop 2: CodeChange.cea_credits recomputed by cea_credit_award (evaluates to 0)"
          - "cascade hop 3: when CodeChange.society_id IS NOT NULL, SpecialtySociety.cea_credit_balance recomputed by sponsoring_society_credit_balance"

  - entity: EditorialPanelMeeting
    shape: parallel_dimensions
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    dimensions:
      - dimension: meeting_status
        initial: SCHEDULED
        terminal: [CLOSED]
      - dimension: agenda_status
        initial: UNSET
        terminal: []
    transitions:
      - dimension: meeting_status
        from: SCHEDULED
        to: PUBLIC_COMMENT_OPEN
        trigger: "POST /cpt/meetings/{id}/comment-windows"
        actor: EditorialStaff
        preconditions:
          - "EditorialPanelMeeting.public_comment_close_at - EditorialPanelMeeting.public_comment_open_at >= 30 days"
        side_effects:
          - "EditorialPanelMeeting.public_comment_open_at and public_comment_close_at stamped"
          - "cascade hop 2: every CodeChange whose CodeChange.meeting_id equals this meeting and whose review_status == ADMIN_REVIEW has its posting_state set to COMMENT_OPEN"
      - dimension: meeting_status
        from: PUBLIC_COMMENT_OPEN
        to: OPEN
        trigger: "POST /cpt/meetings/{id}/comment-closures"
        actor: EditorialStaff
        preconditions:
          - "logical clock >= EditorialPanelMeeting.public_comment_close_at"
        side_effects:
          - "cascade hop 2: every CodeChange whose CodeChange.meeting_id equals this meeting and whose review_status == ADMIN_REVIEW has its posting_state set to POSTED"
          - "EditorialPanelMeeting.quorum_present recomputed by meeting_quorum_derivation"
      - dimension: meeting_status
        from: PUBLIC_COMMENT_OPEN
        to: SCHEDULED
        trigger: "POST /cpt/meetings/{id}/comment-window-reversals"
        actor: EditorialStaff
        preconditions:
          - "no PublicComment row exists for any CodeChange docketed at this meeting"
        side_effects:
          - "EditorialPanelMeeting.public_comment_open_at and public_comment_close_at cleared"
      - dimension: meeting_status
        from: OPEN
        to: RECESSED
        trigger: "POST /cpt/meetings/{id}/recesses"
        actor: EditorialPanelChair
        preconditions:
          - "EditorialPanelMeeting.agenda_status == SET"
        side_effects:
          - "EditorialPanelMeeting.conducted_at left null; EditorialPanelMeeting.quorum_present recomputed by meeting_quorum_derivation"
      - dimension: meeting_status
        from: RECESSED
        to: OPEN
        trigger: "POST /cpt/meetings/{id}/reopenings"
        actor: EditorialPanelChair
        preconditions:
          - "EditorialPanelMeeting.agenda_status == ADDENDUM_OPEN"
        side_effects:
          - "EditorialPanelMeeting.quorum_present recomputed by meeting_quorum_derivation"
      - dimension: meeting_status
        from: OPEN
        to: CLOSED
        trigger: "POST /cpt/meetings/{id}/closures"
        actor: EditorialPanelChair
        preconditions:
          - "EditorialPanelMeeting.quorum_present == true"
          - "at least one CodeChange docketed at this meeting has review_status == DETERMINED"
        side_effects:
          - "EditorialPanelMeeting.conducted_at stamped with the logical clock"
          - "EditorialPanelMeeting.weighted_yes, weighted_no and weighted_abstain recomputed by panel_weighted_vote_tally"
      - dimension: meeting_status
        from: RECESSED
        to: CLOSED
        trigger: "POST /cpt/meetings/{id}/closures"
        actor: EditorialPanelChair
        preconditions:
          - "EditorialPanelMeeting.agenda_status == SET"
        side_effects:
          - "EditorialPanelMeeting.conducted_at stamped with the logical clock"
      - dimension: agenda_status
        from: UNSET
        to: SET
        trigger: "POST /cpt/meetings/{id}/agenda"
        actor: EditorialStaff
        preconditions:
          - "EditorialPanelMeeting.meeting_status IN {SCHEDULED, PUBLIC_COMMENT_OPEN}"
          - "request body carries at least one change_id"
        side_effects:
          - "each named CodeChange moved to AGENDA_SET"
          - "EditorialPanelMeeting.quorum_present recomputed by meeting_quorum_derivation"
      - dimension: agenda_status
        from: SET
        to: ADDENDUM_OPEN
        trigger: "POST /cpt/meetings/{id}/addenda"
        actor: EditorialStaff
        preconditions:
          - "EditorialPanelMeeting.meeting_status IN {OPEN, RECESSED}"
          - "logical clock <= ReleaseCycle.addendum_comment_close of the cycle naming this meeting"
        side_effects:
          - "EditorialPanelMeeting.quorum_present recomputed by meeting_quorum_derivation"
      - dimension: agenda_status
        from: ADDENDUM_OPEN
        to: SET
        trigger: "POST /cpt/meetings/{id}/addendum-closures"
        actor: EditorialStaff
        preconditions:
          - "EditorialPanelMeeting.meeting_status IN {OPEN, RECESSED}"
        side_effects:
          - "EditorialPanelMeeting.quorum_present recomputed by meeting_quorum_derivation"

  - entity: AdvisoryCommitteeReview
    shape: linear
    initial_state: OPEN
    terminal_states: [COMPLETE]
    transitions:
      - from: OPEN
        to: COMPLETE
        trigger: "POST /cpt/committee-reviews/{id}/decisions"
        actor: CommitteeReviewer
        preconditions:
          - "AdvisoryCommitteeReview.quorum_met == true"
          - "AdvisoryCommitteeReview.yes_votes + AdvisoryCommitteeReview.no_votes > 0"
          - "AdvisoryCommitteeReview.recommendation in request"
        side_effects:
          - "AdvisoryCommitteeReview.decision set to RECOMMENDED when vote_percent >= 66.0000, otherwise DEEMED_NOT_RECOMMENDED"
          - "AdvisoryCommitteeReview.vote_percent recomputed by committee_recommendation_vote"
          - "cascade hop 2: CodeChange.cea_credits recomputed by cea_credit_award for the reviewed change"
          - "cascade hop 3: when CodeChange.society_id IS NOT NULL, SpecialtySociety.cea_credit_balance recomputed by sponsoring_society_credit_balance"
          - "AdvisoryCommitteeReview.reviewed_at stamped"

  - entity: RUCValueRecommendation
    shape: cyclic
    initial_state: BEING_CONVENED
    terminal_states: [FORWARDED]
    transitions:
      - from: BEING_CONVENED
        to: CONVENED
        trigger: "POST /cpt/ruc-value-recommendations/{id}/votes"
        actor: CommitteeReviewer
        preconditions:
          - "RUCValueRecommendation.status == BEING_CONVENED"
          - "request carries yes_votes and no_votes whose sum is greater than 0"
        side_effects:
          - "RUCValueRecommendation.vote_percent recomputed by committee_recommendation_vote"
          - "RUCValueRecommendation.recommendation_status set to RECOMMENDED when vote_percent >= 66.0000, otherwise DEEMED_NOT_RECOMMENDED"
          - "RUCValueRecommendation.forward_status set to WITHHELD"
      - from: BEING_CONVENED
        to: BEING_CONVENED
        trigger: "POST /cpt/ruc-value-recommendations/{id}/refusals"
        actor: CommitteeReviewer
        preconditions:
          - "RUCValueRecommendation.status == BEING_CONVENED"
          - "RUCValueRecommendation.forward_status == WITHHELD"
        side_effects:
          - "RUCValueRecommendation.recommendation_status set to DEEMED_NOT_RECOMMENDED"
          - "RUCValueRecommendation.recommended_work_rvu recomputed by ruc_global_valuation_to_code_value"
          - "no CodeValue is created or mutated"
      - from: CONVENED
        to: RECOMMENDED
        trigger: "POST /cpt/ruc-value-recommendations/{id}/recommendations"
        actor: CommitteeReviewer
        preconditions:
          - "RUCValueRecommendation.recommendation_status == RECOMMENDED"
          - "RUCValueRecommendation.forward_status == WITHHELD"
          - "RUCValueRecommendation.effective_date IS NULL or logical clock < RUCValueRecommendation.effective_date"
        side_effects:
          - "cascade hop 1: CodeValue row upserted for RUCValueRecommendation.code with work_rvu, facility_pe_rvu, nonfacility_pe_rvu and mp_rvu copied from the recommendation"
          - "cascade hop 2: CodeValue.facility_payment_cents and CodeValue.nonfacility_payment_cents recomputed by code_value_dollar_split_proration"
          - "RUCValueRecommendation.status set to RECOMMENDED"
      - from: RECOMMENDED
        to: FORWARDED
        trigger: "POST /cpt/ruc-value-recommendations/{id}/forwards"
        actor: EditorialStaff
        preconditions:
          - "RUCValueRecommendation.effective_date IS NOT NULL"
          - "logical clock < RUCValueRecommendation.effective_date"
          - "RUCValueRecommendation.payability_status == NOT_PAYABLE"
        side_effects:
          - "RUCValueRecommendation.forward_status set to FORWARDED"
          - "RUCValueRecommendation.status set to FORWARDED"
          - "cascade hop 2: CodeValue.value_status set to ACTIVE when a CodeValue carries the same code"
          - "RUCValueRecommendation.payability_status set to PAYABLE_LOCKED"
      - from: FORWARDED
        to: BEING_CONVENED
        trigger: "POST /cpt/ruc-value-recommendations/{id}/reconsiderations"
        actor: EditorialStaff
        preconditions:
          - "RUCValueRecommendation.payability_status == PAYABLE_LOCKED"
          - "RUCValueRecommendation.effective_date IS NOT NULL"
          - "logical clock < RUCValueRecommendation.effective_date"
        side_effects:
          - "RUCValueRecommendation.forward_status set to RETAINED_FOR_RECONSIDERATION"
          - "RUCValueRecommendation.payability_status set back to NOT_PAYABLE"
          - "cascade hop 2: CodeValue.value_status set to RETAINED when a CodeValue carries the same code"
      - from: CONVENED
        to: FORWARDED
        trigger: "POST /cpt/ruc-value-recommendations/{id}/forwards"
        actor: EditorialStaff
        preconditions:
          - "RUCValueRecommendation.recommendation_status == DEEMED_NOT_RECOMMENDED"
          - "RUCValueRecommendation.effective_date IS NOT NULL"
          - "logical clock < RUCValueRecommendation.effective_date"
        side_effects:
          - "RUCValueRecommendation.forward_status set to FORWARDED"
          - "RUCValueRecommendation.status set to FORWARDED"
          - "cascade hop 2: CodeValue row upserted for RUCValueRecommendation.code with recommended_work_rvu as its work_rvu"
          - "cascade hop 3: CodeValue.value_status set to ACTIVE"

  - entity: ReleaseCycle
    shape: cyclic
    initial_state: PLANNING
    terminal_states: [RELEASED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: "POST /cpt/release-cycles/{id}/openings"
        actor: EditorialStaff
        preconditions:
          - "ReleaseCycle.comment_close - ReleaseCycle.comment_open >= 30 days"
          - "ReleaseCycle.meeting_ids is non-empty"
        side_effects:
          - "cascade hop 1: all membership CodeChange rows keep cycle_id null until submitted"
      - from: OPEN
        to: PLANNING
        trigger: "POST /cpt/release-cycles/{id}/returns"
        actor: EditorialStaff
        preconditions:
          - "ReleaseCycle.submission_count == 0"
        side_effects:
          - "ReleaseCycle.discretionary_codes recomputed by release_cycle_code_pool_allocation"
      - from: OPEN
        to: PLANNING
        trigger: "POST /cpt/release-cycles/{id}/submissions"
        actor: EditorialStaff
        preconditions:
          - "logical clock <= ReleaseCycle.comment_close"
        side_effects:
          - "each named CodeChange has cycle_id set to the path cycle"
          - "ReleaseCycle.submission_count recomputed by release_cycle_code_pool_allocation"
          - "cascade hop 2: ReleaseCycle.discretionary_codes recomputed by release_cycle_code_pool_allocation"
          - "cascade hop 3: ReleaseCycle.budget_gate_status set to EXHAUSTED when discretionary_codes < 40, otherwise OPEN"
          - "each named CodeChange.effective_date stamped to January 1 of ReleaseCycle.year + 1"
      - from: PLANNING
        to: CLOSED
        trigger: "POST /cpt/release-cycles/{id}/closures"
        actor: EditorialStaff
        preconditions:
          - "ReleaseCycle.submission_count > 0"
          - "logical clock >= ReleaseCycle.comment_close"
          - "ReleaseCycle.discretionary_codes >= 40"
        side_effects:
          - "ReleaseCycle.budget_gate_status recomputed to OPEN"
          - "ReleaseCycle.cycle_status set to CLOSED"
      - from: CLOSED
        to: RELEASED
        trigger: "POST /cpt/release-cycles/{id}/releases"
        actor: EditorialStaff
        preconditions:
          - "at least one CodeValue row carries release_id equal to this cycle"
          - "logical clock >= ReleaseCycle.comment_close"
        side_effects:
          - "ReleaseCycle.released_code_values recomputed by code_value_dollar_split_proration"
          - "every CodeValue bound to this cycle has value_status set to ACTIVE"
          - "ReleaseCycle.released_at stamped"

  - entity: ErrataNotice
    shape: linear
    initial_state: PROPOSED
    terminal_states: [PUBLISHED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: PUBLISHED
        trigger: "POST /cpt/errata-notices/{id}/publications"
        actor: EditorialStaff
        preconditions:
          - "ErrataNotice.errata_effective_date >= the effective_date of the CodeValue named by ErrataNotice.code_value_id"
          - "the CodeValue named by ErrataNotice.code_value_id has value_status == ACTIVE"
          - "ErrataNotice.errata_effective_date <= the errata_deadline of the ReleaseCycle carrying that code value"
          - "logical clock >= ErrataNotice.errata_effective_date"
        side_effects:
          - "cascade hop 1: ErrataNotice.corrected_facility_payment_cents recomputed by errata_proration_recalculation"
          - "cascade hop 2: ErrataNotice.proration_numerator_days and proration_denominator_days recomputed by errata_proration_recalculation"
          - "cascade hop 3: the CodeValue named by ErrataNotice.code_value_id has facility_payment_cents overwritten with corrected_facility_payment_cents"
          - "ErrataNotice.published_at stamped"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /cpt/errata-notices/{id}/withdrawals"
        actor: EditorialStaff
        preconditions:
          - "ErrataNotice.status == PROPOSED"
        side_effects:
          - "ErrataNotice.corrected_facility_payment_cents recomputed by errata_proration_recalculation and stored for audit"

  - entity: LicensingAgreement
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /cpt/licensing-agreements/{id}/activations"
        actor: LicensingOfficer
        preconditions:
          - "LicensingAgreement.territory_id IS NOT NULL"
          - "LicensingAgreement.fee_threshold_gate_status == PASS"
        side_effects:
          - "LicensingAgreement.royalty_fee_cents recomputed by license_royalty_schedule"
          - "LicensingAgreement.distribution_scope recomputed by license_territory_scope_derivation"
          - "LicensingAgreement.activated_at stamped"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /cpt/licensing-agreements/{id}/suspensions"
        actor: LicensingOfficer
        preconditions:
          - "LicensingAgreement.agreement_status == ACTIVE"
        side_effects:
          - "LicensingAgreement.distribution_scope recomputed by license_territory_scope_derivation and frozen at its last value"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /cpt/licensing-agreements/{id}/reactivations"
        actor: LicensingOfficer
        preconditions:
          - "LicensingAgreement.fee_threshold_gate_status == PASS"
        side_effects:
          - "LicensingAgreement.royalty_fee_cents recomputed by license_royalty_schedule"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /cpt/licensing-agreements/{id}/terminations"
        actor: LicensingOfficer
        preconditions:
          - "LicensingAgreement.agreement_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "cascade hop 1: every ContentDeliveryOrder carrying this license_id and delivery_status == RELEASED has delivery_status set to WITHDRAWN"
          - "cascade hop 2: LicensingAgreement.distribution_scope recomputed by license_territory_scope_derivation and fixed at INTERNAL_ONLY"
          - "cascade hop 3: LicensingAgreement.licensee territory row has DistributionTerritory.territory_status set to WITHDRAWN and can_license recomputed to false"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /cpt/licensing-agreements/{id}/terminations"
        actor: LicensingOfficer
        preconditions:
          - "LicensingAgreement.agreement_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "cascade hop 1: every ContentDeliveryOrder carrying this license_id and delivery_status == RELEASED has delivery_status set to WITHDRAWN"
          - "cascade hop 2: LicensingAgreement.distribution_scope recomputed by license_territory_scope_derivation and fixed at INTERNAL_ONLY"

  - entity: DistributionTerritory
    shape: cyclic
    initial_state: OPEN
    terminal_states: [WITHDRAWN]
    transitions:
      - from: OPEN
        to: RESERVED
        trigger: "POST /cpt/distribution-territories/{id}/reservations"
        actor: LicensingOfficer
        preconditions:
          - "DistributionTerritory.method IN {DISTRIBUTION, REPRINT}"
          - "DistributionTerritory.territory_status == OPEN"
        side_effects:
          - "DistributionTerritory.reserved_range recomputed with the next contiguous descriptor range"
          - "DistributionTerritory.can_license recomputed to false"
          - "DistributionTerritory.reserved_at stamped"
      - from: RESERVED
        to: OPEN
        trigger: "POST /cpt/distribution-territories/{id}/method-corrections"
        actor: LicensingOfficer
        preconditions:
          - "DistributionTerritory.reserved_at IS NOT NULL"
        side_effects:
          - "DistributionTerritory.method set to SITE"
          - "DistributionTerritory.can_license recomputed to true"
          - "DistributionTerritory.site_exception recomputed to true"
      - from: RESERVED
        to: WITHDRAWN
        trigger: "POST /cpt/distribution-territories/{id}/withdrawals"
        actor: LicensingOfficer
        preconditions:
          - "DistributionTerritory.territory_status == RESERVED"
        side_effects:
          - "DistributionTerritory.reserved_range cleared"
          - "cascade hop 2: every LicensingAgreement carrying this territory_id has its territory_id cleared and distribution_scope set to INTERNAL_ONLY by license_territory_scope_derivation"

  - entity: ContentDeliveryOrder
    shape: linear
    initial_state: PENDING
    terminal_states: [RELEASED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: RESERVED
        trigger: "POST /cpt/content-delivery-orders"
        actor: Licensee
        preconditions:
          - "LicensingAgreement named by license_id has agreement_status == ACTIVE"
          - "when distribution_channel == EDI, format_params.version_qualifier is present and payer_identifier is present"
        side_effects:
          - "ContentDeliveryOrder.activation_mode recomputed from channel and format parameters"
          - "ContentDeliveryOrder.reserved_at stamped"
          - "LicensingAgreement.version incremented by 1"
      - from: RESERVED
        to: READY
        trigger: "POST /cpt/content-delivery-orders/{id}/readiness"
        actor: EditorialStaff
        preconditions:
          - "ContentDeliveryOrder.format_params.media is present when distribution_channel == PRINT_AND_ELECTRONIC"
        side_effects:
          - "ContentDeliveryOrder.ready_at stamped"
      - from: READY
        to: RELEASED
        trigger: "POST /cpt/content-delivery-orders/{id}/releases"
        actor: EditorialStaff
        preconditions:
          - "the LicensingAgreement named by license_id has agreement_status == ACTIVE"
          - "the DistributionTerritory named by that licence's territory_id, when set, has territory_status != RESERVED"
        side_effects:
          - "ContentDeliveryOrder.released_at stamped"
          - "the LicensingAgreement named by license_id has LicensingAgreement.version incremented by 1"
      - from: PENDING
        to: RESERVED
        trigger: "POST /cpt/content-delivery-orders"
        actor: LicensingOfficer
        preconditions:
          - "expected_license_version matches the LicensingAgreement's version"
        side_effects:
          - "ContentDeliveryOrder.activation_mode recomputed from channel and format parameters"
      - from: RESERVED
        to: WITHDRAWN
        trigger: "POST /cpt/content-delivery-orders/{id}/withdrawals"
        actor: Licensee
        preconditions:
          - "ContentDeliveryOrder.delivery_status == RESERVED"
        side_effects:
          - "ContentDeliveryOrder.released_at cleared"

  - entity: InterpretationRequest
    shape: linear
    initial_state: PENDING
    terminal_states: [ANSWERED]
    transitions:
      - from: PENDING
        to: ANSWERED
        trigger: "POST /cpt/interpretation-requests/{id}/answers"
        actor: EditorialStaff
        preconditions:
          - "InterpretationRequest.entitlement_status == ENTITLED"
          - "the LicensingAgreement named by requesting_licensee_id has agreement_status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "InterpretationRequest.answered_at stamped"
          - "InterpretationRequest.entitlement_status recomputed from the requesting licensee class"

concurrency_rules:
  - rule_id: delivery-reserve-stale-license
    parent_entity: LicensingAgreement
    write_endpoint: "POST /cpt/content-delivery-orders"
    occ_field: "expected_license_version"
    description: |
      Reserving a new ContentDeliveryOrder against a LicensingAgreement whose
      version has advanced since the licensee last observed it is rejected.
      This captures the case where the licensee's view of the licence is stale
      because a prior delivery reservation legitimately advanced the licence.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: cycle-submit-stale-change
    parent_entity: CodeChange
    write_endpoint: "POST /cpt/release-cycles/{id}/submissions"
    occ_field: "expected_change_version"
    description: |
      Submitting a CodeChange into a ReleaseCycle's descriptor pool while the
      change's version has advanced since the submitter last observed it is
      rejected. This captures the case where the submitter's view of the change
      is stale because a prior submission advanced the change's version.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: panel_weighted_vote_tally
    trigger: "POST /cpt/meetings/{id}/closures; POST /cpt/code-changes/{id}/determinations; POST /cpt/meetings/{id}/recesses"
    algorithm: aggregation
    formula: |
      included_ballots = EditorialVote rows where meeting_id == meeting.id
        AND vote IN {YES, NO, ABSTAIN}
        AND change_id names a CodeChange whose review_status IN {PANEL_REVIEW, DETERMINED}
        AND EditorialVote.created_at <= EditorialPanelMeeting.conducted_at when conducted_at IS NOT NULL,
            otherwise EditorialVote.created_at <= the current logical clock instant
      later ballots by the same society_id on the same change_id are superseded:
        keep only the row with the greatest cast_at per (society_id, change_id); ties broken by created_at ASC
      weighted_yes     = sum(included_ballots.votes_carried where vote == YES)
      weighted_no      = sum(included_ballots.votes_carried where vote == NO)
      weighted_abstain = sum(included_ballots.votes_carried where vote == ABSTAIN)
      vote_percent = round_half_up(weighted_yes / (weighted_yes + weighted_no) * 100, 4)
      abstentions are excluded from the denominator
      carried when vote_percent >= 66.6667 and weighted_yes + weighted_no > 0
    input_set: "EditorialVote rows whose meeting is the target meeting and whose change is still PANEL_REVIEW or DETERMINED; superseded ballots by the same society on the same change are dropped"
    precision: "vote_percent 4 decimal places, round_half_up; weighted_* rounded half-up to 2 decimals"
    variants:
      - name: seats_carried
        when: "default — each ballot carries the casting society's voting_seat_count"
        difference: "weighted_* totals are seat counts, not ballot counts"
      - name: one_vote_per_society
        when: "EditorialPanelMeeting.citation_mode == true"
        difference: "votes_carried is forced to 1 for every ballot regardless of voting_seat_count, so weighted_* totals are ballot counts"

  - name: cea_credit_award
    trigger: "POST /cpt/code-changes/{id}/determinations; POST /cpt/code-changes/{id}/referrals; POST /cpt/committee-reviews/{id}/decisions; DELETE /cpt/code-changes/{id}"
    algorithm: threshold
    formula: |
      if CodeChange.determination != APPROVED:
          cea_credits = 0
      else:
          credits = 2.0
          if CodeChange.code applies to a single organ system: credits += 0.5
          if 0 < CodeChange.procedure_volume_threshold <= 10000: credits += 0.5
          if CodeChange.clinical_evidence_tier == TIER_I: credits += 1.0
          cea_credits = round_half_up(credits, 2)
    input_set: "Only CodeChange rows whose determination equals APPROVED contribute credits; every other determination sets the sponsoring society's balance contribution to 0"
    constants:
      BASE_CREDITS: 2.0
      ORGAN_SYSTEM_CREDITS: 0.5
      VOLUME_THRESHOLD_LOW: 10000
      VOLUME_CREDITS: 0.5
      TIER_I_CREDITS: 1.0
    precision: "2 decimal places, round_half_up"

  - name: sponsoring_society_credit_balance
    trigger: "recomputed whenever any CodeChange row's determination changes"
    algorithm: aggregation
    formula: |
      SpecialtySociety.cea_credit_balance =
        sum(CodeChange.cea_credits where CodeChange.society_id == SpecialtySociety.id
            and CodeChange.determination == APPROVED)
      CodeChange rows with determination != APPROVED contribute 0
      CodeChange rows whose society_id IS NULL contribute to no society
    input_set: "CodeChange rows carrying this society as sponsoring society, filtered to determination == APPROVED"
    precision: "2 decimal places, round_half_up"

  - name: committee_recommendation_vote
    trigger: "POST /cpt/committee-reviews/{id}/decisions; POST /cpt/ruc-value-recommendations/{id}/votes"
    algorithm: threshold
    formula: |
      total = yes_votes + no_votes
      vote_percent = round_half_up(yes_votes / total * 100, 4) when total > 0
      recommendation_status = RECOMMENDED when vote_percent >= 66.0000 otherwise DEEMED_NOT_RECOMMENDED
      abstentions and absences are excluded from total
    input_set: "Committee ballots recorded on the review row itself; abstentions and absences excluded"
    constants:
      COMMITTEE_APPROVAL_PERCENT: 66.0000
    precision: "4 decimal places, round_half_up"

  - name: panel_vote_percent
    trigger: "computed alongside panel_weighted_vote_tally"
    algorithm: threshold
    formula: |
      vote_percent = round_half_up(weighted_yes / (weighted_yes + weighted_no) * 100, 2)
      quorum_ok = EditorialPanelMeeting.quorum_present == true
      approved when quorum_ok and vote_percent >= 66.00
    input_set: "Meeting-level weighted totals; abstentions excluded from the denominator"
    constants:
      PANEL_APPROVAL_PERCENT: 66.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: two_thirds_floor
        when: "default — threshold is 66.00 percent of weighted yes plus weighted no"
        difference: "approval is evaluated at 2 decimals"
      - name: two_thirds_exact
        when: "EditorialPanelMeeting.citation_mode == true"
        difference: "threshold is 66.6667 percent evaluated at 4 decimals; the 22-to-11 seat tally approves, the 21-to-11 seat tally does not"

  - name: comment_period_governance
    trigger: "POST /cpt/code-changes/{id}/postings; POST /cpt/meetings/{id}/comment-windows; POST /cpt/release-cycles/{id}/openings"
    algorithm: threshold
    formula: |
      duration_days = the whole-day difference between comment_period_close_at and comment_period_open_at
      acceptable when duration_days >= 30
      addendum windows close at ReleaseCycle.addendum_comment_close regardless of the 30-day floor
    input_set: "Comment windows on CodeChange, EditorialPanelMeeting and ReleaseCycle rows; the addendum window is validated only against addendum_comment_close"
    constants:
      MIN_COMMENT_DAYS: 30
    precision: "whole days"
    variants:
      - name: addendum_period
        when: "the window is ReleaseCycle.addendum_comment_close"
        difference: "measured against the November 15 addendum close and exempt from the 30-day floor"
      - name: full_posting_period
        when: "the window is a full public comment period"
        difference: "the full 30-day public comment window applies and the 30-day floor is enforced"

  - name: release_cycle_code_pool_allocation
    trigger: "POST /cpt/release-cycles/{id}/submissions; POST /cpt/release-cycles/{id}/closures"
    algorithm: waterfall_allocation
    formula: |
      submission_count = count(CodeChange where cycle_id == ReleaseCycle.id)
      editorial_reserved_codes = floor(code_set_capacity * 0.40)
      additions_pool_codes = min(140, floor(code_set_capacity * 0.35))
      catiii_pool_codes = min(25, floor(code_set_capacity * 0.05))
      discretionary_codes = code_set_capacity - editorial_reserved_codes - additions_pool_codes - catiii_pool_codes
      budget_gate_status = EXHAUSTED when discretionary_codes < 40 otherwise OPEN
    input_set: "CodeChange rows whose cycle_id equals this cycle; the pools themselves derive from code_set_capacity alone"
    constants:
      EDITORIAL_RESERVED_PCT: 0.40
      ADDITIONS_POOL_CAP: 140
      ADDITIONS_POOL_PCT: 0.35
      CATIII_POOL_CAP: 25
      CATIII_POOL_PCT: 0.05
      DISCRETIONARY_FLOOR: 40
    precision: "integer floors; each pool is floored before the subtraction"
    variants:
      - name: per_bucket_floors
        when: "default — each bucket is floored first, then subtracted in the order editorial, additions, catiii"
        difference: "a capacity of 200 yields discretionary_codes 40 and clears the gate"
      - name: single_floor
        when: "ReleaseCycle.single_floor_budgeting == true"
        difference: "the three unbounded percentages are summed before flooring, which can yield discretionary_codes one unit lower and trip the gate"

  - name: ruc_global_valuation_to_code_value
    trigger: "POST /cpt/ruc-value-recommendations/{id}/recommendations; POST /cpt/ruc-value-recommendations/{id}/refusals"
    algorithm: weighted_scoring
    formula: |
      if RUCValueRecommendation.recommendation_status == RECOMMENDED:
          recommended_work_rvu = RUCValueRecommendation.work_rvu
      else:
          magnitude_weight = tiered magnitude weight from survey_median_minutes
          recommended_work_rvu = round_half_up(magnitude_weight * 1.0000, 2)
      effective_date = January 1 of the ReleaseCycle year + 1
      payability_status = NOT_PAYABLE until forward_status == FORWARDED
    input_set: "RUCValueRecommendation rows regardless of recommendation_status; a DEEMED_NOT_RECOMMENDED valuation still produces a published work RVU"
    constants:
      GPCI_WORK: 1.0521
      CONVERSION_FACTOR: 32.99
      MAGNITUDE_LOW_WEIGHT: 0.35
      MAGNITUDE_BAND1_WEIGHT: 0.12
      MAGNITUDE_HIGH_WEIGHT: 0.06
    precision: "work RVU 2 decimal places, round_half_up"
    variants:
      - name: gpci_applied
        when: "the SpecialtySociety row named by specialty_id exists"
        difference: "each component product is multiplied by that society's gpci_work, gpci_pe and gpci_mp before summing"
      - name: national_unadjusted
        when: "the SpecialtySociety row named by specialty_id does not exist"
        difference: "no geographic index is applied and the three RVU components are multiplied only by the conversion factor"

  - name: code_value_dollar_split_proration
    trigger: "POST /cpt/ruc-value-recommendations/{id}/recommendations; POST /cpt/release-cycles/{id}/releases"
    algorithm: aggregation
    formula: |
      gpci = the SpecialtySociety named by CodeValue.specialty_id
      adjusted_work = CodeValue.work_rvu * gpci.gpci_work
      adjusted_facility_pe = CodeValue.facility_pe_rvu * gpci.gpci_pe
      adjusted_nonfacility_pe = CodeValue.nonfacility_pe_rvu * gpci.gpci_pe
      adjusted_mp = CodeValue.mp_rvu * gpci.gpci_mp
      aggregate_round_total_cents = round_half_up((adjusted_work + adjusted_facility_pe + adjusted_mp)
                                                   * conversion_factor * 100, 0)
      component_round_total_cents = round_half_up(adjusted_work * conversion_factor * 100, 0)
                                  + round_half_up(adjusted_facility_pe * conversion_factor * 100, 0)
                                  + round_half_up(adjusted_mp * conversion_factor * 100, 0)
      facility_payment_cents = component_round_total_cents when rounding_variant == COMPONENT_ROUNDING
                             | aggregate_round_total_cents when rounding_variant == AGGREGATE_ROUNDING
      nonfacility_payment_cents = round_half_up((adjusted_work + adjusted_nonfacility_pe + adjusted_mp)
                                                * conversion_factor * 100, 0)
      dollar_split_shortfall_cents = nonfacility_payment_cents - component_round_total_cents
      released_code_values = ids of CodeValue rows whose release_id equals the cycle,
                             ordered by code ascending, ties broken by created_at ASC
    input_set: "One CodeValue row plus the SpecialtySociety supplying its GPCIs; the released_code_values set is filtered to code values bound to the cycle under release"
    constants:
      NATIONAL_GPCI: 1.0000
      DEFAULT_CONVERSION_FACTOR: 32.99
    precision: "cents as integers, round_half_up at 0 decimal places on each product or on the sum"
    variants:
      - name: aggregate_rounding
        when: "CodeValue.rounding_variant == AGGREGATE_ROUNDING"
        difference: "facility_payment_cents rounds the adjusted sum once, so it can sit one cent below component_round_total_cents"
      - name: component_rounding
        when: "CodeValue.rounding_variant == COMPONENT_ROUNDING"
        difference: "facility_payment_cents sums three individually rounded products, so it can sit one cent above aggregate_round_total_cents"

  - name: errata_proration_recalculation
    trigger: "POST /cpt/errata-notices/{id}/publications; POST /cpt/errata-notices/{id}/withdrawals; POST /cpt/errata-reviews/{id}/outcomes"
    algorithm: aggregation
    formula: |
      year_end = December 31 of the release year
      proration_denominator_days = (year_end - code_value.effective_date).days + 1
      proration_numerator_days   = (year_end - errata_effective_date).days + 1
      when errata_effective_date == code_value.effective_date:
          corrected_facility_payment_cents = prior_facility_payment_cents
      otherwise:
          corrected_facility_payment_cents = round_half_up(
              prior_facility_payment_cents * proration_numerator_days / proration_denominator_days, 0)
      when a ReviewErratum with review_outcome == REVERSED applies:
          corrected_facility_payment_cents = round_half_up(prior_facility_payment_cents * corrected_proration_ratio, 0)
    input_set: "The ErrataNotice row, the CodeValue it names, and the ReleaseCycle carrying that code value; a rejected erratum still stores its recomputed figures for audit"
    constants:
      PRORATION_BASIS: "days inclusive of both endpoints"
    precision: "cents as integers, round_half_up"
    variants:
      - name: proration_recalc
        when: "ErrataNotice.errata_effective_date > code_value.effective_date"
        difference: "the audited prior payment is prorated by the day counts above"
      - name: full_reversal
        when: "ErrataNotice.errata_effective_date == code_value.effective_date"
        difference: "no proration occurs and the corrected figure equals the audited prior figure exactly"

  - name: license_royalty_schedule
    trigger: "POST /cpt/licensing-agreements; POST /cpt/licensing-agreements/{id}/activations"
    algorithm: tiered_pricing
    formula: |
      acceptance threshold: sales_unit_count must be >= 4 to clear fee_threshold_gate_status
      base (band) schedule, priced per billable unit:
        units <= 500000            -> royalty_fee_cents = round_half_up(units * 0.90, 0)
        500000 < units <= 5000000  -> royalty_fee_cents = round_half_up(450000 + (units - 500000) * 0.55, 0)
        units > 5000000            -> royalty_fee_cents = round_half_up(450000 + 2475000 + (units - 5000000) * 0.25, 0)
      where units == LicensingAgreement.sales_unit_count
      payer schedule, applied in place of the band schedule when payer_revenue_tier is present:
        TIER_1 -> royalty_fee_cents = round_half_up(0.75 * base_fee_cents, 2)
        TIER_2 -> royalty_fee_cents = round_half_up(1.15 * base_fee_cents, 2)
        TIER_3 -> royalty_fee_cents = round_half_up(1.50 * base_fee_cents, 2)
      ancillary_publication_codes are returned on the licence response and carry no per-unit fee
    input_set: "LicensingAgreement rows with licensee_type PAYER or VENDOR; ancillary_publication_codes are never billed a royalty"
    constants:
      MIN_SALES_UNITS: 4
      BAND1_RATE: 0.90
      BAND2_FIXED: 450000
      BAND2_RATE: 0.55
      BAND3_FIXED: 2475000
      BAND3_RATE: 0.25
    precision: "cents as integers, round_half_up"
    variants:
      - name: base_schedule
        when: "payer_revenue_tier is absent (vendor licences)"
        difference: "the three band schedule applies and vendor_worldwide does not change the fee"
      - name: payer_schedule
        when: "payer_revenue_tier is present"
        difference: "the revenue-tier schedule replaces the band schedule and vendor_worldwide is ignored"

  - name: license_territory_scope_derivation
    trigger: "POST /cpt/licensing-agreements/{id}/activations; POST /cpt/licensing-agreements/{id}/terminations; POST /cpt/distribution-territories/{id}/reservations"
    algorithm: aggregation
    formula: |
      scope_score = 0
      if LicensingAgreement.agreement_status == ACTIVE: scope_score += 1
      if LicensingAgreement.territory_id IS NOT NULL
         and DistributionTerritory.can_license == true: scope_score += 1
      if LicensingAgreement.licensee_type == VENDOR
         and LicensingAgreement.vendor_worldwide == true: scope_score += 1
      distribution_scope = INTERNAL_ONLY when scope_score == 0
                         | US_ONLY when scope_score > 0 and vendor_worldwide == false
                         | WORLDWIDE when scope_score > 0 and vendor_worldwide == true
      ancillary_publication_codes = ancillary item codes bundled with the licence response;
        they carry no per-unit fee and are not consulted by the scope score
    input_set: "The LicensingAgreement plus its DistributionTerritory; terminated licences are forced to INTERNAL_ONLY regardless of score"
    constants:
      ACTIVE_WEIGHT: 1
      TERRITORY_WEIGHT: 1
      WORLDWIDE_WEIGHT: 1
    precision: "integer score"

  - name: education_credit_conversion
    trigger: "POST /cpt/education-activities/{id}/completions"
    algorithm: decay_function
    formula: |
      ceu = round_half_away(clock_hours / 2, 1)     # rounded to 1 decimal, half away from zero
      if clock_hours <= 1: ceu = 0.5
      if clock_hours >= 6: ceu = ceu_before_cap
      if ceu > 2.0: ceu = 2.0                        # hard cap
      # the cap applies to the derived credit itself; the raw clock_hours/2 ratio is not published
      cea_credits_awarded = ceu
      cea_credits_rounded = round_half_up(cea_credits_awarded, 0)    # nearest whole credit
    input_set: "CodingEducationActivity rows with assistant_targeted true or false; the activity's licensee is not consulted"
    constants:
      HALF_POINT_CEILING: 0.5
      CREDIT_CAP: 2.0
    precision: "cea_credits_awarded 1 decimal place, round half away from zero; cea_credits_rounded nearest whole credit, round_half_up"

  - name: meeting_quorum_derivation
    trigger: "POST /cpt/meetings/{id}/agenda; POST /cpt/meetings/{id}/openings; POST /cpt/meetings/{id}/closures"
    algorithm: aggregation
    formula: |
      quorum_present = true only while at least three distinct CodeChange rows carry this
                       meeting's id as their meeting_id with review_status IN
                       {AGENDA_SET, PANEL_REVIEW, DETERMINED}
      the three are counted by distinct CodeChange.id, not by code value
    input_set: "All CodeChange rows docketed at the meeting with review_status AGENDA_SET, PANEL_REVIEW or DETERMINED; the first three by created_at ascending are counted"
    precision: "boolean"

  - name: billing_units_for_services
    trigger: "POST /cpt/code-changes/{id}/returns"
    algorithm: aggregation
    formula: |
      recursion depth = 0
      code_value.facility_payment_cents = self_charge       # base at depth 0
      for each parent code in the code_family ancestor chain, nearest-first order:
          depth += 1
          code_value.facility_payment_cents += self_charge
          if depth == 3: stop                                  # third hop is the cutoff, not the fourth
      hops_applied = min(depth, 3)
    input_set: "The code, its ancestors within the same code_family, and the per-service base amount"
    constants:
      MAX_HOPS: 3
    precision: "cents as integers, round_half_up"

  - name: assistant_interpretation_entitlement
    trigger: "POST /cpt/interpretation-requests; POST /cpt/interpretation-requests/{id}/answers"
    algorithm: threshold
    formula: |
      entitled when the LicensingAgreement named by requesting_licensee_id has agreement_status ACTIVE
      entitled when licensee_type == EDUCATOR and agreement_status is any non-TERMINATED value
      not entitled when licensee_type == PROVIDER
      not entitled when agreement_status == TERMINATED
    input_set: "InterpretationRequest rows joined to their requesting LicensingAgreement"
    precision: "boolean"
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted for the endpoint's role set; segregation of duties holds — the same X-User-ID that created a CodeChange may not record that change's panel determination, and the same X-User-ID may not both publish and reverse an ErrataNotice"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "path-identified resources exist, validated left to right; a referenced body foreign key names an existing row"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-bearing endpoints"
  - priority: 3
    category: business_constraint
    check: "the reference committee may request a hold only by naming the hold basis in the request"
    error_id: ERR_NO_HOLD_KIND
    http_status: 422
    applies_to: "POST /cpt/code-changes/{id}/referrals"
  - priority: 3
    category: business_constraint
    check: "a held value recommendation may be released only in one of the four closed FAQ release kinds"
    error_id: ERR_UNSUPPORTED_RELEASE
    http_status: 422
    applies_to: "POST /cpt/ruc-value-recommendations/{id}/releases"
  - priority: 3
    category: business_constraint
    check: "a corrected proration ratio must sit strictly between zero and one, and must be supplied when review_outcome is REVERSED"
    error_id: ERR_CORRECTION_INVALID
    http_status: 422
    applies_to: "POST /cpt/errata-reviews/{id}/outcomes"
  - priority: 3
    category: business_constraint
    check: "only a seated society may cast the single ballot it is entitled to per change at a meeting; a society that has already cast a ballot has its earlier ballot superseded"
    error_id: ERR_DUPLICATE_VOTE
    http_status: 409
    applies_to: "POST /cpt/editorial-votes"
  - priority: 3
    category: business_constraint
    check: "more than one percent of a meeting's weighted yes vote may not be cast from outside the seated societies"
    error_id: ERR_APPROVAL_SCOPE_EXCEEDED
    http_status: 409
    applies_to: "POST /cpt/meetings/{id}/closures; POST /cpt/code-changes/{id}/determinations"
  - priority: 3
    category: business_constraint
    check: "a corrected proration ratio must sit strictly between zero and one, and must be supplied when review_outcome is REVERSED"
    error_id: ERR_CORRECTION_INVALID
    http_status: 422
    applies_to: "POST /cpt/errata-reviews/{id}/outcomes"
  - priority: 4
    category: business_referential
    check: "a change submitted into a release cycle must carry a sponsoring society on record"
    error_id: ERR_SPONSOR_REQUIRED
    http_status: 422
    applies_to: "POST /cpt/release-cycles/{id}/submissions"
  - priority: 4
    category: business_constraint
    check: "CodeChange.code is exactly 5 characters, and a code whose last character is a letter must end in A through J"
    error_id: ERR_CODE_FORMAT_INVALID
    http_status: 422
    applies_to: "POST /cpt/code-changes"
  - priority: 5
    category: business_constraint
    check: "CodeChange.code is unique across CodeChange; a duplicate descriptor number is rejected"
    error_id: ERR_CODE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /cpt/code-changes"
  - priority: 6
    category: business_constraint
    check: "clinical evidence sufficiency: TIER_IV evidence is accepted for a REVISION or DELETION, and for an ADDITION only when procedure_volume_threshold is at least 100"
    error_id: ERR_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /cpt/code-changes"
  - priority: 7
    category: business_constraint
    check: "an AdvisoryCommitteeReview may be opened only against a CodeChange whose clinical_evidence_tier is TIER_I, TIER_II or TIER_III while its administrative_review_status is UNDER_ADMIN_REVIEW"
    error_id: ERR_ADVISORY_REVIEW_NOT_READY
    http_status: 409
    applies_to: "POST /cpt/advisory-committee-reviews"
  - priority: 8
    category: state
    check: "CodeChange.meeting_id must name an EditorialPanelMeeting whose meeting_status is SCHEDULED or PUBLIC_COMMENT_OPEN"
    error_id: ERR_MEETING_NOT_OPEN
    http_status: 409
    applies_to: "POST /cpt/meetings/{id}/agenda; POST /cpt/code-changes/{id}/returns"
  - priority: 9
    category: business_constraint
    check: "at least three distinct CodeChange rows are docketed at this meeting with review_status in AGENDA_SET, PANEL_REVIEW or DETERMINED; otherwise the meeting has no quorum"
    error_id: ERR_NO_QUORUM
    http_status: 409
    applies_to: "POST /cpt/code-changes/{id}/determinations; POST /cpt/meetings/{id}/closures"
  - priority: 10
    category: business_constraint
    check: "a CodeChange with held_for_full_panel true may not be determined at the meeting; it must be carried to the June minutes"
    error_id: ERR_ALREADY_REFERRED_TO_JUNE_MINUTES
    http_status: 409
    applies_to: "POST /cpt/code-changes/{id}/determinations"
  - priority: 11
    category: business_safety
    check: "citation-mode approval truncates the weighted percentage to three decimals before comparing it with 66.667, so a tally resolving to exactly 66.6667 percent falls below the floor and is rejected"
    error_id: ERR_APPROVAL_PERCENT_TOO_LOW
    http_status: 409
    applies_to: "POST /cpt/code-changes/{id}/determinations"
  - priority: 11
    category: business_fiscal
    check: "descriptor pool floors are evaluated pool by pool before subtraction, so a capacity of 192 yields discretionary_codes 40 and clears the gate while the same capacity under single_floor_budgeting yields 39 and trips it"
    error_id: ERR_EDITORIAL_BUDGET_EXHAUSTED
    http_status: 422
    applies_to: "POST /cpt/release-cycles/{id}/closures"
  - priority: 12
    category: business_temporal
    check: "a change already carried to three cycles may not be carried to a fourth"
    error_id: ERR_CYCLE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /cpt/code-changes/{id}/supplementary-reports"
  - priority: 13
    category: business_temporal
    check: "posting comment windows must run at least 30 days; windows falling one day short are rejected"
    error_id: ERR_COMMENT_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /cpt/code-changes/{id}/postings; POST /cpt/meetings/{id}/comment-windows; POST /cpt/release-cycles/{id}/openings"
  - priority: 14
    category: business_referential
    check: "a CodeChange may not be docketed at a February, April, August, October or December meeting while its clinical_evidence_tier is TIER_IV"
    error_id: ERR_FREQUENT_FAMILY_EXEMPLAR_REQUIRED
    http_status: 422
    applies_to: "POST /cpt/meetings/{id}/agenda"
  - priority: 15
    category: business_constraint
    check: "a CodeChange may not be advanced to panel review while a PublicComment on the same change names an interested party that is also one of the seats counting toward that meeting's quorum"
    error_id: ERR_CHANGE_NOT_READY_FOR_PANEL
    http_status: 409
    applies_to: "POST /cpt/meetings/{id}/openings"
  - priority: 16
    category: business_constraint
    check: "CodeChange.review_status must be DRAFT, POSTED_FOR_COMMENT, ADMIN_REVIEW, AGENDA_SET, PANEL_REVIEW or REFERRED for the requested operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all CodeChange action endpoints"
  - priority: 17
    category: business_constraint
    check: "a terminal CodeChange whose determination is APPROVED may not be reverted to draft"
    error_id: ERR_ALREADY_TERMINAL
    http_status: 409
    applies_to: "POST /cpt/code-changes/{id}/revert-to-draft"
  - priority: 18
    category: business_constraint
    check: "a REVISION change without a proposed descriptor, or a DELEGATION-category change without parenthetical instructions, is rejected"
    error_id: ERR_DELEGATION_REQUIRED
    http_status: 422
    applies_to: "POST /cpt/code-changes; POST /cpt/code-changes/{id}/returns"
  - priority: 19
    category: business_constraint
    check: "a hole in the descriptor numbering leaves a missing descriptor, which blocks any release that would publish the surrounding range"
    error_id: ERR_MISSING_DESCRIPTOR
    http_status: 422
    applies_to: "POST /cpt/release-cycles/{id}/releases"
  - priority: 20
    category: business_fiscal
    check: "a licence may not be activated while its fee_threshold_gate_status is BELOW_MINIMUM because sales_unit_count is under 4"
    error_id: ERR_LICENSE_FEE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /cpt/licensing-agreements/{id}/activations"
  - priority: 21
    category: business_constraint
    check: "a delivery on the EDI channel requires payer_identifier and a well-formed version qualifier; a SITE delivery is exempt from electronic format requirements"
    error_id: ERR_ELECTRONIC_MEDIA_REQUIRED
    http_status: 422
    applies_to: "POST /cpt/content-delivery-orders; POST /cpt/content-delivery-orders/{id}/releases"
  - priority: 22
    category: business_safety
    check: "an addition on the CATEGORY_III emerging-technology track must declare supporting data in its evidence packet"
    error_id: ERR_SUPPORT_DATA_REQUIRED
    http_status: 422
    applies_to: "POST /cpt/advisory-committee-reviews; POST /cpt/code-changes/{id}/determinations"
  - priority: 23
    category: business_constraint
    check: "a grade A audio-only or text-only delivery must carry a version qualifier of 2026.1 or later metadata"
    error_id: ERR_VERSION_QUALIFIER_REQUIRED
    http_status: 422
    applies_to: "POST /cpt/content-delivery-orders"
  - priority: 24
    category: business_constraint
    check: "a LicensingAgreement on the DISTRIBUTION or REPRINT method may not be activated while its DistributionTerritory.territory_status is RESERVED"
    error_id: ERR_LICENSE_TERRITORY_RESERVED
    http_status: 409
    applies_to: "POST /cpt/licensing-agreements/{id}/activations"
  - priority: 25
    category: business_temporal
    check: "an errata notice may not take effect after the release's errata_deadline"
    error_id: ERR_ERRATA_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /cpt/errata-notices/{id}/publications"
  - priority: 26
    category: business_constraint
    check: "an interpretation request may be answered only when entitlement_status is ENTITLED"
    error_id: ERR_NOT_ENTITLED
    http_status: 403
    applies_to: "POST /cpt/interpretation-requests/{id}/answers"
  - priority: 27
    category: business_constraint
    check: "an advisory committee review may be closed only with quorum_met true and a positive ballot total"
    error_id: ERR_ADVISORY_REVIEW_INCOMPLETE
    http_status: 409
    applies_to: "POST /cpt/committee-reviews/{id}/decisions"
  - priority: 28
    category: business_temporal
    check: "a value recommendation may be forwarded only before its effective_date and while payability_status is NOT_PAYABLE"
    error_id: ERR_VALUATION_NOT_FORWARDABLE
    http_status: 409
    applies_to: "POST /cpt/ruc-value-recommendations/{id}/forwards"
  - priority: 29
    category: business_constraint
    check: "an education activity may be completed only from activity_status REGISTERED"
    error_id: ERR_EDUCATION_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /cpt/education-activities/{id}/completions"
  - priority: 30
    category: business_temporal
    check: "a LicensingAgreement may hold at most one ContentDeliveryOrder whose delivery_status is RESERVED or READY; the licence's reserved delivery slot is occupied until that order is released or withdrawn"
    error_id: ERR_DUPLICATE_DELIVERY_RESERVATION
    http_status: 409
    applies_to: "POST /cpt/content-delivery-orders; POST /cpt/content-delivery-orders/{id}/readiness"
  - priority: 31
    category: business_temporal
    check: "a DistributionTerritory may be bound by at most one LicensingAgreement whose agreement_status is not TERMINATED; the territory occupancy interval ends only when that licence terminates"
    error_id: ERR_TERRITORY_OCCUPIED
    http_status: 409
    applies_to: "POST /cpt/licensing-agreements"
  - priority: 32
    category: business_temporal
    check: "a CodeChange already carrying a non-null meeting_id may not be docketed at another meeting while its current docket slot is open"
    error_id: ERR_MEETING_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /cpt/meetings/{id}/agenda"

endpoints:
  - method: POST
    path: "/cpt/specialty-societies"
    description: "Register a specialty society that may hold editorial panel seats and sponsor changes"
    roles: [EditorialStaff]
    code: 201
    input: [name, specialty_code, "voting_seat_count?", "gpci_work?", "gpci_pe?", "gpci_mp?"]
    output: SpecialtySociety
    side_effects: ["cea_credit_balance initialized to 0"]
  - method: GET
    path: "/cpt/specialty-societies"
    description: "List specialty societies"
    roles: [EditorialStaff, EditorialPanelChair, CommitteeReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: SpecialtySociety[]
    side_effects: []
  - method: GET
    path: "/cpt/specialty-societies/{id}"
    description: "Read one specialty society"
    roles: [EditorialStaff, EditorialPanelChair, CommitteeReviewer]
    code: 200
    input: []
    output: SpecialtySociety
    side_effects: []
  - method: POST
    path: "/cpt/specialty-societies/{id}/seat-assignments"
    description: "Set the number of editorial panel voting seats carried by a society"
    roles: [EditorialStaff]
    code: 200
    input: [voting_seat_count]
    output: SpecialtySociety
    side_effects: ["increments SpecialtySociety.version by 1"]
  - method: POST
    path: "/cpt/applicants"
    description: "Register a stakeholder applicant that may file code change applications"
    roles: [EditorialStaff]
    code: 201
    input: [name, applicant_type, "society_id?", is_entity_member, dues_paid_current, contact_email]
    output: ChangeApplicant
    side_effects: []
  - method: GET
    path: "/cpt/applicants"
    description: "List applicants"
    roles: [EditorialStaff, LicensingOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ChangeApplicant[]
    side_effects: []
  - method: GET
    path: "/cpt/applicants/{id}"
    description: "Read one applicant"
    roles: [EditorialStaff, LicensingOfficer]
    code: 200
    input: []
    output: ChangeApplicant
    side_effects: []
  - method: GET
    path: "/cpt/specialty-societies/{id}/applicants"
    description: "List the applicants filed on behalf of a specialty society"
    roles: [EditorialStaff, EditorialPanelChair]
    code: 200
    input: ["limit?", "offset?"]
    output: ChangeApplicant[]
    side_effects: []
  - method: POST
    path: "/cpt/code-changes"
    description: "File a code change application for an addition, revision or deletion"
    roles: [EditorialStaff, ChangeApplicant]
    code: 201
    input: [code, change_type, category, code_family, applicant_id, "society_id?", clinical_evidence_tier, "evidence_sufficiency_index?", procedure_volume_threshold, "organ_system_count?", descriptor_current, "descriptor_proposed?", "guidelines?", "parenthetical_instructions?"]
    output: CodeChange
    side_effects: ["administrative_review_status initialized to UNDER_ADMIN_REVIEW", "review_status initialized to DRAFT"]
  - method: GET
    path: "/cpt/code-changes"
    description: "List code changes with filters"
    roles: [EditorialStaff, EditorialPanelChair, CommitteeReviewer]
    code: 200
    input: ["review_status?", "determination?", "category?", "applicant_id?", "society_id?", "meeting_id?", "change_type?", "evidence_sufficiency_index_max?", "limit?", "offset?"]
    output: CodeChange[]
    side_effects: []
  - method: GET
    path: "/cpt/code-changes/{id}"
    description: "Read one code change with its computed CEA credits"
    roles: [EditorialStaff, EditorialPanelChair, CommitteeReviewer, ChangeApplicant]
    code: 200
    input: []
    output: CodeChange
    side_effects: []
  - method: GET
    path: "/cpt/specialty-societies/{id}/code-changes"
    description: "List the code changes sponsored by a specialty society"
    roles: [EditorialStaff, EditorialPanelChair]
    code: 200
    input: ["limit?", "offset?"]
    output: CodeChange[]
    side_effects: []
  - method: POST
    path: "/cpt/code-changes/{id}/administrative-returns"
    description: "Return a posted change to administrative review and clear its posting"
    roles: [EditorialStaff]
    code: 200
    input: [reason]
    output: CodeChange
    side_effects: ["administrative_review_status set to ADMIN_RETURNED", "posting_state set to NOT_POSTED", "increments CodeChange.version by 1"]
  - method: POST
    path: "/cpt/code-changes/{id}/postings"
    description: "Post a change for public comment and stamp its comment window"
    roles: [EditorialStaff]
    code: 200
    input: [comment_period_open_at, comment_period_close_at]
    output: CodeChange
    side_effects: ["posting_state set to COMMENT_OPEN", "increments CodeChange.version by 1"]
  - method: POST
    path: "/cpt/code-changes/{id}/returns"
    description: "Return a change to draft, either from the agenda or after three carried cycles"
    roles: [EditorialStaff]
    code: 200
    input: [reason]
    output: CodeChange
    side_effects: ["meeting_id cleared", "increments CodeChange.version by 1"]
  - method: POST
    path: "/cpt/code-changes/{id}/supplementary-reports"
    description: "Carry a referred change forward to a subsequent meeting with a supplementary report"
    roles: [EditorialStaff]
    code: 200
    input: [report_text]
    output: CodeChange
    side_effects: ["cycles_in_process incremented by 1", "held_for_full_panel set to false", "increments CodeChange.version by 1"]
  - method: POST
    path: "/cpt/code-changes/{id}/referrals"
    description: "Refer a panel-review change to the June minutes without a determination"
    roles: [EditorialPanelChair]
    code: 200
    input: [reason]
    output: CodeChange
    side_effects: ["cea_credits recomputed by cea_credit_award", "SpecialtySociety.cea_credit_balance recomputed by sponsoring_society_credit_balance", "increments CodeChange.version by 1"]
  - method: POST
    path: "/cpt/code-changes/{id}/determinations"
    description: "Record the editorial panel disposition of a change"
    roles: [EditorialPanelChair]
    code: 200
    input: [determination, determination_basis]
    output: CodeChange
    side_effects: ["cea_credits recomputed by cea_credit_award", "SpecialtySociety.cea_credit_balance recomputed by sponsoring_society_credit_balance", "EditorialPanelMeeting.weighted_yes, weighted_no and weighted_abstain recomputed by panel_weighted_vote_tally", "increments CodeChange.version by 1"]
  - method: POST
    path: "/cpt/code-changes/{id}/revert-to-draft"
    description: "Reopen a June-referred or tabled change for the following cycle"
    roles: [EditorialStaff]
    code: 200
    input: [reason]
    output: CodeChange
    side_effects: ["cycles_in_process incremented by 1", "determination set to PENDING", "cea_credits recomputed by cea_credit_award", "increments CodeChange.version by 1"]
  - method: DELETE
    path: "/cpt/code-changes/{id}"
    description: "Withdraw a change application before it enters a release cycle"
    roles: [EditorialStaff, ChangeApplicant]
    code: 200
    input: [withdrawal_reason]
    output: CodeChange
    side_effects: ["determination set to WITHDRAWN", "cea_credits recomputed by cea_credit_award", "SpecialtySociety.cea_credit_balance recomputed by sponsoring_society_credit_balance", "increments CodeChange.version by 1"]
  - method: POST
    path: "/cpt/advisory-committee-reviews"
    description: "Open an advisory committee review against a change"
    roles: [CommitteeReviewer]
    code: 201
    input: [change_id, committee_name, "quorum_met?", "yes_votes?", "no_votes?"]
    output: AdvisoryCommitteeReview
    side_effects: ["decision initialized to PENDING"]
  - method: GET
    path: "/cpt/advisory-committee-reviews"
    description: "List advisory committee reviews"
    roles: [CommitteeReviewer, EditorialStaff, EditorialPanelChair]
    code: 200
    input: ["change_id?", "committee_name?", "limit?", "offset?"]
    output: AdvisoryCommitteeReview[]
    side_effects: []
  - method: GET
    path: "/cpt/advisory-committee-reviews/{id}"
    description: "Read one advisory committee review"
    roles: [CommitteeReviewer, EditorialStaff, EditorialPanelChair]
    code: 200
    input: []
    output: AdvisoryCommitteeReview
    side_effects: []
  - method: GET
    path: "/cpt/code-changes/{id}/committee-reviews"
    description: "List the advisory committee reviews recorded against a change"
    roles: [CommitteeReviewer, EditorialStaff, EditorialPanelChair]
    code: 200
    input: ["limit?", "offset?"]
    output: AdvisoryCommitteeReview[]
