  - rule_id: compensating_invariant
    instances:
      - name: test_buy_cancellation_restores_the_brand_ledger_to_the_cent
        grounds:
          - state_machines.TestBuy.ORDERED_to_CANCELLED
          - calculations.test_buy_billable_total
          - interval_rules[test-buy-cooling-period]
        distinguishing_aspect: |
          The cancellation must reverse exactly billable_total_cents — not the
          subtotal, not a re-derived amount — and must also release the row from the
          cooling set. The budget is deliberately 6000 cents, so a same-instant
          replacement order of the identical size only fits if the reversal was exact:
          a partial refund of 4900 would leave the replacement over budget, and a
          double refund would make the ledger negative.
        test_recipe:
          setup:
            - "Brand budget is exactly 6000 cents"
            - "Test buy TB-1 was ordered at 2026-08-05T08:00:00Z for 4200 + 700 + 0, billing 5635 cents, leaving 365 cents of headroom"
            - "The clock does not move, so the replacement order sits squarely inside TB-1's cooling interval"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: BrandAdministrator
            - call: "POST /brand-protection/brands"
