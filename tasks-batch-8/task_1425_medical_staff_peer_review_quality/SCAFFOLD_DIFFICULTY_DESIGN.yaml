  # =====================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: role_denial_prior_to_state_violation
        grounds:
          - validations[priority=2]
          - validations[priority=5]
          - errors[ERR_UNAUTHORIZED_ROLE]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Category pair auth vs state: a Provider-role request hits an
          endpoint whose role list excludes it (priority 2) AND targets an
          assignment already SUBMITTED (priority 5 state violation). The
          403 role error MUST win.
        test_recipe:
          setup:
            - "Subject provider; members B/C; case screened in; B assigned; B has submitted (assignment SUBMITTED — a second submit is a state violation)"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Ten", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "priority case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 3, expected_case_version: "${case_v}" }, as: Provider, as_user_id: "${p_sub}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_UNAUTHORIZED_ROLE' with HTTP 403 — role check (priority 2) beats the state violation (priority 5) that a CommitteeRole resubmit on a SUBMITTED assignment would hit"
            - "error_id != 'ERR_INVALID_STATE'"

      - name: state_violation_prior_to_conflict_safety
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REVIEWER_CONFLICT_DECLARED]
        distinguishing_aspect: |
          Category pair state vs business_safety: assigning a reviewer who
          holds a declared conflict against the subject (priority 7 safety
          violation) to a case already in DELIBERATION (priority 5 state
          violation) MUST return the 409 state error.
        test_recipe:
          setup:
            - "Subject provider; CHAIR A; members B/C/D/E; case driven to DELIBERATION with scores (4,4,4)"
            - "Member E has self-declared a FINANCIAL conflict against the subject"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Eleven", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Chair A", specialty: "INTERNAL_MEDICINE" }, as: QualityDirector, captures: { p_a: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev E", specialty: "EMERGENCY_MEDICINE" }, as: QualityDirector, captures: { p_e: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_a}", member_role: "CHAIR" }, as: QualityDirector, captures: { m_a: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_e}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_e: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "INCIDENT_REPORT", referred_at: "2026-07-20T00:00:00Z", description: "priority case 2" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_d}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
            - { call: "POST /peer-review/committee-members/${m_e}/conflict-declarations", payload: { provider_id: "${p_sub}", conflict_type: "FINANCIAL" }, as: CommitteeMember, as_user_id: "${m_e}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_e}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_INVALID_STATE' with HTTP 409 — the case is in DELIBERATION (no assignment transition exists from it), and this state error (priority 5) preempts the declared-conflict safety error (priority 7)"
            - "error_id != 'ERR_REVIEWER_CONFLICT_DECLARED' even though the conflict declaration exists"

  # =====================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: trend_avg_threshold_exact_boundary
        grounds:
          - calculations.focused_review_trigger_evaluation
          - calculations.provider_trend_metrics
          - errors[ERR_FOCUSED_REVIEW_ALREADY_ACTIVE]
        distinguishing_aspect: |
          Metric = windowed average care appropriateness; endpoint =
          POST /peer-review/cases/{caseId}/close-no-response (cascade).
          avg == 3.00 exactly does NOT fire the '< 3.0' predicate; a later
          close pulling the average to 2.84 DOES. Exact-threshold precision.
        test_recipe:
          setup:
            - "Subject provider; CHAIR A; members B/C/D; case1 scores (3,3,3) and case2 scores (3,3,2) both in NOTIFIED; clock 2026-08-16T00:00:00Z"
