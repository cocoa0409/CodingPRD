    roles: [AccountManager]
    code: 201
    input: [brief_id, annual_volume_kg, unit_price_cents_per_kg, expected_brief_version]
    output: CommercializationForecast
    side_effects:
      - "runs calculations.forecast_value: writes variant_applied, stage_probability, technical_factor and weighted_annual_value_cents"
      - "creates the forecast in status ACTIVE with pinned_brief_version set to the validated expected_brief_version"
      - "cascade: the brief's existing CommercializationForecast rows in ACTIVE or AT_RISK -> SUPERSEDED"

  - method: GET
    path: "/commercialization-forecasts"
    description: "List commercialization forecasts, filtered by brief or status"
    roles: [AccountManager, TechnicalDirector, Flavorist, RegulatoryAffairs, LabTech, PurchasingManager]
    code: 200
    input: ["brief_id?", "status?", "limit?", "offset?"]
    output: CommercializationForecast[]
    side_effects: []

  - method: GET
    path: "/commercialization-forecasts/{forecast_id}"
    description: "Read one forecast including the variant applied and its factors"
    roles: [AccountManager, TechnicalDirector, Flavorist, RegulatoryAffairs, LabTech, PurchasingManager]
    code: 200
    input: []
    output: CommercializationForecast
    side_effects: []

  # ---------------- DisclosureGrant ----------------
  - method: POST
    path: "/disclosure-grants"
    description: "Issue a time-bound confidentiality grant that lets a caller read a formula's composition"
    roles: [TechnicalDirector]
    code: 201
    input: [brief_id, formula_id, disclosed_tier, redaction_level, expires_at]
    output: DisclosureGrant
    side_effects: ["creates the grant with computed status ACTIVE while the logical clock is strictly before expires_at"]

  - method: GET
    path: "/disclosure-grants"
    description: "List disclosure grants, filtered by brief or formula"
    roles: [AccountManager, TechnicalDirector, Flavorist, RegulatoryAffairs, LabTech, PurchasingManager]
    code: 200
    input: ["brief_id?", "formula_id?", "limit?", "offset?"]
    output: DisclosureGrant[]
    side_effects: []

  - method: GET
    path: "/disclosure-grants/{grant_id}"
    description: "Read one disclosure grant including its computed status"
    roles: [AccountManager, TechnicalDirector, Flavorist, RegulatoryAffairs, LabTech, PurchasingManager]
    code: 200
    input: []
    output: DisclosureGrant
    side_effects: []

  # ---------------- Test-driving endpoint ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Every expiry, retention interval, rig window and grant lifetime is evaluated against this logical clock."
    roles: [AccountManager, TechnicalDirector, Flavorist, RegulatoryAffairs, LabTech, PurchasingManager]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "moves the logical clock; recomputes SubstantiationRecord.is_expired, RawMaterial.verified_claim_types, RetentionCabinet.slots_available and DisclosureGrant.status on read"
      - "no state-machine transition fires as a result of moving the clock"

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================

errors:
  # --- authentication / authorization / confidentiality ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the caller's role is not listed in the endpoint's roles in §1.5"
  - id: ERR_IP_TIER_FORBIDDEN
    http: 403
    condition: "composition read of a TIER_2_RESTRICTED or TIER_3_BLACK_BOX formula without a DisclosureGrant for that formula whose disclosed_tier reaches the formula's tier"
  - id: ERR_DISCLOSURE_GRANT_EXPIRED
    http: 403
    condition: "the supplied DisclosureGrant's expires_at is at or before the logical clock"
  - id: ERR_REDACTION_LEVEL_INSUFFICIENT
    http: 403
    condition: "disclose_full == true while the supplied grant's redaction_level == REDACTED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID equals the formula's submitted_by_user_id on approval, or the lot's compounded_by_user_id on QC"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unparsable body, bad enum member, out-of-range number, more decimals than the field allows, allergen code outside the declared set, or close with outcome LOST and no loss_reason"
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "brief_code, material_code, cabinet_code or rig_code already exists (case-sensitive comparison)"

  # --- existence ---
  - id: ERR_BRIEF_NOT_FOUND
    http: 404
    condition: "no CustomerBrief with the given id"
  - id: ERR_MATERIAL_NOT_FOUND
    http: 404
    condition: "no RawMaterial with the given id"
  - id: ERR_SUBSTANTIATION_NOT_FOUND
    http: 404
    condition: "no SubstantiationRecord with the given id"
  - id: ERR_FORMULA_NOT_FOUND
    http: 404
    condition: "no Formula with the given id (path id, brief_id filter target, sub_formula_id or parent_formula_id)"
  - id: ERR_COMPONENT_NOT_FOUND
    http: 404
    condition: "no FormulaComponent with the given id"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "no SampleLot with the given id"
  - id: ERR_CABINET_NOT_FOUND
    http: 404
    condition: "no RetentionCabinet with the given id"
  - id: ERR_RETENTION_NOT_FOUND
    http: 404
    condition: "no RetentionSample with the given id"
  - id: ERR_RIG_NOT_FOUND
    http: 404
    condition: "no ApplicationRig with the given id"
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "no ApplicationTest with the given id"
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "no SampleShipment with the given id"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no RegulatoryDocument with the given id"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "no ScaleUpBatch with the given id"
  - id: ERR_FORECAST_NOT_FOUND
    http: 404
    condition: "no CommercializationForecast with the given id"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "no DisclosureGrant with the given id (path id or grant_id query value)"

  # --- own-state preconditions ---
  - id: ERR_BRIEF_STATE_INVALID
    http: 409
    condition: "the brief's status is not in the from-set of the requested transition"
  - id: ERR_SUBSTANTIATION_STATE_INVALID
    http: 409
    condition: "verify called on a VERIFIED record, or revoke called on a PENDING or REVOKED record"
  - id: ERR_FORMULA_STATE_INVALID
    http: 409
    condition: "the formula's status is not in the from-set of the requested transition (e.g. submit on an APPROVED, DRAFT, SUPERSEDED or ARCHIVED formula)"
  - id: ERR_FORMULA_NOT_REVISABLE
    http: 409
    condition: "revisions requested on a formula whose status is not APPROVED or REWORK_REQUIRED"
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "QC recorded on a lot whose qc_status is not PENDING, or release requested on a lot whose disposition_status is not HELD"
  - id: ERR_RETENTION_STATE_INVALID
    http: 409
    condition: "withdraw called on a RetentionSample whose status is already WITHDRAWN"
  - id: ERR_TEST_STATE_INVALID
    http: 409
    condition: "start called on a test that is not SCHEDULED, or result recorded on a test that is not IN_PROGRESS"
  - id: ERR_SHIPMENT_STATE_INVALID
    http: 409
    condition: "assemble-packet on a DISPATCHED or CANCELLED shipment, dispatch on a shipment that is not PACKET_ASSEMBLED, or cancel on a DISPATCHED or CANCELLED shipment"
  - id: ERR_BATCH_STATE_INVALID
    http: 409
    condition: "tolerance on a batch that is not REQUESTED or REJECTED, pilot-run on a batch that is not TOLERANCE_SET, or decision on a batch that is not PILOT_RUN"

  # --- cross-entity state preconditions ---
  - id: ERR_BRIEF_NOT_ACCEPTED
    http: 409
    condition: "formula submit or approval attempted while the owning brief's status is not ACCEPTED"
  - id: ERR_FORMULA_NOT_APPROVED
    http: 409
    condition: "sample-lot compounding, lot release or batch tolerance attempted while the formula's status is not APPROVED, or close WON attempted with no APPROVED formula on the brief"
  - id: ERR_SUB_FORMULA_NOT_COSTED
    http: 409
    condition: "costing attempted while a SUB_FORMULA component references a Formula whose status is not COSTED or APPROVED"
  - id: ERR_LOT_NOT_QC_PASSED
    http: 409
    condition: "release or test start attempted while the lot's qc_status is not PASSED"
  - id: ERR_LOT_NOT_RELEASED
    http: 409
    condition: "retention storage, application test creation, test start or shipment creation attempted while the lot's disposition_status is not RELEASED"

  # --- concurrency and version pinning ---
  - id: ERR_STALE_FORMULA_VERSION
    http: 412
    condition: "expected_formula_version does not equal the parent Formula's current version on POST /formulas/{formula_id}/revisions"
  - id: ERR_STALE_BRIEF_VERSION
    http: 412
    condition: "expected_brief_version does not equal the parent CustomerBrief's current version on POST /commercialization-forecasts"
  - id: ERR_PINNED_FORMULA_STALE
    http: 409
    condition: "the batch's pinned_formula_version no longer equals the formula's current version at tolerance time"

  # --- safety, compliance, regulatory ---
  - id: ERR_ALLERGEN_EXCLUSION_BREACH
    http: 422
    condition: "the formula's transitive allergen_codes intersect the brief's allergen_exclusions"
  - id: ERR_CLAIM_UNSUBSTANTIATED
    http: 422
    condition: "a claim the brief requires has a false eligibility flag on the formula being submitted"
  - id: ERR_MAX_USE_EXCEEDED
    http: 422
    condition: "a component's weight_pct exceeds its raw material's max_use_ppm / 10000 percent safety ceiling"
  - id: ERR_SUBSTANTIATION_REVOKED
    http: 422
    condition: "dispatch attempted while a certificate-backed packet document points at a SubstantiationRecord in status REVOKED"

  # --- graph and capacity constraints ---
  - id: ERR_FORMULA_CYCLE
    http: 422
    condition: "the SUB_FORMULA line would make the component DAG cyclic (self-reference or transitive containment of the parent formula)"
  - id: ERR_FORMULA_NO_COMPONENTS
    http: 422
    condition: "costing attempted on a formula with component_count == 0"
  - id: ERR_WEIGHT_SUM_INVALID
    http: 422
    condition: "total_weight_pct != 100.0000 at costing time, or a new component would drive total_weight_pct above 100.0000"
  - id: ERR_CABINET_CAPACITY_EXCEEDED
    http: 422
    condition: "the aggregate slot demand of the overlapping STORED aliquots plus the candidate exceeds the cabinet's capacity_slots"

  # --- temporal ---
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "stored_from >= stored_until, window_start > window_end, or a grant's expires_at at or before the logical clock"
  - id: ERR_RETENTION_PERIOD_TOO_SHORT
    http: 422
    condition: "the retention interval spans fewer than RETENTION_MIN_PERIOD_DAYS (90) days"
  - id: ERR_RIG_WINDOW_CONFLICT
    http: 409
    condition: "the candidate rig window is not separated from a SCHEDULED or IN_PROGRESS test on the same rig by strictly more than cleanout_buffer_minutes"
  - id: ERR_PACKET_EXPIRED
    http: 422
    condition: "dispatch attempted while packet_valid_until is strictly before the logical clock"

  # --- referential coherence ---
  - id: ERR_COMPONENT_TYPE_MISMATCH
    http: 422
    condition: "component_type does not match the populated reference field (or both / neither reference is supplied)"
  - id: ERR_DOC_PACKET_INCOMPLETE
    http: 422
    condition: "a certificate-backed required document type has no unexpired VERIFIED SubstantiationRecord on some transitive leaf material"
  - id: ERR_PINNED_DOC_STALE
    http: 422
    condition: "dispatch attempted while a packet document is STALE or its pinned_substantiation_version no longer equals the record's current version"
  - id: ERR_RIG_MATRIX_MISMATCH
    http: 422
    condition: "the rig's matrix_type differs from the brief's matrix_type"
  - id: ERR_DOSAGE_MISMATCH
    http: 422
    condition: "the application test's dosage_pct differs from the brief's dosage_pct"
  - id: ERR_GRANT_FORMULA_MISMATCH
    http: 422
    condition: "the grant's formula_id names a Formula whose brief_id differs from the grant's brief_id"
  - id: ERR_PARENT_FORMULA_MISMATCH
    http: 422
    condition: "parent_formula_id names a Formula belonging to a different brief"

  # --- fiscal / capacity of mass and cost ---
  - id: ERR_INSUFFICIENT_SAMPLE_MASS
    http: 422
    condition: "the requested grams exceed the lot's available_g"
  - id: ERR_COST_IN_USE_CAP_EXCEEDED
    http: 422
    condition: "bench_cost_in_use_cents_per_tonne exceeds the brief's cost_in_use_cap_cents_per_tonne at submit time"

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
# Peer roles with a segregation-of-duties overlay: the Flavorist who submits a
# formula cannot be the identity that approves it, and the LabTech who
# compounded a lot cannot be the identity that records its QC verdict. Both
# comparisons are on X-User-ID; no role is backed by a persisted entity, so
# every identity is opaque and the SoD comparison is value-to-value against the
# audit fields the server stamped earlier.

roles:
  - name: AccountManager
    description: "Owns the customer relationship: brief intake, win/loss closure, sample shipments to the customer and the commercialization forecast"
    identity: opaque
    exclusive_operations:
      - "POST /customer-briefs"
      - "POST /customer-briefs/{brief_id}/submit"
      - "POST /customer-briefs/{brief_id}/close"
      - "POST /shipments"
      - "POST /shipments/{shipment_id}/cancel"
      - "POST /commercialization-forecasts"
    shared_operations:
      - "every GET endpoint in §1.5"
      - "POST /_clock/set_current_utc"

  - name: TechnicalDirector
    description: "Gatekeeper of intake decisions, formula approval, scale-up costing and tolerance, and IP disclosure grants"
    identity: opaque
    exclusive_operations:
      - "POST /customer-briefs/{brief_id}/clarification-request"
      - "POST /customer-briefs/{brief_id}/decision"
      - "POST /formulas/{formula_id}/decision"
      - "POST /scale-up-batches"
      - "POST /scale-up-batches/{batch_id}/tolerance"
      - "POST /scale-up-batches/{batch_id}/decision"
      - "POST /disclosure-grants"
    shared_operations:
      - "every GET endpoint in §1.5"
      - "POST /_clock/set_current_utc"

  - name: Flavorist
    description: "Creates and iterates bench formulas, builds the component DAG, costs and submits them for approval"
    identity: opaque
    exclusive_operations:
      - "POST /formulas"
      - "POST /formulas/{formula_id}/components"
      - "POST /formulas/{formula_id}/cost"
      - "POST /formulas/{formula_id}/submit"
      - "POST /formulas/{formula_id}/revisions"
    shared_operations:
      - "every GET endpoint in §1.5"
      - "POST /_clock/set_current_utc"

  - name: RegulatoryAffairs
    description: "Files, verifies and revokes claim substantiation, and assembles and dispatches the regulatory documentation packet"
    identity: opaque
    exclusive_operations:
      - "POST /substantiation-records"
      - "POST /substantiation-records/{record_id}/verify"
      - "POST /substantiation-records/{record_id}/revoke"
      - "POST /shipments/{shipment_id}/assemble-packet"
      - "POST /shipments/{shipment_id}/dispatch"
    shared_operations:
      - "every GET endpoint in §1.5"
      - "POST /_clock/set_current_utc"

  - name: LabTech
    description: "Compounds sample lots, records QC verdicts, releases lots, manages retention storage and runs application tests and pilot batches"
    identity: opaque
    exclusive_operations:
      - "POST /sample-lots"
      - "POST /sample-lots/{lot_id}/qc"
      - "POST /sample-lots/{lot_id}/release"
      - "POST /retention-cabinets"
      - "POST /retention-samples"
      - "POST /retention-samples/{retention_id}/withdraw"
      - "POST /application-rigs"
      - "POST /application-tests"
      - "POST /application-tests/{test_id}/start"
      - "POST /application-tests/{test_id}/result"
      - "POST /scale-up-batches/{batch_id}/pilot-run"
    shared_operations:
      - "every GET endpoint in §1.5"
      - "POST /_clock/set_current_utc"

  - name: PurchasingManager
    description: "Maintains the raw-material catalogue and its list prices; a reprice re-costs every formula that transitively contains the material"
    identity: opaque
    exclusive_operations:
      - "POST /raw-materials"
      - "PATCH /raw-materials/{material_id}"
    shared_operations:
      - "every GET endpoint in §1.5"
      - "POST /_clock/set_current_utc"
