        grounds: ["errors[ERR_SUBSTITUTION_CONFLICT]", "validations[priority=14]"]
        distinguishing_aspect: "Activating a second rule for the same from_ingredient with an overlapping window is rejected with ERR_SUBSTITUTION_CONFLICT; an overlapping window for a DIFFERENT from_ingredient is accepted."
        test_recipe:
          setup:
            - "Restaurant R1; ingredients A, B, C ACTIVE; rule1 A->B window 00:00-12:00 ACTIVE; rule2 A->C window 06:00-18:00 PENDING; rule3 B->C window 06:00-18:00 PENDING"
