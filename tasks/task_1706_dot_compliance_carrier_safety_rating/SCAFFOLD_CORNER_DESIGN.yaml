  # ===========================================================================
  - section: calculations
    instances:
      - name: time_weight_12_24_month_boundaries
        claim_type: threshold_boundary
        grounds: [calculations.violation_time_weight]
        distinguishing_aspect: "The 12-month and 24-month interval starts are inclusive: occurred == as_of-12mo -> tw 2; occurred == as_of-24mo -> tw 1; one day older than 24mo -> tw 0 (excluded from the measure entirely)."
        test_recipe:
          setup:
            - "Carrier fleet_size 5; category UNSAFE_DRIVING threshold 65 benchmark 10.0; driver; inspection holding: A occurred 2025-08-01 (== clock-12mo) sev 5, B occurred 2024-08-01 (== clock-24mo) sev 5, C occurred 2024-07-31 (older than 24mo) sev 5"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2201", legal_name: "Calc Carrier One", fleet_size: 5 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "UNSAFE_DRIVING", display_name: "UD", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2201", full_name: "Nia Ogg", hire_date: "2024-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/roadside-inspections", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", report_number: "R-2201", inspection_date: "2024-07-31T00:00:00Z", inspection_level: 2, state_code: "MN" }, as: SafetyManager, captures: { i_id: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "A", severity_weight: 5, occurred_at: "2025-08-01T00:00:00Z" }, as: SafetyManager, captures: { va: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "B", severity_weight: 5, occurred_at: "2024-08-01T00:00:00Z" }, as: SafetyManager, captures: { vb: $.data.id } }
            - { call: "POST /safety/inspection-violations", payload: { inspection_id: "${i_id}", category_id: "${cat_id}", violation_code: "C", severity_weight: 5, occurred_at: "2024-07-31T00:00:00Z" }, as: SafetyManager, captures: { vc: $.data.id } }
          trigger:
            - { call: "POST /safety/measurement-cycles", payload: { carrier_id: "${c_id}" }, as: ComplianceAnalyst }
            - { call: "GET /safety/inspection-violations/${va}", payload: {}, as: ComplianceAnalyst, captures: { twa: $.data.time_weight_multiplier } }
            - { call: "GET /safety/inspection-violations/${vb}", payload: {}, as: ComplianceAnalyst, captures: { twb: $.data.time_weight_multiplier } }
            - { call: "GET /safety/inspection-violations/${vc}", payload: {}, as: ComplianceAnalyst, captures: { twc: $.data.time_weight_multiplier } }
          assert:
            - "A (== as_of-12mo): time_weight_multiplier == 2, weighted_points == 10"
            - "B (== as_of-24mo): time_weight_multiplier == 1, weighted_points == 5"
            - "C (older than 24mo): time_weight_multiplier == 0, weighted_points == 0 and excluded from the measure"
            - "snapshot official_measure == 3.00 ((10+5+0)/5) and official_percentile == 30"

      - name: crash_indicator_input_set_filtering
        claim_type: input_set_filtering
        grounds: [calculations.category_measure, calculations.crash_severity_points]
        distinguishing_aspect: "CRASH_INDICATOR counts only dot_reportable accidents and ignores preventability: a NOT_PREVENTABLE reportable crash still contributes (2 pts x tw 3), a non-reportable one contributes nothing; official == provisional because crashes are not challengeable."
        test_recipe:
          setup:
            - "Carrier fleet_size 5; category CRASH_INDICATOR threshold 65 benchmark 10.0; driver; accident1 (2026-05-01, injuries 1) determined NOT_PREVENTABLE; accident2 (2026-05-02, all zero, no tow) not reportable"
          setup_api_calls:
            - { call: "POST /safety/carriers", payload: { dot_number: "DOT-2202", legal_name: "Calc Carrier Two", fleet_size: 5 }, as: SafetyAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /safety/violation-categories", payload: { category_code: "CRASH_INDICATOR", display_name: "Crash", intervention_threshold: 65, benchmark_measure: 10.0 }, as: SafetyAdmin, captures: { cat_id: $.data.id } }
            - { call: "POST /safety/drivers", payload: { carrier_id: "${c_id}", cdl_number: "CDL-2202", full_name: "Ott Ilo", hire_date: "2024-01-01T00:00:00Z" }, as: SafetyManager, captures: { d_id: $.data.id } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-05-01T00:00:00Z", fatalities: 0, injuries: 1, tow_away: false }, as: SafetyManager, as_user_id: "sm-1", captures: { a1: $.data.id } }
            - { call: "POST /safety/accident-records", payload: { carrier_id: "${c_id}", driver_id: "${d_id}", occurred_at: "2026-05-02T00:00:00Z", fatalities: 0, injuries: 0, tow_away: false }, as: SafetyManager, as_user_id: "sm-1", captures: { a2: $.data.id } }
            - { call: "POST /safety/accident-records/${a1}/determine-preventability", payload: { determination: "NOT_PREVENTABLE" }, as: SafetyDirector, as_user_id: "sd-1" }
