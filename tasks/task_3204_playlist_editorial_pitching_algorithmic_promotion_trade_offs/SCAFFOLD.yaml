# =============================================================================
# SCAFFOLD — task_3204_playlist_editorial_pitching_algorithmic_promotion_trade_offs
# Playlist Editorial Pitching & Algorithmic Promotion Trade-Offs (Spotify-like)
# =============================================================================

scenario: |
  Playlist Editorial Pitching & Algorithmic Promotion Trade-Offs (Spotify):
  release submission with metadata, genre and mood tagging ahead of a release
  date for editorial consideration, editorial playlist curation across teams
  with placement decisions and rotation cadence, algorithmic personalization
  pipelines that respond to early listener signals from editorial placement,
  promotional programs where a rights holder accepts a reduced royalty rate
  for increased algorithmic exposure with disclosure, artist profile control,
  canvas and merchandise module management, fraud detection on artificial
  streaming with royalty clawback and content removal, release date changes,
  pre-save campaigns and territory restrictions, royalty pool computation
  effects when playlist listening shifts share.

domain_name: playlist-editorial-promotion
api_prefix: /catalog

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Artist
    parent: null
    common_fields: true
    fields:
      - { name: stage_name, type: string, source: input, description: "Artist display name" }
      - { name: primary_genre, type: enum, source: input, description: "POP | HIPHOP | ROCK | ELECTRONIC | LATIN | COUNTRY | JAZZ | CLASSICAL" }
      - { name: home_territory, type: string, source: input, description: "ISO 3166-1 alpha-2 territory code of the artist's home market" }
      - { name: follower_count, type: integer, source: input, description: "Follower count at profile setup; drives boost tier", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }
      - { name: fraud_strikes, type: integer, source: computed, description: "Count of FraudCase rows with verdict CONFIRMED for this artist", default: 0 }

  - name: Release
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id; owning rights-holder artist" }
      - { name: title, type: string, source: input, description: "Release title" }
      - { name: release_type, type: enum, source: input, description: "SINGLE | EP | ALBUM" }
      - { name: release_date, type: datetime, source: input, description: "Scheduled go-live instant; mutable while SCHEDULED via the change-date action" }
      - { name: territory_allowlist, type: array, source: input, description: "ISO alpha-2 codes where the release is streamable; empty array means worldwide", default: [] }
      - { name: genre_tags, type: array, source: input, description: "1-3 genre tags drawn from the Artist genre enum" }
      - { name: mood_tags, type: array, source: input, description: "0-4 mood tags: CHILL | ENERGETIC | MELANCHOLY | FOCUS | PARTY | ROMANTIC" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | LIVE | REMOVED" }
      - { name: date_change_count, type: integer, source: computed, description: "Number of accepted release-date changes", default: 0 }
      - { name: presave_count, type: integer, source: computed, description: "Number of non-cancelled PreSave rows for this release", default: 0 }

  - name: Track
    parent: null
    common_fields: true
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> Release.id" }
      - { name: title, type: string, source: input, description: "Track title" }
      - { name: duration_ms, type: integer, source: input, description: "Track length in milliseconds", constraints: ">= 30000" }
      - { name: is_focus_track, type: boolean, source: input, description: "Exactly one focus track per release; only the focus track is pitchable", default: false }
      - { name: status, type: enum, source: system, description: "AVAILABLE | REMOVED" }

  - name: PitchSubmission
    parent: null
    common_fields: true
    fields:
      - { name: track_id, type: string, source: input, description: "FK -> Track.id; must be the release's focus track" }
      - { name: pitch_text, type: string, source: input, description: "Editorial pitch narrative", constraints: "1-2000 chars" }
      - { name: target_playlist_id, type: string, source: input, description: "FK -> EditorialPlaylist.id the pitch asks for" }
      - { name: status, type: enum, source: system, description: "PITCHED | UNDER_REVIEW | NEEDS_REVISION | ACCEPTED | REJECTED | WITHDRAWN" }
      - { name: submitted_days_before_release, type: integer, source: computed, description: "Whole days between submission instant and Release.release_date at submission time" }
      - { name: revision_round, type: integer, source: computed, description: "Number of times the pitch has re-entered PITCHED after NEEDS_REVISION", default: 0 }

  - name: EditorialPlaylist
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Playlist display name" }
      - { name: genre_focus, type: enum, source: input, description: "Same genre enum as Artist.primary_genre" }
      - { name: mood_focus, type: enum, source: input, description: "CHILL | ENERGETIC | MELANCHOLY | FOCUS | PARTY | ROMANTIC | ANY" }
      - { name: slot_count, type: integer, source: input, description: "Number of simultaneous placement slots", constraints: "1-50" }
      - { name: rotation_cadence_days, type: integer, source: input, description: "Days an ACTIVE placement may stay before it must rotate out", constraints: ">= 1" }
      - { name: owning_team, type: enum, source: input, description: "EDITORIAL_A | EDITORIAL_B — team that owns placement decisions" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: PlaylistPlacement
    parent: null
    common_fields: true
    fields:
      - { name: playlist_id, type: string, source: input, description: "FK -> EditorialPlaylist.id" }
      - { name: track_id, type: string, source: input, description: "FK -> Track.id" }
      - { name: pitch_id, type: string, source: input, description: "FK -> PitchSubmission.id that justified the placement" }
      - { name: slot_index, type: integer, source: input, description: "Slot within the playlist, 0..slot_count-1" }
      - { name: activated_on, type: datetime, source: system, description: "Instant the placement entered ACTIVE" }
      - { name: scheduled_rotation_on, type: datetime, source: computed, description: "activated_on + rotation_cadence_days" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | ROTATED_OUT | REINSTATED | EVICTED" }

  - name: PromotionEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: track_id, type: string, source: input, description: "FK -> Track.id; one enrollment per track per non-overlapping window" }
      - { name: discount_factor, type: number, source: input, description: "Royalty multiplier the rights holder accepts, in (0,1); 0.5 means half royalty", constraints: "0 < discount_factor < 1" }
      - { name: starts_on, type: datetime, source: input, description: "Enrollment window start (closed bound)" }
      - { name: ends_on, type: datetime, source: input, description: "Enrollment window end (open bound); must be strictly after starts_on" }
      - { name: disclosure_token, type: string, source: system, description: "Server-minted disclosure receipt returned on enroll; required to suspend" }
      - { name: status, type: enum, source: system, description: "ENROLLED | SUSPENDED | TERMINATED" }

  - name: StreamEvent
    parent: null
    common_fields: false
    fields:
      - { name: track_id, type: string, source: input, description: "FK -> Track.id" }
      - { name: territory, type: string, source: input, description: "ISO alpha-2 where the stream occurred" }
      - { name: source, type: enum, source: input, description: "EDITORIAL_PLAYLIST | ALGORITHMIC | ORGANIC" }
      - { name: occurred_on, type: datetime, source: input, description: "Stream instant; must fall inside an OPEN royalty period" }
      - { name: ms_played, type: integer, source: input, description: "Milliseconds played", constraints: ">= 0" }
      - { name: is_tainted, type: boolean, source: computed, description: "Set true when a CONFIRMED fraud case covers this track and window", default: false }
      - { name: royalty_period_id, type: string, source: system, description: "FK -> RoyaltyPeriod.id of the OPEN period at ingest time" }

  - name: FraudCase
    parent: null
    common_fields: true
    fields:
      - { name: track_id, type: string, source: input, description: "FK -> Track.id under investigation" }
      - { name: window_start, type: datetime, source: input, description: "Start (closed) of the suspected artificial-streaming window" }
      - { name: window_end, type: datetime, source: input, description: "End (open) of the suspected window" }
      - { name: signal_bot_ratio, type: number, source: input, description: "Bot-traffic ratio signal in [0,1]" }
      - { name: signal_velocity_zscore, type: number, source: input, description: "Stream velocity z-score, normalized to [0,1]" }
      - { name: signal_device_concentration, type: number, source: input, description: "Device concentration signal in [0,1]" }
      - { name: confidence_score, type: number, source: computed, description: "Weighted fraud confidence per calculation fraud_confidence_score" }
      - { name: verdict, type: enum, source: system, description: "OPEN | AUTO_FLAGGED | CONFIRMED | DISMISSED" }
      - { name: clawback_cents, type: integer, source: computed, description: "Royalty cents clawed back on CONFIRMED", default: 0 }

  - name: RoyaltyPeriod
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Period start (closed)" }
      - { name: period_end, type: datetime, source: input, description: "Period end (open); strictly after period_start" }
      - { name: pool_cents, type: integer, source: input, description: "Total royalty pool for the period", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED | SETTLED" }
      - { name: closed_variant, type: enum, source: system, description: "GROSS | EFFECTIVE — share variant frozen at close time" }

  - name: RoyaltyStatement
    parent: null
    common_fields: true
    fields:
      - { name: period_id, type: string, source: system, description: "FK -> RoyaltyPeriod.id" }
      - { name: artist_id, type: string, source: system, description: "FK -> Artist.id" }
      - { name: raw_streams, type: integer, source: computed, description: "Non-tainted stream count for the artist in the period" }
      - { name: effective_streams, type: number, source: computed, description: "Discount-adjusted stream count per calculation royalty_pool_share" }
      - { name: share_bps, type: integer, source: computed, description: "Artist share in basis points of the variant denominator" }
      - { name: gross_payout_cents, type: integer, source: computed, description: "Pre-clawback payout from pool_cents × share" }
      - { name: clawback_cents, type: integer, source: computed, description: "Clawbacks applied from CONFIRMED fraud cases", default: 0 }
      - { name: net_payout_cents, type: integer, source: computed, description: "gross_payout_cents - clawback_cents; may be negative" }

  - name: ProfileModule
    parent: null
    common_fields: true
    fields:
      - { name: artist_id, type: string, source: input, description: "FK -> Artist.id whose profile carries the module" }
      - { name: module_type, type: enum, source: input, description: "CANVAS | MERCH" }
      - { name: track_id, type: string, source: input, description: "FK -> Track.id; required for CANVAS (the track the canvas loops on), ignored for MERCH" }
      - { name: payload_uri, type: string, source: input, description: "Media or storefront URI" }
      - { name: status, type: enum, source: system, description: "ENABLED | DISABLED" }

  - name: PreSave
    parent: null
    common_fields: false
    fields:
      - { name: release_id, type: string, source: input, description: "FK -> Release.id" }
      - { name: fan_token, type: string, source: input, description: "Opaque fan identifier; unique per release" }
      - { name: territory, type: string, source: input, description: "ISO alpha-2 of the fan" }
      - { name: status, type: enum, source: system, description: "SAVED | CONVERTED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Artist
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (fraud_strikes reaches FRAUD_STRIKE_LIMIT after a CONFIRMED verdict) or POST /catalog/artists/{id}/suspend"
        actor: "system or FraudAnalyst"
        preconditions: []
        side_effects:
          - "All ENROLLED PromotionEnrollment rows for the artist's tracks -> TERMINATED (disclosure preserved)"
          - "All ACTIVE or REINSTATED PlaylistPlacement rows for the artist's tracks -> EVICTED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /catalog/artists/{id}/reinstate"
        actor: FraudAnalyst
        preconditions:
          - "fraud_strikes < FRAUD_STRIKE_LIMIT"
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (fraud_strikes reaches TERMINATION_STRIKE_LIMIT)"
        actor: system
        preconditions: []
        side_effects:
          - "All AVAILABLE tracks -> REMOVED; all non-terminal PlaylistPlacement -> EVICTED; all ENROLLED/SUSPENDED enrollments -> TERMINATED; all ENABLED ProfileModule -> DISABLED"

  - entity: Release
    initial_state: SCHEDULED
    terminal_states: [REMOVED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "system (logical clock reaches release_date)"
        actor: system
        preconditions:
          - "Release.artist.status == ACTIVE"
        side_effects:
          - "Every PreSave with status SAVED and territory inside territory_allowlist (or allowlist empty) -> CONVERTED; all other SAVED rows -> CANCELLED"
          - "presave_count is recomputed as the count of remaining SAVED or CONVERTED rows"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /catalog/releases/{id}/change-date"
        actor: RightsHolder
        preconditions:
          - "Release.status == SCHEDULED"
          - "new release_date is strictly in the future of the logical clock"
          - "logical clock is at least PITCH_WINDOW_DAYS before the OLD release_date (no date changes inside the pitch window)"
          - "date_change_count < MAX_DATE_CHANGES"
          - "expected_release_version matches Release.version"
        side_effects:
          - "release_date replaced; date_change_count + 1"
          - "Any PitchSubmission in PITCHED / UNDER_REVIEW / NEEDS_REVISION whose submitted_days_before_release would fall below MIN_PITCH_LEAD_DAYS under the new date -> WITHDRAWN"
      - from: SCHEDULED
        to: REMOVED
        trigger: "POST /catalog/releases/{id}/remove"
        actor: RightsHolder
        preconditions:
          - "Release.status == SCHEDULED"
        side_effects:
          - "All AVAILABLE tracks -> REMOVED; all SAVED PreSave -> CANCELLED; all PITCHED/UNDER_REVIEW/NEEDS_REVISION pitches on its tracks -> WITHDRAWN"
      - from: LIVE
        to: REMOVED
        trigger: "system (Artist TERMINATED) or POST /catalog/releases/{id}/remove"
        actor: "system or FraudAnalyst"
        preconditions: []
        side_effects:
          - "All AVAILABLE tracks -> REMOVED; all non-terminal PlaylistPlacement on its tracks -> EVICTED; ENROLLED/SUSPENDED enrollments -> TERMINATED"

  - entity: PitchSubmission
    initial_state: PITCHED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: PITCHED
        to: UNDER_REVIEW
        trigger: "POST /catalog/pitches/{id}/claim"
        actor: PlaylistEditor
        preconditions:
          - "Pitch.status == PITCHED"
          - "Editor's team owns the target playlist (owning_team matches editor team claim)"
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_REVISION
        trigger: "POST /catalog/pitches/{id}/request-revision"
        actor: PlaylistEditor
        preconditions:
          - "Pitch.status == UNDER_REVIEW"
        side_effects: []
      - from: NEEDS_REVISION
        to: PITCHED
        trigger: "POST /catalog/pitches/{id}/revise"
        actor: RightsHolder
        preconditions:
          - "Pitch.status == NEEDS_REVISION"
          - "revision_round < MAX_REVISION_ROUNDS"
          - "Release of the track is still SCHEDULED and logical clock is at least MIN_PITCH_LEAD_DAYS before release_date"
        side_effects:
          - "revision_round + 1"
          - "pitch_text replaced"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /catalog/pitches/{id}/decide with decision ACCEPT"
        actor: EditorialLead
        preconditions:
          - "Pitch.status == UNDER_REVIEW"
          - "Release.status == SCHEDULED"
          - "Release.artist.status == ACTIVE"
        side_effects:
          - "A PlaylistPlacement row is created in SCHEDULED for the target playlist's next free slot (see selector placement_slot_selector)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /catalog/pitches/{id}/decide with decision REJECT"
        actor: EditorialLead
        preconditions:
          - "Pitch.status == UNDER_REVIEW"
        side_effects: []
      - from: PITCHED
        to: WITHDRAWN
        trigger: "POST /catalog/pitches/{id}/withdraw or system (release date change / release removal)"
        actor: "RightsHolder or system"
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /catalog/pitches/{id}/withdraw or system (release date change / release removal)"
        actor: "RightsHolder or system"
        preconditions: []
        side_effects: []
      - from: NEEDS_REVISION
        to: WITHDRAWN
        trigger: "POST /catalog/pitches/{id}/withdraw or system (release date change / release removal)"
        actor: "RightsHolder or system"
        preconditions: []
        side_effects: []

  - entity: PlaylistPlacement
    initial_state: SCHEDULED
    terminal_states: [EVICTED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "POST /catalog/placements/{id}/activate"
        actor: PlaylistEditor
        preconditions:
          - "Placement.status == SCHEDULED"
          - "EditorialPlaylist.status == ACTIVE"
          - "Track.status == AVAILABLE and Release.status == LIVE"
          - "No other ACTIVE or REINSTATED placement occupies (playlist_id, slot_index)"
        side_effects:
          - "activated_on := logical clock; scheduled_rotation_on := activated_on + playlist.rotation_cadence_days"
      - from: ACTIVE
        to: ROTATED_OUT
        trigger: "POST /catalog/placements/{id}/rotate or system (clock reaches scheduled_rotation_on)"
        actor: "PlaylistEditor or system"
        preconditions:
          - "Placement.status == ACTIVE or REINSTATED"
          - "For the manual trigger: logical clock >= scheduled_rotation_on (rotation before cadence end is forbidden)"
        side_effects:
          - "Slot (playlist_id, slot_index) becomes free"
      - from: REINSTATED
        to: ROTATED_OUT
        trigger: "POST /catalog/placements/{id}/rotate or system (clock reaches scheduled_rotation_on)"
        actor: "PlaylistEditor or system"
        preconditions:
          - "logical clock >= scheduled_rotation_on"
        side_effects:
          - "Slot (playlist_id, slot_index) becomes free"
      - from: ROTATED_OUT
        to: REINSTATED
        trigger: "POST /catalog/placements/{id}/reinstate"
        actor: PlaylistEditor
        preconditions:
          - "Placement.status == ROTATED_OUT"
          - "EditorialPlaylist.status == ACTIVE"
          - "Track.status == AVAILABLE and Release.status == LIVE"
          - "No other ACTIVE or REINSTATED placement occupies (playlist_id, slot_index)"
        side_effects:
          - "activated_on := logical clock; scheduled_rotation_on := activated_on + rotation_cadence_days"
      - from: ACTIVE
        to: EVICTED
        trigger: "system (track REMOVED, artist SUSPENDED/TERMINATED, playlist RETIRED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REINSTATED
        to: EVICTED
        trigger: "system (track REMOVED, artist SUSPENDED/TERMINATED, playlist RETIRED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: EVICTED
        trigger: "system (track REMOVED, artist SUSPENDED/TERMINATED, playlist RETIRED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PromotionEnrollment
    initial_state: ENROLLED
    terminal_states: [TERMINATED]
    transitions:
      - from: ENROLLED
        to: SUSPENDED
        trigger: "POST /catalog/promotions/{id}/suspend"
        actor: RightsHolder
        preconditions:
          - "Enrollment.status == ENROLLED"
          - "Request carries the disclosure_token returned at enroll time"
        side_effects: []
      - from: SUSPENDED
        to: ENROLLED
        trigger: "POST /catalog/promotions/{id}/resume"
        actor: RightsHolder
        preconditions:
          - "Enrollment.status == SUSPENDED"
          - "Logical clock < ends_on"
          - "No other ENROLLED row for the same track overlaps [starts_on, ends_on)"
          - "Artist of the track is ACTIVE and has no OPEN or AUTO_FLAGGED FraudCase on this track"
        side_effects: []
      - from: ENROLLED
        to: TERMINATED
        trigger: "POST /catalog/promotions/{id}/terminate or system (fraud CONFIRMED, artist suspension/termination, track removal)"
        actor: "RightsHolder or FraudAnalyst or system"
        preconditions: []
        side_effects:
          - "Streams already recorded keep their discount_factor snapshot; future effective_streams stop accruing discount"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /catalog/promotions/{id}/terminate or system (fraud CONFIRMED, artist suspension/termination, track removal)"
        actor: "RightsHolder or FraudAnalyst or system"
        preconditions: []
        side_effects: []

  - entity: FraudCase
    initial_state: OPEN
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: OPEN
        to: AUTO_FLAGGED
        trigger: "system (confidence_score >= FRAUD_AUTO_FLAG_THRESHOLD computed at case creation)"
        actor: system
        preconditions: []
        side_effects:
          - "ENROLLED PromotionEnrollment on the track -> SUSPENDED is NOT applied; instead enrollment remains but new pitch submissions on the track are blocked"
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /catalog/fraud-cases/{id}/adjudicate with verdict CONFIRM"
        actor: FraudAnalyst
        preconditions:
          - "Case.verdict in {OPEN, AUTO_FLAGGED}"
          - "confidence_score >= FRAUD_CONFIRM_THRESHOLD"
        side_effects:
          - "Every StreamEvent for the track with occurred_on in [window_start, window_end) -> is_tainted := true"
          - "clawback_cents computed per calculation clawback_amount and applied to the artist's next unsettled RoyaltyStatement (or a negative adjustment if none exists)"
          - "ENROLLED/SUSPENDED PromotionEnrollment rows on the track -> TERMINATED"
          - "ACTIVE/REINSTATED PlaylistPlacement rows on the track -> EVICTED"
          - "Artist.fraud_strikes + 1; if fraud_strikes reaches FRAUD_STRIKE_LIMIT the artist SUSPENDS (cascade), at TERMINATION_STRIKE_LIMIT the artist TERMINATES (cascade incl. track removal)"
      - from: AUTO_FLAGGED
        to: CONFIRMED
        trigger: "POST /catalog/fraud-cases/{id}/adjudicate with verdict CONFIRM"
        actor: FraudAnalyst
        preconditions:
          - "confidence_score >= FRAUD_CONFIRM_THRESHOLD"
        side_effects:
          - "Same as OPEN -> CONFIRMED"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /catalog/fraud-cases/{id}/adjudicate with verdict DISMISS"
        actor: FraudAnalyst
        preconditions: []
        side_effects: []
      - from: AUTO_FLAGGED
        to: DISMISSED
        trigger: "POST /catalog/fraud-cases/{id}/adjudicate with verdict DISMISS"
        actor: FraudAnalyst
        preconditions: []
        side_effects: []

  - entity: RoyaltyPeriod
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /catalog/royalty-periods/{id}/close"
        actor: PlatformAdmin
        preconditions:
          - "Period.status == OPEN"
          - "logical clock >= period_end"
          - "expected_period_version matches RoyaltyPeriod.version"
        side_effects:
          - "closed_variant := request variant (GROSS or EFFECTIVE)"
          - "RoyaltyStatement rows generated for every artist with >= 1 non-tainted stream in the period, per calculation royalty_pool_share"
      - from: CLOSED
        to: SETTLED
        trigger: "POST /catalog/royalty-periods/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "Period.status == CLOSED"
        side_effects:
          - "Statements become immutable; pending clawback_cents are locked into net_payout_cents"

  - entity: ProfileModule
    initial_state: ENABLED
    terminal_states: [DISABLED]
    transitions:
      - from: ENABLED
        to: DISABLED
        trigger: "POST /catalog/profile-modules/{id}/disable or system (artist TERMINATED, or CANVAS track REMOVED)"
        actor: "RightsHolder or system"
        preconditions: []
        side_effects: []

  - entity: PreSave
    initial_state: SAVED
    terminal_states: [CONVERTED, CANCELLED]
    transitions:
      - from: SAVED
        to: CANCELLED
        trigger: "POST /catalog/presaves/{id}/cancel or system (release removal, release go-live territory mismatch)"
        actor: "RightsHolder or system"
        preconditions: []
        side_effects:
          - "Release.presave_count recomputed"
      - from: SAVED
        to: CONVERTED
        trigger: "system (release go-live when territory allowed)"
        actor: system
        preconditions: []
        side_effects:
          - "Release.presave_count recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: release-change-date-stale-version
    parent_entity: Release
    write_endpoint: "POST /catalog/releases/{id}/change-date"
    occ_field: expected_release_version
    description: |
      Changing a Release's date against a Release version the client has not
      observed is rejected. The version may have advanced because another
      writer changed the date (which legitimately supersedes the old schedule)
      or because a cascade (pitch withdrawal, presave conversion prep) bumped
      it; the writer's view of the schedule is stale either way.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: period-close-stale-version
    parent_entity: RoyaltyPeriod
    write_endpoint: "POST /catalog/royalty-periods/{id}/close"
    occ_field: expected_period_version
    description: |
      Closing a RoyaltyPeriod against a version the client has not observed is
      rejected: closing freezes closed_variant and materializes statements, so
      a stale view of the period (e.g. pool_cents already amended by another
      admin) must not be the basis of the close.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: royalty_pool_share
    trigger: "RoyaltyPeriod OPEN -> CLOSED (statement generation)"
    algorithm: waterfall_allocation
    formula: |
      1. Input set: StreamEvent rows with royalty_period_id == period.id AND is_tainted == false.
      2. For each stream on track t: weight = 1.0 if no PromotionEnrollment row
         for t has status in {ENROLLED, SUSPENDED, TERMINATED} with
         starts_on <= stream.occurred_on < ends_on; otherwise weight = that
         enrollment's discount_factor. (Enrollment windows are non-overlapping
         per track, so at most one row matches.)
      3. Per artist a: raw_streams(a) = count of matching streams;
         effective_streams(a) = sum of weights (2-decimal rounding per stream,
         round_half_up, then summed).
      4. Variant GROSS: denominator = sum of raw_streams over all artists;
         share_bps(a) = round_half_up(10000 * raw_streams(a) / denominator).
      5. Variant EFFECTIVE: denominator = sum of effective_streams over all
         artists; share_bps(a) = round_half_up(10000 * effective_streams(a) /
         denominator).
      6. gross_payout_cents(a) = floor(pool_cents * share_bps(a) / 10000).
      7. Remainder R = pool_cents - sum of gross_payout_cents. Distribute R one
         cent at a time to artists ordered by share_bps DESC, tie-break by
         Artist.created_at ASC, until R == 0. (Rounding order is pinned:
         per-artist floor FIRST, remainder waterfall SECOND.)
    input_set: "StreamEvent in the period with is_tainted == false"
    constants:
      BPS_BASE: 10000
    precision: "stream weights 2 dp round_half_up; share in integer basis points; payouts in integer cents"
    variants:
      - name: GROSS
        when: "close request carries variant GROSS"
        difference: "Denominator and numerator use raw stream counts; promotion discount has no effect on share."
      - name: EFFECTIVE
        when: "close request carries variant EFFECTIVE"
        difference: "Discount-enrolled streams count at discount_factor weight, reducing the enrolled artist's share and redistributing pool share to other artists."

  - name: editorial_boost_score
    trigger: "POST /catalog/tracks/{id}/signal-rollup (early listener signals from editorial placement)"
    algorithm: weighted_scoring
    formula: |
      Inputs from the rollup window (all rates in [0,1], computed over
      non-tainted streams of the track):
        save_rate = saves / streams; completion_rate = completions / streams;
        skip_rate = skips / streams.
      Tier multiplier from Artist.follower_count:
        follower_count < 10000      -> TIER_MULTIPLIER = 0.8
        10000 <= follower_count < 100000 -> 1.0
        follower_count >= 100000    -> 1.2
      raw = 100 * (0.5 * save_rate + 0.3 * completion_rate - 0.2 * skip_rate)
      score = min(BOOST_CAP, max(0, floor(raw * TIER_MULTIPLIER)))
      Boundary: raw exactly equal to BOOST_CAP keeps score == BOOST_CAP (min is
      inclusive); skip_rate so large that raw < 0 floors at 0, not negative.
    input_set: "rollup payload rates + Artist.follower_count"
    constants:
      BOOST_CAP: 90
    precision: "score is an integer; floor applied AFTER the tier multiplier"
    variants:
      - name: STANDARD
        when: "track has at least one ACTIVE or REINSTATED PlaylistPlacement during the window"
        difference: "score as computed above"
      - name: COLD_START
        when: "track had no editorial placement during the window"
        difference: "score is halved (floor(score / 2)) — algorithmic pipelines respond more weakly without editorial signal."

  - name: fraud_confidence_score
    trigger: "FraudCase creation"
    algorithm: weighted_scoring
    formula: |
      confidence_score = 0.40 * signal_bot_ratio
                       + 0.35 * signal_velocity_zscore
                       + 0.25 * signal_device_concentration
      Rounded to 4 decimal places, round_half_up.
      Verdict routing at creation:
        confidence_score >= FRAUD_AUTO_FLAG_THRESHOLD -> verdict AUTO_FLAGGED
        confidence_score <  FRAUD_AUTO_FLAG_THRESHOLD -> verdict OPEN
      Confirmation gate: adjudicate CONFIRM requires
        confidence_score >= FRAUD_CONFIRM_THRESHOLD (inclusive).
    input_set: "the three signal fields on the FraudCase"
    constants:
      FRAUD_AUTO_FLAG_THRESHOLD: 0.7000
      FRAUD_CONFIRM_THRESHOLD: 0.8500
    precision: "4 decimal places, round_half_up"

  - name: clawback_amount
    trigger: "FraudCase adjudicated CONFIRMED"
    algorithm: aggregation
    formula: |
      1. Tainted set: StreamEvent rows for the track with occurred_on in
         [window_start, window_end) — regardless of is_tainted prior value
         (a stream already tainted by another case contributes 0 to THIS case's
         clawback; it is not double-charged).
      2. effective_rate(stream) = 1.0, or the enrollment discount_factor if a
         PromotionEnrollment window covered occurred_on.
      3. clawback_cents = round_half_up(
           sum over newly-tainted streams of
             effective_rate(stream) * PER_STREAM_RATE_CENTS )
      4. If the artist has a RoyaltyStatement in a CLOSED-but-not-SETTLED
         period, the clawback is added to that statement's clawback_cents;
         otherwise it is recorded on the case and swept into the next
         statement generated for the artist.
    input_set: "StreamEvent for the track in the case window"
    constants:
      PER_STREAM_RATE_CENTS: 0.40
    precision: "2 decimal places, round_half_up"

  - name: placement_slot_selector
    trigger: "PitchSubmission UNDER_REVIEW -> ACCEPTED (placement creation)"
    algorithm: topological
    formula: |
      Eligibility filter: slot_index s in 0..playlist.slot_count-1 such that no
      PlaylistPlacement row exists with playlist_id == target, slot_index == s,
      and status in {ACTIVE, REINSTATED, SCHEDULED}.
      Ranking expression: s ASC (lowest free slot wins).
      Tie-break: none needed (slot indices are distinct integers).
      Empty-pool fallback: the decide call fails with ERR_NO_FREE_SLOT and the
      pitch stays UNDER_REVIEW.
    input_set: "PlaylistPlacement rows for the target playlist"
    constants: {}
    precision: "n/a"

  - name: presave_conversion
    trigger: "Release SCHEDULED -> LIVE"
    algorithm: chronological
    formula: |
      PreSave rows for the release are processed in occurred order
      (PreSave.created_at ASC, tie-break: fan_token ASC — a client-supplied
      stable string, never id).
      Territory rule: row -> CONVERTED iff territory_allowlist == [] OR
      row.territory IN territory_allowlist; otherwise -> CANCELLED.
      presave_count (recomputed) = count of rows ending in SAVED or CONVERTED.
    input_set: "PreSave rows with release_id == release.id and status == SAVED"
    constants: {}
    precision: "n/a"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7; for RightsHolder the X-User-ID must equal the owning Artist.id of the addressed resource"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right; body FK ids exist in the order declared by the endpoint's input list"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Required request fields are present and well-typed; enum fields carry a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition exists (generic invalid-state guard)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_temporal
    check: "Pitch submit/revise requires the logical clock to be at least MIN_PITCH_LEAD_DAYS before Release.release_date"
    error_id: ERR_PITCH_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /catalog/pitches, POST /catalog/pitches/{id}/revise"

  - priority: 7
    category: business_referential
    check: "Pitched track must be the release's focus track, track AVAILABLE, and have no other non-terminal PitchSubmission"
    error_id: ERR_PITCH_NOT_PITCHABLE
    http_status: 409
    applies_to: "POST /catalog/pitches"

  - priority: 8
    category: business_referential
    check: "Target playlist ACTIVE and genre_tags of the release must include the playlist genre_focus (mood_focus ANY or in mood_tags)"
    error_id: ERR_PLAYLIST_FIT_MISMATCH
    http_status: 409
    applies_to: "POST /catalog/pitches"

  - priority: 9
    category: business_safety
    check: "Track has no OPEN or AUTO_FLAGGED FraudCase (blocks new pitches, placement activation, promotion enroll/resume)"
    error_id: ERR_FRAUD_HOLD
    http_status: 409
    applies_to: "POST /catalog/pitches, POST /catalog/placements/{id}/activate, POST /catalog/promotions, POST /catalog/promotions/{id}/resume"

  - priority: 10
    category: business_temporal
    check: "Release change-date: clock strictly before old release_date minus PITCH_WINDOW_DAYS, new date in the future, date_change_count < MAX_DATE_CHANGES"
    error_id: ERR_DATE_CHANGE_WINDOW
    http_status: 409
    applies_to: "POST /catalog/releases/{id}/change-date"

  - priority: 11
    category: business_temporal
    check: "Promotion enrollment window [starts_on, ends_on) must not overlap any other non-terminal enrollment for the same track (adjacent windows touching at a boundary are allowed); starts_on < ends_on"
    error_id: ERR_ENROLLMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /catalog/promotions, POST /catalog/promotions/{id}/resume"

  - priority: 12
    category: business_temporal
    check: "Placement activate/reinstate: (playlist_id, slot_index) must be free of ACTIVE/REINSTATED placements; a ROTATED_OUT row never blocks its own reinstatement in the same slot"
    error_id: ERR_SLOT_OCCUPIED
    http_status: 409
    applies_to: "POST /catalog/placements/{id}/activate, POST /catalog/placements/{id}/reinstate"

  - priority: 13
    category: business_temporal
    check: "Manual rotate requires logical clock >= scheduled_rotation_on"
    error_id: ERR_ROTATION_TOO_EARLY
    http_status: 409
    applies_to: "POST /catalog/placements/{id}/rotate"

  - priority: 14
    category: business_constraint
    check: "Pitch ACCEPT requires a free slot per placement_slot_selector"
    error_id: ERR_NO_FREE_SLOT
    http_status: 409
    applies_to: "POST /catalog/pitches/{id}/decide"

  - priority: 15
    category: business_fiscal
    check: "RoyaltyPeriod close requires clock >= period_end and no other period with status OPEN whose window overlaps"
    error_id: ERR_PERIOD_NOT_CLOSABLE
    http_status: 409
    applies_to: "POST /catalog/royalty-periods/{id}/close"

  - priority: 16
    category: business_fiscal
    check: "StreamEvent ingest requires an OPEN RoyaltyPeriod covering occurred_on; streams outside every open window are rejected"
    error_id: ERR_NO_OPEN_PERIOD
    http_status: 409
    applies_to: "POST /catalog/streams"

  - priority: 17
    category: business_safety
    check: "FraudCase CONFIRM adjudication requires confidence_score >= FRAUD_CONFIRM_THRESHOLD"
    error_id: ERR_FRAUD_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /catalog/fraud-cases/{id}/adjudicate"

  - priority: 18
    category: business_referential
    check: "Promotion suspend requires the disclosure_token minted at enroll time"
    error_id: ERR_DISCLOSURE_TOKEN_MISMATCH
    http_status: 403
    applies_to: "POST /catalog/promotions/{id}/suspend"

  - priority: 19
    category: business_constraint
    check: "Territory allowlist entries are valid ISO alpha-2 codes; PreSave territory must be inside the release allowlist when non-empty"
    error_id: ERR_TERRITORY_RESTRICTED
    http_status: 422
    applies_to: "POST /catalog/releases, POST /catalog/presaves"

  - priority: 20
    category: state
    check: "OCC: expected_*_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /catalog/releases/{id}/change-date, POST /catalog/royalty-periods/{id}/close"

