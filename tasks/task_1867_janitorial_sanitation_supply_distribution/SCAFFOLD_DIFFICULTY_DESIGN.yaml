scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: usage_forecast_provisional_vs_final
        grounds:
          - calculations.usage_forecast
          - entities.ForecastProfile.fields.replenishment_recommended
        distinguishing_aspect: |
          Same raw usage data produces different forecast outputs depending on variant: PROVISIONAL
          includes SUBMITTED+POSTED records (avg 3.0/day) while FINAL includes POSTED only (avg 1.0/day)
          — dual-variant logic on the usage-forecast (ForecastProfile) entity domain.
        test_recipe:
          setup:
            - "Facility F (ACTIVE) and Product P (PAPER) exist"
            - "One POSTED usage record qty 90 (June 2026) and one SUBMITTED record qty 180 (July 2026); clock at default 2026-08-01T00:00:00Z so both period_ends fall inside the trailing-90-day window [2026-05-03, 2026-08-01]"
            - "ForecastProfile with horizon_days=30, safety_stock=5, current_on_hand=20"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac A", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-P1", name: "Paper", category: "PAPER", base_price_cents: 1200, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/usage-records", payload: { facility_id: "${fac_id}", product_id: "${prod_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", quantity_used: 90, source: "MANUAL" }, as: DistributorAdmin, captures: { ur1_id: $.data.id } }
            - { call: "POST /jansan/usage-records/${ur1_id}/post", payload: {}, as: DistributorAdmin }
            - { call: "POST /jansan/usage-records", payload: { facility_id: "${fac_id}", product_id: "${prod_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", quantity_used: 180, source: "AUTO_DISPENSER" }, as: DistributorAdmin }
            - { call: "POST /jansan/forecast-profiles", payload: { facility_id: "${fac_id}", product_id: "${prod_id}", horizon_days: 30, safety_stock: 5, current_on_hand: 20 }, as: DistributorAdmin, captures: { fp_id: $.data.id } }
          trigger:
            - { call: "POST /jansan/forecast-profiles/${fp_id}/recompute", payload: { variant: "FINAL" }, as: DistributorAdmin }
            - { call: "POST /jansan/forecast-profiles/${fp_id}/recompute", payload: { variant: "PROVISIONAL" }, as: DistributorAdmin }
          assert:
            - "After FINAL recompute: ForecastProfile.${fp_id}.avg_daily_usage == 1.0 (90/90), reorder_point == 12, recommended_qty == 10, replenishment_recommended == false, variant_used == FINAL"
            - "After PROVISIONAL recompute on identical records: avg_daily_usage == 3.0 (270/90), reorder_point == 26, recommended_qty == 70, replenishment_recommended == true, variant_used == PROVISIONAL"

      - name: fuel_surcharge_quoted_vs_actual
        grounds:
          - calculations.fuel_surcharge
          - calculations.order_total_rollup
          - state_machines.Order.PLACED_to_DELIVERED
        distinguishing_aspect: |
          Same order money inputs produce a different fuel_surcharge_cents depending on variant:
          QUOTED uses the placement-time index (2.50 -> 4% -> 200) while ACTUAL uses the delivery-day
          index (3.50 -> 6% -> 300) — dual-variant logic on the Order charging domain, distinct from
          the ForecastProfile domain of usage_forecast_provisional_vs_final.
        test_recipe:
          setup:
            - "Facility (miles 10, credit 1000000) and PAPER product price 1000, stock 100"
            - "Order 5 x 1000 with fuel_index 2.50, placed: subtotal 5000, delivery_fee 0, QUOTED surcharge round(5000*0.04*1.0)=200, total 5200"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac B", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "TUE" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-P2", name: "Towels", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${prod_id}", qty: 5 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /jansan/orders/${ord_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          trigger:
            - { call: "POST /jansan/orders/${ord_id}/confirm-delivery", payload: { fuel_index_at_delivery: 3.50 }, as: DistributorAdmin }
          assert:
            - "Before delivery: Order.${ord_id}.fuel_surcharge_cents == 200 AND fuel_surcharge_variant == QUOTED AND total_cents == 5200"
            - "After confirm-delivery: Order.${ord_id}.fuel_surcharge_cents == 300 AND fuel_surcharge_variant == ACTUAL AND total_cents == 5300 AND status == DELIVERED"

  - rule_id: combinatorial_formula
    instances:
      - name: order_line_pricing_per_line_rounding
        grounds:
          - calculations.order_line_pricing
        distinguishing_aspect: |
          Mode (b) nested rounding: scaffold pins round-per-line-then-sum. Lines 1x101@0.5 -> raw 50.5
          -> 51 and 1x103@0.5 -> raw 51.5 -> 52 give subtotal 103; the non-conformant sum-then-round
          order gives round(102.0)=102, so the pinned order is observable.
        test_recipe:
          setup:
            - "Facility (miles 10, credit 1000000); products PA price 101 and PB price 103, stock 100 each"
            - "Order with lines [{PA, qty 1, discount_pct 0.5}, {PB, qty 1, discount_pct 0.5}], fuel_index 2.50"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac C", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "WED" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-PA", name: "A", category: "PAPER", base_price_cents: 101, unit_of_measure: "EACH", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { pa_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-PB", name: "B", category: "PAPER", base_price_cents: 103, unit_of_measure: "EACH", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { pb_id: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${pa_id}", qty: 1, discount_pct: 0.5 }, { product_id: "${pb_id}", qty: 1, discount_pct: 0.5 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /jansan/orders/${ord_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          assert:
            - "Order.${ord_id}.merchandise_subtotal_cents == 103 (per-line 51 + 52; sum-then-round would be 102)"
            - "delivery_fee_cents == 4897 (5000 - 103); fuel_surcharge_cents == 200 (round(5000*0.04*1.0)); total_cents == 5200"

      - name: order_total_rollup_pinned_evaluation_order
        grounds:
          - calculations.order_total_rollup
          - calculations.fuel_surcharge
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: surcharge base is (subtotal + delivery_fee). With subtotal
          4000 the fee is 1000, so surcharge = round(5000*0.04) = 200; an implementation that computes
          surcharge on the subtotal alone yields 160 — the pinned subtotal->fee->surcharge->total order
          is observable.
        test_recipe:
          setup:
            - "Facility (miles 10, credit 1000000); product price 1000 stock 100"
            - "Order 4 x 1000, fuel_index 2.50"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac D", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "THU" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-P4", name: "Soap", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${prod_id}", qty: 4 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /jansan/orders/${ord_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          assert:
            - "Order.${ord_id}.delivery_fee_cents == 1000 (5000 - 4000)"
            - "Order.${ord_id}.fuel_surcharge_cents == 200 — base includes delivery_fee (5000), not subtotal alone (which would give 160)"
            - "Order.${ord_id}.total_cents == 5200"

  - rule_id: non_linear_state_machine
    instances:
      - name: contract_bid_revision_loop
        grounds:
          - state_machines.ContractBid.UNDER_REVIEW_to_DRAFT
          - state_machines.ContractBid.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          ContractBid has a true cycle DRAFT -> SUBMITTED -> UNDER_REVIEW -> DRAFT (revision loop) with
          revision_number monotonically increasing per loop — non-linear shape on ContractBid, distinct
          entity from the StandingOrder cycle instance.
        test_recipe:
          setup:
            - "Product exists; bid BID-1 for group GPO-2 with window 2026-09-01..2026-12-31"
          setup_api_calls:
            - { call: "POST /jansan/products", payload: { sku: "SKU-B1", name: "BidProd", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/contract-bids", payload: { bid_reference: "BID-1", facility_group_code: "GPO-2", lines: [ { product_id: "${prod_id}", bid_price_cents: 800 } ], protection_start: "2026-09-01T00:00:00Z", protection_end: "2026-12-31T00:00:00Z" }, as: SalesRep, captures: { bid_id: $.data.id } }
            - { call: "POST /jansan/contract-bids/${bid_id}/submit", payload: {}, as: SalesRep }
            - { call: "POST /jansan/contract-bids/${bid_id}/open-review", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /jansan/contract-bids/${bid_id}/return-for-revision", payload: {}, as: SalesRep }
            - { call: "POST /jansan/contract-bids/${bid_id}/submit", payload: {}, as: SalesRep }
          assert:
            - "After return-for-revision: ContractBid.${bid_id}.status == DRAFT AND revision_number == 1"
            - "After resubmit (loop closed): status == SUBMITTED; a further open-review succeeds (cycle may repeat)"

      - name: standing_order_pause_resume_cycle
        grounds:
          - state_machines.StandingOrder.ACTIVE_to_PAUSED
          - state_machines.StandingOrder.PAUSED_to_ACTIVE
        distinguishing_aspect: |
          StandingOrder supports the ACTIVE -> PAUSED -> ACTIVE cycle with pause_reason tracking
          (MANUAL vs NONE) — non-linear shape on StandingOrder, distinct entity from the ContractBid loop.
        test_recipe:
          setup:
            - "Facility ACTIVE; product price 1000 stock 500"
            - "Standing order items [{product, qty 2}], WEEKLY, next_run_date 2026-08-03"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac E", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "FRI" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-S1", name: "Liners", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 500 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/standing-orders", payload: { facility_id: "${fac_id}", items: [ { product_id: "${prod_id}", qty: 2 } ], frequency: "WEEKLY", next_run_date: "2026-08-03T00:00:00Z" }, as: FacilityManager, as_user_id: "${fac_id}", captures: { so_id: $.data.id } }
            - { call: "POST /jansan/standing-orders/${so_id}/activate", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          trigger:
            - { call: "POST /jansan/standing-orders/${so_id}/pause", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
            - { call: "POST /jansan/standing-orders/${so_id}/resume", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
            - { call: "POST /jansan/standing-orders/${so_id}/pause", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          assert:
            - "After activate: StandingOrder.${so_id}.status == ACTIVE AND next_delivery_total_cents == 2000 (2 x 1000 at base price, no awarded bid)"
            - "After first pause: status == PAUSED AND pause_reason == MANUAL; after resume: ACTIVE AND pause_reason == NONE; after second pause: PAUSED again (cycle repeatable)"

  - rule_id: transitive_cascade
    instances:
      - name: shortage_declare_cascade_depth3
        grounds:
          - state_machines.Product.ACTIVE_to_SHORTAGE
          - state_machines.OrderLine.ALLOCATED_to_CANCELLED
          - state_machines.Order.PLACED_to_CANCELLED
          - calculations.credit_exposure
        distinguishing_aspect: |
          Depth-3 chain from POST declare-shortage: Product(A, ->SHORTAGE) mutates OrderLine(B,
          ALLOCATED -> release reservation -> CANCELLED since no substitute exists), that line mutation
          mutates Order(C, all lines CANCELLED -> auto-CANCELLED), and that order mutation recomputes
          Facility(D).committed_cents (5200 -> 0). Each link is caused by the previous link.
        test_recipe:
          setup:
            - "Facility credit 1000000; product EQ-1 (category EQUIPMENT, the only EQUIPMENT product) price 1000 stock 100"
            - "Order 3 x EQ-1 with fuel_index 2.50, PLACED: total 5200 (subtotal 3000 + fee 2000 + surcharge 200); committed 5200; qty_on_hand 97, qty_allocated 3"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac F", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-EQ1", name: "Vacuum", category: "EQUIPMENT", base_price_cents: 1000, unit_of_measure: "EACH", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${prod_id}", qty: 3 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /jansan/orders/${ord_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          trigger:
            - { call: "POST /jansan/products/${prod_id}/declare-shortage", payload: {}, as: DistributorAdmin }
          assert:
            - "Link 1: the order's line (GET /jansan/order-lines?order_id=${ord_id}) has status == CANCELLED (no ACTIVE EQUIPMENT substitute exists, so no proposal is created)"
            - "Link 2: Order.${ord_id}.status == CANCELLED (all lines CANCELLED auto-transition)"
            - "Link 3: Facility.${fac_id}.committed_cents == 0 (was 5200)"
            - "Compensation inside link 1: Product.${prod_id}.qty_on_hand == 100 AND qty_allocated == 0; Product.status == SHORTAGE"

      - name: ops_run_due_generates_order_depth2
        grounds:
          - state_machines.StandingOrder.DRAFT_to_ACTIVE
          - calculations.order_total_rollup
          - calculations.credit_exposure
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (POST /jansan/ops/run-daily): StandingOrder(A, due and
          ACTIVE) generates and auto-places Order(B, total 5300), and that order placement recomputes
          Facility(C).committed_cents (0 -> 5300); the standing order's own next_run_date advances 7d.
        test_recipe:
          setup:
            - "Facility ACTIVE credit 1000000; product price 1000 stock 500"
            - "Standing order ACTIVE, items [{product, qty 4}], WEEKLY, next_run_date 2026-08-01T00:00:00Z (== default clock), fuel_index 3.00"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac G", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-G1", name: "Rolls", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 500 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/standing-orders", payload: { facility_id: "${fac_id}", items: [ { product_id: "${prod_id}", qty: 4 } ], frequency: "WEEKLY", next_run_date: "2026-08-01T00:00:00Z", fuel_index: 3.00 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { so_id: $.data.id } }
            - { call: "POST /jansan/standing-orders/${so_id}/activate", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          trigger:
            - { call: "POST /jansan/ops/run-daily", payload: {}, as: DistributorAdmin, captures: { gen_count: $.data.generated_count } }
          assert:
            - "generated_count == 1"
            - "Link 1: GET /jansan/orders?standing_order_id=${so_id} returns exactly 1 order with status == PLACED, source == STANDING_ORDER, total_cents == 5300 (subtotal 4000 + fee 1000 + surcharge round(5000*0.06*1.0)=300 at fuel_index 3.00)"
            - "Link 2: Facility.${fac_id}.committed_cents == 5300"
            - "StandingOrder.${so_id}.next_run_date advanced to 2026-08-08T00:00:00Z (WEEKLY = 7d)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: facility_inactive_beats_credit_exceeded
        grounds:
          - validations[priority=8]
          - validations[priority=20]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the same place request violates both the
          facility-ACTIVE gate (pri 8) and the credit check (pri 20); the state-category
          ERR_FACILITY_INACTIVE must win.
        test_recipe:
          setup:
            - "Facility SUSPENDED with credit_limit_cents 1000"
            - "Order 5 x 1000 (total would be 5200, over the limit) sitting in DRAFT"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac H", facility_group_code: "GPO-1", credit_limit_cents: 1000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-H1", name: "Pads", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${prod_id}", qty: 5 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /jansan/facilities/${fac_id}/suspend", payload: {}, as: DistributorAdmin }
          trigger:
            - { call: "POST /jansan/orders/${ord_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FACILITY_INACTIVE (state, priority 8), NOT ERR_CREDIT_LIMIT_EXCEEDED (business_fiscal, priority 20)"
            - "Order.${ord_id}.status remains DRAFT"

      - name: incompatible_placement_beats_window_conflict
        grounds:
          - validations[priority=12]
          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal: one dispenser create violates both
          the ACID/OXIDIZER zone rule (pri 12) and the technician half-open window rule (pri 13); the
          safety-category ERR_INCOMPATIBLE_PLACEMENT must win.
        test_recipe:
          setup:
            - "Facility ACTIVE; technician T1; ACID chemical CA and OXIDIZER chemical CO (both dilution_required=false so no training gate at create)"
            - "Dispenser D1: CA in zone kitchen, technician T1, window 2026-08-10T09:00-10:00 (SCHEDULED)"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac I", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/technicians", payload: { name: "Tech One" }, as: DistributorAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-CA", name: "Acid cleaner", category: "CHEMICAL", base_price_cents: 2500, unit_of_measure: "GAL", dilution_required: false, chemical_family: "ACID", qty_on_hand: 50 }, as: DistributorAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-CO", name: "Oxidizer", category: "CHEMICAL", base_price_cents: 2600, unit_of_measure: "GAL", dilution_required: false, chemical_family: "OXIDIZER", qty_on_hand: 50 }, as: DistributorAdmin, captures: { co_id: $.data.id } }
            - { call: "POST /jansan/dispensers", payload: { facility_id: "${fac_id}", product_id: "${ca_id}", zone: "kitchen", technician_id: "${tech_id}", install_start: "2026-08-10T09:00:00Z", install_end: "2026-08-10T10:00:00Z" }, as: DistributorAdmin }
          trigger:
            - { call: "POST /jansan/dispensers", payload: { facility_id: "${fac_id}", product_id: "${co_id}", zone: "kitchen", technician_id: "${tech_id}", install_start: "2026-08-10T09:30:00Z", install_end: "2026-08-10T10:30:00Z" }, as: DistributorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INCOMPATIBLE_PLACEMENT (business_safety, priority 12), NOT ERR_TECHNICIAN_WINDOW_CONFLICT (business_temporal, priority 13)"

  - rule_id: boundary_precision_check
    instances:
      - name: delivery_fee_zero_at_exact_minimum
        grounds:
          - calculations.order_total_rollup
          - validations[priority=5]
        distinguishing_aspect: |
          Boundary on the merchandise-subtotal metric reached via POST place: at subtotal exactly ==
          DELIVERY_MINIMUM_CENTS(5000) the fee is max(0, 0) == 0 (>= semantics); one cent below (4999)
          the fee would be 1.
        test_recipe:
          setup:
            - "Facility (miles 10, credit 1000000); product price 1000 stock 100"
            - "Order A: 5 x 1000 (subtotal exactly 5000); Order B: 1 x 4999-priced product (subtotal 4999)"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac J", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-J1", name: "Exact", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { p1_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-J2", name: "Below", category: "PAPER", base_price_cents: 4999, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { p2_id: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${p1_id}", qty: 5 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_a: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${p2_id}", qty: 1 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_b: $.data.id } }
          trigger:
            - { call: "POST /jansan/orders/${ord_a}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
            - { call: "POST /jansan/orders/${ord_b}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          assert:
            - "Order.${ord_a}: merchandise_subtotal_cents == 5000 AND delivery_fee_cents == 0 (equality is free), fuel_surcharge_cents == 200, total_cents == 5200"
            - "Order.${ord_b}: merchandise_subtotal_cents == 4999 AND delivery_fee_cents == 1, fuel_surcharge_cents == 200 (base 5000), total_cents == 5200"

      - name: replenishment_triggers_at_equality
        grounds:
          - calculations.usage_forecast
          - entities.ForecastProfile.fields.replenishment_recommended
        distinguishing_aspect: |
          Boundary on the on-hand-units metric reached via POST recompute: replenishment_recommended is
          current_on_hand <= reorder_point, so on_hand exactly == reorder_point (7) triggers true while
          8 is false — a different metric (units) and endpoint (recompute) than the delivery-fee boundary.
        test_recipe:
          setup:
            - "Facility, product, one POSTED usage record qty 90 in window -> FINAL avg 1.0"
            - "ForecastProfile safety_stock 0, current_on_hand 7 -> reorder_point ceil(1.0*7)+0 == 7"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac K", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-K1", name: "Soap K", category: "PAPER", base_price_cents: 1200, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/usage-records", payload: { facility_id: "${fac_id}", product_id: "${prod_id}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", quantity_used: 90, source: "MANUAL" }, as: DistributorAdmin, captures: { ur_id: $.data.id } }
            - { call: "POST /jansan/usage-records/${ur_id}/post", payload: {}, as: DistributorAdmin }
            - { call: "POST /jansan/forecast-profiles", payload: { facility_id: "${fac_id}", product_id: "${prod_id}", horizon_days: 30, safety_stock: 0, current_on_hand: 7 }, as: DistributorAdmin, captures: { fp_id: $.data.id } }
          trigger:
            - { call: "POST /jansan/forecast-profiles/${fp_id}/recompute", payload: { variant: "FINAL" }, as: DistributorAdmin, captures: { fp_v: $.data.version } }
            - { call: "PATCH /jansan/forecast-profiles/${fp_id}", payload: { current_on_hand: 8, expected_forecast_profile_version: "${fp_v}" }, as: DistributorAdmin }
            - { call: "POST /jansan/forecast-profiles/${fp_id}/recompute", payload: { variant: "FINAL" }, as: DistributorAdmin }
          assert:
            - "First recompute: reorder_point == 7 AND replenishment_recommended == true (7 <= 7, equality triggers)"
            - "After PATCH to on_hand 8 and recompute: replenishment_recommended == false"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_place_requires_facility_active
        grounds:
          - state_machines.Order.DRAFT_to_PLACED
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair Order -> Facility: the DRAFT->PLACED transition is gated on the parent Facility's
          status; SUSPENDED blocks placement, reinstatement re-enables it.
        test_recipe:
          setup:
            - "Facility initially ACTIVE, credit 1000000; product price 1000 stock 100"
            - "Order O1 created while ACTIVE; then facility suspended; O2 created for the suspended facility"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac L", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-L1", name: "Mops", category: "PAPER", base_price_cents: 1000, unit_of_measure: "EACH", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${prod_id}", qty: 1 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { o1_id: $.data.id } }
            - { call: "POST /jansan/facilities/${fac_id}/suspend", payload: {}, as: DistributorAdmin }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${prod_id}", qty: 1 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { o2_id: $.data.id } }
          trigger:
            - { call: "POST /jansan/orders/${o2_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}", captures: { err: $.data.error_id } }
            - { call: "POST /jansan/facilities/${fac_id}/reinstate", payload: {}, as: DistributorAdmin }
            - { call: "POST /jansan/orders/${o2_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          assert:
            - "While facility SUSPENDED: place O2 returns ERR_FACILITY_INACTIVE and O2 stays DRAFT"
            - "After reinstate: the same place succeeds; Order.${o2_id}.status == PLACED with total_cents == 6200 (subtotal 1000 + fee 4000 + surcharge round(5000*0.04*1.0)=200)"

      - name: dispenser_complete_requires_certified_training
        grounds:
          - state_machines.Dispenser.SCHEDULED_to_INSTALLED
          - validations[priority=11]
        distinguishing_aspect: |
          Entity pair Dispenser -> TrainingRecord: SCHEDULED->INSTALLED is gated on the existence of a
          CERTIFIED TrainingRecord for (facility, chemical) — a different entity pair than
          Order -> Facility.
        test_recipe:
          setup:
            - "Facility ACTIVE; technician T1; dilution_required NEUTRAL chemical CN"
            - "Dispenser DS for CN in zone laundry, window 2026-08-10T09:00-10:00, assigned to T1; no training record yet"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac M", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/technicians", payload: { name: "Tech M" }, as: DistributorAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-CN", name: "Neutral chem", category: "CHEMICAL", base_price_cents: 2500, unit_of_measure: "GAL", dilution_required: true, chemical_family: "NEUTRAL", qty_on_hand: 50 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/dispensers", payload: { facility_id: "${fac_id}", product_id: "${prod_id}", zone: "laundry", technician_id: "${tech_id}", install_start: "2026-08-10T09:00:00Z", install_end: "2026-08-10T10:00:00Z" }, as: DistributorAdmin, captures: { dsp_id: $.data.id } }
          trigger:
            - { call: "POST /jansan/dispensers/${dsp_id}/complete", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}", captures: { err: $.data.error_id } }
            - { call: "POST /jansan/training-records", payload: { facility_id: "${fac_id}", product_id: "${prod_id}", employee_name: "Emp One" }, as: DistributorAdmin, captures: { tr_id: $.data.id } }
            - { call: "POST /jansan/training-records/${tr_id}/certify", payload: { score_pct: 90 }, as: DistributorAdmin }
            - { call: "POST /jansan/dispensers/${dsp_id}/complete", payload: {}, as: FieldTechnician, as_user_id: "${tech_id}" }
          assert:
            - "First complete returns ERR_TRAINING_NOT_CERTIFIED and Dispenser.${dsp_id} stays SCHEDULED"
            - "After certification: complete succeeds, Dispenser.${dsp_id}.status == INSTALLED, installed_at == 2026-08-01T00:00:00Z (default clock), Facility.${fac_id}.closed_loop_enrolled == true"

  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_half_open_windows_adjacent_ok
        grounds:
          - validations[priority=13]
          - entities.Dispenser.fields.install_start
        distinguishing_aspect: |
          Half-open interval semantics on the Technician resource: [09:00,10:00) and [10:00,11:00) share
          an endpoint but do NOT conflict (adjacency allowed), while [09:30,10:30) genuinely overlaps and
          is rejected — contrast with the closed-interval bid-window semantics in the sibling instance.
        test_recipe:
          setup:
            - "Facility ACTIVE; technician T1; two NEUTRAL chemicals N1/N2 (dilution false)"
            - "Dispenser D1: N1 zone z1, T1, 2026-08-10T09:00-10:00 SCHEDULED"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac N", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/technicians", payload: { name: "Tech N" }, as: DistributorAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-N1", name: "N1", category: "CHEMICAL", base_price_cents: 2500, unit_of_measure: "GAL", dilution_required: false, chemical_family: "NEUTRAL", qty_on_hand: 50 }, as: DistributorAdmin, captures: { n1_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-N2", name: "N2", category: "CHEMICAL", base_price_cents: 2500, unit_of_measure: "GAL", dilution_required: false, chemical_family: "NEUTRAL", qty_on_hand: 50 }, as: DistributorAdmin, captures: { n2_id: $.data.id } }
            - { call: "POST /jansan/dispensers", payload: { facility_id: "${fac_id}", product_id: "${n1_id}", zone: "z1", technician_id: "${tech_id}", install_start: "2026-08-10T09:00:00Z", install_end: "2026-08-10T10:00:00Z" }, as: DistributorAdmin }
          trigger:
            - { call: "POST /jansan/dispensers", payload: { facility_id: "${fac_id}", product_id: "${n2_id}", zone: "z2", technician_id: "${tech_id}", install_start: "2026-08-10T10:00:00Z", install_end: "2026-08-10T11:00:00Z" }, as: DistributorAdmin, captures: { d2_id: $.data.id } }
            - { call: "POST /jansan/dispensers", payload: { facility_id: "${fac_id}", product_id: "${n2_id}", zone: "z3", technician_id: "${tech_id}", install_start: "2026-08-10T09:30:00Z", install_end: "2026-08-10T10:30:00Z" }, as: DistributorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent window [10:00,11:00) succeeds: Dispenser.${d2_id} created with status SCHEDULED (half-open: end == start is not an overlap)"
            - "Overlapping window [09:30,10:30) fails with ERR_TECHNICIAN_WINDOW_CONFLICT"

      - name: awarded_bid_closed_windows_endpoint_touch_conflicts
        grounds:
          - validations[priority=14]
          - state_machines.ContractBid.UNDER_REVIEW_to_AWARDED
        distinguishing_aspect: |
          Closed-interval semantics on the ContractBid (price-protection) resource: two AWARDED bids for
          the same group+product whose windows share the single date 2026-12-31 DO intersect, so the
          second award is rejected — the opposite adjacency treatment from the technician half-open rule.
        test_recipe:
          setup:
            - "Product PBID; bid1 group GPO-3 window [2026-09-01, 2026-12-31] already AWARDED"
            - "bid2 same group+product window [2026-12-31, 2027-03-31] sitting UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /jansan/products", payload: { sku: "SKU-BID", name: "BidChem", category: "CHEMICAL", base_price_cents: 2500, unit_of_measure: "GAL", dilution_required: false, chemical_family: "NEUTRAL", qty_on_hand: 50 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/contract-bids", payload: { bid_reference: "BID-W1", facility_group_code: "GPO-3", lines: [ { product_id: "${prod_id}", bid_price_cents: 2000 } ], protection_start: "2026-09-01T00:00:00Z", protection_end: "2026-12-31T00:00:00Z" }, as: SalesRep, captures: { bid1: $.data.id } }
            - { call: "POST /jansan/contract-bids/${bid1}/submit", payload: {}, as: SalesRep }
            - { call: "POST /jansan/contract-bids/${bid1}/open-review", payload: {}, as: SalesRep }
            - { call: "POST /jansan/contract-bids/${bid1}/award", payload: {}, as: DistributorAdmin }
            - { call: "POST /jansan/contract-bids", payload: { bid_reference: "BID-W2", facility_group_code: "GPO-3", lines: [ { product_id: "${prod_id}", bid_price_cents: 1900 } ], protection_start: "2026-12-31T00:00:00Z", protection_end: "2027-03-31T00:00:00Z" }, as: SalesRep, captures: { bid2: $.data.id } }
            - { call: "POST /jansan/contract-bids/${bid2}/submit", payload: {}, as: SalesRep }
            - { call: "POST /jansan/contract-bids/${bid2}/open-review", payload: {}, as: SalesRep }
          trigger:
            - { call: "POST /jansan/contract-bids/${bid2}/award", payload: {}, as: DistributorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROTECTION_WINDOW_OVERLAP — closed intervals share 2026-12-31, which counts as intersecting"
            - "ContractBid.${bid2}.status remains UNDER_REVIEW"

  - rule_id: compensating_invariant
    instances:
      - name: inventory_allocation_conserved_on_cancel
        grounds:
          - state_machines.OrderLine.PENDING_to_ALLOCATED
          - state_machines.OrderLine.ALLOCATED_to_CANCELLED
          - state_machines.Order.PLACED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: physical units — for each product, qty_on_hand + qty_allocated is invariant
          across the allocate (place) / deallocate (cancel) pair: 100 -> 70+30 -> 100+0.
        test_recipe:
          setup:
            - "Facility ACTIVE credit 1000000; product stock 100"
            - "Order for 30 units, PLACED"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac O", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-O1", name: "Buckets", category: "EQUIPMENT", base_price_cents: 1000, unit_of_measure: "EACH", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${prod_id}", qty: 30 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /jansan/orders/${ord_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
            - { call: "POST /jansan/orders/${ord_id}/cancel", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          assert:
            - "After place: Product.${prod_id}.qty_on_hand == 70 AND qty_allocated == 30 (sum 100)"
            - "After cancel: qty_on_hand == 100 AND qty_allocated == 0 (sum 100 — no drift); Order.${ord_id}.status == CANCELLED"

      - name: committed_credit_conserved_on_place_cancel
        grounds:
          - calculations.credit_exposure
          - state_machines.Order.DRAFT_to_PLACED
          - state_machines.Order.PLACED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: committed credit dollars — Facility.committed_cents returns to its exact
          pre-place value after the place/cancel pair (0 -> 5200 -> 0), while outstanding_cents stays 0;
          a different conserved quantity (money exposure) than physical units.
        test_recipe:
          setup:
            - "Facility ACTIVE credit 1000000, committed 0; product price 1000 stock 100"
            - "Order 5 x 1000 fuel_index 2.50 (total 5200)"
          setup_api_calls:
            - { call: "POST /jansan/facilities", payload: { name: "Fac P", facility_group_code: "GPO-1", credit_limit_cents: 1000000, service_zone: "Z1", delivery_distance_miles: 10, default_delivery_day: "MON" }, as: DistributorAdmin, captures: { fac_id: $.data.id } }
            - { call: "POST /jansan/products", payload: { sku: "SKU-PP", name: "Gloves", category: "PAPER", base_price_cents: 1000, unit_of_measure: "CASE", dilution_required: false, chemical_family: "NONE", qty_on_hand: 100 }, as: DistributorAdmin, captures: { prod_id: $.data.id } }
            - { call: "POST /jansan/orders", payload: { facility_id: "${fac_id}", lines: [ { product_id: "${prod_id}", qty: 5 } ], delivery_date: "2026-08-05T00:00:00Z", fuel_index: 2.50 }, as: FacilityManager, as_user_id: "${fac_id}", captures: { ord_id: $.data.id } }
          trigger:
            - { call: "POST /jansan/orders/${ord_id}/place", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
            - { call: "POST /jansan/orders/${ord_id}/cancel", payload: {}, as: FacilityManager, as_user_id: "${fac_id}" }
          assert:
            - "After place: Facility.${fac_id}.committed_cents == 5200"
            - "After cancel: Facility.${fac_id}.committed_cents == 0 AND outstanding_cents == 0 (committed restored exactly, no ledger drift)"
