        distinguishing_aspect: "The conflicting pair is business_safety legal-notice (priority 7, ERR_LEGAL_NOTICE_HOLD) against business_safety press-posture (priority 8, ERR_PRESS_POSTURE_LOCKED): a frequency-notice request issued on a hub that is both under a legal-notice hold and fully suspended must return the legal-notice error, pinning the ordering of the two safety checks."
