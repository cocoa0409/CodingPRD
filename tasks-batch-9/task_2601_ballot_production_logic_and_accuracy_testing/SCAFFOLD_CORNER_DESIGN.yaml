      - name: calc_precinct_requirement_ceiling_uses_declared_overage_constants
        claim_type: constants_applied
        grounds:
          - calculations.precinct_ballot_requirement.constants
          - entities.Precinct.fields.required_ballot_quantity
        distinguishing_aspect: "The overage is the exact rational 11/10 rounded UP, so 1751 voters give 1927 (truncation and round-half-up would both give 1926) and 1 voter gives 2 (truncation gives 1); a voter count already divisible by 10 shows no rounding at all."
        test_recipe:
          setup:
            - "One election in SETUP."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
          trigger:
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-101", district_codes: ["D-12"], registered_voter_count: 1751, polling_place: "Northside Armory" }
              as: BallotCoordinator
              captures: { pr_a: $.data.id, req_a: $.data.required_ballot_quantity }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-102", district_codes: ["D-12"], registered_voter_count: 1, polling_place: "Lighthouse Keeper Cottage" }
              as: BallotCoordinator
              captures: { pr_b: $.data.id, req_b: $.data.required_ballot_quantity }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-103", district_codes: ["D-12"], registered_voter_count: 10, polling_place: "Riverside Depot" }
              as: BallotCoordinator
              captures: { pr_c: $.data.id, req_c: $.data.required_ballot_quantity }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-104", district_codes: ["D-12"], registered_voter_count: 5, polling_place: "Old Schoolhouse" }
              as: BallotCoordinator
              captures: { pr_d: $.data.id, req_d: $.data.required_ballot_quantity }
          assert:
            - "${req_a} == 1927: ceil(1751 * 11 / 10) == ceil(1926.1) == 1927, not the 1926 that truncation or round-half-up would give."
            - "${req_b} == 2: ceil(1 * 11 / 10) == ceil(1.1) == 2 - a one-voter precinct must still hold two ballots."
            - "${req_c} == 11: ceil(10 * 11 / 10) == 11 exactly, with no rounding step involved."
            - "${req_d} == 6: ceil(5 * 11 / 10) == ceil(5.5) == 6 (round-half-up agrees here, which is why the 1751 case is the discriminating one)."
            - "All four precincts have ballots_received == 0 and deployment_status \"NOT_READY\", so the requirement is a pure function of registered_voter_count at creation time."

