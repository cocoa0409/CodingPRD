            - "SUBMITting the second agreement returns 409 with error_id == ERR_DUPLICATE_ACTIVE_AGREEMENT and it stays DRAFT"
            - "GET /affiliates/${du_aff}/agreements returns total_count == 2 with exactly one row in status SUBMITTED"

      - name: settling_an_already_settled_agreement_is_refused
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ALREADY_SETTLED]
          - "state_machines.AffiliationAgreement[ACTIVE -> ACTIVE]"
          - "validations[priority=41]"
        distinguishing_aspect: "The SETTLE self-transition is single-shot: the second SETTLE returns 409 ERR_ALREADY_SETTLED rather than the generic ERR_INVALID_AGREEMENT_STATE, and the audited figures from the first settlement are not overwritten."
        test_recipe:
          setup:
            - "One affiliate with an ACTIVE agreement whose declared expenses are housing 400000 and meals 200000 and whose cap is 900000."
            - "Author-computed first settlement with audited housing 300000 supplied and meals falling back to 200000: club lines HOUSING round(300000*0.75) == 225000 and MEALS round(200000*0.60) == 120000; sub-caps at cap 900000 are HOUSING round(900000*0.75/2.60) == 259615 and MEALS round(900000*0.60/2.60) == 207692, both above their lines, so final_club_obligation_cents == 345000 and affiliate_overflow_cents == 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /affiliates"
