scaffold_corner_design:
  - section: entities
    instances:
      - name: create_establishment_returns_defaults_and_initial_state
        claim_type: Creation
        grounds:
          - entities.Establishment.fields.permit_status
          - entities.Establishment.fields.operating_posture
          - entities.Establishment.fields.risk_score
          - endpoints["POST /body-art/establishments"]
        distinguishing_aspect: "A freshly created Establishment is PENDING_PLAN_REVIEW with operating_posture CLOSED, sterilization_compliance_status NONCOMPLIANT, risk_score 25 and version 1, and the response carries a dashed UUID id with no type prefix."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /body-art/establishments"
              payload: { name: "Fresh Ink", street_address: "1 First St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id, st: $.data.permit_status, post: $.data.operating_posture, risk: $.data.risk_score, ver: $.data.version, ster: $.data.sterilization_compliance_status }
          assert:
            - "HTTP status is 201"
            - "${st} == PENDING_PLAN_REVIEW"
            - "${post} == CLOSED"
            - "${ster} == NONCOMPLIANT"
            - "${risk} == 25"
            - "${ver} == 1"
            - "${est_id} matches the 8-4-4-4-12 dashed UUID form with no prefix"
            - "Establishment.${est_id}.plan_review_cycles_used == 1"
            - "Establishment.${est_id}.fees_paid_cents == 0 and Establishment.${est_id}.fees_refunded_cents == 0"

      - name: get_establishment_by_id_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints["GET /body-art/establishments/{establishment_id}"]
          - entities.Establishment.fields.county_code
        distinguishing_aspect: "GET by id echoes every stored input field verbatim: name, street_address, county_code and establishment_type match the create payload."
        test_recipe:
          setup:
            - "One Establishment created with known field values."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Echo Ink", street_address: "2 Second St", county_code: "CAN", establishment_type: "PERMANENT_COSMETICS" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
          trigger:
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: RecordsClerk
              as_user_id: "clerk-1"
              captures: { nm: $.data.name, cc: $.data.county_code, et: $.data.establishment_type }
          assert:
            - "HTTP status is 200"
            - "${nm} == Echo Ink"
            - "${cc} == CAN"
            - "${et} == PERMANENT_COSMETICS"

      - name: list_establishments_paginated_with_county_filter
        claim_type: Listing
        grounds:
          - endpoints["GET /body-art/establishments"]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three ADA establishments and one CAN establishment stored, GET with county_code ADA, limit 2 and offset 0 returns 2 rows, total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Three Establishments in county ADA and one in county CAN."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "ADA One", street_address: "1 A St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/establishments"
              payload: { name: "ADA Two", street_address: "2 A St", county_code: "ADA", establishment_type: "PIERCING" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/establishments"
              payload: { name: "ADA Three", street_address: "3 A St", county_code: "ADA", establishment_type: "COMBINED" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/establishments"
              payload: { name: "CAN One", street_address: "1 C St", county_code: "CAN", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
          trigger:
            - call: "GET /body-art/establishments"
              payload: { county_code: "ADA", limit: 2, offset: 0 }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
          assert:
            - "HTTP status is 200 and response_type == array"
            - "the data array holds exactly 2 rows, all with county_code == ADA"
            - "meta/pagination reports total_count == 3 and has_more == true"

      - name: get_establishment_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_ESTABLISHMENT_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid UUID that matches no stored row returns ERR_ESTABLISHMENT_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /body-art/establishments/11111111-2222-4333-8444-555555555555"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == ERR_ESTABLISHMENT_NOT_FOUND"

      - name: create_establishment_missing_required_field_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - endpoints["POST /body-art/establishments"]
        distinguishing_aspect: "Omitting county_code, a required input with no declared default, returns ERR_VALIDATION with HTTP 400 and stores nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /body-art/establishments"
              payload: { name: "No County", street_address: "9 Ninth St", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err} == ERR_VALIDATION"
            - "GET /body-art/establishments returns total_count == 0"

      - name: create_establishment_invalid_enum_returns_validation
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - entities.Establishment.fields.establishment_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "establishment_type BRANDING is not a declared member of {TATTOO, PIERCING, PERMANENT_COSMETICS, COMBINED} and returns ERR_VALIDATION with HTTP 400."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /body-art/establishments"
              payload: { name: "Bad Enum", street_address: "8 Eighth St", county_code: "ADA", establishment_type: "BRANDING" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${err} == ERR_VALIDATION"

      - name: plan_review_defaults_applied_on_create
        claim_type: Defaults
        grounds:
          - entities.PlanReview.fields.cycle_count
          - entities.PlanReview.fields.status
          - entities.PlanReview.fields.decision_notes
          - endpoints["POST /body-art/plan-reviews"]
        distinguishing_aspect: "A new PlanReview defaults to status SUBMITTED, cycle_count 1, decision_notes null and decided_by_user_id null even though none of those keys appear in the request body."
        test_recipe:
          setup:
            - "One Establishment in PENDING_PLAN_REVIEW."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Default Ink", street_address: "4 Fourth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-D1", sterilization_area_sqft: 50, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id, st: $.data.status, cc: $.data.cycle_count, dn: $.data.decision_notes }
          assert:
            - "HTTP status is 201"
            - "${st} == SUBMITTED"
            - "${cc} == 1"
            - "${dn} == null"
            - "PlanReview.${pr_id}.decided_by_user_id == null"

      - name: sterilization_record_is_immutable_with_only_id_and_created_at
        claim_type: Immutability
        grounds:
          - entities.SterilizationRecord.common_fields
          - endpoints["POST /body-art/sterilization-records"]
          - endpoints["GET /body-art/sterilization-records/{sterilization_record_id}"]
        distinguishing_aspect: "SterilizationRecord declares common_fields false, so the stored row exposes id and created_at but no version and no updated_at, and no update or delete endpoint exists for it anywhere in the endpoint table."
        test_recipe:
          setup:
            - "One Establishment in PENDING_PLAN_REVIEW (a sterilization record may be filed before the permit is issued)."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Immutable Ink", street_address: "5 Fifth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
          trigger:
            - call: "POST /body-art/sterilization-records"
              payload: { establishment_id: "${est_id}", device_serial: "AC-77", cycle_completed_at: "2026-04-15T00:00:00Z", spore_test_result: "PASS" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { sr_id: $.data.id }
            - call: "GET /body-art/sterilization-records/${sr_id}"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { serial: $.data.device_serial }
          assert:
            - "HTTP status is 201 on the create and 200 on the read"
            - "${serial} == AC-77"
            - "the read response body contains id and created_at but no version key and no updated_at key"
            - "Establishment.${est_id}.sterilization_compliance_status == DEFICIENT after the single PASS record"

      - name: create_artist_with_unknown_establishment_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - entities.Artist.fields.establishment_id
          - errors[ERR_ESTABLISHMENT_NOT_FOUND]
        distinguishing_aspect: "A body-supplied establishment_id that resolves to nothing fails the priority-5 body-FK existence check with ERR_ESTABLISHMENT_NOT_FOUND (404), separately from the priority-3 path check."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /body-art/artists"
              payload: { establishment_id: "99999999-8888-4777-8666-555555555555", legal_name: "Ghost Artist" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${err} == ERR_ESTABLISHMENT_NOT_FOUND"
            - "GET /body-art/artists returns total_count == 0, so no orphan Artist row was written"

  - section: state_machines
    instances:
      - name: finalize_inspection_while_still_scheduled_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_PASSED
          - validations[priority=10]
          - errors[ERR_INSPECTION_STATE_INVALID]
        distinguishing_aspect: "finalize declares only IN_PROGRESS as a from-state, so calling it on a SCHEDULED inspection returns ERR_INSPECTION_STATE_INVALID (409) and leaves score null."
        test_recipe:
          setup:
            - "One Establishment and one SCHEDULED PREOPENING inspection that was never started."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Unstarted Ink", street_address: "10 Tenth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /body-art/inspections/${ins_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == ERR_INSPECTION_STATE_INVALID"
            - "Inspection.${ins_id}.status == SCHEDULED"
            - "Inspection.${ins_id}.score == null"

      - name: start_inspection_twice_is_rejected_on_second_attempt
        claim_type: Idempotency
        grounds:
          - state_machines.Inspection.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INSPECTION_STATE_INVALID]
        distinguishing_aspect: "The second start call observes status IN_PROGRESS, which is not a declared from-state for start, and is rejected without re-snapshotting open_violation_count_at_start."
        test_recipe:
          setup:
            - "One Establishment and one PREOPENING inspection scheduled at the default clock instant, already started once."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Twice Ink", street_address: "11 Eleventh St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
          trigger:
            - call: "POST /body-art/inspections/${ins_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == ERR_INSPECTION_STATE_INVALID"
            - "Inspection.${ins_id}.status == IN_PROGRESS"
            - "Inspection.${ins_id}.inspector_user_id == officer-insp-1"

      - name: denied_plan_review_is_terminal_and_resubmit_is_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PlanReview.SUBMITTED_to_DENIED
          - state_machines.PlanReview.CORRECTIONS_REQUIRED_to_SUBMITTED
          - errors[ERR_PLAN_REVIEW_STATE_INVALID]
        distinguishing_aspect: "DENIED is a terminal state of the PlanReview machine, so resubmit from DENIED returns ERR_PLAN_REVIEW_STATE_INVALID and the parent Establishment stays in PENDING_PLAN_REVIEW."
        test_recipe:
          setup:
            - "One Establishment whose only PlanReview has been DENIED."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Denied Ink", street_address: "12 Twelfth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-DN", sterilization_area_sqft: 60, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "DENY", decision_notes: "Sited over a floor drain." }
              as: PlanReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /body-art/plan-reviews/${pr_id}/resubmit"
              payload: { floor_plan_reference: "FP-DN2", sterilization_area_sqft: 70, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409"
            - "${err} == ERR_PLAN_REVIEW_STATE_INVALID"
            - "PlanReview.${pr_id}.status == DENIED"
            - "PlanReview.${pr_id}.cycle_count == 1"
            - "Establishment.${est_id}.permit_status == PENDING_PLAN_REVIEW"

      - name: plan_review_corrections_cycle_increments_then_approves
        claim_type: cyclic
        grounds:
          - state_machines.PlanReview.SUBMITTED_to_CORRECTIONS_REQUIRED
          - state_machines.PlanReview.CORRECTIONS_REQUIRED_to_SUBMITTED
          - state_machines.PlanReview.SUBMITTED_to_APPROVED
          - entities.Establishment.fields.plan_review_cycles_used
        distinguishing_aspect: "The PlanReview loop SUBMITTED -> CORRECTIONS_REQUIRED -> SUBMITTED raises cycle_count to 2 and mirrors it onto Establishment.plan_review_cycles_used, and the follow-up APPROVE then advances the Establishment to PENDING_INSPECTION."
        test_recipe:
          setup:
            - "One Establishment whose PlanReview was returned for corrections because it declared no handwash sink."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Cycle Ink", street_address: "13 Thirteenth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-C1", sterilization_area_sqft: 60, procedure_station_count: 2, has_handwash_sink: false }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "REQUEST_CORRECTIONS", decision_notes: "Add a dedicated handwash sink." }
              as: PlanReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /body-art/plan-reviews/${pr_id}/resubmit"
              payload: { floor_plan_reference: "FP-C2", sterilization_area_sqft: 60, procedure_station_count: 2, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { st_after_resubmit: $.data.status, cc: $.data.cycle_count, notes: $.data.decision_notes }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Sink added." }
              as: PlanReviewer
              as_user_id: "reviewer-1"
              captures: { st_final: $.data.status }
          assert:
            - "${st_after_resubmit} == SUBMITTED"
            - "${cc} == 2"
            - "${notes} == null"
            - "${st_final} == APPROVED"
            - "PlanReview.${pr_id}.has_handwash_sink == true"
            - "Establishment.${est_id}.plan_review_cycles_used == 2"
            - "Establishment.${est_id}.permit_status == PENDING_INSPECTION"
            - "Establishment.${est_id}.operating_posture == CLOSED"

      - name: complaint_triage_spawns_inspection_and_reopen_limit_is_enforced
        claim_type: Cross-entity
        grounds:
          - state_machines.Complaint.RECEIVED_to_TRIAGED
          - state_machines.Complaint.UNSUBSTANTIATED_to_INVESTIGATING
          - entities.Inspection.fields.source_complaint_id
          - errors[ERR_COMPLAINT_REOPEN_LIMIT]
        distinguishing_aspect: "TRIAGE creates exactly one COMPLAINT inspection linked by source_complaint_id and scheduled 24 hours out for 120 minutes, and the third REOPEN is rejected once reopen_count has reached COMPLAINT_MAX_REOPENS of 2."
        test_recipe:
          setup:
            - "One Establishment with a single complaint filed at the default clock instant 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Complaint Ink", street_address: "14 Fourteenth St", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/complaints"
              payload: { establishment_id: "${est_id}", complainant_contact: "walker@example.com", category: "INJURY", narrative: "Piercing site became inflamed." }
              as: PublicUser
              as_user_id: "citizen-2"
              captures: { cmp_id: $.data.id, tdue: $.data.triage_due_at }
          trigger:
            - call: "POST /body-art/complaints/${cmp_id}/transition"
              payload: { action: "TRIAGE" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { overdue: $.data.triage_overdue }
            - call: "GET /body-art/inspections"
              payload: { source_complaint_id: "${cmp_id}" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { spawn_type: "$.data[0].inspection_type", spawn_start: "$.data[0].scheduled_start_at", spawn_end: "$.data[0].scheduled_end_at" }
            - call: "POST /body-art/complaints/${cmp_id}/transition"
              payload: { action: "INVESTIGATE" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/complaints/${cmp_id}/transition"
              payload: { action: "UNSUBSTANTIATE" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/complaints/${cmp_id}/transition"
              payload: { action: "REOPEN" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/complaints/${cmp_id}/transition"
              payload: { action: "UNSUBSTANTIATE" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/complaints/${cmp_id}/transition"
              payload: { action: "REOPEN" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { rc2: $.data.reopen_count }
            - call: "POST /body-art/complaints/${cmp_id}/transition"
              payload: { action: "UNSUBSTANTIATE" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "POST /body-art/complaints/${cmp_id}/transition"
              payload: { action: "REOPEN" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { err: $.data.error_id }
          assert:
            - "${tdue} == 2026-05-06T00:00:00.000Z"
            - "${overdue} == false"
            - "${spawn_type} == COMPLAINT"
            - "${spawn_start} == 2026-05-02T00:00:00.000Z"
            - "${spawn_end} == 2026-05-02T02:00:00.000Z"
            - "${rc2} == 2"
            - "${err} == ERR_COMPLAINT_REOPEN_LIMIT"
            - "HTTP status of the third REOPEN is 409"
            - "Complaint.${cmp_id}.status == UNSUBSTANTIATED"
            - "Complaint.${cmp_id}.reopen_count == 2"

      - name: clock_sweep_expires_permit_and_deactivates_roster
        claim_type: Cascade down
        grounds:
          - state_machines.Establishment.ACTIVE_to_EXPIRED
          - state_machines.Artist.ACTIVE_to_INACTIVE
          - endpoints["POST /body-art/_clock/set_current_utc"]
        distinguishing_aspect: "Moving the logical clock to exactly permit_expires_on (the comparison is <=) expires the permit, lists the establishment in expired_establishment_ids, flips the ACTIVE artist to INACTIVE and drops active_artist_count to 0."
        test_recipe:
          setup:
            - "One ACTIVE Establishment permitted at 2026-05-01T00:00:00Z, so permit_expires_on is 2027-05-01T00:00:00Z, with one ACTIVE Artist."
          setup_api_calls:
            - call: "POST /body-art/establishments"
