# =============================================================================
# PRD Benchmark Scaffold — Developer Relations & API Program
# Generated per skills/prd-bench-scaffold-generator/SKILL.md (§1.0–§1.7).
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  2955. Developer Relations & Application Programming Interface Program (platform developer program):
  developer onboarding with documentation, sandbox provisioning and sample applications, application
  review and access tier approval with scope justification and data access limits, rate limiting,
  quota assignment and burst allowance with upgrade request handling, versioning and deprecation
  policy with sunset timelines, migration guides and breaking change notice periods, partner support
  with escalation channels, service level commitments and incident communication, terms of service
  enforcement with usage monitoring, policy violation investigation and access revocation, ecosystem
  programs including hackathons, certification and directory listings, developer feedback loops
  feeding platform roadmap prioritization

domain_name: developer-relations-api-program

# Flat topology: every collection is a root-level peer resource reached by its own
# path; there is no single aggregate-root collection that all others nest under.
api_prefix: "/"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys (Developer, ApiProduct, ApiVersion,
  # AccessApplication, QuotaAssignment, UpgradeRequest, UsageWindow, SandboxLease,
  # ViolationCase, SupportCase, FeedbackItem). Only two read paths are nested, and
  # purely as FK reverse-reachability channels for cascade-created children.

  state_machine_shape: parallel
  # Developer carries three independent state dimensions (onboarding_state x standing x
  # directory_state); QuotaAssignment carries two (entitlement_state x throttle_state);
  # AccessApplication is cyclic (UNDER_REVIEW -> CHANGES_REQUESTED -> SUBMITTED);
  # ViolationCase is branching-with-cycle (UPHELD -> APPEALED -> INVESTIGATING).

  relationship_patterns:
    - one_to_many          # ApiProduct -> ApiVersion, QuotaAssignment -> UsageWindow
    - cross_aggregate      # QuotaAssignment pins ApiVersion across the product aggregate
    - polymorphic          # SupportCase.kind switches which FK is required vs forbidden
    - self_referential     # ViolationCase.appeal re-enters its own INVESTIGATING state

  role_model: segregation_of_duties
  # The operator who claims an AccessApplication review (reviewer_user_id) may not be the
  # operator who decides it; the operator who investigates a ViolationCase may not be the
  # operator who adjudicates it. Both are enforced on X-User-ID equality.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Density targets: 11 entities, 55 endpoints, 52 error codes, 6 calculations
  # (3 with divergent variants), 10 state machines, 2 OCC races.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Developer
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: registered organisation name of the developer account
        constraints: "1..120 chars"
      - name: contact_email
        type: string
        source: input
        description: primary technical contact address
        constraints: "must contain '@'; 5..160 chars"
      - name: region_code
        type: enum
        source: input
        description: data-residency region the account is provisioned in
        constraints: "one of US, EU, APAC"
      - name: onboarding_state
        type: enum
        source: system
        description: documentation/sandbox onboarding dimension of the Developer state machine
        default: REGISTERED
        constraints: "one of REGISTERED, DOCS_ACKNOWLEDGED, SANDBOX_VALIDATED, PRODUCTION_ACTIVE"
      - name: standing
        type: enum
        source: system
        description: terms-of-service standing dimension; gates every child write
        default: GOOD_STANDING
        constraints: "one of GOOD_STANDING, UNDER_REVIEW, RESTRICTED, REVOKED"
      - name: directory_state
        type: enum
        source: system
        description: ecosystem directory-listing dimension of the Developer state machine
        default: NOT_LISTED
        constraints: "one of NOT_LISTED, PENDING_REVIEW, LISTED, DELISTED"
      - name: directory_summary
        type: string
        source: input
        description: public directory blurb supplied at directory submission; null until first submission
        default: null
        constraints: "when present 20..400 chars"
      - name: docs_version_acknowledged
        type: integer
        source: system
        description: documentation revision the developer acknowledged at onboarding; null before acknowledgement
        default: null
        constraints: ">= 1"
      - name: tos_version_accepted
        type: integer
        source: system
        description: terms-of-service revision accepted at onboarding; compared against ApiProduct.required_tos_version
        default: null
        constraints: ">= 1"
      - name: certification_level
        type: enum
        source: system
        description: certification tier earned through ecosystem participation
        default: NONE
        constraints: "one of NONE, ASSOCIATE, PROFESSIONAL"
      - name: certification_expires_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the current certification lapses; null when certification_level is NONE
        default: null
      - name: hackathon_award_count
        type: integer
        source: system
        description: number of recorded hackathon awards; feeds trust scoring
        default: 0
      - name: clean_window_count
        type: integer
        source: system
        description: count of ingested UsageWindow rows for this developer with overage_calls == 0 AND rate_limit_breach == false
        default: 0
      - name: throttled_window_count
        type: integer
        source: system
        description: count of ingested UsageWindow rows for this developer whose resulting_throttle_state != NORMAL
        default: 0
      - name: violation_points
        type: integer
        source: system
        description: running penalty ledger; equals the sum of ViolationCase.points_applied over cases in state UPHELD or UPHELD_FINAL
        default: 0
      - name: trust_score
        type: integer
        source: computed
        description: onboarding_snapshot variant of calculations.developer_trust_score; drives the provisioning trust multiplier
        default: 50
        constraints: "0..100"
      - name: audited_trust_score
        type: integer
        source: computed
        description: enforcement_audit variant of calculations.developer_trust_score; recomputed only by POST /program-checkpoints
        default: 50
        constraints: "0..100"
      - name: revoked_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant standing became REVOKED; null otherwise
        default: null

  - name: ApiProduct
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: product name exposed in the developer portal
        constraints: "1..120 chars"
      - name: data_sensitivity
        type: enum
        source: input
        description: highest data class the product exposes; sets the deprecation notice baseline
        constraints: "one of PUBLIC, PERSONAL, FINANCIAL"
      - name: scope_catalog
        type: array
        source: input
        description: "array of objects { scope: string, sensitivity: PUBLIC|PERSONAL|FINANCIAL }; the only scopes an application may request"
        constraints: "1..20 entries; scope values unique within the array"
      - name: sample_app_slugs
        type: array
        source: input
        description: array of strings naming the sample applications a sandbox lease may seed
        constraints: "1..10 entries"
      - name: sustained_rpm_pool
        type: integer
        source: input
        description: finite sustained requests-per-minute capacity the product can allocate across assignments
        constraints: ">= 1"
      - name: monthly_call_pool
        type: integer
        source: input
        description: finite monthly call allowance the product can allocate across assignments
        constraints: ">= 1"
      - name: allocated_sustained_rpm
        type: integer
        source: system
        description: sum of QuotaAssignment.sustained_rpm over assignments whose entitlement_state is PROVISIONED or ACTIVE
        default: 0
      - name: allocated_monthly_calls
        type: integer
        source: system
        description: sum of QuotaAssignment.monthly_call_allowance over assignments whose entitlement_state is PROVISIONED or ACTIVE
        default: 0
      - name: available_sustained_rpm
        type: integer
        source: computed
        description: sustained_rpm_pool - allocated_sustained_rpm
      - name: available_monthly_calls
        type: integer
        source: computed
        description: monthly_call_pool - allocated_monthly_calls
      - name: required_tos_version
        type: integer
        source: input
        description: terms-of-service revision a developer must have accepted before submitting an application for this product
        default: 1
        constraints: ">= 1"
      - name: demand_index
        type: number
        source: computed
        description: calculations.feedback_roadmap_prioritisation step 2 output; sum of FeedbackItem.raw_impact over items in state TRIAGED or ROADMAP_ACCEPTED
        default: 0.00
        constraints: "2 decimal places"

  - name: ApiVersion
    parent: null
    common_fields: true
    fields:
      - name: api_product_id
        type: string
        source: input
        description: "FK -> ApiProduct.id; the product this version belongs to"
      - name: semver
        type: string
        source: input
        description: version label such as 2.1.0
        constraints: "matches <major>.<minor>.<patch>"
      - name: lifecycle_state
        type: enum
        source: system
        description: versioning/deprecation lifecycle state
        default: PREVIEW
        constraints: "one of PREVIEW, GENERAL_AVAILABILITY, DEPRECATION_ANNOUNCED, SUNSET"
      - name: breaking_change
        type: boolean
        source: input
        description: whether this version introduces breaking changes; adds 30 days to the required notice period and requires a published migration guide before deprecation
        default: false
      - name: migration_guide_url
        type: string
        source: system
        description: URL captured when the migration guide is published; null until then
        default: null
      - name: migration_guide_published_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the migration guide was published; null until then
        default: null
      - name: deprecation_announced_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant deprecation was announced; null until then
        default: null
      - name: sunset_at
        type: datetime
        source: computed
        description: >-
          ISO 8601 UTC instant access to this version stops; computed at deprecation announcement as
          the logical clock plus the submitted notice_days whole days, null before announcement
        default: null
      - name: required_notice_days
        type: integer
        source: computed
        description: calculations.deprecation_notice_requirement output evaluated at announcement time; null before announcement
        default: null
      - name: notice_days_at_announcement
        type: integer
        source: computed
        description: floor of whole days between the logical clock and sunset_at at announcement time; null before announcement
        default: null
      - name: sunset_completed_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant lifecycle_state became SUNSET; null otherwise
        default: null

  - name: AccessApplication
    parent: null
    common_fields: true
    fields:
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; the applying developer"
      - name: target_api_version_id
        type: string
        source: input
        description: "FK -> ApiVersion.id; the version access is requested against; its ApiVersion.api_product_id identifies the product"
      - name: requested_tier
        type: enum
        source: input
        description: access tier the developer asks for
        constraints: "one of SANDBOX, STANDARD, PARTNER, PRIVILEGED"
      - name: requested_scopes
        type: array
        source: input
        description: array of scope strings; each must appear in the product's scope_catalog
        constraints: "1..20 entries, unique"
      - name: requested_monthly_calls
        type: integer
        source: input
        description: monthly call volume the developer asks for
        constraints: ">= 1"
      - name: justification_text
        type: string
        source: input
        description: scope justification; required when requested_tier is PARTNER or PRIVILEGED, or when any requested scope has sensitivity other than PUBLIC
        default: null
        constraints: "when required, >= 40 chars"
      - name: state
        type: enum
        source: system
        description: review lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, SUBMITTED, UNDER_REVIEW, CHANGES_REQUESTED, APPROVED, REJECTED"
      - name: revision_round
        type: integer
        source: system
        description: number of completed change-request rounds; caps at 3
        default: 0
      - name: reviewer_user_id
        type: string
        source: system
        description: X-User-ID of the DevRelManager who claimed the review; segregation-of-duties anchor
        default: null
      - name: approver_user_id
        type: string
        source: system
        description: X-User-ID of the PlatformAdmin who decided the application
        default: null
      - name: approved_tier
        type: enum
        source: system
        description: tier granted at decision; rank must not exceed requested_tier
        default: null
        constraints: "one of SANDBOX, STANDARD, PARTNER, PRIVILEGED"
      - name: granted_scopes
        type: array
        source: system
        description: subset of requested_scopes granted at decision
        default: null
      - name: data_access_limit
        type: enum
        source: computed
        description: highest data sensitivity the approved tier may touch, from constants TIER_MAX_SENSITIVITY; null before approval
        default: null
        constraints: "one of PUBLIC, PERSONAL, FINANCIAL"
      - name: changes_requested_note
        type: string
        source: system
        description: reviewer note recorded on the most recent change request
        default: null
      - name: decision_reason
        type: string
        source: system
        description: approver note recorded at decision
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant of the APPROVED/REJECTED decision; null before
        default: null

  - name: QuotaAssignment
    parent: null
    common_fields: true
    fields:
      - name: developer_id
        type: string
        source: system
        description: "FK -> Developer.id; copied from the approved AccessApplication at provisioning"
      - name: access_application_id
        type: string
        source: input
        description: "FK -> AccessApplication.id; the APPROVED application this entitlement realises"
      - name: pinned_api_version_id
        type: string
        source: system
        description: "FK -> ApiVersion.id; copied from AccessApplication.target_api_version_id and frozen; version sunset retires this row"
      - name: tier
        type: enum
        source: system
        description: copied from AccessApplication.approved_tier at provisioning
        constraints: "one of SANDBOX, STANDARD, PARTNER, PRIVILEGED"
      - name: granted_scopes
        type: array
        source: system
        description: copied from AccessApplication.granted_scopes at provisioning
      - name: sustained_rpm
        type: integer
        source: computed
        description: calculations.quota_provisioning step 2 output (the pool-clamped sustained rate); reserved from ApiProduct.sustained_rpm_pool
      - name: burst_rpm
        type: integer
        source: computed
        description: calculations.quota_provisioning step 3 output; burst headroom derived from the clamped sustained_rpm, not drawn from any pool
      - name: burst_credit_balance
        type: integer
        source: computed
        description: remaining burst-attributed calls for the current month; set to burst_rpm * BURST_CREDIT_MINUTES at provisioning and at each monthly reset
      - name: monthly_call_allowance
        type: integer
        source: computed
        description: calculations.quota_provisioning step 4 output; monthly calls reserved from ApiProduct.monthly_call_pool
      - name: bonus_call_credit
        type: integer
        source: system
        description: service-level credit calls granted by incident resolution; added to the throttle denominator and never drawn from ApiProduct.monthly_call_pool
        default: 0
      - name: monthly_calls_consumed
        type: integer
        source: system
        description: calls charged to the allowance so far this month; reset by POST /program-checkpoints on a calendar-month rollover
        default: 0
      - name: entitlement_state
        type: enum
        source: system
        description: entitlement dimension of the QuotaAssignment state machine
        default: PROVISIONED
        constraints: "one of PROVISIONED, ACTIVE, SUSPENDED, RETIRED"
      - name: throttle_state
        type: enum
        source: system
        description: rate-limiting dimension of the QuotaAssignment state machine; evolves independently of entitlement_state
        default: NORMAL
        constraints: "one of NORMAL, SOFT_THROTTLED, HARD_THROTTLED"
      - name: trust_multiplier_applied
        type: number
        source: computed
        description: TRUST_MULTIPLIER band selected from Developer.trust_score at the most recent provisioning or reinstatement
        constraints: "one of 0.50, 0.75, 1.00, 1.25"
      - name: activated_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant entitlement_state first became ACTIVE; null before
        default: null
      - name: suspended_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant entitlement_state became SUSPENDED; null otherwise
        default: null
      - name: suspension_reason
        type: string
        source: system
        description: reason recorded by the suspending actor or by the standing cascade
        default: null
      - name: retired_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant entitlement_state became RETIRED; null otherwise
        default: null
      - name: last_reset_at
        type: datetime
        source: system
        description: >-
          ISO 8601 UTC instant of the most recent monthly counter reset; set at provisioning and
          advanced by POST /program-checkpoints step 5 once 30 or more whole days have passed
        default: null

  - name: UpgradeRequest
    parent: null
    common_fields: true
    fields:
      - name: quota_assignment_id
        type: string
        source: input
        description: "FK -> QuotaAssignment.id; the entitlement to be raised"
      - name: requested_sustained_rpm
        type: integer
        source: input
        description: target sustained rate limit; must exceed the assignment's current sustained_rpm
        constraints: ">= 1"
      - name: justification_text
        type: string
        source: input
        description: business justification for the increase
        constraints: ">= 40 chars"
      - name: requested_delta_rpm
        type: integer
        source: computed
        description: requested_sustained_rpm - QuotaAssignment.sustained_rpm evaluated at creation time
      - name: granted_delta_rpm
        type: integer
        source: system
        description: sustained rpm actually added by the allocation run
        default: 0
      - name: state
        type: enum
        source: system
        description: allocation lifecycle state
        default: PENDING
        constraints: "one of PENDING, GRANTED, PARTIALLY_GRANTED, DEFERRED, VOIDED, SUPERSEDED"
      - name: denial_reason
        type: enum
        source: system
        description: why the run refused or partially filled the request
        default: null
        constraints: "one of POOL_EXHAUSTED, STANDING_BLOCKED"
      - name: run_sequence
        type: integer
        source: system
        description: 1-based position this request occupied in the allocation run that decided it; null while PENDING
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the allocation run decided this request; null while PENDING
        default: null

  - name: UsageWindow
    parent: null
    common_fields: false
    fields:
      - name: quota_assignment_id
        type: string
        source: input
        description: "FK -> QuotaAssignment.id; the entitlement the traffic was measured against"
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC start of the one-hour measurement bucket; minutes, seconds and milliseconds must be zero
      - name: window_end
        type: datetime
        source: computed
        description: window_start plus 60 minutes
      - name: total_calls
        type: integer
        source: input
        description: calls observed in the window
        constraints: ">= 0"
      - name: burst_calls
        type: integer
        source: input
        description: subset of total_calls served above the sustained rate
        constraints: "0 <= burst_calls <= total_calls"
      - name: attribution_variant
        type: enum
        source: computed
        description: which calculations.usage_consumption_attribution variant was applied to this window
        constraints: "one of BURST_ISOLATED, BURST_INCLUSIVE"
      - name: calls_charged_to_allowance
        type: integer
        source: computed
        description: calls added to QuotaAssignment.monthly_calls_consumed by this window
      - name: burst_credit_consumed
        type: integer
        source: computed
        description: calls deducted from QuotaAssignment.burst_credit_balance by this window
      - name: monthly_calls_consumed_after
        type: integer
        source: computed
        description: QuotaAssignment.monthly_calls_consumed after this window was applied
      - name: overage_calls
        type: integer
        source: computed
        description: max(0, monthly_calls_consumed_after - (monthly_call_allowance + bonus_call_credit))
      - name: rate_limit_breach
        type: boolean
        source: computed
        description: >-
          true when total_calls / WINDOW_MINUTES exceeds QuotaAssignment.burst_rpm, i.e. when
          total_calls > burst_rpm * 60; burst_rpm already includes the sustained component, so the
          sustained rate is NOT added again
      - name: resulting_throttle_state
        type: enum
        source: computed
        description: QuotaAssignment.throttle_state after this window was applied
        constraints: "one of NORMAL, SOFT_THROTTLED, HARD_THROTTLED"

  - name: SandboxLease
    parent: null
    common_fields: true
    fields:
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; the leaseholder"
      - name: api_product_id
        type: string
        source: input
        description: "FK -> ApiProduct.id; the product whose sandbox is leased"
      - name: starts_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the lease occupation begins (inclusive)
      - name: lease_days
        type: integer
        source: input
        description: lease length in whole days
        constraints: "1..30"
      - name: expires_at
        type: datetime
        source: computed
        description: starts_at plus lease_days days; the lease occupies the half-open interval [starts_at, expires_at)
      - name: sample_app_slug
        type: string
        source: input
        description: sample application seeded into the sandbox; must appear in ApiProduct.sample_app_slugs
      - name: state
        type: enum
        source: system
        description: lease lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, RELEASED, EXPIRED, REVOKED"
      - name: released_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the leaseholder released the lease; null otherwise
        default: null
      - name: closed_reason
        type: enum
        source: system
        description: why a non-ACTIVE lease closed
        default: null
        constraints: "one of DEVELOPER_RELEASE, CHECKPOINT_EXPIRY, STANDING_CASCADE"

  - name: ViolationCase
    parent: null
    common_fields: true
    fields:
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; the investigated developer"
      - name: quota_assignment_id
        type: string
        source: input
        description: "FK -> QuotaAssignment.id; the entitlement the abuse was observed on; null for cases not tied to one entitlement"
        default: null
      - name: category
        type: enum
        source: input
        description: terms-of-service clause allegedly breached
        constraints: "one of RATE_ABUSE, SCOPE_OVERREACH, DATA_RETENTION, RESALE"
      - name: severity
        type: enum
        source: input
        description: severity band, multiplies the category base points
        constraints: "one of LOW, MEDIUM, HIGH"
      - name: summary
        type: string
        source: input
        description: investigator summary of the alleged violation
        constraints: "10..500 chars"
      - name: evidence_window_ids
        type: array
        source: input
        description: array of UsageWindow ids cited as evidence; each must reference an existing UsageWindow of the developer's assignments
        default: null
      - name: state
        type: enum
        source: system
        description: investigation lifecycle state
        default: OPENED
        constraints: "one of OPENED, INVESTIGATING, UPHELD, APPEALED, UPHELD_FINAL, DISMISSED"
      - name: penalty_points
        type: integer
        source: computed
        description: calculations.violation_penalty_points output; the points an upheld outcome would apply
      - name: points_applied
        type: integer
        source: system
        description: points actually added to Developer.violation_points by this case; reset to 0 when a dismissal reverses the case
        default: 0
      - name: opened_by_user_id
        type: string
        source: system
        description: X-User-ID of the TrustAndSafetyOfficer who opened the case
      - name: investigator_user_id
        type: string
        source: system
        description: X-User-ID of the TrustAndSafetyOfficer who started the investigation; segregation-of-duties anchor
        default: null
      - name: adjudicator_user_id
        type: string
        source: system
        description: X-User-ID of the PlatformAdmin who adjudicated the case
        default: null
      - name: remediation_deadline
        type: datetime
        source: computed
        description: logical clock at investigation start plus REMEDIATION_DAYS[severity] days; null before investigation
        default: null
      - name: appeal_deadline
        type: datetime
        source: computed
        description: logical clock at the UPHELD adjudication plus APPEAL_WINDOW_DAYS days; null unless UPHELD
        default: null
      - name: outcome
        type: enum
        source: system
        description: adjudicated outcome of the most recent adjudication
        default: null
        constraints: "one of UPHELD, DISMISSED"
      - name: appeal_reason
        type: string
        source: system
        description: developer statement recorded when the case was appealed
        default: null
      - name: appeal_count
        type: integer
        source: system
        description: number of appeals filed; at most 1 is permitted
        default: 0
      - name: decision_note
        type: string
        source: system
        description: adjudicator note recorded at the most recent adjudication
        default: null

  - name: SupportCase
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: PARTNER_TICKET requires developer_id and an ACTIVE entitlement; PLATFORM_INCIDENT forbids developer_id and carries the incident window
        constraints: "one of PARTNER_TICKET, PLATFORM_INCIDENT"
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; the reporting partner for PARTNER_TICKET, null for PLATFORM_INCIDENT"
        default: null
      - name: api_product_id
        type: string
        source: input
        description: "FK -> ApiProduct.id; the affected product"
      - name: severity
        type: enum
        source: input
        description: severity band; selects the first-response and communication-cadence commitments
        constraints: "one of S1, S2, S3, S4"
      - name: title
        type: string
        source: input
        description: short case title
        constraints: "5..200 chars"
      - name: started_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the incident began; required for PLATFORM_INCIDENT, and set to created_at for PARTNER_TICKET
        default: null
      - name: state
        type: enum
        source: system
        description: support lifecycle state
        default: OPEN
        constraints: "one of OPEN, RESPONDING, ESCALATED, RESOLVED"
      - name: escalation_tier
        type: integer
        source: system
        description: escalation channel depth; incremented by escalation, capped at 3
        default: 0
        constraints: "0..3"
      - name: first_response_due_minutes
        type: integer
        source: computed
        description: FIRST_RESPONSE_SLA_MINUTES[kind][severity]
      - name: first_response_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant of the first recorded communication; null before
        default: null
      - name: first_response_breached
        type: boolean
        source: computed
        description: true when the first communication landed later than started_at plus first_response_due_minutes
        default: false
      - name: communication_count
        type: integer
        source: system
        description: number of recorded incident/ticket communications
        default: 0
      - name: last_communication_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant of the most recent communication; null before
        default: null
      - name: max_communication_gap_minutes
        type: integer
        source: computed
        description: largest gap in whole minutes among started_at -> first communication, consecutive communications, and last communication -> resolved_at
        default: 0
      - name: comms_gap_breached
        type: boolean
        source: computed
        description: true when max_communication_gap_minutes exceeds COMMS_MAX_GAP_MINUTES[severity]
        default: false
      - name: resolved_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant the case was resolved; null before
        default: null
      - name: downtime_minutes
        type: integer
        source: computed
        description: whole minutes between started_at and resolved_at, floored; null before resolution
        default: null
      - name: credit_uplift_applied
        type: number
        source: computed
        description: 1.5 when comms_gap_breached is true at resolution, otherwise 1.0; null before resolution
        default: null
      - name: affected_assignment_count
        type: integer
        source: computed
        description: number of QuotaAssignment rows credited at resolution
        default: 0
      - name: total_credit_calls
        type: integer
        source: computed
        description: calculations.sla_service_credit output; sum of the per-assignment rounded credit calls
        default: 0
      - name: resolution_note
        type: string
        source: system
        description: note recorded at resolution
        default: null

  - name: FeedbackItem
    parent: null
    common_fields: true
    fields:
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; the author"
      - name: api_product_id
        type: string
        source: input
        description: "FK -> ApiProduct.id; the product the feedback targets"
      - name: category
        type: enum
        source: input
        description: feedback class; selects the severity weight
        constraints: "one of DEFECT, MISSING_FEATURE, DX_FRICTION, DOC_GAP"
      - name: body
        type: string
        source: input
        description: feedback text
        constraints: "10..2000 chars"
      - name: state
        type: enum
        source: system
        description: triage lifecycle state
        default: SUBMITTED
        constraints: "one of SUBMITTED, TRIAGED, ROADMAP_ACCEPTED, DECLINED"
      - name: author_top_tier
        type: enum
        source: computed
        description: highest TIER_RANK among the author's QuotaAssignment rows in entitlement_state ACTIVE at triage time, or NONE when the author has none
        default: null
        constraints: "one of NONE, SANDBOX, STANDARD, PARTNER, PRIVILEGED"
      - name: raw_impact
        type: number
        source: computed
        description: calculations.feedback_roadmap_prioritisation step 1 output; null before triage
        default: null
        constraints: "2 decimal places"
      - name: priority_score
        type: number
        source: computed
        description: calculations.feedback_roadmap_prioritisation step 3 output; null before triage and null once DECLINED
        default: null
        constraints: "2 decimal places"
      - name: triaged_by_user_id
        type: string
        source: system
        description: X-User-ID of the DevRelManager who triaged the item
        default: null
      - name: decision_note
        type: string
        source: system
        description: triage note
        default: null
      - name: triaged_at
        type: datetime
        source: system
        description: ISO 8601 UTC instant of the first triage; null before
        default: null

# ---------------------------------------------------------------------------
# §1.2 State machines
#
# Developer carries THREE independent state dimensions (parallel shape):
# onboarding_state, standing and directory_state. Each is emitted as its own
# machine below with `state_field:` naming the dimension it governs; a
# transition on one dimension never implies a transition on another except
# where an explicit side effect says so.
# ---------------------------------------------------------------------------
state_machines:
  - entity: Developer
    state_field: onboarding_state
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: DOCS_ACKNOWLEDGED
        trigger: "POST /developers/{id}/onboarding-acknowledgement"
        actor: Developer
        preconditions:
          - "acting developer is the target developer"
          - "docs_version submitted equals the platform current docs version (2)"
          - "tos_version submitted equals ApiProduct.required_tos_version of at least one product"
        side_effects:
          - "sets docs_version_acknowledged and tos_version_accepted"
          - "recomputes trust_score under the onboarding_snapshot variant"
      - from: DOCS_ACKNOWLEDGED
        to: SANDBOX_VALIDATED
        trigger: "POST /sandbox-leases/{id}/validate"
        actor: Developer
        preconditions:
          - "lease belongs to the acting developer"
          - "lease.state == ACTIVE"
          - "lease.sample_app_slug is non-null"
        side_effects:
          - "records the validated sample app on the lease"
          - "recomputes trust_score under the onboarding_snapshot variant"
      - from: SANDBOX_VALIDATED
        to: PRODUCTION_ACTIVE
        trigger: "system event: first QuotaAssignment activation (POST /quota-assignments/{id}/activate)"
        actor: system
        preconditions:
          - "developer has at least one QuotaAssignment reaching entitlement_state ACTIVE"
        side_effects:
          - "developer becomes eligible for directory submission"
      - from: DOCS_ACKNOWLEDGED
        to: DOCS_ACKNOWLEDGED
        trigger: "POST /developers/{id}/onboarding-acknowledgement with a newer docs_version"
        actor: Developer
        preconditions:
          - "docs_version submitted is strictly greater than docs_version_acknowledged"
        side_effects:
          - "updates docs_version_acknowledged and tos_version_accepted"
        note: "re-acknowledgement is idempotent in state but advances the recorded versions"

  - entity: Developer
    state_field: standing
    initial_state: GOOD_STANDING
    terminal_states: [REVOKED]
    transitions:
      - from: GOOD_STANDING
        to: UNDER_REVIEW
        trigger: "POST /violation-cases/{id}/investigate"
        actor: TrustAndSafetyOfficer
        preconditions:
          - "case.state == OPENED"
          - "case.developer_id == this developer"
        side_effects:
          - "sets case.state = INVESTIGATING and case.remediation_deadline"
          - "developer's ACTIVE QuotaAssignment rows keep serving but become ineligible for upgrade grants"
      - from: UNDER_REVIEW
        to: RESTRICTED
        trigger: "POST /violation-cases/{id}/adjudicate with outcome UPHELD reaching violation_points >= 50"
        actor: PlatformAdmin
        preconditions:
          - "case.state == INVESTIGATING or case.state == APPEALED"
          - "adjudicating user is not the case investigator (segregation of duties)"
        side_effects:
          - "adds case.penalty_points to developer.violation_points and records points_applied"
          - "cascade: every QuotaAssignment of the developer in entitlement_state ACTIVE becomes SUSPENDED with suspension_reason STANDING_RESTRICTION, and its sustained_rpm and monthly_call_allowance are returned to the ApiProduct pools"
          - "cascade: directory_state LISTED becomes DELISTED"
          - "cascade: every SandboxLease of the developer in state ACTIVE becomes REVOKED with closed_reason STANDING_CASCADE"
          - "every PENDING UpgradeRequest on those assignments becomes VOIDED"
      - from: UNDER_REVIEW
        to: GOOD_STANDING
        trigger: "POST /violation-cases/{id}/adjudicate with outcome DISMISSED"
        actor: PlatformAdmin
        preconditions:
          - "case.state == INVESTIGATING or case.state == APPEALED"
          - "no other case of this developer is in state OPENED, INVESTIGATING or APPEALED"
        side_effects:
          - "compensation: subtracts case.points_applied from developer.violation_points and resets case.points_applied to 0"
          - "case.state = DISMISSED"
      - from: RESTRICTED
        to: GOOD_STANDING
        trigger: "POST /violation-cases/{id}/adjudicate with outcome DISMISSED on the appealed case"
        actor: PlatformAdmin
        preconditions:
          - "case.state == APPEALED"
          - "resulting violation_points < 50"
        side_effects:
          - "compensation: subtracts case.points_applied from developer.violation_points"
          - "SUSPENDED assignments whose suspension_reason is STANDING_RESTRICTION are restored to ACTIVE and re-deduct their sustained_rpm and monthly_call_allowance from the ApiProduct pools"
          - "note: SandboxLease rows revoked by the cascade are NOT restored"
      - from: RESTRICTED
        to: REVOKED
        trigger: "POST /developers/{id}/revoke-access"
        actor: PlatformAdmin
        preconditions:
          - "developer.violation_points >= 100 OR the developer has at least one case in state UPHELD_FINAL"
          - "revoking user is not the investigator of any of the developer's cases"
        side_effects:
          - "sets revoked_at from the logical clock"
          - "cascade: all non-RETIRED QuotaAssignment rows become RETIRED and release their pool reservations"
          - "cascade: directory_state becomes DELISTED"
          - "cascade: all ACTIVE SandboxLease rows become REVOKED with closed_reason STANDING_CASCADE"
          - "cascade: all SUBMITTED / UNDER_REVIEW / CHANGES_REQUESTED AccessApplication rows become REJECTED with decision_reason ACCESS_REVOKED"

  - entity: Developer
    state_field: directory_state
    initial_state: NOT_LISTED
    terminal_states: []
    transitions:
      - from: NOT_LISTED
        to: PENDING_REVIEW
        trigger: "POST /developers/{id}/directory-submission"
        actor: Developer
        preconditions:
          - "onboarding_state == PRODUCTION_ACTIVE"
          - "standing == GOOD_STANDING"
          - "certification_level != NONE and certification_expires_at is at or after the logical clock"
        side_effects:
          - "records directory_summary"
      - from: PENDING_REVIEW
        to: LISTED
        trigger: "POST /developers/{id}/directory-review with decision APPROVE"
        actor: DevRelManager
        preconditions:
          - "directory_state == PENDING_REVIEW"
          - "standing == GOOD_STANDING"
        side_effects: []
      - from: PENDING_REVIEW
        to: NOT_LISTED
        trigger: "POST /developers/{id}/directory-review with decision REJECT"
        actor: DevRelManager
        preconditions:
          - "directory_state == PENDING_REVIEW"
        side_effects:
          - "clears directory_summary"
      - from: LISTED
        to: DELISTED
        trigger: "system event: standing cascade to RESTRICTED or REVOKED"
        actor: system
        preconditions:
          - "directory_state == LISTED"
        side_effects: []
      - from: DELISTED
        to: PENDING_REVIEW
        trigger: "POST /developers/{id}/directory-submission after standing returns to GOOD_STANDING"
        actor: Developer
        preconditions:
          - "standing == GOOD_STANDING"
          - "certification_level != NONE and not expired"
        side_effects:
          - "records the new directory_summary"

  - entity: ApiVersion
    initial_state: PREVIEW
    terminal_states: [SUNSET]
    transitions:
      - from: PREVIEW
        to: GENERAL_AVAILABILITY
        trigger: "POST /api-versions/{id}/promote"
        actor: PlatformAdmin
        preconditions:
          - "lifecycle_state == PREVIEW"
        side_effects:
          - "the version becomes grantable to tiers STANDARD, PARTNER and PRIVILEGED"
      - from: GENERAL_AVAILABILITY
        to: DEPRECATION_ANNOUNCED
        trigger: "POST /api-versions/{id}/announce-deprecation"
        actor: PlatformAdmin
        preconditions:
          - "lifecycle_state == GENERAL_AVAILABILITY"
          - "notice_days >= calculations.deprecation_notice_requirement output"
          - "if breaking_change is true, migration_guide_url must already be published"
          - "at most 1 other version of the same ApiProduct may already be in DEPRECATION_ANNOUNCED (aggregate capacity 2)"
        side_effects:
          - "sets deprecation_announced_at from the logical clock, notice_days_at_announcement and sunset_at = announced_at + notice_days days"
          - "the version stays grantable to existing pinned assignments but becomes non-grantable to new applications"
      - from: DEPRECATION_ANNOUNCED
        to: SUNSET
        trigger: "system event: POST /program-checkpoints when the logical clock reaches sunset_at"
        actor: system
        preconditions:
          - "logical clock >= sunset_at"
        side_effects:
          - "sets sunset_completed_at"
          - "cascade: every QuotaAssignment pinned to this version in entitlement_state ACTIVE or SUSPENDED becomes RETIRED and releases its pool reservations"
          - "cascade: every PENDING UpgradeRequest on those assignments becomes VOIDED"
          - "cascade: every AccessApplication targeting this version in state SUBMITTED, UNDER_REVIEW or CHANGES_REQUESTED becomes REJECTED with decision_reason TARGET_VERSION_SUNSET"

  - entity: AccessApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /access-applications/{id}/submit"
        actor: Developer
        preconditions:
          - "acting developer owns the application"
          - "developer.standing == GOOD_STANDING"
          - "developer.tos_version_accepted >= required_tos_version of the target version's product"
          - "target ApiVersion.lifecycle_state is grantable for requested_tier"
          - "justification_text length >= JUSTIFICATION_MIN_CHARS[requested_tier]"
        side_effects:
          - "increments revision_round to 1 on the first submission"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /access-applications/{id}/claim-review"
        actor: DevRelManager
        preconditions:
          - "state == SUBMITTED"
        side_effects:
          - "records reviewer_user_id"
      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /access-applications/{id}/request-changes"
        actor: DevRelManager
        preconditions:
          - "state == UNDER_REVIEW"
          - "revision_round < MAX_REVISION_ROUNDS (3)"
          - "acting user is the recorded reviewer_user_id"
        side_effects:
          - "records changes_requested_note"
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /access-applications/{id}/submit (resubmission)"
        actor: Developer
        preconditions:
          - "acting developer owns the application"
          - "revision_round < MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "increments revision_round"
          - "clears changes_requested_note"
        note: "cyclic: UNDER_REVIEW -> CHANGES_REQUESTED -> SUBMITTED, bounded by MAX_REVISION_ROUNDS"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /access-applications/{id}/decide with decision APPROVE"
        actor: PlatformAdmin
        preconditions:
          - "state == UNDER_REVIEW"
          - "approving user is not the recorded reviewer_user_id (segregation of duties)"
          - "approved_tier rank <= requested_tier rank"
          - "granted_scopes is a subset of requested_scopes and of the product scope_catalog"
          - "granted scopes' sensitivity is permitted at approved_tier"
        side_effects:
          - "sets approver_user_id, approved_tier, granted_scopes, data_access_limit, decided_at"
          - "the application becomes the sole eligible basis for one QuotaAssignment"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /access-applications/{id}/decide with decision REJECT"
        actor: PlatformAdmin
        preconditions:
          - "state == UNDER_REVIEW"
          - "approving user is not the recorded reviewer_user_id"
        side_effects:
          - "sets decision_reason and decided_at"
      - from: CHANGES_REQUESTED
        to: REJECTED
        trigger: "POST /access-applications/{id}/decide with decision REJECT after the revision cap is exhausted"
        actor: PlatformAdmin
        preconditions:
          - "revision_round == MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "sets decision_reason REVISION_LIMIT_EXHAUSTED"

  - entity: QuotaAssignment
    state_field: entitlement_state
    initial_state: PROVISIONED
    terminal_states: [RETIRED]
    transitions:
      - from: PROVISIONED
        to: ACTIVE
        trigger: "POST /quota-assignments/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "entitlement_state == PROVISIONED"
          - "developer.standing == GOOD_STANDING"
          - "pinned ApiVersion.lifecycle_state != SUNSET"
        side_effects:
          - "sets activated_at from the logical clock"
          - "bubble up: if the developer's onboarding_state == SANDBOX_VALIDATED it advances to PRODUCTION_ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: standing cascade to RESTRICTED, or POST /quota-assignments/{id}/suspend"
        actor: system | PlatformAdmin
        preconditions:
          - "entitlement_state == ACTIVE"
        side_effects:
          - "sets suspended_at and suspension_reason"
          - "returns sustained_rpm to ApiProduct.allocated_sustained_rpm and monthly_call_allowance to ApiProduct.allocated_monthly_calls (both decremented)"
          - "every PENDING UpgradeRequest on this assignment becomes VOIDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /quota-assignments/{id}/reinstate, or system event: appeal dismissal restoring standing"
        actor: PlatformAdmin | system
        preconditions:
          - "developer.standing == GOOD_STANDING"
          - "pinned ApiVersion.lifecycle_state != SUNSET"
          - "ApiProduct.available_sustained_rpm >= sustained_rpm and available_monthly_calls >= monthly_call_allowance"
        side_effects:
          - "clears suspended_at and suspension_reason"
          - "re-deducts sustained_rpm and monthly_call_allowance from the ApiProduct pools"
      - from: ACTIVE
        to: RETIRED
        trigger: "system event: sunset cascade or developer revocation"
        actor: system
        preconditions: []
        side_effects:
          - "sets retired_at, releases both pool reservations, voids PENDING UpgradeRequest rows"
      - from: SUSPENDED
        to: RETIRED
        trigger: "system event: sunset cascade or developer revocation"
        actor: system
        preconditions: []
        side_effects:
          - "sets retired_at; pool reservations were already released at suspension and are NOT released twice"
        note: "compensating invariant: pool release is idempotent across SUSPENDED -> RETIRED"

  - entity: QuotaAssignment
    state_field: throttle_state
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: SOFT_THROTTLED
        trigger: "POST /quota-assignments/{id}/usage-windows whose consumption ratio reaches 0.80"
        actor: system
        preconditions:
          - "calculations.usage_consumption_attribution yields ratio >= 0.80 and < 1.00"
        side_effects:
          - "increments developer.throttled_window_count and resets clean_window_count to 0"
      - from: SOFT_THROTTLED
        to: HARD_THROTTLED
        trigger: "POST /quota-assignments/{id}/usage-windows whose consumption ratio reaches 1.00"
        actor: system
        preconditions:
          - "ratio >= 1.00"
        side_effects:
          - "records overage_calls on the window"
          - "increments developer.throttled_window_count"
      - from: NORMAL
        to: HARD_THROTTLED
        trigger: "POST /quota-assignments/{id}/usage-windows whose consumption ratio reaches 1.00 in one step"
        actor: system
        preconditions:
          - "ratio >= 1.00"
        side_effects:
          - "records overage_calls on the window"
      - from: HARD_THROTTLED
        to: SOFT_THROTTLED
        trigger: "system event: SLA credit or bonus credit lowering the ratio below 1.00"
        actor: system
        preconditions:
          - "recomputed ratio >= 0.80 and < 1.00"
        side_effects: []
      - from: SOFT_THROTTLED
        to: NORMAL
        trigger: "system event: POST /program-checkpoints monthly reset (step 5, only when last_reset_at is 30 or more whole days before the logical clock), or a credit lowering the ratio below 0.80"
        actor: system
        preconditions:
          - "recomputed ratio < 0.80"
        side_effects:
          - "monthly reset zeroes monthly_calls_consumed, bonus_call_credit and burst_credit_balance is restored to burst_rpm * 10"
        note: "parallel dimension: throttle_state moves independently of entitlement_state"

  - entity: UpgradeRequest
    initial_state: PENDING
    terminal_states: [GRANTED, PARTIALLY_GRANTED, DEFERRED, VOIDED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: GRANTED
        trigger: "POST /api-products/{id}/upgrade-allocation-run"
        actor: DevRelManager
        preconditions:
          - "grantable delta from calculations.upgrade_allocation_waterfall equals requested_delta_rpm"
        side_effects:
          - "sets granted_delta_rpm, run_sequence and decided_at"
          - "adds the delta to QuotaAssignment.sustained_rpm, recomputes burst_rpm, and deducts from ApiProduct.allocated_sustained_rpm"
      - from: PENDING
        to: PARTIALLY_GRANTED
        trigger: "POST /api-products/{id}/upgrade-allocation-run"
        actor: DevRelManager
        preconditions:
          - "grantable delta is > 0 and < requested_delta_rpm"
        side_effects:
          - "same as GRANTED, with the reduced delta"
      - from: PENDING
        to: DEFERRED
        trigger: "POST /api-products/{id}/upgrade-allocation-run"
        actor: DevRelManager
        preconditions:
          - "the product's remaining allocatable sustained rpm is 0 when this request's turn arrives"
        side_effects:
          - "sets denial_reason POOL_EXHAUSTED, decided_at and run_sequence; the request may be re-run after the pool grows"
        note: "branching: the same trigger yields three different terminal states (GRANTED, PARTIALLY_GRANTED, DEFERRED) depending on the waterfall position"
      - from: PENDING
        to: VOIDED
        trigger: "system event: assignment suspension, retirement or version sunset"
        actor: system
        preconditions: []
        side_effects:
          - "sets denial_reason STANDING_BLOCKED when caused by a standing cascade"
      - from: PENDING
        to: SUPERSEDED
        trigger: "POST /quota-assignments/{id}/upgrade-requests creating a newer request for the same assignment"
        actor: Developer
        preconditions:
          - "the incoming request carries a matching expected_quota_assignment_version"
        side_effects:
          - "the prior PENDING request for this assignment becomes SUPERSEDED"
        note: "true race resolved by OCC — see concurrency_rules.upgrade-request-stale-assignment"

  - entity: ViolationCase
    initial_state: OPENED
    terminal_states: [DISMISSED, UPHELD_FINAL]
    transitions:
      - from: OPENED
        to: INVESTIGATING
        trigger: "POST /violation-cases/{id}/investigate"
        actor: TrustAndSafetyOfficer
        preconditions:
          - "state == OPENED"
          - "every evidence window id references an existing UsageWindow of one of the developer's assignments"
        side_effects:
          - "records investigator_user_id and remediation_deadline"
          - "developer.standing GOOD_STANDING becomes UNDER_REVIEW"
      - from: INVESTIGATING
        to: UPHELD
        trigger: "POST /violation-cases/{id}/adjudicate with outcome UPHELD"
        actor: PlatformAdmin
        preconditions:
          - "state == INVESTIGATING"
          - "adjudicating user != investigator_user_id"
        side_effects:
          - "applies penalty_points to developer.violation_points, records points_applied"
          - "sets appeal_deadline = logical clock + APPEAL_WINDOW_DAYS (14) days"
          - "cascade: standing moves to RESTRICTED once violation_points >= 50 (see Developer.standing)"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /violation-cases/{id}/adjudicate with outcome DISMISSED"
        actor: PlatformAdmin
        preconditions:
          - "state == INVESTIGATING"
          - "adjudicating user != investigator_user_id"
        side_effects:
          - "no points applied; developer.standing returns to GOOD_STANDING when no other case is open"
      - from: UPHELD
        to: APPEALED
        trigger: "POST /violation-cases/{id}/appeal"
        actor: Developer
        preconditions:
          - "acting developer is case.developer_id"
          - "logical clock <= appeal_deadline"
          - "appeal_count == 0"
        side_effects:
          - "records appeal_reason and increments appeal_count"
      - from: APPEALED
        to: DISMISSED
        trigger: "POST /violation-cases/{id}/adjudicate with outcome DISMISSED"
        actor: PlatformAdmin
        preconditions:
          - "state == APPEALED"
          - "adjudicating user != investigator_user_id"
        side_effects:
          - "compensation: subtracts points_applied from developer.violation_points and zeroes points_applied"
          - "restores SUSPENDED assignments whose suspension_reason is STANDING_RESTRICTION when standing returns to GOOD_STANDING"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /violation-cases/{id}/adjudicate with outcome UPHELD"
        actor: PlatformAdmin
        preconditions:
          - "state == APPEALED"
        side_effects:
          - "points remain applied; appeal_deadline is not extended"
        note: "cyclic: UPHELD -> APPEALED -> UPHELD is possible exactly once (appeal_count cap 1)"
      - from: UPHELD
        to: UPHELD_FINAL
        trigger: "system event: POST /program-checkpoints closing the appeal window"
        actor: system
        preconditions:
          - "logical clock > appeal_deadline"
          - "the case is not currently APPEALED (either appeal_count == 0, or the single filed appeal was already adjudicated UPHELD)"
        side_effects:
          - "the case can no longer be appealed and becomes eligible grounds for access revocation"

  - entity: SupportCase
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESPONDING
        trigger: "POST /support-cases/{id}/communications"
        actor: PartnerSupportAgent
        preconditions:
          - "state == OPEN"
          - "communication sent_at is at or after started_at and at or before the logical clock"
        side_effects:
          - "sets first_response_at, first_response_breached and max_communication_gap_minutes"
          - "increments communication_count"
      - from: RESPONDING
        to: RESPONDING
        trigger: "POST /support-cases/{id}/communications (subsequent updates)"
        actor: PartnerSupportAgent
        preconditions:
          - "sent_at is at or after last_communication_at"
        side_effects:
          - "increments communication_count and re-evaluates max_communication_gap_minutes and comms_gap_breached"
      - from: RESPONDING
        to: ESCALATED
        trigger: "POST /support-cases/{id}/escalate"
        actor: PartnerSupportAgent
        preconditions:
          - "state == RESPONDING or ESCALATED"
          - "escalation_tier < 3"
          - "for a PARTNER_TICKET, escalation beyond escalation_tier 1 requires the reporting developer to hold an ACTIVE QuotaAssignment of tier PARTNER or PRIVILEGED"
        side_effects:
          - "increments escalation_tier"
      - from: ESCALATED
        to: ESCALATED
        trigger: "POST /support-cases/{id}/escalate (further tiers)"
        actor: PartnerSupportAgent
        preconditions:
          - "escalation_tier < 3"
        side_effects:
          - "increments escalation_tier"
        note: "self-loop capped at escalation_tier 3"
      - from: RESPONDING
        to: RESOLVED
        trigger: "POST /support-cases/{id}/resolve"
        actor: PartnerSupportAgent
        preconditions:
          - "communication_count >= 1"
          - "resolved_at (logical clock) is strictly after started_at"
        side_effects:
          - "computes downtime_minutes, max_communication_gap_minutes, comms_gap_breached and credit_uplift_applied"
          - "for a PLATFORM_INCIDENT: runs calculations.sla_service_credit over every ACTIVE QuotaAssignment pinned to a version of the incident's product, adding per-assignment credit to bonus_call_credit"
          - "cascade: each credited assignment's throttle_state is re-evaluated and may fall from HARD_THROTTLED to SOFT_THROTTLED or NORMAL"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /support-cases/{id}/resolve"
        actor: PartnerSupportAgent
        preconditions:
          - "communication_count >= 1"
        side_effects:
          - "identical to RESPONDING -> RESOLVED"

  - entity: SandboxLease
    initial_state: ACTIVE
    terminal_states: [RELEASED, EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /sandbox-leases/{id}/release"
        actor: Developer
        preconditions:
          - "acting developer owns the lease"
          - "state == ACTIVE"
        side_effects:
          - "sets released_at and closed_reason DEVELOPER_RELEASE, freeing the product's sandbox interval for a new lease"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: POST /program-checkpoints when the logical clock reaches expires_at"
        actor: system
        preconditions:
          - "logical clock >= expires_at"
        side_effects:
          - "sets released_at and closed_reason CHECKPOINT_EXPIRY"
      - from: ACTIVE
        to: REVOKED
        trigger: "system event: standing cascade to RESTRICTED or REVOKED"
        actor: system
        preconditions: []
        side_effects:
          - "sets released_at and closed_reason STANDING_CASCADE"

  - entity: FeedbackItem
    initial_state: SUBMITTED
    terminal_states: [ROADMAP_ACCEPTED, DECLINED]
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /feedback-items/{id}/triage"
        actor: DevRelManager
        preconditions:
          - "state == SUBMITTED"
        side_effects:
          - "resolves author_top_tier, computes raw_impact and priority_score"
          - "ledger sync: adds raw_impact to the product's demand_index and re-scores every other TRIAGED / ROADMAP_ACCEPTED item of the product"
      - from: TRIAGED
        to: ROADMAP_ACCEPTED
        trigger: "POST /feedback-items/{id}/roadmap-decision with decision ACCEPT"
        actor: DevRelManager
        preconditions:
          - "state == TRIAGED"
        side_effects:
          - "the item is included in GET /api-products/{id}/roadmap ranking"
      - from: TRIAGED
        to: DECLINED
        trigger: "POST /feedback-items/{id}/roadmap-decision with decision DECLINE"
        actor: DevRelManager
        preconditions:
          - "state == TRIAGED"
        side_effects:
          - "compensation: subtracts raw_impact from the product's demand_index, nulls priority_score, and re-scores the remaining items"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency rules — OCC on the parent entity's `version` only.
# Both entries below pass the mandatory filter: a strictly-later sequential
# request that carries a fresh version legitimately succeeds under the product
# semantics (an ApiProduct can back many assignments; a newer UpgradeRequest
# legitimately supersedes the prior PENDING one), so the rejection can only
# come from a stale observed version, not from a state precondition.
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assignment-provision-stale-product
    parent_entity: ApiProduct
    write_endpoint: "POST /quota-assignments"
    occ_field: "expected_api_product_version"
    description: |
      Provisioning a QuotaAssignment draws sustained_rpm and monthly call
      allowance from the target ApiProduct's finite pools, so the caller must
      prove it observed the pool state it is allocating against. A request
      whose expected_api_product_version is behind ApiProduct.version is
      rejected: the pools have moved since the caller read them, and the
      quota_provisioning clamp it computed from that stale view is no longer
      valid. Re-reading the product and resubmitting with the current version
      succeeds.
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412

  - rule_id: upgrade-request-stale-assignment
    parent_entity: QuotaAssignment
    write_endpoint: "POST /quota-assignments/{id}/upgrade-requests"
    occ_field: "expected_quota_assignment_version"
    description: |
      A newly created UpgradeRequest legitimately supersedes the assignment's
      prior PENDING request, so a second create against unchanged state would
      itself succeed — this is not a state precondition. The caller must
      therefore prove it observed the assignment as it now stands (including
      its current sustained_rpm and any request it is about to supersede). A
      request whose expected_quota_assignment_version is behind
      QuotaAssignment.version is rejected with 412.
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation rules
# ---------------------------------------------------------------------------
calculations:
  - name: developer_trust_score
    trigger: "on onboarding acknowledgement, on sandbox validation, and on every POST /program-checkpoints audited rescoring pass"
    algorithm: weighted_scoring
    formula: |
      # Both variants share these components:
      base = BASE_SCORE                                    # 50
      cert = CERT_POINTS[developer.certification_level]     # NONE 0, ASSOCIATE 8, PROFESSIONAL 15
      # certification counts only while unexpired:
      if developer.certification_expires_at is null
         or developer.certification_expires_at < clock:
          cert = 0
      docs = DOCS_POINTS if developer.docs_version_acknowledged >= CURRENT_DOCS_VERSION else 0   # 6 / 0
      hack = min(developer.hackathon_award_count, MAX_HACK_AWARDS) * HACK_POINTS               # min(n,3) * 4
      clean = min(developer.clean_window_count, MAX_CLEAN_WINDOWS) * CLEAN_WINDOW_POINTS        # min(n,10) * 1
      settled_penalty = developer.violation_points          # points already applied by UPHELD cases
      pending_penalty = sum(case.penalty_points
                            for case in developer's ViolationCase rows
                            where case.state in (OPENED, INVESTIGATING, APPEALED))

      # variant onboarding_snapshot:
      #   ignores pending_penalty entirely and ignores throttled windows
      raw_snapshot = base + cert + docs + hack + clean - settled_penalty

      # variant enforcement_audit:
      #   charges pending exposure at PENDING_EXPOSURE_RATE and penalises throttling
      throttle_penalty = THROTTLE_POINTS if developer.throttled_window_count >= THROTTLE_TRIGGER else 0  # 5 if >= 2
      raw_audit = base + cert + docs + hack + clean
                  - settled_penalty
                  - round_half_up(pending_penalty * PENDING_EXPOSURE_RATE, 0)
                  - throttle_penalty

      score = clamp(raw, 0, 100)     # integer, clamped both ends
    input_set: "the developer's own fields plus its ViolationCase rows; cases in state DISMISSED or UPHELD_FINAL contribute nothing beyond what is already settled in violation_points"
    constants:
      BASE_SCORE: 50
      CERT_POINTS: { NONE: 0, ASSOCIATE: 8, PROFESSIONAL: 15 }
      DOCS_POINTS: 6
      CURRENT_DOCS_VERSION: 2
      HACK_POINTS: 4
      MAX_HACK_AWARDS: 3
      CLEAN_WINDOW_POINTS: 1
      MAX_CLEAN_WINDOWS: 10
      PENDING_EXPOSURE_RATE: 0.50
      THROTTLE_POINTS: 5
      THROTTLE_TRIGGER: 2
    precision: "integer, round_half_up on the pending-exposure term, clamped to 0..100"
    variants:
      - name: onboarding_snapshot
        when: "written to Developer.trust_score by onboarding acknowledgement, sandbox validation, and any ecosystem-participation update; this is the value quota_provisioning reads"
        difference: "excludes pending (OPENED / INVESTIGATING / APPEALED) case exposure and ignores throttled_window_count"
      - name: enforcement_audit
        when: "written to Developer.audited_trust_score by the audited-rescoring step of POST /program-checkpoints"
        difference: "charges 50% of the pending cases' penalty_points and subtracts 5 more once throttled_window_count >= 2, so identical data yields a strictly lower score whenever a case is pending or throttling occurred"

  - name: quota_provisioning
    trigger: "POST /quota-assignments"
    algorithm: constraint_propagation
    formula: |
      # Evaluation order is pinned and observable: sustained -> pool deduct ->
      # burst -> allowance. A later step never revises an earlier one.
      tier = application.approved_tier

      # 1. sustained rpm, three multiplicative factors then a single floor
      personal  = count(scope in application.granted_scopes
                        whose catalog sensitivity == PERSONAL)
      financial = count(scope in application.granted_scopes
                        whose catalog sensitivity == FINANCIAL)
      scope_factor = max(SCOPE_FACTOR_FLOOR,
                         1 - PERSONAL_SCOPE_STEP * personal
                           - FINANCIAL_SCOPE_STEP * financial)
      trust_multiplier = TRUST_MULTIPLIER band of developer.trust_score
      desired_sustained = floor(TIER_BASE_SUSTAINED_RPM[tier]
                                * trust_multiplier
                                * scope_factor)

      # 2. clamp against the product pool, then deduct
      sustained_rpm = min(desired_sustained, product.available_sustained_rpm)
      if sustained_rpm <= 0: reject ERR_SUSTAINED_POOL_EXHAUSTED
      product.allocated_sustained_rpm += sustained_rpm

      # 3. burst is derived from the CLAMPED sustained value
      burst_rpm = sustained_rpm + ceil(sustained_rpm * (TIER_BURST_FACTOR[tier] - 1))
      burst_credit_balance = burst_rpm * BURST_CREDIT_WINDOWS      # * 10

      # 4. monthly allowance: three-way min, then deduct
      monthly_call_allowance = min(application.requested_monthly_calls,
                                   TIER_MONTHLY_CALL_CAP[tier],
                                   product.available_monthly_calls)
      if monthly_call_allowance <= 0: reject ERR_MONTHLY_POOL_EXHAUSTED
      product.allocated_monthly_calls += monthly_call_allowance
    input_set: "the approved AccessApplication, its developer's onboarding_snapshot trust_score, the pinned ApiVersion's ApiProduct scope_catalog, and the product's current pool availability"
    constants:
      TIER_BASE_SUSTAINED_RPM: { SANDBOX: 60, STANDARD: 600, PARTNER: 3000, PRIVILEGED: 12000 }
      TIER_BURST_FACTOR: { SANDBOX: 1.5, STANDARD: 2.0, PARTNER: 3.0, PRIVILEGED: 4.0 }
      TIER_MONTHLY_CALL_CAP: { SANDBOX: 50000, STANDARD: 1000000, PARTNER: 10000000, PRIVILEGED: 60000000 }
      TRUST_MULTIPLIER: "trust_score >= 80 -> 1.25; 60..79 -> 1.00; 40..59 -> 0.75; <= 39 -> 0.50"
      SCOPE_FACTOR_FLOOR: 0.60
      PERSONAL_SCOPE_STEP: 0.05
      FINANCIAL_SCOPE_STEP: 0.10
      BURST_CREDIT_WINDOWS: 10
    precision: "sustained_rpm floor to integer; burst uplift ceil to integer; all call counts integer"

  - name: usage_consumption_attribution
    trigger: "POST /quota-assignments/{id}/usage-windows"
    algorithm: threshold
    formula: |
      # 1. pick the attribution variant (see variants below)
      if assignment.tier in (PARTNER, PRIVILEGED)
         and assignment.burst_credit_balance >= window.burst_calls:
          attribution_variant = BURST_ISOLATED
          calls_charged_to_allowance = window.total_calls - window.burst_calls
          burst_credit_consumed = window.burst_calls
      else:
          attribution_variant = BURST_INCLUSIVE
          calls_charged_to_allowance = window.total_calls
          burst_credit_consumed = 0

      # 2. running ledger
      assignment.burst_credit_balance -= burst_credit_consumed
      assignment.monthly_calls_consumed += calls_charged_to_allowance
      monthly_calls_consumed_after = assignment.monthly_calls_consumed

      # 3. effective allowance includes credits granted by SLA / bonus
      effective_allowance = assignment.monthly_call_allowance
                            + assignment.bonus_call_credit
      ratio = monthly_calls_consumed_after / effective_allowance    # exact rational

      # 4. throttle thresholds, inclusive lower bounds
      if ratio >= HARD_THROTTLE_RATIO:                              # >= 1.00
          resulting_throttle_state = HARD_THROTTLED
          overage_calls = monthly_calls_consumed_after - effective_allowance
      elif ratio >= SOFT_THROTTLE_RATIO:                            # >= 0.80
          resulting_throttle_state = SOFT_THROTTLED
          overage_calls = 0
      else:
          resulting_throttle_state = NORMAL
          overage_calls = 0

      # 5. rate-limit breach is a separate, instantaneous check
      rate_limit_breach = (window.total_calls / WINDOW_MINUTES) > assignment.burst_rpm

      # 6. clean / throttled window bookkeeping on the developer
      if resulting_throttle_state == NORMAL and rate_limit_breach is false:
          developer.clean_window_count += 1
      else:
          developer.throttled_window_count += 1
          developer.clean_window_count = 0
    input_set: "the target QuotaAssignment (must be entitlement_state ACTIVE) and the submitted hour-aligned window; windows must arrive in non-decreasing window_start order and must not duplicate an existing window_start for the same assignment"
    constants:
      SOFT_THROTTLE_RATIO: 0.80
      HARD_THROTTLE_RATIO: 1.00
      WINDOW_MINUTES: 60
    precision: "ratio compared as an exact rational (no intermediate rounding); all call counts integer"
    variants:
      - name: BURST_ISOLATED
        when: "assignment.tier is PARTNER or PRIVILEGED AND burst_credit_balance >= window.burst_calls"
        difference: "burst_calls are drawn from burst_credit_balance and excluded from calls_charged_to_allowance, so the monthly ratio grows more slowly for the identical window"
      - name: BURST_INCLUSIVE
        when: "any other case — tier SANDBOX or STANDARD, or insufficient burst_credit_balance"
        difference: "the whole total_calls figure is charged to the monthly allowance and burst_credit_balance is untouched"

  - name: sla_service_credit
    trigger: "POST /support-cases/{id}/resolve for a case of kind PLATFORM_INCIDENT"
    algorithm: aggregation
    formula: |
      downtime_minutes = floor((resolved_at - started_at) in minutes)
      uplift = COMMS_BREACH_UPLIFT if case.comms_gap_breached else 1.0   # 1.5 / 1.0
      rate = SEVERITY_CREDIT_RATE[case.severity]

      # ROUNDING ORDER IS PINNED: round per assignment, THEN sum.
      # Summing the raw products and rounding once would differ.
      credits = []
      for a in affected assignments, ordered by created_at ASC:
          raw = a.monthly_call_allowance * rate * uplift * downtime_minutes / MINUTES_PER_DAY
          credits.append(round_half_up(raw, 0))       # integer calls, per assignment
      total_credit_calls = sum(credits)

      for each a and its credit: a.bonus_call_credit += credit
      # then each credited assignment's throttle_state is re-evaluated against
      # the new effective allowance (usage_consumption_attribution steps 3-4)
    input_set: "every QuotaAssignment in entitlement_state ACTIVE whose pinned ApiVersion belongs to the incident's api_product_id; SUSPENDED, PROVISIONED and RETIRED assignments are excluded"
    constants:
      SEVERITY_CREDIT_RATE: { S1: 0.10, S2: 0.05, S3: 0.02, S4: 0.00 }
      COMMS_BREACH_UPLIFT: 1.5
      MINUTES_PER_DAY: 1440
    precision: "per-assignment credit rounded to a whole call with round_half_up BEFORE summation; the sum is never re-rounded"

  - name: upgrade_allocation_waterfall
    trigger: "POST /api-products/{id}/upgrade-allocation-run"
    algorithm: waterfall_allocation
    formula: |
      remaining = product.available_sustained_rpm      # pool at the start of the run
      queue = PENDING UpgradeRequest rows whose assignment's pinned version
              belongs to this product, ordered by:
                1. TIER_RANK[assignment.tier] DESC      # PRIVILEGED 4 .. SANDBOX 1
                2. requested_delta_rpm ASC              # cheapest first within a tier
                3. created_at ASC                       # deterministic final tie-break
      run_sequence = 1
      for req in queue:
          req.run_sequence = run_sequence; run_sequence += 1
          # validations[priority=54] already rejected any request created while
          # the assignment sat at or above its ceiling, so headroom is > 0 here;
          # it can still be smaller than the requested delta, which is what makes
          # the three-way min below bite.
          ceiling = TIER_CEILING_FACTOR * TIER_BASE_SUSTAINED_RPM[assignment.tier]
          headroom = ceiling - assignment.sustained_rpm
          if remaining == 0:
              req.state = DEFERRED; req.denial_reason = POOL_EXHAUSTED; continue
          grant = min(req.requested_delta_rpm, remaining, headroom)
          req.granted_delta_rpm = grant
          req.state = GRANTED if grant == req.requested_delta_rpm else PARTIALLY_GRANTED
          assignment.sustained_rpm += grant
          assignment.burst_rpm = assignment.sustained_rpm
              + ceil(assignment.sustained_rpm * (TIER_BURST_FACTOR[tier] - 1))
          product.allocated_sustained_rpm += grant
          remaining -= grant
    input_set: "PENDING UpgradeRequest rows for the product whose assignment is in entitlement_state ACTIVE and whose developer standing is GOOD_STANDING; requests on SUSPENDED assignments were already VOIDED"
    constants:
      TIER_RANK: { SANDBOX: 1, STANDARD: 2, PARTNER: 3, PRIVILEGED: 4 }
      TIER_CEILING_FACTOR: 2
    precision: "integer rpm throughout; burst recomputed with ceil on the uplift"

  - name: feedback_roadmap_prioritisation
    trigger: "POST /feedback-items/{id}/triage, POST /feedback-items/{id}/roadmap-decision, and GET /api-products/{id}/roadmap"
    algorithm: weighted_scoring
    formula: |
      # step 1 — per-item raw impact (independent of every other item)
      raw_impact = round_half_up(
          SEVERITY_WEIGHT[item.category] * TIER_WEIGHT[item.author_top_tier]
          + CERT_BONUS[author.certification_level], 2)

      # step 2 — product demand index is the sum of raw_impact over the
      # currently-counted items ONLY (never over priority_score, so the index
      # cannot feed back into itself)
      product.demand_index = round_half_up(
          sum(i.raw_impact for i in product's FeedbackItem rows
              where i.state in (TRIAGED, ROADMAP_ACCEPTED)), 2)

      # step 3 — every counted item is re-scored against the shared index
      factor = 1 + min(product.demand_index / DEMAND_DIVISOR, MAX_DEMAND_UPLIFT)
      item.priority_score = round_half_up(item.raw_impact * factor, 2)

      # step 4 — roadmap ranking
      order by priority_score DESC, raw_impact DESC, created_at ASC
    input_set: "FeedbackItem rows of the product in state TRIAGED or ROADMAP_ACCEPTED; SUBMITTED items are not yet scored and DECLINED items are removed from the index and have priority_score null"
    constants:
      SEVERITY_WEIGHT: { DEFECT: 40, MISSING_FEATURE: 25, DX_FRICTION: 15, DOC_GAP: 10 }
      TIER_WEIGHT: { NONE: 0.25, SANDBOX: 0.50, STANDARD: 1.00, PARTNER: 1.50, PRIVILEGED: 2.00 }
      CERT_BONUS: { NONE: 0, ASSOCIATE: 2.50, PROFESSIONAL: 5.00 }
      DEMAND_DIVISOR: 500
      MAX_DEMAND_UPLIFT: 0.50
    precision: "2 decimal places, round_half_up, applied at raw_impact, at demand_index and again at priority_score"

  - name: deprecation_notice_requirement
    trigger: "POST /api-versions/{id}/announce-deprecation"
    algorithm: threshold
    formula: |
      required = BASE_NOTICE_DAYS[product.data_sensitivity]
      if version.breaking_change: required += BREAKING_CHANGE_EXTRA_DAYS
      if any QuotaAssignment pinned to this version has
         entitlement_state == ACTIVE and tier in (PARTNER, PRIVILEGED):
          required += PARTNER_PINNED_EXTRA_DAYS
      version.required_notice_days = required
      gate: submitted notice_days >= required, else ERR_NOTICE_PERIOD_TOO_SHORT
    input_set: "the version's product data_sensitivity, the version's breaking_change flag, and the tiers of the ACTIVE assignments pinned to this version"
    constants:
      BASE_NOTICE_DAYS: { PUBLIC: 30, PERSONAL: 60, FINANCIAL: 90 }
      BREAKING_CHANGE_EXTRA_DAYS: 30
      PARTNER_PINNED_EXTRA_DAYS: 30
    precision: "whole days; the comparison is inclusive (notice_days == required passes)"

  - name: violation_penalty_points
    trigger: "POST /violation-cases (computed at creation, recomputed on adjudication)"
    algorithm: threshold
    formula: |
      penalty_points = CATEGORY_BASE_POINTS[case.category]
                       * SEVERITY_FACTOR[case.severity]
    input_set: "the case's own category and severity"
    constants:
      CATEGORY_BASE_POINTS: { RATE_ABUSE: 10, SCOPE_OVERREACH: 15, DATA_RETENTION: 20, RESALE: 25 }
      SEVERITY_FACTOR: { LOW: 1, MEDIUM: 2, HIGH: 3 }
      RESTRICTION_THRESHOLD: 50
      REVOCATION_THRESHOLD: 100
      APPEAL_WINDOW_DAYS: 14
      REMEDIATION_DAYS: { LOW: 30, MEDIUM: 14, HIGH: 7 }
    precision: "integer points; the RESTRICTION_THRESHOLD comparison is inclusive (>= 50 restricts)"

  - name: support_response_commitments
    trigger: "POST /support-cases (sets the commitment), POST /support-cases/{id}/communications and POST /support-cases/{id}/resolve (evaluate it)"
    algorithm: interval_merge
    formula: |
      first_response_due_minutes = FIRST_RESPONSE_SLA_MINUTES[case.kind][case.severity]
      first_response_breached =
          (first_communication.sent_at - case.started_at) in minutes
              > first_response_due_minutes

      # the cadence check walks the CLOSED interval [started_at, resolved_at]
      # and takes the largest gap between consecutive checkpoints; before
      # resolution the trailing segment is not yet counted
      checkpoints = [case.started_at]
                    + [c.sent_at for c in communications ordered by sent_at ASC]
                    + ([case.resolved_at] if case.state == RESOLVED else [])
      max_communication_gap_minutes =
          max(floor((checkpoints[i+1] - checkpoints[i]) in minutes)
              for i in 0..len(checkpoints)-2)      # 0 when only one checkpoint
      comms_gap_breached =
          max_communication_gap_minutes > COMMS_MAX_GAP_MINUTES[case.severity]
    input_set: "the case's own communications, ordered by sent_at ASC; started_at and, once set, resolved_at are the interval endpoints"
    constants:
      FIRST_RESPONSE_SLA_MINUTES:
        PARTNER_TICKET: { S1: 30, S2: 60, S3: 240, S4: 480 }
        PLATFORM_INCIDENT: { S1: 15, S2: 30, S3: 120, S4: 240 }
      COMMS_MAX_GAP_MINUTES: { S1: 30, S2: 60, S3: 240, S4: 1440 }
    precision: "whole minutes, floored; both breach comparisons are strict (equality does NOT breach)"

# ---------------------------------------------------------------------------
# §1.4 Validation rules, strictly ordered by priority.
# Domain ordering inside the business band: safety / compliance (standing,
# terms of service, data-sensitivity) -> segregation of duties -> temporal
# -> referential -> constraint -> fiscal (pools and ceilings last).
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all except GET /_clock/current"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "when X-User-Role is Developer, X-User-ID must be the id of an existing Developer"
    error_id: ERR_UNKNOWN_DEVELOPER_IDENTITY
    http_status: 401
    applies_to: "all endpoints whose roles include Developer"

  - priority: 4
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "request body parses, contains every required field, and every field matches its declared type, enum domain and length/range constraints; pagination limit is 1..100 and offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: "every path id resolves to an existing resource, validated left to right"
    error_id: "ERR_DEVELOPER_NOT_FOUND | ERR_API_PRODUCT_NOT_FOUND | ERR_API_VERSION_NOT_FOUND | ERR_ACCESS_APPLICATION_NOT_FOUND | ERR_QUOTA_ASSIGNMENT_NOT_FOUND | ERR_UPGRADE_REQUEST_NOT_FOUND | ERR_SANDBOX_LEASE_NOT_FOUND | ERR_VIOLATION_CASE_NOT_FOUND | ERR_SUPPORT_CASE_NOT_FOUND | ERR_FEEDBACK_ITEM_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 7
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing resource, validated in declared field order"
    error_id: "ERR_DEVELOPER_NOT_FOUND | ERR_API_PRODUCT_NOT_FOUND | ERR_API_VERSION_NOT_FOUND | ERR_ACCESS_APPLICATION_NOT_FOUND | ERR_USAGE_WINDOW_NOT_FOUND"
    http_status: 404
    applies_to: "POST /developers/{id}/... , POST /access-applications, POST /quota-assignments, POST /sandbox-leases, POST /violation-cases, POST /support-cases, POST /feedback-items"

  - priority: 8
    category: auth
    check: "when the acting role is Developer, X-User-ID must equal the developer that owns the target resource (directly, or through its assignment / application / lease / case)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Developer-role writes and all Developer-role single-resource reads"

  - priority: 9
    category: state
    check: "expected_api_product_version equals ApiProduct.version"
    error_id: ERR_STALE_PRODUCT_VERSION
    http_status: 412
    applies_to: "POST /quota-assignments"

  - priority: 10
    category: state
    check: "expected_quota_assignment_version equals QuotaAssignment.version"
    error_id: ERR_STALE_ASSIGNMENT_VERSION
    http_status: 412
    applies_to: "POST /quota-assignments/{id}/upgrade-requests"

  - priority: 11
    category: state
    check: "the target AccessApplication is in a state the requested transition permits"
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /access-applications/{id}/submit, /claim-review, /request-changes, /decide"

  - priority: 12
    category: state
    check: "the target QuotaAssignment is in entitlement_state ACTIVE"
    error_id: ERR_ASSIGNMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /quota-assignments/{id}/usage-windows, POST /quota-assignments/{id}/upgrade-requests, POST /quota-assignments/{id}/suspend"

  - priority: 13
    category: state
    check: "the target QuotaAssignment is in the state the lifecycle action requires (PROVISIONED for activate, SUSPENDED for reinstate, non-RETIRED for any write)"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /quota-assignments/{id}/activate, /reinstate"

  - priority: 14
    category: state
    check: "the target ApiVersion is in the lifecycle_state the action requires (PREVIEW for promote, GENERAL_AVAILABILITY for announce-deprecation, non-SUNSET for guide publication)"
    error_id: ERR_VERSION_STATE_INVALID
    http_status: 409
    applies_to: "POST /api-versions/{id}/promote, /announce-deprecation, /migration-guide"

  - priority: 15
    category: state
    check: "the target ViolationCase is in the state the action requires (OPENED for investigate, INVESTIGATING or APPEALED for adjudicate, UPHELD for appeal)"
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /violation-cases/{id}/investigate, /adjudicate, /appeal"

  - priority: 16
    category: state
    check: "the target SupportCase is in the state the action requires (OPEN, RESPONDING or ESCALATED for communications; RESPONDING or ESCALATED for escalate and for resolve)"
    error_id: ERR_SUPPORT_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /support-cases/{id}/communications, /escalate, /resolve"

  - priority: 17
    category: state
    check: "the target SandboxLease is in state ACTIVE"
    error_id: ERR_LEASE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /sandbox-leases/{id}/release, /validate"

  - priority: 18
    category: state
    check: "the target FeedbackItem is in the state the action requires (SUBMITTED for triage, TRIAGED for roadmap-decision)"
    error_id: ERR_FEEDBACK_STATE_INVALID
    http_status: 409
    applies_to: "POST /feedback-items/{id}/triage, /roadmap-decision"

  - priority: 19
    category: state
    check: "the target UpgradeRequest set for an allocation run must contain at least one PENDING request"
    error_id: ERR_NO_PENDING_UPGRADE_REQUESTS
    http_status: 409
    applies_to: "POST /api-products/{id}/upgrade-allocation-run"

  - priority: 20
    category: business_safety
    check: "the acting or target developer's standing is GOOD_STANDING"
    error_id: ERR_DEVELOPER_STANDING_BLOCKED
    http_status: 422
    applies_to: "POST /access-applications/{id}/submit, POST /quota-assignments, POST /quota-assignments/{id}/activate, /reinstate, POST /sandbox-leases, POST /developers/{id}/directory-submission"

  - priority: 21
    category: business_safety
    check: "the target developer's standing is not REVOKED (revoked developers may not act at all)"
    error_id: ERR_DEVELOPER_REVOKED
    http_status: 422
    applies_to: "all Developer-role writes"

  - priority: 22
    category: business_safety
    check: "developer.tos_version_accepted is at least the target product's required_tos_version"
    error_id: ERR_TOS_VERSION_STALE
    http_status: 422
    applies_to: "POST /access-applications/{id}/submit, POST /quota-assignments, POST /sandbox-leases"

  - priority: 23
    category: business_safety
    check: "developer.docs_version_acknowledged equals the platform current docs version before any production entitlement is provisioned"
    error_id: ERR_DOCS_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /quota-assignments, POST /sandbox-leases"

  - priority: 24
    category: business_safety
    check: "every requested or granted scope whose catalog sensitivity is PERSONAL requires tier STANDARD or above; FINANCIAL requires tier PARTNER or above"
    error_id: ERR_SCOPE_SENSITIVITY_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /access-applications, POST /access-applications/{id}/decide"

  - priority: 25
    category: business_safety
    check: "justification_text length is at least JUSTIFICATION_MIN_CHARS for the requested tier (SANDBOX 0, STANDARD 40, PARTNER 120, PRIVILEGED 240)"
    error_id: ERR_JUSTIFICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /access-applications/{id}/submit, POST /quota-assignments/{id}/upgrade-requests"

  - priority: 26
    category: business_safety
    check: "an S1 or S2 PARTNER_TICKET may only be opened by a developer holding an ACTIVE QuotaAssignment of tier PARTNER or PRIVILEGED"
    error_id: ERR_SEVERITY_NOT_ENTITLED
    http_status: 422
    applies_to: "POST /support-cases"

  - priority: 27
    category: business_safety
    check: "the acting user is not the recorded reviewer_user_id of the application being decided"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /access-applications/{id}/decide"

  - priority: 28
    category: business_safety
    check: "the acting user is not the recorded investigator_user_id of the case being adjudicated, and is not the investigator of any of the developer's cases when revoking access"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /violation-cases/{id}/adjudicate, POST /developers/{id}/revoke-access"

  - priority: 29
    category: business_temporal
    check: "the requested clock instant is at or after the current logical clock (the clock never moves backwards)"
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 30
    category: business_temporal
    check: "window_start is exactly hour-aligned and window_end equals window_start plus 60 minutes"
    error_id: ERR_WINDOW_NOT_ALIGNED
    http_status: 422
    applies_to: "POST /quota-assignments/{id}/usage-windows"

  - priority: 31
    category: business_temporal
    check: "window_end is at or before the current logical clock (no future usage)"
    error_id: ERR_WINDOW_IN_FUTURE
    http_status: 422
    applies_to: "POST /quota-assignments/{id}/usage-windows"

  - priority: 32
    category: business_temporal
    check: "window_start is at or after the assignment's most recent window_start (chronological submission); an exact repeat of that instant is left to priority 33"
    error_id: ERR_WINDOW_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /quota-assignments/{id}/usage-windows"

  - priority: 33
    category: business_temporal
    check: "no UsageWindow already exists for this assignment with the same window_start"
    error_id: ERR_WINDOW_DUPLICATE
    http_status: 409
    applies_to: "POST /quota-assignments/{id}/usage-windows"

  - priority: 34
    category: business_temporal
    check: "submitted notice_days is at least calculations.deprecation_notice_requirement output"
    error_id: ERR_NOTICE_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /api-versions/{id}/announce-deprecation"

  - priority: 35
    category: business_temporal
    check: "at most MAX_CONCURRENT_DEPRECATIONS (2) versions of one ApiProduct may sit in DEPRECATION_ANNOUNCED at once — an aggregate check over the product's versions"
    error_id: ERR_DEPRECATION_WINDOW_FULL
    http_status: 422
    applies_to: "POST /api-versions/{id}/announce-deprecation"

  - priority: 36
    category: business_temporal
    check: "the requested sandbox lease interval [starts_at, expires_at) must not overlap an existing ACTIVE lease of the same developer on the same product; adjacency (new starts_at == existing expires_at) is permitted"
    error_id: ERR_SANDBOX_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /sandbox-leases"

  - priority: 37
    category: business_temporal
    check: "a new PLATFORM_INCIDENT for the same api_product_id and severity must start at least INCIDENT_COALESCE_MINUTES (60) after the resolved_at of the most recent such incident; otherwise it must be recorded as a communication on that incident"
    error_id: ERR_INCIDENT_COALESCE_WINDOW
    http_status: 409
    applies_to: "POST /support-cases"

  - priority: 38
    category: business_temporal
    check: "communication sent_at is at or after the case's started_at, at or after last_communication_at, and at or before the current logical clock"
    error_id: ERR_COMMUNICATION_OUT_OF_ORDER
    http_status: 422
    applies_to: "POST /support-cases/{id}/communications"

  - priority: 39
    category: business_temporal
    check: "the appeal is filed at or before the case's appeal_deadline"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /violation-cases/{id}/appeal"

  - priority: 40
    category: business_temporal
    check: "certification_expires_at must be strictly after the current logical clock when a certification level is recorded"
    error_id: ERR_CERTIFICATION_EXPIRED
    http_status: 422
    applies_to: "POST /developers/{id}/ecosystem-participations, POST /developers/{id}/directory-submission"

  - priority: 41
    category: business_referential
    check: "the target ApiVersion is grantable for the requested tier: PREVIEW is grantable only to SANDBOX, GENERAL_AVAILABILITY to all tiers, DEPRECATION_ANNOUNCED and SUNSET to none"
    error_id: ERR_VERSION_NOT_GRANTABLE
    http_status: 422
    applies_to: "POST /access-applications/{id}/submit, POST /quota-assignments"

  - priority: 42
    category: business_referential
    check: "a breaking ApiVersion must have a published migration_guide_url before deprecation can be announced"
    error_id: ERR_MIGRATION_GUIDE_MISSING
    http_status: 422
    applies_to: "POST /api-versions/{id}/announce-deprecation"

  - priority: 43
    category: business_referential
    check: "every evidence_window_ids entry references a UsageWindow belonging to one of the target developer's assignments"
    error_id: ERR_EVIDENCE_NOT_ATTRIBUTABLE
    http_status: 422
    applies_to: "POST /violation-cases, POST /violation-cases/{id}/investigate"

  - priority: 44
    category: business_referential
    check: "a PARTNER_TICKET must name a developer_id who holds at least one ACTIVE QuotaAssignment on the named product; a PLATFORM_INCIDENT must NOT name a developer_id and MUST name started_at"
    error_id: ERR_SUPPORT_CASE_KIND_MISMATCH
    http_status: 422
    applies_to: "POST /support-cases"

  - priority: 45
    category: business_referential
    check: "escalation beyond tier 1 requires the reporting developer to hold an ACTIVE PARTNER or PRIVILEGED assignment"
    error_id: ERR_ESCALATION_NOT_ENTITLED
    http_status: 422
    applies_to: "POST /support-cases/{id}/escalate"

  - priority: 46
    category: business_referential
    check: "a directory submission requires onboarding_state PRODUCTION_ACTIVE and a non-NONE, unexpired certification_level"
    error_id: ERR_DIRECTORY_PREREQUISITES_UNMET
    http_status: 422
    applies_to: "POST /developers/{id}/directory-submission"

  - priority: 47
    category: business_constraint
    check: "a developer may not hold two non-terminal AccessApplication rows for the same target_api_version_id"
    error_id: ERR_DUPLICATE_APPLICATION
    http_status: 409
    applies_to: "POST /access-applications"

  - priority: 48
    category: business_constraint
    check: "an approved AccessApplication may back exactly one QuotaAssignment"
    error_id: ERR_ASSIGNMENT_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /quota-assignments"

  - priority: 49
    category: business_constraint
    check: "revision_round must be below MAX_REVISION_ROUNDS (3) for a change request or resubmission"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /access-applications/{id}/request-changes, POST /access-applications/{id}/submit"

  - priority: 50
    category: business_constraint
    check: "approved_tier rank must not exceed requested_tier rank, and granted_scopes must be a subset of both requested_scopes and the product scope_catalog"
    error_id: ERR_TIER_ESCALATION_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /access-applications/{id}/decide"

  - priority: 51
    category: business_constraint
    check: "requested_sustained_rpm on an upgrade request must be strictly greater than the assignment's current sustained_rpm"
    error_id: ERR_UPGRADE_NOT_AN_INCREASE
    http_status: 422
    applies_to: "POST /quota-assignments/{id}/upgrade-requests"

  - priority: 52
    category: business_constraint
    check: "a support case cannot be resolved before at least one communication has been recorded"
    error_id: ERR_NO_COMMUNICATION_RECORDED
    http_status: 422
    applies_to: "POST /support-cases/{id}/resolve"

  - priority: 53
    category: business_constraint
    check: "at most one appeal may be filed per ViolationCase"
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    applies_to: "POST /violation-cases/{id}/appeal"

  - priority: 54
    category: business_fiscal
    check: "the assignment's sustained_rpm must be below TIER_CEILING_FACTOR (2) x its tier base sustained rpm for an upgrade to be admissible at request time"
    error_id: ERR_TIER_CEILING_REACHED
    http_status: 422
    applies_to: "POST /quota-assignments/{id}/upgrade-requests"

  - priority: 55
    category: business_fiscal
    check: "ApiProduct.available_sustained_rpm must be greater than 0 for provisioning and reinstatement"
    error_id: ERR_SUSTAINED_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST /quota-assignments, POST /quota-assignments/{id}/reinstate"

  - priority: 56
    category: business_fiscal
    check: "ApiProduct.available_monthly_calls must be greater than 0 for provisioning and must cover the allowance on reinstatement"
    error_id: ERR_MONTHLY_POOL_EXHAUSTED
    http_status: 422
    applies_to: "POST /quota-assignments, POST /quota-assignments/{id}/reinstate"

  - priority: 57
    category: business_fiscal
    check: "a program adjustment must not reduce a pool below the amount already allocated"
    error_id: ERR_POOL_BELOW_ALLOCATED
    http_status: 422
    applies_to: "POST /api-products/{id}/program-adjustments"

# ---------------------------------------------------------------------------
# §1.5 API endpoints
#
# Paths are flat and root-level (api_prefix ""). Every entity has a
# single-resource GET so its collection segment is unambiguous, and every FK
# declared in §1.1 is reverse-reachable either as a sub-resource list
# (ApiVersion, UpgradeRequest, UsageWindow) or through a filtered collection
# list that accepts each FK as an optional query field (AccessApplication,
# QuotaAssignment, SandboxLease, ViolationCase, SupportCase, FeedbackItem).
# ---------------------------------------------------------------------------
endpoints:
  # --- Developer -----------------------------------------------------------
  - method: POST
    path: "/developers"
    description: "register a developer in the program; onboarding_state starts at REGISTERED and both trust scores start at 50"
    roles: [Anonymous, DevRelManager]
    code: 201
    input: [org_name, contact_email, region_code]
    output: Developer
    side_effects: ["creates the Developer with standing GOOD_STANDING, directory_state NOT_LISTED, certification_level NONE"]

  - method: GET
    path: "/developers/{id}"
    description: "read one developer, including both trust score variants and all three state dimensions"
    roles: [Developer, DevRelManager, PlatformAdmin, TrustAndSafetyOfficer, PartnerSupportAgent]
    code: 200
    input: []
    output: Developer
    side_effects: []

  - method: GET
    path: "/developers"
    description: "paginated developer list; directory_state filters the public directory listing view"
    roles: [DevRelManager, PlatformAdmin, TrustAndSafetyOfficer]
    code: 200
    input: ["directory_state?", "standing?", "onboarding_state?", "limit?", "offset?"]
    output: Developer[]
    side_effects: []

  - method: POST
    path: "/developers/{id}/onboarding-acknowledgement"
    description: "acknowledge the current documentation version and accept a terms-of-service version"
    roles: [Developer]
    code: 200
    input: [docs_version, tos_version]
    output: Developer
    side_effects:
      - "sets docs_version_acknowledged and tos_version_accepted"
      - "advances onboarding_state REGISTERED -> DOCS_ACKNOWLEDGED"
      - "recomputes trust_score under the onboarding_snapshot variant"

  - method: POST
    path: "/developers/{id}/ecosystem-participations"
    description: "record ecosystem programme outcomes: certification award/renewal and hackathon awards"
    roles: [DevRelManager]
    code: 200
    input: [certification_level, certification_expires_at, "hackathon_awards_delta?"]
    output: Developer
    side_effects:
      - "sets certification_level and certification_expires_at, increments hackathon_award_count"
      - "recomputes trust_score under the onboarding_snapshot variant"

  - method: POST
    path: "/developers/{id}/directory-submission"
    description: "submit or resubmit the developer's public directory listing for review"
    roles: [Developer]
    code: 200
    input: [directory_summary]
    output: Developer
    side_effects: ["directory_state NOT_LISTED or DELISTED -> PENDING_REVIEW"]

  - method: POST
    path: "/developers/{id}/directory-review"
    description: "approve or reject a pending directory listing"
    roles: [DevRelManager]
    code: 200
    input: [decision, "review_note?"]
    output: Developer
    side_effects: ["directory_state PENDING_REVIEW -> LISTED on APPROVE, -> NOT_LISTED on REJECT"]

  - method: POST
    path: "/developers/{id}/revoke-access"
    description: "revoke all platform access for a restricted developer"
    roles: [PlatformAdmin]
    code: 200
    input: [revocation_reason]
    output: Developer
    side_effects:
      - "standing RESTRICTED -> REVOKED and sets revoked_at"
      - "cascade: all non-RETIRED QuotaAssignment rows become RETIRED and release both pool reservations"
      - "cascade: ACTIVE SandboxLease rows become REVOKED; directory_state becomes DELISTED"
      - "cascade: non-terminal AccessApplication rows become REJECTED"

  # --- ApiProduct / ApiVersion --------------------------------------------
  - method: POST
    path: "/api-products"
    description: "create an API product with its scope catalogue and finite rate/call pools"
    roles: [PlatformAdmin]
    code: 201
    input: [name, data_sensitivity, scope_catalog, sample_app_slugs, sustained_rpm_pool, monthly_call_pool, "required_tos_version?"]
    output: ApiProduct
    side_effects: ["allocated pools start at 0 so available_* equal the declared pools; demand_index starts at 0.00"]

  - method: GET
    path: "/api-products/{id}"
    description: "read one API product with live pool availability and demand index"
    roles: [Developer, DevRelManager, PlatformAdmin, TrustAndSafetyOfficer, PartnerSupportAgent]
    code: 200
    input: []
    output: ApiProduct
    side_effects: []

  - method: GET
    path: "/api-products"
    description: "paginated product catalogue"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: ["data_sensitivity?", "limit?", "offset?"]
    output: ApiProduct[]
    side_effects: []

  - method: POST
    path: "/api-products/{id}/program-adjustments"
    description: "adjust a product's sustained rpm pool and/or monthly call pool; never below what is already allocated"
    roles: [PlatformAdmin]
    code: 200
    input: ["sustained_rpm_pool?", "monthly_call_pool?", "required_tos_version?", adjustment_reason]
    output: ApiProduct
    side_effects: ["recomputes available_sustained_rpm and available_monthly_calls; increments ApiProduct.version by 1"]

  - method: POST
    path: "/api-products/{id}/versions"
    description: "create a new API version of the product in lifecycle_state PREVIEW"
    roles: [PlatformAdmin]
    code: 201
    input: [semver, breaking_change]
    output: ApiVersion
    side_effects: []

  - method: GET
    path: "/api-products/{id}/versions"
    description: "list every ApiVersion of the product (FK reverse-reachability for ApiVersion.api_product_id)"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: ["lifecycle_state?", "limit?", "offset?"]
    output: ApiVersion[]
    side_effects: []

  - method: GET
    path: "/api-products/{id}/roadmap"
    description: "computed read: the product's TRIAGED and ROADMAP_ACCEPTED feedback ranked by priority_score DESC, raw_impact DESC, created_at ASC"
    roles: [DevRelManager, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: FeedbackItem[]
    side_effects: []

  - method: POST
    path: "/api-products/{id}/upgrade-allocation-run"
    description: "run the waterfall allocation over every PENDING upgrade request of this product"
    roles: [DevRelManager]
    code: 200
    input: []
    output:
      run_sequence_count: integer
      granted_count: integer
      partially_granted_count: integer
      deferred_count: integer
      allocated_sustained_rpm_delta: integer
      available_sustained_rpm_after: integer
    side_effects:
      - "orders PENDING requests by tier rank DESC, requested_delta_rpm ASC, created_at ASC and assigns run_sequence"
      - "moves each request to GRANTED / PARTIALLY_GRANTED / DEFERRED and mutates QuotaAssignment.sustained_rpm and burst_rpm"
      - "increments ApiProduct.allocated_sustained_rpm by the granted total"

  - method: GET
    path: "/api-versions/{id}"
    description: "read one API version with its deprecation timeline and required notice days"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: []
    output: ApiVersion
    side_effects: []

  - method: POST
    path: "/api-versions/{id}/promote"
    description: "promote a PREVIEW version to GENERAL_AVAILABILITY"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ApiVersion
    side_effects: ["lifecycle_state PREVIEW -> GENERAL_AVAILABILITY, making the version grantable to STANDARD and above"]

  - method: POST
    path: "/api-versions/{id}/migration-guide"
    description: "publish the migration guide for a version, a precondition for announcing a breaking deprecation"
    roles: [PlatformAdmin]
    code: 200
    input: [migration_guide_url]
    output: ApiVersion
    side_effects: ["sets migration_guide_url and migration_guide_published_at from the logical clock"]

  - method: POST
    path: "/api-versions/{id}/announce-deprecation"
    description: "announce deprecation with a sunset timeline; notice_days is gated by calculations.deprecation_notice_requirement"
    roles: [PlatformAdmin]
    code: 200
    input: [notice_days]
    output: ApiVersion
    side_effects:
      - "computes and stores required_notice_days, notice_days_at_announcement and sunset_at"
      - "lifecycle_state GENERAL_AVAILABILITY -> DEPRECATION_ANNOUNCED; the version stops being grantable to new applications"

  # --- AccessApplication ---------------------------------------------------
  - method: POST
    path: "/access-applications"
    description: "draft an access application for a target API version, naming the requested tier, scopes and volume"
    roles: [Developer]
    code: 201
    input: [developer_id, target_api_version_id, requested_tier, requested_scopes, requested_monthly_calls, justification_text]
    output: AccessApplication
    side_effects: ["state starts at DRAFT with revision_round 0"]

  - method: GET
    path: "/access-applications/{id}"
    description: "read one access application including granted scopes and data_access_limit"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: []
    output: AccessApplication
    side_effects: []

  - method: GET
    path: "/access-applications"
    description: "filtered list of access applications (FK reverse-reachability for developer_id and target_api_version_id)"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: ["developer_id?", "target_api_version_id?", "state?", "limit?", "offset?"]
    output: AccessApplication[]
    side_effects: []

  - method: POST
    path: "/access-applications/{id}/submit"
    description: "submit or resubmit the application for review"
    roles: [Developer]
    code: 200
    input: ["justification_text?"]
    output: AccessApplication
    side_effects: ["state DRAFT or CHANGES_REQUESTED -> SUBMITTED and increments revision_round"]

  - method: POST
    path: "/access-applications/{id}/claim-review"
    description: "claim the application for review; the claiming user is recorded as reviewer_user_id"
    roles: [DevRelManager]
    code: 200
    input: []
    output: AccessApplication
    side_effects: ["state SUBMITTED -> UNDER_REVIEW and records reviewer_user_id from X-User-ID"]

  - method: POST
    path: "/access-applications/{id}/request-changes"
    description: "send the application back to the developer for revision"
    roles: [DevRelManager]
    code: 200
    input: [changes_requested_note]
    output: AccessApplication
    side_effects: ["state UNDER_REVIEW -> CHANGES_REQUESTED"]

  - method: POST
    path: "/access-applications/{id}/decide"
    description: "approve (with an access tier, scope grant and data access limit) or reject the application; the approver must differ from the reviewer"
    roles: [PlatformAdmin]
    code: 200
    input: [decision, "approved_tier?", "granted_scopes?", "decision_reason?"]
    output: AccessApplication
    side_effects:
      - "state UNDER_REVIEW -> APPROVED or REJECTED and records approver_user_id and decided_at"
      - "on APPROVE computes data_access_limit from the granted scopes and approved tier"

  # --- QuotaAssignment / UpgradeRequest / UsageWindow ----------------------
  - method: POST
    path: "/quota-assignments"
    description: "provision the entitlement for an approved application; runs calculations.quota_provisioning against the product's pools under OCC on ApiProduct.version"
    roles: [PlatformAdmin]
    code: 201
    input: [access_application_id, expected_api_product_version]
    output: QuotaAssignment
    side_effects:
      - "derives tier, granted_scopes and pinned_api_version_id from the application"
      - "computes sustained_rpm, burst_rpm, burst_credit_balance and monthly_call_allowance"
      - "increments ApiProduct.allocated_sustained_rpm and allocated_monthly_calls"
      - "increments ApiProduct.version by 1"
      - "entitlement_state starts at PROVISIONED, throttle_state at NORMAL"

  - method: GET
    path: "/quota-assignments/{id}"
    description: "read one entitlement with its live consumption ledger and both state dimensions"
    roles: [Developer, DevRelManager, PlatformAdmin, TrustAndSafetyOfficer, PartnerSupportAgent]
    code: 200
    input: []
    output: QuotaAssignment
    side_effects: []

  - method: GET
    path: "/quota-assignments"
    description: "filtered list of entitlements (FK reverse-reachability for developer_id, access_application_id and pinned_api_version_id)"
    roles: [Developer, DevRelManager, PlatformAdmin, TrustAndSafetyOfficer]
    code: 200
    input: ["developer_id?", "access_application_id?", "pinned_api_version_id?", "entitlement_state?", "throttle_state?", "limit?", "offset?"]
    output: QuotaAssignment[]
    side_effects: []

  - method: POST
    path: "/quota-assignments/{id}/activate"
    description: "activate a provisioned entitlement so it can serve traffic"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: QuotaAssignment
    side_effects:
      - "entitlement_state PROVISIONED -> ACTIVE and sets activated_at"
      - "bubble up: developer onboarding_state SANDBOX_VALIDATED -> PRODUCTION_ACTIVE"

  - method: POST
    path: "/quota-assignments/{id}/suspend"
    description: "administratively suspend an active entitlement, returning its reservations to the product pools"
    roles: [PlatformAdmin]
    code: 200
    input: [suspension_reason]
    output: QuotaAssignment
    side_effects:
      - "entitlement_state ACTIVE -> SUSPENDED and sets suspended_at"
      - "decrements ApiProduct.allocated_sustained_rpm and allocated_monthly_calls by this assignment's reservations"
      - "PENDING UpgradeRequest rows on this assignment become VOIDED"

  - method: POST
    path: "/quota-assignments/{id}/reinstate"
    description: "reinstate a suspended entitlement, re-deducting its reservations from the product pools"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: QuotaAssignment
    side_effects:
      - "entitlement_state SUSPENDED -> ACTIVE, clears suspended_at and suspension_reason"
      - "increments ApiProduct.allocated_sustained_rpm and allocated_monthly_calls back"

  - method: POST
    path: "/quota-assignments/{id}/usage-windows"
    description: "record one hour-aligned usage window; runs calculations.usage_consumption_attribution and may move throttle_state"
    roles: [PlatformAdmin, DevRelManager]
    code: 201
    input: [window_start, total_calls, burst_calls]
    output: UsageWindow
    side_effects:
      - "selects the attribution variant, charges the allowance and/or burst credit, updates monthly_calls_consumed"
      - "sets resulting_throttle_state on the window and QuotaAssignment.throttle_state"
      - "updates the developer's clean_window_count / throttled_window_count"

  - method: GET
    path: "/quota-assignments/{id}/usage-windows"
    description: "list the assignment's usage windows in window_start order (FK reverse-reachability for UsageWindow.quota_assignment_id)"
    roles: [Developer, DevRelManager, PlatformAdmin, TrustAndSafetyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: UsageWindow[]
    side_effects: []

  - method: POST
    path: "/quota-assignments/{id}/upgrade-requests"
    description: "request a sustained rpm upgrade with justification; supersedes the assignment's prior PENDING request under OCC on QuotaAssignment.version"
    roles: [Developer]
    code: 201
    input: [requested_sustained_rpm, justification_text, expected_quota_assignment_version]
    output: UpgradeRequest
    side_effects:
      - "computes requested_delta_rpm from the assignment's current sustained_rpm"
      - "the assignment's prior PENDING UpgradeRequest becomes SUPERSEDED"
      - "increments QuotaAssignment.version by 1"

  - method: GET
    path: "/quota-assignments/{id}/upgrade-requests"
    description: "list the assignment's upgrade requests (FK reverse-reachability for UpgradeRequest.quota_assignment_id)"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: UpgradeRequest[]
    side_effects: []

  - method: GET
    path: "/upgrade-requests/{id}"
    description: "read one upgrade request with its granted delta, denial reason and run_sequence"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: []
    output: UpgradeRequest
    side_effects: []

  # --- SandboxLease --------------------------------------------------------
  - method: POST
    path: "/sandbox-leases"
    description: "provision a sandbox environment lease for a developer on a product, with a sample application"
    roles: [Developer]
    code: 201
    input: [developer_id, api_product_id, starts_at, lease_days, sample_app_slug]
    output: SandboxLease
    side_effects: ["computes expires_at = starts_at + lease_days days; state starts at ACTIVE"]

  - method: GET
    path: "/sandbox-leases/{id}"
    description: "read one sandbox lease"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: []
    output: SandboxLease
    side_effects: []

  - method: GET
    path: "/sandbox-leases"
    description: "filtered list of sandbox leases (FK reverse-reachability for developer_id and api_product_id)"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: ["developer_id?", "api_product_id?", "state?", "limit?", "offset?"]
    output: SandboxLease[]
    side_effects: []

  - method: POST
    path: "/sandbox-leases/{id}/validate"
    description: "declare the sample application successfully exercised in the sandbox"
    roles: [Developer]
    code: 200
    input: []
    output: SandboxLease
    side_effects:
      - "advances the developer's onboarding_state DOCS_ACKNOWLEDGED -> SANDBOX_VALIDATED"
      - "recomputes trust_score under the onboarding_snapshot variant"

  - method: POST
    path: "/sandbox-leases/{id}/release"
    description: "release an active lease early, freeing the interval for a new lease"
    roles: [Developer]
    code: 200
    input: []
    output: SandboxLease
    side_effects: ["state ACTIVE -> RELEASED with closed_reason DEVELOPER_RELEASE and sets released_at"]

  # --- ViolationCase -------------------------------------------------------
  - method: POST
    path: "/violation-cases"
    description: "open a terms-of-service violation case against a developer, citing usage-window evidence"
    roles: [TrustAndSafetyOfficer]
    code: 201
    input: [developer_id, category, severity, summary, "quota_assignment_id?", "evidence_window_ids?"]
    output: ViolationCase
    side_effects: ["computes penalty_points from category and severity; state starts at OPENED; records opened_by_user_id"]

  - method: GET
    path: "/violation-cases/{id}"
    description: "read one violation case with its penalty points, applied points and deadlines"
    roles: [Developer, TrustAndSafetyOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ViolationCase
    side_effects: []

  - method: GET
    path: "/violation-cases"
    description: "filtered list of violation cases (FK reverse-reachability for developer_id and quota_assignment_id)"
    roles: [Developer, TrustAndSafetyOfficer, PlatformAdmin]
    code: 200
    input: ["developer_id?", "quota_assignment_id?", "state?", "limit?", "offset?"]
    output: ViolationCase[]
    side_effects: []

  - method: POST
    path: "/violation-cases/{id}/investigate"
    description: "open the investigation; the acting officer is recorded as investigator_user_id and the developer's standing moves under review"
    roles: [TrustAndSafetyOfficer]
    code: 200
    input: ["evidence_window_ids?"]
    output: ViolationCase
    side_effects:
      - "state OPENED -> INVESTIGATING, records investigator_user_id and remediation_deadline"
      - "developer standing GOOD_STANDING -> UNDER_REVIEW"

  - method: POST
    path: "/violation-cases/{id}/adjudicate"
    description: "adjudicate the case UPHELD or DISMISSED; the adjudicator must differ from the investigator"
    roles: [PlatformAdmin]
    code: 200
    input: [outcome, decision_note]
    output: ViolationCase
    side_effects:
      - "on UPHELD applies penalty_points to Developer.violation_points, records points_applied and appeal_deadline"
      - "on UPHELD reaching 50 points: cascade to standing RESTRICTED, assignment suspension with pool release, directory delisting, lease revocation"
      - "on DISMISSED reverses points_applied and, from an appeal, restores standing and the suspended assignments"

  - method: POST
    path: "/violation-cases/{id}/appeal"
    description: "appeal an upheld case inside the appeal window; at most one appeal per case"
    roles: [Developer]
    code: 200
    input: [appeal_reason]
    output: ViolationCase
    side_effects: ["state UPHELD -> APPEALED, records appeal_reason and increments appeal_count"]

  # --- SupportCase ---------------------------------------------------------
  - method: POST
    path: "/support-cases"
    description: "open a partner support ticket or record a platform incident, with severity-driven response commitments"
    roles: [PartnerSupportAgent, Developer]
    code: 201
    input: [kind, api_product_id, severity, title, "developer_id?", "started_at?"]
    output: SupportCase
    side_effects: ["computes first_response_due_minutes from kind and severity; state starts at OPEN with escalation_tier 0"]

  - method: GET
    path: "/support-cases/{id}"
    description: "read one support case with its response, cadence and credit fields"
    roles: [Developer, PartnerSupportAgent, DevRelManager, PlatformAdmin]
    code: 200
    input: []
    output: SupportCase
    side_effects: []

  - method: GET
    path: "/support-cases"
    description: "filtered list of support cases (FK reverse-reachability for developer_id and api_product_id)"
    roles: [Developer, PartnerSupportAgent, DevRelManager, PlatformAdmin]
    code: 200
    input: ["developer_id?", "api_product_id?", "kind?", "state?", "limit?", "offset?"]
    output: SupportCase[]
    side_effects: []

  - method: POST
    path: "/support-cases/{id}/communications"
    description: "record an incident/ticket communication; drives first-response and communication-cadence commitments"
    roles: [PartnerSupportAgent]
    code: 200
    input: [sent_at, body]
    output: SupportCase
    side_effects:
      - "increments communication_count, sets first_response_at on the first one and recomputes first_response_breached"
      - "recomputes max_communication_gap_minutes and comms_gap_breached"
      - "state OPEN -> RESPONDING"

  - method: POST
    path: "/support-cases/{id}/escalate"
    description: "escalate the case one tier along the partner escalation channel, capped at tier 3"
    roles: [PartnerSupportAgent]
    code: 200
    input: ["escalation_note?"]
    output: SupportCase
    side_effects: ["increments escalation_tier and moves state to ESCALATED"]

  - method: POST
    path: "/support-cases/{id}/resolve"
    description: "resolve the case; for a platform incident this runs calculations.sla_service_credit over every affected entitlement"
    roles: [PartnerSupportAgent]
    code: 200
    input: [resolution_note]
    output: SupportCase
    side_effects:
      - "computes downtime_minutes, max_communication_gap_minutes, comms_gap_breached and credit_uplift_applied"
      - "for PLATFORM_INCIDENT: adds the per-assignment rounded credit to each affected QuotaAssignment.bonus_call_credit and records total_credit_calls and affected_assignment_count"
      - "cascade: each credited assignment's throttle_state is re-evaluated against the enlarged effective allowance"

  # --- FeedbackItem --------------------------------------------------------
  - method: POST
    path: "/feedback-items"
    description: "submit developer feedback against a product"
    roles: [Developer]
    code: 201
    input: [developer_id, api_product_id, category, body]
    output: FeedbackItem
    side_effects: ["state starts at SUBMITTED with raw_impact and priority_score null"]

  - method: GET
    path: "/feedback-items/{id}"
    description: "read one feedback item with its impact and priority scores"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: []
    output: FeedbackItem
    side_effects: []

  - method: GET
    path: "/feedback-items"
    description: "filtered list of feedback items (FK reverse-reachability for developer_id and api_product_id)"
    roles: [Developer, DevRelManager, PlatformAdmin]
    code: 200
    input: ["developer_id?", "api_product_id?", "state?", "limit?", "offset?"]
    output: FeedbackItem[]
    side_effects: []

  - method: POST
    path: "/feedback-items/{id}/triage"
    description: "triage the item: resolve the author's top tier, score it, and fold it into the product's demand index"
    roles: [DevRelManager]
    code: 200
    input: ["decision_note?"]
    output: FeedbackItem
    side_effects:
      - "state SUBMITTED -> TRIAGED, sets author_top_tier, raw_impact, priority_score and triaged_at"
      - "ledger sync: adds raw_impact to ApiProduct.demand_index and re-scores every other counted item of the product"

  - method: POST
    path: "/feedback-items/{id}/roadmap-decision"
    description: "accept the item onto the platform roadmap or decline it"
    roles: [DevRelManager]
    code: 200
    input: [decision, "decision_note?"]
    output: FeedbackItem
    side_effects:
      - "state TRIAGED -> ROADMAP_ACCEPTED or DECLINED"
      - "on DECLINE: compensation — subtracts raw_impact from ApiProduct.demand_index, nulls priority_score and re-scores the remaining counted items"

  # --- Programme-wide clock and checkpoint --------------------------------
  - method: POST
    path: "/program-checkpoints"
    description: "run the programme checkpoint against the current logical clock, in this fixed step order"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output:
      expired_lease_ids: string[]
      expired_certification_developer_ids: string[]
      sunset_version_ids: string[]
      retired_assignment_ids: string[]
      voided_upgrade_request_ids: string[]
      finalised_case_ids: string[]
      reset_assignment_ids: string[]
      rescored_developer_ids: string[]
    side_effects:
      - "step 1: ACTIVE SandboxLease rows whose expires_at has passed become EXPIRED with closed_reason CHECKPOINT_EXPIRY"
      - "step 2: developers whose certification_expires_at has passed keep certification_level but stop earning its trust points"
      - "step 3: DEPRECATION_ANNOUNCED versions whose sunset_at has passed become SUNSET, cascading assignment retirement, pool release, upgrade voiding and application rejection"
      - "step 4: UPHELD cases past their appeal_deadline that are not awaiting an appeal decision (appeal_count 0, or the single filed appeal was already adjudicated UPHELD) become UPHELD_FINAL"
      - "step 5: monthly reset — every assignment in entitlement_state ACTIVE whose last_reset_at is 30 or more whole days before the logical clock (RESET_PERIOD_DAYS = 30) zeroes monthly_calls_consumed and bonus_call_credit, restores burst_credit_balance to burst_rpm * 10, sets last_reset_at to the logical clock, and re-evaluates throttle_state; assignments inside the 30-day period are left untouched and are NOT listed in reset_assignment_ids"
      - "step 6: audited rescoring — every developer's audited_trust_score is recomputed under the enforcement_audit variant"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: set the server's logical UTC clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and never falls back to wall-clock time. The clock only moves forward."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output:
      current_utc: string
      previous_utc: string
    side_effects: ["all subsequent deadline, expiry, window and notice-period evaluations read the new instant"]

  - method: GET
    path: "/_clock/current"
    description: "test-driving endpoint: read the server's logical UTC clock; requires no auth headers"
    roles: [Anonymous, Developer, DevRelManager, PlatformAdmin, TrustAndSafetyOfficer, PartnerSupportAgent]
    code: 200
    input: []
    output:
      current_utc: string
    side_effects: []

# ---------------------------------------------------------------------------
# §1.6 Error catalogue. Every id below is triggerable by at least one
# endpoint; the ordering mirrors the §1.4 priority ladder.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six declared roles"
  - id: ERR_UNKNOWN_DEVELOPER_IDENTITY
    http: 401
    condition: "role Developer but X-User-ID is not an existing Developer id"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, wrong type, enum outside its domain, length/range violation, or pagination limit outside 1..100"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "role Developer acting on a resource owned by a different developer"

  - id: ERR_DEVELOPER_NOT_FOUND
    http: 404
    condition: "developer id in the path or body does not exist"
  - id: ERR_API_PRODUCT_NOT_FOUND
    http: 404
    condition: "api_product_id in the path or body does not exist"
  - id: ERR_API_VERSION_NOT_FOUND
    http: 404
    condition: "api version id in the path or body does not exist"
  - id: ERR_ACCESS_APPLICATION_NOT_FOUND
    http: 404
    condition: "access application id in the path or body does not exist"
  - id: ERR_QUOTA_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "quota assignment id in the path or body does not exist"
  - id: ERR_UPGRADE_REQUEST_NOT_FOUND
    http: 404
    condition: "upgrade request id in the path does not exist"
  - id: ERR_USAGE_WINDOW_NOT_FOUND
    http: 404
    condition: "an evidence_window_ids entry does not reference an existing UsageWindow"
  - id: ERR_SANDBOX_LEASE_NOT_FOUND
    http: 404
    condition: "sandbox lease id in the path does not exist"
  - id: ERR_VIOLATION_CASE_NOT_FOUND
    http: 404
    condition: "violation case id in the path does not exist"
  - id: ERR_SUPPORT_CASE_NOT_FOUND
    http: 404
    condition: "support case id in the path does not exist"
  - id: ERR_FEEDBACK_ITEM_NOT_FOUND
    http: 404
    condition: "feedback item id in the path does not exist"

  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_api_product_version does not equal ApiProduct.version"
  - id: ERR_STALE_ASSIGNMENT_VERSION
    http: 412
    condition: "expected_quota_assignment_version does not equal QuotaAssignment.version"

  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "the access application is not in a state that permits the requested transition"
  - id: ERR_ASSIGNMENT_NOT_ACTIVE
    http: 409
    condition: "the entitlement is not in entitlement_state ACTIVE"
  - id: ERR_ASSIGNMENT_STATE_INVALID
    http: 409
    condition: "the entitlement is not in the entitlement_state the lifecycle action requires"
  - id: ERR_VERSION_STATE_INVALID
    http: 409
    condition: "the API version is not in the lifecycle_state the action requires"
  - id: ERR_CASE_STATE_INVALID
    http: 409
    condition: "the violation case is not in the state the action requires"
  - id: ERR_SUPPORT_CASE_STATE_INVALID
    http: 409
    condition: "the support case is not in the state the action requires"
  - id: ERR_LEASE_NOT_ACTIVE
    http: 409
    condition: "the sandbox lease is not in state ACTIVE"
  - id: ERR_FEEDBACK_STATE_INVALID
    http: 409
    condition: "the feedback item is not in the state the action requires"
  - id: ERR_NO_PENDING_UPGRADE_REQUESTS
    http: 409
    condition: "an allocation run was requested for a product with no PENDING upgrade requests"

  - id: ERR_DEVELOPER_STANDING_BLOCKED
    http: 422
    condition: "the developer's standing is UNDER_REVIEW, RESTRICTED or REVOKED where GOOD_STANDING is required"
  - id: ERR_DEVELOPER_REVOKED
    http: 422
    condition: "a developer whose standing is REVOKED attempted any write"
  - id: ERR_TOS_VERSION_STALE
    http: 422
    condition: "tos_version_accepted is below the product's required_tos_version"
  - id: ERR_DOCS_NOT_ACKNOWLEDGED
    http: 422
    condition: "docs_version_acknowledged is below the platform current docs version"
  - id: ERR_SCOPE_SENSITIVITY_NOT_PERMITTED
    http: 422
    condition: "a PERSONAL scope was requested below tier STANDARD, or a FINANCIAL scope below tier PARTNER"
  - id: ERR_JUSTIFICATION_INSUFFICIENT
    http: 422
    condition: "justification_text is shorter than the minimum for the requested tier"
  - id: ERR_SEVERITY_NOT_ENTITLED
    http: 422
    condition: "an S1 or S2 partner ticket was opened without an ACTIVE PARTNER or PRIVILEGED entitlement"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "the acting user already occupied the conflicting role on this workflow (reviewer deciding, investigator adjudicating or revoking)"

  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "the requested logical clock instant is before the current one"
  - id: ERR_WINDOW_NOT_ALIGNED
    http: 422
    condition: "window_start is not exactly hour-aligned"
  - id: ERR_WINDOW_IN_FUTURE
    http: 422
    condition: "window_end is after the current logical clock"
  - id: ERR_WINDOW_OUT_OF_ORDER
    http: 422
    condition: "window_start precedes the assignment's most recent recorded window_start"
  - id: ERR_WINDOW_DUPLICATE
    http: 409
    condition: "a usage window with the same window_start already exists for the assignment"
  - id: ERR_NOTICE_PERIOD_TOO_SHORT
    http: 422
    condition: "notice_days is below the computed required_notice_days"
  - id: ERR_DEPRECATION_WINDOW_FULL
    http: 422
    condition: "the product already has 2 versions in DEPRECATION_ANNOUNCED"
  - id: ERR_SANDBOX_INTERVAL_OVERLAP
    http: 409
    condition: "the requested lease interval overlaps an ACTIVE lease of the same developer on the same product"
  - id: ERR_INCIDENT_COALESCE_WINDOW
    http: 409
    condition: "a platform incident was opened inside the 60-minute coalesce buffer after an identical-severity incident on the same product resolved"
  - id: ERR_COMMUNICATION_OUT_OF_ORDER
    http: 422
    condition: "communication sent_at precedes started_at or last_communication_at, or is after the logical clock"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "the appeal was filed after the case's appeal_deadline"
  - id: ERR_CERTIFICATION_EXPIRED
    http: 422
    condition: "certification_expires_at is at or before the current logical clock where an unexpired certification is required"

  - id: ERR_VERSION_NOT_GRANTABLE
    http: 422
    condition: "the target version's lifecycle_state does not permit a grant at the requested tier"
  - id: ERR_MIGRATION_GUIDE_MISSING
    http: 422
    condition: "a breaking version's deprecation was announced with no published migration guide"
  - id: ERR_EVIDENCE_NOT_ATTRIBUTABLE
    http: 422
    condition: "an evidence window belongs to an assignment of a different developer"
  - id: ERR_SUPPORT_CASE_KIND_MISMATCH
    http: 422
    condition: "a partner ticket omitted an entitled developer_id, or a platform incident named a developer_id or omitted started_at"
  - id: ERR_ESCALATION_NOT_ENTITLED
    http: 422
    condition: "escalation beyond tier 1 without an ACTIVE PARTNER or PRIVILEGED entitlement"
  - id: ERR_DIRECTORY_PREREQUISITES_UNMET
    http: 422
    condition: "directory submission without onboarding_state PRODUCTION_ACTIVE or without a certification"

  - id: ERR_DUPLICATE_APPLICATION
    http: 409
    condition: "a non-terminal application already exists for this developer and target version"
  - id: ERR_ASSIGNMENT_ALREADY_EXISTS
    http: 409
    condition: "the approved application already backs a QuotaAssignment"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 422
    condition: "revision_round has reached MAX_REVISION_ROUNDS (3)"
  - id: ERR_TIER_ESCALATION_NOT_PERMITTED
    http: 422
    condition: "approved_tier outranks requested_tier, or granted_scopes is not a subset of requested_scopes and the product catalogue"
  - id: ERR_UPGRADE_NOT_AN_INCREASE
    http: 422
    condition: "requested_sustained_rpm is at or below the assignment's current sustained_rpm"
  - id: ERR_NO_COMMUNICATION_RECORDED
    http: 422
    condition: "resolution attempted with communication_count 0"
  - id: ERR_APPEAL_ALREADY_FILED
    http: 409
    condition: "the case already has appeal_count 1"

  - id: ERR_TIER_CEILING_REACHED
    http: 422
    condition: "the assignment's sustained_rpm is already at or above twice its tier base"
  - id: ERR_SUSTAINED_POOL_EXHAUSTED
    http: 422
    condition: "the product has no allocatable sustained rpm left for this operation"
  - id: ERR_MONTHLY_POOL_EXHAUSTED
    http: 422
    condition: "the product has no allocatable monthly calls left for this operation"
  - id: ERR_POOL_BELOW_ALLOCATED
    http: 422
    condition: "a program adjustment would set a pool below the amount already allocated"

# ---------------------------------------------------------------------------
# §1.7 RBAC matrix — segregation of duties: the reviewer of an application may
# not decide it, and the investigator of a violation case may not adjudicate it
# or revoke the developer. Both checks compare X-User-ID values.
# ---------------------------------------------------------------------------
roles:
  - name: Developer
    description: "a registered platform developer acting on its own onboarding, applications, entitlements, sandboxes, appeals, tickets and feedback"
    identity: "entity_backed:Developer"
    exclusive_operations:
      - "POST /developers/{id}/onboarding-acknowledgement"
      - "POST /developers/{id}/directory-submission"
      - "POST /access-applications"
      - "POST /access-applications/{id}/submit"
      - "POST /quota-assignments/{id}/upgrade-requests"
      - "POST /sandbox-leases"
      - "POST /sandbox-leases/{id}/validate"
      - "POST /sandbox-leases/{id}/release"
      - "POST /violation-cases/{id}/appeal"
      - "POST /feedback-items"
    shared_operations:
      - "GET /developers/{id}"
      - "GET /api-products, GET /api-products/{id}, GET /api-products/{id}/versions, GET /api-versions/{id}"
      - "GET /access-applications, GET /access-applications/{id}"
      - "GET /quota-assignments, GET /quota-assignments/{id}, GET /quota-assignments/{id}/usage-windows, GET /quota-assignments/{id}/upgrade-requests, GET /upgrade-requests/{id}"
      - "GET /sandbox-leases, GET /sandbox-leases/{id}"
      - "GET /violation-cases, GET /violation-cases/{id}"
      - "POST /support-cases, GET /support-cases, GET /support-cases/{id}"
      - "GET /feedback-items, GET /feedback-items/{id}"
      - "GET /_clock/current"

  - name: DevRelManager
    description: "developer-relations owner: reviews applications, runs the upgrade allocation waterfall, curates the directory, records ecosystem outcomes and triages feedback into the roadmap"
    identity: opaque
    exclusive_operations:
      - "POST /developers/{id}/ecosystem-participations"
      - "POST /developers/{id}/directory-review"
      - "POST /access-applications/{id}/claim-review"
      - "POST /access-applications/{id}/request-changes"
      - "POST /api-products/{id}/upgrade-allocation-run"
      - "POST /feedback-items/{id}/triage"
      - "POST /feedback-items/{id}/roadmap-decision"
      - "GET /api-products/{id}/roadmap"
    shared_operations:
      - "POST /developers"
      - "GET /developers, GET /developers/{id}"
      - "POST /quota-assignments/{id}/usage-windows"
      - "all catalogue, application, entitlement, lease, support and feedback reads"

  - name: PlatformAdmin
    description: "platform operator: owns the product catalogue and version lifecycle, provisions and suspends entitlements, decides applications, adjudicates violation cases, revokes access and drives the logical clock and programme checkpoint"
    identity: opaque
    exclusive_operations:
      - "POST /api-products"
      - "POST /api-products/{id}/program-adjustments"
      - "POST /api-products/{id}/versions"
      - "POST /api-versions/{id}/promote"
      - "POST /api-versions/{id}/migration-guide"
      - "POST /api-versions/{id}/announce-deprecation"
      - "POST /access-applications/{id}/decide"
      - "POST /quota-assignments"
      - "POST /quota-assignments/{id}/activate"
      - "POST /quota-assignments/{id}/suspend"
      - "POST /quota-assignments/{id}/reinstate"
      - "POST /violation-cases/{id}/adjudicate"
      - "POST /developers/{id}/revoke-access"
      - "POST /program-checkpoints"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /quota-assignments/{id}/usage-windows"
      - "GET /api-products/{id}/roadmap"
      - "all reads"

  - name: TrustAndSafetyOfficer
    description: "terms-of-service enforcement: monitors usage, opens and investigates violation cases, but never adjudicates them"
    identity: opaque
    exclusive_operations:
      - "POST /violation-cases"
      - "POST /violation-cases/{id}/investigate"
    shared_operations:
      - "GET /developers, GET /developers/{id}"
      - "GET /quota-assignments, GET /quota-assignments/{id}, GET /quota-assignments/{id}/usage-windows"
      - "GET /violation-cases, GET /violation-cases/{id}"

  - name: PartnerSupportAgent
    description: "partner support and incident communications: owns support cases, escalation channels, incident updates and resolution with service credits"
    identity: opaque
    exclusive_operations:
      - "POST /support-cases/{id}/communications"
      - "POST /support-cases/{id}/escalate"
      - "POST /support-cases/{id}/resolve"
    shared_operations:
      - "POST /support-cases"
      - "GET /support-cases, GET /support-cases/{id}"
      - "GET /developers/{id}, GET /quota-assignments, GET /quota-assignments/{id}"

  - name: Anonymous
    description: "unauthenticated self-service surface: developer self-registration and reading the logical clock"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /developers"
      - "GET /_clock/current"
