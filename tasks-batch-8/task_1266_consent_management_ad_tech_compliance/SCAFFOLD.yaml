  - { id: ERR_CONSENT_RECORD_NOT_FOUND, http: 404, condition: "ConsentRecord not found" }
  - { id: ERR_DNS_REQUEST_NOT_FOUND, http: 404, condition: "DoNotSellRequest not found" }
  - { id: ERR_PROPAGATION_NOT_FOUND, http: 404, condition: "VendorPropagation not found" }
  - { id: ERR_SCAN_NOT_FOUND, http: 404, condition: "TagAuditScan not found" }
