              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line X", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 10000 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line Y", trade_code: "PIPING", pricing_mode: "LUMP_SUM", duration_days: 1, quantity: 1, unit_price_cents: 20000 }
