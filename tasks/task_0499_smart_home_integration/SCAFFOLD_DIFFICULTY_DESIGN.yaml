# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Smart Home & Home-Theater Integration — Expert difficulty
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7. 9 rules x >=2 instances.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: proposal_total_estimate_vs_final_after_change_order
        grounds:
          - calculations.proposal_total
          - state_machines.Proposal.SENT_to_ACCEPTED
          - state_machines.ChangeOrder.APPROVED_to_APPLIED
          - entities.Proposal.fields.grand_total_cents
        distinguishing_aspect: |
          Two valid totals on the Proposal entity domain: the estimate_at_send variant computes
          grand_total_cents=652174 from line items; the final_after_change_orders variant on the SAME
          proposal yields 702174 because the applied delta (+50000) is authoritative and is NOT re-summed
          from line items — so the two variants differ by exactly the applied delta.
        test_recipe:
          setup:
            - "A residential Client and a DRAFT Project in region WEST exist; a rack exists."
            - "A SENT proposal with line items {CONTROLLER 1x250000, AUDIO 4x80000} and labor_hours_estimate=6.0; grand_total_cents=652174 after send."
            - "Client accepts the proposal (Project ACCEPTED, accepted_proposal_id pinned); a +50000 change order is SUBMITTED then APPROVED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Alice Res", email: "alice@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "1 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 6.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-SPK", category: "AUDIO", qty: 4, unit_price_cents: 80000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
              captures: { grand_at_send: $.data.grand_total_cents }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /projects/${proj_id}/change-orders"
              payload: { description: "Add subwoofer", delta_cents: 50000, added_labor_hours: 1.0 }
              as: ProjectManager
              captures: { co_id: $.data.id }
            - call: "POST /projects/${proj_id}/change-orders/${co_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProjectManager
              captures: { proj_v_pre_apply: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/change-orders/${co_id}/apply"
              payload: { expected_project_version: "${proj_v_pre_apply}" }
              as: ProjectManager
          assert:
            - "Proposal.${prop_id}.grand_total_cents == 652174 before apply (estimate variant)"
            - "Proposal.${prop_id}.grand_total_cents == 702174 after apply (final variant = estimate + 50000)"
            - "Proposal.${prop_id}.labor_hours_estimate == 7.0 after apply"

      - name: contract_balance_provisional_vs_drawn_down
        grounds:
          - calculations.contract_balance
          - state_machines.Contract.PENDING_to_ACTIVE
          - entities.Contract.fields.balance_cents
          - entities.Contract.fields.consumed_hours
        distinguishing_aspect: |
          Two valid balances on the Contract entity domain (distinct from proposal_total's Proposal domain):
          provisional_at_activation gives balance_cents=120000 (10h * 12000); the drawn_down variant after
          consuming 3.5h gives 78000 (6.5h * 12000) — same contract, two values keyed on consumed_hours.
        test_recipe:
          setup:
            - "A COMMISSIONED project exists with a PENDING contract: plan PLUS, prepaid_hours=10, hourly_rate_cents=12000."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Bob Res", email: "bob@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "2 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/contract"
              payload: { plan: "PLUS", prepaid_hours: 10, hourly_rate_cents: 12000 }
              as: SupportEngineer
              captures: { contract_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_id}/contract/activate"
              payload: {}
              as: SupportEngineer
              captures: { bal_after_activate: $.data.balance_cents }
            - call: "POST /projects/${proj_id}/contract/consume"
              payload: { hours: 3.5 }
              as: SupportEngineer
              captures: { bal_after_consume: $.data.balance_cents }
          assert:
            - "Contract.${contract_id}.balance_cents == 120000 immediately after activate (provisional variant)"
            - "Contract.${contract_id}.balance_cents == 78000 after consuming 3.5 hours (drawn_down variant)"
            - "Contract.${contract_id}.consumed_hours == 3.5"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: proposal_total_tiered_volume_loyalty_labor_matrix
        grounds:
          - calculations.proposal_total
          - entities.Client.fields.billing_tier
          - entities.Project.fields.region_code
          - state_machines.Proposal.DRAFT_to_SENT
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — volume tier of subtotal, +0.02 commercial loyalty,
          a 0.12 cap, and a region x billing_tier labor-rate matrix all combine. A COMMERCIAL EAST proposal of
          subtotal 2000000 hits tier2(0.10)+loyalty(0.02)=0.12 (at cap), 0 tax (commercial), labor 20h*16000=320000
          -> grand_total_cents=2080000.
        test_recipe:
          setup:
            - "A COMMERCIAL Client and a DRAFT Project in region EAST with a rack."
            - "A DRAFT proposal with one line item {NETWORK 10x200000} (subtotal 2000000), labor_hours_estimate=20.0."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "ComCo", email: "com@x.com", billing_tier: "COMMERCIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "9 Biz Pkwy", region_code: "EAST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 20, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 20.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-SW", category: "NETWORK", qty: 10, unit_price_cents: 200000 }
              as: SystemsDesigner
          trigger:
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
          assert:
            - "Proposal.${prop_id}.equipment_subtotal_cents == 2000000"
            - "Proposal.${prop_id}.discount_cents == 240000"
            - "Proposal.${prop_id}.labor_cost_cents == 320000"
            - "Proposal.${prop_id}.tax_cents == 0"
            - "Proposal.${prop_id}.grand_total_cents == 2080000"

      - name: proposal_total_pinned_eval_order_discount_then_tax
        grounds:
          - calculations.proposal_total
          - entities.Proposal.fields.discount_cents
          - entities.Proposal.fields.tax_cents
          - state_machines.Proposal.DRAFT_to_SENT
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned to an explicit order — discount is keyed on the
          subtotal volume tier, and tax is computed on the POST-discount base (not the raw subtotal), so the
          order discount-then-tax is load-bearing. Residential WEST subtotal 570000 -> discount 28500 ->
          taxable_base 541500 -> tax round_half_up(541500*0.0825)=44674 (NOT 0.0825*570000=47025).
        test_recipe:
          setup:
            - "A RESIDENTIAL Client and DRAFT Project in WEST with a rack."
            - "A DRAFT proposal with line items {CONTROLLER 1x250000, AUDIO 4x80000} (subtotal 570000), labor_hours_estimate=6.0."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Cara Res", email: "cara@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "3 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 6.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-SPK", category: "AUDIO", qty: 4, unit_price_cents: 80000 }
              as: SystemsDesigner
          trigger:
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
          assert:
            - "Proposal.${prop_id}.discount_cents == 28500"
            - "Proposal.${prop_id}.tax_cents == 44674"
            - "Proposal.${prop_id}.grand_total_cents == 652174"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: scene_program_revision_cycle_validated_back_to_draft
        grounds:
          - state_machines.SceneProgram.VALIDATED_to_DRAFT
          - state_machines.SceneProgram.DRAFT_to_VALIDATED
        distinguishing_aspect: |
          Cycle on the SceneProgram entity: DRAFT->VALIDATED->DRAFT (revise) is a true loop, not a linear
          pipeline — after revise the scene is editable again and can be re-validated.
        test_recipe:
          setup:
            - "A PROVISIONING project with a rack and one REGISTERED CONTROLLER device on that rack."
            - "A DRAFT scene whose device_ids = [that controller], action_count=2, then VALIDATED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Dee Res", email: "dee@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "4 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
              captures: { rack_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 2.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /projects/${proj_id}/start-provisioning"
              payload: {}
              as: ProjectManager
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "C4-CTRL", category: "CONTROLLER", rack_units: 2 }
              as: LowVoltageTech
              captures: { dev_id: $.data.id }
            - call: "POST /projects/${proj_id}/scenes"
              payload: { name: "Movie Night", device_ids: ["${dev_id}"], action_count: 2 }
              as: SystemsDesigner
              captures: { scene_id: $.data.id }
            - call: "POST /projects/${proj_id}/scenes/${scene_id}/validate"
              payload: {}
              as: SystemsDesigner
          trigger:
            - call: "POST /projects/${proj_id}/scenes/${scene_id}/revise"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/scenes/${scene_id}/validate"
              payload: {}
              as: SystemsDesigner
          assert:
            - "SceneProgram.${scene_id}.status == DRAFT immediately after revise"
            - "SceneProgram.${scene_id}.status == VALIDATED after re-validate (cycle completed)"

      - name: contract_active_suspended_resume_cycle
        grounds:
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - state_machines.Contract.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Parallel/cyclic shape on the Contract entity (different entity from SceneProgram): ACTIVE<->SUSPENDED
          is a genuine back-and-forth loop, distinguishing it from a forward-only pipeline.
        test_recipe:
          setup:
            - "A project with an ACTIVE contract (plan BASIC, prepaid_hours=5, hourly_rate_cents=10000)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Eve Res", email: "eve@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "5 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/contract"
              payload: { plan: "BASIC", prepaid_hours: 5, hourly_rate_cents: 10000 }
              as: SupportEngineer
              captures: { contract_id: $.data.id }
            - call: "POST /projects/${proj_id}/contract/activate"
              payload: {}
              as: SupportEngineer
          trigger:
            - call: "POST /projects/${proj_id}/contract/suspend"
              payload: {}
              as: SupportEngineer
            - call: "POST /projects/${proj_id}/contract/resume"
              payload: {}
              as: SupportEngineer
          assert:
            - "Contract.${contract_id}.status == SUSPENDED after suspend"
            - "Contract.${contract_id}.status == ACTIVE after resume (cycle completed)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: project_cancel_cascades_visit_cancel_then_assignment_release
        grounds:
          - state_machines.Project.ACCEPTED_to_CANCELLED
          - state_machines.Visit.CONFIRMED_to_CANCELLED
          - state_machines.VisitAssignment.ACTIVE_to_RELEASED
          - entities.Visit.fields.assigned_crew_count
        distinguishing_aspect: |
          Depth-3 cascade from Project cancel: Project ACCEPTED->CANCELLED mutates Visit (CONFIRMED->CANCELLED);
          THAT visit-cancel mutation itself releases the visit's VisitAssignment (ACTIVE->RELEASED). Each hop is
          caused by the prior hop, not directly by the cancel call. Trigger differs from the device cascade.
        test_recipe:
          setup:
            - "An ACCEPTED project in WEST with a rack."
            - "A WEST CrewMember (JOURNEYMAN, daily_visit_cap 2, active)."
            - "A PLANNED INSTALL visit window 2026-03-01T09:00Z..12:00Z, crew_size_required=1, with one ACTIVE assignment, then CONFIRMED."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Fay Res", email: "fay@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "6 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 4.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /crew-members"
              payload: { full_name: "Tech West", region_code: "WEST", cert_level: "JOURNEYMAN", daily_visit_cap: 2, active: true }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${proj_id}/visits"
              payload: { window_start: "2026-03-01T09:00:00Z", window_end: "2026-03-01T12:00:00Z", visit_kind: "INSTALL", crew_size_required: 1 }
              as: ProjectManager
              captures: { visit_id: $.data.id, visit_v0: $.data.version }
            - call: "POST /projects/${proj_id}/visits/${visit_id}/assignments"
              payload: { crew_member_id: "${crew_id}", expected_visit_version: "${visit_v0}" }
              as: ProjectManager
              captures: { asg_id: $.data.id }
            - call: "POST /projects/${proj_id}/visits/${visit_id}/confirm"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /projects/${proj_id}/cancel"
              payload: {}
              as: ProjectManager
          assert:
            - "Project.${proj_id}.status == CANCELLED"
            - "Visit.${visit_id}.status == CANCELLED (hop 2, caused by project cancel)"
            - "VisitAssignment.${asg_id}.status == RELEASED (hop 3, caused by visit cancel)"
            - "Visit.${visit_id}.assigned_crew_count == 0"

      - name: device_fault_cascades_scene_dedeploy
        grounds:
          - state_machines.Device.ONLINE_to_FAULTED
          - state_machines.SceneProgram.DEPLOYED_to_VALIDATED
          - entities.SceneProgram.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (mark-faulted, not project cancel): Device ONLINE->FAULTED
          mutates every DEPLOYED SceneProgram containing it to VALIDATED. Distinct propagation pattern (device->scene)
          from the project->visit->assignment chain.
        test_recipe:
          setup:
            - "A PROVISIONING project with a rack and one ONLINE CONTROLLER device (firmware applied)."
            - "A DEPLOYED scene whose device_ids = [that controller]."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Gus Res", email: "gus@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "7 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
              payload: { rack_units_total: 10, subnet_cidr: "10.20.0.0/24" }
              as: ProjectManager
              captures: { rack_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 2.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "C4-CTRL", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /projects/${proj_id}/start-provisioning"
              payload: {}
              as: ProjectManager
            - call: "POST /devices"
              payload: { rack_id: "${rack_id}", sku: "C4-CTRL", category: "CONTROLLER", rack_units: 2 }
              as: LowVoltageTech
              captures: { dev_id: $.data.id }
            - call: "POST /devices/${dev_id}/provision"
              payload: {}
              as: LowVoltageTech
            - call: "POST /devices/${dev_id}/firmware-updates"
              payload: { target_version: "3.4.1" }
              as: SupportEngineer
              captures: { fw_id: $.data.id }
            - call: "POST /devices/${dev_id}/firmware-updates/${fw_id}/apply"
              payload: {}
              as: SupportEngineer
            - call: "POST /devices/${dev_id}/bring-online"
              payload: {}
              as: LowVoltageTech
            - call: "POST /projects/${proj_id}/scenes"
              payload: { name: "All On", device_ids: ["${dev_id}"], action_count: 1 }
              as: SystemsDesigner
              captures: { scene_id: $.data.id }
            - call: "POST /projects/${proj_id}/scenes/${scene_id}/validate"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/scenes/${scene_id}/deploy"
              payload: {}
              as: SystemsDesigner
          trigger:
            - call: "POST /devices/${dev_id}/mark-faulted"
              payload: {}
              as: SupportEngineer
          assert:
            - "Device.${dev_id}.status == FAULTED"
            - "SceneProgram.${scene_id}.status == VALIDATED (de-deployed by the device fault)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_project_activate
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - state_machines.Project.COMMISSIONED_to_ACTIVE
        distinguishing_aspect: |
          Category pair state (priority 7, ERR_INVALID_STATE) vs business_fiscal (priority 14,
          ERR_CONTRACT_NOT_ACTIVE). Activating a project that is NOT COMMISSIONED (still ACCEPTED) AND has no
          ACTIVE contract violates both; the higher-priority state check wins -> ERR_INVALID_STATE, not
          ERR_CONTRACT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "An ACCEPTED project (not COMMISSIONED) with a PENDING (not ACTIVE) contract."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Hal Res", email: "hal@x.com", billing_tier: "RESIDENTIAL" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /projects"
              payload: { client_id: "${client_id}", site_address: "8 Oak St", region_code: "WEST" }
              as: ProjectManager
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /projects/${proj_id}/rack"
