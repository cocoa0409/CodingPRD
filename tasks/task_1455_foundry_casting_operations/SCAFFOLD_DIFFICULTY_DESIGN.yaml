  - rule_id: cross_entity_state_dependency
    instances:
      - name: slot_complete_requires_heat_tapped
        grounds:
          - state_machines.PourSlot.BOOKED_to_COMPLETED
          - state_machines.MeltHeat.CERTIFIED_to_TAPPED
          - errors[ERR_HEAT_NOT_TAPPED]
        distinguishing_aspect: |
          Entity pair PourSlot x MeltHeat: the BOOKED -> COMPLETED transition is gated on the
          heat's state. With the heat CERTIFIED (one transition short of TAPPED) completion is
          rejected; after the tap transition the identical completion call succeeds — the slot's
          own fields never change between the two attempts.
        test_recipe:
          setup:
            - "Heat CERTIFIED; mold ASSEMBLED; slot BOOKED 10:00-11:00; logical clock inside the window"
