            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
              captures: { v_after_finalize: $.data.version }
          assert:
            - "v0 == 1"
            - "v_after_finalize == v_pre_finalize + 1"

      - name: cascade_terminates_durable_poa_not_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Estate.ALIVE_to_DECEASED
          - entities.PowerOfAttorney.fields.scope
        distinguishing_aspect: |
          On register-death cascade, only NON-DURABLE POA scopes (FINANCIAL, HEALTHCARE) transition ACTIVE→TERMINATED; DURABLE_FINANCIAL and DURABLE_HEALTHCARE remain ACTIVE. Conditional cascade by scope value.
        test_recipe:
          setup:
            - "Decedent with one ACTIVE FINANCIAL and one ACTIVE DURABLE_FINANCIAL POA."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Tia T", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "NY", ssn_last4: "0026" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "Acct", appraised_value_cents: 100000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Heir T", relationship: "CHILD", share_basis_points: 10000 }
              as: EstatePlanner
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec T", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
            - call: "POST /powers-of-attorney"
              payload: { decedent_id: "${dec_id}", agent_full_name: "Agent F", scope: "FINANCIAL" }
              as: EstatePlanner
              captures: { poa_f_id: $.data.id }
            - call: "POST /powers-of-attorney/${poa_f_id}/activate"
              payload: { effective_at: "2026-01-02T00:00:00Z" }
              as: EstatePlanner
            - call: "POST /powers-of-attorney"
              payload: { decedent_id: "${dec_id}", agent_full_name: "Agent DF", scope: "DURABLE_FINANCIAL" }
              as: EstatePlanner
              captures: { poa_df_id: $.data.id }
            - call: "POST /powers-of-attorney/${poa_df_id}/activate"
              payload: { effective_at: "2026-01-02T00:00:00Z" }
              as: EstatePlanner
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
          trigger:
            - call: "POST /decedents/${dec_id}/register-death"
              payload: { date_of_death: "2026-02-01T00:00:00Z" }
              as: Registrar
            - call: "GET /powers-of-attorney/${poa_f_id}"
              payload: {}
              as: EstatePlanner
              captures: { poa_f_status: $.data.status }
            - call: "GET /powers-of-attorney/${poa_df_id}"
              payload: {}
              as: EstatePlanner
              captures: { poa_df_status: $.data.status }
          assert:
            - "poa_f_status == 'TERMINATED'"
            - "poa_df_status == 'ACTIVE'"

  # ==========================================================================
  # Consistency Model — immediate visibility
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: gross_visible_immediately_in_response_after_finalize
        claim_type: immediate
        grounds:
          - calculations.gross_estate_value
          - endpoints[POST /estates/{id}/finalize-plan]
        distinguishing_aspect: |
          Immediate consistency: the response to POST /estates/{id}/finalize-plan returns the updated gross_estate_value_cents in the same request — no second GET needed.
        test_recipe:
          setup:
            - "DRAFT estate with two DRAFT assets summing to 750000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /decedents"
              payload: { full_legal_name: "Uno U", date_of_birth: "1950-01-01T00:00:00Z", domicile_state_code: "TX", ssn_last4: "0027" }
              as: EstatePlanner
              captures: { dec_id: $.data.id }
            - call: "POST /estates"
              payload: { decedent_id: "${dec_id}" }
              as: EstatePlanner
              captures: { est_id: $.data.id }
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "BANK_ACCOUNT", description: "A", appraised_value_cents: 250000 }
              as: EstatePlanner
            - call: "POST /assets"
              payload: { estate_id: "${est_id}", category: "REAL_ESTATE", description: "B", appraised_value_cents: 500000 }
              as: EstatePlanner
            - call: "POST /beneficiary-designations"
              payload: { estate_id: "${est_id}", beneficiary_full_name: "Heir U", relationship: "CHILD", share_basis_points: 10000 }
              as: EstatePlanner
            - call: "POST /executors"
              payload: { estate_id: "${est_id}", full_legal_name: "Exec U", role_type: "EXECUTOR", is_also_beneficiary: false }
              as: EstatePlanner
              captures: { exec_id: $.data.id }
            - call: "POST /executors/${exec_id}/accept"
              payload: {}
              as: Executor
              as_user_id: "${exec_id}"
          trigger:
            - call: "POST /estates/${est_id}/finalize-plan"
              payload: {}
              as: EstatePlanner
              captures: { gross_in_response: $.data.gross_estate_value_cents, status_in_response: $.data.status }
          assert:
            - "status_in_response == 'ALIVE'"
            - "gross_in_response == 750000"
