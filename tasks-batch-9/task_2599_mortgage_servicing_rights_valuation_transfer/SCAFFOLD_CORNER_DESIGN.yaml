      - name: msr_fair_value_static_versus_shock_weighted_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.msr_fair_value.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / msr_fair_value_static_versus_oas_shock_weighted
          rationale: "Both variants are run on the same fixture there with the per-scenario values, the weighting and the sign of the delta all pinned."

      - name: msr_fair_value_applies_the_delinquency_and_loss_mit_constants
        claim_type: constants_applied
        grounds:
          - calculations.msr_fair_value.constants.DQ_COST_MULTIPLIER
          - calculations.msr_fair_value.constants.LOSS_MIT_SURCHARGE_CENTS
        excluded_because:
          difficulty_instance: combinatorial_formula / msr_fair_value_combines_delinquency_multiplier_and_loss_mit_surcharge
          rationale: "The multiplier and the surcharge are varied one at a time and then together on a heterogeneous pool there, which subsumes a constants-only recipe."

      - name: purchase_price_per_stratum_rounding_precision
        claim_type: precision
        grounds:
          - calculations.purchase_price.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / purchase_price_rounds_per_stratum_before_summation
          rationale: "The round-then-sum order and its divergence from bid_value_cents are asserted stratum by stratum there."

      - name: complaint_tier_one_upper_bound_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.complaint_concentration_release.constants.TIER_1_MAX_RATIO_PCT
        excluded_because:
          difficulty_instance: boundary_precision_check / complaint_ratio_exactly_at_tier_one_upper_bound_releases_in_full
          rationale: "The 25.00 percent edge and the one-case-more step down to tier 2 are asserted there at two-decimal resolution."

      - name: counterparty_risk_score_variant_selection
        claim_type: variant_selection
        grounds:
          - calculations.counterparty_transfer_risk_score.variants
          - endpoints[GET /msr/counterparties/{id}/risk-score]
        excluded_because:
          difficulty_instance: dual_variant_calc / counterparty_risk_score_pre_award_versus_post_transfer
          rationale: "The default PRE_AWARD selection, the explicit POST_TRANSFER variant and the penalty decomposition are all asserted there."

