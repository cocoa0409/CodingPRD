scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: availability_time_basis_vs_energy_basis_diverge_on_identical_period_data
        grounds:
          - calculations.availability_and_liquidated_damages
          - entities.ServiceAgreement.fields.availability_basis
          - entities.ServiceAgreement.fields.time_based_availability_pct
          - entities.ServiceAgreement.fields.energy_based_availability_pct
          - entities.ServiceAgreement.fields.assessed_lda_cents
          - state_machines.ServiceAgreement.ACTIVE_to_IN_SETTLEMENT
        distinguishing_aspect: |
          Two ServiceAgreements over the identical farm, period and telemetry produce identical
          time_based_availability_pct (98.3333) and identical energy_based_availability_pct
          (83.3333) yet different assessed_lda_cents (0 versus 6833350), because the TIME_BASED
          variant reads only clipped downtime intervals and the ENERGY_BASED variant reads only
          metered-versus-potential energy, and the guarantee sits between the two figures.
        test_recipe:
          setup:
            - "one farm with two ONLINE turbines, each expected_kwh_per_hour 2000"
            - "a measurement period of 2026-06-01T00:00:00Z to 2026-07-01T00:00:00Z, so period_hours is 720 and denominator_hours is 1440"
            - "turbine T-01 metered 1000000 kWh against 1440000 potential; turbine T-02 metered 1400000 against 1440000 potential"
            - "exactly one CLOSED, non-excluded fault event on T-01 spanning 2026-06-02T00:00:00Z to 2026-06-03T00:00:00Z, i.e. 24 counted downtime hours"
            - "two ACTIVE agreements on that farm, both guaranteeing 97.0 pct at 500000 cents per pct point with a 20000000 cent cap, one TIME_BASED and one ENERGY_BASED"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Ridgeline North", region_code: "TX-W", grid_operator_code: "ERCOT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 0, last_service_operating_hours: 0 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-02", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 0, last_service_operating_hours: 0 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t2_id: $.data.id }
            - call: "POST /wind-ops/fault-code-rules"
              payload: { fault_code: "FC-1000", severity_class: "RESETTABLE", max_remote_resets_per_24h: 2, requires_dispatch: false, contractual_exclusion: false }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { fcr_id: $.data.id }
            - call: "POST /wind-ops/turbines/${t1_id}/scada-sync"
              payload: { operating_hours_delta: 720, actual_energy_kwh: 1000000, potential_energy_kwh: 1440000 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/turbines/${t2_id}/scada-sync"
              payload: { operating_hours_delta: 720, actual_energy_kwh: 1400000, potential_energy_kwh: 1440000 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-02T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/turbines/${t1_id}/fault-events"
              payload: { fault_code: "FC-1000", raised_at: "2026-06-02T00:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe1_id: $.data.id }
            - call: "POST /wind-ops/fault-events/${fe1_id}/triage"
              payload: { disposition: "REMOTE_RESET" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-03T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/fault-events/${fe1_id}/remote-reset"
              payload: { reset_outcome: "SUCCEEDED" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/fault-events/${fe1_id}/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "rel-1"
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/service-agreements"
              payload: { wind_farm_id: "${farm_id}", guaranteed_availability_pct: 97.0, availability_basis: "TIME_BASED", lda_rate_cents_per_pct_point: 500000, lda_cap_cents: 20000000, period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-07-01T00:00:00Z" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { sa_time_id: $.data.id }
            - call: "POST /wind-ops/service-agreements"
              payload: { wind_farm_id: "${farm_id}", guaranteed_availability_pct: 97.0, availability_basis: "ENERGY_BASED", lda_rate_cents_per_pct_point: 500000, lda_cap_cents: 20000000, period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-07-01T00:00:00Z" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { sa_energy_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/service-agreements/${sa_time_id}/settle"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
            - call: "POST /wind-ops/service-agreements/${sa_energy_id}/settle"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
          assert:
            - "both settle calls return HTTP 200 with success true"
            - "ServiceAgreement.${sa_time_id}.time_based_availability_pct == 98.3333"
            - "ServiceAgreement.${sa_time_id}.energy_based_availability_pct == 83.3333"
            - "ServiceAgreement.${sa_time_id}.assessed_lda_cents == 0"
            - "ServiceAgreement.${sa_time_id}.state == IN_SETTLEMENT"
            - "ServiceAgreement.${sa_energy_id}.time_based_availability_pct == 98.3333"
            - "ServiceAgreement.${sa_energy_id}.energy_based_availability_pct == 83.3333"
            - "ServiceAgreement.${sa_energy_id}.assessed_lda_cents == 6833350"
            - "the two agreements differ ONLY in assessed_lda_cents, proving the basis selects the figure rather than the figures themselves differing"
      - name: landowner_royalty_metered_only_vs_deemed_inclusive_diverge_on_same_curtailment
        grounds:
          - calculations.landowner_royalty_settlement
          - entities.LandownerSettlement.fields.royalty_basis
          - entities.LandownerSettlement.fields.deemed_kwh
          - entities.LandownerSettlement.fields.royalty_cents
          - entities.CurtailmentOrder.fields.compensable
          - concurrency_rules[landowner-settlement-create-stale-farm]
        distinguishing_aspect: |
          Against one farm with 1000000 metered kWh and one RELEASED compensable GRID curtailment
          worth 43200 deemed kWh, a METERED_ONLY settlement computes royalty_cents 240000 while a
          DEEMED_INCLUSIVE settlement over the identical period computes 250368, because the
          METERED_ONLY variant forces deemed_kwh to zero rather than scaling it.
        test_recipe:
          setup:
            - "one farm with one ONLINE turbine that has metered 1000000 kWh in the period"
            - "one RELEASED CurtailmentOrder with reason GRID, therefore compensable true, spanning 2026-06-10T00:00:00Z to 2026-06-11T00:00:00Z with deemed_kwh_per_hour 1800, i.e. 43200 deemed kWh"
            - "no other settlement exists for either parcel, so no period overlap is in play"
            - "the farm's landowner_budget_cap_cents is 500000000, far above the 200000 cent minimum payment"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Caprock South", region_code: "TX-W", grid_operator_code: "ERCOT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 0, last_service_operating_hours: 0 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/turbines/${t1_id}/scada-sync"
              payload: { operating_hours_delta: 720, actual_energy_kwh: 1000000, potential_energy_kwh: 1440000 }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "GET /wind-ops/turbines/${t1_id}"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { t1_v: $.data.version }
            - call: "POST /wind-ops/turbines/${t1_id}/curtailment-orders"
              payload: { reason: "GRID", start_utc: "2026-06-10T00:00:00Z", end_utc: "2026-06-12T00:00:00Z", power_limit_kw: 1000, deemed_kwh_per_hour: 1800, expected_turbine_version: "${t1_v}" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { co_id: $.data.id }
            - call: "POST /wind-ops/curtailment-orders/${co_id}/activate"
              payload: {}
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/curtailment-orders/${co_id}/release"
              payload: { released_at: "2026-06-11T00:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { farm_v1: $.data.version }
            - call: "POST /wind-ops/farms/${farm_id}/landowner-settlements"
              payload: { parcel_code: "P-METERED", royalty_basis: "METERED_ONLY", period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-07-01T00:00:00Z", royalty_pct: 4.0, minimum_payment_cents: 200000, energy_price_cents_per_kwh: 6, road_damage_assessment_cents: 0, expected_wind_farm_version: "${farm_v1}" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { ls_metered_id: $.data.id }
            - call: "GET /wind-ops/farms/${farm_id}"
              payload: {}
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { farm_v2: $.data.version }
            - call: "POST /wind-ops/farms/${farm_id}/landowner-settlements"
              payload: { parcel_code: "P-DEEMED", royalty_basis: "DEEMED_INCLUSIVE", period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-07-01T00:00:00Z", royalty_pct: 4.0, minimum_payment_cents: 200000, energy_price_cents_per_kwh: 6, road_damage_assessment_cents: 0, expected_wind_farm_version: "${farm_v2}" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { ls_deemed_id: $.data.id }
          assert:
            - "CurtailmentOrder.${co_id}.compensable == true"
            - "CurtailmentOrder.${co_id}.curtailed_hours == 24"
            - "LandownerSettlement.${ls_metered_id}.metered_kwh == 1000000"
            - "LandownerSettlement.${ls_metered_id}.deemed_kwh == 0"
            - "LandownerSettlement.${ls_metered_id}.royalty_cents == 240000"
            - "LandownerSettlement.${ls_metered_id}.payment_cents == 240000"
            - "LandownerSettlement.${ls_deemed_id}.metered_kwh == 1000000"
            - "LandownerSettlement.${ls_deemed_id}.deemed_kwh == 43200"
            - "LandownerSettlement.${ls_deemed_id}.royalty_cents == 250368"
            - "LandownerSettlement.${ls_deemed_id}.payment_cents == 250368"
            - "both settlements are in state DRAFT and WindFarm.${farm_id}.opex_accrued_cents == 0, proving DRAFT postings stay off the ledger"
  - rule_id: combinatorial_formula
    instances:
      - name: work_order_priority_score_four_weighted_terms_with_nested_min_and_at_risk_branch
        grounds:
          - calculations.work_order_priority_score
          - entities.WorkOrder.fields.priority_score
          - entities.ServiceAgreement.fields.at_risk_flag
          - entities.BladeDamage.fields.damage_category
          - state_machines.FaultEvent.CLEARED_to_CLOSED
        distinguishing_aspect: |
          priority_score composes four independently weighted terms, two of which are nested
          min() normalisations and one of which is a conditional branch on a DIFFERENT entity's
          computed flag; the same order scores 54.00 at submit and 75.00 after an unrelated fault
          closure flips the farm agreement's at_risk_flag and three days of ageing accrue, and
          the whole sum is rounded exactly once.
        test_recipe:
          setup:
            - "one farm with one ONLINE turbine T-01 whose expected_kwh_per_hour is 2000"
            - "one PRIORITIZED BladeDamage on T-01 with damage_category 3"
            - "one SUBMITTED BLADE_REPAIR work order on T-01 with estimated_hours 4, created and submitted while the clock reads 2026-06-01T00:00:00Z"
            - "one ACTIVE TIME_BASED ServiceAgreement guaranteeing 97.0 pct over 2026-06-01T00:00:00Z to 2026-07-01T00:00:00Z, so period_hours is 720 and the denominator is 720"
            - "one CLEARED, not-yet-closed fault event on T-01 raised at 2026-06-01T00:00:00Z and cleared at 2026-06-04T09:00:00Z, i.e. 81 hours"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Mesa Verde", region_code: "NM-E", grid_operator_code: "ERCOT", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000, operating_hours: 0, last_service_operating_hours: 0 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /wind-ops/fault-code-rules"
              payload: { fault_code: "FC-1000", severity_class: "RESETTABLE", max_remote_resets_per_24h: 2, requires_dispatch: false, contractual_exclusion: false }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { fcr_id: $.data.id }
            - call: "POST /wind-ops/turbines/${t1_id}/blade-damages"
              payload: { inspection_method: "DRONE", blade_position: "A", inspected_at: "2026-05-28T10:00:00Z", damage_category: 3, damage_type: "LEADING_EDGE_EROSION", chord_position_pct: 12.5, damage_length_mm: 500, exposed_area_cm2: 400 }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
              captures: { bd_id: $.data.id }
            - call: "POST /wind-ops/blade-damages/${bd_id}/prioritize"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "rel-2"
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${t1_id}", work_type: "BLADE_REPAIR", required_certification: "BLADE_COMPOSITE", estimated_hours: 4, blade_damage_id: "${bd_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_id: $.data.id }
            - call: "POST /wind-ops/work-orders/${wo_id}/submit"
              payload: {}
              as: MaintenancePlanner
              as_user_id: "planner-1"
            - call: "POST /wind-ops/service-agreements"
              payload: { wind_farm_id: "${farm_id}", guaranteed_availability_pct: 97.0, availability_basis: "TIME_BASED", lda_rate_cents_per_pct_point: 500000, lda_cap_cents: 20000000, period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-07-01T00:00:00Z" }
              as: CommercialManager
              as_user_id: "comm-1"
              captures: { sa_id: $.data.id }
            - call: "POST /wind-ops/turbines/${t1_id}/fault-events"
              payload: { fault_code: "FC-1000", raised_at: "2026-06-01T00:00:00Z" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
              captures: { fe_id: $.data.id }
            - call: "POST /wind-ops/fault-events/${fe_id}/triage"
              payload: { disposition: "REMOTE_RESET" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-04T09:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/fault-events/${fe_id}/remote-reset"
              payload: { reset_outcome: "SUCCEEDED" }
              as: ControlRoomOperator
              as_user_id: "ops-1"
          trigger:
            - call: "POST /wind-ops/fault-events/${fe_id}/close"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "rel-1"
          assert:
            - "WorkOrder.${wo_id}.priority_score was 54.00 immediately after the submit call in setup (40*0.60 + 30*1.0 + 20*0 + 10*0)"
            - "FaultEvent.${fe_id}.downtime_hours == 81"
            - "FaultEvent.${fe_id}.lost_energy_kwh == 162000.00"
            - "Turbine.${t1_id}.counted_downtime_hours_period == 81"
            - "ServiceAgreement.${sa_id}.projected_shortfall_pct == 8.2500"
            - "ServiceAgreement.${sa_id}.at_risk_flag == true"
            - "WorkOrder.${wo_id}.priority_score == 75.00 (40*0.60 + 30*1.0 + 20*1 + 10*(3/30), summed at full precision and rounded once)"
            - "WorkOrder.${wo_id}.state == SUBMITTED, proving the re-score happened by cascade and not by a state change"
      - name: blade_damage_severity_score_rounds_each_weighted_factor_before_summing
        grounds:
          - calculations.blade_damage_severity_score
          - entities.BladeDamage.fields.severity_score
          - entities.BladeDamage.fields.repair_priority_band
          - entities.BladeDamage.fields.repair_due_days
        distinguishing_aspect: |
          The four weighted factors are each rounded to 2 decimals BEFORE being summed, so the
          score is 60.84 (24.00 + 25.50 + 4.67 + 6.67); summing at full precision and rounding
          once yields 60.83, a different observable value from the same four inputs. Two of the
          four factors are nested min() normalisations against distinct denominators.
        test_recipe:
          setup:
            - "one farm with one ONLINE turbine; no other blade findings exist"
            - "the logical clock reads 2026-06-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Mesa Verde", region_code: "NM-E", grid_operator_code: "ERCOT", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-01", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/turbines/${t1_id}/blade-damages"
              payload: { inspection_method: "ROPE_ACCESS", blade_position: "B", inspected_at: "2026-05-30T09:00:00Z", damage_category: 4, damage_type: "DELAMINATION", chord_position_pct: 30.0, damage_length_mm: 700, exposed_area_cm2: 1000 }
              as: ReliabilityEngineer
              as_user_id: "rel-1"
              captures: { bd_id: $.data.id }
          assert:
            - "BladeDamage.${bd_id}.severity_score == 60.84"
            - "BladeDamage.${bd_id}.repair_priority_band == HIGH"
            - "BladeDamage.${bd_id}.repair_due_days == 45"
            - "BladeDamage.${bd_id}.severity_score != 60.83, the value a sum-then-round implementation would produce"
            - "BladeDamage.${bd_id}.state == OPEN and recorded_by_user_id == \"rel-1\""
      - name: crane_cost_tier_keyed_on_subtotal_then_waterfall_allocated_by_created_at
        grounds:
          - calculations.crane_cost_and_allocation
          - entities.CraneMobilization.fields.subtotal_cents
