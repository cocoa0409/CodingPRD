      - name: group_block_gates_cover_closure_extension_limit_and_exhaustion
        claim_type: triggerable
        grounds:
          - errors[ERR_GROUP_BLOCK_CLOSED]
          - errors[ERR_MAX_REVIEW_EXTENSIONS_EXCEEDED]
          - errors[ERR_GROUP_BLOCK_EXHAUSTED]
          - validations[priority=19]
          - state_machines.GroupBlock
        distinguishing_aspect: |
          Three refusals with three different causes on the same entity: a block signed DEFINITE has
          left the review lifecycle entirely, so both review verbs answer with the closure conflict;
          the extension cycle is bounded at two so the third push is a capacity error rather than a
          state one; and a booking that draws on a fully picked-up fence is refused even though the
          allotment itself still has free cabins - a group booking is never waitlisted.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing GBK-2701 (nights 4, total_lower_berths 40, embark 2027-01-10T17:00:00Z) is OPEN_FOR_SALE with an IA allotment of 10 physical cabins / allowance 0 and a 730..0 fare window at base 50000."
            - "Block ALPHA holds 2 cabins with review_date 2026-08-16 and is signed DEFINITE by a second agent so the segregation-of-duties rule is satisfied."
            - "Block BETA holds 2 cabins with review_date 2026-08-10 and stays TENTATIVE."
            - "Three guests exist so three group bookings can be attempted against ALPHA's two-cabin fence."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "GBK-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 40, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_gb: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_gb}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_gb: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_gb}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_gb}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_gb}", cabin_category_id: "${cat_ia}", agency_name: "Alpha Travel", cabins_held: 2, review_date: "2026-08-16T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_alpha: $.data.id }
            - call: "POST /group-blocks/${blk_alpha}/confirm-definite"
              payload: { contract_reference: "CTR-ALPHA-1" }
              as: GroupSalesAgent
              as_user_id: "gsa-002"
              captures: { av1: $.data.version }
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_gb}", cabin_category_id: "${cat_ia}", agency_name: "Beta Tours", cabins_held: 2, review_date: "2026-08-10T00:00:00Z", release_policy: "FULL_RELEASE" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_beta: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ada Ames", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_ada: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
