              payload: { store_number: "I1", name: "Inv Store 1", address: "26 Oak", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_1: "$.data.id" }
            - call: "POST /retail-reset/stores"
              payload: { store_number: "I2", name: "Inv Store 2", address: "27 Oak", timezone: "America/Chicago" }
              as: ProjectManager
              captures: { store_2: "$.data.id" }
            - call: "POST /retail-reset/projects"
              payload: { client_id: "${client_id}", title: "Inv Proj", scope_type: "AUDIT" }
              as: ProjectManager
              captures: { project_id: "$.data.id", project_ver: "$.data.version" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_1}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_1: "$.data.id" }
            - call: "POST /retail-reset/project-stores"
              payload: { project_id: "${project_id}", store_id: "${store_2}", due_date: "2026-08-20" }
              as: ProjectManager
              captures: { ps_2: "$.data.id" }
            - call: "POST /retail-reset/projects/${project_id}/scope"
              payload: { expected_project_version: "${project_ver} + 2" }
              as: ProjectManager
            - call: "POST /retail-reset/assignments"
              payload: { project_id: "${project_id}", project_store_id: "${ps_1}", rep_id: "${rep_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }
              as: ProjectManager
              captures: { asg_id: "$.data.id" }
          trigger:
            - call: "POST /retail-reset/assignments/${asg_id}/cancel"
              payload: {}
              as: ProjectManager
            - call: "POST /retail-reset/project-stores/${ps_1}/drop"
