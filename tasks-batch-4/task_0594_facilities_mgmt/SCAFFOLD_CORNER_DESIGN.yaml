            - call: "POST /fm/buildings/${b1}/spaces"
              payload: { space_code: "Z1", floor: 1, area_sqm: 200, space_type: "COMMON" }
              as: FacilityManager
              captures: { z1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "CleanCo", trade: "JANITORIAL", hourly_rate: 40.00, sla_response_minutes: 120, sla_resolve_minutes: 480 }
              as: FacilityManager
              captures: { v1: $.data.id }
            - call: "POST /fm/vendors"
              payload: { name: "OtherCo", trade: "JANITORIAL", hourly_rate: 45.00, sla_response_minutes: 120, sla_resolve_minutes: 480 }
              as: FacilityManager
              captures: { v2: $.data.id }
            - call: "POST /fm/soft-service-shifts"
              payload: { building_id: "${b1}", vendor_id: "${v1}", zone_space_id: "${z1}", service_type: "JANITORIAL", start_at: "2026-05-06T08:00:00Z", end_at: "2026-05-06T16:00:00Z", planned_headcount: 3 }
              as: FacilityManager
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /fm/soft-service-shifts/${sh1}/complete"
              payload: { actual_headcount: 3 }
              as: VendorTech
              as_user_id: "${v2}"
              captures: { err_id: $.data.error_id }
            - call: "POST /fm/soft-service-shifts/${sh1}/complete"
              payload: { actual_headcount: 2 }
              as: VendorTech
              as_user_id: "${v1}"
          assert:
            - "the v2 call returns 403 with ${err_id} == ERR_NOT_RESOURCE_OWNER and SoftServiceShift.${sh1}.status stays SCHEDULED"
            - "the v1 call returns 200, SoftServiceShift.${sh1}.status == COMPLETED and actual_headcount == 2"

