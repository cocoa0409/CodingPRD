      - name: variant_divergence_rule_of_78_versus_actuarial_payoff_on_identical_notes
        claim_type: variant_divergence
        grounds:
          - calculations.unearned_finance_charge_rebate.variants
          - entities.StateRateRule.fields.rebate_method
          - endpoints.GET_agreements_agreement_id_payoff_quote
        distinguishing_aspect: |
          Two notes are built byte-for-byte identically — same premium, same down payment, same term,
          same two paid installments — and differ ONLY in their state's rebate_method. The Rule-of-78s
          curve rebates 17929 while the actuarial method rebates the 25100 of finance charge actually
          sitting on the four unpaid installments, so the same account has two legal payoff figures
          341839 and 334668, a delta of exactly 7171. The delta is the whole point: a single-formula
          implementation, or one that silently uses the actuarial sum for both, produces identical
          quotes and is caught by the inequality rather than by either value alone.
