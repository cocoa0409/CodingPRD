# =============================================================================
# §1.8 Scaffold Difficulty Design — Cement Plant & Kiln Operations (task 2971)
# =============================================================================
# One block per §0.5 rule_id, each with >= 2 concrete instances grounded in
# SCAFFOLD.yaml §1.1-§1.7. Every instance states:
#   grounds               — the scaffold elements that make the rule real here
#   distinguishing_aspect — the falsifiable thing a naive implementation gets
#                           wrong, phrased as the wrong value / wrong error it
#                           would produce
#   test_recipe           — setup prose, an ordered setup_api_calls chain, the
#                           trigger call, and literal assertions
# Conventions used by every recipe:
#   * The logical clock starts at 2026-08-01T00:00:00Z and is moved only by
#     POST /cement-ops/_clock/set_current_utc.
#   * X-User-ID values are written into the setup prose (ENG1/ENG2, QM1/QM2,
#     LAB1, EO1, OPS1, ADMIN1) because three controls are segregation-of-duties
#     checks on X-User-ID rather than on role.
#   * `${var}` placeholders are captured from earlier responses; every
#     expected_*_version is captured, never hardcoded.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: raw_mix_modules_diverge_between_design_basis_and_pile_basis
        grounds: >
          calculations.raw_mix_chemical_modules declares variants as_designed (weighted by the
          design's DRY mass fractions) and as_blended (weighted by each addition's DRY tonnage,
          derived from its own as-received tonnage and moisture). RawMixDesign carries
          as_designed_lsf/sm/am and BlendedPile carries as_blended_lsf/sm/am plus lsf_deviation,
          so both variants are persisted side by side on two different entities.
        distinguishing_aspect: >
          A single-variant implementation reuses the design's mass fractions for the pile and
          reports as_blended_lsf == as_designed_lsf == 96.94 with lsf_deviation 0.06. The correct
          answer is as_blended_lsf 104.82 and lsf_deviation 7.82, because the 12%-moisture clay
          contributes far less dry mass than its as-received tonnage suggests. An implementation
          that weights the pile by as-received tonnes instead of dry tonnes gets a third, also
          wrong, answer.
        test_recipe:
          setup: >
            One plant, three raw materials with sharply different moistures, design D1 with
            components 80.00/16.00/4.00 authored by ENG1 and approved by QM1, and one pile fed the
            same 80/16/4 ratio on an AS-RECEIVED basis.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "IR-1", category: "IRON_ORE", cao_pct: 1.0, sio2_pct: 8.0, al2o3_pct: 2.0, fe2o3_pct: 80.0, so3_pct: 0.05, moisture_pct: 5.0, cost_per_tonne: 40.00 }, captures: { ir: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D1", target_lsf: 97.00, target_sm: 1.50, target_am: 0.80, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 80.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 16.00 }, { raw_material_id: "${ir}", mass_fraction_pct: 4.00 }] }, captures: { d1: "$.data.id", designed_lsf: "$.data.as_designed_lsf" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d1}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d1}/approve", as: QualityManager, payload: {}, captures: { d1_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d1}", pile_code: "PL1", expected_raw_mix_design_version: "${d1_v}" }, captures: { pl1: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pl1}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 800.00, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pl1}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 160.00, moisture_pct: 12.0 } }
          trigger:
            - { call: "POST /cement-ops/blended-piles/${pl1}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ir}", tonnes_as_received: 40.00, moisture_pct: 5.0 }, captures: { blended_lsf: "$.data.as_blended_lsf" } }
          assert:
            - "the design captured as_designed_lsf 96.94, as_designed_sm 1.50, as_designed_am 0.80 with as_designed oxides 41.8000 / 12.7200 / 3.7600 / 4.7200"
            - "the pile response has as_received_tonnes 1000.00 and dry_tonnes 962.80 (784.00 + 140.80 + 38.00)"
            - "the pile response has as_blended_cao_pct 42.5289, as_blended_sio2_pct 11.9402, as_blended_al2o3_pct 3.5256, as_blended_fe2o3_pct 4.5883"
            - "the pile response has as_blended_lsf 104.82, as_blended_sm 1.47, as_blended_am 0.77"
            - "lsf_deviation == 7.82 (|104.82 - 97.00|), which is > the default pile_lsf_tolerance 2.00, so a later seal on this pile must fail with ERR_PILE_LSF_OFF_TARGET"
            - "the two variants differ by 7.88 LSF points on identical input data"

      - name: per_run_nox_intensity_breaches_while_rolling_window_variant_permits_release
        grounds: >
          calculations.nox_emission_intensity declares variants per_run_actual (one run) and
          plant_rolling_window (all COMPLETED runs whose window_end lies in the last 30 days).
          KilnRun.nox_intensity_breach records the per-run verdict; validation priority 76 gates
          release-clinker on the rolling variant only.
        distinguishing_aspect: >
          An implementation that gates release on the per-run figure refuses this release with
          ERR_PERMIT_NOX_INTENSITY_EXCEEDED, because R1's own intensity is 1.295 against a cap of
          1.20. The correct behaviour is a 200 with quality_state RELEASED, because the rolling
          variant over the gas-fired R0 plus the coal-fired R1 is 0.833. The flag and the gate must
          disagree on the same run.
        test_recipe:
          setup: >
            Plant with cap 1.20, kiln K1 (nominal_shc 3.60), one CLINKER silo, two fuels (clean
            natural gas and dirty coal), two designs/piles so each run has its own sealed pile, and
            two consecutive firing windows. R0 burns gas, R1 burns coal, both complete.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "GAS-1", category: "NATURAL_GAS", lhv_gj_per_tonne: 48.00, nox_kg_per_gj: 0.10, co2_kg_per_gj: 56.0, chlorine_pct: 0.00 }, captures: { gas: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "COAL-1", category: "COAL", lhv_gj_per_tonne: 27.00, nox_kg_per_gj: 0.35, co2_kg_per_gj: 96.0, chlorine_pct: 0.02 }, captures: { coal: "$.data.id" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "GET /cement-ops/raw-mix-designs/${d2}", as: ProcessEngineer, payload: {}, captures: { d2_v2: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PB", expected_raw_mix_design_version: "${d2_v2}" }, captures: { pb: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pb}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 836.73, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pb}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 204.55, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pb}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T12:00:00Z" }, captures: { r0: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pb}", clinker_silo_id: "${sc1}", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }, captures: { r1: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r0}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${gas}", tonnes: 45.00 }, captures: { r0_intensity: "$.data.nox_intensity_kg_per_tonne" } }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-01T12:00:00Z" } }
            - { call: "POST /cement-ops/kiln-runs/${r0}/complete", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-02T00:00:00Z" } }
            - { call: "POST /cement-ops/kiln-runs/${r1}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r1}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 80.00 }, captures: { r1_intensity: "$.data.nox_intensity_kg_per_tonne", r1_breach: "$.data.nox_intensity_breach" } }
            - { call: "POST /cement-ops/_clock/set_current_utc", as: PlantAdmin, payload: { to_iso8601: "2026-08-03T00:00:00Z" } }
            - { call: "POST /cement-ops/kiln-runs/${r1}/complete", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/lab-tests", as: LabTechnician, payload: { test_type: "FREE_LIME", value: 1.20, kiln_run_id: "${r1}" } }
            - { call: "GET /cement-ops/plants/${plant}", as: QualityManager, payload: {}, captures: { rolling: "$.data.rolling_nox_intensity_kg_per_tonne" } }
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r1}/release-clinker", as: QualityManager, payload: {} }
          assert:
            - "R0: gross_energy_gj 2160.00, clinker_tonnes 583.78, nox_emitted_kg 216.00, nox_intensity_kg_per_tonne 0.370, nox_intensity_breach false"
            - "R1: gross_energy_gj 2160.00, clinker_tonnes 583.78, nox_emitted_kg 756.00, nox_intensity_kg_per_tonne 1.295, nox_intensity_breach true"
            - "Plant.rolling_nox_intensity_kg_per_tonne == 0.833 (972.00 / 1167.56)"
            - "the trigger returns 200 with quality_state RELEASED and process_state COMPLETED"
            - "the clinker silo now shows tonnes_on_hand 1167.56, unreleased_tonnes 583.78 (R0 is still PENDING_LAB), available_tonnes 583.78"
            - "aborting R0 before the release instead would leave the rolling variant at 1.295 and the same trigger would return ERR_PERMIT_NOX_INTENSITY_EXCEEDED (422)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: tsr_ceiling_is_a_nested_min_over_permit_and_every_charged_fuel_authorization
        grounds: >
          calculations.thermal_substitution_rate computes the ceiling as
          min(Plant.permit_max_tsr_pct, min over each distinct alternative fuel charged of that
          fuel's AUTHORIZED, unexpired BurnTest.authorized_max_tsr_pct). Three independent inputs
          (permit, RDF authorization, TDF authorization) combine, and the set the inner min runs
          over changes as fuels are charged.
        distinguishing_aspect: >
          An implementation that checks only the plant permit accepts the TDF charge (25.69 <=
          35.00). One that checks only the first alternative fuel's authorization also accepts it
          (25.69 would be compared against RDF's 25.00 -> refused for the wrong reason, or against
          TDF alone). The correct ceiling after the TDF charge is min(35.00, 25.00, 10.00) = 10.00,
          so the charge is refused with ERR_TSR_CAP_EXCEEDED even though the same run was legal one
          call earlier at exactly 25.00.
        test_recipe:
          setup: >
            Plant permit_max_tsr_pct 35.00. Two alternative fuels are burn-tested: RDF-1 authorized
            to 25.00 and TDF-1 authorized to 10.00, both recorded by LAB1 and adjudicated by EO1.
            One kiln, one silo, one sealed pile, one lit run. Coal 90.00 t then RDF 45.00 t bring
            the run to exactly the 25.00 ceiling.
          setup_api_calls:
            - { call: "POST /cement-ops/plants", as: PlantAdmin, payload: { name: "Ash Grove West", region_code: "US-MW", permit_nox_kg_per_tonne_clinker_cap: 1.20, permit_annual_nox_budget_kg: 2000000, permit_max_tsr_pct: 35.00, permit_max_chlorine_kg_per_run: 500.00, peak_season_months: [5, 6, 7, 8, 9], clinker_free_lime_max_pct: 1.50 }, captures: { plant: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "LS-1", category: "LIMESTONE", cao_pct: 52.0, sio2_pct: 3.5, al2o3_pct: 1.0, fe2o3_pct: 0.5, so3_pct: 0.05, moisture_pct: 2.0, cost_per_tonne: 8.00 }, captures: { ls: "$.data.id" } }
            - { call: "POST /cement-ops/raw-materials", as: ProcessEngineer, payload: { code: "CL-1", category: "CLAY", cao_pct: 1.0, sio2_pct: 60.0, al2o3_pct: 18.0, fe2o3_pct: 7.0, so3_pct: 0.10, moisture_pct: 12.0, cost_per_tonne: 12.00 }, captures: { cl: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "COAL-1", category: "COAL", lhv_gj_per_tonne: 27.00, nox_kg_per_gj: 0.35, co2_kg_per_gj: 96.0, chlorine_pct: 0.02 }, captures: { coal: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "RDF-1", category: "RDF", lhv_gj_per_tonne: 18.00, nox_kg_per_gj: 0.22, co2_kg_per_gj: 40.0, chlorine_pct: 0.80, is_alternative: true }, captures: { rdf: "$.data.id" } }
            - { call: "POST /cement-ops/fuels", as: EnvironmentalOfficer, payload: { code: "TDF-1", category: "TDF", lhv_gj_per_tonne: 30.00, nox_kg_per_gj: 0.18, co2_kg_per_gj: 85.0, chlorine_pct: 0.10, is_alternative: true }, captures: { tdf: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests", as: EnvironmentalOfficer, payload: { plant_id: "${plant}", fuel_id: "${rdf}", requested_max_tsr_pct: 25.00, valid_days: 30 }, captures: { bt_rdf: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt_rdf}/start", as: LabTechnician, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt_rdf}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.80, measured_nox_kg_per_gj: 0.22, stack_compliant: true } }
            - { call: "POST /cement-ops/burn-tests/${bt_rdf}/adjudicate", as: EnvironmentalOfficer, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 25.00, decision_reason: "stack test passed" } }
            - { call: "POST /cement-ops/burn-tests", as: EnvironmentalOfficer, payload: { plant_id: "${plant}", fuel_id: "${tdf}", requested_max_tsr_pct: 20.00, valid_days: 30 }, captures: { bt_tdf: "$.data.id" } }
            - { call: "POST /cement-ops/burn-tests/${bt_tdf}/start", as: LabTechnician, payload: {} }
            - { call: "POST /cement-ops/burn-tests/${bt_tdf}/record-result", as: LabTechnician, payload: { measured_chlorine_pct: 0.10, measured_nox_kg_per_gj: 0.18, stack_compliant: true } }
            - { call: "POST /cement-ops/burn-tests/${bt_tdf}/adjudicate", as: EnvironmentalOfficer, payload: { decision: "AUTHORIZED", authorized_max_tsr_pct: 10.00, decision_reason: "wire content limits substitution" } }
            - { call: "POST /cement-ops/kilns", as: PlantAdmin, payload: { plant_id: "${plant}", code: "K1", nominal_shc_gj_per_tonne: 3.60, cooldown_buffer_hours: 12, reline_due_hours: 4000 }, captures: { k1: "$.data.id" } }
            - { call: "POST /cement-ops/silos", as: PlantAdmin, payload: { plant_id: "${plant}", code: "SC1", material_kind: "CLINKER", capacity_tonnes: 20000.00, draw_rate_tonnes_per_hour: 300.00 }, captures: { sc1: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs", as: ProcessEngineer, payload: { plant_id: "${plant}", code: "D2", target_lsf: 97.00, target_sm: 2.40, target_am: 2.45, components: [{ raw_material_id: "${ls}", mass_fraction_pct: 82.00 }, { raw_material_id: "${cl}", mass_fraction_pct: 18.00 }] }, captures: { d2: "$.data.id" } }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/submit", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/raw-mix-designs/${d2}/approve", as: QualityManager, payload: {}, captures: { d2_v: "$.data.version" } }
            - { call: "POST /cement-ops/blended-piles", as: ProcessEngineer, payload: { plant_id: "${plant}", raw_mix_design_id: "${d2}", pile_code: "PA", expected_raw_mix_design_version: "${d2_v}" }, captures: { pa: "$.data.id" } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${ls}", tonnes_as_received: 2510.19, moisture_pct: 2.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/additions", as: ProcessEngineer, payload: { raw_material_id: "${cl}", tonnes_as_received: 613.65, moisture_pct: 12.0 } }
            - { call: "POST /cement-ops/blended-piles/${pa}/seal", as: ProcessEngineer, payload: {} }
            - { call: "POST /cement-ops/kiln-runs", as: KilnOperator, payload: { kiln_id: "${k1}", blended_pile_id: "${pa}", clinker_silo_id: "${sc1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }, captures: { r1: "$.data.id" } }
            - { call: "POST /cement-ops/kiln-runs/${r1}/light", as: KilnOperator, payload: {} }
            - { call: "POST /cement-ops/kiln-runs/${r1}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${coal}", tonnes: 90.00 } }
            - { call: "POST /cement-ops/kiln-runs/${r1}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${rdf}", tonnes: 45.00 }, captures: { tsr_before: "$.data.tsr_pct" } }
          trigger:
            - { call: "POST /cement-ops/kiln-runs/${r1}/fuel-charges", as: KilnOperator, payload: { fuel_id: "${tdf}", tonnes: 1.00 } }
          assert:
            - "after the RDF charge the run shows gross_energy_gj 3240.00 and tsr_pct exactly 25.00, accepted because equality with the ceiling is allowed"
            - "the trigger returns 422 with error_id ERR_TSR_CAP_EXCEEDED"
            - "the refused arithmetic: gross would be 3270.00, alt 840.00, tsr_pct 25.69, ceiling min(35.00, 25.00, 10.00) = 10.00"
            - "the run is unchanged after the refusal: fuel_charges still has 2 entries, gross_energy_gj 3240.00, tsr_pct 25.00, nox_emitted_kg 1028.70, chlorine_input_kg 378.00"
            - "charging TDF-1 alone on a fresh run up to 10.00 would be accepted, proving the refusal comes from the combination and not from TDF being unauthorized"

      - name: cement_tonnage_uses_round_then_sum_not_sum_then_round
        grounds: >
          calculations.cement_additive_proportioning defines total_batch_tonnes as an intermediate,
          rounds gypsum_tonnes and limestone_tonnes to 2 decimals, and then defines cement_tonnes
          as the sum of the ROUNDED components. so3_pct is then computed from those same rounded
          tonnages over the summed cement_tonnes — four inputs (clinker, two additive shares, three
          SO3 constants) combining through a mandated rounding order.
        distinguishing_aspect: >
          A sum-then-round implementation reports cement_tonnes 574.71 (it reuses
          total_batch_tonnes), which then silently caps certification at 574.71 t and makes a
          574.72 t mill certificate fail with ERR_CERTIFIED_TONNES_EXCEED_BATCH. The correct
          cement_tonnes is 574.72 while total_batch_tonnes stays 574.71 — the two differ by design.
        test_recipe:
          setup: >
            Plant, clinker and cement silos, and 583.78 t of RELEASED clinker in SC1 (one gas-fired
            run completed and released). The batch draws 500.00 t of clinker as TYPE_IL with 5.00%
            gypsum and 8.00% interground limestone.
