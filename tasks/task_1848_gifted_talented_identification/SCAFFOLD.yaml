# =============================================================================
# Task 1848 — Gifted & Talented Identification (district gifted services office)
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  1848. Gifted & Talented Identification (district gifted services office): universal screening & referral pathways, multi-criteria matrix & cut-score determination, portfolio/appeals review committee, service model placement (pull-out/cluster/acceleration), annual re-evaluation & exit criteria, twice-exceptional coordination with special education, transfer student identification honoring, disproportionality monitoring & reporting

domain_name: gifted-talented-identification
api_prefix: /gifted

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: Multi-party negotiation      # portfolio/appeals committee quorum decisions
  secondary_archetype: Compliance / audit         # disproportionality monitoring, honoring windows, exit criteria
  complexity_layers:
    - rate_threshold_triggers        # cut-score bands, quorum thresholds, risk-ratio flag threshold
    - cascading_side_effects         # decide -> case -> student; exit -> placement -> occupancy -> promotion
    - derived_field_reconciliation   # composite_score, site occupancy counters, student.gifted_status
    - scheduled_actions              # logical clock drives re-eval activation and offer expiry

  entity_topology: flat              # peer entities joined by FK references; no nested ownership tree
  state_machine_shape: cyclic        # GiftedCase appeal loop; ServicePlacement OFFERED<->WAITLISTED loop
  relationship_patterns:
    - one_to_many                    # cycle -> cases -> measure scores / reviews; placement -> re-evaluations
    - many_to_many                   # CommitteeVote junction: CommitteeReview x CommitteeMember(X-User-ID)
    - cross_aggregate                # SpedPlan (special-ed aggregate) alters GiftedCase scoring variant
  role_model: approval_chain         # Referrer -> GiftedCoordinator (scoring) -> Committee (decision) -> Coordinator (placement)
  consistency_model: immediate       # all mutations atomic within the request; derived fields refreshed synchronously

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# All date fields are "YYYY-MM-DD" strings interpreted against the logical
# clock (POST /gifted/_clock/set_current_utc). "today" == clock date (UTC).
# =============================================================================
entities:
  - name: SchoolSite
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "School site name" }
      - { name: code, type: string, source: input, description: "District-unique site code", constraints: "unique across SchoolSite" }
      - { name: pull_out_capacity, type: integer, source: input, description: "Seat cap for PULL_OUT service model", constraints: ">= 0" }
      - { name: cluster_capacity, type: integer, source: input, description: "Seat cap for CLUSTER service model", constraints: ">= 0" }
      - { name: acceleration_capacity, type: integer, source: input, description: "Seat cap for ACCELERATION service model", constraints: ">= 0" }
      - { name: pull_out_occupied, type: integer, source: computed, description: "Placements at this site, model PULL_OUT, status ACTIVE" }
      - { name: cluster_occupied, type: integer, source: computed, description: "Placements at this site, model CLUSTER, status ACTIVE" }
      - { name: acceleration_occupied, type: integer, source: computed, description: "Placements at this site, model ACCELERATION, status ACTIVE" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: student_number, type: string, source: input, description: "District-unique student number", constraints: "unique across Student" }
      - { name: legal_name, type: string, source: input, description: "Student legal name" }
      - { name: grade_level, type: integer, source: input, description: "Grade level, 0 (K) through 12", constraints: "0 <= grade_level <= 12" }
      - { name: school_site_id, type: string, source: input, description: "FK -> SchoolSite.id; enrollment site" }
      - { name: demographic_group, type: enum, source: input, description: "Federal reporting group for disproportionality monitoring", constraints: "AMERICAN_INDIAN | ASIAN | BLACK | HISPANIC | WHITE | MULTIRACIAL | PACIFIC_ISLANDER" }
      - { name: is_ell, type: boolean, source: input, default: false, description: "English-learner flag" }
      - { name: primary_guardian_user_id, type: string, source: input, description: "Opaque X-User-ID of the guardian authorized for appeals/placement decisions" }
      - { name: gifted_status, type: enum, source: system, default: NOT_IDENTIFIED, description: "NOT_IDENTIFIED | IDENTIFIED | EXITED; flipped by case decisions and placement exits" }
      - { name: has_active_sped_plan, type: boolean, source: computed, default: false, description: "True when any SpedPlan record exists for this student (twice-exceptional coordination)" }

  - name: SpedPlan
    parent: null
    common_fields: false
    fields:
      - { name: student_id, type: string, source: system, description: "FK -> Student.id; taken from path" }
      - { name: plan_type, type: enum, source: input, description: "IEP | PLAN_504" }
      - { name: started_on, type: string, source: input, description: "Plan start date (YYYY-MM-DD)" }
      # At most one SpedPlan per student (ERR_DUPLICATE_SPED_PLAN). Immutable record.

  - name: ScreeningCycle
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Cycle name, e.g. 'Fall 2026 Elementary Sweep'" }
      - { name: school_year, type: string, source: input, description: "School year label, e.g. '2026-2027'" }
      - { name: grade_band, type: enum, source: input, description: "ELEMENTARY (grades 0-5) | MIDDLE (6-8) | HIGH (9-12)" }
      - { name: screening_open_on, type: string, source: input, description: "Screening window start date (inclusive); half-open window start" }
      - { name: screening_close_on, type: string, source: input, description: "Screening window end date (exclusive); must be > screening_open_on" }
      - { name: referral_close_on, type: string, source: input, description: "Last date on which REFERRAL-pathway cases are accepted; must be <= screening_close_on" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | SCORING | REVIEW | FINALIZED" }
      - { name: published_profile_id, type: string, source: computed, description: "id of the currently PUBLISHED CutScoreProfile row of this cycle (denormalized pointer set by publish; null until first publish)" }

  - name: CutScoreProfile
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> ScreeningCycle.id; taken from path" }
      - { name: label, type: string, source: input, description: "Profile label" }
      - { name: ability_weight, type: number, source: input, description: "Weight for ABILITY measure; the four weights must sum to 1.0 (tolerance 0.0001)" }
      - { name: achievement_weight, type: number, source: input, description: "Weight for ACHIEVEMENT measure" }
      - { name: rating_weight, type: number, source: input, description: "Weight for RATING_SCALE measure" }
      - { name: portfolio_weight, type: number, source: input, description: "Weight for PORTFOLIO measure" }
      - { name: cut_score, type: integer, source: input, description: "Standard identification cut (composite >= cut_score => IDENTIFIED)", constraints: "0..100" }
      - { name: review_band_floor, type: integer, source: input, description: "Standard committee-review band floor; must be < cut_score" }
      - { name: cut_score_2e, type: integer, source: input, description: "Twice-exceptional cut; must be <= cut_score" }
      - { name: review_band_floor_2e, type: integer, source: input, description: "Twice-exceptional review floor; must be < cut_score_2e" }
      - { name: measure_validity_days, type: integer, source: input, default: 730, description: "A measure is stale when administered_on < today - measure_validity_days" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | SUPERSEDED" }

  - name: GiftedCase
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: cycle_id, type: string, source: input, description: "FK -> ScreeningCycle.id" }
      - { name: pathway, type: enum, source: input, description: "UNIVERSAL_SCREEN | REFERRAL | TRANSFER_HONOR" }
      - { name: referral_source, type: enum, source: input, description: "TEACHER | PARENT | SELF; required iff pathway == REFERRAL, forbidden otherwise" }
      - { name: referrer_user_id, type: string, source: system, description: "X-User-ID of creator when pathway == REFERRAL (drives committee conflict-of-interest); null otherwise" }
      - { name: external_district_name, type: string, source: input, description: "Prior district name; required iff pathway == TRANSFER_HONOR" }
      - { name: external_identified_on, type: string, source: input, description: "Date of external gifted identification; required iff TRANSFER_HONOR; must be within 730 days of today" }
      - { name: status, type: enum, source: system, default: SCREENING, description: "SCREENING | AWAITING_COMMITTEE | APPEAL_PENDING | IDENTIFIED | NOT_IDENTIFIED" }
      - { name: composite_score, type: number, source: computed, description: "Integer composite from calculations.composite_score; null until finalize-scoring" }
      - { name: scored_variant, type: enum, source: computed, description: "STANDARD | TWICE_EXCEPTIONAL; null until finalize-scoring" }
      - { name: appeal_used, type: boolean, source: system, default: false, description: "Set true when an APPEAL review is opened; a case gets at most one appeal" }
      - { name: decided_on, type: string, source: system, description: "Date the case entered IDENTIFIED or NOT_IDENTIFIED; null while undecided" }

  - name: MeasureScore
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> GiftedCase.id; taken from path" }
      - { name: measure_type, type: enum, source: input, description: "ABILITY | ACHIEVEMENT | RATING_SCALE | PORTFOLIO; one score per type per case" }
      - { name: percentile, type: number, source: input, description: "Norm-referenced percentile, 1.0..99.9, one decimal place" }
      - { name: administered_on, type: string, source: input, description: "Administration date; must be <= today and within measure_validity_days at finalize" }
      - { name: weighted_contribution, type: number, source: computed, description: "round_half_up(effective_percentile * normalized_weight, 2); null until finalize-scoring" }

  - name: CommitteeReview
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> GiftedCase.id; taken from path" }
      - { name: review_kind, type: enum, source: input, description: "BAND_REVIEW (GiftedCoordinator only) | APPEAL (ParentGuardian/ReferringEducator only)" }
      - { name: grounds, type: string, source: input, description: "Free-text rationale (appeal grounds or portfolio summary)", default: null }
      - { name: status, type: enum, source: system, default: VOTING, description: "VOTING | DECIDED" }
      - { name: outcome, type: enum, source: system, description: "QUALIFY | DENY; null until DECIDED" }
      - { name: decided_on, type: string, source: system, description: "Decision date; null until DECIDED" }
      - { name: qualify_votes, type: integer, source: computed, description: "Count of CommitteeVote rows with verdict QUALIFY" }
      - { name: deny_votes, type: integer, source: computed, description: "Count of CommitteeVote rows with verdict DENY" }
      - { name: abstain_votes, type: integer, source: computed, description: "Count of CommitteeVote rows with verdict ABSTAIN" }

  - name: CommitteeVote
    parent: null
    common_fields: false
    fields:
      - { name: review_id, type: string, source: system, description: "FK -> CommitteeReview.id; taken from path" }
      - { name: member_user_id, type: string, source: system, description: "X-User-ID of the casting CommitteeMember; one vote per member per review" }
      - { name: verdict, type: enum, source: input, description: "QUALIFY | DENY | ABSTAIN" }

  - name: ServicePlacement
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> GiftedCase.id; taken from path" }
      - { name: student_id, type: string, source: computed, description: "Denormalized copy of GiftedCase.student_id at creation; drives the per-student period-overlap rule" }
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id; service delivery site" }
      - { name: service_model, type: enum, source: input, description: "PULL_OUT | CLUSTER | ACCELERATION" }
      - { name: start_on, type: string, source: input, description: "Service period start date" }
      - { name: end_on, type: string, source: system, description: "Service period end date; set on EXITED; null while open-ended (OFFERED/WAITLISTED/ACTIVE)" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "OFFERED | ACTIVE | WAITLISTED | DECLINED | EXPIRED | EXITED" }
      - { name: offered_on, type: string, source: system, description: "Date the offer entered OFFERED (creation or promotion)" }
      - { name: accept_by, type: string, source: system, description: "offered_on + 30 days; accept allowed while today <= accept_by" }
      - { name: waitlisted_at, type: datetime, source: system, description: "Timestamp of entry into WAITLISTED; null unless WAITLISTED; promotion orders by waitlisted_at ASC, tie-break created_at ASC" }
      - { name: is_on_probation, type: boolean, source: system, default: false, description: "Set true when a re-evaluation concludes PROBATION; a second consecutive PROBATION concludes EXITED" }

  - name: ReEvaluation
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: system, description: "FK -> ServicePlacement.id; taken from path" }
      - { name: due_on, type: string, source: input, description: "Annual review due date; system moves SCHEDULED -> IN_REVIEW when today >= due_on" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_REVIEW | CONCLUDED" }
      - { name: growth_percentile, type: number, source: input, description: "Growth percentile 0.0..100.0 (one decimal); supplied at conclude" }
      - { name: service_rating, type: integer, source: input, description: "Service performance rubric 1..4; supplied at conclude" }
      - { name: teacher_rating, type: integer, source: input, description: "Teacher rating 1..5; supplied at conclude" }
      - { name: exit_score, type: number, source: computed, description: "round_half_up(0.5*growth_percentile + 7.5*service_rating + 4.0*teacher_rating, 1); null until conclude" }
      - { name: outcome, type: enum, source: system, description: "RETAINED | PROBATION | EXITED; must equal the computed band (with probation-repeat override); null until conclude" }
      - { name: concluded_on, type: string, source: system, description: "Conclusion date; null until CONCLUDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ScreeningCycle
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /gifted/screening-cycles/{id}/advance (target_state=OPEN)"
        actor: GiftedCoordinator
        preconditions:
          - "status == DRAFT (ERR_INVALID_CYCLE_STATE)"
          - "a CutScoreProfile with status PUBLISHED exists for this cycle (ERR_NO_PUBLISHED_PROFILE)"
        side_effects: []
      - from: OPEN
        to: SCORING
        trigger: "POST /gifted/screening-cycles/{id}/advance (target_state=SCORING)"
        actor: GiftedCoordinator
        preconditions: ["status == OPEN (ERR_INVALID_CYCLE_STATE)"]
        side_effects: []
      - from: SCORING
        to: REVIEW
        trigger: "POST /gifted/screening-cycles/{id}/advance (target_state=REVIEW)"
        actor: GiftedCoordinator
        preconditions: ["status == SCORING (ERR_INVALID_CYCLE_STATE)"]
        side_effects: []
      - from: REVIEW
        to: FINALIZED
        trigger: "POST /gifted/screening-cycles/{id}/advance (target_state=FINALIZED)"
        actor: GiftedCoordinator
        preconditions:
          - "status == REVIEW (ERR_INVALID_CYCLE_STATE)"
          - "no GiftedCase in this cycle with status IN {SCREENING, AWAITING_COMMITTEE, APPEAL_PENDING} (ERR_CYCLE_HAS_OPEN_CASES)"
        side_effects: []
      - note: "Any advance whose target_state is not the immediate successor of the current state fails with ERR_INVALID_CYCLE_STATE."

  - entity: CutScoreProfile
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /gifted/cut-score-profiles/{id}/publish"
        actor: GiftedCoordinator
        preconditions:
          - "profile.status == DRAFT (ERR_PROFILE_NOT_DRAFT)"
          - "parent cycle.status IN {DRAFT, OPEN} (ERR_INVALID_CYCLE_STATE)"
          - "expected_cycle_version == parent cycle.version (ERR_STALE_VERSION; see concurrency_rules)"
        side_effects:
          - "the previously PUBLISHED profile of the same cycle (if any) transitions PUBLISHED -> SUPERSEDED"
          - "cycle.published_profile_id := this profile id"
          - "increments ScreeningCycle.version by 1"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when another profile of the same cycle is published)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GiftedCase
    initial_state: SCREENING
    terminal_states: [IDENTIFIED]
    transitions:
      - from: SCREENING
        to: IDENTIFIED
        trigger: "POST /gifted/cases (pathway=TRANSFER_HONOR) — atomic at creation; or POST /gifted/cases/{id}/finalize-scoring when composite >= cut"
        actor: GiftedCoordinator
        preconditions:
          - "TRANSFER_HONOR at create: cycle.status == OPEN (ERR_CYCLE_NOT_OPEN); today <= student.created_at date + 45 days (ERR_TRANSFER_WINDOW_LAPSED); external_identified_on >= today - 730 days (ERR_EXTERNAL_ID_TOO_OLD)"
          - "finalize: case.status == SCREENING (ERR_INVALID_CASE_STATE); cycle.status == SCORING (ERR_INVALID_CYCLE_STATE); required measures present (ERR_INCOMPLETE_MEASURES)"
        side_effects:
          - "decided_on := today"
          - "student.gifted_status := IDENTIFIED"
      - from: SCREENING
        to: AWAITING_COMMITTEE
        trigger: "POST /gifted/cases/{id}/finalize-scoring when review_band_floor <= composite < cut (variant-appropriate cut/floor)"
        actor: GiftedCoordinator
        preconditions:
          - "case.status == SCREENING (ERR_INVALID_CASE_STATE)"
          - "cycle.status == SCORING (ERR_INVALID_CYCLE_STATE)"
          - "required measures present (ERR_INCOMPLETE_MEASURES)"
        side_effects: ["composite_score and scored_variant stored; each MeasureScore.weighted_contribution stored"]
      - from: SCREENING
        to: NOT_IDENTIFIED
        trigger: "POST /gifted/cases/{id}/finalize-scoring when composite < review_band_floor (variant-appropriate)"
        actor: GiftedCoordinator
        preconditions:
          - "case.status == SCREENING (ERR_INVALID_CASE_STATE)"
          - "cycle.status == SCORING (ERR_INVALID_CYCLE_STATE)"
          - "required measures present (ERR_INCOMPLETE_MEASURES)"
        side_effects: ["decided_on := today; composite_score and scored_variant stored"]
      - from: AWAITING_COMMITTEE
        to: IDENTIFIED
        trigger: "system (CommitteeReview of kind BAND_REVIEW reaches DECIDED with outcome QUALIFY)"
        actor: system
        preconditions: []
        side_effects:
          - "decided_on := review.decided_on"
          - "student.gifted_status := IDENTIFIED"
      - from: AWAITING_COMMITTEE
        to: NOT_IDENTIFIED
        trigger: "system (CommitteeReview of kind BAND_REVIEW reaches DECIDED with outcome DENY)"
        actor: system
        preconditions: []
        side_effects: ["decided_on := review.decided_on"]
      - from: NOT_IDENTIFIED
        to: APPEAL_PENDING
        trigger: "POST /gifted/cases/{id}/committee-reviews (review_kind=APPEAL)"
        actor: ParentGuardian | ReferringEducator
        preconditions:
          - "case.status == NOT_IDENTIFIED and appeal_used == false (ERR_INVALID_CASE_STATE)"
          - "cycle.status == REVIEW (ERR_INVALID_CYCLE_STATE)"
          - "today <= decided_on + 30 days (ERR_APPEAL_WINDOW_CLOSED)"
          - "ParentGuardian caller: X-User-ID == student.primary_guardian_user_id (ERR_GUARDIAN_MISMATCH)"
        side_effects:
          - "appeal_used := true"
          - "creates CommitteeReview(kind=APPEAL, status=VOTING)"
      - from: APPEAL_PENDING
        to: IDENTIFIED
        trigger: "system (CommitteeReview of kind APPEAL reaches DECIDED with outcome QUALIFY)"
        actor: system
        preconditions: []
        side_effects:
          - "decided_on := review.decided_on"
          - "student.gifted_status := IDENTIFIED"
      - from: APPEAL_PENDING
        to: NOT_IDENTIFIED
        trigger: "system (CommitteeReview of kind APPEAL reaches DECIDED with outcome DENY)"
        actor: system
        preconditions: []
        side_effects: ["decided_on := review.decided_on"]
      - note: "NOT_IDENTIFIED with appeal_used == true is de facto terminal (the single appeal has been consumed)."

  - entity: CommitteeReview
    initial_state: VOTING
    terminal_states: [DECIDED]
    transitions:
      - from: VOTING
        to: DECIDED
        trigger: "system (automatic on the vote that locks a threshold: qualify_votes >= 2, or deny_votes >= 2, or total votes cast == 3 with no majority => outcome DENY)"
        actor: system
        preconditions: []
        side_effects:
          - "outcome := QUALIFY or DENY per calculations.quorum_decision; decided_on := today"
          - "BAND_REVIEW: case AWAITING_COMMITTEE -> IDENTIFIED (QUALIFY) or NOT_IDENTIFIED (DENY)"
          - "APPEAL: case APPEAL_PENDING -> IDENTIFIED (QUALIFY) or NOT_IDENTIFIED (DENY)"
          - "on QUALIFY: student.gifted_status := IDENTIFIED"
      - from: VOTING
        to: DECIDED
        trigger: "POST /gifted/committee-reviews/{id}/conclude (force-decide with the votes cast so far; no majority => DENY)"
        actor: GiftedCoordinator
        preconditions: ["review.status == VOTING (ERR_INVALID_REVIEW_STATE)"]
        side_effects: ["same case/student side effects as the system decide transition"]

  - entity: ServicePlacement
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, EXITED]
    transitions:
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /gifted/placements/{id}/accept"
        actor: ParentGuardian
        preconditions:
          - "placement.status == OFFERED (ERR_INVALID_PLACEMENT_STATE)"
          - "X-User-ID == student.primary_guardian_user_id (ERR_GUARDIAN_MISMATCH)"
          - "seat available: occupied(site, model) < capacity (otherwise lands in WAITLISTED, not an error)"
        side_effects:
          - "site occupied counter for (site_id, service_model) += 1"
      - from: OFFERED
        to: WAITLISTED
        trigger: "POST /gifted/placements/{id}/accept when occupied(site, model) >= capacity"
        actor: ParentGuardian
        preconditions:
          - "placement.status == OFFERED (ERR_INVALID_PLACEMENT_STATE)"
          - "X-User-ID == student.primary_guardian_user_id (ERR_GUARDIAN_MISMATCH)"
        side_effects: ["waitlisted_at := current logical clock timestamp (no seat change; seats are consumed by ACTIVE only)"]
      - from: OFFERED
        to: DECLINED
        trigger: "POST /gifted/placements/{id}/decline"
        actor: ParentGuardian
        preconditions:
          - "placement.status IN {OFFERED, WAITLISTED} (ERR_INVALID_PLACEMENT_STATE)"
          - "X-User-ID == student.primary_guardian_user_id (ERR_GUARDIAN_MISMATCH)"
        side_effects: ["no seat change (OFFERED holds no seat); no promotion run"]
      - from: WAITLISTED
        to: DECLINED
        trigger: "POST /gifted/placements/{id}/decline"
        actor: ParentGuardian
        preconditions:
          - "placement.status IN {OFFERED, WAITLISTED} (ERR_INVALID_PLACEMENT_STATE)"
          - "X-User-ID == student.primary_guardian_user_id (ERR_GUARDIAN_MISMATCH)"
        side_effects: ["waitlisted_at := null (no seat held; no promotion run)"]
      - from: OFFERED
        to: EXPIRED
        trigger: "system (automatic on POST /gifted/_clock/set_current_utc when today > accept_by)"
        actor: system
        preconditions: []
        side_effects: ["no seat change (OFFERED holds no seat); no promotion run"]
      - from: WAITLISTED
        to: OFFERED
        trigger: "system (waitlist promotion on a seat-release event at the same site+model; exactly one promotion per released seat; head of waitlist by waitlisted_at ASC, tie-break created_at ASC)"
        actor: system
        preconditions: ["a placement at the same (site, model) just left ACTIVE"]
        side_effects:
          - "offered_on := today; accept_by := today + 30 days; waitlisted_at := null"
          - "no seat change (OFFERED holds no seat)"
      - from: ACTIVE
        to: EXITED
        trigger: "POST /gifted/placements/{id}/withdraw, or system via ReEvaluation conclude with outcome EXITED"
        actor: GiftedCoordinator | ParentGuardian | system
        preconditions:
          - "placement.status == ACTIVE (ERR_INVALID_PLACEMENT_STATE)"
          - "withdraw: caller is GiftedCoordinator, or ParentGuardian whose X-User-ID == student.primary_guardian_user_id (ERR_GUARDIAN_MISMATCH)"
        side_effects:
          - "end_on := today"
          - "student.gifted_status := EXITED"
          - "seat release: occupied(site, model) -= 1"
          - "run calculations.waitlist_promotion for (site, model): promote the single waitlist head, if any"

  - entity: ReEvaluation
    initial_state: SCHEDULED
    terminal_states: [CONCLUDED]
    transitions:
      - from: SCHEDULED
        to: IN_REVIEW
        trigger: "system (automatic on POST /gifted/_clock/set_current_utc when today >= due_on)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_REVIEW
        to: CONCLUDED
        trigger: "POST /gifted/re-evaluations/{id}/conclude"
        actor: GiftedCoordinator
        preconditions:
          - "re-evaluation.status == IN_REVIEW (ERR_REEVAL_NOT_IN_REVIEW)"
          - "submitted outcome == computed effective outcome from calculations.exit_score_and_outcome (ERR_REEVAL_OUTCOME_MISMATCH)"
        side_effects:
          - "exit_score, outcome, concluded_on stored"
          - "outcome RETAINED: no further effects (placement stays ACTIVE)"
          - "outcome PROBATION: placement.is_on_probation := true (placement stays ACTIVE)"
          - "outcome EXITED: placement ACTIVE -> EXITED (end_on := today), student.gifted_status := EXITED, occupied(site, model) -= 1, then calculations.waitlist_promotion runs for (site, model)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: profile-publish-stale-cycle
    parent_entity: ScreeningCycle
    write_endpoint: "POST /gifted/cut-score-profiles/{id}/publish"
    occ_field: "expected_cycle_version"
    description: |
      Publishing a CutScoreProfile against a ScreeningCycle whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just published a profile for the same cycle
      (which legitimately supersedes the previously PUBLISHED profile and bumps
      the cycle version), so the current writer's view of the cycle is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: composite_score
    trigger: "POST /gifted/cases/{id}/finalize-scoring"
    algorithm: weighted_scoring
    formula: |
      profile = the cycle's PUBLISHED CutScoreProfile
      present = set of measure_type with a MeasureScore on the case
      require {ABILITY, ACHIEVEMENT, RATING_SCALE} subset of present (else ERR_INCOMPLETE_MEASURES)
      norm = sum of profile weights over present measures (PORTFOLIO absent => norm < 1.0; weights renormalize)
      variant = TWICE_EXCEPTIONAL if student.has_active_sped_plan else STANDARD
      if variant == TWICE_EXCEPTIONAL:
          effective_ABILITY = effective_ACHIEVEMENT = max(percentile_ABILITY, percentile_ACHIEVEMENT)
      else:
          effective_m = percentile_m
      ROUNDING ORDER IS PINNED — per-measure first, then sum, then integer:
        contribution_m = round_half_up(effective_m * (weight_m / norm), 2)   # per-measure line rounding
        composite_score = round_half_up(sum(contribution_m), 0)              # round the sum of rounded lines
      Rounding per line then summing can differ from summing then rounding;
      the per-line order above is the only correct one.
    input_set: "MeasureScore rows of the case; each must satisfy administered_on >= today - profile.measure_validity_days (checked per score at entry AND at finalize)"
    constants:
      REQUIRED_MEASURES: [ABILITY, ACHIEVEMENT, RATING_SCALE]
    precision: "per-line 2 decimal places round_half_up; composite 0 decimal places round_half_up"
    variants:
      - name: STANDARD
        when: "student.has_active_sped_plan == false at finalize time"
        difference: "raw percentiles used; cut_score / review_band_floor apply"
      - name: TWICE_EXCEPTIONAL
        when: "student.has_active_sped_plan == true at finalize time"
        difference: "effective ability and achievement percentiles both become max(ability, achievement); cut_score_2e / review_band_floor_2e apply"

  - name: cut_score_determination
    trigger: "POST /gifted/cases/{id}/finalize-scoring (after composite_score)"
    algorithm: threshold
    formula: |
      cut  = (variant == TWICE_EXCEPTIONAL) ? profile.cut_score_2e          : profile.cut_score
      flor = (variant == TWICE_EXCEPTIONAL) ? profile.review_band_floor_2e  : profile.review_band_floor
      if composite_score >= cut   -> IDENTIFIED            # boundary: equality identifies
      elif composite_score >= flor -> AWAITING_COMMITTEE   # boundary: equality enters review
      else                          -> NOT_IDENTIFIED
    input_set: "the case's freshly computed composite_score and scored_variant"
    precision: "integer comparison on the rounded composite"

  - name: exit_score_and_outcome
    trigger: "POST /gifted/re-evaluations/{id}/conclude"
    algorithm: weighted_scoring
    formula: |
      exit_score = round_half_up(0.5*growth_percentile + 7.5*service_rating + 4.0*teacher_rating, 1)
      band: exit_score >= 70.0 -> RETAINED
            exit_score >= 50.0 -> PROBATION      # boundary: exactly 50.0 is PROBATION
            else               -> EXITED
      STATE-DEPENDENT BRANCH: if band == PROBATION and placement.is_on_probation == true
      (a second consecutive probation) the effective outcome is EXITED.
      The submitted outcome must equal the effective outcome (ERR_REEVAL_OUTCOME_MISMATCH).
    input_set: "conclude payload scores + placement.is_on_probation at conclude time"
    constants:
      GROWTH_WEIGHT: 0.5
      SERVICE_WEIGHT: 7.5
      TEACHER_WEIGHT: 4.0
      RETAIN_FLOOR: 70.0
      PROBATION_FLOOR: 50.0
    precision: "1 decimal place, round_half_up"

  - name: seat_availability
    trigger: "placement accept; any occupancy change (accept, withdraw, re-eval exit)"
    algorithm: aggregation
    formula: |
      occupied(site, model) = count of ServicePlacement rows with
                              site_id == site AND service_model == model
                              AND status == ACTIVE          # seats are consumed by ACTIVE only; OFFERED/WAITLISTED hold nothing
      capacity = site.<model>_capacity
      accept: occupied < capacity => ACTIVE (occupied + 1); occupied >= capacity => WAITLISTED
      INVARIANT: 0 <= occupied <= capacity at all times.
    input_set: "all ServicePlacement rows for the (site, model) pair"

  - name: quorum_decision
    trigger: "each POST /gifted/committee-reviews/{id}/votes; POST .../conclude"
    algorithm: threshold
    formula: |
      SEATS = 3; QUALIFY_THRESHOLD = 2; DENY_THRESHOLD = 2
      q = count votes verdict=QUALIFY; d = count DENY; a = count ABSTAIN; total = q+d+a
      if q >= QUALIFY_THRESHOLD  -> DECIDED / QUALIFY   (locks immediately, 3rd vote moot)
      elif d >= DENY_THRESHOLD   -> DECIDED / DENY
      elif total == SEATS        -> DECIDED / DENY      (no-majority default, covers 1-1-1)
      conclude (force): apply the same thresholds to votes cast so far; no majority => DENY
    input_set: "CommitteeVote rows of the review"
    constants:
      SEATS: 3
      QUALIFY_THRESHOLD: 2
      DENY_THRESHOLD: 2

  - name: waitlist_promotion
    trigger: "a seat-release event at a (site, model): a placement leaves ACTIVE (withdraw or re-eval EXIT)"
    algorithm: aggregation
    formula: |
      candidates = ServicePlacement rows with site_id, service_model, status == WAITLISTED
      order: waitlisted_at ASC, tie-break created_at ASC
      on each seat-release event: promote exactly one placement — the waitlist head —
        -> OFFERED (offered_on := today, accept_by := today + 30, waitlisted_at := null)
      empty candidate pool => no-op (no error)
      OFFERED does not consume a seat; the promoted placement consumes one only on accept.
    input_set: "placements of the (site, model) pair"
    precision: "ordering uses the logical clock; never entity id"

  - name: disproportionality_risk_ratio
    trigger: "GET /gifted/screening-cycles/{id}/disproportionality-report?variant=INTERIM|FINAL"
    algorithm: threshold
    formula: |
      scope: Student rows whose grade_level falls in the cycle's grade_band
             (ELEMENTARY 0-5, MIDDLE 6-8, HIGH 9-12), across all sites
      enrolled_g = count of in-scope students with demographic_group == g
      identified_g:
        FINAL   = students with a GiftedCase in this cycle, status IDENTIFIED
        INTERIM = status IN {IDENTIFIED, AWAITING_COMMITTEE, APPEAL_PENDING}  (projected pipeline)
      groups with enrolled_g == 0 are omitted from group_metrics
      rate_g = round_half_up(identified_g / enrolled_g, 4)
      reference_group = group with the largest enrolled_g; tie-break: demographic_group name ASC
      ratio_g = round_half_up(rate_g / rate_reference, 3)     # rate_reference == 0 => ratios null, no flags
      flagged UNDER_REPRESENTED iff ratio_g < 0.800 AND enrolled_g >= MIN_CELL
      boundary: ratio exactly 0.800 is NOT flagged
      total_identified = sum over groups of identified_g
    input_set: "Student roster (grade-band filtered) + GiftedCase rows of the cycle"
    constants:
      FLAG_THRESHOLD: 0.800
      MIN_CELL: 10
    precision: "rates 4 decimal places round_half_up; ratios 3 decimal places round_half_up; comparison uses the rounded ratio"
    variants:
      - name: INTERIM
        when: "variant=INTERIM; allowed when cycle.status IN {REVIEW, FINALIZED}"
        difference: "counts IDENTIFIED + AWAITING_COMMITTEE + APPEAL_PENDING as identified (forward-looking projection)"
      - name: FINAL
        when: "variant=FINAL; allowed only when cycle.status == FINALIZED (ERR_INVALID_CYCLE_STATE otherwise)"
        difference: "counts IDENTIFIED only (audit view)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is permitted for this endpoint per §1.5 roles (incl. review_kind-conditional roles on POST cases/{id}/committee-reviews)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "ParentGuardian ownership: X-User-ID == primary_guardian_user_id of the student owning the target resource"
    error_id: ERR_GUARDIAN_MISMATCH
    http_status: 403
    applies_to: "POST placements/{id}/accept|decline|withdraw (guardian), POST cases/{id}/committee-reviews with review_kind=APPEAL by ParentGuardian"
  - priority: 4
    category: existence
    check: "path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: business_constraint
    check: "request shape: required fields present, types match, enum membership, numeric ranges (percentile 1.0..99.9; growth 0.0..100.0; service_rating 1..4; teacher_rating 1..5; capacities >= 0), date-range ordering (open < close; referral_close <= screening_close), weight sum 1.0 (tolerance 0.0001), cut-band sanity (floor < cut; floor_2e < cut_2e; cut_2e <= cut), pathway-conditional fields (REFERRAL requires referral_source and forbids external_*; TRANSFER_HONOR requires external_district_name + external_identified_on and forbids referral_source; UNIVERSAL_SCREEN forbids both), administered_on not in the future"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutation endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_cycle_version == current ScreeningCycle.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST cut-score-profiles/{id}/publish"
  - priority: 7
    category: state
    check: "state preconditions: cycle status gates (case intake requires OPEN — ERR_CYCLE_NOT_OPEN; measure entry requires cycle OPEN or SCORING; finalize requires SCORING; review/appeal creation requires REVIEW; report availability gates; advance successor rule — all other cycle-state failures ERR_INVALID_CYCLE_STATE); profile DRAFT (ERR_PROFILE_NOT_DRAFT); case status gates (ERR_INVALID_CASE_STATE); review VOTING (ERR_INVALID_REVIEW_STATE); placement status gates (ERR_INVALID_PLACEMENT_STATE); re-eval IN_REVIEW (ERR_REEVAL_NOT_IN_REVIEW); advance preconditions ERR_NO_PUBLISHED_PROFILE / ERR_CYCLE_HAS_OPEN_CASES"
    error_id: "ERR_INVALID_CYCLE_STATE | ERR_CYCLE_NOT_OPEN | ERR_INVALID_CASE_STATE | ERR_PROFILE_NOT_DRAFT | ERR_INVALID_REVIEW_STATE | ERR_INVALID_PLACEMENT_STATE | ERR_REEVAL_NOT_IN_REVIEW | ERR_NO_PUBLISHED_PROFILE | ERR_CYCLE_HAS_OPEN_CASES"
    http_status: 409
    applies_to: "state-dependent endpoints"
  - priority: 8
    category: business_safety
    check: "committee conflict of interest: voter X-User-ID must not equal case.referrer_user_id"
    error_id: ERR_COMMITTEE_CONFLICT_OF_INTEREST
    http_status: 403
    applies_to: "POST committee-reviews/{id}/votes"
  - priority: 9
    category: business_referential
    check: "student.grade_level must fall in cycle.grade_band; site_id on placement must exist as a SchoolSite"
    error_id: ERR_GRADE_BAND_MISMATCH
    http_status: 422
    applies_to: "POST cases (band check); placement site handled by ERR_NOT_FOUND at priority 4"
  - priority: 10
    category: business_constraint
    check: "uniqueness/aggregate: one case per (student, cycle) (ERR_DUPLICATE_CASE); one SpedPlan per student (ERR_DUPLICATE_SPED_PLAN); one MeasureScore per (case, measure_type) (ERR_DUPLICATE_MEASURE); one vote per (review, member) (ERR_DUPLICATE_VOTE); one non-DECIDED review per case (ERR_REVIEW_ALREADY_OPEN); one non-CONCLUDED re-evaluation per placement (ERR_REEVAL_ALREADY_OPEN); finalize requires required measure set (ERR_INCOMPLETE_MEASURES); conclude outcome must equal computed outcome (ERR_REEVAL_OUTCOME_MISMATCH)"
    error_id: "ERR_DUPLICATE_CASE | ERR_DUPLICATE_SPED_PLAN | ERR_DUPLICATE_MEASURE | ERR_DUPLICATE_VOTE | ERR_REVIEW_ALREADY_OPEN | ERR_REEVAL_ALREADY_OPEN | ERR_INCOMPLETE_MEASURES | ERR_REEVAL_OUTCOME_MISMATCH"
    http_status: 409
    applies_to: "creation and conclusion endpoints"
    note: "ERR_INCOMPLETE_MEASURES and ERR_REEVAL_OUTCOME_MISMATCH use http 422; the duplicate/already-open errors use 409"
  - priority: 11
    category: business_temporal
    check: "windows & intervals: cycle screening windows per grade_band must not overlap (half-open [open, close); adjacency allowed — ERR_CYCLE_WINDOW_OVERLAP); placement service periods per student must not overlap (open-ended: end_on null = infinity — ERR_PLACEMENT_PERIOD_OVERLAP); referral intake after referral_close_on (ERR_REFERRAL_WINDOW_CLOSED); transfer honoring window 45 days from student.created_at (ERR_TRANSFER_WINDOW_LAPSED); external identification older than 730 days (ERR_EXTERNAL_ID_TOO_OLD); measure administered earlier than measure_validity_days before today (ERR_MEASURE_OUTSIDE_VALIDITY)"
    error_id: "ERR_CYCLE_WINDOW_OVERLAP | ERR_PLACEMENT_PERIOD_OVERLAP | ERR_REFERRAL_WINDOW_CLOSED | ERR_TRANSFER_WINDOW_LAPSED | ERR_EXTERNAL_ID_TOO_OLD | ERR_MEASURE_OUTSIDE_VALIDITY"
    http_status: 409
    applies_to: "cycle create; case create; measure create; placement create"
    note: "window/age checks use 422; interval-overlap checks use 409"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/gifted/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time. Setting the clock runs due-date batch transitions: ReEvaluation SCHEDULED -> IN_REVIEW where today >= due_on; ServicePlacement OFFERED -> EXPIRED where today > accept_by (no seat was held, so no promotion)."
    roles: [GiftedCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["re-evaluation activation sweep", "offer expiry sweep"]

  # --- SchoolSite ---
  - method: POST
    path: "/gifted/school-sites"
    description: "Create a school site with per-model seat capacities"
    roles: [GiftedCoordinator]
    code: 201
    input: [name, code, pull_out_capacity, cluster_capacity, acceleration_capacity]
    output: SchoolSite
    side_effects: []
  - method: GET
    path: "/gifted/school-sites/{id}"
    description: "Get one site incl. computed occupied counters"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: SchoolSite
    side_effects: []
  - method: GET
    path: "/gifted/school-sites/{id}/students"
    description: "List students enrolled at a site"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: ["demographic_group?", "gifted_status?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []
  - method: GET
    path: "/gifted/school-sites/{id}/placements"
    description: "List placements at a site"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: ["service_model?", "status?", "limit?", "offset?"]
    output: "ServicePlacement[]"
    side_effects: []

  # --- Student ---
  - method: POST
    path: "/gifted/students"
    description: "Enroll one student"
    roles: [GiftedCoordinator]
    code: 201
    input: [student_number, legal_name, grade_level, school_site_id, demographic_group, primary_guardian_user_id, "is_ell?"]
    output: Student
    side_effects: []
  - method: POST
    path: "/gifted/students/bulk-enroll"
    description: "Bulk-enroll `count` students sharing site/grade/demographic group (enrollment roster seeding for disproportionality reporting). Server mints student_number values; primary_guardian_user_id is null on bulk rows."
    roles: [GiftedCoordinator]
    code: 201
    input: [school_site_id, grade_level, demographic_group, count]
    output: "{ created_count: integer, student_ids: array }"
    side_effects: ["creates count Student rows"]
  - method: GET
    path: "/gifted/students/{id}"
    description: "Get one student incl. computed has_active_sped_plan"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: Student
    side_effects: []

  # --- SpedPlan ---
  - method: POST
    path: "/gifted/students/{id}/sped-plans"
    description: "Register an IEP/504 plan (twice-exceptional coordination); at most one per student"
    roles: [SpecialEdCoordinator]
    code: 201
    input: [plan_type, started_on]
    output: SpedPlan
    side_effects: ["student.has_active_sped_plan := true"]
  - method: GET
    path: "/gifted/students/{id}/sped-plans"
    description: "List a student's special-education plans"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: "SpedPlan[]"
    side_effects: []

  # --- ScreeningCycle ---
  - method: POST
    path: "/gifted/screening-cycles"
    description: "Create a screening cycle; same-band screening windows are half-open [open, close) and must not overlap (adjacency allowed)"
    roles: [GiftedCoordinator]
    code: 201
    input: [name, school_year, grade_band, screening_open_on, screening_close_on, referral_close_on]
    output: ScreeningCycle
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/gifted/screening-cycles/{id}"
    description: "Get one cycle incl. published_profile_id and OCC version"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: ScreeningCycle
    side_effects: []
  - method: POST
    path: "/gifted/screening-cycles/{id}/advance"
    description: "Advance the cycle pipeline DRAFT -> OPEN -> SCORING -> REVIEW -> FINALIZED; target must be the immediate successor"
    roles: [GiftedCoordinator]
    code: 200
    input: [target_state]
    output: ScreeningCycle
    side_effects: ["state transition per ScreeningCycle state machine"]

  # --- CutScoreProfile ---
  - method: POST
    path: "/gifted/screening-cycles/{id}/cut-score-profiles"
    description: "Create a DRAFT cut-score profile (multi-criteria matrix) for a cycle; cycle must be DRAFT or OPEN"
    roles: [GiftedCoordinator]
    code: 201
    input: [label, ability_weight, achievement_weight, rating_weight, portfolio_weight, cut_score, review_band_floor, cut_score_2e, review_band_floor_2e, "measure_validity_days?"]
    output: CutScoreProfile
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/gifted/screening-cycles/{id}/cut-score-profiles"
    description: "List profiles of a cycle"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "CutScoreProfile[]"
    side_effects: []
  - method: POST
    path: "/gifted/cut-score-profiles/{id}/publish"
    description: "Publish a DRAFT profile (OCC-guarded on the parent cycle version); supersedes the previously PUBLISHED profile"
    roles: [GiftedCoordinator]
    code: 200
    input: [expected_cycle_version]
    output: CutScoreProfile
    side_effects:
      - "profile DRAFT -> PUBLISHED"
      - "prior PUBLISHED profile of the cycle -> SUPERSEDED"
      - "cycle.published_profile_id := this profile"
      - "increments ScreeningCycle.version by 1"

  # --- GiftedCase ---
  - method: POST
    path: "/gifted/cases"
    description: "Open an identification case (cycle must be OPEN). UNIVERSAL_SCREEN: coordinator batch intake. REFERRAL: teacher/parent referral (referral_source required; referrer_user_id := X-User-ID; today <= cycle.referral_close_on). TRANSFER_HONOR: honors external identification — requires the student record be at most 45 days old and external_identified_on within 730 days; the case lands directly in IDENTIFIED."
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian]
    code: 201
    input: [student_id, cycle_id, pathway, "referral_source?", "external_district_name?", "external_identified_on?"]
    output: GiftedCase
    side_effects:
      - "pathway UNIVERSAL_SCREEN/REFERRAL: status = SCREENING"
      - "pathway TRANSFER_HONOR: status = IDENTIFIED, decided_on := today, student.gifted_status := IDENTIFIED"
  - method: GET
    path: "/gifted/cases"
    description: "List cases with filters"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: ["student_id?", "cycle_id?", "status?", "pathway?", "limit?", "offset?"]
    output: "GiftedCase[]"
    side_effects: []
  - method: GET
    path: "/gifted/cases/{id}"
    description: "Get one case incl. composite_score and scored_variant"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: GiftedCase
    side_effects: []
  - method: POST
    path: "/gifted/cases/{id}/measure-scores"
    description: "Enter one measure score (case SCREENING; cycle OPEN or SCORING; one score per measure_type; administered_on within validity window and not in the future)"
    roles: [GiftedCoordinator]
    code: 201
    input: [measure_type, percentile, administered_on]
    output: MeasureScore
    side_effects: []
  - method: GET
    path: "/gifted/cases/{id}/measure-scores"
    description: "List a case's measure scores"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: "MeasureScore[]"
    side_effects: []
  - method: POST
    path: "/gifted/cases/{id}/finalize-scoring"
    description: "Compute composite_score (pinned per-measure rounding), determine variant, and route the case per cut_score_determination; cycle must be SCORING"
    roles: [GiftedCoordinator]
    code: 200
    input: []
    output: GiftedCase
    side_effects: ["stores composite_score, scored_variant, weighted_contribution per measure", "case transition SCREENING -> IDENTIFIED | AWAITING_COMMITTEE | NOT_IDENTIFIED"]
  - method: POST
    path: "/gifted/cases/{id}/committee-reviews"
    description: "Open a committee review. review_kind=BAND_REVIEW: GiftedCoordinator only, case must be AWAITING_COMMITTEE. review_kind=APPEAL: ParentGuardian (own student) or ReferringEducator only, case must be NOT_IDENTIFIED with appeal_used == false, cycle REVIEW, within 30 days of decided_on; sets appeal_used and moves the case to APPEAL_PENDING. At most one non-DECIDED review per case."
    roles: [GiftedCoordinator, ParentGuardian, ReferringEducator]
    code: 201
    input: [review_kind, "grounds?"]
    output: CommitteeReview
    side_effects: ["review status = VOTING", "APPEAL: case NOT_IDENTIFIED -> APPEAL_PENDING, appeal_used := true"]
  - method: GET
    path: "/gifted/cases/{id}/committee-reviews"
    description: "List reviews of a case"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: "CommitteeReview[]"
    side_effects: []

  # --- CommitteeReview / votes ---
  - method: GET
    path: "/gifted/committee-reviews/{id}"
    description: "Get one review incl. vote tallies and outcome"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: CommitteeReview
    side_effects: []
  - method: POST
    path: "/gifted/committee-reviews/{id}/votes"
    description: "Cast a committee vote (one per member per review; referrers barred by conflict-of-interest); the vote that locks a threshold auto-decides the review"
    roles: [CommitteeMember]
    code: 201
    input: [verdict]
    output: CommitteeVote
    side_effects: ["updates review vote tallies", "system auto-decide per calculations.quorum_decision incl. case + student cascades"]
  - method: GET
    path: "/gifted/committee-reviews/{id}/votes"
    description: "List votes of a review"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: "CommitteeVote[]"
    side_effects: []
  - method: POST
    path: "/gifted/committee-reviews/{id}/conclude"
    description: "Force-decide a VOTING review from the votes cast so far; no majority => DENY"
    roles: [GiftedCoordinator]
    code: 200
    input: []
    output: CommitteeReview
    side_effects: ["review VOTING -> DECIDED incl. case + student cascades"]

  # --- ServicePlacement ---
  - method: POST
    path: "/gifted/cases/{id}/placements"
    description: "Offer a service placement (case must be IDENTIFIED); a student may not hold two placements with overlapping service periods (open-ended: end_on null means infinity)"
    roles: [GiftedCoordinator]
    code: 201
    input: [site_id, service_model, start_on]
    output: ServicePlacement
    side_effects: ["status = OFFERED; offered_on := today; accept_by := today + 30 days", "no seat change (seats are consumed by ACTIVE only)"]
  - method: GET
    path: "/gifted/placements/{id}"
    description: "Get one placement"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: ServicePlacement
    side_effects: []
  - method: GET
    path: "/gifted/cases/{id}/placements"
    description: "List placements of a case"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: "ServicePlacement[]"
    side_effects: []
  - method: POST
    path: "/gifted/placements/{id}/accept"
    description: "Guardian accepts an offer: ACTIVE when a seat is free, WAITLISTED when occupied >= capacity"
    roles: [ParentGuardian]
    code: 200
    input: []
    output: ServicePlacement
    side_effects: ["OFFERED -> ACTIVE (seat consumed) or OFFERED -> WAITLISTED (waitlisted_at set)"]
  - method: POST
    path: "/gifted/placements/{id}/decline"
    description: "Guardian declines an OFFERED or WAITLISTED placement (no seat is held in either state, so no promotion runs)"
    roles: [ParentGuardian]
    code: 200
    input: []
    output: ServicePlacement
    side_effects: ["OFFERED|WAITLISTED -> DECLINED", "no seat release (neither OFFERED nor WAITLISTED holds a seat)"]
  - method: POST
    path: "/gifted/placements/{id}/withdraw"
    description: "Withdraw an ACTIVE placement (coordinator or own guardian); releases the seat, exits the student from gifted service, runs waitlist promotion"
    roles: [GiftedCoordinator, ParentGuardian]
    code: 200
    input: []
    output: ServicePlacement
    side_effects: ["ACTIVE -> EXITED; end_on := today; student.gifted_status := EXITED", "seat release + waitlist promotion"]

  # --- ReEvaluation ---
  - method: POST
    path: "/gifted/placements/{id}/re-evaluations"
    description: "Schedule the annual re-evaluation (placement must be ACTIVE; at most one non-CONCLUDED per placement)"
    roles: [GiftedCoordinator]
    code: 201
    input: [due_on]
    output: ReEvaluation
    side_effects: ["status = SCHEDULED"]
  - method: GET
    path: "/gifted/placements/{id}/re-evaluations"
    description: "List re-evaluations of a placement"
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: []
    output: "ReEvaluation[]"
    side_effects: []
  - method: POST
    path: "/gifted/re-evaluations/{id}/conclude"
    description: "Conclude an IN_REVIEW re-evaluation; submitted outcome must equal the computed effective outcome (exit_score bands + probation-repeat override)"
    roles: [GiftedCoordinator]
    code: 200
    input: [growth_percentile, service_rating, teacher_rating, outcome]
    output: ReEvaluation
    side_effects: ["per ReEvaluation state machine: PROBATION flags placement; EXITED cascades placement -> EXITED, student.gifted_status := EXITED, seat release + waitlist promotion"]

  # --- Disproportionality report (computed read) ---
  - method: GET
    path: "/gifted/screening-cycles/{id}/disproportionality-report"
    description: "Computed disproportionality report for a cycle. variant=INTERIM (default) counts IDENTIFIED + AWAITING_COMMITTEE + APPEAL_PENDING; requires cycle REVIEW or FINALIZED. variant=FINAL counts IDENTIFIED only; requires FINALIZED. reference_group = largest enrolled in-band group (tie-break: group name ASC); ratio_g = round(rate_g/rate_ref, 3); flagged iff ratio_g < 0.800 and enrolled_g >= 10."
    roles: [GiftedCoordinator, ReferringEducator, ParentGuardian, CommitteeMember, SpecialEdCoordinator]
    code: 200
    input: ["variant?"]
    output: "{ cycle_id: string, variant: string, reference_group: string, total_identified: integer, group_metrics: array, flagged_groups: array }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "role not permitted for this endpoint (incl. review_kind-conditional role rules)" }
  - { id: ERR_GUARDIAN_MISMATCH, http: 403, condition: "ParentGuardian X-User-ID does not match the owning student's primary_guardian_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "path resource id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "malformed request: missing/typed/enum/range/date-order/weight-sum/cut-band/pathway-field/future-date violations" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_cycle_version != current ScreeningCycle.version on publish" }
  - { id: ERR_INVALID_CYCLE_STATE, http: 409, condition: "cycle status forbids the operation (bad advance target, measure entry outside OPEN/SCORING, finalize outside SCORING, review/appeal outside REVIEW, profile create/publish past OPEN, report not yet available)" }
  - { id: ERR_CYCLE_NOT_OPEN, http: 409, condition: "case intake requires cycle status OPEN" }
  - { id: ERR_NO_PUBLISHED_PROFILE, http: 409, condition: "advance DRAFT->OPEN without a PUBLISHED cut-score profile" }
  - { id: ERR_CYCLE_HAS_OPEN_CASES, http: 409, condition: "advance REVIEW->FINALIZED while cases remain SCREENING/AWAITING_COMMITTEE/APPEAL_PENDING" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 409, condition: "same grade_band screening window overlaps another cycle (half-open intervals; adjacency allowed)" }
  - { id: ERR_PROFILE_NOT_DRAFT, http: 409, condition: "publish requires profile status DRAFT" }
  - { id: ERR_INVALID_CASE_STATE, http: 409, condition: "case status forbids the operation (finalize non-SCREENING, measure entry non-SCREENING, band review non-AWAITING, appeal non-NOT_IDENTIFIED or appeal used, placement offer non-IDENTIFIED)" }
  - { id: ERR_DUPLICATE_CASE, http: 409, condition: "a case already exists for (student, cycle)" }
  - { id: ERR_GRADE_BAND_MISMATCH, http: 422, condition: "student.grade_level not in the cycle's grade_band" }
  - { id: ERR_TRANSFER_WINDOW_LAPSED, http: 422, condition: "TRANSFER_HONOR case created more than 45 days after student record creation" }
  - { id: ERR_EXTERNAL_ID_TOO_OLD, http: 422, condition: "external_identified_on is more than 730 days before today" }
  - { id: ERR_REFERRAL_WINDOW_CLOSED, http: 422, condition: "REFERRAL case created after the cycle's referral_close_on" }
  - { id: ERR_DUPLICATE_MEASURE, http: 409, condition: "a MeasureScore with this measure_type already exists on the case" }
  - { id: ERR_MEASURE_OUTSIDE_VALIDITY, http: 422, condition: "administered_on earlier than today - measure_validity_days at entry or finalize" }
  - { id: ERR_INCOMPLETE_MEASURES, http: 422, condition: "finalize without ABILITY, ACHIEVEMENT, and RATING_SCALE scores" }
  - { id: ERR_REVIEW_ALREADY_OPEN, http: 409, condition: "a non-DECIDED review already exists for the case" }
  - { id: ERR_INVALID_REVIEW_STATE, http: 409, condition: "vote or conclude on a review not in VOTING" }
  - { id: ERR_COMMITTEE_CONFLICT_OF_INTEREST, http: 403, condition: "voter's X-User-ID equals the case's referrer_user_id" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "member already cast a vote on this review" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 422, condition: "appeal filed more than 30 days after the case's decided_on" }
  - { id: ERR_PLACEMENT_PERIOD_OVERLAP, http: 409, condition: "student already holds a placement (OFFERED/ACTIVE/WAITLISTED) whose service period overlaps the requested one (open-ended intervals)" }
  - { id: ERR_INVALID_PLACEMENT_STATE, http: 409, condition: "placement status forbids the operation (accept/decline non-OFFERED/WAITLISTED, withdraw non-ACTIVE)" }
  - { id: ERR_REEVAL_ALREADY_OPEN, http: 409, condition: "a non-CONCLUDED re-evaluation already exists for the placement" }
  - { id: ERR_REEVAL_NOT_IN_REVIEW, http: 409, condition: "conclude requires re-evaluation status IN_REVIEW" }
  - { id: ERR_REEVAL_OUTCOME_MISMATCH, http: 422, condition: "submitted outcome differs from the computed effective outcome" }
  - { id: ERR_DUPLICATE_SPED_PLAN, http: 409, condition: "student already has a SpedPlan" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GiftedCoordinator
    description: "District gifted-services office staff; runs cycles, cut-score profiles, scoring, placement offers, re-evaluations, reports, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /gifted/_clock/set_current_utc"
      - "POST /gifted/school-sites"
      - "POST /gifted/students and /gifted/students/bulk-enroll"
      - "POST /gifted/screening-cycles, .../advance, .../cut-score-profiles, publish"
      - "POST /gifted/cases/{id}/measure-scores and finalize-scoring"
      - "POST /gifted/cases/{id}/committee-reviews with review_kind=BAND_REVIEW"
      - "POST /gifted/committee-reviews/{id}/conclude"
      - "POST /gifted/cases/{id}/placements"
      - "POST /gifted/placements/{id}/re-evaluations and conclude"
    shared_operations:
      - "POST /gifted/cases (pathway UNIVERSAL_SCREEN or TRANSFER_HONOR)"
      - "POST /gifted/placements/{id}/withdraw"
      - "all GET endpoints"
  - name: ReferringEducator
    description: "Teacher/other educator submitting referrals and supporting appeals"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /gifted/cases (pathway REFERRAL, referral_source=TEACHER)"
      - "POST /gifted/cases/{id}/committee-reviews with review_kind=APPEAL"
      - "all GET endpoints"
  - name: ParentGuardian
    description: "Parent/guardian of a student; ownership-scoped via primary_guardian_user_id"
    identity: opaque
    exclusive_operations:
      - "POST /gifted/placements/{id}/accept and decline (own student only)"
    shared_operations:
      - "POST /gifted/cases (pathway REFERRAL with referral_source=PARENT)"
      - "POST /gifted/cases/{id}/committee-reviews with review_kind=APPEAL (own student only)"
      - "POST /gifted/placements/{id}/withdraw (own student only)"
      - "all GET endpoints"
  - name: CommitteeMember
    description: "Portfolio/appeals review committee voter"
    identity: opaque
    exclusive_operations:
      - "POST /gifted/committee-reviews/{id}/votes (subject to conflict-of-interest and one-vote rules)"
    shared_operations:
      - "all GET endpoints"
  - name: SpecialEdCoordinator
    description: "Special-education liaison for twice-exceptional coordination"
    identity: opaque
    exclusive_operations:
      - "POST /gifted/students/{id}/sped-plans"
    shared_operations:
      - "all GET endpoints"
