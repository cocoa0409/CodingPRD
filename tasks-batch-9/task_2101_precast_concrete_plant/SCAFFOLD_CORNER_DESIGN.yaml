              payload: {}
              as: PermitCoordinator
              as_user_id: "pc-erin"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == ERR_UNAUTHORIZED with HTTP 403"
            - "${err_id} != ERR_MIX_DESIGN_NOT_FOUND"

