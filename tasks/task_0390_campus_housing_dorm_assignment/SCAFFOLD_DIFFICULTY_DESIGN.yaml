# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Campus Housing & Dorm Assignment — 9 rules x 2 instances = 18 instances
# Every grounds[] ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Every setup_api_calls/trigger call resolves to a §1.5 endpoint.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: damage_split_sole_vs_shared_on_damage_charge
        grounds:
          - calculations.damage_billing_split
          - state_machines.DamageCharge.PENDING_to_BILLED
          - entities.DamageCharge.fields.amount_cents
          - entities.DamageCharge.fields.split_basis
        distinguishing_aspect: |
          On the DamageCharge entity domain, the SOLE variant bills full
          assessed_cents (10000) while the SHARED variant floor-divides 10000
          across 3 ACTIVE occupants (3333) with the billed resident absorbing
          the remainder (3334) — same assessed input, two different amount_cents.
        test_recipe:
          setup:
            - "A DOUBLE room and a TRIPLE room with three ACTIVE assignments on the triple"
            - "One SOLE DamageCharge of assessed 10000 on a single-occupant room; one SHARED DamageCharge of assessed 10000 on the 3-occupant room"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Sole Sam", class_year: SENIOR, gender_identity: NONBINARY, lottery_number: 10 }
              as: HousingOfficer
              captures: { sole_student_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Tri A", class_year: SENIOR, gender_identity: NONBINARY, lottery_number: 11 }
              as: HousingOfficer
              captures: { tri_a_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Tri B", class_year: SENIOR, gender_identity: NONBINARY, lottery_number: 12 }
              as: HousingOfficer
              captures: { tri_b_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Tri C", class_year: SENIOR, gender_identity: NONBINARY, lottery_number: 13 }
              as: HousingOfficer
              captures: { tri_c_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "North Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { bldg_id: $.data.id }
            - call: "POST /buildings/${bldg_id}/rooms"
              payload: { room_number: "S1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { single_room_id: $.data.id }
            - call: "POST /buildings/${bldg_id}/rooms"
              payload: { room_number: "T1", room_type: TRIPLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { triple_room_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "FALL_2026" }
              as: HousingOfficer
              captures: { cycle_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cycle_id}", student_id: "${sole_student_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: SINGLE }
              as: Student
              as_user_id: "${sole_student_id}"
              captures: { sole_app_id: $.data.id }
            - call: "POST /applications/${sole_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${sole_student_id}"
            - call: "POST /applications"
              payload: { cycle_id: "${cycle_id}", student_id: "${tri_a_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: TRIPLE }
              as: Student
              as_user_id: "${tri_a_id}"
              captures: { tri_a_app_id: $.data.id }
            - call: "POST /applications/${tri_a_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${tri_a_id}"
            - call: "POST /applications"
              payload: { cycle_id: "${cycle_id}", student_id: "${tri_b_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: TRIPLE }
              as: Student
              as_user_id: "${tri_b_id}"
              captures: { tri_b_app_id: $.data.id }
            - call: "POST /applications/${tri_b_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${tri_b_id}"
            - call: "POST /applications"
              payload: { cycle_id: "${cycle_id}", student_id: "${tri_c_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: TRIPLE }
              as: Student
              as_user_id: "${tri_c_id}"
              captures: { tri_c_app_id: $.data.id }
            - call: "POST /applications/${tri_c_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${tri_c_id}"
            - call: "POST /housing-cycles/${cycle_id}/run-lottery"
              payload: {}
              as: HousingOfficer
            - call: "POST /housing-cycles/${cycle_id}/open-assignment"
              payload: {}
              as: HousingOfficer
            - call: "GET /applications/${sole_app_id}"
              payload: {}
              as: HousingOfficer
              captures: { sole_app_v: $.data.version }
            - call: "POST /applications/${sole_app_id}/accept"
              payload: { expected_application_version: "${sole_app_v}" }
              as: Student
              as_user_id: "${sole_student_id}"
              captures: { sole_assignment_id: $.data.id }
            - call: "GET /applications/${tri_a_app_id}"
              payload: {}
              as: HousingOfficer
              captures: { tri_a_app_v: $.data.version }
            - call: "POST /applications/${tri_a_app_id}/accept"
              payload: { expected_application_version: "${tri_a_app_v}" }
              as: Student
              as_user_id: "${tri_a_id}"
              captures: { tri_a_assignment_id: $.data.id }
            - call: "GET /applications/${tri_b_app_id}"
              payload: {}
              as: HousingOfficer
              captures: { tri_b_app_v: $.data.version }
            - call: "POST /applications/${tri_b_app_id}/accept"
              payload: { expected_application_version: "${tri_b_app_v}" }
              as: Student
              as_user_id: "${tri_b_id}"
            - call: "GET /applications/${tri_c_app_id}"
              payload: {}
              as: HousingOfficer
              captures: { tri_c_app_v: $.data.version }
            - call: "POST /applications/${tri_c_app_id}/accept"
              payload: { expected_application_version: "${tri_c_app_v}" }
              as: Student
              as_user_id: "${tri_c_id}"
            - call: "POST /damage-charges"
              payload: { assignment_id: "${sole_assignment_id}", category: REPAIR, assessed_cents: 10000, split_basis: SOLE }
              as: HousingOfficer
              captures: { sole_charge_id: $.data.id }
            - call: "POST /damage-charges"
              payload: { assignment_id: "${tri_a_assignment_id}", category: REPAIR, assessed_cents: 10000, split_basis: SHARED }
              as: HousingOfficer
              captures: { shared_charge_id: $.data.id }
          trigger:
            - call: "POST /damage-charges/${sole_charge_id}/bill"
              payload: {}
              as: HousingOfficer
              captures: { sole_amount: $.data.amount_cents }
            - call: "POST /damage-charges/${shared_charge_id}/bill"
              payload: {}
              as: HousingOfficer
              captures: { shared_amount: $.data.amount_cents }
          assert:
            - "DamageCharge.${sole_charge_id}.amount_cents == 10000"
            - "DamageCharge.${shared_charge_id}.amount_cents == 3334"
            - "DamageCharge.${sole_charge_id}.amount_cents != DamageCharge.${shared_charge_id}.amount_cents"

      - name: lottery_strict_vs_open_preference_on_application
        grounds:
          - calculations.lottery_offer_selection
          - state_machines.Application.SUBMITTED_to_OFFERED
          - state_machines.Application.SUBMITTED_to_WAITLISTED
          - entities.Application.fields.preferred_room_type
        distinguishing_aspect: |
          On the Application entity domain, the strict_preference variant
          (preferred_room_type=SUITE_DOUBLE) yields WAITLISTED when only a
          DOUBLE is OPEN, while the open_preference variant (NO_PREFERENCE) on
          an identical pool is OFFERED that same DOUBLE — same room inventory,
          two different Application.status outcomes.
        test_recipe:
          setup:
            - "One OPEN DOUBLE room, no SUITE_DOUBLE rooms"
            - "Two SUBMITTED applications: one demanding SUITE_DOUBLE, one with NO_PREFERENCE"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Strict Stu", class_year: JUNIOR, gender_identity: FEMALE, lottery_number: 5 }
              as: HousingOfficer
              captures: { strict_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Open Ollie", class_year: FRESHMAN, gender_identity: FEMALE, lottery_number: 6 }
              as: HousingOfficer
              captures: { open_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "West Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { wb_id: $.data.id }
            - call: "POST /buildings/${wb_id}/rooms"
              payload: { room_number: "D1", room_type: DOUBLE, gender_inclusivity: SINGLE_GENDER }
              as: HousingOfficer
              captures: { dbl_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "SPRING_2027" }
              as: HousingOfficer
              captures: { cyc2_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc2_id}", student_id: "${strict_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: SUITE_DOUBLE }
              as: Student
              as_user_id: "${strict_id}"
              captures: { strict_app_id: $.data.id }
            - call: "POST /applications/${strict_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${strict_id}"
            - call: "POST /applications"
              payload: { cycle_id: "${cyc2_id}", student_id: "${open_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: NO_PREFERENCE }
              as: Student
              as_user_id: "${open_id}"
              captures: { open_app_id: $.data.id }
            - call: "POST /applications/${open_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${open_id}"
          trigger:
            - call: "POST /housing-cycles/${cyc2_id}/run-lottery"
              payload: {}
              as: HousingOfficer
          assert:
            - "Application.${strict_app_id}.status == WAITLISTED"
            - "Application.${open_app_id}.status == OFFERED"
            - "Application.${open_app_id}.offered_room_id == ${dbl_id}"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: lottery_tightest_fit_multi_input_branch_mode_a
        grounds:
          - calculations.lottery_offer_selection
          - state_machines.Application.SUBMITTED_to_OFFERED
          - entities.Application.fields.priority_rank
          - entities.Room.fields.occupied_bed_count
        distinguishing_aspect: |
          Mode (a): the room pick is a >=3-input non-linear branch — eligibility
          filters on (status OPEN, free bed, building-type match, room-type match,
          gender), then tightest-fit ranking (fewest free beds first). With a
          DOUBLE already holding 1 occupant (1 free) and an empty TRIPLE (3 free),
          the senior candidate is offered the DOUBLE, not the TRIPLE.
        test_recipe:
          setup:
            - "A DOUBLE with one ACTIVE occupant (1 free bed) and an empty TRIPLE (3 free beds), both OPEN, NO_PREFERENCE candidate"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Seed Occupant", class_year: SENIOR, gender_identity: MALE, lottery_number: 1 }
              as: HousingOfficer
              captures: { occ_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Tight Fit", class_year: SENIOR, gender_identity: MALE, lottery_number: 2 }
              as: HousingOfficer
              captures: { tight_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "East Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { eb_id: $.data.id }
            - call: "POST /buildings/${eb_id}/rooms"
              payload: { room_number: "D9", room_type: DOUBLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { d9_id: $.data.id }
            - call: "POST /buildings/${eb_id}/rooms"
              payload: { room_number: "T9", room_type: TRIPLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { t9_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "FALL_2026B" }
              as: HousingOfficer
              captures: { cyc3_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc3_id}", student_id: "${occ_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: DOUBLE }
              as: Student
              as_user_id: "${occ_id}"
              captures: { occ_app_id: $.data.id }
            - call: "POST /applications/${occ_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${occ_id}"
            - call: "POST /housing-cycles/${cyc3_id}/run-lottery"
              payload: {}
              as: HousingOfficer
            - call: "POST /housing-cycles/${cyc3_id}/open-assignment"
              payload: {}
              as: HousingOfficer
            - call: "GET /applications/${occ_app_id}"
              payload: {}
              as: HousingOfficer
              captures: { occ_app_v: $.data.version }
            - call: "POST /applications/${occ_app_id}/accept"
              payload: { expected_application_version: "${occ_app_v}" }
              as: Student
              as_user_id: "${occ_id}"
            - call: "POST /housing-cycles"
              payload: { term_label: "FALL_2026C" }
              as: HousingOfficer
              captures: { cyc3b_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${cyc3b_id}", student_id: "${tight_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: NO_PREFERENCE }
              as: Student
              as_user_id: "${tight_id}"
              captures: { tight_app_id: $.data.id }
            - call: "POST /applications/${tight_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${tight_id}"
          trigger:
            - call: "POST /housing-cycles/${cyc3b_id}/run-lottery"
              payload: {}
              as: HousingOfficer
          assert:
            - "Application.${tight_app_id}.status == OFFERED"
            - "Application.${tight_app_id}.offered_room_id == ${d9_id}"

      - name: damage_shared_floor_then_remainder_order_mode_b
        grounds:
          - calculations.damage_billing_split
          - state_machines.DamageCharge.PENDING_to_BILLED
          - entities.DamageCharge.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): rounding order is pinned — floor(assessed/occupants) FIRST,
          then the single remainder is added to the billed resident, NOT
          distributed. assessed 9001 over 2 ACTIVE occupants gives base 4500 and
          remainder 1, so the billed resident owes 4501 (sum-then-round would
          give 4500.5 -> 4501 only by luck; the pinned order makes 4501 exact).
        test_recipe:
          setup:
            - "A DOUBLE room with two ACTIVE assignments; one SHARED DamageCharge assessed 9001 against one of them"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Pair One", class_year: SENIOR, gender_identity: FEMALE, lottery_number: 20 }
              as: HousingOfficer
              captures: { p1_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Pair Two", class_year: SENIOR, gender_identity: FEMALE, lottery_number: 21 }
              as: HousingOfficer
              captures: { p2_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Pair Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { pb_id: $.data.id }
            - call: "POST /buildings/${pb_id}/rooms"
              payload: { room_number: "P1", room_type: DOUBLE, gender_inclusivity: SINGLE_GENDER }
              as: HousingOfficer
              captures: { proom_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "FALL_2026D" }
              as: HousingOfficer
              captures: { pcyc_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${pcyc_id}", student_id: "${p1_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: DOUBLE }
              as: Student
              as_user_id: "${p1_id}"
              captures: { p1_app_id: $.data.id }
            - call: "POST /applications/${p1_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${p1_id}"
            - call: "POST /applications"
              payload: { cycle_id: "${pcyc_id}", student_id: "${p2_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: DOUBLE }
              as: Student
              as_user_id: "${p2_id}"
              captures: { p2_app_id: $.data.id }
            - call: "POST /applications/${p2_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${p2_id}"
            - call: "POST /housing-cycles/${pcyc_id}/run-lottery"
              payload: {}
              as: HousingOfficer
            - call: "POST /housing-cycles/${pcyc_id}/open-assignment"
              payload: {}
              as: HousingOfficer
            - call: "GET /applications/${p1_app_id}"
              payload: {}
              as: HousingOfficer
              captures: { p1_app_v: $.data.version }
            - call: "POST /applications/${p1_app_id}/accept"
              payload: { expected_application_version: "${p1_app_v}" }
              as: Student
              as_user_id: "${p1_id}"
              captures: { p1_assignment_id: $.data.id }
            - call: "GET /applications/${p2_app_id}"
              payload: {}
              as: HousingOfficer
              captures: { p2_app_v: $.data.version }
            - call: "POST /applications/${p2_app_id}/accept"
              payload: { expected_application_version: "${p2_app_v}" }
              as: Student
              as_user_id: "${p2_id}"
            - call: "POST /damage-charges"
              payload: { assignment_id: "${p1_assignment_id}", category: REPLACEMENT, assessed_cents: 9001, split_basis: SHARED }
              as: HousingOfficer
              captures: { pc_charge_id: $.data.id }
          trigger:
            - call: "POST /damage-charges/${pc_charge_id}/bill"
              payload: {}
              as: HousingOfficer
              captures: { pc_amount: $.data.amount_cents }
          assert:
            - "DamageCharge.${pc_charge_id}.amount_cents == 4501"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: roommate_group_cyclic_lock_reopen
        grounds:
          - state_machines.RoommateGroup.FORMING_to_LOCKED
          - state_machines.RoommateGroup.LOCKED_to_FORMING
          - entities.RoommateGroup.fields.status
        distinguishing_aspect: |
          RoommateGroup is cyclic: FORMING -> LOCKED -> FORMING via lock then
          reopen, returning to the same FORMING state — a non-linear loop on the
          RoommateGroup entity (distinct from the Assignment swap cycle).
        test_recipe:
          setup:
            - "A FORMING roommate group of target_size 2 with owner + one ACCEPTED invitee (accepted_member_count == 2)"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Owner O", class_year: JUNIOR, gender_identity: MALE, lottery_number: 30 }
              as: HousingOfficer
              captures: { owner_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Mate M", class_year: JUNIOR, gender_identity: MALE, lottery_number: 31 }
              as: HousingOfficer
              captures: { mate_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "FALL_2026E" }
              as: HousingOfficer
              captures: { gcyc_id: $.data.id }
            - call: "POST /roommate-groups"
              payload: { cycle_id: "${gcyc_id}", owner_student_id: "${owner_id}", target_size: 2 }
              as: Student
              as_user_id: "${owner_id}"
              captures: { grp_id: $.data.id }
            - call: "POST /roommate-groups/${grp_id}/memberships"
              payload: { student_id: "${mate_id}" }
              as: Student
              as_user_id: "${owner_id}"
              captures: { mem_id: $.data.id }
            - call: "POST /roommate-groups/${grp_id}/memberships/${mem_id}/accept"
              payload: {}
              as: Student
              as_user_id: "${mate_id}"
            - call: "POST /roommate-groups/${grp_id}/lock"
              payload: {}
              as: Student
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /roommate-groups/${grp_id}/reopen"
              payload: {}
              as: Student
              as_user_id: "${owner_id}"
          assert:
            - "RoommateGroup.${grp_id}.status == FORMING"
            - "RoommateGroup.${grp_id}.accepted_member_count == 2"

      - name: assignment_swap_cyclic_pending_back_to_active
        grounds:
          - state_machines.Assignment.ACTIVE_to_SWAP_PENDING
          - state_machines.Assignment.SWAP_PENDING_to_ACTIVE
          - entities.Assignment.fields.status
          - entities.Assignment.fields.room_id
        distinguishing_aspect: |
          Assignment is cyclic on a different entity than RoommateGroup:
          ACTIVE -> SWAP_PENDING -> ACTIVE via propose-swap then confirm-swap,
          and confirm exchanges room_id between the two legs.
        test_recipe:
          setup:
            - "Two ACTIVE assignments in two ALL_GENDER rooms, both students compatible with both rooms, cycle in ASSIGNMENT_OPEN"
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Swap A", class_year: SENIOR, gender_identity: NONBINARY, lottery_number: 40 }
              as: HousingOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Swap B", class_year: SENIOR, gender_identity: NONBINARY, lottery_number: 41 }
              as: HousingOfficer
              captures: { sb_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Swap Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { swb_id: $.data.id }
            - call: "POST /buildings/${swb_id}/rooms"
              payload: { room_number: "RA", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { room_a_id: $.data.id }
            - call: "POST /buildings/${swb_id}/rooms"
              payload: { room_number: "RB", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { room_b_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "FALL_2026F" }
              as: HousingOfficer
              captures: { scyc_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${scyc_id}", student_id: "${sa_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: SINGLE }
              as: Student
              as_user_id: "${sa_id}"
              captures: { sa_app_id: $.data.id }
            - call: "POST /applications/${sa_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${sa_id}"
            - call: "POST /applications"
              payload: { cycle_id: "${scyc_id}", student_id: "${sb_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: SINGLE }
              as: Student
              as_user_id: "${sb_id}"
              captures: { sb_app_id: $.data.id }
            - call: "POST /applications/${sb_app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${sb_id}"
            - call: "POST /housing-cycles/${scyc_id}/run-lottery"
              payload: {}
              as: HousingOfficer
            - call: "POST /housing-cycles/${scyc_id}/open-assignment"
              payload: {}
              as: HousingOfficer
            - call: "GET /applications/${sa_app_id}"
              payload: {}
              as: HousingOfficer
              captures: { sa_app_v: $.data.version, sa_offered_room: $.data.offered_room_id }
