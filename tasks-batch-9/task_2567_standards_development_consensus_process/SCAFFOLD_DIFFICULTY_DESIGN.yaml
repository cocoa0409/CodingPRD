      - name: work_item_public_review_buffer_rejects_a_window_starting_on_the_buffered_edge
        grounds:
          - calculations.review_window_buffer_check
          - validations[priority=115]
          - errors[ERR_REVIEW_WINDOW_BUFFER_CONFLICT]
