          - entities.Form1095C.fields.late_furnishing_penalty_cents
          - entities.GroupMember.fields.furnishing_penalty_total_cents
        distinguishing_aspect: |
          Walks every branch of the tiered_pricing ladder in one recipe with five
          forms of the same member: on-time (0), 13 days late (TIER1 6000), late
          but before the tier-2 cutoff (TIER2 12000), late and on/after the cutoff
          (TIER3 31000), and the intentional_disregard override (TIER4 63000)
          applied to a form that is only 13 days late so the override cannot be
          confused with a tier lookup. The member ledger must sum to 112000.
        test_recipe:
          setup:
            - "PRELUDE with furnishing_deadline_date 2027-03-02 and tier2_cutoff_date 2027-08-01; five MONTHLY employees each with one ORIGINAL form generated by preparer-1."
            - "All five forms are furnished on PAPER so no FurnishingConsent is needed (validations priority 29), and by preparer-2 so segregation of duties at priority 23 is satisfied."
