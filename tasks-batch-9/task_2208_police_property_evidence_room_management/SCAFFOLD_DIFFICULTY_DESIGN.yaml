              captures: { case_status: $.data.status }
          assert:
            - "Before the trigger: EvidenceItem.${item_id}.retention_release_at == '2026-08-01T00:00:00.000Z' (PRELIMINARY, 0 statutory days) and disposition_state == 'RETAINED'"
            - "Before the trigger: PropertyRoom.${room_id}.disposal_eligible_count == 0"
            - "Link 1: the new RetentionDetermination has resolved_basis == 'FINAL', anchor_at == '2026-11-30T00:00:00.000Z', statute_days_applied == 0, computed_release_at == '2026-11-30T00:00:00.000Z' (the 2026-10-30 floor does not bind)"
