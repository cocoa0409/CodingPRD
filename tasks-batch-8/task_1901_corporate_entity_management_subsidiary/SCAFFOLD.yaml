    roles: [CorporateSecretary]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["status -> ACTIVE", "generates AnnualFiling rows per filing_due_date", "increments LegalEntity.version by 1"]
  - method: POST
    path: "/api/entities/{id}/commence-dissolution"
    description: "ACTIVE -> DISSOLUTION_PENDING; withdraws SCHEDULED/PREPARED filings"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["status -> DISSOLUTION_PENDING", "future filings -> WITHDRAWN", "ComplianceEvent(DISSOLUTION_COMMENCED)", "increments LegalEntity.version by 1"]
  - method: POST
    path: "/api/entities/{id}/finalize-dissolution"
    description: "DISSOLUTION_PENDING -> DISSOLVED with appointment/grant revocation cascade"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["status -> DISSOLVED", "dissolved_date set", "appointments -> REMOVED", "grants -> REVOKED (incl. delegated)", "ComplianceEvent rows", "increments LegalEntity.version by 1"]
  - method: POST
    path: "/api/entities/{id}/revoke-dissolution"
    description: "DISSOLUTION_PENDING -> ACTIVE"
    roles: [CorporateSecretary]
    code: 200
    input: []
    output: LegalEntity
    side_effects: ["status -> ACTIVE", "posture recomputed", "increments LegalEntity.version by 1"]

  # --- AgentAppointment ---
  - method: POST
    path: "/api/entities/{id}/agent-appointments"
