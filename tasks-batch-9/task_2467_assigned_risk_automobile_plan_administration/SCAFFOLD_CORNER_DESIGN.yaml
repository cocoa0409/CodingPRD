      - name: deposit_rounds_half_up_and_the_fifteen_thousand_floor_never_binds
        claim_type: precision
        grounds:
          - calculations.required_deposit
          - calculations.required_deposit.constants.DEPOSIT_FLOOR_CENTS
          - calculations.plan_expense_charge
          - entities.Application.fields.required_deposit_cents
        distinguishing_aspect: |
          The 25% deposit lands on a .5 half-cent for the cheapest T02 risk - 155754 * 0.25 is exactly
          38938.5, which must round UP to 38939, not truncate to 38938. The floor is the deliberate
          dead constant: even the cheapest reachable risk (T01 / PLEASURE / 0 points, total 101299)
          still owes 25325, so DEPOSIT_FLOOR_CENTS can never bind - and the certification comparison
          is >=, so paying exactly the required cent count passes.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Two applications exist: a T02 PLEASURE ADULT risk and a T01 PLEASURE ADULT risk, both with no violations and no deposit yet."
