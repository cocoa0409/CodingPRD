      - "is_late/days_late/penalty_status/penalty_amount_cents set"
      - "Committee.total_penalties_cents -> cash_on_hand_cents -> solvency_status recomputed (cascade)"
      - "increments Committee.version by 1"
  - method: POST
    path: "/disclosure/reports/{id}/amend"
    description: "Amend a FILED report: old -> SUPERSEDED, new DRAFT amendment created."
    roles: [Treasurer]
    code: 201
    input: []
    output: Report
    side_effects:
      - "old report status FILED->SUPERSEDED"
