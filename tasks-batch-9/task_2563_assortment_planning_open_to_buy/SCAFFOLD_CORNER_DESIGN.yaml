        distinguishing_aspect: "One endpoint, two entirely different outcomes selected by the row's current commit_status: from PROPOSED it yields WITHDRAWN and touches no PlanMonth field (the row never entered otb_committed_cents), while from COMMITTED it yields CANCELLED and runs cascade-A, releasing the dollars back into otb_open_cents. The cutoff check at priority 35 is scoped to the COMMITTED branch only, so a PROPOSED row can be withdrawn at a clock reading that would reject the cancellation of an otherwise identical COMMITTED row."
