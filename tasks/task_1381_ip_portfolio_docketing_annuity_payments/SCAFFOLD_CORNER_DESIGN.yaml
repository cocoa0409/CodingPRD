            - call: "POST /clients"
              payload: { display_name: "OccRv" }
              as: PlatformAdmin
              captures: { cl_id: $.data.id }

            - call: "POST /clients/${cl_id}/families"
              payload: { title: "OF", first_priority_date: "2026-01-15", budget_cap_cents: 1000000 }
