      - name: occ_correct_version_grant_submit_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[grant-create-stale-account]
          - entities.DonorAccount.fields.committed_grants_cents
          - endpoints.POST /daf/grants
        distinguishing_aspect: "A grant submit carrying the current account version succeeds (201) and increments DonorAccount.version by 1 while raising committed_grants_cents by the grant amount."
        test_recipe:
          setup:
            - "Sponsor; VETTED Charity; ACTIVE account funded 1000000 cash, no grants yet."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Occ2 Sponsor", ein: "27-0000002" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Occ2 Charity", ein: "27-9000002", ntee_code: "A20" }
              as: ComplianceOfficer
