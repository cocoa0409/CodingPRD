      - name: selection_run_partitions_every_lead_or_creates_none
        claim_type: Bulk action
        grounds: ["endpoints.POST /industry-projects/{id}/selection-runs", errors.ERR_NO_ELIGIBLE_CANDIDATES, calculations.taxpayer_risk_score]
        distinguishing_aspect: |
          One run is a bulk operation over the whole industry. With FULL scores 314
          (Harbor) and 172 (Summit) a THRESHOLD project at 400 selects nobody and
          must be rejected atomically with ERR_NO_ELIGIBLE_CANDIDATES (422), leaving
          ZERO AuditLead rows behind rather than a set of NOT_SELECTED leads. A
          second project at 200 must then partition the same two taxpayers into one
          SELECTED (rank 1) and one NOT_SELECTED (rank 2) in a single call, with
          scored_lead_count 2 and last_cutoff_score recorded.
        test_recipe:
          setup:
            - "Two taxpayers in NAICS 445110: Harbor (delinquent_period_count 2, gross 250000000, one information return 120000000/90000000 -> variance 2500) and Summit (delinquent_period_count 1, gross 100000000, no returns). Industry error rate 4200 on both projects, so FULL scores are 314 and 172."
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { legal_name: "Harbor Foods LLC", permit_number: "P-2710-P6A", industry_naics_code: "445110", filing_frequency: "MONTHLY", gross_receipts_annual_cents: 250000000, delinquent_period_count: 2 }
              as: SelectionAnalyst
              captures: { harbor_id: "$.data.id" }
            - call: "POST /information-returns"
              payload: { taxpayer_id: "${harbor_id}", source_type: "FEDERAL_1099K", period_start: "2026-01-01", period_end: "2026-03-31", reported_amount_cents: 120000000, matched_return_amount_cents: 90000000 }
