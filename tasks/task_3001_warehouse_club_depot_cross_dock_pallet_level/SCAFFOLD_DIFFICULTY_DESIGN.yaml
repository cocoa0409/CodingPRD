  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_allocation_on_committed_run_to_frozen_club
        grounds:
          - "validations[priority=6]"
          - "validations[priority=9]"
          - "errors[ERR_INVALID_STATE]"
          - "errors[ERR_CLUB_FROZEN]"
        distinguishing_aspect: |
          Pair (state, business_safety): an allocation POST to a run already
          COMMITTED (state violation, priority 6) that also targets a FROZEN
          club (safety violation, priority 8) MUST return ERR_INVALID_STATE —
          state beats safety.
        test_recipe:
          setup:
            - "Clock 2026-09-02T09:05:00Z; capacity-1 club at FROZEN (one allocation committed to it)"
            - "Run already COMMITTED; a second pallet still RECEIVED is the would-be allocation target"
          setup_api_calls:
            - call: "POST /wcd/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: RegionalOps
