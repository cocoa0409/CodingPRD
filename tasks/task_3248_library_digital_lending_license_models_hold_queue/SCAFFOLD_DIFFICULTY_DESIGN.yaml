# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3248_library_digital_lending_license_models_hold_queue
#
# Depth probe: 2 instances per §0.5 rule, each grounded in SCAFFOLD.yaml
# §1.1–§1.7. All times are logical (POST /lending/_clock/set_current_utc);
# unset clock reads 2026-09-01T00:00:00Z. All currency integers are cents.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: wait_estimate_optimistic_vs_pessimistic_queue_cycles
        grounds:
          - calculations.wait_estimate
          - entities.Hold.fields.optimistic_wait_days
          - entities.Hold.fields.pessimistic_wait_days
          - endpoints.GET_/lending/titles/{id}/availability
        distinguishing_aspect: |
          Wait-time dual variant on the Hold/demand domain: identical queue
          state (H=3 holds ahead, C=1 OCOU copy, loan 21d, renewals 2 x 21d)
          yields optimistic_wait_days == 63 and pessimistic_wait_days == 189 —
          a 3x gap from renewal assumptions alone.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Consortium + library L (loan_period_days 21, renewal_period_days 21, max_renewals 2) + fund + patrons P0..P3 + title T with price_ocou_cents 5000."
            - "One OCOU license with copies 1 fulfilled; P0 holds an ACTIVE loan of T; P1, P2, P3 each hold a PLACED hold on T (P1 earliest)."
          setup_api_calls:
            - &d_clock
              call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ConsortiumAdmin
            - &d_cons
              call: "POST /lending/consortiums"
              payload: { name: "Consortium A", cpc_discount_pct: 0.15, host_share_floor_pct: 0.25 }
              as: ConsortiumAdmin
              captures: { cons_id: $.data.id }
            - &d_lib
              call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library L", residency_region_codes: ["94301"], loan_period_days: 21, renewal_period_days: 21, max_renewals: 2, pickup_window_hours: 72, max_concurrent_loans: 10, max_concurrent_holds: 15, auto_purchase_enabled: false, holds_per_copy_ratio: 4, wait_target_days: 28, auto_purchase_max_cents: 100000 }
              as: ConsortiumAdmin
              captures: { lib_id: $.data.id }
            - &d_fund
              call: "POST /lending/libraries/${lib_id}/budget-funds"
              payload: { fiscal_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", budget_cents: 1000000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { fund_id: $.data.id, fund_v: $.data.version }
            - &d_p0
              call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-0", full_name: "Patron Zero", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat0_id: $.data.id }
            - &d_title
              call: "POST /lending/consortiums/${cons_id}/titles"
              payload: { isbn: "9780000000001", name: "Title T", author: "Author A", price_ocou_cents: 5000, metered_time_price_cents: 4000, metered_time_days: 365, metered_circ_price_cents: 3000, metered_circ_count: 26, cpc_price_per_circ_cents: 199, simultaneous_use_price_cents: 9000, simultaneous_use_days: 180 }
              as: ConsortiumAdmin
              captures: { title_id: $.data.id }
            - &d_order
              call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${title_id}", model: "OCOU", copies: 1, expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { order_id: $.data.id }
            - &d_propose
              call: "POST /lending/acquisition-orders/${order_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - &d_approve
              call: "POST /lending/acquisition-orders/${order_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - &d_fulfill
              call: "POST /lending/acquisition-orders/${order_id}/fulfill"
              payload: { invoiced_cost_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - &d_checkout0
              call: "POST /lending/loans"
              payload: { patron_id: "${pat0_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat0_id}"
            - &d_p1
              call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-1", full_name: "Patron One", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat1_id: $.data.id }
            - &d_p2
              call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-2", full_name: "Patron Two", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat2_id: $.data.id }
            - &d_p3
              call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-3", full_name: "Patron Three", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat3_id: $.data.id }
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat2_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat2_id}"
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat3_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat3_id}"
              captures: { hold3_id: $.data.id }
          trigger:
            - call: "GET /lending/holds/${hold3_id}"
              payload: {}
              as: Patron
              as_user_id: "${pat3_id}"
            - call: "GET /lending/titles/${title_id}/availability"
              payload: { library_id: "${lib_id}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "Hold.${hold3_id}.optimistic_wait_days == 63 (ceil(3/1) * 21)"
            - "Hold.${hold3_id}.pessimistic_wait_days == 189 (ceil(3/1) * (21 + 2*21))"
            - "availability.copies_available == 0 and availability.active_holds == 3"
            - "availability.pessimistic_wait_days - availability.optimistic_wait_days == 126, the renewal-assumption delta"

      - name: fund_availability_committed_vs_actual_gap
        grounds:
          - calculations.fund_availability
          - entities.BudgetFund.fields.available_committed_cents
          - entities.BudgetFund.fields.available_actual_cents
        distinguishing_aspect: |
          Fund-availability dual variant on the fiscal-ledger domain (different
          entity domain from the Hold wait estimate): with one APPROVED order
          (estimate 5000) on a 1000000-cent fund, available_committed_cents ==
          995000 while available_actual_cents == 1000000 on identical inputs.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Consortium, library, fund (budget 1000000), title T (price_ocou_cents 5000)."
            - "One OCOU order proposed and approved but NOT fulfilled."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - *d_title
            - *d_order
            - *d_propose
            - *d_approve
          trigger:
            - call: "GET /lending/budget-funds/${fund_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "BudgetFund.${fund_id}.committed_cents == 5000"
            - "BudgetFund.${fund_id}.spent_cents == 0"
            - "BudgetFund.${fund_id}.available_committed_cents == 995000"
            - "BudgetFund.${fund_id}.available_actual_cents == 1000000"
            - "the two variants diverge by exactly the 5000-cent commitment"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: cpc_per_event_rounding_beats_sum_then_round
        grounds:
          - calculations.checkout_charge_cpc
          - entities.Loan.fields.circ_price_charged_cents
          - entities.BudgetFund.fields.cpc_accrued_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: at list price 299 and consortium discount
          0.25 the pinned per-event round-then-sum rule charges 224 per checkout
          (round_half_up(299*0.75)=224.25->224), so 3 checkouts accrue 672 —
          one cent less than the 673 a sum-then-round implementation yields
          (round_half_up(672.75)).
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Consortium with cpc_discount_pct 0.25; library L; fund; patrons P0, P1, P2; title T with cpc_price_per_circ_cents 299."
            - "One COST_PER_CIRC license (prepaid 5000) fulfilled and ACTIVE."
          setup_api_calls:
            - *d_clock
            - call: "POST /lending/consortiums"
              payload: { name: "Consortium CPC", cpc_discount_pct: 0.25, host_share_floor_pct: 0.25 }
              as: ConsortiumAdmin
              captures: { cons_id: $.data.id }
            - *d_lib
            - *d_fund
            - *d_p0
            - *d_p1
            - *d_p2
            - call: "POST /lending/consortiums/${cons_id}/titles"
              payload: { isbn: "9780000000002", name: "Title CPC", author: "Author B", price_ocou_cents: 5000, metered_time_price_cents: 4000, metered_time_days: 365, metered_circ_price_cents: 3000, metered_circ_count: 26, cpc_price_per_circ_cents: 299, simultaneous_use_price_cents: 9000, simultaneous_use_days: 180 }
              as: ConsortiumAdmin
              captures: { title_id: $.data.id }
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${title_id}", model: "COST_PER_CIRC", prepaid_balance_cents: 5000, expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { order_id: $.data.id }
            - *d_propose
            - *d_approve
            - *d_fulfill
          trigger:
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat0_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat0_id}"
              captures: { loan0_id: $.data.id }
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat2_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat2_id}"
            - call: "GET /lending/licenses"
              payload: { title_id: "${title_id}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "GET /lending/budget-funds/${fund_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "Loan.${loan0_id}.circ_price_charged_cents == 224 (round_half_up(299 * 0.75) = round_half_up(224.25))"
            - "License.balance_cents == 5000 - 3*224 == 4328"
            - "BudgetFund.${fund_id}.cpc_accrued_cents == 672, not the 673 that sum-then-round produces"

      - name: consortium_allocation_host_floor_prorata_remainder
        grounds:
          - calculations.consortium_allocation
          - entities.ConsortiumInvoice.fields.lines
        distinguishing_aspect: |
          Mode (a) nested min/max with conditional floor: invoiced 10000, host
          floor 25%, checkouts host=10 / A=50 / B=40 -> host is floored to 2500
          (raw share 1000 < floor), the 7500 remainder splits pro-rata
          (A 4167, B 3333), and lines sum exactly to the invoice total.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Consortium (host_share_floor_pct 0.25) with libraries H, A, B (each with fund); patrons PH (home H), PA (home A), PB (home B)."
            - "Title TS with sharing_scope CONSORTIUM; H fulfilled an OCOU order (copies 1, invoiced 10000) creating license LS."
            - "Between 2026-09-02 and 2026-09-11: PH borrows TS 10 times (checkout/return cycle), PA 50 times, PB 40 times."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library H", residency_region_codes: ["94301"], loan_period_days: 21, renewal_period_days: 21, max_renewals: 2, max_concurrent_loans: 10, max_concurrent_holds: 15, auto_purchase_enabled: false }
              as: ConsortiumAdmin
              captures: { libh_id: $.data.id }
            - call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library A", residency_region_codes: ["94301"], loan_period_days: 21, renewal_period_days: 21, max_renewals: 2, max_concurrent_loans: 10, max_concurrent_holds: 15, auto_purchase_enabled: false }
              as: ConsortiumAdmin
              captures: { liba_id: $.data.id }
            - call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library B", residency_region_codes: ["94301"], loan_period_days: 21, renewal_period_days: 21, max_renewals: 2, max_concurrent_loans: 10, max_concurrent_holds: 15, auto_purchase_enabled: false }
              as: ConsortiumAdmin
              captures: { libb_id: $.data.id }
            - call: "POST /lending/libraries/${libh_id}/budget-funds"
              payload: { fiscal_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", budget_cents: 1000000 }
              as: LibraryAdmin
              as_user_id: "${libh_id}"
              captures: { fundh_id: $.data.id, fundh_v: $.data.version }
            - call: "POST /lending/libraries/${libh_id}/patrons"
              payload: { external_card_number: "PH-1", full_name: "Patron H", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${libh_id}"
              captures: { path_id: $.data.id }
            - call: "POST /lending/libraries/${liba_id}/patrons"
              payload: { external_card_number: "PA-1", full_name: "Patron A", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${liba_id}"
              captures: { pata_id: $.data.id }
            - call: "POST /lending/libraries/${libb_id}/patrons"
              payload: { external_card_number: "PB-1", full_name: "Patron B", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${libb_id}"
              captures: { patb_id: $.data.id }
            - call: "POST /lending/consortiums/${cons_id}/titles"
              payload: { isbn: "9780000000003", name: "Title Shared", author: "Author C", price_ocou_cents: 10000, metered_time_price_cents: 4000, metered_time_days: 365, metered_circ_price_cents: 3000, metered_circ_count: 26, cpc_price_per_circ_cents: 199, simultaneous_use_price_cents: 9000, simultaneous_use_days: 180, sharing_scope: "CONSORTIUM" }
              as: ConsortiumAdmin
              captures: { titles_id: $.data.id }
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${libh_id}", budget_fund_id: "${fundh_id}", title_id: "${titles_id}", model: "OCOU", copies: 1, expected_budget_fund_version: "${fundh_v}" }
              as: LibraryAdmin
              as_user_id: "${libh_id}"
              captures: { orderh_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${orderh_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${libh_id}"
            - call: "POST /lending/acquisition-orders/${orderh_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${libh_id}"
            - call: "POST /lending/acquisition-orders/${orderh_id}/fulfill"
              payload: { invoiced_cost_cents: 10000 }
              as: LibraryAdmin
              as_user_id: "${libh_id}"
            - call: "POST /lending/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ConsortiumAdmin
            - call: "POST /lending/loans"
              payload: { patron_id: "${path_id}", title_id: "${titles_id}" }
              as: Patron
              as_user_id: "${path_id}"
              captures: { loanh_id: $.data.id }
            - call: "POST /lending/loans/${loanh_id}/return"
              payload: {}
              as: Patron
              as_user_id: "${path_id}"
            - call: "POST /lending/_ops/run_epoch"
              payload: {}
              as: ConsortiumAdmin
              captures: { epoch1: $.data }
            - call: "POST /lending/_events/drive_circulation"
              payload: { title_id: "${titles_id}", by_library: [ { library_id: "${libh_id}", patron_id: "${path_id}", checkouts: 9 }, { library_id: "${liba_id}", patron_id: "${pata_id}", checkouts: 50 }, { library_id: "${libb_id}", patron_id: "${patb_id}", checkouts: 40 } ] }
              as: ConsortiumAdmin
          trigger:
            - call: "POST /lending/consortiums/${cons_id}/invoices/generate"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z" }
              as: ConsortiumAdmin
              captures: { inv_id: $.data.id }
          assert:
            - "invoice line for ${libh_id}.share_cents == 2500 (max(round_half_up(10000*10/100), round_half_up(10000*0.25)) = max(1000, 2500))"
            - "invoice line for ${liba_id}.share_cents == 4167 (round_half_up(7500*50/90))"
            - "invoice line for ${libb_id}.share_cents == 3333 (round_half_up(7500*40/90))"
            - "ConsortiumInvoice.${inv_id}.total_cents == 10000 and lines sum to it exactly (residual 0)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: hold_suspend_resume_cycle_preserves_queue_rank
        grounds:
          - state_machines.Hold.PLACED_to_SUSPENDED
          - state_machines.Hold.SUSPENDED_to_PLACED
          - entities.Hold.fields.placed_at
        distinguishing_aspect: |
          Cyclic machine on Hold: H1 (older) suspends, a freed copy skips the
          SUSPENDED H1 and promotes H2, H1 resumes and keeps its original
          placed_at — the cycle does not requeue H1 behind H2.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Library L with fund; patrons P0..P2; title T; OCOU license copies 1; P0 has the ACTIVE loan; H1 (P1, placed first) and H2 (P2) are PLACED."
            - "H1 is SUSPENDED before the return."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - *d_lib
            - *d_fund
            - *d_p0
            - *d_p1
            - *d_p2
            - *d_title
            - *d_order
            - *d_propose
            - *d_approve
            - *d_fulfill
            - *d_checkout0
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat1_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
              captures: { h1_id: $.data.id, h1_placed_at: $.data.placed_at }
            - call: "POST /lending/holds"
              payload: { patron_id: "${pat2_id}", title_id: "${title_id}" }
              as: Patron
              as_user_id: "${pat2_id}"
              captures: { h2_id: $.data.id }
            - call: "POST /lending/holds/${h1_id}/suspend"
              payload: {}
              as: Patron
              as_user_id: "${pat1_id}"
          trigger:
            - call: "GET /lending/loans"
              payload: { patron_id: "${pat0_id}", status: "ACTIVE" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { loan0_id: "$.data[0].id" }
            - call: "POST /lending/loans/${loan0_id}/return"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
            - call: "POST /lending/holds/${h1_id}/resume"
              payload: {}
              as: Patron
              as_user_id: "${pat1_id}"
          assert:
            - "after the return, Hold.${h2_id}.status == READY while Hold.${h1_id}.status == SUSPENDED (suspended holds are skipped, not promoted)"
            - "Hold.${h1_id}.suspension_count == 1"
            - "after resume, Hold.${h1_id}.status == PLACED and Hold.${h1_id}.placed_at == ${h1_placed_at} (rank key preserved across the cycle)"

      - name: invoice_dispute_reissue_cycle_recomputes_lines
        grounds:
          - state_machines.ConsortiumInvoice.ISSUED_to_DISPUTED
          - state_machines.ConsortiumInvoice.DISPUTED_to_ISSUED
          - calculations.consortium_allocation
        distinguishing_aspect: |
          Cyclic machine on ConsortiumInvoice: an invoice issued with zero
          checkouts allocates 100% to the host; after a dispute, one non-host
          checkout, and re-issue, the recomputed lines shift 5000 cents to the
          non-host library — the DISPUTED->ISSUED loop is not idempotent.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Consortium (floor 0.25) with libraries H and A (funds open); patrons PH, PA."
            - "Title TS shared (CONSORTIUM); H fulfilled OCOU order invoiced 10000 on 2026-09-01; no checkouts yet."
            - "Invoice generated for September and issued."
          setup_api_calls:
            - *d_clock
            - *d_cons
            - call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library H", residency_region_codes: ["94301"], auto_purchase_enabled: false }
              as: ConsortiumAdmin
              captures: { libh_id: $.data.id }
            - call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library A", residency_region_codes: ["94301"], auto_purchase_enabled: false }
              as: ConsortiumAdmin
              captures: { liba_id: $.data.id }
            - call: "POST /lending/libraries/${libh_id}/budget-funds"
              payload: { fiscal_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", budget_cents: 1000000 }
              as: LibraryAdmin
              as_user_id: "${libh_id}"
              captures: { fundh_id: $.data.id, fundh_v: $.data.version }
            - call: "POST /lending/libraries/${liba_id}/patrons"
              payload: { external_card_number: "PA-1", full_name: "Patron A", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${liba_id}"
              captures: { pata_id: $.data.id }
            - call: "POST /lending/consortiums/${cons_id}/titles"
              payload: { isbn: "9780000000004", name: "Title Shared 2", author: "Author D", price_ocou_cents: 10000, metered_time_price_cents: 4000, metered_time_days: 365, metered_circ_price_cents: 3000, metered_circ_count: 26, cpc_price_per_circ_cents: 199, simultaneous_use_price_cents: 9000, simultaneous_use_days: 180, sharing_scope: "CONSORTIUM" }
              as: ConsortiumAdmin
              captures: { titles2_id: $.data.id }
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${libh_id}", budget_fund_id: "${fundh_id}", title_id: "${titles2_id}", model: "OCOU", copies: 1, expected_budget_fund_version: "${fundh_v}" }
              as: LibraryAdmin
              as_user_id: "${libh_id}"
              captures: { orderh2_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${orderh2_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${libh_id}"
            - call: "POST /lending/acquisition-orders/${orderh2_id}/approve"
