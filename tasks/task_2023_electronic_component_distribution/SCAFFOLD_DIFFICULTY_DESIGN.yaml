              payload: { part_id: "${part_k}", date_code: "202601", qty_received: 250, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust K", credit_limit_cents: 100000000, trailing_12mo_purchases_cents: 990000 }
              as: DistributorAdmin
              captures: { cust_k: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_k}", lines: [ { part_id: "${part_k}", quantity: 200, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_k: $.data.id }
            - call: "POST /orders/${o_k}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_k}"
              as: DistributorAdmin
              captures: { l_k: "$.data[0].id" }
            - call: "GET /parts/${part_k}"
              as: DistributorAdmin
              captures: { part_k_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_k}", expected_part_version: "${part_k_v}" }
              as: DistributorAdmin
              captures: { run_k: $.data.id }
            - call: "POST /allocation-runs/${run_k}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /orders/${o_k}/lines/${l_k}/ship"
              payload: { qty: 200 }
              as: WarehouseOps
            - call: "POST /buy-backs"
              payload: { customer_id: "${cust_k}", order_line_id: "${l_k}", kind: "EXCESS_RETURN", qty: 109 }
              as: SalesRep
              captures: { bb_k1: $.data.id }
            - call: "POST /buy-backs/${bb_k1}/decision"
              payload: { decision: "APPROVE" }
              as: DistributorAdmin
          trigger:
            - call: "POST /buy-backs"
              payload: { customer_id: "${cust_k}", order_line_id: "${l_k}", kind: "EXCESS_RETURN", qty: 1 }
              as: SalesRep
              captures: { bb_k2: $.data.id }
            - call: "POST /buy-backs"
              payload: { customer_id: "${cust_k}", order_line_id: "${l_k}", kind: "EXCESS_RETURN", qty: 1 }
              as: SalesRep
              captures: { bb_k3_err: $.data.error_id }
          assert:
            - "BuyBackRequest.${bb_k1}.provisional_credit_cents == 147150 (109 * 1350)"
            - "bb2 created: used 147150 + 1350 == 148500 == cap exactly -> allowed (inclusive <=); BuyBackRequest.${bb_k2}.provisional_credit_cents == 1350 and .status == REQUESTED"
            - "bb3 rejected: ${bb_k3_err} == ERR_BUYBACK_CAP_EXCEEDED (148500 + 1350 = 149850 > 148500)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_creation_requires_registration_approved
        grounds:
          - state_machines.DesignRegistration.SUBMITTED_to_APPROVED
          - calculations.ship_debit_claim_amounts
          - entities.DesignRegistration.fields.status
        distinguishing_aspect: |
          Entity pair ShipAndDebitClaim <- DesignRegistration: claim
          auto-creation at ship is gated on the registration being APPROVED —
          shipping while SUBMITTED creates no claim, shipping after approval
          does. Distinct pair from the allocation-vs-lot instance.
        test_recipe:
          setup:
            - "Franchised part (standard 1000), lot of 100; registration cost 700 max qty 20 in SUBMITTED"
            - "Order line qty 10 ACKNOWLEDGED and ALLOCATED"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-G", name: "Gate Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_g: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_g}", part_number: "PG-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_g: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_g}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust G", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_g: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_g}", part_id: "${part_g}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 20, valid_from: "2026-08-01", valid_to: "2026-12-31" }
              as: SalesRep
              captures: { reg_g: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_g}", lines: [ { part_id: "${part_g}", quantity: 10, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_g: $.data.id }
            - call: "POST /orders/${o_g}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_g}"
              as: DistributorAdmin
              captures: { l_g: "$.data[0].id" }
            - call: "GET /parts/${part_g}"
              as: DistributorAdmin
              captures: { part_g_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_g}", expected_part_version: "${part_g_v}" }
              as: DistributorAdmin
              captures: { run_g: $.data.id }
            - call: "POST /allocation-runs/${run_g}/publish"
              payload: {}
              as: DistributorAdmin
          trigger:
            - call: "POST /orders/${o_g}/lines/${l_g}/ship"
              payload: { qty: 5 }
              as: WarehouseOps
            - call: "GET /claims?order_line_id=${l_g}"
              as: DistributorAdmin
            - call: "POST /design-registrations/${reg_g}/decision"
              payload: { decision: "APPROVE" }
              as: SupplierAdmin
            - call: "POST /orders/${o_g}/lines/${l_g}/ship"
              payload: { qty: 5 }
              as: WarehouseOps
            - call: "GET /claims?order_line_id=${l_g}"
              as: DistributorAdmin
              captures: { claim_g: "$.data[0].id" }
          assert:
            - "First ship (registration SUBMITTED): GET /claims?order_line_id=${l_g} returns total_count == 0 (no claim auto-created)"
            - "Second ship (registration APPROVED): ShipAndDebitClaim.${claim_g}.qty == 5 and .amount_provisional_cents == 1500 (5 * (1000 - 700))"
            - "DesignRegistration.${reg_g}.registered_qty_remaining == 15"
            - "OrderLine.${l_g}.status == SHIPPED (10 of 10 shipped across both actions)"

      - name: allocation_requires_available_lot
        grounds:
          - state_machines.InventoryLot.IN_INSPECTION_to_AVAILABLE
          - calculations.fair_share_allocation
          - calculations.part_availability
          - errors[ERR_NO_ALLOCATABLE_SUPPLY]
        distinguishing_aspect: |
          Entity pair AllocationRun <- InventoryLot: run creation is gated on
          AVAILABLE supply, which depends on the lot's inspection state — the
          open-market lot in IN_INSPECTION contributes zero supply; only after
          authentication (AVAILABLE) does the run succeed. Distinct pair from
          the claim-vs-registration instance.
        test_recipe:
          setup:
            - "Franchised line/part; one OPEN_MARKET lot qty 50 in IN_INSPECTION (authenticity PENDING_INSPECTION)"
            - "One ACKNOWLEDGED order line qty 10 (open demand exists)"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-A", name: "Auth Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_a: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_a}", part_number: "PA-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_a: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_a}", date_code: "202601", qty_received: 50, source_type: "OPEN_MARKET" }
              as: WarehouseOps
              as_user_id: "wh-01"
              captures: { lot_a: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust A2", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_a2: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_a2}", lines: [ { part_id: "${part_a}", quantity: 10, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_a: $.data.id }
            - call: "POST /orders/${o_a}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_a}"
              as: DistributorAdmin
              captures: { l_a: "$.data[0].id" }
            - call: "GET /parts/${part_a}"
              as: DistributorAdmin
              captures: { part_a_v1: $.data.version }
          trigger:
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_a}", expected_part_version: "${part_a_v1}" }
              as: DistributorAdmin
              captures: { run_err: $.data.error_id }
            - call: "POST /lots/${lot_a}/inspect"
              payload: { disposition: "AUTHENTICATE" }
              as: QualityInspector
              as_user_id: "qi-01"
            - call: "GET /parts/${part_a}"
              as: DistributorAdmin
              captures: { part_a_v2: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_a}", expected_part_version: "${part_a_v2}" }
              as: DistributorAdmin
              captures: { run_a: $.data.id }
          assert:
            - "While the lot is IN_INSPECTION: ${run_err} == ERR_NO_ALLOCATABLE_SUPPLY (AVAILABLE supply is 0)"
            - "After AUTHENTICATE: InventoryLot.${lot_a}.status == AVAILABLE and .authenticity == AUTHENTICATED"
            - "AllocationRun.${run_a} created: total_supply_qty == 50, total_demand_qty == 10, lines == [ { order_line_id: ${l_a}, allocated_qty: 10 } ] (supply >= demand -> full allocation)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: registration_window_touching_conflicts
        grounds:
          - validations[priority=6]
          - errors[ERR_REGISTRATION_WINDOW_OVERLAP]
          - entities.DesignRegistration.fields.valid_from
          - entities.DesignRegistration.fields.valid_to
        distinguishing_aspect: |
          CLOSED-interval semantics on the (customer_id, part_id) registration
          resource: a new window whose valid_from equals the existing window's
          valid_to (touching) conflicts; a window starting the next day does
          not. Different interval geometry from the half-open exposure
          intervals.
        test_recipe:
          setup:
            - "Customer and part exist; one SUBMITTED registration window [2026-08-01, 2026-12-31]"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-W", name: "Window Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_w: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_w}", part_number: "PW-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_w: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust W", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_w: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_w}", part_id: "${part_w}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 20, valid_from: "2026-08-01", valid_to: "2026-12-31" }
              as: SalesRep
              captures: { reg_w1: $.data.id }
          trigger:
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_w}", part_id: "${part_w}", end_customer_name: "EndCo", registered_cost_cents: 710, max_registered_qty: 10, valid_from: "2026-12-31", valid_to: "2027-03-31" }
              as: SalesRep
              captures: { reg_w2_err: $.data.error_id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_w}", part_id: "${part_w}", end_customer_name: "EndCo", registered_cost_cents: 720, max_registered_qty: 10, valid_from: "2027-01-01", valid_to: "2027-06-30" }
              as: SalesRep
              captures: { reg_w3: $.data.id }
          assert:
            - "${reg_w2_err} == ERR_REGISTRATION_WINDOW_OVERLAP (valid_from 2026-12-31 touches the existing CLOSED window ending 2026-12-31)"
            - "DesignRegistration.${reg_w3} created with status SUBMITTED (2027-01-01 is disjoint under closed-interval semantics)"
            - "DesignRegistration.${reg_w1}.status == SUBMITTED (failed insert had no side effects)"

      - name: exposure_interval_nesting_rules
        grounds:
          - errors[ERR_EXPOSURE_ALREADY_OPEN]
          - entities.MoistureExposure.fields.opened_at
          - entities.MoistureExposure.fields.sealed_at
          - calculations.msl_exposure_accrual
        distinguishing_aspect: |
          HALF-OPEN interval semantics on the InventoryLot resource: a second
          open while one interval is unsealed is rejected (nesting), but an
          open stamped exactly at the prior interval's sealed_at is allowed
          (adjacency, gap == 0) — the opposite adjacency treatment from the
          closed registration windows.
        test_recipe:
          setup:
            - "Part floor_life_hours 1000 (no quarantine during the test); AVAILABLE lot"
            - "E1 opened at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-E", name: "Exposure Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_e: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_e}", part_number: "PE-1", msl_level: 3, floor_life_hours: 1000, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_e: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_e}", date_code: "202601", qty_received: 50, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { lot_e: $.data.id }
            - call: "POST /lots/${lot_e}/exposures"
              payload: { note: "E1" }
              as: WarehouseOps
              captures: { exp_e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: DistributorAdmin
          trigger:
            - call: "POST /lots/${lot_e}/exposures"
              payload: { note: "E2 while E1 open" }
              as: WarehouseOps
              captures: { exp_e2_err: $.data.error_id }
            - call: "POST /lots/${lot_e}/exposures/${exp_e1}/seal"
              payload: {}
              as: WarehouseOps
            - call: "POST /lots/${lot_e}/exposures"
              payload: { note: "E3 exactly at E1 sealed_at" }
              as: WarehouseOps
              captures: { exp_e3: $.data.id }
          assert:
            - "${exp_e2_err} == ERR_EXPOSURE_ALREADY_OPEN (nested open rejected)"
            - "MoistureExposure.${exp_e1}.sealed_at == 2026-08-02T00:00:00Z"
            - "MoistureExposure.${exp_e3} created with opened_at == 2026-08-02T00:00:00Z — identical to E1.sealed_at (half-open adjacency allowed)"
            - "GET /lots/${lot_e}/exposures total_count == 2"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: lot_unit_conservation_reserve_release
        grounds:
          - calculations.lot_reservation_fefo
          - state_machines.InventoryLot.AVAILABLE_to_QUARANTINED
          - entities.InventoryLot.fields.qty_received
          - entities.InventoryLot.fields.qty_on_hand
          - entities.InventoryLot.fields.qty_reserved
        distinguishing_aspect: |
          Conserved quantity is PHYSICAL UNITS: qty_received ==
          qty_on_hand + qty_reserved + qty_shipped at every checkpoint —
          reserve (publish), release (quarantine cascade), re-reserve
          (second publish), release (line cancel) all leave the sum at 100.
        test_recipe:
          setup:
            - "Part floor_life_hours 100; lot of 100 AVAILABLE; order line qty 60 ACKNOWLEDGED (ship_date 2026-10-01, cancel_by 2026-09-01)"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-I", name: "Invariant Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_i: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_i}", part_number: "PI-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_i: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_i}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
              captures: { lot_i: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust I", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_i: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_i}", lines: [ { part_id: "${part_i}", quantity: 60, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_i: $.data.id }
            - call: "POST /orders/${o_i}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_i}"
              as: DistributorAdmin
              captures: { l_i: "$.data[0].id" }
            - call: "GET /parts/${part_i}"
              as: DistributorAdmin
              captures: { part_i_v1: $.data.version }
          trigger:
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_i}", expected_part_version: "${part_i_v1}" }
              as: DistributorAdmin
              captures: { run_i1: $.data.id }
            - call: "POST /allocation-runs/${run_i1}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "GET /lots/${lot_i}"
              as: DistributorAdmin
              captures: { lot_i_onhand_1: $.data.qty_on_hand, lot_i_res_1: $.data.qty_reserved }
            - call: "POST /lots/${lot_i}/exposures"
              payload: { note: "kitting" }
              as: WarehouseOps
              captures: { exp_i2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T04:00:00Z" }
              as: DistributorAdmin
            - call: "GET /lots/${lot_i}"
              as: DistributorAdmin
              captures: { lot_i_onhand_2: $.data.qty_on_hand, lot_i_res_2: $.data.qty_reserved }
            - call: "POST /lots/${lot_i}/exposures/${exp_i2}/seal"
              payload: {}
              as: WarehouseOps
            - call: "POST /lots/${lot_i}/bake"
              payload: {}
              as: WarehouseOps
            - call: "GET /parts/${part_i}"
              as: DistributorAdmin
              captures: { part_i_v2: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_i}", expected_part_version: "${part_i_v2}" }
              as: DistributorAdmin
              captures: { run_i2: $.data.id }
            - call: "POST /allocation-runs/${run_i2}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /orders/${o_i}/lines/${l_i}/cancel"
              payload: {}
              as: SalesRep
            - call: "GET /lots/${lot_i}"
              as: DistributorAdmin
              captures: { lot_i_onhand_3: $.data.qty_on_hand, lot_i_res_3: $.data.qty_reserved }
          assert:
            - "After publish: ${lot_i_onhand_1} == 40 and ${lot_i_res_1} == 60 (40 + 60 + 0 == 100)"
            - "After quarantine release: ${lot_i_onhand_2} == 100 and ${lot_i_res_2} == 0 (100 + 0 + 0 == 100)"
            - "After re-publish and line cancel: ${lot_i_onhand_3} == 100 and ${lot_i_res_3} == 0 (invariant holds through the full reserve/release cycle)"
            - "InventoryLot.${lot_i}.qty_received == 100 and .qty_shipped == 0 throughout"

      - name: debit_dollar_conservation_settle_reverse
        grounds:
          - calculations.debit_balance_reconciliation
          - state_machines.ShipAndDebitClaim.SUPPLIER_APPROVED_to_SETTLED
          - state_machines.ShipAndDebitClaim.SETTLED_to_REVERSED
          - entities.ManufacturerLine.fields.open_debit_balance_cents
        distinguishing_aspect: |
          Conserved quantity is MONETARY debit dollars:
          open_debit_balance_cents == sum(SETTLED finals) - sum(REVERSED
          finals) at every step (5600, then 11600, then back to 5600) —
          a different conserved quantity type from physical lot units.
        test_recipe:
          setup:
            - "Franchised part standard 1000; APPROVED registration cost 700 max qty 40"
            - "Order line qty 40 allocated; two ships of 20 produce claim1 and claim2 (qty 20 each); registration EXHAUSTED"
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-$", name: "Debit Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_dl: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_dl}", part_number: "PDL-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_dl: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_dl}", date_code: "202601", qty_received: 100, source_type: "FRANCHISED" }
              as: WarehouseOps
            - call: "POST /customers"
              payload: { name: "Cust DL", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_dl: $.data.id }
            - call: "POST /design-registrations"
              payload: { customer_id: "${cust_dl}", part_id: "${part_dl}", end_customer_name: "EndCo", registered_cost_cents: 700, max_registered_qty: 40, valid_from: "2026-08-01", valid_to: "2026-12-31" }
              as: SalesRep
              captures: { reg_dl: $.data.id }
            - call: "POST /design-registrations/${reg_dl}/decision"
              payload: { decision: "APPROVE" }
              as: SupplierAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_dl}", lines: [ { part_id: "${part_dl}", quantity: 40, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_dl: $.data.id }
            - call: "POST /orders/${o_dl}/acknowledge"
              payload: {}
              as: SalesRep
            - call: "GET /order-lines?order_id=${o_dl}"
              as: DistributorAdmin
              captures: { l_dl: "$.data[0].id" }
            - call: "GET /parts/${part_dl}"
              as: DistributorAdmin
              captures: { part_dl_v: $.data.version }
            - call: "POST /allocation-runs"
              payload: { part_id: "${part_dl}", expected_part_version: "${part_dl_v}" }
              as: DistributorAdmin
              captures: { run_dl: $.data.id }
            - call: "POST /allocation-runs/${run_dl}/publish"
              payload: {}
              as: DistributorAdmin
            - call: "POST /orders/${o_dl}/lines/${l_dl}/ship"
              payload: { qty: 20 }
              as: WarehouseOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T01:00:00Z" }
              as: DistributorAdmin
            - call: "POST /orders/${o_dl}/lines/${l_dl}/ship"
              payload: { qty: 20 }
              as: WarehouseOps
            - call: "GET /claims?order_line_id=${l_dl}"
              as: DistributorAdmin
              captures: { claim_dl1: "$.data[0].id", claim_dl2: "$.data[1].id" }
          trigger:
            - call: "POST /claims/${claim_dl1}/supplier-decision"
              payload: { decision: "APPROVE", audited_cost_cents: 720 }
              as: SupplierAdmin
            - call: "POST /claims/${claim_dl1}/settle"
              payload: {}
              as: SupplierAdmin
            - call: "GET /manufacturer-lines/${line_dl}"
              as: DistributorAdmin
              captures: { bal_1: $.data.open_debit_balance_cents }
            - call: "POST /claims/${claim_dl2}/supplier-decision"
              payload: { decision: "APPROVE" }
              as: SupplierAdmin
            - call: "POST /claims/${claim_dl2}/settle"
              payload: {}
              as: SupplierAdmin
            - call: "GET /manufacturer-lines/${line_dl}"
              as: DistributorAdmin
              captures: { bal_2: $.data.open_debit_balance_cents }
            - call: "POST /claims/${claim_dl1}/reverse"
              payload: { reason: "audit clawback" }
              as: SupplierAdmin
            - call: "GET /manufacturer-lines/${line_dl}"
              as: DistributorAdmin
              captures: { bal_3: $.data.open_debit_balance_cents }
          assert:
