        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the loyalty tier is keyed on the step-4
          pre_discount_total of 30100 (BASIC_300 9900 + AERIAL 5000 + make-ready share 15200),
          which lands in the 5% tier and yields conversion_discount_cents 1505 and
