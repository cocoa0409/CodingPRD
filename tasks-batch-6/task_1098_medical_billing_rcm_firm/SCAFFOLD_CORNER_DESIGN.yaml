              payload: { name: "Tau Clinic", npi: "1111111133", tax_id: "22-6666666", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id, prac_v: $.data.version }
            - call: "POST /rcm/payers"
              payload: { name: "BlueCo", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 60 }
              as: AccountManager
              captures: { payer_id: $.data.id }
            - call: "POST /rcm/providers"
              payload: { practice_id: "${prac_id}", npi: "2222222241", first_name: "Ann", last_name: "Lee", specialty: "IM" }
              as: CredentialingSpecialist
              captures: { prov_id: $.data.id }
            - call: "POST /rcm/fee-schedules"
              payload: { practice_id: "${prac_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: AccountManager
              captures: { fs_id: $.data.id }
            - call: "POST /rcm/fee-schedules/${fs_id}/lines"
              payload: { cpt_code: "99213", allowed_amount_cents: 10000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/activate"
              payload: { expected_practice_version: "${prac_v}" }
              as: AccountManager
            - call: "POST /rcm/claims"
              payload: { practice_id: "${prac_id}", provider_id: "${prov_id}", payer_id: "${payer_id}", service_date: "2026-05-15T00:00:00Z", deductible_remaining_cents: 0, coinsurance_pct: 0.20, copay_cents: 0 }
              as: Coder
              captures: { claim_id: $.data.id }
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "99213", units: 1, charge_amount_cents: 15000 }
              as: Coder
            - call: "POST /rcm/claims/${claim_id}/scrub"
              payload: {}
              as: Coder
              as_user_id: "coder-c2"
          trigger:
            - call: "POST /rcm/claims/${claim_id}/scrub"
              payload: {}
              as: Coder
              as_user_id: "coder-c2"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == SCRUBBED"
      - name: accept_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Claim.SUBMITTED_to_ACCEPTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting a DRAFT claim (never submitted) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A freshly created DRAFT claim; clock 2026-06-01."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /rcm/practices"
              payload: { name: "Upsilon Clinic", npi: "1111111134", tax_id: "22-5555555", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id }
            - call: "POST /rcm/payers"
              payload: { name: "BlueCo", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 60 }
              as: AccountManager
              captures: { payer_id: $.data.id }
            - call: "POST /rcm/providers"
              payload: { practice_id: "${prac_id}", npi: "2222222242", first_name: "Ann", last_name: "Lee", specialty: "IM" }
              as: CredentialingSpecialist
              captures: { prov_id: $.data.id }
            - call: "POST /rcm/claims"
              payload: { practice_id: "${prac_id}", provider_id: "${prov_id}", payer_id: "${payer_id}", service_date: "2026-05-15T00:00:00Z", deductible_remaining_cents: 0, coinsurance_pct: 0.20, copay_cents: 0 }
              as: Coder
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /rcm/claims/${claim_id}/accept"
              payload: {}
              as: Biller
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${claim_id}.status == DRAFT"
  - section: calculations
    instances:
      - name: statement_aging_day90_is_days_61_90
        claim_type: Correct Result
        grounds: ["calculations.statement_aging_bucket", "entities.PatientStatement.fields.aging_bucket"]
        distinguishing_aspect: "A statement sent 2026-06-01 read at clock 2026-08-30 (exactly 90 days) has aging_bucket==DAYS_61_90 (inclusive upper bound at 90)."
        test_recipe:
          setup: ["Claim scrubbed (PR 6400); statement created and SENT at clock 2026-06-01; then clock advanced to 2026-08-30."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AccountManager
            - call: "POST /rcm/practices"
              payload: { name: "Phi Clinic", npi: "1111111135", tax_id: "22-4444444", billing_fee_pct: 0.06 }
              as: AccountManager
              captures: { prac_id: $.data.id, prac_v: $.data.version }
            - call: "POST /rcm/payers"
              payload: { name: "BlueCo", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 60 }
              as: AccountManager
              captures: { payer_id: $.data.id }
            - call: "POST /rcm/providers"
              payload: { practice_id: "${prac_id}", npi: "2222222243", first_name: "Ann", last_name: "Lee", specialty: "IM" }
              as: CredentialingSpecialist
              captures: { prov_id: $.data.id }
            - call: "POST /rcm/fee-schedules"
              payload: { practice_id: "${prac_id}", effective_date: "2026-01-01T00:00:00Z" }
              as: AccountManager
              captures: { fs_id: $.data.id }
            - call: "POST /rcm/fee-schedules/${fs_id}/lines"
              payload: { cpt_code: "99213", allowed_amount_cents: 10000 }
              as: AccountManager
            - call: "POST /rcm/fee-schedules/${fs_id}/activate"
              payload: { expected_practice_version: "${prac_v}" }
              as: AccountManager
            - call: "POST /rcm/claims"
              payload: { practice_id: "${prac_id}", provider_id: "${prov_id}", payer_id: "${payer_id}", service_date: "2026-05-15T00:00:00Z", deductible_remaining_cents: 3000, coinsurance_pct: 0.20, copay_cents: 2000 }
              as: Coder
              captures: { claim_id: $.data.id }
            - call: "POST /rcm/claims/${claim_id}/lines"
              payload: { cpt_code: "99213", units: 1, charge_amount_cents: 15000 }
              as: Coder
            - call: "POST /rcm/claims/${claim_id}/scrub"
              payload: {}
              as: Coder
              as_user_id: "coder-c3"
            - call: "POST /rcm/patient-statements"
              payload: { claim_id: "${claim_id}" }
              as: PaymentPoster
              captures: { stmt_id: $.data.id }
            - call: "POST /rcm/patient-statements/${stmt_id}/send"
              payload: {}
              as: PaymentPoster
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T00:00:00Z" }
              as: AccountManager
          trigger:
            - call: "GET /rcm/patient-statements/${stmt_id}"
              payload: {}
              as: PaymentPoster
              captures: { bucket: $.data.aging_bucket }
          assert:
            - "response.data.aging_bucket == DAYS_61_90"
            - "PatientStatement.${stmt_id}.statement_amount_cents == 6400"
      - name: statement_aging_day91_over_90_allows_collections
        claim_type: Correct Result
        grounds: ["calculations.statement_aging_bucket", "state_machines.PatientStatement.SENT_to_COLLECTIONS"]
        distinguishing_aspect: "At clock 2026-08-31 (91 days after send) the bucket is OVER_90 (days>90 strictly), so the SENT->COLLECTIONS transition is permitted."
        test_recipe:
