scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: developmental_stage_calendar_vs_rolling_variants
        grounds:
          - calculations.developmental_stage_assignment
          - entities.ChildProfile.fields.age_months
          - entities.ChildProfile.fields.developmental_stage
          - entities.CatalogItem.fields.min_age_months
        distinguishing_aspect: |
          Two variants of the SAME age metric diverge on identical data and live
          in the ChildProfile/CatalogItem domain (not fees): the canonical
          calendar variant reads the child as 11 months (INFANT) while the
          rolling_30_day browse variant reads 12 months (TODDLER), so the
          catalog suggestion list includes an item the hard age gate rejects.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-05-01T00:00:00Z (never set)"
            - "Member M with a child born 2025-05-02 -> calendar age 11 months, rolling_30_day age floor(364/30) = 12 months"
            - "Catalog item with age window [12, 24] (min inclusive)"
          setup_api_calls:
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.dev@x.com", full_name: "Dev Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kiddo", birthdate: "2025-05-02" }
              as: Member
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Walker Wagon", min_age_months: 12, max_age_months: 24, developmental_stages: [TODDLER], piece_count: 8, retail_value_cents: 9000, replacement_value_cents: 7000 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
          trigger:
            - call: "GET /toy-rental/members/${m_id}/children"
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/catalog-items?child_id=${ch_id}"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "ChildProfile ${ch_id}: age_months == 11 and developmental_stage == INFANT (calendar variant is canonical)"
            - "GET /toy-rental/catalog-items?child_id=${ch_id} response array CONTAINS catalog item ${ci_id} (rolling_30_day variant reads 12 months, inside [12, 24])"
            - "The two variants therefore disagree on identical inputs: 11 (calendar) != 12 (rolling)"

      - name: late_return_fee_projected_vs_finalized
        grounds:
          - calculations.late_return_fee
          - entities.RotationBox.fields.projected_late_fee_cents
          - state_machines.RotationBox.RETURNING_to_RECEIVED
        distinguishing_aspect: |
          Fee-domain dual variant on RotationBox/FeeAssessment (different
          entity domain from the ChildProfile age metric): the projected
          variant evaluates at the moving logical clock (300 cents at
          2026-06-02) while the finalized variant freezes at received_at
          (600 cents at 2026-06-04) — same formula, same due_date, different
          evaluation instant, different money.
        test_recipe:
          setup:
            - "Plan STD (toys_per_box 2, rental_period_days 28); member M with child born 2025-01-15 (age 15 months, fits [12, 36])"
            - "Catalog item replacement 8000; one NEW copy; box shipped, outbound DELIVERED at 2026-05-03T00:00:00Z -> due_date 2026-05-31T00:00:00Z"
            - "Clock advanced to 2026-06-02 (2 days past due) for the projection read"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.late@x.com", full_name: "Late Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Blocks", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 10, retail_value_cents: 10000, replacement_value_cents: 8000 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-LATE-1", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /toy-rental/rotation-boxes/${b_id}"
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/rotation-boxes/${b_id}/initiate-return"
              payload: { carrier: "UPS", tracking_number: "1Z-RET" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sh_ret: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-06-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-06-04T00:00:00Z" }
              as: OperationsManager
            - call: "GET /toy-rental/rotation-boxes/${b_id}/fees"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Projection read at clock 2026-06-02: RotationBox.${b_id}.due_date == 2026-05-31T00:00:00Z and projected_late_fee_cents == 300 (2 days x 150)"
            - "After return DELIVERED at 2026-06-04: exactly one FeeAssessment with fee_type == LATE_RETURN and amount_cents == 600 (4 days x 150), status == INVOICED"
            - "projected 300 != finalized 600 for identical due_date and formula (dual variant divergence)"
            - "Member.${m_id}.wallet_credit_cents == -600 after the FEE_CHARGE ledger append"

  # =====================================================================
  # Rule 2 — combinatorial_formula (different modes a / b / c)
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: buyout_price_multi_factor_mode_a
        grounds:
          - calculations.buyout_price
          - entities.BoxItem.fields.buyout_price_cents
        distinguishing_aspect: |
          Mode (a) — >= 3 inputs with non-linear interaction: plan discount x
          condition-grade depreciation x min/cap-bounded rental credit x max()
          floor. Pinned inputs produce price 6600 (gross 10800 x FAIR 0.70 =
          7560, minus rental credit min(2 x 0.04 x 12000, 0.30 x 12000) = 960,
          floor 499 not binding).
        test_recipe:
          setup:
            - "Plan STD (buyout_discount_pct 0.10); member M (wallet 0); child born 2025-01-15"
            - "Catalog item retail 12000, replacement 9000, age window [12, 36]; copy minted FAIR (sanitized at intake)"
            - "Box delivered 2026-05-03; buyout executed at clock 2026-07-05 -> months_rented = 2"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.buy@x.com", full_name: "Buy Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Kitchen Set", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 4, retail_value_cents: 12000, replacement_value_cents: 9000 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-BUY-1", condition_grade: "FAIR" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_id: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-BUY-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-rental/box-items/${it_id}/buyout"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "BoxItem.${it_id}.buyout_price_cents == 6600 (round_half_up(12000*0.9)=10800; 10800*0.70=7560; credit min(2*0.04*12000, 0.30*12000)=960; 7560-960=6600; floor 499 not binding)"
            - "BoxItem.${it_id}.wallet_applied_cents == 0 (wallet 0) and net_charge_cents == 6600"
            - "BoxItem.${it_id}.loan_status == KEPT_BUYOUT and resolution_status == RESOLVED"
            - "ToyCopy.${c1}.status == SOLD"

      - name: inspection_fee_per_item_rounding_mode_b
        grounds:
          - calculations.inspection_fee_aggregation
          - entities.FeeAssessment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins round-half-up PER
          COMPONENT PER ITEM then integer sum; sum-then-round would yield 1166
          while the pinned order yields 1167 (333.00 + 349.65 + 333.67 +
          150.15), a one-cent observable divergence.
        test_recipe:
          setup:
            - "Plan STD (toys_per_box 2); member M; child born 2025-01-15"
            - "Item A: replacement 999, piece_count 3; copy CA. Item B: replacement 1001, piece_count 3; copy CB. Both age window [12, 36], NEW"
            - "Box holds CA and CB; delivered 2026-05-03; returned received 2026-05-10 (on time, no late fee)"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.insp@x.com", full_name: "Insp Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Puzzle A", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 3, retail_value_cents: 2000, replacement_value_cents: 999 }
              as: PlatformAdmin
              captures: { ci_a: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_a}/copies"
              payload: { barcode: "BC-INSP-A", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c_a: $.data.id }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Puzzle B", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 3, retail_value_cents: 2000, replacement_value_cents: 1001 }
              as: PlatformAdmin
              captures: { ci_b: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_b}/copies"
              payload: { barcode: "BC-INSP-B", condition_grade: "NEW" }
              as: PlatformAdmin
              captures: { c_b: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c_a}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_a: $.data.id }
            - call: "GET /toy-rental/rotation-boxes/${b_id}"
              as: Member
              as_user_id: "${m_id}"
              captures: { b_v2: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c_b}", expected_rotation_box_version: "${b_v2}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_b: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-INSP-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/rotation-boxes/${b_id}/initiate-return"
              payload: { carrier: "UPS", tracking_number: "1Z-INSP-RET" }
              as: Member
              as_user_id: "${m_id}"
              captures: { sh_ret: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-09T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_ret}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-10T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /toy-rental/rotation-boxes/${b_id}/inspect"
              payload:
                items:
                  - { box_item_id: "${it_a}", condition_returned: "GOOD", damage_severity: "MODERATE", missing_piece_count: 1, disposition: "RESTOCK" }
                  - { box_item_id: "${it_b}", condition_returned: "GOOD", damage_severity: "MINOR", missing_piece_count: 1, disposition: "RESTOCK" }
              as: OperationsManager
            - call: "GET /toy-rental/box-items/${it_a}/fees"
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/box-items/${it_b}/fees"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "Item A fees: one DAMAGE amount_cents == 350 (round_half_up(999*0.35)=round_half_up(349.65)) and one MISSING_PIECES amount_cents == 333 (round_half_up(999*1/3)=333.0)"
            - "Item B fees: one DAMAGE amount_cents == 150 (round_half_up(1001*0.15)=round_half_up(150.15)) and one MISSING_PIECES amount_cents == 334 (round_half_up(1001/3)=round_half_up(333.67))"
            - "Box fee total == 350+333+150+334 == 1167 (per-item-then-sum order; sum-then-round would give 1166)"
            - "Member.${m_id}.wallet_credit_cents == -1167 and RotationBox.${b_id}.status == INSPECTED"
            - "ToyCopy ${c_a} and ${c_b} status == SANITIZING; item A condition_returned == GOOD and copy grade degraded NEW -> GOOD"

      - name: buyout_wallet_application_order_mode_c
        grounds:
          - calculations.buyout_wallet_application
          - entities.BoxItem.fields.wallet_applied_cents
          - entities.Member.fields.wallet_credit_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          wallet reduces the charge while the charge consumes the wallet. The
          scaffold pins price -> wallet0 snapshot -> applied -> net -> ledger;
          with wallet 8000 and price 6600 the MIN_NET_CHARGE 100 clamp binds
          (applied 6500, net 100, wallet after 1500).
        test_recipe:
          setup:
            - "Same buyout fixture as buyout_price_multi_factor_mode_a (price 6600), plus a CustomerService +8000 PROMO_CREDIT adjustment before buyout"
          setup_api_calls:
            - call: "POST /toy-rental/subscription-plans"
              payload: { name: "STD", monthly_fee_cents: 5000, toys_per_box: 2, swap_allowance_per_cycle: 2, max_holds: 2, rotation_cadence_days: 28, rental_period_days: 28, buyout_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /toy-rental/members/register"
              payload: { email: "m.wal@x.com", full_name: "Wal Member", password: "pw" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /toy-rental/members/${m_id}/wallet/adjustments"
              payload: { amount_cents: 8000, reason: "PROMO_CREDIT", note: "promo" }
              as: CustomerService
            - call: "POST /toy-rental/members/${m_id}/children"
              payload: { name: "Kid", birthdate: "2025-01-15" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /toy-rental/members/${m_id}/subscriptions"
              payload: { plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { s_id: $.data.id, s_v: $.data.version }
            - call: "POST /toy-rental/catalog-items"
              payload: { title: "Kitchen Set", min_age_months: 12, max_age_months: 36, developmental_stages: [TODDLER], piece_count: 4, retail_value_cents: 12000, replacement_value_cents: 9000 }
              as: PlatformAdmin
              captures: { ci_id: $.data.id }
            - call: "POST /toy-rental/catalog-items/${ci_id}/copies"
              payload: { barcode: "BC-WAL-1", condition_grade: "FAIR" }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /toy-rental/subscriptions/${s_id}/rotation-boxes"
              payload: { expected_subscription_version: "${s_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/items"
              payload: { toy_copy_id: "${c1}", expected_rotation_box_version: "${b_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { it_id: $.data.id }
            - call: "POST /toy-rental/rotation-boxes/${b_id}/ship"
              payload: { carrier: "UPS", tracking_number: "1Z-WAL-OUT" }
              as: OperationsManager
              captures: { sh_out: $.data.id }
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "IN_TRANSIT", occurred_at: "2026-05-02T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/shipments/${sh_out}/events"
              payload: { event_type: "DELIVERED", occurred_at: "2026-05-03T00:00:00Z" }
              as: OperationsManager
            - call: "POST /toy-rental/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /toy-rental/box-items/${it_id}/buyout"
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /toy-rental/members/${m_id}"
              as: Member
              as_user_id: "${m_id}"
          assert:
            - "BoxItem.${it_id}.buyout_price_cents == 6600"
            - "BoxItem.${it_id}.wallet_applied_cents == 6500 (min(8000, 6600-100) — MIN_NET_CHARGE clamp binds) and net_charge_cents == 100"
            - "Member.${m_id}.wallet_credit_cents == 1500 (8000 - 6500 via one BUYOUT_CREDIT_APPLIED ledger entry of -6500)"
            - "Evaluation-order violation (apply wallet AFTER debiting, or ignore the clamp) yields different observable values"

  # =====================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - calculations.rotation_cadence_schedule
        distinguishing_aspect: |
          Cyclic machine on Subscription: ACTIVE -> PAUSED -> ACTIVE -> PAUSED
          loops legally, and resume shifts next_cycle_due_at by the consumed
          pause days (9 days consumed -> due moves 2026-05-01 to 2026-05-10).
        test_recipe:
          setup:
            - "Plan STD; member M; subscription created at default clock 2026-05-01 (next_cycle_due_at == created_at)"
