              payload: { legal_name: "Harbor Tools LLC", email: "ops@harbor-tools.example", tax_id_hash: "TAX-HT-0001", payout_bank_token: "BANK-HT-0001", address_fingerprint: "ADDR-HT-0001" }
              as: Anonymous
              captures: { s_id: $.data.id }
            - call: "POST /listings"
              payload: { seller_id: "${s_id}", title: "18V Cordless Drill", sku: "SKU-RB1-0001", category_code: "TOOLS" }
              as: Seller
              as_user_id: "${s_id}"
              captures: { l1: $.data.id }
            - call: "POST /violations"
              payload: { seller_id: "${s_id}", policy_rule_id: "${rule_rb1}", reporter_type: "BUYER", evidence_reference: "EV-RB1-0001" }
