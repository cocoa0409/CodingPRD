  - rule_id: resource_temporal_overlap
    instances:
      - name: patient_occupancy_is_half_open_at_the_discharge_instant
        grounds:
          - validations.priority_11_ERR_PATIENT_STAY_OVERLAP
          - entities.Stay.fields.admitted_at
          - entities.Stay.fields.discharged_at
        distinguishing_aspect: |
          The contended resource is the PATIENT: two stays of the same person may not overlap in time,
          and the interval is HALF-OPEN [admitted_at, discharged_at). The instance probes the exact
          discharge instant from both sides - one second before it overlaps and is refused, the instant
          itself is adjacent and admitted - which is only reachable because admitted_at accepts a
          backdated value.
        test_recipe:
          setup:
            - "OPEN period FY2027, ACTIVE criteria set CS-2026A, DRG 207 loaded."
            - "Patient Otto Twice is admitted backdated 2026-07-01 and discharged at clock 2026-08-15T00:00:00Z, so his first stay occupies [2026-07-01T00:00:00Z, 2026-08-15T00:00:00Z)."
            - "A second referral for the same patient is screened CRITERIA_MET and left un-admitted; the clock stays at 2026-08-15T00:00:00Z so neither candidate admitted_at is future-dated (priority 13)."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_metro_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-140", full_name: "Otto Twice", birth_date: "1945-05-15", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat140_id: $.data.id, pat140_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat140_id}", referring_hospital_id: "${rh_metro_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat140_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-06-30T12:00:00Z" }
              as: IntakeCoordinator
              captures: { ref140a_id: $.data.id }
            - call: "POST /ltch/referrals/${ref140a_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref140a_id}/admit"
              payload: { admitted_at: "2026-07-01T00:00:00.000Z" }
              as: IntakeCoordinator
              captures: { stay140a_id: $.data.id }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ltch/stays/${stay140a_id}/discharge"
              payload: { discharge_disposition: "ACUTE_TRANSFER", estimated_cost_cents: 1000000 }
              as: UtilizationReviewNurse
              captures: { stay140a_out: $.data.discharged_at }
            - call: "GET /ltch/patients/${pat140_id}"
              payload: {}
              as: IntakeCoordinator
              captures: { pat140_v2: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat140_id}", referring_hospital_id: "${rh_metro_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat140_v2}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-06-30T12:00:00Z" }
              as: IntakeCoordinator
              captures: { ref140b_id: $.data.id }
            - call: "POST /ltch/referrals/${ref140b_id}/screen"
              payload: {}
              as: IntakeCoordinator
          trigger:
            - call: "POST /ltch/referrals/${ref140b_id}/admit"
              payload: { admitted_at: "2026-08-14T23:59:59.000Z" }
              as: IntakeCoordinator
              captures: { overlap_error: $.data.error_id }
            - call: "POST /ltch/referrals/${ref140b_id}/admit"
              payload: { admitted_at: "2026-08-15T00:00:00.000Z" }
              as: IntakeCoordinator
              captures: { stay140b_id: $.data.id }
          assert:
            - "stay140a_out == 2026-08-15T00:00:00.000Z and Stay.${stay140a_id}.covered_los_days == 45"
            - "The first trigger call returns HTTP 422 with overlap_error == ERR_PATIENT_STAY_OVERLAP - 2026-08-14T23:59:59Z lies inside [2026-07-01T00:00:00Z, 2026-08-15T00:00:00Z)"
            - "overlap_error != ERR_PATIENT_ALREADY_ADMITTED - the prior stay is DISCHARGED, so priority 10 does not fire and priority 11 is the only violation"
            - "Referral.${ref140b_id}.status == CRITERIA_MET after the refusal - a failed admit leaves the referral admissible"
            - "The second trigger call returns HTTP 201: Stay.${stay140b_id}.admitted_at == 2026-08-15T00:00:00.000Z and clinical_status == ADMITTED"
            - "Stay.${stay140b_id}.carried_los_days == 0 - adjacency is not recombination"
            - "CostReportingPeriod.${period_id}.total_admissions == 2"
            - "GET /ltch/stays?patient_id=${pat140_id} returns exactly 2 items"

      - name: cost_reporting_periods_may_not_overlap_or_be_open_together
        grounds:
          - validations.priority_30_ERR_DUPLICATE_KEY
          - state_machines.CostReportingPeriod.OPEN_to_CLOSED
          - entities.CostReportingPeriod.fields.start_date
          - entities.CostReportingPeriod.fields.end_date
        distinguishing_aspect: |
          A different contended resource with the OPPOSITE interval convention: period date ranges are
          INCLUSIVE on both ends, so a new period starting exactly on an existing period's end_date
          overlaps, whereas the patient-occupancy instance treats the matching instant as adjacent. The
          instance also separates the two halves of the same rule - a non-overlapping range is still
          refused while another period is OPEN, and only after the close does the overlap test become
          the operative reason.
        test_recipe:
          setup:
            - "Empty database except one OPEN period AUG2026 covering 2026-08-01..2026-08-31, which contains the default clock instant 2026-08-01T00:00:00Z."
            - "No stays, determinations or notes exist, so the period is closable at will."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "AUG2026", start_date: "2026-08-01", end_date: "2026-08-31" }
              as: ComplianceOfficer
              captures: { period_aug_id: $.data.id, period_aug_status: $.data.status }
          trigger:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "DEC2026", start_date: "2026-12-01", end_date: "2026-12-31" }
              as: ComplianceOfficer
              captures: { second_open_error: $.data.error_id }
            - call: "POST /ltch/cost-reporting-periods/${period_aug_id}/close"
              payload: {}
              as: ComplianceOfficer
              captures: { aug_closed_at: $.data.closed_at }
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "SEP2026", start_date: "2026-08-31", end_date: "2026-11-30" }
              as: ComplianceOfficer
              captures: { overlap_error: $.data.error_id }
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "SEP2026", start_date: "2026-09-01", end_date: "2026-11-30" }
              as: ComplianceOfficer
              captures: { period_sep_id: $.data.id }
          assert:
            - "period_aug_status == OPEN"
            - "The first trigger call returns HTTP 409 with second_open_error == ERR_DUPLICATE_KEY - the range 2026-12-01..2026-12-31 does not overlap AUG2026, but only one period may be OPEN"
            - "CostReportingPeriod.${period_aug_id}.status == CLOSED and aug_closed_at == 2026-08-01T00:00:00.000Z"
            - "The third trigger call returns HTTP 409 with overlap_error == ERR_DUPLICATE_KEY - start_date 2026-08-31 equals AUG2026's inclusive end_date, so the ranges overlap on that single day even though AUG2026 is CLOSED"
            - "The fourth trigger call returns HTTP 201: CostReportingPeriod.${period_sep_id}.start_date == 2026-09-01 and status == OPEN"
            - "CostReportingPeriod.${period_sep_id}.total_admissions == 0 and total_payment_cents == 0 and final_determination_count == 0"
            - "GET /ltch/cost-reporting-periods/${period_aug_id} still reports status CLOSED - opening the next period does not reopen it"

  - rule_id: compensating_invariant
    instances:
      - name: void_reprice_refinalize_leaves_the_period_ledger_undrifted
        grounds:
          - endpoints.POST_ltch_payment_determinations_id_void.side_effects
          - endpoints.POST_ltch_payment_determinations_id_finalize.side_effects
          - calculations.period_payment_rollup
          - validations.priority_28_ERR_PERIOD_LEDGER_MISMATCH
          - validations.priority_24_ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          The invariant is the MONEY ledger and the compensation is a void: finalize adds, void
          subtracts the same amount, and a re-priced re-finalize must land the period on exactly the
          original figure rather than double-counting. Correctness is proved by the period close, which
          re-derives the ledger from scratch and refuses on any drift - so an implementation that adds
          on finalize but forgets to subtract on void cannot reach CLOSED at all.
        test_recipe:
          setup:
            - "OPEN period FY2027 (2026-07-01..2027-06-30), ACTIVE criteria set CS-2026A, DRG 207 loaded (rw 1.25, alos 30, sfr 4,800,000, ippd 90,000, ippf 2,400,000)."
            - "Patient Pia Ledger is admitted at the default clock 2026-08-01T00:00:00Z; the clock then moves to 2026-08-15T00:00:00Z and she is discharged HOME with estimated_cost_cents 1,000,000 - LOS 14, an SSO stay whose determination totals 1,512,000 (min of per-diem 2,800,000, blend 1,512,000 and IPPS full 2,400,000)."
            - "No IDT notes and no weaning plan exist, so the auto-created review scores 32 + 15 + 20 = 67 (MODERATE band, no auto-query) and is resolved CLEARED so the money gate at priority 22 is open."
            - "Four distinct RevenueIntegrityAnalyst identities are used: nurse-a discharges, analyst-a prices, analyst-b finalizes, analyst-c voids - the segregation rule at priority 24 forbids reusing analyst-b for the void."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_metro_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-150", full_name: "Pia Ledger", birth_date: "1950-01-30", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat150_id: $.data.id, pat150_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat150_id}", referring_hospital_id: "${rh_metro_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat150_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-31T00:00:00Z" }
              as: IntakeCoordinator
              captures: { ref150_id: $.data.id }
            - call: "POST /ltch/referrals/${ref150_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref150_id}/admit"
              payload: {}
              as: IntakeCoordinator
              captures: { stay150_id: $.data.id }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ltch/stays/${stay150_id}/discharge"
              payload: { discharge_disposition: "HOME", estimated_cost_cents: 1000000 }
              as: UtilizationReviewNurse
              as_user_id: nurse-a
              captures: { stay150_los: $.data.covered_los_days }
            - call: "GET /ltch/stays/${stay150_id}/payment-determinations"
              payload: { status: "DRAFT" }
              as: RevenueIntegrityAnalyst
              captures: { det1_id: "$.data[0].id", det1_total: "$.data[0].total_payment_cents" }
            - call: "GET /ltch/stays/${stay150_id}/denial-risk-reviews"
              payload: {}
              as: ComplianceOfficer
              captures: { rev150_id: "$.data[0].id", rev150_band: "$.data[0].risk_band" }
            - call: "POST /ltch/denial-risk-reviews/${rev150_id}/resolve"
              payload: { outcome: "CLEARED", resolution_note: "Short-stay outlier expected for a 14-day PMV admission; documentation accepted." }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ltch/payment-determinations/${det1_id}/finalize"
