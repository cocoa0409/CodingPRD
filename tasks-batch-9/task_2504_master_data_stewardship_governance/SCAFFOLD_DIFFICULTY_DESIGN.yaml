            - "second trigger -> HTTP 409 and ${err_conflict} == ERR_FREEZE_WINDOW_CONFLICT: the candidate start 2026-08-24T23:59:59Z clears CR1's end by 71h59m59s, one second short of the 72h buffer"
            - "${cr2_status_mid} == APPROVED, ${cr2_fw_start_mid} == null and ${cr2_sched_mid} == null (the rejected schedule left no partial state)"
            - "${cr2_status_after} == SCHEDULED, ${cr2_fw_start_after} == 2026-08-25T00:00:00Z, ${cr2_fw_end_after} == 2026-08-28T00:00:00Z (exactly 72h of separation is accepted)"
            - "${sched_count_after} == 2 (the rejected attempt never incremented the counter)"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: publish_blocked_until_domain_posture_returns_to_open
        grounds:
          - state_machines.MasterRecord.UNPUBLISHED_to_PUBLISHED
          - state_machines.Domain.RESTRICTED_to_OPEN
          - validations.priority_11_ERR_DOMAIN_POSTURE_BLOCKED
          - calculations.domain_posture_recompute
        distinguishing_aspect: |
          Publishing a record depends on the state of two other entities the record does not
          reference - the Domain's governance_posture, which is itself derived from the open
          QualityFinding set. The record is perfectly publishable (CURATED, completeness 80.00)
          yet must be refused while one CRITICAL finding holds the domain at RESTRICTED, and
          the very same call must succeed once that finding is resolved.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "Domain CUSTOMER ACTIVE with one ACTIVE CRITICAL rule QR1 (weight_points 40, threshold_pct 90.00) owned by the PRINCIPAL steward."
            - "MasterRecord A (4 of 5 attributes -> completeness_pct 80.00) is CURATED and UNPUBLISHED."
            - "A CERTIFIED-basis scorecard run measuring QR1 at 50.00 opens one CRITICAL finding and drives the posture to RESTRICTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: GovernanceAdmin
            - call: "POST /mdm/domains"
              payload: { code: "CUSTOMER", name: "Customer Master", classification_level: "INTERNAL", notification_lead_days_floor: 5, expected_attribute_count: 5 }
              as: GovernanceAdmin
              captures: { dom_id: $.data.id, dom_v1: $.data.version }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Olivia Owner", email: "olivia@mdm.test", certification_level: "PRINCIPAL" }
              as: GovernanceAdmin
              captures: { own_id: $.data.id }
            - call: "POST /mdm/stewards"
              payload: { full_name: "Sam Steward", email: "sam@mdm.test", certification_level: "SENIOR" }
              as: GovernanceAdmin
              captures: { std_id: $.data.id }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${own_id}", steward_role: "DATA_OWNER", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v1}" }
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v2: $.data.version }
            - call: "POST /mdm/steward-assignments"
              payload: { domain_id: "${dom_id}", steward_id: "${std_id}", steward_role: "DATA_STEWARD", effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v2}" }
              as: GovernanceAdmin
            - call: "POST /mdm/source-systems"
              payload: { code: "ERP", name: "ERP Core", trust_tier: 4 }
              as: GovernanceAdmin
              captures: { erp_id: $.data.id }
            - call: "POST /mdm/source-systems/${erp_id}/certify"
              payload: {}
              as: GovernanceAdmin
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { dom_v3: $.data.version }
            - call: "POST /mdm/source-registrations"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", role: "AUTHORITATIVE", trust_rank: 1, effective_from: "2026-08-01T00:00:00Z", expected_domain_version: "${dom_v3}" }
              as: GovernanceAdmin
            - call: "POST /mdm/quality-rules"
              payload: { domain_id: "${dom_id}", owner_steward_id: "${own_id}", rule_code: "QR1", dimension: "COMPLETENESS", weight_points: 40, threshold_pct: 90.00, severity: "CRITICAL" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { qr1_id: $.data.id }
            - call: "POST /mdm/domains/${dom_id}/activate"
              payload: {}
              as: GovernanceAdmin
            - call: "POST /mdm/master-records"
              payload: { domain_id: "${dom_id}", source_system_id: "${erp_id}", natural_key: "ERP-CUST-1001", attributes: { legal_name: "Acme Industrial", tax_id: "TX-77", billing_city: "Austin", contact_email: "ops@acme.test" }, last_verified_at: "2026-07-01T00:00:00Z" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_a_id: $.data.id, rec_a_completeness: $.data.completeness_pct }
            - call: "POST /mdm/master-records/${rec_a_id}/curate"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_a_cur: $.data.curation_status }
            - call: "POST /mdm/domains/${dom_id}/scorecard-runs"
              payload: { basis: "CERTIFIED", measurements: [{ rule_code: "QR1", measured_pct: 50.00 }] }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { run1_id: $.data.id, run1_score: $.data.weighted_score, run1_after: $.data.posture_after }
            - call: "GET /mdm/quality-findings?scorecard_run_id=${run1_id}&quality_rule_id=${qr1_id}"
              as: GovernanceAdmin
              captures: { f_id: "$.data[0].id", f_weight: "$.data[0].severity_weight" }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { posture_before: $.data.governance_posture, weight_before: $.data.open_finding_weight }
          trigger:
            - call: "POST /mdm/master-records/${rec_a_id}/publish"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { err_blocked: $.data.error_id }
            - call: "GET /mdm/master-records/${rec_a_id}"
              as: GovernanceAdmin
              captures: { rec_pub_mid: $.data.publication_status, rec_cur_mid: $.data.curation_status }
            - call: "POST /mdm/quality-findings/${f_id}/resolve"
              payload: { verified_measured_pct: 95.00, resolution_note: "Backfilled the missing contact attributes from the ERP extract" }
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { f_status_after: $.data.status, f_gap_after: $.data.gap_pct, f_weight_after: $.data.severity_weight }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { posture_mid: $.data.governance_posture, weight_mid: $.data.open_finding_weight }
            - call: "POST /mdm/master-records/${rec_a_id}/publish"
              payload: {}
              as: DataSteward
              as_user_id: "${std_id}"
              captures: { rec_pub_after: $.data.publication_status, rec_published_at: $.data.published_at }
            - call: "GET /mdm/domains/${dom_id}"
              as: GovernanceAdmin
              captures: { pub_count_after: $.data.published_master_record_count }
          assert:
            - "${rec_a_completeness} == 80.00 and ${rec_a_cur} == CURATED"
            - "${run1_score} == 55.55 (earned = round(40 * 50.00 / 90.00, 2) = 22.22, then round(100 * 22.22 / 40, 2) = 55.55)"
            - "${f_weight} == 20.00 (CRITICAL base 20 x multiplier 1.00) and ${run1_after} == RESTRICTED"
            - "${posture_before} == RESTRICTED and ${weight_before} == 20.00"
            - "first publish -> HTTP 409 and ${err_blocked} == ERR_DOMAIN_POSTURE_BLOCKED"
            - "${rec_pub_mid} == UNPUBLISHED and ${rec_cur_mid} == CURATED (the blocked publish mutated neither dimension)"
            - "${f_status_after} == RESOLVED, ${f_gap_after} == 0.00, ${f_weight_after} == 20.00 (severity_weight stays pinned on the closed finding)"
            - "${weight_mid} == 0.00 and ${posture_mid} == OPEN (no open CRITICAL finding remains)"
            - "second publish -> HTTP 200 and ${rec_pub_after} == PUBLISHED with ${rec_published_at} == 2026-08-05T00:00:00Z"
            - "${pub_count_after} == 1"

      - name: merge_blocked_when_effective_survivor_source_decertified
        grounds:
