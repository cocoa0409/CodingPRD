            - "HOP 3: Route.${route_z}.closed_stop_count == 1, Route.${route_z}.stop_count == 1 and Route.${route_z}.status == CLOSED"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: stop_state_41_beats_lot_capacity_90_on_a_darkened_stop
        grounds:
          - validations[priority=41]
          - validations[priority=90]
          - validations[priority=30]
          - errors[ERR_STOP_STATE_INVALID]
          - errors[ERR_LOT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair STATE (41) vs BUSINESS_FISCAL (90) on POST /ride-allocations. The tiny lot (usable
          floor(5000*0.8) - ceil(1001*0.5) = 3499 sqft) cannot hold the 5414 sqft charged wheel, and the stop is DARK,
          so both rules are violated by one call; the fresh stop version is re-read after the cancel precisely so that
          the OCC rule at priority 30 cannot pre-empt the pair. Expect ERR_STOP_STATE_INVALID (409), never
          ERR_LOT_CAPACITY_EXCEEDED (422).
        test_recipe:
          setup:
            - "Jurisdiction OH; Venue V_SMALL with lot_area_sqft 5000, expected_attendance 1001, power_amps_available 1200 (usable lot 3499 sqft)."
            - "Ride WHEEL (MAJOR, 4010 sqft) charges 5414 sqft, which alone exceeds the usable lot."
            - "Route R1 DRAFT with stop S1 that has been cancelled to DARK; the caller re-reads the stop version after the cancel so its OCC token is current."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { state_code: "OH", name: "Ohio", permit_lead_days: 10, amusement_tax_pct: 6.5, permit_fee_cents: 50000 }
              as: PlatformAdmin
              captures: { jur_p1: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_p1}", name: "Village Green", city: "Delaware", lot_area_sqft: 5000, power_amps_available: 1200, expected_attendance: 1001, lot_surface: "GRASS" }
              as: PlatformAdmin
              captures: { venue_small: $.data.id }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4 }
              as: PlatformAdmin
              captures: { ride_p1: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_p1: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_p1}", venue_id: "${venue_small}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_p1: $.data.id }
            - call: "POST /route-stops/${stop_p1}/cancel"
              payload: {}
              as: RouteManager
            - call: "GET /route-stops/${stop_p1}"
              payload: {}
              as: LotBoss
              captures: { sv_p1: $.data.version }
          trigger:
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_p1}", route_stop_id: "${stop_p1}", expected_route_stop_version: "${sv_p1}" }
              as: LotBoss
              captures: { pair_error_1: $.data.error_id }
          assert:
            - "RouteStop.${stop_p1}.status == DARK before the trigger"
            - "The trigger returns HTTP 409 with error_id == ERR_STOP_STATE_INVALID"
            - "The trigger does NOT return ERR_LOT_CAPACITY_EXCEEDED even though 0 + 5414 > 3499"
            - "The trigger does NOT return ERR_STALE_ROUTE_STOP_VERSION: the version token was re-read after the cancel"
            - "No RideAllocation row exists for ride ${ride_p1}: GET /ride-allocations?ride_id=${ride_p1} returns 0 rows"
            - "RouteStop.${stop_p1}.allocated_sqft_used == 0 and RouteStop.${stop_p1}.power_amps_used == 0.0"

      - name: ride_out_of_service_60_beats_double_booking_70_for_a_failed_ride
        grounds:
          - validations[priority=60]
          - validations[priority=70]
          - state_machines.InspectionOrder.SCHEDULED_to_FAILED
          - state_machines.RideAllocation.COMMITTED_to_INSPECTION_HELD
          - errors[ERR_RIDE_OUT_OF_SERVICE]
          - errors[ERR_RIDE_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Category pair BUSINESS_SAFETY (60) vs BUSINESS_TEMPORAL (70) on the same endpoint. The ride is simultaneously
          OUT_OF_SERVICE (a 3-defect inspection failure) and still held by a non-terminal INSPECTION_HELD allocation
          whose occupation interval ends 2026-09-08T12:00Z, only 2 hours before the candidate stop's load-in — under
          the 4-hour transport buffer that is also a double-booking. Safety wins: ERR_RIDE_OUT_OF_SERVICE (409),
          never ERR_RIDE_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Jurisdiction OH_STATE: requires_state_ride_inspection true, inspection_slot_capacity_per_day 2."
            - "Venue V1 in OH_STATE (stop A on route R1) and Venue V2 in OH_STATE (stop B on a separate route R2, so no travel-window coupling)."
            - "Ride WHEEL requires_state_inspection true. Stop A is CONFIRMED via contract execute, which committed the allocation and scheduled its STATE inspection on 2026-09-01T14:00:00Z."
            - "That inspection is FAILED with defect_count 3, so Ride.status becomes OUT_OF_SERVICE and the allocation becomes INSPECTION_HELD (still occupying 2026-09-01T06:00Z..2026-09-08T12:00Z)."
            - "Stop B is PLANNED with load_in_start 2026-09-08T14:00:00Z, i.e. a 2-hour gap."
