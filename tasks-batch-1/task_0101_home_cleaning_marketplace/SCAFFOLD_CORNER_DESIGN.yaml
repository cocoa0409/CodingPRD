scaffold_corner_design:

  # =======================================================================
  # Entities
  # =======================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_zeroed_ledger_fields
        claim_type: Creation
        grounds: [entities.Customer.fields.wallet_credit_cents, entities.Customer.fields.lifetime_booking_count]
        distinguishing_aspect: "POST /customers with email+full_name -> 201; wallet_credit_cents 0 and lifetime_booking_count 0 initialized server-side."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /cleaning/customers"
              payload: { email: "new@x.com", full_name: "New Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
          assert:
            - "response code == 201"
            - "Customer.${cu_id}.wallet_credit_cents == 0"
            - "Customer.${cu_id}.lifetime_booking_count == 0"
            - "Customer.${cu_id}.version == 1"

      - name: get_customer_not_found_returns_404
        claim_type: Not Found
        grounds: ["endpoints.GET /cleaning/customers/{id}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{random-uuid} -> ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /cleaning/customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_address_missing_home_size_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Address.fields.home_size, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /addresses omitting required home_size -> ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /cleaning/customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { cu_id: $.data.id }
          trigger:
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_address_invalid_home_size_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Address.fields.home_size, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /addresses with home_size not in the enum set -> ERR_INVALID_REQUEST 422."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - call: "POST /cleaning/customers"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { cu_id: $.data.id }
          trigger:
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "MANSION" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: booking_home_size_snapshot_ignores_later_address_input
        claim_type: System Fields
        grounds: [entities.Booking.fields.home_size]
        distinguishing_aspect: "home_size on a Booking is a system snapshot copied from Address; any home_size passed in the booking body is ignored and the Address value is used."
        test_recipe:
          setup: ["Active plan, an ACTIVE serving cleaner, a customer with a TWO_BR address."]
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "TWO_BR" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.home_size == TWO_BR (snapshot from the address)"
            - "Booking.${bk_id}.quoted_price_cents == 11000 (TWO_BR base, no add-ons, customer supplies, count 0)"

  # =======================================================================
  # State Machines
  # =======================================================================
  - section: state_machines
    instances:
      - name: cancel_booking_from_cancelled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Booking.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "A second cancel on an already-CANCELLED booking -> ERR_INVALID_STATE 409; no second refund fires."
        test_recipe:
          setup: ["An active plan, ACTIVE cleaner, customer, address, and a SCHEDULED booking that is cancelled once."]
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-20T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /cleaning/bookings/${bk_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
          trigger:
            - call: "POST /cleaning/bookings/${bk_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: new_booking_starts_in_scheduled
        claim_type: initial_state
        grounds: [state_machines.Booking, entities.Booking.fields.status]
        distinguishing_aspect: "A freshly created one-time booking has status SCHEDULED."
        test_recipe:
          setup: ["Active plan, ACTIVE cleaner, customer, address."]
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.status == SCHEDULED"

      - name: complete_before_scheduled_start_returns_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.Booking.SCHEDULED_to_COMPLETED]
        distinguishing_aspect: "Completing before current_clock reaches scheduled_start violates the time precondition -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A SCHEDULED booking assigned to cleaner ${cl_id} with start in the future; clock still before start."]
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", cleaner_id: "${cl_id}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings/${bk_id}/complete"
              payload: { rating: 5 }
              as: Cleaner
              as_user_id: "${cl_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE (clock 2026-06-01 is before scheduled_start 2026-06-10)"

      - name: pause_resume_series_round_trip
        claim_type: valid_transition
        grounds: [state_machines.BookingSeries.ACTIVE_to_PAUSED, state_machines.BookingSeries.PAUSED_to_ACTIVE]
        distinguishing_aspect: "Pause then resume returns the series to ACTIVE; version increments twice."
        test_recipe:
          setup: ["Active plan, ACTIVE cleaner, customer, address, a WEEKLY series."]
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/booking-series"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", cadence: "WEEKLY", first_occurrence_date: "2026-06-20T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { se_id: $.data.id }
            - call: "POST /cleaning/booking-series/${se_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
          trigger:
            - call: "POST /cleaning/booking-series/${se_id}/resume"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
          assert:
            - "BookingSeries.${se_id}.status == ACTIVE"
            - "BookingSeries.${se_id}.version == 3"

      - name: generate_on_cancelled_series_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.BookingSeries.ACTIVE_to_CANCELLED, state_machines.BookingSeries.transitions]
        distinguishing_aspect: "Generating an occurrence on a CANCELLED (terminal) series -> ERR_INVALID_STATE 409."
        test_recipe:
          setup: ["A WEEKLY series that is cancelled (terminal)."]
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/booking-series"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", cadence: "WEEKLY", first_occurrence_date: "2026-06-20T09:00:00Z" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { se_id: $.data.id, se_v: $.data.version }
            - call: "POST /cleaning/booking-series/${se_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
              captures: { se_v2: $.data.version }
          trigger:
            - call: "POST /cleaning/booking-series/${se_id}/generate"
              payload: { expected_series_version: "${se_v2}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: adjudicate_clear_moves_cleaner_to_check_passed
        claim_type: side_effect_execution
        grounds: [state_machines.Cleaner.CHECK_PENDING_to_CHECK_PASSED, entities.BackgroundCheck.fields.result]
        distinguishing_aspect: "Adjudicating CLEAR sets BackgroundCheck.result=CLEAR, stamps adjudicated_at, and moves the cleaner to CHECK_PASSED."
        test_recipe:
          setup: ["A cleaner with an open PENDING background check."]
          setup_api_calls:
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
          trigger:
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
          assert:
            - "BackgroundCheck.${bc_id}.result == CLEAR"
            - "BackgroundCheck.${bc_id}.adjudicated_at is non-null"
            - "Cleaner.${cl_id}.status == CHECK_PASSED"

  # =======================================================================
  # Calculations
  # =======================================================================
  - section: calculations
    instances:
      - name: move_out_floor_minimum_applied
        claim_type: constants_applied
        grounds: [calculations.price_quote, entities.PricingPlan.fields.move_out_surcharge_pct]
        distinguishing_aspect: "A ONE_BR MOVE_OUT visit prices to the MOVE_OUT_MINIMUM_CENTS floor 20000 because the computed 14000 is below it."
        test_recipe:
          setup: ["Active plan ONE_BR base 8000, move_out 0.75; one-time MOVE_OUT booking, customer supplies, count 0."]
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
