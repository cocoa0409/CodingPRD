  # ---------------------------------------------------------------------------
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: scaled_score_exactly_at_pass_mark_passes
        grounds:
          - calculations.scaled_score
          - state_machines.ExamRegistration.PENDING_to_RELEASED
        distinguishing_aspect: |
          Metric = scaled score, endpoint = pass-mark publish: scaled 6.5 exactly
          EQUAL to the ratified mark 6.5 passes (>= semantics), while 6.3 fails —
          raw 39 vs 38 out of 60 land on opposite sides of the same mark.
        test_recipe:
          setup:
            - "Window P-2026-10 capacity 30; cand1 and cand2 REGISTERED and SAT after the 2026-10-13 sweep; raw scores 39 and 38; RATIFIED mark 6.5"
          setup_api_calls:
