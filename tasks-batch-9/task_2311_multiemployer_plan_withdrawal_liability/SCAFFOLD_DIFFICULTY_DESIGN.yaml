            - call: "POST /employers"
              payload: { plan_id: "${plan_id}", controlled_group_id: "${cg_id}", legal_name: "Boreal Markets South LLC", ein: "410001302", obligation_start_year: 2019, covered_work_status: "PERFORMING", cba_count: 1 }
              as: FundAdministrator
              as_user_id: "fa-001"
              captures: { emp_b_id: "$.data.id", emp_b_v1: "$.data.version" }
            - call: "POST /plan-year-valuations"
              payload: { plan_id: "${plan_id}", plan_year: 2025, measurement_window_start: "2025-01-01T00:00:00Z", measurement_window_end: "2025-10-01T00:00:00Z", uvb_total_cents: 5000000000, uvb_pool_cents: 500000000, all_employer_contributions_cents: 1000000000, all_employer_cbu: 1000000, interest_rate_bps: 700, certify_on_create: true }
