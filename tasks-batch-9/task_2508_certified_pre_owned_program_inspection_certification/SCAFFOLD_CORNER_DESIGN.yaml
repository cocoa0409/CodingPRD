              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
          trigger:
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "FAIL", notes: "coolant leak" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "FAIL", measured_value: 11.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "GET /cpo/inspections/${i1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/inspections/${i1}/results"
              payload: { attempt_index: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "FAIL", notes: "coolant leak" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "FAIL", measured_value: 2.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "GET /cpo/inspections/${i1}/results"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "trigger call 1 returns 422 ERR_MEASUREMENT_CONTRADICTS_OUTCOME for the B1 row: 11.0 is inside [4.0, 12.0] yet the row claims FAIL"
            - "trigger call 2 shows attempt_count still 1, recorded_item_count 3, failed_critical_count 0 and status IN_PROGRESS - the rejected batch neither started an attempt nor overwrote the stored one"
            - "trigger call 3 still returns the 3 original attempt-1 rows, all with outcome PASS: the P1 FAIL from the rejected batch was not applied"
            - "trigger call 4 returns 200 and writes attempt 2, so the rejected batch consumed no attempt_index"
