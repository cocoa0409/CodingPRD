  # ===========================================================================
  - section: calculations
    instances:

      - name: service_standard_cutoff_rollover_and_operating_day_skips
        claim_type: Correct Result
        grounds:
          - calculations.service_standard_delivery_date
        distinguishing_aspect: "Acceptance after the 17:00 cutoff on Friday 2026-09-04 advances the acceptance to the next origin operating day (Monday 09-07 — Saturday 09-05 IS an operating day, so it advances to Saturday first), then rolls 2 service days over Mon–Sat skipping Sunday: committed date 2026-09-08. Cutoff and operating-day logic interact; either alone gives a different answer."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. LAX (CONTIGUOUS, Mon–Sat, cutoff 17:00) and JFK (CONTIGUOUS); rule PRIORITY LAX→JFK 2 days effective 2026-01-01."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { lax_id: $.data.id, lax_v: $.data.version }
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "JFK", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "18:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
              captures: { jfk_id: $.data.id }
            - call: "POST /api/processing-facilities/${lax_id}/service-standard-rules"
              payload: { dest_facility_id: "${jfk_id}", mail_class: "PRIORITY", service_days: 2, non_contiguous_extra_days: 2, effective_from: "2026-01-01", expected_facility_version: "${lax_v}" }
              as: ServiceStandardsAdmin
          trigger:
            - call: "POST /api/service-standard-queries"
              payload: { origin_facility_id: "${lax_id}", dest_facility_id: "${jfk_id}", mail_class: "PRIORITY", acceptance_date: "2026-09-04", acceptance_time_local: "17:01" }
              as: ServiceStandardsAdmin
              captures: { q_id: $.data.id }
            - call: "POST /api/service-standard-queries"
              payload: { origin_facility_id: "${lax_id}", dest_facility_id: "${jfk_id}", mail_class: "PRIORITY", acceptance_date: "2026-09-04", acceptance_time_local: "16:59" }
              as: ServiceStandardsAdmin
              captures: { q2_id: $.data.id }
          assert:
            - "after-cutoff query: acceptance rolls to Saturday 2026-09-05; 2 service days land Sat + Mon → committed_delivery_date == \"2026-09-07\""
            - "before-cutoff control query: acceptance stays Friday 2026-09-04; committed_delivery_date == \"2026-09-05\""
            - "both queries report variant_used == CONTIGUOUS and committed_service_days == 2"

      - name: priority_sunday_counts_contiguous_but_never_non_contiguous
        claim_type: Variant Selection
        grounds:
          - calculations.service_standard_delivery_date
        distinguishing_aspect: "PRIORITY in the CONTIGUOUS variant counts Sunday as a service day; the identical rule with a NON_CONTIGUOUS destination never counts Sunday — the mail-class exception is variant-conditional, not global."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. LAX→JFK (both CONTIGUOUS) PRIORITY 1-day rule, and LAX→HNL (NON_CONTIGUOUS) PRIORITY 1-day rule with extra 0."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/processing-facilities"
              payload: { facility_code: "LAX", facility_type: "P_AND_DC", region_class: "CONTIGUOUS", dispatch_cutoff_local: "17:00", operating_days: ["MON","TUE","WED","THU","FRI","SAT"] }
              as: ServiceStandardsAdmin
