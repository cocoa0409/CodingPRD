      - name: relief_waterfall_credits_business_day_overlap_in_creation_order
        claim_type: waterfall_allocation
        grounds:
          - calculations.relief_days_credited
          - validations[priority=80, ERR_RELIEF_EXCEEDS_REQUEST]
        distinguishing_aspect: "Each approved exception contributes min(granted_relief_days, business-day overlap) - so a 5-day grant spanning only Monday and Tuesday contributes 2, weekend dates inside the grant contribute nothing - and the running total is finally clamped to the week's required_days, so a second full-week grant cannot push relief past 5."
