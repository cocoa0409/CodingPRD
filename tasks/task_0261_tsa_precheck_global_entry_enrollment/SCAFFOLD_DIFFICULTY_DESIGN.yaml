# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# TSA PreCheck / Global Entry Enrollment — Expert
# 9 rule_ids x >=2 instances = 18 instances total.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every ${var} is bound by an earlier captures; every payload field is a literal
# unless it can only come from a prior response.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fee_due_new_vs_renewal_on_application
        grounds:
          - calculations.compute_fee_due
          - entities.Application.fields.fee_due_cents
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: "Same Program (base 7800) yields fee_due_cents=7800 for a new Application but 6240 for a renewal Application (0.80*base, half-up) — dual-variant logic on the Application entity domain."
        test_recipe:
          setup:
            - "Clock at 2026-06-09T12:00:00Z."
            - "PRECHECK Program with base_fee_cents=7800, validity_years=5."
            - "One applicant with a NEW application submitted (fee_due_cents=7800)."
            - "Same applicant with a prior APPROVED PRECHECK application + ACTIVE KTN expiring 2031-06-09; a renewal application referencing it, submitted within renewal window (fee_due_cents=6240)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Ada New", date_of_birth: "1990-01-01", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_new_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_new_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_new_id}"
              captures: { app_new_id: $.data.id }
            - call: "POST /applications/${app_new_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_new_id}"
              captures: { app_new_fee_due: $.data.fee_due_cents }
          trigger:
            - call: "GET /applications/${app_new_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { observed_new_fee: $.data.fee_due_cents }
          assert:
            - "Application.${app_new_id}.fee_due_cents == 7800"

      - name: risk_score_raw_vs_post_redress_on_background_check
        grounds:
          - calculations.compute_risk_score
          - calculations.compute_redress_offset
          - entities.BackgroundCheck.fields.risk_score
          - entities.BackgroundCheck.fields.redress_offset_applied
        distinguishing_aspect: "Identical BackgroundCheck (criminal_hits=1, watchlist_hits=1) scores risk_score=75 at creation, but a CLEARED RedressCase subtracts 60, making effective=15 — dual-variant logic on the BackgroundCheck entity domain, distinct from the fee calc."
        test_recipe:
          setup:
            - "Clock at 2026-06-09T12:00:00Z."
            - "PRECHECK Program (deny_threshold=70, risk_threshold=40, redress_min_score=30)."
            - "Application in VETTING with BackgroundCheck risk_score=75 (criminal 1 + watchlist 1)."
            - "A CLEARED RedressCase (match_strength_score=20 <= 30) applying offset 60 -> redress_offset_applied=60."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Ben Risk", date_of_birth: "1985-03-03", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 1, watchlist_hits: 1, prior_revocations: 0 }
              as: VettingOfficer
              captures: { bc_id: $.data.id, bc_risk: $.data.risk_score }
            - call: "POST /redress-cases"
              payload: { application_id: "${app_id}", trip_number: "TRIP-1", match_strength_score: 20 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { redress_id: $.data.id }
            - call: "POST /redress-cases/${redress_id}/resolve"
              payload: {}
              as: AppealsOfficer
              captures: { redress_resolution: $.data.resolution, redress_offset: $.data.risk_offset }
          trigger:
            - call: "GET /background-checks/${bc_id}"
              payload: {}
              as: VettingOfficer
              captures: { final_risk: $.data.risk_score, final_offset: $.data.redress_offset_applied }
          assert:
            - "BackgroundCheck.${bc_id}.risk_score == 75"
            - "BackgroundCheck.${bc_id}.redress_offset_applied == 60"
            - "RedressCase.${redress_id}.risk_offset == 60"
            - "RedressCase.${redress_id}.resolution == CLEARED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: risk_score_three_input_weighted_with_clamp
        grounds:
          - calculations.compute_risk_score
          - entities.BackgroundCheck.fields.risk_score
          - state_machines.BackgroundCheck.PENDING_to_ADVERSE
        distinguishing_aspect: "Mode (a): risk_score = min(100, max(0, 15*criminal + 60*watchlist + 25*revocation)) is a 3-input non-linear formula whose raw 120 clamps to 100 (watchlist_hits=2)."
        test_recipe:
          setup:
            - "Clock at 2026-06-09T12:00:00Z; PRECHECK Program (deny_threshold=70)."
            - "Application in VETTING; BackgroundCheck created with criminal_hits=0, watchlist_hits=2, prior_revocations=0 -> raw 120 clamps to 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Cara Clamp", date_of_birth: "1980-02-02", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
          trigger:
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 0, watchlist_hits: 2, prior_revocations: 0 }
              as: VettingOfficer
              captures: { bc_id: $.data.id, bc_risk: $.data.risk_score }
          assert:
            - "BackgroundCheck.${bc_id}.risk_score == 100"

      - name: effective_risk_clamp_before_offset_order_pinned
        grounds:
          - calculations.compute_risk_score
          - calculations.compute_redress_offset
          - entities.BackgroundCheck.fields.redress_offset_applied
          - state_machines.BackgroundCheck.PENDING_to_CLEARED
        distinguishing_aspect: "Mode (c): evaluation order is pinned — clamp raw to [0,100] FIRST (120->100), THEN subtract redress offset 60 to get effective 40, which is <= risk_threshold 40 and CLEARS; subtracting before the clamp (120-60=60) would NOT clear, so the pinned order is observable."
        test_recipe:
          setup:
            - "Clock 2026-06-09T12:00:00Z; PRECHECK Program (risk_threshold=40, deny_threshold=70, redress_min_score=30)."
            - "BackgroundCheck with criminal_hits=4, watchlist_hits=1 -> raw 15*4 + 60*1 = 120, clamps to 100."
            - "RedressCase CLEARED (match_strength 20 <= 30) -> offset = 60*watchlist_hits = 60."
            - "Effective = clamp(120)=100 THEN 100-60 = 40 <= risk_threshold 40 -> adjudicate CLEARS. (Subtract-before-clamp would give 120-60=60 -> NOT cleared.)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Dan Order", date_of_birth: "1979-04-04", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 4, watchlist_hits: 1, prior_revocations: 0 }
              as: VettingOfficer
              captures: { bc_id: $.data.id, bc_risk: $.data.risk_score }
            - call: "POST /redress-cases"
              payload: { application_id: "${app_id}", trip_number: "TRIP-2", match_strength_score: 20 }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { redress_id: $.data.id }
            - call: "POST /redress-cases/${redress_id}/resolve"
              payload: {}
              as: AppealsOfficer
              captures: { redress_offset: $.data.risk_offset }
          trigger:
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
              as: VettingOfficer
              captures: { bc_status_after: $.data.status }
          assert:
            - "BackgroundCheck.${bc_id}.risk_score == 100"
            - "BackgroundCheck.${bc_id}.redress_offset_applied == 60"
            - "BackgroundCheck.${bc_id}.status == CLEARED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_denial_appeal_revetting_cycle
        grounds:
          - state_machines.Application.VETTING_to_DENIED
          - state_machines.Application.DENIED_to_APPEAL_PENDING
          - state_machines.Application.APPEAL_PENDING_to_VETTING
        distinguishing_aspect: "Application is cyclic: VETTING -> DENIED -> APPEAL_PENDING -> VETTING re-enters the vetting state already visited; not a forward-only pipeline (distinct entity from the Appointment fork)."
        test_recipe:
          setup:
            - "Clock 2026-06-09T12:00:00Z; PRECHECK Program (deny_threshold=70)."
            - "Application DENIED via ADVERSE adjudication (watchlist 2 -> 100)."
            - "Appeal filed (APPEAL_PENDING), then decided OVERTURNED by a different officer -> Application back to VETTING, BackgroundCheck reset PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Eve Cycle", date_of_birth: "1991-05-05", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 0, watchlist_hits: 2, prior_revocations: 0 }
              as: VettingOfficer
              as_user_id: "vetting-officer-1"
              captures: { bc_id: $.data.id }
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
              as: VettingOfficer
              as_user_id: "vetting-officer-1"
            - call: "POST /applications/${app_id}/appeals"
              payload: { filed_reason: "mis-identification" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "OVERTURNED" }
              as: AppealsOfficer
              as_user_id: "appeals-officer-9"
              captures: { appeal_status: $.data.status, appeal_outcome: $.data.outcome }
          assert:
            - "Appeal.${appeal_id}.status == DECIDED"
            - "Appeal.${appeal_id}.outcome == OVERTURNED"
            - "Application.${app_id}.status == VETTING"
            - "BackgroundCheck.${bc_id}.status == PENDING"

      - name: appointment_confirmed_branches_to_three_terminals
        grounds:
          - state_machines.Appointment.CONFIRMED_to_COMPLETED
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - state_machines.Appointment.CONFIRMED_to_NO_SHOW
        distinguishing_aspect: "Appointment forks from CONFIRMED into three terminal branches (COMPLETED / CANCELLED / NO_SHOW) with divergent side-effects (complete advances the application; cancel/no-show free the slot) — branching on a different entity than the Application cycle."
        test_recipe:
          setup:
            - "Clock 2026-06-09T12:00:00Z; PRECHECK Program; OPEN center lane_count=1 capacity=10."
            - "Application CLEARED + slot booked -> Appointment CONFIRMED; application INTERVIEW_SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /enrollment-centers"
              payload: { program_code: "PRECHECK", name: "Center A", daily_interview_capacity: 10, buffer_minutes: 0, lane_count: 1 }
              as: SchedulingAdmin
              captures: { center_id: $.data.id }
            - call: "POST /appointment-slots"
              payload: { center_id: "${center_id}", lane_index: 0, starts_at: "2026-06-20T09:00:00Z", ends_at: "2026-06-20T09:30:00Z" }
              as: SchedulingAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Finn Fork", date_of_birth: "1992-06-06", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 1, watchlist_hits: 0, prior_revocations: 0 }
              as: VettingOfficer
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
              as: VettingOfficer
            - call: "GET /applications/${app_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { app_v: $.data.version }
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", slot_id: "${slot_id}", expected_application_version: "${app_v}" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/cancel"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appt_status: $.data.status }
          assert:
            - "Appointment.${appt_id}.status == CANCELLED"
            - "AppointmentSlot.${slot_id}.status == AVAILABLE"
            - "Application.${app_id}.status == VETTING"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: overturn_appeal_cascade_app_then_background_check
        grounds:
          - state_machines.Application.APPEAL_PENDING_to_VETTING
          - state_machines.Application.VETTING_to_DENIED
          - state_machines.Application.DENIED_to_APPEAL_PENDING
          - entities.BackgroundCheck.fields.status
        distinguishing_aspect: "Depth-3 chain from one trigger: decide(OVERTURNED) mutates Appeal->DECIDED, which mutates Application APPEAL_PENDING->VETTING, which in turn resets BackgroundCheck ADVERSE->PENDING and clears Application.adverse_reason — each link caused by the prior, not by the decide call directly."
        test_recipe:
          setup:
            - "Clock 2026-06-09T12:00:00Z; PRECHECK Program (deny_threshold=70)."
            - "Application DENIED (ADVERSE adjudication watchlist 2), Appeal OPEN (APPEAL_PENDING), adverse_reason set."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /applicants"
              payload: { full_name: "Gus Cascade", date_of_birth: "1988-07-07", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 0, watchlist_hits: 2, prior_revocations: 0 }
              as: VettingOfficer
              as_user_id: "vetting-officer-1"
              captures: { bc_id: $.data.id }
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
              as: VettingOfficer
              as_user_id: "vetting-officer-1"
            - call: "POST /applications/${app_id}/appeals"
              payload: { filed_reason: "challenge" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { outcome: "OVERTURNED" }
              as: AppealsOfficer
              as_user_id: "appeals-officer-9"
          assert:
            - "Appeal.${appeal_id}.status == DECIDED"
            - "Application.${app_id}.status == VETTING"
            - "Application.${app_id}.adverse_reason == null"
            - "BackgroundCheck.${bc_id}.status == PENDING"

      - name: withdraw_cascade_appointment_then_slot
        grounds:
          - state_machines.Application.DRAFT_to_WITHDRAWN
          - state_machines.Appointment.CONFIRMED_to_CANCELLED
          - state_machines.AppointmentSlot.BOOKED_to_AVAILABLE
        distinguishing_aspect: "Depth-2 chain from a different trigger (withdraw): withdraw mutates Application->WITHDRAWN, which cancels the CONFIRMED Appointment, whose cancellation in turn frees the BOOKED slot back to AVAILABLE."
        test_recipe:
          setup:
            - "Clock 2026-06-09T12:00:00Z; PRECHECK Program; OPEN center capacity=10 lane 1."
            - "Application CLEARED, slot booked -> Appointment CONFIRMED, slot BOOKED, application INTERVIEW_SCHEDULED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T12:00:00Z" }
              as: SchedulingAdmin
            - call: "POST /programs"
              payload: { code: "PRECHECK", name: "TSA PreCheck", base_fee_cents: 7800, validity_years: 5, vetting_risk_threshold: 40, vetting_deny_threshold: 70, redress_min_score: 30, renewal_window_days: 180 }
              as: SchedulingAdmin
            - call: "POST /enrollment-centers"
              payload: { program_code: "PRECHECK", name: "Center B", daily_interview_capacity: 10, buffer_minutes: 0, lane_count: 1 }
              as: SchedulingAdmin
              captures: { center_id: $.data.id }
            - call: "POST /appointment-slots"
              payload: { center_id: "${center_id}", lane_index: 0, starts_at: "2026-06-21T09:00:00Z", ends_at: "2026-06-21T09:30:00Z" }
              as: SchedulingAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Hana Drop", date_of_birth: "1993-08-08", citizenship: "US_CITIZEN" }
              as: Applicant
              captures: { applicant_id: $.data.id }
            - call: "POST /applications"
              payload: { applicant_id: "${applicant_id}", program_code: "PRECHECK" }
              as: Applicant
              as_user_id: "${applicant_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/pay"
              payload: { amount_cents: 7800 }
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${applicant_id}"
            - call: "POST /applications/${app_id}/background-checks"
              payload: { criminal_hits: 1, watchlist_hits: 0, prior_revocations: 0 }
              as: VettingOfficer
            - call: "POST /applications/${app_id}/adjudicate"
              payload: {}
              as: VettingOfficer
            - call: "GET /applications/${app_id}"
              payload: {}
              as: SchedulingAdmin
              captures: { app_v: $.data.version }
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", slot_id: "${slot_id}", expected_application_version: "${app_v}" }
              as: Applicant
